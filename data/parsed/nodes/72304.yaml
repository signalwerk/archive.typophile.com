      <p>Robert, I'm afraid your OTL 'dubl' idea won't work for a whole bunch of reasons. The notion of having half-scale glyph variants and them doubling the point size of the text setting is appears to make sense -- as you discovered when you implemented it manually in older fonts in PageMaker --, but it won't work in terms of OTL GSUB.</p>
      <p>One problem is that OTL is applied to discrete glyph runs, and changes in point size are one of the criteria by which glyph runs are split. So as soon as you double the point size to scale up one of your half-scale variants you have lost all possibility of OTL interaction between this glyph and adjacent glyphs at the smaller point size. Basically, you'll be splitting individual words into multiple glyph runs.</p>
      <p>Another problem is that while this may appear to work in page layout applications with absolute leading values, any application applying linespacing as a multiple of either text point size or OS/2 or hhea table vertical metrics will produce different linespacing for any line involving the double-size glyphs. MS Word documents, for example, are going to look a terrible mess with different size glyphs interspersed amid the text. Sure, you might not use such applications, but a millions of people do and you're not going to get an OTL feature approved and supported that causes that kind of problem and potential support costs for application makers.</p>
      <p>The good news is that if you set your OS/2 vertical metrics values correctly, you don't actually need this proposed OTL feature. Clipping in TTF/OTF fonts is governed by the OS/2 table WinAscent and WinDescent values. So long as these are not smaller than your tallest glyphs, you should not experience any clipping. Most Windows applications also use these values to determine automatic line height, which means that fonts with very tall extenders will tend to have very wide linespacing in such applications, but at least they won't be clipping.</p>
      <p>[In theory, you can control automatic linespacing independently of no-clipping zones, using the OS/2 Typo metrics and the fsSelection bit 7 setting that tells an application to use these metrics instead of the Win metrics for linespacing calculation, but in practice there isn't a lot of support for this. It is still worth doing, however, if you have a font with very large Win metrics, because the latter will otherwise also be used to scale the font sample in the Word font menu, resulting in visually very small menu entry.]</p>
