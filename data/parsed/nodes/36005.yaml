      <p>We’re working with the AGDA to set up several screenings in Australian cities, these will happen in October and November.</p>
      <p>And there’s plenty of information about Helvetica’s development, some of which is featured in the film, but a lot more of which had to be left out if the film due to editing constraints. And Alfred Hoffmann of Haas is compiling a new book with Lars Müller about the Helvetica story, utilizing all the archival material Hoffmann has. No word on when that book will be published, but I’m assuming 2008.</p>
      <p><a href="http://www.lars-mueller-publishers.com/e/publishers/programm.php" title="http://www.lars-mueller-publishers.com/e/publishers/programm.php">http://www.lars-mueller-publishers.com/e/publishers/programm.php</a></p>
