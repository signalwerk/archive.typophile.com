    html: <p>It is my understanding that not a lot is known about the development of Helvetica’s design other than what Gary tracked down for the film. Until the film came out there was even still some debate as to whether or not or not Helvetica was based on Akzidenz-Grotesk (it was). Also in the film, Matthew Carter—who knew Miedinger—states that not much is really known about what was going on while Helvetica was being designed. It might be a good idea for you to write about a typeface that has a better-known history than Helvetica.</p>
