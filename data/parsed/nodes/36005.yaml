      <p>Talk to Robin Nicholas or Patricia Saunders about Arial, perhaps.<br>
      Arial, celebrating its 25th anniversary, is every bit as original a design as Helvetica, and more up-to-date, so perhaps more relevant to the 21st century.<br>
      Unless your course is design history, why not investigate a contemporary typeface?</p>
