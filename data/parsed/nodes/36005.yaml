    <p>Hi all, </p>
    <p>I am a new comer to this forum... I have noticed your many blogs about Helvetica and would love some help with my latest uni assignment please...</p>
    <p>I am working on a research paper about Max Miedinger (life, influences etc) and the design of Helvetica.</p>
    <p>Does anyone know of any good reference links they could direct me to?</p>
    <p>Also do you know when the movie may be coming down under to Sydney?</p>
    <p>Many thanks,</p>
    <p>Bec</p>
