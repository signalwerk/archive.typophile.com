    <p>I'm just starting freelance. For my whole design career I worked in an environment where I had three type families to work with, and that's it, so I'm ignorant (though wanting to learn) to the legalities of using type. </p>
    <p>If I design someone's resume (and get paid for it), I would need commercial licensing for any fonts I use, correct? If I don't get paid, that would fall under personal use?</p>
    <p>Right now I'm volunteer designing for a non-profit. They have no style guide, they have a pretty unattractive logo (that can't be changed), I'm starting from scratch trying to give them well designed publications from here on out. They use Arial and AvantGarde in the logo. Am I allowed to use those fonts that the company has to create the style guide and other publications? </p>
    <p>One more topic... If I purchase fonts with commercial licenses, am I then allowed to use them for any client on any project? And if the font is in a logo can the client then use their logo, that I created, however they want? </p>
    <p>Thanks, I know it's a lot of questions.</p>
