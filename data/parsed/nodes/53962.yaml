    html: |-
      <p>In general commercial fonts, and system fonts, as well as legitimate open source fonts can all be used in producing work that you get paid to produce, and that your clients can print, publish, and generally commercially exploit. Many licenses don't even mention this because, er, that's what fonts are for. Occasionally you might find a commercial font license that includes some kind of exclusion - but these are rare. General advice is read the license (AKA the EULA.) </p>
      <p>Where things do become somewhat murky is the free fonts you find floating around on the web, which often come with no written license, or one that makes little sense. So in short paying your $20 for a font doesn't guarantee a well written EULA but it certainly increases the odds.</p>
