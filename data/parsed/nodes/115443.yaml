    html: |-
      <p>Looks like Old Style 7, designed by Miller &amp; Richard in 1902.   Digital revival<br>
      <a href="http://www.identifont.com/find?font=old+style+7&amp;q=Go" title="http://www.identifont.com/find?font=old+style+7&amp;q=Go">http://www.identifont.com/find?font=old+style+7&amp;q=Go</a> Note that numbers were not necessarily considered parts of a font and printers would substitute numbers as they saw fit.<br>
      Another possibility is Century Old Style, designed by Morris Fuller Benton and originally published by ATF in 1909.    Digital revival <a href="http://www.identifont.com/show?HK" title="http://www.identifont.com/show?HK">http://www.identifont.com/show?HK</a><br>
      R might be closer in Old Style 7. But compare the lowercase. It seems to like somewhere between the two typefaces.<br>
      The original version of Old Style was cut by Alexander Phemister of Miller &amp; Richard in 1860 and was soon coped by other foundries. [Source: Jaspert's _Type Encyclopedia [1970]_ Indeed, this could be a variation cut by a Swedish Foundry.<br>
      Don</p>
