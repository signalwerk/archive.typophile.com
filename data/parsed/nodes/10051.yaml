    html: <p>Luke, you can order the book directly from Leslie Cabarga. He shipped it to me and it took a little to make its way to Italy. <br>If not for other reasons, LFF (Learn Fontlab Fast) has the merit of being the first compact book giving the basics in a clear way (i.e. unlike FL own manual), although it will take a lot of trial and error to determine a good naming strategry for Opentype Fonts supposed to work smoothly in cross-platform environments. <br> <br>Personally, I still keep generating bad OTF files from typefaces which I started originally to draw in FontStudio or Fontographer and then brought into FL, and I have not yet solved this basic problem. <br> <br>Since you seem to be interested mostly in the drawing environment, let me know which difficulties bugs you most, and I'll try to tell you have I became familiar with it. <br>Keep in mind that, before FL, I came from drawing faces in Fontstudio and I never used Fontographer if not for final files.</p>
    html_clean: <p>Luke, you can order the book directly from Leslie Cabarga. He shipped it to me and it took a little to make its way to Italy. <br>If not for other reasons, LFF (Learn Fontlab Fast) has the merit of being the first compact book giving the basics in a clear way (i.e. unlike FL own manual), although it will take a lot of trial and error to determine a good naming strategry for Opentype Fonts supposed to work smoothly in cross-platform environments. <br> <br>Personally, I still keep generating bad OTF files from typefaces which I started originally to draw in FontStudio or Fontographer and then brought into FL, and I have not yet solved this basic problem. <br> <br>Since you seem to be interested mostly in the drawing environment, let me know which difficulties bugs you most, and I'll try to tell you have I became familiar with it. <br>Keep in mind that, before FL, I came from drawing faces in Fontstudio and I never used Fontographer if not for final files.</p>
