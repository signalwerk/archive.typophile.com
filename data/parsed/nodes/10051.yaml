  - id: 63941
    user: 5605
    date: 2005-04-01T01:49:00
    date_raw: 1.Apr.2005 1.49am
    votes: null
    html: <p>They're reasonably in-depth; Leslie and Adam Twardoch give a good, concise explanation of encodings, some good heuristics on how to build up Western fonts, and then tell you to study some existing fonts to see how they do it (which happens to be the way I work anyway, so that works out well for me). <br> <br>As far as 'works flawlessly', I'm not sure there's anybody who knows how to do that the first time. Cabarga and Twardoch do scatter a lot of tips for how to get your fonts to work properly throughout the book, and point out a lot of common pitfalls. Fontlab's still going to be a really complicated program, no matter what, but it seems to me (as someone who's still in the evaluation phase) it has 95% of what you need to make your first few families inside FontLab.</p>
