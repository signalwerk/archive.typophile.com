      <p>Tim</p>
      <p>The fellow who designed Aldous Vertical (actually Huxley Vertical) was Walter Huxley. You probably shouldn't use it since you have a prejudice against smokers. Which would likely also apply to the typeface designs of most type designers (including Huxley) prior to the last decade or so.</p>
      <p>Good luck</p>
      <p>Gerald</p>
