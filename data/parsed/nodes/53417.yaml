  html: |-
    <p>Does anyone know the name of typeface used for the title on the covers of the Dune books by Frank Herbert published during the 1970's and 1980's (Berkley Book editions before they merged with Penguin)? </p>
    <p>The typographer may have been Jeremiah B. Lighter, but not 100% certain. I having trouble posting a pic of the cover, but hoping maybe somebody may know off-hand.</p>
    <p>Thanks in advance</p>
    <p>Mike</p>
