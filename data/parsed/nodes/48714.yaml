    html: <p>By "belong to the same family" do you mean like ITC Garamond, ITC Garamond italic,etc. My understanding is that fonts that are generated as a suite will come up as styles in a menu unless the naming convention is corrupt. If you simply have various individual versions of a font, even if they are of the same "cut" or foundry, this will not work unless you use something like FontLab to regenerate them as such and that would likely be a license violation.</p>
