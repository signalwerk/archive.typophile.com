    html: |-
      <p>Sandy,<br>
      existing Windows GDI API has a limitation of only supporting up to four basic faces (regular, bold, italic, bold italic) per font family in its font selection logic. In addition, many applications allow one to apply additional algorithmic bold and italic simulation to a native font face. These factors contribute to what you are seeeing.</p>
      <p>This is something we are working on improving. For example, Windows Presentation Foundation (WPF), a relatively new client programming platform built on top of .Net Framework, supports virtually unlimited number of font weight/width/slope combinations in a single font family, which allows an application built on top of WPF to present a single font family instead of four different ones in your example. Here is a relevant thread discussing this issue: <a href="http://typophile.com/node/33288">http://typophile.com/node/33288</a></p>
      <p>Best regards,<br>
      Mikhail Leonov<br>
      Microsoft</p>
