    html: |-
      <p>Linotype has the habit of producing same-named fonts in two variants: "family-linked" and "single-linked". The single-linked fonts appear as separate families with just one style, while the family-linked fonts appear as multiple styles grouped under one family. The confusing thing is that the filenames of the fonts are the same so you need to be careful which fonts you actually install. </p>
      <p>I don't know if any other vendor is doing this, but still, family grouping conventions definitely differ between font vendors.</p>
