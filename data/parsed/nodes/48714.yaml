      <p>Slightly off-topic, but along the same line...</p>
      <p>I'm working on an otf font family that contains Regular, Demi, Bold, ExtraBold and Black as well as their respective italics. Regular Italic, Bold and Bold Italic have their respective style flags set and those three plus Regular have their respective style names assigned.</p>
      <p>Demi, ExtraBold and Black are grouped into "mini" families consisting of their regular and italic faces.</p>
      <p>I have no problems with the fonts on a Mac. On a PC though, the font selector displays what to my mind is bizarre behaviour. (I freely admit that I'm an illegal alient on PCs. I have almost no idea of PC customs and practices...and should be deported back to Mac.)</p>
      <p>In Notepad or Word, the font selector displays:<br>
      Afont (regular, italic, bold, bold italic)<br>
      Afont Demi (regular, italic, bold, bold italic)<br>
      Afont ExtraBold (bold, bold italic)<br>
      Afont Black (bold, bold italic)</p>
      <p>I have no idea why the font selector displays 4 available styles for Demi, when there are only 2. (Selecting regular or bold seems to select the regular Demi face / selecting italic or bold italic seems to select the italic face.)</p>
      <p>I expected the ExtraBold and Black to link to regular and italic styles... Does the font selector display the bold and bold italic styles because Windows actually uses the designated weight, rather than the style name?</p>
      <p>Have I missed a setting that links font styles, or is style linking all done through the font family/subfamily (style) names?</p>
      <p>I've read through FL's manual so many times my eyes are bleeding, but I still have probably missed something (it's hard to see through all that red). I've been scratching my head for so long and hard that I'm starting to look like, er, nick. If someone can point out what I've missed or point me to a manual page number, I'd sure appreciate it.</p>
