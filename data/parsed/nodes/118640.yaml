    <p>I already know that the Typophile logo is set in La Portenia, designed by one of my favorite foundries, Sudtipos:<br>
    <a href="http://www.myfonts.com/fonts/sudtipos/la-portenia/" title="http://www.myfonts.com/fonts/sudtipos/la-portenia/">http://www.myfonts.com/fonts/sudtipos/la-portenia/</a></p>
    <p>My questions are:<br>
    1) Who customized it (t, i, and l)?<br>
    2) What led to the tight crop?<br>
    3) Isn't it time to let go of the "temp" violator and to carry the branding over to the Twitter page?</p>
    <p>Moderators (or others in the know), thanks for your consideration....</p>
