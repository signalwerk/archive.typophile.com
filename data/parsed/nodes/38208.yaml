      <p>Hello,<br>
      Arabic is written and read right to left. There are 2 types of Arabic calligraphy, one called "Naskh" which is individual characters, and one called "Requa" which is script calligraphy. However, all Arabic authentic lettering should have supporting shapes either on top or underneath in order to be read the right way. These shapes are like dashes, circles and some other shapes. Those shapes stand for the vocal grammatical pronunciation. Its quite a complex calligraphy especially the "Requa", and thats the one used in the Holy Quoran Book. </p>
      <p>I hope that was of help.</p>
      <p><a href="http://vysionous.deviantart.com" title="http://vysionous.deviantart.com">http://vysionous.deviantart.com</a></p>
