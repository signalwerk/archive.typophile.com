      <p>Carlos,</p>
      <p>Yes, the Arabic script is written (and read) Right to Left.</p>
      <p>Many of the glyphs within an Arabic font will link (overlap) accordingly.<br>
      However, it is up to other software (E.g. - word processors) to allow the<br>
      user to compose and display the glyphs in the Right to Left sequence.</p>
