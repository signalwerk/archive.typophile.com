      <p>Are you looking for technical information on how to make an Arabic font?</p>
      <p>Despite its title, <em>Arabic Typography: A Comprehensive Sourcebook</em> is far from comprehensive, much of its technical discussion is very weak and actually derived from examples of Latin type, and there are inaccuracies and omissions. There isn't a single good source of information of Arabic typography. For technical information on Arabic OpenType fonts, this is the best place to start:</p>
      <p><a href="http://www.microsoft.com/typography/OpenType%20Dev/arabic/intro.mspx" title="http://www.microsoft.com/typography/OpenType%20Dev/arabic/intro.mspx">http://www.microsoft.com/typography/OpenType%20Dev/arabic/intro.mspx</a></p>
      <p>If you are interested in the Arabic script in general, as opposed to the technical stuff, there is a massive amount of material written about the scribal heritage (I don't use the term calligraphy, because that refers to a very specific kind of art-text, and misses the point that most of what scribes historically produced is everyday text.</p>
      <p><em>There are 2 types of Arabic calligraphy, one called “Naskh” which is individual characters, and one called “Requa” which is script calligraphy ... Its quite a complex calligraphy especially the “Requa”, and thats the one used in the Holy Quoran Book</em></p>
      <p>This is a misleading statement in many ways. There are many more than two styles of Arabic script. Naskh (also called Nesih) is not 'individual characters': it the most common text hand used in formal manuscripts, including most Qur'ans (in Persian influenced areas, Qur'ans are also written in the nasta'liq style).</p>
      <p>Mohamed Zakariya, the leading Islamic calligrapher in the USA, is developing what promises to be an excellent website devoted to the Arabic script. Unfortunately, his page on different styles is not yet illustrated:</p>
      <p><a href="http://www.zakariya.net/history/examples.html" title="http://www.zakariya.net/history/examples.html">http://www.zakariya.net/history/examples.html</a></p>
