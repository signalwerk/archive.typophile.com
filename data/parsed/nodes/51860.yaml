    html: |-
      <p>The lowercase t looks like it's floating when paired with a non-overshooting glyph. Try to overshoot it, but not too much. Also, your both uc and lc s look like they're from another font. Maybe you should add the 'stiffness' that other glyphs have (look at the counter of b, for example).</p>
      <p>Best of luck. It looks really nice :)</p>
