    html: <p>The signature shape here is obviously how the round bowls switch to straight strokes. It's jarring to my eye now, but mostly because unless I look carefully it just comes off as a malformed curve. You may want to consider actually <em>increasing</em> the abruptness of that break (thinning the straight parts? increasing the acuteness of the angle of break?) to make it more assertive, so that the reader's eye gives up on interpreting it as a single rounded stroke. Just an idea...</p>
