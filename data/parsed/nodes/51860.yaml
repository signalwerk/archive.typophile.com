      <p>That looks quite nice. A few things:</p>
      <p>I saw the differences in weight too. But looking at the PDF, I think it was probably the jpeg that did that.</p>
      <p>I also think the overshoot on round characters might be too large. The baseline seems uneven.</p>
      <p>Places where strokes join the stem (like on the bottom of the 'a' and 'b' etc.) could use a bit more room, to counter the appearance of little black blobs.</p>
