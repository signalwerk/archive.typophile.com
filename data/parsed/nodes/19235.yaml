      <p>Mike,</p>
      <p>I think you’re off to a good start. With some refining these spreads could be very effective. Geoff’s comments above are dead on. Here are some more design notes to chew on.</p>
      <p>With editorial design it’s so important to fully understand your audience and your content. Right now, I don’t see how these layouts would appeal to a reader between the ages of 20-30. The type choices/treatments feel very conservative and a little dated, and the images don’t seem to match the tone of the articles. Your content is very interesting and relevant, and deserves a visual treatment that embodies those characteristics.</p>
      <p>Overall, I’d say the spreads of the New Ideas story suffers from not enough fun with the type/design. This is a piece about innovation and challenging the status quo. You can explore that with your layout, which is currently extremely rigid and restrained.</p>
      <p>On the Iraq story, there is no differentiation between your lead-in paragraph and your body copy. A variation in weight, size or color could help enliven the opening page of the article which needs to draw readers into it. Also on this page, the photo completely misrepresents the story. This is a modern conflict, and the focus is on the soldier’s family who is stateside. Don’t belie your title.</p>
      <p>Throughout all the spreads, there’s a heavy use of white space, which doesn’t deliver the push-and-pull I think you’re trying to acheive, save for the 5th spread which I think works quite nicely (but watch the pargraph jumps, most readers will read down the page at the break, rather than to the right).</p>
      <p>Finally, the page folios are large and ubiquitous: a nice treatment, but is it that important that readers are constantly reminded of what page of the spring 2006 issue of Hub they are reading?</p>
      <p>Hope that wasn’t too painful. Good luck with your assignment!</p>
