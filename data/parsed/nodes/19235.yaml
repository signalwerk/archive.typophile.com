    <p>hi everyone.</p>
    <p>could you please crit me on my composition, type faces/typography, article flow, readability, etc of these magazine spreads?</p>
    <p>task: create magazine spreads for two given articles. first article is on new ideas that came about in 2005. the second article is about a father’s loss of his son in the iraq war.</p>
    <p>demographic: boston readers (age 20-30), low to mid income, college education.</p>
    <p>concept: i want the magazine to have a fresh look and feel to it, plenty of friendly white space, and to look cutting edge and still appeal to a little older crowd.</p>
    <p>crit me hard, i’m a graphic design major!</p>
    <p>thanks<br>
    -mike</p>
    <p>edit: i can’t figure out how to attach a file. <a href="http://69.43.98.89:5889/typo/4.13.2006_layout.pdf">he’s a link to the pdf</a></p>
