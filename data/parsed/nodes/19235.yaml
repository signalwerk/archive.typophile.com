      <p>A few more typesetting items to consider,<br>
      Use the fi and fl ligatures;<br>
      Separate the quotes from the soldier in his emails, possibly italicise them, maybe use an indent on both sides;<br>
      Check that times are all shown in the same way the use of a colon seems most reasonable.<br>
      While checking for orphans watch out for single lines that go to the next column (I would aim for a minimum of three lines to either stay or go over for a paragraph that runs over two columns);<br>
      Consistent use of either spacehyphenspace or em-dash, I understand the prevailing choice for USA is the em-dash;<br>
      There is a four dotted ellipsis sitting on the last spread that doesn’t have the same indent as the paragraphs, in fact doesn’t seem to contribute in any way, (I would use a three dotted one);<br>
      The Pleistocene story ends with a grey quad, but the others don’t.</p>
      <p>I quite like the treatment for images on the earlier spreads and the way some blocks of type cut into the image area, however as has already been noted the white space is, at the moment, working against the designs.<br>
      Amerigo wouldn’t be my first choice for this kind of use, I think it tends to sparkle too much, you could consider using more than one text face maybe a sans and serif, especially for the Year in Ideas spreads, let one or two items take a lead position.<br>
      You asked for a hard crit, I hope these remarks and the ones already given are constructive as well.<br>
      Tim</p>
