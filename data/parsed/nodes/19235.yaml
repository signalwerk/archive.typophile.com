      <p>You IM’ed me for a crit and here you have it. ;^)</p>
      <p>Well, first off, I feel there is a complete lack of dynamic in the composition, there is no energy coming off the pages. The type feels like it’s floating in the middle of no where, too much white space.</p>
      <p>The problem with this I see is that you don’t really have a lot of copy. You should cut down to two spreads from three. This will challenge you design-wise as you’ll find yourself trying to fit in all that copy without it turning ugly! To me, this is what editorial design is all about.</p>
      <p>Ok, to pick a few issues I can see with the typography;</p>
      <p>- The use of type for the article headings is weak. For instance, in the second article you could make it “THE HOME FRONT” in a large-ish setting and the rest of the heading subset in smaller type. You need to grab the readers’ attention to the article.</p>
      <p>- There is inconsistent spacing between the sub-headings and the body text in the first article.</p>
      <p>- There are quite a few orphans in there; end lines consisting only a single word = ugly! Track or adjust H&amp;J to get rid of them.</p>
      <p>- As it is, the images/graphics doesn’t complement the type and vice versa. I think you need to work on the relationship between the type, white space and the images/graphics, get them to work off each other. </p>
      <p>Good luck. :^)</p>
