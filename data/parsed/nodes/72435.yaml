    html: |-
      <p>I don't see the connection myself.  The Basque lettering is instantly recognizable as such.  A bold but solemn celtic/roman style mishmash.   The 60s were all about flash and pizzazz right?  (Okay, okay, I'm not old enough to have lived through that era).  More seriously: maybe it's just a subconscious relating of the fight the system hippie movements with the independent nature of the Basque Country.</p>
      <p>Sidenote: Euskadi means Basque Country, euskara is just the language — the picture on the link geraintf posted is decidedly Spanish (language)</p>
