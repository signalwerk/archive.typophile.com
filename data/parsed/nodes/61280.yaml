      <p>Here is how I chose to handle the % sign in the two figure sets of Whitman. It may not be obvious, but the "8-height" of the OsF is smaller than that of LF (which is cap height). So, the two %s have slightly different heights as well as zero shapes.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Whitman-percents3_3917.png"></div><p></p>
      <p>&nbsp;<br>
      I think a "small cap" % would only make sense in the context of small cap figures -- i.e., lining figures at SC height. In running text with U&amp;lc and OsF, it is too small and distracting, as James noted.</p>
