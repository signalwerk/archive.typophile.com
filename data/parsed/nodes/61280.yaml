    html: |-
      <p><cite>Always space before percent-sign in Norwegian, Frode. I recommend thin space.</cite></p>
      <p>Entering the discussion late, and maybe off-topic. Sigh. The question is, are there any circumstances when you would not thin-space the percentage sign? If not, the extra space should be in the (left) sidebearing. Of course, that might screw up people who had learned to use always use a thinspace. Alternatively, you could have a kern -- a class kern -- which would properly space the percent sign when no space was used, but would not be applied when any sort of space intervened between [0-9] and percent.</p>
      <p>I feel the same thinking applies to the hashmark (aka numbersign). There is often a fair bit of kerning/sidebearing adjustment needed with marks that appear with numbers. When those marks can also appear with letters, kerning is all you have. For the rest, why not adjust the sidebearing?</p>
      <p>BTW, I usually make up an oldstyle hashmark. Typically, they are too broad, and sit too high. Sometimes they seem to be drawn too broad for even the lining figures.</p>
    html_clean: |-
