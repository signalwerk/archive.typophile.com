      <p>Hans Moehring's Florida of 1932 is echoed to some degree by Robert Stark's Stark Debonair of 1975 <a href="http://e-daylight.jp/design/fonts/type/s/stark-debonair.html">http://e-daylight.jp/design/fonts/type/s/stark-debonair.html</a>. This was digitized by Micky Rossi as Retro Super Skinny <a href="http://www.subflux.com/Fonts/FontsRecre_Retro.htm">http://www.subflux.com/Fonts/FontsRecre_Retro.htm</a> and <a href="http://www.subflux.com/">http://www.subflux.com/</a><br>
      Don</p>
