      <p>Well done ! It seems indeed to be the Florida, too bad it does not exists in digital version.</p>
      <p>The <a href="https://www.myfonts.com/fonts/itc/luna/" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">ITC Luna </a> is for now the only one I found to have this crescent shaped O which was what striked me in the first place, but it has too much flair for the purpose I want.<br>
      The Kurosawa and Carisma are my two favorites right now. In my opinion, they both have this old yet modern feel to them.</p>
      <p>Thanks a ton for your help and suggestions, I will definetly dig deeper in the lists !</p>
      <p>Cheers</p>
