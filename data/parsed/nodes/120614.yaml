    html: |-
      <p>REVISED to remove excess detail.<br>
      Carisma  has similar  terminal structure to Venus but has less contrast.<br>
      Consider _O_. The rhs of the _O_ in Venus is monoline with the stroke about as thick as the top and bottom stroke of Carisma Light. The lhs stoke is almost as thick as Carisma Regular.<br>
      The  rhs curved strokes of _B_, _D_, _P_, and _R_ as well as the rhs stroke for _U_ are similarly monoline.<br>
      Note differences in  _G_, _R_,  _M_,  _J_, _W_, and _Q_ which has a tail similar to Retro Super Skinny.<br>
      I wonder which of the many other fonts suggested come as close as Clarisma or closer than Clarisma.<br>
      Don</p>
