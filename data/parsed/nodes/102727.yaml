  - id: 553556
    user: 44740
    date: 2013-05-07T18:46:00
    date_raw: 7 May 2013 — 6:46pm
    votes: null
    html: <p>I did consider the possible confusion, but consoled myself with the fact that even though it's only one letter different, it is a completely different word. There's also another font just called 'Alright' which was released before Alright Sans, so if we get too nitpicky with naming we'll run out of them a lot faster! I checked that spelling mistakes on the MyFonts search wouldn't point the wrong way. Alight Sans as a search doesn't get to mine or Okay Type's fonts, and Alright Slab doesn't find any either, so if Jackson was to make Alright Slab, there shouldn't be any problems with confusion.</p>
