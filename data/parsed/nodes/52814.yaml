    <div class="info">Submitted by <a href="/user/13181" title="View user profile.">Ivo</a> : 19.Dec.2008 7.52am </div>
      <p>The manuscripts of author Franz Kafka had such a profound impact on Finnish graphic and type designer <a href="http://www.fontshop.com/fonts/designer/julia_sysmalainen/" rel="nofollow">Julia Sysmäläinen</a> that she decided to convert his handwriting with its unusually strong calligraphic characteristics into a digital script. The philologist took on the challenge to transform in Kafka’s rather eccentric letter forms into an balanced typographic flow. This meant not only creating hundreds of ligatures – each of them consisting of two, three or even four single characters – but also integrating numerous alternate characters to avoid successions of repeating shapes, in order to lend <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_mister_k_pro/?utm_source=NewsletterDec17&amp;utm_medium=web&amp;utm_content=FFMisterK&amp;utm_term=em&amp;utm_campaign=NewFontsBPType&amp;sample_text=FF%20Mister%20K%20Pro%20by%20Julia%20Sysm%C3%A4l%C3%A4inen&amp;sample_size=32" title="Download FF Mister K" rel="nofollow">FF Mister K</a> a more authentic script feel. Furthermore handy OpenType functions were added, for example for stylistic alternatives including hatched text as well as underlining and crossing out.</p>
    <p>Eventually three completely different single fonts were developed. Besides the <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_mister_k_pro_regular/?sample_size=60" rel="nofollow">normal cut</a> there’s also <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_mister_k_crossout_pro_regular/?sample_size=60" rel="nofollow">Crossout</a>, which allows for setting extensively crossed out text and <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_mister_k_onstage_pro_regular/" rel="nofollow">Onstage</a>, which clearly looks more extravagant and wriggly. FF Mister K is the only completely new design in the newest FontFont release 47 and is now online for sampling and download. It’s available in either a <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_mister_k_ot/" rel="nofollow">Standard OpenType</a> or a <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_mister_k_pro/?utm_source=NewsletterDec17&amp;utm_medium=web&amp;utm_content=FFMisterK&amp;utm_term=em&amp;utm_campaign=NewFontsBPType&amp;sample_text=FF%20Mister%20K%20Pro%20by%20Julia%20Sysm%C3%A4l%C3%A4inen&amp;sample_size=32" title="Download FF Mister K" rel="nofollow">Pro version</a> with additional language support. FontShop.com’s advanced character set viewer reveals all the font’s 1,500 glyphs, including the hundreds of <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_mister_k_pro_regular/?sample_text=See%20ligatures%20below.&amp;sample_size=60&amp;acs_pt=36&amp;acs_ss=7" rel="nofollow">ligatures</a>, <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_mister_k_pro_regular/?sample_text=See%20alternates%20below.&amp;sample_size=60&amp;acs_pt=36&amp;acs_ss=12" rel="nofollow">stylistic alternates</a>, <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_mister_k_pro_regular/?sample_text=See%20scribbles%20below.&amp;sample_size=60&amp;acs_pt=36&amp;acs_ss=1" rel="nofollow">underlines and scribbles</a>.</p>
