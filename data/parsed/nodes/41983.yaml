  html: <p>Dozens of website report that Mac OS 10.5.2 is not compatible with Linotype FontExplorer X. When FontExplorer is running most apps won't start and the dock will freeze. So be warned!</p>
  html_clean: <p>Dozens of website report that Mac OS 10.5.2 is not compatible with Linotype FontExplorer X. When FontExplorer is running most apps won't start and the dock will freeze. So be warned!</p>
