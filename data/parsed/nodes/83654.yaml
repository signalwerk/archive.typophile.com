    <p>While working on my typeface, I've been studying many different faces and have come across one issue of which I am unsure.</p>
    <p>It seems that there is quite a discrepancy between different typefaces with regards to italicizing different characters. Mathematical symbols, for example, are slanted in some faces and left unchanged in others. The same is true of some various punctuation symbols and other assorted glyphs.</p>
    <p>This leads to my question: is there a preferred method for dealing with these characters in italics? If not, I'm curious to hear people's opinions on the matter.</p>
