      <p>Many mathematical symbols are such that when a vertical stroke is replaced with a slanted one, it starts to look like it could be a different symbol. The information of "this is definitely supposed to be a vertical line" or "this is definitely supposed to be a diagonal line" needs to be preserved for clarity. Also, variables are usually italic letters, and it takes some of the hassle out of setting equations when you don't have to worry about an ugly sloped plus sneaking in.</p>
      <p>When I think there might be some value in the italic being distinct from the roman, I skew the ends of the horizontal strokes.</p>
    html_clean: |-
