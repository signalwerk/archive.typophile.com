      <p><cite>I understand why some people leave math operators upright, especially in display faces, because nobody is ever going to use them anyway</cite></p>
      <p>I thought the point is more that when you actually typeset mathematical formulas you don't want slanted operators, you need upright ones (even though variables etc. may be italicized). Which would imply that upright ones might also be useful in a text face.<br>
      However things like the "+" can't only be used for actual math stuff but also as a typographic device, in which case you probably want it to match the angle of the italic. So basically it comes down to what you expect people to use your math operators for. And if you want to be extra generous you just give them both slanted and upright ones.</p>
