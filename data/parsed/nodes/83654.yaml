      <p>I presume the reason for excluding ® and © is to meet legal requirements.</p>
      <p>A "really old-school revival", indeed, might note that only very basic punctuation characters belonged to individual fonts, and most other special symbols were sorts. Thus, &amp; and $ might be italicized, but @, #, and % would not be. The obvious reason for not doing it that way is that so doing would be foregoing an advantage the new technology gives us for no good reason.</p>
      <p>Even when one isn't doing a typeface specifically intended for mathematics, though, italicizing |, +, =, ~, &lt;, and &gt; does present potential ambiguities. While I would tend to agree this is not an issue with display typefaces, almost any <em>text</em> typeface, these days, could be used, if not for mathematics, at least for programming examples. (But here, italics aren't an issue, unless the original Pascal display format is being used...)</p>
      <p>However, it's always possible for those preparing a text to only italicize the variable names, so this is not a critical issue.</p>
