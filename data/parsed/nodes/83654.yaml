      <p>Way back, there were no figures in italic fonts.<br>
      A really old-school revival would do likewise.</p>
      <p>**</p>
      <p>There is some cultural history and tradition here.<br>
      Folllowing that, it would seem to be more appropriate to have non-slanted non-alphabetic glyphs in old-style faces.</p>
      <p>**</p>
      <p>Nonetheless, I made all the italic math operators in my 19th century revival, the Modern Suite fonts, slanted.<br>
      The reason being, that even with its copious language coverage, they are still not math fonts.</p>
      <p>IMO, unless one is producing a fully loaded math font, all italic glyphs should be slanted, except ® and ©.</p>
      <p>(I did provide vertical parentheses in the Mod Suite italics, as a Stylistic Set.)</p>
