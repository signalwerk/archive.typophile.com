  - id: 36943
    user: 1262
    date: 2003-02-02T09:38:00
    date_raw: 2 Feb 2003 — 9:38am
    votes: null
    html: <p>There are two ways to import Illustrator outlines into FontLab. <br> <br>1. You can copy and paste an outline directly from Illustrator into FontLab. Note that some bugs have been reported with this method, and I believe Yuri is working to resolve these. At the moment, it is best to copy and past individual outlines, not groups of outlines. Very complex outlines may also have problems. <br> <br>2. You can save Illustrator outlines as EPS and import using the Glyph/'Import from EPS...' function. I should note that I have not used Illustrator for a long time (I do all my drawing directly in FontLab), so I can't confirm that this method is without problems. <br> <br>I recommend that you join the <a href="http://groups.msn.com/FontLab">FontLab user community</a> on MSN. This is a very lively forum with lots of knowledgeable contributors.</p>
    html_clean: <p>There are two ways to import Illustrator outlines into FontLab. <br> <br>1. You can copy and paste an outline directly from Illustrator into FontLab. Note that some bugs have been reported with this method, and I believe Yuri is working to resolve these. At the moment, it is best to copy and past individual outlines, not groups of outlines. Very complex outlines may also have problems. <br> <br>2. You can save Illustrator outlines as EPS and import using the Glyph/'Import from EPS...' function. I should note that I have not used Illustrator for a long time (I do all my drawing directly in FontLab), so I can't confirm that this method is without problems. <br> <br>I recommend that you join the <a href="http://groups.msn.com/FontLab" class="link-external">FontLab user community</a> on MSN. This is a very lively forum with lots of knowledgeable contributors.</p>
  - id: 36944
    user: 1316
    date: 2003-02-15T03:29:00
    date_raw: 15 Feb 2003 — 3:29am
    votes: null
    html: <p>I think I can help, since I always relied on Illustrator to transfer vector art in FontStudio and now I started doing so in FontLab. <br> <br>Illustrator support the copy and paste function John mentioned, but the architecture of Illustrator 10 is different. You should use Illustrator 8 or 9. <br> <br>If you have FreeHand 10, you can easily use the "copy special" feature which allows a different copy strategy for different formats. Selecting the EPS format works exactly like if you are copying directly from Illustrator 8 or 9. <br> <br>I tested FontLab with a lot of RAM and very complex digitized forms of a hyper-decorated Art Nouveau alphabet juping back and forth between Illustrator 10 and Freehand 10 and FontLab and everything vorks fine. I'm under MacOs 9.1, by the way.</p>
    html_clean: <p>I think I can help, since I always relied on Illustrator to transfer vector art in FontStudio and now I started doing so in FontLab. <br> <br>Illustrator support the copy and paste function John mentioned, but the architecture of Illustrator 10 is different. You should use Illustrator 8 or 9. <br> <br>If you have FreeHand 10, you can easily use the "copy special" feature which allows a different copy strategy for different formats. Selecting the EPS format works exactly like if you are copying directly from Illustrator 8 or 9. <br> <br>I tested FontLab with a lot of RAM and very complex digitized forms of a hyper-decorated Art Nouveau alphabet juping back and forth between Illustrator 10 and Freehand 10 and FontLab and everything vorks fine. I'm under MacOs 9.1, by the way.</p>
