    <p>Hi guys, I need some genuine and honest comment about my logo design for my company re-branding.</p>
    <p>Currently we're using "Dotty Love Graphic Design", We decided to re-branding it because of few reasons..<br>
    the first one, this has name actually been used for around two years..  i do have a logo with light magenta<br>
    and a love vector in it, but unfortunately,  the logo can be no longer use it as It appear in a drama<br>
    series in Taiwan. I'm quite upset with this. i've no idea how they get it.. </p>
    <p>the second one is, i'm trying to pursue my design n printing services to some industry company,<br>
    the company name with "Love" doesn't sound profession enough, it's more to freelance market instead of industry.</p>
    <p>My new company name is D&amp;i Print Creation. The meaning of D&amp;i is the short form of Dot &amp; Idea, target audience<br>
    is to young adult,  we provide design, print and photography services. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_1_72_5851.jpg"></div><p></p>
