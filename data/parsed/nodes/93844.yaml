    html: |-
      <p>Maybe a common comment would help: <strong>start with a black/white logo and when that's done, move on to colour</strong>. This will help you big time to progress faster and clean out your logo. It's too busy, styles too different but promising.</p>
      <p>If I was you, I'd go with evolution. If you've already established your brand with your clients it may not be too good to completely go off. Your existing logo isn't too bad apart from type. So that would be my starting point. I'd keep the heart stuff but completely change surrounding type. Including the new name.</p>
      <p>This way existing clients wouldn't have problems relating new stuff to old (so brand keeps what it had created in their heads) and new clients would recognise it better.</p>
    html_clean: |-
