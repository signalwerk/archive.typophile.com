      <p>Much of this is very nice. Unfortunately, I'm not a fan of the elliptical rounds in the C, G, O, c, e, o. The curves in the numerals have more potential, and you use them nicely in the b, p, q.</p>
      <p>The 'j' is interesting, but feels out of place, next to the curves. The v, w, x, y can get away with sharp angles, I think.</p>
