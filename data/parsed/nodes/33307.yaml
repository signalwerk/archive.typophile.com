      <p>thank you stephen.<br>
      monoxil is a school project, in which we had to define a particular subject of inspiration, like insects, heavy metal, lord of the rings and such (...) so i came up with "medicine" which reminds me of something clean and well organized but with a lot of disturbing details. that's why i decided to use ellipses. anyway, i think the c, e and o work very good, they give the text exactly that feeling i wanted. i think the typeface would loose it's character completly, if i remove them.</p>
      <p>thank you.</p>
