    <p>hello. this is Monoxil, monospace typeface i am working on right now. i would really appreciate your feedback.</p>
    <p>NOTES:</p>
    <p>yes, O-like characters are exact ellipses.</p>
    <p>grey characters are stylistic alternates. i am not sure if i shouldn't switch regular and alternative versions, so maybe you could help me to decide. except for the "a" which is a bit disturbing in text because there is this long diagonal stroke, but it looks nice in biggers sizes.</p>
    <p>so far i haven't done much work on the optical details.</p>
    <p>there is still a lot of characters missing, but i think you can get the concept. i will add them soon.</p>
    <p>thank you</p>
