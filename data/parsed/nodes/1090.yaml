  html: <p>FONT BOUTIQUE is an independent label founded  <br>by Heinrich Lischka (Typografski) in 2002. <br> <br>We start off with the type NOGA - an elegant,  <br>slender Grotesk with a human character. <br> <br>The second FONT BOUTIQUE type called NASTEPNA  <br>is going to be released in August 2002. <br> <br>At irregular intervals more Types are going to follow. <br> <br>To develop useful types is our philosophy. <br> <br><a href="http://www.fontboutique.de/" target="_top">http://www.fontboutique.de/</a></p>
