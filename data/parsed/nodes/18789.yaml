    html: |-
      <p>The small text is <a href="http://www.myfonts.com/fonts/emigre/filosofia/" target="_blank">Filosofia</a> (and its italic) from Emigre.</p>
      <p>The red text looks like Engravers Gothic, Sackers Gothic, or Blair, but the crossbar of the ’A’ is much lower than those fonts, and the top is pointier.</p>
      <p>The “cafe” font looks almost like Monotype script. I’ll see if I can find it.</p>
      <p> - Lex</p>
