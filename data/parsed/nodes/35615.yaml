  html: <p>Alright, not typography related, but cool for design nerds nevertheless. Check out <a href="http://pingmag.jp/2007/08/01/picopico" rel="nofollow">this post</a> from <a href="http://pingmag.jp" rel="nofollow">PingMag</a> on Atsushi Tomura, who creates incredible foam monster costumes (apparently, people dressed up in monster outfits is less odd in Japan than in the U.S.). There's something about the vivid colors, googly eyes, and sharp white teeth that makes these creatures lovable in a surreal, nightmarish way.</p>
  html_clean: <p>Alright, not typography related, but cool for design nerds nevertheless. Check out <a href="http://pingmag.jp/2007/08/01/picopico" rel="nofollow" class="link-external">this post</a> from <a href="http://pingmag.jp" rel="nofollow" class="link-external">PingMag</a> on Atsushi Tomura, who creates incredible foam monster costumes (apparently, people dressed up in monster outfits is less odd in Japan than in the U.S.). There's something about the vivid colors, googly eyes, and sharp white teeth that makes these creatures lovable in a surreal, nightmarish way.</p>
