      <p>Thanks for all of your suggestions so far.</p>
      <p>re: Typequake's questions, the magazine is published by the school of public health at the University of Michigan, so the content is focused on public health in relation to the school's program, staff, and students.</p>
      <p>I need to have something with a range of weights, italics, small caps, and lining and oldstyle figures. That's one reason I'm considering Adobe Garamond and Minion. To me, though, both lack a certain kind of refined elegance that a Bodoni or even Fairfield has.</p>
      <p>I realize that what I'm looking for may not exist, but I've come across a whole load of interesting stuff during my search, so it's been a valuable effort regardless.</p>
      <p>circleh</p>
