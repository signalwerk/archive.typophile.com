    <p>I'm the designer of an academic magazine that uses Fairfield for the main text, and have been looking for an alternative. </p>
    <p>There's a desire to simply freshen up the look with a new typeface, but there are also practical considerations, mainly relating to stroke weight and contrast. The high contrast between the thick and thin strokes have impelled some readers to complain about readability, and the thin strokes make it particularly sensitive to very minor variations in ink density when on press.</p>
    <p>While I'm evaluating Sabon, Adobe Garamond, and Minion at the moment, I've also been looking for a font that has the precision and cleanliness of a Modern such as Bodoni without the drawbacks of stroke contrast. Walbaum and Centennial have the same drawbacks that Fairfield does. </p>
    <p>I know that all of you are far more aware than I of what's new — or old! — out there, and I'd appreciate any and all opinions and recommendations.</p>
    <p>Thanks.</p>
