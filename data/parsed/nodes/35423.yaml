    html: |-
      <p>Italic characters are rooted in the handwriting of fifteenth-century Italian scribes, who wrote in a style developed by manuscript scribes to save space and paper. Try tracking down a copy of Kathryn Akins <em>Masters of the Italic Letter</em> for more details.</p>
      <p>As for your design teacher, is your school hiring people who never went to design school or something?</p>
