    <p>*couldn’t find anything doing a search, so I thought I’d ask*</p>
    <p>My design prof taught me that creating a italic and bild faces is simply a matter of skewing the shape or using a heavier outline on my vector shapes. But after doing some reading on my own, i’ve learned that this is completely WRONG!</p>
    <p>I understand that italics were used in printing to conserve on space, and should therefor be narrower. But what makes a good italic set? Why are the ’a’s usually completely different within the same family, if choosing between italic and regular (roman?)?</p>
    <p>Thanks,</p>
    <p>Nate</p>
