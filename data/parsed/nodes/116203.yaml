    html: |-
      <p>This is actually Monotype Script, available at the source given by Ryuk. It's a German Script designed by F. H. Steltzer, 1931 based on Pragefest, aka Samson Script, designed by E.Lautenbach, Ludwig &amp; Mayer , 1928. Resembling British Script and Signal.<br>
      Lighter weight version was Monoscript 351.<br>
      Prägefest<br>
      Ludwig &amp; Mayer, Frankfurt am Main<br>
      Erstguß 1926<br>
      Eduard Lautenbach<br>
      Previous thread: <a href="http://www.typophile.com/node/41141" title="http://www.typophile.com/node/41141">http://www.typophile.com/node/41141</a><br>
      Don</p>
