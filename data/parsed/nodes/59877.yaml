  html: |-
    <p>I would like to know the type of font used in the old HBO show Deadwood title screen.  A small pic of it can be found at <a href="http://www.hbo.com/deadwood">www.hbo.com/deadwood</a> right underneath the HBO graphic on the top left.  Or by looking at this: <a href="http://en.wikipedia.org/wiki/File:Deadwood_titleimage.jpg">http://en.wikipedia.org/wiki/File:Deadwood_titleimage.jpg</a> for a little bigger picture.</p>
    <p>Thanks!</p>
