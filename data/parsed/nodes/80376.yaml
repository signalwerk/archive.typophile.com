  html: <p>Has anyone experienced FontLab generating a font where the kern classes differ from the source VFB? I'm completely stumped as to why this is happening or how to get around it. I suppose I could use TTX or FontForge to replace the kern classes but I can't help wondering if this is a known bug, maybe FL needs a reinstall or perhaps I've overlooked something. Any insight would be appreciated.</p>
