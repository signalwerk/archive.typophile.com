      <p>Update: </p>
      <p>When I tried generating the font using the same VFB with FontLab on a PC, I got the Warning reported here: <a href="http://www.typophile.com/node/27336" title="http://www.typophile.com/node/27336">http://www.typophile.com/node/27336</a></p>
      <p>Note: the Mac version of FontLab did not give that warning.</p>
      <p>So it seems there may be a duplicate class or some similar error in the classes. Now it's just a matter of finding it...</p>
