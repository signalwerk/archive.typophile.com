    html: |-
      <p>Buy the book "Learn Fontlab Fast"</p>
      <p>What it will tell you to do is basically:</p>
      <p>Do everything in Type 1. Convert all contours to Type 1. Your contours should run the right directions.</p>
      <p>Then convert contours and instructions to Truetype.</p>
      <p>Use font audit and fix any errors.</p>
      <p>Erase all your hinting.</p>
      <p>Auto hint everything.</p>
      <p>Fix overlapping hints.</p>
      <p>Then look at it and write down which glyphs need more hinting work. You'll need to use truetype hinting on them, which is more precise than Type 1 hinting.</p>
      <p>Read the fontlab manual about truetype hinting. It's not that difficult to figure out how to do it, but it is a lot of tedious work. Truetype hinting will give you the best results, and you can preview your hinting at different sizes as you work.</p>
