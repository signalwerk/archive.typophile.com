      <p>Gus,</p>
      <p>As far as suggestions on hinting, it might help to know more about what kind of typeface you're hinting, which formats you're delivering, and the level of quality you're after. If you want pixel-perfect rendering at 9ppem in Windows XP with font-smoothing turned off, you'll need some advanced TrueType hinting, and Adam's figure is probably in the ballpark (multiplied by however many weights in your family). But even without deep pockets or extensive technical knowledge, it's possible to improve rendering using some combination of autohinting and manual tweaking.</p>
      <p>Assuming you're hinting for TrueType (or both PostScript and TT) you can use PostScript hints as a jumping-off point. Adobe's autohinter can—depending on the font style—produce results that rival manual hinting, or at least get you part-way there (provided you're alignment zones and standard stems are accurately set). Then use the PS hints to generate TT instructions in FontLab, per Adam's tutorial: <a href="https://docs.google.com/View?id=dhnxc5bs_21ggxfqxft&amp;pli=1" title="https://docs.google.com/View?id=dhnxc5bs_21ggxfqxft&amp;pli=1">https://docs.google.com/View?id=dhnxc5bs_21ggxfqxft&amp;pli=1</a></p>
      <p>From there you can go into hinting mode and make manual adjustments, fine-tune problematic glyphs, add delta hints, etc. While FontLab's visual hinting tools don't cover the entire set of possible TrueType instructions, it's easier to dive into than something like Microsoft's Visual TrueType, and the Windows version additionally shows previews in grayscale and ClearType (AFAIK Mac FontLab's hinting previews are black and white only).</p>
      <p>Beyond the section on TT hinting in the FL manual, I found the info and examples in Jigal van Hemert's "Practical TrueType Hinting" to be particularly educational:<br>
      <a href="http://cg.scs.carleton.ca/~luc/tt_hinting_tutorial.pdf" title="http://cg.scs.carleton.ca/~luc/tt_hinting_tutorial.pdf">http://cg.scs.carleton.ca/~luc/tt_hinting_tutorial.pdf</a></p>
