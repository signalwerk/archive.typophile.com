    <p>I am wrapping up a family and don't want to rely on auto hinting. I'm looking for good resources to learn how to hint or to have someone hint for me. Tips and tricks are welcome suggestions too. I found a few companies to bid on hinting but I haven't heard back from them and have a feeling that they will come in high. You can see a few progress shots at my blog if you are interested.</p>
    <p><a href="http://gus555.wordpress.com/ " target="_blank" rel="nofollow">Future Grid Systems Blog</a></p>
    <p>Any help would be greatly appreciated.</p>
    <p>Gus</p>
