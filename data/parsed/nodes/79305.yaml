      <p>Ray - Sorry you're getting abuse from certain jerks and zealots in the open source community. Like most religious or dogmatic groups, the huge majority of the people there are reasonable, kind and helpful. But there are always a few that decide to be fanatical and misrepresent the group as a bunch of fundamentalist wackos. They're not worth your time.</p>
      <p>Everyone - There are valid and attractive reasons to release a font as open source, but as we've seen here there are some people who heap abuse on designers instead of thanks. The best way to minimize that, and protect yourself, is to use the <a class="freelinking external" href="https://web.archive.org/web/20150123182102/http://scripts.sil.org/ofl" rel="nofollow">SIL Open Font License (OFL)</a>. That license is well-accepted, legally-reviewed and has significant protections for the designer. If you use the OFL then the target for abuse shifts from you to the authors and advocates of the OFL. We deal with the zealots so you don't have to.</p>
