      <p>Kevin, please don't speak on my behalf. I'm not threatening anyone. If my EULA doesn't comply with open source rules, then I recommend their removal. That's all. I was led to believe that my customized agreement would be acceptable. Now I can see it clearly goes against open source rules. I have no interest in modifying the agreement any further and distributing old, broken versions of my fonts doesn't do anyone any good.</p>
      <p>I <em>recommend</em> that my fonts be removed. I don't require them to be and there will be no consequences from me if they're not removed. This is Kevin's battle, not mine.</p>
      <p>If anyone would like to discuss open source licensing with me: compose an email. Select all. Delete. I don't want to hear about it. If you succeed or fail in removing them, I still don't want to hear about it.</p>
