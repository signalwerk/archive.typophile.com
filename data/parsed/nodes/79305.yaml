      <p>I've just been pointed to this by a fellow member of the pkg-fonts team in Debian.</p>
      <p>It's actually funny as I just took over the "ttf-larabie" fonts package in name of the team. The main point was actually improving the packaging techniques and drop support for a few obsolete packaging behaviour.</p>
      <p>This package is part of the "non-free" section in Debian and this is why it is also present in Ubuntu.</p>
      <p>Why is it in non free? Because the license does not meet de Debian Free Software Guidelines (<a href="https://web.archive.org/web/20150123182102/http://www.debian.org/social_contract#guidelines" title="http://www.debian.org/social_contract#guidelines">http://www.debian.org/social_contract#guidelines</a>). These guidelines are certainly not a way to reject those who develop software that doesn't meet them or put shame on them.<br>
      Not being free according to these guidelines is certainly not a shame and burst in flames of hell.</p>
      <p>As it is probably known (and somehow debated by the FSF), Debian (let me quote the DFSG : " acknowledge that some of our users require the use of works that do not conform to the Debian Free Software Guidelines. We have created "contrib" and "non-free" areas in our archive for these works."</p>
      <p>So, as a consequence :<br>
      - ttf-larabie will remain packaged as it has apparently a quite significant user base : <a href="https://web.archive.org/web/20150123182102/http://qa.debian.org/popcon.php?package=ttf-larabie" title="http://qa.debian.org/popcon.php?package=ttf-larabie">http://qa.debian.org/popcon.php?package=ttf-larabie</a><br>
      - it will remain in the non-free section of the archive so as an extra areas of the Debian archive, which is not part of Debian<br>
      - any derived distribution is free to include it or to choose not including it.</p>
      <p>To the original author : please don't spread misconception of what free software is and how it should be promoted. My personal opinion is that, by pushing your ideas the way you're doing, you're doing more harm than good to Free Software.</p>
      <p>And, by the way, I very much doubt that Mark Shuttleworth will follow your suggestion. Just guessing..:-)</p>
