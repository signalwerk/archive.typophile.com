    html: |-
      <p>Somewhat against my better judgement, just in case anyone has misinterpreted what I said based on Kevin's replies:</p>
      <p><em>Then why were the closed source pseudofree-fonts of Ray Larabie or other proprietary typodesigners lodged on Ubuntu software center? They must be removed!</em></p>
      <p>If you looked at the list of endorsed Linux distributions, you would have noticed that Ubuntu is not there (nor almost any other well-known distribution). The reason for this is that all the major distributions include software which is free--as in you don't have to pay for it--but not open-source. Indeed, they even have an <a class="freelinking external" href="https://web.archive.org/web/20150123182102/http://www.gnu.org/distros/common-distros.html" rel="nofollow">explanation</a> page which states: <em>"Ubuntu provides specific repositories of nonfree software, and Canonical expressly promotes and recommends nonfree software under the Ubuntu name in some of their distribution channels."</em> </p>
      <p>It is not as if fonts are the only non-open-source pieces of software shipped by Ubuntu or Canonical. Ubuntu has lots of packages which disallow modification. For example, the <a class="freelinking external" href="https://web.archive.org/web/20150123182102/http://packages.ubuntu.com/maverick/nvidia-173" rel="nofollow">Nvidia drivers</a> have a <a class="freelinking external" href="https://web.archive.org/web/20150123182102/http://changelogs.ubuntu.com/changelogs/pool/restricted/n/nvidia-graphics-drivers-173/nvidia-graphics-drivers-173_173.14.28-0ubuntu1/nvidia-173.copyright" rel="nofollow">license</a> which says:</p>
      <p><em>No Reverse Engineering.  Customer may not reverse engineer, decompile, or disassemble the SOFTWARE, nor attempt in any other manner to obtain the source code.</em></p>
      <p>I don't see how this is different from the distribution of these fonts...</p>
