      <p>On Debian, at least, it’s pretty clear that these are not “free” in the sense of being open-source:</p>
      <p><code><br>
      ~$ aptitude show ttf-larabie-deco<br>
      Package: ttf-larabie-deco<br>
      New: yes<br>
      State: not installed<br>
      Version: 1:20011216-1.1<br>
      Priority: optional<br>
      <strong>Section: non-free/fonts</strong><br>
      Maintainer: Erich Schubert<br>
      Uncompressed Size: 7,336 k<br>
      Depends: defoma<br>
      Recommends: fontconfig<br>
      [&amp;c. emphasis mine]<br>
      </code></p>
      <p>I imagine the licence file itself will also be in /usr/share/doc/$packagename/copyright if Ubuntu follows the Debian model.</p>
      <p>Unless you use one of the <a class="freelinking external" href="https://web.archive.org/web/20150123182102/http://www.gnu.org/distros/free-distros.html" rel="nofollow">Free Software Foundation endorsed distributions</a> which contain no non-open-source software, it is almost inevitable that some things you can get from a package manager will not be Open Source, be they binary drivers for graphics cards or pieces of software such as Flash. I don’t see why that is a bigger issue with Fonts then any of these.</p>
