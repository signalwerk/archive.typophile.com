      <p>It's pretty nice, but unfortunately my first thought upon seeing it was that it was for a pasta company - the curved musical staffs made me think of some kind of hybrid macaroni/rigatoni. Maybe adding another line would make them read as musical staffs (although that might make them hard to use at small sizes)? Or put some musical notation in them (that is probably a bad idea)?</p>
      <p>This is just one non-professional person's first impression, so don't throw out your idea until you get more feedback.</p>
