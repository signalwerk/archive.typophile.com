    <p>Hi There</p>
    <p>I've been trying to sort out a logo for a classical string group for such a long time now and just keep going round in circles!<br>
    I need to just settle on a logo so i can start working on the rest of the 'brand space'.</p>
    <p>Please give me any critique or advice you can.</p>
    <p>Its for a string group who play for weddings and functions. The things i'm trying to get across -<br>
    classy, lots of experience (there main USP), wide range of music, approachable.</p>
    <p>This mark will either be made into a stamp, or embossed with foil or ink. It's for my family so we can always make a change in a year or so if its not working out. Also almost anything would be better than what we have now!</p>
    <p>Cheers!</p>
    <p><a href="http://3.bp.blogspot.com/-WrWxNyxmHn4/Tef0iEVNDFI/AAAAAAAAAIk/MqktK5kMAKM/s400/circle%2Blogo2.png" title="http://3.bp.blogspot.com/-WrWxNyxmHn4/Tef0iEVNDFI/AAAAAAAAAIk/MqktK5kMAKM/s400/circle%2Blogo2.png">http://3.bp.blogspot.com/-WrWxNyxmHn4/Tef0iEVNDFI/AAAAAAAAAIk/MqktK5kMAK...</a></p>
