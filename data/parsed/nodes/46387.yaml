      <p>Mark, It seems to me that a small, inconspicuous colophon would not detract from the exhibition, any more than crediting the curators, art directors and others involved in presenting the show to the public detracts from the impact of the exhibition. I agree that may be their thinking, but it seems a disservice to the typography, in my opinion (of course, because type interests me).</p>
      <p> - Mike Yanega</p>
