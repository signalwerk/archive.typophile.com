    html: |-
      <p>I think it looks closer to Janson, but the R leg is not serifed. Gábor Kóthay's <a href="http://www.myfonts.com/fonts/t26/tyrnavia/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tyrnavia</a> is based on Kis's lettering, but has an R with a tapered leg, although it extends below the baseline. The other Janson problem is the M, which in most Jansons looks lopsided (including Tyrnavia).</p>
      <p>I think this might be a custom face designed for the Tate, but I haven't tried Googling this subject yet.</p>
      <p>- Mike Yanega</p>
