    html: |-
      <p>Mike, I certainly get your point, but have heard it expressed in the exhibition catalogue world that it can seem improper to call attention to this aspect of the design. I think the sentiment might be that if the type is to serve the subject and the overall design it shouldn't call attention to itself and, in turn, shouldn't be called out by name.</p>
      <p>I can see both sides to the point. </p>
      <p>Maybe we will get a response from someone at the Tate on this question of the typeface.</p>
