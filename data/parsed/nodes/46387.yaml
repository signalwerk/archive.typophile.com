      <p>Mike, you are quite right, it does indeed look closer to Janson. Tyrnavia is interesting, hadn't come across that one before.</p>
      <p>The sample comes from the Tate's own magazine <a href="http://www.tate.org.uk/tateetc/about/">http://www.tate.org.uk/tateetc/about/</a> art directed by Cornel Windlin. In my view its the most well designed magazine around at the moment.</p>
