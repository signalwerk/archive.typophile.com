      <p>Perfect. Thanks so much Theunis.</p>
      <p>The faces I've made in the past have been quite simple; plunking in characters from illustrator, and playing with metrics. I'm trying to dive into additional features in earnest, and this is the first time I've had to add a range to my uranges.dat and created an alt character within this newly created range... so I tried it straight away, just in case...</p>
      <p>I'm building two distinct typefaces of ~200 'display' emoticons, one is an outline, and the other is a filled form / tonal layer. Every character in each of the two faces is to have a stylistic alt. I'll be substituting Aa-Zz, 0-9 with similar nonsense, some are irrationally complex, so I promise the faces will be bloated by the time I'm finished.</p>
      <p>Is there anything I can add to further optimize my Open Type code?</p>
      <p>Thanks again!</p>
