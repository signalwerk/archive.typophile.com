    html: |-
      <p>x = NaN</p>
      <p>Platform 3, encoding 1, language 1 is MS Windows, Unicode, English (from memory :-) and does not support encoding beyond the basic UC plane -- it maxes out just before U+FFFF. If these two characters are the only ones in this font, there is nothing to put into this encoding. Hence the error.</p>
      <p>I understand it's recommended to always have a regular space in your font; perhaps that's all to make yours valid. (At least it won't take up excessive space. (g))</p>
