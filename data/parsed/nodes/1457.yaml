  html: <p> If you've ever noticed when you generate a font from FOG and activate it with ATM Deluxe, then open an application like Quark or Illustrator, then specify a typeface in one of those applications, there are several lists in the drop down font menu. <br> <br>I don't know if this is a symptom of Adobe Type Reunion, but it seems there is an 'A' list of fonts that sit at the top half of the the list which seem to be perfectly alphabetized, and a 'B' list of fonts that are also alphabetized yet sit far below their 'A' list counterparts. <br> <br>So in what manner does one need to generate a font to be part of the 'A' list? <br> <br>Stuart :D </p>
  html_clean: <p> If you've ever noticed when you generate a font from FOG and activate it with ATM Deluxe, then open an application like Quark or Illustrator, then specify a typeface in one of those applications, there are several lists in the drop down font menu. <br> <br>I don't know if this is a symptom of Adobe Type Reunion, but it seems there is an 'A' list of fonts that sit at the top half of the the list which seem to be perfectly alphabetized, and a 'B' list of fonts that are also alphabetized yet sit far below their 'A' list counterparts. <br> <br>So in what manner does one need to generate a font to be part of the 'A' list? <br> <br>Stuart :D </p>
