    html: <p>Stuart -- <br> <br>I think you're describing a feature of ATR Deluxe which puts the most recently used fonts up at the top to make them more convenient. Open the ATR control panel and in the General tab you'll see a check box for "Show <i>xx</i> most recently used fonts. <br> <br>The only thing is, in my experience the A list is ordered chronologically, not alphabetically. <br> <br>Bottom line, I don't think you can do anything to make sure that your font always shows up on the A list. (Of course, if you name it with an A, it'll be at the top of the B list. Or generate a font menu name with a space as the first character and wind up on the tippy top.) <br> <br>-- K. <br> <br>P.S. Congrats on the recent release (I'm sorry, I've forgotten his name). Missed you at TypeCon. Next year, eh?</p>
    html_clean: <p>Stuart -- <br> <br>I think you're describing a feature of ATR Deluxe which puts the most recently used fonts up at the top to make them more convenient. Open the ATR control panel and in the General tab you'll see a check box for "Show <i>xx</i> most recently used fonts. <br> <br>The only thing is, in my experience the A list is ordered chronologically, not alphabetically. <br> <br>Bottom line, I don't think you can do anything to make sure that your font always shows up on the A list. (Of course, if you name it with an A, it'll be at the top of the B list. Or generate a font menu name with a space as the first character and wind up on the tippy top.) <br> <br>-- K. <br> <br>P.S. Congrats on the recent release (I'm sorry, I've forgotten his name). Missed you at TypeCon. Next year, eh?</p>
