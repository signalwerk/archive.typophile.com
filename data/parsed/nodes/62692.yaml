      <p>Mm, yes the y was the first thing I noticed. And the s looks distorted. Is this custom lettering?  I can see you're aiming for something that echoes the square curves of the star shapes but I wonder if there might be a better font choice. Also the alignment isn't quite vertically centred so the two elements don't look quite unified.</p>
