      <p>Thank you for your comments Ben. The lettering is custom made exactly. For now I have not placed the symbol in an optimal position I think, this might be best to do once the type is ready.</p>
      <p>For some background information the company from Bavaria in Germany. The idea of their company is that of igniting something in a person which leads to personal growth. They required a more corporate style as they are more b2b.</p>
