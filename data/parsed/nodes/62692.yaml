    <p>Hi guys,</p>
    <p>I am looking for some assistance with the lettering on a project I am working on. The symbol itself is complete but I would like to take the typographical elements further. My main concern is with the 'y' at the moment, is it too distracting? </p>
    <p>I would really appreciate your feedback on this logotype.</p>
    <p>I ask that we not mention the client just for search engines.</p>
    <p>Thanks.</p>
    <p>Regards,<br>
    David Pache</p>
