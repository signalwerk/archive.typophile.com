    <p>Check out this link. Its a photographers portfolio (Jesse Chehak) of car model logos. They are photos of the typography of the actual model (Astro, Blazer, Camaro, Dart, Electra..etc). Besides being a very nice typographic reference, they are pretty decent photos.</p>
