      <p>I like number two at first glance, but, because this might be occuring several times on a page, you would run the risk of creating light spots, so while retaining the ellipsis I would look at making this combination tighter, reducing spaces before and after brackets and the space between bracket and first letter (unless that is part of the convention). Also are square brackets the norm or can you use parentheses, especially if they are lighter overall, as the strong verticals are drawing attention to the space.<br>
      The trouble with these is the emoticon factor I suppose, it could be perceived as a <a href="http://www.artcellarexchange.com/images/artists/haring_monster.jpg" rel="nofollow">Keith Haring icon.</a><br>
      Tim</p>
