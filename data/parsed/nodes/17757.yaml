    <p>Hello Typophiles,</p>
    <p>I don't know what's the norm for english or other languages, but in portuguese, when one suppresses part of a quoting (for brevity), it must be indicated by an ellipsis enclosed in brackets.</p>
    <p>As I'm typesetting my graduation monograph, I have been trying to decide what's the best "typographic detail" to this. Examples below show three situations:</p>
    <p>1) Bracket / Three Periods / Bracket -- The standard when writing, and what most people deliver because they write in Word and print from Word.<br>
    2) Bracket / Ellipsis / Bracket -- Straight-forward replacing the three periods with an ellipsis. This is the first, obvious choice when one goes beyong option 1. I like the way the space between each period in the ellipsis kind of equals the space from the brackets to the periods.<br>
    3) Bracket / Thin Space / Ellipsis / Thin Space / Bracket -- This starts to get wide, but in a way I like it, because the larger space around the ellipsis kind of emphasizes it, and the "wideness" of the group seems to reinforce the idea that there was more to that particular sentence than what is shown.</p>
    <p>The problem with this kind of decision is that what may look interesting to me (ie. option 3), might be annoying to readers. So I would like know what everyone else thinks... other approaches are also welcome :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ellipsis-gabriel.jpg"></div><p></p>
