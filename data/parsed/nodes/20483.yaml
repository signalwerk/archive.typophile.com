      <p>some info about the NatWest font from <a>typo-l</a></p>
      <p>Around 2 years ago, David Quay and Freda Sack Design were  commissioned by NatWest (via Wolff Olins) to design the new corporate identity typefaces for NatWest UK.</p>
      <p>The brief was to produce a face which was friendly and welcoming; modern yet retaining some stature. The type designs had to work in a range of media. The distinctive designs should help say "NatWest" wherever they are seen. As such they have now become an integral part of how the NatWest brand is presented to consumers.</p>
      <p>David Quay &amp; Freda Sack have recently been asked to complete the character set and help to improve the font's readability on screen media.</p>
      <p>The faces are NatWest copyright and are jealously guarded.</p>
