  html: <p>This is something I've wondered for a while. Given that Microsoft originally shipped Windows with Book Antiqua, and then eventually started licensing a legit version of Palatino, it would seem like a possibility that they could do the same for Arial/Helvetica. Granted, Book Antiqua wasn't as ubiquitous as Arial is, and thus was easier to abandon. But it seems they're paying more attention towards design and following more of designers' advice in their recent software, so does anyone ever see this happening?</p>
