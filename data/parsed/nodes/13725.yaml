  html: |-
    <p>Part of the <a href="/node/13726" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">University of the Arts London</a> (until recently called the <a href="/node/13729" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">London Institute</a>), together with <a href="/node/add/wiki?edit%5Btitle%5D=Camberwell%20Collge%20of%20Arts" title="Create node &quot;Camberwell Collge of Arts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Camberwell Collge of Arts</a>, <a href="/node/13727" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Central Saint Martins College of Art and Design</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Chelsea%20College%20of%20Art%20and%20Design" title="Create node &quot;Chelsea College of Art and Design&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Chelsea College of Art and Design</a>, and the <a href="/node/add/wiki?edit%5Btitle%5D=London%20College%20of%20Fashion" title="Create node &quot;London College of Fashion&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">London College of Fashion</a>.</p>
    <p><span class="caps">LCC</span> was formally known as <span class="caps">LCP</span> (the <a href="/node/13728" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">London College of Printing</a>).</p>
    <p>Their website is: <a href="http://www.lcc.arts.ac.uk/">http://www.lcc.arts.ac.uk/</a></p>
