  html: |-
    <p>Part of the <a href="/wiki/University%20of%20the%20Arts%20London" class="freelinking" rel="nofollow">University of the Arts London</a> (until recently called the <a href="/wiki/London%20Institute" class="freelinking" rel="nofollow">London Institute</a>), together with <a href="/wiki/Camberwell%20Collge%20of%20Arts" class="freelinking" rel="nofollow">Camberwell Collge of Arts</a>, <a href="/wiki/Central%20Saint%20Martins%20College%20of%20Art%20and%20Design" class="freelinking" rel="nofollow">Central Saint Martins College of Art and Design</a>, <a href="/wiki/Chelsea%20College%20of%20Art%20and%20Design" class="freelinking" rel="nofollow">Chelsea College of Art and Design</a>, and the <a href="/wiki/London%20College%20of%20Fashion" class="freelinking" rel="nofollow">London College of Fashion</a>.</p>
    <p>LCC was formally known as LCP (the <a href="/wiki/London%20College%20of%20Printing" class="freelinking" rel="nofollow">London College of Printing</a>).</p>
    <p>Their website is: <a href="http://www.lcc.arts.ac.uk/" rel="nofollow">http://www.lcc.arts.ac.uk/</a></p>
