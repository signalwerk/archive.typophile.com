    <p>Hi, everyone!</p>
    <p>I'm new here and I'm working on a design project, hoping to use a typeface that I can't find or identify.</p>
    <p>Can anyone identify the typeface in this poster's headlines?</p>
    <p><a href="http://blambang.com/german_spas_poster.jpg" title="http://blambang.com/german_spas_poster.jpg">http://blambang.com/german_spas_poster.jpg</a></p>
    <p>I thought the "S" kind of reminded me of a black, ultra-condensed version of Font Bureau's Agency, but that's not altogether close. </p>
    <p>Thanks in advance.</p>
    <p>-Tim</p>
