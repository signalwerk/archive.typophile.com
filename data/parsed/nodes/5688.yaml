  html: <p>hey. this is a poster for a concert at The Eaves (see logo forum). the main band is casiotone for the painfully alone. they are sort of lofi glitch pop. think 80s beats through a low tech casio keyboard with him singing over it. he sings alot about being lonely and that his house is full of mice. <br> <br>the poster will be letterpressed on 17x23 mohawk superfine soft white paper. im going to do an edition of about 40 and sell them at the show for around $10 each. <br> <br>this whole concept is really early. so ill be devloping it heavily over the next couple days. i like the first one waaaay more than the second, but thought i oughtta post both. <br><img src="http://www.typophile.com/forums/messages/29/40986.gif" alt="">  <br> <br><img src="http://www.typophile.com/forums/messages/29/40987.gif" alt=""></p>
