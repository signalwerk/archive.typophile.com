    html: <p>I really really love the hand/glove. Colours in the most recent revision look good. <br> <br>The 80's type isn't strong enough to avoid being overpowered by the strength of the glove. I think you should fill the channel in the characters with either white (which would really pick it out), or if you're bothered about the number of colours, fill it in with either the green from the mouse or the background colour. Just to stop the glove interferring. <br> <br>I don't think the mouse and the hand are working together in the composition. It would be nice to see the hand over the mouse more implying protection, or the gap between the thumb and the forefinger cupping the mouse's body. At the moment they feel quite seperate.</p>
