    html: <p>thanks for the words john. i certainly was trying to avoid hand scripted pink and blech. squiggly line drawings of.. anything. thanks for noticing. your from portland? i may be moving out there next year. <br> <br>here's the next version-no major design changes, just had to add the name of our visiting artist and change the colors, which actually is apartial solution to the readability issue. <br> <br>the two colors are pms 381 and 3115. if anyone besides me out there is a pantone whore i know youve already run for your books. anyway, ive done some testing, and on letterpress these two ink - when laid on top of eachother - create a green that is deeper and brighter and either by itself. should make the name pop. but a little readability trouble is fine with me. dont want to make it too easy on the viewer. ha. <br> <br>that green looks super yellow on my moniter, but its green. like the pantone. thoughts? <br> <br><img src="http://www.typophile.com/forums/messages/29/41296.gif" alt=""></p>
