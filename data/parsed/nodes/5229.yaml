    html: "<p>I have seen it and used it because I like goofing off. A friend pointed me to it a couple of weeks ago. I downloaded it onto my Mac (Mac OS X 10.3.x) and ran it, no problems. <br> <br>Okay, if you are used to your present vector drawing tools,  and say you like the pen tool a lot (and you do, right?), the way this thing draws WILL MAKE YOUR HEAD CAVE IN. <br> <br>After you recover, if you figure out the secret magic trick, drawing curves kind of makes sense. But then you'll be recovering from a caved-in cranium. <br> <br>The really cool thing is \"Glyphs are stored in XML based file to aid collaboration using existing tools such as CVS.\" Which could be neat. <br> <br>Other stuff: Mac users may care that the menus appear in the window not the menu bar. Double-click the doubletype.jar file in the /bin folder. <br> <br>I look forward to Mr. Blokland's review. (and Typographica). <br> <br>Jon</p>"
