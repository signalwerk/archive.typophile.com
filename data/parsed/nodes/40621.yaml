  html: |-
    <p>Hello.</p>
    <p>Could someone help me find wich serif [or a close match] appears in the header of an early 1900s portuguese newspaper:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile_3512.jpg"></div><p></p>
    <p>MyFont's WhatTheFont matched it with <a class="freelinking external" href="http://http://www.myfonts.com/fonts/linotype/springfield/springfield/" rel="nofollow">Springfield</a>, <a class="freelinking external" href="http://http://www.myfonts.com/fonts/berthold/sorbonne-bq/med-cnd/" rel="nofollow">Sorbonne</a> and <a class="freelinking external" href="http://http://www.myfonts.com/fonts/aruban/lotsa-lotta/bold-condensed/" rel="nofollow">Lotsa</a> but I think there's too many differences to consider it an "acceptable" match.</p>
    <p>Thanks in advance,<br>
    Tiago</p>
