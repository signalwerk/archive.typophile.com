    date_raw: 31 Jan 2007 — 7:45pm
    votes: null
    html: <p>Good ol' Futura could work, but <a href="http://fontbureau.com/fonts/Nobel" rel="nofollow">Nobel</a> or <a href="http://typography.com/catalog/gotham/index.html" rel="nofollow">Gotham</a> could be more interesting choices. The "problem" is that many typefaces are optically balanced to compensate for the human eye's differing perception of the thicknesses of vertical and horizontal lines, meaning that often the horizontals are made slightly thinner to create the illusion that they are the same width as the verticals. So finding a font with perfectly equal horizontals and verticals might actually not be ideal, as it would not appear that way. But then again, you might already know this.</p>
    html_clean: <p>Good ol' Futura could work, but <a href="http://fontbureau.com/fonts/Nobel" rel="nofollow" class="link-external">Nobel</a> or <a href="http://typography.com/catalog/gotham/index.html" rel="nofollow" class="link-external">Gotham</a> could be more interesting choices. The "problem" is that many typefaces are optically balanced to compensate for the human eye's differing perception of the thicknesses of vertical and horizontal lines, meaning that often the horizontals are made slightly thinner to create the illusion that they are the same width as the verticals. So finding a font with perfectly equal horizontals and verticals might actually not be ideal, as it would not appear that way. But then again, you might already know this.</p>
