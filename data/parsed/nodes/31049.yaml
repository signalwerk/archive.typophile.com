  html: <p>Anyone have a good recommendation for a San Serif font, Bold or Black (thick) with stems that are nearly the same width? I am working on a logo and need a letter 'F' that has equal or near equal parts.</p>
  html_clean: <p>Anyone have a good recommendation for a San Serif font, Bold or Black (thick) with stems that are nearly the same width? I am working on a logo and need a letter 'F' that has equal or near equal parts.</p>
