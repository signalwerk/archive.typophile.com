      <p>Additional character ranges in the pipeline for future inclusion in Unicode BMP, and tentative range assignments in the other planes, from the <a class="freelinking external" href="http://www.unicode.org/roadmaps/" rel="nofollow">Unicode Roadmaps</a>.<br>
