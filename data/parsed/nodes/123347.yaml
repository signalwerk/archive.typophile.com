      <p>Additional character ranges in the pipeline for future inclusion in Unicode BMP, and tentative range assignments in the other planes, from the <a href="http://www.unicode.org/roadmaps/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Unicode Roadmaps</a>.<br>
      Roadmap to the BMP (Plane 0)<br>
      Roadmap to the SMP (Plane 1)<br>
      Roadmap to the SIP (Plane 2)<br>
      Roadmap to the TIP (Plane 3)<br>
      Roadmap to the SSP (Plane 14)</p>
      <p><code><br>
