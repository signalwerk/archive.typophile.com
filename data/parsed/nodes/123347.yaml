    <p>Updated uranges.dat file for FontLab.</p>
    <p>All Unicode 7.0 Character Ranges, plus Control Codes, ASCII and Latin-1, with the ranges sorted in alphabetical order for ease of use.<br>
    Rename from uranges.txt to uranges.dat and place in<br>
    ~Library/Application Support/FontLab/Data/<br>
    (OS X)<br>
    This location can also be defined in the FontLab preferences window.<br>
    See documentation for Windows location of this file.</p>
