    html: |-
      <p>One isn't necessary for the purpose of constructing the lines.</p>
      <p>It should be noted, though, that you are right in being suspicious of this construction. It doesn't really embody some fundamental aesthetic principles. If the aspect ratio of the page were different, following the same steps would create a radically different, and thus presumably not necessarily attractive, layout. (And I presume that the existing aspect ratio is not exactly the golden ratio, even if it approximates it.)</p>
      <p>So it is just that starting from the page as it is, following these particular steps happens to put the horizontal divisions in places that could have easily just been specified as numerical fractions of the page height.</p>
