    html: |-
      <p>@Ryan Maelhorn:<br>
      <cite>And what's with this point, what it is it based on?</cite></p>
      <p>Well, note that there is a diagonal from the upper left corner to the lower right corner of the page.</p>
      <p>Then, a line going from the upper right corner crosses that main diagonal <em>at a 90 degree angle</em> to indicate that point.</p>
      <p>That means that that point marks where you could draw a horizontal line to create a rectangle, made from the top of the page above the line, which has the same proportions as the page as a whole - because its diagonal makes the same angle, except rotated by 90 degrees, as the diagonal of the whole page.</p>
      <p>This rectangle is then the basis on which the three horizontal lines you do see drawn are constructed.</p>
      <p>First, the point where the rotated shrunk page diagonal crosses the main diagonal defines the bottom-most of those three lines.</p>
      <p>Then, a diagonal is made for the left half of the rotated page image, and where that crosses the main diagonal defines the second line.</p>
      <p>Finally, the bottom-most of the three lines is used to define a new thinner rectangle; where its diagonal crosses the main diagonal indicates where the top line is to be drawn.</p>
      <p>Ah: <em>this</em> might help:</p>
      <p><a class="freelinking external" href="http://ministryoftype.co.uk/words/article/constructing_the_grid/" rel="nofollow">http://ministryoftype.co.uk/words/article/constructing_the_grid/</a></p>
