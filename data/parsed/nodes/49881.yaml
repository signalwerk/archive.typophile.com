      <p>What changes is that when the P is "open",  it is simply connected whereas when it is "closed" it is not simply connected; simple connectedness is indeed a topological property. To use that interpretation, we need to see a P as a plane surface bounded by its contours. What that means is just that the open P can be defined by a unique contour and the closed one needs two contours (and both P's are "connected" i.e. are made of just one piece). </p>
      <p>But, quadriloc is right: the letters p, q, d, b are nothing but an o with an outgrowth. Topologically, they are undistinguishable.</p>
