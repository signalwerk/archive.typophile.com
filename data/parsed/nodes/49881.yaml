      <p>I like topology.<br>
      Its meaning doesn’t have to be strictly mathematical, when applied to typography.<br>
      The idea is that the topology of a glyph remains the same, no matter how much its contrast, stress, weight and serifs are transformed.<br>
      One might also say that the topology of P and R in Palatino is consistent.</p>
