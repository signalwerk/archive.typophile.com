      <blockquote><p> the letters p, q, d, b are nothing but an o with an outgrowth. Topologically, they are undistinguishable.</p></blockquote>
      <p> So too is a single-story a. And if you allow nibbling on the o, you get c. If you add a bar to a nibbled o, an e.</p>
      <p>Also, h, n, m, and u share shape (&amp; maybe you can add the r), as do v, w, and y. If you allow the "outgrowth" to bend, voila, l, f, and j, and maybe i. </p>
      <p>Two smaller stacked o's with a connecting line make up a g, and two small, sacked o's nibbled on an s.</p>
      <p>Consider: if you look at runic forms, another way of looking at all this comes about.</p>
      <p>Etc.</p>
