      <blockquote><p>
      So too is a single-story a. And if you allow nibbling on the o, you get c. If you add a bar to a nibbled o, an e.</p>
      <p>Also, h, n, m, and u share shape (&amp; maybe you can add the r), as do v, w, and y. If you allow the "outgrowth" to bend, voila, l, f, and j, and maybe i.</p>
      </blockquote>
      <p>An o, a single story a and a double story a and also the letter e are just the same topologically: one exterior contour, and one contour inside  to make one hole (with font editors, that contour winds in the opposite direction). </p>
      <p>The j and the i have two disconnected pieces and with font editors, they are made using two contours that do not overlap and that wind in the same direction; they are not distinguishable from É or ù that have similar contours, but are distinguishable from a, e and o and also é (that has three contours).</p>
      <p>As for h, m, n, v, w, u, they are also undistinguishable: just one contour.</p>
      <p> Just making a little slice to make a c from an o does not preserve the number of contours.</p>
