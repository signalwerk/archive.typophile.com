      <p>As a linguist, I would find the term 'morphology' (or 'morphography') highly counterintuitive if used in this way, despite the fact that it may seem to make sense from an etymological standpoint -- both suggest combining graphemes into larger units (for instance, forming complex syllables in Devanagari). I find Andreas' suggestion of 'graphematics' less confusing.</p>
      <p>André</p>
