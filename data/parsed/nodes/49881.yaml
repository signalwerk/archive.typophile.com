      <p>A closed P and an open P are different topologically.</p>
      <p>Unfortunately, topology makes an open P equivalent to an L or an I, or a C. It makes E equivalent to T.</p>
      <p>So that's definitely not the term to use.</p>
      <p>And topography is right out as well, although one could (with tongue firmly in cheek) use it to talk abut the frequency and height of ascenders, making a line of type more mountainous.</p>
      <p>I'd suggest using nontechnical language. Merely speak of the basic shape of a letter. Or eschew Latin for German, and use something starting with "ur-".</p>
