      <p>You are looking too far afield. The skeletal essence of a grapheme shape is its <em>form.</em> Now, in plain language, "form", "shape" and "morphology" would be synonyms, but there is enormous precedent in how people in typography and graphetics talk about this: we say "the binocular form of g" and "the cursive form of r". You naturally used it many times in your inquiry. <em>Form</em> could be considered its own taxonomical level between <em>grapheme</em> and <em>glyph</em>.</p>
      <p>The study of how a graphic form has changed and developed could be called its "morphology" in the same way the origins of a word are called its "etymology".</p>
