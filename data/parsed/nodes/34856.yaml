      <p>Seems there are two problems.</p>
      <p>The first (and main one) is that the start nodes sit at different places. I’d use the position of the black weight for the light weight too. Obviously, FLS tried to reposition them, but since there seem to be other outline-incompatibilities, it inserted points and moved others around ...<br>
