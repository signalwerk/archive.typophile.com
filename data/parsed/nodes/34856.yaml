    html: |-
      <p>The more compatible the outlines are in advance, the better.<br>
      In fact the Blend tool gives the most reliable results, <cite>because</cite> it may add nodes to the original outlines.<br>
      The point of MM is that the node structure of each master is identical. So deleting a node in one master means deleting it in the other master too. Just like in a single master glyph, each outlines has a certain number of nodes — but in a MM glyph, each node does not hold just one x-y-coordinate per node, but for every node there is one x-y-coordinate per master.</p>
