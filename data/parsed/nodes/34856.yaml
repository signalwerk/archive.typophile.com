    <p>Hi all,</p>
    <p>It´s my first time with MM tools so...</p>
    <p>Does the outlines of two single fonts (light and bold) have to be compatible in order to use them as masters? Do I have to use the blend tool to build the multiple masters or there´s other way to do it? If yes, is it inevitable that the original shapes change even a little...? </p>
    <p>Sorry if i´m not making any sense.</p>
    <p>Thanks In advance<br>
    Best regards</p>
