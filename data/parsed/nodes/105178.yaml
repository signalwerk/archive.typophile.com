    html: |-
      <p>That is likely to be DIN Engschrift or it’s (almost identical) East German TGL-sister. DIN 275 - Hausnummerleuchten (house number lights) prescribes the use of typefaces according to DIN 1451. DIN 1451-2 contains DIN Mittelschrift and DIN Engschrift, but the final drawings of the typefaces vary by manufacturer / supplier, whatever … </p>
      <p>It may also be interesting to take a look at the twin-types Cst Berlin East and Cst Berlin West. They were designed by Ole Schäfer and Verena Gerlach in 2000 and are inspired by the typefaces as used on Berlin street name signposts.<br>
      <a href="https://www.fontfont.com/fonts/cst-berlin-east" title="https://www.fontfont.com/fonts/cst-berlin-east">https://www.fontfont.com/fonts/cst-berlin-east</a><br>
      <a href="https://www.fontfont.com/fonts/cst-berlin-west" title="https://www.fontfont.com/fonts/cst-berlin-west">https://www.fontfont.com/fonts/cst-berlin-west</a></p>
      <p>Calibre and Metric, designed in by Kris Sowersby ±2010 are partially inspired on the same street sign typefaces: <a href="https://www.klim.co.nz/blog/metric-and-calibre-design-information/" title="https://www.klim.co.nz/blog/metric-and-calibre-design-information/">https://www.klim.co.nz/blog/metric-and-calibre-design-information/</a> Calibre and Metric do not (yet?) seem to have the condensed weights you are looking for though.</p>
