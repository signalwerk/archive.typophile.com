      <p>I was very glad to see this paper and I've carefully read it. It is intended to help those who want to make their new or old hinted TT fonts to be compatible with Cleartype. So this is my case. I hoped there will be an answer to my question which I asked in this topic - <a href="http://typophile.com/node/14961" title="http://typophile.com/node/14961">http://typophile.com/node/14961</a> and in FontLab's forum about Cleartype hinting. </p>
      <p>I am hinting new Devanagari font using MS VTT application. The question was - how to modify Font program to be able to make deltas for Cleartype only. Horizontal hints are mostly ignored in Cleartype and function 77 (delta instructions) is the only way to correct horizontal position of points. Cleartype is now actually the default rasterizer for LCD monitors and this makes this question very important.</p>
      <p>In this paper it is described that this is possible. But how to make this - is clear only for software engineers. I've read the information about rasterizer selectors and return values which can be found in this paper and in TTF specification but didn't understand how to modify function 84 (getinfo) definition to make this possible.</p>
      <p>Maybe somebody can say in simple words for a font designer - which text to change in Font Program to be able to make deltas for Cleartype, Black and Greyscale separately and in general. </p>
      <p>In this paper it is also recommended to use<br>
      #PUSH 4,3<br>
      INSTCTRL[]<br>
      in prep program in new fonts. This makes ordinary deltas to work in Cleartype as in BW and Greyscale. Maybe this is a choice if the font is designed for Cleartype only. But this is not a solution in my case. </p>
      <p>I hope that somebody will help me and my anusvAra sing will at least look like dot and not like line:)</p>
