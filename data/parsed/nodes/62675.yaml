      <p>Okay, David, so the output grid is ppm, i.e. whole pixels per em. Works great for aliased rendering and, as I wrote above, in the case of aliased type the output grid is identical to the scalar grid and everyone is happy (except designers who want fonts to look like typefaces and not like toddlers' building blocks). But subpixel rendering, by its nature, addresses something other than whole pixels, which means that the scalar grid isn't identical to the output grid. Throw in non-linear supersampling for subpixel colour filtering, and the scalar grid has moved so far away from the output grid that there seems to me an unbridgeable gap between them. This is the bit where I think we are agreeing, in case you missed it. The TT hinting model, no matter how we think about it in terms of output grid, is implemented via the scalar grid and ’twas ever so. As soon as the scalar grid diverges from the output grid, hinting instructions no longer apply to the output grid. This makes a whole pile of hints either ineffective or unpredictable in their result. This is the other bit where I think we are agreeing, in case you missed it.</p>
      <p>One response to this is to say that the scalar grid should never diverge from the output grid. But I can hear that horse heading toward the horizon and the barn door is falling off its hinges.</p>
      <p>Another response to this is to say that since a whole pile of hints no longer do what they used to do, let's ignore all hints completely and just antialias the shit out of everything. Apple call this Quartz, as if the fuzzy-bear type had anything in common with the sharpness and clarity of crystals.</p>
      <p>Microsoft's response has been that some hints are worth preserving -- since they help retain stroke density; something that Mac rendering fails at consistently --, and Greg's white paper suggests we can have our cake and eat it: that we can turn back on the hints that are disabled for legacy fonts. But it seems to me that even if you turn those hints back on, they a) won't do what they used to do and b) trying to get them to do anything specific will be next to impossible, especially once subpixel positioning is thrown into the mix.</p>
      <p>Greg, has anyone to your knowledge actually made any fonts that use x-direction deltas in CT?</p>
