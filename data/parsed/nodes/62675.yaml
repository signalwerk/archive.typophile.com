      <p><em>But assuming there is total instructional control over location of features, sub-pixels can be carefully or wontonly used to represent features better around correct counters and spaces, or make garbage.</em></p>
      <p>Here's the problem as I see it:</p>
      <p>ClearType's crown jewels are the colour filtering, and that relies in part on non-linear supersampling. The colour filtering enables Microsoft to retain stroke density, and also to provide users with the ability to tune ClearType rendering. But in order to do the colour filtering they need to supersample in the x-direction so that they can differentially address the R G and B subpixels. Supersampling to a 16 unit scalar grid enables them to assign more units to the G subpixel than to the R, and least to the B --8, 5 and 3, respectively --, and this reflects average human colour sensitivity: presumably for evolutionary reasons, we are sensitive to more shades of green than to other colours. So the colour filtering is important, and the differential addressing of subpixels -- and hence non-linear supersampling -- is important.</p>
      <p>So in order for a font maker to have ‘total instructional control over location of features’, that non-linear scalar grid needs to be broken down into sections that relate to actual subpixels, since the location of features is ultimately rendered in a subpixel output grid. So that's a practical difficulty for a hinter. It isn't insurmountable, but it increases the hinting brain hurt, because the distance an x-direction feature needs to be moved across the non-linear scalar grid depends on what part of the grid it is in: if it is in the G section, it needs to move further than if it is in the R or B section. Then, presuming that the hinter has wrapped his head around this, subpixel positioning is thrown into the mix, which means that you can't anticipate in which section of the scalar grid an outline will fall, because the output grid now consists of subpixels <em>from different pixels.</em></p>
      <p>This is why I am intrigued to know whether anyone, even within MS, has actually made a font that attempts to apply total instructional control in the ClearType x-direction. Greg's white paper explains what needs to be done inside a font to enable the full set of hinting controls, but it doesn't demonstrate that having those controls turned on actually helps anyone.</p>
    html_clean: |-
