    user: 5095
    date: 2009-10-16T16:58:00
    date_raw: 16.Oct.2009 4.58pm
    votes: null
    html: |-
      <p>DB&gt; <em>The grid I am talking about, and ’we designers’ are concerned with, is the output grid, not what the scaler dreams.</em></p>
      <p>There are many possible “output grids.” Some are hardware related, some are perceptual related, and I suppose that some could be scaler dreams. The grid we chose, I believe, gives us reasonably fine level perceptual control of the image.<br>
      I highly recommend reading a paper by Jim Blinn: <a class="freelinking external" href="http://academic.research.microsoft.com/Paper/1594436.aspx "> What Is a Pixel?</a> This gives a great overview on the basics of computer graphics and the multiple definitions of a pixel.</p>
      <p>DB&gt; <em>It makes less no sense to have more or less precision with the rounding than the actual output grid, but please... show me your “fine tuned” ClearType.</em></p>
      <p>Again this depends on your definition of output grid, but I will make the assertion that by rounding to our grid you change both the physical and visual manifestation of the data. If you were to round up or down to the next grid location, it would be visibly detectable. (Granted it might take excellent visual acuity, but that can be the case in high-resolution bi-level rendering as well.)</p>
      <p>JH&gt; <em>Better to say that the notion of ‘the grid’ as a singular phenomenon no longer pertains. From the rendering side, I can see how ‘the grid’ might always have been understood to be the scalar grid, which coincidentally was for a long time identical to the output grid.</em></p>
      <p>It is not clear to me that the notion of ‘the grid’ as a singular phenomenon was ever a stable definition. The definition of a pixel is hard enough.</p>
      <p>JH&gt; <em>Realistically, Greg, how is a type designer/hinter supposed to target a 3-subpixel output grid via a 16-unit scalar grid, especially since the sampling of that scalar grid is non-uniformly applied to the different subpixel colours, and with subpixel positioning the outlines may fall relative to different subpixel boundaries?</em></p>
      <p>The first generation of ClearType used the non-uniform subpixel color implementation. The current implementation is uniform with two virtual subpixels in the ClearType direction for each real subpixel.</p>
      <p>I did not elaborate on this topic in the whitepaper because it was not directly related to the topic of instruction-set compatibility. At the scaler level we apply the sixteen-unit scalar grid. During the scan-conversion process we sample at six units per pixel in the ClearType direction. At first we wondered if this sampling dichotomy would be problematic, but we’ve found no indications of problems related to that decision.</p>
      <p>JH&gt;  <em>If using compatible, whole-pixel positioning, I can see how delta hints could be applied something like impressionist painting, adjusting until one gets the shape proportions and stroke density one wants — with the caveat that due to gamma and CT tuning this may not be what other users see —, but once one shifts to subpixel positioning, all bets seem to be off.</em></p>
      <p>You are correct, fine tuning the shape works fine in the modes we call “natural width” or “compatible width” ClearType, but with sub-pixel positioning, it is a much greater challenge for fine tuning. This is one of the reasons we provide <a class="freelinking external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035732">GETINFO</a> with information to help the hinter make the best conditional implementation necessary.</p>
      <p>JH&gt; <em>The hybrid CT/greyscale antialiasing in WPF should have been default in Vista CT. Will it be in Office 7?</em></p>
      <p>Windows Vista contains several different graphics rendering platforms—GDI, GDI+, and WPF.  Symmetrically smoothed ClearType is only available on the WPF platform. Vista has no concept of a default rendering platform, it is up to each application to choose the rendering platform. I won’t speculate on what platform(s) the next version of Office (Office 2010) will use.</p>
      <p>DB&gt; <em>Microsoft claims here that because some fonts hinted for aliased rendering include exploding points as a result of diagonal instructions gone wild, the (published) cntrlinst option in ClearType needed to address an imaginary output-independent grid gone wild and ignore the x and d instructions.</em></p>
      <p>In the section of the whitepaper on <a class="freelinking external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035718">ClearType Interaction with TrueType Instructions</a> I discuss “exploding points” which are typically caused by the PV and FV becoming perpendicular. This is not a ClearType problem per se, as it can happen with any type of hints, but the problem becomes more exasperated when extreme aspect ratios are used. This is why we use super-sampling instead of over-sampling in the ClearType instructions. This issue, though, has nothing to do with the “cntrlinst” [INSTCTRL] issue—it is merely background information.</p>
      <p>DB&gt; <em>And as it likel was strictly hinted for widths, its compatible horizontal metrics can only be reached today with Windows anti-aliasing if that font is scaled by TT’s undocumented cntrlinst set to “compatible”.</em></p>
      <p>It’s not clear to me what you are talking about here. If you are referencing the <a class="freelinking external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035734">compatible widths mode</a> that I briefly mention in the paper, that is not changeable by the font program, that is set by the application. A different rendering method is used in the compatible width case.</p>
      <p>DB&gt; <em>…if these exploding points were in legacy fonts on legacy metrics that should only be scaled by the “Compatible” option, why destroy the 1:1 relationship between the truetype instruction and the output grid in the “Natural” option?</em></p>
      <p>If I understand you correctly, I don’t believe that the “Natural” option you describe would have a 1:1 relationship with the TrueType instruction. The “natural option” (natural widths) would still not use the same “output grid” as bi-level rendering. </p>
      <p>DB&gt; <em>Shouldn’t all and any fonts that even bother a wit for SDPVTL, (the incredibly obscure exploding instruction), be treated to “Compatible” scaling in CT, and the other mode just listen to all the instructions?</em></p>
      <p>SDPVTL is not they only instruction that can cause “exploding” points. Any setting of the PV perpendicular to the FV can cause this situation.</p>
      <p>JH&gt; <em>Greg, has anyone to your knowledge actually made any fonts that use x-direction deltas in CT?</em></p>
      <p>We have spent a lot of time exploring this area, and we actually make significant use of these instructions to fine tune the appearance of ClearType.</p>
      <p>JH&gt;&gt; <em>But sub-pixel rendering, by its nature, addresses something other than whole pixels, which means that the scalar grid isn’t identical to the output grid.</em><br>
      DB&gt; <em>Not precisely. It means that sub-pixel rendering is finer than the hinting’s grid, and the user’s color specification, But assuming there is total instructional control over location of features, sub-pixels can be carefully or wontonly used to represent features better around correct counters and spaces, or make garbage.</em></p>
      <p>I believe that the way I’ve described the ClearType system full allows for “total instructional control over location of features.”</p>
      <p>JH&gt; <em>Supersampling to a 16 unit scalar grid enables them to assign more units to the G subpixel than to the R, and least to the B —8, 5 and 3, respectively —, and this reflects average human colour sensitivity: presumably for evolutionary reasons, we are sensitive to more shades of green than to other colours. So the colour filtering is important, and the differential addressing of subpixels — and hence non-linear supersampling — is important.</em></p>
      <p>I want to make sure that my earlier comment is made clear. The scaling and hinting engines use a 16 unit scalar grid. The scan conversion engine uses a 6 unit grid—two for each subpixel.</p>
      <p>DB&gt; <em>I want to say here that up until 2004, I was a universally peaceful and caring member of this industry with good relations all around and no reason to criticize anyone’s typographic beliefs, typographic work or typographic origins. Anyone who’s known me before and after 2004, knows this to be true. :)</em></p>
      <p>I’ll concur :-)</p>
