    html: <p>Just one example - my greatest problem is a dot (anusvAra, nukta etc. signs). It has (and must have) a shape of rhomb. It is almost twice larger then vertical and horizontal stems. In large sizes this difference is not so clear because of the shape. But in small sizes it naturally takes 2 pixels when stems are 1 pixel. And it is square form and I have to correct this and reduce it's size in small sizes until it will take the shape of rhomb. In Cleartype this correction works only in y direction - so I have the shape of line or triangle. If I reduce the size of dot to the size of the stem - the problem will accure in large sizes and in print. If to use ordinary deltas for correction this in turn will effect the shape in BW and Grey renderings so I have to correct this in turn by BW-only and Grey-only deltas. There will be too many deltas just for one dot (and I have many others). I tried other ways and have some more or less acceptable result but this shape in Cleartype definitely looks bad in many sizes.</p>
