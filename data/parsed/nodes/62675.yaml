    html: <p>The need of Cleartype only deltas is caused by the natural desire to control (just a little bit) x direction and there are no other means to do this then deltas and moves (horizontal cvt and cvt deltas do not work). If we simply switch on ordinary deltas (#PUSH 4,3 INSTCTRL[]) for Cleartype this not only does not resolve these problems but creates some new difficulties because these deltas have effect on other rasterizers also which do not ignore x instructions. This is a choice only in that case if one do not care about other rasterizers (if font is designed for Cleartype only). It is not convenient at all to correct x problems in Cleartype by general deltas and then again correct these effects by Black and Grey deltas.</p>
