      <p>David,<br>
      I think the <a class="freelinking external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035739">conclusion</a> of the whitepaper made it clear that the recommended solution is <em>not</em> to “…hint as you normally would, but without post-interpolation deltas….” The conclusion recommends that the font place the sequence<br>
      <code><br>
      #PUSH 4,3<br>
      INSTCTRL[]<br>
      </code><br>
      At the beginning of the CVT program. When this is done, there are no restrictions on any of the TrueType instructions. That said, the resolution is different when operating with ClearType turned on—but that is similar to other technologies that TrueType has dealt with in the past, such as non-square pixels on screens and printers. The GETINFO instruction can be used to determine if ClearType is being used.</p>
