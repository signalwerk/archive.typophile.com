      <p>Greg: <em>The first generation of ClearType used the non-uniform subpixel color implementation. The current implementation is uniform with two virtual subpixels in the ClearType direction for each real subpixel.</em></p>
      <p>I did not elaborate on this topic in the whitepaper because it was not directly related to the topic of instruction-set compatibility. At the scaler level we apply the sixteen-unit scalar grid. During the scan-conversion process we sample at six units per pixel in the ClearType direction.</p>
      <p>That brings your grid back to something resembling what David and I would recognise as an output grid, certainly to something to which it would be easier to hint than a 16 unit non-linear grid.</p>
