      <p>Thanks for all that input, it was really helpful. This apparent change of topic does not mean I'm giving up on getting the compatible option of ClearType documented. I just found a more fundamental issue to address. </p>
      <p>GregH&gt; The grid we chose, I believe, gives us reasonably fine level perceptual control of the image.</p>
      <p>I'm sure it does, when imaging. But, "imaging" theories and theorists are making a fundamental error — assuming that there is only the imaging pixel down to the base of the resolution spectrum. Cleartype's one documented option of scaling is a perfectly clear example of this, where the imaging pixel takes over the grid from the typographic pixel and the typographic theories on scaling and rendering. That is not working reasonably fine for everyone, has not from the beginning, and now more fonts are needed, in abundance. </p>
      <p>Geeze... Just because imaging works most of the time, does not mean it works all of the time. And where it doesn't work, is down here where <em>all</em> the pixels matter. Then, a harmony of grids' needs to be established where the imaging grid is taking orders from the typographic grid, not the other way around. Proof of this need (in Microsoft's own practice), is found in diversity: the y axis of ClearType seems to work fine in typographic pixels, not imaging pixels, and the writer of the "What's a Pixel?" most likely wrote that paper on an OS which had a perfectly good grasp of typographic pixels in both dimensions, (assuming, like most older engineering-backgrounded users, he wrote his white paper on XP with smoothing turned off in a monospaced font?).</p>
      <p>We would like an unconstrained option to address your users with what you might consider extra-reasonable levels of perceptual control of the type, but they do not.</p>
      <p>Cheers!</p>
    html_clean: |-
