      <p>&gt;  GH&gt;When this is done, there are no restrictions on any of the TrueType instructions.<br>
      <strong>DB&gt;</strong> Which is to say they can be interpreted, but wrongly. When I say mirp and round a<br>
      <strong>DB&gt;</strong> stem bound to the grid, if your interpreter don’t, that’s restriction.</p>
      <p>David, that is incorrect. It does round the stem <em>to the grid.</em> The <a class="freelinking external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035719">grid</a> is exactly as I describe in the paper, a sixteenth of a pixel in the ClearType-direction (usually the x-axis.) This leaves you with a quarter of a grid fractional hinting left. It would make no sense to have less precision with the rounding because then you would not be able to fine tune anything. </p>
      <p>Given the power of the TrueType interpreter, if you are unhappy with this level of precision, you can develop functions to implement different rounding methods.</p>
      <p><strong>svayambhu&gt;</strong> If you wish to make deltas that are specific for ClearType, you need to conditionally apply those deltas using information from the <a class="freelinking external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035732">GETINFO instruction</a>.</p>
