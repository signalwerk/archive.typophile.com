  - id: 373520
    user: 5095
    date: 2009-10-16T17:19:00
    date_raw: 16.Oct.2009 5.19pm
    votes: null
    html: |-
      <p>Greg &gt;<em>If you wish to make deltas that are specific for ClearType, you need to conditionally apply those deltas using information from the GETINFO instruction.</em><br>
      Svayambhu&gt; <em>It is clear. But how? Can you help me and write the code of function 84 definition that will make this possible?. Or if it is some kind of MS professional secret, why to advise others to use it? Or where it is possible to find more information about this to try to solve this problem myself? I understand the logic of the function GETINFO definition but I have not enough information to modify it correctly.</em></p>
      <p>Function 84 is specific to Visual TrueType and how it implements resolution dependent hinting. My replies are more generically targeted for how to implement resolution dependent hinting in the TrueType instruction set.</p>
      <p>I describe the <a class="freelinking external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035733">GETINFO ClearType Flag</a> in the paper. The important parts are setting the selector and checking the return value. The selector for the ClearType flag is bit 6 and the return is in bit 13. Example code could look like this:</p>
      <p><code><br>
      #PUSH, 64  /* Bit number 6 is set */<br>
      GETINFO[]<br>
      #PUSH, 8192  /* Bit number 13 is set */<br>
      IF[]<br>
      ….<br>
      Do ClearType specific hints<br>
      …<br>
      EIF[] /* You could add an ELSE[] for non-ClearType instructions */<br>
      </code></p>
      <p>Now, since ClearType is not available on all releases of the TrueType rasterizer, it is best to also add conditional code that verifies you are using a version of TrueType that supports ClearType. Rasterizer versions 36 and greater (but not larger than 64) is OK. Usually this extra overhead is best handled as a function.</p>
    html_clean: |-
      <p>Greg &gt;<em>If you wish to make deltas that are specific for ClearType, you need to conditionally apply those deltas using information from the GETINFO instruction.</em><br>
      Svayambhu&gt; <em>It is clear. But how? Can you help me and write the code of function 84 definition that will make this possible?. Or if it is some kind of MS professional secret, why to advise others to use it? Or where it is possible to find more information about this to try to solve this problem myself? I understand the logic of the function GETINFO definition but I have not enough information to modify it correctly.</em></p>
      <p>Function 84 is specific to Visual TrueType and how it implements resolution dependent hinting. My replies are more generically targeted for how to implement resolution dependent hinting in the TrueType instruction set.</p>
      <p>I describe the <a class="freelinking external link-external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035733">GETINFO ClearType Flag</a> in the paper. The important parts are setting the selector and checking the return value. The selector for the ClearType flag is bit 6 and the return is in bit 13. Example code could look like this:</p>
      <p><code><br>
      #PUSH, 64  /* Bit number 6 is set */<br>
      GETINFO[]<br>
      #PUSH, 8192  /* Bit number 13 is set */<br>
      IF[]<br>
      ….<br>
      Do ClearType specific hints<br>
      …<br>
      EIF[] /* You could add an ELSE[] for non-ClearType instructions */<br>
      </code></p>
      <p>Now, since ClearType is not available on all releases of the TrueType rasterizer, it is best to also add conditional code that verifies you are using a version of TrueType that supports ClearType. Rasterizer versions 36 and greater (but not larger than 64) is OK. Usually this extra overhead is best handled as a function.</p>
