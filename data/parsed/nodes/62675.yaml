      <p>David, the fact that you think the reasons MS consider supersampling are ‘bull’ doesn't alter my analysis of the problem that supersampling introduces. If I agreed with you 100%, that wouldn't alter the analysis of the problem either. This is how CT works. If your argument is simply that CT shouldn't exist, or shouldn't work the way it does, then debating whether and how x-direction hints are re-enabled isn't the conversation we need to be having.</p>
      <p><em>You QA’d and managed the only CT font project of all time, five years ago (?) They never looked, and you never looked, ( I know, I asked. MS said “it’s too hard”).</em></p>
      <p>Right. That was five years ago, and lack of x-direction deltas was a given for that project. There was no talk at that stage, at least not shared with the CT collection designers, of mechanisms to re-enable those instructions. So this is why I am asking Greg now, now that such mechanisms are being presented, whether in the intervening time anyone has tried to make a font in this way.</p>
