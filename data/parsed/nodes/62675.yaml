      <p>David, for clarity, is the horizontal ‘output grid’ on an RGB LCD screen a pixel or a third of a pixel?</p>
      <p>We have a divergence of the scalar grid from the output grid (I'm using these terms for ease of reference to the preceding discussion; perhaps other terms are more technically accurate?), so it seems pointless to insist that one or other application of the single phrase ‘the grid’ is correct. Better to say that the notion of ‘the grid’ as a singular phenomenon no longer pertains. From the rendering side, I can see how ‘the grid’ might always have been understood to be the scalar grid, which coincidentally was for a long time identical to the output grid. From the font making side, I can see how ‘the grid’ might always have been understood to be the output grid, which was happily for a long time identical to the scalar grid.</p>
      <p>Realistically, Greg, how is a type designer/hinter supposed to target a 3-subpixel output grid via a 16-unit scalar grid, especially since the sampling of that scalar grid is non-uniformly applied to the different subpixel colours, and with subpixel positioning the outlines may fall relative to different subpixel boundaries? If using compatible, whole-pixel positioning, I can see how delta hints could be applied something like impressionist painting, adjusting until one gets the shape proportions and stroke density one wants -- with the caveat that due to gamma and CT tuning this may not be what other users see --, but once one shifts to subpixel positioning, all bets seem to be off.</p>
      <p>The most obvious solution to the proportional problem affecting Mihail's anusvara and nukta is y-direction greyscaling. I know this because similar dot shapes occur in some projects on which I am working, and I am testing rendering in WPF. The hybrid CT/greyscale antialiasing in WPF should have been default in Vista CT. Will it be in Office 7?</p>
