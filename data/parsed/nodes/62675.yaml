      <p>Here is a sample image that addresses one of David’s points and one of John’s requests.</p>
      <p>The image is similar to the above image (although not shown from VTT.) Instead of using SHPIX, I used the MIRP to shift the left edges. (I also made a version that does the same with the MSIRP instruction.) I’m moving the edge relative to the left side bearing point. The images with MIRP, MSIRP and SHPIX are exactly the same in VTT. </p>
      <p>I made an additional change in the hints by setting the advance width to be 3 1/6 pixels wide. This forces a shift when displaying in sub-pixel positioned ClearType mode. In the above image you can see the pattern repeats every six glyphs.</p>
      <p>David&gt; <em>One correction that may help the reader here, is “the left edge of the contour was shifted to the right by four pixel units”, should read, I believe, “the left edge of the contour was shifted to the right by 4/64ths of a pixel.”</em></p>
      <p>I agree that is better wording.</p>
      <p>David&gt; <em>And then, there is the interesting question of why any baby yellow or baby blue is showing up at all as those pixels are entirely not within by the contour being rendered.</em></p>
      <p>This has to do with filtering, and is described in detail in our <a class="freelinking external" href="http://research.microsoft.com/en-us/projects/cleartype/default.aspx">papers on ClearType.</a>   The primary purpose of the ClearType filter is to remove the perception of color. This, in theory, is potentially a tunable parameter. But the font hinter cannot rely on what tuning parameter the user has chosen. Additional factors like the foreground and background colors, gamma correct, and of course the display system architecture are going to impact what is emitted by each display sub-pixel. So, big picture, when adjusting the edges, you need to proof the result closely, and verify the visual results (which I know you already do.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ClearType Subpixel Shift SPP_6265.png"></div><p></p>
