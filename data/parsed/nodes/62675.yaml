      <p>&gt; I can see how ‘the grid’ might always have been understood to be the output grid, which was happily for a long time identical to the scalar grid.</p>
      <p>Uh Oh, looks we have a newly constrained definition. . . John, lol, sub pixels have been around for a very very long time. Did Matthew design Verdana to the 11 ppm  grid, or 33, or was it 176 ppm... let me think. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tinybigwin_4531.png"></div><br>
      (Verdana in Vista for Ikea)<p></p>
      <p>Do you'all actually think any type designer considers this to be fit to a grid for readability? Nice I, nice, l, nice i, nice o, nice a. See, I can say nice things about CT. Problem is that we crave 26 "nice" per size, per Latin English l.c, per user, or saccade hiccups. The instructing font designer can only, regardless of whatever you might think to define as the grid, address the hints to the output grid(s). </p>
      <p>But let's mosey around this white paper. </p>
      <p>Microsoft claims here that because some fonts hinted for aliased rendering include exploding points as a result of diagonal instructions gone wild, the (published) cntrlinst option in ClearType needed to address an imaginary output-independent grid gone wild and ignore the x and d instructions. Simon of Microsoft showed one ancient picture of such a font, but never listed how many, or who's it was, or anything else about that font.</p>
      <p>One thing is certain about that font — if it was hinted so strictly for aliased rendering, it should also have been hinted strictly for the glyph widths. And as it likel was strictly hinted for widths, its compatible horizontal metrics can only be reached today with Windows anti-aliasing if that font is scaled by TT's undocumented cntrlinst set to "compatible". No?</p>
      <p>There are two diverging points to be made from this. One, is that if Microsoft needed to keep lots of documents compatible, and it needed an option to use widths either from the TT hdmx table in the font, or from the rounding results of something else rendering to the legacy metrics, i.e. other than the metrics CT would yield naturally... don't others too? Don't a lot of people outside of Microsoft need non-MS fonts to be rendered this way? Why is this not documented?</p>
      <p>And the other point is, if these exploding points were in legacy fonts on legacy metrics that should only be scaled by the "Compatible" option, why destroy the 1:1 relationship between the truetype instruction and the output grid in the "Natural" option? Shouldn't all and any fonts that even bother a wit for SDPVTL, (the incredibly obscure exploding instruction), be treated to "Compatible" scaling in CT, and the other mode just listen to all the instructions?</p>
      <p>P &amp; Vinegar under the bridge. So now: where is the "Actual" option that trusts we know what we're doing with both pixels and sub-pixels all by our typographic selves? Why are we constrained to poorer quality than possible in the resolutions we need to go to the web with? Why is the public constrained to quality that ignores the output grid? Why are we, type designers, not permitted to create a standard of quality for our customers that Microsoft and Apple can envy and emulate? </p>
      <p>I've done everything I could to help: pushing customers into "standard" Vista scaling and rendering, pulling others to FreeType, making all the suggestions I could to MS and Apple, and showing hundreds of example fonts. One can redefine the grid to anything one's heart desires, but the circle keeps on closing. The smaller that circle gets, the higher the pressure, the further up this is going to spout, (and the more obvious the 500 lb. boa constrainer in the corner).</p>
      <p>Cheers!</p>
