      <p>The instruction being demonstrated is not, or I should say, was not, used in any of the fonts hinted by me, ever, because it is pixel-based, because it is closer to a delta or exception hint, and because it only uses the freedom vector and not the projection vector, meaning, literally it is not moving relative to anything. I.E. this is not one of the hints we use to make "fonts" that work at small sizes in anti-aliased environs.</p>
      <p>It's not going to help a font through the current assault and battery of screwy sizing, scary scaling and red-faced rendering we, (or some of us) now face. It's like being up to you neck in gators, and someone tickles your foot and says, "Does that help?" (It does: they have not eaten my foot yet). </p>
      <p>One correction that may help the reader here, is "the left edge of the contour was shifted to the right by four pixel units", should read, I believe, "the left edge of the contour was shifted to the right by 4/64ths of a pixel. </p>
      <p>And then, there is the interesting question of why any baby yellow or baby blue is showing up at all as those pixels are entirely not within by the contour being rendered.</p>
      <p>Cheers!</p>
