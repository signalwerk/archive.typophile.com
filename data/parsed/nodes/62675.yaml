      <p>I hope that this white paper stimulates discussion on this issue as Mihail says, Cleartype is now the default Windows scaler and filterer. One of the thickest bottom lines of this paper, I believe, is that Microsoft considers there is 'extra resolution' in the x axis, regardless of the color of that resolution relative to the user's specification of the color of the type. </p>
      <p>So, in this paper, the only documented option for using Cleartype, the x instructions go into Microsoft's patented Cleartype filtering, where thinking they can round to pink pixels, or red, or dark blue, or occasionally, black pixels, is encouraged and the letters stop listening to me. With such disobedience, there is no way I can see to effectively instruct x features for the seemingly ever-present 10 to 27 pixel per em range of Latin, and get both the right quantity of periodic changes across the reading space, and the right quality in the transitions between those changes across the reading space for a wide range of widths, weights and designs. </p>
      <p>Maybe this isn't a problem in Devanagari, though please let us know how it works out as I'm dying to tally the scripts, designs and even glyphs that can and cannot crawl far enough up in quality in this resolution spectrum, to read text as people do. </p>
      <p>My feeling for Latin, is that the user (hundreds of millions actually), is being constrained to fonts that work with this technology, because some fonts made for older technology did not work. So, instead of simply investing in disabling the few offending instructions in a very very small number of fonts, Microsoft invested in a whole bunch of other things that practically 'disable' all of x from a typographic point of view, for the spectrum I describe. Nothing incoherent, mind you, just disabled. :)</p>
      <p>The original ClearType recommendations are still the same as they were on release of the Cleartype Collection in 2004: hint as you normally would, but without post-interpolation deltas, and if you or the users don't like the quality, compel them to find the appearance menu and change all of their OS rendering to "Standard" so our fonts will look better. Is that still right?</p>
      <p>Cheers!</p>
