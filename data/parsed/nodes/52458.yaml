    html: <p>I have no idea who he was, but your Stephanus Mercator would probably have been known in the vernacular as Etienne Mercier, Stefan Kaufmann, or something similar, in case that gives you any clues. According to a library record for what I think is the same edition, this Mercator's printing shop is listed as the publisher, at Pont-à-Mousson in Lorraine.</p>
