    <p>You can get some idea about it here:</p>
    <p><a href="http://www.flickr.com/photos/ebensorkin/sets/72157610848581901/" title="http://www.flickr.com/photos/ebensorkin/sets/72157610848581901/">http://www.flickr.com/photos/ebensorkin/sets/72157610848581901/</a></p>
    <p>I am curious about the type. Anybody have any inside info on who "Stephani Mercatoris" could be? He seems to be credited with having either designed or set the type I can't tell which just yet. I am looking forward to showing it to James Mosley.</p>
    <p>The University of Scranton has this to say about it:</p>
    <p>Ioannis Maldonati Societatis Iesu Theologi : Commentarii in Qvatvor Evangelistas, 1596 is a first edition of an important commentary on the Vulgate Gospels. According to the Catholic Encyclopedia, Maldonado was "superior to most exegetes of his time and inferior to none."</p>
