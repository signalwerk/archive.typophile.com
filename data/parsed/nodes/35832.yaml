      <p>Stephen,<br>
      <a href="http://www.typevents.com/index.php?id=81,0,0,1,0,0" target="_blank" rel="nofollow"> Type Tours </a> of the City of London, organised by Type Events are very good. </p>
      <p>See also:<a a="" rel="nofollow"><br>
      </a><a href="http://typophile.com/node/33877" title="http://typophile.com/node/33877">http://typophile.com/node/33877</a><br>
      <a href="http://typophile.com/node/29958" title="http://typophile.com/node/29958">http://typophile.com/node/29958</a><br>
      <a href="http://www.flickr.com/photos/timbones/sets/72157594392158650/" title="http://www.flickr.com/photos/timbones/sets/72157594392158650/">http://www.flickr.com/photos/timbones/sets/72157594392158650/</a></p>
      <p>BTW, the St. Bride's reading room will be closed for a while. For further information:<br>
      <a href="http://stbride.org/events_education/events/temporaryclosure" title="http://stbride.org/events_education/events/temporaryclosure">http://stbride.org/events_education/events/temporaryclosure</a></p>
      <p>You don't have to sign in at the library. However, in my experience it is best to contact the library first if you have a specific request. Most of the collection is tucked away, as apparently the reading room contains just 7% of their collection.</p>
