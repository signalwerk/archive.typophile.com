    <p>Hello everybody.</p>
    <p>I want to visit London for a few days and wanted to ask if there are any design or typography related places which I should visit. I will definitely visit the Tschichold exhibition at the St. Bride Libray. Therefore I have one more question: Is it possible to visit the library and look through some old books or do I have to sign on.</p>
    <p>greetings: Steven</p>
  html_clean: |-
