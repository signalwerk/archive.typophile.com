    <p>I'm sure this has been asked a million times, but I couldn't find anything on Google, and the search here wasn't working.</p>
    <p>I have a font that is available to download for free for non-commercial work at dafont.com. Someone just asked if they could use the font for a logo for a restaurant. I really don't know how much I should charge. Being that it will be in a logo makes me think it should be relatively higher priced than if it was being used for a t-shirt or something. Any ideas on an average price to ask?</p>
