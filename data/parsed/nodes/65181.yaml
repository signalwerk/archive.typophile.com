    <p>Hi,</p>
    <p>I’m working on a project where I want to pair a good British serif (I’ve already opted for Adobe Caslon Pro) with a good American sans serif. The content I’m working with requires both be able to handle small caps. Not a problem for Caslon Pro, but I was working with Franklin Gothic up until I realised it doesn’t have small caps, well not the version I have anyway.</p>
    <p>Would anyone care to recommend some to me? I’d be very grateful if you could.</p>
    <p>Thanks very much.</p>
    <p>Jono</p>
  html_clean: |-
