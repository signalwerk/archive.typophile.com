      <p>Hi Nick,</p>
      <p>You really know your stuff. Thanks very much for your suggestions, but I’m not sure the humanised geometrics you suggested are right for my project, which has a strong political/international law base to the content. As much as I love a low-waisted art deco face, I think they wouldn’t suit my content. Thanks though! </p>
      <p>Something like Benton or Alright would be quite nice as my content is focusing on the political climate of the past ten years as a result of the war on terror, and those sans are quite recent. I might well end up choosing a European sans if it gives me the flexibility I need, but the project is for an ISTD brief and I really want to have informed choices and not just pick a font because I like it.</p>
