    html: |-
      <p>If any version of Caslon qualifies as English, then surely American grotesques must also, as the grotesque style originated in England.</p>
      <p>What style of sans originated in the US?<br>
      How about the “humanized geometric”? e.g. Dwiggins’ Metro or Bernhard Gothic? (Admittedly Bernhard/Kahn was German, but the face was published in the US while he was living and working there.)<br>
      Or perhaps “low-waisted art deco”, seen now in Neutraface.<br>
      Also consider ITC Highlander, by Brit Dave Farey, but closely based on the lettering of Oz Cooper.</p>
    html_clean: |-
