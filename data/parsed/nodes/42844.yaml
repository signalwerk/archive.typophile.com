      <p>Maybe you shoud try to emphasize a little more on the image usage in case you try to convey the fun and the serious part of a society. Although i think that there is an opposite heracy between the topic and the secondary informations such as date and time. I would suggest to use one primary, first level reading size for the topic, and a secondary, smaller one of all the secondary informations by using some other weights from HTF Knockout (combining for example HTF Knockout70 FullWelterwt and HTF Knockout30 JuniorWelterwt, or using the Upercases in some cases also)</p>
      <p>P.S. What's the real size of the poster?</p>
      <p>Dimitris Papazoglou</p><div class="imageWrap"><img src="http://typophile.com/files/Knockout_3789.jpg"></div><p></p>
