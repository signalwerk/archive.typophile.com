    <p>Hello typo nuts!</p>
    <p>I've made this poster for a public debate society, called <a class="freelinking external" href="http://www.hvadharvigangi.dk/" rel="nofollow">Hvadharvigangi</a> ("What are we doing?"). It's meant to hang around in universities, libraries and the like to draw attention to the monthly debates. I've tried to convey a both fun and serious mood, because that defines the society: serious topics (this particular one: "Genetics and ethics"), presented and debated in a friendly and "fun" way.</p>
    <p>I recognize that you won't understand much of the text, because it's set in Danish. But I hope I can get some feedback on the overall layout/composition anyway. I'll be happy to explain anything in the text that might be important.</p>
    <p>My main concern is the potential over-use of different sizes in type. It might appear a bit too messy. What do you think? The font is <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100013" rel="nofollow">Knockout</a> + a wee <a class="freelinking external" href="http://www.underware.nl/site2/index.php3?id1=auto&amp;id2=overview" rel="nofollow">Auto</a></p>
    <p>Also, the header is my additional proposal for a <em>new logo</em>. So this element is important in it self. <a class="freelinking external" href="http://www.hvadharvigangi.dk/" rel="nofollow">Their old logo</a> appears at the top of their webpage.</p>
    <p>I've attached 3 similar variations of the poster.</p>
    <p>Thank you so much!</p>
    <p>p.s. The picture is just an example of how I want the future ones to be placed and cut. This one is completely irrelevant to genetics obvisouly</p>
