      <p>Jumping in here late in the game:</p>
      <p>My opinion is that as a designer, a wide range of faces with which to execute your work is necessary. Optima is something you should own. The client should not pay for it, because you can use it whenever you want, for whomever you want. If it were a very obscure font that were only to be used with a specific client's work, then I would perhaps make it clear to them I have to bill them for the face.</p>
      <p>I also run a printing business. Often I take on jobs in which a stock colour of ink will be required that I do not inventory. I buy the ink and print the job, usually using 2-5% of a can of ink. The cost of the ink was higher than the income I've brought in from the job, and I don't have any work lined up for use with that ink, but I can make money off it in the future and my client should not pay for that. Doubly so for a typeface because it never runs out!</p>
      <p>In short: I would consider the expense of Optima outside of the profit/loss calculation you're doing for this job.</p>
