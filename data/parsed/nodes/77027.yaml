      <p>@lindenhayn: If I understand the AFPL correctly, commercial <em>use</em> is OK ("Activities other than copying, distribution and modification of the Program are not subject to this License and they are outside its scope."), but <em>selling</em> AFPL-covered materiel is No Go. That would mean that <em>using</em> the AFPL-covered URW Classico for commercial purposes should be OK.</p>
      <p>Oh, and talking of URW Classico... ADF (Arkandis Digital Foundry) has a style kit for it, URW Garamond No8 and URW Palladio that adds smallcaps and old-style figures.</p>
      <p>If I am wrong, the very similar Linux Biolinum may be an acceptable substitute. That one is dual-licensed: GPL/OFL.</p>
