      <p>Opus does look very similar to Optima (95%?). Check it's got all the glyphs you'll need though.</p>
      <p>Re licence, it will depend on how many licences the client has for Optima. When I license fonts, I usually buy 'up to 5 machines' so I can send fonts to our design agency or printers if needed. The client needs to know how many licences they hold and whether they're site licences or machine licenses. If they have the EULA, read that to see if they're allowed to send it to their printers/designers...you can always uninstall it afterwards.</p>
