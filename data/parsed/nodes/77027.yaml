      <p>Is your client going to ask you for a copy of the native file (InDesign or whatever) in addition to a PDF at the end of the project? If so, it might be risky to substitute a similar-but-cheaper font without telling them.  Your client would be annoyed if they tried to open the files later and got a "font not found" message, and they realized you didn't use their official font but instead substituted a font they don't own.</p>
      <p>Another possible approach -- although this would be somewhat unwieldy -- would be to prepare the job using a different font and then ask a friend who owned Optima to let you use their computer for a few minutes while you change the fonts to Optima and make a PDF.</p>
