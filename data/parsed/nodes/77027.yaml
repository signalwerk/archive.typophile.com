    html: |-
      <p>Unfortunately, your client's license does not permit you to use Optima. Your client most likely has a license to use Optima on a specific number of computers, at his office's location. If you did the work on one of his computers, in his office, you would be covered. If you did the work on one of his computers outside of the office (like on one of his laptops), you would probably also be covered. But you cannot acquire the font from him (or from someone else who might have it) and be covered by his EULA.</p>
      <p>I think that you have three (legal) options in this case: First, you could license just the fonts that you need for this one email blast. Second, you could use a typeface very similar to Optima, like one of the ones mentioned above. Third, you could opt not to do the work for the client. If you absolutely have to buy the fonts, and the client is paying you less than the cost of those fonts for the work, then this project is not economically viable. You should not do work for a client at a loss (unless, perhaps, you think that you might get more work from the client in the future, and you can afford the loss of time and funds at the moment).</p>
