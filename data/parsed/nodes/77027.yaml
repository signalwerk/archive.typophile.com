      <p>Bert Vanderveen:<br>
      <cite>The older digital versions of Optima lack the subtle curves in stems etc. of the original</cite><br>
      This is interesting. What I heard and remembered - which may well be wrong - was that while the tapered curves of the original Optima <em>were</em> included in the font outlines of even the earliest Type 1 and TrueType renderings of Optima, since the taper was subtle, it didn't show up properly on the printed page... due to the puny 300dpi resolution of the laser printers at the time.</p>
      <p>That is not to say that processing power, or something like it, wouldn't have been an issue. Hinting algorithms embodied within the fonts themselves dealt with making sure that character alignment didn't do violence to the widths of stems in screen display and things like that. For the subtle taper of Optima, instead of dragging boundaries to the nearest pixel boundary, while one might drag the base of the curve there, what one then needs to do is dither the dots to represent the boundary's gradual tapered movement.</p>
      <p>That may not have been anticipated - leading to Hermann Zapf designing a successor to Optima for laser printer applications that didn't have the taper. The name of which I don't recall off the top of my head.</p>
