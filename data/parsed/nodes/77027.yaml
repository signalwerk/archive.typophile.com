  html: |-
    <p>I picked up a client that uses Optima as their standard face. Despite it's ubiquity, I don't actually own Optima. It's a small email blast, so billing for the font would send the client elsewhere. Likewise, purchasing the Optima family would negate my profits.</p>
    <p>Is there an ethical and legal solution here that still lets me make money on the project?</p>
    <p>Can I obtain and use Optima for free (like a printer does) for use solely on this project because the client has already purchased it?</p>
    <p>Any ideas out there?</p>
    <p>Thanks,<br>
    Kenny</p>
