    date_raw: 11 May 2003 — 1:19am
    votes: null
    html: <p>Bodoni is not a good coice for a Logo that could -- e.g. if your company acts as a sponsor for something -- always end up being printed rather small. If you keep the Bodoni, you should manually work a bit on the hairlines to make the stand out more, maybe come up with different versions of the logo for different sizes of usage, as Stephen suggested. <br>Also, Helvetica and Bodoni, although the pair looks good here, is a bad mix, as both types share the same classical background, both having rather static forms. If you WANT that, great... but if not you could try a sans-serif-typeface that has a constructed character, such as Futura or Century or Neutraface, which has wonderful upper case letters :-D. The constructed geometric should make a nice contrast to the static, but still not fully non-human look of the bodoni. An american-goth type like Franklin or, even worse, a sans-serif based on humanistic renaissance principles (such as Frutiger, Gill et all), is out of the question... the dynamic style would not contrast the stiff but lively Bodoni at all.  <br> <br>What is very nice about mixing Bodoni and Helvetica is the ironic mix of a) two over-used types and b) the clash of a very emotional and a very technical/practical typeface.  <br> <br>Other than that it's classical, simple, the double rectangle motif is something you can play with on brilliantly later-on... it also has a touch of humour. I like it. </p>
