    html: <p>I would say Franklin Gothic. But, I would use a smaller point size and a thinner weight. Uppercase appears also to work best in this instance. For whatever reason, Helvetica appars stuffy and not comfortable with the pairing here. I also agree with Stephen about the thins on your bodoni. Can the client afford two weights? I would recommend ITC Bodoni 72 for larger versions and the 12 for smaller. <br> <br>Bodoni is narrow, here, and the helvetica seems wide. The franklin gothic is of the same width, relatively, with the bodoni. And with the exactness in the bodoni's construction, I would also say that Franklin is more exact, ergo geometric, than is helvetica. It seems the word 'sprit' either needs to line up with then end of the 'L' or not. I'm thinking that perfect alignment might be nicer. <br> <br>Also, if you could use a bodoni with a bit thicker thins there could be more evenness in color. As it is you have three different weights of stroke, the letters have nothing in common. <br> <br>I will say that I really like severity and simplicity of it. And I for one miss the use of the color red. I miss franklin and bodoni as well. I'd say that your client should regret adding 'sprit' if anything that is the problem here not type selection. <br> <br>Very nice. Stick around. The more the merrier.</p>
