  html: "<p>Hello, I am new here at typophile forums, so, please, don't laugh me out right away.. <br> <br>So, there is a logo. Quite....hmm... generic. As generic as the business(es) the company has. Will be applied mostly on stationery and printed matter, as well as web (naturally). That's it. Nothing really \"extraordinaire\". <br>Anyway. Here is the logo: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/10647.gif\" alt=\"image\"> <br> <br>WITAL wording was done earlier. Initially it was meant for being in the upper part alone, as the lower part was meant for the sub-companys (Like, WITAL Air Cargo, for examply, or... WITAL Development, etc). Now that the company merged with another company, the SPRIT wording should go into the upper part. This is exactly where my problems lies. <br>What d'you think?</p>"
