      <p>Some odd things seem to be happening here. The uneven arms of the E (both weight and length) are not usual for slab styles; the bracketing of the serifs seems inconsistent, particularly the middle arm of the E. The G seems to be missing a 'beard'. I searched for freebie serifs, but didn't see this. I searched the Serif Font ID Guide, but couldn't find anything that seemed even close to matching.</p>
      <p>My guess is that this is an amateur customizing job. Are these all the letters you have?</p>
      <p>- Mike Yanega</p>
