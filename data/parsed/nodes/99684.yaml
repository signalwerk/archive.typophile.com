    html: <p>The <strong>BBF</strong> looks like it is based on <a class="freelinking external" href="http://www.fontsy.com/font_details_20116.html" rel="nofollow">Viper Squadron</a> and <strong>BAPTISED</strong> <a class="freelinking external" href="http://www.dafont.com/cgf-locust-resistance.font" rel="nofollow">CGF Locust Resistance</a> which are both free, but the <strong>BY FIRE</strong> line underneath is the commercial font <a class="freelinking external" href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFont&amp;code=ERSQ80005002" rel="nofollow">Eurostile Extended</a>.</p>
