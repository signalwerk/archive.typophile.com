      <p>I've not had to do a decent c/o for a long time and my memory was that superiors were too small and if one made them bigger it was difficult to match the weight of the 'c' to the 'o', but I'll try again ...</p>
      <p>I long ago ceased to need the likes of Freehand, so I suspect that all my apps are OK with OpenType - sorry that I can't help there.</p>
      <p>Cheers, Colin<br>
