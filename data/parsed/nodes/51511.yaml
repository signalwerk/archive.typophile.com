    html: <p>It's not in the ascii set or generally part of most standard fonts. You could compose one in fonts that have superior letters. Some fonts also may include it in extended sets. I think Zapfino has it. My font Memoir at Veer has it as a discretionary ligature. You might want to look up character specimens on sites such as MyFonts, Fontshop or Veer.</p>
