  html: |-
    <p>Hello,</p>
    <p>what is the difference between the "Euro-Currency Sign" and "Euro Sign"? When is which one used? I live in Europe but never heard of the "Euro-Currency Sign" before. I just came across it here: <a href="http://alanwood.net/unicode/currency_symbols.html" title="http://alanwood.net/unicode/currency_symbols.html">http://alanwood.net/unicode/currency_symbols.html</a></p>
    <p>Can someone enlighten me please?</p>
