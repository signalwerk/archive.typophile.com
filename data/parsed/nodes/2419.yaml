  - id: 19540
    user: 2230
    date: 2004-01-16T09:50:00
    date_raw: 16 Jan 2004 — 9:50am
    votes: null
    html: <p>Here's an update.  Thanks for the feedback.  It's helped a lot. <br> <br>As far as lowercase/uppercase.. I decided to stick with the uc U because of the emphasis on the letter U in the mark as well as other campaign related issues that tie into their market. <br> <br>For example, they deal with Universities so the promenent U makes sense for them. <br> <br>Myriad was the favored typeface because of its close resemblence to Frutiger, which was initially appealing due to its clean / symmetrical strokes and its classic nature.  But since Myriad is a bit more friendly, it worked better for their messaging. <br> <br>I wasn't comfortable really changing it because sometimes you can't improve on perfection.  Also, I think uniqueness and memorability can be achieved through orientation, in this case the mark, colors, and layout of the logo. <br> <br>I would still like to hear other views, so please share your thoughts to help me make whatever improvements I can before this goes live. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/24267.jpg" alt=""></p>
    html_clean: <p>Here's an update.  Thanks for the feedback.  It's helped a lot. <br> <br>As far as lowercase/uppercase.. I decided to stick with the uc U because of the emphasis on the letter U in the mark as well as other campaign related issues that tie into their market. <br> <br>For example, they deal with Universities so the promenent U makes sense for them. <br> <br>Myriad was the favored typeface because of its close resemblence to Frutiger, which was initially appealing due to its clean / symmetrical strokes and its classic nature.  But since Myriad is a bit more friendly, it worked better for their messaging. <br> <br>I wasn't comfortable really changing it because sometimes you can't improve on perfection.  Also, I think uniqueness and memorability can be achieved through orientation, in this case the mark, colors, and layout of the logo. <br> <br>I would still like to hear other views, so please share your thoughts to help me make whatever improvements I can before this goes live. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/24267.jpg" alt=""></p>
