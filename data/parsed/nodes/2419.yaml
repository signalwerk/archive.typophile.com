    date: 2004-01-19T09:22:00
    date_raw: 19 Jan 2004 — 9:22am
    votes: null
    html: <p>I think Chritian might be right. It would seem that either the logo mark and logo type need to be connected somehow (maybe some alternative positioning) or their needs to be some unifying element (maybe the suggested weight association, I don't think the color is enough to do the trick here). If you do try to optically match the weight of the white stroke and the type, then it could probably most successfully be accomplished by a combination of lightening the type weight and decreasing the overall typesize. As it appears right now, the mark and type are competing a little for attention, rather than combining to make a strong logo. You are fortunate to have a typophile like Christian to catch this, because I was too blind to see it at first. <br> <br>Good luck! <br>Scott</p>
