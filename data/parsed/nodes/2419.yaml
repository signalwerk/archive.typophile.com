  html: <p>This is a work in progress.  These guys develop enterprise software for the academic / education industry. <br> <br>Check out their current site to get an idea of where they're at today. <br> <br>The new logo is the first step to a new corporate ID.  They wanted it to reflect an evolutionary step yet to resolve some of the inconsistencies of their existing look. <br> <br>They're looking for something strong, approachable, classic, etc. :-\  Anyway, tell me what you think. <br> <br>Thanks, <br>Nathan <br> <br><img src="http://www.typophile.com/forums/messages/29/22447.jpg" alt="Unicon Logo"></p>
