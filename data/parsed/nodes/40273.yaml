    <p> I’m looking for fonts to go with the project mentioned in <a class="freelinking external" href="http://typophile.com/node/40250" rel="nofollow">this thread</a>: a <a class="freelinking external" href="http://en.wikipedia.org/wiki/Firefly_(TV_series)" rel="nofollow"><em>Firefly</em></a>-related book. The two genres for the book are science fiction and Western, and I’m wondering if there are fonts with a ‘feel’ in both directions.<br>
     Don’t need old-style figures, but I do need book and titling weights, an italic suitable for long runs of text, and a complementary alternate form—a matching sans-serif, perhaps, or at least with a similar x-height and color, but readily distinguishable from the main text. I can fake small capitals if need be. The Gentium Book/Fontin combo I've tried <a class="freelinking external" href="http://typophile.com/files/Hanging Chinese.pdf" rel="nofollow">here</a> doesn't work too well.</p>
    <p> Also, is the Chinese font I’ve used (MS MingLiU) the best choice, or can someone recommend a better Chinese titling font/weight? (I.e., a more calligraphic font, still in Song style.)<br>
    —Joel</p>
