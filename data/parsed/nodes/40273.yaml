      <p>I've always liked Western &amp; Sci-Fi fonts, but trying to find both was certainly a challenge!  I don't know if it's too late, but here are some ideas.<br>
      Some sans-serif faces:<br>
      <a href="http://www.myfonts.com/fonts/mvbfonts/solano-gothic/bold" rel="nofollow">MVB Solano Gothic</a><br>
      <a href="http://www.myfonts.com/fonts/canadatype/social-gothic" rel="nofollow">Social Gothic</a><br>
      And some slab-serif:<br>
      <a href="http://www.myfonts.com/fonts/fontbureau/dispatch" rel="nofollow">Dispatch from Font Bureau</a><br>
      <a href="http://www.myfonts.com/fonts/dstype/anubis" rel="nofollow">Anubis by DSType</a><br>
      <a href="http://www.myfonts.com/fonts/brassfonts/corpa-serif" rel="nofollow">BF Corpa Serif</a> (or Gothic)<br>
      <a href="http://www.myfonts.com/fonts/lanston/ltc-square-face" rel="nofollow">LTC Squareface</a></p>
