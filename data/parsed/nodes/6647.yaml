    html: <p>It looks to me like the sort of bitmap 'fonts' that were used in video games in the 70's and early 80's. I think not much relation to present day fonts, which are much higher resolution. <br> <br>Do a search at MyFonts.com with the word 'Blackletter', and you will see many similar digitial fonts, of much higher quality.</p>
