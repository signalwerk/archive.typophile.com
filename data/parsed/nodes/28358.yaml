      <p>That's funny Tim, I googled the same term "NI logo", but forgot to use the image feature, and instead clicked on a bunch of website links that returned very little in the way of logos.</p>
      <p>Here's my first stab. It's for a B2B company. This probably isn't the right forum for a logo critique, so I'll keep the post to one example only.</p>
      <p>I like this design because it: infers the 'i' using positive and negative space; uses some basic optical illusion techniques to bend an otherwise straight line, and the circle itself creates a sense of movement, and therefore drama.</p>
      <p>However, it makes me think of airliners a bit. :(</p>
      <p>*</p>
      <p>Stephen, I am always excited to receive your feedback. Try as I might, however, I can't seem to get my mojo around the specific direction you describe. Regardless, I'd like to thank you for your suggestions.</p><div class="imageWrap"><img src="http://typophile.com/files/logo3_6113.gif"></div><p></p>
