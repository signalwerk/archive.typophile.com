    html: |-
      <p>Thanks everyone, for your support. Miss Tiffany, I've taken your feedback and revised the logo a bit. I'm sure you intended something slightly different (e.g. the bell-bottom effect of the bottom-diagonal), but overall, thanks to your direction, the new shape is less graphical, and more typographical.</p>
      <p>The hollow version is just and experiment to marry the negative space of the i with the positive space of the n. Further, really like the idea of the contrasting graphical elements: strong, straight verticals in one color, round, hollow shapes in another color, all married together.</p>
      <p>It may be a bit 'art school', but then what do I know; I never went to art school!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo8_3519.gif"></div><p></p>
