      <p>One trick is to use Fontographer -not FontLab- to generate an automatic weight shift and use that in the background as a guide.</p>
      <p>And some rules of thumb: darker weights need more contrast, more width, tighter spacing, and a higher x-height.</p>
      <p>More:<br>
      - Weights often get used in pairs, so plan them accordingly.<br>
      - Setting light-on-dark text makes a font look lighter; if you have a fine enough weight gradation you can build in an accommodation of this (meaning the color of weight_n will look equal to weight_n+1 reversed).<br>
      - You can make a -narrow- range of weights uniwidth (meaning changing the weight doesn't affect linebreaks). Beyond this range you can still use a favorite trick of mine: make them "fixed offset", which means applying let's say +5 tracking to the Light makes it uniwidth with the Regular.</p>
      <p>See also De Groot's non-linear scaling method (which some people don't believe in however).</p>
      <p>hhp</p>
