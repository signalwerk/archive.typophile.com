    <p>Dear Typophile Pros,</p>
    <p>I was wondering if any of you guys would like to share any approaches you have to making alternative weights to your fonts. Where do you start, do you use any scripts or other applications to help you on your way. What is your basic methodology.</p>
    <p>Don't mis-understand me, I am not after a quick and easy solution. After having made 3 fonts, all for a greetings card company and designed by their head artist, I wanted to try something completely different. They were hand-writing, scripty type fonts in a single weight so basically, I could get away with a lot and it was a good way to begin.</p>
    <p>After doing these fonts I decided to make a font of my own but wanted to try a much more rigid sans serif to counter what I had already done. A little more disciplined if you like. It is quite a heavy font so I have decided to add a lighter weight which brings me back to why I'm posting.</p>
    <p>I was looking at Bodoni Egyptian Pro by Nick Shinn, especially the wonderful PDF that you can download from MyFonts. In the 'Evolution' section Nick explains how it has come to be in it's present form but if you were starting this again, what would your approach be to the weights and italics? </p>
    <p>I know you can alter the weights globally in Fontlab, with all it's pitfalls and advantages, but this does get you on your way and moving in the right direction. Any insights on methodology would be mostly appreciated as I am struggling a little with this and going in circles.</p>
    <p>Thank you so much for all the outstanding knowledge in this forum.</p>
    <p>Paul</p>
