      <p>Thanks for your insight hrant.</p>
      <p>One thing I am certainly not doing is making the lighter weight its own animal. To me, the whole point of different weights is to keep a continuity throughout the face. I do tend to agree that if one decides to make them too different it should be a different font.</p>
      <p>You have given me some avenues to pursue.</p>
