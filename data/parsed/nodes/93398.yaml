      <p>Something else:<br>
      Although I'm still not buying this new trend (championed by Yanone and Hasebe) of making each weight/style its own animal (it seems too self-indulgent, and really, that's what different fonts are for) I do think there's a threshold beyond which a weight is too light/dark to be used as a text face and that means it can -and probably should- have a different nature.</p>
      <p>hhp</p>
