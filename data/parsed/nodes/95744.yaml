      <p>"For example, on a 20-page saddle-stitched piece, page 4 and page 17 are printed side by side on the same sheet of paper, but appear in the correct sequence after it is bound and folded."</p>
      <p>If you're using a real typography program, it will do this for you. And even in a word processing program, it's fairly easy to get this right just by making a blank mockup, numbering the pages, and then pulling it apart to see what pages end up next to each other. The next challenge is getting it to print right on a single-sided office printer. Even that just takes a bit of trial and error.</p>
      <p>I have seen, and been responsible for, plenty of playbills etc that were typed up in Word, imposed manually, and printed one side at a time on a desktop printer. I think it's nearly always worth the effort.</p>
