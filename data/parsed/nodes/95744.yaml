      <p>Thanks Hrant, John and Nick for your sage comments. I must admit Nick that I've never had a problem with reading Monotype 262. I can't remember whether the spacing and kerning were 'out of the box' or Indy'd optical. I can remember making a character style for thickened fake small caps which looks predictably dreadful onscreen--(&amp; seem a big small on paper).</p>
      <p>The main thing is that I don't really have a free hand. I believe our house style contains Carter's ITC Charter--I will find out tomorrow. Using Charter here--perhaps with the Gill for headings as mjr suggests--would bend not break the rules. I've been asked to come up with some recommendations for revising this report format in the coming months, and would like to treat this report as a 'prototype' format for extended reports that would be available to others. That therefore gives weight to using a face which is already 'in place' and for which we possess a licence--ie. Charter. I don't know how well Charter stands up to onscreen use but should imagine such a sturdy face should be ok?</p>
