      <p>“Book” faces are best for wide measure, with generous size and leading, because they have the ﬁne detail that mitigates clumsiness at the large size necessary for long lines. However, they look like literature, which is so wrong for corporate/bureaucratic reports.</p>
      <p>11 pt. Gills Sans Light is a good response to the problem discussed here, and it meets accessibility requirements, size-wise, even if the execution in the document shown above isn’t ideal.</p>
      <p>Can one font work equally well for a printed document, and the PDF version of it, read on screen?</p>
      <p>How about an app that changes font according to the medium?<br>
      That would be a similar trick to automated optical scaling.<br>
      Alternatively, just have two versions of the document, one for print, one for screen.</p>
      <p>I guess this will become less of an issue with higher res screens.</p>
