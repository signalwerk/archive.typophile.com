    html: |-
      <p>From the article:</p>
      <blockquote><p>The average maximum stretch of an experienced vatman's arms was 44". Many molds at that time were around 17" front to back because the laid lines and watermarks had to run from left to right. Sounds big?...well to maximize the efficiency of paper making, a sheet this big was made, and then quartered, forming four 8.5" x 11" pieces.</p></blockquote>
      <p>There you go. Just like typefaces suffer because we still want to believe in handwriting, typography suffers because of what some guys could lug around.</p>
      <p>And:</p>
      <blockquote><p>they stuck with the same size so as to keep the hand made paper makers in business.</p></blockquote>
      <p>Yeah, money is more important than reading... Some things never change (these days text taking a back seat to movin' pitchurz).</p>
      <p>hhp</p>
