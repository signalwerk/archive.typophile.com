      <p>&gt;  you can also fold your A4 paper in half</p>
      <p>That can be a good option, but for a multipage piece keep in mind that 1) it'll need to be saddle stitched (stapled on the fold) and 2) the pages need to be resequenced prior to printing. For example, on a 20-page saddle-stitched piece, page 4 and page 17 are printed side by side on the same sheet of paper, but appear in the correct sequence after it is bound and folded. A good print shop can take can care of this for you, but a small copy shop might require you to resequence the pages  yourself before printing.</p>
    html_clean: |-
