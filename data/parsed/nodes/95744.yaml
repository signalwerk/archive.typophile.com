      <p>&gt; It’s a size used for printing all kinds of documents</p>
      <p>Yes indeed, and it's a size that fits well into standard file folders, which is an important consideration for business documents that need to be filed and saved. Also that size works well in standard pocket folders and 3-ring binders.</p>
      <p>But generally I don't like to have one column span the width of letter-sized paper; 2 or 3 columns usually work better. Sometimes flipping the page to a horizontal (landscape) orientation and binding on the short edge is a nice way to make the letter-sized format look a little different.</p>
