      <p>If you're going to futz with the format, try using two columns as well. The line length is much too long in the sample. Letter-sized paper was meant to hold one column of double-spaced <em>typewritten</em> text (manuscript format) and was never intended to hold a single column of properly typeset text.</p>
      <p>On second thought, you could do something fun like create a single, preferably off-center, narrower column of text, and use the margins for headings and/or footnotes. Maybe in Gill Sans.</p>
