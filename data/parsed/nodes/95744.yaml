      <p>This has proven extremely illuminating for me, as I often have to deal with large reports (Environmental Statements) from consultants that are <em>always</em> set on A4 paper. The range of fonts is quite restricted and limited to those that come with the standard installation of Office 2003 / 2007 or 2010.</p>
      <p>My latest challenge is to prepare a handout that will accompany a 45 minute presentation on "Renewable Energy and the Planning System". I was going to go with the standard portrait alignment, 2 columns. The handout will not be a repeat of the presentation, rather a complimentary mini-document that will expand on some of the points raised.</p>
      <p>Without wishing to be detrimental to English Heritage (which was the organisation that appeared on the pages of those excellent close-up photographs of the Gill Sans text), I have to read a lot of that organisation's output and it is turgid stuff! Nice to find out that at least someone has an interest in making the content appear more readable and presentable.</p>
