    <p>Dear Typophiles,</p>
    <p>In September I have to typeset a big report (about 120,000 words). It's one I wrote incidentally, and the subject is post-war school buildings in England. c.100 copies will be digitally printed, but most people will read the doc in pdf format as it will be available online.</p>
    <p>The documents has to comply with the house style and the report series format of my organisation (info below), which severely limits my options. But I want to do everything I can, within these limits, to ease the typographical pain!  So any suggestions welcome, particularly in relation to:</p>
    <p>1.Point size/leading.  I wondered what people point size /leading people would recommend for extended text in Gill Sans Light on a text block which is about 150x230mm. 11/13 seems to give around 16 words/line --is this ok? </p>
    <p>2. Each chapter consists of a main text, followed by a gazetteer which describes a series of case studies. I would expect most readers to read the main text but only 'dip into' the gazetteer. So I was thinking of putting the latter into two columns and small type, say 9/11. Any thoughts?</p>
    <p>3. My references will be in endnotes at the end of each chapter (again, part of the house style). I was thinking of putting them into 9 or 8 points in two columns. Is this going test Gill Light or my readers eyes?</p>
    <p>Format: Soft-bound A4 report, double-sided.<br>
    Margins: L&amp;R 30mm; top 35mm, bottom 45mm<br>
    Typeface: Gill sans light.</p>
    <p>I will try out a few mockups tomorrow, and may post a few pdfs. Meanwhile, any advice welcome! </p>
    <p>Thanks in advance,</p>
    <p>Geraint</p>
