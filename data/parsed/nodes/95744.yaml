      <p>Gill Sans Light is not meant for body text. My suggestion is your second option, but keep GSL for illustration captions, and perhaps page numbers. The other weights of Gill Sans are still acceptable for headings, chapter titles, etc. As for the text, my first choice would be Gentium, which I have found to be a good pairing with Gill Sans headers. It is not excessively "round" (as Gill Sans is), and does not have very sharp serifs which would be a distraction in this case. Of the two you mentioned. Constantia also has those characteristics.</p>
      <p>It's a lot like pairing food and wine.</p>
