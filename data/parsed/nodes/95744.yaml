      <p>Here's an article by the American Forest and Paper Association on why 8.5 x 11 became standard in the U.S.</p>
      <p><a href="http://afandpa.org/paper.aspx?id=511" title="http://afandpa.org/paper.aspx?id=511">http://afandpa.org/paper.aspx?id=511</a></p>
      <p>According to the article, the origins were in the 1600's when it was a convenient size for Dutch paper maker. By the early 1900s there were 2 common sizes in the U.S. —&nbsp;8.5 x 11 and 8.5 x 10.5.  It wasn't until the 1980's that the U.S. government declared 8.5 x 11 to be the standard size here for government printing.</p>
