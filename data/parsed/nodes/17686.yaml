    <p>Hi everyone,</p>
    <p>I have to write an incredibly extended work, like a theses, on the format OpenType and all it implies. I would appreciate if anyone could give me some opinions on the future of OpenType, if there will be a better format in the future or does this format complete all the necessary requisites. Please feel free to mention any website or Books that have any information on OpenType for it might be very useful for my work. </p>
    <p>Thank You very much</p>
