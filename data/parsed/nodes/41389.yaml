    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ralph 001_3626.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/Ralph 001b_5289.gif"></div><br>
    The first glyph I drew when I was sketching out this idea Thursday was the capital R. I'm trying to demonstrate the idea of pieces of positive and negative space fitting together implying lines.<br>
    Now how do I ask this? Am I unwittingly copying someone else's work here? What I mean is—I'm relatively new to type design and I haven't read more than a handful of books on the subject—does this look like a ripoff of someone else's design or concept?<p></p>
