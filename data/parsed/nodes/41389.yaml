      <p>Hi, David, </p>
      <p>Nice work. I know of at least two typefaces that work with a similar idea, but then again they use different types of shapes as their starting points. One of them is <a href="http://www.fontbureau.com/fonts/Avia" rel="nofollow">Avia</a>, by Raphael Boguslav and Jill Pichotta. The inspiration was "faulty platemaking or light inking" that causes the hairlines to be lost, according to Font Bureau's catalog. It goes on to say that Boguslav "understood it as a sophisticated form of stencil design."</p>
      <p>I think this shows that two different people can arrive at similar solutions while working on different problems. And it wouldn't be the first time this has happened. Since you're relatively new to type design, it might be a good idea to continue with this project... You will probably learn a lot from it.</p>
      <p>I've forgotten what the other typeface is called... It might be a custom job, actually, or unreleased. I am pretty sure that it was featured in Print or Step Inside Design a year or two ago, in those annual Young Visual Artists/Ones to Watch specials that they do.</p>
      <p>Oh, and this older thread might have something, too: </p>
      <p><a href="http://typophile.com/node/15767" title="http://typophile.com/node/15767">http://typophile.com/node/15767</a></p>
      <p>One more thing... If you would also like a critique of your typeface, try posting some examples in the Critique section of Typophile.</p>
