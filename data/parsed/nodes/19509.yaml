  html: |-
    <p>hi all!</p>
    <p>this is my first post on typophile.. ! ive been lurking for quite some time now.. and i finally decided it was time to jump aboard!</p>
    <p>im Roelant van der Munnik, born and raised in Alkmaar, the Netherlands.. you can read the rest in my bio i guess.. </p>
    <p>I have no real formal training in graphic design, or typography. Everything i do, is self initiated, and 'selfthaught'.. (you simply cannot learn yourself everything, hence typophile and the likes, i guess!)</p>
    <p>Ive really been liking the scriptwriting/handwriting stuff. Ive been doing this for little over a year now i guess, i finally i have some result worth showing.. my very first try's were incredibly horrible, but i have consciously seen myself evolve to where i am now, and i firmly believe that practice make perfect.. I am nowhere near where i want to be, but i guess im along the way.. </p>
    <p>I really admire the work of John Stevens, Mark Simonson et al. and im trying my hand at digitizing my files, but i guess i need to find some better pens to ink the scripts.</p>
    <p>anyways, heres some stuff ive been working on.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2001.jpg"></div><p></p>
    <p>great movie!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/desperado.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/velocity sensitivescript.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/5 boroughs2.jpg"></div><p></p>
    <p>digitized in photoshop.. the line work was horrible.. :S</p>
    <p>anyway,<br>
    g'day!</p>
