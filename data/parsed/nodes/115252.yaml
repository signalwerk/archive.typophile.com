    html: |-
      <p>This does seem like a font name issue since you have a different version of DIN. In InDesign, if you go to Type &gt; Find Font... it will show you all the fonts in your document. Choose the font you want to replace, then select a replacement under the Replace With area of the dialog.</p>
      <p>I would suggest comparing the two documents after replacing the font. Different versions of the same font could have varying metrics, and the formatting may change.</p>
