    <p>Hi Everyone,<br>
    I'm facing a little problem here and thought maybe you could help:<br>
    I've recieved an inDesign document created on a mac, in which DIN Black and DIN Bold are used.<br>
    As I use a PC at work I needed to buy those two fonts, so I bought FF DIN Bold and Black which seemed to be the reference, and installed them.<br>
    But when I opened the inDesign document, it kept saying the DIN Bold and Black fonts were missing.<br>
    Is there any way to make it understand it's the fonts I bought ?<br>
    I think the problem is the name ?</p>
    <p>Thanks a lot to take the time to read my request, </p>
    <p>Have a good day !</p>
    <p>Jon</p>
