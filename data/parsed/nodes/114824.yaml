    <p>The style known as <em>Scotch Roman</em> is considered as a modern face.<br>
    But if you look closely at the design of a <em>Scotch Roman</em>, it appears it has the bracketed serifs of the transitional faces.<br>
    Modern faces in the Vox-AtypI definition are called <em>Didones</em> meaning Didot and Bodoni. These two types have hairline serifs.<br>
    Punchcutter Richard Austin who previously worked for John Bell and gave him transitional types was the creator of <em>Scotch Roman</em>.<br>
    I observed some specimen of <em>Scotch Roman</em> that have the high contrast of the <em>Didones</em>.</p>
    <p>What is your view on <em>Scotch Roman</em> inside the Vox-AtypI category system?</p>
