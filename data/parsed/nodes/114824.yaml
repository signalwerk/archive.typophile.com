    html: |-
      <p>There's nothing wrong with optical sizing. But there's also no reason you couldn't have made Scotch Micro Micro which starts with the assumption Scotch Micro is what the 11 point looks like, and Scotch Micro Micro is the corresponding 6 point.</p>
      <p>After all, a smaller optically sized font is bolder and wider - and bold, condensed, light, and wide weights of typefaces exist without being related to optical sizing, as well as different typefaces differing in these characteristics.</p>
      <p>Optical sizing may involve other parameters as well, but the fact that a certain quantity of boldness and wideness makes a 6 point face correspond to an 11 point face doesn't prevent that quantity from also being approximately what the 11 point size needs to look better to someone. And that was likely because of how tastes changed in 150 years.</p>
