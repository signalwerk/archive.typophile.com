    date_raw: 30 Sep 2009 — 4:41pm
    votes: null
    html: <p>I think we've found a use for Comic Sans – gravestones! It strips it of its most heinous crimes and has the ability to make a message on a gravestone seem heartfelt and personal. Sure, other fonts could do this much better, but this is the best use of Comic Sans I have ever seen (in fact the only good one). In may ways this has blown the whole graveyard type industry apart. I'm looking forward to a time when grieving grandchildren can stamp their handprint into the still-wet concrete, and then run crying to their mum for a hug (thus ruining their well-chosen expensive mourning outfit.)</p>
