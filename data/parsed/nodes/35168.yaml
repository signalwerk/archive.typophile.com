    html: |-
      <p>To be entirely fair, I think the sensitivity of ClearType to subpixel layout is a relatively minor problem, and I'd imagine that modern video connection standards such as EDID and their associated drivers will evolve fairly quickly to the point where they get the information across reliably (see <a href="http://lists.freedesktop.org/archives/xorg/2005-February/006233.html" rel="nofollow">this thread</a> for a bit of discussion about getting that implemented on Linux).</p>
      <p>About the only use case where FontFocus is an obvious win is displaying PDF files (where the layout and metrics are inflexible) on monochrome displays like e-ink readers. Unfortunately, despite some early high hopes, it doesn't look like that market is going to amount to a hill of beans.</p>
      <p>The more adventuresome among you may find <a href="http://www.antigrain.com/research/font_rasterization/index.html" rel="nofollow">Maxim Shemanarev's notes</a> on font rendering of interest. There are numerous methodological and other problems with his comparisons, but I'm glad that there are people out there who care about getting it right and are paying attention. I'll probably write an extended blog about all this, but am characteristically short on time right now.</p>
    html_clean: |-
