    <p>There was a joke on the new season of Arrested Development around a company called "Halliburton Teen". I'm trying to figure out what the font is.  This (<a href="http://www.myfonts.com/fonts/blambot/crater-face-bb/crater-face-bb/" title="http://www.myfonts.com/fonts/blambot/crater-face-bb/crater-face-bb/">http://www.myfonts.com/fonts/blambot/crater-face-bb/crater-face-bb/</a>) seems close, but the x-height is all off. </p>
    <p>Any ideas?</p>
    <p>Thanks!<br>
    -Chris</p>
