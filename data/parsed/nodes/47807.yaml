    html: <p>I got the T and the Lungs right off. I think the concept is strong. I like it! The abstract shapes and negative space work well for me. You could try another direction as well... a more classical serif T along with scroll work, or drafting texture in the lung area to simulate capillaries. That could take it in the direction of "the Anatomy of Man" DaVinci style. Which I have always associated with the medical profession, It could strengthen the "life Support" "Type Support" link, or is might just clutter up the nice simple structure you have going on now. Who knows?</p>
