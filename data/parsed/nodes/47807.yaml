    <p>Hi there</p>
    <p>After a few times trying to give input to others, I thought I might post something of myself here.</p>
    <p>I'm working on this t-shirt project.<br>
    I started it just for the fun of it, but now I have plans of producing it.</p>
    <p>It is not finished. I have to take a closer look at the type. So this is more of a sketch.</p>
    <p>Let me know what your thoughts are!</p>
    <p>The idea – in general and short – is that we all eat, sleep and breath type! Hence the lungs.</p>
    <p>My idea was to make it a limited edition. But am not sure about that.</p>
    <p>Your input is appreciated.</p>
    <p>Best</p>
    <p>Ray</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tee_4418.jpg"></div><p></p>
