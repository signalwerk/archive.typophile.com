      <p>The T is in a very rigid style. This gives the "lungs" a blocky shape that is a further remove from the idea of lungs. Are they lung bitmaps blown up? Why so blocky? Low-res lungs? </p>
      <p>What I'm getting at is that your T shape is clear but your lung shapes could really stand to look more like lungs. Start with the shape of 2 lungs and see how you can adapt the outer contour to become a recognizable T shape. Consider large, bracketed serifs at foot and at top that follow more the contour of lungs. Right now, no matter how many times I read the word "lungs", I still just see blocks that conceal a T. </p>
      <p>You may have to.... Gosh dare I say it?..... HAND-DRAW IT!!!!</p>
      <p>[sob]</p>
