      <p>He guys</p>
      <p>Thank you for your comments.</p>
      <p>I have added the Capital T and S for Type Support instead of lowercast.<br>
      But it starts to interfere with the y. So I think I'll switch back. Unless you have got a good reason not to?</p>
      <p>I was also playing with some colors.<br>
      At the bottom some modern colors. But they don't fit the overal feel of it.<br>
      It becomes to distant.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lung1_4183.gif"></div><p></p>
      <p>Here I have added an image of actual lungs.<br>
      However I think it distracts to much from the rest. It might even starts to clutter.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lung2_6633.gif"></div><p></p>
      <p>The 45degree lines add a nice feel to it, but I can't think of a good reason why I should use them. They don't add to the concept. What do you think?<br>
      The reason for adding the lines was to break the big chunks. But actualy, that is what is it about …</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lung3_5838.gif"></div><p></p>
      <p>I like bright colors, but here it just doesn't work for me.</p>
      <p>Ray</p>
