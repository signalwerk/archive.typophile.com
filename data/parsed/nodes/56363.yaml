      <p>Thanks for the heads-up, Craig.</p>
      <p><em>The Origins of Graphic Design in America</em> by Ellen Mazur Thomson, 1997, is far and away the best "cultural studies" history of design I've come across. </p>
      <p>Due credit to Meggs though, he established a canon, which enhanced the status of the profession.</p>
