    <p>Typophiles might be interested in reading Johanna Drucker's reviews of Meggs' and Hollis's graphic design histories. It's available for free online as part of the inaugural issue of <em>Design and Culture</em>.<br>
    <a class="freelinking external" href="http://www.ingentaconnect.com/content/berg/dgcj/2009/00000001/00000001" rel="nofollow">http://www.ingentaconnect.com/content/berg/dgcj/2009/00000001/00000001</a></p>
