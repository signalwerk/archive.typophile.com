    html: <p>b2 is interesting but I don't think it really captures "properties" - it has more of a technology feel to it. b3 though seems intriguing enough. It has "architectural" elements that can be useful for a property investment firm. I'm not sure disconnecting the bowl of the "b" is the right approach though. Maybe think of this more in terms of buildings, architecture or even investment concepts. Right now it seems a bit too focused on the first letters of the company's name. Which is a perfectly fine place to start, but yeah, play with some other concepts. Hope this helps.</p>
