    html: |-
      <p>got it. i was just studying the pdf and forgot that you had mentioned the fact that it was two-sided in your original post.</p>
      <p>i think there are some hierarchy issues that you should re-work:</p>
      <p>1.  perhaps adding a second color, like a light gray ( or a light color that works with your blue), to the table would help you increase some contrast.</p>
      <p>2.  perhaps you should choose a typeface that is more suitable for smaller text sizes (which is easier said than done). there are several to choose from and and this issue is always up for debate, but i will go ahead and suggest<a href="http://www.myfonts.com/fonts/bitstream/charter/familytree.html" rel="nofollow"> Charter</a>. </p>
      <p>3.  the type is too tight. at 8pt, this is very diffcult to read at the default 9.5 pt line spacing. perhaps you could air it out to a 10 or 11 pt line spacing. which leads to the next suggestion.</p>
      <p>4.  break the layout into two columns and leave some room on the top for the club logo.<br>
      <a href="http://www.istitch.net/typophile/2column.jpg" rel="nofollow">sketch 1</a><br>
      if you want to keep the "front", you can fold it into quadrants, which would give you the lower left quadrant which would allow more space.<br>
      <a href="http://www.istitch.net/typophile/2column2.jpg" rel="nofollow">sketch 2</a> </p>
      <p>5.  you can introduce an italic weight for the place names of your events:</p>
      <p><strong>International Triumph Show and Spares Day</strong> – <em>Stoneleigh</em></p>
      <p>6.  also, the intro paragraph seems out of place. perhaps it would look better if you increased it by 1 or 2 pts (and the linespcaing, respectively), and line it up with the rest of the (indented) text.</p>
      <p>7.  overall, you just need more contrast to increase the hierarchy and more room for the type to breathe.</p>
      <p>hope this helps,</p>
      <p>---------------------<br>
      nc</p>
