    <p>OK I need some help.</p>
    <p>Originally I proposed that we do this events diary for my car club - it was going to be A4 in sized and looked quite cute when I mocked it up first time around. The problem is we made a decision to make it A3 - and now it doesn't quite work! Line lengths are too long - I've had to do some tracking to fit in a logo (still one missing to be added) - plus we have even more events to put on it meaning that it's all crammed up.</p>
    <p>Here's the current state of things: (n.b it's A3 and meant to be cross folded)</p>
    <p><a href="http://www.mintylamb.co.uk/upload/flyerfinal4proof.pdf" title="http://www.mintylamb.co.uk/upload/flyerfinal4proof.pdf">http://www.mintylamb.co.uk/upload/flyerfinal4proof.pdf</a></p>
    <p>It's going to be cross folded - on the other side are 4 photos (one in each quarter) with a calendar running across the bottom of each one and the relevant dates shaded in.</p>
    <p>It's my first proper piece of print work (getting 3,000 printed) - and am a bit worried about delivering the goods. Note this is voluntary work so am not getting paid or anything.</p>
