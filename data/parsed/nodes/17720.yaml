      <p>sorry for the barrage of questions, but all of this plays a role in how your piece will function and should thereby dictate how you lay the info on the page.</p>
      <p>...so i assume you can work with full color (because it's printed digital). i was just curious because i noticed that you had a full color logo but are only using one color for everything else. it could be more interesting to introduce another color.</p>
      <p>also, is this only one sided?</p>
      <p>next would be how you need to distribute the piece. does it need to be in the format that it's in now? if you are going to mail it out, there are limitations about what size envelope you will use, or if the addresses goes directly on the piece there are guidlines that the postal service sets so it can go through the mail properly. if none of these things are an issue, you might want to change the format.</p>
      <p>----------<br>
      nc</p>
