    <p>Happy holidays and a great New Year to everyone at the Great Typophile from the Little Me! (:  I'm heading south for a few days to do my present-unwrapping under the sun. May 2009 blossom and grow for all of us.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/2009karte_5582.jpg"></div><br>
