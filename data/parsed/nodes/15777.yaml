      <p>A millennium ago when I was in design school, we did typography projects including order forms, Annual Report tables, charts as well as the usual page layout stuff.  This was before computers so it was a different world without the instant feed back postscript gives you.<br>
      Today, it is rare to see young designers fresh out of school who can set decent running text without bad rag or hyphenation gone mad.  I wish design schools would begin teaching the practical parts of typography including tables and subhead series so that kids getting out of school would have a marketable skill to help them get in the door. Employers want to hire people who can hit the ground running.  All the typographic skills are NEEDED on the ground.  The fun typographic play is sweet and also needed but don't forget the meat and potatoes to go with that desert.</p>
      <p>ChrisL</p>
