      <p>One thing that is no longer taught is charachter counts, this was a must in a pre-postscript environment. Most type houses carried specimens that had guages at the bottom of the page for copy to be set at size/pica length. Size, leading, line length, headlines all had to be thought out first. Too small a font size and your copy just stopped, to large and even worse you had overruns. It is incredibly difficult and time consuming to do, so many designers had knowledge of a few fonts and used them, compared to now where most designers use whatever and never get to know a font.</p>
      <p>I used set type for a famous designer years ago, and upon a chance meeting he said "they (his design support staff) don't even know what leading is and I do not have the time to fight them…"</p>
      <p>Rodi</p>
