      <p>&gt; <em>Size, leading, line length, headlines all had to be thought out first.</em></p>
      <p>Yes, totally agreed. In pre-Postscript days (or more acurately, Pre-Desktop Publishing days), type-specing and copyfitting were both costly (if you sent out for typesetting) and time consuming (even if you had your own typesetting equipment). This necessitated accurate pre-planning and preparation of layouts as they went into production.</p>
      <p>A lot of calculation AND visualization took place. With the use of type specimen sheets, character count tables, type gauges and a calculator, designers/typographers had to completely envision the end result prior to full production. "Seeing" the end result of typesetting prior to the actual hard-copy developed awareness and sensitivity to type, what it was and had it had to be used.</p>
      <p>Type selection and copyfitting via "menu-options" allows for a great amount of "fudging-around" and often leads to responses like, "<em>Hmmm, it all fits and looks fine enough.</em>" or "<em>If I open the line spacing by another point, the copy will fit the page."</em></p>
      <p>If building a page or project can be quickly and efficiently done, the need for designers to be versed in the <em>Black Arts</em> (an old print term that has completely lost its meaning) is very little.</p>
      <p>Also, I don't believe final output is being as closely scrutinized by as many project team members either. In our shop the copywriter, typographer and creative manager had to sign-off on all typesetting prior to printing.</p>
