      <p>In the first type class I ever took, the very first assignment was kerning. I had to cut out the individual letters in a word and manually space them out. The assignment kind of drove some people up the wall because we knew nothing about type at the time and this introduction felt really technical and mundane.</p>
      <p>But the assignments that followed were more creative and focused on letterforms. I think it was at this time that people began to like type. Simultaneously in other classes, there were assignments that had practical application and used a lot of type in things like tables and brochures. I think the mix of the two classes together made a lightbulb go off for many people, and they really began to understand type. This duality seems to work, so yes, I think there should be another class to cover all the practical bases.</p>
