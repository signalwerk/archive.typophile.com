      <p>i hate to say it, but choice is the problem.</p>
      <p>i always thought it would be useful to create an assignment where the student is only allowed to use Courier to create a complex layout that incudes headlines, subheads, body text, captions and couple of charts and tables (or whatever). this would force the student to excercise the skill to arrange the type so that it works. </p>
      <p>the idea is to remove the font from the equation, therby placing an emphasis on<br>
      "working it". the absence of a good typeface of one's own choice would also allow a student to understand why it is important to work with a good font family (with good spacing!), and some of the problems one might run into when the type palette is limited.</p>
      <p>this might actually lead to "damn, i wish i had those small caps!" or other interesting discussions that stem from these types of limitations. </p>
      <p>in general, i think a possible solution might have to do with eliminating some of the overwhelming choice that students have today in order to let them focus on some of the basics.</p>
      <p>---------<br>
      ::nc</p>
