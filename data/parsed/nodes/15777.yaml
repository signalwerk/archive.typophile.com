      <p>&gt; <em>Should these kind of projects be included in a beginning type class or should another class be developed to cover things like tables, math, train schedules, and phonebooks?</em></p>
      <p>There are actually so few classes truly dedicated to typography, so most become general guidelines for type usage.</p>
      <p>Out of practicality, graphic design students today are caught in a barrage of various topics, techniques and disciplines regarding design, software programs, pre-production methods, and so on, so in reality no single area of knowledge is "complete."</p>
      <p>I do apologize that I must divert my attention to something else at the moment, but I will revisit the topic again. Others in this forum are currently involved with the same issues you are raising.</p>
