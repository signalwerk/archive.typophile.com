    <p>What topics need to be covered in a first year typography class? How many classes of typography should design students be put through?</p>
    <p>I have noticed that a lot of designers who teach typography focus on designing with letterforms and not really explain how to develop more practical things such as designing traffic tickets or math formulae.</p>
    <p>Should these kind of projects be included in a beginning type class or should another class be developed to cover things like tables, math, train schedules, and phonebooks?</p>
    <p>At what point should a type student try his hand at designing a typeface?</p>
