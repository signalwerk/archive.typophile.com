    <p>Hello everybody —</p>
    <p>I went to my computer today to do some work and found that a substantial chunk of my typeface library — approximately 1,800 fonts — had been turned into .xml files and hidden in the “Jaws” folder of Quark XPress.  I have no idea how or when or why this happened, and I have no idea how to fix it.  Any and all advice is greatly appreciated.</p>
    <p>—Jim K.</p>
    <p>PS: Or possibly they had been deleted and the .xml files are left over from something else??  I really have no clue here.  :(</p>
