      <p>System? Hardware? OS? hard to diagnose without the platform at least.</p>
      <p>Do you use a font manager (I assume you do, with that many fonts)? Do you have a recent backup?</p>
      <p>Sounds like your file directory(ies) may be screwed up — bigger problem than just your fonts.  Try disk utility(s) and see if that works, or at least finds a problem.</p>
