    html: |-
      <p>I’m running Mac OS X v. 10.4.1.  Disk Utility doesn’t spot any problems.  Opening one of the xml files shows something like the following:</p>
      <p>/Gentium  (%psfont%Gentium) (r) file &lt;&lt; /ResourceType /sfnt<br>
       &gt;&gt; /ResourceDecode filter<br>
       definesfntfontset 0 get definefont pop</p>
      <p>...which says to me that this wasn’t a conversion but that it was left over from some other processes, and the fonts have been deleted somehow.</p>
      <p>:(</p>
      <p>Thanks for your help anyway,</p>
      <p>—Jim</p>
