    html: |-
      <p>Not a lot of info to run off of (no system specs) - but can you think of anything that has recently changed on your computer system? Any new applications installed? Any recent updates? Font files don’t turn into XML without a reason. Can you open the XML files with a text-editor? Don’t save them after opening them but take a look and see if you can see anything of interest. Isn’t Jaws the not-officially-licensed-post-script-renderer? Maybe Jaws is converting the fonts - you might check your settings in Quark for that. Also use a web search to see if anybody else has run into something similar.</p>
      <p>At any rate, good luck and I hope you can figure out what’s happening and how to recover from it.</p>
