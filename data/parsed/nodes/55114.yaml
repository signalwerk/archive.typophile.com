      <p>For examples of pre-revolutionary typography (before 1917)<br>
      <a href="http://englishrussia.com/?p=2203" title="http://englishrussia.com/?p=2203">http://englishrussia.com/?p=2203</a></p>
      <p>For avant-garde designs (before the 30's)you can a look at some works by Lissitzky, Rodchenko and Stepanova.</p>
      <p>There are a few excellent books with examples of popular typefaces, but they are mostly in Russian.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
