    <p>Hello Typophiles,</p>
    <p>I'm working on a webssite and would like to use a font face as close to Adobe Caslon Pro as possible. The template I am using only allows the use of Google Web Fonts. </p>
    <p>So, does anyone have any thoughts on the most similar Google Webfont to Adobe Caslon Pro?</p>
    <p>Realize I could use typekit to do this, but thats not what this theme comes with. Also maybe Georgia or Times but wanted to something a little more unique? </p>
    <p>Anyone have any thoughts. Greatly appreciate it.</p>
    <p>Thank you,<br>
    I</p>
