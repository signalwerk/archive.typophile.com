      <p>Correct me if I’m wrong, but I suspect that what you are really looking for is fonts with proportional old-style ﬁgures as default.<br>
      My Pratt and Richler ﬁt the bill. (They are also kerned where appropriate.)<br>
      Available at MyFonts, FontSpring, WebINK and FontShop.</p>
