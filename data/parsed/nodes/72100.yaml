      <p><cite>Niderlandish</cite></p>
      <p>Is that supposed to be Dutch [<em>Nederlands</em>, in German: <em>Niederländisch</em>]?<br>
      If so, this number is probably due to the fact that every <a href="http://nl.wikipedia.org/wiki/Klinker_(klank)" rel="nofollow">vowel</a> can have an acute to show emphasis: á, é, í, ó, ú, but also íj (<a href="/wiki/Erik%20van%20Blokland" class="freelinking" rel="nofollow">Erik van Blokland</a>&nbsp;has designed a special j acute for Eames, see page 9 of this <a href="http://www.houseind.com/dpdf/10692/eames_century_modern_manual.pdf" rel="nofollow">manual pdf</a>); plus capitals. I don’t know how widely used accentuated caps are in Dutch –&nbsp;if at all. And Dutch spelling uses the trema/dieresis, in words like ‘Indië’.</p>
    html_clean: |-
