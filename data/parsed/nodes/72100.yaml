      <p>"(i.e. not romanized Eastern languages such as Vietnamese, Thai, etc.)"</p>
      <p>I wonder if perhaps this comment reflects a misunderstanding? The standard writing system for Vietamese <strong>is</strong> Latin with diacritics. Thai (like Korean, Japanese, and Chinese) has a standard writing system that is non-Latin, so their romanized forms are less widely used.</p>
      <p>Though, that being said, the demand for the diacritic forms needed for transliteration of Chinese will only be rising, and not all of them are available in common character sets.</p>
      <p>Regards,</p>
      <p>T</p>
