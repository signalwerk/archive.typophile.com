      <p>The Canadian orthography of Tlingit uses 17 letters with diacritics, all on vowels: ąą́ą̀ą̂áàâéèêíìîúùûÿ. The ones with ogoneks are not terribly common, though they do occur in the word «mą̀» or «mą̂» ‘how’.</p>
      <p>There are probably quite a few other minority languages which have large inventories of diacritics, although I don’t know if anyone has done a survey of any kind.</p>
