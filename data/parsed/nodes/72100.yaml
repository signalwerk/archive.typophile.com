      <p><strong>Thomas</strong>: thanks for the info.</p>
      <p><strong>James</strong>: after you message in the <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">topic about the font I'm developing</a>, I did some research about languages which use Latin alphabet. Although Celeste's original question seems to be about European languages, this info may be useful.</p>
      <p>These are the ones with more diacritics, besides Vietnamese, Tlingit and Slovak:</p>
      <p><em>Apache</em> uses 16 characters with diacritics, plus the glottal stop mark (').</p>
      <p><em>Sami</em> uses 17 if you sum up all the language variations.</p>
      <p><em>Navajo</em> uses 18 and also glottal stop mark.</p>
      <p><em>Twi</em> seems to use 18 too, but the info I found is not complete.</p>
      <p><em>Kolkata</em> is not a language but a transliteration scheme for Indic languages (actually the most widely adopted scheme). It uses 20.</p>
