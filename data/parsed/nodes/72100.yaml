      <p>"Though, that being said, the demand for the diacritic forms needed for transliteration of Chinese will only be rising, and not all of them are available in common character sets."</p>
      <p>There are only 4 tones to all chinese characters. ā, á, ǎ and a`. It's quite simple to design but you are right that most common characters set don't have them. </p>
      <p>These 3 - "ā, á, ǎ" I cut and paste from wikipedia (<a href="http://en.wikipedia.org/wiki/Romanization_of_Chinese" title="http://en.wikipedia.org/wiki/Romanization_of_Chinese">http://en.wikipedia.org/wiki/Romanization_of_Chinese</a>. i wonder what font they use.) but I can't find "a`" on my keyboard, so I basically type a combination of "a" and " ` " with poor kerning.</p>
      <p>FYI, no one read the chinese language in its romanized version. All publications are written in original Chinese alphabets. It's not just "less widely used". It is wrong to be used. To typeset an article in romanized version is almost like a sin to the Chinese language and you don't write Chinese in romanized version at all. The romanized version is only for the purpose of pronunciation, designed as a simplified version to replace the original "Han Yi Pinyi" system, which uses it's own unique set of alphabets and is very complicated. It's almost like a language by itself and I don't think it's qualified to be called diacritics at all.</p><div class="imageWrap"><img src="http://typophile.com/files/20090805113925-1747318300_6453.jpg"></div><p></p>
