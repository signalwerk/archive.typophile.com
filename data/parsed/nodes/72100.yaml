      <p>Number of accented characters in the alphabet is not the same thing as number of accented characters that occur in text.</p>
      <p>***</p>
      <p>From a type design perspective, Slovak is far and away the most demanding on spacing/kerning, due to d-caron, l-caron, and t-caron and i-acute.</p>
      <p>Interestingly, Hungarian is not that demanding, because the hungarumlaut is "acute", so may be kerned the same as the plain letter when following T, V, W and Y.</p>
