      <p>Tomaszewski's work is wrong about Portuguese.<br>
      There are <strong>13</strong> diacritics in Portuguese (áàâãçéêíóôõúü).<br>
      In Brazil, there are just 12 now as ü was cut off since 2009, when an ortographical reform took place. This reform is still not implemented in other Portuguese-speaking countries.<br>
      I believe it's also wrong about French (14) and Slovak (17).</p>
