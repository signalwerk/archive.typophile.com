      <p>Contrary to the Chinese language, the Malay Language, (Bahasa Malaysia) which is the official language of Malaysia, Singapore and Indonesia (In Indonesia is called Bahasa Indonesia) is entirely written in romanized version. </p>
      <p>The entire set of the English alphabet A-Z are sufficient to form all Malay words including it's phonatary function, so no diacritic is needed. The original Malay language was in "Jawi", a combination of arabic and Persian scripts, with additional letters added as an adaptation to local phonetics. Under the influence of Dutch and British, the language was romanized started from 17th century and today all official documents, publications and school text books uses the romanized version of the Malay language. Very few people can read the original Jawi, except in the context of Islamic literature. The original Jawi is thus facing the danger of extinction today. Most students in Malaysia today don't even know that the original language of Malay is in Jawi. It's not even being taught in the school at all.</p>
