    <p><a href="http://www.typophile.com/node/35469/" title="Typophile Tee"><img src="http://farm2.static.flickr.com/1292/910148363_107cb6bf2b.jpg" width="500" height="330" alt="Ape Do Good"></a><br>The shirts are on press at <a href="http://www.apedogood.com">Ape Do Good</a>.<br><br>The 2007 "Type Specimen" tee was designed by Christian Robertson, a longtime Typophile member and moderator who joined Punchcut in 2004. Christian designed the popular typefaces <a href="http://typophile.com/wiki/Dear%252BSarah">Dear Sarah</a> and <a href="http://typophile.com/wiki/Pill%252BGothic">Pill Gothic</a>. The "Type Specimen" tee takes its cues from 1923 ATF type specimen books. Rather than finding a historical looking typeface for the design, Christian drew an American gothic inspired typeface from scratch. The shirt will be available on August 1 to attendees of TypeCon, Seattle. It will then be made available for purchase from Typophile.com.<br><br><br>
    Read more after <a href="http://typophile.com/node/35469">the bump</a>...</p>
    <!-- break --><!-- break --><p>
    Here's a little tease before we can show you the final...</p>
    <p><a href="http://www.flickr.com/photos/joepemberton/911003504/" title="Photo Sharing"><img src="http://farm2.static.flickr.com/1353/911003504_afc3faeaf5.jpg" width="500" height="375" alt="Ape Do Good is a visual feast to behold"></a><br>Proprietor Anthony prepares to show us the wares.<br><br></p>
    <p><a href="http://www.flickr.com/photos/joepemberton/911240644/" title="Photo Sharing"><img src="http://farm2.static.flickr.com/1337/911240644_035a52ab5d.jpg" width="500" height="178" alt="American Apparel shirts"></a><br>The American Apparel tees in men's "army" and women's "olive" arrived on schedule.<br><br></p>
    <p><a href="http://www.flickr.com/photos/joepemberton/911007630/" title="Photo Sharing"><img src="http://farm2.static.flickr.com/1296/911007630_29dcb892d5.jpg" width="500" height="255" alt="This is just the printer's proof..."></a><br>A quick tease of the proof. Not the final layout, nor the final color. The ink is a new eco-friendly "water-based" process that actually strips away pigment in the tee. The result is a very soft feel (no thick layer of ink) and a more subtle look. It also allows for some killer overprinting effects.<br>
    <br><br></p>
    <p>More pics and purchase info to come! </p>
