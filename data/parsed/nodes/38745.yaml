  html: |-
    <p>The URL here displays a custom restaurant sign based<br>
    on an old municipal document, perhaps as much as 200<br>
    years old. I wouldn't think there exists a font today<br>
    to match, but is there any similar font that I might<br>
    use for the restaurant's website?</p>
    <p>I note the serifs on the lowercase l, v, a, and d,<br>
    and the top serif on the uppercase C.</p>
    <p><a href="http://clevelanderbar.googlepages.com/Clevelander1.jpg" title="http://clevelanderbar.googlepages.com/Clevelander1.jpg">http://clevelanderbar.googlepages.com/Clevelander1.jpg</a></p>
    <p>Thanks.</p>
    <p>redstart</p>
