    html: <p>Bradbury Thompson art directed Mademoiselle in this post-war era. He combined modernist layouts with classical Didone types. Alexi Brodovitch (Vogue) and Paul Rand were also fond of their didones at that time. <br> <br> <br>The Onyx/Bodoni Ultra thing that Mark mentioned was peculiar to that era, and Bodoni was also used as text, and Bank Script to complete a very stiff, formal look. <br> <br>Cipe Pineles art directed Seventeen magazine with the same ultra smart look. So, even though the layouts were very modern, the type was super-traditional, refined. <br> <br><a href="http://www.d.umn.edu/~jkmetz/GDH/04-17-01_4.html" target="_blank">http://www.d.umn.edu/~jkmetz/GDH/04-17-01_4.html</a></p>
