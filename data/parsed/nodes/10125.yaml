    html: "<p>Alternate Gothic <br>Franklin Gothic <br>Futura (especially bold and condensed weights) <br>Garamond, Baskerville, Century or Caslon (for text) <br>News Gothic/Trade Gothic <br>Brush scripts of all kinds (especially in advertising, often done by hand) <br>Stymie/Memphis/Beton <br>Poster Bodoni and Onyx <br> <br>Remember, too, that it's not just the type, it's how it's used. A good reference, at least for advertising, is \"All-American Ads: 40s\" published by Taschen.</p>"
