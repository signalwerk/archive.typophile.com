    html: "<p>Finally, nobody mentioned Linotype Janson, very widely used by many publishers in those years. If you want to know what was commonly used in type in the US in those years, the answer is, the best Lino faces because it was cheaper to do Lino than Mono. So the stars were the most functional of the Lino faces which are, presumably, Caledonia, Granjon, Janson, Garamond 3 or whatever it was called, Electra - have I forgotten anything obvious? What is striking, again, is that these faces, the lingua franca of an important era, made unconvincing transitions to digital and aren't any longer widely used. The single typeface of the lot that was successfully revived was Caledonia, and that not in the Lino version, but in Time Caledonia, which Matthew Carter made for Time Magazine, where it is still used. I guess Fairfield came a little too late to be included in this list? <br> <br>One more thing: Granjon included logotypes to eliminate the clumsy f, but these were very rarely used. Were such logotypes available for other of these popular Lino faces?  <br> <br>Finally, Granjon was the original interpolated typeface: optically interpolated by Jones (?) using Garamond on one side and Caslon on the other. It is not an authentic Garamond as Beatrice Warde claimed and a hundred thousand parrots have since chirped. This is clearly documented (and is obvious to anyone who actually looks at the type) in one of MacMurtrie's (?) books. It would seem that it remains the one truly successful interpolation of two typefaces to this day, even though with Font Chameleon, we could accomplish semi-convincing interpolations at the press of a button. Hey, does anyone have Chameleon 2? I seem to have lost my copy.</p>"
