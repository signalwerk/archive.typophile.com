    html: <p>If you look at <i>books</i> printed in that era, a significant fraction are in Linotype <a href="http://www.myfonts.com/fonts/ef/baskerville/">Baskerville</a> (I chose the EF cut as being fairly close to the metal versions; many of the other digital versions have vastly higher stroke contrast) or <a href="http://www.myfonts.com/fonts/linotype/caledonia/">Caledonia</a>. Another display font I associate with the era is <a href="http://www.myfonts.com/fonts/bitstream/lydian/">Lydian</a>. Towards the early side of that timeframe, I believe <a href="http://www.myfonts.com/fonts/spiecegraphics/bernhard-gothic-sg/">Bernhard Gothic</a> was quite popular.</p>
