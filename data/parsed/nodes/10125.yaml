    html: <p>What a bunch of experts we have here. Thank you, Raph, for mentioning Caledonia. Sheesh! In this time period, every other book was printed in Caledonia, and what wasn't, was printed in Granjon. These types are almost unknown to today's cognescenti because they did not have happy transitions either to photo or digital, but they were utter mainstays of the day. So was Electra. And Vinnie, congratulations for reading Types Best Remembered/Best Forgotten, but, as someone who has actually made a Franklin Gothic from the ATF originals, and as someone who has some experience typesetting with ITC Franklin Gothic, I have to say that ITC FG is one of the best implemented digital types there is. For overall quality and fitting, very few sans serifs come close. The design isn't really the important thing here. It's how well it works. This is one of the most functional types in the entire digital universe.</p>
    html_clean: <p>What a bunch of experts we have here. Thank you, Raph, for mentioning Caledonia. Sheesh! In this time period, every other book was printed in Caledonia, and what wasn't, was printed in Granjon. These types are almost unknown to today's cognescenti because they did not have happy transitions either to photo or digital, but they were utter mainstays of the day. So was Electra. And Vinnie, congratulations for reading Types Best Remembered/Best Forgotten, but, as someone who has actually made a Franklin Gothic from the ATF originals, and as someone who has some experience typesetting with ITC Franklin Gothic, I have to say that ITC FG is one of the best implemented digital types there is. For overall quality and fitting, very few sans serifs come close. The design isn't really the important thing here. It's how well it works. This is one of the most functional types in the entire digital universe.</p>
