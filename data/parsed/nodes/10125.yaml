    html: <p>Wow, is it really true that Bitstream NG is TG? I remember asking Jim Lyles why the Q wasn't what I expected, and I forgot what he said but it didn't have anything to do with TG. Anyway, I changed the Q to what I thought it should be in my NG. Can anyone tell me what type I actually digitized? It's awfully humiliating not to know. Like I said, it was a very hurried affair. My files are in total chaos, but I seem to have found an MM in Win format I can send to anyone who wants it. What I can't find is exactly what we released, because I can't find the Bistream CD. Has anybody rigorously analyzed the differences between LLG, FG, NG, TG?</p>
