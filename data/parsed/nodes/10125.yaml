    html: "<p>&gt;So that is why I don't like it because Franklin Gothic was a fat boy not a whole family. <br> <br>Oh, well that makes more sense. But two things: has anyone ever really analyzed all these fonts and discerned what the relationships might be? I just give as one example, News Gothic. I did a two weight multiple master for Bitstream of this, rather limited. I think it was regular to bold, and normal to narrow? Don't exactly remember. Anyway, what I noticed at once was that the type was not really a good candidate for interpolation as is easily illustrated as soon as I tried to extrapolate to lighter and heavier or wider or more condensed versions. They all looked horrible, without exception. Extrapolation revealed the extent to which the extreme masters I used were not really compatible designs. But I did not do any historical research. I just used Bitstream's masters - the whole thing had to be done in a couple of weeks. I don't remember if we did an italic. Was the News Gothic bold I used really a bold designed as a companion for NG? Or was it in reality the base weight of Franklin Gothic? <br> <br>Now we come to Franklin Gothic. To what extent is that a unified, rationalized design? To what degree is it interpolable?  <br> <br>And that brings me to my second point about ITC FG, which is that the condensed and compressed weights are incredibly reliable and useful for tabular material where space is really at a premium. Is there anything to beat these rather late additions to the family for pure functionality? <br> <br>As so often with ITC fonts, it's the name, rather than the design, that seems to get peoples' dander up. Perhaps if ITC FG had been called something else, people would have nothing but praise for it. Rather like ITC Garamond. If only it hadn't been called Garamond, it might have won endless praise as a superbly designed high x-height oldstyle. It, by the way, _has_ proven to be rationally enough configured that a successful (and strikingly functional) multiple master was made, apparently without too much compromise of the original design elements, and without too very much technical difficulty. (I think it was the first MM to use an intermediate master, which I think, again, was only used for one letter.) You could do some very nice pseudo-optical scaling with ITC Garamond -- in fact, by manipulating weight and width, you could probably come up with some variants that would be more successful than the rather bogus optical axes Adobe experimented with. <br> <br>Re Martin Majoor: I read that paper with interest, but isn't it striking how much life there is in the old, irrational sans serifs - those based on AG, and those based on NG/FG/LL? They are still going strong a hundred years later, yet after only ten years, nobody ever, ever, ever wants to see Scala again even though it was a breath of the freshest air in the early 90s. Also: Scala may have been the first intentionally designed serif/sans family but Today Sans was the first after metal with different optical sizes. Absolutely the first sans superfamily. (Optical sizes, ligatures, small caps, OS figs, the lot.) Mac McGrew clearly illustrated how useful optical scaling could be in even rather crude sans serifs. Finally, isn't it rather bogus to keep on prattling on about how great it is to have unified sans/serifs in text composition? FG and Scotch have little to do with one another, yet they hold up so well. (Or am I wrong? Majoor makes an interesting case that AG is based on Walbaum, which is a cousin of Scotch; on the other hand, how close is the relation of the American Gothics to AG, obvious letters such as a and g aside?)</p>"
