    html: "<p>&gt; These types are almost unknown to today's <br>&gt; cognescenti because they did not have happy <br>&gt; transitions either to photo or digital <br> <br>I don't think that's the reason; there's a twist here that one must note: text fonts have less presence in \"conscious memory\" than display fonts*. Type that's easy to read (conventional, set small, etc.) is by nature harder to appreciate stylistically; laymen -the main point of our concern, hopefully- can't really tell the difference between Caledonia and Granjon and Times**, unless you hold their noses to the page and force them to notice differences. In this way, display fonts are in effect more representative of time periods (at least in the conscious realm). <br> <br>* This is also probably why they last longer than display fonts. <br> <br>** Also, one would think that newspaper fonts would be even more significant here than book faces - but I think both are secondary. <br> <br>As for Lightline Gothic, it was designed by MFB too, right?* If so, it seems misguided to lay any kind of blame on Franklin Gothic. Plus I can't find any reference to this stuff in the \"Types Best Remembered\" contents list... What page is it on? <br> <br>* Unless it was a pre-ATF font that Benton is now erroneously given credit for? <br> <br>hhp</p>"
