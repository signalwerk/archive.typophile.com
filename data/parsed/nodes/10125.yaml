    html: "<p>Benton's gothics are rarely given the credit they deserve. I consider Franklin Gothic and friends to be the first true modern sans fonts; they were a dramatic improvement over their successors. Gaze upon these scans from the 1912 ATF book in awe: <a href=\"http://levien.com/type/atf_1912/p0738_sm.jpg\">42-96pt</a>, <a href=\"http://levien.com/type/atf_1912/p0739_sm.jpg\">5-36pt</a> <br> <br>In particular, I do not consider the fit of the ITC devival <a href=\"http://www.myfonts.com/fonts/linotype/itc-franklin-gothic/heavy/testdrive.html?s=newspaper&amp;p=72\">impressive</a>. (and yes, the myfonts.com test drive <i>does</i> use the kern pair info from the font).</p>"
    html_clean: "<p>Benton's gothics are rarely given the credit they deserve. I consider Franklin Gothic and friends to be the first true modern sans fonts; they were a dramatic improvement over their successors. Gaze upon these scans from the 1912 ATF book in awe: <a href=\"http://levien.com/type/atf_1912/p0738_sm.jpg\" class=\"link-external\">42-96pt</a>, <a href=\"http://levien.com/type/atf_1912/p0739_sm.jpg\" class=\"link-external\">5-36pt</a> <br> <br>In particular, I do not consider the fit of the ITC devival <a href=\"http://www.myfonts.com/fonts/linotype/itc-franklin-gothic/heavy/testdrive.html?s=newspaper&amp;p=72\" class=\"link-external\">impressive</a>. (and yes, the myfonts.com test drive <i>does</i> use the kern pair info from the font).</p>"
