  - id: 64257
    user: 4406
    date: 2005-04-06T13:07:00
    date_raw: 6 Apr 2005 — 1:07pm
    votes: null
    html: "<p>Bill: for God's sake get an ATF specimen book and take a close look at Benton's gothics yourself. News and Franklin gothics are closely related stylistically, but they are not two (interpolable) weights of the same basic skeleton. Trying to force that is one of the mistakes made by the ITC version, in my opinion (it comes out as a relatively narrow 'c', and wide 'a' and 's', while Benton's version is beautifully harmonious). Franklin and News both come in condensed and extra condensed forms, every bit as useful as ITC's. The normal-width gothics also harmonize well with the Alternate Gothic series, which is based on the same fundamental lettershapes but an 'o' which is two vertical stems with rounded joins at the ends, rather than an oval as in the Franklin and News  Condensed. <br> <br>You can get a 1934 ATF book for $10 on abebooks, but the 1912 and 1923 editions are worth the expense.</p>"
    html_clean: "<p>Bill: for God's sake get an ATF specimen book and take a close look at Benton's gothics yourself. News and Franklin gothics are closely related stylistically, but they are not two (interpolable) weights of the same basic skeleton. Trying to force that is one of the mistakes made by the ITC version, in my opinion (it comes out as a relatively narrow 'c', and wide 'a' and 's', while Benton's version is beautifully harmonious). Franklin and News both come in condensed and extra condensed forms, every bit as useful as ITC's. The normal-width gothics also harmonize well with the Alternate Gothic series, which is based on the same fundamental lettershapes but an 'o' which is two vertical stems with rounded joins at the ends, rather than an oval as in the Franklin and News  Condensed. <br> <br>You can get a 1934 ATF book for $10 on abebooks, but the 1912 and 1923 editions are worth the expense.</p>"
