      <p>I think it can be done with caps and lower case. If anyone have another way to do it, please let me know. :-)</p>
      <p>By the way, I'm thinking about release it in 2 versions -- <em>ribbon</em> and <em>sketch</em> (with a calligraphic stroke) -- and both with 3 variants -- <em>short</em>, <em>medium</em> and <em>long</em> -- so you'll be able to compose your own rhythms... ;-)</p>
