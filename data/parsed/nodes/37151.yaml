    html: |-
      <p>Thank you James. I already had discovered an arabic feeling on it, but I didn't know <a href="http://www.omniglot.com/writing/ogham.htm" rel="nofollow"><strong>Ogham</strong></a>. It's a very interesting system... I'll look more carefully on it.</p>
      <p>This is an old concept revisited - I think the first time I sketch something in this way was in 2003 - so, maybe it got a nice 'maturation time'.</p>
      <p>I understand when you said it's 'constructed', but I think it's 'constructed' only in the way I show it here - tape/ribbon. I'm trying to get it very fluid. Imagine it only with line, drawn by hand. Isn't it looks more fluid?</p>
      <p>Great part of the glyphs I did with just one 'line', others I didn't found yet how to do it, but I think it has and interesting rhythm when composed... By the way, as I said, it's an experiment, and legibility isn't my priority. I'm highly interested first in concept, aesthetics and, of course, rhythm...</p>
      <p>My first thought about the usage isn't like a font necessarily, but in 'live action', with tape over urban surfaces, like a mixture of typography/calligraphy, tags and graffiti. Something close to <a href="http://www.designboom.com/eng/interview/sagmeister.html" rel="nofollow"><strong>Sagmeister</strong></a>'s ones, but in a more 'artistic' way...</p>
      <p>Well, I'll get some ribbons to play with. ;-)</p>
