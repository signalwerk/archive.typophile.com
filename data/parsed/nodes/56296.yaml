      <p>I agree with the others. You need a bit more detail with the tree part (let open spaces ’shine through’ the branches). The wrench part could use a tad more detail too. </p>
      <p>There’s also the size issue. Technically, the root system of a tree roughly equates to the branch system. As such, I think the wrench part could be quite a bit larger to balance out the tree.</p>
