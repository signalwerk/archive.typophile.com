      <p>Warning: this is only my opinion and it may or may not be true.</p>
      <p>"the following snippet will turn all 'a's into 'c's"<br>
      It doesn't work that way for me, neither in FontLab nor in FontForge.<br>
      1. Your example is equivalent* to:<br>
      sub a by b; # 1st rule<br>
      sub b by c; # 2nd rule<br>
      2. It will work that way:<br>
      -   "abc" -&gt; "bbc" ["a" is substituted by "b"; no more "a"s] 1st rule<br>
      -   "bbc" -&gt; "bcc" [<strong>second</strong> "b" is substituted by "c"; no more "b"s] 2nd rule<br>
      3. If your first example works as you described, then try:<br>
      sub a by b;<br>
      sub b by a;<br>
      (or better not...)</p>
      <p>* "A lookup is a group of rules of the same type." Your feature has rules of the same type (one to one substitution) so no need to hide them in a lookups.</p>
