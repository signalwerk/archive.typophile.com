      <p>Odd it doesn't work for you; it does for me in FL. But my first example isn't equivalent to<br><code><br>
        sub a by b;<br>
        sub b by c;<br></code><br>
      Those two lines just turn a string of 'a's into 'b's, not into 'c's (as you know) because without a separate lookup for the second rule the layout engine doesn't go back to the start of the glyph run. What puzzles me is that, in my second example, <code>lookup DoesntReRun;</code> doesn't send the layout engine back to the start in the same way as defining and running the lookup in place does.</p>
