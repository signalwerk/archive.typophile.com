      <p>It is my understanding that the  cursor never goes backwards (though contextual rules allow looking at left contexts). </p>
      <p>If you have many substitution rules in a lookup, it is my understanding that the first that matches is applied. If you have many lookups they are applied in a row. So if the string is ab and the first lookup says to replace a by b and b by c, then you will endup with bc because the first rule matches a and will replace a by b and then the cursor moves forward one position and then the second rules applies for b. If you have a first lookup that replaces a by b and a second lookup that remplaces b by c, then a will be replaced by b by the first lookup and then b by c by the second lookup and then the cursor will move forward one position to the second character and then the second lookup will replace b by c to give cc as a result. If your first lookup replaces b by c and the second replaces a by b, then on ab the first lookup does nothing on a and the second replaces it by b and then the cursor moves to the second glyph that is replaced by c; the resulting string is bc. </p>
      <p>I tried with FontForge with the following code: on ab, ss01 gives bc, ss02 gives cc and ss03 gives bc as expected.</p>
      <p>feature ss01 {<br>
       lookup trysubboth {<br>
        lookupflag 0;<br>
          sub \a by \b ;<br>
          sub \b by \c ;<br>
       } trysubboth;<br>
        script DFLT;<br>
           language dflt ;<br>
            lookup trysubboth;<br>
        script latn;<br>
           language dflt ;<br>
            lookup trysubboth;<br>
      } ss01;</p>
      <p>feature ss02 {<br>
       lookup subab2 {<br>
        lookupflag 0;<br>
          sub \a by \b ;<br>
       } subab2;<br>
       lookup subbc2 {<br>
        lookupflag 0;<br>
          sub \b by \c ;<br>
       } subbc2;<br>
        script DFLT;<br>
           language dflt ;<br>
            lookup subab2;<br>
            lookup subbc2;<br>
        script latn;<br>
           language dflt ;<br>
            lookup subab2;<br>
            lookup subbc2;<br>
      } ss02;</p>
      <p>feature ss03 {<br>
       lookup subbc3 {<br>
        lookupflag 0;<br>
          sub \b by \c ;<br>
       } subbc3;<br>
       lookup subab3 {<br>
        lookupflag 0;<br>
          sub \a by \b ;<br>
       } subab3;<br>
        script DFLT;<br>
           language dflt ;<br>
            lookup subbc3;<br>
            lookup subab3;<br>
        script latn;<br>
           language dflt ;<br>
            lookup subbc3;<br>
            lookup subab3;<br>
      } ss03;</p>
