      <p>Thanks Michel. The <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#7.a" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Adobe Feature File spec</a> says the cursor does go back with each lookup: "each lookup corresponds to one 'pass' over the glyph run". You can prove it by giving a string of 'a's to the following code, which returns not 'i's, as it would if the layout engine went through all lookups before moving on to the next glyph, but 'j's:<br>
      sub a by b;<br>
      lookup proof {<br>
        sub b' a by i;<br>
        sub b' b by j;<br>
      } proof;<br>
      That's why I expected <code>lookup DoesntReRun;</code> at the end of my second example to send the cursor back to the start, turning all the new 'b's produced by <code>sub a by b;</code> into 'c's. The following code does do what I'd expected, despite using only lookup calls rather than definition-and-execution in place:<br>
      lookup sub_a {<br>
        sub a by b;<br>
      } sub_a;<br>
      lookup sub_b {<br>
        sub b by c;<br>
      } sub_b;<br>
      feature xxxx {<br>
        lookup sub_a;<br>
        lookup sub_b;<br>
      } xxxx;</p>
      <p>But now I've noticed something else odd: the last piece of code does exactly the same thing if you swap the order of the lookup calls, but changes its behaviour if you swap the order of the lookup <em>definitions</em>. Specifically, given a string of 'a's, it returns 'b's instead of 'c's. This language is weird.</p>
