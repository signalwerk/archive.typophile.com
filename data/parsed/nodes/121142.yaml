    <p>I think I'm getting to grips with OpenType coding -  I just birthed my first contextual one-to-many substitution, and am as proud as you'd expect - but I'm still puzzled by one thing and unsure about another.</p>
    <p>The puzzle is that when I define-and-run a lookup, the layout engine goes back to the start of the glyph run, as I'd expect. But when I call a lookup, it doesn't, at least in FontLab. Is that just how it is? </p>
    <p>The uncertainty is over whether all kinds of lookup types are allowed in all features, or whether it's better to stick to the lookup types specified for features at <a href="http://www.microsoft.com/typography/otspec/features_ae.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">the Microsoft OT spec site</a>. I know FontLab is liberal, but are all apps?</p>
    <p>Thanks very much for any help!<br>
    George</p>
