      <p><cite> 2) Lookup definitions written outside a feature but called within one are copied in written order to the top of the feature's code.</cite><br><cite>2) All lookup calls themselves are then deleted.</cite></p>
      <p>This is incorrect. To understand what's going on you need to understand that the GSUB table within a font is a set of ordered lookups, and that feature tags simply indicate a set of lookups which are to be applied when that feature is active. To illustrate this, consider the following:</p>
      <p>feature xxxx {<br>
          sub a by b;<br>
          sub x by y;<br>
          lookup lookupA {<br>
              sub c by d;<br>
          } 1ookupA;<br>
      } xxxx;</p>
      <p>feature yyyy {<br>
          sub a by c;<br>
          lookupA;<br>
      } yyyy;</p>
      <p>The above code will create a GSUB table containing three lookups as follows, which appear in the order in which they are defined (implicitly or explicitly) in your code:<br>
      lookup1 {<br>
          sub a by b;<br>
          sub x by y;<br>
      } lookup1;<br>
      lookupA {<br>
          sub c by d;<br>
      } lookupA;<br>
      lookup2 {<br>
          sub a by c;<br>
      } lookup2;</p>
      <p>Feature tag xxxx will specify that lookup1 and lookupA are to be applied.<br>
      Feature tag yyyy will specify that lookup2 and lookupA are to be called.</p>
      <p>The fact that the call to lookupA appears <em> after </em> the line <code> sub a by c; </code> does not override the fact that lookupA has been defined <em> before </em> lookup2 in the feature file.</p>
      <p>So, if you apply feature yyyy to the string 'abc' the output will be 'cbd' rather than 'dbd' since it is the order of the lookup definitions, not the order of the lookup calls which is relevant.</p>
      <p>André</p>
