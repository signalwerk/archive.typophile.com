      <p>Thanks both of you. My provisional understanding, after some more experimentation, is that it works as if<br>
      1) Sequences of rules outside explicit lookups within the same script and language, with the same lookupflag, and of the same lookup type (e.g. non-contextual one-to-one or reverse contextual) are converted to anonymous lookups. For this purpose, lookup calls are treated as boundaries between rule sequences.<br>
      2) Lookup definitions written outside a feature but called within one are copied in written order to the top of the feature's code.<br>
      2) All lookup calls themselves are then deleted.<br>
      Which is impressively user-hostile, but no more so than the fact that rules written after script latn;<br>
      language dflt; are actually excluded from all latin-script languages not explicitly mentioned (hope I've got that right).</p>
