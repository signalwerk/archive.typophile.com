      <p>The <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#7.a">opentype engine's layout algorithm</a> is indeed rather clear. Another "proof" that there is more than one pass is that with</p>
      <p>feature calt {<br>
        script latn;<br>
           language dflt ;<br>
             sub  \a \a'   by \b;<br>
      } calt;</p>
      <p>feature dlig {<br>
        script latn;<br>
           language dflt ;<br>
            sub \a \b by \c ;<br>
      } dlig;</p>
      <p> 'aaaaaa' is replaced by 'ccc'  if calt and dlig are activated.</p>
