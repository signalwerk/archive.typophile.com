      <p>Thanks JanekZ! I knew about that article, but it doesn't talk about the fact that the following snippet will turn all 'a's into 'c's: </p>
      <p>sub a by b;<br>
      lookup ReRun {<br>
        sub b by c;<br>
      } ReRun;</p>
      <p>whereas this snippet won't: </p>
      <p>lookup DoesntReRun {<br>
        sub b by c;<br>
      } DoesntReRun;<br>
      sub a by b;<br>
      lookup DoesntReRun;</p>
      <p>Do you think the ban on lookup types in features where they're not specified only applies to substitutions that take or return the wrong number of glyphs? Or does it mean you also can't do contextual substitutions where only non-contextual are specified, or non-contextual where contextual are specified? There are places where bending the rules would be handy even for basic stuff: for instance, contextual substitutions in <code>locl</code> for Catalan punt volat; one-to-many in <code>smcp</code> for decomposing germandbls.smcp to s.smcp.DEU s.smcp.DEU; and many-to-one in <code>salt</code> or <code>ss01</code> for replacing s.smcp.DEU s.smcp.DEU with germandbls.smcp.alt.</p>
