      <p>The Terrible Secret of OpenType 2</p>
      <p>[7.b. Ordering of lookups and subtables]<br>
      "Lookups will be created in the GSUB/GPOS table's LookupList in the same order as the corresponding named lookup blocks or runs of rules in the feature file"<br>
      so if you have named lookups:<br><code>lookup sub_b<br>
      lookup sub_a</code><br>
      in that order, then:<br><code>feature xxxx {<br>
        lookup sub_a;<br>
        lookup sub_b;<br>
      } xxxx</code><br>
      is executed in order of named lookups.<br><img src="/sites/default/files/old-images/The Terrible Secret1_5528.jpg"><br><img src="/sites/default/files/old-images/The Terrible Secret2_6466.jpg"></p>
