    <p>Dear Typophiles, </p>
    <p>It was with much pleasure that I discovered this website and the wonderful enthusiastic discussions that typographers have here!</p>
    <p>As a designer in her first year of professional work, I've encountered a question that has gone unanswered for some time. </p>
    <p>Having read books by great designers (Vignelli, Bringhurst etc.) as well as this forum I became enthusiastic about the use of baseline grids in my work. This technique had not been taught at university and once I began to practice using the baseline grid in my personal work I found that I could hardly do without it. </p>
    <p>However, at not ONE of the studios I have worked in to date (about 4 or 5 so far)has any designer been in the practice of using a baseline grid. Furthermore, I have found that rather than hard using hard returns, half line gaps etc., most designers specify their paragraph spacing in millimeters. My question is, is using millimeters for paragraph spacing bad practice when line spacing is being specified in another unit (points) as therefore the values for line spacing and paragraph spacing have no relationship?</p>
    <p>My second question arises from an art director having asked me to make the y-co ordinate of each object on a page in InDesign a whole number as they believed that this reflected typographic discipline, as opposed to placing objects with a y-coordinate that involved a decimal point, e.g. 5.65. What are your opinions on this?</p>
    <p>Sorry for the long post! I would appreciate hearing everyone's thoughts on these two questions!</p>
    <p>many thanks!</p>
