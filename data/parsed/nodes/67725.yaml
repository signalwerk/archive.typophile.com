      <p>Millimeters??? I can't even imagine why anyone<br>
      would use millimeters (and I grew up in Canada).</p>
      <p>I'm a firm believer in working on the baseline grid.<br>
      That said, I also think you can break rules if you know the rules. There are some times when it's not essential to the solution. </p>
      <p>As for y-coordinate relationships...<br>
      Precision is key and rarely does something need to sit at Y: 3.2713" instead of 3.3". If multiple people are working in documents it's important to work on A GRID (even if it's not the baseline grid). Tidy design is good practice to adopt (the production team will love you if you make their job easier).</p>
      <p>My pet peeve is type set at weird random sizes (9.674583 pt???).<br>
      It's just sloppy.</p>
