      <p>My opinion is somewhat different.</p>
      <p>As type uses points, makes more sense to use leading also in points. This makes easier to identify the relationship between one and other measure. The same is less evident in space after/before paragraphs as these measures are completely independent from type sizes.</p>
      <p>Of course, to use points in all measures is more natural to most people as we set type size with this unit since the very first time we got in touch with type. But in countries where the metric decimal system is adopted, people learn to <em>think</em> in meters, centimeters and millimeters since childhood. In this scenario, to use millimeters in measures except type itself is not so strange.</p>
      <p>I don't think this a clear matter of right-or-wrong, but much more a question about the measurement system which people are used to. If a designer feels comfortable to use 4,8mm as leading and has the exact notion about which space this represents, there is no problem to prefer mm instead of pt. Difficulties may arise only due to the workflow of this publication. So the real good practice I see here is not to adopt a schema which just you understands or manages.</p>
      <p>Although I use type/leading in pt, I prefer to use space before/after in mm. In my brain the notion of space in mm is more exact as I always used them. I do this for many years and never found any problem. Rules? Well, one must respect the rules as they are here for some reason. But one must not blindly follow a rule just because it exists.</p>
      <p>Talking about rules, take for example Bringhurst's deep study about page margins and proportions in <em>Elements of Typographical Style</em>. It's a very good set of criteria to define page sizes and margins. But must I adopt them just because there is a geometrical definition behind? These large external and bottom margins Bringhurst himself uses are geometrical results. Anyway, as a reader I look to the book and find these margins excessive. There is very much blank space at bottom of page and this uneven fulfilling is not comfortable for me –and for many other readers, as I verified while teaching design. So, I don't follow these highly geometric rules, even if they are presented by a master as Bringhurst.</p>
      <p>As someone already said, you must known the rules, you cannot ignore them –but you may not follow a rule it if there is a good reason to do so.</p>
      <p>About the position for graphics, it seems that art director read half of the instructions and mixed something. To put graphic elements at integer positions is correct when you're using a grid with integer increments. Outside this, IMHO just the position of other elements (titles, boxes) need to be observed.</p>
