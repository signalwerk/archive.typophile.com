      <p>It is just a choice you make. Points/pica's rule because that's based in history. The German type-firm Berthold tried to go metric in the seventies and got some following in the European advertising world… And went bust a decade ago.</p>
      <p>Digital type should have been the break with the past but amateurs were involved in the first dtp-programs and did not seize the opportunity (and being mostly American anti-metric by definition).</p>
      <p>My advice: use metric or use non-metric, but don't mix the systems.</p>
