      <p>Your art directors are asses!</p>
      <p>Since the proper and classic unit of measurement for type is points, so should the measurement for paragraphs be. Otherwise, as you said, there is no relationship. It's very hard to tell what a corps 9 points does with leading 6 mm, but everyone (except your art directors possibly) understands 12 points with leading 14 points. Using points in stead of millimeters gives you way much more control and finesse of what you're doing.</p>
      <p>There are some classic formats to paragraph layout, for instance 8 leading 10, 9 leading 11, 10 leading 12, 14 leading 18 et cetera. That's typographic discipline! Possibly this answers your second question too. Because in most cases the leading will be expressed as a whole number, but in points, not in millimeters.</p>
      <p>The baseline grid is one of the most important things in layout software, especially when designing magazines or books. </p>
      <p>It all comes down to practise of course, so when you're used to using millimeters, no harm done. But for me, as a classicly trained graphic designer, millimeters is not the way to go.</p>
