      <p>&gt;  asked me to make the y-co ordinate of each<br>
      &gt; object on a page in InDesign a whole number</p>
      <p>I had a corporate client once who had a rule that all coordinates and object sizes in InDesign had to be rounded off the the nearest point (or 1/2 point for type itself), unless there was a good reason not to. Their reasoning was that tiny fractions made the job more complex when communicating or matching sizes &amp; coordinates.</p>
      <p>At the time it seemed silly to me, but I've gradually adopted that practice myself. For example, if I draw a border guideline and notice its 2.99 picas from the page edge, I'll make 3 picas. </p>
      <p>It just seems a bit more clean and precise, plus it makes life easier if later you're trying to confirm that sizes are consistent from page to page. "I need to remember that column one should always be 20.03 picas wide, and column 2 should always be 11.97 picas wide". Easier to make it "column one is always 20 picas and column 2 is always 12 picas wide".</p>
      <p>But obviously design considerations should come first. </p>
      <p>James</p>
