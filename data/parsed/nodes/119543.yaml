  html: |-
    <p>I used to think that the present world of design is dictated by Swiss and Germans. The postwar era, in my opinion, shaped almost all aspects of the present modern design, organized by grids, driven by scientific psycho-biology researches and aiming for the maximum efficiency and responsibility. They seem to be totally fine for me, but I am more curious, after working for a letterpress artist &amp; typographer, about whether there are alternative choices to Helvetica (and all other postwar rational movements it epitomizes)?</p>
    <p>The design program I attend has filled its list with many Helveticas, starting from Josef Muller-Brockmann to Tschichold’s Die Neue Typographie (except for Bringhurst). I wonder if there are other design books that do not necessarily follow this trend.</p>
