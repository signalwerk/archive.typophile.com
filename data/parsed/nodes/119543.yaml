      <p>Helvetica is a good typeface but can look a little dated due to its heavy use a few decades ago. But it's still used a lot (for example Apple uses it) and the general public may not pick up on the overuse as much as designers do.</p>
      <p>Most designers I know who use Helvetica today (because it's their client's corporate font) tend towards the lighter weights (and sometimes condensed) which can look more contemporary than the bolder weights.</p>
      <p>And certainly there are many alternatives to Helvetica.</p>
