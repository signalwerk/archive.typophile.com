    <p></p><div class="imageWrap"><img src="http://typophile.com/files/snippet_5545.jpg"></div><p></p>
    <p>Yes, that is Brush Script.</p>
    <p>In this snippet image, you see two ways the script typeface will be used on this website. I would love for those more knowledgeable in typeface-pairing to make some suggestions. I am quite lost when it comes to script/brush fonts, even moreso with pairing them.</p>
    <p>Some more info: This is for a website design. The sans-serif typeface "Avante Garde Gothic" is not changeable.</p>
    <p>Thank you for your time and input.</p>
