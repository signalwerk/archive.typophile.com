    html: <p>It’s certainly a <a href="/wiki/Font%252BNaming" class="wiki">Font Naming</a> problem. More than one font has the same name.</p>
    html_clean: <p>It’s certainly a <a href="/wiki/Font%252BNaming" class="wiki">Font Naming</a> problem. More than one font has the same name.</p>
  - id: 259568
    user: 909
    date: 2008-02-17T10:41:00
    date_raw: 17.Feb.2008 10.41am
    votes: null
    html: |-
      <p>That is to say, the combination of the Windows values of NameID=1 and NameID=2 must be unique for each font, and you can’t have more than four fonts with the same NameID=1(Win).</p>
      <p>There are more complications than that, but that’s a key starting issue in such a conversion.</p>
      <p>T</p>
