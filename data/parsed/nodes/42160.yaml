    <p>I’ve been trying to convert this old format font of mine (.FFIL Font Suitcase format) to a more up-to-date format, OpenType. I’ve been using TransType Pro 3 to convert them and it converts them fine and all but I can’t get them to show up properly on my PC.</p>
    <p>I have many different weights and want to put them all into one superfamily but it only shows up two weights on my PC but fine on my Mac.</p>
    <p>I was hoping someone would know how to solve this problem as it is very annoying and I have tried whatever I can.<br>
    </p><div class="imageWrap"><img src="/files/fontlist_6522.jpg"></div><br>
