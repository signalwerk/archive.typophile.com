  html: |-
    <p>These redesigns belong to the <a class="freelinking external" href="http://richardsmith.posterous.com" rel="nofollow">Dollar Rede$ign Project</a>.</p>
    <p>First one by <a class="freelinking external" href="http://richardsmith.posterous.com/dollar-redeign-michael-tyznik" rel="nofollow">Michael Tyznik</a>. I'd like to know the font for numerals: '20', '50' (Trade Gothic?) and the font used for 'Twenty dollars', 'Fifty dollars'. I know they're easy, but I can't figure them out.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/20_obverse_final_3622.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/50_obverse_final_4684.jpg"></div><p></p>
    <p>Second one by <a class="freelinking external" href="http://richardsmith.posterous.com/dollar-redeign-michelle-haft" rel="nofollow">Michelle Haft</a>. That nice font for numerals.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/currency2_michellehaft_3516.jpg"></div><p></p>
    <p>Thanks!</p>
