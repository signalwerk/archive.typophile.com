    <p>Hello Everybody!<br>
    I'm making my first font and I'd like to discuss if there anybody using small cups with swashes? In what situations can it be useful?  I'm asking 'cos I made them in my font but then began to doubt if it was reasonable. Could you remember some examples of fonts with swashed small caps and maybe show pictures with washed small caps in use? Thank you!</p>
comments:
  - id: 458244
    user: 2021
    date: 2011-04-01T09:33:00
    date_raw: 1 Apr 2011 — 9:33am
    votes: null
    html: |-
      <p>I don't recall any types with swashed small caps.<br>
      You could experiment with a typeface that has Swash caps, making a faux small cap, and seeing what it looks like (use the Stroke feature in InDesign/Illustrator).<br>
      Or maybe you could work with a type that has Swash caps, and make the swash small caps different, so that a setting of Swash Caps with Swash Small Caps would have a unique look.</p>
  - id: 458260
    user: 1215
    date: 2011-04-01T10:38:00
    date_raw: 1 Apr 2011 — 10:38am
    votes: null
    html: |-
      <p>The thing about swash capitals is that they’re usually only useful with in combination with lowercase, rarely in an all-caps setting (in fact, such practice is usually frowned upon).</p>
      <p>So, since small caps are generally intended for use together — a smaller rendition of all-caps&nbsp;— the idea of swash small caps is a bit counterintuitive.</p>
      <p>That doesn’t mean that one couldn’t conceive of a few small caps in more decorative variants, like the kind of <em>J N T Y</em> that were typical in, say, a Baskerville-style italic. But beyond that, I don’t think such a thing would be very useful.</p>
  - id: 458266
    user: 46071
    date: 2011-04-01T11:26:00
    date_raw: 1 Apr 2011 — 11:26am
    votes: null
    html: |-
      <p>One application I can imagine is on formal invitations as an additional visual tool for establishing hierarchy (handy for setting roman numerals too ;-)</p>
      <p>Except for the roman numerals, in this context only middle and final forms would be required.</p>
