    html: <p>Yeah, great examples! Is the TT in LETTER a ligature? At the size you posted it it looks a bit odd, almost like two Ts touching but not quite integrated.</p>
  - id: 458826
    user: 97507
    date: 2011-04-05T11:33:00
    date_raw: 5 Apr 2011 — 11:33am
    votes: null
    html: <p>Yes, TT is a ligature, I made it to improve letter spacing between two Ts (both in capital and small caps variants). First I tried to make it with common horizontal bar (without a center vertical serif), but it seemed to me reminding a cyrillic letter П and I decided to add this vertical serif to avoid confusion with П, since I do cyrillic too.</p>
  - id: 460834
    user: 82305
    date: 2011-04-18T20:22:00
    date_raw: 18 Apr 2011 — 8:22pm
    votes: null
    html: <p>Some of Slimbach's faces (e.g., Brioso) have a TT ligature with no center serif, and it looks all right for decorative settings; I think, though I would rather use a ligature with a single bar or two separate Ts; the ligature above looks a little bit like a kerning mistake.</p>
  - id: 461695
    user: 97507
    date: 2011-04-24T08:16:00
    date_raw: 24 Apr 2011 — 8:16am
    votes: null
    html: "<p>Thank you for comment! I looked at Slimbach's Arno Pro and Brioso, and saw a TT ligature without central serif there, so I decided to leave two variants of TT in my font: without without central serif as a default (in liga feature), and with it as a variant (in dlig): </p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/T_T_3881.png\"></div><p></p>"
