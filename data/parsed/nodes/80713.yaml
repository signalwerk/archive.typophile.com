  - id: 458630
    user: 83226
    date: 2011-04-04T07:55:00
    date_raw: 4 Apr 2011 — 7:55am
    votes: null
    html: <p>I can see using the swash small caps as the first and/or last letter of a word or line, but I think it'd look terrible to have an entire word or line of all swash. You might want to have some examples in your type specimen showing the user how to set them tastefully (as opposed to just turning OT All Small Caps and OT Swash on).</p>
  - id: 458657
    user: 97507
    date: 2011-04-04T12:05:00
    date_raw: 4 Apr 2011 — 12:05pm
    votes: null
    html: "<p>Thanks for advice! Yes, I suppose that swashed small caps could be used at the beginning or end of the word with other small caps (r and k in the middle also) and in the combination with the first capital letter and other small caps (one of them may be the swashed middle or end form). I don't think somebody would like a word in all swashed small caps. For that case I wrote exclusions in the OT features for some swashes to be used only in the beginning of the word. Maybe it could look like this: </p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/Swashed_smcp2_6215.png\"></div><p></p>"
