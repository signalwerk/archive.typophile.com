    date: 2011-04-01T19:42:00
    date_raw: 1 Apr 2011 — 7:42pm
    votes: null
    html: <p>The most worrying thing is that my swashed small caps are equal to swashed capitals (first I made swashed capitals and then decided to do small caps for them). Most of them are initial forms with upper-left swashes, but there are several that can be used also as the middle or final forms (A, R, K, Z, Я). So here is the picture of swashed capitals and small caps:</p><div class="imageWrap"><img src="http://typophile.com/files/swashed_small_caps_5695.png"></div><p></p>
