      <p>@oldnick<br>
      Thanks for the introduction to the Palmer method and Spencerian which I didn't know about  - while these may be historically accurate, I feel they look far too businesslike and formal - particularly the caps in the Intellecta design font you referenced which seem very OTT. I think the type needs to be less intellectual and more real life/gritty.</p>
      <p>@JamesM<br>
      Other than using a cursive font to differentiate the letters from the regular chapters - no.</p>
      <p>@nina<br>
      If it was just a book of letters I think that would certainly be a possibility - but as these letter chapters will be interspersed with regular chapters set in roman type (probably Klim's Fejoia), I'm not sure something like dolly would be sufficiently different to give an adequate contrast at those sizes. </p>
      <p>geraintf<br>
      ha - you wouldn't say that if you had seen my handwriting...</p>
      <p>@Sii<br>
      If there was the time and the budget, then that would be a pretty good idea! Unfortunately there is very little budget (I'm doing the cover and layout for free) and it needs to be up on Lulu.com in 2 weeks in time for the Christmas "rush" - I think my chances of finding a 90 year old that could provide the required 200 pages or so of handwriting in time to hit that deadline are fairly remote - and I wouldn't want to be responsible for their "premature" passing - especially if they hadn't quite finished....</p>
      <p>Time constraints more than anything mean that I really do need to use a typeface for this - so I would be interested to hear any more suggestions you may have. One thing I would add is that the script needs to make a reasonably efficient use of space as every page costs money on lulu...</p>
