      <p>The writer of these letters most likely would have learned the <strong>Palmer Method</strong> of writing, which is eminently legible. Unfortunately, the only Palmeresque handwriting font I could find was Intellecta Design's Spencerian Palmer Penmanship, which is actually self-contradictory, since the Palmer style replaced Spencerian as the norm for American schoolchildren. Samples of true Palmer penmanship can be found here...</p>
      <p><a href="http://www.iampeth.com/books/palmer_method_1935/palmerMethod_1935_index.php" title="http://www.iampeth.com/books/palmer_method_1935/palmerMethod_1935_index.php">http://www.iampeth.com/books/palmer_method_1935/palmerMethod_1935_index.php</a></p>
