      <p>I can recommend my <a href="http://new.myfonts.com/search/handsome+pro/fonts/" rel="nofollow">Handsome Pro</a>-- it has relatively short extenders, so will make a good book page, not too airy.<br>
      Also the Pro version has proper cursive construction, with short exit strokes at the end of words, for sharp word spaces.<br>
      (You can examine this by clicking "Contextual Alternates" at the MyFonts type tester.)<br>
      And you get a choice of pens.</p>
