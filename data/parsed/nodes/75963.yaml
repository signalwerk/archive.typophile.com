    <p>Hey everyone</p>
    <p>I am designing a book that a friend has written in which every other chapter is a letter. The book is called <em>Cursive</em>.</p>
    <p>My friend is very keen to use a cursive/handwritten font for the letters but we both have some concerns about the legibilty of such long passages of text set out in this way.</p>
    <p>So - I was wondering if any typophiles might be able to recommend a script that might work for extended reading like this? In the book, the letters are hand written by an American man to his lover in the late 1930's. Historical accuracy with the script would be nice to have, but it is probably not essential - legibility and generally looking good is more important. </p>
    <p>My friend quite liked "American Scribe" (which is not particularly appropriate date-wise) but what put him off was the long horizontal crossbars on the t's as he felt they were too intrusive.</p>
    <p>If we can't find anything appropriate that works, then the fall-back option is to simply use an italic for the letters. In any other circumstances, I think this would be my preferred option, but as the book itself is called <em>Cursive</em>, my friend feels it is important to have a cursive script and I take his point.</p>
    <p>I would appreciate any suggestions you might have</p>
    <p>thanks.</p>
