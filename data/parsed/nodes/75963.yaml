    html: |-
      <p>@Nick Shinn<br>
      Handsome Pro Classic is a good suggestion - it certainly ticks the boxes as far as efficiency and legibility goes - however I find it a little too feminine and friendly for this, it just hasn't got quite the right feel.</p>
      <p>@Frode<br>
      Now that is an excellent suggestion. I hadn't considered the upright italics. I love the Seria italic and Joos looks good too. It gives a strong indicator of the pen, whilst being efficient, legible and reasonably comfortable on the eye for extended reading. I'm not sure that Seria italic fits that well with Feijoa though - and Seria is a little to spindly for the main copy, but it would probably work well with Scala for the main text.</p>
      <p>@Ale<br>
      Certainly some great scripts there Ale but again, none seem to have quite the right feel for this.</p>
      <p>The more I think about it, the more certain I become that the scripts that seem to have the right feel (like American Scribe, Lamar Pen etc) are all going to be inefficient, impractical and hard on the eye given the amount of text that needs to be set in them.</p>
      <p>If anyone can think of a script that is as efficient and legible as Nick's Handsome, but a bit more gritty, then I would be interested to hear about it but otherwise I think I am probably going to go down the upright italics route as suggested by Frode.</p>
      <p>Thanks for your help on this one guys - much appreciated.</p>
