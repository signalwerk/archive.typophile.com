      <p>You can't do that in FontLab. The assignment of keys to specific unicodes is the responsibility of the keyboard driver/keyboard layout. You could make a custom keyboard layout for use with your font using <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=ukelele&amp;_sc=1" rel="nofollow">Ukulele</a> though, but you still have to put your glyphs in the right slots in FontLab first.</p>
      <p>Jens</p>
