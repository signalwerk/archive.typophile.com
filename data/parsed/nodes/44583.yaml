    html: <p>It all depends which keyboard layout the user has chosen. Don't hack the encoding by giving your dingbats the unicode numbers for other characters unless you're the only person who is ever going to be using it. To assign particular glyphs to particular keystrokes, create a special keyboard layout for your font. If your glyphs don't have unicode values, you can always put them in the PUA.</p>
