      <p>&gt; So everything seems to be cool now — the QWERTY<br>
      &gt; row gives you 10-19, the ASDFG row gives you<br>
      &gt; 20-21, shift-QWERTY gives you 40-41,<br>
      &gt; and option-QWERTY gives you 70-79, etc. etc., etc.</p>
      <p>Of course this only makes sense if the user is using a U.S. English keyboard. On the German keyboard, the top row is QWERTZ, not QWERTY, while on the French keyboard, it's AZERTY, not QWERTY etc. etc., etc. </p>
      <p>I'm not sure if forcing the user to install a particular keyboard layout that he's never used before, to type in some characters, is very user-friendly. Also, keep in mind that once the user generates a PDF with numbers typed in this way, the underlying text will not be searchable and will yield nonsense. </p>
      <p>I think you'd be better off (at least as a complementary solution) with contextual alternates, initial, final and medial forms, and stylistic sets. </p>
      <p>Adam</p>
