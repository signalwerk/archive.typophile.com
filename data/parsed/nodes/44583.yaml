      <p>If you restricted your font to the ten numbers (which presumably occur in the usual order irrespective of keyboard language), then you could have four sequences of ten symbols in each font (plain, shift, option, and option-shift).</p>
      <p>Other than that, just use the North American keyboard, which covers a fair-sized constituency.</p>
