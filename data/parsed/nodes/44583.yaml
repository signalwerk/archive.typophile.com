      <p>Thanks for all the assistance, everyone.</p>
      <p>Nick, your suggestion sounds like what I ended up doing.</p>
      <p>My original post probably should've been more clear about what I was trying to do. I wanted to create a font that was all the numbers 1-99 each in a circle. I know there are existing fonts that are like this, but I thought it would be a fun challenge, and a way to get to know fontlab better. I've used the freeware font Combinumerals in the past, but was always annoyed by the way the glyphs were laid out on the keys. So I wanted to make sure that mine was in a logical order. I was hoping that I could assign a keystroke to a glyph, but since that's not possible, I just figured out where everything was. So everything seems to be cool now -- the QWERTY row gives you 10-19, the ASDFG row gives you 20-21, shift-QWERTY gives you 40-41, and option-QWERTY gives you 70-79, etc. etc., etc.</p>
      <p>I just have a little more tweaking to do, and it'll be done.</p>
      <p>thanks!</p>
      <p>Jonathan</p>
