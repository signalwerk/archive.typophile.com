    <p>I'm working on a font that is more or less a dingbat font. There are going to be a lot of glyphs, and I need to put them in a specific order on the keyboard.</p>
    <p>is there a way in Fontlab to specify what strokes on the keyboard are assigned to a glyph (ie.  I have a glyph that I want to be accessed by typing option-u. can I specify that somehow, or do i just need to place the glyph in the corresponding cell in fontlab)?</p>
    <p>I've searched through the manual and can;t seem to find the answer.</p>
    <p>thanks!</p>
    <p>Jonathan</p>
