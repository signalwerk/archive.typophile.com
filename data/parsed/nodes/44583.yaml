    html: |-
      <p>On a Mac:<br>
      * when the user chooses the U.S. English keyboard layout, pressing Option-U will produce ¨ and pressing Option-E will produce ´,<br>
      * when the user chooses the Polish keyboard layout, pressing Option-U will still produce ¨ but pressing Option-E will produce ę,<br>
      * when the user chooses the Czech keyboard layout, pressing Option-U will produce nothing while pressing Option-E will produce ę,<br>
      * when the user chooses the French keyboard layout, pressing Option-U will produce º and pressing Option-E will produce ê,<br>
      * when the user chooses the Russian keyboard layout, pressing Option-U will produce ў and pressing Option-E will produce ё.</p>
      <p>As you see, different keyboard layouts produce different characters. You might produce a font that would have a "handy" character mapping when used with a particular keyboard layout (Swedish, German, Czech, U.S. English or whatever your preferred layout is) but most likely, your "handy" character mapping will be useless for users of keyboard layouts other than yours. </p>
      <p>Regards,<br>
      Adam</p>
