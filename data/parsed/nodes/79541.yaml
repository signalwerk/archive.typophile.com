    <p>Hello all,</p>
    <p>Forgive me if this has no place on a type design blog but I had really no idea where else to go.<br>
    ( And this forum has always been so obliging in the past. )</p>
    <p>I am trying to hunt down the name for this particular sort of device do-dad. I know it has been used many times for infographics and in puzzle games etc.<br>
    Some have called it a pinwheel but I know that's not right. </p>
    <p>But I just can't figure out the name.</p>
    <p>Here is a link to a digital form of this thing:</p>
    <p><a href="http://www.andrewbosley.com/the-brainstormer.html" title="http://www.andrewbosley.com/the-brainstormer.html">http://www.andrewbosley.com/the-brainstormer.html</a></p>
    <p>Any ideas?</p>
    <p>Thanks!</p>
