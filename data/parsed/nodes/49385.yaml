      <p>Firstly to answer you question about placement. Koren placed each nikud and each ta'am very deliberately. Because all the nikud and ta'amim were manually placed he wasn't limited by technology. The preference was that the nikud didn't move and the ta'am was put in the correct position next to it. If it was possible to solve a collision problem by moving the nikud before and after only slightly then this was done, if not then the ta'am was moved vertically downwards (of course this is only a major problem on lower ta'amim).</p>
      <p>Yes the weight of the ta'amim are lighter than that of the nikud. Of course the same glyph is used for both the meteg and the sof pasuk and in both cases this is a ta'am. In the siddur we treat it as nikud I guess because it has a special meaning different of the meteg and the sof pasuk (I'm not even going to talk about ga'ayas and other stress marks).</p>
      <p>In terms of VOLT, you misunderstood what I said. Of course we are programming in a kamatz katan and shva na (and a shva nach too), however, you should know that when programming a font, the font has to be compiled. If there are too many lines in the code, the compiler cannot compile. At the moment the Koren Tanakh font with kerning, ta'amim collision preventing etc is too long and cannot be compiled. That means that the past 50 instructions that I have given to the programmer for collision avoiding cannot be put into the font. The programmer is now optimising the code so that it takes up less space and can be compiled.</p>
      <p>I mention this because if you want a font to have grammar rules built-in it will take up even more lines of code and you won't be able to compile your font. Now to be fair, Koren is a special case typeface because it's very narrow, very very tightly kerned and therefore there are many more collisions then a typeface such as Hadasa. </p>
      <p>Regarding pronunciation, I think you have got quite confused between pronunciation and masora.</p>
      <p>Traditionally the Ashkenazi Jews had their system of pronunciation of vowels where eg a kamatz is an "o" sound and Sefardim had their pronunciation system where a kamatz is an "a" sound. However, we need to differentiate between a pronunciation system and grammatical system.</p>
      <p>I will attempt to explain and hopefully it won't get too confusing.</p>
      <p>In Israel all Israelis, both Charedi Ashkenazim and Secular Sefardim pronounce spoken Hebrew in a system called "Israel pronunciation". That means that in the street everyone speaks more or less the same (I'm ignoring old-timer sefardim that will still pronounce the ayin and the chet).</p>
      <p>However, those same Charedim will prayer using the Ashkenazic pronounciation system. Okay so far.</p>
      <p>Now let's take a look at the kamatz katan. Ashkenazim of 300 years ago pronounced a kamatz katan and a kamatz gadol in the same way. There was no audible distinction. It sounded the same. The Sin and Samech was the same too etc.</p>
      <p>However, grammatically, just because they pronounced the chet the same as the chaf, it didn't mean that they only had one letter. It just sounded the same. Grammatically Ashkenazim had a kamatz katan and a kamatz gadol but since it was written the same and spoken the same it wasn't necessarily something that a kid in cheder (sunday school) would know about.</p>
      <p>Now, as we know the sefardim did distinguish audibly between the kamatz katan and kamatz gadol. In fact they also distinguish between the chet and the chaf, the ayin and the alef etc. Therefore the concept of a kamatz katan not only is known to sefardim but is also somehow indicated in their siddurim for pronuncation purposes.</p>
      <p>Okay, this much we all know. But here is the kicker: the determination of what is a kamatz katan is different in the Ashkenazic tradition to that of the Sefardic tradition. The example that I gave above of the word for "afternoon" צהריים in hebrew. According to the Sefardic tradition the first kamatz is a kamatz gadol and according to Ashkenazic tradition (and incidentally according to the modern Israeli rules of pronunciation) the first kamatz is a kamatz katan. This is regardless of your pronunciation system. This is a grammatical determination.</p>
      <p>Now this creates a question for somebody like myself publishing a siddur. Clearly when creating a sefardi siddur then the kamatz katan should be according to their traditions, ie tzahorayim (afternoon), but what about for an Ashkenazic siddur where the majority of users are going to be using modern Israeli pronunciation. </p>
      <p>The decision in Koren was to use Ashkenazic rulings of the determination of kamatz katan in our nusach ashkenaz and sefard (not to be confused with sefardi) siddurim and the Sefardic rulings for our Edot Mizrach siddur. We will be using the Morrocon rulings for our Morrocon siddur and Yemenite for our Yemite siddur. </p>
      <p>Now what do you about a Bible? Which system do you use? After all, the Bible is for everybody. Honestly I don't know! </p>
      <p>However, we will most likely do 3 editions, one for Ashkenazim, one for Sefardim and an edition that has neither (like we have today) which will serve clients such as the army that the users are both Ashkenazi and Sefardi. However, the jury is out on that one!</p>
      <p>One final comment. When digitising the font we had a problem with the shva na. The enlarged shva that we created wasn't distinct enough from the regular shva. We couldn't make it any larger because we felt it would look silly, so instead we created a further character, a shva nach which was smaller than our shva so that it was distinguishable from the shva na character. Therefore our font has 3 shvas. A regular shva to be used when distinction isn't made and when we are marking it, then a shva na and a shva nach!</p>
      <p>You are invited to see a sneak preview of the new siddur. <a href="http://www.korenpub.com" title="www.korenpub.com">www.korenpub.com</a>. Click on the bottom middle icon. The new English site is still in development so we still have our old (and quite awful website) for Koren :-)</p>
      <p>BTW the siddur pages were created with InDesign CS4 ME beta2, sorry about the heavy file, but the cool page turning is worth the wait :-)</p>
