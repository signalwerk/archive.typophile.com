      <p>William (Bill),</p>
      <p>&gt; <cite>I don’t understand why you are so insistent that nikkud be done through openType, when it already can be done by dictionary look ups. Dagesh, the word processor, already has auto-nikkud, which will automatically insert nikkud. </cite></p>
      <p>&gt; If you want to distinguish shva na and shva nach, then I think that could be done also to a great extent by dictionary look ups...</p>
      <p>&gt; I just don’t see your point in trying to do everything by open type, which is only syntactical. What you want can be done anyway by other means, and seems to be impossible only relying on syntax.</p>
      <p>First, my profession is to make professional typeface software. </p>
      <p>The newest standard industry font format is OpenType, as you know. In addition to basic typographical features, such as: outline font definitions, unification of Adobe PostScript and Microsoft/Adobe TrueType font formats, Unicode support (and double byte characters), OpenType also offers very sophisticated placement of diacritic marks, and intelligent replacement of complex strings of glyphs.</p>
      <p>I seek to include use of these features in the professional typeface software which I create, so they have a competitive advantage over other manufacturer's products.</p>
      <p>Second, most users do not know of or understand many rules of Hebrew grammar. Hence, an automatic replacement and positioning feature is useful both to use Hebrew grammar correctly without its complete knowledge, and to learn their intricasies easily (by simply turning OpenType off and on at will in Adobe InDesign ME CS/2,3,4 ad beyond).</p>
      <p>Third, Hebrew text is available for most everything imaginable, except newly written materials. By including these glyphs and including an automatic replacement and positioning feature, this existing text can be easily modified prior to viewing or printing by simply using the professional typeface software which I create.</p>
      <p>It may not be possible to accomplish everything mentioned, or even a small  part of it. But the advantages that result from success warrant a valiant effort, as our sages obm promise: "Yagata umatzata, ta'amin" "effort finds success". </p>
      <p>It's worth trying.</p>
