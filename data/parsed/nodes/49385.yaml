      <p>David,</p>
      <p>What a hostile post.</p>
      <p>The theme of this thread is Hebrew Type Designs, like its name. The first post begins with Mr. Raphael Frank a"h, desiugner of FranReuhl.</p>
      <p>FrankReuhl is the first main topic. To appreciate its position as the premiere Hebrew typeface design, I compare it to the Merubah typeface design. Merubah means square.<br>
      This design was popularized in many other forms, particular by the Romm family of Vilna, Lithuania. </p>
      <p>The Romm family printing establishments were reknown for very high quality workmanship. Even though they were very modern Jews, Chassidic masters sought for their books to be produced by the Widow and Brothers Romm.</p>
      <p>In order of popularity, I move on to David, Hadasa and the rest.</p>
      <p>I am glad that you add important details about Aharoni and Hadasa. I was unaware of this. In Israel, during the eighties, many popular Israeli newspapers used Aharoni for headlines, and Aharoni Tzar, its narrow look-a-like, for headlines of minor articles.</p>
      <p>I don't read Hebrew, except to pray or study, or read fascinating articles about Hebrew Type Design. Perhaps, another black typeface design is used, like Chaim Shamen, Fat Chaim.</p>
      <p>I would be interested to read, as I am sure many others, for you to post a summary of Friedlaender's article in German, and an overview of facts that you know.</p>
      <p>He sold the Hadasa design I think to the Amsterdam Typefoundry.</p>
      <p>In Israel, I read that he used the Hadasa design to be carved in an Israeli building. The book even included his picture, the building, and a picture of the short inscription. I never said that he made it for that purpose.</p>
      <p>How is Drogolin in any way similar to Hadasa? Look, I have samples above. When I first saw Drogolin, I thought it was an attempt to capture the flair of Romm/Vilna. FontWorld called Drogolin by th name of Belz, because the Belz logo featured Drogolin. </p>
      <p>Actually, the font called Margoliot is not really Drogolin. Drogolin had a peculian curl on the lower left side of the aleph, and this version cuts it out.</p>
      <p>David, you are a treasurechest of knowledge Hebrew type design. Please don't keep it to yourself. Share your knowledge with us, and post, post, post...</p>
