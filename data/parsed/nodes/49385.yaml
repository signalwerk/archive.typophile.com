      <p>David, I don't think you misunderstood Hrant's question. But perhaps for clarity we should talk in terms of left-slant and right-slant rather than forward- and back-slant, since the latter terms are relative and the former are absolute. For further clarity, left-slant is defined as having the top of a stroke being to the left of the bottom \, and right-slant as having the top to the right of the bottom /.</p>
      <p>So Hrant was asking about right-slanted letters in Hebrew, and wondering whether Hebrew readers mind this.</p>
      <p>As I understand it, there remains some debate about the 'correct' direction of slant for Hebrew 'italics'. I seem to recall that Zvi Narkiss decided that the letters should slant to the left. I see that Masterfont offer a number of families with options, i.e. secondary fonts with left- and right-slant, so that users can select which they prefer (but presumably one is treated is default 'italic' style and associated with the italic text function in apps).</p>
      <p>Personally, I never use Hebrew 'italics', but if I were to I think the decision about slant direction would depend on a number of factors. When asked to make italic versions of Adobe Hebrew -- primarily for technical reasons -- I decided that, given the target users of that family, facilitation of bilingual text was the most important factor. So Adobe Hebrew Italic has a right-slant to harmonise with the Latin italic. Apart from other considerations, this decision avoids the very problematic situation that arises from common punctuation characters, shared by both scripts, needing left-slant variants that may or may not be accessed by applications. [Adobe Arabic Italic has a left-slant, and there are environments in which the punctuation variants for Latin do not work, so you end up with right-slant Latin italic letters with left-slant punctuation. Ack!]</p>
      <p>While I agree with David that the impulse to right-slant Hebrew 'italics' in modern typographic practice probably originates from copying Latin -- for either stylistic or technical reasons --, my palaeography books show lots of examples of Hebrew writing with a right-slant, as well as examples with a left-slant. In both cases, the slant appears to be a result of writing speed, as with the development of the Latin italic, and the direction is more likely the result of the writing habits of the individual scribe than a conscious stylistic development. There are, of course, plenty of people whose Latin-script handwriting slants to the left, but this never translated into normal typographic use.</p>
