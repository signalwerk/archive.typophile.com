      <p>&gt; the ratio between counter and spacing is better in Frank Reuhl</p>
      <p>This is true. </p>
      <p>To peruse text swiftly, comprehension is certained enhanced. Perhaps, that is the main reason for its popularity and longevity.</p>
      <p>The wide Romm design nevertheless is preferred for lengthy concentrated study. Rabbi Akiva Eiger zatzal even strongly endorsed the Romm family efforts to produce the Talmud over the previous publishers of Slovita, causing a decade long batter over which publisher has exclusive rights.</p>
      <p>Rabbi Eiger cited that study would enhanced with this typeface, and for that reason it was justified to replace the publishers of Slavita.</p>
      <p>Today, new renditions of the Talmud are being produced, with the effort of Oz VeHadar leading the pact, followed by Zundel Berman Books. A third effort is being made by the Moznayim/Vagshall publishing house, for this very large market. </p>
      <p>A fourth competitor is GoHebrew, whose near-identical version of the Romm and Rashi typefaces seeks to invoke Rabbi Eiger's ruling and capture the entire market.</p>
      <p>The goal of GoHebrew is to remake the entire library of Jewish classics, with an English translation, too.</p>
