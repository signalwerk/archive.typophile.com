      <p>I've just read this entire thread with interest and admit some bemusement. Firstly, the article on Masorah in Encyclopedia Judaica was a bugger to typeset. It took me close to 50 hours!</p>
      <p>Regarding make a smart font for kamatz katan and shva na. Ignoring whether this should be done or not, frankly it's irrelevant for 2 reasons: </p>
      <p>1) Ashkenazic masora is different from the Sefardi masora (tradition) for these grammatical nuances so for example in the Hebrew word for "afternoon", the first kamatz is gadol according to Ashkenazim and katan according to Sefardim. So what you going to do? Create a font for each tradition? Also, I don't think you understand the enormity of the task. Let me give you an example: The word Yevarekhkha in the Priestly Blessing. Notice how I've written it as a shva nach (and not how many siddurim incorrectly put it as shva na)? This is because this prayer is a biblical indictment and therefore has to be pronounced according the rules at the time and the rule to make it a shva na came a long time later. Same too with the word Ata. Notice how in siddurim a meteg (in this case the meteg indicating mileil and not a secondary stress taam meteg or a sof pasuk which some of you are calling a siluq which is a primary stress regardless of milra or mileil), is put in this word sometimes to stress it as Ata rather than aTA because that part of the prayer was from the time of the Rishonim which again had different grammatical rules. What I'm trying to say that in a siddur the rules of pronunciation change according to the period. In our proofreading of the new Koren Siddur for the USA (with translation and commentary in English), a team of 3 grammarians and rabbis have spent months and months checking the correct pronunciation with the meteg, the shva na and kamatz katan. Encoding it into Opentype would be a monumental task even if you could agree to one halakhic authority.</p>
      <p>2) I seriously doubt the Volt could actually compile the font. </p>
      <p>We are currently working on the Koren Tanakh font which has kerning and correct positioning of the teamim and we have got the point where VOLT cannot compile the font and we haven't finished all the taamey mikra collisions yet. We'll optimise the font more and hopefully will manage, but if we had to put in the rules for taamey mikra then VOLT would have a fit.</p>
