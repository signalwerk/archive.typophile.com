      <p>Israel, </p>
      <p>1.  Minhat Shay: Rabbi Yedidiah Solomon Raphael Norzi.  The nature of his work is not like Radak  —  so why to compare and say "these were much greater scholars"? Norzi was a great scholar and too ahead of his time!!!</p>
      <p>2. Sheva: Every Sheva Under The First Letter Is NA!!!!  </p>
      <p>3.  An important work about the sheva is the Treatise on the Sheva — discovered in the Cairo Geniza (Kurt Levy,<br>
      Zur Masoretischen Grammatik, 1936) ; for example, the Treatise says the letter dalet (shev na) should be pronounced with hataf-hirik, hirik-hatuf. That said, sheva na + hirik -- 1 Chronicles 24:20<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/Ayeh_4625.gif"></div><p></p>
      <p> There are maybe 5 words with hirik-hataf, hirik-hatuf; see the Aleppo Codex --  Psalm 14:1<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Aheyb_5074.gif"></div> <p></p>
      <p>another important work is Hidayat Al-Qari; and of course ben Asher.</p>
      <p>4. Kamats before shva na is Gadol.  </p>
      <p>5. If you really want to learn about  Ashkenazi pronunciation  see the work by Rabbi Shabtai Sofer</p>
      <p>6.  My opinion -- pick one grammar book. Just 1! But read it from A to Z; later on pick a new book. otherwise you're not going to find your head, legs, arms etc. etc. :)</p>
