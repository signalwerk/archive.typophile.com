      <p><em>A left-handed person has an easier time holding the pen to write Hebrew...</em></p>
      <p>Have you tried to write formal Hebrew letters -- i.e. letters written with a broad-nib pen, not a ballpoint or pencil -- with your left hand, or watched a left-handed person trying to write such forms. Instinctively, because the script is written from right-to-left, one imagines that it might be easier for left-handed writers. But the only benefit for left-handers is that their hand does not obscure what has already been written: there are no benefits to the formation of individual letters; indeed, the traditional steep ductus (pen angle) requires either a very awkward angle to the arm and wrist or rotation of the page. Further, what are normally pull-strokes for right-handers become difficult push-strokes for left-handers. Try it.</p>
