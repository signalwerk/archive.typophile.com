      <p>Israel, you have misunderstood me. The typeface specimen you uploaded is indeed very similar to the writing in the back of my copy of Happellio's <em>Lingua Sanctae,</em> about which you said: 'The typeface design is Stam.'</p>
      <p>But the image I uploaded is not a typeface at all: it is handwritten, which was my point in saying that it would make more sense to say that the Stam Regular type you showed is in the style of the earlier writing, rather than the other way around.</p>
      <p>The second point is that the Stam Regular font, despite the name, is not actual STaM lettering: i.e. '<em>not</em> an implementation of the Vaad Mishmereth STaM rules'. It is a style of letter that has associations with religious texts, and hence can be used to evoke these associations, but the shapes of the letters differ from those of real STaM. Hence I find the name of the typeface confusing.</p>
