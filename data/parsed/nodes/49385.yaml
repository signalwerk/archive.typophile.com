      <p>It is the application (Word, pdfTeX, XeTeX, inDesign) that does the processing; the font can in some way be seen as a program that is interpreted by the application  but, in order to do so, the application often relies on system calls or libraries. It is my understanding that Adobe applications depend much less on system calls (or non Adobe libraries) than most other applications.</p>
