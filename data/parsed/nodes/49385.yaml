      <p>More on meteg and siluq:</p>
      <p>With the assistant of colleagues at Libronix, makers of Bible study software and members of the SBL Font Foundation, I can provide this list of instances of single words in the Hebrew Bible text containing both meteg and siluq. In all cases, these are the final words in the cited verses (a necessary condition for siluq; see above); the first ֽ mark in each word is a meteg and the second is siluq.</p>
      <p>The list is divided into two parts: cases in which both meteg and siluq occur on a single word, and cases in which they occur on two words conjoined by maqqef (the hyphen-like mark) with the meteg on the first word and the siluq on the second. When two words are conjoined by maqqef, the rules of accentuation are applied as if they were one word.</p>
      <p><strong>I. Single words.</strong></p>
      <p>Genesis 2:5     אֶת־הָֽאֲדָמָֽה<br>
      Genesis 2:6     אֶֽת־כָּל־פְּנֵֽי־הָֽאֲדָמָֽה<br>
      Genesis 2:22     אֶל־הָֽאָדָֽם<br>
      Genesis 3:24     הַֽחַיִּֽים<br>
