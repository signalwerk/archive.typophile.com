      <p>William,</p>
      <p>Henri Friedlander was a very old man when I worked with him. He was retired. I spoke to him only on the phone. Out of respect, I never called him by his first name, nor did ever even refer to himself, by his first name or last.</p>
      <p>I remember 3 things in particular:<br>
      a) He cried when I mentioned that much of Orthodox world was studying Tanach, the Bible, in his Hadasa typeface;<br>
      this caused him great satisfaction to know this. (We spoke in Hebrew, so he was apparently unaware of ArtScroll.)<br>
      b) He approved my interpretation of Hadasa as authentic;<br>
      c) He criticized one detail in a few letters, urged me to correct them, and added this was the secret of good Hebrew fonts.</p>
      <p>The story how we spoke on the telephone was really amazing. I had just married and created a PostScript version of his Hadasa design for a very early system of Apple Macintosh operating system, when the IBM PC just began. It was System 5.</p>
      <p>Anticipating to license it to Apple Israel, I sent Mr. Friedlaender a check for 100 old shekels. He return the check to me, explaning that he sold the rights to a now-defunct small European type foundry many many years ago. Hence, he was not entitled to any money. I was very impressed with his honesty.</p>
      <p>Not long after, Mr. Friedlaender called me in Kfar Chabad. He said that "I noticed from the address that you live Kfar Chabad. Kfar Chabad is village which is inhabited with the followers of the Lubavitcher Rebbe." I replied, praised his work, extolled his important role in Jewish history, and added that the ArtScroll Orthodox publishing house in the United States had standardized their books on Hadasa. Then, I told him that even the Tanach, the Bible, appeared in Hadasa, and studied every day by many many Jews around the world."</p>
      <p>Mr. Friedlaender was silent, and I heard him weeping like a baby.</p>
