      <p><strong>Speaking of italics,</strong> :)<br>
      Hebrew doesn't have them. But people want and would use them.</p>
      <p>It is not true that "italics that are leaning right is acceptable". Left leaning italics are actually <strong>preferable</strong>. </p>
      <p>John, you can't derive any logical preferences for Hebrew from Tzvika Rosenberg of MasterFont's actions. He does what ever is easier. If the default for slant is -12, he'll make -12 right leaning italics.</p>
      <p>Tzika's views on Hebrew typography reject tradition (an important factor in typography but not in rocket science), and only come from his "pupick", as they say. For example, he told me that a chirik, or shva, under a vov, daled, or reish, should be off centered, so the reader does not confuse them with a final nuhn. This is logical, but it opposes centuries old tradition.</p>
      <p>Since few italics has been made to lean right, so then left leaning italics are only <strong>tolerated</strong>.</p>
      <p>Why should italics incline to any specific direction?<br>
      Italics are meant to follow the direction and movement of the eye.</p>
      <p>______________________________________________________<br>
      ______________________________________________________</p>
      <p>Here are three examples of a true italic for David-Regular, and two versions of Diamond-Script.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dav_Dia3_3737.jpg"></div><p></p>
