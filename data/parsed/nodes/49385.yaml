      <p>Israel, I think your analysis of aleph forms is halfway correct. Yes, the construction of the flag is one of the style indicators, but it must be checked against other features of the individual typeface or writing hand: there are other features, such as the baseline shape of shin and related forms, that are probably more significant. I must also point out that I have not looked at as many Ashkenazic exemplars as Sephardic, so can't say for sure what variety of flag forms might be found in that style.</p>
      <p>In Sephardic styles, there are two basic constructions for the flag: a single stroke down to the right and then curving to the left, and a returning stroke down to the right and then doubling back and down to the left. What is important is the construction pattern, rather than the resulting shape, which can be misleading in some cases. This is why I think you are misclassifying Adobe Hebrew as Ashkenazic. If you look at the construction of the aleph flag in Adobe Hebrew, the returning construction is evident. So although the flag shape is much more horizontal than in the traditional Sephardic styles, the stroke construction is derived from the Sephardic model. And, of course, if you look at the bottom of the shin, samekh, etc., these are very clearly Sephardic forms.</p>
