      <p>&gt;Is there a resource for this account</p>
      <p>As I said, it's all in a very long Encyclopedia Judaica article, with extensive bibliography.</p>
      <p>The author is identified as Aron Dotan, who was at the time of publication (1972) a professor of Hebrew Philology at Tel Aviv University. </p>
      <p>I'm afraid that if you want to study Hebrew grammar, you are not going to find sources that are kosher by your standards. The study of Hebrew grammar was developed largely by maskilim--Enlightenment Jews who rejected the Kabbala as nonsense.  </p>
      <p>On the chronology of the split, I'd have to check. Hebrew Union College was set up as a seminary for all rabbis, with the goal of keeping the Jewish community unified--hence the name. Of course, that didn't happen. I think the formal separation into three branches--orthodox, conservative, reform--happened only after the trefa banquet. You have to remember that at the time there were relatively few Jews of any kind in the US.</p>
      <p>About Cincinnati, IIRC, at the time it had the same Jewish population as New York City, and was a center of Reform Jews transplanted from Germany. The big influx of European Jews to the US only happened after 1880.</p>
