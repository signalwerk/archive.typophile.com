      <p>Raphael,</p>
      <p>&gt;<cite>The idea of adding a thin slice in between letters was considered and rejected. It is much easier to program and there are lot less kerning pairs. Perhaps for a general purpose font this is a good compromise.</cite></p>
      <p>What is practical difference? If the goal is to maintain the position of the nikkud under the letter, and taam (and maybe meteg too) on the left side of the nikkud, then inserting a slice of space dividing one letter and next, then the collision is prevented.</p>
      <p>But if kerning is the solution, then the nikkud and taam are tweaked, and the original intent is lost.</p>
      <p>Plus, the kerning remains in that specific file, while the font approach travels to users of the font.</p>
