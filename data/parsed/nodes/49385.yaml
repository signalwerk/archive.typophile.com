      <p>I am not saying that Koren is the most beautiful font or the best font. I'm saying that it's the Koren font that I'm revitalising and digitising and it needs to meet the exacting standards that Eliyahu Koren had in his original metal font that's all. This  is in no way a reflection of other typefaces. I'm comparing the Koren Tanakh font of the 21st century to that of the 20th. That's all. I don't dismiss the ideas of solving collisions with thin spaces or fractional nikud lightly. They were considered and played with at length. It just didn't work for us. That doesn't mean to say that it wouldn't work in other typefaces, indeed I would have preferred it if had worked in Koren since the route we are taking is extremely time-consuming and expensive :-)</p>
