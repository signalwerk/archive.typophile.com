      <p>In recent times, we have Professor Aron Dotan of the Tel Aviv University.</p>
      <p>It appears that he is a very great scholar in Hebrew grammar. It does not appear that he chooses to reject authorities before him, and suggest new opinions that even Moses never heard.</p>
      <p>William,</p>
      <p>Let me clarify something that you seem to miss even after your continued study.</p>
      <p>In Chabad, a person's personal observance is relative to his or her knowledge and environment, but less essential than the very core of the person. </p>
      <p>That's why the Chabad leader could declare the success of the Entebbe Raid was a miracle, of Biblical proportions. The first Satmar leader zatzal rejected the notion that G-d could do a miracle for a non-observant Jew.</p>
      <p>So, if a scholar is less observant, his scholarship is not rejected, because his or her very core is still intact.</p>
      <p>Maimpnides rules that if a Jew not only rejects his or her heritage intentionally, but also causes other Jews to go astray, his or her teshuva is in deed rejected, and his or her scholarship is burned. One can not even warm himself by the fire.</p>
      <p>Maimonides also rules that if a Jewish child is captured and raised as a non-Jew, his or her status is unique. One may not rebuke such a person, but rather encourage him or her to return to the practice of Judaism.</p>
      <p>The seventh Lubavitcher Rebbe contraversively ruled that our entire generations falls now in this last category. For even the most astute Torah scholar was raised with a neo-Christian Western mentality, and no longers lives in accord with Jewish practices and thought from generations ago.</p>
