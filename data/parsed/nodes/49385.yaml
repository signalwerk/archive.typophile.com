      <p>Aftere the holidays of the Hebrew month of Tishrei, namely the joyful festival of Simchat Torah, I used to think it was appropriate to greet another as is customary after the Shabbat, with שבוע טוב Shavuah Tov, a Good Week!</p>
      <p>But I was told many years ago that this was מםא appropriate, as the holiday often concluded in the middle of the week. </p>
      <p>Instead, it was customary for the Gabbai (the rabbi's assistant) to bank with his hand on the bimah where the Sefer Torah scroll is read, and shout out loud, יעקב הלך לדרכו "Jacob has gone on his way"!</p>
      <p>This cyptic quotation from Scripture (Gen. 32:2) indicates a wish that one should take the spiritual recharge that came from all the holidays of Tishrei, and incorporate their vitality into the everyday life of the year.</p>
      <p>יעקב הלך לדרכו</p>
