    html: |-
      <p>David,</p>
      <p>What is a "revival"? What is a "faithful rendition"? David re Raanana; Hadasa re Henri; Koren re Crown; Narkis Tam ne Neshika (inspired Ariel Hebrew)?</p>
      <p>Let's take Hadasa, for example.</p>
      <p>Many foundries have created near-faithful versions or adaptations of Hadasa, either called Hadasa, Hadas, or New Hadasa. Each one was a little different than Friedlaender's original design. FontBit's New Hadasa is a lot different.</p>
      <p>FontWorld's Queen Esther and GoHebrew's Henri stayed faithful to the original design. To preserve the designer's original intent, this then is a "faithful original". Henri Friedlaender himself saw FontWorld's predecessor, Otzar Haoht's Esther, and commented: "This is the closest to the original to date." This was after Linotype, IBM and others attempted to offer their versions.</p>
      <p>A modification, even where the design is changed to comply with accepted design principals, is similar, a close interpretation, or even a poor knock-off, is not faithful.</p>
      <p>A revival, for better or worst, is a new popularization of a dormant design.</p>
      <p>Take "Romm" for example. In the 1800's it was the most popular and most used Hebrew type design, until "FrankReuhl" tooks its crown. In the mid and late 1900's, "Room" disappeared. If one could say kaddish and keep yahrzeit for a type design, we'd be making it a yahrzeit every year.</p>
      <p>GoHebrew's faithful rendition of this design of the Romm family of Vilna, Lithuania is in deed also revival.</p>
      <p>To stick 100% to the original design, and to suppress any creative innovative urges, no matter how good, requires tremendous self-discipline and dedication.</p>
      <p>Are we speaking the same language now?</p>
