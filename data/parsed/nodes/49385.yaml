      <p>From what I have understood, the "traditional" system was only done by in that way due to limitations in technology and/or lack of understanding of what had to be done by the printers of the day.</p>
      <p>If you look at early manuscripts, you will see that the scribes did the nikud and teamim in the way that Koren did (actually the other way round, Koren copied the manuscripts). </p>
      <p>Therefore, from my understanding the Koren system is the traditional system which makes sense since the nikud is secondary to the letters and the taamim tertiary.</p>
