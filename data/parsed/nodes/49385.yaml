      <p>Raphael,</p>
      <p>&gt;<cite>There is another solution that we also rejected that Harbs came up with and that was to create 90% width versions of the wider letters of nikud that would be substituted when necessary to solve collisions.</cite></p>
      <p>This is like what I suggested to do in my OpenType fonts above.</p>
      <p>When a sequence occurred with crashing diacritics, such as a narrow letter followed by a daled or reish, or two narrow letters in a row, then there is not enough room for the two sets of diacritics with having them bump.</p>
      <p>If the OpenType font would be programmed to automatically replace the regular width diacritics with a narrower set, then they would not bump.</p>
      <p>&gt;<cite>This is why the Koren Bible is considered to be the most accurate Bible by many today. In fact, the Chief Rabbinate of Israel gave a psak din that if a klaf was unavailable for reading the Haftara, then a Koren Bible maybe used, bedieved. You don’t get that level of psak for any other Bible.</cite></p>
      <p>Although this in deed an honor, but according to Jewish law, any Bible text could be read for the Haftorah, even if it was printed on newsprint (used to print pornographic literature), using a font by a person who desecrated the Sabbath, and typeset by a person who believed in Yoshkie.</p>
      <p>It in deed in a compliment, but it is very limited.</p>
      <p>&gt;<cite>We have to be perfect because we have a nearly 50-year legacy to live up to.</cite></p>
      <p>Great Hebrew typography existed in Vilna, Lithuania more than a hundred years before Eliyahu Koren could read. Even greater Hebrew typography existed earlier in Europe, as the book on the history of the printing of the Talmud shows.</p>
      <p>With the advent of OpenType, Hebrew typography greater that what KJoren produced s possible.</p>
      <p>Your example of the Koren prayerbook is in deed beautiful, as you are asuperb typesetter.</p>
      <p>Scott-Martin Kesofsky of the Philidor Company is creating an even more beautiful Machzor (with many grammar features too) for the Rabbinic Assembly.</p>
      <p>I am working on another beautiful prayerbook for Nusach Ari (Chabad), featuring the pagination of the old Kehot siddur, and the beautiful prayerbook for Nusach Ashkenaz and Nusach Sefard, featuring the pagination of the widely popular ArtScroll siddur and the longest used Tikun Meir prayerbook, featuring the Vilna/Romm typefaces.</p>
      <p>Yagdil Torah Veyahdir - יגדיל תורה ויהדיר - "Make the Torah greater and more beautifil".</p>
