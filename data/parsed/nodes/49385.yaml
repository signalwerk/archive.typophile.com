      <p>Here are notices from established Jewish publishers that graphically indicate to its readers of the shva-na.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/shay_shvana_5117.jpg"></div><p></p>
      <p>"Shay Lemora", a small publishing house with a significant and popular line of books that graphically indicate the correct use of the shva-na. Headed by a highly respected scholar and commentator, Rabbi Shmuel Yehuda Winefeld Shlita, he has completed marking the entire Pentateuch (Torah, Five Books of Moses, Chumash) with shva-na symbols. Interestingly, not one of them interfere with the upper taamim markings.</p>
      <p>Shay Lemora determines placement of the shva-na symbols based upon the rules of the early Rabbinic authorities and the Minchat Shai.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/keh_shvana_5267.jpg"></div><p></p>
      <p>"Kehot" (Karnei Hod Torah - the Rays of the Glory of the Torah), the largest Jewish publisher and the official publishing house of the Chabad-Lubavitch organisation. </p>
      <p>Kehot determines placement of the shva-na symbols differently than Shay Lemora, according to the system of Rav Zalman Henna (Hanau).</p>
      <p>A third system is used by ArtScroll, another large Jewish publisher, based upon the writings of Ibn Ezra and the Vilna Gaon. According to Prof. Aron Dotan of Tel Aviv University, the Vilna Gaon's system was derived from Rabbi Eliyahu Bachur, an early Rabbinic authority.</p>
      <p>Prof. William Chomsky defines the Ramchal's (Rabbi David Kimchi) definition of shva-na similar to Rabbi Eliyahu Bachur's system. </p>
      <p>Apparently, Rav Henna's system was the last. However, if we view the Vilna Gaon's system as being final, it is last. But, if we consider the system used by Kehot, as it is current, it in deed is last.</p>
      <p>According to Judaism, the final valid viewpoint determines which way is to be followed, as scholars considered all the previous viewpoints and made a lasting determination to be followed.</p>
