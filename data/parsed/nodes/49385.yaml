      <p>Michel,</p>
      <p>&gt; Adam Twardoch</p>
      <p>How do I contact him?</p>
      <p>As I understand it, OTF fonts are more than fonts of other formats, such as TrueType or PostScript, with just a header added to it to make it multi-platform.</p>
      <p>Rather, OTF fonts contain programming instructions that affect formatting and appearance. To achieve this, OTF fonts need to be rendered on a marking engine, such as Microsoft's UniScribe, Adobe InDesign's internal marking engine, and Apple's limited one.</p>
      <p>A code-based application, such as Tex-LaTeX, uses no marking engine, and simply sends its formatting codes, however complex, to output, to a screen proofing mode, to a desktop printer, or to higher resolution device.</p>
      <p>So, the special contribution of OTF is lost at this time. I'm sure the world won't stand still, and Tex's brilliant people will add a means to tap into the power of OTF fonts.</p>
    html_clean: |-
