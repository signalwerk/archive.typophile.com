      <p>&gt;<cite>Finally regarding reading the haftara from a klaf.</cite></p>
      <p>In America, we use a printed book.</p>
      <p>I heard that some (in Israel) have a klaf-like roll, and I've seen some synogogues that have them, as it was once in use here as well.</p>
      <p>Originally, the haftorah was read, because Torah reading was banned. Haftorah is from the various books of Prophets, known as Nevi'im. That's why certain Haftorah verses mimick themes in the weekly Torah portion.</p>
      <p>There is a third approach to avoid colliding which is extremely attractive, and automatic.</p>
      <p>Scott-Martin Kesofsky created very slightly wider versions of the narrow letters, and slightly narrower nikkud, thinner and thus even narrower taam, and a very thin meteg in his Milon typeface. The differences are very subtle, that only a good typographer with a keen eye could notice.</p>
      <p>I have not seen a better living Hebrew typesetter than him (you're very good, but he's superb). I told Scott that it's because that he caters to the high end, like you (but his high end is much higher!), while I have customers that think use of white space is a waste of paper, and good typography is "cram it in".</p>
