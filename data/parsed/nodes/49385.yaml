      <p>Michel,</p>
      <p>Of course, I hope that you are incorrect. I recognize that you have more experience here, but I am very determined. This determination is not deluding, but motivates me to try creative solutions that you may not consider.</p>
      <p>OpenType, according to my limited understanding can access a database, and features a replacement mechanism. In my view, a string with wide-card variables can be replaced with another string from a database, and the kind of variables can refer to another database that modifies the replaced string, if the specific grammar rules can be defined.</p>
      <p>I am not considering the an OpenType font perform grammatical analysis, but simply replace a string for a different string.</p>
      <p>Perhaps, this is not doable; perhaps, it is.</p>
      <p>According to my poor understanding of Hebrew, its languaguage and grammar, it's rules are logic-based, with exception tables. Hence, once the rules are defined, and the tables constructed, grammatical analysis is not required.</p>
      <p>I might be incorrect, but I hope and think not.</p>
