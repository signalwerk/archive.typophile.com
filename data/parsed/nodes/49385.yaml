      <p>Btw, I created two sets of nikkud/taam/meteg alignment. One traditional, and one "modern", like Eliyahu Koren's system.</p>
      <p>Scott is using Koren's system.</p>
      <p>Traditional means that the nikkud/taam/meteg combination is viewed as a single unit, and centered under the letter, unless that letter is a daled, kuf, or reish.</p>
      <p>Modern means only the nikkud is centered. The nikkud is dominant in weight and width, the taam is secondary, and the meteg is thinner than the taam and positioned on a lower level than it.</p>
      <p>The modern approach poses difficulties under narrow letters, especially followed by a reish (or someyimes daled).</p>
      <p>There is a great advantage in teach children to read by following the modern approach, which Koren either innovated or popularized.</p>
      <p>The traditional approach though is most popular in America and by many, if not most, frum Jews. That's what they are used to seeing. I am a pragmatic idealist, so as they say here, "the customer is always right".</p>
      <p>But on the GoHebrew web site (under construction), a section is devoted to displaying the Bible, with dark blue nikkud, dark red taamim, and dark green meteg, following Koren's alignment system.</p>
      <p>Adil Allawi of Ready Set Go International in London showed me a CD his company made for the Saudi govt.'s Dept. of Education an electronic Koran, that color-coded the diacritics, hyper-linked each verse to a translation, and different words or phrases in verses to explanations. By clicking on them, windows popped up featuring translations or explanations. He advised to do the same for the Bible and the Talmud.</p>
      <p>I am working on making a fascinating electronic Talmud, which will include the entire body of Jewish knowledge, including the Tanach, the Jewish Bible at <a href="http://www.gotalmud.org" title="www.gotalmud.org">www.gotalmud.org</a>.</p>
      <p>Why don't you partipate there, and describe what you are doing with the 21st century Koren Bible, and why it is significant.</p>
