      <p></p><div class="imageWrap"><img src="http://typophile.com/files/meruba_5199.jpg"></div><p></p>
      <p>The first type specimen is called "Meruba", which means in Hebrew, square. This is not the common name associated for this design. </p>
      <p>Why then did Frank refer to this design as "Meruba"?</p>
      <p>"Meruba" is both a very old and yet also a relatively recent design. Many hand-drawn books from hundreds of years ago appear with this typeface design, usually to present Biblical material.</p>
      <p>Relatively recently, the huge Romm family printing establishments in Vilna, Lithuania standardized their print jobs upon a version of this typeface design. Their popular printing of the Talmud for over a hundred years used it. Hundreds of other Torah books, including those of great Chassidic masters, used it. And even hundreds of non-Torah books of literature, poetry, Hebrew grammar, children's primers, and secular thought, used it as well.</p>
      <p>There are two reasons why this design style is referred to as "Merubah", or square.</p>
      <p>First, the dimensions of the design is very wide and square-like. This is conducive to accurate reading, good comprehension, and overall clarity.  </p>
      <p>Also, the design in some ways is comparable to the type design of the style used in the Sefer Torah scroll. In fact, many laws are derived from aspects of the "Merubah" design that would invalidate the Sefer Torah scroll style of lettering.</p>
      <p>The second reason is actually associated with all non-script Hebrew type designs, and not necessarily to the "Merubah" design. Here, the choice of the word "Merubah" simply means "block letter".</p>
      <p>It is unlikely that Frank refered to this design because of the second reason. Clearly, the first reason accurately describes the most important aspect of the "Merubah" design, and seems to be the basis of Frank's intention.</p>
