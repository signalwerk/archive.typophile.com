      <p>In protest, they fonded JTS as a showcase central yeshiva with a tremendous library of every rare title you can imagine. The Reform in response founded Hebrew Union College in Cincinnati with its even greater library.</p>
      <p>The Schneersohn/Lubavitch collection is as sizey. None of them are lending libraries. They do allow copies to be made.</p>
