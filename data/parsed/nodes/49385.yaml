      <p>David,</p>
      <p>In nikkud text, meteg is a stress mark; it is also a part of the taamim. Always, it is a narrow vertical line that is placed below the Hebrew letter. Under a vov, zayin, yud, nuhn, there is barely enough space to position a nikud, lower taam, and meteg. </p>
      <p>And you would consider adding another meteg between the nikud and taam???</p>
      <p>Im nikkud text, a shvana is used; it is also a part of the taamim, though it is not placed there except in Shay Lamorah books (and in the future Tanach books I typeset). Under a vov, zayin, yud, nuhn, there is barely enough space to position a nikud, lower taam, and meteg. </p>
      <p>And you would consider adding another meteg between the nikud and taam???</p>
      <p>The Shay Lamorah publisher, Rabbi Shmuel Winefeld of Jerusalem knew want he was doing when he placed the graphic symbol above and out of the way. Rabbi Menachen M. Schneersohn of Kehot Publication Society (the seventh Lubavitcher Rebbe) knew want he was doing when he placed the graphic symbol above and out of the way.</p>
