      <p>I didn't know that. Thank you for sharing.</p>
      <p>In the US, an established publisher of Hebrew books was the now defunct Hebrew Publishing Company. In fact, after WWII, HPC was the world's largest Jewish publisher.</p>
      <p>They gained fame and fortune by reprinting all the classic Jewish books, even retypsetting some of them.</p>
      <p>Among their vast array of books, they reprinted a very clear book of Psalms originally printed in Vilna, Lithuania.</p>
      <p>The Chabad-Lubavitch organisation in the late forties purchased the exclusive print rights from them, even though it was likely public domain, because the sixth Lubavitcher Rebbe chose it.</p>
