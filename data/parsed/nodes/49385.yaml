      <p>Re. meteg, in vocalisation and in cantillation:</p>
      <p>The small vertical mark serves two functions with two names: meteg and siluq. Meteg is a vocalisation mark used to indicate secondary stress. Siluq is a cantillation mark signifying the end of a Biblical verse. Since the marks are visually identical but semantically distinguishable by context, Unicode unifies their encoding as a single mark.</p>
      <p>It is the nature of chant -- not only Jewish chant but also Byzantine chant and the varieties of Latin chant -- that melody arises out of text. This means that it isn't really possible to talk about cantillation independent of vocalisation; so, for instance, the marking of secondary stress using meteg has a musical function that derives from the musical function of syllable stress as a punctuating and rhythmic principle. Or, as Joshua R. Jacobson puts it: 'Where there are too many consecutive unaccented syllables, the rhythm of the chant may sound rushed. Accordingly, to slow down the pace of the reading, a secondary stress is often indicated on words with more than two syllables.... A syllable with a meteg should be chanted <em>slightly</em> louder and longer than a syllable that has no accent at all.'</p>
      <p>Jacobson's book, <em>Chanting the Hebrew Bible,</em> is excellent, and I learned more from it about vocalisation and cantillation than from any grammar I have consulted (and I have grammars dating back to 1539!)</p>
