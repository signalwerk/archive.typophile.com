      <p><em>I know the Christian Bible and the traditional Jewish tanach has some minor differences, mainly in the nikkud and taamim.</em></p>
      <p>'Christian Bible' doesn't refer to anything in this context, since there is no single Hebrew text recognised as finally authoritative. Rather there are a few different lines of approach to the Jewish scriptures in Christianity:</p>
      <p>The Greek Orthodox (and presumably Eastern Catholic) Churches still use the Septuagint (LXX) text, i.e. the Greek translation prepared by Jewish scholars in Alexandria, between the 3rd and 1st Centuries BC, and which was used by Jewish communities during the Hellenistic period. After the destruction of the Temple, rabbinical tradition restored the Hebrew version and established the Palestine canon, excising those books of the Septuagint for which Hebrew texts were not available.</p>
      <p>The Septuagint is also the basis of the Slavonic, Armenian, Syro-Hexeplar, and Coptic versions.</p>
      <p>Following use of Latin tanslations from the Septuagint, the Roman Catholic Church in the late 4th Century adopted Saint Jerome's Latin version translated directly from Hebrew texts. A few years ago, Pope John Paul II announced that new Catholic translations would take into account the latest scholarship of the earliest surviving Hebrew texts found at Qumran.</p>
      <p>Today, almost all scholars studying the Hebrew scriptures -- whether Jewish or Christian -- work with the Masoretic text as preserved in the surviving Ben Asher manuscripts, the most complete of which is the Codex Leningradensis and the oldest of which is the Aleppo Codex. These Masoretic manuscripts are the oldest standard texts containing nikudot and ta'amim. Pre-masoretic texts are largely unvocalised and without cantillation. The Masoretes standardised the vocalisation and cantillation. The consonant text of different versions shows very little variations -- testimony to how carefully it was transmitted --: even the very oldest surviving texts, found at Qumran, are almost identical to that preserved in the Masoretic texts from a thousand years later.</p>
