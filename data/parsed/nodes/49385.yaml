      <p>Nevertheless, Frank revolutionized the Hebrew printing industry with his new bold FrankReuhl design.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/franksamp_4236.jpg"></div><p></p>
      <p>Here are two examples of the popular standard Hebrew design, created by Frank.</p>
      <p>The top one, in regular and bold weights, is the most like the original design, with certain differences. A radical change was introduced by Varityper, a now extinct photo-typestting firm, later purchased by Agfa(-Compugraphic). </p>
      <p>The type design was later revived for desktop publishing as an early Hebrew PostScript font by FontWorld, the leader in software products for professional typesetting of non-Latin laguages, such as Arabic and Hebrew. </p>
      <p>Recently, an early pioneer in desktop publishing software for foriegn languages, Linquists' Software, created an OpenType version for use in Biblical Publishing of a scholarly nature, in Micrsoft Word for Windows. It was incompatible with Adobe InDesign CS/3 ME.</p>
      <p>Another example popular in Hebrew desktop publishing is Apple's New Pnimim, another knock-off of FrankReuhl. New Pnimim is based upon (Merganthaler-)Linotype's version of FrankReuhl. It contained many design differencs, depending upon the needs of metal type, which were varied besad upon the point size used.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/npsamp_5536.jpg"></div><p></p>
