      <p>If we look carefully at these two designs, we can ask, what is different about them to cause such an upheaval in the Jewish printing industry?</p>
      <p>First, the proportions are very different. The "Romm" design is much wider than Frank's. This means, practically speaking, many more words per line typeset using FrankReuhl will fit in a given space. This is very economical to printers.</p>
      <p>On the other hand, Romm is very wide, almost squarish. The letters are thicker. The results are much more conducive to repeated study.</p>
      <p>A sofer, Hebrew scribe, once explained the advantage of the Romm typeface. "It has round soft edges," he said. "I know what it means to look at letters for a long time. The design of this typeface is easy on the eyes. You can look at it forever, and yours never feel strain."</p>
      <p>Romm was designed for Bible and Talmud study, and the like. The prayerbook is typset in Romm. The Passover Hagada is typeset in Romm.</p>
      <p>When Frank lived, the Jewish world was abandoning traditional Jewish study, and going away from use of books typeset in Romm. Frank's design fit a gap, a need in Jewish society, that was different, and reformed of tradition. We see today that most secular literatures, newspapers, even pornographic writing use FrankReuhl.</p>
      <p>This has been the norm for over fifty years.</p>
      <p>The question is, with a revival called desktop publish, and a new font format excellantly geared for Biblical Hebrew, called OpenType, will the Romm design regain its status of dominance, particularly if multiple weights and widths of it appear to meet the needs of Jewish publishers today.</p>
