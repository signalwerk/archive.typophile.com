      <p>Michel,</p>
      <p>Shavuah tov.</p>
      <p>&gt; <cite>...according to the Rulings of Rabbi A this is na; and Rabbi B this is nach. ...Rabbi Shelomo Hanau...</cite></p>
      <p>I wonder if he was the Minchas Shai (a great expert opinion on Hebrew grammar and definition of a shva-na), for his name may be an acronym for Shai.</p>
      <p>Regarding the Radak (Rabbi David Kimchi), Ibn Ezra and Gaon of Vilna, these were much greater scholars that the the Minchas Shai.</p>
      <p>However, Shay Lemorah cites that his editorial decisions regarding the shva-na are based upon the views of the early Rishonim (Ibn Ezra was in deed a Rishon, as was the Radak) and the Minchas Shai). </p>
      <p>The Vilna Gaon, Rabbi Eliyahu, was fairly recent, about nine generations ago. He is a widely accepted scholar, highly respected for his broad knowledge, but he promoted opinions based upon his own analysis of the Talmud, in opposition to the views of great Rishonim before him, an attitude greatly frowned upon by the Rebbes of Lubavitch. </p>
      <p>For example, a left-handed Jewish male must put the arm-tefillin upon his right arm, whereas most Jewish men, who are right-handed, must put them on their left arm.</p>
      <p>What consitutes left-handedness? Is your stronger arm the arm you throw with (brute power), or write with (intellectual dominance)?</p>
      <p>Until the Vilna Gaon, the major redactors of Jewish law concluded that the hand you write with belongs to the stronger hand. The Vilna Gaon disagrees, based upon his understanding of the Talmud, contradicting sages greater than him.</p>
      <p>Rabbi Shneur Zalman, the first Lubavitcher Rebbe, and his replacements, strongly opposed the Vilna Gaon's ruling. I was fortunate to show how the Vilna Gaon erred by citing an Talmudic explanation from Rabbi Shneur Zalman's younger brother, the Maharil.</p>
      <p>Another example in in the perception of the universe according to the teach ancient Jewish mystical literature (very similar to recent discoveries in modern physics). Rabbi Shneur Zalman explained the Baal Shem Tov's understanding of the holy Arizal's teachings. The Vilna Gaon's opposed this understanding, and promoted an alternative view.</p>
      <p>Today, we only have one perception of the G-d's precence in the universe, based upon Rabbi Shneur Zalman's explanation of the Baal Shem Tov's understanding of Arizal's teachings. No one understands anymore what the Vilna Gaon was trying to express (indicative that it did not make sense).</p>
    html_clean: |-
