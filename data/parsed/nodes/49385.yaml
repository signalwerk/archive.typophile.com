      <p>I think perhaps you misunderstood the case: they did not encode a character for the lower punctum. So there was no way to include this entity in text. This situation has been rectified now.</p>
      <p><em>For the kamatz katan, I agree with you to this extent: it makes more sense to do it via a dictionary look up, and not try to create something with syntax only, which is going to work imperfectly in the end.</em></p>
      <p>Whichever way you do it: with a dictionary or with an algorithm, it should be a character-level operation in text, not a glyph-level operation in a font. The purpose of wanting to display the kamatz in different ways is to indicate a semantic distinction (in this case different pronunciation), and a semantic distinction is properly handled at the character level. This is precisely why Unicode accepted encoding of kamatz katan as a distinct character from kamatz gadol. The character code exists, and it should be used if one wants to make this distinction. So this is something that should be done at the text level, not at the font level, using either dictionary-based character substitutions or algorithm-based character substitutions.</p>
