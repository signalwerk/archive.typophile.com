      <p>Michel,</p>
      <p>Thank you for the reference to Makor, and the fascinating article.</p>
      <p>My concern are the fonts.</p>
      <p>I seek the typesetting engine to fully support OpenType's context substitution features (CSUB), supported by InDesign ME (which uses its own internal marking engine on either platform) but not by MS Word (which uses UniScribe on XP and much more robust on Vista).</p>
      <p>I noticed that in terms of precise positioning (CPOS), XeLaTeX performed, but in terms of stylistic alternatives and contextual replacement (CSUB) then XeLaTeX's performance is questionable.</p>
      <p>For example, the ayin patach lamed combination is a good example for use of a stylistic alternative, and shin kubutz ayin patach combination of a contextual replacement.</p>
      <p>In the first case, the ayin changes from the form where part of it dips below the baseline, and is replaced a different ayin with the form which remains above the baseline, to make room for the patach.</p>
      <p>In the second more complicated case, the patach itself is repositioned according to the context: being under ayin (or chet or dagesh hei) and following certain consonant/vowel combinations.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/al_5050.jpg"></div><p></p>
