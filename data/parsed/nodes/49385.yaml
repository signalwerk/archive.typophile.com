      <p>David voiced his objection to the subjective use of the term "knock-off". A knock off is an imitation of a popular design, simply with a different name, to avoid payment to its designer or copyright/trademark owner.</p>
      <p>He cited the example of Tzvika Rosenberg, a popular Israeli font-maker, of MasterFont, who created Apple's Raanana. I called it a "knock-off". The bold version is a really poor knock-off.</p>
      <p>I called it a knock-off because when it was first created and licensed to Apple Israel, the unrelated name, Raanana, a small city in Israel, was picked to avoid payment to Mr. Itamar David, in the early eighties.</p>
      <p>David wondered why I did not call FontWorld's version, King David, also a knock-off, like Tzvika's Raanana. It's a valid question.</p>
      <p>First, King David is not a "knock-off". It is a very carefully rendition, inspired by Mr. David's popular design. It is rendered not to divert from hiis designintentions, but to correct his design flaws.</p>
      <p>The real differance is in appearance. </p>
      <p>Raanana is a little, thinner, narrower, and not equally weighted in its strokes. Look at how David is different. Its strokes are weighted equally, making reproduction at even small point sizes looking right, while the same text, at the same point sizes, does not look right.</p>
      <p>King David captures David's flow, but adds a unique touch, like raising a bit the height of the lamed, or raising the top of the left hand lower stem of the gimmel to increase its clarity and legibility, or the lowering of the top of the detached stroke on left hand side of the kuf, to allow better distinction and "breathing room".</p>
      <p>FontWorld never issued Itamar David a"h any royalty out of "moral good sense" in the nineties, as it had no way to contact him (he was an invalid either living in an age hold or with a child in America). If anyone knows how to contact his descendants, please write to: <a href="mailto:ContactInfoforDavid@gmail.com">ContactInfoforDavid@gmail.com</a></p>
