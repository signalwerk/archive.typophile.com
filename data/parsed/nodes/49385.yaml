      <p>harbs,</p>
      <p>Thank you for joining this discussion. As a knowledgeable person in Hebrew books, I am certain that you will have valuable comments to offer to benefit all its readers.</p>
      <p>Regarding the status of your web site, perhaps you are right, and I am wrong. If that is true, then not only do I owe you an apology and must ask you forgiveness, but I should also declare here in this forum, in "public" my error and your validity.</p>
      <p>However, I believe though this is not incorrect. I'll tell you why:</p>
      <p>1. No distributor or reseller has the right to infringe upon another authorirized distributor's or reseller's territory. Are you a VAR (Value Added Reseller)? This seems not true, as the plug-ins you sell are priced very low, and they are only a non-essential add-on feature, not an essential componant of the InDesign ME software.</p>
      <p>At Apple Computer Inc., I had an arrangement in writing with Apple as a VAR. However, even there I was obligated to compensate the local reseller for every sale. Why would this logical arrangement be rescinded for you by Adobe or WinSoft?</p>
      <p>2. Adobe, to my knowledge, only signs a master license to Winsoft, not to individual resellers. You are claiming Adobe made an exception to you. This is unlikely.</p>
      <p>3. Winsoft respects territorial rights, like most manufacturers, and prohibits a reseller from one country to sell outside his or her territory. You are claiming Adobe made an exception to you. By doing so, you are given an unfair advantage over  every reseller except of course WinSoft's online store.</p>
      <p>If you may sell worldwide over the Internet, why can't other resellers, as your plug-ins are a separate low-cost item? Couldn't you sell the plug-ins worldwide, but adhere to WinSoft's standard arrangements?</p>
      <p>If this is in deed true, why is a special consideration given to you? Why does WinSoft or printisrael.com post a notice refering to this special status?</p>
      <p>So, for these reasons, I don't believe (with all due respect to your Torah knowledge) you are correct, until I see written proof otherwise.</p>
      <p>Your web site is in deed attractive, with the exception of a blurry Adobe logo. I'm sure Adobe would provide you with a higher resolution logo, if you in deed have a direct business relationship with them.</p>
      <p>I really hope that you prove me wrong, because otherwise this act is totally unjustified and can have very harmful results.</p>
