      <p>1. I don't have any scans off-hand. I'm sure googling will give you evidence. Remember you are the one contending x without any basis. Can I see some basis for your assertion?</p>
      <p>2. I am not using kerning to position the taamim. I am using kerning to make sure that the nun and the yud are closer together etc.</p>
      <p>3. I respect your opinion of adding thin spaces between the letters instead of moving the taamim, however, I believe that this is coming from a programmer's point of view and not a typographer's. After all, why do we have fi and ffi ligatures? Why didn't we just add a thin slice of space in between? I think it decreases legibility.</p>
      <p>4. Again, I'm not convinced about the narrower versions either for the same reason, but I am more open to that option.</p>
      <p>5. I will most certainly not tell Harbs anything of the sort. You clearly have no idea who he is, what his relationship with Adobe is and what his relationship with HaKadosh Baruch Hu is (lehavdil). I request that you keep such comments off this forum, they are highly inappropiate.</p>
      <p>6. Yes you are very confused about the meteg on all levels. I'm not sure how you are programming it if you don't understand it. I will explain briefly, because I have explained it already on this thread, if you need more information e-mail me off-list.</p>
      <p>a. The meteg is a taam. It's purpose is secondary stress. It has the same weight as all other taamim. It is not secondary to the taamim. It is a taam.</p>
      <p>b. The sof pasuk (siluk) is a taam. It's purpose is primary stress. It also has the same weight as all the other taamim.</p>
      <p>c. The visual appearance of both these taamim are exactly the same even though they have a completely different purpose. In Unicode, they also have the exact same value (although IMHO this is incorrect).</p>
      <p>d. For 100s of years, the meteg has been "incorrectly" used in Siddurim to indicate primary stress on a word that is not accented on the last syllable. This is known grammatically as "mileil" as opposed to "milra". The thinking was that we tell the reader to pronounce all words as milra (ie stress on last syllable) unless we put a meteg under a different syllable. Eg MElekh. Here there would be a meteg under the first syllable. However, the only time that a meteg would appear under the first syllable in the Tanakh, would be if it was the last word in the sentence, ie a sof pasuk. In this situation, the weight of the meteg has no consequence since it isn't part of the Hebrew grammar but rather a made up sign. It's like saying that a kamatz katan should be heavier than a kamatz gadol. It's nonsense. We only make the kamatz katan larger as an educutional tool. Therefore you might as well keep the meteg used in this situation as the weight of the meteg of the taamey mikra and then you can use the same unicode character. I should point out that in Rinat Yisrael, they use a zarka for words that are commonly mispronounced as mileil and an ole for words commonly mispronounced as milra. There they don't use a meteg at all.</p>
      <p>I hope this clears a few things up.</p>
