      <p>I spoke to a great Hebrew grammar expert, Rabbi Shmuel Rabin, of Toronto, Canada, author of a remarkable treatise on chanting aloud the Scroll of Esther. He inserted in all the correct places, the shva-na, according to the system of Rav Zalman Henna.</p>
      <p>I asked him whether Rabbi Shneur Zalman of Liady, the first Lubavitcher Rebbe, prefered Rav Henna's system over the others popularized by Rabbi Yaakov Emben, Minchat Shai, based upon the writing of the Radak, Rabbi David Kimchi.</p>
      <p>Rsbbi Rabin clarified that the popular Lubavitcher prayerbook, <cite>Tehillat Hashem</cite>, first introduced to the Lubavitcher community the appearance of the shva-na. Rabbi Shneur Zalman's own rendition of the prayerbook did not mark them.</p>
      <p>Rabin explained that the seventh Lubavitcher Rebbe greatly expanded the <cite>Tehillat Hashem</cite> prayerbook by inserting copies of pages from the <cite>Seder Avodah</cite> prayerbook, which marked the shva-na according to the system of Rav Henna. The editor of the <cite>Tehillat Hashem</cite>, the seventh Lubavitcher Rebbe, was accustomed not to change things for no special reason.</p>
      <p>As proof of this, Kehot of Israel retypeset their prayerbook like the view of the Minchat Shai and others, while Kehot of the US follows the old Kehot prayerbook exactly, i.e. Rav Henna's system of defining the shva-na.</p>
      <p>Rabin said that Henna's system was more complicated, and like Minchat Shai, originated with the Radak (Kimchi). </p>
      <p>He also believes it is possible to determine shva-na, if rules can be made first for a kamatz katan which precedes a shva, recognition or placement of the meteg (used differently if there's taamim or not), but it will require much time and effort to sort out. So, both experts in Hebrew grammar, Prof. Dotan and Rabbi Rabin, agree that it is possible. Rabin warns that this is very difficult accord to Rav Henna's system.</p>
      <p>Although Rabin is a Hebrew grammar expert, he explained that the view of the Chabad-Lubavitch movement is to degrade the emphasis on Hebrew grammar. He quote the fifth Lubavitcher Rebbe, Rabbi Sholem Dovber, in the latter's book, <cite>Torat Shalom</cite>, regarding the importance of correct pronunciation, based upon the rules of Hebrew grammar, in prayer. </p>
      <p>Rabbi Sholem Dovber said it's far more important to pronounce the words correctly in general, to understand the meaning of the words, and to pray with a sincere and broken heart. For this reason, the seventh Lubavitcher Rebbe was heard when he payed out loud as the <cite cite="">chazan</cite>, the שליח ציבור, "lit. leader of the congregation", to emphasize chanting in a sing-song manner, and heart-felt feelings, and to ignore issues of Hebrew grammar, even though he was well versed in them from childhood.</p>
      <p>This is consistant with the teachings of the Baal Shem Tov, the founder of the Chassidic movement, that G-d wants the heart, that prayer is measured more by intentions and feelings, and less by rules and regulations.</p>
      <p>Regarding Kimchi's rules of Hebrew grammar, how could two different systems come out of Kimchi's writings?</p>
