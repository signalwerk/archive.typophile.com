      <p>Yes, we considered this option, but I didn't like it. I'm not sure what Tzvika has got to do with this. The system that we have employed follows Koren's original concept and works so far.</p>
      <p>Regarding how many systems of shva na and kamatz katan. There are many many systems and many many exceptions depending on various authorities. In fact some systems don't know what to do with certain words. Trust me, we had 2 rabbinical experts on taamey mikra discussing this for months!</p>
      <p>I have to say that I'm confused as to why you want the font to automatically put them in. It's like saying we should have autocorrect spelling in English in Minion. It *could* be done, but is that the scope of a font?</p>
