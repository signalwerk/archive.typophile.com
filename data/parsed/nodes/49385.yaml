      <p>Israel, I got hold of a Biblical grammar book, so I understand better now what David has been saying with regard to your idea of 'automating' the setting of the kamatz ketan and shva na, as you discussed in the other thread. This thread seems to be 'live', so I'll post here. </p>
      <p>The grammar book is by a Chinese guy, but it corresponds exactly to what David was writing, so I'm assuming it's solid. It's called "Grammar for Biblical Hebrew" by C.L. Seow. </p>
      <p>So the rule for the kamatz katan--which he calls a kamatz chataf--is simple: if it's in a closed syllable, then the kamatz is a kamatz katan, and otherwise not. This David wrote, and followed the rule with a 'smiley'. </p>
      <p>Now I understand the 'smiley', because the rule leads you into a whole chain of questions. </p>
      <p>How do you know whether it's an closed syllable? Simple, it ends with a consonant that has a schva nach under it, or is the last letter.</p>
      <p>And how do you know whether it's a schva nach or schva na? Well, now you get a bunch of rules, one of which is that it's a schva na if comes after a letter with a strong dagesh.</p>
      <p>So how do you know whether it's a strong or weak dagesh? Well, one of the rules is that it's a strong dagesh if it's preceded by a short vowel. </p>
      <p>So how do you know whether it's a short or long vowel?  </p>
      <p>Well up till now I will probably forget all this, but a computer won't, so there's no problem programming it, I would guess. </p>
      <p>But here is the kicker: you only tell whether it's a short or long vowel by whether it falls on an accented syllable. </p>
      <p>So you've hit a brick wall if you are only looking at syntax, because nothing in the letters or nikud are going to tell you where accent is. (David mentioned the accent issue also.)</p>
      <p>To know the where accent is you are going to have to have a 'look up' of the word in some kind of dictionary that will tell you where the accent lies. </p>
      <p>So it looks to me like what you need is not open type programming to do what you want, but rather some kind of 'spell check' that will automatically put the kind of nikkud you want. That you could do with the look-ups. I know that one of the Hebrew typing programs already has 'auto-nikud', but I don't know whether they will distinguish a kamatz katan and the different kinds of schva. But I don't see why they couldn't do it in principle.</p>
      <p>So with a kind of spell checker which you would run or would be active all the time, it seems you could do what you want. But not by just sticking to the sequence of letters. </p>
      <p>ps. Oops I left out that the cantillation marks for Torah writings--taamei hamikra--might change where the accent is, according to what David wrote. That might force you to look at more than on word, but presumably a spell check program could do that in principle. </p>
      <p>Whether it's worth the effort is another question. </p>
      <p>pps. This book says that a kamatz katan is sometimes indicated by putting a meteg next to the kamatz. That seems to me typographically better than the line above the letter, or a bigger kamatz. However, I read somewhere that in the Siddur the meteg multiplied like measles so nobody really knows what they mean. So I don't know.</p>
