      <p>Volt has no problem with shva-na, kamatz katan, or hataf kamatz katan. As Theodore Herzel was want to say: "If you can dream it, so it will be", or something like that.</p>
      <p>Raphael, is the Koren system of nikkud/taam/meteg placement different from other systems of placement, by simply centering the nikkud as if it was the main unit, and then place the tamm and/or meteg to its left, whereas other systems center the three glyph as a single unit? </p>
      <p>Plus Koren's system placed the taam and meteg on a slightly lower level than the nikkud, whiles others keep all diacritics, including nikkud, on the same level.</p>
      <p>Some change the weight of the nikkud, taam, and meteg, too. I don't think Koren did this.</p>
      <p>Shva-na is vital, as words do change meaning because of some shva-nas, and pronunciation of course changes.</p>
      <p>Today, most Askenazic Jews use Sephardic pronunciation, so kamatz katan is essential to pronounce prayers accurately. Askenazim who maintain tradition, and prnounce according to their tradition also benefit from kamatz katan for a few reasons, though our Jewish leaders chose not to emphasize it. This attitude is changing.</p>
      <p>Hence, the new Koren Bible text would be negligent if it lacked them, particularly if other products offer it. Furthermore, instead of marching forward, neglecting them would be a step backward.</p>
