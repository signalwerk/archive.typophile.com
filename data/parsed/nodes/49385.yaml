      <p>Raphael, thanks for bringing your expertise to this discussion. </p>
      <p>As far as the question of how to mark the shva na, I have a question. In the prayerbook, of course you are going to set whatever people want. </p>
      <p>But as far as the Bible, the masoretic text didn't distinguish the kamatz katan or shva na, right? And the Chomsky article casts doubt on whether the grammatical rules for labeling of the shva na that come from Kimchi and seems to be generally accepted, ever really existed in spoken language. So I would think that at least for the general public it would make more sense with the Tanach just to have the all the instances of the shva the same, or to put them in as in spoken Israeli Hebrew. I have the Jerusalem Bible, published by Koren, which doesn't seem to distinguish the different kinds of schva, or the different kamatz. </p>
      <p>What is the general practice? Or is there one?</p>
