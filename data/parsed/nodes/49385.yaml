      <p>Thanks for the clarifications, David.</p>
      <p>How does one sing without melody? The answer to that depends on how one defines melody. If one assumes melody to include changes in tone, i.e. pitch variation, and not just changes in duration (rhythm), then such 'singing without melody' would be what is called recto tono in Latin chant. This is a very simple style of chant that is rythmic but does not involve pitch variation; it is used for e.g. the liturgical confiteor (confession) and certain prayers, and can also be used, as a fallback, if one isn't accomplished enough to sing the proper melody for e.g. an antiphon.</p>
      <p>Jacobson's description of the interpretation of meteg in Jewish chant indicates that the reciting tone is maintained: the syllable with meteg is lengthened and sung slightly louder, but the pitch does not change. So the role of meteg is rhythmic rather than melodic in the sense used in the previous paragraph.</p>
      <p>There is a much more general definition of melody, though: 'interacting patterns of changing events occurring in time.' And in that case merely rhythmic changes could be interpreted as 'melody', although I wonder how many lay-listeners would consider the results melodic.</p>
