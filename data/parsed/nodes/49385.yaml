      <p>The truth is that any handwriting, script-like, or italic, typeface design can incline to the right or to the left. There seemingly is nothing in the design that requires the slant to be one way or the other? Is there?</p>
      <p>A few years ago, I created a set of fonts with joining letters to teach children to form letters correctly, to write with a clear handwriting. </p>
      <p>In one font, the alphabet appeared with each letter form separate, to show a child how the letter by itself is supposed to look. In a second font, the alphabet appeared with each letter form joined to the next letter to show a child how the letters together are supposed to look (this was very difficult as letters join each other differently, and there was no OpenType yet to address these different situations). In a third font, the alphabet appeared with each letter form joined to the next letter to show a child how the letters together are supposed to look, but very small arrows were added to each letter, to indicate how each letter should be correctly formed.</p>
      <p>Most left-to-right languages, like English, have letters formed clockwise, while most right-to-left languages, like Hebrew, have letters formed counter-clockwise. However, slant plays no role in being determined by the rotation of the formation of a language's letters. Rather, the direction of eye movement is the determining factor.</p>
      <p>This is why a right inclined letter is inappropriate for Hebrew, because eye movement is leftwards. In this incorrect case, the stress on one's eye movement in increased continously because of the letter's slant.</p>
      <p>On John's example, I believe the very old beautiful Hebrew handwriting was likely from a right-handed person, as Rashi observes that most people write with their right hand. In writing Hebrew, the hand must be held somewhat awkward, as the arm covers the written text; hence, right slanted text is easier for the hand to form, due to the somewhat awkward position off the hand. A left-handed person has an easier time holding the pen to write Hebrew, by to produce right slanted text is easier than producing left slanted text.</p>
      <p>I think that this correct. What does everyone else think?</p>
    html_clean: |-
