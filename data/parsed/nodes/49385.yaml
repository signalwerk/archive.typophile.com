      <p>Here is one example of right-slanted Hebrew writing, selected at random from <em>Manuscrits médiévaux en caractères hébraïques</em>. This example is from central Italy, from a document dated 1433, now in the Bibliothèque nationale, Paris. The same document also shows a more formal, upright writing in the larger size.</p>
      <p>This example is instructive, I think, because one can see how such a slant would develop very naturally from writing quickly, with the down-strokes made quickly, with a flick. If you consider that the hand will be moving on, to the left, to begin writing the next letter, a flick in this direction on the down-stroke is much more natural than a movement to the right to produce a left-slanted letter. [This also accounts for the characteristic exit stroke of Latin italics: a flick up and to the right toward the starting point of the next letter.]</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HebrewRightSlant_5267.jpg"></div><p></p>
