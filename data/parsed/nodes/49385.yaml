      <p>&gt;<cite>...the “rules” according Chabad leaders, or also other folks...</cite></p>
      <p>There are no rules from Chabad leaders, or "other folks" from recent times, except grammartarian Dr. Noam Chomsky, or the "father" of modern Hebrew (who introduced Hebrew to a word for telephone, as "telefone", or electricity as "chashmal" (a word from the Talmud for a manner to carry a fire-like energy to another place).</p>
      <p>We only have Rabbi David Kimchi from about 800 years ago (?), the Minchat Shai (when is he from?), others like him, and the very early Rishonim. These are known expert views, accepted by everyone.</p>
      <p>Only Kimchi and Chomsky (when is he from?) are in print. So, it's difficult to research the sources. All we have are these two among the noted Jewish scholars.</p>
      <p>Was Chomsky like Marcus Jastrow, who ate pork and puffed on a pipe on the Sabbath? Jastrow, too, was a very great scholar. But it's hard to believe that "somebody can emit truthfulness from his mouth when it contradicts the scholars of those much greater than him, for those scholars were living examples of what they taught, while he is a great "pretender"."</p>
      <p>Was Chomsky like the early Reform rabbis in Germany who found a loophole for anything? </p>
      <p>The Talmud says that there are many ways to "allow" one to hold a bug or insect while ritually immersing, but that doesn't mean it is correctly done that way. The Reform rabbis held bugs and insect while they composed their responsa in the john.</p>
      <p>&gt; <cite>...If you want to set type for others, it seems to me Chomsky might be very informative.</cite></p>
      <p>I seek to set type correctly. Truthfully. If the Hebrew Union Coolege gives me $$$ to make them custom fonts according to Chomsky, I'll tithe at least 10% to Charity.</p>
      <p>But I doubt if anyone really cares. They won't put their money where their mouth is.</p>
      <p>&gt; <cite>By the way, I just realized that trying...</cite></p>
      <p>Ya'gah'tah uh'matza'tah, ta'ah'meen. Where there's a will there's a way. The Mishnah promises it's true!</p>
      <p>I think <strong>multiple</strong> GSUBs and look-up tables make shva-na, kamatza katan, even meteg and auto-nikkud etc. possible.</p>
      <p>Each look-up does a different contextual analysis, and linked together, they all result in an OpenType font capable of anything in Hebrew grammar.</p>
      <p>Now, today, with processing speeds as fast as they are, these OpenType fonts will be much slower to process than ordinary Hebrew OpenTpe fonts. However, as processing speeds rapidly increase a lot, and dual processors support InDesign, giving way to triple processors, these complex OpenType fonts will also race.</p>
