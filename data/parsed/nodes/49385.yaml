      <p>Israel,</p>
      <p><em>A meteg is not chanted, but indicates a stressed syllable. In Biblical text, is the meteg indicating this?</em></p>
      <p>It is chanted <em>and</em> it is indicating (secondary) stress. Stress is part of chant.</p>
      <p>What I am not sure about is how this chant stress -- and hence this use of meteg -- relates to stress in spoken Hebrew.</p>
      <p><em>How does the reader know its a meteg or a silug, if they occurs at the end of a verse? All they both repeated?</em></p>
      <p>Does SBL-Hebrew have a double meteg by itself, a double meteg with each nikkud, a double meteg with each taam, anda double meteg with each nikkud and combination?</p>
      <p>There is no situation in the Bible text where meteg and siluq fall on the same <em>syllable</em>. There are cases where they fall on the same word, but always on separate syllables. So there is no need for a 'double meteg' combination.</p>
      <p>Think of is this way:</p>
      <p>The cantor is studying the vocalised and accented text (obviously he needs to do this prior to the service, because the synagogue scrolls do not contain the nikudot or ta'amim; he has to practice ahead of time and do it from memory). He sees this little vertical mark which he knows has particular musical significance. In the midst of a verse it indicates secondary stress, which he will sing slightly louder and longer than a syllable that has no accent. At the end of a verse it indicates a final cadence, typically of two or three notes depending on the word. [Note also that the cadence for siluq varies when the verse is the final one in the reading.]</p>
      <p>So the terms meteg and siluq do not refer to distinct marks, per se, but to different interpretations of the same mark in different contexts.</p>
