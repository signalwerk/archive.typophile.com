      <p>Michel,</p>
      <p>From your example and your recent postings, you appear to be focused upon the issue of automatic nikkud via an OpenType font, which I proposed may be a feature of a "smart" OpenType font of the future.</p>
      <p>Truly, in a peripheral and wishful thought, I think it's possible. You clearly do not.</p>
      <p>I wasn't going to put my focus upon it at this time, until after I knew OpenType's GSUB and database capabilities, and the intracasies of Hebrew grammar, both much better and first hand (which I don't yet).</p>
      <p>In my stubbornness, I still (perhaps, naively) think incorporating it into OpenType is possible. </p>
      <p>As I understand it, the dictionary/spell-checker look-up is to correct the error factor of the software. Meaning, the algorythm in the software performs the job with an error ratio, and the spell checker's purpose is to correct these errors.</p>
      <p>At first glance at your examples, the difference in spelling seems only contextual. When one spelling follows after a type of word, eg. כי, the string (the spelling is with a tsere) is one way, but if it's following a different type, eg. not כי, the string is not this way.</p>
      <p>It would appear that a wildcard and a qualification table would address this, eg. if the string is such and such, with various wildcards, and it is not such and such, with various wildcards, then it should be replaced as such and such.</p>
      <p>Your examples convince me that OpenType can achieve this (although there may be some percentage of inaccuracy, as there is no spell-checker).</p>
      <p>Again, my immediate goal is not auto-nikkud or auto-taam or auto-meteg. These are lofty goals.</p>
      <p>Rather, my immediate goal is a set of algorythms to automate replacement of certain shvas with shva-na, of certain kamatzes with kamataz gadols, and certain kamatz gadols with hataf kamatz gadols.</p>
      <p>First, I want to see if they are doable, and if they are, can it be processed in a reasonable amount of time.</p>
