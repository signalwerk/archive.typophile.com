      <p>Are you aware of Friedlaender's  essay (appeared first in 1967, in German; 1975, Jerusalem) -- The Making of Hadassah Hebrew?  He was influenced  by  the Scroll of Esther (1800; Ashkenazic letter forms) and by the  Italian semi-cursive  Drugulin (also Ashkenazic letter forms). There's nothing about Bomberg or Soncino.</p>
