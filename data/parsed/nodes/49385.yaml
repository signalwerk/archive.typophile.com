      <p>Another very popular design is David, created by the great Israeli type designer, Mr. Itamar David a"h. It is a script-like upright design, very unlike FrankReuhl. It's light, not as wide, and very readable. Until the advent of Narkis, David became an exceedingly popular design, second to FrankReuhl.</p>
      <p><img src="/sites/default/files/old-images/David_3941.jpg"></p>
      <p>FontWorld created another version, called King David. Purchased by Apple, MasterFont created, Raanana, as yet another knock-off of David. </p>
      <p>Mr. David created many other remarkable designs, such as Itamar, but David was his claim to fame.</p>
