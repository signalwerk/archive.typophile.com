      <p>I understood you to start with. The idea of adding a thin slice in between letters was considered and rejected. It is much easier to program and there are lot less kerning pairs. Perhaps for a general purpose font this is a good compromise. There is another solution that we also rejected that Harbs came up with and that was to create 90% width versions of the wider letters of nikud that would be substituted when necessary to solve collisions. Again a very very good idea which visually is unnoticeable but also rejected. You have to understand the Koren is about purity of text and purity of the letters. This is why the Koren Bible is considered to be the most accurate Bible by many today. In fact, the Chief Rabbinate of Israel gave a psak din that if a klaf was unavailable for reading the Haftara, then a Koren Bible maybe used, bedieved. You don't get that level of psak for any other Bible.</p>
      <p>We have to be perfect because we have a nearly 50-year legacy to live up to.</p>
      <p>Regarding the rules. I'm sorry, but that's like saying, "most people can't spell so we'll fix it in the font". Actually, it's not even like that. How many people typeset Tanakhim and Humashim? Those publishing these volumes tend to have experts checking them. You are also assuming that your system of nikud is the correct one or the only one. You just can't do that. Do you have any idea how long it will take to proofread a Tanakh, get it perfect and then check the collisions? The amount of work is tremendous.</p>
      <p>The Koren Tanakh took 10 years to proofread. We are now in the midst of digitisation and expect it to take another five years or so and once this is complete we'll have one font ready for one system of nikud (ie the Koren font with the Koren system). However, if you wanted to typeset a Tanakh with another system, then you would have to fix the font.</p>
      <p>All I'm saying is that what you want is possible, but the real question that I ask you here on this forum as I did on the Adobe forums, is what on earth for? How much is a person going to pay for such a typeface? $10,000? And what happens if he doesn't want Vilna, but wants Hadasa? You are going to create this for each font? I just think that you don't really understand the full ramifications of what you are getting yourself in for.</p>
