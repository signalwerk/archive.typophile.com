      <p>Michel, thanks for that reference, which corresponds more with modern Hebrew. Now the shva is starting to make more sense. In <a class="freelinking external" href="http://books.google.com/books?id=Zhjd_m5hIeIC&amp;pg=PA82&amp;lpg=PA82&amp;dq=liquid+consonants+in+Hebrew&amp;source=web&amp;ots=Q-rKTPba1J&amp;sig=VRfBmY8r8XH2t4eq7_XCSHw7ik8&amp;hl=en&amp;sa=X&amp;oi=book_result&amp;resnum=6&amp;ct=result" rel="nofollow">this grammar, which I found on Google Books</a>, p. 50 on the "shewa", it is clear that the distinction between the shva na and nach--i.e., when the shva is voiced and not, was never really clear. </p>
      <p>And in modern Hebrew the shva is generally pronounced when it is grammatically significant, and otherwise generally not, unless it is really a tongue-twister. Thus 'bracha', blessing, and not 'beracha', but "berosh hashanah", on rosh hashanah, and not "brosh hashanah". And what may be tongue-twisters for non-natives, like 'gdolah' (big) instead of 'gedolah' is utterly unproblematic for native speakers. </p>
      <p>All of this leads me to a philosophical issue. In the Tanach itself, since scholars argue about how exactly to interpret the combination of nikkud and ta'amei hamikra, whether to introduce distinctions not already existing in the Tiberian system them seems an editorial decision--which scholar are you going to follow?</p>
      <p>And when it comes to the Siddur, the prayer book, it seems to me the better path is just to follow modern Hebrew, if you are going to specially label the shva na and kamatz katan. After all, Hebrew is now, thanks to God and the Israelis, a living language, and we don't know how it was pronounced in the days of Isaiah or whomever.</p>
