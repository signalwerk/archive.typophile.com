      <p>You are quite correct in your comments and at the moment, my preference is to leave the Bible well alone (although I reserve the right to change my mind :-) )</p>
      <p>However, part of the Bible that is used in our services, "the Chumash" needs to be treated differently since people reading from the Torah in services to indeed distinguish between the kamatz katan and the shva na and therefore we do need to add markings for this.</p>
      <p>My current thoughts are to produce the new Chumash (ie the Five Books of Moses, the Haftarot, the 5 Megillot and Tehillim) in 3 flavours: Ashkenazic, Sefardic and perhaps a Neutral flavour. Whether we add the kamatz katan and shva na in the full Bible is something we have a few years to think about because the proofreading is going to take quite some time!</p>
      <p>You may be interested to know that we are resetting the English of the Jerusalem Bible at the moment in Arno Pro and should be available hopefully by the summer.</p>
