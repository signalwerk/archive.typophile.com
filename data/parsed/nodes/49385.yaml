      <p>While you are listing sources on the grammar of the te'amim and nikud, I see that the Encyclopedia Judaica has a long article, amounting to a small book, on this, under the heading 'Masorah'. It looks very exhaustive--and to me exhausting! It has a huge Bibliography. (It is in vol. 16, the final one, out of order.)</p>
      <p>There they talk about the Ga'yah, which seems to later be called the meteg. Apparently it was initially created in order to distinguish the schva nach and schva na! And then it came to be used in all kinds of capricious ways, which scholars tried to sort out and systematize. </p>
      <p>Israel, according to Michael Meyer's history "Response to Modernity", the infamous "trefa banquet", with shellfish (not pork) was ordered by by laymen from a Jewish caterer--who obviously didn't know or didn't care about kashrut. It was not a deliberate provocation by some rabbis, but rather a huge embarrassment. Some Reform minded Rabbis indeed didn't care about kashrut, but they wouldn't have deliberately offended their colleagues. Still the laxness did reveal dramatically the underlying differences of attitude. </p>
      <p>The occasion was the first ordination of Rabbis from the Hebrew Union College, in 1883. At that time there were no separate Jewish denominations in the US, and indeed this did spark the actual split between Reform and Conservative, though the tensions were obviously already there.</p>
