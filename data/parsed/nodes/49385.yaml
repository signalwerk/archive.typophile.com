      <p>I really am not trying to encode grammar, which rules based upon woed and sentence structure.</p>
      <p>That is the realm or the teacher and the scholar.</p>
      <p>I am expanding the Unicode Hebrew standard to include all graphic symbols that are used in Hebrew, and those that do not earn a Unicode to include them in my fonts, such as a folded lamed or ayin, a truncated final nuhn or final chof (do you know what that is?),a set of shva-na symbols, or the hataf kamatz katan (soon to be widely used - he, he).</p>
      <p>What I want to do, which Prof. Dotan and Rabbi Rabin, think can be done, is to create a kind contextual analysis to insert a kamatz katan, maybe meteg, and shva-na like John Hudson's (fairly easy) furtive patach (that Jewish publishers never did before Koren).</p>
      <p>It's not grammar. It contual analysis.</p>
