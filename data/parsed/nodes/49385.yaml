      <p>I misread the sentence from Dana of the Eretz Hemdah organisation, <a href="mailto:dana@eretzhemdah.org">dana@eretzhemdah.org</a>, an affiliate of the Orthodox Union in Israel.</p>
      <p><cite>1. Kamatz Katan<br>
      However, in the Sephardic pronunciation there exists a clear distinction between Kamatz Katan and Kamatz Gadol, and even the Ashkenazic pronunciation, which does not distinguish as such, still recognizes the difference in that the type of Kamatz will usually determine whether a Shva following it will be a Shva Na or a Shva Nach.</cite></p>
      <p>This statement says clearly that the kind of shva, na or nach is usually determined by the kind of kamatz, gadol or katan, before it. Not vice versa, as I incorrectly suggested that was stated.</p>
