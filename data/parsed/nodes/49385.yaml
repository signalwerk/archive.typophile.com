      <p>David, yes, I meant make a visual distinction, different marks. </p>
      <p>Obviously, they would have had to sometimes pronounce the shva. Otherwise Hebrew would be unpronounceable. But the question is, how was it actually done. If I understand him rightly, Chomsky doesn't think that native speakers ever followed what are now accepted the rules of "grammar" in this area. And in fact current Hebrew speech is closer to what may have been done. </p>
