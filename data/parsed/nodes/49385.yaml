      <p>Your question of why Frank Reuhl won out is an interesting one to me. </p>
      <p>Based on my own efforts to understand readability of roman text types, my guess would be that the ratio between counter and spacing is better in Frank Reuhl than in the older, wider styles, and that a better 'rhythm' resulted in higher readability in extended text.</p>
