      <p>Further research on meteg confirms that its origin is as part of the full accentuation (cantillation) of the Hebrew Bible, and its primary role must be understood as part of that overall system. However, it is unique among the accents in that it is also sometimes encountered in otherwise unaccented text, i.e. alongside the nikudot vocalisation.</p>
      <p>I'm only familiar with the Biblical text, so I don't know how meteg is used independently of the full cantillation system, and have not been able to locate reliable information on this (other than anecdotal comments that it represents 'stress', which doesn't really convey much: what kind of stress? in what circumstances?). What I am fairly sure of though is that this use is a later development and, presumably, derivative of the role of meteg in the cantillation system (as described above).</p>
      <p>Here, for reference, is Gesenius' explication of the meteg accent (2nd English edition, based on 28th German edition, Oxford 1910). German readers may wish to seek out Baer's 'exhaustive account' cited in the footnote on page 64.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GeseniusMeteg_5285.jpg"></div><p></p>
