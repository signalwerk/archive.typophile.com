      <p>Israel, I don't understand why you are so insistent that nikkud be done through open type, when it already can be done by dictionary look ups. Dagesh, the word processor, already has <a class="freelinking external" href="http://www.jewishsoftware.com/products/Dagesh_Pro_IV_+_BONUS_Printable__Editable_Texts_1208.asp?bhcd2=1223303755" rel="nofollow">auto-nikkud</a>, which will automatically insert nikkud. </p>
      <p>If you want to distinguish shva na and shva nach, then I think that could be done also to a great extent by dictionary look ups. (I assume auto-nikkud doesn't do this as yet.) David has said that whether the shva is voiced or not may also depend on cantillation marks. That being so, then what is the problem with just doing that ad hoc? The Tanach is long, but finite, and the computer has no problem in remembering what is what. And, as Michel points out, there is anyway sometimes ambiguity as to what word is meant, when the text lacks nikkud. So that surely has to be resolved by an already pointed text of the Tanach. You have to go with a look-up. </p>
      <p>I just don't see your point in trying to do everything by open type, which is only syntactical. What you want can be done anyway by other means, and seems to be impossible only relying on syntax.</p>
