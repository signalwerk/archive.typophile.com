      <p>Another very popular modern Hebrew design is Mr. Henri Friedlender's Hadasa, named after the printing school where he worked. Hadasa was created to be carved into stone on a new Israeli building. Friedlaeder resourched its design extensively, patterning it after motifs he took from very old Ashkenazic and Sephardic letter forms, and those of Bomberg and Soncino.</p>
      <p>GoHebrew's Henri is a faithful rendition of Hadasa, approved by Mr. Friedlander before he died. Another version was drawn for the Israeli distributor of Esselte/Letraset products. Very recently, a third design was designed by FontBit, called New Hadasa. Also, John Hudson's Adobe Hebrew was inspired in part by Hadasa.</p>
      <p>The very popular ArtScroll Orthodox Jewish publishing house based in Brooklyn uses Hadasa exclusively for its books. Mr. Friedlaender cried when he learned that the Bible today is studied by millions of Jews in Hadasa.</p>
      <p>Although not as popular as David, Hadasa is a close third.</p>
      <p><img src="/sites/default/files/old-images/Hadasa_6124.jpg"></p>
