      <p>Here are a few more Hebrew type designs:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HebrewMSSamples_6555.jpg"></div><p></p>
      <p>Featured is the first complete Biblical Hebrew OpenType font by John Hudson, called "SBL-Hebrew", made for the worldwide SBL organization. It both captures very old Ashkenazic and Sephardic scripting technigues, and is also modern, and original in design.</p>
      <p>There are a few classic designs from Microsoft, "FrankRuehl" and "David". In my opinion, they are authentic faithful versions. </p>
      <p>Note the faithful rendition of the aleph in Microsoft's bold weight. Notice also the aleph in FontBit's bold weight. The aleph from Apple's Raanana Bold is very sloppy, and amatuerishly produced. The design is made to simulate the strokes of a quill. Here it looks highly unnatural.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DavidBold_compare_3597.jpg"></div><p></p>
