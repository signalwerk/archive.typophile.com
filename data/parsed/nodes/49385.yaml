      <p>Ah ha! Didn't I tell you, Israel, at the beginning of this that the concern with grammar was a rationalist thing, and you probably wouldn't find satisfaction about it in the mystical and Chassidic tradition? </p>
      <p>As to different systems coming from Radak, according to William Chomsky, the idea of long and short vowels came from David Kimchi's father, and was developed by him. It is so complex (and questionable), from what I have seen, that I'm not surprised that a lot of issues were yet to be figured out. Radak was a follower of Maimonides, not of the mystics who subsequently rebelled against Maimonides' rationalist views and created the Kabbalah. </p>
      <p>By the way an interesting--to me anyway--side light on this is that IIRC Noam Chomsky, son of William, started his linguistic studies with Hebrew grammar, and that was one influence that eventually led him to develop his famous theory of "transformational generative grammar" that he claims underlays all languages. When you see how the Radak rules are brief, but hooked to others that then become recursively a more and more complex system, you can see the influence on Noam Chomsky in the development of his ideas.</p>
