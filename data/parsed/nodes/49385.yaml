      <p>Where's the head of this thread? What is subject? When you start a new thread try to take a little break; maybe drink... tea... coffee or something :)  There're ton of images  —  try to group them to one or two; rest a little bit, post more. </p>
      <p>Because right now this thread is a big mish mash.  Moreover, try to play a fair game. Why  do you say  knock-off and not  version?  — "MasterFont created, Raanana, as yet another knock-off of David"? Maybe FontWorld created knock-off? </p>
