      <p>Israel, how much do you know about linguistics and how much about music?</p>
      <p>Because of the nature of chant -- all chant, not just Jewish --, there is a strong relationship of music to text and hence to the characteristics of spoken language, particularly stress, which performs a rhythmic role in both speech and chant. So yes, there is a relationship between the ta'amim and the nikudot, <em>but</em> -- and this is important -- vowels are the most fluid elements of language. They are fluid in their individual and regional interpretation and they are also historically fluid (consider the 'great vowel shift' in mediaeval English). So what the nikudot signify is something less fixed than either the consonant letters or the ta'amim. Note also that what the ta'amim signify is also changeable, although in a different way: how particular accents are interpreted by the cantor depends on the calendar, the same mark will be expressed musically in different ways depending on the text and the holy day. Historically, the ta'amim have also been given different melodies in different diaspora communities. Jacobson has a nice example of the intersection of these phenomena on page 16, where he shows six different melodic interpretations of the ta'am tevir -- respectively for Torah, Haftarah, Esther, Lamentations, the Song of Songs, and Torah on a High Holiday -- in a Lithuanian tradition.</p>
      <p><em>The typeface design is Stam.</em></p>
      <p>Better to say that Stam is a typeface in the style of this (probably 18th century) Ashkenazic formal writing.</p>
