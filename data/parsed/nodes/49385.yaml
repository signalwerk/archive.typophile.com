      <p>&gt; the rules for shva na as defined by the Israeli Language Institute follow the same rules of the Ashkenazic tradition.</p>
      <p>There seems to be three sets of rules:<br>
      1) Rav Zalman Henna (Henau) - Chabad prayerbook<br>
      2) Ibn Ezra and Vilna Gaon, based on Eliahu ha-Levi(Levita) Bachur - ArtScroll prayerbook<br>
      3) Early Rishonim and Minchat Shai - Shai Lemorah books</p>
      <p>Which one is similar to the Radak, Rabbi David Kimchi?</p>
      <p>Do we make all the three versions in 3 OT fonts?</p>
      <p>I don't think it would take an unreasonable amount of time to automatically compile a shva-na and kamatz katan, because it would only compile after cedrtain sequences every 15 words or more, and not every word.</p>
      <p>The more I learn about the shva-na's relation to the kamatz katan and meteg and certain nikkud before it, depending upon its position in word, and then feasibility to access an exception table, I am convinced it can be done in about 5 routines.</p>
