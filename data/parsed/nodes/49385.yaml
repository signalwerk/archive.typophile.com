      <p>John,</p>
      <p>I know that your sample is handwriting, and both my recent samples are from font software. </p>
      <p>One of my samples is just like that which is used by sofer STaM, a Hebrew scribe of STaM, to compose by quill a Sefer Torah parchment (which is later sewed together), 5 parchments for Tefillin, and one small parchment for a Mezuzah. This is a font, without the taggim, the ornaments on top of some the letters. The scribe hand draws the letters according to different rules. the Vaad Mishmereth STaM rules are actually very old. Maimonides discussed then as well. Halacha authorities debate how to both correctly draw certain letters and at the same time incorporate ideas discussed in Jewish mystical writing, to evoke these ideas while wearing the Tefillin.</p>
      <p>I do not understand your repeated reference to the Vaad Mishmereth STaM rules. They pertain to the Sefer Torah Scroll Sans letter shapes, but with the taggim. These rules do not pertain to the font called, "Stam".</p>
      <p>I agree that the sample handwriting is not Stam. Rather, it resembles the typeface called Stam, but preceded it by many hundreds of years (?) .</p>
      <p>Do you have other samples of old Hebrew handwriting?</p>
      <p>The other one of my samples is the Stam font, used as a typesetting font by some people for some religious writings. There is no rule here to follow. The religious writings could be in FrankReuhl or Henri.</p>
      <p>Stam was simply selected as a name, as you say, to evoke a religious feeling. Nowadays, few typesetters use Stam at all.</p>
