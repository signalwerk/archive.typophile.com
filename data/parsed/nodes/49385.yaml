      <p>Some additional observations from Jacobson's _Chanting the Hebrew Bible_ (p.430)</p>
      <p><em>• The symbols for meteg and siluk look identical.</em></p>
      <p>• Siluk marks the last word in a verse. In most books it is followed by the sof-pasuk sign.</p>
      <p>• Siluk is placed under the first letter of the stressed syllable.</p>
      <p>• Meteg is a secondary accent: it will never appear alone on a word without that word's primary accent. The primary accent is placed on the stressed syllable. Meteg indicates a secondary word stress, usually two syllables before the primary stress.</p>
      <p>Jacobson provides examples of both meteg and siluq.</p>
      <p>From these rules it follows that:</p>
      <p>if you see a word with only the meteg/siluq mark, and no other ta'am, then it must be siluq;</p>
      <p>if you see a word with the meteg/siluq mark on one syllable but another accent on a later syllable, then it must be meteg;</p>
      <p>siluq is the sign used as a primary accent;</p>
      <p>ergo, if a word has two occurences of the sign then the first must be meteg and the second must be siluq.</p>
