      <p>Israel,</p>
      <p>&gt; This is accurate if the word is a verb, but when it wasn’t a verb, then it was an ordinary shva. So the definition needs an exception.</p>
      <p>An image. or two.  There's no such a thing — if it's a verb - yes; not a verb -- ordinary shva. </p>
      <p>&gt; But is “it” referring to the kind of meteg which indicates stress....</p>
      <p>There are ten different kinds of metegs:<br>
      1. Heavy meteg: 2 kinds of heavy -- regular + not regular<br>
      2. light meteg<br>
      3. meteg on guttural<br>
      4. meteg on middle  guttural<br>
      5. meteg on sheva<br>
      6. vayehi meteg<br>
      7. meteg +  letter he<br>
      8. meteg on closed syllable + long vowel<br>
      9. meteg on open syllable +  long vowel<br>
      10. meteg +  similar letters</p>
      <p>There's a rare meteg (Poetical Books)  that we don't know why that meteg is there.</p>
      <p>As a  visual graphic (only Breuer and his school): there's the "long  meteg" — a long vertical line; " short  meteg  — the usual short vertical line.</p>
      <p>In general, as a type designer you don't need/have to know the whole big family  so called meteg. But if you want to deal with grammar you have to.</p>
      <p>To add to your "research learning curve is like a big mountain to climb": you want to have a special mark e.g. floating asterisk above the sheva na, right? But EVERY  hataf is sheva na:  hataf segol, hataf patah, hataf qamats.</p>
