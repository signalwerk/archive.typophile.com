      <p>Ittai Tamari -- Digitization of Hebrew Fonts (pp.190-191, p.195), about Frank-Rühl:</p>
      <p>"Among its numerous faults one may mention its too dense and heavy appearance, which needs very careful letterspacing when hand-set in sizes smaller than 12 point...clear distinctions between similar-looking letters (Daleth and Resh, Vav and Za'in, Heth and Thaf) were not made, although the designer was well aware of the problem.<br>
      However, what interests us most is not the shortcomings of the design -- rather, its incomparable success as the most-used Hebrew type....Any possible explanation is indeed a mixture of many factors: sociological, technical, human -- and most of all the lack of other, more compatible choices, which would comply with the current taste. The Frank-Rühl letters appaered (at first only in normal weight, the additional bold weight was a later adaption by other designers), fortunately, in a significant period for the Jews: the establishment of the Zionist movment...; the visualisation of their return to the Promised Land....; Jewish authors and poets were endeavouring to write in the future only in Hebrew. These developments needed, of course, means of publications, i.e. text typefaces, which needed to be different-looking from the then familiar ones. These were found in the Frank-Rühl design." </p>
      <p>Line #1: the original -- Berthold<br>
      Line#2: Linotype linecasting machine<br>
      Line#3: Monotype<br>
      Line#4: AM International<br>
      Line#5: Linotron 202<br>
      Line#6: Autologic<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FrankR_4351.gif"></div><p></p>
      <p>Right now there's not  a single revival that is close to the original. </p>
      <p>&gt; Why then did Frank refer to this design as “Meruba”?</p>
      <p>Meruba= block letter, all non-script Hebrew type (page 9, 12 -- his little booklet). BTW, Monotype's version of Meruba was called Sonzino, Drugulin's was called Magalith; the font Miriam -- Frank also may have designed Miriam, since it appers in the 1924 Berthold catalog along with Frank-Rühl. </p>
      <p>&gt; These samples include rarely used examples of different type style designs,</p>
      <p>Lettering. Don't forget that Raphael Frank was Sofer Stam.</p>
