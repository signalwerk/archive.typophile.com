      <p>Earlier John Hudson agreed in part with the distinction between Ashkenazic type designs and Sephardic type designs by the pinpointing of the direction of the "flag" in the upper right hand side of the aleph. When the flag was pointed rightwards, this indicated that the design was Ashkenazic; when the flag was pointed leftwards, this indicated that the design was Sephardic.</p>
      <p>He preferred the concept brought in Misha Beletsky's analysis (in his essay on Zvi Narkiss’ work in the book Language Culture Type) that the style of the stroke movement was an indicator, as Ashkenazic stroke movements were typically different than Sephardic stroke movements. See above.</p>
      <p>In my view, both are distinct issues. I am pointing out design traits. John, if I understand him correctly, is emphasizing the use of the medium to compose. In the comparison below, the issue of design traits appears the main factor, as these designs are "full", and are not reflective of the stroke movements associated with composition.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aleph_compison_5182.jpg"></div><p></p>
