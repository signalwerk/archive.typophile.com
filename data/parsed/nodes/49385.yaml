      <p><em>Are you confusing it with sof pasuk?</em></p>
      <p>No. One of the ways you can distinguish siluq from meteg is that siluq will always be followed by a sof pasuq. Siluq always occurs on the last word of a verse, so if you see what looks like a meteg on the last word, it will actually be a siluq unless there is another accent. [There are a few cases of polysyllabic words that have both a meteg and a siluq; the latter, of course, is the one nearest to the end of the word.] The siluq is specifically a cantillation mark: it indicates a melodic ending to be sung.</p>
      <p><em>Accoording to your definition of meteg, how then is a secondary stress indicated?</em></p>
      <p>By a meteg. In the cantillation system, the meteg is used to indicate secondary stress. Primary stress is indicated by one of the other accents -- which one depends on the melody --, but where a number of unaccented syllables follow in succession, the meteg is used to signify a secondary stress, which musically is a rhythmic device.</p>
      <p>[Note that I only know about Biblical Hebrew. I don't know how stress works in normal spoken Hebrew or understand what role meteg plays in the vocalisation system other than in cantillated text.]</p>
      <p>Again, I strongly, strongly recommend Jacobson's book. It comes with an audio CD, so you can hear the correct interpretation of the different 'trops'.</p>
