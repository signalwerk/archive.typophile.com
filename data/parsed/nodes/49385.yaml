    html: <p>I suspect that the image in the first post of this thread contains something that I have recently begun searching for. The sample labelled "Judisch-Deutsch" appears to be an example of the <em>mashkit</em> or <em>vayber-taytsh</em> style of printing, which resembles, but is not identical to, the style called "Rabbinic" or "Rashi" - but while the latter is used for commentaries in texts like the Talmud, usually for Aramaic text, the former was used - up to the eighteenth century, but not much beyond that - for texts in Yiddish.</p>
