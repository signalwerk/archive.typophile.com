      <p>&gt; Right now there’s not a single revival that is close to the original.</p>
      <p>I also think this conclusion is accurate. Considering the specimens that we have before us from his book, which are for large size body text, we actually don't have cpmparables.</p>
      <p>Apparently, Frank made his design to typeset large Biblical texts, or Hadagas. The other venders aim were rabbinic commentaries, or political discussions, or literature in general, that appears at smaller text sizes, or even have very small footnotes.</p>
      <p>There are multiple weights which I have from Linotype, 9, 10, and 12 point sizes. Vaityper's version is even lighter, and very suitable for small text sizes. We don't find a 18 pt. or 24 pt. FrankReuhl from Linotype.</p>
      <p>Each one (the 9, 10, and 12 point sizes of Linotype's FrankReuhl) is very different from its siblings. 9 in particulars has major differences. </p>
      <p>I also has from a very old job a revival of FrankReuhl from an artist commissioned to draw very large letters from an unknown machine. There also an interesting design that is unique to all other versions of FrankReuhl from other venders, except one of the 3 point sizes from Linotype (the nine) [maybe, it was drawn from the nine].</p>
      <p>I also have another set of drawings that I was told was drawn from an old Linotype machine, where Frankruehl is somewhat crossed in design with Romm. I haven't revived it yet.</p>
      <p>In these two versions (Linotype's 9, and the very large drawings) the bottom of the right side is lifted off (in part) from the baseline. It looks like a person standing upon his toes, with his heel lifted off the ground.</p>
      <p>I debated whether I should include this detail. A professor at RIT (Rochester Istitute of Technology, a leader om printing technology and type design studies) suggested that this peculiarity in design was like the design of serifs, to allow ink to gather during the print process. He reasoned that sonce this was no longer an issye, I should abandon thos aspect of the design.</p>
      <p>I was unsure, so I left it in the Varityper revival. Later, I found ot only in the small 9 point aleph of FrankReuhl from Linotype.</p>
      <p>Perhaps, the professor was correct, but his conclusion in my view was not. What do you think?</p>
      <p>[My scanner is suffering from a paper jam in the printer (its an all-in-one), so it'll be awhile until I can scan and post.]</p>
