      <p>Spell checkers are tools used to correct mistakes when you type in a text editor. There are spell checkers for modern Hebrew, for instance HSpell on which <a href="http://www.cs.technion.ac.il/~danken/" rel="nofollow"><strong>Dan Kenigsberg</strong></a> (Ph.D. in computer sciences) has worked. </p>
      <p>My knowledge of biblical hebrew is very limited but it is my feeling that the string "כי בליל חמיץ יאכלו" might have occurred in the Tanakh and the "כי" would not help deciding to what dictionary entry בליל corresponds.</p>
      <p>As for identifying "certain shvas", some may be easier than others indeed. What's the need to identify the easy ones if the reader should already know? And how do you decide the sheva under the bet in בליל without looking up the dictionary? </p>
      <p>Michel</p>
