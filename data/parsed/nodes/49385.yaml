      <p>Michel,</p>
      <p>Thanks for the references. </p>
      <p>I knew I saw it in a few places in Genesis: "v'yave'k'", meaning "and he cried", from the Hebrew verb for "to cry", "liv'coat". </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/vayave_k_3602.jpg"></div><br>
      .<br>
      .<br>
      The first two letters of the 3 letter root are each veis, the second letter of the Hebrew alphabet. Seemingly, the third letter of the 3 root letters, hei, falls away, in this case, and is represented by a dagesh point in the second letter of the 3 letter root, the final chaf. (Perhaps, the dagesh point is representative of an indirect pronoun, referring to the cheek upon which Joseph cried). So, a shva appears below, and a dagesh above it.<p></p>
      <p>I wonder what makes this Hebrew text "from some Karaite tanakh". </p>
      <p>I know the Christian Bible and the traditional Jewish tanach has some minor differences, mainly in the nikkud and taamim. </p>
      <p>There two versions of the traditional Jewish tanach. In one version the hei and the end of a word appears which is logical, grammatically correct, and to be expected. In the other version, accepted by the Chassidic groups, the hei is replaced with an aleph, which is illogical, seemingly grammatically incorrect, and not to be expected. </p>
      <p>However, in one of the oldest copies of a Sefer Torah scroll, which existed in the famed Maharal of Prague's synagogue, the oldest standing synagogue until Nazis destroyed it, in a certain word an aleph appeared at its conclusion and not a hei. This would indicate that the Chassidic tradition is correct, since it has historical verification.</p>
      <p>According to Jewish mystical texts, this difference is more than just scholarly. The entire Five Books of Moses (Chumash) spells out G-d's name. The entire text, from the first letter, an aleph, until the last, a lamed, and all the letters in between, is precise. So, it's meaningful and significant whether it's an aleph or whether it's a hei.</p>
      <p>*   *   *</p>
      <p>If you notice, in my sample, both the dagesh and the shva is lifted up above the baseline. This is for purely aesthetic purposes, as having the dagesh lifted up, and the shva below, a large gap if white space exists between then, plus when taam and meteg appear, there is very little room to place them, plus there is a blatant inconsistency between the occurrence when no dagesh appears and when a dagesh appears.</p>
