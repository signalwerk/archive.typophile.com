      <p>A very old design is called "Rashi".</p>
      <p>Rashi is an acronym for Ra-Shlomo-Ishaki, a great medieval Torah scholar. Rashi composed the great commentaries on the Bible and the Talmud, that have never been surpassed to this very day.</p>
      <p>Tradition has it that his birth was miraculous, and he was sent to this world by G-d to compose these two tremendous commentaries.</p>
      <p>At the time, or shortly thereafter, the rabbis insisted that the Bible and the core of the Talmud should be ;resented differently than the commentaries. The Bible and the Talmud were drawn or typeset in square letters like Romm Vilna square letters by the Sephardic Jews or like the original source of Koren square letters by the Ashkenazic Jews, and the commentaries round narrow like Rashi round letters by the Ashkenazic Jews or like the unnamed round letters by the Sephardic Jews, as seen in the Dead Sea Scrolls (Go Hebrew calls Rambam, after Maimonides).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gh rashi_3467.jpg"></div><p></p>
