      <p>I now have read the article by William Chomsky, and indeed the part Michel quotes does relate to modern Hebrew. But there is more which I find very enlightening. Chomsky--by the way the father of the great linguist and US government hater, Noam Chomsky--concludes: </p>
      <p>"Both the historical evidence and actual usage seem to point to the conclusion that the rules about the vocal and silent shewa in our grammatical texts and taught to our pupils are either superfluous or unfounded."</p>
      <p>These arcane rules were invented or divined by David Kimhi (~1160-1235 CE). Before this the description of use of the shva na was that it occured at the first letter of a word, the second of two letters with shva under them, or with two identical consonents. That's it. And as far as any Hebrew as actually spoken--either ashkenazi or sfaradi--the use of the shva na on the first letter of a word is actually restricted to the 'liquid consonants', ylmnr (yod, lamed, mem, nun, resh) and the prefixed prepositions and conjunctive vav. The actual rules of spoken Hebrew seem to me as logical and natural as the Kimhi rules seem arcane and impossible. </p>
      <p>The rules David Kimhi invented were then taken up by other pedants--er, grammarians--both Jewish and Christian. And they are now used to torture Israeli high school kids, who then proceed to immediately and "consistently ignore these rules in their normal conversation... This is the fate of all artificial and non-functional rules or learning."</p>
      <p>My conclusion about transliteration is that the best way to go is not to follow "scientific" rules, which are based on the Kimhi grammar, but rather those of modern Hebrew, which in all likelihood have held sway for a very long time, if not always.</p>
      <p>ps. Looking again at Israel's project of getting a special mark for kamatz katan and shva na to substitute from syntax only, I've got a new take. I see in Seow's grammar that it is "rare" that a syllable ending with a final letter or letter with a shva under it is "open". That means that you would rarely go wrong with an automatic substitution of a kamatz katan for a kamatz in such situations. So this could be done. Also you could automate from syntax the simple rules of spoken Hebrew for the shva na. But to automate the Kimhi rules from syntax alone--forget about it.</p>
    html_clean: |-
