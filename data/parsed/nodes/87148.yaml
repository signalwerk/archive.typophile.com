  html: |-
    <p>Okay: I admit right upfront that I am a curmudgeon. I can see no point whatsoever in anxiously anticipating a whiff of Ashton Kutcher's latest brain-fart on Twitter. I just don't get it. I do the crossword puzzle in <em>The Washington Post</em> every day. With a pencil. And no Google. Thank God, the Post finally realized that its crossword puzzlers were presbyopic geezers like me, and increased the size of the puzzles and the clues. Hey, you kids! Get off that roof!</p>
    <p>Anyhow, the world isn't going to respect my wishes not to be sucked into the milieu of up-to-the-minute. Social Media are here to stay, so I guess I have to get with the program or eventually disappear. How many other foundry/people are using Social Media as part of their overall marketing effort? How important is it to the overall effort? How much time to have to devote to it on a daily basis? And what in the world do you say on a regular basis in 140 characters or less that either has any relevance to what you do, or interests anyone who chooses to follow your tweets?</p>
    <p>Inquiring minds want to know. Well, okay: one cranky old fart is curious…</p>
