    html: <p>Twitter is, in general, even less private than facebook, as unless you restrict, anyone can "follow" you. You can take steps to wall yourself off in either, but that kind of defeats the concept. I think most adults, at any rate, are pretty circumspect about what they share publicly. But there is a trade-off in less privacy for more contacts. But yes, some people have a distaste for less privacy and others—apparently a lot of others—don't mind.</p>
