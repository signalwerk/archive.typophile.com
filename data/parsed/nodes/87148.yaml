    html: <p>If you're curious about Twitter just try it. It doesn't usually bite, and if you end up hating it more than you find it useful you can just leave again. The thing is, it is its own form of communication, which is hard to describe outside of experiencing it oneself. It takes some time to figure out good signal-to-noise strategies, dos and don'ts, as well as whom to follow, but I for one find it very useful for quickly getting ideas of who's up to what, etc. And yes, many type people are on Twitter. <a href="https://twitter.com/#!/gabrowitsch/type-designers/members" rel="nofollow">Here for instance is Ivo Gabrowitsch's list of type designers on Twitter (231 and counting).</a></p>
