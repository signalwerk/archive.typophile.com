    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 26.Oct.2009 10.58am </div>
      <p>’s-Hertogenbosch, the Netherlands, 26 October 2009</p>
    <p>Frank Blokland reports:</p>
    <p>The second Dr. Peter Karow Award for Font Technology &amp; Digital<br>
    Typography has been awarded to Thomas Milo for the development of the<br>
    ACE layout engine (the heart of the Tasmeem plugin for InDesign ME)<br>
    for Arabic text setting.</p>
    <p>The Dr. Peter Karow Award for Font Technology &amp; Digital Typography is<br>
    presented once per five years to a person who makes an exceptional and<br>
    innovative contribution to the development of digital type and<br>
    typography related technology. The first Dr. Peter Karow Award was<br>
    presented to Dr. Peter Karow himself at the third DTL FontMaster<br>
    Conference at Castle Maurick in 2003. So, in this case it took<br>
    actually an extra year before the jury (Dr. Peter Karow, Dr. Jürgen<br>
    Willrodt, Peter Rosenfeld and Frank E. Blokland [chairman]) came to an<br>
    unanimous decision for the second award.</p>
    <p>Thomas Milo and his company DecoType developed with ACE, which is an<br>
    acronym for ’Arabic Calligraphic Engine’, new advanced technology for<br>
    Arabic text setting, which needs a far more sophisticated approach<br>
    than for instance the Latin script, based on a thorough analysis of<br>
    the Arabic script. Not only served Milo’s typographic research as the<br>
    fundament for the ACE technology, clearly it also formed a basis for<br>
    the development of the OpenType format, although this is a less known<br>
    and acknowledged fact.</p>
    <p>For more information and to give your own congratulations: <a href="http://typophile.com/node/63486" title="http://typophile.com/node/63486">http://typophile.com/node/63486</a></p>
