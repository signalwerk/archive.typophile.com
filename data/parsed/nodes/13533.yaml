  html: |-
    <p>In 2001, <a href="/node/13534" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ray Larabie</a> launched Typodermic, his commercial font foundry with a small selection of fonts at very reasonable prices. “As long as the ideas keep coming,” Ray says he will continue making new fonts. Designing at his home office near, appropriately, Fonthill, Ontario, he now works on fonts full-time. “I’m lucky to be doing something I enjoy everyday,” is how he describes himself. His wife, Rina, runs the business, writes ad copy and creates graphics for his new font&nbsp;releases.</p>
    <p><a href="http://www.typodermic.com/">http://www.typodermic.com/</a></p>
