    html: <p>I can't write Python scripts myself yet, although I can effectively edit existing ones, but I have paid Adam Twardoch to write a number of scripts over the past few years and these scripts have saved me many hours of work. <br> <br>Which reminds me ... Adam, I'm still waiting for my composite management script.</p>
