    html: <p>If you are a complete beginner at programming, <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0201709384/qid=1073023922//ref=sr_8_xs_ap_i0_xgl14/103-7338635-6651039?v=glance&amp;s=books&amp;n=507846">this book</a> is quite a good textbook. It teaches basic concepts of programming and introduces you to Python at the same time.</p>
