    html: "<p>I've been doing one major project in Python/FL, so I'm not as good as Adam. <br>But eventually I see myself doing a lot of stuff for a lot of people with it. <br> <br>And I love the power, but: <br>1) I don't like the syntax/structure, at least in terms of FL. <br>2) It seems unruly. Not really buggy, but unruly, like Director Lingo (although not as complex). You have to get to know it over time. <br> <br>Miguel, if you're considering taking the plunge, there's really one big question: your level of previous programming experience. <br> <br>hhp <br></p>"
