    date: null
    date_raw: null
    votes: null
    html: <p>I've started using scripting extensively in FL. It's great. I use it for metrics adjustments, adding anchors, auto-generating multiple fonts from a MM FL doc, and countless other tasks (Ever needed to rename a bunch of glyphs? Try python's regular expression module.) <br> <br>Here is a <a href="http://www.ibiblio.org/obp/thinkCSpy/">free online book</a>, also for beginning programmers, that uses python. It's good, even if you've had some experience. Another great resource is the Python web site. They have some pretty simple <a href="http://python.org/doc/2.2.3/">tutorials</a> that should get you started in python. For the FontLab interface, the <a href="http://dev.fontlab.net/flpydoc/navi/main.html%20">Unofficial FontLab/Python API Reference</a> is invaluable. Of course, read the archive of the <a href="http://mail.letterror.com/mailman/listinfo/fontlab-scripting">FL scripting list</a>. <br> <br>At any rate, if you spend any time at all in FontLab, it is definitely worth your while to learn Python scripting. You will be amazed at how often you write two or three lines of code in the edit macro panel. Your own scripts are much more valuable than anything you might find online, as they will fit perfectly into your workflow. You can save hours this way. (You can also waste countless hours trying to figure things out, when it would have been faster to do it manually, but it's always funner to learn. That's the computer programmers motto, 'power through lazyness'. They'll work all day to avoid 10 minutes of tedious work.)</p>
