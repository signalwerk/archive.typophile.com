    html: |-
      <p>I am in a process of making a <a class="freelinking external" href="http://typophile.com/node/83674" rel="nofollow"> connected script</a> and I encountered no problems with overlapping characters. The only requirement is for the paths of your glyphs to be in the same direction. </p>
      <p>Same goes for overlapping paths in an individual glyph.</p>
      <p>There is indeed a problem if you want to visualize the outlines of the font, but any software that lets you do that must also provide you with an option to merge the separate forms into one (as in the Q&amp;A example above). In Adobe Illustrator that is done with the "pathfinder" option</p>
    html_clean: |-
      <p>I am in a process of making a <a class="freelinking external link-kept" href="/node/83674/" rel="nofollow"> connected script</a> and I encountered no problems with overlapping characters. The only requirement is for the paths of your glyphs to be in the same direction. </p>
      <p>Same goes for overlapping paths in an individual glyph.</p>
      <p>There is indeed a problem if you want to visualize the outlines of the font, but any software that lets you do that must also provide you with an option to merge the separate forms into one (as in the Q&amp;A example above). In Adobe Illustrator that is done with the "pathfinder" option</p>
