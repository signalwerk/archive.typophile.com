    date: null
    date_raw: null
    votes: null
    html: |-
      <p>Here is what I get from the <a href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" rel="nofollow"><strong>Adobe Type 1 Font Format</strong></a> spec.</p>
      <p><cite>If two filled subpaths in a character overlap, there may be no problem when the character is filled. However, a Type 1 font program can also be stroked along its outline when the user changes the PaintType entry in the font dictionary to 2. In this case, overlapping subpaths will be visible in the output; this yields undesirable visual results in outlined characters. Always construct the character paths with outlined output in mind.</cite><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/overlapping_5993.png"></div><br>
      I don't know who uses stroked characters but let me tell you that in mathematical typesetting, if pieces of a large mathematical symbol do not overlap, the result may look like crap on screen, which I find that quite annoying. And I wonder, is it is possible at all to make a script font that could be stroked?<p></p>
