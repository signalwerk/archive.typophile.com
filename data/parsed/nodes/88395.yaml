    <p>Hey people, </p>
    <p>Is there any reason (technicalities wise) not to make glyphs overlap (negative kerning/spacing) in a script-like situation (Italic SwashCap with a lowercase italic). I mean, I've seen prints where the overlapping part becomes white, but I'd think you need overlapping parts in a script font, so it should be possible right?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pictur6_4546.png"></div><p></p>
