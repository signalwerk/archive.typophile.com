      <blockquote><p>My take would be that each glyph is an instruction for the PS or TT-interpreter, and thus that won’t be interference from glyph to glyph.</p></blockquote>
      <p>That seems to be true for text editors, though I'd like to see it explicitly specified. On the other hand, Inkscape (and probably Adobe Illustrator) keeps track of the winding direction. Here, I installed and used in Inkscape a (postscript otf) font with a small o that winds opposite to the small ô. If I put the o on top of the ô, there is no problem,  they merge nicely and give the ô on the left. If I copy them and appy path &gt; combine on the copy, I get the ô on the right hand side; the two glyphs o almost cancel.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ooo_5048.png"></div><p></p>
