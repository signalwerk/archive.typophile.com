      <p>@Hrant:<em> that's an unfair -if convenient- blanket statement.</em></p>
      <p>It's accurate. Professional organizations such as the AIGA and GDC don't just frown, they prohibit members from spec work.</p>
      <p>I consider all type competitions (including type annuals that request submissions) to be spec work, because they require type designers to create a specimen. And they don't even reimburse winners for the cost of doing that.</p>
      <p>I was on Creative Review's mailing list for its new type annual, to which I replied,</p>
      <p>"Thank you for your interest in my work.<br>
      However, I am not disposed to compete for the privilege of providing<br>
      your publication with free content."</p>
      <p>...and was subsequently "followed up on" several times with comments such as,</p>
      <p>"I am aware that previously there was an issue with the fee for an entry,<br>
      therefore if you are interested in submitting a typeface or typefaces we<br>
      would be willing to offer you a further discount."</p>
      <p>The ethics of not doing spec work can seem out of place in the digital era.</p>
      <p>**</p>
      <p>To return to the topic, even if a client commits to a custom solution, the first step is often narrowing the focus of the brief by seeing which off-the-shelf designs come close to the desired tone and style. </p>
      <p>I'm having difficulty visualizing a vaulted-cellar bar as being either upscale or contemporary, but suggest you set up "R55" in the text field and search at MyFonts under the keyword "luxury", "upscale", or "contemporary".</p>
      <p>- Nick Shinn, MGDC</p>
