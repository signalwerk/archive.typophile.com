      <p>This is a mischaracterization (and I'm sure you're smart enough -and a good enough businessman- to know that). Although it was indeed a competition (meaning one can lose) it's basically a marketing gambit: pay a small fee for a chance to be seen.</p>
      <p>When they approached me, it was a no-brainer (even more so than when they ran their contest in 2006). And I just found out that I'm included! Ergo: I get some superbly placed advertising for dirt cheap.</p>
      <p>On the other hand, if I were just-another-Latin-foundry I would have been much more tentative - since my chances of being included would have been much lower. But still, one has to have a pretty low opinion of one's own work to think $70 is too much.</p>
      <p>The only competitions that chap my hide are the ones that charge you for winning!  :-/</p>
      <p>hhp</p>
