      <p>These are the specs:</p>
      <p><em>For each typeface you are submitting please provide a full character set. This should at minimum consist of complete upper and lower case alphabets and numerals 0 – 9 but, in the case of extensive Open Type faces, please also submit a representative sample of extra characters. For Arabic or other non-Latin faces where character sets may vary, please exercise discretion and submit what you consider to be a sufficient character set for the judges to be able to make their choice. These should be supplied at 48 point, as should, as a bare minimum, the sample sentence The quick brown fox jumps over the lazy dog. Non-Latin entries may substitute a similar or equivalent phrase. We would also encourage entrants to submit additional samples to show their typeface in use. You may include headlines, short or long passages of text, or sample layouts showing the typeface in use in eg advertising or publications. With Display or Bespoke entries where entire upper and lower case alphabets or numeral sets do not exist, please supply all the characters available. If the typeface is to be used to set text, please also submit 200 words of dummy text of your choosing set in the following: 8/10 pt, 10/12pt, 12/14 pt. This applies to all Text entries and may also apply to Bespoke or Non-Latin typefaces. Each entry should be set in 100% black on A3 and be provided as a separate 300 dpi PDF, with a maximum file size of 5mb, with the name of the typeface clearly marked on each page.</em></p>
      <p>Why don't they level the playing field and provide a template?<br>
      Because that would be too boring, their book would look like a type catalog.<br>
      So this way they can have a bit of a format, but enough variety of creative input to make it slightly more interesting.</p>
      <p>These publishers are cheap, they knew enough about me to solicit my entry, but couldn't be bothered to have a look-see if any of my faces, all of which have copious PDF specimens, were suitable for their publication. That would have been too much like work, and they would have had to pay whoever was doing it, e.g. give the selection committee a curation fee, rather then just paying them off with the publicity and kudos of being important enough to pass judgment on their peers.</p>
      <p>I can understand that the publishers might think this is the same model as for other creative awards, but for ads and brochures etc., those don't have to be specially made up. </p>
      <p>Typographica has a good plan for its "fonts of the year"; ask each curator to pick one typeface and write a few words about it -- not too onerous a task -- and then ask the chosen foundry to prepare a specimen, with the guarantee of publication.</p>
      <p>@Hrant: <em>If you do the math it becomes clear that your chances of being selected have to be quite low for the gambit to not be worth it.</em></p>
      <p>I prefer not to gamble on this sort of thing. Besides, there are other reasons I don't do competitions, apart from value for money.</p>
    html_clean: |-
      <p>These are the specs:</p>
      <p><em>For each typeface you are submitting please provide a full character set. This should at minimum consist of complete upper and lower case alphabets and numerals 0 – 9 but, in the case of extensive Open Type faces, please also submit a representative sample of extra characters. For Arabic or other non-Latin faces where character sets may vary, please exercise discretion and submit what you consider to be a sufficient character set for the judges to be able to make their choice. These should be supplied at 48 point, as should, as a bare minimum, the sample sentence The quick brown fox jumps over the lazy dog. Non-Latin entries may substitute a similar or equivalent phrase. We would also encourage entrants to submit additional samples to show their typeface in use. You may include headlines, short or long passages of text, or sample layouts showing the typeface in use in eg advertising or publications. With Display or Bespoke entries where entire upper and lower case alphabets or numeral sets do not exist, please supply all the characters available. If the typeface is to be used to set text, please also submit 200 words of dummy text of your choosing set in the following: 8/10 pt, 10/12pt, 12/14 pt. This applies to all Text entries and may also apply to Bespoke or Non-Latin typefaces. Each entry should be set in 100% black on A3 and be provided as a separate 300 dpi PDF, with a maximum file size of 5mb, with the name of the typeface clearly marked on each page.</em></p>
      <p>Why don't they level the playing field and provide a template?<br>
      Because that would be too boring, their book would look like a type catalog.<br>
      So this way they can have a bit of a format, but enough variety of creative input to make it slightly more interesting.</p>
      <p>These publishers are cheap, they knew enough about me to solicit my entry, but couldn't be bothered to have a look-see if any of my faces, all of which have copious PDF specimens, were suitable for their publication. That would have been too much like work, and they would have had to pay whoever was doing it, e.g. give the selection committee a curation fee, rather then just paying them off with the publicity and kudos of being important enough to pass judgment on their peers.</p>
      <p>I can understand that the publishers might think this is the same model as for other creative awards, but for ads and brochures etc., those don't have to be specially made up. </p>
      <p>Typographica has a good plan for its "fonts of the year"; ask each curator to pick one typeface and write a few words about it -- not too onerous a task -- and then ask the chosen foundry to prepare a specimen, with the guarantee of publication.</p>
      <p>@Hrant: <em>If you do the math it becomes clear that your chances of being selected have to be quite low for the gambit to not be worth it.</em></p>
      <p>I prefer not to gamble on this sort of thing. Besides, there are other reasons I don't do competitions, apart from value for money.</p>
