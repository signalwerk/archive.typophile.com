    html: |-
      <div class="comment-spam-body"><p>I'm not certain about the legitimacy of Augustus Regular.<br>
      For a commercial product it might be prudent to purchase Augustea and remove the vectors that make it an open version.<br>
      UPDATE: I just checked the vector outlines. Augustus is very sloppy compared to Augustea. The Linotype version of Augustea has about 388 glyphs, many special characters and multilingual support. In this case you get what you pay for.<br>
      Don</p>
      </div>
