      <p>Similar to <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/meridien/?refby=bowfin" rel="nofollow">Meridien</a> by Adrian Frutiger.</p>
      <p>These serifs are very distinctive, but not common. Your choice of Monumenta was about the only other I noticed with these serifs, and letterforms. This makes me wonder if some serif 'surgery' was done to make them look sharper. Are there any other words you have seen using this font?</p>
      <p>- Mike Yanega</p>
