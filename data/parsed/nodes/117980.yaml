      <p>I have the Image Club "Aurea" and had noted that it was based on Augustea. Good find Dick. </p>
      <p>It was also in the Expresiv Ornate collection as "Naushen", and I have it in the Serif Font ID Guide as "Nova Augustea", which also has a lower case. The Jaspert book "Encyclopaedia of Type Faces" shows Augustea as all caps, Augustea Open, also all caps, and Nova Augustea with a lower case.</p>
      <p>- Mike Yanega</p>
