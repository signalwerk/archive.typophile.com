      <p>Patty - I was a little perplexed by the FF Nexus release as well, but it slowly became clear. The family was developed together from the ground up, resulting in a much more compatible set of fonts. I am still a huge FF Scala fan, but FF Nexus serves well if congruous slab, sans, serif, and mono variants are all needed.</p>
      <p>More here: <a href="http://www.fontshop.com/virtual/newsletters/ff35/" title="http://www.fontshop.com/virtual/newsletters/ff35/">http://www.fontshop.com/virtual/newsletters/ff35/</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/specimen_ffnexus_5598.gif"></div><p></p>
