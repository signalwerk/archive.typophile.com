    <p>Hi All,<br>
    I'm after some advice on a job we're doing at the moment -<br>
    Our client is opening a venue with a modern-deco feel and we are trying to find a suitable typeface as their corporate font.<br>
    We love Scala Sans - however for several reasons we are unable to use that exact face - can anyone suggest an alternate face? I particularly love the crossed 'W' and anything that gives a sophisticated feel would be great.</p>
    <p>Many Thanks,<br>
    Paul.</p>
