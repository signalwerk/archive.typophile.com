    html: |-
      <p>Bristol (1929), Carlton (1929) and Savoy (1936) were drawn by Dick Dooijes (under supervision of Sjoerd Hendrik de Roos) for Lettergieterij Amsterdam. They were based on Broadway by Morris Fuller Benton.</p>
      <p>Photo-Lettering Inc. made a film font of Bristol (and a outline version called Bristol Open).</p>
      <p>The now defunct Bright Ideas made a digital version of Bristol called Beardsley (they added a lowercase to the typeface).</p>
      <p>Here are some specimen:<br>
      <a href="http://home.planet.nl/~voogt053/Bristol.bmp" title="http://home.planet.nl/~voogt053/Bristol.bmp">http://home.planet.nl/~voogt053/Bristol.bmp</a><br>
      <a href="http://home.planet.nl/~voogt053/Carlton.bmp" title="http://home.planet.nl/~voogt053/Carlton.bmp">http://home.planet.nl/~voogt053/Carlton.bmp</a><br>
      <a href="http://home.planet.nl/~voogt053/Savoy.bmp" title="http://home.planet.nl/~voogt053/Savoy.bmp">http://home.planet.nl/~voogt053/Savoy.bmp</a></p>
