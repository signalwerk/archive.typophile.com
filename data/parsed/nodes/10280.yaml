  - id: 65198
    user: 1011
    date: 2003-07-28T15:06:00
    date_raw: 28 Jul 2003 — 3:06pm
    votes: null
    html: "<p>Eduard: <br> <br>The most basic steps for doing this in Fontographer are: <br> <br>1) Open the PostScript file in Fontographer <br>2) Import the metrics from either the bitmap suitcase or the AFM file <br>3) Generate a Windows PostScript file <br> <br>There may be some changes needed to the font family and style information in order for multiple weights to appear under Windows as a unified family, but this will depend on the typefaces you are working with. <br> <br>That's about it, really...</p>"
    html_clean: "<p>Eduard: <br> <br>The most basic steps for doing this in Fontographer are: <br> <br>1) Open the PostScript file in Fontographer <br>2) Import the metrics from either the bitmap suitcase or the AFM file <br>3) Generate a Windows PostScript file <br> <br>There may be some changes needed to the font family and style information in order for multiple weights to appear under Windows as a unified family, but this will depend on the typefaces you are working with. <br> <br>That's about it, really...</p>"
