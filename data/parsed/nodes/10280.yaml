    votes: null
    html: <p>I made the jump from Fontographer after 6 years to Font Lab primarily for the Mac OSX compatibility. However, I have since found Font Lab to be a far more powerful program but one with a steep learning curve. If for no other reason, try out Font Lab for its OpenType support. <br> <br>With Macromedia continually referring to a Fontographer update as being "on hold" I felt I had to move on.  <br> <br>I believe Font Lab is still avaialbe to registered users of Fontographer for a significant discount (it was in January when I got mine). <br> <br>I am in the redraw/metrics stage of my first typeface with Font Lab, so I'm still a newbie with it. Others might have more info.</p>
