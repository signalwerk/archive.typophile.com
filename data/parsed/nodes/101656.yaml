    <p>Recently Nick Shinn proposed <a class="freelinking external" href="http://typophile.com/node/101331" rel="nofollow">(here)</a> a Greek version of MyFonts, in order to make Greek fonts better accessible for users of Greek. I found that a very interesting suggestion and asked John Collins of MF, if this vision could become reality.<br>
    He answered, I take the liberty to cite from his message: “we have not been able to convince ourselves that the cost of making MyFonts available in any other languages would produce a reasonable return on the investment. If that changes, we will of course move in that direction.”<br>
    As reasonable as this sounds, I still wonder if there could be a chance to see a hellenic MyFonts site come into life. Or perhaps, something similar to <a class="freelinking external" href="http://www.myfonts.de/" rel="nofollow">MyFonts.de</a> which is a kind of MF digest journal adressing German readers.<br>
    There are currently over 200 fonts listed when the tag ‘Greek’ gets clicked. I believe they would sell more if they would be visible in a Greek language environment. It’s not just for Greeks in Hellas or Cyprus but also for the many scholars in Greek studies worldwide.</p>
    <p>Last but not least, the same question arise for Cyrillic; maybe for other script systems as well in the future?</p>
