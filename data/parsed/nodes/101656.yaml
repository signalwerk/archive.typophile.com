      <p>It's like choosing a foreign language to learn for doing business: you learn one that has an affluent population with low penetration of the languages you already know. So for example I'm sad to say that an Armenian version of MyFonts doesn't make sense in at least three ways: we don't spend a lot of money on fonts; we all know a second -major- language; and we almost all know a <em>third</em> language that's bigger than ours. :-)  And frankly a Greek version of MyFonts doesn't make a lot of sense to me either.</p>
      <p>hhp</p>
