    <p>Hi Everyone,<br>
    I was wondering if you could help me with a typeface for a project.  I did a logo for a project and was all set to go with it and then the name changed.  I attached the previous logo.<br>
    The new name needs to have capital and lowercase letters.  I was wondering if anyone could suggest a good font for this.   I like Foundry Gidnnik in medium or bold but I am lookig for something  a bit more tough and militaryesque.  The audience is the military and the feel for the project is "security and stealth" hence the first project name.</p>
