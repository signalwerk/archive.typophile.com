    html: |-
      <p>Microgramma/Eurostile has the same basic shape (in bold extended), but includes a lowercase (no stencil cutouts, however)</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/eurostile/bold-extended-2-63893/" title="http://www.myfonts.com/fonts/linotype/eurostile/bold-extended-2-63893/">http://www.myfonts.com/fonts/linotype/eurostile/bold-extended-2-63893/</a></p>
      <p>To me, "tough" and "stealth" seem mutually exclusive... I could see "stealth in a VERY light weight sans serif, but "tough" usually tends toward somwthing like Goudy Oldstyle extrabold; you might compromise on something like Glaser Stencil (<a href="http://www.myfonts.com/fonts/ef/glaser-stencil/" title="http://www.myfonts.com/fonts/ef/glaser-stencil/">http://www.myfonts.com/fonts/ef/glaser-stencil/</a>), there's a "rough" version here too.</p>
