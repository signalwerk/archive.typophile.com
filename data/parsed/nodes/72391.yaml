      <p>Have a look at our collection and perhaps you’ll appreciate <a class="freelinking external" href="http://www.boldmonday.com/en/nitti/" rel="nofollow">Nitti</a>, a clean monospaced grotesque by Pieter van Rosmalen. Or if you’re looking for a more humanistic approach check out <a class="freelinking external" href="http://www.boldmonday.com/en/flex/" rel="nofollow">Flex</a> by Paul van der Laan.</p>
      <p>Cheers!</p>
