    html: |-
      <p>Sorry to keep replying to my own thread, but I guess the ability to edit one's post goes away after a bit.</p>
      <p>Here is the most recent effort on this logo overhaul.  A few of my own notes:</p>
      <p>1.  I think that extending the T arm and hooking it into the H whilst dropping the H crossbar reduces a lot of the emphasis that the H used to have, while retaining the look.</p>
      <p>2.  The extended arm on the T is also suggestive of a construction square.</p>
      <p>3.  The lowercasing of the I was done because I felt it was getting 'lost' amidst all that T action going on right next to it.  It also invokes an umlaut. While we all know there's no such thing as an umlaut I in the German language, I wanted to reference the Germanic origin of the name (which is a family name).</p>
      <p>4.  The overall color of the logo was changed to red which I feel is a much stronger color than blue and plays into the Constructivist/construction angle of it all.</p>
      <p>Again, thanks for any criticism that you might have.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo New_6720.jpg"></div><p></p>
