    <p>I have a logo here that is for a decent-sized real estate development and construction company.  The idea is to give something that is somewhat industrial in nature and from which the T can be used on its own as a signature mark.  Simple and clean is preferred over ornate and complex.  Thoughts?  Suggestions?</p>
