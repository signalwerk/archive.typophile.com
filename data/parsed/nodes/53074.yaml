      <p>I would suggest looking more closely at the type and trying other ideas/typefaces. Perhaps look at some vintage American industrial or Constructivist logo designs for inspiration and guidance. </p>
      <p>When looking at your spacing–don't you find it queer that the two Ts in the middle draw so much attention? It looks like they are meant to add meaning with the strong counter shapes they produce, when it's actually just a case of you not putting thought into the spacing between each letter.</p>
    html_clean: |-
