    html: <p>I also want to add that one typeface that I tried and kind of like is Neutraface.  That said, one sees this *everywhere* these days, so I'd like to avoid something that might be cliche.  The lowered crossbar on the H is something that provides some emphasis and might be a way that I can reduce the difference in height between the T/H and the other characters.  Do you all feel the same way about Neutraface getting played out?  If so, I may find my way with a different typeface and lower the crossbar myself as I manually edit the logotype if I can find a way to do this without it looking 'off'.</p>
