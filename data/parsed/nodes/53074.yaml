      <p>The font in the Browning logo has big slab serifs that form a strong horizontal element to unite the letters into a single shape (important here because "Trittenbach" is such a long name). You've achieved the same effect by spanning the letters with the cross stroke of the T.<br>
      It appears that the T and H are not only bigger than the other letters, but proportionately thicker. How would it look if you reduced the stroke weights to match the letters in the middle?</p>
