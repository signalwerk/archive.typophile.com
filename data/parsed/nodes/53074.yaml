    html: |-
      <p>First off, thanks for the thoughtful feedback.  I do want to clarify something that probably didn't come across in the original post - the logo shown is an existing logo which I am trying to overhaul into something with a more professional aesthetic.  Not that this point matters a whole lot, but in these situations it is sometimes good to keep some resemblance to the original to provide a mental link for those who knew it.  So, perhaps this is something to keep in mind.</p>
      <p>The kerning point is a good one, and I agree wholeheartedly.  The logo I showed was first done about four years ago, and I will fully admit that I used to be pretty naive with respect to that sort of thing.  I'm glad it came up though, because the issue has been on my list of 'fixes' and I appreciate the fact that others feel the same.</p>
      <p>As for the emphasis on the H, it was cribbed from this logo here:  <a href="http://upload.wikimedia.org/wikipedia/en/5/5a/Browning.svg" title="http://upload.wikimedia.org/wikipedia/en/5/5a/Browning.svg">http://upload.wikimedia.org/wikipedia/en/5/5a/Browning.svg</a></p>
      <p>I kind of like the quirky turn-of-the-century industrial aspect that it represents, and would like to keep it in the overall design if possible.  That said, if I or someone else comes up with a better way, that's great too.</p>
      <p>The Constructivism comment is great - I didn't know the style by that term, but that is exactly the sort of thing I had in mind for this.  Thank you so much for educating me on that bit of information :)</p>
      <p>With all this in mind, can salisae or anyone else suggest some specific typefaces or concepts that would be worth applying?  Please forgive my lack of depth in this specific subject area; I am trying hard to learn.</p>
      <p>Thanks again for all your help.</p>
