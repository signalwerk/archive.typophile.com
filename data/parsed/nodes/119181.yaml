      <p>I don't know the sinhala script nor where to find tests. The font Bhashitha looks interesting because it contains both AAT and opentype tables; Malithi contains only opentype tables. Both fonts may work fine with Adobe applications but Bhashitha appears to also work with TextEdit. Here is a grab from textedit; I just used the sequence of characters වෙතින්.<br><img src="/sites/default/files/old-images/Bahitha-Malithi_5360.png"><br>
      As you can see the first two characters are not reordered by TextEdit with Malithi as they are with Bhashitha and Sinhala MN. Any further comment should be made by someone that knows the fonts and the language or at least the Sinhala script.</p>
