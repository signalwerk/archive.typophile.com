      <p>First time poster. Little late to the party, but just tested Sinhala on Illustrator, Photoshop and Indesign (CC 2014) on Mavericks, and it displays correctly. But you have to enable Adobe Word Ready Paragraph Composer on Indesign, Show Indic Options on Illustrator and Middle East and South Asian on Photoshop. See attached sample.<br>
