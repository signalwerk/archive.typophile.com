    date: 2014-09-14T17:11:00
    date_raw: 14 Sep 2014 — 5:11pm
    votes: null
    html: |-
      <p>You could try the fonts on the ICTA (Information and Communication Technology Agency of Sri Lanka) site: <a href="http://www.icta.lk/en/programmes/pli-development/104-local-languages-initiative-/1090-sinhala-stylized-fonts.html" rel="nofollow">Stylized Sinhala Unicode Fonts</a>. They appear to be opentype fonts and are likely to behave better with Adobe products than AAT fonts. I tried WARNA.ttf. It does not work with textedit. Here is what I get with XeLaTeX.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/warna_xelatex_5245.png"></div><br>
      To select it, I had to call it "ICTA Large Font". I don't know where the system finds that name;  I had to use the command <code>ftxinstalledfonts</code> to find that. Here it the trace of execution in a terminal window:<p></p>
      <blockquote><p>
      % ftxinstalledfonts -f -l | grep -i warna<br>
      824	ICTA Large Font	/Library/Fonts/1090_WARNA.ttf
      </p></blockquote>
      <p> Here is the XeLaTeX source code</p>
      <pre>\documentclass{article}
      \usepackage{fontspec}
      \setmainfont{ICTA Large Font}
      \begin{document}
      විකිපීඩියා, නිදහස් විශ්වකෝෂය වෙතින්
      \end{document} 
      </pre><p>Weird!</p>
      <p>Correction: if I replace "ICTA Large Font" by WARNA in <code>setmainfont</code>,  XeLaTeX actually takes it. I just don't see WARNA listed in the fonts when I use TextEdit which only knows about "ICTA Large Font" but can't render it properly.</p>
