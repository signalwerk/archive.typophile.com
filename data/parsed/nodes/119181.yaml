    html: |-
      <p>Many fonts include glyphs for the basic ASCII characters in addition to the characters of the writing system they are primarily intended to support.</p>
      <p>So whether you see characters in Sinhalese script or Latin characters depends on what text you type to be displayed in the font.</p>
      <p>Sinhala MN, I see, is one of the standard fonts included with OS X 10.6 and greater.</p>
