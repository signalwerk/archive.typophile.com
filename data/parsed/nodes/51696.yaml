    html: |-
      <p>It actually depends on what you want to achieve...</p>
      <p>Unfortunately, there aren't many of those fonts arround... I live/work in malaysia and often have to deal with multi-cultural audiences. Believe me, there are just not enough English fonts with Asian look arround. (I am trying to design some of these myself...)</p>
      <p>Here are some fonts we usually use and hope it helps- </p>
      <p>try "Rotis" family (by Otl Aicher) , "Mantina" (by Matthew carter) or Mrs. Eaves (Zuzana Licko, Emigre) </p>
      <p>These fonts provide both very decorative display as well as high quality text, and thus it's useful for a wide variety of applications. (again, it depends what you want to achieve...)</p>
      <p>If you want "Indian"- try "Matrix Script" (Zuzana Licko, Emigre), but I don't think that's what you want and it's only for display.</p>
      <p>Check out the series of fonts offered by Emigre, you might find what you need.</p>
