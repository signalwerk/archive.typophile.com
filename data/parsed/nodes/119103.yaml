    html: |-
      <p>There's a common dislike of Arial among graphic designers who, rightly or wrongly, view it as Microsoft's tasteless embrace of a Helvetica substitute. I doubt that the general public notices or cares about this issue.</p>
      <p>The bigger problem might be that many computer users have come to regard both Arial and Times New Roman as the ordinary, commonplace, colorless typefaces that are chosen by those whose lack of imagination prevents them from picking something else. I suspect this fate would have befallen any typefaces that Microsoft chose as the default, go-to serif and sans serif fonts.</p>
      <p>Microsoft has no reason to remove them from Windows and plenty of reasons to keep them. As you mentioned, they're popular. There are also billions of office memos, forms and other documents already set in these typefaces. Removing Arial and Times New Roman from Windows would likely cause mass hysteria in office cubicles around the world. Comic Sans would become the new default and civilization as we know it would end.</p>
    html_clean: |-
