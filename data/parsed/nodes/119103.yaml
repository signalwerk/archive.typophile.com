      <p>Times New Roman is a classic font, handsome, eminently legible and especially suitable for small print and economy of space. I wouldn't follow fads in this regard. Arial isn't beautiful, but it's used a lot on the web and therefore needed to render pages as they're created.</p>
      <p>That said, there are faces ( but not those two ) I've removed from active duty to make room for imports.</p>
