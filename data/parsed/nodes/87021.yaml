    <p>Custom Type for Eclipse, an educational/language software system.</p>
    <p>I tried to attach the image, but I kept getting a javascript error, so I've provided a link; <a href="/wiki/https%3A/%252Fforrst-production.s3.amazonaws.com/posts/snaps/116714/mega.png%3F1320189751" class="freelinking" rel="nofollow">Design on Forrst</a></p>
