      <p>I thought Droid, like the Ubuntu family, had a bit too much character for its own good. To me, it was another example of how the open source community often seems to think design is the act of making things as flashy as the guys with the money do. Remember when all the Linux people were excited about rotating cube desktops and windows burning to ashes when you hit the close button?</p>
      <p>After that, I love how damned sensible Roboto is. I’ve been using Ice Cream Sandwich for about a month and a half now, and I never thought I’d be so comfortable reading for long periods of time on a phone.</p>
      <p>I’ve seen some of those examples of it looking funny when you take two geometrically incongruent characters and put them next to each other at 72 points. It reminds me of when I was a teenager and, for the first time, I looked, <em>really looked,</em> at the capital R in Arial. That was when I began my Arial-hating phase that everyone seems to go through when they’re young and naïve; I still see people online all the time goin’ all “Look at that capital R. Just look at it!”</p>
      <p>Of course, that’s completely irrelevant to how we read text in the real world, especially on a screen. I wouldn’t put a headline in Roboto, but I’d much rather read a novel in it than in Segoe or Helvetica.</p>
