    <p>I have seen a lot of discussion and critique of this font in the tech press and amongst various geeky circles whose members are not actually trained in typographic forms. I came over to Typophile to see what you guys had said about it... only to find nothing (or at least a search for roboto returned zero results).</p>
    <p>So I'm here now asking for thoughts about and critiques of this typeface. Here an article set in Roboto which more or less defends it.<br>
    <a href="http://boingboing.net/2012/01/02/roboto.html" title="http://boingboing.net/2012/01/02/roboto.html">http://boingboing.net/2012/01/02/roboto.html</a></p>
    <p>To me it is unattractive but I'm witholding judgement of it's functionality until I can see it on some of the hi-res mobile device screens for which it was designed.</p>
    <p>If there was a discussion already had, would someone be so kind as to point me to it.</p>
