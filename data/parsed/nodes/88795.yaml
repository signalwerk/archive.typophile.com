    html: |-
      <p>@Dan Gayle who said:</p>
      <p><em>"Of what concern is the size of a UI font when it comes to bandwidth?"</em></p>
      <p>Well, just because it's being promoted and labeled as a "UI" font, doesn't mean it's a pre-loaded "system" font. I think we've got some semantic confusion here. The way I see it - it's still a web font which, at some point, will download along with an app or a web page. At that point, it might be cached, it might not be, depending.</p>
      <p>@abattis<br>
      Dave said:&gt;rich, when you say 'redone with little effort' could you be a little more specific?</p>
      <p>No.<br>
      But I will because you are Dave. But allow me to fall back on my ethnic heritage and answer your question with a question: Would you consider processing the font with ttfautohint "little effort"? Last month I processed a font for the monthly issue of Konstellations and that was about all I had to do to get it looking good, cross platform. Right now, that's a rarity with ttfautohint, but once in awhile you can hit the jackpot.</p>
      <p>But on the other hand, tonight I was struggling with a font where the height of the numerals fell in between the x-height and the caps line - always a problem for me, at least right now. No easy solution to getting the horizontal alignment right. (Autohinters seem to focus on x-height and caps height and sometimes if you hold your breath, the ascenders come out right.)</p>
      <p>But getting back to the numerals: they CAN be done without "cheating" by scaling them up to the caps height. (Which I admit, deadline nearing, I have done.)<br>
      But it took about an hour of drudgery for those. The rest of the font processed smoothly. Now, compared to using VTT, I would call two hours or so of work, "little effort".<br>
      If we take forty hours as a baseline for manually hinting a 256 character font, getting nearly the same job done - or sometimes done better - in 5% of the time, I consider little effort. And a great value proposition, too. I end up with a font that I can deploy with confidence, knowing it will look good in any browser on any platform with no further ado.</p>
      <p>BTW - well-crafted (and THOROUGH!) HTML test pages are essential. Those took considerable effort, and I STILL have a little more work to do on those before I'm 100% satisfied - even though I've been at this for about a year now. A test bed is essential, too, and there's certainly been effort there - in integrating everything - apart from the money spent. You have to have at least one Mac and one Windows box and at least one Android device and I consider the iPad and iPhone essentials, as well.<br>
      Loaded up with the major browsers - some past and some present.</p>
      <p>Which is why I'm left wondering if there are any nasties lurking in the font hrant got from the FS Generator. Without good test pages, problems hide like cockroaches.</p>
      <p>I sincerely hope not, but I'd be curious as to what HTML pages hrant is relying upon for his assessment of "acceptable".</p>
