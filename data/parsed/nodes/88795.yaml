      <blockquote cite="http://boingboing.net/2012/01/02/roboto.html"><p>Domo Arigato, Mr. Roboto<br>
      By Glenn Fleishman<br>
      Monday, January 2, 2012 • Prefer dark text?</p>
      <p>“I can’t wake up one morning and say, ‘Screw the letter B,’” type designer Matthew Carter told me last year when I interviewed him for the Economist, just after he had received a MacArthur Foundation “genius” fellowship. Carter, arguably the leading living creator and adapter of fonts in the Western world, was talking about the limits of pushing legibility and readability.</p>
      <p>I thought of his comment when a recent furor erupted over the new “house” font for Android 4.0 (Ice Cream Sandwich), called Roboto. Roboto is a bespoke sans-serif font, created by a Google employee and used throughout Android’s user interface (UI) as part of the larger user experience (UX) overhaul. The intent is to make Android more intuitive, cohesive, and fluid, and work better on a variety of screen sizes, especially tablets. </p></blockquote>
