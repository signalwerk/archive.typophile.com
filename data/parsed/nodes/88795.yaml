      <p>I read the linked article on an Android tablet, and I thought Roboto looked just fine in that setting. So it does what it sets out to do. I like its narrowness and long ascenders.</p>
      <p>But I share in some of the gripes about the design. I have no problem with genericness or lack of character, nor do I get worked up about perceived borrowing from other designs per se. But what I saw as the main criticism in the Typographica post (which many casual readers seem to have understood as plagiarism), or at least my main criticism, is that Roboto combines features from various sans genres in a jarring manner.</p>
      <p>I've read Christian Robertson's rationale for making the lowercase 'e' more open than the lowercase 'a', and I understand it at an intellectual level. But when I remain unconvinced when I actually look at such a closed 'a' next to the open 'e'. These two letters are crucial to defining the feel of a text face, and for me the open 'e' sets a tone that is subtly contradicted by the closed 'a'. The effect is less pronounced at certain sizes, but at others it's enough to be distracting.</p>
      <p>The single glyph that bothers me the most (maybe because it appears in the name of the typeface) is the distinctly Helvetica uppercase 'R'. It just doesn't seem to go with the other letters. Well, maybe it won't bother me so much when I get used to it.</p>
