      <p>I can’t fault the designer, who was no doubt working to brief, and has done a lovely job of styling and fitting. Aesthetics and technics.</p>
      <p>It’s nonetheless a generic face, not an original design.</p>
      <p>Perhaps that is appropriate for devices “powered” by (largely) open source software developed by the hive mind.<br>
      As close as one can get to aggregated/multi-designer generation without losing readability, within the constraints of type design, which has so far proved to be best crafted by one or two hands.</p>
      <p>It would have been interesting if the powers that be at Google had requested something with more currency and personality, along the lines of Andes or Pluto, but that would not have fitted the android metaphor.</p>
      <p>Replicants however, as envisioned by Ridley Scott, had just as much character as the humans who created them.</p>
      <p>**</p>
      <p>Ascenders taller than capitals is a nice typographic touch, and a departure from the classic grotesque model.</p>
