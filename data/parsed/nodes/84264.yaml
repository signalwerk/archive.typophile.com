    html: <p>In Photoshop, you can adjust the rasterization mode of type (Crisp, Sharp, Smooth, etc.), which comes in handy when optimizing the appearance of bitmap images.</p>
    html_clean: <p>In Photoshop, you can adjust the rasterization mode of type (Crisp, Sharp, Smooth, etc.), which comes in handy when optimizing the appearance of bitmap images.</p>
