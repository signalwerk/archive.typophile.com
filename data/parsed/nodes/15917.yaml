    <p>Well, I guess I’m what you call a newbie to the forum.  I was hoping for a critique of a new logo/name for our small business.  We specialise in on and off-site PC sales, service, and repair.</p>
    <p>Our current name “Your PC Service Centre” was deemed by all and sundry to be too long for the corporate world (our original target market was the suburban residential area) so a change was deemed to be in order.</p>
    <p>I’m playing with Phoenix Technical Services as a name, and threw together some roughs of a logo/typeface and some print adverts to see what it looked like on “paper”</p>
    <p>Also included is our current logo soon to be retired, it seems.</p>
    <p>If you could pass on a few words about my line of thought it would be appreciated :)</p>
    <p>Tarin</p>
