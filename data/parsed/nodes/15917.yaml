    date: null
    date_raw: null
    votes: null
    html: <p>I agree with Dan’s instructions regarding the spacing &amp; so on but I think Bryant feels more techy and is therefore more appropriate. He is right of course that the logo won’t sell you per se - but it can grease the skids or fail to do that or worse still grit them up. So I think it is worth spending some time &amp; consideration on. The category of business you are in takes less advantage of logos &amp; identity than other business do. Soap &amp; Cars rely on identity. It’s their life blood. This isn’t true for computer services services. However, memorability of the identity will help later when you get word of mouth going. And finally the minimum standards that business and the public have for identity are rising every year. It is worthwhile to get it right so you don’t need to address the issue again in the near future.</p>
    html_clean: <p>I agree with Dan’s instructions regarding the spacing &amp; so on but I think Bryant feels more techy and is therefore more appropriate. He is right of course that the logo won’t sell you per se - but it can grease the skids or fail to do that or worse still grit them up. So I think it is worth spending some time &amp; consideration on. The category of business you are in takes less advantage of logos &amp; identity than other business do. Soap &amp; Cars rely on identity. It’s their life blood. This isn’t true for computer services services. However, memorability of the identity will help later when you get word of mouth going. And finally the minimum standards that business and the public have for identity are rising every year. It is worthwhile to get it right so you don’t need to address the issue again in the near future.</p>
