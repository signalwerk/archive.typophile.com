      <p>I think this solution can work. It is stronger now. I wonder about making the 2nd line of text fill out a bit more so that it is more even visually. The type you have chose is oddly both analystic &amp; romantic at the same time. Analytic in the perfect roundness of it’s ‘o’ romantic ranther than pragmatic in it’s insistance on such a simplification.</p>
