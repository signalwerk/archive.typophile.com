      <p>The home market seems slow to respond, so a revision of the business plan to include the corporate market seems a good way to expand the business.</p>
      <p>Our goal is to be there as a safety net for business with the fast turnaround or replacement of computers a major feature of the business.</p>
      <p>The Avant Garde Ext Lit ITC font face was chosen as it was clean and easy to read.  I am new to this area so any suggestions on font choice will be quickly followed up.  We have some of the adobe FontFolio CD’s onhand so any suggestion should be available to us.  The red ‘e’ was a visual tie-in with the color of the bird logo, but has been removed in the revised image.  The “Technical Services” font has also been changed to Avant Garde Gothic to highlight the text with the smaller font size.</p>
      <p>The idea was that a colour change in the typeface itself would help to “break up” the business name as well as provide a point of difference from our direct competitors (who use all black standard typefaces) and hopefully be remembered by our market audience eg. in correspondence the name itself could be used as a distinctive mark seperatly from the logo.</p>
      <p>Our intent is to promote ourselves in a no-nonsense manner with a distinctive logo, typeface, and advertising style.  Our intended advertising target will be IT professionals, office or financial managers, small business owners, etc.</p>
      <p><a href="https://web.archive.org/web/20060522200324/http://www.yourpcservicecentre.com/phoenix4.jpg">Revised Image</a></p>
