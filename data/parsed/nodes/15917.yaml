    html: "<p>It looks like there is an auful lot of space between the the n&amp;s in ‘solutions’ I would suugest that you show us these designs in PDf format so we can see if it’s just a bad screen render or if your spacing is actually a problem. I do think that you might try making the flames smaller next to the text. Maybe not too. Have you done any business card mock ups? If you lay your logo out with 6 others making them take up about the same amount of space optically then you can start to see where your design may begins to break. That Newbase really is pretty poor. What do you mean by stylized? The best way to see if what you have is working in general is to try it out - for cards: make one &amp; print it. Hold it in your hand. Your eyes will tell you alot when everything is to size &amp; context. Sometimes there are surprises. Sometimes good. Sometime bad. But testing is your friend. Your ads are a great example.</p>"
