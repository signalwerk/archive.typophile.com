      <p>One of those old FontBank fonts called <a href="http://www.buyfonts.com/value_for_money/migra.htm" rel="nofollow">Migra Heavy</a> seems to be a good match for this. Those fonts were all based on other typefaces, but I never quite figured out what this was based on. Flyer, that E+F no longer sells (not the same as current Linotype one)?</p>
      <p>- Mike Yanega</p>
