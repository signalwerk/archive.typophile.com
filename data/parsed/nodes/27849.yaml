      <p>I see TypeShop is selling an extended family like this that they call <a href="http://www.myfonts.com/fonts/ef-typeshop/montreal/" rel="nofollow">Montreal</a>. The Heavy is exactly like 'Migra Heavy', so I think there is a common origin. (I have noticed that most TypeShop fonts are not original designs, and seem to be from the Brendel collection.)</p>
      <p>- Mike Yanega</p>
