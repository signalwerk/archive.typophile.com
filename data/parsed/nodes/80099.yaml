    html: <p>I didn't think arial at first, the "O"s on the tiles are elliptical enough that you can tell when the tile is rotated.  Arial has a pretty circular "O."  Looking at it now, it looks like Bananagrams just used arial and maybe just changed the o a little bit.  Thanks for the help!</p>
