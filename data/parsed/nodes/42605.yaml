    <p>I've juste finished watching the latest Wes Anderson movie, <em>The Darjeeling Limited</em>, and was wondering what was the font used for the movie titles, poster and end credit (see attachment). It looks like something between Gotham and Neutraface, but I just can't quite put my finger on it. I'm not really looking for the fancy cutout version used for the titles, but just the general letterform. Can anyone please help me ?</p>
    <p>(See the film, by the way, it's true Wes Anderson like we like it. For those who like him, at least)</p>
