    <p>A friend of mine has asked me to design a brochure for his boat charter business. The boats are a blend of retro 1950's boat design and modern technology and I'd like to reflect this in the design of the brochure.</p>
    <p>I've had a look at various Gothic typefaces which seem to bridge (no pun intended) both design eras and quite like the combination of Bell Gothic and Minion. However, this combo seems to lack the dynamicism I'd like to allude to (the boats are quite fast and maneuverable...) Another nice option is Futura, but it just feels a little dated. I've also looked at a few modern classics like Meta et al, but haven't hit on something that really fills me with the right vibes.</p>
    <p>Can anyone suggest a nice combination that might give the kind of feel I'm after? </p>
    <p>Many thanks in advance for any/all suggestions.</p>
