      <p>That's Storm's DynaGrotesque DXE Bold Ital—with an outline.</p>
      <p>The face has a big range and I'm somewhat interested in how people perceive it. It has a sense of speed but also softness. You could very well set extended text in the regular version, though this fat ital may be too soft for what you are doing.</p>
