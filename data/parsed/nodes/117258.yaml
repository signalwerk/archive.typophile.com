      <div class="comment-spam-body"><p>You're welcome Kieran. As for the use of the right Fraktur, for better or worse most people today can not read Fraktur capitals with any ease and they tell the swirly ones apart mainly from context. The exception may be mathematicians who use very standardized versions of the capitals as math symbols. But for other readers the mix and match choices offered by Mike and myself should work fine.<br>
      Don</p>
      </div>
