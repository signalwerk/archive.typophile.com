    html: |-
      <p>The best match I've found by far for the lighter heading is Neue Fraktur in Typoasis' <a href="http://www.moorstation.org/typoasis/blackletter/index.htm" target="_blank" rel="nofollow">Blackletter Revival</a>. It even contains very similar didone-style numerals. The download contains two files, Neue Fraktur &amp; Neue Fraktur Extra Bold. The latter is too heavy, but perhaps manually bolding the regular weight would work.</p>
      <p>This collection was lovingly digitized by Manfred Klein and cybapee (Petra Heidorn) almost a decade ago and offered via Petra's Typoasis website. The internal copyright of these fonts state, "Johannes Wagner, Hausschnitt" with the Extra Bold adding a date of 1927.</p>
      <p>You won't find cybapee or Manfred's names in the copyright of most of this collection. Having been in contact with Petra Heidorn several times back then, I know that she valued privacy rather than accolades, offered all her fonts for free and both of them wanted to credit the original designers. Unfortunately, that has a negative consequence since, years later, you only have the word of a guy like me to assure you that the font is legitimate and not a clone of someone else's font. In fact, back when these were made, several were the very first digitizations of some of these blackletters.</p>
