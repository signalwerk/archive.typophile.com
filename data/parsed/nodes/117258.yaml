      <p>A very standard Fraktur but I have not spotted an exact digital match.<br>
      Walbaum Fraktur is close but the digital does not include the lighter weight<br>
      <a href="http://www.myfonts.com/search/walbaum+fraktur/fonts/" title="http://www.myfonts.com/search/walbaum+fraktur/fonts/">http://www.myfonts.com/search/walbaum+fraktur/fonts/</a><br>
      Neue Luthersche Fraktur <a href="http://www.myfonts.com/search/Neue+Luthersche+Fraktur/fonts/" title="http://www.myfonts.com/search/Neue+Luthersche+Fraktur/fonts/">http://www.myfonts.com/search/Neue+Luthersche+Fraktur/fonts/</a> has both a light and heavier weight.<br>
      Fette Fraktur <a href="http://www.myfonts.com/search/fette+fraktur/fonts/" title="http://www.myfonts.com/search/fette+fraktur/fonts/">http://www.myfonts.com/search/fette+fraktur/fonts/</a> is very close to the letterforms, but looks too heavy. No light version.<br>
      Very few Frakturs have been digitized.<br>
      Don</p>
