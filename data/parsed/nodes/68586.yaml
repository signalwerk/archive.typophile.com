  html: |-
    <p>I have been trying to make an all-round font for the Osmanya script but have never succeeded. I have tried to use different styles such as latin, cyrillic and arabic but this did not work. I have even tried to make an original style, but it ended up as a failure. I'm trying to find out whether it's me or the difficulty of the task.</p>
    <p>Here is the challenge: Can any of you come up with a nice clean Osmanya font?</p>
    <p>Attached to this post, there's a pdf file showing you the Osmanya Unicode Range.</p>
    <p>Good luck!</p>
