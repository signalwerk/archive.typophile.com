  - id: 402532
    user: 1262
    date: 2010-03-21T20:10:00
    date_raw: 21 Mar 2010 — 8:10pm
    votes: null
    html: |-
      <p>I have not seen a single good Osmanya typeface, and very little Osmanya writing.</p>
      <p>One approach to designing for such a script, i.e. one that was invented by a specific individual rather than historically evolved, is to research its invention and development. This gives you insight into the thought processes of the inventor, and tends to uncover exemplary forms. This is the approach that my colleague Ross Mills took to the design of his Inuktitut and Cherokee typefaces.</p>
      <p>Another approach is to experiment with different writing tools and to keep practising making the shapes until you develop a natural feel for their proportions and how they can be varied.</p>
    html_clean: |-
