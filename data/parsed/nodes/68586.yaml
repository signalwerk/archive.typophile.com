    html: |-
      <p>What are your opinions on the existing Osmanya fonts?</p>
      <p>One can't design a successful typeface without a deep understanding of the letter forms. Most of us can't even read Osmanya, so seeing one example of an Osmanya font as shown on the Unicode charts is not nearly enough to give us a proper understanding of the forms. Each writing system that has been in use for generations has a certain vocabulary of normative forms, most often determined by writing implements and materials, be it reed stylus on clay or calligraphy brush on paper. And of course many scripts have an existing typographic tradition. All these have to be taken into account for a design to be successful for body text.</p>
      <p>Before you think I'm being too negative, suppose you showed someone who has never seen the Latin alphabet the Unicode chart featuring the Latin range. With only this to go on, would that person be reasonably expected to create a successful Latin text font?</p>
      <p>I agree, we should gather as many samples of Osmanya writing as possible—handwritten, printed, in a variety of styles—before we start designing anything.</p>
