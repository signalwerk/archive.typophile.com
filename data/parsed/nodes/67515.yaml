  html: <p>Hi, I'm designing a branding for my school project for a Guy Ritchie film festival. He is the director of the movies like Snatch, RockNRolla, Lock Stock and Two Smoking Barrels, Revolver, Serlock Holmes. His movies are mostly about the lucky underground criminals of London. I would like to ask which typefaces are going to be appropriate for his style?</p>
  html_clean: <p>Hi, I'm designing a branding for my school project for a Guy Ritchie film festival. He is the director of the movies like Snatch, RockNRolla, Lock Stock and Two Smoking Barrels, Revolver, Serlock Holmes. His movies are mostly about the lucky underground criminals of London. I would like to ask which typefaces are going to be appropriate for his style?</p>
