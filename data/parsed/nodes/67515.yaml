    html: |-
      <p>^cfig is right.</p>
      <p>I think the challenge is to look at all of those existing titles, and divine some common ground... Overall, I think the brand should be understated because the communication is a showcase of other material, not a showcase of the man. He's the artist behind the work, and perhaps your type choice should reflect his role behind the camera rather than some representative cliche of his films.</p>
