    html: |-
      <p>Sorry about the nuisances, Ralf. They're gone now.</p>
      <p>Both Florian and I try to police most sections of the site daily.</p>
      <p>I check the General Forums and Design daily. Florian usually watches Type ID. And one of us usually catches Build activity before too long. I regularly check the main Blog section, but since the list doesn’t re-order based on comments, only original posting date, I don’t always catch spam comments in older blog posts. For some reason, certain threads become spam magnets.</p>
      <p>For a while I was regularly checking the master Comments listing every morning, but I had to stop at one point because I was otherwise too busy and it’s really time-consuming. I will try to resume. </p>
      <p>You can always send me an e-mail if a spam comment persists and you think we’ve missed it.</p>
      <p>Initial posts are run through the antispam filter, but individual comments currently are not. The engine still puts up too many false positives, which would seriously hamper conversations.</p>
      <p>(Ironically, this post was originally flagged and I had to rescue it from the spam queue. *sigh*)</p>
