  html: |-
    <p>The bots regularly spam our Typophile blogs. Example: <a href="http://www.typophile.com/node/84295" title="http://www.typophile.com/node/84295">http://www.typophile.com/node/84295</a></p>
    <p>What can we do about it? Reporting each single entry is probably not the best solution. I can't even ignore these spam posts because they always show up in the Track function and AFAIK I cannot even unsubscribe my own entries, can I?<br>
    If the admins don't spot these spammers, I guess the best option would be to give the blog users the option to delete replies in threads they have started.</p>
  html_clean: |-
    <p>The bots regularly spam our Typophile blogs. Example: <a href="/node/84295/" title="http://www.typophile.com/node/84295">http://www.typophile.com/node/84295</a></p>
    <p>What can we do about it? Reporting each single entry is probably not the best solution. I can't even ignore these spam posts because they always show up in the Track function and AFAIK I cannot even unsubscribe my own entries, can I?<br>
    If the admins don't spot these spammers, I guess the best option would be to give the blog users the option to delete replies in threads they have started.</p>
