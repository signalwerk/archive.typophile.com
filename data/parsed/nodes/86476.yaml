      <p>James — Unfortunately, that would require too much overhead, since all this administration is volunteer. The Type ID forum alone would slow to a crawl and we’d spend hours and hours every day monitoring and administering.</p>
      <p>If everyone is willing to be a little patient and just ignore the occasional spam (irritating as it is), usually within 24 hours it gets cleaned up.</p>
      <p>Again, I apologize for the occasional lapses when situations like Ralf’s slip through undetected for an extended length of time. For those cases, just let one of us know.</p>
