      <p>&gt; we’d spend hours and hours every day monitoring</p>
      <p>I understand that if you have to manually search for posts by new users, but is there a way to configure the software so it presents you with just a list of first-time posts from new users? (After the spam filter has already done an initial weeding.)</p>
      <p>I'm asking because a friend used to moderate a discussion board and it was configured that way. A couple of times a day she'd just review the list of first-time posts from new users that had made it through the spam filter, and it just took her a minute to weed out the remaining spam and approve the rest. </p>
      <p>Perhaps the software running this message board doesn't have that feature; I'm just asking. I totally understand that manually searching would be too time-consuming.</p>
