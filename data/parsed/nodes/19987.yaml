    html: |-
      <p>I don't think I would have read anything if I hadn't been trying. In other words, you have to want to analyze this for a moment longer -- to have your aha moment -- or else you'll just see a pile of notes. And this, as Miss Tiffany said, can be a good thing.</p>
      <p>However, I think that if something doesn't somehow hold your attention and compel you to find the hidden image/message, you'll just move on. So, as I see it, the problem to be solved here is how to get people to stop a second longer and decipher the visual puzzle.</p>
      <p>Perhaps by adding a whole bunch of notes to the background and somehow making these stand out -- by giving them a slightly different colour, or making it seem as if they're on a plane closer to the viewer, or whatever.</p>
