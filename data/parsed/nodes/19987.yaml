    html: |-
      <p>Only the M and E work. Notice that in both cases you have a pretty conventional version of the letter in the edges of the post-it outlines. Not in any of the others though. The "b" doesn't work in context, because everything else looks uppercase, so it hits me as an "L" if anything. And the very first letter (the "R") is too vague.</p>
      <p>Neat experiment, though-- the problem seems to be in trying to make some of the letterforms with only two rectangles. That will make it almost impossible to distinguish, say, P and F. Then again, context does help -- but that means that you'll need text to be custom for each case, or else multiple glyphs for certain letters.</p>
    html_clean: |-
