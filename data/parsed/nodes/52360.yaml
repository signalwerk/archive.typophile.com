      <p>It’s just a collection of free fonts from all over the web. You can find similar collections for $5.00. And it’s not legit, because some of those fonts might be free, but their licenses do not allow them to be redistributed for profit.  </p>
      <p>And when I was a student I once made this mistake of buying one of these packs. What I got a was massive zip file filled with junk fonts, many of which had names like 000_001_a.ttf. Most of them were the dregs of the free font scene; bad, unfinished undergraduate font projects based on album cover and movie poster lettering. So unless you want to spend more money on software that can print out a specimen book of all the fonts, don’t bother.</p>
