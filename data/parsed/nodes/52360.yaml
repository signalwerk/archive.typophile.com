      <p>"Again you sound so shure of this. Have you gone thru the entire collection and checked? What makes a font useful is subjective."</p>
      <p>...and objective.</p>
      <p>Objectively, I think many would agree that in terms of power-house, versatile typefaces that can be a solid tool in your toolbox, in the realm of the free, there aren't a whole lot. Sure, there's plenty of one-off useful display faces. I won't argue any of the subjective points of those. </p>
      <p>That was merely my opinion. You may disagree.</p>
      <p>"check the EULA on those fonts you spent a few minutes collecting. How many allow commercial use or even contain a EULA that makes any sense?"</p>
      <p>That's what I was getting at...there are only a few dozen that really offer true open source and/or freeware and/or public domain licenses that give you free reign.</p>
      <p>I won't get into 'making sense' as I'm not so sure a lot of commercial font EULAs make a whole lot of sense either ;o)</p>
      <p>For the record, I really have nothing against this download thing. I just find having 10000 fonts somewhat pointless, regardless of the quality/cost. </p>
      <p>"For $20 if you get even 10 quality fonts that are licensed for commercial use, it’s a pretty good deal."</p>
      <p>Exactly. It'd almost be a better deal if the collection WERE divided into smaller $20 downloads. Part of what you pay for is convenience, and I'm not sure slogging through 10,000 fonts is a convenient thing to do:</p>
      <p> - Download all 10,000 faces for $20</p>
      <p>or</p>
      <p> - download these select 10 text faces for $30<br>
       - download these select 10 display faces for $30<br>
       - etc.</p>
      <p>It sounds silly, perhaps, but I'd probably opt for the latter. Yea, I'm paying more for less, but I'm gaining a lot of time.</p>
