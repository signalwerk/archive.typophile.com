      <p>Nachos: What's your point?</p>
      <p>Aluminum: check the EULA on those fonts you spent a few minutes collecting. How many allow commercial use or even contain a EULA that makes any sense?</p>
      <p>Innovati: If a designer were asked to create a sign for a cowboy themed amusement park ride, would Rockwell or Helvetica be the best choice? Helvetica seems a bit more cowboyish than Rockwell but I'm not sure. Please explain.</p>
      <p>The Ultimate Font Download is Jason Nolan's project, he also runs 1001freefonts.com. All of the designers involved in the project have given their permission to include their fonts in the package. Jason is the most generous person I have ever encountered  . . . in my life . . . period. While other free fonts sites rake in the bucks and contribute zero dollars back to the designers, Jason shares the wealth. I don't want to say how much Jason has given back on a public forum but it's a hell of a lot. The fonts in the ultimate download have all been cleared, by the original designers for commercial use. So, you can say what you want about the wisdom of using free fonts, but don't say anything bad about this package. As far as the other download packages which contain my fonts go: they don't have my permission, they have out of date fonts and they give nothing back. Please correct me if I'm wrong.</p>
      <p>Yes, other sites have free fonts and you can buy lots of giant mega font packages elsewhere, some may even be free. You can go to various free fonts sites to find an old version of a font, probably with the EULA missing. If you have the time to spare and you don't mind old versions, go ahead. Do to dafont and have a grand old time downloading out of date versions of my fonts if you like.</p>
      <p>But, even if you're a high end design snooty designer who won't touch a font under $50, it doesn't hurt to have some spare ammo. Plus, you get a heap of Nick's Fonts, licensed for commercial use. You can slag Larabie Fonts all you like but what do y'all have to say about Nick's fonts? Junk?</p>
      <p>I can see why some people are mistrustful. James Puckett, has good reason to avoid another too-good-to-be-true font deal. But, Jason's the real deal. I'm pretty certain any other download pack which contains my fonts is a scam.</p>
