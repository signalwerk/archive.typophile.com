      <p>I just want to update.</p>
      <p>Thanks for everyone sharing their thoughts.  I've contacted Jason and he referred me to numerous free font makers who I contacted and all responded positively to the download as being with their permission.</p>
      <p>Yeah 10,000 fonts for $20, isn't really a bad deal in my opinion, even they aren't all complete, etc.  For $20 if you get even 10 quality fonts that are licensed for commercial use, it's a pretty good deal.  I wasn't looking for entire libraries to print tomes, but rather something to add flavor to various pieces of artwork.  I think the download was worth it.</p>
      <p>Again, so long as they're all legit, which seems to be the case.  As someone suggested, the website would look a little more legit if there was a bit more info on it.  I would also recommend that the license that comes with the download explicitly state permissions that were given by each font maker by name.  If it's possible, perhaps each font by name as well.</p>
