    <p>Hi,</p>
    <p>I'm new here.  Until recently, I didn't even realize all the legal issues involving using fonts for commercial use...  </p>
    <p>I saw the Ultimate Font Download, 10,000 commercial-licensed free fonts for $20.</p>
    <p>[link removed by moderator]</p>
    <p>I need fonts for commercial purposes, but this sounds too good to be true.  Does anyone know if this is legitimate or just a scam?  It appears to the endorsement of at least one maker of free fonts.  </p>
    <p>Thanks.</p>
