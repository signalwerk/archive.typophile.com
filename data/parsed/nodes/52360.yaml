      <p>@Pucket: <em>And it’s not legit, because some of those fonts might be free, but their licenses do not allow them to be redistributed for profit.</em></p>
      <p>This is an incorrect assumption. I know a little about this Ultimate Font Download, enuff to tell you all the collection is perfectly legitimate. All of the fonts in it are in it by formal arrangement with their makers, who gave their permission for their work to be included. The guy who offers the download pays most of the profit he makes back to the people who made the fonts in the collection.</p>
      <p>@Nachos: <em>Don’t get ripped off. 1001 fonts has these same fonts listed verbatim.</em></p>
      <p>No, it really doesn't work that way. People who buy The Ultimate Font Download are paying for the convenience of not having to wade thru page after page of drek on archive sites to find the good stuff. If you don't think paying a small sum of money for one handy download is worth it, that's your opinion. Thousands of satisfied buyers of the Ultimate Font Dowload disagree with you. Calling it a rip-off is like painting it black because you don't see the value of it in dollars.</p>
      <p>There's no pleasing some peeple.</p>
      <p><em>What would you bet that Larabie is getting a cut of profit from ultimatefontdownload?</em></p>
      <p>Yes, correct, Ray does recieve a cut of the profit from The Ultimate Font Download. If you have a problem with that you should talk to Ray larabie about it.</p>
      <p>@Darrel: <em>You can download all the quality free fonts in about a half hour.</em></p>
      <p>Can you? You sound very shure. Have you actually done this?</p>
      <p><em>There’s maybe 2 dozen, total, that are worth the effort of grabbing in terms of being a quality face, and versatile beyond the one-off parody of a movie title or band name.</em></p>
      <p>Again you sound so shure of this. Have you gone thru the entire collection and checked? What makes a font useful is subjective. Ray Larabie alone has made more than a dozen very useful, usable free fonts, and they are all in this collection. Add to that all the other useful usable fonts in it. Go figure.</p>
      <p>@phrostbyte64: <em>All of these comments are true, as far as they go.</em></p>
      <p>Incorrect. Some of these comments are way off the mark.</p>
      <p><em>As for being legit? Who knows.</em></p>
      <p>I happen know that the fonts in this collection are as legitimate as free fonts can be.</p>
      <p>j a m e s</p>
