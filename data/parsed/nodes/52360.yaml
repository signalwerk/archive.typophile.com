      <p>Yes, the MyFonts versions are always the latest ones so you'll automatically get more udaptes. When I update Larabie Fonts fonts they go to MyFonts and 1001freefonts.com. Other sites might pick them up eventually but I doubt it. I've been hammering away at the entire collection for the last few weeks. I've been updating about 5 families per year but 2009 will see a lot more updates, plus some commercial additions to the free families. When I add new styles I'll have a chance to rebuild/repair some of the older fonts so even if people stick to the free versions, they'll still see some improvement.</p>
      <p>Octin lowercase: Oh, probably, someday but more likely a new, similar type of family. I experimented with Octin lowercase but it just seemed to take something away from the caps . . . by their very presence. Adding new characters to textured fonts can be tough. I screwed around in Photoshop for about an hour to get that vintage t-shirt texture right, so I don't think I'd be able to match a lowercase set. I'll definitely think about it though.</p>
