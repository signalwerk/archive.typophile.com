  html: |-
    <p>Hi folks-</p>
    <p>I'd appreciate some help identifying this distinctive serif, used on the artwork and liner notes for School of Seven Bells' "Alpinisms". It shares many similarities with LT's Kalix, but the A has a left cusp and the B has a gap between the vertical and the centre bar that Kalix does not.</p>
    <p>There's also a "ch" ligature here, but it's possible that it has been customised.</p>
    <p>Thanks!</p>
    <p>-Nick</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_3586.jpg"></div><p></p>
