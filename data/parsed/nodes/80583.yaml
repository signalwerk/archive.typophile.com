    html: <p>My understanding is that extracting font outlines from a PDF is clearly illegal, but that's perhaps only true if the font has registered protection such as a copyright as software or design patent. It would seem though that you have a case that this font isn't protected (probably never was) and is abandoned property or unclaimed work which would make extracting the outlines OK as fair use of works in the public domain. I think Ray Larabie has given some great advice to assume that is not the case and proceed with caution.</p>
