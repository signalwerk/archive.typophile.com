      <p>I would have noted the font's origins and tried to stress I didn't make the glyphs... But of course once it spreads online, that sort of useless gesture becomes moot. A million sites will provide just the TTF file.</p>
      <p>Also it's come to my attention since that the Silver Graphics font does exist as a standard TTF and really was sold at some point, maybe as part of a package CD. Maybe they got a gerber cutter and saw the font software, and their eyes turned into dollar signs.</p>
      <p>I'm thinking I'll keep my version to myself and maybe share with a friend or two who won't redistribute it (naive I know), while the silver graphics version is off limits.</p>
      <p>Thanks for your input everyone.</p>
