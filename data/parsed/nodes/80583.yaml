      <p>Assume that whomever still retains the copyright could someday enforce it. Don't put yourself in a situation where the font ends up on hundreds of free font sites and you have no way to take it down. If you were to distribute it from your own site with a copyright notice that explained that the font can only be distributed from that site, at least you'd be able to easily comply with a C&amp;D letter by taking it down from your site. You don't want to be in a position where you have to request font removal from hundreds of free font sites: trust me.</p>
      <p>That also allows you to ensure the documentation stays with the font. Many free font sites remove the license agreement from the zip or distribute unzipped fonts.</p>
