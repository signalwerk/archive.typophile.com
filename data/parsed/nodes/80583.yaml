      <p><em>am I breaking the law?</em></p>
      <p>Technically, probably not: the beziers themselves are simply data, which is not copyright-protected--or, so it would seem in the wake of several other discussions in these fora on the subject. However, there is, indeed, an ethical problem if you claim the work as your own and/or profit from it. But, if you intend it to be freeware and the abandonment issues you raised are true, then you can probably sleep well at night, and the cheap bastards who never bought a font in their sorry lives--and never will--will thank you and sing your praises...and ask you for free technical support if the font doesn't perform to their expectations.</p>
