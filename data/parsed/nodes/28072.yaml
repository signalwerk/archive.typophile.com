    html: |-
      <p>The 'r' doesn't match Shelley - I tried that.</p>
      <p>I've had a few successes with Identifont but more often than not it gives me a blackletter when I specifically said it's a sans. What that site is missing, IMHO, is a first step that allows you to categorize the font - i.e. serif, sans, script, calligraphic, display. It is improved in that now you can enter the letter selection you have available rather than having to click 'Not Sure' on all the Q and J questions.</p>
