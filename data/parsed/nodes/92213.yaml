    html: |-
      <p>Some, like the Alice in Wonderland, are transliterations; some, like Walkman and the beer label, are translations - the label  includes a translation of 'Brewery" into Hebrew.<br>
      The Japanese one looks good, but I have no idea whether it's a transliteration or a translation.</p>
      <p>Some appear to be stylistic interpretations which I personally find unreadable.</p>
      <p>So whether they're quality products depends on what the goals were!</p>
      <p> -  Herb</p>
