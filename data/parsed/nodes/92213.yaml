      <p>I think "Alice in Wonderland" works, but with "Disney", the actual outlines are simply copied and that's really a no-no for that style, since the marks made with what appears to be a brush or marker are peculiar to the direction and pressure the strokes were written. I think "walkman" worked well, as did the japanese example. Why? because both styles are not really specific to a script, and are playful in themselves. Some of the examples aren't as nice.</p>
      <p>I had seen something like this earlier. Some worked, some didn't.<br>
      <a href="http://www.designer-daily.com/hebrew-translations-of-popular-logos-6798" title="http://www.designer-daily.com/hebrew-translations-of-popular-logos-6798">http://www.designer-daily.com/hebrew-translations-of-popular-logos-6798</a></p>
      <p>And this also came up, with the coke logo:<br>
      <a href="http://www.roundpeg.biz/2010/05/great-logos-transcend-language/" title="http://www.roundpeg.biz/2010/05/great-logos-transcend-language/">http://www.roundpeg.biz/2010/05/great-logos-transcend-language/</a></p>
      <p>Bear in mind, although I do know a little Hebrew, I'm not native and I'm not fluent.</p>
