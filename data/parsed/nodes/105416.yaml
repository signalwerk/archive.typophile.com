    html: |-
      <p>When you select the space character do you see <code>U+0020 space SPACE</code> written at the top of the FontForge window? When you leave the cursor on top of the comma, do you see a little window with <code>U+002c "comma" COMMA</code> written appear?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ff_window20130812_4361.png"></div><br>
      If not, your glyphs are not properly named, encoded. They are generated, but are not recognized as a comma, a period, a space by any application, not even FontForge.<p></p>
      <p>Here is where the characters should be after you select Encoding &gt; Reencode &gt; ISO-10646-1 (Unicode BMP).</p>
      <p><img src="/files/encoding20130812_5133.png" width="100%"><br>
      (Open picture in new tab or new window to see actual size.)</p>
