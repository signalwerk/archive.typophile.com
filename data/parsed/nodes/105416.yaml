  html: |-
    <p>Hi All,</p>
    <p>I'm new to typography and I'm creating my first font in Fontforge. I design the characters illustrator first then import them in to fontforge. </p>
    <p>I done the capital letters first and generated them to see what they were like. That worked. Then I done the lowercase letters and generated them. that worked as well. Then I done a few punctuation characters as well as the space character (8 all together), generated them. It didn't work. When I use the font in another software the capital and lowercase letters showed up but the 7 punctuations I have done don't show up and the space character works but is too big even though I made it half the size if font forge.</p>
    <p>I'm getting a bit frustrated because I've tried different things to solve the problem and am still getting stuck. If you could help me I would really appreciate it.</p>
    <p>Thanks,</p>
    <p>Dave</p>
