      <p>hello dan,</p>
      <p>have you tried this option?</p>
      <p><cite>If you’re on OSX Tiger (10.4) or Leopard (10.5), and you want to install RoboFab and its dependencies (FontTools, Numeric), for use in FontLab 5.0x, then you can use the <a href="http://www.robofab.org/download/RoboFab1.1.1_FontLab_Installer.zip">RoboFab Installer for OSX, FontLab 5.0x.</a></cite></p>
      <p>try asking <a href="http://groups.google.com/group/robofab">here</a>.</p>
      <p>cheers,<br>
      - gustavo.</p>
