    <p>Hello,</p>
    <p>I have a new MacBook Pro (intel) laptop. The OS is Mac OS X 10.5. The installed version of Python is 2.5.</p>
    <p>I wanted to install RoboFab, but RoboFab’s site states that it only works with versions 2.3 and below. I went to a MacPython site to download an older version, but the builds say that these’ll only work with PowerPC processors.</p>
    <p>Is there a way that I can replace my version of Python with an older version that will allow me to use RoboFab?</p>
    <p>Thanks!<br>
    Dan</p>
