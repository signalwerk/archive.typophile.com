      <p>Thank you John, I was just wondering how to read Hrants thoughts about the essential parts of readability in a typeface. I assume this is a term no one else uses to talk about ascending and descending elements in scripts, thus it is unconventional (not codified in type-language).</p>
      <p>Hrant, could you elaborate if you want to convey any other meaning then John presumed, and if so, explain why you use this term instead of a more self-explanatory nomenclature?</p>
      <p>To explain my interest: I am just starting to do research on the possibilities and obstacles to harmonization of the Arabic and Latin script and read Hrants piece in Spatium about latinization where he also talks about the “Cartesian Area”. He also mentions the linguistic frequencies as playing an important part - are there any reasonable sources (ideally free) for linguistic frequencies of letters in Arabic and Farsi?</p>
