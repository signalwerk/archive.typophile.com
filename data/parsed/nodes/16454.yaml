      <p>John,<br>
      this was indeed very helpful, thank you very much! I am really looking forward to meet you in spring in Reading.<br>
      I’ve read Milo’s article, but I am not quite sure why the  <cite>assimilation</cite> and  <cite>dissimilation</cite> of letters make data about their frequency really obsolet. Especially regarding the frequency of  ascending and descending elements data like this could be quite helpful - a Kaf is ascending in each version, and so are Aleph and Lam, whereas Ya, Ra, Waw etc. are always descending. There are basically a lot of repetitive elements. If one knew for example (hypothetically), that there were twice as many descending elements as ascending, wouldn’t this probably influence the design?</p>
      <p>I will take a look at what <a href="/wiki/Gerrit%252BNoordzij" class="wiki">Gerrit Noordzij</a> says - as far as I remember, <a href="/wiki/Fred%252BSmeijers" class="wiki">Fred Smeijers</a> mentions the same issue very briefly in Counterpunch.</p>
