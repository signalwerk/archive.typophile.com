      <p>A Cartesian area is, presumably, simply a two-dimensional area divided into a Cartesian grid, which is a means of mapping the position of things within an area relative to an origin point along an x (horizontal) and y(vertical) axis. Digital fonts map glyphs on a Cartesian grid: the unit per em grid.</p>
      <p>I’m not entirely sure how Hrant uses this term, but I suspect he may try to overextend its normal meaning.</p>
