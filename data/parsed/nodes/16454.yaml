      <p><em>You mean “Pour une typographie arabe : contribution technique à la démocratisation de la culture arabe” by R Hamm?</em></p>
      <p>No. That is a truly awful bit of work, to the point of being unintentionally funny. The lengthy theoretical justification for the project leads gloriously to some of the most cack-handed letterforms ever made for any script.</p>
      <p>The book to which I referred is more recent. When it gets unpacked, I’ll try to remember to post the bibliographic details here.</p>
