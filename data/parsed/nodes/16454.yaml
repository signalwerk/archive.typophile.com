      <p>Overextend, go, go go!!  :-)</p>
      <p>I actually use “Cartesian area” to help describe how scripts use the space they’re given (for example how Arabic uses the vertical space much more richly than Latin) not [just] leading. And I don’t simply use the common “surface area” because of the X-Y implication of “Cartesian”; so it’s a term richer in a way that we need. Since we set [Latin] text in a vertical stack of horizontal lines (as opposed to in a spiral or something, like the Phaistos disk* - in which case Polar Coordinates would probably be better) considering the difference between the two dimensions is critical. Especially when you consider the inequivalence of the two dimensions in the human reality.</p>
      <p>* And can you believe they set that thing outside-in?! The other way would have been much more elegant and functional. But I admit I wasn’t there.</p>
      <p>On the other hand, I wouldn’t want to think of a strict grid<br>
      when I use the term. More a set of orthogonal guidelines.</p>
      <p>&gt; There is a book in French about letter frequency in Arabic.</p>
      <p>You mean “Pour une typographie arabe : contribution technique à la démocratisation de la culture arabe” by R Hamm? It’s an interesting book, but way way too Modernist (it’s set in Bodoni for chrissake). I don’t blame Tom for not thinking much of it. On the other hand, he might think much more highly of the work of Vlad Atanasiu (did you meet him in Rome?). In fact Vlad’s stuff actually also provides a lot more linguistic-frequency information and analysis.</p>
      <p>&gt; Nor have I actually seen Hrant perform such quantification.</p>
      <p>Because strict formal quantification would backfire.<br>
      As you say/imply yourself, this is still a deterministic problem.<br>
      On the other hand:</p>
      <p>&gt; It is enough to look at text in different scripts</p>
      <p>Enough, depending. I’ve found that it’s not enough for serious multiscript work.</p>
      <p>Although deterministic, it’s still extremely helpful to look at encapsulations of the type I’ve shown at conferences (and in Spatium). You could say it focuses the determinism. By looking at a single line of a dozen or fewer glyphs (scaled horizontally by frequency) one can get a very good idea of the “shape” of a language+script. You can’t do that very well at all just by looking at pages of text - I guess because our brains don’t work like that.</p>
      <p>&gt; This explains the commonly remarked phenomenon that even modern<br>
      &gt; typefaces tend to look best when used to set Latin language text:<br>
      &gt; the writing system is in a sense optimised for the language.</p>
      <p>I’ve heard that before (elsewhere) and although it does make a little bit of sense, I don’t think it makes enough sense. To me the reason Latin looks better is simply that it has fewer extenders: it looks more controlled and regular (which however is appealing only in a Modernist/Display way).</p>
      <p>&gt; If one knew for example (hypothetically), that there were twice<br>
      &gt; as many descending elements as ascending, wouldn’t this probably<br>
      &gt; influence the design?</p>
      <p>Exactly. And the visualization that I promote makes<br>
      this sort of thing qualitatively much easier to see.</p>
      <p>—</p>
      <p>BTW, I do know one person who now uses the term as well,<br>
      although maybe not in public, not yet: Peter Enneson.</p>
      <p>hhp</p>
