      <p>There is a book in French about letter frequency in Arabic. My copy is packed at the moment, and I can’t remember the exact title. Unfortunately, my French is not good enough to have got much out of it. I discussed the book with Tom Milo, and he thought it not particularly helpful. With Arabic, you have to consider not simply letter frequency but also the frequency of particular combinations of letters and the possible multiple forms they can take depending on the style. If you look at Tom’s essay in <em>Language Culture Type,</em> he shows, if I recall correctly, nine different ways in which the same word can be legitimately written in the ruq’ah style. At that point, mere letter frequency data isn’t very enlightening.</p>
      <p>Regarding Hrant’s use of Cartesian area, I’ve tried to understand it simply as the flat area occupied by the signs, some of which is white and some of which is black. I question the use of the term Cartesian, because that implies a unitised area, divided into a grid. While this might be useful if one intended to quantify the typical amounts of black and white in different parts of the area for different scripts, it isn’t strictly necessay. Nor have I actually seen Hrant perform such quantification. It is enough to look at text in different scripts — and, importantly, in different languages — to understand the basic point: different writing systems employ the writing area in different ways.</p>
      <p>I was reading Noordzij’s comments on letter frequency and language in <em>The Stroke</em> last night. He makes the very sensible observation that the forms of the Latin miniscule developed during the Middle Ages in the writing of a particular language, Latin, and even a particular text, the Vulgate Bible. This explains the commonly remarked phenomenon that even modern typefaces tend to look best when used to set Latin language text: the writing system is in a sense optimised for the language.</p>
      <p>Necessarily, most of the typefaces my colleagues and I make are in a sense generic, or at least generalised, in that they are inteded to be used to typeset multiple texts, most of which the type designers is unaware of at the time he designs the type. They are seldom if ever completely generalised, however, — it is understood that there are some uses for which a particular typeface is more or less suited and may be completely inappropriate — and I am very taken with the idea that a typeface can and perhaps should be optimised for a particular text or a even a specific edition. Over the past couple of years I’ve had some opportunity to explore this with the SBL Hebrew typeface, which is really designed to typset a particular text with some unique characteristics. In this case, most of the optimisation has been technical rather than design related, and the text is unusual in many regards, but it strengthens my suspicion that there is a benefit to optimising type for particular texts and not always employing generic solutions.</p>
