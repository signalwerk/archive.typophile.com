    <p>Hrant (as far as i under stood) uses this phrase to talk about the interlinear whitespace of scripts. Does anyone else use this phrase, has it any “official” connotation, what does it mean and where does it come from?<br>
    (I’ve googled it and found only stuff related to map systems.)</p>
