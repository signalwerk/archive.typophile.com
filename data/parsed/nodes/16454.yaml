      <p>I have used the term <em>cartesian <strong>space</strong></em>, in public—but only in passing—in my 2nd ICTVC talk.</p>
      <p>Cartesian space is space conceived in rectilinear (x,y, or x,y,z) coordinate terms. For type this means thinking about how different typefaces or different script systems use vertical (x) space and horizontal (y) space. </p>
      <p>We can say that upper case roman letters uses cartesian space in the vertical dimension differently than lower case roman forms and that the two uses are not fully commensuarate. The roman majuscules use a baseline and a cap height, but the space below the baseline is not used, nor does it make sense to talk about an x-height.</p>
      <p>The roman minuscules or lower case forms sit on a baseline, but have descending elements, a definable / prominant x-height, and ascending elements that extend above the x-height: a very different use of cartesian space.</p>
      <p>Robert Bringhurst says the Greek letters around the time of Parmenides are better viewed as dancing around a centre lie, rather than as sitting on a baseline. It seems to me, given my rather limited knowledge of npn-western script systems, that hanging Indian forms don’t work on a baseline scheme, and that it makes no sense to talk about x-height in Arabetic scripts. So the problem of harmonizing Arabetic and Latin-based scripts might be like harmonizing Roman capitals and Carolinian miniscules, i.e., like harmonizing two different spatial schemes.</p>
      <p>(There are of course also interesting things to be observed along the y—or horizontal—dimension)</p>
      <p>I take it for granted that the perceptual processing system becomes tuned to the way a script system makes use of cartesian space, but I am unsure how to flesh this out just yet. Maybe capitalization works to code proper names and beginings of sentences—that is, works for the tasks it has been put to—because the uses of cartesian space have a margin of incommensurability.</p>
