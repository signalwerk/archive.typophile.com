  html: |-
    <p>I'm compiling a list of typefaces and trying to apply classifications beyond simple categories, the categories being sans-serif, serif, slab serif, etc. The Fedra family is a little tough. What would Fedra Serif be? I've seen the category "contemporary" applied to it, but that seems to be a little "dated", as the definition of contemporary will always change. I've seen Humanist applied to Fedra Sans, which makes sense.</p>
    <p>So what is the best classification for Fedra Serif? Best for Fedra Sans?</p>
    <p>Thanks</p>
