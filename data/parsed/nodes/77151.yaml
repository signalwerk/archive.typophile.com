    html: <p>Old style and Venetian (is this what you're thinking of, Craig?) are both sub categories of Humanist serif In my world. Fedra is perhaps more Old Style? At least if you're looking at the x-height. Not quite sure though. It does have a very different feel to it than most other faces in that category - so perhaps at a later stage it will get a different label.</p>
