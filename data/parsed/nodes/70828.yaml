    <p>Hey!</p>
    <p>WhatTheFont didn't help, neither did Identifont. I searched Typophile through Google, but I didn't find this (well, not immediately, anyway…). I did find out that they like using proprietary typefaces (other than Times and Minion, from what I found). Is <a class="freelinking external" href="http://www.edkashi.com/blog/uploaded_images/Christ_NatGeo_0609_cover-779339.jpg" rel="nofollow">this</a> another case of a proprietary typeface at use? Here's <a class="freelinking external" href="http://lib.store.yahoo.net/lib/palemale-store/natgeodec2008cover" rel="nofollow">another sample</a> and <a class="freelinking external" href="http://www.mandmglobal.com/cmsimages/Company-Profiles/National_Geographic_Cover_1.jpg" rel="nofollow">yet another one</a>.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/NATGEO_3629.png"></div><p></p>
    <p>Thank you in advance!</p>
