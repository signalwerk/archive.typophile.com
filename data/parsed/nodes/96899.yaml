  html: |-
    <p>I want a font that is legible like print, but elegant as cursive. The cursive fonts connect the letters too much and make it difficult to read. And the print fonts are all to boring. I would like a font that has a mix between cursive and print so that tails of the letters are only slightly connected, but are still readable. </p>
    <p>Fonts I like to get an idea of what I'm looking for:<br>
    Cursive: <a href="http://www.dafont.com/volutes.font?text=Something+like+this" title="http://www.dafont.com/volutes.font?text=Something+like+this">http://www.dafont.com/volutes.font?text=Something+like+this</a><br>
    Print: <a href="http://www.dafont.com/architects-daughter.font?text=Something+like+this" title="http://www.dafont.com/architects-daughter.font?text=Something+like+this">http://www.dafont.com/architects-daughter.font?text=Something+like+this</a></p>
