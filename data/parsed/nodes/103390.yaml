    <p>Looking for a headline typeface for a fashion brand (ladies clothing) for adverts, website slides etc.<br>
    The brand is edgy and experimental and needs something different to the usual didone and sans serif styles.</p>
    <p>I'm thinking something like Rihanna's style:<br>
    <a class="freelinking external" href="http://ghettobabydesigns.blogspot.co.uk/2013/02/rihanna-unapologetic.html" rel="nofollow">Rihanna1</a><br>
    <a class="freelinking external" href="http://toyaz-world.net/wp-content/uploads/albums/w102/toyablogger28/rihanna-complex07.jpg" rel="nofollow">Rihanna2</a></p>
    <p>I'd love to get some lettering commissioned but unfortunately can't do that so hoping someone knows of a decent font like this, preferably with a few alternates so it looks more hand done.</p>
    <p>If anyone has any ideas for something like this, or any other ideas for a typeface.<br>
    Has to be edgy and Audacious!</p>
    <p>Thanks<br>
    Joe</p>
