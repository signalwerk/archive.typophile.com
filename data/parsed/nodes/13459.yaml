    <div class="info">Submitted by <a href="/web/20081014052858/http://typophile.com/user/3" title="View user profile.">Jared Benson</a> : 5.Jul.2005 12.47pm </div>
      <p>Join us in our push to get over 1000 entries in the TypoWiki before TypeCon! </p>
    <p>Now that you can see which entries need content (look for the red "w") let's pull together to populate the wiki for TypeCon.</p>
    <p>The TypoWiki currently holds 433 entries (and innumerable revisions of those entries) - this means 38 <b>new</b> entries per day between now and TypeCon to make our goal. Add hundreds of authors, and it should not be a problem, right? Right?</p>
    <p>Well, we want to offer an incentive. The top five (5) wiki authors will receive our new Typophile t-shirt, originally designed by <a href="/web/20081014052858/http://typophile.com/wiki/Christopher Simmons" class="wiki">Christopher Simmons</a>. The rest of you will be able to get this tee with your membership(s).</p>
    <p>Important Note! Make your entries QUALITY. Creating a swarm of one-line entries will only work AGAINST you. While all input is welcome, only entries with at least <b>20 words</b> will be factored toward a position in the top 5.</p>
    <p><img src="/web/20081014052858im_/http://typophile.com/content/images/new_tee.gif" width="774" height="459"></p>
