      <p>It just so happens that Klim Type has released Domaine today. It has similar sharp bracketed serifs as shown in your posting.</p>
      <p>Here it is in narrow: <a href="https://www.klim.co.nz/retail-fonts/domaine-display-narrow/" title="https://www.klim.co.nz/retail-fonts/domaine-display-narrow/">https://www.klim.co.nz/retail-fonts/domaine-display-narrow/</a></p>
      <p>Alternatively, there's Turnip. It smells like a farm animal, and I don't think I'm getting that from the name alone:</p>
      <p><a href="http://www.fontbureau.com/fonts/turnip/" title="http://www.fontbureau.com/fonts/turnip/">http://www.fontbureau.com/fonts/turnip/</a></p>
      <p>Best of luck!</p>
