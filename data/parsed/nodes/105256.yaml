    <p>I'm putting together some signage for a farmer friend, and he really wants a conventional "farmstand" aesthetic. He showed me an old sign from his barn (attached) that he really likes, and wants something along the same lines. I realize many traditional farm signage was hand lettered, but I really am looking to purchase a font in this case, mostly for the sake of time. Anyone know of  a good source? My first instinct was Letterhead Fonts, but nothing there really did the trick for me.</p>
