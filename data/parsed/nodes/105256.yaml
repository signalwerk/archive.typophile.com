      <p>You haven't reposted this to another section yet, so I'll go ahead and put my answer here. </p>
      <p>If this is for a small farm stand (eggs, vegetables, etc sold by a family member in front of a farm), I think a hand lettered sign would be far more appropriate than a slick, professional sign. In fact when I was a design student in college, my professor used a farmstand sign as an example of a situation where a crude, hand-lettered sign on a piece of cardboard or plywood was entirely appropriate, and communicated the proper message. </p>
      <p>As for the screen shot, that might be appropriate for a company selling farm equipment, but not for a farmer's child selling eggs by the driveway. If you want to use a font, I'd suggest looking for one that looks handwritten but is easy to read and perhaps has a bit of style, as if the farmer's artistic wife made it.</p>
      <p>(But if this is a bigger setup, like a building or large professional stand that's more like a retail store, then that's a different situation.)</p>
