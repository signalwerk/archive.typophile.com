    html: |-
      <p>"Chris, but are you sure you wouldn’t feel the same about any other alphabet that you would happen to grow up with? And then stress its particularities as exactly the things you love about it?"</p>
      <p>Actually, my first alphabet was Greek. With Greek, I find the capitals too distant in form from the lowercase. Granted, they came many years apart. The capitals were more influenced by Phoenician culture and the lowercase more Byzantine and Turkish so I can understand the disconnect. When it came to typesetting, Europeans had a predominant influence and brought the technology after the Greeks were free of the Ottomans. There was no original Greek type by native Greeks for years. The caps became very Roman looking but the lowercase is its own world. Gerry Leonidas does a brilliant job with describing the history and is far better the person to describe it than me.</p>
      <p>Getting back to your point, Nina, I feel I am more in love with latin as a graphic designer and user of type than I am of its written script and early history. I like the pages it makes and the even texture. I like the way it adapts to so many typeforms and styles and not so fussy a tradition to follow. I don't see this with large quantities of very calligraphic scripts like Arabic or Chinese. To me, Chinese looks great in small quantities and is more lovable written with a brush than typeset. I must admit that Palatino Arabic, designed by Nadine Chahine, has really made me more of a believer in Arabic as a typeface rather than a written script!</p>
      <p>I don't think a person can ever escape their early upbringing and feel a level of comfort with what they know best. Others can develop a hatred for type coming from a culture they blame for some wrongdoing. Blackletter has been given an unfair demonic label because many people equate it with the Nazis even though it was around for hundreds of years before there was such a group as the Nazis.</p>
      <p>I quite readily admit to being a lover of letters or symbols and don't feel any need to dislike any in particular. I have grown to like Cyrillic even though it is just plain insane as a system that was designed as a whole. There are plenty of glyph pairings in Cyrillic that just look stupid together but I guess that is what happens when the king makes the decisions and nobody can say, "Dude, that really does not work" like we can here in the Critique forum. :-)</p>
      <p>Writing and typesetting is an outgrowth of culture and therefore subject to strange combinations of thought or accident. I just accept this and take my job as a designer to just work with it rather than damn the whole culture for daring to differ from what I would have done if I were the supreme master, King, Czar, Clergy, Poet, Philosopher, Learned Teacher, or Tyrant.</p>
      <p>ChrisL</p>
