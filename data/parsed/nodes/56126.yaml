      <p>I think one objective measure for the aesthetics of a given script is how much the people who actually use it day to day care about its presentation -- which in turn could be measured by how prominent, prevalent and well developed the art of calligraphy is for that script. By this standard I believe Chinese (and Japanese, which could be considered a variation of Chinese) would clearly come first, Arabic probably second.</p>
      <p>AFAIK, nowhere in the world is the ratio between the number of professional (full-time) calligraphers versus painters nearly as high as in China. Same goes for the ratio between calligraphic versus typographic signs and logos (of course I'm not talking about signs that are written by hand because there's not enough money to pay for a printed one, I'm talking about signs featuring professional calligraphy that usually costs quite a bit).</p>
