      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CodexRunicus_5134.jpg"></div><p></p>
      <p>While I have to agree the shapes of the fuþark really aren't very pretty in themselves, I think they have a great decorative kind of beauty. And when written rather than carved in wood or stone, I think they had great potential that were never properly developed. Also, one has to admire an alphabet that supposedly were deprecated (is that the right word?) around 1300, but still were in daily use in Telemark in the early 19th century. The last authentic rune inscriptions were made in Dalarna around 1910, supposedly. </p>
      <p>I think the Latin alphabet is beautiful <em>because</em> of its inconsistence. And because of its unsurpassed extensibility.</p>
