      <p>The initial question is a nice provocation. How to measure beauty, apart from heralding one’s personal preferences?<br>
      You can hardly compare Sinhala to Runes to Latin. And yet – we do ;-)<br>
      For me, the most beautiful alphabet is the classical one. And there is a classical style in Arabic, in Chinese, in Latin a.s.o. It may be interesting to compare these particular renderings of different scripts. One is likely to find as common features: the grown rather than the constructed (which means not: the curly rather than the straight!), a subtle detailing and balance between strenght and liveliness. When some do claim here, that they find Runes for instance rather not appealing, it may have something to do with the fact that the script hardly reached a matured state of classicism (Klassizität) in history. Which does not mean that it can’t reach that level at all.<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/A_Runes#1_6564.jpg"></div><p></p>
