      <p>@Hrant:</p>
      <p>I was not talking about the Chinese being proud of their script -- obviously, most people in the world are proud of their respective script. I was talking about the Chinese giving extra emphasis to -- or one could say, being obsessed over -- the aesthetics of their writings. In other words, there's a difference between interest in the function and being interest in the form (not that the two were mutually exclusive), while the former is universal, the latter is quantitatively unique to the Chinese. An intense obsession over the aesthetics, multiplied with the ancient age of the Chinese script, would suggest that there has been more cumulative effort in improving this script's beauty than any other script.</p>
