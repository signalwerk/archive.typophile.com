      <p>@John:</p>
      <p>I know, that's why applying the "calligraphy test", I ranked Arabic second after Chinese. I also think the degree of calligraphic obsession can be plausibly explained by the systemic properties of the scripts themselves: As the only surviving ideographic script, Chinese has a higher complexity and thus a higher potential for calligraphic distortion than any alphabetic script. Among the alphabetic scripts, contextual scripts (or "complex scripts") have the highest potential -- like Arabic, or Tibetan.</p>
      <p>I'd also argue that the strong presence of religion encourages calligraphy, because no other kind of texts is copied as often and held as highly as religious teachings. When you're copying the same text day in, day out, you'd almost automatically start to pay attention to the aesthetics of your handwriting -- and that of the original you're copying from, if only for some distraction. And because you hold the text highly, you feel a special drive to perfect its presentation. It's no coincidence that historically, a significant percentage of calligraphers -- of all scripts -- were monks.</p>
      <p>@sii:</p>
      <p>You're right. Of course, at the time the law was enacted, there was no Windows Vista yet.</p>
