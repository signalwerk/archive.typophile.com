      <p>Regarding the future of Tibetan, we should separate the social and the technical aspect of its development. Socially, the script is undoubtedly dying -- in that the number of people reading and writing it on a daily basis is decreasing. On the other hand, the vast majority of Tibetans were illiterate before the Communists came, so the number of Tibetan who're *able* to read and write Tibetan are most certainly a multitude of what it was back then.</p>
      <p>Technically, as sii has noted above, the Chinese government has really done a lot of work for the development of "minority languages" such as Tibetan, both in classical terms -- building dictionaries, creating language education programs, etc. -- and in modern terms -- pushing for digital standardization and international accessibility. For instance, because a fairly recent Chinese law demands that all computer OS sold in China to have display support the full range of the GB18030 encoding standard, the Chinese version of Windows comes with an font named "SimSun (Founder Extended)" that can display Tibetan. (However, I believe one still needs to activate the system support for "complex script", which isn't activated by default in the Chinese version of Windows.)</p>
