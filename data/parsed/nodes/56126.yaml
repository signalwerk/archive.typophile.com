      <p>That's a gross oversimplification. As languages evolved, they had to reflect the sound changes, while maintaining etymological logic and consistency. French, for instance, had evolved to a stage were too many words had become homonyms, so accents, cedillas and circumflexes were needed. Portuguese and Lithuanian, for instance, lost a lot of final n's and m's, which led to the nasalization of the preseding wovels, expressed by adding a tilde in Portuguese and an ogonek in Lithuanian. The umlaut of the Germanic languages expresses the changed wovel, while keeping the relationship to the root. And so on and on. This is the kind of extension I'm talking about. One alphabet made usable for several related languages. How did the West make money on Romanian putting a circumflex over an a when its pronounciation changed to i, of etymological reasons? Brilliant minds have made the Latin alphabet work better than any other alphabet in the world. When Turkish was written with Arabic script, it was close to incomprehensible, because of the crucial vowel harmony that just could not be properly expressed. </p>
      <p>&gt; That’s just apologism.</p>
      <p>No, it's not. That's what I think.</p>
