      <p>Nina: <cite>Regarding the adaptability of Latin (vs. more complex scripts) to different styles, that’s a good point. But this would also hold true for other scripts that have a limited character set, limited complexity, and maybe somewhat disconnected lettershapes, no? Like Greek. Or Cyrillic. Or many others in fact.* Am I mistaken?</cite></p>
      <p>I think they could, potentially, but they often don't. My guess is that Hrant's comment about resisting assimilation has something to do with it. People using Latin script feel no need to defend it against the hegemony of some other culture, so they do all sorts of wacky stuff to it, but users of less dominant scripts are often very conservative. Even, ironically, when the style being protected is itself a product of past cultural hegemony. Cherokee script, for example, is locked into a model based on American typography of the early nineteenth century; if you tried to make a Garamond Cherokee or a runic Cherokee or a brush-stroke Cherokee, I don't think it would easily be accepted as culturally authentic.</p>
