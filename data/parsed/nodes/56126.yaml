      <p>"But isn’t that exactly the case with Latin too? I agree though that in Greek the difference seems even more pronounced,"</p>
      <p>Yes, Nina, The Greek is orders of magnitude different in its current state still while the Latin has grown more familial as time has gone by. There have been centuries of Latin type designers around to do many thousands of fonts since Guttenberg. The Greeks had to make do with what the Dutch and Brittish could do with existing equipment in Greece and this brought numerous limitations including using Latin punches for Greek capitals where possible. The Europeans had no malice in their actions, they were just making do with the tools available. Without the Latin-script-using Europeans, there would have been no Greek type at all for even more centuries.<br>
      The other issue is the number of native Greek type designers. How many type designers of Latin fonts can you name who are dead, even long dead? How many Greek type designers are from more than a century ago? Damn few if any. Almost all native Greek type designers are still alive today and most of them are young and just beginning their careers. I predict that their influence has not barely begun and will make its mark in the decades to come. Most type you have seen which has a Greek character set was not designed by Greeks. This will change. Gerry's young students will make their names known and there will be a fabulous era of Greek type to come soon.</p>
      <p>ChrisL</p>
