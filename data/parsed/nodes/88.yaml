    html: <p>Strange. I quite recently purchased licences for  <br>the Cholla family through my job, and both the  <br>Tarzana and Solex families personally, and  <br>simultaneously took advantage of their free Euro  <br>upgrade of my previous licences. At my job the  <br>shopping cart system worked smooth as a baby's  <br>bum, but at home I  had some problems too. After  <br>a fax and two phone calls, they e-mailed me all the  <br>licenses no prob. Even twice, as the first e-mails  <br>somehow got held up and I needed the volumes fast. <br> <br>It's true that sometimes when communicating with  <br>Emigre's sales department you can experience some  <br>hick-ups, but usually that's not fatal. <br>Maybe it could be an idea to gather some less good  <br>experiences and submit them to Emigre.</p>
