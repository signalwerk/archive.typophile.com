  html: |-
    <p>This sample was sent to me asking to know what font the Costa Cruise folks were using on their site (<a href="http:www.costacruises.com">http:www.costacruises.com</a>). The E is shaped like a C with a line in the middle, the 'a' is single-storey, the U has a stem, and the 'y' has a u-shaped bowl. It doesn't show up in the Sans Serif ID Guide, even though its attributes are distinctive, and there were enough letters to assign the full set of style codes.</p>
    <p>Anyone recognize this font? Thanks for any help.</p>
