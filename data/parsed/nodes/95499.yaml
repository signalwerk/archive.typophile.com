    html: |-
      <p>The numbers you've listed refer to the series number (128) and the point size (48).<br>
      Those are Giant mats (as opposed to Composition or Display mats), so you need to track down a listing of Monotype Series numbers made in Giant mats and that will tell you what you've got.</p>
