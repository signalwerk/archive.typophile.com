    html: |-
      <p>Hinting is what goes into the font, and rasterizing is the process of taking that hinted font and turning it into a pattern of pixels on screen or dots in print.</p>
      <p><em>"Hinting has some relevance to 600 dpi, but not a ton at normal text sizes. Very small type at 600 dpi benefits quite a bit from good hinting (think 5-8 pt). At 300 dpi hinting matters a lot. At imagesetter resolutions, it matters very little."</em><br>
      Thomas Phinney</p>
