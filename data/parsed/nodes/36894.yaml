      <p>Having made the decision to ship Typophile gear outside the US (since 40% of users are not in the US) I can understand Veer's decision. It is a) very expensive and b) hard to automate. When we ship gear it means somebody actually has to wait in line at a Post Office to fill out a customs claim form. </p>
      <p>So, ahem, buy some <a href="http://typophile.bigcartel.com" rel="nofollow">Typophile gear</a> and we'll ship it to you no matter where you are... just don't be shocked if a $22 shirt costs $13+ USD to ship.</p>
