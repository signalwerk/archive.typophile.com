      <p>I suppose I should add there is little reason for CIP data to be in the same graphical form anymore. Firstly, library sales are way off. More important is that few libraries use physical card catalogs anymore. Still, a few publishers (their editors, really) hang on to the notion.</p>
      <p>Since Eckersley was a very influential book designer, even more attention is being paid to the copyright page. What few remember is that late in his life,* Richard allowed it was silly to make all front mater pages look the same (includes adhering to a grid for them), so a lot of the "design attempts" for copyright pages sort of miss his point.</p>
      <p>*Paper given at the AAUP annual meeting in St. Louis. I forget the year -- it was the same one Carter &amp; Creesy gave the presentation on the Monticello revival in PostScript for Princeton University Press.</p>
