      <blockquote><p> We just love telling everyone about the face we used for our books.</p></blockquote>
      <p>Yes, you do. Problem is, no one else cares much. Just what do you think the hierarchy is at a publishing house, anyway? Design is right above janitorial &amp; below everything else. On good days.</p>
      <p>Editors (who control copy) hope the designer picks a good typeface. That's like saying "wears sensible shoes." You'll note the typefaces the original poster mentioned were "Sabon," "Garamond" etc. What does editorial say if the designer doesn't pick a sensible typeface? They say NO. And they win.</p>
      <p>It's OK to live in you own world. If you start thinking it's everyone's world, there is a lot of disappointment headed your way.</p>
