      <p>I think we can spread out from books on type or typography and find this infiltrating everything else. </p>
      <p>Nearly every book about typography I've read has either had a colophon or given attribution for the typeface. Spreading out, books about graphic design seem to be keen on this. Related to this scene is art photography, which often follows the pattern. Further out, any novel or book that is very "designed" these days seems to attribute the typeface. I can definitely see the 5-10 year thing, but it's happened a long time with books by Typophiles. We just love telling everyone about the face we used for our books.</p>
