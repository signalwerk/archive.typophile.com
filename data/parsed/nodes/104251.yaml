      <p>What follows is all based on publishing in America...</p>
      <p>With respect to the information on the copyright page, it's a fairly recent trend -- recent meaning the last 5-10 years. It did happen before, but was rare. Often accompanies an acknowledgment for the interior designer.</p>
      <p>Not really sure why the copyright page has taken off this way. It's always been a place for legal acknowledgments, and note that country of manufacture use to be a legal matter for copyright, as a U.S. copyright use to require U.S. manufacture. </p>
      <p>The copyright page was also a logical place for the Library of Congress Cataloging in Publication Data (CIP). As photocopy machines became common (&amp; card catalogs were still in use) there was a requirement that the CIP data be graphically in the form the LOC sent the publisher. The card catalog card could just be photocopied from the copyright page, and the book got into circulation much faster. That could help sales as well. </p>
      <p>However,  that "exact graphic form"  requirement annoyed some designers, esp. Richard Eckersley, and he was somewhat vocal about this.  The net result was more design effort was put into the copyright page, and that occasioned more editorial attention (editors wanted to make sure the Libraries &amp; LOC was happy). So, I suppose, minor acknowledgements beyond legal ones began to creep on to the page.</p>
      <p>Some of this is speculation, but is based on I" was there" experiences with the whole matter.</p>
      <p>* * *</p>
      <p>Even with the newer practice of adding blanks to a book to reach even forms, using a colophon is quite rare. Probably because no one at the publishing house has the knowledge. Usually when we're asked to set one, the designer asks us about the typeface, they have no knowledge about it. Easier for them to just use blanks.</p>
      <p>There's a thought for type designers. If you want a press to promote your type, write colophon information &amp; include it with all the downloads. Just remember  (1) be modest, (2) be very brief, and (3) remember, nobody reads text file attachments to fonts anyway.</p>
