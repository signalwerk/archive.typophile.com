      <blockquote><p>That's too black-and-white. </p></blockquote>
      <p>I imagine, in the world that use to rely on hand lettering -- the advertising world, wasn't it? Seems to me that 90+ percent of the new fonts are aimed at replacing hand lettering. I will allow I'm somewhat parochial, I don't know much about what goes on in Central &amp; Eastern Europe. Maybe things are different.</p>
      <p>But we're talking about books in this thread. Just for example -- in the States -- how many times do you see a printed book from a publisher with an imprint that (1) isn't an art book, yet (2) uses a sans-serif font for text?</p>
      <p>BTW, we're talking about books, and not jackets. Tschichold's old dicta "first thing you do when you buy a book is to throw away the jacket" may not be much followed anymore. Probably we should. At a publishing house, book jackets (for those that don't know), are the purvey of marketing, not editorial. And most "book designers" want to be jacket designers. The number of people who can put together a good book interior is quite small these days, where "good" has to satisfy audiences beyond the design/fashion world.</p>
