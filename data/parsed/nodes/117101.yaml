      <p>Today's trivia. Clearface Gothic is a Morris Fuller Benton design dating from 1910. The "reverse seven" ampersand is not shown as part of the font in specimen books that I have seen before the ATF specimen book of 1923. In my opinion creation of the  "reverse seven" ampersand design probably dates to somewhere between 1910 and 1923.<br>
      Don</p>
