    html: <p>I was looking in depth at the basic construction of a bitmap font and wanted to know more about the correaltion between the size of the squares used for example by Silkscreen (which is only used optimally at 8 pt) and its .014 in. square that  builds the form. <br> <br>Looking at my options and the time I have my approach will probably take this course.  Using a set grid, design a screen-based font that will have a set base alphabet and at least one parallel-varied set that shows the effects of untruthful statements with a varying line width,  extended stems, enlarge counters, etc...  It probably will not be optimal to read at the size needed for a closed captioning system, but I hope my main idea will still come across. <br> <br>Maybe in the future I can extend the family and incorporate more of the research into it. <br> <br>Any other encouraging information is welcome though if you feel I can accomplish the fuller idea or verison of it in a smaller time frame. <br> <br>josh</p>
