    html: <p>(Wow, I am going to break my "never reply to Hrant" rule for the first time in months.) <br> <br>That's not true. Type 1 (and OpenType CFF) fonts can be built at any em scale, as long as all points and metrics are within +/- 4096 units. <br> <br>Additionally, specifying size in points for a font intended to be used on screen is meaningless, unless the output device is also defined. There's a good reason folks developing screen fonts talk about size in ppem (pixels per em). This does correspond to points in classical Mac-speak, but the conversion from ppem to points involves multiplying by 3/4 for classical Windows-speak. That is to say, 12 ppem equals 12 point on Mac, but 9 point on Windows. If you want to optimize something for "12 point display" on both Mac and Windows, you need to optimize both the 12 and 16 ppem sizes. <br> <br>Cheers, <br> <br>T</p>
