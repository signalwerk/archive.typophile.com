  html: <p>Hooray for my first post. As I am reading through the forums I am truly honored by the amount of talented people there are on this site. <br> <br>I am a student currently working on a theoretical type project based on the idea of truth. The basis is derived from the idea of vocal pattern truth recognition that is being used in fields like airport security. My goal is to create a typeface for screen applications(TV/Closed captioning is my first goal)that analyzes the vocal patterns of a speaker and determines the truth of their words and will alter the type if lies are told. Think a lie detector that a television viewer can turn on to determine whether any of the words spoken by Bush are true. <br> <br>I will be building a full character set with UC and lc which is kind of a new thing for captioning. They use lc but sparingly. I want to do this because I think that the lc has the possibilities for more variations. <br> <br>I am pretty solid about my idea's focus and it's potential benefits, but I am very nervous since my knowledge of building typefaces for screen is more limited than my knowledge for print(which is beginner also).  So when I pose questions don't assume that anything is obvious please.  I would really like to understand the ideas behind legible screen fonts and make my project a success. <br> <br>Since I am building an original typeface that is bound for the  screen should I design it as an outline first, then translate it to screen/pixel whatever? <br> <br>If I am designing the type and its structural variations with HDTV(1920 x 1080 res.)in mind, is the process different for building a typeface from that resolution vs. a standard TV we used today?  How and why are good here also. <br> <br>My money, time and resources are limited since it is a school project.  What should I be looking at to create this? <br> <br>Any others words would be greatly appreciated if you can help me with this?  Sometimes it easier for me to answer and understand than pose and wait. <br> <br>jp <br> <br> <br> <br> <br> <br></p>
