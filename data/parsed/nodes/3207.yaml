    html: "<p>Interesting. <br>How will the type change based on \"truthfulness\"? <br> <br>As for screen design: <br>1) Ignore print - it will reduce the quality of your screen work. Don't make an outline font unless you have to. <br>2) Figure out what vertical span (in pixels) you'll have. <br>3) Figure out how horizontally economical the font has to be. <br>4) Try to get a handle on the types of fidelity loss you'll encounter, and design with that in mind, like by incorporating trapping* (which is not just for outline fonts - video \"bleeds\" too). <br>5) Define the types of emphasis you need (noting that the traditional method -italics- is lousy onscreen). <br>6) Use grayscale pixels if you can. <br> <br>There's a lot of precedent for video fonts**, but to me none of them are really good enough - you have a chance to break promising new ground. <br> <br>* <a href=\"http://www.themicrofoundry.com/ss_trapping1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_trapping1.html</a> <br> <br>** Like this: <a href=\"http://www.myfonts.com/fonts/bitstream/tiresias/\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/tiresias/</a> <br> <br>hhp <br></p>"
