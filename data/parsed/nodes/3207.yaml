    html: "<p>There are two main kinds of bitmap fonts: <br>1) \"True\" bitmap fonts where the actual pixel data is defined in bits. These are either stand-alone (like in the FON format) or embedded (in a TT font). These fonts only show up when their pre-defined pixel height is chosen. True bitmap fonts have unfortunately become second-class citizens in terms of support, especially on MacOS. <br>2) Pixelfonts (like Silkscreen), which are basically outline fonts that can be used at any point size, but which map out the correct bitmap data only when a certain point size is chosen. Pixelfonts have robust support, because the OS doesn't know the difference. <br> <br>In a pixelfont the point size you need to use to make the bitmap come out right depends on the ratio of the outline pixel squares to the em size of the font. For example if you fix the target point size to 8 and make the \"pixels\" 125 em units square, you can build a bitmap font of any vertical span you want and it'll come out right when the font is set to 8 point. This might seem counter-intuitive, but it avoids the user having to fish around for the right point size that will make the font snap into place. <br> <br>hhp <br></p>"
