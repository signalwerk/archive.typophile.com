  - id: 25118
    user: 1133
    date: 2004-02-23T01:07:00
    date_raw: 23 Feb 2004 — 1:07am
    votes: null
    html: "<p>Hrant,  <br>you wrote:  <br>\"In a pixelfont the point size you need to use to make the bitmap come out right depends on the ratio of the outline pixel squares to the em size of the font. For example if you fix the target point size to 8 and make the \"pixels\" 125 em units square, you can build a bitmap font of any vertical span you want and it'll come out right when the font is set to 8 point. This might seem counter-intuitive, but it avoids the user having to fish around for the right point size that will make the font snap into place. \"  <br> <br>While this is not inaccurate, it leaves out an important issue: the UPM size. Your calculations assume a UPM size of 1000.  <br> <br>The whole trick of the size of the grid (i.e. \"vector pixels\") is:  <br> <br>One side: At 72 dpi, the point size that you require is equal the ppem size of the font, i.e. the number of pixels that the emsquare will consist of, e.g. 8.  <br> <br>Other side: Your font's emsquare is built of a certain amount of of units, typically 1000. So we speak of 1000 UPM (units per em).  <br> <br>Since 8 pixels correspond to 1000 units, 1 pixel corresponds to 1000/8 = 125 units. This is really simple math.  <br> <br>However, note that if you use FontLab to create a font in TrueType format, you will be able to choose any number as your UPM size. Therefore, you can as easily set your UPM size to 800 and target for a 8 pixels type size, so that one pixel corresponds to 800/8 = 100 units.  <br> <br>Similarly, if you target a 20 pixels type size, you can use a UPM 1000 and then one pixel will correspond to 1000/20 = 50 units, but you can also use a UPM 200 and then one pixel will correspond to 200/20 = 10, or a UPM 2000 and then 2000/20 = 100.  <br> <br>Keeping this in mind, you will be able to easily target \"untypical\" font sizes such as 13 pixels.  <br> <br>Adam Twardoch <br>Fontlab Ltd. </p>"
    html_clean: "<p>Hrant,  <br>you wrote:  <br>\"In a pixelfont the point size you need to use to make the bitmap come out right depends on the ratio of the outline pixel squares to the em size of the font. For example if you fix the target point size to 8 and make the \"pixels\" 125 em units square, you can build a bitmap font of any vertical span you want and it'll come out right when the font is set to 8 point. This might seem counter-intuitive, but it avoids the user having to fish around for the right point size that will make the font snap into place. \"  <br> <br>While this is not inaccurate, it leaves out an important issue: the UPM size. Your calculations assume a UPM size of 1000.  <br> <br>The whole trick of the size of the grid (i.e. \"vector pixels\") is:  <br> <br>One side: At 72 dpi, the point size that you require is equal the ppem size of the font, i.e. the number of pixels that the emsquare will consist of, e.g. 8.  <br> <br>Other side: Your font's emsquare is built of a certain amount of of units, typically 1000. So we speak of 1000 UPM (units per em).  <br> <br>Since 8 pixels correspond to 1000 units, 1 pixel corresponds to 1000/8 = 125 units. This is really simple math.  <br> <br>However, note that if you use FontLab to create a font in TrueType format, you will be able to choose any number as your UPM size. Therefore, you can as easily set your UPM size to 800 and target for a 8 pixels type size, so that one pixel corresponds to 800/8 = 100 units.  <br> <br>Similarly, if you target a 20 pixels type size, you can use a UPM 1000 and then one pixel will correspond to 1000/20 = 50 units, but you can also use a UPM 200 and then one pixel will correspond to 200/20 = 10, or a UPM 2000 and then 2000/20 = 100.  <br> <br>Keeping this in mind, you will be able to easily target \"untypical\" font sizes such as 13 pixels.  <br> <br>Adam Twardoch <br>Fontlab Ltd. </p>"
