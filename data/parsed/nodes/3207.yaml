    html: "<p>For 20 pixels high defining em &amp; pixel sizes that map to 8 point is probably a bad idea, because your outlines would go more than twice over the vertical limit. What you might do instead (especially since this font seems to be for \"controlled\" use only) is define a normal em of 1000, and use pixels of 50 units square: that way you'd just chose \"20 point\" (at 72 dpi) and it would map out perfectly. <br> <br>Call it \"Icosa\".  :-) <br> <br>hhp <br></p>"
