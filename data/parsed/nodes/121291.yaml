  html: |-
    <p>I've posted in Adobe's community forums but does anyone know if Adobe's standard font license covers use of fonts in PC games? I've tried using their help system to find out directly but it seems its not possible to contact Adobe unless you either buy a product or pay for support and I don't have access to either directly at work.</p>
    <p>In my experience font foundries always require a special license for use of fonts in games. However I've been told that Adobe's standard font license covers use in games and I'd like to confirm this. I very much doubt its true but does anyone know for a fact?</p>
    <p>Thanks everyone.</p>
