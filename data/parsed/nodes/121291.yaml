    html: |-
      <p>Just an update for anyone reading this. We got replies from Adobe and Monotype. Their standard license doesn't include use for games as you'd expect. I had to ask though because we were being told it did by another party.</p>
      <p>You have to contact them directly and request a quote for use in games. Why there is no transparent pricing policy is beyond me, fonts in games must be a common request and it all seems a bit opportunist of the big font foundries to me.</p>
