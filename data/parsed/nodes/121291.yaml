      <p>Thanks for the fast reply. I got a reply from Adobe. The font we want to use is licensed by Monotype and they say we should contact them directly. However they were able to confirm that their standard license does not cover the use of fonts in games as I thought.</p>
      <p>We are trying to get out of using Adobe fonts and want to be able to choose fonts from other foundries but we're being told we have a license from Adobe that covers us. Hence the question.</p>
      <p>Thanks for taking the time to answer.</p>
