    date: 2014-11-16T13:58:00
    date_raw: 16 Nov 2014 — 1:58pm
    votes: null
    html: |-
      <p>"Why there is no transparent pricing policy is beyond me"</p>
      <p>Primarily because the font or a derivative is included with the game itself, and most foundries will charge for redistribution based on the projected distribution of the product, so a lower fee for an indy game vs a font for say Halo or Madden.</p>
