  html: |-
    <p>I wanted to applaud everyone’s efforts for keeping Typophile a family friendly, engaging and everlasting community. From my count, Typophile might possibly be the last bastion of civility on the Internet. That takes a lot of will-power, people. Of course our record isn’t exactly spotless, but we do make attempts at keeping a pretty clear head before running the mouth off because of personal tastes or disagreements. </p>
    <p>Opinions and ideas are exchanged freely and without persecution or prejudice here and that’s a marvel in this age. Granted, there aren’t many heated debates that end in fisticuffs when related to typography.</p>
    <p>So, I wanted to take a moment and thank everyone for being intelligent, patient and making Typophile a beautiful place to share thoughts and ideas without (too many) worries. It’s what keeps me coming back .</p>
    <p>Bravo.</p>
