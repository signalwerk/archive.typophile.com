    html: |-
      <p>As Jan said, the first approach is <strong>ITC Franklin Gothic LT Demi</strong> for "CARERS" and <strong>ITC Franklin Gothic Book</strong> for "RIGHTS DAY"<br>
      <a href="http://new.myfonts.com/fonts/itc/franklin-gothic/" title="http://new.myfonts.com/fonts/itc/franklin-gothic/">http://new.myfonts.com/fonts/itc/franklin-gothic/</a><br>
      It's an almost perfect match except of the little inclination on capital /C ends.</p>
      <p>If you want a better match for /C you can try <strong>Moby Dick 10 Bold</strong> for "CARERS" and <strong>Moby Dick 12</strong> for "RIGHTS DAY"<br>
      (Cambridge Fontworks)</p>
      <p><strong>Edit:</strong> I see there is at least one cut of Franklin Gothic having the correct /C, so there is no need to look for a different font.</p>
