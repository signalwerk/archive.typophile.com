    votes: null
    html: <p>In what format is the font? Are you using Adobe Type Manager? I know I’m probably not the first to advise this, but I highly recommend moving up to InDesign and OS X where such wacky rendering problems aren’t nearly as common.</p>
    html_clean: <p>In what format is the font? Are you using Adobe Type Manager? I know I’m probably not the first to advise this, but I highly recommend moving up to InDesign and OS X where such wacky rendering problems aren’t nearly as common.</p>
  - id: 101722
    user: 909
    date: 2005-12-27T13:36:00
    date_raw: 27.Dec.2005 1.36pm
    votes: null
    html: |-
      <p>I’ll bet you’re not using a PostScript output device. Just doing that would probably fix the problem.</p>
      <p>If they are Type 1 fonts, make sure ATM is set to “preserve character shapes” rather than “preserve line spacing.”</p>
      <p>Cheers,</p>
      <p>T</p>
