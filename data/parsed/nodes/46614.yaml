    <p>I’m quite new to this, so I hope you’ll forgive me asking what’s probably a really dumb question.</p>
    <p>I have a stencil font that I quite like, but the creator went a bit crazy adding stencil lines into letters that don’t need them (such as T and K), and it feels inauthentic and distracting to read. </p>
    <p>Is there a program I can use to edit the letter shapes embedded in the TrueType font file?  Or is it only possible to completely recreate the font in curves and generate a new one?</p>
