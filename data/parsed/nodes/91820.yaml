    html: <p>Thanks for your reply dear Hrant. (Sadly, I will not be able to make it to the conference.) I like Nour — correct me if I'm wrong; I've noticed that Vem(FF Ernestine) too bears resemblance to the early Bolorgir(Բոլորգիր) and Notrgir(Նոտրգիր) popularized by the Mechitarist as you've mentioned in your post. I used Vem for a project and the client finds it more legible than let's say Sylfaen. What are your thoughts on this?</p>
