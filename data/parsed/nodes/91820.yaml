    <p>Frankly speaking, I'm not interested in identifying this particular typeface. I'd like to know which foundry/punchcutter was the first to produce it and when. The earliest book typeset with this font that I've got dates back to 1880's, I suspect it was produced at a much earlier date, perhaps at the beginnings of the 19th century. Thanks for your input.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hay2_5437.png"></div><p></p>
