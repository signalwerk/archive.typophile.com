    html: |-
      <p>It's interesting that you see some Bolorgir in Vem - I hadn't thought of it that way. The slant, arch shapes and semi-serifs (which sort of all go together) probably cause that appearance, reflecting what I think makes for authentic Armenian type. In contrast, Sylfaen-Armenian has too many serifs (just like my Patria's Armenian subordinate style, shown in that PDF) although it <em>does</em> enjoy the benefit of "stroke" contrast. Sylfaen's Armenian is also too tight however. All that said, Vem actually derives much of its competence from Nina's original Latin design.</p>
      <p>hhp</p>
