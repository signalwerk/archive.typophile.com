      <p>This is Barz, which is basically a simplified (non-kerning) version of the very first Armenian type used exactly 500 years ago* in Venice.</p>
      <p>* <a href="http://www.yerevan2012.org/index.php?option=com_content&amp;view=article&amp;id=93&amp;Itemid=131&amp;lang=en" title="http://www.yerevan2012.org/index.php?option=com_content&amp;view=article&amp;id=93&amp;Itemid=131&amp;lang=en">http://www.yerevan2012.org/index.php?option=com_content&amp;view=article&amp;id=...</a></p>
      <p>Although it's old and stale (and features some confusable structures) it does embody enough cultural authenticity that I used it as one of the bases for my Nour:<br>
      <a href="http://themicrofoundry.com/ad/CR.pdf" title="http://themicrofoundry.com/ad/CR.pdf">http://themicrofoundry.com/ad/CR.pdf</a></p>
      <p>BTW, there's going to be a typographic conference in Yerevan from June 14 to 16. See you there?  :-)</p>
      <p>hhp</p>
