      <p>Of the two, I'd definitively go for the Trade Gothic/Proforma-version - it's just that much cleaner, lighter and more consistent on the retro-feeling…</p>
      <p>The four different cuts (Proforma small-caps, italic and book and the Trade Gothic) is a bit much for me - but I'm not sure how I'd scale it down... Perhaps try something different for the subheads (the Proforma Italics)…</p>
      <p>And, I'm not sure if I agree with myself on this one, but how about letting the bullets line up with those subheads? I mean, every level already has a different typographic style, I don't think the indentation really needs to be <em>that</em> prominent..? I'd also consider just a little more leading..?</p>
      <p>Oh, and you're missing an fi-ligature in the ‘business card’-field - “purveyor of <strong>fi</strong>ne graphic design services”... And, not having ever been a great fan of Proforma I've never checked - but Proforma doesn't have ff-ligatures?</p>
      <p>But all in all, I think you've done a great job on these! Loving the clean, retro look! Good luck job-hunting!</p>
