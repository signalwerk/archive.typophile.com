    <p>I'm a student about to have my final review before graduation, and I've been agonizing over the type in my resume/business card. Because of administrative idiocy I was unable to take the advanced typography class but have tried my best to progress on my own, but my confidence is shaky and I'm somewhat unsure of myself. I've done a lot of lurking on these forums and many of my decisions regarding type and format of this resume are inspired ideas I've seen here, as I'm sure you'll notice.</p>
    <p>I'm trying to communicate that I love clean, simple design that shows a respect and inspiration from the past while embracing the current. I also want to show some friendliness, cleverness, humor. I love classic, tried and true typefaces but am constantly infatuated with fun, new beautiful options. I'm dying to get into the professional environment and learn. I'm just now really trying to develop my own sense of what faces go together well based on proportions, origin, etc. I feel like that's somewhere many of my typophobic classmates might be pretty lacking. </p>
    <p>If the 2 typefaces are just too much, let me know and I'll pare it down. As for suggestions of other typefaces, I have a surprisingly good selection of (many probably pirated.. ugh) typefaces at work so chances are I'll have access to whatever you're suggesting. I can spend a little money on purchasing a typeface if I fall in love with it and it's not overly pricey.</p>
    <p> I've posted 2 versions of my resume, which is on my personal letterhead. My personal information on the letterhead is basically my businesscard, so I would love an independent critique of that as well. I can post an image of that alone if needed.</p>
    <p>One is set in Trade Gothic LT Std - Bold Condensed No. 18 and Proforma</p>
    <p>The other version is set in Dolly and Auto 2</p>
    <p>Tear it up! I can take it. And thanks =)</p>
    <p>ps - No fine kerning has been done yet, just fyi</p>
