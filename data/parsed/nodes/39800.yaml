      <p>'I’m trying to communicate that I love clean, simple design that shows a respect and inspiration from the past while embracing the current. I also want to show some friendliness, cleverness, humor. I love classic, tried and true typefaces but am constantly infatuated with fun, new beautiful options.'</p>
      <p>I like the Dolly and Auto combination because I feel it has a very cute character. I think the composition is fairly clean (which is cool) but maybe you could use your grid a bit more – your only using one column. This could help you to break down the information into yummy bite sizes rather the huge mouth-fulls. I don't mind your typeface choices but I think the positioning and composition could be improved.</p>
