    html: |-
      <p>FWIW, I recently looked at eths in quite a stack of Faroese books to see what kinds of eths they like to use. Granted this was mostly text type, but the main question there seems to be how curved (≈ more traditional) or straight (≈ more current) the ascender is, and how to incorporate the crossbar. There seems to be quite a strong custom of leaving the top of the ascender weak, without a terminal; <a href="http://briem.ismennt.is/2/2.11/2.1.4.eth.htm" rel="nofollow">the approach proposed by Briem</a>, i.e. deducing the ascender from the parenthesis, suggests this too – although he says you can also use the numeral 9 as a starting point.<br>
      So, dunno, does your 9 have a ball?</p>
