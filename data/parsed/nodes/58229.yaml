    html: |-
      <p>I'm Icelandic. It's a very readable eth and looks fine. However, ball terminals not being usual on eths it could strike some natives as a bit "foreign," i.e. it does give away the fact that the typeface wasn't designed by someone who uses the language.</p>
      <p>Taking a look at the typeface's 9 and going from there is a good idea. But really, Icelanders being used to finding nothing, a ligature or, at best, a striked d, in the eth spot, this is great.</p>
      <p>If you leave the terminal on I would suggest slanting the crossbar just a tiny bit more, though.</p>
      <p>And that OverKill eth looks hideous.</p>
