    date: 2003-03-22T10:04:00
    votes: null
    html: "<p>thanks rodolfo and hrant. sorry for not replying it sooner. <br> <br> <br><i>&gt;About your caps: haven't looked at the PDF  <br>&gt;yet, but from your gif I think I rather prefer  <br>&gt;the narrower version. That doesn't mean it  <br>&gt;couldn't be a tad less narrow than in 01.</i> <br> <br>i'll try new variations... <br> <br> <br><i>&gt;I did it when I was developing Houaiss but  <br>&gt;not systematically and not in the scale I would  <br>&gt;have liked - there was no budget for that.</i> <br> <br>what do you mean \"not systematically\"? <br>if you had no budget in that huge project, i <br>wonder how i was supposed to do it for my small <br>project. ;) <br> <br> <br><i>&gt;Considering how type design is conducted  <br>&gt;nowadays (generally small firms, mostly  <br>&gt;one-person firms) I don't think formal testing  <br>&gt;is really something that is done. I'm not sure  <br>&gt;about larger and more organized firms like  <br>&gt;FontBureau.</i> <br> <br>this is just what i expected. <br> <br> <br><i>&gt;Going back to the typology above,  <br>&gt;there is a craftsman's spirit in the thing -  <br>&gt;and craftsmen don't conduct tests, they rely  <br>&gt;on their ingrained experience (what passes for  <br>&gt;intuition) for decisions.</i> <br> <br>there are intuitive <i>and</i> logical solutions in maest, <br>like any other typeface. <br> <br> <br><i>&gt;I'd like to go back for a moment to the n/u  <br>&gt;question and the small montage I made with  <br>&gt;your type, that was not commented:</i> <br> <br>i didn't comment that because i needed to <br>think more about it. <br>but i liked the montage. ;) <br> <br> <br><i>&gt;What's interesting here is that the same glyph  <br>&gt;can stand for two different characters and  <br>&gt;remain perfectly legible, without confusion,  <br>&gt;depending only on context and lexicon (this is  <br>&gt;the principle that was taken to its painful limit  <br>&gt;in Tobias Frere-Jones's Sum of the Parts).  <br>&gt;This means that, by itself, it's not unambiguously  <br>&gt;decipherable. Is this a problem? In most typefaces  <br>&gt;it would be. <br>&gt; <br>&gt;This is exactly the difference between legibility and readability in a font.</i> <br> <br>i think hrant's words are better: instead of \"confusion x <br>function\", let's call it \"readability x legibility\". in  <br>rodolfo's montage, both words are readable. but <br>\"function\", where [n=flipped u], is more legible:  <br>anyone can tell which one is n and which one is u. in  <br>the word \"confusion\", where [u=n], we have  <br>ambiguity, but we are still able to read and  <br>understand it. <br> <br>in the actual font, n differs from u, but i guess for  <br>some people it is too close to their own \"self- <br>conscious\" image of an u. that's why rodolfo pointed  <br>it in \"Ninfa\". in the other hand, as we know, reading  <br>is not a fully \"conscious\" task, and that's why i think  <br>the original n/u works. it will work even better in  <br>small (text) sizes, as sean commented before,  <br>probably because reading it requires less visual  <br>\"consciousness\" than reading in bigger (display)  <br>sizes. <br>(is this making any sense? ;) <br> <br> <br><i>&gt;You could, just for fun, conduct a  <br>&gt;test with this glyph. For instance: are your  <br>&gt;Japanese grandparents still alive? Do they read  <br>&gt;Portuguese? (badly, I suppose?). You could prepare  <br>&gt;some sample texts, including \"trap\" words where  <br>&gt;this glyph could be read either way and see what  <br>&gt;they make of them. Do the same thing with young,  <br>&gt;competent readers (aren't these two adjectives  <br>&gt;contradictory? ;) and see what you get. Have fun.</i> <br> <br>i think the \"young competent readers\" test was already <br>done. i showed it (roughly the same sample i posted <br>here) to a few non-designer colleagues, and nobody <br>complained about anything. actually, they seemed <br>like don't care about it. i'll try showing it to older <br>people (not my grandparents; they barely know <br>portuguese). <br> <br></p>"
