    date: 2003-03-19T07:20:00
    votes: null
    html: "<p>Also:  <br>&gt;<i>...testing actual readers...</i> <br> <br>Agreed. The key word here is <i>readers</i>.  <br>Not designers or craftsmen.  <br> <br>&gt;<i>one may well choose sometimes to  <br>enhance a stylistic aspect in [slight] detraction  <br>from a functional one. In a face like Maest -  <br>largely driven by a formal principle - this would  <br>be a perfectly valid decision,</i> <br> <br>Again, in this case, \"n\" I think passes. <br> <br>&gt;<i>no need to test anything when it's only a  <br>vehicle for self-expression </i> <br> <br>Maest is more than this. <br> <br>&gt;<i>I guess it's simpler than that: the n may  <br>be too much like an u.</i> <br> <br>I had no problem reading the sample. <br> <br>-smc <br> <br></p>"
  - id: 67621
