    date: 2003-03-17T13:55:00
    votes: null
    html: <p>Eduardo <br> <br>i like it a loti agree with rodolfo about the n/u problem, but my main critic is the bottom of your lc "c" and "e", i think it should be more extended, at small sizes it looks to weak to me. <br> <br>for me maest its much better than newberlin, here the beautifull contradiction betwen straight lines and the cursive type is more evident. <br> <br>CG</p>
  - id: 67613
