    html: "<p>It's nice, Eduardo. I suppose that you're aware of     <br>Peter Verheul's Newberlin, that also uses straight lines     <br>only. But I find your Maest more interesting. I agree     <br>that there's a crispness in the lc that the UC is     <br>lacking somewhat. Some of its characters could be a bit     <br>narrower, the bowls of P and R a little smaller.    <br>    <br>I'm not sure whether the sort of variation in the spacing     <br>rhythm that you have here was intentional or not. For     <br>instance: how letters seem to coalesce in 'qua', only to     <br>disperse again in 'scele' (and especially in 'ss' ;). This     <br>\"elastic\" behaviour may bother some people (not me).    <br>    <br>One possible problem that I see is that in smaller settings     <br>the 'n' could be mistaken for an 'u'. Also, there may be     <br>a problem in certain cases with the gap created by     <br>the 'c' in some combinations (like ci, ct). But generally     <br>it will work, I think.    <br>    <br>abra</p>"
  - id: 67612
    user_id: 659
    user_name: cgonzalez
    user_path: null
