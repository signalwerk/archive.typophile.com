    html: "<p><i>&gt;n/u problem   <br>i'm with sean: this doesn't bother me either.</i>  <br>  <br>I'm not sure whether it is a matter of you being bothered   <br>or a matter of testing actual readers to see if there   <br>may be a problem here.(*) (I'm using the conditional   <br>since the first time around.) Type, like any kind of   <br>design, demands testing. Again, depending on what one   <br>expects from one's typeface (no need to test anything   <br>when it's only a vehicle for self-expression ;). Also:   <br>one may well choose sometimes to enhance a stylistic   <br>aspect in [slight] detraction from a functional one. In   <br>a face like Maest - largely driven by a formal principle   <br>- this would be a perfectly valid decision, btw.  <br>  <br>  <br><i>&gt;variation in the spacing rhythm   <br>  <br>this is just bad spacing. it wasn't supposed to be so   <br>irregular, so i'm going to fix it. ;)  <br>  <br>&gt;if there really was a consistant up and down or   <br>at least irregualar action/flow of line.   <br>  <br>good point tiffany. i think i'm just going to make the   <br>characters' baselines more regular</i>  <br>  <br>In the s there is certainly a spacing problem. But in   <br>both the aspects above I'd be careful not to regularize   <br>it <i>too</i> much. It could lose some of its charm. ;)  <br>  <br>abra</p>"
