    html: <p>Eduardo,  <br>  <br>With all this  discussiou oops...  discussio<i><b>n</b></i> over the "n".   <br>No one commented on your second PDF - the one   <br>with other versions or stages that your design  <br>has seen.  <br>  <br>I think the caps in 2 are great! For me, they   <br>really add to the rhythm. Look at the "M" in   <br>"Midas" for instance. In 2 it flows really nice.   <br>While in 4, I sort of pause when I reach it. I am  <br>not saying 4 is is not pretty I just think 2 might   <br>be a bit more consistent in expressing the   <br>personality of Maest. But it really depends on what <br>your goals are. I think you mentioned that you were  <br>really trying to be disciplined in your design.  <br>I say loosen up a bit and let the type face design  <br>itself just a little bit more. <br>  <br>You could take 2 even further and create   <br>swash characters as an addition. That would   <br>be really cool! In addition this could help to  <br>separate it even further from the designs that  <br>where mentioned earlier. <br> <br>But then again 2 will raise even more legibility issues. <br>Do the "I", "J", and "T" look too much alike? And then you <br>have the whole "n" story all over again. What a story it told. <br> <br>I think that UC "U" would look cool and be more calligraphic  <br>with a stem coming down the on the right. Like a LC. <br>  <br>Thanks for posting your second PDF. I really   <br>like it.  <br>  <br>-smc</p>
