    user_image: /files/pictures/picture-1250.gif
    date_raw: 19 Mar 2003 — 9:32am
    date: 2003-03-19T09:32:00
    votes: null
    html: <p>&gt; The key word here is readers. <br> <br>Well, agreed. But readers (which I prefer to call "users", since there's more to communication than reading) don't design their own stuff. Designers do that for them. And the point is that a real designer is not an artist because an artist's main motivation is self-expression. That doesn't mean there's no art in design - not at all. In fact there is unavoidably art in anything a human does - which is a good thing. The main difference between Art and Craft is <i>motivation</i>. <br> <br>Testing is exactly something that a designer needs to do but an artists will not. <br> <br>hhp <br></p>
