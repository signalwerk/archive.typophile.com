    html: "<p><i>&gt; Type, like any kind of design, demands testing.  <br>Right on. It's a craft.</i> <br> <br>Well, let me disagree. Let's say, as an exercise, that <br>there are three kinds of people in this thing: artists,  <br>craftsmen and designers. I prefer to think that I'm in  <br>the third group. You, I know, like to see yourself in  <br>the second one. <br> <br><i>Maybe it contains a familiar letter-string that made  <br>it into a powerful [what's called] pseudo-word.</i> <br> <br>I guess it's simpler than that: the n may be too much  <br>like an u. I'd call it (sorry, Eduardo! ;) a matter of <br><img src=\"http://www.typophile.com/forums/messages/29/7795.gif\" alt=\"coufusiou\"></p>"
