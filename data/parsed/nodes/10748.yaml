    html: <p>Nice. I enjoy the irregularity and think it too many of the characters conformed to the same rules it wouldn't have the same flavor at all. If anything I would think it would be good to have alternates for the characters so that the user could keep this irregularity more consistant. For instance in your paragraph it seems that some of the words have the first few character aligned on the baseline and then the last few fall off. It might be nicer if there really was a consistant up and down or at least irregualar action/flow of line.</p>
