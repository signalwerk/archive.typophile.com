    html: "<p>thanks for your comments! <br> <br><i>&gt;Peter Verheul's Newberlin</i> <br> <br>i think i had seen this one long time ago, but i didn't  <br>actually know it until you mention it. <br> <br> <br><i>&gt;there's a crispness in the lc that the UC is  <br>lacking somewhat.</i> <br> <br>yes, what do others think about it? i think this is my  <br>major problem, since an all-caps settings looks just  <br>ugly. check the pdf sean mentioned <a href=\"http://www.geocities.com/ehomine/maest.pdf\" target=\"_blank\">here</a>. <br> <br> <br><i>&gt;Some of its characters could be a bit narrower,  <br>the bowls of P and R a little smaller.</i> <br> <br>i've already tried some variations in UC, and i think  <br>they should be wide. i'll search the old caps in my  <br>files to show you. <br> <br> <br><i>&gt;variation in the spacing rhythm</i> <br> <br>this is just bad spacing. it wasn't supposed to be so  <br>irregular, so i'm going to fix it. ;) <br> <br> <br><i>&gt;n/u problem</i> <br> <br>i'm with sean: this doesn't bother me either. <br> <br> <br><i>&gt;bottom of your lc \"c\" and \"e\"</i> <br> <br>maybe it can be extended just a little. this can be  <br>improved with a good spacing, too, i think. <br> <br> <br><i>&gt;Preissig</i> <br> <br>this one i knew. great typeface. <br> <br> <br><i>&gt;rather like Maest at smaller sizes. Better in fact.</i> <br> <br>i totally agree, but it seems quite contradictory,  <br>doesn't it? <br> <br> <br><i>&gt;The \"f\" seems a little spindly</i> <br> <br>this is very intentional. :-) <br> <br> <br><i>&gt;the dots on the \"i\" and the \"j\" are a little to high.</i> <br> <br>i'll fix this. the dots are a little light too. <br> <br> <br><i>&gt;if there really was a consistant up and down or  <br>at least irregualar action/flow of line.</i> <br> <br>good point tiffany. i think i'm just going to make the  <br>characters' baselines more regular. <br> <br></p>"
