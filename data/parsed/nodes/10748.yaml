    html: <p>thank you, sean. <br> <br>I think the "M" in 02 is very nice too, but the hardest thing is <br>to make the other Uc characters coherent with it. Frankly, I <br>don't have any idea of how to do it. Btw, that's the same  <br>problem in 04. <br>For example, "A" and "B" just don't get along. It seems like "A" is <br>one font, and "B" is another. I think the same thing happens with <br>other "round" characters, as "B", "D", "P", "R" and "S". I just need <br>to spend more time on this. <br> <br>But I liked your idea of making swash characters. I'll see what <br>I can do. ;)</p>
