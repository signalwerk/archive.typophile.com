    votes: null
    html: "<p>Perhaps try typesetting various words with <br>the \"n/u\" comparison to see if ambiguity <br>will truly be a problem. <br> <br>Try words such as: <br> <br>annual <br>annular <br>gnu / gun <br>nuclear / unclear <br>nonnuclear <br>nonunified <br>noun <br>nuisance <br>nunu <br>unnumerical <br>unannounceable <br> <br>If it still proves to be a problem, I imagine <br>the problem can be easily corrected <br>by slightly openiing the \"curves\" in the \"u\" <br>and \"n\", and adjusting how the broken \"curve\" <br>joins to the stem. <br> <br>I really like this font, and I'd love to know <br>when it's finished and released. <br>This is one I'd definitely use. <br> <br>David <br></p>"
