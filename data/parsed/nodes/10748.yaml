    votes: null
    html: <p>Eduardo,  <br>  <br>You should really check out <a href="http://www.stormtype.com/preisig.html">Preissig</a>  <br>- much more inspired than Newberlin.  <br>When I first saw Maest I was reminded of this.  <br>  <br>I took a look at the PDF on your site (very nice <br>by the way) and I rather like Maest at smaller  <br>sizes. Better in fact.  <br>  <br>The "f" seems a little spindly to me and I think  <br>maybe the dots on the "i" and the "j" are a little  <br>to high.   <br>  <br>While I see what everyone has said about the  <br>"n" I don't think it is that big a deal. It does not  <br>bother me.   <br>  <br>But I totally agree about extending characters.  <br>  <br>Otherwise it is looking good to me. Maest is  <br>more expressive than Newberlin.  <br>  <br>-smc  <br>  <br>  <br></p>
