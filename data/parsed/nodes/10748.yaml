    html: "<p>I don't know - it used to be a lot less commercial. Plus when I started watching Ferrari wasn't polluting* it. Hilfiger as a sponsor indeed... Anyway, I'm attracted to dangerous sports. Like alpine skiing really turns me on. <br> <br>* Actually, they were polluting the tracks: they would consistently explode mid-race and leave Agip all over... <br> <br>But actually the moment I was hooked was during the Mexico race of '86. Senna put harder compound tires on the left than on the right, because the track was mostly right turns... And he won (of course). Senna was different. That Donnington wet race in '93 was just alien. Anyway, the extreme technical aspect gets me. Which is why I never watch Indy racing (or whatever it's called now): it's 19th century tug-boat racing. <br> <br>Plus, once you go to an actual race (my first was in '90) it becomes just out of this world. A friend had brought a camcorder, and it stopped working from the noise vibrations. <br> <br>I have autographs of Prost, Hakkinen and Wendlinger (don't ask), and I've come within 3 yards of Senna, after he won in Monaco in '93 - that was a miraculous race. Aaah, the days. <br> <br>hhp <br></p>"
