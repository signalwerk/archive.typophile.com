    user_id: 916
    user_name: rcapeto
    user_path: null
    user_image: null
    date_raw: 20 Mar 2003 — 2:41pm
    date: 2003-03-20T14:41:00
    votes: null
    html: "<p>Eduardo:  <br>  <br>About your caps: haven't looked at the PDF  <br>yet, but from your gif I think I rather prefer   <br>the narrower version. That doesn't mean it  <br>couldn't be a tad less narrow than in 01.  <br>  <br><i>Re: testing actual readers...   <br>does anyone actually do that?   <br>i really want to know if you have   <br>any experience doing it.</i>  <br>  <br>I did it when I was developing Houaiss but   <br>not systematically and not in the scale I would   <br>have liked - there was no budget for that.  <br>  <br>Considering how type design is conducted  <br>nowadays (generally small firms, mostly  <br>one-person firms) I don't think formal testing   <br>is really something that is done. I'm not sure   <br>about larger and more organized firms like   <br>FontBureau. Going back to the typology above,   <br>there is a <i>craftsman</i>'s spirit in the thing -   <br>and craftsmen don't conduct tests, they rely   <br>on their ingrained experience (what passes for   <br>intuition) for decisions.  <br>  <br>But one could argue that testing should be   <br>as important as it is, for instance, in   <br>automobile design (it was Otl Aicher, I think,   <br>who said that designing a typeface is like   <br>designing a car).  <br>  <br>I'd like to go back for a moment to the n/u  <br>question and the small montage I made with   <br>your type, that was not commented:  <br>  <br><img src=\"http://www.typophile.com/forums/messages/29/7890.gif\" alt=\"n/u\">  <br>  <br>What's interesting here is that the same glyph  <br>can stand for two different characters and  <br>remain perfectly legible, without <i>confusion</i>,  <br>depending only on context and lexicon (this is  <br>the principle that was taken to its painful limit  <br>in Tobias Frere-Jones's <i>Sum of the Parts</i>).   <br>  <br>This means that, by itself, it's not unambiguously   <br>decipherable. Is this a problem? In most typefaces   <br>it would be. You could, just for fun, conduct a   <br>test with this glyph. For instance: are your   <br>Japanese grandparents still alive? Do they read   <br>Portuguese? (badly, I suppose?) You could prepare   <br>some sample texts, including \"trap\" words where   <br>this glyph could be read either way and see what   <br>they make of them. Do the same thing with young,   <br>competent readers (aren't these two adjectives   <br>contradictory? ;) and see what you get. Have fun.</p>"
