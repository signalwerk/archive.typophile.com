    html: <p>&gt; reading is not a fully "conscious" task, and that's why i think the original n/u works. <br> <br>Reading is indeed largely subconscious, but in some contexts you will have problems. Like "gnu" would usually be read as "gun" - especially since the latter is much more common, and both are in the same class (noun). <br> <br>&gt; nobody complained about anything <br> <br>But that's not enough, exactly because reading is largely subconscious! <br> <br>hhp <br></p>
  - id: 67630
    user_id: 916
    user_name: rcapeto
    user_path: null
    user_image: null
    date_raw: 22 Mar 2003 — 12:54pm
    date: 2003-03-22T12:54:00
    votes: null
    html: <p><i>reading is not a fully "conscious" task, and that's  <br>why i think the original n/u works. it will work even  <br>better in small (text) sizes, as sean commented before,  <br>probably because reading it requires less visual  <br>"consciousness" than reading in bigger (display)  <br>sizes. (is this making any sense? ;)</i> <br> <br>Yes - if we disregard the fact that you're almost sounding <br>like Hrant...  ;) <br> <br> <br><i>i think the "young competent readers" test was already  <br>done. i showed it (roughly the same sample i posted here)</i> <br> <br>Sorry, but then you have tested nothing. A Latin sample text  <br>or a series of isolated words aren't testing anything. (And  <br>"opinions" or the lack of "complaints" are useless.) You have  <br>to have a true text sample in the subjects's language,  <br>something that she or he would actually read. Running the <br>risk of sounding like Hrant myself, something that could be  <br>read "immersively" (though that will hardly be the case in a  <br>test). <br> <br>As I think I have already proven, the n glyph can also <br>stand for an u, so you'd have to have words that explore  <br>this ambiguity, for the test to have any interest and be  <br>fun. That's were the catch is. BTW, don't think of Houaiss  <br>as an example. Real-world projects, with tight deadlines,  <br>are very often less open to this sort of experiment. Think  <br>of it as testing yourself. ;)</p>
