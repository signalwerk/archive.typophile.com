    date: 2003-03-19T08:39:00
    votes: null
    html: "<p><i>&gt;...testing actual readers...     <br>    <br>Agreed. The key word here is readers.     <br>Not designers or craftsmen.</i>    <br>    <br>Yes! Peer criticism and \"opinions\" can never     <br>pass for testing! (Call this <b>equation 1</b>.)    <br>    <br><i>&gt;one may well choose sometimes to     <br>enhance a stylistic aspect in [slight] detraction     <br>from a functional one. In a face like Maest -     <br>largely driven by a formal principle - this would     <br>be a perfectly valid decision,     <br>    <br>Again, in this case, \"n\" I think passes.</i>    <br>    <br>That's what I said: \"perfectly valid\".    <br>    <br><i>&gt;no need to test anything when it's only a     <br>vehicle for self-expression     <br>    <br>Maest is more than this.</i>    <br>    <br>Certainly! And I hope that nothing in what I    <br>wrote would imply that I think it isn't.    <br>    <br><i>&gt;I guess it's simpler than that: the n may     <br>be too much like an u.     <br>    <br>I had no problem reading the sample.</i>    <br>    <br>Well, now I have to ask you to refer back to     <br><b>equation 1</b> above. Would you accept that     <br>the opinion of <i>one</i> reader, who, not by chance,    <br>is also a type designer, can pass for testing?     <br>I don't think so. One fundamental rule of testing,     <br>btw (and not that it matters here), is that you     <br>don't ask the subject's opinion. You <i>observe</i>    <br>his or her behaviour in a number of controlled     <br>situations. But this is idle talk, really. Maest     <br>is very nice as it is, irregular spacing and     <br>baselines and all.</p>"
  - id: 67622
    user_id: 1250
