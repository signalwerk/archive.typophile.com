  html: <p>hi, <br> <br>this is a project i started last year, and i'm  <br>willing to finish it properly. the characters  <br>were drawn using only straight lines. <br> <br>in my opinion, the lowercase and figures are  <br>fine, but the uppercase still needs some work.  <br>what do you think? <br> <br>any comments and critics are welcome! ;) <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/7666.gif" alt="maest"> <br> <br></p>
