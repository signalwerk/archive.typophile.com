    html: "<p><i>&gt;&gt;&gt;Reading is indeed largely subconscious, but in some  <br>&gt;&gt;&gt;contexts you will have problems. Like \"gnu\" would usually  <br>&gt;&gt;&gt;be read as \"gun\" - especially since the latter is much more  <br>&gt;&gt;&gt;common, and both are in the same class (noun).  <br>&gt;&gt; <br>&gt;&gt;Try words such as:  <br>&gt; <br>&gt;In fact, I think these words aren't so useful to  <br>&gt;what I had in mind. What would be more interesting,  <br>&gt;in my opinion, would be a test where you had real words  <br>&gt;that could be read either way.</i> <br> <br>as rodolfo pointed, mis-reading may occur in words where \"n\"  <br>could stand for \"u\". when we have both letters, in the same <br>word, there's no ambiguity. \"n\" can be mis-read as an \"u\", <br>but \"u\" can't stand for \"n\". look: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7945.gif\" alt=\"post4\"> <br> <br> <br><i>&gt;&gt;this isn't a good example for canto is so much more  <br>&gt;&gt;common than cauto  <br>&gt; <br>&gt;But that's exactly what would make setting \"cauto\" in a  <br>&gt;phrase a good test (even if it's semantically different than  <br>&gt;\"canto\").</i> <br> <br>the word \"cauto\" is very rare, so many people don't even <br>know it is an actual word (i didn't know it). <br> <br> <br>*** <br> <br><i>&gt;I really like this font, and I'd love to know  <br>&gt;when it's finished and released.  <br>&gt;This is one I'd definitely use. </i> <br> <br>thanks, david! :-) <br>i let you know i finish this. <br> <br></p>"
