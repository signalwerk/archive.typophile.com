    date: 2008-04-13T09:27:00
    votes: null
    html: |-
      <p>I am not sure and I think James is also not sure there are contextual alternates in De Aetna yet. SF didn't have a De Aetna to check. What I think I did see was that Aldine books do seem to have more than one shape of many glyphs and over time they are used less contextually - more randomly. The opposite is also true that early Aldines seem to be more consistent in their patterns of glyph use. But I need to see more to be able to be sure and it would be good to be able to go through and show each instance and make a proper counted survey. You should remember that he finishes his post by saying "I remain to be convinced.".</p>
      <p>I think I may be able to convince him. We shall see. May I am wrong. I will be posting images before long &amp; hopefully we will get lots of informed opinion on the subject.</p>
