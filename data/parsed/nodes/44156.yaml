      <p>No, actually, as far as I know I wasn't allowed to take photos on my own. But I'll eagerly await your images.</p>
      <p>BTW, I've been reading your posts on contextual alternates, and I looked for them a bit in <em>De Aetna</em>. I wish I had seen your Jenson thread where James Mosley chimes in before now so I could have been on the lookout for contextual alternates more than I was. I saw the accented e's with oblique eyes and the swash e's and m's, but I'll have to go back to check out the others Mosley shows.</p>
  - id: 272369
    user_id: 2942
    user_name: ebensorkin
    user_path: null
