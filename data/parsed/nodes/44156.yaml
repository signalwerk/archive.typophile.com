      <p>I'm nowhere nearby, but by a strange coincidence, I took a look at <em>De Aetna</em> yesterday here at Yale. It's actually for a newspaper article that I'll be designing, which I'll post on my Typophile blog Monday when it comes out. Enjoy yourself!</p>
      <p>EDIT: Forgot to mention that the newspaper article's on Matthew Carter's reinterpretation of Aldus' work, the Yale typeface.</p>
