      <p>Tim my only comments are: The tire tracks aren't like any mountain bike I've ever owned or used. Take one of their bikes with a little water on the tread and roll it over some paper and scan that. The tracks look like a Jeep. </p>
      <p>You also have a very expensive business card in that its full bleed on both sides. Is it necessary? The letterhead also is a bleed 3 sides. I suggest using that letterhead for promotions only and make most of the letterhead without the mountain graphic for general corespondence. Remember part of your job as a designer is watching out for your clients budgets. Once I had my personal letterhead with a bleed on three sides, but the reason it didn't cost much was I used Standard letterhead paper (8 1/2" x 11") and had it trimmed to Monarch size (7 1/4" x 10 1/2").</p>
      <p>Its a bit late, but isn't the concept of this type of adventure, to do it as a group experience? If it is why show one bike rider, shouldn't it be a group of riders?</p>
      <p>Overall its nice work.</p>
