    html: |-
      <p>Gentlemen,</p>
      <p>Thank you for the feedback. Your input confirms my eye's preference as well: 2B. I'll go ahead a work with the subtleties now. This is good news, as it may allow me to carry over a graphical concept that exists in the letterhead. Currently, the fine print and the line grid on the other pieces is at/based on 10.5pt. This is a bit big for the card so I'm going to change them to match the card's final type/grid -- probably 9 or 10pt.</p>
      <p>Dan:<br>
      The logo which resulted from that old thread still lives at the website: <a href="http://www.mauimountaincruisers.com/" title="http://www.mauimountaincruisers.com/">http://www.mauimountaincruisers.com/</a>.</p>
      <p>I comissioned our very own Aquatoad (Randy Jones) to implement a double stacked "M" and fine tune Leviathan to make it look more authentic. He's done a bang up job!</p>
      <p>Timd:<br>
      I know! The email adress (long TLD) provided the biggest challenge with this layout.</p>
      <p>Ben:<br>
      Yes, I really like how 2B leads the eye, and the simple, large negative spaces make for a more cohesive composition.</p>
      <p>Will post some variations soon.</p>
      <p>Thanks,</p>
      <p> -t</p>
