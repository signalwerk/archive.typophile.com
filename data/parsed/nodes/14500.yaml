    html: |-
      <p>Hi Typos,</p>
      <p>Here's a near final comp of the card. Wanted to get some last eyes on this before it goes to client. Will post letterhead and envelope once I have my swatch books. I still haven't chosen final color/s. Plan is it for to be two-color, or one- if possible.</p>
      <p>The concept for the back of the card is that of a tire tread. I'd like to deboss the tread pattern and have it be slightly darker than the ground to give the impression of (err...) an imprint. Any thoughts on how to best execute this would be MUCH appreciated, i.e., color, how deep, etc.?</p>
      <p>What about the cruiserguy pattern? I tried varous sizes and stroke widths. To my eye, 5-high was too busy/small.</p>
      <p>What are your thoughts on the upper vs lowercase title on the card's front? I just can't decide on this; I like them both. Are the margins sufficient for a safe trim?</p>
      <p>Input on typography, composition, and color are all welcome.</p>
      <p><a href="http://typophile.com/system/files?file=card-front-lc.gif" title="http://typophile.com/system/files?file=card-front-lc.gif">http://typophile.com/system/files?file=card-front-lc.gif</a></p>
      <p><a href="http://typophile.com/system/files?file=card-front-uc.gif" title="http://typophile.com/system/files?file=card-front-uc.gif">http://typophile.com/system/files?file=card-front-uc.gif</a></p>
      <p><a href="http://typophile.com/system/files?file=card-back.gif" title="http://typophile.com/system/files?file=card-back.gif">http://typophile.com/system/files?file=card-back.gif</a></p>
      <p> -t</p>
