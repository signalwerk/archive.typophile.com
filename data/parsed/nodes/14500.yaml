      <p>Hi Typos,</p>
      <p>Thaks for all the great suggestions!</p>
      <p>Hrant:</p>
      <p>I like your idea of mashing up the biker guy to make him look more "frantic." I suppose when your leaning into a turn on a bike, you are anything but symmetrical.</p>
      <p>Dan:</p>
      <p>Brilliant idea about the tread pattern. I may actually have a photo of the tread around here somewhere. The crusier bikes have a strange tread pattern. I had actually built this pattern out of the form of the "A" in the logotype -- which is also used as 'arrows' elsewhere in the set. I didn't want it to be too literal, but it might sell better if it was the actually tread. Not sure I have time for this unless I can find that photo.</p>
      <p>As regards to costs and bleeds. The printing is going to fall well under budget due to the fact that I procured parent size sheets (Speckletone - Madero Beach) directly from French and because it's a 2-Color job.</p>
      <p>As far as "group experience" goes -- one could go either way on that. Some go as groups others as couples, and solo. The tour does ride as a group, but many people refer to it as an individual experience with the incredible environment.</p>
      <p>Tiffany:</p>
      <p>Moving biker left may work nicely. I'll play.</p>
      <p>You said "vanishing point," am I to assume that you processed a road into the horizon as a opposed to a mountain?</p>
      <p>Not sure how to get biker guy to interact more on the envelope. Not a lot of options here as far as I can tell. Ideas?</p>
      <p>Card: I had the biker only on the back, but it just seemed a bit boring. The tracks kind of tied it all together in a subdued sort of way. I like the size of the biker -- any bigger and it's not recognizable -- smaller and it's not prominent enough.</p>
      <p>As per <a href="http://www.ms-studio.com/" rel="nofollow">Mark S's</a> (and your) suggestion -- all the 9pt text could probably use a bit of tracking.</p>
      <p>Color: yes the Moab like colors work well. In fact Maui's "red dirt" is a very similar color due to it's high iron content. </p>
      <p><a href="http://www.mauimountaincruisers.com/inc/img/mars_lrg.jpg" rel="nofollow">A Photo of Haleakala Crater</a> -- only slightly digitally exagerated.</p>
      <p>Mahalo to everyone for your expert input. I'll have one last go around, but may not be able to post again until after approval.</p>
      <p>Aloha,</p>
      <p> -t</p>
