      <p>Hi,</p>
      <p>Okay, here's some variations on 2B: <a href="http://typophile.com/system/files?file=mmc2.gif" title="http://typophile.com/system/files?file=mmc2.gif">http://typophile.com/system/files?file=mmc2.gif</a></p>
      <p>Increased name from 10.5pt to 11pt. Everyting else is 9pt, except phone fax labels at 7pt. Flopped the phone/fax numbers and labels (now also all lowercase). Made first letter of email address uppercase. Logotype is roughly based on 18pt x-height.</p>
      <p>2B1/2B1_UC are based on 9/11.1 line grid -- Providing 13 horizontal lines over the 2-inch height.</p>
      <p>2B2/2B2_UC are based on 9/13.1 line grid -- Providing 11 horizontal lines over the 2-inch height.</p>
      <p>I have lined everything up fairly rigidly, except for right margin. This may be too slavish, e.g., the bottom margin on the 2B1s is too small yes?</p>
      <p>What are your thoughts on the leading, especially as regards to the bottom text block? Is 9/13.1 too much? Also looking for feedback on uppercase vs title case for the... title, i.e., "President."</p>
      <p>Realize margins might need some fine tuning. Any other input is most welcome.</p>
      <p> -t</p>
