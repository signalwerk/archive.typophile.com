      <p>My recollection from Monotype keyboard and hand work days is that you needed to twice tap a single quote when you wanted double open or close quotes. This makes sense given the limited number of positions for 5-unit characters in a Monotype matrix case. The number of slots in a Linotype magazine would have imposed the same necessity, to make room for more mats. (At least I think the quote is 5 units: no material here to check that.)</p>
      <p>Maybe that's why the Monotype shop I worked in adopted the 'English' style of using single quotes rather than the "American" style of doubles. Perhaps there was an efficiency expert lurking somewhere who saw a way to reduce the number of keystrokes and thus improve our efficiency. ;-)</p>
      <p>powers</p>
