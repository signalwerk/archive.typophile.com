    html: |-
      <p>Here's a comparison of metal and digital Emerson. The metal sample is taken from a 1992 checklist of an exhibition held at The Grolier Club, <cite>German Fine Printing 1948–1988</cite>, designed by Jerry Kelly and composed and printed at The Stinehour Press. The digital is my recreation of the same excerpt using Jerry Kelly's digital revival of Emerson.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Emerson_GermanFinePrinting_3615.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Emerson-digital_GFP_4182.png"></div><p></p>
      <p>&nbsp;<br>
      Obviously, the metal/letterpress has ink gain which the digital does not presume to reproduce. The digital is fitted overall a bit looser. (In order to preserve the same line breaks, I had to set the measure about 3% longer.) The overall contrast is not bad, as Charles observed. I think I might have liked just a touch more weight in the serifs, myself. </p>
      <p>I've been hoping to see this Emerson set and printed in a typical trade setting to properly gauge the face.</p>
      <p>There are some unexplained idiosyncrasies in the digital version. Notice the fi ligature in "first" in the sixth line. That is indeed the so-called ligature in the digital recreation. The arm of the f is pulled back and the tittle is retained, as I mentioned above. In addition, the spacing seems a little tight in relation to the looser fitting.</p>
      <p>I am also at a loss to explain the tightening of the double quotation marks so much. Granted, the original may have been individual single-quote sorts and is a bit loose. But the digital is too tight for my taste.</p>
      <p>These are minor quibbles. The overall production looks sound to me. As I said, certainly preferable to most current digital versions of other popular book typefaces from that period.</p>
      <p>-- Kent.</p>
