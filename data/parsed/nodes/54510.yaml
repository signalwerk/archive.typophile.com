      <p>Charles, I didn't take time to print out and scan back in the digital sample above. It's rasterized from PDF, so purely virtual reproduction. I would expect maybe a slight softening and gain in weight (if not reduction in contrast) from D2P and offset.</p>
      <p><cite> &gt; On this whole notion of ink gain: If we are to believe what Smeijers said in Counterpunch, the people who made metal punches took that into account. </cite></p>
      <p>In my opinion, it's not so much that they "took that into account." The ink is what they were looking at. What I mean is, I don't think they were trying to imagine what it would look like (i.e., accounting for); they were looking at what it looked like. I believe even a smoke proof adds a bit, as the card was slightly damped in order to take a decent proof impression. Not arguing with you, just a different semantic take. Yes, I come to the same conclusion as you.</p>
      <p>Re: Whitman license. Sounds reasonable. I'm sure something can be worked out. If it comes to pass, e-mail Harry Parker and copy me on it.</p>
      <p>-- K.</p>
