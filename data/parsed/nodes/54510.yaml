    <p>I tried to increase the print density from 3 to 5, to no avail. These two otherwise gorgeous classics haven't survived the trip to digital.</p>
    <p>I've got Corundum Text, and although it looks like an Electra-ish, Fairfield-ish revival, it's too far removed. Same for Prensa. </p>
    <p>Are there any others I should be looking at?</p>
    <p>Thanks.</p>
