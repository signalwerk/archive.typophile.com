      <p>These "revivals" were not intended to replace metal, yet they are called "Electra" and "Fairfield", and Linotype's site claims the following:</p>
      <p>------------------------------------------<br>
      Electra® Bold belongs to the Electra® Font Family which is part of the Linotype Originals.<br>
      Electra is an original face designed for Linotype in 1935 by William. A. Dwiggins, the eminent American artist and illustrator who also created the Caledonia series. The type, which falls into the 'modern' family of type styles, is not based upon any traditional model and is not an attempt to revive or reconstruct any historic type. Because it avoids the extreme contrast of thick and thin elements that mark most modern faces, Electra provides a new 'texture' in book pages. Although in x-height it is amost large as Times Roman, the narrow set of Electra makes it very economical in composition. The italic is really a sloped roman, of almost the same weight as the roman; it is so comfortable to read that it can be used for whole texts, and is particularly suitable for poetry.<br>
      In 1988 Linotype has extended the Electra to a complete type family with four different weights, it was made with true Italics and as a specialty was made available in a lighter end more elegant Display version.<br>
      The Caravan fonts offer a broad variety of fitting ornaments and border elements which had been designed by Dwiggins.<br>
      Electra had received a Certificate for Typographic Excellence in Type Design in 1998 from the Type Directors Club ( TDC ) of New York.<br>
       ----------------------------------------</p>
      <p>So what are these "Linotype Originals" intended to be? They certainly don't look like "originals", yet these "revivals" don't claim to be anything but originals.</p>
      <p>I'm not questioning Linotype's failure to mention that these fonts have little to do with what was intended with the metal forms (other than in name), which is questionable enough. I'm simply wondering why this version of Electra deserved an award when the type does nothing more than ape Electra, and poorly at that. </p>
      <p>I suspect the judges dropped the ball on this one and it's only become clear in retrospect.</p>
