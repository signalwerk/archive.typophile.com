    html: |-
      <p>Thanks Kent. I do find the digital version too light (especially if what Kent is showing us is a typical laser printer printout. DTP-offset would be lighter, and with more contrast).</p>
      <p>On this whole notion of ink gain: If we are to believe what Smeijers said in <cite>Counterpunch</cite>, the people who made metal punches took that into account. My conclusion is that *most* of what is termed "ink gain" is on purpose; the form of the raw punch is not correct.</p>
      <p>* * *</p>
      <p>"Lifeless" can mean different things to different people. To me, the sparkle in a typeface comes from the thick/thin stroke ratio. Baur Bodoni has a lot of sparkle. Bodoni Book, less so. But Baur Bodoni has too much sparkle, and the fine lines are too fine, to be successful for setting extended text.</p>
      <p>An interesting font is Matthew Carter's Galliard. The Carter &amp; Cone version is PostScript, made when the printing chain with PostScript fonts was still repro/negative/plate. This font had just the right sparkle, or life. When output changed to direct-to-plate, the fine lines were too fine. A lot of the Gallaird users got down on printers, or assumed "bad digitization." But Galliard was already digitized, the technical change that took some of it's life came farther down the production stream.</p>
      <p>Fairfield 55 strikes me as having a similar problem, at least as far as its "lifeless" goes. We have a customer who likes it; I was trying to discourage her as I figured it would take me about 100 hours to rework the contrast to get it to print right DTP. And no guarantees, I could easily hash it up. Moreover, given licensing, the font could only be used in our shop for books we set. When I asked the designer what she liked about Fairfield, she also mentioned liking Electra (in metal).  With that clue, I recommended Whitman. We'll see how she likes it.</p>
      <p>BTW Kent, that press has had to cut back &amp; put people on reduced work, so quite rightly they aren't sending any more work out if they can set it in house. If she likes Whitman, how about selling me a gift certificate so they can have the font properly licensed, &amp; I'll pay the bill?</p>
