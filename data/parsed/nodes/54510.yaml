      <p>My assessment of digital Electra is that it needs more than just a "bit of tweaking here and there."</p>
      <p>We went through a lengthy and roundabout discussion of Electra on Typophile many years ago, but I think that thread is fragmented and buried in the archives. </p>
      <p>From my explorations into the matter, I believe the digital Electra suffers from more than just high contrast. The proportions in the existing digital were inherited from a phototype version which was adapted for an 18-unit constraint early in the evolution of Linotype's phototypesetters. The differences are subtle, but enough to produce a different rhythm, in addition to weight/contrast issues. </p>
      <p>Also, I suspect that some of the curves have lost something in translation, compared to the original. I know this for a fact in the case of Caledonia, as I've spent some time analyzing the original drawings. I would expect similar divergence in Electra.</p>
      <p>I agree, what's needed is not so much a "revival" as a careful "restoration."</p>
      <p>-- Kent.</p>
