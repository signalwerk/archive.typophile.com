      <p>With the 8-bit PostScript fonts, we did the same thing when using TeX. Since we ran TeX out of a DOS box, we could use any encoding vector we wanted. By using two single quotes (kerned) for double quotes, two character positions were saved, and sometimes you needed them.</p>
      <p>While not an issue with metal, the only compromise was that space after a letter to a quote was the same whether it was an apostrophe or a close double quote. I suppose you could argue the merits of separate characters, but it didn't seem to affect the quality of the work, and we kept with it until 2007, when we shifted to InDesign &amp; 16-bit fonts. A 65,000+ character typecase sure changes things.</p>
