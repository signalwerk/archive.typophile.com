      <p>So I’ll toss this on top of the pile.</p>
      <p><cite><br>
      You are partly right as to the intended use of the hairline open boxes marked with "pt" sizes on our 18" Schaedler Precision Rule.  Most users would place the empty boxes over a piece of printed text to identify the pt (point) size of the typeface being used.  It is much easier to identify the size of letters inside an enclosed box rather than using the tiny calibration marks on the points/picas calibration scales.<br>
      <cite><br>
             BUT, and this is a big "but," measuring should be done from the highest ascender of a typeface to the lowest descender of the lower case letters -- not the capital letters as with most E-scales.  I usually look for words in the text-to-be-measured which have an ascending letter (like an "l" or "h") right next to a descending letter (like a "p", "g" or "y") so I can view both letters at the same time in my viewing boxes.<br>
      <cite><br>
             Do not measure capital letters because they vary in size depending on the style of the typeface.  Keep in mind, point sizes are always measured from the highest ascender to the lowest descender.<br>
      <cite><br>
             Now, I hate to complicate your life, but many typographers insert 1 or 2 or more points of empty space between lines to increase legibility (and to prevent lowest descenders of the line above from actually touching highest ascenders from the line below).  This space is called "leading" because years ago in the days of metal typefaces, strips of lead were inserted between lines of metal type.<br>
      <cite><br>
             So, when measuring point sizes of text typefaces, it's usually a good idea to measure from baseline to baseline (rather than from highest ascender to lowest descender).  This will catch any leading between lines.  Typographers generally use two numbers to indicate size of face plus leading.  For example, the term "10/12" means a point size of ten plus a 2 pt space for leading totaling 12 total points.<br>
      <cite><br>
             Hey, if it were easy, everybody would be a typographer and we'd all be out of a job.  Thanks again for your inquiry.</cite></cite></cite></cite></cite></cite></p>
      <p><cite>      ........................................................ John Schaedler<br>
      <cite></cite></cite></p>
