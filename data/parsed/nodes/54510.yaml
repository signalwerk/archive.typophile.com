      Linotype's revivals were not intended to replace the metal fonts used in letterpress and they were done too early to be targeted at anything narrower then "a 12 pt master for text and display" expanded in styles and glyphs. Today, it sounds like a simple job for size masters and grades, but in the mean time, some people have made some use of these families  quite nicely. </p>
