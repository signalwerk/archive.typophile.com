      <p>You might take a look at Whitman. It is a little light for these tired old eyes, but the contrast (thick/thin stroke ratio) is just right for direct-to-plate offset printing. Pretty good with PostScript laser printers, too.</p>
      <p>A font that looks interesting but I haven't tried is Emerson. It <cite>looks</cite> like they have adjusted the contrast for modern printing, but no guarantees. </p>
      <p>These fonts are not revivals of Electra or Fairfield, but 21st century interpretations of the same kind of thinking.</p>
