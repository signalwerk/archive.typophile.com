      <p>I have Nonpareil's Emerson. I haven't had occasion to use it yet, and I am unconcluded as to how I feel about it. I love metal Emerson, and this doesn't feel quite the same. Perhaps no one is more qualified to revive Emerson than Jerry Kelly, but still . . . . </p>
      <p>Perhaps it's just that <em>je ne sais quoi</em> that seems to always prevent any revival from recapturing the essence of metal. It's certainly more comfortable than the digitizations of Electra, Caledonia, et al.</p>
      <p>There are f and double-f ligatures; but oddly enough, the fi and ffi don't connect. Actually, now that I look at my metal example, the fi ligature doesn't connect in the original either. But the digital revival retains the tittle, rather than arching the arm over to shelter the i as in the metal.</p>
      <p>Perhaps I can post comparisons later.</p>
      <p>BTW, the new Whitman Semibold is just a tad heavier than the Roman and might appease those looking for a slightly darker Whitman, especially on coated stock.</p>
      <p>-- K.</p>
