    <p>I realize that my knowledge is not state ofe the art ... Can anyone tell me please the name of the font, used for the title?<br>
    Monday evening i visited a lecture of the japanese designer Kenya Hara, and afterwords i bought his book, with the titel: Designing Design. By the way, it is written in english and it's worth to read. It's the first publication of his work in english language. At amazon.com it's much more cheaper than here in Europe.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ke00_6652.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ke02_5105.jpg"></div><br>
