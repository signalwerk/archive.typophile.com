    date: 2009-05-27T06:31:00
    date_raw: 27 May 2009 — 6:31am
    votes: null
    html: <p>This is one of the hardest kinds of projects, and clients rarely realize how much time goes into making something look the same but different. I am troubled mostly by the shape of the D, the thin-ness of the top and bottom curves and the somewhat arbitrary counter space. Logically you seem to be relating it to the widths of the horizontal strokes on the F, but to me it feels weak, and it is the starting letter, so I think it should "break the rules" about proportion, and have more weight and possibly less curve in the upper left hand corner where it joins the stem.</p>
    html_clean: <p>This is one of the hardest kinds of projects, and clients rarely realize how much time goes into making something look the same but different. I am troubled mostly by the shape of the D, the thin-ness of the top and bottom curves and the somewhat arbitrary counter space. Logically you seem to be relating it to the widths of the horizontal strokes on the F, but to me it feels weak, and it is the starting letter, so I think it should "break the rules" about proportion, and have more weight and possibly less curve in the upper left hand corner where it joins the stem.</p>
