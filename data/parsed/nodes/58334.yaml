    html: <p>I personally think your new top version of the D is much stronger. I like the thicker strokes and more square beginning, and the smaller white gap at the bottom.I have mixed feelings about the curving endings on the horizontal strokes of F--they are more integrated, creating a rhythm of white spaces, but they are also a little bit "tricky" or busy, and I'm not sure how well they will reproduce at tiny sizes. You might reduce this to its very smallest size and check that it still works. I definitely prefer the i you have in your last version, curving up at the end.</p>
    html_clean: <p>I personally think your new top version of the D is much stronger. I like the thicker strokes and more square beginning, and the smaller white gap at the bottom.I have mixed feelings about the curving endings on the horizontal strokes of F--they are more integrated, creating a rhythm of white spaces, but they are also a little bit "tricky" or busy, and I'm not sure how well they will reproduce at tiny sizes. You might reduce this to its very smallest size and check that it still works. I definitely prefer the i you have in your last version, curving up at the end.</p>
