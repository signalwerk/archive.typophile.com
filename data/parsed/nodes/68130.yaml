    html: <p>You need to clean up your kern classes. A glyph can be in one class that applies to both left and right sides of a pair OR two classes, one for the left side of a pair, one for the right side. These errors are telling you that you are not doing this.</p>
    html_clean: <p>You need to clean up your kern classes. A glyph can be in one class that applies to both left and right sides of a pair OR two classes, one for the left side of a pair, one for the right side. These errors are telling you that you are not doing this.</p>
