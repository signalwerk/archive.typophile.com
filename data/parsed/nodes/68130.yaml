  html: |-
    <p>Ok, so I was using class based kerning and on the metrics window, everything seems to be working fine... kerning values look like they should. "Class kerning with exceptions" is enabled in the Metrics window.</p>
    <p>However, when I open up the preview window, I see that kerning is all messed up and not working like it should (seems like class kerning is being ignored).</p>
    <p>I tried exporting the font and I still get that.</p>
    <p>Anyone here knows what is happening?<br>
    I spent about 10 hours kerning pairs and to know that my kerning is now not working is stressing me out big time :(</p>
    <p>Thanks!</p>
  html_clean: |-
