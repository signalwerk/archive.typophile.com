      <p>Well, sorta, kinda Thomas. I don't know LaTeX, or the Mac, but we ran plain TeX out of a DOS box on Windows machines for 10 years, setting all manner of scholarly books. The thing is, you're not limited to the Windows or Mac encoding vectors. Our font files were what I called "font data bases" and most had over 400 characters. They looked remarkably like a modern, up-to-date OpenType font, except must use names. You can only encode 254 at once, but you can pick what you include in an "instance" of a font by a custom encoding vector. </p>
      <p>Kerning too is part of the large, database font; if you make a change, you make it there -- no need to worry about, say, cap-cap kerning values in both a small caps font and a regular UC-lc font. </p>
      <p>And the glyph names can be correct, so the underlying text file needs no little lies in it about what the characters are. (For character names, I used the AGL supplemented by common sense, but toward the end, I just used "uni0000" (where 0000 was the correct Unicode number) as a name.</p>
      <p>You can also fill out the AFM to provide automatic ligaturing, at least, for the very few programs that make use of the AFM file -- something most people didn't know. With TeX, the TFM is based on the AFM, and can be made to preserve such instructions. As one example, we added "gg" and"zz" and "ggy" etc. ligs for a number of italic fonts; when the ligature glyphs were there and encoded, they would be used automatically. </p>
      <p>Etc.</p>
      <p>OK, I don't know LaTeX, but this is what I mean by saying if one would read enough to understand what was possible -- as well as what's usually considered desirable -- you're miles ahead than if you ask 1,000 basic questions, one at a time, on an internet forum.</p>
      <p>Edit:</p>
      <p>For the Original Poster -- here's a link showing the use of TeX to set scholarly books. Fonts used were all PostScript (starting from pfb + afm), though most were custom, as indicated above. I imagine anything you an do with TeX you can do with LaTex (though it might take more effort to undo some macros?)</p>
      <p><a href="http://www.tsengbooks.com/" title="http://www.tsengbooks.com/">http://www.tsengbooks.com/</a></p>
      <p>See also</p>
      <p><a href="http://www.tug.org/texshowcase/" title="http://www.tug.org/texshowcase/">http://www.tug.org/texshowcase/</a></p>
