      <p>First, apologies to Alice for hijacking her thread. No reason for her to keep on reading this!</p>
      <p>Short version: Charles is right about ligatures being supported in the AFM, although it raises a number of questions about where that data continues on to on Mac and Windows. Of course, the existence of ligature definitions in an AFM doesn't imply any other typographic features, nor that the ligature info is used.</p>
      <p>Long version:</p>
      <p>Charles, I was surprised by your AFM, since I knew that I had actually read the entire Type 1 format back in the day, and hadn't ever noticed this. In fact, I still have it (version 1.1) as a real printed book on my bookshelf. So I simply pulled it down to check.</p>
      <p>Turns out that the AFM format is not <em>technically</em> part of the Type 1 spec. It is mentioned exactly once in passing in the book, and even then only in the context of Adobe wanting to get AFM files from vendors under some particular circumstances.</p>
      <p>This makes sense in some ways: it is not included in platform-specific Type 1 flavors for Mac or Windows, for instance. But it is certainly a good data source relating to the font, and I'd never read the AFM spec. There is the ligature support at the bottom of page 32, for sure. <a href="http://partners.adobe.com/public/developer/en/font/5004.AFM_Spec.pdf" title="http://partners.adobe.com/public/developer/en/font/5004.AFM_Spec.pdf">http://partners.adobe.com/public/developer/en/font/5004.AFM_Spec.pdf</a></p>
      <p>Some things in AFM files, such as kerning info, are preserved in translation to the platform-specific PFM or font suitcase files used on Windows and Mac, respectively. I certainly think of kerning as being “part of” a Type 1 font, even if it isn't in the Type 1 spec per se. I have no idea if the ligature info is preserved in those translations as well, although I doubt it—if it is, few if any clients use it.</p>
    html_clean: |-
      <p>First, apologies to Alice for hijacking her thread. No reason for her to keep on reading this!</p>
      <p>Short version: Charles is right about ligatures being supported in the AFM, although it raises a number of questions about where that data continues on to on Mac and Windows. Of course, the existence of ligature definitions in an AFM doesn't imply any other typographic features, nor that the ligature info is used.</p>
      <p>Long version:</p>
      <p>Charles, I was surprised by your AFM, since I knew that I had actually read the entire Type 1 format back in the day, and hadn't ever noticed this. In fact, I still have it (version 1.1) as a real printed book on my bookshelf. So I simply pulled it down to check.</p>
      <p>Turns out that the AFM format is not <em>technically</em> part of the Type 1 spec. It is mentioned exactly once in passing in the book, and even then only in the context of Adobe wanting to get AFM files from vendors under some particular circumstances.</p>
      <p>This makes sense in some ways: it is not included in platform-specific Type 1 flavors for Mac or Windows, for instance. But it is certainly a good data source relating to the font, and I'd never read the AFM spec. There is the ligature support at the bottom of page 32, for sure. <a href="http://partners.adobe.com/public/developer/en/font/5004.AFM_Spec.pdf" title="http://partners.adobe.com/public/developer/en/font/5004.AFM_Spec.pdf" class="link-external">http://partners.adobe.com/public/developer/en/font/5004.AFM_Spec.pdf</a></p>
      <p>Some things in AFM files, such as kerning info, are preserved in translation to the platform-specific PFM or font suitcase files used on Windows and Mac, respectively. I certainly think of kerning as being “part of” a Type 1 font, even if it isn't in the Type 1 spec per se. I have no idea if the ligature info is preserved in those translations as well, although I doubt it—if it is, few if any clients use it.</p>
