      <p>Yes, probably not important. Still, here's a few lines from our <strong>AFM</strong> for the old Monotype Garmond (from the 1990s):</p>
      <p>C 103 ; WX 323 ; N g ; B -106 -273 383 403 ; L g gg ; L y gy ; L p gp ; L j gj ;<br>
      ...<br>
      C -1 ; WX 677 ; N gg ; B -105 -270 733 403 ; L p ggp ; L y ggy ;<br>
      C -1 ; WX 1134 ; N ggp ; B -105 -270 1150 518 ;<br>
      C -1 ; WX 1052 ; N ggy ; B -105 -289 1081 403 ;<br>
      C -1 ; WX 561 ; N gj ; B -98 -272 642 608 ;<br>
      C -1 ; WX 799 ; N gp ; B -105 -272 809 518 ;<br>
      C -1 ; WX 708 ; N gy ; B -105 -289 728 403 ;</p>
      <p>...</p>
      <p>C 122 ; WX 417 ; N z ; B 56 -263 489 403 ; L y zy ; L z zz ;<br>
      ...<br>
      C -1 ; WX 767 ; N zy ; B 16 -277 790 402 ;<br>
      C -1 ; WX 840 ; N zz ; B 57 -255 911 402 ; L y zzy ;<br>
      C -1 ; WX 1184 ; N zzy ; B 16 -277 1207 402 ;</p>
      <p>The "C-1" shows they didn't happen to be encoded in this particular AFM file, but by writing &amp; running the correct encoding vector, they would have been included, and then been used.</p>
