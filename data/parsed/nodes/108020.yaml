      <p>I understand that you need Type 1 PFB for your own purposes. But do keep in mind that for most folks OpenType CFF is more broadly useful.</p>
      <p>For example, you will be very limited in the usable (outside of TeX) language coverage in a normal name-keyed Type 1 font. The PFB won't work at the system level on Mac OS. Typographic features can't be encoded in the font. And so on....</p>
