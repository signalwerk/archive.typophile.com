      <p>Charles: I don't see anything that you wrote that renders what I said only "kind of" or "sort of" true. All that stuff you said is true in TeX or some derivatives. My point was that none of that stuff works outside the TeX-and-derivatives world, which is a tiny subset of publishing, let alone font use.</p>
      <p>Which is why, in the broader world, Type 1 is pretty much dead as a format for new fonts.</p>
      <p>Not that Alice shouldn't make what she needs for her own use, of course! Just that if she wants to sell it, or release it as a libre font, or otherwise make it available beyond the TeX-and-derivatives community, she might consider alternatives to Type 1.</p>
