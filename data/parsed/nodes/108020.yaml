      <p>I believe Build forum would be the best one for this question, but it can be answered here anyway.</p>
      <p>IMO, to let these positions empty is a poor procedure.</p>
      <p>The glyphs included on ISO 8859-1 are actually a quite reduced set these days, when support for languages is always growing. ISO 8859-1 just holds Western European idioms –but it is OK to do a font with it if your goal is to use the fonts just with these languages. In other hand, to offer a partial codepage support is not good. Users would be surprised not to find some basic characters your font is supposed to have. And codepages were designed exactly to define standards to which fonts, OSs, and applications would comply with.</p>
      <p>Regarding super and subscript, you are right that most text editors can build these characters from the normal ones. But the software do this scaling down the original figure and this causes very thin stems and strokes. The result is a weak, somewhat anemic super/subscript character.</p>
      <p>An example:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Superetsub_6363.png"></div><p></p>
      <p>The second line shows 1, 2 and 3 scaled down by the editor while the third line uses 1, 2 and 3 included on the font (Helvetica Neue and Minion Pro). Note that vertical positions are also adjusted by the font designer to produce optimal results considering the overall design.</p>
      <p>You may evaluate the difference as small, but keep in mind that typographic quality is determined by details. Small differences become huge when in use.</p>
      <p>Fractions are an even worse matter as editors are not capable to produce them from the normal figures. Here, you need proper glyphs in the font.</p>
      <p>As you pointed, what is included in ISO 8859-1 is not enough. This standard is old, a legacy from the times when fonts were limited to 256 characters. To achieve 0-9 super and subscript you need to include the whole set of figures in your font. These figures are coded in the 2070 block from Unicode, the standard that replaced former ISO codepages. Fractions beyond the basic ones are coded in the 2150 block.</p>
      <p>Anyway, there is nothing wrong to adopt ISO 8859-1. This is your first font and you can do additions like super/subscript and fraction in a future moment. Just ensure that all glyphs are properly named and coded since the beginning.</p>
      <p>Finally, characters you can add depend on your purpose. Do you want to support Polish or Norwegian? Do think it is nice to offer arrows and bullets? Define your target and then do a research on Unicode tables. Euro sign, proper quotes, en dash, and em dash are a good start point.</p>
