      <blockquote><p>There are already all nine ordinal numbers, and software has to be able to make superscripts (and subscripts) using them (and letters too) as well as fractions.</p></blockquote>
      <p>Yes. And as Mr. Freiberger showed, the result looks like dung. When you scale glyphs down, they do get smaller. The weight gets lighter as well. Too light.</p>
      <p>Secondly, most layout software (e.g., InDesign) will not programmatically kern unscaled letters with scaled letters -- you have to do it by hand, in each instance. So, for example, with footnote calls, if you scale full-size numerals, you cannot programmatically kern them when they follow quotedblright, as is almost always needed. Or follow a period, comma, etc.</p>
      <p>You need to decide if you are making up a font for your own use only, in which case what you do follows the principle of the one that applies to the privacy of your own bedroom, or a font for other people to use, in which case you need to consider what they might expect.</p>
