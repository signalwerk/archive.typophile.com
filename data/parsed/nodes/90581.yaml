  html: |-
    <p>The March edition of the Metal Type newsletter is now out. To view the video, click here:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=17" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=17">http://www.metaltype.co.uk/rail/clicks/click.php?id=17</a></p>
    <p>As usual, plenty of interesting stuff has been posted on the Forum:</p>
    <p>Linotype: The Film. Reviews, Stills, Background Info, and more posted here: <a href="http://j.mp/wueXRo" title="http://j.mp/wueXRo">http://j.mp/wueXRo</a></p>
    <p>Linotype: The Mats! Roy Foley still has mats for sale in the UK: <a href="http://j.mp/yZFqWt" title="http://j.mp/yZFqWt">http://j.mp/yZFqWt</a></p>
    <p>Displaying Halftone Zinc Plates. Is it possible to make a display out of old halftone (photograph) zinc plates? <a href="http://j.mp/zAV4nV" title="http://j.mp/zAV4nV">http://j.mp/zAV4nV</a></p>
    <p>Metal Type Printing now has a superb range of letterpress business cards to customise and buy online. (UK only).</p>
    <p>Customers from Typophile can get a 10 per cent discount on business cards this month by entering the code: TYPOPHILE at the checkout.</p>
    <p>See some of the designs available on this video: <a href="http://www.youtube.com/watch?v=nt5rthdZbWM" title="http://www.youtube.com/watch?v=nt5rthdZbWM">http://www.youtube.com/watch?v=nt5rthdZbWM</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
