    <div class="info">Submitted by <a href="/user/3" title="View user profile.">Jared Benson</a> : 13.Apr.2006 4.05pm </div>
      <p>
    <strong>Are you looking for <a href="http://typophile.com/filmfest4">Film Fest 4, Seattle 2007</a>?</strong></p>
    <p><strong>CALLING ALL TYPE FILMS!</strong><br><br>
    for the 3rd annual <strong>Typophile Film Festival</strong> to take place at<br>
    <a href="http://www.typecon.com">TypeCon</a>, this year in Boston during August 9-13, 2006.</p>
    <p>[ Sponsored by <a href="http://www.typophile.com">Typophile</a>, <a href="http://www.punchcut.com">Punchcut</a>, and <a href="http://www.typesociety.org">The Society of Typographic Aficionados</a> ]</p>
    <p>The film festival is wide open to anything relevant to typography, design history,<br>
    and/or type design. It can be educational, experimental, inspiring or humorous.</p>
    <p>The Typophile Film Festival debuted in 2004 at TypeCon San Francisco, and showcased<br>
    fifteen short works of typography in motion from around the world, including films by<br>
    Erik Spiekermann, H5, Motion Theory, Trollbäck + Company, Cheshire Dave,<br>
    and others.</p>
    <p>TFF 2005, at TypeCon NYC, showcased typographic works by Strange Attractors,<br>
    WeWorkForThem, RESN, mono, Font Bureau, Max Kisman and others.</p>
    <p><strong>Examples include (but are not limited to):</strong><br>
    - Film Titling<br>
    - Promotional pieces showcasing a typeface<br>
    - Motion Picture Studio work<br>
    - Studio reels showing a strength in typography or motion type<br>
    - Experimental or animated fonts<br>
    - Documentaries<br>
    - Mockumentaries<br>
    - Short stories or animations<br>
    - Client work<br>
    - Student work</p>
    <p><strong>Overview &amp; Eligibility</strong><br>
    By submitting a piece for consideration, you affirm that you retain rights to such work,<br>
    and that you acknowledge the right of Typophile and SOTA to use the work for festival<br>
    exhibition and promotion.</p>
    <p>- There is no fee to enter.<br>
    - Finalists will be chosen by Typophile at its sole discretion.<br>
    - This is a showcase, not a contest.<br>
    - All work shown will be properly credited in Typophile Film Festival materials.</p>
    <p><strong>Submission Details:</strong><br>
    Minimum size: 640 x 480 (broadcast) or 720 x 480 (DVD)<br>
    Frames per second: 24 or more<br>
    Maximum Length: 15 minutes (00:15:00)<br>
    Minimum Length: 30 seconds (00:00:30)<br>
    Compression: None</p>
    <p><strong>Media Guidelines</strong><br>
    Digital formats are preferred, on CD, DVD or downloadable from your site. If you<br>
    have old footage that exists in an obsolete format, send us an email to discuss any<br>
    special considerations or arrangements.</p>
    <p>- <strong>Digital:</strong> Quicktime preferred (.mov, .mpeg) Place onto a <em>data</em>CD or <em>data</em> DVD<br>
    and mail to the address below. If your piece was created in Flash and your aspect<br>
    ratio is other than 720 x 480, we suggest you add a black mask to "crop" your piece<br>
    so that your SWF will be scaled properly when you prepare it for Quicktime output.</p>
    <p>- <strong>Tape:</strong> Mini-DV or VHS. We are not able to accept 3/4" tapes. For tape delivery,<br>
    mail a Mini-DV or VHS tape to Typophile. Your tape will not be returned. Please enclose<br>
    your contact info, the name of your piece and all relevant credits. Improperly credited<br>
    corporate work will not be shown.</p>
    <p>- <strong>Download:</strong> DO NOT email your file(s). You may upload them to your own server and<br>
    email us the URL to download. Do not submit raw Premier, After Effects or Final Cut files.<br>
    Only exported, uncompressed files will be considered.</p>
    <p><strong>Send films to:</strong></p>
    <p>Typophile<br>
    c/o Punchcut<br>
    228 Grant Avenue, 5th Floor<br>
    San Francisco, CA 94108<br>
    Tel: 415/445 8855<br>
    Email: <a href="mailto:typophile@punchcut.com">typophile@punchcut.com</a></p>
    <p><strong>DEADLINE</strong><br>
    Friday, 30 June 2006 at midnight PST (Firm)</p>
    <p><strong>Sponsors:</strong><br>
    If you are interested in promoting your business at the Typophile Film Festival,<br>
    sponsorship opportunities are available. Please <a href="mailto:typophile@punchcut.com?subject=Sponsorship">email</a> or call.</p>
    <p><em>If you are considering submission of a piece for the film festival, or know of<br>
    a film that should be in the show, please don't hesitate to <a href="mailto:typophile@punchcut.com">contact us</a><br>
    to discuss your ideas.</em></p>
    <p>Spread the word! Copy this text to your favorite blog or newsgroup.</p>
