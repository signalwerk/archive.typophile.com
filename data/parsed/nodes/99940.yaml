    html: |-
      <p>Agree with bojev. Journal Sans is better candidate, overall design comes closer but Bold weight is not enough "bold" (is there any Journal Sans Black?). Could also have been manipulated and artificially emboldened by adding an outline strokes. It also reminds me of NIVEA logo.<br>
      More in the same, matching design but these letters only (need to be emboldened): <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/erbar/" rel="nofollow">Erbar Bold</a> (Paratype states that Journal Sans design has been "based on Erbar"), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/relay/" rel="nofollow">Relay Black</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/durotype/simplo/" rel="nofollow">Simplo Black</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/penumbra/" rel="nofollow">Penumbra Sans Bold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/ealing/" rel="nofollow">Ealing Black</a></p>
