    <p>I realise this may be a long shot as the type is quite small. Unfortunately I couldn't find any bigger versions of <a href="http://bookcoverarchive.com/book/history_lesson_for_girls">this cover</a>. Maybe the one-storey "a", peculiar "y", and swash on the capital "G" (the descending "F" may very well be a customisation) rings a bell with someone who knows what this one is.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/history_lesson_for_girls_4081.large.jpg"></div><p></p>
