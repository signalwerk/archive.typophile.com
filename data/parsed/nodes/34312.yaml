    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Digraph</strong></p>
    <p>A 'digraph' is the use of two letters to represent a single phoneme or a sequence of phonemes that does not correspond to the letters which compose the digraph. In some languages digraphs are considered individual letters for alphabetizing, casing, &amp;c. In other languages, such as English, this is not the case. Some digraphs have their own code points in <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a>, and as thus it is important to understand which digraphs can be decomposed and which cannot.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/29782" rel="nofollow">Not Ligatures : Digraphs - Lets talk about 'em.</a><br>
    <a href="http://typophile.com/node/34111" rel="nofollow">IJ-ligature Fonts</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://en.wikipedia.org/wiki/Digraph_%28orthography%29" rel="nofollow">Wikipedia: Digraph (Orthography)</a></p>
