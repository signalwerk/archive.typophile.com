    html: <p>I'd love to see the fonts you're talking about. <br> <br>&gt; Is this legal? <br> <br>I like doing it too, so I certainly hope not!  ;-) <br>Most recently, my Mana-16* has stroke contrast, but in those letters the thinning happens at the joins. <br> <br>* <a href="http://www.manic.com.sg/blog/archives/000121.php" target="_blank">http://www.manic.com.sg/blog/archives/000121.php</a> <br> <br>Stroke contrast can be a good thing (especially for readability), irrespective of where it comes from. As a result, there's really nothing Wrong about doing that, except upsetting some type designers. <br> <br>The "theory" might be that it makes structural sense, that it has a harmony missing -or at least different- from the doddering ductus school. <br> <br>hhp <br></p>
    html_clean: <p>I'd love to see the fonts you're talking about. <br> <br>&gt; Is this legal? <br> <br>I like doing it too, so I certainly hope not!  ;-) <br>Most recently, my Mana-16* has stroke contrast, but in those letters the thinning happens at the joins. <br> <br>* <a href="http://www.manic.com.sg/blog/archives/000121.php" target="_blank" class="link-external">http://www.manic.com.sg/blog/archives/000121.php</a> <br> <br>Stroke contrast can be a good thing (especially for readability), irrespective of where it comes from. As a result, there's really nothing Wrong about doing that, except upsetting some type designers. <br> <br>The "theory" might be that it makes structural sense, that it has a harmony missing -or at least different- from the doddering ductus school. <br> <br>hhp <br></p>
