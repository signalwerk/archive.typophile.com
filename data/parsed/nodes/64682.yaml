      <p>I'm not altogether sure what you're actual brief was, but I think you may want to start off by looking at the meaning of all three words. Simple, explicit and diffusive mean very different things. Perhaps try designing a poster where you represent the meaning of each word. What would a 'simple' poster look like, or an 'explicit' poster? etc etc</p>
      <p>Unless I've completely misunderstood what you're trying to do, in which case disregard the above.</p>
