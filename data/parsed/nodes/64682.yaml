    <p>Hello!!!<br>
    these are three posters about a theme a did in college<br>
    called 'poster for poster' meaning to create a poster<br>
    or a series of posters about what a poster is...<br>
    so...i've made a series of three posters based on typography<br>
    and i gave the meaning of poster with three words(on in each poster)<br>
    simple,explicit,diffusive...<br>
    i'd love to hear an opinion about this, about the whole concept(idea)<br>
    and about the result...<br>
    thank you!!!</p>
