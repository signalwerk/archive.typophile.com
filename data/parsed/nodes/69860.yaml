      <p>It's definitely Microgramma, I'm going to buy some 10-16pt lead type whenever I find some.</p>
      <p>I don't think I'll buy the font. Computer fonts always neglect the way font size affects line weight, and this one is no exception.</p>
      <p>Thanks for the help, Typophile community.</p>
