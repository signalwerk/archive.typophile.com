  html: |-
    <p>I have an old Sanyo portable cassette player, and the labels on it are in an extended typeface that was relatively common for electronics back when transistor amplification (solid-state) was a whole new thing. I'd ideally like to find a set of it in movable type, but the name of the face would be a good start. I'm sure it has plenty of clones, so if anyone knows of one, it'd do for now.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/temp_3773.gif"></div><p></p>
