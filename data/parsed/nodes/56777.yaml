  html: |-
    <p>I’m proud to announce the relaunch of <a class="freelinking external" href="http://schriftgestaltung.de" rel="nofollow">schriftgestaltung.de</a>. Now the site focuses on tools for type designers.</p>
    <p><a class="freelinking external" href="http://schriftgestaltung.de" rel="nofollow"> </a></p><div class="imageWrap"><a class="freelinking external" href="http://schriftgestaltung.de" rel="nofollow"><img src="http://typophile.com/files/schriftgestaltung_6000.png"></a></div><a class="freelinking external" href="http://schriftgestaltung.de" rel="nofollow"> </a><p></p>
    <p>It presents information about the font editor "Glyphs", a QuickLook plugin .UFO files and a growing selection of scripts for FontLab and InDesign.</p>
    <p>You are invited to take a look around.</p>
