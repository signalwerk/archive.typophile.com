      <p>I disagree with the idea that a monoline sans cannot be classy. It easily can, in any weight. It's about spacing. Generous spacing (either around the word mark/logo or within it) consistently suggests 'premium' or 'class'. Telefon, Gotham, Neutra are all good options. Personally, I would pick Telefon out of that bunch because it is not as common in my neck of the woods (Australia) but ubiquity should not be a major design consideration IMO unless you know that competitors of the company are using those faces. Let your symbol also continue to guide you. </p>
      <p>If you are really worried about the monoline sans thing, then I'd suggest a 'flared' type might do the trick. Trajan Sans Pro is lovely and super classy for example.</p>
