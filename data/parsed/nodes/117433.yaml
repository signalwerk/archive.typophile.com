      <p>Thanks for the inputs everyone. While I like Sye feel that geometric monoline sans can give a good classy look if one handles the tracking/kerning the right way, pretty sure hhp has some reasons to believe what he does too. Personally have an aversion to the look of seaside with the kind of mindset I am in with this project.  Any more knowledge in terms of general practices when setting type and making typeface choices in this sort of a case would be helpful too. </p>
      <p>Also what family of typefaces or typeface examples would work nicely with geometric typefaces and could be general guidance, in things like business cards etc. I am currently considering Meta, Helvetica Neue or Flama might work out as good pairing options for lets say logotype subtext or even in business cards. </p>
      <p>General and specific guidelines that help sort out and define an approach to such problems ? Besides experience and habit obviously.</p>
      <p>Also Frode (Edit: Frodo), man that's really great, If I finally end up choosing Telefon, I will be surely contacting you on this. Great to know that some people still work with heart.</p>
