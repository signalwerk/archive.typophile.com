      <p>There are a bunch of Clarendons -- it's as much a style/classification as it is the name of a specific font. In addition to the many typefaces with Clarendon in their name, you might consider these, which follow the same model with varying degrees of fidelity:</p>
      <p>Sentinel<br>
      <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100034" title="http://www.typography.com/fonts/font_styles.php?productLineID=100034">http://www.typography.com/fonts/font_styles.php?productLineID=100034</a></p>
      <p>Sutro<br>
      <a href="http://new.myfonts.com/fonts/parkinson/sutro/" title="http://new.myfonts.com/fonts/parkinson/sutro/">http://new.myfonts.com/fonts/parkinson/sutro/</a></p>
      <p>Oxtail<br>
