  html: "<p>For immediate release <br>23 June 2003 <br> <br>by Treacyfaces, Inc. <br>Contact: Joe Treacy, (203) 389-7039 <br> <br>to typophile.com and its readers <br> <br> <br>ILLUSTRATION: (72ppi) <br> <br>JPG showing the new series: <br> <br><a href=\"http://www.treacyfaces.com/061703_TFArrowABCDE_Sample.jpg\" target=\"_blank\">www.treacyfaces.com/061703_TFArrowABCDE_Sample.jpg</a> <br> <br> <br>15 new weights of TF Arrow: The family now comprises five volumes, 20 fonts. <br> <br>by Joseph Treacy <br>Director of Typography <br>Treacyfaces, Inc. <br> <br> <br>Until now only a handful of roman weights of TF Arrow existed. I've just created all the other new weights shown in the sample, including all the new true-cut italics. <br> <br>TF Arrow has been one of the more popular display and display-sized text series of the past several decades. But it never had an italic. <br> <br>And so over the years, all kinds of designers, including those who should know better, have taken to skewing the romans (making an 'oblique'; an artificial computer-made skewing) when an 'italic' form of the letter was called for. <br> <br>Not a good solution, although truth be told, the letter skews 'pleasantly'. <br> <br>Now, however, designers that know better have a real choice. <br> <br>A complete pricing schedule is shown below this letter. All these fonts are immediately available. <br> <br>Existing customers of our TF Arrow will notice that because of the sheer number of new weights, we have re-broken our former 5-weight sets into 4-weight sets. This will make it even easier for new customers to buy, and for returning customers to add more TF Arrow weights. <br> <br>As always, the Treacyfaces commitment to true graphic arts quality lives on, as it has since 1984!  <br> <br>The TF Arrow fonts all ship with fine quality, consistently drawn letterforms, excellent spacing and exquisite, comprehensive kerning. <br> <br>Add all these new additions to TF Arrow to your font menu now, by purchasing at treacyfaces.com for fast delivery today. <br> <br>Order toll-free now at 800 800-6805,  <br>or online securely at  <br><a href=\"https://www.treacyfaces.com/orders1.html\" target=\"_blank\">https://www.treacyfaces.com/orders1.html</a> <br> <br>Thanks very much for your interest in Treacyfaces true graphic arts quality types! <br> <br>********* <br> <br>The new TF Arrow A B C D &amp; E series (20 fonts!) <br>Released June 18, 2003 <br> <br>Treacyfaces, Inc. <br>treacyfaces.com <br>Phone 800 800-6805 <br> <br>You can easily purchase with your Visa, MasterCard or  <br>Amex card, at our quick, 1-page SSL-Secure online order form,  <br><a href=\"https://www.treacyfaces.com/orders1.html\" target=\"_blank\">https://www.treacyfaces.com/orders1.html</a> <br> <br>All prices and volume groups are right in the order form! <br> <br>Delivery to your e-mail address is rapid,  <br>usually in 30 minutes. <br> <br>Available for Mac or Win, in PS Type 1 or TrueType. <br>(We recommend the PS Type 1 format.) <br> <br>Individual weights: <br> <br>TF Arrow 0055001 Extralight, US$29. <br>TF Arrow 005501 Light, $29. <br>TF Arrow 00550002 Book, $29. <br>TF Arrow 005502 Medium, $29. <br>TF Arrow 0055003 Demi, $29. <br>TF Arrow 005503 Bold, $29. <br>TF Arrow 005504 Extrabold, $29. <br>TF Arrow 0055004 Heavy, $29. <br>TF Arrow 005505 Black, $29. <br>TF Arrow 0055005 Ultra, $29. <br> <br>TF Arrow 00550011 Extralight Italic, US$29. <br>TF Arrow 0055012 Light Italic, $29. <br>TF Arrow 005500023 Book Italic, $29. <br>TF Arrow 0055024 Medium Italic, $29. <br>TF Arrow 00550035 Demi Italic, $29. <br>TF Arrow 0055036 Bold Italic, $29. <br>TF Arrow 0055047 Extrabold Italic, $29. <br>TF Arrow 00550048 Heavy Italic, $29. <br>TF Arrow 0055059 Black Italic, $29. <br>TF Arrow 005500510 Ultra Italic, $29. <br> <br>Pre-grouped volumes are arranged thus: <br> <br>All-New 4-weight volume definitions: <br> <br>TF Arrow A 005500111 Weights: 4; US$98. <br>Extralight, Extralight Italic, Bold, Bold Italic <br> <br>TF Arrow B 005500112 Weights: 4; US$98. <br>Light, Light Italic, Extrabold, Extrabold Italic <br> <br>TF Arrow C 005500112 Weights: 4; US$98. <br>Book, Book Italic, Heavy, Heavy Italic <br> <br>TF Arrow D 005500113 Weights: 4; US$98. <br>Medium, Medium Italic, Black, Black Italic <br> <br>TF Arrow E 005500114 Weights: 4; US$98. <br>Demi, Demi Italic, Ultra, Ultra Italic <br> <br> <br>New 10- and 20-weight Bundles: <br> <br>New TF Arrow A, B, C, D &amp; E  <br>(all 20 fonts); US$343. (Saves $147.) <br> <br>New TF Arrow A, B, C, D &amp; E ROMANS only <br>(10 fonts); US$209. <br> <br>New TF Arrow A, B, C, D &amp; E ITALICS only <br>(10 fonts); US$209. <br> <br>There are also 8-weight discounted combination volumes bringing savings <br>on sets merging AB, AC, AD, AE, BC, BD, BE, CB, CD, CE, DE. <br> <br>NOTE: The 'old' 5-weight TF Arrow A and TF Arrow B  <br>volumes are discontinued. <br> <br> <br> <br> <br>Joseph D. Treacy <br>President &amp; Director of Typography <br>Treacyfaces, Inc. <br> <br>P.O. Box 26036 <br>West Haven CT 06516-8036 USA <br> <br>800 800-6805 orders <br>203 389-7037 phone <br>203 389-7039 fax 24 hours <br> <br><a href=\"mailto:jtreacy@treacyfaces.com\">jtreacy@treacyfaces.com</a> <br> <br><a href=\"http://www.treacyfaces.com\" target=\"_blank\">http://www.treacyfaces.com</a> <br>(Requires the Flash 5 browser plug-in, from Macromedia.com) <br> <br>Secure SSL-encrypted font ordering around the clock: <br><a href=\"https://www.treacyfaces.com/orders1.html\" target=\"_blank\">https://www.treacyfaces.com/orders1.html</a> <br></p>"
