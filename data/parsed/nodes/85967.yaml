    <p>Hi guys,</p>
    <p>I'm looking for a san serif that with good hinting to load sharply and legibly at 8pt to 20pt on screen and has at least a regular, italic, bold and bold italic.</p>
    <p>I was thinking something like FR Hopper, but open to suggestions. I'm not sure how the hinting is on Hopper, but would be interested to know what you think.</p>
    <p>Thanks,<br>
    Paul</p>
