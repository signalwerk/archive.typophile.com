      <p>Font Bureau's <a href="http://www.webtype.com/catalog/intended/?ts=829" rel="nofollow">Reading Edge ("RE") series</a> of webfonts were designed specifically for use at small sizes on screen. Personally, I'm partial to <a href="http://www.webtype.com/font/bentonsansre-family" rel="nofollow">Benton Sans RE</a>, but any real suggestion for a specific family would depend a bit on the context in which it will be used.</p>
      <p>(Full disclosure: I am a Font Bureau employee, but have made use of the RE fonts in personal web projects, so can confidently comment on them from that point of view.)</p>
