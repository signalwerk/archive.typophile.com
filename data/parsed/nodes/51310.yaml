    html: <p>I don’t see how opening a font and looking at its details in Fontlab is decompiling any more than doing so by looking at the font in Illustrator or Indesign. There’s a point where a line is crossed—for example, going in and poking around through someone’s Opentype code, or saving it as a VFB for whatever reason, but I don’t think that just looking at the letters crosses that line.</p>
