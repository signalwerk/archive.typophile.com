    html: |-
      <p>I'm a newbie too, and I'm poking around inside &amp; outside(installing and using) every font I have.<br>
      System installed fonts, great designer's fonts, great foundary fonts, crappy free online fonts.....anything I can get my hands on.<br>
      Everything I own will be looked at and learnt from. I never resave, adjust or make any changes to any designer's fonts. The legal implications aside, that's the respect they deserve at a minimum.</p>
      <p>I don't want to adjust other people's fonts, I want to learn from them.<br>
      I have a special folder of completed various fonts I've collected so I can use as a constant reference, from the widely spread Arial &amp; Helvetica, to display fonts, old fonts, and through to grunge and ultra modern.</p>
      <p>In my early days as a Graphic Designer I've pulled apart Graphic Design Companies free Clip Art to see how they did gradients, patterns and any other tricks I valued.</p>
      <p>My rule is to learn from the best and build new stuff using any skills or techniques you can grab from them.</p>
      <p>You can't create in a vacuum.<br>
      Take it all in. It's there to be learnt from.<br>
      You won't be a newbie for long.<br>
      Cheers</p>
