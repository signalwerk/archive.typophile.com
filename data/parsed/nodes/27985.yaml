    html: |-
      <p>If you have the book and can see the letters clearly, maybe you could try using the <a href="http://bowfinprintworks.com/SerifGuide/intro.php">Serif Font ID Guide</a>. The E, J and M are the only key search letters in your sample, so you’ll get a few candidate samples to look at, but the samples shown will include a G and C that you can also match against the type.</p>
      <p>It might be worth a shot.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
