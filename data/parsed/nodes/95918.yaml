      <p>Come to think of it, one of the properties of blackletter was that it was used for printing texts in the vernacular, while Roman was used for texts in Latin.</p>
      <p>Today, if different languages still use the Roman alphabet, usually the same typeface is used for both. But occasionally sans-serif typefaces are used for foreign languages just slightly more often than for English... thus, Pinyin in some dictionaries is in a particular sans-serif face; Univers is associated with continental Europe.</p>
      <p>So perhaps Roman is the new blackletter, if anything.</p>
      <p>If not, there's always Optima or Lydian... or even Radiant. (Or should I try to defend the notion that its cousin, Peignot Bold, is the "new blackletter" for our time?)</p>
