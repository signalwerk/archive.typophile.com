    html: |-
      <p>Ryan, I'm sorry but you really do not know what you are talking about, and you are using terms without understanding their conventional and specialist meanings, or the context of their origins. What characterises the various blackletter styles are their modes of letter construction, and since all originated as formal bookhands to suggest that blackletter is by nature 'partly about decoration "for the sake of decoration"' is simply not true. Decorative blackletter styles are mostly later developments, notably products of Victorian signpainting and engraving, ergo 'Old English'.</p>
      <p><em>Should I change the name of the thread to 'Compacta is today's Textura'?</em></p>
      <p>This, at least, is a good question, because it enables one to see the basic problem with your whole approach. Ask yourself, what distinguishes textura from other forms of blackletter? It isn't particularly the weight or the horizontal compression, because those can be found in other blackletter styles too. Rather, what enables one to look at a sample of writing or type and classify it as textura is the <em>construction</em> of the letters, what a scribe (hi, Michael) will call the ductus. So you can only suggest that Compacta and similar styles are 'today's Textura' if by this you mean only 'Compacta is today's heavy and narrow style of type' and that as such it is a kind of parallel to earlier heavy and narrow styles of type, of which you have chosen textura as an example. To what degree is the second part of this true? Is there a parallel? I don't really think so, at least not in general typographic terms, because I don't see much of a similarity in the way types like Compacta are <em>used</em>. Remember, textura was, as the name suggests, a text face, whereas Compacta is a display face. I think Michael is closer with his jest that Compacta is the new Old English, since if there were a parallel it would be in display lettering, and we're back to those Victorian signpainters who wanted heavy for impact and narrow for fit.</p>
    html_clean: |-
