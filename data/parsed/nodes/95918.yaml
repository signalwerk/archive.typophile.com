    html: |-
      <p>@etachen:<br>
      <cite>maybe this can be today's blackletter</cite></p>
      <p>While Adso is an interesting <em>contemporary</em> blackletter, there is a world of difference between that and something that can be called "today's blackletter".</p>
      <p>The latter may not be typographically related to blackletter at all; "today's blackletter" is something that fulfills the function today that blackletter fulfilled yesterday.</p>
      <p>Which means that "today's blackletter" varies depending on the value of yesterday that you use.</p>
      <p>For the most distant value of yesterday, when blackletter was the generally used style of type, <em>roman</em> is today's blackletter.</p>
      <p>For a more recent value, when blackletter was the more archaic style of type, still often used, in nearly all the Latin alphabet area, I would tend to say that <em>Scotch Roman</em> is, if not today's blackletter, the blackletter of the early twentieth century - after Caslon and Baskerville had been revived.</p>
      <p>For a still more recent value of yesterday, when blackletter in the form of Fraktur was the distinctive typeface of Germany, today's blackletter might be Univers or Helvetica or Aldus (Palatina Book, in effect).</p>
      <p>These examples, two of which I had already mentioned in this thread, show why I reject the idea of Compacta getting the title... if one thinks of the use of blackletter as a display font used for its boldness, then one might go with Clarendon or Bodoni (not really a valid choice, as it was used together with blackletter, but for a different display function, in newspapers)... the use of Compacta for this function doesn't seem to me to have any parallels to the limited use of blackletter for that purpose.</p>
      <p>EDIT: But given the idea that Compacta is being used as an almost-unreadably narrow face, replacing blackletter for that purpose, only the lack of lowercase when it is also used for that purpose stands between <strong>French Clarendon</strong> and the designation of "today's blackletter"!</p>
      <p>Ah: <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/playbill/" rel="nofollow">Playbill</a> is perhaps "today's blackletter" in <em>that</em> sense!</p>
