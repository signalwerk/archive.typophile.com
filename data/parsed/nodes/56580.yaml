    html: <p>Many years ago, Laurence Penney made a little tool called TTFtoSFP, while allowed one to quickly make a size-specific SFP bitmap font from a TTF. It was a small and elegantly simple little program. I'm not sure if it is currently available, but have directed Laurence's attention to this thread.</p>
