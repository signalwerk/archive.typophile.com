    html: |-
      <p>Thanks for drawing me here, John. You speak the truth: I did make such a program. It worked fine for making SFP fonts in the Windows Latin 1 character set.</p>
      <p>I usually sold it along with Striker, a little program to edit SFP bitmaps, for £200. This is probably too much cash for a program that hasn't been updated since around 1997. I might decide to make both programs free from now on... let me think about that for a mo'.</p>
