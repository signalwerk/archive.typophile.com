    <p>Hi,<br>
    what are .sfp fonts? How do I get/make them? All I know is that they are printer fonts for special printers (for printing on tickets)? Can FontLab export them?</p>
    <p>All I found on google was cryptic weird forum posts. </p>
    <p>Thanks<br>
    Henning</p>
