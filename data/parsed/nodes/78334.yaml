    <p>Hi Folks,</p>
    <p>Does anyone here recognise the typeface used on the keyboard of the WW2 German Enigma coding machines? I've been searching the web for Grotesk typefaces, but have yet to find one with correct Q, R and E characters. I'm wondering if it was a custom face?</p>
    <p><img src="http://www.ilord.com/images/enigma/enigma-keyboard.jpg"></p>
    <p>Many thanks for your time, a_g</p>
