  html: |-
    <p>Hi everyone,<br>
    I'm working on some packaging that's rolling out through the whole of Europe and am trying to find some nice fonts. I originally used Chevalier and Samantha Italic Pro on pack but the products are headed for Russia and Poland as well, so I'm trying to find any nice alternatives. Does anyone know of any nice cyrillic and diacritic fonts out there? I've looked on Paratype and spoken to people at Monotype and Linotype but thought someone out there in typo land might know of something. I'd appreciate any help.</p>
    <p>cheers<br>
    Giles</p>
