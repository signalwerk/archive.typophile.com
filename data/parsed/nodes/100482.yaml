      <p>Mantika would indeed be a great choice.</p>
      <p>Finding something similar to Samantha that supports Cyrillic shouldn't be too hard. But Chevalier is probably a harder nut to crack... If you have enough time (and a decent budget :-) consider commissioning a custom extension. There are many people on Typophile who can do that sort of thing for you (hopefully they'll chime in) including Jürgen, and yours truly: hpapazian at gmail dot com</p>
      <p>hhp</p>
