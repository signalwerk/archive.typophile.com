    html: <p>Eureka would be a good choice. But since Interstate, is like DIN a constructed Sans, I'd go for maximum contrast and use a classical typeface, even with OSF and SC... should be fun. Interstate is a bit overused this days, though... I've recently seen a book by Grappa Oro in Berlin about archtect Christoph Ingenhoven, for whom I work every now and then and they mixed Interstate and Din. Oooouch. And, much as I love the FF DIN, it just isn't the right face for an archtect who is anything BUT Deutsche Industrie Norm :-). </p>
