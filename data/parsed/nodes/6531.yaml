    html: <p>&gt;In one of the examples in Roger Black's book 'Web sites that work', Interstate is paired with Miller and it works very nicely. <br> <br>Hmm, interesting. When Roger Black redesigned <a href="http://straitstimes.asia1.com.sg/">my local paper</a> (the printed version, of course) in 98/99 he used Interstate as the primary sans and paired it with Garamond. They have used Plantin and Century Schoolbook on some previous incarnations of the paper. <br> <br>The way they used it, Interstate is rarely used for more than three lines of text, in headlines or the stand-first. But sometimes they do go berserk and use it in a whole sidebar. <br> <br>Recently, they have started using the whole gamut of widths and weight. Very distracting, IMO. They should just stick to what I think is the <i>original</i> Interstate, the <a href="http://www.myfonts.com/fonts/fontbureau/interstate/regularcondensed/">Regular Condensed</a>. Funny, when I first noticed Interstate, I don't remember it having so many weights and widths. Were those added later? </p>
