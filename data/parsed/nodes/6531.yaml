    html: <p>Why trying emulated the geometric non contrasted stuff in a serif counterpart? <br> <br>Interstate, is like Futura.  Fit with many good classic families, from Garamond (one of the good one!) to Bodoni (same here!). Not at all with a contemporary serif family. <br> <br>You need to create a contraste rather than destroy it. <br> <br>Caecilia or "Thesis" Serif are not all a good choice to me (sorry Stephen, generally I agree with you, not here) <br> <br>Perhaps FF Celeste if you really want something "new."</p>
