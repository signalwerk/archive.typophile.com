    html: "<p>Karen, as Interstate became wildly popular, they expanded the family in 1999 to the current number of styles to meet popular demand for italics and lighter and bolder weights. You really can't blame them for that, it's a real money-earner. Some purists might argue that it dilutes the original concept, but it was an interpretation to start with, so... <br> <br>From <a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=10447908863930263&amp;fontname=Interstate\"> the Font Bureau, Inc.</a> website: <br> <br><i>Familiarity is the foundation of legibility, lending this sans serif a strong edge as one of the most legible faces. Interstate is based on the signage alphabets of the United States Federal Highway Administration, alphabets that we read every day as we drive. Tobias Frere-Jones designed Interstate in 1993-94 and, with the assistance of Cyrus Highsmith, has expanded it into a plethora of enticing text and display styles; FB 1993-99</i></p>"
    html_clean: "<p>Karen, as Interstate became wildly popular, they expanded the family in 1999 to the current number of styles to meet popular demand for italics and lighter and bolder weights. You really can't blame them for that, it's a real money-earner. Some purists might argue that it dilutes the original concept, but it was an interpretation to start with, so... <br> <br>From <a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=10447908863930263&amp;fontname=Interstate\" class=\"link-external\"> the Font Bureau, Inc.</a> website: <br> <br><i>Familiarity is the foundation of legibility, lending this sans serif a strong edge as one of the most legible faces. Interstate is based on the signage alphabets of the United States Federal Highway Administration, alphabets that we read every day as we drive. Tobias Frere-Jones designed Interstate in 1993-94 and, with the assistance of Cyrus Highsmith, has expanded it into a plethora of enticing text and display styles; FB 1993-99</i></p>"
  - id: 45834
    user: 1451
    date: 2003-02-09T05:16:00
    date_raw: 9 Feb 2003 — 5:16am
    votes: null
    html: "<p>Only Bold and the Bold Condensed are true to the spirit of FHWA Series E (modified) (aptly and thankfully renamed <a href=\"http://www.vershen.com/psgcatal.html#hg2002\">Highway Gothic</a> by the computer company who digitized the face). <br> <br>Following Hrant's link, I got this: <br><i>The reason Series E Modified is called 'modified' is because the letter stroke (width of lines making up letter) is modified to be 20% of the letter height. The lower case loop height for Series E modified is 75% of the upper case height.</i> <br> <br>Now none of the Interstates follow that specification. Except for the Bold, Bold Condensed and possibly the Regular and Regular Condensed. It's silly to name a font Interstate and the add on illegible hairline weights, don't you think?</p>"
    html_clean: "<p>Only Bold and the Bold Condensed are true to the spirit of FHWA Series E (modified) (aptly and thankfully renamed <a href=\"http://www.vershen.com/psgcatal.html#hg2002\" class=\"link-external\">Highway Gothic</a> by the computer company who digitized the face). <br> <br>Following Hrant's link, I got this: <br><i>The reason Series E Modified is called 'modified' is because the letter stroke (width of lines making up letter) is modified to be 20% of the letter height. The lower case loop height for Series E modified is 75% of the upper case height.</i> <br> <br>Now none of the Interstates follow that specification. Except for the Bold, Bold Condensed and possibly the Regular and Regular Condensed. It's silly to name a font Interstate and the add on illegible hairline weights, don't you think?</p>"
