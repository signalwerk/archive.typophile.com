      <p>My approach would be to ask what the shadow adds. In logo design especially, every element needs to convey something about the company and its values. Does a shadow really speak to the company's customers? Why does the client want a shadow? </p>
      <p>All too often shadows are put in only to say 'look we can add text effects!', which is far too amateur and self-conscious for a corporate logo. Of course there are times when a shadow is relevant, but unless depth, light/shadow and/or 3-d are important parts of what a company does, I would suggest it's purposeless.</p>
