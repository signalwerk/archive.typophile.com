      <p>Your client may also be telling you that they think your design lacks pizzaz, and needs sexing up.<br>
      But that may well be their subjective insecurity speaking—they want the logo to be spectacularly awesome, immediately, all by itself.<br>
      We know logos don't work like that—they are part of an identity system that must be durable, and their effect in brand building is cumulative.<br>
      So make sure that you have done adequate presentations (with rationale and bullshit) showing the logo mocked up "in action" in various kinds of media, explaining this to them.<br>
      Also make sure that your presentations are slick, big, colorful and in person—turn on the salesmanship. It's a necessary evil.<br>
      You may not have to go quite this far…<br>
