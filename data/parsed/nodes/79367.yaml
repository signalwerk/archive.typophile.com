    html: |-
      <p>You don't see drop shadows all that often in professional corporate logos, but they are used occasionally. Google's logo is one example (although they tend towards a more freewheeling style anyway).  </p>
      <p>A shadow, like any graphic technique, can be either appropriate or inappropriate depending on the situation. It can be a reference to the client's business, and it can also be used just to make the logo pop off the background and give it a bit more zip. </p>
      <p>One reason pros tend to stay away from shadows on logos is that they don't reproduce well in certain situations, like on a Xerox or fax, and if the logo is reversed out the shadow becomes white and looks weird. So even if your client insists on a shadow you'll probably want to prepare an alternate non-shadow version for situations like that.</p>
