    <p>Hello fellow Typophiles!</p>
    <p>My name is Scott, and I'm a Senior design student at Ohio University. I have been working on a bunch of geometric typefaces for my thesis project and have decided to put them out in the public.</p>
    <p>These typefaces are based on my studies of modernism and constructivism respectively (largely based on the writing of Jan Tschichold and the Stenberg brothers). I'm starting with strict geometric designs, and developing the glyphs into a more legible forms.</p>
    <p>check 'em out!</p>
    <p><a href="http://www.1919type.com" title="http://www.1919type.com">http://www.1919type.com</a></p>
    <p>thanks!</p>
