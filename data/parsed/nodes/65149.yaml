  html_clean: |-
    <p>Hi,</p>
    <p>I recently wanted to generate one font into OTF I made, but some weird things happened.<br>
    While generating, at 93% of whole process, in Output panel, it shows me this warnings. After a couple of seconds, it complete whole 100% process of generating and I can see OTF file, but when I try to double-click on it, it shows an error (file is corrupted).</p>
    <p>I see that there are a lot of "removing duplicate glyph" in Output panel, but I can't find the reason why that appears. </p>
    <p>One more thing... I tried somehow to bypass this errors by generating font first into Win Type1 (PFB) and then from PFB &gt; OTF. It works, I can install font and on double-click I can see "Quick brown fox...", but... it looks like some kerning pairs are missing or are incorrect (not like they are in original VFB file), meaning this is not the solution for this problem.</p>
    <p>I need help :)</p>
    <p>P.S. - Sorry for such a looooong post.</p>
