  - id: 382809
    user: 43106
    date: 2009-12-08T11:08:00
    date_raw: 8 Dec 2009 — 11:08am
    votes: null
    html: |-
      <p>That's it baby :)</p>
      <p>Damn... it took me half day to figure it out.<br>
      Problem was next:</p>
      <p>- "Kerning Assistance" was activated! Actually, it included pairs from FontLab's sample that had all sorts of glyphs - Greek, Cyrillic... and this font I made have only basic glyphs, so that made problem during generating. I saw that some of the classes were empty, and not selected either left nor right side-bearings. So I just copy all glyphs into new font file from the old one and I exported metrics from old one and imported it into new one = and that's it!</p>
      <p>Mark, thank you for your help, it was very stressful, but useful experience. And I learned something new today.</p>
      <p>Ciao ;)</p>
