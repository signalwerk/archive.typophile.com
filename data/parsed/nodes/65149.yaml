    date: 2009-12-08T11:03:00
    date_raw: 8 Dec 2009 — 11:03am
    votes: null
    html: |-
      <p>When trying to find the problem, you can ignore the metrics classes. They aren't used when generating a font, they are just a FontLabStudio-internal thing to help with spacing.</p>
      <p>To check for errors/overlaps in your kerning classes, you can use the Yin Yang button in the Kerning Assistance dialog (Tools - Kernin Assistance).</p>
    html_clean: |-
