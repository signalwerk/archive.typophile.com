    date: 2009-12-08T06:51:00
    date_raw: 8 Dec 2009 — 6:51am
    votes: null
    html: |-
      <p>A glyph may only be used in either </p>
      <p>- a single kerning class that is used for both left and right sides of a kerning pair, or<br>
      - in two classes, one that is used for the left and one that is used for the right. </p>
      <p>The errors you're getting indicate that you have the same glyphs in more than one class and that they conflict (that is, the classes are for the same side of a kerning pair).</p>
      <p>It'd be nice if FontLab would warn you when add the glyphs to a kerning class rather than when you try to generate the font, but it doesn't, so you just have to be careful. </p>
      <p>There is also a "Clean Up Classes" command in the Classes panel, which should help with your problem, but it can't read your mind and my not give the kerning classes you want.</p>
