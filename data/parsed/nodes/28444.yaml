    <p>Hi everyone, I am new here.....</p>
    <p>I've discovered this great site thanks to a link from Google which sent me to a discussion in which the El Al logo was mentioned.<br>
    I just LOVE the current El Al logo, which was designed by Dan Reisinger 35 years ago, together with the magnificent turquoise livery which I will always bitterly miss! This livery was just incredible: its design looked very harmonious and elegant on each model of El Al's Boeing planes, and its colors were absolutely striking. El Al abandoned it, very sadly, in 1999, in a move that was meant to "modernize" the company image. But obviously, the level of service has not improved enough over the last years and the bad reputation of the airline survived despite the new look of its airplanes...</p>
    <p>And now, El Al has started to introduce a "new logo", in order to have a "fresher" image...This "new" logo is just HORRIBLE!!! It is ugly!!! </p>
    <p>And actually, it is not a new logo, it is only a disfigurement of the current one. It appears on the El Al website (<a href="http://www.elal.com" title="www.elal.com">www.elal.com</a>) and many marketing items, although not yet on the planes.</p>
    <p>I cannot understand how a "graphic designer" has been able to butcher in such a blatant way the masterpiece of one of his most talented and famous peers. It is shocking. If, at least, El Al had introduced a totally new logo, based on a new concept...; in such a case I would of course miss the current logo, but at least there would be (maybe) something interesting or beautiful in the new creation. Here, there's neither a new creation nor a new concept; some stupid and arrogant self-proclaimed graphic designer has simply "rearranged" a fantastic 35-year-old logo, destroying its great harmony, its beauty, and its visual impact; the new version is not only unestaetical, it is also barely redeable. </p>
    <p>I have shown it to dozens and dozens of friends and acquaintances; each of these persons with no exception said that the new version is not beautiful at all, and many had even difficulty to understand what it was. Indeed, a logo mixing a company name in two different languages and alphabets into one linear symbol is not something that current, but Dan Reisinger had not only the idea of creating such a unified logo, but he managed to make it uniquely beautiful and easily readable.</p>
    <p>I'd be highly interested to hear your comments...and if someone has an idea of what could be done to try to convince El Al not to adopt this "new" logo, I would be ready to do anything...</p>
    <p>Thanks!</p>
