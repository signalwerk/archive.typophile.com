      <p>Well, I guess part of the problem is that some corporate people will do anything to put a permanent mark on a company, so that they can say "I'm the one who created the *new* El Al" or whatever. So the boss might want a radical change even when that's not advisable. </p>
      <p>Also, remember that brand positioning is often more important than artistic merit (sadly). So sometimes a great logo is replaced by an uglier one just because the new one projects a different image.</p>
