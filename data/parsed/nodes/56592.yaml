    <p>Hello Typophile-</p>
    <p>I'm hoping to get some feedback on my first attempt at a complete and functioning typeface.<br>
    Cosmos slab is meant to be a display face, but if I can make it legible at small sizes that would be a wonderful bonus. It was drawn in illustrator and brought in to fontlab where I'm endlessly tinkering with it. I'm currently working on the widths of the uppercase and numbers, as they are a bit out of tune. Any extra suggestions/ comments would be very helpful.</p>
    <p>thanks in advance!</p>
    <p>-elsa</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cosmos_specimen_pg2_6491.jpg"></div><p></p>
