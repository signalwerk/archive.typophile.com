    html: |-
      <p>Hi,</p>
      <p>Well I think it has some nice characteristics, but I think it still needs quite a bit of work. I won't go too much into detail, as I understand this is still a work in progress. The things I think you need to look into the most:</p>
      <p>-Overall I think it still feels rather unbalanced, some characters look quite wide whereas others are quite thin (I'm thinking about the lowercase u and the capital H for instance). They just don't feel like a coherent set yet. It has the look of a monospaced typeface yet it isn't, which is also a bit weird, so I would look into the spacing as well. Compare with simular fonts to see the difference in approach.</p>
      <p>-Some of the slab serifs feel like they are stuck on afterwards, or come in places we're one doesn't expect one (2 and 3). This is strange, especially because it's inconsitant. You could use this to make your font stick out, but then it needs to be worked out more.</p>
      <p>-This may be a bit of a trick question, but I could not help asking: Would does distinquish this font from other slab serifs (f.i. Lubalin graph)? I don't see a clear distiquishing feature, so I would like to know more about your influences and motivations in creating this typeface.</p>
      <p>I hope I wasn't too harsh on you, but I hope it helps....</p>
      <p>cheerio Queneau</p>
