    html: |-
      <p>I think there are a few fonts out there called Cosmos or some variant thereof, and this design doesn't particularly evoke anything particularly cosmic to me.</p>
      <p>That said, I don't have a problem with some of the unusual serif placements. They look fine on the 2 and 3, for example.</p>
      <p>The 3, B and S look a bit top-heavy, but they may be symmetrical. It's an illusion that should be compensated for. P and R appear to sag a bit, and n looks too narrow. Overall not too bad at all.</p>
