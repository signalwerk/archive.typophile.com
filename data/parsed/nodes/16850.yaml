      <p>About the B-tree (  Apple document ):</p>
      <p>The B-tree (part of the disk directory) has become damaged and cannot be repaired by Disk First Aid.</p>
      <p>When Disk First Aid reports that the thread for a file is missing and it cannot repair it, this means that it is unable to reconcile the entry for the file in the directory (catalog B-tree) with the location of the file on the volume. This indication can be triggered by the following:<br>
      The file in question may have become damaged and cannot be repaired.<br>
      The catalog B-tree may have become damaged and cannot be repaired.<br>
      An earlier version of Disk First Aid (which cannot repair volumes currently in use as the startup disk) is being used to try to repair the startup volume. Try booting from another volume such as a System Install CD, and run Disk First Aid from the CD.</p>
