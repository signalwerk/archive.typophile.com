      <p>&gt; I’ve tried Apple’s Disk Utility and it won’t perform the repair.</p>
      <p>Repair vs. Verify : try first the verify  option - check for and report problem. Very important: you don’t want always  to fix the problems, since by doing so may cause more problems!!!</p>
      <p>&gt;  I’ve tried starting up from DiskWarrior and it won’t run either — DW stops when it is on step 5 (directory). </p>
      <p>usually when DW stops on step 5 there’s a little message : “speed inhibited by disk malfunction”   - did you see that? </p>
      <p>there’s  no doubt  that you have corrupted file(s).  the directory  is the main component that  First Aid  checks; and the directory contains the info where every file is located.</p>
