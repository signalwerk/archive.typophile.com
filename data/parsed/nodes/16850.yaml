      <p>Tiffany, good luck. </p>
      <p>While your problem seems to be resolved, I thought I would share a relevant personal story. My PowerBook 12” died a few months ago while still under warranty, so I took it to the Apple Store. I couldn’t get to the files on it, no matter what I tried, and neither Disk Utility nor Disk Warrior would allow me to start the computer.</p>
