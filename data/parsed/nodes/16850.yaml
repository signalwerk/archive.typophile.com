      <p>Mounting the drive over firewire is neither drastic, nor does it (in my experience) require Terminal.<br>
      You just string the firewire cable between two macs, unplug all your other firewire doodads and geegaws, make sure the functioning mac is already on, then boot the bad mac while holding down your ’T’ key. It should mount on the good mac as a drive, and you can access files just as you would any other mounted drive.<br>
      It’s saved my bacon a couple times, and is far from a last resort—it’s one of the first things I do.</p>
