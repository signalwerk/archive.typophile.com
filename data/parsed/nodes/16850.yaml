    <p>Dear Friends,</p>
    <p>I know this is the OS X forums, but I trust you with most things so I thought I’d ask about my most recent catastrophe.</p>
    <p>I won’t go into the nasty details, but at this point in time I find myself unable to copy files from my second internal drive. I’ve tried Apple’s Disk Utility and it won’t perform the repair. I’ve tried starting up from DiskWarrior and it won’t run either — DW stops when it is on step 5 (directory). I’m going to go back to the office and try running Disk Utility from the TIger startup CD later. </p>
    <p>I was talking to a friend last night who said it is likely the main area — don’t recall what he called it — has been damaged. He loaned me an external drive to try and copy to it.</p>
    <p>If the drive ist kaputt, I am kaputt. Why are lessons learned only after you have to learn them? If I can get the files that is my worry. I will buy another drive if this one is beyond repair. All projects, fonts and itunes are on this drive. Boy. I’m scared. Suggestions?</p>
