      <p>Similar to "DETROIT 40": <strong><a class="freelinking external" href="http://moorstation.org/typoasis/designers/lloyd/index.htm" rel="nofollow">Paul Lloyd's Shrewsbury</a></strong><br>
      "DATSYUK": <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Letterhead&amp;ffam=LHFOldBlockCondMed%20-%20Regular&amp;fid=60bb477a75461b4099844d414c1920e3&amp;fsize=60&amp;text=DATSYUK&amp;fit=1" rel="nofollow">LHF Old Block Cond Med</a></strong> from Letterhead looks like a perfect match<br>
      It's probably easy to use <strong>LHF Old Block</strong> for /C &amp; /A</p>
