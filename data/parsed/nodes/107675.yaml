    <p>Hi,</p>
    <p>I'm trying to identify (as close as possible) the typefaces used in the attached visuals. I understand that these may be custom but the closest equivalent would be very helpful.</p>
    <p>Looking to identify the "DETROIT" on the front of the jersey, numbers on the back, "player name - DATSYUK" and "C" and "A" on the sleeves.</p>
    <p>Thanks for any assistance with this.</p>
    <p>Josh</p>
