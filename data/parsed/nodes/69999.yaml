    html: |-
      <p>I have to be honest, when I first read it I immediately thought the "d" was actually an "l" so it read "twistel" to me until you said it was "twisted." The reason being that the "d" looked like an "l" because of the loop or bowl or counter of the d being so low to the baseline. It looks more like and script "l" with a fancy loop. Also just because one sees the first 3 to 4 letters being "Twis..." does not mean that everyone is going to know it actually says "Twisted." And also remember that the last letter of a word is very important for reasons we all know. </p>
      <p>However, that said, I think both have something good going and I like the script version as well as the second one and I think they both have this "festive" feel to it. I think there is something you can try with the "s" perhaps tilting it to the angle of the "w &amp; e"? just to see what it looks like while sitting diagonally in the middle of the ambigram. Just a suggestion, not saying it will work but could be interesting.</p>
      <p>I like the loops and the connections between loops but I think you should check your weights. Making some of the connections of a heavier stroke or weight could help improve the ambigram. It does not entirely bother me but I think some of those connections could be heavier and stronger since they look and feel a little flimsy and weak.</p>
      <p>Also, maybe you could try something different with the "i." Maybe you could make more of a sleek or thinner tear drop or dot of the "i." I feel they work on the second one but for the script version they could be thinner or slicker or something, but I feel they are too narrow or wide. </p>
      <p>Its looking good and fun and it looks good in black to.</p>
      <p>F</p>
