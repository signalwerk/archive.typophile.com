    html: |-
      <p>Froy - I hear you about the second half of the word being less strong than the first. However, I would argue that having read 'Twis..' there are only so many directions the word can go, and your brain almost fills in the rest for you. To addition, the more the second half of the word is rendered legible, the less the first half is! And I would argue that the first half is more important. </p>
      <p>The rationale behind the line weights is thus: the first version had bits such as the 's' with varying weights within the actual letter. To improve legibility (especially at a distance - go on, try it, it's actually more legible when you stand back!), the joining or decorative lines would become lighter, and the lines making up the letter would be heavier. Those lines which are part of the letter in one instance and then a joining line in the other would be a middle thickness.</p>
      <p>What do you think?</p>
