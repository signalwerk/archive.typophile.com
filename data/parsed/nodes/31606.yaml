    html: <p>Please show us some text set in it or better still, show us how you think it might be used if not for text. It's hard to critique a face outside of a context. I think there are some fixes to do before kerning. Maybe not too. Seeing how you plan to space it matters too - spacing and shape relate to each other. It seems a little wide in your sample. Or have you just not thought about that aspect yet? It does seem like it's worth going after a bit more even if it just ends up just being a learning experience. You can't know if it will go 'all the way' yet. And I think that's okay. The style is a good one to be working on just now it seems.</p>
