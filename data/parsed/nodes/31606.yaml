    html: |-
      <p>- Why not connect the dgbqp to their vericals sooner so the counter shape is less completely round?<br>
      - A related point the joins on those same letters &amp; the joins on the rnm seem a little clotted or heavy<br>
      - The m &amp; w seem overly wide to me. I am not suggesting a big change - just a small one.<br>
      - The k feels awkward to me.<br>
      - The ascenders are so short they are beginning to a little cramped to my eye.<br>
      - the h seems odd with one leg lifted like that. Why is it like that?<br>
      - The weight is at the top &amp; bottom rather that the two sides. Is that because the face is so geometric &amp; you have not accounted for the illusion that creates? Or is it on purpose?<br>
      - The counter on the 4 seems small.<br>
      - The 3 needs to be reworked. It feels awkward.<br>
      - The paces between words seem too big and the kerning between letters seesm too tight.<br>
      - The dots on your puntuation are too light.</p>
      <p>I like the way your s seems to be top heavy &amp; yet balances. I ca't tell if it's going to be okay in the long run yet since there is no PDF but if you can carry it it could be a nice feature and point of difference with other fonts of this kind. I suggest setting more text with it and seeing what combinations are uncomfortable. If you want I can send you some pangrams to try. In general though it is holding together nicely. I like the size of the opening on your c. It feels just right. I really like your y. I would try to be sure that other glyphs fit nicely with it litterally and in terms of matching it's 'feeling'.</p>
