      <p>- Most printers that you talk to will have different answers -</p>
      <p>No doubt. But most of them I've conversed with say that using the least amount of ink to achieve the color you're looking for is the way to go. </p>
      <p>- 90C 80M 80Y 100K -</p>
      <p>That seems like a lot of ink to me. You're probably getting the results you want from it so let the presses RIP. I would be afraid to put white text or logos on top of that. Any misregistration and you're dead. My baseline mix for backgrounds is 30 20 20 100. For text 0 0 0 100. In Photoshop if you look to the left of K in the CMYK sliders, you can see the undercoating color.</p>
      <p>peace</p>
