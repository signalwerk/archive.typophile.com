      <p>One book I've found incredibly helpful for these kind of things is Getting it right in print - Digital pre-press for graphic designers by Mark Gatter (published by Lawrence King, London). It covers a whole range of common and not so common issues like the rich black problem in a concise way.</p>
      <p>It recommends that the combined ink densities of a rich black do not exceed 250% to avoid 'picking' on the press, and that reversed out type is correctly trapped.</p>
      <p>InDesign CS must surely have some kind of trickery up its sleeve to make trapping pain free?</p>
