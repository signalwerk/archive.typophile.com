    <p>Hi everyone,</p>
    <p>Black. Not the weight but the colour.<br>
    We (my colleagues and I) were discussing what each one of us used as a CMYK value for when printing a solid panel of black (just the colour, no text). A 100% K black lacks depth without percentages of C, M or Y, and as such we each had differing values for the C, M and Y added. Is there an accepted standard?</p>
    <p>With regards to typography, what would be used as the CMYK value for black, when printing white text on black? If CMY values are added, this could cause a fringing effect if misaligned when printing (yes?), so on smaller point sizes would a standard 100% K be recommeded?</p>
    <p>Cheers for any thoughts!</p>
  html_clean: |-
