    html: <p>(Oystein, I'm guessing you already know the definiton of <a target="_blank" rel="nofollow">trapping</a>. <cite>Spread</cite> is when an object overlaps the background, compared to <cite>choke</cite> which is when the background overlaps the object. Having some spread in the trap, as oldnick suggests, would mean that if the CMYK plates aren't aligned when printing, there would be less chance that the CMY colours would overlap the non-printed white areas.)</p>
