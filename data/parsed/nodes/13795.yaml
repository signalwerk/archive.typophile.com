      <p>Joan Wilking and Russ Bannon had thoroughly examined the effect of ink, paper and printing methods on both the readability and reproduction fidelity of typefaces.</p>
      <p>I'm not sure if it was published anywhere else, but an article written for Step-by-Step magazine offered valuable suggestions:</p>
      <p><em>Producing Consistently Readable and Beautifully Printed Type.</em><br>
      Joan Wilking and Russ Bannon.<br>
      I<em>nDesigner’s Guide to Typography</em>, edited by N. Aldrich-Ruenzel and John Fennell. New York: Watson-Guptill Publications, 1991</p>
      <p>I used their techniques as the guidline for printing type specimen books and posters for Agfa and Compugraphic. We took densitometer readings of the black ink (standard CYMK) only after the presses ran for awhile after makeready, and would not sign off until the readings were consistently between 160 -- 180.</p>
      <p>When you mean "black colour" I assume you are interested in producing a certain richness and depth of "black." That could mean several things in the eye of the beholder.</p>
      <p>Occasionally we would hit the black with matte varnish for that "black hole" look. Conversely we would hit the black with a gloss varnish for the sleek, shinny look.</p>
      <p>But we would NEVER run another color ink on top of the black type for the very reason you mentioned, registration.</p>
      <p>---------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
