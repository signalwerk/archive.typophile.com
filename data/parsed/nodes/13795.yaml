      <p>I guess it also depends a bit on the tints you want to use from the black. Should it be a warm or a cold gray.<br>
      For an average black I'd use: C:50  M:40  Y:50  K:100. This gives quit nutral graytones.<br>
      For a warm gray I'd use: C:50  M:40  Y:75+  K:100.<br>
      For a cold gray I'd use: C:60+  M:40  Y:50  K:100.<br>
      If you don't want to use tints, I'd go for the first option. </p>
