      <p>In the print shops I have worked in, we often employ a color called "Rich Black," which is 100%K+40%C. It punches up the black considerably without laying too much ink on the paper.</p>
      <p>You can, of course, add equal amounts of C, M and Y to "balance" the spectrum, but in no event should the combine percentages exceed 280% (out of a possible 400%), again because excess ink delays drying time and creates offsetting problems (transfer of ink between printed sheets).</p>
      <p>When reversing out type--especially smaller point sizes--try to keep the complicating factors to a minimum--that is, use Rich Black or another K+one other color combo, and include some spread in the trap so that hairline registration is not necessary.</p>
