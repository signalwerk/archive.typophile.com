      <p>Higashi,</p>
      <p>Were you considering the rich black for reversed type only?  That would make sense but not for black type on white paper.  With reversed type (if not too small) you can trap with the black solid leaving a dot and a half trap before you use other CMY colors. I prefer just 30% red and 30% blue to bulk up the black. As everyone else says, there are many formulae prefered by different printers.  You can also double-hit the black but you still need a trap.</p>
      <p>ChrisL</p>
