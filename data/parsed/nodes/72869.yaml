    html: <p>Keep in mind that it can always be lettering, not a font – especially with logos. ‘Mrs. Meyer’s’ is based on a popular American lettering style. The typefaces Nick mentioned are very much in this vein. More alternatives in <a href="http://typophile.com/node/72370#comment-420985" rel="nofollow">this list</a>. You can get pretty close with <a href="http://www.fontshop.com/fonts/singles/lanston_type_co/ltc_tourist_gothic_alternate/" rel="nofollow">LTC Tourist Gothic Alternate</a>.</p>
