  - id: 382791
    user: 3834
    date: 2009-12-08T08:59:00
    date_raw: 8.Dec.2009 8.59am
    votes: null
    html: |-
      <p>I've done a bit of research: The cap L and l/c k are swash glyphs, and the cap W is actually the swash M rotated 180 degrees with a bit of alteration. The other lower case are standard glyphs with ligatures activated.</p>
      <p>Nick Cooke</p>
