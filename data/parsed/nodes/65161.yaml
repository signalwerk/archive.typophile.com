    html: |-
      <p>It's the 'swash' feature in OpenType. It looks like that feature can't be enabled when generating a sample, but I do know it's there. </p>
      <p>Nick Cooke</p>
    html_clean: |-
      <p>It's the 'swash' feature in OpenType. It looks like that feature can't be enabled when generating a sample, but I do know it's there. </p>
