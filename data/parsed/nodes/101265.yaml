    <p>Hi there!<br>
    I'm new here and not a native english speaker. So sorry for mistakes.</p>
    <p>I'm searching for good sample applications for the PMN Caecilia, when I saw the Warner Bros. Logo.<br>
    The text "Warner Bros. Picture" really looks like it, but i saw that they use this font since the 1980s. PMN Caecilia was released in 1990...<br>
    And my second thought: the letters are not as broad as the Caecilia. But the letters have the same design.<br>
    So I'm a bit confused. Maybe you can help me? Does anyone know which font Warner Bros. use?<br>
    thx</p>
