      <p>I like the symmetry, thought I didn't quite get it at first. Still, asymmetry is a powerful design principle. It reads to me as "dio noia."</p>
      <p>I think that by taking the O out of "dio" and letting there be a space would help quite a bit. The open end to the 'o' in noia is a bit confusing. Also, I think it would be nice to see the 'i' in Noia right-side-up.</p>
      <p>It looks good, just tough to read. then again, its a tattoo right? Who else needs to read it?</p>
      <p>evan<br>
