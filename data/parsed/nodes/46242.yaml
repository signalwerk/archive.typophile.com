      <p>My thought was the same as Nick's: if the "o" becomes attached to the N (as a swashy flourish) and NOT attached to the "di" then it <em>should</em> reduce the appearance of an extra unwanted "o". The change of style for the "D" was to avoid the hassles of trying to make the "a" not look like a "p"!</p>
      <p>Keeping an eye on the legibility is key, unless you want to end up with (wait for it, neologism on its way...) a "nequigram" (design that's not readable in either direction): there are enough of those about already.<br>
      ______________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
