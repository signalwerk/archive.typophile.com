    <p>I've been attempting to design an ambigram tattoo for the past couple of years, but I'm never happy with the design. I finally drew this last week based on a typeface I saw and would like some feedback.</p>
    <p>It's supposed to be my mother's maiden name: "di Noia." I'm afraid that I've gotten to the point where I can read the name despite how illegible it may be. </p>
    <p>Sorry for the bad sketch and copy - I had to scan my sketch on the copy machine in my office. I'm in no way a professional designer, so any tips to improve it would be great. I'm trying to go for an old-fashioned/European/traditional tatoo/almost pirate-like look, hence the blackletter.</p>
    <p>This is in NO WAY a finished piece, obviously; so please don't comment on tracking and such - that stuff will come later! :)</p>
    <p>Thanks!</p>
    <p>-Scott</p><div class="imageWrap"><img src="http://typophile.com/files/tattoo design 1_5692.jpg"></div><p></p>
