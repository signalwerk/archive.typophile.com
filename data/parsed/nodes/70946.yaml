    <p>I completely forgot what this thing is called....a while back I came across this website and the website was filled with links to designers, artists websites.  These websites were all built using this websites platform. i.e. Wordpress, blogspot, etc.<br>
    But this wasn't like wordpress or a blog....you can actually build a website. I think this company starts with a "T" but I could be wrong. Anyway, I am sure someone knows what I'm talking about because EVERYONE who uses this company's platform is an artist or a designer - not a blogger, etc.  Plus most of the sites are on white backgrounds with text on the left in a small, simple font. I really hope someone knows what I'm talking about. This seems pretty popular, but I can't find any of the sites or the initial site - the site of the company - anymore.<br>
    Sorry, that's really all i got.<br>
    thanks.</p>
