    html: <p>When i was student i've find a cool method. You print your text in horizontal mirror on a rhodoid paper. As the ink haven't time to dry, you report it on a sheet. Use an ink jet printer and the result will be great. <br></p>
    html_clean: <p>When i was student i've find a cool method. You print your text in horizontal mirror on a rhodoid paper. As the ink haven't time to dry, you report it on a sheet. Use an ink jet printer and the result will be great. <br></p>
  - id: 21934
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>Bender, I use a similar technique a lot at work: I print the mirror image with the inkjet on the wrong (glossy) side of projection film and transfer while still wet to a blank piece of paper. <br> <br>Experiment a little with size and paper quality and you'll get very interesting stamp effects.</p>"
