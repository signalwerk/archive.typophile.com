    html: <p>I'll pretend that I'm Robert M and say, Yes, I would like to recreate the same weathered stamp feel. Do you know any tutorials?</p>
    html_clean: <p>I'll pretend that I'm Robert M and say, Yes, I would like to recreate the same weathered stamp feel. Do you know any tutorials?</p>
  - id: 21929
