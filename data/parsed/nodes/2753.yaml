    html: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;Here's a quick \"tutorial\" for Photoshop I made. <br> <br>0. Download or make some \"grunge\" brushes <br>1. Create some type on white backround. Rasterize the type. <br>2. Use eraser tool with grunge brushes to wear out the text. Add some filter-&gt;distort-&gt;ripple and pinch/punch etc. <br>3. Add layer effects, some white inner glow looks nice. Flatten the image <br>4. Make a different image that has a paper texture. Paste the stamp on the background, use blend mode \"multiply\" <br> <br>Edit: Oops...I should've thought about his a bit more, now there isn't any inking in the corners... <br> <br><img src=\"http://www.typophile.com/forums/messages/83/24464.jpg\" alt=\"\">&lt;/font&gt;</p>"
    html_clean: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;Here's a quick \"tutorial\" for Photoshop I made. <br> <br>0. Download or make some \"grunge\" brushes <br>1. Create some type on white backround. Rasterize the type. <br>2. Use eraser tool with grunge brushes to wear out the text. Add some filter-&gt;distort-&gt;ripple and pinch/punch etc. <br>3. Add layer effects, some white inner glow looks nice. Flatten the image <br>4. Make a different image that has a paper texture. Paste the stamp on the background, use blend mode \"multiply\" <br> <br>Edit: Oops...I should've thought about his a bit more, now there isn't any inking in the corners... <br> <br><img src=\"http://www.typophile.com/forums/messages/83/24464.jpg\" alt=\"\">&lt;/font&gt;</p>"
