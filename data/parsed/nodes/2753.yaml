    date_raw: null
    votes: null
    html: <p>The technique I used to use was to set the type you want as large as you can on a letter-sized piece of paper, then print it out on a laser printer, crumple it up as many times as it takes to get the distortion you want, then scan it back in.</p>
    html_clean: <p>The technique I used to use was to set the type you want as large as you can on a letter-sized piece of paper, then print it out on a laser printer, crumple it up as many times as it takes to get the distortion you want, then scan it back in.</p>
