    html: <p>As it looks now, at least a couple of the batch files -probably including DTL KernMaster- will come available later this year for OS X. As I have stated earlier, from a font production point of view so far I actually did not see much reason for porting the stuff to Mac OS X. The Classic version functions fine and there is, of course, also an excellent Windows version. However, I am quite aware that a number of potential users of FM only want to work with Macs and is only interested in OS X versions. With the latest Intel based Macs and the ending of the Classic mode, we now basically have no other choice than to release OS X (Universal) versions of the FM modules.</p>
