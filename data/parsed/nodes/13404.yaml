      <p>The disabling of the kerning does indeed leave not much space for testing<br>
      the Light version of DTL KernMaster. I will discuss the option of generating<br>
      a limited number of kerning pairs in the Light version during the next<br>
      meeting with the FM programmers. </p>
      <p>The separate modules in combination with the batch functionality makes DTL<br>
      FontMaster especially suitable for larger font productions. However, in the<br>
      new 2.5 edition, which is scheduled for this autumn and which I will show in<br>
      Helsinki, it is not necessary anymore to do most things in batch when only a<br>
      few fonts are in production. Fonts can be directly imported and exported<br>
      (including OpenType fonts with automatically generated features) from both<br>
      DTL Bezier- and IkarusMaster. Also the improver functions can be applied to<br>
      a complete font in the editors. Furthermore the drawing capabilities are<br>
      being enhanced at this very moment and will be much easier to handle. The<br>
      interface is also undergoing a facelift. </p>
      <p>Basically this means that DTL Bezier- and IkarusMaster will function as full<br>
      powered standalone applications. For checking, improving and generating<br>
      (OpenType) fonts in batch, respectively ContourMaster and DataMaster can be<br>
      applied still.</p>
