    html: |-
      <p>Bert,</p>
      <p>Sorry for this somewhat delayed reply. The new 2.5 edition of FM will be available for Windows and Mac OS 9 / Classic. An OS X version of FM is under development but it will take some still before this will be released. However, the new 2.5 release is more than worth to install Classic or even to switch to Windows. </p>
      <p>I have never had any doubts about the superiority of FM when it comes to the production of fonts, especially OpenTypes. The technical quality of the produced data and the automation of OT features generation make FM hard to beat. As you probably know, the listed typographic features in the FM Feature file are automatically generated when the corresponding characters are in the glyph database. Actually I would not be surprised to see this method becoming standard in OT font production software in the near future.</p>
      <p>Now also the drawing functionality of FM has been enhanced a lot, including a series of guideline related functions and for instance also a variable display of points. In the 18 years that I have been working with font tools I have never seen better drawing functionalities than the ones in the new FM edition. Finally, the interface has been polished and all icons replaced.</p>
      <p>Although producing font tools is very interesting, at the end these are meant to produce type. In time the technology will be mostly forgotten but well designed and well produced type will remain. This autumn/winter the Dutch Type Library will present DTL Antares by Erhard Kaiser. DTL Antares is the serif companion for DTL Prokyon and is, of course, produced with DTL FontMaster. A preview can be found at: <a href="http://www.dutchtypelibrary.nl/PDF/M504/DTL%20Antares_preview.pdf" title="http://www.dutchtypelibrary.nl/PDF/M504/DTL%20Antares_preview.pdf">http://www.dutchtypelibrary.nl/PDF/M504/DTL%20Antares_preview.pdf</a></p>
      <p>To return to the initial question of this topic: with the new Light version of DTL KernMaster it should be possible to generate 25 kerning pairs at the time.</p>
    html_clean: |-
