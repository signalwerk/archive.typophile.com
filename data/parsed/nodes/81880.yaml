    html: |-
      <p>By removing the right arm of ‘f,’ you’ve actually transformed that last one to “Lit List” (with a long-s = ſ ).</p>
      <p>Why don’t you just let the ‘ft’ ligate at the crossbar and leave the tops unconnected? If you add a ball terminal to the ‘f,’ it will mirror your ‘it’ ligature and give the logo some lift, instead of keeping it all closed in.</p>
    html_clean: |-
