    html: |-
      <p>I also think the middle one is the best, however the last one is a close second though.</p>
      <p>Reason I think the middle one is the best is because the the "t" flows within the ligature, as if the top was almost a holster for the ball terminal of the "f".  The "t" on the last one seems out of style with the rest of the glyphs, and because there is another "t" in the logo, people might compare the two for differences making them focus on a perceptional error instead of the cleverness of your design.</p>
      <p>It's looking real good!</p>
