    html: |-
      <p>I believe the ft crossbar should have a single even stroke, and that the ascender on the final t should not be curved on the left.<br>
      These are shapes informed by the broad pen, so it would be wise to structure them accordingly.<br>
      Also, there is no necessity to make the ball of the f the same size as the tittle, it might be better smaller, allowing more room for the ascender of t.<br>
      At any rate, the open tittle looks too small compared to the ligatured tittle.</p>
    html_clean: |-
