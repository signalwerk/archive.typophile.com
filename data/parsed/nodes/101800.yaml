      <p>&gt;  the exponential growth</p>
      <p>If you keep that general look, you might consider reversing it so the lightening bolt is pointed to the right. Two reasons — since we read from left to right, objects that point to the left can seem to be pointing backwards, and also if the lightening bolt represents growth in the sense of a graph, you want the graph going up.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/logo-flopped_4785.jpg"></div><p></p>
