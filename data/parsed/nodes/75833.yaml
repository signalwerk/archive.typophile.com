    html: |-
      <p>I think whatever this began as, it has been altered. I seem to see possible connections to Perpetua. The J is closer to a shortened Perpetua J than a truncated Times J, I think. Perpetua's letters, such as the R are also wider. It might be a 'Franken-font', with parts from different fonts, AND with some editing. </p>
      <p>- Mike Yanega</p>
