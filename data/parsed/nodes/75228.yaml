    html: |-
      <p>Apple has been ignoring the FOND ID* since MacOS 8 (1997). </p>
      <p>Actually, FOND ID is still being used when Mac OS X installs a Mac Type 1 font, but only for the purpose of identifying which codepage the font should be reconigzed at (MacRoman, MacCE, MacCyrillic etc.). But the FOND IDs no longer need to be unique, so I wouldn't worry about it at all. </p>
      <p>Best,<br>
      Adam</p>
