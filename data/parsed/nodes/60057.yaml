    html: |-
      <blockquote><p>What do you mean by “thought legal boundaries?”</p></blockquote>
      <p>Having read and heard about cases of plagiarism, I think I may say that the felt difference between what the law may seem to state and what experts called in by the court may decide to advise can be breathtaking to those who think (thought) of their designs to be protected legally (the boundary in this case). In Germany, a typeface design is considered to be applied art which means that the work you did as a typeface designer cannot be truly new and unique. One can register a design as ‘Geschmacksmuster’ though. This costs money and it is only a registration. When someone else has registered a similar design (before you) or even your design (!), things may become troublesome. After all, who can tell wether two designs are the same, similar or different enough? Experts called in by the court in such cases may be experts on antiques, art, design or whatever, but not necessarily on typeface design on a level that you might expect or would like them to be.<br>
      A classical example of how a court may decide on originality is the design of the figure 1 in the ARD logotype as can be seen here top left: <a href="http://www.ard.de" title="http://www.ard.de">http://www.ard.de</a> The ARD is the largest stately owned broadcasting institution in Germany. After the ARD launched its new logo, a German commercial broadcasting station that was new to the market decided to have a figure 1 in its name Kabel 1 (Cable 1) and logo as well. It did not take long until they were sued by the ARD for plagiarism. Although the ARD 1 had been explicitely and exclusively designed for ARD (there is no typeface that includes a 1 in this design), the court decided that the (registered) design of the figure 1 was not original enough to deserve protection at all. The 1 has been drawn on an angular grid and although we may consider this to be quite unique for a figure 1, the court decided that it was not. I find it astonishing that even an institution like the ARD who can spend more money on a legal case than all members of Typophile may bring up together, has not been able to win this case.</p>
