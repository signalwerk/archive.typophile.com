      <p>I know this is a really old subject but I was in a similar situation myself. So for anyone else picking up on this thread: The closest font to Argo I found is Praxis Pro with a 98 % Horizontal scaling (or 2% slimmer). Gerhard Unger designed Praxis in the late 70's and it's still a really modern font. Used in small sizes, Praxis is a cheaper alternative to the very pricey Argo. I've now bought both. </p>
