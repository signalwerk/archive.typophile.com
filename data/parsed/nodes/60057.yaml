      <blockquote><p>Does any have a source to legal documentation that states what the minimum deviation from a font is before it’s not breaking copyright? It may be the case that a 2% distortion is in fact acceptable.</p></blockquote>
      <p>Dear Chris, although I think this is not what you may have intended writing the quoted sentence, I would like to point at the following: Even if their would be legal documentation that states something about a minimum deviation, how would one define, measure and evaluate this? ‘Two percent of a typeface’: Of a given font? Of the latin letters? ‘Considerable difference’: How much is considerable? Such a document will hardly give us a clue of what may turn out to be acceptable when a court has to decide on such a case or what a committee of experts may advise or what lawyers may agree on before such a case comes to court. Also we have to take into account that the value of legal documentation is more or less related to the legal situation in the country for which the documentation applies. Different countries, different laws …</p>
      <p>I think that the easiest way for a forum like this is to simply keep the obvious pirates out and that ‘2% discussions’ tend to be contra-productive. Being designers and foundries living in the small world of applied arts, I think we should try our best to be fair to each other rather that discussing on how to try to stay within thought legal boundaries.</p>
    html_clean: |-
