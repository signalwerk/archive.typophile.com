      <p><em>I’m wrong. You’re right, Nick.</em></p>
      <p>Thanks for the empirical corroboration, William. However, I can't claim any credit for divining that, as my hypothesis was based on assumptions about the marketplace. I just found it inconceivable that in a competitive segment of the publishing industry, that publishers would not conduct focus groups, or be aware of the reading issues, or not try different type treatments, in an attempt to sell more product. And so the standard that has become established -- as with news text -- may be considered to represent the kind of product that readers prefer, and is not just a style foisted on them by a monolithic industry. In that sense, it's similar to newspaper text type, extremely conservative in its adherence to certain sizes and styles, and woebetide any typographer who deviates too greatly from the norm.</p>
      <p>A scenario I'm familiar with is where a newspaper is redesigned and a focus group (or the readers in the letters page) say a particular type spec is too small. Of course, the type is not smaller, the readers just don't like it, or aren't prepared to make the adjustment to become familiar with it.</p>
      <p>One interesting aspect of large print is book size: it seems that readers like a normal-sized book (although it will, of course, be thicker). I suspect this is for social and cultural reasons, or maybe even the size in their hands for ease of page turning. In the study you cite, participants were kept at a distance of 40 cm from the text -- so I wonder, what if they had used smaller text, but a closer distance?! In other words, the typographic factors -- numner of words per line and page -- may be quite significant.</p>
