      <p>It's probably a mistake to draw a line between them and us.<br>
      All one can say is that there are varying kinds of reading ability, and varying degrees.</p>
      <p>Go to your local library or bookstore and look in the large print section, and see what kinds of typefaces are being used. This shows what people who have some difficulty reading prefer. Of course, being short-sighted and being dyslexic are different, but it can be argued that large print helps both -- in particular because large print is also used for another group of people who don't read fluently: children learning.</p>
      <p>For young reader books, the practice changed from serif to sans serif during the second half of the 20th century. Has this had any effect on overall literacy? Probably not.</p>
      <p>At the RNIB website, they don't have a preference between sans or serif.</p>
