      <p>You might, but then... The thing to remember about dyslexia is it can't be "solved" by making a new typeface or by using a specific typeface in one place. I certainly have sympathy for people with extreme dyslexia, but you can't re-make the world, with all its magazines, fine print, illuminated signs, motion graphics, airport and city navigations, in a way that resolves the difficulty dyslexics have in reading. </p>
      <p>Which is more useful to a dyslexic: a typeface used in 2 places, or new methods for reading they can apply everywhere?</p>
