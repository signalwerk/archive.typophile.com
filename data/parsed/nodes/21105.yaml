    <p><strong>Building Letters III<br>
    Call for participation</strong></p>
    <p>The <a href="/wiki/Building%20Letters" class="freelinking" rel="nofollow">Building Letters</a> project continues! An international team of typographers, designers, and editors vivified the idea to publish this magazine. The Building Letters 3 would raise money to help those affected by the Asian Tsunami in 2004, an event which dominated the news for such a short time, but where people still need our help, long after the cameras have gone home.</p>
    <p>The integral part of the magazine is a CD containing free fonts. The main reason to include a CD is to make the magazine more attractive for those who buy it. Not only they receive a magazine, but also some added value they can use in their own projects.</p>
    <p>The last issue of Building Letters, published by <a href="/wiki/Jim%20Richardson" class="freelinking" rel="nofollow">Jim Richardson</a>, contained a CD with 30 fonts by various designers (<a href="/wiki/Max%20Kisman" class="freelinking" rel="nofollow">Max Kisman</a>, <a href="/wiki/Neville%20Brody" class="freelinking" rel="nofollow">Neville Brody</a>, <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a>, etc.).</p>
    <p>Please help us to make BL3 project successful. We need to create a valuable collection of fonts. If you wish to participate, please contact me at <a href="mailto:filip@designiq.cz">filip@designiq.cz</a>. Every participating designer will have his/her own folder on the CD; the folder should contain PC and Mac version of a font (OT fonts preferred) and it could also contain EULA and/or catalog in PDF.</p>
    <p>Thank you for helping us, and the victims.</p>
    <p><a href="/wiki/Filip%20Blazek" class="freelinking" rel="nofollow">Filip Blazek</a><br>
    <a href="http://www.buildingletters.org" title="http://www.buildingletters.org">http://www.buildingletters.org</a><br>
    <a href="http://www.designiq.eu" title="http://www.designiq.eu">http://www.designiq.eu</a></p>
    <p>(Typophile discussion at <a href="http://typophile.com/node/8461" title="http://typophile.com/node/8461">http://typophile.com/node/8461</a>)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cover.jpg"></div><p></p>
