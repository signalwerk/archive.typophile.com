      <p><cite>Now the actual scalable font _implementation_, the *.ttf file or whatever, would be copyrightable (for good reasons) (but not bitmap fonts, maybe ironically). As long as you made your own fonts from scratch you'd be fine. You can copy whatever typeface you want, but the actual font is something you'd have to make on your own.</cite></p>
