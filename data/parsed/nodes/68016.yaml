      <p><cite>I doubt, that the designer of the Ubuntu typeface does not have Prokyon stored on his harddisk and did not have a deep look into it in FontLab.</cite></p>
      <p>Arno, is it really that difficult to believe that one could independently produce such letter shapes given even passing familiarity with the spurless look? I've looked at Prokyon only in passing a long time ago, but if someone asked me to draw a logo for Ubuntu in Prokyon's style, I would have no trouble producing these kinds of shapes. Even if I had never seen Prokyon but merely had some general exposure to other spurless sans serifs, it would be easy to duplicate them. They're really simple shapes!</p>
      <p>As you can follow in the thread it isn't even easy to establish who came up with the idea first, probably because it's such a simple idea. All I know is that I see spurless sans serif faces everywhere; in advertisements in the Paris metro, for instance.</p>
      <p>A few years ago I started designing a slab serif with a spurless look in some letters. I think I took the idea from the Perpetua 'd' and made it a recurring design feature. Then I posted it to the crit board here, and someone pointed out the striking similarities to FF Signa, which I hadn't seen before.</p>
      <p>So I know from personal experience that the same set of simple design ideas can result in a typeface similar to an existing one even if one hasn't even seen the existing design. You can knock the failure to innovate, but you can't throw in accusations of piracy in those cases.</p>
