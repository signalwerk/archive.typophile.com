      <p>Hi Florian, I did not know Aeonis before reading your comment.&nbsp;&nbsp;:)</p>
      <p>Mr Savard, when you say, <cite>if every sans-serif font which looks squarish but has rounded corners is plagiarism, design space will shrink</cite>, this is too much of a carricature.<br>
      Doing something similar to something existing is not per se plagiarism. It is more about doing something too similar, which 'too' is defined by context -- the context of other typefaces. As long as there is only one crisp text face with said special stem-to-shoulder solution, then if someone else designs a crisp text face using said stem-to-shoulder solution too (even if a number of letters differ), then it is evident that this someone merely wanted to do "something like this". But once there are five or six typefaces sharing common characteristics, then you may speak of a genre, these typefaces constitute a new design space: The existence of many similar typefaces forces us to spot (and create) even finer differences <em>within</em> this design space which actually broadens this particular design space. For example, there are quite a number of typefaces of the AG genre, or of the DIN genre, and it seems still possible to come up with new facets within these genres or bridging two or more such genres.</p>
