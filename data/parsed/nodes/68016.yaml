      <p>Apparently the secret is out now - yes, we're responsible for the design. And no, of course it's not plagiarized - like all of our custom designs it was drawn from scratch with no reference to any existing font.</p>
      <p>While there are superficial and coincidental similarities between the handful of characters you've seen, the rhythm, proportions, and details are completely different between the two fonts.</p>
      <p>Reports that this is not the final version of the logo are correct - the final version depends on the typeface currently in development - but this is a good indication of the direction in which we're heading.</p>
      <p>David Marshall<br>
      Dalton Maag Ltd</p>
