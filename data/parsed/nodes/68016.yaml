      <p>A lot of the typefaces mentioned don't fit the category.<br>
      What we're talking about is a sub-genre of "pruned stem" where the standard join between vertical stem and curve is around 70˚- 80˚. So types with 0˚ or 90˚ joins don't count.<br>
      Neither do those where only the odd character has such a join.</p>
