      <p>The reductionist approach had been going on since before World War I and is not news. It is just another way of looking at letterforms--fair game for use and abuse like any other construction. I began doing it in college in the 1960s and more recently, developed a family (yet to be released) in 2005 called "Dez Superego" I by no means claim to be the first. I also did not look at any other type when I was doing Superego so perhaps this is not such an impossible coincidence for Dalton Maag to have something similar as well?</p>
