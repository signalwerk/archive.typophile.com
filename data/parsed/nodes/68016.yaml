      <p>The somewhat generic joint of stem and shoulder can already be found in Rund Grotesk aka Kristall Grotesk. Its history is Grotesk (Wagner &amp; Schmidt, Leipzig, ca 1920) aka Universal (Staatsdruckerei Prag, since 1922) aka Polar Grotesk (J John Söhne, Hamburg, since 1930) aka Rund Grotesk (C E Weber, Stuttgart, since 1931) aka Kristall Grotesk (Norddeutsche Schriftgießerei, Berlin, since 1937, and later also Johannes Wagner, Ingolstadt).*<br>
      See <a href="http://www.kltf.de/stuff/wagner_kristall_grotesk.jpg" target="_blank" rel="nofollow">this scan</a> of an undated but obviously rather 'new' Kristall Grotesk specimen by Johannes Wagner.** The generic joint seems to be the default 'u' in all sizes. The 28p shows this in the 'n' too. Unfortunately I do not have specimens of the older versions of this typeface, so cannot check if this visual feature can be found there too, and in which letters.</p>
      <p>If a logo relies on this visual feature alone, this does not necessarily constitute plagiarism, given that this feature has quite a history already. What disappoints me more is that not long after Prokyon's appearance, at least two other typefaces showed up which merely said, 'me too! me too!'<br>
      Dax predates Prokyon but due to its odd proportions and roundness is more of a fancy display face, as are Bernhard Gothic and Gerstner Original, while Prokyon is a 'serious' text face of quite a different character and quality.</p>
      <p>* Bertheau, Hanebutt-Benz, Reichardt: <em>Buchdruckschriften im 20. Jahrhundert</em>, Technische Hochschule Darmstadt, 1995, captions on pp 191 and 281.</p>
      <p>** Lettern-Service Ingolstadt / Schriftgießerei Joh[annes] Wagner: <em>Kristall Grotesk (Rund-Grotesk)</em>, n.d.</p>
