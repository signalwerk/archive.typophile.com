      <p>EDIT: after further inspection, may be I'm not so wrong with Futura, /c does not look so off. I was probably abused by sample quality and tight tracking. BTW, <a class="freelinking external" href="http://www.myfonts.com/fonts/efscangraphic/futura-sh" rel="nofollow">Scangraphic SH</a> version of Futura might the lightest Futura you could find (or at leat I'm aware of).</p>
