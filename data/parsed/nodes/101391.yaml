    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pvmagazine_5509.png"></div><p></p>
    <p>This one looks very familiar but I can’t pin it down. It is the masthead from the <a href="http://www.pv-magazine.com" rel="nofollow">pv magazine</a>. So possibly it is custom, but the »e«, »a« and the »g« look very familiar to me, but I have no clue. Just found similars. </p>
    <p>Another thing which let me think it could be custom, is that in all the PDFs (at least those I have seen) they use the masthead inside their copy texts only as embedded picture. </p>
    <p>Anyway, I’ll want to give it a try here. </p>
    <p>FYI: It’s from a request from a german type-ID site. I am interested in the typeface (if it is one), because it looks clean, contemporary and useful. </p>
    <p>Thanks in advance.</p>
