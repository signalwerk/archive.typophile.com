      <p>Gabriola (with secondary and contextual variants as well as ‘corsiva’ forms of a and g):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gabguid_3545.gif"></div><p></p>
      <p>By the way, ‘guidance’ is a good test word for this because it puts the d and a next to each other. One of the things I note about single-storey a is that the counter and bowl always appear slightly larger than that of d if actually the same size. In Gabriola, and in italic fonts, I optically compensate by making the a slightly narrower than the d.</p>
