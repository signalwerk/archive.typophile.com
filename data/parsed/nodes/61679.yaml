      <p>thank you for all those exampes !</p>
      <p>but may I also ask for your opinion (as probably more expierenced type-designer and/or type-user): is it useful to have these alternatives? for which kind of effect could it be useful? when do you think does it make sense?</p>
      <p>the explanation of the features of trilby calls the single-storied version ‘schoolbook-version’ (some of your other suggestions lead into this direction as well). it covers connotations like simpleness and reduction and this fits to the context of this geometric, constructed style.</p>
      <p>do you know about other purposes for which the double- or one-storied variants are typical? (like: one-storied for reading from distances, two-storied for text-sizes ...just a guess)</p>
      <p>nicole</p>
