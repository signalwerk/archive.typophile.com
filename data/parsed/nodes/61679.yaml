      <p>My recent release Organon Sans has those characters as separate style sets: 'a' as style set 1,  'g' as style set 2 and  'y' as style set 3, so that they can be mix-and-matched if so desired. It can be useful if the user knows what they are doing, for example a double storey 'g' may be desired for text setting, single for headings.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Para_3462.gif"></div><p></p>
      <p>BTW John, I just love Gabriola. </p>
      <p>Nick Cooke</p>
