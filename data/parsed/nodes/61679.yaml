    <p>dear typophiles,</p>
    <p>I’m going to study at the Reading MATD in a few weeks and started my first warmup research-exercise:</p>
    <p>I stated this exercise with a quesion of mixing one-storied and two-storied g’s and a’s in one font and how this decision can affect the delivered impression. What are the reasons and arguments to decide which forms to use and what kinds of problems would you associate with this question? In which context does one form make sense and in what context the other?</p>
    <p>I know my question is quite general in the moment but nevertheless I would appreciate any hint concerning:</p>
    <p>&gt; examples of typefaces which provide alternatives (both styles)<br>
    &gt; historical background about the one- and two-storied forms<br>
    &gt; any rules or conventions in which one style should be used<br>
    &gt; connotations/denotations for the single characters<br>
    &gt; ...advices which I’m not able to think of by now</p>
    <p>thanks a lot!<br>
    nicole</p>
    <p>PS are there any serif-fonts with one-storied a or g? Or fonts with double-storied a but one-storied g (which is more unusual than the opposite)?</p>
    <p>PPS some examples</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nr1_4646.png"></div><br>
    number one from darden studio – the font jubilat offers geometric and traditional characters (as they call it). this refers to the understanding I had: two-storied letters are more formal and typographic, one-storied letters are more modern and constructed on one hand but written on the other, which is a bit paradox ...<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nr2_3884.png"></div><br>
    the second example shows an attempt to include both forms of g and a into one font to offer solutions for different purposes (e.g. text versus signage). this example came with the question in the beginning.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/utility_basic_4055.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/utility_stylisticset1_3875.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/utility_stylisticset2_5726.png"></div><p></p>
    <p>and these pictures of ff utility (basic forms and two stylistic sets) bring up the question: is it going to be standard to offer both/more forms in sans serif fonts ...? or is it just to use provided possibilities of layout-programms...</p>
