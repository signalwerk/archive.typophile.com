    html: "<p>Personally, I don't think these variants are generally useful. In effect, they are mixing different styles of lettering within a single typeface, so the question should be in what circumstances is this desirable or useful. Gabriola is a hybrid typeface by design, intended to be able to support this kind of variation by providing a base design that combines elements of formal and cursive lettering, such that it can be pushed in either direction by the use of different variant sets. But single-storey letters in the context of roman types always seems weird to me, like a woman in an evening gown wearing combat boots. There's nothing wrong with combat boots: they just belong with a different style of dressing.</p>"
