    html: |-
      <p>Well, in Hebrew any serifs are tricky* and serifs that are supposed to be as thick as the stems are likely to introduce too much functional "noise".</p>
      <p>* See Gill's fiasco:<br>
      <a href="http://www.myfonts.com/fonts/lerfu/gill-hebrew/" title="http://www.myfonts.com/fonts/lerfu/gill-hebrew/">http://www.myfonts.com/fonts/lerfu/gill-hebrew/</a></p>
      <p>hhp</p>
  - id: 534434
    user_id: 18444
    user_name: gohebrew
    user_path: null
    date_raw: 18 Dec 2012 — 6:34am
    date: 2012-12-18T06:34:00
    votes: null
    html: |-
      <p>I have seen Gill used as an effective display face.</p>
      <p>It is a fiasco because the forms were weird to look at.</p>
      <p>In my view, the aleph is too heavy and over-weighted compared to the other letters. Many designers do this, because the form of the aleph's middle bar is dominant.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gill_heb_5380.JPG"></div><p></p>
