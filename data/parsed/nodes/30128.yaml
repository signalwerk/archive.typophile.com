    html: |-
      <p>The term “Gothic” was first used to describe this script in 15th century Italy, in the midst of the Renaissance, because Renaissance humanists believed it was a barbaric style of handwriting&nbsp;(“gothic” ads a synonym for “barbaric”). Flavio Biondo, in “Italia Illustrata” (1531) thought it was invented by the Lombards after their invasion of Italy in the 6th century.<br>
      The name (term) was also affected by geographic locations and other scripts were labelled “Gothic”, in contrast to <a href="http://typophile.com/node/30104" rel="nofollow">Carolingian minuscule</a>.<br>
      Also check out the calligraphic tradition in Aldus Manutius (Francesco Griffo).</p>
    html_clean: |-
