    html: <p>I think it is a bit misleading to call Roman style 'geometric'; the main feature is its round arches, replaced with broken lines in the Fraktur styles. The preference for the Roman capitals and the carolingian miniscule, which was closer in look to Roman caps, has to do with the Humanist movement and the fact that they were publishing in Latin language. Harry Carter's 'A View of Early Typography' is one of the best works on this.  Your university library should have it.</p>
    html_clean: <p>I think it is a bit misleading to call Roman style 'geometric'; the main feature is its round arches, replaced with broken lines in the Fraktur styles. The preference for the Roman capitals and the carolingian miniscule, which was closer in look to Roman caps, has to do with the Humanist movement and the fact that they were publishing in Latin language. Harry Carter's 'A View of Early Typography' is one of the best works on this.  Your university library should have it.</p>
