    <p>Hi all -</p>
    <p>I've been looking (unsuccessfully) for a script font that has some of the detail in the fill of the letterforms (the little lines) seen in the letters below. Eventually, I'll have to probably draw what I want by hand, but I'm hoping to find a usable substitute to include on mockups...</p>
    <p>Any leads?</p>
    <p>Thank you thank you!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/2907077367_24e4f934e9_4931.jpg"></div><p></p>
