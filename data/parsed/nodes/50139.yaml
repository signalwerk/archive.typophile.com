    html: |-
      <p>hi,</p>
      <p>this is the engraving lady and yes, this is engraved, probably by hand.  </p>
      <p>its not a font.  do you have the plate (or die) or just the print. </p>
      <p>there are 2 categories for this kind of font available: script and calligraphic (calligraphy.)</p>
      <p>the "lines" are either the shadow cast within the "cut" or the guide lines scribed first. neither of which will help you.</p>
      <p>if your task is to replicate this, best and (historically "correct" according to the market) is to re-draw it in illustrator.  it will be lovely.  and maybe you can use the lesson learned for someothing else.</p>
