    html: |-
      <p>It would take some time, but only once ;) You could copy and edit one of FontLab’s naming files (.nam) in /Library/Application Support/FontLab/Mapping so that includes the small cap names instead of the lowercase names:</p>
      <pre>%%FONTLAB NAMETABLE: Small Caps
      0x0020 space
      0x0021 exclam
      0x0022 quotedbl
      [...]
      0x0041 A
      0x0042 B
      0x0043 C
      [...]
      0x0061 a.small
      0x0062 b.small
      0x0063 c.small
      0x0064 d.small
      0x0065 e.small
      [...]
      </pre><p>
      ... and then use this file via the menu Glyph -&gt; Glyph Names -&gt; Generate Unicode to reassign the unicode values in the current font.</p>
      <p>By the way, good luck for Letters From Sweden :)</p>
