  html: |-
    <p>What would you do instead of doing what I'm doing right now? :)</p>
    <p>1. Glyph &gt; Rename glyph<br>
    2. Remove ".small"<br>
    3. Clicking the green arrow to get a unicode number<br>
    4. Clicking "Rename next glyph"<br>
    5. Repeat for all small caps</p>
    <p>It's important that the glyph will be renamed in all OT-code and classes aswell, so just deleting the suffix wont work. I want the kerning to move with the renaming.</p>
    <p>Any ideas, much appriciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/renam02830_3565.png"></div><p></p>
