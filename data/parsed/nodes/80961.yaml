  html: |-
    <p>Fonts.com Web Fonts now provides advanced features for controlling how Web fonts are loaded into Web pages.</p>
    <p>Customers can now use the WebFont Loader, an Open Source JavaScript™ library that provides a variety of options for Web developers to control the Web font loading experience. The WebFont Loader is served through the Google AJAX Libraries API.</p>
    <p>The functionality allows developers to deliver a more consistent experience across browsers and tap additional features related to the process of downloading and displaying fonts on a Web page. At various phases of Web fonts loading into a browser, WebFont Loader provides notification of event status. Web developers can then write code to control browser behavior based on the status of events. For example, one popular use is to combat the notorious “flash of unformatted text” (a.k.a. FOUT). A description of WebFont Loader capabilities is provide on the Google Font API website located here: <a href="http://code.google.com/apis/webfonts/docs/webfont_loader.html" title="http://code.google.com/apis/webfonts/docs/webfont_loader.html">http://code.google.com/apis/webfonts/docs/webfont_loader.html</a></p>
    <p>Fonts.com Web Fonts offers over 10,000 premium quality fonts from leading type designers and foundries for license as Web fonts. Fonts.com Web Fonts makes it simple and fast for Web designers and developers to implement Web fonts by adding a single line of code to Web pages. Both JavaScript and non-JavaScript options are available. The WebFont Loader JavaScript library hosted by Google offers an alternative method for loading the fonts and CSS defined within Fonts.com Web Fonts projects.</p>
