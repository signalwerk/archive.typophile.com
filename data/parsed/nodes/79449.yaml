    <p>Hi everyone  : )</p>
    <p>I've been looking for HOURS, and still can't seem to find a nice sans with hi-contrasting thicks and thins.</p>
    <p>There is an example of one along the lines of what i'm after here:<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/juraj-chrastina/kammerlander/" rel="nofollow">Kammerlander</a></p>
    <p>But I would like one with more elegant and proportioned curves.</p>
    <p>I would like to thank everyone in advance for taking the time to help out  : )</p>
