      <p>I didn't spot a font that matched these Spanish wine shop letters.<br>
      Here is a somewhat similar font of about the right stroke thickness based on lettering found on buildings constructed in Spain's Andalucian region in the 1930's and 1940's. John Chippindale's Avenida<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Avenida_A-M_5050.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/Avenida_N-Z_5276.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/Avenida_lc_a-m_6592.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/Avenida_lc_n-z_5436.gif"></div> <a href="http://www.myfonts.com/fonts/letraset/avenida/" title="http://www.myfonts.com/fonts/letraset/avenida/">http://www.myfonts.com/fonts/letraset/avenida/</a><br>
      Many other Art Deco fonts, but none that I saw get much closer.<br>
      Don<p></p>
