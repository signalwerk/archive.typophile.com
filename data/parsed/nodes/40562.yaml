    html: "<p>Thanks alot for the suggestions. Most of them were exactly what I was looking for. After working a bit more on the project though, I've come to decide that I wanted a bit more realism. I would be too easy and not dangerous enough to just make it ironic. I want to show how our mock-corporation actually could be a future possibility. So I ended up using something slightly different: Eurostile LT Std Bold Oblique. I found that it suited the job, with its round (cf. the comic fonts), yet solid (cf. impact) look.</p>"
