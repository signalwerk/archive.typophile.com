      <p>Did you turn the kerning on?<br>
      Pablo's page - <a href="http://www.impallari.com/testing/">http://www.impallari.com/testing/</a> is an excellent tool for testing. Under "OpenType Features" you can set desired feature and watch changes.<br>
      Kern off<img src="/sites/default/files/old-images/un_k_3836.jpg"><br>
      Kern on<img src="/sites/default/files/old-images/k_3666.jpg"><br>
      It looks like this<img src="/sites/default/files/old-images/06_3991.jpg"></p>
