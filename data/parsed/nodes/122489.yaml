    <p>Hi,</p>
    <p>this is my first post in the forum. Let me first introduce myself. My name ist Karsten (alias PoohBear) and I have lately found this new interesting software fontforge. And it amazes me what one can do with the software, I am not into fontdesign professionally, but I am playing with the idea of creating my own stuff. I love to play with all kinds of things.</p>
    <p>Anyway, I am not getting fontforge to kern those few letters that I have designed. I am testing those few letters "ABCDEaoge" in browsers by inserting<br>
    @font-face {<br>
        font-family: "myFont";<br>
        src: url("myFont.ttf") format('truetype');<br>
    }<br>
    I have read that a font is no good without kerning, so I want do get it right from the start. Sorry if this post sounds newbie to you. But that is what I actually am. I've tried the options button before generating the font, checked "windows-compatible kern" and tried the oder checkboxes too. It simply doesn't work for "Tage"</p>
    <p>I'd appreciate your help.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/kern.png" width="1802" height="905" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Tage.png" width="166" height="117" alt="">
