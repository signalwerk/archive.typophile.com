      <p>Did you turn the kerning on?<br>
      Pablo's page - <a href="http://www.impallari.com/testing/" title="http://www.impallari.com/testing/">http://www.impallari.com/testing/</a> is an excellent tool for testing. Under "OpenType Features" you can set desired feature and watch changes.<br>
      Kern off</p><div class="imageWrap"><img src="http://typophile.com/files/un_k_3836.jpg"></div><br>
      Kern on<div class="imageWrap"><img src="http://typophile.com/files/k_3666.jpg"></div><br>
      It looks like this<div class="imageWrap"><img src="http://typophile.com/files/06_3991.jpg"></div><p></p>
