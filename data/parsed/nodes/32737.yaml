    <p>April 1, 2007, Berlin — FSI FontShop International proudly announces <a href="http://fontfont.com/downloads/" rel="nofollow">FF Mt</a>™, Erik Spiekermann's most economical typeface ever. Employing obscure but powerful techniques like <em>vwl mmssn</em> and <em>cap reduction</em>, FF Mt uses up to 50% less paper, screen real estate, and wall space than other text faces without a single condensed letter.  The German government has already incorporated FF Mt in their <a href="http://translate.google.com/translate?u=http://www.fontblog.de/erster-font-mit-opentype-sprachintelligenz" rel="nofollow">road sign system</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vorwegweiser_gross_3612.gif"></div><p></p>
    <p>--------------------------------------------------------<br>
    <em>Before (left): Inconsistent hierarchy. Is Mönchengladbach less important than Münster or Dortmond? After (right): Clean hierarchy, increased legibility, 15% smaller sign saves costs.</em></p>
    <p>In addition to its conservationist benefits, FF Mt also enables the generation of buzzwords, product names, and Web 2.0 domains <em>as the user types</em>.</p>
    <p>Finally, FF Mt prepares us for the future. English is changing. With the popularity of MMS and internet chat, spelling reform is occurring at a quickened pace. FF Mt accommodates this new condensed written language now. Any copy set in this advanced font will conform to next-generation standards, yet still pass present-day spell checkers.</p>
    <p>FSI FontShop International believes FF Mt is so revolutionary and beneficial to the Earth that access should not be limited to the few. Starting today, April 1 2007, the cross-platform font is available for free at <a href="http://fontfont.com" rel="nofollow">FontFont.com</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mt_free_ani_5793.gif"></div><br>
    --------------------------------------------------------<br>
    <a href="http://fontfont.com/downloads/" rel="nofollow">Download FF Mt and start changing the world today!</a><p></p>
