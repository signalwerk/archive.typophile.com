    html: <p> today i was in a bookstore looking at stuff like "extreme type", etc. it seemed like all the wacky stuff had been done, and then this. it's great to be surprised once in awhile. the mix of bitmap and blackface is one i haven't seen before (anyone else?). very cool. was there a wry joke behind it? is it a friendly poke at blackletter or bitmaps, or just a crazy thought you had? if only we had those kind of thoughts more often. </p>
