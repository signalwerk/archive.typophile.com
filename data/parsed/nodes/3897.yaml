    html: <p> Thanks for the compliments! I appreciate it. <br>My main client is a vinatge haute couture boutique. I have always felt that he deals in anachronisms, it's high fashion for now, but all of it is 30 to 40 years old. So I try to accomodate that vision whenever I do a custom typeface for them. My first typeface I ever designed was for this client and it was a cross of Stanley Kubric 2001 computer screen OS type with Viennese Succession typographic layouts - it was very cool and I have always tried to recapture that excitement in the following years. I usually do one typeface a year for them. <br> <br>This one was designed for the holiday card and I wanted it to have that same feeling, somewhat comfortable and been there before, but seen slightly differently. Judging from your comments, I have succeeded.  <br> <br>Again, thanks! </p>
    html_clean: <p> Thanks for the compliments! I appreciate it. <br>My main client is a vinatge haute couture boutique. I have always felt that he deals in anachronisms, it's high fashion for now, but all of it is 30 to 40 years old. So I try to accomodate that vision whenever I do a custom typeface for them. My first typeface I ever designed was for this client and it was a cross of Stanley Kubric 2001 computer screen OS type with Viennese Succession typographic layouts - it was very cool and I have always tried to recapture that excitement in the following years. I usually do one typeface a year for them. <br> <br>This one was designed for the holiday card and I wanted it to have that same feeling, somewhat comfortable and been there before, but seen slightly differently. Judging from your comments, I have succeeded.  <br> <br>Again, thanks! </p>
