      <p>From my history there are these:<br>
      <a href="http://typophile.com/node/30432" title="http://typophile.com/node/30432">http://typophile.com/node/30432</a> and <a href="http://typophile.com/node/20517" title="http://typophile.com/node/20517">http://typophile.com/node/20517</a></p>
      <p>As far as Tutorials: the best I can suggest at this point is, using simple lines and the Object&gt;Blend tool, you can achieve some rather basic but similar effects. layering these effects can create a more complicated looking design. Also, you might be able to use the pattern brush to create a border as well. It'll just take some experimenting to get the desired effect. Also, remember lines in a blend can be manipulated (either adding points, curves or even changing the position.)</p>
      <p>Hope that helps.</p>
