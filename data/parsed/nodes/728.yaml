    html: <p>I finally received my developer copy of Panther and plan on taking FontBook out for a long stroll through the several thousands fonts at my disposal. I will be sure to post information based on some real-world testing and not just speculation (Think Secret) or controlled demoing (Apple), providing I don't step outside the bounds of my NDA. So far though... it looks mighty nice.</p>
