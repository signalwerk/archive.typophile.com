  html: |-
    <p>As part of what seems to be a growing consensus around the co-existence of both scalable color font proposals (SVG and COLR) within the OFF/OT specs and possibly in some fonts as well, we’re looking into having both technologies share the same color palettes (i.e. literally use the same color palette table – CPAL – in the font).</p>
    <p>This way, CSS markup (for example) can simply refer to the palette-index to be used for the text, instead of separate COLR-palette-index and SVG-palette-index values. </p>
    <p>This kind of abstraction of course is what OT is very good at, with the cmap and GSUB for example being shared across glyph technologies and the text engine dispatching the positioned glyph IDs at the very last moment, as it were, to either a CFF or TT (or SVG) renderer.</p>
    <p>And the CPAL could be extended to include name IDs that function as user-facing labels for color palette entries (e.g. “floral fill”, “leaf fill”, “outline”), as in the SVG table’s current spec for color palettes.</p>
    <p>However, would font designers indeed want the same set of color palettes if they had both SVG and CPAL in their fonts? (Why both in the same font? For instance, a website could use a font with SVG descriptions including gradients and animation, but also include COLR versions of the glyphs (rendered static in flat colors in well-defined edges) in order to render in browsers that don't yet support SVG OT.)</p>
    <p>1. For example, a static SVG description of a floriated initial cap may include gradients for the flowers (e.g going from maroon to red to pink, with each of those colors with a color palette entry), whereas the "fallback" COLR description might simply have one or two of those colors as color palette entries.</p>
    <p>2. Or an animated SVG glyph may have more colors not in its COLR version, e.g. the dot on top of the "i" would change colors with time, each color being a palette entry, whereas the COLR version of the glyph would only choose one (or none) of those colors.</p>
    <p>3. Also, at the color meeting at TypeCon, John Hudson mentioned he could imagine a client wanting both COLR and SVG in a font, each for *different* ranges of characters. This might mean that entirely different sets of palettes are needed for different ranges/subsets of glyphs in the font, much like the hints in CID CFF's multiple dictionaries (e.g. Cyrillic vs kanji hinting). However, this complexity may not be worth it at this point in time.</p>
    <p>My feeling is that both technologies should simply share the color palettes if possible, and that fonts having both SVG and "fallback" COLR glyphs is at most a transitional necessity.</p>
    <p>Thoughts?</p>
    <p>Sairus</p>
