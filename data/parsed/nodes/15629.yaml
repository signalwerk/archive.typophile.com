    <p>Can anyone identify these two fonts?  </p>
    <p>The first font is from the René Lezard logotype.</p>
    <p>The closest match of the second one (typeface02.jpg) I found was the "Latin wide" (from Castle Type) <a href="https://web.archive.org/web/20141113233523/http://www.myfonts.com/fonts/castletype/latin-wide-ct/latin-wide/" title="http://www.myfonts.com/fonts/castletype/latin-wide-ct/latin-wide/">http://www.myfonts.com/fonts/castletype/latin-wide-ct/latin-wide/</a> , but the "Latin Wide" is heavier, less elegant and more extended than the one on the picture...</p>
    <p>Thanks.</p>
