      <p><em>&gt; I guess these customised typefaces must have roots as well.</em></p>
      <p>Well, that's the whole point -- they're <em>not</em> customised existing fonts, but custom designed logos, which means it's less obvious to find a "master" design. They might be based on a certain type style, but not necessarily on a specific typeface.</p>
