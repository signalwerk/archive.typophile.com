      <p>If there's no talus, when you set it with zero leading (not so rare) the descenders of a line will touch the ascenders of the next.</p>
      <p>There's no definite range in terms of expected apparent size, but I think a talus of about 5% is usual. It comes from the metal days, where it was mostly a physical issue (since there had to be a slope from the face to the shoulder).<br>
      <a href="http://typophile.com/node/91336" title="http://typophile.com/node/91336">http://typophile.com/node/91336</a><br>
      Do note BTW that apparent size is mostly affected by something not close to the top and bottom bounds: the x-height!</p>
      <p>So your combined talus is 84, which is pretty high. But if you do raise the ascenders you'll be close to what I myself (generally) recommend.</p>
      <p>The reason to allow some extreme stuff like cap accents to overshoot the bounds is that it's all about compromises anyway, and it's not worth making everything tiny just to avoid *nothing* going over.</p>
      <p>hhp</p>
