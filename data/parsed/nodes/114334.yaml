    <p>Hello,</p>
    <p>I was just reading <a class="freelinking external" href="http://typophile.com/node/104308" rel="nofollow">this thread</a> and Catharsis said "The font is now 1050 ems tall; that's no problem these days, right?". This again made me aware that despite my experience with type design, I still have no idea what the dimensions of a typeface should be.</p>
    <p>I made quite <a class="freelinking external" href="http://fc04.deviantart.net/fs70/i/2012/305/0/7/typography_series___01___anatomy_of_typography_by_martinsilvertant-d5g8ulm.jpg" rel="nofollow">comprehensive images to illustrate such things as the anatomy of typography</a> and others, but I don't think I've found a source where the metrics are explained.</p>
    <p>When I start a new typeface, I always type a few capital letters in a few different typefaces and take the average weight of these typefaces to be roughly the starting point of my own, unless I have something specific in mind which requires a lighter or darker weight than Regular (which could be called Book and Medium I suppose).</p>
    <p>So, is there a standard when it comes to the weight and dimensions of typefaces? Judging from other typeface there doesn't really seem to be.</p>
    <p>And also, does it really not matter if a font is 1050 ems tall? Doesn't it scale, resulting in the weight becoming a tad lighter than Regular?</p>
