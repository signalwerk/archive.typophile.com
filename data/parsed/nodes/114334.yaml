      <p>Some legacy systems will not like an Em other than 1000.</p>
      <p>A font needs an upper talus* and a lower talus, so it doesn't bump itself when set flush (plus people expect the apparent size to fall within a certain range). The upper talus should be larger because there's more action above the x-line than below the baseline, plus the UC accents always go beyond the top and/but the less they go the better. There are no (or extremely few) accents below the descenders.</p>
      <p>* AKA internal leading.<br>
      BTW see James Mosley's post here: <a href="http://typophile.com/node/90717?page=1" title="http://typophile.com/node/90717?page=1">http://typophile.com/node/90717?page=1</a></p>
      <p>hhp</p>
