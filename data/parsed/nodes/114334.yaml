      <p>I think 950 (combined with the 188 below) for something common like an acute is indeed a bit much. BTW it's common practice to make cap accents flatter (and tighter with the letter) to reduce their overshooting of the top.</p>
      <p>84 = 1000 - (728 + 188)<br>
      The talus is the emptiness within the EM, above the ascenders and/or below the descenders.</p>
      <p>A leading of zero isn't very common, but in narrow columns it can make sense.</p>
      <p>hhp</p>
