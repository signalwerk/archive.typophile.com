    html: <p>Kaisa, you should look at Bringhurst's Elements of Typographic Style. He has extensive discussions of the proportions of the book page, the margins, and the text block. These will relate to the title page. Bringhurst does get rhapsodic about a good title page, and I also I think your concern is well placed.   <br> <br>I would like to know the answer to your question as well.  <br> <br>I can see the point of centering the text relative to a wider inner margin in the title page; this is because being at the beginning of the book less of the margin is usually 'eaten' by the binding.  <br> <br>I guess this relates to the broader question of how to compensate for the binding in design. I also haven't really seen good guidelines on this.</p>
