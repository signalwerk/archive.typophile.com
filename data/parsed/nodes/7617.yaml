    html: <p>I don't think many people are concerned with that level of attention to details. In the few books for which I've done the typesetting I do have a narrower outer margin in (sort of) proportion to the inner margin. I also center my title page according to these same margins and not to the page width. This history of this, I believe, goes back to the golden section (mean?) of the page and how larger manuscripts would leave room for the gloss.</p>
