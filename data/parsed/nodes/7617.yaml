    html: "<p>Well, I'm still wondering. I'll just have to have a conversation with myself, then.  <br> <br>There seems to be strong evidence that title pages used to be imposed in keeping with the position of the textblock. This doesn't seem to be the case much these days, though, which seems a pity to me. <br> <br>Anyone here design books and impose their title pages in line with the textblock? I spied a link on Typographi.com that has a scan of a page from an old book that's designed \"tradtionally\": <a href=\"http://typographi.com/000950.php#000950\" target=\"_blank\">http://typographi.com/000950.php#000950</a>. The article is about \"Contrasts in Book Design\".  <br> <br>There's also a book by Margaret A. Smith called \"The Title-Page: Its Early Development, 1460-1510, published by Oak Knoll. Apparently, it's the first book published on this subject since A.W. Pollard's \"Last Words\" in 1891. Which looks scrumptious. <br> <br>C'mon - somebody say something!</p>"
