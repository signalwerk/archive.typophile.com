    html: <p>I love "Elements". I read it over and over and pick up something new every time. I hadn't noticed anything in there pertaining to imposition of title pages in particular, but following what has been said of it in the past by the likes of Tschichold and reading Elements etc it does make sense that the principles pertaining to textblocks and their margins would extend to the title page. We just see so little of it.</p>
