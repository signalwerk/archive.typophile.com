  html: <p>Hello everyone, <br> <br>I'm researching the do's and don'ts of title pages now... <br> <br>Tschichold says (In "The Form of the Book") not to place the title in the centre of the page's width, and not to let it go beyond the limits of the text block. Oliver Simon (in "Introduction to Typography") says the inner and outer margins of the title page will differ from the text in that the inner margin will be increased a little and the outer decreased proportionately".  <br> <br>A lot of title pages in current books seem to be in the centre of the page to me... is this because of ignorance or my bad eyesight or are books just not designed like this anymore? <br> <br>I'm currently designing a book whose textblocks have narrow gutter margins and wide front margins, and so the (centred) text on the title page (when working within the limits of the texblock used throughout the book) is noticeably closer to the spine.  <br> <br>Anyone have any thoughts about these things, any more do's and don'ts?</p>
