      <p>1) I don't know the name of the commercial font (if it even exists).<br>
      2) I'd rather not be an accessory to font piracy - although in this case it would be too late.</p>
      <blockquote><p>I believe that the only commercial versions were rip-offs of the free Black Chancery</p></blockquote>
      <p>I'm sure that does happen, and it could certainly be the case here. I guess the question is: what's worse, tricking a large number of users who like a cheesy cheap font out of some money, or harming an individual type designer - but also indirectly type design in general? Probably they're about equally bad.</p>
      <p>And Dick's flippant, subversive reply wasn't so hot either.</p>
