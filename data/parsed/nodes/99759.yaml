      <p>hrant- You object, out of hand, sight unseen, uninvestigated, to any ID response that mentions a free font. Given the general population here in Typophile, I think that before assailing such responses, you should perform your own due diligence instead of your automatic "if it's free it's probably a clone" (read: "criminally pirated").  I would think that most posters first suggest commercial fonts from reputable sources.</p>
      <p>There are many free things in life that are either unique or superior to commercial offerings. Here in Southern California, local newspapers such as Los Angeles' Downtown News certainly have no impact on the sales of the Los Angeles Times. There is a clear place and audience for both. So it is with fonts and almost everything else.</p>
      <p> - Herb</p>
