    html: |-
      <p>I think you're misreading me. If I were adopting the stance you describe I'd be posting a <em>lot</em> more...  :-/</p>
      <p>In every case I restrict myself to "probable cause". In this case I actually do sort of remember seeing a commercial font that looks like that. I could be wrong, and as I admitted the commercial one could be a copy of a free one! But it's never vindictiveness that I'm acting on.</p>
      <blockquote><p>I would think that most posters first suggest commercial fonts from reputable sources.</p></blockquote>
      <p>I mostly agree. I think the real problem is that the people asking are generally not so honorable, and many people helping them don't want to face that reality. So it's not that free fonts are being suggested (there are indeed some good ones, that are not plagiarized) it's that:<br>
      - Plagiarized fonts are often suggested (often unknowingly, but often a result of not caring to check).<br>
      - The commercial fonts being suggested are usually being pirated. Now, I admit there's no Proof of that. But <em>at least</em> when all the signs are there (especially when there's an admission!) people should confront that.</p>
      <p>In the end, the right people and things aren't being helped (in my view).</p>
      <p>Wishful thinking is no substitute for good judgement.</p>
      <p>BTW, see my 11:21am post here:<br>
      <a href="http://typophile.com/node/99780" title="http://typophile.com/node/99780">http://typophile.com/node/99780</a></p>
      <p>hhp</p>
