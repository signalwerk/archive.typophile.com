    html: <p>hi tim <br> <br>i like it, but i think there is something strange in the contrast in the AU in MAUI. in someway i think that two thick strokes don't work very well together, even though i am not sure that it will work better if you flip your M and A, i think that you should try that. <br> <br>In "Cruisers" i think that you should work with two different "s", just to take away the spirit of a script typeface and give it a look like manual script. <br> <br>i dont know if i was clear in my observations, but anyway, i hope that they are usefull <br> <br>CG</p>
