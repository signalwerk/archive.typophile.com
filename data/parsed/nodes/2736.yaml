    html: <p>The gap between the u in Mountain and the u in Cruisers <br>I think throws things off a bit. <br> <br>And asking a thin script to form the base of your stack ... <br>it's like Leviathan is going to crush whatever is underneath. <br> <br>Tim, keeping Leviathan, what if you stacked the three <br>words to form a triangular mountain shape. <br> <br>Maui on top (peak), Mountain (middle), Cruisers (base), still in Leviathan, <br>but extended enough to form the base of the mountain. <br> <br>A wee bit of Transform &gt; Free Distort in illustrator could <br>help, but not enough to distort any letterforms. <br> <br>just an idea. If you keep Leviathan + script, maybe Maui <br>should be in script at the top? <br> <br>bj <br> <br> <br> <br></p>
