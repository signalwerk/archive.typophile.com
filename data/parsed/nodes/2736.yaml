    html: "<p>I vote no on the flipage and the fake small caps. 2A is better. <br>Tim, did you hand draw the Maui Mountain or modify an existing font? (Guessing the latter) <br> <br>&lt;putting_on_sherlock_holmes_hat&gt; <br>The reason I say that is from looking at the A. The thin stroke looks overly thin. That is because it used to have a cross bar and the thin got thinned even more to compensate. Now that it's gone, the thin needs some weight back. Make it look the same as the thin on the N. Also check the thick stroke. They may have been shaved too (hard to tell at this resolution). BTW since the M = A+A that will need fixing too. <br> <br>The O might want more space in the middle (too dark). Instead of straight sides, try an oval made of 4 points. <br> <br>Script: This will need fixing in three places. 1. The Cr connection isn't smooth and could maybe use a bit more weight, 2. se spacing combination is too tight. You may want to draw a custom connection between them wrapping the s a little tighter and connecting it to the e. 3 er connection changes weight too quickly. <br> <br>Randy <br> <br> <br></p>"
    html_clean: "<p>I vote no on the flipage and the fake small caps. 2A is better. <br>Tim, did you hand draw the Maui Mountain or modify an existing font? (Guessing the latter) <br> <br>&lt;putting_on_sherlock_holmes_hat&gt; <br>The reason I say that is from looking at the A. The thin stroke looks overly thin. That is because it used to have a cross bar and the thin got thinned even more to compensate. Now that it's gone, the thin needs some weight back. Make it look the same as the thin on the N. Also check the thick stroke. They may have been shaved too (hard to tell at this resolution). BTW since the M = A+A that will need fixing too. <br> <br>The O might want more space in the middle (too dark). Instead of straight sides, try an oval made of 4 points. <br> <br>Script: This will need fixing in three places. 1. The Cr connection isn't smooth and could maybe use a bit more weight, 2. se spacing combination is too tight. You may want to draw a custom connection between them wrapping the s a little tighter and connecting it to the e. 3 er connection changes weight too quickly. <br> <br>Randy <br> <br> <br></p>"
  - id: 21763
    user: 1235
    date: 2004-01-20T11:41:00
    date_raw: 20 Jan 2004 — 11:41am
    votes: null
    html: "<p>Randy wrote: <br> <br>\"did you hand draw the Maui Mountain or modify an existing font? (Guessing the latter)\" <br> <br>You're right, it's just a tweak on Leviathan, removed \"A\"s crossbar and constructed \"M\" from that. I'll try adding the width you mention to those characters and play with the \"O\"s counter. <br> <br>I tend to agree on the \"flipage,\" while it's an interesting twist--something about it urks me. I sort of go back and forth on it though. <br> <br>Randy -- what's your opinion in regards to the overall size of \"Cruisers\" in say 2A vs 2B2? <br> <br>Fully aware of the \"Cr\" and \"er\" script requirements and I like the idea on the \"se\" spacing/connection. Can you clarify what you mean by \"wrapping the s a little tighter?\" Do you mean the radius of finishing loop -- so it comes in a little lower to be able to connect it to the \"e\"? <br> <br>Thanks for everyone's thoughtful input. Typophile is such a valuable resource for us freelancers who are not working in a design shop and cannot easily bounce ideas off of collegues. <br> <br>Aloha, <br> <br> -t </p>"
    html_clean: "<p>Randy wrote: <br> <br>\"did you hand draw the Maui Mountain or modify an existing font? (Guessing the latter)\" <br> <br>You're right, it's just a tweak on Leviathan, removed \"A\"s crossbar and constructed \"M\" from that. I'll try adding the width you mention to those characters and play with the \"O\"s counter. <br> <br>I tend to agree on the \"flipage,\" while it's an interesting twist--something about it urks me. I sort of go back and forth on it though. <br> <br>Randy -- what's your opinion in regards to the overall size of \"Cruisers\" in say 2A vs 2B2? <br> <br>Fully aware of the \"Cr\" and \"er\" script requirements and I like the idea on the \"se\" spacing/connection. Can you clarify what you mean by \"wrapping the s a little tighter?\" Do you mean the radius of finishing loop -- so it comes in a little lower to be able to connect it to the \"e\"? <br> <br>Thanks for everyone's thoughtful input. Typophile is such a valuable resource for us freelancers who are not working in a design shop and cannot easily bounce ideas off of collegues. <br> <br>Aloha, <br> <br> -t </p>"
