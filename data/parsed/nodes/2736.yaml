    html: '<p>Regarging your post (TIM) #109 -- I think slanting the M is too tricking. It messes with the eyes in a negative way. <br> <br>The connection of the letters s&gt;e is too tight and seems like there could be a smoother transition from letter to letter. The s seems a little tall (in the altogether and in the loop), which could explain why the transition from s to e seems forced. And the r seems a little short. The connection from C to r seems to have a bump in it too. <br> <br>I really like the direction you have taken this, however I wonder if the word "Cruisers" could be a little more extended? Looser. Same style, but more of a scrawl or rather stretched across the bottom of the word "Mountain"?</p>'
