  html: "<p>Hi Typophiles, <br> <br>Renaming this thread with a more appropriate subject line. It was previously <a href=\"http://www.typophile.com/forums/messages/29/23113.html?1074087536\"> \"Logo Typesetting Ideas/Feedback\"</a> which you can refer to for background. <br> <br>To summarize: working on a <i>logo for a bicycle tour company which guides riders on a 38-mile \"peddle-free\" downhill cruise from the atop a 10,000 foot volcano on beach cruiser style bikes</i>. <br> <br><b>Brand Attributes</b>: Safety-minded, experienced, professional yet casual, fun/exciting, and entertaining. <br> <br><b>Industry Analysis</b>: Not much to say or learn except that there is MUCH room for design improvement industry wide. No one company has a strong graphic identity. <br> <br><b>Projected Media</b>: crossmedia from web, to printed \"rack cards,\" signage, vehicles (vans), clothing (tee-shirts, hats, etc.). <br> <br>Here's my first B&amp;W iteration. <i>Please be brutally honest</i>. I'm looking for any &amp; all comments from composition to kerning. Meanwhile, I'm going to go dunk my tired eyes in ice water and then shut for a few hours. <br> <br> <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/24248.gif\" alt=\"mmc-logo-011503c\"> <br> <br> <br> <br>Aloha &amp; Mahalo, <br> <br> -tim <br> <br>ps - I'm aware that some letter pairs in the script face (\"C-r\", \"i-s\", etc.) need polishing. <br> <br> <br></p>"
  html_clean: "<p>Hi Typophiles, <br> <br>Renaming this thread with a more appropriate subject line. It was previously <a href=\"http://www.typophile.com/forums/messages/29/23113.html?1074087536\" class=\"link-lost\"> \"Logo Typesetting Ideas/Feedback\"</a> which you can refer to for background. <br> <br>To summarize: working on a <i>logo for a bicycle tour company which guides riders on a 38-mile \"peddle-free\" downhill cruise from the atop a 10,000 foot volcano on beach cruiser style bikes</i>. <br> <br><b>Brand Attributes</b>: Safety-minded, experienced, professional yet casual, fun/exciting, and entertaining. <br> <br><b>Industry Analysis</b>: Not much to say or learn except that there is MUCH room for design improvement industry wide. No one company has a strong graphic identity. <br> <br><b>Projected Media</b>: crossmedia from web, to printed \"rack cards,\" signage, vehicles (vans), clothing (tee-shirts, hats, etc.). <br> <br>Here's my first B&amp;W iteration. <i>Please be brutally honest</i>. I'm looking for any &amp; all comments from composition to kerning. Meanwhile, I'm going to go dunk my tired eyes in ice water and then shut for a few hours. <br> <br> <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/24248.gif\" alt=\"mmc-logo-011503c\"> <br> <br> <br> <br>Aloha &amp; Mahalo, <br> <br> -tim <br> <br>ps - I'm aware that some letter pairs in the script face (\"C-r\", \"i-s\", etc.) need polishing. <br> <br> <br></p>"
