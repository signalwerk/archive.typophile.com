    html: "<p><b>MAUI MOUNTAIN CRUISERS Redux</b> <br> <br>Firstly, my apologies for falling off there -- but I was past deadlines and had to move on to other aspects of what was a larger project. <br> <br>I wanted to be sure and post the final logo and thank everyone involved for their excellent eyes, critiques, guidance, feedback, ideas and mock-ups. <br> <br>Unfortunately, some feedback came just a little too late for me to respond to, as I had committed to one direction that I was (by that point) fine tuning. Thanks nonetheless, to Tanya, BJ, Tom C. and Andrew for their concepts. <br> <br><b>SPECIAL Thanks</b> to Scott K., Tiffany, and Hrant for their professorial like tutelage -- never giving away too much, but just enough to inspire one to think about the design challenge in new ways. <br> <br><b>SUPERCALAFRAGILISTICEXPEALIDOCIOUS T h a n k s</b> to Randy Jones for his mentoring and hands on help perfecting those pesky script face beziers, not to mention other subtleties which really brought the final design to life. Thanks Aquatoad! <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/29180.gif\" alt=\"\"> <br> <br> <br><b>Notes About The Final Design</b> <br>Much happened as compared to iteration \"10.74\" from my post #104, including weight and letterform changes to the \"M,\" a sizing up of \"Maui,\" and the obvious enhancements to \"Cruisers\" which include smoothing of the curves and connectors, adding weight to the face, a bit of vertical squashing, and a fine finishing flourish. Color directions have yet to be decided, but are likely to resemble the lavaesque orange currently displayed at the new website where you can see the logo basking: <br><a href=\"http://www.mauimountaincruisers.com/\" target=\"_blank\">http://www.mauimountaincruisers.com/</a> <br> <br> <br><b>What I Learned</b> <br>SKETCH, SKETCH, SKETCH! Whether by pencil, paper and erasure (my preference) or tablet -- there is simply no better way to work out solutions to logotype and letterform challenges than mad scientist like sketching. Have fun with it. Brainstorm, scribble any concept that comes to mind. <br> <br>There are many possible ways to solve a problem, but there's usually one or two that are \"best.\" Still, it's subjective, and what you consider best might be someone else's \"worst.\" <br> <br>Use your eyes. Always consider legibility. How do the letterforms \"sound\" to your eyes? Balance positive as well as negative space. White space is your friend -- don't ignore it. <br> <br>Know when to say when. There comes a point where you have to commit, fine tune and finish -- even with personal projects. <br> <br>Contrast is key, especially when it comes to logos with many words and letters such as this one. <br> <br> <br><b>Typophile Props</b> <br>Typophile, in my opinion, is the web's richest resource and community. The sheer abundance and quality of information available to type designers, typographers, and graphic designers is astonishing. <br> <br>I only hope that I can give back some iota of what I've received in my little time here. In fact, it's my prediction that I'll reach 6,000 post long before Hrant.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br> <br>Thanks again to everyone who participated. I hope I can offer valuable input to your thread as well. <br> <br>Aloha, <br> <br> -tim <br> <br></p>"
