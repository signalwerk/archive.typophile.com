    html: <p>Have you seen Epaulet by Chris MacGregor? <br>It has the same feeling of boxyness. <br> <br><a href="http://www.myfonts.com/Search?searchtext=Epaulet&amp;setfontsonly=1" target="_top">http://www.myfonts.com/Search?searchtext=Epaulet&amp;setfontsonly=1</a> <br> <br>or <br> <br><a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=91&amp;ww=on&amp;view_records=View%2BRecords" target="_top">http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=91&amp;ww=on&amp;view_records=View+Records</a> <br> <br>/p</p>
