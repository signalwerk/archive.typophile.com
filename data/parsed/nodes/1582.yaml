  html: "<p>I've wanted to work on a script for a while now, but was  <br>uninspired until last night. I am still working on spacing, and <br>trying to figure out how to attach the lines, make it look cool <br>and not have to do too many ligatures..; <br> <br><!---Attachment: no_28_viewer.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">No. 27 Cursive Sketch<br><a href=\"http://www.typophile.com/forums/messages/29/no_28_viewer.swf\"><b>no_28_viewer.swf</b></a> (16 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
