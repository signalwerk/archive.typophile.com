    date: 2002-07-29T10:11:00
    votes: null
    html: <p> This is BRILLIANT. -- I have to agree with Stephen -- Christian, you ARE a tease! <br> <br>Maybe it makes me weird, but I loved the idea behind MM fonts and wish this one were available in that format. My wish would be to have control of the contrast.  <br> <br>The comparisons to Cabarga and Epaulet -- I understand, and maybe there are some things similar, but perhaps it is like comparing apples and oranges. Or for you music lovers a better analogy might be the trumpet playing Miles Davis to that of Chet Baker. While Chet's execution and technique are flawless, Miles' phrasing and direction is always more interesting. </p>
