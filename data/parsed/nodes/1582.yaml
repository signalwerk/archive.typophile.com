    votes: null
    html: <p> I love this face... I see the comparison to Epaulet but find that this face has less <br>sense of humor, I really like that about the face, it is hard to stick into any particular category. It is commercial enough to get used in real work but esoteric enough to be passed off as "too weird" by most main stream/agency designers. As for Display scripts this is sterile for something that at first sight seem to fit into  the stylized fun category, as compared to, for instance, Phil Grimshaws' designs that are full of life expressed by calligraphic movements and nuances that  usually ended up in the ITC collection. This restain and sterility, is exactly what I look for when selecting type.A really nice piece of work. I would encourage you to open dialogue with  Peter Bruhn/Fountain to discuss distribution when you finish it. </p>
