    html: <p> Christian - pretty cool. As something to shoot for, Cabarga Cursiva is a masterwork. You can unlock a lot of script secrets by looking at that face. This is wholly different and very appealing. You got the thicks/thins down. The face has got great upside. Uppercase would seem to have more improvisational opportunities and this is where the face could really fly. <br> <br> <br>bj </p>
