    html: |-
      <p>The problem is that Letter Gothic is so light and open, you need a match that sets well similarly open, for instance letterspaced, and most faces don't (after the old Goudy adage).</p>
      <p>I've used <a href="http://www.shinntype.com/panoptica.html">Panoptica</a>, another monospaced face.<br>
      It was the other way round, I was looking for a text face to work with Panoptica, and discovered that Letter Gothic was OK.</p>
