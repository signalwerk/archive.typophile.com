    <p>Hey guys,<br>
    I feel like I'm starting to get a fairly decent handle on font pairings, but I'm really kinda stuck on working with Letter Gothic. I'm trying to find a sans that will contrast the computer stone age look of Letter Gothic (like Futura vs courier), or give a little bit of the terry jones/ID magazine look. Is it also possible to use a serif against the slabby monospaced LG? Any ideas or suggestions are appreciated. Cheers,<br>
    m</p>
