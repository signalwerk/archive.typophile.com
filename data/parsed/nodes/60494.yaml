    html: |-
      <p>I find it interesting that you chose to use letterspacing:-.1em on the headers. I can see how it is interesting to merge characters, but not all the characters merge and, given the differences in font rendering between browsers, more or less of them are actually touching. </p>
      <p>As mk2 says, having a clickable header is extremely common, so requiring users to click the "back" button is a little counter intuitive. It should also have a rollover, similar to the nav system to indicate that it is clickable. Ahh, I see. You've set it up so that the back button goes back to the previous page rather than to the home page. A persistent navigation might help resolve this.</p>
      <p>I really like the way you've overlaid your images with the text and underline. It feels rather nice, though I worry if you don't have the text shadow (like on the about page).</p>
      <p>Also, on the "Software" page, the "ft" is begging for a "ft" ligature (I think it is ﬅ), though that might break your letter spacing intent.</p>
      <p>In any case, that's the main stuff I saw. Overall I like the feel of the site &amp; especially the hit of color in the navigation area, though I wish you'd use those colors more throughout the site. </p>
      <p>Nice stuff so far!</p>
