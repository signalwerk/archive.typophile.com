    <p>Finally, I've launched my personal web-site (<a href="http://totocaster.com" title="http://totocaster.com">http://totocaster.com</a>).  I wanted it to be super light, simple, focused on front page and to have great typography and readability without any non-web-standard font. I've used only three fonts from which only 2 are used mainly, those are Georgia and Helvetica (Neue for ultralights), for super small texts and photo descriptions I've used Apple standard Lucida Grande which looks perfect form me when used in a very small size.</p>
    <p>All major browsers are supported except IE, best viewed in Safari. Sorry Windows users of Internet Explorer, text shadows are not supported by your browsers yet, and typography looks ugly if you have turned off screen smoothing. </p>
    <p>Share your thoughts, what could be done better? </p>
    <p>Thanks in advance.</p>
  html_clean: |-
    <p>Finally, I've launched my personal web-site (<a href="http://totocaster.com" title="http://totocaster.com" class="link-external">http://totocaster.com</a>).  I wanted it to be super light, simple, focused on front page and to have great typography and readability without any non-web-standard font. I've used only three fonts from which only 2 are used mainly, those are Georgia and Helvetica (Neue for ultralights), for super small texts and photo descriptions I've used Apple standard Lucida Grande which looks perfect form me when used in a very small size.</p>
    <p>All major browsers are supported except IE, best viewed in Safari. Sorry Windows users of Internet Explorer, text shadows are not supported by your browsers yet, and typography looks ugly if you have turned off screen smoothing. </p>
