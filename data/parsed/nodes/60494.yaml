    html: |-
      <p>Thanks for responses, I really appreciate it. </p>
      <p>About Logo and "Back" link on inner pages, to be hones I know that clicking on Logo/Caption is most "intuitive" way getting on front page, but in this case I love the way Back button works. This site has such a little quantity of navigation items that getting used to only(!) one must be like 123. But, on the other case I'm really thinking to make caption link to home page and add "Home" (or even Back) suffix on hover.</p>
      <p>I really love they way text overlays are displayed over images now, but only in Safari. I admit, those texts are sometimes un-readable on B/W photos when viewed from Firefox because FF can not display "1px blurred" shadows properly, they simply are not crisp enough. I'll try to remove shadow and replace it with semi-transparent gray (or black) background.</p>
      <p>Thanks for comments again.</p>
      <p>Oh yeah, I've got to learn how to draw icons, and "favicon" is prove for that. :D</p>
