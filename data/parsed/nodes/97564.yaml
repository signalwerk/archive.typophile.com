    <p>Hello,</p>
    <p>I'm working on my first MM font. I'm in the final stage and not sure about hinting issue.<br>
    Is it suffice to set stems  and make some corrections  only in two masters ? or should I hint all instances individually?<br>
    Of course i'm talking about basic Type1 hinting.</p>
