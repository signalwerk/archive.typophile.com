    html: |-
      <p>Links are an internal FLS thing, which get turned into hints when you generate actual fonts.</p>
      <p>Really, for most people and purposes, you can just:<br>
      - set your blue zones and key heights in each master, separately<br>
      - make sure part of your production process is to autohint the generated instance-fonts</p>
      <p>Personally, I like to leave overlap in the masters where it is helpful, generate instances, auto-hint the instance, then remove overlap.</p>
      <p>As long as your hinting parameters work with the font weight and all, that usually produces quite decent PostScript hinting.</p>
      <p>(Note that if you autohint a glyph in the MM, FLS does the hints for each master, and makes them compatible.)</p>
