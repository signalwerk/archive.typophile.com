    html: <p>I second Corundum, but don't forget Sabon (from Linotype with oldstyle figures), a very classic, reliably elegant face used in many museum settings. Buccardi has an intriguing funkiness though the base weight may be a tad heavy, which is not the case with Sabon. Monotype Bulmer is a little too boring and English. Look at Celeste, Dante, Esta, Filosofia, Janson, Van Dijck, and Village--each offers a different take on what you need. Storm has a number of period Garamonds, but be very careful of them.</p>
