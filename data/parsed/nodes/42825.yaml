      <p>Oh, the <a href="http://en.wikipedia.org/wiki/Knock_resistance" rel="nofollow">octan(e) rating</a> is a measure of the autoignition resistance of gasoline (effectiveness). There’s Super (high octane) and Normal (less octane).<br>
      It’s for an ad agency which has to keep this name (established) although nobody really likes it or can relate to it much (long story). That’s why I said it doesn’t matter and that’s probably where the certain nothingness comes from.</p>
