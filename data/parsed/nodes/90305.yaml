      <p>Except for an excellent and well researched <a class="freelinking external" href="http://marello.org/caeciliae/" rel="nofollow">Caeciliae</a> or <a class="freelinking external" href="http://anatoletype.net/projects/gregoria/index_html" rel="nofollow">Gregoria</a>, both for Gregorian chant, there’s nothing decent really. P22 got once a <a class="freelinking external" href="http://p22.com/products/musicpro.html" rel="nofollow">Music Pro</a> package with modern notation, but I see it as an experiment for nothing more than rapid typesetting of a simplified double staff notation only.</p>
      <p>I have serious plans for making some real revivals of mensural music types like those ascribed to Jacomo Ungaro, Petrucci’s type provider. I’m also thinking to make Caeciliae, as it’s open source, to be Unicode compliant and its input more suited for professional typesetting environment, not just word processor. Anyway, it’s good to hear someone's picking those issues up.</p>
