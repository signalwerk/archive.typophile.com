      <p>The problem is not putting the symbols that occur within a musical score in Unicode. That, as has been noted, <em>has</em> been done, to some extent.</p>
      <p>The problem is that a musical score is more than a string of characters. If one thinks in terms of a left-to-right writing direction, then how is one to indicate which notes are to be in the same vertical column as which other notes, indicating that they are both sounded at the same moment in time?</p>
      <p>Essentially, music scores are two-dimensional. Each note belongs to a certain part, and begins at a certain moment in time. ASCII and other character codings are inherently one-dimensional. The problems this causes for mathematical notation are basically solved by treating the notation as a series of nested brackets for constructs such as "superscript/subscript pair". Musical scores need a completely different approach.</p>
      <p>Which is not to say that there may not already be an elegant solution involving TEX, but sadly, despite its power and elegance, that system is mainly relegated to the sidelines for a number of reasons.</p>
      <p>There are open-source programs out there which generate musical scores, I believe - I know there are some that are at least freeware. Thus, there should eventually be an accessible encoding that handles the features required for specifying a musical score of reasonable appearance.</p>
