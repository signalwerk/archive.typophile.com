      <p><cite>Is there a market for re-typed Petrucci editions?</cite></p>
      <p>It yet has to be created. Modern transcriptions lose information or don't exist at all. More and more performers or scholars would like to or thus are forced to read the source notation, but contemporary editions of original notation are a true rarity. Facsimiles, in turn, in today's digital diversity are becoming frustrating to use. Not to mention there's no way to work with such documents textually. Besides, there's clearly an emerging market for encoded modern notation; the early one, I think, will follow.</p>
      <p><cite>…there is no encoding yet for mensural notation characters.</cite></p>
      <p>But there is, right in Unicode. Mensural notes, rests, mensuration signs, <em>croix</em>. For other characters like different clefs, repeats, flat, <em>signum congruentiae</em> or <em>corona</em> there're code points of their modern counterparts, at least as I understand it, just like a uncial script shares its code points with a humanist. I think there's only <em>custos</em> which is missing, but it had no real textual function, so I can imagine Perry Roland, who proposed the encoding, decided just to omit it entirely (unfortunately, in my view).</p>
