      <p>Most music notation software/scorewriters (the big ones being Finale and Sibelius) have their own proprietary built-in fonts. That's also the software most music typographers ("engravers" is the official but technically-incorrect term for some bizarre reason) use, and I know at least Finale is able to import custom fonts.</p>
      <p>The fonts included in my copy of Finale are pretty-awful-to-deeply-abysmal, and better ones would definitely be appreciated. I do think separate versions would have to be made for the two big software players as they probably use different glyph sets with any luck.</p>
