      <p>Hrant, in principle I agree with you.<br>
      But.</p>
      <p>You’re talking about *what*, that is idealism.</p>
      <p>In the real world, things happen according to the *who*, that is realism.</p>
      <p>There is no ‘High Council of Human Script and Notation’ which would wisely conduct things which are reasonable. Unicode is funded by MS, Google, Apple and all the other big players who have their interests. Petrucci did not belong to it so far. Nor did Beethoven, I’m afraid.</p>
      <p>Look at another example: the big players force sets of “symbols/emoji/pictographs” into the standard. Which is actually a worthy task, but: HOW they do it. (Can’t tell you how the recent picto additions would have looked like if not Ireland and Germany would have been so lunatic to fight against it like mad idiots. Smashing “Windings” into the standard because it’s declared being “popular”, that is the ratio behind those endeavours. Little thought, little reflection, little intelligence; no science, no principles, no scruples. Nothing.) </p>
      <p>Despite the issues mentioned I maintain that Unicode is a wonderful thing.</p>
      <p>I just point at this general problem briefly, to prevent you from assuming that Unicode would be build on grounds of any reasonable blueprint. It is business interests and bloody pragmatism, not more, not less. If you can deal with that, you may succeed. But be prepared for the worst.</p>
      <p>But back to music. I’m interested in that because I’m working on a long-term editorial project in that field. During the last 14 months I have been typesetting a volume about the musical notation (Europe) of the 17th and 18th century. Of course I use the relevant established codepoints for eminent musical characters which occur in the text. But, the whole set I actually need for composing that treatise is four times as large as covered by te UCS. So it goes the usual way: private encoding of special characters. It is a hack, and everyone else will remain hacking for himself as long as there is no substantial research and development initiative for music encoding, possibly focussed on feeding the ISO/UC encoding procedure. Taken the particular complexity and diversity of the matter into account, I don’t see any possible stakeholder to embark on this so far. – Maybe this is a general issue: the week position of the humanities before the computer industry. We will not solve this problem tonight.</p>
      <p>Just proposing single additional characters may help in some respect, but it will not solve the overall conundrum.</p>
      <p>What are YOU listening to??<br>
      Me: Crystal Radio Beautiful Music. “All Day, all night, all nice” :-) very cheerful.</p>
