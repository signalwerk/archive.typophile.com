      <p><em>It's strange that it's not in Unicode.</em></p>
      <p>Anyone have a good answer to this? Even if some symbols are sort of unsuitable to encode as straightforward glyphs under the current system (because they need to seamlessly and without distortion stretch to any length), a lot of them are very clearly modular or standalone and all of them are typographic and/or chirographic in nature. Also, the usefulness of having many of them exist in running text is demonstrated by the "Bach font" above.</p>
      <p>Even the most complex of the fonts included with the music typesetting software has no more than maybe 200 glyphs. And a lot of them are awesome typographic-origin symbols that I hope type designers would enjoy drawing. ;)</p>
