      <p>Traditionally most music was directly engraved on metal plates. This was true through essentially all of the 20th century despite all the technological improvements in other forms of paper publishing. It’s only recently that computer-engraved music has started to catch on, and even then a lot of professional orchestral musicians dislike it (with good reason). YouTube has <a href="http://www.youtube.com/watch?v=345o3Wu95Qo" rel="nofollow">a video</a> or <a href="http://www.youtube.com/watch?v=345o3Wu95Qo" rel="nofollow">two</a> from G. Henle demonstrating the process.</p>
      <p>The attempts at typesetting music were never very popular and never produced anything more than tolerable results. Music is much more tricky than text. It’s at least equal to the complexity of typesetting mathematics, if not more difficult. For starters, music is inherently two dimensional in comparison to the linearity of text. Whitespace is also radically different, and fairly minor changes in spacing can have profound effects on the way we read music. Music also often has to fit a grid, at the very least in bar structure, whereas text ideally should <em>not</em> be vertically aligned (otherwise we see rivers etc.).</p>
      <p>Lilypond is probably the best computer engraving software that is publicly available. (There are probably in-house systems in use by music publishers which aren’t available to the public.) The default <em>text</em> produced by Lilypond leaves something to be desired. But the music it produces is quite good and often approaches hand-engraved quality. Lilypond is also constantly improving and the developers benchmark their work against hand-engraved examples. It’s really a major triumph for free software, since Lilypond has essentially surpassed all the commercial competition, at least what’s available outside the walls of music publishing companies.</p>
      <p>BTW, the term ‘score’ for printed music comes from the scoring of the five lines of the staff into the metal. That’s the very first thing in physical engraving of music.</p>
