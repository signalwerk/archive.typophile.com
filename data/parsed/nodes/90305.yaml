      <p>Yes, there are exceptions like with the fermata or dynamics, which in such case should be encoded also as non-spacing combining marks. But this, for now, could be bypassed by treating it as another such parallel line of text, just as LilyPond software does it conceptually. And sure there will always be some peculiarities of notation in any given era or site not yet encoded or encoded badly, but that's the case with most non-mainstream scripts.</p>
      <p>So, Unicode's not perfect, no doubt for that, but the beast called musical notation isn't so complex as it seems, and things with the encoding don't look as bad as that.</p>
