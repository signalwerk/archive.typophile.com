      <p><cite>It's strange that it's not in Unicode.</cite></p>
      <p>No it is not strange. Unicode is not the Holy Bible. It’s the result of a process, conducted by humans, influenced by interests.<br>
      Musical notation is a very, *very* complex and disparate subject (in technical terms).<br>
      It is perhaps even more complicated than Mathematic formula composing or Egyptian Hieroglyphs. To encode that to full extend, this requires considerable effort and research. Who is supposed to fund that?</p>
      <p>Yes there are a couple of musical ‘symbols’ (stupid term) in the UCS. One can use them for putting tiny pieces of notation into running text, that has its uses, surely. But you can not set actual music scores with it. If you look at Petrucci’s lettercase: there you have the *character set* needed for that – and that is not encoded.</p>
      <p>It is similar with Byzantine musical notation, neumes, square notation, mensural notation and modern notation: a few basic glyphs are encoded, but that is not sufficient for setting actual music scores.</p>
      <p>Now the interesting point with the lead-type based mensural notation (as introduced by Petrucci) is: it is technically the only *discrete* system of music notation. Because all other habits of doing it where either handwriting or engraving-like, hence not a system of limited discrete parts as in the lettercase. So, for that reason, Petrucci ought to be the actual first candidate of music becoming encoded at all. Because this system is more related to our system of text processing than other kinds of music.</p>
