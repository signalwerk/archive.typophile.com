      <p>Unicode’s musical symbols were indeed intended for running text or to be used with a markup for layout, so technically it's not suitable for music <em>scores</em>, but Petrucci’s settings were no <em>scores</em> either. The very nature of Petrucci setting his editions was just a set of isolated lines of music without any special spacing or lyrics underneath. Invention of white mensural notation allowed that and that’s what Petrucci took advantage of, hence similarities with a running text.</p>
      <p>This doesn't mean earlier or later music notation wasn't discrete. In fact, early music incunabula were mostly a rather successful plainchant settings of discrete metal types. It just has had to be spaced along underlying text, the very basis of plainchant. (In fact, given the inseparability of text and neumes in plainchant, the latter could be also treated as some form of combining marks.)</p>
      <p>Now, a modern score is just a few more such parallel runs of music lines. Proper spacing would still be needed for horizontal synchronization, but it could be automatically derived from the text itself. What really is missing in the Unicode for music to be encoded fully, then, are control code points for vertical position of characters within any such line, i.e., within a staff. That’s it.</p>
      <p>Yes, there are exceptions like with the fermata or dynamics, which in such case should be encoded also as non-spacing combining marks. But this, for now, could be bypassed by treating it as another such parallel line of text, just as LilyPond software does it conceptually. And sure there will always be some peculiarities of notation in any given era or site not yet encoded or encoded badly, but that's the case with most non-mainstream scripts.</p>
      <p>So, Unicode's not perfect, no doubt for that, but the beast called musical notation isn't so complex as it seems, and things with the encoding don't look as bad as that.</p>
