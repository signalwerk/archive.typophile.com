      <p>That comparison with MathML is excellent. You cannot create "a math font" for pretty much the same reasons. An equation may have superscripts, and in those there may be subscripts again. And they, in turn "have smaller still to bite'em". What would a font for that look like -- every character in every possible smaller size? The same goes, of course, for horizontal and vertical extensions of braces and division bars.</p>
      <p>Just as a "regular" OpenType library such as UniScribe handles the logic between font and output, this needs a combination of font plus a layer of software to handle it.</p>
