    html: <p>I should probably add that the flexible spacing in modern scores, which maybe gives it this overall complex appearance, is just a visual aid and is by no means subject to encoding. Scores can be easily disassembled into isolated lines, all the spacing taken off, and there would be no loss of information. It still would be read as properly synchronized, running texts in parallel. In fact, this is exactly what is being done with a full score while creating sheets of individual parts for individual performers to read.</p>
