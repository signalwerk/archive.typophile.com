    html: |-
      <p>•&nbsp;Don't start shapes as curves. Draw the extrema points first, close the shape, and then shift-click on the lines to pull the curves into place. This is much more efficient than drawing a bunch of curves and trying to figure out where the extreme points go.<br>
      • Optimally each handle should extend about 1/3 of the distance of the curve. But you have to break this rule a lot.<br>
      • Good curves look continuous and not like a series of smaller curves. You have to shift-drag nodes along a curves to get the sweet spot.<br>
      • Learn to work by shift-clicking on curves and dragging them around instead of using the handles. Only touch handles to make minor adjustments.</p>
