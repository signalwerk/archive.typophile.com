      <p>Working with Illustrator, if you can, do any outlining in a pre-CS3 version of illustrator. I still have CS2 installed on my machine for exactly this purpose. It does a good job of minimizing the number of points and not creating overlapping points. In my opinion, this feature in CS3 and higher is broken.</p>
      <p>I always use Illustrator to draw glyphs, probably because I have years of practical experience working with it. Just a question of ease of use.</p>
