      <p><em>I have yet to find anything better for drawing type than Fontlab Studio.</em></p>
      <p>To each his own: personally, I find CorelDraw 9 to be superior to ANY other program for drawing fonts but, then again, I've been a CorelDraw user since version 1.</p>
      <p><em>if I see a center point in, say, fontlab, does that mean the designer added them? Or just some quirk of how fontlab draws the glyph?</em></p>
      <p>It's not a quirk: it's the proper way to draw bezier curves for PostScript. Autotracing in ANY program tends to introduce a lot of superfluous points: it's best to draw the oultines on your own, from scratch...</p>
