    <p>At some point I learned about trying to make strictly horizontal and vertical handles with my beziers, wherever possible. And I avoid unnecessary points... e.g. a perfect circle ought to be four points. </p>
    <p>When I open other people's fonts, particularly scripts, the curves look so perfect. Like someone took a circle or ellipse and then chopped it half (or wherever). Or maybe did the equivalent of drawing a stroke in illustrator and outlining it. </p>
    <p>When I try to draw curves on my own, I'm awkwardly stretching first this horizontal handle, then that vertical, then the horizontal... as the curve seems to bulge towards one side or the other. Just when I think I have it perfect, I zoom out, and it's not right, the curve's skewed. I look at this image and think "how'd that get so clean and perfect, especially where the the bowl fattens.</p>
    <p>Is there some trick to this, a way of measuring the length of handles relative to each other? Or is it just eyeballed?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_6181.jpg"></div><p></p>
