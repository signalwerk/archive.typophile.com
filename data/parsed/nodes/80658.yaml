      <p>Thanks for the responses so far. Dunwich's especially, it never even occurred to me to just draw the extrema points and go from there, but it makes sense as I think about it. And the shift-clicking on curves too, I'd been strictly working with the handles. I never really played with manipulating the curves directly because mostly I've drawn in illustrator. I'm not sure if illy even allows this.</p>
      <p>I will also check out Spiro and the remix tools. <em>edit: so I have to run cygwin emulator to run fontforge, then figure out how to add the plugin? Don't suppose there's an easier path for a lazy windows user?</em></p>
      <p>Nick - as for deleting the center point on the curve, when I open fonts I often see these points, and when you outline them in illustrator etc. you get dozens of extra unneeded points. But if I see a center point in, say, fontlab, does that mean the designer added them? Or just some quirk of how fontlab draws the glyph?</p>
      <p>JM: I used your graphic because it struck me how perfect the curves looked. Since it was the inspiration for the thread, I decided it would be suitable to show what I meant (to show what really nice perfect curves look like, as opposed to the crap I produce). I was in no way criticizing you or anything you've made. In my ignorance I thought the little blue points were the handles on the beziers, and it struck me how consistent they were. But apparently they're not. My apologies.</p>
