    <p>Greater Albion Typefounders has just released out latest two families, <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/slatterine/ "> Slatterine</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/stannard/ "> Stannard</a>.  Slatterine is a ‘Streamline-era’ family drawing its inspiration from the ‘futuristic’ designs of the 1950s.  Stannard is a pure piece of advertising inspired Nostalgia from the 1920s.  Starting from November 5 both families will be offered at a 30% discount on myfonts.com.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Slatterine_Sale_Poster copy_3830.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Stannard_Sale_Poster_3662.jpg"></div><p></p>
