    <p>I’m doing a logo for a new business called Brogan Brothers, which will make cabinets and also do general remodeling, to clients making over $200,000 a year. I’ve found an interesting relationship with an italicized upper case B, and a lower case B.<br>
    This is in my opinion, the best rough I’ve come up with for the client, based on their elite audience. Now, the client’s spouse thought that the use of an Upper and Lower case B in the logo “suggests that one Brogan is far more important than the other Brogan.”<br>
    Yet, I feel that since the name of the company is not “Brogan &amp; Brogan,” but rather, “Brogan Brothers,” this argument does not hold weight. Furthermore, I’m going to use the font Disturbance with this logo, based on its rhythm and upper&amp;lowercase within the same alphabet. </p>
    <p>I’ld like to be able to show some references to the client of other logos that use acronyms, and an upper and lower case version of the same letter. Any links, posts, or suggestions would be helpful. </p>
    <p>Thankyou!</p>
    <p>here’s an alternate link if my attached file doesn’t work:<br>
    <a href="http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;portfolio_id=1619410&amp;sort_by=1&amp;" title="http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;portfolio_id=1619410&amp;sort_by=1&amp;">http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;...</a></p>
