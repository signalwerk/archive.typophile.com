    html: "<p>Hi Josh <br> <br>Really nice work! <br>I think the characters shape are very unique. You must go on in this project. <br>My little suggestions: <br>The \"z\" needs to be more wide and opened. Maybe, keep the top serif (witch is a drop serif) and make the low one as same as the terminal of \"c\". It seems to me that two drop serifs don't get along so well. (but this is just my opinion). <br>Also the lc \"s\" can be more condensed, it's too wide now. <br> <br>Keep up the good work! <br>Fabio</p>"
