    html: <p>I'm going to begin working on this again. Any more hints... suggestions? Does this have potential? Should I keep going? I'm going to thicken the strokes on the round charicters and add some kind of serif to the angled strokes. I might also increase the overall stroke weight to add more thick-thin contrast. I think the y juts down too much before it curves so I may smooth that. Do some of the ball endings seem too big?. Thanks for any help. This is my first font and I realy hope I can make it sucessful (or at least learn somthing and start over on a new one). This is a great place and everybody is so knoledgeable about type design. I'm a senior graphic design student at the University of Kansas and I wish a type design class was offered here. Has anyone taken such a class? Any good books on type design? <br> <br>Thanks! <br>Josh Scruggs <br> <br>P.S. any ideas for a name. I want sonthing more creative than MJ which is more of a personal thing. </p>
