    <p>Hi I'm new here. This is my first attempt at useable typeface design. Tenitively named MJ, I based the font on a handwriting style I developed. I didn't want to design a handwriting font but a unique whimisical serif font. It has some charicertistics that I wanted to carry over from my handwriting, h, k, f with decenders, the initial and terminating curve I sometimes use. The font uses a grid for the structure of the letters but I wasn't hesitant to break it when I needed to. I haven't drawn the UC yet. <br>Please let me know what you think and what can be improved! any suggustions on the z? <br>Thanks! <br>Josh Scruggs <br><img src="http://www.typophile.com/forums/messages/29/11437.gif" alt=""></p>
