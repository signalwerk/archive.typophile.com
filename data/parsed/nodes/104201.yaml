      <p>If you don't mind my asking, I'm assuming you drew the font as open paths and then stroked it to get outlines? If so, what software did you use for the stroking?  I'm also working on a stroked-path font at the moment (<a href="http://typophile.com/node/103594" rel="nofollow">here</a>), but I'm having lots of trouble finding a good stroking application. </p>
      <p>Did you do any optical corrections afterwards? Or manually add some contrast?</p>
