      <p>I suppose I should have added "dramatization" alongside the post. Anyway looks like I was completely wrong... </p>
      <p>"the original Intel “dropped-e” logo, which was created by Silicon Valley pioneers Robert Noyce and Gordon Moore 37 years ago as they were forming their new “integrated electronics” company."</p>
      <p>via - <a href="http://www.intel.com/pressroom/archive/releases/20060103corp.htm" title="http://www.intel.com/pressroom/archive/releases/20060103corp.htm">http://www.intel.com/pressroom/archive/releases/20060103corp.htm</a> </p>
      <p>So the logo was created by a pair of engineers in 1969. As to the dropped e maybe they know - seems like a geeky gimmick to me ;-)</p>
      <p>Cheers, Si</p>
