    <p>Hello. Spright is based on a Centaur /E, and every glyph is full of irregular, organic curves that unfortunately only come across in higher magnification; perhaps darkening the glyphs would help. I've tried to keep each letter unique, without factory-style assemblage from other letters, but again, these details are obscured at normal sizes. Maybe it's best to see Spright as a modernized Jenson. Circular dots are the default, but I do have cruciforms available in SS01. The caps are lighter than normal, to give a more even color to the page. The numerals are monospaced, semi-hanging; proper OSF are coming. I also have alternate, more separated forms of /AE and /OE; blame it on a spec sheet for Berthold's Palatino BQ.</p>
