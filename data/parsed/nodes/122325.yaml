    html: |-
      <p>Well, it looks very nice, but it has <em>one</em> characteristic to which I object.</p>
      <p>If it's intended to be "modernized", which I take to mean that it's intended to be usable in present-day typography, rather than going all-out for authenticity, then I think that the extension of the crossbar on the lower-case "e" past the body of the letter to the right is much too prominent to be consistent with the usability of the face.</p>
      <p>I'm happy to accept some slightly eccentric touches in a Venetian, like diamond tittles (which may warm Hrant's heart), and some slight protrusion on the e (about 1/4 to 1/5 of what you have) might also be all right, but I really think this will be too limiting to the applicability of the typeface. However, my opinion isn't to be taken too seriously on its own, as I am no expert in these matters, just an interested layperson.</p>
      <p>However, looking at some existing Venetians, specifically Centaur itself and Eusebius, they had extensions on the e, but those were significantly smaller than in your face.</p>
