    date_raw: 20 Jan 2005 — 7:13am
    votes: null
    html: <p>The symbol doesn't really support the text. Is it a yacht (as in the wind would lead me to suppose)? The waves in the first symbol also made me feel the boat was going away from the viewer. As Kemie noted the boat might be improved by painting it with a loose brush and don't be too scrupulous about cleaning up the digitisation. The heavier text is my preferred option and the changes Scott proposed for the s would help, however I think in the process of cleaning up your sketch you have lost the spontaneity of the original. The a might be better with a loop at the top where it connects to the D and similarly the top of the s and the first n. <br>Tim</p>
    html_clean: <p>The symbol doesn't really support the text. Is it a yacht (as in the wind would lead me to suppose)? The waves in the first symbol also made me feel the boat was going away from the viewer. As Kemie noted the boat might be improved by painting it with a loose brush and don't be too scrupulous about cleaning up the digitisation. The heavier text is my preferred option and the changes Scott proposed for the s would help, however I think in the process of cleaning up your sketch you have lost the spontaneity of the original. The a might be better with a loop at the top where it connects to the D and similarly the top of the s and the first n. <br>Tim</p>
