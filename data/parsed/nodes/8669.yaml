    <p>Hi all, <br> <br>I'm working on my own identity and decided to challenge myself with my first script signature. <br>I initially drew this and then scanned and traced it. It directly translates to "In the wind" which is something I wanted to show in the typography. <br> <br>I have a few things in mind that I think need to be fixed: <br>-I dont think the weight is consitent, I am wondering where I should thicken or thin, I think I should aim for thicker since it will be used as a logo. I think my first letters work better. <br>-I'm not sure about the thickness of the l to the right, is my t too thin? etc, etc. <br>-Should I keep a flexible baseline? <br> <br> <br>I'd appreciate any input you can give me. <br>I attached both .jpg and .swf files. <br> <br>Thanks for your time, <br>Emilie <img src="http://www.typophile.com/forums/messages/29/63027.jpg" alt="Dans le vent signature"></p>
