    html: <p>Thanks everyone for your input <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>When my symbol was first handsketched, I felt it good. It is a boat but I meant it to be a paper boat (fits better with the name that way). I tried opening it by doing it with strokes instead of a full mass but was not satisfied, although I should probably give it another shot. <br> <br>The identity is for me, I'm a freelance graphic designer. In a way, I'm almost thinking that if I simply scanned my sketch or reworked it with watercolor, it would look much better. What are your feelings about using a logo that is not made of vectors in my situation? <br> <br>Time to take out the brushes and ink I believe... <br> <br>Thanks, <br>Emilie</p>
