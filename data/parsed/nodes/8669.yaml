    html: <p>I'm going to throw in my symbol for critique as well. Here is 2 jpgs, one with thinner type and one with bolder type (my first version that is not reworked). Fyi, I didn't really put any time into positioning for the symbol, just put them next to each other. <br> <br>Here is my issue, I like both things seperately but I'm not sure if they fit together anymore! Of course I could rework the symbol to try make it fit more with the type. I like the contrast straight-pointy/curve-smooth, at the same time I wonder it is really beneficial to the overall aspect. <br> <br>I feel the symbol is crushing the light type but I think the light type looks more sophisticated and legible in small... <br> <br>Any thoughts? <br> <br><img src="http://www.typophile.com/forums/messages/29/63077.jpg" alt="Thin type"> <br><img src="http://www.typophile.com/forums/messages/29/63078.jpg" alt="Thick type"></p>
