    html: |-
      <p>Hi Richard, great you made it to Typophile, welcome!</p>
      <p>I’ll repeat <a href="http://twitter.com/#!/hardwig/status/18225869166" rel="nofollow">what I’ve said on Twitter</a> recently:</p>
      <p>Great site indeed. Although I wish you would put these pics on Flickr* [or introduce a comment/tag functionality on your site]—without tags &amp;c, it’s just a big album, not a resource, nor a community. And <a href="http://twitter.com/#!/hardwig/status/18227053353" rel="nofollow">yes</a>, I would like to add tags myself.</p>
      <p>*) What I like about Flickr is the fact that it is modular. You can add your photos to one or more groups. There are several places for signage, lettering etc., e.g. <a href="http://www.flickr.com/groups/signpaintr/" rel="nofollow">Signpaintr</a> or <a href="http://www.flickr.com/groups/typewalk/" rel="nofollow">Typewalk</a>.</p>
      <p>Some groups focus on a subtopic, like <a href="http://www.flickr.com/groups/neonsigns" rel="nofollow">neon signs</a> or <a href="http://www.flickr.com/groups/355438@N24/" rel="nofollow">vintage motel signs</a>. Others collect examples for an even narrower field of interest: there are groups for single characters like the <a href="http://www.flickr.com/groups/ij/" rel="nofollow">Dutch Ĳ/ĳ</a> or the <a href="http://www.flickr.com/groups/386230@N21/" rel="nofollow">German capital Eszett</a>.</p>
      <p>I know that Flickr has its downsides aswell (proprietary/Pro usage not free, among others).<br>
      And: we would need to develop a useful and commonly agreed upon terminology.</p>
      <p>This project looks promising, but hasn’t quite started yet: <a href="http://colettering.com/" title="http://colettering.com/">http://colettering.com/</a></p>
      <p>More related sites:<br>
      <a href="http://www.publiclettering.org.uk/" title="http://www.publiclettering.org.uk/">http://www.publiclettering.org.uk/</a><br>
      <a href="http://www.stadtgespraeche.com/" title="http://www.stadtgespraeche.com/">http://www.stadtgespraeche.com/</a><br>
      <a href="http://www.vernacular.fr/" title="http://www.vernacular.fr/">http://www.vernacular.fr/</a></p>
      <p>Florian</p>
