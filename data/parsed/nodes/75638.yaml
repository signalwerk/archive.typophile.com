    html: |-
      <p><cite>… without tags &amp;c, it’s just a big album, not a resource, nor a community.</cite></p>
      <p>You have a point here. When a larger stock of photos becomes searchable, that is much more interesting than having just a bunch of images, however beautiful they might be. Considering that, Colettering.com looks quite promising, and yet I wonder if contributors will be able there to establish their own categories (”beer labels”) instead of being restricted by the default set of tags.</p>
      <p>Flickr may be a suitable platform to let typophile photo collections grow. But: a group “typography and lettering” comprising more than 86.000 pieces seems rather useless to me.</p>
      <p>By the way, I find also <a class="freelinking external" href="http://www.flickr.com/groups/blackboardlettering/pool/" rel="nofollow">this collection of blackboard lettering</a> quite enchanting.</p>
