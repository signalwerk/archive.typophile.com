    html: |-
      <p>Hi,<br>
      Thank you for your interest in <a class="freelinking external" href="http://www.colettering.com" rel="nofollow">Colettering</a>.<br>
      Before we started our colettering project we looked for similar projects or alternatives.<br>
      We then decided to create something new, because we haven't found a project with our key properties.</p>
      <p>some are:<br>
      - not another photoblog<br>
      - standardized tagging for the specifications (no duplicates "sans-serif", "sans serif")<br>
      - additional (free) tagging (add color, factory ore something like that)<br>
      - geolocation<br>
      - all properties are searchable and can be combined (specification, character, location)<br>
      - beautiful and simple interface :)</p>
      <p>During the last few weeks I've fixed the most tasks and bugs on our roadmap,<br>
      so I am very confident to start soon with the beta version.</p>
      <p>Jörn</p>
