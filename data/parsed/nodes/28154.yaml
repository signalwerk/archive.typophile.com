      <p>Fast type, Slow type Conference<br>
      16-18 October 2006<br>
      The Custard Factory, Birmingham, UK<br>
      -----------------------------------</p>
      <p>If you are booking for the Fast type, Slow type Conference<br>
      make sure you take advantage of the early bird rates, which<br>
      close on Tuesday 19 September 2006.</p>
      <p>Early Bird Rates<br>
      3-day ticket = £175.00<br>
      2-day ticket = £120.00<br>
      1-day ticket = £75.00<br>
      Concessions (students, retired, unemployed) = £115.00</p>
      <p>The price of a ticket includes:<br>
      . 28 lectures<br>
      . over 20 exhibitions<br>
      . letterpress workshops<br>
      . calligraphy sessions<br>
      . guilding workshops<br>
      . stone carving opportunities<br>
      . a lesson in FF PicLig visual language<br>
      . private viewing of the Plus international design expo<br>
      . two parties<br>
      and a limited edition booklet to commemorate the occasion.</p>
      <p>Come to the conference and :<br>
      . Take a walking tour of Baskerville's Birmingham<br>
      . Have your 'Hands on Baskerville'<br>
      . View the Baskerville exhibition at the Central Reference<br>
      . Library<br>
      . Listen to Jenny Uglow talk about 'Bewick and Bothersome<br>
      Printers'<br>
      . Book a seat for 'Pravda' at the Repertory Theatre</p>
      <p>We look forward to welcoming you in Birmingham!<br>
      . . . . . . . .</p>
