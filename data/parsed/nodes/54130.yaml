  - id: 326184
    user: 5264
    date: 2009-01-31T04:32:00
    date_raw: 31 Jan 2009 — 4:32am
    votes: null
    html: <p>It would be a better idea to post a pdf of your file. Some letters in the caps have to be fixed. The crossbar of the J is too large, it looks like the T wiht a bottom curve. The H is not wide enough. The top crossbar of the F should be more to the right than to the left, the F is almost [but not] an E without the bottom bar, the middle bar could be a bit lower than the E one to avoid to have a large white space under. I hope this will help you.</p>
