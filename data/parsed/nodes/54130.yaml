    html: |-
      <p>Here's another revision. </p>
      <p><a href="http://typophile.com/files/Fanline.pdf" title="http://typophile.com/files/Fanline.pdf">http://typophile.com/files/Fanline.pdf</a></p>
      <p>I have reworked the capitals and fixed some of the kerning. I'm still not liking the fact that some lowercase letters such as the "g" and the "y" clash with characters such as the "h" and the "l" on the line below, but hopefully there will be a way to fix that.</p>
      <p>In the example, you can also see the "ff" ligature. This was just a bit of testing I was doing, and I forgot it was included when I built the font.</p>
