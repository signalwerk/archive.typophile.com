    <p>First actual font (and by that I mean the first one that has made it this far!)</p>
    <p>I started this font about three days ago from a sketch of the letter 'a' I did on Sunday. At the moment, only lowercase letters have been completed. It's not one of those fonts you would set a book in, but it might be useful for the occasional heading.</p>
    <p>Any tips would be greatly appreciated.</p>
