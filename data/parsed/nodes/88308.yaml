      <p>&nbsp;&nbsp; &gt; &nbsp;&nbsp;<cite>where the entries would be divided by a specified spacing</cite></p>
      <p>I forgot that point. You need only fix the spacing at the end of the definition of the environment <code>dictsubentry</code> (in <code>\newenvironment{dictsubentry}</code>).</p>
