  html: |-
    <p>Does anybody know a good template or can create one for LaTeX for a dictionary – such a template which divides a page in two (or three) columns, <em>with</em> a dividing line between them, where the entries would be divided by a specified spacing (spacing after paragraphs) and the first line indented <em>or</em> where the entries would feature hanging paragraphs?</p>
    <p>Any code suggestions?</p>
