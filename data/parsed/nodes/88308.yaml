    html: <p>Typophile James Crippen wrote a Tlingit dictionary with XeLaTeX. His sources are available at <a href="http://www.drangle.com/~james/dictionary/" title="http://www.drangle.com/~james/dictionary/">http://www.drangle.com/~james/dictionary/</a>. To get the vertical separating line, you only need to add one line of code using the command <code>\setcolsepandrule</code>.</p>
    html_clean: <p>Typophile James Crippen wrote a Tlingit dictionary with XeLaTeX. His sources are available at <a href="http://www.drangle.com/~james/dictionary/" title="http://www.drangle.com/~james/dictionary/" class="link-external">http://www.drangle.com/~james/dictionary/</a>. To get the vertical separating line, you only need to add one line of code using the command <code>\setcolsepandrule</code>.</p>
