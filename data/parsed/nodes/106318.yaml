      <p>From the <a href="http://www.colophon-foundry.org/fonts/apercu/about-font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Colophon-Foundry web site</a>...</p>
      <blockquote><p>Aperçu was started in December 2009, and has been trialled and tested through a number of design comissions taken on by The Entente through 2010. The conceit behind Aperçu was to create a synopsis or amalgamation of classic realist typefaces: Johnston, Gill Sans, Neuzeit &amp; Franklin Gothic.</p>
      <p>Since its release in August 2010, Aperçu quickly found its position in the market, being used across a variety of different media and sectors around the world in both print and web. It has been utilized by institutions such as MOMA, De Wiels, Zeit Magazine and the Walker Art Center.</p></blockquote>
