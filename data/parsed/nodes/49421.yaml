    <p>Hi,</p>
    <p>I have been trying to figure out exactly what the 'official' classifications of type are, and I have found some, but I was wondering if I was missing any or if there are any errors/repeats in my list.<br>
    Thanks a lot!</p>
    <p>I found these, so far:<br>
    (Thanks so 'Thinking With Type' by Ellen Lupton and 'The Elements of Typographic Style' by Robert Bringhurst)</p>
    <p>Humanistic<br>
    Antique Roman<br>
    Transitional<br>
    Egyptian<br>
    Modern Roman<br>
    New Transitional<br>
    Linear Grotesque<br>
    Linear Neogrotesque<br>
    Linear Geometric<br>
    Linear Humanistic<br>
    Stone Carved<br>
    Calligraphic<br>
    Stylized/Decorative<br>
    Glyphic<br>
    Black Letter</p>
