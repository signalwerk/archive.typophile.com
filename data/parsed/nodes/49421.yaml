    html: |-
      <p>Rather than static classifications I prefer categorizing by aspects like Noordzij's translation (broad nib pen contrast) vs expansion (pointed pen contrast), serif vs sanserif, upright vs italic construction, maybe round vs broken curves, which together allow covering a wide range of typefaces: The Renaissance/Humanistic, Transitional, Classicistic distinction can be applied to serif and sanserif type alike, even to slab serif type (which offers a finer grid than the single "Egyptian" in your list). Turning to the broken category, maybe consider, with Noordzij, Textur as a broken upright and Fraktur as a broken italic, rather than just "Blackletter". This approach helps to look at typefaces more carefully and focus on their construction rather than secondary or even accidental aspects.<br>
      Limitations of static classifications become obvious with "Calligraphic" or "Stylized/Decorative" which can contain very different typefaces for which there is no place in any other case.<br>
      If you can get hold of it, have a look into the first volume of the <em>Scangraphic Digital Type Collection</em>, edition 4/1990, pp. 65-81.</p>
