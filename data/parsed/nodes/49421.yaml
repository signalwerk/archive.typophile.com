      <p>Bailey, another book you might want to look up is <a href="http://www.amazon.com/Printing-Types-Alexander-S-Lawson/dp/0807066613/ref=sr_1_7?ie=UTF8&amp;s=books&amp;qid=1221431579&amp;sr=1-7" rel="nofollow"><em>Printing Types: An Introduction</em></a>, by <a href="/wiki/Alexander%20Lawson" class="freelinking" rel="nofollow">Alexander Lawson</a>. Chapter 3 is devoted to type classification and includes a discussion of the Vox system, the ATypI system, the British Standards system, and the DIN system, plus Lawson's own attempt to formulate a rational system.</p>
      <p>There is also a very good article by Jonathan Hoefler, "On Classifying Type", in <a href="http://www.emigre.com/EMag.php?issue=42" rel="nofollow">Emigre 42</a>. Maybe you can find it at a library.</p>
