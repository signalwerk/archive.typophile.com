      <p>Hi Mat, nice to meet you.</p>
      <p>What school, what degree, and who is your supervisor?</p>
      <p>I suggest you read the following (in thic chronological order):</p>
      <p>Patterson, D. &amp; Tinker, M., (1946). Readability of Newspaper Headlines Printed in<br>
      Capitals and in Lower Case. <em>Journal of Applied Psychology, (30)2</em>, 161-168. </p>
      <p>Bouma, H. (1973). Visual interference in parafovial recognition of initial and final letters of words. <em>Vision Research, 13<em>, 762–782.</em></em></p>
      <p>BEsNer, d. (1989). ON thE rOlE of oUtliNe shApe aNd woRd-sPeciFIC vIsUaL pATern in ThE idENtIFicatIOn OF fUNCTtiOn wOrdS: nONe. <em>tHE qUaRteRly joURnaL of EXPErimEntal PSYchOLOgy: HUMAn exPErImeNtal PSYChoLOgy, Vol 41(1-A)</em>, 91–105.</p>
      <p>Pelli, Denis G. and Tillman, Katherine, A. (2008). <em>The uncrowded window of object recognition. Nature Neuroscience (11)10</em>, 1129–1136.</p>
      <p>Sorkin, E. (2009). <em>The relationship of negative tracking to reading speed</em> (Unpublished master's thesis — this may be in the publication process. I do not know). University of Reading, London.</p>
      <p>As far as referencing other literature goes, the easiest thing to do is start with a good paper (like Larson's), go to the end of the document where the references section is, and find other articles that you think sound relevant. I'm sure your library will be able to help you conduct database searches. After a while, certain names start to become familiar and the process becomes significantly easier. This is a fun and rewarding process.</p>
