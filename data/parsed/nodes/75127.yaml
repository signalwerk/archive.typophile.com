      <p>Hi Kevin, thanks for the repost of that email I’m sure it’s going to be  a really big help with the research front, main my point of the report would  to see what influence word recognition <cite>if any</cite> took on type designers when designing a face. My very limited knowledge leads me to believe that it differs from designer to designer, with some of the more experimental designers leaning more to form than function. But I suppose that will become clearer later on.</p>
      <p>Thanks again for links to some of the papers, I have been looking for couple of the ones you have posted here, and really struggling!</p>
      <p>Hi Nick, I do spend my time studying and practising design but also this is an area that interests me a lot, and we are required to submit a report on a subject within design of our choice. Having read an extract of<br>
      Kevin’s paper in Eye It’s always stuck in my head when looking at type, the shape that certain typefaces make, especially the contrast of some of the modern typefaces compared to some of the more accepted, legible faces.</p>
      <p>William, I have also looked into that thread, a great discussion going on there! It will be good for looking at some faces that exclusively contain uppercase in my report.</p>
      <p>Thanks,<br>
      Mat.</p>
