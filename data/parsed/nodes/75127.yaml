      <p>Hi, this is a reposting of an email that I wrote on the ATypI list:<br>
      Here are 10 recent letter and word recognition projects that I find interesting:</p>
      <p>Sheedy, J.E., Subbaram, M.V., Zimmerman, A.B., &amp; Hayes, J.R. (2005). Text Legibility and the Letter Superiority Effect. Human Factors, 47(4), 797–815.<br>
      	Letter superiority: It is easier to recognize letters in isolation than in the context; likely related to crowding. 6 fonts were tested with a threshold size methodology. Sheedy’s lab has expanded this method to look at 12 legible text faces of different styles.</p>
      <p>Chaparro, B.S., Shaikh, A.D., Chaparro, A. (2006). The Legibility of ClearType Fonts. Proceedings the Human Factors and Ergonomics Society, San Francisco.<br>
      <a href="http://www.surl.org/usabilitynews/81/legibility.asp" title="http://www.surl.org/usabilitynews/81/legibility.asp">http://www.surl.org/usabilitynews/81/legibility.asp</a><br>
      <a href="http://www.surl.org/usabilitynews/92/legibility.asp" title="http://www.surl.org/usabilitynews/92/legibility.asp">http://www.surl.org/usabilitynews/92/legibility.asp</a><br>
      	The first paper linked to here uses a time threshold measure to find the most confusable glyphsin the ClearType fonts, Verdana, and TNR. They also developed a visualization called a sunflower plot. The full paper with more data is going to be published in the Information Design Journal in May of this year. The second linked paper expands that method to 20 legible text faces of different styles to understand the letter features that reduce confusions. A full paper on this topic is being written.</p>
      <p>Sofie Beier (2009). Typeface Legibility: Towards defining familiarity. Ph.D. dissertation. The Royal College of Art.<br>
      	The first half of this dissertation is concerned with testing the legibility of alternate letterforms in three newly created text typefaces. The first half of the dissertation has been turned into a journal paper and has been accepted by the Information Design Journal. It’s expected to be published later this year. (It just came out) <a href="http://www.benjamins.com/cgi-bin/t_bookview.cgi?bookid=IDJ%2018%3A2" title="http://www.benjamins.com/cgi-bin/t_bookview.cgi?bookid=IDJ%2018%3A2">http://www.benjamins.com/cgi-bin/t_bookview.cgi?bookid=IDJ%2018%3A2</a></p>
      <p>Pelli, Burns, Farell, &amp; Moore-Page (2006). Feature detection and letter identification. Vision Research, 46(28), 4646-4674. <a href="http://psych.nyu.edu/pelli/pubs/pelli2006letters.pdf" title="http://psych.nyu.edu/pelli/pubs/pelli2006letters.pdf">http://psych.nyu.edu/pelli/pubs/pelli2006letters.pdf</a><br>
      	Letter recognition performance is inversely proportional to parametric complexity (perimeter squared over ‘ink’ area.</p>
      <p>Majaj, Pelli, Kurshan, &amp; Palomares (2002). The role of spatial frequency in letter identification. Vision Research, 42, 1165-1184. <a href="http://psych.nyu.edu/pelli/pubs/majaj2002channel.pdf" title="http://psych.nyu.edu/pelli/pubs/majaj2002channel.pdf">http://psych.nyu.edu/pelli/pubs/majaj2002channel.pdf</a><br>
      	Letter recognition uses a narrow band of spatial frequencies dependent on letter size and stroke frequency per letter width; Large letters are identified by their edges and small letters by their strokes.</p>
      <p>Fiset, Blais, Ethier-Majcher, Arguin, Bub, &amp; Gosselin (2008). Features for Identification of Uppercase and Lowercase Letters. Psychological Science, 19 (11), 1160-1167.<br>
      	By occluding letter parts at random at 5 different spatial frequencies found the letter recognition performance was hurt most by occluding letter terminals.</p>
      <p>Arditi &amp; Cho (2007). Letter case and text legibility in normal and low vision. Vision Research, 47 (19), 2499-2505.<br>
      	They measured the minimum threshold size to recognize lowercase text and minimum threshold size to recognize uppercase text (Arial). When read at twice the minimum threshold size, readers read the uppercase text faster than the lowercase text.</p>
      <p>Changizi, Zhang, Ye, &amp; Shimojo (2006). The Structures of Letters and Symbols throughout Human History are Selected to Match Those Found in Objects in Natural Scenes. The American Naturalist, 167 (5).<br>
      	All orthographies show the same patterns of intersections, and that pattern matches those found in nature. Orthographies evolved not to match the performance of the hand, but to match what the eye was already good at recognizing. See also Changizi’s book The Vision Revolution.</p>
      <p>Walker (2008) Font tuning: A review and new experimental evidence. Visual Cognition, 16 (8), 1022-1058.<br>
      	We are faster at recognizing words if we know what font to expect than if we don’t know what font to expect. This was first demonstrated in the 80s by Sanocki.</p>
      <p>ATypI 2009 talk: “Don’t we have enough fonts”<br>
      <a href="http://www.chi2008.org/altchisystem/submissions/submission_hazlettr_0.pdf" title="http://www.chi2008.org/altchisystem/submissions/submission_hazlettr_0.pdf">http://www.chi2008.org/altchisystem/submissions/submission_hazlettr_0.pdf</a><br>
      	At ATypI I talked about some data demonstrating that people are faster at recognizing words if the meaning of the word matched the personality of the font. Many people are familiar with the Stroop effect where incongruency between word and color makes it harder to name the word/color. The same seems to be true of other characteristics of the word. The above paper was submitted to a conference, but not accepted. We’re doing more studies currently to get it ready for a future journal article.</p>
      <p>Cheers, Kevin</p>
