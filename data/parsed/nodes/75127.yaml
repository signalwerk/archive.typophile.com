    <p>Hi there typohiles,</p>
    <p>Long-time lurker, first post.</p>
    <p>I'm looking into my report for my final year<br>
    at university, the topic I’m most interested to write<br>
    about is word recognition &amp; typography. I think<br>
    there could a really angle with the new turns in type<br>
    with alot more of the "experimental" typefaces<br>
    being ultra-bold, nearly illegible &amp; in alot of cases<br>
    lacking a proper family with no lowercase also<br>
    compared to say Gill, Helvetica, Futura etc.</p>
    <p>In my first year I read a interesting article<br>
    on "The science of word recognition" in Eye 52, I’ve<br>
    gone back to that article and found Kevin<br>
    Larson's paper to be of real interest, the only thing<br>
    I’m struggling with now is finding the right<br>
    literature to reference from.</p>
    <p>Any help on this would be great, I’m still on<br>
    the hunt now and not giving up.</p>
    <p>Thanks,</p>
    <p>Mat</p>
