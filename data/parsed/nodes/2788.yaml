    html: <p>In the case of the MoMA logo, this is simply replacing one typeface by another. Often finetuning of a logo becomes necessary because the original has been physically degraded, e.g. during transfer of the image from one technology to another, or because people implementing the identity have not strictly followed guidelines or used original source versions. This is particularly true for large organisations that have multiple offices in different cities or countries working with local design agencies to produce material that uses the logo.</p>
