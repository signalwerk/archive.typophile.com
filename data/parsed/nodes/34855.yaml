    html: |-
      <p>More: I think my love for the open-bottom binocular “g” (still easier to type out than “sesquiocular” :-) comes from a desire to shoot down convention; and replacing a stale convention with something better is a nice bonus. :-)  It’s a supreme case of a subtle but significant improvement to what so many people blindly assume is the ideal form. When you think about it, the conventional binocular “g” is too complex to fit with the rest of the alphabet; it’s almost like a Chinese logograph. We -and readers- might not notice a problem most of the time, but especially when it’s doubled, it can jump out. The open-bottom one is a much more harmonious and functional solution. Danm shame most designers who use it do it merely for fashion though.</p>
      <p>hhp</p>
