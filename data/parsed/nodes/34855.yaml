    html: |-
      <p>The flute player was Kokopelli.</p>
      <p>Kokopelli is a figure commonly found in petroglyphs and pottery throughout the southwest. He Is regarded as the universal symbol of fertility for all life, be it crops, hopes, dreams, or love. The first known images of him appear on Hohokam pottery dated to sometime between AD 750 and AD 850. He is also a trickster god and represents the spirit of music.</p>
      <p>Sorry to let it go, but Kokopelli suffered severely by the new avatar size enforcement, and I tried reducing it to the required 60 x 60 but my results were too fuzzy and jaggy and weren’t very clear. If I knew how to keep the resolution at a reduced size, I’d go back to using it again.</p>
      <p>My new avatar is the logo I use on my newsletter <em><strong>&amp;cetera</strong></em> and symbolizes my belief that heart-smart and head-smart both count, but heart-smart counts more. Thanks for noticing, Mili.</p>
