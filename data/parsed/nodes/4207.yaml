    html: "<p>My rationale for the byline is pretty similar to the ones expressed above:  All cap settings are just plain hard to read.  It's not going to kill you to have a byline set in allcaps, but when both your wordmark and the byline are allcaps, it just isn't legible or effective. <br> <br>Sorry, that's not eurostile, it's a bank gothic variant.  Anyway, of the fonts in your album, I would suggest you stay away from any of the copperplates, eurostiles (includes microgramma), and bank gothics.  These are just overused and as such are seriously beginning to lack character.  There are so many good alternatives out there that are fresher and more memorable.  Some suggestions: <br> <br><a href=\"http://www.myfonts.com/fonts/storm/teuton/fett-bold/testdrive.html?s=Chart%2BTricks&amp;p=72\">Teuton Fett Bold</a> (Storm) <br> <br><a href=\"http://www.myfonts.com/fonts/storm/dynagrotesk/dxe-bold/testdrive.html?s=CHART%2BTRICKS&amp;p=60\">DynaGrotesk DXE Bold</a> (Storm) <br> <br>etc. etc.  Wish I had more time to browse around right now.  In short, there are lots of great offerings to explore. <br> <br></p>"
