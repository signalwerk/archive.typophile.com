    html: <p>The bars don't really look like bar charts to me. I'd show a variety of heights of 3 bars to give the appearance of a bar chart. The minimum number of repeating elements required to establish a pattern is 3. <br> <br>I also agree with what others have said concerning the 'TT' and the box alignment. The Ts should either join purposefully, or contrast (separate) purposefully. The way it is now complicates the visual parsing of the words a bit, and therefore the name. <br> <br>Also, doesn't red have a negative market connotation?</p>
