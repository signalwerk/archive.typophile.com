    html: <p>"when you say play with the 'TT' junction, do you mean the kerning?" <br> <br>I mean PLAY! Don't be timid...try anything and everything! Make 50 variations with different weights, colors, layouts, styles, connections, etc. Most will be quick sketches and not amount to much, but I bet you'll find a few that are worth exploring a bit further. <br> <br>Specific for the Ts, try overlapping, connecting, stacking, rotating, flipping, skewing, replacing with other characters, ligatures, etc.</p>
