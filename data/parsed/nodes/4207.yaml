    date: 2004-04-14T16:11:00
    date_raw: 14 Apr 2004 — 4:11pm
    votes: null
    html: "<p>I am not a professional, so I can only give you the innocent eye test ... The difference in colour within CHARTTRICKS makes this less uncomfortable, but I'm afraid, for me, this is not working. It looks not so much austere as dull. The problems I think I have are: <br> <br>1. The box has no significance. With those heavy lines it does not conjure up an image of a chart, for instance. It's just a box. If it reminds me of anything it is a ballot paper. <br> <br>2. There's no tension: it's a series of blocks: a blocky box, and a rectangle of blocky capitals. It's neat, but it is the regimented neatness of the suburban lawn. Whether it be a contrast of type, or of line length, or of position, or of colour, some sort of injection of life is needed. (The first version actually had more tension.) <br> <br>3. The bold box and the bold type all make it rather heavy. Is this necessary. Heavy typography is the typography of shouting. Is that what you want? Lighter weight caps might have more elegance and subtlety, and perhaps be more \"austere\". <br> <br>I'd say: Don't be bullied by the client. If he knew how to design this, he'd do it himself. Perhaps you need to start with something outlandishly odd and then move it towards respectability, rather than the other way round. Show him what he really wants, not what he thinks he wants.</p>"
    html_clean: "<p>I am not a professional, so I can only give you the innocent eye test ... The difference in colour within CHARTTRICKS makes this less uncomfortable, but I'm afraid, for me, this is not working. It looks not so much austere as dull. The problems I think I have are: <br> <br>1. The box has no significance. With those heavy lines it does not conjure up an image of a chart, for instance. It's just a box. If it reminds me of anything it is a ballot paper. <br> <br>2. There's no tension: it's a series of blocks: a blocky box, and a rectangle of blocky capitals. It's neat, but it is the regimented neatness of the suburban lawn. Whether it be a contrast of type, or of line length, or of position, or of colour, some sort of injection of life is needed. (The first version actually had more tension.) <br> <br>3. The bold box and the bold type all make it rather heavy. Is this necessary. Heavy typography is the typography of shouting. Is that what you want? Lighter weight caps might have more elegance and subtlety, and perhaps be more \"austere\". <br> <br>I'd say: Don't be bullied by the client. If he knew how to design this, he'd do it himself. Perhaps you need to start with something outlandishly odd and then move it towards respectability, rather than the other way round. Show him what he really wants, not what he thinks he wants.</p>"
