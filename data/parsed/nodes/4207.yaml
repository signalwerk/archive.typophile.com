    html: <p>Much thanks for the feedback Chris.  It was decided just recently not to use the bars at all. "Charts" are trite and over-used. To imply a "chart" without actually using the bar elements is good enough and maintains the austere, staid feel I am after.  So the icon will be just the bold square.  <br> <br>Not sure what others have said regarding the box alignment. I missed that.  I am playing with the TT juncture as well. Any suggestions there -- i.e., should I play with kerning to get the TT's to join?  I am using futura bold. My second choice would be to use contrasting colors.  thanks so much for the feedback.</p>
