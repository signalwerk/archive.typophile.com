    html: <p>Thanks to all who contributed.  Greatly appreciated.   <br> <br>"Chart Tricks" is a research report/service which interprets the price charts of financial markets. <br> <br>It is somewhat ironic that the name of the report is novel and "tricky," when in fact it is aimed at a serious, no-nonsense audience.  The image sought is one of professionalism and seriousness.  There should be very little if anything "tricky" or cute about the image. <br> <br>So, after all the exploration, we have opted to go with a text only logo, using a sackers heavy gothic (lower case) for both the logo and the strap line.   <br> <br>thanks again to all.</p>
    html_clean: <p>Thanks to all who contributed.  Greatly appreciated.   <br> <br>"Chart Tricks" is a research report/service which interprets the price charts of financial markets. <br> <br>It is somewhat ironic that the name of the report is novel and "tricky," when in fact it is aimed at a serious, no-nonsense audience.  The image sought is one of professionalism and seriousness.  There should be very little if anything "tricky" or cute about the image. <br> <br>So, after all the exploration, we have opted to go with a text only logo, using a sackers heavy gothic (lower case) for both the logo and the strap line.   <br> <br>thanks again to all.</p>
