  html: |-
    <p>Hi there,</p>
    <p>for an exhibition, that will be partly in 3 languages, german, english an hebrew, I need some help with the right choice of a hebrew font that goes well with <a href="https://web.archive.org/web/20080906212221/http://www.type.co.uk/index.php?p=a_to_z&amp;search=chevin">Chevin</a>.  We use Chevin demibold for the quotes within the interviewtext. The german original in demibold, the english translation in demibold italic an for the hebrew translation we are not sure yet.<br>
    The fonts that actually look well are probably the comic sans of hebrew typography, and we don´t know it. You understand our problem: I don´t have an idea what we are doing to someones eyes reading the texts, if choosing one of those:</p>
    <p><a href="https://web.archive.org/web/20080906212221/http://www.myfonts.com/search?search%5Btext%5D=sweeta">Sweeta</a><br>
    <a href="https://web.archive.org/web/20080906212221/http://www.myfonts.com/fonts/masterfont/sean-mf/">Sean</a></p>
    <p>What would you suggest? </p>
    <p>Many thanks in advance for some help in this tricky situation.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080906212221/http://www.typophile.com/node/18382" class="topic-previous" title="Go to previous forum topic">‹ 8.5 by 11 margins</a> <a href="/web/20080906212221/http://www.typophile.com/node/41103" class="topic-next" title="Go to next forum topic">New logo for Design Company ›</a></div>
