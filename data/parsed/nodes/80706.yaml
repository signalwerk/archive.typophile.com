    <p>Gurus and Typophiles I need your help once again... pretty please?</p>
    <p>Can you please tell me if this is just a generic typeface or if there's a particular discerning feature that would require me to find the exact typeface in order to replicate the type? I'm asking for the typeface of the 'body' text, the trivia on the wrappers. Though if you know the typefaces used for either the Allen's or Fantales logos, I'll gladly take that info.</p>
    <p>Any help would be mucho appreciated. Here are two pics:</p>
