      <p>I don't know the why and I usually use \phantom in equations without problems. If you write your phantom so that the letter be a mathematical letter the problem seems to disappear. With the input<br>
      <code><br>
      Vin.\ i zvat.\ mn.\ imaju akcente kao i im.\ mn.: \emph{zȗbe : zȗbi}, \emph{knȅzove : knȅzovi}, \emph{púževe} i t.\ d.<br>
      </code><code><br>
      $\phantom{i}$\symbol{"0311} na ˊ u svima padežim [\ldots]<br>
      </code><code><br>
      blabla [\ldots]<br>
      </code><br>
      I get</p><div class="imageWrap"><img src="http://typophile.com/files/blabla_4259.png"></div><p></p>
      <p><code>\phantom{a}</code> was giving a "left side bearing" that was too large; with Cambria, <code>$\phantom{i}$\symbol{"0311}</code> also looked fine between two words.</p>
      <p>For the whys, y0u may try <a href="http://tex.stackexchange.com/questions/" title="http://tex.stackexchange.com/questions/">http://tex.stackexchange.com/questions/</a></p>
