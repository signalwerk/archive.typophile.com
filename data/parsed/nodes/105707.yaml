    html: |-
      <p>In Word or InDesign just copy and paste the unicode character using a font which supports it: ̑.</p>
      <p>In LaTeX there are multiple ways to achieve this:</p>
      <ul>
      <li> LaTeX has a series of built-in diacritical commands. Leaving the argument empty produces the diacritical mark. For instance, <code>\^{}</code> renders as ˆ. Here is a <a class="freelinking external" href="http://en.wikibooks.org/wiki/LaTeX/Special_Characters#Escaped_codes" rel="nofollow">list of such commands</a>.</li>
      </ul>
      <p>If you use a XeTeX (putting <code>\usepackage{fontspec}</code> in your preamble):</p>
      <ul>
      <li>Type the character directly.</li>
      <li>Type the unicode (hexadecimal) codepoint into the <code>symbol</code> command, with a preceding double apostrophe <code>''</code>. To produce an inverted breve you would type <code>\symbol{''0311}</code>.</li>
      </ul>
    html_clean: |-
