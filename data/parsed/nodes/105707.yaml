      <p>Actually, what you want is a spacing modifier, see<br>
      <a href="http://www.unicode.org/charts/PDF/U02B0.pdf" title="http://www.unicode.org/charts/PDF/U02B0.pdf">http://www.unicode.org/charts/PDF/U02B0.pdf</a><br>
      the one you want is 02C6, MODIFIER LETTER CIRCUMFLEX ACCENT</p>
      <p>Enter it the way you'd enter any Unicode character. There is a difference between the *characters* in spacing modifiers and combining diacriticals, even though they are often the same *glyph* -- a concept sort of at the core of Unicode.</p>
