      <p>In LaTeX, you can use phantom letters: they are not in the text but the text is typeset as if they were there. You can thus put you combining diacritic on a fictitious letter. Here is an example:</p>
      <pre>\documentclass{article}
      \usepackage{polyglossia}
      \setdefaultlanguage{serbian}
      \setmainfont[Script=Cyrillic,Language=Serbian]{Cambria}
      \setlength{\fontdimen2\font}{2\fontdimen2\font}
      \begin{document}

      на првоме слогу и са \phantom{a}\symbol{"0311}\, на другоме.

      \end{document}
      </pre><p>and here is the output:<br>
      <img src="/files/ndiacr_3506.png"><br>
      The <code>\setlength</code> command doubles the interword spacing, so as to look more like your picture; a phantom "a" is used for the combining diacritic and the command <code>\,</code> puts a thin space after because otherwise, it looked ill centered.</p>
