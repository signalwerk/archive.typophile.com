      <p>Yes, I don't know if there is an inverted breve (might also be called "roundcap") in Unicode that isn't ALSO a combining diacritic. </p>
      <p>As has been suggested, easy enough to get one to print -- just use the combining diacritic over, say, a thin space between word spaces, but odd things happen to space characters in some applications, such as EPUB.</p>
      <p>If the mark can be longer, as with a scansion mark, you could use one of those over a word space.</p>
      <p>Not sure why you need it, but things can be found in odd places in Unicode -- like the glottal stops for Guatemalan Mayan in a section generally devoted to Chinese...</p>
      <p>It could be that if you described the need, one of the people more familiar with the Cyrillic alphabets could help. I forget which, but either Brill or Gentium is pretty good with extended Cyrillic characters.</p>
      <p>Otherwise, while most of us are never in favor of using Unicode characters for a purpose outside their intent -- like a combining diacritic for a spacing modifier --  in this case, you have have no choice.</p>
