      <p>I guess it is <code>\smash</code>. Here is a grab from personal notes (which also reminds us that the alignment of "accents" is culture dependent).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/smash_6029.png"></div><p></p>
      <p>Added: I used an explicit kern to fix the l squared. Here is the source<br>
      <code></code></p>
      <p>Let us try with \verb+\vphantom{\othertheta}+ and next with \verb+\rdot+<br>
      \[<br>
      L\ = \frac{ml^{\kern0.05em2}}{2}\left(\dot{\othertheta}^2 + \sin^2\othertheta \cdot \dot{\vphantom{\othertheta}\othervarphi}^2\right) + mgl\,\cos \othertheta<br>
      \]<br>
      \[<br>
      L\ = \frac{ml^{\kern0.05em2}}{2}\big(\rdot{\othertheta}^2 + \sin^2\othertheta \cdot \rdot{\othervarphi}^2\big) + mgl\, \cos \othertheta<br>
      \]<br>
      <br>
      The math font is Fourier <a href="http://www.ctan.org/tex-archive/fonts/fourier-GUT/" title="http://www.ctan.org/tex-archive/fonts/fourier-GUT/">http://www.ctan.org/tex-archive/fonts/fourier-GUT/</a> whose latin letters come from Utopia <a href="http://www.ctan.org/pkg/utopia" title="http://www.ctan.org/pkg/utopia">http://www.ctan.org/pkg/utopia</a>.</p>
