    html: |-
      <p>Samadam (any relation to <em>the</em> Sam Adams?), it was a bit of scripting that Christian and Jared put together... The SMS from your mobile is sent to a Punchcut phone, then the message is transferred (sucked out) via bluetooth to the Mac on the podium. We averaged 1 SMS every 15 seconds.</p>
      <p>My favorite was "...and God created Punchcut!"</p>
      <p>Some others:<br>
      "Punchcut or Punchdrunk?"<br>
      "Turn off the mess it's annoying"<br>
      "Hi mark"<br>
      "Whatever!"<br>
      "I only text in papyrus."<br>
      "They didn't want music downloads either."<br>
      "Sing the Bitstream song."</p>
