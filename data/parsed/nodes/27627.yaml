    <p>Punchcut is presenting a case study on Qualcomm Sans at 4:15PM EST.</p>
    <p>When you send a text message to [number deleted] your message will show up on the screen, set in Qualcomm Sans.</p>
    <p>We call it the Punchcut Heckle Engine™... enjoy.</p>
    <p>(Ahem, I think I have to say that standard text messaging rates apply.)</p>
