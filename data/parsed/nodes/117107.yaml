    html: <p>ttf as well as otf both types of fonts  may contain OpenType features. It is not necessary to change ttf to otf due to Open Type features. If you want to use otf then you should generate the otf files from fontlab not from volt. Then apply the OpenType features to this otf in the volt. When you open a otf file in volt, volt will not show the outlines and instead you will see all glyph cells empty as volt render only ttf outlines not ps outlines. But it will not effect the final shipped font and the final otf shipped from volt will work correctly in all applications. If your original outlines are ps then changing it to ttf will cause a very very little change or you may say distortion in the outlines and in most cases the glyph shaping will not be much affected but you should manually check all the glyph outlines to avoid any glyph shape distortion.</p>
