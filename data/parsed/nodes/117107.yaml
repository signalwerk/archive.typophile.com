      <p>Thank you very much oldnick and Karl Stange<br>
      My workflow was to design the font in Fontlab using PS outlines, generate a TT font, use that in Volt to ship a font with TT outlines and filename TTF. It works fine in all modern applications, but as an Arabic font it has many OpenType features, and an OTF filename seems more true to type (excuse the pun) - so I will change it to OTF.<br>
      Right?</p>
