      <p>According to <a href="http://www.microsoft.com/typography/otspec/otff.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">the OpenType Specification</a>:</p>
      <blockquote><p><strong>Filenames</strong></p>
      <p>OpenType fonts may have the extension .OTF or .TTF, depending on the kind of outlines in the font and the creator's desire for compatibility on systems without native OpenType support.</p>
      <ul><li>In all cases, fonts with only CFF data (no TrueType outlines) always have an .OTF extension.
      </li><li>Fonts containing TrueType outlines may have either .OTF or .TTF, depending on the desire for backward compatibility on older systems or with previous versions of the font. TrueType Collection fonts should have a .TTC extension whether or not the fonts have OpenType layout tables present.
      </li></ul></blockquote>
