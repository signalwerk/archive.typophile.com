    <p>Hi. My fonts where designed in Fontlab, generated as ttf fonts. Those were imported to Volt where open-type features were added.<br>
    After shipping from Volt the file ended up with a ttf file-format name.  Can I manually change the shipped font's name from AlQuds.ttf to AlQuds.otf?  Any advantages or disadvantages?  Thanks</p>
