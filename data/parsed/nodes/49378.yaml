    html: |-
      <p>If you want/need to be subtle, try a font with reversed stroke contrast (where the horizontals are thicker* than the verticals). Greek has this a bit, and it's a main feature of Arabic and Hebrew. Look at the work of Excoffon and Bloemsma for starters.</p>
      <p>* Although preferably not much.</p>
      <p>hhp</p>
