    html: <p>For eastern Mediterranean I take it you want something that not only reflects Greek characteristics, but also something slightly Hebraic and/or Arabic in character, without obviously being a parody of any of those. Something with horizontal or reversed contrast might do the job, like <a class="freelinking external" href="http://www.myfonts.com/fonts/ingrimayne/smokehaus/" rel="nofollow">Smokehaus</a> or <a class="freelinking external" href="http://www.linotype.com/90528/itczipper-family.html" rel="nofollow">Zipper</a>.</p>
