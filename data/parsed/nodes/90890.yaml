      <p>As Hrant said, you'll undoubtedly want someone local (and as I see that you're in London, there ought to be many options), but I can highly recommend a local letterpress shop here in Seattle, Day Moon Press. They've finally got a website, though I don't think it represents them very well as yet:</p>
      <p><a href="http://www.daymoonpress.com/index.html" title="http://www.daymoonpress.com/index.html">http://www.daymoonpress.com/index.html</a></p>
      <p>I've worked with Maura &amp; Jack many times over quite a few years; they are not only skillful but imaginative, finding solutions that use the varying levels of technology to good effect. For anyone in or near Seattle, or for whom geographical proximity doesn't matter, I can't think of anyone I'd recommend more. (And yes, that *is* saying something.)</p>
