      <p>The page you link to lists the design firms.</p>
      <p>Here are a couple letterpress print shops:</p>
      <p>Boxcar Press: boxcarpress.com</p>
      <p>Cranky Pressman: <a href="http://www.crankypressman.com/cranky_pressman/" title="http://www.crankypressman.com/cranky_pressman/">http://www.crankypressman.com/cranky_pressman/</a></p>
      <p>For these places, you are best designing your own graphics or hiring a graphic designer.</p>
      <p>Also google "digital letterpress." Unless you want metal type, of course.</p>
