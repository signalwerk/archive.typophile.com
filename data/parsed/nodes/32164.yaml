    <p>I wonder if we don’t have Unicode-points for symbols, such as most frequently occuring PUBLIC ORIENTATION SIGNS. Last year I forwarded an initial proposal to get some 80 signs in the UCS, yet this takes ages to get along – to what end, nobody knows. (The proposal is downloadable at <a href="http://www.signographie.de/cms/standard.htm" title="http://www.signographie.de/cms/standard.htm">http://www.signographie.de/cms/standard.htm</a> .) – – I think that public signage becomes a kind of “world script” steadily and therefore should be encoded. Both font producers and users alike would benefit from this. The usage of standard-based symbol fonts would be more stable, safer and faster. – – However, as long as the official encoding seems hardly to be achieved I should suggest a workaround: let’s capture the PRIVAT USE AREA and collaborate towards an agreement upon which codepoint should host which sign. A kind of semi-standard might arise by this, if we than offer fonts on grounds of a synchronized encoding. – – Who is working on symbols/fonts and may be willing to contribute to an INITIATIVE to encode public orientation signs? – – suggestions welcome, contributions most welcome!  A:S</p>
