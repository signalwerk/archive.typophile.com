      <p>I’m afraid Si’s right about this one. </p>
      <p>I like the idea of an OT table to manage the design. This would allow each design to be composed of a single glyph, or multiple glyphs, and allow for re-use of componeents. That would allow fonts to be desinged for printing small, for printing large, for vinyl sign machines, etc, where the ideal solutions might vary.</p>
