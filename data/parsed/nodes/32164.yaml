    html: <p>Sorry, but none of the serious players (MS, Adobe, Apple, IBM, Linux, John Hudson etc.,) are going to come within ten miles of a PUA “land-grab” like this, especially considering the grief they’ve been given for their PUA actions in the past. I think efforts would be better directed to a universal symbol description language that might use glyph names or a new OpenType table to define the design of each symbol, then the actual symbols could live anywhere in the PUA.</p>
