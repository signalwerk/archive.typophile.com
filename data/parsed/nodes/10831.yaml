  html: <p>BUFFALO, NY, MARCH 26, 2003 - The Society of Typographic Aficionados (SOTA) has announced speakers and additional details on TypeCon2003. To be held in Minneapolis, Minnesota, USA, July 17-20, 2003, the fifth annual TypeCon will offer hands-on workshops, presentations, and panel discussions featuring some of the most respected and innovative names in typography and design. <br> <br>More than 60 speakers will appear at TypeCon2003, including Jill Bell, Peter Bilak, Leslie Cabarga, Matthew Carter, Mike Cina, Rick Cusick, Joshua Darden, John Downer, Dave Farey, Victor Gaultney, Jemma Gura, Sibylle Hagmann, Allan Haley, Kent Lew, Akira Kobayashi, James Montalbano, Joachim Müller-Lanc</p>
