  html: |-
    <p>The Windows Glyph List 4 have the Unicode ranges “Latin-1” and “Latin extended A” and the characters “latin small letter f with hook”, “latin capital letter ae with acute”, “latin small letter ae with acute”, “latin capital letter o with stroke and acute”, “latin capital letter a with ring above and acute”, “latin small letter a with ring above and acute” and “latin capital letter ae with acute”.</p>
    <p>I have identified that many languages are supported with Latin-1 and Latin extended A, that the f with hook is used as a currency symbol for the Florin, and ome fonts also includes the S and T with comma below for use in Romanian. But I’m not sure if the ae with acute, the slashed o with acute and a with ring and acute have some actual usage currently. I know that keyboards for Sami language can input them, but those don’t use them; and I read somewere that in Danish these were used in dictionaries, but they can’t be input by Danish keyboards, although they may still be used in some way, but I haven’t see it.</p>
