    html: |-
      <p>There seems to be a mis-match between Unicode sorting order (top window) and Glyph order (Illustrator's Glyph panel). In InDesign, you can toggle between the two -- a feature I have used to my advantage.<br>
      Look in the FontLab View menu for an item called "Sort order" (it supports many).</p>
