    <p>Hello,</p>
    <p>I have a little problem with a font I am generating. When I am in fontlab the A glyph is at the right place with the right OT number.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Capture d’écran 2013-04-16 à 23_5156.02.33.jpg"></div><p></p>
    <p>But as soon as I generate it the A glyph moves in my window glyph to the end of the list and when I use the glyph window in Illustrator (or any other soft) the A glyph is not next to the B.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Capture d’écran 2013-04-16 à 22_3793.59.41.jpg"></div><p></p>
    <p>Anyone might knows what I am doing wrong ?</p>
    <p>thanks in advance.</p>
