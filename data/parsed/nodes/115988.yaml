      <p>Turns out this is <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/poetica/?refby=bowfin" rel="nofollow">Adobe Poetica</a>, by Robert Slimbach. It has upright alternates that match this lettering, including the swash M and odd S.</p>
      <p>- Mike Yanega</p>
