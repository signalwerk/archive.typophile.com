    html: "<p>Emigre's Brothers and Council (both designed by John  <br>Downer) are oh, so nice. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/387.gif\" alt=\"brothers.gif\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/388.gif\" alt=\"council.gif\"> <br> <br>But it all depends on what kind of 'country' you're talking  <br>about. I could see this stuff working for old school, back  <br>woods, folk stuff. But I couldn't see it working for the  <br>likes of Garth, what's-his-name, Brooks. <br> <br>(Confession: I'm not a country fan.) <br> <br>//joe</p>"
