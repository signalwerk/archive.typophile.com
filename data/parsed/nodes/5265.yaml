    html: "<p>Jimmy, <br> <br>When I think country I think Clarendon slabs...  <br> <br>Try Font Bureau's fat Giza or Belizio: <br><a href=\"http://www.fontbureau.com/specimens/giza.html\" target=\"_top\">http://www.fontbureau.com/specimens/giza.html</a> <br><a href=\"http://www.fontbureau.com/specimens/belizio.html\" target=\"_top\">http://www.fontbureau.com/specimens/belizio.html</a> <br> <br>For a quirky feel have a look at PsyOps' Oxtail <br>or Fountain's Barbera. <br><a href=\"http://www.psyops.com/html/specimens.html\" target=\"_top\">http://www.psyops.com/html/specimens.html</a> <br><a href=\"http://www.fountain.nu/\" target=\"_top\">http://www.fountain.nu/</a> <br> <br>If you want to get old-school western funky with  <br>shadowed wood type there are some great options... <br> <br>ITC's Magnifico: <a href=\"http://www.itcfonts.com/fonts/product.asp?sid=MD5LPQ3TBACA9N1GNAKR5NJEFV3A5M42&amp;st=KEYWORD\" target=\"_top\">http://www.itcfonts.com/fonts/product.asp?sid=MD5LPQ3TBACA9N1GNAKR5NJEFV3A5M42&amp;st=KEYWORD</a> <br> <br>Bitstream's Vineta: <br><a href=\"http://www.myfonts.com/FontFamily192.html\" target=\"_top\">http://www.myfonts.com/FontFamily192.html</a> <br> <br>Decorated 035: <br><a href=\"http://www.myfonts.com/FontFamily210.html\" target=\"_top\">http://www.myfonts.com/FontFamily210.html</a> <br> <br>and for free, Ray Larabie's Bullpen: <br><a href=\"http://www.larabiefonts.com/fonts/b2.html\" target=\"_top\">http://www.larabiefonts.com/fonts/b2.html</a> <br> <br>Stephen</p>"
