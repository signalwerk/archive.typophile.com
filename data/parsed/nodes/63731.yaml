    <p>I've loved typography for a while.  When a company recently approached me about creating some artwork for them, I felt it was time to dive in and try my hand at it. With the job completed and submitted, and the client happy, I garnered permission to post it up for critique, and I would really like to hear what some of the more experienced out there feel about the piece.</p>
    <p>The piece is called "Inspiration", and took me about 57 hours to complete and is over 50 layers in photoshop.</p>
    <p><a class="freelinking external" href="http://i188.photobucket.com/albums/z6/Cutless1/Inspiration.png" rel="nofollow">Click Here To Download Inspiration (1920x1200)</a></p>
