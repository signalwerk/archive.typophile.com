      <p>Scotch Roman certainly is evocative of 1897. It does have the downside of being, at least in some forms, unattractive to modern readers, particularly in the forms used in the late nineteenth century. (On the other hand, books from 1805 or thereabouts also tend to be set in Scotch Roman, but in typefaces from that group which generally are attractive in appearance to modern taste. But that isn't terribly relevant.)</p>
      <p>The book "The Annotated Dracula" reproduces an early publication of the novel, as well as providing useful background information.</p>
      <p>The question that needs to be asked, though, is the kind of book you're aiming at producing.</p>
      <p>A mass-market paperback intended to be read for entertainment would be set in one of the conventional reading faces of today - Times Roman, Century Expanded, or Caledonia.</p>
      <p>A book aimed at being decorative in appearance would be set in something that looked pretty, fairly independently of considerations of authenticity. Here, we're talking about faces like Centaur, Kennerley, Jenson Oldstyle, Cloister Lightface.</p>
      <p>In between the above two categories, there are faces like Baskerville, Garamond, Bembo, Plantin, and Palatino, for example; these are nice looking typefaces used for ordinary books rather than fancy private press ones.</p>
      <p>Here</p>
      <p><a class="freelinking external" href="http://regi.sk-szeged.hu/statikus_html/kiallitas/buchkultur/chron2.html" rel="nofollow">http://regi.sk-szeged.hu/statikus_html/kiallitas/buchkultur/chron2.html</a></p>
      <p>is a page from the Chronica Hungarorum, the first book printed in Hungary.</p>
      <p>As for the first book printed in Romania, a coin commemorates its 500th anniversary, but I haven't found images of any pages from the Litourgicon of Macarie.</p>
