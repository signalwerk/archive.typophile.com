      <p>School projects certainly are different from commercial projects. My main goal is to design a book that's decently impressive and that stands up to close examination without breaking any major rules. I don't have the restriction of a mass market paperback audience (no Times for me!), but I'm not sure I want to attempt an overly decorative setting, as I haven't even set a <em>normal</em> book yet.</p>
      <p>Speaking of <em>diamond tittle</em> I found <a class="freelinking external" href="http://www.type-together.com/Maiola" rel="nofollow">Maiola</a>, an eastern European typeface. To me, it seems that the calligraphic and humanist elements could connote the correct time period to a modern audience. Thoughts?</p>
      <p>Plus, Typetogether has a handsome 25% discount for students.</p>
      <p>Regarding a more English feel, there's always Baskerville (which I do own thanks to Apple or Adobe, but I'm not sure which version I have or how well it suits book setting). It feels properly old to untrained eyes.</p>
      <p>Typetogether also has <a class="freelinking external" href="http://www.type-together.com/Athelas" rel="nofollow">Athelas</a> (one I also already own), which they say is "inspired in Britain's literary classics". Not sure it feels as English or as old as Baskerville.</p>
      <p><em>Edit: the link to Maiola didn't work.</em></p>
