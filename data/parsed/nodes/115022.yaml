    html: |-
      <blockquote><p>the existence of faces like Times Ten, Cycles, and even Adobe Caslon</p></blockquote>
      <p>I find these thin and anemic. Cycles is a particularly interesting and tragic case. I believe Sumner had homage to Jack Stauffacher in mind with Cycles, maybe Staufffacher even participated a little in it's design. Before "application files to the printer"  became the norm (no repro from the typesetter), Cycles worked pretty good. I used it a fair bit when I designed books, and even bought a license for a customer who (perpetually) claimed their font budget was empty. </p>
      <p>When the direct-to-plate process became the norm, it was just too light, period -- at least for bookwork printed offset, it's primary purpose. Worse, by that time, Sumner had created several sizes, so the work involved in beefing it up for the new platemaking technologies would have been enormous. Still, I would have done it, had (interior) designers been willing to specify it.  But they wouldn't, most kept pursuing the silly quest for the magic typeface that would win them design awards.</p>
      <p>^ ^ ^</p>
      <p>I must be one of the few people who likes Times Roman. I don't like Times Ten, but the Linotype Times was pretty good in Photocomp. Look at the details of lower-case s for an example in the different thinking. Again, it was never adjusted for direct-to-plate printing, and again, there was no point in working on it, because no contemporary designer would specify it. Would have been wasted hours</p>
      <p>Finally, you should take a look at just how ink spread with various letterpress printing. Partly a trick question. Ink spread was (1) not linear, and (2) varied with the papers used. I've seen Linotype Granjon printed letterpress that looked as thin as most modern revivals; this printed from the original metal, not stereo plates or pulled repro, using a hard, calendered sheet. </p>
      <p>I've at least touched on all this -- with a few examples -- in a chapter in Rich Hendel's <cite>Aspects of Contemporary Book Design</cite>. But that's really aimed at the interested-but-uninformed reader, people like book editors. Probably not worth the price for most people who inhabit Typophile.</p>
