      <blockquote><p>It looked like a typeface I would have expected from that period - Phemister's Old Style</p></blockquote>
      <p>Is there any digital version of Phemister's type that you would recommend? Looking at the various Bookman faces available online, very few seem as mature as I would like for <em>Dracula</em>. That's my impression, anyway. </p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/" rel="nofollow">Bookmania</a> might work I suppose, but does it err on the 1960's side of Bookman?</p>
      <p>I've revisited <a class="freelinking external" href="http://www.type-together.com/Maiola" rel="nofollow">Maiola</a> several times, and it's definitely a typeface I am strongly considering. It's on the top edge of my budget (after student discount, roughly $100 for roman and italic), but I like it every time I look at it.</p>
      <p>Finally, <a class="freelinking external" href="http://www.linotype.com/1237/minister-family.html" rel="nofollow">Minister</a> may not be my most mature suggestion, but it does have a dark and sinister quality that is kind of fun... Mock me if you must, but is it inappropriate for an extended text?</p>
