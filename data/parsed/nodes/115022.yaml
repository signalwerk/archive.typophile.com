      <p>Hmm. By the way, you're designing the book. Usually typesetters just execute what the designer specifies. The trick is to be a designer rather than a stylist. (Hint: <cite>stylists</cite> were the guys that put tailfins on all the 1950s-60s era cars. Though they <cite>called</cite> themselves designers, true enough...)</p>
      <p>Here's the conundrum. Isn't it more appropriate to use a font that a general modern audience sees as timely, rather than one which was actually used? Take a look at the title page from the first edition of Jane Austen's <cite>Pride and Prejudice</cite>...</p>
      <p><a href="http://upload.wikimedia.org/wikipedia/commons/1/17/PrideAndPrejudiceTitlePage.jpg" title="http://upload.wikimedia.org/wikipedia/commons/1/17/PrideAndPrejudiceTitlePage.jpg">http://upload.wikimedia.org/wikipedia/commons/1/17/PrideAndPrejudiceTitl...</a></p>
      <p><cite>Edit:</cite> </p>
      <p>Another story: I once had to set a book about the Lakota (proper name for one of the "Sioux" Indian tribes) in Goudy Sans, because the designer didn't want to use a typeface that looked "European" or "American." Noble thought, I suppose, but since the only written form of the Lakota language uses the Latin alphabet, forlorn. I thought Goudy Sans a singularly poor choice. Consider that, if you can't find a "Romanian" typeface. (And remember, even if you could, she/he probably would have been schooled at Reading...).</p>
