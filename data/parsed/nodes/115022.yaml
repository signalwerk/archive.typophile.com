    <p>For a school project, I’m typesetting my first book. I’ve read numerous Typophile threads on choosing a book typeface and consulted Bringhurst, but I’m buckling down to ask for some more specific advice.</p>
    <p><em>Historical considerations:</em><br>
    Maybe this is a little “purist” for my first book, but I think that historical considerations for type warrant at least some consideration. Here is a summary of my admittedly haphazard research:</p>
    <ol>
    <li>Bram Stoker is Irish</li>
    <li>Dracula was published in 1897</li>
    <li>Vlad the Impaler was a 15th century Romanian Prince and inspiration for Count Dracula</li>
    <li>It seems as though Scotch Roman type was a common text face for the time it was published (at least in America?)</li>
    <li>The book takes place in England and Romania</li>
    <li>Even if it was appropriate to use, and I'm not sure that it is, there isn’t really much (if any) Romanian type from that time</li>
    </ol>
    <p><em>Questions:</em><br>
    Am I right in thinking that Scotch Roman type would be appropriate? If not, I'd love to hear a better suggestion.<br>
    Is it too far of a stretch (as I suppose) to appeal to the 15th century type to evoke the centuries old character of Dracula?</p>
    <p>Being a student, financial considerations are in order... but I’d be willing to purchase a reasonably priced roman and italic text face if the right one came along. Here are some I’ve found:</p>
    <ol>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/okay-type/harriet/" rel="nofollow">Harriet</a></li>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/miller/" rel="nofollow">Miller</a></li>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/mti/bulmer-mt/" rel="nofollow">Bulmer</a> – not necessarily Scotch Roman, but still on the modern side</li>
    </ol>
    <p>Thanks!</p>
