      <p>I take a digital press to be fast, large laser printers, as are used for short-run book production -- &lt; 500 copies, or for on-demand printing. I never kept up with the polymer plates after Stephen Steinour quit on them, so I don't know what they're capable of today.</p>
      <p>Even though I flat can't read at all without glasses anymore, I believe I can see the difference between a page printed offset and one a "digital press," without wearing glasses, at 3-foot viewing distance, with a 10-second examination. Just look at the color of the type and the regularity of the letterfit. (Edit: I just checked. Now, I have to wear glasses to see the difference. As a child of 60, I didn't.)</p>
      <p>Put it this way, I can't do final kerning based on laser printouts from the machine at the office, and I don't see any improvement with the "digital presses." It is probably heretical, but I think they're capable of better work with images than with type -- properly maintained, of course. And it is hard for them to hold an ICC profile as they heat up, which does change the black and midrange points. Still...</p>
