      <p><cite>Any typefaces that in particular that you think are now fair game?</cite></p>
      <p>I'm sure there are some, but as our work is for publishers who (almost) always print offset, I don't have any experience with just which thin, anemic revivals look passable on a digital press. </p>
      <p>The point I hope I've made is that these days, with the (1) multiple and (2) different from historical ways of printing, you have to see the type in use to evaluate it.</p>
      <p>What you see praised in classical books on type -- written before, say, 1960, likely won't look that way in 2015. And what worked before DTP (circa 2000), may well not work now. <strong>Letterforms</strong> per se. are not the biggest issue anymore.</p>
