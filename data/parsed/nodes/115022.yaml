      <p>Of course there are small caps in Skolar. In the full version I have, I believe even in polytonic Greek and Cyrillic. If you have any questions, get up with David  Březina at Rosetta.</p>
      <p>Buy direct, not through MyFonts.</p>
      <p><a href="http://www.rosettatype.com/" title="http://www.rosettatype.com/">http://www.rosettatype.com/</a></p>
      <p>One thing to add: If you're having a book printed "via a digital press," that essentially means laser xerography, and you'll usually find that type is not so thin  -- or accurate -- with that printing method as with 2,400 dpi offset. And that reopens the door for some of the old metal faces.</p>
      <p>Be aware that type weight from laser printers can vary considerably. Maintenance of those machines can vary considerably, too. A publisher we work for recently had a job run on one of them, and after a test file, asked us to red0 the images, as the black point was too high, and the blacks were also streaky. As indeed they were, but we pointed out that was the same with the large, black display type on the title page. And no, the type wasn't screened. Color management was not the problem with the images, crappy machine maintenance was.</p>
      <p>Get some samples. You should be able to see them for free, from the (hopeful) printer. Knowing your materials and how they will act in the environment you're using them is a huge part of being successful.</p>
