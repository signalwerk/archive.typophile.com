      <p>Taking a look at some of the designs mentioned, I saw that Skolar seems to me to be similar to a great many 21st-century typefaces, including not a few on Google Fonts; whatever the original of that sort of typeface is, it has been widely copied.</p>
      <p>But it doesn't look anything like Trinité; I guess they're just both good faces.</p>
      <p>Trinité reminds me a bit of Palatino, another very successful face. In trying to find out about the inspiration for Trinité, though, to determine if similar faces were more inexpensively available, I found that it was designed as an alternative to converting the typeface Romanée by noted type designer Jan van Krimpen to the phototypesetter.</p>
      <p>The reason for designing a new typeface instead was that Romanée, like most other typefaces in hot metal, was subtly varied for each point size. Today, of course, some typefaces come in different forms suggested for use at different point sizes (examples range from Times Ten to Cycles) and so Romanée ought to be digitized someday.</p>
      <p>However, while Trinité reminded me of Palatino, Romanée reminds me of Caledonia. They don't seem to be that similar to one another. Which fact is in no way a criticism of <strong>Bram</strong> de Does (another reason for that face being appropriate to an edition of <em>Dracula</em>!) but it doesn't help me in finding the roots of that letterform.</p>
      <p>After some more looking, I can't find anything that strongly resembles Trinité. However, I did run across <a class="freelinking external" href="http://www.identifont.com/find?font=Maiola&amp;q=Go" rel="nofollow">Maiola</a>, which also won some awards and which looks quite nice.</p>
