      <p>You may be over-thinking, but you instinct is correct. You job as a designer is to present an author to an audience. If you want, for example, to make a statement on the Turkish policy of allowing no language but modern Turkish -- write an article or a book of your own, criticizing that policy. If it's worth doing, do so in a straightforward way. If such ideas are a part of the text you're designing, you can, in the small ways open to designers, aid the author's position in your design. But if they are not, and you can't abide that, decline the job.</p>
      <p>There may also be a difference in perspective between a school assignment and professional work. Usually professional work involves doing your best to aid sales. It at least involves the medical notion of "do no harm" -- and in these cases, that would usually be "harm" to a commercial endeavor. </p>
      <p>While it doesn't come up often, most of us have, as professionals, turned down work rather than compromise the twin commitments to ourselves and our clients -- though <cite>Dracula</cite> likely presents no such dilemma...</p>
