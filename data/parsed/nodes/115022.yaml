      <p>&gt;Are you planning to set this book using metal?</p>
      <p>If only! I'm currently a simple graphic design student with a fairly extreme interest in type that's quickly becoming a passion. For my graphic design class, we get to choose our final project – hence this project. Given the format, I think Dracula will pose some interesting typographical challenges without being too lofty a goal.</p>
      <p>I know this isn't optimal, but I ultimately want to get this printed as a piece for my portfolio show next semester – short run for sure, so <em>undoubtedly</em> printed via digital press. I'm not sure how much control I'll have over paper, so I'm not counting on something terribly nice... like I said, not optimal, but I really want to get a start on designing a book for once.</p>
      <p>&gt;<em>Miller</em> – That was my gently researched opinion, resulting in this thread. I printed a (low res) PDF specimen of Nick Shinn's <em>Scotch Modern</em> ($$$), and I think it's one of the few that does have that edge.</p>
      <p>&gt;<em>Trinité</em> – It's gorgeous. I discovered that one earlier on in my research. Fortunately/unfortunately type really <em>is</em> worth top dollar.</p>
      <p>&gt;<em>Skolar</em> – I like it, and it hints on the edgy quality for sure (not settled on it, but I'll keep it in mind). It's a shame there's no small caps.</p>
      <p>If I'm honest, I'm glad you're getting drawn in on this project. You've been a tremendous help!</p>
