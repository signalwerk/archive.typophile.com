      <p>In passing, are you planning to set this book using metal? A number of the fonts mentioned in this thread look good in specimen books -- as long as those specimen books are samples of letterpress.</p>
      <p>If your school exercise in "typesetting" is to have printing as an end  result, go to the library -- or bookstore -- and look at books printed after 2000. There are typefaces that look good with the newer platemaking technology, but far fewer than you might imagine. Miller is one of those, a favorite font of a late Typophile contributor, Will Powers. Go down to his name in this thread</p>
      <p><a href="http://typophile.com/node/45205" title="http://typophile.com/node/45205">http://typophile.com/node/45205</a></p>
      <p>Will was a genuine union-level Journeyman pressman -- one step down from master printer in the old school tradition, working some at the Steinhour Press (but I think not a journeyman there) &amp; elsewhere before becoming a book designer. He had a good grasp of ink on paper, always the final result by which a book is judged.</p>
      <p>^ ^ ^</p>
      <p>For a completely  different approach to the choice of typeface, you might consider that few of the Scotch Romans have what I'd call an "edgy" quality, yet the Dracula tale does. You could key on that rather than historical period.</p>
