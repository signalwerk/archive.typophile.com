      <p>@Charles Ellertson:<br>
      <cite>I don't have any experience with just which thin, anemic revivals look passable on a digital press.</cite></p>
      <p>Good one!</p>
      <p>A lot of digital revivals are thin and anemic.</p>
      <p>I've felt that even modern hot metal Caslons are thin and anemic, because to me old documents printed in Caslon looked attractive when there was a significant ink spread. The first printed version of the Declaration of Independence is an example of what I think it takes to make Caslon look right as a face for normal body text.</p>
      <p>Aside from ink spread, the next major reason for digital revivals being thin and anemic is because they're often designed after, say, the 48 point version of the typeface in question, if a good specimen is available - when, of course, typefaces historically have been made wider and bolder in the smaller point sizes, whether in the punchcutting era or the pantograph era, and in most cases typefaces are most often used in sizes around 11 points or so.</p>
      <p>However, just because a lot of digital revivals <em>have been</em> thin and anemic does not in any way mean that a digital revival must necessarily be thin and anemic. If you know better, you can do better. So, while I'm sure there will be a lot more thin and anemic digital revivals in future, the existence of faces like Times Ten, Cycles, and even Adobe Caslon shows that occasionally this particular fault can and will be avoided (yes, Adobe Caslon fails in some other respects, related to authenticity - but it isn't thin and anemic).</p>
