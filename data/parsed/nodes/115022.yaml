      <p>The original edition of Dracula was published in 1897, but not by W. R. Caldwell; rather, it was published by Archibald Constable &amp; Company. I've seen one image purporting to be a page from that edition on a hotel's web site; it looked like a typeface I would have expected from that period - Phemister's Old Style.</p>
      <p>(In searches relating to this, I found that the American Drawing Book by John Gadsby Chapman probably was responsible for the plaint "I can't even draw a straight line" later employed in art school advertising as representing a misconception.)</p>
      <p>I've since confirmed, by finding an Ebay listing for the first edition, that it was what was pictured here -</p>
      <p><a class="freelinking external" href="http://www.bradfordmidlandhotel.com/famous-guests-bram-stoker" rel="nofollow">http://www.bradfordmidlandhotel.com/famous-guests-bram-stoker</a></p>
      <p>the picture, even after clicking on it for an enlarged version, is too small for me to be completely sure of the typeface, though it strongly seems to be Phemister.</p>
