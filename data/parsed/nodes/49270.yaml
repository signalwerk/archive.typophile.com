    <p>We are proud to announce an exclusive release of the typeface, Augustus. This typeface was designed by our friend, Karl Frankowski from Minneapolis and was 5 years in the making. I will let the images do the talking for itself.</p>
    <p>More info here: <a href="http://www.youworkforthem.com/product.php?sku=T0195" title="http://www.youworkforthem.com/product.php?sku=T0195">http://www.youworkforthem.com/product.php?sku=T0195</a></p>
