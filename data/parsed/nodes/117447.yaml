    <p>This is probably stupidly easy, but I've been trying to identify this font so that I can purchase it and I'm really struggling because I know next to nothing about typography! From my own searching and peering, it looks like Optima Bold, but without the swelling(?) at the terminals.</p>
    <p>Anyway, if someone could be kind enough to point me in the right direction it would be greatly appreciated.</p>
