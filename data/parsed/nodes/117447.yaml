      <p>There have been 'versions' of Optima, such as Image Club's Omni (sample attached), which did not use the slight flaring of the terminals. I suspect that was an easier way to re-create a font that had much of the same feel, without exactly copying the font. Your sample may be one of those Optima look-alikes.</p>
      <p>- Mike Yanega</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OmniSample_5608.gif"></div><p></p>
