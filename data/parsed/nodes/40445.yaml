      <p>I have read only "Fonts and Logos," which I also own. It's one of the books I've learned most from about type. </p>
      <p>As to adjusting letter pairs in text type: It is a good idea, but the problem for a font, as opposed to a logo, is that there is no end to it. So it is hard to know where to start and stop, beyond using open type to rectify 'f' problems, such as has been discussed recently in another thread.</p>
      <p>The lesson I took away from Young for text type is the importance of getting the letter forms themselves right, so that they color well in context of all--well almost all!--the other letters.</p>
