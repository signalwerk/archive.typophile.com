      <p>&gt;Supposing that I could show you a list of say 16 situations and offer a compelling justification for making a contextual alternative for each one. Would you consider implementing it?</p>
      <p>Some fonts don't even require f ligatures, so I think I think that the benefit of contextual alternatives would depend on the style of the font. In general, I think lower case to lower case should require relatively little kerning, if the letters are well designed. Also I favor a style with slightly looser letter spacing than in many fonts, so again that reduces the likely benefit of contextual alternatives in the lower case. </p>
      <p>For other cases, where it will make a difference, I'm yet to be convinced that it will make a big enough difference in text to undertake the initiative and put in the work, aside from the 'f' issues. But I'm willing to be persuaded by examples you or others may post.</p>
