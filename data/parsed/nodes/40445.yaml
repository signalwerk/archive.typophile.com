      <p><cite> I work for a company with two cap As in the name. </cite> </p>
      <p>Depending on the font chosen that might be okay... But I am guessing Doyald would make an AA ligature.</p>
      <p>Bill, you are I think, spot on where Doyald's sense is as far as fonts and special cases. But then there was no Open type when he wrote these books. It's time to question the tradition. Maybe it will hold up. Maybe it won't. But Doyald insights do ( I think ) show us some opportunities for where we might begin that questioning process. </p>
      <p>Also, based on my own experiments so far, the list of combinations that we might consider seriously isn't infinite. It's somewhat daunting, but by no means undoable. And it offers yet another chance to increase quality by letting the eye settle things. Supposing that I could show you a list of say 16 situations and offer a compelling justification for making a contextual alternative for each one. Would you consider implementing it? If this were the case, it would be a smaller job than doing even a single optical size. No?</p>
