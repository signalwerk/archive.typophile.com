  html: '<p>This font I have started as display/logo font for a local American football team. Its inspired by "Aachen", "Princeton" and "City BQ". <br> <br>Now I totally redesign the font and add many features like:  <br> <br>Ligatures <br>Alternates <br>Small Caps <br>Old Style Numerals <br> <br>The hardest thing is to kern this font. So Opentype is the only format to handle this massive kerning tables. InDesigns "autokerning" engine - cant handle these faces in a good way - so I have to do all by hand. <br> <br>Is is the first face "ThunderBold" of a family. <br> <br><!---Attachment: cray1.swf-!--></p><center><table border="1"><tbody><tr><td><img src="http://www.typophile.com/forums/icons/mime_gif.gif" align="LEFT" alt="application/x-shockwave-flash">cray1.swf<br><a href="http://www.typophile.com/forums/messages/29/cray1.swf"><b>cray1.swf</b></a> (69 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>'
  html_clean: '<p>This font I have started as display/logo font for a local American football team. Its inspired by "Aachen", "Princeton" and "City BQ". <br> <br>Now I totally redesign the font and add many features like:  <br> <br>Ligatures <br>Alternates <br>Small Caps <br>Old Style Numerals <br> <br>The hardest thing is to kern this font. So Opentype is the only format to handle this massive kerning tables. InDesigns "autokerning" engine - cant handle these faces in a good way - so I have to do all by hand. <br> <br>Is is the first face "ThunderBold" of a family. <br> <br><!---Attachment: cray1.swf-!--></p><center><table border="1"><tbody><tr><td><img src="http://www.typophile.com/forums/icons/mime_gif.gif" align="LEFT" alt="application/x-shockwave-flash">cray1.swf<br><a href="http://www.typophile.com/forums/messages/29/cray1.swf" class="link-lost"><b>cray1.swf</b></a> (69 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>'
