  html: |-
    <p>Just like there are different kinds of sans (humanist, geometric, neo-grotesque) and serifs (Garalde, Didone, etc.) are there different kinds of scripts? I know the answer is yes, but I would like to hear what some broad categories would be labeled as (“Brush”, “Calligraphic”, etc.) as, clearly, there are worlds in between something like Mistral and Snell Roundhand.</p>
    <p>Maybe a classification already exists?</p>
