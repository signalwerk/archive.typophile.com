      <p>And here I thought this was one question so simple that although I'm not one of the real experts around here, I could still answer it correctly!</p>
      <p>Quick checking shows that my memory indeed appears to be wrong; De Aetna is from 1495, Hypnerotomachia Poliphili from 1499.</p>
      <p>An Atlas of Typeforms describes the development of the Aldine types this way: First, there was a typeface in which the lowercase resembled Jenson, but the uppercase was made less clashing. Then Griffo recut the lowercase - the result being the De Aetna type. And then the uppercase was changed again, leading to the type of the Hypnerotomachia.</p>
      <p>And, in between, a smaller type size was cut, in a slightly different style, for <em>De Epidemia</em>.</p>
