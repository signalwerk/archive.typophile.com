      <p>The answer is "No"...and here's why I say that.</p>
      <p>Calligraphy comes from the greek word Kaligraphia, from the root words kallos and graphein. It can be literally translated as "beauty in writing".</p>
      <p>Typography, also, comes from greek...from the root words typos and grapheia. It can be literally translated as "figure writing". However, this doesn't really give the whole effect, since the greek word typos also connotates a dent or impression made by striking one figure against another. It is appropriate for the concept of a printing press, where each glyph would strike the paper, not only leaving ink, but a minute indention into the paper.</p>
      <p>Calligraphy does not follow any of the aforementioned traits of typography. Calligraphy, furthermore, is not required to concern itself with readability, consistency or reproduction. Typography, however, must take such things into consideration. Calligraphy is inconsistent in presentation and usage. Typography must be consistent. </p>
      <p>Elements of calligraphy can certainly be incorporated into typography, especially when talking about the aesthetics of glyphs.</p>
    html_clean: |-
