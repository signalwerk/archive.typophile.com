      <p>Bill, I wonder how rare it really is.<br>
      I wouldn't put myself in the same class as Zapf, but I've done a bit of calligraphy.<br>
      Other type designers with calligraphy skills: Vasilyeva, Veljovich, Lester, Slimbach, Shaw.<br>
      Note that these are not "lettering artists who make script fonts", which would be more the Michael Clark métier.<br>
      I don't believe these categories (designer/calligrapher) are particularly precise or indicative of type, typography or layout quality, it's more a question of which direction you're coming from, and where your interests and aptitudes lie.<br>
      Others?</p>
      <p>Surprisingly, Ale Paul is not AFAIK a calligrapher (although collaborator Angel Koziupa is)—which goes to show that as with most aspects of design, it's results that count, not how you get there.</p>
