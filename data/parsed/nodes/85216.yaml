      <p>Well, definitions are somewhat arbitrary, but as far as skills, there is a definite divide between writing and built up letters, whether on paper or in a font development program. Writing means the hand in motion with a tool, leaving a mark in a stroke. When you build up letters, main skill is in the eye, rather than the hand. </p>
      <p>In beautiful writing, it's both the eye and the hand. And as John Hudson has pointed out, it's really misleading to call what scribes did "calligraphy" as their top priority was not to be beautiful in an ornamental way, but to be readable. This is something like the distinction between text and display type. I read recently, for example, that even in the days of the scribes, a different person from the scribe who did the text would do decorative built-up initial letters and illumination for a book. </p>
      <p>There are now folks who do both built up letters and written letters for emotionally evocative display, as well as occasional display fonts. But it's more unusual for that person who does hand done custom display to also do text type. And if they do undertake it, they are aware that it involves different challenges. So I would say that functionally the more important distinctions are between writing and built up letters, and between text and display. </p>
      <p>And of course there is a lot of overlap because the practiced and artistic eye is involved in all of them. But to master all of them is very rare, with Hermann Zapf being a rare example who is a master of all aspects.</p>
    html_clean: |-
