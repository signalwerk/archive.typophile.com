      <p>The revival of the original foundry Caslon in 1844 was in The Diary of Lady Willoughby. If you have access to the Gentleman's Magazine in the 18th Century that was also in Caslon. The Declaration of Independence was originally printed in Caslon, but some characters have been replaced. Most anything published in England in the middle 18th century will be in Caslon. The easiest thing to get hold of might be the specimen book of 1766 reprinted in Facsimile in the 1980 journal Printing History, with notes by James Mosley. </p>
      <p>Of course anything early in the original letter pressed foundry type will give you the real thing, and nothing else is quite the same. That being said, the Mosley book is really good.</p>
