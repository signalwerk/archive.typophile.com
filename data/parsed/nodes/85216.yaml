    html: <p>I consider calligraphy a particular application of a manual skill in writing targeted at formal and expressive beauty (as such, it is a sub-category of chirography or, simply, 'writing'). I am not a calligrapher, although I understand a lot about writing and occasionally make use of the same tools as part of a design process, because I do not possess the manual skills required. I'm a type designer, which means that I sometimes apply the same conceptual and aesthetic considerations in my work as a calligrapher does -- and sometimes different conceptual and aesthetic considerations --, but what I am making is a different kind of product, and I make it with a different set of skills.</p>
