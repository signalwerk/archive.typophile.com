  html: |-
    <p>Hello all—</p>
    <p>I'm attempting to apply templates that I downloaded from thegridsystem.org  I didn't realize how temperamental it was going to be with me!</p>
    <p>The documents, found here <a href="http://www.thegridsystem.org/categories/templates/" title="http://www.thegridsystem.org/categories/templates/">http://www.thegridsystem.org/categories/templates/</a> , are straightforward enough; they consist of grids and guidelines. The problem is applying that single page in the InDesign file to the entire document. If I create new pages, with some templates, nothing is replicated from the original. In other templates, only certain elements are replicated. For example: for the 6 column, 8.5x11, the baseline and vertical column guides duplicate themselves, but the horizontal guides do not. </p>
    <p>What's up? Is there a step I'm missing in the application of templates?</p>
