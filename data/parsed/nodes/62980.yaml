    html: <p>I think you have to apply the templates and guides to the 'master' pages. Then when you make a new page, you can base it off of a master. You can control this stuff in the Pages palette. You may have to fiddle with the options and stuff (like make a guideline 'global') to get the guidelines to be visible on all of the pages.</p>
