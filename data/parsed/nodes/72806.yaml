    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ciseaux_typodarium_7_3740.jpg"></div><p></p>
    <p>One of my Fonts <strong> <a class="freelinking external" href="http://new.myfonts.com/fonts/harald-geisler/ciseaux-matisse/" rel="nofollow">Ciseaux Matisse</a> </strong>got featured in a little Type Calendar called Typodarium 2011. </p>
    <p>Typodarium is published by Verlag Hermann Schmidt Mainz (about 10.000 copies). Format: 8,5 x 12 cm, 368 pages.</p>
    <p>More information about Ciseaux Matisse you can find here on my <a class="freelinking external" href="http://typophile.com/node/70451" rel="nofollow">Typophile Blog</a> or buy the Font on <a class="freelinking external" href="http://new.myfonts.com/fonts/harald-geisler/ciseaux-matisse/" rel="nofollow">MyFonts: http//new.myfonts.com/fonts/harald-geisler/ciseaux-matisse/</a></p>
    <p>Infromation about the Typodarium can be found here: <a href="http://Typodarium.de" title="http://Typodarium.de">http://Typodarium.de</a></p>
