    <p>How come nobody ever talks about Blackletter? It is absolutely everywhere. Advertisers are using it like it is going out of style and clothing designers are using Blackletters as if they are logos. </p>
    <p>I asked Armin at Under Consideration if he should revisit a blog he did in April on the poularity of Blackletter. He responded by saying, “Blackletter is at its peak on mainstream, it can, sadly, only go downhill from here. It became too trendy for its own good.”</p>
    <p>How can a typeface that is over 500 years old be considered going downhill?!!</p>
    <p>Why is Blackletter so popular right now? Where did this stronghold on popular culture come from? And don’t tell me that the Germans are the influence.</p>
