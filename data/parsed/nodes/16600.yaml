      <p>Yeah, Chris is right. I actually think that we talk about blackletter quite a lot. I know that blackletter is all over the place now, but I don't think its a new fad… I think that fad has been running more or less pretty strong since about 1991. You might as well go and ask Miles Newlyn why he drew Savage Black… maybe the "trend" is even older… Didn't Licko start Totally Gothic is in 1988?</p>
      <p>Whatever the cause for the blackletter fad is, it certainly is *not* the Germans. German designers won't touch the stuff with a ten-foot pole. This is US driven, primarily, although the stuff can be seen all over North, Central, and South America, plus the UK and some of continental Europe.</p>
