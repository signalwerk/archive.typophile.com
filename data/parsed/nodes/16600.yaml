      <p>I saw an interview on MuchMusic (Canada's MTV) about 10 years ago, I think it was with a metal band from Sao Paulo. Anyway, the guy said Blackletter was like Europe's ethnic thing, now that the Latin had become globalized.</p>
      <p>That's the same way the Siberian (?) throat singer who did "Levee breaks" said that Led Zeppelin was, from his perspective, world music. Or Memphis Minnie at least.</p>
      <p>So blackletter is historic, ethnic, gothic (in every sense).</p>
      <p>The present vogue is not necessarily nasty gangsta/satanic/ethnic/historicist though, a lot of it is pure formality, to do with the fabulous flourishes. Go Marian! (Same vibe as Spencerian flourishing.)</p>
      <p>It's such a rich vein, capable of holding so many meanings.</p>
