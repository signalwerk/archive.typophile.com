      <p><em>How can a typeface that is over 500 years old be considered going downhill?!!</em></p>
      <p><a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> is not a "typeface," but a whole family of scripts. Some styles are more popular than others, with the <a href="/wiki/textura" class="freelinking" rel="nofollow">textura</a> variety being the forerunner and maybe <a href="/wiki/fraktur" class="freelinking" rel="nofollow">fraktur</a> coming in at second place, but a lot of blackletter is still fairly obscure, imo.</p>
      <p>Maybe blackletter is so popular now for the same reason that other scripts are: i think it's a backlash against the "techno" style: whereas evertything used to be cool if it were futuristic and seemingly made by machine, people now want to be able to feel the influence of the human hand in their design. Of course, scientific studies could prove all my ramblings above are just bunk, but that's my gut reaction.</p>
