    <p></p><div class="imageWrap"><img src="/files/impactrt_6665.jpg"></div><p></p>
    <p>Hey Typophiles - </p>
    <p>What I really love about this typeface is </p>
    <p>*) its ’A’ - very cool, clean- the straight line, the leg that breaks away and creates the great negative space with the ’P’ </p>
    <p>*)I love the counter in the ’P’ as well -very future-y</p>
    <p>*) the weight - very meaty - science-y</p>
    <p>My request is to get help iding this here impact rt - and to get recommendations for other typefaces like it!</p>
    <p>Thanks in advance!</p>
    <p>Marko</p>
