    <p>Hello!</p>
    <p>I am looking for suitable alternatives to Sauna Roman.<br>
    Qualities i like about Sauna: soft, friendly, only a hint of serifs, legible at smaller sizes</p>
    <p>Btw, the font will be used in an all caps setting.</p>
    <p>Thanks in advance!</p>
    <p>Seb</p>
