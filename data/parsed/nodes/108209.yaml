    <p>I was looking for a thin font and came accross this in a catalog. It is from the Hawarth Beside catalog, but cannot find any information on their site. It is super thin but the characteristic that gets me is the slightly curved crossbar on the uppercase A.<br>
     Please excuse the very large image, its the only way you could see the curve i mentioned.</p>
