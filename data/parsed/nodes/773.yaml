    html: "<p>Thanks for your ideas. <br> <br>On the two g's in the title: I thought it somehow balanced better, but I guess it is distracting. I was also thinking about shortening the tail on the y for a better fit.  <br> <br>Spacing on title page: Thanks Hrant, I will take all of your suggestions. I was worried about the balance of the deliberate assymetry of the title vs the symmetrical page layout. Glad you like it.  <br> <br>Spacing of quote P2: I didn't proof it enough. There is an extra word space between 'is' and 'admirable' that I didn't catch. The Poetica is set 17/18. I will try to turn on the 'Optical Spacing' in InDesign (which this is set in), and see if this helps.    <br> <br>Spacing of Hebrew. On this page I didn't center it vertically properly - it is too close to the block text. I will fix this. But now I am thinking I should also reduce the leading on the Hebrew. I had it 14pt, like the text. I did the Hebrew very small, to be like a caption to the large English quote, so it wouldn't compete visually. <br> <br>Jacques, the text is set 11/14. Because Minion has a large x-height and is condensed, the current leading looked better to me than tighter. Any other views? <br> <br>The block quote with the fleuron is set in 10/13. I did the indent the same at the paragraph indent for uniformity - I will try indenting it more, but I'm afraid it will be too much variation on a set of pages with a lot going on visually. <br> <br>David, the plan of the book is that, except for introduction and appendices, it is all sets of facing pages like the current p 2-3. The idea is that people sitting around a table can discuss the saying without flipping pages back and forth - everything is there.  <br> <br>The text blocks are aligned with the baseline grid, though the discussion guide blocks only have a half space (7 points) between them - which puts alternate blocks back on the grid. I thought the openness of the discussion guide bit bottom right somehow balanced the openness of the English &amp; Hebrew quotes top left.  <br> <br>On the red. David, you are the only one so far against the saying being in red. Why do you think it won't work? I am concerned that so much text in red might make it less readable, but on screen it seemes to me to work. I was inspired by some gorgeous books by &amp; about Jan van Krimpen. These were very classical in lay out, with plenty of use of a strong red, and they looked great. Because I am dealing with a classical text, I thought this suited the matter.  <br> <br>I'll post more in a few minutes. More comments welcome!         <br> <br> </p>"
