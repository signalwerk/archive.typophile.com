    html: <p>&gt;you need to think about your audience, your client.  <br> <br>David, I have thought a lot about my audience and I as a designer certainly know the wishes of one of my clients, namely the writer, who is also me. Your new series of excellent questions also presumes that I have not thought about them. I do find your presumption of my thoughtlessness annoying. Generalized questions are of not much help to me; the specific suggestions of other posters have been very helpful, and I appreciate them and will try them out.  <br> <br>There will be a second phase of this design, when I again discuss with the publisher - whom I have consulted and who has already specified the general size - the final specifications. The more I know going in, the better case I can make for what I want - the red, sewn signatures, good quality uncoated paper, quality soft binding.  <br> <br>I am looking here for ideas to improve the design, and to acquire more knowledge to make my case. The key here to justifying a classic and 'quality' look is that Pirkei Avot is a classic with numerous editions and commentaries.Design is important in re-issuing a classic, even if it has a lot of new material. I'd like to think that my commentary and guide will make it stand out, but I also want the design to make it stand out, so that the quality message of the design will visibly promise the same for the contents. Then the (I hope small) additional production costs will pay off in more sales for the publisher.  <br> <br>&gt;the first paragraph under "Discussion Guide" (p.3) seems alternately too loose, then too cramped. <br> <br>Thanks to Jacques and Nathan for pointing this out. I must admit I didn't catch it. I specified the h &amp; j parameters in InDesign following an example in Felici's book 'The Complete Manual of Typography'. His example was also in Minion, but in a narrower column. I will try different settings and see what happens. Will I have to also get in there and adjust paragraphs by hand? <br> <br>  <br></p>
