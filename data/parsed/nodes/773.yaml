    html: <p>Tiffany, thanks, I will try your suggestions and variations on them. Because most readers of the book will have little Hebrew, I don't want to emphasize it, with red or size. As it is, it is a reference for those who can understand some of it. <br> <br>Because 80% of the book will be like these facing pages, there is no way I can confine the red to just one or two signatures. I will just have to hope the publisher will spring for it, or do all black.  <br> <br>One concern I have is that offset might not have the density of ink as letter press, and might make the red look weak. The great examples of van Krimpen that I saw I think were done on a letter press. Is this a concern, or does offset make no difference on this?    <br> <br>Hrant, blackletter I think has Christian or German connotations to American Jews, neither of which is appropriate to this project.It is interesting the Goudy, the most American of type designers, thought blackletter is the most beautiful form.  <br> <br>Also I really like Poetica. Of all Bringhurst's stuff, I feel confident that this will definitely last.  <br> </p>
