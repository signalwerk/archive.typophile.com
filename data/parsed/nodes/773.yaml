    html: <p>I've found that InDesign cuts down on a <i>lot</i> of hand tweaking - though not necessarily all of it. Are you using Glyph Scaling in H&amp;Js? In theory I hate it - but if you set it at 98/100/102, it works wonders. You might also tweak the "hyphenation vs. spacing" slider. Generally, setting it on the second or third hash makes for pretty decent spacing results - although at the expense of more hyphens obviously. Hope this helps. <br> <br>Cheers.</p>
