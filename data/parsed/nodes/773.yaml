      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> is a revised version encorporating some of the ideas.  <br> <br>TITLE PAGE:  <br>To follow Hrant's suggestion to make 'of the' bolder in the title, I used Minion semi-bold with the larger Poetica. The letter forms are very similar, though Poetica is narrower with a smaller x-height. I think it is an improvement, but I'm still not sure if there is a better solution. (The best solution would be to get Bringhurst to do the title in his calligraphy!) <br> <br>In response to Tiffany's suggestions on the use of red, I took away the reddened 'heart' which I concluded is annoying. Reddening the subtitle made it compete with the title too much. I tried Tiffany's idea of adding more red for balance by reddening the fleuron. Do you think it works? <br> <br>I tried to kern the small caps at the bottom, but I'm not sure if I did a very good job. I started with everything tracked at 50 wider, and adjusted from there. Is there a better way to approach kerning caps? <br> <br>FACING PAGES: <br>1. This time I tried the InDesign 'optical' option on automatically kerning the quotation in Poetica, rather than using the 'metric' option, as in the earlier post. I think it is better; any views/experience from others?  <br> <br>2. As I wrote above, using the hyphenation slider as Nathan suggested was a great help in fixing the bad spacing pointed out by Jacques. (I also found and eliminated some double spaces left behind from revisions.) On my new pages 4 and 5 you can compare the effects of the slider at 2 (page 4) and at 3 (page 5, as well as 2 &amp; 3). I think maybe 2 is better in spite of the extra hyphens.   <br> <br>3. The formatting of the block quotes needed fixing. I have tried several options. Somehow, in trying hundreds of variations on the basic design of the facing pages, I neglected working on the block quotes. I am grateful to Hrant for catching it. <br> <br>I concluded first of all that after the block quote I should probably start the new paragraph flush left. I think this was one of the problems. The option of a further indent is on p. 5. The option of cutting the fleuron is on p. 4.  <br> <br>My reasoning behind my currently prefered solution, p. 3 this. The option of the further indent, suggested by Hrant and on p. 5 is best for contrast with the adjacent paragraphs. But in the overall scheme of the facing pages it cuts up the page too much. Already the quotes top left and discussion guide lower right break the grid. So to minimize the break with the grid, on p. 3 I have formatted the block quote 10/14 with no space before and after, and no right indent. There are many other options, but at the moment this is the best I could come up with. What do you think? <br> <br>4. Use of Red. An important feature of the design problem which is not on this set of facing pages is that there are 76 other sets of facing pages, with varying lengths of quotations and discussion guides. On this page, there is no red on the right, which would be good for balance. In some others the side heads do appear on the right. I also did try red fleurons, but it gave the pages measles. In the end I decided that on the facing pages I would only use the red for the main quotation, and the pick up lines of the same quotation in the side heads. Even though it is a bit unbalanced on one set of facing pages, the whole book repeats the pattern, and it provides a strong marker as guide for the reader. <br> <br>To David, sorry for overreacting to what seemed to me high handed remarks. Frankly, I think maybe both of us were suffering from what, following Hrant, we might call 'ASCII-itis'. <br> <br>Here are answers to some of your earlier questions. As far as the binding, most of the publisher's books do, as is typical, have bindings that eat 1/4" from the inner margin of both pages. My layout reflects this. If the publisher's final decision is different, I will change it. <br> <br>My page block is a pica narrower and longer than 6" x 9". (=35 x 55 picas). The text block is little taller than Golden proportions. I am following Bringhurst in the idea that generally the narrower rather than wider proportions give a more classical look, which I what I am trying for here. The deeper text block I think still balances up because of the open space at the top left and bottom right of the facing pages.  <br> <br>As to the question of whether this is a text book or monograph or what, I thought a long time about that and decided that it was a guide book -a kind of sui generus as a classic text with commentary and discussion guide. The design has the red as resonance with illuminated text, and the textbook element of discussion guide  <br>also.  <br> <br>There are many editions in Engligh of Avot with commentaries. The designs vary from ok to awful. You can compare them to this to have a very good idea of the design challenge.  <br> <br>As to why van Krimpen used red. The book I saw was a showcase for his Romulus. As it has a classical beauty, he was also showing classical design -very much his taste - in the book, and making the most of the traditionally available and classical look black, red and ivory paper. Dreyfus's book on van Krimpen does the same.           <br> <br></p>
