      <p>Here is a third revision encorporating further suggestions: <br></p>
      <!--attachment: Sayings_of_the_Sages_Sample_rev4-13922.unk*attachment_icon.gif*application/octet-stream*380.9**Sayings+of+the+Sages+Sample+rev4%2eindd --><!--attachment: Sayings_of_the_Sages_Sample_rev4-13922.unk*attachment_icon.gif*application/octet-stream*380.9**Sayings+of+the+Sages+Sample+rev4%2eindd --><p></p><center><br>
      <table border="1">
      <tbody><tr>
      <td><img src="http://www.typophile.com/forums/icons/attachment_icon.gif" align="left" alt="application/octet-stream"><br><a href="http://www.typophile.com/forums/messages/29/Sayings_of_the_Sages_Sample_rev4-13922.unk" target="_blank"><b>Sayings of the Sages Sample rev4.indd</b></a> (380.9 k)</td>
      </tr>
      </tbody></table>
      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> <br> <br>Here are the changes: <br> <br>Title page: I used the semibold italic subhead weight of Minion for 'of the' in the title. This seems to balance the best of the options. <br> <br>I reduced the size of the title and took away the bold on the author info; these looked too bold when I printed them out.  <br> <br>I tried using the optical spacing and then tracking 50 the small caps at the bottom. Then I just changed the tracking on a couple of them. Do they look even now? <br> <br>p 2. <br>As a test I changed the Hebrew font to David. I like it better as a font and it is, as Itay says, more readable as Hebrew. But it is a little bold to my eye in relation to the Minion. I might try to see if I can get a bargain on InDesign ME, and try other fonts. Short of that, I am inclined to stick with the old font (Hadar) for balance. What do you all think as far a balance? <br> <br>I saw somewhere in looking at Hebrew fonts on an Israeli site one called Poeta. Ok, a little too obvious as a match to Poetica, but it did actually seem to harmonize with Poetica. Do you know what I am refering to Itay? <br> <br>I put the thin space around the dashes on p. 2. Is this better than word spaces? Bringhurst recommends word spaces - I guess to avoid confusion with a hyphen - but I like Nathan's suggestion to use thin spaces instead. What do you all think? <br> <br>p. 3. The 10/14 block quote in the last post looked a little bare to me, so I tightened it to 10/13 (vs the 11/14 of the main text), and added an extra 2 points top and bottom. This puts the next paragraph on the baseline grid. Both Bringhurst and Felici recommend at least a half space above and below block quotes, but to me this flows better, as I have so much other stuff that breaks the grid.  <br>   <br>Thanks again to all for the help. <br></p>
