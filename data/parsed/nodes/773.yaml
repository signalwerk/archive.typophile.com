    votes: null
    html: <p>Thanks for looking into it Itay.  <br> <br>The upgrade to InDesign ME is very expensive (over $600.00 US), so I may just stick with using Davkawriter. I do prefer the look of the David typeface, but I had problems with the weight. Now before I was also dissatisfied with Minion until I switched to the open type version, which I like. So maybe now that I've switched the Minions I'll try David again and see if it works. <br> <br>As I understand from an earlier thread with John Hudson, beginning with Windows 2000 you just need to install the Hebrew keyboard in Windows, and then you can use regular Hebrew fonts in Word - but not so in regular InDesign. For that you need InDesign ME. (Before Windows 2000 I believe you needed the special Hebrew Windows, which you all had in Israel, but not us here in the US - the reason for the creation of Davkawriter.) <br> <br>The Davkawriter pasting from Hebrew to English does work in InDesign.   <br> <br>Sorry for mixing up 'nekudot', dots, and 'nikud', voweling or dotting. I think my Hebrew teacher referred to the vowels sometimes this way, or I just mixed it up. My Hebrew exists, but is weak. A fine Israeli scholar, Menachem Fisch, has helped me with the new translation of Avot used in the book.</p>
