    html: <p>&gt;Not wordpad, Notepad...the plain text editor if you can believe that!  <br> <br>AFAIK, the fact that Notepad supports RTL text and Hebrew (and other non-Latin scripts) has to do with the Uniscribe DLL. Despite the fact that Uniscribe is in 2000 and XP, not every app can use it. I'm sure John Hudson, Hrant, et al are more informed than I... <br> <br>&gt;And did you know, that Arial, Times New Roman, Comic Sans, and several other Windows fonts have Hebrew in them?  <br> <br>I don't know about TNR and CS, but MS Arial Unicode is around 25MB - it has glyphs for most codepoints in the Unicode spec. I believe Tahoma is also like this. In a way it's not all that surprising since Microsoft's OpenType strategy seems to be oriented more towards complex script support than Latin typographic niceties. <br> <br>Although I have a feeling (I haven't looked at all &amp; I know nothing about Hebrew) that the Hebrew support in Arial, TNR, etc. doesn't support the typographically complex things like nikuds(?). </p>
