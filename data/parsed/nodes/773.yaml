    html: <p>I am concerned about the cost of the red, as it is not a forgone conclusion that the publisher will spring for the extra money. I do think it makes the look distinctive and adds a lot, providing it turns out readable and balanced in print. Also it helps in picking up the quote in the side heads. The text itself is very concisely written, and has a lot of information, so the less intimidating I can make the page the better. <br> <br>From previous experience, I know that many presses can print two colors in one pass, so that black and a spot color is much less expensive than four color process printing.  <br> <br>Is the red ink itself expensive? Or is this just a matter of how many signatures it appears in? <br>The whole book will be less than 200 pages.  <br> <br>On the single quotes, I'm American but did graduate school in England. The reason I went for the British convention on single quotes first is to save space and get a cleaner page. There are, because of the nature of the project, a lot of references, and I didn't want the page littered with double quotes.  <br> <br> <br>On the layout of the quotes in Poetica. For three or at most four lines, I centered everything. For more lines I used different approaches, with almost every quote having a custom layout. I will post another example, if there is continuing discussion.  <br> <br>'Fun with fleurons'. Dwiggins I believe went wild with these, especially on title pages, and I've always liked them. I tried to not overdo it. </p>
