    html: "<p>Im sorry (for mainly myself) for not knowing enough about the compatibility of hebrew fonts and programs. I'll tell you the little i know -  <br>Usauly middle eastern (ME) versions of the popular programs work fine with right-to-left languages. I suppose that once you'll have InDesign ME you'll no longer need the DavkaWriter. Maybe you'll need some kind of hebrew support in the operating system, i'm not sure about that because, well, i sort of take it for granted that hebrew works on my computer, and im not sure why it's like that. I think i remember how the DavkaWriter fonts work - it has fonts with the hebrew set in the english part of the font. Its a very weird program. <br>  <br>I read that you get only 10 fonts by Guttman with DavkaWriter. Guttman digitalized some very nice designs, but you'll might wanna check some commercial fonts.. <br>you can get most of the good &amp; famous designs on MasterFont, who pulled the plug on their old website and the new wedsite has been in construction for years. I'm guessing you can't read hebrew, so this is their contact information:  <br>Tel: 03-6956311 <br>Fax: 03-6956322 <br>Email: <a href=\"mailto:sales@masterfont.co.il\">sales@masterfont.co.il</a> <br>Address: Igal Alon 159, Tel Aviv 67443, Israel <br> <br>another place to look is FontBit, which have a hebrew-only website(how stupid of them!!!).. <a href=\"http://www.fontbit.co.il/\" target=\"_blank\">http://www.fontbit.co.il/</a> <br>I hope you would find your way to the fonts section in the annoying flash maze. <br> <br>&gt; The face you see is Guttman Hadar. Earlier I used Davka's  <br>&gt; David, which looks more modern, but was a bit bold relative  <br>&gt; to the Minion.  <br>Looks so much like the old Frencheska design 'Shokan'! David [Regular] is good, it didn't look good with it? <br> <br>p.s. why is everybody saying 'nekudot' (=dots)? i think 'nikud' is the right term..? <br> <br>Good Luck. I'll be inquiring about the hebrew support.</p>"
