    html: "<p>&gt;many presses can print two colors in one pass, so that black and a spot color is much less expensive than four color process printing.  <br>Is the red ink itself expensive? <br> <br>From my limited experience on presses, this is also a function of the size of the run. Because (depending on the press/printer) you'll have to pay for a \"change-over\" to ink your spot red on the magenta head. For smaller runs this can sometimes add to the cost and hassle.  <br> <br>Typically, red ink is more expensive than black. (A quick search for Van Son Oil Base shows Pantone mixing reds to be about twice as much as black.) There's that, and there's also the mixing fee - some presses charge quite a bit just to mix the spot color you want.  <br> <br>But I really do like the red (it's not my money after all ;-) And I agree with Hrant about that block quote (p.3) with the fleuron needing to be indented more. And with M. Le Bailly about the word spacing being too large in spots. Right off hand, the first paragraph under \"Discussion Guide\" (p.3) seems alternately too loose, then too cramped. <br> <br>Overall I think it's pretty attractive though. And I think this is a nice point: <br> <br>&gt;By beautifying an object - a religious object or sacred quotation - you convey the message that it is a treasure. <br> <br>Cheers, <br> <br>Nathan</p>"
