    html: <p>Itay, yes the suggestions of the designers here have been extremely helpful. <br> <br>As to the Hebrew typeface, I have never been satisfied with it, and was settling for just being discrete.  <br> <br>My problem is that I am using the English/Hebrew program Davkawriter, which has its own coding system and limited typeface options. The face you see is Guttman Hadar. Earlier I used Davka's David, which looks more modern, but was a bit bold relative to the Minion.  <br> <br>I would be delighted to get something better, if I can get it into InDesign. In an earlier conversation on using Hebrew fonts, John Hudson recommended using InDesign ME, which I guess will use all the fonts you use in Israel. He said that regular InDesign will not do right-to-left text and nekudot. Davkawriter does have a functionality of pasting Hebrew into English programs, switching the direction and placing nekudot correctly. That is what I am using currently.  <br> <br>I don't know whether Dagesh, the other English/Hebrew program used widely here can use the regular Hebrew fonts. If there is another Hebrew font that will work a lot better, I will also check on the cost of upgrade to InDesign ME, now that I have InDesign anyway.  <br> <br>In any case, if you can give me URLs to look at the fonts you mention, I would appreciate it. I'd love to consider them.  <br> <br>Also if you have info on the problems of compatibility of Hebrew fonts and U.S. programs, that would be great. Nobody has given me an overview of this.  </p>
