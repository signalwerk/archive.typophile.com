    html: "<p>William, <br> <br>i didn't insult you...or something like that? <br> <br> <br>1. i asked you what is your plan for that book. and again - what is your plan: <br> <br>   a.  do you know how the book is to be bound? yes - great. no - how do you know that you have adequate outer and inner margins? <br> <br>    how do you know that you need to exaggerate the margin away from the spine? <br> <br> <br>   b. what kind of paper/texture of paper? the paper should support the Typeface and the Style of the book. <br> <br> <br>   c. proportion: the grid of your book need to be well proportioned on the page. <br> <br>   d. the design of your page (you have hebrew text and english) need to be finely weighted. otherwise the reader is going to stare at the page. <br> <br> <br>   e. red: why do you think Van Krimpen used red? <br> <br> <br>2. book design is book design.  textbook is textbook. the art of illumination is the art of illumination. <br>   from where and how - the whole thing about illumination? religious object...? <br> <br> <br>3. when i said \"...think about your audience\" - not as a writer. but as a designer.  everything is with reason. every line. every letter. dot. mark.  there's no such a thing  - \"well, oh, i want to do that, since....  i want.\" <br> <br>with fine art  you can say that.  <br> <br> <br> <br>i'll post more......but not now....long day... <br> <br> <br> <br>David Hamuel</p>"
