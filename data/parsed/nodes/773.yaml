    html: <p>I think it's good.  You don't want to overdo it on the red, so what little you have is nice. <br> <br>One thing I would think about however, is are you going to have red all throughout the book?  If you can keep it black you can cut down on printing costs. <br> <br>Little thing I noticed, kinda annoying, that "g" in "sayings".  I'd replace it with the "g" in "sages".  It just looks kinda ugly to me. <br> <br>Otherwise, I like it.  I love how you're using fleurons in there as well.  You don't see them anymore, and it's nice to every so often.</p>
