    html: <p>David, as I know a lot more about philosophy than design, I would rather have your design analysis - such as why you think the red is not good - than your philosophy.   <br> <br>Philosophically, your segregation of art and design is simplistic, and doesn't hold up to examination. By beautifying an object - a religious object or sacred quotation - you convey the message that it is a treasure. This is a traditional concept in Judaism - called hidur ha-mitzvot - as well as in other religions. Illuminated manuscripts are part of that tradition. In the case of this design, beautification of the sacred texts suits the design purpose. Both Poetica and the red help the design if they succeed in beautifying, even at the cost of making you read the quotation more slowly and repeatedly. Beauty gives the message, 'Turn it and turn it, because all is in it' - the last saying in Pirkei Avot.  </p>
