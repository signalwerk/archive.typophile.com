    html: <p>Correction.  <br>In talking about the mediocrity of the design of earlier versions of Avot I neglected to mention the 1960 Heritage and Limited Editions Bookclub editions of 'The Living Talmud' by Judah Goldin.  <br> <br>In spite of the title, this is an edition of only Pirkei Avot. The editor was a first rate scholar who selected and translated the classical commentaries. It is a wonderful book; all editions, including paperbacks, are out of print.  <br> <br>I haven't had the Limited Edition version in my hands. It has illustrations, leather and vellum binding and is signed by the illustrator. I believe it has the Hebrew in red. (The paperback is missing the Hebrew.) I don't know whether the Heritage edition is just different in binding, or size and printing as well from the Limited Edition. I am curious to look at these, but the Limited Edition costs between $100-200 now on the internet, and I have been too cheap to spring for it. </p>
