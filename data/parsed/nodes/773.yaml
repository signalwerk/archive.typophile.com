    html: "<p>I'm in class, but a real quick post: have you tried InDesign's Optical Margin Alignment? I mention it because page 4 (where you've set the hyphenation slider on 2) could use it, as could page 5 (at the bottom, the 2 hyphens in a row). Select all your type, in your Type menu choose Story, check the Optical Alignment box, and select your type size. It should overhang your hyphens/quotes/etc so the edge of your copy doesn't have divots in it.</p>"
