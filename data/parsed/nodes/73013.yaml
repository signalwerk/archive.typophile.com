    html: |-
      <p>@Nick Shinn...my school, The Art Institute of California - Orange County, puts out a small magazine every quarter for the student body. This magazine is the assignment for one of my classes this quarter and I'm the Art Director for the project. Usually, this magazine is nothing to brag about, but I'd like to change that with my issue. It just so happens that this is the 10th Anniversary of my school and they want to make this issue special. My goal is to produce something that the students won't just throw away; to make it something they want to keep around. I'm doing this by slightly altering the usual dimensions of the magazine, kicking up the visual quality to levels not seen in previous issues, making reading it a very tactile experience with lots of spot UV throughout, etc.</p>
      <p>You ask why, if virtually no one will see it, would I want to make "a school magazine feel high-end, sophisticated and cutting edge?". The answer is simple: I take pride in my work. And in addition to it being a 10th Anniversary edition, if it comes out like I want it to, it's something I'll put in my portfolio. I'm no spring chicken...just a few months shy of my 30th birthday. </p>
      <p>I hope that gives you a little more insight into my reasoning for wanting a mere school magazine to look like more than it really is.</p>
    html_clean: |-
