    html: |-
      <p><em>...if virtually no one will see it...</em></p>
      <p>I meant they won't "get it" (grok?), if "high-end, sophisticated" isn't their normal cultural milieu, which is a reasonable assumption for school students. But perhaps I underestimated the sophistication of your readers, and no doubt it's true many people admire upscale glamour, even if they can't afford it. Although I would imagine that the students at your particular school are pretty well off.</p>
      <p>I wasn't implying that it was a "mere" school magazine -- there is no value-judgement in identifying different economic tranches for marketing purposes. In fact, IMO "high-end" is often tacky, relying on expensive materials (e.g. white space) and profuse workmanship to impress. Bling.</p>
      <p>The idea is to target (match) the work to the audience, not merely to create something exceptional for one's peers and portfolio.</p>
      <p><em>My goal is to produce something that the students won't just throw away; to make it something they want to keep around. </em></p>
      <p>That's good.</p>
