      <p>No, this certainly is from <a href="http://sz-magazin.sueddeutsche.de/" rel="nofollow">Süddeutsche Zeitung Magazin</a>, right?<br>
      (Always mention your source, David! :°)<br>
      This Munich based newspaper has had this distinctive nameplate (<a href="http://www.typophile.com/node/31857" rel="nofollow">discussed </a> here <a href="http://www.typophile.com/node/33764" rel="nofollow">previously</a>) for more than 60 years now.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sz_6663.png"></div><br>
      A few years ago, the letterforms of that lettered nameplate were turned into a font, missing characters were added. I once read about that, but unfortunately forgot who had done it.<p></p>
      <p><a href="http://sz-magazin.sueddeutsche.de/" rel="nofollow">SZM</a> is a weekly supplement to the paper. <a href="http://www.mirkoborsche.com/" rel="nofollow">Mirko Borsche</a> used to be its art director for the last three years … I don’t know if he was involved.</p>
      <p><a href="http://www.typeforum.de/modules.php?op=modload&amp;name=XForum&amp;file=viewthread&amp;tid=451" rel="nofollow">Typeforum.de</a> doesn’t know either … guess it’s time to ask directly.</p>
