    <p>Hi all, </p>
    <p>I’m currently for my final school project doing a visuel identity for a school called “The Academy of Professional Higher Education”. I’m on the lookout for a fresh, exciting sans sherif with a lot of character. I will be used both in the logotype and troughout the rest of the identity. </p>
    <p>Does anyones of you type-specialists have an suggestion? :)</p>
    <p>Thanks</p>
