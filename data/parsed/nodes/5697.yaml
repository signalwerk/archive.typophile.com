    html: <p>The last version of Quark to support Hebrew was 4 (and you had to get the more expensive “Passport” version.) But InDesign ME offers better Hebrew support than Quark ever had. If all you need is a single booklet, there’s a <a href="http://www.winsoft.fr/products/download/DownloadsME.html">30 day trial version available for download</a>.</p>
