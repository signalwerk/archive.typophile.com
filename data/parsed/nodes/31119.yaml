  html: |-
    <p>Hello typophiles !</p>
    <p>here is my first post ever</p>
    <p>this is a type I started making for the identity of a study program<br>
    the students in there learn to be nurses for old people at home (yes there is an english word for that, i just dont know it)</p>
    <p>So the first idea was to make the type out of crosses (as in red cross), it turned out to have a sort stitching look to it, which was also fine for the target group of old ladies.</p>
    <p>the client chose for another proposal because this ' wasnt readable' (its meant to be read ny the young students mind you, not the patients)</p>
    <p>i sort of like the weirdness of it, and I'd like to give it a last push because i feel its not quite there yet</p>
    <p>oh and yeah i like the system of ornaments, theyre broken down to small elements so you can combine them as you wish</p>
    <p>any suggestions ??</p><div class="imageWrap"><img src="https://web.archive.org/web/20150124045552im_/http://typophile.com/files/stip_4256.gif"></div><p></p>
