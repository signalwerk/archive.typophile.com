  html: |-
    <p>Hello everyone,</p>
    <p>Any idea of this face?<br>
    In some websites it's credited as “Baskerville” (<a href="https://busrasafak.wordpress.com/2015/12/03/font-styles/">https://busrasafak.wordpress.com/2015/12/03/font-styles/</a> ; <a href="https://fontstipografia.wordpress.com/2014/05/25/serif-baskerville/">https://fontstipografia.wordpress.com/2014/05/25/serif-baskerville/</a> )<br>
    To me it looks sort of a contemporary adaptation of Baskerville, surely light years away from all the Baskervilles I know. (ITC, Monotype, Storm etc.)<br>
    Look for example at the tails of the uppercase Q and R, or at the shape of the serifs in general.<br>
    Any suggestions would be great.<br>
    Thanks!<br>
    M.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/cheshireserif_bookv1_5544-1.jpg" width="2550" height="1204" alt="">
