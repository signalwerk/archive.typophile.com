      <p>Statistically, I'd say in (modern) Latin handwriting, the pen is moving left-to-right about twice as often as right-to-left (counting only on-paper time and disregarding vertical and near-vertical movement). Comparatively, LTR movement is at least four times of of RTL movement in (modern) Chinese, because the horizontal stroke ("heng"), which is the most frequent type of stroke, is always drawn left-to-right. In other words, Chinese has a much stronger (horizontal) directional bias than Latin.</p>
      <p>Does anyone know what the LTR to RTL movement ratio looks like in Arabic?</p>
