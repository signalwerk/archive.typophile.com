      <p><em>in calligraphy, the most important thing is seeing</em></p>
      <p>I disagree. I think most (professional) calligraphers have a precise mental picture of what they want to draw, but their hands fail them in reproducing the lines from their imagination.</p>
      <p>In fact, I believe most calligraphers are seeing to much: They tend to over-adjust their movement -- and often even their plan -- midway because seeing the partial picture (or even the current partial curve) makes them insecure about whether it's right. Maybe if they rely less on their eyes and more on the mental picture in their head -- go into a meditative trance, if you will, so as to tune down the non-stop visual feedback analysis that's messing with them, they would produce more fluent and natural results.</p>
