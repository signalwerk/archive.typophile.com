      <p>Actually, we now know a lot about the way Chinese calligraphy was performed even at the time of Wang Xizhi (303-361 BC, in Jin Dynasty, which the Chinese themselves -- including later generations like those in Tang -- regard as the grand epoch of calligraphy): How people used to sit, lay out the paper, hold the brush, and so on. Many of the things we know today were unknown -- or presumed in ways that have turned out to be wrong -- a few decades ago, but recent historical and archaeological research has brought them into light.</p>
      <p>To be clear, I'm not a calligrapher myself -- not even an amateur. But the person in my family who taught me a bit of calligraphy when I was a child is a professor of Chinese calligraphy history. He's also not the only person with professional background I discuss those topics with from time to time.</p>
