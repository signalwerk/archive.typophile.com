      <p>"Traditional calligraphy" does not designate a person, or other feeling and thinking being. As such, to say that "traditional calligraphy hates lefties" is simply a figure of speech; it is not an imputation of hatred or bigotry to the calligraphic community. When people are unfair it is blameworthy, but that life is often unfair is just a fact.</p>
      <p>It was just a short way of stating a simple fact: attempting to write traditional calligraphic styles with the left hand in normal writing orientation will be difficult and will tend to produce poor results. There are workarounds; after all, right-handed people do calligraphy in Hebrew (traditionally by writing sideways, as Hrant mentioned) and Arabic.</p>
      <p>If one is making a master copy for reproduction, rather than an individual original, I suppose one could actually write the mirror reflection of what one intends to produce... perhaps using a mirror to see your result!</p>
