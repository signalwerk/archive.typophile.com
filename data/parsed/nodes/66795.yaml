      <p>The videos showing John DeCollibus writing are very instructive. Note that all the script styles that he writes are split nib, expansion stroke styles. I've long maintained, on Typophile and elsewhere, that these styles are the natural domain of lefties, since they avoid the problems inherent in the broad nib, translation stroke styles. Writing these styles, the lefty is at no disadvantage or awkwardness.</p>
      <p>Plus you get to listen to lots of baroque music, and how cool is that!</p>
