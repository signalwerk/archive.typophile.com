      <p>Hrant, I'm sure you agree that when ‘reading’ what you are in the process of writing one is not engaged in immersive reading. Indeed, insofar as one will most of the time be looking at partially formed words, one isn't really reading at all. My concern in such a situation would be whether it is easier to make spelling mistakes if one isn't looking at the text at a normal angle. I wonder? But the other thing to bear in mind is that we're not talking here about everyday writing but about calligraphy, i.e. writing as a kind of art, and a lot of practice goes into that. I doubt if the challenges imposed by having to rotate the page present major difficulties that could not be overcome with such practice.</p>
      <p>I think taken as you present it, Noordzij's statement is simply fact. He's not saying that this is an ideal way in which to write, he's saying that if a lefty wants to produce the traditional forms of [Latin-script broad-nib] calligraphy the only comfortable way to do this in terms of the relationship of hand and pen to the page is to rotate the page. Certainly, it is a suggestion far more sensitive to the ergonomics of left-handed writing than the kind of contortions to which I regularly see lefties reduced, even if in some of those positions the page is better oriented for reading.</p>
