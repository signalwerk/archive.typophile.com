    html: <p>I'd guess that Chinese calligraphy might be easier for a lefty than Latin script calligraphy.  A key reason why lefties struggle with a broad-nibbed pen is that it's difficult to find an angle that's both natural and that allows the nib to be drawn across the paper as it's designed to be.  With Chinese calligraphy the tool of choice is a brush rather than a pen, which has a flexible rather than a rigid tip and deposits ink on paper in a very different way.  And if I'm not mistaken, the angle at which the brush is held is nearly vertical, which is just as easily done with the left hand as with the right.</p>
