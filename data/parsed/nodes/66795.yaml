      <p><cite>I doubt any living CJK calligrapher is capable of simultaneous writing.</cite></p>
      <p>At a park at Chengdu, Sichuan Province, I saw a man writing on the walkway with two brushes simultaneously, one in each hand, using water instead of ink. The characters written by the left hand (I think) were mirrored, though. Unless it was the case that I happened upon the one street calligrapher in China who does that, it can't be that rare a practice, and perhaps there are even those who write normal un-mirrored characters simultaneously with both hands.</p>
      <p>And yes, Aric, you make good points about Chinese calligraphy being more amenable to lefties. I learned some Chinese calligraphy when I was young (a bit before Korean calligraphy, actually). I had already got used to writing with a pencil, held at an angle to the page with the fingers close together and the wrist resting on the paper for support, so it was difficult to transition to holding the brush vertically with enough space maintained in the inside of my hand to grasp an egg (I think that's how they taught it). This and the fact that it's a round brush means that there is no angle bias at all with Eastern brush calligraphy.</p>
