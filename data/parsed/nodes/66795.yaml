    date_raw: 2 Feb 2010 — 1:13pm
    votes: null
    html: "<p>Hrant, I've been thinking about your comments in that other thread regarding writing 'naturally' vs 'contortion'. If you look at the ways in which different writing systems are written around the world, I don't think you can easily define what constitutes a 'natural' way of writing: all writing is cultural. I think it is better to talk in terms of comfort and ergonomics. In which case, it is interesting to note that the common hand position of European writing, in which the wrist is flexed backwards is less comfortable over a long period of time than what we would think of as a rotated position in which the hand is in-line with the lower arm and the wrist is not flexed. As someone who suffers from rotator cuff mobility problems and pain, I'm very much aware that there are habitual positions that are very bad for the body and that should be avoided. But I think the range of comfortable positions for writing is greater than perhaps a culturally biased notion of what is 'natural' might suggest.</p>"
