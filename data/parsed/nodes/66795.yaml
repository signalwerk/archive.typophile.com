      <p>Hrant: <em>To me calligraphy is now art, which means it's about self-expression...</em></p>
      <p>Well, you've always been wrong about that. Self-expression is one particular purpose of some art; it's also a fairly recent, romantic view of art, which cannot explain most of the art that has been made in most of the world throughout most of human history. Art expresses many things, and many of these, e.g. nature, culture, are very much bigger than the self.</p>
      <p>An art that only expresses the self, frankly, isn't up to much. I've been trying to find the passage in one of Bringhurst's essay where he says something to this effect, but perhaps his conclusion is all that needs to be stated: art can express the world. He and I happen to live in a place where art of the aboriginal inhabitants demonstrates this in particularly powerful ways. But a walk around any museum in the world will quickly convince you that art is expressing more than the paltry self of the artist.</p>
    html_clean: |-
