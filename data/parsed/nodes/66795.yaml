    html: "<p>I'm a left-handed calligrapher and with the exception of the ruling pen, I have not found it to be a problem at all.  In fact, with pointed pen it seems to be an advantage--I still use the oblique holder but some lefties do not.  And as others have said, the broad-edged nib needs to be cut at the opposite slant.  But the essence is this:  in calligraphy, the most important thing is seeing--i.e. line, slant, spacing, curve, negative space etc. --- and getting what your mind's eye envisions onto the paper.  When you approach it that way it doesn't matter which hand you write with.  It helps to make sure any teacher you work with is of similar mind;  I've run into a few \"old school\" types who don't want to bother with me when they could be critiquing my work as they do anyone else's.</p>"
