      <p>Hrant, as I wrote, I don't think Noordzij is suggesting that writing with a rotated page is in any sense optimal, even in terms of comfort. He's saying that this is the most comfortable way, given both the constraints and the options, for a lefty to create these particular forms of letters. He's not saying it is some kind of perfection of comfort, but that it will be easier, less tiring and more egnomically sound to do it this way than to do it in another way.</p>
      <p><em>Separating the creation of text from its use is misleading.</em></p>
      <p>I think stating that as some kind of general rule is misleading. There are lots of different kinds of text in and on lots of different kinds of media. Arguably, the very constraints imposed by the broad-nib translation stroke make it less important for the text to be angled relative to the writer in a particular way, because the writing tool itself will largely control the stroke contrast. Being able to see letters as they will be read becomes more important in outline-drawn letters, when one cannot rely on the tool for such control.</p>
      <p>Again, remember that we're not talking about everyday handwriting; we're probably not even talking about something like professional scribal text creation of the kind that doesn't really exist anymore outside of a couple of Urdu newspaper publishers.</p>
