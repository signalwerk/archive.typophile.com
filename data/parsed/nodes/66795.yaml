      <p>It's not just incredibly difficult; it's probably pretty much impossible unless you're inherently "wired" a certain way, which extremely few people are.</p>
      <p>--</p>
      <p>Lefthanded writing is tolerated fine in most cultures with RTL writing; my point is that <em>formal calligraphic instruction in any script</em> will tend to subvert lefthandedness.</p>
      <p>The only way lefthanded calligraphy can truly flourish is to establish a distinct school that formally rejects the righthand school. A lefthander following a righthand-centric course will certainly learn much, but can never reach his full potential.</p>
      <p>hhp</p>
