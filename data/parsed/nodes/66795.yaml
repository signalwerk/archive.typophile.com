  html: <p>I know that there are already a few posts in the forum on beginning calligraphy, but I have slightly more specific needs. I'd like to learn calligraphy, especially since at some point I'd also like to do a bit of type design, and I have already come across a number of books on <a class="freelinking external" href="http://www.amazon.com/s/ref=sr_st?keywords=calligraphy&amp;rs=1000&amp;page=1&amp;rh=n%3A1000%2Ck%3Acalligraphy&amp;sort=relevancerank" rel="nofollow">Amazon</a> and elsewhere. The problem is that I'm not really sure if such books cater for left-handers, or if indeed it makes any difference at all. Any thoughts or specific recommendations?</p>
