      <p>Individual Hebrew letters are traditionally written left to right, in the manner of a right hander primarily pulling the pen to the right and down. However, each new letter is put down on the line in the other order: starting on the right, then each new letter to the left of the previous letter. </p>
      <p>Hence whatever special challenges a left-hander faces with Latin calligraphy will be similar in Hebrew.</p>
