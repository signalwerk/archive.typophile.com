    html: '<p>@Jongseong: First of all, writing mirrored text simultaneously with both hands is easier -- by magnitudes -- than writing normal text (which is why I emphasized "normal, not mirrored"). Second of all, writing merely readable text simultaneously with both hands is again easier -- by magnitudes -- than produce something good enough to be considered "calligraphy". For it to be a real simultaneous calligraphy, the product of both hands need to be both as good as what the calligrapher would normally produce with his normal hand -- in fact, it should be unrecognizable which sheet is written with which hand. That is incredibly difficult.</p>'
