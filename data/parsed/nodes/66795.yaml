      <p>Hrant, it seems a chicken and egg sort of question, whether we write the way we do because of fine motor skills that are an ‘inherent, primordial ability’ or whether we developed such an ability as we practised mark making. An adaptationist could easily make a case that being able to e.g. paint animals well on the walls of a cave would lead to greater social status and hence to both better nutrition and to more opportunities for reproduction. I'm not much of an adaptationist, though, and while I wouldn't presume an ‘inherent, primordial ability’ I would be inclined to think that there are innate potentials or capabilities that might be developed into abilities or characteristics. And we see this with regard to fine motor skills even today: we have this capability, but it must be fostered and practised by each individual, usually at quite a young age, or else it doesn't develop. This is parallel to many other innate capabilities, which we probably all have but which we lose if we do not develop them. There are no tone-deaf people among speakers of tonal languages, because they all develop their capability to produce and recognise verbal tonality at a young age; whereas speakers of English generally have much poorer tone sensitivity unless they have studied music quite seriously. Depressingly, one can imagine all sorts of innate capabilities that we might possess, but which we have neglected and lost.</p>
      <p>Evolution is an imprecise process, in which mutations tend to be surplus to requirements (since mere survival is the only requirement): you need mutations that make it possible to survive in a sub-Saharan grassland, and you end up with Bach.</p>
