      <p>Hrant, consider: most of the letters we read, write, typeset, etc. are lowercase letters. What are these? Where did they come from? As it happens, we have a huge wealth of palaeographic evidence that documents the development and evolution of these letters during the mediaeval period, i.e. a record of how these letters came to have the normative <em>shapes</em> that they have. And that evidence is pretty much entirely of minuscule letters written with a broad-nib at a fairly consistent angle. This is the crucible in which the shapes of our letters were formed, and if the tool had been different or the angle had been different, we would reasonably expect those shapes to be different. Like it or not, this does put constraints on how these letters can be written with that tool, and even some constraints on how they can be written with other tools, although changing tools always introduces new freedoms as well as new constraints.</p>
      <p>Now, why would a lefty want to go to the trouble of adapting to these constraints so as to be able to write these letters? I suppose there are individual answers to that, but it seems to me that most people who want to take up calligraphy, regardless of their handedness, do so because they have seen and been inspired by works of calligraphy. Since calligraphy, in every scribal culture I can think of, is a deeply traditional craft, mastering historical exemplars is one of the things that is both expected and, I am sure, one of the things people want to do when they sign up for calligraphy courses.</p>
      <p>Conversely, if one wants to invent new ways of writing, without learning to master traditional styles, one might as well just stay at home and start playing with tools and media. Don't go to a teacher if you're not interested in the thing that the teacher is able to teach you.</p>
