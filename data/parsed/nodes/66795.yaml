      <p>A couple of points regarding right-to-left scripts:</p>
      <p>The direction in which a script is <em>read</em> doesn't necessarily imply anything about the direction in which it is written. This is something one learns from watching Arabic calligraphers rotating the page and writing top-to-bottom.</p>
      <p>Writing direction is independent of pen angle, and it is the latter factor that determines the normative patterns of letters when they are written with contrasting stroke tools, especially translation stroke tools such as broad nibs or flat brushes. One can ignore those normative patterns, of course, but the result will be that the letters look weird to most readers. Normative contrast patterns are so basic to script identity that reversing them frequently gives the impression that one is attempting to make a pastiche of a different writing system, e.g. writing Latin letters à la Devanagari.</p>
      <p>Again, my advice to a lefty would be to look at tools (brushes, split nibs, low contrast tools) that do not enforce a translation stroke pattern, and at styles of lettering within a writing system that favour left-handed execution.</p>
