      <p>OK, I've found in Wikipedia (<a href="http://en.wikipedia.org/wiki/Non-English_usage_of_quotation_marks" title="http://en.wikipedia.org/wiki/Non-English_usage_of_quotation_marks">http://en.wikipedia.org/wiki/Non-English_usage_of_quotation_marks</a> )<br>
      that in greek it is used «/alpha » (primary) “/alpha ” (secondary). No indication for the third level. Any clue?<br>
      And what about the apostrophes?</p>
