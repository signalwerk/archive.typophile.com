      <p><a href="http://www.tiro.com/John/GreekNTKerning.zip">http://www.tiro.com/John/GreekNTKerning.zip</a></p>
      <p>This is a list of Greek words (minus breathing and accent marks) from the Greek New Testament. The .txt files use production glyph naming for use in FontLab metrics window. The .doc files contain the words Unicode-encoded.</p>
      <p>These files are good for kerning letter-to-letter. Combinations of letters plus marks also need to be kerned, particularly when adjacent to some caps and ascending letters.</p>
