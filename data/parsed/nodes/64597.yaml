    <p>Hello everybody!</p>
    <p>Does anyone knows where can I find a list of kerning pairs for greek?</p>
    <p>I'm using Leslie Cabarga's Kern King (<a href="http://www.logofontandlettering.com/kernking.html">http://www.logofontandlettering.com/kernking.html</a>) for latin, and I'm wondering if there is some similar thing for Greek.</p>
    <p>Thank you in advance, cheers!</p>
