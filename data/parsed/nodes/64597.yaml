      <p>Hi there, </p>
      <p>I am about to add punctuation and quotations to John's list.</p>
      <p>Does anybody know what is the greek quotations usage?</p>
      <p>I don't think that doing all the possibilities in the current string make sense:</p>
      <p>“/alpha ” ‘/alpha ’ '/alpha ' "/alpha " „/alpha ” ‚/alpha ’ „/alpha “ ‚/alpha ‘ ›/alpha ‹ ‹/alpha › «/alpha » ’/alpha</p>
      <p>Thanks in advance.</p>
