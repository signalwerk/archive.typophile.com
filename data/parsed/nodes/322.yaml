  html: '<p>The Wells College Book Arts Center welcomes book designer Greer Allen to <br>campus. On Thursday, April 18, Mr. Allen will give a talk entitled "You See <br>His Letters Every Day: the Tumultuous Life and Times of Berthold Wolpe." The <br>lecture begins at 7:00 pm in the Art Exhibit Room in Macmillan Hall, and is <br>free and open to the public. <br> <br>The lecture will focus on type designer Berthold Wolpe. Wolpe was born near <br>Frankfurt, Germany in 1905. He spent much of his life working in England, <br>where he designed as many as 1,500 book jackets for publisher Faber &amp; Faber. <br>He is best known for designing the typeface Albertus, which was commissioned <br>by the Monotype Corporation in 1932. For a time, Albertus was the most <br>ubiquitous display typeface in England, and in 1988 was used by the City of <br>London on all street signs. Wolpe is also credited with designing the <br>Hyperion and Tempest typefaces. <br> <br>A dynamic speaker, Greer Allen has designed publications for Colonial <br>Williamsburg, the Philadelphia Museum of Art, the Art Institute of Chicago, <br>Storm King Art Center, and many other libraries and museums. He now serves <br>as senior critic in graphic design at the Yale School of Art, and is a <br>former Printer-to-Yale University. He has been designated honorary printer <br>to the Cathedral of St. John the Divine in New York City. <br> <br>This special event is sponsored by the Wells Book Arts Center, the Dean of <br>the College, and the Bookworkers Union Local .918.  For more information <br>about this event, please contact the Wells Book Arts Center at 315-364-3420 <br>or by email at <a href="mailto:bookartscenter@wells.edu">bookartscenter@wells.edu</a>. <br> <br>Established in 1868 by Henry Wells, founder of Wells Fargo and American <br>Express, Wells is a liberal arts college dedicated to preparing women for <br>the challenges and opportunities of the 21st century. The college is located <br>in the beautiful village of Aurora, on Cayuga Lake between Ithaca and Auburn <br>New York. <br> <br>-- <br> <br>Wells Book Arts Center <br>Wells College <br>Aurora, NY 13026 <br>315-364-3420 <br> <br><a href="mailto:bookartscenter@wells.edu">bookartscenter@wells.edu</a> <br>www.wells.edu/bkarts/bkarts1.htm</p>'
