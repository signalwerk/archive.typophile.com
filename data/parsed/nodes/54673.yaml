      <p>Mr. Thomas Phinney:</p>
      <p>&gt; <cite>@people-reading-Uli: In the conversion example, it’s a derivative work. Usual guidelines for derivative works apply.</cite></p>
      <p><strong>This Being is Nothingness!</strong></p>
      <p>Copyright protection is only granted to authors of intellectual works. Copyright law rewards the creative intellectual activity of authors. A work of authorship is a work created by the own intellect of the autor. If a person does not exercise his own intellect, he cannot be the author of an intellectual work and hence cannot be granted copyright protection.</p>
      <p>Here is a fictitious example, which is easier to understand than the above font conversion example:</p>
      <p>At the website of Mr. Ricardo Cordoba, who uploaded above "Twilight Zone" picture, we learn that he learnt the English and the Spanish language so that he has the intellectual ability to create works of authorship in English and Spanish. But Mr. Cordoba did not learn the French and the German language, so that he does not have the intellectual ability to create works of authorship in French and German.</p>
      <p>Now let's assume there is a copyright lawsuit, and Mr. Cordoba as a defendant states that he translated Sartre's French work "L'être et le néant"</p>
      <p><a href="https://web.archive.org/web/20150124161550/http://www.amazon.fr/LEtre-N%C3%A9ant-Jean-Paul-Sartre/dp/2070293882" title="www.amazon.fr/LEtre-N%C3%A9ant-Jean-Paul-Sartre/dp/2070293882">www.amazon.fr/LEtre-N%C3%A9ant-Jean-Paul-Sartre/dp/2070293882</a><br>
      (For English see <a href="https://web.archive.org/web/20150124161550/http://www.en.wikipedia.org/wiki/Being_and_Nothingness" title="www.en.wikipedia.org/wiki/Being_and_Nothingness">www.en.wikipedia.org/wiki/Being_and_Nothingness</a>)</p>
      <p>into the German language. The judge asks whether Mr. Cordoba can read and write French and German books, which is denied by Mr. Cordoba, who claims that no knowledge of languages is require for copyright protection, because he bought a computer translation program which made a fully automatic translation of the electronic file of the French work "L'être et le néant" into the German language so that he is the author of the German translation "Das Sein und das Nichts" as a derivative work of copyright.</p>
      <p>Is this correct?</p>
      <p>Who does not exercise his own intellect cannot be the author of intellectual works and therefore cannot be granted protection by the copyright law.</p>
      <p>Another example: Mr. Thomas Phinney and Mr. Miguel Sousa repeatedly stated here and elsewhere that all Adobe PostScript and OpenType fonts are fully automatically hinted by entering a simple command line such as</p>
      <p>autohint -a AGaramondPro-Regular.otf</p>
      <p>Irrespective of whether hints of PostScript fonts are regarded as computer programs or not, they are generated fully automatically so that he who enters above command line does not need to have any intellectual ability whatsoever except the ability to enter the command line. But he who does not exercise his own intellect cannot be the author of intellectual works so that nobody can be granted protection by the copyright law for automatically generated hints of PostScript fonts.</p>
