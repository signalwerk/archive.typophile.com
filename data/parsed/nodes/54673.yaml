      <p>With that piece of original coding, I downsize fraction number glyphs for small caps--perhaps I should apply for a patent?</p>
      <p>**</p>
      <p>It's unfortunate for type designers, but most people don't understand that type design is not just about making attractive-looking letters, but concerns the visual mechanics of how letters fit with one another. Of course, if one looks at letters individually, they don't appear to have much originality--but the same could be said of the components of music or literature. The way type design is treated, it's like the only novel that could be copyright protected would be entirely composed of neologisms, or shizzolated, which would be the equivalent of the gimmick fonts shown in the Lipton tract.</p>
