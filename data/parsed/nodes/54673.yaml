      <p>I'm afraid you have it all wrong, Ricardo. Suppose you open a business and do well. Suppose I open a competing business across the street and take away some of your business. I caused you economic harm. I may even took advantage of your efforts, since some of my clients only became aware of my business by coming to you first.</p>
      <p>Yet, the fact that I caused you economic harm doesn't mean I took away your property. Your profits are not legally protected (unless I violated some other right of yours, e.g., your trade-mark, or by "passing-off").</p>
      <p>The term "intellectual property" misleads you into believing that your economic interests are protected beyond the scope of copyright, trade-mark, unfair competition, and other recognized categories of law. The right to exclusive profit from your creative work is not a natural right, but one that requires legislation.</p>
      <p>If you fix your creative efforts in a physical medium, your property rights in the tangible are protected. In addition, the law prohibits others from unauthorized copying, unless it is for a permitted use (e.g., private study). But you cannot claim more than that. </p>
      <p>Yes, some creators deserve better, but it is not possible to build a theory of property rights based on stomping one's foot and yelling, "unfair!".</p>
