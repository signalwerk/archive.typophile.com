      <p>I have to wonder at your question, since it's been dealt with extensively in this thread, including by some of your colleagues: No, the act of downloading is not illegal per se. As to the use, it may or may not be legal, regardless of the source of the font.</p>
      <p>There is a fundamental flaw in your post, which you may refuse to acknowledge, but that's ok, since the law is the law no matter what you or I think, and the flaw is this: a licensed use is lawful, but an unlicensed use is not necessarily unlawful, since the law gives users rights, too. So, a creator might say, I don't allow my work to be used by X for purpose Y, and the law would answer that the creator's permission is not required. The fact that copyright exists in fonts, in countries where it does exist, does not mean that the rights of the copyright holder are unlimited, but that the font is property to the extent the statute says so and no more. If that is not clear to you, I can refer you to some good sources from Australia and other common law jurisdictions.</p>
