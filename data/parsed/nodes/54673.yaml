      <p>&gt; Is it illegal to download illegally uploaded fonts?</p>
      <p>Generally speaking, you must distinguish two cases:</p>
      <p>1) If the design for the downloaded font had been registered (e.g. at the design office in Alicante for Europe) and the registration was valid and is has not yet expired, then downloading of fonts whose design was registered is illegal, if the downloader lives in Europe or in the country where the font had been registered.</p>
      <p>2) If the design for the downloaded font was not registered and if the downloader of the uploaded font never concluded any contract with the seller of the font, there does not exist any contractual (or EULA) link between downloader and seller of the font with the consequence that the downloader can only be sued, if the seller proves that the font is a computer program the source code of which was written by a natural person. Nobody can prove this, because fonts are not computer programs written by natural authors. Even Chief Justice Roberts (who was recently seen at the Obama swearing ceremony) would never swear that fonts are computer programs (see <a href="http://www.sanskritweb.net/forgers/publicdomain.pdf" title="http://www.sanskritweb.net/forgers/publicdomain.pdf">http://www.sanskritweb.net/forgers/publicdomain.pdf</a>, pages 2). The fairy tale that fonts are computer programs or "software" was invented to cheat dimwitted font buyers. No sane person believes this rubbish, let alone the American Chief Justice Roberts.</p>
    html_clean: |-
