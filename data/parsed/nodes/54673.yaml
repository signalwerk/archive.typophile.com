      <p>If I understand these OpenType specifications correctly, then GSUB definitions, which at first glance look, as if they were the source code of an executable computer program, are not compiled into an executable program, but instead a non-executable lookup data table is generated on the basis of this pseudo code. If my assumption is correct, then OpenType features are not computer programs, but only binary data, i.e. binary lookup tables. But those who are more familiar with the internal structure of OpenType features may correct me.</p>
