      <p>Vertex:</p>
      <p>&gt; And code is software</p>
      <p>Da Sie Österreicher sind, zitiere ich das österreichische Urhebergesetz:<br>
      <cite><br>
      § 2. Werke der Literatur im Sinne dieses Gesetzes sind: 1. Sprachwerke aller Art einschließlich Computerprogrammen (§ 40a);<br>
      ...<br>
      § 40a. (1) Computerprogramme sind Werke im Sinn dieses Gesetzes, wenn sie das Ergebnis der eigenen geistigen Schöpfung ihres Urhebers sind.<br>
      </cite><br>
      Damit gelten meine urheberrechtlichen Erläuterungen</p>
      <p><a href="http://www.sanskritweb.net/forgers/computerprogramm.pdf" title="http://www.sanskritweb.net/forgers/computerprogramm.pdf">http://www.sanskritweb.net/forgers/computerprogramm.pdf</a></p>
      <p>auch für Österreich.</p>
      <p>Verwenden Sie bitte nicht das unklare Wort "Software", denn das österreichische Urhebergesetz spricht von "Computerprogramm", nicht von "Software". (Das amerikanische Urhebergesetz spricht übrigens auch nicht von "software", sondern nur von "computer program".)</p>
      <p>Umstritten ist beispielsweise, ob die Hints von PS und OTF fonts als Computerprogramm einzustufen sind. Aber selbst, wenn man sie als solche einstuft, scheitert die Schutzfähigkeit derselben daran, daß sie <strong>nicht</strong> "das Ergebnis der <strong>eigenen</strong> geistigen Schöpfung ihres Urhebers sind".</p>
      <p>Wenn man z.B. Adobe-AFDKO startet und dann</p>
      <p>   autohint -a AGaramondPro-Regular.otf</p>
      <p>eingibt, wird dieser OTF-Font automatisch gehintet. Aber diese Befehlzeile ist keine "eigene geistige Schöpfung ihres Urhebers", und folglich sind die Hints bei sämtlichen Adobe-Fonts nicht urheberrechtlich geschützt, weil sie allesamt automatisch generiert wurden.</p>
