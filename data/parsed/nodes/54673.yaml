      <p>That's what's done by the major font sellers. Most font designers receive no royalties at all for the fonts sold by Linotype, Monotype, Berthold, etc. If fonts were copyrightable, then even decades after the designers's death, their heirs could claim royalties. But neither Max Miedinger nor his heirs receive royalties from Linotype for the sale of Helvetica. This means that Linotype, Monotype, Berthold, etc. <cite>"take the fruit of another's labor without remuneration"</cite>, as you put it. There are exceptions to this rule (Adrian Frutiger, Hermann Zapf, etc.), but for more the majority of fonts sold by Linotype, Monotype, Berthold, etc., this rule is valid.</p>
