      <p>EK:</p>
      <p>&gt; <cite>who said anything about writing by hand?</cite></p>
      <p>Nowadays, it is possible to produce "computer-generated works" instead of writing works "by hand".</p>
      <p>see <a href="https://web.archive.org/web/20150124161550/http://www.law.duke.edu/journals/dltr/articles/2001dltr0024.html" title="www.law.duke.edu/journals/dltr/articles/2001dltr0024.html">www.law.duke.edu/journals/dltr/articles/2001dltr0024.html</a></p>
      <p>A typical example of computer-generated works is the conversion of fonts from one format to another. Let's assume, you have 1000 fonts in PostScript format, which you want to convert to TrueType fonts. If you use a converter (e.g. TransType, see <a href="https://web.archive.org/web/20150124161550/http://www.fontlab.com/font-converter/transtype" title="www.fontlab.com/font-converter/transtype">www.fontlab.com/font-converter/transtype</a>), your only own "creative" activity will consist in clicking on the folder, so that the converter knows the fonts you want to convert. Then, it generates fully automatically 1000 TrueType fonts as computer-generated works.</p>
      <p>Do you think you have become the author of 1000 copyrightable works?</p>
