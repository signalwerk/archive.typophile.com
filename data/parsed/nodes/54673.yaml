      <p>Laurentius:</p>
      <p>As you have a command of the German language, you should read this German document:</p>
      <p><a href="http://www.sanskritweb.net/forgers/eula.pdf" title="http://www.sanskritweb.net/forgers/eula.pdf">http://www.sanskritweb.net/forgers/eula.pdf</a></p>
      <p>dealings with "The EULA Fraud and How to Get a Legal Remedy".</p>
      <p>Since e.g. the German Fontshop (<a href="http://www.fontshop.de" title="www.fontshop.de">www.fontshop.de</a>) claims that fonts are "computer programs" ("software") and sells "licences" to such claimed "computer programs", you may do the following:</p>
      <p>Insert the name of the desired font into the German-language affidavit form on page 5 of the above document eula.pdf and send it to Fontshop in Germany for signing this written affidavit concerning the desired font.</p>
      <p>If Fontshop refuses to sign the affidavit, you know that Fontshop falsely claims that fonts are "computer programs" and that Fontshop "sells licences" to non-existing copyrights.</p>
      <p>It is evident that you cannot grant a copyright licence to something that is not copyrighted, as everyone understands who is "sane in the brain".</p>
      <p>If Fontshop refuses to sign the affidavit, you know that the desired font is not copyrighted, and therefore you can do with this font whatever you want to do, as far as the <strong>copyright law</strong> is concerned.</p>
      <p>This means that all this does not apply to fonts as far as the <strong>design law</strong> is concerned and which have been validly registered as designs as mentioned above in this thread, because the valid registration as font design protects all forms of the font, even font computer files which are no computer programs. It should be noted, however, that most registered font designs are invalid, because most font designs do not meet the requirements of novelty and individuality (see e.g. the Segoe-Frutiger lawsuit).</p>
