      <p>First of all: Excuse my English skills.-I know they are worst.</p>
      <p>Dear Uli, I know that it isn’t up to you to justify this never ending European Union Regulations nonsense. Once again we are discussing about a »curvature of a cucumber« EC Regulation.</p>
      <p>Refering to the Microsoft vs. Linotype (Segoe / Frutiger Next) case:</p>
      <p>How can an EC Regulation determine that »similar« is »identical«. </p>
      <p>Furthermore, if similar is identical; - how can a judge establish the criteria what is similar or identical in case of a typeface?</p>
      <p>Perhaps a stupid example: I suppose everybody knows »Marilyn«, an artwork of Andy Warhol. My question: Is Marilyn 1 similar to Marilyn 2 or 3 or 4 …….. . If they are similar, they are identical (in the opinion of the EU). That means buying Marilyn 1 I bought even Marylin 2, 3, 4, etc. because they are identical. - »Good night Europe«</p>
      <p>Another example: Personally I’m »forging« fleurons, ornaments etc. from old »Foundry Specimen Books«. Actually I’m »forging« calligraphic ornaments from Richard Gans Foundry, Madrid. If you look at this <a class="freelinking external" href="http://www.typoatelier.com/muster/RGans.jpg" rel="nofollow">example</a> from a Gans Specimen Book from 1922 you will note, that the ornaments are similar but not identical. Why should Gans map those similar ornaments in his specimen if they are identical? Because of their different size? -I don’t think so.     </p>
      <p>An additional point: It seems that no one in the EU knows the difference between a typeface and a font file. It’s the same difference as between a vector graphic and a .svg file. The graphic is artwork the .svg file is markup or better: code. And code is software.-At least in my humble opinion.</p>
