      <p>To nit-pik, I'm not sure in what context it'd ever be illegal to 'upload' a font.</p>
      <p>Putting a file on a server, in and of itself, doesn't typically have any 'illegal' connotations to it.</p>
      <p>Now if this server happens to be public, and advertises the fact you can download copies of the file from it, then one could argue there was intent involved and said intent could be construed as being illegal.</p>
      <p>Bottom line, if the digital files are protected by copyright or licensing or the like, then yea, any use outside of those parameters could easily be illegal.</p>
