      <p>In Canada, “every original literary, dramatic, musical and artistic work” is subject to copyright. "Literary work" includes computer programs, and "computer program" means "a set of instructions or statements, expressed, fixed, embodied or stored in any manner, that is to be used directly or indirectly in a computer in order to bring about a specific result".</p>
      <p>However, in Canada, downloading for private study or other fair dealing purpose is not illegal even if the uploading was illegal.</p>
