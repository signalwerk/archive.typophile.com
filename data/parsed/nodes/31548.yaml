      <p><em>Really</em> dislike the kerning on that film poster, especially the 1–10.</p>
      <p>It seems to me that you are trying to create a homage piece to Build rather than Helvetica and the underline style used as a background highlight feature is ubiquitous in magazines at the moment.<br>
      Saying that, I rather like your first image or rather the concept, you could think about not using Helvetica in the text, something like, ‘I considered many typefaces for this poster’. If you stick with your original concept I would look at making the amount of bar that appears behind the characters projects a similar visual amount on the righthand rag. You could also think about what you should consider before using Helvetica, for example the rn combination that can appear as m.<br>
      If you consider using the People who like… concept, you should have a careful look at the kerning of the / (and the spelling, even if it is as you researched, it should be spelt correctly).</p>
      <p>Tim</p>
