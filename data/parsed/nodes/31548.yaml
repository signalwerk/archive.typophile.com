      <p>thanks for the comments.</p>
      <p>The research into lazy designers comes from the work placements iv been on and my peers, there was many a time on  placements where designers around me would say 'oh just shove it in helvetica for now'. However of course im sure most good and great designers think before they design. But theres certainly a lot of bad designers around...</p>
      <p>Actually the 'fifty years of Helvetica' bothers me, im not sure how to treat it...</p>
      <p>Thanks</p>
      <p>Other ideas iv had for this project are:</p>
      <p>-Somehow utilising the 51 weights of 'neue' in reference to the 50 years, although im not sure if it is considered helvetica neues 50th anniversary as it was obviously done later.</p>
      <p>-Printing the words 'fifty years of Helvetica' in a white ink over white paper, in reference to Helvetica being 'invisible', in for example a city, its everywhere but nobody sees it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/other-ideas_4956.jpg"></div><p></p>
      <p>these are quick mock ups of ideas.....The first one came out of research on a site that listed products and then listed what other products people also like, i typed Helevtica in and got some bazarre results like 'robert deNero', and i thought it was strange because you could never define what someone who likes Helvetica also likes because it has mass appeal. I like this idea however it doesnt do much to comment on the '50 years of Helvetica'</p>
      <p>The second idea, on the right, is in reference to how Helvetica in a city environment is walked passed without people looking, they assume what the sign says, if aa toilet sign was spelt wrong i dont think people would really notice. Actually this idea is awful haha.</p>
      <p>Ive got about 1 week left to settle on an idea and produce that poster. If anyone has any views on Helvetica that could lead to a good poster idea id be very thankful to hear them.</p>
