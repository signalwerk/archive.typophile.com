      <p>I disagree that you should add "or not-" it is simply redundant. Your statement here makes perfect sense without it. Therefore it is superfluous.</p>
      <p>I'm curious about your research that shows designers set things in Helvetica without thought. My intuition would say most serious or good designers always put some thought into their choice of typeface, for even the smallest application.</p>
      <p>I do think it works. I think it's witty and the irony comes across pretty clearly. I'm not sure about the "trendy" and "throw-away" part to give doubt as to whether you spent time choosing the typeface. I could imagine the designer of this poster didn't spend too much time debating whether to use Helvetica, because it seems entirely appropriate for the job. The statement, then, would refer to Helvetica's rich cultural heritage and the love/hate relationship contemporary designers have with it, and NOT to any actual choice about using it.</p>
      <p>PS I happen to be a designer, not a typographer.</p>
