    html: <p>Gerald, I disagree. <br> <br>Opentype has made so-called "fine typography" accessible for the people, and not only those that speak English. (I think the trend for making fonts for the world and not just the few that speak English is a positive trend in the world of typography.) I see nothing wrong with that.  <br> <br>It has also made some of the minutiae of typography a little easier. I also see nothing wrong with that. At the end of the day, even with opentype fonts, the designer/typographer still has to futz with the spacing, decide smallcaps or italic, choose a weight ... and on and on and on ...  <br> <br>Even though the font software might be cross-platform, I doubt the licenses allow for twice the installs. Each install counts as an install. I personally don't think that is one of the greatest features. It doesn't benefit me, as I don't use PC computers. (Not that there is anything wrong with PC computers). <br> <br>Another thing about accents ... Accents are part of the cultures of other languages, aren't they? It would be boring and sad and safe and bland to castrate those languages which depend upon accents and make them conform to a so-called preferred (more bland) looking page. <br> <br>I wish I did speak another language. (I only speak enough Italian to get myself into trouble.) If I did speak another language it would be to embrace the differences, not to find the similarities.</p>
