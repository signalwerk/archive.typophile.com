    html: <p>LOL, I was hoping you would enlighten me, Thom, on which points were valid! The part that intrigued me, I guess, was the artist vs. the programer notion, just simply because i'm not much of either! I realize that Mr. Nader's philosophy &amp; practices run contrary to the majority, but i was hoping for some level headed discussion about some of the issues he addresses, i realize that this article is written as a propaganda (just check out that closing line!) but can i just have some commentary on this to help sort out the facts sans the drama. (I hate drama, unless it's a good classic tragedy) So no name calling! I just want the facts and some good solid opinions. Or is that too much to ask?</p>
