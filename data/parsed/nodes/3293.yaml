  - id: 25580
    user: 909
    date: 2004-02-24T17:49:00
    date_raw: 24.Feb.2004 5.49pm
    votes: null
    html: <p>Oh, fine, I'll dissect the article. <br> <br>First off, it's certainly true that with the *current* state of OpenType development tools, it takes a moderately technical mindset to develop feature-ful OpenType fonts with lots of goodies. <br> <br>That being said, one of the beauties of OpenType is that it frees the type designer from the arbitrary character set and encoding constraints of Type 1 and TrueType (though at least TrueType had more flexibility on the language support side). Speaking as a designer, if I want to throw in just one extra ligature or a couple of alternate characters or whatever into my font, I can. <br> <br>The new technology doesn't remove the critical role of the type designer any more than any other type technology has done. To be sure there is a new kind of technical type development role, for people who know how to make OpenType features work, but the general category of technical type development roles as distinct from type designers has existed for at least a century, perhaps more. <br> <br>On to other stuff, from the top.... <br> <br> <br>I disagree with Nader's opinion of how "the user" is the lowest common denominator and is responsible for the degradation of technologies and typography. If this were true, each technology would go downhill from the time of its introduction (created by engineers and designers) until being replaced by something else. In fact, each technology has generally improved steadily, being ever refined, until replaced by something else that offers some significant advantages, even though the new tech has some rough edges. Those rough edges are generally fixed over time. The first DTP was pretty bad in some ways, mostly due to resolution limitations. But it improved. <br> <br>Nader claims that OpenType makes it possible to do "things like report usage statistics to the manufacturer through online connections, keep logs of certain things, conduct machine surveys, enforce usage parameters, and all kinds of actions that some people might consider malicious, intrusive, or reckless." <br> <br>This is almost entirely untrue. The only "usage parameter" existent in OpenType that I can think of is the fsType embedding bit, which specifies the type developers' desires as far as how the fonts can be embedded. This is present in TrueType as well, so is not new to OpenType. The rest as far as I know is pure fantasy, but to whatever extent it is true it would be true only of TrueType flavored OpenType, and only to the exact same extent it's true of TrueType. <br> <br>"Open Type technology itself is in fact so open that it is certainly possible to place a viral element inside a font, or make the font activate or deactivate system modules or, as has already been proven, even cause a machine to restart itself no matter what tasks are running or which work has been saved." <br> <br>Again, this is largely nonsense. Until recently, it was possible to make a font in any major format (Type 1, TrueType, OpenType with either kind of outlines) that would cause Windows to blue screen or reboot. These security problems have been solved. However, there was nothing "viral" about it, it was simply bad fonts that could cause crashes. No self-replication or infection of any sort. Also nothing particularly unique to OpenType. <br> <br>However, I do think that Nader is largely right that if user's expectations go way up, it will be hard on type designers who have to produce a lot more glyphs. Today's better tools will reduce the time to add more glyphs, but it's still a noticeable extra amount of work. It is not clear to me that this change will happen, as there are an awful lot of existing typefaces that do not have tons of extra goodies, and many of those don't particularly need to be extended to a bigger glyph complement. <br> <br> <br> <br>I mostly disagree about the comments about IP. These are at most extensions to existing works, not clones or knockoffs. The comparisons made here are inappropriate. <br> <br>Nader's claims about Lithos are misleading at best, as Carol was personally involved in the extensions to her design. The "figure variations" are not oldstyle figures, but simply smaller versions of the full-size figures, to go with the small caps. Adobe does generally credit the people who do major extensions to typefaces, which is why Myriad Pro now lists Fred Brady and Christopher Slye, who did the Myriad Pro Cyrillic and Greek coverage (respectively) with Robert Slimbach as art director. <br> <br>I agree that as type tech advances there have been tradeoffs and we've had to give up things to gain other things. But what almost always happens is that some of those things that have been sacrificed are able to come back as the next generation of technology improves. <br> <br>The speculation that the "underground" might somehow as a group tend to outdo the above-ground developers in typographic innovation is pretty laughable to me. After all, the average shareware font has significantly less than a full Win-ANSI or MacRoman character set. Probably a few people will do some very cool stuff, but the existence of cool technology won't change the average state of shareware. How many superhinted TrueType fonts have you seen as shareware? <br> <br>The last section ("what are we sacrificing?") is pretty fantastical to my mind, and hardly worth commenting on. <br> <br>So, those are my thoughts. <br> <br>Regards, <br> <br>T</p>
