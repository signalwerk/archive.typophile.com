    <p>okay, so i know that Mr. Frederick Nader is rather infamous on these forums, but i was cruising all my old font links today and noticed that he had a rather interesting article up on apostropic lab's website here: <a href="http://www.hardcovermedia.com/lab/articles/ot.htm" target="_blank">http://www.hardcovermedia.com/lab/articles/ot.htm</a> <br>i was wondering if there had already been some discussion along these lines (since i'm new to these forums) that anyone could point me to. I think Mr. Nader makes some interesting assertions and would love to read some further commentary on the topics addressed in this article. (oh, and if you want a laff, check out the article on how many font designers it takes to change a light bulb, hilarious!)</p>
