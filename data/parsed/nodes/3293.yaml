    html: <p>What do I think of the article? I think that those readers who enjoy recreational drugs should ask him to share, since obviously he's got some pretty powerful stuff. <br> <br>Many of the assertions in this article are simply factually false, and many others are misleading at best. Plus he's got some axes to grind. The combination makes it pretty absurd. There are a couple of other folks out there who operate in a similar alternate universe, but luckily none of them are all that prominent. <br> <br>I seem to recall that there are some perfectly good points as well in there, but it's hard to distinguish them from the rubbish. I suppose I could go through it again... (shudder). <br> <br>Regards, <br> <br>T</p>
