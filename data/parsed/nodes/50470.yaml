      <p>font design copyrights will have the following results:</p>
      <p>1) all existing activities will continue.<br>
      2) countless students will be criminalized.<br>
      3) font foundries will add more legal fees to their expenses and then to their prices.<br>
      4) numerous design ideas will become off limits due to vague accusations of similarity.<br>
      5) the definition of inspiration and interpretation will be left to lawyers and judges.<br>
      6) numerous existing fonts will become evidence in labyrinthine legal arguments, setting confusing and contradictory precedents.</p>
      <p>it's a terrible idea, sure to be a nightmare for everyone. </p>
      <p>i understand and appreciate the hard work that goes into font design. i buy my fonts legally. but they are TOOLS afterall. they are not the creative end product. restrictive EULA's are offensive enough. this would tip the balance into destructive chaos, with only lawyers reaping any benefits.</p>
