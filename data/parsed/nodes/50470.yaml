      <p>Who will regret what ? ? </p>
      <p>&gt;Re. the Rimmer italic.</p>
      <p>Come on, John, nobody is confused about whether Jim Rimmer has designed an italic for them or not. This is something that one knows.  </p>
      <p>Not even poor little Gerald Giampa (who I think went a little too far when he asked the OpenType list to contribute funds to his household as he was having to burn his furniture in the stove for it was so <em>very</em> cold) is capable of being confused about such a thing.</p>
      <p>And to suppose that Mike Parker, that canny businessman and entrepreneur, could be confused about any of this, defies credibility. </p>
      <p>There is not a single piece of independently verifiable evidence to connect Starling Burgess to the Times typeface.</p>
      <p>I would be the first to applaud if there were. I would be thrilled. </p>
      <p>But this is just an amusing hoax that doesn't even rise to the level of the pranks that are occasionally inserted into the august Grove Dictionary of Music and Musicians. However, it has served its purpose, which was to distentangle Giampa from Monotype's legal eagles. Now that Gerald's Lanston/Monotype establishment doesn't seem to exist anymore, why doesn't everyone just come clean? Even Trever-Roper admitted he had been had. It doesn't seem to have done irreparable harm, long-term, to his reputation.</p>
