      <p>Bill, re. Burgess and Times:</p>
      <p>There are two separate questions here:</p>
      <p>1. Does the typeface we know as Times New Roman significantly pre-date the 1931 British provenance?<br>
      2. Was this typeface in fact designed by Starling Burgess?</p>
      <p>Obviously a positive answer to the second question relies upon a positive answer to the first question, but other than that they are quite separate questions.</p>
      <p>I don't think the link to Burgess has been proven. Proof would require physical evidence that unambiguously links the design to Burgess (letters, signed drawings, etc.), and so far as I am aware such evidence has not been found.</p>
      <p>But the material evidence of the two-part patterns and their numbering -- if they are genuine --, suggests very strongly a design that significantly pre-dates 1931. The attribution to Burgess, the background of corporate rivalry and distrust, etc. are interesting, but ultimately matters of interpretation rather than fact. The patterns are either deliberate hoax or they are historical artefacts, and if the latter then they raise serious questions about the date of the design of Times New Roman, because such patterns are associated with an manufacturing process.</p>
      <p>[By the way, whatever else may come of this issue, Mike's work documenting the series numbering of Lanston types, their italic set systems, and other aspects of the manufactuing of Monotype faces, as recorded in the appendices to his <em>Printing History</em> represent a significant work of historical investigation that deserves to be acknowledged in its own right.]<br>
      ___</p>
      <p>Re. the Rimmer italic. I think the confusion over this is due to the fact that Giampa was never clear about the provenance of the italic drawing. He wasn't when he showed it to me, more than a decade ago, at his workshop in Vancouver. It was identified only as trial drawings for the Burgess italic, which Gerald was planning to release as a digital type. He didn't specify that it was designed by Jim as a companion for the Roman, and left the interpretation open that it was in some way connected with Burgess or with the original design. Disingenuous to say the least.</p>
