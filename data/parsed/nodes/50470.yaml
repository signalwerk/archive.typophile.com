      <p>I chatted with some top Monotype folks a few years after Parker published the two-part Burgess article. My recollection is that they said quite explicitly that they had never heard of this "bond of confidentiality" and suggested that if it existed, Giampa could show it to them.</p>
      <p>In a similar vein, Rich and Carima at P22 purchased the Lanston Monotype assets, and they have said since that they have seen no trace of the bond of confidentiality nor of anything else relating to Times/Burgess, and believe it to have been a hoax.</p>
