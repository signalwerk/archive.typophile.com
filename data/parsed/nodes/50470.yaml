      <p>Charles raises an interesting point. You have to wonder, sometimes, if this industry deserves better copyright protection, and it did, whether it would be beneficial. The present design patent system is practically useless as the examiner seems to take the case as presented, regardless of merit. But had we a system such as the German one that found Segoe was virtually identical to Frutiger, then Myriad would probably also be considered identical to Frutiger. No less an authority than Frutiger himself considered it so.</p>
      <p>As for Burgess - - has a shred of independent evidence emerged to support the theory that this man, never hitherto associated with type - - was capable of designing TNR or any other typeface? Has a single page of a single book in Times printed before 1932 emerged? Where are the secret 'bonds' between the corporations that Mike Parker talks about? I retain my belief that Mike Parker has perpetrated a marvellous prank. There is not a single piece of verifiable evidence to support it as history.</p>
      <p>The Burgess case only illustrates how shallow a case we have to make for type copyright.</p>
