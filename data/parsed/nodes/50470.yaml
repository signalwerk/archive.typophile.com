      <p>&gt;Re. the ’bond of confidentiality’: so far as I am aware, Monotype have never disputed the existence of such a document, nor have Linotype or the Times newspapers who, according to Mike, were the other signatories.</p>
      <p>You could just as well assume that they thought it was too childish (or too churlish) to respond to.</p>
      <p>Regardless of all that precedes this, one must ask oneself how on earth it is that a complete newcomer to type design could possibly have designed a typeface of such innate quality (let the naysayers to that assertion remember that it is Robert Slimbach's favourite typeface) without a very near model? I am inclined to accept the traditional assertion that it was closely based on Plantin, a typeface of remarkable quality in metal form that still awaits a passable digital reawakening.</p>
      <p>One must also ask, what, of the available evidence, could have been forged on lonely nights at Prince Edwards Island or whererever Giampa was conducting his business? What alternative explanations are there? And why are there so many schoolboy holes in it all? </p>
      <p>Finally, I must admit that I do have a nagging doubt about the transformation of Plantin into Times. Plantin, in metal, is a typeface of phenomenal refinement, much more so than Times. Surely, a successor would have been even more refined. I can't quite put it into words, but if you asked me to consider the dating of Times and Plantin quite independently, I think I would have to guess that Times preceded it. Times does, indeed, have something intangible that seems to place it firmly in an earlier period.</p>
