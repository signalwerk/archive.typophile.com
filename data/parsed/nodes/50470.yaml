      <p>Bill, I'm not very interested in the Burgess side of things. There is evidence of his involvement in private publishing in the relevant period, but since there isn't a definitive link to the design I don't think there is much to be gained in the debate either way. Burgess is Mike's thing, not mine.</p>
      <p>The patterns to which I refer are the two-part brass patterns in which letters have been cut from one sheet of brass which has then been affixed to a backing sheet. It is this process, along with the stamped series number 54, that suggest an early initial manufacturing, because this process was no longer in use in 1932. By that time, patterns were being cut in relief on a single piece of brass. These patterns have been photographed, and appear on the front cover of the issue of <em>Printing History</em> that contained Mike's initial article on the subject. I held one of the patterns in my hand when I visited Gerald in the early '90s.</p>
      <p>The patterns have two sets of series numbers on them: 54 and 362, the latter being the Times series number. The style of numbers used in the stamps is consistent with the two periods. Nicholas Barker suggested that the displacement of metal caused by the stamping might indicate that the 54 was stamped after ther 362 -- a point that I raised from the audience in challenge to Mike's recent TypeCon lecture --, but Mike counters that this would only be the case if a punch with a tapered shank we used to stamp the numbers, whereas a punch on a flat face would flatten the area around the numbers as consistent with the patterns. This doesn't prove that either set of numbers was stamped before the other, but leaves the question open.</p>
      <p>It is the kind of pattern that continues to leave me unconvinced that this is a hoax. The two-part pattern is not something that there is any reason to have made in the 1930s; indeed, the contemporary equipment and processes in both the UK and USA were tailored to single piece patterns. But if these were forgeries, why would they be stamped with the 362 Times series number?</p>
      <p>It is a while since I've paid anything like significant attention to this issue: I decided long ago that it was unlikely to be definitively resolved. But I do think the question is still open and not, as you suggest, a foregone conclusion. There is also material evidence in terms of drawings at the Smithsonian, about which I don't remember the details, and early trials of a remarkably Times-like type for <em>Time</em> magazine that precede 1932.</p>
      <p>Re. the 'bond of confidentiality': so far as I am aware, Monotype have never disputed the existence of such a document, nor have Linotype or the Times newspapers who, according to Mike, were the other signatories.</p>
