      <p>&gt;&gt;Where are the secret ’bonds’ between the corporations that Mike Parker talks about?</p>
      <p>&gt;Why don’t you call him up and ask? Mike’s a very friendly guy and loves to talk about type history.&lt;</p>
      <p>Because I don't think Mike is ready to come clean. </p>
      <p>If anything were more decisive than another, it would be Jim Rimmer's unimpeachable statement that the italic attributed to 'Burgess' was in fact designed by him. That's OK. We know Jim Rimmer is a type designer and a very, very good one. We know little of Starling Burgess except that he was never a type designer.</p>
      <p>Nobody has ever shown an original drawing. Everything we have been allowed to see has been digitized. And all the 'secret agreements' from 1960 which Mike Parker speaks of - - where are they? Why has nobody managed to photograph or scan one of them?</p>
      <p>And why has nobody, a hundred years later, been able to discover a single page printed in TNR before 1932? </p>
      <p>What we do know is that Gerald Giampa needed his skin saved in his legal skirmishes with Monotype, and that Mike Parker was the knight to come to the poor fellow's rescue. And we also know that the level of philistinism at Monotype was so incalculably high that ... it was almost a pushover.</p>
      <p>I'm still waiting for original documents, original drawings, original anything.</p>
      <p>There still isn't any.</p>
