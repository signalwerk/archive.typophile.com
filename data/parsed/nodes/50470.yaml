      <p>Bill,</p>
      <p>In some ways, all you're saying is that major corporations are acting like major corporations. I remember the head of General Motors saying that the reason GM built all those SUVs was because that's what the public demanded -- never mind the ad campaigns that created the demand, the lobbying dollars to keep the fleet standard gas mileage from including SUVs, etc.</p>
      <p>* * *</p>
      <p>Adobe got a patent on the paragraph optimization routine used in InDesign. As I remember, Donald Knuth's remark was, essentially, he didn't see the basis for it. On the other hand, you can't really expect Adobe to sink all that development money into InDesign without some protection.</p>
      <p>As for Mike Parker &amp; Font Bureau, their license prohibits a couple of things vital in my line of work, things which Adobe allows. When we did some testing on FB Julianna, the documents we had to sign (&amp; which I objected to) apparently addressed concerns of Parker -- that somebody was apt to steal the font if embedding in a PFD was allowed.</p>
      <p>To paraphrase a remark about the deity &amp; armies, governments enlist on the side of the most (expensive) lawyers.</p>
