    <p>Can I get some suggestions on a couple typefaces when you think of the words “Aztec” and “Mexico”? One direction I’m looking into is using the Aztec pictogram (<a href="http://www.myfonts.com/fonts/ihof/p22-mexican-relics/p22-mexican-relics/" title="http://www.myfonts.com/fonts/ihof/p22-mexican-relics/p22-mexican-relics/">http://www.myfonts.com/fonts/ihof/p22-mexican-relics/p22-mexican-relics/</a>)and some type that would go with it. The other direction is just getting the feeling of the mexican culture.</p>
