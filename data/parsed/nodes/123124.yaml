      <p>No, haven't used it for years and notoriously un-accurate (potentially part of their business model). I use only <a class="freelinking external" href="http://www.whatfontis.com" rel="nofollow">WhatFontiS</a> when I lack alternative suggestions and it has always been of a big help.<br>
      This spurred /U was the earmark and rang the bell of Sackers Roman. /S looked also very close so decided to share my thought about it.</p>
