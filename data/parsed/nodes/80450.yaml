      <p>Three or four lines is a matter of preference. Your other questions though, they are great! You have realized the geometry might be correct, but nevertheless things don't look right. Trust your eyes! Do the adjustments! And do read up on geometric type and study actual typefaces, because there are a lot of ways to go wrong. </p>
