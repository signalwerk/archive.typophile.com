  html: "<p>this isn't my homework or anything but might anyone know the answers to these questions? <br> <br>1. The first printer to use a woodcut border was: <br>A. Nicolaus Jenson <br>B. Aldus Manutius <br>C. Erhard Ratdolt <br>D. Antond Koberger <br>E. Johannes Schonsperger <br> <br>2. Which of these punchcutters or printers did NOT create a transitional type? <br>A. John Baskerville <br>B. Pierre-Simon Fournier <br>C. Johan Michel Fleischmann <br>D. Philippe Grandjean <br>E. Vincent Figgins <br> <br>3. The gout Hollandois (Dutch taste) in type is characterized by: <br>A. Ornamentation <br>B. Swash Capitals <br>C. All x-height and condensed width lowercase letters <br>D. bracketed serifs <br>E. vertical stress <br> <br>4. Which typeface was the first to have an italic not influenced by calligraphy or writing? <br>A. Caslon <br>B. Fournier <br>C. Romain du Roi <br>D. Baskerville <br>E. Garamond <br> <br>Thanks to anyone who helps to answer these questions!</p>"
  html_clean: "<p>this isn't my homework or anything but might anyone know the answers to these questions? <br> <br>1. The first printer to use a woodcut border was: <br>A. Nicolaus Jenson <br>B. Aldus Manutius <br>C. Erhard Ratdolt <br>D. Antond Koberger <br>E. Johannes Schonsperger <br> <br>2. Which of these punchcutters or printers did NOT create a transitional type? <br>A. John Baskerville <br>B. Pierre-Simon Fournier <br>C. Johan Michel Fleischmann <br>D. Philippe Grandjean <br>E. Vincent Figgins <br> <br>3. The gout Hollandois (Dutch taste) in type is characterized by: <br>A. Ornamentation <br>B. Swash Capitals <br>C. All x-height and condensed width lowercase letters <br>D. bracketed serifs <br>E. vertical stress <br> <br>4. Which typeface was the first to have an italic not influenced by calligraphy or writing? <br>A. Caslon <br>B. Fournier <br>C. Romain du Roi <br>D. Baskerville <br>E. Garamond <br> <br>Thanks to anyone who helps to answer these questions!</p>"
