    html: "<p>Russ -- <br> <br>You could probably find the answer to all of these in D.B. Updike's classic <i>Printing Types.</i> <br> <br>Off the top of my head: <br> <br>1) Sorry, don't know this without doing some research (which I don't have time for). <br> <br>2) C. Fleischmann's types would typically be characterized as Dutch oldstyle or Baroque, not Transitional. Though Figgins was mostly known for jobbing faces that aren't usually considered strictly Transitional, I believe he cut some text faces early on in a manner after Caslon and Baskerville. <br> <br>3) C. I believe it was Fournier who first used the term \"go</p>"
