    html: |-
      <p>Firstly I was using precomposed glyphs, but this causes very large fonts if you plan a wide language support and includes small caps (or, even worse, also petite caps and swashes). So I changed my procedure to this:</p>
      <p><strong>1</strong>. I added all precomposed base+diacritic coded in Unicode according to the language support.</p>
      <p><strong>2</strong>. Troublesome combinations, although unencoded, are also added as precomposed glyphs to produce proper design. </p>
      <p>For example: open E with ogonek has no codepoint in Unicode. But the ogonek connection is hardly good when associating base open E with the 'generic' ogonek, so I made a precomposed glyph (<a class="freelinking external" href="http://www.typophile.com/node/67787" rel="nofollow">sample</a>). The same with overlines and underlines, which length may coincide with base letter width. This is not possible combining 'generic' over/underlines with base glyphs and thus I added these as precomposed.</p>
      <p>Other tricky diacritics include slash, cedilla, horn and hook.</p>
      <p><strong>3</strong>. Remaining combinations will be done with mark/mkmk features and some contextual kerning (which can be set in the mark/mkmk code). As this feature is not supported by FontLab 5, it need to be made with other tool (as Khaled does) or you wait for FL6.</p>
      <p>Typical candidates for contextual kerning are base letters narrower than diacritics, as |f|i|j|l|r|t|.</p>
      <p><strong>4</strong>. Further improvement can be done with variations in combining diacritical marks: different glyphs for uppercase and lowercase use, for over and below positions and also for stacked diacritics (for example: dieresis and circumflex would be combined in a precomposed glyph where their design is changed to get better result).</p>
    html_clean: |-
