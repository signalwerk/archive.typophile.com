    html: |-
      <p>There is no <em>perfect</em> way, and (hopefully) people working with your zero-width diacritics are aware of that. Unless you make your font monospaced, of course! ;-)</p>
      <p>Theoretically, lower diacritics in italics should be offset a bit to the left, just as the upper ones should be offset to the right. I use something like an old-style 'phi' character -- an 'o' with a slighly slanted vertical line through it -- to visually align diacritics. But that's only going to look perfectly on the o's, slightly less so on a, e, g, n, and u, and like crap on an i, f, m or w; it's the same here as with the roman accents, only angled slightly.</p>
      <p>Theoretically (again), you should use the Opentype "mark" and "mkmk" features, which are designed <em>exactly</em> to deal with this; but I find programming them incredibly difficult, and the output software I use (Adobe InDesign) still doesn't support these features to the level I need it to.</p>
