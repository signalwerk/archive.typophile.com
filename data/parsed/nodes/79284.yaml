    html: |-
      <p>Ray,</p>
      <p>I do what Theunis does, except I always make up a precomposed character (and use ccmp). Remember to name the precomposed character with base names -- the *i* rather than the *dotlessi*. So, for example, an i with a macron and acute could be named uni012B0301, or uni006903040301. There would be no Unicode index assigned.</p>
      <p>The two possible names brings up one weakness in the system. AFAIK, there is no Unicode requirement to use one or the other. Since you never know what the user will do, safest is to have, in the ccmp</p>
      <p>sub i uni0304 by uni012B<br>
      sub uni012B uni0301 by uni012B0301</p>
      <p>(and remember that in FontLab, for example, uni0301 might be named "acutecomb", in which case the second item would be *sub uni012B acutecomb by uni012B0301*)</p>
      <p>which covers the two ways a user could enter the character. If you have a lot of these though, writing the ccmp feature can get pretty complex. See, for example, the ccmp for SIL's Charis.</p>
