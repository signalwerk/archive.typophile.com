      <p>Theunis,</p>
      <p>As I remember, you can't sub many from one in OT features. But even if you could, you would loose your imacron -- Unless you meant to break it apart, do all you combining with other accents, then rebuild it -- which would be just as much work.</p>
      <p>At our shop, we solve the issue by running a script on an incoming manuscript, so every Unicode character with a codepoint is so encoded, even if the author used combining accents in the manuscript. That means I know imacron is already a single character. But a customer using a script isn't something a font designer can count on . . .</p>
