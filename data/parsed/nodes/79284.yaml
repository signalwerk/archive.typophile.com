    date: 2011-02-20T23:29:00
    date_raw: 20 Feb 2011 — 11:29pm
    votes: null
    html: |-
      <p>I use John Hudson's method and it seems to get the desired effect:</p>
      <p>1. Design the spacing diacritic mark on the width of the lowercase o.</p>
      <p>2. For the combining diacritic mark use the spacing mark, then drag the left sidebearing onto the right.</p>
      <p>The result is a combining mark that will give good position over a preceding a, e or u -- and perfect position over the o.</p>
