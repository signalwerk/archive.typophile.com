      <p>Fun game. Anyone can play.  Slant Flama Bold Italic 10 degrees in Fontshop and the sloped vertical strokes on LEKRBFP etc. become precisely vertical. Slant the original image 10 degrees in your graphics program for comparison. Try the game with some of the other font candidates. Most of them do not have a slant of exactly 10 degrees and the mismatch becomes obvious.<br>
      Don</p>
