  html: |-
    <p>Hello, I'm a designer at an internet startup and as we grow and start to have more marketing material we are thinking of introducing another typeface into the mix. Currently on the website we use Metabold for most of our headers. Everything else is Lucida Grande except our logotype which is Museo. Thoughts?</p>
    <p>Also I help out the non-web side of the company with print collateral and sometimes have presentations to put together. For these I'll use Metabold still but am looking for a good typeface in place of Lucida to go with it. Any ideas?</p>
    <p>Thanks!</p>
