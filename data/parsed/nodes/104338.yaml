  html: |-
    <p>Hi, typophiles,</p>
    <p>Can anyone identify something close to either of these two typefaces on this book cover? (Jan Huizinga, In the Shadow of Tomorrow, 1936)?</p>
    <p>I realize it's hand-lettered, but anything close as a starting place would be a big help - with some attention to the detail/peculiarities, if possible.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Huizinga_6479.jpg"></div><p></p>
