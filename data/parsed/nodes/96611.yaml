    <p>I'm looking for a typaface as similar as possible to <a class="freelinking external" href="http://www.swisstypefaces.com/fonts/simplon-bp/" rel="nofollow">Simplon Mono</a>. I'm using Simplon Mono Bold and Light in headings for a corporate identity, but it is not yet available as a webfont.</p>
    <p><a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-din-mono/" rel="nofollow">DIN Mono</a> is my best alternative, but it feels rather bland in comparison.. Any better?</p>
    <p>Thanks:-)</p>
