      <p>Vialog was designed by Werner Schneider and Helmet Ness (Fuenfwerken). They finished the font in order for it to be installed in Munich for the transit system there. They also did field tests in the city as well. The Munich airport is integrated into the city transit system, so I'm sure that you see it in the airport, too.</p>
      <p>Vialog has been used completely all through the Munich transit network (subway, streetcar, train, commuter rail, print as well as signage, etc.) since late 2001. It replaced the fonts that were used before it.</p>
