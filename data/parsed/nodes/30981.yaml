      <p>So a new candidate for my list would be Munich, but I'm nor sure if the Vialog font is a real metro font. This page says it has actually been designed for Munich airport: <a href="http://www.typeforum.de/news_359.htm">http://www.typeforum.de/news_359.htm</a> (in German) </p>
      <p>There's even another, earlier, font for Munich: Traffic (1969 by Otl Aicher, based on Univers), which is also used by the subway but was actually designed for the Munich airport, according to this page: <a href="http://www.konzeptundgestaltung.com/traffic_fsb.jpg">http://www.konzeptundgestaltung.com/traffic_fsb.jpg</a> (in German), while Linotype says "for Munich’s public transport services".</p>
      <p>A little disappointing because it's not clear whether these are metro fonts or not.</p>
