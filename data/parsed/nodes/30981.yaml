      <p><cite>The one in Milan was done by Bob Noorda in 1964 but ashamedly I don’t remember the face.</cite></p>
      <p>It was a custom Helvetica named "Noorda":<br>
      - shorter ascenders/descenders<br>
      - special weight (because of negative use: white on red)<br>
      - careful spacing and kerning</p>
      <p>They are replacing it with a standard one.</p>
