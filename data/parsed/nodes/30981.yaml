    <p>Hi all,</p>
    <p>Some metro/subway systems are using their own exclusively designed typefaces for signage and paperwork. I have created a page listing all of them I know of:</p>
    <p><a href="http://mic-ro.com/metro/metrofonts.html" title="http://mic-ro.com/metro/metrofonts.html">http://mic-ro.com/metro/metrofonts.html</a></p>
    <p>Do you know of more corporate metro/subway fonts? </p>
    <p>Thanks in advance<br>
    Mike</p>
