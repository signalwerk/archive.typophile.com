      <p>Not to rehash an old topic but I have to ask as I have found discrepancies while searching. The font that is on the Paris metro "Metropolitain" signs by Hector Guimard (in photo's) are different than all the fonts I found to be listed as Metropolitain or pertaining to be based on this type. The biggest difference that sticks out is the "M" and I haven't found a true version of what I see on the signs in Paris. I know the signs were hand painted and can vary from sign to sign but after looking at quite a few different signs, the font is more similar from sign to sign compared to the downloadable fonts I have found.</p>
