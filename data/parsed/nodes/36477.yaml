    html: <p>Even though I had never seen or heard anything about it prior to this past school year, SVA always has third year exchange students. I don’t know that they’re actually exchanged, but we certainly take a lot of foreigners for a semester at a time. In the past year I’ve seen Israelis, Norwegians and French exchange students, for whatever it’s worth I don’t see why India would be excluded, although dan_reynolds is right. It may require a little investigation...</p>
