      <p>Does NID have established, official exchange programs with any schools in English-speaking countries (they must have some already, right?)?</p>
      <p>For all practical purposes, students are usually limited to exchange programs with official exchange partners. Otherwise, you have to convince a school in a foreign country to take you on for a semester or year on your own merits, and you may have to pay their full tuition fees as well, which (in the UK and especially in the US) can quickly become extraordinary expensive.</p>
      <p>Presuming that NID already has established partners, why don’t you post the names of those partners here? Mostly, someone on Typophile will have direct (or at least second-hand) experience with the school(s), and can offer you specific feedback.</p>
