    html: <p>Here is some more of the ad. <br>It would have been printed at a single pass. <br>The illustrations were lithography (which commercially replaced engraving in the early 19th century), therefore the lettering would have been rendered in the same medium. <br>The captions are an ultra thin monolinear Egyptian. <br><img src="http://www.typophile.com/forums/messages/30/64676.jpg" alt="harmoniums"> <br>Influence went both ways between type and "plated" lettering (whether engraved or litho'd), but it certainly looks like the fellow who did the text here tried to imitate type, but was unable to restrain himself from putting fancy tails on his "y"s.</p>
