    votes: null
    html: "<p>I think Nick is probably correct about the lettering in the harmonium advertisement. It wouldn't be unusual for lithographic or engraved plates to be handlettered but made to look like type. [Indeed, the opposite is also true: neo-classical and romantic types were designed to look like engraved letters. Baskerville worked as an engraver before he took up printing and publishing.] <br> <br>But Hrant is right to point out that significant variation in letters can occur in letterpress printing. This <a href=\"http://www.tiro.com/John/Baskerville-a.jpg\">photograph</a> shows the many forms of a lowercase <i>a</i> that occur on a single page (p.183) of Baskerville's 1758 edition of <i>Paraside Lost.</i> As you can see, the variance is remarkable, affecting weight, proportion and shape of different aspects of the letter.</p>"
