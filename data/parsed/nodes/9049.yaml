    html: "<p>&lt;i&gt;So the other one you remember as being even cleaner?&lt;/i&gt; <br> <br>Much cleaner, and in a later style. It mimics either neo-classical or romantic types, I forget which: but with a vertical axis and high contrast, written with a split nib. In terms of the subject of this thread, it it more interesting than the <i>Paraphrasi</i> manuscript, which is remarkable for it neatness but still belongs to an age and style in which types were modelled on humanist roman and chancery italic hands, and in which writing masters were actively involved in the development of new types (Mardersteig thinks, for example, that Marcolini's italic types were based directly on Pietro Alluno's italic hand). But the later example to which I referred -- which I will try to find, because now it is bothering me -- belongs to an age when the division between chirographic and typographic letters had widened*  <br> <br> <br>*Although I think the romantic type design of Bodoni represents a step closer to a chirography than the preceding century or so of type design; we tend to miss this, because Bodoni revivals tend to be over-rationalised and because most British and North American calligraphy of the past hundred years is of the broad-nib, renaissance variety, rather than the split-nib baroque and romantic. <br>_____ <br> <br>Off topic, but speaking of Marcolini, can anyone interpret his allegorical printer's mark? The motto is 'Truth is the daughter of time', but I can't figure out who the third figure is, or what they're all doing. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/64680.jpg\" alt=\"Printer's mark of Francesco Marcolini da Forli\"></p>"
