    html: <p>All German invitations I ever got for the more “traditional” kind of wedding were in Chevalier or some sort of engravers or copperplate gothic. So I wouldn’t worry too much about this. I’d use just one typeface for the whole thing, maybe an elegant script. No blackletter (has rather a negative than a festive connotation).</p>
