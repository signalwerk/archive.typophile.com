    html: |-
      <p>In this day and age, even for traditional weddings people tend to print their invitations for themselves. So they'd use whatever they find on their computer and seems »elegant« to them.</p>
      <p>If they have a Mac, these would be the likeliest candidates: Apple Chancery, Zapfino, Palation Italic, Times Italic.</p>
      <p>If they know a designer with a Creative Suite, Bickham Script Pro.</p>
      <p>You could get an impression by image-googling for »Hochzeitseinladung«.</p>
