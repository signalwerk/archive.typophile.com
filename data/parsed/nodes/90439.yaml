  html: |-
    <p>i am designing a wedding invitation for a couple, he is american, she is german and thus the invitation has to be in both languages. i was wondering if anyone knew any german wedding faces? - all my searches get re-directed to horrible wedding sites and before i use Schwabacher or Fraktur, i wondered if anyone had any suggestions? or suggestions of where to find.</p>
    <p>also - is Goudy a bad choice for the aboves american counterpart?</p>
    <p>thank you</p>
