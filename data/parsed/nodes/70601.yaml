    <p>Hi all</p>
    <p>Simple question - is it possible to use tabular figures in Photoshop CS4.</p>
    <p>I'm using a font that I know has tabular figures but can't find any options to use them in<br>
    Photoshop's  Character palette - I can select old style figures but not tabular.</p>
    <p>Rr.</p>
