    <p>In the spirit of the prolific Chuck Norris thread, I thought I'd keep a running compilation of all the jokes. That way people can use this blog to post new jokes, even after the thread eventually dies.</p>
    <p>In the beginning was the Word. Then Chuck added other letters, numbers and signs.</p>
    <p>Some letters are so afraid of Chuck Norris that they form ligatures.</p>
    <p>FontLab never crashes for Chuck Norris.</p>
    <p>Chuck Norris can tell whether the font is Arial or Helvetica – blindfolded.</p>
    <p>Chuck Norris can literally draw a space glyph.</p>
    <p>Chuck Norris knows where the circle begins.</p>
    <p>Chuck Norris doesn’t have to make spacing and kerning, glyphs do that themselves.</p>
    <p>Chuck Norris can use zoom tool in FontLab up to the point where you can see specific atoms.</p>
    <p>It’s better not to see typefaces as good or bad; there is just a list of permitted fonts allowed to be (ab)used. List made by you know who.</p>
    <p>Chuck Norris doesn’t like children. That’s why Comic Sans is on that list.</p>
    <p>Chuck Norris once started designing a typeface when he was drunk. That night the “w” was born.</p>
    <p>Chuck Norris can SPEAK Braille</p>
    <p>Chuck Norris doesn't set type – he just throws all the letters together and expects each to know its role in his sentence.</p>
    <p>Chuck Norris only creates one weight per font: Extra Bold.</p>
    <p>No flush left. Everything Chuck does is justified.</p>
    <p><em>"Chuck Norris only creates one weight per font: Extra Bold."</em><br>
    ...and then roundhouse-kicks it to create italic.</p>
    <p>Chuck Norris scared the Venetians straight.</p>
    <p>Chuck Norris doesn't use the word "tittle".</p>
    <p>Chuck Norris whispers in all caps.</p>
    <p>Chuck Norris leaves widows and orphans in his wake.</p>
    <p>Chuck Norris only makes kick-ass type.</p>
    <p>Chuck Norris likes whole, not sub - pixels.</p>
    <p>The industry had to abandon hot lead typesetting when Chuck Norris snorted it all up.</p>
    <p>Chuck Norris uses a three-story /a/.</p>
    <p>Did you know that every question mark Chuck Norris designs is actually an interrobang‽</p>
    <p>Chuck Norris makes wood type by biting bits off a tree.</p>
    <p>Chuck Norris handcuts the mats... with his fingernails.</p>
    <p>“Myriad” was aptly named following a demonstration of how many ways Chuck Norris can kill a man.</p>
    <p>Chuck Norris redesigned Helvetica. Now it actually is Switzerland.</p>
    <p>Chuck Norris hinted Verdana by punching the monitor.</p>
    <p>Chuck Norris doesn’t need one of these:<br>
    <img src="http://typophile.com/files/press_4030.jpg"></p>
    <p>He’ll letterpress your wedding invitations with his bare hands.</p>
    <p>Chuck Norris have intimate knowledge of Mrs. Eaves' bezier curves.</p>
    <p><a href="http://www.typophile.com/node/44927" title="http://www.typophile.com/node/44927">http://www.typophile.com/node/44927</a></p>
    <p>Chuck Norris' bloodtype is woodtype.</p>
    <p>Chuck Norris’ keyboard ...<br>
    <img src="http://typophile.com/files/norriskeyboard_5245.jpg"></p>
    <p>Chuck Norris can do embossing and die-cutting with an inkjet.</p>
    <p>Chuck Norris doesn't work in the real world. All of his characters are fictional.</p>
    <p>Chuck Norris can kick you in the nut fractions in&lt; 1/4 of a second.</p>
    <p>Robert Bringhurst returned from Chuck Norris's house with two stone tablets on which were inscribed the Elements of Typographic Style.</p>
    <p>"Optically corrected," "monolinear" stroke widths look grotesquely modulated to Chuck Norris's perfect eyes.</p>
    <p>The ellipsis was designed after the imprint of Chuck Norris' knuckles on the Trajan Column.</p>
    <p>Chuck Norris once designed an eminently readable pixel font with a 1px cap height.</p>
    <p><em>“Chuck Norris once designed an eminently readable pixel font with a 1px cap height.”</em><br>
    With subscript and superscript nicely done, of course.</p>
    <p>Chuck Norris once designed a hairline font so thin that only he could see it.</p>
    <p>Chuck Norris successfully created a ligature that tells his entire life story, from conception to 5,000 years in the future.</p>
    <p>A Chuck Norris glare is sufficient to uncrash any piece of software. Even Windows.</p>
    <p>Chuck Norris can jump over thousand lazy dogs at a stroke.</p>
    <p>Spindly Bastard, Fat Bastard, Even Fatter Bastard, Chuck Norris.</p>
    <p>Chuck Norris can smell the IP of font-file-sharers.</p>
    <p>Any font recommended by Chuck Norris for a logo is the perfect choice. Any font at all.</p>
    <p>Chuck Norris created the first two-story ‘a’ when he physically uppercutted his birth certificate at the sight of his name being mis-spelled “Chuck Narris”.</p>
    <p>Chuck Norris doesn’t punch cripples. So many serifs decided for self-amputation.</p>
    <p>An Inserat is a Bold after a Chuck Norris slap.</p>
    <p>There is an Unicode point reserved for Chuck Norris’ DNA-ligature.</p>
    <p>If Chuck Norris would be your teacher, you would delta hint your fonts, because you want to stay alive.</p>
    <p>Chuck Norris can compile the OT features of Operina Pro with his brain.</p>
    <p>Be grateful, that Chuck Norris allows you to use C, h, u, c, k, N, o, r, i and s.</p>
    <p>Chuck Norris’ hairlines are extrablack.</p>
    <p>All of the letters in Chuck's font have apertures — or as he likes to call them — “targets”.</p>
    <p>Chuck Norris create the entire alphabets on planet, then he manage the universal knowledge about all things. and I guess he don't need to know what we talk about him on this forum.. xD</p>
    <p>Chuck Norris' em square is actually an octagon and his em dash is the longest ever seen.</p>
    <p>When asked why is lowercase had no descenders he quipt "I go down for no one!"</p>
    <p>He has a legendary sucker-punchcutter takedown and created the quaddbls to spell "ßßhit!"</p>
    <p>Chuck can take a • to his head and † or ‡ can't pierce his flesh.</p>
    <p>Chuck Norris designed a sans with serifs.</p>
    <p>Chuck Norris can say "tittle" without laughing.</p>
    <p>Chuck Norris can use a glyph palette in Photoshop.</p>
    <p>Chuck Norris can use Comic Sans tastefully.</p>
    <p>Chuck Norris refuses to say the word “Frutiger” — he prefers the more manly “Meatiger”.</p>
    <p>Chuck Norris designed a font family with 1,000 weights, starting with Ultra Black.</p>
    <p>Chuck Norris’ font is so bold ... <em>How bold is it?</em> ... It’s so bold, that when printed, it simply soaks your entire page in black ink.</p>
    <p>Chuck Norris uses a gun to make ball endings on serif faces</p>
    <p><em>Chuck Norris’ font is so bold ... How bold is it? ... It’s so bold, that when printed, it simply soaks your entire page in black ink.</em><br>
    But, despite this, the resulting text is still both readable and legible.</p>
    <p>The Gs in Chuck Norris's fonts have beards. So do all the other letters.</p>
    <p>Chuck Norris once designed a font called Snell Roundhousekick.</p>
    <p>Chuck Norris doesn't have opinions... he has truths.</p>
    <p>Chuck Norris does not have truths. He has Truths (with capital T).</p>
    <p>Chuck Norris doesn't have opinions... he has knuckles.</p>
    <p>Chuck Norris doesn’t have knuckles. He has arguments.</p>
    <p>The shortest type related Chuck Norris fact: Chuck Norris!!!</p>
    <p>Chuck Norris has invented the exclamation-ellipsis. Or was it the space-ellipsis?</p>
    <p>Chuck Norris stares the brand marks onto the rumps of his horses.</p>
    <p>Chuck Norris faster draws a perfect alphabet, than you can draw a space.</p>
    <p>Unable to connect. The site could be temporarily … If Chuck Norris would be the webmaster of Typophile, I had not to locally store this sentence, until Typophile is up again.</p>
    <p>Chuck Norris doesn’t need a son, when he wants to fire at an Apple.</p>
    <p><em>Chuck Norris doesn't have opinions... he has knuckles.</em><br>
    ... and on each of those knuckles is a lustrous beard.</p>
    <p>Every document Chuck Norris has ever published has been perfect-bound... that is, bound perfectly by his own two hands.</p>
    <p><a href="http://www.youtube.com/watch?v=L-O0M9774KA" title="http://www.youtube.com/watch?v=L-O0M9774KA">http://www.youtube.com/watch?v=L-O0M9774KA</a></p>
    <p>Chuck Norris can “un-404” any web server by simply staring it down... hint-hint.</p>
