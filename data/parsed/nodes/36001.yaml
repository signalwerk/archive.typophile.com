      <p>Yes, as Reed and Eben recommend, <a href="http://www.fontshop.com/search/?q=FF%20Kievit">FF Kievit</a> was designed to be a neutral humanist face.</p>
      <p>As for other grotesques like Helvetica, I can suggest some of <a href="http://www.fontshop.com/fontfeed/archives/helvetica-and-alternatives-to-helvetica/">these</a> and <a href="http://www.letterlabor.de/typeface.php">Neutral</a>, which was created from the start to be as neutral as possible. Read more about it in <em><a href="/wiki/Interrobang" class="wiki">Interrobang</a> 5</em>. It’s not so “complete” though. And it may qualify as sterile, which isn’t what Tiff is seeking.</p>
      <p>My favorite safe faces with lots of weights and widths:</p>
      <p>(I’m not so much a fan of using condensed faces with their standard counterparts — I think there are usually better ways to make type fit within a system.)</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/linotype/univers_std_ot_virtual/">Univers</a><br>
      <a href="http://www.fontshop.com/search/?q=Titling%20Gothic">Titling Gothic</a><br>
      <a href="http://vllg.com/Village/GalaxiePolaris/mudTyper+Weights/">Galaxie Polaris</a> (one width)<br>
      <a href="/wiki/Gotham" class="wiki">Gotham</a><br>
      <a href="http://www.fontshop.com/search/?q=Interstate">Interstate</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/mark_simonson/proxima_nova_complete_ot/">Proxima Nova</a></p>
    html_clean: |-
