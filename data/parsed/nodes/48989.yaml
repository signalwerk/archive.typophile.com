      <p>Does it betray my incurable lack of humour when I confess that of all the things, my attention was drawn to the reference to Balto-Slavic and Michael's subsequent comment on the 'unexplained disappearance of Baltic'? Balto-Slavic is a hypothetical grouping and there is no compelling evidence that they ever formed a single group. Also, the demise of the Baltic languages has been somewhat exaggerated, as Latvian and Lithuanian at least are very much alive.</p>
      <p>That and the fact that the invention of language in this history apparently concerns only those of the Indo-European family.</p>
