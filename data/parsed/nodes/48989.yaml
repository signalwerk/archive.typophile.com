    <p>This was posted today on cyberscribes and I thought it quite appropriate given recent discussions.</p>
    <p>THE BOOK of LETTERS<br>
    In the beginning there was silence and there was no understanding. And then<br>
    man spoke and there was noise. And man called this noise language and said<br>
    "This is my Language in which I am well pleased, and I shall have no other<br>
    languages before it.” But Language went forth and multiplied.<br>
    And so it was that Proto-Indo-European begat Balto-Slavic, Germanic, Celtic,<br>
    Italic, Illyrian,Albanian, Thracian, Hellenic, Armenian, Phrygian, Anatolian,<br>
    Indo-Iranian and Tocharian and then died of exhaustion &amp; was forgotten.<br>
    And it came to pass that Balto-Slavic subdivided and became Baltic and Slavic<br>
    and the number of their begating was three .... but<br>
    the languages of Slavic were fruitful and multiplied, went condo and ate up<br>
    the languages of Baltic.</p>
    <p>Hellenic begat Greek and Italic begat Latin and had many other languages and<br>
    was eaten by its off-spring. Latin begat and begat and begat which was all<br>
    very Romantic.</p>
    <p>And Germanic Begat Anglo-Saxon which had an illicit relationship with Norman<br>
    French, the illegitimate off-spring of Old French and a Northern Dialect of<br>
    Germanic, &amp; begat Middle English. And Middle English became vague and begat<br>
    English, a language which even its own speakers do not speak. And so Language<br>
    multiplied until the peoples of the earth could not understand themselves, and<br>
    there was no understanding.</p>
    <p>There were in that same land Calligraphers and Scribes, and they said “Let<br>
    there be an Alphabet that we may grow and prosper.” and so there was an<br>
    Alphabet. Now in that Alphabet there were letters and unto each letter there was one<br>
    sound, or two sounds, or three sounds, or two letters for one sound and this<br>
    greatly pleased the Calligraphers and Scribes for no others could read it. And<br>
    so they grew and prospered.</p>
    <p>Now each Language took unto itself an Alphabet except Latin. Latin took unto<br>
    itself the Greek alphabet, and after changing a few letters for copyright<br>
    protection, called it Roman and inflicted unto the far reaches of the world, even<br>
    unto Cleveland in the far west.</p>
    <p>And the Calligraphers and Scribes conspired together and said “Now there is<br>
    an Alphabet there must be something to write.” and so they invented Literature.<br>
    Now those among the Calligraphers and Scribes who produced Literature called<br>
    themselves Authors. And the Authors waxed powerful among the Calligraphers and<br>
    Scribes for their writings were as numerous as the forms of the IRS and about<br>
    as understandable. And those who could not express themselves in their native<br>
    language quoted important passages in foreign languages and when pressed to<br>
    explain their eccentricities exclaimed “I know how to write, let others learn<br>
    to read.” And those amongst the Calligraphers and Scribes who were not Authors<br>
    grew sore afraid; so they invented Critics.</p>
    <p>Then arose Joyce, a great one amongst the authors, who spoke for many hours<br>
    of many things and many were there among those present that drifted off to<br>
    sleep. There was one present who, after sleeping for many hours, awoke and found<br>
    that Joyce was still speaking and this so greatly disturbed his waking thoughts<br>
    that he emitted a piercing shriek and ran from the chamber. And thus it was<br>
    that the Scream of Consciousness became an integral part of Joyce's style.</p>
    <p>But there were those amongst the Calligraphers and Scribes who could speak<br>
    but plainly. And they, wishing to share in rich spoils of confused thinking<br>
    arose early in the afternoon worked for many minutes and invented Statistics, and<br>
    Marketing Surveys, and after a three martini dinner did they invent jargon.<br>
    And thus did “Method” become “Methodology” and even the paradigm of “paradigm”<br>
    shifted and so did plain speaking become confused and plain speakers became<br>
    great by proving whatever they willed. And they called themselves Bureaucrats<br>
    and worshiped at the Bottom Line.</p>
    <p>Then came forth out of this wilderness a prophet unto the Elders among the<br>
    Calligraphers and Scribes, even unto the High Author and Chief Bureaucrat, and<br>
    demanded of them explanations of their deeds. And the Elders answered him in<br>
    word both wise and wonderful and almost entirely content free. And the prophet<br>
    said unto them “Speak not to me in words of flowing rhetoric for I come from<br>
    the wilderness where I was Illuminating the Letters of the Law and yea, I can<br>
    recognize the droppings of male bovines when they are displayed before me.” And<br>
    they Answered him speaking such words as are not to be recorded in Holy Books.</p>
    <p>And again he spoke, saying “Lo, it is written, for I have written it, that<br>
    one shall come forth from the wilderness and found a new order amongst the<br>
    scribes. Behold, here am I.”</p>
    <p>And these be the words of the Prophet: “Yea, though I speak the words of<br>
    angels or the words of corruption yet shall they be considered wise; and yea,<br>
    though I walk uprightly amongst men or wind sideways through the sand on my belly,<br>
    yet shall I be respected, and yea, though my ancestry be of noble kin or that<br>
    of the barracuda and shark yet shall I be honored above all; for I am a<br>
    Lawyer.”</p>
    <p>And so it came to pass that there was much wailing, and an outcry was<br>
    heard throughout the world, and there was much litigation, but there was still<br>
    no understanding.<br>
    Author Unknown</p>
