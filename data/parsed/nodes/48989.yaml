      <p><strong>Sum up:</strong> Potted history of letters condenses the history of language and writing into a mind-tickling 864 words using mock biblical tone and quasi-ecclesiastical parlance. Writing style lives life on the Deuterocanonical side of the Old Testament, relying heavily on capitalized key words and the kind of atrophied orthography begat by the changeover from Indo-Germanic to Latin, verifying that ancient scholars made a golden turkey of an error when they swapped the "Th" fuþark rune for the Latin "Y" glyph, merely because the latter looked just like the "Th" fuþark rune. If only pre-Latin-speaking peoples had gone about saying, "Yea". Except they didn't. In reality they went about saying "The", but their scholars let them down with that slip-shod glyph substitution, creating the enduring falsehood of "Yea".<br>
      Sorry, where was I? Oh yeah, the review. Narrative thread makes out a case for the history of language being convoluted and rather corrupt. The author is correct, it really did develop that way. Humankind starts off bereft of understanding, invents language, then languages, writing, literature, and finally bureaucrats, ad men and lawyers. Humankind winds up bereft of understanding in the end. The author has a point. Language sets out to demystify the human condition, only to obfuscate it. More people need to read this stuff.<br>
      <strong>For:</strong> Veracity of story, endearing cast of characters.<br>
      <strong>Against:</strong> Not entirely convincing ecclesiastical linguistic aspiration.<br>
      <strong>Spec notes:</strong> Hyphenation and comma omissions compromise rhythm and pacing, but not too seriously. Numerous references to U.S place names and culture give away the writer as being in all likelihood a U.S citizen.<br>
      <strong>Rivals:</strong> No, sorry, nothing springs to mind unless you count works by Coolhand McLuhan.<br>
      <strong>Also Try:</strong> The <a href="http://en.wikipedia.org/wiki/Portal:Literature" rel="nofollow">Wikipedia Literature portal</a> because the articles are really very good.<br>
      <strong>Rating:</strong> Three and a half stars.<br>
      <strong>My choice:</strong> Yes please. I enjoyed it.</p>
      <p>j a m e s</p>
