      <p>Chris, your doubt was also mine when I begun to develop my font.</p>
      <p>The solution I did adopt was to set height limits according to <strong>single</strong> accent above and below, plus a small extra space. I also followed Bhikku's second suggestion so my diacritics are different for each set of glyphs (lowercase, uppercase, small caps, petite caps).</p>
      <p>About characters with <strong>double</strong> accents, I built them preserving design and exceeded the height limits. This would cause collisions between lines, but I believe that people who use languages with these glyphs, like Vietnamese, are familiar with this problem and already use larger leadings.</p>
