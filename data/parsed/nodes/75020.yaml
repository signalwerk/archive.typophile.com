      <p>No need for Aring acute, unless you expect publishers of Danish dictionaries to license your font.</p>
      <p>But they will no doubt require fonts including IPA (phonetic) symbols, so unless you plan to also include *those* Unicode glyphs, you are wasting your time on this character.</p>
