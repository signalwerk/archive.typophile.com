    html: <p>In some instances giving the typeface credit is unrealistic. In regards to the clauses in some EULAs, I choose to read between the lines by listing the fonts used when the opportunity is available.  <br> <br>However, I think that there should be more colophon's in catalogs and brochures, as well as annuals and books. Perhaps it is not always appropriate, good enough. BUT ... I think design annuals are guilty of not making this mandatory. If for not other reason that to help the young design students that dig through them. <br> <br>Barrie. Doing anything retroactively is difficult, unless of course you have your own stable of lawyers. I would suggest the same as others have and attach a EULA to your typeface with a personal use clause, or perhaps some other kind of clause that at minimum gives you the opportunity to see the work being created with your typeface. </p>
