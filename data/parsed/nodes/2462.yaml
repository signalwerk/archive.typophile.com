    votes: null
    html: <p>I think there's a confusion here between assessing the fairness/legality of the Crobar logo, and assessing the designer's skill.  <br> <br>There's no question that the use of Barrie's font is legal. There was no EULA stating otherwise, and there's no law that prohibits a designer from using a font as-is in a logotype. <br> <br>Barrie seems to feel that it was lame of the designer to not adjust or customize anything. Fine, but that's just a judgment of the designer's skill and of the finished product -- no legal issue is involved. Besides, it's conceivable that the "as-is" logotype might be the best solution for the project. It wouldn't make sense to have to alter the type just for the sake of altering the type. <br> <br>(On another topic, I wholeheartedly agree with Tiffany about encouraging the use of colophons in publications. I'm always disappointed when there's not one.)</p>
    html_clean: <p>I think there's a confusion here between assessing the fairness/legality of the Crobar logo, and assessing the designer's skill.  <br> <br>There's no question that the use of Barrie's font is legal. There was no EULA stating otherwise, and there's no law that prohibits a designer from using a font as-is in a logotype. <br> <br>Barrie seems to feel that it was lame of the designer to not adjust or customize anything. Fine, but that's just a judgment of the designer's skill and of the finished product -- no legal issue is involved. Besides, it's conceivable that the "as-is" logotype might be the best solution for the project. It wouldn't make sense to have to alter the type just for the sake of altering the type. <br> <br>(On another topic, I wholeheartedly agree with Tiffany about encouraging the use of colophons in publications. I'm always disappointed when there's not one.)</p>
