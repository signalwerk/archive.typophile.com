    html: "<p>I love the font and the website...it's rad! <br> <br>As for the copyright, you do have copyright for things you create (and I'm almost positive that even by adding a stylistic \"No Copyright\" to your site doesn't erase this). However, I think that because he has created something as well, it would be considered a new work and therefore have its own copyright. It's like collage art: the new piece is considered its own creation even though it contains the elements of other copyrighted works. However, there have been many cases where the use of a single item as the major feature of a work has led to copyright violation, so this might be the case with your situation. Unfortunately, this would be a situation that rides the fence and might need to be taken to some sort of judicial proceeding to actually get sorted out. <br> <br></p>"
    html_clean: "<p>I love the font and the website...it's rad! <br> <br>As for the copyright, you do have copyright for things you create (and I'm almost positive that even by adding a stylistic \"No Copyright\" to your site doesn't erase this). However, I think that because he has created something as well, it would be considered a new work and therefore have its own copyright. It's like collage art: the new piece is considered its own creation even though it contains the elements of other copyrighted works. However, there have been many cases where the use of a single item as the major feature of a work has led to copyright violation, so this might be the case with your situation. Unfortunately, this would be a situation that rides the fence and might need to be taken to some sort of judicial proceeding to actually get sorted out. <br> <br></p>"
