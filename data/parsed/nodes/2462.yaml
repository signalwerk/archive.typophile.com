  html: <p>Hi there, <br> <br>I've a quick query about a typeface I designed about a year ago ( <a href="http://www.overnightdesign.co.uk/aerobic" target="_blank">http://www.overnightdesign.co.uk/aerobic</a> ) <br> <br>It was my first stab at a full character set so I though I'd build a small site around it and let folk download it if they wanted. There was no copyright information on the site or in the zipped font files. So far so good . . .  <br> <br>Then the other day I noticed a post on a news board about a club in the states  ( <a href="http://www.crobar.com" target="_blank">www.crobar.com</a> ) that had just been re-branded (posted by the guy who designed the new logo). This new identity basically consists of the word Crobar set in aerobic (my typeface). I checked that they were both the same and found the match to be pretty much perfect. <br> <br>What irritated me was not that the designer in question had used the font as part of the logo but that he had simply used the typeface and added nothing to it, passing it off as his own work and hadn't dropped me a line to ask if it was ok to do so. <br> <br>Do I have any kind of ownership of intellectual property or anything over my work or was this  wavered when I made the face available for download on the site. <br> <br>Sorry if this seems like a bit of a whine but it irritates me to think that another person is essentially passing off something I spent a considerable ammount of time on as their own. <br> <br>Any advice welcome. <br> <br>Barrie <br> <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/30/22630.gif" alt="comparison of logo and typeface"></p>
