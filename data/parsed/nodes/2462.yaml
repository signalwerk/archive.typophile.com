    html: <p>It is a special case in that it's a typeface, which doesn't have quite the same copyright protection that drawings, photographs, and stories do. If you had put any of those things on your site and someone made a derivative work from them, that would be a violation. To be realistic, if you say a font is free to use, you have to expect people to set words in it for design purposes, otherwise what is a font for? <br> <br>But, venturing out of the realm of the question asked and into the minefield... I can tell a difference between the two. The crobar weight is slightly lighter and there are a few subtle proportional differences. And don't hate me for saying this, but it's made of circles. Parallel invention of simple forms such as these cannot be ruled out. There is a good possibility that they never saw your typeface.</p>
