    html: <p>As far as I know, contacting the designer is a good practice, but, since you've said it yourself that you didn't have any copyright information or usage restrictions on the site, or even a readme file in the zip archive, I don't think there's much you can do. <br>By having none of that info on your site, you basically implied that the font was free for the taking and that any usage would be okay. At least that's the message I get.</p>
