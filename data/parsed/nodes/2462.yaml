    html: <p>That being said, if you agree to a contract that says you're going to things in a certain way -- which is what a EULA is -- and then you fail to abide by the contract, you've just given the foundry grounds to sue you and otherwise hold you in brach of that contract (your right to use the font at all may be terminated, for instance). <br> <br>If you *really* don't like the terms of the EULA and/or don't think you can abide by them, you shouldn't license the font. Once you've agreed to it, it doesn't matter whether the EULA seems reasonable, you're in a contract. <br> <br>At least, that's my non-lawyer's understanding. As usual, you shouldn't take this as legal advice; if you need legal advice, you should consult a lawyer. Etcetera. <br> <br>Regards, <br> <br>T</p>
