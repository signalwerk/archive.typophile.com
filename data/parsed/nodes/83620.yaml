    <p>Greetings Typophiles!</p>
    <p>There is this great game: Jagged Alliance. It has a very characteristic font for its logo:<br>
    <a href="http://www.vgrevolution.com/wp-content/uploads/2011/06/jagged_alliance_logo-640x250.jpg" title="http://www.vgrevolution.com/wp-content/uploads/2011/06/jagged_alliance_logo-640x250.jpg">http://www.vgrevolution.com/wp-content/uploads/2011/06/jagged_alliance_l...</a></p>
    <p>It is NOT a real font, because it is known that it had been painted (i.e. a rastergraphics produced for the game). But I hope and believe that someone can tell me about a similar looking font!?<br>
    I would really appreciate any hints or advices.</p>
    <p>Kind regards<br>
    Christoph</p>
