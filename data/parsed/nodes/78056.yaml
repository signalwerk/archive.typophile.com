    html: |-
      <p><cite>Out of curiosity, why did you post a link to the Pirate Bay?</cite></p>
      <p>It’s something I’ve wanted to try for a long time. The software, music, and movie industries have all been using piracy to promote their products for years. And I’ve long suspected that a few popular type foundries are doing it, because it seems odd how many custom magazine fonts end up in the work of Indian college students before the commercial release. I never bothered before because people bought my work anyway. But Lorimer wasn’t selling, and even the free downloads were tapering off, so I decided to try this. </p>
      <p><cite>…opening the door for some highly remunerative litigation?</cite></p>
      <p>If I was making enough money to hire an IP lawyer I’d be way to busy for stunts like this.</p>
