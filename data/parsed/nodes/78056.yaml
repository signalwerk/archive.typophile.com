      <p>"That only works for people who are<br>
      buying a brand and not a product."</p>
      <p>While I realize you mentioned that only as a Apple jab, it's an interesting topic. And, in fact, it's true. Apple or otherwise. </p>
      <p>There's a great article on Trader Joe's and how their success is very much about limiting options:</p>
      <p><a href="http://money.cnn.com/2010/08/20/news/companies/inside_trader_joes_full_version.fortune/index.htm" title="http://money.cnn.com/2010/08/20/news/companies/inside_trader_joes_full_version.fortune/index.htm">http://money.cnn.com/2010/08/20/news/companies/inside_trader_joes_full_v...</a></p>
      <p>"Swapping selection for value turns out not to be much of a tradeoff. Customers may think they want variety, but in reality too many options can lead to shopping paralysis."</p>
      <p>Another interesting take is the 'paradox of choice':</p>
      <p><a href="http://en.wikipedia.org/wiki/The_Paradox_of_Choice:_Why_More_Is_Less" title="http://en.wikipedia.org/wiki/The_Paradox_of_Choice:_Why_More_Is_Less">http://en.wikipedia.org/wiki/The_Paradox_of_Choice:_Why_More_Is_Less</a></p>
      <p>Is this related to retail font sales at all? I dunno. I can say that when my non-type friends ping me for type advice, they usually mention "there's just too many options on myfonts...help me narrow it down".</p>
      <p>I know of no solution to that problem, nor would I advocate that there be less typefaces or fewer options on Myfonts. </p>
      <p>But it's an interesting topic.</p>
