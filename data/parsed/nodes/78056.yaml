    html: |-
      <p><cite>So, conclusions?</cite></p>
      <p>The original Lorimer design was too weird to be useful, so I don’t even sell it anymore. It’s a symptom of spending too much time drawing letters alone in an apartment while conversing with dogs. If anything I have learned why so many type designers lean towards conservative and established styles—the moment one goes off on a tangent things can easily spiral out of control into a family of fonts of no practical value. So giving it away was a pointless exercise; like giving away screwdriver handles with no shafts.</p>
      <p>But beyond that, I’ve gone back to the belief that free fonts are pointless. If I release free fonts nobody has any way of knowing that I’m not just another college kid posting his class project to the internet. Getting attention with free fonts is no easier than with paid fonts, because just like paid fonts, there’s already too much out there. It works well for guys like Chank and Larabie and Jos Buivenga because they started doing it when few people were and have done it for so long that designers expect good work. Sure there are some other people who have done well with free fonts, like Code Pro, but I think that has more to do with having the right design for the time than the font actually being free.</p>
      <p>I also don’t see any point in contributing to the notion that fonts should be free because there’s no sane business proposition for doing so. I’m not Trent Reznor. I can’t give a type family away to millions of people to promote my worldwide stadium tour and then make tens of millions of dollars. And I’m not a free software author. I can’t give a font away and then expect people to hire me to flesh it out with four more weights in two styles with small caps.</p>
    html_clean: |-
