      <p>Because if I add any number or combination of fonts to my own web site I’m just one more font designer/vendor giving out free fonts. Thich describes most font designer/vendors today so nobody would even notice. But thousands of people will try out anything that shows up on TPB, which drives tons of traffic to my web site, and hopefully that will translate to sales. If it doesn’t I’ve lost nothing because nobody was buying the Lorimer family to begin with.</p>
