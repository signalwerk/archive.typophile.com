      <p>Maybe the unorthodox shapes should have alternatives, so that more conservative designers would consider it. But they shouldn't be ditched for there maybe people wanting that exact shape later.<br>
      Also, from my limited experience in selling fonts, it seems like apple's strategy of simplifying the buying options leaves customers less confused.<br>
      I'm inclined to think that people who buy personal use will use it for commercial purposes (in good or bad intentions). Having many instances of licensing will make them think twice about buying it in first place rather than getting it by impulse (I keep thinking of pc vs mac decision process). So why not make it simple and maybe more affordable if it makes sense.</p>
      <p>I think the pirate bay thing would be great, but your stunt should maybe be pulled in twitter or more spreadable market oriented media. Probably tweeting that you just found this crazy cool font torrent at TPB. This way you'd found a larger audience prone to downloading/retweeting and hopefully buying it).</p>
      <p>And I'm with you, that piracy may help boost sales eventually, rather than hurt it. I think we sometimes get so worried about protecting it that we eventually forget to think about ways to market it and how the customers think.</p>
