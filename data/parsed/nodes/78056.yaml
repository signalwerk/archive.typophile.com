      <p>James, I disagree with your theory that the original Lorimer failed because it was too weird to be useful.<br>
      Admittedly, I have designed some way weirder faces that rarely sell—however, I do have a few faces with odd characters that sell well.</p>
      <p>In the case of the original Loriner, the oddities are not particularly attractive when viewed individually, and stand out too much from the rest of the glyphs.<br>
      The trick is to make them attractive as individual glyphs, and make them feel at home amongst the other glyphs. Then they can become the memorable “trademark” idiosyncracy, like “g” in Baskerville or “g, y, z” in Bree.</p>
