    html: |-
      <p>I have been known to buy books primarily for the typeface, but I rarely acquire a non-type book just for the type itself if there isn't also some non-type interest for me. </p>
      <p>For example, it's not hard at all to find decent books set in Caledonia (seems like half the books produced in the U.S. in the 1950s were set in it). But I enjoy nature writing and I have a book, <cite>Footnotes on Nature</cite> by John Kieran with wood engravings by Nora S. Unwin, that I also enjoy as a great exemplar of Caledonia in everyday use from that period. I bought it partly for the topic and partly for the type and design. It's just an ordinary trade edition, not particularly precious or collectible, nothing too special. But that's exactly how Caledonia was meant to be used, and I love seeing it like that. </p>
      <p>I did once pick up a book primarily because it was printed in Ruzicka's Primer (which is much less common). But it was also by Hermann Hesse, an author whose work I admire (although I've never gotten around to reading the whole book -- <cite>Beneath the Wheel</cite>, a minor work). I definitely would not have bought the book if it wasn't set in Primer (or some other typeface of keen interest). On the other hand, I don't know if I would have bought the book if there wasn't some small additional interest beyond the type. </p>
      <p>However, I did once buy a fairly pricey collectible first-edition of essays by Wallace Stevens, <cite>The Necessary Angel</cite>, solely because it is a rare example set in Dwiggins's Stuyvesant (which was never released). I've always enjoyed Wallace Stevens's poetry, but these essays are a bit over my head, and I wouldn't have bought the book except for the type. (And I sought it out specifically for that reason.)</p>
      <p>-- K.</p>
