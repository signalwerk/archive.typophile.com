      <p>In terms of "bang for buck", you might look for <cite>Books and Printing: A Treasury for Typophiles</cite> edited by Paul A. Bennett, (1951: Cleveland and New York, The World Publishing Co.)</p>
      <p>This is a collection of essays on type, typography, and printing. The book was composed in twenty-one different typefaces, including Baskerville, Bell, Bembo, Bodoni Book, Caledonia, Caslon, Centaur, Deepdene, Eldorado, Electra, Emerson, Fairfield . . . the list goes on. (Looks like the composition was both Monotype and Linotype.)</p>
      <p>So you get a nice specimen of different faces in use, plus great articles by the likes of Goudy, Dwiggins, Rogers, Rushmore, Morison, Updike, Cleland, Armitage, and many others. Bennett was the head of publicity for Mergenthaler Linotype. </p>
      <p>The book is 400+ pp. I think I got my copy for around $10. Shouldn't be too hard to find.</p>
      <p>Walter Tracy listed this in his resources in <cite>Letters of Credit</cite>, which is how I got turned on to it.</p>
      <p>-- Kent.</p>
