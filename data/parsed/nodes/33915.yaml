    <p>Recently Christian Shwartz was mentioning a book here</p>
    <p><a href="http://typophile.com/node/33855" title="http://typophile.com/node/33855">http://typophile.com/node/33855</a></p>
    <p>Called "A selection of types from six centuries in use at the office of Joh. Enschedé en Zonen at Haarlem, Holland, Printed &amp; Issued in the year MDCCCCXXX'</p>
    <p>Which got me wondering. What other <a href="/wiki/books" class="freelinking" rel="nofollow">books</a> might my fellow typophiles recommend that are not hyper-rare or hyper-expensive but which would be good to have while studying type history &amp; especially text text type? For instance, I remember reading that some books set in metal Bembo can be had for a song if the content is of dubious interest now. Any faves in that category? What about Van Dijck's stuff? The reason I ask is I am near some antiquarian book stores in So Cal for just a little while &amp; I would like to make good use of the opportunity! I could just buy things online I guess but this would be more fun.</p>
