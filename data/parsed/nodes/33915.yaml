      <p>Wow. More excellent ideas. Thank you!</p>
      <p>I want to see if I can push this idea just bit further or see if perhaps I have a mistken notion here... feel free to take that postion too.</p>
      <p>While I was in LA I found a book about some random nonsense printed in 1731. I am still working to figure out what it's printed in. At first I thought Fleischman because of the narrow a and the wild italics. Now I am not so sure. Anyway it was exciting at $60 despite it's printing flaws. It is a rich visual reference. The reason I mention it is that part of what's fun about the book is that the type in it is being used or applied. And you can see the color of it on the page. This seems like a great thing.</p>
      <p>So I with that in mind; I was wondering if in addition to the Treasuries, Atlas' &amp; Catalogs -you guys also like to collect books just because they are set in a given face. For instance, ( sorry for the repetition ) is there a classic well printed letterpress edition of something that is known for it's excellent Bembo, or Fleischman, or Caledonia or whatever you are keen on?</p>
