      <p>Books I wouldn't want to be without:</p>
      <p>The Typographic Book, by Day and Morison, about $75.</p>
      <p>American Proprietary Typefaces, David Pankow, <a href="http://www.veatchs.com/aphaPubs.aspx" rel="nofollow">$50 new.</a></p>
      <p>The Solotype Catalog, about $20.</p>
      <p>An <a href="http://typographi.com/000893.php" rel="nofollow">ATF catalog</a>. I like my 1912 best (about $250), but the '34 or '41 edition is a must-have at around $15-$20 if you can't afford one of the big ones.</p>
      <p>A View of Early Typography, by Harry Carter, about $25. Scholarly as well as rich in beautiful specimens. And it's Matthew's dad.</p>
      <p>The practice of typography, by de Vinne. Plain Printing Types is about $70.</p>
      <p>Typographia, or the Printer's Instructor, by John Johnson, 1824. Roughly $60 for each of the volumes. The extensive (221 pp) section on non-latin scripts alone is well worth the price.</p>
      <p>You can get a decent Baskerville edition for around $100.</p>
      <p>Hmm, that's a few hundred bucks, maybe more if you go all-out. But I can definitely think of worse ways to blow a grand.</p>
