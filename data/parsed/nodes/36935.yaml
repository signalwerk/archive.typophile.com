    <p>Hi,</p>
    <p>I'm trying to find out what typeface is being used for the roman alphabet "YOU ARE HERE" on these contemporary maps from Tokyo's Yamanote Line stations (run by JR/Japan Rail).</p>
    <p>Any help would be appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/you_are_here_font_5621.jpg"></div><p></p>
