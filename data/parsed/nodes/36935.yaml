    html: |-
      <p>Strictly speaking, it is probably latin characters of <a href="http://www.morisawa.co.jp/font/fontlist/details/fontfamily007.html" rel="nofollow">ShinGo</a> (means “New Sans Serif” in Japanese), a Japanese popular modern sans serif font.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Shingo_3898.jpg"></div><p></p>
      <p>Of course, the latin characters of ShinGo is based on Eurostile but rounder than Eurostile.</p>
      <p>BTW “YOU ARE HERE” set in ShinGo is condensed around 94%.</p>
      <p>- Akira</p>
