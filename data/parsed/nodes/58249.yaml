    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 21.May.2009 11.14am </div>
      <p>P22 announces Mayflower Smooth Pro- the latest font designed by Ted<br>
    Staunton for the Sherwood Type Collection.</p>
    <p>The Mayflower font was originally designed by Ted Staunton in 2002 for the<br>
    Sherwood Collection of fonts. Mayflower is a classical Roman font taken<br>
    from a Bible of 1610, the edition likely carried to America by the pilgrims<br>
    on the Mayflower. True to the original source, Mayflower featured a<br>
    distressed look to simulate the appearance of inked metal type. Mayflower<br>
    Smooth Pro lacks the inked look and is ideal for cleaner design<br>
    applications and letterpress work. Both styles are evocative of<br>
    early-Colonial type styles.</p>
    <p></p><div class="imageWrap"><img src="/files/MayflowerSmoothProPoster_5043.jpg.jpeg"></div><p></p>
    <p>Mayflower Smooth Pro features Small Caps, ligatures, fractions, historical<br>
    forms and ligatures, Central European characters, discretionary ligatures,<br>
    old style figures, lining figures and ornaments.</p>
    <p>Introductory offer through May 31st</p>
    <p><a href="http://p22.com/sherwoodtype/mayflowersmooth.html" title="http://p22.com/sherwoodtype/mayflowersmooth.html">http://p22.com/sherwoodtype/mayflowersmooth.html</a></p>
    <p>Sherwood Type is distributed exclusively through P22 type foundry Inc.</p>
