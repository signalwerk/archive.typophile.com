    <p>Welcome Typophiles,</p>
    <p>I am so devastated and it seems that no one understands me, perhaps you could provide me some sort of moral backup… Recently I designed a hardcover book for a major Polish publishing house; the design was rather ascetic. Its crucial feature was the size of white margins around a photo used on the cover: the margins are narrow (4 mm) and should be as equal as possible. You can see the idea in first attachment. Second attachment shows the result - I have just received the printed and binded book: margins are anything but equal, whole balance of the design is lost. Gosh, I haven’t been that disappointed in ages.</p>
    <p>Do you have similar problems in your countries? Can you design with confidence that your ideas that require extreme precision won’t be spoiled? Or maybe I expect too much?</p>
    <p>I would welcome any comments.</p>
    <p>Przemek Debowski</p>
