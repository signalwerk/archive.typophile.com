      <p>I suspect this kind of thing happens all the time, everywhere.<br>
      The following advice is based on my experience as a freelance, designing book covers for  publishers in Canada.<br>
      To guard against cock-ups, you have to embed yourself into the workflow at key points.<br>
      These are:</p>
      <p>1. Signing off on proofs. The publisher’s in-house art department has the ability to mess around with your artwork, so you have to state up-front that you want to OK the final proofs, before they go to the printer. Put it in your contract that this is included in services rendered. Otherwise a publisher will not bother asking you to check small changes, because your time is valuable, and they think so highly of you.<br>
      Ideally, the final proof should be a mocked-up cover, on a dummy (provided to the publisher from the bindery, via the printer), so that if the finished piece is wrong, the publisher (who is paying the bills) will be able to wave it at the printer and say “but this is what I signed off on, please do it again and get it right.”</p>
      <p>2. Press Approval. This will of course be scheduled for 4 a.m. to discourage you from showing up and creating a nuisance. At the approval, don’t give a hasty approval. Think about it, make them wait.</p>
