    html: |-
      <p><cite>What would be the benefit of making a light weight and making it a MM font and then designing the bold weight.?<br>
      As opposed to designing both weights separately then creating the MM font with either Blend Fonts or the method I described.<br>
      Can the light weight MM font be used to construct the bold weight.?</cite></p>
      <p>In a way, yes, the first master you design can be used to construct the other master(s).</p>
      <p>For me, this is much better because everything will be compatible from the start as you place every point at the right place from the start (and it is very easy to see if it is placed wrong aswell). You can see the both masters together all the time, and easy compare details and test the details how they look in the interim weights. If you extrapolate the weights at the same time (with the slider) it is also very easy to see errors. Everything is so visible if you for instance go below the 0, and put in -200 or something.</p>
      <p>Further, you can kern them both at the same time, build your sidebearing system so it is compatible, put in all the OT-features, classes etc.</p>
      <p>It is also good because you will have the exact same character set through out the family without even thinking specially about it, no glyph will be forgotten.</p>
      <p>I always make the fonts as ready as possible in the MM-project, so when i pick out the weights, the only thing to do is to go through the glyphs and make small, small adjustments – and rebuild the kern feature :)</p>
