    html: |-
      <p>I've found Blend Fonts to be a nightmare - I would create a MM font</p>
      <p>1. Open your two master weights in FL (eg. Light,Bold)<br>
      2. With Light, Tools - Mask - Assign Font Mask, select Bold.<br>
      3. Tools - Multiple Master - Define New Axis.<br>
      4. Select all glyphs in the Light weight, Tools - Multiple Master - Mask to Master, select Wt1</p>
      <p>Glyphs colored green are compatible, those colored red need looking at for contour direction, starting points etc.</p>
    html_clean: |-
