      <p><cite>Glyphs colored green are compatible, those colored red need looking at for contour direction, starting points etc.</cite></p>
      <p>I wouldn't trust those green cell colors if I were you. Go to the Multiple Master section of Font Info and set the default Weight Vector to something other than 0 or 1000. This will change the display in the Font Window and you will see any interpolation anomalies that might be hiding.</p>
