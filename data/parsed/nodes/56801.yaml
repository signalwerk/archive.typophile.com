    html: |-
      <p>It's a four step process at the beginning:</p>
      <p>1. Open your two master weights in FontLab<br>
      2. Tools &gt; Blend Fonts<br>
      3. Click the option "Build the Multiple Master font"<br>
      4. Click OK</p>
      <p>The result may vary very much depending on how compatible your outlines are, so you may have to do adjustmenst before blending. But make some trial and errors and you probably get the hang of it.</p>
