    html: |-
      <p>1. Prepare your 1st font - all needed glyphs, sets of numerals, small caps etc. All accented glyphs made via mark and mkmk features. When completed save as otf file and as pfb file. Save feature file as well.<br>
      [skip steps 2. and 3. if you have your bold font ready]<br>
      2. Open your pfb file in Fontographer 4.1. Element -&gt; Change Weight, set desired value and set Don't change vertical size and Don't change horizontal size as you wish.<br>
      3. Save your font (if you want) and File -&gt; Generate Font Files. Set Encoding "Original" and Format "PostScript Type1".<br>
      4. Open your files, let say 1.pfb and 2.pfb in FontLab.<br>
      5. Tools -&gt; Multiple Master -&gt; Define New Axis. Set "Weight", OK.<br>
      6. Tools -&gt; Multiple Master -&gt; Assign Master, as "wt0" select your basic font and as "wt1" your emboldened/bold one, OK (quite long processing).<br>
      7. Some glyphs have red squares - they are incompatible in these two fonts. It would be better to edit bold font to resolve all problems. (see <a href="http://typophile.com/node/39965#comment-246011" title="http://typophile.com/node/39965#comment-246011">http://typophile.com/node/39965#comment-246011</a> , the whole thread is well worth reading)<br>
      8. Now you can generate MM font, install it via ATM 4.1 and test in real world.<br>
      9. When you know which instances you are interested in, go to Tools -&gt; Multiple Master -&gt; Generate Instance, set desired value and OK. New font is open in FontLab. Save and Genarate Font for further editing.<br>
      10. Open new OTF font in font editing program*, merge saved previously feature file. Edit your mark and mkmk features if needed, make all accented glyphs from composites.<br>
      11. Check your new font in real applications, make corrections, add hints etc, generate final font.<br>
      Of course you can do it in quite different way, this one looks good for me.<br>
      * FontForge or VOLT</p>
      <p>I. Fontographer: Type by Design  by Moye, Stephen<br>
      II. <a href="http://partners.adobe.com/public/developer/en/font/5091.Design_MM_Fonts.pdf" title="http://partners.adobe.com/public/developer/en/font/5091.Design_MM_Fonts.pdf">http://partners.adobe.com/public/developer/en/font/5091.Design_MM_Fonts.pdf</a><br>
      III. <a href="http://www.glyphsapp.com/tutorials/multiple-masters-part-1-setting-up-masters" title="http://www.glyphsapp.com/tutorials/multiple-masters-part-1-setting-up-masters">http://www.glyphsapp.com/tutorials/multiple-masters-part-1-setting-up-ma...</a> and part-2, part-3</p>
