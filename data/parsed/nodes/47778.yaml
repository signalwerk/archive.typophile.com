      <p>Come on, what is he stupid?!</p>
      <p>He doesnt need the font if you send him the outline logotype :)</p>
      <p>Provide him with different formats, AI, EPS, PDF and some Windows vector formats. If he cant use any of them, then he probably shouldnt work with this anyhow.</p>
