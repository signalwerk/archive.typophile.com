  html: |-
    <p>Hi, I tried to look in archive re this. Sorry if redundant.</p>
    <p>I designed a logo and supplied it in svg, pdf, jpeg, png (typefaces outlined).</p>
    <p>The client sent it to a freelance prototype engineer who contacted me for the font. I explained that the font was altered, creating custom logo and outlined -so having the font won’t help. His response:</p>
    <p>“Okay,<br>
     If you are not willing to send me the TFF file for this font I am going to have to go buy it for $106. I am not going to do this to use it just one time. I am not going to redraw it line by line either. You used it on your design so it would be nice to use it on the product. Give me a break here…”</p>
    <p>(the font is actually $45)<br>
    Bottom line: Is it custom to also include the font when supplying a logo to client?</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081122015506/http://www.typophile.com/node/47903" class="topic-previous" title="Go to previous forum topic">‹ Looking for a matching font.</a> <a href="/web/20081122015506/http://www.typophile.com/node/47869" class="topic-next" title="Go to next forum topic">Tips for finding fonts ›</a></div>
