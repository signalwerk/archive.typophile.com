  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a></strong></p>
    <p>Joe Pemberton is a graphic designer and a founding partner of <a href="/node/30526" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">San Francisco</a>-based interface design firm, <a href="/node/12021" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Punchcut</a>. Prior to founding Punchcut in 2002, Joe and <a href="/node/12069" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jared Benson</a> partnered on the development of <a href="/node/12022" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typophile</a>. Joe was a creative director for Razorfish (in the <a href="/node/20024" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">New York</a> and San Francisco offices) and also at the New York advertising agency, Merkeley Newman Harty where, among other projects, he designed the JetBlue Airways identity and livery&nbsp;system.</p>
    <p>In the past Joe Pemberton provided art direction for the <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> publication <em><a href="/node/add/wiki?edit%5Btitle%5D=Font_Magazine" title="Create node &quot;Font_Magazine&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Font</a></em> and juried the design competition for the 2007 <a href="/node/add/wiki?edit%5Btitle%5D=STEP%20Magazine" title="Create node &quot;STEP Magazine&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">STEP</span> Magazine</a> “Best of Web”&nbsp;issue.</p>
    <p>Typophile user profile: <a href="http://typophile.com/user/1160">http://typophile.com/user/1160</a><br>
    Personal web site: <a href="http://josephpemberton.com">http://josephpemberton.com</a></p>
