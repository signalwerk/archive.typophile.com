    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a></strong></p>
    <p>Joe Pemberton is a graphic designer and a founding partner of <a href="/wiki/San%20Francisco" class="freelinking" rel="nofollow">San Francisco</a>-based interface design firm, <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a>. Prior to founding Punchcut in 2002, Joe and <a href="/wiki/Jared%20Benson" class="freelinking" rel="nofollow">Jared Benson</a> partnered on the development of <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>. Joe was a creative director for Razorfish (in the <a href="/wiki/New%20York" class="freelinking" rel="nofollow">New York</a> and San Francisco offices) and also at the New York advertising agency, Merkeley Newman Harty where, among other projects, he designed the JetBlue Airways identity and livery system.</p>
    <p>In the past Joe Pemberton provided art direction for the <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> publication <em><a href="/wiki/Font_Magazine" class="freelinking" rel="nofollow">Font</a></em> and juried the design competition for the 2007 <a href="/wiki/STEP%20Magazine" class="freelinking" rel="nofollow">STEP Magazine</a> "Best of Web" issue.</p>
    <p>Typophile user profile: <a href="http://typophile.com/user/1160" title="http://typophile.com/user/1160">http://typophile.com/user/1160</a><br>
    Personal web site: <a href="http://josephpemberton.com" title="http://josephpemberton.com">http://josephpemberton.com</a></p>
