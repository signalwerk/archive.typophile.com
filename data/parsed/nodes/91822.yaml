      <p>Agree with the others, DINPro and Proxima Nova are very similar, pick one and use its various weights.</p>
      <p>And I agree with zevbiz, the kerning needs some attention, particularly the 'li' in Sublime, which is almost looking like it says 'Subl ime', and the 'cts' in architects, which look slightly looser than the preceding characters.</p>
      <p>One final suggestion, perhaps try the logo with an actual door half open in the plan? Might make it more obvious as to what the logo is. Your call.</p>
      <p>hth</p>
