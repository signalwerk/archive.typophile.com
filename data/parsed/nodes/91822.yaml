      <p>Hi Catharsis, the original draft did have the "door" as the same size of the main type. It made the main type look bigger then the "door" so to I had to adjust it optically and increased the size as it is now. Tittle size is actually calculated using the shifted baseline of U C S characters of DINPro to make it as natural as possible based on the typeface.</p>
      <p>When I saw your reply I noticed that DINPro actually looks shorter in height then Proxima Nova. The more I look at it the more I think it is a perfect combination, but it would definitely need some tiny increments in height of DINPro to make it work. </p>
      <p>What do you think?</p>
