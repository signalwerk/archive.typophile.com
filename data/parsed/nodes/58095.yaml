      <p>Well, hell. The last 20 years or so has seen a great deal of change and fluidity in typo-terminology. So I say you can call it what you want to call it.</p>
      <p>You can use the older, more formal term "Display" to denote familial cuts of a face. Or you can use the word "display" to refer to any type used in any of several ways: set large, set to draw attention, etc.</p>
      <p>The thing is: if you are going to use the term, make sure you are very clear about what you mean. In any evolving jargon or argot a term can have several meanings. It behooves us to be very clear about how we use the word. "Display" or "kern" may mean one thing to typographer A, and another thing to compositor B. Each must be clear about it to avoid confusion.</p>
      <p>powers</p>
      <p>P.S.: Nothing written above was a "lie". Less than 100% accurate, perhaps, but not a "lie."</p>
