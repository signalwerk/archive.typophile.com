    <p>I was trying to dilucidate the meaning of "display" for any given typeface. I found this on Wikipedia, it doesn't quote sources though.</p>
    <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/Typeface#Display_type" rel="nofollow">Display type</a></p>
    <p>Display is a particular use of type. In the days of letterpress and phototypesetting, many of the most commonly used typefaces were available in a "display face" variation. Display faces were created for best appearance at large "display" sizes (typically 36 points or larger) as might be used for a major headline in a newspaper or on the cover of a book. The main distinction of a display face was the lack of "ink traps", small indentations at the junctions of letter strokes. In smaller point sizes, these ink traps were intended to fill up when the letterpress was over-inked, providing some latitude in press operation while maintaining the intended appearance of the type design. (..)</p>
    <p>What are your thoughts on this?</p>
