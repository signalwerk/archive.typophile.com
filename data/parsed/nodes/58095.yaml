      <p>In my experience, "display type" has meant a distinct member of a type family, such as Minion Display, Miller Display, or Miller Headline. These faces have been made to use with text types, either members of their own families, or with other text faces, specifically at large sizes, as hinted at above. These faces are generally lighter in all ways than text faces. They are often narrower than the text face would be if enlarged to match the visual height of the display face. They usually have a somewhat tighter fit than text faces. And, yes, those nasty ink traps will be gone, but I think ink traps were the least concern in the production of display types that follow the distinctions I just noted.</p>
      <p>To see differences between text and display, set the same headline in, say, 60-point Minion Regular and also in 60-point Minion Display. Were you to use that 60-point Minion Regular on a broadside along with text also set in Regular, the headline would be far more powerful than the text. Set that headline in Minion Display and you will get a more elegant relation between text and display. Granted, this is all a matter of taste, intention, and design. If you set the 60-point Regular in a color other than the presumed black of the text, its relation to the text can be more harmonious.</p>
      <p>It is too bad, but few faces these days have display weights, and few typographers know how to use them well. We do see them with Miller, Minion, and a few others; to a limited extent the 18 cut of Clifford can be used as a small display face.*</p>
      <p>Craig's distinction ("looks good") seems not to take into account the intentions of the typeface designer, and may seem a bit flippant. Craig seems to allow that if a face looks good large but not small then it can be called a display face; and the opposite. In that way "looking good" is generally the result of how a typeface has been used by a compositor or typographer. This way any face well used can be called display. Typeface designers and manufacturers who create a display face and name it " XXX display" have aimed at putting another tool before the typographer. True, where I suggest Craig might have been flippant, I certainly can be called out as pedantic in this case.</p>
      <p>There also are some faces called "Titling," such as MT Dante Titling. I think this designation was more common with metal type. "Titling" generally meant all-cap fonts. But it could also imply either differences in the actual forms of some letters or differences in the bodies of the types.</p>
      <p>Someone with the old green Monotype binders at his or her desk will have to check me on this. But I recall that in Bembo and Perpetua Titling the J and the Q were different than their text cousins in that the tails of those letters were not drawn as descending strokes. They fit on the body. A 72-point Bembo Q was the same size as the O of the font, tail included; both would be just about 72 points tall. As would the H. Overshoot and undershoot for O and Q, as well as other visual necessities, would have been accounted for in the design.</p>
      <p>OR . . . J and Q might have descending parts, but these sorts would be cast on a body larger than the sorts without descenders. In such case non-descending sorts might be cast on a 72-point body, but J and Q might be cast on an 80- or 84-point body. The baseline would be consistent for both body sizes. The hand comp would then fit slugs under the non-d sorts to make a solid line. That was a lot of fun, especially when major changes were later made to such a titling line. This was done to reduce the amout of metal used in production of a face, and was obviously only used for all-cap titling faces.</p>
      <p>* One more thing: hot-metal Monotype had some sizes called "small display" faces. Whereas usually the Monotype caster could only cast text type, up to maybe 13- or 14-point, these small display faces, used on the correct keyboard and caster, could be on bodies up to 22- or 24-point. It was slow going for the casting machine, and sometimes some sorts had to be left out of the matrix case. Italic and Roman might no longer live in the same matrix case, and would have to be cast separately, again pieced together by the hand comp. There were only a few faces that had these small display mats; Centaur and Arrighi I recall, as well as Van Dijck and a few others.</p>
      <p>&amp; in the end there's nothing wrong with calling faces such as Fry's Ornamented or Koch Antiqua "display" faces, for they could have no other use than as display. But there can be times when these finer distinctions can help us be more precise in describing how typography works and how it looks.</p>
      <p>powers</p>
