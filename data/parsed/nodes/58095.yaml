      <p>Back into the future, what kind of typeface is a display typeface?<br>
      Is it Arno Display? is it Sugar Pie from SudTipos? are *grabs a shield* the myriad of ornamental fonts in DaFont, 1001fonts resembling everything from organic shapes, japanese kanjis, to LCD displays? (and let's better not forget about grunge fonts).<br>
      Is it the optical adjustment? is it what we use it for?<br>
      If it is what we use it for then any typeface is prone to be called Display. Now, most of the fonts that are currently called Display (and the name is not due to an optical adjustment) like Alpine Script, would have been called Ornamental if they were issued a decade earlier. But so are grunge fonts, but I don't think many people would call them Display fonts. So, after the optical adjustment and proper size for headlines (some say the Display size is a bit more compressed to fit the larger size in the limited space of a headline but that's a lie, check the new Marzo font from SudTipos), is the Display name an elitist label?<br>
      In the end there appears to be two Display terms in typography: the optical and size and a refined stylistic set of a style once known as Ornamental?</p>
