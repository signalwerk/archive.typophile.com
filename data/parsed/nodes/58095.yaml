      <p>Nowadays we hear the "display type"/"text type" distinction drawn between different typeface designs more often than between different cuts of the same typeface, I think.<br>
      If it looks good large and would be hard to read long texts in, it's a display face. Think headlines or ads.<br>
      If it looks good small and would be easier to read long texts in, it's a text face. Think novels or reference books.</p>
      <p>There's more (but not much) on the <a class="freelinking external" href="http://typophile.com/node/12605?" rel="nofollow">Wiki page</a>.</p>
