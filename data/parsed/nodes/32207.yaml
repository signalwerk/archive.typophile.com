    html: |-
      <p>The best way, in most fonts, to get the x-height algorithmically.</p>
      <p>Get the bounding box of the lower-case "o"; take the height. Subtract the overshoot below the baseline.</p>
      <p>Cheers,</p>
      <p>T</p>
