      <p>Yes, the serifs sometimes get in the way.</p>
      <p>When I said the "height" of the "o" I really meant the "maximum Y coordinate" - so you only need to subtract the overshoot once, becase the lower overshoot isn't getting counted in the Y-max in the first place.</p>
      <p>Cheers,</p>
      <p>T</p>
