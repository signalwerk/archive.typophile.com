      <p>But doesn't the <cite>o</cite> typically also have overshoot <em>above</em> the x-height level? Maybe a better approximation would be to take the height of the <cite>o</cite> and subtract <em>twice</em> the overshoot below the baseline.</p>
      <p>(BTW, why not just measure the height of the <cite>x</cite> itself? Do the serifs sometimes get in the way?)</p>
