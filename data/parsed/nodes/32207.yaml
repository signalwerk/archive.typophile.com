    html: |-
      <p>There are various software libraries that allow you to access font files directly (rather than calling the Windows API for some information on installed fonts). I think using FreeType 2 would be easiest since it provides object-oriented access to both OpenType/TrueType and Type 1 fonts:<br>
      <a href="http://www.freetype.org/freetype2/index.html" title="http://www.freetype.org/freetype2/index.html">http://www.freetype.org/freetype2/index.html</a></p>
      <p>For TrueType or OpenType fonts, you can read out the x-height included in the font using<br>
      <a href="http://freetype.sourceforge.net/freetype2/docs/reference/ft2-truetype_tables.html#TT_OS2" title="http://freetype.sourceforge.net/freetype2/docs/reference/ft2-truetype_tables.html#TT_OS2">http://freetype.sourceforge.net/freetype2/docs/reference/ft2-truetype_ta...</a> -- see sxHeight</p>
      <p>I recommend joining the FreeType discussion list to get more help. </p>
      <p>Regards,<br>
      A.</p>
