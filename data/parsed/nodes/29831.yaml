      <p>Interesting stuff, thanks for the suggestions so far. Sorry, I probably should have specified we’re a PC environment and most of the work that they’ll be doing is proposals and contracts... nothing visually stimulating <em>or I’d be out of a job</em></p>
      <p>I think they’re looking for something MS Word but has a multiplage support and work flow similar to Indesign, just simplified. </p>
      <p>Apparently, when you create multiple pages in Word and need to add  images or more text to a previous page, it pushes all the contents down to create room. This puts kinks up the work flow. Since I rarely use Word, I wasn’t aware of this issue. I’m currently using InDesign for all my multiple page needs. </p>
      <p>To recap:</p>
      <p><strong>• Desktop publishing with multiple page support and a per page work flow system that could run on a server in a PC environment.</strong></p>
      <p>This might make finding an applicable application a bit more difficult.</p>
