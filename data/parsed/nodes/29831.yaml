    html: |-
      <p>I wrote a fair amount on this and then managed to close the window, so will have to be a bit terse:</p>
      <p>When you mention the system being server-based, are you implying simultaneous editing/version control? </p>
      <p>If so, requirement might come under the heading of Content Management systems rather than DTP, and I think you’ll struggle to find anything that could be decribed as cheap.</p>
      <p>If not what’s the stress on being server based?</p>
      <p>Word is often used, particularly in house, for simple DTP and can produce professional results for certain kinds of docs, but you and your docs have to live with the single text stream approach, not worth trying to work round.</p>
      <p>Is the page-based workflow really required?</p>
      <p>Could you build single pages in Word and then collate (in Word or PDF)?</p>
      <p>Powerpoint is of course page based. Not suggesting it for anything that isn’t bullet points, but people do use it for all sorts of things, believe me - be ready with your arguments.</p>
