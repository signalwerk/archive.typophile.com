      <p>You could always try LaTex with one of the various GUIs out there...but the end-user revolt might cost more than licenses for Quark/Indesign. </p>
      <p>Miss Tiffany is right about Pages—It’s a pretty awesome hybrid word processor/page layout app, altho IMHO Indesign is easier to use and it would probably be less expensive to buy indesign than to teach users how to get into Pages. My problem with doing layout in pages is that it’s a template-based word processor on steroids, so anything other than dumping text into templates or blank pages gets obtuse quickly.</p>
