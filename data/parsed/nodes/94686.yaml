      <p>Listen to Kent: that IS the right tool for the job.</p>
      <p>As is Print Merging: an excellent thing to know how to do when certain kinds of jobs need to be done. Once you get clued into how it works, you can find a lot of other uses for it. And, if you are the go-to guy for it—as I was in my last job—you become a valuable member of the team. Which means your job is a bit more secure that it might otherwise be. Which, given the still alarmingly high unemployment rate, is encouraging.</p>
      <p>Study it well, Grasshopper.</p>
