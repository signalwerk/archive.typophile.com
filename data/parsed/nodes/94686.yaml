    <p>At work, finally learning how to do print merges, so I can do 8 up sequentially numbered raffle tickets and etc.<br>
    Having a bit of trouble picking which font I should use for this.  It needs to be official looking and yet somehow hand stamped.  Something exceptionally clear, in a weight somewhere in between narrow and medium.</p>
