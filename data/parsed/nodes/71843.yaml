    html: |-
      <p>Some of the italic letters, like the M, do look wider.<br>
      But the metrics -- character widths (including sidebearings) and heights -- are the same.</p>
      <p>The appearance of wideness is due to the fact that for a rhombus and rectangle of the same height and base, the rhombus will have longer sides. Note that the stroke weights of problematic characters, such as M italic, are slightly less than those of the roman, to compensate for this effect.</p>
      <p>The naming scheme is really two systems, alphabetic and numeric.<br>
      So in long form it would read: "Helvetica 45: Light Roman" and Helvetica 46: Light Italic". </p>
      <p>The numeric system is modern European (after Univers), but the more traditional method was felt necessary for the fuddy-duddy numbskulls in North America and elsewhere, just to confuse us with both.<br>
      If you think that's bad, try buying timber in Canada, where one has to contend with metric and imperial measurements, as well as real and nominal size!</p>
