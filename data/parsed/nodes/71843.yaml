    <p>Hi everyone,</p>
    <p>I have the typeface called Helvetica Neue 45 Light. As I needed the italic version of this font, I had to purchase Helvetica Neue 46 Light Italic. Only problem is that the italic version seems to be slightly larger than the non-italic 45 light. I also thought it odd that the italic version of 45 light is called 46 light italic.</p>
    <p>Just wondered if anyone else has experienced this and whether anyone has any idea of the reason for the size difference.</p>
    <p>Appreciate any assistance.</p>
