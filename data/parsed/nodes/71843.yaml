      <p>Thanks for the replies and the technical answer,</p>
      <p>I noticed that it's the Linotype version of the font that is creating this problem (for both the Light and Italic versions). If I instead use the Adobe Systems version of the font, ie. for both the Light and Italic versions, I don't get this problem. So it seems to be vendor-based.</p>
