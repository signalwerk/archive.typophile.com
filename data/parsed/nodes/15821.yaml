      <p>The concept itself is nice. I like the venn reference and the discussion aspect comes into play nicely with the word balloons. The balloon over the J looks a bit disjointed and improperly spaced to me, but the one over the I looks fine.</p>
      <p>The only issue I have is the color. I’d opt for more saturation. Lively discussion and a lively mark. Your Starcom work is a good example of what I would envision, but to an extreme extent. That might be a little too much for a government agency targeted piece of software.</p>
