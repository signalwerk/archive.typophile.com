  html: |-
    <p>This logo is for use on a software system that focuses on bringing different groups together and enabling them to form a consensus opinion about some topic. The software allows groups to post opinions in essay form, with each group member voting on which essay best describes their position. Through constant feedback between groups, a consensus is reached. In theory.</p>
    <p>I’ve used the idea of a venn-diagram, where two sides are presented and join in the middle, establishing a common ground, or a common voice. The name itself doesn’t mean anything, it’s just some unspecific title that’s friendly and unobtrusive. I guess. Stupid name if you ask me, especially since this software is targeted at government agencies and corporate committees. If I go into detail with it I will not stop.</p>
    <p>Thoughts on concept, form, and color are more than welcome!</p>
