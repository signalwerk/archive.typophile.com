    html: <p>very nice work, Christos! although it does seem familiar  <br>in some way, I think it will find a place of its own. <br> <br>I really like the 'O' in line D, but I think the splintered  <br>curves introduce a characteristic not present  <br>elsewhere. I'd go with line A. <br> <br>you might also want to try incorporating a curve similar  <br>to the 'B', 'R', and 'K' into one side or both of the 'M'. I'm  <br>not quite sure how that would work, but it's a thought.</p>
