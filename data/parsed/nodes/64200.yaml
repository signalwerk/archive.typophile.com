    html: |-
      <p>I'm with James, namely on the suggestion of black ink on blue/red paper and on his mention of American gothics.</p>
      <p>I think the logotype has got the flowery details covered. (Yes, I know we're dealing with a wedding, but even so.) To my eye, when you use delicate serif with it, the latter just looks overwhelmed, or like it's getting bullied. In response to your question to Nick, yes, I would put Baskerville aside, and consider an american display gothic that's got just a bit of character to it. Gothic Medium, or Gothic Special if you need a few more weights, from Wooden Type Fonts are but some examples.</p>
      <p>Good luck!</p>
