    date_raw: 13 Nov 2009 — 7:07am
    votes: null
    html: <p>Your type choice is off by decades. Circus/carnival materials of the depression era used sans lettering that blended American gothic type styles with humanist proportions similar to Gill Sans, mostly drawn by hand. Ornamental wood type like that was long out of style by then, and Baskerville was a book face. It’s also probably not a good idea to expect a Baskerville to hold up well knocked out like that on the tickets, and because ticket printing is usually cheap you should just use black or blue on red paper if you want it to look real.</p>
    html_clean: <p>Your type choice is off by decades. Circus/carnival materials of the depression era used sans lettering that blended American gothic type styles with humanist proportions similar to Gill Sans, mostly drawn by hand. Ornamental wood type like that was long out of style by then, and Baskerville was a book face. It’s also probably not a good idea to expect a Baskerville to hold up well knocked out like that on the tickets, and because ticket printing is usually cheap you should just use black or blue on red paper if you want it to look real.</p>
