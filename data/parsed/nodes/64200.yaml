      <p>I think your logo works just fine with the present font, although you should fix the alignment/skew of "type on a path".<br>
      It may not be historically authentic, but it is first and foremost the cliché for circus/fairground type, and looks like fun.<br>
      Don't use the same font for "admit one", as that cheapens the logo, which should be repeated (or at lest the type part of it) where you have set its name in Baskerville. At the moment, it looks like the name of the event is "ADMIT ONE".</p>
