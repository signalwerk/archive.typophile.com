    html: |-
      <p>While James is true that the wood types you show are a generation before the Great Depression, you can probably still use them for a carnival of that time. Carnival posters were printed by specialty printers that had loads of old wood type and they used it for years and years. They pretty much ignored the Art Nouveau and Art Deco styles that followed, keeping to the big and brash wood types.</p>
      <p>Just don't go confusing us with talk about the Depression era, when the look you want is more of the Wild West Shows of the late 19th Century. :)</p>
