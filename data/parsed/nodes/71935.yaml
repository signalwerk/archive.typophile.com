    html: |-
      <p>I guess I tried all the same things Florian did. Identifont was a letdown, not even tracking my choices very well. I once contacted the page owner and he admitted that some of the logic has flaws, but he sounded indifferent about fixing them. He has a great site, except for that attitude, if you ask me. If your tool doesn't work the way it's supposed to, then fix it. I used my own Sans Serif Font ID Guide, but it's too incomplete yet to find enough families for this.</p>
      <p>Anyway, I agree that the W is probably an inverted M. If I use that logic, the only letter I find difficult is the N. I suppose that would be an easy enough customization, but I am surprised NBC would go to that trouble. My candidate for a starting point font would be <a href="http://new.myfonts.com/fonts/typofonderie/anisette-std/" rel="nofollow">Anisette</a> by Porchez. The lower case letters are narrow caps and seem to be close enough to this lettering, as well as I can tell from the fuzzy graphic. The only letter that would take any alteration seems like the N. Just replace the W with an inverted M.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
