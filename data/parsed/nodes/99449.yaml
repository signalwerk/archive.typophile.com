      <p>Can be wrong but as pointed out, this looks too much symmetric to be a font to me, more a hand-lettering. The apparent effort to make strokes equally thickened is weird too. They may even have started with strokes, creating the sans backbone then adding serifs. You could also try to rework <a class="freelinking external" href="http://www.myfonts.com/search/Trajan" rel="nofollow">Trajan</a>, cutting and mirroring some strokes.<br>
      Some alternatives: <a class="freelinking external" href="http://www.myfonts.com/search/Penumbra+serif" rel="nofollow">Penumbra (Half) Serif</a>, <a class="freelinking external" href="http://www.myfonts.com/search/monkton" rel="nofollow">Monkton</a>, <a class="freelinking external" href="http://www.myfonts.com/search/Weiss" rel="nofollow">Weiss</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/jupiter/" rel="nofollow">Jupiter</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/giovanni/" rel="nofollow">Giovanni</a></p>
