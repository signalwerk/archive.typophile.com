    <p>.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/2010_5052.gif"></div><p></p>
    <p>The Armenian word Շնորհաւոր means "congratulations" and is used for well-wishing in the New Year. And the first letter of Շնորհաւոր, in its lowercase form, looks just like the numeral 2! So of course I couldn't resist. The one thing I'm wondering: is it really possible that a gradient can actually be useful, maybe once in a... decade?  :-)</p>
    <p>Happy New Year to all.</p>
    <p>hhp</p>
