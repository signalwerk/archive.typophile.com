    <p>An invitation to run my latest creation for Mac and PC:  <a class="freelinking external" href="http://chronotext.org/chanson" rel="nofollow">http://chronotext.org/chanson</a></p>
    <p>Based on a French poem by Guillaume Apollinaire, it is among other things an exercise in readability:</p>
    <p>How can the spoken and written versions of the same text interact together?</p>
    <p>Feedback is welcome,<br>
    Ariel</p>
