    html: |-
      <p>Hi Nick,</p>
      <p>I'm aware of the "follow the bouncing ball" problematic. I usually don't appreciate much the usual kinetic typography videos for the same reasons.</p>
      <p>So yes, you definitely put the finger on the kitschy side of this work. Hopefully, I hope the work will be appreciated for its "other qualities"...</p>
      <p>Let's take in count that this is experimental. By definition, the goal is to explore new directions and eventually make some interesting discoveries.</p>
      <p>One aspect that I wanted to explore is the mapping of a recorded speech into some visual representation:</p>
      <p>For that purpose, I used the concept of bricks: those are are either empty (corresponding to music or a pause in the speech) or filled with a word. Basically, the whole spatial layout is a direct representation of the soundtrack...</p>
      <p>Each of the 4 episodes is proposing a different spatial layout and a different unfolding of the intersection between the spoken and the written.</p>
      <p>I don't know of any other work exploring this direction (the artist Gary Hill have worked in the 80's on speech and visual representation, but without text rendering...)</p>
      <p>Anyway, I feel that the potential is huge, and that I have only scratched to top of an iceberg...</p>
      <p>A last parenthese: How did the idea of using bricks originated?</p>
      <p>Some strophes in the poem of Apollinaire's are metaphors based on the Bible: the narrator is like Pharaoh, pursuing his love, who is like the Hebrews...)</p>
      <p>The passage in the Bible treating of this episode is known as the Song of the Sea. Quoting Wikipedia:</p>
      <p><cite>It is one of only two sections of the Sefer Torah that is written with a different layout to the normal simple columns. The layout is similar to bricks in a wall: the alternating words are supposed to represent the two walls of the split sea with Israel walking down the middle.</cite></p>
      <p>I find it fascinating that a couple of thousand years ago, scribes already used some kind of metaphorical text layout (which is what I'm trying to achieve in my work for a decade...)</p>
