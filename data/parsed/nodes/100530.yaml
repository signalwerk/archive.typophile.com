    html: |-
      <p>Very clever, and the 3D imagery is spectacular, but I ﬁnd the effect of parallel visual-spoken text to be trite (fol-low the boun-cing ball) and annoying, like subtitles in the same language or teletext captioning if you don’t require it.</p>
      <p>It’s difﬁcult to pay attention to both visual and spoken text at the same time. Hit over the head with redundancy—a dilemma.</p>
      <p>If one or the other or both were at the threshold of comprehension, then they would each have a raison d’être.</p>
      <p>I would be quite happy with the pacing provided by the music, as the text unfolds, and no spoken verse.</p>
