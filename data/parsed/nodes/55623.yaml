    html: <p>What I think about before I begin creating a typeface often winds up being very different than what I end up with. I start with a trope or gimmick (which can include, and is not limited to, contrast, ductus, serif shape, &amp;c.) but as I carry it through it just doesn't work the way I thought it would, which leads me in new directions I hadn't considered previously.</p>
