    html: <p>I usually have a brief from the client, which may involve some technical constraints and a more or less tightly identified target usage. But the brief seldom specifies the actual style of the typeface, so within the constraints of the brief the first thing I start thinking about is the overall look and feel of the type, what a block of text will look like.</p>
