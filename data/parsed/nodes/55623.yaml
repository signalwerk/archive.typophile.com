      <p>Well, so far most of my fonts have been more of a weekend or two scope.</p>
      <p>I've been working on one whole typeface (something appropriate for hobbits, is my current opinion) that has pan-European glyph coverage, regular, bold and italic fonts and it all stated with a capital 'H' I doodled on the metro one day.<br>
      I mean, you have to start somewhere, and for me- designing type without a brief, it starts in my notebooks. I don't think I have anything significant to add to the world of text fonts yet, so for me- the more ambitious project I've undertaken- which may last a year, has mostly been an exorcise undertaken to learn all the parts that need to go into a complete typeface and to try and work out an efficient workflow (hint: not the way I've been working)</p>
