      <p>I often start with a concept that has two or more themes.<br>
      What would a typeface look like (and how could I get it to work), if it supported both "idea A" and "idea B"?<br>
      These ideas can be aesthetic, technological, cultural, market-driven, serendipity, whatever.<br>
      Making the font(s) is a process of working things out.</p>
