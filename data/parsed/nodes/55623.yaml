      <p>I'm not a professional typographer that does type design for a living, so in my case, it usually started after designing some letters for a logo and decided to draw the rest of the character set.</p>
      <p>My priority is to make the glyphs look good at display size and well-spaced using it's normal sidebearings, with kerning pairs as minimum as possible. I have never designed a text face. :)</p>
