      <p><em>"You are embarking on a months-long, if not years-long endeavor and this is all you need to start?"</em><br>
      :-) I think I'm of the opposite sort; I tend to over-think concepts and have trouble actually getting started. That said, I do think it's a good thing to have at least a semi-solid concept before starting out – at least basic things like intended use / target point size, serif size/shape (if applicable), basic proportions, and something like the "feel" the whole thing should have.<br>
      But I'm just starting out designing type, so this process is still very much under construction (and will likely remain so for the years to come ;-) ).</p>
