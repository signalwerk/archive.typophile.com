  html: "<p>I was wondering: what ideas do you have about a typeface before you begin drawing it? Obviously the basics will be there, sans or serif etc., but how much detail do you go into? Do you know in advance how much contrast you want, what sort of terminals you want, or does most of that come as you work? I know this probably differs for everyone, but I'd be interested to see where the common ground - if any - lies.</p>"
