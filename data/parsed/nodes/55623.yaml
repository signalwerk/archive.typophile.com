    html: |-
      <p>In my limited experience:</p>
      <p>I usually start from one or two characters that have been sketched in my notebook or on a scrap of paper (or sometimes a shape that emerged playing in Illustrator. So, I have this one character, and I start building around it. As I make more characters, I might realize that the weight of the stems has to change. Nothing is set from the beginning and the glyph that started it all might not even make it into the finished design.</p>
      <p>I do try to pin down the details as quickly as possible, so as not to have to redraw glyphs too often.</p>
