  html: |-
    <p>Hi!</p>
    <p>Do any of you fine folks know of software that allows you to group stray fonts into families at will? For instance, my office has a mangled list of about 33 Times New Roman versions strewn throughout our font list. I would like to somehow wrangle them together so that my design team is not searching all day for the condensed version etc.</p>
    <p>We use both Mac and PC. I am hoping for a solution that suits both systems (hahaha) but I will of course settle for either.</p>
    <p>Thanks! Let me know what you know!</p>
