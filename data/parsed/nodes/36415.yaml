    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : Indie Fonts 3</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IndieFonts3_3794.jpg"></div><p></p>
    <p><em>Indie Fonts 3</em>, a companion to the award winning <a href="/wiki/Indie%20Fonts" class="freelinking" rel="nofollow">Indie Fonts</a> series, brings together an additional 20 independent font foundries from around the world. This book is an invaluable resource of over 1,900 fonts for designers, art directors and typographers.</p>
    <p>This book is divided up by foundry so that the user can get a feel for the work produced by each group. This also makes it convenient to order fonts directly from their source. There is a visual font index provided in the front for quick scanning and a fully cross referenced index in the back containing font names, designers, and original designers. Also included are the essays: <em>Eight Is Not Enough</em> by noted typophile <a href="/wiki/Yves%20Peters" class="freelinking" rel="nofollow">Yves Peters</a> and <em>How I Learned to Stop Worrying and Love the EULA</em> by typographic designer and educator <a href="/wiki/Tiffany%20Wardle" class="freelinking" rel="nofollow">Tiffany Wardle</a>.</p>
    <p>Contributing foundries include <a href="/wiki/Baseline%20Fonts" class="freelinking" rel="nofollow">Baseline Fonts</a>, <a href="/wiki/Blue%20Vinyl%20Fonts" class="freelinking" rel="nofollow">Blue Vinyl Fonts</a>, <a href="/wiki/Device%20Fonts" class="freelinking" rel="nofollow">Device Fonts</a>, <a href="/wiki/E-phemera%20Fonts" class="freelinking" rel="nofollow">E-phemera Fonts</a>, <a href="/wiki/Font%20Brothers" class="freelinking" rel="nofollow">Font Brothers</a>, <a href="/wiki/Handselecta" class="freelinking" rel="nofollow">Handselecta</a>, <a href="/wiki/Jeremy%20Tankard%20Typography" class="freelinking" rel="nofollow">Jeremy Tankard Typography</a>, <a href="/wiki/Kenn%20Munk" class="freelinking" rel="nofollow">Kenn Munk</a>, <a href="/wiki/Letterhead%20Fonts" class="freelinking" rel="nofollow">Letterhead Fonts</a>, <a href="/wiki/Pizzadude" class="freelinking" rel="nofollow">Pizzadude</a>, <a href="/wiki/Positype" class="freelinking" rel="nofollow">Positype</a>, <a href="/wiki/Process%20Type%20Foundry" class="freelinking" rel="nofollow">Process Type Foundry</a>, <a href="/wiki/Rimmer%20Type%20Foundry" class="freelinking" rel="nofollow">Rimmer Type Foundry</a>, <a href="/wiki/Shinntype" class="freelinking" rel="nofollow">Shinntype</a>, <a href="/wiki/SparkyType" class="freelinking" rel="nofollow">SparkyType</a>, <a href="/wiki/Suitcase%20Type%20Foundry" class="freelinking" rel="nofollow">Suitcase Type Foundry</a>, <a href="/wiki/Suomi%20Type%20Foundry" class="freelinking" rel="nofollow">Suomi Type Foundry</a>, <a href="/wiki/Village" class="freelinking" rel="nofollow">Village</a>, <a href="/wiki/Virus%20Fonts" class="freelinking" rel="nofollow">Virus Fonts</a>, and <a href="/wiki/Wilton%20Foundry" class="freelinking" rel="nofollow">Wilton Foundry</a>.</p>
    <p>Accompanying this book is a Bonus Fonts CD-ROM that contains 53 indie fonts. The fonts are licensed from each contributing foundry for use solely by the owner of this book.</p>
    <p>Websites: <a href="http://www.indie-fonts.com" rel="nofollow">P-Type Publications</a> | <a href="http://www.typeco.com/3Books2.html" rel="nofollow">Typeco</a></p>
