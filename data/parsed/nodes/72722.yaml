      <p>Hi Rachel,</p>
      <p>Thanks for taking the time to comment. I know it was some time ago and I have only been working on it on and off but recently re-visited it on the request of the client wishing to incorporate a 'Alpine' mountain sort of aspect into the design. I was worried it would end up looking a bit glib so after some playing around with ideas, settled on a subtle use of negative space and strong shapes to give the suggestion of mountains/peaks. I also put the words underneath as you suggested. </p>
      <p>I think it needs Physiotherapy in it or it's not clear what it is for! </p>
      <p>Anyway, if you or anyone else reads this, I'd be happy to hear responses.</p>
      <p>Thanks<br>
      Chris<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AP_just_A_3705.jpg"></div><p></p>
