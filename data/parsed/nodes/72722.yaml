      <p>Hi Chris</p>
      <p>I like the combined 'A' and 'P' design, looks really nice, and also like the subtlety of the idea of a curved spine. I don't think the logo necessarily needs to say 'physiotherapist' anyway - could work just aswell without doing. Not 100% on the type curving around it though - perhaps the design should be allowed to breathe without other elements distracting attention. Perhaps simply placing the type underneath?</p>
      <p>Hope this is some help</p>
