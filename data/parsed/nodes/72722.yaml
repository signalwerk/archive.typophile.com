    <p>Hi there my idea generating forum friends,</p>
    <p>I have a Physiotherapist who needs a logo for her upcoming website and business cards - starting to get more clients etc etc. After some brief discussion as to what the brand values / message should be, she wants simple, premium, friendly. It is based in a reasonably affluent town so the clientele would most likely be well-off (hence the premium aspect). </p>
    <p>My worry is that it doesn't come across immediately as a 'Physiotherapist' but I was finding it hard to do this without resorting to glib, cliched hands, spines and muscle references, none of which really sum up physio. The curve of the 'A' is a subtle allusion to the spine but nothing more. </p>
    <p>The attached is the final of a few ideas and the one I was most happy with as far as hitting the brief went. I'm sure it could be improved and bettered so please fire away! *straps flack jacket on*</p>
    <p>Many thanks<br>
    Chris</p>
