  html: <p>I spent about a day tracing some sketches in Illustrator and throwing together an incomplete font. <br> <br>The inspiration for this was some "decorative Gothic capitals" I saw in a calligraphy book.  The calligrapher had taken some artistic liberties and added curly-cues to the Gothic shapes.  I've reinterpreted the shapes again, redrawn some completely, and this is the result. <br> <br>I'd like to know if the folks here think there's merit in this idea, and in developing the font further.  (I know that the outlines are pretty rough right now) <br> <br><img src="http://www.typophile.com/forums/messages/29/6983.gif" alt="Abbotsford"> <br> <br>Paul</p>
