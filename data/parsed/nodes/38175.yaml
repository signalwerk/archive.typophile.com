    html: |-
      <p>Thanks everybody. This was very helpful! </p>
      <p>I will fix some errors that have come to light and re-post v1.1 in 3 formats: TXT RTF &amp; PDF.</p>
      <p>By the way; TextEdit can be made to use 'Unicode UTF-8' also. But you have to make a change in the preferences. </p>
      <p>The other thing which I neglected to say and may be useful to know is that to test for Lingala ( one of the languages ) you must have extended Latin -B support in the font being tested. I would like to add more languages like this over time. Maybe then I can group them by Latin, Latin A &amp; Latin B. </p>
      <p>What do you think?</p>
