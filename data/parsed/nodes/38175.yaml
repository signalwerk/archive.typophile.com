    <p>I recently posted a text file* to help people who want to quickly get a sense of how their font looks in a variety of languages.<br>
    But one of the people using it says they can't see all the glyphs. The format I uses windows linebreaks and Unicode 8 no BOM. I could have used just Unicode 8 or Unicode 16, or Unicode 16, No BOM, or Unicode 16 Little Endian, or Unicode 16 Little Endian, No BOM. </p>
    <p>Any idea what line break type is going to be most compatible - and perhaps more importantly what Unicode encoding is best &amp; why?</p>
    <p>* The thread is here if you want to use the file or do a technical check:</p>
    <p><a href="http://typophile.com/node/31399" title="http://typophile.com/node/31399">http://typophile.com/node/31399</a></p>
    <p>It is also here in v1.2:</p>
