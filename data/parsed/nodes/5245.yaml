  html: "<p>Hi, I just found these boards, what a great resource. Here is the first draft of my newest font \"BackRiver\" These are the only characters so far and no text block is available (I don't have fontographer yet). But I love to hear what everybody thinks of it. I'll try to attach a swf now. <br> <br><!---Attachment: backriver.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">backriver.swf<br><a href=\"http://www.typophile.com/forums/messages/29/backriver.swf\"><b>backriver.swf</b></a> (4 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
