    html: <p> A very nice serifless roman, in the same vein as Optima and Legacy Sans. Are there plans for a companion italic? <br> <br>David Thometz </p>
  - id: 143485
    user: 1203
    date: 2001-09-21T15:27:00
    date_raw: 21 Sep 2001 — 3:27pm
    votes: null
    html: "<p> Nice start, Ryan. My two cents: <br> <br>- The diagonal of the Z needs more weight <br> <br>- Some of the upper case characters, like E,F and L seem a little flat -- literally. Consider applying some of the calligraphic touches in the lower case to these UC characters. </p>"
  - id: 143486
    user: 1200
    date: 2001-09-26T13:44:00
    date_raw: 26 Sep 2001 — 1:44pm
    votes: null
    html: <p> There are of course "plans" for an italic, but that's a ways off right now. I'm pretty happy with the lc and I agree that the UC still needs some work. I've tried to "liven" up the E,F etc but nothing seems right so far. Ideas? </p>
