    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sonda-1_4966.jpg"></div><p></p>
    <p>hi. i'm working on a visuals for a student film festival and i wanted to use some of those friendly geometric rounded sans serif fonts. i was looking for something bit quirky but logic and as simple as possible and i din't want it to be oddly bumpy, because lots of the fonts form this category are. i also didn't want the geometric construction to be the most prominent feature of the font.<br>
    i was looking for something like that, but i didn't find anything that would match my criteria... so in the end, i decided not to do compromises and draw something myself.<br>
    this is the result and i think it works very nice. i'm using it for titles and headlines in the visual, not for text. the image above is from a cd cover proposal i did with the font. please, let me know what you think about it, so i can take it further and maybe design the whole family? or if you think there's no more room for this kind of typeface, let me know as well.</p>
    <p>thanks. ondrej</p>
