      <p>Hmm, I do like the simple, inexact texture. It gives a nice printy, inky feel, with much more character than the standard rounded geometric fonts out there. It'll be interesting to see how you reconcile the liveliness with optical balance. </p>
      <p>I think your word space is a little on the narrow side and the emdash looks low. (But that could also add charm of course.)</p>
