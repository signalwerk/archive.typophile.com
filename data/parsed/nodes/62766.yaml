      <p>Looks really nice! Good work!<br>
      There are a few things I think I'd correct — I'm not an expert by any means so take my words as pointers and not facts... :)<br>
      I think you need to do a slight bit of optical correction. Although this is a monoline design, the eye sees vertical and horizontal strokes differently, which means you need to compensate in the design to make it look optically monoline. I'm trying to find Mark Jamra's article on optical correction but getting a 404 error. Anyway, the verticals need a few units thicker strokes, as well as the 3 and 9 o'clock positions on round glyphs.<br>
      I notice you've added overshoot on the round glyphs; but you also need a little on the round baseline terminals, so they look on the same baseline as for example the bottom stroke of L.<br>
      Crossbar of G looks a bit long? M is rather narrow.<br>
      I guess your tittles are intentionally rather large but I find them a bit distracting, though I do like the inky effect.<br>
      Have you tried a different design for Kk?<br>
      Arches of m look a bit dark.<br>
      Lowercase u looks a bit wide and y looks a bit sheared to the right somehow.<br>
      Numerals are really nice. 9 looks disproportioned though.<br>
      Spacing needs a bit of work to even out.</p>
      <p>Look forward to seeing this progress. :)</p>
