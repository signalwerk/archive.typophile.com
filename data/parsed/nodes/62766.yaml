    html: |-
      <p>hi bendy, thank you for your comments!<br>
      i am very well aware of the optical problems with fonts and i already did make some corrections in the version you saw on the pdf. the rings are thicker on the sides, many of the horizontals are thinner, but now i see that it's probably not enough. this was a four-afternoons work and i didn't have chance to print a single proof, so i'll trust you on this.<br>
      you are right, there are no overshoots on the rounded endings of the strokes. the thing is i needed to get this done very quickly, so i used round upm values for almost everything. the overshoot is 10, the thickness of the verticals is 100 and the horizontals are 95 :) all these will need some more work and tuning, however on the other hand, this roughness along with the big tittles and numbers gave the font quite nice character.<br>
      i'll examine closely the letters you mentioned. many of the proportions are based on the "simplicity" principle i tried to apply to this font. that's why the M is the same width as N, or K &amp; k are designed the way they are. 9 is a special case, i agree, it looks disproportioned, but only when it stands alone. in a group with other figures, it really adds life to the image, what do you think?<br>
      thank you very much again, i'll try to post updated version asap.<br>
      cheers, ondrej.</p>
