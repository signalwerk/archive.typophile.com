      <p>This is really neat! I like a lot of things like the ampersand, the big J serif, the straight arm of the r, the dingbats and especially the numerals.</p>
      <p>I think your optical correction for the rounds is just right. It's only the straight horizontals that could stand a tiny bit more thinning.</p>
      <p>The S, though... The S is noticeably top-heavy and and leaning to the right.</p>
