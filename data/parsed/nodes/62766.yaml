    html: |-
      <p>This is great stuff. Especially the tittles :-)<br>
      I love its balance between being quite clean, and very personable/likeable.</p>
      <p>Some impressions (but bear in mind I'm not the most experienced type designer in the room):<br>
      - I wonder if "f" seems a bit unhappy with the centered crossbar. Did you try making it shorter on the left (kind of like in the "t")?<br>
      - "m": Due to the way the stem/arch joins work, the first one is more tapered/thinned than the second. Not sure if that works – seems a bit imbalanced.<br>
      - I agree with Bendy that the crossbar of "G" seems long.<br>
      - "M" is a bit on the narrow side (then again, the intersection *is* high).<br>
      - Joins in "V"/"W" might be a bit dark.<br>
      - The diæreses might be *too* overpowering, but I'd have to see them in context.<br>
      - The bottom part of the germandbls is too wide; it doesn't (and usually can't) be the same width as the "s".<br>
      - The "loop" formed where the 2 glyphs meet in the "ct", "sp" and "st" ligatures looks a bit alien to me, in the sense that suddenly a "stroke" and "pen direction" can be felt. Compare to the typographic/"directionless" rigidity of the other ligatures (which I think works better). I think I'd ditch the "loop" and try a simple shear.</p>
      <p>But most of all please do keep working on this. I'd love to have it, for one :-)</p>
