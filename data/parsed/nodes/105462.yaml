  - id: 562582
    user: 205259
    date: 2013-08-13T11:26:00
    date_raw: 13 Aug 2013 — 11:26am
    votes: null
    html: |-
      <p>"Gare De Lyon" and Dijon, Vallorbe e.t.c. match Chambord Condensed, also by Roger Excoffon 1945-51 and released in several weights and Italic by the Fonderie Olive. As far as I know Chambord has not been digitized. For a full alphabet specimen see<br>
      Jaspert's Encylopedia of Type faces, 1970, at p. 259.<br>
      Don</p>
