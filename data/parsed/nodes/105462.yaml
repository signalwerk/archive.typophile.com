      <p>PARIS: <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/aurora" rel="nofollow">Aurora</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/wagner-grotesk" rel="nofollow">Wagner Grotesk</a><br>
      SIMPLON EXPRESS: confirming Banco by Don<br>
      Chambord is a nice find by Don too. <a class="freelinking external" href="http://www.myfonts.com/fonts/hihretrofonts/petrarka" rel="nofollow">Petrarka HiH</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/castletype/sonrisa" rel="nofollow">Sonrisa</a> and <a class="freelinking external" href="http://www.myfonts.com/search/Koloss" rel="nofollow">Koloss</a> are also related to Chambord but far from matching it.<br>
      BEOGRAD: don't know this one. As you said is close to Futura and <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/kabel" rel="nofollow">Kabel ITC</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/erbar" rel="nofollow">Erbar</a>.</p>
