      <p>Hi Chris,</p>
      <p>are you speaking of plain HTML text? You won’t have any control over the fonts and rendering techniques used at the visitors’ side.</p>
      <p><cite>I like the text font that is used in the Typophile forums.</cite></p>
      <p>That’s <code>Georgia</code>, at least if you have it installed.</p>
      <p>F</p>
