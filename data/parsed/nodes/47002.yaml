      <p>I think you completely misunderstand how 99.999% of the text you read on the Web is rendered – from outline fonts. An outline font that looks like a bitmap font is a non-starter.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
