      <p>Peter Biľak is pronounced the same way it is written. All the letters are read, no one stays silent.</p>
      <p>pɛtɛr bɪlʲak</p>
      <p>Peter (as the English word “pet”, then again the sound “e” from the word “pet” and finally rolled “r”*)<br>
      Biľak (“bi” as in “bitter”, “lak” is pronounced as “luck” in English, but “ľ” should be softer, palatalized**)</p>
      <p>The stress is alway on the first syllable.</p>
      <p>From Wikipedia:<br>
      * “rolled r” like in Italian, Scottish, Bavarian<br>
      ** ľ is pronounced nowadays by many speakers, esp. from western Slovakia, as a non-palatalized l, esp. in li and le where the caron is not written. The officially correct pronunciation of li and le as palatalized is already frequently perceived as marked (either as a trait of middle and eastern dialect, or as a feature of language zealots). (A similar tendency occurs in yeista Spanish, where however the palatal ll is pronounced like English j instead of λ.)</p>
