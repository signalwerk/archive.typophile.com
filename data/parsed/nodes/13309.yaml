      <p>&gt;TypeCon is lettering-centric.</p>
      <p>Actually, it’s centred on type, as the name would suggest.</p>
      <p>***</p>
      <p>A significant portion of attendees at each Typecon come from the local area.<br>
      People get involved with the conference years before it is located in their area.<br>
      At the moment, there doesn’t appear to be a “Tijuana contingent”, so it’s unlikely that TypeCon will be held there.</p>
      <p>We’ve had regular attendance by people from Sao Paulo, so that would be a better bet than Buenos Aires.</p>
