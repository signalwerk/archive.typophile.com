    html: |-
      <p>Compared to the ATypI conferences, TypeCon leans quite strongly towards lettering. Also, TypeCon generally has a less type-technical bent than some of us (like Thomas Phinney) would like - but that’s OK - most attendees seem to prefer the pronounced lettering slant. But denying this slant makes one seem like a lawyer. For Michael Jackson.</p>
      <p>As for Sao Paulo, it isn’t a bad choice, but it seems too far from the states for SoTA right now; Tijuana is a much better choice.* Also, more important than the number of past TypeCon attendees from a country** is -as you say- the number of <strong>locals</strong> who would attend. You’d do well to pay attention to things like tipoGrafica magazine. And Typophile.</p>
      <p>* I gave a talk there last year, and believe me, the interest in type is over-flowing, and the youthful energy is singular. I got the best Q&amp;A questions there I’ve ever heard. Wasn’t Tamye in touch with Jorge de Buen on this? He’s your man.</p>
      <p>** And don’t forget to account for the respective economic situations when gauging apparent interest. There are virtually no Argentinian entries in the (expensive) TDC contest, but a lot of great type has been coming out from down there, as attested in part by the results of Morisawa, a free competition.</p>
      <p>hhp</p>
