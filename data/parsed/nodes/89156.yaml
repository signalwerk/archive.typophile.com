    html: |-
      <p>Nick,  The cuts in stencils are used where needed to account for trapped areas and problematic angles that could lift and tear in application.  Where letters do not have these issues, cuts that just occur for style are counterproductive (excuse the pun).  Having tried cuts on some of the glyphs you mentioned,it became clear that readability was reduced far too much just for a certain style or "Look".</p>
      <p>I chose to stay closer to what worked best as an entire alphabet rather than what some might prefer stylistically.   Being too concerned about style makes me very nervous.  When the "Look" trumps the "Need", style is always the loser in my eyes.</p>
    html_clean: |-
