    <p></p><div class="imageWrap"><img src="http://typophile.com/files/yinzPoursiton2_5524.jpg"></div><p></p>
    <p>January 17, 2012.</p>
    <p>Dezcom Typefaces is proud to announce the release of "Dez Yinznat Stencil," a tough typeface with an industrial quality. </p>
    <p>"Dez Yinznat" is a condensed stencil Opentype-savvy sans serif inspired by the industrial city of Pittsburgh, PA, USA. Stencil type was often used in the steel mills, scrap metal yards, railroads, warehouses, and other industrial institutions of Pittsburgh and is almost a signature for the City. </p>
    <p>The name comes from combining two colloquial expressions common to Pittsburgh. "Yinz" is used there like "You'all" is used in Southern States. "n'at" or sometimes "N@" is used to replace "and that" when ending a phrase. </p>
    <p>The designer, Chris Lozos, says, "Pittsburgh was a true melting pot in my youth. My grandfather grew up in Greece and worked in the steel mills in Pittsburgh along side every other ethnicity. There "broken English" was the norm. Accents mingled and got mangled. Somehow, out of it all, came this odd dialect. Pittsburghese is not a very pleasant sounding departure from the norm but it befits hard times, hard work, tough conditions and a brotherhood of nationalities all bound together with the hope that the quitting time whistle would blow soon and they could rest—at least until their next shift."</p>
    <p>This font is dedicated to the hard-working people who made steel then and now. From Homestead Works, Pittsburgh and other American mill towns from Gary south to Birmingham and across the Atlantic to Europe's Hamburg, Sheffield, Pražská, Košice, Liége, Smederevo, and more.  </p>
    <p>is now available through MyFonts at:<br>
    <a href="http://new.myfonts.com/fonts/dezcom/dez-yinznat-stencil/" title="http://new.myfonts.com/fonts/dezcom/dez-yinznat-stencil/">http://new.myfonts.com/fonts/dezcom/dez-yinznat-stencil/</a></p>
    <p>Copyright 2012 by Chris Lozos and Dezcom</p>
