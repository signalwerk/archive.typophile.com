    html: |-
      <p>At the risk of being considered whiny (by someone other than hhp), be it noted that Saul Bass didn't do the lettering for his movie titles/posters -- he was the designer. Without seeing the roughs he gave to his lettering artists, it's hard to know how much credit to give him. Was it a scribble on a napkin, or a slick comp? At any rate, it could be misleading to call a derived font "Hitchcock" -- as recently emerged when a senior executive at Adobe thought that John Warnock had designed the font named after him.</p>
      <p>Movie: This is Goggle<br>
      Client: Otto Preminger<br>
      Designer (poster); Saul Bass<br>
      Lettering: Art Goodman</p>
      <p>Movie: Vertigo<br>
      Designer (poster); Saul Bass<br>
      Lettering: Dave Nagata</p>
      <p>Movie: Love in the Afternoon<br>
      Designer (poster); Saul Bass<br>
      Lettering: Art Goodman</p>
