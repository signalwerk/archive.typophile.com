    date_raw: 31 August 2007 - 9:58pm
    votes: 0
    html: <p>I worked with Saul Bass for 2 1/2 and also with Art Goodman and his assistant Dave Nagata. Dave Nagata was a master lettering artist and most of the comps were done by him while Art Goodman cracked the whip. When the comps were presented to Saul Bass and the actual font that matched the layout was chosen for the credits. I did the type on Mad, Mad, Mad, World. Main title were usually hand lettered. In the movie Man With the Golden Arm, Art Goodman's crippled arm was the model. Well, that's enough history for now.</p>
