    html: |-
      <p><cite>Are you using metrics classes, James?</cite></p>
      <p>Yes, but the classes are only for accented versions of the letters, and that’s not what’s being changed.</p>
      <p><cite>You mean, it looks as if the sidebearing of characters to the right of the one you just changed, changes?</cite></p>
      <p>No, I mean that if I have the text “VMVMVMV” onscreen and I change the left sidebearing of M from 95 to 85 the left sidebearing of V also changes to 85.</p>
