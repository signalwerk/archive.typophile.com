  html: <p>Sometimes when I alter the sidebearings of a letter by typing a new sidebearing value directly into the metrics table or by changing it with the keyboard Fontlab will also change the sidebearings of adjacent letters in the preview area of the metrics window. Is this a feature that I am using incorrectly or a bug?</p>
