    html: <p>According to the <a href="/wiki/https%3A/%252Fen.wikipedia.org/wiki/Pali" class="freelinking" rel="nofollow">Wikipedia article on Pāḷi</a>, the TeX Gyre fonts as well as some other common open-source fonts have the necessary diacritic characters for Pāḷi, but that still leaves you with a limited choice, and so going to Monokrom - apparently all their typefaces support an extensive collection of Latin alphabetic characters, but their page only lists native language support, not transliteration support - could well be a very good idea.</p>
