    html: |-
      <p>Thank you for your opinions and all the links! :-)</p>
      <p>To clarify: all the text is in English language, the sutta translations are in English as well as the commentary explanations of them. Both, sutta text and commentary are mixed, depending on wherever comments are required within the English translation of the sutta text.</p>
      <p>However, due to the difficulty of translating some of the original words from Pāḷi to English <em>and</em> keeping their original meaning within the translated English context, some of the Pāḷi terms are literal; they are then explained in the commentary following a Pāḷi passage. For example, "taṇhā" or "samādhi" or "pratītyasamutpāda"  are such terms.</p>
      <p>What I am looking for now is a type (or two, if paired) that is legible and fitting to the subject. <strong>Quadibloc</strong> made a nice suggestion in the initial post.</p>
      <p>What I have not quite figured out yet is if I should us one type and use a medium/bold for sutta text and normal/italic/light for the commentary text, or should two separate but paired types be used. In the end, everything needs to be comfortable and convey a notion of softness and lightness.</p>
      <p><strong>Sindre</strong>: Thanks for the Satyr link, it does look nice and there's a light Legato, it seems.</p>
