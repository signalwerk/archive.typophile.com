      <p>If one wishes to make an optimum aesthetic choice of typefaces for the English translation of the text itself, and the English-language commentary... one might have to resign oneself to using a different font for the translated text and the original Pāḷi text, since the number of fonts giving comprehensive coverage of that language is likely to be limited, and their support of the Latin alphabet may also be an afterthought.</p>
      <p>But this should be obvious common sense, so I suppose I've just misunderstood your intentions from your post. Hopefully there will be enough of a choice of adequate Pāḷi fonts to allow that part of the document to also fit in with your vision (I'd choose the Pāḷi font first, so that suitable typefaces for the rest of the document could be chosen that would also harmonize with it).</p>
      <p>I've noticed that one of the fonts is missing from the site given above, so one can also try <a class="freelinking external" href="http://www.buddhanet.net/ftp_pali.htm" rel="nofollow">this site</a>, which also has a face resembling Palatino with Pāḷi characters.</p>
      <p>I can't seem to see any Pāḷi characters in those fonts in Character Map, however. Here are some other recommendations:</p>
      <p><a class="freelinking external" href="http://www.ebmp.org/p_dwnlds.php" rel="nofollow">http://www.ebmp.org/p_dwnlds.php</a></p>
      <p>Odd, <a class="freelinking external" href="http://www.budsas.org/fonts/index.htm" rel="nofollow">this one</a>, also highly recommended for typesetting Pāḷi, is specifically for <em>romanized</em> Pāḷi. Perhaps another misunderstanding on my part.</p>
      <p>Ah; like Sanskrit, Pāḷi is often recorded in whatever Indic script is used locally, even if external scholarly translations standardize on Devanagari for Sanskrit. Maybe you need to Google for a <em>Sinhala</em> font with Pāḷi support (or support for conjunct characters, needed for both Pāḷi and Sanskrit) if your project was as I understood it after the language was mentioned...</p>
      <p><a class="freelinking external" href="http://awake.kiev.ua/dhamma/tipitaka/fonts/index.html" rel="nofollow">http://awake.kiev.ua/dhamma/tipitaka/fonts/index.html</a></p>
      <p>Here you are. Download before Russian tanks create connection problems. (Actually, while they have a Sinhala font, their Pāḷi font is also for Latin transliteration.)</p>
      <p>According to this page,</p>
      <p><a class="freelinking external" href="http://www.virtualvinodh.com/sinhala" rel="nofollow">http://www.virtualvinodh.com/sinhala</a></p>
      <p>though, only one font, a commercial Mac font, offers extensive conjunct support for the Sinhalese script.</p>
