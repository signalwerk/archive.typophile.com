      <p>The commentary should be readable too.</p>
      <p>Since Times Roman is so ubiquitous, it might be felt to show a lack of respect. Century Expanded and Baskerville are possible choices for the commentary.</p>
      <p>For the text, Garamond or Bembo are old and legible, and more appealing to the modern reader than Caslon.</p>
      <p>Caslon was, at one time, the standard for text, the way Times Roman is now, but unless you carefully choose the right Caslon, you could run badly astray. Acceptable Caslons for modern-day body text work include: Williams Caslon, Imprint, and even Adobe Caslon.</p>
      <p>These, though, are just very general suggestions, in terms of common fonts you might have handy.</p>
      <p>For the text, if I were going to indulge myself, I might go with <a class="freelinking external" href="http://www.myfonts.com/fonts/spiecegraphics/nicolas-jenson-sg/" rel="nofollow">Nicolas Jenson SG</a> (or <a class="freelinking external" href="http://www.identifont.com/show?73R" rel="nofollow">here</a>) which is a revival of Eusebius by Ludlow, one of the most accurate revivals of the original Jenson type.</p>
      <p>To go with that for commentary, I'd be tempted to be really radical, and go with <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/news-706/" rel="nofollow">Bitstream's News 706</a>, the currently available version of the newspaper face Aurora. If you want sans-serif, Univers is good for body copy, but I'd encourage you to consider Optima instead. Or just be less radical, and go with Century Schoolbook.</p>
      <p>Another option is Palatino. As long as the text and commentary are different in point size, that it isn't distinctive enough from Nicolas Jenson SG to be mixed with it in some ways shouldn't be a problem.</p>
      <p>Palatino for the text and Century Schoolbook for the commentary is another possibility for the kind of look I'm thinking of.</p>
      <p>On the other hand, looking at some Google Web Fonts that I liked recently, one could use <a href="/wiki/https%3A/%252Fwww.google.com/fonts/specimen/Rosarivo" class="freelinking" rel="nofollow">Rosarivo</a> for the text and <a class="freelinking external" href="http://www.google.com/fonts/specimen/Asul" rel="nofollow">Asul</a> for the commentary.</p>
