    <p>This post is related to <a class="freelinking external" href="http://graphicdesign.stackexchange.com/questions/26945/font-pairing-for-caslon" rel="nofollow">this</a> one, but Typophile is probably a better place to ask this question.</p>
    <p>I'm looking for a type or pair of types for a book, so it should be legible for larger portions of text. The book contains ancient Buddhist sutta text (in English) interspersed with commentary and explanations. The books has a very shallow structure, only chapter headings. The sutta text and commentary should be distinguished.</p>
    <p>Originally I thought Caslon for the sutta text because it's an old and legible type, but it may be too heavy? The reading experience should flow and feel airy and comfortable. Then I looked for a good pairing, hence this post :-)</p>
    <p>If you look at the original post, there are a few type proposals. But I am curious to hear the opinions of the community here? Thanks!</p>
