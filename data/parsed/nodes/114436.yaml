      <p>Thank you for the suggestions! I quite like the Nicolas Jenson SG type, it has a hint of old-style, almost medieval to it which might make it a good candidate for the old sutta text. On the other hand, the News 706 suggestion is great, it looks wonderfully round and soft and, due to the large x height, airy. Unfortunately there's no "light" version of it.</p>
      <p>I'd like to try a Jenson SG Medium with a News 706 Light Italic.</p>
      <p>Good idea about Google fonts, I'll poke around there as well. The only challenge I had in the past when working with old sutta text are Pāḷi specific characters with diacritics. Often times, the font I try doesn't provide for all the letters that I need...</p>
