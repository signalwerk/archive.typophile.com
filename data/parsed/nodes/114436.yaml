      <p><a class="freelinking external" href="http://monokrom.no/fonts/satyr" rel="nofollow">This typeface</a> (mine) supports transcription of Pali (and Sanskrit), and fits your description well. It is also not something found on your random computer. </p>
      <p>It pairs well with its own italic (which is very independent from the Roman), and also very well with Evert Bloemsma's <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-legato" rel="nofollow">Legato</a>.  </p>
      <p>Very, very few retail typefaces support Latin transcription of Indic typefaces, but I take great interest in antique and small languages, and make sure they are supported in my typefaces. The support is out-of-the-box, by use of the Unicode Extended Additional block, and not combining diacritics (though the typeface supports them too).</p>
