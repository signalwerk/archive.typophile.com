    html: |-
      <p>Well, I was in a similar situation, and the gallery was in a museum district.</p>
      <p>I decided to try and use that larger context. I also looked at the range of shows—which included everything from contemporary international art to period artifacts like clothing and furniture.</p>
      <p>I decided to pick a contemporary serif and combine that with more traditional sans so the publications etc. could shift in feel and remain within the identity.</p>
      <p>I think Pentagram’s work for the DMA is very solid, using Fedra Sans is very nice.<br>
      <a href="http://a.velluminous.org/dma.html" title="http://a.velluminous.org/dma.html">http://a.velluminous.org/dma.html</a></p>
      <p>Maybe a family like OurType’s Fresco and Fresco Sans would work. It would probably function well for wayfinding and identity, and have a serif option for extended text in a catalogue.</p>
