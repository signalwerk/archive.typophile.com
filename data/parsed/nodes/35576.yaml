    <p>Hello Typos<br>
    A new art gallery thats due to open next Aug<br>
    has approached me to redesign the existing identity.<br>
    See attached [dull sloppy vetica thing they have now]</p>
    <p>Has anyone got suggestions for a new typeface for the identity.<br>
    But I also want to sell the idea of doing the way-finding with the Architects<br>
    Also it will have to be used for catalogs and exhibition work.</p>
    <p>What do you suggest?</p>
    <p>The Gallery has an African /South Asian remit but its also contemporary art.</p>
    <p>Love</p>
    <p>Mr Brown</p>
