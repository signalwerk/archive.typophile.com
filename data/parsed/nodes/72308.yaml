    <p><strong>EDIT: please disregard the screenshots in this post and scroll down about seven entries to see updated screenshots. also, there are new attachments (in this post) below, prefixed with "8-6-10." please disregard the "osdc_typeface_1a.pdf" attachment. it is from a week or two ago. please use either the "sketches" or "refined" files for making comments or adjustments to characters. if i should delete the old files and screenshots, let me know. im not sure if people prefer to see the process from the beginning. thank you!</strong></p>
    <p>hello!</p>
    <p>this is a rough draft of the typeface i am currently making for <a class="freelinking external" href="http://www.opensource.com" rel="nofollow">opensource.com</a>. it can be stenciled. in that regard, it is "open." the opening is placed in a spot where the connecting stroke would normally need to taper as it connects with the adjacent stroke. ive shaped the characters so that most openings are created by two perpendicular strokes. this directly informed the bent terminals on many of the characters. </p>
    <p>i thought that eliminating the need for tapering would make the extension of this typeface (other weights, italics, other languages) an easier job for others, and thus make it more likely to happen. as it will be open sourced, the extension and additions by others will be encouraged.</p>
    <p>i request your feedback. please say anything! especially constructive stuff. are there inconsistencies? forms that need an overhaul or just a tiny tweak? do you have better ideas for the construction of any of the characters?</p>
    <p>images!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1alphabetuclc_4725.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/1osdc_6094.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/1osmultiplieslc_5882.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/1osmultipliesuc_4297.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/1packmybox_5817.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/1quickbrownfox_4851.png"></div><p></p>
    <p>other stuff:</p>
    <p>a bolder version will most likely be used for the logo.<br>
    the letterforms are currently a stroke for the body and a shape for the very end of the terminals. that is why you might notice a white line a few pixels before the very end of the strokes.<br>
    while i hope tapering wont be necessary, i do plan to reduce the thickness of the horizontal strokes compared to the vertical strokes. if you think this is unnecessary due to the disconnected nature of the typeface (or for another unknown-by-me reason), please let me know. or if you feel it is crucial, feel free to express that to me also.</p>
    <p>thank you for your time and feedback!</p>
    <p>EDIT:<br>
    ive attached the file osdc_typeface_1a.pdf to this post. it is quite a mess (please see my post below about this and other potentially useful stuff). if you open the pdf in illustrator, the guides and grid should remain intact. if you would like to make adjustments to any of the letters or make additional letters, perhaps you could do so on a new layer or somehow designate your changes so they are easy for me and others to find. this is very much in the early stages, and at this point i would most appreciate help in establishing the letter shapes. you are welcome to make adjustments that are more detailed than the generic letter shapes if you feel led to. thanks for looking and participating!</p>
