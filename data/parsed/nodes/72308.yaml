      <p>thank you for the comments, everyone.</p>
      <p>i cannot figure out how to attach files (an eps) in this reply. i thought i saw an "Attach a file..." option when i posted the thread. are attachments limited to the first post in a thread? please help!</p>
      <p>maxgraphic,<br>
      i will see how some of the characters look with fewer non-functional gaps the next time i sit down to spend some time on this. or if i can figure out how to attach the eps, someone else may like to...</p>
      <p>riccard0,<br>
      the gaps are not consistent. ack. at some point, the 60pt stroke that i used to determine gap width was changed to 50pt. so i think most of the lowercase has a 60pt gap and most of the uppercase has a 50pt gap. bummer. that is now on my list of things to adjust next. might anyone prefer one gap width over the other? or have a suggestion for a different gap width? the type will often be reduced to small sizes, so im leaning toward the ~60pt gap so it shows up better at smaller sizes.<br>
      i will look at the R again and make some adjustments.<br>
      i will also see how the J looks with a longer tail.</p>
      <p>velvetyne,<br>
      i would like to open it. my post above was made on the day i first described my concept with accompanying sketches. i would like to provide a document that explains the general idea for the typeface, explains my process so far (including how i set up my illustrator file with particular grids and guides [and why], and specifies the gap size, stroke widths, rounded corner radii, etc.), and explains what i believe will be some of the processes to come. i think this would prevent a waste of others time (for instance, if someone noticed that the horizontal stroke widths should be a touch thinner than their current width, and adjusted all of them without knowing that this is a step i am waiting to take later). i have yet to document or describe all of what i feel would be helpful. i think it would be helpful to communicate why i have made some of the design decisions that ive made so that others can be on the same page (or at least somewhere close). i will post an eps as soon as i can figure out how to do that. warning: my file is a mess. at this point, my main focus is to figure out the general character shapes. i expect fine tuning and more complicated processes to come later.</p>
      <p>cerulean,<br>
      good proposal. like you say, i also think it will give them more kinship to the A, M, and N. when i made the B, P, R, and D, i had yet to make the A, M, and N. pulling the top horizontal stroke over the vertical one somehow slipped my mind while making the B, P, R, and D. i will take a look at that soon.</p>
      <p>could someone please help me with my file attachment problem?</p>
      <p>thanks again for the feedback!</p>
