    html: <p>I think the look of B, D, P, R would be much improved if the top horizontal stroke went all the way to the left and rested on top of a gap on top of the left vertical stroke, and then the other end of that bowl should end in a gap like the P does. This would give them more kinship with the nicely distinctive capitals like A, M, N, and also would be more harmonious and more structurally sound as a stencil.</p>
