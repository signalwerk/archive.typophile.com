    html: |-
      <div class="comment-spam-body"><p>Reminds me of Lectura, a design by Dick Dooijes, Amsterdam Foundry, circa 1966. Letraset sold a version as a contact transfer from Tetterode. Character set is in the old Letraset product catalog.<br>
      A much thicker and more conventional version by Paul Hickson is available in digital format as Leighton from Red Rooster <a href="http://www.myfonts.com/fonts/redrooster/leighton-rr/" title="http://www.myfonts.com/fonts/redrooster/leighton-rr/">http://www.myfonts.com/fonts/redrooster/leighton-rr/</a><br>
      Don</p>
      </div>
