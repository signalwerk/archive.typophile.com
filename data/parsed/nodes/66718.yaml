    <p>Just found this, and thought I'd share it with everyone:</p>
    <p>As designers, we sometimes forget that not everyone can see color the same way we do. I found a sweet app that allows you to simulate what color blindness does to your designs, whether it be interface design or the composition of a 4-color poster.</p>
    <p>Here's an example of this page as viewed by someone with color blindness:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/picture-2010-01-27-at-9_4377.01.45-AM.jpg"></div><p></p>
    <p>So this free app for Windows, Linux and Mac simulates how approximately 5% of all men will see your designs. It's a pretty cool app to add to your toolbox o' design stuff.</p>
    <p>Anyway, the app is here <a href="http://colororacle.cartography.ch/" title="http://colororacle.cartography.ch/">http://colororacle.cartography.ch/</a></p>
