    html: <p>I am colour blind (deuteronopia), and it is eerie how I cannot notice anything out of the ordinary with the colours in the sample above. Only because the elements like the Font Bureau advert are on the same page enabling side-by-side comparison do I see that the colours are actually different. When people with normal colour vision see the above sample and immediately notice that the colours are off?</p>
