    html: <p>Eben, I understand that all opinion about design is purely subjective, but I wonder if you and I are seeing Costa in the same light? <br> <br>I do agree with Hrant that some characters, on their own, are bound to be a little odd looking. I also agree that it is for the good of the "group" that this occurs. But, how often does it happen? I personally do see some typefaces where a character is ugly--my opinion...all subjective--but if the designer knows--perhaps I need to read the whole thread first--what they are doing there doesn't have to be a lot of this occurring.</p>
