    html: <p>I don't mean litterally 'ugly'. That was hyperbole - it's true. <br> <br>I should clarify that I mean the top bold 'a' specifically - not the italic form &amp; by ugly I don't mean disgusting or horrible but rather something odd or different from the other characters. Something suprising &amp; unprogramatic - maybe a little stinky even. An exception.  <br> <br>There are alot of examples of this kind of thing in other arts.  <br> <br>- In perfume you often need a stinky/musky smell to go with your pretty aromas in order to take attention ( musk )  &amp; then reward that attention ( flower, fruits, spice etc. ).  <br> <br>- In western musical theory you need some 'disonant' or 'sad' notes to go with your 'whole' or 'happy' notes to create a feeling of resolution - otherwise it just sounds a bit boring. <br> <br>- Vienamese food needs a bit of stinky fermented fish sauce (which taken straight would be terrible) - or it comes off as bland &amp; uncomplicated. The fish sauce provides interest. <br> <br>I am sure there are plenty of other examples &amp; probably better ones &amp; even the Coasta 'a' may not be the best example of this exception in type - but the point is that type in general benefits from careful use of exceptions &amp; this is perhaps most true in a text face. <br> <br>I want to try to focus in on characters that benefit from being  exceptional in some way &amp; maybe even a bit distorted or stinky for a text face. <br> <br>I was hoping to do this without getting into the whole legibility/readabilty/baouma (sp?) debate - or a sellability debate ( Spiekermann's often related comment ((now paraphrased poorly by me)) that type designs with unusual shaped letters often sell better).  <br> <br>Anyway - no offence meant. Just the opposite in fact.</p>
    html_clean: <p>I don't mean litterally 'ugly'. That was hyperbole - it's true. <br> <br>I should clarify that I mean the top bold 'a' specifically - not the italic form &amp; by ugly I don't mean disgusting or horrible but rather something odd or different from the other characters. Something suprising &amp; unprogramatic - maybe a little stinky even. An exception.  <br> <br>There are alot of examples of this kind of thing in other arts.  <br> <br>- In perfume you often need a stinky/musky smell to go with your pretty aromas in order to take attention ( musk )  &amp; then reward that attention ( flower, fruits, spice etc. ).  <br> <br>- In western musical theory you need some 'disonant' or 'sad' notes to go with your 'whole' or 'happy' notes to create a feeling of resolution - otherwise it just sounds a bit boring. <br> <br>- Vienamese food needs a bit of stinky fermented fish sauce (which taken straight would be terrible) - or it comes off as bland &amp; uncomplicated. The fish sauce provides interest. <br> <br>I am sure there are plenty of other examples &amp; probably better ones &amp; even the Coasta 'a' may not be the best example of this exception in type - but the point is that type in general benefits from careful use of exceptions &amp; this is perhaps most true in a text face. <br> <br>I want to try to focus in on characters that benefit from being  exceptional in some way &amp; maybe even a bit distorted or stinky for a text face. <br> <br>I was hoping to do this without getting into the whole legibility/readabilty/baouma (sp?) debate - or a sellability debate ( Spiekermann's often related comment ((now paraphrased poorly by me)) that type designs with unusual shaped letters often sell better).  <br> <br>Anyway - no offence meant. Just the opposite in fact.</p>
