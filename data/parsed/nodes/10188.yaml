  html: "<p>I have noticed that lots of folks on the board have talked about the necessity of creating glyphs/characters which look a bit odd, eccentric, ugly or couterintuitivly shaped in order to get good flow in a text face in the course of discussing some other related topic. Has there been a thread that deals with this idea directly or in a more comprehensive manner?  <br> <br>examples: <br> <br>I was looking at Costa's (Porchez Typofonderie) bold/black 'a' &amp; thinking how right this idea must be. It's an ugly duckling for sure on it's own ( I think ) &amp; yet it works very well. No doubt about that. <br> <br>CostaPTF<img src=\"http://www.typophile.com/forums/messages/4100/69103.jpg\" alt=\"\"> <br> <br><a href=\"http://www.typofonderie.com/alphabets/view/\" target=\"_blank\">http://www.typofonderie.com/alphabets/view/</a> <br> <br>Hrant has also talked about the need for a compressed looking 'g'  &amp; the need to take special care with the 'r'. ( the arm needs to be shorter than you might think no? ) <br> <br>Hrant said \" Your \"g\"s need help though. For the Roman, I'd suggest giving it a bigger head and cramping the bottom (natural in a text face)\"  <br> <br>Anybody have a favorite 'ugly' character?  <br> <br>Anybody have a list of characters that need of distortion in a text face?  And maybe a description of the ditortion recomended?</p>"
  html_clean: "<p>I have noticed that lots of folks on the board have talked about the necessity of creating glyphs/characters which look a bit odd, eccentric, ugly or couterintuitivly shaped in order to get good flow in a text face in the course of discussing some other related topic. Has there been a thread that deals with this idea directly or in a more comprehensive manner?  <br> <br>examples: <br> <br>I was looking at Costa's (Porchez Typofonderie) bold/black 'a' &amp; thinking how right this idea must be. It's an ugly duckling for sure on it's own ( I think ) &amp; yet it works very well. No doubt about that. <br> <br>CostaPTF<img src=\"http://www.typophile.com/forums/messages/4100/69103.jpg\" alt=\"\"> <br> <br><a href=\"http://www.typofonderie.com/alphabets/view/\" target=\"_blank\" class=\"link-external\">http://www.typofonderie.com/alphabets/view/</a> <br> <br>Hrant has also talked about the need for a compressed looking 'g'  &amp; the need to take special care with the 'r'. ( the arm needs to be shorter than you might think no? ) <br> <br>Hrant said \" Your \"g\"s need help though. For the Roman, I'd suggest giving it a bigger head and cramping the bottom (natural in a text face)\"  <br> <br>Anybody have a favorite 'ugly' character?  <br> <br>Anybody have a list of characters that need of distortion in a text face?  And maybe a description of the ditortion recomended?</p>"
