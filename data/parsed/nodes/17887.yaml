    <p>Hi there!</p>
    <p>Just a basic question:</p>
    <p>1. I build a 5 weight/sans and sans-serif/regular and oblique typeface within Adobe Illustrator which I am quiete familiar with.</p>
    <p>2. I downloaded a Demo-Version of FontLab5 to get myself familiar with the next level, go from designing the letterforms to actually "making" a font out of them. </p>
    <p>3. My question is: how is it possible to set multiple charactes per glyph for an OpenType-font within FonLab?</p>
    <p>For example if I have two or maybe three different forms for an "N" character I want to have those accessible from within a sophisticated glyph table menu as it can be found in Adobe-applications like Illustrator or InDesign.</p>
    <p>I think i read that it is very possible to set up six characters per glyph. I just can not figure out how to do so within Fontlab.</p>
    <p>Some hint or short advise from anyone would be greatly appreciated :)</p>
    <p>Very best,</p>
    <p>Steffen!</p>
