    html: |-
      <p>Assume you have 3 a's, 4 b's and 2 c's. You'd have the glyphs: </p>
      <p>a a.1 a.2 b b.1 b.2 b.3 c c.1</p>
      <p>The features would be: </p>
      <p>feature salt {<br>
        sub a from [a.1 a.2];<br>
        sub b from [b.1 b.2 b.3];<br>
        sub c from [c.1];<br>
      } salt; </p>
      <p>feature ss01 {<br>
        sub a by a.1;<br>
        sub b by b.1;<br>
        sub c by c.1;<br>
      } ss01; </p>
      <p>feature ss02 {<br>
        sub a by a.2;<br>
        sub b by b.2;<br>
      } ss02; </p>
      <p>feature ss03 {<br>
        sub b by b.3;<br>
      } ss03; </p>
      <p>If your glyphs are a bit swashy, I'd also add: </p>
      <p>feature swsh {<br>
        sub a from [a.2];<br>
        sub b from [b.2 b.3];<br>
      } swsh; </p>
      <p>In Illustrator, there are separate toggles for salt and swsh, so you could get to the 1st alternate by salt and to the 2nd alternate by swsh. In InDesign CS2, there is access to the ssXX features so you could access to all the glyphs that way. </p>
      <p>A.</p>
