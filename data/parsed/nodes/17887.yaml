      <p>I'm not sure if this part has been answered for you yet--how and/or where to put the extra glyphs in the font.</p>
      <p>Here are two methods.</p>
      <p>Method 1. Let's say you want to make an alternate N. Select the N in the Font window. Choose Copy from the Edit menu. Right click (or control click) on the Font window to get the contextual pop-up menu. Select Append from the pop-up menu. A copy of the N, called N.001, will appear at the end of the font. You can keep this name or rename it something like N.alt1. </p>
      <p>Method 2. Again, let's say you want to make an alternate N. Choose "Generate Glyphs..." from the Glyph menu. Type the name you want to use, e.g. N.alt1, and click OK. A copy of the N glyph (with the name you gave it) will appear at the end of the font. </p>
      <p>In both of these cases, the name you give it (e.g., N.alt1) is the name you use when writing your salt or ss01, ss02, etc. features when referring to the alternate N. </p>
      <p>Now you can modify the artwork in the copy for your alternate glyph, paste your Illustrator art for the alternate N here, or delete the art and draw a new N from scratch.</p>
