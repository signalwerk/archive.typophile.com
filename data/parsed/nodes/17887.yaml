      <p>first of all, i'm going to assume that you have some OpenType programmign experience already, and so i'll jump right in:</p>
      <p><em>My question is: how is it possible to set multiple charactes per glyph for an OpenType-font within FonLab?</em></p>
      <p>This depends. you can put all six glyphs in different features. If it's a smallcap version of the glyph, put it in the smcp feature. If it's a swash variant, put it in the swsh or cswh features. If it's a titling alternate, put it in the titl feature. &amp;c...<br>
      Or, if you just want to put all six in say the stylistic alternates feature to be accessed by the glyph pallette, you can use this structure:</p>
      <p>sub n from [n.salt n.slt2 n.slt3 n.slt4 n.slt5 n.slt6];</p>
      <p>This works best in the stylistic alternates (salt) feature, however none but the first alternate will be automatically substituted and only in some programs if you use the salt feature.</p>
      <p><em>I think i read that it is very possible to set up six characters per glyph. I just can not figure out how to do so within Fontlab.</em></p>
      <p>I didn't realise there was a limit. Can anyone confirm or disprove this statement?</p>
