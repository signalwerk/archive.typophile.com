  html: <p>I'm doing a journal for a project and it's only a one or two off, so I can afford to go over the top. I'm trying to find resources on hand done binding but I cant really find any. I saw something Chris Moorby did - it was all magenta and was in CR a year or so ago i was looking for something like that? Any Ideas?</p>
