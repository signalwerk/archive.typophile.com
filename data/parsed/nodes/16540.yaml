    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 30.Nov.2005 3.56pm </div>
      <p>Fontographer lovers rejoice! Fontlab announces the release of Fontographer 4.7 for Macintosh - native on Mac OS X and with many functional and interface improvements, including:</p>
    <p>· native support for Mac OS X,<br>
    · support for the Euro character,<br>
    · updated encodings,<br>
    · copy-paste compatibility with new Illustrator and Freehand versions. </p>
    <p>Fontographer 4.1 users can upgrade for US$99; Fontographer 3.x users for US$198; and TypeTool users for US$299.</p>
    <p>Please browse to <a href="http://www.fontlab.com/Font-tools/Fontographer/" title="http://www.fontlab.com/Font-tools/Fontographer/">http://www.fontlab.com/Font-tools/Fontographer/</a> for full details on the newest, easiest font editor around!</p>
    <p>Happy fonting!<br>
    The Fontlab Team</p>
