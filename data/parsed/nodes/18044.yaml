      <p>--------------------------------------</p>
      <p>feature liga { # Standard Ligatures</p>
      <p>script latn; # Latin<br>
      lookup liga3 {<br>
          sub f f i by ffi;<br>
          sub f i by fi;<br>
      } liga3;<br>
      lookup liga4 {<br>
          sub f f l by ffl;<br>
          sub f f j by ffj;<br>
          sub f f by ff;<br>
          sub f j by fj;<br>
          sub f l by fl;<br>
          sub f t by ft;<br>
          sub T h by T_h;<br>
          sub Tcaron h by T_h.caron;<br>
      } liga4;</p>
      <p>language AZE exclude_dflt; # Azeri<br>
      lookup liga4;<br>
      language TUR exclude_dflt; # Turkish<br>
      lookup liga4;<br>
      language CRT exclude_dflt; # Crimean Tatar<br>
      lookup liga4;</p>
      <p>script cyrl;<br>
      language UKR;<br>
      lookup liga2 {<br>
          sub afii10104 afii10104 by _jiji.liga;<br>
