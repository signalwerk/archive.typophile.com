    votes: null
    html: |-
      <p>It's important that the second feature is of substitution type. With just the "kern" feature, only the GPOS table is included in the font file, and no GSUB. However, falsely, InDesign CS2 only checks for the presence of the GSUB table, and if there is none, does not process any OpenType features. Something like: </p>
      <p>feature liga {<br>
        sub f i by fi;<br>
        sub f l by fl;<br>
      } liga; </p>
      <p>would help out as this will ensure that a GSUB substitution table is included in the font file. I have requested that in the next version of AFDKO, an empty GSUB table is always included even if there are not substitution features are defined by the user. </p>
      <p>Adam Twardoch<br>
      Fontlab Ltd.</p>
