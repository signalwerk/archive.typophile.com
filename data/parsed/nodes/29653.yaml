      <p>Niels, this has been covered here somewhere before, but...</p>
      <p>You need to add a second OT feature to your files. For some buggy reason, fonts which only have a kern feature do not access that feature. The most common solution is to add the "basic" ligature feature for fi and fl substitution.</p>
      <p>Let us know if this works for you.</p>
    html_clean: |-
