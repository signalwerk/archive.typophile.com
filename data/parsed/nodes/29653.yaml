  - id: 170049
    user: 5094
    date: 2006-11-24T09:38:00
    date_raw: 24 Nov 2006 — 9:38am
    votes: null
    html: |-
      <p>Adam, you're right, I should have listed the feature -- it is the fraction feature, which FontLab (5.0) will generate automatically. If there are no fractions, you can use</p>
      <p>@SLASH = [slash fraction];<br>
      feature frac {<br>
       sub zero' @SLASH' zero' zero' by perthousand;<br>
       sub zero' @SLASH' zero' by percent;<br>
      } frac;</p>
      <p>It doesn't have to be a ligature feature -- Anything that generates a GSUB table will work, and fractions, which aren't on by default, are a safer substitution. If there is no "perthousand" in the font, just kill that one (actually, FontLab just won't generate the routine if it isn't in the font).</p>
      <p>Charles</p>
    html_clean: |-
