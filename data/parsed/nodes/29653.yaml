    html: |-
      <p>I believe it's also perfectly fine (spec-wise) to substitute a glyph for itself, so you could have something like:</p>
      <p><code>feature lnum {<br>
      &nbsp;&nbsp;&nbsp;sub zero by zero;<br>
      &nbsp;&nbsp;&nbsp;sub one by one;<br>
      &nbsp;&nbsp;&nbsp;# and so on...<br>
      } lnum;</code></p>
      <p>I'm sorta working off the top of my head here, so maybe there's a good reason to not do exactly that, with lnum; it's just an example of an approach worth mentioning.</p>
      <p>(In fact, I think the feature file "ignore sub" statement ends up in an OTF the same way, i.e. <code>ignore sub a b'</code> ends up being <code>sub a b' by b</code>, so perhaps a single <code>ignore sub</code> statement is also an option... not that I've actually tried this yet!)</p>
    html_clean: |-
