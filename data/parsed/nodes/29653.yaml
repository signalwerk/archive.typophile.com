    <p>As a small foundry we have developed numerous typefaces and are in the process of converting all our fonts to open type. The problem we are having is that our kerning pairs (although displaying fine in the metrics/kern window) are not making it into our otf file, or it appears that way when loaded into indesign and illustrator. What we are looking for is an online tutorial or some expert advice into generating reliable, complete, and of course cross-platform font files.</p>
    <p>Any thoughts or suggestions would be most appreciated.<br>
    (we are running Fontlab 4.5)</p>
    <p>Niels Oeltjen<br>
    Letterbox</p>
