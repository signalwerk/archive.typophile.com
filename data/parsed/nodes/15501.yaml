      <p>“I must say that this is not a good way of setting type”</p>
      <p>What is a good way? Is there a normal way and/or procees for setting up a book layout and setting type? (Maybe you could direct me to a resource/link (not Adobe’s website) so I don’t take up too much of your time.)</p>
      <p>The reason I asked is our main text box size (when there’s only one text box per page spanning top to bottom margin) seems randomly chosen. As a result, the text box height was 658.578pts or something like that. And we were spending a ridiculous amount of time trying to get the last line of type to sit at exactly the right point. I thought perhaps changing the text box height to 660pts might make things easier. </p>
      <p>Yes, the main headers are in separate text boxes, but other subheaders are not. </p>
      <p>The Academic Calendar is roughly 600 pages long. There are several sections of straight text, page layout is fairly complex — Section headers, mast heads, a main body that alternates from full width text to double columns for course descriptions and rules separating subsections. It gets updated every year and we make the updates straight into the ID files.  </p>
      <p>Just trying to find the best way to set things up — having converted from WP 5.0 last year, we’re not in Kansas anymore...</p>
      <p>Thanks, I appreciate even the confirmation that this is not the right way to go about it!</p>
      <p>Kristina</p>
