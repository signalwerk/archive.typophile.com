      <p>Kristina, do read Bringhurst’s ’Elements of Typographic Style’, if you haven’t already. It will give you a wealth of ideas. I think you can make this waaay better. (Another useful book is Felici’s ’Complete Manual of Typography.’)</p>
      <p>To start with, the ’all Arial’ is, I’m afraid, a horror to me as it is one of the hardest to read as text. If you did a mix of something like Scala for text and Scala sans for titles it would immediately be 100% better, but there are many, many other choices that would work better than (gag me with a spoon) Arial as text. Also take care that you have enough leading, even if you have to make the body size of the type smaller.  </p>
      <p>You say you absolutely don’t want to align to the grid. Well my (non expert) opinion is that you absolutely need to align to the grid. If you have to, you can do a finer grid, so that you have double the number of lines as the body size. That way you can do half (or one and a half) spacing between elements. But then the next half space brings you back to the grid and aligning with a lot of text on the opposite page. </p>
      <p>But whatever you do having a clean alignment is a key making the whole thing look good. In particular, having the facing pages end on different lines looks bad. Having the lines on facing pages align looks better if possible, and means you have less problems of show-through as the lines of type will align back-to-back. In this kind of thing it may not be possible, but having a finer grid that it aligns to will make the whole look better. You can also align the first line of paragraphs to the grid, and keep to the grid that way. </p>
      <p>This kind of work is some of the most typographically demanding there is, and having a good grid and keeping to it is a key to making the whole thing work. Squashing the lines of type vertically in irregular ways just disorients the reader, and makes the catalogue hard to read—and your whole point is to help the reader.   </p>
      <p>To be blunt, this is like a ’before’ in a before and after comparison. It is great that you want to work with this. If you absorb the ideas of Bringhurst and get an idea of what different typefaces can do, you will be really delighted with the improvements you can make. </p>
      <p>[Ps this should be moved to the ’critique/typography’ section.]</p>
