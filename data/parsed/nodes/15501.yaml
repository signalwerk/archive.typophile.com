    <p>I’m working in InDesign, and have a couple of layout questions (maybe newbie-ish). </p>
    <p>We want the baseline of the last line of text on each page to arrive at the same point. We’re doing this visually with a guide on the master text page. We absolutely don’t want to align to grid because we like to squeeze up lines of text. Our leading is 10pt. Does it make sense for me to say that if I want to have 66 lines of type on each page that my text box should be 660 points high? Granted, there are headers which are occasionally 14pt leading, etc, and those pages we’ll have to fiddle with to get the baselines to sit right. But if it’s a page of straight text with 10pt leading throughout, I shouldn’t have to do any adjusting, right? </p>
    <p>Now, if I change the “align first line of text” setting so that it aligns on cap height, does this affect my above calculations? </p>
    <p>Does anyone have a good suggestion for getting the top line of text and the bottom line of text to align to the same spot on every page?</p>
    <p>Next, How crazy is it for us to be doing what’s called “feathering” (I think) and adjusting leading to 9.8 and 9.7 or 9.65 for whole paragraphs in order to squeeze extra lines onto a page? </p>
    <p>Thanks everyone,<br>
    Kristina</p>
