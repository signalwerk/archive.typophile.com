      <p>William,<br>
      That was helpful. I would never have thought of a finer grid. I had assumed it had to match the leading. I will experiment with that on Tuesday. I will also get myself a copy of Bringhurst ASAP.</p>
      <p>I hate the arial, too. Believe me, I have to proof the monster, so probably read it more than anyone.</p>
      <p>In my own defense, I’m the assistant editor (with no training in typography) and I inherited this design. The book has looked like this for over 10 years. I’d like it to change, but I work with people who strongly resist any kind of change. You have given me some strong points to back up my case when I approach the other editor and my boss.  </p>
      <p>Terminaldesign,<br>
      Yes, the spacing around the rules is different. There is fractional leading in the paragraphs  because we have squeezed text onto the page and are also adjusting to get the last baseline to a certain (arbitrary) point. </p>
      <p>I think William’s suggestion may do the trick.</p>
      <p>I’m not sure how I’ll control orphans and widows. But I’ll fiddle first.</p>
      <p>Thank you, that was very helpful and enlightening. I knew the typography wasn’t good, but I didn’t realize it was that bad... :) That’s ok. (Off to buy a copy of Bringhurst now...)</p>
      <p>K.</p>
