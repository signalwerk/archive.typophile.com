  html: <p>Hi all, <br> <br>I thought I'd start off my first post with this font identification. I'm trying to identify the fonts from the bruce springsteen album "greetings from Asbury Park" designed by John Berg for Columbia. I'm sure that the "Asbury Park" was hand drawn, but I might be wrong or someone might know of something similar. I couldn't identify the "Greetings from" at all.  <br> <br>I hope someone can help me. I did a search because I thought this might have been discussed before, but came up with nothing.  <br> <br>thanks, <br>Brian <br> <br><img src="http://www.typophile.com/forums/messages/83/51033.jpg" alt="Greetings from Asbury Park"></p>
