    html: <p>Nothing beats Monotype Baskerville in metal. If you look at a mid-century technical book set in Mono Baskerville 12 pt with 10 pt for indented quotes, you drool over the utter even-ness of colour, impossible to attain with any digital type except Sumner Stone's Cycles. The transition from size to size seems to have been particularly well done in Mono Baskerville, at least in those key sizes.</p>
