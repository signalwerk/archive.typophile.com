    html: |-
      <p>I have a couple of books at home set in metal Monotype Baskerville and yes, it looks great. But speaking of digital interpretations, it seems to be a shared opinion that the best versions available now are František Štorm's (Storm Type Foundry) and Lars Bergquist's (Fountain), for variuos reasons: the degree of authenticity towards the original model and the full OpenType features, among them. Besides a (not so) slightly different designs, these two versions vary for the weights/styles offer: Storm's features text display sizes, medium and bold weights (+ italics), small caps related figures, greek and cyrillic alphabets, while Bergquist's has roman and italic (and small caps), as a more faithful approach to the original "period design". They differ in price too, but both look like very strong and functional interpretations. It is interesting to note, by the way, how many different versions of the typeface has been produced, and how *really* different they look from one another. Here are some links:</p>
      <p>Storm Type Foundry:<br><a href="http://www.stormtype.com/typefaces-fonts-shop/families-114-baskerville-original-pro">http://www.stormtype.com/typefaces-fonts-shop/families-114-baskerville-o...</a></p>
      <p>Fountain:<br><a href="http://www.fountaintype.com/typefaces/baskerville-1757/">http://www.fountaintype.com/typefaces/baskerville-1757/</a></p>
      <p>So many Baskervilles:<br><a href="http://www.identifont.com/find?font=Baskerville&amp;q=Go">http://www.identifont.com/find?font=Baskerville&amp;q=Go</a></p>
