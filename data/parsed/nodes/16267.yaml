      <p>what’s the destination? screen or print?</p>
      <p>the first thing that came to mind when i saw the word “plague” was the black plague, historically, which made me think “baroque,” and i thought of storm’s beautiful <a href="http://www.stormtype.com/regu.html" target="_blank">regula</a>. (actually, regula is probably too beautiful to be sick.)</p>
      <p>but if the context is...i don’t know, say, contemporary germ warfare, then how about one of house industries’ distressed faces, like <a href="http://www.houseindustries.com/index.php?page=showfont&amp;id=201&amp;subpage=lettersetter" target="_blank">housecopy</a>?</p>
