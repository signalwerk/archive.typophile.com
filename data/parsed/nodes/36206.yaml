    <p>This had been IDed elsewhere as Akzidenz Grotesk. Unless part of the letters had been modified though (at once, the “E” and the “S”, as well as the “8”, evidently don’t match), I believe that’s hardly it?... Couldn’t get any closer than <a href="https://web.archive.org/web/20081007161040/http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sh/bla-con">Europa Grotesk</a>, myself, either, which also doesn’t quite match yet (roughly, still missing that shorter horizontal middle bar in the “E”, at least)...</p>
    <p>Would greatly appreciate any further help to get to the right match, thank you! :-)</p>
