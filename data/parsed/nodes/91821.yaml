    <p>I'm equal parts delighted and nervous to have been invited to <a href="http://www.istype.com/?p=776" rel="nofollow">speak</a> about Armenian type at the promising <a href="http://www.istype.com/" rel="nofollow">ISType</a> conference in Turkey. Istanbul seems like a fascinating city, so I hope to see some fellow Typophilers there!</p>
    <p>hhp</p>
