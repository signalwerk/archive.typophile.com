    html: <p>Edmund Scientific used to sell inexpensive meniscus lenses in larger sizes. Some thirty-five or forty years ago, I built an opaque projector with two three-inch lenses mounted the proper distance apart (Google "optics") at either end of a cardboard tube. The whole project cost less than $10 (hey, I said it was awhile ago), and worked just fine.</p>
