    <p>Hey, guys I'm new on here, hope this is in the best section. I kind of have a peculiar question. I'm looking to physically enlarge a text(Ziggurat) in order to use it as a stencil. I would have kinko's do it as usual, but considering the size, it will be more expensive than I'd like to pay.</p>
    <p>I was wondering if anyone new of a site or place to find font measurements and pitches, which would make it very easy to enlarge. If not, I guess I'll resort to finding the ratios from photoshop or try to make/buy a projector. Any other tips or recommendations would be appreciated. </p>
    <p>Thanks</p>
