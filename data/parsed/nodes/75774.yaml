    date: 2010-10-29T09:28:00
    date_raw: 29 Oct 2010 — 9:28am
    votes: null
    html: <p>If you actually own the font, what's to prevent you from setting individual letters in an appropriate type size, printing them out individually, and then pasting them on cardboard to cut the stencil? With most faces, you could easily print a 500-700 pt. letter on a letter-sized sheet...</p>
  - id: 436861
    user: 13487
    date: 2010-10-29T09:34:00
    date_raw: 29 Oct 2010 — 9:34am
    votes: null
    html: <p>…or setting the letters really large in Illustrator (potentially with a grid behind them) to measure their individual parts?</p>
  - id: 436864
    user: 58010
    date: 2010-10-29T10:04:00
    date_raw: 29 Oct 2010 — 10:04am
    votes: null
    html: |-
      <p>&gt; With most faces, you could easily print a 500-700 pt.<br>
      &gt; letter on a letter-sized sheet</p>
      <p>And if you need a letter bigger than that, you can tile it across several sheets, and then cut/tape them together to form the complete letter. Some programs (InDesign, for example) can tile automatically when printing an image that's too big to fit on one sheet. </p>
      <p>&gt; or try to make/buy a projector</p>
      <p>If you use a projector, draw some faint vertical and horizontal guidelines on the cardboard -- or whatever surface you're projecting onto -- to help keep everything aligned and to make sure you're not getting any subtle distortion.</p>
  - id: 436871
    user: 74738
    date: 2010-10-29T10:50:00
    date_raw: 29 Oct 2010 — 10:50am
    votes: null
    html: |-
      <p>I've already been tiling at kinko's with 11"x17" cardstock (their largest size available for cardstock). But since this will be about 5ftx50ft(250sq.ft) printing at kinko's could potentially cost $140-$180. I was just hoping there was an easier way than the grid system.</p>
      <p>After some googl-ing, I think I've settled on trying to copy this <a href="http://goo.gl/cjE8" rel="nofollow">simple projector</a> design, but I will most likely resort to manually taking the measurements from the computer, which requires no cost. I know an antique store that sells old lenses, but it may not be worth the cost. </p>
      <p>Thanks for the input</p>
