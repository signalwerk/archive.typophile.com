    html: '<p>I have no experience with CAD programs, but this type reminds me a lot of the soft monolinear letters (often designed by engineers) for routing and stencils. For reference: <a href="http://www.fontshop.com/search/?q=Isonorm">Isonorm</a> and <a href="http://www.fontshop.com/fonts/singles/scangraphic/din_17_sb_regular/">DIN 17</a>. More recent interpretations include <a href="http://typographica.org/001082.php">Gotham Rounded and Bryant</a>.</p>'
