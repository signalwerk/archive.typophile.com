    html: |-
      <p>Offhand, I don't recall any types with cursive (joined) capitals.<br>
      But if we're talking about discrete swash capitals, first, you have to have a typeface where the swash caps have been designed for all-cap setting, not just as initials.<br>
      I've done a few such types: FF Oneleigh Pro, Scotch Modern, and FF Fontesque Pro (top to bottom)—<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Eszetts_5941.png"></div><p></p>
      <p>For Oneleigh, I was able to come up with a unique swash form for the cap eszett, but didn't think it would be merited for the more demure swash caps of the Scotch Modern, where the default Eszett already had the ball terminal which is the primary feature of the swash caps. In Fontesque, the default caps are somewhat swashy—I suppose I could have come up with something special for the cap eszett, but found it easier to adapt the Oneleigh Italic glyph.</p>
      <p>I haven't produced swash small caps for any faces.</p>
