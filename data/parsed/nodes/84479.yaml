      <p>A hypo-theoretical italic small cap “Eszett” ß would however mimic a hypo-theoretical italic cap Eszett. Some people here in the forum expressed that they wouldn't buy a font without italic small caps, <a class="freelinking external" href="http://www.google.com/search?sourceid=chrome&amp;ie=UTF-8&amp;q=italic+small-caps+site%3Atypophile.com#hl=de&amp;q=italic+small*caps+site:typophile.com&amp;pbx=1&amp;oq=italic+small*caps+site:typophile.com&amp;aq=f&amp;aqi=&amp;aql=&amp;gs_sm=e&amp;gs_upl=1672l2471l0l4141l2l2l0l0l0l0l452l820l3-1.1l2l0&amp;fp=1&amp;biw=1229&amp;bih=706&amp;bav=on.2,or.r_gc.r_pw.&amp;cad=b" rel="nofollow">as google reveales.</a><br>
      But if German language users would mind if an italic small caps Eszett is “missing”? Put into context, italic small caps would be necessary for acronyms maybe. As of 2011 I think it would be an exotic glyph, and the idea is already two steps ahead of the current use, as the people who even heard of the Eszett cap in the first place are few, but why not being two steps ahead?</p>
