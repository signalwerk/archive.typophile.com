    html: <p>Thank you, everyone, for your input, even if the question was a bit odd to start with. I originally asked the question with a Spencerian script in mind; I didn't bother to ask myself why one would use such a character. But the all-caps swash styles are fairly close to what I had in mind, and certainly more practical.</p>
