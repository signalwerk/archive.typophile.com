    html: <p> Is the font available for retail purchase? I am working with a client who uses it for their corporate typeface, and have yet to see it anywhere for sale. I had looked for it earlier on the FB site and still haven't been able to find it. <br> <br>(I haven't received my copy of the new FB book yet) <br> <br>jb </p>
  - id: 138262
    user: 1203
    date: 2001-05-23T22:27:00
    date_raw: 23 May 2001 — 10:27pm
    votes: null
    html: <p>The new Font Bureau book divides their fonts up into regular retail fonts (available from the usual sources) and "special" families that are available directly from FB only. Benton Gothic falls into the latter category, but <i>is</i> for sale as near as I can tell.</p>
