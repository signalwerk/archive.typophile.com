    html: <p> Is the font available for retail purchase? I am working with a client who uses it for their corporate typeface, and have yet to see it anywhere for sale. I had looked for it earlier on the <span class="caps">FB</span> site and still haven’t been able to ﬁnd it. <br><br>(I haven’t received my copy of the new <span class="caps">FB</span> book yet) <br><br>jb </p>
