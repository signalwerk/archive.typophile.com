  html: <p>Benton Gothic is the sans serif Font Bureau designed for Worth and Martha Stewart Living. It's sort of a compilation of all of Benton's gothics. Check out the Font Bureau web site ( <a href="http://www.fontbureau.com" target="_top">http://www.fontbureau.com</a> , but you knew that!) or their new hardcover type specimen book (fabulous!) for more info.</p>
