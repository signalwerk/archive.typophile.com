    html: <p>The new Font Bureau book divides their fonts up into regular retail fonts (available from the usual sources) and “special” families that are available directly from <span class="caps">FB</span> only. Benton Gothic falls into the latter category, but <i>is</i> for sale as near as I can&nbsp;tell.</p>
