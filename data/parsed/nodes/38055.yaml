    <p>I am most certainly not a designer, but I would like to come up with a decent logo, ive trawled threw hundreds of fonts and not found much that look relevant</p>
    <p>The company name is “hypernumbers”, it plans to be the de facto standard for sharing numbers ’doing for numbers what hypertext did for text’ </p>
    <p>I quite like elegant fonts, usually stick to serif, but with this it does need to be quite modern and technical</p>
    <p><a href="http://arandomurl.com/stuff/Logo.jpg">Current Samples</a> is what I have found so far, I prefer 1 the most (KofiPure), particularly the quircky descender on y, but it does looks quite chunkily constructed, 2 (Avance) is a font i love, but overuse, and it doesnt quite fit, the other I just came across, i quite like it, but certainly not convinced</p>
    <p>I would really appreciate any suggestions on faces or even places to look</p>
    <p>Thanks</p>
    <p>Dale</p>
