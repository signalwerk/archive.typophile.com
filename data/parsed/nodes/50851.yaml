    <p>Hi there<br>
    I need a few thoughts on this design i am currently working on.<br>
    It is a social investment/development project in Africa. Here: <a href="http://youturn.jesperlarsen.com/" title="http://youturn.jesperlarsen.com/">http://youturn.jesperlarsen.com/</a> you can read more about it as well as see an earlier version of the logo and the website in development.<br>
