      <p>I was going to write and say that I think the "turn" being backwards is ok. Then I changed my mind. I understand what you're saying about it not being a problem once you establish brand recognition, but I don't think it's necessary for that. Your logo is already unique in the way the two lines of text come together. There's not many logos out there with vertical type. I like your most recent version the best with "turn" knocked out, it really grabs attention. i also prefer it without the period. It only adds confusion because it makes it seem like that's the end point and i keep trying to read it backwards, especially with the turn flipped like that. there doesn't seem to be a point (pun!).</p>
      <p>I also like the logo on top of africa, i could definitely see it printed on a tee. But I wouldn't use africa as part of the logo. it works well as a secondary element as you're using it now.</p>
      <p>the only other thing that bothers me a bit is that i keep thinking u-turn, i saw the arrows on your site and i can see that this plays into it a lot. but the logo isn't really making the shape of a u-turn. more of an L. I'm guessing your intention of turning the text like that was to play on the u-turn. it's just not there yet for me...although it still is very eye appealing and maybe doesn't need to be that obvious either.</p>
