    html: <p>I think people will have difficulty reading "turn" to be honest. It took me several tries before I figured it out. And then after figuring it out, it unfortunately didn't have that "oh that's clever!" moment. It was more of a, "now why did they do that?" Why not make the "turn" text fall vertically? Why have the entire "turn" reversed? That would make the effect more subtle and I think improve the readability. I understand the concept of a u-turn that's involved here but I think readability would be more important then keeping the concept "pure". Also the look and feel of the design is very "industrial" to be honest. I'm not sure about the dot before the "you." Does it have meaning? Because I'm not figuring that out. That's my 2 cents.</p>
