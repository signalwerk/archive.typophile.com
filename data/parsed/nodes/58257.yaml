      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/ef/quentin/" rel="nofollow">Quentin</a> is similar to the older PATISSERIE lettering. Other Western or Tuscan styles might come close too.</p>
      <p>For the PATISSERIE in the newer sign, <a class="freelinking external" href="http://new.myfonts.com/fonts/ef/itc-newtext/" rel="nofollow">ITC Newtext</a> is fairly close, oddly enough.</p>
      <p>FontMesa and Solotype both have a fair number of fonts from this era. These were just the first things that came to mind.</p>
      <p>- Mike Yanega</p>
