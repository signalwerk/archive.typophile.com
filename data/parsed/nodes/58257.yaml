    <p>I have several typefaces from the 1800's that I'm trying to identify, and I haven't yet been able to find anything that's close enough. I found them on a storefront dating from the 1800's. Both photos are quite old, but I'm not able to precisely date them or date when the signs were actually created.</p>
    <p>In the first image, I'm looking for the type used to write "patisserie" and "confiserie." Underneath the sign, "Henri Auer" is written in a different typeface that I haven't been able to ID yet either.</p>
    <p>The second photo shows the storefront quite some years later. In this photo, "Henri Auer" has been inserted in the original sign, in a different typeface. </p>
    <p>Above the storefront, another sign mentioning "Patisserie" and "chocolaterie" has been added, with yet another typeface. </p>
    <p>I'd really appreciate any help you all could give me in identifying these typefaces or finding existing fonts that are a close match.</p>
