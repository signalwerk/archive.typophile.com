    <p>Over the past couple of years I've become really interested in fonts.  I'm a maths teacher by day and amateur designer and now amateur typographer by night (and by weekend and school holiday).  I have designed a font before, but I made every rookie mistake possible.</p>
    <p>So then I bought this very helpful book titled 'Lettering &amp; Type: Creating Letters and Designing Typefaces' by Bruce Willen and Nolen Strals which I am thoroughly enjoying and from which I am learning a lot.  I also learn a lot from typophile.com and from just observing the world around me - that's one thing I love about type, it's everywhere.</p>
    <p>My first font is called 'happy pebble'.  The look is based on this idea I got for the lower case 'a'.  In my mind it looked a bit like a sculpted pebble you might find on the beach.  I've only yet completed the lower case characters and the project still hasn't left Illustrator.</p>
    <p>I've followed an evolutionary process so that whoever is helping me out can see where I was going and a bit of what I was thinking.  Each letter's version that I liked the most and felt the most fitting is in a bluish purple with the unchosen ones in black:</p>
    <p>Here are also some words I created in Illustrator to get a feel of the letters working together (and to test out some variations of a specific character):</p>
    <p>I am very new at this but I find it very exciting.  I still have much to learn, so please let me know what you think (my friends and family thinks its great, but they are biased).</p>
