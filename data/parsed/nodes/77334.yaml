      <p>Try to be more rigid, and give no room for any deviation. Your O works well with Odam.</p>
      <p>Sorry; I can see your goal with those modular forms, and I like the overall design, but you just can not build every glyph with your modules. (Well, you can, but I'm not telling you how).</p>
