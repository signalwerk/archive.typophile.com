    <p>Hello folks,</p>
    <p>After browsing font.com and the entire linotype catalogue, it is time to call in the cavalary.<br>
    Please be so kind to look at the following file: <a href="http://regularworld.com/img/bg_foot.gif">http://regularworld.com/img/bg_foot.gif</a> belonging to the eye pleasing <a href="http://regularworld.com">http://regularworld.com</a>. The creator used some kind of ornament font or perhaps it is part of a normal font family. Be as it may, who can identify this rather victorian looking ornament?</p>
    <p>Thank you!</p>
