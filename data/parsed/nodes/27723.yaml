      <p>I don’t know if it’s still part of the Bickham family, I have an old version called MM that doesn’t seem to be available. It has a lot of bells and whistles - ornaments, special characters, etc. This ornament you have looks pretty standard, I’m just not sure which font family includes it.</p>
      <p>Nat Vignette seems to have a lot of swashy ornaments</p>
