      <p>Funny. The rules *say* fordscholars.com, but the text links to <a class="freelinking-external" href="http://www.fordscholars.org/">http://www.fordscholars.org/</a>.</p>
      <p>“This United States based logo competition is open to all legal residents of the fifty (50) United States (including District of Columbia). Competition is open to amateur and professional designers. Ford Motor Company Fund and Ford Motor Company Fund employees or retirees, or immediate family members of a Ford Motor Company Fund or Ford Motor Company Fund employee or retiree are not eligible to participate. Participation can only take place in a private personal capacity.”</p>
      <p>I always have mixed feelings about corporate logo/design contests. They’re usually just a way to get good work with no budget. On the flip side, some contests–this one included–open up a fairly high profile project to students and young designers.</p>
      <p>I agree with Sharon that FMC ought to be able to come up with more dough. However, this is probably a project within the company that wasn’t budgeted much by the higher ups.</p>
