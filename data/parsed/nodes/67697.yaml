    <p>This is something I created for a type class a few years ago. When I was making it I was about half way through and the professor told me to ditch it. I did, but I'm stubborn so I finished it off after the class. Its just been sitting on my computer since then. The other day I noticed it and I kind of like it, but I'm still unsure what to make of it to be honest. What do you guys think?</p>
    <p><a href="http://i6.photobucket.com/albums/y239/Jumpsuit/scalion-1.jpg" title="http://i6.photobucket.com/albums/y239/Jumpsuit/scalion-1.jpg">http://i6.photobucket.com/albums/y239/Jumpsuit/scalion-1.jpg</a></p>
