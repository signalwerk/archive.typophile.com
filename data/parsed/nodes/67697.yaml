    html: <p>Thanks for the feedback Andreas. You gave me flash backs. heh, this was done in illustrator and I was so tired of doing the line work the e was the last letter and I just said screw it, and flipped the a over to call it good. I agree about the bowls of the p, o, and g. If I was going to revisit (which I could depending on the feedback) I'd adjust those letters, amongst others.</p>
