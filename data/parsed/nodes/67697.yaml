      <p>Interesting texture which makes a 3D effect, but you should keep the same perspective. It's not a good idea to turn the a upside down to form an e. Shorten the upper end of the t. Otherwise, an interesting typeface, no reason to ditch it. Well - I'm not quite convinced of the small bowls of p, o, g etc.</p>
      <p>Andreas</p>
      <p>PS: same problem like a/e with p and d - and I forgot to mention the m.</p>
