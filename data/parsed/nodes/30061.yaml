    html: |-
      <p>I have to agree with David that satya.com is a good idea. URLs should be direct and simple. I sort of like satyapography.in, but I think that complex wordplays have no real place in URLs, they just end up being to confusing. Peoples' minds will revert to the real words, and then they will type in satyatypography.in instead, and then be angry when the URL doesn't work.</p>
      <p>Although, I actually sort of like satyatype.in and satya-type.in…</p>
      <p>teafortype.com is really cute, but it sounds a bit too parlor type…</p>
      <p>typeindia.in is actually really good, but would be a better URL for an India-wide typographic portal than a personal website.</p>
    html_clean: |-
