    html: |-
      <p>Thanks, everyone, for all the feedback and ID suggestions.</p>
      <p>Bit of a shame it was all so positive :-/ Criticism is often more helpful.</p>
      <p>Chalet New York 1970 is possibly the most similar ID suggestion and Asvetic's suggestions come close in a few places too. But, yeah, I think there's enough differences to make 'Radar' worth developing. If I can find the time.</p>
      <p>Nicholasgross - I'm glad you got a retro futurist vibe from it. That's exactly what I was aiming for with this logotype. It's for branding a chair design which has a 50/60's feel about. It's all curves and made from tinted translucent plastic in a range of groovy colours.</p>
      <p>Anyone feel like collaborating on this font? I can do the vectors and you can do the tedious font work. I guess I envisage 'Radar' as just an all caps display font; unless someone want's to try a lowercase.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/RadarFontTypophile_3543.gif"></div><p></p>
