    votes: null
    html: "<p>I have to second Nicholasgross on not having to worry about any possible similarities to existing fonts. Honoustly, a wheel can only be invented once, but it's what you do with the existing idea that can make all the difference. Your specimen shows a lot of potential &amp; I for one think it's definitely worth further development. I recently wrote a whole text about how innovation is far too overrated in my opinion (pretty much everything has been done at least once somewhere before) &amp; what makes a true artist is how he/she combines all existing elements to a personal &amp; interesting whole. Maybe I wrote the whole thing from a kind of selfdefensive position, but mainly because I hàte it when people only judge things by their originality (and I don't really like being called creative in that view because of a certain connotation the word has gotten by now). But I'm drifting off from what I really wanted to say... My conclusion &amp; advice: GO FOR IT! ;-)</p>"
    html_clean: "<p>I have to second Nicholasgross on not having to worry about any possible similarities to existing fonts. Honoustly, a wheel can only be invented once, but it's what you do with the existing idea that can make all the difference. Your specimen shows a lot of potential &amp; I for one think it's definitely worth further development. I recently wrote a whole text about how innovation is far too overrated in my opinion (pretty much everything has been done at least once somewhere before) &amp; what makes a true artist is how he/she combines all existing elements to a personal &amp; interesting whole. Maybe I wrote the whole thing from a kind of selfdefensive position, but mainly because I hàte it when people only judge things by their originality (and I don't really like being called creative in that view because of a certain connotation the word has gotten by now). But I'm drifting off from what I really wanted to say... My conclusion &amp; advice: GO FOR IT! ;-)</p>"
