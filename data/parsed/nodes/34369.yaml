    <p>I thought this would be an interesting variation on the usual type ID.</p>
    <p>I often pixel sketch initial design ideas but obviously I will do the finished version of this logotype as vectors. I was wondering if there is already a font with similar letterforms. I thought the R and A would be enough for an ID.</p>
    <p>It seems too obvious not to already exist, but if it does have any originality do you think it would be worth developing into a full typeface or have I just reinvented a wheel?</p>
    <p><img src="/sites/default/files/old-images/RadarLogotypeTypophile_4070.gif"></p>
