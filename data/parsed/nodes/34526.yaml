      <p>Thanks guys!</p>
      <p>Yes I found also it could have something to do with the more spontaneous way of making forms like in a punchcut (although I never done that). The thing is that the kind of forms you need in a classic redesign come out more easily I found. But I probably will not do this again, too. Its hard to do it with FontLab for here everything is so damned clear ;-)<br>
      Not like in the old days of pixeled FontStudio working. I am not sure wether this is overall such a great advantage. Anyone there who works with Anti-Alias switched on?</p>
      <p>By the way, Wow, there is someone who got to know Christian Paput?<br>
      When I was beginning typedesign I started (tried) with a wonderful Garamond (I draw only by hand producing later black letters putting them together later in darkroom work) They at the Imprimerie were so kind to send me a wonderful specimen of Garamont (with the t at the end) I heard of him wanted to see the Imprimerie but didn’t make it.</p>
      <p>I have great respect of the punchcuttes first of all I believe the work of Malin was extremely good, wasn’t it? I always had great admiration for the Griffo of Malin and Mardersteig.<br>
      One of the rare cases I find that the recutting was more beautiful than its original for I found the types in Aldus always a little stiffy (the right word? I doubt so)</p>
      <p>Thank your for your interest here!<br>
      Its great to hear that one is not alone with this kind of things in mind!</p>
      <p>Salute<br>
      Stefan</p>
      <p>Jenson detail</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Jenson_g_detail_3465.gif"></div><p></p>
