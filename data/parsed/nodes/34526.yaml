      <p>Yes, <a href="http://www.linotype.com/1476/simoncinigaramond-family.html" rel="nofollow">digital Simoncini Garamond as sold by Linotype</a> doesn’t have old style figures nor small caps. As far as I know, the rights to the typeface at the moment are held by Linotype (possibly through <a href="http://www.neufville.com/" rel="nofollow">Neufville</a>, which should have acquired the rights of the old foundry Ludwig &amp; Mayer which in turn consulted on many Simoncini typefaces). I don’t think an OpenType version is in the works, but one never knows.</p>
