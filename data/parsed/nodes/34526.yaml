      <p>Here is a page from the 1945 Einaudi edition of Montale's Le Occasioni, set, as noted by verbosus, in Simoncini Garamond.</p>
      <p>Note the alternative t's in the double t's The second is shorter in some words, giving a falling effect. In some it is the same height and in some (not shown) it is taller. In this way the typesetter has subtly enhanced and reinforced the mood of these sad love poems. The descenders of the font are completely unlike the Monotype digitalisation, which are far too short. Here is a supremely elegant typeface, set by someone sympathetic with the work. (I think there are also two c's but I can't be sure.)</p>
      <p>Montale's next book was set in Mardersteig's Dante.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Quasimodo004_5801.jpg"></div><p></p>
