      <p>verbosus — many thanks for that additional background information, this was exactly what I was after. In fact I bought the digital version from Linotype (in OpenType!) last night. So, with the acknowledgment that I've had very little time to work with it, it seems to be a remarkably faithful rendition of the metal type, much darker than Monotype's usual rather thin digitalisations. This one has real power and character. </p>
      <p>I am doing some translations of Quasimodo's poems and setting the above scan next to a translation set in digital Pastonchi makes me think that the latter is not embarrassed by the comparison. (Though I had to loosen up the digital version a little, both the letterpacing and the word spacing.)</p>
      <p>Do you happen to know what typeface was used by the publisher Giulio Einaudi, who published Eugenio Montale's first too books? (Montale's third was printed by Mardersteig himself, in Dante, I think.)</p>
      <p>Thanks again</p>
