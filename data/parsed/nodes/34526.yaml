    html: <p>Eluard, I don’t know the specifics of the first two Montale books (if you want to send me an image, my contacts are on <a href="http://cavedoni.com/" rel="nofollow">my home page</a>) but it’s possible that they have been set in Simoncini Garamond, as that typeface was custom-designed by Simoncini and Ludwig &amp; Mayer specifically for Einaudi. In fact, Mondadori (with Pastonchi) and Einaudi (with Simoncini Garamond) are the first examples of custom type designs in the modern history of publishing in Italy.</p>
