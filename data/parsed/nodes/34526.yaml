      <p>Very nice to hear from somebody involved in the Valdonega designs!<br>
      Those fonts are like secret jewels, and I've long admired the early<br>
      adoption of optical scaling in digital type. And I think as long as<br>
      Valdonega can maintain success as printers due (partly) to those<br>
      proprietary fonts, not releasing them retail makes perfect sense.</p>
      <p>I have a small specimen of the VAL fonts that I got from a conference some<br>
      years ago, but of course anything more you can divulge would be great!</p>
      <p>hhp</p>
