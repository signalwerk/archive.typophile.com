    <p>Hi Centaur Fans!<br>
    Is anyone still interested in Centaur faces? I am a new member of typophile. The reason for me to finally enter was the discussion of Centaur typeface. Yet, some time has passed ;-) (it is dated 2004)<br>
    Thank you Raph for the impressive good scans of the Bible. How did you get them? Great material!<br>
    I wanted to add that a beautiful Centaur (I believe) was done and hopefully still exists during the “Valdonega Aesthetic Line” project brought to live in the 90’s by the Stamperia Valdonega, Verona or better to say Martino Mardersteig son of the great printer Giovanni Mardersteig. We did (I was so happy to join this project those days) a version in several sizes (8, 12, 16) very very close to hotmetal Montotype version. I later on added some characters to achieve the first handprinted version (1913/14). I think the face is still available there if you want to print from it at the Stamperia because the type will not be available on the fontmarket and I think Mardersteig had his good reasons for so much work was needed.<br>
    I think he will allow me to show something for I done the digitalisation myself and I am quite proud of it, I have to admit. We used a very special design technique. I added also a text that explained a bit. I was very young yet at those times and I have to excuse for my very bad and somewhat striking English. But maybe it could be interesting to add something to current discussions if there are any now.<br>
    Last word to Jenson Adobe. I do believe Centaur in the original version ist more close to Jensons real style than the Adobe font which is to my eyes too round too soft and some letters aren’t very nice especiall ‘g’ and ‘a’. Although I do admire the abstract and nice modern serif treatment in enlargement.<br>
    Thanks so far<br>
    hope someone will talk to me<br>
    PS couldn’t attach the text for he doesn’t allow me pdf. Or is there a way?<br>
    Stefan</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Letters_4651.jpg"></div><p></p>
