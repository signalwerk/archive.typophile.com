      <p>Thanks, Stefan, that is fascinating. </p>
      <p>I see what you did is introduce a deliberate undulation in the line. The result is that the outlines don't look like you made a mistake and left a 'lump' in a bezier outline. Instead the outlines look more like they were chiseled out, as in the old days of punch cutting with a chisel.  </p>
      <p>Nice effect! </p>
      <p>I am working on a classic revival also. I probably won't do this as I want a more updated, modern look, but I will try on a few characters and see the effect. Thanks for sharing your ideas.</p>
