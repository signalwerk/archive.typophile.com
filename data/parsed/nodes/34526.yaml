    html: |-
      <p>Yes, burin is probably the correct term for the type of graver used in cutting type. Mine used to belong to Christian Paput at the Imprimerie nationale. The back of the blade has been ground in ways that I have not seen on typical engraver's burins, creating a sharper, narrower point. It is quite clever: there are two planes between the point and the back of the blade, which allow for a sharper point while maintaining strength.</p>
      <p>[Burin comes from the French word for cold chisel, which may confuse some people. An engraver's or punchcutter's burin is nothing like a cold chisel.]</p>
    html_clean: |-
