      <p>Eluard, Pastonchi is indeed a fine typeface.</p>
      <p>It was art directed by Francesco Pastonchi himself and designed by Eduardo Cotti of the Regia Scuola Tipografica in Torino. Pastonchi wanted to use it on the new series of books on the classics of Italian literature. Initially the Italian foundry Nebiolo was to cut the typeface but for economic reasons it became impossible. Coming full-circle from Stefan’s original post, it was through Giovanni Mardersteig that Mondadori and Pastonchi got in touch with Stanley Morison and had Monotype cut the type, both the final version and the many revisions and proofing versions that needed to be done to the original drawings. </p>
      <p>There is <a href="http://www.linotype.com/3305/francescopastonchi.html" rel="nofollow">a digital version of Pastonchi on sale by Linotype</a> but I don’t know if it’s any good.</p>
