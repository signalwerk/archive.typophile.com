      <p>I love what you have done with this font. Coincidentally I was looking a rather similar font that was used by Mondadori in Italy in the 1940s. Richard Beatty helped me identify the font as Monotype Pastonchi. Originally I had thought it was some variation of Centaur. It has a similar elegance and its richness on the printed page illustrates what you were speaking about — that deep black of letterpress which is so hard to reproduce digitally. The book here was a collection of poems by Salvatore Quasimodo.</p>
