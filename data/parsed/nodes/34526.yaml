    html: |-
      <p>Hi William, hi Hrant,</p>
      <p>secrets? ;-) Ok, maybe I exaggerated a little ;-)<br>
      Seriously, when we worked at the fonst for the VAL project the greatest problem seems to be the blackness of the characters printed by hotmetal press. (Please excuse my bad English when I try to explain - its the only one I have ;-) The guys at the Stamperia had tried a lot also before I entered the project. Seemed a problem without solution. Mardersteig never seemed quite content and neither we. Certainly we tried to blow up outlines but even when we arrived at typefaces that could be called bold we didn’t succeed in giving the feeling of blackness. I don’t know if I explain right. In part this defect obviously from the lacking of the pressure of the letters into the paper and the lack of colour in the offset-black which is a delusion after all. But when I made the experiment reproducing hotmetal pages and restamping them in offset they still look great in comparison. So I did experiment a lot with bezier curves because I believe in part it could be a problem of nature of form. This is quite daring I think because one could believe that basicly every form can be reporduced by bezier curves. But I still believe that they can’t. Its in first the line the problem of the places where two lets say more or less round forms link to each other. For example a letter stem when it becomes a serif. This zone is very difficult and if you wish to understand and reproduce forms spontanously its almost impossible to catch these zones in a good way. Or you do a thing to round too smooth or too much with an angle. And you cannot add points and points to define better. We all know that. So one day I found a special way to put curve points that form a stem slightly displaced with tangents remaining parallel and when this forms enter the serif I did it at 90 degrees. More or less like in the picture that I add.<br>
      Moreover the scan process seemed to wash out the letters like a stone from water. They lack determination somehow. Not easy to explain it. Maybe also that I am crazy. So this little trick seemed to force the computer while reinterpretating the characters when doing the films to fill the zones where one form goes into another with additional bit-points there where they have been swept away during the scanning. May sound funny but it worked!<br>
      The Centaur page was made with characters like that. Obviously it is impossible to sell them because they work only in the very size from which they were scanned. If you enlarge them the outline errors reveal. But if you use the 16 point as 16 point it is impossible to see it and the character appears slightly more rough more organic somehow.<br>
      Well, at those times we worked in FontStudio and I would not repeat this method in FontLab now but I still believe it was a quite interesting method. And I am still convinced that the greatest problem of nearly all modern faces is that the lack vitality because they are somehow too smooth too round at least to represent originals from the past.</p>
      <p>Stefan</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bild-1_4738.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/Bild-2_6705.gif"></div><p></p>
