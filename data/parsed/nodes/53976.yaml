      <p><em>Letter combinations don’t have frequency in language: they have frequency in spelling.</em></p>
      <p>Lingua references language to draw a contrast between the traditional criteria for ligatures (aesthetic, typographic) with its non-visual methodology; language, in this comparison, being implicitly non-visual. This core idea would not have been so well expressed if the face had been named Spella and character frequency explained in relation to spelling.</p>
      <p>... [in]<em> W h_e n, ... linguistically the h forms a consonant sound with the W and has no independent connection to the e as suggested by the ligature.</em></p>
      <p>Linguistically*, the "h" forms a frequent pairing with "e"--this is what is indicated by their ligaturing in Lingua, if any suggestion of linguistic significance is called for. </p>
      <p>*This is the normal usage, even though "Spellingistically" may be more accurate. For instance, <a href="http://www.math.uic.edu/~leon/mcs425-s08/handouts/char_freq2.pdf" rel="nofollow">this document</a> is not named "Frequency of Character Pairs in English Spelling Text".</p>
