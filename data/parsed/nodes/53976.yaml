    <p>Hi there typophiles I was hoping that you could help me.</p>
    <p>I'm currently working on a little project involving ligatures and I'm struggling to find some nice fonts (sans or serif) that have a good amount a ligatures in them. </p>
    <p>Ideally I'd like something with the standard ones in and maybe ct fy fä etc. Free or something that I might already have would be good but I dont mind buying a nice font that will work. (though being a student not too expencive)</p>
    <p>So I was hoping that people on here could help me out and suggest a few. </p>
    <p>thanks also I'm trying to make a full list of ligatures and so far I have: </p>
    <p>Th ch ck ct fä ffä fb ffb ff fh ffh fi ffi fj ffj fk ffk fl ffl ft fft ftt tt gi gj im in<br>
    ip ir it iw ix iy sh sk sp st ky fl gg gy oe sp ggy ft st ft ip py tw tt tw tty<br>
    www &amp; æ œ ae ee AV fs fs ae THE AE<br>
    AA MB OC MD ME FF OG HE FI UB NK FL LA NT OO MP TE TR UD TT UP VA TW UL TY UR</p>
    <p>if people would like to add to the list that would be brilliant. (please note font suggestions dont have to have all of these) </p>
    <p>Thanks</p>
