      <p><em>...according to those combinations most frequent in language.</em></p>
      <p>Letter combinations don't have frequency in language: they have frequency in spelling.</p>
      <p>Consider the Lingua n_g ligature: it indicates no more distinction between siNGing and raNGoon than the unligated letters do. Or consider the word 'When' in the sample at the top of this page:</p>
      <p><a href="http://www.processtypefoundry.com/typefaces/lingua/info.html" title="http://www.processtypefoundry.com/typefaces/lingua/info.html">http://www.processtypefoundry.com/typefaces/lingua/info.html</a></p>
      <p>It is displayed with the glyphs W h_e n, but linguistically the h forms a consonant sound with the W and has no independent connection to the e as suggested by the ligature.</p>
      <p>I apply frequency analysis for determining sets of Devanagari conjunct ligatures, but in that case there are contextual layout behaviours based on those ligatures which differ from the layout of the same letter sequence using half forms, so having a good idea which ligatures are important to include is critical. But I've never thought of this analysis as 'linguistic', despite having a Sanskritist on my team.</p>
