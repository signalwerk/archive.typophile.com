      <p><em>I’m trying to make a full list of ligatures</em></p>
      <p>I'm trying to make a full list of dance steps.</p>
      <p>A ligature is a technical solution (one of a number of possible solutions) to implement in type the phenomenon of ligation in writing systems. This is understood when one realises that everything that involves the joining or merging of letters in writing can be described without using the term ligature, as varying kinds of ligation, whereas in type one needs a word to describe the <em>thing</em> that implements ligation, whether it be a piece of metal or a glyph ID in a GSUB table.</p>
      <p>A full list of ligatures is, like a full list of dance steps, an empirical impossibility: one can conceive of it, but as soon as one considers that any new type style, and certainly any new writing style, may lend itself to new kinds of ligation, the impossibility of compiling an exhaustive list of ways to implement these as ligatures is evident. One may compile a list of common or garden ligatures, or even rare species encountered in the wild, but even this is not useful unless one is also documenting the styles of type or writing in which they occur and to whose ecosystems they belong (sorry to switch metaphors from dancing to botany). I have, for example, a fairly exhaustive summary of the ligations that occur in Byzantine cursive miniscule, and have seen similar lists of those that occur in Devanagari when used to write Sanskrit, but these lists are particular to both style and language. The summary of Byzantine cursive ligation is not a 'list of Greek ligatures'; it has no general application to the Greek script.</p>
