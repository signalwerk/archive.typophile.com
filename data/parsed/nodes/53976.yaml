      <p>Nick: <em>Linguistically*, the “h” forms a frequent pairing with “e”—this is what is indicated by their ligaturing in Lingua, if any suggestion of linguistic significance is called for.</em></p>
      <p>No, the h forms a frequent pairing with e in English spelling. But linguistically this is neither significant nor interesting, because it does so in larger combinations whose pronunciations are unrelated -- che ghe phe she the whe etc. -- and in all those combination the pairing with the preceding consonant is more significant, in terms of what it represents in language, than the pairing with the e.</p>
      <p>It's fine to use terms loosely much of the time, but when a word is used, as I believe it is in the case of the Lingua font, to suggest something that is not in fact the case -- that the font is the product of linguistic analysis --, then I think one needs to insist on a more precise usage in order to be able to critically engage with that suggestion.</p>
      <p><em>For instance, this document is not named “Frequency of Character Pairs in English Spelling Text”</em></p>
      <p>But 'English Language <em>Text</em> already implies that something other than language is being analysed, i.e. frequency of letter pairs in text, according to the spelling norms of written English. Note that this document is a handout in a mathematics class on cryptography, not in a linguistics class. Linguistics largely ignores conventional spelling.</p>
