    html: |-
      <p>I gather the second one is a re-drawing and not the original.</p>
      <p>Nicolai may be correct, that originally someone drew this up as a logo and it may not be from a font.</p>
      <p>If you are now in that same process there are a few that may help you capture the "feeling." Among them would be Saginaw (Treacyface) to capture the "V" -- </p>
      <p>Fontella - for the same "feel" (not the same, but similar) or even a Gilliess Gothic Sans</p>
      <p>What ever it was, it looked like it was influenced by Kaufman (Swing) Script.</p>
      <p>Hope that helps in some way...</p>
