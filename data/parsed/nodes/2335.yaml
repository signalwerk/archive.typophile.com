  html: '<p>Mark Simonson Studio has just released 35 new retail fonts: <br> <br>    • <a href="http://www.ms-studio.com/FontSales/blakely.html">Blakely Bold and Heavy</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/goldenbook.html">Goldenbook Light, Regular, and Heavy</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/metallophilesp8.html">Metallophile Sp 8 Light and Light Italic</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/refrigerator.html">Refrigerator Light and Heavy</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/changeling.html">Changeling Light, Regular, Bold, Stencil, and Inline</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/sanctuary.html">Sanctuary Regular and Bold</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/sharktooth.html">Sharktooth Bold and Heavy</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/felttiproman.html">Felt Tip Roman Bold and Heavy</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/felttipwoman.html">Felt Tip Woman Regular and Bold</a> <br> <br>    • <a href="http://www.ms-studio.com/FontSales/rastergotcond.html">Raster Gothic Condensed Regular and Bold</a> (12 fonts total) <br> <br>    • <a href="http://www.ms-studio.com/FontSales/rasterbank.html">Raster Bank</a> <br> <br>I have been working on these fonts for the last two years and am excited (and relieved!) to finally be able to make them available to the public. <br> <br>All of these fonts are available immediately from MyFonts.com: <br> <br>    <a href="http://www.myfonts.com/foundry/marksimonson/" target="_blank">http://www.myfonts.com/foundry/marksimonson/</a> <br> <br>Sample showings and more information can be found at my site: <br> <br>    <a href="http://www.ms-studio.com" target="_blank">http://www.ms-studio.com</a> <br> <br>Mark Simonson</p>'
