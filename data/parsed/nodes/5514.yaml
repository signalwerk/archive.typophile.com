nual? The one I know of off the top of my head is <i><a href=\"http://www.chicagomanualofstyle.org/cmosfaq.html\" class=\"link-external\">The Chicago Manual of Style</a></i>. Is this a safe bet? <br> <br>PS: The text face I'm using is <a href=\"http://www.kentlew.com/Type.html\" class=\"link-external\">Whitman</a>.</p>"
