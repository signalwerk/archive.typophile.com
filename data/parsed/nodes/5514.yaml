    html: "<p>As a professional lawyer (and typographic amateur) I come across this sort of problem a lot. I don't think there is a \"right\" answer, but I'll give you my gut instinct, for what it is worth. <br> <br>1. InvestPLUS: use whatever looks least bad. How about the P large caps and the \"lus\" small caps? This really is a one-off decision. <br> <br>2. + 4. If you are using OSF, use OSF consistently except in headlines with full caps. If S&amp;P is in small caps, then the OSF 500 will look fine anyway. Even if it isn't it will look OK. (The problem with X&amp;Y acronyms is when there is not a small-caps height version of the ampersand, but Whitman is such a well-conceived face I bet it has one.) No-one reading it will have any trouble with the OSF, I'm sure. They will read S&amp;P 500 as a unit because they are familiar with it and for them it is obviously a unit. <br> <br>I would not, incidentally, put bond or security ratings B or BB+ and the like in small caps. I  <br> <br>3. Lowercase s definitely. The rule is: how would you set it if you were using large caps. The answer, surely is CMOs. You do the same with small caps. There is no justification for capitalizing the s under any circumstances. (But the writer is at fault, surely if the acronym is plural to start with and then being pluralized again, i.e. if CMO = \"collaterlized mortgage obligationS\" to start with, it should never be CMOs.) <br> <br>Where text has a mass of acronyms I find it often is hard to use small caps for them (though I prefer them). As soon as an acronym starts a sentence one hits trouble. In those circumstances I find it generally less troublesome to use a font with a low cap-height anyway, rather than small caps. <br> <br>On style, I always liked Hart's Rules--the old little version not the bloated modern OUP style guide. But for US usage I think Chicago is probably the safest thing.</p>"
