  html: |-
    <p>any idea what could be the cause that hinting (fontlab autohinting + AFDKO) "hides" (blanks) the ffi ligature in one of my fonts? </p>
    <p>When I hint my font and then export it to opentype postscript-flavoured, the ffi-ligature glyph is just white. all other glyphs work fine.<br>
    When I don't hint at all, the ffi glyph is visible as well.</p>
    <p>I just tested in Indesign CS2 until now, but maybe someone knows what could be the cause for this?</p>
    <p>Thanks<br>
    Sebastian</p>
