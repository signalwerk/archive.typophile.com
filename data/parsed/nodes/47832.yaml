      <p>@ CTAKAH — Thanks, the type is custom drawn.</p>
      <p>@ jayyy — I noticed that too and was initially bothered by that. After continuing doing logo roughs I noticed that unless there is a very obvious graphic device that says “travel company” the name will always invoke that lawyer/accountant aesthetic. I suppose a lot of the descriptive elements about the nature of the company will be communicated through the implementation. By <em>slick</em> I mean minimal graphic styling with careful consideration of the chosen copy, stock and finished techniques with a strong emphasis on high quality (descriptive) photography. </p>
      <p>Perhaps I should include a tagline at this stage to help?</p>
