    html: |-
      <p>@ Wesley — Thanks for your comments I have taken you point on the kerning between certain characters, however, I have done several versions using combined letterforms to no avail. Joining the ‘W’ and ‘Y’ creates unusual emphasis on that character combination which is not something I want to point out. Due the the quite chunky serifs the space where the letters join looks crowded and I would have to counter that by tracking the rest of the letters closer together which I feel is going in the wrong direction. </p>
      <p>@schrockwell — I have looked at the shortened version before and felt that the company is relatively new and shortening the name will further mask the actual name of the company. It’s not something I’m ruling out though. Using this version the swash on the ampersand also creates unusual prominence to the ‘W’ while alienating the ‘E’. In general, as a rule, I’m trying not to kern everything close together. As substantial as the letters are, I want to keep a lightness to them also.</p>
      <p>As always appreciate the comments. Thanks</p>
