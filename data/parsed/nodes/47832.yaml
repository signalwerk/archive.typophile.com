      <p>Here’s a thought about using the swash on the ampersand. If you go that route, you might be able to create a complementary shortened version of the logo that just says “E&amp;W”. I just tried it myself, and the distinctive swash really holds the logo together when the E and W are kerned more tightly to the ampersand. </p>
      <p>That being said, I do also like the elongated R on the original version. It made me immediately think of the logo for <a class="freelinking-external" href="http://www.underconsideration.com/">UnderConsideration</a>.</p>
      <p>This is my first post here, but I hope these are some of the kinds of criticisms you were looking for.</p>
