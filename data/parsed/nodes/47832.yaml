    <p>Below is one of my concepts that I’m developing for a high-class travel and concierge company. I’ve worked through various concepts with different graphic elements but I feel a simple sophisticated approach just using type is best suited. The implementation to the web and print collateral will clearly communicate “slick travel company”.</p>
    <p>This lettering was worked up from a sketch so be gentle with the critique of the letterforms, spacing and kerning. </p>
    <p>I very open to constructive criticism.</p>
    <p>There is a small version below and a larger one attached.</p>
