    html: <p>this design decision is related to some of your other design decisions, e.g., what's the length of your line of type, or measure? if a column's narrow, left alignment with a ragged right will likely be better. what's the brochure about? justified text is sometimes thought of as more "conservative," as a generalization. hope this helps, good luck.</p>
