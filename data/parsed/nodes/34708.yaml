    <p><strong>TypeCon2007: Letter Space</strong><br>
    August 1-5, 2007<br>
    Crowne Plaza Hotel<br>
    Seattle, Washington USA</p>
    <p><em>presented by The Society of Typographic Aficionados (SOTA)<br>
    in partnership with Cornish College of the Arts, the School of Visual Concepts, and the University of Washington</em></p>
    <p>Now’s the time to register for TypeCon2007! This exciting and affordable conference will be held August 1-5 at the Crowne Plaza Hotel in downtown Seattle. TypeCon2007 is a jam-packed week presentations, exhibitions, hands-on workshops, and special events.</p>
    <p>TypeCon2007 features more than 75 speakers, including Marian Bantjes, David Berlow, Roger Black, Robert Bringhurst, Veronika Burian, Leslie Cabarga, Matthew Carter, Art Chantry, Tim Girvin, Bruce Hale, Akira Kobayashi, Kevin Larson, Robynne Raye and Michael Strassburger, and Ilene Strizver. TypeCon2007 explores type for the screen, custom newspaper fonts, Mexican lettering, Arabic  calligraphy, Czech type, design for the Northwest music scene, font format wars, dirty type, and more.</p>
    <p>Special events include a type and design education forum, the Typophile Film Festival, an international exhibition of type, design, and letterpress, and the Seattle premiere of Gary Hustwit’s indie documentary, “Helvetica.” TypeCon2007 attendees are guaranteed seats at the Helvetica screening, which has sold out in almost every city so far.</p>
    <p>SOTA is committed to bringing you a high-quality and affordable conference. Conference registration and workshop fees are the lowest you’ll find at an event of this quality in North America. Early-bird discounts are offered to all attendees registering by June 29. Join SOTA while you register for the conference, and receive an extra discount!</p>
    <p>TypeCon2007 will offer a variety of great presentations and panel discussions, focused hands-on workshops, tours, special events, an international exhibition of new type and design, and more.</p>
    <p>Conference fees are as follows:</p>
    <p><strong>Early registration (through June 29)</strong><br>
    SOTA members: $215 professionals/$120 students<br>
    Non-members: $250 professionals/$140 students</p>
    <p><strong>Regular registration (June 30-July 20)</strong><br>
    SOTA members: $245 professionals/$140 students<br>
    Non-members: $285 pro/$160 students</p>
    <p><strong>Late/walk-up registration (after July 20)</strong><br>
    SOTA members: $300 professionals/$160 students<br>
    Non-members: $350 pro/$175 students</p>
    <p>Optional pre-conference workshops are $50 for each half-day session and $100 for each full-day session, plus materials/lab fees, if any. The Type and Design Education Forum is $50, which includes all general sessions and your choice of breakout.</p>
    <p>Secure registration is now available on the TypeCon2007 website. Seating is limited - register today to book your spot!</p>
    <p>Direct link to TypeCon2007 registration - <a href="http://www.sotalink.com/registration" title="http://www.sotalink.com/registration">http://www.sotalink.com/registration</a></p>
    <p>TypeCon2007 website - <a href="http://www.typecon.com" title="http://www.typecon.com">http://www.typecon.com</a></p>
