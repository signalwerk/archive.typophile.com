    html: "<p>In response to Tiff: <br> <br>This typeface was created based on a modular form with minimal elements juxtaposed with varied calligraphic components.  I wanted to create an aesthetic that reflected a sordid, but confidently structured attitude.  The second line uses the \"snap-on\" dots I'm working on; depending on the form of the word it may be desirable to have dots on a character.  Also, I may employ snap-on ascenders/descenders that face the opposite direction.  Any suggestions?   <br> <br>P.S.  I'll try to check out Industria.  <br>          Thanks.  </p>"
    html_clean: "<p>In response to Tiff: <br> <br>This typeface was created based on a modular form with minimal elements juxtaposed with varied calligraphic components.  I wanted to create an aesthetic that reflected a sordid, but confidently structured attitude.  The second line uses the \"snap-on\" dots I'm working on; depending on the form of the word it may be desirable to have dots on a character.  Also, I may employ snap-on ascenders/descenders that face the opposite direction.  Any suggestions?   <br> <br>P.S.  I'll try to check out Industria.  <br>          Thanks.  </p>"
