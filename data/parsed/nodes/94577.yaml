      <p>I know that you've considered this, but your family name combined with the word "Forestry" could leave an instant, possibly subliminal,  impression of stunted tree growth; surely not what you'd desire. To compensate, while at the same time adding a hint of verbal play to the logo, I would consider using a tall, narrow typestyle; one that itself gives the impression of stature and tall trees. Possibly warping the words to match the leaf logo, as long as it remains legible.</p>
      <p>Your  'rt' spacing problem is eased by having the logo in all caps</p>
      <p>   - Herb</p>
