      <p>&gt; [Short] could leave an ... impression of stunted tree growth</p>
      <p>It could be a problem if this was a retail business (a tree service company, for example), but he's a consultant and I'll bet that most of his clients come from personal contacts, referrals, etc.  Everyone will know his family name is Short. The double meaning might make someone chuckle, but I doubt if it'll affect his business one bit.</p>
      <p>In fact one possible approach would be to play up the double meaning for a humorous effect.</p>
      <p>(On the other hand, if he thinks the name might actually be a problem, adding the first name would help. So if his first name is John, make it John Short Forestry.)</p>
