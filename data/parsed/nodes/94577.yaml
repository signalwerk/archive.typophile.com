    <p>I am in a predicament. My dad has a forestry consulting business he started after retiring from the US Forest Service a few years ago. I designed the logo but I've never been happy with the text. I've done a couple of versions using a couple of different typefaces but neither of them have been right.</p>
    <p>The hardest part is the kerning. The business name is Short Forestry. I can't kern too tight or the rt pair in Short and the try in Forestry looks terrible. But I can't kern too loose or it looks like everything is falling apart. So I thought I would come to you, the wonderful people of Typophile.</p>
    <p>I'm looking for a nice sans serif. Something humanist, although I like gothics and grotesques a lot too. I'd like something a little more compact (and less ugly) than Gill Sans. Most of all it needs to of course fit with the logo. I've posted that below for reference. Also, I don't have a big budget to work with.</p>
    <p>So, any ideas?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo-2-color-v3_4941.png"></div><p></p>
