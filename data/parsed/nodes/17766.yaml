    html: |-
      <p>What I do is generate a file using &gt;Glyph&gt;Glyph Names&gt; "Save encoding" .  I then select all glyphs ( in FontLab ) and copy- paste to a text file. I search-replace slash with carriage return.  This gives me a list of every glyph drawn. I copy-paste this list to Excel and reorder glyphs as I please which is quite easy in Excel.<br>
      Next, I create a list of numbers in order from 1 to however many you need in the next column.  This is very easy using Excel ordinal list formula [cell above] plus 1 and fill-down to end of list in one full swoop. Just be sure your first few glyphs are the same as a normal encoding:<br>
      %%FONTLAB ENCODING: [fontlab's given number for your saved encoding]; FontName #[fontlab's given number for your saved encoding]<br>
      .notdef 0<br>
      space 1<br>
      .null 2<br>
      CR 3<br>
      ---<br>
      after that, order as you wish but be sensible.</p>
      <p>Then, open the encoding you saved (a .enc file) in a text editor to find the generated number, etc.</p>
      <p>Save your Excel file as "tab delimited text" and replace tabs with spaces and CR with Linefeeds.<br>
      Then, replace the list of glyphs in the encoding with the list you just generated from Excel and save as ascii but use .enc as file ending.<br>
      Then replace the original file in the exact same location you found it in "Libraries".<br>
      Close Fontlab and restart or reboot.  Then go back to your original Fontlab vfb file and change the default encoding the the new encoding you just created.  Then sort by encoding.</p>
      <p>If you want to have certain special characters you have designed that have no unicode name show up in future fonts, first give them a PUA number so that they always have the same position.</p>
      <p>I know this sounds like a great deal of work but you only need do it once.  It can be used for every font you design with that same number of glyphs and names.</p>
