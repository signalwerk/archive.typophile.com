    html: |-
      <p>Because the code that saves .enc files is older than the code that handles .enc files without numbering. I requested the latter from Yuri, many years ago, because I was making lots of custom .enc files and didn't like the hassle of numbering what was, after all, a sequential list. It makes inserting individual glyphs much easier if you don't have to number the lines.</p>
      <p>This is how one of my typical custom .enc files looks:<br>
      <code>%%FONTLAB ENCODING: 98943639; Brill Italic Post<br>
      %<br>
      % Version 3.6, 24 October 2012<br>
      %<br>
      .notdef<br>
      NULL<br>
      CR<br>
      space<br>
      uni00A0<br>
      A<br>
      B<br>
      C<br>
      D<br>
      E<br>
      ...[etc.]<br>
      </code></p>
