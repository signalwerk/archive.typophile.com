    html: |-
      <p>Jason,</p>
      <p>In which view do you want to have them sorted? 'Names mode' or 'Index mode'?</p>
      <p>If 'Names mode' then you'll have to create your own Encoding file, which consists in a text file listing your glyphs in the order you want. You'll have to save this file in the 'Encoding' folder. (The first line of this file also needs to be build in a specific way, in order for Fontlab to recognise it. Check the Manual.)</p>
      <p>If 'Index mode' then the only thing you have to do is to select the glyphs and move them around.</p>
      <p>However, if you have done the 'Names mode' step, you don't need the second one, since you can do 'Sort glyphs by...' --&gt; 'Encoding' (while in 'Names mode')</p>
