      <p>If it wants to replace glyphs, you're not working in index mode. Switch modes using the menu in the lower left corner. Make sure it's the MODE menu from which you select 'index' rather than the LABEL menu (which is immediately to the left of the mode menu, at least it is on MacOS).</p>
      <p>André</p>
