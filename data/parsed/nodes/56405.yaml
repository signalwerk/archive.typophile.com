    html: |-
      <p>I think it looks pretty good.</p>
      <p>It seems to me that the 's' and the 'g' are breaking the upward/horizontal flow a bit. They have their most apparant parts angled in the opposite direction from the other characters (the bottom part of the 's' and the loop of the 'g' respectively).</p>
      <p>And I think the 'r' is too wide. The 't' also jumps out, since it's leaning to the right while most of the other characters have a leftward lean. The 'z' also stands out.</p>
      <p>I'm not saying you should totally iron everything out, but they're points to consider nonetheless. :)</p>
