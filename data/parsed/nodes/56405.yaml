    html: |-
      <p>I like it a lot. It makes me feel like cracking open a brewski.</p>
      <p>I also think that the 'r' is a bit too wide as the large counter formed under it's ear contrasts greatly with the small counters in the rest of the text.</p>
      <p>It would be nice to see some more alternate characters to add variety. Adding alternates could emphasize the playful and hand-painted look of the font IMO.</p>
      <p>Nice work Sebastian.</p>
