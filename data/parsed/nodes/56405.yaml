    <p>Dear Typophiles,</p>
    <p>attached (if upload works) you should find Malz, a fat, malty display font sketch.<br>
    It was drawn with pencil the last months, before redrawing it as vectors (with a few revisions already).</p>
    <p>What I want to know? Some feedback, some ideas ... There are for sure lots of detail flaws in it, so i'd be more interested in feedback for the "big picture" or single characters, but not "curve details" yet.</p>
    <p>---------------------<br>
    quite an update (see new file Malz14.pdf)<br>
    - 2 styles (old-fashioned and more modern)<br>
    - many minor tweaks<br>
    ---------------------</p>
    <p>some quick stuff:<br>
    Sebastian</p><div class="imageWrap"><img src="http://typophile.com/files/styling_6550.gif"></div><p></p>
    <p>thanks for your thoughts and time</p>
