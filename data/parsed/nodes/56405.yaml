      <p>some update (see first posting).</p>
      <p>I have created a second "style" by making alternatives to some letters. Not quite sure how far this should go.</p>
      <p>V W X Y v w x y in the "normal" style have changed quite a lot, making them more consistent to the rest.</p>
      <p>r is quite narrower.</p>
      <p>There are still some details to change (counter of the "e", ..., ...).<br>
      What else do you see?</p>
      <p>And I really don't know what to do with the uppercase "S" ...</p>
      <p>Thanks for your thoughts<br>
      Sebastian</p>
