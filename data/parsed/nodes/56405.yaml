      <p>overall: i love it.</p>
      <p>what you might consider:<br>
      V and W (uc and lc) look a bit out of balance. (maybe they had too many seidels?)<br>
      i like the round E on page 3 better than the straight one.<br>
      some of the accents could be more distinct. grave and acute should be steeper. they look too much like macrons.</p>
      <p>looking at Malz makes me thirsty. i need a beer right now.</p>
