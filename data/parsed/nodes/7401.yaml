    html: <p>Judging from the response Jamie, you have many excellent suggestions so I don't wish to repeat anything already mentioned but would like to say that "typography" even in context of the grid system will never reach its full potential if tackled as a "technique", still less a "formula". So if you are bitten by the grid bug as I was many years ago when I bought many books (Mueller Brockman, Armin Hoffman etc) and discovered for myself the truth of the statement "Less is More" and also the fact that "Simple Design" is far more difficult than cluttered and overdone design (I'm NOT describing Emigre, Neville Brody, David Carson kind of stuff which I love).  <br> <br>So instead of looking for "how to design a grid within Quark or InDesign" (that is not difficult) I would suggest - try to understand the principles better, see more examples of how different designers have stretched the grid system (Wolfgang Weingart, April Greiman) or amazingly made it look as if it is no limitation at all to design the most inspiring (opposed to mechanical and cold as SWISS typography is often accused of being)work in the Grid System as shown by Helmut Schmid who studied  under Emile Ruder and now lives in Japan ... his work shows "that you don't have to abandon the grid to design something that can be poetic, warm, inspiring as well as "unpredictable".  <br> <br>Sorry if you find this response too lengthy. I'm posting here for the first time. <br> <br>Sujit Patwardhan <br>Pune, India</p>
