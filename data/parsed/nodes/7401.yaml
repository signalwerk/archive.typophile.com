    html: <p>Jamie, the best thing you can do is not take it all too literally. The grid, in design, is simply the structure or the bones, of any given project.  <br> <br>By laying down any set of guides on a master page in either quark or indy these guides transfer themselves to all of the other pages. You can set up multiple master pages to be used in different ways and different things. For instance, you can set up a left-hand page set of guides and a right-hand set of guides that set forth the "rules" or "guides" by which you lay certain text blocks down. If you look at some of the better designed magazines out there (IMHO) you can see that the feature articles have different grids followed compared to the lead-in articles. Living (formerly Martha Stewart Living) has such rules ... rhymnes and reasons for everything right down to how many points apart the pictures are placed.  <br> <br>On the master pages you can also set up page numbers, footers and headers, rules, etc. <br> <br>Does any of this start to answer your questions?</p>
