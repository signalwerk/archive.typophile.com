    html: <p>Just study classic examples of great design. What's aligning, and where. See Proportions. See Spaces. Learn from the masters - you so need to build on a skeleton/basis and understanding of good classic design in order to develop your own style. Observe good design and layout wherever you see it. Stop and take note of why it is special. So much of good/great design is based on acute observation and study and awareness. That's what it boils down to, in the end, IMHO. There's no magic formula. I think many people recongnise well-considered and inspired design when they see it, even if only subconsciously. It just looks *amazing*.  <br> <br>I'm only learning now after some 20 years in design (as a 3rd generation artist and designer in my family) that "to study design - study type." I would only add "classic type". Nothing is as sublime as the lessons of space and line and proportion that observing beautiful type can teach you. You will continue to learn from it all your life. It never stops - how wonderful. <br> <br>all the best,  <br> <br>Kaisa</p>
