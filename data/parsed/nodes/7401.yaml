    html: <p>It should be noted, of course, (though this will come as news to few or no regulars here) that it is 12 <strong>Didot</strong> points that one Cicero equals, the Didot point being larger than the point used in the English-language world by roughly the ratio of 15 to 14, or, more closely, the ratio of 77 to 72.</p>
