    <p>Introduction first is the polite thing I think: I'm Darien.  I've been reading stuff on Typophile for a long time, but this is my first post.  I made my first fonts when I was 11 (1994?) and I've sporadically made more every few years since then.  Most were abjectly terrible; I can't say I ever even attempted to create something of professional quality.  The only one anyone ever cared for was Fixedsys Excelsior, which was not so much a font as an obsessive compulsive disorder (<a class="freelinking external" href="http://www.fixedsysexcelsior.com/information/scripts.gif" rel="nofollow">as seen here</a>).</p>
    <p>In April of this year I began work on what I'd call my first serious font.  I mean, I'd like it to be, anyway.  I've spent a ton of time on it so far and haven't even completed the lowercase.  I just tweak and tweak and tweak.  I'm pretty nervous about adding more until I'm more comfortable with what I have so far.  There are plenty of letters I still don't feel are nearly correct (/s/ kills me).</p>
    <p>I'm including some images; I'd really love to hear some feedback. ESPECIALLY if you can point out things that will come back and bite me if I don't address them now.  The spacing is pretty rudimentary, and I've just kerned as I've gone along; I expect to wipe all the kerning and metrics at a later point and do it more systematically.  You'll see in the bottom row of the first image that I added a single-storey /g/ (in the IPA range at present) -- I couldn't decide for a while but I think the double-storey is more suitable.  I guess I consider the /b/ a key letter, one that I use to figure out if other things are balanced.</p>
    <p>Note that the few capitals that appear in the examples are more or less stand-ins.  I don't know if the real ones will actually look like that at all; I just use them to test.</p>
    <p>While I'm rather proud of what I've done so far I remain worried that this is might be too ambitious for my skills.  I think it's pretty original (uh oh ... please don't link me to a similar-but-better font!) and it would mean a great deal to me if I could make it a 'real' font.  Any advice would be appreciated.  Thanks.</p>
    <p>Edit: I seem to be having some kind of problem uploading images to the forum.  I'll upload them elsewhere and add links here shortly.</p>
