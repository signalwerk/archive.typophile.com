      <p>Thanks Eliason!  I think I tend to waver about how idiosyncratic I want this typeface to be, and I'm sure that's evident in the forms I’ve chosen.  The ‘a’ was the first letter I drew (though it’s been adjusted a lot since then) and was the inspiration for the font, at least initially; maybe my idea of it has departed from that.  I suppose I've opted to subdue the weirder parts in the hopes that the quirkiness (as you put it) wouldn’t be too cartoonish.  Although it may not be apparent, some inspiration for this has come from various uncial scripts, and maybe the /n/ /m/ and /h/ would benefit from having the inward-curving legs of that style.</p>
      <p>You’re definitely right about the spacing.  It’s not a stylistic choice -- I would like it to be much looser, to complement the width of the characters.  I tend to adjust spacing only when I’m testing stuff in fontlab (at large sizes) so I should probably go ahead and fix that now so that I can more properly see what smaller text will look like.</p>
      <p>(It’s a Monkey Gland.)</p>
