      <p><cite>I expect to wipe all the kerning and metrics at a later point and do it more systematically</cite></p>
      <p>As a font gets smaller, poor spacing becomes more apparent and poor drawing becomes less apparent. So if you intend your font to be usable at small sizes, you should allocate your effort accordingly.</p>
