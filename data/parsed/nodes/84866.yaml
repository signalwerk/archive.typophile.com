      <p>I agree with what eliason wrote: the /a/ seems to stand out a bit from the rest. But it does have something special that could be used to change some of the other letters. </p>
      <p>Since you mentioned it, I checked out your /s/ as well. What might be the case - and im not sure as im definitely no pro - is that it's too closed up. If you open it up a bit more and use the same leaning angle of the stem that is so interesting in the /a/, it might become more fitting. What I mean is that the /s/ is still quite upright, but the /a/ is seems to lean over to the left. The /s/ could do that too - actually a lot of letters could use that in some form or other (say the final legs of /m/ and /n/ and /h/ etc).</p>
      <p>Also, but this might be because im looking at the /a/ at such a large size, I get the feeling it's stem is a bit wonky. Looks like the bottom part of the places where the bowl connects to the stem should be moved slightly towards the left. This might be an optical thing though...?</p>
      <p>Here's what I mean:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/a_5840.jpg"></div><p></p>
      <p>Hope this helps!</p>
