      <p>There's something unusual about this one — yes I do find it original — and I think you have the skill to see the difficult spots already, so keep at it, it's going to be good. It looks nicely balanced at smaller sizes, which is a good sign.</p>
      <p>I'd agree about the spacing, but I'd be cautious about changing everything to fit with the /a/ — I'm certain a sloped /a/ can harmonise with upright /n/s and the rest. I'm considering something similar myself. I like the diagram above, with the straighteneed stem however.</p>
