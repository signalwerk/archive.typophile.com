      <p>Compare the /a/ and, say, the /n/. With its listing stem and lumpy curves, the /a/ looks much quirkier, more handwritten, more imperfect. The amount of "quirkiness" needs to be settled on, and made consistent across the alphabet.</p>
      <p>Your letterspacing is way too tight overall. In part this could be a style choice, but it leads to problems, like in "ebullience" or "blips" where the words seem to collapse where the /l/s and /i/s are. </p>
      <p>(Is that a Scofflaw you're drinking?)</p>
