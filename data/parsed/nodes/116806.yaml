    <p>Hi Folks, </p>
    <p>Someone sent me this image wondering if it might be a font. My opinion is that it was probably a graphic made by mixing and overlaying letters from various fonts and adding the 'antennas' afterwards. </p>
    <p>Does anyone recognize this as a font?</p>
    <p>Thanks,<br>
    - Mike Yanega</p>
