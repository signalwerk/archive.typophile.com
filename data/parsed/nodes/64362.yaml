      <p>Adana is very limited, but for a Newbee a great choice to get an idea what letterpress is.</p>
      <p>Please do not buy the stuff on Ebay, you our link is showing. Its not expensive, but its only junk, what someone found anywhere.</p>
      <p>Write an email to geoff.kennett(at)ntlworld.com. He's a very close letterpress friend of mine. Tell him, I send you and he will give you some advices. May be he can offer you some stuff. Better one than the Ebay stuff, for a fair price.</p>
      <p>This is real letterpress :-)<br>
      <a href="http://www.Bleisetzer.de" title="www.Bleisetzer.de">www.Bleisetzer.de</a></p>
      <p>Have fun with your Adana...</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
