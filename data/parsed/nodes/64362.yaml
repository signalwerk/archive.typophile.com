    html: <p>For a beginner I think this is ok. Not a great cost for the stuff, and the Adana Press is, I think, still available. I think this depends on what you want to do. When I was printing I used a Vandercook SP15 Press and printed books and brochures, and used monotype. I was self-taught which meant that I made a lot of mistakes. But I learned a lot. This is a picture of the press I used.</p><div class="imageWrap"><img src="http://typophile.com/files/SP15_5985.jpg"></div><p></p>
