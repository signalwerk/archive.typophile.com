      <p>This is a very good setup, all you need is a press with some rollers, and you could start setting type and banging impressions in no time at all. A composing stick would be nice though.</p>
      <p>When I gotten my 5x8 Kelsey, four years ago, it came with a similar assortment of fonts, leads and spaces, except everything was simply pied (dumped) into an old cardboard box filled with dead roaches and mice droppings. Still, a little cleanup, a few weeks of organizing sorts (letters), and I had my first run.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
