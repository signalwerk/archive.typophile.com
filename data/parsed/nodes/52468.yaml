    <p>I am creating a new website and I can't seem to find a navigation style I like. The client wants the navigation to have more pop but i keep coming up with templated, web 2.0 looking navs. The other problem is that i will need to have a drop down menu for many of the main links and can't decide how i want to format this either.</p>
    <p>I have attached a couple of try's. Any ideas would be great.</p>
    <p>Thanks,<br>
    -Jesse</p>
