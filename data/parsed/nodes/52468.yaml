      <p>Looks a lot better, but now you're mixing serif and sans in your navigation. Your aversion to rollovers is funny, because the client said he/she wanted the navigation to pop, which is something rollovers help accomplish. Also, rollovers can be very subtle, you don't have to change the color of the entire block. </p>
      <p>I'm also not in love with the way the blue in the forms box is coming up against the green background, you may take the opacity back on that blue or something. </p>
      <p>-Andrew</p>
