      <p>[something happened to my first comment and it got deleted, this is it for the record]</p>
      <p>...</p>
      <p>Could you settle on a sans serif, especially since you seem to be using both faces in the same style (caps)?</p>
      <p>I like the implicit boxes with shadows on 1, more than your stroked. If you go with the implicit ones, you'll want to use that style throughout. </p>
      <p>Pattern isn't really working in 3, I'm okay with it in 2. As far as navigation, what do you have in mind for rollovers? The gray nav in 1 and 3 surely lack pop, could you use some green, that gets darker on rollover, or an underline or something?</p>
      <p>Smaller stuff that catches my eye.. Don't need "Address", Black pull quote seems out of place, but I don't know what you could do with it. Lastly the logo has a lot of head room, almost awkwardly so. </p>
      <p>-Andrew</p>
