    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/NationalHappens_5934.png"></div><p></p>
      <p>Chester and Kris made me happy today too. </p>
      <p>I completed National by way of the excellent Taste Test program (that is until we get the condensed styles which would be soo welcomed) <em>and</em> I got a head start into Copernicus.</p>
      <p>Both types are versatile, however Copernicus is increasingly so. It’s stylish, neutral, literary, corporate, historic and contemporary—all rolled into one by way of the fantastic stylistic sets.</p>
      <p>You can be neutral and corporate as seen here:<br>
      <a href="http://vllg.com/Village/GalaxieCopernicus/Example+About/" title="http://vllg.com/Village/GalaxieCopernicus/Example+About/">http://vllg.com/Village/GalaxieCopernicus/Example+About/</a></p>
      <p>Or you can go for “baroque” with handsome literary swashed italicized letters: J,v,w,z. And I use the word “handsome” correctly as even though there are elaborate forms at your disposal, industrial strength features have been applied globally; sheared terminals (like Charter), generous ink traps, and in the bolds—chunky slabs (like Meta Serif).</p>
      <p>Also, I’m a huge fan of brushy foxtailed type. Gary Munch’s Really and Mark Jamra’s Latienne are my favorite examples. Really is elegant and designed for books. Latienne, the same but without restraint.</p>
      <p>Copernicus is neutral and fabulous, and in between if you like. This is the better Platin. </p>
      <p><a href="http://vllg.com/PDFs/vllg_GalaxieCopernicus.pdf" title="http://vllg.com/PDFs/vllg_GalaxieCopernicus.pdf">http://vllg.com/PDFs/vllg_GalaxieCopernicus.pdf</a></p>
      <p>Mikey :-)</p>
