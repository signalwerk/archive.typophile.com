    <p>Hey all,</p>
    <p>Looking for a realistic handwritten script similar to Mr Porter's fantastic typeface.<br>
    (as you can see all over <a href="http://www.mrporter.com/" title="http://www.mrporter.com/">http://www.mrporter.com/</a>)</p>
    <p>An intelligent typeface that changes characters within the same letter is a big +.<br>
    Hurt your brains and I will be thankful forever!</p>
