      <p>You've really raised the bar Nick, both technically and aesthetically (by doing your own contemporary hand, what a concept!)</p>
      <p>But we really need to educate the consumer more.<br>
      Just this morning I saw a large ad in my national newspaper for Starbucks set in a stupid script font.<br>
      Rather obvious, the word "coffee".<br>
      This for a blue-chip international megacorp handled by an expensive agency, but with crap typography nonetheless.</p>
