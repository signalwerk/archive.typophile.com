      <p>"I wonder if anyone has made anything from scratch in Pages that rivals the Apple supplied samples? My feeling when I first saw them was the expensive high-res photography was what gave the samples their impact and that the type was a bit ho-hum."</p>
      <p>Si, this is true of any developer. You only get out what you put in. Perhaps Apple should include the boilerplate, "Your Results May Vary."<br>
      A good designer can make something good looking with any program and a bad designer can screw up any program's abilities.<br>
      It is not that you can't do something decent in Word. It is that the agony involved is not worth it. I can dance while hanging from my thumbs but why would I choose to? Pages is cheap and more sensible for page layout. Word is a bloated word processor that should stay a word-processor.<br>
      I had a client a few years ago who asked me for a bid on a brochure. After I gave him the price, he said, "Can I get it as a Word file?" I told him that would triple the price.<br>
      I have been using Word since it came out on the Mac in 1986. Back then WordPerfect was THE PC word-processor. It was a great and small app then. It was darn good through version 5.5. Then it got Cancer and all its cells mutated and grew huge tumors.  MS tried chemo which made a funny little paperclip guy jump up and get in the way and made you want to play whack-a-mole.</p>
      <p>It is not that you can't do visually complex stuff with it Si, it just should come with the Surgeon Generals warning.</p>
      <p>ChrisL</p>
