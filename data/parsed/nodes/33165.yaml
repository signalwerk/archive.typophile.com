    <p>Hi Everyone!<br>
    You all have helped me in the past, so I'm turning here again.<br>
    I am a pastor who needs to get information to my congregation all the time in the form of fliers, &amp; brochures, (Church clean-up, spaghetti dinner, etc.) It would be great if we could hire graphic designers to do the work, and someday we may be able to do that. For now, I need to find a way to do the fliers myself. I have a good sense of what looks good and I know what I DON'T want (by this I mean that I don't want to reproduce cheesy looking MS word brochures with tacky clip art and horribly counterintuitive formats.)Still, I'm not a professional, and so what I'm doing is pretty basic and hobbling. So the question... </p>
    <p>What program do you think might help me to do my non-fancy publicity for my church members in a way that still looks decent? Suggestions? I am particularly interested in programs that might have some basic templates included or for purchase. </p>
    <p>Thanks so much in advance.</p>
