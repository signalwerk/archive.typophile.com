  html: |-
    <p>Founded in 1896, Parsons has a rich history as a leader in art and design education.</p>
    <p>Parsons focuses on creating engaged citizens and outstanding artists, designers, scholars and business leaders through a design-based professional and liberal education.</p>
    <p>Parsons students learn to rise to the challenges of living, working and creative decision making in a world where human experience is increasingly designed. The school embraces curricular innovation, pioneering uses of technology, collaborative methods and global perspectives on the future of design.</p>
    <p>Parsons campus is in New York City.</p>
    <p><a href="http://www.parsons.edu/" title="http://www.parsons.edu/">http://www.parsons.edu/</a></p>
