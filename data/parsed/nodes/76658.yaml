    <p>Starting in November and for a very limited time, all customers who buy the Sirba Bundle in our store will receive, completely free of charge, a copy of this special Sirba type specimen. This collectors piece was designed and produced by Nicolien Van der Keur, original designer of Sirba. The 24-page specimen has been partially printed in letterpress on a wide range of selected papers and has an embossed cover. There are only 525 copies of this collector's item.</p>
