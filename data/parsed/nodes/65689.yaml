    html: <p>In modern Icelandic, eth does not commonly occur at the beginning of a word, which is why I needed to do research about possible consonant+eth combinations. Otherwise, as Nina suggested, because many words begin or end with thorn and many words end with eth, these kinds of combinations are quite common.</p>
