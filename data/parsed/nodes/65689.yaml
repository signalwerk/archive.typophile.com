    html: |-
      <p>I had a bit more time to check on the constraints on the consonants that can precede eth. In modern Icelandic, by far the consonant that most frequently precedes eth is “r”, as “rð” is a very common combination. You also find “f” and “g” in front of eth in some words, but other consonants seem to be rare.</p>
      <p>In Old Norse, you find many more different consonants preceding eth. I just checked a single Old Norse text, the <em><a class="freelinking-external" href="http://www.heimskringla.no/wiki/Gylfaginning">Gylfaginning</a></em>, and came up with the following in addition to “rð”, “fð”, and “gð”:</p>
      <p>“kð” as in “þökð”<br>
      “lð” as in “dvalðist”<br>
      “mð” as in “ósæmð”<br>
      “nð” as in “leynð”<br>
      “pð” as in “steypðist”</p>
      <p>The eth is usually replaced in modern Icelandic spelling for these words.</p>
      <p>I also checked the text of <em><a class="freelinking-external" href="http://en.wikisource.org/wiki/Beowulf">Beowulf</a></em> and found 100+ instances of “rð” as well as:</p>
      <p>“cð” as in “brecða”<br>
      “fð” as in “Gifðum”<br>
      “gð” as in “mægð”<br>
      “hð” as in “fǣhð”<br>
      a text fragment containing “lð”<br>
      “mð” as in “nymðe”<br>
      “nð” as in “cēnðu”</p>
      <p>Also, don’t forget that in all these languages (modern Icelandic, Old Norse, and Old English) “y” is a vowel and that it also commonly precedes eth.</p>
