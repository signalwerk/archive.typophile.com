    html: <p>In the modern languages, the thing is that AFAIK both Icelandic and Faroese (which also uses the eth and thorn) can form compound words; so assuming eths and thorns can occur at the start &amp; end of words, it’s probably hard to limit the possible combinations. Yes, even the dreaded “fð” exists :-)</p>
