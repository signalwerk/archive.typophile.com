  html: |-
    <p>Dear Typophiles,</p>
    <p>Some of you may or may not know that I’ve been working on a typeface family called Exemplar for the past years. Today I am happy to tell you that this typeface family is released and available via the website of PSY/OPS in San Fransisco.</p>
    <p><img src="/sites/default/files/old-images/exemplarpro_4755.jpg"></p>
    <p>This project has been very dear to me and it feels like giving up a child or something now when it’s finally released.</p>
    <p>A lot of things involved in the process I have learned by You – the Typophile people, so would also like to say Thank You.</p>
    <p>I’ve prepared a PDF specimen that shows the family and its OpenType features together some other information.</p>
    <p>Exemplar Pro, english version<br><a href="http://www.autodidakt.se/pdf/ExemplarPro_Specimen.pdf">http://www.autodidakt.se/pdf/ExemplarPro_Specimen.pdf</a></p>
    <p>Exemplar Pro, swedish version<br><a href="http://www.autodidakt.se/pdf/ExemplarPro_Stilprov.pdf">http://www.autodidakt.se/pdf/ExemplarPro_Stilprov.pdf</a></p>
    <p>Direct link to PSY/OPS<br><a href="http://www.psyops.com/html/spec_exemplar.html">http://www.psyops.com/html/spec_exemplar.html</a></p>
    <p>Cheers,<br>
    Göran</p>
    <p><a href="http://www.autodidakt.se">www.autodidakt.se</a></p>
