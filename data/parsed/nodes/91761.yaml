  html: |-
    <p>Hey!</p>
    <p>I've been working on a site and really like using Futura for headlines (via typekit), but am having tons of trouble finding a proper text font that balances well. I didn't want to resort to Helvetica as the body text, but found that nothing else blended in. </p>
    <p>I know I don't want a slab serif, and have experimented with quite a few options. At the moment, I'm not even sure if I want sans or serif.</p>
    <p>I surprised myself when I found that I really liked <a href="/wiki/https%3A/%252Ftypekit.com/fonts/ltc-bodoni-175" class="freelinking" rel="nofollow">bodoni</a>, but ended up feeling it was too dominant. If possible, I'd love some advice on pairing a text font for my site in particular. Any quick thoughts?</p>
    <p>The site: <a href="http://bit.ly/krJPIa" title="http://bit.ly/krJPIa">http://bit.ly/krJPIa</a><br>
    (My Choices are anything in <a href="/wiki/https%3A/%252Ftypekit.com/fonts%3Fcollection%3Dpersonal" class="freelinking" rel="nofollow">this collection</a>, btw)</p>
    <p>Thanks for reading!</p>
