    html: |-
      <p><em>Just for my own understanding</em></p>
      <p>There are two different ways of describing figures (as represented by Quark XPress and InDesign), and I've mixed them up in that chart, which isn't correct.</p>
      <p>The icons are supposed to represent the four figure qualities:<br>
      Proportional, Tabular, Old-style, and Lining, </p>
      <p>rather than the four instances:<br>
      Oldstyle Proportional<br>
      Oldstyle Tabular<br>
      Lining Proportional<br>
      Lining Tabular </p>
      <p>So to indicate the four instances, I should have done this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/figs_5801.png"></div><p></p>
