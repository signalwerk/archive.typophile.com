    html: "<p> Dear Mr Kid, <br>Great enthusiasm - having a feeling is the best foundation. <br> <br>There are many knowledgable people on this forum who can point you to some wonderful online sources - I'd just like to point out three indispensable books that come to mind: \"Anatomy of a Typeface\" by Alexander Lawson, \"The Elements of Typographic Style\" by Robert Bringhurst, and \"Letters of Credit\" by Walter Tracy. There are many others, but for me these tend to stand out. <br> <br>hhp </p>"
