  html: "<p> Hi, I'm a 17 year old student in high school.  I think typogrpahy/graphic desgin is for me!!! I just have a feeling. <br> <br>Anyway, I need your help. <br> <br>I'm looking for typography information but I can't seem to find any over the internet believe it or not!  So what better way to get true info than come on a typogrpahy messageboard! <br> <br>Where can I find info on the following areas: <br> <br> <br>1.  Historical information on typography <br> <br>2.  Classification <br> <br>3.  Anatomy <br> <br>4. Form and Communication <br> <br>5. Page Shaping <br> <br>6.  Technology <br> <br> <br>I appreciate it, thanks! </p>"
