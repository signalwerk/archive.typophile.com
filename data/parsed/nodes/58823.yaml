      <p>About my favourite Czech typographer:</p>
      <p>Náchodský (plhovský) rodák Oldřich Hlavsa se v letech 1924–1928 vyučil typografem v Náchodě u Václava Rydla, tehdy samozřejmě v klasické ruční tiskárně, v době, kdy typografové velmi dbali na úroveň a čest svého řemesla. Pracoval pak v několika dalších náchodských tiskárnách. V roce 1934 na sebe upozornil v soutěži na plakát. Koncem třicátých let odešel do Prahy jako faktor do tiskárny Solidarita. Od čtyřicátých let graficky upravoval prestižní časopis Typografia, který ovlivňoval lepší část českého tisku. Od r. 1950 byl členem Svazu čs. výtvarných umělců, v polovině padesátých let se stal samostatným výtvarníkem a věnoval se převážně knižní typografii.</p>
      <p>From the article: Aleš Fetters: Oldřich Hlavsa<br>
      <a href="http://unas.svkhk.cz/pdf_archiv/0644.pdf" title="http://unas.svkhk.cz/pdf_archiv/0644.pdf">http://unas.svkhk.cz/pdf_archiv/0644.pdf</a></p>
