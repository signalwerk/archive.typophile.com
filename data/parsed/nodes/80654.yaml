      <p>Well, I only put in the combining cedilla at U+0327 to test my suspicion the aliases file was at fault...it took me several hours to figure out how FL builds the composites! My commaaccent must have had a weird name to start with, or FL would have found it without needing the unicode.</p>
      <p>I'll make sure to call Ncommaaccent uni0145 henceforth. Thanks for your help.</p>
