    html: <p>Also, I shall mention that "uni0145" is a better name than "Ncommaaccent" because it will work in OTFs under Mac OS X 10.4, while "Ncommaaccent" won't. The "*commaaccent" names were removed from AGLFN (Adobe Glyph List for New Fonts), so the "uni****" names are the recommended form for them.</p>
