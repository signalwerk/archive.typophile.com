  html: |-
    <p>I'm wondering what sort of bug this is. When I compose Ncommaaccent for example, FL puts a cedilla, rather than a commaaccent on the N base glyph. This happens for all commaaccent glyphs. I know there has been extensive discussion about Romanian/Moldavian S and T cedilla/commaaccent characters, but haven't seen anything about the G, K, N or R commaaccent characters.</p>
    <p>So I'm wondering if this is a problem with the FL alias file which is telling the 'create glyph' command to look for U+0327 (cedilla) instead of U+0326 (commaaccent), or if it's a naming problem where the glyphs are supposed to be made with cedillas despite having commaaccent names?</p>
