    html: |-
      <p>You are right! </p>
      <p>alias.dat is buggy in that regard, it says: </p>
      <p>Ncommaaccent N+~uni0327.case<br>
      Ncommaaccent N+uni0327<br>
      Ncommaaccent N+commaaccent</p>
      <p>but it should say</p>
      <p>Ncommaaccent N+~uni0326.case<br>
      Ncommaaccent N+uni0326<br>
      Ncommaaccent N+commaaccent</p>
      <p>This is the result of the -- now considered errorneous -- canonical decomposition in the Unicode Standard, which decomposes U+0145 to U+004E U+0327. </p>
      <p>Also, please note that in the meantime, we've changed the recommendation for glyph naming. Rather than "Ncommaaccent", the glyph should be named "uni0145". </p>
      <p>(Of course this also applies to all the other "commaaccent"-related glyphs).</p>
      <p>We'll rebuild alias.dat to improve this, but it will take some time, since building it is a kind of a complicated process. </p>
      <p>Thank you for catching this!<br>
      Adam</p>
