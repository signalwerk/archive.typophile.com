      <p>Actually, the funny thing is that you seem to have uni0327 (the combining cedilla, properly named) in your font (right?) -- which most people do not have. That's the reason why the problem was not discovered earlier. </p>
      <p>As you may notice, after the "N+uni0327" recipe, the next in queue is "N+commaaccent". And the way alias.dat works is that FLS tries to find the best match by stepping through the entries with the same glyph name, until it finds the largest number of fitting composites. </p>
      <p>Since most fonts don't have "uni0327" but they do have "commaaccent", the first rule got ignored, and the second one kicked in for most of them. So they did not experience your problem. </p>
      <p>Anyhow, many thanks!<br>
      A.</p>
