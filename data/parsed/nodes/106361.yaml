    html: <p>Office files contain no font. You could send a Word file in which you use Geronimo, Trinity or any H&amp;FJ font without breaching any EULA. If the receiver does not have the font installed on his system, a fallback font is used to display and print  (without any warning). The same holds for PowerPoint  files.</p>
