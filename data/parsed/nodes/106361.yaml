  html: |-
    <p>I have found a bug in MS Word 2013. I do not know to whom should I contact so I am posting it here. If any Microsoft guy happened to came across it they may check it. I am also attaching a docx file containing the same text in Arab Typesetting font, as well as in free Scheherazade font and Adobe Naskh medium font, so their team can check it quickly. </p>
    <p>This bug was not present in Word 2010. The image shows the bug that how digits placement is disturbed over certain Arabic signs.</p>
    <p><img src="/sites/default/files/old-images/Word 2013 Bug_6183.jpg"></p>
