    html: |-
      <p>It's as fuzzy as all other wording on the subject ;-)</p>
      <p>The problem lies in the maximum number of bytes allowed for each <em>character code</em>. The oldest tables, for example, only allow a single byte; hence the long list of different "languages" for the Mac tables. The next generation of tables supported Unicode, a 2-byte character definition. It was thought at the time that "surely 65,536 codes are enough for everybody" (echoing what Bill Gates is said to have said on memory) ... So that's what Windows supports with its Platform 3 stuff.</p>
      <p>Now we know 65,536 codes is not merely enough -- on one end, the Unicode Consortium valiantly attempts to define a code for all existing glyphs so far, and on the other end people are making up new glyphs by the thousands (ie. Klingon, emoticons) and then <em>demand</em> to be taken seriously by the UC consorts and be included in the next "definitive list of all Human Glyphs" :D</p>
      <p>Back in the ol' 2-byte Unicode days, there was a system called Unicode Surrogates, that reserves a chunk of 2-byte codes to only be used in pairs, forming (gasp!) 4-byte codes. That was sort of a stop-gap solution, IIRC to make the 2-byte definition swallow a large extra lump of CJK characters without breaking the old definition. That's what you see in the format 4 definition.</p>
      <p>My understanding is format 4 only allows <em>some</em> 4-byte Unicodes, and format 8 and higher allows all of them, but I'd have to see an example before I can work out the difference.</p>
      <p>Note that just like you should not be confusing <em>glyps</em> and <em>character codes</em> (a distinction you seem to have learned by now), you also must make a distinction between encoding table ID's and its physical manifestation. A Platform 3 Encoding 1 table can appear in many different formats, the font creating software must find a table format best suited to its Unicode repertoire. So the more different table formats you can read, the better.</p>
      <p>Best advice is to test on as much fonts as you can find :-) I just tested a few of my Mac system fonts:</p>
      <p>华文细黑.ttf  ("STHeiti") -&gt; 37256 glyphs, 3:0 is format 12, Unicodes up to U+2A6C7<br>
      儷宋 Pro.ttf ("LiSong Pro") -&gt; 22581 glyphs, also format 12, UC up to U+2F9D4<br>
      ヒラギノ丸ゴ Pro W4.otf ("Hiragino Maru Gothic Pro") -&gt; 20317 glyphs, 3:10 is format 12, UC up to U+2F9F4<br>
      Ken Lund's "Unicode All" Stress Test font (see <a href="http://typophile.com/node/89519" rel="nofollow">An "Extreme" OpenType font for stress-testing</a>) -&gt; 65,535 glyphs, platform 3, encoding 1, format 4; UC up to U+10FFFD (this is a 40 byte large table that spits out a massive 293,888 lines with 4 codes per line :D )</p>
      <p>I am not aware of a Best Practice to find the table with the <em>largest</em> repertoire of characters in a given set -- if I would need this, I think I would simply test all of the available tables and count the number of entries in each. (I *think* you need to iterate over each full table's contents to find the number of supported Unicodes because you cannot simply tell from the table header.) And to do so, you need to be able to parse every possible table format you can lay your hands on.</p>
