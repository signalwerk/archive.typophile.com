      <p>Ah, table format 14 is that one for Unicode Variation Sequences. One of the weirder "standards" put forth by the Unicode consortium, if I may say so ;-)</p>
      <p>Some of the (extremely large) Chinese and Japanese fonts on my Mac have these, and are even usable with InDesign. But if you have a modern version of Windoes, check out Cambria. It has a set of alternatives for several mathematical symbols. It seems these got added fairly recently to the specs so they don't work in my InDesign CS4.</p>
      <p>Remind me to check Apple's Color Emoji font. In some probably undescribable way the UC const. got press-ganged in including <em>different variations</em> for about the entire set of emoji.</p>
  - id: 498917
    user: 14653
    date: 2012-03-09T13:25:00
    date_raw: 9 Mar 2012 — 1:25pm
    votes: null
    html: |-
      <p>The only CJK fonts bundled with Mac OS X that include variation sequences are some of the Hiragino (Japanese) ones.</p>
      <p>The Format 14 'cmap' subtable was developed by Adobe, which was reviewed by Microsoft. The Unicode Consortium had nothing to do with it. They either standardize or register variation sequences. Thankfully, the Format 14 'cmap' subtable has become the default and preferred way in which to represent variation sequences in OpenType fonts.</p>
