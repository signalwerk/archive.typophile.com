    <p>Hello everyone,</p>
    <p>I have been trying to create a PHP script to extract the information included in a font file. So far I have managed to get the information from the "name" table with success. </p>
    <p>The next step would be to list the glyphs of the font. But as for now, I feel a little confused about where this information is located in the font file. If I consider this thread : <a href="http://typophile.com/node/16695#comment-99516" title="http://typophile.com/node/16695#comment-99516">http://typophile.com/node/16695#comment-99516</a></p>
    <p>I quote : "the glyph names are stored in the "post" table"</p>
    <p>This is the first question in my mind, to make sure where this information is.</p>
    <p>But to be completely honest, I don't get the structure of the "post" table, as seen <a href="https://developer.apple.com/fonts/ttrefman/rm06/Chap6post.html" rel="nofollow">here</a>. </p>
    <p>What I don't really understand right now is the type of data (Fixed, and FWord) even though it's explained <a href="https://developer.apple.com/fonts/ttrefman/rm06/Chap6.html#Types" rel="nofollow">here</a>. As I use the unpack() function to get this information, I should specify a format, and this is where I'm confused.</p>
    <p>If anyone has any information about my questions, I would be really grateful :)</p>
    <p>Frederic</p>
