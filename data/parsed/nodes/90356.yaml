      <p><cite>...  do you mean that with the constantly growing number of glyphs, the actual table formats might not cover everything, and just like this might skip some because it doesn't know them yet?</cite></p>
      <p>Right. But that should not hold you back, as just about everything is transient -- and more so in the field of computers. What is Hot today is laughed at tomorrow. Does anyone remember "Second Life"? Or (back to type) doesn't anyone who still has to use Type 1 fonts wish they could upgrade these to the equivalent Opentype fonts?</p>
      <p>You can only support what is known now and wish for the best.</p>
      <p><cite>About format 4 [...] I guess, it must cover what I'm looking for?</cite></p>
      <p>You can't know in advance if that specific <em>format</em> is used. If the cmap data is best described in format 2, 6, 12 or 16, that's what you will <em>find</em>. But --</p>
      <p><cite>.. I'm willing to get such information from fonts that would only have Latin and Cyrillic characters.</cite></p>
      <p>-- those are pretty basic standards, and well inside the 'critical' range of 2-byte Unicodes. So even if you encounter a table formatting you cannot extract, one of the others will almost certainly contain these character codes.</p>
      <p>(Unless there is only one table in the file, but I think that's covered by the requirement you cited to have at least this format 4 table. I would have to check my fonts to be sure this one <em>is</em>, in fact, always included.)</p>
      <p>All of the above is guesswork based upon my personal experience, so anyone with more factual knowledge is hereby invited to point out any misconceptions I might be having :)</p>
