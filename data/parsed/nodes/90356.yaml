      <p>To clarify, my UnicodeAll.otf stress-test font includes a 40-byte Format 4 'cmap' subtable that supports only the BMP (U+0000 through U+FFFD, but excluding the 2,048 Surrogates from U+D800 through U+DFFF):</p>
      <p>format       =4<br>
      length       =0028<br>
      languageId   =0 [Default]<br>
      segCountX2   =6<br>
      searchRange  =4<br>
      entrySelector=1<br>
      rangeShift   =2<br>
      --- endCode[index]=code<br>
      [0]=55295 [1]=65533 [2]=65535<br>
      password=0<br>
      --- startCode[index]=code<br>
      [0]=0 [1]=57344 [2]=65535<br>
      --- idDelta[index]=code<br>
      [0]=1 [1]=1 [2]=1<br>
      --- idRangeOffset[index]=code<br>
      [0]=0000 [1]=0000 [2]=0000<br>
      --- glyphId[index]=glyphId</p>
      <p>Its Format 12 'cmap' subtable, which is 232 bytes, supports all of Unicode, up through U+10FFFD, meaning 1,112,030 code points:</p>
      <p>format    =12<br>
      length    =00e8<br>
      languageId=0 [Default]<br>
      nGroups=18<br>
      --- Group[index]={startCharCode,endCharCode,startGlyphID}<br>
      [0]={0,55295,1} [1]={57344,65533,57345} [2]={65536,131069,1} [3]={131072,196605,1} [4]={196608,262141,1} [5]={262144,327677,1} [6]={327680,393213,1} [7]={393216,458749,1} [8]={458752,524285,1} [9]={524288,589821,1} [10]={589824,655357,1} [11]={655360,720893,1} [12]={720896,786429,1} [13]={786432,851965,1} [14]={851968,917501,1} [15]={917504,983037,1} [16]={983040,1048573,1} [17]={1048576,1114109,1}</p>
      <p>-- Ken</p>
