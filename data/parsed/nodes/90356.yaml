      <p>Cor! That's old documentation!</p>
      <p><cite>.. the information included in a font file ..</cite></p>
      <p>There is No Such Thing as "a" font file. What sort of files are you referring to? DFONT? Type 1? Truetype? Opentype? Your mentioning a "name" table suggests the latter.</p>
      <p>Let's get the most important bits right first. I'm surprised you refer to that old page, because it's last updated around 2003 (and frankly even that late date surprises me). The reason for that is because that particular sub-site of Apple's deals with (their version of) Truetype, and Truetype fonts have long been abandoned by everyone in favour of the Opentype format. True, it's more or less the same, but you should be reading stuff like</p>
      <p><a href="http://www.microsoft.com/typography/otspec/" title="http://www.microsoft.com/typography/otspec/">http://www.microsoft.com/typography/otspec/</a></p>
      <p>or</p>
      <p><a href="http://www.adobe.com/devnet/opentype.html" title="http://www.adobe.com/devnet/opentype.html">http://www.adobe.com/devnet/opentype.html</a></p>
      <p>(the latter refers back to the Microsoft site for the main documents but still contains lots of useful additional info).</p>
      <p>Regarding the format of the 'post' table: this is, actually, still relevant for Opentype fonts. There are different <em>formats</em> in which the data can be stored; you should read the format first and then decide what else you need to know. <em>But</em> before I get your hopes up: one of the formats that is used frequently is type 3: 'explicit no-name table', which means there are <em>no</em> glyph names stored in the file (they might be stored as part of the CFF data in a Type 1 style OTF, which is yet something else).</p>
      <p>But yet again, this might be not what you were after. The 'post' table allows access to <em>unique glyph names</em> in a font, for example, a regular 'A' that is called 'A' and an alternate A called "A.alt". Perhaps what you describe would best be achieved by examining the <em>character map</em> instead -- <code>'cmap'</code>. (Read the documentation I referred to why I believe this.)</p>
