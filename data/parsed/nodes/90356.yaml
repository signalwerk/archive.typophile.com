    html: |-
      <p>AFAIK, variants selected by variation selectors serve a specific meaning that need to be encoded into the text, though I think they would have very well encoded them as different characters (like, say, the regular and final Greek sigma). Also, the variants are indeed hard coded, in the sense that conformant implementations should only support sequences registered by Unicode. See <a href="http://www.unicode.org/Public/UNIDATA/StandardizedVariants.html" title="http://www.unicode.org/Public/UNIDATA/StandardizedVariants.html">http://www.unicode.org/Public/UNIDATA/StandardizedVariants.html</a>.</p>
      <p>BTW, if someone is the looking for a free font that implements the math variants, there is <a href="/wiki/https%3A/%252Fgithub.com/khaledhosny/xits-math" class="freelinking" rel="nofollow">XITS</a> (OK, that is blatant self promotion).</p>
  - id: 498964
