      <p>Below is an interpretation of the "spot -tcmap" output above, providing Unicode and CID ranges for the eighteen Format 12 mappings that support all 1,112,030 Unicode code points:</p>
      <p>[0]={0,55295,1} -&gt; U+0000 through U+D7FF map to CIDs 1 through 55296<br>
      [1]={57344,65533,57345} -&gt; U+E000 through U+FFFD map to CIDs 57345 through 65534<br>
      [2]={65536,131069,1} -&gt; U+10000 through U+1FFFD map to CIDs 1 through 65534<br>
      [3]={131072,196605,1} -&gt; U+20000 through U+2FFFD map to CIDs 1 through 65534<br>
      [4]={196608,262141,1} -&gt; U+30000 through U+3FFFD map to CIDs 1 through 65534<br>
      [5]={262144,327677,1} -&gt; U+40000 through U+4FFFD map to CIDs 1 through 65534<br>
