      <p>Keep in mind that there is a difference between standardized and registered variants. The former are closely tied to the standard. The latter are part of a registry that is set up by the standard. The implementation is the same in fonts, meaning via the Format 14 'cmap' subtable.</p>
      <p>About Apple's Color Emoji font, keep in mind that the Standardized Variants for emoji were just accepted into the standard during last month's UTC and WG2 meetings. Apple obviously hasn't had time to revise their fonts accordingly. The proposal came from Apple.</p>
      <p>BTW, I am the <a class="freelinking external" href="http://www.unicode.org/ivd/" rel="nofollow">IVD</a> Registrar.</p>
