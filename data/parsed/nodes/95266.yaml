    <p>Hello,<br>
    This is an example of a movie-poster typeface drawn by German poster designer Hans Otto Wendt. I am looking for a font with a similar feel. What I particularly love is the brushstroke-look this has goin' on.<br>
    Any ideas would be much appreciated!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Wendt_5999.jpg"></div><p></p>
