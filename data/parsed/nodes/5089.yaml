  - id: 37030
    user: 1043
    date: 2004-06-04T15:16:00
    date_raw: 4 Jun 2004 — 3:16pm
    votes: null
    html: <p>What I meant was that they don't use what we would call fonts or typefaces on stamped license plates. They use special dies of letters and numbers created for making license plates. I guess you could call them typefaces in a certain sense, but usually a typeface means something you can buy from a font foundry for setting type. License plate dies are similar to type in that they involve letters and numbers and have a modular way of arranging them to make words or numbers, but they have a separate parallel history from type, and they are not the same thing.  <br> <br>A better way to ask would be, what fonts look like the letters and numbers used on these license plates?</p>
