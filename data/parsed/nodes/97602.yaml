      <p>I guess that's an optical illusion, which I for one had never considered*. Sure, the eye is king, but time is money... What I mean is, it might be worth ignoring that minor refinement, especially since accented caps rarely occur close enough for somebody to be bothered by a slight difference in apparent size.</p>
      <p>* You see how useful a noob can be?  :-)</p>
      <p>One notable thing about cap accents though: they're often flatter than the lc equivalents, to reduce collisions with descenders in previous lines. People do mind that.</p>
      <p>hhp</p>
