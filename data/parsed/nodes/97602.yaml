    html: |-
      <p>:) You bet I thought about that color difference long before writing this – and no, it's not the contrast responsible for this – most accents on this "recommended" site really are bigger than they should. I'm a Romanian, I know (our) diacritics quite well, and I can spot that pretty easily for our diacritics: for instance, the left and right extrema points of the circumflex and breve in |â| and |ă| should not share the same coordinate with the extrema point of the tear of |a| on the left and with the extrema point of the stem on the right. In other words, these two accents should always be a bit narrower than the upper part of |a|. Also, the comma-below of |ș| and |ț| (s-comma-accent and t-comma-accent, again Romanian diacritics) should most of the time be smaller than the sentence comma, which in the case of the grey images posted on diacritics.typo.cz doesn't seem to be the case, contrast or no contrast. That's why I consider that site to be so misleading for font designers who deal with Latin diacritics.</p>
      <p>//Later edit: Even if I feel my complaint about diacritics.typo.cz is completely warranted, maybe I'm slightly off-topic, so just to balance things and not mislead the original poster (typogruffer) by mistake, I'll just say I also agree with Nick Shinn about the accents in your image – indeed they are a bit too light and too close to the letters.</p>
      <p>P.S. I'm actually working on a "Romanian Diacritics How-To" PDF. Is it possible to post it here once it's finished?</p>
