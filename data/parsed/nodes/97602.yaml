    <p>Hey Guys,<br>
    While designing diacritics for a font I am currently working on, I stumbled across a small problem. When using the acute accent over A and E, the accent appears smaller on E (PFA image). I am purposefully using smaller accents (rather than the original accent character) for Uppercase letters. Is it OK if I modify the accent on E to make it look bigger. Is this act of rule braking acceptable?</p>
