    html: |-
      <p>How glyphs look should always trump the numbers in type design. The values you set up for stem widths, x-heights, overshoots, standard accents, et cetera are all only guidelines, not absolutes. If something looks too big or small, wide or thin, even though it follows the standards you’ve set for the font, make the optical adjustments to make it look right.</p>
      <p>David</p>
