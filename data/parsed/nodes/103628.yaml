    <p>Hey guys, </p>
    <p>you might have noticed the trend (or you might be sick of it by now) of Chalkboards with handdrawn lettering etc.<br>
    I was wondering if you could pass me some tips, cause I need to do a chalkboard for a wedding. </p>
    <p>Attached is some inspiration, could anyone say what the designer could have based the top font on? "Caroline &amp; Andrio" </p>
