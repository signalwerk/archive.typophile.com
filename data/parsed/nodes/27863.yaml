    <p>Can anyone please help.</p>
    <p>I need to incorporate circles into a bullet point paragraph style similar to below.</p>
    <p> 0 English For Proffesionals</p>
    <p> 0 English For Children</p>
    <p> 0 Business And Communications</p>
    <p>Ive been doing this by eye but i know there must be a way to incorporate this into the paragraph style.</p>
    <p>Can anyone help ? I would be very grateull.</p>
