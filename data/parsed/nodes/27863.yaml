    html: |-
      <p>I’m sure someone will come along with a much more clever response than mine. </p>
      <p>However, you could always set it with normal bullets and do a find/replace when you are finished.</p>
      <p>I would suggest using an embedded character style for the first character so you can assign a baseline shift also. This assumes you are using InDesign CS2.</p>
