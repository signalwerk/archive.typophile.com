    html: |-
      <p>Not sure what you mean by “on a horizontal axis” but to ‘outdent’ anything simply indent everything <em>except your bulleted copy</em> and, shazam, your bullets are hanging outside the margin.</p>
      <p>(You may need to adjust the placement/width of your text frames to compensate for the global indent.)</p>
