    html: |-
      <p>If you simply want — or can use — and outlined bullet, this is a perfect opportunity for nested styles. You could create a “character style” of the black outline and “nest” it in your “paragraph style” which assigns proper indentations.</p>
      <p><a href="http://www.google.com/search?hl=en&amp;lr=&amp;client=safari&amp;rls=en&amp;q=indesign+%2B+nested+styles&amp;btnG=Search">A few useful links on creating nested styles.</a></p>
