    html: |-
      <p>Apply some custom scratches to Berthold’s Clarendon cut or Super Grotesk.</p>
      <p>Most typefaces with scratches built in are pre Opentype which limits the possibile alternates. What you then end up with is the same scratches every time you use an character which looks crap.</p>
      <p>You should have a look at some of Vince Frost’s work like on the BIG Magazine covers. Amazing stuff. <a href="http://www.frostdesign.com.au" title="www.frostdesign.com.au">www.frostdesign.com.au</a></p>
      <p>The best alternative is of course if you get a hold of some old woodtype on ebay and scan them and then vectorize. However I do not know if this is for display use or setting bodycopy?</p>
