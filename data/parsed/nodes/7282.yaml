  html: "<p>Hello everybody <br> <br>this is about a poster for a small theater in town and is the poster i mention to the General Discussions board at the \"S/M Typeface Wanted\" string.  <br> <br>The story: the tragic documentation of  a stong and deadly passion among 3 persons: a couple and the best girl-frient of the woman. Love and hate is total and exist at the same time. Violence is both physical and phsycological. There is no logic and ethics, only the power of passion which in the end leads to the death. <br> <br>There is no real story that i can describe, since the play is based more on the emotions of the scenes than their plot. <br> <br>The poster: A and B are the first approaches. They chose B and so we moved to F1,2,3 expecting to select the final. I am sorry that i posted the work so late, but everything happened very fast. Actually i posted the work because one week ago i asked for appropriate font to the theme (\"S/M Typeface Wanted\" in General Discussions board). <br> <br>Eventually being ispired from what everybody kindly send i designed the lettering for the title (as you see it needs hell a lot of work) but i couldn't make it work with the poster. <br> <br>Have a nice day, christos <br> <br><img src=\"http://www.typophile.com/forums/messages/29/51773.jpg\" alt=\"\"></p>"
  html_clean: "<p>Hello everybody <br> <br>this is about a poster for a small theater in town and is the poster i mention to the General Discussions board at the \"S/M Typeface Wanted\" string.  <br> <br>The story: the tragic documentation of  a stong and deadly passion among 3 persons: a couple and the best girl-frient of the woman. Love and hate is total and exist at the same time. Violence is both physical and phsycological. There is no logic and ethics, only the power of passion which in the end leads to the death. <br> <br>There is no real story that i can describe, since the play is based more on the emotions of the scenes than their plot. <br> <br>The poster: A and B are the first approaches. They chose B and so we moved to F1,2,3 expecting to select the final. I am sorry that i posted the work so late, but everything happened very fast. Actually i posted the work because one week ago i asked for appropriate font to the theme (\"S/M Typeface Wanted\" in General Discussions board). <br> <br>Eventually being ispired from what everybody kindly send i designed the lettering for the title (as you see it needs hell a lot of work) but i couldn't make it work with the poster. <br> <br>Have a nice day, christos <br> <br><img src=\"http://www.typophile.com/forums/messages/29/51773.jpg\" alt=\"\"></p>"
