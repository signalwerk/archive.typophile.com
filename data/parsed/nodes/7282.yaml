    html: <p>Sweet, I think the font is ideal and the directions are accurate to your description! <br>I am partial to F1, however, I feel like the incorporation of the man/woman bathroom icons isn't successful from the cardboard concept. Their basic rounded forms feel foreign to the harsh angles and intense imagery, and the font, too. My suggestion would be to try redrawing these characters, make fit. (though this message may just be too late!) <br> <br>Good luck! <br>aaron</p>
