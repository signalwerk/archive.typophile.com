    html: "<p>Hello Aaron  <br> <br>i understand your objection but i disagree. I like the differentiation between the elements and i believe it works in this sceptic: this process of destruction leaded by the passion can take any \"ordinary\" person and make him/her go to the edges. Also the story starts very \"normal\" to end up in \"flames\" of sensuality and death.  <br> <br>I don't agree to make the figures \"more fit\" because i think then their presence would be useless. <br> <br>Thank you for the feedback <br> <br>christos</p>"
