      <p>ok, I established that Fontforge uses its own form of scripting language, described here: <a href="http://fontforge.sourceforge.net/scripting.html" title="http://fontforge.sourceforge.net/scripting.html">http://fontforge.sourceforge.net/scripting.html</a><br>
      but that still doesn't explain why GetTTFName(0x409,2) returns an empty string, when it clearly has the TTF subfamily set when you open it up. Fontforge also does Python scripting. but I know virtually nothing of it, and it would be too difficult and timeconsuming to learn it just for this.<br>
      I guess there is nothing for it but to open up each newly-generated font and fixing it by hand.</p>
