    html: |-
      <p>Postscript fonts don't have a names table, even for TTF names FontForge seems to return empty strings for TTF names corresponding to PostScript names (i.e. what you see in the PS Names tab), instead you can use the builtin variables:</p>
      <p>Open($1)<br>
      Print($fontname)<br>
      Print($fullname)<br>
      Print($familyname)</p>
      <p>Style is usually what is after the hyphen in $fontname, you can then used SetTTFname() to set the new values as you like.</p>
