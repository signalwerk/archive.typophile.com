      <p>You can get the English (US) "TTF Names" as seen by FontForge with the following bash script that calls fontforge on a python script (here FontForge is used as a Python interpreter):</p>
      <p><code>---<br>
      #!/usr/bin/env&nbsp;fontforge&nbsp;-lang=py<br>
      #&nbsp;http://www.typophile.com/node/81351<br>
      #&nbsp;<br>
      import&nbsp;fontforge,sys<br>
      fnt=fontforge.open(sys.argv[1])<br>
      nametbl=&nbsp;fnt.sfnt_names<br>
      for&nbsp;N&nbsp;in&nbsp;nametbl:<br>
      &nbsp;&nbsp;if&nbsp;(N[0]&nbsp;==&nbsp;'English&nbsp;(US)'):<br>
      &nbsp;&nbsp;&nbsp;&nbsp;print&nbsp;"%-20s&nbsp;%s"&nbsp;%&nbsp;(N[1]+":",&nbsp;N[2])<br>
      ---</code></p>
      <p>Michel</p>
