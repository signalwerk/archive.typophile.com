      <p>Many thanks Fivos.<br>
      Another gem from Nick Curtis -- the most prolific font-maker of our era.<br>
      It really works in giving the right period flavor to the book.<br>
      According to Nick's font source expert, the Dutch fellow,  the design is by Joseph Bertram Jowit and was published in _Modern Show Card Writing (1922)_.<br>
      Don</p>
