    <p>Love the hand lettering style serif with the tilde/flames on the cover of this new book from UK publisher Spellmount.<br>
    I  know of several similar fonts by Cooper, Goudy, Colwell etc., but none are a match.<br>
    Any suggestions?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/FeedingTommy2013_5830.jpg"></div><br>
    Previous discussion of tilde/flames <a href="http://typophile.com/node/103815" title="http://typophile.com/node/103815">http://typophile.com/node/103815</a><br>
    Don<p></p>
