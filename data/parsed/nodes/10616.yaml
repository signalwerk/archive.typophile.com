    html: |-
      <p>If you're talking about 4 fonts only that are B-1, B-2, B-3, B-4?</p>
      <p>These are Filmotype fonts that were given letters &amp; numbers by VGC when they pirated a substantial number of them. Their original names were attached by someone going through a dictionary and just picking arbitrary words for Filmotype fonts that were initially just letters and numbers also. When and where I haven't the vaguest idea. But for Typositor operators there was always a haphazard list that you had to find out which was which when you bought from VGC. </p>
      <p>B-1 = Galaxy<br>
      B-2 = Gable<br>
      B-3 = Garfield<br>
      B-4 = Gamma</p>
      <p>There is a complete listing of the VGC letter/numbers = Filmotype names in the Babel Press Type Index which I am still trying to print.<br>
      I have found out that (digital) printers want to print so fast that the quality goes down. So far, I have been unable to get this straight.</p>
