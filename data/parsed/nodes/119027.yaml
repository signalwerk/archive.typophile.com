  html: |-
    <p>Hi folks,</p>
    <p>I'm revamping the brand/site for <a href="http://www.spritebuilder.com" title="www.spritebuilder.com">www.spritebuilder.com</a>, which is a tool game developers can use to build games (using Objective-C, for iOS and Android).</p>
    <p>The playful feel of the brand is basically correct, but we'd like it to be a touch more professional-looking, and the logotype in particular needs work. </p>
    <p>Suggestions of contemporary-looking sans faces with a smidge of playfulness about them (not too much; the colors and mascot go a long way) would be greatly appreciated. </p>
    <p>Thanks!</p>
