  html: <p>Hi, <br> <br>I hope someone can help.  <br> <br>Does anyone know of a suitable classical typeface for use on print material (at any size - body and headline)? <br> <br>These are my closest references (see jpg).... Trajan - way too clasical (but rather lovely), Debenhams - owned by them so I can't use this (and still too classical and 'thin' ) and finally Mylius - owned by British Airways so unfortunately non-commercial but the closest to what I want. <br> <br>And I also need to buy both PC and Mac versions. <br> <br>Any suggestions at all are greatly appreciated. <br> <br>Many thanks in advance. <br> <br>Ged<img src="http://www.typophile.com/forums/messages/83/57078.jpg" alt="Type examples"></p>
