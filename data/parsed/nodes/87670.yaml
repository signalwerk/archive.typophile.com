    <p>I was wondering if any of you haave worked with a vendor that laser cuts paper. If so, would you be willing to share your vendor's name and contact info? Additionally, are there any tidbits of advice you can pass along in terms of keeping costs down, what types of paper work best, etc?</p>
    <p>After doing a preliminary search on Google, it appears there are several sources to choose from. However, I always like to patronize vendors that a fellow designer finds helpful, reliable and do an all-around great job.</p>
    <p>Many thanks in advance.</p>
