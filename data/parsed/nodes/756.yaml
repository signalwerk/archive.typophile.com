  html: "<p>Dear friends and lovers of type, <br> <br>After our supa-dope first event last year, once again we must shake our serifs to the ground and tear the roof off the sucker: <br> <br>Kern Baby Kern2: <br>Double da Volume <br> <br>Right on... <br> <br><a href=\"http://www.indie-fonts.com\">Indie Fonts</a> book (Volume 1 and 2) and <a href=\"http://www.poltroonpress.com\">Poltroon Press</a>' \"Alphabets to Order\" will be on sale, fresh from the makers. <br> <br><a href=\"http://www.p22.com/indiefonts/indie2.html\">Indie Fonts #2</a> is just out, to complement <a href=\"http://www.indie-fonts.com\">#1</a>. Check the ice - these jewels are hot. <br> <br>Presentations and book signing by <a href=\"http://www.hollandfonts.com\">Holland Fonts</a>, Poltroon Press, and <a href=\"http://www.typebox.com\">Typebox</a> - independent type foundries from the Bay Area, featured in Indie Fonts 2 and 1 - and a special appearance by <a href=\"http://www.typesociety.org\">SOTA</a>.  <br> <br>Daamn right. Whole lotta puddin.' <br> <br>Friday, 8 8 2003 at 7pm <br>UC Extension Auditorium <br>55 Laguna Street @ Market Street <br>San Francisco <br>Eight-eight '03 at five-five Laguna - can you dig it? <br> <br>Sponsored by: <br><a href=\"http://www.ucbxgraphicweb.org/\">UC Extension Graphic &amp; Interactive Design Program</a> <br><a href=\"http://www.typebox.com\">Typebox</a> <br><a href=\"http://www.typesociety.org\">SOTA</a> (The Society of Typographic Aficionados) <br>Aah yeah. Give 'em a big hand. <br> <br>FREE admission <br>You know, there's no price - for luuv. <br> <br>See ya in da house - <br>[Li'l MiK and Big YoML] <br></p>"
