  html: |-
    <p>Hello. Two Chandler &amp; Price Pilot Letterpresses were recovered in Mexico. Restoration is required. I ask the community for 1) documentation about this specific model of the Chandler &amp; PrIce Pilot letterpress, 2) advise on where to purchase pieces and even identical machines.<br>
    For the record, both machines belonged to a Mexican revolutionary exiled in the US, circa 1906.<br>
    Thank you very much.<br>
    Some images.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/C-P-Pilot_4757.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_6357.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/IMG_7295_5207.jpg"></div><p></p>
    <p><a href="http://issuu.com/diegofloresmagon" title="http://issuu.com/diegofloresmagon">http://issuu.com/diegofloresmagon</a></p>
