      <p>I have and use one of these. They're fun presses.</p>
      <p>Here's an invaluable resource for you about all things letterpress: briarpress.org</p>
      <p>For parts, especially 'generic' parts like rollers, try NA Graphics — nagraph.com</p>
      <p>Also, Excelsior Press (<a href="http://excelsiorpress.org/index.inner.html" title="http://excelsiorpress.org/index.inner.html">http://excelsiorpress.org/index.inner.html</a>) knows a great deal about restoring letterpresses.</p>
      <p>Good luck!</p>
