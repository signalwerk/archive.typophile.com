  html: |-
    <p>Can anyone out there tell me why awful lettering is spread all over<br>
    the media like a cancer?</p>
    <p>A good example is shown in the HTC "You" ad campaign.  Each lettering<br>
    style took seconds to minutes to draw.  The point is the product.</p>
    <p>I believe some of the ad ingredients have to be unusual to make us look<br>
    at the product being featured.  The product is the point.</p>
    <p>Even James Victore makes a good living from creating bad art.  If that's<br>
    your bag, that's fine.  It's not mine.</p>
    <p>Paul Rand helped pioneer modern and informal graphic and advertising<br>
    design.  I like some of his work very much.</p>
    <p>The modern and informal trends in design are back in a big way.<br>
    A really big way!  </p>
    <p>Beauty is in the eye of the beholder.  Sometimes, the beholder doesn't<br>
    know what beauty is.  </p>
    <p>Some people just don't take the time to see everything out there, like<br>
    I do.  I'm very observant and have been since I was a child.  </p>
    <p>Very few things impress me, and when something does, I stand up and<br>
    cheer.  I don't cheer, however, for what I think is bad out there.  This<br>
    is the age where bad is the new good.</p>
