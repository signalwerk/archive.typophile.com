      <p>To quote Baudelaire:</p>
      <p>"Before trying to isolate the epic quality of modern life and to show,<br>
      by giving examples, that our age is no less rich than ancient times in<br>
      sublime themes, it may be asserted that since every age and every<br>
      people have had their own form of beauty, we inevitably have ours....<br>
      All forms of beauty, like all possible phenomena, have within them<br>
      something eternal and something transitory -- an absolute and a<br>
      particular element. Absolute and eternal beauty does not exist, or<br>
      rather it is nothing but an abstract notion, creamed off from the<br>
      general surface of different types of beauty."</p>
