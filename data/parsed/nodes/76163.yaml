    html: <p>I suspect that much of the ugly-by-design stuff is really just design-by-committee stuff that’s been through a couple of focus groups. I know a hell of a lot of young designers and none are producing this deliberately bad/“ironic” work. But it does remind me experienced designers who set type with light monospaced fonts, or weird sans fonts, at 8 points or less, just to show how cool they can be when they aren’t working for those terrible overbearing clients who expect them to set readable type.</p>
