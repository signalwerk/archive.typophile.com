  html: |-
    <p>I have the budget to buy a text font for a new art book project and looking for advice on a readable, modern sans. The subject is the art of the 20s but I am NOT looking for something overtly deco. On the other hand it should be appropriate and not too contemporary in feel. It should be simple, formal, classic and, as mentioned above, readable in small point sizes (notes, captions). The book has a lot of text.</p>
    <p>Among the fonts I already have I'm considering Neutra, Seria Sans and Verlag, but those all have very small x-heights. I'm definitely open to suggestions and would love to work with a new font.</p>
    <p>Oh and open type preferred. There will be fractions.</p>
  html_clean: |-
