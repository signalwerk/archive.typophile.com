    html: <p>I thought I knew Zapf's work and had no idea that Zapf had done a straight-ahead sans. I guess I was mislead by reading the information on the Linotype site, as Linotype obviously doesn't own this design. Also Frutiger's statement "Hermann ist nicht ein sans Mensch." And I was underwhelmed by his recent informal Palatino sans, and wrongly concluded that he hadn't ever done a normal sans. But this has a lovely rhythm to it.</p>
