  html: '<p>Hyperfoundry Apollo 26 announces its second retail release, Flame N Skull, a Mini Design Kit that is instantly downloadable after payment confirmation. Flame N Skull features two fonts from the Typophile forums, Sotoflame and Motorpsycho, and 70 pieces of .eps art. The regular price is $49, but current customers and early birds can get it for $19 for a limited time.  <br> <br>To preview the kit, see our site, <a href="http://www.apollo26.com/" target="_top">http://www.apollo26.com/</a>  <br> <br> <br>Thanks,  <br> <br>:: the Apollo 26 crew</p>'
