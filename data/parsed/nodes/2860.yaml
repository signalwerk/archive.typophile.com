    html: <p>Hi, <br> <br>This is a very nice first effort, if I read your post correctly. It appears that your Uppercase "S" is falling over to the right. The lowercase "g" seems too wide and the bowl is too large. I would give the "a" and "p" more space where the top of the bowl meets the vertical stroke. There also appear to be some spacing issues, the uppercase "P" for example.  Otherwise, a very nice start. Reminds me a little of Antique Olive.</p>
