    html: "<p>I think this is a solid font. Many places though the curves need polish. And the weight is off: too dark for a Regular and a bit light for a Bold. Unless the intention is setting small text (~7 point), in which case the color is fine for a Regular, but then the spacing is a bit tight overall. <br> <br>hhp <br></p>"
