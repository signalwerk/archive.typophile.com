    html: <p>Univers is a further departure from the original 19th-century models. Helvetica is essentially a 19th-century grot cleaned up and sanitised for modern consumption. It's very monoline, the letters are very unified in shape and width. Univers takes the model and adjusts the widths, stroke contrast, curves and aperture to be more clean, soft, simple, and truly modern. If you compare Univers with AG or other older grotesques, it looks visibly newer. Unlike Helvetica, Univers has letters of more classic roman proportions; compare R, A, S, E, B and D between Helvetica and Univers to see this proportion modulation. Helvetica is nearly monospaced in its width consistency. Helvetica's apertures are more closed, most notably in c, a, S, C and e. Oddly, while Univers is as squarish as Helvetica, its higher stroke contrast relieves what in Helvetica is a blocky and heavy appearance. Univers is a more evolved design; Frutiger completely adapted it for 20th-century use. More important than all of these, Univers is spaced for text, which immediately makes it more suitable for small sizes.</p>
