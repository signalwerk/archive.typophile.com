      <p>Type represents the technology of its day.<br>
      Arial is a revival of Helvetica, which in turn is a revival of Akzidenz Grotesk, a 19th century letterform.<br>
      Helvetica has the shape of steam engine boilers and cast iron machinery.<br>
      Univers, on the other hand, has the "supercurve" (as Zapf termed it, and also used in Melior) of the CRT, the TV screen. This is more obvious, even, in Frutiger's original drawings. Novarese's Microgramma/Eurostile, is the most CRT-shaped face.<br>
      But ultimately, all those types still have a lot of lead in them, in particular that means quite subtle spacing (despite complaints about Helvetica as a text face).<br>
      More recent developments in type design take their sources from other media, less finely spaced than print. For instance highway signage (Interstate, DIN) typewriters (Officina), neon, and low res monitors. So now the vertical linearity of 'l' and 'i" become problematic, hence emergence of "some serifs" (to use the Berlow term) in sans faces, because these features help to moderate letterspacing.</p>
