      <p>Interesting thread, everyone.</p>
      <p>re: Brunel, I recommend a superb book called <em>The Great Iron Ship</em> by James Dugan (New York: Harper &amp; Brothers, 1953) that describes Brunel in loving detail as he worked on his masterpiece, the <em>Great Eastern</em>, which laid the transatlantic cable. Of course he did so much more than that, including railway right-of-way design,  Temple Meads Station, bridges, and so forth. One cool cat.</p>
      <p>Nick so rightly plants Helvetica's roots in the 19th century. Has anyone come across a comment that 19th-c. types wanted to express a kind of egalitariansim that was increasingly present in a society that was moving from industrial revolution into a time with much more social consciousness? It is so instructive to see a line of Helvetica set in A/C compared to something like Syntax or Penumbra, in which the allegedly desirable trait of all letters being "equal" actually reduces legibility and recognition of individual identity. I have the feeling that I read this perhaps back in early 70s when I first started getting passionately interested in type, but for the life of me I can't remember where.</p>
      <p>Although HZ may refer to that meeting point between a square and a circle as "supercurve" I think we have to give credit to Gabriel Lamé and Piet Hein. Apparently there is some controversy as to whether HZ came up with the idea in Melior on his own, or if his abiding interest in things mathematical may have led him to see the work of these others at an earlier time, perhaps filing it away sub-consciously.</p>
      <p><a href="http://en.wikipedia.org/wiki/Gabriel_Lam%C3%A9">http://en.wikipedia.org/wiki/Gabriel_Lam%C3%A9</a></p>
      <p><a href="http://www.oberonplace.com/products/plotter/tutor/lesson2.htm">http://www.oberonplace.com/products/plotter/tutor/lesson2.htm</a></p>
      <p>I don't get to come here as much as I would like to, but boy oh boy does Typophile give me good brain food! Not that everyone will read it in this one thread, but I hereby thank all of you for your curiosity, your wide-ranging interests, and your willingness to set them down in type for the rest of us to read. Great, great stuff.</p>
    html_clean: |-
