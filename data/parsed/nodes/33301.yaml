      <p>The choice to use which face in the number discussed above: it's almost spiritual. </p>
      <p>Helvetica reminds me of the airport signage of my youth, riding with my parents in a 707. Univers reminds me of the space program reaching out for the moon. Akzidenz Grotesk brings back the revelation from design school days when I discovered it was older than most sans-serif faces. Microgramma reminds me of space movies of the 1970s searching for space-age fonts to apply to sets and props.</p>
      <p>To employ any of them in a specific design is like throwing the I Ching and becoming a typographical oracle. Helvetica's a little more voluptuous, Univers is a little more graceful, Akzidenz is a little more direct.</p>
      <p>But then, I'm a positivist: I think just about every typeface is beautiful, if it can find the proper design environment in which to exist.</p>
