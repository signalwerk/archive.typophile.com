      <p><em>arial was created to try to beat helvetica for windows platforms, not to renew it,</em></p>
      <p>I used the term "revival", which is a quite specific typographic euphemism. "Renew" has a more general meaning.</p>
      <p>In other design areas, what we call revivals are often termed reproductions or imitations.</p>
      <p>Adrian Frutiger created Univers from scratch -- starting with original drawings.</p>
