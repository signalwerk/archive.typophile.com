    <p>I'm pro-<a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> and have quite a bit of experience using it, and I haven't used <a href="/node/13516" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Univers</a> much. But lately I've seen things designed with Univers that look great. Does anyone have any thoughts on comparing the two? Univers seems to have slightly more personality /warmth/elegance, but maybe that's just because it seems "newer" to me (since I haven't used it much). </p>
    <p>Thoughts?</p>
    <p>Thanks.</p>
