      <p>Arial is not a revival of Helvetica.</p>
      <p>According to Mark Simonson Arial seems to be an adaptation of Monotype's grotesque series made by Birmy to match Helvetica's spacing so it could be substituted without disrupting a document's text flow. </p>
      <p>Microsoft adopted Arial instead of Helvetica because of licensing and price issues but Microsoft didn't create Arial.</p>
      <p>All this I learned at Mark Simonson's "The scourge of Arial".</p>
      <p>Héctor</p>
