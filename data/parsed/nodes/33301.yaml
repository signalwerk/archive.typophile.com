      <p>"For the sake of the argument, why not choose a typeface based on a philosophical stance?"</p>
      <p>The issue is wether the nature of the typeface chosen contributes to the communication of the printed piece it is used for. If it does, then it is a good choice (there may be several good choices possible). The attributes of the typeface being judged center around the needs of the target audience and the message being conveyed. The personal philosophy of the person who decides on the typeface is at best irrelevant in the "Audience, Purpose, Message" triumvirate of determinants. In some cases of coincidence, the type specifier's philosophy may echo that of the intended audience but this is not likely.</p>
      <p>As an example: Assume some graphic designer was given the job of designing a poster for a joint presentation by Massimo Vigneli, and Josef Mueller-Brockmann. In this case, using Helvetica would be a fine choice of a typeface. If the designer were forbidden from doing so based on his bosses' philosophy of only using brush scripts, it would be just silly. That is not to say that it would now be impossible to do a proper poster--it would just interject an unneeded hindrance.</p>
    html_clean: |-
