      <p>James, what are your feeling about the new Univers compared with the old?</p>
      <p>Knockout: strikes me as exemplifying hands-on engineering (which will make ad hoc adjustments to optimize the efficiency of each part) rather than the smoothly consistent systematic exigesis of design principles, and in that is characteristic of the 19th century.</p>
      <p>You see that still in Helvetica, where the "a" has a foot serif in the light weights, but not in the bold. </p>
      <p>Two references to support this view of the Victorian engineer: Brunel working himself to death on the details of his huge projects, because the appropriate infrastructure of a large engineering firm had yet to be developed; and Maudslay, inventor of the bench micrometer, the "finest man with a file" (sorry, can't find the exact quote), very much the craftsman.</p>
    html_clean: |-
