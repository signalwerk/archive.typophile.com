      <p><img src="/sites/default/files/old-images/telefunken_rfb-t2_4688.jpg"></p>
      <p>Telefunken, 1939: the first "rectangular" CRT.<br>
      Prior to that, TV tubes were round, but had a "landscape picture format" viewing area cropped onto them.<br>
      Similarly, cameras crop the circular image from a camera lens into a square film format -- so the new media, cameras and then TVs (and computer screens), adopted the traditional image-display shape.</p>
      <p>The cartouche shape goes back to Ancient Egypt (Ramses era):<br><img src="/sites/default/files/old-images/Ramses_6086.jpg"></p>
      <p>...and an oval shape was used for the traditional Japanese fan (here, 1808):<br><img src="/sites/default/files/old-images/toyokuni_i_1808_fan_4741.jpg"></p>
      <p>These in themselves are quite specific and different ellipses.</p>
      <p>IMO, the super ellipse emerged as an intriguing, recognizable shape about 70 years ago, a compromise because it was impossible to blow a square glass tube. This compromise shape had a cachet of style and glamour, representing the leading edge of technology.</p>
      <p>This shape was then adopted by furniture makers and type designers, cross-over.<br>
      Alessandro Butti and Aldo Novarese were the first to thoroughly base a type design on the super ellipse CRT, in 1952.<br><img src="/sites/default/files/old-images/TV_6359.png"></p>
      <p>Interestingly, Adrian Frutiger's working drawings (I recall seeing them in a small paperback monograph) for Univers show much more super-ellipse than in the finished item.</p>
    html_clean: |-
