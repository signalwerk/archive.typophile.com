    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/track_kern_2.png"></div><p></p>
      <p>* reduced size of "K E R N" very slightly<br>
      * reduced weight of "T R A C K" by colorizing instead of changing the size. Color has weight. Black is the heaviest "color", green and cyan-blue are about medium weight, and yellow is the lightest. The huge trend for a long time now has been to be a gray whore. Gray is nice but I think a lot of designers get carried away and make gray elements too light. Red seems the right weight to balance "T R A C K".</p>
      <p>* grayed the ampersand and colorized it subtly with hue 28 to make it warm</p>
      <p>* grayed and colorized "K E R N" to suit.</p>
      <p>All these warm colors give the logo a shade more humanism. Not sure if that's in line with what you're aiming for.</p>
      <p>j a m e s</p>
