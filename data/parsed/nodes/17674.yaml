      <p>I think you have selected some elegant typefaces and I like that you were able to register the domain name. </p>
      <p>The primary issue that strikes me is one of balance. The longer word "TRACK" on the left shifts all of the weight left. So, I would suggest playing with scale and positioning of the words to prevent one side from appearing heavier than the other. </p>
      <p>The second issue is also one of balance, in a way. The ampersand is a very nice ampersand, however it is somewhat heavy and overbearing, especially considering that the words "TRACK" and "KERN" carry more meaning. I would suggest adjusting the opacity of your ampersand to enable the other words to increase in heiarchy. </p>
      <p>Attached is a JPG of one way you might aproach it.</p><div class="imageWrap"><img src="http://typophile.com/files/help.jpg"></div><p></p>
