    <p>I am desperately in need of help on resolving the kerning with this composition. I have been at it for weeks now, and been through about 60 faces. If you are interested it would be greatly appreciated. A brief synopsis of the project follows:</p>
    <p>Going to be used as my personal identity, long story short, i bought the domain recently, for it was strangely available. Current typeface is Perpetua, as it seems to lend itself best to letter-spacing of the faces that I have tried thus far. Also it contrasts nicely with the ampersand. The problems are obvious, and I have tried many things to fix them. The top example is an unaltered example of the font, without any alterations to the characters themselves. The bottom example has been altered so that all letters have the same width, minus the "E" and "N", for they are either too small or too large to be altered without destroying them.</p>
    <p>I can only hope that some of you will be interested in sharing your advice, and I will also post a link to a file that has been outlined, which you may alter and then repost if you like, this would be awesome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/help.gif"></div><p></p>
    <p>link for downloadable file- <a href="http://stu.aii.edu/~mdg272/help.ai" title="http://stu.aii.edu/~mdg272/help.ai">http://stu.aii.edu/~mdg272/help.ai</a></p>
