    html: |-
      <p>Thanks William for the informative links.</p>
      <p>1. According to PM5.5ME manual:<br>
      Developed by Aldus Corporation in 1985 + Copyrighted by Adobe in 1993.</p>
      <p>2. Yes, it is possible to make footnotes in 2+columns with PageMaker manually. But not with 2 linked text frames. Here is how:</p>
      <p>Assuming page size = 1, Top = Bottom margin = Zero<br>
      1. Make 2 separate files: footnotes-Only (F.pm) + Body-Only (B.pm).<br>
      2. Typeset the 2 files in the appropriate styles using the same page setup,<br>
      in such away that if B.pm uses G-Q then F.pm must use R-Z styles.<br>
      3. Find the F/B = Number of pages in F.pm/Number of pages in B.pm.<br>
      Then:<br>
      4. Make New.pm with same page setup + all the styles used in the 2 files.<br>
      5. Resize the page so that Bottom margin = 1-F/B and copy/autoflow B.pm<br>
      6. Resize the page so that Top margin = F/B and copy/autoflow F.pm.<br>
      7. Resize the page to back to 1.<br>
      8. Go pagemaking.</p>
      <p>Have been doing it for the last 14 years with bulky books of lengthy footnotes.</p>
