      <p>&gt;the “ME” part </p>
      <p>That means InDesign Middle East, and it does right to left languages--Arabic, Farsi, and Hebrew. It turns out that the left to right coding is down at the bottom of the program, so the whole thing has to be rebuilt to do both r-to-l and l-to-r text. This is done by the French company Winsoft. </p>
      <p>John Hudson, who is a position to know, has said here on Typophile that it is very well done and stable. </p>
      <p>Aziz, as far as typography, for European languages InDesign has not only Open Type processing, but also things like the paragraph composer and hanging indentation in the margins, which I don't believe exist in PageMaker. I don't know whether these are of any use for Arabic typesetting.</p>
