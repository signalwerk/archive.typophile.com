      <p>William, there are excellent reasons still to use PageMaker; for example, by default, it automatically tracks type according to point size, a useful trick neither Quark nor InDesign yet have -- inexplicably. I personally find it a much easier and more useful program to run. Whereas I would probably not set a book in it today, I would not dream of importing the workflows I already have in PageMaker to another program. Although it is tottering towards the grave, it still performs wonderfully well; in fact I gave it a special 'iWard' in MacDirectory last year. I know several designers who have every program there is, and no financial problems, who still use PageMaker for preference. It's a great program!</p>
      <p>InDesign's 'fine typography' features, such as hanging indents, paragraph composition, and 'optical kerning' are so badly implemented, still, after all these years, that they cannot, still, be recommended for fine typesetting. Even Ventura does hanging punctuation better. </p>
      <p>I had some hopes that CS3 would bring some substantial improvements in this regard but from what I hear so far, my hopes are to be dashed. It's really a pity that Adobe has not considered it worthwhile to improve these important features, but it is abundantly clear that nobody outside of the type design community is interested in them. That's just as well, since they don't work as they should.</p>
