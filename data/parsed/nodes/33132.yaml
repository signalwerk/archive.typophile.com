      <p>I haven't used PageMaker for a while--it also has been owned by Adobe since 1994!</p>
      <p>In MS Word go to format/columns and choose 2 columns. Then with your cursor at the place you want to put the footnote go to Format/Reference/Footnote and press enter. </p>
      <p>Word will then put a footnote number both in your text and at the bottom of whatever column the cursor was in. You can format the footnote further by highlighting the text of the footnote and going again to the 'format' menu.</p>
      <p>This works in English, I don't know about Arabic.</p>
