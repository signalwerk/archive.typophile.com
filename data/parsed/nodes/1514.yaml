    html: "<p>Thomas, that's probably the fullest and most decent answer about MM I've ever heard - thanks. <br> <br>&gt; So they were not sold by Adobe at prices that <br>&gt; came anywhere near reflecting the work that <br>&gt; went into them. <br> <br>Exactly. <br>And this comes back to what I myself have always thought about MM: they needed to be priced much higher, because it's a specialist tool. You would have made far fewer sales, but at least the power users would have made it worthwhile. And it would have given \"regular\" users something to look up to. <br> <br>So why were they sold for so cheap? I think it's because corporations these days aren't very interested in making a little bit of money over time - their shareholders want that yaght, and they want it <i>now</i>. So the consumer was optimistically seen as being typographically highly sophisticated, while -as your research shows- some of them might buy the stuff because they think it'll make them better, but few of them will actually use the high-end features. Like smallcaps. <br> <br>I think too much was expected of the consumer, hence MM, and it wasn't the cash cow Adobe required. <br> <br>hhp <br></p>"
