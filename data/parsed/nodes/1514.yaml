    html: <p><i>...a major product earns 100s of millions of dollars a year. The entire type industry doesn't pull in that kind of money, and I doubt it every will.</i> <br> <br>You're absolutely right. I have difficulty thinking in numbers that large! When you said "Big money", I was thinking of the potential revenues (e.g., $99 faces) versus what they actually are ($19/shareware/free) - where we feel there is a huge gap. This gap is "big money" to type designers, and struggling foundries, and distributors like us - but wouldn't accumulate to anything approaching application software profits. <br> <br><i>It's as if you had the acting profession without major studios and blockbusters.</i> <br> <br>An apt analogy. <br> <br>I understand Adobe's "follow the money" approach - it's just good business. So the discussion is not really about "tiny type groups within large software companies", but about niche technologies/products being lost in corporate conglomerates - an inherent problem of free-market capitalism. <br> <br><i>Would you *like* it if Adobe spent another $5+ million a year on marketing Adobe fonts?</i> <br> <br>Hmm, perhaps not. But I could recommend a good company to outsource some of that expenditure to... ;-) <br> <br>Thanks Thomas. <br> <br>- Jon Parker</p>
