    html: <p>Well, not necessary in the way that food is necessary, and not fresh in the way that air is fresh <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>From the perspective of much contemporary design practice, though, in which type and layout contribute to 'brand identity', immediate visual distinction is very important. Sans serif types contribute more obviously to such distinction because there are used larger, are set apart from text in headings, subheadings, etc. and are more likely to appear in colour. You can set the text of half a dozen different publications in the same serif text face, and can still visually distinguish them by using six different sans serif types. If you use the same sans type for all six, you will not obtain the same degree of visual distinction by varying the text face. Another way of putting this is that sans types are made and used to be noticed, while serif types are more often doing that crystal goblet thing.</p>
