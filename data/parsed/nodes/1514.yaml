ry doesn't support your argument that free fonts now results in a desire for better, more exotic fonts later. We've had a decade of font giveaways. But just look at what's on the street, and what's on the best-seller list at Myfonts.com -- it's all classic mid-20th century sans serifs that people are buying, not 21st century typefaces from contemporary designers.  <br> <br>What is it with the ubiquity of Trade Gothic and Helvetica? Why do the majority of typographers have such an aversion to the work of contemporary type designers? Can you imagine the same situation in music (all the songs 50 years old)? <br> <br>It's a little too easy to say that fonts are not a consumer product, and that designers' tastes are naturally conservative. I would say that the present day utilitarian, stagnant aesthetic is a direct result of the giveaways by the software giants.</p>"
