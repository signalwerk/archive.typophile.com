    html: <p>Right now, one can freeze-dry MM instances into Type 1 using $550 FontLab or $99 TransType. One can also have a FontLab .vfb file that contains both MM axes and OT features; it can generate freeze-dried MM instances as .otfs. <br> <br>So what if Pyrus, Letterror or somesuch could license a tool that allowed a font vendor to distribute an executable that takes MM .vfb data and outputs some user-defined instance along those continuous axes? Expert users could rightly pay a premium for such a capability that would give them the best of both worlds. You still might not have the automatic optical scaling in apps that some people seem to want, but at least the end-user could select precisely what values along each axis he or she wants. The code already exists, it would essentially be FontLab with a narrowly restricted UI. <br> <br>Then some MM enthusiast could buy some hyper-exclusive instance-generator version of a font. Call it something like "Minion Supreme." No MM format needed. Might that be a reasonable compromise?</p>
