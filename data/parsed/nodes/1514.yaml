    html: <p>First, I simply want to remind people of the historical order of events in the evolution of font pricing. Microsoft put serious downward pressure on font prices with their mass market "TrueType font packs" for Windows. Corel was then bundling hundreds of fonts with CorelDraw. Adobe then started bundling large numbers of fonts with Adobe Illustrator, and that number increased as a direct result of the ongoing battle in the drawing program market. Bitstream's licensing of over 500 good quality fonts to Corel (partly replacing much inferior ones from Corel) was a key move in this ongoing struggle. <br> <br>In recent years, as I've mentioned previously, there has been a dramatic *decrease* in the number of fonts Adobe bundles with applications. I'm sorry if that conflicts with anybody's world view. <br> <br>I don't mind sharing that this occurred for two main reasons. One is that we are aware of the effect on the market for retail fonts, which is after all biggest on the demand for our own fonts. Another is that the competitive pressure has eased (although Corel has increased their their bundled fonts until they had over 1000 fonts, they no longer have very large market share). <br> <br>Second, I will simply point out that Adobe has a history of maintaining retail prices, despite continuous undercutting from other foundries who we cross-license with, such as Agfa Monotype. <br> <br>I am in no way trying to suggest that Adobe's corporate behavior in font bundling and pricing is saintly or better than everyone else's. But painting Adobe as the primary actor in the decline of demand for fonts is absurd.  <br> <br>Contrariwise, in terms of change in the status quo, Adobe has done more than any other single company to maintain or improve the situation in the last few years. Dramatically reducing our numbers of bundled fonts, and trying to move the industry to a new format are both moves that should help increase the demand for fonts. <br> <br>Finally, I understand that this whole area of discussion is a sensitive and personal issue for many of those involved in the discussion - myself included. Unfortuantely, I am starting to think the insult level may be getting too high for me to continue participating in this discussion. "Tawdry"?! No matter how bad I think some foundry's designs are, that's language I would not use to discuss people's work in a public forum, and certainly not in discussion with people from that company. <br> <br>T</p>
