    <p>Nick, for my further understanding, if you (as a type designer) could afford to "dump" your fonts onto students (who in turn would then know your fonts names and foundry name) would you? I'm just trying to grasp this concept, this dumping as a bad thing. <br> <br>Is Adobe then the enemy to small foundries because they can afford to get students used to their name and their type?</p>
