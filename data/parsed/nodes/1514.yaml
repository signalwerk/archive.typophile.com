    html: "<p>Jon: When I said there was no big money to be made in type, I meant that in two ways.... <br> <br>First, in a relative sense. In the software industry, which I consider type to be a part of, a major product earns 100s of millions of dollars a year. The entire type industry doesn't pull in that kind of money, and I doubt it every will. I'm not saying there's no money to be made in type, but you could put all the type revenue in the world together and not come close to the revenue of any one of the top half dozen publishing/graphics applications. <br> <br>Second, in an absolute sense, there are very very few people alive today (if any) who have made themselves filthy rich by creating and/or selling fonts. A few of us are lucky enough to earn a pretty comfortable living, but even we are the minority.  It's as if you had the acting profession without major studios and blockbusters. <br> <br>Now that being said, I have no doubt that Adobe could increase its type revenue (and to a lesser degree profits) substantially by devoting more resources to marketing. I doubt there's anybody in the type group here who doesn't wish that we moved in that direction. But the same factors that insulate us from certain financial pressures give us other areas of emphasis. <br> <br>On the other hand, I would think that's something other foundries would be happy about. Except for those of you who get royalties from Adobe, would you *like* it if Adobe spent another $5+ million a year on marketing Adobe fonts? <br> <br>Cheers, <br> <br>T</p>"
