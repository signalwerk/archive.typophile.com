    html: <p>Speaking for myself, I always have the feeling that, while here are basically 10 preferred fonts for me, I try to give every new job or client a unique typeface, I had a situation where I had two clients with FFLetterGothic and almost died of boredom, especially as it is a somewhat limited typeface. I think you can do lots of jobs with, say, just ONE typeface -- Helvetica has proven that and Garamond would be another example :-) -- but I prefer to find something special for every client. So I'm really happy with having more and more sans and nowadays also more modern serifs that are all quite legible and clean but also have little details that differntiate them. The client rather often even does not notice this at all, but to me it makes a heck of a difference in the </p>
