    html: "<p>Nick (post #71) <br> <br>I agree with you, I agree that perhaps design has been homogenized by the fonts that have been bundled with the different software apps. But, I can't agree that it is any specific foundries fault. It is the fault of the designer's and agencies and studios that use these bundled fonts. After all, the fonts were \"dumped\" on them. They don't have to use them.  <br> <br>I refuse to believe that more designers, whom appreciate the fonts that are bundled, don't also buy other type. Maybe I have too much hope and too much faith in the design world.  <br> <br>And this brings me to ... <br> <br>Nick, your talk about Helvetica at ATypI was great. Yes, you have dampened my spirits by making me admit that their is a bit of an helvetica problem. It is a sad state of affairs and the finger should be pointed at designers (dumpees) and not the software companies (dumpers).  <br> <br>Doesn't it come down to education (yet again). Educating the corporations and the masses. Nick, your Helvetica talk should be printed in Forbes or something like that. Educate the guys at the top. Wouldn't that be interesting. Get the suits saying things like, \"helvetica sucks, I want Brown!!\"</p>"
