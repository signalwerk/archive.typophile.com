    html: "<p><i>I really wonder why Sans are always in top ten in Foundries?</i> <br> <br>I suspect it is because of the way in which sans types are used in design: in heads and subheads, they contribute more to the immediate visual impact of a design than the text face, so a greater number and variety of sans types are necessary to maintain freshness in design. This encourages designers to keep buying new sans types, while they can generally get by with a smaller number of serif text faces.</p>"
