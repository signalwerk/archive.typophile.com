    html: <p>&gt;Actually, the MM *fonts* sold well,  <br>Good to hear, I loved that format and was quite saddened to see it fade away. Luc(as) de Groot recently wrote to me, tnat he still uses the MM technique sometimes to create fonts and interpolations.  <br> <br>&gt;problems there were with output  <br>Never really had any, but it was unpractical. If an outputter demanded open files with fonts, it was a pain to collect them all. With PDF, I've done a couple of MM jobs, no problem at all. I still use all MMs I bought and like them a lot. I think a mix of on-the-spot-MM in InDesign embedded within OTF would be pretty nice.  <br> <br>&gt;anti-TrueType sentiment <br>That probably stems from the fact that TT is the No-1 shareware format, and those fonts aren't always well-hinted or even well-built. TTF is superb for some things, not so good when it comes to actually outputting PS code, although even that works pretty good today. What bothered me more was another Beta/VHS/Video2000 War.  <br> <br>SuperPublisher sounds like a neat program. Good to hear that Adobe is finally cxoming up with good catchy names for their warez.  <br> <br>&gt;pretty much an Adobe-only game  <br>And I think Adobe can live with that quite well, as it gives InDesign an edge over Quark. And after years of suffering with Splendid-Isolation-XPress, I think that anything making them sweat is good indeed. Good to hear that they finally come around. When Macromedia and Microsoft also support Pro-OTF, all is well. All in all I think, so far it went pretty smoothly from TT/T1 to OTF. I'd only wish there were more Pro-Fonts. And that the online shop had a very clear differentiation between regular OTF and Pro-OTf (but I haven't looked there in quite a while, so maybe that is the case now...)  <br> <br> <br> <br></p>
