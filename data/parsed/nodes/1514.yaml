  - id: 12183
    user: 2021
    date: 2003-10-09T09:50:00
    date_raw: 9.Oct.2003 9.50am
    votes: null
    html: "<p>Thomas, HD: <br> <br>The \"market of millions\" I refer to is professional graphic designers using Type 1 fonts on Mac computers, in Photoshop, Illustrator, and XPress, for print. <br> <br>Freeware, shareware, piracy, Corel, Bitstream, and pre-installed fonts are not the issue. <br> <br>The fact is, the mainstream of graphic designers have gotten the bulk of their quality design fonts for free, since Illustrator and Photoshop were shipped on CD, starting around 1992. The bulk of these fonts have not been contemporary, or classic. And this has been reflected in the often tawdry appearance of type culture. <br> <br>I've been upgrading Photoshop and Illustrator for a dozen years, and acquired a wealth of fonts in the process. Some of them are classic (eg Adobe Garamond and Berthold Bodoni, with expert sets), but most are, if not tawdry, then pretty wack. When I'm on the street and see widespread indiscriminate use of certain ITC fonts that I acquired free with Adobe upgrades, it's too bad that the typographers involved didn't buy their fonts instead. Perhaps they would have chosen something contemporary, more expressive of where we're at today, more supportive of today's type designers. <br> <br>However, they may have bought an old sans serif face that \"the customers want\" or \"just seem right\". This present day conservatism is a complex issue, but is connected to the dominance of media by a small number of corporations. <br> <br>I'm not painting Adobe as evil, it's a progressive company with amazing products, and its employees have the best of intentions. <br> <br>Would the Microsoft-Adobe initiative on OpenType have happened if Adobe didn't have a type division? I don't know. However, if Adobe didn't have a foundry, perhaps I would have been making OT fonts for several years with Adobe Fontographer! <br> <br>I never could make MM fonts satisfactorily with Fontographer, few could, and the consequent lack of typeface diversity dealt the biggest blow to the format. <br> <br>Adobe Fontographer -- Bring it on! <br> <br> <br> <br> <br> <br></p>"
