    html: "<p>Actually, the MM *fonts* sold well, but our research showed that most users only used the default instances and never made custom instances. For them, we would have made their lives easier if we sold them separate fonts with nice clear names. <br> <br>Where MM failed was in the Adobe type group not realizing that they needed to put huge amounts of energy into evangelizing the applications and UI people. So it was a failure of *internal* marketing. We foolishly thought we could just build a better mousetrap. But the reality was quite different. <br> <br>As far as the effects on the font market, MMs were not helpful. It was difficult to explain the value proposition to customers. \"Yes, I know there are only two font files, but they recombobulate into a couple of dozen fonts, so that's what you should pay for!\" That was not a line that went over very easily, and was not seriously pursued for long. So they were not sold by Adobe at prices that came anywhere near reflecting the work that went into them. <br> <br>That being said, Adobe's type group learned a lot from the MM experience. We knew that with OpenType we would have to work our rear ends off to explain the benefits to our own application people, and market it heavily internally. We did exactly that, with the result that we had more support for specific features of OpenType when the first fonts shipped, than we got for MM fonts in ten years. We learned from our mistake, and I think it's pretty clear now that OpenType is being successful as a result. <br> <br>On a similar vein, whatever problems there were with output or compatibility of MMs in the professional publishing industry appear to have largely been exaggerated and issues of unreasoning leftover prejudice from very early problems (much like the anti-TrueType sentiment). However, unlike TrueType, I can't be completely sure that's true.... <br> <br>The reason that I don't know is that Adobe did not handle it well. So, to do better with OpenType (one of my small contributions to the OpenType strategy) we said, let's track this stuff as best we can, document every single significant problem we know of, and make it a public document: the OpenType readme. Then if people say \"but I hear this font format doesn't work with SuperPublisher\" we can look and say \"well, there was this one problem with SuperPublisher 3 and earlier, but here's the workaround, and in any case there's no problem in SuperPublisher 4 and later.\" <br> <br>Anyway, there were a bunch of reasons MMs didn't make it. But we're aware of those reasons, and trying to avoid every one of them with OpenType. <br> <br>Finally, it's true that the advanced features of OpenType for western languages are pretty much an Adobe-only game right now. But this will change within a couple of years. Juergen Kurz (Tim Gill's replacement at Quark) told me at Seybold that QuarkXPress 7 will support both Unicode and OpenType layout goodness. Good for them, and it's about time they at least went to Unicode. There is another *huge* non-Adobe application just starting to plan OpenType support right now; I'm supposed to be meeting with the product manager in a week or two to discuss it. (But that one is confidential.) <br> <br>I am sure we won't give Quark the kind of direct help we do with other type foundries, but along with everybody else, we're helping answer their constant questions about OpenType layout and how to build an OpenType text engine on the OpenType mailing list, and I offered to send them a copy of Font Folio OpenType Edition for testing purposes when I was talking with Juergen. <br> <br>Too bad we're so evil.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>T</p>"
    html_clean: "<p>Actually, the MM *fonts* sold well, but our research showed that most users only used the default instances and never made custom instances. For them, we would have made their lives easier if we sold them separate fonts with nice clear names. <br> <br>Where MM failed was in the Adobe type group not realizing that they needed to put huge amounts of energy into evangelizing the applications and UI people. So it was a failure of *internal* marketing. We foolishly thought we could just build a better mousetrap. But the reality was quite different. <br> <br>As far as the effects on the font market, MMs were not helpful. It was difficult to explain the value proposition to customers. \"Yes, I know there are only two font files, but they recombobulate into a couple of dozen fonts, so that's what you should pay for!\" That was not a line that went over very easily, and was not seriously pursued for long. So they were not sold by Adobe at prices that came anywhere near reflecting the work that went into them. <br> <br>That being said, Adobe's type group learned a lot from the MM experience. We knew that with OpenType we would have to work our rear ends off to explain the benefits to our own application people, and market it heavily internally. We did exactly that, with the result that we had more support for specific features of OpenType when the first fonts shipped, than we got for MM fonts in ten years. We learned from our mistake, and I think it's pretty clear now that OpenType is being successful as a result. <br> <br>On a similar vein, whatever problems there were with output or compatibility of MMs in the professional publishing industry appear to have largely been exaggerated and issues of unreasoning leftover prejudice from very early problems (much like the anti-TrueType sentiment). However, unlike TrueType, I can't be completely sure that's true.... <br> <br>The reason that I don't know is that Adobe did not handle it well. So, to do better with OpenType (one of my small contributions to the OpenType strategy) we said, let's track this stuff as best we can, document every single significant problem we know of, and make it a public document: the OpenType readme. Then if people say \"but I hear this font format doesn't work with SuperPublisher\" we can look and say \"well, there was this one problem with SuperPublisher 3 and earlier, but here's the workaround, and in any case there's no problem in SuperPublisher 4 and later.\" <br> <br>Anyway, there were a bunch of reasons MMs didn't make it. But we're aware of those reasons, and trying to avoid every one of them with OpenType. <br> <br>Finally, it's true that the advanced features of OpenType for western languages are pretty much an Adobe-only game right now. But this will change within a couple of years. Juergen Kurz (Tim Gill's replacement at Quark) told me at Seybold that QuarkXPress 7 will support both Unicode and OpenType layout goodness. Good for them, and it's about time they at least went to Unicode. There is another *huge* non-Adobe application just starting to plan OpenType support right now; I'm supposed to be meeting with the product manager in a week or two to discuss it. (But that one is confidential.) <br> <br>I am sure we won't give Quark the kind of direct help we do with other type foundries, but along with everybody else, we're helping answer their constant questions about OpenType layout and how to build an OpenType text engine on the OpenType mailing list, and I offered to send them a copy of Font Folio OpenType Edition for testing purposes when I was talking with Juergen. <br> <br>Too bad we're so evil.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>T</p>"
