    html: <p>Print shops also tended to be wary of MMs, similar to their suspicion of TrueType -- a legacy suspicion from a time when many RIPS choked on TT. When MMs first appeared on the scene, most printers refused to accept them, so I steered clear of them altogether, reserving MM and TT for desktop-production jobs only.  <br> <br>Printshops are often the "lowest common denominator" that defines the parameters of a job. That makes sense in theory, except that printers also tend to be the most conservative and slowest to accept changes in technology. Hence, any new technology has to be sold to the production end of the chain if it's going to be taken up by the design end.  (I think that also explains why a lot of designers are hesitant to give up Quark for the vastly superior InDesign.)</p>
