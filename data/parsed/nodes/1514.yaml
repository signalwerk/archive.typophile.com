    html: "<p>&gt;Most of the better foundries, big or small, have found their niche <br> <br>And a niche is a small place. <br> <br>There is a potential marketplace of millions of software app users who aren't buying fonts, because they don't need to. <br> <br>These are the people now making their living as graphic designers, a 25-fold increase since 1985, when PostScript was introduced. (Figure from Adobe's \"Inside the Publishing Revolution\") <br> <br>The type culture we have has been homogenized by the massive giveaway of fonts: <br> <br>*System Fonts (Apple, Microsoft) <br>*Web fonts (Microsoft Core Web TrueType) <br>*Software application fonts (bundled with Adobe products) <br> <br>In each of these cases, fonts are necessary to make the do-hickey function, so that is why they have been provided.  <br> <br>The end result is a dumbed-down font culture dominated by retro (no royalty fees), and utilitarian fonts. <br> <br>Adobe killled the goose that laid the golden egg, in the early 90s. At that time (according to  \"Inside the Publishing Revolution\") there was a boom in font sales, so they probably didn't think that bundling scores of typefaces on Illustrator and Photoshop CDs would make much difference. (But they're still doing it with the CS.) <br> <br>The mostly-tawdry fonts they gave away (so as not to pay royalty fees) really infected font culture. I mean, that was the 1990s, did we really need to be defined by Gill Sans (1930) or Serpentine (1970)? Serpentine fulfilled the need for a techno/sporty typeface, so most typographers used it because it was on hand, rather than supporting contemporary type designers who provided the genuine article. <br> <br>Tiffany, I would say that the dominant position of Adobe is indeed a \"bad thing\" for font culture as a whole, because in so many instances, institutions and companies go for the big Adobe package, of undisputed value, rather than opting for something more contemorary and diverse.  <br> <br>HD, history doesn't support your argument that free fonts now results in a desire for better, more exotic fonts later. We've had a decade of font giveaways. But just look at what's on the street, and what's on the best-seller list at Myfonts.com -- it's all classic mid-20th century sans serifs that people are buying, not 21st century typefaces from contemporary designers.  <br> <br>What is it with the ubiquity of Trade Gothic and Helvetica? Why do the majority of typographers have such an aversion to the work of contemporary type designers? Can you imagine the same situation in music (all the songs 50 years old)? <br> <br>It's a little too easy to say that fonts are not a consumer product, and that designers' tastes are naturally conservative. I would say that the present day utilitarian, stagnant aesthetic is a direct result of the giveaways by the software giants.</p>"
