    html: "<p>Thomas: <br>You are a gentleman, AND you like Cambazola. Whatever else may be said about Adobe, I appreciate you candor and civility while dodging flaming arrows... and your taste in cheese. <br> <br>Everyone: <br>It seems to me there are 3 sources that can really influence perceptions about type: 1.software applications (who bundles what and how), 2.schools of design education, 3.industry award annuals. We've been talking about 1 at length in this thread. We've talked about 2 at some length in other threads. Number 3: <br> <br>Award annuals are sources of inspiration, places to take the pulse of the creative community, reflecting trends but also setting trends. They are browsed and studied time and again by young creatives. In school I was taught to value quality, classic type. I think (as has been mentioned) the quality fonts bundled with design software reinforced this, and established Adobe as a place that I could trust for decent fonts. However, I wasn't made aware of any of the alternative sources for quality 21st century fonts. It wasn't until I started feverishly pouring over design annuals looking for the x-factor :-) for my layouts that I got a taste for Emigre and FSI etc. The crazy thing is, Communication Arts, the gold standard annual in most US shops, has no type credits whatsoever! Mention the type! You want to raise awareness in the young creative community? Put it in lights next to Cahan Associates, Goodby, Duffy whomever.      <br>And while you're at it, write an article about type once in a while. Every non-annual issue CA includes a spotlight on a photographer, an illustrator, a design/ad agency. They show fresh talent in each of these areas. How about fresh type? </p>"
