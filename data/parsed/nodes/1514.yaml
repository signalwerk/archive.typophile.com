    html: <p>If you think Corel is an option to Adobe then listen to my tale. I got a great offer through NAPP for Corel Painter 8 and I sprung for it since that is how I was trained in school (as a painter) I got the application and in the manual under every caption under the pictures I saw the deadly error of sloppiness they didn't include the printer font or didn't open it or didn't imbed it with the PDF. But the point is they rushed the product to market and were sloppy. Who checked the manual? I am a member of a Corel Painter site and we have a wish list (of improvements) and its over 100 requests in how many months (not many), its bad enough that the product manager Rick Champaign is going to release Painter 8.1 at the end of the month addressing 20 issues with painter, so sad. </p>
