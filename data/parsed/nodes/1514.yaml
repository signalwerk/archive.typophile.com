    html: <p>I don 't think the type Adobe offers these days is really an enemy for other foundries. Most of the better foundries, big or small, have found their niche. From Emigre, FSI, Lucasfonts, Thirstype, Lineto and and and we have come to expect a certain brand, a certain flavour of typefaces. Adobe doesn't offer anything even close to Meta or Dax or Scala or Priori or CourierSans or TazIII or Thesis or Giacomo. They (and Linotype) have all the classics and you will turn to one of them for Trade Gothic or Helvetica or whatever, but by dumping Adobe-Style-Fonts Adobe thus only hurts itself. ALl in all, having fonts to experiment with will make some folks notice that typography is just as important a tool as photography or illustration is (maybe even notice that it is MORE important, actually) and they will want more. More Adobe, sure, but in the long run also some of stuff from the other foundries, and after a while even more stuff from these small and larger independents, as their product is not technically better but sometimes aesthetically more unique than what Adobe offer.  <br> <br>In some way, bundling fonts with their product Adobe is like a drug peddler offering cannabis to High School kids in order to maybe selling some more MJ later-on. If I were a dealer of pure hardcore Crystal Meth, I wouldn't worry about THAT at all... they're just doing free work for you. </p>
