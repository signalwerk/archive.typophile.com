    html: "<p>Nick: <br> <br>I don't see how separating Adobe's foundry business from its applications would help the problems you see one bit. Being separate companies hasn't stopped OS vendors and other application vendors from licensing and bundling hundreds (or in one case, over 1000) fonts from many other foundries. Adobe has largely chosen not to do such licensing, despite frequent approaches. Similarly, Adobe has pretty much completely avoided doing knock-offs of other people's work, despite internal and external pressures. <br> <br>Indeed, if Adobe's foundry business was separated out, there might be *more* such licensing, or knockoffs. The newly separated foundry would be faced with the same short-term financial pressures as other foundries. The only thing to stop it would be the owner's personal ethics. Past experience has clearly demonstrated that when faced with bankruptcy and laying off all their employees, some foundries have been willing to at least temporarily set aside those principles in order to save their business and their employees' livelihoods. That's pretty understandable, but an unfortunate choice to have to make. <br> <br>Being part of a bigger software company has insulated Adobe's type group from those pressures. I don't think that's a bad thing; I think it has been good for Adobe type and the type industry. <br> <br>In a key related issue, OpenType would be nowhere near critical mass, and might not have typographic sophistication for western languages, without Adobe's corporate backing. In order to make a fundamental shift like this, it is extremely helpful to have both fonts and applications owned by a single player, so they can make the commitment and avoid a chicken and egg problem. Not having this is one of the reasons GX failed, and AAT is failing. <br> <br>T</p>"
