    html: <p>&gt;As for the font issue, yea, I understand that type designers would be upset, but I don't think Adobe cares. They're in the business of selling software. If bundled fonts help sell the product, why not? <br> <br>This is not just a type designer issue. The concern is a broader cultural one. <br> <br>"We had been chosen, for better or worse, as primary influencers of an industry with 500 years of tradition, aesthetics, and values. We now had the responsibility to the industry to do the right thing. It became our goal to build a company whose culture and values reflected that responsibility"  <br>-- John Warnock &amp; Chuck Geschke, Foreword, Inside the Publishing Revolution, Peachpit Press, 2003 <br> <br>The right thing to do now would be for Adobe to divest its foundry business.  <br></p>
