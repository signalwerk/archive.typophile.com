    html: <p>Has anyone actually used the Corel line of products? I always see other designers bashing the product line, but I can't say that I've evern met anyone that's actually tried out the product. I've also seen good reviews of their products as of late. <br> <br>Having been a Macromedia guy for a long time, and slowly becoming pissed off at the company (sloppy, bloated, bug-ridden upgrades) I thought I'd venture into the underdog crowd to see what's out there. <br> <br>As for the font issue, yea, I understand that type designers would be upset, but I don't think Adobe cares. They're in the business of selling software. If bundled fonts help sell the product, why not? <br> <br></p>
