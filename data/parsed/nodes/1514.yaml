    date: 2003-10-09T11:29:00
    date_raw: 9.Oct.2003 11.29am
    votes: null
    html: "<p>A good discussion of the commodification/devaluation of type. And Mr. Phinney: \"There's no big money to be made in type\"? At Veer, we respectfully disagree. What is lacking is a commitment to marketing them, to believing in them. When we put type samples on paper and show them to qualified customers, they sell. Yes, perhaps on the backs of stock photographs (which comprise the bulk of our catalog) - but they sell, surprisingly well. <br> <br>Speaking of stock photography: does anyone else find it ironic that, despite the same conditions and challenges facing type design (i.e., widespread availability of free, inferior product; widespread access to the technology - compare the digital camera to Fontographer!; bundling with applications, etc.) the prices of stock photography continue to rise (driven by Getty, Corbis, Digital Vision, et al), while type prices continue to fall? There is nothing more to this than type producers (or their parent companies - consider behemoths like Letraset, Agfa, and Adobe - which have much bigger fish to fry, and have somewhat neglected their type businesses) losing the corporate will to maintain a pricing strategy. <br> <br>We are constantly advising our type vendors to keep prices high, and not sell themselves short, because they *do* sell if they're fresh, usable designs. <br> <br>Jon Parker <br>Veer</p>"
