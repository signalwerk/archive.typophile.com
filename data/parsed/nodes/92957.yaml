      <p>Yes! Inky rules, nicked letters, old letterpress — this kind of design is loads of fun to do. Play around with Adobe Wood Type (free with InDesign), or check out the Walden Type Foundry for some cheap distressed type and rules (as, for instance, below, though this is more western than you want).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slideshow4_4003.jpg"></div><p></p>
      <p>How many copies? Could you tea-stain them by hand? If you have a color printer, could you print a light shade of yellow or a scanned image of old paper in the background?</p>
      <p>Could you print something you make with all those free old-fashioned Adobe wood type fonts and then photocopy-degrade it until it looks like overinked metal type?</p>
      <p>Are you still looking for font suggestions are are you stuck with what you have?</p>
      <p>Actually, "time" to me suggests type carved into cold, monumental stone, with sharp shadows. What if you took Trajan or something and placed it over a stone background and played with the InDesign effects to emboss it?</p>
      <p>"Time" is sich an impersonal concept. What kind of time are we talking about here? Time in relation to what?</p>
