    <p>Hi, </p>
    <p>I've been commissioned to design a diary for a university. HFJ "Mercury" reminds me of old timetables a wee bit, so that's my current candidate for the body text, but I still need a display face for headers and maybe 20pt-size-ish dates.</p>
    <p>So can anyone think of a display face that has connotations of time, timekeeping, or numbers? Please nothing that is overtly specific to a specific technology like a font where each character is a digital watch or anything like that :)</p>
