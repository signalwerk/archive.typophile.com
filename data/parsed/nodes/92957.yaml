      <p>If the pages are designed to look old, what time period would be appropriate? Some of these suggestions imply pages that look extremely old (wood type, etc), but the original poster mentioned "a 1950s diner" which is obviously much more recent.</p>
      <p>&gt; Unfortunately this is b&amp;w and no chance<br>
      &gt; of alternate paper stocks. </p>
      <p>If buying paper stock that already looks old (such as parchment paper) isn't an option, you can create that look via artwork. Old paper darkens from the outside edges in. You can create this look using photoshop (there are tutorials on the internet), or you can purchase ready-made artwork for a few bucks at stock photography sites like iStockPhoto.com.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/parchment2_3950.jpg"></div><p></p>
      <p>The example above (which is color but could easily be converted to black and white) looks very old. If you're simulating paper from the 1950s, the effect would need to be much more subtle, with paper the looks good except for a slight darkening near the paper edges.</p>
      <p>However be sure that you can print from edge to edge. If the effect stops short of the paper's edge it'll ruin the effect.</p>
