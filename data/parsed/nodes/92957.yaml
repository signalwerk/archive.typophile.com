      <p>As a young person in college (also a Typophile, so maybe I don't count), I think anything that has a retro or pastiche or scrapbooky or "steam punk" look is in fact very hip right now, and I think old timetables fall into all of those categories.</p>
      <p>I agree with the condensed didone idea, though many clocks that use arabic numerals use a fat face. As far as timetables go, something like Trade Gothic would be standard, but wouldn't have that connotation out of context. Maybe also Roman inscriptional capitals, inline or not, as reminiscent of the carved numbers on sundials, etc.</p>
