    <p>Hi, I've been trying to figure out the name of this lovely Font shown below.<br>
    That's a scan of page 14 of "Elementarteilchen", english "Atomised" from Michel Houellebecq.<br>
    Seems to be a tricky font - no results with "What the font" or the like.</p>
    <p>The "?" and the "ß" are strikingly.</p>
    <p>Thanks a lot for the help!<br>
    David</p>
