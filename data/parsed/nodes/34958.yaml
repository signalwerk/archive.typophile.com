      <p>Ricardo, you were absolutely correct about the periods. I checked Bringhurst and he says in the UK the general convention is to only use a period after the abbreviation if the word ends abruptly (so Doctor becomes Dr whereas Professor becomes Prof. with the period).</p>
      <p>The bit about letterspacing the phone numbers also came from Bringhurst, but I’ve remembered only part of the detail and therefore got it wrong. Here’s part of the section:</p>
      <p>2.1.6: “Many typographers like to letterspace all strings of numbers as well. Spacing is essential for rapid reading of long, fundamentally meaningless strings, such as serial numbers, and it is helpful even for shorter strings such as phone numbers and dates. Numbers set in very short strings - triplets or pairs - need not be letterspaced.”</p>
      <p>Jason, thank you for your comments, and it pains me to admit that you are absolutely correct. As you can see from the resume I’ve never studied design or typography formally, and it shows more than I’d appreciated. It’s too late for this job, but I will definitely be going back to the books and will have another go at this in a month or two. In the meantime I’m going to make the minor amendments and get my application sent out (it is a junior position with full training, doing company reports, so hopefully they will at least see my enthusiasm).</p>
      <p>Once again thank you everyone for your time. Hopefully I can progress over the next few months and return with some better quality work.</p>
