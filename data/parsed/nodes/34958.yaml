    <p>Hi all. This is my first post here but I’ve been lurking for a while and trying to learn as much as I can. I’m fairly new to graphic design having only done it seriously for the last year. Due to the limited nature of our software at work I can only really practice and learn in my spare time, so I’m now trying to look for a job where I can actually develop and improve within the working environment.</p>
    <p>I’m a bit scared to post because it’s my first go at something like this, but I’d really appreciate your critique and comments.</p>
    <p>I’ll probably modify the top “Personal profile” section depending on the job.</p>
    <p>I’d be very grateful for any feedback whatsoever. I’m planning to send this off for a junior typesetting job on Monday, but I will try and revise anything that comes to light. Cheers.</p>
