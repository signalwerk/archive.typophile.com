      <p>Hi, James; welcome to Typophile.</p>
      <p>I think that you have a good start here with the two-column layout and the use of just one typeface, but I also think you need to adjust a few things...</p>
      <p>For example, you are using many different sizes of type and leading... This is a bit distracting and doesn’t lend visual unity to the piece — quite the contrary. I would try to keep things simple and consistent. Choose one point size and keep the leading constant throughout. You can reduce the space between your job titles and their descriptions, as well as the leading in your personal profile, and apply that extra vertical space to do this. If you need to highlight something, you could use a second, bolder weight (for the section names, or for your job titles and university degree, to give two examples).</p>
      <p>You could get rid of those tiny paragraph indents (they are barely visible) and add vertical space between the paragraphs instead. This will accomplish the same goal of indicating a new paragraph and be more in keeping with the overall design.</p>
      <p>Your job titles are followed by a big white space and the name of the employer; this is distracting. What if you simply separated the two items with a comma, avoiding that white space in the middle of those lines?</p>
      <p>Your contact info is the only block of text that is set ragged left; I would set it ragged right, like everything else on the page. And under “Relevant modules...” in the Education section, I would align the second bullet point in each line so that you have two ragged-right columns.</p>
