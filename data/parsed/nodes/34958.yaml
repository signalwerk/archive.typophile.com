      <p>Hmm... While the comments thus far have been primarily concerned with micro-issues (which are, of course, important), it seems that no one is mentioning that the Emperor is, well, naked. What I see is a certain competence with alignment, rather heavily aided by Ricardo and Tim’s comments, but the issue, to my mind, is that the resume as a whole is lifeless.</p>
      <p>I see that you say your portfolio is <em>a little underdeveloped</em>, so without a pile of work to present you really need to make an impression with your resume; that is to say your resume has to be a solid <em>example</em> of your ability, and, to be really blunt, the current design ain’t exemplifying a lot.</p>
      <p>I’m certainly not suggesting you over-design the thing, but the skill and talent you bring to and present in your resume design has to <em>prove</em> that you’re a “hard working, creative and motivated graphic designer”; I would also stress that you need to place skill at the top of that list, and skill can only be <em>shown</em>, not spoken about.</p>
      <p>My point is that what is there in the resume at the moment is a certain technical ability to arrange and space type, but there’s no personality on the page. By personality I mean evidence of a solid education and relationship with type and design, from which your selections and decisions will speak volumes about you. That’s the problem at the moment: the current resume tells me you’re lacking in typographic and design experience, and whether or not that’s true, the important thing is to not allow that impression to be made.</p>
      <p>Get your hands on some decent typography books and read them half a dozen times. I guarantee you that if you do so for even a week or two your resume will take on a whole different dimension of depth and balance.</p>
