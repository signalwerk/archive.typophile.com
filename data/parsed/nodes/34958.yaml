      <p>Wow, if you compare this latest version with the first one you posted, the improvement is outstanding! I like the current header but agree that this might not be the definitive version (not that there ever <em>is</em> a definitive version with resumes and portfolios, heh heh!) </p>
      <p>These may or may not be tiny things, but:</p>
      <p>1a) I think you can lose the periods at the end of your referees’ titles and addresses. First because they are not sentences, and second because you don’t have periods in your own address or university degree.</p>
      <p>1b) Speaking of periods, I understand that in the UK it is common practice to not add a period after abbreviated titles such as “Dr.”... But I’ve never lived there, I just read it in a couple of books on typography. You probably know more about that!</p>
      <p>2) I’m not sure, but a few items look like they are letterspaced or tracked: your name, your telephone number, and Dr. Collins’ phone number. Am I just imagining it? Maybe it is just the abundance of 1s and 7s.</p>
