      <p>I would work on the line endings of the second work experience section to remove the hyphens turn over ‘edu-’ and ‘to’ and in the second paragraph ‘and’ and ‘Comuni-’ and in the final year project description ‘to’. I am not so concerned about just one point size, however, I think you should restrict yourself to a maximum of three sizes, more important is the leading and inter-section spacing which should be consistent, less space between heading and body than body to heading. Your name is hanging a bit, my feeling is that it should align with the wide column or you could try aligning Barwell with that column.<br>
      Good luck in your job hunt.</p>
      <p>Tim</p>
