      <p>Nice work, James — like Tim says, this looks much cleaner and inviting to read. I also agree with his remarks about improving the rag, what he says about not overstating your capabilities, and using careful wording.</p>
      <p>I would add that the bold weight you’ve chosen does not have enough contrast with the rest of the text — I think that you should make it a bit bolder, so that it truly stands out. (You could try a couple of darker weights and compare the printed results with the current document.)</p>
      <p>As for the header, I like the smaller size you’re using for your name in the revised PDF... I second Tim’s comments on the vertical and horizontal positioning... Now, what if you moved it left, back to the first column, and broke it into two lines? Then you could move “Date of Birth” and “Driving licence” up to the top. I would also line up the address column with the “Final year project” column. It’s just an idea — you’re the final judge of whether this works or not, of course. :-)</p>
      <p>One last tip: don’t forget to kern your <strong>1</strong>’s...</p>
      <p>Best of luck!</p>
