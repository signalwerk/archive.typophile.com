      <p>Much cleaner, the personal profile doesn’t, to my mind, warrant being a different point size; in fact it contains the kind of information that should be in the accompanying letter (handwritten would be good if you are confident of your handwriting), however if you keep it turn over ‘it’, ‘to’ and ‘and’, this will achieve two things, one improve the rag and two avoid the widow ‘techniques’, you might also turn ‘and’ over in the last paragraph of relevant experience. The space before personal profile might present a better appearance if consistent with the document. The phrase ‘though I also do logo design when required’ might be better worded, don’t exaggerate beyond your capabilities (you might be found out) but it is a throwaway remark at the end of that sentence. For your name I like the vertical position in your current pdf (aligning to the ascender of the address) and the horizontal position of the third in your sample. One other thing I would remove the th after 7 in your d.o.b.</p>
      <p>Tim</p>
