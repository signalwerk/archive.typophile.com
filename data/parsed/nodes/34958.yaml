      <p>James, in regards to the overall design of your resume, you might want to check out a book by Kimberly Elam, <a href="http://www.amazon.com/Grid-Systems-Principles-Organizing-Design/dp/1568984650"><strong><em>Grid Systems: Principles of Organizing Type</em></strong></a>, to learn about different ways of organizing a page. There is also an excellent book that deals with activating the white space in a layout, Alex White’s <a href="http://www.amazon.com/Elements-Graphic-Design-Space-Architecture/dp/1581152507/ref=pd_bbs_sr_2/105-0515176-7382808?ie=UTF8&amp;s=books&amp;qid=1184193940&amp;sr=1-2"><strong><em>The Elements of Graphic Design: Space, Unity, Page Architecture, and Type</em></strong></a>.</p>
      <p>As far as your present resume, you are applying for a position as a typesetter, and a good typesetter attends to the micro-issues. Your resume does show that you have paid attention to these.</p>
