      <p>Thank you so much for all of the helpful comments. It’s amazing how things stand out once they’ve been pointed out to you.</p>
      <p>With the leading I was being a bit overambitious and trying to make the Profile copy stand out. I did bring the leading back into rhythm after that section, though I see that it’s not working.</p>
      <p>I believe I’ve done all of the amendments that were suggested. I’ve changed the leading to 13pt to try and space the page out a little, and reduced the amount of font sizes (excluding my name) to 3, using 2 weights. I’ve also made slight adjustments to the copy because, for example with the bullets, certain things just weren’t fitting in correctly.</p>
      <p><a href="http://www.barwell.plus.com/misc/jb-cv-2007-Layout%204.pdf" title="http://www.barwell.plus.com/misc/jb-cv-2007-Layout%204.pdf">http://www.barwell.plus.com/misc/jb-cv-2007-Layout%204.pdf</a></p>
      <p>The one thing I’m concerned about is the heading. I liked the way it broke up the page slightly, and thought it added some interest. I’ve done a few variations which can be viewed <a href="http://www.barwell.plus.com/misc/cvheader.gif">here</a>. Personally I’m still inclined to use the 3rd one down rather than how it is set in the PDF, but I’d be grateful for any further insights into that and anything else about the new layout.</p>
      <p>Indie-graphics: thanks for your comments. I’m afraid my portfolio is rather underdeveloped at the moment. I’m trying to work on it every night and will have something ready should I get invited to interview, and I will certainly post it here once I’m a bit further along with it. I was working on a <a href="http://www.barwell.plus.com/design/guitar/guitar9.jpg">vector guitar illustration</a> last month which is nearly finished, but that’s about all I dare show for now!</p>
