      <p>Hi Bloodtype,</p>
      <p>Thanks for your post.</p>
      <p>It is menu engineering design, in fact, it's an entire field of information design.<br>
      Just like other areas of information design there are things to be learned from the combination of psychology and design that are behind the structure of the menu. </p>
      <p>NBC and Time magazine both recently ran stories on menu engineering design. Just like any area of design, laying it out nicely without any thought to the way it should function best would be a naive step. </p>
      <p>Collecting menus sounds like a good plan though, thanks.</p>
