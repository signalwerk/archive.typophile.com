    <p>Hi,</p>
    <p>Can anyone recommend a decent book(s) on the effective information design of Restaurant menus? (I can't seem to find any.)</p>
    <p>There are some books with visual examples of creative menus, but no solid textbooks that I can see?</p>
    <p>Also, if anyone has any recommendations of the latter (books with visual examples of creative menus eg Pentagram) then they'd be most welcome too.</p>
    <p>It would be nice to have a long thread here, as a resource for other food menu designers. </p>
    <p>Thanks</p>
