      <p>I'm a graphic designer and although I don't do any menu design myself I've come across a few articles on the subject and find it interesting. However many of the articles I've seen focus mainly on the writing of menus, rather than the graphic design. For example, in the article "Ten Commandments of Menu Success" - <a href="http://tinyurl.com/4vx2jpf" title="http://tinyurl.com/4vx2jpf">http://tinyurl.com/4vx2jpf</a> - nine of the ten "commandments" relate primarily to writing, and when they do discuss typography it's mostly common-sense advice (make it legible, don't mix too many fonts, etc).  </p>
      <p>I have seen some articles that touch on graphic design elements such as menu organization and whether or not to list prices in columns, and I did find the advice interesting and sometimes surprising, but I'm not sure there's really enough advice out there to warrant someone printing a whole book on the subject.  Not unless the book is mainly just photos of nice menus &amp; restaurant signage; I have seen a few of those, and I think Amazon has a few.</p>
