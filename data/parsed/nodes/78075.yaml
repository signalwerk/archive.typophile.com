      <p><em>It is menu engineering design, in fact, it's an entire field of information design.</em></p>
      <p>Why apologize for what we do, and try to pass it off as something assumed to be more socially acceptable, intellectually respectable, and financially valuable? Such pretense only demeans graphic design.</p>
      <p>Sure, it is possible to talk about a well-engineered graphic design, just as one may describe a beautiful piece of engineering —but this is metaphor, and it doesn't make the graphic designer an engineer, or the engineer a beautician.</p>
      <p>Functionality is an inherent part of graphic design and typography, not a hybrid add-on.</p>
      <p>That "empirical" aspect of design which is sometimes interpreted as engineering concerns demographics, market research and statistics, and (as jabez notes) has more to do with applied psychology.</p>
      <p>The real engineering of graphic design is in the nuts and bolts of typography—manipulating type size, weight, style, scaling, leading, justification, tracking, kerning, colour and tone.</p>
