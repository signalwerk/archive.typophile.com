      <p>I have not seen such a book.  I would think the best way to approach it is to think like a patron of the place and plot out how the menu would function best for you.  You might also ask a few non-designer friends what their expectations would be of a menu.  The other end of the spectrum would be how the management of the establishment uses the menu functionally.  Do they have an agenda where they are emphasizing or featuring certain items or combinations? I guess I am saying "Walk a mile in another man's moccasins" (or several) and look for a process that interlocks the needs of the client with the needs of the proprietor. The design process for most things of this genre is not so different--Audience, Purpose, Message on one side and an elegant path to the communication destination on the other.<br>
      You certainly need a predictable system that the clientele can follow. You also should at least reflect the ambience of the place and type of food. Ask yourself, why do people come to this place? The answer is different for a fast food joint, a business lunch place, a dinner date place.  It is also textured with the cuisine or ethnic basis of the food--an English pub as opposed to a Thai or Lebanese place.<br>
      Also, think about the amount of time people will spend with the menu, not only to find their choice of dish for the night, but as a visitors experience.  The difference between an info-graphics presentation and a menu is that visitors of restaurants are looking for an experience as well as a meal.<br>
      Perhaps the book you should read is "Black Elk Speaks"?</p>
