      <p>Hi Hellbox,<br>
      I've done a lot a research on this subject. I'm a graphic designer trying to persuade restaurant owner to use menu engineering when designing their menus. I find it fascinating. And if you read the studies, it works to increase revenue for restaurant owners.</p>
      <p>You can find some useful links on my website on the link page <a href="http://menumonde.com/liens/" title="http://menumonde.com/liens/">http://menumonde.com/liens/</a>  under the headers "Les études" &amp; "La Presse" These headers are in French, but all the links there are in English and relate to strictly to menu engineering/graphic design.</p>
      <p>I've read that this a good book on the topic Food Service Menus: Pricing and Managing the Food Service Menu for Maximun Profit (The Food Service Professional Guide to Series 13) ISBN-10: 0910627231.</p>
      <p>This blog on the subject also provides some visual examples of engineered menus:  <a href="http://www.hotoperator.com/" title="http://www.hotoperator.com/">http://www.hotoperator.com/</a></p>
      <p>Cheers, Susan</p>
