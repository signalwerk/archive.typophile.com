    <p>I'm looking for some specimen sources from printers (nineteenth century), scanned and downloadable as PDF.</p>
    <p>I'm interested in ornements and I want to use it for inspiration and vectorize some.</p>
    <p>So far I found these downloadable sources (PDF) :</p>
    <p>&gt; Handy specimen book; specimens of type, borders and ornaments, brass rule, woodtype etc. Catalogue of printing machinery and materials, wood goods, etc (1897)<br>
    <a href="http://www.archive.org/details/cu31924014559730" title="http://www.archive.org/details/cu31924014559730">http://www.archive.org/details/cu31924014559730</a><br>
    &gt; Spécimen des caractères de l'imprimerie Edmond Monnoyer<br>
    <a href="http://gallica.bnf.fr/ark:/12148/bpt6k6134871b.r=Sp%C3%A9cimen+des+caract%C3%A8res+de+l%27imprimerie+Edmond+Monnoyer.langEN" title="http://gallica.bnf.fr/ark:/12148/bpt6k6134871b.r=Sp%C3%A9cimen+des+caract%C3%A8res+de+l%27imprimerie+Edmond+Monnoyer.langEN">http://gallica.bnf.fr/ark:/12148/bpt6k6134871b.r=Sp%C3%A9cimen+des+carac...</a><br>
    &gt; Spécimen des caractères anciens de la fonderie Turlot<br>
    <a href="http://gallica.bnf.fr/ark:/12148/bpt6k5844525t.r=caract%C3%A8res+elzeviriens+fonderie+turlot.langEN" title="http://gallica.bnf.fr/ark:/12148/bpt6k5844525t.r=caract%C3%A8res+elzeviriens+fonderie+turlot.langEN">http://gallica.bnf.fr/ark:/12148/bpt6k5844525t.r=caract%C3%A8res+elzevir...</a></p>
    <p>Do you know more sources for ornements ?</p>
    <p>Thanks,</p>
