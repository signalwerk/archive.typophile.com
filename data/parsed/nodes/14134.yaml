    html: |-
      <p>Not entirely, open face is more like an engravers style, it has thicks and thins and gives an impression of depth or being carved, while outlined is a literal outline of a face (imagine you had cut out a letter from a piece of card and then traced around it onto a piece of paper) which looks like <a href="http://www.myfonts.com/fonts/efscangraphic/princetown-sh/" rel="nofollow">this</a>. To further confuse matters there is another effect called inline which looks like <a href="http://www.myfonts.com/search?search%5Btext%5D=inline" rel="nofollow">this</a>.<br>
      I hope this hasn't confused you too much.<br>
      Tim</p>
