  - id: 80295
    user: 2021
    date: 2005-07-26T15:31:00
    date_raw: 26 Jul 2005 — 3:31pm
    votes: null
    html: |-
      <p>&gt;why are there so many terms for such similar effects?</p>
      <p>I think it perpetuates itself. For instance, I wasn't aware there was only one correct way to name a face with a little bit of negative work done on it, so when I did such a face, I named it in a similar manner to one that had a similar effect. Hence Walburn Hand Tooled, after Goudy Handtooled. I was also aware that a number of ITC faces had that designation (Cheltenham, Garamond), so figured it was a reasonable precedent.</p>
      <p>The main Open Face I knew was Bodoni, which has a different effect from the ITC fonts.</p>
