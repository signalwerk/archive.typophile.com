    <p>I thought this would be the right place to share my project:</p>
    <p>Since 2009 I'm working on a typographic wall calendar, it's made of the number of keyboard keys that represent the Year. Last Year I made one made of 2011 Keys (<a href="http://typophile.com/node/76566" title="http://typophile.com/node/76566">http://typophile.com/node/76566</a>). The Year before that I did one made of 2010 keys.(<a href="http://typophile.com/node/65810" title="http://typophile.com/node/65810">http://typophile.com/node/65810</a>) - The keyboard keys are arranged to read out every day of the year, as if a person is going to type it. The resulting image is a huge wall calendar (27 x 40 inch) created from 2012 used keyboard keys.</p>
    <p>This year I turned the design into a Kickstarter project. Kickstarter is a public funding platform for design and art projects.<br>
    Here is the link to the project-website with a little video explaining the project: <a href="http://kck.st/2000and12" title="http://kck.st/2000and12">http://kck.st/2000and12</a><br>
    The campaign is running till Nov. 6th. </p>
    <p>Here is a picture of the Calendar for 2011:</p>
    <p><img width="750" src="http://haraldgeisler.com/wp-content/uploads/2010/12/2011_TWC_986px_width.jpg"></p>
    <p>What is the project about?<br>
    The "Gregorian" calendar we use today was introduced in 1582 by Pope Gregor XIII. Since then it is one of the most effective structure on the western civilization among the invention of writing. By writing out every day of the year the traditional notation form of this cultural heritage is deconstructed and reconstructed as a text. By showing keyboard keys the text is not directly reconstructed. The key lays a moment before the appearance of the text. A key wants to pressed before the text literally appears. This way the picture holds on to the moment before the "becoming-text" and points to the action of writing. In this moment of withholding questions appear. Is this a calendar like the title claims? If not what is it? What happens if I press the keys of a date? Is it a time-machine? Could one say that all calendars have something machine like?</p>
    <p>How did it start?<br>
    The first edition was not intended for sale but as a giant New Years Card and send out to friends and typographic colleagues. The response was overwhelming and I decided to make it available for a public audience. The artwork is executed and printed every year in original size and sold through my Website: <a href="http://www.haraldgeisler.com/order-prints" title="http://www.haraldgeisler.com/order-prints">http://www.haraldgeisler.com/order-prints</a></p>
    <p><a href="http://kck.st/2000and12" title="http://kck.st/2000and12">http://kck.st/2000and12</a><br>
    Please share the link among your followers and with your typographic friends!</p>
    <p><img src="http://haraldgeisler.com/wp-content/uploads/2011/08/HOORAY-Harald-Geisler-Typographic-Wall-Calendar.gif"></p>
    <p>I AM VERY EXCITED ABOUT YOUR TYPOGRAPHIC COMMENTS AND CRITIQUE!</p>
    <p>Thank you very much, </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TWC-Products-signed_5873.gif"></div><br>
    Frankfurt am Main, Germany<br>
     <div class="imageWrap"><img src="http://typophile.com/files/twc20t_4875.jpg"></div><p></p>
