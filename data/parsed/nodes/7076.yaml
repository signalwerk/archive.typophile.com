    html: "<p>You can find some good advice about this in the Typophile archives. <br> <br>Here's what I myself recommend: <br>1) Make a midling weight that looks good for text.  <br>2) Make a Bold \"candidate\" (maybe using auto-weight-gain + mucho tweaking).  <br>3) Extrapolate the lightest and darkest extremes.  <br>4) Clean up the extremes real good.  <br>5) Make new intermediates and compare against the originals.  <br>6) Tweak only the extremes to make any new intermediates come out good, dumping the original intermediates.  <br> <br>In this way you have clean results but you never have to tweak intermediates again. <br> <br>hhp</p>"
