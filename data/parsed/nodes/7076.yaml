  html: <p>I'm working on a sans serif face and I'm planning to make a light and a bold version of it. I've finished the regular and regular italic weights. Which weight do you recommend to do first? The light or bold? Is there any place with good tips for interpolation process on the web? <br> <br>Thank you</p>
  html_clean: <p>I'm working on a sans serif face and I'm planning to make a light and a bold version of it. I've finished the regular and regular italic weights. Which weight do you recommend to do first? The light or bold? Is there any place with good tips for interpolation process on the web? <br> <br>Thank you</p>
