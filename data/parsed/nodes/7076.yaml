    date: 2004-10-09T03:08:00
    date_raw: 9 Oct 2004 — 3:08am
    votes: null
    html: '<p>This is how I do it: <br>1) Prepare an ultralight (maybe even stroke weight 0) monochrome weight. <br>2) Extrapolate the extrabold. This will be too "proportional", i.e. the stroke weight is constant, makeig a and e too bold. <br>3) Modify and clean up the extrabold. <br>4) Re-interpolate the regular wight. <br>5) Create an MM font with the "true" regular and the interpolated regular wight. <br>6) Extrapolate a "triple true" regular (truer that true!). Now you can see what makes the true regular true and make conscious decisions about that. I think the most important thing with designing is that you do everything consciously. <br>7) clean up the triple true and re-interpolate the true regular. <br> <br>When I generate the final instances I put all three weights in one MM font. The semibold is not only an interpolation between regular and bold but I add a certain amount of extrapolation (regular and light). <br>The resaon for this is that a point does not move on a straight line on its way from light to bold (that is why we need a true regular). However, it should not move on a line with a kink at the regular weight. It should move on a curve instead. So the semibold will not be on the direct line between regular and bold. <br>I usually prepare an Excel diagram that shows the amounts of light, regular and bold in all the instances. Again, the graphs schould not have kinks. The semibold usually has about -10% of the light weight, 60% regular and 50% extrabold. <br> <br>Yours, <br>Tim</p>'
    html_clean: '<p>This is how I do it: <br>1) Prepare an ultralight (maybe even stroke weight 0) monochrome weight. <br>2) Extrapolate the extrabold. This will be too "proportional", i.e. the stroke weight is constant, makeig a and e too bold. <br>3) Modify and clean up the extrabold. <br>4) Re-interpolate the regular wight. <br>5) Create an MM font with the "true" regular and the interpolated regular wight. <br>6) Extrapolate a "triple true" regular (truer that true!). Now you can see what makes the true regular true and make conscious decisions about that. I think the most important thing with designing is that you do everything consciously. <br>7) clean up the triple true and re-interpolate the true regular. <br> <br>When I generate the final instances I put all three weights in one MM font. The semibold is not only an interpolation between regular and bold but I add a certain amount of extrapolation (regular and light). <br>The resaon for this is that a point does not move on a straight line on its way from light to bold (that is why we need a true regular). However, it should not move on a line with a kink at the regular weight. It should move on a curve instead. So the semibold will not be on the direct line between regular and bold. <br>I usually prepare an Excel diagram that shows the amounts of light, regular and bold in all the instances. Again, the graphs schould not have kinks. The semibold usually has about -10% of the light weight, 60% regular and 50% extrabold. <br> <br>Yours, <br>Tim</p>'
