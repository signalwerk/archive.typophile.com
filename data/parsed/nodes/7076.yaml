    html: <p>As shown above, there are many ways to go about interpolating. <br>My best advice is to try as many as you can and compare the results.  <br> <br>Maybe really obvious to some but (I think) a good trick is to create <br>one interp for the caps and one for the lowercase and then combine <br>them. This way you avoid the somewhat anemic interps that result <br>when using light and black masters. I do this all the time. I even <br>make a third sometimes for the numbers and a fourth for the fractions <br>and punctuation. Of course, then the hand tuning begins.</p>
