    user: 213160
    date: 2013-07-16T09:42:00
    date_raw: 16 Jul 2013 — 9:42am
    votes: null
    html: |-
      <p>I agree with the above post, and I also think "fine furniture" isn't integrated with the rest of the logo as well as it could be. I would tighten the leading and also do something about the space between the tag line and the "g". This would help the logo feel more unified.</p>
      <p>You might even consider changing the font of the tag line altogether. Personally, I think a contrasting font always looks better than using the same font. It's also somewhat awkward how the "f" in "furniture" and "fine" line up. Not only because of the visual repetition, but also because it's hard to tell if they're both left aligned. It looks as if "fine furniture" might be slightly indented, but I can't tell if it actually is or if it's an illusion.</p>
      <p>The strength of this logo is that its simplicity is consistent with the clean, minimalist style of the brochure and the product. I also enjoy your solution with the period. It looks as if the dot on the "i" has been re-appropriated, which adds just enough playfulness to keep the logo from being bland in its simplicity.</p>
      <p>The first thing that I notice about the brochure is that the image directs your eye *off* the page, by having the shelf sticking out "point" off to the right side. If you moved the image to the left side of the page, you could make the shelf "point" to the text. Then the reader's eyes would go directly to the right place (the copy).</p>
      <p>I think it would look nice if the paragraph were framed by the right angle created by the cabinet and the shelf. Then the image and the text would be integrated in an interesting way. I don't know if I'm getting the image across very well, so this is what I mean: imagine the text box sitting on top of the shelf. But instead of having the words actually touch the shelf, leave a wide margin (both on the left side of the text to separate it from the cabinet, and under the last line of text to separate it from the shelf). Let the image act as a frame for your body copy.</p>
      <p>Of course, you have to play around with that idea to see if it actually works. It seems like a good idea in my mind, but might not work very well on paper. It would also leave even more white space, but you could use that white space for more text and imagery. Though I get that you're going for a minimalist look, the brochure as is looks too empty, so you'll either have to add more content or use a more compact layout that you can fill with the content you have.</p>
      <p>Hierarchy could be emphasized more. Your headings could stand to be a lot bigger. Don't be afraid to really exaggerate the differences between the heading and the body copy. This is what energizes a design, not to mention makes it easier to read. Again, contrasting fonts go a long way too. I recommend keeping the font you have for the heading, but blowing it up to a much bigger size, and using a contrasting font for the body copy. Maybe a serif font. And the all-lowercase motif doesn't really need to be carried over into the body text, because it makes the logo/headers look less distinct. And again, contrast is what really energizes a design.</p>
      <p>I hope this helps! If I sound super nit-picky, it's because I think even the best designs can always be improved.</p>
