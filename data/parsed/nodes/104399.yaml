      &gt; to the point where it gets boring. </p>
      <p>I like layouts that show restraint and subtlety, but I think your layout goes a little too far in that direction, with the majority of the space on the pages being white space. Especially since you're talking about how much the cabinet holds, but are showing it using rather small photos.</p>
      <p>Also, although I like the quirkiness of the copy, it needs some polishing. On page two you've got one long sentence with around 11 commas and semicolons. Are you using a professional copywriter? If not you might want to bring one into the project.</p>
      <p>Not sure I'm clear on how it folds. Could you post a simple sketch showing how it folds?</p>
