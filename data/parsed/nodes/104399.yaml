      <p>Thanks for posting the layout, sorry for the delay in getting back to you. </p>
      <p>If I understand correctly, you're printing on one side only and the brochure is folded to make the printing appear on both sides. Is that correct? I wouldn't do it that way as it'll look amateurish. Are you planning to print this yourself? </p>
      <p>It should be printed on both sides, either using a 1/2-size sheet, or else print 2-up per page (like 2 fronts on one side and 2 backs on the other) and then cut them apart after printing. If you want the extra heft of a folded page, just use heavier weight paper instead. </p>
      <p>Or am I misunderstanding your diagram?</p>
