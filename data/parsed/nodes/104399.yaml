      <p>If it were me, I'd close up the space in the logo between the <em>r</em> and the <em>t</em>  by, in essense, removing the left side of the crossbar on the <em>t,</em> then butting the end of the r up against it. This would make a nice, well-proportioned ligature instead of having two separate glyphs simply smooshed together.</p>
      <p>Also, about the <em>f</em>... Aesthetically, it matches everything else, but it, unfortunately, closely resembles the all-too-familiar Facebook <em>f.</em></p>
