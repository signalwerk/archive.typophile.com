    html: <p>"Le Romain du Roi – la typographie au service de l'état, 1702-2002" mentioned above is the catalogue of the exhibition held at the Musée de l'Imprimerie in Lyon in 2002. In this excellent publication – which can be ordered from the Musée – you will find a very useful piece written by James Mosley plus some very good photos of punches, moulds etc., and the engraved prints of the original designs for the Romain du Roi. There are also some useful illustrations of specimens from the Imprimerie Royale.</p>
