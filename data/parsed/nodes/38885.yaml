    html: <p>James, you must be thinking of Tory's Champ Fleury? It's got letters on grids too, but that was 150 years before the Romain du Roi. Great reading though, if you can read 16th-c. French printed with medieval abbreviations. If you'd rather not, <a href="http://www.allbookstores.com/book/9781891788864/Bruce_Rogers/Champ_Fleury.html" rel="nofollow">here is an English translation</a>.</p>
