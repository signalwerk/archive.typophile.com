    html: <p>It is said <a href="http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=25373">here</a> by the very reliable Graphic6 (Robert), that this was a custom typeface called Sheraton (in two weights). You could use a modified <a href="http://www.identifont.com/show?60V">Craw Modern</a> as a substitute, Philippe says, also a reliable one.</p>
