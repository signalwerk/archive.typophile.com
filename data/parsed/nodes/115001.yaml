    <p>I'm looking for a Blackletter type in use (in America) during the American Civil War era. I came across Morris Fuller Benton's Wedding of 1901 with indications it was designed based on earlier Victorian styles but am not sure if it reflects a style in use in the USA --or if there is really any difference between styles used in the USA or elsewhere. I know there are some Old English styles available, but again, is there a difference between US and other styles? I will be using the letter style to do a carved inscription. </p>
    <p>Any and all thoughts and opinions are welcome! Thank you in advance.</p>
