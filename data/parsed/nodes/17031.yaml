      <p>Because we are such type geeks, we forget the bigger picture sometimes.</p>
      <p><em>Switzerland’s official name is Confoederatio Helvetica (Latin for “Helvetic Confederation”), which is frequently translated in English as Swiss Confederation. The Helvetii, an ancient Celtic people who occupied what is now western Switzerland, were defeated by the Roman army of Julius Caesar in the 1st century bc. As a province of Rome, the region became known as Helvetia. The name Confoederatio Helvetica, an ethnically and linguistically neutral term that recalls this ancient history, is testimony to an enduring desire to forge unity among a diverse population.</em></p>
      <p>Charles Heatwole, B.A., M.S., Ph.D.<br>
      Professor of Geography, Hunter College, New York. He is author of <em>Switzerland: Confoederatio Helvetica</em> and coauthor of <em>Geography for Travel and Tourism</em>.</p>
      <p>So unless you are intending to show a specimen of the typeface Helvetica, setting the official name "HELVETICA" using Helvetica is actually a design cliché... nothing that we visually sophisticated typophiles would dream of. ;-)</p>
      <p><img src="/sites/default/files/old-images/Helvet_Chemica.png][img:sites/default/files/old-images/Helvet_Aqua.gif"></p>
