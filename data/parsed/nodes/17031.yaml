  html: |-
    <p>In the classic poster from 1979, Jack Summerford promoted the 'new' typeface ITC Garamond by typesetting the word 'Helvetica' in the serif face. I always found this to be quite funny even though I have issues with how Garamond looks - it's an interesting look into the discourse on type that was going on in that period.</p>
    <p>I have attempted to recreate this 1979 classic on a t-shirt - it can be found here: <a href="http://www.cafepress.com/teapotthecat" title="http://www.cafepress.com/teapotthecat">http://www.cafepress.com/teapotthecat</a></p>
