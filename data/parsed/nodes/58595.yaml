    html: |-
      <p>They have a building in my town, and the huge logo on it has been annoying the heck out of me for a while. I don't get the jumping baseline. To me this looks like <em>three guys founded a serious-acting company together but the youngest of them is constantly acting the clown, giggling about stuff nobody else finds funny, and thinking he's so very special. The others are vaguely annoyed about him but then again, hey, he brings in "dynamism".</em></p>
      <p>That, or horizontal kerning was getting boring. :-\</p>
      <p>But LOL, I never realized the order is different in the black box. I might just start calling them PriceCaterhouseWoopers now.</p>
