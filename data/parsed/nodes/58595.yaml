    <p>Has anyone else noticed how weird the PWC logo is?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/pwc_logo_5661.gif"></div><br>
    With the W midway in size between lowercase and uppercase, it leaves me unsure whether it's a separate word. Why the jumping baseline? And why is the letter order changed in the black box?<br>
    I think it's very weird indeed :/<p></p>
