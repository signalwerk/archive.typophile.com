      <p>Is it painted by a sign-writer? Is it just me or are the arms of the two T's different lengths? </p>
      <p>I'm guessing that this is the type of letter that influenced Gotham. If you go down the compressed end of the Gotham spectrum you might be getting close-ish.</p>
      <p><cite>Public spaces are teeming with handmade sans serifs that share the same underlying structure, an engineer's idea of "basic lettering" that transcends both the characteristics of their materials and the mannerisms of their craftsmen. </cite></p>
      <p>Extract from <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100008" target="_blank" rel="nofollow">Gotham. What letters look like.</a></p>
      <p>The apostrophe suggests something handmade to me.</p>
