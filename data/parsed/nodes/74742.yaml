    html: |-
      <p>&gt;&gt;&gt;I realize it's handpainted, but so clean I still believe it's based on an existing design.</p>
      <p>Yeah, 'The right way to sign-write letters' is a real but notional typeface that exists in all our heads to a lesser or greater extent, admit it. The one who did this had the remarkable gift of making something notional a physical reality. And I guess that's why Gotham has become so popular - F-J &amp;co have intuitively managed to digitise something that everyone (or at least the vast majority) was thinking and that is surely its great strength. It's so familiar and that gives it, and therefore us, a great sense of confidence and security.</p>
      <p>Let's be clear, however, that without this sort of prehistoric sign-writing genius, there would be no Gotham for us all to be designing everything with. What do you reckon?</p>
      <p>&gt;&gt;&gt;If there is a digital face, it copied the lettering.<br>
      And so you could argue that there is very little authentic about Gotham...but who are the ones who are laughing all the way to the bank?</p>
      <p>Is there a thread entitled 'In praise of Gotham'? If not I might start one.</p>
