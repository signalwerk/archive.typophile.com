    <p>Any ideas on what this might be? I thought I had some thoughts, such as Bell Gothic or even a derivation of Steelplate Gothic, but it's neither of those, and I could just use your expertise.</p>
    <p>This is on the window of an old shoe company storefront. Company established in 1889, but they moved to the building this type appears on in 1923.</p>
    <p>Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/trautwein-small_4105.jpg"></div><p></p>
