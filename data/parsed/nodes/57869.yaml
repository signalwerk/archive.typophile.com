    html: |-
      <p>Just looking over the original report.</p>
      <p>After a <em>very</em> brief review:</p>
      <p>From <a class="freelinking external" href="http://www.hotelschool.cornell.edu/research/chr/pubs/reports/submissions.html" rel="nofollow">the sumbision guidelines</a> page on their site: </p>
      <p><em>"Submissions are read for general acceptability by the academic director of the Center for Hospitality Research and then sent in blind form to industry and academic reviewers."</em></p>
      <p>Not sure if this makes it officially "peer reviewed" but at least it's more than self published. If we check out who's on the Advisory Board we see "<a class="freelinking external" href="http://www.hotelschool.cornell.edu/research/chr/board/russell.html" rel="nofollow">Steve Russell</a>, Chief People Officer, Senior VP, Human Resources, McDonald’s USA." </p>
      <p>If we check out the Senior Partners, we see "<a class="freelinking external" href="http://www.mcdonalds.com/usa.html" rel="nofollow">McDonald’s USA</a>" is third on the list.</p>
      <p>The second authour, <a class="freelinking external" href="http://www.hotelschool.cornell.edu/research/facultybios/faculty.html?id=43" rel="nofollow">Kimes</a>, who is most likely <a class="freelinking external" href="http://www.hotelschool.cornell.edu/students/phd/phddetails.html?id=sy229" rel="nofollow">Yang's</a> supervisor, has an impressive background. Note that <a class="freelinking external" href="http://disneyworld.disney.go.com/" rel="nofollow">Walt Disney World Resorts</a> was a previous client of hers. </p>
      <p>The three different menus (numbers with a $, numbers without, and numbers written in words) differed slightly in their design. Each used a different colour elastic binding so that the server could tell which was which. A possible confound. Overall, this looks like a pretty tight study. Well written, and seemly good stats, but I'm not that good at math (yet). Judging by the graphic design of the publication, someone has obviously spend a lot of time on it and are attempting appealing to corporate culture as well as academia.</p>
      <p>Thanks for the link Sii. Research is fun!</p>
