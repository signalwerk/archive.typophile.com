    <p>Hi type lovers, </p>
    <p>The Graphic Artists Guild will be hosting an evening with Michael Doret (type designer, lettering artist, and print-designer extraordinaire) on Saturday night, October 23rd. We would <em>love</em> to have some hardcore typophiles attend if you're available.</p>
    <p>Details available at <a href="http://losangeles.gag.org" rel="nofollow">http://losangeles.gag.org</a><br>
    and here's the event page on <a href="http://www.facebook.com/event.php?eid=102070383194137" rel="nofollow">Facebook</a>.</p>
    <p>Anybody think they can come?</p>
    <p>Hope to see you there,<br>
    Josh Korwin</p>
