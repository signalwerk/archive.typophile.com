    html: <p>It's not evil if you're not National Socialist about it. And you're not - more 70's young-adult book cover, especially in the leading caps. This is NOT a slam - that stuff is printed nice and clean into my memory. <br> <br>For my two cents, it's missing a bit or two on all the character bottoms. Nicely cleft to the pen, but a little light in the •••. Hit that and we can spend all day cutting and pasting in Gutenberg text just for the visual kick. <br> <br>Make sense? cos I'm too dr**k to post an edited GIF. ;]</p>
