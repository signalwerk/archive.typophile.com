  html: <p>Hi everyone, I'm new to Typophile and am glad to be in contact with all of you! Does anyone know of upcoming Typography workshops in the LA area, or evening/weekend classes? I'm even open to an online class. I'm in the process of building up a portfolio so I can leave the film industry and go back to school for graphic design. Thanks!</p>
