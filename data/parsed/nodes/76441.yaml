      <p>Imagine seeing a phonetics discussion here. A quick explanation of the two sibilants in Korean, if you don't mind going into detail:</p>
      <p>Korean stops (eg. ㄱ, ㄲ, ㅋ) and affricates (ㅈ, ㅉ, ㅊ) exhibit a 3-way laryngeal contrast word-initially and intervocally (between vowels) between lenis, fortis, and aspirated consonants. However, there is only a 2-way contrast between ㅅ and ㅆ. It is clear that ㅆ is fortis, but there is no general agreement on the nature of ㅅ. In phonological processes, it behaves like lenis in some ways (becomes fortis after an obstruent like other lenis sounds) and aspirated in some ways (resists voicing to [z] even in voiced contexts). Best to label it non-fortis and allow that it has characteristics of both lenis and aspirated.</p>
      <p>At the beginning of a word, ㅅ is clearly an aspirated [sʰ] as Number3Pencils suggests. The spectrogram of word-initial Korean ㅅ is remarkably similar to the sound transcribed as /sʰ/ for Burmese. Intervocally in faster speech, however, the aspiration is not as detectable. There, the best I can do to transcribe it is as [z̥], where the ring under is the devoicing diacritic, in this instance to mean that this is a lenis pronunciation. The glottis shapes as if to pronounce a [z], but there is no actual vibration of the vocal folds. In all positions, ㅆ is not much distinguishable from the usual [s] in most other languages, although intervocalic [s] in other languages tend to be somewhat weaker than ㅆ in the same position. One important point is that the vowel that follows ㅆ and other fortis consonants often takes on creaky voice, and this plays a big role in the perception of the fortis consonant. A final [s] in other languages is therefore likely to be heard as ㅅ as much as ㅆ because there is no following vowel to reinforce the fortis-ness.</p>
      <p>By the way, I would prefer to transcribe ㅅ as /z̥ʰ/ to indicate that it has characteristics of both lenis and aspirated, because transcribing ㅅ and not ㅆ as /s/ is misleading to speakers of other languages.</p>
      <p>The situation is more complicated when the sibilants are followed by front high vowels and semivowels. Then these become /ɕ/ or /ʃ/, and similar sounds in other languages are heard more as non-fortis ㅅ. In these positions, ㅆ is pronounced with much more articulatory force than I've heard in any other language. Even the Russian щ /ɕɕ/ is much too weak to be ㅆ.</p>
