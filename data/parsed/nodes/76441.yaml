      <p>I know I don't hear the difference between the voiced and unvoiced versions of "th", but most phonetic descriptions of English do include that distinction. As "s" is a similar sound, this distinction might exist for it as well.</p>
      <p>Usually, by English speakers, "s" is considered to be the unvoiced version of "z", but no distinction like <em>that</em> one exists for the two versions of "th", so the subtler distinction existing for "th" could also exist for "s".</p>
