      <p>I didn't notice that part before either. There is a mistake there, all right. Since "The Initial" is not in quotes, "The" cannot be capitalized.</p>
      <p>And, as already noted, since the Initial is followed by the vowel, not the other way around, "There must be a vowel following the initial" is probably what you want. Actually, though, what you are really attempting to say is "There must be a vowel immediately following the initial"; that is, the very next thing after the initial must be a vowel, so that when a syllable begins with a consonant cluster, it must be split into multiple syllables, with all consonants other than the last followed by a placeholder vowel.</p>
      <p>In general, I found the chart excellent. At first, I had my doubts that organizing the material into a "Periodic Table" would make sense, but in fact it is an excellent and clear explanation of the Korean writing system.</p>
      <p>Since the paired consonants that can only be used as the final are grouped together, the three that can only be used as the initial probably should be as well.</p>
      <p>Some more minor nitpicks with the English, to make it flow idiomatically:</p>
      <p>While phrasing such as 'is called "The Initial"' is natural in English, the quotes and/or capitalization probably should not be used elsewhere in the chart.</p>
      <p>Another typo is the sentence "All syllables in Hangul must begin with a consonant and followed by a vowel". The word "and" should be removed. You could keep the "and" in a construction such as "All syllables in Hangul must begin with a consonant and a vowel immediately following".</p>
