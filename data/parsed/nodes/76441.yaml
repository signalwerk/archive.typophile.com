      <p>Number3Pencils , Thanks for the review.</p>
      <p>I noticed that I used the Romanized letters in the IPA brackets.<br>
      I did not realized these until you pointing them out, so I appreciate you telling me.<br>
      Yes, /bb/, /dd/, /gg/ are not the correct pronunciations. They should be&nbsp;/p͈/, /t͈/, and /k͈/.</p>
      <p>I also noticed that English speakers pronounce the Spanish 'c' in 'como' as just a simple /k/ instead of a strong /k/ as the native Spanish speakers do.&nbsp;</p>
      <p>Though 'ㅉ' is described as /ts/ in IPA, the 'zz' sound in 'pizza' sounds like ㅉ to Koreans, which is different from the 'zz' in 'jazz'.&nbsp;</p>
      <p>Same for the 's' in 'sun' and 'slow'.&nbsp;<br>
      I am not a linguistic specialist, so I do not know how to describe it with the correct colloquial terms. At any rate, English speakers pronounce the 's' in 'sun' and 'slow' differently, but mark it as the same phonetic symbol.</p>
      <p>Though you might not see the difference, Koreans hear the difference, because they have two different 's' sounds, which are ㅅ and ㅆ. </p>
      <p>Just like Koreans notice the difference between the /z/ sound in 'jazz' and 'pizza', and the /k/ sound in English and Spanish. </p>
      <p>I totally understand why&nbsp;many English speakers do not recognize the tense(strong) consonant sounds as a separate pronunciation.<br>
      &nbsp;<br>
      Most Koreans do not notice the difference between the R and L sound.&nbsp;<br>
      They think it is just "ㄹ".&nbsp;<br>
      They do not have two different letters to identify the difference between the R and L sound.<br>
      The same issue occurs for the V and B sound; as Koreans just describe it as 'ㅂ'.</p>
      <p>Humans tend to recognize things based on their pre-learned knowledge.<br>
      For that reason, native Koreans usually have a hard time to pronounce them differently.</p>
      <p>Regardless, I see the confusion here so I will try to find other words for the clusters.&nbsp;</p>
      <p>The ㅂ,ㄷ,ㄱ sound can be different according to their positions in a syllable and in a word, and it is also&nbsp;affected by the final in the preceding syllable. </p>
      <p>Number3Pencils ,<br>
      What you said is correct sometimes, but not always.&nbsp;<br>
      The good news is, even if you pronounce ㄱ as always K,&nbsp; ㅂ as B, or ㄷ as D, Koreans still understand what you are trying to say, even if does not sound 100 percent correct in pronunciation (or if the spelling is wrong) to native Koreans.<br>
      Which means, even if 김치 is correct and you write it as 킴치, people still understand what you wrote, eventhough it is not the correct spelling. </p>
      <p>It is a very different situation in English, since nobody would think it is the same word if you wrote Gimchi instead of Kimchi with the Roman alphabet.&nbsp;<br>
      It is because most&nbsp;Hangul words are created by pronunciation, not by spelling. Hangul was invented only 500 years ago, very long after the actual Korean language developed. And it was designed to "mimic" the existing sounds.</p>
      <p>Long story short, the main purpose of inventing 'Hangul' by Sejong the Great and his scholars, was to create an easy writing system for ordinary Koreans, especially women and commoners who did not have the privilege to learn 50,000 complicating Chinese letters. </p>
      <p>So, it is told that Sejong the Great intentionally grouped certain sounds as the same Jamo to simplify the alphabet. (ex. the initials and the finals, and visualize the clustered consonants with basic a jamo(s).) There is much controversy on whether his decision was right, since Hangul does not represent every single sound in the world. (But does it have to?)</p>
      <p>The wallpaper is an introduction guide for beginners, so I did not want to include too much information. But I believe this wallpaper helps people start without being overwhelmed. Yes, eventually they would need more advanced tutorials and I guess you are at that stage.&nbsp;</p>
      <p>Thanks for your feedback. </p>
      <p>I am grateful that everybody here is willing to provide their reviews and suggestions to improve the wallpaper.<br>
      Thanks to you, I have learned that I should stand more from a viewpoint of a learner, not as a teacher.&nbsp;<br>
      Thank you.</p>
      <p>Darim</p>
