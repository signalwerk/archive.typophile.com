      <p>I feel responsible that my explanation confused you even more.&nbsp;<br>
      I think I shouldn't have said that native English speakers pronounce /s/ differently. Maybe it is only that Koreans hear it differently.</p>
      <p>Here are some nice links where you can actually hear the ㅅ and ㅆ sounds.</p>
      <p>The /s/ sound as in 'sun' sounds like this to Koreans, which is a strong /s/ (ㅆ),</p>
      <p><a class="freelinking external" href="http://www.sayjack.com/learn/korean/hangul/#싸" rel="nofollow">http://www.sayjack.com/learn/korean/hangul/#싸</a></p>
      <p>while the /s/ sound in 'slow' sounds like the following to Koreans, which is a softer /s/ (ㅅ).</p>
      <p><a class="freelinking external" href="http://www.sayjack.com/learn/korean/hangul/#사" rel="nofollow">http://www.sayjack.com/learn/korean/hangul/#사</a></p>
      <p>So if Koreans describe the sound 'sun' with Hangul, it would be "썬".<br>
      If you write 'sun' as '선', Koreans will read it with the soft /s/ sound that you hear from the second link.<br>
      With the same reason, 'slow' will be written as '슬로우', not '쓸로우'. If you write it as '쓸로우' using the same /s/(ㅆ) sound as in 'sun'(썬), Koreans will read it with the strong /s/ sound found in the first link.&nbsp;</p>
      <p>The following youtube video is not related to the topic at all.&nbsp; I only include this here so that you can hear how the sound of '선' is different from '썬' in Hangul, even if both are written as 'sun' in English.<br>
      This Korean guy's first name happens to be 'Sun', but he pronounces it not as the English 'sun' sound. It is the soft /s/, because his name is written as '선', not as '썬' in Hangul.</p>
      <p>You only need to watch the first ten seconds to hear how he pronounces his name 'Sun'.&nbsp;</p>
      <p><a class="freelinking external" href="http://www.youtube.com/watch?v=XlCuJa_bFS8&amp;feature=channel" rel="nofollow">http://www.youtube.com/watch?v=XlCuJa_bFS8&amp;feature=channel</a></p>
      <p>&nbsp;</p>
      <p>There still might be people who don't hear the difference between the two sounds.<br>
      So I think it might be better to describe ㅅ, ㅆ with just a 'strong s' and 'soft s', rather than giving example words. Even if it might be a bit ambiguous, it will help to avoid misunderstandings. </p>
      <p>Thank you all for your opinions.<br>
      Without your help, I think I wouldn't have realized what I did wrong.</p>
