      <p><cite> There's also "breath" and "breathe", unaspirated and aspirated /th/, though the pronunciation of the vowel also changes. (I like the use of slashes here—is that standard practice in linguistics?) </cite></p>
      <p>'breath' and 'breathe' are, again, examples of a difference in voicing. Aspiration is a different (though related) animal which is not contrastive in English (cf. 'stop' [stɑp] vs. 'top' [tʰɑp]).</p>
      <p>In linguistics, slashes are used to indicate phonemic transcription, whereas square brackets are used to indicate phonetic transcription.</p>
      <p>André</p>
