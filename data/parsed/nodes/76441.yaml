      <p>@William,</p>
      <p>Nor do I believe that I pronounce the /s/ in 'sun' and 'slow' differently. However, the pronunciation given in the COED cannot be used as evidence that no difference exists. English dictionaries aimed at English speakers give <em> phonemic </em> rather than phonetic pronunciations. The difference between /z/ and /ts/ is contrastive in English, which is why the dictionary notes this difference. Purely phonetic differences (e.g. the different vowel lengths in 'mat' and 'mad') are generally not indicated in dictionary pronunciations.</p>
      <p>André</p>
