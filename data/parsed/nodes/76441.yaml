    <p>Hi,</p>
    <p>My name is Darim Kim and I am a graphic designer. </p>
    <p>I am currently working on my personal project related to Hangul, which is the Korean writing system.</p>
    <p>I designed the attached "Periodic Table of Hangul" for the sake of compiling the essential information about Hangul, especially for beginners. The purpose of this design is introducing Hangul to non-Korean speakers. It does not cover every single aspect of Hangul, and I do not think people will master Hangul with this wallpaper. However, I believe that they can start reading and writing Hangul with this and that is all I expect. </p>
    <p>I have tested this design with a few people and revised it several times. While I was reviewing the information by myself, I started to feel that I need more opinions to make this design useful. </p>
    <p>So I attached the image here to get some input from the experts like you. I appreciate your critique of the overall information and design.<br>
    (I posted this topic here, not under the Critique forum, since I want to hear your opinions as a user about the comprehensibility of the content.)</p>
    <p>After I finish the design, I will release the wallpaper (for free).</p>
    <p>Thanks a lot in advance! :)</p>
    <p>Edit(11/17/2010): The original image of the post was deleted. Please check the updated file in the following link.</p>
    <p><a href="http://www.aboutletters.com/2010/11/periodic-table-of-hangul-updated/" title="http://www.aboutletters.com/2010/11/periodic-table-of-hangul-updated/">http://www.aboutletters.com/2010/11/periodic-table-of-hangul-updated/</a></p>
