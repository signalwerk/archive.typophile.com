      <p><cite>I know I don't hear the difference between the voiced and unvoiced versions of "th", but most phonetic descriptions of English do include that distinction. As "s" is a similar sound, this distinction might exist for it as well. </cite></p>
      <p><cite>Usually, by English speakers, "s" is considered to be the unvoiced version of "z", but no distinction like that one exists for the two versions of "th", so the subtler distinction existing for "th" could also exist for "s". </cite></p>
      <p>The distinction between /θ/ and /ð/ is <em> exactly </em> the same as the distinction between /s/ and /z/ -- unvoiced vs. voiced (cf. 'thigh' /θaɪ̯/ and 'thy' /ðaɪ̯/). There's nothing more subtle about it. The reason some English speakers find this more problematic (apart from the fact that the distinction isn't represented orthographically) is the fact that there are, for historical reasons, very few English words which differ only by these two sounds.</p>
      <p>The Korean tense consonants involve an entirely different phonological contrast which, as far as I know, is found only in Korean (which is why providing a good description of it for non-Korean speakers is inevitably difficult).</p>
      <p>André</p>
