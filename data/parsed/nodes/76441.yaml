      <p>From what I can tell by listening to the sound files you provided, and what I remember from hearing others, it sounds to me like the difference between /ss/ and /s/ is that /s/ has some aspiration after it and /ss/ doesn't: /ss/ = [s] and /s/ = [sʰ]. Though I may be getting out of my depth, I would further guess that the reason Koreans transcribe the two sounds differently isn't because of a difference they hear in English speakers' speech, but because someone decided that an English /s/ + consonant should be transcribed with Korean 스 + consonant, but English /s/ + vowel should be transcribed with Korean jamo starting with ㅆ, and then that just became a precedent. Like I said, I don't know if this is actually true, but it's what I'd guess happened. </p>
      <p>Quadibloc, the distinction between [s] and [z] in English is exactly the same as the distinction between [θ] and [ð]: the first in each pair is unvoiced—or at least, so I've learned in all my linguistics classes and so the IPA chart indicates. For a minimal pair between the two kinds of /th/, the classic example is "thy" versus "thigh".</p>
