      <p>I've just been learning Hangeul myself recently, and how to pronounce Korean. I might be wrong about some of this stuff, but here goes.</p>
      <p>I wouldn't use the idea of Spanish to describe the doubled consonants /bb/ /dd/ /gg/. As far as I know, the unvoiced plosive series /p/ /t/ /k/ in Spanish is just the basic, unaspirated, unvoiced plosive series, without any particular emphasis. So it would be closer to the sound of Korean /b/ /d/ /g/. I certainly wouldn't use the word "pizza" to describe Korean /jj/, because English speakers just use a simple /ts/ there. And people will just be puzzled when you say /ss/ is like the /s/ in "sun" but not in "slow". </p>
      <p>The tough part is, I don't know what to suggest you change these to. It's really hard to describe the doubled consonants concisely, because they're so unlike anything English speakers are used to. I guess you could say they're like the single series of ja-eum, but stronger (harder?). You might want to describe the single ja-eum as like their Spanish counterparts. Or, you could also do it like this: Korean /b/ is like the /p/ in "spin"; Korean /d/ is like the /t/ in "stop", and Korean /g/ is like the /k/ in "skip". After an /s/, English plosives aren't aspirated. Actually, you can even use this fact to distinguish between /j/ and /ch/: Korean /j/ is like the /ch/ in "exchange". But you won't be able to do anything like this for /ss/—you may have to just say it's like /s/ but stronger, or maybe longer. (I'm not totally clear yet on the difference between /s/ and /ss/, so I'll have to let you think of the best word.)</p>
      <p>Altogether, it's a really cool poster. And despite having studied this a fair amount, I still learned stuff I didn't know, like how to pronounce /oe/. Fun idea.</p>
