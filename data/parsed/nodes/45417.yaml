    html: |-
      <p>jharvey's desciption is quite good. But if I may add a little bit more to it:</p>
      <p>1) Make a circle using the circle tool<br>
      2) add a point (highlighted area) <strong> Use Object &gt; Path &gt; Add Anchor Points. That will give you anchor point exactly at 90°.</strong><br>
      3) delete the point (select with open arrow tool, delete)<br>
      4) click the left point with the pen tool and draw a straight line up<br>
      5) expand the outline</p>
      <p><strong> Use Smart Guides. That will help when drawing in 90°</strong></p>
    html_clean: |-
