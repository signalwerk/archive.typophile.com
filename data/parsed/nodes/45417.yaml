    html: |-
      <p>Since illustrator does not let you draw circles according to non horizontal or vertical diameter you must use a combination of Thales' and Pythagoras' Theorems in order to do this geometrically:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/thales_4050.gif"></div><p></p>
      <p>* construct a line from the center of your circle (we call this X) to your point B. We'll call this line a<br>
      * in order to construct the Thales circle which will intersect with the original circle at the tangent-point we need the length of a<br>
      * create a rectangle with X and B as corners. note the height and width of this rectangle. We'll call those b and c<br>
      * In the example picture, applying Pythagoras to find a = sqrt(b^2 + c^2) = 228.89 pt gives the diameter of the Thales-circle<br>
      * Create a circle with a for its height and width and drag its center on the center of the rectangle you constructed on X/B<br>
      * The points where this circle intersects with the original circle are the suitable tangent points.</p>
    html_clean: |-
