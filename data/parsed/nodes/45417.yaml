    <p>here's a common problem when constructing geometric glyphs (glyphs based on basic geometrical shapes):</p>
    <p>there's a given point A on the canvas and an unknown point B on a curve (circle). that's the case for example when drawing a "6".</p>
    <p>thus, we need to construct a tangent -- but how? we can do it approximately, but how to do it precisely, so that the transition between the curve and the tangent flows smoothly  but still geometricaly?</p>
