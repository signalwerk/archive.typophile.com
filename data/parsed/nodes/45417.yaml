    html: |-
      <p>perhaps this solution will be helpful ...</p>
      <p>1) Make a circle using the circle tool<br>
      2) add a point (highlighted area)<br>
      3) delete the point (select with open arrow tool, delete)<br>
      4) click the left point with the pen tool and draw a straight line up<br>
      5) expand the outline</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/illo1_5246.jpg"></div><p></p>
      <p>or, with the overlap image you posted, you can use<br>
      Pathfinder &gt; Divide and then click away the extra pieces using the open arrow tool.</p>
