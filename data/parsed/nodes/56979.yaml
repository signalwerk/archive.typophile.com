    html: |-
      <p>@ celinenguyen Thanks! At this point, we think we will be implementing an italics on/off button in the future. A massive wall of italics can be a bit stressful on the eye and brain... I just love the look of it so much... and I guess I really like seeing something different too... but, because purpose number one of a blog is to relay information, you, and many other people are correct, the italics is probably not the way to go. Beyond that, there are some legibility issues in a few key spots, which is something I'm am still learning to grasp making the jump from a 300dpi world to 72dpi. </p>
      <p>The font in the side column you're speaking of is one of Adrian Frutiger's masterpieces (and one of my all time favorite sans-serifs): Univers (59 Ultra Condensed)... my God I love this font. I would put it head to head against Helvetica any day. The G: beautiful... you should see the Q!</p>
      <p>@ aluminum Hahaha. Yes, I think after doing something like this you really learn to appreciate the value of wordpress, but I'm really happy we did it, we have learned SO much — one of those things being the no-nos of table usage — will be avoiding them unless absolutely necessary in the future. :)</p>
