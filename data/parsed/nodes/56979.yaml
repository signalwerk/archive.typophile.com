    <p>Hello fellow type lovers. </p>
    <p>I recently made the jump from the print design world to the web design world this past year and partnered with a friend and former design colleague to build websites. We decided to try our hand in building a design blog &amp; CMS for ourselves from the ground up — no wordpress, no blogger, no drupal. Needless to say, it was a massive learning experience for the both of us but it's been fun and gratifying and that makes it worth it.</p>
    <p>Before we release this thing out into the wild world web we thought it would probably be a smart idea to solicit some of the sites in the design community we respect and frequent for some critiques and tips. And basically, when it comes to sage design advice and inspiration, I really don't think there's any design community out there better than typophile. That said, if anyone here has a quick second to take a look and kick the tires of this thing, we would really appreciate the feedback.</p>
    <p><a class="freelinking external" href="http://www.sugarpillfactory.com/blog" rel="nofollow">http://www.sugarpillfactory.com/blog</a></p>
    <p>I am expecting a fair amount of, "Times New WTF ital.?" but I really wanted the look to be a bit different than what I see every single day over the web. I'm so sick of web-safe fonts it hurts. So be ready... the body is Times New Roman — Italic. We like it for the time being... although I'm positive not everyone will.</p>
    <p>Let me know what you think and thanks in advance!</p>
