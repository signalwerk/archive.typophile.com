  html: |-
    <p>I am in love with the whole relationship/style of the <a class="freelinking external" href="http://www.felicianotypefoundry.com/cms/custom-fonts/sueca" rel="nofollow">Sueca Family</a>. </p>
    <p>Can anyone suggest a set of 3 or 4 typefaces that would provie the sort of classic-yet-21st century look and feel that these have? I particularly like the geometric feel of the sans and slab, and how the serif compliments it without being radically different.</p>
    <p>I am very eager to hear any thoughts.</p>
