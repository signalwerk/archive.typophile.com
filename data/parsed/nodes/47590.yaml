      <p><cite>"I can just imagine you all thinking what the hell kind of beast is that on the logo! I feel the same way. It’s a manta ray... not my choice."</cite></p>
      <p>Not an excuse. Try to direct your customer to a better concept by showing them. They picked some mark that is not clear for everyone at first sight. That is not a well known animal and looks like a bat... Ugly, even scary. What I first saw was a forefinger and a thumb pulling a sticker from its edge. Forget the sign boards and make a good logo that will work everywhere. You need a new concept.</p>
      <p>Divers, mermaids, waves, fish are first marks come to my mind. You asked for beasts. Why not go for cute animals like dolphins, sea horses, tropical fish if an animal is a must?</p>
