      <p>The first thing I saw was a strange arm with a claw.  I think the ray from a top-down view might be stronger.  The type also lacks cohesion, and I don't like your name in italics.  In fact, the whole treatment lacks balance and flow.  </p>
      <p>I would suggest getting the mark solid first, and then worry about the type, particularly if the manta ray is a non-negotiable in the piece.  Otherwise, you're just fiddling around with type to compliment a not-so-particularly strong mark.</p>
      <p>--<br>
      Nick Hladek</p>
