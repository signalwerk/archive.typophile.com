      <p>Paul:</p>
      <p>I feel, as I am sure many here will agree, that when redesigning a logo it is important to redesign it and not waste more money by investing in a flawed and unmemorable mark.</p>
      <p><cite>They rely heavily on repeat customers. I thought therefore to acknowledge the old repeat customers it would be only fair to stick with a logo that they know for nostalgic purposes...<br>
      Apart from all that we’re very open to new ideas for a logo, doesn’t have to be a ray. I also like the idea of a manta ray from top view but one of Aqua Venture’s competitor has done it.</cite></p>
      <p>You must realize then that this mark is not even unique and is used by their main competitor! And as bad as their logo is, this is not any better.</p>
      <p>Anyway, I do not like the italic type on top. Try it in Avenir Bold. The colors are quite muted also and not really helping. Why not work in black and white first?</p>
      <p>I would also say 'OCEAN SPORTS HOTEL' to make it clearer. As for the 'LTD' that will just confuse the identity and a legal business structure means nothing to their customers.</p>
      <p>Hope this helps.<br>
      Jay</p>
