      <p>Ok thanks for bringing that up, Ocean Sports is a hotel on the coast in a town called Watamu. Aqua Ventures is the Scuba center based at Ocean Sports. The two however are separate business entities and have little to do with each other. Around here it is understood that Ocean Sports is the "host" hotel, but yours is still a very good point... most tourists might not be aware. </p>
      <p>Should I put "at OCEAN SPORTS - WATAMU"?</p>
      <p>And Aqua Ventures is a limited company, so should I put "AQUA VENTURES LTD" at the top?</p>
      <p>Also what to people think of the mix of font faces? I very much like the ITC Legacy Sans at the bottom, but not sure about the Avenir at the top.</p>
      <p>Also AQUA VENTURES is biased to the left, but balanced out by the golden sun biased to the right... how does that flow with Scuba Dive in the center?</p>
      <p>Thanks</p>
