    html: |-
      <p>Thanks everyone, Nick you are quite right, I should get the mark right before I worry about font.</p>
      <p>Let me give you some history about the client. They have been using the manta ray in their logo for 20 years. They were the first, and remain the most reputable Scuba enterprise on the Kenya coast. Here is their very first... and still current logo.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/old logo_6482.GIF"></div><p></p>
      <p>They rely heavily on repeat customers. I thought therefore to acknowledge the old repeat customers it would be only fair to stick with a logo that they know for nostalgic purposes, but equally to acknowledge them by updating it and giving them the impression that the company is still strong after 20 year and they're going to get the same professional personal treatment they're used to. (You know what it's like when you're a regular at a joint and then they get a new corporate image and you feel you're not a part of it anymore?)</p>
      <p>Apart from all that we're very open to new ideas for a logo, doesn't have to be a ray. I also like the idea of a manta ray from top view but one of Aqua Venture's competitor has done it: <a href="http://www.buccaneerdiving.com/" title="http://www.buccaneerdiving.com/">http://www.buccaneerdiving.com/</a></p>
      <p>Any suggestions on other interesting beasts of the ocean/how to turn them into captivating logos?</p>
