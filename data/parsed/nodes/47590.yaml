    <p>Hi guys,</p>
    <p>I wish I was as creative as some of the work I've seen in this forum! Nonetheless would you mind letting me know your thoughts on this logo for a scuba diving company in Kenya. What I have attached is the logo incorporated into a sign board. The idea is to make large sign boards to place around the town. Each will be like 2m square and will be white board with 3 colours of vinyl stuck on, navy blue, mid grey, and gold.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_5436.gif"></div><p></p>
    <p>I can just imagine you all thinking what the hell kind of beast is that on the logo! I feel the same way. It's a manta ray... not my choice.</p>
