      <p>As a diver myself, I do not feel attrackted by the logo.<br>
      Personaly, I'm looking for fibrant. Bright. Happy. These colors are too much business-like for me. Oke, I don't know the underlying identity. But I my experience all the dive-masters were people loving their job. The business 'comes in second place. They love this life. Reflect this. </p>
      <p>It is too much of the same. It is not unique.</p>
      <p>Why use two typefaces? Have you tried just using just one, more contemporary?</p>
      <p>You can always choose to use just a part of the ray.</p>
      <p>I can't find a real concept in you text. Maybe you are just concentrating too much on the graphics now. First make sure you have got a good working concept. Then concentrate on the graphics.</p>
      <p>Hope this helps, too.</p>
      <p>Success!</p>
      <p>Ray</p>
