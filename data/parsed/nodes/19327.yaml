    html: |-
      <p>To me a book version should be optimized for a optical size of 9pt. So it will work in a range from 7 - 10pt. It should be wider and a bit bolder than the common 12pt Design. But some designers and foundrys use the term book in a very lax way and made minor changes compared to the 12pt design.</p>
      <p>—<a href="http://www.astype.de" target="_blank">astype.de</a>—</p>
