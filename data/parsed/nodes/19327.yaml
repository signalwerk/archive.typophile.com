    <p>(Apologies, as I am not (yet) formally design/typographically educated.)</p>
    <p>A simple straightforward question:</p>
    <p>A ‘book’ variant of a font is designed to be more effective in a situations where there is heavy or continuous text, as in, in a book?</p>
    <p>Yes/No/Maybe?</p>
    <p>Are there generic similarities in terms of the difference between normal and book variants? For example, is the tracking on book variants generally less/more?</p>
    <p>Thanks for your drips of knowledge.</p>
