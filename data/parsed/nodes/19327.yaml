    html: <p>Most text types are issued without optical sizes, such that a good deal of the type’s structure is determined by the requirement that it work well enough at 9 pt and 96 pt. A book version - not really a weight so much as an optical size - should work better at the normal sizes for immersive reading - 10 to 14 pt, say.</p>
    html_clean: <p>Most text types are issued without optical sizes, such that a good deal of the type’s structure is determined by the requirement that it work well enough at 9 pt and 96 pt. A book version - not really a weight so much as an optical size - should work better at the normal sizes for immersive reading - 10 to 14 pt, say.</p>
