    votes: null
    html: <p>The word BOOK refers to the weight variant and nothing else. Very few typefaces have optical sizing. However, that’s not to say people aren’t working on this. More and more you will find DISPLAY, SUBHEAD, TEXT, and CAPTION in PRO versions of fonts. In such typefaces as <a href="http://store.adobe.com/type/browser/landing/garamond/garamond.html">Adobe Garamond Premier Pro</a> and other typefaces, not OT, but their designer’s are aware of the needs of today’s users.</p>
