      <p>From the Wiki - <a href="http://typophile.com/wiki/weight">http://typophile.com/wiki/weight</a> …</p>
      <p>The visual darkness or lightness of the strokes in a character: ultralight, light, book, medium, regular, semibold, black, ultrablack, extrablack, etc.</p>
      <p>…although I think there was some recent debate as to where book should fall in the spectrum.</p>
