  html: '<p>We just received the news that Morton Friedman, the brother of Filmotype founder Allan Friedman has passed away at 89 on Thanksgiving day. He was instrumental in the success of both Filmotype and later Alphatype as the head of sales for both organizations. Further details here: <a href="http://www.columbiapaper.com/index.php/obituaries/2376-by-staff" title="http://www.columbiapaper.com/index.php/obituaries/2376-by-staff">http://www.columbiapaper.com/index.php/obituaries/2376-by-staff</a></p>'
