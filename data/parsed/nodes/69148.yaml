    html: |-
      <p>Upon first glance, the sharp serifs seem less to come to point as they do to bulge nearer the stem; *ahem* sorry. That Moby Dick excerpt put me in a 19th century mode....</p>
      <p>Anyway, that only applies at large sizes, and clearly this is intended for small body copy. You might try curving the bracket though anyway, just so it looks right at both scales.</p>
      <p>The rest of my criticism should be taken with a grain of salt because I suspect that viewing this on screen only is causing some of these problems... I don't have a laser printer at home to test it, though.</p>
      <p>The /r/, as Tomi said, is too narrow. And the /c/ is off balance. I don't know what he's talking about with the stress and the leaning /o/, however.</p>
      <p>The /g/ seems slightly to heavy. Again, this could very well be merely a screen/hinting issue, but looking at the 9pt paragraph, all the /g/s pop out.</p>
      <p>The tops of the lager serifs on the capitals (e.g. on the E, F, I, J, etc.) seem to bulge upward; try dipping them slightly to compensate. Same goes for the lower serif of the /S/</p>
      <p>I would extend the narrow weight on the /U/ a little further down.</p>
      <p>The narrow spots on the /O/ and /Q/ aren't as narrow as those of other letters. This is especially noticeable on the Q because of the narrow bit of the tail.</p>
      <p>As far as other color issues, I would have to see a larger text with a greater variety of capitals. And preferably in print, but I'm afraid I can't help you there.</p>
