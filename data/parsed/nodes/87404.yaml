  html: |-
    <p>I want to create a F and W interlocking letter mark. I am having a tough time because the shapes don't seem to fit well together. Anyone have any examples or ideas of similar letters interlocked?</p>
    <p>When I say interlocking, I am referring to how a lot of sport logos are. The NY for yankees, SF for san fran giants, etc.</p>
