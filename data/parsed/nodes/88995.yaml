      <p>Hey Hrant,</p>
      <p>The original concept was to simply build the show up with Instagram/Hipstmatic/or similar types of images sent in mostly via users' phones… The technology aspect is the main thread tying together the rather general topic of 'photos of found type'.</p>
      <p>However, type is the most important aspect, so I'm hesitant to turn away any special photos... Maybe I will need to adjust the title and concept some.</p>
      <p>You could always just take a new photo of one of your older photos :P</p>
