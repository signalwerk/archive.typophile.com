    <p>Hello Typophiles!</p>
    <p>We are currently organizing the next exhibition in our Berlin gallery space and are looking for your photographic contributions.</p>
    <p>Most of us are avid collectors of interesting type and lettering, photographing the variety of letters we find in our everyday lives (even more so now thanks to our iPhones and other various smart phones). Our upcoming show titled "New Vintage Digital Vernacular Letters" will showcase the huge variety of beautiful letters from all over the world that are encountered and archived.</p>
    <p>The deadline is coming up quickly – you have <strong>2 weeks</strong> to create some new images or to send us some existing finds. <strong>All images need to be received by Wednesday, January 25th</strong> to be included.</p>
    <p>You simply need to snap some photos and email them to <a href="mailto:photos@motaitalic.com">photos@motaitalic.com</a> and include your name (as you'd like it to be displayed on our website and in the show) and an optional link to your website.</p>
    <p>The only requirements are that the images be square, the main subjects are type, and that they are your original photos.</p>
    <p><a class="freelinking external" href="http://www.motaitalic.com/gallery/exhibitions/new-vintage-digital-vernacular-letters" rel="nofollow">More information is available here.</a> If you have any questions please don't hesitate to ask!</p>
    <p>We look forward to seeing your images! And please feel free to help spread the word!</p>
