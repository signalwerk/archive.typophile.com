    html: <p> Your advice to add a pixel to the ascenders and descenders is helpful. <br> <br>It seems there are two directions I could take... <br> <br>One is to add the pixels you prescribe, which adds overall height to the face. Good for readability but not always optimal in bitmap font design. <br> <br>The alternative would be to make the x-height consistent, like you suggest, and eliminate key serifs to accommodate the short height. (So, for example, the ascender on the lc f doesn't run into it's own cross stroke.) <br> <br>Don't even talk to me about kerning yet. Heh. <br> <br>And weights? I started a 10 point but thought I'd hold off until I get the smallest size (7 point) completed since the most constraints exist at the smallest sizes... <br> <br>//jp </p>
