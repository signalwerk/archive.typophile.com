  votes: null
  html: |-
    <p>Only this forum would appreciate the pain...to think that someone deliberately formatted this newsletter/advert. </p>
    <p>She took great care, within the limitations of the email format, to make it appear cheerful: a mix of Comic Sans, Times Roman, Georgia and Arial, including italics and underscores, in five colors and many sizes. Sprinkled with typos and bad punctuation too. </p>
    <p>We have to file this under "doesn't know any better" but am I wrong to think less of this correspondent? I've disguised the personal onfo.</p>
    <p>This is just one third of the entire email, which went on and on and on...<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ugly-email_6298.gif"></div><p></p>
