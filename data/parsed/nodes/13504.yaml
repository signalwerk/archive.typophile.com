    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : How Magazine</strong></p>
    <p><strong>Publisher:</strong> F&amp;W Publications (USA)<br>
    <strong>Frequency:</strong> Bi-monthly</p>
    <p>An American graphic design magazine that features practical information on technology, business tips, helpful resources and designer profiles. Each volume features a business annual, a self promotion competition and an interacive competition. Since 1991 How has also been responsible for holding the annual <a href="http://www.howconference.com/" rel="nofollow">How Design Conference</a> all over North America.</p>
    <p>F&amp;W Publications also publish <a href="/wiki/Print%20Magazine" class="freelinking" rel="nofollow">Print Magazine</a> and <a href="/wiki/ID%20Magazine" class="freelinking" rel="nofollow">ID Magazine</a>.</p>
    <p><strong>Website:</strong> <a href="http://www.howdesign.com" rel="nofollow">www.howdesign.com</a></p>
