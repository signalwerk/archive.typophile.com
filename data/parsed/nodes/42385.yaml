    html: |-
      <p>Any font. Italic and bold is all I need for styles.</p>
      <p>For some well known fonts, e.g. Times New Roman, etc, there are seperate ttf files for italic, bold, and bold italic.  But for ninety percent of the fonts on my system, there is one ttf file for each of them, and windows is generating italic and bold fonts on its own, by some generic transformation.  I want to be able to make a straightforward modification to such a file to make it italic (For example it would be convenient if there were some numeric field among the ttf tables, in which you could specify some default slant angle for italic.)  But anyway, the flash compiler is taking one look at some ttf file and saying, “This isn’t an italic file”,  and it would be a start to know at least how its doing that.  </p>
      <p>Thought that maybe some of you guys that design a lot of fonts might be experts in the ttf file tables.</p>
