      <p>Josh is correct. However, if memory serves (this was years ago that I dealt with this), on Mac OS you used to be able to suppress the OS generating fake italics and bolds by modifying the base font. There were flags in the FOND resource to control this. But that was all: either let the OS do its thing, or disallow it.</p>
