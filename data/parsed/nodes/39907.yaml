    <p>Sometimes it's hard to decide which slot to file a design under, but since this is derived from an old display type of mine, I figure it ought to stay with the display category.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/screenshot_0249_5601.png"></div><p></p>
    <p>This is based pretty loosely on my old <a class="freelinking external" href="http://www.1001fonts.com/font_details.html?font_id=2205" rel="nofollow">Gohan</a> font, available for free if you'd like to compare.</p>
