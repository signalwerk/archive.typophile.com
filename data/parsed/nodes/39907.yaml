      <p>This is really nice! The 4 is so great.</p>
      <p>A few characters that kinda bug me are the lowercase v, maybe could be more pointed at the bottom.<br>
      I think the diagonal on the capital X is too thick. Perhaps the top of the capital T as well.</p>
      <p>I can't wait to see this finished.</p>
  - id: 248878
