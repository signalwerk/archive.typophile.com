    html: |-
      <p>You're right about the x there. Most of these letters are based in the Gohan font skewed 10° (heavily modified thereafter). The swelling of the downstroke diagonals, most obvious in the X, is an artifact of that.</p>
      <p>I'm glad you like the 4, though. It has kind of troubled me, since it is a descending numeral among an otherwise lining set of figures. It is, however, the least derivative from the upright of the set.</p>
      <p>I tried making the v more pointed, but that just resulted in the vertex being too thick, and II had trouble fixing that with a deep ink trap. That solution worked on the uppercase but to make it deep enough to be visible in the lc distorted the strokes too much.</p>
