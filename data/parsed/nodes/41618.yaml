    html: <p>Well I'd personally avoid woodcarver (assuming you're talking about <a href="http://www.myfonts.com/fonts/imageclub/carver/" rel="nofollow">ICG Carver</a>). It doesn't fit the mold of old letterpressed woodtype and it's pretty illegible at any size. I think <a href="http://www.cornerbakery.com/" rel="nofollow">Corner Bakery</a> does a decent job of incorporating different faces for a rustic quasi-show card feel. Perhaps combine Rosewood &amp; Rosewood Fill with some other woodtype faces like <a href="http://emigre.com/EF.php?fid=83" rel="nofollow">Brothers</a>, <a href="http://emigre.com/EF.php?fid=86" rel="nofollow">Council</a>, or some of the <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=searchFonts&amp;type=category&amp;cat=theme&amp;code=old-west" rel="nofollow">Adobe woodtypes</a></p>
