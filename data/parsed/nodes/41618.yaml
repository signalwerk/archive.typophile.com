      <p>Thomas...thanks for the great tip. Since there is so little copy on this I am pretty much hand kerning it all. i did however notice what you mean on the d...very odd...I also had to bring the dot on the i closer to the i.</p>
      <p>You sound like a man who would have a great typeface suggestion I could use with these two fonts (woodcarver is dominant with rosewood playing a lesser role...but the details of the event (rehearsal dinner) are unreadable even in in 11pt.</p>
      <p>thanks!</p>
