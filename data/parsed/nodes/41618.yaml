    <p>Help me out please,</p>
    <p>I am doing a vintage bluegrass meets elegant invite using Woodcarver and Rosewood. I need something for the fine print that looks like Woodcarver Normal...but is much easier to read in a small size. Although I am open to suggestion if something else would go better with those two Display typefaces.</p>
    <p>thanks in advance!</p>
