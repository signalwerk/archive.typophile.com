    <p><strong>Linotype’s LinoLetter for February 2007 – Linotype.com adds thousands of fonts</strong></p>
    <p>Check out the full version of this month’s newsletter at the Linotype website: <a href="http://www.linotype.com/38-21412/issue200702.html">http://www.linotype.com/38-21412/issue200702.html</a></p>
    <p><em>Content Preview:</em> 2Since the beginning of January, our webshop’s product range has increased, with over four thousand more fonts now available for customers to peruse! While these primarily include typefaces from the Monotype and ITC libraries, a notable addition is a very new Linotype Original: Agilita – a new sans serif family with 32 styles, created by German designer Jürgen Weltin. With over 10,000 fonts now available, Linotype.com has become a larger, more thorough resource. But what if you are looking for just a single face? Fortunately, to coincide with our bigger shop, we’ve also improved the functionality of our search engine considerably. Now finding the right font for your work should be easier than ever before, whether you choose to navigate through all of our new additions or not. </p>
    <p><a href="http://www.linotype.com/38-21412/issue200702.html">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="https://www.linotype.com/newsletter.html">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
