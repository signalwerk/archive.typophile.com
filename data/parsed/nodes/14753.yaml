    html: '<p>even <em>the 2-storey ‘a’ and the binocular ‘g’</em> have handwritten origins. take a look at the <a href="wiki/carolingian minuscule" class="wiki">carolingian minuscule</a> and you’ll see both in a calligraphic hand. the same is true for <a href="wiki/cyrillic" class="wiki">cyrillic</a> letters: they were all based on handwritten models. It is true that some were tweaked to become the cyrillic alphabet we are used to seeing today, but  even the old <a href="wiki/poluustav" class="wiki-create">poluustav</a> models correlate quite strongly with the forms that are used today. To better understand where these letter forms are coming from, i’d recomment <a href="wiki/Vladimir Yefimov" class="wiki-create">Vladimir Yefimov</a>’s article on “<a href="wiki/Civil Type" class="wiki-create">Civil Type</a> and Kis Cyrillic,” which can be found in <a href="wiki/Language Culture Type" class="wiki">Language Culture Type</a>.</p>'
