    html: |-
      <p>Every character has a largely chirographic, but also some lapidary*, origin. But the future? That’s up to us. And in something like the Cyrillic De, it might in fact be a good time to reform it (although pragmatically, always).</p>
      <p>* Consider for example that the Greeks made entire letterform stems and such with single strikes of the chisel (see Catich).</p>
      <p>hhp</p>
