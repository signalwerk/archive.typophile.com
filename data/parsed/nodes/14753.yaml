    <p>Hi,</p>
    <p>The roman typefaces I am familiar with have mostly handwritten origins (save for the 2-storey ‘a’ and the binocular ‘g’, I assume). I am confused by the cyrillic ‘De’ character. It looks pretty awkward to write. What’s the deal? The rest of the characters look simple enough.</p>
    <p>- Chris</p>
