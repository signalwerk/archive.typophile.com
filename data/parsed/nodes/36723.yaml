      <p>Super! I have to say LJUBLJANA never looked so good :-)</p>
      <p>Can't tell ou much about the greek or cyrillic, but I can say that the trasitions from straight into curve are generally not smooth enough. See your U. It starts to high, and needs more "shoulder" in the curve. Just dropping the points without moving the handles might work. This is a global problem.</p>
      <p>Also global, it looks like you drew this as a single line is Illustrator and added a stroke. That's fine for a starting point, but causes problems: 1. The horizontals should be a little thinner everywhere. 2. tight curves are had to control like the apex of the A. 3. The joins have a tendency to get too dark. This is less of a problem at light weights, and gets worse as you get darker.</p>
      <p>Randy</p>
