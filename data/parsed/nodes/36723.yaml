      <p>Wow, thanks for all the comments.</p>
      <p>@randy: I don't quite see what you mean about the U and other curves, but I'll play with the "shoulders" and try to see it. The font began as a single stroke in FontForge, so it should be easy to try a slight width variation.  I'm definitely not going darker, though, so no worries there.</p>
      <p>@cerulean &amp; @litera: I guess I need to fix the T. :( My next step is to expand this into upper and lower case versions, so that shouldn't be a problem.</p>
      <p>@litera: That's about the biggest compliment you could give me on this font -- I began to see it in my head as I walked from the train station to a hostel in Ljubljana, with the city all around me. I began the sketches that night. </p>
      <p>Maybe the middle of the S is too diagonal... would it be better if it were flatter?  Or would the e, c, and s look more like part of the family if the serif was smaller?</p>
      <p>I'll post another sample once I've got something new to show.</p>
      <p>-matt</p>
