    html: |-
      <p>Based on the fact that I live in a country with its capitol named Ljubljana I must say that this looks very nice. It looks like Ljubljana (the city) in the 60's. To make it more nowadays it should be a bit stronger and less hight variable. Probably.</p>
      <p>What I don't like is the T because to me it gets confused with an F.</p>
      <p>I also don't find e, c and s as part of the same family. Especially s looks like it has more "envy" or even "hatred" in it and I don't think that goes well with other characters and especially not with Ljubljana itself.</p>
      <p>Cyrillic is quite ok, but I think you need to work on the Greek typeface a bit more, because characters don't match the style of Roman and Cyrillic.</p>
