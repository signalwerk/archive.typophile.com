    html: |-
      <p>The problem with your "s" is that it's not symmetrically open. the bottom is open and welcoming, the top is closed and "to itself". Serif definitely adds a lot to that.</p>
      <p>On the other hand if you would make those "serifs" smaller it would distinguish those forms from the rest and eventually you'd have to discard them.</p>
      <p>When I was saying that design goes well with Ljubljana I meant the word "Ljubljana" goes well with the city. Other words and letters in them don't fall in the same group. I suggest you start making changes on the letters based on those that are in the word Ljubljana. Because those are looking pretty ok to me.</p>
    html_clean: |-
