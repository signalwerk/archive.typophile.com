  html: |-
    <p>Based in Vancouver, <span class="caps">BC</span>, Canada, Emily Carr Institute is a learning community devoted to excellence and innovation in visual arts, media arts and design. They offer a rich variety of degree programs and continuing studies courses. They have galleries, studios, workshops, classrooms and labs all centred on art, media and design. Emily Carr is one of the world’s premier art&nbsp;institutes.</p>
    <p><a href="http://www.eciad.ca/www/">http://www.eciad.ca/www/</a></p>
