  html: |-
    <p>Hi all,</p>
    <p>I am looking for a sans-serif typeface to match Papyrus (not my choice - I loathe that font). It will be used on a website, for menu headings and also body text. Even a suggestion of what characteristics would match would be helpful- humanist, geometric, grotesque etc. The website is for a horror/thriller film, if that is any help on choosing a font.</p>
    <p>Looking forward to any recommendations to solve this conundrum!</p>
    <p>Regards,</p>
    <p>David</p>
