    html: <p>The style of 'r' is relatively unusual in flowing scripts, and I think you will have to draw your own, but another alternative with quite similar loops could be Rob Leuschke's 'Corinthia' from Bitstream. This sample is of the older version with smaller numerals (Script Font ID Guide, Part 7) <br><img src="http://www.typophile.com/forums/messages/83/68130.gif" alt="Corinthia sample"></p>
