    html: <p>I think GN is totally right about the centrality of balancing the Black and White. I call it notan (a Japanese term). Ironically, notan is the reason his theories of type design don't make sense! <br> <br>&gt; "Real characters have built-in stabilizers that keep black shapes in the forground" <br> <br>There is no foreground (at least not during immersive reading). We read notan, the balance, not the Black and White separately. <br> <br>The relevance of notan to type design is complex, because we have to design "firm" atomic blacks, but half the whites (the sidebearings) exist on a more abstract level (since they only work in pairs). OpenType actually allows us to equalize the treatment of Black and White (by designing entire words which would get swapped in contextually), but I don't see many people doing that... <br> <br>hhp <br></p>
