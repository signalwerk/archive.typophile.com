    html: <p>Excellent topic, William. A typeface that dazzles is <a href="https://web.archive.org/web/20080829232007/http://www.myfonts.com/fonts/urw/vendome/t-regular/testdrive.html?s=Sparkle%20and%20Shine&amp;p=48&amp;refby=typographica">Vendome</a>, <br>which is why I use it so successfully for display, but never text. <br>But I'm afraid I can't explain exactly why it dazzles, other <br>than the sharp serifs.</p>
