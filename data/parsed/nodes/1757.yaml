    html: <p>Thanks, Hrant. Very interesting. I hadn't thought of symmetry as a factor. <br> <br>I am hoping that this will lure some others as well into spilling secrets of 'notan'. As well as Kent Lew's accomplishment, mentioned above, James Montalbano's Clearview seems to be an example where this was thought out carefully.  <br> <br>He notes on his website that the typeface is designed to reduce 'halation' experienced by older drivers looking at lighted signs at night. <br> <br>What is this about? <br> <br>For myself, I think that fineness of lines and points can create dazzle, as well as evenly spaced parallel lines. I think there are psycho-optical effects going on that affect comfort in reading, but they do seem to be complex.  <br> <br>  </p>
