    votes: null
    html: |-
      <p>Thank you all for taking time and giving me feed back. </p>
      <p>Eliason, you are right about the crossbar on the A. I used the same thickness as on the R, logic instead of feeling.. Looks much better slightly thinner. I'm working on the "in between" spacing (attached) and I think it works better as you suggested.</p>
      <p>Since the brand will be launched extremly fast I think it's important to signal fashion. I have researched the brands that the target group buy when they are not pregnant and these brands use either the "Didot style" or the "bold sans style" in their logos. The Lulu clothes themself are more in the bold sans category design wise (marc jacobs, helmut lang, jil sander).</p>
      <p>I really want to avoid tendrils and floriation, thats not what I want to go for. The photos, hang tags etc will deliver the femininity and trends. The logo should be timeless and not avant garde in any way.</p>
      <p>The Lulu brand wants to take a part of the market by not beeing pink and girly but delivering serious fashion to desperate women with a big spending habit when it comes to fashion.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bild-1_4054.png"></div><p></p>
