  html: |-
    <p>Hey, i just compleated a self negotiated brief i did.. i just felt like coming up with a pure typographical poster for a l=kind of front cover for the guardian newspaper... i know it wouldnt be used as a front cover!.. just fun really as i'm quite obsessed with making things out of linocutting.. like the linocut animations i have done..</p>
    <p>anyway i am wanting to send a print of this (a bit bigger then A0) poster to the guardian. I dont know if they would like it, but i want to send it, but on the website it says i think that they do not like receiving artworks.. so yea i dont think i can send it? what can i do? i dont even know if they would like it..</p>
    <p>cheers</p>
    <p>my flickr that shows the carving itself is <a href="http://www.flickr.com/photos/markandrewwebber/sets/72157603892334695/" title="http://www.flickr.com/photos/markandrewwebber/sets/72157603892334695/">http://www.flickr.com/photos/markandrewwebber/sets/72157603892334695/</a><br>
    at the bottom</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2530477564_fbd34c58c8_3667.jpg"></div><p></p>
