    <p>What is the font in the logo of New York-Presbyterian hospital?</p>
    <p>The logo is at <a href="http://www.med.cornell.edu/cms/nyp/i/h1_logo_nyp2.gif">http://www.med.cornell.edu/cms/nyp/i/h1_logo_nyp2.gif</a> and appears at the top of <a href="http://www.nyp.org/">http://www.nyp.org/</a></p>
    <p>WhatTheFont says Phoenica, Faricy, or Aldersgate, but none of those appear to match.</p>
