  html: <p>This is a pixel font I have been working for a few weeks. I am part of the class of the class from UW-Stout placing their specimens over in the Display forum. <br> <br>This typeface shows the truth of spoken word through voice stress recognition.  <br> <br>This is optimized for the screen because initially I wanted to use this as an option on a television that would listen to broadcast voices and determine the truth of the statements(ie State of the Union Address). <br> <br>It is aesthetically influenced generally by Blackletter faces based on the decorative nature and its past use as the dominant typeface in one regime.<img src="http://www.typophile.com/forums/messages/29/28009.jpg" alt="afton"> <br> <br>All comments are welcomed. <br> <br>jp</p>
