    html: "<p>Well I have gone back to the drawing board of sorts and tried to thicken this up.  <br> <br>I have so many questions about pixel fonts that I have I don't even know where to start. I am concerned that I need to stick to this screen-based font, otherwise it loses its meaning. Its like chocolate chip cookies without the chips.  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/28635.jpg\" alt=\"\"> <br> <br>When I posted in the build forum about how to approach this I got a bunch of responses, but none that I could make any sense of. Sort of type geek talk with em units being thrown all around and debate between type designers, but not directed toward a \"beginning\" student in type design. <br> <br>So I have some questions: <br> <br>How does everyone else build their pixel type? Fontlab, Illustrator, other?  Can I build a pixel font in Illustrator? <br> <br>What should I be using if I don't have Fontlab available and only Fontographer? <br> <br>If I am building in a program like illustrator what is a general grid that I should set up to effectively make a readable pixel font? <br> <br>Other considerations I should take into mind? In simple terms if at all possible. <br> <br>And finally what is going on with this face. Ideas, critique, etc. <br> <br>jp <br> <br></p>"
    html_clean: "<p>Well I have gone back to the drawing board of sorts and tried to thicken this up.  <br> <br>I have so many questions about pixel fonts that I have I don't even know where to start. I am concerned that I need to stick to this screen-based font, otherwise it loses its meaning. Its like chocolate chip cookies without the chips.  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/28635.jpg\" alt=\"\"> <br> <br>When I posted in the build forum about how to approach this I got a bunch of responses, but none that I could make any sense of. Sort of type geek talk with em units being thrown all around and debate between type designers, but not directed toward a \"beginning\" student in type design. <br> <br>So I have some questions: <br> <br>How does everyone else build their pixel type? Fontlab, Illustrator, other?  Can I build a pixel font in Illustrator? <br> <br>What should I be using if I don't have Fontlab available and only Fontographer? <br> <br>If I am building in a program like illustrator what is a general grid that I should set up to effectively make a readable pixel font? <br> <br>Other considerations I should take into mind? In simple terms if at all possible. <br> <br>And finally what is going on with this face. Ideas, critique, etc. <br> <br>jp <br> <br></p>"
