    html: "<p>Hey, pixelfonts are a hack, so it's technical! <br>But your Fontographer is plenty. <br> <br>Visualize the font's vertical space (\"EM\") spanning a number of pixels onscreen -depending on point size and dpi- and you can figure out how your font's \"space\" needs to be structured. <br> <br>For example a font with an EM of 1000 (the norm) set at 8 points at 72 dpi will have a \"pixel block unit\" of 1000/8 = 125. In your case it looks like you have a vertical span of around 16 pixels*. That doesn't divide into 1000 roundly. What you can do is either go up to 20 (so have pixel blocks 50x50), or have some \"internal leading\": like have blocks of 60x60, which means you use 16 x 60 = 960 units of the EM for the letterforms, and that leaves 40** units empty. Then when you go to use the font you use the point size you targeted (like 20, or 16). <br> <br>* I'm counting top-to-bottom of the lc, which is the most useful measure. <br> <br>** It's best to distribute this blank space more to the top than the bottom, like 30/10 in this case. <br> <br>There are also other issues though, like overlaps/touching between blocks, internal spaces coming out black instead of white, etc. <br> <br>As for the font itself, allow me to leave that to others - I have my own bitmaps to finish!  :-) <br> <br>hhp <br></p>"
