    html: '<p>Unless this will be set pretty large (which seems unlikely if it’s supposed to transcribe a full speech and stuﬀ), it’s too light: <span class="caps">TV</span> fonts need to have much more body, especially in the horizontal (ie vertical stems). <br><br>But the idea itself is pretty cool, and I like the blackletter basis too. <br><br>One more thing: if you can make the two variants “uniwidth” (where a given character has the same set-width in either font), that’ll help you dynamically swap in one of the font styles for a single word or something without aﬀecting the rest of the setting: less movement, more readability. <br><br>hhp <br></p>'
    html_clean: '<p>Unless this will be set pretty large (which seems unlikely if it’s supposed to transcribe a full speech and stuﬀ), it’s too light: <span class="caps">TV</span> fonts need to have much more body, especially in the horizontal (ie vertical stems). <br><br>But the idea itself is pretty cool, and I like the blackletter basis too. <br><br>One more thing: if you can make the two variants “uniwidth” (where a given character has the same set-width in either font), that’ll help you dynamically swap in one of the font styles for a single word or something without aﬀecting the rest of the setting: less movement, more readability. <br><br>hhp <br></p>'
