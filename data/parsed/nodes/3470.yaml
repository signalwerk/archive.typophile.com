    html: <p>I agree the face does not have body enough to be displayed on television. This is my first pixel font and i can't say it has been hard getting this going, but adequately building this with another pixel in terms of thickness is something I have not gotten to understand.  <br> <br>Actually the nature of the "false" set is to change the legibility, to make it difficult to read.  Lies are disguised and distorted versions of the truth. When I was building the alternate face I was trying to lose information and make it harder to read. It then turns out that the forms became related further to Blackletter and the underlying theme of Nazi "truth". <br> <br>Yet, you do have a good point with the uniwidth. I don't know if it can be possible in contrast to my overall goal to show the lies in speech. I had an older version based off of Scala Sans where the forms were exploded, stems fell over, etc., but the overall width changed still. <br> <br>Maybe I could if they flatten out a little bit, with a little less pitch. I'll see if it is possible. <br> <br>thanks <br> <br>jp <br> <br> <br> <br></p>
    html_clean: <p>I agree the face does not have body enough to be displayed on television. This is my first pixel font and i can't say it has been hard getting this going, but adequately building this with another pixel in terms of thickness is something I have not gotten to understand.  <br> <br>Actually the nature of the "false" set is to change the legibility, to make it difficult to read.  Lies are disguised and distorted versions of the truth. When I was building the alternate face I was trying to lose information and make it harder to read. It then turns out that the forms became related further to Blackletter and the underlying theme of Nazi "truth". <br> <br>Yet, you do have a good point with the uniwidth. I don't know if it can be possible in contrast to my overall goal to show the lies in speech. I had an older version based off of Scala Sans where the forms were exploded, stems fell over, etc., but the overall width changed still. <br> <br>Maybe I could if they flatten out a little bit, with a little less pitch. I'll see if it is possible. <br> <br>thanks <br> <br>jp <br> <br> <br> <br></p>
