  - id: 480421
    user: 47058
    date: 2011-10-12T05:15:00
    date_raw: 12 Oct 2011 — 5:15am
    votes: null
    html: |-
      <p>Flash is good for very highly animated/interactive applications. Videogames mostly, but it can also be good for "closed" web applications where content portability and accessibility is not an issue (eg. the Adobe Kuler application (<a href="http://kuler.adobe.com" title="http://kuler.adobe.com">http://kuler.adobe.com</a>) that helps creating color scheme that you can export as photoshop color files).</p>
      <p>Generally is best to avoid it unless you need to do something the native web technologies (html, css, javascript) really can't do. </p>
      <p>A non-flash website is usable on apple iOS devices that don't support flash at all. Other mobile OS (like Android) support Flash, but not in a very good way, they often have issue of performance and various bugs, so also when the mobile system support flash, it is often better to avoid it. Also, on macs, flash is supported but its performances are not stellar, it sucks lot of resources and is buggy as well.</p>
