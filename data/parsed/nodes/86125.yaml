    html: |-
      <p>I am one of the few here who is a fan of Flash. However, I consider Flash to be a tool that should only be used when you need to do something that cannot be done as well with HTML/CSS. Lately that range of things is growing smaller and smaller.</p>
      <p>But in any case, you should never build an entire site in Flash.</p>
