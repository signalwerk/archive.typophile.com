    html: <p> Hi Tim, <br> <br>If you're going for something that can be set in small text and retain high readability, there are several things about this font that are inconsistant and would hinder that ability. <br> <br>I'm usually not as critical with a new font designer and good job for getting the face this far. But, since you've specified that you want to make this more of a text face, there are many issues with the font that I'd like to enlighten you with so can learn why my critique comes off so picky. <br> <br>The major concern that is apparent to me is the inconsistant letter width's in this font. Type out d,o,g,b,e,p,and q and it'll be obivious what I'm talking about. Ideally they should be crafted from the same round to appear seamless. <br> <br>Why doesn't the top of the body of the j come up to the x height? <br> <br>The P and R are the only letters that wrap underneath themselves at the bowl of the letter.  <br> <br>Slanted Caps seem like part of another font, should be redesigned to participate in this font. <br> <br>y,j,g,t,f each have their own unique hook as desender or ascender, they should all share same hook. <br> <br>Top of 1 hangs too low. Seven hugs the left side too much. Tail on 4 broke? W needs to be wider on bottom. Why do Z and z have a serif? No other letters have one. <br> <br>There is a process I call "Normalizing" letters in which you print every character you've drawn on an 8 1/2" x 11" sheet and study the letterforms. Are they consistant? Are their any oddballs? From there you'd go back in and tweak the letters until you don't notice any oddballs. <br> <br>Also, open a copy of Tekton and study it to the teeth. While it's different, it is close to your font and would offer some visual guidance for you to follow. Things like the shape of the letters, why they set successfully in text blocks, etc . . . <br> <br>I'm not sure if Chank has since critiqued your revised work, but I'd be happy to go over your font with you if you're interested in another opinion - I'm in Minneapolis also. <br> <br>Stuart :D </p>
    html_clean: <p> Hi Tim, <br> <br>If you're going for something that can be set in small text and retain high readability, there are several things about this font that are inconsistant and would hinder that ability. <br> <br>I'm usually not as critical with a new font designer and good job for getting the face this far. But, since you've specified that you want to make this more of a text face, there are many issues with the font that I'd like to enlighten you with so can learn why my critique comes off so picky. <br> <br>The major concern that is apparent to me is the inconsistant letter width's in this font. Type out d,o,g,b,e,p,and q and it'll be obivious what I'm talking about. Ideally they should be crafted from the same round to appear seamless. <br> <br>Why doesn't the top of the body of the j come up to the x height? <br> <br>The P and R are the only letters that wrap underneath themselves at the bowl of the letter.  <br> <br>Slanted Caps seem like part of another font, should be redesigned to participate in this font. <br> <br>y,j,g,t,f each have their own unique hook as desender or ascender, they should all share same hook. <br> <br>Top of 1 hangs too low. Seven hugs the left side too much. Tail on 4 broke? W needs to be wider on bottom. Why do Z and z have a serif? No other letters have one. <br> <br>There is a process I call "Normalizing" letters in which you print every character you've drawn on an 8 1/2" x 11" sheet and study the letterforms. Are they consistant? Are their any oddballs? From there you'd go back in and tweak the letters until you don't notice any oddballs. <br> <br>Also, open a copy of Tekton and study it to the teeth. While it's different, it is close to your font and would offer some visual guidance for you to follow. Things like the shape of the letters, why they set successfully in text blocks, etc . . . <br> <br>I'm not sure if Chank has since critiqued your revised work, but I'd be happy to go over your font with you if you're interested in another opinion - I'm in Minneapolis also. <br> <br>Stuart :D </p>
