  html: <p>Hi there, this isn't a display font, although it might save some similar qualities. The reason that I posted this here is because I designed this font to be read in text blocks.  <br> <br><img src="http://www.typophile.com/forums/messages/29/2901.gif" alt="http://my.vbe.com/~brknarr/fonts/whipple/images/whipple2.gif"> <br> <br>Here's a blow up sentace <br> <br><img src="http://www.typophile.com/forums/messages/29/2902.gif" alt="http://my.vbe.com/~brknarr/preview.gif"> <br> <br>I sat down with Chank a couple of weeks ago and he critiqued this for me. I've made some of the changes he suggested and now I want your opinion. Typophile is amazing and it's nice to have truly passionate typos here. <br> <br>t1mmy</p>
