      <p>You could ask them, but I don't think it has old style figures. "Aldine 721" is Bitstream's name for Plantin. Monotype's Plantin does have old style figures.</p>
      <p><a href="http://www.fonts.com/findfonts/SearchPage.htm?kid=Plantin" title="http://www.fonts.com/findfonts/SearchPage.htm?kid=Plantin">http://www.fonts.com/findfonts/SearchPage.htm?kid=Plantin</a></p>
