    <p>Hi,</p>
    <p>I wish to use Aldine 721 on Mac (both Pages and inDesign),<br>
    However, I really need to use old-style figures; I am not sure if the font comes with old-style figures or not?<br>
    I see it sold on myfonts and fontshop—I suppose it's best to buy OpenType.<br>
    This is my first time working with typography, so I am not sure how to go about finding out if old-style figures are included, or if not how to work them into the font etc.</p>
    <p>Thank you,<br>
    Peter.</p>
