  html: '<p>Do you have some favorite robust typefaces when you have to use tiny (5..7 points) white type on dark background? <br> <br>High-quality coated paper and CTP-workflows have made life easier, but what about  those less-than-perfect printing conditions, when you still want to keep the small text as legible as possible? <br> <br>I once had an idea about a typeface with similiar idea to Bell Centennial Bold, but the other way around: Tpeface designed to print "negative", with extra sharp outer corners etc allowing dot gain "from outside in". Is there a such typeface already?</p>'
