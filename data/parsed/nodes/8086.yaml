    html: "<p>Thorns were specifically a phototype phenomenon: a correction to the softening of corners that occured in the photographic process. The context in which Lange employed thorns was Berthold's very highly regarded phototype system. I'm not aware of anything like thorns being employed before phototype, and very seldom since; whereas traps (or reverse thorns, if you like) have been employed in metal, photo and digital type.</p>"
