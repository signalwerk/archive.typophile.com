  - id: 54322
    user: 1262
    date: 2004-12-10T12:55:00
    date_raw: 10.Dec.2004 12.55pm
    votes: null
    html: "<p>What thorns do is very different from what traps do. I've not found thorns of use in digital type, but then I -- like most of our colleagues -- are making type for use in a wide range of reproduction technologies. Thorns may be useful in some specific printing processes; I don't know. But the likelihood of their being visible -- not what you want -- in other processes seems too great to recommend them as a general feature. <br> <br>All photo and mechanical processes distort letterforms to some degree, even from digital type. So when you go from file to film to plate, or direct to plate, you can see the affect of these processes if you look closely enough. But two things need to be kept in mind. The first is that the different processes and the variables in the individual process make it very difficult to predict what might happen to a letterform; so most digital type design is process-independent; i.e. it tries to provide the best result possible across a wide range of output and reproduction processes. If you know the specific processes that a typeface will go through, it is much easier to optimise the design for those processes. Which leads to the second thing to keep in mind when considering thorns: the rounding of corners in phototypesetting systems was much more pronounced than the impact of digital imagesetter or other output device, so the need for specific correction was much greater. Because individual companies manufactured their own machinery and processes, they could tailor such corrections very specifically to these devices. So I would expect that thorns on Berthold phototypes might differ from thorns on the types of other manufacturers. In the device-independent digital font world, we've largely had to give up that level of control, since we can't anticipate the machines on which fonts will be used or processes to which they will be subjected.</p>"
    html_clean: "<p>What thorns do is very different from what traps do. I've not found thorns of use in digital type, but then I -- like most of our colleagues -- are making type for use in a wide range of reproduction technologies. Thorns may be useful in some specific printing processes; I don't know. But the likelihood of their being visible -- not what you want -- in other processes seems too great to recommend them as a general feature. <br> <br>All photo and mechanical processes distort letterforms to some degree, even from digital type. So when you go from file to film to plate, or direct to plate, you can see the affect of these processes if you look closely enough. But two things need to be kept in mind. The first is that the different processes and the variables in the individual process make it very difficult to predict what might happen to a letterform; so most digital type design is process-independent; i.e. it tries to provide the best result possible across a wide range of output and reproduction processes. If you know the specific processes that a typeface will go through, it is much easier to optimise the design for those processes. Which leads to the second thing to keep in mind when considering thorns: the rounding of corners in phototypesetting systems was much more pronounced than the impact of digital imagesetter or other output device, so the need for specific correction was much greater. Because individual companies manufactured their own machinery and processes, they could tailor such corrections very specifically to these devices. So I would expect that thorns on Berthold phototypes might differ from thorns on the types of other manufacturers. In the device-independent digital font world, we've largely had to give up that level of control, since we can't anticipate the machines on which fonts will be used or processes to which they will be subjected.</p>"
