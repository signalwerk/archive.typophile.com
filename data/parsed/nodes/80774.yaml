      <p>&gt; [templates which] can double for presentation<br>
      &gt; in brand guidelines documents</p>
      <p>I'm a bit confused by that comment. Are you looking for templates for presentation purposes, or for preparing artwork for the printer? There's a big difference in many cases.</p>
      <p>For example, an envelope template for the printer would probably have the envelope in its unfolded state with all the glue flaps opened and the back side upside down relative to the front. In other words, the shape of the envelope before it is printed, die cut, glued and folded. But in a template for presentation purposes the envelope's shape might be represented by a simple rectangle.</p>
