  html: |-
    <p>I have been scouring the net for quite some time now trying to locate some nice, good-looking, completely neutral templates for the various types and variations of print collateral that occur in the identity design process. (Envelopes of all formats, business cards, inserts, vehicle signage, all ISO A/B/C standards, DIN, etc.)</p>
    <p>I've been able to prune a few from a couple paper manufacturer websites, but I was wondering if there is a great set out there somewhere that any of you are aware of.</p>
    <p>It might sound a little ridiculous, but the OCD in me is obsessed with finding a comprehensive system of templates that are well designed, use consistent typography in guideline notation and annotation systems across all templates, and can double for presentation in brand guidelines documents.</p>
    <p>Whether a commercial product or free resource, do any of you know of something like this?</p>
    <p>Thanks! :)</p>
