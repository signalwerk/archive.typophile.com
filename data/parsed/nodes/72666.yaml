    <p>One of our typophiles, <a href="http://typophile.com/user/14662" rel="nofollow">Georg »Bleisetzer« Kraus</a>, has passed away <a href="http://www.blog.druckerey.de/index.php?id=396" rel="nofollow">on July 22nd 2010</a>. He was a man with character, who didn’t refuse to tell his own opinion, especially if it is against the mainstream. He was a <a href="http://www.bleisetzer.de/" rel="nofollow">keeper of lost typefaces</a>, a provider of vintage typespecimen; a fighter for the »black art«, for mankind, for his home country. He lost his last fight this July. I will always remember you, Georg. <em>Gott grüß die Kunst.</em></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/georg_4610.png"></div><p></p>
  html_clean: |-
