      <p>We lost a man of parts. I have lost a letterpress-printer colleague, who was passionate about traditions and enthusiastic about novelties. Truely sad.</p>
      <p>* Wir kennen Deine Farben, Georg * für immer.</p>
      <p>Gott grüß die Kunst.</p>
      <p>A. Stötzner.</p>
