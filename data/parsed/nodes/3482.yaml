    html: "<p>I think the thought process is something like this: <br> <br>If I pay for it, I want people to notice the design. But the business documents can't be 'design-y' or 'flashy' so why pay for them to be well designed? <br> <br>Now, the choice of a good typeface, and the setting of a well-crafted template that copy could be poured into is, in my opinion, very well worth it, but to them it may not seem like it matters. Also, I've run into people siting an apocryphal study that shows Times New Roman to be the 'most legible' typeface. Who knows where that came from...</p>"
