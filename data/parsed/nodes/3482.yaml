    html: <p>Yeees ... Now no doubt there are studies that say serif typefaces are more readable (and, of course, ones that say they're not ... and so on). But I don't believe that anyone's been reading those, because they also say that setting type at 80 characters per line with 1 point leading is pretty hard to read and that doesn't stop anyone. <br> <br>I suspect it's rather the reverse. Professionals will think about Capital-D-Design when it comes to something like a logo or a brochure or a web-site; but they see it as essentially a form of decoration. The idea that typographical design might actually have something to contribute to communication doesn't cross anyone's mind. So many of the subtler possibilities (since good design in that sense would not be incompatible with "branding", though it would/should not be branding that came first) are simply ignored, because no-one realises they were there. People just copy other people like sheep. <br> <br>Or do people imagine that "experts" at MS have carefully set up Word so that it is typographically correct? It's not an unreasonable assumption. It just happens to be badly wrong. (Unless anyone cares to defend 16 point arial bold italic sub-headings for 12 single-spaced times text?) I have to read this stuff every day until my eyes bleed. We have ergonomic chairs and desks. Is it too much to ask for ergonomic documents?</p>
