    html: <p>Paul, I can't talk about anywhere but here, Manhattan, USA and the Metro area, but law firms here look to hire kids fresh out of school with little or no experience. The only requirements are they know MS Word and Powerpoint. They are generally told to make the new document look like the old one. Why? They don't want to spend the money for a real seasoned designer.</p>
