    html: "<p>I find it odd. These firms are not averse to spending large sums on public relations. I bet they spend a fortune on the design of brocures and letterheads. They just don't seem to be alive to the possible value of decent design in the very documents their clients actually read. <br> <br>I was wondering if it was a conscious thing, a sort of \"anti-design\" statement: \"This is serious stuff: look, it is untouched by a designer's hand.\" If so, it seems odd. Have you encountered any of that sort of reaction, Mark?</p>"
