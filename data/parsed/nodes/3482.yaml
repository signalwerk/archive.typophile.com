    html: <p>The problem, at least in America, is that most of us  lack any formal training in basic aesthetics. It's hard enough for us to get training in the arts in general, for that matter. <br> <br>We'll spend years and years learning writing style and guidelines, but we won't ever have a class teaching basic layout skills. What a margin is. What a serif is. Etc. <br> <br>This is something that should be especially taught in any business or business writing school. <br> <br>The other problem is a lack of training in basic office tools. Few people actually know how to use word, PPT and the rest. They just hack away at it. <br></p>
