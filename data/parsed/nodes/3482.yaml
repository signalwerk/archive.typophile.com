    html: "<p>This thread interests me greatly as I work at the crossroads of professionalism (Library &amp; Information Science), complex information domain (One Canada's major public libraries with 22 branches and provincial resources), distributed document authoring and publishing (public service units are charged largely with determining the items and the content), and little recognition of the value of design (whether it be for building the percieved value of library services, communicating services or programming or whether it be internal communication). <br> <br>Factors that make printed business material less than stellar: <br>  <br>Speed <br>Utility <br>Deadlines <br>Constrained budgets <br>One person, many roles <br>Percieved value by the producer <br> <br>All of these are inter-related. When confronted with producing a high volume of business documents one will rely on existing or proven practice. One will turn to tools to match the demands of speed and utility. All else will take a second place role to these considerations. The primary goal, even in white collar service products is faster, cheaper. Better rarely enters into it unless a strong business case can be made. <br> <br>My head explodes with thinking on this stuff. I love the mundane realms of typography and design: business documents, forms and related material. The work a day stuff that slide under everybody's radar. <br> <br>Thanks Paul for starting this discussion. <br> <br>But I have to go write a paper for my Technical Communications Course now. <br> <br>Jon</p>"
