    <p>Novo Typo recently designed the corporate identity of the largest women-organisation in The Netherlands; Vrouwen van Nu. An important part of the design is the custom-made typeface 'Caren', a font which we created especially for 'Vrouwen van Nu'.</p>
    <p>Caren is a remarkable and playful font, which gives the organization a fresh and modern look and feel. The typeface is a happy mixture between uni-, upper-, and lowercase principals. It is an invitation for all designers and non-designers to play around with text and design. </p>
    <p>More info: <a href="http://novotypo.nl/index.html" title="http://novotypo.nl/index.html">http://novotypo.nl/index.html</a></p>
