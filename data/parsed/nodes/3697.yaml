    html: <p>Hmmm. I think I will let somebody else try to handle this, since I haven't built those formats in FOG since before the euro was even implemented. <br> <br>But I fear it will not work well, seeing as FOG also hasn't been updated since then. I'll bet they don't support correct Unicode encoding of the euro, for instance. But maybe you can build an old-fashioned single-byte TrueType font with the euro at decimal 128. <br> <br>Hoping somebody else can help out! <br> <br>T</p>
