  html: <p>Forgive me if this has been discussed, I looked, really I did. I'd like to add the Euro to my fonts and I'd like it to be in the correct unicode and keyboard command position.  <br> <br>Can someone either point me to a tutorial or let me know how to do this? I've been using the currency symbol position and I know that is ghetto. <br> <br>Thanks, <br>Matt</p>
