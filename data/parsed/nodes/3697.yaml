    html: <p>Piece o' cake Matty . . . <br> <br>Add another slot by opening Font Info box on the font and make it 257 at the bottom center of the window instead of 256 and click OK . . . You've just added a new character slot. <br> <br>Then, scroll down to the bottom where your new slot is (It'll be labled as ** always) and paste the referenced Euro from the currency slot (where the original should be) to the new slot. (command+g) <br> <br>Then, with the new slot hightlighted, hit (command +i) to get info on the glyph and change the Character Name to 'Euro' and the encoding to '$20AC' <br> <br>You should be able to export it out in both formats from FOG. <br> <br>Stuart :D</p>
