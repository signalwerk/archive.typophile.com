    <p>Hi Typophiles,</p>
    <p>I've got some more to do to get the little splash site working properly, but I wanted to announce that Biome Wide is now available on <a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?pid=4657264&amp;" rel="nofollow">fonts.com</a> and <a class="freelinking external" href="http://www.itcfonts.com/fonts/font/pid/4657264/Biome+Wide+Full+Family/detail&amp;grab_id=0&amp;page_id=97843&amp;query=biome" rel="nofollow">itcfonts.com.</a> More resellers coming up. Take a look at </p>
    <p><a href="http://biometype.com" title="http://biometype.com">http://biometype.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tphileshow_4513.gif"></div><p></p>
