    <p>Hi,</p>
    <p>I am incredibly sad that Apex New (Thirstype) doesn't support cyrillic characters. I just love it!</p>
    <p><a href="http://www.vllg.com/Thirstype/ApexNew/mudTyper+Weights">http://www.vllg.com/Thirstype/ApexNew/mudTyper+Weights</a></p>
    <p>I am actually looking for a similar typeface (with what some might call a "nice and 'trendy' modern sans design") that includes cyrillic glyphs, with a wide variety of weights (especially light or thin).</p>
    <p>Any suggestions ? :)</p>
