      <p>Well, its a bit obscure, but here's a quote that explains everything:</p>
      <p>"Apex New presently only contains the Latin alphabet, and dozens and dozens of accented letters for setting hundreds of languages. So, romanized Russian means that any accents needed for setting Russian using the Latin alphabet."</p>
