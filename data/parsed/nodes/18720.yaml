      <p>Thanks for the suggestions !</p>
      <p>I actually e-mailed Village and Chester replied saying only romanized Russian was supported. Not cyrillic.</p>
      <p>But he also said he has made a start on these glyphs. The Book weight is pretty much done, and he's open to work on other weights (depending on the budget). </p>
      <p>That guy is so cool !</p>
      <p>Unfortunately, I need the font very quickly (the document has to be printed in 2 weeks)...</p>
      <p>- - - </p>
      <p>Anybody have more typefaces to suggest ?</p>
