  html: |-
    <p><a href="http://fontstruct.fontshop.com/fontstructions/show/52799"><strong>Bonset</strong></a> is my latest FontStruction (now that I have OS X at home, I am spending way too much time at FontStruct!).</p>
    <p></p><div class="imageWrap"><img src="/files/bonset_sample_4427.png"></div><p></p>
    <p>My version deviates from van Doesburg’s tight grid — it’s condensed, and I changed some of the glyphs. I also added a lowercase, and I’m slowly building up the diacritics, with the help of the <a href="http://www.typo.cz/euro/index.html">Typo-cz</a> website for the Central European characters.</p>
    <p>So far, it’s been a lot of fun!</p>
