  - id: 464785
    user: 2462
    date: 2011-05-16T16:51:00
    date_raw: 16 May 2011 — 4:51pm
    votes: null
    html: <p>The official charts at unicode.org are usually pretty good at providing basic info on the relevance of a character. For instance, <a href="http://www.unicode.org/charts/PDF/U0180.pdf" rel="nofollow">this page</a> with some cross-referencing tells us Ƀ is a capitalized alternate symbol for the voiced bilabial fricative in <a href="http://en.wikipedia.org/wiki/Americanist_phonetic_notation" rel="nofollow">Americanist phonetic notation</a>.</p>
    html_clean: <p>The official charts at unicode.org are usually pretty good at providing basic info on the relevance of a character. For instance, <a href="http://www.unicode.org/charts/PDF/U0180.pdf" rel="nofollow" class="link-external">this page</a> with some cross-referencing tells us Ƀ is a capitalized alternate symbol for the voiced bilabial fricative in <a href="http://en.wikipedia.org/wiki/Americanist_phonetic_notation" rel="nofollow" class="link-external">Americanist phonetic notation</a>.</p>
