    html: |-
      <p>Another source of information is the <a class="freelinking external" href="http://www.unicode.org/charts/" rel="nofollow">Unicode Code Charts</a>. Enter U+0243 and then click "go". You get that U+0243 is the upper case of U+0180 for which one reads:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/u0180_4887.jpg"></div><p></p>
