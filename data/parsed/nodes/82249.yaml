  html: |-
    <p>What is the best way to find informations about use and functions of a specific unicode character?<br>
    For instance I would like to know, why Ƀ (<a href="http://www.fileformat.info/info/unicode/char/0243/index.htm" rel="nofollow">U+0243</a>) exists, when it was created...<br>
    Thank you for your help.</p>
