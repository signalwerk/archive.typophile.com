    <p>Adobe Font Folio 11 has been released yesterday, and it supposedly contains over one hundred new fonts. Unfortunately, there is no list of them -- there is just a complete list of all fonts it contains, where the new one aren't marked as such.</p>
    <p>Does anyone know any "highlight" among the new fonts in Font Folio 11? I guess it'd include fonts that have been released individually (like Adobe Garamond Premiere), but it there any fonts in there that haven't previously been released at all?</p>
