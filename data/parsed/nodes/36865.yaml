      <p>&gt; <em>It seems to me that these Japanese fonts were already included in the old Font Folio.</em></p>
      <p>The previous FontFolio had <strong>Pro</strong> versions of Kozuka Gothic&amp;Mincho, and <strong>Std</strong> versions of Ryo Display&amp;Text. FontFolio 11 additionally has <strong>Pr6N</strong> versions of both Kozuka families, and <strong>PlusN</strong> versions of Ryo Text. The Ryo Gothic PlusN family was introduced in FF11.</p>
  - id: 225511
