      <p>&gt; <em>where did you get that list?</em></p>
      <p>I'm part of Adobe's Type Department team. The list I mentioned earlier is missing, HY Gothic Std, HY Kak Headline Std (2 fonts), HY GungSo Std, HY Rounded Gothic Std, SMGothic Std (4 fonts) and SMMyungjo Std (4 fonts).<br>
      I also noticed that the Sava Pro family (6 fonts) is missing from <a href="http://www.adobe.com/products/fontfolio/pdfs/fontfolio11_font_list.pdf" rel="nofollow">this list</a>, but I'm quite sure it's included in FF11.</p>
