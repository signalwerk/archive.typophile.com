    html: |-
      <p>&gt; <em>have the remaining Type 1 fonts in Font Folio been replaced with Opentype in this version?</em></p>
      <p>Yes, the fonts in the previous Font Folio version that could only be found in Type 1 format are now available in OpenType. The only Type 1 fonts in FF11 are Pi/Ornament fonts, but all these have their OpenType counterparts.</p>
