    html: <p>For this to work, foundries would have to have an organization like ASCAP, which monitors broadcast performances for composers and publishers. They they could charge royalties like for song performances.  <br> <br>This would mean the 'ASCAP' like organization would check published works for fonts. Given the weak protection for type designs, at least in the US, this seems unlikely to ever happen. </p>
