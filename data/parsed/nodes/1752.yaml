    html: <p>Speaking of "Art Buyers", I had an interesting conversation yesterday with one from a Large Ad Agency. We were talking about the advantages of creating a custom font from scratch, rather than manipulating an existing design.  <br> <br>This person was very upfront about not knowing about font licensing. They were receptive to my suggestions, but that ol' budget problem came up. A bit of "sticker shock" but when I explained that if I manipulated the font, they would have to pay for that work, as well as the licensing for the font it was based on, and oh what a management nightmare that would be.  <br> <br>We will see.</p>
