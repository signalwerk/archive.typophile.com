    html: <p>Perhaps my post wasn't clear. . . I'm not proposing anything whatsoever. I'm making a query to determine if other foundries require these levels of additional licensing because I notice more of my customers coming to me to find out if additional licensing is required. <br> <br>Stuart :D</p>
