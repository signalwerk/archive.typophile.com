  html: "<p>I decided to post this under the General Discussion forums rather the Release forums because I'm interested in hearing a wide range of opinions on this . . . <br> <br>Lately it seems I've been getting a good amount of e-mail from customers asking if there is an additional royalty for using our fonts for: books, websites, posters, use on products. <br> <br>Are there that many foundries out there that have a license for every instance of font usage that they charge for? I'm familiar with embedding licenses, broadcast licenses, embedded devices, but I've never heard of restrictions on usage I would expect the font would be used for in general anyhow. <br> <br>It's just an odd trend I've noticed and wondered if perhaps this is commom practice among other foundries or perhaps if this speaks to an upswing in customers awareness of aquiring appropriate licensing. <br> <br>I'd love to hear everyone's opinions on this . . <br> <br>Stuart :D</p>"
  html_clean: "<p>I decided to post this under the General Discussion forums rather the Release forums because I'm interested in hearing a wide range of opinions on this . . . <br> <br>Lately it seems I've been getting a good amount of e-mail from customers asking if there is an additional royalty for using our fonts for: books, websites, posters, use on products. <br> <br>Are there that many foundries out there that have a license for every instance of font usage that they charge for? I'm familiar with embedding licenses, broadcast licenses, embedded devices, but I've never heard of restrictions on usage I would expect the font would be used for in general anyhow. <br> <br>It's just an odd trend I've noticed and wondered if perhaps this is commom practice among other foundries or perhaps if this speaks to an upswing in customers awareness of aquiring appropriate licensing. <br> <br>I'd love to hear everyone's opinions on this . . <br> <br>Stuart :D</p>"
