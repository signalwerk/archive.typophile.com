    html: <p>There are a variety of different licensing agreements used in (stock) photography, and the fee will vary based on the kind of usage. <br> <br>There is one kind of fee stipulation used by some stockco's, relating to using an image, unmodified, as the single image and "reason to buy", in instances such as a book cover, or on a mug. This is what may have given your customers the idea that if they use a typographic image, for instance a single character, as a primary graphic, this requires extra licensing. <br> <br>With fonts, different foundries have slightly different licence arrangements, but it's all about restrictions, and not about graduated fees. <br> <br>I did have one customer ask me if it was OK to use a single, unmodified character from one of my typefaces (Morphica "D"), as a logo -- and then trademark it. Without consulting my lawyer, I said it was OK. In retrospect, probably not the right thing to say. I hope his client doesn't sue me for continuing to sell the font. <br> <br></p>
