      <p><em>I think your /a/ is too wonky.</em></p>
      <p>I use this format specifically where the / delimit an actual glyph name in the font, and when I'm being really pedantic I distinguish e.g.  /a/ glyph from |a| character. This is a personal convention, and I need to be careful not to use it when writing to linguists, who use the same conventions to distinguish natural orthography letters from phonetic transcription.</p>
