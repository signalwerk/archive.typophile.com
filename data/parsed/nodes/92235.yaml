      <p>I happen to like Bodoni's symmetrical quotes, so I agree with Hrant to a certain extent.</p>
      <p>However, I don't see it as a big deal, and so if typographers can save money by using an upside-down comma as an opening quote... I can sympathize with their motivation.</p>
      <p>Now that we're no longer using little pieces of lead-tin-antimony alloy (mustn't forget that other element, riding in its triumphal chariot... and, for that matter, the small amounts of other elements such as copper as well), maybe it might be considered appropriate to revisit this. But when people are used to something, changing it will be resisted as an impediment to quick reading.</p>
      <p>Although it's not as if ordinary people notice Bodoni's quotes and are confused by them - or even have trouble with typewriter quotes. So people designing new faces certainly could use Bodoni-style quotes - if they dared.</p>
