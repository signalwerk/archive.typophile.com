      <p>Also, the apostrophe should NOT look like a third* quote mark when it occurs right before a quote (which is one other way guillemets rule). But if we can't handle strongly diverging the shapes, here's an idea I suggested a long time ago on Typo-L (and it's actually a feature of my Daam Entity fonts): keep the apostrophe the way it is, keep the <em>opening</em> quotes the way they are, but flip the closing quotes vertically.</p>
