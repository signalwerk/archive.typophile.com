  html: |-
    <p>I'm not sure if this has been discussed before or not, but I have been thinking about this a bit.</p>
    <p>When somebody says something about a letter or glyph, they say something like "this lowercase a needs some work", and I get the meaning just fine. In writing, though, for some reason we feel like there needs to be some added emphasis, whether it be quotes, slashes, or italics. I've used all of them at one time or another. But I think it's unnecessary. And with non-alphabets or non-latin glyphs, it's even more obvious.</p>
    <p>So rather than say,<br>
    —I think your 'a' is too wonky.<br>
    —I think your /a/ is too wonky.<br>
    —I think your <strong>a</strong> is too wonky.<br>
    —I think your «a» is too wonky.<br>
    I say:<br>
    —I think your a is too wonky.</p>
    <p>This is simpler and still makes sense, right?</p>
