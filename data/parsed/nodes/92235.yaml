      <blockquote><p>@oldnick: Since there are no formal conventions, </p></blockquote>
      <p>I’m not sure what you meant by “formal conventions,” Nick; but this topic is usually addressed in publishing style guides. For instance, <cite>The Chicaco Manual of Style,</cite> 15th edition, has this to say:</p>
      <blockquote><p><strong>§7.63</strong> <em>Letters as letters.</em> Individual letters and combinations of letters of the Latin alphabet are usually italicised.</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;the letter <em>q</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;a lowercase <em>n</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;a capital <em>W</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;The plural is usually formed in English by adding <em>s</em> or <em>es</em>.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;He signed the document with an <em>X</em>.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;I need a word with two <em>e</em>’s and three <em>s</em>’s.</p></blockquote>
