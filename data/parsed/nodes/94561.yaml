      <p>I think in the overall/"long-term" texture of a setting the descenders actually play a bigger role than that, especially for short measures (read: minimal leading). And although I myself do tend to be predictable in terms of the relationship between ascenders and descenders, this is clearly not true in the aggregate of all designers. For example when looking at Ruse (by Gerrit Noordzij) noticing that the descenders are fully equal to the ascenders is quite important I think.</p>
      <p>&gt; (x-height, cap height and possible independent ascender height)</p>
      <p>Well, "adhesion" doesn't have a cap either. BTW, to me descenders are more important than caps.</p>
      <p>But you're right about the "g" of course (and it's something I myself have brought up often). So "aghesion" it is.  :-&gt;</p>
      <p>hhp</p>
