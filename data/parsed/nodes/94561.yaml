    html: <p>Whatever may make a typeface "sing" is not an object like vocal chords.  Vocal chords make sounds.  Some people can make these sounds become song.  They do this with a combination of natural talent and hard work.  Those with the lesser amount of talent may need to greatly increase the amount of work. If you are looking for an ingredient to identify and quantify and concoct as a magic potion, join those who seek the holy grail in a lifelong search to no avail.  If you want to design type, just do the work and then do it again and again and again.  If you work hard enough, you may begin to hear a very, very faint melody.</p>
