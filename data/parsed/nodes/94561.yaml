      <p>Dave, I tend to do <em>i n o</em> first, and my first test word is, hence, 'onion'. Only fairly recently did I remenber that 'onion' was also the practice word my mother's calligraphy teachers had used to introduce Johnston's foundational hand.</p>
      <p>I suspect my inclusion of the lowercase <em>i</em> in this initial set explains why my dots tend to echo the outer shape of the <em>o</em> so clearly.</p>
