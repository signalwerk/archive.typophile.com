      <p>I was just writing up my view on this topic at the weekend for the <a href="http://www.craftingtype.com" title="www.craftingtype.com">www.craftingtype.com</a> workshop's blog at <a href="http://workturn.tumblr.com" title="http://workturn.tumblr.com">http://workturn.tumblr.com</a> and the below is taken mostly from what I wrote :-)</p>
      <p>nihilim and millioon! A tasty morsel of knowledge there! haha :-)</p>
      <p>I agree that adhesion is not, in fact, what I personally recommend. I just note that's what Reading used when I was there. As I said above, I think a type designer should do their own analysis of 'key shapes' that are particular to their design, to figure out which should be done first to establish parameters of the shape system, and which should be done after to follow the parameters already defined. </p>
      <p>So, looking at nihilim and millioon, long words of few characters: n i h l m o</p>
      <p>I would say that the first one to draw is the o, and the n. </p>
      <p>The first letter to draw is the ‘o.’ This lowercase letters is at the heart of the European ‘latin’ writing system, containing the “DNA” for everything else. The ‘o’ establishes the most fundamental proportion, of width to height. Since its shape is pure curve, you can clearly imagine the pen or writing tool used to make this shape - how fast it was used, what kind of nib and ink it had - and see the variation between thick and thin pen strokes. These attributes of the mark-marking tool will inform the drawing of every shape.</p>
      <p>The second letter to draw is the ‘n,’ and the writing tool informs the way the arch joins the left stem to the right stem, and gives the two stems an equal width.</p>
      <p>With these two together in a row of repeating letters, a clear horizontal rhythm between the black forms and the white counter forms emerges. The inter-letter spacing of these two is symmetrical, and harmonises easily with the large white interior shapes (or “counters.”)</p>
      <p>So with just these two, you can prototype the basic rhythm of text.</p>
      <p>With them in place, you can easily build out the rest of the characters in Johns words if you wish - h and l, especially if the arch and right stem is drawn as a seperate bezier contour - are very easy, no more drawing required. Just move the left stem stroke entry up, and for l remove the right contour. For the i just remove that right contour and add a dot. The 'm' is a little more complicated because you can't just copy and paste the arch, it needs fiddling to join in a way that looks right. Then you can set up the left and and right bearings for all of those the same as the 'n,' and see if you hear a tune. </p>
      <p>Looking at words like nihilim and millioon in the metrics window is useful until you do; but its a small step from there to pop them into a text generator, and set a large amount of text to see the effect in a textblock.</p>
      <p>But actually, I wouldn't recommend building out those characters, because they are so similar. If you decide to radically change something in the n, you have to go and redo all that. And probably when you move on to less similar, more different forms, you'll want to harmonise what you settle on for those with the curves in these initial letters. My next suggestion? The 'two story' a. Its neck curve at the top and belly curve at the bottom are sure to have an impact on the 'n' (and the rest, if you made 'em.)</p>
