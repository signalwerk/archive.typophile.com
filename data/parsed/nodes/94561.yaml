      <p>Ryan, when you say, "It works, it's very legible, blah blah blah blah" -- well, its the blah blah blah that is just blah blah blah for you that makes this overall, blah. There is 'just something' missing from it, and that thing is "taking care of all the details," the details which you have glossed over :-) Ben named some of the details, surely there are many kinds of details to consider.</p>
      <p>What I would suggest is to delete most of the glyphs you have and refine a core set of 'key shape' glyphs to a very high standard of 'fit and finish.' The lowercase "adhesion" is used at the University of Reading, and I suggest you do your own analysis of 'key shapes' that are particular to your design. </p>
      <p>Given a limited character set, you can still test a typeface's typesetting performance using a text generator tool - like <a href="http://www.adhesiontext.com" title="http://www.adhesiontext.com">http://www.adhesiontext.com</a> or <a href="http://justanotherfoundry.com/generator" title="http://justanotherfoundry.com/generator">http://justanotherfoundry.com/generator</a>. When and only when you think you have something that is singing, should you build out the character set -- because writing is systematic, the tune will carry over.</p>
