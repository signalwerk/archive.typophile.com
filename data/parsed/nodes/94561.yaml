    html: |-
      <p>Paraphrasing "Huit thèses pour (ou contre ?) une semiologie de la peinture" (Hubert Damisch):<br>
      <em>[...] le travail [...] sur le signifiant, [...] producteur d'une plus-value</em>.</p>
      <p>The "travail sur le signifiant" is done at the optical-grammatical tuning level of co-ordinating proportion, weight, contrast and construction, and the "plus-value" -- achieved through  individuation, or adding nuance, on all these dimensions (of proportion, weight, contrast and construction -- is gestural-atmospheric. Where I use<em> gestural-atmospheri</em>c and talk of gestural-atmospheric force or singularity, others use <em>personality</em>. The term "atmospheric" can be found in Ovinck, with reference to type, and the term "gestural" in Henk Krijger with refernce to type and typography. For example the assertiveness of Quadraat and the legendary Jan Van Krimpen restraint in type design are gestural-atmospheric qualities.</p>
      <p>When choosing a typeface for a job, gestural-atmospheric identity (depending on the subject matter) and optical-grammatical integrity (co-ordinate with the vehicle) are my prime reference or decision axis. </p>
      <p>It takes well-resolved optical-grammatical integrity and real gestural atmospheric distinctiveness, singularity and clarity for a type to sing. The "travail" (work) on the signifying components (letters) is at the heart of it.</p>
    html_clean: |-
