    html: <p>In that example, there are a number of basic errors. Curves (and straight sections!) are malformed. Strokes and terminals are inconsistent. There are no optical corrections at joins. Proportions between letters are not regular. Heights and widths are all over the place. Spacing is uneven. In short, it hasn't had enough time spent on it, it doesn't show any sensitivity to letterforms. I don't think there's a way to make this design 'great', as it doesn't demonstrate expertise or originality.</p>
