      <p>And beautiful faces are not the best text faces. </p>
      <p>What I look for in a typeface is to see nuanced design, using tricks I've not seen before, where every tiny decision makes sense and fits with everything else. What else? Originality of thinking/concept and of execution/aesthetics. Accomplished point placement, assured curves. Absolutely regular spacing. Consistency, harmony, tension.</p>
      <p>&gt;Making a competent typeface is not that hard.</p>
      <p>I wouldn't agree, but maybe we have different ideas of what constitutes a 'competent typeface'.</p>
