    html: <p>While I recall beginning the design of Gabriola with the lowercase a, it needs to be borne in mind that one can't finalise that letter -- or any others -- until the harmonic proportions of n and o and their spacing are worked out. So for a display face I recommend working up some characteristic shapes that will give the face its flavour and them setting them aside while one concentrates on the foundation.</p>
