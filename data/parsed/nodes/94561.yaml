    html: "<p>Look, Ryan, there really isn't a quality of typeface design that can be considered independent of all those things you dismiss as what can be 'mechanically solved'. You can't even begin to approach the qualities of a good typeface, a type that sets and reads well and that attracts the reader, without solving those basic issues of proportion, weight and optical refinement. It is only through those qualities that a type has any chance of 'singing': there is no song independent of them.</p>"
