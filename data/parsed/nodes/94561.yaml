      <p>&gt;I personally don't get how not having a descender is OK.</p>
      <p>I think it could be to do with character frequencies. /adhesion/ is used as it contains the most common letters so can build many words quickly. I usually add /trlu/ as they're easy and permit more possibilities. Descending letters are less frequent in English; the other thing is they're all different shapes, so take more time to draw. Clearly for Armenian you'd want to start with ascenders and descenders, as those are the more active zones.</p>
