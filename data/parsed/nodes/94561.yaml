    html: "<p>Good suggestions Dave, although my own approach is a little different, and perhaps better suited to 'singiness'. The test word 'adhesion' is quite good for revealing the characteristics of a design, but I don't tackle the a, e or s until I have first established the rhythm of two faux words: nihilim and millioon. [The latter was used by my first typography instructor when manually kerning headlines: he would first kern the faux word millioon at the intended size, print it, tape it to the top of his monitor and use it as a visual reference when spacing the headline.] I really like nihilim because it is easy to produce and gives a good indication of harmony across some fundamental shapes and their spacing. If that faux word sings, there is a good chance that you'll be able to make the rest of the design join the chorus.</p>"
