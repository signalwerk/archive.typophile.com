    html: <p>In the Latin script, the depth of descenders is something to be considered in proportion to what is happening above the baseline, which is more complex and has a far greater overall impact on the typeface, involving as it does as least two different strongly information bearing zones (x-height, cap height and possible independent ascender height). The only factor that in any way complicates the descender depth is the density of the g, and even then the norm is for that density to be optically adjusted to fit the letter within proportions that look balanced to the (generally slightly longer) ascender height. So while I agree that determining a type's vertical proportions is a key step, the role of descenders within that determination is relatively minor, and overall the determination of horizontal proportions in the x-height and cap height is massively more important.</p>
