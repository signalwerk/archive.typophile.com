    <p>Moderating this board is lots of work — mostly behind the scenes — and eats up large amounts of my own time. Remember this is a voluntary job. I don’t get paid for this, and time spent here is time I can’t devote to my family, writing for Unzipped or Typographer.org or other websites, designing for my personal clients, rehearsing and gigging with my band Troubleman or — hey — <em>relaxing</em>.</p>
    <p>I don’t mind doing this, make no mistake. Fact is, I even like it. But if you want a typeface identified or need advice or information, <em>please don’t send me a personal e-mail.</em> Post it here, that’s what this board is all about.</p>
    <p>Thank you. ;^)</p>
