    <p>Selected newly released typefaces/type families and fonts, for the<br>
    month of July, 2008.</p>
    <p>Sans: <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_enzo_ot/" title="Enzo" target="_blank" rel="nofollow">Enzo</a>, by Tobias Kvant <em>(FontFont)</em>.<br>
    Serif: <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_pitu_ot/" title="Pitu" target="_blank" rel="nofollow">Pitu</a>, by Łukasz Dziedzic <em>(FontFont)</em>.<br>
    Display: <a href="http://www.re-type.com/fonts/lasagna-regular.html" title="Lasagna" target="_blank" rel="nofollow">Lasagna</a>, by Yomar Augusto <em>(ReType)</em>.<br>
    Script: <a href="http://www.dutchfonts.com/pigtail/pigtail.htm" title="Pigtail" target="_blank" rel="nofollow">Pigtail</a>, by Ko Sliggers <em>(Dutchfonts)</em>.<br>
    Dingbat: <a href="http://www.astype.de/s/astype_orn_acco_b/show.php" title="Ornaments B" target="_blank" rel="nofollow">Ornaments Accolades B</a>, by Andreas Seidel.<br>
    Hebrew: <a href="http://www.myfonts.com/fonts/vic-fieger/perlmutter/" title="Perlmutter" target="_blank" rel="nofollow">Perlmutter</a>, by Vic Fieger.<br>
    Free: <a href="http://www.typophile.com/node/47219" title="Sniglet" target="_blank" rel="nofollow">Sniglet</a>, by Haley Fiege.</p>
    <p><em><a href="http://for.ma/blog" target="_blank" rel="nofollow">for.ma/blog</a></em></p>
