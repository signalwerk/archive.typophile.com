  html: <p><img src="http://www.typophile.com/forums/messages/30/70774.jpg" alt="otis"> <br>I came across this the other day, with an old elevator still in use. Nowadays, all you get is the button. <br> <br>The awkwardness of the typography is charming -- the ridiculously narrow measure, and the different ways of justifying the text. What a lot of typography there is, caps, small caps and roman of Cheltenham, paragraph indents and leading, centred rules. The colon in the heading is quite unecessary, but elaboration is the name of the game. Beautifully written too, "Press button firmly for a moment".</p>
