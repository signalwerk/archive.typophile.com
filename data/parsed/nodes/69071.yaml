  html: |-
    <p>Hi people! Anyone know what font (or handset font) is used for the speech marks in Computer Arts magazine? They're easy enough to recreate in Illustrator, but I'd rather be using the real thing and seeing what else the font has to offer. Cheers!<br>
    (I know the body copy is Akkurat from <a class="freelinking external" href="http://www.lineto.com" rel="nofollow">lineto</a>).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/photo_4594.jpg"></div><p></p>
