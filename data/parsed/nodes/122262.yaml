      <p>Baseline comes close for |ALTO| (just round the stroke ends):<br><a href="http://www.myfonts.com/fonts/parachute/pf-baseline-pro/">http://www.myfonts.com/fonts/parachute/pf-baseline-pro/</a></p>
      <p>Neuropol X is already rounded, but squarer than your sample:<br><a href="http://www.myfonts.com/fonts/typodermic/neuropol-x/">http://www.myfonts.com/fonts/typodermic/neuropol-x/</a></p>
      <p>|MEGAPHONE| looks like DIN 1451 Engschrift (but there are dozens of similar fonts that are close matches as well):<br><a href="http://www.myfonts.com/fonts/linotype/din-1451/">http://www.myfonts.com/fonts/linotype/din-1451/</a></p>
      <p>|INKORGEN| appears to be Gotham (good match to |spamfilter| as well):<br><a href="http://www.typography.com/fonts/gotham/overview/">http://www.typography.com/fonts/gotham/overview/</a></p>
