      <p>@Florian: you need to sign in to see the photo set; I don't know if this is the case in other countries.</p>
      <p>And just my two cents: as an Englishman living in Germany for the last two years, I've been somewhat surprised by the lingering sense of guilt and shame shared by, I would say, the majority of Germans. Especially surprising is that this has even been passed on to young people, whose parents even weren't old enough to live through WW2: some have told me they feel like their opinions on such matters are highly scrutinised. There are those who, perhaps like Georg, seek to break this cycle in their lifetime, but this is not the normal position. I've been in trouble a couple of times with some (perhaps somewhat glib) jokes, which has taught me to think a bit about the feelings I am invoking in saying such things.</p>
      <p>One only has to look at the furor over the publication of <a class="freelinking external" href="http://news.bbc.co.uk/2/hi/europe/7247817.stm" rel="nofollow">those damned Muhammed cartoons</a>. Yes, one might say that it was political correctness gone mad, but the fact of the matter is that the cartoonists in question became famous for all the wrong reasons. In other words, your work <em>should</em> be sensitive to such things if your goal is to produce work that invokes the correct responses. Of course, here comes more careful line-treading.</p>
