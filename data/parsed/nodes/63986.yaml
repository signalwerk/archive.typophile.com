      <p>What a senseless discussion.<br>
      Are you victims of your political correctness? Or are you typographic professionals?</p>
      <p>There is _no_ existing "Nazi font".<br>
      How often some guys want to establish it.</p>
      <p>All this is nonsense.</p>
      <p>The "Führer" prefered Antiqua, by the way...</p>
      <p>Fraktur fonts were forbidden since 1941, 'cause Adolf Hitler himself called it "jews letters". A funny detail: Lucian Bernhard Fraktur from Lucian Bernhard, a german jew, was the headline font of Völkischer Beobachter, the nazi party's newspaper. </p>
      <p>All these "New Gothic" fonts were developed between 1933 and 1938. They mirrored the epoche - that's all. Tannenberg is one of the most famous ones, because it was offered by D. Stempel, the largest foundry. </p>
      <p>I wrote an article about Tannenberg some weeks ago (in german).<br>
      May be, you want (and can) read it or someone can translate it? My english is not good enough, sorry: <a href="http://www.bleisetzer.de/tagebuch/tannenberg-jetzt-aber-wirklich..html" class="link" rel="nofollow">Tannenberg</a></p>
