      <p>@ Celeste</p>
      <p>Yes, you are right.<br>
      Tannenberg was a great victory of General Hindenburg at the beginning of WWI. Only this victory made it possible to send the troops to the western front, where France with the help of England was attacking Germany.So it was a notation to Germany's pride, how you said it. So, what?</p>
      <p>We know lots of Egyptienne fonts. Named Egyptienne, because Napoleon attacked England in Egypt. All european nations were imperialistic. "British Empire" says it clear and loud.</p>
      <p>When I say Tannenberg was a result of this german epoche, I mean, that this epoche was very national. Germany lost WWI, was pressed under the Versailles contract. The people saw the again upcoming Germany with proud. So Tannenberg mirrored this feeling. The same did the fonts Gotenburg, National, Franken-Deutsch, Herman-Gotisch, Kurmark, Trump-Deutsch. Not all of them were "New Gothisch" fonts. But all of it note to be close to the major feeling of this epoche - to think national. I am sure, the foundries marketing departments tried to force it, because like it is today: They want to make profit with their products. </p>
      <p>So: I agree with you. But I said the same before: These fonts are mirrors of the national epoche of Germany. But nothing to do with "Nazi font". The Nazi party won the internal national war and ruled Germany for 12 years. But Nazi is not the same as "national thinking" is. Berthold Brecht said, Nazism is a way to get absolutely force. I think, that's right. They were criminals, not politicians.</p>
