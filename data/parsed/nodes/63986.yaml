      <p>I'll say it too: I don't see how anyone is being too politically correct here at all.<br>
      Jeffrey, I hear you – it is a fine line to toe. I've been too "daring" with at least one client as well with respect to using blackletter and ambiguous imagery.<br>
      But the point is doing it consciously. As long as we realize there <em>is</em> a line to toe, and that we juggle with fire – but we do that for a reason –, we can explain our approach vis-à-vis an audience/client/enemy, and take responsibility for our actions. But when a layman around us doesn't realize what kind of target they potentially make themselves, I believe we need to step up and help avoid damage. Not as the type police, more like… the fire brigade. But hopefully, before the fact.</p>
