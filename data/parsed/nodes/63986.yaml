    <p>I'm trying to convince somebody not use a Schaftstiefelgrotesk* jackboot grotesque like Tannenberg, because of the Nazi association. Since laymen need to be hit over the head with a two-handed warhammer to get it, I really need to find an image of a vintage poster with a font like this<br>
    <a href="http://upload.wikimedia.org/wikipedia/commons/d/d7/Tannenberg_sample.png" title="http://upload.wikimedia.org/wikipedia/commons/d/d7/Tannenberg_sample.png">http://upload.wikimedia.org/wikipedia/commons/d/d7/Tannenberg_sample.png</a><br>
    and "Adolf Hitler" or a swastika or something equally damning on it too.</p>
    <p>* <a href="http://typophile.com/node/12130" title="http://typophile.com/node/12130">http://typophile.com/node/12130</a></p>
    <p>If you put "Tannenberg font recognize" in Google image search and click on "Find similar images" under the first image, you see a some good candidates, except the links have become broken.</p>
    <p>Help!</p>
    <p>hhp</p>
