      <p>@Georg</p>
      <p><cite>Lots of german younger people (I am born 1955) are ashamed to be germans. I do not agree. I am proud to be a german.</cite></p>
      <p>I have great respect for everyone, that preserves and that develops culture like you, but I never was able to understand, how someone can be proud of his country. You can be proud of your own achievements only. Except from that I doubt, that it is true, that many Germans, which were born after the Nazi regime, are ashamed to be Germans because of the sins of their parents or grandparents. The fact, that there are Germans, which go into hysterics, when another German says in the public, that the Swastika is a highly aesthetic sign, has not to do with shame, but with either an unbelievable simple-mindedness or a dishonest political correctness. Or both. Instead of being ashamed of the sins of others or being proud of the cultural achievements of the past, it is needed to invest in education and educational justness, because we have a lot of catching-up to do there. The German educational system is too targeted with regard to career and earning money. There is a tendency to construe culture as a means to an end, as luxury, as pastime or as prestigious object in Germany.</p>
      <p><cite>But Nazi is not the same as “national thinking” is.</cite></p>
      <p>It is not the same, because the Nazis were trans- or overnationalists. And in my opinion "national thinking" is the little sister of trans- and overnationalism. Why not limit to <em>thinking</em> (and doing)? "National thinking" sounds like "national security" and today it ends in Iraq or Afghanistan.</p>
