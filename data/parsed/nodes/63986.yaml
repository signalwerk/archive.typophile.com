      <p>I think the core of this discussion is about semiotics. And it's about confusing what is being said with how it's being said. Blackletters (or any letter for that matter) aren't evil in any way, and there is a lot of typographic history attached to them (Printing all started with them, and with it modern typography, let's not forget that) so to just connect them to the nazi regime is definately wrong... BUT the prominent use of these letters by the Nazi regime no more than 70 years ago, and it's use afterwards by right wing activists and football hooligans does make use of this kind of letter contaminated/problematic. As type professional it is very important to know the distinction between what is said and how it's said, even when other don't. And we should also use this knowledge to avoid this kind of pigeonholing. The use of certain symbols, imagery, typefaces etc carries certain messages, this can't just be ignored, that's just stupid, ESPECIALLY when you're a professional in the business of communications.</p>
      <p>I find it really quite tiresome to have this political correctness discussion. Freedom of expression YES, but ignorance of expression, what is expressed and how it's expressed NO. If that's against peoples sense of freedom, that's a shame, but, IMO, completely unneccesary.</p>
      <p>And sorry for the CAPS... :)</p>
      <p>Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
