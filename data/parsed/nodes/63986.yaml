      <p>@ Arno<br>
      "I never was able to understand, how someone can be proud of his country."</p>
      <p>Well Arno... to be serious:<br>
      I never ever are able to understand, how someone, who's member of... and here are the problems beginning...</p>
      <p>The german word "Volk" in english means sometimes folk, sometimes nation.<br>
      But there is a big difference between folk and nation.</p>
      <p>The smallest community is the family, right?<br>
      The largest one is the folk (who organizes itsself in a nation).<br>
      Its a question of blood, is'nt it?<br>
      Jews call themselves "the chosen people". And its on the mothers to give it to the children, not the father.<br>
      So let's say: german Volk = my people.</p>
      <p>All men of my family (from both sides, father's and mother's) were volunteers in the wars, Germany was involved. They fought for their people, not for a government. And I feel a deep solidarity to my people. Not as a question of thinking about... but as a kind of reflex. My son (18) does not join the german "Bundeswehr" (army). He wanted, because he thougt about becoming a professional commissioned officer. But I did not allow it. He would have to go to Afghanistan. And this is not a war of our people. Never ever an afghanian did my people any harm. And you know, who's war it is and you can find the answer, why this war is going on...</p>
      <p>Back to your thesis:<br>
      I can not understand, how someone who has his own people (folk) does think in another way, I do... may be in America, because this is a melting pot without historical growing of population? I don't know.</p>
      <p>That's all what I can explain.<br>
      To belong to a folk, to my people, is a present from I don't know, whom. And if this would not be the natural way for human beings, the most nations would not exist. So... how can it be a bad thing?</p>
      <p>Georg<br>
