      <p>Maybe I'm stepping a bit late into this debate.<br>
      Anyway, Georg, I don't think you can state that Tannenberg simply "mirrors the epoch - that’s all".<br>
      First of all, there is the name itself : the SECOND battle of Tannenberg (August 17—September 2, 1914) was a huge victory for Germany against Russia at the beginning of World War I, and was widely perceived at the time as especially significant since it was felt to be a long-overdue revenge on the FIRST battle of Tannenberg (July 15, 1410), where the Polish armies defeated the Teutonic Knights, stopping German expansion in Eastern Europe. Thus, choosing this name for a Blackletter typeface in 1933 clearly hinted at notions of "German pride", indeed a significant part of Hitler's rhetoric. It is also telling that other examples of "Schaftstiefelgrotesk" include <cite>National</cite> and <cite>Deutchland</cite> (no explanation needed here).<br>
      Secondly, "Schaftstiefelgrotesk" are a conscious effort by German typefounders to find some kind of compromise between traditional Blackletter forms (an integral part of the <cite>Heimatstil</cite> favoured by some of the highest-ranking members of the Nazi party) and Grotesk typefaces promoted by Tschichold's New Typography and Bauhaus designers, at a time when the Nazis themselves hesitated between the two aesthetic camps (modernism was advocated by some as a style which "would best distinguish the new Germany from the old", as stated by Steven Heller in <cite>Iron Fists — Branding The 20th-Century Totalitarian State</cite>).<br>
      Finally, the rejection of Fraktur as <cite>Judenlettern</cite> (Martin Boormann's words, January 3, 1941) comes quite late in the history of the Nazi regime : up to this point, Blackletter was flaunted as the embodiment of "Germanness" by Nazi propaganda, even if Hitler himself had a personal taste for Neoclassical forms (in architecture as well as in typography).</p>
