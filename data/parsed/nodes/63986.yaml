      <p>Hrant, I wonder why you didn’t unfold some little detail on the context of the client and his project which pressed you to commence this discussion. You only screame "need to disqualify a typeface, give me Nazis, give me Hitler urgently" which is quite opposite to being sensitive – whereas sensivity in a matter like this surely is of merit. As a German who, similar to Georg Kraus, may boast with some pride for our countries heritage (in typography, to say the least ;-) I reject the attitude of nazifying anything which is just decisively German. </p>
