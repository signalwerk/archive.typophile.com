      <p>And just to add a personal example to the thing mentioned above:</p>
      <p>When once commisioned to design my schools in house art magazine, we came up with the idea of using a fraktur typeface for the title of the magazine. This, in combination with a barcode on the cover, provoked very strong reactions among the teaching staff, of which one would refuse to read this magazine and would immediately throw it in the bin if she found it anywhere near her postbox.... so I guess I've learned the hard way as well. Just comes to show that something that seemed like a little bit of thought provoking stirring up can have stronger effects than you can think of at first.</p>
      <p>Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
