      <p>Dear [fellow] Germans, the collective defensiveness in this thread is conspicuous. Is it really so impossible to accept that among laymen outside of Germany, Tannenberg-esque lettershapes tend to stir associations to Nazism first, with beer and noodles and good German craft possibly a distant second? The eagerness to assert a positive image is a bit tiring. </p>
      <p>You don't have to convince anyone in here; you would need to convince everybody on the planet to erase their preconceptions. That's the point: Designers do need sensitivity, and they also need enough sensitivity (and sensibility) to see the associations "the man on the street" has – be they justified/"fair" or not! Those need to be taken into account to decide, on a case-by-case basis, whether to be more daring and attempt to work towards correcting the public "image" (which doubtless seems like a more heroic and exemplary course of action); or sometimes to take a bit of extra precaution and not taunt public opinion, in cases that are more sensitive, as this one appears to be. This bull does charge at red.</p>
