    <p>A term coined by Rob Keller of Mota Italic, in reference to this imminent cutie:<br>
    <a href="http://www.motaitalic.com/typefoundry/fonts/gemma/overview" title="http://www.motaitalic.com/typefoundry/fonts/gemma/overview">http://www.motaitalic.com/typefoundry/fonts/gemma/overview</a></p>
    <p>Two others:<br>
    - Nowak's superb Eskapade:  <a href="http://www.type-together.com/Eskapade%20Fraktur" title="http://www.type-together.com/Eskapade%20Fraktur">http://www.type-together.com/Eskapade%20Fraktur</a><br>
    - Hague's admirable London Olympics font* as well as his older Klute:<br>
    <a href="http://www.myfonts.com/fonts/fw-alias/klute/" title="http://www.myfonts.com/fonts/fw-alias/klute/">http://www.myfonts.com/fonts/fw-alias/klute/</a></p>
    <p>* <a href="http://www.qbn.com/topics/650549/" title="http://www.qbn.com/topics/650549/">http://www.qbn.com/topics/650549/</a></p>
    <p>Any others?</p>
    <p>And most of all: Opinions? Preferably passionate ones?</p>
    <p>hhp</p>
