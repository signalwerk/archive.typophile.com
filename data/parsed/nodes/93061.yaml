      <p>The term is actually a bit older, see this blog post by Paul, and the links therein:<br>
      <a href="http://www.pilcrowtype.com/blog/the-ever-useful-rotalic" title="http://www.pilcrowtype.com/blog/the-ever-useful-rotalic">http://www.pilcrowtype.com/blog/the-ever-useful-rotalic</a></p>
      <p>Here’s my ‘Rückwärts Rotalic’:<br>
      <a href="http://kaune.hardwig.com/wp/wp-content/uploads/filiale-6.jpg" title="http://kaune.hardwig.com/wp/wp-content/uploads/filiale-6.jpg">http://kaune.hardwig.com/wp/wp-content/uploads/filiale-6.jpg</a></p>
      <p>I remember that some typedesigner did a ‘true Rotalic’, i.e. one where subsequent letters rotate increasingly, so that, within a line, a full Roly Poly is performed. Can’t find it back, though –&nbsp;must have been on Twitter.</p>
      <p>Edit: Here it is, preserved by Indra. It was Frederik:<br>
      <a href="http://kupferschrift.de/cms/2011/07/new-ideas-for-book-typography/" title="http://kupferschrift.de/cms/2011/07/new-ideas-for-book-typography/">http://kupferschrift.de/cms/2011/07/new-ideas-for-book-typography/</a></p>
    html_clean: |-
