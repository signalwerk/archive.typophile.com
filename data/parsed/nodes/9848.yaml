    html: <p>A good starting point for “<span class="caps">CHICO’S</span> <span class="caps">BAIL</span> <span class="caps">BONDS</span>” would be <a href="http://www.myfonts.com/fonts/agfa/century-gothic/bold/testdrive.html?s=CHICO%27S+BAIL+BONDS&amp;p=48" target="_blank">Century Gothic</a> or <a href="http://www.myfonts.com/fonts/linotype/itc-avant-garde-gothic/medium/testdrive.html?s=CHICO%27S+BAIL+BONDS&amp;p=48" target="_blank">Avant Garde</a>. The letterforms seem to match Century Gothic better, but the weight looks closer to Avant Garde. In any case, that A has to be condensed. <br><br> -&nbsp;Lex</p>
