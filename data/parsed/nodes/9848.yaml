    html: '<p>Hmm … two things about that script font: <br><br>1) Stanley appears to be another digitization of a typeface which <br>appears in the Solotype Catalog as Apache. <span class="caps">URW</span> digitized it <br>under that name, <a href="URL" target="_blank"> Apache</a>. <br><br>2) The typeface actually used appears to be one that appears in <br>the Solotype catalog as August. It’s stretched horizontally a bit <br>compared to Apache, like so (using the only two digital versions <br>I’m aware of): <br><br><img src="http://www.typophile.com/forums/messages/83/67723.gif" alt=""><br><br>Cochise is <a href="http://www.qbf.de/dceng.htm" target="_blank"> Brendel Informatik’s</a> old digitization of August, while <br><a href="http://www.buyfonts.com/value_for_money/toledo.htm" target="_blank"> Toledo</a> is Fontbank’s. Toledo matches the sample image better, <br>is better made and has a more complete character set, but, <br>unfortunately, neither includes proper quotation marks. <br><br>Rats. I see that I managed to misspell Cochise in my image. <br><br></p>'
    html_clean: '<p>Hmm … two things about that script font: <br><br>1) Stanley appears to be another digitization of a typeface which <br>appears in the Solotype Catalog as Apache. <span class="caps">URW</span> digitized it <br>under that name, <a href="URL" target="_blank" class="link-lost"> Apache</a>. <br><br>2) The typeface actually used appears to be one that appears in <br>the Solotype catalog as August. It’s stretched horizontally a bit <br>compared to Apache, like so (using the only two digital versions <br>I’m aware of): <br><br><img src="http://www.typophile.com/forums/messages/83/67723.gif" alt=""><br><br>Cochise is <a href="http://www.qbf.de/dceng.htm" target="_blank" class="link-external"> Brendel Informatik’s</a> old digitization of August, while <br><a href="http://www.buyfonts.com/value_for_money/toledo.htm" target="_blank" class="link-external"> Toledo</a> is Fontbank’s. Toledo matches the sample image better, <br>is better made and has a more complete character set, but, <br>unfortunately, neither includes proper quotation marks. <br><br>Rats. I see that I managed to misspell Cochise in my image. <br><br></p>'
