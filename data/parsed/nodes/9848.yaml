  - id: 62798
    user: 2088
    date: 2005-03-19T12:24:00
    date_raw: 19 Mar 2005 — 12:24pm
    votes: null
    html: <p>James, you have just described the difference, but they are two different faces. August is slightly heavier to my eye too. These are both designs from the era of film type, and I think it was common to distort a basic lettering sample, or re-do it with the same lettering artist making a slightly heavier version. They also mixed and matched aspects of typefaces, or added serifs to sans lettering. They also used optical means to produce various slants to vertical designs, and gave each one a new name. If you look through a Photo-Lettering book or the Solotype Catalog you see this over and over. <br> <br>This same basic lettering has produced families of typefaces, and as you can tell from Mike F's information, a variety of foundries have their own digital versions of a lot of this hand lettering. Sixpack is a Panache version based on the same lettering, and there are more. <br> <br>April, Arctic and Arbor are 3 sans versions of this same lettering family. You see them everywhere.</p>
