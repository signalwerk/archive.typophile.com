    html: |-
      <p>X/Y size values are scale factors relative to the em. e.g. a value of 700 on a font that is on a 1000-unit em would result in characters scaled to 7/10 size.</p>
      <p>Y pos values are relative to the baseline; for subscript, positive values move *downward* from the baseline.</p>
      <p>Normally leave X pos values at zero except for italics, where you generally want to calculate along the italic angle.</p>
      <p>More detailed info on these settings at <a href="http://www.microsoft.com/typography/otspec/os2.htm#subxs" title="http://www.microsoft.com/typography/otspec/os2.htm#subxs">http://www.microsoft.com/typography/otspec/os2.htm#subxs</a></p>
