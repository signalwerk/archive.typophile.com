  html: |-
    <p>Hi everyone,<br>
    I just moved to Portland so I don't know much about the city.</p>
    <p>I'm here to ask if you guys know any specialty offset printer in Portland that is able to print posters on archival quality paper?</p>
    <p>So far I have:<br>
    <a href="http://www.pinballpublishing.com" title="http://www.pinballpublishing.com">http://www.pinballpublishing.com</a></p>
    <p>and</p>
    <p><a href="http://www.stumptownprinters.com" title="http://www.stumptownprinters.com">http://www.stumptownprinters.com</a></p>
    <p>However, these two shops offer 1-color offset printing. I'm looking into something like 4 to 6 color offset printing for a limited edition poster I have in mind (500 copies).</p>
    <p>I would love to have a local printer here so that I can go there and get my hands on production as well as giving them insight on my specific needs.</p>
    <p>Thank you very much!</p>
    <p>Oh, and I would love to get together with fellow typophiles in order to get to know a little more the city and the people.</p>
