    votes: null
    html: <p>There are several fonts called "DeVinne" in the world to make it confusing. The one with the curly tail is perhaps a Bitstream variant. If you note above character display,  the Wood Type De Vinne Regular has the straight tail as in your sample. It is conceivable you were sent the wrong font so you should check your purchase.</p>
  - id: 535360
    user: 1316
    date: 2012-12-28T12:01:00
    date_raw: 28 Dec 2012 — 12:01pm
    votes: null
    html: <p>The typefaces in the example shown are original DeVinne (and derivates) cuts, from the original Gustav Schroeder design released by Central Type Foundry in 1890. The style continued to be popular as a text face up to the 1920s.</p>
