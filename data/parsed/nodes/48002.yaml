    html: |-
      <p>Sorry to burst your bubble Sam but this is not Rotis SemiSerif STD. As Yves has already pointed out it “looks somewhat like Rotis SemiSerif” but it’s certainly not a match. My guess is that this is actually derived from Rotis Serif to begin with. Note the balled ends of the ’a’, ’r’ and ’c’, it would be much more difficult to add these to Rotis SemiSerif than to simply remove the serifs at the bottoms of the serifed characters. Beyond that the charactes have been squashed vertically with the curves of the ’a’ and ’c’ having been completely redrawn. I also suspect a stroke has been added to the arms of the capital ’T’. You can see what I’m yapping about visually below.</p>
      <p></p><div class="imageWrap"><img src="/files/Tarmac_4602.jpg"></div><p></p>
    html_clean: |-
