    html: |-
      <p>No problem. ;^)</p>
      <p>The suffix STD only means it’s a Standard OpenType face, a typeface with a limited character set that doesn’t take advantage of advanced OpenType features. That’s purely technological and has nothing to do with the design. The suffix Pro stands for ’fat’ OpenType faces with extended character sets, like small caps, contextual ligatures, Eastern European accents, Cyrillic, Greek and so on. Read more about it <a href="http://www.fontshop.com/support/opentype.php/">here</a>.</p>
      <p>Pretty sure it’s a custom designed logo inspired by Rotis SemiSerif.</p>
