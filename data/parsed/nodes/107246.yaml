    html: |-
      <p>Congratulations Akira on finding Matterhorn.<br>
      Just to clear up one point about Kyrial, I was NOT proposing that Kyrial display was the right typeface, I was proposing the modified Kyrial SANS [the top row] as the candidate. It does not have the curving bottom terminals on u and d. Leg on R seems straight. But I do not dispute your observation on the top terminals of a and s. So it's still not a match.<br>
      I hope you can find a way to get a legitimate copy of Matterhorn.<br>
      Don</p>
