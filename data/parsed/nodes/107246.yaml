    html: <p>I knew Akira would find this one! Congratulations, that looked too hard for me! I really thought it could have been a mixed of Kyrial Display and Sans (awfully close to Matterholn BTW) which, now I see the answer, looks to be the only solution, Matterholn being an exclusive typeface for Disney so most probably not available for licensing.</p>
