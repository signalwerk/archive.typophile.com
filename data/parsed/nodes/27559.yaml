      <p>Aligning on the decimal point is a good idea. And, like Matt said, put the asterisk notation in the copy, and drop the asterisks themselves. If every datum has the same measurement / unit, there's no point in putting the asterisk on every line.</p>
      <p>Also, I'd drop the indent a little bit, and I'd make the titles to the different sections ("High Crimes and Punishments") flush left.</p>
      <p>Also, you're splitting the key on pages 121 and 122. I'd try to have those on the same spread, if at all possible. Otherwise, there's a bit of a break between the usage of the key and the key itself.</p>
      <p>I really like the faded graphics. That's a nice touch.</p>
