      <p>Page 103 of the new samples, to my mind, is a good example of the problem. There is a rigidity to the page, and yet each element still feels like it's floating. What compounds the issue is, as others have mentioned, the indenting. I'm not entirely sure why you've indented your heads/subheads, and in general your indent looks too deep (especially considering how many one-line paragraphs you have to work with).</p>
      <p>Be careful, however, in taking my comments too much to heart. For instance, my advise on your list of books would be to throw <em>Stop Stealing Sheep...</em> in the garbage. I evaluated a copy a couple of years ago for possible use in my class (I teach publication design) and found myself cringing at each spread. That book seems an incredibly efficient way to totally mess up new students of typography. Beyond that, I'm fairly conservative in my typographic tastes, which in this case speaks to my comment on the all-sans setting, which to me is sort of like setting a table with steel cutlery, steel plates and steel glasses. Utensils (like captions) are built for utility, but plates and tumblers should combine function and form: they should not only hold your food and drink, but should add visual flavour as well. On the table this might mean anything from classical china and crystal to chipped and much-loved stoneware, but in either case the setting has personality. All-sans, however, is sort of like an entire table setting of shiny metal: clean, sleek and simple, but also cold, bland and lifeless.</p>
      <p>But you've already conceded this point, so I'm really just indulging myself here. My apologies.</p>
      <p>As for concrete suggestions, I'd remove the indents from the heads/subheads and maybe find a different face for these, something with a bit of personality that will contrast well with the body type. And reduce the depth of the indents across the board. As for the boxes, try something as simple as adding rounded corners, and make sure you have some padding added in every box (note the bottom of your boxes on 121).</p>
