      <p>Sorry for all the seperate posts, just noticing things as I go along, </p>
      <p>On the Crime pages, all the numbers are marked with an asterix, information design is all about making the information as simple as possible, and getting rid on any unnecessary information. As every number is marked it would probably be a wise thing to mention in the text somewhere that all these figures represent per 1000 people rather than having an asterix beside them all.</p>
      <p>The same goes for the percentage symbol on the Canabis Use page, you could mention that these figures represent a percentage, maybe in a small text just below the table.</p>
      <p>M</p>
