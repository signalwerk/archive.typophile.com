      <p>As others are suggesting, there are a variety of spacing and alignment issues, but the primary "problem" with the samples in general is an overall "cold" design: that is, the design feels really static, uninviting, mechanical. This is partially due to the all-sans type, but equally tied to a strangely rigid yet chaotic layout. The various content types feel forced into place, rather than feeling as though they're exactly where they should be, likely due to too many different alignment points that are competing with each other.</p>
      <p>To me, the stand-out bugs are the poorly padded/spaced boxes on 121, and the mess of 122, but these are just examples of a fairly pervasive situation throughout the document.</p>
