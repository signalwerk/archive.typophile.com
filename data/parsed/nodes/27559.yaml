    html: |-
      <p>jason,</p>
      <p>you are right. i think, as is too often the case, my book design often feels static and mechanical.<br>
      usually, the only other people to see the design before the book is published are the clients. i wish i had peers locally with whom i could show pages, but i don't know how to go about finding anyone. it would be so helpful for me to get critiques from experienced book designers. it somehow seems unreasonable to post all my questions/problems on typophile - because i usually so have many!  </p>
      <p>i have a number of books on typography &amp; design, among them:</p>
      <p><em>the elements of typographic style<br>
      stop stealing sheep…<br>
      thinking with type by ellen lupton<br>
      designing books by joost hochuli &amp; robin kinross<br>
      plus various designer monographs</em></p>
      <p>very often, i will understand what i am reading, but when it comes time to put it into practice i find that i often need more concrete or specific examples to really help me.<br>
      bringhurst, is of course really good, but there is a lot of information there to retain.</p>
      <p>having said that, the samples i posted were the most problematic i thought. i've never really had to work with tabular data before and i really did not know what to do. even technically i was confused - sometimes i used tables and sometimes i just used tabs within my normal body copy formatting. it does seem like a bit of a mess.</p>
      <p>it is too late in design process to radically change things, but i am posting some samples from other chapters of the book for reference and if you see anything else that seems glaringly awful, please let me know.</p>
      <p>the book is a guide for aspiring american expats and explains everything one needs to know to get out of the U.S. and live and work abroad. the light blue text boxes contain accounts from americans who have already expatriated.</p>
      <p>one thing that i would definitely like advice about is the font used for URLs. i am currently using knockout cruiserweight, but i don't think it works too well.</p>
      <p>i really appreciate everyone's advice!</p>
