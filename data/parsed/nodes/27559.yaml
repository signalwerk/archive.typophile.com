    html: |-
      <p>As stated, decimal numbers need to be aligned on the decimal. You may also want to see how it looks using lining numerals.</p>
      <p>The indents bother me too. Indents are used to separate one paragraph from the previous one. However, if there is only one paragraph, there's no need to indent it. (So, all that said, don't indent the first paragraph in a block of paragraphs).</p>
      <p>The colored boxes are a bit bold. I'd maybe fade them out a tad more. Personal preference would also be to give the boxes a bit of padding around the edge and the type. Give the type a bit of room.</p>
      <p>Also, it would probably be ambitious, but a lot of this data looks suited for a presentation via maps.</p>
