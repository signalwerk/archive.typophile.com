    <p>i am in the process of designing a book and i'm not so sure about what i have done with a few pages.</p>
    <p>this particular section of the book contains quite a bit of tabular data and i could really use some feedback about how to improve the design.</p>
    <p>any suggestions as to how to make this all seem a little more legible, "zippy" or just visually interesting would be much appreciated.</p>
    <p>the book dimensions are 6"x9".</p>
    <p>(i hope this is not too many pages, but i could really use your help).</p>
    <p>thanks!</p>
    <p>gregg</p>
