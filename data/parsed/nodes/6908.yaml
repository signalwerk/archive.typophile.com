    html: <p>In response to an earlier question, Kanzlei (literally "chancellory," meaning "office" in the sense of officialness) is an ornamented offshoot of Fraktur drawn with a pointed pen. Or sometimes with a pointed pen and a broad-tipped pen in combination. It's basically the ductus of Fraktur applied through a different tool. There are comparatively few Kanzleis. <br> <br>Notula is harder. I have exactly one example of the style, and it appears to have a separate meaning in pal</p>
