    html: "<p>&gt; If I'm not well familiar with Fraktur, is it still going to be \"more readable\" to me? <br> <br>The mechanics of familiarity are even less understood than those of perception. I myself have some grasp of the latter, but only vague ideas of the former, mostly because there have been no empirical studies on it, at least not in a field close enough to typography for me to have noticed (yet). <br> <br>The two factors I mention play into my perceptual model of reading, but they both have caveats: in the first one, too much narrowness can in fact start hurting readability, and no adequate empirical research has been done to find what a good amount of narrowness/width is*; in the second, there are two factors that act against it: <br>1) The <i>kind</i> of divergence matters: a glyph shouldn't stand out too much from the texture, otherwise it will cause errant fixations. <br>2) The speed and nature of gain in familiarity affects how much you can stray from the \"conventional\" structures. Nobody knows. Nobody even talks about it, not even the \"Familiarity is all that matters\" crowd. <br> <br>* Which would be <i>so</i> easy with something like Minion-MM. <br> <br>The only thing that seems safe to say about familiarity is that it exists and has an effect. So sure, when you're exposed to blackletter for the first time, there's no way you'll be able to read it as quickly as a decent Garamond. But my view is that <i>eventually</i> you will in fact be able to read faster in blackletter. The question is, is that in hours, or years? <br> <br>&gt; Modernization attempts like Fraktoer are welcome, but in my opinion not absolutely necessary. <br> <br>It's hard to quantify necessity. But I think you have to gain a critical mass for blackletter to join the mainstream, and I think you can only do that without requiring \"active learning\". What I'm getting at is, for example, that you can't get blackletter into the mainstream without making individual glyphs easily decipherable: the caps have to change, no long-s, etc. Once you've cleared that, you can shoot for better reading performance by flying under the radar. <br> <br>BTW, Burgundica is <i>so</i> beautiful. <br> <br>&gt; I find that the ambiguities quickly clear up when you take some familiar pieces of text in your word processor and change the font to one of these Frakturs, then gradually move into less familiar pieces of text. <br> <br>This is interesting -if anecdotal- insight, and maybe an indication that familiarity is gained pretty quickly? But it's hard to say, because readability performance cannot be consciously appreciated. In fact the illegibility myth arises directly from the lack of conscious grasp of readability. <br> <br>&gt; We read better what we read more, one might say. <br> <br>Yup! <br> <br>&gt; It's also important to evaluate these on a font-by-font basis <br> <br>That's a very good point. In fact I thought blackletter was just a funky archaic beast until I bought this German novel from 1910 with a nice, light blackletter, and suddenly it hit me. Then I read Bain&amp;Shaw's wonderful \"National Identity\" book, and that gave me the critical context. <br> <br>What was very rewarding was when after my bit in that panel discussion, I was on the shuttle to the museum location (you remember that mess, John?), and Colin Brignall was sitting across the isle, and out of the blue he said: \"You've changed my mind about blackletter.\" That was nice. <br> <br>&gt; Also I consider Fraktur letterforms an extremely divergent example. <br> <br>Right, and it's hard to get a handle on the variants. And in my informal studies, I've come to favor the structure of Fraktur but the finish of Schwabacher. Does that make sense? <br> <br>BTW, what are Kanzlei and Notula? I can't think of anything for the former, but is the latter a chocolate-hazelnut spread favored by Nosferatu? <br> <br>hhp <br></p>"
