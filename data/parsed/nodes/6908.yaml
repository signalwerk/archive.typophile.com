    html: "<p>Regarding readability, I think it is important to distinguish different classifications of blackletter. Hrant points out that in <i>fraktur</i> there is a healthy differentiation of forms, especially in ascenders, that might have a positive cognitive impact. Of course, only an empirical study would demonstrate whether this differentiation actually produces any significant benefit in reading.  <br>   <br>Other styles of blackletter, particularly the textura book hand on which Gutenberg based his types, do not exhibit the same degree of differentiation. Indeed, the poor differentiation of textura letterforms was the source of a game in mediaeval scriptoria: inventing long sentences consisting of words in which the same basic pen strokes are repeated again and again. Here is a famous example (note that this type, Goudy Text, does not perfectly mimic the monk's traditional forms, in which the bottom of the <i>n</i> and <i>m</i> would have full terminals, further reducing differentiation.)  <br>   <br><img src=\"http://www.typophile.com/forums/messages/4077/5138.gif\" alt=\"Scriptorium monks didn't get out much.\">   <br>   <br>The best translation I've been able to come up with is <i>The very short mimes of the snow gods do not wish at all that the very great burden of distributing the wine of the walls will be lightened in their lifetime.</i>   <br></p>"
