    html: <p>Hrant, I generally agree with what you've got there. <br> <br>At first glance, many of those letterforms are similar and easily confused. But some quick and careful study makes them soon legible. Modernization attempts like Fraktoer are welcome, but in my opinion not absolutely necessary. The fact that Fraktoer is a gorgeous, balanced design that stands on its own is another matter. I'm also quite fond of Noordzij's Burgundica--technically not a Fraktur, but definitely in the broken-script family. <br> <br><a href="http://www.romana-hamburg.de/fraktur1.htm">Helzel</a> offers two excellent <a href="http://www.romana-hamburg.de/Marsfraktur.ZIP">free</a> <a href="http://www.romana-hamburg.de/Kochfraktur.ZIP">fonts</a> that one can download, install, and experiment with. I find that the ambiguities quickly clear up when you take some familiar pieces of text in your word processor and change the font to one of these Frakturs, then gradually move into less familiar pieces of text. I think lots of non-German speakers find Fraktur unreadble more because of the actual language than the letterforms. <br> <br>We read better what we read more, one might say. :-) <br> <br>It's also important to evaluate these on a font-by-font basis, really... just like any other font. Some of the older designs are just as easy to read as these recent modernization attempts--indeed, efforts to improve on a perceived illegibility are not new at all, some occurring as early as the 1800s. <br> <br>Also I consider Fraktur letterforms an extremely divergent example. Other kinds of broken scripts, e.g. Textura, have quirks of their own. The lowercase k, for instance, is not an issue in most Texturas.</p>
