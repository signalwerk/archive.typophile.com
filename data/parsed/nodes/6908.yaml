  html: "<p>John Butler mentions the \"illegibility myth\" that blackletter suffers from. I feel it's not just a myth, it's actually very much <i>wrong</i>, and this is based on my research into the true nature of readability. I was part of a panel discussion about the revival of blackletter during the ATypI conference in Leipzig (2000), and the following page on my site is an attempt at encapsulating my stance: <br> <br><a href=\"http://www.themicrofoundry.com/ss_fraktur1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_fraktur1.html</a> <br> <br>Anyway, this isn't a preaching session, so questions, feedback and even opposition are highly valued. <br> <br>hhp <br></p>"
