    html: "<p>&gt; only an empirical study would demonstrate whether this differentiation actually produces any significant benefit in reading. <br> <br>If you want a highly specific study that pinpoints the benefit, then it indeed doesn't exist, and even I wouldn't hold my breath for one! But even if you ignore the basic \"different = easier to tell apart\" truism, many entirely empirical studies by Ovink, Bouma and others point to that being a very safe conclusion. Reading relies on contrast, of various forms, not least of bouma silhouette. <br> <br>But certainly you're right that some styles don't exhibit a benefit. I guess my point is that blackletter (possibly <i>because</i> it's so misunderstood, especially by laymen) simply allows great freedom of design in the extenders. Quick examples: you can curl the ascender of the \"b\"; the \"z\" can have a descender. This can assume a certain anti-historical \"mix-and-match\" approach, but to me that's the kind of evolution that serves the reader best. <br> <br>hhp <br></p>"
