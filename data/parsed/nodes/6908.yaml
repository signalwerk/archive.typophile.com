    html: "<p> I'm prepared to be convinced. Show me what makes them more readable. On your site you mention two: <br> <br>1. \"angular strokes that conserve horizontal space, increasing the number of words we can can grasp through our field of vision\" 2. \"letterform structures are very divergent, making a given word's shape more distinctive\" <br> <br>Is this subjective? If I'm not well familiar with Fraktur, is it still going to be \"more readable\" to me? For example, I've always tripped over the similarities between the lowercase \"b\" and \"h\" <br> <br>On the other hand, would someone who has grown up around blackletter (let's say, in certain Dutch immigrant communities of USA) might read it just as easily as I would read Helvetica? </p>"
