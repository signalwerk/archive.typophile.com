    html: <p>Hello,  <br> <br>Fraktur was the common font design (for not scientific books) in Germany till 1941. (After this date the German government prohibited the usage, because the design can`t be readed in the occupied countries. The official statement was "It`s a Jewish letter!" But this was totally nonsense. So the German type designers stopped developing fraktur designs.  <br> <br><a href="http://www.deutsche-schutzgebiete.de/FRAKTUR.HTM" target="_blank">http://www.deutsche-schutzgebiete.de/FRAKTUR.HTM</a> <br> <br>(So its no historical correct to use Fraktur only as synonym for "German type" in Nazi films.) :-) <br> <br>Historicaly you should also find Blackletter design (Fraktur like) in France.  <br> <br>If you research for some specimen books try to get some German books published before 1941. <br>(D. Stempel Schriftgie</p>
