    <p>Hello Everyone,</p>
    <p>I don't know much on this subject, and was wondering if there were any online resources that list the TrueType fonts that allow this. My company has recently got into making PowerPoint presentations (unfortunately) for clients. I have been reading that it is possible to embed fonts into PowerPoint and still allow users that don't have the fonts to edit and save the presentation without the fonts defaulting. However there are some conditions, this can only be done on PC, it must be a TrueType face, and in the licensing agreement "Editable and Installable" must be allowed by the font creator. </p>
    <p>So I'm looking for a way to quick reference this and find a TrueType font family that allows this feature. My ultimate goal would to be to find a nice large san-serif font family like Univers of Helvetica Neue, although I know Helvetica Neue does not allow this Editable and Installable feature.</p>
    <p>Thanks,<br>
    Jeff</p>
