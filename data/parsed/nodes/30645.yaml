      <p>&gt;Very very few folks allow installable embedding, however. Mostly some Windows core system fonts and maybe a few freeware or shareware fonts.</p>
      <p>MS stopped supporting the installation of 'installable' fonts in our apps some time ago, and most core fonts were in a hard-coded "don't embed" list anyway. We treat 'installable' as 'editable', and set most of our fonts to 'editable' in Vista.</p>
