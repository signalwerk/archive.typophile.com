      <p>Adobe allows editable embedding for those fonts which we can, which is about 1/3 of our library. <a href="http://www.adobe.com/type/browser/info/embedding.html" title="http://www.adobe.com/type/browser/info/embedding.html">http://www.adobe.com/type/browser/info/embedding.html</a></p>
      <p>Very very few folks allow installable embedding, however. Mostly some Windows core system fonts and maybe a few freeware or shareware fonts.</p>
