    date_raw: 16 Jan 2007 — 1:45pm
    votes: null
    html: |-
      <p>Microsoft and Adobe supply mostly 'editable' embedding fonts - no surprises as to why (we both sell apps which support embedding and want to give our customers the best experience). However, most other vendors, realizing that people would exploit the technology in the way you describe, which would equal less sales, set their fonts to ‘print and preview’. You can imagine a company’s design department only licensing a few copies of a font, embedding it in a doc* or PPT and handing it around the entire org for editing. </p>
      <p>Anyway to cut a long story short, outside of the free font space, most vendors make P&amp;P – pick the fonts you want to use and ask the vendor to upgrade you to editable, expect to pay for it, but don’t expect to pay too much ;-)</p>
      <p>Cheers, Si</p>
      <p>* I should add that embedding shouldn’t work with templates for this reason – it’s document embedding, not template embedding. </p>
      <p>PS One note, for PPT, my understanding is that for a presentation to be editable all the fonts need to be set to 'editable' or 'installable' - even if there's one 'print and preview' font embedded in the presentation then it's locked for editing. This has to do with observing the letter of the TT/OT spec.</p>
