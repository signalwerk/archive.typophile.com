    <p>I've recently upgraded to a new MacBook Pro and Leopard this year, and Suitcase Fusion seems a bit buggier than it used to. I'm using version 12.1.7 currently... </p>
    <p>I've never really used anything but Suitcase for font management, but I'm willing to try something new. Any recommendations, or should I stick with what I'm used to? What about the native font management in Leopard? </p>
    <p>I'd love some point/counterpoint on this topic as I'm fairly ignorant on the whole subject.</p>
    <p>Thanks!</p>
