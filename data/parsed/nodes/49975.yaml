      <p>I met with the developers of FontAgent Pro a couple of years ago and I was very impressed. But I haven't tried the program yet. It may very well be the answer. Short of that, the best thing to do is to petition Adobe to bring back ATM Deluxe, which has always been the best font manager out there. </p>
      <p>Why isn't it here? What went wrong?</p>
      <p>Well, ATM Deluxe didn't sell well, that's the main problem. Is it possible it was well under 50,000 copies, or does my memory deceive? The main problem with the Mac version was that it checked and invalidated the majority of competitor Bitstream and Monotype's fonts. That this was a desperate political move to encourage designers to use only Adobe fonts might be illustrated by two facts: (1) the problem was never fixed between the first version of Deluxe for Mac, 4.0, and the last, 4.6; and (2) the invalidation trick wasn't performed in ATM for Windows -- where designers don't, by a majority, live.</p>
      <p>For whatever reason, Adobe decided to move all ATM functionality except font management (which meant PostScript rasterization and subpixel anti-aliasing) into its apps under the once-secret codename 'CoolType'. CoolType doesn't only mean anti-aliasing; it means making every Adobe app capable of rasterizing any Adobe font regardless of the underlying operating system.</p>
      <p>You can see that these actions came out of paranoia: that designers wouldn't primarily use Adobe fonts; that OS developers would pull the rug from under PostScript. </p>
      <p>These fears were well-founded. What was wrong, I think, was Adobe's response. It simply wasn't necessary to pull font management out of the picture. This is something Adobe seems to understand, intuitively, better than any other company, in spite of its mishaps with font-interface strategy (MM numbers from 100 to 1000 is the best example of that). </p>
      <p>To this day, there isn't a more reliable font manager for Vista than the old ATM for NT. OS X users deserve a chance to use Adobe's bulletproof font database programming. </p>
      <p>By the way, the fact that ATM for NT still works under Vista means that Multiple Master fonts still work transparently in every existing application under Vista.</p>
