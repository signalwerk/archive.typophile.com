      <p>Bill, </p>
      <p>my FontExplorer X database currently has over 56,000 fonts and I've found it fast (definitely fastest out of all products I tested) and reliable. I've even had over 65,535 fonts and it worked. </p>
      <p>Suitcase and Font Agent Pro were horribly slow on such large databases or produced errors (started overwriting the first records in the database after indexing 65,535 fonts), while Bitstream Font Navigator for Windows was still fast but, well, had the same problem (65,535 fonts was the maximum). </p>
      <p>If you generate the font directly into one of InDesign's or Adobe's private font folders:<br>
      /Applications/Adobe InDesign CS4/Fonts/<br>
      ~/Library/Application Support/Adobe/Fonts/<br>
      /Library/Application Support/Adobe/Fonts/<br>
      then InDesign will automatically update the font if you switch to it, even if you overwrite it. But remember not to change any family/style naming between iterations -- if you do, you should remove all the AdobeFnt*.lst files and relaunch InDesign, otherwise it may get confused. </p>
      <p>Adam</p>
