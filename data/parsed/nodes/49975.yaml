      <p>Christian, </p>
      <p>I agree that with Leopard's native font previews in Finder, working with native font files without any management software is easier. This combined with Spotlight may be a reasonable working method. </p>
      <p>The reason I love Linotype FontExplorer X is that it stores its data in a SQLite database which I can programatically access from Python. I've written a few Python scripts that use the "Comment" field in FontExplorer's database to store extra metadata for various fonts. Then I can use the smart sets to filter out various sets. Very practical. </p>
      <p>A.</p>
