      <p>I am really glad to hear good things about Font Agent Pro because I want an alternate to Suitcase. </p>
      <p>I fully intend to go from OS 10.4 to 10.5 soon, along with a host of other software upgrades. Sometimes I feel like I'm the only one who struggles with upgrades and the ensuing disruptions they create. I am trying to keep up with the software companies but am losing the battle. As I try to keep up with Adobe and Microsoft, I really need stability in my font manager. I use Suitcase X1, which I went back to reluctantly years ago when Adobe abandoned ATM Deluxe. But Extensis is so quick to jump ahead to the next generation with Fusion 2, that I recently wrote them about my concerns regarding their Suitcase offerings for people like me who are slow to upgrade. </p>
      <p>This was the exchange:</p>
      <p>I wrote:<br>
      I have slipped behind in software upgrades. I am trying to upgrade now, as much as my budget will allow for, but I see that you have already jumped to an upgrade (Fusion 2) whose minimum requirements goes past my processor capabilities and Operating System. I am currently using Suitcase X1 and would like to stay as current as I can, but my computer is a G4 and I operate on 10.4. Do you have any suggestions, or should I find another way to manage my fonts that doesn't include your software? You don't offer Fusion anymore, so what am I supposed to do?</p>
      <p>I am getting increasingly discouraged by the rash of recent software upgrades that are not backward compatible (this includes Adobe and Microsoft).  I sometimes wish that software companies would realize that some of your customers are suffering hard times. I can barely afford any new upgrades, let alone new computers and operating systems. Has anyone looked at a newspaper lately?</p>
      <p>They replied:</p>
      <p>Greetings,<br>
      We have a limited amount of licensing available for Suitcase Fusion 1, but it is offered on a case by case basis. Be aware: Suitcase Fusion only supports CS2, and CS3, and Quark 6.5 and Quark 7. It also requries a 1GHz processor or better, as well as 256megs of RAM. Due to the advanced age of your hardware/ software, Suitcase Fusion may be of little or no use to you. We will also be unable to give you any sort of technical support on Suitcase Fusion as of 10/20/2008. The upgrade is fully priced at $49.98.</p>
      <p>If you find these terms/ circumstances acceptable, please give a call at the number listed below and we will help you place an order for the previous version software. Thank you.</p>
      <p>Kind Regards,<br>
      Customer Service</p>
      <p>Hmm. Nice. Let me think, should I buy a new computer so I can use Fusion 2? Maybe not in this economy. I think it's time to  find another font manager. I'll just have to limp along with my archaic G4. Hopefully Insider Software is a little less arrogant and a little more helpful to designers like me who opt for stability rather than having the latest thing.</p>
      <p>Jim</p>
