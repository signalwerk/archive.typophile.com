      <p>Well,</p>
      <p>I used FAP 3 until Fontexplorer appeared. It was the Fontmanager I was waiting for. It worked like a charm in Tiger, but since upgrading to Leopard I encountered some problems.<br>
      - System font activation status isn't always up to date. I manage my System fonts with fontbook, but Fontexplorer doesn't recognize the status of the fonts in Fontbook.<br>
      - With every restart, I have to "refresh fonts" to activate all the fonts that were activated before the restart. If you don't do this before starting an CS-app, you're screwed. You'll have to activate all your fonts again by hand. Annoying.<br>
      - It crashes now and then (but keeps running, funny)<br>
      - it takes a long time until they have updated PlugIns (Suitcase Fusion 2 has the CS4 plugins). I would like to update to CS4 this year, but I know the CS4-plugins for Fontexplorer won't be released until Q1 next year…</p>
      <p>And I love to see a Support Forum that's moderated by Linotype itself. But it's a free application, so maybe that's not possible (altough I would gladly pay for this kind of app).</p>
      <p>@Hanneman: Despite my problems in Leopard, I think Fontexplorer is a very good (maybe the best) &amp; cheap choice as fontmanager in 10.4</p>
      <p>Has anybody tried Suitcase Fusion 2 (Mac) yet? Is it worth it's money?</p>
      <p>lettertiep</p>
