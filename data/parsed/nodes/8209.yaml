  html: <p>Hi everyone! <br> <br>I'm so used to OS9 with ATM deluxe - but I've purchased a Powerbook with OSX (which contains Fontbook.) I'm getting so stressed out about it, lots of work to do but I'm extremely limited on the fonts I can use at present. <br> <br>I'm running Quark 4 (soon to receive 6 for Xmas!) and have fonts from my OS9 system. <br>The fonts I have are mainly Postscript, of which they won't work with fontbook, or OSX as a whole. I can install them but that's as far as it gets - they don't appear within Quark. <br>Some others do but they appear corrupted! <br> <br>I know that OSX will use TTF fonts, so I can use my Windows ones on there, but I only have limited amount of TTF fonts from my Windows PC. <br> <br>I don't want to start breaking license agreements, but can I not use a font convertor program to change the Postcripts into TTF? If so, where can I get it. I've tried a few freebie programs but they aren't effective, or just difficult to work out.  <br> <br>Will postscripts not work with OSX at all? or am I being a little retarded?  <br>I admit I'm not the biggest font expert in the world - which you can see clearly! <br> <br>Look forward to any help you can offer! Thanks in advance guys (and gals!) And my apologies if you've had post like this before.</p>
  html_clean: <p>Hi everyone! <br> <br>I'm so used to OS9 with ATM deluxe - but I've purchased a Powerbook with OSX (which contains Fontbook.) I'm getting so stressed out about it, lots of work to do but I'm extremely limited on the fonts I can use at present. <br> <br>I'm running Quark 4 (soon to receive 6 for Xmas!) and have fonts from my OS9 system. <br>The fonts I have are mainly Postscript, of which they won't work with fontbook, or OSX as a whole. I can install them but that's as far as it gets - they don't appear within Quark. <br>Some others do but they appear corrupted! <br> <br>I know that OSX will use TTF fonts, so I can use my Windows ones on there, but I only have limited amount of TTF fonts from my Windows PC. <br> <br>I don't want to start breaking license agreements, but can I not use a font convertor program to change the Postcripts into TTF? If so, where can I get it. I've tried a few freebie programs but they aren't effective, or just difficult to work out.  <br> <br>Will postscripts not work with OSX at all? or am I being a little retarded?  <br>I admit I'm not the biggest font expert in the world - which you can see clearly! <br> <br>Look forward to any help you can offer! Thanks in advance guys (and gals!) And my apologies if you've had post like this before.</p>
