    html: <p><i>&gt; repetitive posting - not sure why that's happened</i> <br> <br>It's a bug in the script they use here for posting messages. If you post a message and it seems like it's not going through, 99 times out of 100 it has. Each time you cancel and attempt to post again, another copy of your message will be posted. <br> <br>As near as I can tell, the bug happens when the script tries to display the page you posted to and it gets hung up. The part of the script that posts the message works fine nearly all of the time.</p>
