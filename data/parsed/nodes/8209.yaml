    html: "<p>FontBook can be handy, but it's useless if you want to use fonts in Classic applications.  <br> <br>Only fonts which are placed in the Fonts folder of the OS9 System Folder will be active in Classic applications. FontBook only puts fonts in the usual OSX font locations, the upshot of which is that they are only available to OSX applications. <br> <br>So: The fonts you want to use in Classic applications should be placed in System Folder:Fonts: . (Note: Fonts placed there will be available to all applications, including OSX ones.) <br> <br>As for PostScript fonts, you need to make sure you include both the Font Suitcase and the PostScript Type 1 font file, just like in the old days. ATM is still needed for Classic applications just as with OS9 and earlier, but not for OSX applications as PS Type 1 support is built into OSX. <br> <br>If you want to know more, I would recommend downloading Apple's guide to font management in OSX which can be found here: <br> <br><a href=\"http://www.apple.com/pro/archive/creative/fonts/\" target=\"_blank\">http://www.apple.com/pro/archive/creative/fonts/</a> <br> <br>A word of advice: If you can avoid using Classic applications, font management in OSX will be much simpler.</p>"
    html_clean: "<p>FontBook can be handy, but it's useless if you want to use fonts in Classic applications.  <br> <br>Only fonts which are placed in the Fonts folder of the OS9 System Folder will be active in Classic applications. FontBook only puts fonts in the usual OSX font locations, the upshot of which is that they are only available to OSX applications. <br> <br>So: The fonts you want to use in Classic applications should be placed in System Folder:Fonts: . (Note: Fonts placed there will be available to all applications, including OSX ones.) <br> <br>As for PostScript fonts, you need to make sure you include both the Font Suitcase and the PostScript Type 1 font file, just like in the old days. ATM is still needed for Classic applications just as with OS9 and earlier, but not for OSX applications as PS Type 1 support is built into OSX. <br> <br>If you want to know more, I would recommend downloading Apple's guide to font management in OSX which can be found here: <br> <br><a href=\"http://www.apple.com/pro/archive/creative/fonts/\" target=\"_blank\" class=\"link-external\">http://www.apple.com/pro/archive/creative/fonts/</a> <br> <br>A word of advice: If you can avoid using Classic applications, font management in OSX will be much simpler.</p>"
