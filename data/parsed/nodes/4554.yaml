    html: <p>That's strange. <br>I'd guess that the problem is in your client's machine. Maybe the font isn't correctly installed. <br>Have he tried reinstalling the font? <br> <br>Another (less probable) hypothesis is, there's something wrong with the font's name. <br>Any 'weird' (non-alphabetical) characters in its name?</p>
