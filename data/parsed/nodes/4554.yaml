    html: "<p>sorry, should have gone into more detail. the font shows up in the type menu. however, when he tries to type nothing happens. from what i understand, the cursor doesn't move. so basically corel doesn't understand the font.  <br> <br>i came up with two approaches for this after i posted this: <br>1. download the corel 12 trial version and install it on my pc. if it works on there then no problem on my end. <br>2. since i used fontlab, maybe i should use fontographer and export it as a ttf file. maybe that might have something to do with it? i don't like that option because fontlab shouldn't have a problem. <br> <br>one thing i don't know is what he's running. how old his computer is, if he's using windows 98, etc. so there are some unknown variables in this problem.</p>"
