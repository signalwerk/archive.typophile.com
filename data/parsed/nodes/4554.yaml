  html: <p>I made a font for a client who uses Corel Draw. Now when I suggested that he should switch to Illustrator, that opened a can of worms. He really didn't like my suggestion. <br> <br>The font works for him in Word and Works, so it's obviously valid. It works on both my PC and Mac at home. Is there something perhaps in the way I'm generating the font? I used Fontlab 4.6 to make it. <br> <br>The worse part of this is that Chank made the last font for him and it worked perfectly. I asked Chank if he did anything different from me (after all, he's the one that taught me) and there wasn't anything we could come up with.  <br> <br>What do you think? Anyone have an idea, besides dumping Corel Draw? I mean really, why use that program? But that can't be part of my answer. <br> <br>The only possible thing I can think of is that I copy and paste the font into a new document. Maybe the document is corrupt? I have no clule. Please help me! <br> <br>Thanks!</p>
