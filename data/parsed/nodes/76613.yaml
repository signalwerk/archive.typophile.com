  html: |-
    <p>File under: better late than never?</p>
    <p>Got a few site tweaks done tonight. Thanks to Nick Sherman for the requests:</p>
    <p>1. Added the "blockquote" tag, so now you can quote each other consistently.</p>
    <p>2. Comments are now directly linkable! The timestamp at left is now a direct link to that comment. Copy the link using your browser and do what you will with it.</p>
    <p>I'm no web developer - I'm a designer, and extremely busy in the day job, so thanks for the patience.</p>
    <p>//jared</p>
