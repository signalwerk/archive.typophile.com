  html: |-
    <p>Does anyone know how I can print off or copy (to paste elsewhere) the paragraph/character style information?</p>
    <p>I can see it when I select a paragraph style and go into edit style from the arrow on the pallette, but I can't select the "settings" text to copy and paste. I know I could do a screen capture, but that wouldn't allow me to plunk it into my style guide as editable text.</p>
    <p>I'm lazy! I don't want to type it all out. But I would like to document it so that future users are not required to enter the file to find out the style info.</p>
    <p>Any suggestions are appreciated,<br>
    K.</p>
