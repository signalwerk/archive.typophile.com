      <p>The original version of Blippo had quite a few alternate characters. I'm looking at an old specimen and all the characters in the sample are there.</p>
      <p>Quite often, with digitizations of old film fonts like this, when there are alternates, only one version of each character makes the cut, unfortunately.</p>
