    html: <p><a href="http://new.myfonts.com/fonts/bitstream/blippo/?testdrive=dock%3Dfalse%26size%3D71%26w%3D720%26src%3Dcustom%26text%3DRYTHEM%2520TRACK%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D24" rel="nofollow">Blippo is close</a>, but the E and K are wrong. Oddly, the E and K from <a href="http://new.myfonts.com/fonts/letraset/pump/?testdrive=dock%3Dfalse%26size%3D71%26w%3D720%26src%3Dcustom%26text%3DRYTHEM%2520TRACK%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D21" rel="nofollow">Letraset's Pump</a> seem to match, but I can't believe you'd mix and match two such similar faces like that. Maybe Blippo has alt characters I don't know about? Or maybe that's how they rolled in the 80s?</p>
    html_clean: <p><a href="http://new.myfonts.com/fonts/bitstream/blippo/?testdrive=dock%3Dfalse%26size%3D71%26w%3D720%26src%3Dcustom%26text%3DRYTHEM%2520TRACK%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D24" rel="nofollow" class="link-external">Blippo is close</a>, but the E and K are wrong. Oddly, the E and K from <a href="http://new.myfonts.com/fonts/letraset/pump/?testdrive=dock%3Dfalse%26size%3D71%26w%3D720%26src%3Dcustom%26text%3DRYTHEM%2520TRACK%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D21" rel="nofollow" class="link-external">Letraset's Pump</a> seem to match, but I can't believe you'd mix and match two such similar faces like that. Maybe Blippo has alt characters I don't know about? Or maybe that's how they rolled in the 80s?</p>
