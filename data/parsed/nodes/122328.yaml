    html: <p>Custom by <a class="freelinking external" href="http://www.curtispublishing.com/bios/Moore.shtml" rel="nofollow">Guernsey Moore</a>. There's a digital font in the same style called <a class="freelinking external" href="http://myfonts.us/td-4pg5W5" rel="nofollow">Saturday Morning Toast</a> (Nick Curtis, 2001).</p>
