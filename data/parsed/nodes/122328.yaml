    html: |-
      <p>If you are talking about the two-line nameplate that ran the full width of the cover, it was most likely hand-drawn—not a typeface. That particular nameplate actually dates from the very early 1900s and was used for decades.</p>
      <p>American Type Founders did release a typeface called Curtis Post in 1902. It was based on Post Oldstyle Roman No. 2, which was the model for hand-lettered headings in the magazine at the time:<br><a href="http://luc.devroye.org/fonts-71374.html">http://luc.devroye.org/fonts-71374.html</a><br><a href="http://luc.devroye.org/EJKitson-or-GuernseyMoore-or-HermannIhlenburg--PostOldstyleRomanNo2--1901.png">http://luc.devroye.org/EJKitson-or-GuernseyMoore-or-HermannIhlenburg--Po...</a></p>
      <p>There are a few digital “tribute” typefaces:<br><a href="https://www.myfonts.com/fonts/nicksfonts/saturday-morning-toast/">https://www.myfonts.com/fonts/nicksfonts/saturday-morning-toast/</a><br><a href="https://www.myfonts.com/fonts/jnlevine/lamp-post/">https://www.myfonts.com/fonts/jnlevine/lamp-post/</a></p>
      <p>Another typeface from that era that is very similar is Windsor:<br><a href="http://www.myfonts.com/fonts/mti/windsor-mt/">http://www.myfonts.com/fonts/mti/windsor-mt/</a></p>
    html_clean: |-
