  html: <p>I'm looking for the font from the 1930's Norman Rockwell era Saturday Evening Post which was used in their masthead. Anyone have a name or know where I can find it?</p>
  html_clean: <p>I'm looking for the font from the 1930's Norman Rockwell era Saturday Evening Post which was used in their masthead. Anyone have a name or know where I can find it?</p>
