      <div class="comment-spam-body"><p>I'm not a fan of the "rugged" style of lettering used in the masthead -- but if you are a fan of distressed and antique lettering styles, your mileage will differ.<br>
      I prefer the polished version made by Nick Curtis.<br>
      For searchers of authentic versions of the letterhead the I concur in the  posted information on Curtis Post of 1902 and Post Oldstyle Roman No. 2.<br>
      Every major foundry of circa 1900 produced similar "rugged" rounded letter fonts of similar weight. If there is any interest I will post a list.<br>
      Don.</p>
      </div>
