      <p>F.W. Goudy's Powell of 1903 <img src="/sites/default/files/old-images/<a href=" mailto:goudypowell1903="">GoudyPowell1903@85pct_5994.jpg"&gt; Produced by the Keystone Foundry as a commission for a Mr. Powell, who was working at the time as advertising manager for the Mandel Brothers. Powell had previously commissioned a font for another company. That font became Pabst Old Style, as shown in the ATF 1906 catalog. A digital version<br><img src="/sites/default/files/old-images/LTCPabstOldStyleAsSatEvgPost_5814.gif"><a href="http://www.myfonts.com/fonts/lanston/ltc-pabst-oldstyle/">http://www.myfonts.com/fonts/lanston/ltc-pabst-oldstyle/</a><br>
