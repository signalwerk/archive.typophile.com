    html: <p>Where do you see the differences? Because to me, at this size, I can't see any and believe me, that's probably very hard to match this /S. The other option I could see is <a href="http://www.typography.com/fonts/gotham/overview" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gotham</a> but it has no circular /G even as alternative (that's actually why I suggested Proxima Nova instead of Gotham).</p>
