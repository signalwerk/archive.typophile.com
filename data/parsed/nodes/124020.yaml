    <p>I’ve been trying to figure this out on my own for weeks now and thought I’d run it by the forum. My ligatures, which are pretty basic, are working properly in AI CC, but not in INDD. The character space is being placed on top of the glyph. I’m not sure if the error is cased by FontLab or INDD. I’ve thought maybe it is because it is a reversed font. Can anyone point me in a direction to expire to help solve this? Below are screen grabs of the error and the Open Type code. Thank you.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/ligature%20error.jpg" width="609" height="412" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/opentype%20window.jpg" width="954" height="785" alt="">
