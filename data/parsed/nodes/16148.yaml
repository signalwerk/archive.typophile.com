    <p>Frank Holme (1868 - 1904) was an illustrator working in Chicago, Illinois. In 1898 he started a school of illustration and hired <span class="caps">J. C.</span> Leyendecker, foremost illustrator of the day, as a faculty member. In October of that year he hired <span class="caps">F. X.</span> Leyendecker, also an illustrator, William Carqueville, an illustrator and printer, and <a href="/node/add/wiki?edit%5Btitle%5D=F.%20W.%20Goudy" title="Create node &quot;F. W. Goudy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">F. W.</span> Goudy</a> as faculty. Goudy taught a course in lettering and his students included <a href="/node/13538" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">William Addison Dwiggins</a> and <a href="/node/16149" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Oswald Cooper</a>. The school was housed in the Fine Arts Building on Michigan Ave., formerly the Studebaker&nbsp;Building.</p>
    <p>By the next year the school had twelve faculty including <span class="caps">W. W.</span> Denslow, best known for illustrating the first edition of the Wizard of Oz, and <span class="caps">J. T.</span> McCutcheon, another popular illustrator of the day. Holme eventually closed the school due to health reasons and bankruptcy, and moved to Arizona. He died in 1904 in&nbsp;Colorado.</p>
