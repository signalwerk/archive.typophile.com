      <p>I think each of these samples is from a different font/typeface. The right hand 2, with the pointed ’nose’ looks a bit like Kabel, as Craig Eliason mentioned above, only not quite as closed. I think this is a feature of some Bauhaus-Art Deco styles.</p>
      <p>- Mike Yanega</p>
