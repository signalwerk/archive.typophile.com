    html: |-
      <p>Personally, from an aesthetic vantage point, i like the terminal of the Y that matches the terminal of the S - the very first letter Y in your first post. </p>
      <p>I know that the letter I with rounded ends does not really match any other letter, but it's funky and occupies less space that the solid vertical letter in the last sketch. It allows for more breathing room for the letters beside it.</p>
      <p>No funky counters for the e and r? small pin hole circles like those in records? With the two different colours in use, why not push the two words together? (Random thoughts!)</p>
    html_clean: |-
