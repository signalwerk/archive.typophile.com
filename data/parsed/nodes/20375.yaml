      <p>Thank you all for your suggestions.</p>
      <p>I have attached an image which has my first attempts at modifying some of the characters. I have taken some of the suggestions which Hrant has made with breaking the 'u' and 'n' characters.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DUNLOP Sign Font Options_Quadraat_6303.jpg"></div><p></p>
      <p>I would love to hear any comments about the changes which I have made.</p>
      <p>I have also attached an image which contains some computer generated images of what I would like the final signs to look like in terms of materials and finish.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DUNLOP Sign_Quadraat Options_5717.jpg"></div><p></p>
      <p>Kesh - I have had a look at Pochoir but it is not quite what I am after.</p>
      <p>Chris &amp; Miss Tiffany - thanks for clearing that up. I intend to just stick with modifying Quadraat for the time being.</p>
      <p>I am quite partial to Fountain/Peter Bruhn's 'Eric Sans' face and which seems to lend itself to this purpose. I am not sure how well it would take to the modifications which are needed - it may destroy the elegant simplicity of the letterforms. I may contact Peter Bruhn to get his opinion on modifying Eric Sans for this use.</p>
      <p>Eben &amp; Hrant - thanks for the offer but I think that I will try to do this myself as it seems to be something which is not beyond my current skills (perhaps wishful thinking!).</p>
      <p>It also provides a nice little introduction to letterforms and my ultimate aim of producing my own font at some time. Dreams of joining Frank Lloyd Wright, Neutra and Enric Miralles among the architects who have designed their own fonts (I wish I could also achive the same architecturally!).</p>
      <p>Thanks,</p>
      <p>Grant</p>
