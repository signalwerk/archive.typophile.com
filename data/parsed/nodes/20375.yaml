      <p>I agree with Hrant. The l does get lost. Making it taller seems smart. I wonder if spacing the letters a little wider would help as well since there is more time to read the image and the size is large. The face you are changing was designed to be used/read at much smaller sizes and the spacing was set for that purpose. Since you are changing many of the assumed variables that went into the design you may want to modify the face even further. For cues as to what changes to consider look at faces that have a display &amp; a text version &amp; compare them. Tiffany's point about the p is right on. You may have to exagerate the connection. Connecting at the bottom looks more successful to me.</p>
      <p>If you do get frustated feel free to ask one of us typophiles for professional help. </p>
      <p>Also check this out: It's not cut out ina stenciled manner but it looks quite fine because it is smart about materials, contrasts and the effect of weathering:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arthurquentinsign_3707.jpg"></div><p></p>
      <p>Making a sign that looks better as it ages is very cool in my book.</p>
