      <p>I personally like the last (complete) one in the series - the one with the gappy "u"/"n". Two things that bother me though: 1) The gaps in those are smaller than the gaps in the others; I know if you make them too big "u"/"n" will become more confusable as letters, but it just looks a little imbalanced this way. 2) The "D" looks unhappy; I guess try cutting it elswhere.</p>
      <p>Also, looking at the "simulations", it struck me that, because of the "environmental" strain placed on decipherability, you might want to make the "el" taller, to give it the character (hence decipherability) it lacks even in the best of circumstances.</p>
      <p>hhp</p>
