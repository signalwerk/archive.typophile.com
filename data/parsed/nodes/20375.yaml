    html: |-
      <p>&gt; My main concern is that the changes are<br>
      &gt; working against the nature of Quadraat.</p>
      <p>Indeed, and I think this is happening in two ways:<br>
      1) There's a difference between text fonts and display fonts, and Quadraat is [mostly] the former - while your application is entirely the latter.<br>
      2) As you say, Quadraat is a "calligraphic" (better termed chirographic) design, and I personally think that works against a signage/stencil application.</p>
      <p>I know you like Quadraat, so I didn't say anything at first,<br>
      but I think there are much better fonts to base this on.</p>
      <p>hhp</p>
    html_clean: |-
      <p>&gt; My main concern is that the changes are<br>
      &gt; working against the nature of Quadraat.</p>
      <p>Indeed, and I think this is happening in two ways:<br>
      1) There's a difference between text fonts and display fonts, and Quadraat is [mostly] the former - while your application is entirely the latter.<br>
      2) As you say, Quadraat is a "calligraphic" (better termed chirographic) design, and I personally think that works against a signage/stencil application.</p>
      <p>I know you like Quadraat, so I didn't say anything at first,<br>
      but I think there are much better fonts to base this on.</p>
      <p>hhp</p>
