      <p>One piece of advice: the letters in a font (or a logotype) have to belong together. When you introduce cuts in letters like "D" and "o" out of necessity, consider also adding cuts in letters that don't absolutely need them, out of style. And this can affect where you put the cuts in the letters that necessarily need them. For example, in "Dunlop" it might look best to disjoin the stem and the arch in "u" and "n"... and as a result of that probably disjoin the "p" at the top instead of at the bottom... and as a result of <cite>that</cite> you might cut the "o" at the bottom, to have a low-high-low-high cut pattern in the whole.</p>
      <p>BTW, taking a cue from Eben:<br>
      If you need somebody to carefully do all this slicing<br>
      for you, I'm available: hpapazian_at_gmail_dot_com</p>
      <p>hhp</p>
