      <p>You could get a caligraphic 'practice book' from a used book store. It would show you several caligraphic forms &amp; you could try to deconstruct the letters in Quadraat from there. </p>
      <p>Or you could - if you want to get into something with extra info or context get:</p>
      <p>Gerrit Noordzij<br>
      The stroke: theory of writing<br>
      published 2005<br>
      Translated by Peter Enneson</p>
      <p><a href="http://www.hyphenpress.co.uk/titles/stroke/index.html" title="http://www.hyphenpress.co.uk/titles/stroke/index.html">http://www.hyphenpress.co.uk/titles/stroke/index.html</a></p>
      <p>It's a lovley object in addition to being very interesting &amp; theory rich. I think that just the bit about the process that created blackletter/fraktur/bastarda is worth the price of the book. </p>
      <p>&gt; Understanding the strokes and construction will hopefully help me in placing<br>
      &gt; the breaks themselves and how they could be designed.</p>
      <p>Either way, you won't get a recipe for cutting your letters. Just information about stroke stuctures in conventional calligraphy. I think it's a smart place to start looking. </p>
      <p>Talking about cuts: if you go that route -  they are also going to have to have to support word &amp; letter recognition, and avoid uneven color in the word form. That's why Hrant was talking about modification of more that the 'problem' letters too. The problem with cuts is that unless they are made in a clever way they jump out at you in a distracting way.</p>
      <p>Rather than thinking in terms of 'cuts' you could think instead of a modified stroke - one that creates a gap. You could write out the forms yourself allowing for the breaks. Or look for a way to simulate this in the forms of Quadraat. Again, you would want to apply this approach for an even looking visual effect.</p>
      <p>Or you could Drill out the forms of the letters in circles of various sizes, so that the letter appears to be 'made' from holes like random-ish bubbles of different sizes filling up the target letter form.</p>
      <p>I guess that my suggestion for two contrasting metals isn't distracting you - huh? </p>
      <p>;-)</p>
      <p>You could also do something po-mo like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/minitorontocontruction_3713.jpg"></div><p></p>
      <p>After all you are an architect. :-P</p>
    html_clean: |-
