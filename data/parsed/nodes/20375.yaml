      <p>That Quadraat is a text face doesn't preclude a modified version rendered suitable for display size. It is true that a pro would be better suited to the task that Grant is going to be - but maybe it doesn't have to happen tomorrow and Grant can learn how. I would suggest increasing the contrasts between thicks &amp; thins for a start, spacing the letters a bit further apart maybe and maybe making the letters slightly wider too.</p>
