      <p>Dear Miss Tiffany, Hrant &amp; Eben,</p>
      <p>Thank you for your replies and suggestions.</p>
      <p>I have modified the letterforms a little bit more but I am now worried that the changes are taking them a long way from the original letterforms - to something which is not what I expected (wanted). I guess this shouldn't be such a suprise considering I am taking Quadraat outside its normal area of use. My main concern is that the changes are working against the nature of Quadraat. I would like to see if there are perhaps more natural ways of breaking up the letterforms which are in keeping with the pen strokes which the font seems to be modelled on.</p>
      <p>I would be grateful if any one can point me in the direction of any references to study the stroke order or construction of Quadraat and similar 'calligraphic' fonts? Understanding the strokes and construction will hopefully help me in placing the breaks themselves and how they could be designed.</p>
      <p>Thanks,</p>
      <p>Grant</p>
