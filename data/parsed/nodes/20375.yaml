    <p>Dear All,</p>
    <p>I am an architect with a strong interest in all things type related and I am in the process of getting a sign made for my house/apartment here in Japan and for when we return to Australia. The sign will be made of laser cut steel plate (similar to the sign by Peter Verheul in the attached image <a href="http://www.farhill.nl/02_lettering/applettering.html" title="http://www.farhill.nl/02_lettering/applettering.html">http://www.farhill.nl/02_lettering/applettering.html</a>).</p>
    <p>I would like to use a calligraphic such as FF Quadraat (please forgive my poor grasp of the lexicon!) as I love their letterforms and especially those of the italics (and I have an existing license of the family).</p>
    <p>The final sign may simply have our family name (Dunlop as you can probably guess!) or we may include an additional line above of 'Grant &amp; Yoko' in a smaller point size. The obvious problem is with the counters in some of the characters (D, O, P, a, o, p) especially and the process of laser cutting them. </p>
    <p>There seems to be two obvious approaches to solving this problem:</p>
    <p>1. Find an alternative 'stencil' type font which possesses the same calligraphic feel of FF Quadraat (or Fedra Serif for example) which would be suitable for a stencil type use.</p>
    <p>2. Modify the problematic characters of an existing font to make it suitable for stenciling.</p>
    <p>A third less obvious solution is to design a character/font from scrarch which fits the purpose. This could be possible but I may then never end up with a sign! </p>
    <p>I have taken a look at some of the other 'stencil' threads (Wallflower:) <a href="http://typophile.com/node/4933" title="http://typophile.com/node/4933">http://typophile.com/node/4933</a> &amp; <a href="http://typophile.com/node/15078" title="http://typophile.com/node/15078">http://typophile.com/node/15078</a> here and they have provided some inspiration to tackle the third option. Peter Verheul's letters and signs are also an inspiration and a spur.</p>
    <p>I would be grateful if anybody could provide some advice for the first two options: any fonts which fit the first options and what the correct process would be for obtaining permission to alter those problem characters to make them suitable for the purpose.</p>
    <p>I look forward to your responses.</p>
    <p>Regards,</p>
    <p>Grant Dunlop</p>
