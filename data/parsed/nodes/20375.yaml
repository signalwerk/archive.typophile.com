    html: <p>I think a bigger issue than typeface choice is effectiveness of the finished sign in its intended location. Grant, consider the legibility of the third virtual example you posted. To most passersby, unless the sign is right at face level, near the viewer (which signs never are, to people driving past looking for your house), a gray metal sign on a grayish background with reflections and shadows is going to be "ambiguous" at best. I would concentrate on finding an appropriate material to contrast with the background, and find a way to make the sign that doesn't require connecting links to hold the counters in place. It could be a piece of flashed glass (thin colored layer on clear) sandblasted so the colors contrast, and it could be lit from behind. for that matter, since you're an architect, I don't know why you aren't considering just having the letters themselves cut out and mounted on steel pins as is done on buildings. Then, you can choose any typeface that is clear and strong. Is that too obvious? It's simpler...</p>
