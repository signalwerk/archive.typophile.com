    html: <p>There's nothing to prohibit you from customizing a type for this purpose. You just can't resell, or redistribute it. Most foundries allow you to preview type, you could preview your desired text and do a rough edit in photoshop (removing bits of letters) to see if it would work. Once you've landed on the type you like you can either edit yourself, or hire a typographer to edit the characters for you. There are plenty of capable folks on this site. Best of luck.</p>
