  html: |-
    <p>My previous posting was a bit cryptic. </p>
    <p>The client I'm working with is using proprietary fonts that I have reworked as OT/TTF versions. I did them as OT for their own use in graphics, but the main use is for flash based greeting cards/invitations where users choose a font and text and it is printed and mailed elsewhere.</p>
    <p>I did 11 fonts all together with varying amounts of features. Of these only one is behaving weird. In the classic Flash version I believe OT features are not accessible. That seems fine, but on this one its still mapping to a beginning of line character instead of the default. The other part of this problem is it seems to add or take away spaces. Any ideas what can cause this?</p>
