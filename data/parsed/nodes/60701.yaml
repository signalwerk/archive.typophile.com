    <p>Bonnington is a Roman display face full of the spirit of the 1920s, developing further the ideas in our Bonning family.</p>
    <p>Three weights are offered, including a shadowed black form, in a choice of regular and condensed widths. More…</p>
    <p>It’s the ideal face for signage with a period feel, as well as posters and headings. Combine Bonnington and Bonning together using Bonnington for eye-catching headings and Bonning for other text.  Careful slection of the Glyphs can give a delightfully formal yet hand lettered feel.</p>
    <p>You can see Bonnington in action on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a> or try it for yourself on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bonnington/ " rel="nofollow"> Myfonts.com</a>.  </p>
    <p>Meanwhile, Here's one example of Bonnington in action (lots more on the <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bonnington_Gallery6_5263.png"></div><p></p>
