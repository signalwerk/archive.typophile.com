    <p>June 10, 2009 - Boston.</p>
    <p><em>The Palm® Pre™ is already selling out — after great reviews. The revolutionary new user interface is enhanced by new fonts from the Font Bureau.</em></p>
    <p>This past weekend’s notable release of the <a href="http://www.palm.com/us/products/phones/pre/index.html" rel="nofollow">Palm Pre</a> also saw the debut of custom fonts developed especially for the Pre by the Font Bureau.</p>
    <p>To build a unique visual experience for the Pre user, Palm commissioned a suite of fonts from the <a href="http://www.fontbureau.com" rel="nofollow">Font Bureau</a>, a type foundry noted for its many custom designs for major publications and corporations. The fonts, named Prelude, were designed by Font Bureau co-founder <a href="http://www.fontbureau.com/people/DavidBerlow" rel="nofollow">David Berlow</a>, who has also developed fonts for Microsoft and Apple.</p>
    <p>Prelude is an original sans serif design of simple, generous letterforms which provide a clear, comfortable, and inviting experience for navigation and readability. A family of six fonts was developed for the Palm Pre. A related set of fonts, named Apres, which are tuned specifically for use in print and marketing, were also developed by Berlow and the Font Bureau.</p>
    <p>Noted publication designer and consultant <a href="http://www.rogerblack.com/about/" rel="nofollow">Roger Black</a>, of Roger Black Studio, Inc., consulted with <a href="http://blog.palm.com/palm/2009/06/-mat%C3%ADas-duarte-that-design-hippie.html" rel="nofollow">Matías Duarte</a>, Peter Skillman, and the Palm team on the project.  When it came time to select typefaces for the Palm user interface, as well as the web and print branding, Black suggested developing custom solutions with Berlow, a long-time collaborator.</p>
    <p>“David Berlow has worked on the fonts for all kinds of screen and print uses,” said Black. “It makes sense that Palm turned to him for the fonts for their potentially revolutionary operating system, webOS™.</p>
    <p>“As the name suggests, the Palm’s webOS is based on web standards. With David’s unrivaled understanding of these standards, and Palm’s dedication to a high quality solution, the Pre is able to deliver an obvious improvement in readability — as well as bringing a consistent and stylish visual experience to the user.”</p>
    <p>In his <a href="http://www.engadget.com/2009/06/03/palm-pre-review-part-1-hardware-webos-user-interface/" rel="nofollow">review</a> for Engadget.com, Joshua Topolsky noted, “The selection of fonts and font styling, use of transparencies, unified look of all of the elements, smooth transitions, and detailed application icons tie together in a really elegant way.”</p>
    <p>&nbsp;<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/FBNews-PalmPre-screens_3697.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/FBNews-Prelude-styles_3960.gif"></div><p></p>
    <p>&nbsp;<br>
    <strong>About Font Bureau</strong><br>
    Font Bureau was founded in 1989 by noted publications designer and consultant Roger Black and type designer David Berlow to serve the emerging needs of microcomputer-based magazine and newspaper publishers seeking unique typographic identities. During the past 20 years, Font Bureau has designed more than 1,500 fonts for more than 300 publications, many of which have become part of Font Bureau’s <a href="http://www.fontbureau.com/fonts/" rel="nofollow">Retail Library</a>.</p>
