      <p>Nick, as I remember, it was some Adobe products -- CS2, maybe? -- that had this issue. Basically, the program checked for gsub tables, and if it didn't find any, rather than moving on to look for gpos tables, it just said "Oh, there aren't any ..." All you needed was one gsub routine to get kerning to work.</p>
      <p>As for Mr. Woodard's problem, I'd bet he'll find it somewhere in the class kerning setup. With FontLab, I'd try opening up the font (not vfb), write off the "features" file, put a kerning exception line in the kern table (before the class kerns) and read it back in, compile, generate the font, and test. If the kern now works, that little test confirms there is an issue with the class kerning setup.</p>
      <p>FWIW</p>
      <p>EDIT: And I guess make sure there isn't an</p>
      <p>pos X O o; (or really low value)</p>
      <p>as an exception already in the file...</p>
