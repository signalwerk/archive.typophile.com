      <p>Thanks, but I can't say I follow Charles' suggestions. I am not sure what a "kerning exception line" is or how to put it in or how to write off the features from the otf file. Sometimes FontLab makes me really miss my old Fontographer.</p>
      <p>The OT Kerning Assistance Tool doesn't find any problems with my classes. I have combed through them several times to see where I might have messed something up. All the rest of the kerning works fine. All I can figure is that it must have something to do with the fact that the three X's are the only glyphs not part of a kerning class.</p>
      <p>Trying to get it to work, I set up individual kerning classes for the X, x and x.smallcap. With just the single glyph in each class. Seems stupid... But the X's are kerning fine now -- in all my Adobe apps anyway. I am checking to see if this has caused any issues in other apps.</p>
