  html: <p>I have been testing my Greek version of Froggy with assorted Greek text.  I have noticed that the tonos is occasionally used in a similar manner as an apostrophe.  Is this a common practice or is this just someones errant typing?  I kerned the tonos to all the glyphs in any case but am curious if this is the norm?</p>
