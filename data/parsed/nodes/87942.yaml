    html: <p>Interesting. I thought the Greek apostrophe was supposed to look like the smooth breathing mark, which is superficially similar to the Latin apostrophe but with enough differences in shape, size, and position not to be mistaken for it. Since monotonic orthography no longer uses the smooth breathing mark, maybe the reasoning is that the tonos should take over the role as the template for what the Greek apostrophe should look like. Or it could be a lazy mistake.</p>
