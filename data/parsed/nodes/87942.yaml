    html: |-
      <p>Okay, this is interesting. The 'Unicode Data' provided by InDesign is misleading, if that is truly associated with the sign following the tau.</p>
      <p>U+0384 is <em>not</em> the COMBINING ACUTE ACCENT. U+0384 is the <em>spacing</em> GREEK TONOS character, which was encoded for backwards compatibility purposes to enable encoding of uppercase diacritics by entering the spacing tonos before the capital, e.g. ΄E. [This encoding is not encouraged.]</p>
      <p>Now, U+0384 has a compatibility decomposition to 0020 0301, i.e. the space character followed by a combing acute accent. So it is possible that InDesign is reporting Unicode Data for this decomposition, which is why you are seeing it reported as COMBINING ACUTE ACCENT (U+0301).</p>
      <p>As to how this ended up in the text, it seems likely that some Greek users mistype the spacing tonos instead of the apostrophe in the same way that some English users type ` instead of '.</p>
