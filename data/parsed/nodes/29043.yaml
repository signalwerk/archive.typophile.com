      <p>Great feedback, thanks. I've decided to split things into two versions, and allow myself more time for the body-copy oriented version. Then, later, I can reform them into one OT face. This way I can get the one for promotional work done. I'm glad the x and the z stand out as bad, I hate 'em, too. I will get back to those last, tomorrow.</p>
      <p>The grid-feel will be toned down lightly, and I have already corrected the spacing a good bit. Hadn't thought about the fi, since that's not in the band's name! Good point not sure what I will do tho'. Lots of work to go, th caps are designed but need extensive tuning due to lots of angeld crossbars appearing to stagger. Also, the caps are way to lurid for body text. All the responses here have been, if not positive, appropriate. I showed it to the bassist, she gave it the thumbs up as well.</p>
      <p><a href="http://www.exclamchine.com">!Exclamachine Type Foundry</a><br><a href="http://www.exclamachine.com/snark">The Snark</a></p>
      <p>p.s. thanks for the spacing feedback especiaally, I've been pushing letters back and forth, as the more traditional style of spacing the lettes just hasnt looked 'tough enough".</p>
