      <p>The dots above I plan on, after removing the grid, moving the bottoms, so that the change in angle is averaged between the white space and the dot bottom. Likewise, I plan to do as subtle a tweaking to the interior hooks as possible to give it a slightly humane feel. While doing this, I'm sure I'll lightly move lots of points. Here's a rastered idea of the tuning.</p>
      <p><img src="/sites/default/files/old-images/gridfiddles_3416.jpg"><br>
      &nbsp;</p>
      <p>What I mean by press-friendly, is if there are any things to keep in mind when designing, to keep the similarities between laser printer/photocopy and running it on a photosetting machine as much as possible. I hear and see things about inktraps and such, and have experience with it in general design, but not at the glyph-design level.</p>
      <p>The target date is early the 29th AM, for a flyer to go up that afternoon. I keep thinking of that old saying, You can get it fast, cheap and good, but you can't have all three." At least I know exactly which capitals and numbers I need. Meanwhile, my tablet's stylus is AWOL, and my keyboard is doing ...something strange. C'est la vi. :(</p>
