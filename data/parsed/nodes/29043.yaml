      <p>Staying on the grid for reasons of speeding up development seems to make sense. On the other hand, it's very hard for a third-party to evaluate things this way, since he can't know what you <cite>intend</cite> to eventually tweak...</p>
      <p>Concerning mechanical versus natural, I would say that optical effects (like how the gap in the "i" looks splayed because the top of the tittle is at a different angle) cause strict adherence to the grid to actually result in irregular forms, more than it results in preventing naturalism. Ergo: some off-gridding is actually needed to make it look geometric.</p>
      <p>Press friendly at large sizes? I don't get it.</p>
      <p>hhp</p>
