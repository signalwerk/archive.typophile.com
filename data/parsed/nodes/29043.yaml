      <p>Well M. Cunninfham, If it helps, this makes me as uncomfortable to look at as heavy metal does to listen to. (we are not talking. here, about the original heavy metal bands, from which the music got its name, like Iron Butterfly or Led Zeppelin, or even later works such as the first [and seminal] Black Sabbath album, though Ozzie lost it after that, of course.... oh, sorry... off topic...).</p>
      <p>Which is only to say that, well, I dont like it. But, you are not designing for my tastes.~  As M. hrant notes, as a Logotype, possibly, but I wouldn't recommend it for the liner notes. I think that I might be tempted to offer this for the logo, but do a variation that was a lil more readable, if in fact they want a complete font for broader use.</p>
      <p>I recently came up with a lil rule of my own, as a result of a critique of a portion of a font which the reviewer otherwise liked. "if ya dont recognize what the hell it is outside the context of the char set, it doesn't work". By that standard, yes, the 'z' in this set needs attention, but the 'x' is worse. You obviously have worked out some rather rigid design principles and their application is pretty uniform, perhaps to the fonts detriment (I suppose this is what hrant means by "too much grid). It might help to look to see where deviation from the norm would improve the overall look.</p>
      <p>In the logo (i assume) the spacing that seems to work best is g/a. the r/g is far too wide. I would actually kern that pair. I think the logo works well, though getting that F/i to work is gonna be a mutha. You may have to overlap or go with a dotless 'i'.</p>
      <p>geo.</p>
