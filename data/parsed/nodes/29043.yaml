    <p>The client wants a logotype for a heavy metal band with industrial influences, using, in their words, "Like those heavy metal letters, but that stand out".</p>
    <p>Note, the 'x' and the 'z' are not done yet (along with lots of other things).</p>
    <p><img src="/sites/default/files/old-images/hmetalletters_4923.jpg">&nbsp;<br>
    I've decided to design it as a font, so it can be used for posters, etc. There are no curves, just angles. I've attempted to create "beefy" stroke proportions that allude to low-grade machine pressing. To avoid a volksy look, the bottom and top angles are varied  to meet body centers at matching vertical points.</p>
    <p>1. Does this seem to fit the bill (metal, industrial)?<br>
    2. Is it too similar to any common faces?<br>
    3. Any ideas for the z, or references?</p>
    <p>I've been staring at it so long now that It's difficult to detach.</p>
