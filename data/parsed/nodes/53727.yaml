    <p>Hello, my fellow typophiles. </p>
    <p>I would like to invite you guys to have your say on a new rebranding.  </p>
    <p>A couple of days, I happened to stumble upon the rebranding news about Beijing Television,  the capital city television station in China. Shown below is the new logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/btv_3628.gif"></div><br>
    When I saw the English wordmark at first sight, it seems sort of bad to me, though much better than it used to be just before the redesign, shown as follows (the old wordmark is OK, but too banal.):<br>
    <div class="imageWrap"><img src="http://typophile.com/files/btvold_4944.jpg"></div><br>
    Talking about the new logo, personally, I think the little serif is not a good typeface choice. The typeface seems to be slightly modified Copperlate Gothic Std. And even worse, there is a customized, homemade ligature between T and V. It bonds TV together, but disconnects B from the whole wordmark. <p></p>
    <p>Here is what the BTV says about its new logo in a press release:</p>
    <p>"...the new logo consists of acronym of Beijing Television as major design elements. Clear, minimalistic, it conveys a more modern and international look. In color palette are red color of the forbidden city wall and white of Han white jades. The two colors are solemn, modern and international, blend seamlessly with the television station." Really, blurbs. </p>
    <p>And the new logo looks like this at BTV's website:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/btvontheweb_5837.png"></div><br>
    Well, what do you think this new logo (especially the typography)? If it needs a third rebranding, what typefaces would you like to pick? :)<p></p>
    <p>regards,</p>
    <p>James Zhou</p>
