      <p>@hashimpm</p>
      <p>The logo typeface is indeed Friz Quadrata.:) Gotham fits well, but I'm afraid it's sort of overused.</p>
      <p>And I agreed with you. English typography in China is really bad and even disastrous. For most of them Chinese designers, what they know only are Arial or Times New Roman. When it comes to corporate design (graphic marks aside, mostly involving juxtaposition or mashup of Chinese and English typefaces. It’s bilingual as the say), designers usually take whatever available at their hands, never giving typography a second thought. In most cases, they use free fonts circulated on the web. Or better, Adobe Font Folio is a choice. But whatever they use in typography, the finished works end up as ugly ducks due to a fundamental paucity of typographic knowledge. English typography in China is like an isolated world where designers just use what they like, without caring about what goes on with current typography. (A reasonable excuse is that they balk at English, they need translation)</p>
      <p>A brutal fact is: Chinese designers, regardless of veteran or newbie, love doing what is called typefaces transformation or distortion (NOT modifying merely glyphs). It’s so popular that every designer like to show his/her tricks for the “magical” transformation. But what they do to typefaces seems typographic tortures to me. Quite sadly and embarrassingly, they also boast their works on graphic design forums. </p>
      <p>Unlike type foundries here in the US, Germany, France and other countries, Chinese type foundries have been wilting and get submerged by the massive overflows of fonts available on the web. Basically, China has a long history of calligraphy, but it lacks a good culture of typography (By and large, type foundries is just after pure profits, not the pure typography, to some extent, the typography is contaminated with commercial profitability). Everyone can be type designs, then where does the font value lies in? Even ridiculously, a famous Chinese type foundry successfully digitized a director’s handwritten scripts. The new “characteristic” typeface was named after the director and became a smash hit on the web. By the way, this director knows nothing about neither typography nor calligraphy, she just have a pair of beautiful hands which impart good-looking scripts. There is an old news: Akira Kobayashi was once invited to be as a judge at the Chinese Type Design Contest (I really appreciate Akira's works) . When I read the news, part of me was lost... </p>
      <p>Finally, I don't know when Chinese type designers can wake up to the real type design and typography and learn about it.</p>
