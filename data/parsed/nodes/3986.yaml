    html: <p>There is an excellent 184 page book on Herb Lubalin and his work. I have the 1985 paperback edition which which was the third printing at that time. <br>The book is titled....Herb Lubalin-Art Director,Graphic Designer and Typographer by Gertrude Snyder and Alan Peckolick. <br> <br>The last three columns are the rules of  the contest  with the deadline for submission being 5:00 p.m., Monday  May 27, 1968.  <br> <br>gln </p>
