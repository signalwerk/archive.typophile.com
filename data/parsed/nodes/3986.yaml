  html: <p> i need help!! <br> <br> im doing an essay of  Design in  a National Context which is about compare and contrast the approaches to furniture design or graphic design over 25 years in two countries. <br> <br> i chose Britain and America, i chose the advertisement in 1968 from herb lubalin,anyone knows about this typography poster? i need make some comment on this poster but i don't know what to say, its relevant with Avant Garde <br> <br>thx loads<img src="http://www.typophile.com/forums/messages/30/32172.jpg" alt="advertisement 1968"></p>
