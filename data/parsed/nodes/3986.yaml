    html: <p>Lynn -- By all means do a googlesearch on the work of Judy Kensley McKie, who is one of the best furniture designers and artisans the USA has ever produced. As for Lubalin his work was overly promoted in the design and typophile press, some of which was very good and some -- such as this example -- well, not so good. As for Nick's "tight but not touching," we used to call examples of it "kiss fit" and joked that it came about because so many immigrants in New York, to whom English was a foreign language, were the ones composing copy on Staromats in subterranean darkrooms.</p>
