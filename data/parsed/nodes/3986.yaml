    html: <p>Lubalin was an anti-establishment activist, pro-sex (EROS magazine), anti-war. <br>His counterparts in the UK signed the original First Things First manifesto, in 1964. <br>Gerald Holtom was a WW2 conscientious objector who designed the CND logo (peace symbol) in the late 50s <br>The "tight but not touching" style of display typography was a phenomenon on both sides of the pond in the 60s; Lubalin was its main main in the US. In the UK, not so readily identified with one person.  <br>But it was also about the "gridularity" of the layout, and you can see that in the design and layout of FTF v.1</p>
