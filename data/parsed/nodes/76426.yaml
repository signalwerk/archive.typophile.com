    html: <p>Ascribing analagous moods and personalities to the qualities of a typeface is natural, and they way we do it is worth exploring. But I would back away from the focus on gender. There are too many steps in the folly of associating type with a gender, because it requires you first to have an idea of what human qualities you think are masculine or feminine, and in this enlightened age, the social construct of gender essentialism is just about too weak to convincingly apply to real human beings, let alone stretch to type. Any attempt to justify your conclusions puts you at risk of throwing your lot in with the evo-psychs.</p>
