      <p><em>You cannot cast a fragile, elderly man in the role of a HotWheels advertisement, a small boy needs to push those cars along to sell it to other small boys.</em></p>
      <p>Well, Santa would be OK.<br>
      But that's not really the acting analogy.<br>
      It's more those 30-year olds in high-school movies.<br>
      Or Charlize in Monster. </p>
      <p>I don't think you're addressing the extent to which the attributes of a typeface are determined by its setting, or the extent to which such attributes are cultural constructions.<br>
      Certainly, if one word of an elegant script is compared in a lab with one word of a functional sans, and you're offered a multiple choice including ( ) masculine and ( ) feminine, it's not hard to figure out which box you're supposed to check.</p>
      <p>What is the default, or neutral setting for a typeface, for an empirical appraisal of its qualities?<br>
      That's like asking what is the default kind of music to compare musical instruments.</p>
