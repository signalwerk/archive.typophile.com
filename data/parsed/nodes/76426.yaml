      <p>As for your typeface, Merlin, (I could be way off track with your intent,) I see a clear gender directed towards masculinity as well as a a general structure leaning towards dry land, an ogre in the background; sharp beaked falcons and "fangs, talons". Maybe a little more flora than fauna, but not in a roses and daffodils sort of way; more tumbleweed and briars (or "barbs").<br>
