      <p>Fascinating stuff. But you'll need to be very precise in your wording and the questions you ask – and rigorous in how you investigate them.</p>
      <p><cite>"It's up to the typographer to do the casting and provide the direction."</cite><br>
      Yes typography can change the way a typeface «acts» on paper a lot. But you can only work against so much; type is not invisible. If you cast a stubbly actor in a female part he's still not going to look like a woman, even if you make him sing really high. </p>
      <p><cite>"the social construct of gender essentialism is just about too weak to convincingly apply to real human beings, let alone stretch to type"</cite><br>
      Dunno if it's «weak», I'd say it's multi-faceted, complex, and fascinating. If scientists can investigate what sort of typefaces laymen perceive as «friendly», «authoritative», &amp;c then why not masculine &amp; feminine? I'd warn against backing off from looking at how we perceive, ascribe, construct gender just because some will tell you it's either not PC, or not «scientifically sound». Just be sure to view this <em>construction</em> of gender-specifics as largely dependent on reflection in a given cultural context, not of course as something inherent to the shapes themselves.<br>
      (Actually, has anybody done any work on this: Investigating what sort of shapes would generally be perceived as masculine vs. feminine in the [Latin] West vs. in other cultures?)</p>
