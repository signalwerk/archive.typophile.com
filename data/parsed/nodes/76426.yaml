      <p>I do not just think the matter is all but far-fetched: I would push it even further! While re-designing a late medieval typeface I realized it had some sort of intrinsic phytomorphic nature. So, please: consider to expand your topic as <strong>Anthropomorphism, Zoomorphism &amp; Phytomorphism in Typography</strong>.</p>
      <p>Now, not to get completely lost in an early stage of your research, I would suggest to start from what has been already written about the history of writing. The fact you name <em>The Book of Kells</em> let me think you may like this kind of approach. Otherwise the risk is to forget the fundamentals while dealing with the most recent (and bizarre) typefaces.</p>
