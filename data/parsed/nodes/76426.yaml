    html: "<p>I believe we do that kind of association a lot. Sometimes in an intuitive way. Although vulnerable to context, we tend to associate shapes iconically. Do you think, for instance, that swash caps and the elegance of italics can be linked more rapidly to a masculine shape or a feminin curve? On the other hand, and giving some support to Nick's point of view, a rude black-weighted sans-serif can be imagined as being injected with testosterone, but what happens if it is put in a pink background, with some flowers? It reminds me of typography as it is, or as it should be: typefaces are not the only criteria of selection when working with text. Do you think it makes sense to put a man in a art nail context, or a lion swimming with dolphins? Context does matter. If we are talking about Rennaissance, Bembo would be a natural choice, but what if the intention is contrast? Things should be seen as a whole, with a purpose, in a context, don´t you think?</p>"
