      <p><cite> &gt; I'd also like to know why Matthew Carter named a font Elephant</cite></p>
      <p>I believe Carter had in mind one of the names of a paper size in the old imperial naming system (which would have been in prevalent use during the period from which this style of type comes), not necessarily the animal, per se. </p>
      <p>Carter's design is based on a Five Lines Pica face, which is a pretty large size, by Vincent Figgins. And Elephant was a good-sized paper stock (~ 23 x 28 inches). Seems to be a nice resonance there. </p>
      <p>But I might be completely off base. I could try to confirm that supposition with him.</p>
