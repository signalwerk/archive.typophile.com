      <p>going back to what Nick said (its stuck in my brain recently), I think the decisions made on casting those actors to fill those roles is where my interest lies. <em>Why</em> was Aphrodite [Slim] Pro chosen to advertise women's clothing in the place of H&amp;FJ's Forza? What if we saw Forza advertising My Little Pony? and Buttermilk or Candy Script advertising Gillette razors (for men)?<br>
      All of this shows the typographer in question didn't do his research on the company and audience: he didn't cast the actors in the proper role <em>because</em> each of those typefaces has a personality and characteristics that make them look so out of place in those instances.<br>
      You cannot cast a fragile, elderly man in the role of a HotWheels advertisement, a small boy needs to push those cars along to sell it to other small boys.<br>
      In this way, there are animalistic qualities we can recognize (if subconsciously) in typefaces as well.</p>
      <p>Instead of viewing typefaces that are in a state of functionality and saying that this thesis doesn't hold water, I think I am trying to communicate that we should view fonts in a vacuum of black and white and then proceed to apply them to the correct scenarios and <em>why</em> we chose that font for that role.</p>
      <p>The topic of zoomorphism carries the same weight but might be harder to distinguish, personally. Hence, why I wanted to introduce that idea. What characteristics, within a typeface, tangible or intangible, visually describe to us a specific archetypal creature based on innate notions? I can't quite clarify this anymore, for this thread or for myself, thats where I am looking for a little direction.</p>
      <p>I hope that clears up some of the of lack of clarity of my initial post.</p>
