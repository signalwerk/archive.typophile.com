    html: |-
      <p>This is Wyatt, designed by Paul Barnes for the redesign of <cite>O, The Oprah Magazine</cite> by our friends at <a class="freelinking external" href="http://www.priestandgrace.com" rel="nofollow">Priest + Grace</a>, which just launched this past week with the September issue. You can see a little more info <a class="freelinking external" href="http://commercialtype.com/news/26" rel="nofollow">here.</a> We're hoping to get some images up on our Facebook page soon, as well.</p>
      <p>The redesign uses Wyatt along with Kris Sowersby's National and Matthew Carter's Miller Text.</p>
      <p>Incidentally, <cite>O</cite> did use Narziss for their special 10-year anniversary issue, but that was a special one-off.</p>
