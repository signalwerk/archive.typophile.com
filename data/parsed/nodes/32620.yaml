      <p>man, thanks so much guys, i really appreciate it.</p>
      <p>Well, i do not come from a rich family, and normally i would not be able to be anywhere close to affording Art Center, but last year i found out that my grandma had been putting aside money for my college every year since i was born, and i have about $70,000 for school. I feel so lucky to have this money because there is no way i would be able to get close to ever affording such an expensive school without this money.</p>
      <p>I am applying for the Spring of 08, and since i have this money, i guess i will not be able to get any scholarship, but i am going to apply for some scholarships anyway.</p>
      <p>Art Center seems like a really competitive place, and i really want to get as much out of school as i can. I was accepted to the University of Texas last year, which i turned down to go to a community college here in austin, just to get some of the basic courses out of the way so once i get to Art Center i can totally focus on design.</p>
      <p>I have always wanted to live in California (since i skateboard) and my best friend moved out there last year, so hopefully, if i get accepted, i will be moving out there next year to go to school.</p>
      <p>Thanks again everyone, if anyone has anything else to add, i would really appreciate it.</p>
      <p>-Josh</p>
