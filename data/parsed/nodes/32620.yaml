      <p>hey Josh,</p>
      <p>Art Center is a great school - very intense and demanding - if you are willing to put a lot into it, you will get a lot out of it.</p>
      <p>Salary of course depends on a lot of things - it will vary significantly with location/geography for example. However, a starting graphic designer’s salary is typically not going to look very attractive next to the total cost of an Art Center education.</p>
      <p>However, Art Center attracts the kind of people who go on to become art/creative directors, own their own firms, etc. - you have the potential to do very well.</p>
      <p>You should definitely look into financial aid and see what that offers you as well.</p>
      <p>best of luck,<br>
      jarrod</p>
