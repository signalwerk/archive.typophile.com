      <p>Josh<br>
      Since you have some money set aside courtesy of your grandmother, great. You are young, you have drive, and you have a good idea of what you want to do. Be careful, check out aid requirements as William suggests, but most of all you will have to be frugal otherwise by the end of your college career you might be in debt up to your eyeballs. No joke. Burn your credit cards, don’t borrow any money. Period. For more on what happens to students after school see Anya Kamenetz’s book Generation Debt. If that doesn’t open your eyes nothing will. Her book is <a href="http://www.anyakamenetz.blogspot.com">here</a> I’m a lot older than you are but have young children so this book really had an impact on my thinking about the future in college for them. Good luck. Jordan</p>
