      <p>I don’t have any experience with art schools in particularly, but here are my thoughts as one who spent a lot of time at Universities, as a student and teacher, and also sent my three kids to college. </p>
      <p>I assume you talked to students and attended classes when you visited. This is essential to seeing whether you are a good match—and doing the same for 4-5 other places. If the students who love it are like you, great. If those who hate it are like you, not so good. </p>
      <p>I am a great believer in the importance of the distinctive cultural chemistry or atmosphere of an institution. And you only get it by physically being there and talking to students and teachers. It is very important because that’s what you live with. The other thing, which is a totally different issue, is what kind of jobs the graduates go into. Does the Art Center actually have a cachet that gives you an advantage in the market place; and do they help graduates make the transition? Find out. The atmosphere and the job edge will help you judge about whether it’s worth the money. </p>
      <p>There is also the question of great, inspiring teachers. Ask the students whether they have any of these. Even in the best institutions they are rare, and they also certainly exist at places that have less cachet. If you hear of some great teachers from the students, that is a very good sign.</p>
    html_clean: |-
