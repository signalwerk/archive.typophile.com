      <p>A couple of years after graduation I had a job tracking carnivores -  bobcat, mountain lion, wolverine, fisher, etc. - with the wildlife department of the US Forest Service. It is worth noting that you can tell the difference between a wild animal and a domestic animal in the register of their prints. When a bobcat lifts its front left foot, for example, the rear left foot comes in and prints precisely in the same spot, no matter what speed the animal is moving. When you look at the print in snow there are sharp, crisp ridges between each of the pads; it looks like a single print, but is actually two. </p>
      <p>Domestic animals, by contrast, have a much more slovenly gait and leave tracks that are all over the place. It is as though they have become imprecise on a biomechanical level. The rear foot will frequently miss the print of the front foot entirely.</p>
