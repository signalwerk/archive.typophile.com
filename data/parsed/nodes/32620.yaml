      <p>Art Center is a highly respected school in the design community although I’d say there are several across the country that are just as good. One thing to consider is the immediate recognition that you will get from having Art Center on your resume and how that, combined with Art Center’s network of alumni, might translate into future earnings.</p>
      <p>The bottom line is you can get a good (maybe not great) education from numerous schools, what will really determine your worth is your individual talent and determination.</p>
