    html: <p>Art center is a very respectable school, but if money is a problem take a look at the Academy of Art University in San Francisco. It’s a commercial school and doesn’t get the respect art center does in academia, but the students really do learn a lot, and churn out some great work. IIRC tuition at AUSF is around $8000-$9000 a semester, so it  will do wonders for your future debt load. It’s a great place to go for motion graphics, because they’ve brought in Pixar and ILM to help develop curriculum and teach so that you’ll come out of school with a good portfolio and ready to work.</p>
