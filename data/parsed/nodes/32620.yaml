    <p>First off, i wanted to just say how awesome this site it, i have been roaming around on it for a whole, but have not really posted much before.</p>
    <p>Anyway, I was just curious to see what everyone on here thinks about <a href="/wiki/Art%252BCenter%252BCollege%252Bof%252BDesign" class="wiki">Art Center</a> in Pasadena? My name is Josh, i am 18 and live in Austin, TX, and have decided over the past year or so that i want to become a graphic designer/motion graphic designer. I have gone out to LA and checked out Art Center, and it seems like a really great place, but does it really seem worth it for the cost? I think it is about 15,000 dollars a semester now, and it goes up a little bit every year, so with supplies, tuition, etc, its looking to be around 120,000 - 150,000 dollars, which is pretty freaking expensive.</p>
    <p>I am not really sure what the salary range for graphic designers is, but in your opinion, does a school like Art Center really seem worth it?</p>
    <p>Thanks in advance for any replies, this seems like it is such an awesome forum and resource for designers, i will definitely be hanging around this site a lot more now.</p>
    <p>While i am at it, here are 2 recent pieces i have done. I tore a ligament in my ankle last week skateboarding, so i am basically stuck inside my house. Might as well work on my portfolio eh? One is a poster for a skateboard video, the other is a spec logo for a design firm called “joy”.</p>
