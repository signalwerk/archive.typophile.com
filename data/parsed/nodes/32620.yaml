      <p>I teach in ArtCenter’s night program*, which means I don’t have direct insight into the degree program, but I do get exposed to it a lot. It’s very expensive. But: if you’re a good student you get hooked into the relevant industry like you wouldn’t believe; and they do give out scholarships. At a previous workplace two of the employees that I “directed” were from ArtCenter, and had had scholarships: both had natural talent, although they were really different people otherwise. Which makes me thing the scholarship process is pretty open-minded. BTW here’s a recent addition to their website which shows sort of trendy but nonetheless telling videos about some (admittedly hand-picked) students:<br>
      <a href="http://www.artcenter.edu/insite/" title="http://www.artcenter.edu/insite/">http://www.artcenter.edu/insite/</a> _<br>
      I actually got in touch with two of those students; one of them is currently in Singapore on some exchange program. In my book it’s a huge plus to be given such opportunities.</p>
      <p>* <a href="http://typophile.com/node/30444" title="http://typophile.com/node/30444">http://typophile.com/node/30444</a></p>
      <p>One other thing, which will seem flippant until you actually live here and then you wonder how people can live any which place: the weather. It’s not a joke.</p>
      <p>hhp</p>
