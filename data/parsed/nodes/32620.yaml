      <p>I graduated Art Center 7 years ago, and havent regretted the money spent for a second. It is a demanding education, and not all students make the best out of it, but the ones who do have a great career potential. Most of the guys I know got out and made 50-60K right off the bat, now they are around 100K + (this is all graphic designers). </p>
      <p>BUT, there are some that never had the drive and never went anywhere. I would also look into CalArts in Valencia if I was you. Difference between the two seems to be that ArtCenter is prepping you more for a professional career, and CalArts more creative push. I know great designers from both. If you think you can manage financially, and really want it, go ahead and do it.</p>
