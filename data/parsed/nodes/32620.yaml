      <p>I teach Typography and Design in a Community College in the LA area, so I have some exposure to Art Center. Their program is very intense and can be completed in three years if one has the strength and $ to go continuously. Most of their “freshpersons” have several years of college already. I think that only a small percentage come directly from high school. </p>
      <p>Many local students go to Pasadena City College first to tighten up their admissions portfolio. The other posters are correct that there are some excellent programs at the local Cal State Universities including San Diego. CSU Long Beach has a national reputation in this area although it is “enrollment impacted” which means that it may be difficult to get classes. Admission into their upper division program is very competitive and available only to students who have been there for several semesters. </p>
      <p>As a teacher, I tell my students that the greatest determinating factor in their education is their own contribution and effort, but that being said, a competitive place like Art Center can bring out the best in a talented and dedicated student. </p>
      <p>Good luck with your education!</p>
