      <p>i guess when i said those things, i was just trying to not make a super long post that would take too long for people to read through.</p>
      <p>I interned for a year at a film production company, which i occasionally freelance for to do some simple motion graphic work for. I am currently interning at a motion graphics studio called Shiny Object here in Austin. I would like to do motion graphic design as well as graphic design, but i think my final goal is to be a motion graphic designer. I feel like it is more important to get a solid foundation in design, and then branch out into other forms of graphic design, in my case, motion graphic design.</p>
      <p>I really enjoy doing both motion and print design, so i could see my self doing either, or even both.</p>
      <p>the reason i said “I am not really sure what the salary range for graphic designers is” is because i have heard many different opinions on how much a designer out of college makes, and just wanted to ask some people on this forum that are actually working graphic design jobs what they make, or what a “good” designer should expect to make out of school.</p>
