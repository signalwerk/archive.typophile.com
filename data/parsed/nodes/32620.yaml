      <p>I currently work and have worked with several Art Center grads. All of them have been in the work place for some time now. At today’s prices, every one of them has lamented about the cost and how Art Center is not ’worth it’. Any school you go to will only be ’worth’ the amount of time/energy you put in; garbage in = garbage out. Establish residency in California and you’ll find equally challenging programs at CS-Long Beach, CS-Fullerton, etc. etc., but for A LOT less money.</p>
