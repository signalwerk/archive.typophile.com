      <p>&gt;or what a “good” designer should expect to make out of school.</p>
      <p>Talent is obviously important but I think the salary ranges have more to do with the personality of the designer. One person may put up with lousy wages and annoying boss and co-workers. Another may put up with lower-end wages because the work is interesting. A third might screw every penny they can out of their employer, run a freelance operation on their employer’s dime, and outsource the grunt work to their student ‘intern’. Maybe you need to be closer to the third person if you ever hope to get out of debt?</p>
