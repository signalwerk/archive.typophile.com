    html: |-
      <p>Please don't put abstract circle-headed raised-arm people in this. In fact, keep people out of it altogether. I really don't see a need for a complete re-design either. To me, the seal just needs updating. I like the background guilloche pattern that's currently in the seal, so I'd look for a way to keep that feel to it. </p>
      <p>My starting point would probably be to pull the text down and arrange it on multiple lines, horizontally centered under the mark, which I'd keep as a circular medallion floating above the text. From there, I'd play around with each of the elements to see if other orientations might work.</p>
