    date: 2010-01-26T10:00:00
    date_raw: 26 Jan 2010 — 10:00am
    votes: null
    html: <p>So what is unique about South Windsor that you could include? Try some typefaces to capture the feeling of the town. Start sketching things that remind you of the city and of commerce. Brainstorming on paper really helps me. Or maybe ask your client what they had in mind, what logos they've seen that are appealing to them. Study other chamber of commerce logos so you can decide if you want to be the same or different.</p>
