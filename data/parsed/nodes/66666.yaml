  - id: 393026
    user: 53987
    date: 2010-02-01T19:11:00
    date_raw: 1 Feb 2010 — 7:11pm
    votes: null
    html: <p>The community plays a huge part in the chamber and its people that keep it running whether it be business people or people that work at the chamber. The seal also has to be done away with, according to the head of the chamber its dated and involves too much history of the town, history that has to deal with slaves and farming which is far from what south windsor is like today. The seal looks like its from the 1800s (Which it probably is) and even with a revamp the same message will still be delivered. plus it get pretty illegible when shrunk down, especially with the cross hatching background. They want something clean, sophisticated and memorable and obviously something that can be resized, faxed and copied easily and still retain clarity. Small detailed drawings might not be the way to go. I do however like the seal but after speaking to them about it they don't want to revamp it, they want to get rid of it.</p>
