      <p>- Why put people in? Are people unique to South Windsor, CT? How would putting people in the seal say anything about the town? (I'm guessing it's assumed that people live there)</p>
      <p>- People are hard to render well in simple forms such as in logos and seals. Especially in seals, where the tone is rather serious, trying to render people in simple shapes—circles, lines, arcs—comes off as silly and childish.</p>
