    date: 2004-11-04T07:07:00
    date_raw: 4 Nov 2004 — 7:07am
    votes: null
    html: <p>&gt;Quark for the PC  <br> <br>I don't believe that the 'fi' and 'fl' ligatures are standard characters in a PC Type 1 font encoding -- though they are standard in the Mac encoding. I suppose Quark feels that it's not worth supporting automatic ligature substitution on PC platforms, despite the proliferation of OpenType faces that do contain those ligatures -- and many more. <br> <br>That's only a guess as I haven't used XPress in donkey's years. InDesign is my Excedrin -- no more headaches.</p>
