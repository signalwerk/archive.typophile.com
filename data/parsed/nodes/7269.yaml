  html: <p>I need an advice. <br>Is there a way to make quark use st ligatures automatically? And also if the ligatures are found in an alternate font is there a way to use them automatically in quark, i.e. all instances of st in the text set in typeface X to be replaced by st ligatures from typeface X alternate? What I have is a document with lots of text and I want to replace all instances of st with a ligature of st from the alternate typeface from the same family. <br>I am using quark 6.1 <br> <br>In case I can not do this in quark is there a way to do the above things in InDesign CS?  <br> <br>Thanks for the help.</p>
  html_clean: <p>I need an advice. <br>Is there a way to make quark use st ligatures automatically? And also if the ligatures are found in an alternate font is there a way to use them automatically in quark, i.e. all instances of st in the text set in typeface X to be replaced by st ligatures from typeface X alternate? What I have is a document with lots of text and I want to replace all instances of st with a ligature of st from the alternate typeface from the same family. <br>I am using quark 6.1 <br> <br>In case I can not do this in quark is there a way to do the above things in InDesign CS?  <br> <br>Thanks for the help.</p>
