    html: <p>When you say "Phototype," which technology are you referring to? The Phototypositor &amp; clones? The photocomposition machines from Linotype (like the VIP) &amp; the other manufacturers? I used a photocomposition machine that employed a rotating disk negative system with a lens system, and there was no way to "mechanically slant" characters. You wanted italic, you bought the italic font -- though usually, it came on the same disk as the roman &amp; you bought it perforce.</p>
