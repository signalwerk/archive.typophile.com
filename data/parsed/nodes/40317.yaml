    html: <p>It was done with special lenses. From the point of view of a lot of typesetters (the people, not the machines), the ability to slant the characters was considered an innovation, a time-saver. It was something you couldn't do with metal type. Same with condensing and extending. To a lot of people, though, especially type lovers, it was a cheap trick and something to avoid. This is still true of digital type, even more so because so many people who set type now (just about anyone with a computer) don't know the difference.</p>
