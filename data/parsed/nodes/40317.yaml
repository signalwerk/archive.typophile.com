  html: <p>When perusing old phototype catalogs, I was surprised to notice how many typefaces had no true italics, just mechanically slanted versions, sometimes this is even the case for serif faces. Was this done because the foundries assumed people would just mechanically slant faces and did not offer italics/obliques, or because the typesetters were keeping profits up by not buying the italic/oblique fonts?</p>
