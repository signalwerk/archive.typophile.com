      <p>I suppose this may not be the case over where you are, but here in the States, ITC Slimbach has started to appear everywhere in a lot of what I would call mid-level and novice design work. It seems to have been on the rise during the past year or so. I don't know why (since it was released back in 1987). To my eye, it's a lot more overexposed than Cambria.</p>
      <p>-- K.</p>
