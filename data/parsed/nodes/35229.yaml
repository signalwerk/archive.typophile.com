      <p>I didn't mean to depreciate the work of Jelle Bosma, in fact I am completely in love with Cambria. That said, since Cambria has become the default serif typeface for Microsoft Office, I am afraid it will become banal to the eyes of people who aren't as savvy about typography. </p>
      <p>I was hoping to use a font for my personal documents (résumé and such) that can act as a signature in itself, while remaining very readable and professional. </p>
      <p>I'm leaning towards ITC Slimbach at the moment.</p>
