      <p>Thanks for clearing that up - I think your original comment got lost in translation somewhat. :-) You're right that we'll be seeing a lot more of Cambria in the future, but as it's not the default text face (currently) in Office, then it won't be as over-used as say Calibri in the short-term. You might be able to stretch 12 to 18 months before feeling you need to change. </p>
      <p>Cheers, Si</p>
