    <p>My font set for Adobe Caslon Pro includes: Reg, SemiBold, Bold + their italics.<br>
    I'm working on a mac OS10.2 with CS5.<br>
    The bold font has true small caps and the relative heights can be edited in 'preferences'.<br>
    However the regular and semibold weights only seem to have 'all small caps', but not 'small caps' – When using the 'small caps' function the result is a large 'first cap' letter which is uneditible as a relative size to the rest of the 'small cap' letters in the word.<br>
    I have read several web forums and Adobe info, but nothing is particularly clear to me.<br>
    If this is just the way of things with this font, so be it.<br>
    The only practical workaround seems to be in using an alternative compatable Caslon that has small caps.<br>
    Is this the best way to go? Any advice?</p>
