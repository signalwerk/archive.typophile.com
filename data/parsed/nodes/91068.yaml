      <p>Of the 6 fonts in Adobe Caslon Pro only the regular and semi-bold have true small caps. Neither the bold nor any of the italics have true small caps. You can verify this by <a class="freelinking external" href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1712" rel="nofollow">clicking on the individual fonts here.</a> Also I checked by opening the fonts in Font Lab. </p>
      <p>So I think what is happening is that you are getting fake small caps for the Bold, as you would for any of the italics, small caps that are constructed by InDesign by formula from the caps. And what you are controlling for is the size of fake small caps. InDesign defaults to the real small caps when they are present in the font. Real small caps are not adjustable—but they will look better than fake small caps. </p>
      <p>When you click on 'small caps' in Indesign you are only *supposed* to change lower case into small caps. To get all small caps open the character dialogue box, hit the top right corner, then choose "open type", then choose "all small caps". That will turn both caps and lower case into small caps. Then you will get real all small caps in Adobe Caslon Regular and Semi-Bold, but not the four other styles. </p>
      <p>If you want true small caps for a Caslon italic, check out <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">this version of Caslon</a>. I think both the roman and italic are better in text than Adobe Caslon, but I'm a biased source.</p>
