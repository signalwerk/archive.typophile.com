      <p>The “Small Caps” command only effects lower case letters.</p>
      <p>There are a few fonts* with two or more sets of small caps ( usually Regular and Petite), which would give you the degree of busyness you’re after, i.e. no commonality with the default Upper and Lower Case setting.</p>
      <p>*e.g. the profuse <a href="https://www.fontfont.com/fonts/atma-serif" rel="nofollow">FF Atma</a>.</p>
