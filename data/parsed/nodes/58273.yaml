    html: |-
      <p>In Word 2011 for the Mac, the Advanced tab of the Font dialog box has three sections: </p>
      <ul>
      <li>Character Spacing</li>
      <li>Advanced typography</li>
      <li>Preview</li>
      </ul>
      <p>The Advanced typography section has four drop-down lists and two check boxes. The drop-down lists (and choices) are:</p>
      <ul>
      <li>Ligitures (None, Standard Only, Standard and Contextual, Standard and Discretionary, Historical and Discretionary, All)</li>
      <li>Number spaciing (Default, Proportional, Tabular)</li>
      <li>Number forms (Default, Lining, Old-style)</li>
      <li>Stylistic sets (Default, 1 through 20)</li>
      </ul>
      <p>The check boxes are:</p>
      <ul>
      <li>Use contextual alternates</li>
      <li>Enable TrueType typography features</li>
      </ul>
