    html: "<p>When did I ever say anything about my own reading practices? The only -highly informal- thing I've tried on myself is the RSVP stuff, where I noticed that 400 wpm simply feels slow - and I think most decent readers would agree. And when did I say that only some people can attain deep immersion? I think any physiologically normal adult can do it, and <i>does</i> do it. I certainly don't consider it \"very advanced\". What I do think is that: <br>1) The more practice you have the deeper you can go (if the typography allows it). <br>2) Faulty empirical testing has so far uncovered only a hint of it (eg the short &amp; frequent skipped words). <br> <br>My stance is only \"solitary\" in its elaboration - I believe many people who think about this deeply enough essentially agree with me. In fact I see the anecdotal stances (like that of Southall) as being validation of the bouma model. My stance is not a result of halucinations, but some pretty straightforward things like empirical testing (more the older foundational stuff like retina acuity, not the flawed contemporary high-level tests), logical thought (like why would the brain not use parafoveal information?) and anecdotal evidence (like serifs help readability). <br> <br>I don't believe the letterwise model simply because it doesn't make sense, on many levels. <br> <br>&gt; do you think you read equally fast and well in both English and Armenian? <br> <br>Since I read English much more, I'm sure I read it faster. <br> <br>But in terms of the inherent readability of the two scripts, Armenian is better (because the information is spread vertically more richly). English however is more harmonious in its shapes and enjoys greater legibility. <br> <br>hhp <br></p>"
