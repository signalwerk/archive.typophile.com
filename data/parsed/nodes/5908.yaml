    html: <p>&gt; you were talking about 'highly proficient readers' <br> <br>Only in terms of testing. Because it is they who will most clearly indicate the presence of boumas. Boumas don't kick in beyond a certain magical number (certainly not something as high as 700 wpm), they're simply relied upon to increasing degrees, and at low speeds the ripples on the surface as easily dismissed. But as Kevin noted, even slow reading efforts can exhibit skipped words. So "deep immersion" is not an accurate, "scientific" term, and there's no qualitative difference between the different degrees of immersion - I guess it's just a matter of how obvious the presence of boumas becomes. So you could say that "deep immersion" is where nobody could really deny that boumas are present, which is why it's a good thing to test with. <br> <br>So the purpose of testing with "highly proficient readers" isn't to gauge of how most people read (which seems to be the main intent of most field research, unfortunately), it's to figure out what can be done to make more people read more immersively. <br> <br>&gt; Either every empirical test of reading speed and comprehension is deeply flawed <br> <br>I think some of them (like Patterson &amp; Tinker's) have been decent. The biggest problem I have is with the recent ones that use inferior stimuli (like Arial onscreen) and hopeless "shallow-immersive" subjects; just because they use the processing power of computers they think they're hot stuff - but their whole foundation is off. There's a tendency to over-value newer research; I think the most recent stuff has been thrown off by the charms of raw processing power. Huey didn't need computers to come up with those amazing insights of his in 1908. <br> <br>Designers who care (not the ones who don't [want to] give a hoot about readability in the first place) are justifiably turned off by empirical testing of readability. Why, because they're unreasonable? No, I think it's because the tests have been moot (like the Times vs Helvetica stuff), and most researchers don't pay attention to the complaints of the practitioners. But I have to say that I have a good feeling about Kevin - let's see what happens. <br> <br>&gt; 'Deeper' is a metaphoric adjective. <br> <br>Not in this case - I just meant deeper into the parafovea. <br> <br>hhp <br></p>
