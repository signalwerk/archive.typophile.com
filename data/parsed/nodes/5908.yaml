    html: <p>My wife reads a chapter from a novel every night in bed before falling asleep.  She has done this all her life.  I don't think she is in a hurry to finish her chapter.  She finds the act of reading relaxing and uses it as a way to segway into sleep.  That is not to say that she is the model for the majority.  I am just making a case for a broader spectrum of reading comfort than just imersive and non-imersive.  If I am reading a text book or a software manual, I skim and skip until I find the little kernal I am interested in and then slow down and read intently. <br>I take much longer to read James Joyce than I do Hemingway--not because it is just more difficult reading but because there is a heck of a lot more content in a Joyce sentence.  I think what designers and typographers need to study as well as just readability is motivation and a much larger set of reading categories to match them. <br> <br>ChrisL</p>
