    html: "<p>By some cosmic coincidence, the day that Kevin mentioned Ole Lund in this thread, I got a package from Ole containing a copy of his PhD dissertation at Reading (almost 300 pages - very oldschool) and photocopies of other articles and reviews he's written. <br> <br>Although I have only an imprecise view of Ole's position in matters of readability, and I haven't read all the material yet, skimming through it does reveal some choice snippets: <br> <br>\"If we take the results of legibility research at face value ... then we are bound to conclude that a great deal of useful work has been done, and what we need is more of the same. If, on the other hand, we take a more critical look at the details of experimental design then maybe ... much of the effort put into empirical testing has simply been wasted.\" <br>- Macdonald-Ross <br> <br>\"The two Baskerville typefaces are, as is clearly shown in the book, two different typeface designs. It is thus difficult to say whether differences in reading speed are caused by the different x-heights or by other design differences.\" <br>- Ole Lund <br>{Times versus Helvetica? Puhleez.) <br> <br>\"I managed to track down 72 relevant experimental typeface legibility studies, and I then performed a detailed and critical review of 28 of these 72 studies - all published between 1896 and 1997 and based on a wide variety of rationales and operational methods. <br> .... nearly all of the 28 reviewed studies lacked internal validity.\" <br>- Ole Lund <br> <br>\" .... dubious and even seriously flawed legibility studies are frequently and indiscriminately cited in the fields of typography and information design.\" <br>- Ole Lund <br> <br>\"The irony is: whereas this unpretentious non-scholarly magazine* admirably treats Wheildon with tongue in cheek, two books on information design reveal difficulties in discrimating between seriousness and blatant outrageousness.\" <br>- Ole Lund <br>* x-height. <br> <br>{On the supposed advances in legibility research thanks to computers:} <br>\"The mistake [of cognitive science] is to suppose that in the sense in which computers are used to process information, brains also process information.\" <br>- John Searle <br> <br>\".... the translation of \"findings\" from experimental research to the practice of typographic design has to be done with great caution. And ... that translation is even less assured when experimental validity cannot be taken from granted in the first place.\" <br>- Ole Lund <br> <br>\"Such tests of lettering as these are therefore useful in disposing of pseudo-scientific arguments, but in cases where the results strongly favour a particular design they must, to be of any practical use to designers, be elaborated upon so that we can clearly understand why one design functions more effectively than another.\" <br>- Herbert Spencer <br>{Ergo: Ranking individual fonts as an end and not a means is moot.} <br> <br>-- <br> <br>Kevin, some type people are critical of empirical research -or simply don't want to know- out of what I consider to be anti-craft ideology. Ignore them. But some type people (like Ole, I think) are both interested and reasonable, they're just unhappy at the totally flawed foundation that continues to make virtually all empirical research in effect invalid, or at best misleading. I think you're in a unique position, because you have the empirical training and power of logic, you're mixing it up with us, and career-wise you're very well-placed. If you can bear to put up with the occasional confrontational person like me, I think you can be the first to draw the respect and attention of those among us who are genuinely concerned, but have some built-up scepticism. <br> <br>hhp</p>"
