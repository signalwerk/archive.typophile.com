    html: "<p>Too much talk. It's my problem as well, and I'm trying to limit it. <br> <br>Why don't we try, as Chris thought, and then I suggested, to start from a few typefaces we find both very usable/pleasing and not good/culturally exalted for text, (but not among the Garaldes which the average reader knows as the average)? <br> <br>From a few typefaces we can try to look for actually printed examples, produce ones of our own, and show examples to people, pals, and relatives around us (like I always do) to test how they are \"read\", \"felt\", and then felt appropriate for what. <br> <br>My personal suggestions (to select a batch, but maybe a new thread is in order since this is becoming huge) are still Futura and DIN. The most interesting thing would be to find as much examples as we can of faces used in books (both novels and essays) which do not fall in the usual cathegories (no Garaldes, no Transitionals, maybe some Slab Serifs...) <br> <br>Back to Juan Pablo &amp; Hrant: in Italy, as I previously said, the two words \"legibility\" and \"readability\" are one: \"leggibilit</p>"
