    html: "<p>Hrant, I'm not trying to isolate you. If you know other people who read in a deep immersive state at very high speeds, bring them along. My point is that you are making claims -- solitary claims, as far as I can tell -- about being able to read in what is, by any standard, a very advanced way. And you have been very critical of any reading tests on the grounds that they fail to test the performance of people like you. My suggestions was a little tongue-in-cheek, but it is not meant belligerently. I'm interested to know just how you think your performance, and that of people who read like you -- or like you claim to read: I will admit being skeptical --, could be tested. You've identified what you think is wrong with previous tests, and from these comments I've concluded that the best thing to do is have your reading speed and comprehension tested. <br> <br>One question: do you think you read equally fast and well in both English and Armenian?</p>"
