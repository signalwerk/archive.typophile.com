    html: <p>It seems to me that the obvious thing to do is for Hrant to pick a kind of text (not a specific text, because we don't want him to be familiar with it), specify exactly how it should be typeset and printed, what kind of chair he would like to sit in, what kind of lighting there should be, etc., and then Kevin should measure Hrant's 'deep immersion' saccades and reading spead, and then test his comprehension of the content. <br> <br>Of course, Hrant may still find that the test environment prevents him from getting in the groove, and we'd still be left trying to design typefaces for uber-readers who may or may not exist.</p>
