    html: <p>&gt;extenders (in the parafovea) don't convey any useful information?  <br> <br>Well, Kevin mentions that we tend to skip some specific short words like 'and', so here the word shape might have useful planning information while in the parafovial vision. I can't think of other uses for that info in parafovial vision, but there may be. I would suspect that extenders help quick letter recognition when we are looking with the fovia, with sharp vision.  <br> <br>&gt;You don't think leading makes this moot? <br>I have read guidelines which say that to make sans serif lines more readable, you should shorten the lines and give them more leading. You could also make them a larger size, and end up with equal readability. But here you end up losing a lot of space. Since we are talking about extended text, this is an important consideration. </p>
