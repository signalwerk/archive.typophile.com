    html: "<p>William, by promoting any sort of \"bonding\" between letters (including your valid point about the relationship between counters and inter-letter spaces) you're in effect supporting boumas. <br> <br>&gt; Kevin mentions that we tend to skip some specific short words like 'and', <br>&gt; so here the word shape might have useful planning information while in <br>&gt; the parafovial vision. I can't think of other uses for that info in parafovial vision <br> <br>Taylor &amp; Taylor point out that about <i>sixty</i> words are often skipped over*. In my mind these are simply the ones that have registered in legibilty studies so far (because of their extreme frequency and good distinctiveness) - they're the tip of the iceberg. I see no reason why \"and\" can be skipped over but \"read\" for example cannot. So the use of \"that info\" in parafoveal vision is obvious: to increasing reading speed/comfort! Why would there be a finite list of words that can be skipped over, while the rest can't? The brain wastes nothing, and its heuristic nature means that it <i>guesses</i>, with accuracy increasing with experience. <br> <br>* And when I see \"skipped\" I don't mean used to decide on a fixation point - I mean skipped as in not subjected to letterwise decipherment. How can this ever happen in the letterwise model? With no loss of comprehension, mind you. <br> <br>&gt; to make sans serif lines more readable, you should <br>&gt; shorten the lines and give them more leading. <br> <br>The reason I can think of for this is to increase the ratio of leading to letterspace, since sans fonts don't \"bond\" as well - but it seems tenuous. I think this might only matter when leading is extremely tight. <br> <br>&gt; You could also make them a larger size, and end up with equal readability. <br> <br>No, size doesn't always translate to higher readability - this is proven. <br> <br>-- <br> <br>Kevin, obviously I haven't read -or even seen- all of those. But I've seen many over the past 6 years, and in discussing legibility studies with many people nobody I know has ever seen one that makes sense in terms of the serif-verus-sans issue (and really most anything else). This is a classic failing that most of \"us\" know about. But if you think there's been one that would come close to being an intelligent comparison (as opposed to the Times-versus-Helvetica delusion) please let me know - I'll spread the word. <br> <br>To be fair though, part of the reason for this failing in empirical research has been the lack of proper fonts to test with. However, for the past decade or two there have been a number of superfamilies with very close serif and sans fonts - any one of those would be a decent choice. Arial at 16 PPEM is not. <br> <br>hhp <br></p>"
