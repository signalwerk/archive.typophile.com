    html: <p>Most of the history of text typefaces has been, in fact, the history of book typefaces. Prior to the 20th century, there seems to have been very little thought given to the design of text type that was not bibliocentric. This is a general and rather obvious observation, but I think it is useful to consider this as we talk about the experience of reading. In our information-rich age we are surrounded by all sorts of 'texts' that are informational rather than literary, and type design has adapted to this but largely by feeling its way out of the book and into new media. Only in the area of signage has there been much emphasis put on empirical testing of readability. <br> <br>Rather that contrasting text and display faces, we might find it more useful to try to identify different kinds of text faces, and talk about suitability to different kinds of reading experiences.</p>
    html_clean: <p>Most of the history of text typefaces has been, in fact, the history of book typefaces. Prior to the 20th century, there seems to have been very little thought given to the design of text type that was not bibliocentric. This is a general and rather obvious observation, but I think it is useful to consider this as we talk about the experience of reading. In our information-rich age we are surrounded by all sorts of 'texts' that are informational rather than literary, and type design has adapted to this but largely by feeling its way out of the book and into new media. Only in the area of signage has there been much emphasis put on empirical testing of readability. <br> <br>Rather that contrasting text and display faces, we might find it more useful to try to identify different kinds of text faces, and talk about suitability to different kinds of reading experiences.</p>
