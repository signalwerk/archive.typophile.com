    html: <p>&gt; appropriate letter space is a function not only of absolute distance, <br>&gt; but also of the ratio of the width of the counters to the letter space. <br> <br>Yes, but for a given font you can just vary the letterspacing, leaving the individual letters unchanged*, thereby basically testing the degree to which proximity is conducive to readability. It's a superb test of which theory is better. <br> <br>* Unlike making the whole setting wider, which increases both the letterforms -with their internal spaces- and the letterspacing proportionally, thus maintaining the balance you speak of. And although testing readability changes affected by width/narrowness would be interesting, it's more complex (because of the need to normalize against apparent size, apparent leading and economy) and the results less directly relevant. <br> <br>&gt; at text sizes ... the counters and letter spaces are more near the limits of vision. <br> <br>Well, I guess they're close than in display setting, but there's still so far from the resolution limits of human vision that I don't see that mattering. <br> <br>&gt; The problem is that if you space a circular sans more widely then the words can 'fall apart'. <br> <br>This is effectively bouma theory; loose spacing reduces the bonding between letters; and serifs help the bonding. <br> <br>&gt; fatigue <br> <br>As far as I know, Kevin sees a total correspondence between reading speed and reading comfort - and so do I. And as far the reader's consciousness is concerned the point is actually more often reading comfort (preventing a reader from aborting a reading effort), not how quickly a reader can finish a reading effort. <br> <br>&gt; catch misspellings <br> <br>The more immersed you are, the more you'll miss mistakes, because the "assumptive" mechanisms bypass superficial mistakes - although sometimes they also miss important distinctions - hence regressions. <br> <br>&gt; Why would an author, or poet, care about "read speed". <br> <br>First of all an author wouldn't generally care about typographic reading performance (although he might very well care to make his writing easy to grasp - or not - it depends on the intentions). But anyway there are many more people than just authors and poets, fortunately. And one group of people are typographers, who should care about reading comfort/performance, not least because the work being read isn't the most important thing in the reader's life (much to the chagrin of the author/poet...) and to a great extent the reader wants to finish what he starts, and he doesn't want to suffer because the typographer doesn't get readability. <br> <br>&gt; What about shorter movies, shorter symphonies?  <br> <br>If you use a font with low readability, yes, you better make your stuff shorter. <br> <br>&gt; Speed is not the message. <br> <br>Usually. But it's very often the fuel. Most humans want to live and they want to live intensely = quickly. They want to do something, and then do something else. And those who don't, we can't help with more readable type anyway. Speed isn't for everybody, all of the time. <br> <br>hhp <br></p>
