    html: "<p>Claudio: <br>1) There are so many intertwined variables in typography that it's difficult to test them either individually or as a group! So I think a good approach is to simply figure out what the brain likes in the overall and design from there. For example, using a single, \"reputable\" text face and seeing how much letterspacing is ideal for readability is a great looking-glass into the brain. <br>2)  You cannot get reliable results by asking for conscious opinions. This is a fact*, and I think it's due to the separation between the conscious and subconscious aspects of the brain - and the latter is where immersion lies - like Kevin said, it's a bit like breathing. <br>3) Don't let the difficiencies of certain languages in certain fields, or the necessarily non-typographic, weak-context focus of general dictionaries dictate your thoughts. <br> <br>* For example, readers consistently choose too-large fonts as being most readable. <br> <br>John, <br>It's seems like you've again reverted to your tactic of trying to isolate me. It's not about me, it's about intellectual integrity. Kevin shouldn't worry about boumas because I said he should, he should do it because the letterwise model is deficient. It doesn't explain how: <br>- serifs help, <br>- tight letterspacing helps, <br>- an x-height can be too small or too large, <br>- short and frequent words well into the parafovea are often skipped, <br>- there can be a contradiction within Kevin's own references concerning the readability of all-caps versus random-case setting (I elaborated on this to him, and I can do it again here if anybody wants). <br> <br>If Kevin, you, or anybody else doesn't believe all the anecdotal evidence (and chooses to ignore some aspects of the empirical data to boot) then it's time to stop fudging. Say \"serifs don't help readability\" and \"letterspacing needs to be much looser\" and \"rhythm between letters is bogus\", as the letterwise model <i>requires</i> you to do. Please stop focusing merely on countering whatever I happen to be supporting! It's like when you failed to note that Kevin supports loose letterspacing: it seems like you don't want to actually hear clear anti-establishment statements by anybody, you're just happy to see me countered!  :-/ <br> <br>And did you also fail to note the palpable scepticism towards the letterwise model (and even Kevin's overall empiricism) among some notable names in the audience at Thessaloniki? When the letterspacing issue came up, and Kevin asked some cascading questions to some members of the audience, like Southall, what was his last question, and what was the reply? Kevin asked \"if tests show that loose letterspacing helps readability would you change your practices?\" The reply was No. Why? Because Southall is a narrow-minded luddite? Quite the contrary - he's both an intelligent scientist and a keen typographer. He's sceptical because readability testing to this day has <i>not been good enough</i>. It doesn't matter what you think you're proving - it has to <i>make sense</i>. <br> <br>With my exposure to both of empiricism and anecdotal evidence, I think I can propose certain types of testing that can have some hope of resolving this, of satisfying the <i>practicioners</i>, which is the whole point as far as I'm concerned. You need: <br>- good readers, <br>- good typography, <br>- a good environment, <br>- to measure and analyze deep saccades and extended reading speed. <br> <br>Also, there is no Uber-reader. It's a matter of helping as many people as possible by facilitating longer saccades, that's all. I think you do this by promoting boumas, but it should be tested. However, lacking valid empirical testing does not mean Southall and others can simply stop thinking, or rely on half-baked empiricism where the subjects and stimuli simply validate the known half of reading. <br> <br>hhp <br></p>"
