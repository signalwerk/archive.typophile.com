    html: "<p>I forgot to mention the most important thing, Din, to me, is extremely readable.  Keep in mind that I am one of the misfits in typographic society who sees no difference in readability between sans serif and serif as groups.  I only see differences from one face to another.  Example: I hate reading Palatino but like reading Verdana. I like reading Garamond as text but not more than small quantities of Bodoni at 14pts or larger. I do feel Bodoni is aesthetically one of the most beautiful faces ever drawn. <br> <br>ChrisL</p>"
