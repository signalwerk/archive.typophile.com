    html: "<p>I'm not dismissing the data. I don't dismiss <i>any</i> data, since data itself cannot lie. The trick is seeing how a given piece of data fits. Interpretation of data is always subjective and based on assumptions. <br> <br>I think the data that leads to the letterwise model is indeed revealing (especially about the parallelism in the fovea), but it's also half the story. <br> <br>&gt; I believe they are your immersive readers. <br> <br>Do you have details of the subjects, and the stimuli? <br> <br>&gt; it is Not Possible to recognize letters very far outside of the fovea. <br> <br>Well, exactly! And this is why boumas matter. I believe that -aided by the semantic context of the phrase- frequently ocurring clusters of letters with distinctive envelopes <i>can</i> be recognized far from the fovea - and why would the brain pass up the opportunity to recognize them (if it's pushing performance)? Maybe the readers in that test lost comprehension simply because they need more practice and/or the typography was not conducive to deep immersion - is that crazy? Even assuming good typography, maybe they need to improve their guesswork - just like a race car driver can make increasingly better instantaneous decisions about how to pass a car the more he has experience doing it. He certainly doesn't do it through conscious analysis - he does it through the low-level instinctive \"firmware\" which has evolved in him over time. <br> <br>I don't know who the onus is on to do what -certainly I'm not getting paid by anybody- but I do believe that a researcher who is truly concerned should be open-minded, and simply try to find something that <i>might</i> exist. You can't really falsify results by doing so - at most you will find nothing. And you shouldn't be looking for boumas because I said so, but because so much anecdotal evidence (such as the importance of tight letterspacing, and serifs, and proper x-heights, etc.) goes so clearly against the letterwise model. I didn't arrive at the bouma model only through empirical analysis, or thin air, but by reconciling everything I've encountered, not least the anecdotal evidence. <br> <br>In terms of testing, maybe it seems like I've put you in a position where you can never prove you're right. But I think it's really not that hard to devise a test that would satisfy \"us\" typographers: bring together highly proficient readers (instead of desperate college freshmen), and give them really good typography (instead of Courier), and then just see what happens. <br> <br>hhp <br></p>"
