    html: <p>Hi, <br> <br>I believe the parallel letter recognition model is the best model of word recognition that we have available today. My paper on the topic is now on the Microsoft Typography website. In some aspects the model is far more detailed then I have had opportunity to talk about. In particular, there are attentional models of eye movements that explain several interesting behaviors including skipping words, super-short fixations, and refixations. In other areas the model is clearly underspecified. Letter recognition is one area that has not been studied in great detail. To say that the parallel letter recognition doesn</p>
