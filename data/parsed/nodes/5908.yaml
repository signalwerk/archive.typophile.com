    html: <p>Why is comparing Times and Helvetica a delusion? One way to compare serif and sans serif fonts is to look at exemplars of each group. Of course it would be better to look at several of the best and most frequently used serif and sans serif fonts, but this tact has the advantage of being very practical. Usually when people say that serifs are better than sans serifs they are talking about these fonts they have experienced, and they want to know if they should be using Times or Helvetica. I agree that using a metafont is appealing because it does allow for a more controlled study </p>
