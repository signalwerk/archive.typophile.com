    html: "<p>Chris said: \"I think it is truly beautiful. To me, It captures the essence of today's technology and makes me feel quite comfortable with it.\" <br> <br>Said this, I probably have a big hit in the making (who am I kidding), since while I always liked DIN, I've never find it completely satisfying, especially the numerals. But as I challenged myself in designing what may be called my re-version of it (although it's not just that), I realized how much interesting it was to work within premises totally different than my old ones. In the end, not only I like the result, but I realized what you say, seeing how DIN is used. <br>I realized that I could push the concept even further, e.g. using DIN for setting a bible. I don't know when, but I'll release the family with Thirstype. <br>If you write me your email, I'll send you a beta as I have completed the basic weight. Mine is tht (at) nettuno.it <br> <br>Besides, since you used DIN a lot, can you explain me why I always felt the condensed version \"more readable\" (in the sense Hrant says)?</p>"
