    html: <p>&gt;&gt;&gt; Reading is a gating faster.  <br> <br>&gt; This sounds important, but I don't get it - is there a typo somewhere?  <br> <br>Yes, a typo. It should be reading is a gating factor. But "faster" and "factor" have the same word shape, so please forgive my mistake. ;) <br> <br>Hrant, I don't see how you can dismiss this data. This is a group of people who believe that they can read at a rate of 700 wpm, and they were even measured as such in a lab setting. I believe they are your immersive readers. The problem is that it is Not Possible to recognize letters very far outside of the fovea. These readers guessed at what was there, and they were guessing wrong. The only way to read all the words is to look at them all. <br> <br>I believe the onerous is on you to find a set of immersive readers who can read at a super fast speed and understand what they were reading. I don't think they exist, so any study I run will be seen as faulty. <br> <br>Cheers, Kevin</p>
    html_clean: <p>&gt;&gt;&gt; Reading is a gating faster.  <br> <br>&gt; This sounds important, but I don't get it - is there a typo somewhere?  <br> <br>Yes, a typo. It should be reading is a gating factor. But "faster" and "factor" have the same word shape, so please forgive my mistake. ;) <br> <br>Hrant, I don't see how you can dismiss this data. This is a group of people who believe that they can read at a rate of 700 wpm, and they were even measured as such in a lab setting. I believe they are your immersive readers. The problem is that it is Not Possible to recognize letters very far outside of the fovea. These readers guessed at what was there, and they were guessing wrong. The only way to read all the words is to look at them all. <br> <br>I believe the onerous is on you to find a set of immersive readers who can read at a super fast speed and understand what they were reading. I don't think they exist, so any study I run will be seen as faulty. <br> <br>Cheers, Kevin</p>
