    html: <p>Claudio, <br>Din was initially done as a signage face (and perhaps for OCR?) but I quite like it as text.  To me, it works quite well when setting modern technical documents since it feels very precise and self-assured.  I know I am going to get a big batch of hate mail and ridicule for what I am about to say now but I will say it anyway.  I think it is truly beautiful. To me, It captures the essence of today's technology and makes me feel quite comfortable with it.  I also have set my resume in FF Din (waiting for the rain of bullets from other Typophilers). I often use it for tabular material, screen presentations, charts and graphs, even for my daughter's book cover. <br>Futura is a different story.  I can't use it in text at all.  The very round glyphs with the narrow verticals are too uneasy for me.  That may be purely my own aesthetic sense at work though. I do use it frequently for display--mostly just the capitals though. I also think the capitals are quite beautiful and should be in a type hall of fame if there ever is such a thing.  I don't have a certain genre of material to suggest for Futura since it lends itself to many things. <br> <br>ChrisL</p>
