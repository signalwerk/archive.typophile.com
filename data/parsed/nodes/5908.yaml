    html: <p>Claudio, <br>I would love to see your font!  I will email you as you requested. <br>Regarding the condensed--I think because the full width had a signage basis, it is more open and spaced wider than is best for text. To my eye, the open space in the counters and the loose fit can get a bit overshadowing and start to break up the wordshape.  The FF version is better suited for text and the condensed version draws a better word shape.  I feel to optimize Din for text, it would be best to draw a slightly condensed version of the FF Din full width, not as condensed as the actual condensed since this would not work as well at smaller sizes. <br> <br>Regarding the Greek--I find this a fasinating coincidense.  All of my ancesters are from Greece.  I am second generation American and spoke Greek as a child.  I can't wait to see your Greek version.  I also find the typical roman versions of Greek to be somehow un-Greek.  They look like an English or American scholar's vision of what Greek ought to be. I feel that Greek makes much more sense as a sans. By the way, your friend Panos's last name sounds similar to my cousins. His name is Haralambopoulos. Yasou Panos! <br> <br>ChrisL</p>
