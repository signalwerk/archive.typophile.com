    html: "<p>&gt; Reading is a gating faster. <br> <br>This sounds important, but I don't get it - is there a typo somewhere? <br> <br>&gt; the evidence is fairly conclusive that it is not possible to read <br>&gt; faster than 400 wpm without surrendering comprehension. <br> <br>Evidence collected through faulty stimuli and subjects? What were the exact testing conditions? The reading experience of the readers, the typography, and the testing environment? Also, explicitly asking people to perform much better than they're used to can often backfire. <br> <br>Now, I'm not saying that everybody can read in \"deep immersion\" all of the time - and some people maybe never. But what I am saying is that making fonts in a certain way will allow some people to read in deeper immersion more often. This is the category of reading that I believe has not been properly measured yet. <br> <br>But I certainly agree that \"speed reading\" is bogus. They can even go much higher than 6-700 wpm. But I also think that pushing people who normally read a given type of material at 250 wpm to suddenly more than double their speed cannot work: they simply don't have the experience, the store of boumas and the \"firmware\" to use them at speed. They don't have the practice to guess well deep into the parafovea. I believe it takes many man-months of reading immersively (and good testing conditions) for a subject's ability to saccade deeply -while preserving comprehension- to register on the lab radar. <br> <br>So how do you measure what I'm talking about? <br>Choose your subjects, and your stimuli, properly, and <i>then</i> push. <br> <br>&gt; look at the optimal letterspacing over several fonts expecting <br>&gt; to find that fonts with larger counters need larger letterspace? <br> <br>This seems like a distraction. The more useful thing to find out first is simply what the optimal letterspacing is for a good conventional text font, like maybe Adobe Minion*. When you show the results to typographers, that will immediately tell you to what extent the empirical and anecdotal worlds are misaligned. BUT the test will only be relevant if you push as deep as possible into true immersion, otherwise it will simply be a self-fulfilling prophesy, simply another illusional validation of the half-world of the letterwise model. <br> <br>* Noting that a multiple-master font (if you can still find Minion in that incarnation - it shouldn't be too hard though) can be very useful in readability testing. For example you can choose instances of different widths and weights, within the bounds of anecdotal beliefs concerning quality. <br> <br>hhp <br></p>"
