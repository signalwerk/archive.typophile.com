    html: "<p>&gt; in serifed faced words hold together better with greater interletter space between stems. <br> <br>William, you do realize that this \"holding together\" business is strictly anti-letterwise and pro-bouma, right? <br> <br>&gt;The parallel letter recognition says nothing at all about these factors. <br> <br>I don't agree. <br>When you say that letters don't need to \"meld\" you're implying a lot of things about serifs, extenders, spacing, etc. And everything you're implying counters the anecdotal evidence. <br> <br>&gt;  the research into serif and san serif fonts ... is one of the most empirically researched questions in typography <br> <br>The fact that you say this in all confidence is clear indication that you don't see what typographers are seeing. Comparing things like Times and Helvetica and concluding things about the relevance of serifs is, pardon the language, idiotic. Even John would agree with this. There have been NO tests that compare serif and sans fonts <i>properly</i>, and any serious typographer knows this. <br> <br>&gt; no one has found any conclusive evidence that serifs are better than san serifs. <br> <br>Yes, not \"conclusive\" - but that just comes back to the problem of lousy testing. <br> <br>&gt; 17 hours of classroom training combined with at least an hour of <br>&gt; individual practice six days a week for a period of seven weeks. <br> <br>I don't think this is enough. <br> <br>&gt; among the top 10% of readers in the US. <br> <br>Could you elaborate on this? <br> <br>Question: Were the students paid to participate? How much? If it's the typical low amount, don't you think this skews the results towards underperformers? <br> <br>&gt; There is no mention of the typography used other than .... <br> <br>A really bad sign, that. <br>It's basically implying that the fonts -and even the layout- don't matter. <br> <br>&gt; among the top 10% of readers in the US. <br> <br>And that brings the relevance of the results to ZERO. Sorry, Kevin. <br>There's no way to get deeply immersed onscreen, yet. And what did they use, Arial?! <br> <br>Measuring reading onscreen is useful only to the extent that it shows how far behind it is compared to print. You really need to do this in print, with proper margins, the works. Otherwise you're in a sandbox. <br> <br>&gt; Now what happens? <br> <br>You improve your testing. Until the <i>practitioners</i>, not fellow psychologists, are satisfied. <br> <br>hhp <br></p>"
