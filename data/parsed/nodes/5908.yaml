o typographers, that will immediately tell you to what extent the empirical and anecdotal worlds are misaligned. BUT the test will only be relevant if you push as deep as possible into true immersion, otherwise it will simply be a self-fulfilling prophesy, simply another illusional validation of the half-world of the letterwise model. <br> <br>* Noting that a multiple-master font (if you can still find Minion in that incarnation - it shouldn't be too hard though) can be very useful in readability testing. For example you can choose instances of different widths and weights, within the bounds of anecdotal beliefs concerning quality. <br> <br>hhp <br></p>"
