    html: <p>&gt; Why is comparing Times and Helvetica a delusion? <br> <br>Because a dozen other variables are different between them (including letterspacing), so there's no way you can know what you're actually measuring. You say "exemplar", but I don't see what that could really mean here. Comparing Times and Helvetica might help in choosing between those two fonts (assuming the testing is sound, which it's rarely even been so far), but it really says nothing about serifs. The generalization simply does not hold - how could it? If it did, then basically nothing besides serifs could matter in type design! (John, why are you so quiet on this now?...) <br> <br>People who want to know whether to choose between Times and Helvetica are not worth much thought in the realm of readability testing, because they're necessarily at a level where they could never produce optimally readable layouts to begin with. But for the niche user who is truly in interested in a useful answer to the serif-vs-sans issue, the most we can do, and what we should do already, is give them <i>guidelines</i>, not hoaky canned conclusions. <br> <br>&gt; The words that are skipped are short and close <br>&gt; enough to the fovea to have their letter</p>
