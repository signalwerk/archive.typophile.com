    html: <p>&gt;William, you do realize that this "holding together" business is strictly anti-letterwise and pro-bouma, right?  <br> <br>No, I don't think we are talking about the same thing exactly. I am referring to the bit in Kevin's paper where he talks about us identifying words ahead of where we can see clearly, in order to plan our next eye jump - unconsciously of course. Here it seems to me important to be able to identify where the words are along the line, and that influences our plan of where to put our eye. The word shape is i am guessing not that important-- though I may of course be wrong.  I think the serifs help distinguish what is the location of the coming words vs the word spaces.  <br> <br>This is a different matter, but I think serifs also help the eye identify the line of text more easily in shifting from line to line, so that serifed faces need less leading for a comfortable read. </p>
