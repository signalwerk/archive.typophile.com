    html: '<p>&gt;Rather that contrasting text and display faces, we might find it more useful to try to identify different kinds of text faces, and talk about suitability to different kinds of reading experiences.&lt; <br> <br>That is exactly what I was trying to say in my previous post:  <br>[. . . I think what designers and typographers need to study as well as just readability is motivation and a much larger set of reading categories to match them. ] <br> <br>Not until the last half of the 20th Century did we see the explosion of types and quantities of printed pieces.  We had, what I call, "The Junkmail Revolution."  Our mailboxes were filled daily with unrequested brochures attempting to sell us something.  We also had the changes in magazines.  I can still remember magazines with fairly few ads and those were not placed so prominently. Today ads make up the majority of magazine space and content is sandwiched and snaked bewilderingly through the ads in whatever "nonprime" space remains.  (You can always tell when advertisers are abandoning a magazine, it gets decidedly lighter but the amount of actual articles remains the same.)  <br>The point I was trying to make here (as well as in the new thread I started last week&lt;&lt;what&gt;&gt;) was that their are MORE than 2 dimensions to readability, not just short and long text. How do we read for recreation (novels)? How do we read for knowledge (non-fiction books)? How do we read things we are compelled to read by others (memos for work)? How do we read things we hate thinking about (tax forms)? How do we read ads vs. poetry? How do we read tabular material vs. paragraphs?  Beyond that, what  about reading as opposed to communication? Does faster reading mean more communication or are we just skipping quickly over things that bore us? What is the effect of illustration and photography on reading?  Do we </p>'
