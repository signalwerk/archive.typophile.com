    html: "<p>I've been doing some reading about reading speed the last few days. Some meta comments first. While some people may choose to read slower because they are particularly enjoying the content, this is a rare state when you are actually thinking about the process of reading while reading (analogous to thinking about breathing - you can do it, but most of the time it just happens). Studies by James Sheedy at OSU and others report positive correlations between reading speed and decreased visual fatigue. When people read similar content with either good or poor typographic quality, the good typographic quality text will be read faster and with less visual fatigue. Reading is a gating faster. We can think faster than we can read, but the mechanical process of moving our eyes and absorbing the text prevents us from reading faster. <br> <br>Which leads us to speed reading classes. There are several groups (at least in the US) that will teach students to read faster. They typically promise to double or triple your reading speed. Students who complete these seminars are usually quite satisfied. Just, Carpenter, and Mason (1982) measured the reading speed, comprehension, and eye movements of a group of successful speed readers and a group or normal readers. They found that their normal readers read Scientific American articles at a rate of 250 wpm while the speed readers read at a rate of nearly 700 wpm. The eye movements for these two groups differed greatly. While both groups read in the typical left to right, top to bottom direction, the speed readers had shorter fixations on a word and longer saccades with greater numbers of skipped words. <br> <br>While this sounds good for the speed readers, the tradeoff is that their comprehension was much poorer. On comprehension questions that has to do with the gist or the article, both groups were successful, but on questions that were more details, only the normal readers could answer them. Further analysis showed that if an eye fixation was not made on the detail asked about, the reader would not know the answer. <br> <br>In a second part of the study, the researchers asked the normal readers to skim to attempt to finish an article in the same time as the speed readers. The normal readers had not been trained in speed reading techniques, but showed remarkable similarity to the speed reading group. Their reading rate increased to 600 wpm, their fixation times decreased, the saccade length increased, and their comprehension decreased. <br> <br>While I believe there is a strong correlation between the amount of time you have spent reading in your life and your reading speed, the evidence is fairly conclusive that it is not possible to read faster than 400 wpm without surrendering comprehension. <br> <br>Different topic: I agree that the hypothesis that letter space should be proportional to counter space is an interesting one, and one that I will include in my research. I think the best way of doing this is to look at the optimal letterspacing over several fonts expecting to find that fonts with larger counters need larger letterspace? <br> <br>Cheers, Kevin</p>"
