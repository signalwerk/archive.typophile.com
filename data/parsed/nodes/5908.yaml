    html: <p>&gt;I agree that the hypothesis that letter space should be proportional to counter space is an interesting one, and one that I will include in my research. I think the best way of doing this is to look at the optimal letterspacing over several fonts expecting to find that fonts with larger counters need larger letterspace?  <br> <br>Kevin, thanks for your interest in the hypothesis. (I have been away from the internet for a few days.) If you test it, I'd appreciate a note of acknowledgement in your report, unless the idea is already out there in the literature. <br> <br>As to testing I think that one way that would be more systematic is to take the same typeface, and vary first the counters keeping the interletter space the same, and then the other way around. Is this possible to do with 'multiple master' typefaces? My hypothesis is that there is in fact some ideal, though a third variable, stroke width, might also be important.  <br> <br>You might take a face generally held up as very readable, such as adobe Garamond, keep the stroke widths the same, and do the variations, and locate the extremes where the reading speed or comfort declines.  <br> <br>If you want to then test whether this goes across faces, you would go to test a sans, such as Gill or Helvetica, and see whether the breakdowns are at similar ranges.  <br> <br>Another hypothesis I have is that in serifed faced words hold together better with greater interletter space between stems. In other words, in good serifed faces, we can do the advance planning of what words to look at next, using the current parafovea information (as you describe in your paper). The serifs, according to this guess, enable you to get wider spaces, nearer to the ideal of absolute and relative to counter spacing, than do sans.  <br> <br>Whether the guesses are right or wrong it seems to me it ought to be possible to vary the absolute  spaces and relative spaces, and really learn something about the limits of a good text face.  <br> <br>Oh, as well as relative counter/interletter space, there is also the issue of thick/thin contrast, where again I suspect there are limits on how great the contrast can be at small, text sizes, at which reading starts to deterioriate.  <br> <br>A final guess is that (sorry Hrant) the traditional most used old style serif faces - Garamond, Baskerville, Caslon - will be within the ideal range, and you can't really improve on it.  Of course the results will be much more interesting if I'm wrong in this.  <br></p>
