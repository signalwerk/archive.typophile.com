    html: <p>Reduced lighting, tired state, desire to finish a chapter. <br>Sounds like a primo typographic comfort issue to me. <br> <br>Don't get me wrong, I'm the first to say that high readability isn't always important, and there are indeed many other things to consider*. But sometimes it is pretty important, and the only negative of making fonts with high readability is the "expense" on the part of a type designer in simply grasping readability. It only takes knowledge to do a <i>better</i> (never the ultimate) job, not any other resource. <br> <br>* Clearly each of us gets his kicks considering one thing or another. There's no point harping on somebody because he's interesting in pushing readability a few percent and only under certain conditions. At least it's useful to some people sometimes. For my part I see a problem with designers overly worried about the formalisms in their text fonts for example. Who does that benefit exactly? <br> <br>hhp <br></p>
