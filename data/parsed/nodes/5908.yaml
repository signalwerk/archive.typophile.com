    html: <p>Well, I am going to comment on this unimportant matter. <br> <br>So we have these studies, we list typefaces that are speedy for the readers that do not know how to use a reference book. Or those that do not know that librarians can take care of their requirements while they are drinking fine Armenian tea which is a far more worthy pursuit. <br> <br>So what? We have studies. Governments have studies, everybody has studies. No big deal. Studies are a big yawn. <br> <br>Do we all design for these kooks? Or do we continue to design type for people that enjoy reading and learning? Those that enjoy language, those learned enough to enjoy your type design, also perhaps, allow themselves the wonders of poetry such as our Italian friend Alessandro Segalini, or myself, a fellow Italian. I know, Italians are the great lovers. <br> <br>But those that think heavy breathing over some information filled text which is out of date when written is better. Well what can I say. Women should give them wide berth. <br> <br>Or do we design for tecno nerds. The answer for me is very easy, but I can't speak for all of you. Some of you are pretty strange. <br> <br>I accept that there is a "group" very small, and rather of questionable dignity that enjoy horse racing. Others just enjoy horses. <br> <br>So let us compare this to a wine glass. Do we design a wine glass with the smallest footprint, the most efficient glass, lightest weight? <br> <br>That would be plastic cups. <br> <br>So enjoy your next glass of wine with you horse racing typography. <br> <br>I'm betting the winners are the losers.</p>
