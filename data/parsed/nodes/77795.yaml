      <p>Actually, M$Windows does do run-time linkage - that's what the DLLs (Dynamic Link Libraries) are for - much like the shared objects (.so) on Unix/Linux systems.</p>
      <p>I think that Knuth's Metafont was the only font format with canonical source code. All others seem to be or have been interpreted BLOBs. (Binary Large OBject or B* Lump Of Binary). Mind, FontForge's data files (.sfd) are text, and thus 'easy' to hack.</p>
      <p>At this moment, I think it's time to point people at The Hacker's Dictionary aka <a class="freelinking external" href="http://www.catb.org/jargon/" rel="nofollow">The Jargon File</a>.</p>
