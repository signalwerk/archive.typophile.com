      <p>quadibloc: <em>Of course DRM creates problems for law-abiding users of fonts, music, or whatever.</em></p>
      <p>There is no DRM, per se, for web fonts. Digital Rights Management involves technical mechanisms to restrict use of digital content, e.g. to a particular user, with stiff legal penalties in some jurisdictions for circumventing such mechanisms. The minor protections available to fonts on the web do not constitute DRM; indeed, the majority of browser makers made it very clear that they were not willing to consider DRM for fonts. Fonts are protected by legal licensing terms, not by technical mechanisms.</p>
