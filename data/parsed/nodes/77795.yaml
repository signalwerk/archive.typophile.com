  html: <p>For example, I am on a member participation website and I cannot use my desired fonts on my computer as they are "non-transferable' / they cannot be transferred easily and spontaneously.  Suppose if a website has my desired fonts to use via @font-face, I cannot use them 'real time' as it is one direction e.g. I want to be able to use the font as I type.  Thus there are these barriers and monopoly. Something should have been done about this years ago.  Webmail should have it also.  I should be able to upload my desired fonts and type on the member participation websites.  This feature is important to have on text editors / text fields and should be implemented immediately.  Once this feature is used then if particular websites have a policy about what fonts  users can upload, they could state it.</p>
