      <p>I don't think embedding the fonts in the text is practical or even desirable. Fonts should be linked the same way images should be linked. Otherwise you have an insurmountable barrier: rebuilding the web to allow fonts binaries to be embedded with text on all web forums and web-mail apps.</p>
      <p>Warning: I'm not involved in technical aspects of font embedding. What follows is pure fantasy.</p>
      <p>Hosted fonts (like Typekit) could allow for "anywhere" use. If you used the font on a web forum, unique code (maybe inline CSS?) could be included which links to the hosted font so it appears to all users. This code would be sent to the font host and it would correlate with the users's account. How do you prevent someone else from using the CSS to write their own messages other other web forums using the same font? A unique code would be generated for each instance. The code would be based on the words in the text itself (like a CRC check). Maybe a browser extension could take care of the details so the user wouldn't have to deal with the technical aspects. If the user is logged into their "font account", they could generate the proper code which would allow then to use the font they paid for. Other users could copy/paste the text and the fonts would still show up. If the text is modified, the CRC check fails and the font won't display. This would allow you to buy a font license, use the font in webmail, on forums etc.</p>
      <p>Of course, every site you use the fonts on would have to allow this type of code to be included. Browsers would have to be allow this type of use and users would have to upgrade their browsers. "Implemented immediately" is impossible.</p>
      <p><a href="http://en.wikipedia.org/wiki/Monopoly" rel="nofollow">Monopoly</a> doesn't apply to this situation. There's no big font company in charge of font embedding that's preventing this. Font embedding is the result of lots of individuals, organizations and companies innovating and trying to get fonts on the web. Browsers makers are slow to improve but that's not a monopoly either.</p>
