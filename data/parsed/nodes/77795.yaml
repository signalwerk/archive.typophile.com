      <p>@Té Rowan:<br>
      <cite>Actually, M$Windows does do run-time linkage - that's what the DLLs (Dynamic Link Libraries) are for - much like the shared objects (.so) on Unix/Linux systems.</cite></p>
      <p>Yes, I am aware of that. But they don't do it the way some old mainframe systems did it: reading in a directive in the .EXE file which says to replace certain addresses in the machine code it contains with the memory addresses of entry points in the external library (which would have to have been loaded into memory first).</p>
      <p>Instead, a very different mechanism is used which requires the program in the .EXE to take care of setting up the links itself during its own execution.</p>
