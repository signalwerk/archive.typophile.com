    html: <p>You have no clue what you are talking about. First, there is no reason that a font installed on your computer needs to be uploaded to a server for you to be able to use it in web applications provided by said server. Second, desktop font licenses are not multiuser server licenses. If a service vendors wants to license a font for use on a server with web applications then they are free to do so; this does not give you the right to install fonts you licensed for desktop use on servers. Third, this has absolutely nothing to do with a monopoly. You do not know what a monopoly is and need to go back and study monopolies and antitrust before you throw that word around again.</p>
