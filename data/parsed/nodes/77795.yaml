      <p>@javascript: In another thread, you have said "I expressed / proposed clean non-dirty law abiding development without any font piracy", but in that case, it's unclear what the point of your posting in this thread is.</p>
      <p>Of course DRM creates problems for law-abiding users of fonts, music, or whatever. But it's there in order to prevent piracy. So to just say that it should be done away with, to condemn it as bad, as monopolistic, without addressing the issue of piracy - even if to note that piracy from websites using fonts is not a real threat at present, because there are other wider avenues for piracy - creates the impression that one is, at the least, indifferent to piracy.</p>
      <p>When it comes to uploading fonts to "member participation websites", there's another obvious issue. Just because you would be uploading fonts which are legitimate doesn't mean that someone else, unaware of copyright, wouldn't upload a font which is copyrighted... and create liability issues for the website operator.</p>
      <p>Preventing losing money to piracy, preventing getting in trouble from being blamed for the piracy of others - these things are the top priorities. It doesn't make <em>sense</em> to complain about that; of course the world revolves around money a little bit too much, but money is the means of survival, so what else can you possibly expect?</p>
