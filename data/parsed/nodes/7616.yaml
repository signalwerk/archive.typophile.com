    votes: null
    html: <p>Or initial cap, or drop cap if it top-aligns with the rest of its line, or rubric if it's colored (I think). <br>Or birdletter if it's Armenian.  :-) <br> <br>hhp</p>
    html_clean: <p>Or initial cap, or drop cap if it top-aligns with the rest of its line, or rubric if it's colored (I think). <br>Or birdletter if it's Armenian.  :-) <br> <br>hhp</p>
