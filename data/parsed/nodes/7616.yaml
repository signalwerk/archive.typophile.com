  html: <p>I'm helping a friend with her homework.  What is the type style called that uses a larger first character text with a colorful or stylish background and the rest of the text follows more normal text styles?  An example of this is found in the &lt;a href="http://www.hrc.utexas.edu/exhibitions/permanent/gutenberg/"&gt;Gutenberg Bible&lt;/a&gt;</p>
