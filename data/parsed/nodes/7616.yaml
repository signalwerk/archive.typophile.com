    votes: null
    html: <p>Initial cap or drop cap don't convey the 'colorful or stylish background', since these may be plain. <br> <br>A rubric is properly a piece of text, traditionally coloured red (hence the name), indicating appropriate movement or gesture during liturgy, e.g. 'The priest crosses himself with the paten'. <br> <br>Love those Armenian birds.</p>
    html_clean: <p>Initial cap or drop cap don't convey the 'colorful or stylish background', since these may be plain. <br> <br>A rubric is properly a piece of text, traditionally coloured red (hence the name), indicating appropriate movement or gesture during liturgy, e.g. 'The priest crosses himself with the paten'. <br> <br>Love those Armenian birds.</p>
