  html: |-
    <p>Inspired by electro-mechanical amusements and vending machines, on August 15th, 2006, the original Font Bros website came to life featuring the one-of-a-kind Selectronic font categorization tool to help folks find the fonts they were looking for quickly and easily.</p>
    <p>We were thrilled to usher in each year a cadre of new font releases from the talented foundries, font authors and lettering artists whom we consider ourselves fortunate to represent at Font Bros. We also enjoyed the emergence of these wonderful fonts in popular culture from signs, television programs and commercials on down to being the most talked about monogram fonts on the internet.</p>
    <p>Inspired by the quality of the typefaces we represent at Font Bros, it was at Typecon in 2009 that we decided they deserved a more loving home and our customers wanted more from their experience with our site, we agreed and felt the time was right to set our sights on making this our mission.</p>
    <p>It’s taken us over two and a half years, lots of critical thinking, loads of conversations and being able to let the talented developers at ClearSFG do the things they’re best at to help us realize our vision and make it even better than we’d hoped it could be!</p>
    <p>If you're a font author and you'd like to distribute your works with us, please drop us a line at <a href="mailto:support@fontbros.com">support@fontbros.com</a> and we'd love to speak with you further about distributing your library! We offer among the best royalty rates in the industry of which you keep 65% of every sale and OEM license we arrange plus a bonus 5% on every sale you send our way even if its not one of your fonts that is sold.</p>
    <p>Take the new site for a spin, kick the tires and let us know what you think as we continue to roll out new features and updates throughout the year at: <a href="http://www.fontbros.com" title="http://www.fontbros.com">http://www.fontbros.com</a></p>
    <p>Warmly,<br>
    Mike &amp; Stuart<br>
    The Font Bros</p>
