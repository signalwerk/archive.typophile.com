    html: |-
      <p>Hello, Paul-</p>
      <p>It's "Close, but no Cigar", because in small point sizes you might confuse it with American Typewriter, but at closer look you'll see it's totally different.</p>
      <p>That was the idea behind Suomi Slab; to have those Clarendon features, so prominent on (in?) American Typewriter, but to go as far away as possible from the round, polished and slacking forms of American Typewriter.</p>
      <p>And thank you for your comment. I'm pretty proud of this one.</p>
