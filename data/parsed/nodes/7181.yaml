    date_raw: 21 Oct 2004 — 5:41pm
    votes: null
    html: <p>The best method is to use FontLab's 'Generate Glyphs' function. You can paste a list of glyph names into the Generate Glyphs dialogue panel, and these will be added to the font as blank glyphs. <br> <br>If you simply want to create empty cells into which to add new glyphs, you can create/edit the .enc file for the font, which is stored in the FontLab/Encoding folder.</p>
