    html: <p>Tina - <br> <br>Seeing as you mention 400 glyphs, I'm assuming you're adding <br>around 150 new glyphs that don't  currently exist in the file.  <br> <br>The easiest way to accomplish this is by pasting empty <br>glyph cells from another font. After activating, selecting and copying them, <br>append the glyphs to your desired font by right clicking and selecting <br>"Append". This will add the empty cells to your font. You will <br>then need to name them appropriately.</p>
