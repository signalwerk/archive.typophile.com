    html: |-
      <p>I’ve put your sample and the others from FontFont through multiple database searches, and came up empty.</p>
      <p>The late Yves Perrousseaux was the founder of Atelier Perrousseaux, a publisher of design-related (not cook) books. He likely contributed the images, but he doesn’t appear to be the publisher of the source material.</p>
      <p>The style of lettering is Carolingian:<br><a href="http://www.designhistory.org/Handwriting_pages/Carolingian.html">http://www.designhistory.org/Handwriting_pages/Carolingian.html</a></p>
      <p>What you posted is likely custom or from a very small foundry or solo type designer....</p>
