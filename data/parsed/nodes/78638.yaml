    html: <p>i don't think it's an absurd design approach. it's been done successfully before. and i probably wouldn't worry to much about how we've evolved to read. You'll read it left to right top to bottom. One big issues is that your name is not very common, well at least in the west it's not. maybe stacking is creating more confusion then it needs to.</p>
