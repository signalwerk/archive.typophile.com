    <p>Hello Everyone,</p>
    <p>My first post this year so I guess a hearty "Happy New Year" is due!<br>
    I am currently working on building a brand for myself and man is that hard.</p>
    <p>After tinkering around for quite sometime I have, for the time being, settled on this wordmark. The thing is, I do not want to associate myself with any imagery and would like to stick to letters. What I felt was that "nothing can go wrong when its my NAME!" Right?</p>
    <p>Well, anyways, so here is the wordmark and I have broken my full name into pieces. How readable is it? Honest feedback will be appreciated. Other than legibility any other issues that are blatantly blatant? I have tracked each of these pieces quite a bit. </p>
    <p>I am an information designer (work mostly with wayfinding solutions) so it is very important that all the "information" is clear. Obviously :-) Hoping to hear from you all soon!</p>
