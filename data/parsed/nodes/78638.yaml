      <p>I wasn't sure initially if it was your first and last names, or just one name, so I looked it up through your profile and saw it was both. Perhaps in India (where I see you live) this would already be obvious, but if you also intend to use the wordmark in countries where those names are less common, you might want to consider differentiating the 2 names from each other in some way (font weight or style or color). Although I'll say that one thing I like about your wordmark is its simplicity, and maybe using 2 weights or styles or colors would spoil that. </p>
      <p>One thing that bothers me a little is that on the left edge we have a strong alignment, but on the right edge because of the "A" and "Y" the alignment is visually much weaker. Hanging the A and Y further to the right might give you a better visual alignment.</p>
      <p>You also might try reversing it out of a shape, so you'd have white type reversing out of a black or gray box.</p>
