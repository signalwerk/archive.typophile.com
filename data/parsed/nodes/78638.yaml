      <p>No idea what it says. I can't make any sense of it at all, it looks like random letters stacked like an chart at the eye doctor. </p>
      <p>Maybe if it was a name I immediately recognized, it would stand out more. But even then, I find it absurd to break words into separate lines when centuries of human evolution have taught us to read each line by itself. No offense, but I can't fathom why a wayfinding designer would think this is a good idea? Clarity is your bread and butter! </p>
      <p>A good rule of thumb for a personal identity is to think about trying to sell your logo to your ideal client. If you don't think they'd buy it, it's probably not the right logo for you.</p>
