    <p>Hi!</p>
    <p>I'm trying to create a standard encoding for my fonts, but there are some glyphs that FontLab doesn't recognice, or even defines with incorrect unicode. Theese are the ones i've been having problems:</p>
    <p>Germandbls (should be U+1E9E)<br>
    Tcedilla (should be U+0162)<br>
    Tcommaaccent (should be U+021A)<br>
    tcedilla (should be U+0163)<br>
    tcommaaccent (should be U+021B)</p>
    <p>Is there any way to creating a encoding (.enc) that gives name+unicode to each glyph?</p>
