      <p>David,<br>
      my answer to your opinion was: </p>
      <p>&gt; Yes, the 'S' and 's' are relatively narrow, but for me it's not a problem.</p>
      <p>If I'm not extend more is because is very difficult to me explain it:</p>
      <p>For me, a wide 'Ss' often look deformed or with a "dynamic of curve" that does not match with the rest of characters. </p>
      <p>And the fact that there are characters that are separated a bit from the "norm" or the "proportions" make the design more original, and for me (I repeat) it's not a problem, if it works in words is an advantage, a differentiator.<br>
      I believe that internal whites work well with the rest of letters, the weight is appropriate, curves seem from the same family, etc.</p>
      <p>My job was to find ways to innovate and make an original typeface,<br>
      a conservative approach would not be appropriate in this case...</p>
      <p>It is only my approach, but many others are possible. </p>
      <p>I hope to have responded as a craftsman :)</p>
      <p>regards, em.</p>
    html_clean: |-
