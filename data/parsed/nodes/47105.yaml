      <p>I’m a bit late on this dialogue, but Sunday Times Modern is lovely. I don’t think it is very “Dutch” as Mr Porter says; I think of Quadraat when I think of Dutch serifs; Sunday Times Modern seems more energetic while also compact. The <em>S</em> connects well to earlier types bearing the Times name (with the exception of Europa).</p>
      <p><strong>Jack Yan</strong><br>
      <a class="freelinking external" href="http://jackyan.com" rel="nofollow">http://jackyan.com</a></p>
