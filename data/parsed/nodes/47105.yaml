      <p>I'm becoming concerned with the health of 'older' S's in our modern world. Either the lowercases have to get smaller where appropriate, or glyph substitution has to help here, or glyph substitution has to help in all-cap settings. "Shakespeare" in the the cited proof and the word "Search", in the current FF Pitu, of this sight, are examples of an older S, that is, in my opinion, not holding up to the lowercase, in two otherwise fabulous designs.</p>
      <p>Cheers!</p>
