      Now in my own defence:<br>
      Mark says:<br>
        Flama from the delightful Mario Feliciano in Lisbon, a good font but increasingly overused in newspapers, and again badly typeset.</p>
      <p>I like the 'delightful Mario Feliciano' part! but I can't agree with the: increasingly overused in newspapers<br>
