      <p>Mario Garcia has <a href="http://garciamedia.com/blog/articles/the_sunday_times_redesign_al_trivino_discusses_the_typography" rel="nofollow">another blog post today, this one by the redesign's designer, Al Trivino, who imparts some interesting info on the evolution of Sunday Times Modern and the section typography:</a></p>
      <p>"We started by dropshaped serifs, but we quickly changed to curved and polygonal serifs to create a stronger, beefier font, more in accordance with the type of newspaper the editors want to produce each Sunday. Also to innovate and to break the mold. When one compares it to the most often used fonts in the UK, Sunday Times looks robust and unique. We achieved that."</p>
