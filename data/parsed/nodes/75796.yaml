  html: |-
    <p>Joshua Lurie-Terrell already wrote about SkyhookMono on MyFonts Blog. So I am in the grateful position that I can let others speak about my typeface and let it shine out of itself:</p>
    <p>“[...] Skyhook Mono is quite possibly the most flexible monospaced font in years. It includes dozens of features you wouldn’t expect in a modern and ultra-simplified design: case-sensitive forms, true italics, both old style and lining numerals, fractions, titling forms, arrows, both decorative uppercase and lowercase ligatures, multiple weights (which maintain the same metrics), a full Greek alphabet, and an enormous range of accented characters. At over 600 glyphs per cut, it is perfectly suited for many of the tasks and involved projects that only the richest booktype families were capable of in the past.</p>
    <p>Try it out for yourself - currently, a free sample weight is available for download.”</p>
    <p>Some links: </p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/fontom-type/skyhook-mono/" rel="nofollow">SkyhookMono on MyFonts</a><br>
    <a class="freelinking external" href="http://blog.myfonts.com/blog/2010/10/28/skyhook-a-new-kind-of-mono.html" rel="nofollow">MyFonts Blog</a><br>
    <a class="freelinking external" href="http://www.fontomtype.de" rel="nofollow">FontomType</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/posters_typophile1_3696.jpg"></div><br>
