    <p>First off, I wanted to say that I'm a new member, but I've been reading the forums for a while; I've just been too scared to post until now. In fact, I met many of you at TypeCon in Boston (I was a volunteer); you guys are like celebrities to me.</p>
    <p>With that said, what inspired me to post was this logo for Milton Hospital. I just think that it's a brilliant design and deserved to be shared.</p>
    <p>-Scott</p><div class="imageWrap"><img src="http://typophile.com/files/Milton-Hospital-logo_5148.gif"></div><p></p>
