    html: |-
      <p>Thank you all for the replies.</p>
      <p>@ James: I disabled automatic glyph hinting and generated an OT PostScript font to no avail.</p>
      <p>@ Richard: Illustrator does create some poorly placed and voluminous amounts of nodes but it's the only way to achieve the desired brush effect. FontAudit was unable to find any problems.</p>
      <p>@ Thomas: The paths are a little awkward but nothing like this has cropped up in my past experiences with more complicated paths.</p>
      <p>I found that saving the font as OT TrueType solves the problem, irregardless of whether auto hinting was set on or off <a class="freelinking external" href="http://members.optusnet.com.au/d-esign/misc/brushy_glitch_2.png" rel="nofollow">http://members.optusnet.com.au/d-esign/misc/brushy_glitch_2.png</a>. Because my technical knowledge is a little bleak and you're the experts, what fixed the problem by changing formats?</p>
