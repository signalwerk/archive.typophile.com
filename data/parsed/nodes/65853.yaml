    html: <p>Richard. I have had similar experiences with a 3000+ glyph font. Funny things like disappearing glyphs and for example an 'à' without the hole, but a perfect 'a'. I don't know if there is a maximum OTF-fontsize, but in CS applications there seems to be a maximum fontsize when you use subroutines to compress the outlines (with FontLab). The problem described above didn't occur in Quark and also didn't happen when I made the font into an OpenType TT.</p>
