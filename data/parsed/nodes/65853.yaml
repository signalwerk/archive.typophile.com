      <p>@ Micha: When it comes to re-installing fonts I always make sure to delete the installed files, restart the system (if necessary, when some files don't delete) and install. I also tried the OTF font without subroutines on an Windows XP system that has never seen the file before and still the same issue <a class="freelinking external" href="http://members.optusnet.com.au/d-esign/misc/brushy_screenshot_2.png" rel="nofollow">http://members.optusnet.com.au/d-esign/misc/brushy_screenshot_2.png</a>.<br>
      The OTF font file without subroutines is 164KB and the OTF font file with subroutines is 152KB.</p>
      <p>@ Richard: You're hilarious.<br>
      I'll give you one glyph for $0 and you can fix it without removing detail from it. I'll keep the $100 to buy a pretty badge for my Typophile avatar.<br>
      OK jokes aside, I'm reluctant to remove nodes because I don't want to sacrifice detail and because the font as is, shows no artefacts when saved in TrueType. Because you insist, I'll pick at the glyphs and see how much needs to be changed to get it rendering properly, if there's too much detail lost I'll move on or stick with the (as Andreas put it) "quick and dirty" TrueType solution.</p>
      <p>@ Thomas: Subroutinisation isn't the problem as the lines still crop up irregardless of whether the outlines are non-compressed or compressed as shown in the screenshots. I'll be on a particular lookout for sharp angles.</p>
      <p>@ All: Thanks for the help, it's much appreciated.</p>
