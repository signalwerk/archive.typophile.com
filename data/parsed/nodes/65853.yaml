      <p>Although I suppose anything is possible, I would be very surprised if subroutinization was responsible for the rendering issues seen in the original post.</p>
      <p>I wasn't saying the *complexity* of the paths was a problem, but having an extremely acute angle in the outline can definitely create the kinds of "spikes" you are seeing in that screen shot. I remember the first time I saw what looks to me like the same problem, during development of Chameleon fonts for PostScript 3 printer ROMs....</p>
      <p>Cheers,</p>
      <p>T</p>
