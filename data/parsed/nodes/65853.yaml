    votes: null
    html: <p>It has nothing to do with hinting. It is poor node placement as caused by auto tracing. turn on the font audit too in fontlab and get rid of all of the bad and excessive nodes.</p>
    html_clean: <p>It has nothing to do with hinting. It is poor node placement as caused by auto tracing. turn on the font audit too in fontlab and get rid of all of the bad and excessive nodes.</p>
