  html: |-
    <p>I'm currently working on a font and I've found an issue which baffles me, shown here: <a class="freelinking external" href="http://members.optusnet.com.au/d-esign/misc/brushy_glitch.png" rel="nofollow">http://members.optusnet.com.au/d-esign/misc/brushy_glitch.png</a>. As you can see there are these out of place lines over the "u" and "y" glyphs, and they're not the only affected glyphs. The issue crops up in Photoshop when the font is displayed at small sizes or has anti-aliasing off. What's weird is that the lines don't actually exist on the vectors, FontLab renders them appropriately and there's nothing suspect on the offending glyphs which sets them appart from the others that render properly.</p>
    <p>Help would be much appreciated.</p>
    <p>Thanks,<br>
    Domenico.</p>
  html_clean: |-
    <p>I'm currently working on a font and I've found an issue which baffles me, shown here: <a class="freelinking external link-external" href="http://members.optusnet.com.au/d-esign/misc/brushy_glitch.png" rel="nofollow">http://members.optusnet.com.au/d-esign/misc/brushy_glitch.png</a>. As you can see there are these out of place lines over the "u" and "y" glyphs, and they're not the only affected glyphs. The issue crops up in Photoshop when the font is displayed at small sizes or has anti-aliasing off. What's weird is that the lines don't actually exist on the vectors, FontLab renders them appropriately and there's nothing suspect on the offending glyphs which sets them appart from the others that render properly.</p>
    <p>Help would be much appreciated.</p>
    <p>Thanks,<br>
    Domenico.</p>
