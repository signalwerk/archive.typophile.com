    html: |-
      <p>An earlier test was: Install a TT OT family on both Windows and MacOS machines, create a document in Freehand/Win, open it in Freehand/Mac. If there is "Regular" present in TT OTFs, Freehand/Mac cannot find the font.</p>
      <p><em>BUT:</em> Reading my descripting and older emails again, I have a suspicion that in the problematic test fonts there was a "Regular" not only in the PS Font Name but possibly also in the Full Name. Then it would have been the Full Name causing the cross-platform font identification problem! Hope I can repeat this test (much) later -- no Freehand on my current Windows machine.<br>
      If what I suspect is true, I should re-phrase: If you generate TT OTFs, "Regular" is <em>not required</em> in PS Font Name, as can be seen in MS's own TT fonts.</p>
    html_clean: |-
