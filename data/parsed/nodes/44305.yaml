    html: |-
      <p>A typo in the last line of your table:<br>
      Long Family = Reg New | Long Style = Bold Italic (not Bols Italic)</p>
      <p>In RegNew-Rg.vfb, change the Full Name to "Reg New" (without "Regular").<br>
      In case that you generate TT-OTFs, also omit the "-Rg" in the PS Font Name of this font.</p>
      <p>I'm not sure if the Fonts panel just cuts off too long names since I never use it. Just in case, you might check if you have spaces in the PS Font Names.</p>
      <p>You should also fill in Mac Name -- same as Full Name.<br>
      But there are two exceptions to "same as Full Name" with the styles whose Style Name is "Regular": In RegNew-Rg.vfb it should be "Reg New Rg", and in RegNew-Lt.vfb it should be "Reg New Lt", so that it is the same as the Font Name.</p>
      <p>Not sure if this addresses the problem.</p>
    html_clean: |-
