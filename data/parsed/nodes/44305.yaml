    html: |-
      <p>"In case that you generate TT-OTFs, also omit the “-Rg” in the PS Font Name of this font."</p>
      <p>Why?</p>
      <p>It's actually a little-known rule for the PostScript FontName that there should always be a hyphen and a "style" after that. Omitting this for the "regular" can actually cause problems in some situations (notably for Type 1 fonts with more than one font in the family, in Adobe app font menus).</p>
      <p>Regards,</p>
      <p>T</p>
    html_clean: |-
      <p>"In case that you generate TT-OTFs, also omit the “-Rg” in the PS Font Name of this font."</p>
