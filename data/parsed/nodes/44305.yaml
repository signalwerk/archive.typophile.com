    <p>Hello</p>
    <p>I have a font family with 8 weights - light, regular, medium, bold, with italics.  The fonts are all named using the system found at this link:</p>
    <p><a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=1&amp;ID_Message=2843" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=1&amp;ID_Message=2843">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a></p>
    <p>Everything works fine in Adobe applications, such as InDesign, Illustrator on the mac and PC. In these programs all the weights are under the same name and are ordered from light to bold, however, when testing the fonts in windows applications, such as Word, big problems!!! </p>
    <p>Not all the weights appear in the font menus.</p>
    <p>Is there a solution to this problem, or is it just that OpenType fonts don't work in applications like Word?</p>
    <p>What do other people use as a solution to the problem?</p>
