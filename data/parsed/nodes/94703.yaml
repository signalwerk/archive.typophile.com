    <p>I've made a calt to add swashed alternatives to beginning and end of every word. I think it's ok, but I'm planning also stylistic alternatives to these swashes and it's here where it gets complicated. I get "Duplicate target glyph for single substitution" error when compiling. This is what i have now:</p>
    <p>Classes:<br>
    All_glyphs (All glyphs, including swashes. 986 total)<br>
    Normal_Caps_Start (Starting glyphs to be replaced. 170 total)<br>
    Normal_Caps_End (Ending glyphs to be replaced. 133 total)<br>
    Swash_Caps_Start (Starting glyph swashes. 170 total)<br>
    Swash_Caps_End (Ending glyph swashes. 133 total)</p>
    <p>Code:<br>
    feature calt {<br>
    lookup start_swashes {<br>
        ignore sub @All_glyphs @Normal_Caps_Start';<br>
        sub @Normal_Caps_Start' by @Swash_Caps_Start;<br>
    } start_swashes;<br>
    lookup end_swashes {<br>
        ignore sub @All_glyphs @Normal_Caps_End';<br>
        sub @Normal_Caps_End' by @Swash_Caps_End;<br>
    } end_swashes;<br>
    } calt;</p>
    <p>I've put calt feature after salt feature.</p>
    <p>The problem must be in the way i made the classes. For example letter A has A1 and A2 alternatives. In Swash_Caps_Start this means: [A1, A2, B...], and in Normal_Caps_Start class its [A, A, B...]. This way the substitute classes have the same amount of pairs, but there are two A's in the other class. How is this done correctly?</p>
    <p>Probably there is some really simple solution for this, but now i just can't figure it out. I've searched for this, but Google doesn't anymore give the results from Typophile it has used to.</p>
