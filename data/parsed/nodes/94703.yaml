    html: |-
      <p><cite> The problem must be in the way i made the classes. For example letter A has A1 and A2 alternatives. In Swash_Caps_Start this means: [A1, A2, B...], and in Normal_Caps_Start class its [A, A, B...]. This way the substitute classes have the same amount of pairs, but there are two A's in the other class. How is this done correctly? </cite></p>
      <p>This means that in effect you have you are trying to replace {A, A, B ... } with {A1, A2, B ... }, and the software cannot determine whether A should be substituted by A1 or A2. If you have a rule of the form <code>sub @A by @B</code>, it's perfectly OK to have the same glyph listed multiple times in class B, but generally <em>not</em> in class A.</p>
      <p>What you need to do is map {A, B, ... } to {A1, B1, ...} and then substitute A1 by A2 in some lookup which occurs later in your features.</p>
      <p>Also, on an unrelated note I suspect that there is an error in your 'calt' code. I think that where you write:</p>
      <p><code> ignore sub @All_glyphs @Normal_Caps_End';</code></p>
      <p>you actually want the following (assuming you're trying to get the substitution to occur only at the end of a word, i.e. where no glyph <em> follows</em> the target glyph).</p>
      <p><code>ignore sub @Normal_Caps_End' @All_glyphs;</code></p>
      <p>André</p>
