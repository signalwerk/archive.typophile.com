    html: |-
      <p>If I understand you correctly, A1 and A2 are both swash versions intended for initial use, correct?</p>
      <p>If so, then yes, you'd perform the A-&gt;A1 substitution in 'calt', and the A1-&gt;A2 substitution in 'salt', which would be done <em>after</em> your 'calt' feature.</p>
      <p>Also, I'd recommend duplicating your 'salt' feature in 'ss01' since InDesign implements stylistic sets but not 'salt', whereas Illustrator implements 'salt' but not stylistic sets.</p>
      <p>Finally, don't name your glyphs A1, A2, etc. Use a suffix; for example A.1, A.2. Otherwise, you'll run into compatibility problems with (e.g.) Acrobat Distiller.</p>
      <p>André</p>
