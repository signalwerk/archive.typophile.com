    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Arthur Baker</strong></p>
    <p>Arthur Baker has been drawing letters for decades and has written over 20 <a href="/wiki/books" class="freelinking" rel="nofollow">books</a> on the subject. Along with his knowledge of <a href="/wiki/letter%20forms" class="freelinking" rel="nofollow">letter forms</a> and historical syles of <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a> and his own custom designed pens and brushes, his style is admired and imitated by many calligraphers and type <a href="/wiki/designers" class="freelinking" rel="nofollow">designers</a>. He currently lives in Andover, Massachusetts.</p>
    <p>Typefaces by Arthur Baker: <a href="http://www.p22.com/ihof/calligraphica.html" rel="nofollow">Calligraphica</a>, <a href="http://www.p22.com/ihof/mercator.html" rel="nofollow">Mercator</a>.</p>
