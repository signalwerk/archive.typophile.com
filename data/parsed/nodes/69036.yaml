      <p>I'm getting dizzy just looking at all those spinning flourishes!<br>
      What is that in the E, a triple Salchow?</p>
      <p>Nice. The quality of fine calligraphy is beautifully captured; it doesn't look "false" like so many script fonts, or stilted, which is the downfall of too "correct" formalism.</p>
      <p>I don't know how much of the balance it strikes is due to the distressing. Are you considering a smooth version? That would be the acid test.</p>
