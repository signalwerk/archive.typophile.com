      <p><a href="http://en.wikipedia.org/wiki/Graphic_design" title="http://en.wikipedia.org/wiki/Graphic_design">http://en.wikipedia.org/wiki/Graphic_design</a></p>
      <p>Given that “graphic design” is one of the few growing professions nowadays (or so I hear) I think more people generally know what it means than used to be the case. The next question is usually “what do you design” and then you can get into specifics. And no, Uncle Al, it doesn’t mean I draw the pictures.</p>
      <p>But we do a little bit of everything. In addition to designing (layout/print/books, in my case) I art direct photo shoots, check proofs, read copy for mistakes, typeset, lots of things that fall outside the job description but that (I hope) make me more valuable to my clients.</p>
      <p>You might also peruse AIGA.org to get a sense of the business: <a href="http://www.aiga.org/" title="http://www.aiga.org/">http://www.aiga.org/</a></p>
