      <p>I’m a graphic designer, and I certainly am a photographer. I use my photography to augment my Graphic Design. The boundaries of what constitutes a graphic designer has changed since the old days of X-acto knives and paste-up.</p>
      <p>These days, a designer IS and illustrator/photographer/etc. It’s the most encompassing and non-specific label you can put on someone who does that specific job.</p>
      <p>It’s called Visual Communication, and that’s what all of the schools are now calling it and offering degrees for.</p>
