      <p>It’s not quite the same thing, but “Art Director” has a similar perception problem. Here is what Saul Bass had to say about it:</p>
      <p>“For years, my mother wondered what I do; that is, what i <em>really</em> do. She new I did art work—and actually she was very happy about it despite some vagueness that surrounded the matter. Her only concern was that I should make a living, and I seemed to be doing all right. But finally her curiosity overcame her timidity, and, I think with some prompting from the neighbors, she finally asked me what it was that I <em>really</em> did.</p>
      <p>“I pulled out a proof of an ad that I had designed and I showed it to her and said, ‘Mom, that’s what I do.’ She looked at this and said, ‘Oh, I see . . . ’ and she pointed to a photograph in the ad and said, ‘<em>That’s</em> what you do?’ I said, ‘Oh, no, you see, there are photographers—and they are specialists—they know all about cameras and things of that kind, and they make the photographs.’</p>
      <p>“‘Oh,’ she said, disappointed, ‘Then <em>this</em> is what you do?’ I said, ‘No, that’s typography. You see there are special organizations who do nothing but set type—you know, Garamond, Caslon, etc. . . . these people do that.’ Again she was a little disappointed. She pointed to the lettering and we went through this again. Finally she looked at me somewhat concerned, and said, ‘Well, now, what do <em>you</em> do?’ I said, ‘Well, you see, I conceived the whole thing, and then I get all these people together and get them to carry out the process.’ She looked at me very coyly, and said, “Oh—you devil!’”</p>
      <p>(From “The Design of Advertising” by Roy Paul Nelson)</p>
    html_clean: |-
