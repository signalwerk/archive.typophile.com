    html: |-
      <p>Which version of Illustrator is your client using? I remember Adobe apps not invoking the kerning if there is no other feature present in the font. (I think this was true for CS2 apps, maybe even CS3.)</p>
      <p>A solution for the problem would be the creation of a ‘bogus’ liga feature, something like:<br>
      <code><br>
      liga {<br>
          sub hyphen by hyphen;<br>
      } liga;<br>
      </code></p>
      <p>(don’t forget the tab in front of the ‘sub’ – Typophile’s code formatting does not seem to get any better)</p>
      <p>HTH,<br>
      Frank</p>
    html_clean: |-
