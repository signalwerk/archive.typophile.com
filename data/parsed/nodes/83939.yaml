      <p>Hi @Docunagi</p>
      <p>Very strange but quick thoughts,<br>
      - Is the tracking set to the same setting?<br>
      - Is she using optical kerning or the like?<br>
      - Are you using an OTF font/typeface while she is using a TTF one?<br>
      - Are your illustrator versions the same or are you saving with backward compatability for the client?</p>
      <p>I've never faced such an issue. Very curious to understand whats happening. Do you use the same font manager?</p>
