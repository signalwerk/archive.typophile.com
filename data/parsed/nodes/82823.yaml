    <p>Dear Type wizzards,</p>
    <p>I have a question regarding an up to date way of setting up spacing and kerning for a whole type-family in a efficient and consistent way. I've been designing font's for more then 10 years now, originally in Fontographer and then Fontlab. I'm familiar with the basic concept and methods of spacing and kerning as well as class kerning, masters etc. but feel that my methods are outdated, very time consuming and prone to errors and inconsistencies.<br>
    I've been recently looking into Superpolator and Metrics Machine but haven't purchased anything as I've wanted to aks around a bit first what the way to go about is these days. My technical knowledge and patience is quite limited I have to admit and I've never worked with scripts and robofog. </p>
    <p>Is there any neat instructions or manuals around? Any previous threads on the subject or clever suggestions on the topic?</p>
    <p>Many thanks in advance!</p>
