      <p>Metrics Machine is a really sweet kerning tool if Fontlab's tools aren't doing what you want. The downside is that Fontlab can't get it together and release a product that supports the UFO format, so you have to use Robofab scripts to go back-and-forth between Fontlab and Metrics Machine. Tal's UFOCentral script has taken some of the pain out of that. Glyphs is a font design tool that has native support for UFO so that you can just work in UFO apps without headaches; at least one more UFO-native design tool is in development as well</p>
      <p><cite>…but feel that my methods are outdated, very time consuming and prone to errors and inconsistencies.</cite></p>
      <p>Kerning is a very complex task and as such will always be prone to errors and inconsistencies. Metrics Machine can make the process more efficient, especially if your work flow varies from project-to-project.</p>
      <p>And, of course, you can also just pay for iKern, which will semi-automatically even out spacing and kern for you. I'll leave it at that to avoid another iKern debate.</p>
