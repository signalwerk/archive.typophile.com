      <p>The trick with the u is that the serif on the righthand stem is the only letter-internal x-height serif off a straight stem. If your design has strong triangular serifs at the x-height, you’ll find that, if the basic serif model established by the lowercase i is applied to the righthand stem of the u it will dominate the interior space of the letter too much. I believe this is why the u often has more horizontal serifs than other letters: you adjust the righthand serif so that it leaves the counter nice and open, and then you have to adjust the lefthand serif to harmonise, otherwise the letter looks really weird. This graphic shows the adjustment in my SBL BibLit typeface.</p>
      <p></p><div class="imageWrap"><img src="/files/iu.gif"></div><p></p>
    html_clean: |-
