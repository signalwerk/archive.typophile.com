      <p>Another interesting note about the terminals of the lowercase u is that although the lower right terminal typically follows the more formal shape employed on the d, rather than the more cursive ’flick’ often found on the lowercase a, the latter form is much better for attaching the ogonek in a convincing way.</p>
      <p></p><div class="imageWrap"><img src="/files/uuog.gif"></div><p></p>
