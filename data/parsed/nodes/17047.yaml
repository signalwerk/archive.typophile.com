      <p>A quick glance through Rookledge shows that Venetian (sloping e-bar), Angled Stress/Oblique Serifs, Vertical Stress/Oblique Serifs and (confusingly) Vertical Stress/Straight Serifs <em>generally</em> have angled serifs, while Abrupt Contrast/Straight Serifs (Didone etc) and Slab Serif have straight serifs. Of course there are exceptions and there are some that have different angles, different sizes/types (full and half) of serif and some have a chirographic lefthand serif. My general preference is angled followed by less angled (or flat) serif.<br>
      I suppose it really depends on the type of serif and stress.<br>
      Tim</p>
