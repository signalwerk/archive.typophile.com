    html: <p>If you look carefully at the optical scaling of (real) Centaur, you’ll see that the left head-serif has a much steeper angle in the smaller sizes than in the larger. What I don’t know is whether there is some real reason for it, or whether it’s somewhat arbitrary, perhaps because they were using different drawings at different times during the typeface’s development. I haven’t studied any other optical scaling families carefully enough to know whether this is a pattern in the same way as, say, opening the counter of ’a’ and ’e’.</p>
