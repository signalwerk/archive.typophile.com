      <p>Hrant, do you have studies of the u you’re working with (assuming you’re working with something)?</p>
      <p>I haven’t yet developed a serif face so I have no method or even preference, but I imagine studies would help a lot. If you could share I am sure you’d find a lot of us willing to opine :-&gt;</p>
      <p>Would or should typical letter combinations that might appear have some bearing in this like Qu qu tu etc?</p>
      <p>I suspect that if the serifs were mere barbs a little curvuture would be useful as Nick suggests, but if they were slabby then going flat on the x-height would be the way to go.</p>
      <p>Another question that is worth exploring in making a decision is just how much reference to chirography should be present in the face. I would think that the head serif would be approached by many as the entry point to the letter in handwriting and there would be a predisposition to have the serif angled.</p>
      <p>I am curious too if others have some ideas, choices or rules of thumb.</p>
      <p>Jon</p>
