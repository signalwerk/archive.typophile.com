    <p>Hey everybody,</p>
    <p>Me again. Here's three different v's. In case you haven't noticed yet, the difference is in width. Hope you can tell me wich one looks best to you. I think the choice is between the first and second, but I put the original (third) also in the picture. When I judge things like this I usually take some steps back before I look at it. Is ther anything else (except printing and squeezing eyes) I might do for better judgement?</p>
    <p>cheers,</p>
    <p>Jasper de Waard<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/vpict_5583.jpg"></div><p></p>
