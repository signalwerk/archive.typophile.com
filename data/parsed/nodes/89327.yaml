      <p>The correct thing to do is to take the trickiest combination in your word, space, or kern it properly to a width you find acceptable, and use this 'optical white' on the rest of the combinations. So while your wide solution is a bit over the top in width, it's much better than going for the first solution. </p>
      <p>Of course this is only if you are able to give it that amount of attention, usually only the difficult pair needs a different value. Also, when letter-spacing properly (for titles or whatever) it's also easier to start of wide and make small adjustments backwards, tightening it up.</p>
      <p>About it being fashionable, I don't really know, you see extremes on both ways quite often in everything that tries to be design-ey. Light weights are the fashion lately though, probably because of the popularity of HFJ type.</p>
