    <p>Question. When kerning, the goal is to make the word have a consistent texture right?<br>
    So for the word "EFFECTIVE" set in Futura (light),<br>
    The capital 'C' has so much white space in the counter compared to the rest of the<br>
    capital letters. Would this need a lot of space between the letters, so the<br>
    C's counter doesn't look so white compared to the rest of the word?<br>
    I see people track words in this same situation very tight. Is that just a fashionable<br>
    thing to do? Or is that the correct way? Thanks for your help Typophiles.<br>
    I'm not sure why i cannot upload images. But here is an image of what I mean.</p>
    <p><a href="http://www.flickr.com/photos/etahchen/6739052239/in/photostream/lightbox/" title="http://www.flickr.com/photos/etahchen/6739052239/in/photostream/lightbox/">http://www.flickr.com/photos/etahchen/6739052239/in/photostream/lightbox/</a></p>
