    html: <p>People have said that the <a href="http://new.myfonts.com/fonts/neufville/futura-nd/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">ND version</a> is the most accurate. I don't know if the light weight is original, though. I question how wide the light C is, compared to the heavier weights. I suspect the problem is that they were also trying to harmonize with the geometric O. You can see in the heavier weights the E and C get closer to the same width and typographic color. If you just go on MyFonts and search on Futura you can compare for yourself. The Bitstream version might work for you.</p>
