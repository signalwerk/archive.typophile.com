    html: |-
      <p><em>Light weights are the fashion lately…</em></p>
      <p><a href="http://www.shinntype.com/Writing/SeeLight.pdf">Seeing the Light</a></p>
      <p>The Thin types that I listed in the article were pretty much the only fonts available in 2001 that went truly Thin (not Thesis, for instance, despite its many weights), so apart from Neue Helvetica, you can see Font Bureau’s role in developing new Thin types—especially Frere-Jones’ conception (this was before he joined Hoefler) of the “Hairline” which he applied to Interstate. Those two types were, I think, instrumental in popularizing the genre (more so than my Bodoni Egyptian, which may have been noticed by type designers, but has never been a really popular face).</p>
      <p>I note in the article that Sam Stitt used Futura small to create a Thin effect. </p>
      <p>Concerning Futura, I had seen it used in the 1970s and 80s set very tight, and even set it like that myself a few times—it had/has a quite nice effect that way in the upper and lower case, but not so much in the all-cap setting.</p>
