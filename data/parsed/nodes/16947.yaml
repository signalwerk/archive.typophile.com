      <p>You're not alone! Talking to my brother last night--who has never had to write much of anything by hand--and he said he sometimes forgets how to make certain letters. Has to consciously stop and think, then continue writing. (He also can't spell because spell check always does it for him.) I was truly surprised, but I guess it's not that uncommon. If you don't use it you lose it...</p>
      <p>K.</p>
