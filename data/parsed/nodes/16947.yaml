      <p><a href="http://www.2020site.org/writing/index.html" title="http://www.2020site.org/writing/index.html">http://www.2020site.org/writing/index.html</a></p>
      <p>This site is a nice starting point. Very nice capitals, if you ask me. </p>
      <p>I've done the same thing as you, btw. It's well worth to remember that this is very much a project that you can teach yourself without any instruction, if need be. Just sit down, rethink your letters, practice a lot and repeat.</p>
      <p>The real problems come when trying to write your new handwriting quickly, something I haven't yet managed.</p>
