    html: |-
      <p>There are many decent books on this subject and a few excellent ones too.<br>
      I like The Italic Way to Beautiful Handwriting by Fred Eager because<br>
      it has a solid italic model and a practical "cursive" mode as well.<br>
      I'm guessing it's out of print but I've seen many used for a few<br>
      dollars. Be sure to check in the Craft section of your local used<br>
      bookstore as calligraphy (or writing in this case) usually falls into<br>
      this section. Again, there are many others including the classic stuff<br>
      from Alfred Fairbank.</p>
