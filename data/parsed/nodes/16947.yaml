  date_raw: 23 Dec 2005 — 7:49am
  votes: null
  html: <p>I feel that 10 years of almost exclusively computer-based writing have reduced what is left of my handwriting to an illegible and clumsy mess and quite frankly, I have had enough of it. I think I need to learn handwriting anew, from scratch, as it were, until I like what I see when I write by hand once again and until I (and of course everyone else) can decipher it as well.  Does anyone have links to websites and books on handwriting/calligraphy etc. that might be of use in my quest?</p>
