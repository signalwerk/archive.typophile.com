  html: |-
    <p>Not to get all mushy or anything, but... I'd like to thank all those that make this 'place' as rich as it is. From the brilliant design and maintenance of Typophile - to the one time poster, it's all good. </p>
    <p>For me, I constantly push/search. I'm looking for the edge - the raw edge - the leading edge. And I think those that put together Typophile knew that it would enable leading minds a place to share - to challenge - to encourage - us/one another.</p>
    <p>And I thank you all for that...</p>
