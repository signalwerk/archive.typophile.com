      <p>Yeah typophile is great--it has enriched my life. Thanks to all!</p>
      <p>&gt;In spite of not being Christian, I really must say Amen to that! </p>
      <p>FYI: "Amen" is a Hebrew word meaning "it is true," or "so be it"--exactly as you use it--and was part of Jewish liturgy for many centuries before Christianity came around. The word for faith, "emunah" is from the same root, as is the word for truth, "emet".</p>
