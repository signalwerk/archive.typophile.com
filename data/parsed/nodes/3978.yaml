    <p>Interesting <a href="http://film.guardian.co.uk/features/featurepages/0%2C4120%2C1177734%2C00.html">article</a> in today’s Guardian about Kubrick�s archive. <br><br>
    </p><blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>�It's Futura Extra Bold,� explains Tony. �It was Stanley's favourite typeface. It's sans serif. He liked Helvetica and Univers, too. Clean and elegant.� <br> <br>�Is this the kind of thing you and Kubrick used to discuss?� I ask. <br> <br>�God, yes,� says Tony. �Sometimes late into the night. I was always trying to persuade him to turn away from them. But he was wedded to his sans serifs.� <br> <br>Tony goes to his bookshelf and brings down a number of volumes full of examples of typefaces, the kind of volumes he and Kubrick used to study, and he shows them to me. �I did once get him to admit the beauty of Bembo,� he adds, �a serif.�<!---/quote-!--></p><hr size="0"><p></p></blockquote>
