    html: |-
      <p>I’m probably the wrong person to ask, since it is well known around here that I am not a fan of ’techno’ (I think they are too similar too often, and have become a cliché for ’modern = hi-tech’). However, this one IS different, and reminds me more of Bauhaus-styles, which I think were the origin of simpler typography as a philosophical approach, not as a branding tool, and in that way were truly different and modern. The fact that we still see them so often today in that context, over 70 years later, means they apparently convinced us to see it that way too.</p>
      <p>As far as Dafont goes, I searched the Techno Sci-Fi and Techno Various categories and didn’t find this one (as Yves predicted). Has someone searched Veer for Techno styles? A lot of their foundries may already have been partially covered by the Indie Books, so the case that this might be a custom design is getting much stronger.</p>
      <p>Did you write to them to ask about the font? Sometimes you can get an answer, so it’s worth a try.</p>
      <p>- Mike Yanega</p>
