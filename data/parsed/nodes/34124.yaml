      <p>It looks a little like some Identikal fonts, like <a href="http://www.myfonts.com/fonts/t26/stak/">Stak</a>, that may have been modified. However, I think it’s more likely that it is a custom font, or even a freebie techno design. I always hunt through Dafont using a text sample that is from your ’mystery font’. I often find these styles that way, since Techno designs seem to be a favorite of amateur font designers.</p>
      <p>- Mike Yanega</p>
