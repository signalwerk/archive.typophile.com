    html: <p>Proxima Nova. Gotham is losing it’s cache quickly because it’s becoming a favorite of hacks who just slap together low-budget work with templates and popular fonts. I’m seeing a lot of it in drug store signage and store-brand products. Not something clients are going to want to be associated with.</p>
