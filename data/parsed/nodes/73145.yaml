      <p>I know I'm late to this party -- and the votes have been unanimous -- but the other positive thing I would say about Proxima Nova is that it has more sparkle and detail at display sizes. Gotham is so even that at larger sizes it looks a bit dull and monotonous. (I've seen companies adopt Gotham for their identity, and suddenly things are looking bland, bland, bland.)</p>
      <p>I think Proxima is a font for a lifetime. Like all H+FJ retail products (with the possible exception of "Fetish No. 338"), Gotham was built to stick around, too. But I suspect designers will find objections to it based on how it's being (over)used, like those James "Dunwich Type" Puckett mentions above. Perhaps Gotham is Tobias Frere-Jones's second Interstate, a great face that's used too much and poorly.</p>
      <p>James didn't make a plug for himself, so I'll do it. His family Armitage shares similar source material with Gotham (vernacular, non-typographic lettering from buildings), has a lot of nice detailing, and it's available for print and web licensing.</p>
