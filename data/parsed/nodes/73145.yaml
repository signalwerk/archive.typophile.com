    <p>I'm going to buy one of them today for use in a logo/identity project, and for the use in the logo (all caps) they look pretty similar. Aside from very slight stylistic things, the main differences I can see is that Gotham has 8 weights instead of 7, and Proxima comes with small caps.</p>
    <p>Been thinking about this for a while (I don't buy big font familiess that often) and I am having a really hard time deciding.</p>
    <p>Help!</p>
