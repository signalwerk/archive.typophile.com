      <p>Renko’s suggestions are good ones, and you might also consider some of the new OpenType fonts that have a lot of alternate characters and contextual variations. <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000104">Dear Sarah</a>, from Veer is a more contemporary-looking handwriting style, and <a href="http://bowfinprintworks.com/ScriptSmall6/SecretScryptPro.gif">Secret Scrypt Pro</a>, from Canada Type, is more antique-looking.</p>
      <p>- Mike Yanega</p>
