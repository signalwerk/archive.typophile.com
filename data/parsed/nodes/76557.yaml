    html: |-
      <p>Setting in a circle can be done in Illustrator, keeping the text live and flowing without distortion.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TextOnCircle93_3623.jpg"></div><p></p>
      <p>Kind of a pain though. Draw the baselines manually, Convert to text paths and thread them in the proper order.<br>
      You will have to play around a bit. Make some mistakes, like not having the paths in the right stacking order.<br>
      But once you set it up- you will have a great re-usable template.</p>
    html_clean: |-
