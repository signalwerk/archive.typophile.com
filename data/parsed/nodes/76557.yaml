    html: |-
      <p>Incidentally, this is possible in InDesign too. Perhaps the easiest way is to draw a circle, copy and paste it on top, and decrease its diameter by 2p (or whatever) and repeat until you have as many circles as lines of type. Then make each circle a path for type, draw some guides for column breaks, and drag the ends of the type paths to the edges of where you want your columns to be. Here's an example. Of course, you can adjust the ends of the paths to make each column a quarter of a circle or whatever. Then you'd copy the whole group of circles, paste them on top, and rotate 90 degrees for the next column.</p>
      <p>Josh</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/id1_4293.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/id2_4876.jpg"></div><p></p>
      <p>[Edited to clarify and add pictures]</p>
