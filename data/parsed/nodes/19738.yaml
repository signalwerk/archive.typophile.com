      <p>////Affair/////</p>
    <p>How to have an affair and get away with it?</p>
    <p>Affair. It’s an event and you’re invited. Affair is an extraordinary new<br>
    calligraphic typeface by Alejandro Paul with a party full of swash<br>
    characters, ligatures, and ornaments. By default, it’s simply an elegant<br>
    yet readable display face. Dress it up with alternates, and it becomes<br>
    irresistibly attractive, in styles from glamourous to over-the-top.<br>
    Hundreds of alternates, tons of swashy endings and ligatures, all<br>
    accessible through OpenType palettes in programs that support such<br>
    features.</p>
    <p>A foreign affair</p>
    <p>“Upon finishing the font I was fortunate enough that a few of my<br>
    colleagues, great type designers and probably much saner than I am, agreed<br>
    to show me how they envision my Affair in action. The beauty they showed<br>
    me makes me feel small and yearn for the world to be even smaller now –<br>
    at least small enough so that my international colleagues and I can meet<br>
    and exchange stories over a good parrilla. These people, whose kindness is<br>
    very deserving of my gratitude, and whose beautiful art is very deserving<br>
    of your appreciation, are in no particular order: Corey Holms, Mariano<br>
    Lopez Hiriart, Xavier Dupré, Alejandro Ros, Rebecca Alaccari, Laura<br>
    Meseguer, Neil Summerour, Eduardo Manso, and the Doma group. You can see<br>
    how they envisioned using Affair in the section of this booklet entitled A<br>
    Foreign Affair.”</p>
    <p><a href="http://www.sudtipos.com/fonts-affair.htm" title="http://www.sudtipos.com/fonts-affair.htm">http://www.sudtipos.com/fonts-affair.htm</a></p>
    <p>//////Malambo////////</p>
    <p>Master of the dancing brush, Angel Koziupa, and the node-obsessed<br>
    perfectionist, Alejandro Paul, offer up another bucket of fun with<br>
    Malambo. Koziupa has allowed his brush to jitter one whole millimeter in<br>
    this fresh design. Full of energy, cheek, and mischief, Malambo relates<br>
    amusing anecdotes of shaving without a mirror, mistakenly pouring wine<br>
    over the morning cereal, and people who trip over their own shadow on the<br>
    dance floor. Shaken, but not disturbed.</p>
    <p>In fact, dancing is what this typeface is all about. Malambo is a<br>
    traditional Argentine dance performed by gauchos (the Argentine equivalent<br>
    of 19th century North American cowboys). Although they dance quite<br>
    passionately and make the heartiest parrillas, most of them probably don’t<br>
    know what a font is. But you know... and we know. And that is something<br>
    called Malambo.</p>
    <p><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000174" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000174">http://www.veer.com/products/typedetail.aspx?image=UMT0000174</a></p>
