    html: |-
      <p><cite>The Modern Suite - very classy but a bit too old'ish</cite></p>
      <p>Can you believe I did not know Scotch/Figgins until I read this thread? I got impressed. Modern Suite is a great font package, very complete and with fine numbers. Nick pays attention to details and have a deep historical knowledge.</p>
      <p>I don't think it's old'ish – almost all fashion magazines adopt modern typefaces, for example. And Figgins has real italics, adding flexibility to text composition. But of course it may not work in the design you're planning.<br>
      .</p>
      <p><cite>Utopia is nice, pitty there is no sans.</cite></p>
      <p>It works very well with Myriad/Frutiger. For me, the major problem in Utopia is the lacking of small caps in italics.</p>
      <p>Celeste is another superfamily you may find good for this job.</p>
      <p>The serif family I'm developing (<a href="http://www.typophile.com/node/67787" title="http://www.typophile.com/node/67787">http://www.typophile.com/node/67787</a>) also aims to be suitable for texts with many numbers. But it's just an essay by now.</p>
