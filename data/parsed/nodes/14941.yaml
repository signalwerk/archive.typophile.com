      <p>I’ve been pondering the response to the disaster in Louisiana.</p>
      <p>I think there is an understandable amazement among many people, both within the USA and abroad, that the <em>the world’s only superpower</em> seems so woefully unprepared for this disaster at both the local and national levels. David is quite right to point out that now the relief and rescue effort is actually under way some remarkable things are being achieved — things that many other countries would not be be able to achieve —, but it is reasonable to ask why it took so long. And there is a perfectly reasonable expectation that the <em>richest nation on the planet</em> should be able to handle this situation much better than it has: there is no shortage of material resources, so inevitably it looks like a massive political failure.</p>
      <p>When millions of people around the world made donations to help the victims of the South Asian tsunami, it was with the knowledge that most of the countries affected were desperately poor by comparison to the western industrialised nations, and that there were neither the material resources nor infrastructure to provide adequate relief without massive international assistance. Quite simply, no one expected the governments of those countries to be able to cope, especially since the effect of the tsunami was so wide spread and the death toll so high. While the tragedy of what is happening in New Orleans and surrounding areas is terrible — I’ve made a donation to the American Red Cross, which seems the most direct means to support the immediate relief effort* —, it is localised and taking place against a backdrop of a country with a per capita GDP more than ten times larger than that of most of the nations affected by the tsunami. The USA should be able to help itself. Rather than wondering whether or not Americans expect too much or too little from their government, anyone might reasonably ask what the heck any government is supposed to be for if not to help its own citizens at such times?</p>
      <p>I’m glad to be able to make personal donations to organisations like the Red Cross, but such private charitable assistance doesn’t let governments off the hook for caring for their citizens.<br>
      ___</p>
      <p>* <a href="http://www.redcross.org/donate/donate.html" title="http://www.redcross.org/donate/donate.html">http://www.redcross.org/donate/donate.html</a></p>
    html_clean: |-
