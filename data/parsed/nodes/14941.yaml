      <p>While Font Aid and Building Letters cannot make a giant impact in comparison to overall disaster relief efforts, that should never stop us from doing what we can. As of tonight, the Font Aid III effort has raised over $17,600 to benefit the victims of the Southeast Asian tsunami and floods. This figure is from sales of the collaborative “Fleurons of Hope” font and the donated proceeds from sales of specific fonts from a group of MyFonts foundries earlier in the year.</p>
      <p>“Building Letters,” Jim Richardson’s side of the project, is not yet available, and I don’t have a release date at this moment. But when BL does go on sale, it will certainly raise more money for the cause.</p>
      <p>The Font Aid II September 11 font raised more than $5,000 in 2001-2002. I am not privy to the results of the inaugural Font Aid sales, as the project was under designer Claes Källarsson’s direction at that time (he originated the first Font Aid to assist war and disaster refugees).</p>
      <p>If you haven’t done so already, license your copy of Fleurons of Hope, please! Not only does every cent of the selling price go to a good cause, it’s a beautiful font and a heartfelt gift from the international type and design community who worked together to create it.</p>
      <p><a href="http://www.myfonts.com/fonts/fontaid/fleurons-of-hope/" title="http://www.myfonts.com/fonts/fontaid/fleurons-of-hope/">http://www.myfonts.com/fonts/fontaid/fleurons-of-hope/</a></p>
      <p>And thanks again to all who have contributed their time, creativity, and cash to help others.</p>
