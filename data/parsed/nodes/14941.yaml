      <p>The dykes weren’t strong enough.<br>
      But will even Holland’s defences be sufficient, the rate climate change is proceeding?<br>
      If the democratic governments were prudent about the security of their countries against environmental threat, they would be legislating draconian measures to wean us off the carbon economy. </p>
      <p>But the democratic system isn’t working in Canada and the UK (two countries I’m familiar with). Sure, the scientists have done their job, identifying the problem of global warming, and the media has done its job, publicizing it, and citizen activists have done their job, forming Green parties with comprehensive platforms and running a sufficient number of candidates to form a government, if voted for.</p>
      <p>Citizens have the option to vote Green, but they don’t. Most people want larger cars, bigger houses, air miles, food miles, and flat-panel TV screens, ASAP, and they feel pride in buying, owning, and consuming this CO2 generating stuff, not shame. Citizens consider the security of their material possessions, and their own safety, as social problems, not environmental ones, so they’ll vote for right-wing and neo-liberal law-and-order parties, not greens who would curtail their indulgencies. </p>
      <p>Greens should change their strategy from “Do the right thing” to “Only we can protect you and your property from violent assault and destruction”.</p>
