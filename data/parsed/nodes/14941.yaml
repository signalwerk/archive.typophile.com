      <p><em>...what does that say about Democracy?</em></p>
      <p>That it is corruptible — but then so are other systems of government —, and that it reflects the social, economic and cultural mores of the society (as it did in classical Athens, republican Rome, and has on the Isle of Man for some 1,200 years). In other words, having a democracy does not automatically produce a majority population of well informed and civil minded democrats. If many of the cultural forces in your country are running counter to that end, you can’t expect your democracy to function very well. The necessary relationship between effective democracy and the institutions of society that are needed to inculcate democratic social values should be obvious. Indeed, they are obvious, which is why they are deliberately targeted by forces that wish to undermine or exert control over the democratic process. The problems of democracy in the USA are the problems of a system that is not strong enough to counter the interests of capital, and unfortunately the US constitution seems to have been designed to put institutional brakes on democratic development, so US democracy is ill equiped to respond to the much more dynamic forces of wealth and power that have developed in that country.</p>
