    <p>The news just announced that the National Guard is being sent into New Orleans to evacuate it for the next two months. So all the displaced residents will need the help of organizations like the Red Cross. Would it be a good idea for the Typographic community to make a relief glyph font to be sold to raise money for an organization like the Red Cross? Fortunately all the New York radio stations are doing public service announcements appealling for donations of time or money to the Red Cross. Any Thoughts?</p>
