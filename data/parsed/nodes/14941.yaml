      <p>Hrant, is the fault lying in democracy or with political systems parading «as democracy»?</p>
      <p>USA, like many other countries, seem to have gotten rid of a royalty only to replace it later with a post-bourgeoisie host of business lobies. Democracy in it’s pure form is the «power to the people», not «the people to the powerful».</p>
      <p>The fault is only manifest in the system because it’s lead by immature people. Men and women who are in part there to help and in part because they crave power and social status. Any system can fail under that. Anything, will fail or only partly succeed in these conditions (a political system, a project, a business, a relationship, ... a life).</p>
      <p>But, maybe we should stick to our topic of choice... typography?</p>
