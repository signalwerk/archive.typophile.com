      <p>I think one of the most interesting developments is this quote from within the Bush family by none other than dear old “Barb”:</p>
      <p>“And so many of the people in the arena here, you know, were underprivileged anyway, so this is working very well for them.”</p>
      <p>This statement to me, is part of the underlying problem that has yet to be addressed. She says this statement as if she really doesn’t get it, and as if she is totally unconnected. Part of the larger problem as John Hudson and others have pointed out are years of issues that have continued to pile up over the years. </p>
      <p>The issue that this comment speaks to is the fact that 30-40% of the population of New Orleans was already poverty striken. For the wealthiest industrialized nation in the world (and one of the largest cities in the United States) that statistic is INEXCUSABLE. </p>
      <p>We live in a country where many cities are divided by poverty and race. This particularly gets my goat because my hometown of Cincinnati, Ohio (a very segregated city) socio-economic standing is almost literally Black and White. </p>
      <p>The survival of the fittest attitudes I’ve seen expressed I often find naive and dismissive. You’ll find very few people who have actually gone hungry share this viewpoint. My point is this: no one wants to be poor, and when there is such a disproportionate number of people who are in an allegedly wealthy nation, its time to access what the problem is. </p>
      <p>First and foremost we are human beings, the government and politicians need to start reflecting that. This isn’t just the problem of the citizens of the Gulf, its everyone’s problem. If you think this isn’t your problem, then you’re part of it.</p>
