      <p>Regarding the poverty rate in the US:</p>
      <p>When I was in college, my German professor spoke of a German colleague who said she was amazed the first time she saw a homeless person sleeping on the street of an American city. In Germany, this would not happen. The authorities would take that person somewhere where they would be taken care of. (So she said at the time. It sounds accurate, cos I’ve never seen a homeless person in Germany.)</p>
      <p>In the US, local government officials generally cannot arrest someone without suspicion of a crime being committed. A person cannot be institutionalized without being a danger to himself or others. Simply muttering to oneself and living in disarray is not enough to force a person to get help. In other Western nations, it is. Homeless advocates in the US routinely defend the “freedom” of the homeless to do as they wish as long as there is no violent or property crime. And that is the order of things here.</p>
      <p>Freedom still trumps security... sadly, freedom without a personal sense of responsibility can and will destroy what’s left of our culture from within: drugs, illegitimacy, domestic violence, pederasty, and the television programs, movies and popular music that celebrate and glamorize them. Why would anyone willing to walk out on the very child he conceived give a crap about some stranger’s house being flooded?</p>
      <p>There is also much more religious and private charity in the US in proportion to government services when compared with other nations, and these private charities are generally vastly more efficient in their spending. They can spend less and still help more people. Other countries are better at using government to solve these problems. (Er, except unemployment.) My theory is that the more homogeneous a culture, the more effective its government programs can be. American culture is vastly fragmented (a fact generally ignored by self-annointed cultural critics who think we all watch Oprah and NASCAR) and seems to be getting moreso. That’s unavoidable in a country this size. Whether that means privatization or moving more power back to states I’ll let someone else argue.</p>
      <p>Plenty of specific individuals are responsible for the failures both after and (more importantly) before the hurricane. Again, I’ll let others argue who they are and in what order. In the meantime, many of us have some checks to write.</p>
