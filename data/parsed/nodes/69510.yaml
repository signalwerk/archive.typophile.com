    <p>Hello everyone.</p>
    <p>I've been wondering for a long time about kerning and wonder if anyone can help me out with this specific issue I have, I've tried to illustrate it as clearly as I can.</p>
    <p>On the attached image I've tightened the whole word as an example without manually kerning anything. Usually if I wanted to keep it at this general tightness my first instinct would be to match the space between each letter to the space either side of the "o". However, I've always been slightly confused as to what should be correct spacing (in this example) for the letters circled.</p>
    <p>A) I assume l's should have more space than anything else so I'd leave it as is.<br>
    B) The "s" and "t" are touching here, how much space would I put between those?<br>
    C) The "r" and "a" - nearly touching?<br>
    D) "t" and "i" are especially close. Should they be pulled apart?</p>
    <p>As I said these are some examples, ideally I'd like to know the correct relationship between each letter, number etc. Does anyone have the names of books/websites that define these rules? Everytime I pick up a book on typography it seems to just mentioning fixing the word WAR. I know about the W and A issue but what about everything else? (The number 1 always seems to be quite a distance from other numbers, particularly in Avenir, the typeface I've used in this example).</p>
    <p>Hope that's clear, any help is much appreciated!</p>
