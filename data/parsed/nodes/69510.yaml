      <p>See my notes on the "tight but not touching" spacing style:<br>
      <a href="http://typophile.com/node/69306" title="http://typophile.com/node/69306">http://typophile.com/node/69306</a></p>
      <p>In this display style, equalizing closest distances becomes more important than balancing areas of space.<br>
      Alternatively: it looks like the letters are objects which have been horizontally stacked against one another.</p>
