    html: '<p>Don’t know if Vauxhall is part of the OPEL corporation, but the typeface shown looks like the proprietary <a href="http://monotypeimaging.com/ProductsServices/CustomDesignPortfolio/Opel/" rel="nofollow">Opel typeface</a> by Monotype. Similar: <a href="http://www.identifont.com/show?2BI" rel="nofollow">Metromedium#2</a>.</p>'
