    <p>Saludos<br>
    Actualmente están ofreciéndose diversas fuentes tipográficas con efecto de envejecido o desgastado, como por ejemplo en este caso la fuente Roper, con variables por desgaste de la misma fuente.<br>
    Ejemplo, fuente Roper, <a class="freelinking external" href="http://www.myfonts.com/fonts/virtuecreative/roper/" rel="nofollow">http://www.myfonts.com/fonts/virtuecreative/roper/</a></p>
    <p>¿Alguien conoce cómo se logra ese efecto para aplicarlo desde FontLab, Glyphs o desde otra herramienta de edición de fuentes? ¿Se trata de algún plugin adicional?</p>
    <p>Gracias por su respuesta, saludos</p>
    <p>J</p>
