    html: "<p>In answer to number 1, as far as I know: <br> <br>1. Typefaces do not receive copyright protection in the United States. <br> <br>2. Copyrights beyond a few decades would be expired anyway.  Certainly nothing from the Victorian era, when copyright was 14 years and limited to book publishing! <br> <br>Another issue is plagiarism; selling a digitized typeface without acknowledging the original designer might be considered unethical (but not illegal). <br> <br>90% of type design is revival or reinterpretation anyway.  Go for it! <br> <br>Paul</p>"
