  html: "<p>This question may seem naive to the more experienced among you, but I am trying to find a source (or sources) for older typefaces that are no longer available commercially / digitally. I discovered a new book with great listings but the actual font displays were possibly too small... what I'd like to do is find some books to have on hand to be able to re-create / digitize old fonts that seem appropriate for jobs -- or just re-draw nice faces for fun. I'm mainly interested in late Victorian through 1940s faces, and I would need the whole alphabet displayed. <br> <br>My questions are: <br> <br>1. This isn't illegal is it? <br> <br>2. Does anyone have suggestions for new / old books for me to check out? <br> <br>3. Can you find actual antique type specimen books for sale somewhere? Ebay? <br> <br>4. Are some of you already doing this, and if so does it take forever to redraw a font from a good visual reference -- and do you end up with good results? (I would be working in Illustrator.) <br> <br>--Thanks</p>"
  html_clean: "<p>This question may seem naive to the more experienced among you, but I am trying to find a source (or sources) for older typefaces that are no longer available commercially / digitally. I discovered a new book with great listings but the actual font displays were possibly too small... what I'd like to do is find some books to have on hand to be able to re-create / digitize old fonts that seem appropriate for jobs -- or just re-draw nice faces for fun. I'm mainly interested in late Victorian through 1940s faces, and I would need the whole alphabet displayed. <br> <br>My questions are: <br> <br>1. This isn't illegal is it? <br> <br>2. Does anyone have suggestions for new / old books for me to check out? <br> <br>3. Can you find actual antique type specimen books for sale somewhere? Ebay? <br> <br>4. Are some of you already doing this, and if so does it take forever to redraw a font from a good visual reference -- and do you end up with good results? (I would be working in Illustrator.) <br> <br>--Thanks</p>"
