    html: "<p>1 You'd have to check out the legal status for yourself: in the US type can be protected by design patent (and has been since the 1870s), elsewhere (including the entire European Union) it's protected by a range of laws including copyright. <br> <br>I would say that, probably, everything during the era you are considering is out of copyright and/or any other protection (except trademark). <br> <br>2 Old ATF catalogues? <br> <br>3 Yes, on eBay. <br> <br>4 Yes, it pretty much takes forever to do a good job - not only do you have to get the outlines right but there will be few clues as to the kerning and spacing of such samples. If you really want to do this properly you should buy a type digitising application, ie Fontographer or FontLab (you may be able to buy either from eBay too - I'd recommend the latter because at least it is still being developed: <a href=\"http://www.fontlab.com\" target=\"_blank\">www.fontlab.com</a>).</p>"
