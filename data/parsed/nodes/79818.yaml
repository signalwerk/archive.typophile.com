    <p>After several years of inactivity, I've revived my site <a class="freelinking external" href="http://www.pixilate.com" rel="nofollow">Pixilate</a>, with a new design and new fonts.</p>
    <p>Some releases are:</p>
    <p><img src="http://www.pixilate.com/images/62.png"><br>
    <a class="freelinking external" href="http://www.pixilate.com/fonts/lu-px" rel="nofollow">Lu Px</a>, a handwriting font based on an architect's lettering</p>
    <p><img src="http://www.pixilate.com/images/58.png"><br>
    <a class="freelinking external" href="http://www.pixilate.com/fonts/lango-px" rel="nofollow">Lango Px</a> a narrow handwriting/handlettered font that's quirky but legible</p>
    <p><img src="http://www.pixilate.com/images/74.png"><br>
    <a class="freelinking external" href="http://www.pixilate.com/fonts/rolig-px" rel="nofollow">Rolig Px</a>, a hand drawn fun serif</p>
    <p><img src="http://www.pixilate.com/images/20.png"><br>
    <a class="freelinking external" href="http://www.pixilate.com/fonts/quadrant-px" rel="nofollow">Quadrant Px</a> a squarish pixel text font</p>
