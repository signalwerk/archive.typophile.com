  html: |-
    <p>I'm pleased to announce that the newly enhanced website accompanying my recent exhibition</p>
    <p>FACE THE NATION:<br>
    HOW NATIONAL IDENTITY SHAPED MODERN TYPEFACE DESIGN,<br>
    1900-1960</p>
    <p>is now live, at this address:</p>
    <p><a class="freelinking external" href="http://www.stthomas.edu/facethenation" rel="nofollow">http://www.stthomas.edu/facethenation</a></p>
    <p>The just-added changes include more information about the works on display in the exhibition (and shown on the site).</p>
