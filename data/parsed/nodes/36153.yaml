    html: <p>I wouldn't exactly call you naive ;^P but personally I think the Frog Design characters look more like <a href="/wiki/Luc%28as%29%20de%20Groot" class="freelinking" rel="nofollow">Luc(as) de Groot</a>'s or <a href="/wiki/Michael%20Abbink" class="freelinking" rel="nofollow">Michael Abbink</a>'s style. It's all about basic shapes, curve structures and overall proportions. It's quite difficult to put into words, and at the end of the day it often is nothing more than a buzzing feeling in the back of the head that tells me what it is.</p>
    html_clean: <p>I wouldn't exactly call you naive ;^P but personally I think the Frog Design characters look more like <a href="/wiki/Luc%28as%29%20de%20Groot" class="freelinking link-lost" rel="nofollow">Luc(as) de Groot</a>'s or <a href="/wiki/Michael%20Abbink" class="freelinking link-lost" rel="nofollow">Michael Abbink</a>'s style. It's all about basic shapes, curve structures and overall proportions. It's quite difficult to put into words, and at the end of the day it often is nothing more than a buzzing feeling in the back of the head that tells me what it is.</p>
