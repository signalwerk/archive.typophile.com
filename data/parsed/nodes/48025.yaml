      <p>&gt;I don’t believe that not knowing a thing as rare as a komatz katan is certainly not professional incompetence for any rabbi. </p>
      <p>Israel, you are not getting it. Conservative and Reform congregations these days pray using the Israeli pronunciation of Hebrew (with an American accent). In it, a patach and kamatz are pronounced the same, but a kamatz katan is pronounced differently. Thus in order to pronounce the prayers properly, you have to be aware that 'kol' (all) is pronounced that way rather than 'kal'. So Reform kids today in elementary school are taught about the existence of the kamatz katan in their early Hebrew classes. And that's why some prayer books for Reform and Conservative print the kamatz katan differently. That's why your statement that 98% of Reform Rabbis don't know of the existence of the kamatz katan is so absurd. </p>
      <p>Now do you understand?</p>
