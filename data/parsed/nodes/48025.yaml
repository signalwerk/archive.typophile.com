      <p>William,</p>
      <p>&gt; disparage</p>
      <p>To know or not know komatz katan is to disparage? Come on!?!</p>
      <p>This sounds like grade school, and the teacher catches a kid with a comic book, shouting: "Ah, hah, do you know that this act could lead to World War III?!?"</p>
      <p>&gt; I repeat my accusation, because it’s true, and according to Torah I have the obligation to rebuke, but only three times.</p>
      <p>Accusation, true???</p>
      <p>Everything in Jewish law, known as halacha, has a context and a "geder" - a framework, of where the rule applies, and where it doesn't.</p>
      <p>When you study Jewish ideas and rules, you learn these matters, possibly even in depth, but your vast knowledge lacks understanding a rule's "geder".</p>
      <p>I think that this is the case of your understanding of "limud z'chus" and "lashon hora".</p>
      <p>&gt; but only three times. So I’m done.</p>
      <p>This is childish, and immature.</p>
      <p>First, this rule of three times has a "geder" too. It refers to three different scenarios, not three each the same, as here. You must take me aside in private, say by private email, and do this three times, in different contexts or scenarios.</p>
      <p>Second, the laws of rebuke also have a "geder". No one can simply rebuke anyone. Basically, you may not rebuke those "younger" in knowledge, or "older" in knowledge. You may only rebuke a person of equal standing, who you can influence for good. Here, age is not measured by calender years, but by knowledge of Torah and practice of halacha (although age is a strong factor for honor even if the person lacks knowledge of Torah).</p>
      <p>Why is this?</p>
      <p>If the other person is not on equal standing with you, then your rebuke will not influence them for good. And if this happens, the "aveira", the resulting transgressions, are your fault too, not only that person's fault.</p>
      <p>So, we see that giving a rebuke is complicated.</p>
      <p>Regarding those that are "younger" in knowledge, or "older" in knowledge, the correct way to rebuke is by educating the person.</p>
      <p>If the person is older and wiser, like a rabbi or teacher, one says: "But didn't we learn such and such in (and then cite the source?)?</p>
      <p>If the person is younger and less knowledgeable, like a child or ignorant (in Torah knowledge) person, we explain kindly and patiently.</p>
      <p>If the person is of equal standing, and the rebuke fails to have an impact, we are not allowed to feel: "So I’m done." Rather, then, one is obliged to confront the two person's respected authority figure, and report that the other person committed such and such offence, was rebuked in such and such manner, but failed to change.</p>
      <p>Then, one's done.</p>
      <p>This is clearly explained in the Codes of Jewish Law, and even translated in English by a few different parties.</p>
      <p>It is unfortunate that these ideas in halacha are learned, but their "geder" is ignored.</p>
