      <p>&gt; Whether the typesetter or user knows this Hebrew grammar rule of not, the furtive patach automatically appears of the condition arises. </p>
      <p>Well, let's see several examples. </p>
      <p> Furtive Patach is <strong>relatively</strong>  simple  since we know that there are 3 gutturals.<br>
      The Rule:<br>
      Furtive patach is an <em>a</em> vowel that is added to the 3 gutturals: het, he  &amp; ayin <strong>only</strong> when it's preceded by a vowel other than <em>a</em>  — you don't want to apply the rule to any word-final het, he &amp; ayin.<br>
       Now, you want to read the Bible; find the words; apply the rules ; build an OT feature —   how many  substitution? 100? 200? 1000?  </p>
      <p><a href="http://typophile.com/node/43377" rel="nofollow">Meteg</a><br>
      There are 10!!! different kinds of metegs!!! You want to read the whole bible;find the words with meteg;apply the rules, build an OT feature —  how many  substitution? 500? 1000? 2000? Just for one mark!?!? </p>
      <p>Dagesh:<br>
      Let's see the next sample  —  Genesis 1: 11.  The  word peri (fruit; mentioned 200 times, more or less) + dagesh.  One of them is<br>
      punctuated with  dagesh hazak.   So, just for one word! + one mark  you want to have 200  substitutions?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PeriSample_6387.gif"></div><p></p>
      <p>I don't think so. This is a HUGE task!!!!</p>
