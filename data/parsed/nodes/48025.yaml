      <p>Raphael,</p>
      <p>I believe to create a set of fonts with automatic placement of kamatz katan and shva-na is possible.</p>
      <p>In practicality, there are two systems; one is more generous with attributing a shva-na than the other; they do share 65% to 75% in common. although different context analysis is used for nikkud/meteg only data, than for Tanach data with taamim, because in Tanach data with taamim the meteg does not help determine certain shva-nas, but one of the taamim does this.</p>
      <p>It's simple to generate two versions: Kehot=like, following Rav Henna's system, or ArtScroll-like folowing Vilna Gaon's system. What the customer pays for, the customer gets.</p>
