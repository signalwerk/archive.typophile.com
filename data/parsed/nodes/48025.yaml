      <p>I am unaware if this understanding exists yet in secular knowledge. </p>
      <p>Chassidic thought explains that every person is endowed with two sets of talents: kochot giluim, and kochot ne'ehlamim (tangible powers, and 'hidden' powers). </p>
      <p>Using our ordinary talents (kochot giluim, tangible powers), something like Biblical Hebrew may take two years to absorb. Using our unusual talents (kochot ne'ehlamim, 'hidden' powers), something like Biblical Hebrew can take even a short time to absorb.</p>
