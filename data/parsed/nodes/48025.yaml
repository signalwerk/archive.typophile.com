      <p> My $0.02: An initial <em>sheva</em> is always¹ <em>nah</em>, so it is simply not indicated.<br>
       Also, Israel: I think you might be confusing the effect of <em>sheva nah</em> with that of the strong <em>dagesh</em>=<em>mapiq</em> (or weak <em>dagesh</em>; I can't recall which). To abuse the word, Example 1 as written “תָּֽמְכ֣וּ” would be pronounced "tam-chu"; if written “תָּֽמְֿכ֣וּ”, "ta-mə-chu"; if written “תָּֽמְּֿכ֣וּ”, "tam-mə-chu". (Of course there are grammatical rules that say which pronounciation to apply to the unpunctuated word “תמכו”, and not every version is possible.) Also, the sign above the <em>sheva</em> in the printed version is not what I'm used to seeing to indicate <em>sheva nah</em>: usually I see “מְֿ” (<em>mem</em>+<em>sheva</em>+<em>rafe</em>) rather than what looks like “מְ֯” (<em>mem</em>+<em>sheva</em>+<em>masora</em>-circle).<br>
       At any rate, I think a font is the wrong place for <em>sheva nah</em>/<em>nach</em> detection. An external program can me much more intelligent &amp; customizable to different rule-sets, while leaving the correct layout to the font.<br>
       (Furtive <em>patah</em> might be an exception: I believe the word “נֹחַ” (Noah) is supposed to be encoded <em>nun</em>+<em>holam</em>+<em>het</em>+<em>patah</em> rather than “נַֹח” (<em>nun</em>+<em>holam</em>+<em>patah</em>+<em>het</em>); but detecting {<em>ayin</em>, <em>het</em>, <em>heh</em>+<em>mapiq</em>}+<em>patah</em>+word-end is relatively simple. John's font does something like that, I believe.)<br>
      <em>Shabbat Shalom</em>/<em>Gut Shabbos</em> and fast easy on Sunday,<br>
      —Joel</p>
      <p>1. Almost always; I’ve heard a theory that the <em>sheva</em> at the begining of the word “שְׁנַיִם” should be <em>nach</em>, but I don't know how much credence to give it.</p>
