      <p>I don't believe it is necessary for an OpenType Biblical Hebrew font to have contextual processing look-ups for every use of dagesh.</p>
      <p>It would be great for an OpenType Biblical Hebrew font to have contextual processing look-ups for every use of meteg, but I believe that the current version of OpenType, MS VOLT 1.3, and Adobe InDesign CS3 ME could handle that much processing. </p>
      <p>A huge data base has already been created with every occurance cited. So, that aspect is not the hurdle.</p>
      <p>Perhaps, instead of character placement, ligature replacement could occur instead, causing metegs to be added to the text that doesn't have it. I think it would reduce the processing workload. But again I think this is beyond the limits of the software involved.</p>
      <p>Where it could be implemented is by shva-nah, shva-nach, komatz katan, komatz gadol, hataf komatz katan, and hataf komatz gadol, because their occurances are much fewer than meteg.</p>
