      <p>&gt; And what about the lower marks?</p>
      <p>Traditionally, they have been placed like graphic symbols aligned to the nikkud on the right side, with a slight space to separate them, and a meteg (if necessary) on the left side, with a slight space to separate them.</p>
      <p>Regarding the upper taamei mikrah, traditionally they have been centered above the Hebrew letters.</p>
      <p>This poses a problem regarding the shvah-nah, as two graphic symbols can not take up a single space. Plus, with variable character widths, this was too difficult to program in a font in the pre-OpenType days. So, the upper taamei mikrah were simply placed on the extreme left.</p>
      <p>However, if the upper taamei mikrah are placed according to the way they are chanted, perhaps their placement varies.</p>
      <p>Perhaps, similar rules apply to lower taamei mikrah, as you half seriously imply.</p>
      <p>Btw, David, I think shva-nah, komatz katan,  and hataf komatz katan, is doable through font-based ligatures, not through OT/VOLT replacements, although I agree that its not practical or efficient as you describe it for meteg.</p>
      <p>Anyway, I will know OpenType and MS VOLT's limitations better by next month.</p>
      <p>In the Talmud we learn that when one knows well the limitations that one deals with, then the fun begins, creative work arounds, etc. I don't give up easily.</p>
