      <p>A shvah nah is usually depicted by a small asterisk floating above the Hebrew character, somewhat like one of the upper taamei mikra.</p>
      <p>If so, then when we apply the rule of shvah nah to Biblical Hebrew, how can one of the upper taamei mikra be positioned in the same space as the shvah nah?</p>
      <p>I spent quite awile and researched each time shvah nah appeared in the Five Books of Moses, in the fantastic work of the modern day Jerusalem publisher Rabbi Winefeld. Each time, shvah nah appeared, there never was one of the upper taamei mikra. Rather, each time shvah nah appeared, there was only one of the lower taamei mikra.</p>
      <p>This is not only good news from a typesetting placement point of view, but seemingly teells us aldo that there is a logical relationship in the Biblical Hebrew grammatical rules for shvah nah and the taamei mikra.</p>
