      <p>&gt;&gt; &gt; It seems then that there are no hard rules or wisdom governing the correct positioning of the placement of upper taamei mikrah.</p>
      <p>&gt;&gt; Where did you get that? </p>
      <p>Actually, I do not know if there are no hard rules, or there are in fact hard rules, but earlier typesetters were simply unaware of them.</p>
      <p>When it comes to the subtleties of Hebrew glyph placement, Hebrew grammar rules and their use/application, these are subjects generally out of the realm of graphic art and typesetting.</p>
      <p>Furthermore, about one hundred years ago, mainstream Judaism preferred to discourage widespread knowledge of these topics, as they were areas of knowledge known best to maskilim (opponents of mainstream Judaism). In this way, people who were maskilim could be easily identified (by their knowledge of these topics), as theor outward appearance was similar.</p>
      <p>As a ressult, unfortunately, most people, including great scholars, no longer are familiar with these topics.</p>
