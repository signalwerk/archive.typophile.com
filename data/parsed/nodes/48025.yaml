      <p><cite>Koreen Publishing was purchased by another firm. In addition to creating a special typeface only for their Bible (based upon drawings of Ashkenazic sources), contravercial rules for Hebrew grammar were introduced as well. This was attributed to Mr. Koren. You say differently. I think you’re right, and they’re mistaken, confusing the name of the company with the details of contraversy maker.</cite></p>
      <p>Just to set the record straight. Israel, please please please check your facts before posting on forums. I am going through all your posts to check for incorrect postings.</p>
      <p>So firstly, Koren Publishers Jerusalem Ltd was bought out a year and a half ago. The typeface was created over 45 years ago. We are simply redigitising the font. It's identical to the original font created by Eliyahu Koren except rather than being cast in metal, it's being cast in OpenType :-)</p>
      <p>The rules for Hebrew grammar that were used are the same. Nothing has changed for the past 45 years. The Bible was proofread for 10 years before being published. </p>
      <p>As a fact, it is considered to be the most accurate Bible in Israel. Contrary to what Israel wrote, Charedim do not like Breuer. Breuer was an academic and actually it's the Modern Orthodox Gush Etzion Yeshiva bochurim that like Breuer. Charedim actually buy Koren. We have huge sales in Bnei Brak!</p>
      <p>Finally you will find Koren Bibles in every shul, be it Ashkenaz, Sefard, Edot Mizrach, Moroccon or Yemenite. If anybody has a problem with the kriat hatorah, then the Rav of the shul, regardless of his ethnic, political or dress code, will invariably say, "what does it say in the Koren".</p>
      <p>Regarding your comments on kamatz katan, shva na and furtive patach. Yes the furtive patach can be encoded (we have done so in the digital version of the Koren fonts). However, you cannot encode a kamatz katan or shva na. The reason is that there are so many opinions as to when a shva na should be put as well as a kamatz katan. I, when starting at Koren, also thought that this would be a simple grammatical process, but after months of understanding the complexities, I realised that you can't encode the entire Bible with all it's opinions into a font. It also serves no function. What are you going to do if Publisher B wants to print his Bible and disagrees with the opinions that you have relied on for the meteg vs gaaya thus changing whether it should be kamatz katan or shva na?</p>
      <p>In terms of siddurim with shva na at the beginning of a word. The Koren siddur which came out in 1981 has a shva na and shva nach indicated in the non-Tanakh parts of the siddur and the first letter is indicated as a shva na. I thought that this was daft since obviously it's a shva na, but Israel, you have proved Mr Koren correct in that some people think it's a shva nach!</p>
