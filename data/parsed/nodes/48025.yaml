      <p>To John Hudson,</p>
      <p>Unlike the furtive patach, or the folded ayin or lamed, or the truncated final chof or truncated final chof, which are mainly typographical issues (although thefirtive parach does limited grammatical impact), the shvah-nah, or or the hataf komatz kayan, are in deed full Hebrew grammatical symbols based upon Hebrew grammatical rules.</p>
      <p>As such, they should have their own Unicode values, like the komatz katan, shnah, or any nikkud or taamei mikra.</p>
      <p>True, there are different graphic symbols which Hebrew publishers have depicted the shvah-nah (at least four kinds of glyphs), bit all agree that a shvah-nach and shvah-nah are distict elements in Hebrew grammar.</p>
