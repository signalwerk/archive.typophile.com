      <p>More observations from the kibbitzer. </p>
      <p>According to what I was told the shva under a first letter is always a schva na, and so should be transliterated in English with an 'e'. But in fact Hebrew speakers today seem to avoid a spoken 'shva' whenever possible. Thus it's normally said "bracha" (blessing) and not "beracha." Though if you are singing or pronouncing it slowly a native might pronounce the shva, right?</p>
      <p>The reason I say all this is that for the poor learner like me it's hard to tell what the heck is going on. </p>
      <p>I mention this because when you go to Biblical marks of vowels and cantillation, nobody knows what exactly was in the heads of the masorites who did it, as far as pronounciation.  And we have different histories of ashkenasi, sfardic, yemeni, iraqi, etc. pronunciations of Hebrew just to confuse us further in trying to think about these issues. </p>
      <p>So wouldn't just leaving the masorite marks as is, admitting we don't exactly know, be a better course of action, rather than trying to create a system of pronunciation that is not modern, nor do we really know whether it's ancient? </p>
      <p>I mean, Avot also says that the wise person when he doesn't know says, "I don't know."</p>
      <p>Shabbat Shalom</p>
