      <p>I am working together with John Hudson, who I respect very highly for both his excellent Hebrew type design and well thought out nikkud/taam placement knowledge.</p>
      <p>The issue we are groping in the sequences when narrow Hebrew letters like vohv or yuhd appear before left aligned Hebrew letters daled or reish, and sets of taam/nikkud/meteg appear under them.</p>
      <p>As you can picture, very little space exists, and bumping or overlapping occurs, if we apply the same default nikkud/taam placement rules as in other combinations.</p>
      <p>If course, as the professional Hebrew typesetter knows, this can be addressed and corrected through kerning, where the bumping or overlapping is removed by nudging different elements.</p>
      <p>The question is how to best incorporate these personalized tweakings into the OpenType Biblical Hebrew font as a sub-set of instructions, so that the inexperienced user will enjoy this knowledgeable result automatically.</p>
      <p>Like including a furtive patach-like instruction for shvah-nah, or for komatz katan, I believe this too can be incoporated into the well-made OpenType Biblical Hebrew font.</p>
