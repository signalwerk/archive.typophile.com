      <p>&gt; Exodus 17: 12.<br>
      Word # 1: indeed there’s a circle around a small asterisk + shva na + lower cantillation mark.<br>
      Word # 2: the word is punctuated with shva na! + upper cantillation mark! Without the custom mark (a circle around a small asterisk).<br>
      Word # 3: the word is punctuated with shva na! + upper cantillation mark! Without the custom mark (a circle around a small asterisk).</p>
      <p>You can certainly find examples that I overlooked. More power to you. However, here was not the case (G-d does not want to fling mud in my face!)</p>
      <p>In the two examples that you cite, there is no shvah-nah. </p>
      <p>According to the Biblical Hebrew grammatical rules for shvah-nah employed by Rabbi Winefield, Kehot (the huge Chabad/Lubavitch publishing house), and ArtScroll (the evedn huger and largesy Jewish publisher in the world), there is NEVER EVER a shvah-nah under the first letter of a Hebrew word.</p>
      <p>I believe you are confusing an ordinary shvah (which inmdicates to the reader ti make a very short sound of the consonant above it), and a true shvah-nah ( is a series of two sounds, a continuation of the consonant/vowel combination of the set in the Hebrew letter BEFORE the Hebrew letter with a shvah under it, AND ALSO the short sound of the Hebrew letter with a shvah under it.</p>
      <p>In your example from Exodus 17:12, the word with a shvah-nah is pronounced "tam-meh-chu". If it were only an ordinary shvah, it would be pronounced "tah-meh-chu".</p>
      <p>The reason why the latter two examples did not have a graphic symbol indicating a shvah-nah, a circle around a small asterisk, is because the shvah is an ordinary one, and not a shvah-nah.</p>
