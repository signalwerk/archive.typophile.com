      <p>&gt; &gt;  a kamatz katan is pronounced differently</p>
      <p>In Wikipedia <a href="http://en.wikipedia.org/wiki/Niqqud" title="http://en.wikipedia.org/wiki/Niqqud">http://en.wikipedia.org/wiki/Niqqud</a> in deed the pronunciation difference of modern Hebrew between a regular kamatz (an "ah"-like sound), and a kamatz katan.</p>
      <p>When I was a boy, and learning in a Reform Judaisn Sunday school, the prononciation taught to us was not for modern Hebrew, or Sephardic. Rather, Ashkenazic pronunciation was taught, and this distinction was not taught at all, as it was not not necessary.</p>
      <p>Also, in various ulpanin (schools of Hebrew language in Israel), where I was taught pronunciation for modern Hebrew, no distinction was taught. Similarly, on a kibbutz-ulpan, at college age, I never was taught about the kamatz katan.</p>
      <p>Only in my late twenties, when I became a professional type design on the Apple Macintosh computer, did I discover the existance of a kamatz katan. I learned that it was sounded like a kamatz, but was shorter in the length of its sound, and hence called the "small kamatz".</p>
