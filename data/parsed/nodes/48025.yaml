      <p>&gt;&gt; &gt; Similar, I am interested in the various rules for shva-nah, shva-nach, komatz katan, komatz gadol, hataf komatz katan, hataf komatz gadol, and any other grammatical rules governing Hebrew.</p>
      <p>&gt;&gt; There are a lot of books about grammar. But how &amp; when to use/apply the rules — that’s another story. What do you know?</p>
      <p>There are many books on the basics of Hebrew grammar. What I seek is not basic. I don't seek the definitions of these forms, such as, shva-nah, shva-nach, komatz katan, komatz gadol, hataf komatz katan, hataf komatz gadol, etc. </p>
      <p>As you write, I seek "how &amp; when to use/apply the rules".</p>
      <p>I seek to better understand these rules, the conditions of their use and application, in order to incorporate them into the OpenType Hebrew fonts I am creating.</p>
      <p>For example, John Hudson created the excellent SBL-Hebrew OpenType Biblical Hebrew typeface, and incorporated the Hebrew grammatical rule of the furtive patach into the font. </p>
      <p>One vowel in Hebrew is the patach, pronounced AFTER the Hebrew letter positioned above it with an "ah" sound. However, if the patach is position above the final Hebrew letter of the word, and that final Hebrew letter is either a Ches or an Ayin, then its positioning in under the extreme left side of the Hebrew letter. This indicated to the reader that the patach is not pronounced AFTER the Hebrew letter, but instead BEFORE the Hebrew letter.</p>
      <p>Tis kind of patach is called the furtive patach. Whether the typesetter or user knows this Hebrew grammar rule of not, the furtive patach automatically appears of the condition arises. I seek to do the same thing regarding other Hebrew grammar rules, wherever possible.</p>
