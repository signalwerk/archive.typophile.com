      <p>Israel, I accept your statement that you abhor lashon hara and believe in the principle of judging "l'chaf z'chut". But judging by this thread, you don't recognize when you are violating both principles, regularly. </p>
      <p>As the Talmud makes clear, judging "l'chaf z'chut" means that you try to put a good construction on what the other person does, or in other words try to view their action with the best interpretation, in the most favorable light. </p>
      <p>But here you say you have had no contact with Reform for thirty years, but are willing both to judge in the worst light and than to say publicly that 98% of Reform Rabbis have never heard of a kamatz katan. If that is judging 'l'chaf z'chut,' and avoiding lashon hara, then I'm the Pope of Rome.</p>
