      <p>David,</p>
      <p>&gt; Do you think that the Hebrew langauge is only shva &amp; kamats?</p>
      <p>I lived in Israel, and spoke Hebrew. I have made over 100 Hebrew fonts, with Hebrew letters, nikkud, and taamei mikra. I have studied many hundreds of Hebrew language books in the original. </p>
      <p>Do you really think this? If yes, I really held you in much higher regard. Did I make a crude mistake?</p>
      <p>&gt; The answer is morphological or etymological.</p>
      <p>You may be a knowledgeable Hebrew grammar teacher, and a fine Hebrew type designer, but I believe here you are incorrect.</p>
      <p>Morphology (linguistics), the study of the structure and content of word forms. -Wikipedia</p>
      <p>Etymology is the study of the history of words — when they entered a language, from what source, and how their form and meaning have changed over time. -Wikipedia</p>
      <p>I think that the difference between declaring a shvah as either a shvah-nah or as a shvah-nach is purely grammatical. It neither relates to the structure and content of a word's form, or to its history.</p>
      <p>For an intelligent person as yourself this is merely a way to save face, and pretend you know, when you really do not.</p>
      <p>Look at William, when he does not know something, he searches and finds out.</p>
      <p>Pirkei Avot declares that one who is shy does not learn, because he's afraid to ask. In order to learn, you must admit that you do not know, and seek out knowledge.</p>
      <p>&gt; Name one [secular] publisher</p>
      <p>When I began making Hebrew fonts back in 1988/89, I read documentation from Apple Computer, Inc. about Hebrew encoding standards, and inspected Hebrew system fonts from Apple with a bit map font editor tool.</p>
      <p>I found a komatz katan, and wondered what it was. I never saw one before, nor in ulpan years before no discussion centered around it.</p>
      <p>As a Lubavitcher chassidic, I prayed daily, and knew that on Saturday night we recited a prayer called "Vetayn Lecha" that featured the final version of chof with a komatz and a dagesh, and a final version of nuhn with a komatz. But there was no komatz katan in the entire prayerbook.</p>
      <p>I was an authorized Apple developer and called Apple in Cupertino, California. In those days, you could talk to someone. The person that I spoke to was the Hebrew language manager, a former Israeli (chiloni - secular). </p>
      <p>I questioned his decision to encode kometz katan, but not character ligatures used in a prayerbook.</p>
      <p>He answered that he never read in a prayerbook, and was unaware of these character ligatures... that no one prayed anyway... and that komatz katan was used in schools teaching children to read.</p>
      <p>I replied that in a few years, many more religious people, children, teenagers, and adults, will use computers, and secular will eventually dwindle in number and know Hebrew poorly (as we see already beginning today).</p>
      <p>&gt; [about Reform rabbis not knowing things like katan] why say that? Do you know? </p>
      <p>I don't know much for sure. I hope that there are a small percentage that know. Most Reform rabbis or students who were making their career to be Reform rabbis, know very little about Torah, Judaism and Hebrew, sad to say. They knew a lot about social issues, politics, movies, and how best to inspire people. They would make great social workers or therapists.</p>
      <p>&gt; Do you know what is kamats katan?</p>
      <p>Like shvah-nah and shvah-nach, hataf-komatz katan and komatz katan, and an ordinary komatz (gadol), I understand the issue pertains to pronunciation.</p>
      <p>Nah means moving; nach mean resting: when a shvah-nah appears we only slightly pronounce the sound of the consonant above the shvah; when a shvah-nach appears we do pronounce (a little more than slightly) the sound of the consonant above the shvah.</p>
      <p>Katan means small; gadol means big: a consonant with a ordinary komatz (gadol) below it is pronounced with a big, full sound; a consonant with a komatz katan below it is pronounced with a small, shorter sound; a consonant with a ordinary hataf-komatz katan below, quicker sound.</p>
      <p>I may be wrong. I am a type designer, not a grammaratarian, nor a Reform rabbi. :)</p>
      <p>&gt; Do you have samples?</p>
      <p>I don't have my books here. I will ask one of my sons for some.</p>
      <p>Rabbi Winefield of Shay Lemorah publishers has it all. He also wrote the Shay Lemorah commentary. It appears he's a gigantic scholar that only appears only after many generations.</p>
