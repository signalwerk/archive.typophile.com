      <p>I received the following very explicit statement from "Ask a Rabbi" at the Reform Judaism web site.</p>
      <p>...please be advised that the "kamatz katan" is a very important part of Hebrew grammar... It IS taught as part of the Reform Movement's Hebrew curriculum...</p>
      <p>Rabbi Sharon L. Sobel<br>
      Executive Director<br>
      Canadian Council for Reform Judaism and ARZA Canada</p>
      <p>According to this statement, Reform Judaism schools clearly teach use of the kamatz gadol "as part of the Reform Movement's Hebrew curriculum".</p>
      <p>Hence, I was incorrect in stating that Reform rabbis do not know kamatz katan today. </p>
      <p>In my defence, I clearly recall that when I was a child in a Reform Judaism Sunday school never learning about it. Also, in interacting with both many Reform rabbis in the USA over the years, and with many Reform rabbinical students in Jerusalem, I didn't find them knowledgeable understandingly about issues of Jewish law (halacha) or the Hebrew language.</p>
      <p>If Rabbi Sharon Sobel is correct, perhaps Reform has reformed during the past three decades, or the movement and certain affiliate temples and schools embrace this knowledge, but the bulk is much less knowledgeable.</p>
      <p>According to William's explanation that a kamatz and patach represent an "ah" sound, like the Sephardic-style puctuation used in Israel, and the kamatz katan represents the "oh" sound, how did Askenazic Jews traditionally distinquish between there "oh" sounding kamatz and kamatz katan?</p>
