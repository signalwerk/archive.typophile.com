      <p>David,</p>
      <p>When I bemoan the incomplete knowledge of Biblical Hebrew grammatical rules as a insulting comment that there is a widespread lack of knowledge. Thank G-d, many of those who love the study of the Bible in its original know many Biblical Hebrew grammatical rules. </p>
      <p>Yet, as in kabballistic literature there is a discussion that the truly wise person realizes that as he or she knows more and more, in truth they know less and less in relationship to how much knowledge there is to know. There is no limit of how much infinite wisdom one can optain; the more you know, the more you realize that there is so much more to know.</p>
      <p>Reb Ovadiah Yosef Shlita will be the first to say this. The other great scholar and leader I di no know. As you remember, Reb Ovadiah was a past Chief Rabbi (Sephardic) of Israel in the late '70s. He has a huge following in Israel today.</p>
      <p>Regarding the sleuth of Hebrew Bibles that are seemingly incomplete, with the exception of Rabbi Winefield's Shai L'Morah series of books, including the Tanach, the shvah-nah (and usually the komatz katan and hataf komatz katan) does not appear.</p>
      <p>This is clearly a lacking, as a few books of the Rishonim (early rabbinic authorities, like Rashi and Maimonides) document these Biblical Hebrew grammatical rules, and preceded the invention of the printing press by over a hundred years.</p>
