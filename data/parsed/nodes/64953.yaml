      <p>Yes; the small x-height does make Kabel very elegant. I want my version to go in the middle area between these existing designs. And I like some of the seventies posters made with ITC Kabel with the heavier weights, so I think I'm keeping the current x-height. (I might make a tall ascender/descender version as well…)</p>
      <p>I did try out the sharp connections for b,d,p and q as well, but when I tried that on the 'b', I wanted to keep it in Bauhaus-style, so it looked somewhat wonky. Therefore round connections.</p>
      <p>As for the name, I'm undecided. Any suggestions? STF Kabel? Tabel?</p>
