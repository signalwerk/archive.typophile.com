      <p>I don't think it's so much that one might use certain weights together (although people do) as it has to do with creating a family that has a visually consistent design from the lightest to boldest. A big part of the art of type design has to do with compensating for visual illusions like this. Making things <em>look</em> consistent is more important than having them <em>be</em> consistent.</p>
      <p>It's your design and your decision, but I think you should consider it.</p>
