    html: |-
      <p>Walter Tracy in his Letters of Credit has a very astute analysis of the problems in Kabel, particularly the lower case, and even suggestions for improvement. I think you'd find it very interesting and maybe helpful. </p>
      <p>I think you have some problems with widths. Your a to me is too narrow for the rest of the design, particularly the e. Tracy criticizes the original m as too narrow. Here you have also made the n h u narrow as well, which I think is going to cause problems for good rhythm in words. The usual view, as expressed in Tracy's discussion of spacing, is that the counters in the h and o need to be not so different in volume. </p>
      <p>I think you are right that Kabel has a lot of merits, but also problems in the lower case. But I think you need to work on the end result having more even rhythm, if the revision is going to be successful.</p>
    html_clean: |-
