      <p>I see your points, but in my opinion, I've made a whole new and differet version of Kabel with different x-height, weight(s), and with quite a few totally different glyphs. As you can see here, the ITC and Adobe/Linotype versions are pretty different from each other, as well as my take is very different from them:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/test1_3475.png"></div><p></p>
      <p>Here is glyph 'a' with my design, then ITC and then Adobe with same point size:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/testi2_5098.png"></div><p></p>
      <p>I found ITC x-height way too tall, and Adobe too small, so determined mine to my liking. Also, glyphs 'n, 'm', 'h' and 'u' have sharp connection instead of smooth like in 'a' above; and there are many more differences over the whole character set.<br>
      I've gone through my sample books, and both Adobe and ITC have taken some liberties from the Koch original. I think the most honest to original fonts is Elsner + Flake versions.</p>
    html_clean: |-
