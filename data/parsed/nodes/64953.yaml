    html: |-
      <p>Hi, Ryan-</p>
      <p>Thanks for your comments. And I also had an issue with Kabel; it is very recognisable font, but those few things just weren't right to my eye. That's why I made my version.</p>
      <p>In my opinion the optical difference in height with light and heavy are of no concern; have you ever seen those weights been used next to each other? Basic rule with large families is to leave one weight in between for emphasis; so, for light, use medium as an highlight weight, and for book, use bold, and for medium use heavy.</p>
      <p>That is why I've decided not to change the ratios of x-height and des- and ascenders.</p>
    html_clean: |-
