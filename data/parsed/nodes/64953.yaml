      <p>Wow. This is really cool. I've never really liked Kabel either, always rubbed me the wrong way, but I like this.</p>
      <p>I don't have much to say as I don't feel nearly as experienced as others on this forum, but I will comment that I notice the round lowercase letters seem to look bigger in comparison to the other lowercase letters as the font gets lighter. This seems to be a result of all of the letters except the round ones thinning in character width with the weight loss. The o's not too bad, but the p, q, d and b look huge. Perhaps bring the stems in closer and loose the full circle? I know that kinda ruins the integrity of the font style but it might help create a more consistent color across the light weights.</p>
      <p>Nice work on this. I'm amazed thinking of the amount of work that must go into this that you make look so easy with a few image posts on a forum.</p>
