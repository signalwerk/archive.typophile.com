    <p>I've been mulling over Kabel for some time now, and yesterday I decided to jump in, and do my version of Kabel-isque font. It has no metric or proportional or direct design of Kabel, since I keep finding issues with the original. The fact is I really like the overall feel of Kabel, but when I take a closer look, it just throws me off.</p>
    <p>So, I decided to make my own version:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/test_5329.png"></div><br>
    This is medium weight, and there'll be five or six other weights.<p></p>
    <p>It has pretty much the same feel as Kabel, but now I can live with the glyph design as well. This is less than two days' work, so be gentle, but what do you think? I already know that uc M and lc g need work.</p>
