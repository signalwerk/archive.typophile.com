      <p>Ok. I did it. John, it came to my mind thanks to your tips :)</p>
      <p>It turned out to be very simple. I just added old style glyphs (numerators, denominators, fraction and slash) and made some changes to the frac feature:</p>
      <p><code></code></p>
      <p>lookup FRAC {<br>
      	sub <strong>[slash slash.osf] by [fraction fraction.osf] </strong>;<br>
      } FRAC;<br>
      lookup HOCH {<br>
      	sub [zero one two three four five six seven eight nine] by [zero.numr one.numr two.numr three.numr four.numr five.numr six.numr seven.numr eight.numr nine.numr];<br>
      } HOCH;<br>
      lookup TIEF {<br>
      	sub <strong>[fraction fraction.osf]</strong> [zero.numr one.numr two.numr three.numr four.numr five.numr six.numr seven.numr eight.numr nine.numr]' by [zero.dnom one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom];<br>
      	sub [zero.dnom one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom] [zero.numr one.numr two.numr three.numr four.numr five.numr six.numr seven.numr eight.numr nine.numr]' by [zero.dnom one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom];<br>
      } TIEF;</p>
      <p></p>
