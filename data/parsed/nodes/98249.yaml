      <p>Nick,<br>
      You are right, there is no need to change frac feature. I've removed changes and it works well.<br>
      In fact, my scenario is similar to yours except that I've created new glyphs for osf fractions instead of using inferiors and superiors.<br>
      I work in Glyphs app so all glyphs with .osf suffix are automatically included in onum feature, so that approach was more elegant for me. </p>
      <p>Thank You.</p>
