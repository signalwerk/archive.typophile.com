      <p>Here’s what I did in the Modern Suite.</p>
      <p>First, I made a set of quite small superiors and inferiors (because I have never liked these—especially superiors for use in references—to be too obtrusive).<br>
      Then I made a set of numerators and denominators that were larger, for use as the default fraction style, with the default ﬁgures, which are lining.</p>
      <p>To change to the smaller size of fraction style, I included a change from “numerator/denominator” style to “superior/inferior” style in the Oldstyle ﬁgures feature—shown below in bold. (Making sure the Fraction feature came before the Oldstyle features in sequence.)</p>
      <p>There is no need to include this change in the Fraction feature, as John has already mentioned.</p>
      <p><code>feature onum {<br>
      # Oldstyle Numerals<br>
        sub @figs by @figs_onum_tnum;<br>
        sub @figs_lnum_pnum by @figs_onum_pnum;<br>
         <strong> sub @figs_numr by @figs_sups;<br>
      sub @figs_dnom by @figs_sinf;</strong><br>
      } onum;<br>
      </code><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Numr_5497.png"></div><p></p>
