      <p>I think this could be customized <a class="freelinking external" href="http://www.houseind.com/fonts/chalet" rel="nofollow">House Chalet</a>. If you mix the various 'years' you can find the right letterforms. Cut out pieces from the 'a' and 'e' and you have it.</p>
