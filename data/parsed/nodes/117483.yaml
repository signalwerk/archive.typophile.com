    html: |-
      <p>Chalet is a good candidate for customization. It is also deeply rooted in <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/bauhaus" rel="nofollow">Bauhaus</a> (or <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/pump" rel="nofollow">Pump</a>). To me, it's either a freebie or a complete custom job based on the same /o shape (mainly no optical correction):<br>
      - /t = /o half bottom + 2 strokes<br>
      - /a = cut /o + 1 stroke<br>
      - /n = /o half top + 2 strokes<br>
      - /g = /o + (/o half bottom + 1 stroke)<br>
      - /e = cut /o + 1 stroke<br>
      - /d = /o + 1 stroke</p>
