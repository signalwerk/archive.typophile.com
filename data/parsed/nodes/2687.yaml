    html: <p>Uh, is are the curves unsmooth or is that just my flash plugin? <br>I find it very good, Alejandro. It just needs to be fine-tuned in the details, as far as I'm concerned. The mix of influences is well balanced and it gives a very lively appearance. I'd balance the lowercase s and add lowercase numerals, then re-check all the metrics, that's what comes to my mind, but in general it seems to work very good.</p>
