  html: |-
    <p>Sometimes I feel like I need a font that works in this way. Not exactly a unicase but still a font that let me play in big display words ... or better you can call it pure trendy, stilysh, etc... <br>I began with a few letters and I think that now I m almost satisfied with the result. That is why i put my font here, because you will destroy my illusions <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">)) <br>Seriously, the idea is to complete a set with some more weights. <br>Please feel free to help me to finish the work. <br>I know that some forms (Hrant pointed me) are more humanistics than the others but I m trying to equilibrate the situation and maybe it results in a strange mix way. <br>Sorry for my poor english. <br> <br></p>
