    <p>Hi, all.</p>
    <p>I'm testing out another combination. I'd appreciate your thoughts on whether these two faces are co-existing peaceably, or are jarring your eyeballs. (Or, any other critique you'd care to lob at me. Go for it. I can take it.)</p>
    <p>If it's the case that another sans would work where this doesn't, let me know.</p>
    <p>(I know, I know, you're gonna ask "what's this for?" I'll tell ya later.)</p>
