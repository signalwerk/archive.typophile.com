    html: |-
      <p>So far, people aren't bothered by a stylistic mismatch -- just the proportions?</p>
      <p>I was trying to split the difference between matching the x-height and matching the cap-height. The sans I'm trying here has an x-height that is much smaller than the serif's.</p>
      <p>This sans I'm trying has a wide variety of weights; the serif I'm using has none. I used the one that looked a little darker b/c I thought, in this example, that it could stand for STRONG or BOLD.</p>
      <p>But you confirm my fears: the vertical proportions are just a little bit too far off. I haven't yet found a sans in this genre that matches like I'd like; this is the closest I've gotten. </p>
      <p>Anybody know how I can get in touch with Wolfgang Homola? The other candidate was <a href="http://www.myfonts.com/fonts/type-together/soleil/" title="http://www.myfonts.com/fonts/type-together/soleil/">http://www.myfonts.com/fonts/type-together/soleil/</a> ,  but I would be interested in customizations.</p>
