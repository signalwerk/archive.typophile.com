    html: |-
      <p>When I saw the subject of this thread, I was expecting someone to suggest Chinese characters as a substitute for Bliss symbols - but I see that this is not about them.</p>
      <p>My answer to the poster's original question, now that I've found out what Bliss looks like, would be Gill Sans; not a free font, but it might be one he already has.</p>
      <p>Gill Sans has the same "feel" as Bliss, while Trebuchet doesn't; on the other hand, Trebuchet has the unusual lowercase l of Bliss. So one could use Gill Sans, and then go back and change all the lowercase "l"s to Trebuchet.</p>
    html_clean: |-
