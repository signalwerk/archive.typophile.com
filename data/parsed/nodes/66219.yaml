  - id: 389590
    user: 50554
    date: 2010-01-18T07:52:00
    date_raw: 18 Jan 2010 — 7:52am
    votes: null
    html: |-
      <p>I realize my suggestion is perhaps even worse than Nick Cooke's suggestion "Arial", but the weight of Trebuchet differs so slightly from that of at least Bitstream's Humanist 521 (if not a more "real" Gill Sans) and its ascender height is also only slightly higher, so that a naive person might indeed note that the "feel" of Gill Sans matches that of Bliss (that of Trebuchet conspicuously does not; it's more like News Gothic) and then see that, oh, yes, it's got the right lowercase "l", and so it must be the right font.</p>
      <p>The fact that the lowercase "p" and "q" have an extra bit that Bliss avoids, though, would still be a way to notice that Bliss isn't really being used. But what I suggest is indeed a way of "faking it".</p>
    html_clean: |-
