    html: |-
      <p>If I can voice an opinion, I’d say that it’s impossible to put too much emphasis on audience perception. It becomes an issue of “who is meant to read this?” Grafitti type is uncomfortable for me on a personal and aesthecic level. But if I’m designing for an audience that it particularly speaks to, as a designer — a communicator — I have to consider how I will best communicate the concept.<br>
      Designers  can easily fall into the trap of designing for designers instead of designing for readers. Listen to DanW when he says to pay attention to focus groups and other indicators to gauge how our work is, in FACT, being perceived.</p>
    html_clean: |-
