      <p>Thanks for all your comments. Maybe I am reading too much into it. Not sure. For this project, there is no focus group. All I have to go on is my own research, which is far from adequate, and what the clients tells us. Not being Latino myself what else do I have to go on?<br>
      What do you do when your given something to design and not given enough background? You’ve got to come up with a concept somehow or else your just shooting in the dark.</p>
