      <p>I have a couple of questions. Why is the u in us not Upper case? Like this</p>
      <p>Nosotros(palmtree)US</p>
      <p>Also why is the palm tree the color of Nosotros &amp; not Us or a third color or a blend?</p>
      <p>I am not saying this should be the case but I found when I looked at the design these questions poped to mind right away. I also realize you were only talking about the r&amp;o and didn’t ask about the design in general so ignore this if you want.</p>
      <p>Finally ( and ignore this too if you like) I think you should perhaps </p>
      <p>- pull the arm of the r back a little the closeness doesn’t look right to me and interferes with reading the text smoothly.<br>
      - Add some weight to the terminal ends of the s - they look weak in the context of a logo and<br>
      - add some weight to the Terminal ends of the N.</p>
      <p>What if you has some yellow light hitting the palm tree? Like the light was coming from the right side...</p>
