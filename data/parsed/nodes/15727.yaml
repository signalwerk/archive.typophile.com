      <p>I agree with Dan on this. It is too tight and given that the communication is a bilingual word play, you do lose legibility too much and it starts to look too contrived. You are reading too much into it.</p>
      <p>But I don’t entirely agree on the veracity of focus testing - we’re constantly burdened by this - as interpretations can also be expectations by the target audience.</p>
