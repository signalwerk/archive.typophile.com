    <p>I’m facing some uncertainty with this one and was looking for a little clear sighted feedback. I’m working with the kerning on this logo/masthead for a magazine. The pair in question is the “ro”. I want to keep the letters apart for the sake of readability, but it throws the kerning off.</p>
    <p>In the two examples, the top version is fitted, the bottom version is not. Which do you prefer?</p>
    <p>Thanks</p>
