      <p>Characteristics. Well, I do a lot of work on management books, occasionally student's textbooks, etcetera. (So I'll have to look into a sans as well, for now my choice would be <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/ff-din/" rel="nofollow">Din</a>, primarily becaus we already got the set – but perhaps the budget leaves room for...)</p>
      <p>Anyway, it struck me that a lot of books in that field look alike; thoroughly but a bit boring in a way. Though I know there's more to it than just starting of with a different typeface, I took a closer look at <a class="freelinking external" href="http://new.myfonts.com/fonts/typotheque/fedra-serif-b/" rel="nofollow">Fedra</a>. Somewhat overused perhaps, but more important; I wonder whether it stands lengthy reading that well.<br>
      Than I came across Expo; it's not tó dark, with nice soft curves and swashes.</p>
      <p>This morning I did some experimenting with Calluna (the Roman is free). And I must say I'm impressed. It handles really easy, runs pretty economically (wich is generally appreciated by editors and such) and is without a doubt highly readable.</p>
