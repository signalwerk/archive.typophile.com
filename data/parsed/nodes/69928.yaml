    <p>Hi all, after using <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_nexus_serif_ot/" rel="nofollow">Nexus</a> a few years for at least half the projects, it's time for something different; a fresh serif.</p>
    <p>My shortlist for now:<br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/exljbris/calluna/" rel="nofollow">Calluna</a><br>
    <a class="freelinking external" href="http://www.typeculture.com/foundry/font_collection/font.php?ID=FNT09_03" rel="nofollow">Expo serif</a><br>
    <a class="freelinking external" href="http://www.mvbfonts.com/html/fonts/verdigris/pk_verdigris.htm" rel="nofollow">Verdigris</a></p>
    <p>Any suggestions – or comments – would me more than welcome, and appreciated off course.<br>
    Thanks in advance, Brieck</p>
