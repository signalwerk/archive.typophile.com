      <p>Brieck,</p>
      <p>You don't give more details about the characteristics you're searching for.<br>
      Based on your shortlist, my guesses:</p>
      <p>1. <a class="freelinking external" href="http://www.chastellun.net" rel="nofollow">Stuart</a>.<br>
      Resembles Expo Serif Pro, with a more moderate calligraphic feel. It has a lot of OT features and a good set of weights. Very readable, although with a clear personality.</p>
      <p>2. <a class="freelinking external" href="http://commercialtype.com/typefaces/guardian/egyptian_text" rel="nofollow">Guardian Tex</a><br>
      More cool and neutral, with a huge x-height, it's no calligraphic at all. Maybe one of the more legibles fonts available, although it demands more leading to achieve this.</p>
      <p>Or maybe you're searching for something different, like <a class="freelinking external" href="http://www.typophile.com/node/67787" rel="nofollow">this project</a>.</p>
