    <p>Hey Guys,<br>
    I need a recommendation for a gorgeous numerals for a 25th Anniv card. The closest I could look into was the numerals from ITC's Bodoni 12 and Clarendon numerals but they just don't feel right with my Caslon's. </p>
    <p>I'm willing to pay for the entire typeface as long as it isn't too bad, but I want the 2 and the 5 to really catch someones eyes (flourishes/swashes perhaps). The numerals 25 is the only thing visible on the front of the card so it needs to hold its own.</p>
    <p>Oh yeah and it has to go with my Caslon's.<br>
    <a href="http://prakashnair.com/ext/25.jpg" title="http://prakashnair.com/ext/25.jpg">http://prakashnair.com/ext/25.jpg</a></p>
    <p>Thanks for the help.</p>
