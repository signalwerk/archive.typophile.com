    html: <p>You need to limit the kerning to something simple, make that work, and then build it up again. Save a copy of your font and delete all of the classes. Then start adding them and testing them, <em>one class at a time</em>, until you understand how to build working kerning classes. Then go back and fix the original font.</p>
