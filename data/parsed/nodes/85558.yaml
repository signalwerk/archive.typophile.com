    <p>Hello everybody,</p>
    <p>I am new to type designing and Fontlab Studio and for a while I have been working on my typeface, and now it is time to try to generate my font and make it work, I have set some kerning classes but I have problem generating my font which would include working kerning. I also get these messages when generating font:</p>
    <p><code><br>
    [WARNING]  Glyph class @FONTnew-600 redefined [/Users/imac/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 24]<br>
    <code><br>
    [NOTE]  Removing duplicate glyph  [/Users/imac/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 76]</code></code></p>
    <p>These "warnings" and "notes" are actually pasted 15 more times but with different number at the end after "fontlab.fea", but didn't want to paste it here since it would be too large and awfull :) If it is important I can paste the whole text.</p>
    <p>I assume that this happent to lot of people but I have tried searching through the internet and through this forum and haven't found a solution and I have a deadline about this since it is my bachelor work so if anyone could help I would really appreciate it very much!</p>
    <p>Thanks in advance</p>
