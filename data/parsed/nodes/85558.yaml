    html: <p>The numbers at the end of the error messages are line numbers, indicating which line of the feature code is causing the error. You can save the code to a text file from the dropdown menu in the OpenType panel, then open in a text editor and see if the referenced line numbers provide any clues to the errors. If your feature code is limited to kerning, you might also try Tools &gt; Kerning Assistance to check for overlaps or other oddities, then update the kern feature.</p>
