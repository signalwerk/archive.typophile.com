      <p>@ charles</p>
      <p>Simplified, the space (or any other character except from the slash) indicates the begin of the fraction in Tal’s feature file (if a figure is following). If there is no other character between two figures in front of a slash, both figures will be substituted by numerators. We are talking about the character, by which the space shall be substituted.</p>
      <p>By the way, the indicator doesn’t have to be a slash. Maybe it is better to substitute a class, that contains all characters except from the figures, the numerators and the slash, by a space.frac. A whole keyword could be substituted instead – 2frac1/2, where frac is the keyword. (But in this case Tal’s code could be probably shortened.)</p>
