    html: |-
      <p>It shouldn't be a Unicode space.<br>
      I name the thin-space glyph used for fractions as "space.frac".</p>
      <p>Integer followed by fractions in the manuscript is typed "number-space-number-slash-number", and the code distinguishes between integers (followed by space) and numerators and denominators (separated by slash).</p>
      <p>So a style sheet can be applied globally to a block of text (recipes, say), and there is no need to laboriously select out each fraction.</p>
      <p>However, after the integers and fractions are sorted out automatically, the space remains, so replacing it with a thin space does the trick. In fact, it is better visually than butting fractions right up to integers, because the sidebearings on the numerator are so small. Of course, one could add positive kerning between integers and numerators, but this code makes that unnecessary.</p>
