      <p>Yes, the thinspace seems to be the wrong character. It must be a space, that is either typographically correct with regard to its width, or that has exactly the same width as the regular space, intended to be manually replaced by a smaller space, or that has a width of zero (with the intention, that the user adds the typographically correct space, if required). If the correct space does not have an Unicode point, the space should be replaced by either a (non-breaking zero) width space or a non-breaking regular space.</p>
      <p>What do the professional typographers say?</p>
