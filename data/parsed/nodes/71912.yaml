      <p>Nick, it doesn't matter what you think best. I'm not being sarcastic, it doesn't mater what I think best, either. What matters is what people do; what I'm reporting is what we see with manuscripts coming from academic publishers. Scholarly book publishing -- which oddly enough, includes a fair number of cookbooks -- is perhaps a small segment of the "manuscripts" out there. I don't know how magazines work, or for that matter, commercial book publishers.</p>
      <p>What I am saying is it is not OK for typographers to say "I don't care how people do it," my way is best. You will be ignored by both authors and editors.</p>
      <p>For anyone, if you handle a lot of manuscripts, I'd advise doing some pre-processing in a text editor (or in InDesign, if your up to the scripting). That way, if you need a space to trip the fraction feature, you put it in. If the space gets in the way, as with our practice, you take it out.</p>
      <p>For some things, the type designer's only recourse, and only obligation, is a readme file that tells people how to use the features available with the fonts.</p>
