    html: |-
      <p>Type designers and typesetters sometimes have a different viewpoint. I see about 300 manuscripts a year. Been that way for about 30 years. The number of ways people type fractions after numbers varies. For manuscripts coming from publishers anyway, we almost never see a space between a number and a fraction. Usually they use a code around the fraction, rarely a hyphen. Sometimes just the general instruction.</p>
      <p>The moral is, any typesetter worth their name (never mind those of us claiming to be compositors) has to look and resolve things. If you want to put in a thin space, fine. </p>
      <p>Just don't count on a word space being in the file.</p>
      <p>The space I put in between a fraction and a full-size number is a kern. Define a class that has all the numerators. Another class that has all the numbers -- lining and oldstyle. Kern the classes. One of the few class kerns I use. If you set the left sidebearing of the numerators about the same, this works fine. As far as that goes, the same (more of less constant left sidebearing) is needed if you use a thinspace. Kern numerators and denominators with each other and with the fraction character. All this takes about an hour. The kern values between the numerators are very good candidates for your kerns with the superscript numbers, by the way. Depends on how you set things up.</p>
      <p>If you want precomposed fractions, Unicode allows for the half and quarters in the Latin Supplement (00A0 range), then in U+2153 through U+215E, there are codepoints for the thirds, fifths, sixths, and eighths.</p>
