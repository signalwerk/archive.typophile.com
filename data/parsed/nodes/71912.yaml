    <p>Dear All,</p>
    <p>I am working desperately to creating correct layout-features to a font.<br>
    Now, I'm working with the 'frac'...fractions.<br>
    Everything goes OK, when I create a tag that contains a frac-ligature as the target:</p>
    <p>feature frac { # Fractions<br>
     # Latin<br>
         sub seven slash eight by seveneighths;<br>
    } frac;</p>
    <p>But I also want to convert things like this: 213/71879 ...and so.</p>
    <p>How do I do? Thanks in advance for your kind help!<br>
    Morten</p>
