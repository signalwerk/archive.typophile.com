      <p>Nick wrote:</p>
      <p><cite>I have been led to believe, by Thomas Phinney and John Hudson primarily, that the original text of a document should remain intact when it is rendered in an OpenType-enabled document. For reasons of searching, and repurposing text.<cite></cite></cite></p>
      <p>Absolutely agreed. There are two main things to watch for:<br>
      1) Having an OpenType substitution that exchanges a glyph that has one Unicode for a glyph that has a different one is Very Bad Form Indeed.<br>
      2) It's a Good Idea to use glyph naming conventions such that glyphs which have a Unicode codepoint are named in ways that reflect it, and glyphs which should "boil down" to a given Unicode codepoint, do so. See <a href="http://www.adobe.com/devnet/opentype/archives/glyph.html" title="http://www.adobe.com/devnet/opentype/archives/glyph.html">http://www.adobe.com/devnet/opentype/archives/glyph.html</a> and especially <a href="http://www.adobe.com/devnet/opentype/archives/glyph.html#6" title="http://www.adobe.com/devnet/opentype/archives/glyph.html#6">http://www.adobe.com/devnet/opentype/archives/glyph.html#6</a> for details.</p>
      <p><cite>In this instance, if one searches for, say, "15 15/16" in a pdf document, one won't find it if the space has been replaced by Unicode thinspace.</cite></p>
      <p>This can happen in at least some routes of PDF creation, yes. It's a violation of the first principle above.</p>
      <p><cite>Furthermore, if one copies the text, and sets it in a font which doesn't support Unicode thinspace, there will be a ".notdef" in the middle of the number.</cite></p>
      <p>True, though it's a weaker objection. After all, that can happen any time one has a character not supported by a given font. In some environments (MS Word, web browsing) one will usually get "fallback" to a font that has the desired character, although that of course will be a different font than the rest of the text. Whether or not that's a problem can vary.</p>
      <p><cite>Thomas, John, did I get that right?</cite></p>
      <p>Indeed you did, old chap!</p>
      <p>Cheers,</p>
      <p>T</p>
