      <p><em>Why do you have abandoned a width of the space.frac just in case of the second font?</em></p>
      <p>As I said, I "eyeball" a lot of things to do with type design, and don't always do them to the same formula. That's my philosophy for keeping my eye sharp and the fonts looking good. It does produce some inconsistencies, but spacing is an expression of taste, not mechanic principle.</p>
      <p><em>...what could happen, if you would use a space with an Unicode point?</em></p>
      <p>I have been led to believe, by Thomas Phinney and John Hudson primarily, that the original text of a document should remain intact when it is rendered in an OpenType-enabled document. For reasons of searching, and repurposing text.</p>
      <p>In this instance, if one searches for, say, "15 15/16" in a pdf document, one won't find it if the space has been replaced by Unicode thinspace. Furthermore, if one copies the text, and sets it in a font which doesn't support Unicode thinspace, there will be a ".notdef" in the middle of the number.</p>
      <p>Thomas, John, did I get that right?</p>
