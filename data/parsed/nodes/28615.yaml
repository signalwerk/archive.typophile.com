      <p>Univers is pronounced "You-knee-vair".<br>
      Eunuverse is pronounced "You-new-verse".</p>
      <p>[posted a little later...]</p>
      <p>Anyone familiar with Mr Barry Deck's work over the past two decades knows that he takes a very ironic approach to both disciplines of type and graphic design, best exemplified by his early student works, Canicopulis Script, Repressed Victorian Roman, Template Gothic, and Arbitrary, the last two of which were published by Emigre in the early days of digital type in 1990.</p>
      <p>"Eunuverse" was designed by Mr Deck, as the text face for "Ray Gun" magazine in 1998/9, when Barry was the art director, after stints by David Carson and Wolverton &amp; Johnston. The name was meant as an inside joke for designers, who would never be allowed to specify such a non-traditional typeface. (Just as they would have a hard time convincing their clients to adopt "Cyberotica", "****", or "Amputee", (aka "Traitor".)</p>
      <p>Many artists over the years have appropriated past works in order to make a point about the nature of art, and the nature of art appreciation, from Andy Warhol to Bansky, and from composers such as Luciano Berio, John Cage, and the pop musician Beck, whose grandfather was the Fluxus artist Al Hansen.</p>
      <p>Not only is Eunuverse not trying to pass itself off as Univers, but it is adamantly shouting that is is not Univers.</p>
