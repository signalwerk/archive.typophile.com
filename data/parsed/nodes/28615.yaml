      <p>Tim Daly:</p>
      <p>As you surely saw at <a href="http://www.uspto.gov/main/trademarks.htm" title="http://www.uspto.gov/main/trademarks.htm">http://www.uspto.gov/main/trademarks.htm</a></p>
      <p>"Times New Roman" is registered for Monotype, and<br>
      "Times Roman" is registered for Linotype</p>
      <p>But in both cases, only the FULL word expression is registered, not the single words. As regards "Roman", the registration at the above link contains the disclaimer:</p>
      <p>"No claim is made to the exclusive right to use "Roman", apart from the mark as shown."</p>
      <p>Generally speaking, any substantive (noun) used to denote a class of commodities (e.g. "Font") and any adjective used to characterize a class of commodities (e.g. "Italic") is excluded from registration as a trademark for THIS GIVEN class of commodities. However such words may be registered as trademarks, if they do NOT denote or characterize a given class of commodities, i.e. if they are used as trademarks for OTHER classes of commodities.</p>
      <p>- For example, the word "Roman" is registered for a specific brand of meal bread by the American Roman Meal Company. This was permitted, because the word "Roman" has nothing to do with bread.</p>
      <p>- For example, the word "Antiqua" is registered for a specific brand of kitchen faucet by the German Hansgrohe AG. This was permitted, because the word "Antiqua" has nothing to do with a faucet.</p>
      <p>In the font business, however, "Roman" (in English-speaking countries) and "Antiqua" (in German-speaking countries) denote a specific class of fonts (i.e. non-italic old-style fonts). Therefore it is not permitted to register the word "Roman" alone or the word "Antiqua" alone as a trademark for a specific font.</p>
