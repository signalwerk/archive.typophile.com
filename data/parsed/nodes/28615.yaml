      <p>In the French-speaking country France, the font "Univers" is pronounced like the French word "univers" (l'univers = le monde, i.e. universe = world). In the late 1950s, when "Univers" was designed, Frutiger was art director of the defunct foundry Deberny &amp; Peignot, and Charles Peignot himself coined the font name "Univers" (see Frutiger's German book "Buch der Schriften", Wiesbaden 2005, page 98. Adrian Frutiger pronounces the font name "Univers" and his own name "Frutiger" in the German way, unless he talks to French-speaking people.)</p>
      <p>In the English-speaking country United States, the font "Univers" is usually pronounced like the English word "universe". In the thread <a href="http://typophile.com/node/28042" title="http://typophile.com/node/28042">http://typophile.com/node/28042</a>, Mr. Mark Simonson states: "I think most American designers pronounce “Univers” the same as “universe” (including me)". Likewise, the font "Eunuverse" is also pronounced like the English word "universe" (compare the first two syllables of "Eunuverse" with the first two syllables of "eunuchoidism").</p>
      <p>Mr. Chester Jenkins's report about Mr. Barry Deck's work is very interesting, and also his remark that "Eunuverse" was meant as an inside joke for designers, but in legal trademark matters, the only decisive question is this: Can the font name "Eunuverse", when uttered orally, be confused with the font name "Universe"? The answer is "yes". Such confusions always arise when the pronunciation of two trademarks is either very similar or identical. For the German Supreme Court, even a very similar pronunciation is sufficient for trademark infringement, see the BGH decision quoted above.</p>
      <p>Mr. Tim Ahrens asks, whether it is fun to piss off people. This make me recollect Linotype's former managing director Bruno Steinert, who was recently dismissed and replaced by the new managing director Frank Wildenberg, who studied mechanical engineering in Barcelona and who knows as much about typography and typefaces as my grandmother knew about mechanical engineering. To judge from the information received from the visitors to my website, Bruno Steinert, during his long career in the font forging industry, seems to have sent off more cease-and-desist letters in typeface trademark matters than royalty statements in typeface design matters. He must have had much fun to piss off people.</p>
