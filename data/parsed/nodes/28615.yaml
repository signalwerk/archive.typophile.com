      <p>The Code of Federal Regulations:  ``The following are examples of works not subject to copyright and applications for registration of such works cannot be entertained: . . .typeface as typeface ' 37 CFR 202.1(e).</p>
      <p> The House of Representatives report that accompanied the new copyright law ( passed in 1976):<br>
       ``The Committee has considered, but chosen to defer, the possibility of protecting the design of typefaces. A 'typeface' can be defined as a set of letters, numbers, or other symbolic characters, whose forms are related by repeating design elements consistently applied in a notational system and are intended to be embodied in articles whose intrinsic utilitarian function is for use in composing text or other cognizable combinations of characters. The Committee does not regard the design of typeface, as thus defined, to be a copyrightable 'pictorial, graphic, or sculptural work' within the meaning of this bill and the application of the dividing line in section 101.'' H. R. Rep. No. 94-1476, 94th Congress, 2d Session at 55 (1976), reprinted in 1978 U.S. Cong. and Admin. News 5659, 5668.</p>
      <p>++++++</p>
      <p>Warning: I'm not a lawyer</p>
