      <p>Terry Biddle:</p>
      <p>&gt; Uli brings up some good points</p>
      <p>Typophile's Yves Peters labels such points as "troll" points :-)</p>
      <p>&gt; Clearly, this is a subject that has gray area— particularly when said publisher carries a typeface with a name similar to a well-known classic. It should also be noted that it is imperceptible to the human ear which typeface is being referred to when spoken. Univers or Eunuverse?</p>
      <p>I do not think that we have a gray area here:</p>
      <p>For "Univers" see <a href="http://www.linotype.com/53226" title="http://www.linotype.com/53226">http://www.linotype.com/53226</a></p>
      <p>For "Eunuverse" see <a href="http://www.vllg.com/Thirstype/Eunuverse" title="http://www.vllg.com/Thirstype/Eunuverse">http://www.vllg.com/Thirstype/Eunuverse</a></p>
      <p>The non-registered trademark "Eunuverse" constitutes a trademark infringement on the following grounds:</p>
      <p>1) Both commodities - Univers and Eunuverse - are sans serif fonts thus belonging to the same class of commodities.</p>
      <p>2) Both trademarks - Univers and Eunuverse - though written differently, are pronounced identically.</p>
      <p>3) The older font "Univers" has priority over the later font "Eunuverse".</p>
      <p>While "Eunuverse" is not registered, "Univers" is a registered trademark in the USA:</p>
      <p>See <a href="http://www.uspto.gov/main/trademarks.htm" title="http://www.uspto.gov/main/trademarks.htm">http://www.uspto.gov/main/trademarks.htm</a></p>
      <p>Search for the registration numbers 1203444 and 1203444 to directly locate the registrations of "Univers".</p>
      <p>In Germany, "Eunuverse" would constitute a trademark infringement on the grounds stated above (for Germans: siehe BGH-Entscheidung vom 14.5.1998, Az. I ZB 9/96, Stichwort "DRAGON").</p>
      <p>In the USA, it appears that "Eunuverse" also constitutes a trademark infringement on the same grounds. See e.g. the article</p>
      <p><a href="http://www.tms.org/pubs/journals/JOM/matters/matters-0212.html" title="http://www.tms.org/pubs/journals/JOM/matters/matters-0212.html">http://www.tms.org/pubs/journals/JOM/matters/matters-0212.html</a></p>
      <p>In this article, we read:</p>
      <p>"Obviously, if the marks are exactly the same in spelling and how they are pronounced, there is a greater chance of likelihood of confusion between the marks. It is important to note that slight misspellings or changes in an established mark will not enable a competitor to use his proposed mark. For example, a beverage manufacturer could not adopt the mark “Koka Kola,” because although this mark is spelled differently from the famous Coca-Cola mark, it is still pronounced the same."</p>
      <p>It goes without saying that Mr. Chester Jenkins of  the Village outfit selected the name "Eunuverse" in order to exploit the fame of the competitor's font "Univers" which is claimed to rank among the ten most often purchased fonts according to the (unverified, unattested) sales ranking published at the Linotype website.</p>
      <p>For those who still wonder or still doubt why the pronuncation of trademarks is essential, it should be noted that a "trademark" covers both the "trade by writing" (e.g. purchase order by typed letter) as well as the "trade by speaking" (e.g. purchase order by telephone).</p>
      <p>For example, the FontShop in California sells both "Univers" and "Eunuverse". Let's assume, there are two telephone calls by purchasers:</p>
      <p>A says: "I want to order the sans serif font "Univers"<br>
      B says: "I want to order the sans serif font "Eunuverse"</p>
      <p>I guess, it is now clear why Mr. Chester Jenkins should not have selected the name "Eunuverse" and that he should drop this illegal trademark as fast as possible for this reason: Linotype (now owned by Monotype) as a big font company engaging a couple of lawyers is far above the small-time league of the Elfring outfit which probably does not have enough money to institute a lawsuit against the Village outfit in the similar "Apex" infringement matter.</p>
    html_clean: |-
