      <p>Sii -<br>
      Darnit, I already had plans for that term, see below. But at least you recognize the value of the stress and rhyme! :)</p>
      <p>Chester -<br>
      The record was more or less straight. 1-4: It was a letter, sent via email. You are the designer and, via your involvement in Village, also the vendor, though I only knew the latter for certain until I researched the font's history. If it was created in 2003 (and I am not loony enough to think otherwise) and you tell me, then you still 'claim' it, even if it is true. :)</p>
      <p>(I am a Mr. Or, at least, a 'he'. Just for the record.)</p>
      <p>I appreciate you contacting me first, rather than here. I tried to leave it ambigous in my post, so that you would not feel coerced into a public debate you did not desire. It just happens that this is the place to find people who deal with this stuff, and I really wanted their feedback. To be clear, I didn't come to complain about you or your actions in any way, only the situation I was in. And no flock of lawyers are gathering, I just mentioned that I was going to talk to a friend so everyone wouldn't tell me to get a lawyer. We just play video games together.</p>
      <p>5. Hmm, I think you are right, "typeface" would be a much better modifier for researching in the future. Or, first that, then with 'font'. I will make use of that in the future, for certain.</p>
      <p>I brought this here, because I am of more than two minds. First, I am inclined to just go with the flow; you asked, my mortgage isn't riding on the issue, you were polite and clear. Second, you may be right, and I will appear as a hack, jerk or otherwise naughty person, that mixes with my novice stature to create a poor reputation quickly. I enjoy type design, and have no interest in being a type troll.</p>
      <p>At this point the only places that I have mentioned it are here, my blog and @ exclamachine.com, and two of those are easy for me to edit. :)</p>
      <p>On the other hand, while I don't want it to be a big deal either, I want to do what is most abstractly correct, and gain a better understanding of what I can do with a name. This <em>perhaps</em> means not acquiescing, if it is not the proper stance to take.</p>
      <p>As I mentioned earlier the makers of the faces Simplex TR (Monotype) or Relflex (Sudtipos) might ask the same of me later. Or demand. And, I might be selling an OpenType fancy version at the time. I also already had plans to add a 4xx 'Perplex'(wavy) 5xx 'Vertex' (double border) and 9xx 'Index' (graduated) versions. I cannot change the names over and over, so must I change them now? Again, all but one of those, could put me at risk of more complaints, while I see other foundries share face names like lovers do spit.</p>
      <p>I meant them to just a little flourish, inspired by the idea of a Toyota MR2 Spyder and the Fiat 850 Spyder; or, The Triumph TR7 Spyder, for that matter.</p>
      <p>I feel trapped, and while that is not your problem, I am trying to deal with it as rapidly as possible to reach a decision to your satisfaction, as well as my own. I am sorry if bringing it here made you uncomfortable, or left you feeling misrepresented. !Exclamachine fonts are designed to portray levity, funkiness and lightheartedness. And rocketships. I want this ambience to affect all things about my fonts, and how I am seen in the community. Please, bear with me.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
