    <p>is probably a subpeona from your Ex, the newly elected District Attorney. This isnt that bad, but it isn't good. <em>Please read all of this, the community's insight is prety important to me.</em></p>
    <p>I went through a personally dictated <a href="http://typophile.com/node/28510" rel="nofollow">naming crisis</a> for my latest free font family. Despite the idea that it might be okay to use an existing name (since the context was so different), it finally didn't sit right with me.</p>
    <p>Then I settled quite happily on the name <a href="http://typophile.com/node/28562" rel="nofollow">!Square Engine</a>. Sassier, more fun, more 'techno'. Each substyle was then assigned a model number, 050, 150, 250 and 350. Finally, I gave each a visual nickname, since #s are a little sterile. They were <strong>Apex, Simplex, Reflex</strong> and <strong>Latex</strong>. I even made humourous bio's for each font on my site. The notices embedded in the fonts themselves mention only !Exclamachine and !Square Engine for copyright or trademarks.</p>
    <p>So, a name might look like this <strong>!Square Engine 350 Latex Bold"</strong>.</p>
    <p>Today I recieved a letter from a vendor that sells a font named the same as one of these substyle nicknames. Politely, they informed me of their font's existence. They claim it was first developed in 2003, and substantially used in the type world. They request I pick another word. They suggest I use Google. I normally use myfonts for name research. This is where it gets interesting.</p>
    <p>When I picked the nicknames, I saw there were fonts by those names already (except for Latex, which is a whole 'nother thing), but I considered the likelyhood of confusing a tertiary (redundant) naming of a !Square Engine variant to be slim at best. I was more worried about getting wrath from the makers of "Square 721" or "Allied Engine".</p>
    <p>So, I just googled the debated term, along with the word font, since it is so common, and found that there was a font freely available in 1994 (no designer/vendor info), and a commercial font from Elfring Soft Fonts, re-released in retail packs in 1994. Then I find two links to the generic term's typographic definition. Further down the page, the results show the font who's creators contacted me.</p>
    <p>Now, really, what do I do? I voice-mailed a lawyer-friend, but I don't think IP is her bag. This is a free font, so my liability is low, but I was planning on releasing a commerical version in the next 6 months. When I find there are pages <a>like this</a>, I find the whole names thing hard to take seriously. If I drop every word that anyone has used in any font anywhere, all I'll be able to call them is !1, !2 (If that!)</p>
