      <p>Hello again.</p>
      <p>First, I would like to point out that the Aachen clone mentioned by "Uli", and trademarked by Elfring is named "Aapex", not "Apex". I'm pretty sure that I saw this typeface in my searching for conflicts with the Apex name, but felt that we were safe because; 1) The words were not the same, and 2) The Aapex font was clearly a rip-off of Aachen, down to the "Aa" in its name.</p>
      <p>As far as who gets to name their fonts what they want to... It's not about large versus small foundries, it's about who was first. If one of the large foundries came along with an "Apex" typeface, I would not roll over for them because they are bigger. We had the name in 2003, when the type family was initially published; we didn't "squat" on the name for a few years.</p>
      <p>I had not threatened Mr Cunningham - and thank you for clearing that up; I felt silly with all of the Mr/Ms stuff - with legal action, but merely pointed out that one of his colleagues - namely me - had already released a typeface named Apex, which had already gained a certain market presence. I asked him to consider another name, since it's always best to avoid confusion in the marketplace. I was relying upon Mr Cunningham's professional courtesy to "do the right thing."</p>
      <p>As Mr Daniels pointed out, a typeface's name is really very important to the marketing and awareness of that typeface, which is why professional type designers and publishers are so concerned with finding a unique, memorable, and appropriate name for their wares.</p>
      <p>I hope that Mr Cunningham will reconsider his use of previously-used names, regardless of trademark status, as he joins the type industry/community.</p>
      <p>With best,<br>
      c</p>
