      <p>Chester Jenkins:</p>
      <p>&gt; First, I would like to point out that the Aachen clone mentioned by “Uli”, and trademarked by Elfring is named “Aapex”, not “Apex”.</p>
      <p>That is correct: A Apex ("peak of A"), (not Apex alone).<br>
      But the same holds true for "ApexSans" (not Apex alone).<br>
      And holds true for "Square Engine Apex" (not Apex alone).</p>
      <p>So "ApexSans" is a trademark infringement concerning the prior Elfring trademark.</p>
      <p>&gt; The Aapex font was clearly a rip-off of Aachen</p>
      <p>I repeat: In trademark matters, it is irrelevant whether "Aapex" and "ApexSans" are "rip-offs". </p>
      <p>You may also label "ApexSans" as a "rip-off". For instance:</p>
      <p>The "A" of "ApexSans" is a "rip-off" of a "A" from<br>
       <a href="http://www.forgers.de/letters/char_aa.pdf" title="http://www.forgers.de/letters/char_aa.pdf">http://www.forgers.de/letters/char_aa.pdf</a></p>
      <p>The "B" of "ApexSans" is a "rip-off" of a "B" from<br>
       <a href="http://www.forgers.de/letters/char_bb.pdf" title="http://www.forgers.de/letters/char_bb.pdf">http://www.forgers.de/letters/char_bb.pdf</a></p>
      <p>etc. etc. (see <a href="http://www.forgers.de/letters" title="http://www.forgers.de/letters">http://www.forgers.de/letters</a> for the other letters)</p>
      <p>But as I said: It is irrelevant here whether "Aapex" and "ApexSans" are "rip-offs".</p>
