      <p>&gt; find the whole names thing hard to take seriously</p>
      <p>Sadly, names are essentially all a designer has to legally protect their work, so have to be taken seriously. Stepping on someone's name will often result in a nastygram from their lawyer, or more often than not, a more friendly email from the owner (which seems to be the case here).</p>
