      <p>Chester Jenkins:</p>
      <p>While doing research in other matters, by pure chance I discovered this:</p>
      <p>A font with the name "Apex" was designed by Gerrit Noordzij thus having font name priority over your much later font "Apex". See "Typography. When Who How", edited by Friedrich Friedl et al., Cologne 1998, page 411.</p>
