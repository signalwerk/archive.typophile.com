      <p>Hello all. Chester from Village here to set the record straight.</p>
      <p>I had indeed sent an email to Ms/Mr Cunningham concerning the weight name of "Apex" which had been assigned to a font from the "!Square Engine" family.</p>
      <p>First, let's clear up a couple of things from the original post.<br>
      1. I wrote to Mr/Ms Cunningham via email to save any embarassment which might result from a public airing of this little matter on Typophile.<br>
      2. I didn't send a letter.<br>
      3. I prefer "designer" to "vendor" in the case of my Apex types.<br>
      4. I don't claim that the Apex Sans type family was published in 2003, it WAS published in 2003.<br>
      5. Not all typefaces available in the universe are listed on MyFonts, so a search of MyFonts is far-from-complete in terms of research. If one googles "Apex + typeface", the first listing is for Apex New on the Village site. (The "Apex" font which comes up in a Google search for "Apex + font" is actually a pirate version of Aachen. The word "font" is an html tag which probably appears on 99% of all web pages, so produces many false returns. "Apex + font" = 774,000 returns versus 24,500 for "Apex + typeface".)</p>
      <p>The multiple-name structure of the "!Square Engine" font-naming scheme seems more than a little confusing to me, but who amongst us hasn't had our moments of levity? I only worry about the confusion that might emerge from this use of so many names, including names of existing typefaces. (The fact that "Apex" is trademarked is both beside the point and also at the heart of the matter.)</p>
      <p>Anyhow, I have no intention of making this into a big deal, if Ms/Mr Cunningham does the same. I'm not going to have my lawyer contact Mr/Ms Cunningham's lawyer; I simply noted, "Hopefully this information will convince you to rename your 'Apex' weight." In my experience, type people are quite logical and they do the right thing if they ever find themselves mistakenly standing on a colleague's toes.</p>
      <p>With very best regards to the Typophile community,<br>
      c</p>
