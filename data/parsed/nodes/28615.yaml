      <p>Miss Tiffany:</p>
      <p>&gt; I think if Village had reserved the name Apex, but had not yet released it, you would have a point. But, because Apex has been available for 3 years now it is a little unfair, just a tad?, to accuse them of having an unfair advantage.</p>
      <p>Just a tad?</p>
      <p>Trademark law is based on the principle of priority. Therefore the Village outfit (or Mr. Chester Jenkins) cannot claim the word "Apex" (by the way, it is a Latin word) as a trademark for the "Village" font "Apex", because the "Village" font "Apex" was published in 2003, whereas the "Elfring" font "Apex" was published many years before the year 2003:</p>
      <p>see <a href="http://www.sanskritweb.de/files/apex.gif" title="http://www.sanskritweb.de/files/apex.gif">http://www.sanskritweb.de/files/apex.gif</a> (dated 3rd July 1996)</p>
      <p>The "Elfring" font "Apex" is "traded" (= sold) ever since, for instance on the Herlitz font collection CD 2002, so that the trademark "Apex" of the "Elfring" font "Apex" is still in use.</p>
      <p>see <a href="http://www.forgers.de/forgers/herlitz.pdf" title="http://www.forgers.de/forgers/herlitz.pdf">http://www.forgers.de/forgers/herlitz.pdf</a> (pages 2, 79)</p>
      <p>see also the Elfring website <a href="http://www.elfring.com" title="http://www.elfring.com">http://www.elfring.com</a></p>
      <p>The statement by Chester Jenkins that the "Elfring" font "Apex" "is actually a pirate version of Aachen", does not have an influence on the trademark law, because in the funny font forging industry, even font forgeries may be trademarked. Examples:</p>
      <p>"Arial" is trademark of a font forgery of "Helvetica".<br>
      "Segoe" is a trademark of a font forgery of "Frutiger".<br>
      "Apex" is a trademark of a font forgery of "Aachen".</p>
      <p>Incidentally, there are many forgeries of the font "Aachen", partly traded under the trademark "Aachen", partly traded under other trademarks. For examples of other "Aachen" forgeries study my website.</p>
      <p>If Mr. Chester Jenkins were allowed to use the trademark "Apex" for the "Village" font "Apex", then also Mr. Choz Cunningham were allowed to used the trademark "Apex" for his font. But due to the priority of the trademark "Apex" originally coined by the font forging outfit "Elfring" for the forgery of the font "Aachen", neither Mr. Chester Jenkins nor Mr. Choz Cunningham are allowed to use the trademark "Apex", irrespective of whether the fonts by Mr. Chester Jenkins and by Mr. Choz Cunningham are forgeries or not.</p>
      <p>De lege ferenda (by a future legislation), the trademark law should disallow the use of trademarks for forgeries of commodities. Yet after the enactment of such a future trademark law, most fonts ("Arial", "Segoe", "Apex" etc. etc.) would be nameless, because thousands and thousands of fonts are forgeries.</p>
