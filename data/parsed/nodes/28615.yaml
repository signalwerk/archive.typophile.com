      <p>Just wanted to send a quick apology to Chester. I think my post sounded a bit sarcastic and I apologize for coming off like a "big meany." :)</p>
      <p>Uli brings up some good points and articulated his point a little better than I may have. The bottom line is for me, if you use a common English word in the name of your font, there might be naming problems later on down the line. And as I illustrated, it seems to be pretty common to walk the line of font naming ambiguity.</p>
      <p>Additionally, before you decide on a naming system you should check trademarks, patents and all that other fun stuff before you settle on names. It will save you trouble in the long run. Imagine if Frutiger gave each width and weight of Univers a different name...it'd get confusing and a bit ridiculous eventually.</p>
      <p>I'm sure both sides had good intentions and I'm glad the issue has been settled. This is a very good thread as it discusses a lot of issues that aren't often talked about in the type "bit-ness." Well, at least to us lay-folk...</p>
