      <p>Thanks for your precious opinions, I will surely incorporate that. Although I'm working with typefaces over 15 years, it's still quite hard for me to come with constructive critique. </p>
      <p>The floating descenders were rather an artist's wish than a typographer's choice. Clearly a mistake as well as the VXYCDH width..., however the biggest issue in sans serif for me is always S, paragraph, question mark, cedilla and &amp; (Et) sign together with numbers. Arabic numbers in roman alphabet seem like from a different planet .o]</p>
