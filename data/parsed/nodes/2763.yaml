  html: <p>As part of my dissertation hand-in, I want to include a picture of some Mrs Eaves Italic Ligatures. fi, gi and gy. <br> <br>I don't own the font so I'm asking if it's possible for somebody to send me a high-res image of these to include in my document. I know maybe it's not allowed, but it's all non-profit educational purposes, and it would save me buying it for three ligatures. <br> <br>While looking for an image to include, i came across this, <a href="http://www.xs4all.nl/~maxb/erotype.html" target="_blank">The Erotics of Type</a> which is quite interesting.. and <a href="http://www.fontfabrik.com/Porno_Q.html" target="_blank">this</a> is very funny.</p>
