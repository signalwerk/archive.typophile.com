      <p>"...the discussion was more focused on delivery mechanisms."</p>
      <p>I don't like this idea. :) </p>
      <p>"... in Tom Phinney’s opinion EOT is on par with PDF embedding in terms of security."</p>
      <p>Fine. But put security out of your mind, and instead, think about how complete a PDF is compared to anything one can compose with EOT on a page. "PDF-style embedding" means not just the font is stuck into the file — it means the font is completely composed, with all that implies, and then the font and all sorts of descriptive info on its use are embedded. And THEN, because PDF is a zoomable technology, no additional composition is required besides the user fitting it into the window.</p>
      <p>Security, EULAs and some parts of Delivery can wait.</p>
      <p>Cheers!</p>
