      <p>That panel certainly needed more time. So did most other panels.</p>
      <p>When I suggested to the panel that using PDF technology can be a good universal response to Apple's implementation of @font-face, my suggestion was a direct reply to Roger Black, who at one point said that we needed something where designing for the web is the same as designing for print. We already have something like that. It's called PDF, and it's been through the wringer for many years to prove itself. Acrobat already has plug-ins for all browsers, enabling them to view PDF within the browsernot to mention that the tech is already standard on iPhones, iPods, and every smart phone. The only remaining issue is loading time. Couldn't that be alleviated if some non-fat version of PDF is implemented?</p>
      <p>Given that PDF has finally become the print standard format after about 20 years of development, it doesn't take much imagination to make the leap. A proven tech, already a standard one one medium, designers (both type and layout) are happy with it, so why not see if it can work for the web too. Wouldn't it be great if building a web page was as easy as exporting a PDF from InDesign now? And PDF already respects font embedding bits, so type designers can be happy.</p>
      <p>Another reason for my suggestion was Apple's stubbornness and inconsideration of the ramifications of their @font-face action. Not only it makes things ridiculously complicated and costly for type designers and users in terms of licensing, but as Erik van Blokland pointed out on the panel, it is also a browser user security breach (triggering the operating system's layout engine, so a font can in fact be maliciously constructed to crash one's system). Apple already supports PDF under its own terms on OSX (the Preview app), so if PDF tech is used for the web as well, it would be a walk in the park for Apple to implement it in Safari. I like EOT and applaud its submission as a standard, but I've been around long enough to know that there isn't enough incentive for Apple to implement it in Safari. Not to mention Firefox.</p>
      <p>Ten years ago, two font embedding techs were proposed. Bitstream's PFR and Microsoft EOT. Netscape went with PFR and IE went with EOT, so they cancelled out each other and both techs went south. Now Apple has gone with @font-face, which is in effect server-based, browser-downloadable TTF/OTF, and Microsoft has submitted EOT for standardization. Déjà vu.</p>
      <p>Who was it that said: "The great thing about standards is you can have so many of them."? And which way will Firefox go if EOT is standardized? Which way will it go if it isn't?</p>
