      Please don't make this another format war!<br>
      A broad EOT support would be great, but support for linking TTF/OTF files also. There is no point in trying to force the browser makers only to go for EOT. We can learn from the music industry and don't have to make the same mistakes. It's about the fonts and the users –&nbsp;not about protection and font piracy. </p>
