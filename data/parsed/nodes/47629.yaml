    html: |-
      <p>Re PDF for web, a clear no. For a simple reason: </p>
      <p>PDF was made for static design, making printing data visible on screen. It's dimensions are fixed, everything on the page is fixed. The only thing you can do is scaling. For anything beyond that, PDF is a dead end.<br>
      html(/css) allowed layout to adapt to the size of screen or window. As non-designed as that may be, it pays tribute to the medium.<br>
      So if anything it would be a mixture of both a html/css website's adaptability and PDF's typographic qualities. Years back I was musing along these lines and thought that it were nice if PDF would support flexibility of layout; my focus then was on print and books printed on demand. But the solution came from the web/UI corner -- Microsoft's WPF is what I have dreamed of. (<a href="http://www.kltf.de/kltf_notes_thanksms.htm" target="_blank">Some remarks here.</a>)</p>
      <p>The interesting thing about WPF is that it serves as common API for almost everything visual, both document description -- static (print) and adaptive (web) alike -- and application UI description. It completely erases previous "hardwired" distinctions like web/print or document/application. By integrating all, it implicitly points out that design is about structure, and a book and a UI have more in common than is obvious at first glance. And it fully supports OT layout features, thus fulfils part of the requirements for high-quality typography.<br>
      In my opinion, Adobe has missed an opportunity in this respect, yet Microsoft does seem to see the value of what they have done -- at least the propaganda machinery is rather silent when it comes to WPF.&nbsp;&nbsp;:)</p>
      <p>As regards the topic of this discussion, WPF does seem to have a mechanism for font embedding but I am not sure how "secure" this is.</p>
      <p>[Added: Maybe a good idea to bring up PDF, WPF, etc in this discussion. Speaking of 'web' as html+ alone is too narrow-minded given what's going on elsewhere.]</p>
