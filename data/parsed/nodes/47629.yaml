      <p><cite>Wouldn’t it be great if building a web page was as easy as exporting a PDF from InDesign now? </cite></p>
      <p>No. PDF is based on static content placed on a fixed layout space ("the page"). A website works completely different. A system for a fixed-size website with support for embedded fonts is already available. It is called Flash. </p>
      <p><cite>Ten years ago, two font embedding techs were proposed. Bitstream’s PFR and Microsoft EOT. Netscape went with PFR and IE went with EOT, so they cancelled out each other and both techs went south.<br>
      </cite></p>
      <p>They didn't cancelled each other out. The web designers would have used both technologies at the same website if they had worked properly. I tried to do websites with EOT and PFR in the 1990s. The results were faulty and plain ugly. Mostly because of the missing subpixel rendering at that time. But that has changed ...</p>
      <p><cite><br>
      Now Apple has gone with @font-face, which is in effect server-based, browser-downloadable TTF/OTF, and Microsoft has submitted EOT for standardization. Déjà vu.</cite></p>
      <p>That's why I said we shouldn't start another format far. It really doesn't help. </p>
      <p>BTW: @font-face and EOT are not different technologies. An EOT font is also loaded with the @font-face declaration. The CSS webfonts module states that @font-face can support TrueDoc-pfr, Embedded Opentype, Type1, TrueType, OpenType, TrueType GX and Speedo intellifont.<br>
      So Apple didn't introduce a new technology with Safari 3.1. It is in the CSS specs forever.</p>
