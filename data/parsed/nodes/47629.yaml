      <p>&gt;He suggested using some of the technology behind PDF as a solution. </p>
      <p>If that was his intention then we did get the wrong end of the stick. Although this suggestion too has issues. Most font vendors understand PDFs, and many allow embedding. Extending PDF to become a delivery mechanism for fonts would need to be co-ordinated with the community, (like EOT was, when document embedding was extended to the Web) and licenses would need to be adjusted. As I recall extending the scope of PDF to include editable forms wasn’t a smooth process with respect to font licensing – and in the end going down this path would lead to a Flash competitor? Maybe opening up Flash as an open standard would be a better way to go? However not really seeing an advantage over EOT.</p>
