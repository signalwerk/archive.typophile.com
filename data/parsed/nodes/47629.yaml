      <p>&gt;the font and all sorts of descriptive info on its use are embedded</p>
      <p>You don't see that as being possible with EOT and CSS?</p>
      <p>Since Adobe bought Macromedia I've been thinking that one day soon I would be able to export complete websites as PDFs from tools like Dreamweaver, InDesign or even Flash. I'd still love to see that happen. But at least publicly I don't think that has even been floated as a goal.</p>
      <p>However there is the immediate thrill of having an open source font standard that is usable by the major browsers via CSS very soon. EOT is the only current candidate and would seem to be able to be implemented with the next CSS release. Nothing else seems to be close. And there doesn't seem to be a reason for the major browsers to not support it — at least from my distant point of view.</p>
      <p>The alternative seems to wait be waiting for Adobe to launch a proprietary solution and get the browsers to implement it. And having a font call from CSS with no defined standard will lead to chaos — fine for the anarchists, but bad for business.</p>
