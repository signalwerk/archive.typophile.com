      <p>I thought Patrick Griffin had an interesting idea that got shot down pretty quickly. He suggested using some of the technology behind PDF as a solution. I think people assumed he was meaning that PDF could become the new HTML, but my impression was that he was suggesting using parts of PDF technology within a browser to display fonts correctly -- not having the whole page be a PDF file. I believe PDF is an open standard now, so it would not mean that Adobe would be responsible for the implementation.</p>
      <p>I'm not a programmer, so I have no idea how exactly this would work, and it may be a moot point now that Safari is allowing font embedding, but it would be interesting if there was some way that when you were creating your web page (I suppose you'd need to use a WYSIWYG editor rather than just writing the raw code), the elements that required specific fonts could be rendered into some sort of on-screen postscript that keeps the text scalable, and copyable, but the fonts themselves would remain hidden behind the PDF technology.</p>
