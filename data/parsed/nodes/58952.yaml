      <p></p><div class="imageWrap"><img src="/files/covermennayakirillitsa061109pdh_4060.png"></div><br>
    <div class="imageWrap"><img src="/files/ModernCyrillic061109pdh_6165.png"></div><p></p>
    <p>The competition is held by <a href="/wiki/ParaType" class="wiki">ParaType</a> with support by the Federal Agency for Press and Mass Communications of Russia. It’s dedicated to the Tercentenary of Russian <a href="/wiki/Civil%252BType" class="wiki-create">Civil Type</a> — Peter the Great’s historic reform of Russian typography (1708–1710).</p>
    <p><a href="/wiki/Cyrillic" class="wiki">Cyrillic</a> typeface projects and completed typefaces created and/or released after January 1, 2006 are eligible.</p>
    <p><strong><a href="http://www.paratype.ru/k2009">Русская версия</a></strong></p>
    <p><a href="http://www.paratype.com/k2009/Press_Release_eng.pdf">Press-release in PDF</a></p>
    <p><a href="http://www.paratype.com/k2009/Entry_Form_eng_f.txt">Entry form in text format</a></p>
    <p>There will be online registration with upload service later on the site.</p>
    <p>For further information, please contact: <a href="mailto:k2009@paratype.com">k2009@paratype.com</a></p>
    <p><strong>The Organizing Committee</strong><br>
    Olga Umpeleva — Secretary<br>
    Sergei Bobryshev<br>
    Emil Yakupov</p>
    <p>ParaType, K2009<br>
    47 Nakhimovsky Prospekt, 19th floor<br>
    117418, Moscow, Russian Federation<br>
    Tel.: +7 495 980 2706<br>
    Fax: +7 495 980 2707</p>
