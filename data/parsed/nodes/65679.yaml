      <p>Thanks CurveDoctor. I knew about the 1000 UPM requirement, but not that FontLab <em>will</em> automatically scale all vertical metrics to 50% when you export Type 1, but just leaves everything else at the original size. This will obviously cause problems, as the original size glyphs won't fit into the halved vertical metrics / BBox. It would be more workable if FontLab tells you a UPM of 2000 isn't supported when you export Type 1, and that it will auto scale everything when you proceed. Now it tells you nothing, and just scale down the vertical metrics but leave the UPM at 2000.</p>
      <p>Now that I know all this, it isn't longer a problem and I just check everything by hand.</p>
      <p>This thread is basically me completely not understanding at all. I should have done some more research before starting it. But perhaps it can be of use to someone else having the same lack of understanding in the future. :)</p>
