      <p>In the most recent Adobe FDK for OpenType, a commandline tool named IS is included. It performs "intelligent scaling". It uses Type 1 hinting information attempting to keep the hinted stems and other elements the same width after the downscaling. </p>
      <p>We plan to integrate Adobe's intelligent scaling into the upcoming versions of our applications. </p>
      <p>Best,<br>
      Adam</p>
