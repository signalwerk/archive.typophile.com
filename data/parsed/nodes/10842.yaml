    html: "<p>&gt; It's gone all quiet in here all of a sudden.   <br>&gt; Any developments on that 'W' David?   <br>&gt;   <br>&gt; Matha.  <br>  <br>Some, yes. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> I like the \"W\" as is it, but I agree  <br>that it might be too unconventional to modern  <br>eyes to be useful in all cases. So, as happens  <br>with so many of my fonts, I'm creating an <br>alternates set. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> I'll have an update showing  <br>new additions, like numerals, punctuation  <br>and ligatures, as well as many of the  <br>alternates that have suggested themselves  <br>so far, posted soon.  <br>  <br>I also took John Baichtal's comments to mean <br>that the bowl of the upper-case \"P\" closes too  <br>close to the stem, so I opened that up slightly.  <br>I've also taken Hrant's advice concerning the  <br>lower-case \"b\", \"k' and \"r\", and opened up the  <br>middle crossbar.  <br>  <br>As for the upper-case \"H\" and \"K\", I'm going to  <br>place the current designs in the alternates set  <br>and try Matha's advice to use extenders  <br>instead of the top bars in the main set.  <br>  <br>John Butler's advice on the lower-case \"g\"  <br>was also taken to heart, although the bowl  <br>problem is largely caused by an optical  <br>illusion due to the lower-case \"f\". I'm  <br>re-examining the \"f\", and I may raise its <br>crossbar off of the baseline.  <br>  <br>Paul: See what you think of the new lower-  <br>case \"b\". Does it need a spur on the lower-  <br>left? I've been trying to avoid that, but I may  <br>have to relent and include it.  <br>  <br>Watch for an image in the next few hours.  <br>  <br>David</p>"
