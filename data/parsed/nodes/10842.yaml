    html: "<p>Thanks for all of the comments! <br> <br>I finally included an alternate upper-case \"W\". <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Here are the latest versions of Seriatim Uncial and Seriatim Uncial Alternate. The Alternate set has Gaelic characters and accenting as well as alternates from the regular set. <br> <br>Matha: Thanks, and I will! <br>Please let me know if I've gotten any of the Gaelic forms incorrect, or if there are any obvious omissions. <br> <br>(Not all of the characters are displayed in these samples, of course. The regular set has full standard accents, and the alternate set has equivalent characters to those found in the Bunchlo Na Nod font, as well as several alternate characters to the regular set.) <br> <br>David <br> <br><img src=\"http://www.typophile.com/forums/messages/29/8482.jpg\" alt=\"SeriatimUncial4\"> <br><img src=\"http://www.typophile.com/forums/messages/29/8483.jpg\" alt=\"SeriatimUncialAlt4\"></p>"
