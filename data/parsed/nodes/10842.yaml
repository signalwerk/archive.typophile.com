    html: <p>I didn't get as much done on this today as I'd hoped, but there's enough to show most of the changes and additions. I still have some of the punctuation and reference characters (such as the section symbol and the pilcrow, et al) to complete, and that pesky alternate upper-case "W" (which will probably be a ligature of two "V"s). <br> <br>Another change is the upper-case "S" and lower-case "s", which are both no longer as squished-looking as they were. They are both based on a circle now, and have essentially been lifted directly out of a yin-yang symbol that has been rotated 45 degrees. <br> <br>More to come. <br> <br>David <br> <br><img src="http://www.typophile.com/forums/messages/29/8389.jpg" alt="SeriatimUncial3"></p>
