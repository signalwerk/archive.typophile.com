    html: "<p>Bravo David. <br> <br>I see you've been paying attention to the purists and included a dotless 'i'. Good man. <br> <br>This has a lot going for it but in my opinion there are a few problems. <br> <br>For the uppercase W, I agree with John: it's pretty illegible. <br> <br>The H and K could probably do with ascenders  <br> <br>The M and N are too wide. <br> <br>For the lowercase, the f,h, m, and w are also a little wide. <br> <br>The ascender on the b is confusing. <br> <br>The descender on the z makes it look like a g. <br> <br>  <br>If you wouldn't mind humouring me a little and setting a bit of Gaelic, I'll critique it all night. Try this: <br> <br><i>Bh</i></p>"
