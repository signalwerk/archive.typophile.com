  html: <p>Apologies for my long absence from the critique forums. Things got very crazy in my world over the last year, but I'm back in the swing of things typographic now. <br> <br>Here's the very first draft of the latest member of the huge-and-growing Seriatim geometric sans family. Meet "Seriatim Uncial." <br> <br>More members of the Seriatim family will be posted to the appropriate forums in the coming days. <br> <br>As always, criticisms are welcome and highly prized.<img src="http://www.typophile.com/forums/messages/29/8065.jpg" alt="Seriatim Uncial"></p>
