    html: <p>Here are some of the initial changes, notably a new upper case "H" and two variants on upper case "Y". <br> <br>I haven't yet decided what to do about upper case "W" as yet. See what you think about the glyph in the text setting below. <br> <br>It's worth noting that the Seriatim family is a geometric sans serif, and Seriatim Uncial is an uncial variation, still within the constraints of geometric sans serif form. To that end, What may seem wide or otherwise out of sorts for a standard uncial font might seem to fit in the context of the geometry of the rest of the Seriatim family (showing in the Sans Serif and Experimental Forums). <br> <br>Numerals, full punctuation, full standard ligatures, etc. are forthcoming, and will be posted as soon as possible. <br> <br>Criticisms are still always welcome, even of my poor maligned upper case "W". <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>David <br> <br><img src="http://www.typophile.com/forums/messages/29/8160.jpg" alt="SeriatimUncial2"> <br><img src="http://www.typophile.com/forums/messages/29/8161.jpg" alt="SeriatimUncialGaelic"> <br><img src="http://www.typophile.com/forums/messages/29/8162.jpg" alt="SeriatimUncialText1"></p>
