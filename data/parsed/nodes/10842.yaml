    html: <p>Hold on a second, I've died and gone to heaven !! <br>This really is incredible stuff, David.  <br>I don't think anyone could fault your Gaelic forms either. Bravo. <br> <br>There is something you might think about, though, maybe for the alternate set, in relation to the long 'r' and 's'. Nowadays, a lot of people often get the 's' and the 'r' mixed up. I'm working on a font with a colleague at the moment and we're trying to distinguish our long 's' and 'r' from each other as much as possible. Giving a curve to the descender on the 's' is one possibility we've come up with. <br> <br>BTW apart from Vincent Morely's work, what are you using for sources?  <br> <br>Matha</p>
