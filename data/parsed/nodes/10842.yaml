    date: 2003-04-15T11:53:00
    date_raw: 15 Apr 2003 — 11:53am
    votes: null
    html: "<p>I apologize for my delay in replying. Between Typophile.com's connection problems and my own connection problems, coupled with client work, it has been difficult to properly reply. <br> <br>First, thank you all very much for your encouragement and helpful critiques. <br> <br>To answer your questions: <br> <br>I referred to Victor Hammer's fonts (American Uncial, Neue Hammer Unziale, etc.). Karlgeorg Hoefer's Omnia provided the inspiration for my controversial upper-case \"W\". <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>The primary reference for my Gaelic glyphs has indeed been Vincent Morely's work. I also made use of the work of Luc Devroye and his complilation of Celtic/Gaelic font web references (<a href=\"http://cgm.cs.mcgill.ca/~luc/celtic.html\" target=\"_blank\">http://cgm.cs.mcgill.ca/~luc/celtic.html</a>). <br> <br>As I have worked on Seriatim Uncial, I have begun to see the usefulness of a Gaelic-only version. Such a font would likely consist of the \"purist\" uncial forms, and a full Gaelic character set. Are there generally accepted character/keyboard assignments for specific characters in a Gaelic font, such as the long \"r\" and long \"s\", et al? <br> <br>Thanks for all the replies! <br> <br>David</p>"
    html_clean: "<p>I apologize for my delay in replying. Between Typophile.com's connection problems and my own connection problems, coupled with client work, it has been difficult to properly reply. <br> <br>First, thank you all very much for your encouragement and helpful critiques. <br> <br>To answer your questions: <br> <br>I referred to Victor Hammer's fonts (American Uncial, Neue Hammer Unziale, etc.). Karlgeorg Hoefer's Omnia provided the inspiration for my controversial upper-case \"W\". <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>The primary reference for my Gaelic glyphs has indeed been Vincent Morely's work. I also made use of the work of Luc Devroye and his complilation of Celtic/Gaelic font web references (<a href=\"http://cgm.cs.mcgill.ca/~luc/celtic.html\" target=\"_blank\" class=\"link-external\">http://cgm.cs.mcgill.ca/~luc/celtic.html</a>). <br> <br>As I have worked on Seriatim Uncial, I have begun to see the usefulness of a Gaelic-only version. Such a font would likely consist of the \"purist\" uncial forms, and a full Gaelic character set. Are there generally accepted character/keyboard assignments for specific characters in a Gaelic font, such as the long \"r\" and long \"s\", et al? <br> <br>Thanks for all the replies! <br> <br>David</p>"
  - id: 68411
    user: 1352
    date: 2003-04-15T12:50:00
    date_raw: 15 Apr 2003 — 12:50pm
    votes: null
    html: "<p>David, <br> <br>I couldn't agree more that a Gaelic-only version would be very useful. Apart from what Vincent Morely is doing, Gaelic typography is very much focused on the past. There is an enormous need for display fonts, screen fonts, fonts for signage, as well as italics, small caps and bold...but everyone seems to be busy digitising old book fonts. Things have gotten so bad that they're using book fonts on street signs.  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/8738.gif\" alt=\"quay\"> <br> <br>There's nothing particulary wrong with the font in itself but why not design something specifically for signage? The same is true of anything used on TG4, the Gaelic television channel, websites, brochures etc. Ironically, you'll find more book fonts used for display purposes than in books. <br> <br>Seriatim Gaelic would be a breath of fresh air. <br> <br>For any info on character/keyboard assignments, Michael Everson is the man: <br><a href=\"http://www.evertype.com/celtscript/celtcode.html\" target=\"_blank\">http://www.evertype.com/celtscript/celtcode.html</a> <br>I disagree with him on several (mostly philosophical) points but when it comes to encoding, he can't be faulted. <br> <br>Matha. <br></p>"
    html_clean: "<p>David, <br> <br>I couldn't agree more that a Gaelic-only version would be very useful. Apart from what Vincent Morely is doing, Gaelic typography is very much focused on the past. There is an enormous need for display fonts, screen fonts, fonts for signage, as well as italics, small caps and bold...but everyone seems to be busy digitising old book fonts. Things have gotten so bad that they're using book fonts on street signs.  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/8738.gif\" alt=\"quay\"> <br> <br>There's nothing particulary wrong with the font in itself but why not design something specifically for signage? The same is true of anything used on TG4, the Gaelic television channel, websites, brochures etc. Ironically, you'll find more book fonts used for display purposes than in books. <br> <br>Seriatim Gaelic would be a breath of fresh air. <br> <br>For any info on character/keyboard assignments, Michael Everson is the man: <br><a href=\"http://www.evertype.com/celtscript/celtcode.html\" target=\"_blank\" class=\"link-external\">http://www.evertype.com/celtscript/celtcode.html</a> <br>I disagree with him on several (mostly philosophical) points but when it comes to encoding, he can't be faulted. <br> <br>Matha. <br></p>"
