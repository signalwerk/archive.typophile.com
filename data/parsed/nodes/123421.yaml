      <p><a href="https://en.wikipedia.org/wiki/Indonesian_rupiah" title="https://en.wikipedia.org/wiki/Indonesian_rupiah">https://en.wikipedia.org/wiki/Indonesian_rupiah</a></p>
      <p>However, although it is a currency <em>symbol</em>, it doesn’t appear to be a <em>glyph</em>, at least in Unicode (<a href="http://unicode.org/charts/PDF/U20A0.pdf" title="http://unicode.org/charts/PDF/U20A0.pdf">http://unicode.org/charts/PDF/U20A0.pdf</a>). It’s just written using two letters.</p>
