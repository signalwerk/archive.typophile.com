  html: |-
    <p>The <a href="http://www.indiantypefoundry.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Indian Type Foundry</a> is pleased to announce <a href="http://www.indiantypefoundry.com/news/tulika-bengali/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tulika</a>, a new text typeface family inspired by traditional Bengali calligraphy. It features distinctive, sinuous shapes and a high contrast between thick and thin strokes. Bengali is one of the most complex Indic scripts, requiring the design of over 700 glyphs for each of Tulika’s 5 styles. Jyotish Sonowal, in-house designer at ITF and native speaker of Assamese, did extensive research while defining the character set and included support for the Assamese, Bengali, Bishnupriya Manipuri, Garo, Kokborok, Meitei, and Mundari languages. Tulika is a set of Unicode fonts suitable for setting books, magazines, newspapers and any other material which can benefit from its five weights and high legibility at small point sizes.</p>
    <p><img src="/sites/default/files/old-images/ITF_Tulika_Bengali_5114.png"></p>
    <p>Satya Rajpurohit<br>
    Indian Type Foundry</p>
