    html: |-
      <p>I'm strictly an amateur, but here are my initial thoughts: I like the basic weight very much. The exclamation point might be given some width at the bottom instead of tapering to a point.</p>
      <p>In both bold weights, the curved portions of the M and N appear too heavy. While they may be mathematically correct, optically they're too dense.</p>
      <p>The extra bold looks like it was produced mechanically. The small gaps in glyphs such as the '3' ,  'K',  'X', ampersand, and dollar sign, as well as the counters in the the B, 6, 8, and 9 appear disproportionately small. I personally prefer a more prominant tail on the Q, but that's just me.</p>
      <p>I certainly like the overall typeface, and like it much better than the previous version! Looking forward to seeing you continue its development.</p>
