    html: |-
      <p>Bowl of P/R could stand to be bigger.</p>
      <p>The A (all variants) seems a little narrow and unbalanced at the apex; I would pull the top-right nodes to the right a bit so that the right stroke has a more consistent slope and weight.</p>
      <p>This may be more a matter of taste, but I'm not sure the sports-swash crossbars really go with the style.</p>
