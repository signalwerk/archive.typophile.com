  html: |-
    <p>Go easy on me folks - this is my first typeface.</p>
    <p>It's based on a Spurred Egyptian I found in an old book. It's not complete yet - still a few glyphs missing - but I think it's finally getting there.</p>
    <p>I've been staring at it so much in the last couple of weeks that I'm loosing my objectivity.</p>
    <p>The first PDF shows what I have so far. The other two are examples of the font in use.</p>
    <p><a class="freelinking external" href="http://www.terremoto.ca/Font/Spurred%20Block%20Standard.pdf" rel="nofollow">http://www.terremoto.ca/Font/Spurred%20Block%20Standard.pdf</a><br>
    <a class="freelinking external" href="http://www.terremoto.ca/Font/Gunpowder%20Can.pdf" rel="nofollow">http://www.terremoto.ca/Font/Gunpowder%20Can.pdf</a><br>
    <a class="freelinking external" href="http://www.terremoto.ca/Font/Map%20of%20the%20Universe.pdf" rel="nofollow">http://www.terremoto.ca/Font/Map%20of%20the%20Universe.pdf</a></p>
    <p>Thanks in advance for any feedback.</p>
    <p>Dan</p>
