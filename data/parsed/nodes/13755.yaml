    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : Herb Lubalin Study Center of Design and Typography</strong></p>
    <p><a href="http://www.cooper.edu/art/lubalin/#" rel="nofollow">The Herb Lubalin Study Center of Design and Typography</a> is a resourceful facility devoted to preserving the history of Graphic Design. The Center, located at the <a href="/wiki/Cooper%20Union" class="freelinking" rel="nofollow">Cooper Union</a> in New York, provides valuable hands-on research for students, design professionals and the general public. In addition, the Center holds exhibitions and publishes materials related to various design collections, including the Herb Lubalin Collection that contains original sketches and designs by <a href="/wiki/Herb%20Lubalin" class="freelinking" rel="nofollow">Herb Lubalin</a>.</p>
