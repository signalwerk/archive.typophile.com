    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12011" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Education</a>&nbsp;: Herb Lubalin Study Center of Design and&nbsp;Typography</strong></p>
    <p><a href="http://www.cooper.edu/art/lubalin/#">The Herb Lubalin Study Center of Design and Typography</a> is a resourceful facility devoted to preserving the history of Graphic Design. The Center, located at the <a href="/node/13564" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cooper Union</a> in New York, provides valuable hands-on research for students, design professionals and the general public. In addition, the Center holds exhibitions and publishes materials related to various design collections, including the Herb Lubalin Collection that contains original sketches and designs by <a href="/node/63182" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Herb Lubalin</a>.</p>
