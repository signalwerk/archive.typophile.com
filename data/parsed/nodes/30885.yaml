    date: 2008-03-31T11:30:00
    date_raw: 31 Mar 2008 — 11:30am
    votes: null
    html: <p>I use LinkedIn for my resume and to generally keep my address book up to date. Facebook I use to keep in touch with people and find out which famous designer is using a bunny on a magazine cover (which absolutely made me smile!). Both are useful. I've started using Plaxo, but wonder if I'm going a bit OTT.</p>
