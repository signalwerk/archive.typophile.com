  - id: 389405
    user: 10069
    date: 2010-01-16T14:47:00
    date_raw: 16 Jan 2010 — 2:47pm
    votes: null
    html: <p>LinkedIn has been useful for me -- I would echo what aluminum said, that it's more about staying in touch with your work-related network, and I could directly relate using it to a couple projects I've had. I could see using this site if you were looking for a job, but it seems too overwhelming for any meaningful networking -- "media" is an enormous pool to swim in, something like Typophile would probably be more useful if you were looking to make type design contacts, for example.</p>
