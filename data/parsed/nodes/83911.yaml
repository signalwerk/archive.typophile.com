  html: |-
    <p>Recently I have built Opentype Mongolian font.<br>
    Mongolian is a vertical script and practically same as Arabic in Opentype sense.<br>
    (Required features are isol, init, medi, fina, calt, rlig)<br>
    Although it works on InDesign, it doesn't on other apps like OpenOffice, which supports Arabic.<br>
    In that case, what you get is a non-connected characters even without positional replacement.<br>
    Also I'm trying to see it work on web browsers but likewise they don't recognise the features mentioned above (typical fi ligatures are functioning), which seems strange because Opentype Arabic fonts are working alright. (Am I actually testing it with those with AAT tables? I don't know.)</p>
    <p>— Safari Loads my local font. Recognises liga, but not kern, onum, smcp, and Mongolian features (but it does for Arabic). It doesn't recognise CSS3 vertical writing mode.<br>
    — Webkit Nightly Build does vertical setting correctly. Other behaviour is quite the same as Safari.<br>
    — Chrome behaves the same as Webkit Nightly Build.<br>
    — Firefox doesn't load my font (should I write the CSS code differently?), however, it applies wider variety of Opentype features than above browsers.<br>
    — Opera sucks.</p>
    <p>I don't think the reason is that those unfunctional apps don't support Mongolian script as InDesign works.</p>
    <p>Can anybody tell me what could be wrong?</p>
