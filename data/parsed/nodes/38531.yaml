      <p>Frankly all ligatures in your logotype looks very unnatural to me. My first instinct would be to work on the harmonious ending stroke of “Zett” and make that into a distinctive logotype while taking a plain approach on “Studio” — maybe same font, but lighter stroke, and no distortion whatsoever.</p>
      <p>The colors need some tweaking, too. Bur first and foremost: Get rid of all gradient, that’s a no-brainer.</p>
