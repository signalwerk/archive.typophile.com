    <p>Hello@all and thanks in advance for your suggestions on my tiny contribution! I’ve just been creating these versions and like to point out some things: personally, i like the latter font most, thus i created some versions concerning kerning and ligatures. #3 + #4 are my favorite shapes, #3 connects visual design + a positive line upwards, #4 points to the (european) DIN size-page with a piece detached, leaving the blue area as the shape of the varnish-free area on folding boxes. lastly, there’s everywhere a negative space in it, depicting the “/”stroke in “Z” (Zett).</p>
    <p>thanks for your forthrightness!</p>
    <p></p><div class="imageWrap"><img src="/files/zettlogo_4081.jpg"></div><p></p>
