      <p>have i already said, that i HATE it when posting disappear before they are posted?<br>
      well, typing again...</p>
      <p>thanks for your comments!<br>
      i made some changes (concentrating on the “3”-series). i got rid of the gradients (they were not intended for the “plain” version). i also tweaked the font a bit, changed the “e” ... finally added the “.com”  reference.<br>
      i am not quite sure about the colour altogether. i try to avoid a too serious/conservative look (like banks or financial service companies). the pepsi-look, as coupdegrace pointed out accurately is also bad, i’d rather it looked a bit “old school”.</p>
      <p>anyway, thanks for your opinion again<br>
      rdnzl</p><div class="imageWrap"><img src="/files/a_3940.jpg"></div><p></p>
