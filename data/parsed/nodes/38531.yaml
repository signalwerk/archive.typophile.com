      <p>I find the italicized logotypes (1, 3a) a bit more pleasing, visually. The only thing I would fix is the ’Z’ to fit the harmonious curvature of the other letters (you don’t have to, not critical). The ligatures connecting the S-t and d-i in the straight ones make it look too tight and close together.</p>
      <p>As for the logo shapes, 1, despite it being first, caught my attention immediately. It says “zing! I have an idea!” the snapping of fingers. I also like 4, but I find it too simple. You should try more variations of 4. I found 3 to be a little pepsi-ish.</p>
