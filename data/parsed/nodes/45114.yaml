    html: <p>Alien Skin makes a plugin for Photoshop called Blow Up that can help you get better results when scaling up photos. At extreme settings, it can look a little weird (curves get flattened out into a series of straight lines, and color gradients near edges can also get flattened out), but it generally does a good job, and it's not too expensive.</p>
