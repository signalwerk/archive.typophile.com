  html: |-
    <p>I am working on a project for a retail space that requires large format photo murals. I have lots of high-res royalty free stock that is suitable but obviously none of it is the size I need. The images I have are 8" x 5" at 300dpi - how big can these go without really looking poorly?</p>
    <p>The highest any site seems to offer is roughly 17" x 11" at 300dpi.</p>
