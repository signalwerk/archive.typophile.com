    html: |-
      <p>Probably wouldn't go with vectorising large detailed imagery!?!?</p>
      <p>The resolution that is needed to look good all depends on how close the viewer will be.<br>
      10-20dpi is for the large bilboardlike banners on top of buildings etc. If you are going to have people close to the subject matter like inside a retail space I probably wouldn't go any lower than 70dpi. </p>
      <p>An alternative solution to vectorising them is to interpolate them at 300dpi in sclae 1:1 and make a halftone bitmap with circles (freq:1 angle:45 for example).<br>
      This will give you an Lichtenstein feel up close but and a true image far away. This could again be vectorised but you will need a pretty powerfull computer and heaps of slices in your image.</p>
    html_clean: |-
