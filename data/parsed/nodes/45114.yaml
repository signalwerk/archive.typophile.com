    html: |-
      <p>There has to be some conventional rules in the billboard industry, yet upon searching I get various answers.<br>
      I worked in grand format printing for a while, and we had no inhouse set of rules to hand out to customers because most of them were just not willing to cooperate or technically savvy enough ( makes you wonder ... ).</p>
      <p>A lot of the old rules for billboard are based on the idea that screens are going to be used, but with digital printing, usage of pixels, the conception has to be seen from a different angle.<br>
      15 dpi far viewing, 72+ dpi close viewing.</p>
      <p>Personally whenever I had to make some designing with images, depending on available files etc, I aimed for a 72~150 dpi final output resolution. If the supplied file didn't fit from a size or resolution perspective ( which they NEVER do ) I would do upscaling using Genuine Fractals.<br>
      This does involve using some pricey software but the output is simply amazing.<br>
      In one case I ran a series of 4x3meter banners which were exclusively pictures and the customer supplied files were .....240 dpi ... 100ko, 500ko and the likes ..... 10x20cm etc .... pure rubbish files which I thankfully could use because of said software.</p>
      <p>It's tricky being in situations like this. Best of luck.</p>
