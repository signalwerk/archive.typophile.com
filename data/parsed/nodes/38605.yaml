      <p>I recently compiled a list of humanist slab serifs, the category into I would put Soho except that I see it as more cold and mechanical (“modern”?). Here goes (all fonts available on MyFonts.com unless otherwise listed):</p>
      <p>Silica (Stonetypefoundry.com)<br>
      PMN Caecilia<br>
      Enclave (Terminaldesign.com)<br>
      Chaparral<br>
      TheSerif (Lucasfonts.com)<br>
      ITC Officina Serif<br>
      Amasis<br>
      FF Olsen<br>
      Placebo Serif<br>
      Aptifer Slab</p>
      <p>EDIT: And how could I have forgotten Stag from Vllg.com?</p>
