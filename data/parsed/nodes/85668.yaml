    html: <p>Well, it's the "proper" one that I don't think is very good (sorry, Joe, if you're reading this). There's certainly a subjective element to inventing an italic for a face that never had one, and I'm not sure how I would do it. But he did some things in it that look like they were borrowed from his other faces like Forever that I don't think fit Arrow's look look and feel. (Oblique doesn't do it, either.)</p>
