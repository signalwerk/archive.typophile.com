    html: <p>Thanks! My client is looking for something with small serifs, but right now she is wanting me to use Dream Orphans. As I refuse to use a typeface that only has serifs on one of the glyphs, I wanted to find a good alternative. Although, now that I am looking at Arrow, I completely agree. Any other good alternatives?</p>
