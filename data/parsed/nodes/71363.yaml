    html: |-
      <p>The typographic conventions that evolved for small cap usage did so long ago. At that time, text was serifed, small x-height, had no kerning, and capitals were considerably heavier, in stem weight, than lower case. Even so, small capitals were often further distinguished by being letterspaced.</p>
      <p>Therefore, small caps are inherently problematic for almost all sans face text usage, especially for short acronyms.</p>
      <p>That is why, if one is intent on using sans small caps in running text, one should consider faces which have small x-heights and small caps that are markedly taller than x-height.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/gothic_4323.png"></div><p></p>
