    date: 2010-06-15T05:28:00
    date_raw: 15.Jun.2010 5.28am
    votes: null
    html: "<p>Re: caps use... I see this so often in the interaction between our typesetters and authors. The author submits a manuscript using just initials (say, LCD in your example above). The setters send out a proof, with a query next to it, asking “please spell out ‘LCD’” (OK, probably not a good example ’cause everybody knows what that stands for, but it’s only a f’rinstance). The author answers “Liquid Crystal Display”, using initial caps almost without thinking, because the caps of the acronym are in mind. And then the corrected proof ends up saying “Liquid Crystal Display (LCD)”. In most cases, if I spot it, I get rid of those initial caps!</p>"
    html_clean: "<p>Re: caps use... I see this so often in the interaction between our typesetters and authors. The author submits a manuscript using just initials (say, LCD in your example above). The setters send out a proof, with a query next to it, asking “please spell out ‘LCD’” (OK, probably not a good example ’cause everybody knows what that stands for, but it’s only a f’rinstance). The author answers “Liquid Crystal Display”, using initial caps almost without thinking, because the caps of the acronym are in mind. And then the corrected proof ends up saying “Liquid Crystal Display (LCD)”. In most cases, if I spot it, I get rid of those initial caps!</p>"
