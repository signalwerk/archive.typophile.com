    <p>Hello all!</p>
    <p>I just finished my very first font and I'd love to hear you thoughts.<br>
    It's called Cliquot; It's a "fat" slab serif meant for magazine text in Spanish and is inspired by Caecilia and Chaparral. It was the final project in my Type Design Class and I'm quite proud of it.</p>
    <p>Here's the complete character set:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Especimen-02_6317.png"></div><br>
    And attached is a PDF specimen featuring a fragment of Julio Cortazar's "Rayuela"<p></p>
    <p>Many thanks,<br>
    Ro.</p>
