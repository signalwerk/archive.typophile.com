    <p>There is this site that I go onto every once in awhile.  Its called Creativehotlist.com.  There are people such as graphic designers, photographers, illustrators and much more who put their portfolios on the site.  I always looks for companies who do type design work, but their not easy to come by.  It would be great to see peoples work who come on this website, on the creativehotlist.com website.  This site is a great site to promote your work.  Please let me know what you think of it. </p>
