    html: |-
      <p>For me, it would be the typeface combinations supported well by TeX. There's good math/symbol support based on Utopia and on Minion, and those are <em>my</em> current favorites as an individual typesetting technical papers. (The four basic weights of Utopia have been made freely available by Adobe, but you'd have to purchase the basic Minion fonts.)  This <a class="freelinking external" href="http://www.tug.org/texmf-dist/doc/fonts/free-math-font-survey/survey.html" rel="nofollow">survey of free math fonts</a> can give some idea of what's freely available with TeX, but some of those packages may not quite live up to professional standards in all contexts.</p>
      <p>I've seen many math texts set in Computer Modern and in Times (off the top of my head).  Perhaps also Minion.  No others stand out in my memory. I know that before the current generation of open-source math font support, there was commercial support for Times, Palatino, Charter, Helvetica, and Baskerville through <a class="freelinking external" href="http://www.micropress-inc.com/fonts.htm" rel="nofollow">Micropress</a>, and I've wondered if that's what some mathematical publishers have used, but I don't really know. Back when there were fewer open-source offerings, I had always wanted to purchase one of those packages, but didn't have the funds as a graduate student.</p>
      <p>st</p>
