    html: |-
      <p>Computer Modern is considered to look funny, and scientists are a conservative bunch. Modern No. 7 used to be very common, because that's what Monotype offered with mathematical symbols - and then they offered four-line mathematics for Times Roman.</p>
      <p>While there are now other faces which have had mathematical symbols provided for them, so that a choice is possible - from the American Mathematical Society, from Microsoft, and so on, as scientific publishing is utilitarian rather than decorative, font choice will tend towards the pedestrian. Baskerville, Caledonia, Century Expanded... dull stuff like that.</p>
      <p>Of course, before desktop publishing and laser printing, there were scientific publications banged out on Varitypers (yes, the metal shoe kind) and IBM Executive typewriters, for reasons of speed as well as economy.</p>
