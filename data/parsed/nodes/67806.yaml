    html: <p>The Scotch Modern style has long been used, because it has enough shape (with the furling of its serifs), and space (with its hairlines) to accommodate a huge number of different character shapes, disambiguously. For instance, italic "a" and Greek "alpha" are quite distinct. And when a number of characters are close together at different heights, in mathematical formulae, the serifs don't accidentally merge, because the "pot-hooks" turn back on the glyph.</p>
