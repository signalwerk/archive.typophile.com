    html: "<p> Stephen: <br> <br>Nice catch. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> I served as the first art director of \"Venceremos,\" which is indeed still being published as a quarterly tabloid directed at the \"Latina/o &amp; Chicana/o\" community here in Salt Lake City. <br> <br>I was told by its editors that \"Venceremos\" is a spanish phrase that translates roughly as, \"We shall overcome.\" It struck me as a great name for a font, although the publication has yet to utilize it. ;) <br> <br>That looks like good advice on the uc \"R\", too. I'll play with it &amp; post the developments. <br> <br>David Thometz </p>"
