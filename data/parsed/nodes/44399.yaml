    <p>Hello!</p>
    <p>I have created quite a conceptual typeface that basically made up of scanned images.  </p>
    <p>What would be the best way (if there is a way) of making it an actual functional typeface.  </p>
    <p>Is there a way in FontLab of assigning each letter a .jpg?</p>
    <p>Any help would be greatly appreciated!</p>
    <p>Thanks,<br>
    v</p>
