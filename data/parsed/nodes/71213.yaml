  html: |-
    <p>I was searching for references for good forum designs online and In terms of interface design, Typophile seems to be the best and most streamlined, letting the discussions take center stage. Most of the forums seem to be use stock themes from Vbulletin/phpBB and end up looking cluttered.Forums using bbpress look neat but all I want to ask is this: Is Typophile the best designed forum? and why aren't there more well designed forums out there?</p>
    <p>btw it would be really really helpful if you can point me to other well designed forums online. I've been searching for quite some time now and haven't found anything worth mentioning.Thank you, hope my questions aren't out of place here.</p>
