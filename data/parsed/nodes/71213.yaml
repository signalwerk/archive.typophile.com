      <p>I regularly visit <a class="freelinking external" href="http://www.australianinfront.com.au/forum " rel="nofollow"> Australian in Front</a> which has – just recently – been rebuilt from scratch. Looking at it now I would say the line length is a bit long, but on the whole it is well designed. </p>
