    <p>i’ve made some .ttf fonts with the excellent FontCreator, on a PC, and i think i’ve got the measure of VOLT, but a friend trying to install the resulting files on his shiny new Mac is getting an ’opentype data missing’ warning, whether they’re .ttf, or saved-as .otf ...  Something’s evidently gone wrong (whether or not the warning indicates a genuine serious problem)</p>
    <p>i’m strongly fearing that i should have bought FontLab... evidently VOLT doesn’t restructure .ttf files (???). I tried Crossfont on them, but it produced a .dfont file..... that didn’t work either.</p>
    <p>am i missing one link here or a whole chain of them? i peeked at the adobe font kit, but i’m no way clever enough to grapple with it.... i can’t stretch to another font-making product... can anyone advise? is there any lightweight hand coding that i could do to complete the files?</p>
