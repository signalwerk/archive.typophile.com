  html: <p>Hi All! <br> <br>This is an internal project to redesign the identity of the design company I work for. <br> <br><img src="http://www.typophile.com/forums/messages/29/24775.gif" alt=""> <br> <br>I've decided to go with a very simple text treatment  and Clarendon Light seems very appropriate for the word as well as the target market. <br> <br>I've tried to slightly modify the type face in the second and third renditions but I'm always a little nervous about tampering with something like that. <br> <br>Anyway, please have at it! Let me know if what I've done works or if anyone has any other suggestions. I would be happy to hear them. <br> <br>Cheers!</p>
  html_clean: <p>Hi All! <br> <br>This is an internal project to redesign the identity of the design company I work for. <br> <br><img src="http://www.typophile.com/forums/messages/29/24775.gif" alt=""> <br> <br>I've decided to go with a very simple text treatment  and Clarendon Light seems very appropriate for the word as well as the target market. <br> <br>I've tried to slightly modify the type face in the second and third renditions but I'm always a little nervous about tampering with something like that. <br> <br>Anyway, please have at it! Let me know if what I've done works or if anyone has any other suggestions. I would be happy to hear them. <br> <br>Cheers!</p>
