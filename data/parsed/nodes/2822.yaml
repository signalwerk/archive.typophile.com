    html: "<p>RE: \"Clarendon Light seems appropriate for the word as well as the target market\" <br> <br>As you have stated, I think your type selection is appropriate for the word, but I am partial to Clarendon, having used it for my own logotype: <br><img src=\"http://www.typophile.com/forums/messages/29/24782.jpg\" alt=\"CreativeSqueeze\"> <br> <br>What is the target market? <br> <br>The \"a\" in version 3 is a nice form, but I don't see how it relates to the rest of the type. If you pursued that letterform, you'd have to work the other letters also. It'll take some work, but I think you can make some nice, unique logotype. <br> <br>Aloha! <br>Scott</p>"
    html_clean: "<p>RE: \"Clarendon Light seems appropriate for the word as well as the target market\" <br> <br>As you have stated, I think your type selection is appropriate for the word, but I am partial to Clarendon, having used it for my own logotype: <br><img src=\"http://www.typophile.com/forums/messages/29/24782.jpg\" alt=\"CreativeSqueeze\"> <br> <br>What is the target market? <br> <br>The \"a\" in version 3 is a nice form, but I don't see how it relates to the rest of the type. If you pursued that letterform, you'd have to work the other letters also. It'll take some work, but I think you can make some nice, unique logotype. <br> <br>Aloha! <br>Scott</p>"
