    html: <p>I was typing while others were posting. <br> <br>I like that "g" idea. I even like that "g-r" ligature. The "g-r" might even serve well as an element to carry through other promo pieces. <br> <br>graphic design <br>make the grade <br>corporate grammar <br>communicate with gravity <br>the greenroom (instead of the war room) <br>groovy</p>
