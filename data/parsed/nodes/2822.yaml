    html: "<p>Tinkering: I think it's a good idea if it's subtle. Like not the middle one, more like the bottom one, but only in one place. Try doing the \"g\" - maybe make a monocular form. <br> <br>Spacing: close up the \"gra\" and \"at\". <br> <br>BTW, I would use a darker red, like vermillion. <br> <br>hhp <br></p>"
