    html: |-
      <p>Prehistory is kind of a tough nut. By definition, anything prehistoric predates written records, and so predates any identifiable script. Ignoring this minor detail, one might choose something on the cusp, like cuneiforms, but that choice is historically incorrect and at least a tad intellectually dishonest. So, if you <em>really</em> want to be prehistoric, you might devise rebuses based on cave paintings: <em>that</em> would be stylistically and factually accurate.</p>
      <p>And, FWIW: the Modern Age is dead. We're all Postmodern now, hurling headlong into the Future…</p>
