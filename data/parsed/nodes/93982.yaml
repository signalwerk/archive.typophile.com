    html: <p>IMO, both handwriting and script would be poor choices for Prehistory. What we normally identify as the initial forays into writing—cuneiforms and hieroglyphics—were rigidly formal and, initially, also limited in their use to an educated elite class, whether administrative or executive. Scripts tend to reflect a democratization of the process. IMO…</p>
