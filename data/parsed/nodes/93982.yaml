    <p>Hi there,<br>
    I am starting to work on a new project and I would like to collect some advices and opinions.</p>
    <p>The project tells the story of the course of human history from the prehistoric to the modern age.<br>
    It's a collection of visual facts divided in 4 era:</p>
    <p>1- Prehistory<br>
    2- Civilization<br>
    3- Middle Ages<br>
    4- Modern Age</p>
    <p>I am designing a visual identity for each section, so that design will evoke some sort of evolution.<br>
    Is there a typeface - or a lettering style that you would use for each era?</p>
    <p>Any thoughts or tips are very much appreciated.</p>
    <p>Thank you</p>
