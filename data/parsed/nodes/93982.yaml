    html: |-
      <p>Thanks everybody for your contributions, much appreciated. </p>
      <p>Sko - yes, it's just for main titles. For body copy I will use the same font across the 4 sections.<br>
      Section 4, "Modern Age", describes the historical timeline after the Middle Ages, including also the contemporary history and historic events that are immediately relevant to the present time.</p>
      <p>I am still exploring but so far I am trying to adopt a different style per each section:</p>
      <p>1- Prehistory:  Handwriting<br>
      2- Civilization: Calligraphy<br>
      3- Middle Ages: Serif<br>
      4- Modern Age: San Serif</p>
      <p>/or</p>
      <p>1- Prehistory:  Script<br>
      2- Civilization: Slab serif (or Egyptian)<br>
      3- Middle Ages: Blackletter (Based on Gothic type and late mediaeval calligraphy)<br>
      4- Modern Age: Serif</p>
      <p>any opinions?</p>
      <p>Cheers</p>
