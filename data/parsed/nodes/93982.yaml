      <p>If Modern is post Middle ages, I would personally choose a serif (something like a Caslon perhaps, which is bang in the middle of the eras the section represents).</p>
      <p>Egyptians are rather 1800s rather than the ancients. What do you mean by Calligraphy? If it's something like a Chancery script I wouldn't put it with ancients either. Trajan says 'Ancient Rome' though if there are any suitable roman rustic style lettering might be more interesting?</p>
