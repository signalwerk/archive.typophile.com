  html: |-
    <p>Hello,<br>
    I'm quite happy with what I achieved today, so I take liberty to post a work-in-progress (hope this is the right place, and you won't mind).<br>
    I don't know, I'd call it an 'egyptian', maybe bold?<br>
    I like the shape of 'q b d', which reminds me of a 'serif din'; and 'a' is no bad either. I wonder if I could better match the 'e o c' with the general style. Maybe force the uprightness of the p on the 'e o c' letters?<br>
    Of course, no metrics or kerning whatsoever.<br>
    Any suggestion welcome. </p>
    <p>thank you very much<br>
    m.</p>
