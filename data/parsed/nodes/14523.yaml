    html: <p>I think this is akin to what ChrisL said, but the bowls on b q p d, as well as the shoulders on h and u, seem to have a 'bump' in the curve. Almost a corner, in fact. Take a look at what Peter Karow called the <a href="http://briem.ismennt.is/2/2.3.2a/2.3.2.06.illusion.htm" rel="nofollow">'bone effect'</a> (2/3 down the page).</p>
