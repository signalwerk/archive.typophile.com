    <p>Boss: So, how are those layouts coming? (walks up behind, and stands uncomfortably close)</p>
    <p>Designer: I am almost ready to send these to the client for review.  </p>
    <p>Boss: (leans in veryvery close) Hmm, I don't know about this.  I'm not sure I like this type.  </p>
    <p>Designer: Oh? (sigh) What don't you like about it?</p>
    <p>Boss: You designers are always using this kind of type with the pokey parts on them...</p>
    <p>Designer: Um, you mean serifs?</p>
    <p>Boss: Yeah, whatever.  I don't like type with those things on them.  Can't you use something more funky or splashy?</p>
    <p>Designer: Well...</p>
    <p>Boss: I don't want to see type with those things on them anymore. Show me something else before you leave.  Also, I think you should take *&amp;^%$ job home with you and show me 3 versions in the morning.</p>
    <p>Designer sighs heavily and looks at the clock: 4:45 (shop supposedly closes at 5)</p>
    <p>Oh bother.</p>
