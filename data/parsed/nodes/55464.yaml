      <p>Oh no, 4:45 is definitely not the "hard yards".  I am (past 12est) still up on those "three versions", and for me this is an early evening (as in i might get 4 hours).  I am the only person in the shop who takes work home, and often I do so more than 3 nights a week.</p>
      <p>Until I started there, they were still using Quark 6.5, and CS for retouching and layout.  Additionally, they were shooting images (for hi-res) in jpg.  I have done my best to bring them up to date, and go on press with every print job I run.  Even still, mistakes happen.  I have yet to figure out how to prepare for the owner randomly realizing that the 300+ pg book he is supposed to run the next day is too large to fit economically on the paper he bought; subsequently giving me 2 hours to shrink the whole thing by .25 on one side.  This is of course not to mention the times he gets angry at himself (the source of most of the dysfunction), and throws the laser printer or the postal scale.</p>
      <p>I will continue to work hard, and push myself, because that's what I do.  The part that stung me this afternoon was that after all i am expected to do (retouching, concept, layout, illustration, copy writing, etc), my retarded boss gets indignant about a "pokey thing".  As if to say the sum total of my knowledge doesn't prepare me to be a designer simply because i chose a serif.  Not that he can even <em>say</em> serif.</p>
      <p>I know that all of this will make me better, I just don't want to be colored by the mistakes i try so hard to prevent.  I don't want to get to the place where I don't care anymore.</p>
      <p>@sii &amp; James: I sure hope that's how it ends up!</p>
