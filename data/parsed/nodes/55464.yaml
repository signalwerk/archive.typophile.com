    html: |-
      <p>I think the hard part early on for Designers working within Companies is learning to let go. If it's your own business that fine to strive to do the best and stop when you are happy with the work.</p>
      <p>I've had clients and bosses stand over me as I've worked and nearly direct me with every node placement, only for them to say they love the crap they directed me in doing.<br>
      In times like this I couldn't approach it from a French Chef's point of view and take the work to heart and start jumping up and down that the work should be better. I just had to let go and keep the client and boss happy.</p>
      <p>All Designers need to learn to let go of their preciousness at times, and pick when to stand and fight for good design.</p>
      <p>I've always found that if explain the problems early or the ugliness of certain decisions you can talk some bosses or clients around. That comes with experience.</p>
      <p>One thing you will never get around, are blind clients and bosses who want to see the mistake or bad decision before you make it. Some people have no vision or imagination and don't trust yours.<br>
      Numerous times I've told a client or boss that a certain look or graphic decision, or even production decision, won't work, only to have to show them on screen or through proofs. Now that's a waste of time.</p>
      <p>But you can always be smart, and direct or coerce a client or boss without them even knowing it!! Set that as your plan early, do error free work, tell them things they want to hear, explain your designs and decisions...and you've got them by the nether regions!!<br>
      And that's where your true power lies.</p>
      <p>Good Luck going forward<br>
      <em>tearsforsappho<em></em></em></p>
