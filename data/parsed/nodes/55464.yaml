      <p>I suppose this is a good thread for stupid moments in design. The other day I was talking to one of the MDs and she told me she hated green. I pulled out a dollar bill and said "Really?". She laughed. I am in a position to do such things, being an AD and there for many, many years.</p>
      <p>I have been told by various higher ups that they hate green (3 different people), red, so far they don't hate blue. Good for that or the entire spectrum would be shot.</p>
      <p>There's an entire board dedicated to stupid moments in design, sorry but I have forgotten the name. My favorite story on there was a guy who worked on a piece all day, had his boss walk in near the end of the day, look at it for about 10 seconds and say "My wife hates yellow" and walk out of the room.</p>
      <p>This is indeed a dirty business - I have fixed every bodily part known to man, been told that "She looks like a dude" by a woman, to which I replied that every woman has a Mons Venus, had to put ™ on the obviously trademarkable phrase "One Night Only", man I could go on and on.</p>
      <p>One more - I am working on a project with a massive legalese disclaimer at the bottom. It HAS to be there. I inserted it in a small ad at 2.7 pts (I was generous enough to use auto leading). Not to mention it was reversed - needless to say it was a series of small white dots. Ridiculous.</p>
      <p>What they can't ever take from me is the process. The moments I am involved, exploring, curious. That is where my toughness comes from, the knowledge that what I do is mysterious and most of the people peeing on my pieces have no idea what it is to lose oneself in a process of discovery.</p>
      <p>Sic Transit Gloria Mundi</p>
      <p>pbc</p>
      <p>My mind is subject to change without notice.</p>
