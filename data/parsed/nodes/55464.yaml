    html: <p>This is going to happen a lot when you're working for someone else (boss, client, etc). It's just going to. The best thing you can do is learn from it. When someone frequently makes requests like this (assuming it's more an uninformed/aesthetic complaint) it can help a lot to do some research/education. Pull some examples of things you think are designed well but are someone relevant to the project. Pull some examples of similar things and compare what your boss wants to it.</p>
