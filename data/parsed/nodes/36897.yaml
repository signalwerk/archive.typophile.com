    html: |-
      <p>Use a medium (or demi) style with a pronounced x-height. Preferably a typeface that withstands some condensing (around 90%) — that way you will be able to use a slightly larger typesize, improving legibility.</p>
      <p>Although sans typefaces are considered to be more legible, this is not supported by research, so feel free to use a nice serif… (maybe one by my compatriot Gerard Unger? <a href="http://www.gerardunger.com/fontstore/store-capitolium.html">http://www.gerardunger.com/fontstore/store-capitolium.html</a> ).</p>
      <p>___<br>
      Bert Vanderveen BNO</p>
