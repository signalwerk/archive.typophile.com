    html: |-
      <p>Wow, thanks guys this is very exciting. Who ever said don’t sweat the small stuff didn’t do back labels!</p>
      <p>I would like to have a variety of fonts that I can use for small print </p>
      <p>The Freight Micro seems so unique with it’s serifs. Franklin Gothic is good and I use it but I = forget about it thanks for reminding me, I haven’t seen it small but it might be limited in it's usefulness. I am still wondering what people think of that knock out series B. Bell centennial looks like a good font might be really useful. Lafomica.de has an ant running around on the page, a note that says just married  and I have no clue where the fonts are. Capitolium is great. So much to add to my wish list.</p>
      <p>I see a real use for a design reference book showing small type layouts. Cycles is nice but I wonder if the Arepo would hold up in 8 points.</p>
      <p>Thanks!</p>
