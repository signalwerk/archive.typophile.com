  html: |-
    <p>I am looking for fonts which read well in small sizes. When I do back labels I tend to use universe or helvetica for the mandatory copy and a condensed san serif or serif for the story. Nothing ever goes above 10 points. My back labels stink. I am so busy I don't have time to do the well but I'd like to improve them. Maybe set up some templates with great small type.</p>
    <p>Any thoughts? Also any books on the fine print or setting small copy. I's an odd topic I know but maybe someone tackled it.</p>
