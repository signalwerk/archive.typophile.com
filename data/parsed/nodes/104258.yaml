    html: |-
      <p><em>enabling users to shortcut to the black star</em></p>
      <p>But they're not really shortcutting to the black star, if what they want in their text string is the black star character, not just the black star glyph in their display with this one particular font. With your method, what they get in the text string is **, and that's what they'll get if they copy and paste the text, change the font, etc.. I dislike this sort of thing because your resulting display is misleading: the user thinks there is a black star in the text, but in fact there isn't. Also, what if someone chooses your font to display some text in which there is a double-asterisk sequence, e.g. as part of a footnote system? It will display incorrectly as a black star.</p>
      <p>As a general rule, don't try to solve character input issues at the glyph processing level.</p>
