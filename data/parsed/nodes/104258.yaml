    html: <p>This is a bad idea. The black star <em>character</em> ★ has it's own Unicode codepoint, and should be encoded as that, not as **. The two-character string ** does not mean the same thing as ★. This is why we have a character/glyph distinction, so that semantics can be encoded at the plain text level and not left to the vicissitudes of glyph processing.</p>
