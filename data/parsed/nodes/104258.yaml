      <p>WISIWIG stands for  What You See Is What You Get and applies to Word, TextEdit, Pages, InDesign and those editors that show you on the screen what you get on the printout. If you send an InDesign file using a font that the receiver does not have installed, I think he will see  squares (undefined characters) for the missing font; it is then clear there is a problem, and it is probably clear what measure to take. In non professional applications, a fallback font is used instead; the same holds for Powerpoint. I have seen nice Powerpoint presentations that look really bad when you don't have the fonts used by the designer to view them.</p>
      <p>Added: And the receiver is most of the time unaware that what he sees does not look like intended.</p>
