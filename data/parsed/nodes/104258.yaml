    <p>Hi, I'm having trouble trying to create a ligature using  Unicode character codes, up to this point I haven't tried to use a Unicode value so I have no Idea if I am going about it the right way.</p>
    <p>The ligature in question is an asterisk and another asterisk being replaced by a black star (** = ★)</p>
    <p>I've tried the full word, the utf-8 value for it and Unicode U+ but nothing seems to work. I've had a look around and cant seem to find what is wrong.</p>
    <p>The problems seem to lie with the '+', (Error came up with = 'invalid token (text was "+")'). But that's the only clue I have.</p>
    <p><code><br>
    languagesystem latn dflt;</code></p>
    <p>feature dlig { # Discretionary Ligatures<br>
     # Latin<br>
        sub t o by t_o;<br>
        sub U+002A U+002A by U+2605;  #this is the problem<br>
        sub parenleft parenright by underscore;<br>
    } dlig;<br>
    </p>
    <p>Cheers for any help</p>
    <p>Matt</p>
