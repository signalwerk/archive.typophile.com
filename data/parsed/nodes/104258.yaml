      <p>To be more precise, here is the problem. Lots of people type their texts in word and send the .doc or .docx document as attachment in emails, assuming that the person that receives the file will see exactly what they see on their own screen. That's almost never the case, but there is no need to worsen the situation.</p>
      <p>If you send a .doc file that uses a font that replaces ** by  ★, and if the person that receives the file does not have that font installed on his computer (or a font that does the same thing, which is quite unlikely), then that person will see ** where you see ★.</p>
      <p>I send .doc attachments only when I am required to do so, else I send a pdf.</p>
