      <p>Note: I'm assuming FontLab...</p>
      <p>The glyph name should be uni####, so it should read</p>
      <p>sub uni002A uni002A by uni2605;</p>
      <p>These should also be the glyph names, if you're using that method instead of the AGL. If you use a different <strong>name</strong>, e.g. asterisk, you must use that, not the unicode number.</p>
      <p>sub asterisk  asterisk by uni2605;</p>
      <p>Assuming you've <strong>named</strong> BLACK SUN as uni2605</p>
