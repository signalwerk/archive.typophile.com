      <p>Micheal, for years we set type using TeX running in a DOS box. This is pre-Unicode, but I built what we called super fonts that are similar to today's OpenType -- small caps, proportional &amp; tabular figures, lining &amp; oldstyle, etc, etc., all in one font. Since we were running TeX in DOS, we'd just change whatever characters we wanted to include by writing an encoding vector, leaving the first 127 (named) characters as they are in ASCII. Everything remained properly named</p>
      <p>So, much of my experience was with author -- or publisher -- supplied files where a character could be font dependent -- e.g., where someone in the world that relied on hard-wired Mac or Windows encodings had gone in &amp; made an 0macron, but put it in the odieresis slot. What a mess. Even more fun with Greek and all the different encodings used...</p>
      <p>Nor is it always clear today just which file someone will go back to. We have jobs from when we typeset using TeX -- always ASCII files, of course -- and were making PDFs for the printer to use. Now, when the publisher wants to resurrect the text,  press #1 will want to use the ASCII files, but press #2 will want to use the pdfs. And this with our stuff, where character names were in fact correct. Imagine the situation where a Mac/Windows encoding (I think what you're calling WYSIWYG) was used.</p>
      <p>Even today, with Unicode, I refuse to give the  double-f ligatures a Unicode codepoint. Yes, we may get a "missing character" with old or supplied files, but now is as good a time as any to fix that. Legacy characters should be banished while there is still someone around conversant with how we got that way. To introduce new errors should be a crime/misdemeanor. </p>
      <p>EDIT</p>
      <p>I agree that using the pdf format for archiving typeset material is *probably* the smartest thing to do. Treat it as standing type. We can go back to books set using TeX with PostScript fonts where the printer file was pfd, then make what are essentially patch corrections using InDesign with OpenType, and "paste" them into that pdf file. If you don't do this, the only other sane way would be to reset the whole job. Again, if you don't, the 3rd revised edition somewhere down the road could become really problematic. As I said, just treat the pdf as standing type -- but not every publisher sees things this way, and of course, as the customer...</p>
