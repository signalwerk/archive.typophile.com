    <p>Hello</p>
    <p>I'm new :)</p>
    <p>I wonder if you could help me with a project I am working on. It is for a packaging range and I need to find a font which looks like French handwriting. Of course REAL writing would be great but 1. I don't know anyone French 2. Will need to be able to add to this range in years to come so therefore need consistency.</p>
    <p>I'v looked on da font and Armandine and Valerie are pretty good. Here are some examples of something lovely attached (have I done it right??)</p>
    <p>Please can you suggest anything else?<br>
    Thanks, Caroline</p>
