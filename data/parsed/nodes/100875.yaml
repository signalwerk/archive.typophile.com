      <p>Another one by Eric Gill, a good revival by Radin Pesko<br>
      Sadly, no mention of Eric Gill in the description text.<br>
      <a href="http://www.radimpesko.com/fonts/dear-sir-madam" title="http://www.radimpesko.com/fonts/dear-sir-madam">http://www.radimpesko.com/fonts/dear-sir-madam</a></p>
      <p>This one is probably one of the first "Custom Branding Fonts" ever.<br>
      It was done in 1905 by Eric Gill, as a font for Sign Painters for the WH Smith shops.</p>
      <p>Specimen<br>
      <img src="http://f.cl.ly/items/1W1l3e1Y3b0I1D2l443t/3679630048_7acc9413cb_o.jpg"></p>
      <p>In Use<br>
      <img src="http://f.cl.ly/items/1C193d2j22132C3B1T1D/inuse01.jpg"></p>
      <p>and<br>
      <img src="http://f.cl.ly/items/3P3s0R0E1S280l1T3O3b/inuse02.jpg"></p>
