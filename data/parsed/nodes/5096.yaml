    html: "<p>Windows ME. <br> <br>I should add that, in addition to the GDI.EXE error, I frequently get other errors:  DIBENG.DLL, USER.EXE, TypeTool2.EXE, etc. <br> <br>I only noticed the problems once I started performing heavy vectorization functions, and not just in FontLab programs--CorelDraw8, CorelPhotopaint8, AI10.  Again, any heavy graphics applications. <br> <br>To tell you the truth, I think my system might be a tad too weak for the operations I'm performing.  I'll open three or four of the programs I listed above, copy and paste between all of them, minimize, save, cut (not to mention 7 or 8 ellipse-contours in FontLab all at once trying to become an \"s\").   <br> <br>Maybe I'm trying to do too much, too fast--that's when the problems occur.</p>"
