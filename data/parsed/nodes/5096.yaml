    html: <p>Yeah!, it doesn't give me a very good feeling in the pit of my stomach... <br> <br>I'll try all of those options shortly.  It's not a debilitating problem (not yet anyway); I first noticed it when I created a TrueType file that included a codepoint not found in the standard Latin codepage.  I selected the font in Word and it gave me no error message; I then selected the file in WordPerfect and it could not open it, saying "Error--Cannot use GDI object.  The most probable reason is insufficient memory." <br> <br>And like I said, now it's moved on to other functions (but it's okay again once I reboot the computer).  Anyway, I'll try the suggestions.  Thanks guys.</p>
