    html: <p>GDI is the Graphic Device Interface, which is the core Windows graphics engine responsible for representing graphical objects and transmitting them to output devices, such as monitors and printers. I don't know what kind of problem you might be having with GDI but you could try <br> <br>a) backing up your computer, <br>b) using your Windows insatller CDs to repair your system.</p>
