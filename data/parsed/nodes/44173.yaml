      <p>Hi Darmock,</p>
      <p>The danger with sitting solely in front of a computer is that what you make is very heavily influenced by the computer’s capabilities. We end up being restricted by the way computers work. I’m not saying that there’s stuff you can’t do on the computer, but certain things are more difficult to do than others, and as a result these things come less fluidly when you are trying to be nothing but fluid whilst coming up with ideas. Pen and paper remove so many barriers when pouring the contents of your quivering brain out into the world.</p>
      <p>I can’t draw for peanuts but the beginning stages are meant to find good ideas, and not necessarily look good. So I suppose you just have to look past the appearance to begin with if it looks crud, and focus on the idea behind it.</p>
      <p>-Rafe</p>
