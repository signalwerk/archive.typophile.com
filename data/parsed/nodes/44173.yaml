    <p>I worked for a small graphic design firm for a little less than three years. I was laid off last week due to lack of work in the studio and I was the only employee. While working for this studio my main focus was print production.<br>
    The few times I was allowed to take a stab at designing something, the two creative directors shot it down or made drastic changes to my designs. </p>
    <p>So, I’m basically going back in time and need to sell myself again, and like before my last job I have only a very small portfolio. I’ve been struggling with re-creating my stationary/portfolio package for a couple days now.</p>
    <p>I’m trying to make the ultimate new resume to start, but I have designers block.<br>
    I have some stuff I started, but it doesn’t look great right off and that discourages me very badly. </p>
    <p>I just sit and stare at the screen and freeze up. Then I look at other designers online and see their awesome stuff and then I look at mine and it looks so flaccid and lacking.<br>
    I just keep thinking “maybe I just suck at design...maybe I should just be a secretary...”</p>
    <p>But in my heart I want to be a designer. My boyfriend reminds me that I have a talent for art and that I have made cool designs in the past. But hearing it from him over and over is hard to believe after a while. So he pointed me to this site and said that he had seen some respectable people here that could give it to me straight.</p>
    <p>So finally, please help, if you could, to get me out of this rut.<br>
    Any info, stories, etc. you guys could contribute is greatly appreciated. </p>
    <p>Thanks, and hope to talk here often.</p>
