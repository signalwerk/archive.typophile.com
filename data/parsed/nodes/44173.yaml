      <p><cite><br>
      I just sit and stare at the screen and freeze up.<br>
      </cite></p>
      <p>I know exactly what you mean, I’ve been there many times.<br>
      At the risk of sounding trite, I’d suggest that you don’t sit at the screen at all. For a lot of us that can end up either shutting down all creativity, or steering us towards creating something stale. </p>
      <p>Instead - sit down at a table with a sketch pad and pencil and just draw, doodle, scribble, etc. Even if you’re “not an illustrator”, the act of making marks on blank paper can stimulate creativity. Just try to push yourself to make marks on the paper, no matter how “outside the envelope” they seem, and see what you end up with. You may end up with beginnings of ideas you didn’t know you had, or it may even put ideas in your head that you can then jump on the computer to execute.</p>
      <p>Don’t give up, good luck.</p>
      <p>Jason C</p>
