      <p>There are many examples of "Aztec" (prehispanic is more accurate) aesthetic implementation on the "institutional" architecture, graphics and sculpture from the 30's to the 80's. A kind of exquisite brutalism was the signature style of the national identity. If you want a much more figurative example look at the Ciudad Universitaria original buildings like the Central Library or the Dean's Tower.</p>
      <p>I think that the strongest influence lies on the people's taste. Take blackletter as an example, it is not prehispanic but it has this brutal and exquisite character which made it popular in México.</p>
      <p>Also take a look into Gabriel's personal site <a href="http://www.meave.org/Site/intro.html" title="http://www.meave.org/Site/intro.html">http://www.meave.org/Site/intro.html</a></p>
      <p>Paco Calderon, the cartoonist, who is also very talented has some strips representing the institutional style of architecture I talked about:<br>
      <a href="http://pacocalderon.net/modules/myalbum/photo.php?lid=2133" target="blank" rel="nofollow"> 1</a>, <a href="http://pacocalderon.net/modules/myalbum/photo.php?lid=1385" target="blank" rel="nofollow"> 2</a>, <a href="http://pacocalderon.net/modules/myalbum/photo.php?lid=2117&amp;cid=117" target="blank" rel="nofollow"> 3</a>.</p>
      <p>Héctor</p>
