      <p>Srpatron,<br>
      polish graphic design, sculpture and architecture of 20's and 30's were strongly influenced by Aztec patterns. It was a time of searching some kind of national style as a Modern interpretation of "folklority". Designers used motivs taken from polish and ethnic minorities' (eg. Huculs) art, and blended them with mesoamerican details to get stronger feeling of antiquity or tribality.<br>
      This eclectic style, half avant-garde, half decorative, transformed before the ww2 into a government style.<br>
      The best example of the style's flavour is "Seasons", a painting by Zofia Stryjeńska:<br>
      <a class="freelinking external" href="http://www.culture.pl/pl/culture/artykuly/wy_wy_stryjenska_poznan" rel="nofollow">http://www.culture.pl/pl/culture/artykuly/wy_wy_stryjenska_poznan</a></p>
