      <p>Correction: the right name is Gabriel Martínez Meave. Maybe you are confusing him with Gabriel García Márquez, the well known Colombian writer. By the way, García Márquez has a Mexican son who happens to be a graphic designer and type designer, <a class="freelinking external" href="http://www.gonzalogarciabarcha.com/gallery.asp?gallery_id=3337" rel="nofollow">Gonzalo García Barcha</a>, but he’s more interested in colonial era. Gonzalo has Mexican Motifs, a dingbat font who includes some pre-hispanic icons, though.</p>
      <p>About the question: I think the biggest Aztec influence in graphic design is in Mexican designers. Since nineteenth century, Mexican people has thought that Aztec past is the most authentic source for “mexicanity” (a desperate attempt for erasing the Spaniard, <em>conquistador</em> roots). Because of this, a lot of artists have identified themselves with Aztec world (Diego Rivera, Jesús de la Helguera, José Obregón, José Clemente Orozco…). A book about this: Enrique Florescano, <em>Imágenes de la patria</em>, Mexico, Taurus, 2006.</p>
      <p>At little scale, the same is for Mexican graphic designers. It is not my specialty, but as far as I know, graphic designers outside Mexico are/were not much interested in Aztecs. But certainly you could write to Gabriel Martínez Meave: I am sure he can tell better than me. You can find his e-mail address at kimeratype.com.mx</p>
