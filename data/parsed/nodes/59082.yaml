    <p>Hello everybody,<br>
    I'm interested in how Aztec Culture have influenced Graphic Design. So far I know that Art Deco movement was influenced by Mesoamerican Art. Do you know other movements, designers, typographers or graphic artist that were influenced by Aztec culture?</p>
    <p>thank you very much in advance</p>
    <p>i.</p>
