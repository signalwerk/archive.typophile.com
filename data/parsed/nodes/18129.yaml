      <p>I use Formula guides, one is about 5 years old and the other 2. I know I should probably change them, but they still work well enough. And I’ve seen older ones in everyday use at some agencies, some of which have really worn out edges and must be at least 10 years old. If your books have been kept out of sun they should be reasonable, but please note, that some numbers might have changed. </p>
      <p>A couple of years ago Pantone published the new solid to process guide, which has very different guidelines for CMYK colour mixing compared to the old guide.</p>
