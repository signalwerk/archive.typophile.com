      <p>If you’re trying to be really precise, the Pantone swatch book you want to use is the same one the press operator is using. Offset press ink will look different depending upon how much is being layed down. Unless you’re providing a sample chip with the job, and the pressman cares enough to try to match it, things are a lot less accurate than people generally think. </p>
      <p>It’s important to have swatches that match your paper, coated or uncoated, as well as having spot and process samples. Nick probably gets better results from 20yr old swatches and a good relationship with his printer than people who have fresh books and blindly assume their printers are competent.</p>
