      <p>Pantone also releases new colors often. Some get into the main books, but often they’re “specialty” colors — metallic, pastel, fluorescent — that have their own books anyway.</p>
      <p>I’d say the books you have will be a decent reference point for now (and still MUCH better than choosing color from an on-screen palette). But if you’re planning on freelancing or having your own studio and truly need a personal set, save your pennies and buy new books eventually (in a year or two).</p>
