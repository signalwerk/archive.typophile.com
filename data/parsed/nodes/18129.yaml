      <p>I’m still using 20-year old Pantone swatches, and they work fine. However, I’m comfortable with colour, have been to a lot of press checks, and have aged with my swatches.</p>
      <p>If you’re starting out, I would say get a brand new set of your own.<br>
      That way you will never have to second-guess yourself, and will have all the newest colors as well. It’s a large sum of money, but you won’t need to renew for a long time (or perhaps never...) And colour is something you use on just about every job, so the expense will be well amortized — unlike certain fonts!</p>
      <p>The Process Colour Imaging Guide (comparing spot with CMYK equivalents) is the touchstone, and the most important tool a designer has for seeing, understanding and controlling how printed colour works.</p>
      <p>You may also want to consider looking at TOYO or some other color system, if you’re a “power colour” designer — kind of the colour equivalent of using small caps from fonts of exotic independent foundries.</p>
    html_clean: |-
