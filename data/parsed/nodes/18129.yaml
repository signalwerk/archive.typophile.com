    <p>How often do you buy these? I got some older ones for free from work when we were cleaning out the office, getting ready to move to a new building. They’ve basically been sitting in a closet and haven’t been opened really so I figure they haven’t really faded. What’s the real deal here? I know PANTONE says you should buy new ones every year but that seems a bit absurd and extremely expensive. Basically I just want to see what designers in the field do about this matter. I’ve now at least got a decent reference for a complete set: 2 process chip books, 1 uncoated chip book and 1 coated chip book. Circa mid 90’s though...if they’re really not worth having let me know.</p>
