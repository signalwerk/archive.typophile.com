  html: |-
    <p>Stockholm city council has launched a new identity system, replacing the current one which includes Karl-Erik Forsberg's 1961 seal and a rather 90s-ey (but good) visual look with a lot of airy Gill Sans.</p>
    <p>The new identity includes a new logotype and a custom typeface, Stockholm Type, based on Swiss Typefaces' Euclid (which is one of those trendy "new clumsy" experimental geometric sans types), but significantly neutered here into something rather Museo Sans-esque. Not sure what it's supposed to say about Stockholm. There's little info on <a class="freelinking external" href="http://www.stockholm.se/" rel="nofollow">the new website</a> (which has the new typeface as a web font, look a those numerals!) but it's apparently by Swiss Typefaces' <a class="freelinking external" href="http://www.emmanuelrey.ch/" rel="nofollow">Emmanuel Rey</a>, with the identity by <a class="freelinking external" href="http://esseninternational.com/one-city-one-vision-one-statement/" rel="nofollow">Essen</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Stockholm_nygrafiskprofil3_4561.jpg"></div><p></p>
