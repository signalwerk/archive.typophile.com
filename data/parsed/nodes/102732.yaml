    html: |-
      <p>But all of that has some sort of purpose, if only iconoclasm, purification and interesting visual rhythm. Here, though, they've taken the least interesting part of the design – the style of typeface, which isn't <a class="freelinking external" href="http://sthlmmayday.se/?attachment_id=103" rel="nofollow">even</a>* <a class="freelinking external" href="http://imgur.com/PZdhc77" rel="nofollow">essential</a> anyway – neutered it still futher by dropping the ubiquitous always-on medium weight, and placed it in the middle of a standard formula A1 brand identity. All of the other elements of anti-design are gone, rendering the type choice just awkward.</p>
      <p>* Nice rotalics in this one. Anyone know what they are?</p>
