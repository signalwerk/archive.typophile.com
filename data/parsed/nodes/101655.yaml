    html: <p>Short version, probably answered elsewhere, what, if any, is the difference between “Free” and “Libre?”</p>
    html_clean: <p>Short version, probably answered elsewhere, what, if any, is the difference between “Free” and “Libre?”</p>
  - id: 548347
    user: 54527
    date: 2013-03-25T08:52:00
    date_raw: 25 Mar 2013 — 8:52am
    votes: null
    html: |-
      <p>Free:<br>
      - Free fonts are generally free in price only (as in free beer) but you are not allowed to make modifications, derivatives, etc.<br>
      - Some free fonts are free for personal use only, but not for commercial use.<br>
      - The source files are usually not shared.</p>
      <p>Libre:<br>
      - Libre fonts are free in price too. But they also allow and encourage modifications, derivatives, etc.<br>
      - Commercial use is allowed.<br>
      - The source files are usually shared, so modifications are easier to make.</p>
    html_clean: |-
