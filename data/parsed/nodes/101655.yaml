    html: |-
      <p>Quickly:</p>
      <p><em>Okay but if Open Sans is Noto Sans, why don't they have equal sets?</em></p>
      <p>They are not the same. They look pretty similar where they have common glyphs, but as Impallari said, even those glyphs are not 1:1.</p>
      <p>I think of it this way:</p>
      <p>Open Sans is a 'print' family, useful for web and print; 9 weights of normal width plus some condensed styles. It covers euro+viet latin, cyrillic and greek. </p>
      <p>Noto is a 'screen' family made to avoid the 'no font on this system can display that unicode character' problem. It has 1, 2 or 4 styles per script, has fonts to cover all of Unicode.</p>
    html_clean: |-
