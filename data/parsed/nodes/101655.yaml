      <p>To my eye it doesn't feel like it. They are alike in a lot of details, perhaps more than warranted, and definitely hovers on the borderline, but to me it's less of a case than classics like Helvetica/Arial and Frutiger/Myriad. I mean, even such a construction-intrinsic factor as contrast is different. </p>
      <p>That of course does not exclude the possibility that one (in the spirit of open source) has borrowed and modified outlines from the other. Open Sans does feel more polished, with better proportions and more even color and application of ideas.</p>
