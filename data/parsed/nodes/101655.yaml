      <p>Two additions:<br>
      - Some non-libre (free or not) fonts do allow "internal" modification, which can even be outsourced (as long as all parties own a license). Good examples are Adobe and Monokrom.<br>
      - Some libre fonts allow you to resell them (even without packaging them in a broader product).</p>
