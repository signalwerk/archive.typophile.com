    <p>Greater Albion has just released its two latest families, Granville and Federal Streamliner on Myfonts.com.  Both families are being offered there at an introductory 25% discount.  </p>
    <p>YOu can see examples of them in action on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  You can also see a preview of a forthcoming release - Howlett - there.</p>
