      <p>Off-list I've been asked if Roger's entry regarding the <a href="http://www.rogerblack.com/blog/getting_in_bed_with_type" rel="nofollow">opening up of the EOT format</a> is accurate. </p>
      <p>Basic answer is yes. The Embedded OpenType format (EOT) is essentially a wrapper to an OpenType font, and we're in the process of documenting the format. We hope to provide a draft to the W3C fonts working group by mid June. In addition, and equally important is the Microtype compression which was licensed from Agfa. Monotype Imaging are documenting the compression algorithm with a view to licensing it free of charge for web based implementers (browsers and authoring tools).</p>
      <p>EOTs have been around in one form or another for 15 years, and with respect to the Web most font creators have documented their policy towards the format in their EULAs. We’d hope that opening up the format would have a positive impact on type designers approach to the format.</p>
