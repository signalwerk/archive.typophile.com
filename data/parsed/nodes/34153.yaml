      h1 { font-family: url("PillGothic300mg-Black.ttf"),Helvetica,Arial; }"</p>
      <p>I see... If you are not either rooting for a confluence of the enabling and rendering technologies, or for an embedding scheme that answers more questions than "FONTNAME", I think you need a rethink. </p>
      <p>""consistent type-What the designer makes looks, by default, virtually identical in default view, standard browser windows, and can be manipulated (zoomed, etc.) like “normal” text."<br>
      I do not see all this hap'nin as a result of this embedding today, do you?</p>
