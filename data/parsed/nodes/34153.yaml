      <p>"Darrel, that’s pretty much saying fonts aren’t important."</p>
      <p>They really aren't outside our sphere. "Is the type readable?" is pretty much the only major requirement that most of the internet cares about. And, even then, that consideration is often tossed aside.</p>
      <p>Again, I'm all for being able to use more typefaces on the web. It would be a benefit to all. That said, there are just way too many stars that need to properly align for this to go anywhere anytime soon. </p>
      <p>"If free/open fonts get that popular, you’ll see the foundries tripping over themselves to license fonts for web use at low prices and with very agreeable licenses."</p>
      <p>Maybe. Though, at this point, the only folks that seem to really push for custom fonts on the web are the ad agencies working on major brand campaigns. As they also see fit to turn the web into pure Flash, there is little reason for them to need another font embedding method. ;0)</p>
      <p>"The huge volume of sales that open web type could generate"</p>
      <p>I'm not sure there would be a huge volume of sales. Seems to me that it's a fallacy akin to the RIAA thinking that people would flock to re-purchase all their music they had purchased on CD in DRMed MP3 format as well. The difference is that music is a mass-market while font sales is still relatively small in comparison.</p>
      <p>That said, there's always the scrapbooking market...</p>
      <p>Screens are of such a low quality that the details of a particular corporate typeface are lost to the point that I'd find it hard to justify paying for yet-another license for the font vs. just using Verdana and Images for any important custom-set headlines.</p>
