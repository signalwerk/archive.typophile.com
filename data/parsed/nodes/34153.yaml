      <p>If there were a practical, cross platform/browser way to embed fonts, people would use it, I guarantee it. Almost any site of any significance on the internet uses some hacks somewhere to use custom type, whether it be images or flash. If the crusty old foundries won't license their type this way, people will use fonts from foundries like mine ;)</p>
      <p>The reality is that in not too many years, almost all type will be read off of screens (even signage and packaging will be configurable displays, as horrible as that may be). Either the type industry will get with the program and figure out a business model that works for screens, or they will be marginalized and someone new will figure it out. Hopefully typography won't suffer on the next generation of screens like it has on the web.</p>
      <p>It will be interesting to see of OSS fonts take off. Free fonts (as in liberty and beer) have been around for some time, and the quality has been pretty weak up to this point. My view is that OSS fonts will fill a niche for people who need letters to communicate, but can't match their shirt to their pants. Indie foundries will get even more business through long-tail type aggregators like My Fonts. But there will always be a market for people who know that type is a powerful differentiator for their brand, and would rather pay for something that other people can't afford. These fonts are expensive enough that their owners will be able to spider the web and enforce their IP in any markets that matter.</p>
      <p>Photographers have been freaking out for a long time about people on the web using their images. It turns out that it just doesn't matter. More dangerous than the pirates are all the kids with digicams. And these kids aren't afraid of putting their huge images on Flickr. The days where big companies could sit on big stacks of old crap are over. People are going to want new, fresh stuff, and the people who matter aren't going to get it from pirating old garbage. They are going to buy from people like me ;) through aggregators/filters who will carry the little guys' stuff with creator friendly terms like Veer.</p>
