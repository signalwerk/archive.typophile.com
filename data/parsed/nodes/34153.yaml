      <p>I see MS proprietary technology that has considerably more effect on the appearence of fonts than embedding, that is not supported cross-platform/browser, don't you?</p>
      <p>I'm all for...embedding... but eventually, the fonts must emerge from their "hidden" folder and express the will of the reader or writer in a local font environment. To do this on a spectrum of technical foundations that are not consistently able to support high-quality output of fonts in low resolution environments is more than hard. </p>
      <p>CT left pure TT behind and went for fake resolution. OS10 left TT, for ad hoc fat pixeled greyscale and TT was not fully licensed unto Freetype We all lost a place to do consistent high quality work, and who knows why? But if embedding becomes sophisticated enough to ask the "entire specification", down to user rendering preferences, one can deliver very specific fonts of the highest possible quality for each and every user. </p>
      <p>Delivering jam to spread on "whatever" and "promising" it will "taste good" is someone else's job, apparently. Anyone today can see that the Windows CT and TT fonts once moved to the Mac look poor at most sizes. Moving "normal" TT fonts into a CT environment yields poor results as well, and browsers don't allow enough options, consistently, to assure user comfort or allow publisher's even modest quality control. </p>
      <p>"the only folks [who] seem to really push for custom fonts on the web are the ad agencies working on major brand campaigns. As they also see fit to turn the web into pure Flash, there is little reason for them to need another font embedding method"</p>
      <p>I see...So if this is only about text...</p>
      <p>Cheers!</p>
