    html: <p>If free/open fonts get that popular, you’ll see the foundries tripping over themselves to license fonts for web use at low prices and with very agreeable licenses. Monotype owns thousands of classic fonts that could be licensed for online distribution at dirt cheap prices because there’s so little overhead with digital sales, and could easily treat most of the old fonts as cash cows and just dump them on the market at rock-bottom prices. Indie types might also become great sellers in such an environment, because companies that can’t afford tens-of-thousands of dollars for a standout printed piece could easily drop a few thousand on a nice website developed from a template and given a nice standout look with great type. The huge volume of sales that open web type could generate have the potential to create a sales volume that will bring font prices to bargain-basement levels.</p>
