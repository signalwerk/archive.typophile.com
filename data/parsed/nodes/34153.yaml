      <p><cite>Another interesting thought: To go into Firefox needn’t the methodology be GPL’ed, not on indefinite loan from a private interest?</cite></p>
      <p>According to Mozilla.org:<br>
      <em>All of the code which makes up the core Mozilla products is licensed under a MPL/GPL/LGPL tri-license or a licence compatible with all three of those (e.g. the BSD licence).</em></p>
      <p>Given those license terms I doubt that there will be any trouble getting Firefox support. Microsoft has gotten along just fine with the BSD license for decades, so and Microsoft code could simply be released under a BSD license. But Microsoft doesn’t even need to write the code, it just needs the W3C to sign off on EOT and then the Firefox team is stuck supporting EOT because they would never let IE support an open standard that the Firefox team does not.</p>
