      <p>There is only thing that needs to happen for fonts to become useful on the web. The three major html renderering engines need to allow pages to reference fonts in a consistent way. My preference would be TrueType files that can be referenced inside of css.</p>
      <p>I'm sure that this is much harder than is sounds, just from a security and sandboxing standpoint. Fonts can do a lot to screw up operating systems. There would probably have to be a separate layer for rendering type that isn't so close to the OS. The worst thing would be for remote web pages to be able to install fonts on your machine, even if it were just temporary.</p>
