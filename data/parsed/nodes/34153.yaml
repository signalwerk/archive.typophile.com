      <p>Sii</p>
      <p>!Exclamachine, for one. I sell more fonts directly than through a third party, at the moment. I'm on your registry. At this point all my works are flagged "embeddable", and the commercial ones come with preset or custom choices in licensing, always allowing electronic embedding. A quick scan of Christian's post suggest that Betatype is open for all sorts of new ideas as well.</p>
      <p>Jpad</p>
      <p>Free/open software works. It isn't a cure-all for "nasty old capitalism", and isn't supposed to be. Nevertheless it has taken an important place in all the areas of "utility software" like OS's, databases and such because people want an open, fixable, solution that no one can take away from them for essential, unglamorous tasks.</p>
      <p>The thing about free/open is that it doesn't have to catch fire to "succeed". The way the licenses work, generally, something can sit there untouched for days or years. One day someone needs a quick project for class, then it gets suddenly polished. Now it is still there, only better. It is something like all the history of arts that we can still draw on for inspiration, before the copyright drift in the 20th century. Every free/open piece of software never goes away, it just sits there on the web, and the whole body grows.</p>
      <p>Workhorse text fonts are one of those things that free/open will take the place of very well. There are several now that aren't too bad, and  the ability to web-embed them will make development all the more worthwhile.</p>
      <p>Several things have held the development of free/open fonts back, but the free/open culture is now turning its collective eyes this way:</p>
      <p>Despite the  US government's consideration of type as non-creative work, the designers disagree, and have been reluctant to give away their babies. The OFL was created to specifically mitigate that feeling. And similar sentiments in other art fields created the successful Creative Commons.</p>
      <p>The mainstream users are currently looking at non-proprietary software as a "cool thing". They don't like it when a song they buy won't play on their walkman, and have begun to wonder about other software, and what they can do about it. While DIY isn'tt for everyone, neither was coding Linux, but its caught on in servers quite well, and somehow "long-tail" became a term that needs no introduction!</p>
      <p>Microsoft no longer gives away some of the most practical font files available. (Not with purchase of Windows, but the old free IE font pack.)To keep things cheap yet kosher, some businesses are looking for new solutions. This has lead to the beginnings of paid development of free/open works.</p>
      <p>Patents restricted some of the most broadly supported font formats from appealing to FOSS zealots. Many of those patents are running out. Simultaneously, the free/open community is maturing beyond the zealotry stage.</p>
      <p>So, (important) free/open fonts are coming. Demand has risen, and free data persists. I am not trying to evangelize FOSS. I am assuming that all things fluctuate; if so, and free/open never diminishes, then it must be growing at some rate.</p>
