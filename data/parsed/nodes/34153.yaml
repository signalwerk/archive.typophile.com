      <p>Christian's 'preference' mirrors that of the Opera CTO. TTF (or OT TTF) basically have a better cross-platform story than OT CFF. People are going to want to include one font that will work on Windows (down to Win 9x) Mac OS (8 and up), Linux, Windows Mobile, Symbian devices, etc., and many of these don't natively support OT CFF or PS T1. </p>
      <p>Not to re-state the obvious but there are drawbacks to raw TTFs, specifically licensing and file size (esp. for East Asian).</p>
