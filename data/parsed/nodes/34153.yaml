      <p>Would that even be necessary? There are some advantages to using EOT other than the DRM, and just because the DRM options are there does not mean that web developers actually need to use them. From the radical libertarian perspective of the FSF I can see why just running the file through gzip and uploading it to the server is an improvement, but for most users and developers I doubt that the involvement of EOT matters much.</p>
