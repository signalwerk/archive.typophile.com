      <p>Jpad- I wasn't meaning to champion FOSS either. I haven't the inclination or the knowledge. The FOSS fanatical types will not settle for free (in cost) methods to accomplish this goal. The main thing keeping them from calling for/developing a solution was that no "open" browser support a way for fonts to be served into a web page, even if they were licensed appropriately. Christian is right, there is a lot that it entails in the sandbox department, and also with integrating it in web dev/management tools.</p>
      <p><em>Another interesting thought: To go into Firefox needn't the methodology be GPL'ed, not on indefinite loan from a private interest?</em></p>
      <p>Anyway, the radical libertarians are out there, and this will be another step closer to making fonts as simple as serving an image or a text file.</p>
      <p>Christian- it should be as simple as this:</p>
      <p><code>h1 { font-family: url(PillGothic300mg-Black.ttf); }</code></p>
      <p>Or, at least start that way. The W3C likes to write imaginary software then wait for someone to make it, and they've come up with a pretty extensive method of defining the font, including degrading back to plainer fonts, real and emulated variants, small caps and all sorts of stuff. If I recall, Microsoft's new method of font substitutions in Vista is based on a portion of this, so it has some viability, too.</p>
      <p>David- Simon explained the gist of it, but I'll break it down a bit.<br>
      Open - consisting of fully-public documented procedures<br>
      css friendly - conforming to the xhtml font-face and css @font-face rules of the W3CC specs.<br>
      non proprietary - not controlled, dictated or dependent on components of code controlled by private parties through licensing agreements.<br>
      cross server - Works consistently with any full-featured software that  spits out web pages.<br>
      cross browser - Works in every major current pc browser, and <em>could</em> work in even more, or at least, not break them.<br>
      consistent type-What the designer makes looks, by default, virtually identical in default view, standard browser windows, and can be manipulated (zoomed, etc.) like "normal" text.</p>
      <p>Darrel- For the moment you are largely right. But... screen resolution has and will continue to improve. The population will continue to move online, and bring more arts and culture with it. Computers will get faster, bandwidth and storage cheaper, font rendering software will improve. Every one of these factors will make a more viable market for any digital media, including fonts. The main money maker will be display fonts which stand to improve in the screen-arena the most, and are easy to appreciate to designers and lay-folk alike.</p>
      <p>For big companines, rendering display text in the native browser space instead of through a plug in and a hack will reduce costs. They can keep accessibility and still market themselves. They can have dynamic headlines and such that really stand out, but managed without adding another layer of re-rendering graphics or such.</p>
      <p>Your comments give me an interesting line of thought about font-on-demand services to serve to others' pages. Hmm...</p>
      <p>Sii- I think I read correctly, but grossly misunderstood the post. I've since re-read it a few times.</p>
      <p><em>"but none allow “zipping” as currently proposed.</em>"</p>
      <p>I think this means "zipping" as currently possible and very rarely done.</p>
      <p>I just could not get my brain around that. Why would someone want to zip the file to transmit it as an element of presentation? Most font files are small, when considered as media, and the wrapping in a generic container would only make the user unsure of what they are getting. Additionally, if they were downloaded and the user knew what to do with them, they still have to go through the process of installation and restart of the browser. As I see it, that is a non-solution.</p>
      <p>As a designer, I would be helping my clients make bad web sites if I endorsed this method, with the obvious risks to my work.</p>
      <p>This is essentially a survey that asks, "do you prefer doing something this one way, or in the worst possible way?" Yes, I'll take the former.</p>
      <p>What I thought it meant was that there was a proposal to run simple zip-style compression on a font, with the typical extension change or similar, so that it would be rendered immediately inside the web, but with a slightly smaller transmission size and isolated from the OS. Sure it would be rather trivial security to my work, but it would be of great benefit to the consumer. In which case I would have to say that it is appealing.</p>
      <p>The topical section of my Pre-formed EULAs goes like so (emphasis added):</p>
      <p><code>The output of the software may be embedded in any manner of portable document or <em>interactive electronic document</em>, assuming a reasonable, <em>common level</em> of care is exercised to prevent extraction and/or installation of the font data.</code></p>
      <p>This leaves a lot of leeway for the most basic systems of presenting the text electronically. Since there was no cross-platform solution when I wrote that, and still isn't, I decided to gloss things. Remember I do not consider anything that requires the client's end-user's interaction as truly "embedded".</p>
      <p>Over half of what I've licensed this year closed with a custom EULA, and no end-user has yet asked for zip-link access. When I offer a license's full text to them prior to sale, they are told to reply if there is something else they want or need, both in my correspondence and in the license itself. Every sale has been through contact with just me, and no one has yet requested it. I'm open to it.</p>
      <p>BTW one "vendor" that I thought of that currently buys fonts and then serves them as links is SIL. (Clarification: SIL is a font purchaser from whatever vendor(s) allowed them to post the fonts as zips.)</p>
      <p>Tiff- The ones I linked to a while back are slightly out of date. Once Myfonts figures out how to handle the leading !- in my font names, the new EULAs will go up, with the products. Any day. Really. Like soon.</p>
