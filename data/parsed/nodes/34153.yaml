      <p>Well, this isn't on the front page of the times or even slashdot, but it might be big news to us.</p>
      <p>Lets draw a parallel. There are a lot of things that people want to do with electronics, as soon as there are better storage than today's batteries. Those in the biz are constantly trying to find a new technology to hold electricity, and every breakthrough is nice, even the little ones. So is every step forwards really a major concern? Not to me, my thing is type. But I'd still love a phone that needed charging once a month.</p>
      <p>I would also happen to like better type on the web. Open, css-friendly, <strong>non-proprietary</strong>, cross-server, cross-browser consistent type. And all those who don't care much will have an opportunity to do more to express themselves.</p>
      <p>This isn't everything, but it is a step forward. Interestingly, from one of the companies that helped create the problem in the first place. If all the other browsers take the bait to code in retrieval of EOT's, it will be a trivial step for the FOSS fanatics to implement allowing non-wrapped fonts too. The css standard is already there, waiting. Then this long running joke will end.</p>
