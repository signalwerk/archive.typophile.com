    html: |-
      <p>I like this, it has a hap-hazardous feel to it which gives it originality. I think the strokes are to be credited with that feeling, I’ve noticed that they taper at the top and fan out as your eye moves down. </p>
      <p>The <strong>J/j</strong> is very unique as well. The only characters that don’t seem to follow the tapering effect are <strong>h, n and m</strong>, they start with the taper at the top and the proceeding stroke starts thin, thickens at the apex of the curve and then thins out again. I think this works fine on the <strong>m</strong>, but the outside stroke should probably be consistent with the vertical, based on your serifs.</p>
      <p>The <strong>a</strong> does seem to be inconsistent with the rest of the characters though. It’s very top heavy and the bowl doesn’t seem to support the weight well. I might try opening up the bowl more. The <strong>s</strong> feels as if it’s falling forward, you might want to thin the top curve a bit.</p>
      <p>All in all, this is a very nice typeface. Are there plans to do an italicized version or bolder weights?</p>
