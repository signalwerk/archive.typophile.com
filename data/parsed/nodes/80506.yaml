      <p>Now that some aspects of the typeface have been settled, consistency may speak for itself. Right now teardrop terminals seem more appropriate, but you should take in account that the forms are not as many as to avoid elasticity in the design process. Even after you have picked out a feature for your forms, force yourself to reconsider it after some time, my advice. Drawing letterforms on a paper sheet (in opposition to working "ex tempore" on the screen) is also very helpful to come up with new ideas.</p>
      <p>From my point of view, the clarendonian 'g' doesn't echo the aspects of the other letterforms. Try to fix it; the thin of the bowl extends to much, for instance. Also the link of the loop should be thicker to flow nicely into the horizontal.</p>
      <p>Other observations:<br>
      - Check the thin of your 'o'. Right now it looks like a lining zero (so recycle it (: ). It is therefore too wide and round to work as an 'o'.<br>
      - The upper serif of the 'i' needs a bit of lengthening.</p>
      <p>What happened to your original 'a'? I think it had an interesting vitality. Your revised one is also good, nevertheless. Keep up!</p>
    html_clean: |-
