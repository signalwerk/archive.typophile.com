    html: |-
      <p>I quite like the high contrast in letters like m and n, where the bowl meets the stem. It gives a slight human touch to it and make it more unique. However, you should also incorporate this in the rest of the font, or get rid of it. </p>
      <p>The terminal in /a/ could be moved to the left slightly. It looks a bit forced now. Also the tail looks a bit sharp in comparison to the t.</p>
      <p>Redesign the r with the n as a starting point. It looks quirky where it meats the stem.</p>
      <p>The o is too light. Make the curves on the inside more round (less square), and the curves on the outside more full (more square).</p>
      <p>The g's ear is still too short and it looks as if you stole the g from a different typeface. It has that special kind of ink traps typical for geralde typefaces, but it doesn't fit in with the other letters you designed.</p>
      <p>Something about the t doesn't quite work. The top looks too much like a cross I think. Try to give it a human touch.</p>
      <p>Raise the dot on i slightly. It looks a bit cramped now.</p>
      <p>Most importantly, the serifs on the top of stems in n m d b etc, should show a link to how they would look in a garalde typeface. Make them slightly wider where they meet the stem, or something like that. Just try out as many different versions as you can think of.</p>
      <p>Keep going! It's a charming concept. In my opinion much more so than the sans serif you're working on.</p>
      <p>Cheers!<br>
      Jasper</p>
