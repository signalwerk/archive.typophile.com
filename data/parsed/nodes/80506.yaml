  html: |-
    <p>I wanted to take a classical garalde, flatten the serifs, and open the apertures a bit to create a more contemporary, 'Egyptian' style text face, almost like if Galliard and Clarendon had a child. This is what I came up with:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cairo_5038.png"></div><p></p>
    <p>Right now I have just a few glyphs, but before I keep going, I wanted to check with those whose opinions I value so highly: Typophiles. Do you think think it's worth pursuing?</p>
