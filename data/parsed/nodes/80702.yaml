      <p>Good call, CreeDo. It may very well have been used in gardening ads. The description in McGrew's <em>American Metal Typefaces</em> says that it was "designed in 1903 by William Martin Johnson on behalf of the Curtis Publishing Company, owner of <em>The Ladies' Home Journal</em>" and that it was "used extensively as heads in their magazine,..."</p>
      <p>This is exactly why, faced with a choice between this and the Bernhard Modern, I'm leaning heavily toward the latter. If I am convinced that neither will do, the next candidates are Caslon 471 or Goudy's Original Village, though I would have to scale down the broadside since I have them only in 18 and 16 point, respectively. These are the challenges of working with metal type, but often such limitations lead to happy creative discoveries.</p>
      <p>Barbara</p>
