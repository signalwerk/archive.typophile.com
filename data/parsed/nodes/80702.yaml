    <p>Hello Typophiles,</p>
    <p>I am a letterpress printer, a hobbyist who works mostly with metal foundry type. As such, my choices of typeface are limited. In fact, I often find myself designing pieces to suit the type I have rather than procuring type for a preconceived design.</p>
    <p>I’m planning a large broadside – in the 11-by-17-inch range – with a short poem on the subject of sleeping too late on Saturday. It’s a contemporary poem, but the diction is a little nineteenth-century and the tone is romantic but restrained.</p>
    <p>I have some 36-point Bernhard Modern Roman Bold (ATF 670) with enough letters to set the poem – a major advantage. I think it will suit the text, but that might be the result of staring at it too long while thinking wishfully. My question for you is: Is this, in general, a well-regarded typeface? My printing skills are finally starting to mature but I’ve only just begun to understand typography.</p>
    <p>Thanks,</p>
    <p>Barbara</p>
