      <p><em>It’s a contemporary poem, but the diction is a little nineteenth-century and the tone is romantic but restrained</em></p>
      <p>Technically, Bernhard Roman doesn't fit any of those niches, but it's an elegant, eminently readable face which is well-suited to poetry (short lines and lots of interline air).</p>
