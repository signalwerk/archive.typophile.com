      <p>When reading the aforementioned research papers, I think that the researchers may have been preoccupied by the idea that we only look at the black shapes. When analyzing their results on identification of the lower case letters of Arial, I think one could argue that for the identification of a,c, e and i, maybe even of s and z, we are rather looking for the existence of white counters and check wether they have an aperture or not. In the case of s and z, we maybe look for the way the two counters are separated from each other. When we look at the parts where the other letters are being recognized, it is my observation that these parts are all thick strokes in conventional serif typeface design. No matter wether they are Old Style / Garalde or Modern / Didonic). Which would imply that when we are identifying single letters, we are in fact looking for the counters and the thick strokes of a conventional serif typeface (which Courier is not …). The only group for which this does not seem to apply is that of the characters with diagonals and also do not have an ascender or descender; namely v, w and x.<br>
      [Edit] Note that in the left column of the Arial lower case table, there is a slight focus on the upper end of the right diagonal stroke of k and v … The (position of) the upper end of that stroke seems to be a valuable indicator. When one blurs the image of a traditional serif typeface, the right diagonal stroke(s) of  will look similar to the right half of the image of these letters in the left column …</p>
      <p>When trying to validate the outcome of this research for typeface design, I think we should consider that the investigation on Arial mainly tells us a lot about Arial. To be shure about what we do when reading Frutiger, one should research Frutiger with the same method. For what we do when reading Garamond, Swift or Bodoni, we should check these typefaces as well. Both for single letter recognition and for words and texts. When it comes to typeface design, this kind of research may become interesting when we know wether we look at different features per typeface or if we will always look for the ‘same’ features. I think we will also have to consider that some researchers suggest that ‘tuning in’ to a typeface is an essential part of an effective reading process. The ‘Arial research project’ does not tackle this effect (please correct when you think I am mistaken). As far as I remember, the research methods of Matthew Carter and Kevin Larson on Georgia and Sitka were quite different. I think it would be very interesting to see if their findings relate to the outcome of the research by Fiset,  Gosselin etc.</p>
