    <p>There was a study a little while back that looked at which parts of (Latin) letters are most relevant for letter recognition. IIRC this was achieved by obscuring various parts of letters and then checking how much that harmed recognition. I can distinctly remember there were (greyscale, somewhat blurry) images of at least all the lowercase letters with their most relevant parts highlighted / least relevant parts barely visible. But that’s all I remember (I didn’t actually read it yet), and I can’t find it anymore.<br>
    Does anyone know what I’m talking about, and can point me towards a source? Thanks!</p>
