      <p>In his <em>Manuale Typografico</em> (Manual of Typography) of 1818 Bodoni wrote on page XXV:<br>
      «Ove però buona ragion non appaja, e la moda non tiranna lasci arbitrio, il bon gusto si attiene a una semplecità non rozza, quale si mostrerebbe delineando con tratti per tutto egualemente grossi le lettere, ma ben avvisata e gentile, quale scorgesi nel bel contrasto per dir così di chiari e scuri; che vien naturale a ogni scrito di ben tagliata penna e ben tenuta in mano.»</p>
      <p>In English this may translate into:<br>
      “Excellent simplicity, which should not be understood in such a way that the strokes of the characters should be of equal thickness, should decently and gracefully show the beautiful contrast of light and shade <em>(thin and thick)</em>, like a well-cut and well-handled pen lends it to the script.”</p>
      <p>A few lines further Bodoni continues in a similar manner:<br>
      “Printing, which was invented to replace handwriting, becomes perfect the more it resembles the most beautiful manuscripts.”</p>
      <p>In the next paragraph (p. XXVII) he says:<br>
      “The beauty of a typeface is founded (…) on the ease of the strokes, on their freedom, decisiveness and fluency.”</p>
      <p>Note that  in the foreword of his <em>Manuale</em>, Bodoni does not write a single sentence on circles and rectangles, let alone architecture. Seen in this context, I wonder if Didot really was the architect as suggested by Deberny et Peignot in their text on Bifur: “… the conception of Didot, who first had the hardihood so worthy of admiration, of deliberately renouncing the imitation of handwriting and of creating capital letters formed of  heavy black and light strokes. He constructed in place of designing; the architect in him took the place of the calligrapher.</p>
      <p>Reading this and comparing it to Bodoni’s words, I wonder what Didot himself has said about the characteristics of his typefaces. Anyone?</p>
