      <p>[Hrant] “<em>acrocratic</em> feature”</p>
      <p>acro is from the Greek <em>ákro</em>(<em>s</em>), meaning “top-most,” or “highest.” So <em>acrocratic feature</em> might be poached to mean: feature with the highest cue value.</p>
      <p>There is now some new work underway related to the work on letters and words cited above — anchored by a recent addition to the Fiset / Gosselin team: Xavier Morin Duchesne — that found that  individual letter biases could not account for word biases. See: <a href="http://www.journalofvision.org/content/12/9/532.short" title="http://www.journalofvision.org/content/12/9/532.short">http://www.journalofvision.org/content/12/9/532.short</a> and <a href="http://www.journalofvision.org/content/13/9/1297.short" title="http://www.journalofvision.org/content/13/9/1297.short">http://www.journalofvision.org/content/13/9/1297.short</a>. The abstracts don’t relate to published papers — they relate to posters presented at two successive Vision Sciences Society annual meetings.</p>
