    html: |-
      <p>I almost always go for a solution like on the left of the initial post - but this is just my personal preference. This also has has the added benefit of the left side kerning like an A and the right side kerning like an E for the class kerning :)<br>
      I also prefer the Æ to be narrower than its two parts - so shortening the E bars and closing up the counters of the A bit is par for the course.</p>
      <p>But be aware that this Æ form is sort of constructed. In written form the Æ is written in just three strokes:<br>
      - the A angle and lower bar of E in one stroke: /\_<br>
      - the crossbar of the A and E in one stroke: --<br>
      - the top bar of the E starting at the apex of the A:-<br>
      So the right solution of the initial post is closer to a written form.</p>
      <p>@ Nick Shinn: yes, the crossbars should ideally be aligned - but this is usually difficult to achieve in bolder weights (the A counter becomes too small very fast ;)</p>
      <p>There are many horribly designed "Æ"s out there, so be careful what you use for reference...</p>
