    html: |-
      <p>The problem with Æ no. 2 is the angle of the stem. Since it's neither vertical nor really diagonal, it makes the glyph look left-leaning ("linkskursiv" or "rückwärts liegend" in German, I don't know the English term, if there is one). My choices are definitely Æ no. 1 and Œ no. 3, but for a sans serif I might chose Œ no. 1. Œ no. 4 is pleasing to the eye, but I feel it's not ligated enough. Œ no. 5 looks very Mannerist or Baroque, and might work in such a typeface.  </p>
      <p>Just as I think the E is the important part of the Æ ligature, I think the O bit is most important for the Œ. I'm of course heavily culturally biased. The Œ is not used in modern Norwegian, but it's traditionally used for normalised transcription of the long Ø-sound in Old Norse. (These days, it's sadly being replaced by the (mostly) inaccessible and ugly Ø acute. Curse modern scholars!)</p>
