    html: |-
      <p>Seeing Michael's example reminded me vaguely of <a class="freelinking external" href="http://kltf.de/kltf_grotext.htm" rel="nofollow">KLTF Grotext</a>. It has AE, OE, and UE (!) ligatures. In addition to the usual capital ligatures, there are glyphs where the first component is a capital and the E is in small caps. There are also Ae, Oe, and Ue ligatures where the second component is in lowercase form. </p>
      <p>My guess is that these were conceived as experimental alternate forms of the German umlauted vowels (hence the UE ligature for Ü). These forms are certainly not what readers would expect for languages whose orthographies actually use æ or œ.</p>
    html_clean: |-
