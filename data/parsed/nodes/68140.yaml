      <p><cite>...these forms are certainly not what readers would expect for languages whose orthographies actually use æ or œ.</cite></p>
      <p><cite>I don't think that's the case with œ in French.</cite></p>
      <p><cite>At any rate, designers don't seem to mind splitting the diphthong, for various reasons:</cite></p>
      <p>In France, too, œ is very frequently spelled oe, even though it is not strictly correct, in large part because it can't be typed with the standard French keyboard. I was talking about the actual ligature for text faces; when people go through the trouble of using the actual ligature rather than Oe, they would use the form Œ.</p>
      <p>It is such a rare occurrence for Œ to come at the beginning of a word where only the first letter would be capitalized that I guess you can't really talk with much certainty about what readers would expect. In fact, I have to say the Oe ligature reads very naturally. I think French readers may think of œ as something like just tightly kerned oe, so the Oe ligature makes sense in that way. This would not be the case with, say, Norwegians and æ.</p>
      <p>Here's another example I found, presumably from France (unless it's just a coincidence through bad spacing).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Affiche_Oedipe_Roi_5362.jpg"></div><p></p>
      <p>(Note that this is an exception. Most settings of Œdipe that I found through an image search use the standard form of the ligature or spell it Oedipe.)</p>
