      <p>For what it's worth, I find Œ no. 1 most natural for French. Granted, it's not the most commonly occurring letter, since so few words begin with it. I think Œ no. 4 works best when the capital letters are quite wide and old-fashioned. Œ no. 5 I can't really stand.</p>
      <p>I would also align the crossbar of Æ in handwriting, but the letter is not commonly used in the languages I speak. I remember seeing a design where the crossbar is a single slanted stroke that rises to the right, but I can't find it.</p>
