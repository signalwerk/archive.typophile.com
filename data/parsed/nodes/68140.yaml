    html: |-
      <p>Let's compare the design possibilities, also taking the related ligature Œ into account.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AEOE_5351.gif"></div><br>
      1. E is the dominant element. This seems to be the most common solution by far.<br>
      2. Both elements are equally dominant. I don't really recall seeing this type of solution, even though it doesn't look entirely displeasing to the eye.<br>
      3. The A or O is the dominant element. Rarer than 1. but does occur.<br>
      4. The elements retain their own shapes and are joined at a point. Much more common to see the Œ designed this way than the Æ.<br>
      5. Erm, yeah. Overlapping elements. Train wreck for the Æ, but for certain typefaces the Œ is designed this way.<p></p>
      <p>Interestingly, the Æ is likely to take form 1. even if the Œ takes other forms.</p>
    html_clean: |-
