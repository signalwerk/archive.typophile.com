      <p><cite>From what I gather, It was often used in inscriptions. But mostly at the end of words and essentially just in order to save space.</cite></p>
      <p>Latin inscriptions often contained not just Æ but other space-saving ligatures. So Æ was essentially just a graphic variant of AE and not accorded special status in Classical Latin. But then the diphthong represented by the digraph AE began to be pronounced as a single sound in Later Latin, eventually merging with E, and the ligature Æ became a useful shorthand for this.</p>
    html_clean: |-
