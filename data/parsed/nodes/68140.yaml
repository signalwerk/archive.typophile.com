    html: |-
      <p><cite>My Latin is a little rusty. Are there words where the sequence a_e may not be "diphthongized"?</cite></p>
      <p>Yes, there are some loanwords and proper nouns, like Aetius, where "ae" represents two separate sounds rather than a diphthong. In Roman inscriptions, though, whether it is a diphthong has nothing to do with whether it is ligatured. Any pair (or occasionally more) of letters in any word can be ligatured, if it makes sense graphically. It's purely a design/layout decision.</p>
      <p>(ETA - I should check for new posts before hitting the button...)</p>
