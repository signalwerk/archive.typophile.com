      <p>Want a kind of logical answer? </p>
      <p>If in the lower case, the e is dominant over the a (what I mean is, it retains its shape at the expense of the a whose tail is markedly affected by the e) then shouldn't the E similarly dominate the A (as it does in the vast majority of AEs) and thus the backbone of the E will be vertical?</p>
      <p>I personally prefer this dominant E and don't warm at all to the slanted E but I guess you didn't ask about either preference or logic.</p>
      <p>Bliss and Myriad use slightly slanted backbone to E. I guess If you're going for equal rights then you've got to slant it a little. </p>
      <p>It was almost certainly you (or maybe Chris L) who once said to me, "whatever looks best is the right answer." Would this be any different?</p>
