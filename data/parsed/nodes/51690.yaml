      <p>We don’t use a different dollar sign (please show me where different dollar signs even <em>exist</em>) and in French it follows the number rather than preceding it. $5,278.01 vs. 5&nbsp;278,01&nbsp;$. Spacing is up for discussion, of course.</p>
