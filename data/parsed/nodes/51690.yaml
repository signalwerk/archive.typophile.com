    html: |-
      <p>okay, I can't speak for european french on this one, but I do know canadian french numerals.</p>
      <p><strong>canadian english uses a ',' as a delimiter between thousands:</strong></p>
      <p><em>fifty thousand would be written: 50,000<br>
      fifty million would be written: 50,000,000</em></p>
      <p><strong>canadian french uses a ' ' as a delimiter between thousands.</strong></p>
      <p><em>cinquante mille would be: 50 000<br>
      cinquante million would be: 50 000 000</em></p>
      <p>Now, also note that decimalization is different between english and french here too.</p>
      <p><strong>canadian english uses '.' as a decimal point:</strong></p>
      <p><em>five point five would be: 5.5<br>
      ten point seven five would be: 10.75</em></p>
      <p><strong>canadian french uses a ',' as a decimal point:</strong></p>
      <p><em>cinq point cinq would be: 5,5<br>
      dix point soixante-quinze would be: 10,75</em></p>
      <p>I hope this clears up some of the number thing.  I can't say for sure for sure, but everywhere I look here in canada we set a price like this:</p>
      <p>five dollars and fifty cents: $ 5.50<br>
      and in the french: $ 5,50</p>
      <p>Best of luck,<br>
      innovati!</p>
