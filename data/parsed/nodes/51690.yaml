    <p>I've recently bumped into a a question I don't have an answer for. This happens a lot. The difference is this time I don't even know where to look to for a solution. Since it has to do with setting type, I figured this was the place to go.</p>
    <p>The problem is Quebec. Aside from needing a French version of all of this signage, I need to set the Canadian Dollar sign differently. My understanding is that it should follow the amount with a space, and should technically have two slashes. Aside from that, I know nothing. </p>
    <p>Is it's placement as open to interpretation as the US dollar sign?</p>
