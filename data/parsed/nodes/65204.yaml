    <p>i felt silly when asked to ID this, but it just doesn't match up to very much as far as i've found. The hook on the J could be custom, but the whole logo/type is handled so generically that i didn't believe that.</p>
    <p>Name: "Jiffi Stop"</p>
    <p>-hook on the uppercase J (maybe custom)<br>
    -short tops on the lowercase f<br>
    -inside of uppercase O not perfectly circular<br>
    -uppercase T elements totally vertical (before skew/ital)</p>
    <p>any ideas? (Thanks in advance!)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jiffi_4045.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/jiffi2_3482.jpg"></div><p></p>
    <p>(this just smacks of something pretty obvious to you pros, but im in the dark :\)</p>
