      <p>I'm thinking it's probably a font, rather than a completely custom job. A custom job would never have passed up on the opportunity for an FFI ligature!  It is likely, however, that the letters got a few tweaks along the logo design path.</p>
      <p>Beton is very close. <a href="http://www.fontshop.com/fontlist/families/geometric_slabserif_712_extra_bold/">Geometric Slabserif 712 from Bitstream</a> is another close one, but I have yet to find an oblique.</p>
      <p>If you'll indulge the diversion, here are a few products that didn't pass up the chance to class up their act by sneaking in a 3-letter ligature.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jiffylube_5466.gif"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Jiffy_Pop_3577.jpg"></div><p></p>
