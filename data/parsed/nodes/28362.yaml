  html: |-
    <p>Hi all,</p>
    <p>I’ve just practically rebuild my home and added a room as my workspace. I would like to decorate that room with as much info about type as possible. I’m just starting an interest in typography and thought that that would be a nice way of learning more about type.</p>
    <p>I’ve seen many posts here with links to other sites where they have pdf’s of families and general info or pictures. I would like to collect as many as possible to put up the walls and also to have them on the computer for research.</p>
    <p>Could anyone please give me some links to interesting typographic pdf’s or images (high res preferably).</p>
    <p>I found for example some on dutchtypelibrary.com, dstype.com, fontshop’s fontmag (takes a bit longer then a download, but sounds interesting enough), fontfont.com, etc.<br>
    I think you know what I mean. I will be browsing the forum for the next couple of hours for interesting links and downloads.</p>
    <p>I do have a couple of books about type, but I wouldn’t want to cut pages out of them to hang on the wall, so I’m just looking for free downloadable interesting things (I am a student so free things always sounds interesting for some reason) =)</p>
    <p>Thank you so much! any help will be very very much appreciated!!!</p>
    <p>dav2.</p>
