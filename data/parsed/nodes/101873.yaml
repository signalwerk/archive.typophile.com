      <p>Use a fairly hard pencil to draw a lineature, with the aid of a ruler that is long enough to cover the width. I guess doing this with two or three persons would be easier.</p>
      <p>Define x-height for a start, maybe also cap-height.</p>
      <p>The pencil lines are fairly invisible, but will remain when the chalk text is removed, in case correction or new text is needed.</p>
      <p>(Edit: sorry, just noted this is a fairly old thread.)</p>
