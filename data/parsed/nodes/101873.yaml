      <p>&gt; but since I don't have a overhead projector</p>
      <p>It's possible that you could borrow one from your local library or a church or other organization that has one. </p>
      <p>There are also multimedia projectors that can be connected to a laptop computer (that's how PowerPoints are projected). They usually cost several hundred dollars but again maybe you can borrow one. There are also devices called sketch projectors or tracing projectors that artists use sometimes. You can find those in the ballpark of $50 at Amazon, but I've never tried one.</p>
      <p>&gt; will projection work on a black surface?</p>
      <p>It should work if the drawing is white lines on a black background, and the room isn't overly bright.</p>
