    <p>Last week I've been commissioned to create a typographic image on a big chalkboard door in a cooking store. I can hardly wait to get my hands dirty, but I was wondering if any of you have any experience doing such a job.</p>
    <p>I already found some useful tips-n-tricks on various blogs.<br>
    This door is freshly painted, so first thing I'll do is totally cover it in chalk and then clean it - this to avoid any scratching.<br>
    Furthermore, I'll keep the door wet whilst drawing, wetting the chalk too.</p>
    <p>And yes, I've already seen Dana Tanamachi's vimeo's. Great stuff!</p>
    <p>More tips-n-tricks are highly appreciated!</p>
