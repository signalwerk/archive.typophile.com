      <p>See <em>A Topological Picturebook</em> by George K. Francis.  A couple of years ago one could have it for $10 new.  Unfortunately, I made presents of all the copies I had, and now when I need it, it is about $30…</p>
      <p>The book consists of 3 interleaved topics:
      </p><ul>
      <li>how to design 2D visualizations of complicated 3D structures,
      </li><li>tips on putting the visualizations on paper/blackboard,
      </li><li>math one can deduce from the example visualizations in the book.</li></ul>
      <p></p><p>The mathematical part is, I suppose, mostly a little bit dense for a non-enthusiast.  However, I suspect that the other two parts may be of much more general interest.</p>
