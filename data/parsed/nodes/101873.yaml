      <p>(It’s a lettering image, not typographic.)</p>
      <p>I did some chalk stuff recently, but worked dry.<br>
      I found that spritizing with a detergent solution spray then wiping with a damp synthetic cloth was a better way to clean than dry wiping, or wet wiping without detergent, which left streaks.</p>
