    votes: null
    html: <p>The only typographic problem I see is the weight change because of size. And if you just make the "2" lighter that's solved. Or if you want the "24" to stand out, make the "4" darker. <br> <br>The asterisk, I would flip on its head. <br> <br>hhp <br></p>
