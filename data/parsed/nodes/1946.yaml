    date: 2003-11-05T10:12:00
    votes: null
    html: <p>Thanks for the feedback, Hrant. Actually the '2' is in the same size, it is just lower than the letters. And 4 is smaller than 2 because I cut a small piece off it.</p>
  - id: 15434
    user_id: 2236
    user_name: squeeze
    user_path: null
    date_raw: 5 Nov 2003 — 10:54am
    date: 2003-11-05T10:54:00
    votes: null
    html: "<p>Magnus: <br> <br>I will reiterate what Hrant has said regarding both the asterisk and the numerals. The two may be the same size in mathmatical width/thickness, but visually (perception is more important than reality in visual communication) it is heavier. See the width of the angled stroke on the \"4\"? The width/thickness of the \"2\" should probably be somewhere between that and its current width/thickness. Also, does the curve on the \"f\" (I'm a novice at typography so I don't know whether this is referred to as a \"terminal\" on an \"f\", or not) feel a little thick/heavy or is it just me? <br> <br>It's looking pretty good. I hope you win your competition. <br> <br>Aloha! <br>Scott</p>"
