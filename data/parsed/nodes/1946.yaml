  html: "<p>I submitted a logotype concept to a competition and although I got some good reviews, I was also told that the typography of the logotype is weak. I'm a amateur/intermediate at logo creation, so I need some guidance at choosing the correct font. Oh, and also remember that I currently have pretty limited font supplies (mostly the ones supplied with Corel Draw). I can only afford buying a great custom font if my entry wins the competition. <br> <br>Also check out my presentation (in Estonian, but with loads of pictures): <br><a href=\"http://www.magnus.pri.ee/info24/\" target=\"_blank\">http://www.magnus.pri.ee/info24/</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/19808.jpg\" alt=\"\"></p>"
