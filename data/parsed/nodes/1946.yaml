    date: 2003-11-05T11:09:00
    votes: null
    html: <p>Okay, lets see what I can do about the number 2. I will make it a bit smaller, since one of my objectives was to write the logo text in one colour. <br> <br>The curve of the 'f' doesn't bother me, but if someone else points it out, then it probably  needs some work. <br> <br>By the way, I used Humanist 521 font and the only modifications were the alignment of the 2 and cut 4.</p>
