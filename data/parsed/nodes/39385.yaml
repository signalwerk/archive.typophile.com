    html: |-
      <p>For a 1930s sans that's more art deco than modernist, consider Mark Simonson's Mostra,<br>
      <a href="http://www.ms-studio.com/FontSales/mostra.html" title="http://www.ms-studio.com/FontSales/mostra.html">http://www.ms-studio.com/FontSales/mostra.html</a><br>
      or House Industries' Neutra.</p>
      <p>For a "serif movie title lettering" font, maybe something from Letterhead Fonts or Nick's Fonts.<br>
      You may be interested in Ephemera foundry--in Indie Fonts 3.</p>
