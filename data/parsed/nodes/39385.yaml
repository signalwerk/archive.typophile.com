      <p>L’Atalante reminds of the Cassandre posters.</p>
      <p>As Nick indicated, it's Art Deco typefaces that you should be looking for.</p>
      <p>Mostra looks great. So does Blakely and Goldenbook.</p>
      <p>If you'd like to search further, you could try these places:</p>
      <p><a href="http://www.fontscape.com/explore?7SW">http://www.fontscape.com/explore?7SW</a></p>
