    <p>I'm making a film right now and I'm inspired by the classy title fonts found in some french movies of the early sound era.</p>
    <p>Does anyone recognize the fonts in the following frames?<br>
    Could you point me toward a contemporary fonts with similar vibes?</p>
    <p>Thanks very much,</p>
    <p>-N</p>
    <p><img src="/sites/default/files/old-images/latalante1934dvd_4797.gif"><br>
    Jean Vigo's <em>L'Atalante</em>, 1934</p>
    <p><img src="/sites/default/files/old-images/title1_5914.jpg"><br>
    Jean Renoir's <em>La Règle du Jeu</em>, 1939</p>
    <p>Edit: I'm new here and though I searched for previous relevant threads, I failed to note that this should probably be posted in "Design" until it was too late... could a mod move the thread?  My apologies. :)</p>
