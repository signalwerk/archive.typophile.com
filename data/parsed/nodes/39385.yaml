      <p>Lettering manuals generally showed both pure lettering styles, and lettering styles based on typefaces.<br>
      That R in Règle is too poorly rendered to be a type form, although it may be a loose interpretation of such. Nevertheless, it doesn't seem out of place in the general casual execution of the lettering.</p>
