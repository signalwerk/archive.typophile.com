    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font_6681.jpg"></div><p></p>
    <p>This is the billing font used on the "Reno 911!: Miami" theatrical poster found at <a href="http://www.impawards.com/2007/reno_nine_one_one_miami_xlg.html" title="http://www.impawards.com/2007/reno_nine_one_one_miami_xlg.html">http://www.impawards.com/2007/reno_nine_one_one_miami_xlg.html</a>.</p>
    <p>I have similar fonts but can't seem to identify this exact one. The the end of the "leg" of the "R" is slightly different from the other fonts I have, for instance (mine all end without a "curl" at the end). The characteristic "Q" should be helpful, but I can't seem to find the right font anywhere.</p>
    <p>Please help!</p>
    <p>m.</p>
