    html: |-
      <p>Sorry folks I should have posted the quote as text earlier; it’s a little small and pale in the picture.</p>
      <p>If anyone recognises it please could they let me know?</p>
      <p>PAUSE STRANGER: YOU STAND IN A</p>
      <p>COMPOSING ROOM</p>
      <p>HERE METAL STAMPS CALLED TYPES<br>
      ARE ASSEMBLED BY SKILFUL HANDS<br>
      INTO THE MASTER-PATTERNS<br>
      FROM WHICH THE VISIBLE WORD IS MULTIPLIED</p>
      <p>FIVE CENTURIES AGO<br>
      THE INVENTION OF MOVABLE TYPE<br>
      OPENED A NEW EPOCH IN HUMAN HISTORY<br>
      BY RELEASING THE COMMON PEOPLE<br>
      FROM THE THRALLDOM OF ILLITERACY<br>
      AND SETTING THEIR FEET UPON THE ROAD<br>
      TO SELF-GOVERNMENT</p>
      <p>YOU WHO TRAVEL THAT HIGH ROAD<br>
      TOUCH NOT WITHOUT REVERENCE<br>
      THESE LEADEN SYMBOLS OF YOUR FREEDOM<br>
      REMEMBER YOUR INCALCULABLE DEBT<br>
      TO THE COMPOSITOR<br>
      WHOSE PATIENT, NIMBLE FINGERS BUILT FOR YOU<br>
      LETTER UPON LETTER</p>
      <p>A THOUSAND STAIRWAYS TO THE STARS</p>
