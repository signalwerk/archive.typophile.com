      <p>R' Zalman Henna divides his book, "Foundation of the Nikkud", into 10 chapters. He labels his chapters as 'gates', שערים. </p>
      <p>Henna's first gate is: "Gate of Letters". It has 14 enumerated paragraphs, which Henna calls: 'fundementals' or 'foundations', יסודות.</p>
      <p>In his first fundemental lesson, Henna reiterations how Hebrew letters are sounded, and their graphic form reflects that sound (without explaining how specific is the graphic form of each letter designed based upon the sound that letter makes).</p>
