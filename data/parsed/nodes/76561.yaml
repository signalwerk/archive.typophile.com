      <p>Afterwards, Henna presents the five sets of letters to which these areas correspond:</p>
      <p>1. א ה " ח ע<br>
      2. ג י " כ ק<br>
      3. ד ט ל " נ ת<br>
      4. ז ס ש " ר ץ<br>
      5. ב ו מ " ף</p>
      <p>א ה " ח ע  are sounded from the 'הגרון', throat, known as gutturals.<br>
      ג י " כ ק  are from the 'החיך', palate, or roof of the mouth.<br>
      ד ט ל " נ ת  are from the 'הלשון', tongue.<br>
      ז ס ש " ר ץ  are from the 'השינים', teeth.<br>
      ב ו מ " ף  are from the 'השפתים'. lips.</p>
