    html: <p>Sir Clive Sinclair introduced in his Sinclair QL a third scalable font technology which used a different mathematical technology than PostScript or Metafont, in which the y axis was relative the definition of the x axis. Although it was not as flexible and easy to use for advanced fonts as PostScript, or as able to address anything like MetaFont, as we see in Yiannis Haralambous' example in the above link.</p>
