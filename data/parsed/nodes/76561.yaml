    <p>"Sefer Yesod HaNikud" - "Book of the Foundation of the Nikkud" - "ספר יסוד הניקוד"<br>
    by Rabbi Zalman Henna הרב שלמה זלמן כץ<br>
    <a href="http://www.amazon.com/Sefer-ha-nikud-Hebrew-Solomon-Zalman/dp/B00166S56S/ref=sr_1_3?ie=UTF8&amp;qid=1290370706&amp;sr=8-3" title="http://www.amazon.com/Sefer-ha-nikud-Hebrew-Solomon-Zalman/dp/B00166S56S/ref=sr_1_3?ie=UTF8&amp;qid=1290370706&amp;sr=8-3">http://www.amazon.com/Sefer-ha-nikud-Hebrew-Solomon-Zalman/dp/B00166S56S...</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rzhenna_yesodhanikud_cover_new_6604.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rzhenna_yesodhanikud_cover_org_6613.jpg"></div><p></p>
    <p>To properly create Hebrew typeface software in MicroSoft Volt, the tool for creating 'advanced' OpenType fonts, the type designer should also have an "advanced" knowledge of Hebrew grammar and correct diacritical placement.</p>
    <p>I intend to create a set of Hebrew typeface software 'advanced' OpenType fonts, both for Biblical Hebrew, and for "enhanced" or vocalized Hebrew.</p>
    <p>The basis for doing this correctly is the establishment of Hebrew grammar rules, which I decided can best be achieved by understanding the writings of essential great Hebrew grammarians, such as R' Zalman Henna.</p>
