      <p>First, Henna quotes the early Hebrew language grammarians, המדקדקים. They called the vocal instruments which produced the sounds which we refer to as letters by the term, מוצאות, motzaot.</p>
      <p>What are 'motzaot'?</p>
      <p>'Motzaot' comes from the same common Hebrew word, 'מוציא', like the blessing of 'המוציא לכם מן הארץ', 'He brings forth the bread from the earth'. Similarly, these 'motzaot' bring forth the letter-sounds from the areas of the mouth.</p>
      <p>Henna lists these areas as 5: a) the throat, b) the palate, c) the tongue, d) the teeth, and e) the lips.</p>
