  html: <p> I’m an undergrad student at a school which I greatly enjoy. However, I was wondering what some people thought were some of the better school’s typographically.  There’s obvious ones like CalArts, Cranbrook and Yale, but I was wondering if anyone had other schools in mind. I won’t mention the school I attend, just so it doesn’t seem bias in some way. I’m planning on going to grad school in a few years and I really want a school with a strong typography program. I’m really interested to see what people think of the educators out&nbsp;there. </p>
