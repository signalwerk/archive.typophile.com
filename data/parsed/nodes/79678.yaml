    html: |-
      <p>Regarding what Ray said, I wouldn't dispute that graffiti artists have just as much right to the protection of their work as any other artist. In this case however, it seems that Ronald Scherz hasn't stepped forward to outright claim this as his due to the pending litigation against him that would follow. As it is, this work is only rumored to be his. </p>
      <p>It reminds me somewhat of the Shepard Fairey case demonstrating that legal protections are a knife that cuts two ways. For Ronald Scherz to claim protection of his rights to the turtle, he would have to submit himself to claims of damaging the property of others. Even then it would seem to me that the case could be made that by waiting this many years the rights to claim ownership have expired. </p>
      <p>Personally I agree with Mr. Shinn and wouldn't touch it with a ten meter pole if there is any connection to SARS. I agree very much with Russell as well that it does indeed scream for Cooper Black, which is so rarely applicable but so often used.</p>
