  html: "<p>Hello Typophiles, <br> <br>I've read the following statement in another <br>thread (Understanding the legal issues...): <br> <br>Nathan Matteson: <br><i>\"I think James is hitting it right on the head <br>here. I've been trying to get my school to buy a <br>decent font collection - even if only for two or <br>three \"type specific\" labs - for nigh on three  <br>years now. We just had a good instructor quit <br>over the lack of type and the beaurocratic hoops  <br>you have to jump through to [not] get it.  <br> <br>And the closest we got was our bookstore selling <br>the dubious FontSite CD. :-/\"</i> <br> <br>Well, that statement came in good time. I've <br>been browsing the websites of many typefoundries <br>looking for a basic font CD collection to use <br>on everyday's work at my office. <br> <br>I've considered all my options, from Bitstream <br>to URW, and they range from U$ 120 to U$ 500... <br>That was until yesterday, when I found both <br>Softmaker (Megafont XXL) and Fontsite (CD 500) <br>collections, priced as low as U$ 39 and U$ 49... <br> <br>So, what's up here? I've recognized many fonts <br>under different names but I didn't get if those <br>collections are legal or even \"ethical\". <br> <br>I'm planning to buy a font CD collection not <br>only to be \"clean\", but also because I want  <br>to make sure that the designers would receive <br>their proper royalties. I mean, what would <br>Adrian Frutiger receive if I buy FrontPage*  <br>instead of Frutiger?  <br> <br>I want to make clear that I'm not distrusting <br>any company/person. I'm just curious why and how <br>those similar font collections can have so  <br>different prices.  <br> <br>There's a Brazilian proverb that says \"o barato <br>sai caro\", wich means something like you cannot <br>have something for nothing... (In fact, I guess <br>it's not even Brazilian, it's an universal law). <br> <br>Best regards, <br>hC <br> <br>* This font equivalence was taken from Luc <br>Devroye's website.</p>"
