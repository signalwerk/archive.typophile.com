    html: <p>&gt;legitimately, when the parent font house (I forget who) did a barter <br> <br>That's really interesting. I was at an old student's office last night and was looking at the FontSite CD - and I was wondering how it was possible to have "URW Grotesk" if it wasn't licensed. Makes more sense now. But it still doesn't explain why so many of the fonts aren't technically up to par.  <br> <br>&gt;What else, beyond ethics,  <br>prevents anybody from redrawing one of my fonts  <br>and reselling them under other names? <br> <br>As far as I understand it, if you work in the US, nothing prevents that. You can copyright the name of your typeface, but not the outlines. So anyone can rip off your outlines, change the name, and redistribute the font.</p>
