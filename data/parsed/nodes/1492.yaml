    html: "<p>Didn't see this thread. Sorry Hugo. From my experience: <br> <br>The fonts I saw on the Fontsite CD were pretty terrible. Technically. I.e., fonts with absolutely no hinting, contours running on the wrong direction, etc.  <br> <br>I never did a comparison between their fonts (e.g., FS Caslon) and a font a <i>knew</i> to be reputable (e.g., Adobe Caslon) so I don't know if they were pure rip-offs or not. (Though I'm interested to do that right now - I'll let you know.)  <br> <br>I certainly don't want to suggest that they're an unethical bunch if they're not. But frankly, the fonts are dubious enough to put me off. And really appalling from the technical side. <br> <br>I think those are 2 of the reasons certain font collections are so cheap. Technically inferior &amp; (perhaps) merely stolen outlines from a proper foundry. </p>"
    html_clean: "<p>Didn't see this thread. Sorry Hugo. From my experience: <br> <br>The fonts I saw on the Fontsite CD were pretty terrible. Technically. I.e., fonts with absolutely no hinting, contours running on the wrong direction, etc.  <br> <br>I never did a comparison between their fonts (e.g., FS Caslon) and a font a <i>knew</i> to be reputable (e.g., Adobe Caslon) so I don't know if they were pure rip-offs or not. (Though I'm interested to do that right now - I'll let you know.)  <br> <br>I certainly don't want to suggest that they're an unethical bunch if they're not. But frankly, the fonts are dubious enough to put me off. And really appalling from the technical side. <br> <br>I think those are 2 of the reasons certain font collections are so cheap. Technically inferior &amp; (perhaps) merely stolen outlines from a proper foundry. </p>"
