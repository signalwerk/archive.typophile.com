    html: <p>I think it was the FontSite CD that was discussed on Typo-L many years ago, and it turned out that the guy selling it (Sean Cavannaugh) got the rights to all those fonts legitimately, when the parent font house (I forget who) did a barter with some money they owed him. So it's more the parent font house's fault. <br> <br>hhp <br></p>
