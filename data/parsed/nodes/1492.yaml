    html: "<p>Thanks Tiffany and Nathan for the feedback. <br> <br>Buying fonts directly from the foundry always <br>seemed to be the best choice for me. That's <br>why those collections surprised me so much. <br> <br>I've almost decided wich collection I'll buy, <br>probably Bitstream's Cambridge. But what still <br>makes me curious is how that font renaming  <br>thing works. I mean, isn't there any legal way <br>of preventing an unauthorized redrawing and <br>reselling of an original font? And I'm not only <br>talking about things like Softmaker/Fontsite's <br>Sabon x Savoy, but also like Bitstream's  <br>Humanist 521 x Gill Sans.  <br> <br>Let me put it better: What else, beyond ethics, <br>prevents anybody from redrawing one of my fonts <br>and reselling them under other names? <br> <br>hC</p>"
    html_clean: "<p>Thanks Tiffany and Nathan for the feedback. <br> <br>Buying fonts directly from the foundry always <br>seemed to be the best choice for me. That's <br>why those collections surprised me so much. <br> <br>I've almost decided wich collection I'll buy, <br>probably Bitstream's Cambridge. But what still <br>makes me curious is how that font renaming  <br>thing works. I mean, isn't there any legal way <br>of preventing an unauthorized redrawing and <br>reselling of an original font? And I'm not only <br>talking about things like Softmaker/Fontsite's <br>Sabon x Savoy, but also like Bitstream's  <br>Humanist 521 x Gill Sans.  <br> <br>Let me put it better: What else, beyond ethics, <br>prevents anybody from redrawing one of my fonts <br>and reselling them under other names? <br> <br>hC</p>"
