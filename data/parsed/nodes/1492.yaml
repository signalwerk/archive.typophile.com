    html: <p>Thanks for digging up that link Hugo. Very interesting read. I feel somewhat bad now for assuming the FontSite CD was a piece of questionable garbage.  <br> <br>I'm wondering now, however, if I should go back to recommending the CD to my students. I suppose there's two ways to look at it. (1) If they don't buy the Fontsite CD, they'll probably just pirate fonts from some file-share network or other - and the CD <i>is</i> legal after all; (2) there's Hrant's view (which I assume you still hold, hhp) that the CD is detrimental to the type industry as a whole - so purchasing it is, in the long term, a "bad thing."  <br> <br>I suppose there's no easy answer to all of this.</p>
