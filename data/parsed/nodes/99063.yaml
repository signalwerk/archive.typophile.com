      <p>Almendra is my favorite font this year<br>
      Designed by Ana Sanfelippo at CDT-UBA, and released as a Libre font for Google Webfonts </p><div class="imageWrap"><img src="http://typophile.com/files/02almendra02_5804.gif"></div><p></p>
      <p>Wilmington by Bomparte is also very impressive to me.<br>
      It really looks like natural writing if you activate 'salt' and 'calt' OT features.<br>
      That's not easy to get right, but this one works like a charm.<br>
