      <p>Last — sorry — this year, the fonts I turned to when doing the occasional job were Brioni by Typotheque and National by Klim/Village. And my sig-font Locator by ProcessType.<br>
      I didn’t buy as much as I did in other years, but amongst those were KLTF Tiptoe, News Gothic (didn’t have the OT-version yet, and it has been a fav for 30 years), LT Vesta, LT Neue Frutiger Condensed (the new additions, have to keep up), Fontspring Nexa, FF Akko Rounded.<br>
      And I confess that I took advantage of some offers of free fonts (the stock market did not quite perform to expectations… So there was a need for that).<br>
      Next year I am going to produce my second font and hopefully recoup some of the expense : )</p>
