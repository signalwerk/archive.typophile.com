  html: '<p>Hi everyone, <br><br>does anyone have experience with ttf fonts under Linux? I’m rounding up a typeface with a ttf version. I had 3 diﬀerent people test this under Windows and it works perfectly. But someone under Linux has major problems with it. This is what he said: <br><br>- The typeface is visible, he can select it but there is no preview <br>- He tried to use the font with the following results: <br>    * terminal program crasher irreparable <br>    * mozilla webbrowser renders all the texts invisible <br><br>This person is running everything under Linux and has a substantial amount of windows ttf fonts that he runs without any problems. <br><br>I created this font with Fontographer 4.1.5 on a Mac with <span class="caps">OS9</span>.2.   <br>The encoding under Font Information is set to Windows. <br><br>Does anyone have an idea what happens?  <br><br>Thanx, <br>Ren</p>'
