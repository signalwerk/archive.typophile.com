    <p>Hi.<br>
    I'm planning to digitize this typeface, I was wondering if you have ever heard of, seen,  or  know any existing digital versions of it?<br>
    My quick searches have only found talk of a script called Splendid, so I assume that if this grotesk design has already been converted it might be under a different name.</p>
    <p><img src="/sites/default/files/old-images/PICT0005_5318.jpg"></p>
    <p>In the old type sample book I found, 'Splendid Grotesk' exists only in this "extended" form and in three different boldnesses. In the book there is separately another grotesk called 'Accidens' [sic] so I don't think it actually is from the same family. </p>
    <p>This thin extended Akzidenz grotesk   <a href="http://Here" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Here</a> seems to come very close to 'Splendid', but is given away by the lower case 'e'.<br>
    Also, the bolder Splendids unfortunately not pictured here are even more distinctive from Akzidenz.<br>
    The Akzidenz also lacks this special retro grotesk vibe I find exciting and rare in digital fonts nowadays...which can also be a regional thing and common to unique finnish grotesks designed for an occasion in 1920-1950 or something.</p>
