      <p>Thank you all very much, Splendid does seem to be from Wilhelm Woellmer Foundry (marked "W.W." in my type specimen book, and precisely credited in another). Narciso looks pretty much identical, plus the sample image Verbosus posted includes some lower case glyphs that my sample book didn't have.</p>
      <p>This all has been very helpful. further comments are still appreciated of course!</p>
