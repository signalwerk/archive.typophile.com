      <p>Hi Erkki,</p>
      <p>This looks like a typeface often found around 1900 under various names and from different foundries. They all got the "pre-fab" matrizes from Wagner &amp; Schmidt, Leipzig (maybe they even made it to finland).<br>
      Seemann's Handbuch der Schriften (handbook of typefaces) lists Splendid-Grotesk on p. 203 as a face by the typefoundry W. Woellmer, Berlin. It is nearly identical with f.e. Breite halbfette Favourit-Grotesk (bold extended) by Weisert, Aurora-Grotesk by Weber, Edel-Grotesk by Wagner, Klassische Grotesk by Trennert, Elite-Grotesk by Poppelbaum Vienna, Viktoria-Grotesk by John, Merkur-Grotesk by Butter and Akzidenz-Grotesk by Haas, Switzerland. This last one should not be confused with Bertholds AG.</p>
      <p>That is at least, what I can guess from the Word "Hamburg".</p>
