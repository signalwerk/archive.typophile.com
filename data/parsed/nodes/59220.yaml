    html: |-
      <p>I knew a newspaper guy in Ohio who was like Loomis. Part owner of the paper, reporter, Linotypist, pressman, janitor, etc. He'd go to a town council meeting, take notes, go back to the shop [where the Lino pot would be already fired up because he'd been by before the meeting], and sit down at the machine to write his story.</p>
      <p>I'm going to have to see if any of my older pals here in Minnesota know about this guy. I've only lived here 22 years, and this is the first I've heard of him. I'll report if I find anything worth while.</p>
      <p>A lot of hot-metal compositors prided themselves on being able to "design in the stick," without sketches or any other preliminaries. But writing at the Lino is a higher level of skill.</p>
      <p>powers</p>
