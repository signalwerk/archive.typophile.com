    <p>I just learned about Noel Loomis, a popular author of Western novels, who launched his literary career in the mid-1950s while employed as a Linotype operator in Minneapolis. His books weren't just set on the Linotype--he <em>wrote</em> them on the Linotype!<br>
    Here's how Bill Gulick describes him in his book, <em>Sixty-Four Years as a Writer:</em></p>
    <p>"A feisty little guy with a black mustache, Loomis dealt in hot lead both figuratively and actively, for he heated up the lead pot each morning, straddled a stool shaped like a saddle, and composed on the Linotype while wearing black cowboy hat, spurs, boots, and at times, I suspect, a holstered six-gun or two."</p>
