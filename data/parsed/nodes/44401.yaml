    <p>Hi everyone - I’ve designed some logos for a US company, and they’re getting them made into vinyl stickers (like the Oakley stickers people have in their car windows for example).  Anyway, the company that does the stickers uses Corel 8, and a program I’ve never heard of before - Omega.  Now, I’m sending them eps file &amp; pdf files, both of which they say they can’t open in Corel, and if it won’t open in Corel they say they can’t use the file...<br>
    So here are my two questions;</p>
    <p>first off, what version of Illustrator eps (version 7, 8, 9?) do I need to save my logos as in order that Corel can accept them?</p>
    <p>Secondly, does anyone know of this Omega program?  If I can find info out about it, then maybe the company can skip the Corel side of the process and take the file straight into Omega.</p>
    <p>Thanks in advance.</p>
    <p>JH</p>
