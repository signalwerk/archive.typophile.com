    html: |-
      <p><cite>… any specific exercises for typography that can be done with pencil and paper?</cite></p>
      <p>Well, – *writing*. Which can range from sketching to drawing, lettering and calligraphic exercise.<br>
      Or, you can carefully observe the typographic differences between e.g. two newspapers … will turn out telling you a lot.</p>
      <p>Since you are in Korea I recommend you starting with your country’s own typographic culture (which is quite impressive), and later on turn to Latin or other type cultures.</p>
