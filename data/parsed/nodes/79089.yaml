  html: |-
    <p>Hi everyone, I have always wanted to study typography but never got the chance to do it. I couldn't get into design school because I don't have any design/art background. Currently I'm studying a course that has nothing to with typography/design. I have studied the course for a year and finally realized that I want to pursue a career in typography/design. I will be joining, well actually forced to do national service as it is mandatory in Korea. I want to use my time wisely in the service and study typography but I don't have a clue where to start. Do you have any suggestions on how to study typography? I'm interested anything with typography and eventually want to design fonts. </p>
    <p>I will not be able to use a computer for personal use so anything with computer is out of picture.</p>
    <p>Would tracing/drawing fonts help to develop typography skills? If it does, is tracing better or drawing better?</p>
    <p>Are there any specific exercises for typography that can be done with pencil and paper? </p>
    <p>Are there any essential typography books that I should get? The only book I have is The elements of typography style by Robert Bringhurst which I had trouble understanding it.</p>
    <p>If you have any suggestions or words of wisdom do not hesitate to write. Thanks</p>
