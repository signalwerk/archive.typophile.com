  html: <p>An acquaintance and I were recently discussing language reform (Pitman, Deseret, Shavian, Quickscript, etc.)  He told me that the lack of ascenders and descenders alone is enough to damn any writing system to failure.  But aren't there examples of existing (or once existing) writing systems that disprove this notion.  For example, Chinese seems to lack these features (ascenders and descenders).</p><div class="imageWrap"><img src="http://typophile.com/files/chinese_5698.jpg"></div> (I have no idea what this says by the way.) Are there other writing systems that anyone else can name?<p></p>
