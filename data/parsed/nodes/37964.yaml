    html: |-
      <p>I don't think a lack of ascenders/descenders has anything to do with the success of a writing system. The latin alphabet started out as all majuscules and lived through textura, seems to be doing OK.</p>
      <p>Carolingian miniscules may have given it a kick in the pants but mostly that was just to expedite handwriting.</p>
