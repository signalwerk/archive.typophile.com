      <p>I think for this discussion you need to differentiate between alphabetic writing systems (e.g., Latin) and logographic (chinese) writing systems.<br>
      See this page:<br>
      <a href="http://www.omniglot.com/writing/definition.htm" title="http://www.omniglot.com/writing/definition.htm">http://www.omniglot.com/writing/definition.htm</a></p>
      <p>or the book "The world's Writing Systems", by Daniels and Bright.</p>
