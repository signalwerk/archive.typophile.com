    <p>Hello, everyone.</p>
    <p>I’ve been a lurker on Typophile for awhile now and thought I’d break the silence as I get more and more entrenched as a freelance designer and prepare myself for a rigorous design course in the coming spring (hopefully) at a school like OCAD, UCLA, or Parsons (at least, those are the top three I’ve been looking at... will take kindly to all suggestions). I’m from Florida and am dying to leave it, but if there’s any Floridians out there that think I should stay, speak up. It would be nice to meet more creative folk close by.</p>
    <p>You could take a look at my completely unfinished and imperfect portfolio/website <a href="http://www.davidboni.net/">here</a> and have a gander at some more work on my Flicker account <a href="http://www.flickr.com/photos/25538071@N04/">here</a> if you’re into that sort of thing.</p>
    <p>Right. Thanks for reading. Be seeing you on the forums. Hope everyone’s weekend was well.</p>
