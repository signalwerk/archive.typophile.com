      <p>@david</p>
      <p>I’m not a designer but I live in southwest Florida in sunny (and in the summer, stifling, sweaty, and inhumanly inhospitable) Naples.<br>
      My advice: go.<br>
      New York and California are unique.<br>
      Look, you can get a great design education in Miami, I have no doubt. But you’ll experience more up north or out west.<br>
      As a New Yorker who used to work in the fashion biz, I’m biased towards Parsons. You can’t re-create an atmosphere like that in another city.</p>
      <p>Welcome and best of luck.</p>
