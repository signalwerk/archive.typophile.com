  html: |-
    <p>Is there a certain rule or formula to creating a perfect gutter between my text columns using Indesign?<br>
    I once heard that you should keep your gutter at the same width as your  leading/baseline, is this true?<br>
    Below are my settings.</p>
    <p>FONT: Whitney<br>
    SIZE: 7.5<br>
    LEADING/BASELINE: 9<br>
    GUTTER WIDTH: 0.125</p>
