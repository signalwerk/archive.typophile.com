  html: <p>Also known as <em>picture fonts</em> Small decorative elements used to embellish typeset compositions. Called <em>printer’s flowers</em> in previous centuries, <strong>dingbats</strong> vary in form from simple bullets and line segments, to detailed figures and&nbsp;illustrations.</p>
  html_clean: <p>Also known as <em>picture fonts</em> Small decorative elements used to embellish typeset compositions. Called <em>printer’s flowers</em> in previous centuries, <strong>dingbats</strong> vary in form from simple bullets and line segments, to detailed figures and&nbsp;illustrations.</p>
