      <p>All of these are lettering work, not fonts.</p>
      <p>For #4, try <a href="http://new.myfonts.com/fonts/typonauten/b-movie-retro/?testdrive=dock%3Dfalse%26size%3D72%26w%3D720%26src%3Dcustom%26text%3DHarte%2520Zeiten%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D32?refby=mfde" rel="nofollow">B-Movie</a>, <a href="http://new.myfonts.com/fonts/adobe/reporter/?refby=mfde" rel="nofollow">Reporter</a> or <a href="http://new.myfonts.com/fonts/urw/blizzard/?refby=mfde" rel="nofollow">Blizzard</a>/<a href="http://new.myfonts.com/fonts/bitstream/brush-738/alternate_cuts.html?refby=mfde" rel="nofollow">Bison</a>. Free, but uppercase only: <a href="http://www.dafont.com/edo.font" rel="nofollow">Edo SZ</a>.</p>
      <p>The letters on the Dutch one (#3) have a lot in common with <a href="http://new.myfonts.com/fonts/lanston/ltc-twentieth-century/" rel="nofollow">Twentieth Century</a> and <a href="http://new.myfonts.com/fonts/adobe/itc-avant-garde-gothic/" rel="nofollow">ITC Avant Garde Gothic</a>.</p>
