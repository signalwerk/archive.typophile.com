    <p>Hi all!</p>
    <p>I'm sure this has been asked here before, but the Search function turned up nothing. To make a long story short, I'm making a German propaganda poster (from WWII) for a group project, but I have no idea what font I should use.</p>
    <p>Since I'm short on money, I would appreciate if you could refer me to some free fonts, and if they're not free, than the closest free font.</p>
    <p>Here's some pictures of what I'm looking for (I apologize in advance if they offend anyone). They're different fonts, but I wanted to give myself as much choice as possible:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/38742t_5800.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/nazi-propaganda-poster-during-war_5239.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/WWII_Nazi_Propaganda_-_Waffen-SS_3581.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/40-49 german propaganda 3_5665.jpg"></div><p></p>
    <p>Of course, if you guys have any recommendations of other fonts, it is greatly appreciated as well!</p>
    <p>Thanks for all your time and help!</p>
