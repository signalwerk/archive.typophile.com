    html: "<p>more morphology: <br>ye changes to yo when stressed in certain constructions. the dieresis is the stress mark in this case. russians don't usually indicate any other stress marks, so i think  some might consider making an exception just for the ye/yo inconsistant. <br> <br>i was mostly right in my explanation above, except in that the hard sign was silent, but i did say it was fyordor's bar, didn't i?</p>"
