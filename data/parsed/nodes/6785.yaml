    date_raw: 10 Oct 2004 — 2:40am
    votes: null
    html: "<p>Hrant, simpler characters make readng faster, don't they? And I can't really think of any pair of words that would spell the same while one means Yo and another Ye. So the reader's hardly ever in doubt. A nightmare for foreign students, I heard. Just one problem with this: many people may first see a rare Yo-word in writing with Ye, and start pronouncing it with Ye, but that's something to deal with at school, like they do with silent consonants in, say, soLntse. <br> <br>And stressing is a funny issue. Paul, I honestly haven't heard of any formal stressing rules - this whole business changes so much even from region to region... As for the antepenultimate syllable - doesn't this call for at least 3 syllables in word? And two immediate counterexamples: korOva (a cow), molokO (milk). There's also everyone's favorite bAbushka (a grandmother) that fits your rule fine, but foreigners tend to mispronounce with stress on the second syllable. The thing is, we have lots of prefixes, suffixes and endings, and in nouns the stress often stays on the root, in verbs it usually doesn't and there's a million other cases making it impossble to formalize. How many languages have you heard of that have some 400-pages stressing dictionaries (much overlooked by TV and radio announcers btw)? Besides, language changes - this dictionary has been reissued 8 times since 1960! Correct usage of stresses is one of little classy etiquette things over here, like holding your chopsticks farther from the picking end in Japan or knowing your silverware rules in European tradition. I guess there might be a key to formalization, but the total number of rules would make them impossible to learn anyway<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> Yet, for an everyday speaker the logic is graspable - otherwise weird thing like changing stresses in foreign names wouldn't happen. How would like NewtOn and RutherfOrd?<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> You'd hear this a lot over here<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
