    html: <p>I asked to a russian friend who said me that it is legible but old fashoned, pre-revolution. "Bar" is written with ? (ja) instead of A, but both A and ? (ja) existed even before revolution. She says that this could be a Bulgarian sign.  <br>The last letter "?" (') it was wrotten in the end of some masculine words before revolution. There were irregular rules but after revolution there had been a reform that regularized orthography. <br>The meaning is, according to her, "Bar Fredor", Fedor is the name of the bar.</p>
