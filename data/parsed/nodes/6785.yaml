    html: '<p>The "inverted 3" variety of the <a href="http://www.wordiq.com/definition/Yo_%28cyrillic%29" target="_blank"><b>YO</b></a> above is just a stylistic inflection. The same shape may be used for the <b>YE</b> which normally looks like the Latin <b>E</b>, or like the Greek capital ETA. <br> <br>Another interesting tale is "The Story of <b>Yu</b>". You already know that the <b>YA</b> (see above) looks like the inverted <b>R</b>. It appears that the <b>YU</b> originated as a trigraph: <b>I</b>-<b>O</b>-<b>Y</b>. Of course, the <a href="http://www.omniglot.com/images/writing/ocslavonic.gif" target="_blank"><b>OY</b></a> (OU) combo was borrowed by St. Cyril from his mother script--Greek. In the course of time the <a href="http://www.omniglot.com/images/writing/cyrillic_history.gif" target="_blank"><b>Y</b></a> was dropped, and this is why the modern <b>YU</b> looks like the <b>I-O</b>, ligatured.</p>'
    html_clean: '<p>The "inverted 3" variety of the <a href="http://www.wordiq.com/definition/Yo_%28cyrillic%29" target="_blank"><b>YO</b></a> above is just a stylistic inflection. The same shape may be used for the <b>YE</b> which normally looks like the Latin <b>E</b>, or like the Greek capital ETA. <br> <br>Another interesting tale is "The Story of <b>Yu</b>". You already know that the <b>YA</b> (see above) looks like the inverted <b>R</b>. It appears that the <b>YU</b> originated as a trigraph: <b>I</b>-<b>O</b>-<b>Y</b>. Of course, the <a href="http://www.omniglot.com/images/writing/ocslavonic.gif" target="_blank"><b>OY</b></a> (OU) combo was borrowed by St. Cyril from his mother script--Greek. In the course of time the <a href="http://www.omniglot.com/images/writing/cyrillic_history.gif" target="_blank"><b>Y</b></a> was dropped, and this is why the modern <b>YU</b> looks like the <b>I-O</b>, ligatured.</p>'
