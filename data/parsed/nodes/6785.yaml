    html: "<p><i>Cyrillic has so many letters based on or around the \"y\" sound - it's interesting to consider why</i> <br> <br>actually.... lol Russian has two sets of vowels: hard &amp; soft vowels. <br>a:ya, e:ye, i:y, o:yo, u:yu <br>the soft vowels actually have the effect of making the preceding consonant \"soft\" or palatized (placing the body of the tongue up against the soft palate while making the consonant sound) just as does the \"soft sign\" or \"myagkij znak.\"  <br>when there is no preceeding consonant, or the preceeding letter is a vowel, these forms represent a \"yodasized\" version of the same vowel sound. if yer interested i could send you passages from my old morphology book... <br>or maybe maxim can straighten me out again. ;^) <br>good to see you here mr. zhukov!</p>"
    html_clean: "<p><i>Cyrillic has so many letters based on or around the \"y\" sound - it's interesting to consider why</i> <br> <br>actually.... lol Russian has two sets of vowels: hard &amp; soft vowels. <br>a:ya, e:ye, i:y, o:yo, u:yu <br>the soft vowels actually have the effect of making the preceding consonant \"soft\" or palatized (placing the body of the tongue up against the soft palate while making the consonant sound) just as does the \"soft sign\" or \"myagkij znak.\"  <br>when there is no preceeding consonant, or the preceeding letter is a vowel, these forms represent a \"yodasized\" version of the same vowel sound. if yer interested i could send you passages from my old morphology book... <br>or maybe maxim can straighten me out again. ;^) <br>good to see you here mr. zhukov!</p>"
