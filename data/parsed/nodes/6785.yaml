    html: <p>The lettering posted by Hrant Papazian shows the shapes of some heavily stylised initials that <i>may</i> be traced to the 17th century. Frankly, it has as much in common with the Cyrillic lettering/typographic tradition as the signs of the Irish pubs in The Bronx have with the Book of Kells. One should be wary not to mistake such cheap pieces for the fount of knowledge about the Cyrillic letter-forms, let alone not to draw any hasty conclusions with regard to the Russian lettering conventions. <br> <br>The second letter in the first line is the <a href="http://www.palmira.net/arts/nlr/images/high/primer.jpg" target="_blank">A</a>, not the <a href="http://www.edu.ru/files/pics/68.jpg" target="_blank">YA</a>. The YA originated as a digraph I-A but later lost its first part (I-), so the construction of the present-day YA is indeed a variation on the shape of the olden-day A. <br> <br>The Z+b thing at the end of the bottom line is the hard sign (<a href="http://www.pravoslavie.ru/sas/image/bukvar.jpg" target="_blank">YER</a>). Its early forms sometimes featured that slanted stem. The YER is used here to make the whole thing feel "antique". The reason being, the usage of the final YER (after the consonnants) was abolished long time ago, in 1918. The presence, or the absence of the final YER changes nothing in the pronunciation of the words. Of course, logically, the word "BAR" (the top line) should end in the same way. This hard-sign spelling trick is as popular--and as credible--as the fake antique spelling like "Ye Olde Booze Shoppe".  <br> <br>As to the FEDOR/FYODOR spelling, the sound YO in Russian is expressed with the "E diaeresis" (Umlaut, tr</p>
