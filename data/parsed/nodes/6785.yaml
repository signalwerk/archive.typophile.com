    html: "<p>Thanks for the insights. I guess a sign for a bar can rarely be culturally very \"pure\". The YER business is especially amusing. It's fascinating though that the pre-Petrine \"A\" essentially survived via a truncated YA, while it didn't in its lone form. <br> <br>&gt; The YA originated as a digraph I-A but later lost its first part <br> <br>I guess the YA (I + O, graphically) never lost its elements? BTW, Cyrillic has so many letters based on or around the \"y\" sound - it's interesting to consider why. <br> <br>And about the YO: is there also a convention to make it curly (like in that sign) when you drop the diaeresis - or is that just another affectation? <br> <br>hhp</p>"
