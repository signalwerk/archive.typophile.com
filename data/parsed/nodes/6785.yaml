    html: <p>Hrant, can't argue here. I'd love to see some kind of research about this, maybe about legibility in general - interesting stuff... <br> <br>You inspired me to do a little research on Yo, and something interesting came up (<a href="http://yomaker.narod.ru/seven.htm" target="_blank">http://yomaker.narod.ru/seven.htm</a>) - the letter had most likely been personally invented by princess Ekaterina Daskhova in 1783 and first printed in 1795. In 1918 reform it was pronounced optional, and putting dieresis on top of yo was only recommended to avoid ambiguity. Still no clues about the reasons...But this really caught on. I guess nobody wants to look old-fashioned...</p>
