    html: "<p>Hrant, I haven't heard anything definite about that. My two guesses are that it actually improves legibility and that there was no Yo key on typewriters. <br> <br>Paul, I can think of examples of Ye becoming Yo, but here's an interesting fact: when present in any word, Yo is always the stressed vowel. No exceptions - and that in a language without any stress logic! So there's really no need for extra stress marks here. Although I wish we had them other than in schoolbooks - so many Russians mispronounce the stresses! As for Fyodor - if you're ever in Moscow, I'd love to join in with Hrant's reward idea<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> Can give you a few clues on good kvas joints<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
