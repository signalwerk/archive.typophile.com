    html: <p>that's what threw me for a loop, i thought it was "bar" but i guess they didn't really teach us that word at BYU. ;^) Most definately that's a hard sign and it appears that this is "Fyodor's Bar" (something about the stress on the E makes it become a YO, morphology was a long time ago!) i'm thinking this must be old lettering because modern grammar would give us "BAR FEDRA" (with an A at the end instead of a hard sign, but instead we get "BAR FEDORUH" where the hard sign actually gives the UH sound. Now that i've written all this someone who actually speaks russian is going to come clear all this up for you, hrant! ;^)</p>
