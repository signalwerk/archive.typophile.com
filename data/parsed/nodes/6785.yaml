    html: "<p>To answer the original question, both samples are definitely old-style, the first looking more like older books, and the second is quite typical iconic or church-style. The second one is rather common in religious books, has a few digital implementations. The first one is for sure handmade and quite craftily so. <br> <br>As for legibility, the funky A and D are only clear in a context. They are quite cleverly stylized, the Ya-looking A maybe even mimicked after an actual old sample (letter Ya was introduced later than A, so in absence of it, an A looking like this would raise no questions). But as standalone letters they are hardly identifiable. <br> <br>As for Z-looking E, this is the way all children are taught at school to handwrite the capital E. And yes, the last one is a hard sign - I like the slanting as it saves space making the letter more compact, fitting in a rectangle. Hard sign by the look, but in fact this is an abandoned in post-revolutionary reform letter Yat' (or Yeru in some literature), that read \"ye\" in some combinations and was silent in others, like here. Which is exactly the reason it was left behind. It looked liked a hard sign, but could have an extra downward stroke at the end of leftmost horizontal element. <br> <br>I have to disappoint you on the bar's name: it really is Fyodor, but it's a Russian version of Theodor - hardly a good idea for a women's bar<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">) The E is actually Yo - the dieresis is almost extinct, it's considered bad taste in professional publishing, although some type purists insist on Yo's revival. There's even a graphic design studio with a provocative name Yo-programma. <br> <br>Sorry some of this doubles Maxim's reply - I was lazy to rewrite when I saw it<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>And the racing poster is based on 20-30s constructivist designs. Remids of Rodchenko and Lisitsky. Check out these two samples from Russia's major font foundry: <br><a href=\"http://www.paratype.ru/default.asp?page=/library/newstyles.asp?fontcode=PT_RDK\" target=\"_blank\">http://www.paratype.ru/default.asp?page=/library/newstyles.asp?fontcode=PT_RDK</a> <br><a href=\"http://www.paratype.ru/default.asp?page=/library/newstyles.asp?fontcode=DA_RBR\" target=\"_blank\">http://www.paratype.ru/default.asp?page=/library/newstyles.asp?fontcode=DA_RBR</a></p>"
