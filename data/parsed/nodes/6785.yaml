    html: "<p>Looks constructivist. Which reminds me to point something out: in the west there's all this talk about the socialist constructivist style, all those famous Russian designers of the 20th century, etc. Well, on the actual streets of Moscow and Novosibirsk there's virtually none of that, only a tiny bit in some logos* and posters. It seems that style has made little impact on the stuff most people see on a daily basis - it just never really clicked** - it seems basically like a museum curiosity more than anything else, but you never read that reality in design books... <br> <br>* Maybe logos done by westerners.  :-/ <br> <br>** I attribute that to the Russian desire for decoration. And they do such a wonderful job of it - you see all these details in places small and large where somebody has wanted to express decoration. <br> <br>hhp</p>"
