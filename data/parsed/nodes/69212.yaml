    <p>It takes YEARS to understand the subtleties of a perfect letterform in the context of an infinite amount of combinations. Practically every person on the earth benefits from those years of training, the months or years invested in the creation a typeface, each letter carefully wrought by hand, and yet…</p>
    <p>The world yawns.</p>
    <p>I hate that.</p>
