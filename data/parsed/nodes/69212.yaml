    html: |-
      <p>The sewage/drainage system is an amazingly intricate and well-thought-out system and piece of engineering, invisibly making sure that every apartment in every building in our cities can easily and cleanly get rid of the sewage that just a few generations ago was spilled into open canals. We laymen can't even imagine the stink of centuries gone by as we conveniently pull the flush. Only when something starts to leak do we maybe realize that some thought went into making it all work, invisibly, under the surface, to make our lives easier. Only if a pipe breaks do we notice the smell.</p>
      <p>BTW, I'm not saying type is shit. :-) I'm saying there's a graceful, silent beauty in doing a job that remains invisible to many but works its magic mostly hidden under the "radar" of conscious appreciation. (It may help to regard type less as an "artform" and rather as a tool that can help people achieve results.)</p>
