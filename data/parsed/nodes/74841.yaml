    html: |-
      <p>When I say it makes things simpler, I mean things that would be tedious or time-consuming to do otherwise, like renaming hundreds of glyphs.</p>
      <p>Here are a few things that I've used Python and RoboFab for in FontLab:<br>
      - Renaming glyphs (especially when there are many)<br>
      - Automatically placing anchors in preparation for adding accents<br>
      - Manipulating composites in various ways<br>
      - Adding features and tools to FontLab (usually using scripts written by others)<br>
      - Importing and exporting UFO files<br>
      - Updating individual glyphs in external UFO files<br>
      - Running the Adobe autohinter<br>
      - Checking outlines and font integrity<br>
      - Generating fonts quickly for testing<br>
      - Manipulating masters in MM fonts<br>
      - Clearing hundreds of random master guidelines that sometimes get added because of a certain FontLab bug (FontLab has no "clear guidelines" command)<br>
      - Selecting a specific group of glyphs repeatedly (in different related fonts usually)<br>
      - Doing simple interpolations between two glyphs<br>
      - Manipulating outlines (adding bevels to corners, for example)</p>
      <p>Some of these I've done using scripts I've written myself, but most of the examples above I do with scripts written by others (some free, some paid for). </p>
      <p>For doing single fonts with basic character sets, the advantages might not be apparent, but once you start doing multi-weight families with hundreds of glyphs, it can make a big difference.</p>
      <p>I remember a few years ago when I was working on some changes to Proxima Nova, a 42-font family. I don't remember exactly what I was doing to it (it was a few years ago), but I needed to do a long series of steps to each font. Working as fast as I could using just the built-in commands in FontLab, doing all these tedious steps, which affected dozens of glyphs in each font, and being careful not to make mistakes, I got it down to around half an hour for each font. Facing days of doing such a mind-numbing task, I was motivated to figure out a way to speed things up using Python scripting (which I had not done much before). I went through all the steps and identified where the bottlenecks were and which things could be accomplished using scripting. It took me less than a day to write the scripts I needed, reducing the time to make the changes to a few minutes for each font. I remember that one step went from about a 15 minutes down to a few seconds. It literally saved me days worth of work, and I'm sure I couldn't have done it as accurately manually. And I would have been bored out of my mind.</p>
      <p>So, sure, it's possible to design fonts without using scripting, but when such a powerful lever is handed to you and the only cost is to take some time to learn how to use it, why not take advantage of it?</p>
