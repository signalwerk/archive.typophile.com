      <p>In the links below are some examples of what others have done to extend the features of FontLab, showing that using Python need not be complicated. Each of these was designed so that it looks and works like other features in FontLab, much the way plug-ins work in some programs. (Note: These are both commercial projects, but have free demo versions.) These are videos from the RoboFab conference back in early 2009.</p>
      <p>"Remix Tools": <a href="http://letterror.blip.tv/file/1911354/" title="http://letterror.blip.tv/file/1911354/">http://letterror.blip.tv/file/1911354/</a><br>
      ( <a href="http://remix-tools.com/" title="http://remix-tools.com/">http://remix-tools.com/</a> )</p>
      <p>"Autopsy" visual font auditor: <a href="http://letterror.blip.tv/file/1911264/" title="http://letterror.blip.tv/file/1911264/">http://letterror.blip.tv/file/1911264/</a><br>
      ( <a href="http://www.yanone.de/typedesign/autopsy/" title="http://www.yanone.de/typedesign/autopsy/">http://www.yanone.de/typedesign/autopsy/</a> )</p>
      <p>(Note: There are ads at the beginning of these that you can't skip, but they are short.)</p>
      <p>The Adobe autohinter is superior to FontLab's built-in autohinting. It's the tool that Adobe uses for all their fonts, and they provide it free along with their AFDKO (Adobe Font Development Kit for OpenType). It can be run from the command line on your computer, or from within FontLab by running a special Python script. ( <a href="http://www.adobe.com/devnet/opentype/afdko.html" title="http://www.adobe.com/devnet/opentype/afdko.html">http://www.adobe.com/devnet/opentype/afdko.html</a> )</p>
      <p>Regarding your last question, some kinds of fonts and projects will benefit more than others from the use of scripting, but all can benefit some.</p>
