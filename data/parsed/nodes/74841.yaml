      ( <a href="http://www.yanone.de/typedesign/autopsy/" title="http://www.yanone.de/typedesign/autopsy/" class="link-external">http://www.yanone.de/typedesign/autopsy/</a> )</p>
      <p>(Note: There are ads at the beginning of these that you can't skip, but they are short.)</p>
      <p>The Adobe autohinter is superior to FontLab's built-in autohinting. It's the tool that Adobe uses for all their fonts, and they provide it free along with their AFDKO (Adobe Font Development Kit for OpenType). It can be run from the command line on your computer, or from within FontLab by running a special Python script. ( <a href="http://www.adobe.com/devnet/opentype/afdko.html" title="http://www.adobe.com/devnet/opentype/afdko.html" class="link-external">http://www.adobe.com/devnet/opentype/afdko.html</a> )</p>
      <p>Regarding your last question, some kinds of fonts and projects will benefit more than others from the use of scripting, but all can benefit some.</p>
