    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Frutiger</strong></p>
    <p>This typeface was designed by <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> and was commissioned by the Charles De Gaulle International Airport in Paris for usage on directional signage. Frutiger is a <a href="/wiki/humanist" class="freelinking" rel="nofollow">humanist</a> <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans-serif</a>, and has become one of Adrian Frutiger’s best-known typefaces, along with <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>. The weight of the forms are much less monotone than Univers, and due to these subtle thicks and thins the typeface has far more character. Since the 1980s, the fonts have been available in digital form from <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>.</p>
    <p>Frutiger has been an extreme success, and in 2003 it has been revised (<a href="/wiki/ASTRA-Frutiger" class="freelinking" rel="nofollow">ASTRA-Frutiger</a>) for use on highway signage in Switzerland. In addition, the typeface was revised and updated in 1999 by Adrian Frutiger himself (together with <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>) to include true italics among other features; this typeface is called <a href="/wiki/Frutiger%20Next" class="freelinking" rel="nofollow">Frutiger Next</a>.</p>
    <p>The <a href="http://www.linotype.com" rel="nofollow">Linotype</a> website has overview pages showing all the weights of the <a href="http://www.linotype.com/469/frutiger-family.html" rel="nofollow">Frutiger type family</a> and <a href="http://www.linotype.com/53781/frutigernext-family.html" rel="nofollow">Frutiger Next</a>.</p>
