    <p>This typeface was designed by <a href="/node/12118/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Adrian Frutiger</a> and was commissioned by the Charles De Gaulle International Airport in Paris for usage on directional signage. Frutiger is a <a href="/node/79593/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Humanist</a> <a href="/node/12132/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">sans-serif</a>, and has become one of Adrian Frutiger’s best-known typefaces, along with <a href="/node/13516/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Univers</a>. The weight of the forms are much less monotone than Univers, and due to these subtle thicks and thins the typeface has far more character. Since the 1980s, the fonts have been available in digital form from <a href="/node/13697/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype</a>.</p>
    <p>Frutiger has been an extreme success, and in 2003 it has been revised (<a href="/node/add/wiki?edit%5Btitle%5D=ASTRA-Frutiger" title="Create node &quot;ASTRA-Frutiger&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">ASTRA</span>-Frutiger</a>) for use on highway signage in Switzerland. In addition, the typeface was revised and updated in 1999 by Adrian Frutiger himself (together with <a href="/node/13697/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype</a>) to include true italics among other features; this typeface is called <a href="/node/15609/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Frutiger Next</a>.</p>
    <p>The <a href="http://www.linotype.com" class="link-external">Linotype</a> website has overview pages showing all the weights of the <a href="http://www.linotype.com/469/frutiger-family.html" class="link-external">Frutiger type family</a> and <a href="http://www.linotype.com/53781/frutigernext-family.html" class="link-external">Frutiger Next</a>.</p>
