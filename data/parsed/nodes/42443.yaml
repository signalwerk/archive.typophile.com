    html: |-
      <p>Things to look at for Spanish cuisine: every publication affiliated with El Bulli.  If you can find a shop that sells high-end cookbooks, go ask for everything by or associated with Ferran Adrian - the design on all their cookbooks &amp; products is top-notch and very Spanish.  For Scream (who's doing stuff that's somewhat similar to El Bulli's approach to ice cream), I almost went with <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> by the Italian type designer Alessio Leonardi. You might want to check out his website for his other faces.</p>
      <p>Good luck!</p>
