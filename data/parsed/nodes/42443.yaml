      <p>First loose the stroke on the type. It will become a production problem when you use it at different sizes. Unless you want to spent a ton of time making rules for how thick the stroke is at different sizes. In general its just a bad idea. </p>
      <p>My next question is are those Spanish colors? Look vaguely Italian to me.</p>
      <p>Lastly open up the ro combination. Its the only combination that almost touches, it looks wrong. The el might be a tad to open as well. Good start keep going</p>
