      <p>The more I look at it, the more the little chef's hat appears off-center to me.  It's driving me a little crazy - is it just me?</p>
      <p>Anyway, I would suggest that you use the paella as the inspiration for the design rather than the fact that Pedro is a chef.  I assume most people will assume that Pedro is the one who prepared the dish.  Paella is a such a fun thing to eat ... rice full of meaty prizes!!! Plus, typically when I have ordered it, it's for two, making it a social, even romantic, dish to eat.</p>
      <p>Anyway, I really like paella (obviously), but I still think that the dish is the core idea to drive the design.</p>
