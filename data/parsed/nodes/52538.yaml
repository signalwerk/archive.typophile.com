  html: |-
    <p>A fresh new decorative display face bubbling with life &amp; spontaneity,<br>
    Jabberwub belongs to a rare genus of creature fonts that type<br>
    forgot—casual animated. A fun &amp; bouncy eye-catcher dancing a whacky<br>
    line between discord &amp; rhyme, Jabberwub packs tons of fun into a<br>
    state-of-the-art OpenType font loaded with 270 extra glyphs, including<br>
    stylistic alternates, discretionary ligatures, word ligatures and<br>
    capitalized ligatures, allowing creative typographers to achieve a<br>
    custom hand-lettered look without all the mess &amp; spilt glue of a<br>
    manual paste-up job.</p>
    <p>Jabberwub is ideal for whatever zany stuff springs to mind. It takes<br>
    an outline with no problem-o, and you can squish &amp; squoosh it as the<br>
    occasion takes your fancy. Optimal results are achieved by hand<br>
    setting each individual glyph. Available in OpenType only.</p>
    <p>Jabberwub can be viewed and test driven now at Myfonts:<br>
    <a href="http://www.myfonts.com/fonts/sentinel/jabberwub/" title="http://www.myfonts.com/fonts/sentinel/jabberwub/">http://www.myfonts.com/fonts/sentinel/jabberwub/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/3050010872_dc589a558a_3501.jpg"></div><p></p>
