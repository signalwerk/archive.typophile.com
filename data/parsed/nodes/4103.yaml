  html: |-
    <p>I Find myself here, 1:57am unable to sleep -- nothing new really -- browsing through the latest issue of 'print' (magazine). Now it has been some time since I have read print -- and by read I actually mean 'reading' -- or any other 'design' magazine. I have recently started taking home these periodicals that have been piling up at the studio for the past few years. Tonight been one of the previously mentioned 'sleepless nights', I decide to pull out the latest issue and give it the once through. The issue contains a few good articles, one notably on clearview (the font)and its designers. But back to my original rant, has anyone seen the art direction of this magazine? More clearly the type setting? You would think a magazine of design -- printed design -- and one expressing 'opinions' on type and type design would in the least be set half way decent? I would provide scans, but as previously noted, Im in bed <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. Im not even asking for anything great, like using type that does not come bundled with Adobe apps, but maybe something as simple as hanging punctuation. Is this too much to ask? I can't remember exactly what print looked like a year or so ago, but I don't rmemeber anyhting this lifeless, and dare I tout 'unprofessionally set'? <br> <br>Curious if I'm the only one with these thoughts. <br> <br>Hildebrant.</p>
