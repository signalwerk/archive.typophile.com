    <p>Hi everyone!<br>
    I'm trying to identify what font(s) were used on this dial plate for a Watterson Radio that my dad is working on restoring, and having a hard time pinning down the exact font. It seemed similar to Futura with a few differences here and there. The radio was produced around the 1940's before the US entered World War II, so there weren't many of them made:<br>
    <a href="http://www.radiomuseum.org/r/watterson_78.html" title="http://www.radiomuseum.org/r/watterson_78.html">http://www.radiomuseum.org/r/watterson_78.html</a></p>
    <p>I have the dial plate scanned if that helps out with identifying what font(s) was used on it. You can click on the image to see its full size:<br>
    <a href="http://i.imgur.com/44lCUv2.jpg" target="_blank" rel="nofollow"><img src="http://i.imgur.com/44lCUv2.jpg" width="500"></a></p>
    <p>In the event that it's actually made specifically for those radios, is there something similar that could be used? Thanks for your time!</p>
