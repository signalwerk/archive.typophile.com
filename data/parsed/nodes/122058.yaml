      <p>Almost all letterings for gauge/dial are custom/hand-done/un-digitized.<br>
      0123456789: '<a class="freelinking external" href="http://www.myfonts.com/search/tag%3Agaspipe" rel="nofollow">gaspipe</a>' close to <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/itc-bolt" rel="nofollow">Bolt</a> ITC; alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/aerotype/pacifico" rel="nofollow">Pacifico</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/elephantmen" rel="nofollow">Elephantmen</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/elephantmen-great-and-tall" rel="nofollow">Great and Tall</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontry/american-captain" rel="nofollow">American Captain</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontry/avengeance" rel="nofollow">Avengeance</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontry/earth-a-d" rel="nofollow">Earth A.D.</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontry/arb-66-neon-block-jun-37-cas" rel="nofollow">ARB 66 Neon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontry/cfb1-captain-narrow" rel="nofollow">CFB1 Captain Narrow</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/drop-case" rel="nofollow">Drop Case</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/home-room" rel="nofollow">Home Room</a>, FF <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-motel-gothic" rel="nofollow">Motel</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-matinee-gothic" rel="nofollow">Matinee</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-goldengate-gothic" rel="nofollow">GoldenGate</a> Gothic,<br>
      AMERICAN/BROADCAST/POLICE/AMATEUR/FOREIGN: very '<a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a>'; you may like <a class="freelinking external" href="http://www.houseind.com/fonts/neutraface" rel="nofollow">Neutraface</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/metallophile-sp8" rel="nofollow">Metallophile</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/uomo" rel="nofollow">Uomo</a><br>
      WATTERSON: even if that's not completely it, I like the approach of Dan Cassaro with his <a class="freelinking external" href="http://youngjerks.com/#/highway-typeface" rel="nofollow">Highway</a> typeface</p>
