    html: |-
      <p><em>Even if I cannot tell the difference, does that mean I should not be asking for input? </em></p>
      <p>Yes, that's exactly what it means. It's kinda like hiring a mechanic to fix your car, and then asking random people walking by if he should replace your brakes or not. Or hiring a guy to paint your house, then wandering into a supermarket and asking people if your hired painter should strip the old paint off, then ask the teenage florist which type of paint and brushes your professional painter should use. Then, go back to your painter and tell him what the florist thinks. Would you ever do that? </p>
      <p>And yes, the opinion of the logos <strong>DOES</strong> change knowing you're not the designer. A logo designer has already done all the homework and research in an attempt to visually communicate the client's message. The client hires a designer because they don't have this skill set --- they often think it's all about "knowing how to draw using a computer" and nothing more. </p>
      <p>So, when a professional designer posts here looking for advice, they're looking for <strong>technical</strong> advice. Kerning issues? Message clear? Style match target market? When a client posts here looking for advice, they're looking for strangers to undercut their designer's decisions. </p>
      <p>So, technically? Your designer is very skilled. The worst part of this logo is the tag line -- which I'm guessing you insisted on, and your designer tried to talk you out of it. So, my advice to you is to give your designer creative freedom and I'll bet the results will be even better. If your message isn't getting through, that's probably because you're not communicating it to your designer. We have no way to tell that here on a forum....</p>
