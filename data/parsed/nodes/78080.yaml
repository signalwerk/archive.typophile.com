    html: |-
      <p>If you're not the graphic designer creating this Avanti Cart logo, it's REALLY not cool to post the work in progress here. If you don't trust your designer, hire a different one, but you really shouldn't be asking random strangers on the internet to appraise his/her work. A designer is creating work based on your input and your company profile, so us random strangers can't judge fairly without knowing all the same information. </p>
      <p>This forum is primarily for technical advice, but clearly, you're not doing the technical work. Just because there are professional, talented and experienced designers here doesn't mean there aren't also tons of totally uneducated wannabees here, too. I'd say it's about 30% pro, 70% wannabee. Can you tell the difference? No offense, but I really doubt it. Design by committee is probably the #1 most destructive roadblock to creating effective design, and you're including the whole world in your "committee."  </p>
      <p>Furthermore, you don't own the copyrights to these designs, and by posting them here you're not only breaking the law, you're opening them up to being stolen. Designers often reuse rejected ideas on new projects; now, your designer can't do that. </p>
      <p>If you were my client....I'd quit.</p>
