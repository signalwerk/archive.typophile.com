    html: |-
      <p>Just to finish my first metaphor....</p>
      <p>If you're not a mechanic, and you hired one but then asked a bunch of random strangers about fixing your brakes, do you think you'd be capable of judging which random stranger's feedback is worthy? No, probably not. If you knew how to fix brakes, you wouldn't need to hire a mechanic. Even if you did know (how to fix brakes) but still hired a mechanic to do the work, you'd know enough about cars to know the mechanic was fixing them correctly. </p>
      <p>The mechanic asking for advice is totally different --- the mechanic knows which advice is valuable because he knows cars. Not only don't you know cars in this metaphor, mihaibrehar, you <strong>also</strong> don't know how truly little you ever knew about cars in the first place. </p>
      <p>And you're making your poor designer defend him/herself against every non-mechanic that happens to wander by, because you really don't know which advice is valid. If you knew, you wouldn't be asking on a forum.</p>
