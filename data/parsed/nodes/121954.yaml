      <p>Farfa looks like a reasonable choice for body copy.</p>
      <p>If, however, by "legible", one means a <em>conventional</em> body type, with only a nod in the direction of keeping the same feel, maybe a Jenson of some sort is what is sought. Centaur, for example, might be considered.</p>
      <p>A conventional roman that just nods a little bit in the direction of the calligraphic... I can't think of one offhand. That is, I can't think of one that nods just a little bit <em>more</em> than Hermann Zapf's Palatino.</p>
      <p>Or a calligraphic typeface that is still <em>very</em> close to a conventional Roman - also something I've been looking for, and have not encountered.</p>
      <p>There is Goudy Thirty, but while I'm definitely <strong>not</strong> going to recommend that, there could be something like that in Goudy's œuvre.</p>
      <p>Looking for one, I came across "Goudy Newstyle", but that was apparently made for a Shaw Alphabet-style project, although it looks like a conventional typeface.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Goudy_Newstyle_r_4421.jpg"></div><p></p>
      <p>(Hey, looking at the p and q, and to a lesser extent, the b and d, this could be pitched as a font for dyslexics!)</p>
      <p>Amazingly enough, it <em>is</em> available in digital form - or it was; the links I've turned up to fonts by Red Rooster and Richard Beatty are coming up dry.</p>
      <p>However, I <em>was</em> able to find <a href="/wiki/https%3A/%252Fwww.fontshop.com/families/jenson-eusebius-new-style" class="freelinking" rel="nofollow">Jenson Eusebius New Style</a>, which I think is even better.</p>
