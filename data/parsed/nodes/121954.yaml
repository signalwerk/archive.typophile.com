      <p>It’s OK to use a newer face for body.<br>
      Back in the day, the principle was to use progressively newer lettering styles as one proceeded down the hierarchy of type size, on the manuscript page.</p>
      <p>I recommend two of my neo-incunabula styles, <a href="http://www.myfonts.com/fonts/shinn/paradigm/webfont_preview.html" rel="nofollow">Paradigm</a> and <a href="https://www.myfonts.com/fonts/shinn/goodchild/webfont_preview.html" rel="nofollow">Goodchild</a>.<br>
      Paradigm, loosely inspired by Ratdolt’s work, has a kind of built-in distress parsing the effect of letterpress, or looking like it was done with a calligraphic pen at the small size limit of its ability.<br>
      Goodchild is a robust Venetian, a Jenson revival, with a large x-height.<br>
      So both styles will hold up very small.</p>
      <p>(For a fuller-featured Goodchild, please contact me directly.)</p>
