    <p>Hi all, I'm looking for some advice on choosing a body copy typeface...</p>
    <p>I'm designing a logo for a client based on the hebridean isles off the west coast of Scotland, currently in the concept stage and not far from presenting these back to her. The logo is part of an identity job relating to a bespoke tartan which has been commissioned, and will be sold through gift shops.</p>
    <p>The hebrides and west coast of Scotland have strong ties to Ireland going back to the days of St Columba, who founded his famous abbey on the island of Iona:<br>
    <a href="http://en.wikipedia.org/wiki/Columba" title="http://en.wikipedia.org/wiki/Columba">http://en.wikipedia.org/wiki/Columba</a><br>
    <a href="http://en.wikipedia.org/wiki/Iona" title="http://en.wikipedia.org/wiki/Iona">http://en.wikipedia.org/wiki/Iona</a><br>
    <a href="http://en.wikipedia.org/wiki/Hebrides" title="http://en.wikipedia.org/wiki/Hebrides">http://en.wikipedia.org/wiki/Hebrides</a></p>
    <p>The client has expressed a wish for me to include a calligraphic, manuscript looking face like Ophelia (<a href="https://www.fontfont.com/fonts/ophelia" title="https://www.fontfont.com/fonts/ophelia">https://www.fontfont.com/fonts/ophelia</a>), Omnia (<a href="https://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFont&amp;code=OMNQ10005000" title="https://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFont&amp;code=OMNQ10005000">https://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event...</a>) or Carolus Magnus (<a href="https://www.myfonts.com/fonts/fontfont/ff-carolus-magnus/" title="https://www.myfonts.com/fonts/fontfont/ff-carolus-magnus/">https://www.myfonts.com/fonts/fontfont/ff-carolus-magnus/</a>)</p>
    <p>However, I'm finding it hard to pair these blackletter/uncial faces with a legible body face for extended pieces of copy whilst keeping the same feel. Can anyone suggest anything which might be suitable?</p>
    <p>Thanks, Lee</p>
