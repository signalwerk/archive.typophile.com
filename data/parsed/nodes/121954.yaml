      <p>An interesting project to be sure!<br>
      I can see various possibilities, based on constrains and design choices.<br>
      There are faces suitable for body text with more or less subtle references to celtic/uncial/insular styles.<br>
      The questions I think one should answer in order to narrow the search could be:<br>
      - There need to be just one typeface, or there could be two (one more calligraphic for headers and such, and a "tamed" one for texts)?<br>
      - How long would texts be (longer text = tamer typeface)?<br>
      - There will be need of emphasis inside the texts? And, if so, it should be expressed with italics or it could be other means (darker weight, colour, a different style)?<br>
      - As always, expected language coverage should be taken into account.</p>
      <p>A couple of typefaces that could fit the bill, devoid of any historical or stylistic accuracy (found looking for "uncial text"):<br>
      <a href="http://www.myfonts.com/fonts/eurotypo/farfa/" title="http://www.myfonts.com/fonts/eurotypo/farfa/">http://www.myfonts.com/fonts/eurotypo/farfa/</a><br>
      <a href="http://www.myfonts.com/fonts/delve/rieven-uncial-pro/" title="http://www.myfonts.com/fonts/delve/rieven-uncial-pro/">http://www.myfonts.com/fonts/delve/rieven-uncial-pro/</a></p>
      <p>For a more modern take, SIAS' Hibernica could be an interesting choice. Perhaps paired with its elder sister Lapidaria for a wider range of styles and permutations:<br>
      <a href="http://www.myfonts.com/fonts/andreas-stotzner/hibernica/" title="http://www.myfonts.com/fonts/andreas-stotzner/hibernica/">http://www.myfonts.com/fonts/andreas-stotzner/hibernica/</a><br>
      <a href="http://www.myfonts.com/fonts/andreas-stotzner/lapidaria/" title="http://www.myfonts.com/fonts/andreas-stotzner/lapidaria/">http://www.myfonts.com/fonts/andreas-stotzner/lapidaria/</a></p>
