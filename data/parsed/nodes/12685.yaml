    html: |-
      <p>If I recall correct, Hellenica is a font for modern Greek from Linguist’s Software (does not support polytonic, which explains why the diacritics don’t line up right).  I have never used any of Linguist’s Software Greek fonts so I can’t speak about the encoding they use.  John Hudson’s suggestion of a Word macro to do search and replace is what I would probably do myself.</p>
      <p>If you determine that the font uses one of the several encodings used for polytonic Greek in pre-Unicode days, then Sean Redmond’s converter could help you: <a href="http://www.jiffycomp.com/smr/unicode-converter/">http://www.jiffycomp.com/smr/unicode-converter/</a> .  It converts from several widely used encodings into Unicode.</p>
      <p>David</p>
