  html: |-
    <p>I am setting a book that includes the polytonic (ancient) Greek alphabet. The Word document that I am pouring into InDesign has the Greek set in Hellenica, which has really large word space and unacceptably offset diacritical marks. I am setting the book in Minion Pro, which contains the appropriate glyphs, but when I selected the Hellenic text to change it into Minion, the Greek letter forms are replaced by Roman letter forms. It looks like the Unicode values for equivalent glyphs in each font, e.g. the Hellenica alpha and the Minion alpha, have different unicode values.</p>
    <p>I’m about to start setting a Greek-heavy chapter and would prefer to not have to manually change each glyph.</p>
    <p>Can you offer any suggestions?</p>
    <p>Many thanks in advance,</p>
    <p>Bryan</p>
