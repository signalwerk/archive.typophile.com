      <p>Thank you for your assistance. I used the Redmond uni-code converter. It couldn’t handle the diacritical marks, but did successfully convert all of the unmarked glyphs in the text. It still took several tens of hours to do (and I shudder to think how many subscript iotas I dropped out in the process), but much less time than without the converter.</p>
      <p>Again, your quick suggestions are greatly appreciated.</p>
      <p>I’ll be ready for Word to handle OpenType.</p>
      <p>Bryan</p>
