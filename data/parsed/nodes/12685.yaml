    html: <p>I’m guessing that the Hellenica font uses a hack 8-bit encoding for polytonic, rather than Unicode, and the Word doc uses this hack encoding. You are going to need to re-encode that Word document. The easiest way to do this is probably in Word, prior to copying/pasting to InDesign, using a macro. The macro will need to search/replace each hacked character in the Hellenica encoding and convert it to the correct Unicode character.</p>
