    html: |-
      <p>Actually, the later releases of Word do handle Unicode — you don’t really have to have OpenType in the Word documant. See, for example,</p>
      <p><a href="http://www.myfonts.com/info/opentype-support-in-applications/">http://www.myfonts.com/info/opentype-support-in-applications/</a></p>
      <p>As you can see, for everything to work out, both your platform and Word version and the authors platform &amp; version of Word must support Unicode, and the font must use Unicode indicies, which right now means TrueType.</p>
      <p>Your problem was the fonts from Linguists Software — All of their fonts I’m aware of use, as John suggested, the 8-bit format with “inappropriate” names, not Unicode indicies. This “inappropriatness” isn’t an error on their part, it is caused by most composition systems not allowing the use of a custom encoding vector.</p>
      <p>We’ve taken Word documents with polytonic Greek straight to comp when the font used in Word was Palatio TT (Unicode). I believe the customer wanted the job set in Palatino, but with the Unicode there, we could have set in in Minion OpenType CFF with no extra effort.</p>
