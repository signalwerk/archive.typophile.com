    html: "<p>Joseph: <br>&gt;Can any Chinese here comment as to how that  <br>&gt;lettering concept (not its mediocre-looking execution)  <br>&gt;affects you?  <br> <br>I'm not Chinese, but as Japanese writing systems are basically derived from Chinese, I think I can comment on this. :-) <br>Well, I don't appreciate the concept of Chinese brushstroke style applied to Latin letterfoms. I think of it as a caricature too. The worst thing is that, very often, Chinese/Japanese people use this kind of lettering themselves. It's like \"self-caricature\"... :-/ <br>This Beijing-2008 lettering is quite acceptable though. The execution, I mean. <br> <br> <br>Hrant: <br>&gt;it makes sense that a logography is better than <br>&gt;an alphabet for logos! <br> <br>(?) It sounds so obvious that I think I'm not getting what you meant here. ;-) <br>Anyway, I don't like this Beijing-2008 logo. The lettering is better. I think the \"metaphor\" is too obvious here. There's no subtlety. The original Chinese ideogram is almost unrecognizable. And, in my humble opinion, it could be better executed.</p>"
    html_clean: "<p>Joseph: <br>&gt;Can any Chinese here comment as to how that  <br>&gt;lettering concept (not its mediocre-looking execution)  <br>&gt;affects you?  <br> <br>I'm not Chinese, but as Japanese writing systems are basically derived from Chinese, I think I can comment on this. :-) <br>Well, I don't appreciate the concept of Chinese brushstroke style applied to Latin letterfoms. I think of it as a caricature too. The worst thing is that, very often, Chinese/Japanese people use this kind of lettering themselves. It's like \"self-caricature\"... :-/ <br>This Beijing-2008 lettering is quite acceptable though. The execution, I mean. <br> <br> <br>Hrant: <br>&gt;it makes sense that a logography is better than <br>&gt;an alphabet for logos! <br> <br>(?) It sounds so obvious that I think I'm not getting what you meant here. ;-) <br>Anyway, I don't like this Beijing-2008 logo. The lettering is better. I think the \"metaphor\" is too obvious here. There's no subtlety. The original Chinese ideogram is almost unrecognizable. And, in my humble opinion, it could be better executed.</p>"
