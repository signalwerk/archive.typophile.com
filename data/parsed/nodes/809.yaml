    html: <p>&gt; "self-caricature" <br> <br>Just like Latin handwriting fonts?  :-) <br> <br>&gt; I think I'm not getting what you meant here. <br> <br>Since an alphabet sequences phonetic codes to make a sound that's a word, the results aren't "elemental" in the way of a logography. <br> <br>&gt; The original Chinese ideogram is almost unrecognizable. <br> <br>Is it possible that it's not a character used in Kanji (Chinese loan to Japanese), or maybe it looks different in Kanji? My computer bag has four Chinese characters on it, and I once asked a Chinese, a Japanese and a Korean person to read them to me. The Japanese and Korean only got 3 right. <br> <br>Try your hand at it! <br> <br><img src="http://www.typophile.com/forums/messages/30/13694.gif" alt="bag.gif"> <br> <br>hhp <br></p>
