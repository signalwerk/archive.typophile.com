    html: "<p>No, they got the second one wrong: they also read it as \"bureaucrat\" or \"government official\" or at best \"important person\". Or actually, maybe not totally wrong, but they failed to read the first two <i>together</i> as \"heavenly being\". The third is \"gift\". But I think you did pretty well overall!  :-) <br> <br>The Mandarin reading of it is something like \"tin gao chou foo\", which in English (or Chinglish) means \"heavenly being give you gift of good fortune\". <br> <br>The letters aren't drawn, they're stitched onto the front of the bag - I got it from Bangkok's chinatown. <br> <br>-- <br> <br>Now I'll wait for Keith to correct everything I just wrote!  :-) <br> <br>hhp <br></p>"
