    html: "<p>Hi guys. Didn't see this thread until now. Nice observations and comments from you non-Chinese! <br> <br>I think the whole design is horrible! A totally stereotypical, 'Chinatown' approach: red Chinese zeal, pictographic character complete with a supposedly 'calligraphic' typeface! Yikes! There's simple nothing new about it. <br> <br>There's much more to Chinese culture than zeals and calligraphy. We're in the 21st century, man! Everything about this identity is clich</p>"
