    html: <p>That's pretty interesting, the lettering under the symbol. <br> <br>I've never dabbled in such lettering, the kind of stretching of a caricatured Chinese calligraphic brushstroke around the latin letterform. <br> <br>Of course, there's been, at least during the latter part of the 20th century, a broad range of such type styles. Generally used for lower-class (for lack of better english at the moment) settings. <br> <br>Such lettering has always struck me (as an omnicient observer) as a negative caricature. The way the old 'Charlie Chan' movie character seems to strike so many people today. <br> <br>Can any Chinese here comment as to how that lettering concept (not its mediocre-looking execution) affects you? <br> <br>Is it an acceptable caricature? Or is it just benign? <br> <br>Is it appropriate for such a logo, regardless of who the logo might be targeted to? <br> <br>Thanks! <br> <br>Joe <br> <br></p>
    html_clean: <p>That's pretty interesting, the lettering under the symbol. <br> <br>I've never dabbled in such lettering, the kind of stretching of a caricatured Chinese calligraphic brushstroke around the latin letterform. <br> <br>Of course, there's been, at least during the latter part of the 20th century, a broad range of such type styles. Generally used for lower-class (for lack of better english at the moment) settings. <br> <br>Such lettering has always struck me (as an omnicient observer) as a negative caricature. The way the old 'Charlie Chan' movie character seems to strike so many people today. <br> <br>Can any Chinese here comment as to how that lettering concept (not its mediocre-looking execution) affects you? <br> <br>Is it an acceptable caricature? Or is it just benign? <br> <br>Is it appropriate for such a logo, regardless of who the logo might be targeted to? <br> <br>Thanks! <br> <br>Joe <br> <br></p>
