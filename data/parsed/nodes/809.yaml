    html: "<p>&gt;Just like Latin handwriting fonts? :-)  <br> <br>Ha! Good one! ;-) <br> <br>&gt;Is it possible that it's not a character used in Kanji (Chinese <br>&gt;loan to Japanese), or maybe it looks different in Kanji? <br> <br>Actually, the ideogram used there seems to be in the \"ancient\" style. AFAIK, it's not actually used anymore, in current language. Anyway, it's not that important, and it's not what bothers me most on that logo. <br> <br>&gt;The Japanese and Korean only got 3 right.  <br> <br>I assume they misread the 3rd one (top to bottom)? <br>It looks ambiguous to me. <br> <br>&gt;Try your hand at it!  <br> <br>1st: \"ten\"= heaven <br>2nd: \"kan\"= bureaucrat, government (according to the online dictionary, I think there are other meanings, but I can't remember right now) <br>3rd: ? <br>4th: \"fuku\"= fortune, luck <br> <br>All of them in Japanese pronounciation. <br>Did I embarass myself, giving you all wrong answers? ;-) <br>Who drew those letters in your bag? What's the 3rd one? <br>Now I'm curious to know what it means (the whole word)!</p>"
