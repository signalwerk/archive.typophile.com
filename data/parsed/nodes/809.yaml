    html: "<p>Perhaps we need a new Greek type thread? <br> <br>The change in fashion of Greek type design to which Hrant refers is not intrinsically related to either the change from polytonic to monotonic (never complete) or the longer history of language change. In the late 1960s and early 1970s, Greek graphic designers and publishers wanted types that were 'modern' and which looked as much as possible like the popular Latin types of the time. Linotype, who had a virtual monopoly on typesetting systems in Greece, duly provided Greek designs of bestselling families like Helvetica, Baskerville and New Century Schoolbook. In all these designs, drawn by Matthew Carter, a deliberate effort was made to introduce as many Latin forms as possible, and to attach serifs wherever possible (Matthew jokes that he was surprised the Greek clients didn't ask for serifs on Helvetica). The proportions of the letters in these designs derive directly from the Latin (themselves constrained by the unit measurements of previous typesetting systems), rather than being tailored to the Greek alphabet and the frequency of letter combinations in typical Greek texts. Wherever possible, Greek letters were formed simply by adding to, subtracting from or rotating Latin forms; the Helvetica Greek lowercase sigma, for example, is simply a latin o with a stick coming out the side. To be fair to Matthew and his colleagues at Linotype, who now acknowledge that these designs are neither attractive in themselves nor authentically Greek, it is necessary to state again that this is what the Greek market wanted. <br> <br>In 2001, when Linotype asked me to work with them to develop a large 'core font' version of Helvetica supporting multiple scripts. I suggested that we redesign the Cyrillic and Greek from scratch, rather than using Matthew's 1970s version. Linotype deserve a round of applause for agreeing to this and paying for the design of a new, more authentic Greek rather than using what they already had. It's still Helvetica, of course, so there is only so much one can do in the way of beauty and readability, but I think this comparison illustrates the difference in approach to Greek type design as it has changed over the past thirty years: <br><img src=\"http://www.typophile.com/forums/messages/30/13854.jpg\" alt=\"Helvetica Greeks\"></p>"
