ready had. It's still Helvetica, of course, so there is only so much one can do in the way of beauty and readability, but I think this comparison illustrates the difference in approach to Greek type design as it has changed over the past thirty years: <br><img src=\"http://www.typophile.com/forums/messages/30/13854.jpg\" alt=\"Helvetica Greeks\"></p>"
