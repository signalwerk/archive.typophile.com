    html: <p>i went through my book. unfortunately it didnt have much info. <br>In the 15th-18th century most greek fonts were based on calligraphy and handwriting. From the beginning of the 19th century until today there have been some unique greek fonts, many feature serifs and remind us of byzantine writing. In the 50's most typographers used linotype, in the 60's it was monotype and in the 70's it was offset and phototypesetting. <br>here are a couple of pics  <br> <br><img src="http://www.typophile.com/forums/messages/30/13934.gif" alt="01"> <br><img src="http://www.typophile.com/forums/messages/30/13935.gif" alt="02"> <br><img src="http://www.typophile.com/forums/messages/30/13936.gif" alt="03"> <br> <br>first one is self-explanatory i guess <br>second one was printed 1952, it's from the textbook of first grade - elementary school (they kept that book intact for 20-25 years) <br>last one is my silly handwritting, just pointing out alternative ways of drawing some of the letters <br> <br>about the sigma sign, most ppl use the alternative way of drawing it, as it shows in 03.gif above. The sigma is for sure one stroked without reversal , and the way to draw it is to start making the circle from the highest point at the top and when you finish it to draw the horizontal line, all in one stroke (if you start by making the line first, you'll eventually end up making the alternative version). What i meant by that "in essence the sigma is an o with a line coming out of it" is that geometrically, that's what distinguishes it from the rest of the letters. How do you know that the shape you are looking at is in fact a sigma? </p>
