    html: "<p>Nick wrote: <i>For instance, both pi and upsilon have straight vertical stems in the Carter version, but in yours the pi has straight legs, but the upsilon is quite curved. What principle are you using to determine whether stems are straight or curved?</i> <br> <br>Do you mean pi or psi? I'm guessing the latter. <br> <br>It came down to a question of what works: the upsilon desperately needs the entry stroke and the curved right side. I could have carried this over to the psi, but I didn't want the whole design becoming too cursive: I wanted to maintain some of the rigidity that is a hallmark of Helvetica. The psi works okay with the straight sides, and is a much less common letter than upsilon, so I think it can afford to carry the rigidity.</p>"
