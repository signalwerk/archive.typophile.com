    html: "<p>Rodolfo, thanks for pointing out that link - I'm not familiar with Paul Haeberli's work, but found a working link here: <br> <br><a href=\"http://www.otherthings.com/uw/alphabet/\" target=\"_blank\">http://www.otherthings.com/uw/alphabet/</a> <br> <br>I followed a similar process at first - digging through hundreds (maybe thousands) of glyphs looking for characteristics that might match a Latin alphabet. In the end, however, I ended up redrawing and reinterpreting the forms myself. (A dangerous thing to do, without knowing what some of the shapes might mean!) I've been meaning to have a native Japanese reader look over the font before formally releasing it, to ensure that there's not anything overly offensive embedded in it.</p>"
