    html: <p>&gt; The sigma is a single stroke <br> <br>While I would say that the sigma is a sigma, and not any other letter. So the further it is from other letters (and not necessarily just those in its own alphabet) the better - as long as the requirements of decipherability and "belonging" are adequately met. <br> <br>The most important parts of a letter are its acrocratic features. Often there are things other letters don't have - in the case of the sigma, its horizontal protrusion. So you could say that the sigma is a stick with a "o" coming out of it!  :-) <br> <br>But ideally you want to reduce the "o"-ness of its "o", maybe even by breaking it. <br> <br>hhp <br></p>
