    html: <p>The idea, in the hands of a better designer, might've worked. But in this case the execution is just really amateurish. <br> <br>They might have gotten away with it if they had done the red part better, but there is no way in hell they could've gotten away with the chop suey lettering. <br> <br>I always thought it was only the non-Chinese who would use such Chinese take-out font in association with all things Oriental (Chinese, Japanese, Asian, etc) I had always put it down to a lack of understanding of the Chinese culture on the part of the designers. <br> <br>But as I come across more of such designs done by Chinese themselves or commissioned by Chinese, I think it has less to do with understanding the Chinese culture than understanding design. <br> <br>&gt; Can any Chinese here comment as to how that lettering concept (not its mediocre-looking execution) affects you?  <br>I cringe. <br> <br>&gt; Is it an acceptable caricature? Or is it just benign?  <br>I think it's unacceptable. But seeing that the "clients" are Chinese themselves... <br> <br>It can't say it's the brush strokes that broke the lettering, and made it a caricature. Because I have <a href="http://www.srt.com.sg/03/html/Productions/forbidden_city.html">here</a> a good example of brush stroke lettering. Also used for a Chinese-related subject. <br></p>
