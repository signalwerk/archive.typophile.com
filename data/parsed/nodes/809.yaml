    html: "<p>i think the red seal thingy is decent, but the lettering just plainly sucks. reminds me of some horrible chinese restaurants' logos and cheap online freefonts. the bid thing is so much better. Anyway, it seems that ppl designing for the olympics tend to use \"traditional\" elements of the country's culture and stuff <br>see for example the one for the olympics next year <br><a href=\"http://www.2004.gr/Templates/5615/IMG0.gif\" target=\"_blank\">http://www.2004.gr/Templates/5615/IMG0.gif</a> <br> <br>i think it's good, not anything special, but yet good.. thank god they didnt use some ancient looking greek font. <br>what really sucks is the mascot selection - these are supposed to look like dols made around 700 b.c. <br>(they are in the top right  <br><a href=\"http://www.2004.gr/files/aboutathens2004/pins.jpg\" target=\"_blank\">http://www.2004.gr/files/aboutathens2004/pins.jpg</a> <br><a href=\"http://www.neolaia.de/2opseis/DaneiaeeU/periodiko10/Iaoeuo_2004/foibos.jpg\" target=\"_blank\">http://www.neolaia.de/2opseis/DaneiaeeU/periodiko10/Iaoeuo_2004/foibos.jpg</a> <br> <br>oh, and also we should be really happy that the olympics are returning to their country of birth, getting rid of all that commercialisation: <br><a href=\"http://www.2004.gr/page/default.asp?la=2&amp;id=2025\" target=\"_blank\">http://www.2004.gr/page/default.asp?la=2&amp;id=2025</a> <br>good god, they even sell toilet paper and boxer shorts with those 2 silly things on them <br> <br>the olympic torch has to be the best designed item, the industrial designer who made this was inspired by the olive's leaves <br><a href=\"http://www.2004.gr/page/default.asp?id=9143&amp;la=2\" target=\"_blank\">http://www.2004.gr/page/default.asp?id=9143&amp;la=2</a> <br>------------- <br>when i first read hrant's post, about the \"bastardisation of greek language\", i didnt really understand what he meant (i am greek btw, or hellenic if you prefer the term) <br>i saw the light a few minutes later, you are probably speaking about the change in our language. We moved from the polytonical(many tones) to the monitonical(one tone) system in the 1970's. Let me give a lecture. <br> <br>After the greek revolution in 1821, the newly founded country had to determine it's ethnicity. So, apart from the religion (orthodox), they came up with a language that was neither like ancient greek, nor like the one ppl were speaking back then, but a pompous mix of both. This mixture was named \"katharevousa\" (\"pure/clean/clear language\") and it was declared official language of Greece. Now, ancient greeks only had uppercase letters and had no problems in pronounciation (they knew it by heart)(first texts in greek are dated around 1200 b.c.). However, after alexander the great (who conquered, in today's terms, pretty much the whole of greece, egypt, turkey, iraq, iran and went all the way to india and that was around 320 b.c.), the language had to be simplified. I think they started developing lowercase around then too. Anyway, to ensure that everybody got the pronounciation right, they made 3 different tones and 2 other symbols (the exact translation would be spirits - nothing to do with demonology though) <br>One tone to signify that you had to heighten your voice in that syllable, another meant that you had to lower your voice, a third meant that the toned vowel had to be pronounced twice. <br>The other 2 symbols had to do with the pronounciation of the first letter, if there would be a thick or thin sound of an \"h\" to it (\"hercules\", \"hypnopaedia\", \"hellas\" and many other h- words are taken from greek and the special \"spirit\" for a thick \"h\" sound has been replaced by the \"h\" letter). These symbols also had a use in spelling correctly when creating compound words. <br>However, all this signs no longer serve a cause, because the ancient way of pronouncing has been long forgotten (even the byzantines didnt know it)... They only served as a helping hand (or not?) in learning and spelling correctly. The whole katharevousa thing created a gap between simple folks and writers/official texts etc.(they didnt understand it). They thought that the only way to enrich the current language was to fill it with unusable ancient terms - big mistake. It was like you had to use 2 different languages, one for everyday speaking and the other for writing officially. It was replaced by modern greek once the army dictatorship was over, in 1975. Ever since the official language is \"modern\" greek, which has no \"spirits\" and only one tone, that shows which syllable has to be heightened. Oh, and we still use a lot of ancient words \"as is\", without having to use the weird forms of \"katharevousa\". So i really don't know what that \"correction process\" you are talking about is.</p>"
