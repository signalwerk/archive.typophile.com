    html: "<p>Great summary! <br>And equally great visual comparison between the old Helvetica-Greek and yours. Good going on the \"redesign\", taking advantage of the fact that Greeks are a lot less confused now about what makes good type. <br> <br>&gt; a deliberate effort was made to introduce as many Latin forms as possible <br> <br>But fortunately they didn't go as far as Jan van Krimpen (bottom row): <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"grklapid.gif\"> <br> <br>That was just plain nuts. <br> <br>-- <br> <br>In trying to figure out why some of the most talented Latin designers make the worst non-Latin fonts, I've arrived at the theory that pride in one's own culture motivates creativity in it, but even if it's justified it inhibits good design in other cultures. <br> <br>hhp <br></p>"
