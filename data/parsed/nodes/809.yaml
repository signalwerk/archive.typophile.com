    html: <p>I think the much more interesting and relevant thing is that the logo is also a word. The lettering below is "just there" - it isn't the memorable component that will be "burned into people's consciousness" as the article says. <br> <br>I guess it makes sense that a logography is better than an alphabet for logos! <br> <br>hhp <br></p>
