    html: <p>ok man, i quickly went through this article of sorts, it just talks about the ancient way of writing the caps changing to more fixed characters after the romans conquered "our lands". this is really true, but has nothing to do with today's world <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>Anyway, you know, the greek alphabet is like the latin's alphabet dad. Greeks copied most of Phoenicians' letters back in 1500 - 1300 b.c. or something (adding a lot of characters, especially vowels - the phoenicians had none), and then the romans adapted a special form of the greek alphabet which was used in north greece i think, and naturally added some characters, making the arithmetic difference... 24 letters in greek, 26 in latin. <br> <br>(just to clear something up, the phoenicians were an ancient tribe of traders. they lived around Israel-Palestine-Jordania) <br> <br>i think i'll stop being a history teacher right now...</p>
