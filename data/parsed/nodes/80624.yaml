    html: |-
      <p>Seeing it set in a text block I can see many kerning problems as well as uniformity. That's one of the main pillars of any text font. Kerning should improve it considerably but some shape changes will improve it even more. Since glyphs are quite narrow you have to be careful to not set this font too tight because it could make it look stretched.</p>
      <p>Is it just me or would anybody else remove the ear on /p/? And it also leans a bit to the right. Put it beside /r/ and you'll see because /r( has the opposite effect of leaning to the left a bit.</p>
      <p>Anyway. After you solve spacing/kerning at least to some extend some details will become more apparent.</p>
      <p>Continue your work. I suppose you've realised it is much work in making a font. But the rewards can be just as satisfying. Keep on doing it because you've started nicely.</p>
