    html: |-
      <p>As Robert said, what a splendid first effort! There's a hint of Legato in there for me.</p>
      <p>Take comments with a pinch of salt, I'm no authority on type design :)</p>
      <p>I love the organic feel that the tapered stems give; however this seems to not be so pronounced on the VvWwXxYyZz. I think these should be slightly flared like the H for example, they look a bit straight.</p>
      <p>Thick stroke of Xx is a bit heavy. Also I'd make these slightly wider and give the lighter stroke a bit of offset.</p>
      <p>Tail of y could be a bit more confident, add a bit more colour. Foot of l likewise.</p>
      <p>Mitres on joins of Zz look too rigid being vertical, I'd slant them slightly to blend in more with the 'organic' tone elsewhere.</p>
      <p>N may be slightly too wide or too heavy. Bowl of P may need to be larger (bring the bottom of the bowl down a notch).</p>
      <p>Inner curve of S has too much of a cusp at the top.</p>
      <p>Looks like spacing needs work on the text sample.</p>
      <p>Great.</p>
    html_clean: |-
