      <p>First? Is it really? REALLY?</p>
      <p>Wow this definitely took me by surprise. This font looks very very good but PDF lacks some type set in this font to make better critique. It looks like a very nice sans body font. I don't know why but its stroke contrast reminds me of Optima even though they're not alike at all. And Optima... Boy that font was and still is popular.</p>
      <p>I don't like /g/ because it resembles too much Meta and to my opinion doesn't really complement other letters. I guess it should be closed at the bottom.</p>
      <p>There also seems to be a bit too much weight contrast between UC and lc.</p>
      <p>/a/ top stroke seems to be a bit too angular compared to others.</p>
      <p>I'm not so sure about the /CH/Ch/ch/ ligature. The connecting curve goes a bit too high into /H/h/ making it a bit wobbly. Someone might as weel read it as /OH/Oh/oh/ even though tops are not connected.</p>
      <p>And since you've added some of those accented characters, why not include some more (čšžćđ) and make it even more usable throughout Europe?</p>
