    html: |-
      <p>UC&amp;lc weight seems fine.</p>
      <p>I wanted to <em>complain</em> about the erroneous looking /Ss/ glyphs but since you've smoothed them out I don't have anything else to say.</p>
      <p>I can see you've made a more appropriate /g/. It's just that it's a tiny bit too heavy compared to others.</p>
      <p>Right stroke of /y/ seems thinner than left one. And the whole shape is maybe not as finished as it should be. I know... /y/ although seemingly trivial is rather quite a hard glyph to make.</p>
      <p>Maybe I wasn't looking close enough because I couldn't find /x/ in your text, because I think it's a bit wide for its shape.</p>
      <p>Id also make /D/ a bit less wide as well. Because of it's big fat bowl and straight stem it looks quite wide. A little wide. Test it in text and see for yourself whether it actually is wider than others.</p>
      <p>Compared to the nice slight stroke contrast some characters look a bit odd. And those would be /vwxy/ and potentially also /z/, but the last one is not that bad because of angular corner cut. The same UC letters seem a bit thinner compared to others.</p>
      <p>And try this: Since /R/ is much wider at the bottom, maybe some difference could also benefit /K/. Not as strong, but making it less vertically symmetric could benefit its shape.</p>
      <p>But apart from these glyph shapes I'm not going to say anything about kerning yet because that is still to come.</p>
      <p>I find your upgrade from 1.0 to 1.1 a very positive change in the right direction.</p>
