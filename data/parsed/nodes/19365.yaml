    <p>OK, so I have a font with all the lc and uc, lining numerals and old-style numerals designed. Lining numerals have their usual names, and I named the old-styles so that they have the “.onum” suffix (e.g. “one.onum”). </p>
    <p>How do I go about implementing an open type feature for the old style numerals?  I’d assume that I go to the open type panel, hit “+”, and the new “xxxx” feature appears. But what next? When I try renaming the “xxxx” feature so that it says:</p>
    <p>feature onum {<br>
      sub by ;<br>
    } onum;</p>
    <p>I get compile errors. Where &amp; how do I add the numbers? I was checking the FL manual, but I’m not getting far with it. Can somebody point me to any resoruce or explain how adding an OT feature such as old-style numerals works in a nutshell?</p>
    <p>I’m using FL 4.6 on a Mac<br>
    Thanks</p>
