      <p>The code that is inserted into the OpenType panel when you hit the “+” button is a stub—it’s incomplete and you are expected to complete it. You got halfway there by changing “xxxx” to “onum,” but you’ve got to finish the job. “sub by ;” needs to say something like “sub one by one.onum ;”. This is what is called a one-to-one substitution in OpenType feature speak. What it means is that the normal “one” will be substituted by “one.onum” when the user asks for old style numerals. You have to add a line like this for every number. It should look something like this:</p>
      <p><code>feature onum {<br>
      sub one by one.onum ;<br>
      sub two by two.onum ;<br>
      sub three by three.onum ;</code></p>
      <p>and so on, finishing up with:</p>
      <p><code>} onum;</code></p>
      <p>It can get more complicated than this—for instance if you have both proportional and tabular figures—but that’s basically it. (It’s all covered in the manual, by the way.)</p>
