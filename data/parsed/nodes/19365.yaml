    html: |-
      <p>That depends. The spec for PostScript-flavored OT (CFF) fonts says that a kerning table is not supported, meaning you must use class kerning. TrueType-flavored OT (TTF) fonts may have either or both. In fact, FontLab will let you include either or both in both flavors of OT fonts.</p>
      <p>That said, class kerning is the way to go. It takes a bit more planning, but it’s more efficient and thorough.</p>
