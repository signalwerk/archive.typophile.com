      <p>It seems there was another aspect to your question:<br>
      For direct visual control, you should use the Metrics Window for kerning. This also allows you to use classes. Then — whether you used classes or not — you go to the Metrics Assistance panel and hit the “update kern feature” button which generates a kern feature for you.<br>
      This way, your plain kerning table and the kern feature are (or at least: could be) equivalent for one is generated from the other.</p>
