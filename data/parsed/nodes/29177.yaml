    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/13082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Technologies</a>&nbsp;: <span class="caps">FFIL</span></strong></p>
    <p>The <span class="caps">FFIL</span> file is what is traditionally know as a Mac <a href="/node/add/wiki?edit%5Btitle%5D=font%20suitcase" title="Create node &quot;font suitcase&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">font suitcase</a>. In <span class="caps">OS</span> 9 and before it generally had a suitcase icon. In the case of a <a href="/node/14482" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">PostScript</a> <a href="/node/add/wiki?edit%5Btitle%5D=Type%201" title="Create node &quot;Type 1&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type 1</a> font, there needs to be a <a href="/node/add/wiki?edit%5Btitle%5D=LWFN" title="Create node &quot;LWFN&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">LWFN</span></a> paired with it; this is the Postscript Type 1 <a href="/node/add/wiki?edit%5Btitle%5D=Outline" title="Create node &quot;Outline&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Outline</a>.</p>
    <p>Another common situation is that the font is a traditional Mac <a href="/node/13679" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TrueType</a> font. It has the outlines contained in the same file as the Suitcase. There is no obvious way to tell using only the Finder. It does not need to have a .dfont or .ttf extension, and does indeed store critical data in the resource fork. If you add the font to a font manager, you should be able to determine quickly that it is <span class="caps">TT</span>.</p>
    <p>If a PostScript font suitcase is missing it’s outline, it may sometimes be refered to as ‘<a href="/node/13939" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitmap</a> only’ or an ‘orphan’. In some applications, these faces may still be available, typically you will get a warning if you try to print them. This situation exists for backwards compatability with certain&nbsp;applications.</p>
