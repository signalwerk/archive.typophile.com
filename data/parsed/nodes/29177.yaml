    <p>The <span class="caps">FFIL</span> file is what is traditionally know as a Mac <a href="/node/add/wiki?edit%5Btitle%5D=font%20suitcase" title="Create node &quot;font suitcase&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">font suitcase</a>. In <span class="caps">OS</span> 9 and before it generally had a suitcase icon. In the case of a <a href="/node/14482/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">PostScript</a> <a href="/node/add/wiki?edit%5Btitle%5D=Type%201" title="Create node &quot;Type 1&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Type 1</a> font, there needs to be a <a href="/node/add/wiki?edit%5Btitle%5D=LWFN" title="Create node &quot;LWFN&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">LWFN</span></a> paired with it; this is the Postscript Type 1 <a href="/node/add/wiki?edit%5Btitle%5D=Outline" title="Create node &quot;Outline&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Outline</a>.</p>
