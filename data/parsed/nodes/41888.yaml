      <p>If this is the logo for a documentary why do you say that it can’t be a display type? Seems like that would be a good place for a display type.  </p>
      <p>I’m sitting here next to a poster of ITC/Fontek typefaces, which may not be the freshest designs, but they are old enough to start being new to some people, perhaps. My first candidates I would test out are <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/atmosphere-itc/">ITC Atmosphere</a>, <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/arid-itc/">ITC Arid</a>, <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/riptide-itc/">ITC Riptide</a>, <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/lino-cut/">Lino Cut</a>, <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/schizoid-itc/">ITC Schizoid</a> and <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/itc-kendo/">ITC Kendo</a>. To me all of these might fit the notion of something drying up, and almost vanishing in some cases. Some are coarser and more literal than others, and I think there are other potential fonts in just the ITC/Fontek collection. </p>
      <p>- Mike Yanega</p>
