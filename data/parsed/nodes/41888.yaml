    html: |-
      <p>I’ve been a designer for twenty years, for what that’s worth. As I read your description, I pictured a Medium to Bold sans serif (my opinion is that serifs are too friendly, for the most part) with a black to white (or light gray) gradient north to south. All caps. Something simple that communicates.</p>
      <p>You can experiment with condensed fonts, like Compacta or Futura Ex Bold Condensed, or lean more contemporary like Scala Sans or Meta Black. </p>
      <p>Hope this gets you thinking and maybe you can come up with your own idea.</p>
