    <p>hi!</p>
    <p>i’m a graphic design student, and i’m kind of lost in an assignment...<br>
    i need to do a logo of a documentary that will be titled:<br>
    “running dry”<br>
    it is about the water problem that we are facing in the world..</p>
    <p>can anyone recommend me a typeface as a base to start<br>
    creating a logo?</p>
    <p>i need to start telling the story of the documentary with the typeface...<br>
    and of course, i can’t use any decorative types..</p>
    <p>any help will be useful!<br>
    thanks!</p>
