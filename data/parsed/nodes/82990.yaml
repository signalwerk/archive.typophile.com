    html: |-
      <p>Great idea!</p>
      <p>The critics are premature—if you develop this as a typeface, then the issues which they have raised will be resolved when you add weights, especially bold. As it is, this is the germ of an idea. A huge number of light weight sausage faces have been published, because they are so easy to make, and for this reason they don't amount to much (they are indeed lightweight).</p>
      <p>I don't consider this at all modernist. The nearest would be if one imagined Rudolf Koch had done something similar.<br>
      Certainly DIN rounded seems modern, but its antiqua forms are much more reductive and geometric, and one might imagine them being produced with a Rotring barrel-nib drafting pen held vertically, with a plastic template.<br>
      In contrast, I imagine your uncial as being written freehand, using a "Speedball" round-nibbed calligraphy pen.</p>
    html_clean: |-
