    html: <p>It looks like you're just mixing uncial forms into DIN. Some of the forms are really interesting, especially P, B and R. But it's too rational in a way that drains it of life; I think this is most apparent in L and T which resemble the horrible £ in Univers. And that neon-sign M is just plain lazy. Find a way to bring this to life and you could have a winner in the way Sowersby just hit two huge geometric sans home runs with Metric and Calibre.</p>
