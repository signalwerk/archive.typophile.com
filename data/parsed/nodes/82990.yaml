    html: <p>Andreas... I think you are off to a wonderful start but at this point it is only lightly sprinkled with the quirks of the Uncial/Half Uncial genre. If you are "gonna do it" then look to the "pinched" terminals in the m, n, h, u, w, y  etc. And feel free to explore the 2 story "a" and the rounded T. Look at reference for the capital N...  Just a few suggestions. Victor Hammer spent a lifetime on these forms and GG Lange did a very nice "version" with Solemnis. I think it has real potential (subjective, of course) I would like to see more idiosyncracies.</p>
    html_clean: <p>Andreas... I think you are off to a wonderful start but at this point it is only lightly sprinkled with the quirks of the Uncial/Half Uncial genre. If you are "gonna do it" then look to the "pinched" terminals in the m, n, h, u, w, y  etc. And feel free to explore the 2 story "a" and the rounded T. Look at reference for the capital N...  Just a few suggestions. Victor Hammer spent a lifetime on these forms and GG Lange did a very nice "version" with Solemnis. I think it has real potential (subjective, of course) I would like to see more idiosyncracies.</p>
