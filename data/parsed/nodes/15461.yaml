    html: |-
      <p>The Your Party is Our Business font is called <a href="http://www.myfonts.com/fonts/agfa/artistik/" target="new">Artistik</a>, and it is an old Art Nouveau era typeface, designed by Bauer &amp; Co &amp; H. Berthold, in Stuttgart. &amp; Berlin, respectively (See Petzendorfer’s “Treasury of Art Nouveau Alphabets” from Dover Books)</p>
      <p>- Mike Yanega</p>
