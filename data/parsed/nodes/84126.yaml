      <p>I can understand why as I typographic person sees a benefit in clearer definition and transforms nouns to achieve this. Why not, after all there are languages that have several words for snow, or for rice. I understand that to be an expert one might need to create terms to communicate an issue or an idea best to the peers. After all every profession has its own language in a way as well. </p>
      <p>Just generally I can't really understand the need to create adjectives or adverbs out of nouns. Nouns are nouns because they carry a strong message, a dual state, to be or not to be. I heard people using “statementy” or “show-stoppery” and similar terms, and I think it waters down the message and the language. A statement is a statement or it isn’t. If it failed to be a statement it is an attempted statement for example, which is a better description than statementy, which doesn't say anything. </p>
      <p>Maybe it’s just me not being an English native, and it sounds odd to me, comparing with the “proper” variants I learned. But as language develops it may feel more “natural” to native speakers.</p>
