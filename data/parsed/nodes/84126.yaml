    <p>"Kinross favours readerly typefaces…"<br>
    —from article about Robin Kinross in the summer <em>Eye</em>, by Rick Poynor.</p>
    <p>This term originated as the translation of <em>lisible</em>, coined by Barthes in S/Z (1970) to describe easy-access texts, which one might now term reader-friendly.</p>
    <p>Barthes paired it with Writerly (<em>scriptible</em>), for difficult, author-oriented texts.</p>
    <p>Poynor has migrated the term from the purely literary to the visual, typographic realm.</p>
    <p>(Writerly wouldn't make the move intact, morphing to Designerly, I surmise, as Typographerly is a bit of a mouthful.)</p>
    <p>While the output of Kinross' Hyphen Press is reader-friendly in its understated manner of design, I'm not sure that describing it as Readerly quite supports the Readerly/Designerly dyad, because the intellectual overtones of the term suggest complex, sophisticated ideas. I also have the feeling that Readerly refers to a kind of bookish, old school typography that may be contrasted with Browserly: immersion vs. skimming.</p>
