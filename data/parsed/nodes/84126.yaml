      <p>A literal etymological operation on <em>lisible</em> would yield readable; but since that isn't what the French word means, if the intent is to speak of a typeface as being comfy, cozy, warm and fuzzy for the reader, "readerly" would be an ideal word to carry that meaning, which is not truly carried by any existing word that I know of.</p>
      <p>This does not say though that I entirely disagree with Old Nick saying that this "is one neologism we can do without". Because while it carries a particular meaning well, it's not really a <em>useful</em> meaning.</p>
      <p>By that I mean that there has already been a discussion in this forum on the difference between "legible" and "readable". A legible typeface is one where the letters can be made out easily even under bad viewing conditions; a readable typeface (the appropriate goal for a text face) is one that minimizes strain and effort for extended periods of reading.</p>
      <p>To the extent that "readerly" has a different meaning from "readable", it would seem to mean a typeface that <em>appears</em> to be readable; one that shouts out how well suited it is to the reader. But crystal goblets aren't supposed to stand out! So the term readerly seems like it's a word used to specify <em>ersatz</em> readability instead of the real thing; the meretricious appearance of readability.</p>
      <p>Ostentatious use of oldstyle faces - most of which, fortunately, <em>are</em> readable in addition to readerly - and older Transitional faces (Baskerville, Bell) would be one result, not particularly disastrous in itself, because most of those are actually very good typefaces. But the potential for getting the wrong thing when you ask for the wrong thing is there.</p>
