    date: 2014-06-21T12:53:00
    date_raw: 21 Jun 2014 — 12:53pm
    votes: null
    html: <p>A Google search did not turn up much about the history of the bullet point itself, but it did turn up facts about the history of its predecessors. Apparently the dingbat that was a picture of a pointing hand was the first typographical symbol used for this purpose, starting in the 12th century and continuing all the way into the 18th century.</p>
