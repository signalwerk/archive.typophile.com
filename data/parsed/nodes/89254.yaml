    <p>Hi Designers. I am launching a website called Grey Manhattan... While researching a good look for "GREY' I came across a website from the Advertising company of the same name. Their Chilean site has the most remarkable look and logo and I really want mine to reflect this without infringing on copyright issues.</p>
    <p>Please check our <a href="http://www.liquidgrey.cl" title="www.liquidgrey.cl">www.liquidgrey.cl</a> and let me know if you recognize the font and color etc... Also if you have suggestions on how I can keep this serious and sexy look while changing the details (slightly different font, color etc...). Also, do you think this would look good in print (business cards, letterheads etc...)</p>
    <p>Thanks in advance.</p>
    <p>Tina Grey</p>
