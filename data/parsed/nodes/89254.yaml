      <p>&gt; I really want mine to reflect [their site design and logo]<br>
      &gt; without infringing on copyright issues</p>
      <p>Tina, it's common for designers to be inspired by the work of others, but you need to develop your own identity, not simply imitate someone else's logo and site design with minimal changes to avoid legal issues. Especially since your company name is similar.</p>
