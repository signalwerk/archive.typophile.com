    html: |-
      <p>It does not look like digital type. If it were  you would need two different fonts for the different widths.<br>
      You could start with <a href="http://www.dafont.com/staubach.font?nb_ppp=50&amp;text=GLEN+WANDIN" title="http://www.dafont.com/staubach.font?nb_ppp=50&amp;text=GLEN+WANDIN">http://www.dafont.com/staubach.font?nb_ppp=50&amp;text=GLEN+WANDIN</a> or looke here <a href="http://www.dafont.com/theme.php?cat=104&amp;nb_ppp=50" title="http://www.dafont.com/theme.php?cat=104&amp;nb_ppp=50">http://www.dafont.com/theme.php?cat=104&amp;nb_ppp=50</a> to look at alternatives.</p>
      <p>The very reason of existence for this kind of lettering was that it could be easily cut out so you didn't need a computer ;-) AFAIK only US teams still use that awkward kind of lettering. European sports teams prefer more recent type on their tee shirts.</p>
