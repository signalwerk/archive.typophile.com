    html: |-
      <p>Perhaps the designer used Optima Bold Italic and applied a horizontal expansion of about 120%. This would produce a general appearance similar to "Sleep."  He could then have done a series of edits: straightened the vertical and cross strokes, converted some corners to arcs,  and sharpened the tips of the terminals.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/OptimaBoldItalExpHoriz120Percent_4186.jpg"></div><br>
      Don<p></p>
