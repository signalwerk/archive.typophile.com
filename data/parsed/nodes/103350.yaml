      <p>Mini serifed heavy sans was used as a design feature cira 1900. Sometimes called flareserif. A few modern uses of tiny serifs similar to the sample:<br>
      Steve Zafarana's Alphdog <a href="http://www.myfonts.com/fonts/tailspinstudio/alph-dog/" title="http://www.myfonts.com/fonts/tailspinstudio/alph-dog/">http://www.myfonts.com/fonts/tailspinstudio/alph-dog/</a>,<br>
      Jim Parkinson's Modesto <a href="http://www.myfonts.com/fonts/parkinson/modesto/" title="http://www.myfonts.com/fonts/parkinson/modesto/">http://www.myfonts.com/fonts/parkinson/modesto/</a>,<br>
      Leslie Usherwood and Steve Jackaman's  Alexon <a href="http://www.myfonts.com/fonts/redrooster/alexon-rr/" title="http://www.myfonts.com/fonts/redrooster/alexon-rr/">http://www.myfonts.com/fonts/redrooster/alexon-rr/</a><br>
      Phil Martin's Agenda by URW <a href="http://www.myfonts.com/fonts/urw/agenda/" title="http://www.myfonts.com/fonts/urw/agenda/">http://www.myfonts.com/fonts/urw/agenda/</a> which makes use of the same serifs but only for about half the usual locations.<br>
      Don</p>
