      <p>It's not all that important to the job interview process, but Pattyfab has a point, that it will help if you meet people casually at events and whatnot. Design firms may or may not have a job posted, but they're nearly always willing to make room for the right person because they're so hard to find.</p>
      <p>Once you have the interview, if the resume isn't stellar and the portfolio is just okay, a personal card will not win you more points.</p>
      <p>However, if you have a great resume and your portfolio is solid then giving me a business card makes it easier to get in touch with you. In that case it's a bonus, but still not necessary.</p>
      <p>Best of luck in your search.</p>
