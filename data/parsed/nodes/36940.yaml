      <p>Beeing a portfolio reviewer myself I agree with what Fredo is saying.<br>
      Less is more! Make sure everything is tops or leave it out.<br>
      I go through tons of folios though so a businesscard for me is a good way of remebering the person and the folio. </p>
      <p>Are you doing your folio available in a handy digital format? Make sure you do. Paper float around a busy office environment and will sooner or later be likely to disappear. Most agencys who speak to jobseakers regularly have a space on their server for folios where they can go back and find an appropriate candidate when the need presents itself. Make sure you're in that pile.</p>
