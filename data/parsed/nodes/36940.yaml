      <p>here's my take:</p>
      <p>if you're applying for an open position, it's probably not that important. they will review your cover letter/resume, portfolio (if asked for yet) and decide who to call in for interviews.</p>
      <p>but if you're fishing, if you're going around doing informational interviews, if the position you want isn't open at the moment (or doesn't officially exist yet), then a biz card could be effective, because in that case, you wanna keep your name in the minds of the powers that be. cards go into wallets, beside computer monitors, in roledex files, etc. etc.  they are another opportunity for your name to come up when the time is right.</p>
