      <p>My business card was a 1 colour poster/ which folded up to a reasonable size and had a calendar on it. I made sure the graphics where good enough for them to pin it up on the wall since I was fishing. That way when there was a position available it would be easier for them to remember me. I got 4 offers in the same week;-)</p>
      <p>My advice is make something you can afford that stands out. Die cuts are expensive, you might want to consider something else.</p>
      <p>Good hunting!</p>
