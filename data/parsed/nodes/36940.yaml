    html: |-
      <p>As an occasional portfolio reviewer at a design agency, I don't care if the person has a business card or not. Work samples and contact info in an e-mail is enough. BUT if the person does have a card it MUST look very good. Not a conceptual wonder and I don't care much for fancy die-cut stuff and lots of colours, but impeccable typographically and maybe with a hint of character. For me it's an extension of the portfolio, and rather than show up with something half decent, don't bring it at all. The same goes for the portfolio. I don't want to see work done if it isn't something the person showing the portfolio really likes her- or himself. Show less, rather than too much. </p>
      <p>That said, a business card is practical for all reasons mentioned above, so...</p>
