      <p>The best way to get work is through networking, it's often who you know. Meet up for drinks, give people calls. If you can call them give them a call.</p>
      <p>You do need an identity on paper as well as digital. </p>
      <p>Business cards are a common way of getting your details across but are often lost on the desk or filing system. There is also a case of never being happy or sure that what you have done for yourself, and the process tends to drag on, you need to get going the longer your out the harder it gets to get back in.<br>
      Send examples of your work by email or post this works better, send relevant pieces of work not random. Emails are sometimes better and people tend not to delete emails and they can find you again if you have made an impact. This way people can see how you would fit in. If there is a opportunity going then they will remember you and give you a call. </p>
      <p>If you can't get full time then freelance. Get your name of freelanceuk.com if your in the UK.</p>
      <p>As Endre did make something that will be useful and standout, possibly instead of a business card to give yourself a better chance of staying away from that draw.</p>
