      <p>I fired up iChat and there he was. ;^)</p>
      <p>Jonathan thinks it's Champion, though it's pretty hard to tell for sure, also because he thinks -- whatever it is -- it's been messed with. The outlines of H&amp;FJ Knockout and Champion are not the same, but they're very close in the capitals at the thin end of the spectrum. Most of the juju happens in the lowercase, and in the proportions in general plus various things in the terminal strokes of the C, G, and S.</p>
