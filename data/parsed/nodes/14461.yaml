    <p>Greetings all! I wanted to drop this message to all of my East and West coast Typophile buddies and as a general warning to all residents of the state of California... I may be coming to a town near you! San Francisco residents need particularly be scared as I am making my new nest in the fine city of San Fran. You all may never be the same. I’ll see you in September, MWAH-HA-HA-HA!</p>
