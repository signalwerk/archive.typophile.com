    <p>The font used on Air Force One is usually said to be Palatino (for example, <a href="http://typophile.com/node/19363">http://typophile.com/node/19363</a>), but it doesn't really look like Palatino to me. For instance, the serifs in Palatino are flat vertical or horizontal lines, while the serifs in the AF1 font are at a 45 degree angle (except in the arms of the E and F) and look like arrowheads. Is it a custom US government version of Palatino, or is it some other font completely?</p>
    <p>The attachment is a portion of the full photo, which can be found at <a href="http://www.af.mil/shared/media/photodb/photos/021126-O-9999G-023.jpg">http://www.af.mil/shared/media/photodb/photos/021126-O-9999G-023.jpg</a></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/af1%20text.jpg" width="543" height="149" alt="">
