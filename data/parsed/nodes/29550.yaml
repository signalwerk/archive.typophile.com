      <p>I tried the Serif Guide too and a bunch of Caslon versions came up among the 64 fonts that had these 'structural' forms, but the Caslon R's all have a slight arch to them where they connect to the counter (and many of them have a different C). It seems quite likely to me that this lettering was not made using a font, considering what it is being used on, so anything we suggest would just be a way to make something similar. I agree with Lex's pick, and also Oldstyle No.2, which may have been the typeface that Binney Old Style was based on.</p>
      <p>- Mike Yanega</p>
