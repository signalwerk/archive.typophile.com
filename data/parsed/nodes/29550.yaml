      <p>An interesting pop culture side note: clothing designer Marc Ecko recently posted a video of himself <a href="http://www.stillfree.com/">tagging Air Force One</a>. But the video was revealed to be an elaborate hoax. The first clue: the typeface on the fuselage isn't quite right! (Apparently Ecko rented a jet and painted it to resemble the Presidential plane.) There are other clues that are more obvious to airplane geeks. The video is done well and it's worth watching if you can appreciate a craven PR stunt.</p>
      <p>Skylar</p>
