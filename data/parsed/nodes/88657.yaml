      <p>I never thought of it as an issue of impulse vs. careful planning.<br>
      If there was a typeface that I thought would enable me to create an appropriate setting for a particular job, then I bought it.<br>
      The operative word being “create”, because you don’t know what kind of results working with a particular type will produce until you try, you only have a vague and unrealized idea. </p>
      <p>You have to choose something you feel an affinity for, which suggests it might help you materialize an idea or effect you’re working towards, which you feel will flesh out the design brief in a way that your bundled fonts won’t.</p>
      <p>So there is a trade-off between the possibility that the type you license may not work out for you or the client, vs. the possibility that if you don’t try working with new tools, you will, as you suspect, stagnate.</p>
