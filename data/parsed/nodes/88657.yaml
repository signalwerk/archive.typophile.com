      <p><cite>You have to choose something you feel an affinity for, which suggests it might help you materialize an idea or effect you’re working towards, which you feel will flesh out the design brief in a way that your bundled fonts won’t.</cite></p>
      <p>Ahh, Nick my mother said the exact same thing when I consulted her on this issue. She is a small business owner and understands putting down the money for something that furthers the business as a necessity. If you need it: pay first, ask questions later.</p>
      <p>But you must understand that I am caught in between that world and another. This other world is the philosophy of producing something very great from very little; that whole "humble roots" spiel, if you will.  As an example, a typeface I've lusted for is over at <a href="/wiki/vllg.com" class="freelinking" rel="nofollow">vllg</a>. It is a workhorse serif and I think to myself, whilst looking at the price tag: "Maybe I'm being irresponsible and maybe I can do everything I need to do with Minion and Century. Maybe my inability to produce a creative solution is my <em>own</em> problem and not a lack of assets."</p>
      <p>Ultimately, however, I think as a young designer I still am learning that this profession requires we put money into it at various points. Some do it frequently while others do it infrequently. Eventually I'll find my sweet spot.</p>
      <p>In the mean time, however, I've since purchased <a class="freelinking external" href="http://new.myfonts.com/fonts/canadatype/gibson/" rel="nofollow">Gibson</a> from Canada Type. My experience with it has been delightful, so that's a good start.</p>
