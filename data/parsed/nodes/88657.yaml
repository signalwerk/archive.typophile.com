    <p>Hello typophile! This is a somewhat personal question for you all. It is the typography equivalent of asking an older brother how to kiss girls, so if you're in the mood to open up perhaps this will sate that.</p>
    <p>Out of curiosity: what brings you to buying a typeface? As in: at what point are you pulling out the credit card to enter it into the necessary fields? Particularly something that would be considered pricey for us who aren't on the end of our salary spectrums.</p>
    <p>Recently, my design work has all but stagnated and I've been biting at the heel to purchase a typeface. I could use a bigger library to bolster my work. I think it's only natural—typefaces to graphic designers are like paints to a painter (or brushes, perhaps?) But you see: I consider myself an extremely frugal person and the idea of purchasing a typeface hits me hard. Yes, I know I spent lots of money for other IP—such as the Creative Suite—but I've never purchased a typeface and am quite afraid that once I do it will sit there unused and unloved for all eternity. Or perhaps I am simply worried it will become useless the moment I realize no client wants it.</p>
    <p>So I'm just interested in your consumer process when it comes to type: is there a tipping point? Are you impulse buyers or is every font purchased a carefully budgeted and planned experience?</p>
