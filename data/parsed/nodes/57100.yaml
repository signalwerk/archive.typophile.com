    <p>Hi all,<br>
    I haven’t logged in in a long time, but would very much value your opinion on this logo. My client (and friend) are at an impasse when it comes to the name font used in this logo. The “G” component is fine, but my client would like to see his name bolder, which I am not necessarily opposed to, but he has given me a couple suggestions as to fonts he would like to use which I have given a strong opinion against. I’d like to hear what you think of what’s there now, and what you think of any of his suggestions as well as any suggestions of your own. The font used now is (I hate to even say it) Helvetica Neue. Haha I know the most over used logo font out there. The fonts he has suggested are Verdana, Eurostyle, CopperPlate Gothic and Lucida Console. Any help would be much appreciated.</p><div class="imageWrap"><img src="/files/JPEG logo_5833.jpg"></div><p></p>
