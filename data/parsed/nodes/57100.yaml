      <p>My two cents:</p>
      <p>“GOODWIN” looks great, and I see no reason why you shouldn’t use a heavier version of Helvetica or any other (Neo) Grotesk. </p>
      <p>“exteriors” tracked out and wide (streched?) needs work. Why not set it in the same width/spacing as the name, just smaller? I would also try to achieve equal colour on both lines, perhaps by using a slightly bolder weight for “exteriors”.</p>
