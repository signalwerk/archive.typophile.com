  html: <p>Hey there. <br> <br>I'm looking for a body typeface for a magazine that i'm designing that will be in tabloid format, and quite packed with content, so it needs to be pretty tight. Since it's aimed at young people, it allso need to be a bit modern. <br> <br>Any ideas would be greatly appreciated... <br> <br>Sv.</p>
