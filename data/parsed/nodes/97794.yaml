      <p>So a website that helps designers pair fonts...for any medium (print/web)? And they could then purchase a license to said fonts through this site? </p>
      <p>Rhetorically:<br>
      So why are they called "designers" then if they need to rely on an outside service to select better font pairings? Isn't that why clients hire them? To make these design decisions?</p>
      <p>Back on topic:<br>
      I personally think this won't succeed - you're going to be competing in a fairly compressed market filled with fairly large vendors who offer similar services (not necessarily the font pairing aspect, but being able to view fonts, see how they typeset, and then making them easily purchasable.) But the decision is up to you and who knows?</p>
