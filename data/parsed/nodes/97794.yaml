      <p><em>I don't think you should assume that:<br>
      - All design schools are flawed in that respect.<br>
      - Jerry cannot "bypass" such a flaw.</em></p>
      <p>I’ve taught type design at a number of design schools, as part of a B.Des or similar program. It’s one of the more dry, technical subjects in their curriculum, and many students hate it, no matter what. Being forced to learn about sidebearings and alignment zones in Fontlab (a difﬁcult application that none of them are likely to use professionally) is too “algorithmic” for many of them. I’ve tried a number of different approaches, and those where there is less emphasis on technical rigor and more on open-ended invention and personal expression are preferred by students—although I don’t believe, as you say Hrant, they offer quite such deep insight into typography. So one strives for balance.</p>
      <p>As this project has been described, there is plenty of opportunity for creative analysis and categorization of type forms in designing a “combo” site. My advice was simply not to get sucked (or forced!) into spending a lot of time ﬁguring out a complex seemingly objective formula for type categorizating and matching, but rather to take it as a given, becuase the point of the exercise is to design a web site, not to develop a system of typeface classiﬁcation. </p>
      <p>But perhaps I am wrong. Perhaps that’s where graphic design is headed.</p>
