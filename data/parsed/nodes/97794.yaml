      <p>I wouldn’t worry about how your site assesses which fonts combine well.<br>
      That’s curation and market research, not design.<br>
      As a design student, you will get the most out of your project by designing the site to show users how two fonts selected will look in various settings.<br>
      Many type foundries already have this kind of functionality, which you can use as a benchmark.</p>
      <p>As for choosing your short-list of faces and matchmaking their hook-ups, that's something you should do through your own research of typography, rather than looking for some automated process, which will not develop your knowledge and taste in typography.</p>
