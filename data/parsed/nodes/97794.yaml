    <p>Hello everyone!<br>
    My name is Jerry and I am a current student at Kutztown University in Pennsylvania taking the communication design program.<br>
    A group of us are taking part in a <a class="freelinking external" href="http://lehighvalley.startupweekend.org/" rel="nofollow">startup weekend</a> and decided to begin the creation of a website (type-wich.com) to help with the creation of font combos for individuals looking to create anything in the design world. Or anywhere else really.<br>
    So, the way it will work, an individual will pick a font for the header and a list of fonts that will be possible good looking matches for the body. This way it can be quicker for designer to find another font that will work well with their first pick easier.</p>
    <p>This site will also work as a filtration system to bring in most of the fonts from freelancers/type founders and smoothly dispense it to an individual. Because of this, there is a possibility for someone to see a font which they might like and buy it through us from the designer.</p>
    <p>So, I am asking for ideas and opinions on what you guys/girls think of this idea!</p>
  html_clean: |-
    <p>Hello everyone!<br>
    My name is Jerry and I am a current student at Kutztown University in Pennsylvania taking the communication design program.<br>
    A group of us are taking part in a <a class="freelinking external link-external" href="http://lehighvalley.startupweekend.org/" rel="nofollow">startup weekend</a> and decided to begin the creation of a website (type-wich.com) to help with the creation of font combos for individuals looking to create anything in the design world. Or anywhere else really.<br>
    So, the way it will work, an individual will pick a font for the header and a list of fonts that will be possible good looking matches for the body. This way it can be quicker for designer to find another font that will work well with their first pick easier.</p>
    <p>This site will also work as a filtration system to bring in most of the fonts from freelancers/type founders and smoothly dispense it to an individual. Because of this, there is a possibility for someone to see a font which they might like and buy it through us from the designer.</p>
    <p>So, I am asking for ideas and opinions on what you guys/girls think of this idea!</p>
