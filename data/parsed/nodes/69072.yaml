      <p>Definitely not B. Too much detail.</p>
      <p>Not A, C or E either, because they depict WiFi service or product.</p>
      <p>That leaves D, which is not bad purely from the perspective of the mark design. But I cannot relate the mark to neither help desk nor to the web hosting service. So I agree with gtrianta - D shows most promise, but it needs work.</p>
      <p>Also consider using two colors for edesk. One for e, and the other - for desk.</p>
      <p>Also d-e and s-k look too loose compared to e-d and e-s. I would re-kern for consistency.</p>
