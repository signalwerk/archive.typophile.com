    <p>Hi there this is my first post-<br>
    Rookie designer looking for some critique/ feedback on these logos.</p>
    <p>This is a re-brand for an established IT help desk company<br>
    which is looking to promote the web hosting side of their business.</p>
    <p>They're present branding includes the red colour, with just text (arial i think)<br>
    I'd unfotrunately like to stick with only the fonts you get free on a standard mac.</p>
    <p>I would like to present a maximum of 3 logos to the client,<br>
    not got the confidence yet to decide for myself whats best.</p>
    <p>Any feedback welcome, just your top 1 or 2 logos<br>
    some finish work needed on all logos<img src="/sites/default/files/old-images/samples_5721.jpg"></p>
