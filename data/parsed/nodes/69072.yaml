      <p>I am a bit color blind (green and brown colors are sometimes a problem). So don’t give too much on my comment with regard to the colors: The contrast of color and light is odd in all examples. The colors somehow don’t work together (in both columns, except from the white logos). And partly the examples look mixed up from existing logos/icons.</p>
      <p>And I dislike the shine on the symbol in A and D. In A and E the color of the three curves does not harmony with the rest of the icon/sign.</p>
      <p>The best is this ed-ligature. But even there is a disharmony between the ligature and the text below.</p>
