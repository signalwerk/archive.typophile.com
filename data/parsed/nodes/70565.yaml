      <p>It occurs to me that I have perhaps misconstrued the goals of the original poster, or, at least, attempted to make a correction to his post that was irrelevant.</p>
      <p>While I think that there is a problem with Greek letterforms due to the Porson Greek convention arising while the Greek language was suppressed under Turkish occupation, and, in fact, one might even ask if Greek needs an upper and lower case duality any more than, say, Hebrew... that may be irrelevant to the original poster's goals.</p>
      <p>Instead, if one accepts as a postulate that the Greek alphabet in its present form is a satisfactory expression of the Greek national consciousness, on a par with the Latin alphabet for the countries that use it, then it is possible to focus on the specific question of raising the Cyrillic alphabet to parity. With a lower-case that is a mix of Latin alphabet lower-case and Latin alphabet small-capitals, this is presumably not achieved.</p>
      <p>Once the question is framed in this way, the solution becomes obvious. For Cyrillic to raise its head with equal dignity to Greek... the reform would be to retain the existing Cyrillic upper-case, but to replace the lower-case with one based on Glagolitic letter forms.</p>
