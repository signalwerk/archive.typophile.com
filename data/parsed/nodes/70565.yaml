      <p>As a compromise, the Petrine reform was a quite dignified way of moving Russia out of its backwater.<br>
      At other times, European countries have abandoned their traditional alphabet styles wholesale, in favor of the Italian model.<br>
      In particular, the blackletter, which was used in Germany, Denmark, Norway etc. until quite recently, historically speaking--much later than the Petrine reform.</p>
      <p>Strictly speaking, the Fraktur is still part of the Latin script, but most of its alphabet is illegible to those in countries that switched to the Antiqua long ago.</p>
