      <p>I'm a Canadian with no knowledge of Cyrillic prior to my typographic work.</p>
      <p>In developing the <a href="http://www.shinntype.com/Figgins_Scotch.pdf" rel="nofollow">Modern Suite</a>, released in 2008, I decided to include Bulgarian alternates (as well as the Big Yus character), prompted by a Maxim Zhukov seminar on Cyrillics organized by the TDC in New York, and based on my study of types published by the Hermes foundry, and discussions here at Typophile.</p>
      <p>These Modern Suite alternates are not designated as the default for text identified as being set in Bulgarian (BGR), but are accessible as an OpenType stylistic set. That seemed like the "best practice". AFAIK (I have 10 distributors, so aren't always up to date on who is buying my fonts), nobody in Bulgaria has licensed any Modern Suite fonts yet, so the Bulgarian alternates appear to be a waste of time--although I haven't made any efforts to promote the fonts in Bulgaria.</p>
      <p>TypeTogether's <a href="http://www.type-together.com/Skolar" rel="nofollow">Skolar</a> also includes Bulgarian alternates.</p>
      <p>BTW, we have had a similar situation with the Latin script, where the single bowl version of "g" may be considered more European than the double bowl version, which tends to be preferred in North American sans serifs. At least, during most of the 20th century.</p>
