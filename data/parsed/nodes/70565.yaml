      <p>I like it when Cyrillic and Latin look very similar, but if I were to make a font with very Latin looking Cyrillic letters I think I'd be criticized for not understanding the subtleties of Cyrillic. I'd imagine that designers whose first alphabet is not Cyrillic (or Greek) are under a good deal of pressure to include all sorts of regional details in order to prove they're qualified to work with those alphabets in the first place. Better to include lots of unnecessary subtle changes than to leave out a few important ones. </p>
      <p>It's funny you mention k— in Russian, at least, the arm of the k pretty consistently points down or forward, whereas Latin k arms are mostly straight or curved up. That particular detail is one I'd be hesitant to leave out were I to design my own Cyrillic face (perhaps a Bulgarian k is not quite like a Russian k?).</p>
      <p>Oddly enough, just yesterday I replaced the old looped k in my little cursive font with (what seems to me) a Russian-looking forward-pointing k. I kinda like it and intend to stick with it...</p><div class="imageWrap"><img src="http://typophile.com/files/quackerjack_4605.png"></div><p></p>
