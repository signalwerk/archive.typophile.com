      <p>You seem to adress several issues at once. A difference in glyph design traditions between Bulgaria and Russia may be one of them. But I would not call this “identity crisis”.</p>
      <p>If I understand you properly, you are concerned with glyphic detailing which, e.g., makes the Cyrillic K in a font looking different from the Latin K or the Greek Kappa. – Am I right?<br>
      Well, these things have been discussed many times already as I recall. What you label as “very strange and obscure things” is perhaps just a certain convention, one of several in existence. Then the font designer has to make decisions, tricky ones, sometimes. But such issues belong to type in general, to multi-scriptiv type in particular and are not peculiar for the Cyrillic branch alone.<br>
      I myself decided to just issue <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=315" rel="nofollow">Andron Cyrillic</a> in different variants. Others implement glyph variation options via Opentype features …</p>
      <p>I’d welcome you to give us some insights on your personal preferences for (Bulgarian?) Cyrillic.</p>
