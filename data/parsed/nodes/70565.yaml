      <p>If I were to try to take the Greek alphabet, and modify the lowercase of it so that when the uppercase Greek letter looks like an uppercase Latin letter, then the lowercase letter matches again - and create new lowercase forms, then, for the other Greek letters to "fit in"... people would laugh at me, and certainly the Greeks would never use such a thing.</p>
      <p>Yet, there are different forms for the capital Greek letter Upsilon, and Greeks are more likely than Latin-alphabet users to use a form that looks like the Latin Y.</p>
      <p>I think you are asking a legitimate question, even though what you seem to be asking for sounded like my silly example of making Greek conform to Latin. The Greek and Latin alphabets developed naturally over a long period of time. The Cyrillic alphabet is of more recent origin, and perhaps the current form used in Russia and Bulgaria is an arbitrary and artificial modification, instead of a natural development, from the larger Slavonic alphabet.</p>
      <p>Greek has its own problems. The "Porson" style of Greek typeface, most familiar to Latin alphabet users, mixes a cursive, sloped lowercase with upright Roman-like capitals. This is very handy when typesetting mathematics in English, but it isn't well suited to normal text composition. The Greeks use other styles, therefore, such as sans-serifs, but the fact that there is no really Hellenic serifed style to standardize on as the basis for Greek typefaces is a problem.</p>
      <p>The Latin upper and lower case is artificial too, a shotgun marriage of Roman capitals with uncials. But if someone tried to reinvent the alphabet to replace it with something more "organic", but unfamiliar, except as a curious display font (i.e. Peignot)... it would not fly.</p>
      <p>Except perhaps for some subtle changes of peculiarities in the ordinary serifed fonts... such as stepping back from Bodoni/Didot styling... there is not much that can be done, I think, in the way of a general reform. That doesn't mean that adventurous experimentation, though, cannot be engaged in.</p>
