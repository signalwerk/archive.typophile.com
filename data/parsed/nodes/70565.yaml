      <p>The "crisis" is also inherent to the evolution of language.<br>
      The law of vowel-change was discovered by Rasmus Rask c.1820.<br>
      In the Latin script, the related pronunciation of "v", "w" and "q" has varied across the centuries and from country to country.<br>
      Even today, a language like English is pronounced quite differently in different parts of the countries where it is spoke.<br>
      So why should alphabets conform?</p>
      <p>As various sages have opined, "Never trust a man who only knows one way to spell a word".<br>
      Or one way to glyph a character.</p>
