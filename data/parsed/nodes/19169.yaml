      <p>I too am dealing with this same issue. My decision was simplified by the fact that my father served in ww2 and so a plaque, made by the Army, will stand in addition to the family stone. Slyly, I found the font the carvers call "Govt. Std" just needed to be taller and not too, and now the two stones match.</p>
      <p>But I would not choose from my fonts, or indeed from any fonts the the carvers are not familiar with, Unless you're going to Fud and Co., (aka The John Stevens Shop) or some other truely typographically inclined carver(s).</p>
