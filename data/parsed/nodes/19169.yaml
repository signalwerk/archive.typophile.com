      <p>To me stone cutting is all about the craftsman.  Finding a real stone cutter with skill coming from the heart is the hard part. There are lots of sandblaster guys around who will just use a template. If you can find a guy with real old-world skills, work with him and ask his advice.</p>
      <p>To me, the busier the font, the less likely it is to work carved. I would stick with short serifs.  The shadows and highlights of the v cut will give the feeling that the serifs are bigger than they are. The rest is all about the person you are remembering. What feels right for their personality? Would a more relaxed straight make sense or a more formal rigid line?<br>
      I guess that wasn't much help since I did not give you a specific type but I can't without knowing the person.</p>
      <p>My condolences on your loss,</p>
      <p>ChrisL</p>
