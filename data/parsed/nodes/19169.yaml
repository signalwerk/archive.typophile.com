      <p><em>cemetery messed up and forgot to mention they only use granite and have crappy people who make terrible design decisions for stones</em></p>
      <p>This sounds typical. Most granite is machine cut, and the lettering looks just awful. Very few people can cut granite by hand, because it is so hard. The large grey slabs on the back of the Sainsbury Wing of the National Gallery in London are some of the only pieces of hand carving in granite I have seen. Michael Harvey designed them, but he hired a much younger and stronger person to cut them. This stonecutter worked one day on and one day off, because by the end of a day of cutting the granite he could barely hold the chisel. It is brutal on the muscles in the hand and wrist.</p>
      <p>Speaking of Michael Harvey, his Moonglow typeface (available from Adobe) would be a good, distinctive choice. I first saw these letterforms cut in raise relief on stone by Michael during the 1997 ATypI conference in Reading. The outline style works well very large. There are also a good range of weights and widths in this family, so getting the right balance for the stone will be easier. In the mockup below I've used the semibold extended.</p>
      <p><img src="/sites/default/files/old-images/STERNjh.gif"><br>
      _</p>
      <p>This is a difficult decision to make for a close family member. I hope some of these comments are helpful.</p>
    html_clean: |-
