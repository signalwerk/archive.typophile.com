    <p>Hi all,</p>
    <p>This is driving me a bit nuts. There's a great 3D/layered font in the new Jamie Oliver book 'Comfort Food' that isn't listed at the front of the book. Its looks pretty damn similar to Industry Inc but I can see the M is slightly different. The inline stroke in the book touches the bottom of the letter, in Industry Inc it stops short. Amongst other things, its a different font of course.</p>
    <p>Any ideas?</p>
    <p>thanks,</p>
