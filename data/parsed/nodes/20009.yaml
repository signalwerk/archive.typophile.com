    <p>Hello</p>
    <p>I am trying to explore what attractive fonts I could use as I design a website for a large commercial printing company.<br>
    Big facility, lots of beautiful print.<br>
    They are starting to ramp up their web-to-print abilities, but work conventional commercial printing with great success.</p>
    <p>I am looking for inspiration of a font in the navigation and body at this point.</p>
    <p>Love to hear any feedback!</p>
    <p>And, thanks for your patience.</p>
    <p>wnf</p>
