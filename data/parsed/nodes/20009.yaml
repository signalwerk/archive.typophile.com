      <p>If its a HTML based website you are / may be pretty limited in choosing typefaces for the body copy. You have to rely on those that come pre installed on most computers. To try and compare the most common types for web, you may want to check the fabulous <a href="http://typetester.maratz.com" target="_blank">typetester.maratz.com</a>.</p>
      <p>As for the navigation / menus, you may want to consider types that stay legible and ’clean’, even when used / presented very small, and on screen. <em>( Like one of those greyscale bitmap / pixel fonts. )</em></p>
      <p>Dav</p>
