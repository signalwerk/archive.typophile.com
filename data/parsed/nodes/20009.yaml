      <p>wnf, IMHO the first thing you have to make sure here is that you’re not crossing a rebranding border. I’m not sure the client would like such turns, even though a web site is completely different media than print brochures.</p>
      <p>Futura is really quite adequate here, considering one of your introductory sentences: <cite>“They are starting to ramp up their web-to-print abilities, but work conventional commercial printing with great success”</cite>.</p>
      <p>Last, but not least, a flash web site is not what you/they/anybody should aim for these days.</p>
