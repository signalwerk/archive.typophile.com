  html: <p>Hello, I am a student, re-designing a newspaper about homeless issues. I want to make it look more elegant than street. I'm looking for a typeface that has a high character count and is legible at small sizes, preferably something that is being used today in papers. Any suggestions?</p>
  html_clean: <p>Hello, I am a student, re-designing a newspaper about homeless issues. I want to make it look more elegant than street. I'm looking for a typeface that has a high character count and is legible at small sizes, preferably something that is being used today in papers. Any suggestions?</p>
