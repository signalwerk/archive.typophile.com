    html: |-
      <p>Thank you, I have Charter, and it works great. I really wanted to use Font Bureau's Miller, or Gerard Unger's Coranto or Gulliver, but unfortunately, I don't have access to those typefaces. It seems that for student work, the font shops should allow you to use their faces.<br>
      If anyone's feeling generous...</p>
