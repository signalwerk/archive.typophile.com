  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/e9h1gd03_6477.jpg"></div><br>
    I haven't been here for a long time, but i was busy doing interesting stuff.<br>
    Lately i have been working on a new blog (in Hebrew) called "The Hebrew Type Ministry" (name inspired by the "Ministry of Type" blog), which is a common online knowledge base about Hebrew Typography. <p></p>
    <p>In the last month or so, i have been working alongside Israeli type designers in order to create the bilingual <a class="freelinking external" href="http://goo.gl/blvg1" rel="nofollow">"Hebrew Typography Status Report 2012"</a> , which includes many type samples and catalogs of typefaces designed in Israel between 2012 to 2013. The document is freely available for download.</p>
