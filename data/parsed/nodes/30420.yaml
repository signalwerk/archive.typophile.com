    html: |-
      <p>Faz, if this is your first cookbook, I STRONGLY suggest you take yourself to the local bookseller and spend a few hours in the cookbook department. Cookbooks are really complicated and you should look at as many as you can to figure out what is and is not successful. They really have to be functional as well as attractive and you'll see pretty quickly which ones manage to be both.</p>
      <p>For one thing, I think the ingredients need to stand clearly apart from any other text elements (headnote, directions, tips). People use them to make their shopping list and if they are buried in the recipe or not designed well they can be confusing. They are usually easier to read flush left/rag right than centered. Also, try to make the recipes fit on a single page or spread. It's a drag to have to turn the page mid recipe when your fingers are wet or sticky.</p>
    html_clean: |-
