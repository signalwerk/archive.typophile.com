      <p>Fractions are avaiable in opentype by typing the normal figure followed by the normal slash and the normal figure. This text is then selected and "Fraction" is chosen in the popup opentype menu in InD. This will convert the normal typing into real fractions. It is a minimal amount of opentype feature code plus making the fraction glyphs.</p>
      <p>Here is a small sample:</p>
      <p>ChrisL</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/frctions_5445.png"></div><p></p>
