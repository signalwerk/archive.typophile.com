    html: |-
      <p>One more suggestion, before you actually select a typeface, become familiar with what you are doing with it. If there are photographs in the cookbook, you may want to see what they are and then "marry" (oh how we use to use that word a lot in typography) a type font to that artwork. Something that will complement rather than detract.</p>
      <p>So truth be told, I don't think any suggestions at this point would help you, the client, the designer, anyone. A good manuscript with careful thought out page layout along with photos if there are any would be the starting point for selecting a typeface or two.</p>
      <p>P.S. Note to Miss Tiffany.<br>
      I would like to offer you one tip from when we use to make fractions in typesetting - we would do the fraction in one weight up -- so the reduced numbers would maintain the same looking weight as the body copy. Just had to share.</p>
