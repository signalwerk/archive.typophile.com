    html: <p>It seems like you're trying to "cram" an even stroke through a rather low x-height with the "s", and you would probably have to with the "z" also. <br> <br>What I would suggest is either cleverly play with angles or make the middle stroke's weight thinner. <br> <br>Also, consider giving the "k" (and your to-be "z") more-or-less straight diagonals, it's okay to have some unique members in a set. <br> <br>Overall, this is a really neat style. What about that "a"? It looks a bit off... <br> <br>Good luck!</p>
