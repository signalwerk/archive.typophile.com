  html: <p>Guys, <br> <br>Well, I'm not a professional and I'm stuck with this project. I can't think of a descent numerals and "Z" character. Also, the "S" is pretty ugly (heh)...be cruel, but please - help me with some hints.  <br> <br>Thanks<img src="http://www.typophile.com/forums/messages/29/28671.gif" alt="Phatto Sample"></p>
