    html: "<p>Hi Ivan, <br> <br>Some points: <br> <br>1. Nice forms, maybe a bit too constructed for my taste. <br> <br>a: My opnion: Try to distinguish it a little more  from the six. Give him the foot it needs <br> <br>i,j: stems should be same height <br> <br>k: perhaps give the upper arm an angle <br> <br>s: the spine is way to light as it is right now.  But it's overall too constructed. Get away from a fixed witdh perhaps. Draw! <br> <br>t: make the horizontal stroke a little thinner <br> <br>u,y: too wide, should be a little more condensed than the n. <br> <br>x: too horizontal. make it a little more condensed <br> <br>For all joins (connection curve/stem): make the outline a little lighter there. You might even consider trapping. But I'm sure the man from the lambic valley will help you on this issue. <br> <br>This for the beginning.  <br> <br>Servus  <br> <br>Dominik <br></p>"
