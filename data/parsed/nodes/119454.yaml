  html: |-
    <p>Hey guys,</p>
    <p>glad to see you're still around :)</p>
    <p>Some of you may remember the time I was posting messages about the evolution of the Simplease logo. It started more than 5 years ago and it had produced a fair amount of artefacts, which can be found inside the linked messages below:</p>
    <ol>
    <li><a href="http://typophile.com/node/58042" rel="nofollow">The original post introducing the company with it's old name "Simplicious"</a></li>
    <li><a href="http://typophile.com/node/61385" title="Evolution of the Simplease logo – PART I" rel="nofollow">Evolution of the Simplease logo – PART I</a></li>
    <li><a href="http://typophile.com/node/61995" title="Evolution of the Simplease logo – PART II" rel="nofollow">Evolution of the Simplease logo – PART II</a></li>
    <li><a href="http://typophile.com/node/63567" title="Evolution of the Simplease logo – PART III" rel="nofollow">Evolution of the Simplease logo – PART III</a></li>
    </ol>
    <p>Over the last years we were relatively happy with our logo:</p>
    <p><img src="http://fs.simplease.at/XjHuBRahCo.gif" alt="Old Simplease logo"></p>
    <p>Nevertheless I was never really satisfied with how it had turned out and tried dozens of redesigns and spent hundreds of hours, working on concepts and ideas that all turned out to be mediocre at best.</p>
    <p>Some days ago there was this idea of trying to set the word in a unicase type in the hope of ending up with a nicer and simpler overall appearance. I tried some different fonts and stumbled upon <a href="https://www.myfonts.com/fonts/typeotones/designal/" title="Designal at myfonts.com" rel="nofollow">Designal</a> from Félix Rufín.</p>
    <p>I reworked the "L" to represent a lowercase "l" based on the underlying theme of DIN and worked on the overall rhythm by choosing a somewhat looser tracking. Finally I worked on the kerning and ended up with this:</p>
    <p><img src="http://fs.simplease.at/H2EJ4CptXv.gif" alt="New Simplease logo"></p>
    <p>It would be really great to get your feedback on the concept, choice of font, and especially the tracking and/or kerning.</p>
    <p>Thank you very much :)</p>
