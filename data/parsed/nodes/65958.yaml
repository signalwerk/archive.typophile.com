    <p>Doing a little project for a friend, designing a logo for the church, "Wellspring Christian Fellowship".</p>
    <p>keeping it minimalistic, as such logos would end up being printed on numerous forms of media (banners to business cards)</p>
    <p>The font is Tw Cen MT regular and condensed.</p>
    <p>attached is the vector pdf and a jpg</p>
    <p>just thought i'd get the input of this awesome community!</p>
