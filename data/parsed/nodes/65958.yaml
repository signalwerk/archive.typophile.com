    html: |-
      <p>Nice concept.</p>
      <p>I think the text looks a little thin; have you tried using bolder fonts? Maybe it is just the font hinting, but the text "WELLSPRING" looks artificially expanded.</p>
      <p>I think having "SPRING" in blue is overdoing it. In any case, for such thin letters you would need a brighter blue for it to show.</p>
      <p>The nethermost condensed text could need more tracking. Also, I think both the symbol and the text would benefit from a little more space between them.</p>
      <p>@frode, I guess the drop stands for the "wellspring" and the triangle for the holy Trinity. Am I right?</p>
