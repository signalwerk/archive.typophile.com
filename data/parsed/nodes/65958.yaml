    html: <p>This weight looks much better. Although in my opinion too much is going on with the text. The two lines differ with regard to both font, weight and tracking, and possibly size. Changing one of these variables is usually enough -- have you tried setting the second line in the same font and weight as the first line, but in a smaller grade? Also the text has three different colours; I really think black would suffice.</p>
