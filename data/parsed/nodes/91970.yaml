    <p>Hi, I'm in the middle of creating a digital version of my 40s typewriter font. So far I used Bitfonter and have now imported into FontLab. For some reason though all the glyphs became much bigger in Fontlab, exceeding the ascender and descender heights by far. Anyway, I started to go about manually changing a few whilst mindlessly watching TV only to realise that surely there must be a way to change them uniformly?? Even in BitFonter actually there is a way to resize all selected glyphs in the glyph window. Any ideas?</p>
    <p>Thanks in advance.</p>
