    html: <p>Select all your glyphs in the Font window and go to Tools &gt; Action &gt; Contour &gt; Scale. To find the right percentage, first scale a single glyph while the Transformation panel is open. (You can also scale multiple glyphs with just the Transformation panel, but there's no option to scale the metrics.)</p>
