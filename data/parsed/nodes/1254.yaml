    html: <p>Well, not obsessing but keen to track it down if I can! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I am not so familiar with the freeware/shareware font world as you folks but I checked out places like abstractfonts.com, 1001fonts.com, highfonts.com - those kind of places. I have run it through What The Font and the MyFonts.com forum (no-one picked it) and I have looked in every catalogue such as T-26 and House Industries that I can lay hands on. The font is unusual and for some reason I really like it. I want to use it on a logo if I find it.</p>
