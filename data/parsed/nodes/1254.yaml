    html: <p>Thanks Lisa P and everyone. I have come to the conclusion that it is a commissioned logo font. I have done more research and the logo appears on this website <a href="http://www.latitudetower.com.au" target="_blank">http://www.latitudetower.com.au</a> and their corporate font is Digital Sans. I therefore think the "Latitude" logo is an altered version of Digital Sans. Anyone agree there?</p>
