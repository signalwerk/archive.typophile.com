    html: |-
      <p>Closely resembles an old wood typeface called Antique Six:<br><a href="http://www.myfonts.com/fonts/woodentypefonts/antique-six/">http://www.myfonts.com/fonts/woodentypefonts/antique-six/</a></p>
      <p>Haven’t found any digital matches to the |M| with the pointed center vertex shy of the baseline and the |B| with the stepped back upper bowl. Giza Five Seven by Font Bureau, Material Headline by Optimo, or Egiziano Classic by Dennis  Ortiz-Lopez might be decent contemporary substitutes:<br><a href="http://www.fontbureau.com/fonts/Giza/styles/">http://www.fontbureau.com/fonts/Giza/styles/</a><br><a href="http://www.optimo.ch/typefaces_Material_Headline.html">http://www.optimo.ch/typefaces_Material_Headline.html</a><br><a href="http://www.myfonts.com/fonts/ortizlopez/olegiziano-classic/">http://www.myfonts.com/fonts/ortizlopez/olegiziano-classic/</a></p>
