      <p>I think that the ampersand is OK. But the numbers don't work. I think that you have to completely redo them, even if that means sacrificing historical accuracy. Make them feel right, and you'll have a good piece of work.</p>
      <p>Can you make a text setting with your letters? Its hard to judge the uppercase letters without some sort of combination.</p>
