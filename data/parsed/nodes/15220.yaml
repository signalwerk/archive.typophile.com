    <p>Greetings all, and thank you for taking the time to review not only my first post to these forums but also my first sans/display face.</p>
    <p>Some time ago I reproduced a World War I poster reminding Americans that electricity consumes coal. It was commissioned by the US Fuel Administration and drawn by Coles Phillips... <a href="https://web.archive.org/web/20150123060900/http://garyritchie.com/txp/index.php?id=21" title="http://garyritchie.com/txp/index.php?id=21">http://garyritchie.com/txp/index.php?id=21</a></p>
    <p>I drew the remaining capitals and numerals taking the best care that I follow the original style. The &amp; looks awkward to me and the @ is awful.</p>
