    html: <p>Don't know this one and really doubt it could be a font actually, more a custom logo work. If you need the 3 letters only, I suggest you to recreate them. You could start from any generic sans of your own simply reworking top left angles or redraw it from scratch as it is only made with strokes. Start upright, shear it to match you sample and round angles. That should be even quicker than waiting for someone to identify it.</p>
