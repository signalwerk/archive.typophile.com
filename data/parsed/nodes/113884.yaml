    <p>Hello everyone,<br>
    I am currently writing a dissertation on type technology, focused on developing a workflow for creating multiweight script/cursive families utilizing Multiple Master technology and some Metafont/Metapost techniques. To be more precise my objective is help the designer in creating calligraphy and brush scripts – of the kind which weight cannot be just changed without complete redrawing (you can’t just move stems around). </p>
    <p>The basic concept is to allow the artist to draw his characters in whatever software product he chooses, when he/she is satisfied with the result, he imports the centerlines in whatever font production software, activates the script, enters brush parameters and receives two masters with clean outlines minimum number of points and PS drawing standards compliant and etc. It sounds simple and it actually is – as I have managed to create a working model written in Python (proof of concept) and I am currently using it for font development. </p>
    <p>So you all know having working model does not complete a dissertation. As I am currently writing the first chapter of my monograph I am struggling with the following problem: I cannot seem to find any other authors that worked on the same subject – mutiweight script/cursive families. I know that there must be at least couple of authors that have addressed the problem in the past. So could you please point me to some articles or books concerning the subject? </p>
    <p>Thank you in advance!<br>
    Vassil</p>
