    html: |-
      <p>The answer is there is no way to do this automatically — in real time — in InDesign. I.e., you can't do an on-the-fly search-and-replace to change hard returns to something else. A GREP style won't do it, and there's annoyingly no "real time" search-and-replace feature.</p>
      <p>For one brief moment of hope, I thought AutoCorrect might help you out, but you can't enter a return as a character in AutoCorrect. Returns sort of have their own special rules.</p>
    html_clean: |-
