    <p>Dear Typophile users,<br>
    I am wondering if there is a way to set the text without the paragraph breaks (or returns) using pargraph marks instead (like a pilcrow or such - ¶)  in an automatic way (without having to search and replace it with find and change in InDesign).<br>
    In that way making a solid block of text.<br>
    Here is an example (<em>Symbol without indent or line break</em>):<br>
    <a href="http://www.thinkingwithtype.com/contents/text/#Marking_Paragraphs" title="http://www.thinkingwithtype.com/contents/text/#Marking_Paragraphs">http://www.thinkingwithtype.com/contents/text/#Marking_Paragraphs</a></p>
    <p>I look for a similar thread but could not find it...<br>
    So any help to make it easier to achieve will be welcome.<br>
    Thanks in Advance</p>
