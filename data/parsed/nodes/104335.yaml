    html: |-
      <blockquote><p>I.e., you can't do an on-the-fly search-and-replace to change hard returns to something else</p></blockquote>
      <p>???<br>
      We get in manuscripts all the time that use the following coding</p>
      <blockquote><p>... sdfkjg azsdfkl aslkdf awelt asdfj asdrfkgj aslkj asdflkj aweotu awet aslkdfj asldfkj<br>
      {A}<br>
      This is an A-subhead<br>
      {txt} aweroptu aqtrwiu sdfkjg azsdfkl aslkdf awelt asdfj asdrfkgj aslkj asdflkj aweotu awet aslkdfj asldfkj</p></blockquote>
      <p>OK. I want to apply paragraph styles globally. I first search for </p>
      <p>{A}<br>
      and throw out the return, so it is on the same line a the text proper,  e.g.,</p>
      <p>{A}This is an A-subhead</p>
      <p>Done by searching for {A} &amp; the special end of paragraph wildcard token, and replacing it with only {A}</p>
      <p>To finish the story... I then search for the character {A} with a paragraph style  of "text" and replace the paragraph style with "Ahead".</p>
      <p>One more search to dump the code {A}.</p>
      <p>All done with "find and replace," it takes very little time for a chapter ("story" in InDesign) or even an entire book ("all")</p>
      <p>But the first step was knocking out that unwanted hard return, so the {A} code was in the same paragraph as the text of the subhead.</p>
      <p>While I'm home &amp; haven't tested it exactly, I'm 99.44 &amp;% sure you can do that &amp; replace the hard return with a pilcrow &amp; spaces, using either "selection", "story", or "all" ("all" probably  not a smart choice...)</p>
    html_clean: |-
