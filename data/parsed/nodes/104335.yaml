    html: |-
      <p>Yes, of course you can do a search-and-replace.</p>
      <p>I said you can't do it "on the fly" — i.e., you can't set it up so every instance of a hard return <em>automatically</em> becomes a sequence of pilcrow surrounded by spaces every time it's typed, without actively executing a search and replace.</p>
      <p>In other words, a GREP <em>search</em> will work, but a GREP <em>style</em> won't.</p>
      <p>The original poster specifically asked if you can do this "without having to search and replace it."</p>
      <p>The answer is no, unfortunately you can't.</p>
