    html: |-
      <p>Remember that for "paragraphs" over a certain number of characters -- pretty low, as I remember -- InDesign reverts to the single line composer mode.</p>
      <p>Otherwise, just search for end of paragraph &amp; replace it with a space of some sort, a pilcrow, and another space.</p>
      <p>Not what you asked, but I don't see the issue of doing this globally. Then go back &amp; put in whatever paragraphing you do want.</p>
      <p>If you want it global &amp; semiautomatic, just set up a grep search/style. However, at some point, you'll probably want an end of paragraph, so I'd advise against this.</p>
