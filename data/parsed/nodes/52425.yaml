    html: |-
      <p>InDesign (and many Adobe apps) use NameID=17 for the subfamily or "style" field, if present. If it is absent, they fall back to NameID=2. NameID=2 is what you'll be seeing in Windows preview, I expect.</p>
      <p>With any luck the FontForge documentation will have enough info to tell you which of its fields correspond to these values.</p>
      <p>Cheers,</p>
      <p>T</p>
