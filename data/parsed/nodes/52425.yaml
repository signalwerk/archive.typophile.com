    <p>Hi folks. I'm in the process of teaching myself to make fonts in FontForge, and I thought I'd start with a fairly simple project: converting some resource-fork fonts to OpenType format.</p>
    <p>I started with a family of Cochin containing the usual Roman, Bold, Italic, and Bold Italic. Everything seems to work perfectly, except that the Bold Italic shows up in InDesign's font list as "BoldItalic" (no space). When I preview the font in Windows, I see the space. If I change the "Name For Humans" field in FontForge to "Test," it reads as "Cochin Test" in the Windows preview but still as "BoldItalic" in InDesign.</p>
    <p>It seems clear that InDesign is reading a different field for the name of the font, but I can't figure out what or where it is. Can anyone tell me? Thanks.</p>
  html_clean: |-
    <p>Hi folks. I'm in the process of teaching myself to make fonts in FontForge, and I thought I'd start with a fairly simple project: converting some resource-fork fonts to OpenType format.</p>
    <p>I started with a family of Cochin containing the usual Roman, Bold, Italic, and Bold Italic. Everything seems to work perfectly, except that the Bold Italic shows up in InDesign's font list as "BoldItalic" (no space). When I preview the font in Windows, I see the space. If I change the "Name For Humans" field in FontForge to "Test," it reads as "Cochin Test" in the Windows preview but still as "BoldItalic" in InDesign.</p>
    <p>It seems clear that InDesign is reading a different field for the name of the font, but I can't figure out what or where it is. Can anyone tell me? Thanks.</p>
