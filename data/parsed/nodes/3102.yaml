    html: <p>Thomas, if I remember correctly the HindiSanskrit font is an ANSI hack font, which gives very basic Hindi shaping. I suspect the problem is simply in the conversion from a non-Unicode to a Unicode environment in which whatever code was being used as the space in the PageMaker file is not being correctly interpreted in InDesign. <br> <br>Jon, have you tried replacing the boxes with a space character in another font?</p>
