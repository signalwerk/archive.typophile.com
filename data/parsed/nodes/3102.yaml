  html: <p>A colleague has converted a Hindi language brochure from PageMaker 6.5 to InDesign 2. She opened the original .p65 file in ID2 to accomplish this. <br> <br>The document used a Hindi font called "HindiSanskrit". The resulting converted document has little squares inserted between every few characters. If you select the squares they show as the HindiSandkrit. <br> <br>We have tested doing this on two machines that have the font installed. It happens on both. <br> <br>We have determined that these boxes are character spaces. What we need to do is make the boxes go away, and the space remain. Obvious replacements don't seem to work. <br> <br>Any insight would be appreciated. <br> <br>Jon</p>
  html_clean: <p>A colleague has converted a Hindi language brochure from PageMaker 6.5 to InDesign 2. She opened the original .p65 file in ID2 to accomplish this. <br> <br>The document used a Hindi font called "HindiSanskrit". The resulting converted document has little squares inserted between every few characters. If you select the squares they show as the HindiSandkrit. <br> <br>We have tested doing this on two machines that have the font installed. It happens on both. <br> <br>We have determined that these boxes are character spaces. What we need to do is make the boxes go away, and the space remain. Obvious replacements don't seem to work. <br> <br>Any insight would be appreciated. <br> <br>Jon</p>
