    date_raw: 13 Feb 2004 — 2:13pm
    votes: null
    html: "<p>Okay here's the scoop: <br> <br>My colleague experimented and found that replacing the character spaces with those from another font in PageMaker <b>before</b> opening in ID2 did the trick. <br> <br>John: Thanks for the note about Publisher. At least there's something. I wonder though with more and more OS level support for unicode and comlpex scripts in Windows, Mac OS X, and in Linux (especially in desktop environments like GNOME), why more sofware just doesn't start with this capability out of the box... <br> <br>Jon</p>"
