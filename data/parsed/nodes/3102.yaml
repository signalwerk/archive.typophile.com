    votes: null
    html: <p>In Adobe's case, the software relies less and less on operating system resources for things like text layout. The positive aspect of this is that it makes it much easier for Adobe to provide cross-platform exchangeability; the down side is that they are not able to take advantage of things like complex script handling offered by the OS, and need to develop these things themselves. Their development partners Winsoft, who produce the Middle East version of Adobe apps, have done a very good job implementing Arabic and Hebrew support. Nothing yet for Indic.</p>
