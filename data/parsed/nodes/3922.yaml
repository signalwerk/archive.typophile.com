    html: <p>Yes, this is <i>slightly</i> off topic, but only a tiny bit.  <br> <br>In principle, the idea of being able to bump into people at conferences seems appealing and accessible to all, but it can be very hard for some of us to build up the courage to speak to those whom we hold in such high regard, Jonathan.  <br> <br>TypeCon2002 is going to be my first conference, and while I may seem fairly confident on the web or via email, it is a different matter altogether in person. Shyness and a lack of confidence carries the risk of being misconstrued as aloofness and arrogance unfortunately. <br> <br>So, maybe I could suggest that some of us on Typophile who are travelling to Toronto for TypeCon2002 arrange to meet up for a drink, break some ice and get to know eachother a bit better? <br> <br>Just a thought <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"></p>
