    html: <p> &gt; there are quite a few illustrious long-time attendees who aren't members <br> <br>True*, but like Kent said, I was talking about the mailing list, and by extension actual membership in the organization (as opposed to going to a conference, a much less nebulous decision to make). Unless you have a very large loudspeaker (not to mention more gall than would be advisable, even by me) you can't ask questions to a collection of experts during the conference. Not that most of them generally reply on the ATypI  list anyway :-/ especially if you're unwilling to spend a few years groveling before asking anything of any significance... <br> <br>* In fact, I would point to this as an indication of the large difference between being a member versus going to the conference. <br> <br>&gt; that's where I got my jump-start <br> <br>My own intial large-scale exposure to other type designers (at least in the physical realm - which still has advantages over cyberspace) was at the supremely wonderful TypeCon98. That was one trippy event, with an atmosphere completely different (and certainly much more "open") than ATypI99 in Boston, my second outing. <br> <br>hhp </p>
