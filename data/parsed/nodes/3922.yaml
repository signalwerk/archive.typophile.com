    html: "<p>Seriously: <br> <br>First, there was a discussion about this on the ATypI list itself, a little over a year ago. It starts here: <br><a href=\"http://www.textmatters.com/pipermail/members/2001-February/014320.html\" target=\"_top\">http://www.textmatters.com/pipermail/members/2001-February/014320.html</a> <br> <br>The conference and membership are not strongly related; the conference discount you get does not make up for the membership. So attending a conference is a great idea for anybody, as long as you can justify the cost wrt what you get out of it. But even for somebody with not enough reason to be a regular at ATypI conferences, it's probably a good idea for any font freak to do it at least once, especially if there's a geographic facility. And Tiffany's right about Rome: it does look like it's going to the best one in a while. But I've only been to two before, so... <br> <br>Now, when it comes to being a paying member, that's frankly much harder to justify. I suspect that many people do it as a socio-professional obligation. Some people do it because it does feel like a fraternity, to some extent. And some people do it because they're freaks (like my case). On the other hand, membership does have its priviledges: you get first access to certain publications; you get to ask questions of the notably illustrious members (as opposed to just listening to them); and once in a while you get favorable treatment versus non-members (which is natural for any organization). <br> <br>So give it all some serious consideration, and you might find that it's for you after all. <br> <br>hhp</p>"
