    html: <p> Ahh David! <br> <br>Glad you are coming! I think you'll enjoy it lots and lots! I would have been there this year but my son is due the day Typecon starts. . . . the wife just won't let me get away for it :D <br> <br>Anyhow, to your point about meeting people that you only know by name and work. You have no reason to psych yourself out about approaching personal idols of typography. <br> <br>Chances are you'll both look at eachothers nametag and instantly know who one another is. It's actually quite fun! People are suprisingly approachable and for the most part wouldn't have gone to the conference if they too weren't intersted in "getting out from behind the monitor" to meet the world! <br> <br>Bring some of that good UK lager, you'll be making friends before you know it! <br> <br>Stuart :D </p>
