    html: <p> &gt; you can't ask questions to a collection of experts during the conference <br> <br>I've been going to ATypI since 1989, and this really hasn't been my experience. At my first ATypI, I met Mike Parker at dinner, Erik Spiekermann at a cocktail party, Erik and Just at my hotel, and John Dreyfus en route to Adrian Frutiger's house. <br> <br>I certainly wouldn't recommend using the question and answer session after someone's lecture to discuss personal business, nor is it a good idea to buttonhole anyone without warning, but this has less to do with ATypI than with good manners. I've enjoyed meeting a lot of people at ATypI over the years, and I'd recommend the conference to anyone interested in type. </p>
