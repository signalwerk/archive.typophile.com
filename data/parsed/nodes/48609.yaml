    <p>Newbie post. I’ve been asked by a client about the Kindle format so I thought I’d query the collective.</p>
    <p>I’ve read that only .TXT and .AZW are readable on the Kindle. That seems odd, but understandable. Has anyone read anything which they’ve bookmarked which explains the conversion process and/or how it looks?</p>
    <p>Update: I am aware of the <a href="http://dtp.amazon.com/mn/signin">Digital Text Platform</a> area on Amazon.</p>
