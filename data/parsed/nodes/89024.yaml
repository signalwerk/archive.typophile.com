    html: <p>I think you've got the makings of two faces here, and you should save your work and then decide which one you want to do first. For the solid-blocks concept you seem to be going for, you can easily start filling in more notches to match that last new R. But I look at what you've got now for L,M,N,T,V,W,X and see what could be a very respectable heavy sans in the more traditional vein, so if you take the cue from those and start punching out counters I think you'll learn a lot more and finish with something more valuable.</p>
