    html: |-
      <p>You're on your way! Maybe I'm seeing things, but the R of 6:44 looks balanced while the R of 8:01 doesn't.<br>
      D can stand to be wider, if that helps you distribute the weight.<br>
      B will almost certainly need a different outer shape in this version if you want the counters to work.<br>
      A: lower the counter.<br>
      It is not absolutely necessary for the bowl of P and R to be identical; enlarging the P bowl vertically may help.</p>
      <p>J is still out there in what-are-you-doing land. Remove the right serif, or remove the whole serif-crossbar, or start over with a narrow J form.</p>
      <p>When it's all starting to come together, you'll want to look at the glyphs that are perfect for the block version (which, again, keep them for that) and decide whether they really fit this version. Z, for instance, should either be made as narrow as L or cut deeper. E and F are a toss-up: They may still fit, in a daring and distinct kind of way. You might bring down a full crossbar for F and leave E as it is. With the support of the current E and F you <em>might</em> even go for removing the top counter of B, which would something quite new.</p>
    html_clean: |-
