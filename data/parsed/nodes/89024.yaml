    html: "<p>/T/'s color is much more lighter than the rest of the alphabet. /J/ doesn't work: it's \"open\", unlike the rest of the alphabet and therefore creates an edge effect, isolating it even more from the design style. /2/ looks like a kind of ampersand and /6/, /9/ are unrecognizable. I'd like to see /C/ and /G/ in a word to check if they really work as they are. I like the overall feel of the font, yet I think you should check the inconsistencies of the \"cuts\" of the letters. For instance, compare /R/'s bottom and right cut; and /M/, /V/, /W/, /X/, /Y/ as opposed to /N/, /Z/. Good start ;)</p>"
