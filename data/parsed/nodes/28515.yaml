    html: <p>The TTConverter is a freeware to convert Windows-TTF to Mac-TTF. It works good or less. So the author Frank Rausch probably means if you want to use the font on MacOS &gt;9.x machines try the TTConverter. If you have MacOSX, then use the Windows TTF. It works here and there.</p>
