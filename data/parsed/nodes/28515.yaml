  html: |-
    <p>I'm desperately trying to approximate the gorgeous hand-painted Michelin road signs of France, and am looking for the closest type match to fake them with.</p>
    <p>The Roadgeek series doesn't have what I'm looking for. I was offered <a href="http://simplythebest.net/fonts/fonts/caracteres.html" rel="nofollow">Caracteres</a> as a possible match, yet the Mac .sit did not contain any font files. Can anybody help me out?</p>
    <p>Thanks in advance.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/michelin_signs_3722.jpg"></div><p></p>
