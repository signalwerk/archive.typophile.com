      <p>_The Barclay_ is unusually rounded for a blackletter. Some similarities in letter forms but not as English feeling Cranach <a href="http://www.identifont.com/find?similar=Cranach&amp;q=Go" title="http://www.identifont.com/find?similar=Cranach&amp;q=Go">http://www.identifont.com/find?similar=Cranach&amp;q=Go</a><br>
