    html: |-
      <p>Most definitely hand calligraphy, and I've had no luck approximating it with a single font.</p>
      <p>Notre Dame comes close for the lowercase letters:<br>
      <a href="http://www.myfonts.com/fonts/linotype/notre-dame/" title="http://www.myfonts.com/fonts/linotype/notre-dame/">http://www.myfonts.com/fonts/linotype/notre-dame/</a> </p>
      <p>Caslon Gotisch may be a place to start with the capitals (though they'll need a lot of editing):<br>
      <a href="http://www.myfonts.com/fonts/rmu/caslon-gotisch/" title="http://www.myfonts.com/fonts/rmu/caslon-gotisch/">http://www.myfonts.com/fonts/rmu/caslon-gotisch/</a></p>
      <p>If you absolutely have to recreate it cleanly, I'd suggest hiring a competent calligrapher, then digitize the results.</p>
      <p>Oddly enough, I found a piece of Barclay stationery from 1944--similar style for the nameplate, but not a match to your sample:<br>
      <a href="http://www.schulsonautographs.com/pages/books/2452/cole-porter/typed-letter-signed-4to-on-the-barclay-hotel-stationery-philadelphia-nov-29-1944" title="http://www.schulsonautographs.com/pages/books/2452/cole-porter/typed-letter-signed-4to-on-the-barclay-hotel-stationery-philadelphia-nov-29-1944">http://www.schulsonautographs.com/pages/books/2452/cole-porter/typed-let...</a></p>
  - id: 582875
