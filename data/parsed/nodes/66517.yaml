    html: <p>I'm currently trying out a couple of weights of Fedra Sans Alt on <a href="http://www.ninastoessinger.com" rel="nofollow">my own site</a>, as sort of a test. It seems that rendering quality on Windows is a real issue? I must admit I'm not really up to date with all the background; to be on the safe [but still <em>somewhat</em> progressive :-) ] side, I think I'll limit it to titling at the moment, and only in situations of course where fallback fonts are also OK, so that the @font-face becomes sort of a «bonus» for those people who can see it.</p>
