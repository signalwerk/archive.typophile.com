      <p>There's beginning to be a nice collection of very usable open source and/or freely licensed stuff out there that makes the subscription issue less of an issue.</p>
      <p>However, the lack of proper anti-aliasing (at least in Firefox) really turns me off still. </p>
      <p>I wasn't aware that WOFF has come to FF, though. Good news!</p>
