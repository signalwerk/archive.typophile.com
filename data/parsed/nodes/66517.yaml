  html: |-
    <p>There are two major drawbacks with @font-face at the current state, IMO: The subscription model (exception for Typotheque) and the unreliable browser rendering. Both makes me uneasy about using web fonts for anything but playing around. </p>
    <p>Have any of you actually relied on @font-face in real life projects?</p>
