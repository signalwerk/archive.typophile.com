  html: |-
    <p>Dear fellow Typophiles,</p>
    <p>I am currently looking for samples of 'famous' <a href="/wiki/handwriting" class="freelinking" rel="nofollow">handwriting</a> scripts. I am especially interested in samples of Blaise Pascal's handwriting. Anyone of you ever 'searched' for / noticed / found such samples, sources and lettering excerpts? <em>(Please note, I am not 	necessarily looking for actual typefaces, based on famous handwriting. But I am of course open and thankful for any suggestions and hints.)</em></p>
    <p>Thank you.</p>
    <p>Dav</p>
  html_clean: |-
    <p>Dear fellow Typophiles,</p>
    <p>I am currently looking for samples of 'famous' <a href="/wiki/handwriting" class="freelinking link-lost" rel="nofollow">handwriting</a> scripts. I am especially interested in samples of Blaise Pascal's handwriting. Anyone of you ever 'searched' for / noticed / found such samples, sources and lettering excerpts? <em>(Please note, I am not 	necessarily looking for actual typefaces, based on famous handwriting. But I am of course open and thankful for any suggestions and hints.)</em></p>
    <p>Thank you.</p>
    <p>Dav</p>
