      <p>Just two links:<br>
      <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=1&amp;ID_Message=2843" target="_blank" rel="nofollow">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=1&amp;ID_Message=2843</a><br>
      <a href="http://www.kltf.de/downloads/FontNaming-kltf.pdf" target="_blank" rel="nofollow">http://www.kltf.de/downloads/FontNaming-kltf.pdf</a><br>
      Please also google for phrases like<br>
      &nbsp;&nbsp;&nbsp;<em>"font naming" site:typophile.com</em><br>
      which should return some useful Typophile threads; I think almost all possible questions have been dealt with extensively here.</p>
      <p>What you did is one possible solution (scheme B in the PDF). Personally I think there's nothing bad about it, and with really big families it is the only solution to achieve cross-platform compatibility. Depends how one defines this, though.<br>
      In case of your three-weights family however, you might also try to divide your family into two families on the level of the 'Family Name'<br>
      &nbsp;&nbsp;&nbsp;<em>MyFont</em><br>
      &nbsp;&nbsp;&nbsp;[as 'Family Name' for]<br>
      &nbsp;&nbsp;&nbsp;<em>-- Regular</em><br>
      &nbsp;&nbsp;&nbsp;<em>-- Italic</em><br>
      &nbsp;&nbsp;&nbsp;<em>-- Bold</em><br>
      &nbsp;&nbsp;&nbsp;<em>-- Bold Italic</em><br>
      &nbsp;&nbsp;&nbsp;<em>MyFont Medium</em><br>
      &nbsp;&nbsp;&nbsp;[as 'Family Name' for <em>Medium</em> and <em>Medium Italic</em> whose 'Style Name' now is]<br>
      &nbsp;&nbsp;&nbsp;<em>-- Regular</em><br>
      &nbsp;&nbsp;&nbsp;<em>-- Italic</em><br>
      and then tick the Italic/Bold checkbox for styles <em>Italic</em>, <em>Bold</em> and <em>Bold Italic</em>. Further, on the FontInfo page for OpenType-specific names, you can name your font <em>MyFont</em> for ALL styles ('OT Family Name'), and name the medium weights' styles <em>Medium</em> and <em>Medium Italic</em> ('OT Style Name'). This will give you a family of six weights e.g. in InDesign. And will result in two families e.g. in Word where <em>MyFont</em> consists of <em>Regular</em>, <em>Italic</em>, <em>Bold</em>, <em>Bold Italic</em>, while <em>MyFont Medium</em> consists of <em>Regular</em> and <em>Italic</em>; the latter smaller family may still result in fake bolding if people use the Bold button with <em>MyFont Medium</em> since there's no 'real' in this family.<br>
      Numeric weight values could be 400 for regular, 500 or 600 for medium, and 700 for bold weights.</p>
      <p>[Edited twice or three times ...]</p>
