    <p>I know this is a somewhat age-old topic, but I couldn't find the specific answer to my question and so I am turning to Typophile:</p>
    <p>I am trying to generate a 6-font family for a client who uses windows (regular, medium and bold weights; each with roman and italics). I have managed to get the naming issues sorted, so that each variant displays and functions in windows/office drop-down font list. However, when I open the fonts panel form the format menu, windows is producing 'bold' and 'bold italic' versions of the regular and the medium weights (I have attached a scan of the output which shows this) - but not in the bold weight.</p>
    <p>I am generating from fontlab 5  and presume that since the Bold and Bold italic versions are working fine, that this issue is connected to 'Font is Bold/Font is italic' tick-boxes in the first page of the font info panel.</p>
    <p>Has anyone ever experienced this/know a work-around  to solve this issue?</p>
    <p>Thanks,<br>
    Mike</p>
