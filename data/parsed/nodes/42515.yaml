      <p>I take your point about the font menu being longer, and wouldn't advise this as normal practice. </p>
      <p>In this case, I considered it's anticipated usage as the predominant (if not exclusive) corporate font on a limited number of workstations to be a valid motive for taking this step, as well as the fact that there is only 6 fonts in the family. I appreciate this could become an issue should the client requests an expansion of the family at a later date.</p>
      <p>I did keep the 16 &amp; 17 names correct, and they appear as a single family in OT-savvy apps - Thanks Tom!</p>
      <p>Mike</p>
