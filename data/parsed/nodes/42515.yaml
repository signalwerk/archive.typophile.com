      <p>Ralf thanks for your reply. </p>
      <p>Taking this information, I have been playing around with the settings, I think I have come up with a work-around. I would now like my fellow typophiles opinions on whether this would be acceptable/good practice:</p>
      <p>...so, noticing that the Bold and Bold Italic weights didn't suffer from this anomaly, I have ticked both boxes ('Font is bold' + 'Font is italic' in the font info pane) for all the variants. I have adjusted the the font naming accordingly, so that now each variant has a single typeface name and in effect displays as 6 different typeface families in the windows drop-down font list. </p>
      <p>Although each variant still has 'regular' and 'italic' in the font styles drop-down list, selecting 'italic' has no effect and the roman is still displayed. Similarly, clicking the 'B' or 'I' buttons does not alter the appearance. </p>
      <p>In effect, the styles have been bypassed, and each font style has been saved as a single typeface family. This forces the user to select the precise weight and/or style from the font list, and prevents accidental use of the synthesised weights and styles. The only downside that I can foresee would be the added 'effort' for users who are accustomed to utilising the 'B' and 'I' buttons (though maybe there are other issues that I have not thought of - your opinions on this aspect would be most welcome).</p>
      <p>Mike</p>
