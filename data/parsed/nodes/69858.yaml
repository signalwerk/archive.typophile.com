      <p>For Immediate Release <br>
    <em>De Pinte, Belgium - April 22, 2010</em></p>
    <p><strong>Fayon – a high performance Didot for text </strong><br>
    <a href="https://ourtype.com/#/try/fayon/" rel="nofollow">OurType Fayon</a> is a practical result of <a href="https://ourtype.com/#/our-designers/peter-mohr/" rel="nofollow">Peter Mohr</a>'s daring study of Didot style printing types, and his attempts to discover exactly how they emerged into the world of typography. Peter's theoretical body of work is published in <em>Zum Ursprung Klassizistischer Antiquaschriften,</em> Hochschule für Grafik und Buchkunst, Leipzig, July 2009.</p>
    <p>Didot style types, characterized by their high contrast, dominated text composition in the first half of the nineteenth century. As greater control was brought to typecasting- and printing processes, these same factors, in turn, drove Didot style types towards excessive refinement. By the middle of the nineteenth century, their extremes of contrast and fineness produced a 'flimmering', an optical effect that readers found especially disturbing in longer texts. By the end of the 1800s printers and publishers turned back to the old face types of an earlier period, a trend that dominated text typography over the course of the twentieth century. Today Didot style types remain an important part of the typographer's palette and, more that two hundred years after their introduction, they are still called on to evoke luxury, fragility and elegance, most typically in woman's fashion magazines.</p>
    <p>OurType Fayon, whose name derives from the 'Feio' composition recorded by Miles Davis during the <em>Bitches Brew</em> sessions, is a fresh interpretation of the early Didot style, when it was 'well on its way' but still evolving. It's a period that now seems unpopular among young type designers – even a bit hazy. In Fayon, Peter Mohr avoids the clichés so often found among Didot-style types through his skillful manipulations of contrast that are not over-played. The result is a high performance typeface that – in text composition especially – is Didot in mood and still easy to read.</p>
    <p>OurType Fayon comes in a family of fourteen fonts, with seven weights of roman and italic designs, and is available in OpenType STD and PRO, covering Basic Latin and Latin Extended character sets. Display styles are underway and scheduled for release later this year.</p>
    <p><strong>About Peter Mohr </strong><br>
    Peter Mohr is a graphic designer born in Germany. After his two-year study at the <a href="http://www.aik-web.de/" rel="nofollow">Academy for Information and Communication Design</a> (AIK) in Dresden, Peter graduated in Media Design in the summer of 2003. He went on studying graphic and typeface design at <a href="http://www.hgb-leipzig.de/" rel="nofollow">Hochschule für Grafik und Buchkunst</a>, Leipzig the same year, graduating in Cum Laude in Type Design in 2009.</p>
    <p>During his time at HGB Leipzig Peter has been developing a special interest in historical, economical and technical aspects of Latin printing types.</p>
    <p>Peter currently lives and works in Leipzig. </p>
    <p><strong>About OurType</strong><br>
     Founded in 2002, OurType is an independent type foundry led by Fred Smeijers, Corina Cotorobai and Rudy Geeraerts. Its signature collection consists of premium typeface designs that respect traditional values and yet are tailored to contemporary needs. In addition to its renowned designers, <a href="https://ourtype.com/#/our-designers/fred-smeijers/" rel="nofollow">Smeijers</a> and <a href="https://ourtype.com/#/our-designers/peter-verheul/" rel="nofollow">Peter Verheul</a>, OurType also publishes fonts from some of the best young talents: <a href="https://ourtype.com/#/our-designers/nikola-djurek/" rel="nofollow">Nikola Djurek</a>, <a href="https://ourtype.com/#/our-designers/andre-leonardt/" rel="nofollow">André Leonardt</a>, <a href="https://ourtype.com/#/our-designers/merel-matzinger/" rel="nofollow">Merel Matzinger</a>, <a href="https://ourtype.com/#/our-designers/artur-schmal/" rel="nofollow">Artur Schmal</a>, <a href="https://ourtype.com/#/our-designers/thomas-thiemich/" rel="nofollow">Thomas Thiemich</a>, <a href="https://ourtype.com/#/our-designers/hendrik-weber/" rel="nofollow">Hendrik Weber</a>, and <a href="https://ourtype.com/#/our-designers/maurice-goeldner/" rel="nofollow">Maurice Göldner</a>, now joined by <a href="https://ourtype.com/#/our-designers/peter-mohr/" rel="nofollow">Peter Mohr</a>.</p>
    <p>The OurType collection is available at <a href="http://www.ourtype.com" title="http://www.ourtype.com">http://www.ourtype.com</a>.</p>
