    html: |-
      <p>sample needs to be bigger, and you might get more feedback that way.</p>
      <p>also, it should be in the critique section, and you only need to start one thread. :)</p>
      <p>that said .... :)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eloize2_1_6711_3934.jpg"></div><p></p>
      <p>• Bottom horizontal stroke on the C seems too short.</p>
      <p>• stress on the O is completely different than the C and Q above. Not sure that you<br>
      need the angled stress on the O.</p>
      <p>• Cirque colors light compared to Eloize, not sure if that's your intention. Cirque feels like it's too small.</p>
      <p>• kerning needs some work. Compare the E-L combo, for example, to the O-I.</p>
      <p>• the Z-E seems like it would work better if the Z was longer and extended further right, which would also help narrow the large gap. </p>
      <p>• The tail on the Q ... maybe it should mimic the Z?</p>
      <p>best of luck eric.</p>
    html_clean: |-
