    html: |-
      <p>The Z does not conform to the feel of the other characters. It has a sweeping swash tail as opposed to a straight line terminating in a curve.<br>
      If you're going to take the Z away from the style of the other letterforms, you could explore playing with the Z so it is perhaps more illustrative - suggestive of a bolt of lightning or something similar (which will tie in with your Eloize theme). It needs some thought and sensitivity though.</p>
      <p>BJ harvey makes a good observation with the C, Q and O not being the same. Id choose one or the other and stick to it.</p>
      <p>/Dimi</p>
      <p>:::::::::::::::::::::<br>
      Wicked Design Potions</p>
