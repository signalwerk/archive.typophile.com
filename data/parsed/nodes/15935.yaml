      <p>Eric, there is clearly no consensus on what defines titling caps stylistically. </p>
      <p>Historically, in a practical sense, they were simply capitals which used the entire type body (i.e., including the descender space). Thus, in a 60 point titling font, the caps would be nearly 60 points tall (minus overshoot space and other design considerations). Also, the J and Q would be designed not to extend below the baseline since there was no metal down there. Etc. </p>
      <p>Titling caps in modern fonts are not really the same thing. I know of none that are designed to fill the em square in the way that traditional titling caps did.</p>
    html_clean: |-
