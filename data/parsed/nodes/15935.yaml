    html: |-
      <p>&gt;essentially a large optical size</p>
      <p>I don’t think this is accurate. Jonathan Hoefler pointed out in an interview that regular caps are designed primarily to go with the lower case, whereas titling caps are designed for an all-caps setting. This is the essential difference. For example, Hermann Zapf did two versions of Titling Caps for Palatino, one thinner than the roman and one thicker—Michaelangelo and Sistina, now with different names in Palatino Nova. In both cases I believe that they have a greater variation in width from the regular roman caps. This is a tendency in Titling Caps, following the Roman letters on the Trajan column in Rome. Also titling caps will generally be spaced looser because of the intended all caps setting, I believe.</p>
    html_clean: |-
