      <p>&gt; the relative height on the body has varied</p>
      <p>In metal, titling caps almost always fill the entire EM height. This is for reasons of efficiency as well as the lack of negative leading: if you wanted tight multiple lines of all-caps the lc descender area would get in the way! In digital, because of the ease of sizing and negative leading, and because there can always be an advantage to lining up baselines (between a titling font and normal one) I think it’s better to avoid the old metal standard.</p>
      <p>&gt; the J and Q would be designed not to extend below<br>
      &gt; the baseline since there was no metal down there.</p>
      <p>Sometimes they kerned though.</p>
      <p>&gt; in titling caps there can and perhaps should<br>
      &gt; be more variation in the width of the letters</p>
      <p>This can be considered an optical compensation though. When Thomas focuses on optical compensation, I think he’s about 90% there actually - at least in relation to a text cut - the further elaborations can be said to explain the differences between titling and display cuts.</p>
      <p>As for the nature of titling caps, I’d just<br>
      add one thing: you need a lot more... Drama.</p>
      <p>hhp</p>
