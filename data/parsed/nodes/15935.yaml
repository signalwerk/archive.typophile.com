      <p>A couple of other things: </p>
      <p>You might wonder why they would have made titling caps the way they did in the first place. One reason (probably the main reason) was for large inset initial caps on paragraphs. Since there was no extra space for descenders below the cap, you got a nice snug fit.</p>
      <p>The other thing to keep in mind (and this relates to Thomas’ comment about optical size), titling caps were made only in display sizes, not text sizes.</p>
