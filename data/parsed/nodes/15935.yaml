      <p>Let me re-phrase that slightly. The difference in optical compensation is the required element of titling capitals compared to a text face. An optional element is to have design differences, which may be minor or major.</p>
      <p>If it is a really different design, I think of it as more of a companion titling face rather than the titling version of the same face. For example, Michelangelo is being renamed and re-released as “Palatino Titling.” I can understand the marketing reasons for it, and it also clarifies the use of the typeface, which are both good things - but from a design perspective I am not sure that I agree with the naming, because it’s just a little too dissimilar to Palatino.</p>
      <p>Cheers,</p>
      <p>T</p>
