      <p>Titling caps can be set either looser or tighter depending on the font.  A classic roman face would in most cases be set looser.<br>
      Generally, the things that change are those that are needed to be typeset well at text sizes. Contrast can increase at large sizes and there is less need for trapping.  You can also have a true hairline sans because it won’t be used small. The width may be a tad more condensed as well.</p>
      <p>ChrisL</p>
