      <p>The design conventions for smallcaps are pretty clear, because of the height and weight relationship to the lowercase and regular caps.</p>
      <p>I disagree with Thomas that ’titling caps’ implies a large optical size of the regular caps, although that is certainly one common kind of titling caps. I think there is a lot of stylistic leeway in the design of titling caps, and they may be lighter or darker and may be significantly different in proportion and detail from the regular caps. Eric Gill’s Golden Cockerel type — shown here as drawn for digital type by Dave Farey — is an interesting example of a design in which the treatment of some letters varies between the regular and titling caps (note the C and Q):</p>
      <p></p><div class="imageWrap"><img src="/files/Cockerel.gif"></div><p></p>
      <p>William made reference to Jonathan Hoefler’s comments on the subject, and I think one of the most important points Jonathan made is that in titling caps there can and perhaps should be more variation in the width of the letters (hence, for example, the famously narrow E and F in the Trajan letters).</p>
      <p>Also note that the relative height on the body has varied in some classic titling sets, such as Mardersteig’s brilliant Dante:</p>
      <p></p><div class="imageWrap"><img src="/files/Dante.gif"></div><p></p>
