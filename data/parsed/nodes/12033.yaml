    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Foundry</strong></p>
    <p>A type foundry is a type design studio that produces <a href="/wiki/typeface" class="freelinking" rel="nofollow">typefaces</a> for commercial use or sale.</p>
    <p>The term foundry has its roots in dead technology wherein type makers would cut their <a href="/wiki/sort" class="freelinking" rel="nofollow">sorts</a> out of metal. Some modern type designers are transitioning to the term type studio instead.</p>
    <p>See also <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a>.</p>
