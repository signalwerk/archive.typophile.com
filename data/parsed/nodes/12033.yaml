    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Foundry</strong></p>
    <p>A type foundry is a type design studio that produces <a href="/node/16843" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typefaces</a> for commercial use or&nbsp;sale.</p>
    <p>The term foundry has its roots in dead technology wherein type makers would cut their <a href="/node/14544" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sorts</a> out of metal. Some modern type designers are transitioning to the term type studio&nbsp;instead.</p>
    <p>See also <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>.</p>
