      <p>I researched the Windows 8.1 issue with Stylistic Alternates, when the substitution line below is entered in the salt feature of an Opentype font it will work in Windows 7 but not in Windows 8.1, when you click on A.alt2 or A.alt3 you'll get A.alt of the regular A appear at your cursor.</p>
      <p>sub A from [A.alt A.alt2 A.alt3];</p>
      <p>Only single substitutions will work in the salt feature in Windows 8.1</p>
      <p>sub A by A.alt ;</p>
      <p>If you have multiple alternates of a glyph the solution is to place them in a stylistic set such as ss01<br>
      If you have multiple versions of swash letters then also put those into a stylistic set.</p>
      <p>The test was done with a single Opentype font generated from<br>
      FontLab 5.2.1 build 4868 and tested with Adobe CS5 in Windows 7 and Windows 8.1</p>
