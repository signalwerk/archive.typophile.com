    html: |-
      <p>It's not true that MS Word cannot access unencoded alternate glyphs. </p>
      <p>The latest versions of Word for Mac and Word for Windows provide access to some OT features such as different figure styles, stylistic sets (only one at a time, though), ligatures, and contextual alternates. These work even when alternate glyphs are unencoded. Unfortunately, many OT features are missing, such as (true) small caps, titling alternates, swash alternates, discretionary ligatures, historical alternates, stylistic alternates, etc.</p>
