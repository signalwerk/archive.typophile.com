    user: 1262
    date: 2014-08-14T14:37:00
    date_raw: 14 Aug 2014 — 2:37pm
    votes: null
    html: <p>The whole reason why the character/glyph distinction exists is so that a cleanly encoded semantic character string can be represented by an arbitrary collection of glyphs. So as soon as a font contains more than one way to display a single Unicode character, it makes sense that you <em>need</em> something like OpenType Layout glyph processing that maps from the default encoded glyphs (from cmap) to the unencoded variant. Trying to come up with a workaround to access variants without glyph processing inevitably means breaking character encoding.</p>
    html_clean: <p>The whole reason why the character/glyph distinction exists is so that a cleanly encoded semantic character string can be represented by an arbitrary collection of glyphs. So as soon as a font contains more than one way to display a single Unicode character, it makes sense that you <em>need</em> something like OpenType Layout glyph processing that maps from the default encoded glyphs (from cmap) to the unencoded variant. Trying to come up with a workaround to access variants without glyph processing inevitably means breaking character encoding.</p>
