      <p>&gt;Moreover, you're creating a risk that even when using OT-savvy applications a user might select the character from a character map (which, depending on the application, might result in U+E000 rather than U+0041) rather than via OT features without realizing the consequences of this action.&lt;</p>
      <p>So by not placing glyphs in the PUA it looks like we're protecting people from making a critical mistake they may not be aware of and that's using an alternate glyph for text purposes you shouldn't use alternates in.</p>
      <p>A professional trained type designer once told me if include alternates in my font I needed to plan them all in advance and create a custom encoding file in FL and this would build the database creating the alternate glyphs with codepoints, however when you went to glyph properties the unicode field was blank for each alternates.<br>
      Creating encoding files is fine if you've got many people working on the project but I work solo and I get inspiration for new alternates along the way.<br>
      To me the custom encoding file looks like a script for Cmd+G or Ctrl+G, if there's a unicode value to go with the glyph name in the encoding file then FL will create the glyph and assign the correct unicode value.<br>
      Alternate glyphs will be created however there will not be a unicode value assigned so it will hang by name only, apparently it's fine for a glyph to exist and be usable with out a unicode value in applications such Adobe CS and CorelDraw.<br>
      When it comes to making alternates usable in applications such as MSWord, forget it, the customer using alternates where they shouldn't creates support emails which we want to keep to a minimum.</p>
      <p>When a customer asks why they can't access alternate glyphs in MSWord or Windows character map I'll have to say sorry it doesn't recognize them.</p>
      <p>I did find a pdf from Adobe dated 2006 that said they no longer put glyphs in the PUA but in 2011 Adobe's Minion Pro still shows alts in the PUA however nothing from Adobe since uses the PUA.</p>
      <p>Thanks guys for your assistance it's been a long road getting back up to speed after a long eighteen years of care giving, I don't know how I ever found time to make fonts at all.</p>
      <p>Michael</p>
