      <p>The biggest problem with PUA is that it results in mangled text. PUA codepoints for glyph variants get inserted into text, replacing semantically meaningful character codes. This means that documents using PUA codepoints can't be reliably searched, sorted, spellchecked, or subject to any other normal text processing function such as changing fonts, copying and pasting into email or a plain text environment, or even easy and consistent editing.</p>
      <p>As a general principle, don't use PUA for anything with semantic content. So yes, it is okay to use PUA for ornaments or for a client's logo in a font, but as soon as you have text entities that need to be interchangeable, you should be avoiding PUA. The only times I ever use PUA for semantic content is when I have a client who is working with a closed production workflow that requires it, and even then I do everything I can to encourage them to find a different workaround and to avoid using the PUA encodings whenever possible.</p>
