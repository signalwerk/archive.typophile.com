      <p>Minion Pro was one of the last fonts which Adobe released before they revised their own position on using PUA codepoints, so that's why you find them in Minion but not in subsequent fonts.</p>
      <p>Substitutions of the type <code>sub X from [X X1 X2...]</code> are really best reserved for the aalt feature rather than salt or ss<em>nn</em>.</p>
      <p>Concerning your question about accessing alternates, remember that unicode defines characters, not glyphs, which is why it isn't necessary to assign unicode values to alternate glyphs except perhaps for compatibility with older applications.</p>
      <p>If you have a font containing A and A.salt, things will behave differently depending on whether you assign A.salt a PUA value or give it no unicode value at all.</p>
      <p>If you assign it no unicode value, then any documents containing that character will represent either A or A.salt by the same unicode value (U+0041) with some indication of whether the 'salt' feature is turned on or off. The alternate glyph will only be accesible via the salt feature meaning you won't be able to make use of it in non-OT savvy applications.</p>
      <p>If you choose to assign A.salt a PUA codepoint (let's use U+E000), then the character will be accessible either by entering U+0041 and applying the salt feature (in applications which support this) or by entering U+E000 directly (an option available in all applications). However, if a user chooses the latter option, the glyph which appears won't be interpreted as the character 'A' but as the semantically undefined character U+E000. Therefore, using PUA points will allow alternates to be accessed in non-OT savvy applications, but the alternates won't be searchable, spell-checkable etc. Moreover, you're creating a risk that even when using OT-savvy applications a user might select the character from a character map (which, depending on the application, might result in U+E000 rather than U+0041) rather than via OT features without realising the consequences of this action.</p>
      <p>So, I'd say that if you need to support non-OT applications, you can assign PUA codepoints for cases where the user wants to *display* the alternates without necessarily needing to search the document, but that if you do so you'd want to stress in your readme file that alternates should always be accessed using OT features unless its absolutely impossible to do so and then hope that people actually read the readme file.</p>
      <p>Maybe that will help clarify John's points.</p>
      <p>André</p>
