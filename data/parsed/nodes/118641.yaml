      <p>Understood but I've been told by people at FontLab to not use the PUA for alternate glyphs therefore the glyphs exist as name only with no unicode value so customers that don't have Adobe products may not be able to access the alternates even if you have a proper substitution in your opentype features.<br>
      The only problem of using the PUA I can think of would be your glyph unicode values may conflict with other fonts that have glyphs occupying the same spaces, when a customer switches from one font to another their letters may change or drop out.<br>
      For this reason alternates shouldn't be used in large bodies of text where you'd end up making too many corrections because you changed to a different font family.<br>
      Glyphs that are unmapped can't be copied and pasted, Adobe products are an exception allowing you to copy and paste unmapped glyphs between Adobe applications.<br>
      Now there's a problem with Windows 8.1, I'm finding the salt and swsh features don't work properly in Adobe products installed under Windows 8.1, for example when you double click on N.alt you'll get the regular N instead, click on N.swsh and you'll get the regular N again.<br>
      My OT features are correct and work perfect under previous versions of Windows using Adobe CS5.<br>
      The solution around this is to place your stylistic alternates and swash letters as a stylistic sets ss01, ss02 etc. and remove the original salt and swsh features completely.<br>
      If there's ever a problem with the Adobe glyph map not working properly after an operating system upgrade the customer could still access alternate glyphs using a third party character map. If the alternate glyphs are unmapped the customer may be out of luck and that font that you worked hard on creating beautiful alternates is now a piece of junk from the customer's point of view.<br>
      My question still is, should we use the PUA or not? What are the potential problems I'm told will occur if I do use the PUA?<br>
      If I unmap the alternate glyphs and they're no longer in the PUA the number of people that can access the alternates has dropped dramatically.</p>
