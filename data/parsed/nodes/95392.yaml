    <p>An unordinary type of family: Novo Alla is part of the Novo Family (together with Novo Alla, Bila, Cela, Dada, Enno, Fika and Gigo). Although all members are also strong individuals, Novo Family is an exclusive selection which allows you to design beautiful typographic combinations. The Novo Family will take typography into a next fase of legibility. Novo Family contains 7 members. The Novo Family is designed by Novo Typo, (typo)graphic designers from Amsterdam, The Netherlands.<br>
    The Novo Family, and their individual members are for sale via <a href="http://www.myfonts.com/fonts/novotypo/nt-novo/" title="http://www.myfonts.com/fonts/novotypo/nt-novo/">http://www.myfonts.com/fonts/novotypo/nt-novo/</a> and <a href="http://www.youworkforthem.com/designer/300/novo-typo/" title="http://www.youworkforthem.com/designer/300/novo-typo/">http://www.youworkforthem.com/designer/300/novo-typo/</a></p>
    <p>For more information: <a href="http://www.novotypo.nl" title="www.novotypo.nl">www.novotypo.nl</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Novo-Family_6112.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Novo-Alla_5490.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Novo-Bila_5608.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Novo-Cela_6502.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Novo-Dada_4664.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Novo-Enno_3942.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Novo-Fika_3956.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Novo-Gigo_3949.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Novo-Family-2_6418.jpg"></div><p></p>
