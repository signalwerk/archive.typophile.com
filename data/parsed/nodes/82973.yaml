    <p>Just a question on how condensed fonts work, if I'm creating a typeface based off the skeleton of a regular font but wanted to created a condensed version of it I would expand the stroke of the type inwards rather than balancing it on both ends of the skeleton correct? In other words unlike a bold version of the regular or roman font where the expanded stroke would rather evenly from right to left comes from the skeleton it would instead only expand inwards. </p>
    <p>Image included with black being the roman, yellow is bold condensed, and magenta is bold. The typeface for this example is set in Univers while the typeface I'm using as my skeleton is Forza, I choose Univers simply because Forza does not at this time have a condensed font. </p>
    <p>I'm aware that by doing the work in the image it sort of answers the question but I was wondering if this is how it is always done for creating condensed, or should I just go on and looking other typefaces to see if they carry the same traits.</p>
