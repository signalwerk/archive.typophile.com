    html: |-
      <p>While a condensed ultralight might be straightforward, a condensed black will probably require a redesign of several glyphs. Look at some classic sans serif families with condensed and compressed styles and see how they treat the rounds (ODCG etc). They're often a bit more square than the regular width glyphs. I'm not sure why . . . I think it just looks better. That squareness changes the relationship those rounds have with other letters. The M &amp; W are tricky to squeeze into a condensed black and can cause other letters to look too narrow. Does your font look okay with a really wide M &amp; W? That will affect the design of the rest of the letters. How skinny of a T can you get away with next to that wide M?</p>
      <p>Figure out which letters are critical to the condensed design and work those out. Let's say you decided to use ABKMOSWow. Create a condensed black version of those letters, complete with proper spacing. Test alongside to the original width font to make sure you haven't lost the essence of the original. Once you're happy with you new narrow letters, you can use them to extrapolate the rest of the font. Constantly compare to the regular width font so you can keep it consistent.</p>
      <p>The widths of those test letters can be used to calculate the widths of the rest of the alphabet. If your next letter is an H, type HAHBHKHMHOHSHWHoHwH and adjust the width until the H seems to harmonize with the other letters.</p>
      <p>That's my angle anyway.</p>
