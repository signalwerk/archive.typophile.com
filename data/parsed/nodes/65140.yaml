    html: |-
      <p>This is quite charming! And it looks nicely balanced. Speaking of which, I notice you've slanted the "el" slightly (presumably to prevent it from tipping backwards) but then you probably need to do that for everything else. Evert Bloemsma had this problem in his Avance - but he solved it differently (since he didn't want any slant).</p>
      <p>The main thing I would change first is the vertical proportions. The font is sitting too high (descenders way too long compared to the ascenders).</p>
      <p>- The "s" is very nice!<br>
      - To me the "x" is too much, but maybe it's OK since it's infrequent.<br>
      - I'd make the join in the "k" thinner.<br>
      - I'd make the middle part of the "w" not curl. Or maybe just gently.<br>
      - The "C" is a bit wide and that serif is too lonely - I'd dump it.<br>
      - The "X" is leaning left.</p>
      <p>&gt; The structure is inspired by cursive designes, something I believe<br>
      &gt; must have been the idea behind Lucas de Groot’s The Mix</p>
      <p>As somebody who's done a semi-serif design (although not upright, more like a slanted-Roman) I would caution against that "must"...</p>
      <p>hhp</p>
