      <p>Very nice typeface, I like it. Especially that cheeky right foot of the x :-)</p>
      <p>A few ideas:<br>
      - The upper serif on C and S are somewhat standing out in the upper case. Why not on G? I'd rather do without them.<br>
      - The upper left stroke end on lowercase x: what about a slant?<br>
      - l, m, n end in a thinner stroke - sugg: more like k<br>
      - I'd prefer the slant in the lowercase serif more like the blue line (see picture)<br>
      - The M looks a tad wide in the middle.<br>
      - smaller i-dots.</p>
      <p>Just my 2p from an amateur. Andreas<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/_newfont2_5483.png"></div><p></p>
