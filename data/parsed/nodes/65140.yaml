      <p>This is a very charming font!<br>
      That w looks much improved.<br>
      I wonder if the /t/ looks a bit short relative to the tittles and ascenders.<br>
      One issue that you'll face with those large tittles is /i/s followed by seriffed ascenders. (There's an /il/ and a couple of /ik/s in the text setting for examples.) I think that may pose a spacing problem.  If Nina gets her way and you keep the tittles this size (:-)), you may want to consider contextual alternates that reduce or remove that serif.<br>
      Those oslash counters are too tiny.</p>
