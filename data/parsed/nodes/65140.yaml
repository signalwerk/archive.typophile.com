      <p>I think this is a good start.<br>
      I particularly like the drawing of /N/, /Q/, /c/, /o/, /v/, /z/, and /!/.</p>
      <p>The cap height looks awfully short to me.</p>
      <p>Top of bowl of /d/ looks clunky - taper it more as it heads into the stem.<br>
      I agree that you might want to dial back the size of the tittles just a little, and reconsider the /S/ and /C/ serifs.<br>
      Top counter of /s/ gets a little pinched.<br>
      Slants of bottom vertices of /W/ look strange to my eyes.<br>
      /M/ seems a bit of a hedge: I'd expect either splayed verticals or a raised middle vertex, but not both. I'd have to see it in text to judge whether it's bothersome to have both.</p>
