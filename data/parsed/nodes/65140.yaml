    html: |-
      <p>Whatever you do, keep the serifs. I personally just wonder if they could be a tiny little bit stronger/thicker.</p>
      <p>Shears: Not sure, my eyes might be totally wrong for the kind of font you're making (I've never made a display font, nevermind a «playful» one, and I'm Swiss, so get a salt mine!).<br>
      I just wonder if it wouldn't be good to have a little more of a system as opposed to deciding on the shear/angle on a case-by-case basis… It seems a bit random, and in places a bit contrived. Like, why is the apex of the "A" at an angle, but not the vertex of the "V"? OK, maybe you have shears only on top. Then what's up with the vertex of the "M"? And why do the stems of the "M" have slanted ends on the baseline, but not the legs of the "A", which seems like a sufficiently analog construction? – I keep trying to find a system and I keep failing. Makes me think there's probably just something I'm not getting.<br>
      But here's a thought – since you're apparently aiming for an alternate-rich font, how about having «straight» base forms, and stylistic alternates with all sorts of different shears, for individually adjustable levels of playfulness?</p>
      <p>BTW, the caps remind me of the title pages of Tintin comics. :-)</p>
