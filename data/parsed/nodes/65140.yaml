    html: |-
      <p>This is nice!<br>
      Reminds me of the Shire types a bit.<br>
      Mind the salt with everything I say. :)</p>
      <p>I agree with what Hrant said about the relative extender lengths – it's the first thing that struck me as odd.</p>
      <p>Not sure about the shears everywhere (especially when they're on the baseline, or at the apex). I think you might need more rules to govern them. Like, you usually don't have them on straight stems, so why on the exclam? And the stems of the "M" – but not the top, where it would be logical compared to the "W"?<br>
      Also, consider making the angles [more] consistent. For instance the different angles on the 2 arms of the "F" give me an unhappy, almost 3-D effect. But maybe that's just me. </p>
      <p>*Love*: "v", "y".<br>
      "w" seems a bit much. (Compare the "m" where the middle "foot" is "normal".)<br>
      Have you tried making the "x" "dance" in the other direction? It looks funny next to the "y". Also, at least the "x" and "k" look like they're ever-so-slightly leaning backwards.</p>
      <p>Edit/add: Considering how much funky stuff you're doing, I think you should really be entittled (sorry) to keep the large tittles. :) Maybe raise them a little though? But that'd be easier to tell in context.</p>
