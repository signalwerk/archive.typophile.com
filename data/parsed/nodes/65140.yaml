    html: |-
      <p>Sorry, how's this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ms_4102.jpg"></div><br>
      (1: Helvetica, Droid Sans) shows what I think of as "normal" M-shape: true verticals on the left and right, and all strokes bottom out at the baseline. This can lead to cramped looking counters left and right compared to the upper, V-shaped counter in the middle.<p></p>
      <p>One solution that some fonts take is (2: Optima, Myriad) to splay the side strokes, so that instead of being vertical they angle out, evening out the counter areas.</p>
      <p>Another solution to the problem, seen in (3: Gill Sans, Tahoma), is to raise the center vertex, which also opens up the top angles.</p>
      <p>Your M does both. There's no rule against this of course, but I wonder if one or the other of these accomodations would look better than having both.</p>
