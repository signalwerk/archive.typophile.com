    <p></p><div class="imageWrap"><img src="http://typophile.com/files/specimen03_4773.png"></div><p></p>
    <p>A while ago, I posted a logo for a youth magazine. The logo eventually got turned down, but I felt the idea for the letterforms were to good to abandon and started sketching out a full typeface. The structure is inspired by cursive designes, something I believe must have been the idea behind Lucas de Groot’s The Mix — as I found the serif placement of his design very similar to mine. This structure sometimes seem to interlock letterforms perfectly – other times make a mess out of the spacing. I’ve not yet drawn the alternate glyphs I have in mind (cutting down, or cutting off serifs), as I want some good opinions on the basic alphabet. The typeface is intended for display use.</p>
    <p>I’d love your criticism.</p>
    <p>Edits: </p>
    <p>12/10: Follow <a href="http://www.frodehelland.com/prosjekter/skrift/specimen04-1210.pdf" rel="nofollow">this link</a> (1,4 mb PDF) for a text setting example.</p>
