    html: |-
      <p>A GSUB table is a substitution lookup. The most common one is for ligatures:</p>
      <p>feature liga {<br>
       sub f i by fi;<br>
       sub f l by fl;<br>
      } liga;</p>
      <p>And that's the most basic version of it. </p>
      <p>OT fonts only seem to work properly if they have at least one GSUB and one GPOS. (Kern is the "big" GPOS. GSUB is how small caps, alternate numeral sets, etc. are achived.)</p>
