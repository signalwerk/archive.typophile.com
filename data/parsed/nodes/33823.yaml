  html: |-
    <p>What is a g sub table ? and how do you make one ?<br>
    Been told it has g pos tables but no g sub tables. I'm lost.</p>
  html_clean: |-
    <p>What is a g sub table ? and how do you make one ?<br>
    Been told it has g pos tables but no g sub tables. I'm lost.</p>
