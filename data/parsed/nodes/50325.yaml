      <p>I guess my first comment was kind of knee-jerk. I hope I can redeem myself.</p>
      <p>Overall it is very good. Organized. Clear. The only three things I might re-consider are point-size (Scala always looks so tight to me), leading (if point-size doesn't give enough air), and full-justification.</p>
      <p>I guess of those three the justification is the thing I'd do if nothing else. One reason is to avoid spots in the text or rivers. Under "project administrator", the last sentence which begins GOTD, it looks as if you have a double space when it is really a result of the justification. You'd not justified the first two paragraphs, and I don't think I'd justify the rest. </p>
      <p>I'd also take the last line, the references line, and align it with the rest of the paragraphs on the left. You've not centered anything else so there is little reason to start.</p>
      <p>Sorry I see one more thing. This is a fault of the typeface and not you. The bold appears smaller than the roman. I don't recall of this is a fault of the hinting or if it appears in the printing as well. But I might scale the bold type up .5 pt or so.</p>
      <p>Ok this is the last. You  might consider sizing the all caps (small caps?) lines down a bit and letter spacing them a bit more.</p>
