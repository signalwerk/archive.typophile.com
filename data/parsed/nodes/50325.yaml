    html: |-
      <p>&gt;begins GOTD, it looks as if you have a double space when it is really a result of the justification</p>
      <p>There actually is a double space.</p>
      <p>The title (your name) is rather overpowering, as you acknowledge in your blog it is the vital part of the cv, however I would look at reducing it to the measure of the main text block, possibly aligning the baseline with the baseline of the url, preserving the lefthand column for navigation.</p>
      <p>The list of Technical Skills needs some way of differentiating between lines, although most employers would be used to picking out the initials (because they would be looking for them) it doesn’t hurt to assist them. You could add a half line space after each topic; a tab after each colon; or bold the topic title – I wouldn't use all of these options.</p>
      <p>The heading Experience is aligned with the first line of the description, you could try positioning it above the text block so that the job title aligns with the first line of the description.</p>
      <p>The last line is left awkwardly floating, you could align it to the left under the headings or the text block.</p>
      <p>Some of these suggestions will interfere with your vertical space but I think it will just work. Regarding Tiffany’s suggestion about the measure, the last lines of each experience paragraph has got enough space to reduce the measure without adding another line to the depth. By reducing the measure and shifting it to the right by the amount of reduction, you might be able to get happier line breaks in the job titles, although you might have to settle for abbreviations for months.</p>
      <p>Tim</p>
