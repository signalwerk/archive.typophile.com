    <p>I am a professional programmer and amateur typographer.  I have recently written a blog article about the typographic and composition improvements I made to my resume.    <a class="freelinking external" href="http://zgrossbart.blogspot.com/2008/10/resume-tale-of-desire-intrigue-and.html" rel="nofollow">Resume: A Tale of Desire, Intrigue, and Formatting</a> is an outline of the process I used to improve my resume with a little help from The Elements of Typographic Style and FF Scala.  I hope this will help other engineers with very little understanding of typography make their resumes better.</p>
    <p>It would be very useful to get some feedback from more experienced designers.  Did the resumes actually get better?  Is the final resume any good?  Is the advice I give good advice?  What do you think of the overall concept?</p>
    <p>Thank you in advance.</p>
    <p><a class="freelinking external" href="http://zgrossbart.blogspot.com/2008/10/resume-tale-of-desire-intrigue-and.html" rel="nofollow">http://zgrossbart.blogspot.com/2008/10/resume-tale-of-desire-intrigue-and.html</a></p>
    <p>Cheers,<br>
    Zack</p>
