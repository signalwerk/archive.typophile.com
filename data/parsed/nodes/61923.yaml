    <p>Ok, let's try again ;) (I tried under "blackletter", but no luck...)<br>
    My name is Piotr Kocybik and I'm a graphic designer, but that's completly not important :). </p>
    <p>Until yesterday I was a quiet spectator of all the wonders of this miraculous forum, but since certain things happened i am forced to abandon my safety zone and encounter some reasonable Typophiliac feedback. Please help.</p>
    <p>I am working on an visual identity program for 600th Battle of Grunwald aniversary (see <a class="freelinking external" href="http://en.wikipedia.org/wiki/Battle_of_Grunwald" rel="nofollow">wiki</a>).</p>
    <p>I've made a decision to make a logotype and it took me to the point of creating my own typeface for this particular purpose. (not the whole character set, just some glyphs – to create a sort of graphic system).</p>
    <p>The starting point is the number: "600".Basic idea is that "6" refers to "G", as in "Grunwald". Help appreciated. – i need to pick a face for the caption to accompany the "600". "Beedicta" by Elias Bitencourt could be nice but it's not ready as far as i know. </p>
    <p>Then comes the full name "Grunwald" – as an alterative to the "600" – i.e. without the caption. </p>
    <p>Latter files contain other texts set using some extra characters constructed in the same manner as the firs – "600 lat", meaning "600 years" and the name "google" (maybe for the anniversary day?). There's also the thing in use.</p>
    <p>I'd like to ask what do you think of the methaphore and the overall concept. Do You think it speaks what it should? </p>
    <p>Please, help. Be cruel if you have to, but... whatever. I need to know.</p>
