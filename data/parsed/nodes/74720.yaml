    <p>Hey guys, I recently received this art as a jpeg from a client and they want me to set up a bunch of names using this exact same font.  They of course have no idea what font it is and don't want to contact the previous artist.  Any help with the ID would be appreciated.  I know I've seen it before, but I don't seem to have it on this machine.</p>
    <p>Thanks!</p>
