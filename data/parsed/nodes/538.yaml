    html: <p>I would strongly recommend learning the nuts and bolts of HTML. While my tools, like Hrant and Roballoo, are ImageReady and Dreamweaver, DW will occasionally not do what you want it to do, in which case you'll need to go into the HTML and see what's going wrong. I personally like Peachpit Press books, though I don't know their current lineup of HTML books. But I'd look at them first and see whether you like their style.</p>
