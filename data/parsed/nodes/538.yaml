    html: <p>Being a print designer first, I had a hard time working at 100%, meaning that I have to refrain from zooming into the artwork/layout because it doesn't really affect it. Always, always work at 100% (command-alt-0) what you see is what you get. Another print habit that I have is zooming out so I can see the overall layout, I also squint my eyes very professionally. If you zoom out it looks like •••• *, so don't zoom out.  <br> <br>I always use ImageReady, Photoshop tends to alter the color when saving for web (I'm serious.) I also enjoy Dreamweaver profusely, whatever it can't do I simply hand code it. If it is easier for you to learn software programs than programming languages (HTML) I'd say start with some tutorials on DW and you will slowly learn and understand what the HTML is doing. <br> <br>* What the hell? Is there no cursing on this site? ••••, ••••, •••••••... nope, there isn't. Cool.</p>
