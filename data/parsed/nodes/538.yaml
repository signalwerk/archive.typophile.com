    html: "<p>I use DreamWeaver, and it automatically determines \"safe\" areas for you, depending on your target monitor setting. As for what's a good target monitor setting to choose, 800x600 is the best general bet, but you could go to 1024x768 if your target demographic is sufficiently high-end to justify it. <br> <br>BTW, if you want to break the mold without breaking any browsers, consider going horizontal, like this: <br><a href=\"http://www.themicrofoundry.com\" target=\"_blank\">http://www.themicrofoundry.com</a> <br>The height is determined to fit in a 800x600 display (while allowing 640x480 users to scroll down once, and then scroll only horizontally, with the [low-relevance] \"header\" cropped), and the widths were determined to the pixel to provide nice even jumps of the scroll bar in virtually any browser without little bits left at the end. Actually, this was only true until about a year ago... I've gotta update my widths for current browsers.  :-/ <br> <br>hhp <br></p>"
    html_clean: "<p>I use DreamWeaver, and it automatically determines \"safe\" areas for you, depending on your target monitor setting. As for what's a good target monitor setting to choose, 800x600 is the best general bet, but you could go to 1024x768 if your target demographic is sufficiently high-end to justify it. <br> <br>BTW, if you want to break the mold without breaking any browsers, consider going horizontal, like this: <br><a href=\"http://www.themicrofoundry.com\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com</a> <br>The height is determined to fit in a 800x600 display (while allowing 640x480 users to scroll down once, and then scroll only horizontally, with the [low-relevance] \"header\" cropped), and the widths were determined to the pixel to provide nice even jumps of the scroll bar in virtually any browser without little bits left at the end. Actually, this was only true until about a year ago... I've gotta update my widths for current browsers.  :-/ <br> <br>hhp <br></p>"
