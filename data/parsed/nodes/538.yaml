    html: <p>For a good general reference on creating a web site check out <a href="http://www.webmonkey.com" target="_blank">http://www.webmonkey.com</a> where they have a wide variety of articles, tips and tutorials to help you out.  <br> <br>Head straight for the Quick Reference section and the How To Library on the right of the page. Of special note is their Browser Chart which I've used many times as a reference (which at last check pretty much echoes the 600x800 spec Hrant gives above).  <br> <br>The writing style is light hearted without dumbing down the info and they don't bog you down with too much text ~ just enough to get your feet wet in the subject at hand. <br> <br>Besides the Monkey, I also recommend <a href="http://www.designinteract.com" target="_blank">http://www.designinteract.com</a> for further articles on the design of web sites. In particular, I found their Site of the Week useful for good concise reviews of a wide variety of sites. <br> <br>===&gt;&gt; <br> <br>ImageReady is the better program for creating web sites and graphics. Although PhotoShop will work, IR has more webcentric features (BTW ~ is anybody else out there waiting for the day when Adobe will simply merge the two programs and make our lives that much easier?) <br> <br>Adobe's products (of course) work best with their own web solution, GoLive. However, I prefer DreamWeaver. It's a very robust program and has a lot of helps for setting up a page for the target audience (as Hrant mentioned above). Perhaps best of all is their try before you buy 30 day trial version you can download from their site. As my DreamWeaver teacher told me, "if you can create it in 30 days, you can do it for free!" <br> <br>Other things to think about besides screen resolution is the speed of the target audience's internet connection. Are they on a modem? Cable? DSL? And the platform ~ Mac? PC? Linux? Palm? Cell phone?(ugh!) <br> <br>===&gt;&gt; <br> <br>Hrant's suggestion of a horizontal scrolling web site is a great way to try something different, but be careful ~ it's easy to let novelty get in the way of functionality.  If you want to try it, study Hrant's and see why it works. <br></p>
    html_clean: <p>For a good general reference on creating a web site check out <a href="http://www.webmonkey.com" target="_blank" class="link-external">http://www.webmonkey.com</a> where they have a wide variety of articles, tips and tutorials to help you out.  <br> <br>Head straight for the Quick Reference section and the How To Library on the right of the page. Of special note is their Browser Chart which I've used many times as a reference (which at last check pretty much echoes the 600x800 spec Hrant gives above).  <br> <br>The writing style is light hearted without dumbing down the info and they don't bog you down with too much text ~ just enough to get your feet wet in the subject at hand. <br> <br>Besides the Monkey, I also recommend <a href="http://www.designinteract.com" target="_blank" class="link-external">http://www.designinteract.com</a> for further articles on the design of web sites. In particular, I found their Site of the Week useful for good concise reviews of a wide variety of sites. <br> <br>===&gt;&gt; <br> <br>ImageReady is the better program for creating web sites and graphics. Although PhotoShop will work, IR has more webcentric features (BTW ~ is anybody else out there waiting for the day when Adobe will simply merge the two programs and make our lives that much easier?) <br> <br>Adobe's products (of course) work best with their own web solution, GoLive. However, I prefer DreamWeaver. It's a very robust program and has a lot of helps for setting up a page for the target audience (as Hrant mentioned above). Perhaps best of all is their try before you buy 30 day trial version you can download from their site. As my DreamWeaver teacher told me, "if you can create it in 30 days, you can do it for free!" <br> <br>Other things to think about besides screen resolution is the speed of the target audience's internet connection. Are they on a modem? Cable? DSL? And the platform ~ Mac? PC? Linux? Palm? Cell phone?(ugh!) <br> <br>===&gt;&gt; <br> <br>Hrant's suggestion of a horizontal scrolling web site is a great way to try something different, but be careful ~ it's easy to let novelty get in the way of functionality.  If you want to try it, study Hrant's and see why it works. <br></p>
