    <p>I want to create a website, and these are really the only 2 programs that I have on my computer.  I don't know how to do a webpage in either program but that is not really too much of an issue at this point.  I was just curious as far as size of a webpage goes, what size one should be.  I don't want it to be to big, possibly a standard size.  What is a standard size of a website?  Curious too since I have both programs what would be the best to recommend doing a website in.  I don't have the other programs like DReamweaver or go live, but if someone can give me some advice as far as what program would be best for a new timer, that would be great.  Thanks.</p>
