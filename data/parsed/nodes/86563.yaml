    <p>What's the term for when you have a rectangle with slightly curved sides (e.g., Eurostile)? I know there's a specialized geometry term for the shape you get when you take a bezier ellipse and pull the handles out as far as they'll go, as if you're trying to turn the ellipse into a square.</p>
    <p>It's not "ellipsoid," but it's something like that. Any ideas?</p><div class="imageWrap"><img src="http://typophile.com/files/Picture1_4691.jpg"></div><p></p>
