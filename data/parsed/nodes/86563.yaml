    html: |-
      <p>It's probably not that simple.<br>
      I had always thought Microgramma was CRT-tube inspired, but it seems to be much squarer than the tubes of that time.<br>
      Who knows, it may even have some De Stijl in it.<br>
      Whatever, it was very carefully and subtly drawn, and that seems to be a hallmark of the types of the immediate post WW2 era.<br>
      No doubt the designers were aware that their types would be on display at large sizes, reproduced by phototypositor.</p>
