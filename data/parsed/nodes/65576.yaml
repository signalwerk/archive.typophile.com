      <p><em>...you can only access half of your RAM, and half your CPU in each OS.</em></p>
      <p>I'm pretty sure it doesn't work that way. </p>
      <p>Mac OS X uses dynamically allocated virtual memory. Each app (including virtual machines) can take as much memory as they need. The hard disk will be used if there isn't enough physical RAM available, mainly for inactive apps, but even for the active ones if necessary. You can't allocate more RAM on your virtual Windows machine than is installed on your Mac, and you will definitely run into performance problems if you allocate the maximum (a couple hundred MB less than the installed physical RAM), but short of that, it's no different than using any other app.</p>
      <p>Also, unless you are using some other app that is hogging the CPU, Windows will get all the CPU it asks for, again, just like any other app.</p>
