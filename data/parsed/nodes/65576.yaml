    html: <p>I wouldn't say useless, just limited. They sure help for quickly checking static layout / CSS issues. Depending how static a site is, that might already be most of what you need. I agree that the major browsers/systems should be tested live, but those screenshot sites also cover obscure browsers/OSes that you cannot reasonably all run yourself (or have friends that do); for those I think a quick static layout check is already quite handy.</p>
