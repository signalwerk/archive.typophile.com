    <p>A 15" MacBook Pro.</p>
    <p>My biggest beef so far is that the glass touch pad just isn't as slidy as the plastic one on my old PC laptop. I'm gonna get a blister on y finger. I just know it.</p>
    <p>Aside from that insurmountable issue, I have to partition the drive &amp; load windows to run some of my old windows aps and get at some of my old files. </p>
    <p>Any suggestions? Can I just use "Bootcamp", or as I have been told, do I have to install something like Parallel?</p>
    <p>thanks</p>
