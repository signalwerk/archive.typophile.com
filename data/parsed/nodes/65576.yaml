      <p>Perhaps new versions of Parallels are different, but I'm fairly certain that older versions did split your CPU in half. One core for OS X, the other core for Windows. Though I haven't looked into running Windows as a VM under OS X in 2 years or so. No doubt other VM solutions don't impose this restriction, and I wouldn't be surprised if newer versions of Parallels didn't either. Nor would I be surprised if I was totally misinformed about older versions of Parallels.</p>
      <p>In retrospect, the 'half your RAM' crap I was told was probably just a rule-of-thumb for standard 2GB RAM MBPs. 1GB for each OS to avoid going into the harddrive swap that Mark mentioned. At any rate, doing 3D modeling on a VM doesn't make much sense to me -- nor does re-licensing all my software for OS X -- so it's been Bootcamp all the way.</p>
      <p>And I will say that the only bad experience I've had with Bootcamp is related to the battery driver. Again, no doubt fixed in newer releases. But if you decide to go with Bootcamp, and your CPU usage in Windows jumps to 100% and everything goes to pot -- before you're tempted to throw your computer against the wall, disable the ACPI-Compliant battery driver. If that 'fixes' things, re-enable the driver, reboot into OS X, reboot into Windows, and everything should be coming-up-roses.</p>
    html_clean: |-
