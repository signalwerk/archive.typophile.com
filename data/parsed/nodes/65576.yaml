      <p>AFAIK, if you're using some sort of VM solution like Parallels, you can only access half of your RAM, and half your CPU in each OS. If you boot to Windows through Boot Camp, this isn't a problem. Don't know what software you plan on running, but I run AutoCAD and SolidWorks on my Mac/Windows machine, so having only half the RAM is not an option. I'm still running Tiger and Boot Camp Beta however (I couldn't tell you the last time I booted into OS X), so this restriction may no longer exist -- however I can't imagine that. </p>
      <p>You might also look at Sun's Virtual Box for a VM solution. Hard to beat price-wise.</p>
