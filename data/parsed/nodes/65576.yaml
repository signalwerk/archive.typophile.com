      <p>Hi!</p>
      <p>Firstly I would recommend you Parallels as a solution for not too resource demanding tasks. It runs fast and smooth and file-exchange between the systems are easily done. Bootcamp I use sooo rarely, like once every 4 months when I play a game for an hour or two. That is the only reason I can imagine one could need Bootcamp for, if you don't use things like CAD or other heavy programs. </p>
      <p>Secondly, I like macs, I own one, but: Give it back now! And buy a new MacBook Pro in a month from now, a new CPU generation from Intel is arriving, Codename arrandale, and it will increase performance very noticeable, especially tasks which can't make use of a multi-core processor, the performance of a single core is boosted up quite a bit. Plus maybe apple drops price, or adds a bigger hard drive, more memory, or does some other make-over... more value for the same money. But this is just a personal opinion ;) Do as you please. ;) With SuperDuper! (free for basic function) You could make a bootable backup of your harddrive and copy it back with the migration assistant (OS X onboard application) once you have your new mac. </p>
      <p>Best,<br>
      Flo</p>
