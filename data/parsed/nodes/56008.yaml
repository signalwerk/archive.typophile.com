    html: |-
      <p>That's a very interesting one! You can imagine a type geek looking at this in a paragraph thinking that it's Eurostile from it's look and feel and then checking the individual letterforms and going: What the hell?!</p>
      <p>The text setting is very convincing on paper. Maybe I was looking too close but the "f" and the "t" seemed to be a little too close to the letters preceding them and a little far from the letters following them.<br>
      The notch on the "r" might be a tiny bit longer, it doesn't bother when reading but I don't know thought I'd mention that. In the bold version it would be awesome to have contextual alternates for the "r" where the notch is straight (like it is now) before an "f" or a "t" and then maybe a little curved down before round letters and maybe a little wider (longer notch) before straight letters.<br>
      I don't know just thinking.</p>
