      <p>I think it works well, apart from the lowercase a. It looks too much forced into the grid, in my opinion. Especially apparent in the heavier weights (in the light version it isn't really that bad).</p>
      <p>Personally I like the Eurostile influence, to be honest. Maybe it prevents it from becoming just another grotesk.</p>
      <p>And on a sidenote, really a coincidence; I used a very similar text for a specimen I made a while ago. With electromagnetic oscillating thermoplastic generators, etc. ;)</p>
