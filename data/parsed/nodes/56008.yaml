  - id: 336353
    user: 39515
    date: 2009-03-19T12:28:00
    date_raw: 19 Mar 2009 — 12:28pm
    votes: null
    html: |-
      <p>This is going to be a great typeface! I think the lc a of the light works perfectly fine, perhaps it needs a little thinning towards the terminal, but I agree that the bold a needs more work. </p>
      <p>I think the n, m and h shoulders perhaps need a little attention, I would have tried opening them a little bit more, perhaps by moving the center of the curve just a tiny bit to the right. </p>
      <p>Have you considered alternative ways of joining the k and K arms to their stems? Your solution works great, though.  </p>
      <p>I think the S is as wide as it should be, but I'd have another a look at the curves, I think there is some very slight disharmony between the upper and lower part of the glyph.</p>
      <p>To these Norwegian eyes, the Å with the ring joined to the A looks weird. I know a lot of typefaces do this, but to us Scandinavians, it's just wrong. Also, the eth doesn't work. (I read Old Norse, so I am very used to eths, thorns and o with ogoneks.) Have a look at <a class="freelinking external" href="http://briem.ismennt.is/2/2.11/2.1.4.eth.htm" rel="nofollow">Gunnlaugur Briem's advice</a>. </p>
      <p>Please take these suggestion with several grains of salt, I'm a beginner at typedrawing. </p>
      <p>I have to say I'm quite envious of this typeface, I've tried something similar myself, but yours is way better. Drawing a good sans is far more difficult than drawing a serif, in my opinion. I'm really looking forward to seeing it developed.</p>
