  html: |-
    <p>Hello Everybody,</p>
    <p>I thought I'd share another thing I'm working on with you. I started this a while ago for a rather big client who gave me a VERY specific and limiting briefing, which is why this typeface deliberatly borrows elements of Helvetica, DIN and Eurostile (!!). This is nothing I'd normally do, but I tried to have fun with it and somehow find a way to make this worthwhile, and in the end I really started to like this.</p>
    <p>When the job finally didn't happen, I stopped working on this, but now I have a client who wants to use this , so I have to finish at least the light style. </p>
    <p>Any comments are highly appreciated...</p>
    <p>Cheers,<br>
    *H</p>
