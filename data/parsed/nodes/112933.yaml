      <p>Why *not* typewriter letter forms?<br>
      The words “TYPEWRITER MUSEUM” in anything other than typewriter letter forms would be self-contradictory.<br>
      Would one title a book on serifed types in a sans?<br>
      Surely the point is to brand an identity in the most accessible way, to communicate with the public in the most incontrovertible manner what the nature of the enterprise is.</p>
