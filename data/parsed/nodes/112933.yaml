  html: <p>Working on a refresh of the museum’s CI focusing on type. The museum architecture is modern, the  exhibits obviously are not. I am looking for a flexible, contemporary type family that can carry some of that historic/vintage flavor without looking old fashioned. A contemporary and fresh look with some subtle reference to type/letters/history of writing. Not an easy task. Your ideas are most welcome.</p>
