      <p>I agree with Nick's comments, it seems odd not to use typewriter fonts for a typewriter museum. </p>
      <p>And rather than using a typeset simulation I would use actual typewriter type from an old typewriter enlarged, at least for headlines (maybe text in a contrasting typeset font), giving it much more character with the subtle variations in weight, slight imperfections, monospacing, etc. For a more contemporary feel you could use graphic techniques like reversing it out of a background, colors, etc.</p>
