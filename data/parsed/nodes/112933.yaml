      <p>Thanks for the hints so far. I had discarded Officina and descendants… as they represent the evolution of typewriting and office communication after the typewriter. I am looking for a text-face that breeds some history and brings up the flair of old machines… somewhat along the lines of <a href="http://www.typography.com/fonts/historical-allsorts/overview/" title="http://www.typography.com/fonts/historical-allsorts/overview/">http://www.typography.com/fonts/historical-allsorts/overview/</a><br>
      but in a contemporary take. A robust serif or slab serif…<br>
      Maybe that is asking to much and I will have to settle with a combination of two contrasting fonts for headlines and body type. Sorry for my clumsy description. Not a nativ  english speaker.<br>
      Please keep the suggestions coming.</p>
