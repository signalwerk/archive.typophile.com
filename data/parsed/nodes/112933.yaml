    html: |-
      <p>Hi James, I like your idea. There is a web world of typewriter aficionados who hunt down old typewriters -- google "typosphere" -- and publish the results of their typing on them -- google "typecast."<br>
      A fascinating alternative to using modern fonts would be to contact some of these people and ask if they would type text for the museum on their vintage machines. It could then be scanned and the result -- complete with variations in darkness, alignment etc. -- would be a true homage to the typewriter. I suspect that most of these people would be prepared to work for almost nothing or even for free. Extreme dedication to promoting public awareness and appreciation of typewriters is their vocation.<br>
      Don</p>
