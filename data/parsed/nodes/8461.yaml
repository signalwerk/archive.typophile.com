    html: <p>There are some other related projects in the works.  <br>Phase one of Font Aid III is just now live at Myfonts.com <br><a href="https://web.archive.org/web/20150123134231/http://www.myfonts.com/foundry/fontaid/" target="_blank">http://www.myfonts.com/foundry/fontaid/</a> <br> <br>P22 &amp; IHOF have donated each top seller (Cezanne and Durer Caps) for the month of January 2005. 100% of all sales of these fonts through the "Font Aid" foundry will go to Tsunami relief efforts. Myfonts is also donating their portion of all sales as well as expenses to route the money to appropriate charities. I would suggest that other foundries donate their top selling font to this effort for one month. Please contact John Collins at myfonts if you wish to join in this group effort.  <br> <br>Thanks <br>Richard Kegler</p>
