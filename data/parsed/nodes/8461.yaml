      <p>Hi all,</p>
      <p>I've designed the BL III magazine. Everything is ready to print. Unfortunately it seems there are no money to print and distribute the magazine. There was no progress since the beginning of October 2005, so I asked Jim to remove a link to my studio from the <a href="https://web.archive.org/web/20150123134231/http://www.buildingletters.org/" title="www.buildingletters.org">www.buildingletters.org</a> website. Jim actually redirected this site to Fleurons Of Hope Font Aid project. It looks like the BL project is over. I am little bit disappointed not only because I've donated the design and typesetting, but mostly because the issue is very appealing and full of interesting texts by Nick Shinn, Fiona Ross, or Max Kisman, to name a few. It also contains all fleurons submitted to the charity font; many of ornaments are published in color.</p>
