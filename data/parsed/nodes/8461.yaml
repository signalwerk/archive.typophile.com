  html: "<p>BUILDING LETTERS: TSUNAMI EDITION <br> <br>Jim Richardson of UK the based Building Letters charity projects received a call on January 4 from Rathna Nathan of Reading University, who contributed to the 2004 edition of Building Letters magazine. She was in Sri Lanka when the Asian earthquake struck on Boxing day, and was calling to suggest a special edition of Building Letters to get funds to help survivors, the fishermen in North Tamil and Southern Sinhala get back on there feet, and able to make a living again to support their families, and provide food for their communities. <br> <br>In order for this special Building Letters edition to help, we need your contribution to get it published by the end of the month. It means that we need all the help that we can get to put the magazine together and make it available for sale. <br> <br>As a core element of this issue, Max Kisman suggested to ask type designers, designers, artists and illustrators to produce one flower each, that will be published in the magazine as a respectful tribute to the people who have lost their lives, and to the power of nature. <br> <br>The image of the flower or fleuron should be suitable for black and white implementation as part of a font as well as a separate color illustration for inclusion in Building Letters magazine. The size of the illustration would be in the ration of 2:3 (10 cm x15 cm, 4 x 5 7/8 inch) <br> <br>THE DEADLINE FOR THIS IS 14TH JANUARY, <br>AND WE'D BE GRATEFUL IF YOU COULD LET US KNOW YOU WILL BE CONTRIBUTING.</p>"
  html_clean: "<p>BUILDING LETTERS: TSUNAMI EDITION <br> <br>Jim Richardson of UK the based Building Letters charity projects received a call on January 4 from Rathna Nathan of Reading University, who contributed to the 2004 edition of Building Letters magazine. She was in Sri Lanka when the Asian earthquake struck on Boxing day, and was calling to suggest a special edition of Building Letters to get funds to help survivors, the fishermen in North Tamil and Southern Sinhala get back on there feet, and able to make a living again to support their families, and provide food for their communities. <br> <br>In order for this special Building Letters edition to help, we need your contribution to get it published by the end of the month. It means that we need all the help that we can get to put the magazine together and make it available for sale. <br> <br>As a core element of this issue, Max Kisman suggested to ask type designers, designers, artists and illustrators to produce one flower each, that will be published in the magazine as a respectful tribute to the people who have lost their lives, and to the power of nature. <br> <br>The image of the flower or fleuron should be suitable for black and white implementation as part of a font as well as a separate color illustration for inclusion in Building Letters magazine. The size of the illustration would be in the ration of 2:3 (10 cm x15 cm, 4 x 5 7/8 inch) <br> <br>THE DEADLINE FOR THIS IS 14TH JANUARY, <br>AND WE'D BE GRATEFUL IF YOU COULD LET US KNOW YOU WILL BE CONTRIBUTING.</p>"
