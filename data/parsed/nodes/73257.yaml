  html: |-
    <p>I have been asked by a colleague about the appropriate shape of the PERISPOMENI. The tilde-like form seems to be most common usage, but in some typefaces (e.g.GFS Porson) an upwards bending bow appears instead. – Just a matter of taste? Of specific typographic tradition?<br>
    Any thoughts welcome.</p>
