      <p>Hello Analisa, thanks for the comment.</p>
      <p>The inspiration doesn't come directly from Victor Jara's work. It's only the name.</p>
      <p>About the long lines they are a little bit darker, but not enough to change the structure.</p>
      <p>And yes, will be available on september in latinotype foundry.</p>
