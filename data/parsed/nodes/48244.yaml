    html: |-
      <p>I love it!</p>
      <p>I'm not sure how you were specifically inspired by Victor Jara, although both faces have a great Latino feel to them. I particularly love the all caps redonda.</p>
      <p>I am noticing in the lower case redonda that some of the letters with long, straight lines (like d, h, j) feel darker than the short, round letters (o, m, n). I'm not sure there's much you can do about that—I think it just happens because they have a longer line of uninterrupted pixels. It doesn't bother me too much. Overall, they are both beautiful and legible.</p>
      <p>Will it be available to buy?</p>
      <p>Analisa</p>
