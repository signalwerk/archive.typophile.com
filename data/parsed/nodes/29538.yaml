    <p>Hello friends, I’ve come here to talk about a very tricky subject.  Wide screen LCD displays.</p>
    <p>  Since I don’t know all that many people with, or who know about current LCD displays, and the last post made here was in late 2005, I thought I would ask some advice from those who know a bit about the market today (my dell 17inch CRT excludes me from that category outright).</p>
    <p>  I want atleast 20 inches, but would prefer 22+ (who wouldn’t), I’ll be gaming, doing design and editing video on it, and using it with both my PC and my powerbook. </p>
    <p>  I would prefer dual DVI and at least some form of analog in if I feel like hooking my xbox to it (preferably componant, but svideo could work), but this isn’t a primary worry.  I could always buy a monitor switching box if it became a hassle too.</p>
    <p>  And it would be really nice to spend less than 500, but more like 400.</p>
    <p>  Based on all of this I’ve narrowed it down to a few displays, but I would really like to hear about others that meet these criteria if you guys know of any.</p>
    <p>  1st choice: Samsung SyncMaster 22” Widescreen Flat-Panel TFT-LCD Monitor (solid choice, but few imputs)</p>
    <p>  2nd Choice: Gateway 22” Widescreen Flat-Panel TFT-LCD HD Monitor (great inputs, but not sure about the quality)</p>
    <p>  3rd Choice: Dell 2007WFP Wide-Screen Black Flat Panel Monitor (I heard dells are pretty nice)</p>
    <p>  Also the dell 2407WFP 24inch looks pretty amazing, but can’t really be had for less than 650.</p>
    <p>  Anyway, I’m fine with this thread becoming a topic for monitors in general, but I would love to hear suggestions for this lost soul.</p>
    <p>Thanks alot-<br>
    Kent.</p>
