    html: "<p> Christian wrote: <br> <br>&gt;I laugh when I hear the type foundries talking <br>&gt;about copyright. More than any other field <br>&gt;type foundries copy the designs of others  <br>&gt;(living and dead). <br> <br>I think my earlier post rounds out the ethics of this, but I also don't think we should be fooled by the standards that went on in the past. Piracy and plagiarism happened in the past for very different reasons, and the consequences and costs of doing so were also very different. <br> <br>Some historical perspective is required here. <br> <br>&gt;How many imitation faces are there in my URW  <br>&gt;type library? <br> <br>This is actually a good example of where a historial perspective, and some facts, make a difference. <br> <br>URW made some software a long time ago called Ikarus, I think it was probably one of the first, if not the first, type digitising applications. We're going back to the early to mid 1970s here. <br> <br>URW consequently received a lot of contract work from the large foundries of the time (Linotype, Berthold...) to digitise their fonts for their dedicated typesetting systems. <br> <br>You have to remember here that hardware was the important thing to these foundries, fonts were just packages to help sell the hardware. <br> <br>Part of the contract between URW and the foundries stipulated that URW owned the data that they digitised. No one thought anything of this at the time, because URW was not selling typesetting systems (required to use the fonts) and was in no position to set up such a business. <br> <br>Now fast forward 10-15 years. Apple introduces the Macintosh in 1984 and within 7-8 years had effectively killed the traditional typesetting businesses and the hardware suppliers. <br> <br>Now type is hardware independent and can be used in almost any application on several platforms. No longer dedicated to one application running on one particular piece of hardware. <br> <br>URW finds itself with the rights to a huge library of other people's fonts. Or, more precisely, URW finds itself with the rights to the outline data of such fonts but not the names. So it bundles itself up a CD-ROM and starts selling the data as PostScript fonts. <br> <br>Several people tried to take action against URW and failed, because of the contracts they signed. <br> <br>Moral of the story is: this is actually a complicated legal issue, compounded by the fact that the old foundries didn't have crystal balls and could not foresee that their businesses would undergo fundamental changes due to revolutionary change in software and hardware in other fields. </p>"
