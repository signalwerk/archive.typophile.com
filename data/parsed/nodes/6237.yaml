    html: "<p>I won't argue with you about reality. Yes, it's <br>true, penalties are wrought upon those who hold <br>a font without a license. Yes, The BSA inspects <br>piracy and issues lists. Yes, piracy is targetted as the <br>arch enemy of the industry. My question is whether  <br>these methods are effective in combating the core  <br>issue: the steady devaluation of type design. <br> <br>In my examination of the Napster case I noticed  <br>that only the most wealthy and successful artists <br>argued on the side of the prosecution. Huge <br>throngs of artists stood still or even argued against <br>the suit, with the quiet recognition that Napster did <br>more to promote and *add* value to their music. <br>Results have shown that during the peak of <br>Napster activity music sales actually increased. <br>New artists were discovered, people passed on the <br>word as well as the MP3s, and the industry as a <br>whole benefited. <br> <br>Type designers may find that public misperception  <br>about the value of type design is not due  <br>adoring fans who collect. The root causes of <br>this problem are more likely cheap knockoffs,  <br>lack of education, and the fact that quality work  <br>is relatively inaccessable. <br> <br>Which is more damaging to the industry: a CD of <br>5,000 poorly-designed lookalikes that sells at  <br>office supply stores for $15 or a graphic design <br>student in Wisconsin with a hard drive full of  <br>unlicenced fonts? <br> <br>If we're going to boost awareness of the work <br>and skill and time that good typography demands  <br>we need to reevaluate our focus and use our energy <br>to examine and target the real issues. <br> <br>Stephen <br> <br>..... <br> <br>The Underware foundry in the Netherlands are among  <br>the first to make the distinction between storage and <br>use. Spreading the word was more imortant to them <br>than restrictive licenses. What did they do? They <br>hosted a party for type enthusiasts and gave their  <br>fonts away for free. <br> <br>We also read the following at their website: <br> <br>\"You can find a full version of Dolly on the cd-rom,  <br>which comes with the type-specimen book. If you  <br>want to use this typeface commercially, a license  <br>is needed.\" <br> <br><a href=\"http://www.underware.nl/site/dolly/order/index.html\" target=\"_top\">http://www.underware.nl/site/dolly/order/index.html</a></p>"
