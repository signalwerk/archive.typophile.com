    html: "<p> David, <br> <br>I think we agree more than disagree. Of course a  <br>foundry should choose their method of sale and  <br>distribution. Remember that Underware did not give  <br>away the right to \"use\" their fonts for free. They gave  <br>only the file for a reasonable evaluation. <br> <br>&gt; Shouldn't I have the right to choose which of  <br>&gt; my own designs to distribute freely, and which  <br>&gt; of my designs to demand a licensing fee for  <br>&gt; their use? <br> <br>Certainly. In fact, you could distribute them ALL freely  <br>and demand a licensing fee for their use. It's this  <br>difference between \"storage\" and \"usage\"  that I may <br>not be conveying clearly. <br> <br>To clarify: I don't believe people have the \"right\" to  <br>pirate fonts. I'm not advocating  breaking or even  <br>changing the law. I'm suggesting type designers  <br>consider alternative methods of distribution and the  <br>benefits of allowing a user to examine before they buy.  <br>I'm questioning the effectiveness of a closed-door  <br>industry as opposed to one where the craft is  <br>accessible and open to all. <br> <br>The music industry is a relatively open industry - we can  <br>hear music before we buy it. The current type climate <br>is radically different. A restrictive policy doesn't allow us  <br>to adequately tinker with type before we can honestly  <br>appreciate its worth. <br> <br>Stephen </p>"
    html_clean: "<p> David, <br> <br>I think we agree more than disagree. Of course a  <br>foundry should choose their method of sale and  <br>distribution. Remember that Underware did not give  <br>away the right to \"use\" their fonts for free. They gave  <br>only the file for a reasonable evaluation. <br> <br>&gt; Shouldn't I have the right to choose which of  <br>&gt; my own designs to distribute freely, and which  <br>&gt; of my designs to demand a licensing fee for  <br>&gt; their use? <br> <br>Certainly. In fact, you could distribute them ALL freely  <br>and demand a licensing fee for their use. It's this  <br>difference between \"storage\" and \"usage\"  that I may <br>not be conveying clearly. <br> <br>To clarify: I don't believe people have the \"right\" to  <br>pirate fonts. I'm not advocating  breaking or even  <br>changing the law. I'm suggesting type designers  <br>consider alternative methods of distribution and the  <br>benefits of allowing a user to examine before they buy.  <br>I'm questioning the effectiveness of a closed-door  <br>industry as opposed to one where the craft is  <br>accessible and open to all. <br> <br>The music industry is a relatively open industry - we can  <br>hear music before we buy it. The current type climate <br>is radically different. A restrictive policy doesn't allow us  <br>to adequately tinker with type before we can honestly  <br>appreciate its worth. <br> <br>Stephen </p>"
