    html: "<p> bj harvey: <br> <br>&gt;1) Is it right, wrong or gray area to use  <br>&gt;other faces as a guide, or a model. The  <br>&gt;faces might be 200 years old or two. If it  <br>&gt;is 'right', then what is the appropriate way  <br>&gt;to do this?  <br> <br>(I'm cross-posting this to TypeRight members so they can comment if they think I'm misrepresenting the group) <br> <br>I think we've discussed this within TypeRight several times, and I think the answer is in the ethics guide already. We believe, as I suppose most of you do, that typefaces should be protected by copyright. The current standard for copyright persistence is 75 years after the death of the author. <br> <br>Therefore I think it's implied, because of the combination of the TypeRight mission statement and the ethics guide, that we believe that all type should be so protected, or rather be regarded has having such protection - whether an individual state allows for such protection or not. <br> <br>ie, ethically we believe that 75 years after the death of the author any revivals etc can take place without the permission of the author's estate. <br> <br>On a personal level I have some problems with this. <br> <br>Firstly, 75 years after the authors death could be 100-150 years after the creation of the item. This seems like an exceptionally long period of time to protect the rights of the author (as he or she has been dead for some time). <br> <br>At the same time I think it unreasonable for people to directly copy the work of others and earn a profit from it - ie when the work is out of copyright. <br> <br>So, my compromise on this is, that whatever the state decides is reasonable copyright persistence, for all creative works, should be my guiding light. ie if the law states copyright for literature or music should persist until death + 75 years, then ethically I believe that the same standard should apply to type. <br> <br>As to the \"correct\" way to \"revive\" a face? <br> <br>To do it properly you have to go back to the sources and study them. A revival of Garamond for example is not copying one of the modern Garamond interpretations (as these are revivals themselves). <br> <br>It's worth noting in this case that Adobe Garamond has a design patent - so is protected in its design as being original. <br> <br>&gt;2) It has become standard operating procedure  <br>&gt;for the free-font crowd to make a font <br>&gt;based on a car, movie or TV logo, or some  <br>&gt;'found glyphs'. Or to make a font based  <br>&gt;on some signage that was discovered over  <br>&gt;on fourth street. What is appropriate  <br>&gt;and what isn't? Does the designer of the  <br>&gt;logos or the sign painter factor into  <br>&gt;this equation or are glyphs and logos  <br>&gt;treated differently than an entire font. <br>&gt;Further, what if you see ONE letter and make  <br>&gt;a face based on that. What if the face is <br>&gt;based on TWENTY LETTERS? <br> <br>In some cases I think that faces that copy directly from a logo and expand on that may well be infringing copyright, design patent and/or trademark - in such cases it's up to the rights holder to enforce the law. <br> <br>However, again, I think this is covered in the ethics guide. It would be unethical to copy the work of others directly. <br> <br>As to the level of that... I think pretty much from scratch. <br> <br>My personal view on typeface copying is that it's not a matter of a certain number of characters being the same, but of the character of the whole face in use being the same. <br> <br>Of course at the same time there have been, and continue to be, many designers that take influence from \"found\" typography. Probably the most famous example of this is Erik van Blokland's Trixie - indeed Letterror did a whole series of such faces. And of course later there were many, many \"dirty typewriter faces\" copying Letterror's \"original\" idea. <br> <br>In such cases I think we have to consider what the end result was, and whether the source was something \"generic\". <br> <br>Clearly a logo is not \"generic\" it has a specific purpose and is probably quite recent in its design (for it to be thought \"worthy\" of copying). <br> <br>On the other hand a font based on a stencil or a typewiter can be seen as generic because the essential form has been in use for perhaps hundreds or years - often dictated by an industrial process of some kind. In any event no author or copyright holder is known. <br> <br>Somewhere between these extremes are the styles used in signage. Again some of these styles may have been in use for hundreds of years, many are based on \"generic\" forms of handwriting and often the author of the original is unknown. <br> <br>I think in these cases one must take an objective view: is the subject matter specific or generic. If it is specific then you are probably beyond the bounds of the TypeRight ethics guide. If it is generic then you are probably acting ethically. <br> <br>One thing however I would consider in the latter case: if the subject is generic, then what would be the point of copying it, except to create another generic work? I'd also question, whether, as a designer, you would really gain anything from such a project with its inherent lack of creativity on your part. </p>"
