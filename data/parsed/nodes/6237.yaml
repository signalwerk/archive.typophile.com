    html: <p>How subtle does an original idea have to be to be original? We are killing creativity with our silly copyright laws. Why shouldn't someone alter a font to fit their needs? Why can't we admit that <i>all creativity</i> takes from other people's ideas. <br> <br>This doesn't deny that bad rip-offs are just, well, bad. But why should a subtle, yet beautiful, variation be illegal? Are we only concerned about money here?</p>
