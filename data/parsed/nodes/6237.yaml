    html: <p> Christian, <br> <br>The radio analogy doesn't work completely either, because, while you may not pay for the music directly, the advertisers pay the radio station, and the station pays royalty-type fees (BMI, ASCAP, etc.) for the music. The advertisers recoup their money from sales to you, the radio listener. <br> <br>This system is not all that unlike the system that has evolved for typefaces, especially given the increasing notion of "subscription" or "library" discounts -- licensing a foundry's entire library for a one-time fee that represents a substantial discount over the costs of each font individually. <br> <br>Also, while a font family can seem expensive to license at $200, it is also (more or less, in most cases) a lifetime license that can be used over and over again. Looking at the body of licensed fonts that I use most often, and breaking them down across all the various client projects on which they have been used, I could certainly easily recoup my costs of licensing by charging a flat rate $10 or even $5 font licensing fee to my clients. <br> <br>Admittedly, this is not something I have been doing, but it sounds like a reasonable idea that I will now seriously consider. I can't imagine a single client that would have a problem paying it. <br> <br>David </p>
