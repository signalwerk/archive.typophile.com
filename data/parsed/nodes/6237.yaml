    html: "<p> From a a personal perspective I wouldn't place much weight on any information at Luc's site. While it does contain a lot of good information it is let down by some stuff that seems to warp the facts to some private agaenda, for instance: <br> <br>&gt;Clive's fonts Julius and Adams Rounded are <br>&gt;slight adjustments of Avenir and VAG Rounded. <br>&gt;Now, if they had been exact copies, the font <br>&gt;world would have had its very own Captain Hook. <br> <br>Hmm, so I do some font adaptions, clearly labelled as such, and within the licence of the originals (only for use where a licence exists for the original and not to be redistributed or sold) and I'm a pirate!? In the case of the Avenir/Julius fonts I actually organised the whole job with the cooperation of Linotype and ended up buying a 5,000 user licence for a corporate client. <br> <br>Or this: <br> <br>&gt;Erik van Blokland discusses the value of type,  <br>&gt;and in particular argues about the added value  <br>&gt;in good typefaces. He concludes with a  <br>&gt;commendable argument against the cheap font  <br>&gt;CDs (blue collar crime)... <br> <br>Nice one Erik, good article you made some excellent points <br> <br>&gt;but fails to mention that most rip-offs in the <br>&gt;world are actually committed by the major <br>&gt;companies (white collar crime), and by nearly <br>&gt;every corporate font designer. Does he not <br>&gt;remember how Bitstream and URW started? Or how <br>&gt;Monotype helped itself to Zapf's Palatino?  <br>&gt;Or how Tiro's Aeneas is strongly based on a  <br>&gt;font by Werner Schneider? Article dated 1997. <br> <br>What!? Erik writes an opinion piece of about 900 words, which is mostly non-specific in identifying pirates (except that the devil of the day, SSi, is named) and he's criticised for not identifying every piece of font piracy that ever happened!? Sorry, every piece of alledged piracy. <br> <br>I'm sure that Erik is very aware of the foundations on which Bitstream and URW were laid. </p>"
