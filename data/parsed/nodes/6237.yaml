    html: <p> PERHAPS THERE ARE a few more issues that TypeRight needs to add to its guide. Maybe somebody wants to discuss them further here. <br> <br>1) Is it right, wrong or gray area to use other faces as a guide, or a model. The faces might be 200 years old or two. If it is 'right', then what is the appropriate way to do this? <br> <br>2) It has become standard operating procedure for the free-font crowd to make a font based on a car, movie or TV logo, or some 'found glyphs'. Or to make a font based on some signage that was discovered over on fourth street. <br>What is appropriate and what isn't? Does the designer of the logos or the sign painter factor into this equation or are glyphs and logos treated differently than an entire font. <br>Further, what if you see ONE letter and make a face based on that. What if the face is based on TWENTY LETTERS? <br> <br> <br>bj </p>
