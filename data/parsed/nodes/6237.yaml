    html: "<p> Simon: To me that sounds like, \"Go ahead and take someone else's car, as long as you promise to pay it back someday....\" It's nothing more than justification for stealing. <br> <br>Using any product or service without paying the required price/fee/license is just plain wrong. If you can't afford/refuse to pay for a font, then don't use it. There are enough free/bundled fonts out there that no one should ever NEED fonts. If one is needed for a client piece, then pass that cost along to the client. It's really no more complicated an issue than that. <br> <br>David </p>"
