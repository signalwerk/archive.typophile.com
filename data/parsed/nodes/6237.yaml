    date: 2001-11-09T11:22:00
    date_raw: 9 Nov 2001 — 11:22am
    votes: null
    html: <p> So as long as the stolen car isn't actually driven.... &gt;:] <br> <br>What you are suggesting sounds perfectly feasable for SHAREWARE fonts, where they are offered for free download and trust is placed that the fee will be paid if it is actually used. Indeed, the shareware arrangement is exactly as you described. <br> <br>However, for fonts offered by most companies, whether by online sale, CD sale or mail order sale, it's pretty clear that they don't intend even a file transfer unless the licensing fee is paid. There is a distinct difference between this kind of licensing and the licensing offered by a shareware agreement. <br> <br>Further, in cases where licenses have been enforced, even having the unlicensed file in your possession (on a hard drive, backup disk, etc.) is enough to invoke the penalty fine, which can be as much as $150,000, and that's for EACH unlicensed software (including fonts). <br> <br>In addition, the Business Software Alliance (BSA) has been formed to investigate suspected cases of pirating, and they issue press releases listing business small and large that have been found to be using pirated software of any type. <br> <br>I certainly couldn't afford the consequences of being caught using pirated software (including fonts), and I don't want to contribute to the damage that piracy inflicts on the creative community either. <br> <br>Sorry if this is coming across as preachy or holier-than-thou. It is not intended as such. But the law is (slowly) coming down on the side of the software creators on this one, much as the Napster case (rightly, in my opinion) illustrated in finding for the music industry. <br> <br>David </p>
    html_clean: <p> So as long as the stolen car isn't actually driven.... &gt;:] <br> <br>What you are suggesting sounds perfectly feasable for SHAREWARE fonts, where they are offered for free download and trust is placed that the fee will be paid if it is actually used. Indeed, the shareware arrangement is exactly as you described. <br> <br>However, for fonts offered by most companies, whether by online sale, CD sale or mail order sale, it's pretty clear that they don't intend even a file transfer unless the licensing fee is paid. There is a distinct difference between this kind of licensing and the licensing offered by a shareware agreement. <br> <br>Further, in cases where licenses have been enforced, even having the unlicensed file in your possession (on a hard drive, backup disk, etc.) is enough to invoke the penalty fine, which can be as much as $150,000, and that's for EACH unlicensed software (including fonts). <br> <br>In addition, the Business Software Alliance (BSA) has been formed to investigate suspected cases of pirating, and they issue press releases listing business small and large that have been found to be using pirated software of any type. <br> <br>I certainly couldn't afford the consequences of being caught using pirated software (including fonts), and I don't want to contribute to the damage that piracy inflicts on the creative community either. <br> <br>Sorry if this is coming across as preachy or holier-than-thou. It is not intended as such. But the law is (slowly) coming down on the side of the software creators on this one, much as the Napster case (rightly, in my opinion) illustrated in finding for the music industry. <br> <br>David </p>
  - id: 144902
    user: 1203
    date: 2001-11-09T21:41:00
    date_raw: 9 Nov 2001 — 9:41pm
    votes: null
    html: "<p> Stephen: <br> <br>With all respect (and I DO respect your opinion, as I hope you know by now <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ) I think your analysis of the Napster case is extremely oversimplified. I'm not sure how you determined that \"only the most wealthy and successful artists argued on the side of the prosecution.\" That wasn't my perception at all, but I won't try to guess what everyone else's opinion was. The fact of the matter is that American (and many other nations') copyright laws were being violated, harming the interests of the artists who created the work. That millions of people may have been taking part in this doesn't change that fact, nor does their opinion (or other artists' opinions) that they had a \"right\" to freely distribute the artists' work. The law says that they didn't, and the courts upheld this. That's a strong precedent that can (and should) be applied to the protection of type designers' interests as well. <br> <br>Whether CD knockoffs or pirated fonts are more damaging to the industry is not the issue; they are BOTH damaging to the industry, and the industry must be protected from both. <br> <br>The difference in the case you mentioned is that the Underware Foundry CHOSE to give their fonts away for free. Bravo; more power to them. Again, what you are describing is SHAREWARE. <br> <br>Shouldn't designers who choose to SELL licenses to their fonts also have that right, AND have the ability to enforce that right? <br> <br>As a type designer myself, I will probably choose to freely distribute some of my works, as a way of publicly promoting my other designs. Shouldn't I have the right to choose which of my own designs to distribute freely, and which of my designs to demand a licensing fee for their use? And shouldn't the law protect and provide enforcement for that right? No one has a \"right\" to use my work without providing me just compensation for it, and the same goes for any artist, designer or any other producer of goods or services. <br> <br>I know from reading licensing agreements that many other type designers feel the same way about their work. <br> <br>David </p>"
    html_clean: "<p> Stephen: <br> <br>With all respect (and I DO respect your opinion, as I hope you know by now <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ) I think your analysis of the Napster case is extremely oversimplified. I'm not sure how you determined that \"only the most wealthy and successful artists argued on the side of the prosecution.\" That wasn't my perception at all, but I won't try to guess what everyone else's opinion was. The fact of the matter is that American (and many other nations') copyright laws were being violated, harming the interests of the artists who created the work. That millions of people may have been taking part in this doesn't change that fact, nor does their opinion (or other artists' opinions) that they had a \"right\" to freely distribute the artists' work. The law says that they didn't, and the courts upheld this. That's a strong precedent that can (and should) be applied to the protection of type designers' interests as well. <br> <br>Whether CD knockoffs or pirated fonts are more damaging to the industry is not the issue; they are BOTH damaging to the industry, and the industry must be protected from both. <br> <br>The difference in the case you mentioned is that the Underware Foundry CHOSE to give their fonts away for free. Bravo; more power to them. Again, what you are describing is SHAREWARE. <br> <br>Shouldn't designers who choose to SELL licenses to their fonts also have that right, AND have the ability to enforce that right? <br> <br>As a type designer myself, I will probably choose to freely distribute some of my works, as a way of publicly promoting my other designs. Shouldn't I have the right to choose which of my own designs to distribute freely, and which of my designs to demand a licensing fee for their use? And shouldn't the law protect and provide enforcement for that right? No one has a \"right\" to use my work without providing me just compensation for it, and the same goes for any artist, designer or any other producer of goods or services. <br> <br>I know from reading licensing agreements that many other type designers feel the same way about their work. <br> <br>David </p>"
