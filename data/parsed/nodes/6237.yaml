    html: "<p> I laugh when I hear the type foundries talking about copyright. More than any other field type foundries copy the designs of others (living and dead). How many imitation faces are there in my URW type library? The question gets stickier when we start to talk about plagiarism-- but maybe we are approaching this the wrong way. There is great value in many people attacking the same problem. In type design more than anything else, it is hard to draw the line where one face starts looking too similar to another. <br> <br>What about sign painters? They didn't pay to licence lettering styles done by other people (any more than punch cutters did). Why is it so sacred when it gets in digital format-- because it becomes software? It's not like other software. I think more designers should modify the fonts they work with for specific jobs (just like sign painters did). Why not alter a few charactaristics in a font? The original designer took a great deal from other designers. What if a few of his/her letters don't work so well for a specific project. Our society's idea of ownership is wacked out. Logotypes in particular-- It is pathetic how many logotypes are simply a typed font. <br> <br>Why weren't designers affraid when they were borrowing each other's letters while painting them? Beceause they were all creating. They were all interpreting. The way you stay ahead is by adding something new. Why don't more designers do this now? We often hold type design in such awe that hardly anyone does it. \"I'm not a type designer\" I hear this all the time. How can you be a designer and not design type? What do you do with logo types? It's different for text faces, which are more technical, but still-- <br> <br> <br>As I mentioned, type is different from other software. All software requires a user to have software to work with files. However, there are only a handful of formats. With fonts, there are thousands on thousands. Should prepress shops, or even designers working in collaboration have to licence fonts separately? Should one user have to licence a font twice for different machines? What if there are many users using one machine, like in a computer lab. Should each user have to licence the font, or should the lab have to pay more because more people are using it? How about embeding fonts in documents-- can't have that outline information out there. Everyone is afraid of the digital format. <br> <br>One last thing: Historical faces. Somehow, when a designer is dead, this gives us a right to steal their work? YES. It makes sense to everyone. Everyone adapts historical faces and takes great pride in it. Why not adapt living people's faces. Of course credit should be given where credit is due. The same goes for artists covering songs. Some of the coolest songs are covers... but licensing so often gets in the way (that's one reason I like file-swapping). What happened to the days where standards were sung by everyone, everyone giving their unique twist? <br> <br>We keep talking about the morals of ownership. What does ownership mean when it comes to ideas, designs, creativity? We tend to view ideas in terms of the equation: Ideas = Money. Therefore, to use someone elses idea is stealing their money. But no idea, or creative leap is based on itself-- they all borrow from others. Really the underlying idea is: all designers should get compensated for thier work. It just so happens that the system we live in functions under the i=$ equation, and therefore we assign ownership to ideas. It doesn't mean that there aren't other ways to compensate those who do the work. <br> <br>I'm trying to think of some other ways of doing this. I'm trying to get further outside the box. </p>"
