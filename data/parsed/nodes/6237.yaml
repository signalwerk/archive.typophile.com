    html: "<p>While we're mostly discussing individuals  <br>copying fonts I thought I'd point out a couple of  <br>articles in the Typophile coffers that touch on  <br>the topics raised here. <br> <br>&lt;Begin Shameless Plug&gt; <br> <br><a href=\"http://typophile.com/articles/typeright/index.html\" target=\"_blank\"> The Typeright Guide to Ethical Type Design. <br>(From Typeright, of course.)</a> <br> <br><a href=\"http://typophile.com/articles/honor/index.html\" target=\"_blank\"> Honor Among Thieves: Lament of a Small- <br>potatoes Font Developer by Brian Wilson,  <br>Three Island Press.</a> <br> <br>&lt;End Shameless Plug&gt; <br> <br>Both of these articles focus on groups that  <br>copy fonts, edit them and republish them as  <br>their own. Obviously, this is only one kind of  <br>thievery. However, it's definately relevant to this  <br>discussion. <br> <br>Also of note: the Typeright piece mentions the  <br>appropriate (lawful) way to approach  <br>\"Revivals.\" <br> <br>//joe</p>"
