    html: "<p> Tennis shoes and fonts do not compare. For one thing honest tennis shoe users do not have to carry the burden of thousands more dishonest ones. Those who buy fonts are paying for the thousands more that are pirated. Hence, a catch 22: I'm sorry, a type face is not worth 200 dollars in the marketplace--particularly to students and low-brow design shops, which, hate them or not, do the great majority of the work in America. They are the guys that do ugly yellow page ads for plumbers, and make ugly vinyl signs for chinese take-out. It's work that has to be done, and they can't pay $200 for a china-town type face ripped off from some dead designer from the fifties. (He doesn't get royalties). <br> <br>Piracy will not stop until type foundries lower their prices to a reasonable level. Unfortunately they cannot do that until the piracy stops. Catch 22.  <br> <br>About billing clients: Type can't really be compared to illustrations or photography, that are typically purchased for one use. As I mentioned earlier, Wong's Chinese Takeout won't pay $200 for a type face. What's more, if they would, shouldn't they get the licence for the next time they need to change the price on won-ton soup? We don't often bill clients for software, why should we bill them for type? Why would we not let them know it if we did? I'm not trying to be moralistic here. I have billed clients for type. I just don't think it's that easy of an issue. We would be miffed if a wrench showed up on our mechanic's bill. Type is different from a wrench, but how much so? <br> <br>I don't believe in piracy. In my life I have only pirated about 5 faces, a few of which are shame- facedly huddled in a folder on my hard-drive marked \"pirated\", each one hoping to one day be legitimized or deleated. But... I unabashedly download mp3's and don't buy all the cds. Then again, I listen to the same songs on the radio without paying a thing either. <br> <br>Someone needs to bite the bullet here. As a designer who uses type, I would hope to be honest. As a designer who sells type-- I should charge an honest price for a type face. <br> <br>But I will probably charge as much as I can like anyone else, dang it. I guess I'm just saying, it's not a simple issue. One thing's for sure-- it shouldn't be illegal to embed a font in a document. Go home emigre. </p>"
