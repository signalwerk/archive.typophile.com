    html: <p> I'd agree with BJ, you don't have to agree with me, or with whatever the law says. But the law is there for a reason, and for the most part it really isn't there to stifle creativity or innovation, quite the opposite. <br> <br>The whole issue of IP law is a lot more complicated than most people think, and has taken literally hundreds of years to get where it is today. <br> <br>So, maybe, chill out a little, read some stuff about copyright, look at the wider picture. <br> <br>I buy things that are protected too, like software and music and books, and sure I'd like to have them all for free. But I'd also like to have my work protected and have real choice over what CDs or books I buy - and I really don't mind if a great author ands up a millionaire because I bought a book. <br> <br>If the people that write this stuff don't get paid then they won't do it - not only will you not be able to buy it, you won't even be able to steal it. <br> <br>Creativity is about a lot more than adapting someone else's ideas. </p>
