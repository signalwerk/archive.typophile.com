    html: "<p> Hrant: <br> <br>&gt;But two things I disagree with:  <br>&gt;1. Legal = Ethical? Not! Not even \"guiding light\". <br> <br>I don't think I really wrote legal = ethical. I think what I wrote was that where copyright is in place then legal should pretty much = ethical. Where copyright or similar protection is not in place then one should look to the way other works are protected by copyright and adopt that standard for your ethics. <br> <br>So, in the EU we don't have a problem because all 15 states are compelled by a directive to have protection in place, 75 years after death. So I think it's reasonable to adopt that standard ethically (for the reasons I've already stated). <br> <br>In the US there's no copyright protection for type. So what I'm advocating is that ethically one should look at how music, photography and literature are protected and adopt that standard. <br> <br>So, other items protected by copyright in the US are protected for 75 years after death, therefore ethically you should adopt that standard to type too. <br> <br>I'll expand upon why I think that at this point it's ethical to \"copy\". <br> <br>One must realise that there are many aspects to intellectual property protection than type, for example literature and music and other areas like patent for machines and drugs etc. <br> <br>Legally, various governments have come up with very similar rules to govern the protection of such. And generally I think they've pretty much come to good compromises. I don't think it's apropriate for drug patents to last 150 years or more, neither do governments, so they are restricted to 15-20 years. There are at least some moral arguments for this being too long, but there must be some compromise. <br> <br>So I think that if you take in some of the wider issues of IP protection, legal = ethical. <br> <br>There are of course some anomalies, the US position of type copyright being one of them. <br>  <br>&gt;2. Luc's site is not perfect, but nothing is.  <br>&gt;However, Luc's input is very valuable in  <br>&gt;casting a cold hard light on many \"covert\"  <br>&gt;aspects of the sometimes dirty business of  <br>&gt;type design. He's one of the few people  <br>&gt;unafraid of the Gray. <br> <br>Please, one example of this \"cold hard light\". <br> <br>All I can see are quite a few unwarrented attacks on people, driven by some weird agenda. There's no uncovering of facts here, the facts have been obscured where they are quite clearly known. <br> <br>How are the quotes noted above about Erik van Blokland and myself, as well as the attack on Simon Daniels, displaying courage in exposing the \"gray\"? <br> <br>As I wrote before Luc's site is quite useful, but is let down by such nonsense. He seems to take everything he is told at face value without checking any underlying facts. </p>"
