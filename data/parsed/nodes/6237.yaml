    html: "<p> Christian: <br> <br>&gt;How subtle does an original idea have to be to  <br>&gt;be original? We are killing creativity with our <br>&gt;silly copyright laws. Why shouldn't someone  <br>&gt;alter a font to fit their needs? Why can't we <br>&gt;admit that all creativity takes from other <br>&gt;people's ideas. <br> <br>Um, well this question needs to go through the whole overview of intellectual property protection, why it was put in place and its historical context. <br> <br>And there's no way I'm going into all of that. <br> <br>However, I can perhaps answer the part about originality and subtlety. <br> <br>Copyright protection extends to items which are original. ie items that are not derived from others. So, where there is clear derivation from a known original the copyright of the orginal persists. Something that is derived from something else cannot be wholly original in itself. <br> <br>However, there is one area of copyright that does allow for some measure of \"sameness\". That is that works created independently can have equal protection, even though they appear to be derived from another source. <br> <br>For example, if I write a poem, and you write one too, and they turn out to be identical, or very close to each other, then as long as I haven't seen your poem and you haven't seen mine, or work contibuting to them, then we both have protection and neither is infringing the other. <br> <br>Note that this doesn't apply to patent where uniqueness is required. <br> <br>&gt;This doesn't deny that bad rip-offs are just, <br>&gt; well, bad. But why should a <br>&gt;subtle, yet beautiful, variation be illegal?  <br> <br>A variant is clearly derived, so therefore it would be illegal, yes. There are exceptions, most foundries permit you to modify fonts you've paid for, with the restriction that you cannot redistibute them, or that they cannot be used where a licence for the original doesn't exist. <br> <br>This is logical if you think about it, because oherwise you could make a slight adjustment to something and then distribute it, what income would the original author have? <br> <br>&gt;Are we only concerned about money here? <br> <br>Yes, pretty much. <br> <br>However there are other aspects. Getting further into the background of IP protection it is essentially a deal between creators and government to protect the rights of the creators while giving access to the public. <br> <br>Let's say that writers didn't have protection for their work, what encouragement would there be for them to expend much effort on creating new work? They would publish and anyone else could copy the original and sell it as their own. <br> <br>But we do have protection for literature and consequently we have the choice of hundreds of thousands of books at a reasonable price. <br> <br>This principal works across all IP. If the creator can get an income from their work then that encourages them to produce further work, it makes it cheap for the public to buy and it gives more choice. <br> <br>The best thing about this is that it actually does work and has been proven to work over a hundred years or more. <br> <br>If creators were not rewarded in monetary forms to pay for their efforts then probably the majority of output would be on an amateur level. </p>"
