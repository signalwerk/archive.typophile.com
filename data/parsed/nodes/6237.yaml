    html: <p>* Clive, thank you for taking time to reply. I appreciate it. <br> <br>* About 10 months ago, I bought Fontographer and this whole new world opened up. I'm a former journalist (furor escribiendi!) and ethics is a big part of the journalism world (insert laughter) and something that I learned about in great detail b/c I didn't want to put myself in 'gray areas.' <br> <br>Some people don't give a rip, but I'd like to figure out the ground rules (of type design) and proceed accordingly. <br> <br>Since my previous post, I was hit with a couple of emails from people pointing me to Luc Devroye's site, specifically the 'legal' part of it. It is at once fascinating and depressing. It appears that some of the top foundries and type designers have acted unethically at some point, some of them brazenly, some of them furtively. <br>  <br> <br>* The origin of my question stems from reading often about "this face is based upon lettering found" in (fill in the blank) or this face uses the (fill in typeface) model. Look at all of the stuff ITC is doing that is 'retro'. In the liner notes, it's all about 'I found this face while looking through a 1920s magazine' and I made it into a font.'   <br> <br>Anyway, creativity is my lifeblood and soul mate and type design is just another outlet. I love it! All the politics I'd like to stay away from! <br> <br>In January, check out Apollo26.com, a site that will feature 'creative' display faces, stuff that hasn't been done, experimental stuff, etc. <br> <br> <br>bj</p>
