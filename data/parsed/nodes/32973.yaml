    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">FF</span> <span class="caps">DIN</span></strong></p>
    <p><a href="/node/40008" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Albert-Jan Pool</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Achaz%20Reuss" title="Create node &quot;Achaz Reuss&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Achaz Reuss</a>,&nbsp;1995-2002</p>
    <p>After re-working and expanding <span class="caps">OCR</span>-B to include three weights for the <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a> 14 release (<span class="caps">FF</span> <span class="caps">OCR</span>-F), Pool began working on his second FontFont, the famous <a href="/node/add/wiki?edit%5Btitle%5D=DIN%20Mittelschrift" title="Create node &quot;DIN Mittelschrift&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">DIN</span> Mittelschrift</a>. This face has not only dominated the traffic signs and public buildings in Germany, but with its technical orientation and straightforwardness it has also found many friends internationally. <span class="caps">FF</span> <span class="caps">DIN</span> has been expanded to a family of five weights. For each weight there is an Alternate cut with old style figures, circular i-dots and full points and oblique terminals on some&nbsp;characters.</p>
    <p>Pool himself considers <span class="caps">DIN</span> Mittelschrift – the German “Autobahn” typeface – to be “probably the most non-designed typeface ever made”. Taking this opinion as a starting point it seemed to be logical to only enhance the typographic quality of the design while maintaining its overall appearance. The original <span class="caps">DIN</span> Mittelschrift is built up from strokes having a constant thickness, all curves being drawn with a compass. This provides a spotty typeface with quirky letterforms, as can especially seen in the characters a, e and s. Compared with characters with fewer strokes, such as b, d, p, q, and o and n they appear rather black. For <span class="caps">FF</span> <span class="caps">DIN</span>, the weight of the horizontal strokes has been reduced, and the curves were designed in a more fluent way. The medium weight of <span class="caps">FF</span> <span class="caps">DIN</span> resembles the original weight of <span class="caps">DIN</span> Mittelschrift. Using it for reading text in smaller point sizes gives a rather dark appearance. The weight scheme for <span class="caps">FF</span> <span class="caps">DIN</span> was conceived to accommodate the addition of a new and lighter “regular” version. Each of the weights has been provided with over 700 kerning pairs, including those with international accents. With <span class="caps">FF</span> <span class="caps">DIN</span>, designers can now use the image and impact of a typeface family relating to items as “traffic”, “engineering” and the German “Wirtschaftswunder”. It is left to each designer to determine how much the original typeface retains its character, as they can now opt for new weights or the alternate fonts that have friendly circular i-dots and old style&nbsp;figures. </p>
    <p><strong>External Links</strong><br><a href="http://www.fontshop.com/fontcase/super_families/ff_din/"><span class="caps">FF</span> <span class="caps">DIN</span></a> at FontShop<br><a href="http://www.fontfont.com/fonts/din"><span class="caps">FF</span> <span class="caps">DIN</span> fonts</a> at FontFont<br>
    5-part <span class="caps">FF</span> <span class="caps">DIN</span> series in <em>Encore</em>: <a href="http://www.magwerk.com/mag.php?magazine=encore&amp;language=en&amp;issue=13&amp;page=32">1</a> | <a href="http://www.magwerk.com/mag.php?magazine=encore&amp;language=en&amp;issue=14&amp;page=12">2</a> | <a href="http://www.magwerk.com/mag.php?magazine=encore&amp;language=en&amp;issue=15&amp;page=76"> | </a><a href="http://www.magwerk.com/mag.php?magazine=encore&amp;language=en&amp;issue=17&amp;page=10">3</a> | <a href="http://www.magwerk.com/mag.php?magazine=encore&amp;language=en&amp;issue=18&amp;page=14">4</a> | <a href="http://www.magwerk.com/mag.php?magazine=encore&amp;language=en&amp;issue=19&amp;page=12"> 5</a><br><a href="http://dinfont.com/"><span class="caps">DIN</span>font.com</a></p>
