      <p>Maybe 20 years ago I was perusing the stacks and came across a book set in Times -- it was machine-set metal, but I don't remember if from Linotype, Monotype, or some other foundry; set in a size a bit larger than normally encountered, and with long descenders. I remember it as being not quite as condensed, but that may be untrue -- can be hard to tell with the slightly larger sizes in metal. I believe it was a work of essays -- in any case, a work of literature. I remember it as being quite beautiful. Like an idiot, I didn't write down the title. </p>
      <p>* * *<br>
      I set a lot of Times in the early 1980s. You're quite right, it is a good typeface. We still have an early Type 1 PostScript Times font from the early 1990s that I think superior to most offerings today. I cannot remember the foundry (publisher). We probably got it from Adobe, as that's where we got most of our cross-licensed fonts -- but with Times, maybe not.</p>
      <p>Every once in a while I contemplate going over it, adding both OT features and some more work on the glyphs themselves, but am always brought up short because modern text designers will just not specify it.</p>
