    html: "<p>I followed the story closely from the beginning, because it really came out of Mike's examination of the Lanston archives, which were then owned by Gerald Giampa and housed in Vancouver. I spent time with Mike and Gerald at Lanston, and heard Mike's initial ideas on the subject first hand. The article that he wrote for the journal of the American Printing Historical Society is well worth reading: its a good piece of research, whatever one thinks of the conclusions. With regard to the conclusions, I'm resigned to the fact that there is unlikely ever to be incontrovertible evidence either way. Mike's account could be true, or it could be a splendidly elaborate hoax -- not necessarily on Mike's part, I should add.</p>"
