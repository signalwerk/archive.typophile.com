      <p>Since MS Office replaced Times New Roman with Calibri as the default text font, about the only time I see Times these days is in older documents on line and in the pages of the Times Literary Supplement, a publication that as a result looks decidedly oldfashioned.</p>
      <p>James Mosley observed some years ago that, although nominally a newspaper face, some of the best uses of Times -- in the Monotype metal version -- was in book typesetting. But it's been quite a while since I last saw a book set in Times.</p>
      <p>With regard to the Starling types, the really remarkable -- and somewhat unnerving thing -- is the italics. The romans are a sensible adaptation of the historical design, better coordinated across the weight range than any version of Times, but the italics are something entirely new. I say they're unnerving because we're so used to the old Times italics being paired with those roman forms.</p>
