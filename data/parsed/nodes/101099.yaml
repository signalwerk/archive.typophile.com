      <p>Simon- "Regarding question 2, The Font Bureau corporation is the largest privately owned type foundry in existence"</p>
      <p>That's nice, but it's not quite true. There are others both larger and privately owned.</p>
      <p>A, Jasonc, "I'm a little unclear on what downscaling a jpg shows about the effort..."</p>
      <p>It gets bigger if you click on it don't it? It's not about hinting, as I would be the last to crit the hinting of Times Roman. It's about the times families, and their technical execution, as asked in the original post.</p>
      <p>I have not doubt that Monotype and Linotype made the various Times families, and by now, individual styles of those families are more related to that, than to anything anyone else might have designed in the past.</p>
      <p>Times regular, which is very close in all versions of Times, is the main issue of originality. Here, Mike, I and others were intrigued by two facts. The first is that SM never said, "I designed Times". The second is that type designers and devlopers have historically come from, gold smithing, gun smithing, architecture, mathematics, ship building and piracy. If Gutenberg, Caslon, Goodhue, Knuth, Karow and Blackbeard could do it, why not Burgess, or as the paper needed to evolve into action why not Parker. </p>
      <p>The resulting Starling, forgetting the whole Burgess vs Morison thing, is an elegant seaworthy series for all sizes, with excellent flight capabilities to the web and dymaxionistic lines regardless of output device and it's doing well.</p>
