    html: <p>Times is still the norm for many academic publishers. There’s an increasing tendency to use something less ubiquitous but still bland like Minion, though I still see many books and articles entirely in Times. I think this is partly due to space economy and partly to the existence of large collections of technical symbols designed to harmonize with Times.</p>
