      <p>And I'm reminded of another recent post where Nick Shinn was making the observation that his "Scotch Modern" was perhaps a transition from the Moderns/didones to post-modern transitional types. As a novice, I had somehow thought that Times was essentially the milestone marker into the (later) Transitionals... but I might see Nick's point about Scotch Modern...</p>
