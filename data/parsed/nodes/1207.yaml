  - id: 9585
    user: 577
    date: 2003-09-10T16:56:00
    date_raw: 10 Sep 2003 — 4:56pm
    votes: null
    html: <p>It's all well and good for us to sit around and trash the UPS logo, and I agree, as a designer I lament the decision to "update" it in the manner they did. That said, none of us were privy to the dicussions, strategy, planning, research, etc. that supported the identity change. It was a process to be sure, and one which I am very sure everyone involved took very, very seriously.  <br> <br>Is it good design? My gut response is no. But let's take a minute to ask ourselves what really makes design good. Is it being pretty? Stylish? Well crafted? Relevant? Effective? Clear? Maybe, just maybe, UPS's primary audience is not graphic designers, design historians, and so-called typophiles. Maybe this new logo WORKS for them.  <br> <br>That's it. Just a little injection of perspective. Personally I use FedEx.</p>
    html_clean: <p>It's all well and good for us to sit around and trash the UPS logo, and I agree, as a designer I lament the decision to "update" it in the manner they did. That said, none of us were privy to the dicussions, strategy, planning, research, etc. that supported the identity change. It was a process to be sure, and one which I am very sure everyone involved took very, very seriously.  <br> <br>Is it good design? My gut response is no. But let's take a minute to ask ourselves what really makes design good. Is it being pretty? Stylish? Well crafted? Relevant? Effective? Clear? Maybe, just maybe, UPS's primary audience is not graphic designers, design historians, and so-called typophiles. Maybe this new logo WORKS for them.  <br> <br>That's it. Just a little injection of perspective. Personally I use FedEx.</p>
