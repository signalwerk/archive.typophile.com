    html: |-
      <p>GUNMOKE is lettering, perhaps based on one or more fonts.<br>
      BUY SELL TRADE may also be lettering. But I did spot a font with similar flare like projections from L and T. This is LHF Conclave by Chuck Davis <a href="http://www.myfonts.com/fonts/letterheadfonts/lhf-conclave/" title="http://www.myfonts.com/fonts/letterheadfonts/lhf-conclave/">http://www.myfonts.com/fonts/letterheadfonts/lhf-conclave/</a><br>
      For various fonts in the Victorian ornamented genre there are several foundries with some interesting designs.<br>
      Decade Type Foundry <a href="http://decadetypefoundry.bigcartel.com/" title="http://decadetypefoundry.bigcartel.com/">http://decadetypefoundry.bigcartel.com/</a><br>
      Font Mesa <a href="http://www.myfonts.com/search/font+mesa/fonts/" title="http://www.myfonts.com/search/font+mesa/fonts/">http://www.myfonts.com/search/font+mesa/fonts/</a><br>
      HiH <a href="http://www.myfonts.com/search/hih/fonts/" title="http://www.myfonts.com/search/hih/fonts/">http://www.myfonts.com/search/hih/fonts/</a><br>
      Greater Albion <a href="http://www.myfonts.com/search/Greater+albion/fonts/" title="http://www.myfonts.com/search/Greater+albion/fonts/">http://www.myfonts.com/search/Greater+albion/fonts/</a><br>
      Solotype <a href="http://www.myfonts.com/search/solotype/fonts/" title="http://www.myfonts.com/search/solotype/fonts/">http://www.myfonts.com/search/solotype/fonts/</a><br>
      Intellecta <a href="http://www.myfonts.com/search/intellecta/fonts/" title="http://www.myfonts.com/search/intellecta/fonts/">http://www.myfonts.com/search/intellecta/fonts/</a><br>
      LHF Letterhead <a href="http://www.letterheadfonts.com/" title="http://www.letterheadfonts.com/">http://www.letterheadfonts.com/</a><br>
      Myfonts has several tags that are worth exploring, including "Wild West", western, circus, country, rodeo, and 1800s.<br>
      In addition you could check the Western Theme at Dafont <a href="http://www.dafont.com/theme.php?cat=106&amp;text=GUNSMOKEBUYSELLTRADE&amp;fpp=100" title="http://www.dafont.com/theme.php?cat=106&amp;text=GUNSMOKEBUYSELLTRADE&amp;fpp=100">http://www.dafont.com/theme.php?cat=106&amp;text=GUNSMOKEBUYSELLTRADE&amp;fpp=100</a> Most of these are amateur efforts or free fonts by reputable authors. But be careful on use, because some are rips of the work of others.</p>
      <p>Don</p>
