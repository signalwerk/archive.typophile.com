    html: <p> Nice sans. I agree with Isaac on the 't' and would go a step further to say all weights of the 't' seem to flare too much, it doesn't seem appropriate in this instance. As for optics. The fig '4' seems to suffer quite a bit from the weight interpolation, as does the 'M' and 'N'. Your notches in the characters 'd', 'b', 'g', 'p', 'q' and 'r' ('Q') all but disappear. It might be nice to exaggerate a bit, maybe? The 'j' and 'f' characters seem to flare also. I really like the severity of it though. Nothing like bowing to the master and sticking to the grid. ;) </p>
