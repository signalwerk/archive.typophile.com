  html: "<p>Hello All, <br> <br>I've been looking for a Fat square sans with thin square counters. I've looked at <a href=\"http://www.myfonts.com/fonts/urw/california-grotesk/urw-t-black/testdrive.html?s=ROBERT%2BREHME&amp;p=48\" target=\"_blank\">California Grotesk</a> and Compacta <a href=\"http://www.myfonts.com/fonts/letraset/compacta/bold/testdrive.html?s=ROBERT%2BREHME%2B%2BS&amp;p=72\" target=\"_blank\">Compacta</a> but they don't have the stoke variation or the super fat (ultra bold) weight I'm looking for. This looks like I've seen it everywhere but there's nothing in my specimen books or anywhere on myfonts.com. This doesn't seem to be manipulated but I've been wrong before. I've tried the \"more fonts like this\". Maybe I shouldn't work at nights anymore. Can anyone point me in the right direction? Thanks. <br> <br>Here's sample:  <br><img src=\"http://www.typophile.com/forums/messages/83/36841.jpg\" alt=\"\"> <br></p>"
  html_clean: "<p>Hello All, <br> <br>I've been looking for a Fat square sans with thin square counters. I've looked at <a href=\"http://www.myfonts.com/fonts/urw/california-grotesk/urw-t-black/testdrive.html?s=ROBERT%2BREHME&amp;p=48\" target=\"_blank\" class=\"link-external\">California Grotesk</a> and Compacta <a href=\"http://www.myfonts.com/fonts/letraset/compacta/bold/testdrive.html?s=ROBERT%2BREHME%2B%2BS&amp;p=72\" target=\"_blank\" class=\"link-external\">Compacta</a> but they don't have the stoke variation or the super fat (ultra bold) weight I'm looking for. This looks like I've seen it everywhere but there's nothing in my specimen books or anywhere on myfonts.com. This doesn't seem to be manipulated but I've been wrong before. I've tried the \"more fonts like this\". Maybe I shouldn't work at nights anymore. Can anyone point me in the right direction? Thanks. <br> <br>Here's sample:  <br><img src=\"http://www.typophile.com/forums/messages/83/36841.jpg\" alt=\"\"> <br></p>"
