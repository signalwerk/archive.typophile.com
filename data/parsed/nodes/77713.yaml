    <p>Logo is for a sheet metal company. Im trying to get the 's' look a little like a blade or something sharp..implying precision - that kind of thing. Just having trouble getting it exactly right. When the line through the centre of the 's' is thin..there seems to be too many fiddly bits either side...the thicker line is a cleaner cut but it starts to look less like an 's'. Any suggestions?</p>
    <p>Thanks</p>
