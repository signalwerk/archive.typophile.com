    html: <p>Here goes. <br> <br>This the new ID system for my freelance business. Designed to a grid? As Keith suggested, the internal design grid. This was designed knowing that I was moving in the near future. Name and address info are two rubber stamps. That way, all I need to do is get new stamps once the move is complete. Also, I don't go through a ton of letterhead, so I make them one at a time with the stamps on whatever paper I want. Envelopes printed one color then stamped with the correct address. So crafty. <br> <br>Randy <br><img src="http://www.typophile.com/forums/messages/30/12200.gif" alt="aquatoad identity"></p>
    html_clean: <p>Here goes. <br> <br>This the new ID system for my freelance business. Designed to a grid? As Keith suggested, the internal design grid. This was designed knowing that I was moving in the near future. Name and address info are two rubber stamps. That way, all I need to do is get new stamps once the move is complete. Also, I don't go through a ton of letterhead, so I make them one at a time with the stamps on whatever paper I want. Envelopes printed one color then stamped with the correct address. So crafty. <br> <br>Randy <br><img src="http://www.typophile.com/forums/messages/30/12200.gif" alt="aquatoad identity"></p>
