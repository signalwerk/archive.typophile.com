  html: <p>Hello Typophiles, <br> <br>We were talking in this thread <br><a href="http://www.typophile.com/cgibin/show.pl?30/11599" target="_blank">http://www.typophile.com/cgibin/show.pl?30/11599</a> <br>about the grid - or no grid - in business cards.  <br>Mr. Anonymous came to the idea that it would be a good idea to show eachothers our businesscards and try to find wether or not there is a grid behind it. <br>I want to take the risk and show you my card. I'm a 'believer' of using no grid for businesscards. Can you find one in mine? <br> <br><img src="http://www.typophile.com/forums/messages/30/11988.jpg" alt="Businesscard"> <br> <br>Let's see you defending your businesscard. <br> <br>Ren</p>
