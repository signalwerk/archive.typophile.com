    html: "<p>nice attitude - But why \".....using no grid...\"? <br> <br>it's not important what is the size of the artwork/design  = 2 by 5, 6 by 9, 24 by 54. <br> <br>rule #1 is to know the rule. <br> <br>there MUST be one spot or area to which the other parts are subordinate and to which the EYE  is immediatley attracted. this , the starting-point for viewing, must be SIMPLE and uncluttered and have the essential ingredient of leading the eye on further into the design. <br> <br>so - call it grid, 2 lines, 30 lines,  composition....etc., etc.,   - rule is a rule.  you need to use it - but be creative, not MECHANICAL. <br> <br> <br> <br>David Hamuel <br> <br> <br></p>"
