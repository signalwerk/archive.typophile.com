    html: <p>Very true, David.  <br>But does one need for that to make a 'grid', as a horizontal and/or vertical setup where to put what? <br>I agree with the fact that you have to lead the eye to the key-point (with a businesscard that is mostly the name or the logo) in the design. From there on you have then to access the rest of the information. I call this hierarchy. That is in every design important. Otherwise all the elements try to be the Nr. 1. <br> <br>Who works than with a real 'Grid' to design businesscards? I'm interested to see how that then works. I agree with Hrant that you have to have optical allignments. Is that then the grid??? <br> <br>Ren</p>
