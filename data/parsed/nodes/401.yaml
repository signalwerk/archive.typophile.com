    html: <p>Darrel, our HP is a pain in the arse, we simply have so much to do tht we still have an old trailer, not even a complete site, online. We have a new Site designed, which is just neat, all white and clean and simple... but nothing ready for the foreseeable future... sadly. The chromeless will stay, however, as a) I completely hate the Browser buttons and b) it gives us more control over what the user sees... at least with some browsers. I love chromeless.  <br>Here's another site we did (you need DSL or a very high-bandwith ISP with this, for we're still working on the Low-Bandwith-Site), which is chromeless as well.  <br> <br><a href="http://www.ruetgers-stiftung.de" target="_blank">http://www.ruetgers-stiftung.de</a> <br> <br>It would be neater, if the browser would allow a painless closing of the original window or alternatively just chromeless within the same windows, but alas... not so far. </p>
