    <p>Does anyone know a website where I can learn a bit about combining different fonts?<br>
    For example which serif goes with other sans serif. Or how to use script fonts properly. I am working on my wedding invitation these days, and I'm going for vintage navy style. Being client to yourself is a nightmare :/ This is something what I really like: <a href="http://ohsobeautifulpaper.com/tag/palm-papers/" title="http://ohsobeautifulpaper.com/tag/palm-papers/">http://ohsobeautifulpaper.com/tag/palm-papers/</a><br>
    Even a book about this could help too. Thanks in advance if anyone can help.</p>
