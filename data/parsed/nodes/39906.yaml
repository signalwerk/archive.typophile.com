    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Cursive</strong></p>
    <p>Being Cursive is a property of <a href="/node/12026" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typography</a> and <a href="/node/13722" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Calligraphy</a> which implies a certain inclination or angular tilt, either positive or negative, relative to the orthogonal “y”&nbsp;axis.</p>
    <p>In type, both <a href="/node/12475" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Oblique</a> and <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italic</a> are Cursive in the sense that they imply some sort of inclination, somehow reminiscent of written language. Other examples of Cursive may include some <a href="/node/17786" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">script</a> types.</p>
