    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Cursive</strong></p>
    <p>Being Cursive is a property of <a href="/wiki/typography" class="freelinking" rel="nofollow">typography</a> and <a href="/wiki/Calligraphy" class="freelinking" rel="nofollow">Calligraphy</a> which implies a certain inclination or angular tilt, either positive or negative, relative to the orthogonal "y" axis.</p>
    <p>In type, both <a href="/wiki/Oblique" class="freelinking" rel="nofollow">Oblique</a> and <a href="/wiki/Italic" class="freelinking" rel="nofollow">Italic</a> are Cursive in the sense that they imply some sort of inclination, somehow reminiscent of written language. Other examples of Cursive may include some <a href="/wiki/Script" class="freelinking" rel="nofollow">Script</a> types.</p>
