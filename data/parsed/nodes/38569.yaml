  html: |-
    <p>For my Typography class, I am creating an alphabet book (similar to a child’s) that basically gives a timeline of fonts and typefaces from the year 1950 - 2000.</p>
    <p>My goal is to find 5 fonts from each decade between these years and outline a basic history of each. (50’s, 60’s, 70’s, 80’s, 90’s, and a year 2000 page)</p>
    <p>This is not a commercial endeavor - however, depending on the final product, it could be. As such, if you provide me with a link, an article, etc. that helps me accomplish this goal, I will include your name in an Acknowledgements section.</p>
    <p>Thanks for any help! I will be scanning the finished book upon completion so you can see.</p>
