    <p>For all who cares is this an update on my Nordic Family I'm working on. This is the Nordic Narrow in the variaty that I have ready until now.  <br>I completely changed the 'g', the previous one was too boring for the romans. It moved to the italics where it fits perfectly.  <br>I created the italics, which are real italics. If someone has some more suggestions to make them more sparkle... feel free. <br>I'm currently working on an update on both Q's, they need a bit more character to stand out of the crowd.  <br>I created the XP (expert) and NR (numbers) character set. This are extra's for the creative designer. They could come in handy if you have to spice up a typographic layout.  <br> <br></p>
