    html: <p>Rene, <br> <br>Do you have this set up with a MM weight axis? I had not done that before, but discovered it sure makes life very nice when you want to fiddle with the weight by a hair this way and that. I wouldn't make a MM final product (generate the weights you settle on), just make sure you check over the interpolation results. The FL manual explains how to take two fonts and make them the masters. Clear, quick and easy. <br> <br>Another factor (Hrant alludes to) is how big the glyphs are in the em square. I tend to make them quite large so stems of 80-90 ems are right for text. The fact that people like light text and heavy bolds means it is nice if you give them that option even if you don't prefer it. Let them use light and bold. <br> <br>In future I plan on making fonts smaller in the em square. The reason being I think a naturally open leading will improve the looks across all users (ie, better at default 12 pt with auto leading). <br> <br>Randy</p>
    html_clean: <p>Rene, <br> <br>Do you have this set up with a MM weight axis? I had not done that before, but discovered it sure makes life very nice when you want to fiddle with the weight by a hair this way and that. I wouldn't make a MM final product (generate the weights you settle on), just make sure you check over the interpolation results. The FL manual explains how to take two fonts and make them the masters. Clear, quick and easy. <br> <br>Another factor (Hrant alludes to) is how big the glyphs are in the em square. I tend to make them quite large so stems of 80-90 ems are right for text. The fact that people like light text and heavy bolds means it is nice if you give them that option even if you don't prefer it. Let them use light and bold. <br> <br>In future I plan on making fonts smaller in the em square. The reason being I think a naturally open leading will improve the looks across all users (ie, better at default 12 pt with auto leading). <br> <br>Randy</p>
  - id: 20699
