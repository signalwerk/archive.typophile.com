    votes: null
    html: <p>I'm sorry hhp, but I can't find the MM Generation on FontShop. Also not on MyFonts. Do you have it or do you have an image of it? <br>This rigid elements and the sharper edges are an important characteristic of Nordic. I can imagine that some people don't like it because it feels to unflexible, or un-textfont-like. It's not a textfont in such a way that it's balanced, perfectly readible, saving space on the page, etc. The Text Family will be more like that. Nordic is a bit bold with a touch of restraint. More like daring interesting and boring at the same time.  <br> <br>Hhp, how would you see the interpolation of the Nordic? Can you explane that some more? I would like to handle the interpolation in a good way. The Text should lean to the Nordic, but has to be more accessable to a wider audience and more functional. <br> <br>Ren</p>
    html_clean: <p>I'm sorry hhp, but I can't find the MM Generation on FontShop. Also not on MyFonts. Do you have it or do you have an image of it? <br>This rigid elements and the sharper edges are an important characteristic of Nordic. I can imagine that some people don't like it because it feels to unflexible, or un-textfont-like. It's not a textfont in such a way that it's balanced, perfectly readible, saving space on the page, etc. The Text Family will be more like that. Nordic is a bit bold with a touch of restraint. More like daring interesting and boring at the same time.  <br> <br>Hhp, how would you see the interpolation of the Nordic? Can you explane that some more? I would like to handle the interpolation in a good way. The Text should lean to the Nordic, but has to be more accessable to a wider audience and more functional. <br> <br>Ren</p>
  - id: 20695
