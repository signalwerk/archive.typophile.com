    html: "<p>For some reason only the German branch of FontShop shows Generation... <br><a href=\"http://www.fontshop.de\" target=\"_blank\">http://www.fontshop.de</a> <br> <br>I think for the interpolation you need to address two tricky issues: <br>1) How much to \"soften\" the design for the text version/extreme. <br>2) What features <i>not</i> to implement in the transtion from display to text. This is because the transition is actually not \"continuous\" (to use a mathematical term, since that's what interpolation is), so either the display version has to be somewhat texty or the text version display-like. The second choice is safer, especially since there's a tight limit as to how texty this can get anyway (without losing its character). <br> <br>Working from the top sample in your PDF above, I'd say the text version needs to be: <br>1) Much darker. <br>2) Less mannered (more \"normal\") forms. <br>3) Shorter rigid segments. <br>4) Smaller x-height. <br> <br>But before you get <i>too</i> enthusiatic, you should be aware that the benefits of a display/text axis are largely ideological - few people will know how to really use such an exotic animal. <br> <br>hhp <br></p>"
    html_clean: "<p>For some reason only the German branch of FontShop shows Generation... <br><a href=\"http://www.fontshop.de\" target=\"_blank\" class=\"link-external\">http://www.fontshop.de</a> <br> <br>I think for the interpolation you need to address two tricky issues: <br>1) How much to \"soften\" the design for the text version/extreme. <br>2) What features <i>not</i> to implement in the transtion from display to text. This is because the transition is actually not \"continuous\" (to use a mathematical term, since that's what interpolation is), so either the display version has to be somewhat texty or the text version display-like. The second choice is safer, especially since there's a tight limit as to how texty this can get anyway (without losing its character). <br> <br>Working from the top sample in your PDF above, I'd say the text version needs to be: <br>1) Much darker. <br>2) Less mannered (more \"normal\") forms. <br>3) Shorter rigid segments. <br>4) Smaller x-height. <br> <br>But before you get <i>too</i> enthusiatic, you should be aware that the benefits of a display/text axis are largely ideological - few people will know how to really use such an exotic animal. <br> <br>hhp <br></p>"
