    html: "<p>Since the phototype days until very recently, the weights of text fonts have been too light (as far as I'm concerned). You have to make an aesthetic decision for yourself, but I for one am happy that there's now a trend towards more \"meaty\" Regular weights. Although there's also a trend of making Bolds too dark, and I hate that. <br> <br>BTW, exact measures can be misleading because you have to factor in other things, like size-on-body, spacing, etc. Two fonts of equal stem thickness can have very different color when each is set at a point sizes suitable to it. Fonts that have lesser apparent size tend to get set at larger point sizes, and they gain more weight. <br> <br>In terms of determining the weights of a set of four, your best bet is to: <br>1) Do it mostly by eye. <br>2) Determine the Regular first, then its Bold (for emphasis), then the Semi to work well for smaller sizes of text, then backwards* from the Semi to the Light. <br> <br>* By which I mean that the Semi should work for emphasis in a body of Light. <br> <br>BTW, why 21 &amp; 91, and not 20 &amp; 90 for the extremes? <br> <br>&gt; It's hard to design fonts without having any education and/or constructive help from the outside. <br> <br>Yeah, tell me about it!  :-/ <br> <br>hhp <br></p>"
    html_clean: "<p>Since the phototype days until very recently, the weights of text fonts have been too light (as far as I'm concerned). You have to make an aesthetic decision for yourself, but I for one am happy that there's now a trend towards more \"meaty\" Regular weights. Although there's also a trend of making Bolds too dark, and I hate that. <br> <br>BTW, exact measures can be misleading because you have to factor in other things, like size-on-body, spacing, etc. Two fonts of equal stem thickness can have very different color when each is set at a point sizes suitable to it. Fonts that have lesser apparent size tend to get set at larger point sizes, and they gain more weight. <br> <br>In terms of determining the weights of a set of four, your best bet is to: <br>1) Do it mostly by eye. <br>2) Determine the Regular first, then its Bold (for emphasis), then the Semi to work well for smaller sizes of text, then backwards* from the Semi to the Light. <br> <br>* By which I mean that the Semi should work for emphasis in a body of Light. <br> <br>BTW, why 21 &amp; 91, and not 20 &amp; 90 for the extremes? <br> <br>&gt; It's hard to design fonts without having any education and/or constructive help from the outside. <br> <br>Yeah, tell me about it!  :-/ <br> <br>hhp <br></p>"
