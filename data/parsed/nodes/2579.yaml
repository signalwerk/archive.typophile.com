    html: "<p>Yeah, weight axes rock. <br> <br>The way I think is generally best is to: <br>1) Make a midling weight that looks good for text. <br>2) Make a Bold \"candidate\" (maybe using auto-weight-gain + mucho tweaking). <br>3) Extrapolate the lightest and darkest extremes. <br>4) Clean up the extremes real good. <br>5) Make new intermediates and compare against the originals. <br>6) Tweak only the extremes to make any new intermediates come out good, dumping the original intermediates. <br> <br>In this way you have clean results but you never have to tweak intermediates again. <br> <br>&gt; improve the looks across all users <br> <br>I think this is well-intended but unrealistic: people who just use defaults (like anaconda 12pt lines with no leading) don't use strange (read: our) fonts. <br> <br>hhp <br></p>"
    html_clean: "<p>Yeah, weight axes rock. <br> <br>The way I think is generally best is to: <br>1) Make a midling weight that looks good for text. <br>2) Make a Bold \"candidate\" (maybe using auto-weight-gain + mucho tweaking). <br>3) Extrapolate the lightest and darkest extremes. <br>4) Clean up the extremes real good. <br>5) Make new intermediates and compare against the originals. <br>6) Tweak only the extremes to make any new intermediates come out good, dumping the original intermediates. <br> <br>In this way you have clean results but you never have to tweak intermediates again. <br> <br>&gt; improve the looks across all users <br> <br>I think this is well-intended but unrealistic: people who just use defaults (like anaconda 12pt lines with no leading) don't use strange (read: our) fonts. <br> <br>hhp <br></p>"
  - id: 20700
    user: 618
    date: 2004-01-07T06:10:00
    date_raw: 7 Jan 2004 — 6:10am
    votes: null
    html: "<p><i>Yeah, weight axes rock.</i> <br>Hunh Hunh. Yeah. Hunh Hunh. They like. Rock. <br> <br>Hrants plan seems like a good one to me. Before I would have thought it a lot of work, but it is simply much speedier than drawing all the weights from scratch! One other handy part about using weight axes: It helps identify minor problems in your stroke modulation. When you extrapolate to a thin weight it shows any wobbly curves in technicolor. Yuck! On my current project I'm going from light to black, with original masters at regular and heavy. (no stroke modulation issues in Nordic though!) <br> <br>&gt; Improve the looks across all users <br> <br>You'd be suprised (or not) how many designers leave the default, or possibly just follow a formula they've set up (ie. I think 12pt over 14 looks good for text) without regard to the font specific needs. Granted, these folk will be buying only the most popular and trendy fonts (din, meta, mrs. eaves, interstate and company), but hey, I wouldn't mind it if my fonts were popular, trendy <i>and</i> good looking at default settings:-) Besides, unless your font has crazy littly display details, using a smaller chunk of a 1000em square wont kill you. I'd rather err on the side of more leading than less. <br> <br>&gt; strange (read:our) fonts <br>Speak for yourself! :-) <br> <br>Randy</p>"
    html_clean: "<p><i>Yeah, weight axes rock.</i> <br>Hunh Hunh. Yeah. Hunh Hunh. They like. Rock. <br> <br>Hrants plan seems like a good one to me. Before I would have thought it a lot of work, but it is simply much speedier than drawing all the weights from scratch! One other handy part about using weight axes: It helps identify minor problems in your stroke modulation. When you extrapolate to a thin weight it shows any wobbly curves in technicolor. Yuck! On my current project I'm going from light to black, with original masters at regular and heavy. (no stroke modulation issues in Nordic though!) <br> <br>&gt; Improve the looks across all users <br> <br>You'd be suprised (or not) how many designers leave the default, or possibly just follow a formula they've set up (ie. I think 12pt over 14 looks good for text) without regard to the font specific needs. Granted, these folk will be buying only the most popular and trendy fonts (din, meta, mrs. eaves, interstate and company), but hey, I wouldn't mind it if my fonts were popular, trendy <i>and</i> good looking at default settings:-) Besides, unless your font has crazy littly display details, using a smaller chunk of a 1000em square wont kill you. I'd rather err on the side of more leading than less. <br> <br>&gt; strange (read:our) fonts <br>Speak for yourself! :-) <br> <br>Randy</p>"
