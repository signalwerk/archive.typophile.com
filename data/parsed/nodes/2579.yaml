    html: <p>I found it. Strange that only they have it. Propably nothing for the American market? <br> <br>I see the dangers in this exotic animal. I would not go so far as this font to make a real blend between the Nordic and the Text version. I would like to make a Text version out of it though that feels like the Nordic, but has enough personallity to stand it's own man.  <br>Ofcourse you have 4 good arguments when it comes to making the Text version of Nordic. I compared some of the best fonts out there (at least to my opinion) and found that most of them have stem widths between 60 and 80 em. On average they are about 65 em in diameter. Is this a good 'weight' for a regular version? Is there anything you can say on that? Are serif regulars thicker or thinner then sans regulars?  <br>From Nordic I have now the Light (21 em) and the Bold (91 em) version. I will create two weights inbetween of 44 em and 67 em widths. The 67 em will then be the regular and the basis for the Text version. Judging from the other fonts I investigated, this should be OK. <br> <br>It's hard to design fonts without having any education and/or constructive help from the outside.  <br> <br>Thanx for your help. <br>Ren</p>
