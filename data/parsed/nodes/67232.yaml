    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sommet-Slab-poster_4073.png"></div><div class="imageWrap"><img src="http://typophile.com/files/sommet-Slab-Poster-OTF_3587.png"></div><div class="imageWrap"><img src="http://typophile.com/files/sommet-Slab-Poster-Quote_3713.png"></div><div class="imageWrap"><img src="http://typophile.com/files/sommet-Slab-Poster-Text_5486.png"></div><p></p>
    <p>The <a class="freelinking external" href="http://new.myfonts.com/search/sommet/fonts/" rel="nofollow">Sommet family</a> of typefaces has been updated with a new slab serif variant.</p>
    <p>Expanding on Sommet’s successful design principals, <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/sommet-slab/" rel="nofollow">Sommet Slab</a> is there when you need more impact and power.<br>
    Sommet Slab is available with six weights and complementary italics and plenty of OpenType features. Sommet Slab features a tall x-height, and its letterforms are compact, perfect for when layout space is at a premium. Over twenty OpenType alternate characters are available, including friendlier upright italic forms, and a unique simplified lowercase. Sommet Slab also includes oldstyle figures and small caps.</p>
    <p>Use Sommet Slab whenever you need a powerful and contemporary slab-serif.</p>
