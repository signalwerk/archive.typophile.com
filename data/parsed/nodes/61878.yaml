    html: |-
      <p>Nice typeface.</p>
      <p>The spine of the S is a little too straight.<br>
      It's a matter of personal taste but I find the e a little more extreme than the rest of the alphabet. I would love to see an æ.<br>
      I love the b and d. The tail on the Q is very appropriate to the overall look and feel.<br>
      Lowercase t and i are a little thick on paper but the rest of the alphabet seems to have a consistent colour (maybe better trained eyes have a different say?).<br>
      I'm not suggesting you add a terminal, but the branch of the r seems to fade away at text size (could be my printer though)<br>
      Can we see a hook g? :P<br>
      I just expect a serif on an n following that g.<br>
      The last five letters of the lowercase alphabet are far more mechanical than the rest. Of course in a text setting they are dispersed and blend in okay. It's just a coincidence that they form a band in the alphabet.</p>
      <p>Anyway I love the comma. Would love to see some more punctuation, oh and old style figures ;)</p>
