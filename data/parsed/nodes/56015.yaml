    <p>Dear fellow Typophiles,</p>
    <p>My idea is to create a logo that can be used on products and things that are made in Latvia (Northern Europe). Logo has to be easy to print/burn/sew on <strong>any type</strong> of product or thing.</p>
    <p><strong>Here is what I have come up with -- <a class="freelinking external" href="http://madeinlatvia.org" rel="nofollow">madeinlatvia.org</a></strong> (<a class="freelinking external" href="http://madeinlatvia.org/draft.jpg" rel="nofollow">initial draft</a>).</p>
    <p>Things worth knowing:</p>
    <ul>
    <li>Latvia is <a class="freelinking external" href="http://en.wikipedia.org/wiki/Latvia" rel="nofollow">located</a> near the Baltic Sea. It has lots of white sand beaches and <a class="freelinking external" href="http://www.flickr.com/photos/tags/latvia/interesting/" rel="nofollow">wide open fields with blooming meadows</a> and birch and pine tree forests that take up almost 50% of the territory.</li>
    <li>Latvians have inhabited that territory since 900 AD, while the recent history made us live <em>under the flags</em> of various foreign superpowers of which the last one was the Soviet Union.</li>
    <li>Here are some examples of the <a class="freelinking external" href="http://zagarins.net/Latvjuraksti/Kurzeme-Zemgale/index.html" rel="nofollow">traditional folk clothing</a>. Most of the design patterns <a class="freelinking external" href="http://zagarins.net/Latvjuraksti/Krekluraksti/index.html" rel="nofollow">used in clothing</a> and <a class="freelinking external" href="http://zagarins.net/Latvjuraksti/Z%27ogi_jumti_durvis/index.html" rel="nofollow">architecture</a> were based in pagan beliefs.</li>
    <li>A lot of the <a class="freelinking external" href="http://www.flickr.com/search/?q=latvian+design&amp;page=2" rel="nofollow">today's graphic design</a> influence comes from the Soviet times.</li>
    </ul>
    <p>Concepts used in the logo:</p>
    <ul>
    <li><em>MADE IN</em> and the thick line below it forms a Latvian flag (two horizontal stripes divided by one white stripe -- 2:1:2).</li>
    <li>Typeface design influenced by <a class="freelinking external" href="http://www.laima.lv" rel="nofollow">Laima chocolate</a> logo, <a class="freelinking external" href="http://3.bp.blogspot.com/_EHbf-gkQ3Hc/R6yeCQwPJBI/AAAAAAAACFk/97nolH2WujA/s1600-h/sakta.jpg" rel="nofollow">Sakta department store logo</a> and <a class="freelinking external" href="http://www.flickr.com/photos/evansphoto/494970221/" rel="nofollow">the Sea</a>.</li>
    </ul>
    <p>Please let me know your thoughts on the typeface and the spectrum of emotions this logo creates. Thank you.</p>
