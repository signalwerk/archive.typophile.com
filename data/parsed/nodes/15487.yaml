    <p>Hi all,<br>
    I've been working on this for a while now and thought it was probably at the right stage to show everyone any hopefully get some feeedback. The working title is Wolfgang but this will be changed once I think of something better.</p>
    <p>One big thing I'm not sure about is the 'w'. I'm not sure if I should use the overlapping one or not. I like it and I think it is a bit different but I have been getting mixed feedback about it, some people love it, some think it doesn't quite work.</p>
    <p>There are a few alternate characters I think I might go back to to see if it can be a little more consistent. There is a capital 'V' that is the same as one of the V's in the crossing 'W' and I may also do a capital A that is like one of these upside down.</p>
    <p>Any feedback would be greatly appreciated.</p>
    <p>Thanks in advance,<br>
    Andy</p>
