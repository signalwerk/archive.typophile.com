      <p>Andy,</p>
      <p>You didn't say whether your intention was text or display.   The overlapped W becomes more problematic at smaller sizes.  It can cause a dark spot, particularly with a very low contrast font. For the same reason, it is less obtrusive as a cap than it is as lower case. You might think about using it in the cap only.  In headings and display usage, where size can be large, you have more leeway. You may make the overlap an alternate so that the typographer can choose by virtue of how he/she is using the face.</p>
      <p>ChrisL</p>
