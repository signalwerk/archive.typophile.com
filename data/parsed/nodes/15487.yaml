      <p>Andy, first of all: Whenever you please <cite>everybody</cite>, there's something wrong.</p>
      <p>Also: If a type designer refuses to give a crit simply because he doesn't like it, he's either ungraciously selfish, or more an Artist than a Designer. Or quite often both.</p>
      <p>--</p>
      <p>Although this is not my cup of tea, here's what I see:</p>
      <p>"a": make the top fully round - no flat part.<br>
      "g": don't make the left side of the bottom bowl overshoot the head.<br>
      "w": no overlap; but the McDonalds thing is too much. So try taking the overlapped form and just removing the righthand inside arm.<br>
      "x": needs curves.</p>
      <p>UC: no Art Deco low-waist stuff, I don't think.<br>
      "Q": cool, but too dark at the join.<br>
      "W": same as in the lc.</p>
      <p>"5": the head is going too far left.</p>
      <p>hhp</p>
