      <p>Woodtype was usually sold by number and did not have a name. This seems to be a match to No. 97 from the Hamilton type company.</p>
      <p>Link I have on file for the source of the image, Hamilton catalog 14, is:<br>
      <a href="http://www.unicorngraphics.com/wood%20type%20museum.asp" title="http://www.unicorngraphics.com/wood%20type%20museum.asp">http://www.unicorngraphics.com/wood%20type%20museum.asp</a></p>
      <p>Unfortunately the link did not work when I tried it a few minutes ago.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/No97HamiltonCatalog14_4182.jpg"></div><p></p>
      <p>Don</p>
