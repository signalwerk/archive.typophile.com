      <p>Gill Sans actually isn’t free. However, some weights of it ship with OSX. Which isn’t free.</p>
      <p>For the serif: Check out the <a href="http://typophile.com/node/14652">FAQ Free</a>. <a href="http://scripts.sil.org/CharisSILfont">Charis SIL</a> is <em>somewhat</em> similar to Scala Serif—if you don’t take account of much more than the angled serifs. <a href="http://www.bitstream.com/font_rendering/products/dev_fonts/vera.html">Bitstream Vera</a> comes in matching Sans, Serif &amp; Mono.</p>
      <p>Then of course, Scala is rather unique—<a href="http://www.fontfont.com/shop/index.ep?clist=PS,12486&amp;cview=P12486">and it starts from $40</a> …</p>
