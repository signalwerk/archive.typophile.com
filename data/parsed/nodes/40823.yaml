    html: <p>Thanks much to both of you for your recommendations. The Legacy Sans certainly is an appropriate pairing, but also makes me wonder if I should go for a less rooted-in-centuries past serif font after all. The Garamond/Univers pairing is quite elegant; wish I hadn't sworn off Garamond...</p>
