  html: |-
    <p>I'm currently putting together a syllabus, which means avoiding tormenting questions about schedules and readings in order to address the pressing question of fonts. Being a terribly understudied pupil on the matter, I'm currently trying to find a good sans serif font to go with Adobe Jenson Pro. Any suggestions?</p>
    <p>My broader question concerns any practical advice - dare I solicit a method - for pairing serif and sans serif. I know rudimentary things about coupling fonts with like x-heights, but I'm having a hard time putting this precept into action. Take pity! Enlighten me velociously!</p>
    <p>thanks,<br>
    G</p>
