    html: |-
      <p>I don't have an answer for you, but I'm glad I'm not the only one who puts off the content of the syllabus in order to choose a new font I've always wanted to try out.  I'm almost never happy with the pairings I get between serif and sans serif, however.  I was happy once with a presentation template that used Adobe Garamond for titles and Cronos for body text.  Perhaps <a class="freelinking external" href="http://www.myfonts.com/search?search%5Btext%5D=cronos" rel="nofollow">Cronos</a> is a typeface to check out.</p>
      <p>I also saw a nice set of handouts that used Garamond for body text and Univers Condensed for headings.  In that case, the contrast seemed to work out well.</p>
      <p>ST</p>
