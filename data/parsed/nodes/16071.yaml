      <p>The Grauniad is a (now largely affection) nickname for The Guardian, which used to be notorious for its misspellings. I don't think they still have the reputation, but the name has stuck.</p>
      <p>The point of Kevin's presentation in Helsinki was about the relationship between the pleasurable aesthetic experience of typography and measurable increase in cognitive performance, based on related work in which people are found to perform problem solving tasks more easily and quickly after an enjoyable mental experience such as watching an amusing video rather than a dry lecture. So not directly related to the crapshoot of trying to increase readership in a competetive newspaper market.</p>
