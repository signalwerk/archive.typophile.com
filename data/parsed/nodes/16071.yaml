      <p>Fenway is in the back bay neighbourhood formally called Kenmore. The Fens is an area about a mile south of Fenway Park. </p>
      <p>The Fens is a Lincolnshire area with the towns Boston and Spalding in eastern coastal England.</p>
      <p>A.G. Spalding was a Boston Red Sox pitcher who founded the Spalding athletic company in 1876.</p>
      <p>I was born 8/10 of a mile from Fenway Park in what is now the Beth Isreal Deaconess Medical Center, the official hospital of the Boston Red Sox. I now live in London England.</p>
      <p>Matthew Carter was born in England, but lives in Cambridge (MA) across the Charles River from Fenway Park.</p>
      <p>We both made bitmaps for Tahoma, he on a Mac and me on Windows.</p>
