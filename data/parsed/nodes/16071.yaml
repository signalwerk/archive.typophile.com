    <p>• Le Monde newspaper was the brainchild of Gen Charles De Gaulle<br>
    • The Billy Joel hit “We didn’t start the fire” contains the line “Charles De Gaulle, California baseball"<br>
    • The California Angels baseball team, renamed the Anaheim Angels, renamed the Los Angeles Angels of Anaheim were swept aside by the Boston Red Sox in the 2004 post-season on their way to their curse breaking World Series win.<br>
    • The Boston Red Sox play at Fenway Park.<br>
    • Matthew Carter designed "Fenway" for Sports Illustrated.<br>
    • On Monday Le Monde’s <a href="http://www.thebusinessonline.com/Stories.aspx?Can%20redesign%20bring%20back%20readers?&amp;StoryID=D53D860D-E1FA-4769-A2B9-B9DDAE691469&amp;SectionID=D10E7723-CB86-485F-A420-D474F74D7E03" rel="nofollow">redesign hits the streets</a> and uses, you guessed it, Fenway.</p>
