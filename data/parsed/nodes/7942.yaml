    html: <p>I would go with top left of your original post, with all small caps and remove the parentheses from the dates and make the size equal the rest of the type, I would also investigate non-aligning numerals (as the 150), however the 5 has a very abrupt stop and the 1 needs its serifs. As for line breaks the lefthand second image posted - but not the letterspacing - make more sense. I would also redraw the crown with more detail and smoother lines, taking into account the sizes it might be reproduced as parts of it will not print at small sizes. You have a good composition and colours. <br>Tim</p>
