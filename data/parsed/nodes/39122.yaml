    <p>Hello all,</p>
    <p>I’m in the process of developing the identity for a environmentally friendly interior design company called eden. The owner is really fond of the idea of having a tree sprout from the ascender of the d and it’s roots from the counter space.</p>
    <p>Since the overall concept is pretty simple I thought a sans-serif font would be most appropriate for the company. </p>
    <p>I’ve been in search for the perfect font and I am in need of some assistance. Since the companies name is in all lowercase I was thinking of customizing avenir (35 light) or going with a font similar to helevetica neue. </p>
    <p>Do you all have any ideas of what may work?</p>
    <p>Thank you in advance!</p>
