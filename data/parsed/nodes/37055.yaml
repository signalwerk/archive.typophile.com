    <p>Hi All, </p>
    <p>I'm working on a letterhead that uses Bank Gothic. Can you think of good fonts to pair with Bank Gothic that I can use for body text? I'm currently using Gotham for body text. </p>
    <p>Thanks,</p>
    <p>Tal</p>
