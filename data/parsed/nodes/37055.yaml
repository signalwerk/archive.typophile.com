      <p>Strong. Clean. Modern, but with nod to the past.</p>
      <p>More like Caecilia:</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_nexus_mix_ot/" rel="nofollow">FF Nexus Mix</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/lucasfonts/theserif_classic/" rel="nofollow">TheSerif</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/silica/" rel="nofollow">Silica</a>, which might be ideal for this, but no italics.</p>
      <p>I think Caecilia is your best bet.</p>
