      <p>Great brief. Thanks. Gotham seems okay for this, but it has the drawback of being overexposed right now. So if he wants to be unique, best use unique type.</p>
      <p>Bank Gothic has a vintage pedigree, but you can make it live comfortably in a modern design if you want. Suggestions in that vein:</p>
      <p><a href="http://www.fontshop.com/search/?q=Amplitude%20-purchase" rel="nofollow">Amplitude</a><br>
      <a href="http://www.fontshop.com/search/?q=Utopia" rel="nofollow">Utopia</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/arstype/descendiaan/" rel="nofollow">Descendiaan</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_nexus_serif_ot/" rel="nofollow">FF Nexus Serif</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/pmn_caecilia_std_ot_virtual/" rel="nofollow">PMN Caecilia</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/presence_typo/presence/" rel="nofollow">Présence</a><br>
      <a href="http://www.fontshop.com/search/?q=Freight" rel="nofollow">Freight</a></p>
      <p>This is sort of a scatter shot. If one or more of these hit near the spot for you, let me know and I can offer more in that genre.</p>
