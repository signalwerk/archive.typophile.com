    <p>Hi everyone...</p>
    <p>I have a question, and sorry, it's not really a small one. I shall number them, I guess different people might know one or two, so quoting a number might be the best thing to do. </p>
    <p>For a design-research on typo used in fashion magazines, Im looking for the actual typefaces (or perhaps modified originals) of the following logos:</p>
    <p>(Many, many thanks in advance! Any help and tips really appreciated.)</p>
