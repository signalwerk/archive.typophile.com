    <p>http://images.google.ca/imgres?imgurl=http://bp2.blogger.com/_MybxAcUwkFI/SAcJ1-MymAI/AAAAAAAAAOs/J9gXe2IXFEg/s200/Ferrari%2BF2008%2BBahrain%2BGrand%2BPrix%2B(1).jpg&amp;imgrefurl=http://carnoise.blogspot.com/2008/04/no-marlboro-logo-on-ferrari-formula-one.html&amp;h=127&amp;w=200&amp;sz=6&amp;hl=en&amp;start=2&amp;tbnid=6tkgPzbsTJmxkM:&amp;tbnh=66&amp;tbnw=104&amp;prev=/images%3Fq%3Dmarlboro%2Blogo%2Band%2Bgrand%2Bprix%26gbv%3D2%26ndsp%3D18%26hl%3Den%26safe%3Doff%26sa%3DN</p>
    <p>Long short, Marlboro is no longer allowed to put their logo on the F1 car they used to put it on.</p>
    <p>Instead, they have what looks like a bar code, and I suspect it to be a subliminal add in which the “bar code stripes” correspond to the vertical strokes of the wordmark. When I saw this for the first time, approximately 2 minutes ago, my first instinct was “is that some sort of font/wordmark?” With Phillip Morris footing the bill I’m positive they have a team of psychologists on this job.</p>
    <p>I am currently trying to find a good shot of this bar code, yet I have also come across certain variations. Lhe link at the top of the page is the one I just saw. It also appears on the backs of the pit crew’s shirts &amp;c.</p>
    <p>Can anyone help crack this code?</p>
