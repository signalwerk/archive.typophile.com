    <p>Hello. Few years ago I designed a font (more than one in fact) in true type format and now I want to convert it to Type 1 and Open type. When I do the conversion I see that the font does not retain the quality of the original true type version. Is there a way to convert the font so the curves won’t be ’bumpy’? It ain’t very bad but this could be better. Thanks for the tips. Reg - I use FontLab 4.04</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/19012" class="topic-previous" title="Go to previous forum topic">‹ Is the Term “Pro” Adobe property or a defacto standard?</a> <a href="/node/19016" class="topic-next" title="Go to next forum topic">Mac bitmap ttf issues ›</a></div>
