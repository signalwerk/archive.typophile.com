      <p><em>Thanks Paul, that had escaped me. (Uau! What a conundrum just to get the right icon…)</em></p>
      <p>Personally, I think it’s all rather silly, as the dsig table is the singular element that determines whether this icon displays or not. For example: you could have a feature-rich TT-flavored OTF without a signature, which does not display the icon. or you could have a simple TT file with no special features that has been signed and DOES display the OT icon. I think this is all very silly and, obviously, confusing to users.</p>
