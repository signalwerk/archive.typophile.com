      <p>Truetype is cross-platform so I can’t see the advantage in conversion to T1. The only advantage is when saving to outlines in Illustrator for manipulation purposes, the T1 curves have fewer points.  Other than that, TT does a fine job all round and saves to opentype with no problem.<br>
      Miguel, I think FL-4.6 can output to either opentype format. The wording used to describe it all in FL5 is better though.<br>
      FOGs “Clean up Paths” does a better job of point reduction than FL-4.6 Optimize , IMHO.</p>
      <p>ChrisL</p>
