      <p>Yeah, plain Type1 is basically dead: <a href="http://blogs.adobe.com/typblography/2005/10/phasing_out_typ.html">Phasing out “PostScript” Type 1 fonts</a></p>
      <p>Does FL4.04 generate fonts in OpenType format? Version 4.6 will do OTF-CFF (PS-flavored), but not proper OpenType-TT. I believe you’ll need FLStudio5 for that.</p>
      <p>After converting quadratic B-splines (TT) to cubic Beziers (Type1) with FontLab – don’t forget to reverse the contours accordingly –, you could use FL’s <strong>Optimize</strong> operation to remove the superfluous nodes/points. (In FL4.6 it’s under Tools-&gt;Outline-&gt;Optimize) </p>
      <p>Here are a few excelent threads related with this topic:<br>
      <a href="http://typophile.com/node/16695">TrueType Versus Postscript</a><br>
      <a href="http://typophile.com/node/18821">Opentype PS vs Opentype TT</a><br>
      <a href="http://typophile.com/node/16838">Critiques of the OpenType format?</a></p>
