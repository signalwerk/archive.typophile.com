      <p>It’s a tricky conversion. If the font is hinted, you will lose the hints entirely. You _can_ mathematically convert quadratic Beziers (TT) to cubics (Type1/CFF) without loss, but you have to make sure not to integer quantize the resulting coords, and you’ll get about twice as many control points as strictly needed. I don’t know much about FontLab, and whether they’ve improved their spline math in recent years, but I do know that FontForge can be coaxed into doing this conversion reasonably well [the conversion in the other direction, though, from T1 to TT, sucks, as does the “simplify” tool for trying to reduce the number of control points].</p>
      <p>But why convert? TrueType outlines are even more native within OpenType than are Type1’s. Type1 is fast becoming a legacy format, so unless there’s a special need to support older systems, why not just release in OT with TT outlines?</p>
    html_clean: |-
