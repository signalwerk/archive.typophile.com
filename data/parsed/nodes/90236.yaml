    <p>Hello all,</p>
    <p>I have found many images online featuring anatomy of typefaces, but none of these show these terms when applied to numbers. I wasn't sure if the terminology was the same, or different for numbers, but I didn't want to start using words to describe features in numbers until I knew for sure. </p>
    <p>For instance, the number 4 sometimes has the diagonal section attached, and sometimes it is detached from the stem-like vertical on the right... But I don't know what the official terminology is for any of these things.</p>
    <p>Is there someone that could help me out? Any imagery would be really fantastic.</p>
    <p>Thanks!<br>
    -Matt</p>
