      <p>Right.</p>
      <p>Therefore, the two kinds of four are open and closed counter.</p>
      <p>The horizontal stroke at the baseline of sans serif “one”s is a crossbar, not a serif.</p>
      <p>**</p>
      <p>However, there are no established terms to distinguish between oldstyle “one”s that have majuscule “I” configuration, and those which have minuscule “l” construction.</p>
      <p>There is also no term for the quite odd variant of oldstyle “zero” that is light in weight, circular and without contrast.</p>
      <p>And again, the variants of “three” — with the top half composed of either one curved or two straight strokes — have no special names.</p>
