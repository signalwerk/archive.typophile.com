    html: |-
      <p>In fact, there is jargon for the flat-topped form of three; it is a "banker's three", which I believe means that it was the preferred form in handwritten accountancy to distinguish it from a sloppy two. That said, "pointy three" and "rounded three" serve me fine and laymen understand them.</p>
      <p>I accept that the serif-analogues on "I" and "1" in sans faces are "bars", but not necessarily "crossbars". "J" can be capped with such a bar, and there are forms of "J" that also have an actual crossbar, in the middle. I've seen "barred I" before. If they need a specific name of their own, and I think they do, "endbars" could work.</p>
      <p>The (usually) sloped thing on the top of a "1", be it a serif or not, may be sensibly called a "beak" and so any form that has it would be "beaked".</p>
