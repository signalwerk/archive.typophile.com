    html: <p>That's Cartoon C by Howard Allen Trafton, 1936. It was the lighter version of a font seen often in modern days, <a href="http://www.ascenderfonts.com/font/cartoon.aspx" target="_blank" rel="nofollow">Cartoon</a> Bold C. I know of no digital version of the lighter variant you seek.</p>
