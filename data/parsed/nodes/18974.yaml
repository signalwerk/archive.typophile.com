  html: <p>Today on CBS' show Sunday Morning they had a segment on Tiny Books. These books were incredible. Some of them were absolutely tiny I mean the size of finger tips. Now as I sat there in amazement I was wondering are there fonts specifically created for these books? Are there tiny font designers out there?</p>
