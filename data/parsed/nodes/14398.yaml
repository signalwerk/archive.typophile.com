    html: <p>I had been interested in letterforms for ages (alternating writing with a Rapidograph and with an Osmiroid pen through high school), but only became fixated on typography when in about 1980 I began working for a computer graphics start-up in Pittsburgh. I spent the better part of a summer editing bitmaps of Cheltenham Bold 24, trying to simulate kerning, trying to guess how different degrees of magnificaiton and different color schemes would affect the appearance of the face. It was maddening, addictive, and dangerous; I know enough to be annoying both to people who know nothing about typography, and also to people who actually know a plausible amount.</p>
