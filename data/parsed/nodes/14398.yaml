      <p>I too, first became interested in <em>letters</em> as a kid when I found an old Speedball instructional lettering book in my grandparents attic. I studied it and was fascinated by all the different styles and moods letters could invoke. I remember designing a report cover in 5th grade in a Speedball poster lettering style that I thought captured the feel of the Vikings. I was so much more enthused about the report cover than the report itself. And, of course, I had to teach myself <em>Old English</em>. </p>
      <p>I later became interested in <em>type</em> when I was studying Graphic Design in college. I think I had an epiphany in my first typography class—that the basic units of graphic communication are letters. And what could be a more pure form of graphic design than the design of the type itself? I think from that point on I was hooked.</p>
    html_clean: |-
