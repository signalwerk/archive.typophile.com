      <p>I recall being aware of type when I was learning to read in first grade. I remember noticing the "fi" ligatures in the reading primers. They also had large letters accompanied by pictures (e.g., Ss with a picture of a snake) hanging on the classroom wall and I remember staring at the typographic forms, not really wondering about how they were made, just being fascinated by the shapes and how perfect they looked. It was probably Century Schoolbook if my memory is reliable. </p>
      <p>Throughout my childhood I was vaguely aware of type, though my interests were elsewhere (cartooning especially). I remember noticing the Latin Wide type they used in <em>Mad</em> magazine. It was easy to imitate, with those big triangular serifs, and I doodled words in that style all over my note books when I was about 10. From then on I became increasingly aware of type and lettering and began doing a lot on my own, trying to draw letters correctly, the way they looked in type. I still have a hand drawn copy of a headline from the Hertz "We Try Harder" campaign that I did in 8th grade (Perpetua Bold, though I didn't know it at the time).</p>
      <p>I was also influenced by two uncles, one on each side of my family. One was an artist who also did sign painting and cartooning. The other was going to art school when I was a kid and became a graphic designer. From him I learned about Helvetica and <em>serious</em> graphic design. Like many others, the Speedball book was a factor. I was a big user of rub-down type starting in high school. My dad was friends with the guy who did all the in-house graphics stuff were he worked, so there was some influence there, too. He gave me an Alphabet Innovations specimen book which had a big impact on me. </p>
      <p>The clincher was seeing an early issue of U&amp;lc. in 1974 when I was taking graphics courses in college. All the pieces just fell into place and I decided then and there that someday, somehow, I wanted to design typefaces.</p>
