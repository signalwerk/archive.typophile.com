    html: <p>In school - 9th through 12th grade - I took letterpress and photography instruction with Mr. John Thompson at Albany High School in Albany, California. The shop consisted of a proof press, 2 large motorized C&amp;Ps, lots of wood and metal type, a linotype and a few ABDick offset presses, plus a very well-equipped school photo and graphic arts darkroom. In the "library" room were a first generation mac and an ENORMOUS collection of U&amp;LCs and years worth of Communication Arts back issues. I read every single one of them. Since then the scents of blanket wash, fixer, ink and lead have been my favorite smells (after bacon, maybe).</p>
