      <p>What a great thread. </p>
      <p>I had been printing for about six months and was scouring the libraries for anything on printing, typography, fine press books. . . and one day I found a book on the shelf that was a Random House publication of one of Poe's poems. The format looked odd so I must have been drawn to it. The first line was "the demon put his hand on the little boy's head." At least that is what I remember. It was in Preissig Antiqua. That was the first time I understood the power of letterforms.</p>
      <p>I discovered Preissig did a number of letterpress books for Random House and, interestingly enough, in hunting down some reviews of these books, I discovered the Anglo-American typographic community was outraged by the typeface. Which, of course, made it even more dear.</p>
      <p>Gerald</p>
