      <p>If you all are interested in hearing the experiences of a non-profi: There were two things that made my typophilia inevitable.</p>
      <p>One was the layout of MIT Press's philosophy and political/social theory books that I encountered in graduate school. MIT used and still uses Baskerville--first MT, I think, and now ITC New--to excellent effect, despite the criticisms I have heard especially of the latter digitization. The first fonts I ever bought licenses for (it's how I discovered MyFonts) were faces of ITC New Baskerville.</p>
      <p>The other was the New Left Review's redesign in 2000. The updated design combined Majoor's Scala and Scala Sans. The look of the journal kept me subscribing long after I realized that the content had become shrill and obscurantist, and I spent money I should have been saving to get me out of my crappy position buying a few of those licenses. (Thanks to FSI's keywording project I now have the complete array.) How deeply did I fall in love with those fonts? I recently used InDesign to create a template for my course syllabi just like that of the NLR. Those Scala 7s still draw my eye, every time.</p>
