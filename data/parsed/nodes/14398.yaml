      <p>Most of the foundation for my type fixation was constructed unconsciously: I wasn't aware of type per se through most of it. My mother taught me some basic calligraphy (Johnston's foundational hand) when I was struggling with handwriting at a child -- I still struggle with handwriting and my calligraphy is slow and plodding, but I imbued some basic idea that letters can be made in a variety of ways. After university, I worked in the antiquarian book trade for a few years, and this was my real introduction to type, although I still wasn't consciously thinking about type in itself as an interest. I remember very clearly the title page of a Bodoni works of Cicero that I stumbled across in the shop, and being aware that this was something unusual and splendid. I also remember looking at a first edition of Wordsworth's _Preludes_, and this came to mind later and helped me understand the connection between romantic typography and romanticism in the other arts.</p>
      <p>It was only later, meeting Gerald Giampa who was then based in Vancouver, that the bits and pieces of this unconscious typographic background fell into place. Then I was hooked.</p>
