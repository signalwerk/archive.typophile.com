      <p>Somewhere between fifth and sixth grade I got tired of using stencils to title coversheets on my book reports and started to draw letters freehand.</p>
      <p>By the seventh grade we had options for "shop" class, so I selected Printing. The Junior High had an old platen letterpress machine in the basement and a decent assortment of metal type in California job cases. My first project was a business card, and the first type font I used was Kaufmann Bold.</p>
