      <p>"So, did you ever figure a way to have the marketing guys do a meeting with the Lions?" </p>
      <p>Yeah sure! This eventually evolved and Fred Ebrahimi of Quark taught me the modern method: Every few months, he'd wander through that department firing 25-30% of the staff, waiting to see if it had any effect on marketing, and then either firing more, or hiring a few back. But back in the really old days, when "fired" had a different meaning all together, the lions were still happy in the end if you used the right amount of salt and cheese, and absolutely no pepper (the Philly cheese steak, after all, was named after Phillip of Macedon who had way too many marketing people and lions...), but that's a whole 'nother age of my type history.</p>
