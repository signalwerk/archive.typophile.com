      <p>So there was my Uncle Ben, at the peak of his career, Editor of the San Francisco Chronicle. Being curious about everything and full of energy, he wanted to understand the presses. So he went down to the press room. The press men sent him packing: "You can't touch the presses, you aren't Union." </p>
      <p>So, unstoppable that he was, he bought his own small printing press to learn about printing. Fair enough to say he fell in love with everything to do with printing. Meanwhile the Chronicle changed owners in a corporate upheaval and put in a new editor. So Uncle Ben went over to the 'dark side' and went into public relations. But his passion for everything to do with printing just increased. </p>
      <p>He founded his own 'Myriade' press, leading the private press movement in the New York area. He wrote 'Types of Typefaces'--a superb book--and 'Printing as a Hobby', and tried to spread printing and paper making in poor countries. And he founded the American Printing Historical Society, whose annual lecture is named after him. He also bought and installed in his house the Kelmscott press, on which William Morris had printed his famous 'Chaucer'. He was in the process of printing (on another press) the first edition of Mac McGrews 'American Metal Typefaces' when he died.</p>
      <p>Married to my Mother's sister, he talked my Dad into taking up printing as a hobby, printing the stationary for his dental office. And I ended up helping him do it, and printing stuff for myself just for fun. That was fun, but the most fascinating thing to me was typefaces. So I kept on looking at type for the next thirty years (ok forty, but who's counting), calling out 'Baskerville' and 'Optima' at odd moments, and getting extremely strange looks from everyone, including my family. </p>
      <p>Then I discovered 'Typophile'.</p>
      <p>Oh-oh.</p>
