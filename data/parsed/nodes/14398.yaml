      <p>For me, it was Matthew Carter's Galliard. I was working on a literary magazine with a professor back in school. We were looking for a type to use in redesigning his magazine, and we both loved Galliard as soon as we saw it.</p>
      <p>Later, when I worked for the university press at the same school, designing and editing books, I introduced them to Galliard as well, and by that time we could get the Carter &amp; Cone version with all the extras and alternates. It immediately became one of our standard faces.</p>
