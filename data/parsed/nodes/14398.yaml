    <p>I was just reading <a href="http://typophile.com/node/7596" rel="nofollow">another thread</a> where someone mentioned that their interest in typography began with a particular cover of a book.  This got me thinking about where my own (though relatively recent) type fixation came from and why i now spend far too many hours reading typophile posts..</p>
    <p>So as a bit of a friday afternoon diversion, would anyone be interested in posting about the incidents, specimens, book covers, articles etcetera that kicked off their own obsession?</p>
    <p>i'll go first, i suppose -- strangely enough it was a note about the type at the end of tim burton's twisted illustrated book of poems "The Melancholy Death of Oyster Boy" which was set in Goudy's <a href="http://www.fonts.com/findfonts/detail.htm?pid=261386" rel="nofollow">Scripps College Oldstyle</a>.  It said that Goudy himself had remarked that the type was without any 'freakish characteristics' which i thought played off of the mildly disturbing poetry brilliantly.  It also made me sit up and think "hey wait a sec.. that font didn't come with my computer.."</p>
