      <p>This is long, print it if you like.</p>
      <p>It was a hot dusty day and the sun hadn't risen yet. The camels were parked on the shadowed face of the dune taking in the last of their water before slobbering off to sleep. I had walked to the top of a dune to see if we'd been followed out the last dry river bed and the rest were making camp. We would pass the day inside our thickly carpeted tents, because it would be just too hot outside. Just then, as I looked back to the tents, a tumbling of sand colored shapes came sprinting out of the shadow of a dune beyond the camp from where I stood. A more dangerous threat could not have emerged as lions, two young males and a female, bore down on the camp. I cried out as loud as I could, but I was downwind and they couldn't hear my warnings. By the time I'd run back the lions had taken my wife who'd been gathering wood, and everyone was screaming and running around.</p>
      <p>I sprinted to Yaboodi's third horse, and jumped on, chasing the fiendish beasts over many dunes to a wooded grove around a spring. But by the time I arrived there was nothing left but my poor Ruthie's head, hair all knarled and twisted in sticks, dirt and blood that covered her whole face. As I bent down to gently cradle my love's head to my chest one last time, I felt the horse tug, looked up, dropped Ruthie's head and bracing the butt of my spear to my foot just in time I fixed my point in the hideous fanged mouth of the young lion as he leapt from the forest gloom. Down in the dust he went, groaning and choking in his own blood. Hearing a snort, I turned in time to see the horse crush the rib cage of the other male with a flying hind kick as the beast was leaping at my back. I beheaded the first kill and then neck speared the rib-wounded male while keeping my eye on the female I saw lurking off in the trees with the rest of  Ruthie. She ran further off when Yaboodi's brother Ot arrived with two others on drowsy but frightened camels. </p>
      <p>After we'd taken the lion heads and bodies and Ruthie's head back to camp, I sat down and started to cry and tear my hair out in our tent. In a while, Yaboodi's wife, Clu came in from Ruthie's ritual washing, which had taken only ten minutes, but she stopped almost at once so the tent flap fell back down on over her head. She said, "Wow what a good idea!", and  then backed out of the tent. I was too heartbroken to care and sat for a while longer before Ot came in and said Yaboodi was coming to see me. So, I straightened out my hair, stood up and rested one hand on the head of a young male lion and the other on my spear to greet my clan boss. After a suitable commotion outside, Yaboodi too came in and stopped short, his spearmen clattering into him from behind and the side causing ugly grunts and strained looks all around.  But then Yaboodi's gaze ran down to my chest where he stared and then muttered "Wow!" I then looked down and saw what appeared to be a distorted view of...Ruthie!</p>
      <p>Well, Yaboodi thought this was so cool he outfitted all his guys in Lion faced shirts, wouldn't let me make them for anyone else, and all I got out of it was the Ruthie shirt, which everyone loved but I couldn't copy. I spend my days editing the hunting of lions down to the best faces, and making lots of copies. But then I convinced Yaboodi to let me make a monkey face for his jester, and that went over so well everyone wanted them for their kids, and for parties. Then, Yaboodi died in a game of "spite your face" with neighbor boss, Nose. Nose's real name was not Nose, but everyone called him that because he had no nose. Anyway, Yaboodi  was just barely dead with a knife in his nose when we had to offer out allegiance to Nose, Ot and all. </p>
      <p>Nose loved the faces and soon I was making two, three and four-lion face shirts for him and his guys. Then one fine spring day Nose gave me his daughter Claire to replace Ruthie finally. Claire was named for the fact that her face was smoother than everyone else's and was clever enough to figure out you could print a face without dying in your own blood. So she made an unauthorized shirt of her own Claire face with goat blood. This caused great consternation in the village and eventually Nose found out and wanted one of his own face. Well, it was pretty much the first grotesque I'd made, 'cause without a nose, the eyes and mouth are too clear. But nose didn't care as it looked a lot like him and scared everyone even when the shirt was drying on the line. </p>
      <p>In my later years Nose killed an Egyptian near the river, so I got to make one of those, and that's when I became more interested again. But soon, I became disenchanted with the whole bloody process and started thinking about simpler, less stressful ways of making good faces. One day, washed up on the shore of a land Ot was governing for Nose, they found a Thin Roman, and a matching Italic. I would have handed the business on then, but we also found a barrel of black liquid; sticky, but impervious to water, and never faded or changed colors like blood. Well, then I was totally hooked and I wanted to do every single face in the world but I was very old then. This is also the point at which the PR  and marketing departments stepped in and said my bio cannot be comprised completely of experiences gained by consultations with a neo-pagan, blood-type advisers, and contacts with the netherworld via spells. They insist on bio material that can be verified by "normal" means, so the rest of the story is on our web site in my bio. But it's boring.</p>
    html_clean: |-
