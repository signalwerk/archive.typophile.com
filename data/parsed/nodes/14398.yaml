      <p>I think I was always interested in type on some level, being a nerdy child who spent much of his childhood buried in dictionaries, encyclopedias, and other typographically complex books. Long before I was able to name typefaces on sight, I was able to tell that different typefaces gave texts different feels, and I thought that was important, even though I couldn't really say why.</p>
      <p>My mom spent a lot of time editing newsletters when I was a kid, and so I got a pretty good feel for 70s-80s era DiY design: typewriters, transfer lettering, pasteup. I spent hours with our first dot matrix printer trying to get it to do interesting things with its built-in typefaces (just getting them all to work felt like an achievement), and then when WordPerfect 5.0 came out for the PC, I spent forever playing with its WYSIWYG tools, eventually getting incredibly frustrated by how hokey the whole thing was. What I really wanted was a Mac, because my school had just gotten some, and I'd spent a lot of time tweaking font bitmaps (and doing lots of other things) with ResEdit. ResEdit helped me figure out that I could make pretty things without programming</p>
      <p>Around then, my mom got a copy of one of the early low-end WYSIWYG desktop-layout packages (PFS: First Publisher ring any bells for anyone?), and I went to town. I wrote a book of poems to impress a girl (didn't work) and I think I used every single font it offered, at least twice (I don't know which is more embarrassing -- the spectacularly awful poetry or the over the top "design"). Shortly thereafter I got internships at a software company (designing presentations for one of the trainers) and a comic book company (helping set up their digital prepress and doing production design), so I got exposed to a pretty broad set of skills, from the old-school (stat cameras) to the cutting edge (high-end Agfa RIPs, Illustrator 88 / PhotoShop 1.0).</p>
      <p>Then, in college, I had several radio shows, and produced what I think is still my best design work, to promote a series of show that ran at 2 in the morning and only drunk frat brothers and lonely high school misanthropes ever heard. Excellent! Somewhere around here I decided that there was probably more to life than Futura and Optima, and started getting more anal about dealing with my type collection.</p>
      <p>I became a rave promoter a little later, and was determined to not repeat the same mistakes that every rave promoter since the dawn of time has made in designing flyers (they all seemed to end up looking like technicolor yawns, which is probably appropriate that there were DJ names like "Psychoactive Frog" and "Rumpleforeskin" all over them -- one of those is an actual DJ name, and I'll allow you all the pleasure of deciding which). Despite the fact that my flyers were relatively tasteful and restrained, people still showed up to my parties. Perhaps it was because I was living in a small city and had a captive audience.</p>
      <p>I also got seriously into TeX and LaTeX, mostly just because they're a tweaker's paradise, but was seriously frustrated with what I saw as TeX's piss-poor support for type (I spent some time dallying with Metafont, but that was seriously ridiculous).</p>
      <p>Since 1995, I've been working in web design and software development, which means I've been exposed to a lot of crappy type and hideously unreadable interface design, but I've lived in San Francisco, one of the most design-savvy cities in the world. Type has been an important but peripheral part of my life for a long time, but it's only in the recent past that it's started becoming more central, to the point that now I'm going through the process of sweating blood trying to learn how to design typefaces. I'll keep you all up to date on how that goes (so far: very slowly).</p>
    html_clean: |-
