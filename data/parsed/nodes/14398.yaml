      <p>I also had a big interest in cartooning growing up. Because I loved to draw, I was asked in high school to make several flyers and t-shirt designs. Although then it wasn't apparent, I always had an interest in experimenting with different styles of lettering. </p>
      <p>It wasn't until I entered the graduate design program at Pratt where I really made the connection of typography to my illustration. I started understanding letterforms and from there I was able to polish my lettering a bit more, often making my own typography for design projects. My Thesis project (as its been mentioned many times by now) where I sat down and actually made my first set of typefaces completely sealed the deal for me. I'm now obsessed for life.</p>
