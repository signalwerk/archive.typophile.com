      <p>I thought of another "event" when I was a student.  I was working in a darkroom and to test dmin and dmax, I took a discarded piece of a lith neg from typesetting and haphazardly put it in the enlarger. I projected it down on to the easel and exposed a scrap of paper.  When watching it come up in the developer tray, I noticed the power of the extremely enlarged letterforms bleeding off and cut off at random angles.  The form and counterform was more powerful than any Motherwell I had ever seen.  I then started superimposing type negs and double exposing others. The power of the letterforms shown through the visual beating I had given it and came out even stronger.  I was starting to learn to "see".</p>
      <p>ChrisL</p>
