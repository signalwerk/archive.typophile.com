    html: <p>Thanks for that info, Herb. I remember when Disney's WWoS got the ESPN makeover a few years back, a lot of the signage, etc. changed from <a class="freelinking external" href="http://myfonts.us/BWNdSo" rel="nofollow">City</a> to this new font, and I wondered if it was related to ESPN. <a class="freelinking external" href="http://cubanica.com/portfolio/epsn/" rel="nofollow">Playoff</a> (which apparently does have a serif version) certainly seems to match the more recent branding.</p>
