    html: |-
      <p>The logo as seen in Justin's link appears to be a unique design, with no associated independent typeface. The characters themselves look like a serif version of Playoff, an ESPN proprietary font family developed by Pablo Medina. They're similar (but not the same) as in the Disney World signage for "Disney's Wide World of Sports"<br>
        - Herb</p>
