      <p>Russell, I purchased this book back in the mid-90s, for my first book design project, and it was very helpful. Even though some of the information in the book might be considered outdated nowadays, the chapters on book design, the parts of a book, paper, lettering, calligraphy, and printing are all useful. And I, for one, think that even the “outdated” parts are still useful, the same way that I find it useful to know where terms like <a href="/wiki/leading" class="wiki">leading</a> come from.</p>
      <p>[EDIT] P.S.: Bear in mind that the book’s author, Ruari McLean, was British, so you’ll encounter terms like “jobbing” throughout the text.</p>
    html_clean: |-
