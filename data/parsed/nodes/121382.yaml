      <p>Almost impossible to match based on such a small sample and only three letters.</p>
      <p>If the rough/distressed vibe I’m getting from it isn’t an illusion, then Dirty Headline might work:<br>
      <a href="http://www.dafont.com/dirty-headline.font?text=SKY" title="http://www.dafont.com/dirty-headline.font?text=SKY">http://www.dafont.com/dirty-headline.font?text=SKY</a></p>
      <p>If you are looking for something cleaner, Gothic No. 13 comes close:<br>
      <a href="http://www.myfonts.com/fonts/bitstream/gothic-no-13/" title="http://www.myfonts.com/fonts/bitstream/gothic-no-13/">http://www.myfonts.com/fonts/bitstream/gothic-no-13/</a></p>
