    html: |-
      <p>It’s too generic. It could be for a design firm anywhere in the world.</p>
      <p>Also, the ratio between the icon and the logotype is out of proportion. The icon is way too large.</p>
      <p>I don’t think the color treatment will translate into black &amp; white. Remember, a logo needs to work in all forms of media, including newsprint and fax.</p>
      <p>Work on some more concepts and also provide a little more background information on what you want to achieve. That will help us give better crits.</p>
