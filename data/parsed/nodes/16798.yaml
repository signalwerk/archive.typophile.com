    <p>I am working on this logo for a new organization that wants to bring—promote— design to business people in Belgium.<br>
    I want to make a logo that can be used as patterns or blown up big and remain abstract. Any suggestions for improvements?</p>
    <p>—the typeface is Avenir 85 Heavy</p>
    <p>Thanks</p>
