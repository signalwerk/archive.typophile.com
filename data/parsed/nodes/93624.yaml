    <p>I would like to get an ID on the fonts and symbols used in this fragment of newsprint.</p>
    <p>This ID is with a view to dating the fragment.</p>
    <p>I know it is beyond the scope of this site, but I would also welcome any suggestions about what it all means!</p>
    <p>Age is unknown, but it was found in Australia.</p>
