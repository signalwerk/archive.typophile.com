      <p>1) nothing to do with OpenType per se, although OpenType certainly has functionality helpful in supporting vertical text.</p>
      <p>2) If you want Latin vowels to turn into diacritics, that would take some thought. Probably.</p>
      <p>3) Yes, and it’s quite easy.</p>
      <p>4) Not exactly. You could simulate these half-decently with contextual functionality, though.</p>
      <p>5) That would definitely be a function of the typesetting tool.</p>
      <p>6) Not quite sure what that means, but probably not, if I’m guessing right.</p>
      <p>So, your second and fourth items would be tricky.</p>
