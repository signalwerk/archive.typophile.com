    <p>I’m interested in creating a typeface for the <a class="freelinking-external" href="http://www.omniglot.com/writing/vine.htm">Vine alphabet</a>, if only because it creates such an appealing look.  (Also, since I’m not enlightened in traditional type, I suppose critiques on experiments will be less deriding. ;)  However, it’s a very peculiar script, and I’m not familiar with all of the capabilities of OpenType, so I’d like to know if the following things, among others, are possible, and in what circumstances:</p>
    <ul>
    <li>Vertical text in left-to-right columns</li>
    <li>Vowels as diacritics (or maybe just fancy kerning)</li>
    <li>Arbitrary ligatures, e.g. ’zz’, ’sc’, ’pph’</li>
    <li>Marking the start of a line/sentence (or maybe just captials)</li>
    <li>Forcing line break at end of sentence</li>
    <li>Continuing hypenation on a new line</li>
    </ul>
    <p>If too many of these capabilities end up to be dependent on the typesetting tool rather than OpenType, I may just turn this into an SVG/EMCA script.  Thanks for any tips in advance.</p>
    <p>EDIT: attached the graphical description of the alphabet.<br>
    </p><div class="imageWrap"><img src="/files/vine_3871.gif"></div><p></p>
