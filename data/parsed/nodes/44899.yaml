      <p>One thing to keep in mind is that classical Mongolian descends from the Arabic abjad, but written from top to bottom instead of left to right. You’re going to have to deal with many things that cause problems in Arabic design, so if you find no explanations for classical Mongolian (not surprising, there’s not much computer support yet), look to what’s been done for Arabic.</p>
      <p>Your requirement for split hyphenation, where a hyphen appears on both the end of one line and the beginning of another, will be a typesetting problem and not easily solvable through OpenType. I think the old German orthography problem of duplicating a letter on the following line (e.g. »Schiff-/fahrt« for »Schiffahrt«) is basically similar. Marking the start of a line or sentence is also better done in typesetting, since it will often need to be adjusted by hand. Fighting with a font’s automatic behavior is a losing battle.</p>
      <p>Don’t let any of this dissuade you from trying to make the font work rather than going with SVG or something. You can do most of what you want in OpenType, and having done so you’ll end up with many more intellectual rewards. The result will also have a much broader potential audience.</p>
