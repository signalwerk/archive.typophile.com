      <p>Thomas,</p>
      <p>Thanks for the background information; however, the original post raised the concern that, in Illustrator, fonts "seem to look thinner than they really are, especially when you are zoomed out," which I suspect is due to smooth anti-aliasing being the default setting. The "fix" I proposed was simply for soft proofing: in my experience, converting the type to outlines <em>momentarily</em> gives them an appearance more in line with how they will appear in the final, printed piece (note the reference to UNDO).</p>
      <p>Also, once Photoshop rasterizes type, I suspect that an engine different from Cool Type renders the image, eliminating the latter's softening/thinning effect.</p>
