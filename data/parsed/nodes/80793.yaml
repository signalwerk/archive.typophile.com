      <p>Nick, if you're correct it still is an anti-aliasing issue. I'm fully prepared to believe that high-speed text rendering is done with another drawing engine different from the "main" drawing program -- but they both ought to be antialiased.</p>
      <p>See Acrobat for a case in point; the type and 'lines' drawing engines yield very different results for a small font when rendered as text or as outlines.</p>
      <p>Even with different rendering engines, I stand by my point any screen rendering issue is primarily a <em>screen rendering issue</em>.</p>
