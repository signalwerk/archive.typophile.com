      <p>&gt; They seem to look thinner than they really are,<br>
      &gt; especially when you are zoomed out</p>
      <p>The image on your monitor is only a simulation of how it will look when printed. You need to print the page(s) using a good-quality printer to see more exactly how the fonts actually look when printed.</p>
      <p>&gt; I've been told I should use InDesign, but it doesn't<br>
      &gt; have all the design tools I want/need.</p>
      <p>I don't know what you're designing, but normally you'd use InDesign to lay out the pages, and if you needed to create vector artwork you'd make it using Illustrator and then import that graphic into your InDesign layout.</p>
