    html: |-
      <p>“ Photoshop has different anti-alias settings because Photoshop rasterizes the type--the functional equivalent of converting the font to outlines in Illustrator”</p>
      <p>My understanding of this is a bit different than yours, I think.</p>
      <p>Photoshop has different (more) anti-alias settings because it chooses to do so. The underlying text rendering is the same between Photoshop, Illustrator and InDesign: all three apps use Adobe’s CoolType font engine. The other apps have the exact same anti-aliasing options available to them, and could expose them to end users if they wished.</p>
      <p>CoolType rasterizes the type in order to display it on screen. The type must be rasterized because the screen uses pixels, not vectors; ALL type you see on a computer screen must first be rasterized. To the best of my knowledge, Photoshop does not do anything that is the equivalent to converting the font to outlines in Illustrator, and in any case, that would yield different (and arguably worse) results, because of the loss of hinting information prior to rasterization. This is exactly why it is often a bad idea to convert text to outlines prior to making a PDF.</p>
      <p>The difference in rendering of text converted to outlines results from two effects:</p>
      <p>1) Hinting information is lost. This results in more irregular and arguably simply worse rendering.</p>
      <p>2) A completely different set of code is used for rasterization, as the outlines are rendered as graphics rather than text. At small to medium sizes this results in bolder text. It can also result in some unfortunate side effects as for example in PDF Acrobat tries to beef up thin straight lines, which can affect letters such as el and eye in sans serif typefaces, making them heavier than the letters around them....</p>
      <p>Cheers,</p>
      <p>T</p>
