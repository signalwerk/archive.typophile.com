      <p>“fonts "seem to look thinner than they really are, especially when you are zoomed out," which I suspect is due to smooth anti-aliasing being the default setting.”</p>
      <p>At small to medium sizes, switching rendering from font-based to graphics results in the text getting significantly heavier. The main reason is that font-based rendering only turns on a pixel if the center of the pixel is within the outline, while graphics rendering turns on the pixel if any part of it is touched by the outline.</p>
      <p>“Also, once Photoshop rasterizes type, I suspect that an engine different from Cool Type renders the image”</p>
      <p>Of course, if the text has been permanently converted to pixels, then it later becomes a graphics engine displaying it... but the pattern of pixels is still one that was laid down by CoolType.</p>
      <p>Cheers,</p>
      <p>T</p>
