      <p>Further to my earlier comments, I had some email with the lead engineer responsible for the actual font rasterizer part of CoolType. We'll call him Dave, mostly because that's his name. (There used to be two such engineers, but the other insanely senior guy, Terry, got laid off a couple of years ago and now works for Google.)</p>
      <p>I asked: “Is there one of the four anti-aliasing settings in Photoshop that will get text rendering that is the same as what InDesign and Illustrator users see? If so, which one?”</p>
      <p>Dave's reply below, with some comments interspersed from me....</p>
      <p>[Edited on Apr 8 based on further research/discussion.]</p>
      <blockquote><p>There’s not a simple answer. Each of our applications have historically done its own thing regarding anti-aliasing. (This is gradually improving.)</p>
      <p>I don't have InDesign installed to check, but I think I remember that it uses the same modes as Acrobat, including both Gray and Color DDR with linear blending.</p></blockquote>
      <p>DDR is short for “device-dependent rendering,” and Color DDR is LCD-enhanced sub-pixel rendering, roughly equivalent to ClearType. You only see this last in two places: Acrobat, and InDesign’s story editor. Both have Color DDR by default, but can turn it off. A pity it doesn’t see broader use, because it is really quite fabulous IMO.</p>
      <p>When first introduced in Acrobat this Color DDR was called “CoolType” (misleading as heck, given that was the name of the entire library that did all forms of text rendering going back many years earlier), but now it is just labeled as the option to “smooth text” “for laptop/LCD screens” in Acrobat prefs, or “LCD optimized” anti-aliasing in InDesign story editor prefs.</p>
      <blockquote><p>At one point Illustrator was doing their own downsampling, but now it looks like they're using gray DDR with some kind of linear blending gamma (I don't know what value).</p>
      <p>Photoshop "Sharp" mode is using Gray DDR. By default, there is no linear blending. But if you're willing to set a blending gamma for the entire document (not just the text layers), you can do so in the "Color Settings" dialog. Blend using a gamma of 1.22 should match Acrobat [in Gray DDR mode only, not Acrobat’s default text rendering].</p></blockquote>
      <p>All this just goes to show how complicated all this is; the applications have a lot more virtual “knobs” to twiddle compare to what is exposed to end users, and choices like the blending gamma affect what the user gets. Even though the same underlying text rendering engine is used across Adobe apps, with default settings you pretty much never get identical text rendering in normal use, because they have not coordinated their approaches.</p>
      <p>Cheers,</p>
      <p>T</p>
