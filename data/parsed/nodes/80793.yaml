    <p>I tried searching for this, but had no luck, so sorry if it's been covered.</p>
    <p>I noticed in illustrator there are some weird anti-aliasing issues. I don't seem to get this in raster programs like Photoshop, the font look a lot better. They seem to look thinner than they really are, especially when you are zoomed out, but only in illustrator. are there any suggestions or tips you have for designing with fonts in illustrator? I've been told I should use InDesign, but it doesn't have all the design tools I want/need.</p>
