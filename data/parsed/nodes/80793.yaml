      <p><em>old nick, is there any other way to do this? would be nice to seen the font right away for quick changes.</em></p>
      <p>In my experience, no, there isn't another way to do this; however, thanks to CMD/CTRL+Z, the outlining can be easily undone, so changes aren't a problem. And, yes, Photoshop has different anti-alias settings because Photoshop rasterizes the type--the functional equivalent of converting the font to outlines in Illustrator, but with a great degree of user control over the finished output.</p>
