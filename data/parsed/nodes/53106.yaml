  html: |-
    <p>hey people.<br>
    i made a small movie clip,<br>
    calling for a moment of silence,<br>
    dedicated to the dual casualties of the<br>
    current war between israel and palestine.</p>
    <p>i created the calligraphy based on the "wilhelm klingspor gotisch" font,<br>
    with my own hebrewed version to it, adding slight hebrew serifs called "Okatsim".<br>
    i used a red calligraphy ink ("Winsor &amp; Newton") on a smooth surface paper (although the movie has low quality, so the nuances are lost).</p>
    <p>i would be glad to show better resolution scans of the calligraphy if you want to.</p>
    <p>link: 	<a href="http://www.flickr.com/photos/yaronimus/3158371740/" rel="nofollow">link to the movieclip.</a></p>
