      <p>Nick, when I was talking about ‘large’ type, I meant larger than text sizes, what we might call display type, but also some sizes of e.g. subheads. As I acknowledged in my response to David, there are good reasons for reducing the x-height and tightening the spacing of lighter, more elegant styles of letters so that they work well alongside smaller type of the same style. But these are design decisions that are subsequent to particular styles of typography, not to the size of the type per se. But when we are dealing with small type, but which I mean typical text sizes and smaller, then we are making design decisions that are not subsequent to particular styles of typography but to fundamentals of legibility and readability.</p>
      <p>To put it another way: 6pt type needs to have certain characteristics in order to be legible and readable; 36pt type can have virtually any common type characteristics and still be legible and readable. So the factors determining the design for type at 36pt are predominantly aesthetic, and insofar as they are functional they are so within the aesthetic framework of particular typographic styles and systems.</p>
