      <p>David L, you're looking at the FontChameleon retail product. It's an amusing toy, but not very interesting (to me, anyway) for developing new fonts. I don't see much use in starting out with something that's 70% Bodoni and 30% Palatino, either.</p>
      <p>But I was thinking about the ChamEdit application, that was used by FB and others to create the "descriptor" files (a.k.a. Chameleon fonts). Although I never completed a typeface with it, I did get pretty far along in that direction while reviewing the newly-written documentation.</p>
      <p>I was thinking that for prototyping a brand new design, from scratch, the ChamEdit app would be pretty handy. I'd have loved to use it that way. Instead of using it to duplicate an existing font, you'd be using it to develop a new one. Heck, if I'd been on a Mac, I probably would have used it for the early stages of Hypatia Sans development. No programmer required.  :)</p>
      <p>Of course, I would have run up against limitations of the master font pretty quickly, just in terms of it not supporting Greek, Cyrillic, and some of the extended Latin I was doing. But other than that, it seems like a reasonably workable approach to start.</p>
      <p>I do wonder if it might interact poorly with trying to do a real multiple master or Superpolator approach, though. Hmmm.</p>
      <p>Cheers,</p>
      <p>T</p>
