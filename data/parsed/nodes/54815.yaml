      <p>I'm not that fond of strokes either. You have to encode a lot of extra information into the weight modulation, and then (to my eye, anyway), joins and corners never look exactly right. There are some technical advantages (they're easier to hint than outlines), but I don't think that outweighs their drawbacks.</p>
      <p>In particular, I don't think they're that much better suited to optical scaling than outlines. Yes, it's easy to just crank up the pen nib, but for outlines, you can accomplish pretty much the same by adding a stroke outline - and that's historically accurate to what ATF did (not forgetting to also pay attention to spacing, width, and vertical proportions).</p>
      <p><a href="http://www.kalliculator.com/">Kalliculator</a> is of course interesting, and I'm pretty sure there are some compressed CJK fonts for mobile applications based on strokes, but I'm happy to stick with outlines even into the Star Trek future. I just want them to be spiro curves instead of Beziers :)</p>
