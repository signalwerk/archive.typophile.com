      <p>David: <em>Obviously there are fewer choices in smaller sizes because of their aesthetic preconceptions of those wee spaces, and obviously there are more choices in larger sizes because of their aesthetic preconceptions of those less wee spaces. But it is a single spectrum of variables, aesthetics and economies for all readers.</em></p>
      <p>At this point, I think we're just looking at the same thing in two different ways. To me, variables are only significant if they are ‘in play’, so when you talk about fewer or more ‘choices’ being available at smaller or larger sizes, that to me means simply fewer or more variables being in play. As an example, let's consider x-height as a variable: x-height is a variable that can be taller or shorter. A 6pt type needs an x-height of a minimum size relative to the em, below which it cannot function; at the same time, it can't get so large that it diminishes the significance and effectiveness of the ascenders. So the x-height variable in 6pt type is severely constrained and, in effect out of play. 72pt type, on the other hand, might have a tiny x-height or a relatively huge one, depending on style, intended use, etc., so x-height is a variable that is in full play in 72pt type. You think about this in terms of fewer or more choices at different sizes; I think about it in terms of few or more variables being in play. Ultimately, we probably mean something pretty similar, but have found it useful to think about it in different ways.</p>
