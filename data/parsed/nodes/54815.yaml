      <p>Noam, </p>
      <p>Remember that ideally, different optical sizes might have different default linespacing values (looser for smaller sizes, tighter for large sizes). Also, if the stem thickness differs between the optical sizes, it would greatly complicate the hinting. And finally, OpenType fonts are limited to 65,535 glyphs per font — not a problem for European fonts but certainly a problem for Asian fonts. </p>
      <p>I think that having separate fonts for each optical size is reasonable. </p>
      <p>Adam</p>
