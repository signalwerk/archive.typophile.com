      <p>Thomas, </p>
      <p>this sounds like the Font Chameleon principle is not much different from TrueType Variations as implemented in Skia GX/AAT (the <a href="http://developer.apple.com/textfonts/TTRefMan/RM06/Chap6gvar.html">gvar</a> table), in which the variations are described using deltas of point coordinates, and which could be edited, AFAIR, using the GX Mutator tool. </p>
      <p>Unfortunately, I've never seen ChamEdit or GX Mutator "in action". I would like to, and I would happily talk with my colleagues at FontLab about possibilities to implement such an approach in our applications. </p>
      <p>Alternatively, people should have a look at Erik van Blokland's <a href="http://superpolator.com/">Superpolator</a> which implements a similar approach as the one which was used in TrueType Variations.</p>
