      <p><em>...how is this relationship useful? It’s not something that plays any role in good craft...</em></p>
      <p>It's important to work at the optimal optical sizes when combining optical weights.<br>
      For instance, if two fonts are designed to work optimally at 9 pt and 6 pt, if they are combined at 10 and 6, that won't look as good as 10 and 6.7. A deviation of one point from optimal size is not of itself particularly significant, but is much more noticeable in combination.</p>
