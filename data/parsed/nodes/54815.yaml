      <p>John you are a cleavin' a single issue in two with private semantics. Making type "attractive" let's say, in the most literal use of that word, whether large or small, is in a single set of variables up and down the size spectrum. Choice in these variables is informed, in the best case, by reaching for a proper aesthetic, executing with a proper economy, and for a given environment attached to the needs of that reader. </p>
      <p><em>Obviously</em> there are fewer choices in smaller sizes because of their aesthetic preconceptions of those wee spaces, and <em>obviously</em> there are more choices in larger sizes because of their aesthetic preconceptions of those less wee spaces. But it is a single spectrum of variables, aesthetics and economies for all readers.</p>
      <p>When I said that those big thick clunky Sans were the optically sized version of text serif, I was informed by historical fact and by practice. Why John is cleaving a single issue into two parts with semantics <em>may</em> only be answered, later.</p>
      <p>Nick: "There is no reason that there can’t be several “readable” text versions..."<br>
      That's for sure. </p>
      <p>&gt; So as David says...<br>
      Really?<br>
      &gt;I think he said that’s one of the constraints.<br>
      Really.</p>
      <p>John: "Nick, in the Latin script, ascender and descender length is pretty flexible regardless of the type size,..."<br>
      If you say so, but foot space and headspace are usually dictated rather strictly by the x-ht's proportion of the Em, making the rest not particularly flexible unless built-in leading is summoned, or the face is scaled on the body. If this is not a factor in the decisions that need to be made to make the letters readable at small sizes, I'm not sure what is. </p>
      <p>Cheers!</p>
