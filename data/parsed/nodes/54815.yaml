      <p>A good general description of how FontChameleon worked can be found in the prior art discussion of Agfa's font compression patent (<a href="http://patft.uspto.gov/netacgi/nph-Parser?Sect1=PTO2&amp;Sect2=HITOFF&amp;u=%2Fnetahtml%2FPTO%2Fsearch-adv.htm&amp;r=8&amp;f=G&amp;l=50&amp;d=PTXT&amp;p=1&amp;p=1&amp;S1=5,754,187&amp;OS=5,754,187&amp;RS=5,754,187">5754187, 1998</a>):</p>
      <p><em><br>
      The FONTCHAMELEON product incorporates one or more "master fonts" and more than 200 typeface design descriptors that reshape the master font to simulate popular typeface designs such as TIMES and HELVETICA. Each master font comprises outlines containing as control points all those required to define any of the typeface design style variations supported by the master. For Latin alphabets, at least two master fonts are required: one for non-italic and the other for italic styles. The individual typeface design descriptors define only those required for a given typeface, leaving the remainder unused as redundant points. Each master font requires about 200 KB of storage, and each typeface design descriptor uses about 3 Kbytes of disk space.<br>
      ....</em></p>
      <p>The above methods in the prior art have in common the compression of font data by content information compaction to a varying degree. The INFINIFONT and FONTCHAMELEON systems both replace individual typeface design-dependent character outlines with one or more master outline data or procedural descriptions from which approximations of character outlines are constructed on-the-fly by typeface design- and character-dependent descriptors.<br>
      </p>
