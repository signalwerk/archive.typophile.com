      <p>&gt; legibility issues are more crucial at small sizes than readability issues.</p>
      <p>Yes, and the fact that legibility at small sizes is largely a result of <em>visibility</em> is why shorter extenders (ie larger relative x-height) are better for smaller sizes. But this is why the bulk of your argument fails; all those scenarios are easily addressed by a consideration of what the reader needs, as opposed to what a designer does. For example just because some typographers try to equalize vertical proportions and such across sizes doesn't make it a good idea; in my book that's deluded Modernism - an "internal game". The reader does not benefit, he suffers.</p>
      <p>&gt; Reducing the size of extenders and capitals compensates</p>
      <p>No, because human vision has already played that role. Smaller type needs to be darker simply because our eyes see it lighter. The ideal amount of spacing and width and the ideal vertical proportions and leading stem from such realities, not some designer's whim or habits.</p>
      <p>&gt; presumably so that we don’t devour our young.</p>
      <p>So you only eat unattractive things?  :-)</p>
      <p>hhp</p>
