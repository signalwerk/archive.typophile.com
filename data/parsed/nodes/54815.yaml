      <p>Hrant: <em>Convenience (not having to switch fonts manually) is always a major benefit.</em></p>
      <p>I'm presupposing an automated mechanism to select the desirable glyphs, whether at the glyph level from within a single font or at the family level from among numerous fonts. Wherever the size-specific glyphs are stored, there needs to be a) a mechanism to automatically display them at appropriate sizes and b) a mechanism to override that automatic display.</p>
      <p>So given these mechanisms, there is no significant benefit to putting all the size variants in a single font, and Adam has identified a number of downsides to that approach.</p>
