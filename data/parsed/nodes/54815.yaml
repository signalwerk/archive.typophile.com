      <p>Me: <em>There is nothing that functionally determines that types for larger sizes need to be lighter or have smaller x-heights...</em></p>
      <p>David: <em>There is. Having evenly balanced white space in and around the characters is functional.</em></p>
      <p>Of course, so <em>if</em> one's larger size types are lighter and have smaller x-heights, then they also need tighter spacing, or if they have tighter spacing then they need to have smaller x-height to tighten the internal space. But my point is that it is an aesthetic convention that larger size types are lighter, part of a larger set of typographic conventions related to page design, and not something that is inherently functional to readability, in the way that beefing up and opening out smaller type is. The fact this is an aesthetic convention of larger type and not a functional requirement is demonstrated by the great variety of heavy, chunky display types available. There is nothing that determines that larger type needs to be elegantly light and airy: that is just one possible style.</p>
      <p><em>In serif faces, the large clunky serifs of small sizes used large are a distracting chord against the tiny serifs of the smaller sizes.</em></p>
      <p>This is a good point, but it presupposes the typographic conventions of page design to which I referred above: particular kinds of combinations of larger and small type in a closely related style on the same page. Important stuff, to be sure, but the methods necessary to make small type readable are independent of these conventions: you have to do them regardless of whether there will also be large type appearing in proximity. The conventions of large type are not of the same functional order.</p>
