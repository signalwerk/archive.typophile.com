      <p>But I hear what you're saying. Duffy Script creates its pseudo-random effect with four alternates of every character--that's not quite enough to minimize the possibility of repetitive sequences as much as I'd like. So there's a technological dead end there.</p>
      <p>Ultimately, Donald Knuth's concept of the metafont, stroke-based rather than outline-based, would seem to offer more potential as a means of creating typography that is amenable to digital processes. Is the font industry going to be sidewiped by someone developing a layout engine and a set of fonts which uses that technology?</p>
