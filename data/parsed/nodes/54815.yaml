      <p><em>if you want your 6pt version to be readable, then it is going to look one particular way. </em></p>
      <p>There is no reason that there can't be several "readable" text versions of a typeface developed from a display original.<br>
      Versions for book and news text may be quite different, in the length of descenders, notably.<br>
      For instance, compare 6 pt. Linotype Scotch and Linotype Scotch No.2 (I'm looking at a 1950s specimen book). The latter has longer extenders, presumably for book work, whereas the former is more suitable for cramming agate.<br>
      So as David says, it is the requirements of the document, and the particular medium, that are the constraining criteria, not a generalized and abstract notion of "readability".</p>
      <p>It is good old "immersive" typographism to privilege  body text as the basic and pure form of reading, with display text considered to be decorated with aesthetic glosses. But there is no difference for the reader, she doesn't see the so-called typographic qualities of display sizes any more than similar qualities in small type. What are these qualities? Sidebearing width, stroke weight, x-height, extender length, counter size -- all these things are incrementally variable across the full range of type size, and visually significant to the experience of reading.<br>
      It's not like you read small text and that's it, but when you read big text you also see aesthetics.<br>
      People read documents, not fonts.</p>
