      <p>I located a FontChameleon box gathering dust here. It specifies System 7 for Mac and Windows 3.1 for Windows - although it's possible things would run on a modern OS too. I haven't tried it, because I'm too lazy to try to find a floppy disk drive that will connect to my MacBook.</p>
      <p>I think David B's comments are on target here. The master font predetermines what range of possibilities is available. The shrinkwrap version of FontChameleon comes with a canned master font, and 47 descriptors "similar to" various popular faces, crafted for FontChameleon by The Font Bureau. (The clone aspect is the main reason Adobe promptly buried the product.)</p>
      <p>Adobe did use the technology for a while, but it required extensive (and expert) work on the master font to make it useful for our purposes. I believe there were something like five people who ever knew how to do it. I suspect that's the kind of work David B is recalling so fondly...</p>
      <p>I do think Thomas' idea is attractive in its way. If one had a programmer available to set up &amp; tune the master font to one's spec's, one could indeed use the Chameleon tools to do parametric tweaks as a means of design exploration. But that's an enormous "if". Of course one can get similar results on a much smaller (but more doable) scale by setting up appropriate multiple masters.</p>
      <p>The guys who created FontChameleon did see type design potential in it. They were thinking that a designer might want to start out a new project by creating outlines that were, say 70% Bodoni and 30% Palatino, and then adjust parameters from there. Personally, I have trouble seeing a serious designer being interested in such an approach, but maybe that's just me.</p>
