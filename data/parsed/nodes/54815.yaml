      Minion, and most other Adobe MM do not push very far in the normal axes of width and weight, so no, Minion is not weak. But when I talk about the suitability of a technology for a purpose, I always think broadly in terms of scripts and styles and not specifically to foundries or families that avoid stylistic extrema.  </p>
      <p>Cheers</p>
