      <p>DavidL: "The shrinkwrap version of FontChameleon comes with a canned master font, and 47 descriptors “similar to” various popular faces, crafted for FontChameleon by The Font Bureau. (The clone aspect is the main reason Adobe promptly buried the product.)"</p>
      <p>Ooops! to make clear what Mr. Lemon is casually portraying in an unclear, borderline yikes! fashion: The term 'clone' in the usual context @Typophile, means to make a copy of something that someone else made which the cloner has no right to. Chameleon descriptor files, by contrast and by contract, were only made from template fonts to which Adobe had legal license. With Adobe tools, at Adobe expense this was <em>instead</em> a format conversion for the purpose of file compression for cheaper PostScript printer boards for faster printing at a time where such things were thought by Adobe to be concerns to Adobe's customers.  </p>
      <p>I was always of the opinion, that dumber and cheaper and crisper and blacker were all you could ask for in a printer, (a bad idea for printer royalty junkies), and the cpu should do All The Font Work. The market agreed, and that, I believe, is the actual size main reason Adobe eventually buried the product. I remember nothing prompt in it at all, but I may be corrected. </p>
      <p>Thomas: "I was thinking that for prototyping a brand new design, from scratch, the ChamEdit app would be pretty handy. "</p>
      <p>Prototyping a brand new design, from scratch, (type design) is best handled otherwise in my experience. One would only need to use CE a few days to argue your self back to reality. Compared to the upfront work involved in making what did get made, this product was only handy for what it was made to do. Or, if FC had been applied to some kind of fine output tuning, like to shorten a text artistically .998%, or weight a text meticulously for a particular production path, or help type on screen or in print to survive a background, or hop long descenders over caps and descenders, it might have lived.</p>
      <p>"Of course, I would have run up against limitations of the master font pretty quickly... [and]...I do wonder if it might interact poorly with trying to do a real multiple master or Superpolator approach"</p>
      <p>Both MM and FC are subsets of SP to the skilled and patient. And, since one is the master of one's own SP master, one would run up against no limitations in the master quickly and forever. Look Ma, no Ernie!</p>
      <p>Cheers!</p>
