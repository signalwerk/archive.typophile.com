      <p>Well, *kind* of. But first you have a bunch of info about deltas for global stuff, and then only gradually get more specific. Depending on the typeface, some (or many) glyphs might not have *any* "glyph-specific" info at all!</p>
      <p>And you only worry about the key points you need... all the many "unnecessary" points from the master design get interpolated....</p>
      <p>The execution, in terms of the actual *code* and stability thereof kinda sucks. But the concepts and UI are pretty great.</p>
      <p>Of course remember that many aspects of this are patented for another eight years.  :/  Of course, you could always approach Adobe about licensing the patent. </p>
      <p>Cheers, </p>
      <p>T</p>
