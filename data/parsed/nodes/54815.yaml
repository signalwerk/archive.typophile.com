      <p>David: <em>I’m sure you can not draw the line between aesthetic and function so clearly in either the old or new design paradigms, or in the confluencial format/devices we today employ. E.g I’m not just making the x smaller, the spacing and width narrower and the strokes lighter to be Mr. Elegant — I’m out to fit more on a headline, or make it useful bigger, or both. That sounds functional to me.</em></p>
      <p>Yes, it's functional, but it is functional within the context of particular kinds of typography, e.g. newspaper headline, not functional in the context of readability in the way that the decisions we make in the design of small type are.</p>
      <p>As I suggested earlier, what is interesting is what happens at the point where the functionality of readability gives way to the functionality of typography that is possible at larger sizes. This point is design-dependent and not merely size dependent, although I think it is generally around typical text sizes, and hence one of the reasons why those sizes are typical: they solve the challenges of readability and begin to make richer typographic layouts possible.</p>
      <p>Newspaper headline type is a good example to look at, because it is generally heavier as well as more condensed than the text face, unlike a book titling face which will tend to be lighter. So this is an example of what I was talking about above: different kinds of large size typography that are independent of what is happening in the type at small sizes.</p>
