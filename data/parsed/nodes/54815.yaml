      <p>As soon as you have a situation in which text type X is combined with display type Y in one situation and display type Z in another situation, you have to look at what is different in the situations -- in the typography -- rather than what is different in the types, in order to understand why Y or Z is appropriate to that situation. To say that a display type is ‘an optically sized version of the text' when there are no stylistic similarities between the text and display types, when, indeed, the typographic style may be based on deliberate contrast of the style of these types, makes no sense. The display type is optically sized, to be sure, but it is not ‘a version of the text'.</p>
      <p>And my central point remains: the decisions in the process of type design that are necessary to make small type readable are of a different kind from the decisions that result in a variety of different display types. Let's imagine starting with a typical text face, designed for use at around 11pt. Then let's say that one needs to make a version of that type for use at 6pt. This is a need that is only addressable by making the new design stylistically related to the text type; otherwise, the word ‘version' has no meaning, and one might as well use some other type already optimised for 6pt. My argument is that, at 6pt, the kind of things that one has to do to that 11pt design to make it work at the smaller size, are so constrained by requirements of readability as to be essentially deterministic (complicated, to be sure, and not programmatic in a way that is readily automated for optimum results, although one can get a good distance quickly with Tim Ahren's RMX tools). But heading in the opposite direction -- making a display version of the same text type (again with the word ‘version' actually meaning something) -- one is not faced with constrained decisions about what one <em>must</em> do to make the type readable, but with options as to what one <em>can</em> do to make the type serve different kinds of typographic layout (condensed headlines or elegant book titling; direct linear similarity (real or apparent) or deliberate distinctiveness (à la Caslon's big types)).</p>
      <p>Put it another way: for the same 11pt text type, one might produce a variety of display versions for use in different typographic situations, and they will all be readable; but if you want your 6pt version to be readable, then it is going to look one particular way.</p>
