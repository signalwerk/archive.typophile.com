      <p>Hrant: <em>...we hopefully agree that using a given size master at a different size is non-ideal...</em></p>
      <p>That is certainly the case when types designed for larger sizes are used at small sizes, because the lightness of the strokes, the tight spacing, and the small counters deleteriously affect readability.<br>
      It isn't necessarily the case, though, when types for small size are used at larger sizes, because in that case the chunkiness of the small size types become a stylistic feature of the typography.</p>
      <p>This is one of the things that is often overlooked in discussions of size-specific type: the methods applied to making type work at small sizes are essentially functionally, while the conventions applied to making type for large sizes are essentially aesthetic. And note that I refer to the one as methods and to the other as conventions. There is nothing that functionally determines that types for larger sizes need to be lighter or have smaller x-heights: these are conventions derived from cultural notions of elegance. So I think the question of the linearity or non-linearity of size-specific type depends very much on what happens on either side of the point at which the functional and the aesthetic meet and, indeed, on what happens at that point.</p>
