      <p>@Nick: I see what your point, and I think it's valid in some design settings, but not for optical scaling in general. I stand by my assertion - the amount of adjustment (and, as Hrant points out, includes spacing, width, and vertical proportions in addition to stroke thickness) is considerably more between, say 6 and 12 points, as it is between 36 and 72.</p>
      <p>@dberlow: Okay, that's a different argument. There's lots not to like about Multiple Masters, and the need for an exponential increase in number of masters is one of them, but again, I stand my assertion that the format is <em>capable</em> of nonlinearities, both in mapping the amount of adjustment nonlinearly by point size (which is what the figure refers to) and in allowing intermediates (which is what you seem to be mostly talking about).</p>
      <p>Would anyone truly say that Minion's optical scaling is weak because of an inadequate number of intermediate masters? I think that if your goal was to precisely replicate, say, an existing optically scaled metal face, there would be problems, but if you do it in a way that's natural for the format, I think MM is adequate.</p>
      <p>To make that argument a little more concrete, in ATF scaling, the vertical proportions are identical from 10 points up, and the 8pt and 6pt sizes have shorter descenders. Getting <em>exactly</em> that effect in MM is not easy. At the very least, you'd need to make an intermediate at the 10pt size. But I don't think there's anything wrong with just nonlinearly interpolating, so that (using the curve above), the 12pt vertical proportions would be about halfway between 6 and 72pt. I don't think there's anything wrong with that - a reasonable approach that conversely would be very difficult to achieve in metal.</p>
