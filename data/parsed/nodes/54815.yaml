      <p><cite>Minion, and most other Adobe MM do not push very far in the normal axes of width and weight, so no, Minion is not weak. But when I talk about the suitability of a technology for a purpose, I always think broadly in terms of scripts and styles and not specifically to foundries or families that avoid stylistic extrema.</cite></p>
      <p>An interesting point which applies to other aspects of font technology too.<br>
      For example, OT layout tables are designed to address so-called "complex scripts" but fail to do so in practice as soon as things are getting as complex as the term promises. Ben Kiel's recent presentation at <a href="http://robofab.com/robothon/index.html" target="_blank">RoboThon</a> (the best conference I attended so far) illustrated that even "simple" things like kerning can easily get one in trouble. One limitation is 16-bit offset values in GSUB and GPOS. The more fundamental limitation is in the atomistic approach that these tables follow: defining layout behavior piece by piece for every possible specific context is ok for substituting an initial form here or there, including for pseudo-random effects, but better do not try to address a huge number of interacting contexts ...</p>
