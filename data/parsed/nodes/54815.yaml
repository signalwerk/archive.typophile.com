      <p>I presume Adam means that putting all the optically adjusted glyphs within a single font would complicate the hinting by requiring multiple sets of CVT values for the different stem weights and alignment heights. Definitely a complication, although not an insurmountable one. It would be more difficult in terms of FontLab hinting than it would be in VTT.</p>
      <p>In general, though, I agree with Adam: there's no significant benefit to putting all the size-variant glyphs in a single font vs. having them in multiple fonts, any more than there would be in putting all the weight variant or italic variant forms of a type family in a single font.</p>
      <p>But I don't think the current ‘size’ GPOS feature implementation is in any way a good one. Basically, it's a hack that uses the GPOS table in a way that is completely unlike every other use of that table, and I believe that is one of the reasons why the feature is not supported outside of, apparently, two applications. It falls outside of the basic OTL processing model, and developers who have taken the time to understand and implement that model simply ignore the ‘size’ feature.</p>
      <p>I suggested a dedicated SIZE table to Adobe and MS a few years ago, and David drafted a proposal for such a table last year. I suspect there will be some disagreement about the contents of the proposed table and how it should work, but in any case someone needs to turn this proposal into a draft technical spec, because until that happens I don't think we'll get a lot of serious engagement with the idea from MS and Adobe.</p>
