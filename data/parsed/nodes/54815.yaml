      <p>John: "The fact this is an aesthetic convention of larger type and not a functional requirement..." and "...the factors determining the design for type at 36pt are predominantly aesthetic..."</p>
      <p>Facts and definitions of function vary with distance and mirrors, I guess. I'm sure you can not draw the line between aesthetic and function so clearly in either the old or new design paradigms, or in the confluencial format/devices we today employ. E.g I'm not just making the x smaller, the spacing and width narrower and the strokes lighter to be Mr. Elegant — I'm out to fit more on a headline, or make it useful bigger, or both. That sounds functional to me. </p>
      <p>Cheers!</p>
