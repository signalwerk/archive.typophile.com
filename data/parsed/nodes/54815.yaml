      <p>John: "There is nothing that functionally determines that types for larger sizes need to be lighter or have smaller x-heights... "<br>
      There is. Having evenly balanced white space in and around the characters is functional. Larger external spaces of a small master size can be diminished by tracking, but the internal spaces cannot be regulated for the external spaces from a small master at large sizes. Now you will tell me how much you like Verdana at 72 point. In serif faces, the large clunky serifs of small sizes used large are a distracting chord against the tiny serifs of the smaller sizes. Now you will tell me how much you like Georgia at 72 point.</p>
      <p>Ralph: "Would anyone truly say that Minion’s optical scaling is weak because of an inadequate number of intermediate masters?"<br>
      Minion, and most other Adobe MM do not push very far in the normal axes of width and weight, so no, Minion is not weak. But when I talk about the suitability of a technology for a purpose, I always think broadly in terms of scripts and styles and not specifically to foundries or families that avoid stylistic extrema.  </p>
      <p>Cheers</p>
