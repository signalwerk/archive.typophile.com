    <p>A few years ago I have seen Thomas Phinney's presentation talking about updating Adobe's font library. I have only vague recollection of it, but I remember that he mentioned that all Adobe OTF fonts will include SIZE feature. We (at Typotheque) are in the proces of updating our library, fixing some minor bugs, and making the OTF features better, so I wondered about the use of SIZE feature.</p>
    <p>What is an advantage of SIZE when a font includes just a single optical master? How is the feature implemented, and what benefit it provides to the users. Is anyone else using it at all?</p>
    <p>I'd love to hear your comments. Also if Thomas or Miguel is around, can you please explain me how does it work?</p>
