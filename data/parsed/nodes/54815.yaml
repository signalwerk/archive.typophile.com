      <p>"What is an advantage of SIZE when a font includes just a single optical master?"<br>
      The advantage is for the creator to inform the user of the ideal size of a scaleable font in print (or online if people want to double-purpose that bit too). I'm not sure about other programs presenting this to the user, but FontBook 'info' mode shows no 'Size", but 'says' all fonts are 18 pt.;) </p>
      <p>"How is the feature implemented, and what benefit it provides to the users. Is anyone else using it at all?"<br>
      A primary vehicle for such urges has become the font name or information from external source(s). </p>
      <p>There was also once, an opsz table that QuarkExpress of the early 90's used, and that worked on single masters the way I think you imagine this would, collecting the proper size via table from a range of masters and composing with that master/size match. This still requires multiple font names for multiple fonts to perplex menus while distinguishing the sizes, but it would simplify a lot of publishing problems that have not already been solved by templating. </p>
      <p>In addition, under most circumstances, having a proper c. 1994 size table may also help evolve support for the value of selecting the proper size/whatever from a table pointing to a modern 'ranging master', as all the previous generations of type &amp; typographer solutions did with such hideous difficultly in their own materially complex ways. We here have, only software to deal with. </p>
      <p>Cheers, and a 2xCheers to those updating their libraries!</p>
