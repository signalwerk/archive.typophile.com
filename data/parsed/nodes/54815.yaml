      <p>Peter, </p>
      <p>The "size" feature essentially contains information about the recommended point size for which a certain font should be used. It makes most sense for a family of optical masters but I think it also has some sense for single fonts (as an informative resource) but I don't think anybody ever added the "size" feature for a single-optical-master family. </p>
      <p>As far as I can tell, XeTeX is the only application that currently supports the "size" feature. To easily install XeTeX on Mac OS X, go to <a href="http://www.tug.org/mactex/morepackages.html">http://www.tug.org/mactex/morepackages.html</a> and install the BasicTeX-2008 package followed by either LaTeXiT or MacTeX-Additions. </p>
      <p>Adam</p>
