      <p>Karsten, it could also be said that the limitations of tools serve to focus design.<br>
      For instance, when I couldn't get a pseudo-random script font to compile in FontLab, because it had a huge kern feature, that forced me to rationalize the fit of the face, by adjusting sidebearings and reducing the number of kerning classes. More work, but also a more rigorously designed typeface.</p>
      <p>But I hear what you're saying. Duffy Script creates its pseudo-random effect with four alternates of every character--that's not quite enough to minimize the possibility of repetitive sequences as much as I'd like. So there's a technological dead end there.</p>
      <p>Ultimately, Donald Knuth's concept of the metafont, stroke-based rather than outline-based, would seem to offer more potential as a means of creating typography that is amenable to digital processes. Is the font industry going to be sidewiped by someone developing a layout engine and a set of fonts which uses that technology?</p>
      <p>Hrant, we have gone off topic a bit, but Peter's request for comments on the SIZE feature was quite broad in scope.</p>
      <p>Actually, I haven't put SIZE in any fonts yet. Because I'm not comfortable putting features I can't test into fonts.<br>
      I have put some unsupported features in fonts, for instance "hist", but at least that can be tested in FontLab's OT Preview.<br>
      I primarily target the CS applications, so when InDesign supports this feature, then I will consider it.</p>
