      <p>John: <em>There is nothing that functionally determines that types for larger sizes need to be lighter or have smaller x-heights...</em></p>
      <p>Several reasons:</p>
      <p>Firstly, something practical. Consider body text set at 10 pt, and footnotes at 7 pt.<br>
      Now suppose that the footnote text font has a larger x-height, corresponding to 7.5 pt of the body text.<br>
      What is the advantage of this, in a layout, for the typographer?</p>
      <p>Compare the ratio of size to leading, in the body and footnote.<br>
      If body is set 10 on 12 and footnote at 7 on 9, the ratios are 0.83 and 0.78.<br>
      To equalize the proportion, the footnote should be set 7 on 8.4, or 7.5 on 9.<br>
      So, having a larger x-height in small text allows for a whole-number leading value.</p>
      <p>Secondly, think of the footnote text not as 7 pt with a big x-height, but as 7.5 pt with shorter extenders.<br>
      What is the advantage of shorter extenders in small type?</p>
      <p>Well, it depends on the leading.<br>
      So, say the typographer equalizes the ratio of x-height to between-x-height space, in the two type sizes.<br>
      This is a principle which typographers follow.<br>
      What is the advantage of having shorter extenders in the smaller size?</p>
      <p>Consider the gap, or tolerance, between descenders and ascenders in adjacent lines.<br>
      If this is decreased proportionately in the footnote text, it will of course be a smaller absolute value.<br>
      However, this "distance between" is of the same order as the distance between glyphs, i.e. their sidebearings.<br>
      So if the horizontal proximity space between glyphs is proportionately increased in small optical sizes, then the vertical proximity should also be increased. </p>
      <p>This is because the smaller type becomes, the more the tolerances involved approach absolute values at the threshold of perception. Another way of saying this is that legibility issues are more crucial at small sizes than readability issues. Hence "non-linearity" of design with relation to size.</p>
      <p>Thirdly, there is the question of overall density of a text block.<br>
      Micro type is necessarily bolder than normal text size type. Even with wider sidebearings, text colour may still be bolder than that of the main text. Reducing the size of extenders and capitals compensates, so that the two optical sizes still look like the same weight of type.</p>
      <p>Fourthly, the small-cute connection.<br>
      Humans are programmed to like the appearance of small creatures with big features, presumably so that we don't devour our young. </p>
      <p><img src="/sites/default/files/old-images/images_5951.jpeg"><br>
      Note shorter extenders in the smaller optical size (left).</p>
