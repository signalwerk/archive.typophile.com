      <p>From an economic point of view, it would make more sense to have the optical sizes in separate fonts. After all, it takes a lot of time to adapt a normal font to either headline or micro variants, and not every user needs them all. So if a foundry wants to recover its investment when all the variants are in a single font, that will make for a very expensive font, and many customers ending up buying variants they might not really need. Or deciding not to buy at all.</p>
      <p>**</p>
      <p>The foundry should be able to put some information in the fonts that determines the optimum <strong>relative</strong> size at which to use them.</p>
      <p>For instance, if I design a Didone face where the hairline/serif thickness of the "micro" or "footnote" version at 7 pt is the same as that of the "normal text" size at 10 pt, that ratio of 70% should be embedable in the fonts and recognizable by layout applications. It's not quite the same as specifying an optimum size for each "optical" variant.</p>
      <p>This quality of size relationship is also fundamental in monoline typefaces such as Luc de Groots's Taz and my Bodoni Egyptian, where the line thickness of different weights is calculated to equalize when they are set at specific size ratios.</p>
