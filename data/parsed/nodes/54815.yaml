      <p>In technical principles, TrueType Variations used an open format for input, defined with a free and open tool, stored it in a few open tables, and output as open TT, while Chameleon didn't use any standards. In design principles Font Chameleon is much like a corral, go play anywhere, but don't leave. Variations and Superpolations are a wide open field with posts that have signs telling you what's in each direction, and it's all up to the designer or user to wander the space, or in fact leave it. So I'm not sure what common principles there are among these formats, except that one can twiddle input and effect output. </p>
      <p>"...one of the nice things about ChamEdit is that one could easily tweak parameters..."<br>
      This is true, after a very long preprocess. And in the end, all these brilliances have to return to the puny-human formats and caved-in menus of the dummy-world where none of these multiple mastered formats are installable. </p>
      <p>Cheers!</p>
