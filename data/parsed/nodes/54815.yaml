      <p>&gt; the chunkiness of the small size types<br>
      &gt; become a stylistic feature of the typography.</p>
      <p>Indeed, and sometimes features of small type are "extracted" and used in type meant only for larger sizes (think Amplitude, and Bradlo earlier). On the other hand, such "chunkiness" has tellingly never really been a mainstream aesthetic preference, and one could claim that the human consciousness leans towards attributes (such a geometric congruence) that are essentially display-centric and anti-text. To put it another way, taste is admittedly variable (individually and socially) but still falls within some bounds set by the primal human psyche. This is what leads me to believe that a text font <em>must</em> have a certain ugliness (visible only when set large) to really be optimal.</p>
