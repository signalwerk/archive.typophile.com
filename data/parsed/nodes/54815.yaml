    html: |-
      <p>David B: The Chameleon descriptor dev tool "ChamEdit" hasn't been touched since OS 8 days, no. There was a last-gasp effort to write a manual for ChamEdit, though, which could be helpful.</p>
      <p>I had dinner with David Lemon last night, and just as he was dropping me off at Paul Hunt's afterward I asked about the possibility of getting at least the Chameleon editor out of Adobe in some fashion. He thought it was a pretty oddball request, but not necessarily out of the question.</p>
      <p>I think the above descriptions give a decent idea of how the Chameleon tech works. The patent is pretty clear, too. Basically, you've got a "master outline" with lots of points on it. Each "descriptor" stores only the transformations to that outline. Wherever possible, those transformations are done globally: things like lower-case vertical stem standard thickness, etc. That's also how they work in ChamEdit: you set a variable like this and it is automatically applied everywhere it's needed. Then you do overrides where necessary.</p>
      <p>What am I thinking?</p>
      <p>I have long thought that for many kinds of typeface designs, the Chameleon editor would make a really handy rapid prototyping tool. A great way to quickly define the basic characteristics of the typeface. It could export Type 1 fonts....</p>
      <p>On the downside, the natural tendency of working with such an environment would be to create a more bland and homogenized font. Instead of starting with lots of personality and trying to tame it (my usual type design problem), you'd be facing the opposite problem.</p>
      <p>Cheers,</p>
      <p>T</p>
