      <p>"...having different optical sizes exist within the same font as alternate glyphs, to be intelligently substituted as needed..."<br>
      This suggestion is part of any good optical scaling system and was suggested as part of the proposal for a size table to add to the OT spec. Although the idea of a master outline embedded in a single master is superior for a million reasons, one still needs to account for glyphs whose contours do not vary to target with a single contour definition. Kanji needs this for smaller sized glyphs that need to lose features, and Latin needs it for smaller fi lig. e.g. that must lose its dot vs. larger sizes where the dot may stay. </p>
      <p>Twardock: "... it would greatly complicate the hinting"<br>
      How? How greatly?</p>
      <p>Cheers!</p>
