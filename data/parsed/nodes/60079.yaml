  html: |-
    <p>Gerard Unger, esteemed Dutch type designer, author, and educator, received the SOTA Typography Award for 2009. The award was presented today, July 17, 2009, during TypeCon2009 in Atlanta.</p>
    <p>We couldn't be happier to announce this news. Thanks to this year's jury - Sam Berlow, John Downer, Juliet Shen, Nadhine Chahine, Hank Richardson, and chair Shu Lai. They have most excellent taste.</p>
