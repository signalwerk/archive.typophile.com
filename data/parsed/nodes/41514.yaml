      <p>Alfred, thanks! I'll answer your questions in order.</p>
      <p>1. I made the vertices that way on the "N" because if I kept it consistent with the M, V and W, the "N" looks too wide. It didn't fit in and felt bigger than all the other letterforms. It also makes the N unique.</p>
      <p>2. I see what you are saying but I can assure you it's aligned with the E, F and H. It's possibly an optical illusion, which I don't see, but I will explore it.</p>
      <p>3. I filled in the counters to give the typeface a unique feature. I like it a lot, especially when the it's used at large sizes, but I'm also considering a version with counters.</p>
      <p>4. The curly brackets were created on the grid and use the same corner angles and thickness as the rest of the forms.</p>
      <p>5. I tried doing some lowercase letters but they weren't working out well in the grid but I'll revisit it soon.</p>
