      <p>It looks very interesting to me. I like it!</p>
      <p>But I have some questions:</p>
      <p>- Why do the apex and vertex of the letter N end peaked? In my opinion it should be like the M, V and W.<br>
      - The upper end of the G's throat seems to end above the arms and crossbars of E, F and H.<br>
      - Why did you fill the bold glyphs' counters? It looks like stencils, but why? It's not what the font looks like.<br>
      - I think, that the curly braces don't fit in your obvious concept. They don't seem to be created on the grid.</p>
      <p>But nevertheless, I like the font! Especially, I like the M, Y and Q.<br>
      What about the lowercase?</p>
