    html: <p>I agree that the "a" works, but also that the "u" is off. My big concern is that this genre might be exhausted. But if making your own turns you on, that's plenty of reason to do it! <br> <br>BTW, if this is for text, it needs longer ascenders, and I think a slightly darker color as well - otherwise you'll have to loosen the whole thing up. If it's for display, consider making it narrower. <br> <br>hhp <br></p>
