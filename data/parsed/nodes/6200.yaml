    html: "<p>Thanks for the comments. <br>I'll take a look at the  \"u.\" I guess if nothing else, designing a face of a certain style makes me appreciate that style even more, and notice the nuances that differentiate similar fonts. So i guess in that regard, making it turns me on. <br> <br>I agree that the color is light. If this was part of a family, this would be the light version. When the alphabet is more flushed out, I'll take a look at all the ascenders. <br> <br>\"My big concern is that this genre might be exhausted.\" <br> <br>Enlighten me. What genre are we talking about? And what are some exellent examples in this genre? Honest questions - see my first post. And (opening the door), when is a genre exhausted? <br> <br>For example, were transitional faces (namely Baskerville) exhausted when Mrs. Eaves was introduced. Or did it carve it's own niche? Or was there just a \"good enough\" explanation of its intentions to make it special? I must admit, I'm talking out my arse to some degree as I've already admitted I'm no expert on type classification and history. I just read up on Mrs. Eaves at the emigre site. <br> <br>Note: I'm not trying to be defensive, more curious how a revival and an exhaused genre jive. <br>Quote: I set out to do something great, and discovered the old guys took all the good ideas. <br> <br>Randy</p>"
    html_clean: "<p>Thanks for the comments. <br>I'll take a look at the  \"u.\" I guess if nothing else, designing a face of a certain style makes me appreciate that style even more, and notice the nuances that differentiate similar fonts. So i guess in that regard, making it turns me on. <br> <br>I agree that the color is light. If this was part of a family, this would be the light version. When the alphabet is more flushed out, I'll take a look at all the ascenders. <br> <br>\"My big concern is that this genre might be exhausted.\" <br> <br>Enlighten me. What genre are we talking about? And what are some exellent examples in this genre? Honest questions - see my first post. And (opening the door), when is a genre exhausted? <br> <br>For example, were transitional faces (namely Baskerville) exhausted when Mrs. Eaves was introduced. Or did it carve it's own niche? Or was there just a \"good enough\" explanation of its intentions to make it special? I must admit, I'm talking out my arse to some degree as I've already admitted I'm no expert on type classification and history. I just read up on Mrs. Eaves at the emigre site. <br> <br>Note: I'm not trying to be defensive, more curious how a revival and an exhaused genre jive. <br>Quote: I set out to do something great, and discovered the old guys took all the good ideas. <br> <br>Randy</p>"
