  html: "<p><img src=\"http://www.typophile.com/forums/messages/29/4380.gif\" alt=\"cuillere.gif\"> <br>Here is a first stab at an organic serif. I tried to steer towards the calligraphic: the color is fairly even, but not totally even (which I liked), and I liked the upward angle of the serifs. I tend to hate lc \"a\"s where the bowl doesn't connect, but I think it's working here with the handlettered feel. I've also softened the intersections to give more of a \"wet ink\" feel. This may be a problem at small sizes but I'm not planning on setting a novel in it. <br> <br>I wasn't really looking at something specific. It's more of a \"brain dump\" after having absorbed serifs for ages and finally attempting one on my own. Hopefully it is \"different.\" But it's so hard to tell when you've immersed yourself in it. I'll call it a subconscious revival, working name Cuillere. <br> <br>Your thoughts and suggestions desired. <br>More to follow. <br>Thanks, <br> <br>Randy <br> <br>After previewing, it looks like the f could use more weight in the stem. Also, any suggestions for inspiring the caps or should I stick with the subconscious revival method? :-) <br></p>"
  html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/29/4380.gif\" alt=\"cuillere.gif\"> <br>Here is a first stab at an organic serif. I tried to steer towards the calligraphic: the color is fairly even, but not totally even (which I liked), and I liked the upward angle of the serifs. I tend to hate lc \"a\"s where the bowl doesn't connect, but I think it's working here with the handlettered feel. I've also softened the intersections to give more of a \"wet ink\" feel. This may be a problem at small sizes but I'm not planning on setting a novel in it. <br> <br>I wasn't really looking at something specific. It's more of a \"brain dump\" after having absorbed serifs for ages and finally attempting one on my own. Hopefully it is \"different.\" But it's so hard to tell when you've immersed yourself in it. I'll call it a subconscious revival, working name Cuillere. <br> <br>Your thoughts and suggestions desired. <br>More to follow. <br>Thanks, <br> <br>Randy <br> <br>After previewing, it looks like the f could use more weight in the stem. Also, any suggestions for inspiring the caps or should I stick with the subconscious revival method? :-) <br></p>"
