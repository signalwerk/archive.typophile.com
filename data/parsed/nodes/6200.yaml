    html: <p><i>When the old guys did come up with a good idea, it wasn't about spicing up a letter. It was about shaking up the whole alphabet.</i> <br> <br>Well it sure does seem that way when you fly over the centuries, looking at the major stylistic branches. But in between each of the stylistic leaps were long periods of gradual change and refinement. There's just at much room for artistry in refinement as in revolution. <br> <br>Maybe the flare of the leftmost stems on <b>h</b>, <b>n</b>, and <b>m</b> should be carried more strongly through the rest of their descending stems. As is, the weight of the character seems to rest mostly in the left side, with weaker marks hanging off to the right.</p>
