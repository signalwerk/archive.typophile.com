    html: <p>Perhaps we should put it in the font identification forum and figure out what it is :-) <br> <br>I agree with you both. It wouldn't stand up to abuse at 10 point for a few hundred pages. Too light and too delicate for that. So this incarnation is for display purposes. Still curious though, is there a name for something like this? (Secretly, I was hoping someone would bust out a reference to typographic minutae, "reminds me of early sketches from Dwiggins' landmark pink phase... or was it his blue phase?" :-) <br> <br>Hrant, to your arsing, you have a point on spicing up a few characters. I will look into that. A great example of that is Pill Gothic in these forums. You see the a and the g and say, hmm this is excellent and different than anything i've seen. The rest of the set shoots pretty straight. I think this will make a font sell, but i'm not sure it's enduring.  <br> <br>When the old guys did come up with a good idea, it wasn't about spicing up a letter. It was about shaking up the whole alphabet. In the mean time I will settle for spicing up a letter :-) <br> <br>Cheers.</p>
