    html: <p>Aaron, good point about carrying the flare/added weight in the leftmost stem throughout. As mentioned in the original post the overall color is intentionally un-even since I was going for more of a hand lettered feel. I was thinking the first stroke of a drawn character is usually slightly heavier due to a more loaded pen. As I "handlettered" this digitally (not copying parts), the thinking didn't get into all the characters consistantly. Hmmm, I'll have to look back at this "first stroke" idea. If it makes any sense at all :-) I probably need to weight up right side of  the a, the left of the u, the r, the f, and possibly the diagonal spine of the s. <br> <br>Hrant, it is likely of German influence. I was recently introduced to the lettering/calligraphy work of Werner Schneider. I bet that's where the a came from. Below is a link to classical caps based on his calligraphy work. <br> <br><a href="http://www.tiro.com/aen_mn.html" target="_blank">http://www.tiro.com/aen_mn.html</a> <br> <br>Randy <br>BTW. Lets hear it for the new typophile photo option! And the upload attachment feature. Hip Hip.</p>
