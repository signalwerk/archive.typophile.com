      <p><strong>Linotype’s LinoLetter for June 2006 – Text, Grunge, and Exoticism: Fonts to Watch </strong></p>
    <p>Check out the full version of this month’s newsletter at the Linotype website: <a href="http://www.linotype.com/38-19610/issue200606.html" title="http://www.linotype.com/38-19610/issue200606.html">http://www.linotype.com/38-19610/issue200606.html</a></p>
    <p><em>Content Preview:</em> With the spectacular fonts inside our newest Foreign Style Value Pack, the grungy Bronx script face and the refreshingly new Veronika type family, we’ve once again compiled a list of remarkable fonts for our readers this month. Like last month’s issue of the LinoLetter, we are pleased to wrap up this month with another round of professional tips, namely those found in Linotype’s print publication, the Linotype Matrix, and in our newest web feature, “Akira says…”</p>
