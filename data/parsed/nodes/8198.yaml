    html: '<p>I wonder if you  could create a nice, primarily typographic solution using the "seismic" lines as random, supporting graphic elements. What I mean by "random" is not necessarily appearing exactly the same on any pieces. This randomness can represent the often unpredictable nature of volcanos (e.g. the recent activity of Mt. St. Helens). <br> <br>1 The logo could be a simple typographical logo, presented with or without the graphic lines, or with a few variations of the lines. <br> <br>2 The bizcard could present the graphic lines in one way, while they might appear differently on letterhead and envelopes. <br> <br>3 Other printed collateral could present the graphic lines in various ways: large, small, cropped left, cropped right, etc. <br> <br>4 etc</p>'
