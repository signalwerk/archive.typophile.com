    html: |-
      <p>I'm afraid your 3 could easily be mistaken for a 5 and your D could be a zero. Also, the perspective angles of the 3D effect are too extreme so it actually looks as if the figures are slightly twisted, and the top of 3 is falling backwards a bit. I'd keep the angle consistent, like a traditional archictural drawing. Look up isometric, axonometric and oblique projection if you're not familiar with technical drawing.</p>
      <p>I think the look is a bit too '90s techno for an architectural firm.</p>
