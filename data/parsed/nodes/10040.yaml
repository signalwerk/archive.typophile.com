    html: <p>These dualities stem from the derivation of type from written forms, and represent two historical ways in which these letters developed prior to the invention of printing from moveable type. These are not, by the way, the only forms of g and a encountered in <a href="http://www.newadvent.org/cathen/11403a.htm">palaeography</a>, there are other forms which did not influence the development of typographic forms, or whose influence was short-lived or localised. A good example of localised influence is the traditional Irish g. You can see some examples in Michael Everson's digitisations of <a href="http://www.evertype.com/celtscript/csmain.html">historical Irish types</a>.</p>
