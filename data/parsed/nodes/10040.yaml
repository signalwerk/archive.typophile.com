    html: "<p>Nobody has addressed printing problems of the various g's which have had so much influence and about which there must be many who can speak much more authoritatively than me. The major reason for the simplified g of Helvetica (and the a) is that they are much less likely to clot, not just in metal, but also in digital type, at small sizes. (Look at the Meta bold g in Fowler MEU 3 for a terrifying example of this problem in modern printing and this using a supposedly rational font. Why does anybody ever believe anything that a manufacturer or designer ever says about a font?) <br> <br>One miscellaneous point: many metal fonts with beautiful g's have had short lives and limited usage for the simple reason that the character broke too easily.</p>"
