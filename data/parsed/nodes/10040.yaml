    html: "<p>Hi Paul, <br> <br>\"Correct me if I'm wrong, but... <br>The double-storied g and a are commonly features of serifed roman fonts, wheras the single-story forms are more characteristic of an italic or a cursive font (or writing style).\" <br> <br>This is generally true, though there are certainly always exceptions. Double-story \"a\" and \"g\" are also fairly common in sans serif Roman fonts as well. But of course, in an effort to simplify the structure, many sans serif designers opt for a single-story character. <br> <br>\"for your consideration: does the following glyph look more like the double-storied g? or a single-story g?\" <br> <br>As always, this is one of those cases where one could argue it falls under either category. (Sort of like, is the movie a drama with comedy, or a comedy with drama.) Within the branch of Gothic characters, it was also quite common to find \"a\"s that appear to be in both categories at the same time. <br> <br>But if one wanted to be a historic stickler, the\"g\" example you show would more technically come under the heading of a single-story character. This is because it is a Textura character following the same principle as the Italic (and other manuscript hands of that era) lowercase \"g.\" The lowercase \"g\" of that time was always closed (i.e., the descender hooked back up to the nadir of the body). This was done to prevent it from being confused with a \"q,\" which back then was written like we make today's \"hooked-g.\" This enclosed Italic \"hooked-g\" was a single-story \"g\" (even though it appears to fall into either category) because within the same Italic alphabet there was also a version (sometimes multiple versions) of \"linked-g\" (double-story g) as well. Both \"g\"s were freely used side by side. </p>"
    html_clean: "<p>Hi Paul, <br> <br>\"Correct me if I'm wrong, but... <br>The double-storied g and a are commonly features of serifed roman fonts, wheras the single-story forms are more characteristic of an italic or a cursive font (or writing style).\" <br> <br>This is generally true, though there are certainly always exceptions. Double-story \"a\" and \"g\" are also fairly common in sans serif Roman fonts as well. But of course, in an effort to simplify the structure, many sans serif designers opt for a single-story character. <br> <br>\"for your consideration: does the following glyph look more like the double-storied g? or a single-story g?\" <br> <br>As always, this is one of those cases where one could argue it falls under either category. (Sort of like, is the movie a drama with comedy, or a comedy with drama.) Within the branch of Gothic characters, it was also quite common to find \"a\"s that appear to be in both categories at the same time. <br> <br>But if one wanted to be a historic stickler, the\"g\" example you show would more technically come under the heading of a single-story character. This is because it is a Textura character following the same principle as the Italic (and other manuscript hands of that era) lowercase \"g.\" The lowercase \"g\" of that time was always closed (i.e., the descender hooked back up to the nadir of the body). This was done to prevent it from being confused with a \"q,\" which back then was written like we make today's \"hooked-g.\" This enclosed Italic \"hooked-g\" was a single-story \"g\" (even though it appears to fall into either category) because within the same Italic alphabet there was also a version (sometimes multiple versions) of \"linked-g\" (double-story g) as well. Both \"g\"s were freely used side by side. </p>"
