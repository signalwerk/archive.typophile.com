  html: <p>Hello. <br> <br>I'm not a typographer, but the craft has always interested me. Something that I've wondered about for a long while is why there seem to be two distinct (but identifiable) versions of the lowercase "g". <br> <br>I'm unfamiliar with the lexicon for discussing type, so I'll do my best with a visual description. In some fonts, the "g" is composed of a bulb, a loop that drops below the baseline, and a slight vertical protrusion at the top right corner. In other fonts, the "g" is composed of two bulbs, one below the baseline and attached to the other with a short loop, and a horizontal or diagonal protrusion at the top right corner. Whether a font has one "g" or the other is seemingly totally independent of its style. Two examples of these "g"s are in the fonts Futura and Trebuchet MS. <br> <br>Why is there this duality? And how did the double-bulbed variety come about? I've been pondering this over with friends; we feel that they both must have developed from one variety in the past. We also realized that the same duality occurs with the letter "a", though not necessarily in the same font as the "g". <br> <br>Does anyone know how these dualities came about?<img src="http://www.typophile.com/forums/messages/30/68446.jpg" alt="(some &quot;g&quot;s)"></p>
  html_clean: <p>Hello. <br> <br>I'm not a typographer, but the craft has always interested me. Something that I've wondered about for a long while is why there seem to be two distinct (but identifiable) versions of the lowercase "g". <br> <br>I'm unfamiliar with the lexicon for discussing type, so I'll do my best with a visual description. In some fonts, the "g" is composed of a bulb, a loop that drops below the baseline, and a slight vertical protrusion at the top right corner. In other fonts, the "g" is composed of two bulbs, one below the baseline and attached to the other with a short loop, and a horizontal or diagonal protrusion at the top right corner. Whether a font has one "g" or the other is seemingly totally independent of its style. Two examples of these "g"s are in the fonts Futura and Trebuchet MS. <br> <br>Why is there this duality? And how did the double-bulbed variety come about? I've been pondering this over with friends; we feel that they both must have developed from one variety in the past. We also realized that the same duality occurs with the letter "a", though not necessarily in the same font as the "g". <br> <br>Does anyone know how these dualities came about?<img src="http://www.typophile.com/forums/messages/30/68446.jpg" alt="(some &quot;g&quot;s)"></p>
