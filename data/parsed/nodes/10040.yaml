    html: <p><i>As always, this is one of those cases where one could argue it falls under either category. </i> <br> <br>exactly what i was getting at. i think especially looking at the scripts that predated printing types you can see where either of our modern forms of the letter could be derived from the same script form. <br> <br><i>But of course, in an effort to simplify the structure, many sans serif designers opt for a single-story character.</i> <br> <br>what i think is really interesting is that the sanserif italic has particular freedom in adapting any of the letter styles for it's particular needs. The first time I saw it, I was fascinated by Bringhursts table of the Italicization Quotient of Thirteen Unserifed 'Italics' in <i>Elements</i>.</p>
