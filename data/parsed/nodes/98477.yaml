  html: |-
    <p>Bruno is an innovative multi-layered font which I developed at the KHB (University of Arts Berlin) under the guidance of Luc(as) de Groot.<br>
    <img src="http://i.imgur.com/8DKqp.jpg" alt=""><br>
    It's basic form principle is that of a ribbon, folded and bent in space to produce the glyphs. I named it after my grandfather who was a poster designer and thus hand drew a lot of custom fonts.<br>
    <img src="http://i.imgur.com/hPwtP.jpg" alt=""><br>
    Traditionally the use of multi-layered fonts can be very clumsy, since you often need to duplicate text fields and then align them precisely on top of each other. Not so with Bruno: I programmed an InDesign plugin for it that automates the whole progress. There's a one minute demo video here: <a href="https://vimeo.com/54004048" title="https://vimeo.com/54004048">https://vimeo.com/54004048</a></p>
    <p>The font contains all necessary glyphs to display eastern, middle, and west european languages.<br>
    <img src="http://i.imgur.com/3t3K1.jpg" alt=""></p>
