    html: |-
      <p>Thanks all!</p>
      <p>@hrant<br>
      It got much easier in the last years, but more than half of my code ist stuff that works around a lot annoying InDesign bugs. Finding these &amp; finding a fix is usually a PITA</p>
      <p>@Nick<br>
      The plugin copies the textframe and activates a special OT feature on that copied frame. If anything is changed on the original textframe (content, position etc.) it's mirrored to the copy.</p>
      <p>@Grant<br>
      Unfortunately Adobe trademarked my grandfathers name, so MyFonts took the font down. I'll now have to come up with another name. It's still available to buy at leo-koppelkamm.de/bruno</p>
      <p>Leo</p>
