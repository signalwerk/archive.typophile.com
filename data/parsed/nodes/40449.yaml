      <p>2008 is one of those typographically awkward years, at least in terms of oldstyle numerals. Those three short numerals and one tall one will be bothering me all year.</p>
      <p>Consider that the proportions of oldstyle numerals developed during the long period after the 13th century and before the 21st in which almost all years looked nicely weighted with either an ascending or descending second numeral. For the next 292 years we’re stuck with occasional ugly number sequences.</p>
