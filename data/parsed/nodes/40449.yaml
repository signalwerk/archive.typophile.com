  html: |-
    <p>Happy New Year’s everybody! Hope everyone has a safe and fun evening. May all your resolutions (72 dpi or higher) become successes.</p>
    <p>I’m going to try to be nicer to strangers, eat healthier (i.e. less fast food!), get my debts under control, learn to select type with verve, embrace color instead of hiding from it, and just be a better person/designer in general.</p>
    <p>I’d like to hear what your resolutions are (or aren’t). Hopefully, they’ll be inspirations for all of us.</p>
    <p>May 2008 bring us all greatness.</p>
