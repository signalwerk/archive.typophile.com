    <p>I wondered how Stephen managed to have double the number of posts of the next most prolific poster. Tonight when I logged in, I saw the reason: there are two of him! (And when you mouse over the icons, both say "Stephen Coles's picture".)</p>
    <p>I need to find out the secret so I can get my work done and still have time to have fun.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DoubleStewf_5888.png"></div><p></p>
