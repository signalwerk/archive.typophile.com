    date: 2005-01-25T09:45:00
    date_raw: 25 Jan 2005 — 9:45am
    votes: null
    html: <p>Work on concepts before styles. This mark is all styles. And while that's not necessarily bad, the particular styles you used are all rather cliche. With a good concept, you find you have less need for decorative styles.  <br> <br>Remember, less is more! <br> <br>Do you have any say in the name of the company? The name is very generic and there's really nothing unique about it. It's like naming a hardware store 'Hardware and Stuff'. Maybe explore some more abstract names that would lend themselves to a unique mark. Where are you located? Who are the people that work there? Who are you trying to target? Etc.</p>
