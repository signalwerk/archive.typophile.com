    html: <p>Boring! Its been done before. The mark is silly and looks like a mistake. I only say that because its stagnate. If you are going to animate it maybe it can work. But it is silly. Good design is about communicating clearly. How is that clear. I don't think you need the line Web Print Interactive Marketing. Let prospective clients ask you what you do, create a conversation. I'm not a fan of letterspacing and the condensed type looks dated.</p>
