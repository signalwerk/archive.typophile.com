    <p>I’m trying to find some new online fontshops along the lines of <a href="https://web.archive.org/web/20080827234729/http://www.processtypefoundry.com/">Process Type</a>, <a href="https://web.archive.org/web/20080827234729/http://www.lineto.com/">Lineto</a>, <a href="https://web.archive.org/web/20080827234729/http://www.textaxis.com/">Textaxis</a> and <a href="https://web.archive.org/web/20080827234729/http://www.identikalshop.com/">Identikal</a> but I’m having no luck.</p>
    <p>Not big houses, like Adobe, Linotype, etc...</p>
    <p>I really appreciate how Process Type displays their information - I can get a good idea what I’m dealing with from their site.</p>
    <p>Anything else out there on the horizon?</p>
    <p>I’m not sure how I could do an effective search in the forums to do this otherwise...</p>
    <p>(We could exclude Emigre, Fountain, Garage Fonts, House Industries as I’ve already been through them.)</p>
