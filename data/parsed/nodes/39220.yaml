    <p>Hello everyone!</p>
    <p>I can't remember the name of the font used by Saul Bass, in "The man with the golden arm" poster!</p>
    <p><img src="/sites/default/files/old-images/Saul_bass_goldenarm_6225.jpg"></p>
    <p>I used to know it...and I know that its glyphs changes according with the glyph that precedes and follows!</p>
    <p>Thank you all for the attention!<br>
    Bye :)</p>
