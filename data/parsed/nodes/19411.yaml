    <p>Hi there -</p>
    <p>I am going to make a booklet to be inserted in a cd cover. Quite a lot of text is needed, so I will have to use a size around 7 ... 7,5 ... 8 ... 8,5 pt.</p>
    <p>I have not yet considered any fonts. It could be a sans or a serifed - it only has to be highly legible in very small sizes.</p>
    <p>The booklet is to be laserprinted in 144dpi (as is the whole cd cover, which I make as a gift for a friend).</p>
    <p>Could be interesting to hear your views. Sorry if this has been beaten to the bone regularly – I have been away from Typophile for a couple of years.</p>
    <p>---</p>
    <p>soren_olsen</p>
