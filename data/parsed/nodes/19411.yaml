      <p>Hrant, maybe I misguided you, explained about the resolution ... I will try again: I am going to design this cd cover in Adobe Illustrator. The booklet that will be inserted in the cover will be around 8 pages of nothing but text, probably two columns. This booklet I will do in InDesign.</p>
      <p>The reason I brought on the subject of resolution is that the project will not be produced in offset - but will be made using a color printer, KonicaMinolta Bizhub (possibly bizhub 350 or similar). I now realize that 144 lpi may be the wrong thing to say (at the moment I wrote the post I remembered that figure, because I have used it for photos at one point) the res may be quite higher when dealing with vector graphics and type ... frankly, I don't know very much about it :-/</p>
      <p>BTW ... what's your opinion on Charter as regards to legibility in small sizes (given that you don't hate the sight of that typeface)?</p>
      <p>--<br>
      soren_olsen</p>
