    html: "<p>You might also want to check here: <br> <br><a href=\"http://www.blambot.com/ulttitle.html\" target=\"_blank\">http://www.blambot.com/ulttitle.html</a> <br> <br>and here: <br> <br><a href=\"http://www.fontdiner.com/main.html\" target=\"_blank\">http://www.fontdiner.com/main.html</a> (then click on braineaters) <br> <br>2 other suggestions. Go to myfonts.com, login and update the settings to display the word(s) you need and then do a keyword search. This helps visualize other options you might not consider. Also, I'm not a big fan of free fonts, but a recent client wanted to do a poster that had writing like the old really bad \"b\" monster movies (i.e. the swamp thing, black lagoon). He didn't find anything that work in the commercial arena so we did a search in the free fonts and he found the perfect one. It is a really bad quality font that gave the exact look he wanted. <br> <br> </p>"
