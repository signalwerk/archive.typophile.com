    html: "<p>Adriano, <br> <br>Excellent evil suggestions. About the double and tripple posting: just click the post button once (it is realtime). If any error messages come up, or it takes a long time, disregard them, your message will be posted. <br> <br>What I do is launch a duplicate window before posting. Then do the posting process. After a couple of seconds, close the posting window (regardless of whether it's finished loading). When you refresh the remaining window you will see your post. <br> <br>Randy</p>"
