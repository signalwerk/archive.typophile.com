    <p>Help: I vaguely remember a presentation (at ATypI Dublin? Or maybe TYPO last year?) where somebody showed some glyphs (I seem to remember an "O" or "o") where once the outer and once the inner contour was «ugly»/uneven, and discussed the effects; which, IIRC, were essentially that faults in the inner contour were noticeably more prominent and jarring than in the outer one. Now I can't for the life of me remember who/where this was, but I hope I haven't only dreamed it because the effect was really interesting, and I'd like to find out more.<br>
    Does anyone know what and/or whom I'm talking about, and can point me in a direction to find out more? Many thanks.</p>
