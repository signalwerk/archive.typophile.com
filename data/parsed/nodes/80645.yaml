    html: |-
      <p>Here's a theory: when you look at a shape, you tend to look at its center point (or maybe its "center of gravity"), and the closer something is to the middle of the fovea the more detail you see in it. Since counters tend to be closer to the center than the outsides, you notice the defects more.</p>
      <p>But this only applies to individual large shapes (deliberative, non-immersive reading); in the case of boumas (which kick in during immersive reading) it must be more complicated.</p>
      <p>hhp</p>
