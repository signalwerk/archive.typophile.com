    html: <p>It might be a function of our primal being back when we were intensely interested in seeing both food and predator in our horizon.  I theorize that the outer boundary is akin to the forest mantle and acts to frame what is inside our point of view.  We would not be alarmed to see foliage surrounding our viewpoint, but if a predator or an enemy were to become framed by that vegetative outer area, we would have reason to be quite alarmed and surely more attentive to that potential danger. Although not impossible, it is certainly less likely that a predator or foe could position himself as part of the framing foliage than to intrude on the space that it surrounds. This also may partly be why humans attend more to figure than to ground in things they see. I think we just focus quickly on what we are conditioned to think is crucial to life and sustenance, even if we just ignore all other visual stimuli.</p>
