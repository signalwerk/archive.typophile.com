    html: |-
      <p>Riccardo, you've got me thinking—I've seen some r’s with ascenders (Cheltenham, for instance) that might be interesting in a unicase style. Lining glyphs are not a mandatory constraint of unicase, of course.</p>
      <p>Right Danny, I started out to do an OpenType upgrade to Panoptica, but got distracted…</p>
      <p>Thanks Ralf! What are your thoughts on Capital Sharp S in unicase? I treated sharp s as upper case in standard orthography, i.e. “ß” is rendered as double-s in both lower case and all-cap settings. This may not be ideal in mixed case (“Unicase with Small Unicase”) setting, but I don’t really like that setting for this face, the two-size/two-case configuration is more of a convenience that provides a degree of size-specific variety for lining setting, which I assume will be the way that most users will set the face. </p>
      <p>However, if you do set the cap-eszett glyph in either upper or lower case, then it will correctly transpose in both “All Caps” (case) and “All Small Caps” (smcp) features.</p>
      <p>Perhaps I could have done a stylistic set with the lower case “ß” rendering in the cap-sharp-s form.</p>
