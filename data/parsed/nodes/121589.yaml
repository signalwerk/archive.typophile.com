    html: <p>Can't state if it has been started with Vanitas but still thinking it is the best out-the-box option, squooshing it a bit, adjusting stencil and recreating /G from /O. I'd be very surprised if finally somebody come and confirm both New York Magazine and Selena Gomez artwork cover are using the same typeface. Maybe designer of SG's album cover took inspiration from New York Magazine.</p>
