    <p>SFG, Schule für Gestaltung Basel (Basel School of Design)</p>
    <p>Famous design school in Switzerland.<br>
    Located in Basel in the German-speaking north west region of Switzerland.</p>
    <p>Teachers were (amongst others): Jan Tschichold, Emil Ruder, Armin Hofmann, Max Mathys, Wolfgang Weingart, Kurt Hauert.</p>
