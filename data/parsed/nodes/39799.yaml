      <p>thanks, Kent! I remember reading about the evolution of the quotation mark some time ago, but I didn't realize Gill might have been, well, »quoting« that evolution :)</p>
      <p>&gt;&gt; for they look so much better<br>
      &gt; Really? Not to me.</p>
      <p>Really, they do (to me)! The usual English, German, etc. ones (“” and „“) create unsightly holes in the text because most of the space they occupy is above x-height (or below the baseline), and they can cause confusion because they resemble or are identical to apostrophes (and commas).</p>
      <p>I don't think my aversion to them is a cultural thing -- as a matter of fact, there's many things in <em>foreign</em> typographic cultures that I'd love to see more often in German typographic culture (and have started using whereever I can), such as the British (and Canadian?) practice of omitting the period in abbreviations like »Dr« and »Mr«.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gill_5998.png"></div><p></p>
