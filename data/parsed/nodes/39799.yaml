      <p>&gt; older German typographers may adhere<br>
      &gt; to the »Danish/Croatian«-style</p>
      <p>it's not so much a question of the typographer's age, but rather one of their aesthetic standards and/or technical know-how.</p>
      <p>„German (I don't care whether my quotation marks look awful)“<br>
      »German (I prefer quotation marks that don't disrupt the text, and know how to typeset them properly)«<br>
      «German (me, too, but I'm kinda special)»</p>
      <p>In most well-crafted German books you'll find the second version; guillemets pointing inside. Sometimes, very rarely, though, you may find them pointing outside (with little to no spacing), which is considered correct as well, and standard in (the German-speaking parts of?) Switzerland, AFAIK.</p>
      <p>Speaking of guillemets: have there been any attempts to introduce them to the English-speaking world? Whenever I write English texts, I'm tempted to use them, for they look so much better, but I can't remember a single English book that used them...</p>
      <p>BTW, this is how Gill does it. He seems to agree that the standard ones are disruptive and lowers the left ones (which is great), but doesn't have the balls to do the same on the right side... looks terrible IMHO.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/gill_5621.png"></div><p></p>
