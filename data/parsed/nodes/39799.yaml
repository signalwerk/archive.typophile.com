      <p>Note on Norwegian... Frode: Well, it's true that only the inches-marks are standard issue on our keyboards, but most text editing software will change it to proper “quotation marks”. And I do think “these” are more common in modern (post DTP-revolution) Norwegian writing than «these», following the American convention…</p>
      <p>Italian, by the way follows the «French» conventions, older German typographers may adhere to the »Danish/Croatian«-style (I think that convention may have originated in Germany, as well, but my mind may be playing tricks on me on that one...)</p>
