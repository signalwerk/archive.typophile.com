      <p>I know that I've seen some English-language books, typeset in Weiss Roman or Palatino, in which guillemets (pointing inwards, in the German style) were used. This is because they were from German publishers.</p>
      <p>Since Germany still uses parentheses the same way most of the world does (I remember one area - was it Armenia? - where they are reversed being discussed here), I'm not surprised, though, that some people are confused and use guillemets the French or Swiss way instead, as suggested by the correspondence in appearance between them and parentheses.</p>
      <p>The typewriter single and double quotes are distinct - in Unicode as well as in appearance - from the symbols for "minutes" and "seconds" as parts of a degree, the former being vertical and the latter being sloped. As far as what the proper symbol for "inches" might be, I would have to find a typeset book on carpentry, or drafting - and, in fact, I would be inclined to look at <em>several</em> of them, not being at all confident that even if there was a proper standard for the symbol, it would in fact be consistently adhered to.</p>
      <p>However, I suspect that the symbol for "minutes" is also used for "feet", and the symbol for "seconds" is also used for "inches". The alternative, using conventional 6699 quotes, would, I think, look jarring, and vertical typewriter-style quotes, while they are what people using typewriters had to use, were <em>not</em> among the sorts available on a Linotype, even though there was a similar-looking character, but not positioned high enough to serve that purpose.</p>
