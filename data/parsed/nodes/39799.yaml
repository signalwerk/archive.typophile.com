      <p><cite> &gt; BTW, this is how Gill does it. He seems to agree that the standard ones are disruptive and lowers the left ones </cite></p>
      <p>Actually, I’m pretty sure Gill didn’t specifically “lower the left ones.” I believe that in this case Gill was employing the approach known as a “turned comma.” One may suppose that at this time, Gill had not cut or cast an opening quote mark for Joanna. In this essay, he has instead taken a comma and turned it 180° to serve as his opening quote mark. </p>
      <p>Because of the position of the baseline on the body (i.e., the ascenders and descenders are nearly the same length), the turned comma in Joanna winds up positioned at about the x-height.</p>
      <p>This was an antiquated practice even then, reflecting the evolution of the quotation mark. </p>
      <p>The apostrophe existed prior to the use of modern quotation marks. During the early development of the [English-speaking] quotation style we’re familiar with today, there was a period of time when the apostrophe doubled as a closing quote mark and a comma was turned to mark the opening. </p>
      <p>In time, as this convention for open and close quote marks took hold, a dedicated opening quote mark was cast to improve the alignment.</p>
