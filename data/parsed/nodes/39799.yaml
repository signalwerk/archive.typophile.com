      <p>Here are the conventions for primary and secondary quotes.</p>
      <p>„Afrikaans, Dutch, Polish”<br>
          ‚Afrikaans, Dutch, Polish’</p>
      <p>„Bulgarian, Czech, German, Icelandic, Lithuanian, Slovak, Serbian, Romanian“<br>
          ‚Bulgarian, Czech, German, Icelandic, Lithuanian, Slovak, Serbian, Romanian‘</p>
      <p>»Danish, Croatian«<br>
          ›Danish, Croatian‹</p>
      <p>«Greek, Spanish, Albanian, Switzerland, Turkish»<br>
          ‹Greek, Spanish, Albanian, Turkish›</p>
      <p>‘British’<br>
          “British”</p>
      <p>“American English, Irish, Portuguese”<br>
          ‘American English, Irish, Portuguese’</p>
      <p>”Finnish, Swedish”<br>
          ’Finnish, Swedish’</p>
      <p>«French»<br>
          “French” or ‹French›</p>
      <p>«Norwegian»<br>
          ‘Norwegian’</p>
