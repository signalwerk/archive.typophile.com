  html: |-
    <p>Hi Everyone,<br>
    I'm a calligrapher and typographer who works mainly with Arabic .. yet I have a lot of tendencies to merge the modern design theory into my work but still in early stages... </p>
    <p>Arabic characters are so organic and complicated compared to Latin characters and the lack of Typography development in this part of the world makes it even harder to explore the field more. so I'm looking here for feedback and critique to my personal works (link below) hopefully it will open my eyes to more inspirational opportunities </p>
    <p><a href="http://majidalyousef.com/" title="http://majidalyousef.com/">http://majidalyousef.com/</a><br>
    check the calligraphy and logotype galleries</p>
    <p>thank you :-)</p>
