    html: <p>Afraid I don't have my sources with me and my memory's hazy, but Aldus Manutius did describe the use of Griffo's new italic font in books <em>ca.</em> 1500, as did the printer for whom Griffo created another italic after he left the Aldine press. Perhaps, though, this is considered prefatory material rather than a colophon, and it certainly wasn't in the modern syntax (e.g., "This book was set in Francesco Griffo's small pica cancellaresca at the Aldine Press"). Still, these were printed notices of the type used.</p>
