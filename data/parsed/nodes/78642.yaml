  html: |-
    <p>I was wondering when it became a custom to include the name of the book's typeface in the colophon... I can't remember seeing a book from pre-WW1 in which the typeface was named -- which is no surprise considering that the variety of available faces wasn't as wide as it is today, and people would call their faces things like "Gewöhnliche Antiqua" (plain roman).</p>
    <p>The oldest book I've seen doing this is from the (late?) twenties, IIRC, so my initial idea was that there might be a correlation with the paradigm shift(s) in typography (Morris, later on Tschichold). But even that seems like an exception to me; it looks more like a post-WW2 thing, but I'm not sure though, and the answer might depend on what parts of the world we're talking about. I could imagine, for example, the Kelmscott Press people did it, too...</p>
    <p>-- Nils.</p>
