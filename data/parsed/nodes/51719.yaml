    <p>Greetings friends!</p>
    <p>I have been a illustrator for quite sometime now and a pro graphic artist + photographer for about five years.<br>
    However I am clearly new to the art crafting fonts.  Don't get me wrong I know the rules of good type habits, but what I want to learn is how to draw them from the ground up.</p>
    <p>Things I need help in</p>
    <p>What type of pen or pens should use?<br>
    What kind of brush is worthy?<br>
    What type of calligraphy pen is good for the job?<br>
    I can not think of anything else, any other information would be appreciated. </p>
    <p>Thanks folks!</p>
