    html: |-
      <p>Best beginner pen... Schaeffer fountain pens, I still use them for commercial work. They flow freely and give you an unimpeeded relationship to the paper.</p>
      <p>Pentel Cartridge brush, the freedom from dip and a good stroke for the money.</p>
      <p>Books are another animal... check with John Neal Bookseller. He has a great selection.</p>
      <p>Michael</p>
