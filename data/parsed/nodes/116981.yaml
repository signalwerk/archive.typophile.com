    <p>John Gruber speculates Apple will show off their in-house designed Apple Sans tonight and use it in both iOS and OS X.</p>
    <blockquote><p>Speaking of typography, I expect the system font to change for the first time since Mac OS X 10.0 back in 2001. (If you want to be pedantic, Lucida Grande has been the system font since the public beta release in 2000.) Helvetica Neue is the obvious choice, since that’s what iOS uses. The wildcard would be Apple Sans (perhaps with a new name), a new typeface Apple has been designing in-house for years. (And if OS X switches to Apple Sans, maybe iOS 8 will too.) Bottom line, though, I think we’ve seen the last of Lucida Grande. </p></blockquote>
    <p><a href="http://daringfireball.net/2014/06/wwdc_2014_prelude" title="http://daringfireball.net/2014/06/wwdc_2014_prelude">http://daringfireball.net/2014/06/wwdc_2014_prelude</a></p>
    <p>Anyone have any intel on if Apple has typographers in-house?</p>
