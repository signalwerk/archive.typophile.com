    html: |-
      <p>There are, perhaps, over all the devices 1,000's of "conditions" in the OS alone and even more once the fonts are employed by apps. Together, this builds and OS's typography out of space, time, color and fonts. Having only seen nips of this preview of perhaps the new OS, is a weakness we all share. And that alone requalifies every opinion I've heard. Some of us, have other weaknesses, like never having worked on one, much less multiple OS typographies, for predicable brand disloyalty, and yet others have delusions of miasma in the plasma...</p>
      <p>The Fast Co. piece is fascinating in that it raises two questions with descendant questions here at FB, that've been asked even before Lucida Grande, and are asked in the development of all RE fonts; When designing scalable digital outline fonts, when should the style be compromised for the size and when should the style be compromised for the resolution, and how? and the other question of course, is; When'll type designers be able to productize this knowledge in size and resolution independent digital outline fonts that can react to conditions in the user's favor, so we do not have to "simplify" every class of every typeface design for each size and for each resolution? ;)</p>
