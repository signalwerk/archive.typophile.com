    html: |-
      <p>The eth is so wrong it's not even funny hehe</p>
      <p>I've had lots of talks via email regarding eths. Some type-designers are very nice and fix the eth after I point it out and send jpg samples for comments. Other have given me lectures about how people like Gunnlaugur Briem don't know how to design fonts and refuse to accept that their eth is wrong. Seriously, I've gotten emails from two of the "top" type-designer that try and dispute me.</p>
      <p>eth is a tough one due to the fact that it's only used in Iceland and Faroe Islands (as I know of)<br>
      I don't blame people for designing it wrong but I try and point it out when i can and hopefully designers will remember some guy sending them an email nagging about some eths or maybe see something about this on Typophile ;)<br>
      Was going to send David Berlow/Font Bureau a note on this.</p>
      <p>Sigurður Ármannsson has some notes on making eths as well: <a href="http://font.is/?p=7" title="http://font.is/?p=7">http://font.is/?p=7</a></p>
      <p>---<br>
      Oscar Bjarna<br>
      <a href="http://analog.sys.is" title="http://analog.sys.is">http://analog.sys.is</a></p>
