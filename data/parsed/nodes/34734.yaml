    date_raw: 27 Jun 2007 — 5:48am
    votes: null
    html: |-
      <p>"I’m still looking for the serif inside the magazine but I don’t have any image of a spread."<br>
      FB TG and Miller are the fonts they use. </p>
      <p><em>The sign of eth is rising in the air.</em></p>
      <p>"If it’s so wrong, how come David Berlow doesn’t know what “eth” should look like? Strange..."<br>
      A thousand fonts might show, but if you don't look, you'll never know. ;)</p>
      <p>I simply asked myself, "Can't a voiced dental fricative <strong>wave</strong> <em>once</em> in a while?"<br>
      Or must it remain erect whilst the entire lower cavity of ones head vibrates? I felt not, and I think this design, radical as it may seem, is better than the look of a straight bar. </p>
      <p>Nevertheless, being but a humble English-speaking tool-maker I'm not in the business of denying whatever erect and proper traditions whatever people require of whatever letters I make and I had no intention of crossing Briem or anyone else on Icelandic issues. If any Faroese, Icelanders, Anglo-Saxons, medieval Scandinavians, iconophiles or customers of any kind need this to be straightened out, by all means, when ordering FBTG add a note to "please Briem-o-matic l.c. eth". Same as if already purchased, we guarantee our eth as if our very eths were at stake.</p>
      <p>"FF Clan, though it’s more modern."<br>
      One of the other things I asked myself long before I got the eth, is "Isn't it time for some nice display sans that <em>do not</em> have gigantic lowercases?"</p>
      <p>Cheers!</p>
