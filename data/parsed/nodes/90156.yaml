      <p>I’m uncomfortable with the italics.<br>
      Italics are a secondary style, so they should not be first in a layout.<br>
      Bold, caps, or small caps would be better.</p>
      <p>It doesn’t hurt to have vertical rules and/or tonal areas for different cells: asymmetric minimalism is a bit vague for tabular layouts, which seems to be the source of your problem.</p>
