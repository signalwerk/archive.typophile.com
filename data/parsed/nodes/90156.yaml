    html: |-
      <p><cite>Uh, what’s the diff?</cite></p>
      <p>Good one. Ideally, there isn't any. </p>
      <p>When I go to the book show at the AAUP national meeting, I always spend more time with the rejects than with the selected books. You can learn a lot about the jurors that way. What you learn isn't always favorable. In a way, a good show is one where the "not selected" books do have some flaws, or at least, in some way aren't quite as good as those selected. There is always a judgement aspect, but I'm not talking about that.</p>
      <p>Be interesting to hear Kent Lew's reaction to being a juror at AAUP.</p>
      <p>A long time ago, I was a juror -- a smaller show, the Rocky Mountain Book Show. Some of the hardest work I ever did. The other (interior) juror was Rich Hendel. I'm proud that we almost completely saw eye to eye.</p>
