    html: |-
      <p>In this case, align on the bottom row. See <cite>Glossary of Typesetting Terms</cite> (Chicago), the appendix on tables. </p>
      <p>Each "row" (level of head) signifies what the head ranges over. In the bottom "row" (level of head), the head ranges over the data (or stub) of individual columns. If you had a squib line, that would introduce a bit different complication.</p>
      <p>Some people view tables as being an exercise in graphic design, some of us as a way to present data. They can do both, but one is primary. Guess which one I pick.</p>
    html_clean: |-
