    html: |-
      <p>From 4′45″ on, Günter Gerhard Lange (1921–2008), then the artistic director at Berthold, is talking to Bernd Möllenstädt (1943–), who took over this position in 1990. At 6′25″, one can have a look-around in the Taufkirchen typedesign studio, with the many nameless women, working in Ikarus at dimly lit Tektronix screens.</p>
      <p>This is the place where Dieter Hofrichter (Hoftype) started his career. In the freshly published interview that Dan Reynolds conducted for MyFonts, Hofrichter talks about this early stage of ‘computer-aided typedesign’.</p>
      <p><a href="http://www.myfonts.de/2012/04/dieter-hofrichter/" rel="nofollow">German version</a> | <a href="http://www.myfonts.com/newsletters/cc/201204.html" rel="nofollow">English version</a></p>
    html_clean: |-
