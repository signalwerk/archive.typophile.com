    html: |-
      <blockquote><p>Were they creating fonts with AutoCad @ 8:05?</p></blockquote>
      <p>No, that’s the Ikarus digitizing system.</p>
      <blockquote><p>For what purpose is the man looking through the "lens" at 7:03?</p></blockquote>
      <p>It’s a reducing glass, it has the opposite effect of a magnifying glass. He’s looking at the drawings through it so he can see them closer to their intended final size.</p>
