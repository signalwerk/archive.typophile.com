      <p>Problem solved.</p>
      <p>I've got now 3 folders in suitcase with the name Dolly.<br>
      Every folder contains:<br>
      •Dolly-Bold<br>
      •Dolly-Italic<br>
      •Dolly-Roman<br>
      •Dolly-Smallcaps</p>
      <p>The difference?<br>
      The first folder contains TTF files<br>
      The second folder contains OTF files<br>
      The Third folder contains Postscript files</p>
      <p>Only the last folder works. TTF or OTF gives both the same problem.</p>
