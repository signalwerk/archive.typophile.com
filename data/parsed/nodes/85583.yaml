      <p>Then the issue was probably due to problems in the name fields. </p>
      <p>I didn’t think that Underware provided formats other than the original Postscript Type 1. If the TTF and OTF were not generated by Underware from original sources, then I wouldn’t be surprised if the name fields got mucked by the translators.</p>
