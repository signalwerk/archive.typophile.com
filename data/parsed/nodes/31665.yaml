      <p>Nice job Werman! You forms, as Hrant sad, are a little uncommon what is preaty good. </p>
      <p>Although some characters like your “X” and “P” had a little different "mood" when compared with the other ones. Too much white into the counters spaces. Especially you X seems to be larger then other characters. May be you’ll need to define some width’s metrics and proportions to apply for all. Not to make characters identical, but to give some similar logic on the process. </p>
      <p>I think that you have a little different proposes between your lowercases and uppercases. The majuscules seems to be more geometrical and modular but you lowercases have a strong organic forms, have you already tried to equalize them? </p>
      <p>Whatever, I liked! It's a good start; make us up to date about it ok?</p>
      <p>Cheers</p>
      <p>e.</p>
