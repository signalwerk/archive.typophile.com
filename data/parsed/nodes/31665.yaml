    html: |-
      <p>The designs are gorgeous, but there's a problem with the the integral forms and the flourish blending too much in the capitals. Consider your <strong>P</strong>, where the narrow verticals separate the body from the loop, or the <strong>J</strong>, whose lower curve sits up very high and looks very similar to a purely ornamental flourish used in other letters. </p>
      <p>Also, be careful with the ornaments that you're putting into the counters of <strong>O</strong> and <strong>Q</strong>. As they're designed now, either one could be seen as a very ornamental <strong>P</strong>.</p>
      <p>If I were you, I would print out a lot of foreign words using these and ask some non-designers to look at it and tell you which letters they have trouble recognizing. That would assist you in determining where the ornamentation is too over the top.</p>
