    html: <p>I would loose the swishy bits until you have your core forms worked out. Not because the the are not essential but instead because you may have too much on your hands trying to keep them intact while you modifying the forms to make them work better. Then afterwards you can make the swishes work to uniformly promote the usefulness of the font rather than sometimes helping &amp; sometimes hurting it as they do now.</p>
