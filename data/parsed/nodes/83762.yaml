    html: |-
      <p>The first thing to do would be to measure the distance between successive baselines on lines of text.</p>
      <p>That gives the type size plus any leading - the upper bound for the type size.</p>
      <p>Then, for an individual line of text, measure the distance from the highest ascenders (or the cap height, if that is higher - it is more often lower) to the lowest descenders. This is the lower bound for the type size.</p>
      <p>(Note that the upper bound can be more easily measured by measuring many lines of text at once; once one has that value, one can then measure the lower bound by using an enlarged image of the text, with the linespacing value allowing one to scale the enlarged image.)</p>
      <p>The upper bound should be an integral number of points, while the lower bound may not be: round it upwards to the next nearest point.</p>
      <p>That may not really be the right answer, but without access to the metal bodies of the type used to print the book, it's about the best one can obtain. (Of course, one can try hunting up the type specimen books of whoever produced the type used - in many cases, the question <em>can</em> be settled with accuracy.)</p>
