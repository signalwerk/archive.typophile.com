      <p>I've wrote some program to calculate font space usage: you could calculate »standard width« (multiplying character frequency times width) times line spacing. Line spacing e. g. maximum character hight (ascender to descender) (depends on used alphabet, of course) plus x-height.</p>
      <p>Now you could calculate: at wich point size i will match TimesNewRoman 12pt?</p>
      <p>With those data, an XeLaTeX-Document is easily created - allowing fast comparison of font appearance.</p>
      <p>Kind regards, the</p>
