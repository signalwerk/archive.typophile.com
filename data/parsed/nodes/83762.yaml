      <p>Type gauges only and exclusively work well with single typefaces, i.e., you cannot use a type gauge marked with Helvetica in different sizes to measure Times.</p>
      <p>I always find it quicker and more reliable to copy one or more words in that font, and then measuring its length, rather than the height. Then all you need is a regular ruler.</p>
