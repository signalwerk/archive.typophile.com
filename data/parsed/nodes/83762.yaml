    html: |-
      <p><cite>All I'm trying to do is find what point size and leading for Garamond is used in some books I like and don't like, to get a better idea of what will work for my design, but I'm not sure if I'm aligning the type correctly with the gauge to get the right answers.</cite></p>
      <p>Do you have the exact same version of Garamond? (That's important. If not, there is no point in measuring, because the internal measurements vary wildly between fonts; and then you might as well gauge it by eye.)</p>
      <p>If so, do the following:<br>
      1º Find a very long word -- something like "somnambulance". That works better than a phrase with spaces, because justification might throw off your measurements.<br>
      2º Measure how <em>long</em> this is. It might be around 21 mm.<br>
      3º Using your DTP software, draw a horizontal line of 21 mm long.<br>
      4º Type the word underneath it and adjust the size until it's about the same length.</p>
      <p>The length will be "about" the same because there are lots of factors in 'measuring type'. For instance, the printed material may have been tracked (positive or negative), or scaled horizontally, or the font used may be a different version, or you forgot to allow for some side bearing at the start and end of the word. Nevertheless, it's <em>fairly</em> unusual to see type in print with a size of, say, 9.3676 pt, and it's reasonable to round up or down to the nearest whole or half point.</p>
