    <p>Hi</p>
    <p>I was wanting some help to identify the font used in Dazed and Confused. It is used on all headers (not mast head) for example in the visual "the independent state of kate".</p>
    <p>I have checked it against Chevin and there are slight differences with the n. Would be great for help.</p>
    <p>Cheers</p>
