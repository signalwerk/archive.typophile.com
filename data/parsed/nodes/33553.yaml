    html: |-
      <p>It seems to be a bit too late (an probably unimportant) but I don't think that is Typ1451<br>
      I believe it is 'GravoStyle Basic' released by Optimo not too long ago.<br>
      <a href="http://www.optimo.ch/pages/departement/view_font.php" title="http://www.optimo.ch/pages/departement/view_font.php">http://www.optimo.ch/pages/departement/view_font.php</a></p>
      <p>The differences are small, but if you look toward the bottom of the cover (I know it is tiny), at "Derek" you can see the "D" is more squared than the D of Typ1451, much like DIN 17 that Stephen pointed to.</p>
      <p>By the way, GravoStyle also has Regular, Bold and Black weights, plus italics for each.</p>
      <p>Anyway, just my 2¢</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typ_Rubdown_dazed_6147.jpg"></div><p></p>
