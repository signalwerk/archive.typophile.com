    html: <p>TT is superior to T1 because it offers much better hinting and more than 256 glyphs. <br> <br>T1 is superior to TT because the cubic beziers generally have fewer points and can provide better quality. <br> <br>As far as T1 being obsolete...that's technically wrong.  T1 as we know it today, with the .pfm and .pfb (screen fonts and suitcases on the mac side) files will eventually become obsolete.  But the basics of the T1 format still live on inside of Opentype.  Opentype .otf files are T1 outlines inside of an Opentype wrapper.  While it supports the extended glyphs it doesn't support the advanced hinting that you get with standard TT fonts or TT fonts with an Opentype wrapper (which are still shown as .ttf and not .otf)</p>
    html_clean: <p>TT is superior to T1 because it offers much better hinting and more than 256 glyphs. <br> <br>T1 is superior to TT because the cubic beziers generally have fewer points and can provide better quality. <br> <br>As far as T1 being obsolete...that's technically wrong.  T1 as we know it today, with the .pfm and .pfb (screen fonts and suitcases on the mac side) files will eventually become obsolete.  But the basics of the T1 format still live on inside of Opentype.  Opentype .otf files are T1 outlines inside of an Opentype wrapper.  While it supports the extended glyphs it doesn't support the advanced hinting that you get with standard TT fonts or TT fonts with an Opentype wrapper (which are still shown as .ttf and not .otf)</p>
  - id: 20119
