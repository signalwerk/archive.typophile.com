  - id: 20100
    user: 2021
    date: 2003-12-21T14:50:00
    date_raw: 21 Dec 2003 — 2:50pm
    votes: null
    html: <p>Well William, I recommended Adobe Garamond as the "full sort" typeface. That was a couple years ago, before OT was so viable. Now there is a larger choice of typefaces that have all the bells and whistles. <br> <br>Also, my list was for an educational establishment, and as you say William, individuals should personalize more. <br> <br>I've been using Adobe Garamond since it came out. It was the first digital font with all the typographic goodies, and I loved it. As I say in my article, it restored the diginity of the Garamond line. <br> <br>However, I recently received a book of poetry from a friend (the designer) who had set it in Adobe Garamond, and it has become so overexposed it just looked so bland and like a corporate brochure, I couldn't bring myself to read it. <br> <br>Myriad I recommended as the most affordable extended-family sans, which was true. However, I have become increasingly anti-Adobe recently (primarily for their marketing policies, and that tends to color my feelings towards their type designs), and sensitive to plagiarism, and am now very critical of Myriad (along with FF Transit and Prima) as a knock-off of Frutiger. <br> <br>So, in my list of recommendations, I compromised for affordability. Damn, it's so easy to get corrupted by money. <br> <br>OK, you're right, Thomas did identify his bias, but he went ahead and used the phrase "amazing deal" anyway, as if identifying one's bias makes it then OK to be a total hypemeister.  <br> <br>The Display and Novelty fonts in the Adobe Type Classics for Learning are a terrible collection of cliches. Did Adobe actually consult with anyone in Education before putting together this collection? I doubt it. <br> <br>While I'm on this hobby horse, many of the Type Classics are not even remotely classic! Chapparal, Warnock, Cronos, Nueva?  Perhaps Myriad, Minion can be considered to have become classics recently, but in general the name of this package is somewaht misleading -- hardly the way to package a product for education. <br> <br>In fact, some of the only classics here are those that Adobe elsewhere identifies as Adobe Originals -- Caslon, Jenson, Garamond. Talk about NewSpeak!</p>
