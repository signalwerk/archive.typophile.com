    html: "<p>I work at Adobe, but I honestly believe this is an amazing deal for somebody in exactly your situation. For students who are interested in serious typography, who also use InDesign and Illustrator, OpenType fonts with bells and whistles are of particular interest. In this area (or even without the OpenType angle) there is really one outstanding foundational choice, which is Adobe Type Classics for Learning. <br> <br><a href=\"http://www.adobe.com/education/ed_products/typeclassics.html\" target=\"_blank\">http://www.adobe.com/education/ed_products/typeclassics.html</a> <br> <br>Full list of fonts is here: <br><a href=\"http://www.adobeforums.com/cgi-bin/webx?50\" target=\"_blank\">http://www.adobeforums.com/cgi-bin/webx?50</a>@<a href=\"mailto:29.VqUAbAGuOWS.0@.1de6de55\">29.VqUAbAGuOWS.0@.1de6de55</a> <br> <br>Only for students: over 400 fonts, only $99. All families represented are complete, in that all weights, widths and optical sizes Adobe has available are present. <br> <br>I'd be really curious to hear some of the other folks on the list evaluate some of the options presented. <br> <br>T</p>"
