    html: <p><i>I thought CFF was a form of compression?</i> <br> <br>It is compact -- hence the name, Compact Font Format --, but it is not simply a compression of a Type 1 font. CFF uses Type 2 charstrings. <br> <br><i>And doesn't Fontlab let you edit in native truetype?</i> <br> <br>Yes, but you work directly with the TT outline format, which doesn't include any ability to assign properties to on-curve points such as one has in PS editing. My point is that it would be possible to design an editing layer on top of the native outline that would make it easier to work with TT outlines. For example, at the moment if you want a smooth transition through an on-curve point on a diagonal you have to put in a guideline and manually make sure that appropriate points are aligned along it; there is no way to define a point as a smooth transition in the TT format, but that doesn't necessarily mean that one shouldn't be able to for editing purposes. I was discussing this a couple of years ago with Sampo Kaasila, the inventor of TrueType, and he expressed surprised that no one had made a really good and easy to use TT editing environment.</p>
    html_clean: <p><i>I thought CFF was a form of compression?</i> <br> <br>It is compact -- hence the name, Compact Font Format --, but it is not simply a compression of a Type 1 font. CFF uses Type 2 charstrings. <br> <br><i>And doesn't Fontlab let you edit in native truetype?</i> <br> <br>Yes, but you work directly with the TT outline format, which doesn't include any ability to assign properties to on-curve points such as one has in PS editing. My point is that it would be possible to design an editing layer on top of the native outline that would make it easier to work with TT outlines. For example, at the moment if you want a smooth transition through an on-curve point on a diagonal you have to put in a guideline and manually make sure that appropriate points are aligned along it; there is no way to define a point as a smooth transition in the TT format, but that doesn't necessarily mean that one shouldn't be able to for editing purposes. I was discussing this a couple of years ago with Sampo Kaasila, the inventor of TrueType, and he expressed surprised that no one had made a really good and easy to use TT editing environment.</p>
