    html: <p><i>That leaves a lot of mighty usable, popular, and desireable non-OT faces out there, don't you agree?</i> <br> <br>I didn't say that Type 1 fonts are obsolete in themselves -- they are still widely supported and useable and, yes, there are still lots of fonts that are only available as Type 1. What I said is that the <i>format</i> is obsolete, but which I mean it a) has been superceded by a superior format (superior in all the ways that TT has always been superior, and also smaller and more efficient, a single cross-platform binary, etc.), b) is inherently limited to 8-bit codepage support in an increasingly Unicode text processing environment, c) fails to take advantage of new features in major applications and systems. Continued support for the Type 1 format must be understood as backwards-compatibility support. When I said Type 1's days were numbered, I meant that this backwards-compatibility support is not going to continue indefinitely. My guess is that MS will be the first to stop offering system support for Type 1. Then either Adobe will have to restart the ATM programme (unlikely, since they want to kill off Type 1), or some third party will provide a user-installable Type 1 rasteriser (FreeType?), or Type 1 simply won't be useable on Windows. The history of type is littered with dead font formats, many of which were once the dominant formats for entire industries. Just because you have a lot of Type 1 fonts doesn't mean they're going to be supported forever.</p>
