    html: <p>Hype is hype (ie exaggeration), irrespective of intent. <br> <br>Given Adobe's near monopolistic position in  type distribution for professional graphic designers, it's hard to consider Adobe Type Classics for Learning to be an "Amazing Deal" -- it's their usual deal, giving away fonts for next to nothing. Is anybody really amazed any more that they do this? <br> <br>I would be pleasantly surprised if they had consulted with several leading typographic educators, and put together a package that showed more taste, restraint and accuracy.  <br> <br>Actually, a few years ago, I would have expected that. In the little "Adobe Type Library" catalogs (Type Guide), there is a very useful exposition of type styles; these categories could have been in some way integrated with a selection of Typefaces for Learning -- that would have been a more serious approach to education.</p>
