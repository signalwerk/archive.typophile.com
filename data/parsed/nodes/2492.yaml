    html: "<p>The Adobe Classics for Learning is an amazing value, a must have if you are a student.  <br> <br>Nick Shinn's list is wonderful in having very high quality fonts with different looks and feels, and serving many needs, but it would cost way more. <br> <br>You might consider getting Adobe student collection, and then start adding by looking at Houses with different aesthetics to supplement: brouse the libraries of FontBureau, Emigre, FontFont. And then look at the fonts of individuals, such as those who post here. Don't fail to look at the Dutch houses who are supurb and an education just to look at, even if you can't afford them. <br>   <br> <br> </p>"
