    html: "<p>Nick, you yourself recommend Adobe Garamond and Myriad in your list. The $99 for the student deal gets you those and more. <br> <br>Not being in this game I have a different perspective: I would be glad to hear from you pros what you think is your best stuff - and that of others. I don't see anything wrong with it.  <br> <br>Your list is really interesting, and includes one of your own. And I don't think you were being a 'huckster'. <br> <br>When people have poured their heart into producing something of value, I just don't see why they can't say they love it, even though it is for sale. We are smart enough to take into allowance the source, and discount accordingly.  <br> <br>In the case of Thomas, he identified his bias, and to me that makes his recommendation very fair and above board. Same with Giampa. People can look and make up their own minds. Advertising is just not 'dirty', so long as it is honest. <br></p>"
