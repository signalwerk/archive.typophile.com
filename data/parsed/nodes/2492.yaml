    votes: null
    html: "<p><i>But the basics of the T1 format still live on inside of Opentype. Opentype .otf files are T1 outlines inside of an Opentype wrapper.</i> <br> <br>No, that is not correct. PS-flavoured OpenType fonts contain CFF format font data, not Type 1. Yes, the two are related and both use the same kind of cubic bezier outlines -- although expressed in a different way in the binary --, but CFF is a different font format. This is really obvious when you consider that CFF and Type 1 require different rasterisers. This is why I suspect MS will be the first to ditch Type 1 support: they don't want to maintain three different system rasterisers, one of which is for a format that they consider inferior and obsolete. <br> <br>One of the key things that made TT superior to Type 1 from the beginning is the extensibility of the sfnt font structure. The table structure of the sfnt format is what makes OT fonts possible; without it, we wouldn't be able to have a single binary format capable of containing different outline types. Type 1 fonts were a developmental dead end.</p>"
    html_clean: "<p><i>But the basics of the T1 format still live on inside of Opentype. Opentype .otf files are T1 outlines inside of an Opentype wrapper.</i> <br> <br>No, that is not correct. PS-flavoured OpenType fonts contain CFF format font data, not Type 1. Yes, the two are related and both use the same kind of cubic bezier outlines -- although expressed in a different way in the binary --, but CFF is a different font format. This is really obvious when you consider that CFF and Type 1 require different rasterisers. This is why I suspect MS will be the first to ditch Type 1 support: they don't want to maintain three different system rasterisers, one of which is for a format that they consider inferior and obsolete. <br> <br>One of the key things that made TT superior to Type 1 from the beginning is the extensibility of the sfnt font structure. The table structure of the sfnt format is what makes OT fonts possible; without it, we wouldn't be able to have a single binary format capable of containing different outline types. Type 1 fonts were a developmental dead end.</p>"
  - id: 20120
