  html: "<p>Apologies in advance if this has been covered before.  If so, please refer me to the thread and this will die a quiet death. <br> <br>If not, what are your recommendations?  I've basically just got the fonts that came with my computer, plus a few free fonts I was able to find.  What fonts are essential for a collection?  What fonts will be most widely useful in graphic design?  What packages are cost-effective? <br> <br>Please keep in mind that many people (read: me) cannot afford the wishlist fonts.  I'm just trying to figure out a good, cheap starting point.  Concurrently, if there are any font-purchasing strategies to avoid, please let me know.</p>"
  html_clean: "<p>Apologies in advance if this has been covered before.  If so, please refer me to the thread and this will die a quiet death. <br> <br>If not, what are your recommendations?  I've basically just got the fonts that came with my computer, plus a few free fonts I was able to find.  What fonts are essential for a collection?  What fonts will be most widely useful in graphic design?  What packages are cost-effective? <br> <br>Please keep in mind that many people (read: me) cannot afford the wishlist fonts.  I'm just trying to figure out a good, cheap starting point.  Concurrently, if there are any font-purchasing strategies to avoid, please let me know.</p>"
