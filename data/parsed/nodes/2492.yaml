    date_raw: 22 Dec 2003 — 6:22pm
    votes: null
    html: <p><i>T1 is superior to TT because the cubic beziers generally have fewer points and can provide better quality. </i> <br> <br>Cubic beziers require fewer points to define the same -- or very similar -- curve. The actual quality of the curve depends on how many points you want to use and, indeed, what kind of curve you want. The main advantage of cubic beziers is that they are easier to design with, but that has always struck me as a tool issue. It is possible to conceive of a native TT outline editor that would allow you to assign editing properties to points in the same way as you can specify a PS node as being smooth or tangent. Of course, the advantage of the TT quadratic b-spline outline is that both on- and off-curve points can be addressed in hinting.</p>
