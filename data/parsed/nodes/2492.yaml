    html: <p>What software are you using? Do you have page layout software such as InDesign, or will you mainly be working with word processing software such as Word? Also, what operating system are you using? This will determine whether it makes most sense for you to buy OpenType fonts or 8-bit Type 1 or TT fonts. <br> <br>I recommend investing in one full-featured family with a good range of weights and with smallcaps, ligatures, swash letters, etc. This will give you more practical flexibility than a lot of different fonts which don't have all the bells and whistles you need to do decent typography.</p>
