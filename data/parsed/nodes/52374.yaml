    date: 2008-12-09T07:52:00
    date_raw: 9 Dec 2008 — 7:52am
    votes: null
    html: |-
      <p>I wrote an e-mail to Radim Pesko and he graciously sent back this  reply and image.</p>
      <p>"The font is called 'Larish' and was indeed drawn specially for<br>
      Secession identity which was developed together with Willi Schmid,<br>
      in 2007-2008. Its appearence is inspired by an old prints from<br>
      Vienna of late 19th century. Even it is not re-drawn typeface,<br>
      its shape it true to the spirit to its example.<br>
      Larish will be completed with italic released in Spring 2009."</p>
      <p>- Mike Yanega</p><div class="imageWrap"><img src="http://typophile.com/files/spec040307small_3555.gif"></div><p></p>
