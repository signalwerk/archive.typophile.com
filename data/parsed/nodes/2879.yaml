  html: "<p>Somebody's figured out a way to output vector images via <a href=\"http://www.hektor.ch\" target=\"_blank\"> spray paint!</a> <br> <br>I can see it now: graffiti artist start outsourcing the designs to <a href=\"http://www.wired.com/wired/archive/12.02/india.html?tw=wn_tophead_8\" target=\"_blank\"> India</a> to Increase production. <br> <br>The resolution's pretty good. I think it's about 3dpi (drips per inch <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">). Click on the jpeg link to see how it handle type. But to really see it in action, check out the mpeg. <br> <br>Fairwarining: when you click on the jpeg link it brings up about ten or so pop ups of sample work, each in their own window. <br> <br></p>"
