    <p>Dear Typophiles,</p>
    <p>I donated an experimental display typeface to my favorite web-radio-station <a href="http://www.dublab.com/protondrive/">dublab</a>.</p>
    <p>But I'm not really helping them with their fund-racer without putting some music loving type-designers on this subject. So I should do some rude self-promotion: By donating an amount over 50$ you will get a price-package in retune which as well contains an exclusive mix-cd by dublab-dj <a href="http://www.jimmytamborello.com/">Jimmy Tamborello</a> (a.k.a. Dntel, The Postal Service, James Figurine).</p>
    <p>I originally designed this font for the audio-visual exhibition <a href="http://www.intoinfinity.org/">Into Infinity</a>. My contribution is also posted on my <a href="http://www.ewalthert.com/">frontpage</a>.</p>
    <p>My sounding Typeface:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SonicWaves_abc400_5967.jpg"></div><p></p>
    <p>And the funny thing, it will come with a folder of sound-files:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SoundEditor_3894.png"></div><p></p>
