      <p>Hi All,<br>
      One thing that annoys me about Win 7, is that it installs about 500 MB of foreign language fonts (mostly East Asian) and I had a hard time to get rid of them. I had to fiddle with user/folder/account/login permissions, some of them seem to be allways "in use" by the system, and what not ...<br>
      Dont't get me wrong. I totaly agree with a system supporting good fonts for all languages. But as a big fan of lean font menus (and a lean system in general), I just don't see the point of having that amount of fonts, wich I will never, ever use for my typographic work.<br>
      At least, I wish Adobe applications would support the show/hide feature of Win 7. But they don't seem to care or am I doing something wrong?<br>
      So, sorry for ranting in my very first post here. Just got two hours of Win-7-font management done ;)</p>
