      <p><cite>Not to mention that Apple has done little architecturally to improve on screen rendering or the text layout engine.</cite></p>
      <p>My really-big-prediction-that-may-never-come-true is that the One True Solution to screen rendering is to ditch low-res screens (72-96ppi) and use a resolution independent GUI. To accomplish this will require insane hardware requirements and an ability for the system to resample/resize all bitmaps on the fly. Around 2000, Apple switched to OS X, forcing users to pretty much abandon all the software they had and endure a painfully slow new system. MS couldn't afford to do this, and we ended up with Vista. The same thing could play out again if Apple runs out of feature ideas and needs to sell more computers. A lot of what they're doing with streamlining APIs and moving GUI elements to the GPU seems to be in this direction. If so, the advantages will all show up at once in the form of a 300ppi screen, making hinting technologies obsolete.</p>
