      <p><cite>Microsoft has been “giving a crap” about fonts much more and much longer than Apple. As for praying, if you’re not seeing this, I don’t think you can ever be swayed from your apparent “platform religion”.</cite></p>
      <p>The thing is hrant, some of these gee-wiz features are already in the shipping version of Mac OS and have been for some time. For example font files currently preview at the Finder level in Leopard. Fontbook can turn off fonts without removing them, etc. The fact is Apple will probably release at least one more version of OS X before 7 ships. The current version of Windows(Vista), still uses the Add Fonts dialog from the 90s. Bundling more and more fonts with the product is fine, but I might point out that this is something that often annoys Mac users. </p>
      <p>Gabriella is a beautiful font btw, and I'm sure most Typophiles will be glad to have a copy.</p>
