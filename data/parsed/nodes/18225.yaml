    <p>The scenario:<br>
    I opened a weight of a typeface I started in FL-4.6 Mac and am now working on FL-5.01 Mac. I then edited the file including making changes to kerning. I saved the file and renamed it. Then, I output the file as a OTF PS flavor. A dialogue (see first image) pops up asking me if I want FL5 to convert the kern feature since I made changes. I click yes. A status bar pops up showing progress that moves swiftly until it reaches 92% (second image below). Then, FL5 hangs with a spinning beach ball and freezes their forever. After waiting a millennium, I went to the Finder and force-quit FL5.<br>
    Next I reopened FL5 and the file and tried it again with the freeze at the exact same 92% spot. Undaunted, I force-quit FL5 again and reboot and start the thing over again. It freezes again exactly as it did the other times,<br>
    Then, I start over as before with one exception; when the dialogue box asks me to rebuild the kern feature this time, I say NO. The OTF font file gets built perfectly this way and in jiffy time. I check the kerning in Adobe InD CS and the kerning corrections that I had done were all made and everything is just jim-dandy.<br>
    Whahhzzzup? Is this just me or is this a bug in FL5 Mac?</p>
    <p>ChrisL</p>
    <p></p><div class="imageWrap"><img src="/files/rebuild-kern.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/92-percentbar.png"></div><p></p>
