    html: |-
      <p>I shall add that since version 4.0, FontLab has been using the Adobe FDK for OpenType code to generate the OpenType Layout tables, including the “kern” feature. So from the same .fea syntax defining OpenType Layout features you will get the same binary tables — no matter whether you use FontLab/FontLab Studio, DTL FontMaster or the stand-alone Adobe FDK for OpenType. </p>
      <p>A.</p>
