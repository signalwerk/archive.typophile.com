      <p>Mark, to complete the picture: I don’t use kerning assistance either, and I don’t do my kerning in the Metrics window, but write a class-based OpenType kern feature. And I still get that message.</p>
      <p>Chris, good luck.</p>
      <p>I have posted only the kerning relevant stuff from my recent “Apex New” font here:<br>
      <a href="http://www.vllg.com/files/OpenType_kerning/" title="http://www.vllg.com/files/OpenType_kerning/">http://www.vllg.com/files/OpenType_kerning/</a></p>
      <p>You can save this text as a .fea file, import it through the OpenType panel of FLS, and compile yourself an OpenType kern feature. (Note that there lots of accents and small caps, so you’ll need to go through the kern classes to edit to your font’s glyph set.)</p>
      <p>Also note that this method requires that you clear out your Classes and Collections panel; everything resides in the OpenType panel.</p>
