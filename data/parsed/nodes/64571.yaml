    <p>Greater Albion has just posted design concept illustrations for two forthcoming releases on their <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
    <p>Adantine is a display face in late Victorian decorative style, gently oblique and with a sense of refined movement, all capitals of a single height but with subtle distinctions between the ‘upper’ and ‘lower’ case glyphs.  It offers an air of delicate distinction combined with legibility.</p>
    <p>Corvone takes us to the heady days of the 30s and the heights of Art deco.   It’s heavy, forceful and clear and yet has a subtle sense of fun.  It lets you shout loudly in a refined sort of way!</p>
