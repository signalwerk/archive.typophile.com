      <p>If that large number is the date, then that’s far off in the future! :-&gt;<br>
      (If not, it’s confusing.)</p>
      <p>Other than that: Cool, clean, neat. The type treatment seems to go very nicely with the image I think. </p>
      <p>I *think* I’d prefer the right hand version, but it’s hard to tell like this. Can you maybe put a border around the actual page size?<br>
      (In any case, the “»” arrows/guillemets are better with a space after them.)</p>
      <p>Oh, and I don’t know how it is in other languages, but you might want to put at least a thin space after the periods in the date, on the right side.</p>
      <p>EDIT/PS: It would probably have been better to post this in the Critique -&gt; Typography section, for the next time :)</p>
