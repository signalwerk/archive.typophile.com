    html: |-
      <p>It’s trying to be a text face, so the glyphs aren’t supposed to be pretty (and I personally don’t think they are). In my view if the glyphs are pretty there’s something wrong.</p>
      <p>Being a text face (as much as a sans could be), unless one accepts what Legato is trying to do, the only way somebody can mean something like “I don’t think the reversed contrast stuff works” is to actually read text set in Legato. Otherwise it’s probably the typical conservative reactionarism. The old “It’s different than what I’ve already decided I like, so it must be bad.”</p>
      <p>hhp</p>
