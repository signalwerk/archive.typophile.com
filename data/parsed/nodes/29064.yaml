    html: |-
      <p>I recently checked out the Manders book from UCLA. Yes, I could be imagining the following because I admittedly want it to be true, but Legato does seem to transcend the black and make a setting part of a whole with the paper (and not just on the cover where it’s debossed). Looking at the various large-size settings throughout the book it’s notable that I seem to feel a gentle resistance to my picking out of individual letters to analyze... This is good news for notan.</p>
      <p>Sadly the only smaller-size settings in the book are in Balance for some reason, so any first-hand evaluation of Legato’s real-world readability (as nearly hopeless as that would be, especially for somebody like me who’s so concerned with it) will have to wait.</p>
      <p>hhp</p>
