  html: <p>This is another of my current projects - a sans that is gothic in structure, but with some improvisations. The q and g speak for themselves. The alphabets aren't finished and some letters need work, but I'd like to know what people think. <br> <br>[The name is not permanent, by the way.] <br><img src="http://www.typophile.com/forums/messages/29/10530.gif" alt="coquitlam"> <br> <br>Paul D</p>
