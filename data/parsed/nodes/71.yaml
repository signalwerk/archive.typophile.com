    html: "<p>Hi Paul. <br> <br>I Like what you're up to here. It certainly has more character than what I was up to in my thread. The highlights I think are the unicase q and the g. The ear is fantastic!  <br> <br>A couple of thoughts: <br> <br>1) Your rounds need to extend beyond the baseline/x-height in order to optically sit on the baseline. (a,b,c,d,e,g,p,q,s,u). <br> <br>2) The s and A look light, also give a little extra weight to the vertical parts of your rounds (ie. so the left and right sides of the o (c &amp; e) opticaly match the width of the stem of the b etc. <br> <br>3) Try the diagonal ends on the t and f at slightly less of an angle. Maybe apply this idea to other terminals (r, s) <br> <br>4) The e is going to close up at small sizes. Try giving it more room at the top. <br> <br>Good start! <br>Randy</p>"
    html_clean: "<p>Hi Paul. <br> <br>I Like what you're up to here. It certainly has more character than what I was up to in my thread. The highlights I think are the unicase q and the g. The ear is fantastic!  <br> <br>A couple of thoughts: <br> <br>1) Your rounds need to extend beyond the baseline/x-height in order to optically sit on the baseline. (a,b,c,d,e,g,p,q,s,u). <br> <br>2) The s and A look light, also give a little extra weight to the vertical parts of your rounds (ie. so the left and right sides of the o (c &amp; e) opticaly match the width of the stem of the b etc. <br> <br>3) Try the diagonal ends on the t and f at slightly less of an angle. Maybe apply this idea to other terminals (r, s) <br> <br>4) The e is going to close up at small sizes. Try giving it more room at the top. <br> <br>Good start! <br>Randy</p>"
