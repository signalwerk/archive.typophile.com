    html: <p>Thanks, Randy!  Good suggestions. <br> <br><i>1) Your rounds need to extend beyond the baseline/x-height in order to optically sit on the baseline. (a,b,c,d,e,g,p,q,s,u).</i> <br> <br>I usually do these adjustments in Fontlab once I have all the glyphs designed. I'm still in Illustrator Phase right now.  <br> <br><i>3) Try the diagonal ends on the t and f at slightly less of an angle. Maybe apply this idea to other terminals (r, s) </i> <br> <br>Good idea! <br> <br>Paul</p>
