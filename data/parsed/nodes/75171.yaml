    html: |-
      <p>Upon further research I realize what a historic font Perpetua really is.<br>
      It's classic, elegant, light, recognizably British, versatile, serene and subtle...<br>
      I'm kind of glad that I'm doing Perpetua for my animatic.<br>
      I was thinking of incorporating Gill's line drawings into my animatic if I was to focus on the creative attributes of the font.<br>
      But now this project seems like a lot of fun.<br>
      Thank you for all your help</p>
