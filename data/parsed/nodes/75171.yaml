      <p></p><div class="imageWrap"><img src="http://typophile.com/files/avisad_5153.jpg"></div><p></p>
      <p>This is a full page ad (8 1/8" x 10 7/8") that ran in magazines like Playboy in the late 1960s, art directed by Helmut Krone, written by Paula Green. "No. 1" (Hertz) is never mentioned. It was kinda ballsy to set the entire ad in Perpetua Bold, 18 or 24 pt text. But the effect is nonetheless very literate and classy -- no clutter such as logos and other branding.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Unknown_4807.jpeg"></div><p></p>
