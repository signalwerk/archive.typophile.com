      <p>EDITED:<br>
      Bob, as for the pointy _A_, I feel that if it was appropriate for Adrian Frutiger to use in a lettering design for Electricite de France -- a rather big corporation with a presumably conservative ethos -- it's probably right for the design. I note that the somewhat similar squarish sans, Bank Gothic, has a pointy _A_.<br>
      Alphabet EDF-GDF has innovations -- unless someone knows of an earlier design with them -- that include the unusual notchless transition from the vertical stroke to the top stroke on _n_, _m_ and _r_, and similar notch free treatment of other letters such as _b_, _d_, _g_, _h_, _p_, _q_, and _u_.<br>
      The search continues.<br>
      Don</p>
