    <p>In 1964-6 Adrian Frutiger created Alphabet EDF-GDF for Electricite de France as transfer letters made by Esselte Letraset. Alphabet EDF-GDF was also used on corporate stationary and signage.<img src="/sites/default/files/old-images/AlphabetEDF-GDFFrutiger_6507.jpg][img:sites/default/files/old-images/AlphabetEDF-GDFCharsetFrutiger80pct_6714.jpg"><br>
    The images are from _Adrian Frutiger – caractères: L'œuvre complète_ Heidrun Osterer, Philipp Stamm, Fondation Suisse Caractères et Typographie Walter de Gruyter, Jan 1, 2009<br>
    AFAIK there is no publicly available digitization under the name Alphabet EDF-GDF.<br>
    I seem recall that there are some similar digital fonts, which probably give no credit to M. Frutiger, perhaps buried in a techo or sci-fi catergory.<br>
    Any suggestions?<br>
    Thanks.<br>
    Don</p>
