    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vorschau_sintesisans_01_4041.jpg"></div><br>
    New member of the Sintesi Superfamily. <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vorschau_sintesi_01_6480.jpg"></div><br>
    Existing font Sintesi.<p></p>
    <p>Sintesi diffears from the usual conformation of a Megafamily.<br>
    Strictly speaking are both Sintesi and the new release semiserif fonts. </p>
    <p>Indeed the two sisters could not be different. While Sintesi unfolds its traditional character, its strong contrast and the perceptible feather-ductus the new release features robust and contemporary forms.</p>
    <p>Which naming do you consider appropriate to describe this situation? Thanks for your vote and suggestions.</p>
