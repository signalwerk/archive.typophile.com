    html: <p>I could not get LyX 2.0RC2 to output PDF through XeTeX if I had any system (i.e. non-TeX) font installed. They just put out RC3 tonight, and I'm trying again with this new install. In the meantime I've made some progress learning my way around LyX. Once the XeTeX part of it works reliably in Windows, it will be the first serious open source Opentype-savvy Windows publishing application available.</p>
