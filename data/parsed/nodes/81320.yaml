  html: |-
    <p>LyX 2.0 is currently in RC3. You can download source (but not precompiled binaries yet) from LyX.org.</p>
    <p>More detail on new features <a href="/wiki/here." class="freelinking" rel="nofollow">http://wiki.lyx.org/LyX/NewInLyX20#xetex</a></p>
    <p>Essentially, by this time a month from now, you should be able to download a version of LyX which both allows you to create documents using any font installed on your system, and allows you to apply OpenType features. You’re still at the mercy of TeX’s content-centric way of thinking, so the app is best suited for long text-centric documents like books and articles with a finite set of styles that you customize, and is of course a bad choice for advertising layouts. But managing a separate set of TeX-enabled fonts in a bunch of text files will be a thing of the past once the XeTeX incorporation is finished. I am cautiously optimistic.</p>
    <p>In other news, there is an upcoming Google Summer of Code project to add OpenType feature access inside OpenOffice.org.</p>
    <p>As for Scribus: Scribus forum administrator Christoph_S wrote <a href="/wiki/this" class="freelinking" rel="nofollow">https://bugs.scribus.net/view.php?id=1413</a> on Oct 24 last year:<br>
    “Yes, and we had to create a separate branch that's not even publically accessible, because major parts of the code have to be torn apart and rewritten. The changes are so big that we’re currently glad if the code can be built, which doesn’t mean that it already works as expected. Expect first usable results next year, at the earliest, when the dust has settled.”</p>
