    <p>I went to see an exhibition today on the life of women in Helsinki 100 years ago. In one room there was an old aluminium pawn shop sign which stated opening times as: 10–1/2 4, that is 10 to 15.30. In Finnish, puoli neljä (puoli = half, neljä = 4) is the same as half past three, but I've never seen it written like the sign in the museum. Unfortunately I was not allowed to take pictures there, I would've loved to show it to you!</p>
    <p>Below is a very rough reconstruction of the essence of the sign (as per requested by Chris!)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/panttilainaamo_3614.jpg"></div><p></p>
