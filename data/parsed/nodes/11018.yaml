    html: <p> One problem with the "S", especially in the versions where the top arm stretches across above the other characters, is that (to my eye) the resulting design reads as "CREAM" with a frame-like flourish rather than as the intended "SCREAM". <br> <br>The rest of the design looks great, though. I especially like the font used for "cutz+buzz". <br> <br>David </p>
