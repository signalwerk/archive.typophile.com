    html: <p> I love the curiousity to explore the letterforms of a font out of the box. SuperDuper is really nice and most designers would have just settled, but you took it further. Kudos. <br> <br>Flipping lc 'a' and 'e' as part of the exploration, reworking the uc 'R' and notching the lc 'e' is nice.  <br> <br>One letter pair that I liked that didn't make the cut was the original lc 'am' pairing. Very fluid. <br> <br>using a '+' in cutz + buzz works well, too. <br> <br>bj </p>
