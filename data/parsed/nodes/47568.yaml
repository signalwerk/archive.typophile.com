      <p><cite>funky tags</cite> … <cite>old fashioned HTML</cite></p>
      <p>C’mon, give it a break! :D</p>
      <p>Nothing to be afraid of:<br>
      <a href="http://reference.sitepoint.com/html/elements-text-formatting" title="http://reference.sitepoint.com/html/elements-text-formatting">http://reference.sitepoint.com/html/elements-text-formatting</a></p>
      <p>If you find remembering/typing HTML too complicated, you can always use tools like TextExpander, RapidoWrite or Typinator. With them, you can type “__” or whatever you have configured, and it will automatically replace that with <code>&lt;strong&gt;&lt;/strong&gt;</code>, and even place the cursor between those tags, if you want so.</p>
