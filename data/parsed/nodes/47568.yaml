    html: |-
      <p>We are already part way there with some wiki syntax having already been adopted. For example, when you upload an image to the Typophile server, it gives you the hosted image element in convenient square brackets, with simple, easy-to-use <strong>img:name.gif</strong> syntax instead of the cumbersome and time-consuming <strong>href="yada-yada.gif"</strong>.</p>
      <p>Does anybody seriously want to revert to HTML IMG tags?</p>
      <p>I didn't think so.</p>
      <p>Here's an example of wiki syntax from <a href="http://en.wikipedia.org/wiki/User:James_Arboghast" rel="nofollow">my WP user page</a>.<br>
      This:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/wiki_arbo_code_4304.gif"></div><p></p>
      <p>Produces this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/wiki_phaistos_5280.gif"></div><p></p>
      <p>Move forward on this one. Pick up a bone...</p>
      <p>j a m e s</p>
