    html: |-
      <p>Discussion of this topic is long overdue. Pick up a bone.</p>
      <p>Really, HTML syntax is a positively archaic ancestor of the simplified text formatting the rest of the web moved on to years ago. Wiki-style syntax is the future for things like bold and italic. By comparison HTML sytax is not merely "too complicated", it's primitive and obsolete. Typing two underscores or two inch marks is much easier, and it makes a lot of sense.</p>
      <p>Typophile and Punchcut are clinging to a standard that will soon be redundant. For a community that is supposedly type central, this kind of thing started to get embarrassing several years ago.</p>
      <p><em>If you find remembering/typing HTML too complicated, you can always use tools like TextExpander, RapidoWrite or Typinator. With them, you can type “__” or whatever you have configured, and it will automatically replace that with [strong][/strong], and even place the cursor between those tags, if you want so.</em></p>
      <p>He shouldn't have to resort to such ludicrous methods and neither should anyone else.</p>
      <p><em>Can we have some more HTML elements, please? blockquote, first and foremost. The availability of del, ins or abbr would not be amiss either.</em></p>
      <p>I think we should have more elements like that but not in HTML please. Let's move with the times.</p>
      <p><em>And as this is a typographic forum, I can see quite a few reasonable applications for i and b: Not every italicization is meant to be an emphasis.</em></p>
      <p>That's an arbitrary and not very meaningful distinction. i tags produce the same formatting as em, and b tags produce the same formatting as strong. What's the point? None that can be discerned, except b and i are to type. Nobody reading it will see any difference. Besides which b and i are ageing, non-standard, non-compliant Mozilla extensions.</p>
      <p><em>C’mon, give it a break! :D</em></p>
      <p>C'mon and give users a break, and move with the times. No wonder typophiles and the type industry hang onto outmoded terminology like "sans serif".</p>
      <p>Pick up a bone and throw it into the sky. Watch it spin off into space.</p>
      <p>j a m e s</p>
