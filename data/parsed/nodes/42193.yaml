    <p>hi all,</p>
    <p>i’m currently reading ’hidden empire’ by kevin j. anderson, it’s a science fiction novel.</p>
    <p>the edition is have is a pocket books one, with this on the inside about the typesetting:</p>
    <p><cite>’Typeset in Weiss by SX Composing DTP, Rayleigh, Essex. Printed and bound in Great Britain by Cox and Wyman Ltd, Reading, Berks.”<cite></cite></cite></p>
    <p>i can’t recall ever seeing weiss before this book, and while i think it is a very nice typeface, it seems almost too beautiful to be used as a text face. i’m not sure exactly what is causing me problems, except the lower case ’z’ which i think is quite nice and always make me stumble as i pause to admire it. </p>
    <p>do any of you know what i’m talking about?</p>
    <p>are there better example of where weiss really works?</p>
    <p>amazon.co.uk have some sample pages <a class="freelinking-external" href="http://www.amazon.co.uk/Hidden-Empire-Saga-Seven-Suns/dp/0743430654/ref=pd_bbs_sr_2?ie=UTF8&amp;s=books&amp;qid=1203307627&amp;sr=8-2">here</a></p>
    <p>cheers - sye :)</p>
