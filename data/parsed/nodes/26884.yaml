  html: <p>Trying to figure out if this font exists as an actual font or if it was doctored by the designer (Tried to contact the designer, but no response).  Looks sooooo similar to Fonts at Typotheque and LucasFonts, which makes me think it's german/dutch, but nothing matches the lowercase "a" and upper "G" along with the small caps and other letters. I've included as many letters as possible. Hope that helps.  Thanks!  <br><img src="http://www.typophile.com/forums/messages/83/21290.gif" alt=""></p>
