    <p>Fellow typophiles,</p>
    <p>I need a very thorough critique of the following piece..</p>
    <p><a href="http://evanmade.com/storage/Final-Zapf-Layout.pdf" rel="nofollow">HERMANN ZAPF LAYOUT PDF</a></p>
    <p>Here is the criteria for the assignment:<br>
    + Format (7.5 by 10.5 inches)<br>
    + It all must fit on a spread<br>
    + About six images (I have 5)<br>
    + It should represent a possible layout for an entire textbook about typography/type designers/type history</p>
    <p>What I would like feedback on:<br>
    + Use of negative/white space (is there enough? Is it interesting?<br>
    + Type color (and I am not talking about the red)<br>
    + Relevance and arrangement of images<br>
    + Use of footnotes, image captions and other secondary test<br>
    + Hierarchy<br>
    + General typographic style/following rules, appropriate glyphs, etc</p>
    <p>Some info about my design:<br>
    + its on a 5 column grid.<br>
    + Text is set 9/13 x 13p4 (strange measure, I know) Scala and Scala Sans</p>
    <p>Oh, and I have thick skin. Please don't hold back. Prompt feedback would be excellent. (Sorry about the second thread, I just need some feedback quickly)</p>
