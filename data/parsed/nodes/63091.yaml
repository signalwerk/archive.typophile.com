    html: <p>Overall nice work. I think you need more space between the deck and the body copy, right now it runs together. Not sure about the flush right alignment on the captions, it gives the impression of being jammed in there next to the body copy, how did it look flush left? I think the 2 images on the right hand page are too large, they are running awfully close to the page edge. The body copy seems a bit tight in places, maybe those 2 columns should be slightly wider?</p>
