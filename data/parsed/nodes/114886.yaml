    <p>Hi guys!<br>
    I'm designing a website for a company with Fago Office Serif among its institutional fonts. Is anyone able to find a free (and good) web alternative with similar serifs and mood?</p>
    <p>Thank you very much in advance.<br>
    Have a great day!</p>
