  - id: 573786
    user: 52182
    date: 2014-03-16T09:51:00
    date_raw: 16 Mar 2014 — 9:51am
    votes: null
    html: <p>I find these situations to be quite awkward, actually. Of course the company has the right to choose whether to use a free font or not, but I also wonder, if the company has no money for a one-time fee of 159 euro to establish a good brand identity then I have to wonder why you would even want to start up a company in the first place. I want my clients to be passionate about the design of their company and value it accordingly.</p>
