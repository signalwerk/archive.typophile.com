    html: "<p>I know of three freely-available egyptians that will let them judge for themselves the balance between identity and price: Aleo, Arvo and Roboto Slab. There is a semi-payware fourth, Museo Slab. All can be found here (<a class=\"freelinking external\" href=\"http://www.fontsquirrel.com/\" rel=\"nofollow\">http://www.fontsquirrel.com/</a>) and all are enough unlike Fago that the difference should be visible even to a tunnel-visioned accountant that hasn't taken his eyes off the bottom line for the last fifty years.</p>"
