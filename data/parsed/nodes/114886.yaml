    html: <p>Since the company has a low budget and no extreme need for that exact font on its website, I was just trying to find out if, among the various services and websites offering free and open source fonts, there is something with a similar mood to Fago's. Of course I am not going to use Fago on the website without paying for it, but I think the company has the right to choose whether to use a free font or not. :)</p>
