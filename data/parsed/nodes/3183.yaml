  html: <p>first off, i wish to create the fonts for flash. and it's my first time making pixel fonts. <br> <br>probably someone will direct me to the tutorial on ultrashock - well i've seen that and followed it as best i can. <a href="http://www.ultrashock.com/tutorials/flash5/fonttutorial.html" target="_top">http://www.ultrashock.com/tutorials/flash5/fonttutorial.html</a> <br> <br>however i think it all goes wrong at 10. 'open the bitmap, and make sure it looks the same as the outline' <br> <br>well it does not match up i can see the blacked boxes i have just drawn and also an outline, which i assume it the bitmap outline, and it does not mention how to solve the problem. <br> <br>can anyone help me out with this <br> <br>thanks</p>
  html_clean: <p>first off, i wish to create the fonts for flash. and it's my first time making pixel fonts. <br> <br>probably someone will direct me to the tutorial on ultrashock - well i've seen that and followed it as best i can. <a href="http://www.ultrashock.com/tutorials/flash5/fonttutorial.html" target="_top" class="link-external">http://www.ultrashock.com/tutorials/flash5/fonttutorial.html</a> <br> <br>however i think it all goes wrong at 10. 'open the bitmap, and make sure it looks the same as the outline' <br> <br>well it does not match up i can see the blacked boxes i have just drawn and also an outline, which i assume it the bitmap outline, and it does not mention how to solve the problem. <br> <br>can anyone help me out with this <br> <br>thanks</p>
