    html: <p> try skipping that step.  see if it works anyway. <br> <br>also I would avoid making flash fonts in 10pt increments - there's a bug in flash (up to and including MX, I believe) that will blur 10pt. bitmap fonts when used in dynamic text fields <br> <br>instead design for 8pt increments (800 em square instead of 1000 em... step 6 in that tutorial, then recalc to 8 instead of 10 - step 9) <br> <br>hope that helps, good luck </p>
