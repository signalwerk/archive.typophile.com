    <p>I am a doctoral candiate  at Hong-Ik university, Korea. My interest is a certain typographic composition which, assumably, started in the early twenties(1920's). But it is not easy to find some available references and even know of the accurate term for it.  <br> <br>Belows are typical samples, which show the certain structure that use the same alphabet among two or more words. <br> <br>In fact I am in trouble because I am planning to set it as a thesis theme. My thesis is about some possibilty that this can be adapted to Korean Typography. It has not been considered because the Korean, Hangul structure is quie different from the English's. <br> <br>In the early stage of my thesis, the terminoloy and references about it is absolutely in need. It will be thankful if you give me even a simple comment on it.  <br> <br>Bjornz Li <br> <br><img src="http://www.typophile.com/forums/messages/30/68650.jpg" alt="sampes of the structure"></p>
