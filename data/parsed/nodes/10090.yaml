    html: "<p>&gt;assumably, started in the early twenties <br> <br>In a way. Crossword puzzles were a huge fad at that time, which is probably related. <br> <br>But actually, they go right back to ancient Rome: <br> <br>SATOR <br>AREPO <br>TENET <br>OPERA <br>ROTAS <br> <br>...and have a long cult history. <br> <br>I've recently seen an astonishing Christian \"poster\" from 1500(?) years ago which was composed of a massive grid-field of normal-reading text from which various significant diagonal and vertical phrases are highlighted in different colours. Unfortunately, I am not the world's best note-taker, so I can't give you any further information, other than it was in an exhibition at the Fitzwilliam Museum in Cambridge about 4 months ago. <br> <br>There is also the traditional genre of \"acrostic\" verse, where the Initial character of each line, read vertically, spells out a message. <br> <br>Check out \"The Oxford Book of Word Games\" and Willard R. Espy, \"An Almanac of Words at Play\", to approach this phenomenon from the literary angle, which is, I believe, equally, if not more relevant than that of design.</p>"
