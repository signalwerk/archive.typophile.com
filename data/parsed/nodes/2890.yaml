    html: <p> Hello Ramiro and Gregory, normally I use the same file to creat a different enconding, I only change the file when I want to make a ISO latin 1 or other. I use the same file to mantain all information ( letters, space, kerning pairs ...), the only thing in fact that change is the enconding. If somebody have more experience in this case I would like to know with more details.  <br> <br>Regards for both / Ricardo </p>
