  html: <p> The encoding of characters for Mac and PCs are differents and they have not the same number characters <br> <br>So, what is the correct way to work when you are designing a font? <br> <br>Do you make two differents .FOG for each platform? <br>Or do you use the same .FOG and then you change the encoding when the font is generated? <br> <br>I am in a mess... </p>
