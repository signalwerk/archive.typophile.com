    html: <p> Not really sure if that's the "correct way" to do that, but I personnally choose the ISO latin 1 encoding when designing the font. <br> <br>And for creating platform-specific versions, (supposed working better?) I make different .FOG for each OS. <br> <br>Greg </p>
