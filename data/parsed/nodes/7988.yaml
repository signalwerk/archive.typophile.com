  - id: 53781
    user: 5332
    date: 2004-12-03T10:36:00
    date_raw: 3 Dec 2004 — 10:36am
    votes: null
    html: <p>Thanks, that's exactly the information I was looking for! <br> <br>I prefer to use Type 1 because they seem to work easy in X; once installed, GIMP and other applications just magically have them. <br> <br>Most foundries only seem to offer Mac and Windows options. I suppose Type 1 fonts for Windows on CD or downloaded will work on Linux? <br> <br>Just found some of the beautiful old faces I'm looking for available from Linotype.com. Happy to see them but guess I'm a little surprised at the prices for some of these 70-year-old typefaces. A <a href="http://www.linotype.com/89150/gilliesgothic-family.html">single 4-font family</a> will set you back $80-100---the cost of doing business for a commercial publication, surely, but it seems a little impractical for hobbyists and free-lance part-timers! <br> <br>I'd love to see them sold in packs, like how <a href="http://fontdiner.com/">Font Diner</a> does it. They sell new fonts with a "retro" aesthetic---I haven't tried them yet but the quality seems good, and you can get about a dozen for $30.</p>
    html_clean: <p>Thanks, that's exactly the information I was looking for! <br> <br>I prefer to use Type 1 because they seem to work easy in X; once installed, GIMP and other applications just magically have them. <br> <br>Most foundries only seem to offer Mac and Windows options. I suppose Type 1 fonts for Windows on CD or downloaded will work on Linux? <br> <br>Just found some of the beautiful old faces I'm looking for available from Linotype.com. Happy to see them but guess I'm a little surprised at the prices for some of these 70-year-old typefaces. A <a href="http://www.linotype.com/89150/gilliesgothic-family.html" class="link-external">single 4-font family</a> will set you back $80-100---the cost of doing business for a commercial publication, surely, but it seems a little impractical for hobbyists and free-lance part-timers! <br> <br>I'd love to see them sold in packs, like how <a href="http://fontdiner.com/" class="link-external">Font Diner</a> does it. They sell new fonts with a "retro" aesthetic---I haven't tried them yet but the quality seems good, and you can get about a dozen for $30.</p>
