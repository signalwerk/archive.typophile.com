  date_raw: 3 Dec 2004 — 8:32am
  votes: null
  html: "<p>I am interested in mid-20th century typography and design, and am looking for a good, representative collection of faces from the era, from 1937's Coronet up to about Nov 1963: Murray Hill, Futura, Park Avenue, Balloon Extrabold, Gillies Gothic Bold, etc. <br> <br>I use Linux exclusively: GIMP for Web-based graphic design and TeX for print-based typesetting. I want to use the fonts primarily in GIMP, for Web work, but I'd also like to be able to use them occasionally with TeX, for the purpose of printing cards, letterheads, and the like. <br> <br>Can anyone recommend a source for these fonts, and a format (PostScript Type 1, TrueType, etc) that will work for me?</p>"
  html_clean: "<p>I am interested in mid-20th century typography and design, and am looking for a good, representative collection of faces from the era, from 1937's Coronet up to about Nov 1963: Murray Hill, Futura, Park Avenue, Balloon Extrabold, Gillies Gothic Bold, etc. <br> <br>I use Linux exclusively: GIMP for Web-based graphic design and TeX for print-based typesetting. I want to use the fonts primarily in GIMP, for Web work, but I'd also like to be able to use them occasionally with TeX, for the purpose of printing cards, letterheads, and the like. <br> <br>Can anyone recommend a source for these fonts, and a format (PostScript Type 1, TrueType, etc) that will work for me?</p>"
