    html: <p>No, not using it for an RPG although I'm impressed by the elaboration they've done for those games as detailed on that Lovecraft site. <br> <br>I'm looking for these fonts primarily for Web design at the moment, although letterhead and a print logo is also in view. <br> <br>As for the "vintage" aspect, my study is the ideals and design aesthetics of that time in Western civilization that predates the ruinous counter-culture. The idea is not to be simply "retro"---mimicking the relics of a frozen moment of the past, as viewed from the present---but to apply those principles to elevate the present situation.</p>
