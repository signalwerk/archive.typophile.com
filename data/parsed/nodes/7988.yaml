    html: <p>Dan, appreciate the links. I took note of the many themed Value Packs, and wonder if Linotype would ever consider releasing Packs of fonts collected by time period? <br> <br>I'd like to improve my collection with a concern for quality and authenticity over quantity---but this being an amateur operation (at least for now, anyway), I'm on a tight budget. I have the basic PostScript printer fonts, all of the fonts that come with teTeX, and some of the extra CTAN fonts. Can anyone recommend other sources for obtaining good Level 1 fonts---particularly mid-century---on a budget? <br> <br>I keep reading about the Bitstream 500 font CD and the 250 font CD, and they're recommended in both the comp.fonts FAQ and the Linux Font HOWTO, but these CDs no longer appear to be available by Bitstream, nor do they show up used on eBay. <br> <br>One source I did find that offers a collection of type scanned from vintage sources is the <a href="http://www.cthulhulives.org/toybox/PROPDOCS/PropFonts.html">HPLHS Prop Fonts</a> CD, and I wonder if anyone here has seen it.</p>
