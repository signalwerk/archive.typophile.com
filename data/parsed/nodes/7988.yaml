  - id: 53780
    user: 2663
    date: 2004-12-03T09:37:00
    date_raw: 3 Dec 2004 — 9:37am
    votes: null
    html: <p>For use with TeX, I stick with Type 1, although you can use TrueType and with some pain, OpenType as well. Installing the fonts for use with TeX is not trivial, but it isn't quite so bad, if you read the excellent <a href="http://www.ctan.org/tex-archive/info/Type1fonts/fontinstallationguide/fontinstallationguide.pdf">TeX font installation guide</a>.  <br> <br>As for where to buy the fonts, I usually buy from Adobe, Linotype, FontShop, etc. Avoid the generic rip-offs, though.</p>
