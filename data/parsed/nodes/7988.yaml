    html: "<p>Michael, we have some sales on larger families here: <br><a href=\"http://www.linotype.com/6-1815-6/valuepackages.html\" target=\"_blank\">http://www.linotype.com/6-1815-6/valuepackages.html</a> <br>They are still pricey, but I think that the cost is a good one for the number of weights one receives. <br> <br>Also, we have some Value Packs. These prices vary depending on the theme and on the fonts themselves: <br><a href=\"http://www.linotype.com/6-1788-6/compilationvaluepackages.html\" target=\"_blank\">http://www.linotype.com/6-1788-6/compilationvaluepackages.html</a> <br> <br>We don't offer discounts for amateur use,* but we do have a 30% discount in place for students. And as Steve mentioned, we offer bulk discounts on individual weight purchases. <br> <br>Sometimes, when a new value pack is released, its initial sales price is only around $30. If you sign up for the Linotype newsletter, you can get these special announcements mailed to you every month. <br><a href=\"http://www.linotype.com/webshop/newsletter.php\" target=\"_blank\">http://www.linotype.com/webshop/newsletter.php</a> <br> <br>Or, you can periodically peruse the News section here on Typophile. We post all of our LinoLetters here, too, if you don't want more e-mail. <br> <br> <br>*A font license doesn't expire. If an amateur buys a font, and turns into a professional later, he still has all of his old fonts at his disposal!</p>"
