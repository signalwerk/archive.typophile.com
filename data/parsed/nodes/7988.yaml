    html: <p>Yes, you will want the PC Type 1 fonts.  <br> <br>For buying Linotype faces, often the more you buy, the cheaper the prices. (Just add more to your cart, and the prices update.) Unfortunately, that's not the case with all the fonts, though. I'd love to get Optima Nova, but not enough people are beating down my door with freelance jobs for me to afford it.</p>
