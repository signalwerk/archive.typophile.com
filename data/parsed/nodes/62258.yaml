    html: <p>Hey guys, if you make a Basel Typostammtisch and add it to the German <a href="http://www.typeoff.de/?page_id=655" rel="nofollow">Type Meet-Ups calendar</a>, I will surely make my way down there eventually. Who knows… other freewheeling, DeutscheBahn BahnCard-100–owning typophiles might make it down there, too. Frequent customers like us can ride the ICE trains down to the Basel SBB Bahnhof for free!</p>
