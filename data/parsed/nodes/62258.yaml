      <p>Sounds good, Dan! Yes, Basel is quite accessible from Germany too (and France).<br>
      Paul, I know at least one person in Basel who might be interested, plus a few people in other areas of Switzerland that might make it down here – I mean Zurich for example is like an hour away. But it would certainly be nice to get more of a Basel-based "core" going. Are you connected to the School of Graphic Design (or whatever they call it now)? There should be plenty of typophiles there. But I don't think I know anyone there.<br>
      In any case, feel free to drop me an email at altairas_eye at mac dot com to discuss things further.</p>
