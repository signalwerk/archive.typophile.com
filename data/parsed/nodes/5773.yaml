  html: "<p>Has anyone any idea why my Maill application sends some emails and not others giving me this error: <br> <br>-------------------------------------------- <br>This message could not be delivered and will remain in your Outbox until it can be delivered. <br> <br>Verify that you have addressed this message correctly. Check your SMTP server settings in Mail Preferences and verify any advanced settings with your system administrator. <br>----------------------------------------------- <br> <br>The address is correct and so are the SMPT settings. <br> <br>Thanks for any help, <br>David.</p>"
