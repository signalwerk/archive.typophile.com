    html: |-
      <p>There can be a difference between the explicit Ascender/Descender definitions and the length of ascenders and descenders. One is a set of vertical metrics in the meta data, the other is how you choose to draw the design; one is technical, the other is aesthetic. It’s the former that FontLab cares about.</p>
      <p>And in fact, there are different Ascender/Descender metrics — there are the [OS/2] TypoAscender &amp; TypoDescender, the WinAscent &amp; WinDescent, and the [hhea] Ascender &amp; Descender. There may be others I’m forgetting.</p>
      <p>I don’t recall offhand all the particulars of the relationships, but I pretty sure that the WinAscent and WinDescent don’t need to add up to the em definition.</p>
      <p>I believe Karsten Luecke or John Hudson (or someone like) has given a comprehensive overview before somewhere that you can google for.</p>
