    <p>Is there any easy, somewhat-agreed-upon way that is generally used to refer to a font's vertical proportions?</p>
    <p>I know the "<a class="freelinking external" href="http://www.thinkingwithtype.com/contents/letter/" rel="nofollow">anatomy</a>" diagram. I'm just wondering if I were to give a string of numbers, such as:</p>
    <p>1000/768/712/483/226<br>
    or<br>
    16/12/11/8/4<br>
    or<br>
    14/11/10/7/3</p>
    <p>...whether this would be understood to mean that if you divide the vertical space of the em into 1000 (or 16 or 14 or whatever) that the ascender height is 768, the cap height is 712, the x-height is 483, and the descender length is 226.</p>
    <p>And if not this, what other method is used to shorthand-communicate these proportions? Or, is that not a useful thing to communicate?</p>
