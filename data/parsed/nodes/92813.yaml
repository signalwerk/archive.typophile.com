    html: |-
      <p><em>@oldnick – Does that mean that with, say, 800/200 ascenders/descenders, the tip of your tallest ascender must touch 800 or Fontlab will cry foul?</em></p>
      <p>They don’t have to touch; the sum, as positive numbers, merely has to add up to 1,000. You can ask FontLab to calculate the absolute values for you, then tweak them a bit to satisfy its 1,000-em compulsion.</p>
