      <p>Please read my post, as "refined" is really quite the opposite of what I need.  In my mind, a failed attempt at refinement is the very definition of tacky, but this leaves me at a loss as far as typeface options to consider. Besides, you know.. Papyrus.</p>
      <p>Candy Script, to me, at least had both playfulness and a suggestion of elegance combined.</p>
