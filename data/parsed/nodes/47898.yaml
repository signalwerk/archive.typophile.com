    <p>I'm working on a poster for a party.. The idea is "Tacky Holly Golightly." Pink champagne/Cigarette holders/Virginia Slims/Bubblegum cigarettes will be given out at the party.</p>
    <p>I used Candy Script and really felt good about it, but this is the response I got: "The 'champagne Jam' typeface isnt blowing<br>
    me away... Blingy and bubbilicous. The font should give me the feeling of girlies with luscious lipstick drinking tacky pink drinks by the pool in too-short shorts."</p>
    <p>Now.. that's the feel I am getting from the Candy Script. Granted, when I think "tacky type" I think Curlz and Eurostile. I've never had to make something look both good and "tacky" before so I would *highly* appreciate some suggestions from you guys to help get me out of this box!</p>
    <p>Aw heck, I'll post the image so you can see the context I'm working with:</p>
    <p><a class="freelinking external" href="http://img142.imageshack.us/my.php?image=birdsaug9id2.gif" rel="nofollow">Champagne Jam poster</a></p>
