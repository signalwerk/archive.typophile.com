      <p>I'm not knowledgeable enough about fonts to give you a suggestion about a specific one, but I wanted to give you my impression anyway.</p>
      <p>To me the font is too thick and bulky. The capital "C" and "J" are just too clumsy. I think a more delicate, slightly more refined font would better suit your needs.</p>
      <p>Hope that helps in some way.</p>
