      <p>Style sheets can be a good idea, but I don't think the problem will be the tools they're using. It'll be getting managers to enforce the rules. And many managers just won't care unless their bosses tells them it's important.</p>
      <p>I once saw a secretary modifying her company's logo with a marker pen (it was an outline logo and she filled it in). She told me she did it on every piece that left her office because she thought it looked better that way. Her manager didn't care. It didn't stop until someone higher up finally put their foot down.</p>
    html_clean: |-
