    <p>I'm fairly new to type design and I have been using FontLab's TypeTool program which is great.</p>
    <p>I've been developing a font with a client and they have asked if the font could be restricted to a single color or multiple colors when used.  I know this probably isn't possible, but I'm quite hopeful that someone may have found a way. We want to do this because non-designers will be using the typeface and it makes for easier 'policing' of the brand colors, I'm not a dictator I promise!</p>
    <p>Would greatly appreciate anybody's help.</p>
  html_clean: |-
