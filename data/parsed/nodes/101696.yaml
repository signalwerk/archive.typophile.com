    html: |-
      <p>I'm a designer so I'm not the guy to say what's technically possible (although I doubt if it can be done). Just wanted to mention making making employees stick to graphic standards (such as colors) is a common problem, especially when they have no design training. Teaching them the rules is one thing; getting them to understand the importance of sticking to them is often the bigger challenge.</p>
      <p>You need to educate them on the guidelines, have someone high up in the organization impress upon them that the company is serious about this, provide templates when you can, and have someone review documents they produce and tell them when they're doing it wrong.</p>
