    html: |-
      <p>The short answer is no, this is not possible, short of exotic or experimental font formats. You can't do it with TypeTool.</p>
      <p>What may be helpful to you is to define a palette of character and paragraph styles in your layout application and then instruct your designers to use those styles rather than build up their typographic formatting from scratch. Do the same thing with colors — add your corporate colors to the swatches menu and then remove everything else.</p>
      <p>(Especially if your designers are not experienced or not professionals, it may actually help to make them use InDesign or some other program they're unfamiliar with, rather than Word, as it may deter them from trying to mess with the settings. You can point them to the styles window and say, "You choose what the type looks like by clicking on one of these styles." Of course, the better idea is having well-trained and intelligent designers who can both inhabit the brand guidelines and also adjust them as necessary in sensitive and appropriate ways. But since you asked about restrictions …)</p>
