    <p>Hello!</p>
    <p>This is my first post here, and i would like to present my sans type design.</p>
    <p>Some info: the font is considered to be a text font - i test it set&amp;printed in 8-12 pt size. Only lowercase now, capitals and numerals are to come soon, but before that i want to see clearly how lowercase looks.</p>
    <p>More images here: <a href="http://www.flickr.com/photos/fabergraph/" title="http://www.flickr.com/photos/fabergraph/">http://www.flickr.com/photos/fabergraph/</a></p>
    <p>Could you let me what you know please? Any c&amp;c are welcome! Thanks!!</p>
