    <p>Hi all,<br>
    There is a great article on typography and specifically Matthew Carter in this week’s New Yorker (Dec. 5), page 56.  Quite a good read!</p>
    <p>“Choosing wine in a store, Carter looks for a bottle that has type he designed on the label.”</p>
    <p>-Will</p>
