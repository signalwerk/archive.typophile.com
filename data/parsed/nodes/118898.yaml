      <p>Rob, you have an interstellar bulls-eye.<br>
      AFAIK nobody has done a digital version.<br>
      The magazine was a unique publishing effort from 1953. An attempt to produce a Science Fiction magazine that was a slick, not a pulp. Hence the stylish typeface.  Info on the magazine <a href="http://en.wikipedia.org/wiki/Science-Fiction_Plus" title="http://en.wikipedia.org/wiki/Science-Fiction_Plus">http://en.wikipedia.org/wiki/Science-Fiction_Plus</a> BTW the wiki misses the fact that in addition to fiction, the magazine published extensive science speculation articles ranging from how to build an interstellar multi-generation spaceship -- with detailed plans -- to life on mars. I still have my copies of all seven issues.<br>
      Don</p>
