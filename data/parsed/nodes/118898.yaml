    html: |-
      <p>Is that magazine <a class="freelinking external" href="http://www.vogue.com" rel="nofollow">Vogue</a>, by any chance? Your sample reminds me of a typeface called Vogue which Intertype designed for Vogue Magazine in the 1930's.</p>
      <p>The New Yorker used a custom typeface called NY Vogue Goat (an extrabold Vogue) until a recent design overhaul. Even still, there isn't currently a readily available copy of Vogue for license. </p>
      <p><a class="freelinking external" href="http://www.terminaldesign.com/fonts/vf-sans-complete-family/" rel="nofollow">VF Sans</a>, a typeface for Vanity Fair by James Montalbano, is really similar and has <a class="freelinking external" href="http://www.behance.net/gallery/VF-Sans-Finally-set-free/10141327" rel="nofollow">only recently been available</a> for individuals to license. Montalbano says that he wasn't aiming to make a Vogue revival but I consider the multiple resulting weights of type to be a happy accident.</p>
      <p>Two weights of Am Sans by Volker Busse, another similar to Vogue, used to be available through a lot of freeware sites. I'm not sure about the licensing details so I can't confidently recommend it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/vogue-bold_6085.png"></div><p></p>
