      <p>It has some superficila similarities to my <a class="freelinking external" href="http://typophile.com/node/28416" rel="nofollow">Palormak</a> font, like the tapered ends of the a, t, and f, but not so much that anyone would say one is derivative of the other.</p>
      <p>Overall you have a pretty good thing shaping up. The "o" is a bit pointy looking, and something is a bit awkward with the descender of the "g", but that's something I have a lot of trouble getting right myself.</p>
