      <p>Thanks for the feedback guys, I've had some other similar comments regarding the height of the e and o, problems with the letter s and g. Here is an update :)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/thequickbrownfoxpreviewme0_4813.gif"></div><p></p>
      <p>Changes:</p>
      <p>- Thinner crossbars on the t and f<br>
      - Pointed bottom of the v<br>
      - More unified tails on a, g, f, t and e<br>
      - Reduced overshoot<br>
      - Corrected shape inconsistencies with s, g and a<br>
      - Every lowercase letter of the english alphabet</p>
