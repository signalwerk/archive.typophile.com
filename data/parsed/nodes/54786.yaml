      <p>My disclaimer: I'm not really a typographer. I don't know if you're font is too similar to an existing font, but I think your font looks nice. So far I've made a few brief attempts at creating my own typeface and I realize it's extremely difficult to create something subtle and beautiful.</p>
      <p>That said here are a few thoughts: I think the lowercase e, o, and r should be a bit wider. I'd rotate the axis of the lowercase s counter clockwise a little; right now it looks like it might fall over. I'm not sure what it's called but I think the horizontal stroke of the lowercase r (the arm?) looks a too short, chopped off. At smaller sizes I think some variation in the width of the vertical strokes will help the letters look balanced.</p>
