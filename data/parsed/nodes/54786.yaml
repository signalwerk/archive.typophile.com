    <p>Hi guys,</p>
    <p>Throughout the past few years I've become more and more obsessed with typography. So much so, that I've now decided I'm going to create my own.</p>
    <p>I present to you: Camber - a delicate and tiny seriffed type.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/picture1qc1_4143.png"></div><p></p>
    <p>Please be aware that this is my very first attempt at a typeface, and not yet produced in a font editing application, so nothing is set in stone just yet - especially the letter spacing.</p>
    <p>I'd just like some feedback on my lowercase before I move on to CAPS or numbers. Please let me know what you think.</p>
