    html: <p>The latin portion of the Windows Indic UI fonts are lifted from "Microsoft Sans Serif" which is the outline verison of the "MS Sans" Windows 3.0 era bitmap font, which was originally named "Helv". Helv was based on bitmaps licensed from Bitstream but hand modified by a former Microsoft engineer who is now the minority owner of the Seattle Mariners baseball club. Hope this helps. Any other questions?</p>
