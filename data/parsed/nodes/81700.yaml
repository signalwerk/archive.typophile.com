    html: |-
      <p>Kartika intends to be a Malayalam font, but is n't as the shapes are very unlike any accepted letterforms in Malayalam. I am not sure if it works better as a Malaysian font! It is one of those Indic fonts which has been slapped on us by Microsoft typography as default, but works more as an insult to the language and script. When we Malayalis see it being used increasingly on blogs and sites, being the default Malayalam typeface, we shudder in disgust and self-pity. </p>
      <p>Fortunately its Roman portion is better, being a mix of Akzidenz Grotesk, Helvetica, Univers, Arial, Verdana etc. Using any of these is however a better idea that support this unwanted remix of dubious origins.</p>
