    <p>Hi, </p>
    <p>maybe someone can help with a word of advice:<br>
    I'm finishing a design job another person started. He used KARTIKA font, which appears to have only one wheight it comes in?? </p>
    <p>It seems to be a malaysian Font??? We're using it here for "German/English" text though.</p>
    <p>Anyway, I'm playing with the idea of replacing it.<br>
    Is there e.g. any font it was modelled on? Is it a sceen font? (Font family?)</p>
    <p>Helvetica might do the job for example.</p>
    <p>Thanks and cheers,<br>
    zylvia</p>
