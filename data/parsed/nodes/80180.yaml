      <p>Following the wane of Jenson, Aldus, Griffo, et al., at the end of the 1500s, I don’t think you find many standout, uniquely Italian types until the rise of Bodoni in the late 1700s.</p>
      <p>I believe much Italian printing of the 1600s–early 1700s was more or less following French fashion, using types along the lines of those cut by Granjon and Le Bé. </p>
      <p>With that in mind, and if you weren’t hung up on being strictly historical, Matthew Carter’s <a href="http://new.myfonts.com/fonts/adobe/itc-galliard/" rel="nofollow">ITC Galliard</a> is an anthology of Granjon’s style and tends to bring out the proto-Baroque characteristics.</p>
      <p>Alternately, Miklós Kis (Hungarian, trained in the Netherlands) cut some types for the Grand Duke of Florence, ca. 1690s. Various <a href="http://new.myfonts.com/search/Janson/fonts/" rel="nofollow">Janson</a> typefaces are based on his work. Again, not stereotypically Italian, but not too far off the mark historically (but maybe too far south of Vivaldi).</p>
      <p>And again, if you’re not too hung up on authenticity, Cyrus Highsmith’s <a href="http://www.fontbureau.com/fonts/ZocaloText/" rel="nofollow">Zócalo</a> series takes much inspiration from the types of Kis. And, filtered through Highsmith’s unique sensibility, dial up the Baroque quality a notch or two. Could be fun in a children’s book.</p>
