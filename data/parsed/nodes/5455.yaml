  html: <p>hey. i posted this in another forum on typophile, and it was recommended i post here, so here. <br>this is an identity for a music venue called the Eaves that it is an attic like space with slanted ceilings. it will be mostly for experimental/independent music...  the main colors will be brown and blue, although exact choices are undecided. The type will be displayed on posters, handbills, a backlit sign and maybe a wood cut sign.  <br>on the advice of my last posting, i had made the v more pointed on the bottom, and moved the THE around a bit. (thanks sally). <br>oh and before i forget to say - the main type is LHF becker monogram english, although its pretty modified at this point - especially the E. the THE is charlemagne. <br><img src="http://www.typophile.com/forums/messages/29/39788.gif" alt=""></p>
  html_clean: <p>hey. i posted this in another forum on typophile, and it was recommended i post here, so here. <br>this is an identity for a music venue called the Eaves that it is an attic like space with slanted ceilings. it will be mostly for experimental/independent music...  the main colors will be brown and blue, although exact choices are undecided. The type will be displayed on posters, handbills, a backlit sign and maybe a wood cut sign.  <br>on the advice of my last posting, i had made the v more pointed on the bottom, and moved the THE around a bit. (thanks sally). <br>oh and before i forget to say - the main type is LHF becker monogram english, although its pretty modified at this point - especially the E. the THE is charlemagne. <br><img src="http://www.typophile.com/forums/messages/29/39788.gif" alt=""></p>
