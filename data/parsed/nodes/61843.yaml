      <p>Well spotted! Would like to point out that that one was not my example ;-) Eagle eyed tho!</p>
      <p>And I agree that it is down to a good typographer to decide. The fact that it wont go in columns, alone, makes it problematic with some publications. What I read, is that it is more traditionally done this way. The eye would scan directly down the line and look for a bullet which stood out in the page margin. The other point was that bullets are usually indented because of the software and not the typographers discretion.</p>
