    html: |-
      <p>"but does everyone here agree that first example (indented bullets) is “incorrect”? Isn’t it also a matter of convention? I don’t see how that version couldn’t also work."</p>
      <p>I agree, I don't think there should be a hard and fast rule on this. Put the job in the hands of a good typographer and he or she will come up with the best solution with the job at hand. Don't handcuff a typographer or graphic designer with rules that are overstated or just a matter of personal taste.</p>
      <p>If you look at the example, there is even an inconsistency on the way the second line is indented. In the upper bullet, the second line is indented a space beyond the bulleted line and in the second bullet, the second line is indented the same as the bulleted line.</p>
      <p>ChrisL</p>
