    <p>A horizontal line  character one <a href="/node/13900" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">En</a> in width—-half of an em space. Commonly use to imply duration of time, and for creating compound&nbsp;adjectives.</p>
    <p>Used to indicate a closed range or a connection between two things of almost any kind. Most commonly used in date&nbsp;ranges.</p>
