    <p>A horizontal line  character one <a href="/wiki/en" class="freelinking" rel="nofollow">en</a> in width—-half of an em space. Commonly use to imply duration of time, and for creating compound adjectives.</p>
    <p>Used to indicate a closed range or a connection between two things of almost any kind. Most commonly used in date ranges.</p>
    <p><a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> : 2013<br>
    Windows US Keyboard : Alt 0150<br>
    Macintosh US Keyboard : Option -</p>
