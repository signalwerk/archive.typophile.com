      <p>Hi, </p>
      <p>TextSoap looks promising. Could save me a lot of time.<br>
      I work in a design office where I often finish off work started by other designers. Since some of them don’t always save the text in ASCII, I end up rewriting all the E-mail addresses in InDesign because they are all framed in a blue box (I guess evil RTF markup). Is there an easy way to get rid of that blue box around E-mails? Playing with paragraph styles was unfruitful so far.</p>
