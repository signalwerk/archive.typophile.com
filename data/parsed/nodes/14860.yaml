    html: |-
      <p><em>&gt;Is there an easy way to get rid of that blue box around E-mails?</em></p>
      <p>It is simple: Open word, Open Indesign, Open notepad (or mac equiv.) copy all from word and past into notepad. Copy all from notepad and past into Indesign. Its a fairly common pratice. I reallly easy way to remove all of the RTF formatting.</p>
