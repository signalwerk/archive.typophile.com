  html: |-
    <p>Hi,</p>
    <p>My daily routine consists of dropping text into InDesign, fixing it and sending it to the client for corrections. I’ve learned that there are a number of things that you can fix in you clients document before you import it into InDesign. Let say I receive a MSwords document, I will search for double spaces, unecessary paragraph breaks, spaces before final points, comas, interogation and exclamation marks, simple ligatures, etc. Once the text is in InDesign I check on the special ligatures, Euro and other money signs, small caps, bold, etc.</p>
    <p>I am interested to know how different people go about this job. Do you follow the same guide? I hope not otherwise this will be one of those pointless self-indulgent forum prose.</p>
    <p>Cheers</p>
