    html: |-
      <p>I've used FontDoctor for years to organize my pool of fonts into a reasonable directory tree. It doesn't organize by category, but it does have options to organize by foundry and family name. It also does a wide variety of checks, conflicts, and repairs, which I think is useful.</p>
      <p>It's now an Extensis product, available here: <a href="http://www.extensis.com/en/products/fontdoctor/index.jsp?ref=nav" title="http://www.extensis.com/en/products/fontdoctor/index.jsp?ref=nav">http://www.extensis.com/en/products/fontdoctor/index.jsp?ref=nav</a></p>
      <p>I know you're not looking for a font manager, but I advise rethinking that line you're drawing in the sand. FontExplorer (by Linotype) is really good, and attempts to do categorization. I don't think it's very successful at that (as others have pointed out, it's a hard problem), but it might be worth a download of the 30-day trial. It does have a good system for both regular and smart sets of collections of fonts; I use that to keep track of, for example, all my OpenType fonts.</p>
      <p>--John</p>
