  html: "<p>Hi, after many years of clutter and storing my font files in random locations, time has come to make a change. I am therefore looking for an application that can sort and organize my fonts automatically. I do not wish to use it as a font-management software, but only for sorting my typefaces in neat categories and folders. PS: I use Mac.</p>"
