    html: <p>Personally I find it intensely rewarding to manually sort, categorise and organise font files and data. I am particularly fascinated by the smaller details to do with formats, foundry/origin and encodings. Sorry, I know this doesn't really help you but I sympathise with what you are trying to achieve. For what it is worth I approach this kind of thing from a fairly linear point of view, sorting alphanumerically and then by family, origin, format and version. Good luck!</p>
