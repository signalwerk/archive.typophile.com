    html: <p>Id like to sort using the built in metadata in the font. I don't know what is the ultimate system of font sorting, but maybe Serif and Sans-serif at the top level. Then maybe Humanist and Geometric under Sans-Serif... I am guessing that there is no perfect solution for this. But which one is most common?</p>
