    html: |-
      <p>Display and text fonts, condensed, expanded, extra-light or black, low or high x-height potential usage (books, packaging, greeting card etc.). It depends a lot on how you use the fonts to how you classify them (of course). Though I find the designations like humanist, transitional etc. interesting, I hardly ever use them to pick a font. The 'emotional' qualities of font are more important to me (friendly, rough, playful, neutral...)</p>
      <p>I use Fontexplorer's classify function, to which I add a lot of own classifications. I sometimes use the smart set option to naarow down a selection based on some criteria (like: Serif, high x-height, text, low contrast)</p>
