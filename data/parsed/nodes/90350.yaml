    votes: null
    html: |-
      <p>There is no "most common" format because designers cannot decide what criteria to use and which are the most important :D</p>
      <p>The only method that is generally adopted as a data field in Truetype and Opentype fonts (so <em>not</em> in Type 1 fonts) is PANOSE. You might give this Javascript a try, it's one for Illustrator:</p>
      <p><a href="http://forums.adobe.com/message/4172363" title="http://forums.adobe.com/message/4172363">http://forums.adobe.com/message/4172363</a></p>
      <p>and see if it works for you (i.e., you have a font in mind and are able to find it using the script). If it does, then the Panose information is enough.</p>
