    html: |-
      <p>Yes, the preservation of the exact shapes of Comic Sans, and the Papyrus trademark infringement are indeed "of dubious legality".</p>
      <p>However, if someone else were to draw new letter shapes that were between the hand-drawn look of Comic Sans and the calligraphic look of Papyrus, perhaps also applying limited weathering, to create, say, "Ancient Blackboard"... the thought of whether it would be "so bad it's good" would be amusing to contemplate.</p>
      <p>Mind you, among all the amateur fonts on the legitimate free font sites, there may already be some candidates for an intermediate between Comic Sans and Papyrus.</p>
      <p>EDIT: After looking through a vast number of typefaces, amateur and professional, I finally found one typeface, a professional one, that could be said to inhabit the area of design space that lies between Comic Sans and Papyrus.</p>
      <p>I present to you:</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/tempus-sans-itc/" rel="nofollow">ITC Tempus Sans</a></p>
      <p>with apologies to the font designer.</p>
      <p>And, just afterwards, I also turned up</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/lillie/fidelma/" rel="nofollow">Fidelma</a></p>
      <p>which can also be considered an intermediate in this space.</p>
      <p>On the other hand, if you want an intermediate between Papyrus and Radiant, you can get</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/kenrusselldesign/wheat/" rel="nofollow">Wheat</a></p>
      <p>Also, stretching a bit, possibly</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/scholtz/smart-casual/" rel="nofollow">Smart Casual</a></p>
      <p>might lend itself to an application where one is searching for something between Papyrus and Comic Sans.</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/demosfen/" rel="nofollow">Demosfen</a> combines hand-drawn with exotic, but probably doesn't really fit in the category.</p>
      <p>And, of course, <a class="freelinking external" href="http://www.myfonts.com/fonts/scriptorium/ereshkigal/" rel="nofollow">Ereshkigal</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/scholtz/fable/" rel="nofollow">Fable</a> are simply alternatives to Papyrus, and aren't in this category, even if they do both look <em>slightly</em> more irregular and hand-drawn than the more strictly calligraphic Papyrus.</p>
