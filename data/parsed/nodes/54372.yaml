      <p>Hi, Siaron,</p>
      <p>I read the info about your book on the <strong>mbp</strong> site... Sounds like an interesting project! Did it begin as a student thesis? I ask because some other recent design books had their genesis in student theses. Off the top of my head, I can think of <a href="http://www.markbattypublisher.com/servlet/book_view?number=40" rel="nofollow"><em>Mexican Blackletter</em></a>, <a href="http://www.parallelstrokes.com/" rel="nofollow"><em>Parallel Strokes</em></a>, <a href="http://www.fraktur-mon-amour.de/en/" rel="nofollow"><em>Fraktur, Mon Amour</em></a>, and <a href="http://www.amazon.com/Ten-Commandments-Typography-Type-Heresy/dp/1858943558/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1233809292&amp;sr=1-1" rel="nofollow"><em>The Ten Commandments of Typography/Type Heresy</em></a> (and I'm sure there are others).</p>
      <p>See also the <em>Mexican Blackletter</em> thread, here on Typophile:</p>
      <p><a href="http://www.typophile.com/node/17496" title="http://www.typophile.com/node/17496">http://www.typophile.com/node/17496</a></p>
      <p>I agree with Yehan's comment... Are you allowed to post some spreads? :-)</p>
