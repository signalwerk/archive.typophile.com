    html: |-
      <p>To convey "Holiday," I would remove the red berries(?) from the tree. And maybe change the tree to a light blue and make the bird red.</p>
      <p>Because you're in Florida, your concept of winter is a little different than mine, being in Boston. While you might think of birds arriving "home" in the winter, I think of them leaving. I mentioned making the bird red because cardinals are one of the few bird species that sticks around here in the winter(or at least is active in the winter). </p>
      <p>I also think that if you send this around the Holidays, it would have more of a Holiday feel just because of the context. If I showed you a shade of blue in the summer, you might think of the sky; but in the winter, the same shade might remind you of snow.</p>
