      <p>I'd be very much in favour of teaching handwriting to children not as a skill to be mastered, but as a subject of study in the context of art/cultural history. An introduction to the world's writing systems would be worthwhile too. Consider: this is one of the central technologies of civilisation, as well as a major aesthetic cultural achievement in many places, and the majority of people are taught nothing about it in school.</p>
      <p>If individual students are inspired to want to practice penmanship, then they should be given opportunity and encouragement.</p>
