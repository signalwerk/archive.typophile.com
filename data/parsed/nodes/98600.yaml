      <p>Is it worth it to "save handwriting" by the efforts of some interested people continuing in each generation to practice calligraphy? Of course.</p>
      <p>Is it worth it to "save handwriting" by continuing to require endless generations of schoolchildren to endure the drudgery of being schooled in penmanship? No, a thousand times no.</p>
      <p>However, I <em>am</em> willing to require endless generations of schoolchildren to continue to be required to know how to at least do block lettering with a pencil when the electricity is off. Spencerian script with a fountain pen is right out, though.</p>
      <p>There is so much each generation has to learn that it needs to survive that adding to that burden - the burden faced by every student, that is - to preserve tradition cannot be justified. Traditions of value can and do survive when only those who are interested cultivate them, without having to coerce everyone into the effort.</p>
