      <p>I agree, but based on several articles I've read, many young people have difficulty reading/writing cursive because they never use it. If that trend continues, future generations may admire the artistry of calligraphy but have difficulty actually reading cursive writing. In fact it's conceivable that at some point in the future that cursive is viewed as an archaic writing style that is unreadable to most folks.</p>
