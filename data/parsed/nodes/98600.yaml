      <p>I agree almost completely John. I think a curriculum taught centered on modern global typography would greatly assist people in everyday job training, and drive some tiny but steady minority back to handwriting, perhaps with a greater and more enthused appreciation for the roots of everything word-oriented. </p>
      <p>Create an educational watershed, where most people can go on to making better captions in their home media, reporting on the whales in print, or directing type at an e-publisher, which are  around where the new center lies, vs. tattoo art, calligraphy, or just pad after pad of handwriting– all noble pursuits, but no longer attractive enough to the gathering mass communicating by word.</p>
      <p>This type-ed pie-in-the-sky goes along with thinking that fonts have/had to be a little smarter, and browsers just a little poorer:)</p>
