      <p>We are a very work-oriented society.<br>
      Make that jobs-oriented.<br>
      Make that good-for-the-economy jobs.<br>
      Meanwhile, what skills come in useful when we are not at work, which includes 25+ years of retirement?<br>
      Making things, exercising one’s taste in decorating and dressing (for parties, not for work!) etc.<br>
      And what, perish the thought, if there might even be jobs in the trades or humanities that require hand skills?</p>
      <p>I would also say that “good for the economy” jobs is a somewhat political definition.<br>
      Man-jobs that f*ck the environment, more like.</p>
      <p>It’s great to see Neville Brody taking this on:<br>
      <a href="http://www.dezeen.com/2012/11/26/neville-brody-dandad-education-ebacc/" title="http://www.dezeen.com/2012/11/26/neville-brody-dandad-education-ebacc/">http://www.dezeen.com/2012/11/26/neville-brody-dandad-education-ebacc/</a></p>
      <p>So I say, learning how to write nicely is absolutely worthwhile, and while we’re at it, why not give the kids some music, art and exercise in the core curriculum?</p>
      <p>Why are we here? For pleasure or performance?<br>
      To make our own mark on life, or stamp out a standardized template?</p>
