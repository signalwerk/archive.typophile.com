      <p>It is a silly question. </p>
      <p>True, the emphasis on a perfect and conforming style of handwriting may go or already have gone by the wayside. That's evolution. Which in its self is neither good nor bad. People make pragmatic decisions all the time about where to devote their time and energy and the simple fact of the matter is that perfecting hand writing as a vital form of communication is not really all that important these days. My own hand writing (never any good) is now almost entirely restricted to notes I take almost entirely for my own consumption. More of a mnemonic devise that an attempt t communicate. So while, in my opinion, there is no fear of any imminent demise of hand writing (as in being able to write a quick note or two when the batteries are dead)  it probably won't be what it was when I was in public school... And thank God (er, technology) for that.</p>
      <p>Interestingly, I think it is safe to say that there has never been a time when the art of calligraphy was more advanced than now.</p>
