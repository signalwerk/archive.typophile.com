      <p><a href="http://theoatmeal.com/blog/handwriting" rel="nofollow">Obligatory</a> (theoatmeal.com)</p>
      <p>My previous years of work in IT eroded my (never great) handwriting ability to the point of near uselessness.  Nowadays I periodically need to quickly jot down notes on paper, and I've pretty much lost the ability to do so... at least in a way that's both rapid and legible.  Block printing is quite unsuited to that task and is likely to end up even more illegible.  </p>
      <p>For rapid, legible writing, joined-up handwriting is essential.  It doesn't have to be beautiful, or follow a rigidly proscribed form, but I think everybody needs to be able to use a serviceable "business style" hand.  I'm pretty upset that I can't do it anymore.  (I've been trying to studying the Palmer Method in my free time.)</p>
      <p>OTOH, teaching it as a static, historical "art" rather than as an essential life tool is pretty much futile.</p>
