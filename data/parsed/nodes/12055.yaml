    <p><strong><a href="/web/20191008043519/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/web/20191008043519/http://www.typophile.com/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Ligature</strong></p>
    <p>The connecting link between two letters that are joined together. Also, two or more characters that are combined into one <a href="/web/20191008043519/http://www.typophile.com/node/12748" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Glyph</a>, generally comprising such characters as <strong>ﬁ</strong>, <strong>ﬂ</strong>, <strong>ﬀ</strong>, <strong>ﬃ</strong>, <strong>ﬄ</strong> etc.</p>
    <p>When type was made of metal, ligatures were a physical necessity to stop one piece of metal clashing with another: it was physically impossible for strokes to overlap. Not so with digital strokes: so nowadays, ligatures have primarily aesthetic benefits. Some ligatures, such as the common <strong>ﬁ</strong> may merely prevent the collision of two glyphs, but others such as the <span class="caps">OO</span> ligature provide a decorative, ornamental&nbsp;quality.</p>
    <p><strong>Discussion:</strong><br><a href="https://web.archive.org/web/20191008043519/http://typophile.com/node/19376">qu ligature, tell me why not?</a> descends into a discussion of what comprises a ligature exactly.<br><a href="https://web.archive.org/web/20191008043519/http://typophile.com/node/31432">Non-Latin Ligatures</a><br><a href="https://web.archive.org/web/20191008043519/http://typophile.com/node/43879">Bring out Your&nbsp;Ligatures</a></p>
    <p><strong>Technical Discussion:</strong><br><a href="https://web.archive.org/web/20191008043519/http://typophile.com/node/33330">Unicode&nbsp;Ligatures</a></p>
    <p><strong>Additional Articles:</strong><br><a href="https://web.archive.org/web/20191008043519/http://en.wikipedia.org/wiki/Ligature_(typography)">Wikipedia &gt;&nbsp;Ligatures</a></p>
