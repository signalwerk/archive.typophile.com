    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Ligature</strong></p>
    <p>The connecting link between two letters that are joined together. Also, two or more characters that are combined into one <a href="/wiki/glyph" class="freelinking" rel="nofollow">glyph</a>, generally comprising such characters as <strong>ﬁ</strong>, <strong>ﬂ</strong>, <strong>ﬀ</strong>, <strong>ﬃ</strong>, <strong>ﬄ</strong> etc.</p>
    <p>When type was made of metal, ligatures were a physical necessity to stop one piece of metal clashing with another: it was physically impossible for strokes to overlap. Not so with digital strokes: so nowadays, ligatures have primarily aesthetic benefits. Some ligatures, such as the common <strong>ﬁ</strong> may merely prevent the collision of two glyphs, but others such as the OO ligature provide a decorative, ornamental quality.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/19376" rel="nofollow">qu ligature, tell me why not?</a> descends into a discussion of what comprises a ligature exactly.<br>
    <a href="http://typophile.com/node/31432" rel="nofollow">Non-Latin Ligatures</a><br>
    <a href="http://typophile.com/node/43879" rel="nofollow">Bring out Your Ligatures</a></p>
    <p><strong>Technical Discussion:</strong><br>
    <a href="http://typophile.com/node/33330" rel="nofollow">Unicode Ligatures</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://en.wikipedia.org/wiki/Ligature_(typography)" rel="nofollow">Wikipedia &gt; Ligatures</a></p>
