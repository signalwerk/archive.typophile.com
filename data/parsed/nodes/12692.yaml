      <p>I like the simplicity. I suggest trying other font though, the idea is good, keep the 'em' thing. You should try a hundred different combinations. Heck, even handwritten typo. Keep on going with them designs. It's easy to just streamline 2 letters in a cool font. Try lineto.com and type the 'em' in the typewriter to see the result. Other typesite have preview possibilities too.</p>
      <p>K.</p>
