    <p>Hi there, I would be very grateful if you could take the time to make a few comments about the personal logo I'm trying to put together.</p>
    <p>I wanted to:</p>
    <p>1. Show my initials "EM" only<br>
    2. Play on "em" as a unit of measure in print and web<br>
    3. Keep the logo as simple and rational as possible in line with my own approach<br>
    4. Use only my own work - i.e. avoid adapting an existing typeface</p>
    <p>So I have been experimenting with grid-based letters inscribed in a square.</p>
    <p>Having come up with the first logo in the attachment, I can't say I'm happy - particularly with the "e" and wonder if the whole thing works better with just the "m" - cf the second logo in the attachment.</p>
    <p>What do you think? Do I need to drop the very strict grid?</p>
