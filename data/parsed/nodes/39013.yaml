    <p>Hello</p>
    <p>Been thinking about a type based route for a document about change and transformation.</p>
    <p>Wondered if anybody had any thoughts or examples of how this could be / has been done. Its not so much about flexibility, but more about progression, developing into something new...</p>
    <p>Any thoughts would be most appreciated!</p>
    <p>Cheers,</p>
    <p>Marc</p>
