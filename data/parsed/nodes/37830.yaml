  html: <p>The apostrophe, when used for a person's year of graduation, should have it's "eye" on top and tail on the bottom. In InDesign, whenever I type the apostrophe, it comes out the opposite way, with the eye below and the tail on top. Any idea how to correct that?</p>
  html_clean: <p>The apostrophe, when used for a person's year of graduation, should have it's "eye" on top and tail on the bottom. In InDesign, whenever I type the apostrophe, it comes out the opposite way, with the eye below and the tail on top. Any idea how to correct that?</p>
