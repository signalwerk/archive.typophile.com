    html: <p>You're correct, Nick, that key combination is for the single closing quote. But in Fontographer, at least, that character is only drawn once and serves as both closing single quote and apostrophe (the "smart" or "curly" kind, of course).</p>
    html_clean: <p>You're correct, Nick, that key combination is for the single closing quote. But in Fontographer, at least, that character is only drawn once and serves as both closing single quote and apostrophe (the "smart" or "curly" kind, of course).</p>
  - id: 232220
    user: 1043
    date: 2007-10-07T20:09:00
    date_raw: 7 Oct 2007 — 8:09pm
    votes: null
    html: <p>The "apostrophe" is designed as a vertical tick mark in most fonts and is replaced by a single close quote by the "smart quote" feature in most design software. It may be semantically correct to use the tick-mark apostrophe in some cases, but it is more typographically correct to use the single close quote. Typographically and historically, the two are identical in appearance.</p>
