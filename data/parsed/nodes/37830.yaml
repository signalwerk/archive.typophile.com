      <p>Correct me if I'm wrong, but to be technically correct, isn't <cite>option+shift+]</cite> the key combo for a single close quote? Given, a single close quote and an apostrophe often have identical designs, but I was under the impression that there were separate spots within a font for each character.</p>
      <p>From what I understand this distinction is a little more crucial in the context of web typography, as many screen readers for the visually impaired read the characters semantically, not visually.</p>
    html_clean: |-
