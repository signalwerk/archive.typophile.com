    html: |-
      <p>Are you on a Macintosh? Type <strong>Option (Alt)-Shift-]</strong>.</p>
      <p>Are you on a PC? Type <strong>Alt-0146</strong>.</p>
      <p>As an alternative, fool your computer by typing a single apostrophe <em>after</em> the numeral, then cut it and paste it in front of the numeral.</p>
