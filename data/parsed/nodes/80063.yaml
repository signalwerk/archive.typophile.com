    html: |-
      <p>I don't have any examples, but I've heard there are some very specific etiquette rules regarding Chinese business cards. I think they relate mainly to the handling of them rather than their design, but just the same you might want to research that. </p>
      <p>Also there are some companies that specialize in translating &amp; printing bilingual cards (japanprint.com is one I found via Google); you might find examples posted at their websites.</p>
