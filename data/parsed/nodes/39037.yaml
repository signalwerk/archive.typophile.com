    <p>Hi again, </p>
    <p>Here's one for a company named Techlink that is owned and operated by a single female. She said it doesn't need to reflect her femininity too much, but a little is ok. She did say that it should look serious enough for her to be taken seriously, and she asked me to ask you guys if the logo reflects what her business offers: The company does installations of internet, networks, firewalls, security, etc. </p>
    <p>Cheers in advance for your very handy tips!</p><div class="imageWrap"><img src="http://typophile.com/files/TL-square-1_6237.png"></div><p></p>
    <p>ps. linotype zapfino for the t and vectora light for the TECHLINK<br>
    pps. her slogan is "IT Solutions", but I can't think where to place that slogan with regard to the rest of the logo, and what colour/font, etc. any tips?</p>
