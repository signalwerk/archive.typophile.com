    html: |-
      <p>By oxymoron, I mean types which combine contradictory principles.<br>
      Humanist sans faces, for instance, which marry the clean, reductive, mechanical ethos of the unadorned monoline with something of the quality of hand-made lettering. But finding the balance is up to you. A new humanist sans, from Shinntype, <a href="http://new.myfonts.com/fonts/shinn/sensibility/" rel="nofollow">Sensibility</a>.<br>
      Another of my oxymorons, <a href="http://www.shinntype.com/bodoni.html" rel="nofollow">Bodoni Egyptian</a>.</p>
