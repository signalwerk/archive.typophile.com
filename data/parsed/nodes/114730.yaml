    html: |-
      <p>If there is purpose in assuming some imaginary optima, if there was only more room for parafoveal activity, you'd have to more than tweet it. This is not a new composition technique, we deal with foveal word recognition activities perfectly optimally, at high speeds (on the road), in the dark (at the movies), and in most "reading" studies (you know that). And foveal word recognition goes all the way back to face recognition. </p>
      <p>"How would you design a typeface differently if you knew that this was the intended application?"</p>
      <p>I would tend to follow design choices that react to the particular environment of the presentation and not the composition technique. The "reader" is expecting familiar. I think there are additional design/selection issues depending on mobility vs wearability. </p>
      <p>"...the algorithm that they are using to deduce the Optimal Recognition Position "</p>
      <p>I'd assume this is their secret, but i'd take all the words that have been studied for this feature, and extrapolate, by syllable or something, to the rest of the dictionary (and god help the Germans when spritzkrieg arrives).</p>
