    html: |-
      <p>It's a good implementation of RSVP, and it has the efficiency benefit of RSVP and it also has the usual drawbacks: you can't vary the pace of reading as you naturally do in normal text, you can't perform regressions to correct misreadings, which is a normal part of reading, and if your attention wanders for even a second you'll miss whole swathes of content and meaning. And so far there is no evidence that the speed gains of this form of RSVP perform better in comprehension and recall tests than any other kind of 'speed reading'.</p>
      <p>What has been demonstrated though, is that companies are good at writing press releases and journalists are happy to have stories mostly written for them. But we already knew that.</p>
