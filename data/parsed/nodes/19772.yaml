  html: |-
    <p>We are branding a bank services company called 21st Century Financial Services or "21CFS" They provide back end data and transaction processing services to banks. They are the bank behind the bank so to speak. They desire to be a progressive company with new technologies and a unique nearly-paperless process. I am looking for a typeface that could be used in their mark as well as have a wide enough bredth to cover multi-medium usage. I have attached the first (extremely rough, I might add) draft of the logo ideations to help with your suggestions. Our initial thoughts are to look for a semi-serif or sans typeface (like Scala maybe), but I am open to suggestion. What are your thoughts?</p>
    <p>Beau</p>
