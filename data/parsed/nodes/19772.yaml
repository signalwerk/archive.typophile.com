    date_raw: 9 May 2006 — 1:59pm
    votes: null
    html: |-
      <p>Hi BeauSim&gt;</p>
      <p>When I look at this logo... my brain immediately says "credit union or real estate". The brick red and slate gray used together are a soothing combination. The flower imparts warmth as well. While this is a good thing, in this context- I think not. The logo is very friendly and connotes maybe personalized service. But I think you are going in the wrong direction.</p>
      <p>The organic 'look' is not about strength and reliability. Its about warmth and the human aspect of things. </p>
      <p>So where should you go?</p>
      <p>There are fonts with a clinical feel, such as Univers- emotionless and used rampantly in corporate identities. Then there are fonts such as Manuscript- very rough and organic- not powerful. You need something in between... a humanist sanserif.</p>
      <p>Your initial idea of Scala is pretty good to me. But I wouldn't use that particular font. Its getting too much play these days and you want your logo to be unique for a very long time. I think the font for you is FF Absara Sans. Its powerful yet its forms are not so clinical that you can't convey 'the human' aspect.</p>
      <p>Scala, Kievit, Charter, Dederon, Caspari, and Richmond are also nice choices. And genreally speaking FontFont has excellent fonts. Stay away from Dax, Meta, and Helvetica.</p>
      <p>I would also change the colors to be stronger... maybe blues or cardinal reds. More saturated. Something that gets your attention with out slapping you in the face.</p>
      <p>Hope I'm helping you,</p>
      <p>Mikey</p>
