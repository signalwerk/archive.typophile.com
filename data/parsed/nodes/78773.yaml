    <p>I have a mystery that I need help solving.</p>
    <p>I collect old trademarks and labels that were used as adverts on cloth by fabric merchants. I recently acquired an old label which is of a 1700's design style but it contains some sand serif lettering, which according to the history books was not used until the 1800's.<br>
    The thing is, a lot of the typefaces used by the merchants were unique to that trade (I was a speaker at last year's Typecon on the subject) and so it is not unfeasible they they used a sans serif font before they became popular. These merchants were also dealing with far off lands in Asia etc where sans serif may have been used before the West.</p>
    <p>The story of the label, a picture of it and when it might date from is here <a href="http://www.textiletrademarks.com" title="www.textiletrademarks.com">www.textiletrademarks.com</a><br>
    but I have attached the name part which is in that sans serif font. Obviously it looks hand drawn to me but maybe someone out there in typeland might help with this mystery of why a sans serif type would appear on what looks like a typical 1700's style label.<br>
    I don't mind what the date of the label is because it is interesting anyway but if it does date from pre 1686 then I suppose it is an example of very early sans serif type and should be added to the history of type.<br>
    Of course, it could be a 19th century label trying to look old for some reason, although all the merchants wanted their labels to be modern, not old fashioned in style.</p>
    <p>Thanks for your input.</p>
    <p>Adrian Wilson</p>
