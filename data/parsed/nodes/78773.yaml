      <p>Hi,<br>
      are you asking for the oldest sans-serif in absolute?<br>
      If I’m not wrong you can find first latin sans serifs by the ancient Romans :)<br>
      After that you can find "real" first sans serifs in 15th century in Florence (Italy). Optima is taken from these models.<br>
      You can look at some artworks here <a class="freelinking external" href="http://www.wikideep.it/cat/medaglie-di-pisanello/sesta-medaglia-di-lionello-d%27este/" rel="nofollow">http://www.wikideep.it/cat/medaglie-di-pisanello/sesta-medaglia-di-lionello-d%27este/</a>  the images size is forced down, but if you look at them out of the html page, you'll appreciate the design.</p>
