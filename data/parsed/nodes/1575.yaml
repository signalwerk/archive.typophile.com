    html: <p>"HHP Adobe is pushing the Open Type Format so they want you to fall so much in love that format, that you'll want to toss all your old fonts and replace them with Open Type versions." <br> <br>The software industry seems to be based around licences these days rather than 'you own the box/cd/whatever, you own the product'. In my opinion foundries should offer free Euro font updates and only charge just an upgrade fee for OpenType fonts with extra features. One licence for cross platform &amp; pay only for major updates (eg. additional OpenType features). Just need to get round to implementing it myself now, what a hypocrite eh?</p>
