    html: <p>Yes, in many ways Adobe IS like Corel now, only with better software. Frankly, it isn't clever to sell a layout software without some typefaces to �play� with. What Adobe need to communicate --as well as most type foundries -- is that there are standard typefaces, and imo those should not too expensive, so as to allow the layman a good range of solid classic typefaces instead of working with shareware, and new high-profile typefaces that could be more expensive in order to allow a more individual branding (and of course, custom font for even more exclusive typography). Giving a person who buys, say,  Indesign, a solid handful of well-chosen typefaces, some classics, some fancy playful stuff, is way more sensible than not giving them anything at all. It DOES indeed add to the notion that fonts aren't worth much, but I think we have that problem anyway... and it should be worth considering to make some fonts more easily accessible in packages such as CD and some others more exclusive. Some folks will be happy to get, say, a Franklin Gothic on their hands, other already have that and still will shell out money to get the latest DTL fonts :-D. Typefaces are NOT a mass-market and will never be. </p>
