    html: "<p>Hmmm. Well, it certainly is getting a lot of attention.  <br> <br>So, does anybody have a problem with the $169 individual application upgrade price? No? <br> <br>So, what's bugging people is that the all-in-one upgrade to the suite for Photoshop users is a little more expensive than doing individual upgrades, IF you already own all the individual applications? Right? <br> <br>So, DON'T buy the suite upgrade if you already have all the individual apps! What's the big deal? <br> <br>Also, remember that not everyone already has all the Adobe apps. For those who use other apps (or no apps) in one or more categories, the suite upgrade from Photoshop looks a lot more attractive. <br> <br>By the way, there are a couple of things that come in the suite that don't come separately: <br>- Version Cue <br>- several weights of Brioso Pro and Warnock Pro <br>- a Total Training CD (I admit I don't even know what that is!) <br> <br>However, one certainly should balance that against the lack of printed manuals (which DO come with the individual apps). <br> <br>It's understandable that people are unhappy with the *relative* prices, but I think it's worth noting that these are pretty reasonable rates in *absolute* terms, or compared to the competition. Look at what Quark does for upgrades.... <br> <br>T</p>"
