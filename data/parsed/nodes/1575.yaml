    html: "<p>I would not say Adobe has a monopoly. Each of these products has competitors: <br> <br>Photoshop: Corel PhotoPAINT, the GIMP, &amp;c <br>Illustrator: CorelDraw, Freehand, Killustrator, Expression, &amp;c <br>InDesign: Quark, MS Publisher, Ventura, TeX, &amp;c <br> <br>The fact that the competitors mostly suck is not Adobe's problem. $169 per product is a damn fine upgrade price considering the advances. Especially Illustrator CS. I haven't switched to Acro 6 yet and don't know if I really need its new capabilities just yet. And I've never tried a commercial HTML editor before, but GoLive looks interesting.</p>"
