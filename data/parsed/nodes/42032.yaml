  html: |-
    <p>I stumbled across <a class="freelinking external" href="http://home.comcast.net/~hayosh/HISTMICR.pdf" rel="nofollow">this pdf</a> about Magnetic Ink Character Recognition, and found it enjoyable if a bit dry at the end. The impact of the distinct numerals has had on graphic design and type over the last 50 years to be fascinating. I thought, "I bet there is someone else on 'phile that would find this neato." </p>
    <p> The article includes a bit on the source of typeface E-13B's fittingly industrial name, and the forces that called for the design of MICR Numbers for checks.</p>
