    html: |-
      <p><em>Mr. Shepard sketched out the familiar boxy numbers on credit cards, called the Farrington B numeric font, on a cocktail napkin at the Waldorf-Astoria Hotel...</em></p>
      <p>It is interesting that both an electrical engineer and a r&amp;d team contracted by a consortium of bankers chose to begin with artistic trial and error when targeting machine readability. On the other hand, the UPC would be equally definitive to the genre, and has a much more mechanical "birth".</p>
