    votes: null
    html: <p>InStyle masthead has been designed by <a class="freelinking external" href="http://www.typedesign.com/logos/instyle.html" rel="nofollow">Jim Parkinson</a>. As said on this page, it's a "Refinement and finishing of a design by Rip Georges. It's based on a 1895 type specimen and first appeared on the first issue." A very close alternative would be <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/ronsard-crystal" rel="nofollow">Ronsard Crystal</a> Bold.</p>
  - id: 575607
    user: 14436
    date: 2014-04-07T02:40:00
    date_raw: 7 Apr 2014 — 2:40am
    votes: null
    html: <p>‘1895 specimen’ sounds interesting … I only knew this typeface as ‘Industria’, designed by Hermann Zehnpfund for the type foundry Emil Gursch in Berlin from 1910 to 1913. The foundry was taken over by Berthold who added more weights in 1920 and 1923. Here is a reference on the <a class="freelinking external" href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Zehnpfundt/HZehnpfundt.pdf" rel="nofollow">website of the Klingspor museum</a>.</p>
