      <p>Hinting is, in simple terms, a way to tell the computer that certain parts of letters should be kept equal at small sizes even if those parts are in reality not identical. For example, all stems in small sizes should either be one pixel wide or two pixels wide, but if some stems are one pixel wide and some stems that in reality are only slightly thicker are then suddenly two pixels wide, it looks horrible. So hinting is a mechanism to regularize the display of a font in small sizes. </p>
      <p>The icon thing is confusing, but regardless of whether a font has an OpenType icon or a TrueType icon in Windows, it actually always is OpenType. OpenType PS fonts always get the O icon while OpenType TT fonts that have a digital signature get the O icon and those which don't have a digital signature get the TT icon. The presence or absence of a digital signature has no influence on any actual "OpenType functionality" though. </p>
      <p>Regards,<br>
      Adam</p>
