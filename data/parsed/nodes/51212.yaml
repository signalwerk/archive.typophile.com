      <p>Believe me, I've been campaigning for unified terminology on this since at least 2002. This is the cheat sheet:</p>
      <p>OpenType TT (.ttf) = TrueType-flavored OpenType = OpenType TTF = Windows TrueType</p>
      <p>OpenType PS (.otf) = PostScript-flavored OpenType = OpenType CFF</p>
      <p>As for OpenType features, there is also no real difference. If your font just has glyphs that are default representations of Unicode characters, then you don't need any OpenType Layout features, no matter whether you make .otf or .ttf (FontLab Studio will build the kerning feature automatically). </p>
      <p>If your font does have any alternate glyphs or ligatures, then you should add OpenType Layout code, no matter whether you make .otf or .ttf.</p>
      <p>In my own experience, making .otf is much simpler than making .ttf because you don't need to worry about the hinting issues. </p>
      <p>Regards,<br>
      Adam</p>
