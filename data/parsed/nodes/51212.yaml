    html: <p>In answer to the original question, yes, we're still using CacheTT to calculate device metrics tables in a way that Windows likes. FontLab for Windows includes an option to utilise CacheTT during TTF generation, and I recommend this, if for no other reason than that it makes Font Validator reports a lot shorter.</p>
