    html: <p>Dave Farey designed Beeknees, not my favourite.  Also he designed Bodoni 175B Bold for Lanston. <br><a href="http://lanstontype.com/BodoniBold.html" target="_blank">http://lanstontype.com/BodoniBold.html</a> <br>You might notice he included small caps. They come with both "French" oldstyle and lining figures. Rather unusual.  This face works with the Bodoni 175 designed by Sol Hess for Lanston which also has the "French" oldstyle figures. <a href="http://lanstontype.com/Bodoni.html" target="_blank">http://lanstontype.com/Bodoni.html</a> <br> <br>I might add David's pencil quality is not even second to a robot. <br> <br>He is a remarkable man with an exacto blade. His earlier works were cut in amberlith. I have heard he now is consulting for the "London Times". Does anyone happen to have a current e-mail address for him? Or phone number?</p>
