    html: '<p>FontFonts did quite well, in what was mainly a national (pre-Internet) direct-mail marketing era.  <br>They had good branding, well designed printed specimens, plus Fuse and the FontBook. <br>And the FontShop stores. <br> <br>Their classics are Scala, Meta, Dax, &amp; Quadraat. DIN could be included, although that was designed in the 1930s originally. <br>Maybe classic: Fontesque (still selling well). <br>More ephemeral: Blur, Trixie, Dot Matrix, Mambo, &amp; the "Instant Types". <br></p>'
