  html: |-
    <p>Bit of a newbie questions here, but is there a way have fontlab ouput the vertical stem widths. I've been measuring manually, and (while fun), it is a very slow process.  Does fontlab generate a report like this? or is there a script that would help? Any tips would be appreciated.</p>
    <p>Thanks</p>
