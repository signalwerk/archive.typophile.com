  html: |-
    <p>Three cheers for the New York Times, The Washington Post, and all<br>
    other newspapers who keep their designs traditional.</p>
    <p>Bravo!  Well done, indeed!  Don't you change your looks one bit!<br>
    I love them just the way they are right now.</p>
    <p>To all interested:  Consider Robert Slimbach's Kepler typefaces for<br>
    your newspaper, whether big or small.  I believe that Kepler's looks<br>
    are perfect for newspaper design applications.  </p><div class="imageWrap"><img src="http://typophile.com/files/Kepler grab_6235.JPG"></div><p></p>
