      <p>I strongly recommend making it a requirement of the Cyrillic design that Maxim Zhukov be hired as an expert reviewer. There are lots of people with experience of Cyrillic typeface design... and there are also a lot of not very good or really quite bad Cyrillic typefaces out there, including many designed by native readers. Maxim is a true expert in Cyrillic typography: former typographic coordinator of the United Nations, and consultant to ParaType, Microsoft, Tiro Typeworks and many others. I like the look of your Merge family, and it deserves a refined Cyrillic companion, not something cobbled together from bits a pieces of the Latin, which is alas what often happens.</p>
      <p>For the Arabic design, consider <a href="http://www.tntypography.com/" rel="nofollow">Titus Nemeth</a> (if he has time; he is working on his PhD) or our friend <a href="http://www.hibastudio.com/" rel="nofollow">Hasan Abu Afash</a> in Gaza.</p>
