      <p>Nick,</p>
      <blockquote><p>A world authority on Cyrillic is not necessary if one is sticking to basic encoding.</p></blockquote>
      <p>I presume you mean by this the basic Russian alphabet plus Slavic extensions, i.e. not Turkic, Mongolian etc.. Actually, I'd say that it is precisely in designing this core set of Slavic letterforms that expert advice is most important: the extensions for Central Asian languages are mostly quite easy and derived from this core set of shapes, so if you get the basic alphabet right then the rest comes easily.</p>
      <p>Despite having designed several Cyrillic types over the past fifteen years, and having won awards for Cyrillic type design in Russia, I still find Maxim's review of my work to be very valuable. Most importantly, he has an excellent grasp of stylistic idiom, recognising which forms of particular letters are most appropriate to a particular style of type, and vast historic knowledge that enables him to suggest appropriate design solutions that might not occur to less experienced and knowledgeable designers. And he has a very refined feel for relative proportion, especially with regard to the widths of letters, that is crucial to the texture of Cyrillic text. Over the years, my own feeling for this has improved dramatically under Maxim's guidance, but he still suggests improvements that I find it worthwhile to make, however small. These two areas -- stylistic idiom and relative proportions -- are typically the weakest parts of a lot of Cyrillic type design -- resulting in Frankenstein constructions and poor page texture --, even by native users of the script, and hence why I consider Maxim good value for money as a consultant.</p>
      <blockquote><p>would a world authority on Latin be necessary</p></blockquote>
      <p>If I were looking to commission a designer to extend one of my typefaces to any script with which I was not personally familiar, as is the case for Kosal with regard to Cyrillic, I would want an independent review of the quality by someone who is a knowledgeable and experienced expert in the typography of that script. Since such experts for many scripts are few and far between, they tend to be recognised as 'world authorities'.</p>
