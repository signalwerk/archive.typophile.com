    <p>I have a potential client who's in need of Arabic and Cyrillic typefaces based on my <a href="http://www.myfonts.com/fonts/philatype/merge/" rel="nofollow">Merge</a> Family. Sounds like a great opportunity, but I'm no way capable or educated enough to design non-Roman glyphs.</p>
    <p>Not willing to dismiss a potential business opportunity, I'd like to get some advice on how to approach this. Should I commission the bigger, capable foundries to take my designs and expand it? Any other options?</p>
