      <p>On the general topic, if Unicode had been a glyph set instead of a character set, it would have been much simpler for people to design fonts that covered many languages, since the intelligence of choosing which alternative glyph to use based on linguistic rules would be in the operating system, not in the font.</p>
      <p>Of course, there's an obvious problem with that. That would mean, for example, that all Arabic fonts would have to be Naksh fonts - and never Nasta`liq fonts. Unless one had a separate set of code positions for that writing style, but, of course, that would mean that a certain, possibly imperfect, mechanization of that style would be, if not "set in stone", at least beset with delaying obstacles to change.</p>
