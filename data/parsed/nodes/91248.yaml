      <p>Well, I maintain that nativity is a factor. For example<br>
      if one has nativity in Latin, <em>no</em> outside authority would<br>
      be "necessary". However I do agree that when designing<br>
      in a non-native script, more than encoding, staying<br>
      within the confines of precedent does reduce the need*<br>
      for an outside authority. As I've opined before, it's only<br>
      when you try to break new ground (I mean structurally,<br>
      not stylistically) in a non-native script that you are in<br>
      effect taking too great a risk without native help.</p>
      <p>* BTW, "necessary" is one thing, helpful is another.</p>
      <p>Two examples from my own experience:<br>
      - When I made Akhalkalak, a highly stylized Georgian<br>
      design (so much so that it was basically new structures,<br>
      in fact inspired by the "broken" nature of Latin Fraktur)<br>
      I consulted an expert (although outside the field of design)<br>
      and he did find one seriously flawed form, which I fixed.<br>
      - <a href="http://typophile.com/node/34029" title="http://typophile.com/node/34029">http://typophile.com/node/34029</a><br>
      Unfortunately images aren't showing up right now...  :-/</p>
