      <p>I'm working on a Hebrew design. I've found:</p>
      <ol>
      <li>As others have said, nativity is very important. I've had some some native speakers give me input and it's really helped.</li>
      <li>It's important to understand this history of the script you are working on, and the chirographic sources. In fact, I seem to have amassed 8 books relating to these subjects and probably near 100 links.</li>
      </ol>
      <p>Hebrew has it's own peculiar problems that must be faced by a typeface designer, but I think those two points are very important for the design of any language you are not familiar with. It's also a good idea to <em>become familiar</em> with the language in question. :)</p>
