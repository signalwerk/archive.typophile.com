      <p>Nick: <em>So why do you need someone else to tell you how much your design should conform to convention?</em></p>
      <p>Not necessarily to tell you how much your design should conform to convention, but to explain the conventions, illustrate the variety within the conventions, the relationship between different idiomatic styles (and hence the potential for crossover and hybrid solutions), etc.. Again, I see evident lack of such knowledge in a lot of Cyrillic type design, including that done by native users of the script.</p>
      <p><em>If you hire a designer on the premise that he knows his stuff</em></p>
      <p>If one is unfamiliar with the script, how is one to judge whether a designer knows his stuff? All too often, when it comes to non-Latin type design, being a native reader of the script is taken as sufficient qualification along with the designer's own claims. Or as a friend of mine, an Indian typographer, put it when approached by a foundry about designing typefaces -- something she has never done -- 'They think I'm the right colour for the job'.</p>
