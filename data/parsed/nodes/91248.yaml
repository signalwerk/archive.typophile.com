      <p>Nativity is quite important. For some<br>
      scripts much more so than for others.</p>
      <p>If you're good at Latin type design, and you mind<br>
      giving away the work, you can probably handle<br>
      Cyrillic yourself, BUT with an advisor proficient<br>
      in the script. In the relevant recent past I've had<br>
      two Cyrillic commissions (one for a computer game<br>
      design firm in the UK, the other a shipping-label-<br>
      printing company in Germany) and in both cases<br>
      I did all the work, then ran it by somebody with<br>
      nativity (who helped me refine it).</p>
      <p>Arabic is a whole different story... Not only is it<br>
      much further from Latin in structure, but there<br>
      are serious technical hurdles to master. I myself<br>
      enjoy nativity in Arabic, but cannot produce a<br>
      working font on my own. So for Arabic you might<br>
      have to subcontract it entirely, or have a couple<br>
      of people on it: one for the forms, the other for all<br>
      the coding. If you do the latter please do consider<br>
      me for the design (although there are many others<br>
      who can do better -for example John- but most of<br>
      them cost more :-).  hpapazian at gmail dot com</p>
      <p>BTW, Merge seems well suited to Arabic! If it were<br>
      a more texty font you'd have more trouble making<br>
      the Arabic happy. Speaking of happy: many people<br>
      who make Cyrillic fonts would disagree, but to me it<br>
      should have a larger "x-height" than the Latin (even<br>
      though this refinement applies more to text fonts).</p>
      <p>hhp</p>
