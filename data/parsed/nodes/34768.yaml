  - id: 210858
    user: 18888
    date: 2007-06-27T09:45:00
    date_raw: 27.Jun.2007 9.45am
    votes: null
    html: |-
      <p>Actually I’ve used blending in CorelDRAW:</p>
      <p>1. I’ve drawn an upright ellipse and a 90 degree rotated one that’s wider<br>
      2. Since I didn’t want to play too long with blends over paths (that would actually be the best way with less work to get a more complex gullioche pattern) I created a curve from top to right<br>
      3. I used this curve for the margin as it’s set on the image<br>
      4. Did the blending and adjusted number of steps<br>
      5. visually adjusted each ellipse’s size to go to the margin (YOu wouldn’t have to do this if using paths)<br>
      6. copied and mirrored the result</p>
      <p>For the special effect I also put a gradient in the back (blueish colour from centre to the outside)</p>
