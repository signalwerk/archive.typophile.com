      <p>This is a quick attempt to create something very unsophisticated. If I’d use some other curve instead of ellipse I’d look much more sophisticated and nice. And if I’d combine some other objects, the pattern would be perfect.</p>
      <p>But just to show you what can easily be done in any vector program if you know how to do it. I did it in Corel.</p>
