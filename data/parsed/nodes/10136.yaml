    html: <p>Agreed. <br> <br>Also, reduce the space between the R and A in graduate.  <br> <br>Reduce slightly the space between the T &amp; U in 'studies'.  <br> <br>Maybe Make the word studies a bit smaller &amp; ( maybe ) open it up a little afterwards. The smallest letters ( UBC etc) have big spacing &amp; Graduate less so - so 'studies' should maybe be in between 'Graduate' &amp; 'UBC...' spacing. <br> <br>I tried to show you what I mean ( roughly ) <br> <br><img src="http://www.typophile.com/forums/messages/29/68904.gif" alt=""> <br>  <br> <br>Ideally you might slightly increase the weight of Studies too so it ties into Graduate better. That would be tough without some training though!  And this is a little bit postmodern in design anyway so maybe it doesn't matter at all. <br> <br>my 2cents.</p>
