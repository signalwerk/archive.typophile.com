    html: "<p>Yes.  <br> <br>This is better in general &amp; I agree that C is better.  <br> <br>I have been going back &amp; forth to look at the differences &amp; at first glance they seem quite similar but the *feel* different. Why? <br> <br>I think in tightening up the spacing some of the relationship between the UBC &amp; the Graduate Studies has been lost. The fonts are different ( obviously ) but there was a subtly implied realtionship between UBC &amp; Gradualte because of the spacing - which I liked. Don't get me wrong it isn't ruined or anything but I miss the connection.  <br> <br>Here is my suggestion: What if you took Graduate down by 3 pts &amp; Studies by 1pt &amp; opened the spacing slightly. Keep watching the alignment of studies. I think it might need a *slight* push to the right. It will feel a bit more refined &amp; shout less.</p>"
    html_clean: "<p>Yes.  <br> <br>This is better in general &amp; I agree that C is better.  <br> <br>I have been going back &amp; forth to look at the differences &amp; at first glance they seem quite similar but the *feel* different. Why? <br> <br>I think in tightening up the spacing some of the relationship between the UBC &amp; the Graduate Studies has been lost. The fonts are different ( obviously ) but there was a subtly implied realtionship between UBC &amp; Gradualte because of the spacing - which I liked. Don't get me wrong it isn't ruined or anything but I miss the connection.  <br> <br>Here is my suggestion: What if you took Graduate down by 3 pts &amp; Studies by 1pt &amp; opened the spacing slightly. Keep watching the alignment of studies. I think it might need a *slight* push to the right. It will feel a bit more refined &amp; shout less.</p>"
