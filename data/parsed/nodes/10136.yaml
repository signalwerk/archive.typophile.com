    html: <p>A! <br> <br>B looks confused to me - or maybe just too casual.  <br> <br>Maybe push the Studies back out a tiny tiny bit. The advice I gave about moving the word had to do with getting the type to be optically even on the right which is a judgement call ( rather than litterally or actually mathematically even ).  <br> <br>I thought of 2 ways to deal with the weight issue without becoming a type designer ( or hiring one - you can't can you?) <br> <br>Use a multiple master type face. Then you can specify the weight  for gradulate &amp; studies in small increments until it looks right to you? Not sure what this is? Seach on the board or at adobe or google. <br> <br>The other possibility ( evenb easier)  is to use a Font with Small caps. Use regular CAPS for graduate &amp; the SC - small caps ( already designed to be used together ) for the Studies. <br> <br>Does the font you are using have a small cap? <br> <br>Really though I think you have done a decent job!</p>
