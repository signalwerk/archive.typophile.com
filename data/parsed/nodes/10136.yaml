    html: <p>Yah, I think Kyle's right. Look at how the individual letterforms relate vertically as well as horizontally. Moving the top line to the right a little more will help the U-G relationship, but it should also help with how the F (in OF) relates to the U-A. Also, nudge the STUDIES back and forth to see how the E-S fits best with the T-E above it. I like where your logotype is going. <br> <br>Aloha! <br>Scott</p>
