  html: <p>I posted this in another section, but this area seems to get a little more traffic, so after a little bit of additional work, I thought I'd re-post here. To be honest, I'm getting to the point where I've been looking at it for so long that I can't where things are and aren't working. <br> <br>I am currently working on a wordmark project for a faculty within a university. They have used a logo previously, but have decided to get rid of the logo as it was cumbersome to incorporate two logos (the university's logo is required and standardized across campus) all the time. The budget does not allow for a custom font.  <br> <br>The focus is intentionally shifted to emphasize "graduate studies" in order to distinguish them from not only the university as a singular entity, but also from other faculties within the university. <br> <br>I am by no means a highly experienced typographer, so I would love to get some feedback with regards to what we have so far. The powers that be seem pleased with it overall, but I would rather be nit-picky and ask the experts now rather than once it's too late. Thanks muchly!  <br> <br><img src="http://www.typophile.com/forums/messages/29/68896.gif" alt="formal version"></p>
  html_clean: <p>I posted this in another section, but this area seems to get a little more traffic, so after a little bit of additional work, I thought I'd re-post here. To be honest, I'm getting to the point where I've been looking at it for so long that I can't where things are and aren't working. <br> <br>I am currently working on a wordmark project for a faculty within a university. They have used a logo previously, but have decided to get rid of the logo as it was cumbersome to incorporate two logos (the university's logo is required and standardized across campus) all the time. The budget does not allow for a custom font.  <br> <br>The focus is intentionally shifted to emphasize "graduate studies" in order to distinguish them from not only the university as a singular entity, but also from other faculties within the university. <br> <br>I am by no means a highly experienced typographer, so I would love to get some feedback with regards to what we have so far. The powers that be seem pleased with it overall, but I would rather be nit-picky and ask the experts now rather than once it's too late. Thanks muchly!  <br> <br><img src="http://www.typophile.com/forums/messages/29/68896.gif" alt="formal version"></p>
