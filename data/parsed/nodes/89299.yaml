    <p>If you will be in New York City on February 3, 2012, get a ticket for the world premiere of Linotype: The Film hosted by Steven Heller at the SVA Theatre.<br>
    Question &amp; Answer session after the film with director Doug Wilson and the entire film crew moderated by Steven Heller of the SVA MFA Design Program. There will also be special guests from the film at the Q&amp;A.</p>
    <p><a href="http://linotypeworldpremiere.eventbrite.com/" title="http://linotypeworldpremiere.eventbrite.com/">http://linotypeworldpremiere.eventbrite.com/</a></p>
