    <p>Dear Typophile,</p>
    <p>What is the convention when mixing small caps and lower case in the same word?  </p>
    <p>For instance, if I am setting all abbreviations in small caps, I might have the phrase ‘he had two DVDs on his shelf’.  How do I stop it looking like ‘he had two DVDS on his shelf’ (you have to imagine these large caps are small caps!).  </p>
    <p>Another example might be a possessive. ‘the new DVD’s cover was blank’.  In theory it's okay, but in some typefaces the lower case S actually comes out larger than the small caps, which looks a little striking.   </p>
    <p>Are there any conventions here?  Or tips people have found from experience look best when mixing small caps and lower case in the same word?</p>
    <p>All best wishes,</p>
    <p>Drudge</p>
