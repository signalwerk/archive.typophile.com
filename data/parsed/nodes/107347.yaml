      <p>If you have to (or want to) stick with small caps, there are two options: If you are bound to a certain typeface, you have to live with the way it looks. If you are not, do what J. Tillmann suggests in his third paragraph: select a typeface that has tall small caps. Here are some examples, good and bad. Scala and Maiola in the first and second line make it hard for the reader to tell apart small caps and lowercase. Kepler in the third line and Chaparral in the last are better in this respect.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/smallcaps_4852.png"></div><p></p>
