      <p>Drudge, I do not have an answer to your exact question. These types of problems, using small caps in technical writing, have come up in the past:<br>
      <a href="http://typophile.com/node/84025" title="http://typophile.com/node/84025">http://typophile.com/node/84025</a><br>
      <a href="http://typophile.com/node/89876" title="http://typophile.com/node/89876">http://typophile.com/node/89876</a><br>
      <a href="http://www.typophile.com/node/92747" title="http://www.typophile.com/node/92747">http://www.typophile.com/node/92747</a><br>
      <a href="http://www.typophile.com/node/99592" title="http://www.typophile.com/node/99592">http://www.typophile.com/node/99592</a></p>
      <p>Some people (like me) say forget small caps for this purpose. Just use a font where the capital letters are definitely smaller than the full height letters, such as Gentium, Greta Text, or Malabar. Or even use a font where the capital letters are somewhat smaller than full height, like Skolar. And don't even mess with the small caps problems.</p>
      <p>Some people say use a font where the small caps are definitely higher than the x-height. But there are not too many fonts designed like this, even though this is what is needed for tech writing.</p>
      <p>Some people say Drudge, just use your good judgment, buddy.</p>
      <p>Maybe someone else will have a better answer.</p>
