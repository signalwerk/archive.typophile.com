    html: |-
      <p>Quick, dirty, but amazingly multi-functional:</p>
      <pre>&lt;html&gt;&lt;head&gt;&lt;title&gt;
      Insert Your Name Here
      &lt;/title&gt;&lt;/head&gt;
      &lt;body bgcolor="white"&gt;
      &lt;p&gt;&lt;img src="path_to_image"
        alt="popup description"&gt;&lt;/p&gt;
      &lt;p&gt;&lt;img src="path_to_image2"
        alt="popup description2"&gt;&lt;/p&gt;
      &lt;/body&gt;
      &lt;/html&gt;</pre><p>
      Fill in your image paths, upload the entire she-bang, done.</p>
