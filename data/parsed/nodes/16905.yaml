    date: 2005-12-21T15:07:00
    votes: null
    html: <p>I personally wouldn't go all caps. It will restrict how big you can use it on jerseys and T shirts. The graphic is boring. Cycling is about speed, distance and location. Who cares about a crank spider? Use a more generic graphic like a spinning wheel or something enviromental like a local mountain or location. You might even make multi graphics with different graphics representing different locations in your geographical area.</p>
