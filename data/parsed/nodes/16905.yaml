    <p>I'm working on a logo for a high end bike shop in a fairly upscale neighborhood.  The owner and employees are very young and open minded so I've been trying to reach a compromise in the design.  The logo will be used for business cards and shop signs as well as for shop clothing which will include jerseys, T-shirts, etc.  </p>
    <p>I went with clarendon bold for the type and used an image of three links of a bike chain attached at the middle.  The name "Lamorinda" is an abbreviation of three towns, Lafayette, Moraga, and Orinda, the shop is located in the middle of all three and hence the image of three links of chain.</p>
    <p>Any feedback would be greatly appreciated.  Not sure if the Clarendon is too stern? Also, I've been having difficulty breaking up the text.</p>
    <p>Thanks,</p>
    <p>Patrick</p>
