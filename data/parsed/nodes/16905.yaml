      <p>Thanks for all the good input.  I've been working on a number of ideas which I will post and it would be good to hear more feedback.</p>
      <p>I tried the triangle chain symbol which worked ok but I think I need to thin out the links to make it more effective, bad contrast.  I also got rid of the previous chain symbol, it started to look like a propeller to me.  </p>
      <p>Replaced the O with the symbol in it with a chain in the shape of the O.</p>
      <p>Also, experimented with breaking up the lettering in an attempt to liven up the type, I think it is a little to conservative for the shop. </p><div class="imageWrap"><img src="http://typophile.com/files/lamorinda2.jpg"></div><p></p>
