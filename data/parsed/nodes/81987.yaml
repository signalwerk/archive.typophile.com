      <p>As Bob just stated the new nib needs to have oil removed. You can also clean these with something like windex. Higgins Eternal is considered a good quality ink to start with. Load the nib with an old brush rather than dipping so you start out clean at the tip. </p>
      <p>A better forum for this is: <a href="http://www.calligraph.com/cyberscribes/" title="http://www.calligraph.com/cyberscribes/">http://www.calligraph.com/cyberscribes/</a></p>
      <p>If you want o try a pain free fountain pen the Parallel Pen is a no fuss solution. I'd recommend the 3.6 mm.</p>
      <p><a href="http://www.johnnealbooks.com/prod_detail_list/8" title="http://www.johnnealbooks.com/prod_detail_list/8">http://www.johnnealbooks.com/prod_detail_list/8</a></p>
      <p>If you can find a local class thats will save lots of time over trying to figure it all out on your own.</p>
      <p>Here is a beginning video:<br>
      <a href="http://calligraphyforbeginners.com/" title="http://calligraphyforbeginners.com/">http://calligraphyforbeginners.com/</a><br>
      And some advanced:<br>
      <a href="http://www.quillskill.com/" title="http://www.quillskill.com/">http://www.quillskill.com/</a></p>
      <p>Good luck.</p>
