    html: <p>The speedball reservoir needs to be altered. The old stock ones are a bit domed, the new ones are very flat against the nib which is annoying. If you take a tweezer and bend the reservoir so it curls up convexly so that the tip is still touching the nib but the center is away from it by a little bit you'll have an easy time with that nib. I start beginners with Brause or Tape nibs since they are good out off the shelf without fussing. You do have to remove the machine oil they are coated with to keep them from rusting or the ink will fall out too fast. Also, write on a sloped table or ink will flow too quickly. If you must write on a flat table remove the reservoir completely and carefully with a needlenose pliers and add some black gouache to your ink to thicken it up so if flows more slowly. Good luck.</p>
