  html: <p>Got myself a set of Speedball pens to practice calligraphy, to get a better idea of the anatomy of letters. The round nib is largely agreeable, the pointed nib gets spent too quickly and the broad nib spills ink everywhere. The instruction says I can adjust the brass bit to fix that, but there does not seem to be any way to move it. What am I doing wrong?</p>
  html_clean: <p>Got myself a set of Speedball pens to practice calligraphy, to get a better idea of the anatomy of letters. The round nib is largely agreeable, the pointed nib gets spent too quickly and the broad nib spills ink everywhere. The instruction says I can adjust the brass bit to fix that, but there does not seem to be any way to move it. What am I doing wrong?</p>
