      <p>I generally use a Rotring art pen, which is cartridge fed, for display work. But I haven't done any in a while.</p>
      <p>I also use Sheaffer fountain pens for writing in a calligraphic manner.</p>
      <p>I always write properly (following joining rules, aiming for grace, swashing it up, laying out a document, even a shopping list), even when using a fine-tipped rollerball pen—because I enjoy it!</p>
