    <p>Hello typophile fontlab users,</p>
    <p>So I have this 5 layered font based on a painted font in fontlab.</p>
    <p>I've figured out how to get the kerning exact so it aligns perfectly every time. My issue is the vertical settings.</p>
    <p>In Illustrator or Photoshop, when using a text box, as opposed to clicking on canvas with type tool, Illustrator will adjust the baseline for each of the 5 layered styles.</p>
    <p>Here is a picture of 2 of the font layers using the text box versus type path tool.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Type_Align_5763.jpg"></div><p></p>
    <p>Is this something to do with vertical metrics? Am I missing a checkbox that says "keep original character positioning"?</p>
    <p>Appreciate any advice.</p>
