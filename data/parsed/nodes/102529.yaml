      <p>I like your thinking oldnick.</p>
      <p>But after testing two different multi layered fonts, Detroit and Frontage using the text box in illustrator, I've found that they both behave differently.</p>
      <p>Detroit automatically shifts the layers around like in daverowland's example. </p>
      <p>However, Frontage somehow always sticks to the baseline, with the shadows dropping into the descender line. This creates the perfect vertical alignment, so you can type anything in the box and duplicate the box to change the type into say the shadow style.</p>
      <p>I'll keep trying some possible solutions, I thought it might be a simple checkbox on export to retain the glyph ruler/metric settings.</p>
