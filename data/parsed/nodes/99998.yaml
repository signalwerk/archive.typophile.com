    <p>New typeface released, it was inspired by movie tittles from old B&amp;W Hollywood movies. The typeface was hand drawn using a high number of colors to produce a realistic 3D effect.Perfect for display use, large format graphics, magazines, posters and 3D design.</p>
    <p>Limited license for personal and commercial works. View / Purchase it here:<br>
    <a href="http://www.matoi.myshopify.com" title="www.matoi.myshopify.com">www.matoi.myshopify.com</a><br>
    www.rodrigoaguade.com</p><div class="imageWrap"><img src="http://typophile.com/files/SMOKING CLUB Example text Facel Vega WEB_4870.jpg"></div><p></p>
