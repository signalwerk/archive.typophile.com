      <p>Some Qs I’ve always liked:</p>
      <p><a href="http://myfonts.us/td-dz4QDE" rel="nofollow">Andulka Italic</a> by Stormtype<br>
      <a href="http://myfonts.us/td-OtHtvA" rel="nofollow">Caslon Italic (swash alternate)</a> by Adobe<br>
      <a href="http://myfonts.us/td-WnOshf" rel="nofollow">Scala (Sans) Italic</a> by FontFont<br>
      <a href="http://www.fontshop.com/fonts/singles/lucasfonts/sun_regular/?&amp;sample_text=Quirky&amp;sample_size=96&amp;acs_pt=32&amp;update=0" rel="nofollow">Sun</a> by LucasFonts (a. k. a. ‘the sperm cell’)<br>
      <a href="http://www.fontshop.com/fonts/singles/lucasfonts/thesans_basic_plain/?&amp;sample_text=Quirky&amp;sample_size=96&amp;acs_pt=32&amp;update=0" rel="nofollow">TheSans/Mix/Serif</a> by LucasFonts</p>
      <p>Recent OpenType versions of the latter typeface(s) no longer feature this glyph shape as the standard ‘Q’, which might be good, as the detached tail appears to have been a <a href="http://typophile.com/node/28078" rel="nofollow">pet peeve</a> for others. Still, I love it — and as long as they keep it as a stylistic alternate&nbsp;…</p>
