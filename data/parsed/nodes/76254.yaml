  html: |-
    <p>Which font(s) have your favorite Q?<br>
    I am looking through my sets of fonts for the capital Q's I like for a design I am working on for class.<br>
    I would like some suggestions of which type faces out there have nice capital Q's. Right now I am not thinking about the message behind the Q just which ones look good and I like, then I will narrow  them down to which ones make sense to use.</p>
