  html: <p>Hey, how is everyone? <br> <br>Just wanted to get some opinions on a project I think I'm about to undertake... <br> <br>My dayjob is housed in an old Masonic temple, circa 1915.  No traces of what it used to be remain, except for the entire upper floor!  Each room is labeled above the doorway, "ASSEMBLY HALL", "RECREATION", etc.  When I examine the lettering, I can see the brush strokes--how would this kind of lettering be accomplished in 1915?  Templates?  (Really precise) Freehand?  Just curious, because if templates were used that probably means they were mass-produced and there would be little purpose in working with them. <br> <br>Thanks everyone. <br></p>
  html_clean: <p>Hey, how is everyone? <br> <br>Just wanted to get some opinions on a project I think I'm about to undertake... <br> <br>My dayjob is housed in an old Masonic temple, circa 1915.  No traces of what it used to be remain, except for the entire upper floor!  Each room is labeled above the doorway, "ASSEMBLY HALL", "RECREATION", etc.  When I examine the lettering, I can see the brush strokes--how would this kind of lettering be accomplished in 1915?  Templates?  (Really precise) Freehand?  Just curious, because if templates were used that probably means they were mass-produced and there would be little purpose in working with them. <br> <br>Thanks everyone. <br></p>
