    html: <p>Probably hand-painted, using ruled lines to keep the type level. Most hand-painted letters were loosely based on exisiting typefaces, altered in order to fit their intended use (condensed, extended, etc.) and usually the widths were based on the width of the brush used to paint them. As with all things, there are exceptions to every rule, and some hand-painted letters are 100% unique and some are exact copies from type specimen books.</p>
