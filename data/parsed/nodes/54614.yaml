      <p>A very valid alternative to Times New Roman might be the freshly released <strong><a class="freelinking external" href="http://www.paratype.com/public/" rel="nofollow">PT Serif</a></strong>. It is as well, like Times, a slightly condensed serif font with relatively large x-height. It does not suffer from the strong contrasts of TNR in body text use, which makes it more easier on the eye in my opinion. Since it is for free and is similar in look and feel on a page, it should be an accessible alternative. Plus it has a cyrillic alphabet included too. </p>
