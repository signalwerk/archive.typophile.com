    <p>Hello!</p>
    <p>I really fancy the <a href="/wiki/Times%20New%20Roman" class="freelinking" rel="nofollow">Times New Roman</a> aesthetic with its references to the 'amateur culture' and the vernacular. I'm starting a small creative shop and I would like to base my identity around this font, but I'd rather go with something along the lines of TNR, but maybe not so tired.</p>
    <p>Could you point me to some alternatives?</p>
