      <p>&gt; Times is the original, definitive version</p>
      <p>The problem is that what is used today as Times New Roman (TIMES.TTF) is not the same as what was used originally. The original Times was a hotmetal composition font which was available in different versions for different point sizes. On the other hand, Concorde was designed as a photocomposition font with only one (Diatype etc.) version for all point sizes. Therefore, Lange opened the counters of Concorde Bold, so that the font could also be used in small point sizes. See e.g.</p>
      <p><a href="http://www.sanskritweb.net/temporary/counter-e.jpg" title="http://www.sanskritweb.net/temporary/counter-e.jpg">http://www.sanskritweb.net/temporary/counter-e.jpg</a></p>
      <p><a href="http://www.sanskritweb.net/temporary/counter-o.jpg" title="http://www.sanskritweb.net/temporary/counter-o.jpg">http://www.sanskritweb.net/temporary/counter-o.jpg</a></p>
      <p>(The black contour is Times New Roman, the red contour is Concorde. The glyphs were scaled to the same x-height.)</p>
      <p>Times New Roman Bold (TIMESBD.TTF) is badly suited for very small point sizes, and therefore many dictionary publishing houses in Germany, which formerly used Times Bold for headwords, switched to sanserif fonts for headwords, with Times Regular (= non-bold Times) still used, but only for the text following the headwords.</p>
    html_clean: |-
