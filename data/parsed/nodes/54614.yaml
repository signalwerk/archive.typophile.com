      <p><em>...the Times New Roman aesthetic with its references to the ’amateur culture’ and the vernacular.</em></p>
      <p>That's not my understanding of the "Times aesthetic".<br>
      But given that Times is a staple of default systems design, and that your reading of its connotations is valid, how has it acquired overtones of amateurism and the vernacular, while Helvetica, has not?<br>
      Perhaps it is because Arial is the "bad twin" which assumes that role.<br>
      So is what's happening here a movement to make Times the bad twin of Concorde?<br>
      That doesn't make sense, as Times is the original, definitive version, and IMO a livelier face than Concorde.</p>
