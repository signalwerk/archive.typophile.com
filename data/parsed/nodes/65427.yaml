      <p>Hrant, I think I disagree about the t. Whilst it is an unrepeated feature, to my eye the square cut harmonises really well with the other baseline serifs, especially with the lc r and s. I think it also balances nicely with the angularity on the head of t. I'd say perhaps the foot could be slightly wider and perhaps darker too though. I also think I don't want to add too much interest to the baseline, and the trumpet-snout terminal (as Nina christened it) would bee too much. </p>
      <p>One of my original premises was to add interest and emphasis only to the areas of glyphs away from the baseline. Since there's always a lot of activity at the baseline I figured the eye might find it easier to read if the less frequent parts were emphasised. Hence the flared ascenders and the weird g, j and y descenders.</p>
