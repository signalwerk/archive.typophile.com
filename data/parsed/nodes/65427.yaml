    html: <p>Craig, thanks. That's really nice to hear. When I was working on these I realised that the two sets could be 'emancipated' (as Nina would say I think), so the lining ones have more in common with the uppercase and the oldstyle ones share characteristics with the lowercase. Hence the lining ones have slightly more vertical stress as well as more serifs. I'm really pleased you think this has been successful, except for a minor tweak to a couple of glyphs. You're right about the 5. (The lining one, yes?) That's going to be hard to get right, but coming back to look at it now, looks like it needs widening and the stress rotated like you say.</p>
