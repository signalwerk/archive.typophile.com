    html: |-
      <p>Even before I read your description, I was already marvelling at how well this design works at both display and text sizes. It looks great. Your proportions are rock solid.</p>
      <p>The spacing seems tight to me but I'm growing to think that's your style, and I don't see any major misfittings to trouble it.</p>
      <p>The large serifs on the descenders work in concept, but they emphasize the stumpiness of the descenders on /p/ and /q/ and maybe get a little tight between serif and bottom of bowl on those letters. Would you consider lengthening your descenders?</p>
      <p>/S/ kind of reminds me of Palatino.</p>
      <p>Cap /J/ is an unhandsome glyph to my eyes.</p>
      <p>Is the arm of /r/ too light and/or short?</p>
      <p>/y/'s curving stroke looks too soft I think. Perhaps (but less certainly) Q's tail join too.</p>
      <p>Some combination of shaving weight off or slightly widening /w/ might be good.</p>
      <p>/x/ is awfully funky - it looks somewhat swastika-ish - but may be rare enough that you could get away with it.</p>
      <p>I love the bottom of /t/ - cool stuff!</p>
      <p>Glad to see Eternal actually isn't over!</p>
