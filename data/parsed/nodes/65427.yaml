    html: |-
      <p>Oh gosh! I was out playing in the snow and missed all this! Thanks guys, I'm delighted to have such positive feedback from people with such talent :)<br>
      Right, a few comments for now.</p>
      <p>Target size: I was thinking 8-10pt. I realise that might be quite a large range to cover and am learning more about these considerations only by listening to what you guys have to say on the matter...so if there are things I can do to make that work better then great, and if I need to be more specific then I will say let's make it the upper end of that range since it seems to take more technical experience to design really tiny faces? Although Hrant might have a point that this is already better suited for news. I'm really no expert.</p>
      <p>Hrant, that is indeed a great quote. I was already thinking of throwing out the K and k but so far didn't due to other people suggesting it was a strong glyph. I think it was the first glyph I drew. Maybe I can keep it for something else.</p>
      <p>The lowercase c: Right. That notch and the one in a were the start of an experiment that looks like it didn't work. Following Jos's advice on Flickr I drew the rest of the glyphs with smooth curves and hadn't come back to correct a and c; also wanted to see what feedback they would elicit. Still, I like the textured feel they bring in so need to think about how that could be maintained without the curve notches.</p>
      <p>Spacing: wow, this is where my noneducation is seriously getting in the way! I thought I'd made it pretty loose already! You know, I was hesitating about making a separate display cut since I really like chunky rather than overcontrasty and light faces. But I've rethought this now and there's no reason a display face shouldn't keep the characteristics I like so perhaps I will after all. I like Nina's footnote and agree that approach sounds right for this face.</p>
      <p>Nina, conventional proportions: I meant that it wasn't as condensed as many of the trendy text faces (like the ones that come out of Reading's MATD); however, on reflection it seems to be following that model quite closely. </p>
      <p>J: Aargh, I knew this was the weakest link and it'd be obvious I hadn't decided quite what was best for it. I tried various different treatments of the terminal and couldn't settle on any particular decision. Has anyone seen any fonts with a really good J? I was looking for something with unconventional treatment, again chunky and perhaps reversed stress?</p>
      <p>E,F: Yes, I see what you mean. Those serifs on the right need to be much bigger. May try reversing the flares too — thanks for the suggestion Nina. I did try flaring the T and it looked rubbish. Let's see.</p>
    html_clean: |-
