    html: |-
      <p>I was secretly hoping for an Italic like this y'know :-)&nbsp;&nbsp;Really nice work!<br>
      I agree with Craig that it would be good to see it in context to see how it differentiates from the Roman – I also wonder if the contrast might be a bit too subtle (maybe it'll have to be a little bit lighter, or narrower, or something); but I personally find many Italics too un-subtle, there's certainly room on this side of the uh, subtility axis. (Not very eloquent today, sorry, but I hope you catch my drift.)</p>
      <p>Some comments, to be taken with usual salt!:</p>
      <p>My first reaction (after the «wow, nice») was to wonder if that "f" descender curl isn't indeed a bit much. Dunno, have you tried a straight descender (without a terminal)? Might nicely connect to the "y".</p>
      <p>Why no foot serif on the "r"? I can see it follows the «stroke pattern» of things like the "n", but I'm not sure, does it look a little naked?</p>
      <p>The "g" seems uncomfortably slanted somehow.</p>
      <p>Is the nose of the "e" a little too high up, or the counter too open? It almost seems backslanted. But maybe it's just me.</p>
      <p>I really like the "k"! Especially that cheeky leg.</p>
      <p>What a wonderful font. Please keep it up :)</p>
