      <p>Thanks Andrew/AJ, that's very encouraging. Here's a new pic, and I think I've retitled this 'Feldspar'.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Feldspar copy_5781.png"></div><p></p>
      <p>The sturdiness of this typeface seemed to require a nice crusty title, and Feldspar has a nice word-image.</p>
      <p>The regular is feeling much more finished now. Spacing I think is looking good, though I may need one more iteration on the cap spacing. Kerning still requires some work, then I'll have a proper look at all the accented and non-alphabetic characters. Funnily enough, the word space seems a tad wide.</p>
      <p>Following Nina's suggestion, I condensed the italic some more, to give a tiny bit more contrast with the upright. The curves on the italic D are proving rather complicated!</p>
      <p>Bold — curves need quite some tidying up, especially the uppercase, which also need to be condensed just a few units.</p>
      <p>Thin — the toughest to draw. I'm happy with the overall design but the curves are still quite bumpy and inconsistent (the e is troublesome). This will take some work.</p>
      <p>I think both the thin and bold need wider sidebearings than the roman, the spacing here looks quite tight.</p>
