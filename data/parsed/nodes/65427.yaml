      <p>This is looking very nice.</p>
      <p>Have you set text blocks with mixed italic and roman? In the sample above it looks to me like the italic is noticeably lighter than the roman.<br>
      Arm of italic /r/ isn't convincing me yet.<br>
      The right stroke of italic /h/ and /n/ seems in a hurry to snap into parallel with the left stroke. If you want to soften the italic a bit that would be a place to do it, though maybe you don't. (Is that "wooden," or "sturdy"?)</p>
      <p>On the light, I know Nick Shinn as talked about making a light by tracing the strokes with single lines and then expanding the stroke - basically, working with the strokes as lines rather than outlines. Did you do anything like that when developing your light?</p>
      <p>New name is fitting, I think!</p>
