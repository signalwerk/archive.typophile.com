    html: |-
      <p>Like I said on Flickr, I really really like this one. I think you've got a very promising foundation here; I think it does still need a bit of time, and a bit of agonizing over detail decisions, and the diamond file; but if you allow it to have that, I think this can become seriously great.</p>
      <p>Salt ready? :)</p>
      <p>First, what are "conventional proportions"? You mean horizontally or vertically?</p>
      <p>I'm not sure about the notch action in things like the "c". Especially in the "a" that device seems to be quite the hype recently, and I wonder if it really helps or if it's just stylistically pretty.* Especially in your "c", it seems to add a bit of broad-nib pen flavor that I'm not sure matches the angularity of the glyph, or the overall tone of the font. Dunno. In any case, you might need a concept for where to put these (or I'm just not seeing it). Why doesn't the cap "C" have the notch? Or the "o"?</p>
      <p>I'm also still not sure of the slanting half-serifs on diagonals. For one thing, the left counter of the "w" looks larger than the right. </p>
      <p>"f": Very cool!<br>
      "g" seems a little dark.<br>
      "r" needs a more determined terminal. Look at "kerning": This "r" is prime "combine with 'n' and track in to make an instant 'm'" material. :-)<br>
      "s" looks too dark and/or needs more contrast.<br>
      "w" also looks too dark.<br>
      "x": Not sure, it is very funky. Looks a bit like an aleph. Hm. Craig, of course it's a rare letter – but OTOH, it looks like's in the font name!<br>
      "y": Counter might be too wide. Also not a fan of the soft tail.</p>
      <p>"A": I guess that taper in the crossbar has carried over from Eternal, but why is it there? It's barely visible now.<br>
      "E": Does the middle crossbar need more weight? The one in the "A" is much heavier. Also, why not put the flares the other way round, away from the stem – kinda like in the "Z"? (Also in "F" and "L".)<br>
      "F": Slightly narrow?<br>
      "G": Seems dark.<br>
      "J": That terminal is maybe a bit overkill, no? :)<br>
      "M": Yum! :)<br>
      "R": I think this could use a less soft / more determined leg.<br>
      "T": Why no flare?<br>
      "W" and "Z" look dark.</p>
      <p>And I think the question mark is too oldstyle.</p>
      <p>* I think trying to balance functionality and style in a text font that also works for display is very ambitious; it might be fruitful to set clear priorities, like if you want to make this work as a text font, do that first, and then see what you'd need to change to make it also work for display? Maybe.</p>
