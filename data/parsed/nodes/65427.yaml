    <p>Ok, so I thought it time to come back to the crit forum after a bit of a break from here working on other designs. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Zocalo_4536.gif"></div><br>
    Here is my new design, Mixteca Serif. You'll see in the pdf a bit of background about the design concept. Any crit would be very welcome; I'm hoping this can turn out to be really useable so tell me if there's anything you don't like or looks wonky. This has been six evenings' work, so I'm sure there's lots more to do. It reminds me a bit of Charter and a bit of FF Olsen, though I was thinking more along other lines: it actually started from playing with my first font, Eternal. <p></p>
    <p>For some reason kerning didn't export with the otf file so the spacing looks a little gappy.</p>
    <p>Look forward to hearing your opinions! :) Thanks!</p>
