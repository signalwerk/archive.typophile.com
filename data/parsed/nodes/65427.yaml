      <p>Yes, I think there will be a couple of weights between the thin and regular, then probably one between the regular and bold, then we'll see about a black or something.</p>
      <p>I don't know what happened with the thin p and q. They look fine in FL but when setting type in ID, the lower curve stops at the baseline. I wonder if it's something wrong with the metrics or alignment zones. It fixes itself when converting to outlines, so it's very strange.</p>
      <p>Italic, as others have said, might need a little something. I'm starting to see the problem. Not sure why the a and g structures ended up like that, perhaps I'll try a cursive g, or add it as an alt.</p>
