      <p>That's quote of the week, Hrant ;)</p>
      <p>&gt;Maybe your fear of "softness" has dominated too much?</p>
      <p>Perhaps; I find italics can lack rigour and get too flowy or flabby. I guess I was subconsciously finding Nina's experiments with minimally slanted Italics quite inspiring. Once I've done the full set of alphabetics I'll post something so we can see the contrast. I hadn't considered narrower, but maybe there's room for that. I wonder also if the foot serifs could have a higher flick. Or maybe this is a font where there could be a choice of italics.</p>
      <p>I've already fixed the f and g, but posted the old image by accident. I narrowed the s slightly too. With the r, it looked really weird with a foot serif. And I think it helps distinguish from the roman. I'm glad you like the kick-ass k! Ping!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fangs_6073.png"></div><p></p>
