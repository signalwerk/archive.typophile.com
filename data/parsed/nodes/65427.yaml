    html: |-
      <p>First, something I missed before: The bottom of the "t" is out of character. Maybe try a terminal like in the "f" and "j".</p>
      <p>&gt; I thought the extenders should get longer<br>
      &gt; at text sizes and shorter at display sizes</p>
      <p>In my view extenders do something mostly functional at text sizes, but mostly aesthetic at display sizes. So for text sizes they need to vary depending on the target point size, while for display they need to vary based almost entirely on your taste!</p>
      <p>Especially in a text face, vertical proportions, color and spacing are very strongly inter-related. If you have a certain color, that implies a certain narrow range of proportions and spacing that can result in good readability. Usually it's best to decide the target point size (since that's what users mainly choose); the other two mostly follow from that.</p>
      <p>The smaller the target text size, the larger the x-height needs to be (which means shorter extenders)*. What I'm seeing here is around 8-9 point. If you want to lean smaller I'd make the descenders shorter; if you want to lean larger I'd make the ascenders longer. So I'm not actually recommending one over the other; the main thing is for ascenders to be sufficiently longer than descenders. But of course this is not an exact science.</p>
      <p>* Don't worry about cap height too much here.</p>
      <p>BTW, I'm not good enough to be able to recommend small tweaks based on a PDF - I might be able to do it if I saw some hi-quality printed output. But really, such small degrees of change start wading into aesthetics (something no font is entirely devoid of) so you might easily disagree with somebody. My own taste BTW leans towards darkish fonts.</p>
      <p>hhp</p>
