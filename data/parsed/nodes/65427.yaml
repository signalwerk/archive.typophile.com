      <p>Cool to see this again!! I love this face.<br>
      Some comments, please by all means add salt:</p>
      <p>In the Italic, I'm not sure you had to go this far with the narrowing? It's *definitely* distinct enough now – I would actually try pulling the narrowing back a little. Squinting at it, it also looks visibly darker than the Roman to me now… but maybe that's my printer.</p>
      <p>Some other stuff (in the Italic):<br>
      – To my eye the "n" looks potentially a hint too wide compared to the bowl-and-stick letters. And the "u" seems quite visibly narrower than the "n" too.<br>
      – Out of curiosity: Have you tried a different bottom to the "t" in the Italic – maybe something that «snaps back up» more? Not at all sure that'd work though. Generally, I would want to make the crossbar more prominent than the foot (which is darker now), but I must say I don't really understand what matters in a "t".<br>
      – Your Italic "e" still feels potentially too soft and narrow and «open» (but maybe that's really just me).<br>
      – Those serifs on the "v", "w", "y" look quite cool I think, but they might be giving you spacing problems? Like in "they" for example… You might also consider making the left-hand \ stroke of these letters steeper maybe (and/or making them narrower).</p>
      <p>BTW: Looking at p. 1 and 2 of the newest PDF, all this really looks to me like it would be happier set a point or two smaller… but then it might have to be looser.</p>
