      <p>Bendy,</p>
      <p>answering your question about tilde (as it's also very common in Portuguese, in /ã/ and /õ/): large terminals are possible, although very unusual. If it works in conjunction with general design style, there is no problem.</p>
      <p>I like Mixteca design very much. But I think the terminals in 2, 3 and 5 closes very much the counterspace. Oldstyle 5, for example, reads better (to me) because it has an open curve.</p>
      <p>I love that /f/, but the /y/ terminal seems strange. Sure, it is part of Mixteca personality, but it could be interesting to include an alternate /y/.</p>
