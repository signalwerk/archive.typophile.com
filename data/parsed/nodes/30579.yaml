    <p>Well I cant get mad, but im very disappointed. . . CS2 SUCKS on the intel based Macs. I work from a dependable g5 desktop and just purchased a new macbook pro laptop. Aside from transferring my activation back and forth every morning before I go to work, CS2 is perhaps the most unstable program I have ever used when running on the Macbook pro. Illustrator crashes every 20 minutes or so, and dont every try to use the pathfinder toolbar. . . bad juju. InDesign crashes on certain saves, and when page counts exceed 50 or so. </p>
    <p>I cant live with out these programs, as im sure many of you others out there cant. I would expect a little more support from Adobe for these issues. Some sort of a fix seems almost necessary. </p>
    <p>Anyone else having as much trouble as I am?</p>
    <p>Is Rosetta a program running behind the scenes on the Macbook Pros that allows the older programs to be compatible (barely) with the newer OS. </p>
    <p>Adobe claims CS3 will be ready in Spring and that Leopard could also be a fix. But I have no idea on that release date. </p>
    <p>Anyone who can console me would be my hero ;)</p>
    <p>Cheers</p>
