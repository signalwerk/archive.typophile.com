    html: <p>I can chime in here... Because of a rapid growth situation in my art department, we’ve been forced to purchase several new macs. We’ve added intel iMacs, Macbook Pro’s, and most recently, a few Mac Pro’s. The major kicker with CS2 really seems to be RAM. With the first round of laptops and imacs, we didn’t max the RAM out, and can’t run illustrator and photoshop both without one crashing the other. Today is my 3rd day of working on a new Mac Pro Quad 2.66, upgraded to 4GB RAM. It’s a compltetely different story. Some things seem to be even faster than my dual 2.0 G5 2 GB RAM. The iMac is much better off with a RAM upgrade as well. It also seems like rosetta (no matter the mac) runs best if it’s been restarted from time to time. The PS CS3 beta has been too buggy for me to continue with, and i’m happy so far with CS2 under rosetta. If you’re stuck working with an intel mac at this point...shove as much RAM as you can in the thing and plug away until “second quarter 2007”.</p>
