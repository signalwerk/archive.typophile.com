    html: |-
      <p>You can’t allocate RAM to specific applications in OS X, at least not easily and with a deep knowledge of BSD UNIX performance tuning. But there’s no need to do so on OS X, in the old Mac OS that was available because the system lacked memory protection so applications tended to stomp on each other’s RAM and crash the whole thing. </p>
      <p>But running OS X does take a lot of RAM, I honestly can’t get much done without being constantly aggravated on less than a gig, for design work I need two gigs. It’s especially important with Rosetta; she’s a big fat cow of an app and tends to graze her way through pastures of free RAM, leaving massive heaps of crap in her wake.</p>
