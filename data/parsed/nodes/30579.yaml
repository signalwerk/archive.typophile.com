      <p>The crashyness of the programs I use has varied over the years.<br>
      Since OS X, I have generally had fewer crashes and freezes, and the beautiful thing is it’s just the program that crashes, not the entire computer. And the program reboots real quick.<br>
      So sure, you might lose some work if you haven’t been saving (but many programs have auto backup facility). If you know the prog is a bit dodgy, you will be careful with saves.</p>
      <p>The worst ever was the version of Quark that crashed when you moved the cursor a little above the menu bar. I had huge horror stories with the introduction of both System 7 and the Power Macs. Getting used to OS X wasn’t easy, but it had so many new features which made up for the problems. Apple going Intel has beeen relatively smooth, for me. </p>
      <p>I’m running CS on an Intel Mac, and it’s slower than on the G4 I was using, but streaming content on the Internet is brilliant. I knew CS would be slower, but it was time for a new computer.</p>
      <p>You can’t expect Adobe and Apple to sync their product releases, so I don’t think there is any blame here. And the upgrades come fairly frequently, so just sit tight for CS3 which will be Intel-native, ennit? </p>
      <p>I hope that was some consolation James.</p>
