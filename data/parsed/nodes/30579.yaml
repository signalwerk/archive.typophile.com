      <p><em>Do you think the total blame lies with Adobe?</em></p>
      <p>I second that. It’s easy to blame the third party developers because it seems to be their applications that are causing the problems, when really a lot of blame can go to Apple. Although I’m a Mac user, Apple seems to move too quickly without giving their developers enough time to catch up with their changes. The same sort of thing happened when they introduced OS X a few years back. If the keep doing it, it’ll bite them in the a$$ eventually.</p>
      <p>Speaking of the Wii, Nintendo had a similar problem back in the day when they decided to stick with a cartridge based system instead of compact discs. They lost a lot of their 3rd party developers and went from number one, to now trying to catch up to Sony and Microsoft for market share. A hardware change is a big deal to developers. Apple needs to start paying attention to this because people using Adobe products is major factor driving Mac purchases.</p>
