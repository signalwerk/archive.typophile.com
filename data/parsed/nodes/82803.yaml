    html: |-
      <p>It's not drivel, it's what happened.<br>
      Slabs fell from favor, now they're back.<br>
      This observation is based both on my career as an art director (for 25 years slabs hardly ever seemed an appropriate choice), and on my knowledge of the history of mass media typography (few other ADs spec'd them either).<br>
      Even perusing type specimen books of the second half of the 20th century (not always a clear guide to what was popular), it is apparent how passé slabs became—with the odd exception such as Lubalin Graph ("Avant Garde Slab")—because very few new slabs were published.</p>
      <p>The observation that art directors extrapolate what they think looks good to assuming it reads well for the target audience is something I would have thought you would have concurred with me on.</p>
      <p><em>…too simplistic…</em></p>
      <p>Right. That's why I recommended Neuzeit Grotesk, not Century Gothic.<br>
      Compared with the reductive "f", "j" and "t" of Futura, NG has the usual fully-formed versions of these glyphs, plus friendly round tittles.</p>
