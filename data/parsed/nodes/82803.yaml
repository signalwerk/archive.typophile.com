    html: |-
      <p><em>Futura body copy looks and reads... not so well.</em></p>
      <p>The "look" part is subjective, and so might the "read" part be.<br>
      It's just a question of stylistic preference.<br>
      Up until about five years ago, slab serif types had been rarely used since the 1940s, no doubt because people thought they didn't look and read too well. The came the Clarendon revival, and a colonization of the slab genre by contemporary type designers.</p>
      <p>I've always found it useful to match faces and styles from the same era (unless going for a pointed contrast).<br>
      However, Neuzeit Grotesk, from the mid 60s, is probably what you're looking for. It's classic, vintage, with less of a harshly geometric quality than Futura or Avant Garde, and without the compromise of a two-storey a.</p>
