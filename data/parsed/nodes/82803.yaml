    html: |-
      <p>Hrant, I'm trying to understand your position on modernism.</p>
      <p>It was a characteristic of the Modernist movement, especially for design, that its practitioners believed design had a social responsibility—isn't that how you view type design?<br>
      They felt that decoration was bourgeois frippery, an unnecessary embellishment to the function of design—isn't this how you view display type?<br>
      So in the name of functionalism they removed the seemingly decorative serifs from type—but took it too far, to the extent that types such as Futura are not the most legible or functional. That's the irony of modernism, intent subverted by execution.</p>
      <p>Your belief (if I understand it correctly) that there are certain letter forms which are fundamentally more readable/legible to human physiology is modernist. Isn't that functionalist and mechanistic, and not too far from seeing the process of reading as OCR decoding?</p>
      <p>The idea which you castigate, "That which we read more often we read best" is Post-modern—because it situates readability as culturally specific and admits to multiple subjective viewpoints and values.</p>
      <p>It seems to me that you are a modernist in principle, but have issues with the historically reductive, minimalist style of modernism.<br>
      Are you a neo-modernist?</p>
