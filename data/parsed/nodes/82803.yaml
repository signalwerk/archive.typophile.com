      <p>Naming movements can be useful, but I don't know if finding a label for me -or any individual- is useful. To me Modernism is inherently escapist - it denies the complexities, the inherent lack of control in human existence. On the other hand although Post-Modernism can make sense to me most individuals who associate themselves with it are escapist - many of them strike me as artists who do design only because they want to make decent money; it's almost like Post-Modernism is a sanctuary for those who don't have the mettle for Modernism. If a person does not enjoy figuring out readability for example, he's quite likely to also not have the mettle to admit it, too often he'd rather simply state it's not important. Who's going to pay somebody who says "I'm not sure"? That's why Agnoticism could never be a formal religion BTW.</p>
      <p>hhp</p>
