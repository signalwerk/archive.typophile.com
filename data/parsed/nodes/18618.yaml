    html: |-
      <p>I would suggest increasing the height of your e, and adding just the tiniest bit more contrast to the f, o, s, t, i, and v so that they're more consistent with the contrast in h, a, m, b, u, r, g, e, &amp; n.  I think it's less of a problem at the smaller sizes, but that it would help the color to be more even.</p>
      <p>--Jim K.</p>
      <p>edit: Perhaps o should be taller too.<br>
      2nd edit: Best.  Username.  Ever.  ^_^</p>
