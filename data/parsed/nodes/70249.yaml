    <p>Hi guys,<br>
    Today's question comes from my font Mixteca (you can see in the Crit section) where I'm developing a couple of new weights. I know the spacing/kerning on the base weight isn't quite perfect yet, but I'm wondering if the metrics can be successfully applied to the bold and the thin. What I'm thinking is to copy the metrics exactly, then add +10 (for instance) to the bold and -10 to the thin.</p>
    <p>Reasons for: glyphs have same architecture, serifs and heavy strokes in the same places, kerning pairs should be the same.</p>
    <p>Reasons against: different weights have been drawn optically so widths of glyphs are not consistently scaled. </p>
    <p>I suspect the answer might be that the only way to tell is to test it, but I'm wondering if anyone would care to share experience of spacing different weights? I couldn't find any info on spacing different weights in the resources I have. Any pointers?</p>
