      <p>I use the same spacing for all the weights, normally applying a bit more space (≈+10) to the thiner weights and a a bit less (≈−10) to the bolder weights – that is because it helps to the boldness of the typeface: if spacing is added, the font looks lighter. Of course, you need to test if the spacing added or deleted is the ideal amount and some modifications must be applied to some glyphs.</p>
      <p>As for the kerning, I start with the same pairs for all the weights, but often the bolder weights need more kerning pairs since the glyphs are closer, and some pairs of the thiner weights look a bit odd (excessive in some pairs, not sufficient in others). In short: it is a helpful starting point.</p>
