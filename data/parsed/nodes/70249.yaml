      <p>What Nick said. You have to check the spacing of the middle weight too. Not only because the relationships have changed but also for mechanical reasons.</p>
      <p>Take a run-of-the-mill sans-serif for example.</p>
      <p>The angles of the AKVXWkvwy will likely change from heaviest to lightest. It's especially relevant in glyphs with diagonals. Even if you've adjusted the spacing and kerning for the heaviest and lightest weights, the transition of the negative space between some glyphs is not always linear.</p>
      <p>The way the heaviest L or T fits with other glyphs is different than the way the lightest L or T fits with other glyphs. When you tuck a fat L into an O, there's a sharp corner and some negative shapes to deal with. With an ultralight, there's no sharp corner, just a line. If you don(t give it an extra kerning tuck, the gap hay look too wide. In my experience, the transition between weights for these situations is rarely linear.</p>
      <p>Ultralights have problems that medium and heavy weights don't have. Periods, commas and quotes are hard to discern in an ultralight. A bit more space can help make things clearer. But a medium weight doesn't really have the same problem. The periods, commas and quotes are quiet easy to discern. If you rely on a linear transition for the medium weight, the spacing of these glyphs may seems too loose.</p>
