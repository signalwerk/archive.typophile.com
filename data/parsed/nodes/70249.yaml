    html: |-
      <p>1)<br>
      So, when you have, say, Thin and Black as frames for your design, with acceptable metrics and kerning, you can get every other weight by linear interpolation.</p>
      <p>2)<br>
      But when you make bigger adjustments in design - and spacing - of the interpolated weight, the lines change into curves.<br>
      So, after next interpolation, "linear" letterspacing must be adjusted according to the curve.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/del2_4850.gif"></div><p></p>
      <p>As you can see, the more interpolations, the more similarity between the curve and lines. Spacing of DemiBold and DemiBlack in my example probably wouldn't need any changes. </p>
      <p>And now, when having the structure of our family, we start making changes to the kerning independently, we'll get a wavy output, where every weight has it's own, random line length.</p>
