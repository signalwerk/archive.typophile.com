      <p>Opinion from an unexperienced person:<br>
      I'd try optically spacing letters like /H/O/n/o without reference to the original spacing, and then compare and see if you can draw any conclusions.</p>
      <p>I think relationship to the counters is key for letterspacing, so a quick question to arise is what has happened to your counters in your drawing the other weights?</p>
