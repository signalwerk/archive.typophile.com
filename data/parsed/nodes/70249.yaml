      <p>I now create a Thin, Regular, and Extra Bold, which I space and kern manually, then interpolate the other weights.<br>
      The Ultra/Black may require its own treatment.</p>
      <p>I think the reason is that notan plays more of a role in the middle weights, where the balance and rhythm of positive and negative is crucial, whereas in the extreme weights (which are more "display" anyway) the role of proximity between glyphs plays a greater role.</p>
      <p>These are quite different spacing strategies. Helvetica, for instance, is tightly fitted at the extreme weights, but more open in the middle.</p>
