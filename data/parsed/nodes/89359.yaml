      <p>You can also use contextual alternates and set up classes that will or will not allow a substitution. For instance, if a glyph would crash with a certain swash, it would be part of a class of similar glyphs.</p>
      <p>Here is a snippet where the class "No_dcndr" are all glyphs without a decender:</p>
      <p>	sub @No_dcndr @No_dcndr y' by y.tail.long;<br>
      	sub @No_dcndr y' by y.tail.short;</p>
