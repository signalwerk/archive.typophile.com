      <p>Craig, Cristobal and Bill,</p>
      <p>I don't use cpsp anymore.  I now positive kern my caps with each other using classes so that you will get the desired spacing even if the user does not select "All Caps" from the output software. There are not really any more kern pairs because I set right sidebearings of caps to fit lowercase thereby reducing some kerns there.  Letters with gaps like T,V,Y, etc. need to be kerned anyway with lowercase so I set right sidebearings for them to fit caps.</p>
