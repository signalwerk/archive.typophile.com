      <p>Yes, the issue with {case} and {cpsp} is that, in current implementations, they both rely on users applying an All-caps styling.</p>
      <p>In practical reality (in my sphere, anyway), many times all-caps text comes already set in capitals in manuscript; and most designers don’t think/care to go through and apply a redundant All-caps styling to them. So both {case} and {cpsp} features have no effect on those settings.</p>
      <p>To this extent, other approaches — like additional kern classes instead of {cpsp}, or {calt} rules instead of {case} — are more robust solutions. But these are not fool-proof either. And figuring reasonable contextual rules for case-sensitive punctuation (many of which come in pairs — e.g., parens, braces, brackets, guillemets) can be quite complex.</p>
