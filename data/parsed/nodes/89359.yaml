    <p>Some italic cap designs are swashier than others, and often the more cursive/fluid ones do not look good in all-cap settings.</p>
    <p>Are there any instances of traditional-looking typefaces with alternate forms for italic caps based on case context? That is, caps would take one form in normal use and a different one in all cap settings (through a case and/or contextual alternates feature)?</p>
    <p>I know that there are typefaces with two entirely different italic sets (one more cursive than the other), but here I'm referring to alternates contained in the same font file and triggered by OpenType.</p>
