      <p>@ Bill &gt;&gt;After all this analysis, it occurs to me that you could combine both methods: space caps to each other at the tighter intervals dictated by caps-to-lower case, but then use kerning to space out all the caps. Would this be the best?<br>
      ---</p>
      <p>That is exactly what I do.</p>
      <p>By setting only the right sidebearing to fit with lower case, I minimize the bad possibilities.</p>
      <p>The issue is that I prefer to aim my production to the users of more current software and assume the old stuff will fade away.  </p>
