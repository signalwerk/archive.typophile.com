      <p>Cristobal, I used the 'cpsp' to space them out, as Frode says. You don't need another set of caps just to track them out. Though I don't know, another set of caps might be more ideal because then you could kern the more widely spaced set of caps to one another differently in the wider setting than in the narrower. I've never explored that possibility. </p>
      <p>Craig, yes I just used the 'case' feature to turn on the alternative A, like the alternative dashes, Spanish exclamation points, etc. I did a lot of stuff with CALT, but here I thought there were so many possibilities of how to mix the alternates that I figured just a simple 'on' or 'off' for all caps was best. Then if the typesetter wanted to get more fancy they could use the glyph pallet.</p>
