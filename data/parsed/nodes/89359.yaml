      <p>&gt;If kerning is not turned, any method will look bad ... If they don't [have enough knowledge], there is nothing I can do to help them.</p>
      <p>Well, there is something you can do to help, and note that the problem is often with the software, like older Word and some publication programs that don't even allow kerning, especially if I've got it right, open type class kerning, to be turned on.  </p>
      <p>Also are significantly different degrees of badness, so I still think there are trade-offs.  </p>
      <p>To analyze the trade-offs, let me call the one method "space caps first" and the other "positive caps kern."</p>
      <p>First, notice that neither method is a "pure" method. At least the way I did it, I first had the right side bearings of the caps work decently with the n, o, and l. Then I adjusted the left side bearings of the caps to each other. And then I kerned the caps to one another, as well as of course caps to lower case. This results in a decently smooth spacing, with kerning off, and better with kerning on, but tighter than ideal for all caps. </p>
      <p>The way you did the 'positive kern' method, you basically started the same way, but relied on kerning to make all the caps with visually even, wider spacing to each other. I'm not clear what you did about the right side bearings of the caps-were they all wider, to work with caps, or just the TVWY?</p>
      <p>Without kerning you are either way going to have noticeable problems with T, V, W, Y to lower case, but with your approach, since you've given them wider right side bearings to start with, they are going to be maybe still worse.     </p>
      <p>But with the 'space caps first' method you are going to get the same kind of spacing you had in the metal type days. And that I think is going to look acceptable to most people, and better than the method you followed, if kerning is off. </p>
      <p>The drawback of 'caps first' is that without the "all caps" turned on, the caps will be a little too tight. But note that if the person is really knowledgeable, and knows to use 'all caps', they will probably get as good a result as  your method. Or they may not know about 'all caps' but will apply tracking to all caps words, and get the same result. So the drawback of 'caps first' is that the user will have to do an extra key stroke to get the wide spacing. </p>
      <p>The drawback of the 'positive kern' method is that if the kerning is off, whether because the user doesn't know to turn it on or because of software, it will look worse. Also note that if they want to space out the caps in titles, they will lose all your kerning, and have more work custom kerning to get them right. So for that case the knowledgeable user will have more work with 'positive kern' method.</p>
      <p>Another question is whether the tighter spacing plus tracking will be as good a result as kerning to the wider spacing. Kindersley thought so, but it may be that he's wrong and you can get a better default result the 'positive kern way.'</p>
      <p>What do you think?</p>
      <p>So, summing up the pluses and minuses: </p>
      <p>Space caps first, user turns on 'all caps' or tracks caps:<br>
      + without kerning you get 'metal' spacing, which is acceptable to most readers<br>
      + with a knowledgeable user you get the same or nearly the same result as positive caps kerning<br>
      - the knowledgeable user has to do an extra key stroke for all caps.</p>
      <p>Positively kern caps:<br>
      + default caps setting looks good without extra key strokes for all caps or tracking. —Possibly better than space caps first method.<br>
      - if kerning is off all caps looks bad<br>
      - if caps are letter spaced, extra work kerning for knowledgeable user. </p>
      <p>So I think there are significant drawbacks to either method. I was inclined to use the positively kern caps method, as you have, but a certain individual I will call the 'Vineyard Yoda' declared that if you don't space caps first you will never get them right. And being Yoda, I figured he knew about a few more pluses and minuses.   </p>
      <p>After all this analysis, it occurs to me that you could combine both methods: space caps to each other at the tighter intervals dictated by caps-to-lower case, but then use kerning to space out all the caps. Would this be the best? </p>
      <p>I still don't see a conclusive case for one approach.</p>
