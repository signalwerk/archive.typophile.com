    <p>Since everyone here I think uses Flash do people also use what I think is new Flash Paper? Here is an example, forget the quality of the design, focus on the Flash Paper application. It appears that you need only the Flash Paper application to make this work, but maybe I am wrong. Also appears to be for PC only, unless you spend some more bucks for add ons for MAC.</p>
    <p>To me this looks like a very useful tool.</p>
