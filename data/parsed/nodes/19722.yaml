    <p>hello,</p>
    <p>Right now I'm working on the symbol for a children's theater. It's a non-profit project, where children can take participate in the act, and learn how to deal with social problems. The client wanted to use the child in the logo (they have used clip-arty stick man in their old logo.) I tried to create a person of young age. he/she should be dynamic, friendly, soft and show the fun aspect of the theater. </p>
    <p>The client has approved the shape, but now it needs tweaking and finetuning.</p>
    <p>I'm having problems getting the curves quite right - especially with the legs.</p>
    <p>I'd appreciate your comments and help :-)</p>
    <p>Many Greetings,<br>
    le_samman</p>
