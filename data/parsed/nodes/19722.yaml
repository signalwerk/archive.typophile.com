      <p>I think the geographic status of the logos is a separator here, I don't believe Cingular has a presence in Europe, and anyway that type of figure is hardly exclusive.<br>
      As for the figure the thickness of the limbs is too thin, the head is too tall for me I would look at a rounder shape for the head, especially for a child. Opening your pdf in Illustrator it looks as thought you have used more points than are necessary, by reducing them I think you can get smoother transitions.<br>
      Tim</p>
