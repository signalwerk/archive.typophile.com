    html: |-
      <p>Thank you all for your responses. I see that the similarity has arisen - certainly not consciously. But I feel tim is right. cingular has no presence in central europe, and could hardly get in conflict with a non-profit children's theater organisation. That the shape isn't exclusive to cingular is another factor. however, I will anyways let the client know of this similarity at tomorrow's meeting. </p>
      <p>I have now refined the shape. I have deleted (hopefully all) unnecessary points. I have attached a pdf, <a href="http://typophile.com/files/styleguide_v.1.0.pdf" rel="nofollow">styleguide_v.1.0.pdf</a>, where you can see how the logo will be used in the future - on page three and four you see that the little guy can also "speak" so to say. words, i.e. virtues like "respect!" or "honesty!" used in combination with the symbol to express different aspect of the theater.</p>
      <p>also, I will be developing a colour palette - and in the future a few more poses which will serve to accommodate the brand architecture of the organisation.</p>
      <p>I'd love to hear your comments! any feedback on the font? (it's "ff info" for your info..)</p>
      <p>Greetings,<br>
      s</p>
    html_clean: |-
