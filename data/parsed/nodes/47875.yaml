  html: |-
    <p>I'm a designer who knows that I need a lot of help improving my type skills. Will you me give some valuable critiques on which typographic version you prefer and what I could do to improve either? At this point, I'm only concerned about the actual letterforms, not any icons or anything else.<br>
    I'm concerned that the top version of Canopa feels a little too techy with the "n" with no tail, and I thought the capital "n" felt too... default all caps.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture10_4239.png"></div><p></p>
