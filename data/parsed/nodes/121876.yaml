    html: |-
      <p>To the open/closed counter discussion:</p>
      <p>The fact some counters are closed and some are open is of course not by accident. The idea is to distinguish individual glyphs more, without sacrificing overall readability. </p>
      <p>The thought model that readability of a sans serif (or any font) is <em>always</em> improved by open counters <em>everywhere</em>, is a bit outdated, if you ask me. Closed counters improve readability by forming invisible rails, just like the baseline and x-height, or caps height. Open counters are wanted, necessary even, if the overall shape becomes muddled (as it would be the case if I kept the lowercase “e” counters closed as I have done it with the “c”). In the case of the lowercase “c” and “s”, the shape’s distinctive characteristics are emphasized, they would become less distinctive if I kept the canon.</p>
      <p>The current design tries to join the best of both worlds, the closed counters-philosophy with open counters where it helps distinction. Keep in mind I was designing the font to be used in 12 to 18 point sizes (on regular, modern displays). If you keep a distance of a foot or more to the display, anything below 12 point will look closer to 7 or 8 point on a printed business card. Bot Mono is not well suited for large sizes, unless imperfection is part of the message you want to express.</p>
      <p>I am truly greatful for all your input. It’s great to be pointed to details and think them over. Work is still in progress, as this is a young project, but I’m dedicated to finish up by the end of the year and release it under an open license, perhaps on Google fonts or Font Squirrel. Beta testers are welcome, there will be updates every week now. Just send me an email, you’ll find it on <a href="http://core-ux.com/contact" title="http://core-ux.com/contact">http://core-ux.com/contact</a>.</p>
