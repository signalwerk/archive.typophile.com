      <p>I agree that this looks handwritten -- it's the best way to make sure you aren't copied.</p>
      <p>In addition to Lex's remark about Part 9 of the Script Guide, you might also look at <a href="http://bowfinprintworks.com/Script10Pg1.html" rel="nofollow">Part 10 (Antique Handwriting)</a>. There are some good examples of the sort of individual flair that much modern handwriting lacks, and that may resemble this sample.</p>
      <p>- Mike Yanega</p>
