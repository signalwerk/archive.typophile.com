      <p>Dan, </p>
      <p>pretty good guess. Thomas already showed little bits and pieces of his typeface during his <a href="http://blogs.adobe.com/typblography/atypi2006/Advanced%20MM%20theory.pdf" rel="nofollow">Advanced MM Theory</a> talks at TypeCon and ATypI, so I won’t break any tabus by saying that Hypatia Sans is a sanserif with a geometric structure, very slightly flared strokes, classic uppercase proportions (will go well with Trajan Pro) and an interesting lowercase (small x-height/long ascenders and descenders, short spurs on the ascenders). The lighter weights of Hypatia remind me of Rudolf Koch's Kabel a bit. </p>
      <p>Not sure about the hearts though. </p>
      <p>Adam</p>
