      <p>Yes, it's named after Hypatia of Alexandria. I was looking for an interesting philosopher who was into geometry, so as to imply a straddling of the humanist and geometric genres.</p>
      <p>The "sans" in the name does leave the door open for other variants, but we'll see how exhausted I am after this one. 3000 glyphs per font is about 2000 more than I really want to do again. However, I do occasionally fantasize about doing a slab serif, and then finally a serifed face in the same extended family. However, I have another (smaller) type design project ahead of that in my queue, and I still need to finish Hypatia Sans. So don't hold your breath for any other variants.</p>
      <p>Cheers,</p>
      <p>T</p>
