    html: |-
      <p>Adobe still has a type group of about ten people. In fact, we just hired a new font production person and budding type designer last spring (and advertised the position on Typophile, my blog, and many other places) - Typophile regular <a> Miguel Sousa</a>.</p>
      <p>These days, we release on average about two type families a year, many of which win awards. Mostly it's in-house designs from Robert Slimbach, and occasional outside designs commissioned to cover languages we don't have in-house expertise for. So recently we've had Arabic, Hebrew and Thai fonts made for us by Tiro Typeworks, for example.</p>
      <p>The pace of new releases has slowed considerably, in part due to a smaller staff, but even more due to the huge growth in complexity and size of our typefaces. Looking at our last big release and our next couple of releases, it looks like our typical new typeface has about 3000 glyphs per font. This is the result of both language support and typographic features.</p>
      <p>Coming up, we have two new typefaces to debut this spring. Robert Slimbach's Arno Pro has already been seen in beta form, bundled with the Photoshop CS3 public beta, and has been the subject of a <a href="http://typophile.com/node/30223" rel="nofollow">Typophile thread</a></p>
      <p>My own Hypatia Sans Pro is in the works. We're running out of time, so Miguel and Robert will be doing the kerning, with me just keeping an eye on it and making a few suggestions. Meanwhile I've been spending my time polishing the outlines, with considerable input from Robert.</p>
      <p>Robert's typeface "Gauge" (working title only) is more of a prototype at this point, and I can't tell you anything about a release date, but it can be seen to some extent in the new Adobe product icons that have been <a href="http://blogs.adobe.com/jnack/images/wheel-o%27-icons.html" rel="nofollow">blogged about</a></p>
      <p>Christopher Slye has been busy with the tiny project of doing technical fixes to our entire library, for a planned future dot release.</p>
      <p>Oh, and don't ask me about schedule for any of the above. I can't say, except that Arno and Hypatia Sans will ship with some Adobe products in the near future.</p>
      <p>So, we're not dead yet.</p>
      <p>Cheers,</p>
      <p>T</p>
