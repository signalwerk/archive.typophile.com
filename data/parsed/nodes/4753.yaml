    html: <p>Gregory, I liked the headline small and black. First of all the top building is pointing to it. Did you ever get a drop of ink on a white shirt? Its the only place your eye is drawn. Its the same principle here, lots of light gray sky frames the headline. My only comment is why are you burying the point of the poster, for people in need to make the call. That line should be more prominate.</p>
