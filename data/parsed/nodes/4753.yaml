    date: 2004-05-17T06:30:00
    votes: null
    html: "<p>Gregory: just out of interest, have you ever seen <a href=\"http://www.modern-islands.de/content_kolding.html\">Jakob Kolding's work</a>? <br> <br>He's a Danish (I think) artist who makes these quite rough-edged posters critiquing urban planning. They generally relate to a specific environment or community (usually wherever he's showing or is on residency) and are distributed within that context. <br> <br>You can see some more by doing a Google image search. <br> <br>R <br></p>"
  - id: 34697
    user_id: 3529
    user_name: mad grab
    user_path: null
    date_raw: 18 May 2004 — 12:54am
    date: 2004-05-18T00:54:00
    votes: null
    html: "<p>Thanks Daniel. I still think  Ican do more to this. I  got an extension so I will try out some more things. My teacher disliked the placement of the \"we can\". I tried to justify the location to her , but i dont know. Do you feel i even need the we can in between the buildings?She also suggested to tighten up the bottom text .  Iam sick of this piece.........I cant finish it. <br> <br>robert:  I checked out Jakob Kolding's work I really dig it. I was even more excited to see some skateboarders in some of his pieces. I all ways thought skateboarding was a major urban playground and this is  a message I got from one of his works.. Thanks for sharing.</p>"
  - id: 34698
    user_id: 2915
    user_name: dan
    user_path: null
    date_raw: 18 May 2004 — 5:45am
    date: 2004-05-18T05:45:00
    votes: null
    html: "<p>Gregory try this, make the copy more proactive. Head: Bridge the gap in your life. Sub: Build your social and technical skills, call: 510.208.7360. The idea is the poster is talking to the reader, think of the famous Uncle Sam poster. \"I want you for the U.S. army.\" What my suggestion does is makes only two pieces of copy and you can separate the logo. I do have a problem with the person image, now you have time find a stock image that looks empowering not a victim. The idea is by making the phone call they can take control of their lives(A group?). Once you have the new photo you should feel fresh about this project. Loose the \"WE CAN\" copy, that line is fine for a delivery service like UPS, but an organization like your client can't make that promise. Just some thoughts </p>"
