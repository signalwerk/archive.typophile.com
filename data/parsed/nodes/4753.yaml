    html: <p>Gregory, look at the shadow of th lower building it points at WE CAN! The same can be said for the top building. Its very effective. Can you try one more thing? Since you made the important contact info larger, could you increase the "wall" so you can create more white space between Bridge the gap and Urban Voice. You don't need all that building to make the point. </p>
  - id: 34693
    user_id: 2663
    user_name: speter
    user_path: null
    date_raw: 15 May 2004 — 10:26am
    date: 2004-05-15T10:26:00
    votes: null
    html: <p>OK, maybe I'm being dense here, but I cannot for the life of me figure out what the person is or is doing in this. Is he wearing a hood?  <br> <br>How about putting the "We can help you..." line in lowercase. If this were posted in a NJ Transit train (which is where I do most of my poster viewing these days), the last line would look like IIIIIIIIIIIIIIIIIIIIIIIIIII from your seat. And I agree with Daniel that there needs to be more white (gray) space at the bottom, not only between the Bridge the gap and Urban Voice, but between the contact line and the bottom (especially if this gets put in holder of some sort). That's the most important part of the whole poster. </p>
