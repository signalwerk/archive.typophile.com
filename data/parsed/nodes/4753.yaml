    html: <p>I think the 'WE CAN!' is a bit too shy and retiring. At the moment, it works fine close up, but across the street, say, or a subway platform, it won't register enough. I'd keep the b&amp;w, but blow 'WE CAN!' up to the full width of the poster, and drop it 'behind' the buildings, so that they overlap it a little, and reverse it in white out of the sky. </p>
