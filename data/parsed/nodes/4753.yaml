    html: "<p>hector:  I <br> <br> think it may be unclear to the reader right now because the last line which you cant read at this size explains that Urban Voice can provides technical and social skills to people.  i think the size of the text should probably be bumped up! thnx for looking out <br> <br>I can agree andrew that the We Can! is small. I  tried every location and size and this seems to balance the piece, which was a beginning issue.  But I never thought to blow it up real big like you said. I tried it and actually like it. Sorry about the jaggies i was to lazy to open up ai.  Anyways, i know it could be improved but since its white my only question is.....will people be able to see it? <br> <br>also what do the rest of yall think.... <br> <br>Number 1 or 2</p>"
