    date: 2004-05-17T01:51:00
    votes: null
    html: <p>hey all, <br> <br>I honestly have started to dislike this piece. I cant nail it for some reason. Its weird how when you come up with an idea early in the  process that sometimes its the hardest to finish.  Anyways, I do appreciate all the help.   <br> <br>I decided after all the feedback to tighten the peice more, I cropped it and put more of the wall that was suggested. thnx Daniel for the tip.  I feel that by increasing the size of the other images and text it kinda it helped the issue of "we can" being to small from a distance.   I also put the lower text in lower case so that it wouldnt get lost from far away. thnx Peter for the suggestion. as for the person its just a shot of a guy i took in the city.  I wanted the person to be ambigious . If I had time I would probably reshoot the whole thing and have him looking at the we can but I dont have the time.   <br> <br>I appreciate everyone's help. I am going to pring the poster tomorrow. Its due by 6 pm tomorrow. Iam still open to a crit. Id like to put this piece in my porfolio.  Do yall think its strong enough ? <br> <br>-Greg <br> <br>btw i need to check my margins on the lower text  they look a bit off. <br><img src="http://www.typophile.com/forums/messages/29/36066.jpg" alt=""></p>
