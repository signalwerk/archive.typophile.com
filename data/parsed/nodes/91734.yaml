    html: |-
      <p>YVES is very close to Cheltenham indeed,<br>
      but I think <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/sorbonne-bq/" rel="nofollow">Sorbonne BQ Bold</a></strong> (Berthold) is a better match</p>
      <p>PEINTURES is very close to <strong><a class="freelinking external" href="http://www.identifont.com/show?37X" rel="nofollow">Tiemann</a></strong></p>
      <p>PREFACE DE PASCAL CALUSE is similar to <strong><a class="freelinking external" href="http://www.microsoft.com/typography/fonts/family.aspx?FID=236" rel="nofollow">Estrangelo Edessa</a></strong><br>
      an MS-Windows Font designed to support the Syriac script,<br>
      the main differences being the strange /E of PREFACE and the /S</p>
