    <p>Hello, could anyone please tell me what the three typefaces (or one of them) on the attached book cover are? Is a Yves Klein catalogue from the 1950s. Many thanks in advance.</p>
    <p>I have added a new image which has more of the Sans Serif, there seems to be two different cuts of A and E being used.</p>
