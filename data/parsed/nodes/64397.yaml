  html: |-
    <p>Good evening,</p>
    <p>By uniting two small companies, we have the opportunity to define a new French reference in consulting specialised in IT &amp; networking. The target of our partnership is large enterprises and administrations, to which we provide high level counsel, in technologies, sourcing, and project management.</p>
    <p>I am looking for ideas and advices in typeface selection, to visually render our style: recognisable excellence in new technologies projects.</p>
    <p>I observed for example that Accenture made the choice of Rotis, disregarding the opinion of respected typographers such as Erik Spiekermann.</p>
    <p>None of our constituencies had defined corporate typefaces for communications. The only point of reference is the logotype of the mother group, set in Helvetica (<a href="http://www.setec.fr" title="www.setec.fr">www.setec.fr</a> core competencies, civil engineering, founded in 1957...)</p>
    <p>The constraints of usage are these ones:<br>
    - we are editing and presenting our work in MS Office ; so the typeface family must provide perfect legibility on screen, even in 10pt size<br>
    - a ample choice of weight or styles to express contrast in slides or between titles and text<br>
    - the rendering must degrade gracefully on a computer equipped with the default Windows PC when we send draft documents to our client as DOC, XLS or VSS files without the original fonts.<br>
    NB : am I shooting for the moon?</p>
    <p>Looking forward your responses.</p>
    <p>-jphp</p>
