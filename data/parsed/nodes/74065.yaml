  html: |-
    <p>Last evening we released <strong>Foral</strong> – Rui Abreu's modern slab serif. A project that started almost four years ago. It started as a rigid and geometric design, but during this long period it developed into a more organic and balanced typeface, as it moved away from the initial modularity. Foral maintains its geometric concept, but with harmonized proportions and polished forms</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/foral_spec_typoph_5900.png"></div><p></p>
    <p>Foral Pro is a eight-weight typeface, ranging from Light to Extra Bold with matching italics. It come with Small Caps and a wide range of OpenType features, allowing extensive and versatile use.</p>
    <p>For a closer look and  got to the <a class="freelinking external" href="http://www.fountaintype.com/typefaces/foral" rel="nofollow">Foral page</a></p>
    <p>Download <a class="freelinking external" href="http://www.fountaintype.com/specimens/67/original/FTN_Foral.pdf" rel="nofollow">PDF</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/foral_spec_typoph_b_5357.png"></div><p></p>
    <p>thank you for your time</p>
    <p>Peter W. Bruhn<br>
    [Fountain]</p>
