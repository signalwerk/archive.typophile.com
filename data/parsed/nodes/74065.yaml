      <p>This looks fairly good. Congratulations.</p>
      <p>You might want to re-evaluate the weight of the vertical serifs against the horizontal ones in the uppercase light cut. Take a closer look at L-U-T-E.</p>
      <p>And the lowercase s seems (to me) being *slightly* too little in Regular and perhaps other styles. Maybe vertical scaling 101% helps.</p>
      <p>I wish you success!<br>
      A. St.</p>
