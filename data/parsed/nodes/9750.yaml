    html: "<p> I see you're using the conventional meanings <br>of \"legbility\" and \"readability\", and I agree <br>that aesthetics and functionality are often at <br>odds (in fact, I might say they're inherently <br>so). But I've concluded that there are two main <br>types of reading, and that distinction leads <br>to a bunch of interesting realizations. <br> <br>For example, fonts meant for continuous reading <br>need more generous extenders than fonts meant <br>for signage. This is because during immersive <br>reading we try to read *words*, not letters, <br>and this ties in (in part) to the way our <br>retinas are \"built\". Esoteric, but true. <br> <br>Dwiggins was one designer who didn't appreciated <br>this fact, even though I think he was a really <br>*brilliant* designer in other respects. <br> <br>Slips: <br>Interesting point about wanting to write/edit. <br> <br>Guessing: \"That's a feature, not a bug.\" <br>Our brain guesses, because it can do it well <br>enough that it speeds up reading. In fact, <br>guessing is at the heart of reading, if you <br>think about it. Not as much when reading <br>individual letters, but certainly during <br>immersive reading. <br> <br>hhp </p>"
