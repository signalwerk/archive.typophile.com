    html: <p> And this is the point at which one chooses a more *readable* (enjoyable and/or pleasurable) typeface to assist in the *legibility* (discernable and/or decipherable) of the written text.  <br> <br>But, must the face have long ascenders and descenders? I know a few news/text type designers (dead and alive) that might argue this point. ((I'm not saying I necessarily agree with them.)) <br> <br>Freudian slips. Perhaps that comes from wanting to write the text or at least edit. Are we sometimes too lazy in our reading and guess at the words? This is where context can cause problems I suppose, or rather putting our own assumptions on the text. </p>
