    html: <p> Context is indeed *very* relevant. <br>There's a true story of how a patient of Freud's -who desparately wanted to have a child- kept reading the word "stock" as "stork"... This type of stuff happens to me all the time (even though I have no hope of ever getting pregnant :-), and as soon as they happen I spend the next half hour trying to figure out why! For example, I once read the word "Toronto" as "Tomato", and I think it's because the article was about graphic design (noting that Tomato is a famous British design firm). Another time I read the proper name "Perral" as the word "Federal", [maybe] because it was on a highway sign. <br> <br>hhp </p>
