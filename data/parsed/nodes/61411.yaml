    html: |-
      <p>&gt; Online type design instruction. Really? How would that work?</p>
      <p>You would be surprised at the tools we have now. For instance, you and I can be connected (along with 12 or more other students) and if you are teaching I will be able to see your computer as you draw a character in FontLab, while listening to you explain what you are doing. I can't see how that would be more difficult than in a classroom.</p>
      <p>In fact, with the software, if I have FontLab, you (as the instructor) can see my FontLab screen as I try to do an exercise, and you will quickly see where I am going wrong on some task I have misinterpreted.</p>
      <p>I firmly believe type design is an ideal subject for online learning, because the numbers of people who are interested in learning from an expert are generally scattered in many different locations. Only those living in the megopolises get to take courses like this one otherwise.</p>
