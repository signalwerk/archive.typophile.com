    html: |-
      <p>When I taught undergraduate type design I always expected the students to finish their typeface in the allotted time (15 weeks 2:40 per session). One weight, full character set (western european latin) with one OpenType feature. I explained to them that a professional would do the work in about 200 hours, so they should allot at least twice that much during the course of the semester.</p>
      <p>I made it clear at the beginning of the course that if they didn't finish, they would fail the course. Without that pressure they had no incentive to work hard on their projects. </p>
      <p>Did they make good type? Hardly. Some of them came close, most were obvious first attempts. But they were exposed to the process, they learned how truly difficult making type was, and they all had a deep sense of accomplishment when they used their newly finished font to design a poster showing it off. Most told me it was the best design course they ever took.</p>
      <p>Continuing Ed is a different environment, but I still expect the commitment to finish what one starts.</p>
