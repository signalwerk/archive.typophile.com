      <p>I don't think I'm tough. I try to be honest, and give students their money's worth. I have been teaching a long time, and I think the biggest mistake new teachers make is not having high enough expectations of their students.</p>
      <p>You set the bar high, and see who can get over it. If no one can, you can always lower it a bit for a particular student or class. But if you set the bar too low to start, you've cheated all of those students.</p>
