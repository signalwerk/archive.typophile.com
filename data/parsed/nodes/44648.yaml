      <p><em>eh? unconsciously wanted to ripoff?</em></p>
      <p>concrete... look at the emoticon next to my statement about form fitting content... I was joking, and I was talking about Led Zeppelin, not Shepard Fairey!</p>
      <p>But seriously, folks... Shepard Fairey has a recognizable visual style... So do a lot of other artists and designers. And the band Led Zeppelin have a number of recognizable visual tropes: the burning Hindenburg they used on their first album cover, the C.R. Mackintosh lettering they started using in 1973, the four symbols they used on their so-called "Zoso" album... So why wouldn't they use all of this stuff for a compilation package?</p>
