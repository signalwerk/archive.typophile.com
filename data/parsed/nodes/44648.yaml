      <p>I've thought some more about the cover art... It's kind of surprising that Zeppelin didn't go with their usual designer, (ex-Hipgnosis partner) Storm Thorgerson. If I were very cynical I would guess that they chose Shepard Fairey as a way to appeal to a younger audience, but who knows?</p>
