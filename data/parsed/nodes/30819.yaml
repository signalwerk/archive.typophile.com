    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Sebastian Lester</strong></p>
    <p>British designer, trained at Central Saint Martins College of Art and Design, London. Early type designs released with <a href="/wiki/T.26" class="freelinking" rel="nofollow">T.26</a> and <a href="/wiki/GarageFonts" class="freelinking" rel="nofollow">GarageFonts</a>. Currently designing custom and retail type at <a href="/wiki/Monotype%20Imaging%20Inc." class="freelinking" rel="nofollow">Monotype Imaging Inc.</a>, notably sans families: <a href="/wiki/Scene" class="freelinking" rel="nofollow">Scene</a>, <a href="/wiki/Neo" class="freelinking" rel="nofollow">Neo</a> Sans, and Neo Tech.</p>
