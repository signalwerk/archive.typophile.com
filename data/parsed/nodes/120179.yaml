      <p>ttfautohint only adds truetype hinting, emulating the autohint used in FreeType. However TrueType hints are (for the most part) only used on windows systems, so they don't effect the way that PDFs are rendered. </p>
      <p>However to answer your second questions about what to do for improvement, I think we'll need some more images to see exactly what the issue(s) are.</p>
