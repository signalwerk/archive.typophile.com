    html: |-
      <p>Hinting, whether of TrueType or PostScript outlines, affects most non-Apple rendering environments, including those from Microsoft, Adobe, and often FreeType*.</p>
      <p>With “Adobe” you can include the rendering in Adobe Reader, Acrobat, InDesign, Photoshop and Illustrator—even on Mac OS.</p>
      <p>* FreeType can be set to ignore hints in the fonts like Apple does, autohinting on the fly. Indeed, the TTFautohint hinting is based on the autohinting created for FreeType. But I gather many FreeType-based environments choose to respect the hinting in the font.</p>
