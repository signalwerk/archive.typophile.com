    <p>I was wondering if anyone has experience with <a class="freelinking external" href="http://www.freetype.org/ttfautohint/" rel="nofollow">ttfautohint</a>. The website offers a lot of information on hinting, but I can't find any information on how to actually use this software. I ran a ttf file through the program and it spit out a file without an extension. I added .ttf and it's a workable font which is 32kb bigger than the original file, so I assume it works. However, I don't know what the best settings are, and does anyone know if this can help me with hinting otf fonts as well? It doesn't run through the program in any case.</p>
    <p>The reason I'm trying this software at all is because I recently finished my first typeface for a client and although he's very satisfied when it comes to the appearance of the typeface in print, he feels the rendering in PDFs should be better and I have to agree. I concluded it must be due to the fact the fonts haven't been hinted, but in all honesty I'm ignorant as to what I can do. The client isn't looking to spend more money so I figured ttfautohint is just what I needed.</p>
