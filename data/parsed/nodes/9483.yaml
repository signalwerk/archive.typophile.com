    date_raw: 25 Feb 2015 — 5:36am
    votes: null
    html: |-
      <p>1. Methinks (and I don't consider myself a full professional) we will see more bigger and diversified font families in the future. People will want to have a sans-serif accompanied by a serif, a script, grunge, inline and so on to save them the trouble of matching fonts. Multilingual support will become more important and the overall size of font files will increase. China will get on board with an increasing demand for kanji versions of fonts, and they should be well matched.</p>
      <p>2. Fonts will be not only more diverse, but will be designed for devices with better and better resolution that will surpass the resolution of the eye. We'll see 30" Retina displays in the near future, and fonts for them. Probably devices themselves will be as thick as paper, and will be able to be folded - thus no separation between tablet, monitor, computer, smartphone. </p>
      <p>3. By analogy with TV, type will probably move out of black and white territory and become colourful by design. You will be able to do design much more easily, MS Word will be able to do much of the stuff Photoshop does now. Maybe there will be better possibilities for animation of type, spawning a row of "kinetic typography of my laundry list" - type of design, same as with flash and it's "skip intro"</p>
      <p>4. All in all, people will become much more lazy and difficult to entertain. They will want EVERYTH1NG, N()W! A simple well-made font, 2-3 weights, some italics - that won't be able to suffice. In an ecology of information overflow and a gazillion fonts, only the biggest families will be able to hold their own.</p>
