    html: |-
      <p>Well, they may or they may not, depending on how intelligent the browser is. 12px on a 96 dpi (standard) display should be scaled to 38px on a 300 dpi display. There's no reason px has to map to actual device pixels.</p>
      <p>For example, with Apple's double-resolution "Retina" display, px doesn't map to pixels anymore. And of course it never really did since Mobile Safari scales the page in various ways as the user manipulates it.</p>
