    html: |-
      <p>On my private pages I use mm (millimetres), an absolute size. Mind, they are mostly a fanfic library, so the expectation that 4.23mm (12pt) remain 4.23mm nomatter if your display unit resolves 3.8dpmm (~96dpi) or 47dpmm (~1200dpi) sounds reasonable to me.</p>
      <p>The em is a relative size. 1em is 100% of the parent's font-size parameter.</p>
      <p>Btw: I copied your page onto my machine, then went... playful... on it.</p>
      <p>1. I copied the 'font-family' from 'body' to '.entry', then changed the one in 'body' to be an Arial/Helvetica/sans-serif catch-all. In 'body' I also dropped 'line-height'.<br>
      2. To 'font'family' in '.entry' I added Droid Serif and Nimrod, both of which are tall-x types that put up with a font-size of 13px.<br>
      3. I added 'font-style: normal' to '.entry p:first-child:first-letter' since I preferred to see the cap upright.</p>
      <p>Just for the hack, I then tried it with the freely-available (and GPLed) ADF types:<br>
      1. Added 'Gillius ADF' to '.smallheadline1', '.smallheadline2' and '#menu a'.<br>
      2. Added 'Tribun ADF Std' to ',entry' and upped 'font-size' to 14px.<br>
      3. Added 'Tribun ADF Std' to '#content div .largeheadline'.<br>
      4. Added 'Tribun ADF Std Cond' to '#blogtitle h2' and '#tag'.<br>
      5. Added 'Universalis ADF Std' to 'body'.<br>
      6. Added an '.entry blockquote' subsection:</p>
      <p><code><br>
      	.entry p:first-child::first-letter {<br>
      		font-style: normal;<br>
      		font-size: 3.571em;<br>
      		line-height: 0.76em;<br>
      		padding: 0.04em 0.08em 0 0;<br>
      		color: #C00;<br>
      		float: left;<br>
      		}<br>
      	.entry blockquote {<br>
      		font-family: "Ikarius ADF No2 Std";<br>
      		}<br>
      		.entry blockquote p:first-child::first-letter {<br>
      		font-size: 2.571em;<br>
      			}</code></p>
      <p>FYI, Gillius is a Gill Sans look-a-like, Tribun resembles Times and Universalis has a Futura flavour. Not sure about Ikarius.</p>
