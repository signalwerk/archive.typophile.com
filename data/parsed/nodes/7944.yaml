  html: "<p>As if Reading Uni here in the UK didn't already offer enough reasons to study type there, this is from today's Guardian: <br> <br>Bright sparks <br> <br>Reading University has become the seventh in the country to turn to green power following pressure from students to switch to 100% renewable sources such as wind- and water-generated electricity. Tom Chance, coordinator of the Go Green campaign at Reading, says: \"After two years of campaigning for the university to go green, we are ecstatic it has made this huge step to helping the environment.\" Oxford, Bradford, Sussex, Loughborough, Huddersfield and Sheffield Hallam universities have already changed to renewables.&lt;/font&gt;</p>"
