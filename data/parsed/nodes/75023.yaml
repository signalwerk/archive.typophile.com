    <p>Here are samples of Greater Albion Typefounders' latest two releases, which have just launched on myfonts.com and fontspring.com.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/paragon/ " rel="nofollow"> Paragon</a> is a display Roman family of nine faces, combining elements of formality and fun.  It embodies a high degree of contrast between near hairline horizontal strokes and bold vertical strokes.  The family is offered in three widths and in regular, small capitals and title faces.  Use Paragon to lend impact to your next design project.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Paragon_Gallery_1_6643.png"></div><p></p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/compton/ " rel="nofollow"> Compton</a> is a clean modern slab serif face that emphasises simplicity of line and legibility.  It's offered in three weights, regular, bold and light.  Compton brings the spirit of th 60s and 70s to the present day.  It is ideal for clear simple graphic design that makes an immediate impact.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Document1_4748.png"></div><p></p>
