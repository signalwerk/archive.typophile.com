  html: |-
    <p>I am an absolute dilettante (and that translates “I love typography”) and that is why I have just devoured the forums without being able to contribute. But after some very interesting threads</p>
    <p>e.g.<br>
    <a href="http://www.typophile.com/node/17260" title="http://www.typophile.com/node/17260">http://www.typophile.com/node/17260</a><br>
    <a href="http://www.typophile.com/node/36423" title="http://www.typophile.com/node/36423">http://www.typophile.com/node/36423</a></p>
    <p>I guess it’s time someone wrapped me in a straightjacket for otherwise I will strangle the next person who tongue-in-cheek asks for “a free font very similar to that famous …”.</p>
    <p>Of course I always realized that it is hard work to create a typeface, but the amount of individual and collective theory development, historical research and meticulous craftsmanship involved makes me feel grateful that as a single non-commercial user I spend only 20 to 50 Euro for a good font.</p>
    <p>Thanks to all you professionals!</p>
