      <p>His fonts at Emigre are still available—it seems to be rather that Thirstype's fonts are no longer commercially available. The old URL thirstype.com redirects to Village, but Village is no longer selling Thirstype fonts. (I've contacted Village to see what they have to say.) Meanwhile, <a class="freelinking external" href="http://barrydeck.com/original/Barry.Deck.Type.html" rel="nofollow">this page</a> from Barry Deck's old web portfolio links to www.3st.com—the new web site of Rick Valicenti, founder of Thirstype. But they don't market fonts at all. On top of all that, Chester Jenkins, who used to run Thirstype after Rick, apparently <em>co-founded</em> Village, but the only Thirstype fonts still available on Village are his, now published by the foundry <a class="freelinking external" href="http://www.vllg.com/foundries/Constellation#panel=news-gallery-about" rel="nofollow">Constellation</a>. (Well, and two others—Oz and Radio.)</p>
      <p>I guess I'll wait to hear from Village.</p>
