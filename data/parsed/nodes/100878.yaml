      <p>Q. "Once somebody says they found a legitimate means why not give that the benefit of the doubt and remove the illegitimate link?"</p>
      <p>A. "Once somebody says they found a legitimate means why not give the rest of us that info?" The one who gets an answer should not just be a Hoover and suck up all the info and return nothing.</p>
      <p>The Type ID forum serves not only those looking for an ID but the rest of us. Not letting us all in on the solution is a tease and a disservice. It's as if "I'm satisfied, but I'm not giving details," akin to an inquirer getting an answer by email the rest of us can't see.</p>
      <p>And hpp, you take your swipes directly at others in response to them, which is fine, if a little tiresome. Please do not use threads where they do not post to take indirect swipes at them, where they probably do not have a chance to respond. You're better than that. Or should be.</p>
