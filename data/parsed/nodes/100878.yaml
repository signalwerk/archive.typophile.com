      <p>David, great to see such an air-tight protocol.</p>
      <p>Steve might say (and I would agree) that you solved your dilemma thanks to a privileged position (which does not mean you didn't deserve it). But to me that still doesn't excuse an unauthorized link. To me the only justification for that would be if one believes the designer/distributor has acted in an unethical way, and going against their will is an act of justice.</p>
      <p>When a commercial font is pulled from the market, there's usually an honorable reason. Is it bad to reciprocate honorable behavior? And if it's not an honorable reason, does that mean we can/should be dishonorable?</p>
      <p>hhp</p>
