      <p>I will share the solution to my particular issue (and apologies for not doing it earlier), but I don't want to get bogged down in a larger discussion of abandonware, as I don't think this is the forum for it. (I do think it's a necessary discussion, however, and not always clear-cut.)</p>
      <p>In my particular case, I contacted the foundry, and spoke with the principal there. Given his good relationship and history with my client, and the scope of this project (being a single reprint of a long in-print book), he granted me a gratis license for use on this project only. The font is still not commercially available; if I wanted to purchase a new license for a new project, I would have to continue my quest, or find a new typeface. Had I been unsuccessful with the foundry, I would have tried to contact the designer directly. Had all avenues failed, I would have needed to confer with my client on how they wanted to proceed and/or worked directly with the printer to update the files (at a significant expense).</p>
