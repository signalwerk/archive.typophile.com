      <p>I heard back from Village née Thirstype, so for this particular instance, I'm settled. In other instances, I've always attempted to contact the original foundry and/or designer, and failing that, looked for another cut of the typeface. (An example: OPTI Majer Irregular is no longer available, and is of questionable origin to start with, but was a legacy font picked by a client before I started working with them. We were able to replace that typeface with Filmotype Major across all uses.)</p>
      <p>It is a bit ludicrous in the age of the Internet that legitimate (and paying) users of typefaces can't always find a straightforward way to compensate the owners of the intellectual property. But not doing so is still theft. That being said, a designer who allows their font to go "out of print" (as opposed to pulling the font because of some defect) is basically throwing money away—while I believe many end users want to do the right thing, most will only do so if it's made painfully easy for them.</p>
      <p>And RM, I just saw your reply, and it is a difficult but relevant gray area—what do you do when there are no legitimate options/resources left? Thankfully in this case, it didn't come to that. And that discussion is probably best left to its own thread.</p>
