    <p>Hi all,</p>
    <p>There's this font, Truth Normal (and Truth Normal Slanted):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/truth_3939.png"></div><p></p>
    <p>Does anyone know the history of this font, and if there is a commercially available version? I haven't been able to track down the original designer/foundry, and it seems as though this particular typeface is no longer available. (Trying to reprint—with corrections—a legacy document for a client.)</p>
    <p>Thanks for your help!<br>
    D.</p>
