      <p>David: <em>I heard back from Village née Thirstype, so for this particular instance, I'm settled. </em> Does that mean they sold you the font you were looking for? Did they say why it's not readily available? Do they still own the rights? What would you have done if they didn't or couldn't resolve the issue? </p>
      <p>David and hpp: <em>Not to compensate the owners of the intellectual property is still theft. </em>  If the owners of the intellectual property make it difficult or impossible for others to compensate them, who is the theft from? "The moral core of the universe" doesn't count as an answer.</p>
      <p>Kudos to Akira for ostensibly finding ways to contact Barry Deck. However, not one of them has an email address or a contact form, although Barry did post a link to "the West-Egg biscuits and gravy plate" on his website. The Linkedin info essentially duplicates his website info, I'm not going to agree to Linkedin's TOS just to "access Barry Deck’s full profile," in case it may have contact info, and I don't tweet. Would that Barry followed the motto on his website: "Simplify. Scale. Sustain." He doesn't make it simple to contact him, and he did not sustain his own fonts.</p>
      <p>That this had a happy ending for David is no reason to be smug and say I told you so. It doesn't address the issue of abandonware, or what to do if all reasonable attempts to make contact fail.</p>
      <p>Post the relevant info about how, how much, and where to purchase the font, and I'll remove the link above.</p>
      <p>Off topic: Except for "reprinting—with corrections—a legacy document for a client," I don't see why anyone would use that font.</p>
