    html: |-
      <p>This issue has been raised before, with many variations.</p>
      <p>What if someone buys a font, and their computer crashes and the font is lost? In many cases, just go to the vendor and download it again. Or you created a brand identity or logo and the original designer is unavailable or refuses to help. You look for the font, and it's nowhere to be found.</p>
      <p>What if the font company goes out of business with no one picking up the assets? What if the font is abandonware? If I needed a font to <em>recreate</em> something already extant, as opposed to just <em>wanting</em> a particular font, there's no telling what I would do.</p>
      <p>It's easy to to be an absolutist, pontificate, and say "the worst thing is to help him download from illegal resources, as Renaissance Man did." I understand that people die, companies go bankrupt, foundries are taken over, and shit happens. In those cases, the legitimacy, morality, or legality of recreating a font ("outline theft") or downloading from "illegal resources" is less clear cut. If you want absolutes (and absolution) join the Republican party or the RC church.</p>
      <p>I would NOT recommend a questionable source if there was a legitimate alternative.</p>
      <p>This is NOT about "illegal resources," but what to do when all legitimate sources have dried up.</p>
