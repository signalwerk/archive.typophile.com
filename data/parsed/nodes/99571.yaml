  html: |-
    <p>In the book "Quantum Information and Quantum Computation" by Nielsen and Chuang, they use a font which is undoubtedly Erhardt (judging by the regular text), but the italic text seems to be somewhat different from the examples available at major foundry sites. See "ehrhardt-nielsen.png" and "ehrhardt-monotype.png" attached which contain the example from the book, and the same text set with Monotype Ehrhardt. The book variant is less stretched and, in my opinion, is significantly more readable in long italic paragraphs. Does anyone know what subtype is this?</p>
    <p>Parts of the book are available <a class="freelinking external" href="http://books.google.com.au/books?id=-s4DEy7o-a0C&amp;lpg=PP1&amp;dq=quantum%20computation%20and%20quantum%20information&amp;pg=PA5#v=onepage&amp;q=quantum%20computation%20and%20quantum%20information&amp;f=false" rel="nofollow">on Google Books</a> (not in particularly good quality though), if you need larger samples of text.</p>
