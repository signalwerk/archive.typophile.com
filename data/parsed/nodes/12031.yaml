    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : 2Rebels</strong></p>
    <p>Unique to Montreal, <a href="http://www.2rebels.com/" target="new" title="Go to the website" rel="nofollow">2Rebels</a> is a small business with big ideas formed in January 1995 to create fonts for other like-minded designers. 2Rebels offer a variety of typefaces ranging from the traditional to the experimental. Going beyond the classical, their approach is at times subversive, transforming the normal and accepted into innovative and personal font-images. 2Rebels in its own way hopes to contribute to the on-going revolution in typography and invites others to do the same. Right now is the biggest typeface foundry in Canada, and probably the most renowned.</p>
    <p>2Rebels features typefaces by:<br>
    <a href="/wiki/Annie%20Bastien" class="freelinking" rel="nofollow">Annie Bastien</a><br>
    <a href="/wiki/Robert%20Beck" class="freelinking" rel="nofollow">Robert Beck</a><br>
    <a href="/wiki/Christian%20B%C3%A9langer" class="freelinking" rel="nofollow">Christian Bélanger</a><br>
    <a href="/wiki/David%20Boon" class="freelinking" rel="nofollow">David Boon</a><br>
    <a href="/wiki/%C3%89ric%20de%20Berranger" class="freelinking" rel="nofollow">Éric de Berranger</a><br>
    <a href="/wiki/Marc%20Borgers" class="freelinking" rel="nofollow">Marc Borgers</a><br>
    <a href="/wiki/Christine%20C%C3%B4t%C3%A9" class="freelinking" rel="nofollow">Christine Côté</a><br>
    <a href="/wiki/Denis%20Dulude" class="freelinking" rel="nofollow">Denis Dulude</a></p>
    <p>2Rebels fonts are available through <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a>.<br>
    ...</p>
