    html: |-
      <p>Thank all of you for your kind comments:</p>
      <p>satya: Yes I knew the Pulp Fiction Animation. Really impressive - on a whole different level. I haven’t seen the mk12 animation though. Thank you for the link.</p>
      <p>nicola: You are damn right with the AE thing. Though I would have used Combustion rather then After Effects.<br>
      But I did the whole piece in 3dsmax. The stupid thing is that this scene is just one real scene. I’m not scaling anything - it’s just a camera that is flying through the words.<br>
      Because of that I had some really big problems with the animation, since all 3d Packages tend to have problems with really small values. The clock at the beginning for example is around 100 km in size - compared to the smallest sentence (“to see the truth”) which is 2 mm in size. That’s too much of a difference for any 3d package I think. So I should have used AE in the first place, as you said. I could have done the editing (or beat matching) there on the fly as well.<br>
      And the beat matching was my problem as well. I had a version with motion blur. But it was hard to control, because it was too much in most of the scenes, because of the extreme zooms. You are probably right, but I left it out with intention (together with film grain, dark corners and other fancy effects) - to see the crystal clear truth you know ;)<br>
      You work is top notch. I have concentrated on 3danimation but will damn sure get closer to motion design... it’s such a powerful field (as it becomes obvious on your site)<br>
      thanks for your suggestions.</p>
      <p>paul d hunt: :D Thank you for the link. It is brilliant. ’Love it!</p>
      <p>Eben Sorkin: Thank you. What do you mean with more surprises?<br>
      Yeah the pace was really hard. It’s hard to get an idea how fast people read... and I didn’t want people to stress too much when they read it. By that it turned a tad too slow probably.<br>
      Next is... well a lot of projects going on - this was more a weekend job... check my website and blog for updates :) <a href="http://www.alexanderlehmann.net" title="http://www.alexanderlehmann.net">http://www.alexanderlehmann.net</a></p>
      <p>The music was done and final before I started working on this. This is a compliment though - since it really seems to tie in great. :)</p>
