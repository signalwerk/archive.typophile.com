      <p><cite>AE might be a good next step. But it’s a big step. Both in terms of concepts to grip and in terms of cost.</cite><br>
      I don’t really know the legal side of it, but for type animation you are basically set with AE 6 or 6.5 (I think even 5 is ok, but later they introduced the ’text’ object), so if you can manage to get an old version (used or obsolete), that would be almost just as good as CS3.<br>
      <cite>I could have enjoyed a slightly faster pace actually. And maybe more surprises.</cite><br>
      I agree, but I think he chose to stay very close to the music. I wonder if he worked on the completed music or had some kind of creative feedback with the composer.</p>
