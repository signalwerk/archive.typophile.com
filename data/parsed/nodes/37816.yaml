      <p>Hey,<br>
      I liked very much the beginning and the music; also you seem to have grasped some of the very first visual tricks of typography based animation. Since motion graphics is <a class="freelinking-external" href="http://www.motions.it">my main source of income</a>, I can maybe tell you a couple of things I noticed wathing the video. I can gather you worked in flash, right? To achieve a more interesting look you could (if you aren’t already) begin to investigate After Effects: the software isn’t as simple as flash but so are the results.<br>
      Working in AE can give you a lot more control to the dynamics of the animation (I noticed some unsure passages here anad there), and something crucial to motion graphics in general and type animation in particular: motion blur, an often overlooked detail that can spell the difference between ’rich’ or ’poor’ animation. In addition to that AE lets you animate characters in a 3d-planes world... not that i don’t like the 2d animation of your movie: personally I prefer it almost always over 3d, but certainly the possibility of 3d is something that opens up a lot of ideas in type animation.<br>
      One great way to work with type is to make typography animation of dialogues of famous films: lately <a class="freelinking-external" href="http://www.youtube.com/watch?v=syf8olcM0z4">the great one from Pulp Fiction</a> has been making the rounds, a very good example of what I mean (though, personally, I think that adding the original sound somewhat makes things too easy: if it works without the speech, then it’s truly great).</p>
