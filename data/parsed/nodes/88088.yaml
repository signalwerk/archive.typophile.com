    <p>Hello,<br>
    I just found this site on Etsy.com, they are reproductions of vintage New York subway signs.<br>
    I think they're pretty well done, in terms of typography choice.</p>
    <p>Can anyone identify the possible typefaces used?</p>
    <p><a class="freelinking external" href="http://www.etsy.com/shop/FlyingJunction?ref=seller_info" rel="nofollow">http://www.etsy.com/shop/FlyingJunction?ref=seller_info</a></p>
    <p>Thanks!</p>
