    <p>Hello Everyone,<br>
    See attachment: it’s <a href="/wiki/Freight" class="wiki-create">Freight</a> Medium 9 pt tracked at 0. Great newsy font but generates labyrinth effect in Polish when set in 39 mm columns. Already tried a variety of H&amp;Js. This one seems optimal but not satisfying - the gaps.. 39 mm column is a must. Any ideas?</p>
    <p>BTW: Does anybody know any newspaper in compact format [apart from Independent on Sunday] which uses 6 column grid?<br>
    Thanx in advance.</p>
    <p>knap</p>
