    html: "<p>Spreads normally have their own pastboards in InDesign. But somehow you've changed the default vertical spacing. <br> <br>To get it back to the default, go to InDesign&gt;Preferences&gt;Guides &amp; Pasteboard... . At the bottom of the window, there is an option called \"Pasteboard Options: Minimum Vertical Offset\". Setting the value to 6p0 will give you the default setting.</p>"
    html_clean: "<p>Spreads normally have their own pastboards in InDesign. But somehow you've changed the default vertical spacing. <br> <br>To get it back to the default, go to InDesign&gt;Preferences&gt;Guides &amp; Pasteboard... . At the bottom of the window, there is an option called \"Pasteboard Options: Minimum Vertical Offset\". Setting the value to 6p0 will give you the default setting.</p>"
