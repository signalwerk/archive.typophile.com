    <p>Hi all, I hope you can help a student of mine. He is looking for a typeface reference which has, in his words, "a sense of humor, some sort of childish style and a little bit of comic taste; may be even like a carnival and Ottoman flavor, such as the curves of a tulip flower, a little bit of brush stroke weight and stress."<br>
    I attach the sample/example he gave to me (would be nice if you can ID this font as well).<br>
    Thanks very much.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/duraga_3841.gif"></div><p></p>
