    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : Rochester Institute of Technology</strong></p>
    <p>Founded in 1829, <a href="http://www.rit.edu/" rel="nofollow">Rochester Institute of Technology</a> is an internationally recognized leader in professional and career-oriented education enrolling more than 15,000 students in eight colleges. <a href="http://www.rit.edu/~660www/" rel="nofollow">The College of Imaging Arts and Sciences</a> contains the Schools of <a href="http://www.rit.edu/~651www/" rel="nofollow">Design</a> and <a href="http://www.rit.edu/~spms/" rel="nofollow">Print Media</a>. Many outstanding faculty have taught at the renowned RIT School of Print Media (formerly School of Printing) including <a href="/wiki/Alexander%20Lawson" class="freelinking" rel="nofollow">Alexander Lawson</a> and <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>.</p>
    <p>The RIT School of Printing used to award the prestegious Frederic W. Goudy Award from 1969 to 1988. Zapf, Mardersteig, Chappell, Wolpe, Catich, Carter, and Frutiger are among the designers, typographers, and historians honored with this award.</p>
    <p>RIT's Wallace Library is home to the <a href="/wiki/Melbert%20B.%20Cary%20Jr.%20Graphic%20Arts%20Collection" class="freelinking" rel="nofollow">Melbert B. Cary Jr. Graphic Arts Collection</a>, curated by <a href="/wiki/David%20Pankow" class="freelinking" rel="nofollow">David Pankow</a>.  The Cary Collection is one of the country's premier libraries on the history and practice of printing. In 1969, the Cary Collection was presented to RIT by the Mary Flagler Cary Charitable Trust as a memorial to Mr. Cary. Today the library houses some 20,000 volumes and a growing number of manuscripts and correspondence collections. Also included are impressive holdings on bookbinding, papermaking, type design, calligraphy and book illustration. The goal of developing the digital image database is to enable users all over the world to sample the wealth of rich materials housed in the collection.</p>
