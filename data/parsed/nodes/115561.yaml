      <p>Your best chance is may be asking directly <a class="freelinking external" href="http://dribbble.com/AdamTrageser" rel="nofollow">Adam Trageser</a> but I'm afraid the answer would be (part of 'MEDIUM') mostly hand-drawn or so much customized that to me it would be quite helpless to know the original font. I'd risk some though <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/sackers-gothic" rel="nofollow">Sackers Gothic</a> for '&amp; COMPANY' and the usual <a class="freelinking external" href="http://www.myfonts.com/fonts/coffee-bin-fonts/letterhead" rel="nofollow">Letterhead</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/letterheadfonts/lhf-billhead-1890" rel="nofollow">Billhead</a> for 'THE FINEST QUALITY'. But as said, would need a lot of customization to get only loosely close.<br>
      Now some food for the mind: <a class="freelinking external" href="http://joncontino.com" rel="nofollow">Jon Contino</a>, <a class="freelinking external" href="http://decadetypefoundry.bigcartel.com" rel="nofollow">Decade Type Foundry</a>, <a class="freelinking external" href="http://www.letterheadfonts.com" rel="nofollow">Letterhead Fonts</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Artist_of_Design" rel="nofollow">Artist of Design</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Magpie_Paper_Works" rel="nofollow">Magpie Paper Works</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Great_Lakes_Lettering" rel="nofollow">Great Lakes Lettering</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Fontscafe" rel="nofollow">Fontscafe</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Greater_Albion_Typefounders" rel="nofollow">Greater Albion Typefounders</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Kimmy_Design" rel="nofollow">Kimmy Design</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Coffee_Bin_Fonts" rel="nofollow">Coffee Bin Fonts</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Solotype" rel="nofollow">Solotype</a>, <a class="freelinking external" href="http://www.losttype.com" rel="nofollow">Lost Type Co-op</a>, tons of resources on <a class="freelinking external" href="http://creativemarket.com/search?q=vintage" rel="nofollow">Creative Market</a></p>
