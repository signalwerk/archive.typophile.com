      <p>Funny because the only one that reminds me of nothing is 'RARE' :D. Looks too much deconstructed/eroded/manipulated/distorted to be something else than hand-drawn (and rather close actually to Jon Contino's lettering style) and mixing style of <a class="freelinking external" href="http://www.myfonts.com/search/windsor" rel="nofollow">Windsor</a> and 'Grant' <a class="freelinking external" href="http://www.myfonts.com/fonts/letterheadfonts/lhf-grants-antique" rel="nofollow">Grants Antique</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/spiecegraphics/sheridan-gothic-sg" rel="nofollow">Sheridan Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/refugio-wbw" rel="nofollow">Refugio</a>/<a class="freelinking external" href="http://opti.netii.net/fonts-g/index.htm" rel="nofollow">Grant Rustic</a>.<br>
      Actually, <a class="freelinking external" href="http://www.myfonts.com/fonts/spiecegraphics/sheridan-gothic-sg" rel="nofollow">Sheridan Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/refugio-wbw/refugio-rustic-wbw" rel="nofollow">Refugio Rustic</a>/<a class="freelinking external" href="http://opti.netii.net/fonts-g/index.htm" rel="nofollow">Grant Rustic</a> might be good substitutes for 'THE FINEST QUALITY'.</p>
