      <p>RARE. As it appears that this is a well hidden font, or not a font at all, the question is whether you would like to have an alphabet with similar style. Some of the letters, such as the flat top A could be derived from the list posted by Ryuk. The swoop for the upper bowl of R, and similar letters such as B, C and P could be modeled on Sveva <a href="http://www.myfonts.com/fonts/astype/sveva-as-versal/" title="http://www.myfonts.com/fonts/astype/sveva-as-versal/">http://www.myfonts.com/fonts/astype/sveva-as-versal/</a>.  Big bowls on Windsor, Milton etc.<br>
      Don</p>
