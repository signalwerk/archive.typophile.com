      <p>From what I can gather, Bon Appetit commissions calligraphic headlines for some of its spreads. If you can find the actual magazine, you may find a credit for the artist.</p>
      <p>S0me fonts that approximate the look:<br>
      Candombe and Pronto by Sudtipos, <a href="http://sudtipos.com" title="http://sudtipos.com">http://sudtipos.com</a></p>
