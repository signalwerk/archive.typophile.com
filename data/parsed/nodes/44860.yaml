    <p>I have a logo project and I can't seem to find a font to fit my concept.</p>
    <p>I'm looking for a font with the properties:<br>
    - very legible<br>
    - heavy width<br>
    - square/rectangular shaped letters<br>
    - both square and rounded corners<br>
    - available in oblique/italic</p>
    <p>A few fonts that come close are:<br>
    - <a class="freelinking external" href="http://www.t26.com/fonts/Megahertz" rel="nofollow">http://www.t26.com/fonts/Megahertz</a> (too wide)<br>
    - <a class="freelinking external" href="http://www.t26.com/fonts/YR72" rel="nofollow">http://www.t26.com/fonts/YR72</a> (not legible enough)<br>
    - <a class="freelinking external" href="http://www.t26.com/fonts/Reaction" rel="nofollow">http://www.t26.com/fonts/Reaction</a> (very close!)</p>
    <p>The character I'm looking for is modern, sports channel, skateboarding, etc.</p>
    <p>If anyone has any thoughts or tips I'd very much appreciate your suggestions!</p>
