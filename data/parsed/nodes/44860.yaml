      <p>Ooh. Purista Bold Italic is close (I'll have to overlook your snarkiness for that suggestion!).</p>
      <p>My only concern with Purista is that the lower case "a" is single-storey (see, I'll get the terminology correct eventually). I know it may seem like I'm obsessing, but the logo will be applied to roadside signage. Since the name includes the letters "oa" I need a lot of contrast between those shapes.</p>
      <p>I figure if there is any community wherein an obsession over finding the right typeface will be tolerated, it must be this one!</p>
