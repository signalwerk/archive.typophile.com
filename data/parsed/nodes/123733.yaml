    html: |-
      <p>It's a large, brass cast sign (3-feet by 9-feet?). The letters are raised, with the background dark. I converted the image to grayscale, upped the contrast, then inverted it to make the letters easier to read. I'm thinking it's not a standard print typeface, but something the sign makers had in their repertoire.</p>
      <p>Revival 565 looks pretty darn close (though not quite). But I can still call that one a winner with a bit of modification!</p>
      <p>Thanks!</p>
