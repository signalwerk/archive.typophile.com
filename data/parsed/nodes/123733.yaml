    <p></p><div class="imageWrap"><img src="http://typophile.com/files/high-grove-sign_6407.jpg"></div><p></p>
    <p>I'm trying to find a typeface that closely matches the image above. It is a recent photograph of a sign that was created close to 30 years ago. The "R" is rather unique, but I can't seem to find a typeface that matches. Caslon and Jenson are close, but not quite right.</p>
    <p>Any help would be greatly appreciated.</p>
    <p>Thanks,<br>
    Bill</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
