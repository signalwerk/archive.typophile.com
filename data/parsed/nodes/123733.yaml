      <p>That |R| is indeed strange...<br>
      <strong>Revival 565</strong> from Bitstream is somewhat close, though not an exact match:<br>
      <a href="https://www.myfonts.com/fonts/bitstream/revival-565/" title="https://www.myfonts.com/fonts/bitstream/revival-565/">https://www.myfonts.com/fonts/bitstream/revival-565/</a></p>
      <p><strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=CanadaType%20%2F%20%28Commercial%29&amp;ffam=Dutch%20Mediaeval%20Pro%20-%20Regular&amp;fid=dd8b9f864bee11475c60fb18722d9f9a&amp;fsize=60&amp;text=HIGHGROVE&amp;wrap=2" rel="nofollow">Dutch Mediaeval</a></strong> by Hans van Maanen [CanadaType, 2007] is a better match for |R| but the rest letters are off...</p>
