      <p>I’m not finding a match. If the sign was hand-painted, you may be dealing with a variation of Engravers:</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/engravers-oldstyle-205/" title="http://www.myfonts.com/fonts/bitstream/engravers-oldstyle-205/">http://www.myfonts.com/fonts/bitstream/engravers-oldstyle-205/</a><br>
      <a href="http://www.myfonts.com/fonts/ortizlopez/ol-engravers-classic/" title="http://www.myfonts.com/fonts/ortizlopez/ol-engravers-classic/">http://www.myfonts.com/fonts/ortizlopez/ol-engravers-classic/</a></p>
      <p>Another typeface that comes close, though not for the |R|:<br>
      <a href="http://www.myfonts.com/fonts/berthold/concorde-bq/" title="http://www.myfonts.com/fonts/berthold/concorde-bq/">http://www.myfonts.com/fonts/berthold/concorde-bq/</a></p>
      <p>I found similar |R|s in these typefaces:<br>
      <a href="http://www.myfonts.com/fonts/canadatype/dutch-mediaeval/" title="http://www.myfonts.com/fonts/canadatype/dutch-mediaeval/">http://www.myfonts.com/fonts/canadatype/dutch-mediaeval/</a><br>
      <a href="http://www.myfonts.com/fonts/canadatype/zilvertype-pro/" title="http://www.myfonts.com/fonts/canadatype/zilvertype-pro/">http://www.myfonts.com/fonts/canadatype/zilvertype-pro/</a><br>
      <a href="http://www.myfonts.com/fonts/redrooster/erasmus-rr/" title="http://www.myfonts.com/fonts/redrooster/erasmus-rr/">http://www.myfonts.com/fonts/redrooster/erasmus-rr/</a></p>
