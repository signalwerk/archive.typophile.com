    html: <p>David, <br> <br>The (r) and the (m) seem too large/wide in comparison with the other characters. I'm sure it is a spacing issue. The open areas of those letters are larger than what you've left for the (s). The (o) seems to work in comparison to the (r) and the (m), but still the (f) and the (s) ... As Tom demonstrated, the (f) and (o) should perhaps not touch. and then add space in between the (sos). The arm of the (r) seems too large. The (f) seems too low, it is crowding the (o), and now that I notice this, maybe the (s) is crowding the (m)? <br> <br>Two more thoughts. (1) What if the serifs were more slab like? (2) What if you add more contrast? <br> <br>I think I do prefer the sans, but I can see potential in the serif.</p>
    html_clean: <p>David, <br> <br>The (r) and the (m) seem too large/wide in comparison with the other characters. I'm sure it is a spacing issue. The open areas of those letters are larger than what you've left for the (s). The (o) seems to work in comparison to the (r) and the (m), but still the (f) and the (s) ... As Tom demonstrated, the (f) and (o) should perhaps not touch. and then add space in between the (sos). The arm of the (r) seems too large. The (f) seems too low, it is crowding the (o), and now that I notice this, maybe the (s) is crowding the (m)? <br> <br>Two more thoughts. (1) What if the serifs were more slab like? (2) What if you add more contrast? <br> <br>I think I do prefer the sans, but I can see potential in the serif.</p>
  - id: 1719
