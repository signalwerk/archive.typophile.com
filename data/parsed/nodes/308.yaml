    date: 2003-06-20T05:40:00
    date_raw: 20 Jun 2003 — 5:40am
    votes: null
    html: "<p><b>hi all,</b> <br> <br>i'm happy to have found this really fine discussion board! i hopy my english is good enough to express myself on a typo forum - i don't know most of the numerous technical terms, i'm afraid. <br> <br>on the topic i'd like to say: <br> <br><b>1.</b> like Tom Cannon (et. al.), i find the serif version too light for a logo and a bit to \"sweet\" (but, like Tiffany, i think there may be room for improvements). <br> <br><b>1.1.</b> while the spacing in the first serif version seems a bit to loose around the \"rm\"... <br> <br><b>1.2.</b> ...the second serif version looks a bit to narrow around the \"ml\" to me. <br> <br><b>2.</b> like HD Schellnack, i find the sans serif version a bit too playful. the sort of diagonally crossed out \"o\", the angled lower ends of the stems of the \"r\" and \"m\" and the peaks at the upper left side of the \"r\" and \"m\" (i don't know a better word) are too much and, in parts, not at all necessary, IMO. that's why i played around with tho logo for some minutes and came up with this \"cleaned up\" version, which i think i like better: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/11947.gif\" alt=\"\"> <br> <br><b>what i've done:</b> <br> <br><b>a.</b> i cut off the stems of the \"r\" and \"m\" both on their lower and upper end <br><b>b.</b> i took over Tom Cannon's \"f\" (which is easily recognized as an \"f\", IMO, but has more room too breathe) <br><b>c.</b> i changed the spacing a bit (narrower around the \"orml\") <br> <br><b>additional thoughts:</b> <br> <br><b>d.</b> the letters should be heavier (i haven't changed that) <br><b>f.</b> if you decide to keep the crossed out \"o\" for reasons of originality, i'd rather cross it vertically instead of diagonally (i tried that). either way, the \"o\" would become too light, i guess. <br> <br>regards <br>peter</p>"
    html_clean: "<p><b>hi all,</b> <br> <br>i'm happy to have found this really fine discussion board! i hopy my english is good enough to express myself on a typo forum - i don't know most of the numerous technical terms, i'm afraid. <br> <br>on the topic i'd like to say: <br> <br><b>1.</b> like Tom Cannon (et. al.), i find the serif version too light for a logo and a bit to \"sweet\" (but, like Tiffany, i think there may be room for improvements). <br> <br><b>1.1.</b> while the spacing in the first serif version seems a bit to loose around the \"rm\"... <br> <br><b>1.2.</b> ...the second serif version looks a bit to narrow around the \"ml\" to me. <br> <br><b>2.</b> like HD Schellnack, i find the sans serif version a bit too playful. the sort of diagonally crossed out \"o\", the angled lower ends of the stems of the \"r\" and \"m\" and the peaks at the upper left side of the \"r\" and \"m\" (i don't know a better word) are too much and, in parts, not at all necessary, IMO. that's why i played around with tho logo for some minutes and came up with this \"cleaned up\" version, which i think i like better: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/11947.gif\" alt=\"\"> <br> <br><b>what i've done:</b> <br> <br><b>a.</b> i cut off the stems of the \"r\" and \"m\" both on their lower and upper end <br><b>b.</b> i took over Tom Cannon's \"f\" (which is easily recognized as an \"f\", IMO, but has more room too breathe) <br><b>c.</b> i changed the spacing a bit (narrower around the \"orml\") <br> <br><b>additional thoughts:</b> <br> <br><b>d.</b> the letters should be heavier (i haven't changed that) <br><b>f.</b> if you decide to keep the crossed out \"o\" for reasons of originality, i'd rather cross it vertically instead of diagonally (i tried that). either way, the \"o\" would become too light, i guess. <br> <br>regards <br>peter</p>"
