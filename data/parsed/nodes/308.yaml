    html: <p>I agree with Tom that I would prefer to see <br>all the types "untouched" or if touched,  <br>at least one more combination. <br>But as it concerns serif or sans serif <br>I would recommend to give more boldness <br>to the serif version before you judge which. <br>I think that you will have a very intersting <br>result if you make the contrast a lot more, <br>plus I would see it in a more condensed version <br>and more tight spacing. <br> <br>As for the "f" Tom suggets, I think is legible. <br> <br>christos <br> <br>PS. Happy Birthday David!</p>
