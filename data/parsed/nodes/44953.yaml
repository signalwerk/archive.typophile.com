      <p>Not to be a party-pooper, but just the old typesetter in me - since this is a quote by M.J. Florczak</p>
      <p>1. Should there not be periods after the M and the J as they might stand for a first and middle name - or was he/she like Grant whose middle name was S - no punctuation needed?<br>
      2. Since this is a quote - should we have quote marks around it?<br>
      3. Since MJ is the source - it should be a 1/m dash - with no space between the 1/m and the MJ</p>
      <p>and while I'm on it - since the second line has all that white space, it should be alright to move the source of the quote up one line. If this is large for display, and you want to fill three lines, I'd like to recommend then centering the source. Just a design thing.</p>
      <p>Otherwise, it's done! And fine! And probably hanging up somewhere already. My comments are just comments...</p>
    html_clean: |-
