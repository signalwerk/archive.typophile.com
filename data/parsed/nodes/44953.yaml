    <p>I haven't done much environmental design, so I'm not sure about this one:</p>
    <p>I have to pick a typeface for vinyl lettering to go in a street-facing window. The art area is huge — about 6 feet by very tall — but the sentence has to be readable on the sidewalk and I don't know, across the street?</p>
    <p>The sentences, about one each per window, are memories about the history of an area in the city, winning contest submissions. They'll also be part of an inside exhibit, and later a book. So history, first person voices, collective memory, lyric-poetry type stuff.</p>
    <p>I like the feel of Filosofia and Mrs Eaves italics for this, even ITC Century roman — but the first 2 are definitely not strong enough for across the street viewing. I need something strong and quirky. With multiple weights?</p>
    <p>Suggestions?</p>
