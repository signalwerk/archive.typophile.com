      <p>As someone who plots and weeds vinyl lettering, please go for a nice sans like Gotham or Trade Gothic. A serif like Freight Micro in a bold weight would work if you are doing something in the 200-300 point range.</p>
      <p>Just please avoid a Didot-like face. Those ultra delicate serifs are a bitch, even at large sizes. If someone asks me to weed the "Burberry" logo at 1 inch tall again, I'm gonna scream.</p>
      <p>David</p>
