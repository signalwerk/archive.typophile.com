      <p>Something slightly condensed with a large x-height is going to work in your favor. Consider the average height of a viewer/cars and other obstructions and placement/visibility above this level, contrast of the color in relation to the coatings/color of the glass and how the color of the glass can change based on viewing position. Sometimes a pearlized reflective vinyl can shift from neg. to reverse as the sun sets and the environment changes.</p>
      <p>Folowing Dave's direction, you could look at Lucida Fax. I've used Apex new in a similar situation, but I was following the lead of an existing book design.</p>
