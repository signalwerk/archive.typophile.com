    votes: null
    html: "<p>From the book <a href=\"http://www.marionboyars.co.uk/Specific%20title%20pages/hitch.html\" target=\"_top\">Alfred Hitchcock and the Making of Psycho</a>, by Stephen Rebello. <br> <br><i>Postproduction <br>Adler, who previously had worked with Bass on the title sequences of Vertigo and North by Northwest before tackling Psycho, explained how it was done: .... I did the title, Psycho, in <a href=\"http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=SG.102143.0.4&amp;charSize=14&amp;sampleText=PSYCHO&amp;sampleSize=48\" target=\"_top\">Venus Bold Extended</a> and got two reverse photostats made....  For the other big titles, like 'Directed by Alfred Hitchcock', I used News Gothic Bold typeface and we did the same three-cut technique as for the title of the movie.</i> <br> <br>The thing is that the S and the C of PSYCHO don't match with the Venus Bold Extended, they are closer in the shapes to the Extrabold weight though. <br>Did they modify the S and C they had? <br>Different cut of Venus from another foundry? <br>A little lack of memory by Adler? <br>Is it the Psycho Week?</p>"
    html_clean: "<p>From the book <a href=\"http://www.marionboyars.co.uk/Specific%20title%20pages/hitch.html\" target=\"_top\" class=\"link-external\">Alfred Hitchcock and the Making of Psycho</a>, by Stephen Rebello. <br> <br><i>Postproduction <br>Adler, who previously had worked with Bass on the title sequences of Vertigo and North by Northwest before tackling Psycho, explained how it was done: .... I did the title, Psycho, in <a href=\"http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=SG.102143.0.4&amp;charSize=14&amp;sampleText=PSYCHO&amp;sampleSize=48\" target=\"_top\" class=\"link-external\">Venus Bold Extended</a> and got two reverse photostats made....  For the other big titles, like 'Directed by Alfred Hitchcock', I used News Gothic Bold typeface and we did the same three-cut technique as for the title of the movie.</i> <br> <br>The thing is that the S and the C of PSYCHO don't match with the Venus Bold Extended, they are closer in the shapes to the Extrabold weight though. <br>Did they modify the S and C they had? <br>Different cut of Venus from another foundry? <br>A little lack of memory by Adler? <br>Is it the Psycho Week?</p>"
