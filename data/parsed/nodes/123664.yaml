      <p>The full name may be an artificially squashed and widened Akzidenz Grotesk Extra Bold:<br>
      <a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/" title="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/">http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/</a></p>
      <p>I suspect that |NDNA| is the same, with modifications (rounding corners, inline detail, alter the |A|).</p>
      <p>Helvetica Black Condensed with similar manipulation also gets you close:<br>
      <a href="http://www.myfonts.com/fonts/linotype/helvetica/" title="http://www.myfonts.com/fonts/linotype/helvetica/">http://www.myfonts.com/fonts/linotype/helvetica/</a></p>
