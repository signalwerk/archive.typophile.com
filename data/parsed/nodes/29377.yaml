  html: <p>i am currently designing my CV to send off to employers for a work placement (graphic design) but i want it to be creative and spark some humour into it because thats who i am but im having difficulties with ideas. I was going to do one online but aswell as that, i want to do one taht i can send off to them and add a little extra item thast creative and that they can have in their office. what could that item/object be? i was once sent a cd like cover that popped up and became a little box to put your cds in and was jsut kept intackt with 2 elastic bands inside that allowed it to become an actual cube. i'd like something creative and unusual. any ideas welcome.</p>
