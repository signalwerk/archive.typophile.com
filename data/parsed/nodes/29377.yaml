      <p>Lore, obliquely, brings up a good strategy, try to find out what you can about potential employers (this is useful when you have the classic interview question, "why did you approach this agency?"), if the Creative Director has a birthday soon, for example, you could create a cv around a birthday card or maybe base something around a recent project of theirs.<br>
      Do not stalk them or go through their bins though.</p>
      <p>Tim</p>
