      <p>I would be very careful with the idea of trying to "add a little extra item thast creative and that they can have in their office." You would have to do something very, very clever to be able to pull this off. Otherwise it will be another really lame attempt. I got an 'interview' once for a senior position (I was a junior) only because I had used Quadraat on my well-typeset CV. I didn't get the job, but I got to spend 1 1/2 hours with a senior designer, talking about all sorts of things. Now that design firm is a client of mine for type-specific work. Funny how these things work out.</p>
      <p>—K</p>
