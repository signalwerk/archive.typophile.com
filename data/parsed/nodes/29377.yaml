    html: |-
      <p>Here in Washington it's customary to have a plain resume and customize the design/text appropriate to the employer. A really wild design that might get you a job at a three-person design firm could end up right in the trash if it goes to the HR department of a big-firm looking for in-house people. Having something simple can also make it easier for you to use it for digital submission.</p>
      <p>Consider producing a really good-looking promotional piece that showcases your work and include a well-typeset traditional resume along with it. This way you get to show off your creative ability without having to worry about offending people who don't like creative resumes.</p>
