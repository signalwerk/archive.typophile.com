    html: <p>Fredrik, I never use Lorem ipsum, it has too many characters that aren't used in common english language. What I use for my comps is a part of a chapter of Alice in Wonderland. Mad tea party. I would advise you to investigate snippets from stories that might be in the public domain.</p>
