    html: <p>I usually try to grab interesting passages of text from the <a href="http://gutenberg.net/catalog/">Project Gutenburg</a> archive, possible even something thematically relevant to the project I'm working on. It's absolutely one of the best places to find public domain texts.</p>
    html_clean: <p>I usually try to grab interesting passages of text from the <a href="http://gutenberg.net/catalog/" class="link-external">Project Gutenburg</a> archive, possible even something thematically relevant to the project I'm working on. It's absolutely one of the best places to find public domain texts.</p>
  - id: 44414
