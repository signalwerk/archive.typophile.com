  html: <p>Dear Typophiles; <br> <br>I'm producing a small booklet with text samples and it'll be printed in Swedish and English.  <br>I have, however, no clue what kind of text to use in the english version. I don't want to use <i>Lorem Ipsum</i>, and <i>the quick brown fox...</i> is a bit too short. <br>What would you choose, which are the standard sample texts in english? <br> <br>Regards, <br> <br> <br>�</p>
