    date: null
    date_raw: null
    votes: null
    html: <p>I've heard it said that Lorem ipsum is used because it tends to make text look good. The theory being that the letterforms evolved for letter frequencies characteristic of Latin. If so, it might have value for presentation.  <br> <br>Since your purpose is publication, however, I think you should look for a passage that suits your fancy in some classic public domain text, a chidren's book or a classic of travel writing, for example. Take it as an opportunity to put some of your own personality into the project.</p>
