  html: |-
    <p>Ok so I've got to put together this newsletter and I just get thrown all this text that I've got to fit on a 4 or 8 page newsletter, like its going to be folded so that it'll have a spine. Anyway I always end up with gaping holes where I've ran out of text or have to change the type size to fit all the text in a certain area. The person wants to have the images under certain paragraphs so some images end up with completely different proportions than others so as they fit.</p>
    <p>So I'm not sure if I should just make a template first and the writer can make the content to fit in my space? I'm not a graphic designer but I need to put together a eloquent newsletter quickly.</p>
    <p>Any help would be appreciated.</p>
