    html: |-
      <p>Tell your editor how many words they need to add or cut from each article. It may take a few rounds of changes to get it right.</p>
      <p>Don't change the text size from article to article, but sometimes you can get away with making a slight change to the leading (like maybe 1/2 point) between lines to make an article a little shorter or longer. Not ideal technique, but it works. And if your columns are rag right (rather than justified) you can change a column's width very slightly to adjust the depth a little. But it's better just to let the editor edit the article's length.</p>
      <p>"Filler" articles (quotes, jokes, or whatever) can be used to fill gaps. And callouts can be used to fill space and add visual interest. </p>
      <p>This article has some tips on newsletter design:<br>
      <a href="http://www.creativepro.com/files/story_images/20050316newsletter.pdf" title="http://www.creativepro.com/files/story_images/20050316newsletter.pdf">http://www.creativepro.com/files/story_images/20050316newsletter.pdf</a></p>
