    html: |-
      <p>1. When you say 'PostScript Cyrillic' fonts do you mean Type 1 or CFF PostScript? I recommend making the latter and supporting both the CP1251 and also the Western European CP1252. Actually, I recommend supporting CP1252 in any font you make.</p>
      <p>Word has what I certainly consider a bug which means that even if a font supports a codepage that supports the ASCII Latin subset, such as the Windows Cyrillic or Hebrew codepages, Word will switch to a default font when you try to enter Latin characters from such a font, because it is looking for CP1252 support. You may be able to input Cyrillic characters correctly with your font. Have you tried that? If it is like the issue I hit with Hebrew codepage fonts, the font switching should only happen if you try to input the Latin subset characters.</p>
      <p>2. Hmm. This ring a bell, but I can't remember what the issue is. I suspect Adam Twardoch could tell you.</p>
