    <p>Okay, so i have 2 Word issues:</p>
    <p>1) I'm generating Windows PostScript Cyrillic fonts. I'm using FLS5, running Win XP SP2. I set the mode in FLS5 to codepages and selected MS Windows 1251 Cyrillic. In the Encoding options, I have chosen "1251 Cyrillic" under supported codepages and "Cyrillic CP 1251" under Microsoft Character Set (and "Cyrillic" for the Mac script). With these settings, The fonts work just fine in Adobe InDesign CS3, but i cannot figure out how the fonts are behaving in MS Word 2007. In Word the fonts generally default to Times New Roman.</p>
    <p>2) For OpenType and PostScript (latin) fonts, the bold style-linking is not working correctly in Word 2007. I have linking set up so that Heavy is the bold version of Medium. Does it matter that the bold style weight is not actually bold? Style linking works correctly in TrueType fonts generated using the same files and settings as the OpenType fonts and style linking works for all fonts (PS, OT, TT) in InDesign CS3.</p>
    <p>The fact that these fonts work as expected lead me to believe that these are Word bugs, but i'll be glad to be proven wrong. If any of you can help me resolve these problems, I'd greatly appreciate your help. Thanks for looking!</p>
