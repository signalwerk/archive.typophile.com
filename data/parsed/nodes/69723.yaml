      <p>Hi,<br>
      I’m designing an OTF font and I feel Indesign does not read properly the <em>pos</em> feature if inside <em>c2sc</em> (All Small Capitals)</p>
      <p>A part of my code (first 2 lines do not work; others do):<br>
      <code><br>
      pos @CaseShift &lt;0 20 0 0&gt;;<br>
      pos @UpperPunctuation &lt;0 -200 0 0&gt;;<br>
      sub @Liningnumbers by @S2scFigures;<br>
      sub zero.tf by zero.c2sc.tf;<br>
      sub one.tf by one.c2sc.tf;<br>
      […]<br>
      </code></p>
      <p>I’ve checked my font with FeatureProof, an application made to check Opentype features , and my code works perfectly.<br>
      Anyone met this issue?<br>
      Any workaround that avoids duplicating an manually shifting glyphs?<br>
      Thank everyone in advance :)</p>
