    html: |-
      <p>Well, if you check the description for {c2sc} in the OpenType Layout tag Registry (<a href="http://www.microsoft.com/typography/otspec/features_ae.htm#c2sc" title="http://www.microsoft.com/typography/otspec/features_ae.htm#c2sc">http://www.microsoft.com/typography/otspec/features_ae.htm#c2sc</a>) you’ll see that the Recommended Implementation is for GSUB lookup type 1. </p>
      <p>So, I suppose no one should be surprised if an application’s implementation of this feature chooses to ignore any GPOS instructions.</p>
