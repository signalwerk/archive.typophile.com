      <p>Bill — Do a couple things for me, please. Go into your Preferences and under the Advanced Type change the Small Caps percentage. That should affect your fake small caps; does it?</p>
      <p>Second, highlight one of those fake small caps (just a figure, because it looks like parens aren’t being affected) and take a look at what’s being applied.</p>
      <p>I'm guessing that the OT menu will show that All Small Caps is applied. Does it indicate that the relevant Character style is applied and is there an override (+) next to the name? Does it happen to indicate that the Small Caps styling is also perhaps applied on top of the OT All Small Caps? That would be a bug and might yield what we’re seeing.</p>
      <p>Will you see if you can reproduce this behavior with letters as well as numbers?</p>
      <p>Also, can you ascertain whether it is your SC figs or default lining figs that are being reduced by the faux percentage? (By setting the numbers and manually changing the size by the percentage to see which matches.)</p>
      <p>Not sure what all these tests will tell us, but I’m just trying to gather more info since I can’t test this myself.</p>
