    <p>I am in  the process of adding Greek and Cyrillic glyphs to my Weimar Plakat 1923 typeface and was talking to Dan Reynolds about it. He asked me if there was a constructivist heyday in Greece at the same time as the Russian Avant Garde and German Bauhaus.  I told him I didn’t think so because it was a troubled time in Greece then.  Since I said that, I began to wonder if anyone knew more about it? Perhaps Gerry Leonedis, John Hudson or any other student of visual history might be more knowledgeable and share their insight?</p>
    <p>ChrisL</p>
