      <p>Of course one can’t really cram all things “constructivist” under one roof. What I’d really be interested to know is if there was any sort of dialogue between Greece and the West, or between Greece and Soviet Russia at this time.</p>
      <p>Malevich, Van Doesberg, El Lizitsky, Jan (here Iwan) Tschichold, Paul Klee, Kurt Schwitters, Mondrian, et al. … these people didn’t all have much in common with everyone else necessarially, but in hindsight it is easy to put them all in the same “box,” even if that oversimplifies things. Did they have any “copiers” in Greece? Artists trying to follow along the same lines?</p>
      <p>Were there Greek Communists/Bolsheviks? What did their graphics look like?  Soviet Russia laid heavy on the propaganda during the 1920s and 30s. Did any of this make it to Greece?</p>
