    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 6.Sep.2007 7.48am </div>
      <p>- - - - - </p>
    <p>The programme for the first day of the conference on non-Latin typefaces is now online at:<br>
    <a href="http://stbride.org/events_education/events/non-latintypefacedesign/programme.html" title="http://stbride.org/events_education/events/non-latintypefacedesign/programme.html">http://stbride.org/events_education/events/non-latintypefacedesign/progr...</a></p>
    <p>The speakers are world-class experts in their respective fields and, significantly, do not often come under one roof in this combination. We are limited by the capacity of the familiar lecture hall at St Bride, but there are still places available. </p>
    <p>This day at St Bride makes an excellent post-ATypI event for those of you still in or around London; email info [at] stbridefoundation [dot] org or call +44 (0) 20 7353 3331 to register.</p>
