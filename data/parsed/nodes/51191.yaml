      <p>My point was essentially that I can better understand why piracy is involved in the typeface industry than in other industries, particularly the music industry. While listening music is a luxury, typefaces are practical, so there's actual need for it, even though the customer base is smaller than in the music industry.</p>
      <p>As for TEFF, I must have been blind. Everything about TEFF breathes "publishing houses" as their target audience, yet I never really realized it. Thank you for the clarification on that. As for Trinité's automatic ligatures, I had no idea about that either. I've used Trinité only once before, and that was for a sort of heading, which didn't require ligatures. However I noticed the absence of ligatures. Automatic ligatures is very clever. I didn't know about that principle, though as logical as it may be.</p>
