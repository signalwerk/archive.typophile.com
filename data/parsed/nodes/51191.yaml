    html: |-
      <p>Well, looking at this from the other perspective, although it's not impossible, it's unlikely our friend Ulrich is using any sort of professional typesetting software for his essay anyway, so the majority of the advanced features in a pro font could never be used anyway.</p>
      <p>If he's using a simple word processor like Word of OpenOffice he won't even have abilities like kerning or any sort of meaningful control over the type.</p>
      <p>Ulrich22, yes, I agree with you that Neutraface looks nice, but for high school the teachers often require Times New Roman.</p>
      <p>Before using any custom typeface at all, check with you teacher to see what they expect.  For my english classes I had Font, Size, Spacing, Margins all required to be specific values.  We didn't get marks off if it was wrong, in my school if it was wrong it didn't get marked. The end.</p>
      <p>I'm gonna make a suggestion, don't tear me apart on this one.  For me, when I look at Neutraface, it reminds me of the same feeling as Futura and Century Gothic. (especially the Capitals)  Check to see if you have Futura or Century Gothic already, you often have one of the two pre-installed.</p>
      <p>Best of luck,<br>
      innovati!</p>
