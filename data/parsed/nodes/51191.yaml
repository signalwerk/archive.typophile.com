    html: <p>Absolutely true of course. However I do wonder if it's still in balance. A typeface like Trinité costs $4,846. There's something about it that I adore, but there are many things wrong with it as well. In use, the typeface looks unbalanced (which does give it a certain authentic letterpress quality though). There are some kerning problems, and it has no ligatures. I think that's a big issue, especially considering the high price. For such a price you would expect the typeface to be entirely complete. So pass the cost of the typeface on to your clients all you want; I still think the price is not always in balance in regard to the quality of the typeface. The concept of "as long as there are still people buying it, there's nothing wrong with the price" is very much present in the typeface industry, which is not necessarily a bad thing, but it does explain why there's so much illegal obtaining of typefaces. The "absurdly" high prices of some typefaces merely serve as a marketing tool to create a sense of elitism.</p>
