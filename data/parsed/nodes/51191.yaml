      <p>I'm going to try be very careful how I approach this thread as the topic is so heated. I really don't want an onslaught of hate towards myself.</p>
      <p>I would say the majority of typophilers have used a pirated version of a typeface at one point or another. <em>With the exception of a hardcore few of course.</em> As a recent design graduate I can understand Ulrich's need and want for a typeface. I find very little harm in a student using a typeface for personal college projects, once they understand and appreciate the value of the typeface. </p>
      <p>I would then encourage the student to pass on the enthusiasm &amp; knowlegde for typography to his clients in the future. This is the point when a typeface should never be illegally used – <em>when there will be profit made from it's use.</em></p>
      <p>If type designers would like to encourage people to buy their fonts they should market accordingly. Lets face it, we're in a world of free music, free videos and free software. Just look at Museo for a prime example of how to promote a typeface in this modern era of piracy. Remember it's just like fishing.</p>
      <p>I hope this doesn't offend anyone, I just think it's smart to pick your battles. </p>
      <p>Robbie.</p>
