      <p>Although I find Ulrich absolutely annoying, I do think some of you are taking everything a bit too seriously. Of course copyrights are serious business, but I do wonder why piracy seems to affect you emotionally. Not that it's bad to have morals though... In a moment I will shed some light upon an other, deadly serious aspect of copyrights. I would also like to say in advance that you are likely to disagree with the things I'm going to say, or prove me wrong. And feel free to do so. I don't pretend to know everything, but I'm skeptical about the things I read in this topic, and which I've read many times before as well. So I have my own theories, and you might find it interesting to see it from my perspective.</p>
      <p>I must admit I've never bought a typeface once in my life, for the simple fact that I have no or little money to spend (I'm a student without time for a job). However I do plan on buying all the typefaces I like slowly but surely, probably starting with Futura. As a student I think it's slightly justifiable to obtain typefaces illegally for the simple fact that although I do commercial work already, it doesn't provide me with a constant income yet. So I can perfectly understand Ulrich in that sense. However I am offended by the way he approached this community about this typeface, especially considering Neutraface isn't that expensive. He is a total moron, comes off as unintelligent, and on top of that seems to enjoy the attention, whether positive or negative.</p>
      <p>I've read this whole thread and it has been both interesting and amusing (especially the comment "What color do you need it in?"), but you've all shed light on only one aspect of the copyrights, which is unlikely to affect Ulrich morally and intellectually. Certainly it's bad to go against the law, and certainly the designers should get payed for their work, although you're not going to convince me that those designers are poor. I get particularly annoyed when someone gives that argument about something of a larger scale, like Adobe or Microsoft products. They have a constant income of millions of dollars, so relatively speaking piracy doesn't seem so bad in that context. But I'm dwelling off. The other aspect of copyrights is that it protects you as a customer as well, and that's the aspect that Ulrich doesn't seem to realize yet. It's easy to say piracy is a bad thing, but you rarely hear about the consequences. As a full-fledged designer doing commercial work, you will protect yourself by purchasing typefaces. If one of the organizations find out you make use of illegal software or illegal typefaces (in my country there is an organization called BREIN whom actually does check commercial designers), you will risk getting a mighty fine as large as the price of a house. You will be paying that debt off for the duration of your career. If Ulrich wants to take that risk, by all means let him be. It doesn't affect you.</p>
      <p>May I remind you that the creators of these products are not losing money due to piracy. Most of them are full-fledged designers with a constant income, and the selling of typefaces serves as extra income. If it would be their only income, their products would be a lot cheaper. It's true that a designer will invest a lot of time into the creation of a typeface, but let's compare it with the music industry. A band also invests a lot of time into creating their music, but their CD's aren't for sale for $50 or more, but for $20 or less. Also, the price of their CD doesn't depend on the quality or success of their music. A band like Muse can't ask $100 for a CD just because they're considered brilliant by many. The typefaces industry differs quite dramatically in that aspect, as the goal isn't to sell as many licenses as possible. The Enschedé Font Foundry for example comes off as elite, with font families between 2000 and 3000 euro. I absolutely love their typefaces, but I highly doubt there is a change in quality compared to Neutraface for example, so why is it 5 times more expensive (especially considering the fact that Neutraface consists of 71 fonts)?</p>
      <p>Also keep in mind that although piracy is illegal (and should be), there's a big difference between stealing and copying. I'm tired of the comparison with stealing cars. If I could obtain a car by illegally copying it from an other car, and the initial car remains unaffected and still belongs to the original owner, I would be MUCH more likely to take the risk and go against the law. It might be unethical, but don't take it too seriously. And may I also remind you that in many cases, the copyright of a typeface doesn't belong to the initial designer, so it's not even certain they will see some or any of the money regenerated from selling licenses. It's the same with a band and a label. The band makes the music and the label gets most of the profit.</p>
