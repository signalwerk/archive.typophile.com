      <p>Hi Martin,</p>
      <p>I don’t see your point.<br>
      In addition to what <a href="http://www.typophile.com/node/28266#comment-158429" rel="nofollow">Bert wrote in an earlier thread</a>:<br>
      Why should all typefaces cost the same? Different foundries aim at different markets. TEFF offers book typefaces and thus seem to focus on publishing houses. An approach that obviously has proved to be successful, as you can tell from the offerings of Dutch bookstores.<br>
      The ordinary freelance graphic designer just doesn’t belong to their target audience. Yes, you could call that elitism. Or conscious positioning. It also offers some protection – against overuse. And, to some degree, piracy: Someone who paid a four-digit amount for a type family is less likely to hand it on to some friend.</p>
      <p>Trinité is famous for its ‘automatic ligatures’. Learn about this clever design principle in <a href="http://books.google.com/books?id=sR9g5xPPJVQC&amp;lpg=PP1&amp;pg=PA161#v=onepage&amp;q=&amp;f=false" rel="nofollow">Dutch Type (p 161)</a>.</p>
      <p>On a different note: While discussion and disputation is very welcome on Typophile, please try to refrain from ad hominem attacks. Calling a fellow discussant ‘a moron’ etc. crosses the line, imho. Thank you.</p>
