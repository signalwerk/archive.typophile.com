      <p>Actually, although I do have a good collection of dead tree parts, I think most of my learning has been online. And because I asked. Or was wrong, in public. Same difference.</p>
      <p>Paying Attention is medium-independent. In fact I'm personally no fan of rote learning (even sympathizing with what Thamus told Theuth concerning writing in general). Which is probably one reason I dislike type-IDs.</p>
      <p>hhp</p>
