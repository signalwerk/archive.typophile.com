    html: |-
      <p>It’s because in the old days, we didn’t have the internet to ask. We had books, looked at them, and remembered them from practice. Simple <a href="http://en.wikipedia.org/wiki/Rote_learning" rel="nofollow">rote learning</a>. Take advantage of your resources, but if you always ask for help, you won’t develop the same ability. </p>
      <p>A fun book to look through is <a href="http://www.fontshop.com/products/fontbook/" rel="nofollow">FontShop’s FontBook</a>.</p>
      <p>“<em>Give a man a fish and you feed him for a day. Teach a man to fish and you feed him for a lifetime.”</em><br>
      ~ Chinese proverb</p>
