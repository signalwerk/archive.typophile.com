    html: |-
      <p>Kristians and kentlew are talking about trapping. It's a good idea if you aren't closely working with the printer. It gives you a rich black for color purposes, but a one-color black for the reversed type.</p>
      <p>Also keep in mind that if this is really small type, you're going to want to slightly beef up the type (via a thin stroke or consider going with a bold weight). </p>
      <p>On the other hand, if you are close to the printer in terms of being able to work directly with them, this may very well be something that they'd prefer to handle themselves. Traditionally, this was a pre-press/on-press issue that was handles by the professionals that handle the actual printing. In this era of really cheap printing, those craftsman aren't as abundant as they once were. </p>
      <p>Many skilled print shops may also have their own preferred rich black that they'd like you to use that takes into account all sorts of variables (the paper, their presses, their presspeople, etc.)</p>
