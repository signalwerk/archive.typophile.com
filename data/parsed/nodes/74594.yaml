    html: |-
      <p>On a coated paper I use 60/47/45/100 looks really black.<br>
      When I need to put white text on a black background I make two layers in indesign:<br>
      1) 60/47/45/0 with white letters with 0.35 pt white outline around them.<br>
      2) 100% black overprinted with the same white letters without any outline.</p>
