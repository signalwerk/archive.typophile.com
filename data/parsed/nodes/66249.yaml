    html: <p>One factor in this is that often the right, "upstroke" of the v is lighter in serifed type, and the eye expects that, so in sans it is also done often. When the right stroke is lighter you may have to tip the top a little more to the right to make it look balanced, if you assume the illusion of something weighted resting on the baseline. These things have a subtle influence.</p>
