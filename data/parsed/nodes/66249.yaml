      <p>That certainly sounds like a reasonable explanation. However, it seems like it wouldn't quite apply to other characters that cause a similar illusion. For example, when I've drawn a numeral eight and reach a point where I'm satisfied with it and feel like it looks uniform, straight, etc., all I have to do is hit the flip horizontal command and the thing looks like it's bent over relieving itself of the McDonald's breakfast burrito it had for breakfast that morning. It's really quite amazing to look at a number and think it's standing nice and tall only to flip it over and see it turn into something that looks like one of those weird-shaped symbols used in 150 B.C.</p>
      <p>Obviously the problem exists in both cases of the letters "V" and "W," and at least for me does in the numeral "8" as well. Not to mention the "zero."</p>
      <p>I think there's one other thing along these same lines that also really turns my shower cold; for example, when I'm attempting to draw the inside of a lower case "e," or create something else that would seem to require the upper inside point of the letter to be centered like the "v" letters. I create the letter e and c (speaking in terms of basic sans faces, think they look great and then flip it horizontally to its apparent death. So while I can certainly understand the philosophy behind slanting the letter "V," as you've stated it, I'm still in the dark about all the other parts of different characters that cause the same brief mental warp for me.</p>
