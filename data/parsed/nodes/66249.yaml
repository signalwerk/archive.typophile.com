    <p>Rather than allow such an odd issue to continue blowing my mind, I thought I'd bite the bullet ask the group here if I'm blind, crazy or normal.</p>
    <p>The scene: Drawing an upper-case "V" in a basic text face, whatever - doesn't matter. When creating a basic skeleton of the letter in FontLab, I'll draw one vertical box (which in terms of shape is an upper-case 'I'), and either manually slant it left or right 30 or 35 degrees. Then I'll copy and paste that, flip it horizontally, and merge the two boxes. Now, of course when I flip the result horizontally, nothing appears to move since it's symmetrical.</p>
    <p>And since it IS symmetrical, it stands to reason when viewing it in any of the various ways one can do so in FontLab, it should look symmetrical, right? So how come to me, even though mathematically it is symmetrical, the letter itself looks like it's leaning to the left pretty dramatically ... maybe even four or five degrees to the left? The same thing goes for the upper-case W and A. There are even times when a similar illusion can be found in the upper-and-lower case letter "S."</p>
    <p>The question then: Has this confounded anyone else? Have I unwittingly stumbled on an ancient syndrome of some sort that might even be named after the first person to discover the problem and solution ... and just don't recognize. For that matter, is there any explanation or reason for this at all other than my potentially bad vision? Should I just tilt my head to the left 10 degrees every time I create a typeface?</p>
    <p>Help me ... PLEASE!</p>
