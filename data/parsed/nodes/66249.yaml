      <p>I definitely do that, of course, since the "symmetrical" version is so ...  hmmm ... "unsymmetrical." I guess I was really just wondering if anyone could explain why that is, or for that matter if anyone had the same experience to begin with.</p>
      <p>You mentioned "optical correction." Is that some kind of actual "issue" that has its own explanations and rules, etc.? And if so, where could I find something to read on it. I think over time I just happened to obtain some recognition of the concept since everything always looked so optically incorrect. But I'm more curious now about finding out the dirty little technical and physiological secrets of such an annoying annoyance.</p>
