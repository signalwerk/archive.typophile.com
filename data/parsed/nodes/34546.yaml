    <p>Hi. Long time listener, first time caller. </p>
    <p>I have a client who hates the overhanging terminal on the lower case "a" and has requested that I use a sans serif font without said terminal in creating her brand. In my rather small font collection I'm only finding Futura and House Chalet NineteenEighty having truncated terminals on the a. Does anyone out there have any other suggestions that I might consider? Many thanks in advance.</p>
