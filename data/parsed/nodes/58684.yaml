    html: '<p>Seems the "webfont" story is getting some attention from Monotype Imaging. The company introduced a non-commercial end user license agreement, or EULA, that permits the use of fonts in the Embedded OpenType format on the Web. Intended to extend font choice for Web page design, the EULA requires no additional fee for use on a non-commercial Web site when licensing products from the company’s Monotype, Linotype, ITC and Image Club typeface collections from Monotype Imaging’s e-commerce sites: Fonts.com, Linotype.com, ITCFonts.com and Faces.co.uk. <a class="freelinking external" href="http://www.communitype.co.uk/archives/category/webtype" rel="nofollow">http://www.communitype.co.uk/archives/category/webtype</a></p>'
