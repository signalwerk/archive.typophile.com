    html: |-
      <p>There are just 2 ways to do it: You either give the customers the webfonts, or you give them a code and everything else is handled on the server of the webfonts provider. There is no other way to do it. So I was a little bit surprised about the hype around the "revolutionary idea" called Typekit. Richard and I (among others) are proposing this model for quite some time now. </p>
      <p>About the "real fonts on Web sites without piracy": It's just not possible! Sure, all these webfont services will use some sort of obfuscating, both for the download URLs and the font files itself, but in the end there is always a working font delivered to the browser. And any obfuscating can easily be bypassed or reversed. So as foundries we shouldn't fall for any promises about a "secure webfont service".<br>
      We should either accept the risk, or not take part in this development. But we shouln't wait for a magical solution to secure the fonts. It's not gonna happen.</p>
