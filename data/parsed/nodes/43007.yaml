    <p>Not strictly a type question (in fact not really at all) but I’ve got a series of 6x6 cards going to print, and yet again it’s a project that was abandoned (perhaps wisely) by a previous designer.</p>
    <p>Each card is black, with white type and a photograph taking up most of the design. After a bit of research here, and despite some variation of opinion I’ve settled on a deep black using CMYK (30,30,30,100) - No problem there, but unfortunately, the photos are of objects shot on a black background. The photographs are also in CMYK, but the blacks do not even come close to matching. I’m trying to find an elegant solution here, as there are 8 different cards and 4 posters all using the same source files. In my mind I can think of 2 options:</p>
    <p>1. clipping mask around my objects (super time consuming)<br>
    2. setup the backgrounds in the cards to match the images (some nasty 84,72,75,95 concoction) and let the printer sort it out (I really don’t want to this)</p>
    <p>To add insult to injury the black in each photo is different, so even if I went with option 2, the printer would likely have to adjust differently for each card.</p>
    <p>Anyone ideas?</p>
