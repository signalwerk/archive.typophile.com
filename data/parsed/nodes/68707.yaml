      <p>In that case, what is "reading distance"?<br>
      And how is x-height defined?<br>
      Do readers tend to settle at a standard x-height : degree-of-arc ratio?<br>
      Or are other typographic variable parameters involved?</p>
      <p>Do tests actually measure the "normal" eye-to-image distance of each participant?<br>
      I was under the assumption that reading distance is fixed in most tests.<br>
      And does everyone always read documents at a standard distance?<br>
      Don't readers hold larger pages further away?<br>
      And what of line length?<br>
      Is there some relationship between optimum horizontal "degree of arc" scanning and vertical arc?<br>
      How much does "normal" vary?<br>
      Are visual ergonomics as variable in people as other comfort factors? I suspect so.</p>
      <p><em>That there is no single measure for all tests doesn't jeopardize the viability of scientific testing at all.</em></p>
      <p>That principle is not what I'm contesting.<br>
      IMO, scientific testing is not viable because:<br>
      - there are too many variables (demographic, typographic, physical media) to draw meaningful conclusions relating to generally predictable typographic practice<br>
      - accurate measurement of most, if not all, variables, is not possible (the philosophical "how big is the x-height" problem)<br>
      - speed/fluency of reading is not the sole criteria by which typography should be judged.</p>
