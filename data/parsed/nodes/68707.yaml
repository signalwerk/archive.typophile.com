      <p>Science has the potential to support our claims with objective measure of human performance and empirical data (in addition to tradition, convention, aesthetics and intuition). In a struggling economy and environment is it of paramount importance that we guarantee our clients good return on investment and efficient consumption of resources. By employing scientific method we can not only validate and reproduce our claims, years of combined research will allow us to make more informed decisions in a more efficient manner. Look at how medicine has evolved.</p>
      <p>In addition, by breaking type into clearly defined independent variables (size, weight, font, &amp;c) and dependent variables (time, comprehension, visual search &amp;c) we can determine which factors have more influence.</p>
      <p>It may well be that we discover a lot of what we do has a significantly smaller effect on things such as reading comprehension than we assumed. What does this mean for typographers in general? Less work for one, or a perhaps a need for re-training. There will always be someone who wants to look cool though. Sex will always sell.</p>
      <p>However, it would allow us to direct our energies as practitioners into areas of greatest importance and to similarly re-direct our clients resources.</p>
      <p>For example: Hypothetically, 100 research scientists spend 100 years conducting hundreds of studies all of which show that hinting makes no significant difference on reading performance. What does this mean? That we stop spending hundreds of hours hinting fonts and do something else, like grow vegetables.</p>
      <p>It would also allow us to say to our clients "I understand that you want a perfectly hinted font, and I can do that, however, there has been a lot of research in this area that suggests it is of little value in terms of human performance and subjective response. As such, I cannot ethically take your money. I recommend you spend your budget on energy efficient light bulbs and solar panels instead."</p>
      <p>The end result? We have fresh local produce for diner, our clients have a smaller carbon footprint and we send a few troops home to stop fighting over gasoline. Granted this is profoundly political at this point, but I believe it essential that all designers, typographers, citizens even, begin thinking this way in an effort to move towards a more sustainable future. Imagine if it all started with fonts…</p>
