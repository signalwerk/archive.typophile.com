      <p><em>Inter scientias non minima est typographica</em> -- Johann Jakob von Weingarten, 17th Century.</p>
      <p>Chris, the text you quote from Bordens &amp; Abbott seems to me to describe someone with critical thinking and analytical skills, and not everyone who has such skills is a scientist nor is every use of such skills scientific. Science implies, to me, particular approaches to theory construction and experimental testing, whereas critical and analytical skills and methodologies are more general in nature and not limited to fields of science. So, yes, there is a potential for typographers to be applied scientists, but also for typographers to be philosophers, literary critics, philologists, and poets, among other things.</p>
