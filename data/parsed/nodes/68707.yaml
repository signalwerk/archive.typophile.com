      <p>As far as the reading process goes, I actually do believe that reading could be understood in purely scientific terms. The stimulus (i.e. letters and words) is determinable and fixed, the input pathways (e.g. the eyes, magno and parvocellular pathways, etc.) can be studied in detail. Our cognitive processing can be determined and accurately assessed in theory, and as imaging technologies improve so will our ability to peer into the brain and understand how neurological phenomena correlate with perception. </p>
      <p>All this makes for a theoretical ability to obtain a comprehensive and detailed scientific description of the reading process. Such a description should in turn enable us to produce a better reading experience, probably influencing future type design. It may also in the process provide typography with a scientific framework.</p>
      <p>And by the way, the fact that it is not possible to even measure the x-height of a typeface, is because "x-height" is not a proper measurement to begin with. Typography had chosen overly complex measurement benchmarks that do not lend themselves easily to fixed and objective assessments.</p>
