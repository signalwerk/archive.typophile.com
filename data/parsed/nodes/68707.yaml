      <p>This discussion touched a topic I am dealing with for a few weeks in preparation for my ICTVC talk. Prove me wrong, but I see no reason why there cannot be a science _about_ typeface design (shifting the topic here a bit, from typography to typeface design). As much as there is a science about language (and linguistics is considered a science, right?). The use of language is not science, neither is typography nor actual typeface design process, but there seems to be a great potential to systhematically-built knowledge base about letters and typefaces (their appearance as well as the process of their creation).</p>
      <p>Assessing typefaces from such perspective is certainly not limiting. You can still do whatever you want. However, systematic approach and reasoning might bring deeper understanding, easier to to transfer (to students) and develop (that is the main point of science, I guess, to maintain and extend the knowledge base).</p>
      <p>Here are few (trimmed) definitions from Wikipedia:</p>
      <p><strong>Science:</strong> (in narrower sense) a system of acquiring knowledge based on scientific method, and to the organized body of knowledge gained through such research</p>
      <p><strong>Scientific method:</strong> a body of techniques for investigating phenomena, acquiring new knowledge, or correcting and integrating previous knowledge. To be termed scientific, a method of inquiry must be based on gathering observable, empirical and measurable evidence subject to specific principles of reasoning. A scientific method consists of the collection of data through observation and experimentation, and the formulation and testing of hypotheses.</p>
      <p>My bit again:</p>
      <p>Knowledge base: (not yet systematic) theories of how to construct typefaces, which features affect readability and how, …<br>
      Scientific method: structural-functional analysis of the designs, psychological researches of reading, …</p>
      <p>The evidence is certainly observable and measurable (you can count the serifs, stem thickness, you can measure eye movements, …). And can you consider typeface design empirical? Not sure yet, but can you consider an actual “use of a typeface” as an empirical test?</p>
      <p>Noordzij, Unger, Knuth, and other some to mind.</p>
      <p>I know I mixing the readability/functional aspect with the structural study of typeface design, but that is just for the sake of being brief. I might be just embarassing myself here, prove me wrong please, but I cannot not ask the question:<br>
      If we can study one of the most important inventions we have, the language, how come we do not study the “second most important”, the written language, the same way? Or are we?</p>
