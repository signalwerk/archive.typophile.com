      <p>In Germany, design at the higher education level is often* taught at former polytechnic institutes called <em>Fachhochschulen</em>. The official English translation in Germany for <em>Fachhochschule</em> is "University of Applied Sciences." So there are plenty of typographers in Germany who come from an "applied sciences" background, at least on paper. I always thought that "University of Applied Sciences" was kind of a stupid translation, though.</p>
      <p>* There are other sorts of places one can study design in Germany, including universities and a number of art academies with university-level status.</p>
