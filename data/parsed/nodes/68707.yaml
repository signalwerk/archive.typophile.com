      <p>Adam (please call me John), I don't disagree with anything that you have written, except to note that typography, and not just type design, <em>can</em> be conducted in accord with the scientific method, taking into account, for instance, empirical study of document structure and layout, including microtypographic decisions, and their impact on reading speed and comprehension. Such study is being conducted by cognitive scientists, but if it feeds back into a practice of typography, then one can say that such typography is scientific in the sense of science-based. Does that make the typographer an applied scientist? Perhaps not, but it makes him a science applier, but then the same could be said of a chemist who spends his days making shampoo: is he really doing science, or is he just applying science? Further, something happens in the application of science that changes it somewhat, just as the applied arts colour the understanding of what art is.</p>
      <p>Re. the historical use of ‘science’: I spend a lot of time mentally inhabiting earlier centuries, in reading, singing and in an effort to understand how people thought at various times and places, so I tend to be accomodating to ‘archaic’ uses of language, noting also that in many cases such uses represent a much longer record of human thought than the relative novelties of modern usage.</p>
      <p>I'll also note that the quote in Christopher's original post framed ‘science’ in terms almost as broad and general as the traditional usage: a kind of critical thinking. I happen to disagree with that, but it did seem to me to give the discussion wide parameters.</p>
