      <p>John, the problem with typography is that there is a scarce body of research that is directly applicable to it, and on top of that one often finds that existing research tends to be flawed in one way or another. </p>
      <p>But even if typographers apply certain standards that were determined initially through empirical research, does that entail that they could be considered applied scientists? If an internal decorator chooses a certain layout or configuration, and he or she base it on some research into ergonomics done by a scientist X, does that make that internal decorator an applied scientist? I would argue that that is not the case.</p>
      <p>Additionally, the comparison to the Chemist, is not entirely fair, since the Chemist is a trained scientist to begin with, who may apply his scientific know how to the mundane world of shampoo making, yet his endeavour is still nonetheless scientific—both in that it is based directly on his scientific knowledge and experience, and in that the task he is engaging in is still in essence one of pure science.</p>
      <p>As for mentally inhabiting previous centuries, I have to admit that I would love to be able to grind some lens with Spinoza, have a cup of tea with Adam Smith, or print some pamphlets with Thomas Paine...</p>
