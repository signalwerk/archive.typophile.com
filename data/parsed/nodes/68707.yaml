      <p>Sure, you could have a science of typography.<br>
      But it would be too much like the science of marketing to have any greater scope than market research.<br>
      People have been trying to turn advertising into a science for a century.<br>
      The premise is appealing, because so much in the way of marketing economics and demographics can be measured.<br>
      The same illusion exists towards typography, because type is (now) apparently "only" simple bytes of information, systematically organized.<br>
      But ultimately, the effect of even a line of type in an advertisement cannot be predicted, only measured after the fact of its reading.</p>
      <p>The same is true of music.<br>
      More so than anything in the visual typographic realm (where it is not even possible to measure the x-height of a typeface), music can be accurately described scientifically, in terms of pitch, timbre, rhythm, etc., but that gives no indication on whether it will move the listener, only that it may be heard.</p>
      <p>Those who would apply the precepts of science to typography have great expectations that it will enable us to produce better reading through science. That's a misunderstanding of the way that science, culture, and typography work.</p>
