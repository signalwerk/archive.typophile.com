      <p>&gt;The cruciality of x-height has long been known to typographers.</p>
      <p>So what? Does that make the specific claim about the arc--which I don't think typographers had long ago--any less scientific?</p>
      <p>&gt;if a variable such as the x-height of a typeface is impossible to measure accurately</p>
      <p>But it is possible to measure it with sufficient accuracy. The topmost point of the x is good enough for almost every latin text font. Or you can take the definition in the software, or the average of flat height of vwxyz. It really doesn't matter because you are only going to get a variation of maybe 3% even with the overshoot height. The claim is with the x height that at .3 degrees relative to the viewer's eye, you have readability, and below that it starts falling off. The .3 degrees you could specify as plus or minus 10% (.03) and it would still be true. </p>
      <p>You seem to think that problems that can easily be dealt with mathematically--such as by specifying a range or interval rather than a single number--are somehow insuperable obstacles to science, whereas they are no barrier at all.    </p>
      <p>I get the feeling that you think a scientific claim like that about the visual degrees is some way a threat to the legitimacy of art, which it isn't in the least. </p>
      <p>And the thing about the arc could be useful to sign makers. If you want to know how big your letters have to be on a yet-to-be-built building, figuring the distance of the viewer and the needed arc would give you useful information. </p>
      <p>I'm not saying that this is any earth shaking new information, but it is a scientific, and I think valid claim about reading that is useful. I don't see why there can't be lots more.</p>
