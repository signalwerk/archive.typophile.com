      <p>Mr Hudson, it appears that we may be confounding some concepts here, namely Knowledge based practices versus the modern idea of Science, and Typography versus Type Design. </p>
      <p>Choosing to use the term science in it's archaic sense of "knowledge", renders the idea of typography as an applied science, empty of any coherent meaning. What is "knowledge"? How do we define it? Knowledge in such a wide sense, is too abstract to be meaningful. One could argue for instance that an Astrologist, in this archaic sense of science, is in fact an applied scientist (since he or she could argue that they are engaging in a knowledge based pursuit of "truth"), and I have no doubt that there are some Astrologists out there that would indeed see themselves as applied "scientists" of sorts. The idea of knowledge may have been different and more limited during  Johann Jakob von Weingarten's period, when knowledge was more restricted and its distribution highly censured. Our modern society though has knowledge bursting at its seems—it is a knowledge based culture, and as such using the term "Science" to represent this abundant commodity may not contribute to our understanding of Science or of the typographic craft. </p>
      <p>It is also worth noting though, that in the context of his time von Weingarten may have had just cause to consider typography as a science. First the idea of science had not been operationalised yet into its modern use. Second, the craft of typography practiced at the time was quite different from the way it is often practiced today. I have no doubt that von Weingarten had to possess a considerable knowledge and experience base to facilitate his craft, and one that went well beyond the ability to use page layout software. Third, at a time when the print medium had become the sine qua non to the spread of enlightenment, one could presume that some of the typographers of the time may had come to identify themselves with the same enlightened reason that was propagated through their presses, and through which the modern sciences had began to emerge. Alas, the craft of Typography has changed profoundly from von Weingarten's time, and many of its modern day practitioners, can scarcely lay a claim for an affiliation with science—neither in the archaic or modern sense of the term. </p>
      <p>The term science, as it is employed today, and as I had understood it in my previous post, is associated specifically with the "pursuit of knowledge covering general truths or the operations of fundamental laws", and with a specific methodology that "entails unbiased observations and systematic experimentation" (Encyclopædia Britannica). Thus defined, modern typography is not and cannot be considered a science of any sort or form.</p>
      <p>I do agree, though for the most part, with Mr Brezina's remarks, and I believe that the discussion takes a turn when one moves from talk of Typography to talk of Type Design. In the world of designing type there is room for the scientific method, for empirical driven experimentation, and for the uncovering of fundamental laws (viz. the laws concerning human reading processes). Not all type designers have a scientific approach to their subject matter, but some do, and I believe that a strong case can be made that designers such as Noordzij and Unger are in fact applied scientists at times. Furthermore, I would like to propose that science needs to collaborate with type designers, to enable for a more complete understanding of the reading process. A great deal of the scientific empirical research conducted hitherto into reading has suffered from logical and conceptual errors that owe, in part, to a lack of understanding of the nature of the stimulus in question. Such a research based collaborative effort would no doubt enrich both our scientific understanding of reading processes, and enhance and elevate the craft of type design.</p>
