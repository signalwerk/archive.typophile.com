      <p>Bill, my "too many variables" is a parameter of cultural artefacts and human behaviour.<br>
      The belief that science is about to "crack" how we read and turn typography into a hard science is naive.</p>
      <p><em>That's a law of reading, if I've got it right, and it's an example of the kind of thing that is impossible according to your flawed analysis.</em></p>
      <p>I hardly think it's a law of reading that it helps to have the text at the right distance, not too small, not too big.<br>
      The cruciality of x-height has long been known to typographers.</p>
      <p><em>...reading theory is in its beginning stages...</em></p>
      <p>Reading theory has been around a long time without making much progress.</p>
      <p>But never mind vague generalizations about the scope of science, I am asking hard, practical questions axiomatic to the nature of the research. </p>
      <p>Once again: how can a theory that, say, involves foveal density, arc of vision, and type size, be properly scientific if a variable such as the x-height of a typeface is impossible to measure accurately?</p>
      <p>Not everything can be simply measured: the question "how long is the coast line of Britain", which sparked fractal geometry, is of the same difficulty as the x-height problem. The present system of type measurement is not sufficient for the expectations that many people have that science will solve the reading puzzle.</p>
