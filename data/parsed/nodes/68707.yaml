      <p>Shubinsky, I think we need to be sensitive to different uses of the word 'science'. While I generally agree with your point that (most) typography is not scientific in the common modern use of the term, when Johann Jakob von Weingarten wrote, in the late 17th Century, ‘Inter scientias non minima est typographica’ -- typography is not the least among the sciences --, he was using the term both accurately and in the broad sense that is has been used throughout most of European history. Science in this sense means simply a knowledge-based practice -- contra the modern usage, which implies particular kinds of knowledge and methodologies --, and in this sense typography may certainly be conducted in a way that qualifies it as a science and, indeed, recognising this permits a useful distinction to be made between knowledge-based typography and what might be termed intuitive or even expressive typography.</p>
      <p>Further, if typography is conducted in such a way that it responds directly to e.g. empirical research in the study of reading -- which is Chris' interest --, then I think it would be hard to deny that such typography is scientific even in the modern sense.</p>
