      <p>I really believe that attempting to redefine Typography as an applied science is a severe overextension of the idea of Science. </p>
      <p>Insofar as a Typographer is a tradesman who sets type and handles all matters related to type setting, he is no more of an applied scientists than a carpenter or a mechanic. The level of expertise and artisanship that may be required or called for in the context of these various trades, has nothing to do with science per se; with the scientific method, or with the careful application of scientific methodologies and scrutiny. A pseudo-scientific approach does not qualify as science, and the fact that there might be some elements of the work that may shares a superficial resemblance to a scientific methodology, cannot be used to qualify one's work or profession as scientific.</p>
      <p>@ dezcom: the fact that Ohio State had granted undergraduates of "Visual Communication Design" a Bachelor of Science, may very well be irrelevant. I have a feeling that it has nothing to do with science, and everything to do with marketing (with perhaps a dash of internal politics). A Bachelor of Science is still considered to be a slightly greater status that the more common Bachelor of Arts, offering such a degree to graphic designers is probably intended to act as a draw for the Ohio State program.</p>
      <p>One last note (and one that hopefully would not annoy too many people here), is that most of the Social Sciences are NOT sciences in the traditional or even common conception of the word. Having the word science attached to something does not render it scientific, and taking social science courses in university does not make one a scientist.</p>
