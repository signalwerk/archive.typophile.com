      <p>Nick, all of your arguments, especially "too many variables" could have been made about the paths of the planets in the heavens before Newton--which wander all over the sky viewed from earth, according to no simple geometry. The theory-in this case Copernicus and then Newton's theory--is what enabled seeing a simple story behind the complex data. The number of variables is no barrier to doing science. Look at the number of variables in human blood. But when they identified that the one variable of insulin caused diabetes, they really had something. In other cases many variables may be involved, such as genes and chemical products of cells, but if you get theory of relationship between the variables right--like the relation between force, mass, and motion--you get tremendous insight and predictive power. </p>
      <p>The .3 degree arc is defined in relation to the distance of the viewer from the text.  That's an example of how one variable is taken care of by the way you set up the test. You calculate the arc, given a distance from the screen or card. See, the extra variable of distance from the reading material poses no barrier to testing the theory. The point is that when you go below that threshold people have start to have greater and greater difficulty in reading the text. That's a law of reading, if I've got it right, and it's an example of the kind of thing that is impossible according to your flawed analysis. And it relates, I'm sure, to the closeness of the receptors in the fovea, which is a physical fact. </p>
      <p>The fact that reading theory is in its beginning stages is no reason to throw up our hands and say "too many variables!" "impossible!"</p>
