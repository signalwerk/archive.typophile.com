      <p>Bill this has nothing to do with art vs. science.<br>
      I am all for science, which is why I object to the bad science that is generally involved with reading research.</p>
      <p>You are right, arc of vision is indeed a legitimate measure of the height of the lower case x glyph in a piece of typography.<br>
      In that case, why is most reading research done using manufacturer's point size?<br>
      And unless a font size standard based on "x-height in degrees of arc of vision" is implemented, of what practical use can such research be?</p>
      <p>Compare Adobe Futura with URW Futura: Adobe's x-height is 15% larger than URW's at any given point size.<br>
      Compare Adobe Futura with Century Gothic: again, the difference in x-height is 15%.<br>
      These are not insignificant amounts.</p>
      <p>At any rate, when people speak of x-height in relation to readability -- both typographers and scientists -- they generally understand it to mean proportion of cap or ascender height. Degree-of-arc research doesn't address that issue at all.</p>
      <p>I am also concerned that scientific research is a threat to good typographers and to the business of type design.</p>
      <p>For instance, the CNIB (Canadian Institute for the Blind) recommends Arial and Verdana as the go-to faces for accessible typography (which is being legislated by government). Joe Clark took them to task over this in 2006, but it is still recommending those faces, backed up by its 2007 literature review of readability studies in which Arial usually manages to outperform Times Roman, often in RSVP (Rapid Sequential Visual Presentation) set-ups!</p>
      <p>It would be responsible for all readability researchers to NOT name the faces they are using.<br>
      What we have is product testing of a minuscule sample of the entire font population.</p>
