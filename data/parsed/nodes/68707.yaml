      <p>Nick, what measure you use depends on what scientific question you are asking, what you are testing for. That there is no single measure for all tests doesn't jeopardize the viability of scientific testing at all. </p>
      <p>With latin fonts, one of the most important measures is the span of the visual arc taken up by the x-height at reading distance, as below a threshold for the visual arc legibility declines sharply. If I remember correctly from Kevin Larson the usual minimum for the arc is .3 degrees.</p>
