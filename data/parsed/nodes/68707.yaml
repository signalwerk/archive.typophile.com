    <p>We are all too familiar with the ongoing discourse surrounding the re-definition of the role of the typographer. Food for thought:</p>
    <p>“<em>A scientist approaches a problem by carefully designing its parameters, seeking out relevant information, and subjecting proposed solutions to rigorous testing. The scientific view of the world leads a person to be skeptical about what he or she reads or hears in popular media. Having a scientific outlook leads a person to question the validity of provocative statements made in the media and to find out what scientific studies say about those statements. In short, and individual with a scientific outlook does not accept everything at face value</em>.” (Bordens &amp; Abbott, 2008).</p>
    <p>Replace the word scientist with typographer. As such, is there a potential for typographers to become applied scientists?</p>
    <p>Bordens, K. S. &amp; Abbott, B. B., (2008). <em>Research Design and Methods. 7th ed. p 3</em>. McGraw Hill, New York.</p>
