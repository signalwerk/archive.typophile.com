    <p>Hi!<br>
    I'd like to introduce a new font. It's Candelivers.</p>
    <p><a class="freelinking external" href="http://www.armasen.com/Candelivers" rel="nofollow">Click here!</a></p>
    <p>Candelivers is a fun and display typeface, for better use in short sentences, or letterings and logo designs. It comes with a several features, like swashes, alternates and ligatures. It has a little not simmetry between the characters that gives a personality and handmade touch.<br>
    Also it comes with a Glow version, to give more soft and fun personality. I hope you enjoy it!</p>
