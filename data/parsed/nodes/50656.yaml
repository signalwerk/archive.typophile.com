    html: <p>Ok. Did some minor changes as advice here. Balanced the thickness of the numbers, added Pistilli's signature ampersand as an alternate just in case you want to use them and made some tweaks in "r" "a" "D" &amp; "Ss". I'm quite happy with it right now and maybe I'll be releasing this soon enough.</p>
