    votes: null
    html: |-
      <p>I agree with the above comments about Q, D, 8, and a.</p>
      <p>Top serif of S and s extend too far down. All the big round letters get too black (CDGOQ). Glyphs with uneven thicknesses of thicks really stick out (e.g. D, 6). Is the arm of r too curled-up? Is the t's tail wide enough?</p>
      <p>Did you try unbracketed serifs with this? They might be a more natural fit for the rectangular counters (but maybe that would lose a distinctiveness you're after).</p>
      <p>I like j, Q's tail, X and x.</p>
    html_clean: |-
