    date_raw: 16 May 2008 — 11:50am
    votes: null
    html: <p>For something as difficult as "ivyclara", I think you'll find that even if you work out a really good ambigram, a lot of people still won't be able to read it, making it ineffective as a logo. But if you want to keep trying, I suggest centering it on "l" and you'll probably find better solutions. The development of an ambigram generally requires sitting down with a pencil and paper and doodling out as many bare solutions as you can find first, and applying style comes afterwards.</p>
