    html: <p>It looks awesome, but I cannot read it at all. As Asvetic said, try simplifying, and try to make it more of a recognizable letter. For instance, when you separate the 'v' it looks like a stroke down that connects to 'i' to make an 'n' (make space between) and the right stem of 'v' looks like an 's'. Utilize spacing and don't disconnect letters. That should help with legibility. The style looks great, but it's a matter of refining, connecting, and shaping.</p>
    html_clean: <p>It looks awesome, but I cannot read it at all. As Asvetic said, try simplifying, and try to make it more of a recognizable letter. For instance, when you separate the 'v' it looks like a stroke down that connects to 'i' to make an 'n' (make space between) and the right stem of 'v' looks like an 's'. Utilize spacing and don't disconnect letters. That should help with legibility. The style looks great, but it's a matter of refining, connecting, and shaping.</p>
