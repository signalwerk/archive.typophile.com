      <p>It's better than the previous, but could be simplified and cleaned up even more. ivy is still difficult to ready, and the Cl is slightly better but not much. ArA is the most readable. </p>
      <p>I think you might want to consider staying with all caps or all lower case. Also, use line weight to your benefit. Thick lines stand out, light lines disappear, this could help make certain character more obvious when in reverse.</p>
