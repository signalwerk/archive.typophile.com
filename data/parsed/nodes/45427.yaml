    <p>Hi,</p>
    <p>I'm trying to create an ambigram for a logo for a bespoke, alternative wedding jewellery maker. The name of the company is 'Ivy Clara;.</p>
    <p>Here is what i've come up with so far, and unless I can fine tune this to read more clearly I think I'll abandon the ambigram approach. Before I do throw in the towel however, I thought I'd post it here to see if you intelligent people can help out at all. </p>
    <p>Any hints, or tips on general ambigram creation would be welcomed; as well as specific advice on the uploaded example.</p>
    <p>Thank you,</p>
    <p>David</p>
