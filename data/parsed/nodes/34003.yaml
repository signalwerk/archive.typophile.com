    <p>I'm looking for an OpenType version of Ehrhardt that has text figures. Does anyone know if such a thing exists?</p>
    <p>I see <a href="http://www.fonts.com/findfonts/detail.htm?pid=433445" rel="nofollow">"Ehrhardt MT Pro"</a> on the Monotype site, but it looks like only the Regular weight has text figures. I see a few <a href="http://www.fonts.com/findfonts/detail.htm?pid=243216" rel="nofollow">Expert weights (Type 1)</a>, but I'm trying hard to buy only OpenType now.</p>
    <p>Could anyone that has the Pro version check to see whether the Italic weight has text figures? I've emailed Monotype but no response yet.</p>
    <p>Thanks!</p>
