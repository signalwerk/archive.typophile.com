  html: |-
    <p>I'm working on revising a menu layout for a chain restaurant, (family-friendly, mostly ribs and steaks, mid-range pricing).</p>
    <p>The typeface in use in Helvetica... lovely for may applications, but I fear not for this one.<br>
    I'm looking for any suggestions out there as to a typeface with high-legibililty at a relatively small size, preferably sans serif.</p>
    <p>All suggestions are welcome!</p>
    <p>Thanks to all who can help :)</p>
