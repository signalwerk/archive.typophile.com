    <p>So, while I've certainly seen the all-capped DE ligature rather often, I came across a new one&nbsp;—&nbsp;the lower cased.  And just afterwards, a barred q for qua/cua. Now granted, I know that scribal abbreviations for such things are common, but I don't work with medieval texts where those are very common.  I certainly didn't expect to see it in a printed text from the 16th century.  The most I'm used to seeing is ß in italics and a good bit of n/m dropping via tilde.</p>
    <p>How long did some of these abbreviations last out elsewhere?  Most of the facsimile editions I've used from Spain in the 16th century just have ß in italics, and a good bit of n/m dropping via tilde, and replacing que with q-tilde, hence my surprise with this one.</p>
