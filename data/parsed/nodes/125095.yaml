  html: |-
    <p>Join us at the Newberry Library in Chicago for a special curator-led tour of the Creating Shakespeare exhibition which ends this month! Featuring fantastic specimens of calligraphy, printing, and design from the 17th-21st centuries.</p>
    <p>Please bring a type-related gift under $10 for a White Elephant gift exchange.</p>
    <p>As always, we will sketch our word of the month in our dedicated sketchbook. Materials provided, but feel free to bring your favorite type tools.</p>
    <p>The tour is free but space is limited.</p>
    <p>Sketch • Network • Learn</p>
    <p>For more info and to RSVP:<br>
    meetup.com/thedevotedtype</p>
