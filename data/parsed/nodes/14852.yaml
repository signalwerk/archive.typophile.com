      <p><em>&gt;Dan, when you used illustrator were you saavy to point placement theory already or were you using ‘optomize’ on your outline after you imported it or what? What was your experience like?</em></p>
      <p>No, not at all. But until February I was still making Fonts with Fontographer, whose point placement isn't completely accurate anyway (although you can fidget with the numbers until you get it right, even though I never did).</p>
      <p>Right after switching to FontLab, I starting setting up Illustrator to work with FL. <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675" rel="nofollow">Here</a> are the instructions on how to do that. I worked that way for a month, but then I realized that no amount of optimization would be quicker than working directly in FontLab all the time.</p>
