    user_image: /files/pictures/picture-1551.gif
    date_raw: 10 Sep 2005 — 7:40am
    date: 2005-09-10T07:40:00
    votes: null
    html: <p>In fontlab if you right click a node in the outline on the PC--or I assume control click on the Mac--it gives you the option of 'make node first'. So if you want to change the end-of-path point, right click or control-click another node, and make that other node first. Then you won't lose the curve when you modify.</p>
  - id: 86894
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    user_image: /files/pictures/picture-1043.jpg
    date_raw: 10 Sep 2005 — 7:47am
    date: 2005-09-10T07:47:00
    votes: null
    html: |-
      <p>Nick, the simplest work around is to do "Make node first" (from the contextual pop-up) to a node somewhere else on the path not adjacent to the node you want to delete. After you delete the node, you can do "Make node first" on the original first node to restore the node order if you need to.</p>
      <p>One caveat: Changing the order of the nodes will mess up any links you may have set up. The solution is to temporarily convert them to hints while performing the above procedure.</p>
      <p>--</p>
      <p>Back on topic:</p>
      <p>I used to use Illustrator to do all my drawing when I was using Fontographer because I didn't like the drawing tools in Fontographer. Getting art from Illustrator to Fontographer was very simple. Working the same way with FontLab is not as simple and for years this kept me from switching to FontLab. Then I learned to draw directly in FontLab and this became an irrelevant issue. Not only that, I now am able to work much more quickly and efficiently and wish I'd figured this out sooner.</p>
      <p>One reason I did like working in Illustrator was the one Terry brought up, about being able to work with glyphs side by side, in context. You can get most of this functionality by keeping a metrics preview window open while you work. Having a second screen is especially helpful if you work this way. The new version of FontLab should be even better in this regard since it allows you to see other glyphs next to the one you're working on in the glyph window (or something like that). This was actually a feature I suggested which was picked up by Yuri on Typophile a while back. I'm not sure exactly how it works as I haven't been privy to the beta versions, but I'm looking forward to it.</p>
