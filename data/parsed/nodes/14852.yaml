    html: |-
      <p>Zoom: use the Z and X keys, Option+mouse wheel, Cmd+space for marquee zoom and Cmd+1 to Cmd+6. </p>
      <p>The biggest conceptual different between FontLab and Illustrator is that FontLab always imposes the integer-coordinate grid. Since the final fonts must have outline points on integer coordinates, this gives you full WYSIWYG but sometimes does not give you full flexibility. In Illustrator, you can use fractional coordinates which demands more self-control: you may end up with drawing some superfine design features that will be in the end impossible to incorporate them into the final font since they all will have to be rounded to integers anyway. But the final decision is of course the user's and depends on your preferences. </p>
      <p>Regards,<br>
      Adam</p>
