    html: <p>To answer your questions simply, I'd say that Illustrator is a vector drawing program mostly used for logo, technical objects, charts and so on. It's a ideal companion for a page layout software. I worked with Illustrator since the first version (Illustrator 88) and he always has his place on my computer. However I'm forced to admit that Fontlab do a better job if you want to draw letters. It's a ideal companion to a type designer.</p>
