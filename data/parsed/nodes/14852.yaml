    <p>I have almost no experience with <a href="/wiki/Adobe%20Illustrator" class="freelinking" rel="nofollow">Illustrator</a> at all, but I understand many typeface desginers use it for drawing outlines, so I wonder what its advantages over, say, <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> -- merely as a tool for drawing outlines -- are.</p>
    <p>Can it do things FontLab can't? Does it offer better algorithms for transforming outlines than FontLab does? Is it just simpler to use? Please share your thoughts!</p>
    <p>Thanks</p>
