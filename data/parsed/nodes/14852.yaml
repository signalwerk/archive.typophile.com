      <p>Wow, looks like I'm the only one here with a differing opinion. Since I'm not nearly on the same professional level as many who post on this site, I prefer Illustrator to actually draw glyphs. I like to see all the glyphs together and how they relate to each other. Its easier for me to see that in Illustrator.</p>
      <p>I also work by drawing my letters first with pencil, scanning, then tracing...so Illustrator I think is better for that. I'm more comfortable with the bezier drawing tools in AI than in FontLab...I still find FontLab's bezier tools to be more difficult to use. This is not to say I might not change my mind eventually.</p>
      <p>However, I only do "basic sketches" in Illustrator. By far I use FL more than AI. FontLab's editing tools can hand Illustrator's @$$ to it on a silver platter. When using FontLab for glyph editing, you quickly see the major limitations of Illustrator's vector editing capabilities. </p>
      <p>So in short I use Illustrator for basic glyph sketches, FontLab for all editing.</p>
