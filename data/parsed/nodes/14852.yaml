      <p>*BUT* Some people who have learned how to think in vectors in illustrator find that they think &amp; work best in Illustrator. For them it's useful to work in that environment. It is comfortable. Illustrtor lets you zoom in &amp; out more easily / flexibly. It has some UI advantages which are real.</p>
      <p>Like Dan, I am used to fontlab now.  Now when I work in illustrator - even for Illustration - it irritates me that the vector editing behavior is not more like Fontlab. I am used to fontlab now. But it might be the reverse for someone else. I used to like Illutrator better.</p>
      <p>From a practical point of view, if you are going to make alot of fonts - or work on one serious one - you might want to just wrap your head around Fontlab because it will save you time in the long run ( no conversion process) and you can place the points where they need to go from the beginning instead of having to figure out where the orthodox placement of points for your shape should be afterwards. Optimal point placement is different in Fonts than in illustration - it's more restrictive.</p>
      <p>Do you know what I am talking about? </p>
      <p>On the other hand If you do understand this theory then you could use that knowlege in Illustrator too. So...</p>
      <p>Dan, when you used illustrator were you saavy to point placement theory already or were you using 'optomize' on your outline after you imported it or what? What was your experience like?</p>
