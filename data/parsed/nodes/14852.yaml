    html: |-
      <p>I've noticed that people get used to one or the other program for outline work and then stick with it out of familiarity. The preference usually is based on that, rather than actual features. I personally don't want to go through conversion hoops from AI to FL when I can draw my outlines with all the guides, metrics, etc. available in each glyph window. Saves time, especially since I need to edit the outlines in FL anyway. I can't do much proofing with a collection of outlines that don't have spacing, alignment, or keyboard accessibility, and once I get proofing, there will be changes. If for some reason type design programs didn't have outline editing tools, I might consider using Illustrator, but FL (and Fontographer) is quite robust for outline work, and the new version will be even better.  </p>
      <p>Illustrator's outline editing tools are slightly different from those in FL. Specifically, nice shortcuts like double-clicking points to change them from corner to smooth aren't the same. Because I'm not used to drawing letters in AI, I prefer to do type drawing in a type design program. When I need to make clip art or other less structured outlines I use AI. </p>
      <p>To answer your questions directly: AI doesn't offer any advantage in drawing letters, especially when you need to make type out of the letters. Illustrator isn't simpler to use or more powerful. It's all personal habits.</p>
