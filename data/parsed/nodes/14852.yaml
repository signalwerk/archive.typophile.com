      <p>The two reasons I still use Illustrator: Option Drag and the "Reshape Tool". The reshape tool works a lot like Fontlab's interpolation command, but the interface is much cleaner, though I do miss the FontLab interpolation's numeric control. I think the ideal interpolation tool would be an Illustrator style reshape tool that responded to arrow key/shift arrow key adjustments.</p>
      <p>The only other consideration is that I'm so used to Illustrator style editing that I'm much faster that way. I imagine that if I were to spend more time drawing from scratch in FontLab I would find new ways of doing things. I do have to do quite a bit of cleaning my rough Illustrator curves, because FontLab's tools are much more precise, and I just can't do without FontLab's eraser tool.</p>
