    html: |-
      <p>Nice, but I find that something isn’t in place.<br>
      IMO, you have two options:<br>
      1. make the “pixel” G (nice) more like the one from the font you used (by “condensing” it, so to speak)<br>
      2. use a font with a G more like the pixel one you made (you used Helvetica Neue Condensed, but the pixel G does not look like a condensed font).</p>
      <p>Bye<br>
      A.</p>
