    <p>Elk Grove Village, IL -- September 8, 2009 -- Ascender Corporation, Carter &amp; Cone and The Font Bureau, Inc. announced today that they are working on a project in conjunction with Microsoft to extend the Georgia and Verdana typeface families. This project began more than a year ago, and the first of the new typefaces are expected during the first quarter of 2010. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Verdana-Georgia-PR_3672.png"></div><p></p>
    <p>The Georgia and Verdana typeface families were originally commissioned by Microsoft to address the challenges of on-screen display. Designed by Matthew Carter and hinted for screen legibility by Ascender’s Tom Rickner, these fonts were initially released in 1996 with Microsoft’s ‘Core fonts for the Web’ font pack, and then with the Internet Explorer 4.0 ‘supplemental’ font pack. Today the Georgia and Verdana typeface families are among the most widely used font families.</p>
    <p>Both Georgia and Verdana set the bar for screen legibility when it was needed most – when the Internet was experiencing an explosive period of growth. Their robust designs succeeded in reducing the chore of reading web content and email on-line and in small print. </p>
    <p>Each family features large x-heights, open counters, high contrast between the regular &amp; bold weights, ample spacing, and designs that help distinguish commonly confused letterforms. The fonts were programmed with extensive TrueType ‘hints’ for improved rendering at small and large sizes in Microsoft Windows, and were developed with support for the WGL Pan-European character set.</p>
    <p>The Ascender, Carter &amp; Cone and Font Bureau project intends to optimize the Verdana and Georgia fonts for many new applications, including extended text formatting on websites and in print. The Georgia/Verdana project will provide a variety of enhancements to these fonts including:<br>
     - New weights and widths beyond the original four fonts in each family<br>
     - Extensions to the character sets<br>
     - Extensions to the kerning<br>
     - OpenType typographic features for enhanced typography</p>
    <p>“Verdana and Georgia were commissioned by Microsoft to provide the basic necessities of type on screen: sanserif and serif, in regular and bold weights with italics, designed for maximum legibility.” said Matthew Carter of Carter &amp; Cone Type Inc. “The new additions to the font families are a natural and timely progression; they offer a wider range of typographic versatility, both on screen and in print, while remaining consistent with the originals.” </p>
    <p>“The expanded and enhanced Georgia and Verdana families will appeal to many who publish in print and online,” said David Berlow, co-founder of The Font Bureau. “This expansion adds breadth for creative professionals who rely on these two workhorse font families,” he added. </p>
    <p>“Georgia and Verdana forged the path for on-screen reading,” said Ira Mirochnick, president of Ascender Corp. “The opportunity to put together a design and development team consisting of Matthew Carter, David Berlow, Steve Matteson and Tom Rickner to expand and enhance these special fonts is unprecedented. Their work will provide everyone from users of Microsoft Office to professional designers with an exciting set of additional fonts that we believe will make Georgia and Verdana even more widely used than they are today.”</p>
    <p>“We have wanted to expand the Georgia and Verdana families for a long time,” said Simon Daniels, senior program manager for fonts at Microsoft Corporation, “and we are excited to be able to team with Ascender, Carter &amp; Cone and The Font Bureau to build on these great font families. We look forward to these new fonts being available to our users.”</p>
    <p><strong>About Ascender</strong><br>
    Ascender Corporation is a leading provider of advanced font products. Ascender’s founders are font industry experts and have been involved in developing many of the most important and influential fonts used in computers, mobile devices, consumer electronics and software products. Ascender provides multilingual, custom font development for a wide range of customers including creative professionals, enterprises, software developers and hardware manufacturers. Ascender also provides an extensive collection of TrueType &amp; OpenType fonts for download to graphic designers and consumers through its font websites, including <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a>.</p>
