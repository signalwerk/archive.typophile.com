    <p><strong>About Font Bureau</strong><br>
    Font Bureau was founded in 1989 by noted publications designer and consultant Roger Black and type designer David Berlow to serve the emerging needs of microcomputer-based magazine and newspaper publishers seeking unique typographic identities. During the past 20 years, Font Bureau has designed more than 1,500 fonts for more than 300 publications, many of which have become part of Font Bureau’s Retail Library.</p>
