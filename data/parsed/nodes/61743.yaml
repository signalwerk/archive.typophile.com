    <p><strong>About Carter &amp; Cone Type</strong><br>
    Carter &amp; Cone Type Inc. is a font foundry started in 1992 by Matthew Carter and Cherie Cone. Carter &amp; Cone specializes in custom font for a variety of clients ranging from corporations and publications to educational institutions.</p>
