    <p>I got a Will Eisner comic book (Invisible people) out from the local library. The book was translated into Finnish with lettering by Jussi Karjalainen. I got curious about the look of the original chapter names, if they looked like these. The font used in the cover was different to the pictures I found of the English version’s cover (there seem to be more than one, actually), the Finnish book had Benguiat in the cover.<br>
    Does anyone know if Eisner did the lettering himself, at least the headings?</p>
    <p>Here are the Finnish ones:</p>
