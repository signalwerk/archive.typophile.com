      <p>Mili, Eisner did his own lettering in his late graphic novels; he might have hired someone for text but, if so, it doesn’t show in books like <cite>Contract with God</cite>. I don’t know what he did with foreign language translations. His lettering in the old <cite>Spirit</cite> comic book supplements just before and after WWII is pretty amazing (the Spirit title is sometimes spelled out architecturally with a building, sometimes spelled out in sheets of a newspaper drifting up in the wind above an abandoned waterfront), and it was different for each biweekly issue. Although some of his work on <cite>The Spirit</cite> after the war was more like supervising artist-story writer, I’d bet that he specified most opening lay-outs; he had young artists like Jules Fieffer and Frank Frazetta working for him at various times.</p>
      <p>Paul</p>
    html_clean: |-
