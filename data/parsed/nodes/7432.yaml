    html: <p>The early Sim titles (SimCity, SimTown, SimAnt, SimTower, SimEtc.,) used a font called <a href="http://www.myfonts.com/fonts/urw/newport-land/urw-t-normal/testdrive.html?s=SIMS&amp;p=72" target="_blank">Newport</a>. The current logo seems to have evolved from that.</p>
