    <p>This is a typeface based on a video that I made on type that was created with a scrap of paper..video can be viewed here: <a href="http://dada.cca.edu/~falfonso/vid/sound.htm" title="http://dada.cca.edu/~falfonso/vid/sound.htm">http://dada.cca.edu/~falfonso/vid/sound.htm</a>  Nothing's done yet and any feed back would be much appreciated. Also, although I don't know anything about open type, I will be making an open typeface with lots of ligatures.</p>
    <p>f</p>
