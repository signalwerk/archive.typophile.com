      <p>I think i agree! It makes me think of what <a href="http://www.ralphsteadman.com" rel="nofollow">Ralph Steadman</a> might come up with if he set about to design a font like <a href="http://www.t26.com/fonts/display.php?f_id=734" rel="nofollow">tension.</a>  That said, keeping some of the ridiculous variation in weight within the individual glyphs but maybe going for more consistancy with this through the entire typeface might be a good direction.. (now that i've said that, i think i'm probably just re-iterating shu)</p>
      <p>either way, i'm interested in seeing where you take it from here.</p>
