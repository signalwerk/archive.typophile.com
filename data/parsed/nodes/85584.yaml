  html: |-
    <p>I’ve noticed on MyFonts that some typefaces are ‘published’ by both Typeshop and Softmaker, i.e. <a class="freelinking external" href="http://new.myfonts.com/fonts/ef-typeshop/nashville/" rel="nofollow">TS Nashville</a> (note the design owner is ‘Quick Brown Fox’) and <a class="freelinking external" href="http://new.myfonts.com/fonts/softmaker/nashville-serial//" rel="nofollow">Nashville Serial</a>.</p>
    <p>I did some research and read on a thread here the story about <a class="freelinking external" href="http://www.typophile.com/node/52651" rel="nofollow">Sean Cavanaugh</a>’s SoftMaker. And whilst doing more research I found this on another thread </p>
    <blockquote><p>
    “Typeshop Collection”, which, as it seems, is the former Quick Brown Fox “Serials Typecollection”, which is the former Brendel &amp; Pabst “Serial Type Collection”.
    </p></blockquote>
    <p>So what's the story with TypeShop, are they both reselling old URW typefaces? And if ‘Serials Typecollection’ is from TypeShop, why is SoftMaker using the ‘Serial’ suffix? And who are Brendel &amp; Pabst and Typeshop (the description on myfonts didn't explain what I would like to know)?</p>
    <p>Many mysteries...</p>
