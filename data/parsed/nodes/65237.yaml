    <p>I need to be able to teach a coworker how to input dots below certain letters in a text, but things are complicated by the following facts:</p>
    <p>1) He's using a Mac and I'm not;<br>
    2) He's using Adobe Indesign, which I don't have;<br>
    3) The font we're using is Helvetica Narrow, which I don't have; and<br>
    4) We're not in the same city, so I can't show him directly.</p>
    <p>So does anybody know if the Helvetica Narrow font has a Combining Dot Below, and how can I teach him to implement it?</p>
