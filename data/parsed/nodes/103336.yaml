      <p>I ran the eight  letters in your sample through Identifont and it suggested Futura, which you thought was not the one!<br>
      Identifont suggests <a href="http://www.identifont.com/similar?284" rel="nofollow">several similar fonts</a>.<br>
      Unfortunately none of the letters in the sample have a distinctive  earmark. So I might suggest that you cross reference your installed list with the Identifont suggestions and see if one of them fits.<br>
      Don</p>
