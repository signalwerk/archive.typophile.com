      <p>There are really two issues at hand:</p>
      <p>The symbol and then setting the typeface.</p>
      <p>Since the whole point of having a visual mark, is<br>
      to eventually have the mark stand alone and have it<br>
      resonate with the audience, I’ll address this:</p>
      <p>While the ideas seem interesting, can you come up<br>
      with some additional concepts involving solid forms?</p>
      <p>Geometric and abstract may seem “boring” but it<br>
      really isn’t — the results of simplicity, uniqueness,<br>
      and memorability derive well from such formalities.</p>
      <p>The lessons from Modernism would be very appropriate<br>
      for a company such as this.</p>
