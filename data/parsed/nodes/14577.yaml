      <p>I still like the Gill... </p>
      <p>I was wondering about making a Gill like B ( or a BAtv or whatever) made not with squiggles but with rounded sea stones. I saw a logo made with leaves that I thought was pretty strong in eye magazine once.</p>
      <p>About the abstract stuff - clearly you have the main idea about this formal style - but I don’t see what idea is being driven at. What are these marks saying? The best of these marks have a message that they are attempting to distill I think. Adopting the style is not enough.</p>
      <p>It doesn’t sound like this client has told you much about what they want other than they want something simple. If you can’t get more out of them then I think you have to suggest what you think they should have - you have to invent a meaning for the logo. Am I right about this client or reading into the thread too far?</p>
      <p>If you are totally stuck you could just suggest a ’word mark’. What could be wrong with that?</p>
