      <p>Most (there are exceptions) TV graphics avoid a white background (as I understand it this is because many screens do not represent white very well or are not correctly white-balanced and/or that a white screen is uncomfortable/jarring to look at, take your pick or add another), so if this is to be used as a screen id it is worth examining it reversed out of a colour(s) and to employ an animated form of the abstract shapes (or maybe play with outlines of the Baltic states) that you used in version 2 to form a B or a circle, which, despite the associations to Unilever, I prefer. You can then develop this for a print logo.<br>
      Tim</p>
