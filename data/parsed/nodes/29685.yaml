    <p>Hi<br>
    Sorry to bother you with yet another InDesign problem.</p>
    <p>When I put a decimal tab in a line, the line breaks too early. Problem is, when i move the dec.tab rightwards, the line breaks long (that means 3-4 millimeters before the '0' meets the text box "wall". take a look at the picture below.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/post-18-98187-dectab_6325.jpg"></div><p></p>
    <p>all margins and paddings etc are set to zero.</p>
    <p>Does anyon know how to solve this without changing the width of the text box, and preferrably without using tables?</p>
    <p>best,</p>
    <p>alex</p>
