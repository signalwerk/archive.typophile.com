      <p>Certainly the money the winners are charged is put to good use - it's not some bizarre punishment. But to me it's somewhat perverse (I know I'm not alone in this) and it puts the winner (at least some winners) in an uncomfortable situation. I would instead simply charge all entrants a little bit more, avoiding the awkward stigma. Would the number of submissions drop? Probably a little bit. But you might see the drop offset by a (modest) increase in submissions from non-affluent countries. Consider somebody who has to scrounge the submission fee, knowing that if he wins he can't afford the hanging fee; he might conclude that the certificate isn't worth the submission fee. If he knows there are no "hidden fees" he's much more likely to submit.</p>
      <p>BTW this is a good opportunity to mention Granshan*. Although I'm not comparing it to the TDC in terms of prestige, it's notable that the entry fee is minimal (and it used to be totally free) and they've always given monetary prizes to winners**. This, from a country that's not at all affluent. One way they make it work is that the judging event is quite modest; when I was on the jury in 2010 the judging took place in tandem to the ATypI conference, with jurors selected from people who were going to be there anyway. Were the results compromised? To me it all felt quite robust.</p>
      <p>* <a href="http://www.granshan.org/" title="http://www.granshan.org/">http://www.granshan.org/</a></p>
      <p>** Only the venerable Morisawa competition had previously managed that.</p>
      <p>--</p>
      <p>BTW, minor point: I just noticed that on the TDC's site Michael Bierut's last name is spelled like my hometown instead.  :-)</p>
      <p>hhp</p>
