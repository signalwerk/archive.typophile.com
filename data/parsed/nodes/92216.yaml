      <p>When submitting to <a class="freelinking external" href="http://www.tiposlatinos.com/2012/index.php" rel="nofollow">Tipos Latinos</a> (Latin American type design biennial) you must include a brief text of around 600 characters set in 10 pt. Verdana at the bottom of the page. I think it is a good decision since I can explain some things there. As an example, I could explain why Gandhi Serif is lighter than usual or why Gandhi Sans has some “serifness” on it; that sort of things that you can’t tell by watching the design and that possibly might be disregarded or treated as flaws by the jury if they don’t have any additional information other than the letterforms.</p>
      <p>Or, if I don’t have anything interesting to say and/or the design speaks by itself, at least I can use that space for mentioning what characters it includes, if it has OT features, if it tackles an specific problem, if it is somehow related to some historical precedent… It doesn’t need to be a promotional text, just a concise description.</p>
