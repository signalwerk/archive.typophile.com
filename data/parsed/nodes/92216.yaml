      <p>Competitions and "awards" ceremonies exist entirely for the ego gratification of the people who concoct and promote such farcical and dubious goings-on. Why I refuse to participate in these shenanigans: some tossers hold an "awards ceremony" to glorify and honor nominees. You do all the work, you get nominated, and they expect you to travel to their venue and pay for a hotel room at your expense. The phenomenon itself, the business of shelling out awards revolves around the recipients. Without typeface designers no type design awards can be bestowed. On that basis the whole thing is a bucket of horse excrement.</p>
      <p>They need us more than we need them, and they are not getting one piece of me. And now we are expected to provide written justification for the things we create? You have got to be kidding. I'll give you a good idea where you can put that.</p>
      <p>@Hrant: <em> But if they (have to) read some sort of minimal explanation they have a chance to pay attention to what the point is.</em></p>
