      <p>Although there's certainly a dimension of vanity involved in competitions (I admit to feeling it myself) they can still make sense. Both times I've submitted to Creative Review magazine's type competitions I've basically gotten a full-page ad for less than $100, and I get to brandish the win like a big ol' mace. One thing I do mind though is something the TDC does: charge you extra for winning. :-/  In contrast, SoTA's Catalys Award* actually pays the recipient all their costs to attend TypeCon, although they do have to agree to give a talk... which however is yet more positive exposure (unless the person is a total rambling buffoon :-).</p>
      <p>* <a href="http://www.typesociety.org/catalyst/" title="http://www.typesociety.org/catalyst/">http://www.typesociety.org/catalyst/</a></p>
      <blockquote><p>If the judges need explanation for the point of each entry they should not be judges in a design competition.</p></blockquote>
      <p>Here again I see a denial of [a] reality. First of all, they're not gods. They haven't thought of everything under the sun. And when they're given too little time (a necessary evil to some extent, although I do think there are better ways than to physically fly judges to a venue and give them too little time*) they might reasonably miss something quite significant, and considering how text faces need to work this might be something very subtle. Think again about Legato.</p>
      <p>* In a competition in 1998 Critique magazine shipped the entries (which with letter-size PDFs would be unnecessary) to the judges. I won with Arasan.  :-)</p>
      <p>--</p>
      <p>BTW, I'm not sure why you expect[ed] a confrontation... since you've been here less than two days. :-&gt;  Or maybe you've been lurking (which is still better than not being here at all). I would point out here that "Breda DeLisle" does not seem to be a real name.</p>
      <p>That said: Thoughts are the skin on a body of emotions; you cannot disembody what you state from what you are, and cannot disembody criticism of your thoughts from criticism of your essence. This is something the West's ideal of "civil communication" has failed to come to terms with. Just sayin'.</p>
      <p>hhp</p>
