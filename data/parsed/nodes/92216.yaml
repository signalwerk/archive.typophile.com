      <p>I've been thinking about this too (without knowing about the AIGA stuff) and I believe it depends. The more innovative a typeface is the more the judges need to hear about the thought process behind it*; but the more mainstream a typeface is the more it has to speak for itself, and letting the designer explain it might actually do harm.</p>
      <p>* Which might not (and in fact usually cannot) involve a client, because making more money and marking cultural progress don't mix.</p>
      <p>hhp</p>
