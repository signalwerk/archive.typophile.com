      <p>@Hrant Papazian<br>
      "Although there's certainly a dimension of vanity involved in competitions (I admit to feeling it myself) they can still make sense."</p>
      <p>Sense is comprehensibility and so what? Beside the point. Do they have merit is the qestion.</p>
      <p>"Both times I've submitted to Creative Review magazine's type competitions I've basically gotten a full-page ad for less than $100, and I get to brandish the win like a big ol' mace."</p>
      <p>Congratulations. Who did you whack with your mace? Word-of-mouth from clients is the best kind of marketing. One comission job leads to the next. Real deal type designers are embarrassed by competition wins. Can you picture Matt Carter entering a type design comp? That would make him look kiddy grade. Same goes for John Hudson and Nick Shinn. We rarely if ever hear of them entering a type design comp.</p>
      <p>"One thing I do mind though is something the TDC does: charge you extra for winning. :-/"</p>
      <p>Funny about that. I see it bothers you. NYC is the apple in everybody else's eye. You shine their shoes and it makes them look clever, and you pay them for the "privelage" of shining their shoes.</p>
      <p>"In contrast, SoTA's Catalys Award* actually pays the recipient all their costs to attend TypeCon, although they do have to agree to give a talk... which however is yet more positive exposure (unless the person is a total rambling buffoon :-)."</p>
      <p>Like you for example. A babbling self-vindicating sociopath.</p>
      <p>That's very genial of SoTA. Would it be a letdown to point out SoTA is closely affiliated with TypeCon?</p>
      <p>&gt; If the judges need explanation for the point of each entry they should not be judges in a design competition.</p>
      <p>"Here again I see a denial of [a] reality."</p>
      <p>"denial", another thorn word you're using to label some one for negative effect. No, pointing out egotism is not denial of reality. Only small children would believe that statement if it were followed by what you put after it, which is more false logic. Post hoc ergo propter hoc: <a href="http://en.wikipedia.org/wiki/Post_hoc_ergo_propter_hoc" title="http://en.wikipedia.org/wiki/Post_hoc_ergo_propter_hoc">http://en.wikipedia.org/wiki/Post_hoc_ergo_propter_hoc</a></p>
      <p>"First of all, they're not gods. They haven't thought of everything under the sun."</p>
      <p>Nobody expects them to be gods. All we expect is an intuitive knowledge of the subject, type design, based on extensive experience.</p>
      <p>"And when they're given too little time (a necessary evil to some extent, although I do think there are better ways than to physically fly judges to a venue and give them too little time*) they might reasonably miss something quite significant, and considering how text faces need to work this might be something very subtle. Think again about Legato."</p>
