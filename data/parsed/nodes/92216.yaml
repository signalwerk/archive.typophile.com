    <p>There is lots of conversation going on about the AIGA "Justified" competition, which has replaced its other annual design competitions with one in which an explanation must accompany the submission addressing the brief, strategy, and assessment of effectiveness. The stir about this change was accelerated by <a class="freelinking external" href="http://imprint.printmag.com/design-thinking/aiga-unjustified/" rel="nofollow">Paula Scher's Imprint column</a> decrying the change. The commentary on that post has been rich and spirited both pro- and con-.</p>
    <p>How about  type design competitions? Would/could/should a type competition also evaluate the purpose that a design serves rather than just the design's qualities (beyond the existing bounds of, for example, display vs. text)?</p>
