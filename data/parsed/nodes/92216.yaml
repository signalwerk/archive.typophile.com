      <p>It might make sense for commissioned designs.<br>
      The premise of “justiﬁed” AD/graphic design competitions being that work is done to a brief, within the constraints of a marketing strategy that targets measured constituencies.<br>
      But for most foundry-initiated types that is not the case (my designs, for instance, are produced according to whim, with the only market directive a “feel” for what may appeal to font buyers—not readers), the justiﬁcations would be indistinguishable from marketing BS.<br>
      Perhaps a category for promotional writing would be more appropriate?</p>
