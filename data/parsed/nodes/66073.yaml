      <p>Hi Steffen,<br>
      your sample is <a href="http://www.fontshop.com/fonts/singles/itc/old_english_std_plain/?&amp;sample_text=Ungl%C3%BCcklicher%20bayerischer%20Kronprinz&amp;sample_size=32" rel="nofollow">Old English</a> by ITC (or <a href="http://new.myfonts.com/fonts/letraset/old-english/?testdrive=dock%3Dfalse%26size%3D28%26w%3D720%26src%3Dcustom%26text%3DUngl%25C3%25BCcklicher%2520bayerischer%2520Kronprinz%2520%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D28" rel="nofollow">Letraset</a> respectively – these versions seem to be more or less identical.</p>
      <p>Old English is based on a <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> by <a href="/wiki/William%20Caslon" class="freelinking" rel="nofollow">William Caslon</a> (England, ~ 1760). Other foundries had their own versions of this style, like the Manuskript Gotisch that Georg has shown above. At the beginning of the 20th century, <a href="/wiki/Morris%20Fuller%20Benton" class="freelinking" rel="nofollow">Morris Fuller Benton</a> designed a version for ATF.</p>
      <p>More information about the history of Old English typefaces can be found in this <a href="http://www.linotype.com/2195/oldenglishfonts.html" rel="nofollow">Linotype Font Feature</a>.</p>
      <p>Today, there is a number of digital ‘Old English’ fonts:<br>
      <a href="http://www.fontshop.com/fonts/singles/monotype/monotype_old_english_text_std_plain/" rel="nofollow">Monotype’s</a> (and <a href="http://new.myfonts.com/fonts/itfmecanorma/old-english/?testdrive=dock%3Dfalse%26size%3D28%26w%3D720%26src%3Dcustom%26text%3DUngl%25C3%25BCcklicher%2520bayerischer%2520Kronprinz%2520%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D32" rel="nofollow">Mecanorma’s</a>) is pretty wide and loose.<br>
      The <a href="http://www.fontshop.com/fonts/singles/urw/old_english/?&amp;sample_text=Ungl%C3%BCcklicher%20bayerischer%20Kronprinz&amp;sample_size=32" rel="nofollow">URW version</a> is lighter, with the ‘i’ dots shifted a bit to the right. It has the long s (ſ) as default.<br>
      <a href="http://www.fontshop.com/fonts/singles/bitstream/cloister_black_regular_ot/?&amp;sample_text=Ungl%C3%BCcklicher%20bayerischer%20Kronprinz&amp;sample_size=32" rel="nofollow">Bitstream’s version</a> is called ‘Cloister Black’ and can be easily distinguished by its sporns on ‘b’, ‘h’, ‘k’.</p>
      <p>Furthermore, there are numerous ‘spin-offs’, e.g. <a href="http://www.typedesign.com/fonts/aveblk.html" rel="nofollow">Avebury Black</a>, an ultra-black and wide display version by <a href="/wiki/Jim%20Parkinson" class="freelinking" rel="nofollow">Jim Parkinson</a>.<br>
      F</p>
