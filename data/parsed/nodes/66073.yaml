    <p>Hi there,</p>
    <p>attached you can see a blackletter typeface. </p>
    <p>As i am not very familiar with blackletter typefaces i was hoping someone might be able to 1) identify the typeface itself or 2) identify the historic origin or 3) make a suitable suggestion for an alternative or even a suggestion for any beautiful blackletter off-parameter. </p>
    <p>As said i am not familiar with those folks myself. I know about a book called <a class="freelinking external" href="http://www.fraktur-mon-amour.de/de/" rel="nofollow">Fraktur mon amour</a> which i unfortunately do not have though.</p>
    <p>Thanks for reading,</p>
    <p>regards, steffen</p>
