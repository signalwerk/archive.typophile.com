      <p>For alternative suggestions:<br>
      well, it depends what you’re aimng at, of course …</p>
      <p><a href="http://www.linotype.com/1608/wilhelmklingsporgotisch-family.html" rel="nofollow">Wilhelm-Klingspor-Gotisch</a> by <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a> is a classic <a href="/wiki/Textura" class="freelinking" rel="nofollow">Textura</a> beauty. So is <a href="/wiki/Goudy%20Text" class="freelinking" rel="nofollow">Goudy Text</a>, although it is more normalised – see its ‘d’, ‘h’, ‘z’, ‘A’ etc.</p>
      <p><a href="http://new.myfonts.com/fonts/preusstype/fleischmann-gotisch-pt/" rel="nofollow">Fleischmann Gotisch</a> is a festive baroque rendition. <a href="http://new.myfonts.com/fonts/preusstype/sinkwitz-gotisch/" rel="nofollow">Sinkwitz Gotisch</a> is rather dynamic and lively – both are revivals by <a href="/wiki/Ingo%20Preuss" class="freelinking" rel="nofollow">Ingo Preuss</a>. <a href="/wiki/Franti%C5%A1ek%20%C5%A0torm" class="freelinking" rel="nofollow">František Štorm</a>’s <a href="http://www.stormtype.com/typefaces-fonts-shop/families-37-plagwitz" rel="nofollow">Plagwitz</a> with its strong vertical stress or <a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a>’s economic <a href="http://www.linotype.com/1279/notredame-family.html" rel="nofollow">Notre Dame</a> are also charming.<br>
      F</p>
