      <p>Seems to be pretty close to Iconian Fonts <a class="freelinking external" href="http://www.dafont.com/national-express.font?nb_ppp=50&amp;text=REJECTS" rel="nofollow">National Express</a>, which is similar to some Trekkie-based font, apparently (see <a class="freelinking external" href="http://www.dafont.com/starfleet.font?nb_ppp=50&amp;text=REJECTS" rel="nofollow">Starfleet</a> and <a class="freelinking external" href="http://www.dafont.com/federation-classic.font?nb_ppp=50&amp;text=REJECTS" rel="nofollow">Federation Classic</a>)</p>
      <p>Some stretching and a few tweaks to the outlines and you're there.</p>
      <p>- Mike Yanega</p>
