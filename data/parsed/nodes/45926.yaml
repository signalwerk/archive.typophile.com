      <p>Seems to be pretty close to Iconian Fonts <a href="http://National Express" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://National Express</a>, which is similar to some Trekkie-based font, apparently (see <a href="http://Starfleet" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Starfleet</a> and <a href="http://Federation Classic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Federation Classic</a>)</p>
      <p>Some stretching and a few tweaks to the outlines and you're there.</p>
      <p>- Mike Yanega</p>
