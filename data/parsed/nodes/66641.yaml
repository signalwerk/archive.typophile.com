      <p>I have been using LaTeX for years. We use it instead of InDesign or Quark for the full text, not just for the equations. For someone working with InDesign, and needing really heavy mathematics, LaTeXit might be usefull. It comes  with <a href="http://www.tug.org/mactex/2009/"><strong>MacTeX 2009</strong></a>. Here is the equation that you see in John Hudson's very nice talk to be found <a href="http://river-valley.tv/scholarly-types/"><strong>here</strong></a> (starting 27:43). That qualifies as heavy mathematics.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/latexit_3975.jpg"></div><br>
      The middle pane tells LaTeX to use the amsmath package and fourier, which is a mathematical font based on Utopia (which comes installed with MacTeX 2009). The lower pane contains the commands that give the equations.<p></p>
      <p>To get the equation in InDesign, I had to save it as pdf outline, open it with Adobe Illustrator and then paste in InDesign. If you have just two or three of these, it might be a choice. For "in line" equations, i.e. equations in the text itself, I have no idea how to do it with InDesign.</p>
      <p>Michel</p>
