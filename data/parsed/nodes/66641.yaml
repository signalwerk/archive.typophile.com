      <p>Michael:</p>
      <p>mathspec allows the use of open type characters in math formulas (but symbols are not<br>
      yet supported by default and require a little trickery)  Basically, what it does is create a text environment inside<br>
      the equation displays.  I find that with some manual editing, it can do a fairly good<br>
      job.  </p>
      <p>I have found that xelatex + fontspec + mathspec(for letters/greek) + supported symbol font<br>
      to work quite well when writing my thesis.</p>
