    html: <p>TeX, in all its varieties and flavors (including LaTeX), seems too much like old-fashion markup. I've typeset science journals and engineering texts with hundreds of equations each and found that MathType (from Design Science) is easy to learn and use, has good support, and is not a super-pricey option. I like the control it gives over the look of equations and recommend it. (I am NOT affiliated in any way with Design Science or MathType.) As a book designer it is still my first choice for tpesetting math.</p>
