      <p>Michel,</p>
      <p>If you email me (address found easily from website) I will happily email you a pdf of slides and a recent paper using TheAntiquaB  (text) + theSans (Titles and math letters/greek) + Lucida Math (symbols).</p>
      <p>I am using mathspec for the math lettering.  It means you don’t have to constantly do \text.  The exception is for decorations on the letters which happen a lot in math (tilde, hats) and superscripts, which also require a little kerning.</p>
      <p>marc</p>
