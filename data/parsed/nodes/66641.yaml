      <p>Marc,</p>
      <p>I see what you mean. I actually tried xeLaTeX with fontspec, polyglossia, Arno Pro scaled=1.05, the <a href="http://www.ctan.org/tex-archive/fonts/minionpro/"><strong>MinionPro</strong></a> package with the onlymath option and some text with a mixture of smallcap polytonic greek (from the <a href="http://archimedespalimpsest.net/Supplemental/ArchimedesTranscriptions/"><strong>Archimedes palimpsest</strong></a> which is a copy of a text that dates back to a period where miniscule Greek letters did not exist), some mathematics and the like, just for fun, and the result looked promising. You just made me realize that if I add $Q\text{Q}$ to my trial text, I get a Q in Minion and then a Q in Arno in my formula. I am not sure I would like to rely on <code>\text{}</code> or the like for full formulas though. The letters is math fonts need to be easily distinguishable outside of any context and that is not true of standard fonts. Also, the nice tail of the Arno Q might clash with lower indices. Those letters were not meant for mathematics.</p>
      <p>Michel</p>
