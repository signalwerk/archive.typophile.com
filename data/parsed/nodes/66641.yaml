      <p>Concerning LaTeXit and InDesign, here is what I found.</p>
      <p>If in LaTeXit, you select "File &gt; Export image..." and then choose "PDF vector image", give some .pdf name to your file, say eqn1.pdf, save it, and then in InDesign select "File &gt; Place..." and choose eqn1.pdf, you get your equation right where you are typing (I think you need to select "View &gt; Overprint preview..." to see it properly, I am no InDesign expert). You can then adjust the formula box so that nothing is cut out and the formula aligns well with the text. More than that, if you wish to modify the formula, you can right click on it in InDesign, select "Edit original" and that will lauch LaTeXit on that formula with all the settings preserved. You edit it, LaTeXit, export it again (overwriting the previous file) and when you are back in InDesign, you click on the formula and it is updated. </p>
      <p>If you are not familiar with LaTeX formulas, you can use the online equation editor</p>
      <p><a href="http://www.codecogs.com/components/equationeditor/equationeditor.php" title="http://www.codecogs.com/components/equationeditor/equationeditor.php">http://www.codecogs.com/components/equationeditor/equationeditor.php</a></p>
      <p>to get your LaTeX equation and then paste it in LaTeXit (you could also simply use the pdf given by the equation editor, if one of the fonts they provide suits you).</p>
      <p>Michel</p>
