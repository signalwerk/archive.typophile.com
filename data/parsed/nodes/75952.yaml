      <p>It all depends on the context in which @sulin intends to use it, so for all I know, my choices may not be "English Script" enough. Is this for a publication about business or weddings?  </p>
      <p>One could argue that as a modern sans-serif, Whitney is philosophically opposed to any decorative font, but I felt it had enough historical 'soul' (as opposed to Helvetica neutrality) to live with any of my choices. </p>
      <p>What are your choices?</p>
