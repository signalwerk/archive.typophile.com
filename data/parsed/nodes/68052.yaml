    <p>For Immediate Release:<br>
    March 4th, 2010</p>
    <p>P22 announces new releases for March- 2 new fonts by Terry Wudenbachs for IHOF, based on designs from the Nebiolo Type Foundry.</p>
    <p>P22 Slogan is a non-connecting script font that captures the essence of the lettering used in 1950s European advertising. Bold strokes of this brush-drawn face make this design a great choice for both retro design and contemporary work. The font is based on the 1957 design "Slogan" by Aldo Novarese for the Italian Nebiolo Type Foundry. At the time of its original release, it was touted for "striking publicity work". This new digitization accurately reproduces the outlines of the original not found in previous digital versions of this design. P22 Slogan is a non-Pro Opentype font that includes Central European characters.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/slogan_poster_5072.png"></div><p></p>
    <p><a href="http://www.p22.com/ihof/slogan.html" title="http://www.p22.com/ihof/slogan.html">http://www.p22.com/ihof/slogan.html</a></p>
    <p>P22 Nebiornaments contains over 100 ornaments based on the Italian Nebiolo Type Foundry designs of the 1950s. Many of these ornaments are designed to create complex patterns and continuous borders. The simple geometric shapes allow for endless combinations for a wide variety of uses.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nebiornaments_poster_5342.png"></div><p></p>
    <p><a href="http://www.p22.com/ihof/nebiornaments.html" title="http://www.p22.com/ihof/nebiornaments.html">http://www.p22.com/ihof/nebiornaments.html</a></p>
    <p>Prices start at $19.95. For the month of March, Slogan and Nebiornaments are available together in the Nebiolo Combo Pack for the discounted rate of $29.95.</p>
    <p><a href="http://www.p22.com/products/monthly.html" title="http://www.p22.com/products/monthly.html">http://www.p22.com/products/monthly.html</a></p>
    <p>-------------------------------------------------<br>
    Quick View of the 2 new styles available in our newsletter:<br>
    <a href="http://p22.com/newsletter/03_03_10.html" title="http://p22.com/newsletter/03_03_10.html">http://p22.com/newsletter/03_03_10.html</a><br>
