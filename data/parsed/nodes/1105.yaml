    date_raw: 31 Aug 2003 — 2:37pm
    votes: null
    html: "<p>This isn't as interesting as the serif one, but I think it does have a novel variety in the forms (like in the \"bdpq\" bowls, the \"s\", etc.) which makes it worthwhile. Not to mention that nice gentle stroke modulation - which you might actually apply more, like in the top of the \"a\". <br> <br>Super-thin weights are very hard to make even, and you can see problems, like when you compare the \"W\" and the \"X\". <br> <br>Your descenders are long, but in a design like this it might be OK. <br> <br>I think the head of the \"g\" is slightly large. The Tilde is too dark. The \"y\" is great. <br> <br>The only glyphs I have serious problems with are the \"G\", the \"Q\" and the \"R\". But I only have an idea for the last one: try making it open (no middle join to the stem). And I might just leave the \"Q\" like that, since it's such a flamboyant letter anyway. The \"G\" just needs tweaking. BTW, the \"Z\" looks like it's leaning to the right. <br> <br>I like the numerals, especially: that they're short; how sexy that \"2\" is. The \"4\" (especially) and the \"6\" and \"9\" are a bit wide. The \"8\" is great. <br> <br>Other stuff: <br>- That ampersand is great. So is the Pound Sign. And the Section. <br>- I think I'd make the bars of the Yen longer. <br>- The Pilcrow is superb. <br>- The Asterisk is too dark - although you might still leave it a bit darker than the rest, since it's supposed to get attention. <br>- At Sign: I'd use a monocular \"a\". Better for legibility. <br>- ae: I'd unify the mid stroke. <br>- OE: the \"O\" is too weak. <br>- fi/fl: very nice. <br>- Eszet: very nice. Maybe no descender. <br>- ch: the \"c\" is a bit strong. <br>- Agute/Grave accents: I'd place them a little bit more centrally. <br>- Some of the other stuff is too dark. <br> <br>Trapping: everybody knows I love the stuff, but in such a light design (which will almost always be used pretty large) those traps are too big. But in  the heavier weights you want even more! <br> <br>Spacing: I think your overall tightness is very good. <br> <br>hhp <br></p>"
