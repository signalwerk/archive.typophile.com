    html: |-
      <p>For your first one, I recognise that as being from the 6786<br>
      catalogue which was designed by Value and Service<br>
      (<a href="http://www.valueandservice.co.uk" title="www.valueandservice.co.uk">www.valueandservice.co.uk</a>). I know that Value and Service<br>
      very rarely design there own fonts (although they did add<br>
      ligatures to Helvetica). I’ll be working a floor above them in a<br>
      month or so, so I could always ask for you :P, or you could<br>
      drop them an email</p>
      <p>The second one I’m not sure. Looks a like Akkurat<br>
      (<a href="http://www.lineto.com" title="www.lineto.com">www.lineto.com</a>) in the light weight, except most obviously,<br>
      Akkurat has a double storey ’g’ and this does not. But if you<br>
      look at that ’g’ it looks really quite badly drawn, so perhaps it<br>
      is Akkurat Light but with a custom ’g’. The uppercase looks<br>
      very similar. </p>
      <p>Phil</p>
