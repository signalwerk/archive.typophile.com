    date_raw: 8 Dec 2004 — 11:13am
    votes: null
    html: <p>Yves, we are converting our Hell Typefaces archive to OpenType. Most of those typefaces were designed by Hermann Zapf and Gerard Unger. Swift is just part of the general archive, whose fonts will now finally be available in OpenType. Unger's selling of Swift 2.0 is a separate enterprise. <br> <br>On another note, there are several versions of many typeface families within the Linotype Library. Helvetica has Helvetica, Helvetica Neue, and Helvetica Linotype (OpenType fonts optimized for Office use). Palatino also has the old digital version, the Palatino Linotype done for Microsoft, and soon the new Palatino nova. When new releases of old fonts are brought into the library, the old ones normally stay in, too. There are still good typefaces, too.</p>
