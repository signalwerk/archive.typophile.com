    <p>Which typeface do you think suits the whole idea of an agriculture show? The agriculture show has been going on since the 1770’s in the Northwest of England. It is usually attended by the elder generation and people into the farming industries/husbandry skills etc. Although it has started to become into a family day out for all, i still want to target and inform the original target audience in the poster i am going to be using this type for. So what do you think? Which one should I go for?<br>
    PS the patron for the agriculture show is the Queen Elizabeth of UK.</p>
