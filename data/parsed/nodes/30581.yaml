    html: |-
      <p>I live on a farm in the northeast of the U.S., in an agricultural district (one that by our young U.S. standards, is very old — settled since late 1700s.) Somehow the northwest of England feels as if it would be pretty similar in its values and traditions. </p>
      <p>All of the samples you posted feel to me like things that my neighbors would not relate to. They feel elegant, stylish, and “downtown” or “High Street.” </p>
      <p>Seems to me you might try for something with these qualities — earthy, practical, straightforward, strong, not geometric, not modern  — as a way to relate to the fairgoers, rather than thinking about the Queen and going for elegance. But that’s only my Yank interpretation of what your event is all about.</p>
