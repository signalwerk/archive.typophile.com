  html: |-
    <p>I am shopping for a used hot foil stamping machine.</p>
    <p>One thing I'm wondering about: how cross-manufacturer compatible is the type used by these machines? For example, if I buy a Howard machine, can it use type from old Kingsley machines? If so, can the type be mixed or is it only compatible if used separately, due to height differences?</p>
    <p>Pardon the cross-posting with ATypI list. I am guessing that even in these crowds, this is pretty obscure!</p>
