    html: <p>I have been doing some hot foil stamping on book covers and spines (bookcloth) and I would appreciate any comments or information on using foundry type in a hot foil stamping machine.  While the foundry type is softer than that used in hot foil type I think that it would work for small runs, maybe 2 or 3 covers.  I base this on the fact that foundry type, which I understand is lead, has a melting point above 600 degrees while hot stamping requires 300 degrees or less.</p>
