    html: <p>I see indecision.  <br> <br>Adam, your type and your illustration are fighting for attention with neither winning. The logo needs a better sense of hierarchy.  <br> <br>I found both the image and type too generic and open to interpretation.. and therefore a bit weak. You're coming across as 'any guy' rather than as 'that individual'. Don't play safe, try for a stronger expression of that personality you seek.</p>
