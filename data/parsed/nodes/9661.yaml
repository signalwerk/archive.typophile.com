    html: "<p>Hey Adam...  <br> <br>First of - I like the colour green...and the illustration is funny, but if you want to say Illustrations - I would put in more illustration and less type. And speaking of type. To me, Futura is to ordinary and I'm really bored with it. I understand you want it to be more business like - just make the type black and let the illustration speak. <br> <br>Or maybe you could make the type interact more with the illustration - make it part of the illustration maybe? <br> <br>Just a few thoughts... <br> <br>Hey and tjek this guy out: <br> <br><a href=\"http://www.madsberg.dk/\" target=\"_blank\">http://www.madsberg.dk/</a> <br> <br>Good luck</p>"
