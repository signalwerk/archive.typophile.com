    <p>Oh Sheesh!<br>
    I can't figure this one out and would LOVE some help. It's been months that I've been querying this font on the internet. You folks are the best so I'm sure you'll know what it is.</p>
    <p>It's the typeface that is used on the packaging for Diane Von Furstenberg the fashion designer. I think I saw the font used in a project by <a href="http://www.practise.co.uk" title="www.practise.co.uk">www.practise.co.uk</a> that I saw in a book on typography. Of course, going to their site, I couldn't find the font in use BUT discovered another one that I love that was used for their project about Joseph Beuys. Anyone know what that one is as well? </p>
    <p>Thanks so much!<br>
    B</p>
