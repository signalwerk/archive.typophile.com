    <p>P22 Type Foundry in association with Virgin Wood Type announces the release of a completely new wooden version of the Czech Modernist font Preissig Scrape. The bold expressionistic Preissig design is offered as a wood type font to letterpress printers and collectors and is now available directly from <a href="http://virginwoodtype.com/" rel="nofollow">Virgin Wood Type</a>.</p>
    <p>P22 Preissig Scrape was digitized in 1997 by P22 type Foundry from samples of an alphabet designed and hand cut by Vojtech Preissig in 1914 for a book project that was never completed. The book called "The House" featured lino cut illustrations and the lettering reflected the angular and organic lines of the lino cuts.</p>
    <p>In 2010, Bill Jones of  <a href="http://virginwoodtype.com/" rel="nofollow">Virgin Wood Type</a> purchased the original patterns of the American Wood Type Manufacturing Company. After producing a few faces from the American collection, Bill discussed the option of producing a P22 digital font into wood type. <a href="http://www.p22.com/products/czechmodernist.html" rel="nofollow">P22 Preissig Scrape</a> seemed like a design that would translate well back into a format that undermines digital precision and connects to hand creation and hand printing.</p>
    <p>This is the second venture for P22 into analog type. The first project was the 2008 collaboration with Jim Rimmer that featured the first ever simultaneous release of a metal and digital font, RTF Stern Pro, and it proved that there is a serious interest in what some might consider obsolete formats. Stern in metal is no longer available, but the documentary film, <a href="http://www.p22.com/products/makingfaces.html" rel="nofollow">Making Faces: Metal Type in the 21st Century</a>, detailing the process of making that face is now available for pre-order on DVD and select screenings. </p>
    <p>The digital version of Preissig Scrape and the Czech Modernist font set will be available from P22 Type Foundry at a 25% discount for the month through March 31st, 2011.<br>
    http://www.p22.com/products/czechmodernist.html</p><div class="imageWrap"><img src="http://typophile.com/files/PreissigWood_ABCD_5129.png"></div><p></p>
