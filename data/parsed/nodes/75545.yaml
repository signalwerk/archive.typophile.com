    html: |-
      <p>It’s a clever quote and works on two levels:</p>
      <p>1. Friedl compliments Helvetica by suggesting that if one were to be cast away on a desert island (à la the BBC’s <a class="freelinking external" href="http://www.bbc.co.uk/programmes/b006qnmr" rel="nofollow">Desert Island Discs</a> program) and could choose only one typeface, Helvetica would be the one; and</p>
      <p>2. Friedl also hints that Helvetica itself should be banished to a desert island.</p>
      <p>That’s the way I interpret the quote. I could be making s*** up in my head. It happens.</p>
