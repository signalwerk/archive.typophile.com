      <p>Hello, Nick.</p>
      <p>In general the font is ok, although I suppose it is designated for several countries whose alphabet is based on the cyrillic one. Knowing only the Russian alphabet, I was wondering which letters are after the capital Щ and which are the last 3 uppercase letters?<br>
      If after the capital Щ is Ъ, then it was quite difficult to recognize it, for me personally. Because its shape looks more to Б, which is a quite readable letter in your font. But when you meet the Ъ (after seeing Б) it is a bit confusing. Also, it doesn't look like Ь. Shouldn't the design of these 2 letters (Ь and Ъ) be quite similar ? Maybe other users have a different opinion...<br>
      By the way, for which purposes the font is being designed? It takes some effort for me to read the lowercase part.</p>
