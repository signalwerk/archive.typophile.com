    html: |-
      <p>Nick, you have some good advisers here, so do not worry about your blindness:) You will regain your sight :)<br>
      Jan is right concerning the letters н + п. Although п seems quite ok for me, н is indeed difficult to recognize.<br>
      And Maxim gave you a good example of a script font.<br>
      Now, you said earlier, that  the purpose of your font is to be used in advertisement. Is it about one word or few, or a whole paragraph? If it's about the last one, than I have to say that it is quite difficult to read a passage set with your font. It is like a mature hand is learning to write... Which actually, is you, trying to write in Russian. And because its not your native language, of course, it is more difficult than for a native one. Maxim's script is flowing and the letters do not disturb my brain from reading the paragraphs. </p>
      <p>Referring to your font:<br>
      1. What if your characters would be designed with the same or almost the same x-height? Maybe, the reading would be easier than. It depends on your final goal: what you are trying to achieve?<br>
      2. When the height is different between the left and right part of the same character, the reading becomes even more difficult. Take a look at the following 2 words, узнал +улыбку, how the characters are displayed.<br>
      But if you could manage a similar height of characters (nr.1), maybe nr. 2 could be avoided... Again, it depends on how many words will be displayed on the advertisement.<br>
      And by the way, what "character" would you like to give to your font?<br>
      Similar font was designed by Parachute, <a href="http://www.parachute.gr/typefaces/allfonts/libera-pro#Cyrillic">http://www.parachute.gr/typefaces/allfonts/libera-pro#Cyrillic</a><br>
      check all 3 languages: Russian, Greek, Latin.<br>
      You see, the height of letters is different, and even the hight of left+right parts of characters varies sometimes. Of course, you are not going to read whole passages set with this font, but in Greece it became extremely popular in ad sector. It is widely used for packages. Even, during local elections, the banners were displayed with Libera.</p>
