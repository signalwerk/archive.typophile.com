    html: |-
      <p>Dear Nick,</p>
      <p>1. The letters above could be one variant. Do me a favor, please, and try to make Ъ based on your first displayed Ь. And leave Б as it is in the first version. I like the bowl of first Ь much more than the second one.<br>
      2. Text in Russian (have in mind that I substituted 2 letters, ь-ъ е-ё because I cannot find now a text containing them, thus some words are displayed intentionally wrong ):<br>
      Окончив газету, вторую чашку кофе и калач с маслом, он встал, стряхнул крошки калача с жилета и, расправив широкую грудь, радостно улыбнулся, не оттого, что у него на душе было что-то особенно приятное, — радостную улыбку вызвало хорошее пищеварение.<br>
      Но эта радостная улыбка сейчас же напомнила ему все, и он задумался.<br>
      Два детские голоса (Степан Аркадьич узнал голоса Гриши, меньшого мальчика, и Тани, старшей дёвочки) послышались за дверъми. Они что-то везли и уронили.<br>
      — Я говорила, что на крышу нелъзя сажать пассажиров, — кричала по-английски дёвочка, — вот подбирай!<br>
      «Все смешалось, — подумал Степан Аркадьич, — вон дети одни бегают». И, подойдя к двери, он кликнул их.<br>
      3. 1. Uppercase П is just fine, lowercase...hm... I've seen it like this too, but you can make it like the capital one. Would be more reliable.<br>
      3.2. Yes, maybe lowercase г is too much like uppercase. I usually make it like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/g_4949.png"></div><br>
      3.3. Л - just fine. It is a matter of taste. Why you do not like it?<br>
      3.4. ы, у ... yeah, but since it is a script font, why don't you make several versions of letters and they could be used randomly within the text. That is to say, in a paragraph you could have 2 different ы or у and thus you reinforce the meaning of a script font.<br>
      3.5. Cannot express my opinion about Serbian, but surely there is no need to restrict yourself. Include Serbian too and talk to some other people about it.<br>
      4. "Should the П and Л have a crossbar at the top between the two vertical stems?"<br>
      What do you mean? Show me an example, please...<p></p>
