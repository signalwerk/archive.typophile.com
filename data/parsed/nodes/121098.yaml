      <p>Hi Tatiana, thanks for your feedback. Yes, the letter after the capital Щ is Ъ. I have now based the shapes of Ъ and Ь on the Б as you said that was the most readable:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cyrb's_6220.png"></div><br>
      Are these better?<p></p>
      <p>It would be a great help if you could paste a paragraph containing all Russian Cyrillic characters (if that's possible) if you post again, then you would be able to see how characters look in the context of words. </p>
      <p>Somebody else said "Very odd П, г, н, ь, ъ &amp; I don't really like Л, ы, у. The Serbian letters are incorrect. Because it's a script, it must either have Serbian cursive alternates for г, п, т, ш or have no Serbian glyphs at all, just not to confuse people."</p>
      <p>Should the П and Л have a crossbar at the top between the two vertical stems? I've looked through many handwriting samples and all that I have seen are shown without.</p>
      <p>This is going to be used for advertising. Thanks for your help.</p>
