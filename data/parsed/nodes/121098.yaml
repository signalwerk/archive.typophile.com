      <blockquote><p>More importantly can you read it, and does it look OK to you?</p></blockquote>
      <p>For the conventional lower-case patterns take a close look at the script fonts offered by <a href="http://www.paratype.com/asearch/default.asp?ftype=SC&amp;ffoundry=PT&amp;enclang=lang&amp;flang=64&amp;page=3">ParaType</a>). Segue Script (© Microsoft) is not bad either, although, I suspect, too plain for your liking.<br><img src="/sites/default/files/old-images/Segoe_Script_6561.gif"><br>
      However, all of them, except two — Propisi and English 157 — feature calligraphic (not vernacular) or non-cursive, print-style capitals, which is something you don’t want. </p>
      <p>For the generic, standard upper-case cursive forms check out Propisi, English 157, and—surprise—ITC True Grit. They all follow the same basic pattern.<br><img src="/sites/default/files/old-images/1960s_Soviet_School_Hand_3412.gif"></p>
