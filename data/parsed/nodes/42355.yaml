    <p>I just noticed that I am a Typophile member for 6 years, now. Woohoo.<br>
    Oh, how time flies, if you are having fun. ;) So this is my tribute to Typophile after some 6 years on here. (More ore less frequently.) I still love this place and the kindness of a lot of people on here is breathtaking. So with respect and thankfulness I celebrate my 6th anniversary. ;)</p>
    <p>Dav(id)</p>
