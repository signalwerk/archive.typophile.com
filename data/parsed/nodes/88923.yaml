  html: <p>I'm a Windows 7 / Word 2010 user working on a book project. While there are many excellent text fonts out there, most look fairly bad in Windows. I'm attempting to find some suitable text fonts that are hinted for Windows so that they'll look as good on the screen as they do on paper. I've looked through all the text fonts included with Windows / Word, but none quite fit the bill. In a perfect world, I'd be able to find some nice humanist slab serif. Any suggestions would be greatly appreciated.</p>
