    html: <p>The display issue is likely related to font format, rather than hinting per se. The Windows GDI PostScript renderer is about fifteen years old and is generally very poor for rendering text size. So PostScript fonts, whether Type 1 or OpenType format, will tend to display badly at text sizes on screen in most Windows apps. [The newer DWrite rendering is much better, but only found in some recent applications, e.g. IE9.]</p>
