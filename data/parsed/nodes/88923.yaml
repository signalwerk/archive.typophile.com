    html: |-
      <p>I don’t see anything about Postscript in his post, John. </p>
      <p>Both FF Ernestine and <a href="/wiki/https%3A/%252Ftypekit.com/fonts/ff-tisa-web-pro" class="freelinking" rel="nofollow">FF Tisa</a> are humanist slab serifs offered by Fontshop in Truetype format, hinted for recent Windows versions. If you want consistent good* looking text in Win XP (recent means anything after this) as well, you need a lot of Truetype hinting. </p>
      <p>* Good is a relative term with such a course pixel grid and only black and white or grey pixels.</p>
