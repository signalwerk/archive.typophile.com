      <p>Look at the letters, which were designed to produce good results at a small point size.</p>
      <p>Now, Matthew Carter was commissioned many years later to make the FrankReuhl design for special use for a Varityper photo-typesetting machine or an earlier non-Linotype machine. This version of Linotype Frankrul was fascinating, because it combined many of the features and nuances of the three Linotype designs into one design.</p>
      <p>I digitized that in 1989. I haven't found this yet, though my customer has it.</p>
      <p>Notice that the left side bottom, leg of the Aleph is lifted up a bit by the bottom of the heel. This was a master type design, for it cause the eye of the reader to advance. This is known as good eye movement.</p>
    html_clean: |-
