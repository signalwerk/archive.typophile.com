      <p>There are no legal issues according to secular laws anywhere.</p>
      <p>I used to spell the Reuhl part with the 'u' before the 'e' years ago, but most people had a pronunciation problem with Ruehl, making the 'h' too distinguished, as 'rue-hl' versus 'reuh-l'. Plus, others spelled it 'Reuhl'. So, I conformed.</p>
      <p>I would like to see Carl Friedrich Ruehl's typefaces.</p>
      <p>In truth, today the punch-cutter contribution is meaningless. We keep Carl Friedrich Ruehl's name for history's sake.</p>
      <p>Do you have Frank (or Fronk)'s drawings before Ruehl created type from them?</p>
      <p>---</p>
      <p>The logo is very good. The eye sees it, and identifies the person with the blog post quickly. It was just difficult at first to put two and two together, as we say. Likely, I will from now on.</p>
