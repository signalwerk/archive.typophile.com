      <p>This why I am confused. The name of the punch cutter was Carl Friedrich Rühl - so to avoid the umlaut, we would write Carl Friedrich Ruehl and the complete name of the company was »C. Rühls Schrift- und Stereotypen-Gießerei, Stempelschneiderei, Xylographie und Galvanoplastik« (impressing, isn't it?).<br>
      So Reuhl makes no sense... The punch cutter also made some other typefaces... </p>
      <p>But, by the way. The font is written פרנק-ריהל in hebrew, it should be פרנק-רויל(Reuhl) otherwise ;-)</p>
      <p>So, I had the impression, it is called Frank-Reuhl to avoid any legal issues.</p>
