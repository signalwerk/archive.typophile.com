    html: |-
      <p>Frank-Reuhl is a composite name of two people: Frank, the type designer, and Reuhl, the punch-cutter (the one who implemented the design into metal type, by cutting the metal into a punch - a skill no longer needed or even known how to do well. Often, the talented punch-cutter modified the design a little, so the type would print better.</p>
      <p>Frank-Reuhl had different names given to it by different vendors. Today, we have many different designs of Frank-Reuhl. To make referring to them, I have slightly modified their spelling to correctly identify them all.</p>
      <p>If you look in a different blog in this section, you will examples of Mr. Frank's original design. I implemented it in the 1987 in PostScript Type 3, but can not find it. Most Frank-Reuhl designs come from the fifties, sixties, or seventies.</p>
      <p>Linotype did the most innovative work about forty years ago, by creating size specific versions of Frank-Reuhl (and Times-Roman), I believe by Matthew Carter, the great type designer.</p>
