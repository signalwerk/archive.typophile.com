      <p>Linotype-Merganthaler created a series of Frank-Reuhl typefaces, specific to different point sizes. Since the advent of PostScript and scalable font technology, point specific designs have disappeared from the realm of typography.</p>
      <p>GoHebrew is reviving point specific designs. Here is an example of GHB Lino-Nine. GH stands for GoHebrew. B stands for Biblical Hebrew: dagesh, nikud, meteg, and taam. Nine is for nine points.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ruth - GHB Lino Nne v1_3821.jpg"></div><p></p>
