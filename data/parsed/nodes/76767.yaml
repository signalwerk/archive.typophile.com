      <p>Another popular version of Frankrul was designed for computer-based typesetting, by the now defunct Varityper corporation, makers of expensive mini-computer based phototypesetting equipment. Typefaces were held on discs, and projected by a lens-attached camera and light sensitive film.</p>
      <p>Although the company disappeared, another new design of Frankrul exists today.</p>
