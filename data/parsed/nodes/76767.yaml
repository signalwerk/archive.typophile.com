    html: |-
      <p>John,</p>
      <p>I work from originals that came from photocopies of small 9 point type, photo-enlarged about x 15 +/-.</p>
      <p>But the melted chocolate was not that thick.</p>
      <p>The intent of the designer was that the descending element was similar to the thick horizontal bar of many other letters, such as the samech and the peh.</p>
      <p>The thickness, more than the thickness of the horizontal bar of other letter may be attributed to ink spread.</p>
