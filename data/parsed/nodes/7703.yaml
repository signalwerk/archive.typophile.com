    html: '<p>In <span class="caps">UTF</span>-8 the following are the html character codes for various hands (note, this probably won’t display in <span class="caps">IE</span>… Gecko based browsers won’t have a problem) <br>&amp;#9754;  <span class="caps">BLACK</span> <span class="caps">LEFT</span> <span class="caps">POINTING</span> <span class="caps">INDEX</span> <br>&amp;#9755;  <span class="caps">BLACK</span> <span class="caps">RIGHT</span> <span class="caps">POINTING</span> <span class="caps">INDEX</span> <br>&amp;#9756;  <span class="caps">WHITE</span> <span class="caps">LEFT</span> <span class="caps">POINTING</span> <span class="caps">INDEX</span> <br>&amp;#9757;  <span class="caps">WHITE</span> <span class="caps">UP</span> <span class="caps">POINTING</span> <span class="caps">INDEX</span> <br>&amp;#9758;  <span class="caps">WHITE</span> <span class="caps">RIGHT</span> <span class="caps">POINTING</span> <span class="caps">INDEX</span> <br>&amp;#9759;  <span class="caps">WHITE</span> <span class="caps">DOWN</span> <span class="caps">POINTING</span> <span class="caps">INDEX</span> <br><br><span class="caps">ON</span> <span class="caps">PREVIEW</span>: Turns out the forum software doesn’t allow character codes. You’ll have to test it for&nbsp;yourselves.</p>'
