  html: <p>Hi <br> <br>I was wondering if anyone knows the name of the pointing hand icon which appears in some fonts. I visited a museum in Italy last week, and I was surprised to see these pointing icons used in a book from the 16th century. <br> <br>Anyone know the history of this symbol? <br> <br>Thanks <br> <br>Jim</p>
