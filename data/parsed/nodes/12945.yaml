    html: |-
      <p>Do a search for “wood type” on myfonts.com. Here are a few other ideas (sorry but don’t have time to link these):<br>
      - Rosewood (Adobe) although it’s overused it’s still great<br>
      - Brothers or Council (Emigre)<br>
      - Egyptienne Condensed<br>
      - good ’ol Clarendon</p>
      <p>Also keep in mind that when you say “country” it could mean a lot of things. There’s a big difference between Hank Williams (classic country) and Shania Twain (contemporary). I’m blowing hot air a bit here since I don’t listen to, or care for country music. I do however live in Nashville. Good luck.</p>
