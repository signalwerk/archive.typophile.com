      <p>It can go either way. I did a piece for Vince Gill and he hated the obvious choices: Rosewood, etc… He ended up wanting a nice serif. I recently did a piece for Tracy Byrd and it was filled with the Rosewoods of this world. So it really depends on the artist and what they want to represent themselves as…<br>
      peace</p>
