    <p>The theme is 1967/1968 gangster. Imagine a very Brigitte Bardot/Faye Dunaway looking girl against the door of an Astin Martin, quietly holding a gun. Think gangsters, elegant, British...</p>
    <p>What I am looking for are typefaces that would be evocative of this—work in this period. Of course, the 1930’s Bonnie &amp; Clyde visual comes to mind, but I am looking for something more late 60’s.</p>
    <p>Any ideas or suggestions?</p>
