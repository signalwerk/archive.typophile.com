      <p>&gt; A lot of the gangster aesthetic after a certain point was gaudy, retro pastiche, rather than distinct style</p>
      <p>Right Chris, I don't recall Brit gangsters being a media thing in the 60s, apart from the Krays, who were too close for comfort. Speaking of whom, David Bailey, another East End lad, had photographed them in the mid 60s. He also shot the Stones, so that gives me a mod, Compacta/Impact vibe. The Krays were hardcore psycopaths, and once the full nature of their crimes became apparent in court (eg slicing off people's faces), their glamour disappeared (for 20 years, at least). Get Carter is an awesome film, but after the 60s. There is a definite fault line there, somewhere around the Beatles breaking up.  I think the Get Carter typeface in its poster is Gill Kayo.</p>
    html_clean: |-
