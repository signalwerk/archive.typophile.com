      <p>Nick,<br>
      You are right about the Get Carter typeface on the original poster (I was looking at a video cover which used Eurostile which at least is of the period and stylish). But I don't think anyone would expect a gangster to be equipped with an Aston Martin or Bardot, while Carter had a Jag and Britt in 1971 not that far from 68. A more obvious reference would be the Italian Job (attractive cars and women) which was made before the need for an identity was regarded as a necessary marketing tool to a movie – the original British poster was a blocky almost constructivist sans, while another British one was almost Brody-esque and the American one looks like a Didone.<br>
      BTW Avant Garde was produced in the early 1970s wasn't it?<br>
      Tim</p>
