    html: |-
      <p>I can't speak to its availability as a glyph (although I suppose you could make one with a "c" and a macron), but I do know that it comes from the Latin <em>cum</em>.</p>
      <p>Similarly, you sometimes see in the medical field s-macron, meaning "without," from the Latin <em>sin</em>. There's a whole world of interesting medical shorthand, including <em>OS</em> ("left eye") and <em>NPO</em> ("nothing by mouth").</p>
      <p>vv<br>
      J.O.</p>
      <p>Nai tiruvantel ar varyuvantel i Valar tielyanna nu vilya.</p>
