  html: <p>I remember my mother using a symbol in handwritten correspondence that looked like a lower case c with a horizontal line over it that I understood to mean "with". Is this a fanciful reconstruction on my part? Is it part of any standard character set? Here's some <a href="http://tfisf.com/extra/with.png" rel="nofollow">context</a>.</p>
