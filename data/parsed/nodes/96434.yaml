    <p>Hi All!</p>
    <p>I met this beautiful, condensed italic font (serif, but not very much) in my (previous) paperback edition of [The Design of Everyday Things] (wonderful book, BTW); but I cannot exactly identify the font.</p>
    <p>I've posted the question @ the WhatTheFont forum (myfonts.com), and got the answer I'd suspected I'd get: Palatino. Admittedly, the font looks very much alike, but there are some big differences...</p>
    <p>Cutting to the chase, here is some imagery:</p>
    <ul>
    <li><a class="freelinking external" href="http://kelleyvanevert.nl/scratch/everyday-things-font/" rel="nofollow">http://kelleyvanevert.nl/scratch/everyday-things-font/</a>, Some pages of the book, stolen from Amazon (see every page but the first..)</li>
    <li><a class="freelinking external" href="http://kelleyvanevert.nl/scratch/everyday-things-font/diff.png" rel="nofollow">http://kelleyvanevert.nl/scratch/everyday-things-font/diff.png</a>, Major differences between italic Palatino and my italic font: capital M, lower f. Furthermore, the forms are less pronounced, and for example, the lower s is simply more "squiggly" than italic Palatino..!</li>
    <li><a class="freelinking external" href="http://kelleyvanevert.nl/scratch/everyday-things-font/elements.png" rel="nofollow">http://kelleyvanevert.nl/scratch/everyday-things-font/elements.png</a>, The first of the three versions of the italic Palatino font, as found in [The Elements of Typographic Style], page 226, looks much more like my font than others..</li>
    </ul>
    <p>BTW, after inspecting the book some more, I found that the italics in the new introduction don't exactly match the italics in the rest of the book (seen in above image). It indeed looks more like italic Palatino.</p>
    <p>So what's happening here? I'm no font expert (far from), but I know common fonts like Palatino, having been around for some time, have some differences when digitized by differenct foundries, and probably even some historic differences. Am I looking at an older "version" of Palatino?, or is it simply another font?</p>
    <p>I'm pretty much blown away by the elegance of this italic font, I love the simplistic lower f, the parallel capital M, the general "squiggliness" and condensedness when placed between "normal" roman Palatino. ...so I'd really appreciate any help identifying it! How wonderful would it be to be able to use it myself :)</p>
    <p>Cheers! -- Kelley van Evert</p>
