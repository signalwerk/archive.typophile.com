    <p>Hi Everyone,<br>
    I'm helping a new Church with its logo, brochures, etc. I'm looking for a font that has just a "hint" of celtic design to it. Most of what I've seen, i.e. Jana Thork, Libra, Carolina, etc. are too much for what I want. Do you have any suggestions?</p>
