    html: <p>It could have been made from Avenida, which has the flattened stroke endings (see <a href="http://bowfinprintworks.com/BauhausFaces6.html" target="_blank">Bauhaus Guide</a>), creating the A from an inverted V and backing the arms of the E into the stem (using outlines in a graphics application). BTW, notice how much Font Diner's 'Guest Check' looks like Newport Classic with the G chin height changed?</p>
