      <p>I doubt that Viva is a font. I think it's hand-drawn lettering.</p>
      <p>However, I searched at MyFonts using 'brush-drawn' as the search term and found a list of candidates that are bold and spontaneous looking: (I did not make links, sorry)</p>
      <p>James Paul, Water Brush, Zar Brush, Zar2 Casual, Kolker Brush, TXT Brush Script, Street Brush, Mustang, Alpine Script, Tasty and Pronto.</p>
      <p>- Mike Yanega</p>
