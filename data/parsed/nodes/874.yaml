  html: <p>Hello. <br>This isn't exactly a typographic composition, but I didn't know where to put it, so here we go; <br> <br>I created a targeted portfolio for a job I wanted... Now it seems I will not be getting the job as I haven't even got a reply for approximately 2 weeks, but that's just the way life is I guess :-] <br> <br>So, I'm looking for comments as I didn't get any from her, just tell me if it's any good or if it's worthless... Or maybe a bit more indepth if you have the time. <br> <br>By the way, the text is in Swedish unfortanly, but the images are still there. You get to the portfolio from the last link on the first page. <br> <br><a href="http://www.radarteam.se/annika/index.html" target="_top">http://www.radarteam.se/annika/index.html</a> <br> <br>Thank you!</p>
