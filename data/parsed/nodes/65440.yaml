    <p>Like "Refused" said in their song "The Shape of Punk to come", Oblik could be "The Shape of new Fonts to come", we present you our uprising star - Oblik - that could shine in your monitors. </p>
    <p>Modern family, stylish and secure, with it's own personality (it's photogenic, too), available for all kind of use, even you're an doctor or policeman or butcher or truck driver or maybe rock star, this font will rock your world. </p>
    <p>A few of them are left in the stock ;)</p>
