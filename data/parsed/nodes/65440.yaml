      <p>Wow. :)</p>
      <p>@ Nick - I know what you think. Maybe. But "obli" means on Serbian "rounded" (he is rounded, male 3rd person) and "obli" + "k" = Oblik = on Serbian means "Shape". Even it's not meant to be sold on Serbian market, we're still Serbians and we would like also to have our font names sound "readable" on English and Serbian at the same time, even if they probably can't have same meaning on both language.<br>
      P.S. - Now we have Italics also :) </p>
      <p>@ Refused fans - Maybe I didn't, but that's just little play with words.. "The Shape of new Punk to come" into "The Shape of new fonts to come" &gt; Shape = Oblik = name of font on Serbian = it doesn't have to be so damn smart or logical, it's just what I had in head then and found small similarities between an micro foundry and an cult underground band fought for it's values.<br>
      Can it go now? :)</p>
