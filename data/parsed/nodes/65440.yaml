      <p>You didn't sound rude.</p>
      <p>Well the whole idea of "The Shape of Punk to Come" was that "punk" of their era was becoming completely mainstream; that is, they were defeating the entire idea and purpose of "punk." Their album was a step in a different direction in music of their time, especially of that in the same genre. I think we both mentioned it because the idea around their title was hugely metaphorical and this instance here strips it of that significance. :)</p>
      <p>Congrats on the release, btw.</p>
