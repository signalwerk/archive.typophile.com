    html: |-
      <blockquote><p>An Apple discussion group says some homemade fonts are having problems. A suggestion is: "OpenType fonts should have a UTM setting of 1000. These were at 2048. So I changed those and had FontLab Studio rebuild the names"</p>
      <p><a href="https://discussions.apple.com/thread/6605691" title="https://discussions.apple.com/thread/6605691">https://discussions.apple.com/thread/6605691</a></p>
      <p>And as bojev mentioned, check for application updates.</p></blockquote>
      <p>Sorry, this isn’t entirely accurate. It has nothing to do with whether fonts are ‘homemade’ or not. An units per em (upm) other than 1000 is perfectly valid for OpenType fonts. In fact, it can have any value between 16 and 16384. There are a number of fonts from FontFont and Adobe which use 2000 upm.</p>
      <p>Changing the upm in FontLab will scale the glyphs and lead to distortions in the outlines. (There was probably a good reason why the type designer needed a higher resolution in the first place.)</p>
      <p>I can’t imagine what effect ‘rebuilding the names’ should have on this issue.</p>
      <p>Application updates can’t change this (unless applications switch to their own font rendering engine). It’s clearly a bug in Mac OS X and will probably be fixed in the next system update.</p>
