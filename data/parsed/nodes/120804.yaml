  - id: 597778
    user: 1043
    date: 2015-01-21T12:15:00
    date_raw: 21 Jan 2015 — 12:15pm
    votes: null
    html: <p>You should be able to run it in Sheepshaver (<a href="http://sheepshaver.cebix.net" title="http://sheepshaver.cebix.net">http://sheepshaver.cebix.net</a>), which is an open source emulator that lets you run older Mac OS's. It's a little hacky, but I've used it to run old apps in Mac OS 8.x on recent Apple hardware. Runs very fast compared to vintage Mac hardware and it's pretty easy to get files in and out of it. It lets you choose a folder on your modern Mac that shows up as a volume in the emulator. I used it recently to make PDFs from 20-year-old PageMaker files (don't ask).</p>
