      <p>Yes, the upm issue is known, and from what I understand folks at FontFont are communicating with Apple’s type team about this. Luckily, only a very few FFs actually have 2000 upm, but still, it is something that we hope Apple addresses immediately.</p>
      <p>I upgraded about a week ago on my desktop machine and my macbook. So far no issues; FAP, at work, works as usual (with the upgrade they pushed out the same day as Yosemite rolled out); Font Explorer, at home, is running like a charm. Indesign and other CS/CC seem to be functioning perfectly, and I'm not having any issues (other than a number of embed problems with collisions between licensed &amp; bundled versions of Helvetica, which is something that's been plaguing me for several years) in terms of type in our PDF workflow.</p>
      <p>In fact, I'd say that Yosemite sped up the launch, save, print and various operations speeds in the Adobe apps pretty significantly. The only thing that has slowed down is Outlook.</p>
      <p>JLT</p>
