    html: |-
      <p>I have pretty much saved every digital file I've created. I'm not totally sure why, but it doesn't take up much space. Less and less space as the years go by, in fact. It's fairly well organized, so I can always find things.</p>
      <p>The PageMaker files were two documents I made for my 20-year class reunion in 1994. I had my 40-year reunion this last summer and thought it would be fun to show them to my classmates on an iPad. The files were PageMaker 3 format, so it went like this: Open in PM 3 and make sure all fonts are installed; open in PM 4.6 and save in that format; open in PM 6.5 and save as PostScript (.ps); transfer to modern Mac, open in Preview and export as PDF. There may have been fewer PM steps, but it worked great.</p>
