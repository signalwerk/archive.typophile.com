      <p>I do Prepress for Publishers and Typography, so applications have to be always on the latest versions.<br>
      OSX 10.10 also moved us to Cloud Apps, which crapps out whenever TWC goes out as we are in TWC Wasteland and Service is Terrible.  On 10.10 working in Indesign, any Font to be used first get's culled from Typekit (purchase), as we have a decent collection of Fonts (Licenced!) including designed ones<br>
      it become obvious that before opening a cloud app, load the Fonts to be used into a Font application (Fontbook, Suitcase, Fontexplorer Etc.) before opening the App. otherwise you end up purchasing Fonts already owned.<br>
      We have software (Apps etc.) you can't take up to 10.10, so they have their own system and stay that way.<br>
      (Proprietary Color separation software on OSX 10.5, RIP"S on XP and older TEXWARE on OS9.2 and 10.5). OpenFiles, save and juggle between the systems.</p>
      <p>Ludwig</p>
