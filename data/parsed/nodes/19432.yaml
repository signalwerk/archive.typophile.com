    html: |-
      <p>There is not only <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_scala_ot_regular/?acs=1">Scala OT</a>—which is an enhanced OpenType version and combines a number of the dated postscript fonts, e.g. expert (arrows, ligatures, …), lining figures, small caps in one single font, with intelligent linking; but also <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_scala_pro_regular/?acs=1">Scala Pro</a>—which is an even more extensive font, also in OpenType format, with additional language support.<br>
      You don’t need the latter if you don’t have to deal with Baltic, Central European or Turkish text.<br>
      (Same goes for the Sans, of course.)</p>
      <p>See also <a href="http://www.typophile.com/node/36876">this thread</a>.</p>
