      <div class="comment-spam-body"><p>Haas Caslon Swash Capitals, as shown in Jaspert's Type Encyclopedia of 1970,  appear to be a match for "LES PARISIENNES DE KIRAZ."<br>
      There are several digital Caslon swash italics that are similar but not a match:<br>
      <a href="http://www.myfonts.com/fonts/adobe/caslon/italic/glyphs.html" rel="nofollow">Adobe Caslon Pro Italic</a>.<br>
      <a href="http://www.myfonts.com/fonts/itc/caslon-italic-and-swashes/caslon-italic-swashes/" rel="nofollow">ITC Caslon Italic Swashes</a>.<br>
      <a href="http://www.myfonts.com/fonts/letraset/caslon-italic-with-swashes/italic-with-swashes/" rel="nofollow">Caslon Italic With Swashes LET</a>.<br>
      <a href="http://www.myfonts.com/fonts/urw/caslon-no-540/caslon-no540-swash-d-italic/glyphs.html<br />
      " rel="nofollow">URW+++ Caslon No540 Swash D Italic</a>.<br>
      <a href="http://www.myfonts.com/fonts/urw/caslon-no337/sc-t-italic/glyphs.html" rel="nofollow">URW+++ Caslon No337 Italic</a>.<br>
      Don</p>
      </div>
