    html: |-
      <p>For a historical perspective, Harry Carter gives the following in a note to his translation of Fournier.</p>
      <p>"To satisfy the eye a 6-pt. o has to be about one-eighth taller than the x, a 12-pt. one-twelfth, a 36-pt. one-fifteenth, and a 72-pt. one-eighteenth. The amount of difference required varies with the degree of the extension of the type and the shape of the shading." [<cite>Fournier on Typefounding</cite> p. 148 note]</p>
      <p>But I've never done an extensive survey to see how these numbers jibe with current practices.</p>
      <p>-- K.</p>
