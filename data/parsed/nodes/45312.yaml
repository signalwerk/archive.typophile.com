    html: |-
      <p><cite>The flatter the top/bottom curve is the smaller the overshoot.</cite></p>
      <p>That's why I recommend to look at the width of the overshoot, not the height/depth.<br>
      If you make the overshoot about 1/4 or 1/3 of the glyph width you will usually get a good result, whether the curve is flat or narrow. Typically works for me.</p>
      <p>However, you always need to judge visually, there is no way to pass that responsibility on to a mathematical rule.</p>
      <p>To answer the initial question: normally two categories, but with exceptions (rather than a third one).</p>
