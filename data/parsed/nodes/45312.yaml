      <p>I just checked Briem and my memory was off. It is greater than 2-3% according to him:</p>
      <p>"How much [overshoot] depends on the design. In Times Roman, the letter o is 4% higher than the letter x. ... The letter o in Courier and Helvetica is 7% higher the the letter x,"</p>
      <p>In the font I am working on the lower case o is 4% taller than the x.  The O is 3% taller than the H. I went by looks rather than a rule; I did compare a number of fonts I like, though. </p>
      <p><a class="freelinking external" href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_6.pdf" rel="nofollow">Mark Jamra has a nice discussion</a> of these issues. He reports that Peter Karnow in testing found that most people put a circle that is 3% greater diameter as the same size as a square.</p>
