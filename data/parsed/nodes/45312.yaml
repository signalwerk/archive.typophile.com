    <p>In <a class="freelinking external" href="http://typophile.com/node/44841" rel="nofollow">another thread</a>, William Berkson wrote:</p>
    <p><em>For example, generally, overshoots are said to work in the 2-3% range. But it is also argued that they should be different for bold characters and pointed characters. And Matthew Carter has said that he generally thinks that the S needs slightly less overshoot to look balanced.</em></p>
    <p>An overshoot question for type designers: within a given font<br>
    Do you stick to two heights in your designs (one for flat and one for curved/pointed);<br>
    Or do you use three (flat, curve, and pointed);<br>
    Or do you break it down further?</p>
