    html: <p>The flatter the top/bottom curve is the smaller the overshoot. Bold cuts are wider, thus the top/bottom curve is flatter than the thinner cuts, and the overshoot should thus be smaller. On the pointed ends I usually print out a waterfall and adjust until it looks right.</p>
