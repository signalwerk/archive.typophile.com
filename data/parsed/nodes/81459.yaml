      <p>It’s a logo made by Laura Meseguer based on <a href="http://www.type-o-tones.com/fonts.php?id=42" rel="nofollow">Poster</a> designed by Iñigo Jerez.</p>
      <p>[EDIT] See <a href="http://fontsinuse.com/typomag/" rel="nofollow">here</a>.</p>
      <p><em>The typeface, by fellow Spaniard Iñigo Jerez, is available from Meseguer’s foundry Type-Ø-Tones, and a Display version inspired by the TypoMag logo will be available soon.</em></p>
