      <p><cite>As to the MS Word updates - I couldn’t even install them!<br>
      They didn’t recognize the existing MS Word 2008 on my hard drive.</cite></p>
      <p>Vivicity, is Word installed in the Applications folder of your boot drive? I keep it installed in a "Programs" volume and the updater won't recognize it unless it's in the Applications folder. You can simply copy your installed copy there, update, then move it back to where you normally keep it.</p>
      <p>If that isn't the situation, sorry, that's the only work-around that popped into my head.</p>
