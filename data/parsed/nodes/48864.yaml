      <p><cite>MS really seems to be purposefully sabotaging its Mac applications software...</cite></p>
      <p>Honestly...I don't think so. MS is profit driven just like any other company. If they really wanted to undermine Mac users they would stop investing in Mac app development and embargo our side of the world. It is simply a bug that they still have to squash.</p>
      <p>I experienced it recently as well. I'm developing a family of fonts. I found that with the Demi and Demi Italic faces loaded Word displayed Demi in the font menu but not Demi Italic. (I felt like I'd stepped into Windows for a second, since that is the norm there.) If I typed Demi Italic into the listbox in the formatting palette (as ryanholmes suggested) I could access it just fine, but I could never access it without manually typing it in. I edited my font changing only the name from Myfont Demi and Demi Italic to Myfont Medium and Medium Italic. It now shows up properly in Word's font menu.</p>
