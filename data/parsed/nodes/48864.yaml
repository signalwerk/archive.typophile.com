    html: |-
      <p>I would de-activate the font in Suitcase and test the font in the system directly. Place the font files in /Users//Library/Fonts/. Run a font utility like Font Nuke and restart your system. Then test to see if it still fails. </p>
      <p>Font Nuke<br>
      <a href="http://www.versiontracker.com/dyn/moreinfo/macosx/29757" title="http://www.versiontracker.com/dyn/moreinfo/macosx/29757">http://www.versiontracker.com/dyn/moreinfo/macosx/29757</a></p>
      <p>I've encountered a couple of old Mac font-suitcase based TrueType fonts that seem to not work in Word 2008. I can tell this is an application-level issue (in my case) because the fonts appear in other applications. I think TextEdit.app is a useful baseline application to determine if Mac OS has the font active. You might also want to test the fonts with FontBook's Validate Font File feature. </p>
      <p>If this is a font that you have licensed, you should consider contacting the vendor. They probably have a better chance at determining whether this is a problem with the font itself or the application. They may also be able to recommend a workaround.</p>
