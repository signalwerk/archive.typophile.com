    html: |-
      <p>I recently posted a similar problem with Word 2008. After doing a LOT of research, the conclusion seems to be this is a known bug in Office 2008, and the MS people do not seem terribly concerned with fixing it. The problem is NOT with your font, so don't bother your font vendor, your problem will not get solved. The Word/Office 2008 font menu problem is not a function of format either--it occurs with T1, TT and OTF fonts.</p>
      <p>If you know the actual filename of the font, you CAN still access it in Word. Using the listbox in the formatting palette, type the entire font file name, hit return, and bingo--it will apply the font to the text you have selected in your document. For example, if you have the T1 font "XYZ Medium Italic" on your system, with postscript file name "XYZ-MediumItalic", type that in the listbox and it will work, even though it does not show up in Word's font menu.</p>
      <p>Unfortunately, the font menu won't remember this trick, so if you need to repeatedly apply this font, either (a) put the cursor in a text block where you have already applied the font, do a copy:format, and then do a paste:format to the new text where you wish the "invisible" font to be applied, or (b) create a style in Word with the affected font, give it a name and save it, and then apply that style whenever you wish to use the invisible font.</p>
      <p>A real pain in the arse, but this IS Microsoft we're talking about.</p>
