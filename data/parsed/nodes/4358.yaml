    html: "<p>I'm not aware of any written work by Robert that really deals with the 'typographic polyphony' topic, although there are some examples of his attempts to produce such work, e.g. his poem for several voices <i>The blue roofs of Japan</i> and the more recent <a href=\"http://www.chapters.indigo.ca/item.asp?N=35&amp;R=1559107&amp;act=A03&amp;Item=978189403166&amp;Section=books&amp;Catalog=Books&amp;Lang=en&amp;mscssid=XV4TWKKWJNRQ9K58LTL93AW2R1XF2W0C&amp;WSID=130497E96690691842A2A72FDFB184E370153120\"><i>Ursa Major: A Polyphonic Masque for Speakers &amp; Dancers.</i></a> I've not seen anything online.</p>"
