    html: "<p>Robert Bringhurst has an abiding interest in what he calls typographic polyphony, i.e. the representation of multiple, simultaneous or contrapuntal voices in type. It is difficult to do convincingly, as Robert is the first to admit, largely because reading is an isolating process. Polyphonic texts are appreciated only as wholes: as soon as one starts to read the polyphony stops, as when one tries to pick out a particular instrument or voice in polyphonic music. That said, poly-typographic compositions can be visually very dramatic and exciting. One of my favourite such images, which Robert shows in some of his illustrated lectures, is of a heavily graffiti'd highway underpass in LA, in which multiple layers of tagging interact. <br> <br>All this is a lengthy pre-amble to my suggestion that, in your attempt to represent music typographically, you may have an easier and more direct route to the kind of visual polyphony that interests Robert than the more common attempt to represent text musically.</p>"
