  html: <p>I'm working on a project right now that is in a very conceptual stage, and very abstract, so I'm trying to get some input to steer  this in an appropriate direction. <br> <br>I'm working to build what I'm calling "beatmaps" right now.  It is to be a linear transcription of music (mainly experimental electronic or electro acoustics) presenting harmony, dissonance, meter, and syncopation with only punctuation and letter forms.  It isn't to be readable...the letters are only to represent sound through their visual presence.  Color choices will also be a large issue in defining the melodic atmosphere. <br> <br>Think about it like looking at sheet music, but instead of seeing black and white dot and flag characters, you find colorful typographic fragments arranged so you SEE the music as plainly as you would hear it. <br> <br>Vague, I know.  Abstract, I know.  I'm only typing this little bit of info so we can think about the wide possibilities here.  If your musically attuned I'd really appreciate any things you can give me to consider, any visual ideas, or good references. <br> <br>-JT</p>
