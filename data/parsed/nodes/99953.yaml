    date_raw: 23 Jan 2013 — 7:27am
    votes: null
    html: <p>First time I heard of these Helvetica knock-offs. Thanks Nick! For the rest, I really don't think it could be closer to Helvetica or one of its knock-offs. /R, /S, /s and /e are definitely "Akzidenz Grotesk-ish" and even if this kind of <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/neue-haas-grotesk/std-display-75-bold/glyphs.html#glyphs/536566/315" rel="nofollow">/R could be found as alternate in Neue Haas Grotesk</a>. May be a different cut from Berthold's, a step between (Berthold) Lange's Akzidenz Grotesk and (Haas) Miedinger's Neue Haas Grotesk soon-to-be-renamed Helvetica.</p>
    html_clean: <p>First time I heard of these Helvetica knock-offs. Thanks Nick! For the rest, I really don't think it could be closer to Helvetica or one of its knock-offs. /R, /S, /s and /e are definitely "Akzidenz Grotesk-ish" and even if this kind of <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/linotype/neue-haas-grotesk/std-display-75-bold/glyphs.html#glyphs/536566/315" rel="nofollow">/R could be found as alternate in Neue Haas Grotesk</a>. May be a different cut from Berthold's, a step between (Berthold) Lange's Akzidenz Grotesk and (Haas) Miedinger's Neue Haas Grotesk soon-to-be-renamed Helvetica.</p>
