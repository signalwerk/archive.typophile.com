    <p>Hello everybody, this is my first post, I’m french, please excuse my poor english.</p>
    <p>I’m designing a logo for a company involved in promoting and installing solar panels to produce energy.</p>
    <p>The brief is tricky.</p>
    <p>The company is at birth stage, but it shoulp compete with majors like Solar BP (British Petroleum etc..).<br>
    The company name means “blue” in French. It represents the blue of the sky and concepts such as pure, air, nature, tomorow, etc... The problemis that this name does not represent the activity, the color either.</p>
    <p>I thought the only choice was to play with some type. Do you know a font that would vehicle the ideas I just listed ?</p>
    <p>Any help woul be muchly appreciated.</p>
