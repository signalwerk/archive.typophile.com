      <p>I can't read it at all. Looks like Scoffdaylily?</p>
      <p>I may be completely lost here, but this isn't really an ambigram, is it? The entire right half of the word isn't anything until you flip it around. This is basically a (messy) word that is then duplicated, flipped, and attached on the other end. Couldn't you do that with any word?</p>
