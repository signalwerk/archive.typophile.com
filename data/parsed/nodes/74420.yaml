    <p>I posted a few months ago about an ambigram I created of my full name. I removed the post from the forum because my name was coming up first in google image search which was a little scary. I have simplified the ambigram in hopes of making it easier to read (I eventually want to put this on an orientation independent business card). I was hoping someone could give me some pointers on the typography aspect of my second pass. I started on paper, then put it into Inkscape (recommended last time I posted). I tried to keep all the letters the same height, but keeping width and spacing was difficult because some of the letters have to be multiple letters when flipped upside down. If anyone wants to play around with it (I can send the vector graphic too) or has any advice, I'd really appreciate it.</p>
