      <p>My best guess was "Pybersson". To rescue the middle you'll have to pull it apart into more distinct pieces. I suggest: il=b, e=o, R=R.</p>
      <p>tt=ts is an unavoidable choice and it's tough. It's probably best to give up any "matching" essiness in the t=t. Maybe try something like a small narrow T S with an underline that makes the top of TT.</p>
