    <p>I know this has been discussed a couple of times around here as I read that a 6x8 inches tablet is just fine and that some Typophiles are addicted to it but:</p>
    <p>Are Wacom tablets really efficient outside Photoshop and Corel Painter? </p>
    <p>Can they really replace a mouse in more publishing design oriented tasks like vector tracing or text editing?</p>
    <p>I'm asking because I got tendinitis on the wrist and would like to try a tablet for a relief but I have seen these tablets advertised almost exclusively for drawing applications and sloppy tagging (bamboo promo). </p>
    <p>Most of my work is done on Illustrator and Indesign, I do use photoshop frequently but mostly for adjusting the color, sharpness and contrast on photos.</p>
    <p>Héctor</p>
