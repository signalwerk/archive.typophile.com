      <p>i began using a tablet to relieve "mouse cramp" and i love it. now i can't work without it - but i insist on  a large one. i found that with a pen i need to get as close as possible to a 1 to 1 scale relationship between monitor and hand.</p>
      <p>as noted, the tablet also allows you to work very close to the body, relieving arm reach and shoulder strain.</p>
      <p>if you are starting to experience any kind of repetitive stress- wrist, arm, or elsewhere - i strongly advise you to change up the ergonomics as soon as possible, and a tablet is an easy way to do that.</p>
      <p>i use it (in tandem with a mouse) for all sorts of non-drawing tasks, and it also allows me to return to mouse tasks with more endurance than i would have with a mouse-only station.</p>
      <p>for drawing tasks, of course, it is ideal.</p>
