      <p>I've been using a Wacom for everything since 1992, and attribute it to keeping me free of hand/wrist ailments, despite a vast number of hours at the computer.</p>
      <p>The reason is:</p>
      <p>1. The natural position for the wrist is with the plane of the palm vertical, as when standing or walking. And that's the position used in writing. In mousing, the wrist is rotated 90 degrees, which twists and stresses nerves in the carpal tunnel.</p>
      <p>2. When mousing, you're using just one finger for clicking. Any physical activity so exclusive is bad in the long run, because it's better to share the load. Therefore, clicking with a "writing" movement that spreads the work between fingers and wrist is less stressful.</p>
    html_clean: |-
