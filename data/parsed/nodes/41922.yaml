      <p><cite>What do other people think of stylus barrel width?</cite></p>
      <p>Same. My first experience was with the classic (slender barrel) stylus at work. Instantly comfortable with the tablet. Loved it.</p>
      <p>Bought a tablet for home and got the big fat crayon stylus. Disappointed.</p>
      <p>1 1/2 year-old daughter bit the trigger out of the crayon stylus and I was delighted to find you can still order the classic stylus.</p>
      <p>I recently converted to a standing work station and I cannot imagine ever sitting for 8 hours a day again. Using the stylus and keyboard at belly-button height is perfectly comfortable, and in fact allows for a little exercise when the toes start tapping and the hips start swaying to the ever-surprising iTunes shuffle!</p>
      <p>Oh yeah...I do get that rub on the wrist bone, but it's mildly comforted by a mouse pad...the top of the tablet is propped up by a an old 5/8" thick book to achieve the most natural writing angle for me.</p>
