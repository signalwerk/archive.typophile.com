      <p>This was actually the original reason I got a graphics tablet. (Well, I didn't technically have tendonitis, but my wrists always hurt.)</p>
      <p>I'm not certified in any way in ergonomics, but I've read <em>a lot</em> about it. Mice are absolutely terrible for your hands, much worse than keyboards, (I can give you dozens of studies that support this.) and one study referenced in a textbook I read showed essentially that graphics tablets were on average the best of any pointing input device in terms of usability and posture and almost as easy to use as a mouse. I find it easier to use than a mouse.</p>
      <p>There are some alternative mice out there that are better in general but put a lot of strain on the thumb muscles. This includes joysticks and the Gyration mice. The AerO2bic mouse looks really good and simple. It's expensive though. I've seen some touchscreen desks, and they look awesome, but they're still outrageously expensive.</p>
      <p>My general recommendation is get as many different styles of pointing input device as you have space for them on your desk, one of which should be a graphics tablet, and use whichever one you feel like using.</p>
      <p>If you're also considering getting a better keyboard, check the <a href="http://groups.yahoo.com/group/altkeyboards/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">altkeyboards Yahoo! group</a>.</p>
