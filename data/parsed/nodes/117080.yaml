      <p>I looked at various fonts, and can not find one font with all letterforms. <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/magistral/?refby=bowfin" rel="nofollow">Magistral Condensed</a> gets close on all but the A and P. <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-clan-ot/?refby=bowfin" rel="nofollow">FF Clan</a> was pretty good for those two letters, but not the C and L.</p>
      <p>Most likely custom, I think. Does anyone know if the ® signifies the design of the logo (lettering), or just the name? I guess I have assumed it meant the design (implying custom lettering).</p>
