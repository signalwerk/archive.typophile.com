    <p>Hi all.</p>
    <p>I would like to post a question.<br>
    What is the best way to “move” vector drawings (sometimes with images), from freehand to Indesign?</p>
    <p>I’ve tried the following:</p>
    <p>1. Basic “copy paste”<br>
    2. Export as eps and import into Indesign<br>
    3. Build a pdf, and open in InDesign<br>
    4. Use Illustrator as a “buffer” between the two apllications using “copy paste” method.</p>
    <p>Didn’t get any conclusions and i still have problems mainly in files with images.<br>
    How can i preserve all atributtes such as color, stroke width, fonts, image size and position, etc.</p>
    <p>Thanks in advance<br>
    Regards</p>
