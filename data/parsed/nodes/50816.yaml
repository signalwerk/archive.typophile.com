      <p>You can copy and paste between Illustrator and Freehand!? Didn’t know you could do that.</p>
      <p>Freehand has serious issues doing anything Adobe related, your on the right lines using illustrator as bridge between the two though. Have you tried exporting your freehand file as an illustrator 7.x file, and then opening that in illustrator? You should be able to find something inDesign friendly that way.</p>
      <p>Good luck, and much respect for holding up the freehand quarter!</p>
