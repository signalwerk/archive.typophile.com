      <p>Thank you, Flash! (Do you have a real name?) </p>
      <p>If the illustrations are very busy I’d consider a neutral sans. An alternative that is both classic, timeless and has a modern edge is <a href="http://new.typographica.org/2008/typeface-reviews/graphik/" rel="nofollow">Graphik</a>! You’ll have to contact Commercial Type for pricing. Graphik has the qualities to work both as a display face and as a text face. </p>
      <p>Shameless promotion: <a href="http://www.frodehelland.com/prosjekter/skrift/noir-example.jpg" rel="nofollow">Noir</a> is rather ornate, while still clean.</p>
