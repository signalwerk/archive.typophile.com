    html: |-
      <p>This is basically a re-design of a layout first done by an illustrator who was not concentrating on the actual layout of the piece as much as the illustration. The pieces I have been given will evolve into a record sleeve. The style of the overall piece is quite eclectic. This musician is essentially collaborating with a variety of electronic musicians of differing styles. </p>
      <p>The illustrations are somewhat ethereal, and have a bit of a timeless quality b/c they are embellishments added to the top of (for lack of a better description) very beautiful high fashion photographs.</p>
      <p>I left the style specifics of my question rather broad on purpose b/c I am starting from zero and can imagine several different combinations working. I will need a print font for both the title and the musicians name, as well as (if not the same)fonts for all of the internal copy text, or secondary information. Right now I am spending a significant amount of time simply looking for possible title/name heading fonts. As to neutral sans serif combos, the best mock up I've done on that front used bauhaus, which seems viable. Though I have been looking, I haven't found any elegant script or anything deocrational or ornate that is working yet.</p>
      <p>The audience for this piece will vary. A broad description would be: the spiritual side to dj culture/underground art. There are no pre-existing font uses for the client to consider. Though most of the supporting artists involved in this project have previous releases, this will be the first release of the headlining artist - so we are creating that image now. I would say that it is as important that my final choices come across as 'fresh' or 'modern' as they do 'seasoned' because while the beats are very edgy, the vocals are based on ancient mantras.</p>
      <p>Thank you ahead for any thoughts. I checked out your website ff, and enjoyed your work quite a bit.</p>
