      <p>What are you designing? Record sleeves? Are you looking for display fonts, or text fonts? </p>
      <p>Your question is very broad. “Ornate and elegant” could be a script, but I’m not sure if that would fit your project. There are some very dramatic contemporary script fonts available quite cheap.</p>
      <p>“Modern edge, timeless and classic” makes me think of a neutral sans serif of some kind, perhaps two dramatically different weights for contrast. </p>
      <p>That’s just what first popped into my head. Could you fill us in on what exactly you’re intending to use it for, and who your audience is? Also: have the client used any other typefaces before?</p>
