    <p>I'm looking for a quick font suggestion for a project I'm doing a layout for. The project is both musically and visually a collaboration between several talented emerging artists. The packaging includes very beautiful photographic illustrations, and the music is a mix of djs working with some Tibetan influenced vocals. Contrary to how it may sound, this is not a new agey piece at all - the sound of this music is edgy and underground, but also beautiful and easy to listen to. This seems like a lot to fit into a font.</p>
    <p>OF COURSE because the project is completely artist funded, it has a very small budget.</p>
    <p>I'm thinking that several types of fonts could work, but I haven't found the right one yet. What I'm looking for is something that is either very ornate and elegant, or something sort of timeless and classic, or something with a modern edge or clean gallery feel to it. Any of these things could work so long as the font suggests high end art.</p>
    <p>Any thoughts or suggestions are totally appreciated!<br>
    Thanks!</p>
