    html: '<p> Buena JP <br> <br>Me gusta mucho Isabel. <br> <br>El ojo de letras como la "a", la "b","c","d","g","e",,,,etc le dan un muy buen caracter a tu letra, lo que si, trataría de afinar la acentuación de las vocales: fíjate en el contraste que lograste en la de la "ñ" (que tiene una inclinación muy linda y femenina). <br> <br>En cuanto a la "g" y a la "y", también me gustan mucho más las primeras, pero trataría de hacerlas un poco menos conflictivas con las letra que las antecede. <br> <br>Saludos y felicidades <br> <br>Cristián González </p>'
