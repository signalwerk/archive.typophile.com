    html: |-
      <p>Fraktur, used for the printing of German for many years, often used letterspacing for emphasis. Was this a good idea, though?</p>
      <p>Perhaps it would have been better to use Roman for emphasis. Perhaps it would be better, today, to use Fraktur for emphasis than to letterspace lowercase Roman.</p>
      <p>It may be, though, that letterspacing is not all that bad. Excessive letterspacing slows down reading and word recognition. But a modest amount of letterspacing would not be harmful in that way. So, all that is needed is a tasteful control of the amount of letterspacing, right? Of course, the answer is no - because the amount of letterspacing that is slight enough not to be harmful... is also slight enough not to be unambiguously visible, and, thus, the intended emphasis would not be noted.</p>
      <p>I think that perhaps the two issues need to be separated. On the one hand, letterspacing lower case is unambiguously a bad thing. But it may be that the Anglo esthetic of using italics (and then bold) for emphasis <em>is</em> foreign to German reading habits.</p>
      <p>If so, it is not unreasonable to search for a reasonable alternative.</p>
      <p>Use a demibold with slight letterspacing. Or use Roman and sans-serif with one as the emphasis type.</p>
      <p>If the italic of Roman types is simply unfamiliar to German eyes, almost as much as Fraktur is to ours, then use instead the sloped italic of a sans-serif type for emphasis, even though the regular text is in a Roman type.</p>
      <p>So, while we can criticize letterspacing of lower case as a poor choice for emphasis, if Germans wish to use a means of emphasis that happens to differ from the usual convention in other countries, they may have legitimate reasons - and so the search for a more suitable alternative is what is needed.</p>
