    html: "<p>Nick, letterspacing in German is not different or new: it is a technique inherited from the fraktur days in which letterspacing was used for emphasis in the absence of italics. Letterspacing is a bad idea, especially in text, because it degrades word recognition; this isn't an 'Anglo aesthetic', it's functional. <br> <br>I think the appeal to Goudy's famous comment is misplaced: one shouldn't avoid letterspacing lowercase letters because Goudy said it was a bad thing, you should avoid it because it <i>is</i> a bad thing, and demonstrably so. <br> <br> <br>This reminds me of an amusing point made during the keynote address at the ATypI conference in Copenhagen. The speaker was talking about the typesetting of various editions of the works of Kierkegaard (this was more interesting than you might imagine, as Kierkegaard had taken a keen interest in the typography of his books). In one book, Kierkegaard likens psycho-spiritual anxiety to being l e t t e r s p a c e d, a typographic metaphor that captures perfectly the sense of fragmentation. Of course, the early Danish editions of Kierkegaard were set in fraktur type, so the metaphor worked because letterspacing was the method used for emphasis. In a later edition, set in roman type, the typography was changed so that emphasis was indicated with italics; the editors took it upon themselves to change Kierkegaard's text to liken anxiety to being <i>italicised</i>. </p>"
    html_clean: "<p>Nick, letterspacing in German is not different or new: it is a technique inherited from the fraktur days in which letterspacing was used for emphasis in the absence of italics. Letterspacing is a bad idea, especially in text, because it degrades word recognition; this isn't an 'Anglo aesthetic', it's functional. <br> <br>I think the appeal to Goudy's famous comment is misplaced: one shouldn't avoid letterspacing lowercase letters because Goudy said it was a bad thing, you should avoid it because it <i>is</i> a bad thing, and demonstrably so. <br> <br> <br>This reminds me of an amusing point made during the keynote address at the ATypI conference in Copenhagen. The speaker was talking about the typesetting of various editions of the works of Kierkegaard (this was more interesting than you might imagine, as Kierkegaard had taken a keen interest in the typography of his books). In one book, Kierkegaard likens psycho-spiritual anxiety to being l e t t e r s p a c e d, a typographic metaphor that captures perfectly the sense of fragmentation. Of course, the early Danish editions of Kierkegaard were set in fraktur type, so the metaphor worked because letterspacing was the method used for emphasis. In a later edition, set in roman type, the typography was changed so that emphasis was indicated with italics; the editors took it upon themselves to change Kierkegaard's text to liken anxiety to being <i>italicised</i>. </p>"
