  html: "<p>Some of you may have heard that the German federal government chose Gerard Unger's typefaces Neue Demos and Neue Praxis, released by Linotype Library, for their corporate design:  <br><a href=\"http://www.linotype.com/16417/01_03_2004-doc.html\" target=\"_blank\">http://www.linotype.com/16417/01_03_2004-doc.html</a> <br> <br>That's obviously a good thing. I have just found a corporate design brochure of the German federal ministry of education and research:  <br><a href=\"http://www.bmbf.de/pub/corporate_design_bmbf.pdf\" target=\"_blank\">http://www.bmbf.de/pub/corporate_design_bmbf.pdf</a> <br> <br>When I first opened it, I thought page 1 includes just a printing mistake. But when I scrolled down to page 26, I was horrified as hell when I realized that the creators of the corporate identity actually encourage the designers to steal sheep:  <br> <br>\"Die Sperrung betr</p>"
