    html: <p>But what's a designer to do, when previous generations have already done all the "good" designs? You can't just repeat things the way the old guys did them, you have to do something different, and break their rules. <br> <br>No doubt you will find a justification. In this case, it being German, bear in mind that Goudy was an American, and his reference to sheep-shagging somewhat Anglo derived.  <br> <br>Why should Germans kowtow to the Anglo aesthetic? The letterspacing of lowercase characters has an excellent precedent in older German culture -- it was done for emphasis with the Fraktur types, because there was no bold or italic.</p>
