    html: "<p>For display setting (like in that page 17), I think it simply reeks. But the case with immersive reading is different: slowing down reading for an emphasized snippet is actually a good idea I think - and letterspacing does that well, exactly because it disrupts boumas! Unfortunately, strong color variance does something really bad many lines before its positive effect could kick in: it causes an errant fixation. And this is why a Bold is typically too strong, and people just use Italic. A carefully-chosen Demi weight though (in an equally carefully controlled output environment however) works great, without the skew in the voice than an italic can cause. Italics are the safer choice though - a bit brutal and superficial, requiring less thought. <br> <br>&gt; The letterspacing of lowercase characters has <br>&gt; an excellent precedent in older German culture <br>&gt; -- it was done for emphasis with the Fraktur <br>&gt; types, because there was no bold or italic. <br> <br>Precedent, yes. Excellent, no way. That's like saying every neighborhood should have a horseshoe maker because in the past we didn't have cars. <br> <br>hhp <br></p>"
