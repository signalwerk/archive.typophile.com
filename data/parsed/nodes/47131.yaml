    <p>After reading <a class="freelinking external" href="http://talleming.com/2008/04/16/fraction-fever/" rel="nofollow">Tal Leming's fraction fever</a> I decided to give this a go. I've long wanted to script a decent fraction feature, but couldn't get it right. This is working perfectly (for now ... I've only tested it in Indesign CS2 on Tiger).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/frac_4561.gif"></div><p></p>
    <p><cite> </cite><br>
    Still in progress ... but Museo Sans will end up with nominators, denominators, superiors, inferiors, oldstyle figures (proportional &amp; tabular) and lining figures (proportional &amp; tabular).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sups_3733.gif"></div><br>
    <cite> </cite><br>
    <div class="imageWrap"><img src="http://typophile.com/files/sinf_4122.gif"></div><br>
    <cite> </cite><br>
    <div class="imageWrap"><img src="http://typophile.com/files/onum_3701.gif"></div><br>
    <cite> </cite><p></p>
