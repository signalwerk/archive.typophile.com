    html: |-
      <p>@<strong>Jos</strong>: "<em>I don’t know what the normal or standard OT feature code for fractions is</em>"</p>
      <p>Quite simplified, this is the way I do fractions (<em>follows the description, then the code itself</em>). Derived of Adobe standards, of course. This is a working code I only re-edit to alter the exact figures naming. Depending on the availability of five sixths, four fifths and other [more exotic] fractions you can remove parts of the replacement code below.</p>
      <p>So, <strong>the explanation</strong>.<br>
      Requirements: 0-9.numerators, 0-9.denominators</p>
      <ul>
      <li>Define what is considered slash (as class);
      </li><li>Define already built fractions (like percent, onequarter, onehalf etc.);
      </li><li>Replace all standard figures with numerators;
      </li><li>Define replacement rules for the already built fractions;
      </li><li>Last part: generation of not-ready fractions (like 22/7 etc.)
      </li></ul>
      <p><em>feature frac {<br>
      	@slash = [slash fraction];<br>
      	@prebuilt = [perthousand percent onequarter onehalf threequarters oneeighth threeeighths fiveeighths];</em></p>
      <p>	lookup FRAC {<br>
      		sub [zero zero.pnum] by zero.numr;<br>
      		sub [one one.pnum onesuperior] by one.numr;<br>
      		sub [two two.pnum twosuperior] by two.numr;<br>
      		sub [three three.pnum threesuperior] by three.numr;<br>
      		sub [four four.pnum foursuperior] by four.numr;<br>
      		sub [five five.pnum fivesuperior] by five.numr;<br>
      		sub [six six.pnum sixsuperior] by six.numr;<br>
      		sub [seven seven.pnum sevensuperior] by seven.numr;<br>
      		sub [eight eight.pnum eightsuperior] by eight.numr;<br>
      		sub [nine nine.pnum ninesuperior] by nine.numr;<br>
      	} FRAC;</p>
      <p>        sub zero.numr' @slash' zero.numr' zero.numr' zero.numr' by pertenthousand;<br>
              sub zero.numr' @slash' zero.numr' zero.numr' by perthousand;<br>
      	sub zero.numr' @slash' zero.numr' by percent;<br>
      	sub one.numr' @slash' four.numr' by onequarter;<br>
      	sub one.numr' @slash' two.numr' by onehalf;<br>
      	sub three.numr' @slash' four.numr' by threequarters;<br>
          sub one.numr' @slash' eight.numr' by oneeighth;<br>
          sub three.numr' @slash' eight.numr' by threeeighths;<br>
          sub five.numr' @slash' eight.numr' by fiveeighths;<br>
          sub seven.numr' @slash' eight.numr' by seveneighths;<br>
          sub one.numr' @slash' three.numr' by onethird;<br>
          sub two.numr' @slash' three.numr' by twothirds;<br>
          sub one.numr' @slash' five.numr' by onefifth;<br>
          sub two.numr' @slash' five.numr' by twofifths;<br>
          sub three.numr' @slash' five.numr' by threefifths;<br>
          sub four.numr' @slash' five.numr' by fourfifths;<br>
          sub one.numr' @slash' six.numr' by onesixth;<br>
          sub five.numr' @slash' six.numr' by fivesixths;<br>
      	sub [@slash @fig_dnom @prebuilt] @fig_numr' by @fig_dnom;<br>
      } frac;<br>
      </p>
      <p>The beautiful part is it does not need in fact any editing (you can copy and paste this feature code everywhere, if you have defined the classes <strong>@fig_dnom</strong> [denominators] and <strong>@fig_numr</strong> [numerators]). Of course Tal's solution is nicer, but this one is easier - and does not have above-mentioned shortcomings (namely, the space problem).</p>
