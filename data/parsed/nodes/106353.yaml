    html: <p>I’d rather classify the typeface family as Modern. The light weight is a Modern Egyptian or Modern Slab Serif if you like. The black weight is a Modern typeface, so Modern is what they have in common. Instead of Modern one could also say Didonic. The trouble with most approaches to classifying typefaces is that they create a system with a fixed number of boxes with rather strict rules instead of describing the typefaces by formal principles. The latter would allow to work with as many ‘boxes’ as needed. Sometimes one only needs to distinguish between Sans and Serif, sometimes between Modern Slab Serif and Humanist Slab Serif, and occasionally one would like to distinguish between Venetian Serif and Humanist Serif, maybe even between Venetian Slab Serif and Humanist Slab Serif. Anyway, the main goal of classifying typefaces should be to enable designers to work with them and communicate their typographic and formal aspects, not putting them into boxes.</p>
    html_clean: <p>I’d rather classify the typeface family as Modern. The light weight is a Modern Egyptian or Modern Slab Serif if you like. The black weight is a Modern typeface, so Modern is what they have in common. Instead of Modern one could also say Didonic. The trouble with most approaches to classifying typefaces is that they create a system with a fixed number of boxes with rather strict rules instead of describing the typefaces by formal principles. The latter would allow to work with as many ‘boxes’ as needed. Sometimes one only needs to distinguish between Sans and Serif, sometimes between Modern Slab Serif and Humanist Slab Serif, and occasionally one would like to distinguish between Venetian Serif and Humanist Serif, maybe even between Venetian Slab Serif and Humanist Slab Serif. Anyway, the main goal of classifying typefaces should be to enable designers to work with them and communicate their typographic and formal aspects, not putting them into boxes.</p>
