    html: "<p>Of course the early Egyptians and Gothics were not part of any family. The very concept of the type family did not exist when those ‘novelty’ styles hit the type market… Those new, exotic, typefaces were meant for <em>combined</em> use with other styles, not by themselves: like capers or grenadine, they were natural born mixers. One could not even think of setting an entire book using black type—Modern, Egyptian, or Gothic.</p>"
