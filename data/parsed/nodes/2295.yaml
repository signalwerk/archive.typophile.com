    html: <p>Wow! nice eye Randy. I knew I'd seen this before. If I'd gotten further <br>into my Old Style font notebook, I'd have reached my entry for Packard. <br> <br>Like many typefaces in the Solotype Catalog, Dieter Steffmann <br>digitized this as <a href="http://www.moorstation.org/typoasis/designers/steffmann/index.htm" target="_blank"> Packard Antique</a>. So if you are able to use Windows <br>Truetype or Type 1, it's a freebie. Comes with a bold variant as well. <br> <br>No promise, of course, that Steffmann's version will match your <br>sample precisely. <br><br></p>
    html_clean: <p>Wow! nice eye Randy. I knew I'd seen this before. If I'd gotten further <br>into my Old Style font notebook, I'd have reached my entry for Packard. <br> <br>Like many typefaces in the Solotype Catalog, Dieter Steffmann <br>digitized this as <a href="http://www.moorstation.org/typoasis/designers/steffmann/index.htm" target="_blank" class="link-external"> Packard Antique</a>. So if you are able to use Windows <br>Truetype or Type 1, it's a freebie. Comes with a bold variant as well. <br> <br>No promise, of course, that Steffmann's version will match your <br>sample precisely. <br><br></p>
  - id: 18384
