    html: <p>Thanks for the info. <br> <br>Now...I opened up Steffmann's Packard Antique font with High-Logic's Font Creator Program and I noticed that there were several errors/warnings.  I fixed (very meticulously, mind you) the errors and warnings, which included contour directions, redundant points, overlapping contours, and a few obvious defects.  I saved my fixed font as a new font file (Truetype). <br> <br>What is the best way to handle this in terms of releasing this "fixed" version out into the "wild" of the Internet.  Of course, I would give Steffmann full credit still, but I would make a note within the font that it was a cleaned up version of the font.  Should I name my fixed font differently?  Should I even be doing this? <br> <br>I was hoping that my cleanup work would make the font appear better on screen, but unfortunately, my changes had no effect in this regard.  You are right however, that the font looks excellent when printed out.</p>
