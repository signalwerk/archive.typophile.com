    html: <p>My advice would be to contact Dieter Steffmann before you do anything to distribute this (if you just use it yourself that's up to you). For one thing, Dieter may want to know what changes were made; for another your software may 'fix' it only so that your software doesn't see errors/warnings -- are you sure that makes it compatible with any other similar software, like FontLab or Fontographer? <br> <br>Anyway, talk to Dieter, is my advice.</p>
