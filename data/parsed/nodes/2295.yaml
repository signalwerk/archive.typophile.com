  html: <p>This is the font used by the publisher of AD&amp;D, TSR, for their 1st edition releases in the Dark Sun product line.  I have found similar fonts, but none that match it precisely. <br> <br>I have chosen letters for the sample that are some of the most distinctive of the font as a whole.  If this still is not enough for a positive ID, I can provide a whole page of scanned text. <br> <br>Good luck...I don't think you can do it.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  (Just challenging you to excellence.) <br> <br><img src="http://www.typophile.com/forums/messages/83/21713.jpg" alt="Text Sample"></p>
