    votes: null
    html: <p>OptiFonts are handled these days by <a href="http://www.castcraft-software.com/homepage.html" target="_blank"> Castcraft</a>. <br> <br>Their website is, to say the least, outdated and the only part that <br>functions usefully is the Designer Collections link. Since Opti <br>Packard is not in any of the four Designer Collections and the <br>Online Catalog images don't appear, you would need to contact <br>Castcraft. <br> <br>Over the last few years, I've contacted them by e-mail 5 times and <br>received a reply once. Hopefully you'll fare better. I'm sure that they <br>could provide the font in the format of your choosing. <br> <br>As to which font would be most accurate, it seems likely that the <br>OptiFont was used. Since Dieter Steffmann's version is free, you <br>can check it out for yourself. It doesn't fare the best on-screen, so <br>be sure to print a sample paragraph or two to see it on paper, <br>where it looks splendid. <br><br></p>
    html_clean: <p>OptiFonts are handled these days by <a href="http://www.castcraft-software.com/homepage.html" target="_blank" class="link-external"> Castcraft</a>. <br> <br>Their website is, to say the least, outdated and the only part that <br>functions usefully is the Designer Collections link. Since Opti <br>Packard is not in any of the four Designer Collections and the <br>Online Catalog images don't appear, you would need to contact <br>Castcraft. <br> <br>Over the last few years, I've contacted them by e-mail 5 times and <br>received a reply once. Hopefully you'll fare better. I'm sure that they <br>could provide the font in the format of your choosing. <br> <br>As to which font would be most accurate, it seems likely that the <br>OptiFont was used. Since Dieter Steffmann's version is free, you <br>can check it out for yourself. It doesn't fare the best on-screen, so <br>be sure to print a sample paragraph or two to see it on paper, <br>where it looks splendid. <br><br></p>
