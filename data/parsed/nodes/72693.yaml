    html: |-
      <p>As far as I know, the Mark Problems macro doesn’t mark any overlapping contours, but rather the problems considered as such by Font Audit, i. e., Empty lines and curves, Vector on closepaths, Flat curves, Collinear vectors, Inflection on curves, Weak extremum points, Normal extremum points, Incorrect smooth connection, Cusp and self-intersecting curves, Semi-horizontal and vertical vectors, Contour is not closed &amp; Object is too short.</p>
      <p>As for the colors, they indicate how big are the problems and/or how many problems the glyph has. Red means a big problem or many minor things to fix, pale yellow means “don’t worry too much”.</p>
