      <p>Bunch of great info here. Thanks guys! MyFonts generic agreement was kind of ...generic. And not how I want to share my stuff.</p>
      <p>I have to say, the readability of Vllg's agreement is very nice. Specifically, I read <a href="http://www.vllg.com/Village/Mavis/Licensing/" rel="nofollow">the 1.3 for the village branded Mavis</a>. This is the open license? Thinking I can cobble something out of that with some snips of Fountain's details.</p>
      <p>---</p>
      <p>The typetrust agreement seems to parallels an idea I was toying around with. Is there a market for (or an example anyone has an opinion on) having fonts purchasable under different licenses? Examples:</p>
      <p>A 'Designer license' might have unlimited machines that are used predominantly by a single person - I rarely use my antique laptop, but it would be nice to have the same fonts on that as the workstation and the server. A 'Corporate license' might have unlimited machines owned by 1 company, and several sub-licenses for giving to print services. A 'Learning license' might include support, A "Custom Super Deluxe license Royale ' might include a finite number of custom glyph additions/modifications, etc.</p>
      <p>If this was a viable route, shouldn't these be kept as separate products, with their own appropriate license embedded in them only? Is this even an interesting or good idea?</p>
      <p><a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
      <a href="http://www.exclamachine.com" rel="nofollow">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark" rel="nofollow">The Snark</a></p>
