      <p>Terry,</p>
      <p>If you have a font design that a corporation wants, you license it to them at the same rates as Lino or Mono. It could be even more! We have been fortunate enough to be involved in some of this and I know for a fact that in one project we were more expensive than Monotype. But the client eventually selected one of our designs. </p>
      <p>Eric Olsen's Process Foundry has licensed some of their fonts for use on the Chevrolet account. </p>
      <p>The problem, as I see it, is not the difference between large and small. It is that many small foundries under price their work. They haven't either looked for or gotten good advice as to current business practices as it relates to font license pricing. </p>
      <p>There are some fairly consistent pricing models out there. You just have to do a bit of research. Speaking any more about pricing on a public forum could be construed as price fixing, so I'll leave it there.</p>
