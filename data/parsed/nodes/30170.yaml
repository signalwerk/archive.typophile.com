      <p>I don't frown on users asking for a good free font. Typophile.com is not a hive mind. If they find a font that is legal, free and good, more power to them. They would be stupid to choose anything else, if that meets all their needs. So, I frown on those who overbuy type, and those who oversell it.</p>
      <p>Since a number of people here make a living making, productizing or selling it, the bias of the community might be towards recommending commercial products. Not out of direct greed, but out of an affinity to the rest of the industry, and a ingrained tendency to value all type.</p>
