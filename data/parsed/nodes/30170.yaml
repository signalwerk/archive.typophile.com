      <p>And, since it was asked, here's my ideal (as a consumer) EULA that I'd like to see:</p>
      <p>----------------------</p>
      <p>You may...</p>
      <p>...use this font on paper, online and in embedded documents.<br>
      ...install this on the machines that you personally use for work.</p>
      <p>You may not...</p>
      <p>...sell this font (unless you are selling the individual license you purchased and, subsequently, delete all copies that you own)<br>
      ...give away this font<br>
      ...install it on other people's machines (with the exception of coworkers machines provided you have a site license)<br>
      ...sue us if your computer blows up because you installed our font.</p>
      <p>----------------------</p>
