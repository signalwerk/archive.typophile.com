    <p>Is there anyplace to get a snap-together font <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a>? I can't snip and paste from someone else's w/o permission. I have had trouble finding a lawyer with any interest in writing one (esp. within my budget). Said budget being comparable to picking up a common fill-in-the-blank legal agreement from Staples or Office Depot.</p>
    <p>If there is such a thing, I am sure it would interest several here, even if it is disclaimed from any lawyer's endorsement.</p>
