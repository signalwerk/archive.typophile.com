      <p>What I think all those exclusions mean is that for commercial use (even if it is just a logotype) you have to get a commercial license, which they don't sell on their website. The only have an automated cart to sell a something-else license, whatever it may be called. That they offer multiple licenses, but only one type via web seems the biggest bummer. I assume they base the 'larger' license on the scale of the client, or something like that.</p>
      <p>This makes me wonder, aside from the specific examples in the faq, what would not require a better license than the one they most readily sell. Booksetting, I suppose.</p>
