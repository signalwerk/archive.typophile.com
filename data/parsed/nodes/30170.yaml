      <p>Rights-Managed photos charge the user a "per usage" fee. Depending on how the image is going to be used. Rights-Managed photography is usually more expensive. In many cases a contract can also grant the user exclusivity to the image.</p>
      <p>Royalty-Free photography is generally cheaper (often in terms of quality as well), but there usually is no limit to how many times you can use the image.</p>
      <p>See <a href="http://creative.gettyimages.com/source/home/license.aspx" rel="nofollow">Getty Images here</a> for a better description.</p>
