    html: |-
      <p>re Fountain's:</p>
      <p>"When embedding fonts the document must not include more than 60%(percent) of the character set of any individual style of the font before any distribution is allowed to take place. Using Adobe Illustrator or any similar applications which convert the font characters into editable outlines is NOT an acceptable means of producing an electronic document for distribution."</p>
      <p>That seems arbitrarily and overly restrictive to me.</p>
      <p>I never understood the fear of PDF embedding. It's like telling people that you can only use half of the characters for each individual you print.</p>
      <p>It's one of those 'punish the paying customer for things other people do' it seems.</p>
      <p>"You will secure embedded documents against unauthorized use by any third party"</p>
      <p>That's even worse. Sounds like if someone steals my car and robs a bank, I'm liable. (Maybe I am...these are odd times...)</p>
      <p>(ADDENDUM...I in no way mean to single Fountain out, as this seems to be a common issue with most foundries' EULAs.)</p>
