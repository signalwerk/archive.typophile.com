      <p>I guess I'm a little bit more on the side of graphic designers on that point. It seems unfair for anyone to have to get additional licensing simply to use a few glyphs to make a logo. If they were illustrative glyphs then I'd understand, but to use the letters AT&amp;T and have to get additional licensing seems, like I said, a little over-the-top. </p>
      <p>Yes, yes, from the type designers point-of-view, it sucks that a gi-normous company could get branded with three letters, but what about the rest of us that don't do logos for gi-normous companies?</p>
      <p>At the end of the day, they can do whatever they think is fair in their license. It is up to them. But, they are turning away some customers.</p>
