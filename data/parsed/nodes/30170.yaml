      <p><cite>I think point 2.6 is a little over-the-top...</cite><br>
      <cite>... At the end of the day, they can do whatever they think is fair in their license. It is up to them. But, they are turning away some customers.</cite></p>
      <p>I'm a little late coming into this thread, but I just wanted to add a few things that seem to be overlooked/assumed.</p>
      <p>Tiff, you make it sound as though you expect a Commercial Use license to be completely unaffordable to the little guy.  This is not the case and is not inteded to turn away customers, but rather to involve them in a real discussion/recognition of the value of type.</p>
      <p>The TypeTrust position is that it's wholly reasonable for a graphic designer to sell a logo for a few grand and in turn recognize the value of the typefaces used.  It's a matter of value, and always open to negotiation.</p>
      <p>A license does not always have to be assigned a monetary value either.  There are other forms of exchange.  Listing designer credits would be ideal in the case of a magazine or book.  Other media such as billboards and broadcast would more likely be a matter of money.</p>
      <p>If a potential customer reads any part of our EULA and decides not to license from us, then there is absolutley no harm done.  We'd actually respect it as a genuine act of respect for the EULA.  If someone is reading and comparing EULAs, we're already happy.</p>
      <p>We're not in the retail font business to make a quick buck.  We're in it to publish good type and protect our interests in doing so.  We want to establish a clientbase rather than a customerbase... people who want to work with us, not just our fonts.</p>
      <p>It's an optimistic view to expect the design community to someday understand the value and rights involved in creating and using digital type.  Some might call it "over-the-top".  (Over the top of what is my question.)   But the greater design community's generally lax perception of the value of the type designer's work won't be heightened if we as type designers don't assert our positions and protect our interests.  A very specific, strict EULA is the first step in setting the stage.  Being open and available for comment and discussion is the next.</p>
