      <p>Can your instructors point you to reference works so you can prepare for the examination? Were any handouts provided? Do you have access to a good design library?</p>
      <p>There are so many different systems to categorize fonts. Take a look at Luc Devroye's extensive overview at<br>
      <a href="http://cg.scs.carleton.ca/~luc/classify.html" title="http://cg.scs.carleton.ca/~luc/classify.html">http://cg.scs.carleton.ca/~luc/classify.html</a></p>
      <p>In Switzerland a lot of schools still teach the DIN system or Bosshard's modified version of it. Three books that are often recommended:<br>
      Schriften erkennen: Sauthoff, Wendt, Willberg (Verlag H. Schmidt)<br>
      Technische Grundlagen zur Satzherstellung: Hans-Rudolf Bosshard (Niggli)<br>
      Buchstaben kommen selten allein: Indra Kupferschmid (Niggli)</p>
      <p>Indra Kupferschmid's book contrasts the historical classification (DIN) and the classification according to formal principles (static/dynamic) which Gerrit Noordzij described in detail.</p>
