    <p>Hi, i need a good resource (preferably online), where i can find a timeline that categorizes fonts. I have a type examination coming up and im not feeling well read on this subject.</p>
    <p>Im thinking age. Which characteristics defines 1500th century fonts, 1600th century fonts and so on!</p>
    <p>Thanks in advance.</p>
