      <blockquote><p>Do you have any extra ideas...</p></blockquote>
      <p>Main Ideas and Extra Ideas ...you never know when you'll need an Idea. Best to be prepared with Extra Ideas ...good thing I've gots lots :) Not all good Extra Ideas tho. I guess it all depends on how one manages their Extra Ideas as to how effective they can be ...and become main Ideas!</p>
      <p>Anyways... back while ago now I snagged this link to a whole book of Extra Ideas ... it's not called that tho....</p>
