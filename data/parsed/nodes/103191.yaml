      <p>The Book of Extra Ideas link I snagged from here at Typophile.</p>
      <p>I think Akzidenz-Grotesk BQ Medium Condensed is the font used for VINTAGER, but I don't know what the fonts are for the type on top and below VINTAGER.</p>
      <p><a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/medium-condensed/">http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/medium-condensed/</a></p>
      <p>And to achieve that text effect simply use... Effect &gt; Warp &gt; Arc Lower ...and enter a negative value.</p>
      <p>Oops sorry, I guess it could be Knockout ...</p>
