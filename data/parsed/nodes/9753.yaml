    html: "<p>Hi, Simon, <br> <br>I hope this helps a bit: I think that the FOG manual recommends not going above 1,000 or 2,000 kerning pairs � apparently, more kerning pairs means a bigger, slower-loading font file.  <br> <br>I suggest you work out the spacing of the characters first; then, once you're done, work on the kerning � kerning should only be done for certain troublesome character pairs (like <b>Ty</b>, for example) � as an exception, not the rule. <br> <br>The foundry SudTipos has some useful text files that you can download and run through Fontographer�s Metrics window to see all of the different character pairs and test your spacing and kerning. Scroll to the bottom of their <a href=\"http://www.sudtipos.com/submitions.htm\" target=\"_blank\">submissions page</a> and click on the 3 links called <b>Texto para test...</b> <br> <br>Best of luck!</p>"
