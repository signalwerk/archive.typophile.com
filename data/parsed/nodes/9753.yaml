    html: "<p>What you need to do is use Kerning Assistance (in the Metrics menu). It lets you set up sets of equivalent left and right characters (glyphs) which are automatically updated as a group when you change the kerning for any one of them. It's a little tricky to figure out the meaning of the \"link\" option, but the manual has a pretty good explanation of how it works. <br> <br>Metrics Assistance is also handy for making sure all A's, for instance, have the same width and/or sidebearings whenever you change any one of them. <br> <br>An Aside: <br> <br>I have completely switched over to FontLab now and would never go back, but these are two features that were much better done in Fontographer, IMO, and I really miss them.  <br> <br>You can do a similar thing to FOG's Kerning Assistance in FontLab by setting up classes and using <i>its</i> Kerning Assistance. But you have to remember which is the key glyph in each class and kern only to that glyph. You also can't see the effects of the kerning on any other members of the class except in the Preview window. With FOG, it didn't matter which member of the equivalent set you kerned, the value would automatically be updated among all the members of the set. The main thing was that, once you set it up, you didn't have to remember, was it the D or the O that controls kerning of characters with round right sides?  <br> <br>FontLab's Metrics Assistance is a bit closer to FOG's, but still not as nice since it has to be applied manually and, again, is tied to a key glyph which you must keep track of.</p>"
