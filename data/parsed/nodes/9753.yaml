    html: <p>Mark, Simon's "have manually kerned all the pairs for an english alphabet" raised a potential red flag in my head, which is why I asked how many he had so far... And it seems Simon now sees that he was going in too deep! Spacing/kerning is strange, very different than simply making the black of the body, which is a definite tihing; spacing is always gray, never fully under control - and that causes problems for some people (and I don't necessarily mean Simon). <br> <br>Simon, the "assistance" stuff can help (in terms of saving duplicate effort), but not the "auto" stuff. And whenever somebody helps you, in any way, whether it's man or machine, you have to be more on your toes... <br> <br>hhp</p>
