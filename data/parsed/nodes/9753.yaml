  html: <p>Hi my name is Simon <br>This is my first post so Hello to everyone. <br>I was wondering If anyone could help me with a technical difficulty i'm having with Fontographer <br> <br>I am Kerning a font in Fontographer, and due to lack of tutorials or books on it am learning as i go. <br>So far have manually kerned all the pairs for an english alphabet but now need to work on the Accented charachters. <br>I'm wanting to know if i can pinch the exsisting kerning information from say 'A' and apply to � � � � and also with values  from C, E, I, N, O, U, Y, and a, c, e, i, o, u and y or if there a time saving way of doing this, i'm already aware that this can be done automatically within Fontographer but due to the design and end usage of this font it has been neccacary to manually do this. <br>If anyone has any knowledge of how to do this the help would be greatly appreciated <br> <br>S*</p>
  html_clean: <p>Hi my name is Simon <br>This is my first post so Hello to everyone. <br>I was wondering If anyone could help me with a technical difficulty i'm having with Fontographer <br> <br>I am Kerning a font in Fontographer, and due to lack of tutorials or books on it am learning as i go. <br>So far have manually kerned all the pairs for an english alphabet but now need to work on the Accented charachters. <br>I'm wanting to know if i can pinch the exsisting kerning information from say 'A' and apply to � � � � and also with values  from C, E, I, N, O, U, Y, and a, c, e, i, o, u and y or if there a time saving way of doing this, i'm already aware that this can be done automatically within Fontographer but due to the design and end usage of this font it has been neccacary to manually do this. <br>If anyone has any knowledge of how to do this the help would be greatly appreciated <br> <br>S*</p>
