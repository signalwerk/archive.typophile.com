    html: "<p>I hope this doesn't sound like a dumb question, but 2500 is a very high number of kerning pairs: Did you work out your spacing using the sidebearings (i.e., the space on either side of each letter) before you started kerning? In other words, does your font look okay with the kerning turned off?  <br> <br>The reason I ask is that, with that many pairs just for A-Z and a-z, it sounds like you are trying to space the font using kerning instead of adjusting the sidebearings. I have seen beginners make this mistake before. If that's not the case, never mind.</p>"
    html_clean: "<p>I hope this doesn't sound like a dumb question, but 2500 is a very high number of kerning pairs: Did you work out your spacing using the sidebearings (i.e., the space on either side of each letter) before you started kerning? In other words, does your font look okay with the kerning turned off?  <br> <br>The reason I ask is that, with that many pairs just for A-Z and a-z, it sounds like you are trying to space the font using kerning instead of adjusting the sidebearings. I have seen beginners make this mistake before. If that's not the case, never mind.</p>"
