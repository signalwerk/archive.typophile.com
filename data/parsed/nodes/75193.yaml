    <p>//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////<br>
    <strong>SUDTIPOS OCTOBER NEWS --- CUPCAKE &amp; MONROE</strong><br>
    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////</p>
    <p>We are proud to announce the release of 2 new <strong>Sudtipos</strong> fonts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilecupcakemonroe_5759.jpg"></div><p></p>
    <p><strong>Cupcake</strong> &gt; <a href="http://new.myfonts.com/fonts/sudtipos/cupcake/" rel="nofollow">new.myfonts.com/fonts/sudtipos/cupcake/</a></p>
    <p>Cupcake is a font for those with a sweet tooth. It flares the taste buds with its creamy construct and makes them drool over a sandwich, a pasta, a cupcake, or a sweet beverage in your favourite café. Cupcake was designed specifically to appeal to the masses of the food and service industries. It covers all Latin-based languages.</p>
    <p><strong>Monroe</strong> &gt; <a href="http://new.myfonts.com/fonts/sudtipos/monroe/" rel="nofollow">new.myfonts.com/fonts/sudtipos/monroe/</a></p>
    <p>Monroe is Fashionable and Rocker, Monroe is a font that can be given different uses for its wide variety of alternate types, which makes it an ideal font for titles, magazines, posters, logos, etc. Its main virtue is the endless number of possibilities that the font gives to write a word, text or paragraph.</p>
    <p>For more of our fonts please visit<br>
    <a href="http://www.sudtipos.com/" rel="nofollow">www.sudtipos.com/</a></p>
