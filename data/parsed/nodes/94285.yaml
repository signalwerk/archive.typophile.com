  html: |-
    <p>The <a href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> will once again be holding its annual silent auction during <a href="http://www.typecon.com/" rel="nofollow">TypeCon2012</a> — raising funds for their various educational and community activities. We are looking for any typographic trinkets, knickknacks, bibelots, ornaments, baubles, objet d’art, collector’s items, rarities, curiosities, oddities, kickshaws, or tchotchkes that you’re ready to part with. Donating them to the auction and share your exceptional taste with other type aficionados and collectors. It’s also a perfect way to clear space on your shelves for new collectables. Above all, you’re helping support a great cause.</p>
    <p>Please email <a href="mailto:auction@typesociety.org?subject=My%20Typographic%20Treasure" rel="nofollow">auction@typesociety.org</a> with the following information:</p>
    <ol>
    <li>Item name and description</li>
    <li>Author/publisher/designer/etc.</li>
    <li>Estimated value</li>
    <li>An exciting blurb or personal anecdote about the item</li>
    <li>Photo (optional)</li>
    </ol>
    <p>If you’re attending TypeCon2012, you may bring your donation with you to the InterContinental Milwaukee Hotel and drop it off at the SOTA Store. If you can’t attend the conference, but would still like to donate items, please <a href="mailto:auction@typesociety.org?subject=SOTA%20Silent%20Auction%20Question" rel="nofollow">send us an email</a> to receive the official scoop on how to ship us your treasures.</p>
    <p>SOTA is a non-profit organization and all donations are tax deductible. Receipts can be issued upon request.</p>
    <p>Thanks in advance for your support!</p>
