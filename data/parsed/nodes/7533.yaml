    html: <p>Firstly, I don''t think that Israel has an attitude of "pay back" because of the Holocaust. Most of the population here come from Arab countries rather than Eastern Europe and don't even know what the Holocaust is so there goes that theory down the drain. <br> <br>Regarding the Armenian Genocide, half my staff is Armenian and we live in Israel and we don't ignore anything. <br> <br>Regarding the Palestinian people's right to live. Of course they do. And they have the same rights that I do, as a Jew living in Israel and you do living in the US. However, they don't have the right to blow up children at discos, or doctors at cafes, etc. Unfortunatly when Arafat (not sure if he is still alive at time of writing) sends (sent) out children (yes 15-year-olds) to blow up civilians in Jerusalem (which nearly happened today), then the rest of the Palestinian people are going to suffer the consequences. That may mean at shopping malls they will get searched more carefully, and it also may mean the Israeli soldiers may go through their houses in Jenin in order to find the minority of suicide bombers that want to kill us. However, please note that the Israeli army will do everything in it's power not to harm any civilians and invariably succeeds which is more than the American Army does (note recent events in the search for Bin Laden). <br> <br>Oh and finally, I worked for 3 years at the Jerusalem Post and although the editing and spelling may leave a lot to be desired, their reporting is damn good!</p>
