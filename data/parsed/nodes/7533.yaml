    html: "<p>Israel is the Jewish state. I will not shy away from being called anti-Semitic by opportunists and ignorants by saying \"Israel\" when I mean \"Jewish\". Yes, nations do exist, but so do peoples, and sometimes a nation is overwhelming the same as a people, overwhelmingly shares the people's attributes (no, we're not all the same - we just all deserve respect), for example the deep Jewish desire to avenge the Holocaust*. Japan for example has virtually no foreign population. So trying to differentiate between \"Japan\" and \"Japanese people\" is mostly pointless. But seeing problems in the ideology of a group of people is not the same as dicriminating against its individuals, which I don't do, and nobody should. <br> <br>* That's where the hubris is coming from: it's an over-reaction to thinking that everybody wants you dead. But 95% of people in the world simply want to live in comfort and decency. This includes Palestinians. When you take away their most basic rights, you're either hoping to exterminate them, or you have to be ready for them to try to kill you. The sooner Jews realize that eveybody on this planet is a person, that nobody is \"chosen\", that nobody really wants to kill for its own sake, then they will come back into the world's fold again. What they're doing now is acting exactly like the people who formed their contemporary, persecution-syndrome view: the Nazis; like father, like son. Advice from one ancient people to another: calm down. <br> <br>Individuals are not directly responsible for the actions of other individuals, but they most certainly should feel responsible for the mindset of their society - otherwise you get a bunch of selfish, petty monkeys. Muslim Americans for example are partly responsible for improving the lot of both the US and Muslim nations. I am responible for three nations. <br> <br>&gt; were you enslaved and murdered? <br> <br>I am Armenian. Our Genocide goes conveniently ignored by the likes of the US and -tellingly- Israel. Also, I grew up in Beirut, during the war. We had about 260 car bombs. My uncle was assasinated. I guarded my school one day a week from 2-4 AM. I was held by the Lebanese Army, after being shot at for being in the wrong place. My brother's car had bullet holes. Two guys tried to carjack my father, and failed when he swerved to make them fall out the doors. And this is all the tip of the iceberg of my youth experience. So I've seen -and felt- much more than you, don't worry. I get my views from the ground, not Fox News, al-Jazeera or the Jerusalem Post. <br> <br>hhp</p>"
