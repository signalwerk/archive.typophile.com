    html: |-
      <p>not to further hi-jack this great thread, but...</p>
      <p>the grey box thing is an .inx issue. the .inx file is just XML so when the file is opened, InD has to reconstruct everything, including the jpeg previews of all images. the fact that it doesn't retain the image info is actually a blessing because it's the only way to drastically reduce file size with an image-heavy doc.</p>
