    <p>The question is, on the surface, really a no brainer. The answer is use InDesign CS2. But let me tell you my problem and then hopefully some of you can give me experienced opinions.</p>
    <p>I have a client for whom I am to typeset/design 2 books. Previous to this the publisher which my client uses only had Quark 4. But, miracles do happen and they  upgraded. They now have InDesign CS1 and Quark 6. I have very little experience with the .INX file format as for all other clients I handle the printing and so don't need to save backwards.</p>
    <p>My question is this. If I do the books in InDesign CS2 and then export them as Interchange (.INX) files will the formatting be safe? Or should I just use Quark 6 and call it a day?</p>
    <p>Thanks!</p>
