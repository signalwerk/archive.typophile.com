    html: |-
      <p>Biddy - you must be at Berkley Books! LOL</p>
      <p>Meanwhile, just wanted to share that many times designers forget that they are working with outside suppliers. Many printers are scared of the "next" generation. When Quark 4 started working after the debugging (originally only page 1 would get screened and none of the other pages in the document would) and it worked well with Illustrator 5.5 and 6.0 and Photoshop 4 (or was that 5) the printers were celebrating. They had spent nearly 100 years getting their shops to perform efficiently -- and then technology showed up.</p>
      <p>I am on Quark 6 -- and with the printers I deal with, I would want no other program. I have InDesign here, and I have had to use it on occasion, but find it awkward. But that's me; after all, I was an original Beta and Gamma tester for Quark and have stayed loyal. I own Quark 7 -- but because my main printer doesn't own it yet - which means he does, but hasn't perfected it on his equipment yet -- there is no reason for me to move on at this point.</p>
      <p>I do know that one particular printer in Pennsylvania adores Indesign and has started insisting his customers all switch over. But it's odd. Most printers convert our files to .eps and onto .pdf -- and btw, Quark 7's pdf's are easily recognized by old equipment.</p>
      <p>Just my two cents worth.</p>
