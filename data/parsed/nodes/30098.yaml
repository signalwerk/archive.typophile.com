      <p>Patty, you sound just like me! Old dog -- comfy with System 9 -- Quark default go-to software. I live and work out in the boonies in complete isolation, and used to be able to take care of everything in system 9, trouble-shooting printing and the network, etc. Once I moved to X I lost all that ease, although I'm slowly learning X. </p>
