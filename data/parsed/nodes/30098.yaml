      <p><em>but I guess if you’re not doing a lot of Illustrator/Photoshop work, it probably isn’t a big deal.</em></p>
      <p>Au contraire mon freire! Live Trace in Illustrator has saved me HOURS of work; time I'd waste converting vector art in Flash. </p>
      <p><em>Biddy - you must be at Berkley Books! LOL</em></p>
      <p>Nope, one of the NY magazine publishers. They refused to switch to later versions of Quark because they were "too buggy." :)</p>
      <p>Back on the InD Quark debate: the both have their moments. I curse them both. Quark handles images (wrap around text) much better than InDesign. It drives me to distraction making clipping paths in Photoshop only then having to draw a vector outline in InDesign for my text. Much easier in Quark.</p>
      <p>No drop shadows in Quark (until v. 7). (BOO!) I like InD drop shadow feature, but they still have transparency issues when ripping to a printer of making a PDF. (DOUBLE BOO!) But the type...oh the type in InDesign makes all the headaches worth it. I've already gotten used to InD OpenType menu, and Quark JUST got one. Way to stay ahead of the curve. My evaluation: Quark for image based layout, InDesign for text based.</p>
