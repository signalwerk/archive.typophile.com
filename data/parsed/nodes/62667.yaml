      <p>Looking at some of the Sudtipos fonts at MyFonts, it's hard to believe it wasn't done by Angel Koziupa, as your first impulse suggested. Look how similar the lettering looks in <a href="http://new.myfonts.com/fonts/sudtipos/pronto/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Pronto</a>.There are others that are also very similar, just not this exact font (yet), in what I have seen.</p>
      <p>- Mike Yanega</p>
