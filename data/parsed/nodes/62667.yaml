      <p>Ex-Hallmark artist Rob Leuschke is a source of script styles that at times look like some of the Sudtipos collection. His <a href="http://new.myfonts.com/fonts/typesetit/qwigley-rob/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Qwigley</a> is somewhat like your sample. He does a lot of custom work, and this might be one of his.</p>
      <p>- Mike Yanega</p>
