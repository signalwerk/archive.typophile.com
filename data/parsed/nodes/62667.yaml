      <p>Looking at some of the Sudtipos fonts at MyFonts, it's hard to believe it wasn't done by Angel Koziupa, as your first impulse suggested. Look how similar the lettering looks in <a class="freelinking external" href="http://new.myfonts.com/fonts/sudtipos/pronto/" rel="nofollow">Pronto</a>.There are others that are also very similar, just not this exact font (yet), in what I have seen.</p>
      <p>- Mike Yanega</p>
