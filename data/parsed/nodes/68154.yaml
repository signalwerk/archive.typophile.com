    <p>I've designed a logo which uses House Girard, but due to their ridiculous EULA I can't even dream up to money to pay for it. It's a perfect script font but still remains ledgible. The main thing is the S looks like an S and the r looks like an r without loops and frills but still has an elegant quality to it. I have searched through so many script fonts and not come up with anything of a similar quality.</p>
    <p>ANY suggestions are welcome.</p>
