      <p>Interestingly, I thought the Girard Script 'r' looks like a 'v', at least when it's by itself, but I agree the script easy to read and the way it partially connects is nicely done. Their OpenType ligatures are usually well-implemented. </p>
      <p>If you are still considering alternatives I like a couple of  Victor De Castro's handwritten fonts: <a class="freelinking external" href="http://www.unifonts.com/h_family/hudsonfam.htm" rel="nofollow">Hudson</a>, <a class="freelinking external" href="http://www.unifonts.com/h_family/hudsonserifam.htm" rel="nofollow">Hudson Serif</a> and <a class="freelinking external" href="http://www.unifonts.com/a_family/arturisfam.htm" rel="nofollow">Arturis</a>. One thing I like about these is they are not often seen (where House fonts can become trendy, like Neutraface and Chalet) and they seem to blend a casual quality with a professional lettering skill, not always an easy balance to find. I use Arturis and Hudson Serif a lot myself.</p>
      <p>- Mike Yanega</p>
