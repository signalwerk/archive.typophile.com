    html: <p>In the case of monk-generated manuscripts, I have seen some that approach justification through just ending one line in the middle of a word, and then continuing to the next. And then there are the books set entirely without word spacing. I tend to think these were do to semi-literate monks who merely copied letter after letter, without understanding the concept of words.</p>
