  html: |-
    <p>Hi,</p>
    <p>I'm a graphic design student researching justified text, and wondered if anybody knew of some examples of brilliant (or terrible!) justified text? Previous forums have discussed whether it's a good idea or not, but I'm really looking for real examples of successful justification (possibly including pre-computers and pre-type, as one forum entry mentioned manuscripts written by monks).   If anybody could recommend some books too, that'd be great.</p>
    <p>Cheers!</p>
