    html: |-
      <p>You would be well-served to research not only examples of good justification, but also technique, everything from abbreviation to glyph scaling, from Johannes Gutenberg to Hàn Thế Thành.</p>
      <p>There are some useful links in this thread: <a href="http://typophile.com/node/64375" title="http://typophile.com/node/64375">http://typophile.com/node/64375</a></p>
      <p>Your research would also not be complete without noting Eric Gill's dissension as to the wisdom of justified text, which can be found in §6 of <em>An Essay on Typography.</em></p>
      <p>If you want to see what a modern justification engine is capable of, you can read the documentation for the <code>microtype</code> package in LaTeX: <a class="freelinking external" href="http://www.tex.ac.uk/tex-archive/macros/latex/contrib/microtype/microtype.pdf" rel="nofollow">microtype.pdf</a>. Even if you read the section headings and nothing else, it will give you the vocabulary to describe what such software is capable of.</p>
      <p>The following figure illustrates what can be accomplished with tracking alone (for good or ill).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/microtype_package_4254.png"></div><p></p>
