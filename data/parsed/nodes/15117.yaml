  html: <p>Trying to figure out the logo used by <a href="http://www.mozilla.org/" rel="nofollow">the Mozilla Foundation</a>. I thought it was Officina Sans, but Officina Sans has a serif on the lowercase "i" and the Mozilla logo doesn't.</p>
