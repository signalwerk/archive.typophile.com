      <p>Take also a look at <strong><a class="freelinking external" href="http://www.foundrytypes.co.uk/the-foundry-typefaces/architype-collections/params/architype-universal/opentype/level-1/tschichold" rel="nofollow">Architype Tschichold</a></strong> by "The Foundry"<br>
      (capital |E| and OSF Digits are also included)</p>
      <p>Here is an extract from their site</p>
      <blockquote><p>Architype Tschichold is a faithful rendering of Jan Tschichold's 1929 experimental alphabet which was influenced by Bayer's single-alphabet. His design was never put into production. This re-creates his original geometrically constructed design, including some phonetic characters.</p></blockquote>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
