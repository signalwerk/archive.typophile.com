  html: '<p>INTRODUCTION <br> <br>Van is a Sans-Serif  typography with a geometric style. <br>This version is expanded and don´t have contrast between the <br>different types of strokes, giving a uniform esthetic and visual in <br>each character, word or a column of text. <br>The family of  van typography that is constitued by two different <br>width: normal and condensed wich one have the versions: Ultra Light, Light, Regular, Medium, Bold and all the respectives italics versions. I designed and plannificated this <br>typography to use as text and display but I think that they must be <br>corrected to use as font screen because some caracters have more <br>visual impact that others like for exemple LC-V, E, M, Z and SC-a, y. <br>Figures 5, 6, 9. All the critics are welcome to corrected and fininshed the work.GIF / JPG: <br><img src="http://www.typophile.com/forums/messages/29/236.jpg" alt="Text Description"></p>'
