    html: "<p> Pretty nice! <br>I especially like the lightest weight - very elegant. And the design as a whole has an appealing individuality without being strange. The only glyph that I didn't like was the lc \"g\": although the open-bottom bicameral \"g\" is my favorite form of that letter, I think the head needs to be bigger, to match the style of the lc \"a\" and lc \"e\", for example. <br> <br>Keep it up, <br>Hrant </p>"
