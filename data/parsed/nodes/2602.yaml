    date: 2001-07-09T23:11:00
    votes: null
    html: <p> Van seems to be coming along nicely. It has some nice nuances. I'm liking the condensed regular italic a lot. <br> <br>The particulars of the face aside, however, I've been thinking about some advice I once heard that might be useful--depending on how complete your font is I guess. <br> <br>The gist of the advice was that it's best not to pursue multiple weights of a face until you have the main weight completed and polished. And only when it's complete would you translate it to other weights or widths (bold, light, condensed, etc.) <br> <br>I'm curious. Would others agree with this advice in general? Would you agree in the case of Ricardo's Van? If you were planning a font with lots of weights and/or widths, would you start with the regular weight? <br> <br>//joe </p>
  - id: 20866
    user_id: 897
    user_name: objekt
    user_path: null
    user_image: null
    date_raw: 10 Jul 2001 — 7:08am
    date: 2001-07-10T07:08:00
    votes: null
    html: <p> Joe, <br> <br>In general, yes because it's a pain to fix multiple faces if you decide after the fact to make changes. Shouldn't the purpose of the typefaces dictate their development? For instance if you're designing a display face with a corresponding text version, doesn't it make sense to not go too far with either one before working on the other? </p>
  - id: 140051
    user_id: 1203
    user_name: anonymous
    user_path: null
    user_image: null
    date_raw: 10 Jul 2001 — 10:39am
    date: 2001-07-10T10:39:00
    votes: null
    html: "<p>In fact you are totally correct, in this moment it's the way that i prefer to work starting by regular and italic versions to create the others weights (form/space). But Van was a special case, I had to draw all weights because the limits of the letters round  - like I show in this last exemple. <br>If I created the other weight from the regular version using Fontographer, all that round properties would be destroyed with the transformation, so I prefered to make myself all. <br>Did you notice any strange differnces between the weights? <br>Thank's for attention Joe / Hrant / Objeckt <br> <br>Best Regards_Ricardo <br>GIF / JPG: <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"1,Text Description\"></p>"
