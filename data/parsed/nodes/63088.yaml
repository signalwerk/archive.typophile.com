  html: |-
    <p>Fontsmith has created a new thought-provoking typeface – FS Conrad, for British artist Conrad Shawcross and his forthcoming installation work Chord which is due to open this month at the Kingsway Tram Subway in Holborn, London. </p>
    <p>His latest work Chord has seen him build two identical rope machines that move away from each other whilst weaving a thick rope from spools of coloured string. </p>
    <p>Chord is considered to be a strong structural metaphor that is concerned with the human perception of time and it promises to be a highly talked about event within the London art scene.</p>
    <p>In response to Conrad's artwork, Fontsmith type designer Phil Garnham has created FS Conrad, an intricate display typeface composed of fine parallel lines that overlap to create a multilayered texture within words. These fine lines combine to meet at a central point in each letter, creating a striking design with a level of detail that is not often seen in the headline typefaces of today.</p>
    <p>http://www.fontsmith.com/about/news/fs-conrad.cfm</p><div class="imageWrap"><img src="http://typophile.com/files/News_Conrad_5121.jpg"></div><p></p>
