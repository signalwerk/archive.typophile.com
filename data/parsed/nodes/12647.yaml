    <p>Was playing around today instead of getting ready for a pitch.</p>
    <p>Came up with a few type treatments, based on exisiting or heavily modified fonts -- not sure what to do with them, maybe tshirts? I am seriously getting tired with clip-art and faux naive illustration art tshirts. </p>
    <p>Need more, solid, type treatments on t-shirts in the future, mayhaps?</p>
    <p>I dunno.</p>
    <p>Do tell me what you think!</p>
