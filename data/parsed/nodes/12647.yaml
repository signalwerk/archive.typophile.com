    html: |-
      <p>Thanks Dan</p>
      <p>Yeah, the stuff is pretty tight. I really was going for a very tight, tube-socks look. But, there is a question of balance that needs to be addressed.</p>
      <p>I think the kerning in the 70s was so tight, partly because of the jeans. There was a subconsious need to keep everything 'packed in' due in part to the tightening in their crotches!</p>
