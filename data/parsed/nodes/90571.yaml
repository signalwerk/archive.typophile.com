    html: |-
      <p>Font Book may not be perfect, but I've regretted every third-party utility I've installed, especially when they turn out to have their own little quirks that make hours of work counterproductive (such as destroying previous organization). Linotype FontExplorer™ X was the least irritating, and I've never fully recovered from installing it.<br>
         There's no reason they should slow down your computer after they "load" (when the software launches), which takes a few extra moments, but if you have to stop and find and then activate fonts when you need them, it may be more distracting and time consuming.<br>
        Another possibility: less may be more. There may be such a thing as too many fonts (just to kick off the discussion).</p>
