  html: |-
    <p>Is there anyway to quickly clean a large font collection? At work they use suitcase so they dont have the problem with thousands of fonts loading up at the same time, but as i am the only one using a mac they won't buy me a suitcase licence and not sure that i want to spend $99 on it.</p>
    <p>Any other quick way to clean a collection of around 1900 fonts without just using font book to sort them into folders? As that would take forever and also won't easily solve the loading of thousands of fonts problem, i don't think it's slowing my mac at the moment but could do in the future and i don't like it all being so un-organised.</p>
