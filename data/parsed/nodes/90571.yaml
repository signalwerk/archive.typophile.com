      <p>Yeah i guess less is more, but with my job i need access to as many fonts as possible really, which is why other people at work use suitcase, for all the different styles. I did try installing the demo of suitcase the other day, but decided to get rid of it pretty much straight away which then made me need to re-install illustrator because of errors which was frustrating.</p>
      <p>I guess my best option is to get an SSD so it will all load up faster, just a bit pricey though.</p>
