      <p>Using <a href="http://earthlingsoft.net/UnicodeChecker/" rel="nofollow">UnicodeChecker</a> on the Mac, I find this symbol in Apple Symbol (serifs), Arial Unicode MS (oddly, also with serifs -- don't the MS type designers know a serif from a sans?), Code2000, Geneva (finally as a sans!), and ... in Helvetica!</p>
      <p>Unfortunately, since you are on Windows: this Helvetica is an Apple dfont that came with the system: "© 1990-2006 Apple Computer Inc. © 1981 Linotype AG © 1990-91 Type Solutions Inc.", v. 6.1d18e1.</p>
