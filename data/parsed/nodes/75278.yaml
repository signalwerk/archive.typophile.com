    html: |-
      <p>thanks.</p>
      <p>GDandT doesn't have it, but it would be a good font to have included it<br>
      I haven't looked at Code2000 but I will when I get home.</p>
      <p>I thought Sego was a bundled Windows font, but I don't have it.  Hmm...</p>
      <p>the symbol is in Cambia Math alright, but it is out of proportion with the rest of the font. With the symbol at 9 points it is the same saze as the rest of the font at 11 points. I also think the symbol looks kind of goofy with serifs, but maybe that's just me.</p>
      <p>I took the time to do what I could have done bearlier and scrolled though all the fonts on this computer.</p>
      <p>Here's what I found:</p>
      <p>Arial Unicode has a serifed centre-line symbol (why serifs?)<br>
      Cambria Math<br>
      Isocp (CAD font*)<br>
      Isoteur (CAD font)<br>
      Roman S (a monoline serif CAD font made of  multiple line segments )<br>
      Simplex (sans serif CAD font made of multiple line segments )</p>
      <p>Palitino shows a nice little spiral for that glyph.</p>
      <p>This is for dimensions and specs on shop drawings, for which I perfer a sans serif. I tend to use Calibri.</p>
