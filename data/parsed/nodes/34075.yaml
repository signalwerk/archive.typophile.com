    <p>I posted this on the design forum so sorry if anyone has read it.<br>
    --</p>
    <p>Hello fellow typophiles!<br>
    Not sure about you lot but when I left<br>
    my undergraduate studies I was charged up with<br>
    motivation and vigour and ready to set the world on<br>
    fire with my typographic innovation.<br>
    But six years have passed and I have had a wide variety<br>
    of experience from major UK publishers to music magazines<br>
    to starting my own practice.<br>
    and I have only used vetica 3 times!</p>
    <p>But I have reached a stage where I need some new<br>
    direction / inspiration [you know what I mean]<br>
    As a result I have been thinking about doing a<br>
    a sagmeister and having a year without clients /<br>
    re-exploring what got me excited about typo-based-graphic-design<br>
    in the first place.<br>
    so I was thinking about working toward doing some post graduate<br>
    studies / locking myself in the shed with a laptop and a printer<br>
    for a year…<br>
    Can anybody advise on what they would do /<br>
    what schools to look at<br>
    [as you only get one chance and it costs you a lot of cash]<br>
    I love European typography<br>
    and can’t get enough of Berlin</p>
    <p>But this looks pretty mental</p>
    <p><a href="http://www.werkplaatstypografie.org/" title="http://www.werkplaatstypografie.org/">http://www.werkplaatstypografie.org/</a></p>
    <p>I know others out there are thinking the same<br>
    where did the enthusiasm go</p>
    <p>any advice or discussion would<br>
    be greatly appreciated</p>
    <p>Simon</p>
