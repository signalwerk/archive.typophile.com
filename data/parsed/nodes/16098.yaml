      <p>Thanks Sim, I will try the single storey g. It may fit well on this font.</p>
      <p>See, I've heard (and proved this in practice) that typedesign is 10% inspirarion (designing the concept) and 90% transpiration (the hard work on extending the concept over the entire font). Keeping this is mind, before I start designing the rest of the characters, I've made another version of n o a h, with shapes more fluid, really display like. You can compare this new version with the old one on this pdf ( <a href="http://www.focodesign.art.br/bytype/After_03_04.pdf" title="www.focodesign.art.br/bytype/After_03_04.pdf">www.focodesign.art.br/bytype/After_03_04.pdf</a> )</p>
      <p>Looking at a distance now, version 3 lowercases seem too rounded and "correct", like a text font lower characters. They don't seem to match the wildness of the cap A.<br>
      Version 4 have some straight angles and fits better with the cap A (my reference for inspiration).</p>
      <p>I'm stuck on this doubt...</p>
      <p>What do you think? I would reaaally appreciate everyones opinion...</p>
      <p>thks<br>
      Fabio</p>
