      <p>Hi Sim!</p>
      <p>About that 4th version you appreciated most... don't you think it is too similar as Dax, wich is beeing too used? Those lowercases have the same principles. And, since this my attempt is to project a display face, that needs to "call attention to itself" I guess it needs to differenciate as much as it can. I think the cut angles mixed wth some curve ones gives the characters a more particular feeling and contrast.<br>
      But I will for sure keep those characters for further development later.</p>
