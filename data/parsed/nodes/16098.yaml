    <p>Hi there!!!</p>
    <p>Some of you may remember a typeface I posted for critique about two years ago ( <a href="http://typophile.com/node/722" title="http://typophile.com/node/722">http://typophile.com/node/722</a> )</p>
    <p>I'm beginning a new font, base on the upper A of that old attempt.</p>
    <p>I guess the reason I couldn't finish that first one was because the form of the characters were too unusual, and togheter, they didn't match and were too uneven.</p>
    <p>On my new shoot, I'm thinking about making more usual forms, and having the "opened and fresh look" only on some single characters...like A a g (for now)</p>
    <p>Anyway... this is my first roughs on the computer:</p>
    <p>What do you think?</p>
    <p>thks a lot!!</p>
