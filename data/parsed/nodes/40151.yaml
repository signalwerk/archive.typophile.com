      <p><cite>wasn’t the only type . . .</cite> Hell, they are almost all bad this way. Not only the overall thinness, but the contrast between the thick &amp; thin strokes. With letterpress, the fine lines of the metal bit into the paper a little more, lessening the contrast.</p>
      <p>Part of it was rushing. Janson went from the most popular (2nd most popular?) Linotype font in the linecaster days to “not used” in the Linotron 202. The lower-case “oh” looked like two small parentheses. Janson Text was a partial fix. It took me three solid weeks to get a Janson I liked. </p>
      <p>If your license allows, you can fix most of them. Centaur would be one of the tougher ones, as getting the contrast right is quite important. We had designers keep using it in spite of my objections. Finally my business partner said we had to do something, so I just emboldened it in Fontographer — about 3-4 units, as I remember. Not a cure, just a band-aid. I got stubborn &amp; decided not to spend the hours needed to re-work the contrast, esp. since in metal varied a fair bit. Perpetua is similar. The 14-point master was about the smallest that would work. Now you get people wanting to use it at text sizes. To do that correctly would involve reinventing the font, as it just wasn’t originally meant to be used that way. A lot of work &amp; probably no one would be pleased.</p>
      <p>There is a lot to recommend in many of the older metal faces. Just remember that Linotype &amp; Monotype, by in large, never made good versions of the metal fonts for photocomp, early digital, or PostScript. By the 70s &amp; 80s, they were being sold &amp; sold again to companies looking only at the profit line.</p>
      <p>If you have the patience, you can rework them for your own use, and they will rival or exceed most of the new stuff.</p>
      <p>Just a old 20th century guy’s opinion.</p>
