      <p><cite>It always baffles me how major foundries, able to afford the best brains in the business, could blunder so spectacularly.</cite></p>
      <p>They rushed. Everyone wanted get those photo types out fast, before the other guys ate up all of the sales. It happened again with the digital fonts, and in some really awful cases, crummy phototypes got digitized because nobody went back to the metal.</p>
