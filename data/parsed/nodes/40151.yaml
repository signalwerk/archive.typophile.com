      <p>Further to Tiffany’s point:</p>
      <p>In the mid-1970s there was a photo-type version of Centaur that did not suffer from this thin-ness, so characteristic of many photo and digital versions of metal types. Centaur suffered more than most.</p>
      <p>This version was made by proofing the entire Monotype hot-metal character set on newsprint, rather than on the hard, impermeable repro paper commonly used. The ink seeped into the paper, gathering weight. These proofs were then used as the basis for that version of Centaur. I do not know what company made this. It may have been a proprietary version for a particular typesetting shop.</p>
      <p>powers</p>
