    <p>Hi everyone, I’m a new guy.<br>
    Because I’m Japanese, I’m sorry for poor use of English.</p>
    <p>I am researching about Centaur, and I can’t find an answer about why digital Centaur is so thin compared to that of metal type. Can anyone tell me what happened to Centaur?</p>
