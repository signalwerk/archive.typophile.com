      <p><em>They rushed.</em></p>
      <p>Nonetheless, they thought they were doing a good job.</p>
      <p>It’s easy with hindsight to see how we went from A to B, but what if we had gone to X instead?<br>
      There were many aspects of the high resolution, digital workflow that we had to come to terms with.</p>
      <p>During the early 1990s there was a vogue for ITC Garamond Light Condensed in graphics (and other) publications such as catalogues. It was set small and tight, very tidy. Now, that would have been problematic with the previous generation of phototype technology, because the fine details of that typeface tended to vanish as it was reproduced photographically several times during the production process. So here was a new look—and the high res digital workflow also made using Helvetica 25 and 35 practical at smaller sizes. Who was to say that “squishy” letterpress gain would be required in the digital age? Wouldn’t that be like faking the sound of original instruments in a Baroque recording? Bauer Bodoni was another typeface that was popular for text in the early days of digital; it certainly looked a bit anemic to me, but a lot of people were attracted to its extremely fine details. The novelty appealed, perhaps, and the thrall of high-tech slickness.</p>
      <p>And unless a typeface was produced with size-specific variations, a version that corresponded to a “middle size” was appropriate for use in deck and display settings, as well as printed on a 300 dpi laser printer.</p>
      <p>There were foundries producing size-specific fonts from the early days of digital type—those that catered to magazines and newspapers, such as Font Bureau and Hoefler of course, and many other type designers, myself included, were wrestling with the problem of getting the classic letterpress genre of text typefaces to look good in the high res environment. But it’s not a simple task—making Jenson look good in successive waves of technology is the grail of typography.</p>
