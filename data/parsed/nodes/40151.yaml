      <p>Tosche</p>
      <p>To respond to your question I would suggest that Centaur is likely as it is supposed to be (though it was likely patterned after photofilm renditions rather than metal). The difference between the digital and the metal would be that you are looking at, in the latter, are specimens of the face as printed with a process that has inherent weight added to it (via ink spread and the optical additive of impression). Easily 5% at minimum.</p>
      <p>The original designs are themselves rather thin in the Monotype metal version. And, it was a very poorly structured face in that regard as it does not hold up well under repeated printing (letterpress). The digital version, printed via the photopolymer plate process has much more strength but this is due to the differing relief structure.</p>
      <p>In terms of a digital typeface per se, well you can’t always get what you want, especially when differing type production technologies are involved.</p>
      <p>Gerald</p>
