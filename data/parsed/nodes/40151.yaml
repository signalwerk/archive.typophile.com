      <p>&gt;The 14-point master was about the smallest that would work. Now you get people wanting to use it at text sizes. To do that correctly would involve reinventing the font, as it just wasn’t originally meant to be used that way. A lot of work &amp; probably no one would be pleased.</p>
      <p>I think Charles has really nailed it in the above. I have found in my revival of Caslon that the contrast issue is one of the most important to getting the warmth of older metal type, and it requires creative effort to get a good result. (I discussed this in my talk at TypeCon 2006.) As Charles says, 14 point is not in fact a text size. I believe that using 14 point metal masters is one reason why so many initial digital versions of classics were anemic when used in text (9-12 pt). </p>
      <p>I know from his posts here at Typophile the Raph Levien also has had the ambition of producing a text Centaur, but I don’t know how far he has gotten with it. He says <a class="freelinking-external" href="http://levien.com/type/myfonts/">here</a>, where you can see a sample, that he expects it will take him years to get it right.</p>
