      <p>Tosche</p>
      <p>First of all, don’t look only at drawings. Look at printed work, and “real” books are often more helpful than specimen sheets.</p>
      <p>Maybe what shows on the screen with your example is just an artifact of getting them on the screen, but if you look at a printed letter (printed letterpress), there will be a blacker ring around the outside of the letter, and the center of each stroke will be a touch lighter.</p>
      <p>You probably know how Monotype made their matrices, so at one level, replicating the drawings may simply replicate the problem. The drawings used as templates also had to allow for “ink squish,” what we want is the letterform after it was printed.</p>
      <p>An expensive book, but worth it to some one in your situation, is Fred Smeijers <cite>Counterpunch</cite> from the Hyphen Press. You are in effect making a digital punch, and the thinking is the same as for someone making a metal punch.</p>
      <p>In passing, 14-point is on the upper edge of text size. Monotype sizes were a little smaller than Linotype, but in the earlier photocomp days, Linotype would use a 12-point master for “text” fonts, this being a compromise between most test sizes (8-10) and, lets, say, subhead/chapter head sizes (12-20+ points).</p>
      <p>But is is the <cite>design</cite> of the letterform that is most important, not its nominal size — of course, ther is usually a strong correlation here.</p>
