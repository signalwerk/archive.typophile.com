      <p>I still have a lot of that old stuff from the Seventies and Eighties--french curves, ellipse templates, eraser guides, dividers...</p>
      <p>The little Mac in the museum is appropriate in my case: On my first Mac, before DTP software was invented, I set up a spreadsheet in Microsoft Multiplan (the predecessor to Excel) to calculate run-arounds and mortise cuts for spec'ing type for layouts and other copyfitting tasks at the magazine I worked at. I also did thumbnail layouts and other preliminary design stuff in MacPaint. I had one of those famous Mac bags and lugged the thing back and forth to work every day. The idea of a company putting a computer on an art director's desk hadn't come yet, but they didn't mind if I brought one from home.</p>
