      <p><cite>I was forced to work with some of this “tools” on the first three semesters of graphic design scool altough I started doing some “design” in highschool with word and as a kid with paint.</cite></p>
      <p>My first exposure to tools like these came from my elementary-school classes in Mechanical Drawing (alternating with Woodshop) back in the 60's. I developed a chronic obsession with drawing tools, and the years I spent working in a graphic arts house with all the implements we've been reminiscing about were among the most intensely satisfying of my adult life -- with regard to office supplies, anyway.</p>
      <p>I learned a lot from those years, including the trick of using non-repro blue pens to annotate books and photocopies, in case I want to make copies for my students (and don't want them to know what I thought noteworthy). It's been years, though, since I talked to an art supplies store clerk who knew what "non-repro blue" means; I have to track down the correct shade from the shelf myself.</p>
