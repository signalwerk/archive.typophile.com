    <p>Anybody over 35 will recognize at least a few of these... the rest of you kids just appreciate how good you've had it. On the other hand you'll all be wearing glasses by 30.</p>
    <p><a href="http://www.drawger.com/show.php?show_id=32" title="http://www.drawger.com/show.php?show_id=32">http://www.drawger.com/show.php?show_id=32</a></p>
    <p>Loupes, brayers, rubylith, proportion wheels, haberrules, rubber cement thinner, rapidographs, and my sentimental favorite, the stat camera which launched my career. Another 80s artifact was the fact that my "office" became an after-hours hangout when the designers and A.D.s would come in to take advantage of the privacy and the large plate glass. Use your imagination.</p>
