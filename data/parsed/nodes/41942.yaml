      <p>Ok,<br>
      I'm not always smart, I never figured out how to use a percentage scale. However, I learned better that still helps me out today, a calculator and this formula:<br>
      desired size / actual size.<br>
      Works in every type of measurement too. No round scale for me, no way! I'm modern!</p>
      <p>Remember rubboff type, kinda like custom Letraset? I did a lot of that, talk about bestine cocktail X8! </p>
      <p>Where is the fat type specimen? You know, the ones with all the funny numbers to spec type with usually 1,500-3,000 fonts? Then the one line specimens? I speced type too, you digital sons of a guns, who never had to do that!</p>
