    html: |-
      <p>By an odd grace I skipped over all that stuff, even though I've been in this racket 40 years. I went from a letterpress composing room and pressroom right to a Macintosh in 1988. I knew all that stuff was out there, but it was never used in any shop I worked in. I have a drawer full of it here, though, for my predecessor was in this office for 30 years, and he left it all behind, even color charts from before the days of the zip code. &amp; a slide rule!</p>
      <p>I have made maybe 3 mechanicals in my life. When that necessity arose I took a shirt cardboard, squared it up on the kitchen counter, and attempted to paste things down straight with a carpenter's square and whatever glue was around the house.</p>
      <p>And I am really glad I did not have to do that, for I am too clumsy. I could work well with small bits of metal type, and I loved it. But all that thin paper, good lord, what a time I had with it.</p>
      <p>I still do keep a sandpaper block on my desk to sharpen that red pen when I mark proofs, though.</p>
      <p>powers</p>
