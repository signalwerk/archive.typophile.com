      <p>My eyes ! Flaming icons, ouch, ouch !</p>
      <p>Seriously, having two icon types doesn't add anything in terms of usability, but it does add extra visual noise that detracts from the content. I doubt many people care whether the topic is "hot" or not, especially considering that the thread message count is right there, 400px to the right.</p>
      <p>Icons are also way too contrast. I would rather have <a class="freelinking external" href="http://swapped.cc/stuff/tmp/typophile-1-b.png" rel="nofollow">something like this</a>, more calm and restrained.</p>
      <p>The replacement of "(xx new)" links with just "xx" does not seem to be a very good idea either. Even after I managed to realize that "xx" <em>is</em> a link (which is damn hard to do on an uncalibrated laptop monitor), I still had to overcome my arthritis, carpal syndrome and hangover shakes to aim at that ultra minuscule <strong>1</strong> that is now all that's left from a link.</p>
