      <p>&gt;"The goal was to improve the tracker speed by at least an order of magnitude." </p>
      <p>Really? "An order of magnitude difference between two values is a factor of 10." That' far exceeds Moore's Law. (According to Moore's Law, computer power doubles every 18 months.)</p>
