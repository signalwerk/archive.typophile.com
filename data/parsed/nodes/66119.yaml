      'My program could ran faster if it didn't have to give the right results.'"</p>
      <p>And that reminds me when, decades ago, I told a sales person, "I can get it for $XX less elsewhere." He responded, "Well, why don't you buy it elsewhere?" to which I replied, "They're out of stock." The Response? "I can sell it for half their price when I'm out of stock." Ouch!</p>
      <p>If I've been less than kind, I apologize. It's that I expect a lot from Typophile, and I want you all to look good.</p>
      <p>Keep on keepin' on.</p>
