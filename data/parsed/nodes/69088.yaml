      <p><em>... Eurocase fonts ... </em></p>
      <p>AFAIK, it's my idea (but your name!), although I haven't actually produced any fonts with <strong>only</strong> the unicase LCG glyphs. I suppose to be really hardcore, the common glyphs should have multiple Unicodes. I'm not sure how well that would be supported by layout applications.</p>
      <p>**</p>
      <p>I suspect there may be a few typefaces with Greek Unicase. Any Cyrillic unicase fonts?</p>
      <p>For Greek especially, it seems that a lot is dependent on the typeface. The balance of upper and lower case letter forms that one seeks in a unicase typeface varies considerably from sans to serif: the typical Greek sans serif lower case glyphs are much more similar to the upper case than their serifed counterparts.</p>
