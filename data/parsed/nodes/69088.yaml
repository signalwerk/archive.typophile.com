      <p>It is possible to reduce the main Latin, Cyrillic, and Greek language scripts to 53 alphabetic glyphs.<br>
      The font would be unicase, with many glyphs doing double or triple duty.<br>
      The Latin unicase follows Thompson's model, the Cyrillic is a no-brainer, and the Greek my own invention (as implemented in Scotch Modern Display, which is the font used in the diagram).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LCG_5147.png"></div><p></p>
