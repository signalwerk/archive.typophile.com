      <p>You're right Kevin, no epsilon, what was I thinking?!<br>
      It's in the font, I just forgot to include it in the diagram; it should go with the red letters at the bottom.</p>
      <p>I wouldn't want to abandon unicase "m", because Thompson really is very effective, without it Alphabet 26 veers too much towards upper case.</p>
      <p><em>...you could replace Y with У, and w with ω...</em></p>
      <p>True, but I find the lower case shape of У looks too "small" for the Latin unicase, and ω doesn't fit this style.<br>
      Perhaps in another typeface it would be possible to reduce the number of glyphs still further.</p>
      <p>Here are the Latin and Greek unicase alphabets, compared with small caps.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/uni3_6139.png"></div><p></p>
