    html: |-
      <p><cite>We have a solution in search of a problem.</cite></p>
      <p>Well put!</p>
      <p>But there is, I think, a serious core in this witty debate. It’s about “how to make things easier and more simple“. Which is a legitimate approach in general.<br>
      I remember a saying (from who?): “ things should be as simple as possible but not simpler than that.” – and there it gets interesting. Killing c and q and v is a nice exercise of the mind but of virtual no relevance to practice. But: “how can I make a L-G-C font more efficiently?” IS of practical relevance.</p>
      <p>Latin and Cyrillic sprang off the Greek alphabet Hundreds of years ago, yet remained close relative all the time. Now we face the novelty of the three re-united in one single lettercase. That raises the question of practical rationalization and aesthetic harmonization (or however you wish to call it), this is only consequential in my eyes.</p>
