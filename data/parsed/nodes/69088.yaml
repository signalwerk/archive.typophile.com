      <p>One could place the uncial shape for e/epsilon, which should be acceptable for Cyrillic as well, in the centre. Omega as w is hurting. And the v-glyph for Nu …?<br>
      U serving as ‘Upsilon’ doesn’t satisfy me. It seems illogical to me not to unify y and upsilon.<br>
      However, I would definitely unify the Greek-Cyrillic lambda and delta (triangular shapes) and also tri-unify the M.<br>
      And if it’s to serve not only major languages, two Serbian letters would have to be added on the Cyrillic side; the same for Eth and Thorn and Eng in Latin.</p>
      <p>How many Eurocase fonts are on the market already?</p>
      <p><cite>… fine without J and V</cite></p>
      <p>than please kill U and W too.</p>
