    <p>It's occurred to me that there are just way too many different languages, and way too many different characters in each language. </p>
    <p>Why are there so many glyphs in a font?</p>
    <p>Wouldn't it be nice if ALL languages narrowed it down to just two glyphs? </p>
    <p>I was thinking maybe a simple zero and a one. </p>
    <p>That should be enough to communicate just about anything, don't ya think?</p>
