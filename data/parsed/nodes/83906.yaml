    html: |-
      <p>You have to click in the upper right corner of CS5. You get a dialogue where you see »OpenType«. You have to unclick the button »swash alternates«, »alternate figures« or else. (Don’t know exactly how this is called in english). MS Word hasn’t any access to the alternates. </p>
      <p>If you would like to use some of the alternate figures go into the glyph palette and choose the glyph you like.</p>
