    <p>Hi..</p>
    <p>I used the font Feel Script (.otf) for my friend's wedding invitation but when I was drafting it in CS5, i don't know why it has sloops in every letter.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cs5_4662.png"></div><p></p>
    <p>But when I checked it on MS office Word, it's as plain as the basic roman letters.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Ms office_4673.png"></div><p></p>
    <p>I just can't figure out if there is a software needed to which i could combine the sloops and basic roman letters, like the one's designers do.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/feel_3807.png"></div><p></p>
    <p>Thank you so much..</p>
