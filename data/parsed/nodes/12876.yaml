  html: |-
    <p>The new <a href="/wiki/TypeOff" class="freelinking" rel="nofollow">TypeOff</a> website launched today. Although it is mostly in German, I still recommend a visit. Some posts are in english, for instance the site's dedication piece.* We reformatted the site; it is now a blog of sorts. All seven members of the collective act as authors. We are pleased to finally offer comments as a feature, even though the whole concept of comments and interactivity is so not new. Even those who cannot read German at all are invited to post comments. More interesting that way. We also added an RSS feed.</p>
    <p>Anyway, let me know what you think!</p>
    <p><a href="http://www.typeoff.de" rel="nofollow">http://www.typeoff.de</a></p>
    <p>*The new site is dedicated to Filip Blazek ;-) Visit us and find out why.</p>
