  html: |-
    <p>Hello!<br>
    Today my fonts Newt Serif and Solveig (previously only on Veer) are now available on MyFonts. I'm excited to have them out now on the biggest font repository around, for everyone to see. I hope they do well in their new environment. To celebrate the move (and, no secret, to try to kick-start them onto the bestseller list), I'm holding an <strong>87½ percent off sale</strong> (they're 1/8 the price). That puts these fonts squarely in the reach of casual font enthusiasts who can't afford to buy a font at design-firm-geared prices just to use for their own purposes. If that describes you — or, in fact, even if it doesn't — hurry over to MyFonts for these two fonts. Thanks, and I hope you like them!</p>
    <p><a href="http://www.myfonts.com/fonts/looseleaf-fonts/solveig" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.myfonts.com/fonts/looseleaf-fonts/solveig" rel="nofollow"><img src="http://typophile.com/files/SolveigFlag_5244.PNG"></a></div><a href="http://www.myfonts.com/fonts/looseleaf-fonts/solveig" rel="nofollow"><br>
    Solveig</a><p></p>
    <p><a href="http://www.myfonts.com/fonts/looseleaf-fonts/newt-serif" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.myfonts.com/fonts/looseleaf-fonts/newt-serif" rel="nofollow"><img src="http://typophile.com/files/NewtFlag_3693.png"></a></div><a href="http://www.myfonts.com/fonts/looseleaf-fonts/newt-serif" rel="nofollow"><br>
    Newt Serif</a><p></p>
