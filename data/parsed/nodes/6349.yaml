  html: <p>Why do we need MM fonts? what is the idea?  <br> <br>IF - <br> <br>"The concept was brilliant, but it was complicated and expensive to design the fonts.....and a relative lack of enthusiasm from the public..." <br> <br>James Felici, The Complete Manual of Typography, p.39, Adobe Press, 2003</p>
