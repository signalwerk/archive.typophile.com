    html: <p>Well, if you were going to be at the ATypI conference in Prague this fall, I'd suggest you come to my talk, "Requiem for a font format." <br> <br>For my first Master's degree, I did my thesis in the area of MM technology, so I'm certainly a fan. <br> <br>I'll poke at a couple of angles of it, though.  <br> <br>The quote from Felici is misleading at best. (Despite the book having been published under the Adobe Press label, nobody in the Adobe type group got to review it before it was published.) <br> <br>- MM fonts are expensive to design in the absolute. But they are cheaper and easier to design than correspondingly large families of standalone fonts. To this day, Adobe does most of its new font development using MM design space; it's just that we generate standalone fonts instead of MMs in the end. <br> <br>- Many of our best-selling fonts were MM fonts. When both MM versions and non-MM versions were available, the MMs sold as well or better than the "unimaster" fonts. <br> <br>However, it is true that most users didn't use or care about the MM capabilities. It was the designs they liked, not the MM functionality. <br> <br>When you say "we" in "why do we need MM fonts?" it is not clear whether you mean end users or type designers, or some other group. <br> <br>Type designers need MMs or some other axis-based technology because it simplifies their work in developing large type families. <br> <br>Those end users who really "dug" the technology liked it because they could use the axes to generate their own custom instances, picking the exact parameters that fit their particular task needs. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>Well, if you were going to be at the ATypI conference in Prague this fall, I'd suggest you come to my talk, "Requiem for a font format." <br> <br>For my first Master's degree, I did my thesis in the area of MM technology, so I'm certainly a fan. <br> <br>I'll poke at a couple of angles of it, though.  <br> <br>The quote from Felici is misleading at best. (Despite the book having been published under the Adobe Press label, nobody in the Adobe type group got to review it before it was published.) <br> <br>- MM fonts are expensive to design in the absolute. But they are cheaper and easier to design than correspondingly large families of standalone fonts. To this day, Adobe does most of its new font development using MM design space; it's just that we generate standalone fonts instead of MMs in the end. <br> <br>- Many of our best-selling fonts were MM fonts. When both MM versions and non-MM versions were available, the MMs sold as well or better than the "unimaster" fonts. <br> <br>However, it is true that most users didn't use or care about the MM capabilities. It was the designs they liked, not the MM functionality. <br> <br>When you say "we" in "why do we need MM fonts?" it is not clear whether you mean end users or type designers, or some other group. <br> <br>Type designers need MMs or some other axis-based technology because it simplifies their work in developing large type families. <br> <br>Those end users who really "dug" the technology liked it because they could use the axes to generate their own custom instances, picking the exact parameters that fit their particular task needs. <br> <br>Regards, <br> <br>T</p>
