    <p>Hello Everybody,</p>
    <p>I am in search of a modern, humanist and simple sans-serif font which looks like Dax.<br>
    (It may be rounded. Np.)</p>
    <p>Also, i need rounded version of Helvetica. I have "Helvetica Rounded" (Linotype) but i think it is too rounded. I need less rounded of "Helvetica Rounded".</p>
    <p>Any suggestions?</p>
    <p>Peace!</p>
