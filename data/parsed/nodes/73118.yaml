    html: |-
      <p>I wouldn't exactly call Dax humanist, despite what Wiki says.<br><a href="http://www.fontspring.com/fonts/shinntype/sensibility">This</a> is a humanist sans.<br>
      And <a href="http://www.fontspring.com/fonts/shinntype/sense">this</a>, like Dax, is a condensed modernist sans.<br>
      In Dax, the elimination of tangential lower case joints is modernist, in a reductive manner.<br>
      (Both support Turkish, BTW.)</p>
