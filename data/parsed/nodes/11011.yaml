    html: "<p>He he, a little bait is all it takes. <br> <br>Here's some background. I wanted somthing with fat serifs. In fact, I wanted the serifs to be so fat that they were equal to the thin weight of modulation. That would pretty much make it a slab serif right? But with rounded slabs. The first character was the h. That's where curve/staight came in and I kinda liked it.  <br> <br>Eduardo: <br>I'm not totally ready to give up on the curves yet. But it is proving odd to solve characters with bowls as you pointed out. a, b, d. What do you think of the e? Is the weirdness coming from an inconsistent angle of modulation or from the nature of curvy and straight in one character. BTW, I like the f also, particularly the crossbar. Side question: how would i be able to polish the curves in Fontographer better than I could in Illustrator (I have Fontographer, but have never really used it). <br> <br>Tiffany: <br>My wife also thinks I haven't \"relaxed in the right spots.\" Too much around the middle apparently. Seperate issue, sorry. I believeour own Aaron Sittig put it right on his March type review: <br> <br><i> I couldn't figure out why text set in Sonoma  <br>looked so much better at size 9. Now I realize  <br>that size 9 will hide a whole host of problems  <br>in any font. </i> <br> <br>Do the serifs seem large in thickness, ie too slabby, or too long? I've steadily shortened them as i've done more and more settings because of spacing issues. <br> <br>Thanks for the thoughts. Any preference on g's? <br>More please. <br> <br>Randy</p>"
