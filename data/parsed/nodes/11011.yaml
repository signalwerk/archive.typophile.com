  html: <p>Just got underway on this new serif and am wondering what you think of it so far. The part I both like and dislike is the contrasting curved and straight stems. Sometimes when I look at it I feel like it's been through the wavy filter in photoshop, other times it seems fresh. Does this show promise? If so, I'm bound and determined to get through UC, LC and Numerals without stalling out! <br> <br>Thanks <br>Randy<img src="http://www.typophile.com/forums/messages/29/8934.gif" alt="Toad Fonts"></p>
