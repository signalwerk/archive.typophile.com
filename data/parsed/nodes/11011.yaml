    html: <p>There could be something to a "relaxed" hand-written typeface, but I'm not sure you've "relaxed" in the right spots. For instance, your "y" I like, the middle stroke on your "m" just looks like a mistake. Although, all-in-all a lot of it disappears when it becomes smaller. Your serifs also seem a bit large.</p>
