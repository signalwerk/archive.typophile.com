    html: <p>Ha, I like your "subtle approach", randy. ;-) <br> <br> <br><i>&gt;The part I both like and dislike is the contrasting  <br>&gt;curved and straight stems. Sometimes when I look <br>&gt;at it I feel like it's been through the wavy filter in <br>&gt;photoshop, other times it seems fresh. </i> <br> <br>I feel the same way. So, imho, I think you can give up  <br>the curve strokes. It seems to be disturbing, more  <br>than improving it. <br> <br>Btw, the "f" is nice. But the bowls in "a", "b" and "d" <br>looks a little strange. You'll probably be able to polish <br>these characters later on Fog or FL. <br> <br>And I think "n" and "m" should have similar serifs. <br>The "n", without the inner footserif on the left vertical  <br>stroke, seems disturbing to me. <br> <br></p>
