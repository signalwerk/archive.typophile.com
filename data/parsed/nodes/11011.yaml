    html: <p>Well, I'm not used to work in Illustrator, but I'm guessing it doesn't have <br>the BCP control ability that Fog has. And, I think the "weirdness" in your <br>bowls can be easily solved by optimizing your BCPs in Fog. Try using the  <br>Element&gt;Info command (Ctrl+I for Windows). <br> <br>In "a", your bowl is too "square". The "e", I think it is a little wide. <br>The fat serifs, I think are nice.</p>
