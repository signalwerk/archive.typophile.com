    <p>Someone recently started following me on twitter even though I don't use it. I'm not complaining, just curious. I contacted them via FB and asked how they "found" me on twitter and they told me "I found you because Typophile posted all its users' avatars yesterday."</p>
    <p>Can someone please direct me to this?</p>
    <p>Thanks in advance.</p>
