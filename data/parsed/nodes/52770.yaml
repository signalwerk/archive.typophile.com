      <p>Well the best ones to my eyes (and seeing them as logos that can be applied across various applications and are also memorable) were from "Jeff Wheeler" and the one that's also posted here from "Apankrat".</p>
      <p>I think both of them are very similar in style and work well. And if I had to decide between the two it would be Jeff's.</p>
      <p>Other's are either not logos at all, to playful/busy/unprofessional...</p>
      <p>But if yours would be the one to progress even further I'd progress... Well I can't associate the arc with anything. And if I remove it, I'm with Jeff's version again. Well at least the third one is not appropriate.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
