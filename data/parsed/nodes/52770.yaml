  html: |-
    <p>The Haskell community is looking for a new logo.</p>
    <p>Haskell is a functional programming language, featuring laziness and purity. You don't have to know what these mean to help me. The current logo is pretty bad, in my opinion: you can see it at <a class="freelinking external" href="http://haskell.org/haskellwiki/Image:Haskellwiki_logo_big.png" rel="nofollow">http://haskell.org/haskellwiki/Image:Haskellwiki_logo_big.png</a>.</p>
    <p>I'd appreciate the comments of people from people whose geekiness tends towards design rather than mathematics, both on my own logo proposals and (if you have time) other proposals at <a class="freelinking external" href="http://haskell.org/haskellwiki/Haskell_logos/New_logo_ideas" rel="nofollow">http://haskell.org/haskellwiki/Haskell_logos/New_logo_ideas</a>.</p>
    <p>Explanation of some symbolism: the mathematical theory of monads has had a big impact on Haskell, and this uses the operators &gt;&gt; and &gt;&gt;= which appear in some of the logo designs. A lowercase lambda is used to denote functions (and, less commonly, an uppercase lambda for a related concept of type-function). The language is named after the logician Haskell Curry.</p>
