    html: |-
      <p>The principal comment I have is that the λ-based mark is probably not a very good idea simply because Lambda calculus is not unique to Haskell. </p>
      <p>I think first two marks in your PDF and (<a class="freelinking external" href="http://media.nokrev.com/junk/haskell-logos/logo6.png" rel="nofollow">this mark</a>) are good, but they don't really associate with <em>Haskell</em>. Looking at the mark it's easy to see it's for one of the functional programming languages, but it could be for Erlang for all I care. In fact, the <strong>L</strong>isp is going to be a more reasonable guess, because L <em>is</em> λ.</p>
      <p>I would probably look at using a wordmark, perhaps working the λ or the &gt;&gt; into a negative space of "Haskell". At the very least I'd consider working the H letter into the graphical mark. The mark needs to be tied to "Haskell" somehow.</p>
