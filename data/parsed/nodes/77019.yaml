  html: |-
    <p>I have made a handful of fonts but this is my first script, which I have only roughed in. I am using TypeTool. When I test the font in Illustrator or PhotoShop CS4 the joins in the lower case i and j are knocking out from the glyphs they overlap. The problem does not show when printed and goes away when I outline the font. It does not appear in TextEdit, Apple Mail, or Microsoft Word.</p>
    <p>Any advice on what I did wrong?</p>
    <p>Image attached.</p>
    <p>Thanks<br>
    Matt</p><div class="imageWrap"><img src="http://typophile.com/files/navyscreenshot_6469.jpg"></div><p></p>
