  html: |-
    <p>Well, not much of a type topic, but thought it be interesting to see other examples of phonaesthetics, or words/phrases that have a beautiful sound when spoken. </p>
    <p>The most famous being : cellar door </p>
    <p>Here's a few words I find pleasant to say,</p>
    <p>battlecreek<br>
    steeplechase<br>
    zanzibar</p>
