    html: |-
      <p>Thanks for the detailed image.<br>
      The font is Römische Antiqua, capitals designed by A. Anklam for Genzsch &amp; Heyse, 1898.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/20RömischeAntiquaLHS_6420.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/20RömischeAntiquaRHS_4018.jpg"></div><br>
      Not digitized. On my to do list, but not in the near future.<br>
      As a loose substitute you could use Cheltenham, which also has the  G with a spur. Römische Antiqua differs from Cheltenham with its drooping bowls on D, P and R, splayed legs on M, the unspurred upper terminals on C, and other details.<br>
      Don<p></p>
