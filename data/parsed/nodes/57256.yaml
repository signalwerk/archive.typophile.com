      <p>Hi Omar, </p>
      <p>For the Lebanese computing magazine ACCE (Al Computer, Communications &amp; Electronics) Mohamed Zakarya also created a series of original examples to correct the usual uninformed cliches when he reviewed a book about Arabic typography. You can download a copy here:</p>
