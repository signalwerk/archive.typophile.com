    html: |-
      <p>Try to get hold of a copy of Mohamed Zakariya's <em>The calligraphy of Islam : reflections on the state of the art.</em> This is the best guide I have found to the different styles, demonstrating each with the same phrase for easy comparison. The book also shows a number of rare styles, and explains how they differ from related styles.</p>
      <p>Mr Zakariya also contributed a 'compendium of Arabic scripts' to Nabil Safwat's <em>The art of the pen</em> (see Appendix II). This includes an informative showing of paired scripts at different sizes, showing how they are related but how each is appropriate to a particular size of writing.</p>
