    <p>Hi everyone,</p>
    <p>I’m writing my essay about the history of the different Arabic scripts, i’m having a hard time finding good images of the different scripts and was wondering if maybe someone here on typohile could help me out with some good quality images of the different scripts:</p>
    <p>- Kufi and ornament Kufi<br>
    - Naskh<br>
    - Thuluth<br>
    - Diwani<br>
    - Taliq<br>
    - Farsi<br>
    - Ruqaa<br>
    - Perzisch script<br>
    - Maghrebi</p>
    <p>i’m not asking for annyone to do all the work for me, its just that i’m absolutely no specialist in separating all the different scripts from one another, and i obviously don’t want to guess. i did find some images on the net but most of them are of poor quality. i checked the academie's library but there is absolutely nothing about this subject,  of course i will mention the source of the images in my essay and be glad to send a copy.</p>
    <p>i would really appreciate all the help.</p>
