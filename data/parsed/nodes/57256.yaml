      (English)<br>
      <a href="http://www.decotype.com/publications/2005-10-01_ACCE_HSAF-reviewAR/AlKumbyuutar_cover_story.pdf" title="www.decotype.com/publications/2005-10-01_ACCE_HSAF-reviewAR/AlKumbyuutar_cover_story.pdf">www.decotype.com/publications/2005-10-01_ACCE_HSAF-reviewAR/AlKumbyuutar...</a><br>
      (Arabic).</p>
      <p>A bit late, but I hope this will help to get clear examples.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
