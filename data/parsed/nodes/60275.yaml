    html: <p>Start with a light gray layer. Make a new layer on top and make a large, circular feather edge brush (0 hardness). Set your foreground color to white, then just locate where you want the center of the light to be and click once. To get an even more gradual blend, you can use multiple layers, stepping down the size of the brush on each layer while going from light gray to white.</p>
