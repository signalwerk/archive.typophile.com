    html: |-
      <p>I believe the technical term is "radial gradient".</p>
      <p>There's a few different ways to make it. (assuming photoshop)</p>
      <p>-With the gradient tool.<br>
      Select the gradient tool, then click the radial icon on the options bar.</p>
      <p>-With a layer style.<br>
      Go to the "gradient overlay" tab and select the radial option.</p>
      <p>-With a fill layer.<br>
      On the menu bar: Layer &gt; New Fill Layer &gt; Gradient... &gt; Click OK &gt; select radial</p>
