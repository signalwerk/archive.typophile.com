    html: |-
      <p>This will ask you for a folder, find all ".eps" files in it and import them sequentially into the current font, using the basename of each file (without the ".eps" extension) as the glyph name. Should be enough to get you started, I hope. </p>
      <p>#FLM: Import EPS glyphs from folder<br>
      import os.path, glob<br>
      f = fl.font<br>
      folder = fl.GetPathName("Choose folder with EPS files...")<br>
      pathmask = "*.eps"<br>
      paths = []<br>
      for globmask in [pathmask, pathmask.upper()]:<br>
        paths += glob.glob(os.path.join(folder, globmask))<br>
      paths = sorted(list(set(paths)))<br>
      print "Importing EPS files from %s..." % (folder)<br>
      for path in paths:<br>
        basename = os.path.splitext(os.path.split(path)[1])[0]<br>
        try:<br>
          g = Glyph()<br>
          g = g.LoadEPS(path)<br>
          g.name = basename<br>
          g.mark = 33<br>
          f.glyphs.append(g)<br>
          print "%s.eps imported" % (basename)<br>
        except:<br>
          print "%s.eps IGNORED" % (basename)<br>
      fl.UpdateFont(fl.ifont)<br>
      print "Finished."</p>
