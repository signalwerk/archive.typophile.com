      <p>I am closing this now. The free font that is closest is Bodoni Open. Using uppercase in a smaller size to accomplish the same look. The font that is the closet in style is Archive Modern II Open. Same as above, need to use smaller uppercase to accomplish the results. The Archive Modern II Open cost $20.</p>
      <p>Ray</p>
