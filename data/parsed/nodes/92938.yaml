  html: |-
    <p>Looking to ID this font. It is from our school's letterhead. I had located a free version of it on the web back in 2003/2004 and used it to create this. (It's no longer on my computer). I checked under MyFonts, and the closest is 'Archive Modern II', except that uses lowercase letters. This font has lowercase as smaller uppercase.</p>
    <p>Thanks,<br>
    Ray</p>
