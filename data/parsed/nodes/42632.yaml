      <p>A number of children's picture books use type which is very unsympathetic to the art. Putting brittle type next to or over painted art looks ugly to me. For <a href="http://www.sadiethepilot.com" rel="nofollow">my own first book</a> I used a version of Cooper Oldstyle. The blobby serifs went very well with the acrylic painting, I thought. Where the designer and editor suggested setting some of the type along curves, I created a new upright cursive non-joining font, which being my first I make no great claims for, but it was better than having serifs choo-chooing up and down curves, which is something that looks weird to me, unless it's handlettered.</p>
      <p>I handlettered the cover letters, which led to some problems on foreign co-editions. Where I got the chance I created hand-lettering for co-editions also, but most of them were typeset, not always in the most pleasing way.</p>
      <p>My current project is a Dutch language only picture book, which I intend to handletter.</p>
      <p>I'm also working on another English language book where I plan to follow Maurice Sendak and use Cheltenham, mixing and matching the versions from a couple of suppliers so that I can get as traditional a 'g' as possible, and also approximate smallcaps by using a bold at a smaller size. I may have to draw that old 'r' myself, though. I can't see it for sale anywhere, nor can I see an 'ffi' for 'traffic'.</p>
      <p>I'm very fond of Baskerville with art, as seen in the Danish children's comic <a href="http://airforceamazons.blogspot.com/2008/02/antlerism.html" rel="nofollow">Rasmus Klump</a>.</p>
      <p>Counter to all this, <a href="http://www.amazon.co.uk/s/ref=nb_ss_w_h_?url=search-alias%3Daps&amp;field-keywords=lauren+child&amp;Go.x=0&amp;Go.y=0&amp;Go=Go" rel="nofollow">Lauren Child</a> uses type in a way that is extremely ugly, but integrates with the art perfectly, and is in its own philistine way absolutely brilliant.</p>
