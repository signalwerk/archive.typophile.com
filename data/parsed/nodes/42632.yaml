      <p>"By choosing Burbank, you are discriminating against serious and sophisticated children"<br>
      I'll remember that next time I see the Duck Confit Happy Meal at McDonalds...</p>
      <p>I don't think typographers/graphic designers should be afraid to play with typefaces, as long as the point size, leading (you're right EK), and legibility (none of those random cursive characters or such) are not affected. Take for instance, comic books. There you will have an excellent balance of type to image (and also the only time center-alligned paragraphs are acceptable) where there is in no way any indication of classic typography. Depending on the age group, I wouldn't hesitate to use a "handwritten" sans in a children's book, as long as it's still legible, and makes sense in it's usage. Maybe if they're a little older we can go to JK Rowling's 12pt Adobe Garamond (at least for us in the US).</p>
