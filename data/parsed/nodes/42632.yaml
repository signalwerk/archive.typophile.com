      <p><em>I’ve always thought that children’s books should have as traditional a typeface as possible; they’re just learning to read, so why give them a typeface that has interesting letterforms? </em></p>
      <p>I agree with your policy, but not the rationale.<br>
      IMO, traditional serif faces have the most interesting letterforms, ideal for engaging young minds.<br>
      Kellie mentions Cheltenham, which has a few "extra" serifs and unusual top-heavy proportions.</p>
      <p>I didn't design Fontesque for children, but that's a genre it's often used for.<br>
      Designers, perhaps, use its bounce and irregularity to signal the genre, being similar to the uneven quality of children's handwriting. Children also seem to like it; I think because it breaks the grid. They're always being told to conform, which is hard work, so they respond to something that doesn't. This isn't the same issue as "serious/fun", although there is some overlap. It is also possible for children to be serious and non-conformist at least some of the time-- after all, that's learning to think for oneself.</p>
