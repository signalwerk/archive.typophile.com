      <p>I worked as a graphic designer for a children's museum for over 3 year and what I have found is that kids need consistency and legibility above all else. Especially if your audience is younger kids, just learning to read. Don't pick fancy or decorative fonts. At the museum, we were very specific to using only fonts with infant characters (round a's and g's) because those are what children recgonize best. Some are:</p>
      <p>Futura<br>
      Century Gothic<br>
      Andika Basic (I think this was designed especially for children): <a href="http://www.dafont.com/andika-basic.font" title="http://www.dafont.com/andika-basic.font">http://www.dafont.com/andika-basic.font</a><br>
      Gill Sans Infant</p>
      <p>There are probably others. I also had a MFA Graduate classmate who did a thesis on typography in children's books. Again, consistency and legibility are the most important things.</p>
