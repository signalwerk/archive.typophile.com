      <p>Well thought out, Nick. I think that's a very inspiring explanation for which fonts children most often like (though, you have to admit, the mere explanation of such a thing is a generalization. I don't think that's a bad thing though)</p>
      <p>On a general note, I have to add that <em>not all children's book are read by children</em>. A lot of them are read by their parents. This affects the whole discussion of traditional type vs. expressive type. In the case of a book where most children don't read themselves, I wouldn't hesitate in using an expressive type. With my particular book as an example: the text is disproportionally difficult in relation to the age-relevance of the theme and the style of the artwork. If the child could read it, he/she would probably be turned of by the theme and the artwork, and go read a more serious book.</p>
      <p>William: The illustration style of the book is rather wild, "pointy" and non-smooth. But also friendly and cuddly (especially the huge black dog, which the protagonist finds in his daddy's car instead of his dad). I chose Chaparral, because I seemed to get some of the same vibes from this font.</p>
      <p>– <em>Malte</em></p>
