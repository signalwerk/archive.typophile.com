    <p>I'm working on my first book for children (with the text integrated in the full-page illustrations - usually, the illustration has left room for the text with a uniform colour or texture of some sort).</p>
    <p>I might have more of these kind of jobs, so I'm on the lookout for fonts suitable for children's books (both display and text-fonts). I searched the forum, but it seems that nobody has discussed this before, so I'm looking forward to see what people think about it.</p>
    <p>A personal preference: I wouldn't like to stereotypical fonts that could risk "talking down" to the children. In other words, being <em>too</em> childish. Also, I'm aware that the suitability of any font depends on the specific story, but my goal here is just to brainstorm away and create a whole bunch of inspiration!</p>
    <p>Would <a href="http://www.underware.nl/site2/index.php3?id1=bello&amp;id2=smallcaps" rel="nofollow">Bello</a> in small caps work for display text? My intuition tells me it would suit for young boys.</p>
    <p>Thank you!<br>
    Malte</p>
