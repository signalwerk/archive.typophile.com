    html: |-
      <p>A binocular g is used to sell more fonts. Even though a monocular g might be easier to read and appear more balanced, a font designer can get more attention by including a cute binocular g. If an alternate g is not included, the font buyer may become leery of the font designer's ability to make both types of g. Font buyers can become nervous or run away if they don't see a binocular g. The smart font designer always includes a binocular g to ensure steady font sales.</p>
      <p>Some fonts have no remarkable marketable features: adding a cute binocular g to a boring can add up to big bucks. A fancy R, curly lowercase l or ampersand can also be used to sell more fonts, but nothing beats the incredible marketing power of the binocular g.</p>
