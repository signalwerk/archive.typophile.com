    <p>Looking for an alternative for my company's font I'm using now (Frutiger) I was looking at Whitley. However, one thing I find confusing is how the characters exactly look like. If I look at the description on Hoefler&amp;Frere jones' site<br>
    <a href="http://typography.com/fonts/font_overview.php?productLineID=100026" title="http://typography.com/fonts/font_overview.php?productLineID=100026">http://typography.com/fonts/font_overview.php?productLineID=100026</a><br>
    I spot different versions of the lower case g (the curly and "open" version), different versions of the q, etc.</p>
    <p>What is the idea/purpose behind that?</p>
    <p>(btw I'm new to this forum. Glad to have found this forum, seems interesting and lively)</p>
