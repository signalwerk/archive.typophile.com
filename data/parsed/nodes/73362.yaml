      <p>Neckties can make you look more attractive but usually look idiotic with a t-shirt. While a binocular g may be suited to retro themed fonts they often look out-of-place in fonts with more of a contemporary, minimalist theme.</p>
      <p>If the intention of the binocular g is to make a font easier to read then why do font designers endeavor to make them so quirky and unique when the rest of the font is so staid?</p>
      <p>It was a cliché of the last decade and a half: serious modular corporate fonts with little personality that feature a quirky binocular g to help differentiate them from other modular corporate fonts with little personality.</p>
      <p>Go to MyFonts.com and search for contemporary sans. Change the sample text to goggles and you can find many examples.</p>
