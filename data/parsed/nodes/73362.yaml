    html: |-
      <p><em>What is the idea/purpose behind that?</em></p>
      <p>It is to offer different "flavours" of the same typeface.<br>
      The first occurrence of this dates back to the 1930s, when extra "sorts" containing single-bowl g's were provided with some North American sans faces, to give them a more modern, European look. Similarly, Gill Sans was equipped with a single-bowl g by Linotype in Germany in the 1950s.</p>
      <p>Today, with OpenType, it is quite easy for foundries to put both single and double-bowl "g"s in a font, the alternate being accessible in a Stylistic Set. "a" is another candidate for this duplication: two glyphs for a single character.</p>
      <p>The single bowl a and g were also provided to create "early reading" versions of some typefaces, Gill and Plantin, for instance.</p>
      <p>Hypatia, and my <a href="http://www.shinntype.com/figgins.html" rel="nofollow">Figgins Sans</a> and <a href="http://www.shinntype.com/scotch.html" rel="nofollow">Scotch Modern</a> types have this feature for "g", National for "a".</p>
      <p>There is probably a Typophile thread listing all the faces with this duplicity, but I can't find it.</p>
    html_clean: |-
