      <p>Sure thing. It’s sounds like it’s actually quite similar to Kristen’s book.</p>
      <p>The book is approx 10 1/2 x 8 1/2”, horizontal, hardcover, 416 pages.</p>
      <p>Each page has a grid of 35 squares, each containing a capital letter or numeral, at about 72 points. There are 8 pages of each letter, so that’s 280 typefaces. Each square also has a small number which corresponds to a master grid index in the back, listing the typeface names and foundries.</p>
      <p>Full lowercase alphabets are listed in a separate section, five to a page, again numbered to correspond to the grid index.</p>
      <p>Threre’s also an alphabetical index at the back.</p>
      <p>I can try to post some pictures later if you’re interested.</p>
