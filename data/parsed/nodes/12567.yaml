    <p>I have a vague memory of a book that was available on line (and may still be) whose purpose was to help in identificaton of fonts. Each page was set up with a grid of maybe 30 squares and in each square was a letter in 60 point or thereabouts. Underneath the letter was the typeface name. Apparently this book had pages and pages of cap As, then cap Bs, and so on. </p>
    <p>I’m not referring to <strong>Rookledge’s International Typefinder</strong>. I have that book and find it useful. The book I’m vaguely recalling did not have one-line specimens for each typeface, it simply had various incarnations of each letter of the alphabet grouped together.</p>
    <p>I never actually saw the book and have no idea if it would be helpful. However, one of our art directors is looking for info on the book and I seem to have misplaced the url or any information about it. </p>
    <p>So can anyone help an old lady with her senior moment? What the heck was that book? Did anyone actually purchase it and/or find it useful?</p>
    <p>Thanks!</p>
