      <p>Hello again Wolfgang — thanks for the reply. I initially<br>
      thought an ogonek too, but now I’m not so sure: It looks too<br>
      big, it does not curl around to the right-hand side of its<br>
      host in the same way (or left, overturned) instead it sort<br>
      of dangles. Also, the end is rather blunt. </p>
      <p>As a indicator of nasality in vowels it certainly doesn’t<br>
      belong on a c, so I though it might be a diacritic from<br>
      somewhere else grafted onto them both. </p>
      <p>As to “any odd shaped glyph” I can agree with the “odd”,<br>
      but Frege seem to me rather systematic in his symbolism.  </p>
      <p>Cheers</p>
      <p>Jim<br>
      —<br>
      <a href="http://pdfb.wiredworkplace.net/pub/jjg/" title="http://pdfb.wiredworkplace.net/pub/jjg/">http://pdfb.wiredworkplace.net/pub/jjg/</a></p>
