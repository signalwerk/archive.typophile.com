    <p>More from Frege’s Grundgestze der Arithmetik II (Jenna, Germany, 1903).<br>
    The attached are details of an inverted c and e sporting odd hook-like<br>
    diacritics. The final attachment has the e in context — raised slightly<br>
    from the baseline and a little smaller than its arguments. </p>
    <p>Any thoughts on these hooks?</p>
