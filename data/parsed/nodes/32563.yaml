      <p>Hello Jim,</p>
      <p>e-spuro2 shows an ’e caudata’ upside down. This glyph is an abbreviation for ae and has been used since the early middle ages.<br>
      <a href="http://www.decodeunicode.org/w3.php?nodeId=383&amp;page=1&amp;lang=1&amp;zoom=&amp;prop=" title="http://www.decodeunicode.org/w3.php?nodeId=383&amp;page=1&amp;lang=1&amp;zoom=&amp;prop=">http://www.decodeunicode.org/w3.php?nodeId=383&amp;page=1&amp;lang=1&amp;zoom=&amp;prop=</a></p>
      <p>as 2-001-002 shows, Frege seems to have used any odd shaped glyph for his equations. And he used them upside down to prevent any misinterpretation as a letter; remember the thread about the pound abbreviation.<br>
      <a href="http://typophile.com/node/31818" title="http://typophile.com/node/31818">http://typophile.com/node/31818</a></p>
      <p>c-spuro2 (also upside down) looks vaguely familiar to me, but I can’t find an example. It is not a c with a cedille.</p>
      <p>Wolfgang</p>
    html_clean: |-
