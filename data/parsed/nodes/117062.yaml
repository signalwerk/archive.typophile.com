      <p>1. Belluccia. You're on the right track: in Italian you would pronounce it like Bellucci, with a final |a| like in "pizza" ;)</p>
      <p>2. Despeinada is a common Spanish word, so you should be able to find the right pronounciation somewhere (there could be slight differencies between european Spanish and south american Spanish).</p>
      <p>3. Miss Le Gatees. You could ask directly to the nice people at Sudtipos: <a href="http://www.sudtipos.com/co-founders" title="http://www.sudtipos.com/co-founders">http://www.sudtipos.com/co-founders</a> <a href="http://twitter.com/sudtipos" title="http://twitter.com/sudtipos">http://twitter.com/sudtipos</a></p>
      <p>4. Penabico. You can ask Paulo: <a href="http://typophile.com/node/74784" title="http://typophile.com/node/74784">http://typophile.com/node/74784</a> <a href="http://www.dafont.com/it/penabico.font" title="http://www.dafont.com/it/penabico.font">http://www.dafont.com/it/penabico.font</a></p>
