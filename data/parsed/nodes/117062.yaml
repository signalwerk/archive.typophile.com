  html: |-
    <p>Hello! I am a trainer for a stationery company. We have a team of 100-300 production designers who work with our customers on the design/quality of their cards. Our company is very design orientated and I'd like to be sure our designers know how to properly say the font names we use.</p>
    <p>I have been able to track down the correct pronunciations for many names, but there are a few I have been unable to confirm. I was wondering if I could get some help on with the pronunciation of the following names:</p>
    <p>1. Bellucia<br>
    <a href="http://www.pronouncenames.com/pronounce/bellucci" title="http://www.pronouncenames.com/pronounce/bellucci">http://www.pronouncenames.com/pronounce/bellucci</a></p>
    <p>2. Despeinada</p>
    <p>3. MissLeGatees<br>
    <a href="http://en.bab.la/dictionary/french-english/g%C3%A2t%C3%A9e" title="http://en.bab.la/dictionary/french-english/g%C3%A2t%C3%A9e">http://en.bab.la/dictionary/french-english/g%C3%A2t%C3%A9e</a><br>
    <a href="http://www.forvo.com/search/LeGatee/" title="http://www.forvo.com/search/LeGatee/">http://www.forvo.com/search/LeGatee/</a></p>
    <p>4. Penabico</p>
    <p>Under a few I have some possible audios, but I have no idea if these are right for these fonts. </p>
    <p>Thank you so much! I greatly appreciate it.<br>
    Sarah</p>
