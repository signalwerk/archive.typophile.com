      <blockquote><p>“As with all decisions via committee, this could go on for a while.”</p></blockquote>
      <p>Sorry for taking so long to get back to this thread. Let’s nip that little issue in the bud.</p>
      <p>First of all, thanks to everyone for the discussion and feedback.</p>
      <p>Richard, <a class="freelinking external" href="http://en.wikipedia.org/wiki/Chindōgu" rel="nofollow">Chindōgu</a> is exactly the concept I’ve had in my head since posting this, I just wasn’t exactly sure how to communicate it. This typeface should contain a stream of creative, emotive, “amazing” — and yet, potentially unusable — glyphs reflective of each designer.</p>
      <p><strong>Font Aid Glyph Submission Guidelines</strong></p>
      <p>Create a glyph that is your own personal interpretation of Japan.</p>
      <p>* You may submit up to three glyphs<br>
      * Glyphs must be supplied as vector files only (not bitmaps)<br>
      * Adobe Illustrator .ai or .eps files are preferred<br>
      * Fontlab or Fontographer source files will also be accepted<br>
      * Glyphs must be black and white only<br>
      * Do not use colour, complex textures, or embedded bitmap images<br>
      * Remember, simple is often better</p>
      <p>Send the following to <a href="mailto:fontaid@typesociety.org" rel="nofollow">fontaid@typesociety.org</a> by <strong>March 25th, 2011</strong></p>
      <p>* Final vector artwork file(s)<br>
      * A short description of each of your glyphs (optional)<br>
      * Your name (as you like it to appear on the project page)<br>
      * Your country</p>
      <p>Additional information and updates will be posted to the <a href="http://www.typesociety.org/fontaid/" rel="nofollow">Font Aid</a> page on the SOTA website.</p>
      <p>Thanks again for everyone’s input.</p>
      <p>Now, let’s make an awesome typeface.</p>
