    html: "<p>I can't wait to see how this font turns out. I love the idea of everyone doing their own thing for this project. Buyers might prefer it or they might not: we don't know. Next time around, we'll know. I have a feeling this approach is better because it offers something for everyone. Some customers will buy this font and find themselves doing a project where Japanese themed imagery is needed. Some will have a need for manga word balloons. Some will want a lone @ sign. Having a wider variety of glyphs to choose from should make the font more useful. If we would have stuck to variations of one symbol, a customer might use some of them but it's unlikely that they'd use several. Give the customer a variety of glyphs and the chances of those glyphs being used goes up because situations which require their use will be more frequent. The more frequently glyphs are used, the more exposure they get. People who see designs using those glyphs might ask the designer where they got that arrow, noh mask etc. That can end up spreading the idea of Font Aid even further.</p>"
    html_clean: "<p>I can't wait to see how this font turns out. I love the idea of everyone doing their own thing for this project. Buyers might prefer it or they might not: we don't know. Next time around, we'll know. I have a feeling this approach is better because it offers something for everyone. Some customers will buy this font and find themselves doing a project where Japanese themed imagery is needed. Some will have a need for manga word balloons. Some will want a lone @ sign. Having a wider variety of glyphs to choose from should make the font more useful. If we would have stuck to variations of one symbol, a customer might use some of them but it's unlikely that they'd use several. Give the customer a variety of glyphs and the chances of those glyphs being used goes up because situations which require their use will be more frequent. The more frequently glyphs are used, the more exposure they get. People who see designs using those glyphs might ask the designer where they got that arrow, noh mask etc. That can end up spreading the idea of Font Aid even further.</p>"
