      <p>Arno, that is exactly what I saw as well.  By presenting the glyph as Hrant has, with no further forms, he has allowed much more flexibility in use for the glyph.  The rising sun was on many thousands of early Japanese artworks even before it became a flag. Japan is one of the few countries that has used a minimalist approach to things to such a degree that you can even say it has become a national trait. Think of the Haiku and the tatami mat and the elegant uses of minimal spaces in architecture seen there. It seems that the Japanese  ask more of their readers than we westerners do. Where many westerners would see an empty space as something that must be filled, the Japanese see it as something to cherish and behold. Perhaps being an Island Nation with no room for outward expansion, they revere unadorned space as something great and difficult to attain.</p>
      <p>As for personal differences, I would immediately think of Japan with a black disk in a white rectangle.  I also see the Fedex arrow as so blatant and heavy handed as to seem like a cheap parlor trick.  Such is the difference of both human perception and the effect of our own culture and direct experience.  None of us is wrong in what we see yet each of us is most exactly accurate in what we see for ourselves. If not mistaken, I think that Tibet thinks of Red as a funeral color.  By leaving the glyph unadorned as Hrant has, the person who uses it to speak to an intended audience he is familiar with, has the opportunity to direct properly to that audience even if it confounds the rest of us. If you think of the absolute sense of the metric system compared to the English system of measure, you can not argue with the logic.  Good luck getting US Citizens to adopt it tough ;-)</p>
