    html: |-
      <p>An update from SOTA:</p>
      <blockquote><p>
      It’s been quite a while since you heard from us about the Font Aid V: Made For Japan typeface. We’re sorry about that.</p>
      <p>Rest assured, we haven’t forgotten about you. Things have been progressing — slower than we had hoped — but we definitely wanted to let you know what was going on.</p>
      <p>The process of integrating the hundreds of glyphs that were submitted has been a massive task. We underestimated both the number of people interested in participating, as well as the sheer amount of work required to get the “Made For Japan” font assembled. There are currently three people working feverishly to put the finishing touches on the typeface, which we hope to have available in early June through several font distributors.</p>
      <p>We apologize that there hasn’t been more regular communication about the status of the Font Aid V project. We promise that will change very soon.</p>
      <p>Thanks again to everyone who participated and helped us spread the word.
      </p></blockquote>
