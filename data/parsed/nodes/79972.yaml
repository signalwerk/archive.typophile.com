    html: |-
      <p>Here are the numbers. I did a presentation on this at Typecon last summer.</p>
      <p>Font Aid 1 raised $2000 for UNICEF </p>
      <p>Font Aid 2 raised $5000 for victims of 9.11 </p>
      <p>Font Aid 3 had 3 components. The font itself raised $10,000. An additional $10,000 was raised through a project called Building Letters and another $12,000 was raised from font vendors donating the proceeds from their top selling fonts on MyFonts for 1 month. The money went to help victims of the Indian Ocean earthquake and tsunami.</p>
      <p>Font Aid 4 raised $13,500 for victims of the earthquake in Haiti.</p>
      <p>Can't wait to see Font Aid 5 top these numbers!</p>
