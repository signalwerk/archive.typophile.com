      <p><cite>But in actual emitted light, it's true!</cite></p>
      <p>Sure, but I think, that human beings have evolved in an environment, in which they primary have seen light, that was reflected from pigments. But wait, I think, this is no valid argument, because indirect light likewise adds up.  Light with different frequency always adds up and the reflection properties of different pigments always subtract. And the color of (the light reflected from) pigments is partly dependent from the color of the light, that irradiates them. “In the night all cats are black.” This doesn’t mean only, that they look black, but that they are black in the night. So the color of a pigment is a loose property, while their physical properties are very own. That’s a very interesting theme. But we are off topic. We should discuss that in another thread.</p>
