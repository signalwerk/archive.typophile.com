  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontaid-v-540x120-typophile_5010.gif"></div><p></p>
    <p>The Society of Typographic Aficionados is organizing <a class="freelinking external" href="http://www.typesociety.org/fontaid/" rel="nofollow">Font Aid V: Made For Japan</a>, a project uniting the typographic and design communities with a goal of raising funds to expedite relief efforts after the recent earthquake and tsunami in Japan. We hope to be able to complete something akin to the <a class="freelinking external" href="http://new.myfonts.com/fonts/fontaid/coming-together/" rel="nofollow">Font Aid IV: Coming Together</a> typeface, which was created to benefit the victims of the 2010 Haitian earthquake.</p>
    <p><strong>Update!</strong> The project <a class="freelinking external" href="http://www.typesociety.org/fontaid/" rel="nofollow">theme and submission guidelines</a> have been posted.</p>
    <p><strong>Update!</strong> The typeface now has a name … “Made For Japan”</p>
    <p>Thanks in advance for your help.</p>
    <p>— Grant</p>
