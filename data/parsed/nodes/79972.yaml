    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture_3749.png"></div><br>
      The first glyph combines two Japanese symbols for good fortune. <em>Maneki Neko</em> is a common ceramic sculpture of a cat with an upright paw, often holding a coin, inviting luck. Frogs are also associated with good fortune, especially in travel, perhaps because the word for "frog," <em>kaeru</em>, also means "to return." This frog, assuming the position of the beckoning cat, is a wish for good fortune to return to Japan.<p></p>
      <p>The second glyph combines two vital traditions of Japanese art: the calligraphy of Zen Buddhist painting and the playfulness of contemporary manga comics. The form of the circle, called <em>ensō</em>, is a common, polyvalent symbol appearing in calligraphy. Usually painted in one stroke, the painted <em>ensō</em> is a particular and imperfect expression of the absolute and perfect. This happy <em>ensō</em> has a face inspired by manga in the supercute "<em>chibi</em>" style. </p>
      <p>Thanks to my daughter for editing suggestions and to SoTA for organizing the project.</p>
    html_clean: |-
