      <p>I have recoiled from the shock of the emails from friends there and everything I am seeing on tv and online and am finally focused enough to do something. I am setting up a website and method to deliver the most money directly to organizations in Japan. This circumvents international charities and the inefficiencies associated with them. I have been conferring with friends in Japan as to their recommendations of what indigenous organizations there, in Japan, that need help. The first vetted organization is AMDA International (Association of Medical Doctors of Asia) amdainternational.com. I am researching with these same colleagues in Japan on a children's organization that could benefit and we are also in a position to give directly to the prefectures (in the U.S., 'states').</p>
      <p>I will be meeting with a bank willing to assist here in the U.S. (to handle wire transfers) and my contacts there in Japan will coordinate with CHUGOKU BANK, TOKYO MITSUBISHI BANK and YUCHO GINKO. My friends and family are primarily located in Takamatsu which is in Kagawa Prefecture on the island of Shikoku (the least negatively impacted island).</p>
      <p>The website in process is sogojapan.org which in context, 'sogo' means 'total' or 'whole' or in line with the philosophy of 'sogo-fujo' which sees that humanitarian assistance is not regarded as a single, one-sided occurrence, rather it is seen in a cycle of reciprocating assistance giving a broader perspective of time and scope.</p>
      <p>I will be offering a direct line for smaller donations, will be selling a special recut of one of my existing fonts and will try to collaborate with a screenprinting group to print tshirts to sell as well and am waiting to hear back to see if I can get some help with some letterpress options I could put up for sale.</p>
      <p>Any monies collected would go through transparent channels and deliver the money DIRECTLY to the Japanese organizations there.</p>
      <p>I think I'm still a member of SOTA. I would be happy to help curate this project with anyone and see to it that everyone's time and effort has as much effect as possible for the people of Japan.</p>
