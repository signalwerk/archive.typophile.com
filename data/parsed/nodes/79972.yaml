      <p><cite>Isn't *Yellow* the opposite of Blue?</cite></p>
      <p>No. Only in Photoshop. (Before I had posted my previous message, I had replaced the colors in Photoshop and I wondered, why it had inverted blue to yellow.)</p>
      <p>Red, blue and yellow are the main colors. Although the rgb model (red, green [but not yellow] and blue) works different on the screen, the complementary contrasts are these:</p>
      <p>Red/Green<br>
      Blue/Orange<br>
      Yellow/Violet<br>
      Black/White</p>
      <p>And yes, when I wrote, that the combination of blue and red is extremely aggressive, I also thought, that a Tsunami is extremely aggressive. But nevertheless it is also beautiful, if you have a look on it from a safe distance. It brings the death, but it is not ugly. In contradiction to that the combination of pure blue and pure red on screen is ugly in most cases, especially if the relation of the areas is so balanced. In case of your image I think, that the color harmony should have priority.</p>
      <p>I also dislike the combination of pure blue and pure yellow on screen. Red/blue (neither complementary in the pigment-, nor in the rgb-model), red and its rgb-complementary color (turquoise?) and green/violet are likewise ugly in my opinion.</p>
      <p>With the darker blue it works much better.</p>
    html_clean: |-
