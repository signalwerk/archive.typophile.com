      <p>"...the less likely one is to have the faintest idea what impact complex symbolic messages might have on the intended audience."</p>
      <p>That is what visual communication professionals throughout the World are for.  The glyph Hrant created was like any other glyph in any off-the-shelf font.  The user of the font decides on what to use and how to use it.  The @ sign was never originally intended to stand for today's most common use of it.  Any of the ascii emoticon combinations popular today online are valid fabrications of users yet bear no resemblance to what their individual parts were designed for.  Type designers are the makers of visual tools which can be used or combined with others for use in any way the user sees fit. I would bet that every single normal alphabetical glyph from A to Z started as something far different in meaning than we use today.  "A" no-longer means bulls head.  This is just the ingenuity of humankind putting tools to work.  That is not to say that users will always choose well and that every use will be perfectly understood by everyone. If someone is too lazy to go down to their basement to get a tack hammer and uses their conveniently located cell phone to pound in a tack, the phone maker is not at fault if the fragile device breaks.  The user may well be satisfied with his choice of tool and the fact that the tack is indeed driven as desired no-matter what the rest of the world may think. Sure there can be consequences when unintended damage is done in the process but that does not mean a tool should never have an unintended use.  If there were a mother who happened to be wearing a very expensive silk blouse and uses it as a tourniquet to stop the bleeding of her injured child, would she not be willing to ignore the damage to her blouse in favor of the health of her child?</p>
      <p>Yes, the type designer surely has not the faintest idea of what impact individual uses of the glyph might have, but that does not mean a cell phone, silk blouse, tack hammer or automobile should not be created.  Even if the proper tool was selected for brain surgery, it would be a horrible mistake to see it used by someone not highly skilled and capable.</p>
      <p>After reading this, I see I have written the classic example of an over-reaction to a harmless comment.--Sorry, David! :-)</p>
