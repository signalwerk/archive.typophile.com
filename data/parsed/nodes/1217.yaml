    date_raw: 26.Aug.2003 12.06am
    votes: null
    html: "<p>I don't know. In fact, I didn't even know Euclid existed until this thread. <br> <br>This is what I found on the MathType web site: <br> <br>MathType for Windows includes the Euclid font set to give a document's text and mathematical notation a consistent, industry-standard look. In addition to including hundreds of additional math symbols, Euclid fonts include Blackboard Bold (double-stroke) and Fraktur (German Black Letter) alphabets. They also include fonts that allow you to create a document in Word that looks like it was typeset in TeX/LaTeX's Computer Modern font. (<a href=\"http://www.dessci.com/en/products/mathtype/win/samples/default.htm#tex\" target=\"_blank\">http://www.dessci.com/en/products/mathtype/win/samples/default.htm#tex</a>)</p>"
