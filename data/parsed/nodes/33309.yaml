      <p>I would also look at the <a href="http://www.cinesud-affiches.com/?affiches-de-cinema-NOUVELLE_VAGUE+t_66.html&amp;urlref=http%3A%2F%2Fwww.google.fi%2Fsearch%3Fq%3Dnouvelle%2Bvague%2Baffiches%26ie%3Dutf-8%26oe%3Dutf-8%26aq%3Dt%26rls%3Dorg.mozilla%3Afi%3Aofficial%26client%3Dfirefox-a">Nouvelle Vague movie posters</a>, because there’s was an important shift in the esthetics from the style of the previously mentioned posters to the new wave realism, end of 50’s, beginning of 60’s. There’s a lot of material on the site, but you should maybe search for Truffaut, Godard, Alain Resnais or Agnes Varda for the most iconic posters.</p>
      <p>When I think of French movie poster layouts of the time, I think of something like the Paris Match example Nick posted, with a similar typeface and the one-sided layout. Like this:</p>
      <p></p><div class="imageWrap"><img src="/files/truffaut_3845.jpg"></div><p></p>
      <p>But Antique Olive seems to catch the feeling too, although I don’t think this is the original poster (I hope I ID’d the face correctly):</p>
      <p></p><div class="imageWrap"><img src="/files/a_bout_de_souffle_4324.jpg"></div><p></p>
    html_clean: |-
