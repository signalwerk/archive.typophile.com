    <p>I'm doing a poster for a film set in North Africa in 1963. I'm figuring the roman-lettering title font ought to reflect a French design aesthetic from that era, since that would probably have been the dominant design influence.</p>
    <p>But which fonts? Vendôme? Or go for Choc/Mistral? Anything I'm not thinking of?</p>
