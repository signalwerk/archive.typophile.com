  html: |-
    <p>Announcing our new Paper Sampler...</p>
    <p><a class="freelinking external" href="http://slowprint.com/portfolio/letterpress-samples/paper-sample-cover/view" rel="nofollow">http://slowprint.com/portfolio/letterpress-samples/paper-sample-cover/view</a></p>
    <p>This image shows the cover (before trim and score) which is printed in red and black on Hahnemühle's gorgeous Copperplate Etching 300gsm.</p>
    <p>Using Adobe's Garamond Pro and Caslon Pro (ornaments) printed from photopolymer on the 10x15 Heidelberg Windmill.<br>
    The initial is from a book in our collection ( C. Tacitus Opera [Officina Plantiniana apud Ioannem Moretum, Antwerp 1607])</p>
    <p>We're happy to offer this cover with some of our favorite papers and printed samples inside to designers with an interest in letterpress printed projects! There is modest charge to cover shipping and handling, as our resources are limited!</p>
    <p>Please send a note with your request from the slowprint.com contact page:</p>
    <p><a class="freelinking external" href="http://slowprint.com/contact-us" rel="nofollow">http://slowprint.com/contact-us</a></p>
    <p>PF</p>
    <p>Peter Fraterdeus<br>
    Almost Free™ Business Cards from Exquisite Letterpress<br>
    <a href="http://slowprint.com/almostfreelp" title="http://slowprint.com/almostfreelp">http://slowprint.com/almostfreelp</a></p>
