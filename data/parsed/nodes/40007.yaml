    html: |-
      <p>The beliefs of the "shareware" boards is if no one has put a copyright or designer's name, and they have tried to locate it -- then it is up for anyone to use.</p>
      <p>Since you are a profession and want the proper permission, then maybe you can find something "legal" to substitute. There are many great handwriting fonts these days.</p>
      <p>In my searching I came across this conversation on the very same topic<br>
      <a href="http://ask.metafilter.com/52509/IS-Angelinattf-really-a-freeware-font" title="http://ask.metafilter.com/52509/IS-Angelinattf-really-a-freeware-font">http://ask.metafilter.com/52509/IS-Angelinattf-really-a-freeware-font</a></p>
      <p>If we believe what is written then this font is really named Angie and was used exclusively for a greeting card company -- and you know, there is no reason to doubt that - happens all the time.</p>
