    <p>A few days ago, an agency asked if they could have the character set of the typeface »Angelina« extended with some missing characters. They downloaded it from one of the "free font" websites., such as this one here:<br>
    <a href="http://www.dafont.com/search.php?psize=m&amp;q=Angelina" title="http://www.dafont.com/search.php?psize=m&amp;q=Angelina">http://www.dafont.com/search.php?psize=m&amp;q=Angelina</a><br>
    The license and designer info in the font does not contain any information about who designed it or to what conditions it my be used or licensed. Can anyone here tell who is the designer of this font?</p>
    <p>Regards,</p>
    <p>Albert-Jan Pool</p>
