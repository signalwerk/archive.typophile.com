    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : William Morris</strong></p>
    <p>English, 1834--1896</p>
    <p>Craftsman, writer, socialist and influential founder of the <a href="/wiki/Arts%20%2526amp%3B%20Crafts" class="freelinking" rel="nofollow">Arts &amp; Crafts</a> movement. Morris was a letterer, type designer, printer, and book maker who sought to revive Renaissance humanism in the arts and the medieval system of artists' guilds, in explicit reaction to the increasing industrialization of English society. Founded The <a href="/wiki/Kelmscott%20Press" class="freelinking" rel="nofollow">Kelmscott Press</a>. Designed many types for that press, and specialized in a kind of idealized Renaissance design, heavily ornamented, densely set, and very difficult to read, although easy to admire.  Inspired <a href="/wiki/Dard%20Hunter" class="freelinking" rel="nofollow">Dard Hunter</a> and the other exponents of the American Arts &amp; Crafts movement.</p>
