  html: |-
    <p>Greater Albion typefounders is trying out a little experiment in market research.  We plan to have series of poll questions on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a> with a view to making the design of some of our futre projects a artially interactive process.  </p>
    <p>The initial question is both simple an broad, but latr we plan to ask people to choice between samples of design alternatives and maybe even individual glyphs. Why not pop in <a class="freelinking external" href="http://gatf.wordpress.com/2009/03/25/what-sort-of-faces-would-you-like-us-to-develop/ " rel="nofollow"> here</a> and give us your vote, or leave a comment?</p>
