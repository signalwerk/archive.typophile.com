      <p>As a substitute for non-embroidery purposes consider something like Monoline Script <a href="http://www.identifont.com/find?font=Monoline+Script&amp;q=Go">http://www.identifont.com/find?font=Monoline+Script&amp;q=Go</a> or Monotype Script <a href="http://www.identifont.com/find?font=monotype+script&amp;q=Go">http://www.identifont.com/find?font=monotype+script&amp;q=Go</a><br>
      In both cases you can follow the links to "Show more similar fonts" to see more substitutes.<br>
      Don</p>
