    html: |-
      <p>Commercial embroidery of clothing has been done since long before other digital computer fonts.<br>
      Script styles that were developed independently of computer fonts.<br>
      See for example a font often called Embroidery Athletic Flair or <img src="/sites/default/files/old-images/<a href=" mailto:embroideryathleticflair="">EmbroideryAthleticFlair@80pct_6188.jpg"&gt; which looks similar to the Harvard embroidery script except for the _H_, _M_ and _o_.<br>
      Variations such as Automotive Workwear Sport Script have the same _o_ as the Harvard letters. <img src="/sites/default/files/old-images/EmbroideryAutomotiveWorkwearSportScript_3547.jpg"><br>
      There is probably a variation for medical uniforms.<br>
      Modern embroidery  machines can also use conventional retail fonts converted to a format usable by the machine.<br>
      Don</p>
