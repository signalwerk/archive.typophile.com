    html: |-
      <p>Claus,</p>
      <p>Thanks for your comments!  After a long delay, I have finished another draft.  The most notable improvement is the smoothing of curves in such letters as P, particularly where a straight segment goes into a curve.</p>
      <p>I also fixed the width of the t, using the guideline that the right part of the crossbar should extend to the right of the stem as far as the stem extends above the crossbar.  This seems to be a common proportion in many of the fonts that I looked at.</p>
      <p>I'm still having trouble with the S.  I'd appreciate any comments on how to improve its shape.</p>
      <p>Claus, for the harmony: I think that my p,b,q are more related to my n,h,m,r than the rounder o,c,e.  This is a deliberate choice.  The shapes mirror those common in italic fonts; in some sense Aurulent Sans is an upright italic.  I also find that this shape give more compact forms, which is desirable in a screen font.</p>
