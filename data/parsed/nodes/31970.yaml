      <p>I've been following the discussions on Raph's spirals, and I've also tried them out to design some characters.  I certainly can see the advantage of them.</p>
      <p>However, since I'm creating this font using MetaType1, I don't think that I'll be able to use the spirals (at least until MetaSpiro comes out).  However, using some macros I wrote for ensuring continuous curvature at the straight-to-curve joins, I have improved the letters in Aurulent Sans quite a bit.  Do you still think they need improvement?  Which letters specifically?  Thanks!</p>
