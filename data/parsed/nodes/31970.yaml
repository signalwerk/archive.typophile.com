      <p>Hi Stephen<br>
      Not too bad, but there are many things to take on. Many of the outline seem rather unrefined e.g. B and S. Still it doesn't look too bad in print. Let me give you a quick run down of what I notice firstly:</p>
      <p>UC proportions seems out of balance. C, G and S seems too wide compared to O. A looks slightly too narrow. The tail in the Q is distracting.</p>
      <p>LC proportions look much better, yet b, d, p and q seem slightly too narrow and t is way too narrow - you should extend it on it's right side. The loop in g feels distracting (yes, and thats comming from me ;-) r seems slightly too wide. </p>
      <p>Generaly the metrics looks too tight, but this is always a matter of context so may I suggest trying out some variations.</p>
