      <p>Claus, thanks for your comments.  I adjusted the widths of CGSA as you suggested--they look better.</p>
      <p>I also improved the curves in the P.  The new version at the top of the thread shows the new P.  One problem I had was making the curve smooth from the straight line (the points C in your picture above).  I noticed in Kulby that your points were not horizontally aligned, but the inside point was farther to the right than the outside point.  In some othe fonts, I noticed the outside point was farther to the right.  And I remember reading in some thread the comment (maybe by Paul Hunt?  I can't find it again) that usually the points are aligned.  Do you (or anyone else on Typophile!) have any suggestions about the best way to make these points smooth?  Without additional points on the curve, it's impossible to make them exactly smooth--I wonder if there is a good way to add a few points to improve the smoothness.</p>
      <p>Finally, could you explain more "harmonisation characters in-between"? Do you mean that my characters are not similar enough to each other?  Thanks!</p>
