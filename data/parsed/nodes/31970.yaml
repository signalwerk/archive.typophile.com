    html: |-
      <p>Hi Stephen<br>
      I don't know if you are using Fontlab? Anyway one way is to place curve-points on both sides of an original point, then delete the original point, then adjust the two new points, then set a new extreme point inbetween, and then deleteing the two placed points you set. Fontlab tries to keep the shape as it is when you do this, but due to the bezier-nature of the curves, the curve is naturally smoothed when you do this. Take a look here: <a href="http://briem.ismennt.is/2/2.3.6a/2.3.6.02.curves.htm" title="http://briem.ismennt.is/2/2.3.6a/2.3.6.02.curves.htm">http://briem.ismennt.is/2/2.3.6a/2.3.6.02.curves.htm</a></p>
      <p>The harmonisation between characters is the natural relationship between n, m, h, r or between d, b, q, p, c, e, o for instance. In your face think about the shape of the very round c, o and e, and the not so round d, b, q, p.</p>
      <p>Harmonisation means that the charactershapes should look as if they are from the same typeface - that they share an internal logic, a common recipe for their design. How you as the designer achieves this is entirely up to you. There are no rules, it just has to look 'right'.</p>
      <p>There should be nodes at extremes, and as few as possible. Bezier handles should not reach over other points. Thats basically it.</p>
