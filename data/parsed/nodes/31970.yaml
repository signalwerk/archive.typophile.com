      <p>At the moment, only the primary ASCII characters have been created, and only the letters have been refined.  I'm most interested in feedback on the letterforms before proceeding.  There is no kerning at the moment.</p>
      <p>In the italic, I've mainly been working on the lowercase letters.  I'd be happy to hear suggestions for the uppercase letters, particularly the "diagonal" letters V, W, and Y (the lowercase v, w, and y have "flags" inspired by Scala Sans that I think work pretty well).  It might be that the best solution for the uppercase letters is just to keep the oblique regular shapes.</p>
