    html: |-
      <p>Claus,</p>
      <p>Thanks for your comments!  </p>
      <p>Regarding the proportions, Aurulent Sans is actually somewhere between a grotesque and a humanist sans serif.  Hence, the UC letters are much more uniform in width.  I'll try playing with the CGS, but their current widths were chosen to be on the wide side.  The LC letters were also chosen as a compromise between grotesque and humanist proportions.  The r being wide and the t narrow were chosen that way because they look better at medium sizes (16-22 pixels high) on screen.  Looking at the t again, though, the narrowness really stands out.  I'll certainly be adjusting that.</p>
      <p>The open-looped g was chosen again to make the character more open at small pixel sizes (though at really small pixel sizes (less than 10 pixels) it doesn't work either).  The tail going into the interior of the Q was chosen so that underlined O and underlined Q could be distinguished (underlined text frequently occurs on screen with links and hotkeys).  I'd be interested if you had another suggestion how to do that.</p>
      <p>Finally, I don't understand what you mean by "the outline seem unrefined" for B and S.  Could you please be more specific?  The S (and s) has given me a lot of trouble--it was by far the hardest character to design, and I'm still not completely happy with it.  I'd appreciate any suggestions.</p>
      <p>Hopefully I'll have an opportunity to work on this tonight and be able to post an updated version.</p>
