      <p>In the <a href="http://typophile.com/node/33531" rel="nofollow">Spiro</a> thread, a discussion arose about how to parametrically define a font.  Since Aurulent Sans is created in MetaType1, it is easy to change basic font parameters, such as x-height, and recompile the font.  Hrant asked to see this in practice, so I generated a sample showing the word "skagy" with varying x-height.  Many parameters of the font can be easily changed: stroke thickness, width, height, etc.  However, to make things manageable when programming, some of the parameters are related in certain ways that might be unexpected (such as dependence of question mark on x-height). </p>
      <p>The amount of time it took me was changing one line and hitting recompile. The tricky part was figuring out how to install several different versions of the same font.</p>
      <p>The ability to change basic parameters globally over the entire font is quite nice, but it does require planning the scripts (somewhat) carefully. For instance, I can’t push the x-height much over 600, because then the script that generates the question mark barfs. Of course, as Hrant pointed out, it’s presumed that the parameters won’t vary too much from the value in mind when the scripts are written.</p>
