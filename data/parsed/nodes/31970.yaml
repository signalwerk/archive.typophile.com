      <p>Hi Stephen<br>
      I have made an illustration of what I mean by 'unrefined'.</p>
      <p>C and the green areas are where the connections from a curve to a straight line are too visible. They should be smoothed out so that they are invisible.</p>
      <p>F and the magenta areas are where your curve is too flat. There are sections of too flat outline alternating with sections of more curved outline, which makes for an uneven impression.</p>
      <p>B and the cyan areas are where the curve is much more curved than the sections meeting it, and thus that area looks as if it has a 'hump' at that location.</p>
      <p>This is general issue with most of your characters. Some more than others. Another thing is the balance between similar shapes from character to character, and the need to differentiate the shapes from each other. In you face I miss some more harmonisation characters in-between.</p>
      <p>Hope this is of inspiration...</p><div class="imageWrap"><img src="http://typophile.com/files/P_6325.gif"></div><p></p>
