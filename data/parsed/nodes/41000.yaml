      <p>If the [printed] book were invented today? A novel concept. Let's pretend that printing never existed and books have been printed electronically for the last 500 years and are read on electronic readers that were perfected during the first two or three hundred years of electronic publishing.</p>
      <p>[seque to futuristic conference room, start with voice over]</p>
      <p>I'm a writer and at my publishers office this morning. The publisher, designers and typesetters have my new book all wrapped up in Portable Document Format ready for global distribution. We're excited. My book is ready to be distributed to the entire world in minutes by just pushing some electrons around.</p>
      <p>But one of the designers speaks up and says somewhat confidently, "hold up, I've thought of a better way to get this information to the readers of the world. First we'll chop a few thousand trees and transport them on big trucks to a plant that will grind them up into pulp, wash the pulp with wicked bleach" — he didn't know what happened to the bleach after the wash. "Then we press the pulp and iron it on huge screens, roll this new paper on huge spools, and put the spools on other big trucks to take them a few hundred miles to another plant. It only takes a month or so and only cost a few hundred thousands dollars."</p>
      <p>"While the trees are being ground, bleached and pressed, another factory is cooking up big gloppy oil and pigment. The plant cooks this glop to just the right consistently by mixing in some sweet solvents — it's quite a spiritual thing. Then it's put in barrels, loaded on other big trucks, and transported a few hundred miles to the same plant where the paper was delivered."</p>
      <p>At this point the designer said "they take our PDF that we have prepped here, and they etch these huge metal plates with the design. Then they put it on these big machines that transfer the pigmented glop, called ink, onto the paper. This pigmented paper is then cut up and glued into stacks called books. These books you can actually hold in your hand and smell, or even lick if you want! These paper books are collected and put into boxes, and then, you know, loaded on big trucks and taken a few hundred miles to a warehouse."</p>
      <p>"At that point the books are broken into smaller units and taken on thousands of smaller trucks and airplanes to places all over the world. What about it? What do you think?"</p>
      <p>So we think about it. Hmmm? We can deliver this right now with hardly any effort or expense and it can be read on electronic readers that we've been using for hundreds of years, edits and corrections can be made instantly, and autoreaders can even read it to someone without effort. Or we can chop hundreds of trees, mix hundreds of gallons of solvents, cook oil into ink, burn thousands of gallons of fuel and employ thousands of hours of manpower. It didn't take long for us to snort and say "nah, we think not."</p>
      <p>[freeze frame, and wrap with voice over]</p>
      <p>I'm sure the printed book will last, for a few more years anyway. But you guys are funny. Do all of you naysayers still hitch the horse to the buggy every morning for the ride to the bookstore? I'm amazed at the lack of vision — the same crowd that dismissed typesetting on PCs a couple of decades ago. And let's see, who was that guy who saw the potential for proportional type on PCs?</p>
    html_clean: |-
