      <p>enjoyed this list</p>
      <p>****</p>
      <p>Posted By: Steven Poole of The Guardian</p>
      <p>I here propose a minimal list of features that any successful ebook device must eventually have. Feature parity with physical books, after all, is surely a reasonable baseline demand. So here is what the electronic book of the future will be like.</p>
      <p>1 It will have an inexhaustible source of energy and never need recharging.</p>
      <p>2 It will have resolution as good as print. (No, Amazon: really as good as print.)</p>
      <p>3 It will be able to survive coffee and wine spills, days of intense sunlight, dropping in the ocean, light charring, and falling completely into two or more pieces, while still remaining perfectly readable afterwards.</p>
      <p>4 It will allow me to scribble notes and/or doodles in the margins, with my choice of mechanical pencil or fine Muji fibre-tip pen (black). (Note: typing in the margins with a crappy thumb keyboard is not an acceptable alternative.)</p>
      <p>5 It will allow me to riffle through it and thus get a quick, intuitive look at the book's argumentative or narrative structure.</p>
      <p>6 It will allow me to tear off the corner of a page to write down my phone number (or someone else's).</p>
      <p>7 It will display to other people in coffee shops and on public transport the title of what I am reading, so as to advertise my erudition or quirky sense of humour.</p>
      <p>8 It will be physically handsome, not drop-dead fugly. (Note to Amazon: for pity's sake, next time, head-hunt people from Sony or Apple.)</p>
      <p>9 Indeed, the books on it will still be designed, by typesetters and graphic artists, so as to feed our aesthetic pleasure.</p>
      <p>10 I will still be able to lend or give books to friends, or swap books in and out of the honour library of much-read novels in a Mediterranean seaside bar.</p>
      <p>11 I will be able to use the ebook as a reliable flat surface for rolling cigarettes or other leaf-based refreshments, without worrying about debris shorting the motherboard.</p>
      <p>12 When I receive the updated edition of the Oxford Companion to Philosophy, I will be able to press the previous edition into service as a stand for the left-hand music speaker on my desk.</p>
      <p>13 The ebook will function, moreover, as both bug-crusher and discretionary hat. Placed on my face, it will make a soft roof against the sun on the beach.</p>
      <p>14 I will be able to hurl a fatuous tome such as Jeff Gomez's Print Is Dead across the room without thereby destroying my ability to read any other books.</p>
      <p>There. Only 14 features to go before we can all abandon paper. Not too much to ask, is it?</p>
