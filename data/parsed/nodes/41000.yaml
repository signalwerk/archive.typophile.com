      <p>From what I can tell, the entire notion that reading is rapidly, dramatically declining, is a fallacy. While sales of what publishers and librarians call “serious fiction“ are clearly falling off, it seems like the markets for pulp fiction, fantasy, nonfiction, comics/graphic novels/manga and periodicals are all selling wildly. The tiny independent bookstores of America have been replaced by massive superstores, whose profits are in free-fall because people buy enough books that they’re ordering them from mail-order discounters to save money—not something that people who only read one or fewer books a year do. Digital library catalogs, editions of books, periodical archives, etc. make it easier to do vast amounts of research in relatively minuscule amounts of time. Stephen King has written about this phenomenon, point out that maybe people are just reading less serious fiction because what’s on the shelves is often boring and pretentious, and consumers would rather just stick to Harry Potter.</p>
      <p>Can anyone who works with the book industry shed some light on overall book sales as opposed to the decline in reading novels?</p>
