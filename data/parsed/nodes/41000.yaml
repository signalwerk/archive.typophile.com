      <p>What needs to happen for the e-books to become the dominant form:</p>
      <p>1.The readers must become dirt-cheap (will happened when e-texts become responsible for most of the revenue)<br>
      2. The screens must be of high enough resolution and have no strain on the eyes. (Already happening with e-paper)<br>
      3. The device must be highly durable and easy to use.<br>
      4. Common formats must emerge.<br>
      5. Professional practices of design and typesetting must be applied to commercially available texts.<br>
      6. Freely available and public domain books and previews (Gutenberg, Moshkov library, google books etc.) be instantly accessible.<br>
      7. Free wireless across the western world.</p>
      <p>Most of these should be achieved in the next 3-4 years, and 6 more years for gradual adoption and acceptance. So all-in-all 10 years. of course this leaves us with only 5 more years until the singularity, but that's a different story :)</p>
