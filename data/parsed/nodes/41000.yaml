    html: |-
      <p>The video phone did not catch on because it does not solve any particular problem. It is more expensive, and less useful then a voice-only phone. It makes people feel uncomfortable and self-conscious, complicating communication. You wouldn't want to receive a call while sitting on a toilet, or on bad-hair-day, and would think twice about calling someone after a night of heavy drinking. Video calling is more difficult, more expensive and less efficient in day-to-day life then voice communication. E-books are cheaper to produce, easier to distribute, and simpler to augment.</p>
      <p>Don't get me wrong, I love books, love 'em with all me heart. I enjoy the smell of good binding, the tactile quality of the paper, the sound of rustling pages and the sight of arching spines, lining together on the shelf. The prospect of books becoming obsolete, sends a shiver down my spine. But look at it this way: An illuminated manuscript is much more precious and beautiful thing then a printed codex. Each volume is unique, each infused with the humanity of the scribe and the vibrance of the illuminator. But movable type on paper, is simply more practical, accessible and easier to produce. Clay-&gt;Papyrus-&gt;Vellum-&gt;Paper-&gt;... Each was succeeded by the next. What makes paper exempt?</p>
