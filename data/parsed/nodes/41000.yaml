    html: <p>Jobs wasn't suggesting that books themselves are dead; he was commenting on the failure of the Kindle as a product. I disagree with his reasoning--the Kindle is a failure because people prefer physical media, and there's never any reason you would need to carry 800 books with you. I can believe the statistic, however, that 40 percent of Americans read one book or fewer last year. And that one book was Harry Potter.</p>
