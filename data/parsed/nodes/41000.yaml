      <p>I'm betting on books. They are fetish objects more and more. As reading on screen becomes increasingly common the line between informational reading and the collecting aspect of owning a printed book will become even more precious. Just follow a thread or two about which vintage version of a book is most desirable. I can see the market for printed books shrinking, and the quality going up as books will become seen more as collectible objects. If on screen reading improves, as we all suspect and are being sold on the idea, then many of us may find ourselves reading books on screen that we own in print so as not to put the wear and tear on the spines.</p>
      <p>I like to backpack, but I don't own a GPS device. I take a compass and USGS map. The reason is weight. Same issue with a book. Not everyone wants to be encumbered with electronic devices. There is a freedom to a book and a low tech appeal that probably will never be matched by an electronic device. How many book pages can you read while the person next to you turns on a device and loads the text they want to read? How long to you have to recharge a book before you continue reading? There are so many more factors than on screen text rendering.</p>
      <p><cite>I’m sure the printed book will last, for a few more years anyway. But you guys are funny. Do all of you naysayers still hitch the horse to the buggy every morning for the ride to the bookstore? I’m amazed at the lack of vision — the same crowd that dismissed typesetting on PCs a couple of decades ago. And let’s see, who was that guy who saw the potential for proportional type on PCs?</cite></p>
      <p>The horse and buggy thought is interesting. We do drive cars (for the moment) but horses still exist, along with the tack, training and other associated industries. Horses are still used for patrol and crowd control in some urban environments (I'm laughing as I write from Fort Worth). The new technology came in and the old industry contracted and adapted. Point being that if you wanted a buggy today you would probably be purchasing one from a very skilled artisan. The buggy might very well be of higher quality than what was available pre-automobile.</p>
