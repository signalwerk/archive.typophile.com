      <p>I wonder if a similar debate happened when clay tablets were starting to get replaced by papyrus.</p>
      <p>Clayman: This papyrus stuff sure is sporting, but it'll never replace the tablets! We've had them for thousands of years, there is an inherent quality, the reassuring weight... they can last for centuries and longer! Clay is warm, volumous and sacred, it's taken from our world's bosom, and shaped by crafty hands into a thing of beauty. It is binding and once set, can not be altered. Without clay, there can not be a law.</p>
      <p>Scrollman: Yeah dude, but it's frigging heavy, and a pain in the loincloth to produce!</p>
      <p>I am sure books will last for at least 10 more years, and would still be around as relics and collectors items after that, but the paradigm is shifting, and as much as this saddens me, there doesn't seem to be much we can do.</p>
      <p>Personally, I'd rather we were still hand-drawing things on virginal vellum.<br>
