      <p>There are several things at play here. First, I’m not one to defend Steve Jobs, but the Engadget article linked at the top of this thread has him saying that people don’t read anymore, not that books are dead. I have issues with both statements anyway.</p>
      <p>That people are reading more and more off screens is just a fact, I don’t think it needs to be qualified further. I’m reading my news online on my computers (an iMac and a crusty old TiBook, alas), and I’m reading technical material (documentation, etc.) and work documents. Do I ever need to print stuff? Very seldom, and I think it’s for the better.</p>
      <p>I don’t buy the somewhat luddist position of people who want to feel the paper and smell the ink vs. shabby computers or book-reading devices. I love books, I love paper, I love letterpress too, I wouldn’t be here if that wasn’t the case. But I don’t think anyone can argue that John Le Carré or Dan Brown books, which are printed on cheap paper and are the classical read and then throw in a pile of crap kinds of books, are really objects that we want to carry around in this new century. My father consumes them like crazy, then they end up in huge stacks that just take place and gather dust. Never do they get re-read, because that’s not what they’re after: you don’t read novels like these, you consume them as entertainment. If you follow my point, that kind of disposable stuff doesn’t belong to print, in my opinion. These books don’t have the feel of good books, because they are cheap by design.</p>
      <p>That market sector, which is just huge, is rife for being passed onto e-book reading devices, screens, etc. I have been working with an Italian company that imports e-ink reading devices like the <a href="http://www.irextechnologies.com/products/iliad" rel="nofollow">iRex Iliad</a>, and I have had one for more than a year now. That is something, like the Kindle, which you can take with you in bed. It doesn’t make any noise, it doesn’t produce light (you’ll need your regular book lamp), it’s as light and as a book. Don’t take my word for it, try to get your hands on one and see for yourself. And consider a device holds not just one book, you can annotate them without harming the original, you can download one while on the road for a fraction of the cost of the paper version, etc. </p>
      <p>Also think of the distribution scenarios and of the environmental issues. Paper needs to be transported by plane, trains, wheel, it has weight, it has limited supplies so new print runs need to be scheduled and produced, then there’s the issue of excess copies, etc. All of this problems that we take for granted are simply not there in a digital scenario. People get books more often, pay them less, authors get paid faster and possibly more without the overhead of print production and distribution, and marketing changes dramatically, too. </p>
      <p>For books which are truly of value, either because they’re wonderful references (think <cite>Letters of Credit</cite>!) or just plain wonderful books (the <cite>Divina Commedia</cite> published by <a href="http://www.talloneeditore.it/" rel="nofollow">Tallone</a>), I just don’t see what the supposed threat might be. Where form is ahead or on par of function, form has value and I’ll gladly continue to pay for it. </p>
      <p>As for typography: technical changes are all over the history of our craft, yet until we somehow come up with a way to replace words that need to be read and written, I don’t see any sort of harm whatsoever. In fact I think the market for screen fonts and other ways to present text on screens will become bigger and more diverse, and that is good news for typographers, type designers and for people reading off screens as well.</p>
    html_clean: |-
