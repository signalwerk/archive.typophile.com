    <p>Hi,<br>
    This may be a simple question but I can't seem to figure out an elegant/simple solution to this problem.</p>
    <p>I am designing a large poster with one side that holds a fair bit of text so a grid/column layout will be necessary.</p>
    <p>It will be folded across into four sections. So - I thought that setting up the columns would just be a matter of setting the gutter equal to the margins, but evidently this doesn't work because the outer 'sections' are narrower than the inner 'sections' due to the margins?</p>
    <p>I am thinking I should evidently try to avoid having text set horizontally over folds (especially large amounts of small copy).</p>
    <p>I'm wondering what kind of solutions people have come up with to setting text in a page that folds as it seems that even gutters across folds are impossible unless they are unusually wide (twice the margin), or the margins are unusually narrow?</p>
    <p>(Am I making any sense at all or am I too tired?)</p>
    <p>I've attached an image for reference...</p>
    <p>Thanks so much in advance,<br>
    Alan</p>
    <p>EDIT: I am starting to think the answer is simply "Draw the guides manually".</p>
