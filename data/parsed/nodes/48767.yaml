      <p>Yes it's a bit confusing because unless the outer margins are adjusted almost as tightly as the gutter, then the gutter won't be centered on the folds of the paper. Otherwise, it seems like uneven columns is the only solution - which wouldn't be a problem if there were more dynamic variation in the text (different content might take a different column width), but alas it is almost an entire page of the same kind of content without any varying hierarchy.</p>
      <p>I've attached another image showing the difference. The outer columns will always be narrower I suppose, maybe it isn't as odd as I'm thinking it is to have varying gutters or column widths? I suppose I'm just wondering if there is some sort of rule of thumb for this kind of thing because I feel like I am over-thinking this.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gridq2_4081.gif"></div><p></p>
