    html: <p>I'm guessing the pink lines are where the folds will be? I could see adjusting the column widths in the outside sections so that they would be equal to each other (but different than the column widths of the inside sections). This sort of thing would depend on how big/wide the columns are. I could see how this could lead to the outside columns looking "wrong" if the difference isn't enough.</p>
