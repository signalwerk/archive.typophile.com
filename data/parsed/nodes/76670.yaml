      <p>Wait, does he need the typeface or do you?<br>
      If he wants it for his computer he should be licensing it (so you shouldn't have to pay for it, I mean).</p>
      <p><cite>"text that contains a lot of numbers"</cite><br>
      Can you tell us a little more about the sort of text this is? That would make it easier, presumably, to give good recommendations.<br>
      (Since you mention oldstyle figures it seems that you want the numbers to «blend in» to the text? This sure makes sense for a text intended to be read continuously, but bear in mind that in some texts you want numbers to jump out a bit more, to be more immediately visible when quickly scanning…)</p>
