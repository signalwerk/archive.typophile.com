    <p>Hello everybody,</p>
    <p>I'm a first year graphic design student, so I'm just starting out. Since I'm doing graphic design now, everybody suddenly wants my advice for their birthday invitations etc. Most of the time I'm able to help them, but now I've got a question I don't have an answer to.</p>
    <p>My dad needs a font for text that contains a lot of numbers. I've spoken to him about it and showed him some fonts that are already on his computer, like Georgia which has text figures (old style/hanging numbers). He didn't like the that there's only a bold, a regular and an italic, as he needs a semi-bold as well... I am willing to pay for a good typeface with old style numbers, as I think I'll be able to use it in coming years anyway, but it shouldn't be too exclusive/expensive as I am a student.</p>
    <p>What he needs:<br>
    - Serif<br>
    - Old style numbers<br>
    - Regular, semi-bold, bold and italic<br>
    - Will be used for 10 or 11 pt text and printed out, legibility is important</p>
    <p>Does anyone have any suggestions? </p>
    <p>- Eline</p>
