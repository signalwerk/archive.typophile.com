      <p>There are many fonts with the characteristics you did mention, although the need to handle a lot of numbers usually imposes dificulties in most fonts. Some of my favorites:<br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/utopia" rel="nofollow">Utopia</a><br>
      <a class="freelinking external" href="http://www.typotheque.com/fonts/brioni" rel="nofollow">Brioni</a><br>
      <a class="freelinking external" href="http://commercialtype.com/typefaces/guardian" rel="nofollow">Guardian Text</a><br>
      <a class="freelinking external" href="http://www.typeculture.com/foundry/font_collection/font.php?ID=FNT09" rel="nofollow">Expo Serif</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/tisa/" rel="nofollow">Tisa</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/type-together/skolar" rel="nofollow">Skolar</a></p>
      <p>The question about to properly handle massive number usage in various scenarios was one of the main reasons I did begin to design my own <a class="freelinking external" href="http://www.typophile.com/node/67787" rel="nofollow">font</a> (the other was to handle texts with many acronyms).</p>
