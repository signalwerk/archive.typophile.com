    <p>Hi guys,</p>
    <p>I need your help. I've got this excel file with thousands of lines that I need to transport to a pretty table in InDesign. So far so good, copy paste does the trick. The problem is: there are some products that have multiple codes in it and copy/pasting it to ID creates multiple rows instead of a single row followed by "child" rows.</p>
    <p>I've attached an image to clarify what I just tried to explain.</p>
    <p>Basically I need to be able to import the Excel table (exactly as it is) to InDesign.</p>
    <p>Any ideas?</p>
    <p>Thank you!</p><div class="imageWrap"><img src="http://typophile.com/files/illustration_01_6069.jpg"></div><p></p>
