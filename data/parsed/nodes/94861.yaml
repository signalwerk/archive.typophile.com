  html: |-
    <p>This flowertypeface is a beautiful composed, highly detailed, alphabet complete with numbers and special characters like an ampersand or an @-sign, designed by Novo Typo, designers from Amsterdam, The Netherlands.</p>
    <p>NT Pure makes a beautiful combination with NT Fall and NT Lily.</p>
    <p><a href="http://www.youworkforthem.com/font/T3190/nt-pure" title="http://www.youworkforthem.com/font/T3190/nt-pure">http://www.youworkforthem.com/font/T3190/nt-pure</a></p>
    <p>NT Pure is a handset typeface collection of 43 images in high resolution RGB 26 cm (high) format on 300 dpi (3072 pixels). All images are PSD documents, placed on a seperate layer, on a transparant / white background.<br>
    Please notice; NT Pure is not a systemfont.</p><div class="imageWrap"><img src="http://typophile.com/files/T0000_00_4665.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_01_5697.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_02_4549.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_03_5308.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_04_5707.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_05_5287.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/typespecimen-PURE_4624.jpg"></div><p></p>
