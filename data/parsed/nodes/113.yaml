    html: <p>I took a typography class taught by Joe Kral of <a href="www.testpilotcollective.com" target="_top">Test Pilot Collective</a>. I had already started to build my own fonts, but they all sucked. (For instance, I took the Apple font "Techno" and added bumps to it.) <br> <br>I was very inspired by this class and redoubled my efforts.</p>
