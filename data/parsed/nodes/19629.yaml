      <p>Here I am again. I have to thank you for the attention you gave to my question, and I’m honored to talk to such experienced type lovers.</p>
      <p>- to Maxim Zhukov: Here on viale Gramsci we have many recipes on the way to our oven: we usually work on brand and retail projects, but recently we focused on this graphic design project in Moscow. My recipes always involve gestalt theories, so you can find gestalt almost anywhere, like garlic in italian cuisine! I’d like to put some of my garlic in russian recipes too (I hope It works).<br>
      Working with russians I could compare cultures and see differences, but mostly I found unexpected human and professional qualities, I’ve seen a country which is growing rapidly and which is consciuous of It’s value. I often travel for work, and I worked on each side of the planet, but with Russia it’s been love at first sight.</p>
      <p>- to Alessandro Segalini: I don’t know what were they thinking when they create the Neo font, but it really lacks accents for normal use in italian (you can’t write “è la mia città”), in french, and so on.<br>
      Thanks for your font suggestions, but the client likes Neo, so I should work on this font. I found that many publishers use their customized version of Neo, and I’m thinking to walk that way. Thank you (I suppose we can talk in italian, but It could not be fair for the community here on typophile).</p>
      <p>- to Danya: I’m taking Russian language lessons but fortunately I can rely on translators when I am in Moscow, cause I’m in a ridicolous early stage of learning! I’ll contact you. Thank you very much.</p>
