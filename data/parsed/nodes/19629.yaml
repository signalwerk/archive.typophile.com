    html: |-
      <p><em>where the Cyrillic “x-height” is slightly larger than the Latin x-height ... since it helps equalize the apparent sizes (because Cyrillic has far fewer extenders)</em></p>
      <p>I did some tests of this theory (with a sans face) and it does seem to work, but only when the typeface has a small x-height in general. </p>
      <p>Otherwise, the Cyrillic tends to look very “cappy” and extender-less in comparison with the Latin.</p>
      <p>But as there are not any typefaces like this available, ones that have a large x-height seem to minimize the “extender gap” between the two scripts, as the extenders don’t play such a strong role as they do in faces with a small x-height.</p>
