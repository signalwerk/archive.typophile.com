    <p>Hi masters of typography,<br>
    I’m quite a typo-fan, and a heavy user: now I have this brand new problem: a big fashion catalogue to be made in three languages, part in the italian office, and part in the moscow office. I choosed the “neosans, neotech” fonts from Monotype, but it does not have <a href="/wiki/cyrillic" class="wiki">cyrillic</a> fonts and even lacks of some accents used in the italian language.</p>
    <p>Have anybody of you just had the same problem: can you suggest me some fonts which could fit my needs? Anyway, if my english has been understandable (I think I have to practice!) please, can you help me with some advice?</p>
    <p>Thank you in advance,</p>
    <p>BERGMAN</p>
