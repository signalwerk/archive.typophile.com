      <p>When deciding on a Cyrillic to nicely match a Latin, the one thing I would recommend (not least because virtually nobody else will) is to end up with a setup where the Cyrillic “x-height” is slightly larger than the Latin x-height. This is anti-conventional, but to me critical (at least in running text, although not in display) since it helps equalize the apparent sizes (because Cyrillic has far fewer extenders). One problem though is that you generally can’t simply use a difference in point sizes (within most any “canned” Latin+Cyrillic family) to do this, since the color balance will shift. (Yet another reason to wish MM were still alive.)</p>
      <p>—</p>
      <p>Danya: killer logo.</p>
      <p>hhp</p>
