    <p>If I can start off by asking a question regarding type used in magazines. If a certain typeface is used for a masthead, should it be reused for all other headers and title pages within the magazine, but like in differnet fonts such as bold, condensed etc? Add to that, should the same typeface be used throughout the whole magazine (for headers, title pages, body copy etc) or should they vary depending on the article subject?</p>
    <p>Anyway, I would be thankful if you could give out a few suggestions for a typeface/s to be used for a food magazine. Masthead, title pages, body copy etc. I’m hoping to achieve a modern/in-style comtemporary look with the magazine, and would like the type to really help it shine. The photography will also be nicely done.</p>
    <p>It’s for a student project, and so any help/advice given would be much appreciated. Thanks.</p>
