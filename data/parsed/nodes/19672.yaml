      <p>In my opinion The masterhead should a unique piece... treated pretty much like a logotype. Also I would never use the same typeface for both headlines and body copy. Better then to pick some typeface suited best for its purpose. That would give an optimal use and display of both typefaces, I think. Some suggestions:</p>
      <p>Headlines: SOPHISTO - STALEMATE - LUMINANCE - REMONTOIRE - OXTAIL</p>
      <p>Body copy: DELICATO - ANZIANO - TAROCCO</p>
      <p>See for yourself; <a href="http://www.macrhino.com" title="http://www.macrhino.com">http://www.macrhino.com</a></p>
      <p>Good luck!</p>
