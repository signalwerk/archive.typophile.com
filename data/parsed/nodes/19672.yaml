      <p><em>If a certain typeface is used for a masthead, should it be reused for all other headers and title pages within the magazine, but like in differnet fonts such as bold, condensed etc? Add to that, should the same typeface be used throughout the whole magazine (for headers, title pages, body copy etc) or should they vary depending on the article subject?</em></p>
      <p>Hi, s_c, and welcome to the forums. I don’t think that there are any “right” or “wrong” answers to your first two questions... I’m sure that there are (or have been, or will be!) real-life examples of the different options you are asking about... These are design decisions, and they in turn should be informed by your research and documentation on other magazines, not to mention trying different things out for yourself to see what works for you, etc. For example, take some dummy text and make a spread for your proposed magazine, using the same face for everything, then duplicate it and try varying the weights, or the fonts... Print everything out and compare the results...</p>
