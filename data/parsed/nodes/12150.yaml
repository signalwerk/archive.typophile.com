    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Hermann Zapf</strong></p>
    <p>German, born 1918.</p>
    <p>Calligrapher and type designer, perhaps the most influential designer of types in the post-WWII era. Designer of <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>, <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a>, <a href="/wiki/Aldus" class="freelinking" rel="nofollow">Aldus</a>, <a href="/wiki/Zapf%20Chancery" class="freelinking" rel="nofollow">Zapf Chancery</a>, <a href="/wiki/Zapf%20Dingbats" class="freelinking" rel="nofollow">Zapf Dingbats</a>, <a href="/wiki/Zapfino" class="freelinking" rel="nofollow">Zapfino</a>, and with <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a>, <a href="/wiki/Zapfino%20Extra" class="freelinking" rel="nofollow">Zapfino Extra</a>, <a href="/wiki/Optima%20nova" class="freelinking" rel="nofollow">Optima nova</a>, <a href="/wiki/Palatino%20nova" class="freelinking" rel="nofollow">Palatino nova</a>, <a href="/wiki/Palatino%20Sans" class="freelinking" rel="nofollow">Palatino Sans</a>, and <a href="/wiki/Palatino%20Sans%20Informal" class="freelinking" rel="nofollow">Palatino Sans Informal</a>. Zapf's most notable achievement is his effortless bridging of the Medieval era with the Information Age; his types are all characterized by their strong <a href="/wiki/calligraphic" class="freelinking" rel="nofollow">calligraphic</a> influence, but more than any of the other designers who came to maturity in the metal type era, he has adapted to the digital era. He also has the dubious honor of having been the victim of one of the <a href="/wiki/20th%20Century" class="freelinking" rel="nofollow">20th Century</a>'s more acrimonious disputes over <a href="/wiki/type%20piracy" class="freelinking" rel="nofollow">type piracy</a>; see the entry on <a href="/wiki/Book%20Antiqua" class="freelinking" rel="nofollow">Book Antiqua</a> for details.</p>
    <p>Zapf's efforts are not limited to his type and calligraphic work. He has been involved in many of the most significant technological developments in the era of digital typography. From his groundbreaking work with <a href="/wiki/Donald%20Knuth" class="freelinking" rel="nofollow">Donald Knuth</a> on <a href="/wiki/TeX" class="freelinking" rel="nofollow">TeX</a> to his collaboration with <a href="/wiki/John%20Hudson" class="freelinking" rel="nofollow">John Hudson</a>, <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a> and <a href="/wiki/Adam%20Twardoch" class="freelinking" rel="nofollow">Adam Twardoch</a> on successive refinements of the semi-sentient script typeface <a href="/wiki/Zapfino" class="freelinking" rel="nofollow">Zapfino</a>, he has not shied away from contemporary developments in type technology.</p>
    <p>Perhaps his most significant (and unsung) achievement in this realm was developing the  <a href="/wiki/hz-program" class="freelinking" rel="nofollow">hz-program</a> for <a href="/wiki/URW" class="freelinking" rel="nofollow">URW</a>, a justification engine that used the novel technique of <a href="/wiki/glyph%20scaling" class="freelinking" rel="nofollow">glyph scaling</a> to help achieve even color in extended settings of text. This engine, after several rounds of refinement and licensing, has become the justification engine in <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>'s <a href="/wiki/InDesign" class="freelinking" rel="nofollow">InDesign</a>, and is one of the most distinctive typographical features of that program.</p>
    <p>Now in his late 80s, Zapf continues to work, drafting letters and practicing calligraphy. He is married to calligrapher and type designer <a href="/wiki/Gudrun%20Zapf%20von%20Hesse" class="freelinking" rel="nofollow">Gudrun Zapf von Hesse</a>.</p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://www.creativepro.com/story/feature/23728.html" rel="nofollow">dot-font: Hermann Zapf at 87</a><br>
    <a href="http://www.typogabor.com/manuale-hermann-zapf/index.html#9" rel="nofollow">Typogabor: Manuale Typographicum</a></p>
    <p><strong>Books &amp; Materials about:</strong></p>
    <p>Dreyfus, John &amp; Knut Erichson. <a href="/wiki/Abc-Xyzapf" class="freelinking" rel="nofollow">Abc-Xyzapf</a>: Fifty Years in Alphabet Design, Wynkyn de Worde Society, London, 1989. A festschrift to honor Hermann Zapf.</p>
