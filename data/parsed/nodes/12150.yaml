    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Hermann&nbsp;Zapf</strong></p>
    <p>German, born&nbsp;1918.</p>
    <p>Calligrapher and type designer, perhaps the most influential designer of types in the post-<span class="caps">WWII</span> era. Designer of <a href="/node/15685" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optima</a>, <a href="/node/16864" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino</a>, <a href="/node/16865" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aldus</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Zapf%20Chancery" title="Create node &quot;Zapf Chancery&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Zapf Chancery</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Zapf%20Dingbats" title="Create node &quot;Zapf Dingbats&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Zapf Dingbats</a>, <a href="/node/12422" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Zapfino</a>, and with <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a>, <a href="/node/15613" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Zapfino Extra</a>, <a href="/node/15686" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optima nova</a>, <a href="/node/16863" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino nova</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Palatino%20Sans" title="Create node &quot;Palatino Sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Palatino Sans</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Palatino%20Sans%20Informal" title="Create node &quot;Palatino Sans Informal&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Palatino Sans Informal</a>. Zapf’s most notable achievement is his effortless bridging of the Medieval era with the Information Age; his types are all characterized by their strong <a href="/node/add/wiki?edit%5Btitle%5D=calligraphic" title="Create node &quot;calligraphic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">calligraphic</a> influence, but more than any of the other designers who came to maturity in the metal type era, he has adapted to the digital era. He also has the dubious honor of having been the victim of one of the <a href="/node/add/wiki?edit%5Btitle%5D=20th%20Century" title="Create node &quot;20th Century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">20th Century</a>’s more acrimonious disputes over <a href="/node/add/wiki?edit%5Btitle%5D=type%20piracy" title="Create node &quot;type piracy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">type piracy</a>; see the entry on <a href="/node/add/wiki?edit%5Btitle%5D=Book%20Antiqua" title="Create node &quot;Book Antiqua&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Book Antiqua</a> for&nbsp;details.</p>
    <p>Zapf’s efforts are not limited to his type and calligraphic work. He has been involved in many of the most significant technological developments in the era of digital typography. From his groundbreaking work with <a href="/node/add/wiki?edit%5Btitle%5D=Donald%20Knuth" title="Create node &quot;Donald Knuth&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Donald Knuth</a> on <a href="/node/14034" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TeX</a> to his collaboration with <a href="/node/12151" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Hudson</a>, <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a> and <a href="/node/12241" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adam Twardoch</a> on successive refinements of the semi-sentient script typeface <a href="/node/12422" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Zapfino</a>, he has not shied away from contemporary developments in type&nbsp;technology.</p>
    <p>Perhaps his most significant (and unsung) achievement in this realm was developing the  <a href="/node/add/wiki?edit%5Btitle%5D=hz-program" title="Create node &quot;hz-program&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">hz-program</a> for <a href="/node/14085" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">URW</span></a>, a justification engine that used the novel technique of <a href="/node/add/wiki?edit%5Btitle%5D=glyph%20scaling" title="Create node &quot;glyph scaling&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">glyph scaling</a> to help achieve even color in extended settings of text. This engine, after several rounds of refinement and licensing, has become the justification engine in <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a>’s <a href="/node/add/wiki?edit%5Btitle%5D=InDesign" title="Create node &quot;InDesign&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">InDesign</a>, and is one of the most distinctive typographical features of that&nbsp;program.</p>
    <p>Now in his late 80s, Zapf continues to work, drafting letters and practicing calligraphy. He is married to calligrapher and type designer <a href="/node/12242" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gudrun Zapf von Hesse</a>.</p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.creativepro.com/story/feature/23728.html">dot-font: Hermann Zapf at 87</a><br><a href="http://www.typogabor.com/manuale-hermann-zapf/index.html#9">Typogabor: Manuale&nbsp;Typographicum</a></p>
    <p><strong>Books <span class="amp">&amp;</span> Materials&nbsp;about:</strong></p>
    <p>Dreyfus, John <span class="amp">&amp;</span> Knut Erichson. <a href="/node/add/wiki?edit%5Btitle%5D=Abc-Xyzapf" title="Create node &quot;Abc-Xyzapf&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Abc-Xyzapf</a>: Fifty Years in Alphabet Design, Wynkyn de Worde Society, London, 1989. A festschrift to honor Hermann&nbsp;Zapf.</p>
