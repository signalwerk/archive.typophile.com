    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>&nbsp;: <a href="/node/17745/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Designers</a>&nbsp;: Hermann&nbsp;Zapf</strong></p>
