ns Informal&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Palatino Sans Informal</a>. Zapf’s most notable achievement is his effortless bridging of the Medieval era with the Information Age; his types are all characterized by their strong <a href="/node/add/wiki?edit%5Btitle%5D=calligraphic" title="Create node &quot;calligraphic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">calligraphic</a> influence, but more than any of the other designers who came to maturity in the metal type era, he has adapted to the digital era. He also has the dubious honor of having been the victim of one of the <a href="/node/add/wiki?edit%5Btitle%5D=20th%20Century" title="Create node &quot;20th Century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">20th Century</a>’s more acrimonious disputes over <a href="/node/add/wiki?edit%5Btitle%5D=type%20piracy" title="Create node &quot;type piracy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">type piracy</a>; see the entry on <a href="/node/add/wiki?edit%5Btitle%5D=Book%20Antiqua" title="Create node &quot;Book Antiqua&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Book Antiqua</a> for&nbsp;details.</p>
    <p>Zapf’s efforts are not limited to his type and calligraphic work. He has been involved in many of the most significant technological developments in the era of digital typography. From his groundbreaking work with <a href="/node/add/wiki?edit%5Btitle%5D=Donald%20Knuth" title="Create node &quot;Donald Knuth&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Donald Knuth</a> on <a href="/node/14034/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">TeX</a> to his collaboration with <a href="/node/12151/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">John Hudson</a>, <a href="/node/12234/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Akira Kobayashi</a> and <a href="/node/12241/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Adam Twardoch</a> on successive refinements of the semi-sentient script typeface <a href="/node/12422/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Zapfino</a>, he has not shied away from contemporary developments in type&nbsp;technology.</p>
    <p>Perhaps his most significant (and unsung) achievement in this realm was developing the  <a href="/node/add/wiki?edit%5Btitle%5D=hz-program" title="Create node &quot;hz-program&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">hz-program</a> for <a href="/node/14085/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">URW</span></a>, a justification engine that used the novel technique of <a href="/node/add/wiki?edit%5Btitle%5D=glyph%20scaling" title="Create node &quot;glyph scaling&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">glyph scaling</a> to help achieve even color in extended settings of text. This engine, after several rounds of refinement and licensing, has become the justification engine in <a href="/node/13428/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Adobe</a>’s <a href="/node/add/wiki?edit%5Btitle%5D=InDesign" title="Create node &quot;InDesign&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">InDesign</a>, and is one of the most distinctive typographical features of that&nbsp;program.</p>
    <p>Now in his late 80s, Zapf continues to work, drafting letters and practicing calligraphy. He is married to calligrapher and type designer <a href="/node/12242/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gudrun Zapf von Hesse</a>.</p>
