      <p>This original version of this design was drawn by Will F. Bradley for the cover of 1894 Christmas issue of the Inland Printer. He licensed the design to American Type Founders, where Herman Ihlenburg designed and cut the font. ATF introduced "The Bradley Series" in 1895. Variations and imitations were soon on the market.<br>
      There are seversl digital versions.<br>
      The oldest is in the CD included with the  Dover Dan X. Solo publication<br>
      <a href="//www.amazon.com/exec/obidos/tg/detail/-/0486999602/qid=1076285090//ref=sr_8_xs_ap_i1_xgl14/103-1448097-5990211?v=glance&amp;s=books&amp;n=507846<br />
      " rel="nofollow"> 24 Celtic and Medieval Display Fonts (book and CD-ROM).</a><br>
      <a href="//www.youworkforthem.com/font/T1808/bradley" rel="nofollow">Another Bradley</a>, was published by ProFonts in 2009.<br>
      Other names were also used for Bradley, including <a href="//www.presscom.co.uk/printing/jacimg/jaco_font137x.html" rel="nofollow">Venetian Text</a> as shown in Charles Jacobi's  Some Notes on Books and Printing, 1903, Ihlenberg, and Abbey Text.<br>
      Don</p>
