  html: |-
    <p>Hi Typophiles!</p>
    <p>I’m working on a digitization of the font shown on the “Berner Specimen”.</p>
    <p>Of course I know, that this must be at least the n-th Garamond, but until today there is no such font available under an opensource licence, so I decided to try to fill this gap.</p>
    <p>I want it to be as close to the original as possible but of course I make compromises where necessary to keep it usable. In the end (which might be far from now), I plan to have a family with different optical sizes and so on. For now it’s text size and roman only (and some first tries with the italic). Latin and basic cyrillic are present, greek will follow later.</p>
    <p>I really would like your critique and comments about the font. You can get it from <a href="http://www.georgduffner.at/ebgaramond/EBGaramond.otf" title="www.georgduffner.at/ebgaramond/EBGaramond.otf">www.georgduffner.at/ebgaramond/EBGaramond.otf</a></p>
    <p>Thanks, Georg</p>
    <p>Edit:</p>
    <p>Since end of march, EB Garamond is available from Google webfonts for embedding.</p>
