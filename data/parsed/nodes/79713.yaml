    html: |-
      <p>I've checked your PDF. One think that I've seen is the different placing of caron on /ě/ and /ž/. On the latter it's positioned higher. Make sure it's the same on all letters otherwise it becomes very distracting for readers. But otherwise I still think they're quite tall on lower case letters. I don't know if you've made then thinner later, but in the PDF they also seem to be quite heavy.</p>
      <p>Regarding the shape of /s/ it's still a bit to the right. Draw a line vertical line over it and you'll maybe see it better. Or have two of them side by side: one in original form and the other horizontally flipped. If the flipped one looks leaning to the left, it means the original is leaning to the right.</p>
      <p>But if you don't change it it'll probably be just fine because in text it looks quite fine. I can see it others may not. So it's not that off any more. It's in acceptable range. The last change makes it even more appropriate.</p>
      <p>P.S. I really like what you've done to the small caps Eszett/Scharfes S. Very slick with the top corner.</p>
