  - id: 458659
    user: 85840
    date: 2011-04-04T12:26:00
    date_raw: 4 Apr 2011 — 12:26pm
    votes: null
    html: |-
      <p>Now, the /s/ won’t fall over any more.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/s2_5298.png"></div><br>
      Also, I have reduced weight and hight of the háček, as you can see (I’ll do the same for circumflex later).<p></p>
      <p>The háčeks over e and z do have the same height. I do diacritic positioning by anchors so the vertical position is transparently controllable with feature files. If you see a difference it’s either a presentation problem (screen, hinting or the like) or an optical illusion. If the latter is the case and is reproduceable for others too, I should think about changing anchor positions for some letters.</p>
      <p>As for the smcp Eszett, this glyph was the beginning of my learning to draw letters. As it is missing in most of the typefaces I started to draw it for different ones. It’s not a very useful one (seldomly used, and if you use it, people will stumble over it), but I really love it :) The one for EB Garamond was drawn very early in the whole proces and barely touched since then (about 9 months ago) so one might deduce from it some learning proces :)</p>
      <p>BTW, the specimen has slovenian text now as well ;)</p>
