  - id: 454851
    user: 14556
    date: 2011-03-07T23:25:00
    date_raw: 7 Mar 2011 — 11:25pm
    votes: null
    html: <p>With fractional point coordinates, a cumulative decimal place rounding error can displace the endpoint from the position of the beginning point, thus causing this jog. in FontForge, Element&gt;Round&gt;To Int snaps the point to grid for a selected point or all points in the glyph if none are selected, and solves this displacement on the endpoint.</p>
    html_clean: <p>With fractional point coordinates, a cumulative decimal place rounding error can displace the endpoint from the position of the beginning point, thus causing this jog. in FontForge, Element&gt;Round&gt;To Int snaps the point to grid for a selected point or all points in the glyph if none are selected, and solves this displacement on the endpoint.</p>
