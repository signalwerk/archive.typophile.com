      <p>At the second-hand bookshops ask for the books designed by <a href="http://www.bestwebbuys.com/Tibor_Szanto-author.html?isrc=b-compare-author" rel="nofollow">Tibor Szántó</a>, the great Hungarian typographer--printed in the 1960s and 1970s; the better ones were published by Helikon Kiadó and Európa Könyvkiadó. Some of them are truly superb.</p>
      <p>Take a trip to Gyoma, the home of the <a href="http://www.gyomaikner.hu/eng/muzeum_2.html" rel="nofollow">Kner family</a>. The Kners owned a printshop there, and made themselves a name in the world of private press printing with their exquisite little books, very tastefully typeset, illustrated and decorated. The shop was still active in the 1970s; I remember how impressed I was by the quality of its presswork, binding, and the fact that some books manufactured at Kner Nyomda were printed on a special, watermarked stock, which used to be produced in small quantities for those limited editions.</p>
      <p><a href="http://w2.mome.hu" rel="nofollow">Moholy-Nagy Művészeti Egyetem</a> (Moholy-Nagy University of Art and Design, formerly known as Magyar Iparművészeti Főiskola) could be worth a trip. It used to be a pretty good school for graphic and typographic design. Many excellent Hungarian design professionals are MIF graduates, and some teach there. </p>
      <p>For additional information on Hungarian typography see a very good listing offered by <a href="http://cg.scs.carleton.ca/~luc/hungary.html" rel="nofollow">Luc Devroye</a>.</p>
