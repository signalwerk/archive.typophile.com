  html: <p>You could achieve a look quite a bit like this with our own Mark Simonson's <a href="http://www.myfonts.com/fonts/marksimonson/mostra/" target="_blank">'Mostra'</a>. It comes in 5 weights (the heavy is most like this) and many characters have 2 or 3 variations. It is all uppercase, but creating a lower case 'i' and a few smaller-size latters would be easy enough using a heavier weight (Mostra Black) at a smaller size. It is also based on type styles of the 20's and 30's.</p>
  html_clean: <p>You could achieve a look quite a bit like this with our own Mark Simonson's <a href="http://www.myfonts.com/fonts/marksimonson/mostra/" target="_blank" class="link-external">'Mostra'</a>. It comes in 5 weights (the heavy is most like this) and many characters have 2 or 3 variations. It is all uppercase, but creating a lower case 'i' and a few smaller-size latters would be easy enough using a heavier weight (Mostra Black) at a smaller size. It is also based on type styles of the 20's and 30's.</p>
