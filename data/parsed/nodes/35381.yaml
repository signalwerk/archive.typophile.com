      <p>About the <strong>s/S</strong>, I think an even longer bottom end stroke don't works well and the top half to the left makes it an almost falling <strong>s</strong>, but I did the top end stroke longer, and it looks good... :-)</p>
      <p>About the <strong>r</strong>, you are right <strong>ytknows</strong>. I use the same space of the <strong>l</strong> but it don't work well. Specially with <strong>rn</strong>... It looks dangerously like a <strong>m</strong>... :-/ I'll fix it.</p>
      <p>Hum... Curves... I don't know... This squared look is directly connected with the idea of austerity that I'm trying to explore here... It looks curvy at small sizes. Only at display sizes that it reveals its austerity... ;-)</p>
      <p>The <em>general feeling</em> about it: Yes, it can looks very technical, but I like to think it has some electricity in its veins and I don't know why, but I think it has something oriental... But maybe I'm just crazy about it... ;-p</p>
      <p>I'm not thinking about curves right now, but I'm thinking about italic and serif versions can be very interesting... Nothing to show yet, but some sketches are floating in my mind... :-)</p>
      <p>Thank you both for the comments and sorry for don't post images now... I'm in another project right now, but soon I'll back to Austera... :-)</p>
