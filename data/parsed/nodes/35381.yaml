      <p>Nice, I like it!</p>
      <p>Couple of small things:<br>
      The appearance of the 'w' seems a bit straight when it sits between the characters with all the corners in them. The 'v' doesn't have that problem so much, neither do the straight-sided upper case chars. Maybe play with it a bit more. :)</p>
      <p>The 's'/'S' still roll over a bit, to the left this time. Maybe the bottom endstroke could be even longer, maybe even lining with the upper-left shoulder. But I can't judge if that will work based only on my mental-picture. ;)</p>
      <p>Overall it's starting to look very nice. You could also consider a less square version maybe... (you know, getting that Klavika-look). Because I think most of the character shapes are nice. But I guess you should first perfect this one.</p>
