    <p>Hi!</p>
    <p>Well, my english is not so good, but here we go.</p>
    <p>This is my first serious journey trough the amazing world of typography and its name is <strong><em>Austera</em></strong> -- translating: austere.</p>
    <p>I pretend to use it on a new magazine that will born soon -- I hope, so I'm trying to make it looks good at small sizes but also interesting bigger, for titles. Very <em>innovative</em> huh?! :-p It's a kind of Frankenstein done with Klavika, Citizen and some <em>ISO standards</em> in mind... I think it's not alive yet, but I'm in love with it! Generally it's a very good thing -- this passion for what you are working on, but I know it could be veeery dangerous and <em>blindness</em> too...</p>
    <p>Right now I'm working on Illustrator, so it don't has spacing, optical corrections and all this kind of stuff yet, only rough caps, small-caps, lower-case and numbers... Yes I'm just get it started, but I would be happier if I could hear from you what do you think about it... ;-)</p>
    <p><a href="http://fictilia.org/stuff/Austera.pdf" rel="nofollow">Here</a> is a pdf introducing my dear <em>Austera</em>.</p>
    <p>undr</p>
