  html: |-
    <p>Pétala Pro gave his first steps almost ten years ago. During this time, the quest for perfection had forced several interruptions. It was necessary recalculate the route, tread other ways, discover new maps, and make easy curves. After all, a new milestone on typeface design was reached.</p>
    <p>Pétala Pro combines readability with a gentle but strong personality. The smooth and balanced forms shares space with expressive ink traps. The 18 styles of the family – from Thin to Black – allow the flexibility needed to complex design briefs. When designing the different weights, rather than automated solutions, ​​subtle adjustments were made to value the optical qualities of each style. Such care, makes all the difference under extreme conditions.<br>
    The wide variety of alternates, makes Pétala Pro even more versatile. All the styles comes with a lot of advanced OpenType features such as stylistics sets, localized forms, contextual alternates, ligatures, small caps, numbers, fractions and more.</p>
    <p>Pétala Pro brings your message with efficiency and personality for a multi-language environment and in any medium or support, such as video, mobile and computers screens. Pétala Pro is the ideal choice for editorial, advertising, branding and corporate identity.</p>
    <p>Available at our distributors:</p>
    <p>- <a class="freelinking external" href="http://www.myfonts.com/fonts/typefolio/petala-pro/" rel="nofollow">MyFonts</a><br>
    - <a class="freelinking external" href="http://www.fontspring.com/fonts/typefolio/petala-pro/" rel="nofollow">Fontspring</a><br>
    - <a class="freelinking external" href="http://www.fonthaus.com/fonts/typefolio/petala-pro/" rel="nofollow">FontHaus</a></p>
