    html: |-
      <p>1.<br>
      |UNION MADE| is Archive Tilt:<br>
      <a href="http://www.myfonts.com/fonts/archivetype/archive-tilt/" title="http://www.myfonts.com/fonts/archivetype/archive-tilt/">http://www.myfonts.com/fonts/archivetype/archive-tilt/</a></p>
      <p>The other type is too small to positively ID, by may be Wearetrippin Display:<br>
      <a href="http://www.myfonts.com/fonts/t26/wearetrippin/display/" title="http://www.myfonts.com/fonts/t26/wearetrippin/display/">http://www.myfonts.com/fonts/t26/wearetrippin/display/</a></p>
      <p>2.<br>
      Again, awfully small and low-res sample. |SOLID| resembles Haymaker, though not an exact match to the |S|:<br>
      <a href="http://www.losttype.com/font/?name=haymaker" title="http://www.losttype.com/font/?name=haymaker">http://www.losttype.com/font/?name=haymaker</a></p>
      <p>|HANDMADE| etc. could be one of these:<br>
      <a href="http://www.myfonts.com/fonts/adobe/penumbra/" title="http://www.myfonts.com/fonts/adobe/penumbra/">http://www.myfonts.com/fonts/adobe/penumbra/</a><br>
      <a href="http://www.myfonts.com/fonts/adobe/hypatia-sans-pro/" title="http://www.myfonts.com/fonts/adobe/hypatia-sans-pro/">http://www.myfonts.com/fonts/adobe/hypatia-sans-pro/</a></p>
      <p>Something from Harold's Monograms may help you recreate|BAT| and |MFG|:<br>
      <a href="http://haroldsfonts.com/portfolio/harolds-monograms/" title="http://haroldsfonts.com/portfolio/harolds-monograms/">http://haroldsfonts.com/portfolio/harolds-monograms/</a></p>
      <p>3.<br>
      |CARUSO| appears to be Corki Tuscan:<br>
      <a href="http://www.typedepot.com/corki" title="http://www.typedepot.com/corki">http://www.typedepot.com/corki</a></p>
      <p>|Since 1978| appears to be the free Google web font Damion:<br>
      <a href="http://www.google.com/fonts/specimen/Damion" title="http://www.google.com/fonts/specimen/Damion">http://www.google.com/fonts/specimen/Damion</a></p>
      <p>Rest of the type may be another Google font, PT Sans:<br>
      <a href="http://www.google.com/fonts/specimen/PT+Sans" title="http://www.google.com/fonts/specimen/PT+Sans">http://www.google.com/fonts/specimen/PT+Sans</a></p>
      <p>4.<br>
      Too low res.</p>
      <p>5.<br>
      The sans serif small type appears to be Neutraface 2 Condensed Bold:<br>
      <a href="http://www.houseind.com/fonts/neutraface2" title="http://www.houseind.com/fonts/neutraface2">http://www.houseind.com/fonts/neutraface2</a></p>
      <p>|SACKWEAR| shares its inspiration with Corki Tuscan above, and is likely custom. Found only one vaguely similar:<br>
      <a href="http://www.dafont.com/combustion-brk.font?text=SACKWEAR" title="http://www.dafont.com/combustion-brk.font?text=SACKWEAR">http://www.dafont.com/combustion-brk.font?text=SACKWEAR</a></p>
