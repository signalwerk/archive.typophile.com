    <p>Hi,</p>
    <p>Any assistance helping to ID any of the following would be greatly appreciated.</p>
    <p>Also, I'm looking for resources for any vintage fonts similar to what is shown below (workwear, trades, construction, union made, craftsmanship, tools, etc).</p>
    <p>There are several here so assistance with any would be great!</p>
    <p>UNIONMADE, headline and all copy<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/957ffd337b67038ee290165932746b8e_6708.jpg"></div><p></p>
    <p>BAT MFG, Handmade &amp; Approved<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ac621691dc9b70c6f105585635903fb3_3871.jpg"></div><p></p>
    <p>CARUSO, headline and all copy<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/b4ff0ccc3ec0b4157ad237001e83c66c_3428.jpg"></div><p></p>
    <p>SACKWEAR, headline<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2015-03-13 at 7_6551.21.35 AM.png"></div><p></p>
    <p>SACKWEAR, headline and all copy<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Sack2_6471.jpg"></div><p></p>
    <p>Thanks!</p>
    <p>Josh</p>
