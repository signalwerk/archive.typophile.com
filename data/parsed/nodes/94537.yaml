    <p>Don't get why there's so much editing of old posts / threads lately. Sometimes (seemingly) good content gets erased. Often parts of threads don't make sense any more. </p>
    <p>Only being able to edit your posts for, say, 30 minutes after hitting the publish button would allow for the quick formatting changes we sometimes need but preclude the above-mentioned annoyances, no? </p>
    <p>Agree? Disagree?</p>
