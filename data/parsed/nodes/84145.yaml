    html: |-
      <p>However, Microsoft does seem to be a serial offender in not providing full families for its typefaces.<br>
      The hoary "four styles is a family" mantra, don't cha know.</p>
      <p>For sans faces, type foundries generally provide their clients with a range of weights, from Hairline to Black.<br>
      For serif faces, type foundries often provide both text and display fonts: media-specific alternates.</p>
      <p>But there is still no Georgia Display, no Verdana Light.</p>
      <p>Would it not be possible, when a Light weight is rendered at small size on screen, to change the font?<br>
      After all, "ForceBold" has addressed this kind of issue, via creative engineering, from the early days of PostScript.</p>
