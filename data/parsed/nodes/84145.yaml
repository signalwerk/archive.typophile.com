    html: |-
      <p>Not suitable.</p>
      <p>I was asked to use it for a book, and although I recommended against it based on prior experience (*) the client "really really liked it on screen". In print, the letter is just way too fat to comfortably read.</p>
      <p>(*) This prior experience includes using Verdana for print, using Arial for print, using Tahoma for print, and using Times New Roman for print. The common denominator here is <em>not</em>, let me repeat <em>not</em>, that they are Microsoft fonts "and thus bad", but they were all designed, hinted, and optimized for the screen.</p>
