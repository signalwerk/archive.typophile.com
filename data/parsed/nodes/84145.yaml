    html: |-
      <p>I think that, if you take care about point size, Georgia works perfectly in print.<br>
      I have seen it used, in many sizes, even in small magazines.</p>
      <p>@Nick: If you use Miller, it’s perfectly compatible with Georgia. Before purchasing Miller Text, I tried by purchasing Miller Text Small Caps only, to compensate for Georgia’s lack of Small Caps, and – with a slight point size adjustment – it worked very good both in trials I was doing for eBooks and in laser printed copies.</p>
      <p>Hey, we’re talking of Matthew Carter. It’s practically impossible to have a "not stellar" typeface from him… :)</p>
