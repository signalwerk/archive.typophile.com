    <p>Due to Calibri replacing Arial as MS Word's default, it is no doubt soon to be as omnipresent as the aforementioned.</p>
    <p>However as it, along with the other ClearType typefaces, do seem to be optimised for screen, what are your thoughts on the suitability of the typeface in a printed environment?</p>
