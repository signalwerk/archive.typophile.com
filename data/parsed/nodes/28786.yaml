      <p><strong>Many thanks for all your good suggestions!</strong><br>
      I've printed samples of most of them and then stuck heads together with another guy. Here is what we came up with, and<strong> maybe you can give more opionion and advice on this. Would be great!</strong><br>
      It seems we are not quite there yet.</p>
      <p>**************</p>
      <p>1. We did not think much of faces that appeared to be chosen especially thinking of 'church' - e.g. stuff with traditional connotations.</p>
      <p>2. We wanted some face that has something rasonably special about it, e.g. noting like Depot or Albert, so that we can justify spending some money, rather than just using Arial/Times NR or such.</p>
      <p>**************</p>
      <p><strong>Therefore:</strong></p>
      <p>In the end, after having also looked at what you can get for what price we thought that we'd like to use<br>
      <strong><a href="http://www.processtypefoundry.com/typefaces/locator/index.html" rel="nofollow">Locator </a>and <a href="http://www.processtypefoundry.com/typefaces/locatordisplay/index.html" rel="nofollow">Locator Display</a> possibly in conjunction with a serif face</strong>.<br>
      However, I've just now discovered that <a href="http://www.processtypefoundry.com/typefaces/locator/purchase.html" rel="nofollow">the low price on the site </a> is for a 1-computer license only, and it seems to get too expensive for more.</p>
      <p>What can we do? Locator seems just nice with this extra Display version. Also it would work well on Projector display during church services - nice and clear.<br>
      The only worry I had with Locator is whether the low cap height would make it actually more difficult to read, esp on a projection screen, and it seems fairly wide, forcing smaller point sizes to fit content.</p>
      <p><strong>So, are there any other suggestions as an alternative to Locator?</strong></p>
      <p>**************</p>
      <p>Another typeface I liked is <strong><a href="http://www.adobe.com/type/browser/P/P_1381.html" rel="nofollow">PMN Caecilia</a></strong>. (I think,I like it better than Absara Serif, poms).<br>
      What are you views?<br>
      I'm a bit worried to display anything serif on a projector where people have to head and speak/sing out words on the spot (good readability is essential).<br>
      But maybe this coud serve as a headline typeface?</p>
      <p>Or would I choose <strong><a href="http://www.adobe.com/type/browser/P/P_1381.html" rel="nofollow">Chaparral</a></strong> instead?</p>
      <p>**************</p>
      <p>Thanks for your replies.</p>
    html_clean: |-
