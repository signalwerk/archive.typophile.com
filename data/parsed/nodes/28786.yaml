      <p>Locator, Caecelia and Chaparral all fit the bill with regard to looking modern. I just don't think any of them convey a whole lot of warmth.</p>
      <p>I've used Chaparral extensively for instruction manuals and can tell you that it's never disappointed me, but I'm not so sure I would use it for wedding announcements or other church stuff. But then, I don't go to church.</p>
      <p>Like someone else said, Cronos is an excellent, legible, warm sans with most of the OpenType luxuries you could want. Shouldn't be too be expensive.</p>
