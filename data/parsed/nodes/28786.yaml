      <p>I struggle a bit with the idea of only using a sans throughout too - bit old fashioned I suppose.</p>
      <p>Having said that I haven't seen Jos Buivenga's fonts before and I am rather impressed. I've just had a quick play and they seem work well together too. They are quite tonally compatible. They lend themselves to quite open spacing, so I don't see why they shouldn't be able to comply with the situations you mentioned and get a modern and approachable look. It may take a bit of extra effort to get the spacing/feed/layout combinations working just so, but that's where the time goes. Serif heading, sans text, vice versa, nice coolour palette - could look the business.</p>
      <p>Just a thought, but if you wanted a character or two modified for this client, he looks like the kind of chap who might oblige.</p>
      <p>Save the dosh for the organ fund, or something nice for the christmas party.</p>
      <p>And remember everybody - e for envelopes (stationery).</p>
