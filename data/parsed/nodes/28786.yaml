      <p>What can we do? Locator seems just nice with this extra Display version. Also it would work well on Projector display during church services - nice and clear.<br>
      The only worry I had with Locator is whether the low cap height would make it actually more difficult to read, esp on a projection screen, and it seems fairly wide, forcing smaller point sizes to fit content.</p>
      <p><strong>So, are there any other suggestions as an alternative to Locator?</strong></p>
      <p>**************</p>
      <p>Another typeface I liked is <strong><a href="http://www.adobe.com/type/browser/P/P_1381.html" rel="nofollow" class="link-external">PMN Caecilia</a></strong>. (I think,I like it better than Absara Serif, poms).<br>
      What are you views?<br>
      I'm a bit worried to display anything serif on a projector where people have to head and speak/sing out words on the spot (good readability is essential).<br>
      But maybe this coud serve as a headline typeface?</p>
      <p>Or would I choose <strong><a href="http://www.adobe.com/type/browser/P/P_1381.html" rel="nofollow" class="link-external">Chaparral</a></strong> instead?</p>
      <p>**************</p>
      <p>Thanks for your replies.</p>
