      <p>I understand that you want a fresh look, but I'd say if you want it sans serif, don't go for anything too cool.</p>
      <p>To add another candidate to the list: <strong>Emigre</strong>'s <strong>Vista</strong> (by Xavier Dupré), a warm contemporary sans serif with a stylized handwritten touch expecially in its set of alternates (which may or may not be impractical in daily use, depending on how you want Vista to look most of the time). Like most sans serifs, Vista won't win a price for optimal legibility, but as you intend to use a sans exclusively, I assume you won't have to set long text.</p>
      <p>What it looks like:<br>
      <a href="http://www.hostarea.de/server-10/Oktober-665cf28481.pdf" title="www.hostarea.de/server-10/Oktober-665cf28481.pdf">www.hostarea.de/server-10/Oktober-665cf28481.pdf</a></p>
      <p>Home:<br>
      <a href="http://www.emigre.com/EF.php?fid=200" title="www.emigre.com/EF.php?fid=200">www.emigre.com/EF.php?fid=200</a></p>
      <p>Quick subjective thoughts on your candidates (that are to be understood in context of what I think you want to do with them):</p>
      <p><strong>Delicious</strong><br>
      Hm. Pretty special.</p>
      <p><strong>Alber</strong><br>
      Not bad. Friendly curves.</p>
      <p><strong>Depot</strong><br>
      Alber's wider, less friendly twin.</p>
      <p><strong>Priva</strong><br>
      Quite a bold stance. Rather not. (Plus I just don't like open G's like these.)</p>
      <p><strong>Credo</strong><br>
      Maybe not the right guy for the job with that fancy comma, i-dot and k. Lacks some elegance.</p>
      <p><strong>Aaux</strong><br>
      Uh. Heavily DIN-inspired with what I'd call an irritating g.</p>
      <p><strong>ApexNew</strong><br>
      Could use some more warmth with those squary glyphs. I'm not exactly in love with the figures, either.</p>
      <p><strong>Myriad</strong><br>
      No eye-striking individuality, but that's why you can hardly ever go totally wrong with Myriad (or Scala, by the way, which also comes in a handsome serifed version).</p>
      <p><em>/Edit: Too slow, once again. I didn't realize that there were other replies after your second post. I see that Stephen Coles has already mentioned Vista.</em></p>
    html_clean: |-
