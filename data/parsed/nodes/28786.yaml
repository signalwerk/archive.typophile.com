    <p>Although I'm a designer, I figure that you guys here may have more experience with type and I'd like to ask for your opinion and advice for choosing a font for a project.</p>
    <p>So, here I go: I need a nice typeface for a <strong>identity</strong> for a Church of England parish in London, which also includes separate community projects etc. </p>
    <p>.</p>
    <p>My thoughts so far:</p>
    <p>* type should have a modern feel<br>
    * needs to work in all sorts of contexts: from births, over parties, to funerals</p>
    <p>.</p>
    <p>The typeface should lend itself to work well in all sorts of applications, for example:</p>
    <p>* stationary, brochures and leaflets<br>
    * signage<br>
    * type-based posters that make an impact<br>
    * projector display, e.g song lyric displays and presentations</p>
    <p>.</p>
    <p>Other requirements/restrictions:</p>
    <p>* We're on a budget! So low price is a key. The font would be used on about 4 machines.<br>
    * Should possibly be OpenType (use on Mac and PC)<br>
    * The name of the organisation is<br>
    <strong>Parish of St Mary Magdalene and St David's Churches</strong>.<br>
    I am concerned of the two 'M's and a lower case 'g' to look pleasant. I wonder whether it might be nice to have the 'g' as 2 storey.</p>
    <p>I think that a <strong>sans serif</strong> typeface would be the way to go, as I definitely want to get away from the traditional feel of church. At the same time there should be a certain feeling of respect -- so nothing weird.</p>
    <p>.<br>
    I have done some searching and have come up with a list that I feel is possible in terms of budget and style. </p>
    <p>Could you please advice and <strong>put some reason with your recommendation</strong>? That would be really nice. Suggestions for anything amazingly fitting that I've overlooked are welcome -- otherwise please work from the list.</p>
    <p>As a general question: How strongly do you feel about using a serif typeface alongside the main type, e.g. for headings...?</p>
    <p>.</p>
    <p>******************<br>
    <a href="http://www.josbuivenga.demon.nl/delicious.html" rel="nofollow">Delicious</a><br>
    ******************<br>
    <em>Family (7) FREE</em><br>
    Would anything really make me choose this apart from the price?</p>
    <p>.</p>
    <p>******************<br>
    <a href="http://www.typetrust.com/fonts/font.php?id=MjI1&amp;fontview=specimen" rel="nofollow">Alber</a><br>
    ******************<br>
    <em>Family (8) for $210</em><br>
    I'm wondering whether these would be a bit too condensed for general use. Hmm.... Looks quite nice though.</p>
    <p>.</p>
    <p>******************<br>
    <a href="http://www.typetrust.com/fonts/font.php?id=MjM0" rel="nofollow">Depot</a><br>
    ******************<br>
    <em>Family (8) for $210</em><br>
    The more I look at it the more I like it. Only that it doesn't have a nice double storey lower case 'g'.</p>
    <p>.</p>
    <p>******************<br>
    <a href="http://www.typetrust.com/fonts/font.php?id=MTk0&amp;fontview=specimen" rel="nofollow">Priva Pro</a><br>
    ******************<br>
    <em>Family (8) $160</em><br>
    Cheaper than the previous two, I guess because it does not include old style figures -- but still nice. Somehow I feel that this has a more churchy character than the previous two, but then again somehow it feels like a commercial company having recently done a re-branding, or am I wrong?</p>
    <p>.</p>
    <p>******************<br>
    <a href="http://www.p22.com/rtf/Products/Credo.html" rel="nofollow">Credo</a><br>
    ******************<br>
    <em>Family (6) for $170</em></p>
    <p>.</p>
    <p>******************<br>
    <a href="http://www.t26.com/fonts/fontsearch.php?q=aaux" rel="nofollow">Aaux</a><br>
    ******************<br>
    <em>Aaux Pro A (12) + Black $98</em><br>
    I guess the price is good. It's also nice that there are a lot of options to get more of the family, or even the  Aaux Office family if there a bit more sophisticated job came up. But somehow I feel maybe there is a bit too much character in the font.</p>
    <p>.</p>
    <p>******************<br>
    <a href="http://www.vllg.com/Thirstype/ApexNew/mudTyper+Weights/" rel="nofollow">ApexNew</a><br>
    ******************<br>
    <em>Familly (14) for $249.00</em><br>
    Quite nice, just a bit higher cost. Nice to have the extreme wheights, but not essential, I guess.</p>
    <p>.</p>
    <p>******************<br>
    <a href="http://www.adobe.com/type/browser/P/P_1706.html" rel="nofollow">Myriad</a><br>
    ******************<br>
    <em>Family (10) for $229</em><br>
    A good and save option maybe. But quite pricy in comparison, right?</p>
    <p>.</p>
    <p>---<br>
    <strong>MANY THANKS FOR YOUR INPUT</strong><br>
    ---</p>
