      <p>Interestingly enough, the title-page of the first French edition of the book (1869-1870) features a typeface which resembles more the Garamond/Humanistic tradition (1600) than the Classical/Didones (1700) or Scotch Roman fonts (1800).</p>
      <p><a href="http://upload.wikimedia.org/wikipedia/commons/4/4e/20000_title_0a.jpg" title="http://upload.wikimedia.org/wikipedia/commons/4/4e/20000_title_0a.jpg">http://upload.wikimedia.org/wikipedia/commons/4/4e/20000_title_0a.jpg</a></p>
