    <p>Hello Typophiles,</p>
    <p>I'm currently working on a book design project for Verne's 20,000 leagues under the sea. This project spans over two quarters and an entire summer. So far I am a quarter into the project, our first class was book illustration. So as I'm knee deep in getting those illustrations finished before the summer is over I have starting thinking about the next step... Our next class is typography III which is where we will be typesetting our books, not to mention printing and case binding them by hand. (with a screen printed cover!) As I'm sure many of you know the book takes place all around the world in the 1860's. I've been thinking about the type for awhile but I thought that typophile would be a good place to ask for any suggestions. I'm looking for a very traditional and beautiful full serif typeface with nice ligatures. Maybe something that has a little bit of a modern flair to it. I might also be looking for a San serif that would work nicely with it. Even though im a starving student Ill find a way to get some money together to buy just the right typeface! So with all that out of the way any suggestions?</p>
    <p>Thanks in advance,<br>
    Aaron</p>
