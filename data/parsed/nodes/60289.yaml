      <p><em>not to mention printing and case binding them by hand.</em></p>
      <p>Does <em>by hand</em> refer to the printing as well as the binding? If you're going to print letterpress, will you print from metal type, or make photopolymer plates from type you set digitally? </p>
      <p>If you're going to print from metal type, your choice will be limited to what they have in your college's print shop. If you're setting it digitally for photopolymer plates, allow for the fact that letterpress "bites" into the surface of the paper, so thin strokes will get a little heavier when you print them. </p>
      <p>This effect is more pronounced on papers with a soft finish (sometimes called "vellum" or "felt"), and less pronounced on smooth-finish papers, so be sure to get your professor's advice on the best combination of typeface and paper stock.</p>
      <p>I'd love to see a preview of your illustrations if you're inclined to post some of them here. When you're choosing your type, <a class="freelinking external" href="http://typophile.com/node/58978" rel="nofollow">consider how it's going to work with your illustrations</a> in terms of weight, contrast, and complexity (presence/absence of fussy details). </p>
      <p><em>the book takes place all around the world in the 1860’s. . . . Maybe something that has a little bit of a modern flair to it.</em></p>
      <p>Go with your instinct re: <em>modern flair</em>. Verne wrote his stories in the 1800s,  but they remain popular because he set them in a kind of parallel universe. He wasn't constrained by the cultural context of his own century, and neither should you be.</p>
