      <p>Oddly enough, a few years back, we did an illustrated edition of this book for one of the presses affiliated under the University Press of New England. It was designed by Rich Hendel.</p>
      <p>I don't remember what fonts Rich used; you could probably find a copy &amp; get some ideas. That aside, my first thought is a good Scotch Roman. With Postscript fonts, I think that pretty much means Matthew Carter's Miller. Metal offers more choices, as, oddly enough, do older photocomp systems.</p>
      <p>FWIW</p>
