      <p>"I’m looking for a very traditional and beautiful full serif typeface with nice ligatures. Maybe something that has a little bit of a modern flair to it. I might also be looking for a San serif that would work nicely with it."</p>
      <p>My first choice for a Nineteenth century serif would be Miller by Matthew Carter, a great contemporary interpretation of the Scotch types which works very nicely as a text face. And Font Boureau offers some sans to go with it.</p>
      <p>An alternative to Miller could be Nick Shinn's ModernSuite Family (a Scotch Serif plus a Sans).</p>
      <p>I'd also have a look to Adrian Frutiger's Iridium.</p>
