      <p>Hi Michel,</p>
      <p>Now I figured out how to change a glyph's width too: the glyph's "mtx" attribute in the "hmtx" table has to be changed accordingly.</p>
      <p>The project in question is "Phonetically Intuitive English" (<a href="https://sites.google.com/site/phoneticallyintuitiveenglish/" title="https://sites.google.com/site/phoneticallyintuitiveenglish/">https://sites.google.com/site/phoneticallyintuitiveenglish/</a>). I will mention you in its Acknowledgments :-)</p>
      <p>Regards,<br>
      Ziyuan Yao</p>
