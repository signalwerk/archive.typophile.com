    votes: null
    html: |-
      <p>Great! Here is something faster (and that worked for me). Instead of text editing (or xml parsing) the file CharisSIL-R.ttx generated from CharisSIL-R.ttf, you can merge full tables of the new font generated by FontForge into CharisSIL-R.ttf ; choose "Reencode &gt; Glyph Order" in FontForge before generating the new font and then execute <code>ttx -m CharisSIL-R.ttf newfont.ttx</code> with <code>newfont.ttx</code> containing just the replacement tables from the new font (the ttf that is generated is named newfont... ).</p>
      <p>Michel Boyer</p>
