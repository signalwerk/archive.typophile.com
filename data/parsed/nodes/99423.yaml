    html: |-
      <p>Here is a suggestion that may work, if you want to keep all tables intact:  try <code>ttx</code>. It comes with <a href="http://www.adobe.com/devnet/opentype/afdko.html" rel="nofollow">AFDKO</a>, the Adobe Font Development Kit for OpenType (which provides other tools to manipulate font tables).</p>
      <p>Once <code>ttx</code> is installed, I suggest you decompile only the glyf and the name table with the line command:</p>
      <pre>   ttx -t name -t glyf CharisSIL-R.ttf
      </pre><p>This creates the file <code>CharisSIL-R.ttx</code> (if you repeat, a version number is added to the name).</p>
      <p>If you already designed your modified glyph, you apply <code>ttx -t glyf</code> on that font; for example, if the glyph you modified is ccedilla, then replace the text in <code>CharisSIL-R.ttx</code> between</p>
      <pre>&lt;TTGlyph name="ccedilla" xMin="66" yMin="-457" xMax="825" yMax="1012"&gt;
      </pre><p>and the closing</p>
      <pre>&lt;/TTGlyph&gt;
      </pre><p>with the new description of ccedilla figuring in the ttx file of your new set of glyphs. You also change the font names according to your needs (and the EULA) in the name table.</p>
      <p>You finally apply</p>
      <pre>   ttx -m CharisSIL-R.ttf CharisSIL-R.ttx
      </pre><p>to obtain your new font file <code>CharisSIL-R#1.ttf</code> which is likely to work better than the font you generated with fontforge.</p>
      <p>I used a variation of that method with AAT fonts and it saved me many calls to the standard tool to generate AAT fonts. If it works fine for you with Graphite tables, please keep us informed.</p>
      <p>Here, I presume you keep the character width intact as well as its position in the bounding box (else you will need to work harder).</p>
