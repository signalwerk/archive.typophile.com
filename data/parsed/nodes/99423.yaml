    <p>Hi All,</p>
    <p>I'm new to FontForge and font editing in general. I simply want to modify the outlines of certain glyphs in Charis SIL. FontForge is the font editor I'm currently trying because it's free.</p>
    <p>My problem is, after modifying the font in FontForge and saving, the resulting font no longer has Graphite features such as stacking combining diacritics. Apparently the Graphite tables in the font are lost in the new font.</p>
    <p>Can anyone tell me the proper way to modify and save Charis SIL with FontForge (or any other free font editor)?</p>
    <p>Regards,<br>
    Ziyuan Yao</p>
