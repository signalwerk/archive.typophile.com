      <p>&gt; 75em usits seems to map to a pixel so well ( on a PC not a mac )</p>
      <p>Yes, it comes out to 10 points in native Windows. But why choose something that causes problems on a Mac, when you don’t have to? And why deviate from the pseudo-standard of 8?</p>
      <p>&gt; if you are looking for identical *screen* behavior you would need two fonts</p>
      <p>It’s better just to make users aware of the difference. That’s a lot less hassle for everybody.</p>
      <p>&gt;  if you are making a tall/skinny font you would run out of vertical space</p>
      <p>My experience is that you’re OK upto a span* of 16 pixels. Anything more and you really should use a larger nominal point size, probably 16. The thing is, above around 22 PPEM it’s hard to justify pixelfonts anyway (since the OS renderers start doing a decent job).</p>
      <p>* Lowercase ascender to descender.</p>
      <p>hhp</p>
