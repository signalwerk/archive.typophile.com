      <p>Well, first of all, it’s just a usability issue; you don’t have to follow my formula (which isn’t even mine) for your fonts to work.</p>
      <p>The reason to use an EM of 1000 is probably a legacy thing - maybe it doesn’t matter any more. But just in case it does, on some backwards app on somebody’s old computer, you might as well use it, since it doesn’t have any drawbacks (that I know of).</p>
      <p>But the reason to use a nominal point size of 8 has something to it: it’s what some users are most used to in pixelfonts (although calling it a “standard” might be pushing it), and you don’t want people fishing for the size your font snaps at (without you putting the size in the font’s name). Also, its 3/4 is a round number, which makes it work in “native Windows”*. And 12 might seem like a nicer nominal size to use, but it doesn’t divide into 1000.</p>
      <p>* There is however another problem with using a grayscale pixelfont in native Windows: the gamma gets thrown off (for some strange reason). Basically you need a separate (darker) version for that (which I provide for my stuff). The good news: Ultrafonts has this process automated; and the darker version is exactly what you need when you set the type light on a dark background!  :-)</p>
      <p>And then the 125x125 comes from 1000/8 of course.</p>
      <p>hhp</p>
