    <p>Hi, <br> <br>I'm designing a pixel font in Fonotgrapher for use in flash. <br>I'm trying to find out what em units to use in Fontographer to make 8, 9 and 10 pixel fonts. I saw a tutorial about this matter a while ago but carn't find it. Can anyone help ? <br> <br>s.</p>
