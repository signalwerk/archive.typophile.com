    html: <p>I suggest that you use 1000 UPM for 10 point &amp; 900 for 9pt &amp; 800 for 8pt with a 100 em unit pixel. You could also use 1000 for everything ( normal ) and then simply use fewer pixels for the 9 &amp; 8. Use 10 point as your ’working’ size &amp; name your fonts ’font10’ ’font9’ &amp; ’font8’. Either strategy should work.</p>
