      <p>I have asked around a bunch about the 1000 UPM thing and have been given many excellent answers. To summarize what I have heard- while there is no hard &amp; fast rule everybody seems to agree that unless you have some overiding reason - like that you are making the font for microsoft and need to follow their UPM standard ( 2048 I think) - or you NEED more precision (maybe for a fab display face - in which case you might want 2000?)-  that you should just use 1000 UPM.</p>
      <p>I guess the part that I still don’t understand is since 75em usits seems to map to a pixel so well ( on a PC not a mac ) and double that is 150. Still, I suppose that the outline scales as it goes from 8 to 9 &amp; to 10 pt. I have been working to hit a 10pt target. So okay this is making some sense if 8pt=125em, 9=100em, &amp; 10=75 em then maybe 11= 50? 12 might be 25?</p>
      <p>Or if not then - 1000 divided by 8 does equal 125, but 1000 divided by 10 = 100 ( which doesn’t work as an idividual pixel on the PC ), and I think Zuzana Licko talked about using 84em for 12pt (really 83.333333333+   and so on but font programs don’t allow that kind of coordinate number, just whole numbers ) but these all sound like Mac usable em numbers to me. Still, maybe 125 scales the 72/96 dpi issue better than the others.</p>
      <p>The thing is fonts change size on screen ( but no in print ) when you go from mac to PC - I don’t think pixel fonts are immune from this. So if you are looking for identical *screen* behavior you would need two fonts - or at least as far I can see.</p>
      <p>I’ll have to try your number &amp; see what happens.</p>
      <p>Still if you are making a tall/skinny font you would run out of vertical space with that 125 pretty fast!</p>
