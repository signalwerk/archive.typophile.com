    html: <p>That's not Serif for sure. I looked at <a href="https://www.fontsquirrel.com/fonts/list/classification/serif/">https://www.fontsquirrel.com/fonts/list/classification/serif/</a> and there's nothing like this there. I hear that <a href="http://uk.essaydune.com/">http://uk.essaydune.com/</a> has got a paid font generator for students college papers, but haven't tried yet. Seems you need to register to download it.</p>
