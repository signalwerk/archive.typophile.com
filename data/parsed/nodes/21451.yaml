      <p>New to typophile.com, but certainly not new to the biz.</p>
      <p>Sometimes young guys don’t know the ropes and don’t realize there is an easy way to get the font you need for a client. Usually all you have to do is ask. Compared to the overall cost (not just what they’re paying you — if they’re paying) and the projected returns, a font like Shag is well worth the $$ investment. Show your client the font, explain how you’d use it, and present them with the cost. It’s just like stock photography… And every young designer should learn to work WITH their clients.</p>
