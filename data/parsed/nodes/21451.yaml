      <p>Yes, fresh fonts are often seen as a designer’s indulgence.<br>
      And that may be true.<br>
      The way to find out is to present comps set in a choice of either an Adobe/Apple/Microsoft bundled font that’s free and everyone has, or something special that will have to be bought. If it really does make a difference that the client can appreciate, then the outlay should be no problem.<br>
      You can certainly do comps for web work, which is low resolution, using screen-grabs from type-testers such as Veer’s Flont. But unfortunately for Seb, House industries don’t do that feature... no doubt to disable unscrupulous designers from using screen-grabs for finished art.</p>
