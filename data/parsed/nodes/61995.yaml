    <p>Since the <a href="http://typophile.com/node/61385" rel="nofollow">previous topic</a> became too hard to follow I decided to start a new one to gather some feedback from you. If you are interested in the whole process please read the <a href="http://typophile.com/node/61385" rel="nofollow">first topic</a>.<br>
    <em></em><em></em><br>
    <strong>SUMMARY</strong><br>
    Simplease is a User Experience Company located in Austria. The company delivers simple solutions for all kind of Application Software and Websites/Web Applications.</p>
    <p>The finished logo should on one hand represent the company and on the other hand be simple enough to use in footers at very small sizes. To achieve this goal I decided to create a wordmark only. The letters are custom-made characters mainly based on Futura Bold and Helvetica Neue Black. By replacing the capital "S" with a small caps "s" I was able to balance the logo better then in the previous versions. Removing the dot of the "i" was the logical consequence.</p>
    <p>Last week's process: Brand new "s"; Refined "a", "e" and "p"; More slender "i", "m" and "l", wider tracking to improve the reproducibility at smaller sizes<br>
    <em></em><em></em><br>
    <strong>STATUS</strong><br>
    At this time I dispense with colors and concentrate on a proper kerning as well as the right clear space.</p>
    <p>I would really appreciate your feedback on the current version.<br>
    <em></em><em></em><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/simplease_logo_4699.jpg"></div><p></p>
