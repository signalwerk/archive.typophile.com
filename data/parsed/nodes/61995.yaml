    votes: null
    html: |-
      <p><strong>@epsilicon:</strong> Since I'm already working on "Simplease" for many months now, I've tried it in all kinds of different typefaces -- just for fun, without having a certain idea in mind -- and figured out that "e" and "a" are a nice couple when it's a double-story "a". They are nicely linked to each other, and that's exactly my "problem". If you look at the current version the whole word feels like it's seperated into three parts (maybe that's just something I see or imagine to see). This effect is caused by the negative space between "m" and "p" and the negative space between "e" and "a". They appear like little gaps but without ruining -- seperating -- the whole word. The idea is that these gaps are kind of subliminal hints for the words "simple" and "please" because you can read "simple" and then stop, and you can start at "p" and read "please". It's the way how the two words are perfectly combined within "simplease" that makes it part of my concept to make those subtle seperations. Another part of my concept is the single-story "a" which communicates -- at least that's what it's supposed to do -- simplicity. To not make it to scientific I decided to add a Helvetica-like "s". In my personal opinion the removed dot of the "i", the single-story "a" and the subtle seperations make it more logo and less text. Btw: the "l" is almost the geometrical center which might help grasping the gestalt.</p>
      <p>Well, that's my concept and if you think that "e-a" will never work with a single-story "a" I must make some confessions to improve the overall appearance but if you think that it might work I would like to do some more tweaking since I've already sold myself on the concept. You've called it nit-picking and I actually wanted it to work for customers and look nice to experts as well. Maybe the question is: Should form follow function? If yes, at what costs? Is the concept worth staying with a single-story "a"? Do you perceive it as typographically nice or as something that still has some mistakes?</p>
      <p>I'm looking forward reading more thoughts on this work and want to thank you a lot for sharing your knowledge which makes this forum my favorite online-place to be.</p>
