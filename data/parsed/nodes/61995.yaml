      <p>Thank you so much for your comments, I appreciate them a lot.</p>
      <p>The "i" and "l" are exactly the same width, but you're right, due to rasterization artefacts "i", "m" and "p" have strangely blurred left sides which let them appear wider then the "l".</p>
      <p>Regarding the pregnant "a" ;) What a great observation, thank you for this. I was working on the double storey a for quite some time and was unsure to tell what it is that makes it look a bit strange -&gt; turns out it was pregnant. Basically I've enlarged the counter and played around a bit with the outside rounding. I hope it works better now.</p>
      <p>After I've stared at the word for some hours (without tweaking around), I felt like there's a little problem with the "s" looking a bit lopsided. I think it's balanced better now. I also did some subtle changes to "e's" eye.<br>
