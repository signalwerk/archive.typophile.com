      <p>Underneath you find the current double-storey a version. I'm not sure the tweaks are 100% there but as you can see in the illustration, there is a nice progress going through the whole word. Let's just omit the initial "s" for the beginning. The "simple" part of the word is basically straight lines that receive more round parts, the closer they get to the "please" part, which basically consistes of round shapes. Especially the passage "ple", where both words meet, works perfectly as a transformation from straight and edgy to soft and round. As you can see in the illustration "ple" looks like straight, half-round, straight, round which feels well balanced to me. To come back to the initial "s"; together with the last "e" it helps the whole word to be equally balanced at both sides.<br>
      <em></em><em></em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/straight-round_4153.jpg"></div><p></p>
      <ul><cite>The new 'a' helps the 'ease' to be as compact as 'simp'</cite></ul>
      <p><em></em><em></em><br>
