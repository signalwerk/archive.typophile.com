      <p>This feeling of being finished is gone again.</p>
      <p>Basically I've changed every single letter. From almost invisible changes like on "s" and "i" to tremendous changes like on "a" and "e". The whole word is set in a tighter leading to make it easier to perceive as one. To compensate the amount of negative space caused by "ea" I made some sublte changes to "s" and "e" to get about the same amount of negative space between them like between "e" and "a". Letter "a" looks more solid now but also feels less bold like in the previous version. Letter "e" now feels more like the Futura "e" which helps reducing the gap in between itself and "a".<br>
