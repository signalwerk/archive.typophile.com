      I originally wasn't going to post this here, as I don't really have time to spend days on end discussing and revising it. But once again, feed-back from you guys has been invaluable*, especially as I had been getting quite insecure about the legibility issue. So, thanks again.<br>
      * Also when we didn't agree.</p>
      <p>Will get back with [pre-]finals, and probably with that "a".</p>
