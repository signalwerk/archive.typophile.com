      <p>Jelmar, the 6mm estimate is based on two things:<br>
      1) a "calculator" that this book on demand service has on their web site (<a href="http://www.bod.de/hilfe-paperback-berechnung.html" rel="nofollow">here</a> for reference, though it's all in German). If I put the variables in there – paperback, 100 pages, 17×22cm, standard white paper –, it gives me 0.6 cm for the spine ("Buchrückenbreite").<br>
      2) another book I made last year that they produced, which has 92 pages, and about 6.5mm on the spine. (I'm just assuming they only have one standard paper sort, so this may be compatible.)</p>
      <p>So I'm assuming that's more or less accurate, though it might be closer to 7mm than 6. I can't calculate it, as they're not really giving specific information about the paper they use – though I might try calling them about that.</p>
      <p>The 2mm margin of error is bad; I've had that happen before in cheap-ish digital printing, though.</p>
