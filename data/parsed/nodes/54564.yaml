      <p>Here's a modified version in three color variants. </p>
      <p>The main thing I did was move the type and art a bit further apart, and "untangle" the "hair" especially around the "a", "o", and "d" to make those letters more easy to grasp in their entirety. (The untangling isn't done – those leaves are endlessly complex once you start working on them…)<br>
      The graphical intensity may have suffered a bit from this? But legibility seems to improve quite a bit, and I tend to think it's a workable compromise.</p>
      <p>I've added a second title on the right; except in #3, in which I think the headline really stands out enough to be legible in his own right.</p>
      <p>I've also reworked the woman's face. I'm not positive the anatomy is quite right, but (and maybe this is caused by sleep deprivation) I see a bit of an interesting tension between the black and the white especially around her mouth and nose, which didn't seem to be there before. (Although this doesn't seem to show so well in these little JPEGs.)</p>
      <p>Btw the cap "A" def didn't work. Looked way too… medieval? The lc seems to be more minimal in its blackletteresqueness (!).</p>
