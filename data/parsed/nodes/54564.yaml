      <p>I know I didn't want to do this, but it's been quite illuminating.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sangue_binocular-a_6661.gif"></div><p></p>
      <p>I basically tried to reach a compromise between trying to find shapes that would match the font (and get the attitude in!), and still keep it open/clear-cut enough for legibility. I decided against a thick horizontal stroke on the top (à la "s"), which looked clunky and didn't seem to make sense next to "n", "m", etc. My "a" was modeled mostly on the original "a", a bit of the "r", and a dash of "d" and "o". And a healthy dash of gut feeling. </p>
      <p>I dunno. I fully expect this to be off in a bunch of ways.<br>
      But I do think it already reads significantly better in the headline:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ArtOfMind_V2_6238.gif"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/ArtOfMind_V3_modA_5712.gif"></div><br>
      --<p></p>
      <p>For the record, once I was on those curves, I also tried some other things I'd been thinking about (like lengthening the ascender of the "d"), but that was not doing much really. The "a" however seems crucial. Thanks for pointing it out, Hrant.</p>
      <p>Any opinions? I'm gonna get back to the client with the revised version tomorrow.<br>
      (And thanks all; this is / has been great learning material as always!)</p>
