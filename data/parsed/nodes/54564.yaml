      <p>I understand your thoughts about the unity of the type and art. One alternative would be to keep the type in black, but blend the bottom of it a gray or one of those "close to gray" colors in the art. The primary legibility problem is that the bottoms of the a, o, and d are lost in the art. You might try playing with raising the type up some so that the bottoms of those letters are more visibile, although that will once again tend to destroy the unity of the type and art.</p>
      <p>Here's another possibility: Keep your title type in black (perhaps with the fade to gray), then repeat the title in a hairline sans-serif type that is set in tightly-packed flush right block and place it where the editors' names are now. (Use a larger point size -- so that the depth of the new two-line title is about the same as the depth of the current editors' text block), then move the editor's text block to lower on the page, probably aligned with the mouth in the art.<br>
      &nbsp;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;~~~~~~~~~~~~~~~~~<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>When going from </em>A to Z,<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>I often end up </em>At Oz.</p>
