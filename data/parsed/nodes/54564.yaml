      <p>I've never heard of that 2 mm rule, and I've designed alot of poetry books which often have narrow spines. I recently designed one with a 5 mm (!) spine, and I used a 9 pt. FF Milo on it. Not a problem at all. I just marked the fold lines really clearly in the bleed area and told them to take care when binding them.</p>
      <p>However, I was quickly looking through my poetry book InDesign files, and those with 100-ish pages all have a spine more in the range of 1 cm. This is just with regular paper you often see in books (whatever it's called in English), which isn't that heavy/thick. So are you sure that 6 mm estimate is accurate?</p>
