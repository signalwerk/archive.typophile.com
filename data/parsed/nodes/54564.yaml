      <p>People don't read letters, they read words. Legibility suffers when people can't recognize the shapes of the words.<br>
      That's why <strong>mind</strong> scans effortlessly in your calligraphic treatment, but <strong>art</strong> and <strong>of</strong> are such short words, the shape of the words doesn't help to decode them. So readers are forced to try to decode letters, and that's where you lose them, because your <strong>a</strong> looks too much like your <strong>o</strong> and your <strong>r</strong> looks too much like your <strong>n</strong>. Work on the <strong>a</strong>, <strong>r</strong>, and <strong>n</strong>, but look at the shape of the words, not just the letters.<br>
      P.S.: Frutiger? Is he smoking crack?</p>
