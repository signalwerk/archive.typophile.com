      <p>Personally I don't have a problem with your initial design at all. I can read it perfectly. The same probably goes for more people on this board, but most of us here are surrounded by and work with letters all day long, so we might not be the best people to judge the legibility.</p>
      <p>That said, I think the treatment in the initial design works really well, since the type nicely blends with the illustration. I saw someone say that this is a problem, but I think it's the opposite.</p>
      <p>However, your last options seem to cover a nice middle ground. I don't think they betray your concept that much. Although I would not repeat the title with normal type, I think it somehow takes away some of the power the headline type has (and it may also look like you underestimate the reader).</p>
      <p>And a 6 mm spine shouldn't really be a problem to print on? I've printed type on such spines before. The type will just have to be small (obviously), so you will have to use a typeface which can handle that (and; add very clear folding lines to your PDF in the bleed area, and tell them to take special notice to the spine).</p>
