  html: |-
    <p>I just found the Bank of Thailand's logo, which is in a Thai version of blackletter:<br>
    <a href="http://www.bot.or.th/_layouts/atQuest/images/TH/banner_left.jpg" title="http://www.bot.or.th/_layouts/atQuest/images/TH/banner_left.jpg">http://www.bot.or.th/_layouts/atQuest/images/TH/banner_left.jpg</a></p>
    <p>Is blackletter well known in Thailand? How readable is this?</p>
    <p>I'd love to see other examples of blackletter in non-Latin (especially non-LCG) scripts.</p>
