    html: |-
      <p>Both the Q and the K would depend on what the rest of the typeface looks like. The Q with the centered tail is quirky and doesn't scan quickly, but it might be appropriate if the rest of the alphabet exhibits similar characteristics.  </p>
      <p>The K's don't stand alone - the first K has a broad, extended appearance, while the second K is more vertical and sleeker. Which one matches the other glyphs?</p>
      <p>Taken by themselves, I like the first Q and second K as members of an alphabet; for artistic value, I like the second Q. And still the second K.</p>
      <p>But then, that's why there's Open Type and alternate glyphs!</p>
      <p>- Herb</p>
