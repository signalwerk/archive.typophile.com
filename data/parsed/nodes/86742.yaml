    <p>I've got a client who is mad on the Alpha Romeo Giulietta badge font. my closest shots have been Rocket Script and Top Speed… neither being quite right.</p>
    <p>Whilst I realise it's most likely that it's a heavily tweaked or entirely custom face, has I'd love to know something that sits really close to it.</p>
    <p>Cheers</p>
    <p>Allan</p>
