  html: |-
    <p>I just saw an interesting TV spot for MetLife which is made solely of letters, mostly animation of hand-drawn "IF" --</p>
    <p>This link takes you to the <a href="http://www.metlife.com/MetNewsFeed/0,5018,12232,00.html?location=HomePageUnit1&amp;bannerad=MainIFBanner" target="new" rel="nofollow">main "IF" page</a>. Play with the mouse-overs on various "ifs".</p>
    <p>Then click the "Watch T.V." link in the upper right corner to watch the TV spot.</p>
    <p>Trying to find out who actually did the creative on the spot, but the <a href="http://www.nytimes.com/2006/06/21/business/media/21adco.html" target="new" rel="nofollow">New York Times</a> credits both Foote Cone (business-to-business) and Y&amp;R Advertising in New York (consumer) as MetLife's agencies.</p>
