      <p>Re. U+0149. This is one of those peculiar characters that is included in Unicode solely because of its presence in one of the pre0existing standards subsumed into Unicode. Some of these standards were industry-specific, e.g. the Dutch telecom standard from which we apparently get the  digraph distinct from the sequence ij that Dutch people actually type. My guess is that U+0149 comes from a similar South African standard.</p>
      <p>It has a compatibility decomposition to U+02BC U+006E, which means that it may be decomposed to that two-character sequence, ʼn, but that sequence may not be composed to U+0149.</p>
      <p>As far as I can tell, there is no Afrikaans keyboard layout: they use the US Standard layout. So users almost certainly type 'n (U+0027 U+006E) and completely ignore both U+0149 and its compatible decomposition. Just because something is in Unicode or WGL4 does not mean it is used, or used widely.</p>
      <p>I would take the phrase 'not actualy a single letter' to mean that this doesn't sort separately from n in typical Afrikaans sorting, although I have no evidence for or against this interpretation.</p>
      <p>There are lots of characters in Unicode that can be encoded in multiple ways, with either canonical (reversible) or compatibility (non-reversible) encodings. It is 'good/normal' so long as your applications and fonts are ready for this :)</p>
