      <p>Chris, I hope you don't mind if I piggy-back on this thread...</p>
      <p>--</p>
      <p>About Latin Extended A<br>
      <a href="http://www.unicode.org/charts/PDF/U0100.pdf" title="http://www.unicode.org/charts/PDF/U0100.pdf">http://www.unicode.org/charts/PDF/U0100.pdf</a> _<br>
      I have a question concerning two characters:</p>
      <p>1) 0138 - Kra: Exactly how is it supposed to look different than the normal Latin "K"? You can't really know from that one Times sample. Seeing as how it's from the dead* language of Greenland (which is melting away as we speak anyway) I neither expect to get a firm reply nor should I be too concerned I guess. But still, if anybody knows, or knows somebody who knows, it would be nice to know. BTW, the 1862 specimen book of the Mekhitarist monks (still going strong on San Lazzaro, Venice) happens to show, along with 32 other languages/scripts, text in Greenlandic, and there's a normal looking lc "k" in there. One thing about Greenlandic btw, it seemingly had the most impressively and consistently longest words, like "tammœgaralloamnik" is about average, and then there's "Ajortulliorkaungak'illangmutIllingnuldo" (yes, it had intercaps too!).</p>
      <p>* I should say "dormant" (since a concept can never really die).</p>
      <p>2) 0149: Is it "not actualy a single letter" or what? If it's two characters, why is it in Unicode? If not: How close/above the "n" can I put the apostrophe? What can come right before this "letter"?</p>
      <p>hhp</p>
