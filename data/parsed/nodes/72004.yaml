      <p>Nick, I don't see that image as evidence of plagiarism, in fact I think it is a little flippant to say so. The fact that these documents were made, kept and now published suggests to me that they are not a shameful record of such activity. Perhaps, however, you view this as the ultimate crime, gone unpunished!</p>
      <p>I mentioned above that I would like to see a digital version of Series 57 Akzidenz. I hope I am correct in saying this version of AG that was adapted to look like Helvetica, a similar treatment was given to Monotype Grotesque Version 1961. Are these typefaces plagiarising Helvetica? Does this not say something about the sharing of culture and ideas? Ideas are shared, inescapable once witnessed, and always imitated and refracted. You say it yourself, the lowercase extends back into the 19th Century, and what came before that, a black hole? No, of course not, some other rock to stand on and step out. And now Bruno has used Helvetica as a rock to step out from, and I in my own efforts to design a typeface I will no doubt examine what <em>he</em> has done. I will also look at Arial and examine it's much debated character. In doing so I am not blinding myself, for all that I dismiss, I carry the imprint!</p>
      <p>Forma, Maxima, Linea, Unica… even Neue Helvetica. Obviously these too are all acts of plagiarism by a cunning masseur!</p>
      <p>More likely they evidence the same activity of evolving and adapting that <em>we all</em> partake in, <em>you</em> included, like it or not! Wether it is trussed up in marketing or ideology is irrelevant. Amazing that you place yourself outside of this ultimately human activity! Spiraling up it's own ass, indeed!</p>
