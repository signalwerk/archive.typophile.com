      <p>My take on Helvetica is a bit different. I think that it has more "punch" in display than Univers, but is horrible in text. </p>
      <p>Here is a comparison of Univers and Neue Helvetica:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Helvetica-Univers_6536.gif"></div><p></p>
      <p>Note how Helvetica (below) is wider and set tighter, and Univers is narrower, and set looser. Compare the word "love" in "Handgloves" and you see the power of Helvetica. But this same quality of being "fat in the middle" as Erik Spiekermann put it in the movie, and tightly spaced, makes it horrible in text.</p>
      <p>I think it has limited use, and is so overused and wrongly used that it makes me scream, but to deny its obvious virtues it seems to me to undermine the real case against its widespread use. </p>
      <p>Univers is way better in text, but then I think Frutiger and Avenir are still better.--And I think that sans in general are limited in how good they can be for extended text. </p>
      <p>Personally, I never liked the aesthetic of Univers—too cold. But I was surprised by the warmth and attractiveness of the examples of hot metal Univers in Frutiger Typefaces: The Complete Works. It has real charm there, and is said to be Frutiger's favorite version by far. Univers Next is an effort of Frutiger and Linotype to capture that, but I don't know how well it succeeds.</p>
