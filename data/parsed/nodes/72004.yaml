      <p>There is no typeface ever designed that is immune from being used horribly. There is no way to stop bad usage (or any usage) for that matter. The problem with Helvetica, Times Roman, and several other "overused ad nauseam" typefaces is that they are forever embedded on every computer on the planet and are doomed to stay there as long as there is backwards compatibility.<br>
      I have no problem with Helvetica when used properly. My only problem is that it is rarely used by choice and more often used by happenstance because of defaults, ignorance, and to some degree, laziness :-) Any typeface given the history and exposure of Helvetica would fall victim to the same disdain and incessant cries for euthanasia.</p>
      <p>I say let it live a fine life in semiretirement and move on to the natural ways of evolution. It was one thing centuries ago when Guttenberg first made his blackletter type modeled after scribal writing. It was the only show in town. The world moved on from then and created many newer faces without committing murder on the original typeface. As the Beatles once said, "in this time of darkness... Let it Be."</p>
