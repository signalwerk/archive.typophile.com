      <p>Matthew, you're still not distinguishing between type design and typography.</p>
      <p>If you're saying that I don't walk my talk, you should first consider my record as an art director. The choices of art directors and graphic designers is really what this thread is about.</p>
      <p>For the record, I followed the Baskin-Robbins philosophy of type choice (so many flavors, so little time), so was always using different fonts for different clients, be they new typefaces or obscure old ones.</p>
      <p>However, it was not always possible to convince clients about this, so I must say that art directors who use Helvetica today may not be totally guilty, if their clients are asking for it.</p>
      <p>**</p>
      <p>As a working type designer, I have produced a few stereotypical genre types as commissions (eg Worldwide, Brown, and Walburn for newspapers), but my preference is for original designs.</p>
      <p>Scotch Modern is a result of conversations I had at Typophile, where I trashed revivals as not being type design, and met enough resistance that I thought perhaps I should give it a try, in the sense of a strict facsimile. One reason I chose the Scotch Modern genre is precisely because it is so overlooked today as a text face (old styles being used for the allusion of "old" in work concerning the 19th century is a particular bugbear of mine).</p>
      <p>Again, whether I taught an old dog (Scotch Modern) a new trick is not the issue -- it's typographers who decide which hoops it should jump through.</p>
      <p>**</p>
      <p><em>I think the lingering question with Helvetica is not "why does it endure" but "why has it been resistant to reinterpretation?" By and large, designers don't seem to want a font that's "like Helvetica but better" or "a postmodern riff on Helvetica". They just want Helvetica.</em></p>
      <p>Again, that's two questions.<br>
      For type designers, "Helvetica" has in one sense proved resistant to reinterpretation -- we are talking about a typeface, the grotesk sans, that began in the mid 19th century, the letterforms of which have been massaged ever since under varying trade names.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Umbrellas_4526.png"></div><p></p>
      <p>In another sense, the grotesque sans has been constantly reinterpreted. Not every grotesque has adhered so closely to the Akzidenz Grotesk model as Helvetica.</p>
      <p>For typographers, I would suggest that the majority of those who specify Helvetica are not trying to impress you with something you've never noticed before, but the opposite. They use Helvetica in a conventional, safe (dare one say professional) manner, because it gets the job done. So it is not resistant to reinterpretation, because utility is their priority, not new tricks.</p>
      <p><em>That’s a very twentieth-century way neophilic of looking at things.</em></p>
      <p>On the contrary, the argument against mass conformity arose in the first age of mass production, the 19th century. From Carlyle to Morris.</p>
