      <p>This is a very strange discussion, because it seems like we all know that ...</p>
      <p>Helvetica remains popular because of its baggage, not in spite of it. 1% of its design utility is in the letterforms; the other 99% is in the cumulative evocative power of 50 years in the popular consciousness. When you see Helvetica in use, you're also seeing the refractions of every other Helvetica you’ve ever come across. (That's not only true of Helvetica --- every font picks up secondary meaning over time through accumulated use)</p>
      <p>The idea that someone can come up with a typeface design that has certain objective advantages over Helvetica -- sure, that's perfectly plausible. Nobody claims Helvetica is technically perfect. But in terms of toppling Helvetica from its perch, that's not the difficult issue, because technical merit only goes to 1% of Helvetica's value. (Similarly, that's also why imperfect digital renderings of Helvetica have not slowed its momentum --- even with crap outlines, 99% of the value is intact)</p>
      <p>I love New York Magazine, in part because of the wonderful art direction. And every few months they put out an issue that goes apeshit with Helvetica.  And the thing is, just when I think I can't look at Helvetica ever again, they completely sell it. </p>
      <p>You want to show me a new typeface? OK, sure, I've seen a lot of them, some are interesting, some not so much. But you want to show me something about Helvetica I've never noticed before? That's much harder, so I'm much more impressed when you pull it off.</p>
