      <p>Andrew (1985): Yes, Univers looks great on that page. I haven't studied it to try to figure why it is so much more attractive than I usually find Univers. I don't think it's just that it is letter press, and the corners softened. It seems like the spacing is different, and tighter. Is that all there is? </p>
      <p>Have you done a comparison with Univers Next? Do you have an opinion on how well captures the original Deberny &amp; Peignot? In the book it shows that the weights are not exactly the same, as the LT Univers original "regular" is heavier (see illustration 56, p. 107) Is he LT Univers regular weight the same as the original Deberny &amp; Peignot? Frutiger describes how he spent many sessions discussing it with Emil Ruder, and he feels the regular (55) is his best "medium" weight. (p. 93) </p>
      <p>Does Univers Next 55 match it? I am a little doubtful, given the story Frutiger tells. The earlier versions of Univers, after the Deberny &amp; Peignot, he feels are a "sorry tale" (p. 97) and the earlier Linotype versions are a "catastrophe" (p. 102). He says he "suffered for it," meaning that while Helvetica was fixed and polished in Neue Helvetica, his Univers was less popular partly because it had been badly done by Linotype. And even though he worked on Linotype Next—a project initiated by Bruno Steinhardt—he says he doesn't see the point of so many weights. I wonder whether any of them match the original 55 that he was so proud of, and which we have both been struck by the beauty of.   </p>
      <p>By the way, I'd *love* to have that book with Frutiger's woodcuts illustrating Genesis, and the text in letter press Univers. I think there are only a few copies in existence. Bruno Steinhardt showed the copy that Frutiger gave him at TypeCon in Boston. Awesome.</p>
      <p>edit: Re-reading Frutiger's account, I see that also some of the widths were changed for Monotype, the basis for a lot of other versions, according to him. Reading Frutiger's own distress over the later versions of Univers, I feel like my being underwhelmed by it—except for that awesome page in the Frutiger book—is somewhat justified. This design is so minimalist and disciplined, that being a little off in rhythm is really a big deal.</p>
