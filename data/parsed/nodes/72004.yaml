    html: <p>While I always have felt that Univers was far superior to Helvetica in every way, I never felt the need to "kill it". The truth is, the more we complain about Helvetica, the more well known it becomes.  We don't need to REPLACE Helvetica, we just need to move on and let it become just another face in history. We don't need a typeface that does what Helvetica DOES, we are better served by designing one that does what Helvetica DOES NOT do.</p>
