      <p><cite>… the lingering question with Helvetica is not "why does it endure" but "why has it been resistant to reinterpretation?"</cite></p>
      <p>Well put!<br>
      I dare to try an answer, be kind with me when I fail :-)</p>
      <p>Perhaps the actual strenght of Helvetica is – its peak miserability. A badness which roots in the total lack of a concept what *letterforms* are, or what they ought to be. Helvetica has nothing to do with writing or printing, or anything else of tangible quality. It appears to be the incarnation of merely administering the alphabet, without having any clue about its shaping. As such a failure, H. is something very human. Like all the bad qualities human beings possess …</p>
      <p>Though Helvetica’s origins lay in the late fifties, it became obviously the typical typographic expression for the seventies. And if it really is a particular bad face, what does that say about that period?<br>
      Though its origin is Swiss, it became rather typical for German or American typography. Has anyone an explanation for that? What does it tell about the Germans, about the Americans?!</p>
      <p>My personal assumption is: Helvetica owes its omnipresence to it being simply THE NON-TYPEFACE, lending generously absolution to all and everything. Maybe therefore it seems to resist reinterpretation.<br>
      _</p>
      <p>And now I’d like to see anyone of you coming up with a new ROTIS.</p>
