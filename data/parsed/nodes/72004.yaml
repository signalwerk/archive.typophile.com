      <p>John, I often order vanilla ice cream as my desert at good restaurants as I belive its quality says all about the restaurant, and I am always prepared to spend a more money in the shops to have better quality, such as Ben&amp;Jerry's. My point is that Helvetica is a inferior quality vanilla ice cream, one made with water, vanilla extract and vegetable fats instead of real double cream, proper vanilla pods and all. It's why I don't use Helvetica but always go for better quality. Now, I believe that there a many good vanillas out there and some of it comes down to personal taste: Akzidenz vanilla I am fond of, too, and of course Univers vanilla. One of the newer flavours is Akkurat, although I find it tastes a bit old-fashioned.</p>
      <p>So far I have only made vanilla cream at home and I find it superior to many bought ones. I will venture and spend an afternoon to make an ice cream in the full knowledge that it will be much more enjoyable than the supermarket brand. So enjoy the Aktiv vanilla. You know it tastes great and it's good for you.</p>
      <p>Buno</p>
