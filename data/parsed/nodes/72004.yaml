      <p><em>...among type designers, most of the vitriol directed toward Helvetica targets its intrinsic weaknesses as a work of typeface design...type designers tend to see typefaces in type-design terms.</em></p>
      <p>I think you're guessing.<br>
      Personally, I'm not irritated by Helvetica per se, but by the fact that its ubiquity is an affront to myself and other present-day type designers. Not only does it say "you guys aren't as good as the old guys", but worse, the default systems aesthetic: "type design is unimportant, I'll use the default" and the economic effect -- profit for corporate shareholders, not type-designers.</p>
      <p>In this respect, I see "type-design" in terms of being a socio-economic, cultural process, rather than the product of such activity.</p>
