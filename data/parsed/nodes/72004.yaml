      <p>To go back to my original point --- among type designers, most of the vitriol directed toward Helvetica targets its intrinsic weaknesses as a work of typeface design. I guess that's understandable --- type designers tend to see typefaces in type-design terms. </p>
      <p>But for Helvetica, most of its accrued meaning comes from outside the typeface, so criticisms lobbed at Helvetica from within the type-design arena sort of miss the point. It's like criticizing Star Wars because the visual effects are unrealistic. Or because the dialogue is wooden. Or because the plot is pinched from any number of cheesy westerns. All true. But so what? </p>
      <p>And to go back to the Bruno Maag interview at the top of this thread, Mr. Maag likewise seems to be down in the weeds with his criticisms about how Helvetica was made and marketed. All true. But so what? The idea of a typeface designer making a "Helvetica killer" seem to me as odd as a sci-fi filmmaker setting out to make a "Star Wars killer". </p>
      <p>And past that, looking at Aktiv Grotesk as a reader, it really does resemble  Helvetica (yes, I can see the differences, but the overall feeling is still strongly Helvetica-esque). So Aktiv Grotesk rides on Helvetica's coattails, and in so doing is not a Helvetica killer at all, but a Helvetica propagator. </p>
      <p>Or to put it another way: if person who really loved Helvetica made a Helvetica "revival" that restored some of the more Grotesk-like details, how would we distinguish it from Mr. Maag's work? Mr. Maag's work seems much closer to an act of homage than hatred (despite his claims to the contrary)</p>
