      <p>Bruno, it's very interesting to read your replies here and on the Creative Review article. I also really enjoyed reading your assessment of the Univers 'a' in Grafik Magazine, though I am not sure I concur, I find this level of assessment really thrilling.</p>
      <p>However, I'd like to know more about your process than the motivation. What do you make of Unica, New Rail Alphabet (Kubel's digital version), Graphik, Neutral etc. and did you examine these faces as closely as Helvetica and Univers whilst evolving Aktiv?</p>
      <p>I have been working on my own grotesk face for some time now. Almost every day I revise the whole strategy for it, ever conscious of failing to deliver something short of solid niche. I am not a commercial type designer so there is no financial pressure to deliver at any point and I am in no doubt that professionals would be dismayed at my practice! However, for this continued self assessment I have abandoned trying to replace anything and every day of the venture demonstrates that this is less and less feasible. As a result, the actual designs (not necessarily the use) of Helvetica/Univers/(dare I say even) Arial et al bother me less and less. It's actually a very rewarding feeling to be reconciled in this manner and to extract that which I view as positive becomes much easier. I can only hope that this approach will be more revealing and improve my work.</p>
      <p>Nick, as for Akzidenz Grotesk… well, I'd relish the chance to buy the Optimo Theinhardt Family if the job came along. I also wish there was a digital copy of Series 57 Akzidenz.</p>
      <p>Anyway, Bruno, I'd love to hear more about how your process on this particular design. That is what made those Unica character sheets so thrilling. I think you had some comments about the 'o' to this effect, more please! Thanks in advance.</p>
