      <p><em>The way that design with Helvetica is informed by all those refractions is stagnant and recursive culture, spiralling up its own ass.</em></p>
      <p>Design with [fill in anything] is informed by the accumulated refractions of [fill in anything]. That includes any design that incorporates type. It also includes type design itself. If anything, type design is more self-referential and inbred than most design disciplines.</p>
      <p>I don't mean that pejoratively. On the contrary, I think it's what makes type design interesting (and difficult). The literal project of type designers is drawing type on the screen. But that's the most boring layer of the work. The complicated layer is the way that refracted meanings are being evoked -- sometimes straight, sometimes with variations -- via these letterforms. It's sort of remarkable to think that type designers can manipulate emotional reactions in readers by manipulating points and lines on a screen.</p>
      <p><em>I want to show you something new with a new typeface. Why do you think that's easier than teaching the old dog a new trick?</em></p>
      <p>Nick I find this an odd comment from you, given that many of your own typeface designs (e.g. Scotch Modern) are influenced by historical models that you chose (I assume) for their evocative energy. When I or anyone looks at Scotch Modern, it raises memories of a certain era of typography. All these memories serve as the backdrop for our current experience with your typeface. So didn't you teach an old dog a new trick?</p>
      <p>I suppose your response might be "No, I drew a new typeface." Well, yes and no. The outlines are new. There are new ideas added. But the core emotional resonance of the typeface draws on a lot of material that's not new at all. Again, none of which I mean pejoratively -- that is true of every historical revival, and why historical revivals are an evergreen source of inspiration for type designers --- there is always a new trick to teach the old dog. You will see something in the historical model that earlier designers didn't see. (I think of the comparison in Bringhurst between ITC Berkeley and FB Californian.)</p>
      <p>True newness in typeface design is much rarer. Zuzana Licko might be the contemporary type designer who has cultivated the most unexplored territory. But I think it's also no accident that her later work features more revival designs. Teaching old dogs (Baskerville, Bodoni) new tricks (Mrs Eaves, Filosofia) can be pretty great.</p>
      <p>So back to Helvetica. I think the lingering question with Helvetica is not "why does it endure" but "why has it been resistant to reinterpretation?" By and large, designers don't seem to want a font that's "like Helvetica but better" or "a postmodern riff on Helvetica". They just want Helvetica.</p>
