      <p>Thanks for your reply William. Let me preface by saying I don't think I know quite so much as yourself about the various versions. I am not sure why I prefer this version, I guess the weight? The slightly softer outline produced by the printing process somehow favours the letters also. 'e' and 'o' seem a fraction rounder on the outside contour. Again perhaps owing to some spread the junctions are a little blacker. 'a' has a little more 'forehead' and a happier bowl, the two counters are more balanced. There are so many versions I get confused as to what I am comparing to so forgive me for my general impressions. I just know that this is my preferred image of Univers and I too would love to own an original copy of 'Genesis'. </p>
      <p>But yes, whatever it was that changed made a great deal of difference. I often feel let down by the quality offered by digital versions of this genre:</p>
