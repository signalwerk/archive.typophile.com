    html: |-
      <p>As far as I know (or believe) it went like this:<br>
      - Proto-writing<br>
      - Cuneiform<br>
      - Hieroglyphs<br>
      - Linear Scripts (A and B)<br>
      - Greek<br>
      - Cypriot<br>
      - Etruscan<br>
      - Latin<br>
      - Western Alphabet</p>
      <p>With some scripts coming and going in different directions:<br>
      - Chinese<br>
      - Japanese<br>
      - Cyrillic<br>
      - Mesoamerican scripts<br>
      - Ogham<br>
      - Runes</p>
      <p>I'd start in Proto-writing because that's the first time ideas (as opposed to objects) are expressed with pictures.</p>
      <p>I could go on and on and on and on about this, so I better stop now....</p>
