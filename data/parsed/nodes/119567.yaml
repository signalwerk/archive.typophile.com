    html: |-
      <blockquote><p>I'm unsure if this is a good start or if there are a multitude of errors hidden away within what I've done.</p></blockquote>
      <p>Why not both?! :-)<br>
      - in /bdgpq/ the curved thick of the bowl looks lighter than the straight stem<br>
      - thin pointy top of  /t/ doesn't mesh with the relatively blunt terminals elsewhere<br>
      - shortness of ascenders may be too extreme for a typeface (what works with the particular letters on the book cover won't necessarily be generalizable metrics).<br>
      - more space in the counters of /MNW/ would be useful<br>
      - /X/ looks heavy and wide<br>
      - /CG/ tops seem too thick<br>
      - maybe the little pinches at the tops of the caps should be more subtly done<br>
      - spine of /s/ is too dark<br>
      - waist of /P/ should probably be lower</p>
