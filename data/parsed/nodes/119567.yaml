    <p>This is my first attempt at a typeface which isn't based on a grid or systems based approach. I'm very much a beginner at typeface design but looking to improve as quickly as possible so please criticise as much as you feel like. </p>
    <p>The typeface is tentatively named Solzhenitsyn after the book with the lettering that it is based off. The lettering in question should be below.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font2_5222-2_6393.jpg"></div><p></p>
    <p>I loved the caps on the title and wanted to try to create a full alphabet from this. My first very rough drafts are below and a pdf is attached for a closer look. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/folio_6348.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/test_4280.jpg"></div><p></p>
    <p>A quick all caps print test.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/folio4_4729.jpg"></div><p></p>
    <p>Being pretty new to the actual design of typefaces I'm unsure if this is a good start or if there are a multitude of errors hidden away within what I've done. I'm also now wondering if I want to create a faithful replication of the title or modernise and try to make it more relevant to today?</p>
    <p>Either way please wade in and criticise. Any feedback would be incredible and most helpful!</p>
    <p>Cheers,<br>
    Max</p>
