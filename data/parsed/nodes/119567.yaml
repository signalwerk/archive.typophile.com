      <p>Didn't expect to get so much feedback so quickly, thanks! </p>
      <p>LexLuengas – In answer to your question, I did yes. It was posted a good while ago in the font ID section, although all the comments pertaining to it seem to have since disappeared for some reason. No ID was reached, the closest match being Laudatio. </p>
      <p>It doesn't show well in the jpeg but the stub serifs seem to vary slightly between the same letters and the Z in Zurich and Solzhenitsyn are quite different which led me to believe it was a piece of custom lettering rather than a typeface. The book is a 1976 edition.</p>
