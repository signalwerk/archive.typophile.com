      <p>Just managed to work my through the rest of the feedback ha. All of which is helpful. </p>
      <p>Both of you seem to say it'd be better to ease off on the slightly pointy nature of it so far, that being the top of the t, the jgyJ terminals or the crossbars. That was probably me trying to force something which didn't quite fit into it..  </p>
      <p>Do you think that by raising the crossbar of the f I would have to raise the terminal and probably the ascender height as well? Which would probably feed into the position of the i dot as well.</p>
      <p>And did you mean to take the bowls of the 'CGce' as a reference?</p>
      <p>Sorry about the sample images... Alignment zones will be learned and used for when I've reworked it. I'll try and make some of these changes in the next day or two.</p>
      <p>Thanks!</p>
