      <blockquote><p>Do you think that by raising the crossbar of the f I would have to raise the terminal and probably the ascender height as well? </p></blockquote>
      <p>Test, then we’ll see. Sounds all like coherent decisions, but you’re looking too far into the future ;-)</p>
      <p>Looking at it for the second time, I agree the ascenders may be <em>a tad</em> too short and Bob’s suggestion may be worth giving a try.</p>
      <blockquote><p>And did you mean to take the bowls of the 'CGce' as a reference?</p></blockquote>
      <p>Uh, yes. I didn’t realize I was being vague. Try keeping the smoothness of the bowls of /CGce/, especially at the bottom where it approaches the stem (it will of course bend more than in those reference characters, but I think you can still reflect its "speed" of thinning).</p>
