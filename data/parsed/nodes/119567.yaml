  - id: 588427
    user: 92807
    date: 2014-09-16T06:35:00
    date_raw: 16 Sep 2014 — 6:35am
    votes: null
    html: |-
      <p>I’m back! A few comments:<br>
      - In agreement with Craig's comment, /MNW/ are too dark. The left vertical stems should be thinner, at least near the diagonal. In your sample the vertical stems don’t vary in contrast, whereas in the book cover there is a tapering towards the diagonal, which gives the glyph more energy and lightens things up a bit.<br>
      - That pointy ended top of the stem of /a/ doesn’t really work IMO.<br>
      - The modulation of the bowls of /adbpq/ is not as soft as in /CGce/. I would take those as reference.<br>
      - The crossbar of /f/ could have the same height as /t/.<br>
      - The crossbars of /ft/ are too pointy.<br>
      - /L/ looks too narrow to me. I think the width in the book sample was adjusted to compensate for the gap of the /LZ/ pair.<br>
      - The terminal of /jgyJ/ is also too pointy. A more rounded terminal would fit the style of the typeface better.<br>
      - /Jj/ are too wide, especially /J/.<br>
      - /T/ is too narrow.<br>
      - The top right serif of /Y/ is too pronounced.<br>
      - /z/ looks great!<br>
      - Soften the bottom of the left diagonal of /y/ at the bottom corner.</p>
      <p>Next time you could set a few alignment zones so that your image samples don’t look so different from the PDF samples ;-)</p>
