    html: <p>I love the way a handcut cardboard stencil looks when not completely perfectly sprayed/painted (bleeds, overspray and/or underspray.)  <br>And that's probably the cheapest way to apply type to your walls without being really good at  <br>drawing ... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>You can also cut a stencil in an overhead transparency and apply removable spray adhessive on the back. Stick that on the wall and you will be more likely to get a clean result. <br> <br>magnus</p>
