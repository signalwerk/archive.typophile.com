    html: <p>Emilie - <br> <br>As mentioned, the vinyl cannot be removed with success but <br>it does however stick to many surfaces. I'm guessing you'll <br>be sticking it to plaster or sheetrock walls - which it will do <br>with ease. In fact, we used to have it on the walls of our  <br>old apartment. White on white walls can look nice. <br> <br>We used Fast Signs. Basically the Kinkos of vinyl. There are two <br>main grades - normal and heavy duty. The heavy duty will <br>work outdoors and they claim it even sticks to cement.  <br>I wouldn't suggest that, but the museum I used to work for <br>has had the same vinyl on sheetrock walls for years.  <br> <br>Usually you can just send an Illustrator eps of your artwork. <br>Be mindful of the sizes the shop has as it can dramatically alter the price.</p>
    html_clean: <p>Emilie - <br> <br>As mentioned, the vinyl cannot be removed with success but <br>it does however stick to many surfaces. I'm guessing you'll <br>be sticking it to plaster or sheetrock walls - which it will do <br>with ease. In fact, we used to have it on the walls of our  <br>old apartment. White on white walls can look nice. <br> <br>We used Fast Signs. Basically the Kinkos of vinyl. There are two <br>main grades - normal and heavy duty. The heavy duty will <br>work outdoors and they claim it even sticks to cement.  <br>I wouldn't suggest that, but the museum I used to work for <br>has had the same vinyl on sheetrock walls for years.  <br> <br>Usually you can just send an Illustrator eps of your artwork. <br>Be mindful of the sizes the shop has as it can dramatically alter the price.</p>
