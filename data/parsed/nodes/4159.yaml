    html: <p>There are many grades and suppliers of vinyl for signage.  <br>There are removable or low tack vinyl and vinyl that that is extremely permanent that it is used for identification on jet airliners. <br>I would suggest that you talk to a number of sign companies that specialize in vinyl cut signage about the cost and your application use. <br> <br>Depending on the amount of copy an alternate would be to print out the copy on your printer and use that as a template for cutting or tracing to the walls. You can purchase low tack vinyl from office supply stores that can be pre cut by you and affixed to the wall as a template for painting the copy. <br> <br>gln</p>
