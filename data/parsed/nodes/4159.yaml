    html: <p>Vinyl is definitely the least expensive option but, unless it's a very, very, smooth surface (brushed metal/marble or polished stone,) it won't work. It will peel off pretty soon. <br> <br>Some stores sell indoor vinyl <a href="http://www.dwr.com/search.cfm?action=search&amp;type=keyword&amp;k=blik&amp;x=9&amp;y=8" target="_blank">accessories</a> that are supposed to last longer but, I would go with the vinyl to create a template for painting over the wall. It will look better and will last longer... </p>
