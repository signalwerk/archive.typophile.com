      <p>Sorry, obviously I hit the save button a bit to fast.<br>
      Here is a picture of the 2013 edition.<br>
      Made of 2000 and 13 keys.<br>
      The size is 70 x 100cm and reproduces the keys in original size.<br>
      I hope you enjoy it.</p>
      <p>You can back the project until October 31 on Kickstarter:<br>
      <a href="http://kck.st/2000and13" title="http://kck.st/2000and13">http://kck.st/2000and13</a> (no shipping costs world wide)</p>
      <p>Beginning November prints are available from my Website:<br>
      <a href="http://haraldgeisler.com" title="http://haraldgeisler.com">http://haraldgeisler.com</a> (with shipping costs)</p>
      <p><strong>Also I wanted to encourage you to share your typography inspired calendars, since this is obviously a topic that interests me.</strong></p>
      <p>Best,<br>
      Harald</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2013-Typographic-Wall-Calendar---by-Harald-Geisler---600px-wide_5773.jpg"></div><p></p>
