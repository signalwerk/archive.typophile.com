      <p>PHIL'S FONTS JANUARY E-NEWS <br>---------------------------------------------------------------- <br>The Linotype Library is NOW AVAILABLE for On Demand Download! <br> <br>Linotype is one of the oldest and most esteemed type libraries. Many of the typefaces in the Adobe Libary are licensed from Linotype. Download favorites like Sabon, Helvetica, Franklin Gothic or Univers; timeless script faces like Aristocrat, Linoscript, Zapfino or Shelley Script. <br> <br>If you are looking for symbol or decorative fonts, try Linobats, Linotype Decoration Pi or Auriol. <br> <br>If it's time to start or update your own library, Linotype also has the answer... e-CDs! Download dynamic selections of Linotype fonts. Packages include Linotype Essentials 1 and 2, Eurostile family, Frutiger family, Futura family, Gill Sans family, Helvetica family and the ITC Franklin Gothic family. <br> <br>Too traditional? Check out TakeType package 2.1, 3 and 4. The TakeType collections contain typefaces chosen from the entries to Linotype</p>
