    <p>OK, what I’m about to say might sound like a complete nonsense, but this thing has been bugging me for the past week and a half, and so far I haven’t been able to come up with a better explanation. So, here it goes:</p>
    <p>Is it just me, or fonts with names that include the sequence ’ding’ do not work properly in MS PowerPoint 2004 for Mac (v11.2)?</p>
    <p>I mean, I’ve generated and tested several dozen fonts, and I always arrive to the same result: In all the ’ding’ fonts, the access to characters outside the ASCII-area is completely messed up.</p>
    <p>Is PowerPoint treating these fonts as if they were <strong>ding</strong>bat fonts?</p>
