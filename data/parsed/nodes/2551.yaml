  html: <p>The Last couple versions of <span class="caps">ID</span> have abandoned Meta, for a new — and in my opinion — much more appropriate serifed face. Unfortunately I dont have a scan, but would somone have the mag handy for an <span class="caps">ID</span> (no pun intended). <br><br>Thanks.</p>
