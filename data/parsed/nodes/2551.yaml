    html: '<p>The answer is on page 19 of the Jan/Feb 2004 issue: <br>"In the new design, by current art director Nico Schweizer, the workhorse typeface Scala used for body copy has been replaced by Coranto, a font created by Gerard Unger in 2000. Meta, which appeared in headlines, will be succeeded by a variety of typefaces that will change over time. We start with Gotham, designed by Tobias Frere-Jones with Jesse Ragan for the Hoefler Type Foundry."</p>'
