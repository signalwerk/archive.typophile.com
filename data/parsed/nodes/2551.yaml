    html: <p>Ahh, damn I was just saying to my partner here, that looks quite a lot like Ungers work, but couldnt place it. Thanks. I might actually read through this mag once in a while now <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. Although not being an ‘industrial designer’, I really ﬁnd very little use for the mag, aside from something for client to ﬂip through. On the subject of magazines, I recently picked up a subscription to <span class="caps">STEP</span>, which had a great layout on type in this current issue, highlighting Bilak’s work and some other great articles. <br><br>On a fairly diﬀerent note, who designed the face for the new york times? Was that Unger? it has quite a similar ‘feeling’. <br><br>Cheers. <br><br>Hildebrant.</p>
    html_clean: <p>Ahh, damn I was just saying to my partner here, that looks quite a lot like Ungers work, but couldnt place it. Thanks. I might actually read through this mag once in a while now <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. Although not being an ‘industrial designer’, I really ﬁnd very little use for the mag, aside from something for client to ﬂip through. On the subject of magazines, I recently picked up a subscription to <span class="caps">STEP</span>, which had a great layout on type in this current issue, highlighting Bilak’s work and some other great articles. <br><br>On a fairly diﬀerent note, who designed the face for the new york times? Was that Unger? it has quite a similar ‘feeling’. <br><br>Cheers. <br><br>Hildebrant.</p>
