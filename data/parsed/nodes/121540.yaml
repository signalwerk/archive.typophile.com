    html: |-
      <blockquote><p>However, InDesign's threshold is arbitrary and I've often felt it would be better if it were left to the designer to turn these features off.</p></blockquote>
      <p>Not quite arbitrary: it is based on a percentage of the /space/ glyph width in a font, which means that the tracking unit at which ligatures and contextual alternates is turned off is proportional to the width of the font: lower for a condensed font and higher for an expanded font.</p>
