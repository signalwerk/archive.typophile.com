    <p>In this thread <a href="http://typophile.com/node/121385">http://typophile.com/node/121385</a> OP put a scanned page from a 1961 book. Used types have somewhat twitched appearance. As I made earlier an OT feature which does that effect I modified a font (in that case Plantin) to recreate that look.</p>
    <p>1. FEA file:<br>
    @class_alt1 contains UC and lc letters, space, comma, etc<br>
    @class_alt2 contains as above, slightly displaced, names with .alt2<br>
    etc up to @class_alt10 ( .alt10)</p>
    <p>2. I made new glyphs - and copied the references of original glyphs and add the .alt1 to their names<br>
    3. Again the same with .alt2 names<br>
    etc up to .alt10</p>
    <p>4. I moved glyphs of every class slightly up or down<br><code><br>
    feature calt { # contextual Alternates<br>
    sub @class_alt1 @class_alt1' by @class_alt2;<br>
    sub @class_alt2 @class_alt1' by @class_alt3;<br>
    sub @class_alt3 @class_alt1' by @class_alt4;<br>
    sub @class_alt4 @class_alt1' by @class_alt5;<br>
    sub @class_alt5 @class_alt1' by @class_alt6;<br>
    sub @class_alt6 @class_alt1' by @class_alt7;<br>
    sub @class_alt7 @class_alt1' by @class_alt8;<br>
    sub @class_alt8 @class_alt1' by @class_alt9;<br>
    sub @class_alt9 @class_alt1' by @class_alt10;<br>
    sub @class_alt10 @class_alt1' by @class_alt1;<br>
    } calt;<code></code></code></p>
    <p>As feature calt is applied, letters (and spaces, commas etc) are substituted and in effect their sequence is:<br>
    x1, x2, x3, (etc), x10, x1, x2, x3 ...<br>
    so every next letter belongs to the group moved in slightly different way.<br>
    Because font is slightly thinner (and more contrasty) than lead types used I added some black stroke and - to compensate inter letter space - some tracking.<br><img src="/sites/default/files/old-images/book_3673.jpg"><br><img src="/sites/default/files/old-images/idd_5284.jpg"></p>
    <p>Advantage: -calt works almost everywhere<br>
    Drawback:<br>
    - in InD tracking about 40 switches off calt (why?!)<br>
    - when you repeat lines the letters are moved in the same way (doesn't happen frequently in books)</p>
    <p>Special thanks to Adam Twardoch<br><a href="http://typedrawers.com/discussion/comment/10641/#Comment_10641" title="Click to visit an external URL." class="freelink freelink-external freelink-external">1</a><br><a href="http://sites.twardoch.com/typography/font-tech/gpos-stylistic-sets" title="Click to visit an external URL." class="freelink freelink-external freelink-external">2</a></p>
