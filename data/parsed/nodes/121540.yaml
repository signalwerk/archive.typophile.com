      <p>Agree, André.<br>
      Stylistic Set can be used in that case - ssXX's are not turned off by tracking. But support is not that wide and in some environments only GSUB ssXX are allowed. See: <a href="https://www.microsoft.com/typography/otspec/features_pt.htm#ssxx">https://www.microsoft.com/typography/otspec/features_pt.htm#ssxx</a> "Each ssXX feature uses one-to-one (GSUB lookup type 1) substitutions."<br>
      So precise adjusting of glyph's widths will help.</p>
      <p>[edit]<br>
      I made an error in first post (and can't edit it)</p>
      <p>"2. I made new glyphs - and copied the references of original glyphs and add the .alt1 to their names"<br>
