    <p>I want to get some feedback on a logo I’ve been working on. It’s near it’s final stages. The company name is RxLocal—they are a medical marketing company.</p>
    <p>I’m working on R &amp; x together, along with incorporating a “graph” feel, to show the marketing sign. I think the combination of the Rx, and a “graph like” image will be enough to visually explain the company.</p>
    <p>The Rx is a heavily modified News Gothic, which I’m still working on (part of the reason I want some feedback). Right now I have a few versions. I have a boxed version, the clients request. I also have a “L” shape version, which I came up with. I think it adds another element from a graph (X,Y plane) and also works as an “L” for local when the “LOCAL” text is dropped below the mark.</p>
    <p>They wanted a green organic color, but I’m not totally set on the colors yet. I’m not sure if I like the Rx together or separated yet either. Let me know what you guys think so far.</p>
    <p><a href="http://www.rosem.com/work/rxLocal/" title="http://www.rosem.com/work/rxLocal/">http://www.rosem.com/work/rxLocal/</a></p>
    <p>Thanks,<br>
    Mike</p>
