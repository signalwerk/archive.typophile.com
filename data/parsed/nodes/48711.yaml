      <p>My thoughts:</p>
      <p>-The top part of the “R” doesn’t sit well on its two legs. The top is too big and the legs are too skinny/awkwardly placed.</p>
      <p>-I don’t care for the distorted looking arrow coming out of the top of the “x”. I never like it very much when things look distorted when they don’t have reason to be.</p>
      <p>-I do like the colors . . . reminds me of the european style pharmacy signs.</p>
      <p>-I’d like there to be perhaps more interaction between the “R” and the “x”. Right now they’re pretty static. I’m not sure if what you said about placing the “R” and “x” together meant making the “x” an extension of the “R’s” right leg, but perhaps you should experiment with that placement - typical when referring to pharmacies and prescription drugs.</p>
      <p>-I like the simplicity youR</p>
