    <p>i'd like to tie together a few threads i've been contributing my 2 cents to recently.</p>
    <p>i began a thread about "the future of licensing" =<br>
    <a href="http://typophile.com/node/42540" title="http://typophile.com/node/42540">http://typophile.com/node/42540</a><br>
    and have read with much interest several other threads about licensing, originality,<br>
    and credit where credit is due, most recently  "a cheater" =<br>
    <a href="http://typophile.com/node/43240" title="http://typophile.com/node/43240">http://typophile.com/node/43240</a></p>
    <p>in various threads i've described my own evolution from reckless young upstart to respectful professional. not having formally studied design, my knowledge of fonts and the work of font designers has evolved slowly with exposure to fonts and design writing, with a lot of time reading and following links on typophile.</p>
    <p>when i was young and reckless i did what so many students do : i grabbed whatever i could. as i matured and began to better understand the complexities of font work, my attitude changed. as i graduated to high-end professional contracts i adopted a policy of legality, despite my frustrations with what i still consider to be illogical and overly restrictive EULA's.</p>
    <p>what changed for me ? AWARENESS. i think fonts are traded so easily among friends partly because they remain, in many people's minds, fairly anonymous. this may be hard for some of you to believe, but it's true. you are unsung heroes.</p>
    <p>this is an open call to typophile for suggestions on how we can raise awareness in the public, among small and amateur designers, crafters, magazine readers, etc. as to the real work and time that the font designer spends at their craft.</p>
    <p>i really appreciate the bio's and histories of designers on myfonts.com.</p>
    <p>the FDRC could promote a public campaign along the lines of :<br>
    "it took me two years to design this font. it took you two seconds to download it".</p>
    <p>maybe i'm naive but, despite my call for EULA reform, i'm on your side.</p>
