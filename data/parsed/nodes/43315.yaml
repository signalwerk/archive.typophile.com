      <p><em>if there is a way we can make it less desirable/unconscious to abuse fonts, font designers, and the font industry in general</em></p>
      <p>We could cut back drastically on bundling. </p>
      <p>There will never be widespread respect and appreciation for fonts as long as massive bundling continues.</p>
      <p>People think fonts aren't worth anything because they get a large number free when they buy a computer or licence a major graphics or word processing application.</p>
      <p>As a means of addressing piracy, those who lead the font industry might consider the influence that the corporate behaviour of Adobe, Apple, and Microsoft has on public attitudes and behaviour.</p>
      <p>Consider a typical graphic designer set-up: a Mac, CS, and Office.</p>
      <p>To licence the Mac bundled fonts, from Myfonts, would cost around $2,000--more than the cost of the computer.<br>
      To licence the CS fonts, from Adobe, around $1,300--75% the cost of CS.</p>
      <p>If these companies were "type foundries and other individuals whose livelihood depends upon the proper licensing of our work" (FRDC mission statement), and made their income from fonts, they would not be quite so generous in their "subsidy" of graphic designers.</p>
      <p>Designers are given all the fonts necessary, and more, to run their business, so they don't have to spend any money licensing them, and can instead direct it all to the purchase of their computer and major applications. </p>
      <p>Bundling is responsible for the fundamental reality, the awareness that exists amongst the majority of those involved in the design industry, and our clients: "Fonts are not a business expense."</p>
      <p>Getting tough with piracy is not without merit, but it is damage control.</p>
