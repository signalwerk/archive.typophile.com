      <p>I’ll just get on my usual soapbox:</p>
      <p>•Teach type design: I know the money sucks, even for a designer, and design students can be extremely irritating. But the best way to teach type appreciation to designs is to teach them to design type, so that they realize that there are some very dedicated people behind every good font out there.</p>
