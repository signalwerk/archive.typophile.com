      <p>it will never be impossible to steal anything or hack DRMs. </p>
      <p>i think the point has been well made that embedded DRMs are a terrible idea, not least because they essentially punish the honest. </p>
      <p>in my opinion, and i venture to say that of many others on this list, the traditional EULA which links fonts to specific computers is also a terrible idea, completely impractical especially for small businesses, and one of the aspects of EULAs that invites violation even if the user is scrupulous about other restrictions such as forwarding, embedding,  or otherwise distributing the font.</p>
      <p>but the point of this thread is to ask if there is a way we can make it less desirable/unconscious to abuse fonts, font designers, and the font industry in general, by cultivating awareness, respect, understanding, and appreciation.</p>
