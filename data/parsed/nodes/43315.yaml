      <p>“it took me two years to design this font. it took you two seconds to download it”.</p>
      <p>You are making the mistake of linking value to time. I'm sure it would not be difficult to find examples of life-long works that are rubbish, or brilliant types that were executed very quickly.</p>
      <p>If the message is "don't download type because it's stealing from poor, meagre type designers who dedicate their lives to a thankless art", it becomes pretty easy to come up with counter examples of people who have made millions from (comparatively) little effort, or corporations who are still selling the work of dead designers for more than the prospective "pirate" will likely ever make. (This reminds me of the MPAA ads that showed pathetic looking stage hands and their waifish children.)</p>
      <p>I think the better tack is to release new stuff frequently and provide a positive purchase experience that adds value at a reasonable price. People will buy fonts when they need them rather than nursing a decrepit old collection of thousands of gross fonts gained through perilous ventures into the underbelly of the internet, braving viruses, and gross pictures for fonts that don't work that well anyway. Adding value through new type technologies is a good tack as well. Who wants all the gross old fonts they collected in the 90's when you could buy shiny new "Pro" fonts.</p>
      <p>Another viable business model for the digital age is custom or exclusive types. The cost of producing a typeface has fallen such that custom types are much more achievable for publications and corporations that previously couldn't afford them.</p>
