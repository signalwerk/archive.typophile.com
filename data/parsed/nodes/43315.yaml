    html: |-
      <p>Nick, I think your comments about bundled fonts show a very closed view of where type appreciation stems from. Your proposed drastic changes really only affect professional designers who can justify spending large amounts of money on typeface families. If we're looking for widespread type appreciation, then including only Helvetica and Times (or Gotham and Garamond, if you prefer) with every machine would kill off any and all type appreciation that exists in this world. Design would be an exclusive club of privileged elite who can afford to purchase more than two typefaces per year.</p>
      <p>Do you know what creates appreciation for good type more than anything else? Bad type. I started reading about type design because of the website bancomicsans.com. I knew practically nothing about type, but I knew that I hated Comic Sans. I would start to notice flyers around campus set in Comic Sans, then I would start to notice flyers set in Arial Black, then (god forbid) Curlz. I began to recognize certain typefaces that I liked, and I started reading typography blogs and books and such.</p>
      <p>My point is, cutting bundling down to a serif, a sans, and a monospace would only serve to alienate people like me who are interested in typography as a hobby but can't afford to invest our lives and savings into it.</p>
      <p>The real question is, how do we define an appreciation for type? I don't want to set up a straw man, but Nick, it sounds like you're implying that an appreciation for type involves people only using really, really quality typefaces because they don't have mediocre ones readily accessible. But only people who already have an appreciation for type would go to the extra effort and expenditures to carefully choose which faces are in their libraries.</p>
      <p>To me, type appreciation is not about every professionally designed item being set in really quality typefaces. Type appreciation is about my being able to point out to my friends how ridiculous it is to set a flyer advertising a class on Gender and Islam in Cooper Black without getting a raised eyebrow, or to point out bad kerning without being ridiculed.</p>
      <p>Arguments like yours, Nick, only serve to put off those of us who are mildly interested in type as a hobby because they create a sense of elitism. At the end of the day, font awareness is not about designers owning certain fonts that are considered good by a group of elites such as this one; it's about ordinary people recognizing good design.</p>
