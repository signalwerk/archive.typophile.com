      <p>No matter how badly one may want to put the "face" in typeface, I just think some people don't care enough to pay for their fonts. People download movies, music, software, etc. Aside from designers (sometimes), most people don't even know that fonts aren't always free, let alone that it actually takes time to design them (i had a friend that thought fonts were just force-vomitted automatically by a simple computer program). I think the fundamental problem is that exactly. Maybe if font software was somehow managed like iTunes mp4 format, (no, not the 99 cents part) where you can't copy music (the iDump software notwithstanding), but you can only authorize it on the computers you use. I'm not an expert on font files, but i imagine it's a long time before this kind of security could be embedded. Any store without security will be stolen from, that's what makes digital files so dangerous.</p>
      <p>As for monitoring rip-off fonts, that would be decidedly harder, until some optical-recognition program could create a master database of any little font that has ever appeared. You're always going to have people who forge art for their own gain, businessmen who steal their underling's work. Some people don't care about intellectual property at all, as long as they dont get caught and they make money doing it.</p>
      <p>Long and short,the only way to stop it is to make it impossible to steal in the first place.</p>
      <p>Obviously typophiles are a different breed, but that's my take.</p>
