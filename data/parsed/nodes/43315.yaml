      <p>Designers—those designers worth their salt*—take the time to think about the typefaces they use. If those designers are frequenting the different font vendor sites, subscribing to various newsletters, reading certain blogs, then they learn about the typefaces available. Maybe we here are the few (although I doubt it), but the fonts on the various sites are getting licensed or why are all the foundries still in business? </p>
      <p>Bundling might give some designers some nice basics to use. Yes, I use them when I need to. But the basics are just supplemental. I really depend upon a nice variety to get my work done. I think most of us do. Perhaps foundries need to run ads in business magazines, or blogs, or newsletters, to start getting their stuff seen more? </p>
