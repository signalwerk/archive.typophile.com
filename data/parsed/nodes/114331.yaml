      <p>In the absence of any other comments, can I state the obvious and say that this has been hand-drawn or possibly a modified version of a standard font. There are a few fonts in a similar vein by Laura Worthington (Ganache, Funkydori and Number Five) that could have been used as the basis for that particular design.</p>
      <p>(Note: Soft Façade’s new website logo appears to be based on Kari Regular Italic by Positype.)</p>
      <p>Hope this helps.</p>
