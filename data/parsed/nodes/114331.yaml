      <p>In the ballpark, I suggest Crema, designed by Hubert Jocham for packaging -- the name suggests dairy, yoghurt etc:<br>
      <a href="http://www.myfonts.com/fonts/hubertjocham/crema/" title="http://www.myfonts.com/fonts/hubertjocham/crema/">http://www.myfonts.com/fonts/hubertjocham/crema/</a><br>
      There are also other buttery scripts such as Tartine Script <a href="http://www.identifont.com/show?27MD" title="http://www.identifont.com/show?27MD">http://www.identifont.com/show?27MD</a> that you might find useful.<br>
      Don</p>
