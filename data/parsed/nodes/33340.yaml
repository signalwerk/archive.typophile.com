      <p>I said primitive <cite>construction</cite>. Using discrete squares to render out the pixels is the lowest form of pixelfont; it causes (at least) two  problems, plus it makes the font unnecessarily large in K. As for the Italic, the real problem I guess is simply pretending it is one. If they had called it Cursive then I would have no issue, since users would know what it’s not.</p>
      <p>hhp</p>
