    <p>Hello!</p>
    <p>I’m looking for a bitmap typeface with a construction similar to these ones:<br>
    Screen Matrix, Knit map and Folk art.<br>
    I would like it to be more neutral then folk art but more gentle and delicate then Screen Matrix.<br>
    Do you have any suggestions that might help me?</p>
    <p>Thanks a lot in advance.</p>
