      <p>&gt; Don’t the Garamond punches still exist?</p>
      <p>These are the (punches and) matrices by Garamond romans (with upper- and lowercase) that survived at Plantin-Moretus.</p>
      <p><strong>Garamont’s Gros Canon Romain</strong>    c. 40 pt,  (1555 ?)<br>
      Matrices preserved: Plantin-Moretus Museum, Antwerp</p>
      <p><strong>Garamont’s Parangonne Romaine</strong>     caps-height: 4mm (c. 1560/1561)<br>
      Matrices preserved: Plantin-Moretus Museum, Antwerp</p>
      <p><strong>Garamont’s Texte Romaine or Gros Romaine</strong>    caps-height 3.5 mm (1564 ?)<br>
      Matrices preserved: Plantin-Moretus Museum, Antwerp</p>
      <p><strong>Garamont’s Augustine Romaine</strong>     caps-height: 3 mm (1556/1564)<br>
      Punches and matrices preserved: Plantin-Moretus Museum, Antwerp</p>
      <p><strong>Garamont’s Mediane Romaine or Cicero Roman</strong>     caps-height: 2.5 mm (1558)<br>
      Matrices preserved: Plantin-Moretus Museum, Antwerp</p>
      <p><strong>Garamont’s Garamonde Romaine Premiere or Petite Romaine romaine or Petite Ascendonia</strong>      caps-height: 2 mm (1558)<br>
      Matrices preserved: Plantin-Moretus Museum, Antwerp</p>
      <p><strong>Garamont’s Garamonde Romaine</strong>      caps-height: 2 mm (1592 ?)<br>
      Matrices preserved: Plantin-Moretus Museum, Antwerp</p>
      <p><strong>Garamont’s Bible Romaine or Brevière romaine</strong>     caps-height: 1.5 mm (1559)<br>
      Punches and matrices preserved: Plantin-Moretus Museum, Antwerp</p>
      <p>Facsimiles for all of these typefaces you can find in:<br>
      Vervliet, H. D. L., Type specimen facsimiles 2. Reproductions of Christopher Plantin’s Index sive specimen characterum 1567 &amp; Folio specimen of c. 1585; together with the Le Bé-Moretus specimen c. 1599, London 1972</p>
      <p>These unfinished punches and matrices by Garamond romans are also at Plantin-Moretus, (but there is no facsimile of the second of these two typefaces in Vervliet, H. D. L., Type specimen facsimiles 2.):<br>
      • Garamont’s Grosses Capitales Romaines caps-height: 14.5 mm (unfinished)<br>
      • Garamont’s Capitales de 2 Règles Bible ?? pt (unfinished)</p>
      <p>The Garamond Greeks are (were?) at the Imprimerie Nationale.</p>
      <p>&gt; too bad that the type, tools, and presses of Aldus, Jenson, Griffo etc. have not survived<br>
      At least we have the books<br>
      :)</p>
