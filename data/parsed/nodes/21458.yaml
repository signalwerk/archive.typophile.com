      <p>&gt; 3. Punches and matrices?</p>
      <p>Don't know whether these are the oldest, but these two are pretty old<br>
      (both are from 1543):</p>
      <p><strong>Garamont’s Royal Great Primer or Gros-romain (Greek) 16 pt (1543)</strong><br>
      Punches and matrices preserved: Imprimerie Nationale, Paris, boite 47<br>
      (That is, it was at the Imprimerie Nationale, before it closed down due to lack of funding).</p>
      <p>The typeface was probably ready by the end of 1542.<br>
      The first use of it is in Robert Estienne's 1543 'Alphabetum Graecum'.</p>
      <p>facsimile and literature:<br>
      • Vervliet, Hendrik D. L., 'Greek printing types of the French Renaissance: the ‘'grecs du roy’' and their successors', in: Journal of the Printing Historical Society, new series number 2, winter 2000, p 13-14</p>
      <p>The Plantin-Moretus Museum has some pretty old stuff, too, for example:</p>
      <p><strong>Granjon’s Italique Saint augustin première 12 pt (1543)</strong><br>
      Matrices preserved: Plantin-Moretus Museum, Antwerp, MA 27a</p>
      <p>facsimile and literature:<br>
      • Vervliet, H. D. L., ‘The italics of Robert Granjon’ in Typography Papers 3, 1998, p 10-11;<br>
      • Vervliet, H. D. L., Type specimen facsimiles 2. Reproductions of Christopher Plantin’s Index sive specimen characterum 1567 &amp; Folio specimen of c. 1585; together with the Le Bé-Moretus specimen c. 1599, London 1972, see p 4 and no. 16/25</p>
      <p>So, 1543 is my guess right now.<br>
      (it's not much more than a guess - I didn't do proper research) </p>
      <p>Any other or earlier suggestions?</p>
