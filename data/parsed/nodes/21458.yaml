      <p>Nick</p>
      <p>The typefoundry blog</p>
      <p><a href="http://typefoundry.blogspot.com/2006/01/materials-of-typefounding.html" title="http://typefoundry.blogspot.com/2006/01/materials-of-typefounding.html" class="link-external">http://typefoundry.blogspot.com/2006/01/materials-of-typefounding.html</a></p>
      <p>has an entry by Mosley on existent punches.</p>
      <p>I think the Plantin-Moretus Museum might have the earliest of surviving wooden common presses. The problem with the wooden common press was that it was built into the structure of the building; the roofing beams. Thus they were more likely scavenged rather than moved.</p>
      <p>To go a bit non-western, the Tokyo Printing Museum has some great examples of sand moulds and castings from earlier Japanese and Korean efforts. They've a couple of catalogs with great photos.</p>
      <p>Quaerendo: quarterly journal from the Low Countries devoted to manuscripts and printed books has a very useful examination of existing wooden common presses. An index to articles can be found at</p>
      <p><a href="http://www.msh-reseau.prd.fr/RevuesSom/detailrevue.jsp?Drevue=%22Quaerendo%22" title="http://www.msh-reseau.prd.fr/RevuesSom/detailrevue.jsp?Drevue=%22Quaerendo%22" class="link-external">http://www.msh-reseau.prd.fr/RevuesSom/detailrevue.jsp?Drevue=%22Quaeren...</a></p>
      <p>Gerald</p>
      <p>The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com" class="link-external">http://BielerPress.blogspot.com</a></p>
