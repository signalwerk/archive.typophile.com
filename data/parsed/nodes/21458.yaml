      <p>The oldest matrices may be those done by Henric Pieterzoon de Lettersnijder about 1492 - kept by Enschede en Zoonen at Haarlem.<br>
      -&gt; Henry Carter: A view of Early Printing. 1969</p>
      <p>The oldest type font my be the letters found at Lyon in the Saone in 1878. They are from late 15th / early 16th century.<br>
      -&gt; Maurice Audin: Types du XVe siècle in: Gutenbergjahrbuch 1954</p>
