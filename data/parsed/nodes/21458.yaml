    html: |-
      <p><em>but why would anything that was still good for use survive?</em></p>
      <p>A theory: When an old plant became obsolete, businesses would shutter it up, and build a new one next door, on the same premises. Clearing the ground and disposing of the remains was an avoidable expense, by doing nothing. So as long as the business had continuity, the old buildings retained their contents. The situation was the same with the old family mansion, where it would have been disrespectful, bad luck even, to chuck out one's ancestors' effects.</p>
    html_clean: |-
