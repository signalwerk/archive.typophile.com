      <p>Good question… The consensus is that several existing technologies came together when Gutenberg invented "printing". There were presses (eg for winemaking), the technique of making punches was around (for decorating metalwork) — even the use of counterpunches was in use. The technique of printing by using a counterform was known and used (blockprint). Paper was being produced in quantity. Literacy was increasing as well as the buying power of the middle classes. Etc. etc.</p>
      <p>Gutenberg's genius lays in putting all this together, industrializing several processes (eg producing the loose type) and (very important!), inventing an ink that was suitable for his needs — something new and the last cog needed to get it done. In the end he never benefited from his invention, but untold others have…</p>
      <p>As with most mayor inventions the art of printing sprung up in more places at the time, but Gutenberg hit it spot on and the others have been relegated to the outposts of local history (sorry, Coster).</p>
      <p>The speed with which printing spread throughout the world was impressive — almost comparable to the revolution of the world wide web. Go figure — that happened five centuries plus ago…</p>
