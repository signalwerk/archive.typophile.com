    <p>The most comprehensive book on wood type in 50 years. 330 pages, 9"x9" x 1" (3.5 lbs) Soft cover laminated in either choice of super gloss or matte. A self-published book, available only on line at <a href="http://www.the" title="www.the">www.the</a> artofwoodtype.com/ $50 plus $5 S&amp;H (US), Foreign shipping Mexico &amp; Canada $15 (USD), Everywhere else approx. $39 (USD) Inquire grapublish@aol.com/  Preface by Allan Haley, Director of Words &amp; Letters, Monotype Imaging, Introduction by Malcolm Dean.<br>
    SECTION 1-Typography, How it All Began, The Invention of the Alphabet, The Evolution of the Alphabet, The Dawn of Modern Typography, The Anatomy of the Letterform, Anatomy of the Type Style. The Wood Type Wood and The Pantograph with other facets of wood type components.<br>
    SECTION 2, The Hamilton Story a retrospective of the Hamilton Wood Type Manufacturing Company.  Nine Artists, Printing Professors and Collectors tell their experiences of working with type and wood type. Profusely illustrated in color photos.<br>
    SECTION 3,  A two page review of Antique Presses and Metal Type.   SECTION 3, excerpts several interesting pages from U&amp;lc and Westvaco.<br>
    SECTION 4, Consists of 220 pages Wood Type "Proofs" facing page with the Wood Type Photo. Each type style is named, dated, manufacturer, and a brief description of facts and details of the font. Closing with a Dedication to Rob Roy Kelly.<br>
    Written, Illustrated and photographed by Gregory Ruffa. For further information email: <a href="mailto:grappublish@aol.com">grappublish@aol.com</a></p>
