    <p>Dear Typophiles,</p>
    <p>After coming with <a href="http://typophile.com/node/17136">Sofa/Canapé/Divan</a> rather far, I've started to work on an italic for it.</p>
    <p>The plan was to create a normal italic, which is quite slanted with adaptions, and another one which is more like italics for Antiqua (i used the opentype swash-feature for it).</p>
    <p>So I will have:</p>
    <p>Uppercase normal + swash<br>
    lowerase  normal + swash<br>
    maybe smallcaps normal</p>
    <p>I've developed the first version from the roman one, first giving it a slant of 8°, and then finetuning it. I was not quite happy with that, so I made copies and created the swash-versions, which are much further away from the roman.</p>
    <p>I am quite happy with the swash-characters now: they need finetuning for sure, and I am happy about any comment which characters still appear to be "roman", or which one won't work.<br>
    More problems exist with the "normal" version: I think this is too near to the roman yet. Which features of the swash-ones should I carry back to the normal one too?<br>
    You can find an overview for this problem on page 3 in the pdf (red is indesign-slanted version of the roman, being there for comparison). On page one on the bottom, you can see both versions, on the left is the normal one, on the right the swashes.</p>
    <p>Is there a need for italic smallcaps?</p>
    <p>Thanks again for your comments<br>
    Sebilar</p>
    <p><strong>More members of this family</strong><br><a href="http://typophile.com/node/17136">Sofa roman</a><br><a href="http://typophile.com/node/18464">Sofa sans</a></p>
