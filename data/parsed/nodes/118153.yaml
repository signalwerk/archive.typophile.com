    html: |-
      <p>URW Gothic Demi is a great match--no modifications needed--for "lynda," but not a match for "com":<br><a href="http://www.myfonts.com/fonts/urw/gothic/">http://www.myfonts.com/fonts/urw/gothic/</a></p>
      <p>Century Gothic Standard Bold is also a tight match for "lynda," and Century Gothic Regular matches ".com":<br><a href="http://www.myfonts.com/fonts/mti/century-gothic/">http://www.myfonts.com/fonts/mti/century-gothic/</a></p>
