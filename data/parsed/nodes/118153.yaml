    html: |-
      <p>ITC Avant Garde Gothic Demi + a circle (avant garde has a square) + ITC Avant Garde Gothic Book</p>
      <p>The terminals on the "c" are sliced.<br>
      They could also have used a period from Futura (or Avenir).</p>
      <p>You could reproduce it using <em>Futura Heavy</em> and <em>Futura Light</em>, but you would need to slice off the descender on the "y" and the ascender on the "d" (even with the cap height of the "l"). Also you would need to use an "o" character and slice it accordingly as the "c" in <em>Futura Light</em> doesn't have terminal angles that match.</p>
      <p><img src="/sites/default/files/old-images/lynda_6389.com.jpg"></p>
      <p>***Update***<br>
      After downloading a pdf from their site and looking at the fonts, they use Avenir for their regular copy. Since "lynda" is obviously not <em>completely</em> Avenir based on the letterforms, it looks like the ".com" however could have been made with <em>Avenir Book</em> without alteration. They likely used <em>Futura Heavy</em> as the basis for "lynda" because of the trough in the "y" character, although using Avenir Black for the consonants and Futura Heavy for the vowels (chopping the "y" descender with the difference in length between the x-height and the ascender on the "d") would be yet another way to make it work.</p>
