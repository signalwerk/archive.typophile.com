    <p>Hello,</p>
    <p>I try to find the type of font used in the words lynda.com (see picture attached). Can any one help me, please?</p><div class="imageWrap"><img src="http://typophile.com/files/2014-07-21_21-11-14_4231.png"></div><p></p>
