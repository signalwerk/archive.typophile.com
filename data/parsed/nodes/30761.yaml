    <p>Hi all,</p>
    <p>I've been looking for different ligatures for a school project and found this typeface...I just can't seem to figure out what it is, but I think it looks very elegant, subtle yet contemporary.</p>
    <p>These examples are designed by Red Design for Gresham Blake (you can see the full photo on their website <a href="http://www.red-design.co.uk/" title="http://www.red-design.co.uk/">http://www.red-design.co.uk/</a> - still - gresham blake).</p>
    <p>Did Red Design make this themselves or is it an exsisting typeface?<br>
    if it is an exsisting one, would anyone know the name of it and where I could buy it?</p>
    <p>thank you very much!</p>
    <p>grtz,<br>
    dav2.</p>
