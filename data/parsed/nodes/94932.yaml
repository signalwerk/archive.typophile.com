      <p>This may be a stupid question, but why a "trademarked" font? In the good old US of A, AFIK, a trademark can only be applied to the NAME of the font, not the design. The design of the font can be patented with a Design Patent, but too many fonts look similar in some way or another to this excellent and FREE design, that it is not likely that such a patent would be granted.</p>
      <p>OTOH, the font information itself—i.e., the actual code used to generated the font within the OS or wherever—is more or less covered by a common-law copyright, which is enforceable in a US court of law if a fake can be proven to be an outright copy, beyond any reasonable shadow of a doubt. Hello, lawyers' fees.</p>
      <p>So: is "free" not cheap enough, or does someone need to toss a lot of dough around to feel like a big shot? Because, if the latter is the case, whoever wants to feel like a big shot can impress the hell out of me, and STILL use the free font. If you catch my drift…which, if you are not yet certifiably insane, you might not…</p>
