      <p>I don't think these credible options will work in your case, because the text file no longer contains the Hebrew text, but only the codesa for an exclamation mark. In other words, it's a useless file, no matter how hard you huff and puff.</p>
      <p>I have been around Hebrew files to typeset, and have run into every imaginable problem.</p>
      <p>The latest problem of the exclamation marks is related to the solution: Unicode, which assigns a code value to every letter, symbol, or glyph belonging to most every language of the world.</p>
      <p>However, transfer of data by one userto another, when each user uses a different software program poses a small challenge. Unfortunately, one user chooses a file format that doesn't support Unicode, and the resulting file only contains exclamation marks.</p>
      <p>This is like any good invention. Instead of trying to repair the results, it is wiser and best to simply start over again from before the error happenned.</p>
