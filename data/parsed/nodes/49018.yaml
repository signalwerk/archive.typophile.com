      <p>That does not look good indeed. My browser was being told that files are by default utf8 and the link cannot be read as utf8 text. Now I tell my browser to display the same link, but I tell my browser that the encoding is "Hebrew"...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/recode_4956.jpg"></div><p></p>
      <p>Here is what I now get on my screen</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hebrew_5976.jpg"></div><p></p>
      <p>That may not be perfect (the display on Chaim's editor shown above had no trouble with the final period and commas)  but at least the "question marks" are now replaced by Hebrew text. The link never contained question marks, it just contained information that my browser could not make sense of because it made no sense as a utf8 text.</p>
