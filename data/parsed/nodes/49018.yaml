    html: |-
      <p>The ISO-8859-8 hebrew encoding is still in use (I regularly receive emails with that encoding). If you have an ISO-8859-8 encoded file and need a utf8 input, you can use the free <a href="http://recode.progiciels-bpi.ca/" rel="nofollow"><strong>recode</strong></a> facility (that is a Unix command but there are non unix ports). I installed <code>recode</code> on my mac and if <code>file.txt</code> is ISO-8859-8 encoded, then the command</p>
      <p><code> recode hebrew..utf8 file.txt </code></p>
      <p>results in <code>file.txt</code> being utf8 encoded  (as you see, recode overwrites). To see all the encodings that recode can handle, type <code>recode --list</code> in a shell window.</p>
      <p>Michel</p>
