      <p>&gt;  Wow! How many clients had to resend their text files to me as .doc files. Hmmm.</p>
      <p>If that solved your problems, great!  I remember a time   when a doc file produced on a pc caused trouble on a mac because all those French accented letters are coded differently on the two platforms. For me (and many colleagues) receiving a doc file was no solution, it was a problem! With a .txt file, we could at least recode, thanks to that <a href="http://recode.progiciels-bpi.ca/" rel="nofollow"><strong>recode</strong></a> program written by <a href="http://pinard.progiciels-bpi.ca/index.html" rel="nofollow">François Pinard</a> who was for many years in my university (Université de Montréal) computing services. Today, many applications accept to read a wide choice of encodings. Times are changing.</p>
      <p>Michel</p>
