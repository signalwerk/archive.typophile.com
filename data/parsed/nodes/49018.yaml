    html: |-
      <p>When a text file displays Hebrew as question marks, this means the text is not not recognized. </p>
      <p>The customer's program that saved the text file exported the Hebrew text data as Unicode encoding for Hebrew, but in a file format (i.e. .txt) that does not support Unicode.</p>
      <p>The customer must resend the file to you in a different file format.</p>
      <p>The customer must resend the file to you taking into consideration two factors:</p>
      <p>1. The file format must support Unicode.</p>
      <p>2. You have a program that can read the file or import it correctly.</p>
      <p>.doc from MicroSoft is a very good file format to transfer Hebrew text, as most people have MicroSoft Word XP or later.<br>
      .doc files from MicroSoft Word XP or later support both Unicode encoding and Hebrew.</p>
      <p>After you finally get the file, to create an animated gif or a .jpg with the Hebrew text, it must appear right-to-left. You can use Adobe PhotoShop ME (it must be a ME -Middle East- edition).</p>
      <p>Contact <a href="http://www.fontworld.com" title="www.fontworld.com">www.fontworld.com</a> for more information.</p>
    html_clean: |-
