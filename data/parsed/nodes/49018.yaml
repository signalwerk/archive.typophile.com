    html: |-
      <p>&gt; Was it a helpful hint?</p>
      <p>That does help anwering the initial question, namely what to do when a text that does not want to display. I did not tell you but the text that may not want to display is <a href="http://www.iro.umontreal.ca/~boyer/typophile/morfix.txt" title="http://www.iro.umontreal.ca/~boyer/typophile/morfix.txt">http://www.iro.umontreal.ca/~boyer/typophile/morfix.txt</a>. It is a text file. As soon as you can manage to display its content, you can usually copy and paste as you did.</p>
      <p>The problem is thus finding a first way to display. One way is to use <code>recode</code> and produce a utf-8 encoded replacement. Another way is to use TextEdit on the macintosh because TextEdit accepts ISO-8859-8 encoded text inputs (and can write utf-8 files). Another way is to add a few lines on top and bottom of morfix.txt to transform it into an html file, and specify that the charset is windows-1255. That is exactly how I produced the link morfix.html.</p>
      <p>There may be other tricks to display. Of course, you could use yourself Notepad++ to transform the .txt file into the html file the way I did and then use some browser and finally copy/paste. It however seems that Notepad++ still cannot do what TextEdit does, i.e. do it directly. That is what I wanted to know. Thanks.</p>
