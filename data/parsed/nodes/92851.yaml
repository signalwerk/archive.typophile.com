      <p>Part of the &amp;, reminds me <a class="freelinking external" href="http://www.myfonts.com/fonts/type-together/bree/" rel="nofollow">Bree</a>. So, by combining the ampersand from Alright Sans (suggested by DPape) and Bree, you could get pretty close.</p>
      <p>Edit: having a look to the video on <a class="freelinking external" href="http://www.behance.net/gallery/O-Co/1067937" rel="nofollow">this page</a> could confirm that it is Bree as the type used on the business cards looks like it to me. The ampersand could also come from <a class="freelinking external" href="http://www.myfonts.com/fonts/type-together/adelle/" rel="nofollow">Adelle</a> from the same type foundry (Type-Together), just need a little tweaking (mainly removing serifs and reworking finals).</p>
