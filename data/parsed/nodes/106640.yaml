    <p><img src="/sites/default/files/old-images/57f569e47828788958dd50dabd3d7cec_4114.jpg"></p>
    <p>I noticed this rounded geometric sans in a Behance gallery. Single-story "a" and "g", with unusual slab and monospace-like "i" and "l".<br>
    There are three more posters using it here: <a href="http://images.cdn.bigcartel.com/bigcartel/product_images/123834672/max_h-1000+max_w-1000/01.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">1</a> <a href="http://images.cdn.bigcartel.com/bigcartel/product_images/123834687/max_h-1000+max_w-1000/01.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">2</a> <a href="http://images.cdn.bigcartel.com/bigcartel/product_images/123834705/max_h-1000+max_w-1000/01.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">3</a>, where you can find other critical letters such as "y", "M", "J" etc.</p>
    <p>Any ideas?</p>
