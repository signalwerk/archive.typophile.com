    <div class="node-spam-content"><p></p><div class="imageWrap"><img src="http://typophile.com/files/57f569e47828788958dd50dabd3d7cec_4114.jpg"></div><p></p>
    <p>I noticed this rounded geometric sans in a Behance gallery. Single-story "a" and "g", with unusual slab and monospace-like "i" and "l".<br>
    There are three more posters using it here: <a class="freelinking external" href="http://images.cdn.bigcartel.com/bigcartel/product_images/123834672/max_h-1000+max_w-1000/01.jpg" rel="nofollow">1</a> <a class="freelinking external" href="http://images.cdn.bigcartel.com/bigcartel/product_images/123834687/max_h-1000+max_w-1000/01.jpg" rel="nofollow">2</a> <a class="freelinking external" href="http://images.cdn.bigcartel.com/bigcartel/product_images/123834705/max_h-1000+max_w-1000/01.jpg" rel="nofollow">3</a>, where you can find other critical letters such as "y", "M", "J" etc.</p>
    <p>Any ideas?</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Optimo Hermes        </div>
            </div>
    </div>
