  html: |-
    <p>Dear friends,</p>
    <p>We are pleased to announce the opening of our website at <a class="freelinking external" href="http://www.boldmonday.com" rel="nofollow">http://www.boldmonday.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/boldmonday_home_1_small_6104.jpg"></div><p></p>
    <p>Our website presents the Bold Monday collection of retail fonts – they can be seen, tested and purchased directly – together with an overview of our work on custom fonts.</p>
    <p>To celebrate the launch a special promotional package is now on offer for a great price. The “Bold Monday Sampler” includes 13 carefully selected fonts from various families such as Pinup, Flex, Panno, Feisar Express and Nitti Typewriter. It is the perfect introduction to the Bold Monday collection and can be bought for 149.00 Euros. More info: <a class="freelinking external" href="http://www.boldmonday.com/en/boldmondaysampler" rel="nofollow">http://www.boldmonday.com/en/boldmondaysampler</a></p>
    <p>Best wishes for 2010,</p>
    <p>Paul van der Laan &amp; Pieter van Rosmalen</p>
