    html: |-
      <p>the characteristics are difficult to define at such a size, such as the top serif on the <strong>A</strong>... that's the most unique one i see. a scan at a higher resolution will help.</p>
      <p>having the high x-height to cap-height ratio that it does,<br>
      i suggest Caxton (<a href="http://new.myfonts.com/fonts/letraset/caxton/" title="http://new.myfonts.com/fonts/letraset/caxton/">http://new.myfonts.com/fonts/letraset/caxton/</a>)<br>
      but check out these others too:<br>
      Diaconia Old Style (<a href="http://new.myfonts.com/fonts/bergsland/diaconia-old-style/" title="http://new.myfonts.com/fonts/bergsland/diaconia-old-style/">http://new.myfonts.com/fonts/bergsland/diaconia-old-style/</a>)<br>
      Williams Caslon <a href="http://new.myfonts.com/fonts/fontbureau/williams-caslon-text/" title="http://new.myfonts.com/fonts/fontbureau/williams-caslon-text/">http://new.myfonts.com/fonts/fontbureau/williams-caslon-text/</a></p>
      <p>my initial guess was a version of Caslon, but look at your font's bowl of the <strong>B</strong> and x-height of the <strong>b</strong> and <strong>d</strong>. also, i can't tell if the bar of the <strong>t</strong> is at a tilt or not.</p>
