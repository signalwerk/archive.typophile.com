    html: <p>The top (and bottom one--looks like you backslanted it to make it upright) is almost certainly <b>not</b> a font, but a custom design just for the logo.  <br> <br>The middle one may have started out as a font, but has been heavily redrawn for the distorted effect. In this case, it's not done very well, so I would guess that this is not the original, but someone's attempt to redo it in Illustrator or something.  <br> <br>By the way, there are no fonts that do that distortion thing on their own. There are filters for Illustrator and other programs that can do that effect, but to get it to look right, you have to do a lot of tweaking.</p>
    html_clean: <p>The top (and bottom one--looks like you backslanted it to make it upright) is almost certainly <b>not</b> a font, but a custom design just for the logo.  <br> <br>The middle one may have started out as a font, but has been heavily redrawn for the distorted effect. In this case, it's not done very well, so I would guess that this is not the original, but someone's attempt to redo it in Illustrator or something.  <br> <br>By the way, there are no fonts that do that distortion thing on their own. There are filters for Illustrator and other programs that can do that effect, but to get it to look right, you have to do a lot of tweaking.</p>
