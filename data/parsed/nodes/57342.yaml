      <p>I don’t know all the formal uses of the period centered — sometimes, in English, it is used as a bullet. There s another “centered period” in the mathematicl codepoint region that signifies multiplication in math, and conjunction in some notational systems of formal logic. That one should likely be a bit bigger than a full stop. If there is only one “technical” centered period codepoint (I don’t remember), positon is an issue. Usually numbers (for math) are lining. But in logic, expressions typically use lower-case alphas. Guess I’d go with the numbers.</p>
      <p>I don’t know of a formal use of U+00B7. It does show up sometimes in linguistic constructions. It is also frequently used when the bullet character in the font is too big, &amp; it is easier for the comp to slighly enlarge periodcenterd than to reduce the bullet.</p>
      <p>Which gets us to the limits of responsibility of the font designer. You will not be able to please everybody. Text is different than display. When I was learning the trade, a 2-point bullet at text size (call that 10-point type) was considered about right. That means, if you measure the “black” of the bullet, it is 2 points, 0r 200/1000 em. That may have changed in our new, brave world where branding is everything. Most bullets in the font were far larger. If you set them at a smaller size, you had to also raise them up. Same with a period centered that was to small — except setting them in a larger size meant you had to move them down.</p>
      <p>You should have at least one bullet character that is a round bullet. If not, sure as shooting some editor, graphic designer, author (client) will object. If your want your design of the bullet to be standard, allow switching to the round bullet via a stylistic set.</p>
      <p>Usually, a bullet is used with the following word beginning with a cap, but not always.</p>
      <p>Sidebearings are also up in the air. The usual list structure is “flush &amp; hang,” &amp; I, anyway, use tabs. Too large a sidebearing get in the way of the “flush.” The space on the right is controlled by the tab. But there are cases where a sort of paragraph style is used with a bullet, so some space is needed. I’d say about 100 units. If the comp wants more, they can insert a thin space.</p>
      <p>In short, give the comp something to work with, and down’t worry overmuch.</p>
      <p>FWIW</p>
