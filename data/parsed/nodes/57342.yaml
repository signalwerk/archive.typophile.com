      <p></p><div class="imageWrap"><img src="/files/Rebellion_5012.jpg"></div><p></p>
      <p>This concerns the “ldot” character used in Catalan to indicate that both “l”s of a double “l” sequence are pronounced separately.<br>
      Above is the word rendered using two “l”s and periodcentred, below as “ldot” followed by “l”.</p>
      <p>The rendering should be identical, and the dot should be tittle-sized and just about halfway up the “l”.</p>
