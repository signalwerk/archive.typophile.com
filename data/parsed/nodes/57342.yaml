      <ul>
      <li>I generally align the bullet with the em and en dash, slightly above the vertical centre of lower case “o”, as in Georgia.</li>
      <li>The reason being that bullets are generally used with lists that are set upper and lower case.</li>
      </ul>
      <ul>
      <li>In that situation, the reader sees lines of text with the dominant vertical position being the centre of the x-height.</li>
      <li>As the bullets “initialize” these lines of text, it makes sense to have them aligned accordingly.</li>
      </ul>
