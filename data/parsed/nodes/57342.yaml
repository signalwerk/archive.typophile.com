    <p>I’m trying to figure out my dots and bullets :S</p>
    <p>I’ve found the <a class="freelinking-external" href="http://www.microsoft.com/typography/developers/fdsspec/punc.htm">Character Design Standards</a> and the <a class="freelinking-external" href="http://www.decodeunicode.org/">Decode Unicode</a> fairly helpful but am still a bit confused and not sure if I’ve done things right.</p>
    <p>I have periodcentered (U+00B7) and hyphenationpoint (U+2027) the same. It’s a full stop (period) centred on the x-height, whilst bulletoperator (U+2219) is the same but centred on the figure height. Is this conventional?</p>
    <p>The advance width is the same as full stop (period), but perhaps they should be set on an en-space?</p>
    <p>My bullet is a larger rounded rectangle centred on the cap height...should this be just a circle or is it ok to have it stylistically harmonising with the overall shape of the font? Actually my numerals are the same height as caps in this font.</p>
    <p>And which of these should I gpos using the case feature for cap alignment? All of them?</p>
    <p>Thanks very much in advance :)</p>
