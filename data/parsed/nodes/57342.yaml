      <p>Odd yes, let me check...looks like somehow the bulletoperator had slipped down 3 units and the rasterisation is totally different. Thanks for spotting :) I’ve fixed it now. The sidebearings are less than periodcentered (70 units vs 85). The actual blob is identical. There’s also U+2023 which is a triangular bullet a similar optical size to the square one above. Hope I’m also right in using periodcentered (nudged up slightly) for Ldot and ldot.</p>
