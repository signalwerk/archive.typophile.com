      <p>This is the 19th century "Egyptian" by Figgins. There are a number of digital restorations.  David Berlow's _Giza_ sold by Font Bureau, <a href="http://www.myfonts.com/fonts/fontbureau/giza/" title="http://www.myfonts.com/fonts/fontbureau/giza/">http://www.myfonts.com/fonts/fontbureau/giza/</a>,<br>
      has 16 variations including some that would work as a match for Green Ridge Ranches.<br>
      Don</p>
