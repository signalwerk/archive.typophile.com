    html: |-
      <p>Since the publication dates from 1954, we are dealing with metal type here (phototypesetting was just beginning to take off in that year).</p>
      <p>|YVES| appears to be Sorbonne Medium:<br>
      <a href="http://www.myfonts.com/fonts/berthold/sorbonne-bq/" title="http://www.myfonts.com/fonts/berthold/sorbonne-bq/">http://www.myfonts.com/fonts/berthold/sorbonne-bq/</a></p>
      <p>|PEINTURES| is a variation on Didot, but I haven’t located a spot-on match. Didot Headline Bold may work:<br>
      <a href="http://www.myfonts.com/fonts/canadatype/didot-headline/" title="http://www.myfonts.com/fonts/canadatype/didot-headline/">http://www.myfonts.com/fonts/canadatype/didot-headline/</a></p>
      <p>|10 PLANCHES EN COULEURS| could be recreated using something like Titano B:<br>
      <a href="http://www.studiodilena.com/it/titano.html" title="http://www.studiodilena.com/it/titano.html">http://www.studiodilena.com/it/titano.html</a></p>
