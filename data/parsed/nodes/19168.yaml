    <p>Hi everyone</p>
    <p>I’m redesigning a masthead for the excitingly titled PCAuthority magazine. Currently set in Champion (all caps, bold condensed). I’m looking at Meta, as it’s got a lot more personality, just thought I’d see if anyone had any other suggestions. Bearing in mind the number of characters it has to be slightly condensed.</p>
    <p>Thanks all</p>
