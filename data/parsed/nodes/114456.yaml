    html: |-
      <p>Also note that "logotype" could mean multiple (not just two) letters cast as one sort, not for aesthetic reasons, but to speed up composition. See my first post here: <a href="http://typophile.com/node/19376?page=1" title="http://typophile.com/node/19376?page=1">http://typophile.com/node/19376?page=1</a></p>
