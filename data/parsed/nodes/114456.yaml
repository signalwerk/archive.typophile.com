    html: <p>Wouldn't a letter pair which doesn't touch be considered either a digraph or a contextual ligature these days?</p>
  - id: 573305
    user_id: 5094
    user_name: charles ellertson
    user_path: null
    date_raw: 10 Mar 2014 — 11:04am
    date: 2014-03-10T11:04:00
    votes: null
    html: |-
      <p>No to both. </p>
      <p>A contextual ligature would be a ligature used only in certain situations -- effectively, when following or preceding certain other letters. I suppose the context could be size -- use to be, you didn't use the f-ligatures above about 14-point. Anyway, nothing to say about whether or not the letterforms touch.</p>
      <p>From Wiktipedia:</p>
      <blockquote><p>A digraph or digram is a pair of characters used to write one phoneme or a sequence of phonemes that does not correspond to the normal values of the two characters combined<br>
      </p><blockquote>
      </blockquote><p></p></blockquote>
