    date: 2014-03-10T11:31:00
    votes: null
    html: |-
      <p>I meant either a digraph or a contextual ligature, not both. I can see now that contextual ligatures are too specific and don't really have any relevance here. Still, I would like to clarify that I was thinking of contextual ligatures for improved spacing, not these elaborate ligatures you find in script fonts.</p>
      <p>I don't think I'm necessarily wrong about the digraph though. I know what it is, but usually it's a letter pair which doesn't touch. It's certainly not encompassing as I initially foolishly alluded to, but it's one of the things a letter pair can be without being a ligature.</p>
  - id: 573455
    user_id: 909
    user_name: Thomas Phinney
    user_path: null
    date_raw: 11 Mar 2014 — 5:03pm
    date: 2014-03-11T17:03:00
    votes: null
    html: <p>I'm not so sure, Martin. My understanding is that a digraph is a linguistic thing first, and a typographic thing second. It exists regardless of whether it gets special typographic treatment, and when it does get special typographic treatment, that isn't usually modifying one or more of two separate glyphs.</p>
  - id: 573460
    user_id: 5094
    user_name: charles ellertson
    user_path: null
    date_raw: 11 Mar 2014 — 8:38pm
    date: 2014-03-11T20:38:00
    votes: null
    html: |-
      <p>As long as you want to get technical about it, contextual ligatures (clig) are a GPOS lookup type 8, as opposed to the more common GPOS lookup type 4, used in ligatures (liga). (Maybe that's the "better definitions in the context of type" hhp meant? Hard to say -- often snide, rarely helpful, that hhp...)</p>
      <p>In any case, "touching" or "joining" has nothing to do with the difference.</p>
      <p><a href="https://www.microsoft.com/typography/otspec/features_ae.htm#clig" title="https://www.microsoft.com/typography/otspec/features_ae.htm#clig">https://www.microsoft.com/typography/otspec/features_ae.htm#clig</a></p>
      <p>BTW -- Check the order of processing if you use cligs...</p>
      <p><a href="http://partners.adobe.com/public/developer/opentype/index_table_formats1.html" title="http://partners.adobe.com/public/developer/opentype/index_table_formats1.html">http://partners.adobe.com/public/developer/opentype/index_table_formats1...</a></p>
