    date: 2014-02-25T07:20:00
    votes: null
    html: <p>Unless sizing, tracking, or H&amp;J are important to the typography, the difference between logos and ligatures is not. In the red zone however, if all three of those things are playing on glyph selection at once, something's going to want to know the difference, trust me.</p>
