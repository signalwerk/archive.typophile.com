  date: 2014-02-24T13:09:00
  votes: null
  html: <p>I'm wondering if technically speaking a ligature must be two letters that are joined together, or, can you have a ligature in which there are 2 letters designed to work together but don't actually join?</p>
comments:
  - id: 572161
    user_id: 41133
    user_name: PublishingMojo
    user_path: null
    date_raw: 24 Feb 2014 — 1:32pm
    date: 2014-02-24T13:32:00
    votes: null
    html: <p>If the two letterforms are coded as one character, it's a ligature whether they visually touch or not, just as the original ligatures were two letters cast on one piece of metal. If they're alternate forms of single letters designed to fit together (e.g., a lowercase <strong>i</strong> with no dot, intended to form a kerning pair after a lowercase <strong>f</strong> or a capital <strong>T</strong>), they're not ligatures, technically speaking.</p>
