      <p>Technically speaking:<br>
      <a href="http://www.microsoft.com/typography/otspec/features_ko.htm" title="http://www.microsoft.com/typography/otspec/features_ko.htm">http://www.microsoft.com/typography/otspec/features_ko.htm</a></p>
  - id: 572201
    user_id: 5094
    user_name: charles ellertson
    user_path: null
    date_raw: 24 Feb 2014 — 9:08pm
    date: 2014-02-24T21:08:00
    votes: null
    html: |-
      <p>The word has been used in both contexts. Some called two letters cast together, that did not touch, a logotype, and reserved "ligature" for  letter pairs that did touch. For example,  Vo, Wo, To etc. were special sorts on the Linotype lincecaster, where kerning was not possible. Some people termed these "logotyopes," not ligatures, in distinction to fi, fl, etc.  -- Adrian Wilson was one, IIRC. However, as advertising took on greater and greater significance in the world of type, company logos also became known as "logotypes."</p>
      <p>As with so many things, the use of this term seems to have undergone a change, and most of us today would be comfortable with "ligature" even when the components did not touch. Use the terms as you prefer.</p>
