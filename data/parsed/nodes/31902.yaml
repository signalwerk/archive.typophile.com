    <p>The BBC reports the same graphics driver and wireless card issues. So beware.</p>
    <p>I somewhat agree but i have solved my Alienware graphics driver issue myself (no f’n help from Nvidia or Alienware). I found a webiste that let’s me download a .ini file that let’s the updated Nvidia Vista graphics driver recognize my graphics card and install. </p>
    <p>full story:<br>
    <a href="http://vinceconnare.wordpress.com" title="http://vinceconnare.wordpress.com">http://vinceconnare.wordpress.com</a></p>
    <p>Upgrade if you dare. It is good fun though.</p>
