    <p>After lunch I entered an office which a bunch of my colleagues were in. They were in the process of watching a video of two giant squishy letters “getting it on”. If you go to this link and click videos and then choose Diversity I believe there is a clip. I couldn’t watch it because it doesn’t work on Macintosh.</p>
    <p><a href="http://www.mtv2.com/#wondershowzen" title="http://www.mtv2.com/#wondershowzen">http://www.mtv2.com/#wondershowzen</a></p>
    <p>It is an interesting office I work in…</p>
    <p>peace</p>
