    <p>I’ve heard somewhere that HDMX table in TTF fonts has some new functions (besides containing records about non linear glyphs widths). Does it mean that even if hinting  didn’t touch any sidebearings (e.g. cleartype hinting), it is recommended that font should include HDMX table?</p>
    <p>So if hinting moves some of the right sidebearings ( e.g. in B/W hinting) and I will not generate HDMX table, this font will not work correctly? Or is it that, the font WILL work correctly ( concerning spacing ) but will be slower, because it will need to recalculate all moved sidebearings?</p>
    <p>Thanks for your time, peter</p>
