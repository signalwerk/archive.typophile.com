      <p>Mike, it was an informal chat with people who work professionally with hinting, and they said that they ALWAYS use HDMX table, even when they do not modify the sidebearing, because it  has some other functions. Sorry i don’t know anything more, I’ve searched for it, found nothing, and that’s why I am asking here. But if you say that you don’t know about any changes, or reasons to use it when the sidebearings are not modified, that would also answer my question.</p>
