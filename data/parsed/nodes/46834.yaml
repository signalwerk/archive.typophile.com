    html: |-
      <p>You've got at least two typefaces here, and I don't either one is Century.</p>
      <p>"Review" looks like a Scotch or Transitional face. Caledonia would have been an option in '66; Miller (from Font Bureau) is a modern interpretation.</p>
      <p>The small roman type (along with the numbers and small caps) looks like a version of Baskerville. Not sure about the italics, though.</p>
