      <p>"Review" might be a display weight of Baskerville with a curvy 'R'. Not sure if this exists, but "eview" looks Baskervillesque.</p>
      <p>I think the italic might be Monotype Garamond Bold Italic.</p>
      <p> - Lex</p>
