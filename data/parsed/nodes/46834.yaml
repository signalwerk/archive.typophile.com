      <p>"Review" looks like Bulmer to me. It seems too bold, but that may be because it was enlarged from a smaller size.</p>
      <p>The italic at the bottom is Ludlow Garamond Bold Italic. <a href="http://fontbureau.com/fonts/GaramondFB" rel="nofollow">Garamond FB</a> was based on it.</p>
      <p>The rest appears to be Baskerville.</p>
