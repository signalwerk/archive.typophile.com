    <p>Is a two-part question OK ?</p>
    <p>This is from a '66 literary quarterly. Looks like some kind of Century (Expanded), but none of the digital versions I've seen capture it very well at all. Any certainty, corrections, or suggestions for something similar? (Also open to very elegant modern versions of a typeface of this character.)</p>
    <p>Thanks !</p>
