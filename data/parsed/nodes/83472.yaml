    <p>Hi all-</p>
    <p>It's been a while! I hope someone can shed some light on this little doozy.</p>
    <p>This type is seen on a prop edition of "The Tales of Beedle the Bard", used in the first part of the movie "Harry Potter and the Deathly Hallows".</p>
    <p>I've exhausted all the usual lines of enquiry, and found this particularly hard to classify: there are similar examples referred to variously as "Slavic", "Anglo-Saxon", "Runic", "Medieval", "Decorative", and even "Blackletter".</p>
    <p>It may be that this is an entirely custom job, but judging from the second of the images below, the proportions and kerning appear to be lacking polish which leads me to wonder whether it might even be a freebie.</p>
    <p>Thanks as always for your input.</p>
    <p>-Nick</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/beedle1_3656.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/beedle2_4840.jpg"></div><p></p>
