      <p>&gt;Have I proved my point?</p>
      <p>Given how unsuited Eunoia is to text--you said you designed it to shimmer and sparkle--you have moved it astonishingly far toward text. But as I said in the original thread, whether it succeeds as a text font depends on what you mean by 'text font.' </p>
      <p>If by a text font you mean a font that can be read in masses of text, such as in a book or long magazine article, my answer would be, no, you have not proved your point. Now I don't think any of your comparitor fonts are 'text' fonts by this standard, either. They are suitable for a few paragraphs at most in an ad or report, in my opinion. But even by comparison with those three, your Eunoia--which will be admiradably eye catching for display--still has too much shimmer compared to the other fonts, a quality I think is undesirable in a text font. </p>
      <p>On the issue of the role of science, I don't get what the argument is about. I think the reality is that science hasn't yet penetrated to the reading process to the point to give good advice type designers. Maybe Kevin Larson will discover new facts about spacing that will help type designers. If so great; I think designers would be foolish to ignore these facts, if they are relevant to the design brief they are undertaking.</p>
