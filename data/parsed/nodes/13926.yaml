    html: <p>Some of the better reading I have had here in a while. I love a good are vs. science debate. In these materials x-height, character count, letter-spacing and hyphenation are confounded. It is not possible to determine "legibility" until first define what that means, select dependent variables, generate a testable hypothesis, develop additional materials, select a sample population and generate a balanced experimental design.</p>
