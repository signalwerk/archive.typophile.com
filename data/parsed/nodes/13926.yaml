      <p>&gt;do you or or don’t you mean ‘scientific’ experiementation?</p>
      <p>First, I'm stating that design involves experimentation.<br>
      In the designer's studio, I'll design glyphs and see which kind work best in a sample piece of text, refine the design, and so on. Then also in the typographic culture at large, because that's where the success, dare one say readability, of typefaces is determined, by whether new designs are bought and used. The knowledge type designers acquire by carrying out their work is derived from studio and marketplace experiments with typefaces. Not scientific, but practical.</p>
      <p>Compare this with biometric experiments to develop theories on how people read.<br>
      If these are to be connected with the goal of making better fonts (faster, according to the Larson standard), then why not design fonts to test specific aspects of the reading process? Research and development. Unless type design is integrated into readability experiments, they will have little practical use for making more ergonomic types.</p>
      <p>Claude Hopkins invented "Scientific Advertising" in the 1920s, with split-run direct mailing, to determine which techniques were most effective.</p>
