      <p>I find that much of the technique is the same. It's not just a question of strengthening stems and enlarging counters -- that's a legibility rquirement, to enable the details to have sufficient presence. Rather, it's a question of making the letters combine to create a texture appropriate to their size, and hence maximize the efficiency of the reading process.</p>
