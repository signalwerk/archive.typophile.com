      <p><em>I’m not clear on what exactly is at stake in the issue between science v.s. experience in the case of which typefaces are most comfortable to read.</em></p>
      <p>Comfort is only one of the criteria by which readability can be judged, and yes, it is the most subjective, although one shouldn't assume that there is nothing to be measured or that preference necessarily corresponds to measurable aspects of comfort, e.g. eye-strain. The other major criteria are reading speed and reading accuracy. There is inevitably an inverse relationship between these two: as speed increases, accuracy typically drops. At some point, an increase speed in forward saccades is lost because of the number of regressions caused by misreadings. When Hrant talks about improved readability, I think what he is referring to is increased speed without loss of accuracy. So let's assume a base level of accuracy: Hrant wants to know how to maintain that while increasing the reading speed. If that is your goal, then taking an interest in the mechanics of reading makes a lot of sense.</p>
    html_clean: |-
      <p><em>I’m not clear on what exactly is at stake in the issue between science v.s. experience in the case of which typefaces are most comfortable to read.</em></p>
