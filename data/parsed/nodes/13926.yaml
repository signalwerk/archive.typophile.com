      <p>I suspect that you and Hrant are talking past each other a bit. It seems to me that what you have done is to make a version of Eunoia that stands up to being used at bodytext <em>sizes</em>, and this is, as you say, a practical matter involving tried and true design adjustments that require no theoretical basis or justification. Stems need to be strengthened, counters need to be enlarged, etc. and these are practical procedures that would be applied to any display face in order to make it function at small sizes. But I really don't think this is what Hrant is talking about, because there is a significant difference between making a typeface function at small sizes and making a typeface that is comfortable to read for extended text, which is what we typically mean by readability.</p>
      <p>Now, this is not to say that I agree with Hrant that text face design should proceed <em>from</em> theoretical and/or empirical understanding of the reading process (see the recent Noordzij thread). Although I am quite interested in how it can proceed <em>to</em> that understanding. There are plenty of practical ways in which to begin the design process, including looking closely at typefaces that one enjoys reading and figuring out what contributes to that experience.</p>
