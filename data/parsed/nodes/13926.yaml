      <p>The design of the ClearType font collection and the research that the MS  Advanced Reading Technologies team has been doing on screen readability are better seen as parallel developments: the briefing to the designers was primarily concerned with the the rendering technology, not with the study of the impact of that technology on screen reading speed and accuracy. The research that had been done up to that date had been concerned with testing whether there was a measurable improvement in readability with ClearType as opposed to traditional greyscale antialiasing or b/w bitmaps. That research didn't attempt to arrive at design recommendations, but it did provide the justification for designing new types that would take advantage of the benefits of ClearType (x-direction resolution enhancement) while compensating as much as possible for the device-imposed limitations (no antialiasing in the y-direction at text sizes). Testing during the design process involved seeing how the shapes were rendered on screen at different sizes in ClearType environments, and trying to improve that rendering. I'm not sure that I would characterise anything in the design of Constantia as being 'contrary to established wisdom', but I definitely made a lot of design decisions that I would not have made if I had been designing solely for print media. But, again, this was in response to the particular target rendering circumstances, not in response to readability studies per se.</p>
      <p>There is a new line of study being followed by MS, partly as a result of the legibility forum at last year's conference Thessaloniki, which is concerned with testing specific 'received wisdom'. Kevin Larson has been conducting tests on spacing, measuring the impact of looser or tighter letterspacing on reading accuracy. This is the sort of work that may challenge traditional practices.</p>
      <p>The question -- which Mary Dyson put to the assembled type designers in Thessaloniki -- is whether we would actually do anything different if empirical evidence ran contrary to our beliefs and practices. Hrant's repeated response to any evidence that is contrary to what he believes is to find reasons to dismiss that evidence. This is a good impulse so long as it is honestly applied, and not only to evidence that is inconvenient but to all the evidence, empirical and anecdotal.</p>
      <p>My theory that readerability is the dominant factor in reading is based on my experience designing for multiple writing systems. The variety of human writing systems in use -- variety not only of form and style (design), which also exists within individual writing systems, but also variety of phonemic system, direction, layout -- and the proficiency with which they are <em>all</em> read on a daily basis, strongly suggests that the impact of design, once a base level of legibility had been achieved, is minimal. This is not to say that design in of no importance to readability, but that its importance is particular rather than general; it is important, for instance, to specific circumstances of reproduction, e.g. resolution, print conditions, etc.</p>
