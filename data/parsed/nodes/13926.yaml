      <p>I'm not clear on what exactly is at stake in the issue between science v.s. experience in the case of which typefaces are most comfortable to read. If it is a case of having physical descriptions of how the eye moves about while reading, etc., I don't really see how this will help. I say this because it seems to me that which typefaces are most readable is discoverable via preference determination. In other words since we want typefaces that are most comfortable to read, and comfort pertains to subjective response, it seems most pracical to just ask readers which they prefer. And since type has evolved over time at least in part in response to reader preferences, I don't see how lab research provides an edge over the "wisdom" garnered over the years. Readability may have objective and observable entailments, but what seems to be most relevant is the subjective preference of the reader and not the accounts we provide of those preferences. </p>
      <p>If I prefer to read Type X over Type Y, then this you can find out by asking me. You don't need to quantify electro-chemical responses in the brain or nervous system to figure this out. Even if you could what more would you discover other than some other description telling you exactly what I just told you? Is it a question of <em>why</em>, in EM terminology? For example, "John-Paul prefers to read Caslon over Meta because the serifs allow his brain to process word shapes 4% faster in the former." How would you know this except by asking me and timing my responses? It's not like you can measure the time between photons impinging on the retinas and the comprehension of the word meaning by following the neural impulses (although that would be cool). You'd take what you could measure (eye movements and the like) and combine that with my accounts of subjective responses and develop a theory out of that. But all you'd be doing, really, is accounting for preferences in a very roundabout way.</p>
      <p>Basically what I'm saying is that even if there are fixed physical characteristics which act as constraints upon preferences toward particular qualities in font design, what's at stake seems to be the preferences themselves and not whatever theories we happen to develop to account for those preferences. The best way to determine those preference is just to ask readers which they prefer. Personally I prefer Comic sans printed in bright green on yellow paper. (Actually if I ever saw that I'd probably try to kill myself.)</p>
