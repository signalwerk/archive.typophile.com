      <p>I remember Evert Bloemsma leading a discussion in our typography-class at the academy, about legibility. He seemed to be an advocate for legibility as a function of typedesign and environment (paper, printing conditions, lighting, etc.).</p>
      <p>I think that in the end this a nature-nurture like discussion. </p>
      <p>Scientific understanding almost dictates that there should be geometrical properties of type that enhance legibility (i.e. speed up perception, in the same way a symmetrical form takes less time to perceive and recognize than an assymmetrical one. A friend of mine just finished his thesis on this subject, proving that symmetry and repetition are perceived using less 'processing power'). </p>
      <p>On the other hand, there is Evert's point. Reading is not a one dimensional process. Environment does play a crucial part. Rather like genes - the most well adapted genotype can still fail miserably in a hostile environment.</p>
      <p>This places the typographer somewhere in the middle between hard facts and soft knowledge. I see both ends as mere viewpoints. Looking through science I understand and learn. Following Evert I understand an learn.</p>
      <p>----------------------------------------------------<br>
      My work is a game. A very serious game [M.C. Escher]</p>
