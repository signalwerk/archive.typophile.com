      <p>What can be measured? A big question, right?<br>
      Proportion of thick to thin, rate of change from thick to thin, average width of the letters, average descender length, the list goes on for miles. "Design is relationships", and if you want to measure readability it's a matter of figuring out which relationships are most important. With art in general, it usually means contrast, color, texture, balance - all of which apply to type. </p>
      <p>But you do have to consider that type is becoming more "personal." With more people learning about type, they are starting to have predisposed tendencies. This would affect, and have to be considered, in any emperical study of readability to have a true bearing with today's readers.</p>
      <p>Therefore, to say that one typeface is the most legible because of certain  characteristics.. well.. you might just be getting a Kinkade.</p>
      <p>So maybe we should say readability potential? This implies that even if someone has certain predispositions, the typeface itself has more potential for better readability, if one were to "stick with" reading it.</p>
      <p>As for Eunoia specifically, even in basic analysis, "glyph recognition time" is out the window. But at least it isn't.. well.. a font of light.</p>
