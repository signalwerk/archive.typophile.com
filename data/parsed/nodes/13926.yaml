    <p>About a year ago in a Typophile thread, in response to Hrant's advocacy for a science-based, theoretically-driven approach to legibility, I argued that legibility was a practical matter really, and that any typeface could be turned into a text type, without benefit of science or theory. He suggested I try my own Eunoia.</p>
    <p>Sorry for the delay. It hasn't taken that long to do, just finding the time and motivation has delayed it.</p>
    <p><a href="http://www.shinntype.com/Eunoia_Text.pdf" rel="nofollow">Here</a> is a pdf comparing Eunoia Text with Eunoia, Helvetica Medium Condensed, Univers 57, and ITC Franklin Gothic Book Condensed.</p>
    <p>I've shown the face 8/9 justified, in a newspaper column format. I don't think this is a book face, as Hrant would probably prefer, but the challenge was to make a text face, and the news setting is a good test of that, and certainly qualifies as immersive reading.</p>
    <p>I could have taken it further, but that would have departed from the type design, which is necessarily high contrast and condensed. </p>
    <p>I would have liked to have shown it compared with faces that also have this quality, such as Britannic or Ocean, but I don't have anything like that.</p>
    <p>Have I proved my point?</p>
