      <p><em>you are are saying doing a superb job with these ( &amp; maybe even with notan ) can offer very marginal additional benefit in readability beyond that which exists in designs we have already got.</em></p>
      <p>Yes, that is a good summary of my position. Note, however, that I see this as a starting position, not as a concluding position. It defines the functional foundation of readability on which rest the other aspects of type design, such as those you enumerate and also, of course, the cultural and aesthetic aspects. I've often been at odds with Hrant when he has seemed to suggest that readability is a difficult to achieve goal; I think of it as a prerequisite: one that is reasonably easy for an experienced type designer to achieve, thanks to readerability. Readerability is really what makes the immense richness of typography possible; if reading were difficult and required the designer's attention to be completely focused on maximising readability, there would probably only be two or three type designs that met the narrow criteria.</p>
