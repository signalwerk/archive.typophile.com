      <p><em>Any idea what lies out there in the great beyond - that is beyond the starting point? Any guesses?</em></p>
      <p>How about most of the history of type design? It seems to me that consciously or otherwise, the majority of type design has accepted the reality of readerability, and has legitimately focused on the cultural and aesthetic aspects of typography. Every once in a while in that history, usually in response to changes in media, the basic question of readability resurfaces and is reconsidered <em>in the particular circumstances.</em> What this tells us is that readability is an issue of particularity, and is generally taken for granted. Quite simply, the cultural and aesthetic aspects of e.g. Bodoni's types are more important than their relative readability compared to, say, Caslon's types, because readerability can handle them <em>well enough.</em> We can object that these romantic types are not easy to read, even in measurable terms, but the fact remains that entire generations of Italian and French readers read almost nothing else, and they read a lot and they wrote a lot, and they painted a lot, and they composed a lot, and these types formed part of the cultural milieu that inspired them. And that is probably more important than the fact that they cannot be considered optimally readable. So this is what I think lies beyond the prerequisite of readability.</p>
      <p>Now, while readerability allows us to take readability for granted much of the time, we shouldn't always take it for granted, because that would just make us lazy. As alluded to above, developments in new reproduction technologies and media may demand new approaches to type design, and at such times the question of readability should be reviewed. One shouldn't presume that what worked in one medium will work in another, although often one will find that lessons and experience do carry over.</p>
      <p>Also, we shouldn't underestimate the cultural and aesthetic achievements that might result from seriously thinking about readability, achievements that might well be more significant than any measurable improvement in reading speed and accuracy. What benefits type design is the seriousness of the thinking. I think Legato is an excellent example of this.</p>
