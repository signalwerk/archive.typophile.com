      <p><em>Surely, the way to combine reading research with design development would be to test prototype options?</em></p>
      <p>Yes. I think my position is somewhere between yours and Hrant's, but also orthogonal to them and at a distance. As I've said repeatedly, I think the mass of everyday experiential evidence indicates that readerability matters much more to the reading process than the readability of what is read. But I don't think this should be taken as license to ignore empirical study of reading: I think the statement that 'type designers already know what works' is misleading if we think it applies to design. What we know works is readerability, our incredibly sophisticated and adaptive pattern recognition skills. This system is so good that we have to consider the possibility that our type designs succeed <em>despite their design.</em> In design terms, the question is not what works but why it works and, considering that, <em>what else might work.</em></p>
