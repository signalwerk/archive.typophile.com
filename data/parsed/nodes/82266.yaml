    <p>I'm trying to find out something about the font that is used by DYMO label writers.<br>
    Who developed this font and when was it first used in a labelwriter?<br>
    How does a DYMO labelwriter (e.g. DYMO OMEGA) work?<br>
    How many fonts does exist for this technique?</p>
    <p>Hope you could help me!</p>
