    html: <p>When I was about nine years old, I had a toy printing press made by Mattel called a <a href="http://www.samstoybox.com/toys/Linoprinter.html" rel="nofollow">Linoprinter</a> that used embossed tape to set type which you would stick onto plastic printing plates. The letters came out backwards, of course. One of the more interesting uses of embossed tape that I can recall.</p>
