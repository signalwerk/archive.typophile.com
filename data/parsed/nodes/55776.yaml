      <p>It depends on how you define free. In the case of some free downloads of fonts, you are actually just licensing the font without paying the traditional fee. In other words, instead of paying $30 for font X from family Y, you pay $0 for font X from family Y. But in order to download the font, you must still agree to same EULA that you would if you had paid $30 for it.</p>
      <p>There are also other foundries that bundle a free version of another font whenever you make a general purchase. So if you license family Z, foundry A will also give you a license for font X of family Y, both to thank you for being their customer, and also in the hope that you might like to someday license the rest of family Y.</p>
      <p>I don't know about taking out the OT features or the alternates, and then distributing that as an alternate version. I could be convinced of its benefit, but I tend to think that it might be too much work to go through on the distributor side. Would it recoup its cost? In theory, anything that recoups its costs might be worth a business considering.</p>
