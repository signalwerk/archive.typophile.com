      <p>Offering free fonts from a family of other (paid for) fonts is what Jos has done so well. I am sure that the quality of his offering is paramount here: his free fonts are not crippled in any way, they are well crafted and with extensive character sets, and what's more, he gives away the (medium and medium italic) most useful members of the family and charges for the peripheral ones. The other vendors are more likely to give away the least popular cut, say semibold italic.</p>
      <p>I tried a similar approach with one of mine and now can see it around, used in the free fonts, while the sales of the paid fonts are minute. Well, it may just be a dud. That said, it worries me a bit. Apart from all the more or less professional fonts bundled with operating systems or applications, the free fonts available on the net are quite abundant, and some of them are not at all bad. There seems to be a lot of talented people out there who will release a free font just to see it used somewhere. What is the longer-term future of fonts for sale?</p>
    html_clean: |-
