      <p>it's _easy_ to explain:</p>
      <p>if you give something away as a gift,<br>
      without any expectation of anything<br>
      "in return", karma will reward you...</p>
      <p>people who "don't understand karma",<br>
      however, won't grok the explanation...</p>
      <p>the funniest people, out of everyone,<br>
      are those who will "give things away"<br>
      with the _expectation_ that "karma"<br>
      will then immediately "reward" them<br>
      by giving them whatever they wanted.</p>
      <p>as if "karma" were some _machinery_<br>
      that they could _manipulate_ at will...</p>
      <p>the least funniest people are those<br>
      who think "reward" means "money".</p>
      <p>finally, for those who might not be<br>
      able to see how this is _on-topic,_<br>
      the takeaway is that "freemiums"<br>
      _might_ increase your bottom-line<br>
      -- free samples do often "work" --<br>
      but you probably shouldn't confuse<br>
      a manipulative strategy with "karma"<br>
      of the type that jos seemed to enjoy.</p>
      <p>-bowerbird</p>
