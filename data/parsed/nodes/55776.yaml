    <p>At <a href="http://www.typophile.com/node/51198" title="http://www.typophile.com/node/51198">http://www.typophile.com/node/51198</a> Nick Shinn wrote, </p>
    <p>"My philosophy of font marketing (and digital ethics) changed considerably when I read Chris Anderson’s essay on “Free” in Wired, although I haven’t got around to incorporating my new attitude into any marketing plans yet."</p>
    <p>Is anyone else considering changing (or has already changed) their approach to marketing, having seen the commercial success of Jos and others who have demonstrated the 'freemium' model?</p>
    <p>If so, how are you planning to make the 'freemium' version inferior to the 'premium' one? Taking out OpenType features and alternate glyphs? Publish just a single member of a family (as FontFont has been doing for a while)? </p>
    <p>:-)</p>
  html_clean: |-
    <p>At <a href="/node/51198/" title="http://www.typophile.com/node/51198" class="link-kept">http://www.typophile.com/node/51198</a> Nick Shinn wrote, </p>
