      <p>Liz --</p>
      <p>Hey, are you working with <em>Family Fun</em> and the Impress folks over in that round building in Northampton, by any chance? I'm just an hour west of you over here in Berkshire county.</p>
      <p>Here are a few Whitman settings for direct comparison with the Sterling jpgs. The display is set in the Regular weight, with one line of Light at the end for comparison. (There will be seven weights and three widths total in the family.) The retail release should be ready in the next couple weeks, I hope . . .</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WhitmDisplay_5833.gif"></div><p></p>
      <p>There are also a few additions to the text family that are being prepped for retail release. Bold Italic, Semibold and Semibold Italic fonts will soon be available.</p>
      <p>This image shows the three weights.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WhitmText_6470.gif"></div><p></p>
      <p>I pulled these together pretty quickly, so the lo-res rasterization leaves a bit to be desired. If you want to see Whitman in a context more comparable to what you're doing, look for a copy of <em>Brides</em> magazine. They use Whitman for feature text (granted, it can be a little tricky to find amid all the ads and all the Relay sans serif). They also have original versions of some of the Display weights that they use here and there.</p>
      <p>Let me know if I can answer any questions about Whitman to help in your consideration.</p>
      <p>-- K.</p>
