    <p>We are looking for a new font for our consumer parenting magazine. We currently use Spira as our primary serif body font but dislike that it looks too hand-cut and has an overall folksy feeling. What we are looking for is a cleaner and more open font, but still based in classic typography. It is also important for it to have a fairly extensive family and  includes beautiful ligatures.<br>
    We love the look of Sterling, by Hoefler &amp; Frere-Jones in the AIGA Design Archive, but it is unavailable for purchase. Could anyone suggest a similar font? The ones we have found and are considering thus far are Whitman, Miller, and Eason.<br>
    Thanks so much in advance!</p>
