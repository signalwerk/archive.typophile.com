      <p>I love Perpetua but I have to caution you against it if you're using InDesign. The optical and metric kerning pairs are pretty dodgy, especially in the Italic. Since InD doesn't have the kerning tables option (grrrr!) you'd have to go in and tweak the font itself. I just used it for a book and had to do a lot of manual kerning, quite time consuming. </p>
      <p>I have the Adobe Perpetua from 1998 - it's possible the Linotype version is better - unless they're the same. </p>
      <p>Sterling is pretty - it's reminding me of something else - tip of my tongue...<br>
      Whitman's great too.</p>
