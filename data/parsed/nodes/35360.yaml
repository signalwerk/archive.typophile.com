      <p>Scaling is an issue for Perpetua.<br>
      It gets a bit thin at small sizes.<br>
      So it may be worthwhile, if you're after the effect of finesse, to opt for a typeface that has some size-specific variants.<br>
      That gives you more flexibility in your layouts.</p>
