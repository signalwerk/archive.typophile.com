    html: |-
      <p>Joshua, a display version of a font is meant to be used at large sizes, say huge on an album cover, so certain design details are tweaked.</p>
      <p>The specific example in this font is the ink trap in the capital Y in “TRY”. If you look at the sample posted by Norbert you’ll see an extra notch in the “valley” of the Y, which is very obvious at huge sizes, but it helps to sharply define the “valley” at small sizes.</p>
      <p>The Bell Centennial typeface was designed by Matthew Carter for Bell telephone books, and the ink traps help the clarity of the letters under the stresses of high-speed printing and their legibility at tiny sizes.<br>
      <a href="http://www.linotype.com/13687/bellcentennialboldlisting-font.html?PHPSESSID=d0565fba35fbaa2e61d211fa902a0dc0" title="http://www.linotype.com/13687/bellcentennialboldlisting-font.html?PHPSESSID=d0565fba35fbaa2e61d211fa902a0dc0">http://www.linotype.com/13687/bellcentennialboldlisting-font.html?PHPSES...</a></p>
      <p>Some typefaces use the ink trap as a design device. A brilliant example of this is Christian Schwartz’s “Amplitude”.<br>
      <a href="http://fontbureau.com/fonts/Amplitude" title="http://fontbureau.com/fonts/Amplitude">http://fontbureau.com/fonts/Amplitude</a></p>
