    <p>This flowertypeface is a beautiful composed, highly detailed, alphabet complete with numbers and special characters like an ampersand &amp; or @ sign, designed by Novo Typo, designers from Amsterdam, The Netherlands. </p>
    <p><a href="http://www.youworkforthem.com/font/T3189/nt-lily" title="http://www.youworkforthem.com/font/T3189/nt-lily">http://www.youworkforthem.com/font/T3189/nt-lily</a></p>
    <p>NT Lily is a handset typeface collection of 43 images in high resolution RGB on a 26 cm format (height) on 300 dpi (3072 pixels). All images are jpeg or png documents, placed on a seperate layer, on a transparant / background.<br>
    Please notice; NT Lily is not a systemfont.</p><div class="imageWrap"><img src="http://typophile.com/files/T0000_00_5152.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_01_4138.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_02_6124.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_03_5785.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_04_3717.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0000_05_5119.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/typespecimen-LILY_3889.jpg"></div><p></p>
