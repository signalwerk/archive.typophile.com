    html: |-
      <p>The logo lettering dates from the mid 1940s., vut is not identical to the modern logo.<br>
      1946:<br><img src="/sites/default/files/old-images/King1946_5039.jpg"><br>
      1948:<br><img src="/sites/default/files/old-images/King1948_4926.jpg"><br>
      Similar lettering was used for a sister label, Queen. Here is a 78 from 1947:<br><img src="/sites/default/files/old-images/Queen1947_6458.jpg"><br>
      This would have been sufficient for Nick Curtis to make a font, but IIRC he did not do this one.<br>
      Perhaps someone else did?<br>
      Don</p>
