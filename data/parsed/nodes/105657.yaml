    <p>I'm sure this was originally created by hand, but wondered if something similar (or identical) might have been created in the interim.  Working on a project to raise money for a King Records-related project in Cincinnati and would love to be able to make use of the actual logo font.  Thank you.</p>
    <p><img src="/sites/default/files/old-images/King-Logo-sm_4847.jpg"></p>
