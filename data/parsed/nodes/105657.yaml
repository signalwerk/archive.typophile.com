      <p>The logo lettering dates from the mid 1940s., vut is not identical to the modern logo.<br>
      1946:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/King1946_5039.jpg"></div><br>
      1948:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/King1948_4926.jpg"></div><br>
      Similar lettering was used for a sister label, Queen. Here is a 78 from 1947:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Queen1947_6458.jpg"></div><br>
      This would have been sufficient for Nick Curtis to make a font, but IIRC he did not do this one.<br>
      Perhaps someone else did?<br>
      Don<p></p>
