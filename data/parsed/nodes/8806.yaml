  html: <p>I was wondering if anyonce could help me. I've created several handwriting fonts (and variations on a theme) Are there any tutorials/guides/useful slices of wisdom about creating type using re-usable elements (parts of similar letters) Just re-writing out the alphabet isn't the way forward. ;) They style and type of fonts is immaterial I just want to see how various people piece everything together to create a font. Most of the sites I've seen deal with specifics of software or seem to step over the type construction stage or use an existing typeface as a starting block. <br> <br>Any thoughts?</p>
