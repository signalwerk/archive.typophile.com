    html: <p>I really like it overall. I think some of the letters are a bit conservative, and some have a bit too much personality. The "T", for example, seems a bit too plain, like the top should be heavier. The "E", "F", and "O" seem a bit extreme in comparison to the T. The humps of the M are fun, but not really echoed in any other shapes, so I might think about making these humps less pronounced. The "R" and "G" are the most interesting to me, because they look genuinely wonky, in a good way.</p>
