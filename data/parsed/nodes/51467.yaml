    <p></p><div class="imageWrap"><img src="http://typophile.com/files/zut_5476.test1.png"></div><br>
    Zút Massive Black<p></p>
    <p>I used to have a scooter called a "Zoot scoot," with some very fat lettering, although it was highly made of geometric shapes. There's some very popular fat sans-serifs right now (think Cooter), however they're not as easily recognizable as they should be.</p>
    <p>I want this to be instantly recognizable. All counters are square, or highly angular. Most counters are about about 75% of the size of hairlines, although I'm thinking about making the hairlines slightly thicker still.</p>
    <p>The "ú" is replacing "oo" because I happen to think it looks cooler. The pronounciation should come out similarly, right? (not completely sure, somewhere I read that it makes a close sound... or maybe I assumed that from the spelling of Fútbol?)</p>
