      <p>Thank you all for your comments. There is much to consider from reading your feedback. I highly appreciate it. I'm not so sure about much of these concepts anymore. I'll share in a bit. I've always enjoyed the work of <a class="freelinking external" href="http://www.idapostle.com/portfolio/" rel="nofollow">Steve Zelle</a> and <a class="freelinking external" href="http://imjustcreative.com/logo-design-portfolio/" rel="nofollow">Graham Smith</a> for their minimalist approach. There are times more complicated logos are called for and in the construction/building industry it seems there's always bold, strong, and power built fonts used. I'm still in the process of getting back a positioning statement from the client. This is probably the 2nd logo I've ever done.</p>
      <p>Before I get into my reply, you can view some of the initial sketches that I dabbled with before I started putting things together. </p>
      <ul><a class="freelinking external" href="http://zerimargroup.com/ias/ias-sketch-1.jpg" rel="nofollow">Sketch 1</a></ul>
      <ul><a class="freelinking external" href="http://zerimargroup.com/ias/ias-sketch-2.jpg" rel="nofollow">Sketch 2</a></ul>
      <ul><a class="freelinking external" href="http://zerimargroup.com/ias/ias-sketch-3.jpg" rel="nofollow">Sketch 3</a></ul>
      <blockquote><p>"About the symbol, I've seen many similar logos with the same resembling shapes. That said, I think you are on the right path, however if you want to go further then start working more on the symbol then in the final stages on the typography."</p></blockquote>
      <p><strong>sans sleep</strong>, thanks for your reply. I really appreciate your observation. One of the upsetting things I just discovered while looking for a few logo sites by Logomotive, was that I found Logo Chief and it has a logo generator. I found this posted on there<br>
      <a href="http://www.logochief.com/logo-color-options.php?id=1076&amp;v=thumb.png&amp;font=georgia.ttf&amp;fontcolor=000000&amp;layout=1&amp;tag=build&amp;category=19&amp;age=&amp;gender=&amp;attribute=" title="http://www.logochief.com/logo-color-options.php?id=1076&amp;v=thumb.png&amp;font=georgia.ttf&amp;fontcolor=000000&amp;layout=1&amp;tag=build&amp;category=19&amp;age=&amp;gender=&amp;attribute=">http://www.logochief.com/logo-color-options.php?id=1076&amp;v=thumb.png&amp;font...</a></p>
      <p>Quite a curve ball for me as I had only heard of Logo Chief but never seen the site. Then when I went through it that logo popped up. A bit frustrating for me now. </p>
      <blockquote><p>"You should also consider suggesting something other than IAS"</p></blockquote>
      <p><strong>Luma Vine</strong>, thank you for your thoughts. I had suggested to the client that a name change would be better as it is a start-up which has had a very generic type to it. However, they are the owners initials and in my attempt to encourage naming and re-naming the owner opted for this name. It was originally the last name of the owner followed by the word "construction". </p>
      <blockquote><p>"The 3rd option seems freshest, though the tools are perhaps superfluous."</p></blockquote>
      <p><strong>aluminum</strong>, this is very true and as I stated initially it was just to break away from the initial concept and move ahead. However, there's always the possibility that it might work if pitched to the client.</p>
      <blockquote><p>"In the second set I like the symbolism, which seems much more specific to the business. However I'm not sure that we'll be able to tell they are trowels when the logos are reduced to small sizes.</p>
      <p>...Maybe if you enlarged the symbols and put everything within a border or field it might help unify it."</p></blockquote>
      <p><strong>JamesM</strong> thanks for your input. The symbol is a bit generic and corporate, as I have just discovered. And you're right about the 3rd one being too top heavy. Again, I'm also waiting on the positioning statement from the client to narrow down concepts and colors. </p>
      <p>I'm not normally a logo designer but I have dabbled a bit with it. The client is fairly easy to work with and flexible, except with naming. I'm going to keep pushing for more information and narrow down details. Currently the client is super busy and I do have a good amount of time for this project, so I'm pushing a few concepts around. </p>
      <p>The business is located in the US in San Diego, California. Many construction and building companies do not have standard logos, they are constantly changing except for maybe two major companies. The smaller companies, as many in this industry, aren't too interested in branding as they are with what they do. </p>
      <p>Thanks again, I'm still open to more thoughts and feedback.</p>
