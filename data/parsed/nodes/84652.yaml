      <p>Concept 1 is very corporate, abstract, and easily interpreted as books, folded paper, a rocket, houses very close to each other, and several other things.  Together with the colors it feels a bit like a bank identity, fairly reliable and not too specific.  </p>
      <p>Concept 2 speaks to hand work.  Traditional craftsmen working in a union with time tested materials.  </p>
      <p>Concept 3 feels like handyman operation.  Probably able to beat the price point of the others, but not able to deliver high end results.  </p>
      <p>Depending on the business, any of them could be the perfect fit.  I have no way of knowing what the business is like.</p>
      <p>You should also consider suggesting something other than IAS.  It almost reads as a word or two and does nothing to communicate the essence of this business.  What does it even stand for?  It certainly is not very memorable, since I had to look back as I typed this to make sure I had the right 3 letters.</p>
