      <p>&gt; I'm still in the process of getting back a<br>
      &gt; positioning statement from the client</p>
      <p>I know it's tempting to jump right into developing concepts, but it sounds like you're doing things out of sequence. The first step in a logo project is to have discussions with your client to discuss their company, their goals, the image they currently have and the one they want to project, their competition, and so on. This will give you a much better idea of what you need to communicate through the logo.</p>
