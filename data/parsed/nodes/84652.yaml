      <p>1a of the second set is very 'builder-esque'. Slab serifs are sturdy and seem to be a hallmark of the industry. That means it's not terribly original, but that's not always a requirement, either. Something to consider.</p>
      <p>The 3rd option seems freshest, though the tools are perhaps superfluous.</p>
