      <p>Hello David, I think you should continue developing logos 1 and 2 from the first set. If you are going to keep the typeface then work on kerning. About the symbol, I've seen many similar logos with the same resembling shapes. That said, I think you are on the right path, however if you want to go further then start working more on the symbol then in the final stages on the typography.  </p>
      <p>SB</p>
