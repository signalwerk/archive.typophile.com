      <p>You really can't evaluate a logo without knowing a lot more about the company. </p>
      <p>But my offhand impression is that number one seems rather generic and corporate, but I guess it has possibilities if a corporate look is appropriate for your client. I'd make the roof/wall symbols a bit bigger inside the blue rectangle.</p>
      <p>In the second set I like the symbolism, which seems much more specific to the business. However I'm not sure that we'll be able to tell they are trowels when the logos are reduced to small sizes.</p>
      <p>Set number 3 is specific to the trade, which is good, but it looks top-heavy and somewhat disjointed. Maybe if you enlarged the symbols and put everything within a border or field it might help unify it.</p>
