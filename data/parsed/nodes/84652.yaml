    <p>Hello, I would like some feedback on the logo concepts and suggestions for a more prominent font to be used. The first set uses a roof top concept, the other uses a trowel in the "A" and the final concept was just put in there to break things up. So far the client is hooked on the first concept, which I like as well. However, I feel Futura isn't hitting well with it or maybe the balance of the logo is a bit off. </p>
    <p>I would appreciate any feedback offered on how to better this logo using a typeface or modification to the icon. Thanks and I look forward to your input. </p>
    <p><a class="freelinking external" href="http://www.zerimargroup.com/ias/ias-build-01.jpg" rel="nofollow"> First Set</a> - Looking for typeface suggestions.</p>
    <p><a class="freelinking external" href="http://www.zerimargroup.com/ias/ias-build-03.jpg" rel="nofollow"> Second Set</a> - An alternate version.</p>
    <p><a class="freelinking external" href="http://www.zerimargroup.com/ias/ias-build-02.jpg" rel="nofollow"> Third Set</a> - Out of left field to break away from the initial direction.</p>
