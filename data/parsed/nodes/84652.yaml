      <p>On the symbol:</p>
      <p>Try using the same grid you used for the cubes to determine the size of the square around it. I feel the symbol would be stronger if you get rid of the round corners.</p>
      <p>Make sure your symbol and typography are balanced.</p>
      <p>On typeface:</p>
      <p>Proxima Nova is maybe a nice alternative to futura. But maybe you could try something completely different. (example)<br>
