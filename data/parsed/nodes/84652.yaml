    votes: null
    html: |-
      <p>Thanks for the suggestion. Discussions have taken place, and the client is a bit unsettled about what they want exactly. I'm developing some concepts to help better the client's understanding. Because I have the time to do it, and because I know the client personally, I'm helping them understand what the logo should represent. What we have nailed down so far is the color; they want blue and they want a corporate horizontal logo; not something vertical. The second set of the first link I posted in Set 1 gives us that. I'm looking to build on that a bit more as soon as I get the positioning statement. So while it may appear that the process is out of sequence, it is more of helping the client understand the need for the identity first. </p>
      <p>Educating a client is a plus for me. At a time where too often I read articles written by designers who complain about what clients want or don't want, it's refreshing to work with someone who not only wants to understand their business, but the process behind the scenes to enhance their business. </p>
      <p>My purpose in requesting feedback on the logos is simply to help me understand what might work where some details are a bit mirky. But I will definitely sit down with the client to discuss this further. Thanks again, you have some very valid points.</p>
