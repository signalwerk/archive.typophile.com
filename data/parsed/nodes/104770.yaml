  html: |-
    <p>Hi all,</p>
    <p>I am trying to ID a font for a friend and am at a complete loss. The font in question is that of the attached text 'Servvizio Tecnico Assistenza Clienti' from an Olivetti ad.</p>
    <p>My initial reaction was Universe Condensed, but on closer inspection it's not quite right and the poster is from 1953 and so would be too early for Univers.</p>
    <p>Can anyone else help? Is their any chance this would be hand-lettered?</p>
