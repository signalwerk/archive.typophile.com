      <p>More: Niedermann Grotesk by steve mehallo based on work by Lucian Bernhard, as adapted for a font in 1908 by Heinz Hoffmann, <a href="http://www.myfonts.com/fonts/steve-mehallo/niedermann-grotesk/">http://www.myfonts.com/fonts/steve-mehallo/niedermann-grotesk/</a><br>
      Also consider, for the _G_, _S_ and _s_, Poster Gothic <a href="http://www.myfonts.com/fonts/abctypes/poster-gothic/">http://www.myfonts.com/fonts/abctypes/poster-gothic/</a><br>
      Also ITC Benguiat Gothic <a href="http://www.myfonts.com/fonts/itc/benguiat-gothic/">http://www.myfonts.com/fonts/itc/benguiat-gothic/</a><br>
      Don</p>
