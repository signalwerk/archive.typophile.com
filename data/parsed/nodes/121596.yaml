      <p>The usual practice of the era was to hand letter movie titles, sometimes with care so repeating letters look the same.<br>
      This lettering is an Art Nouveau style of the early 20th century.<br>
      It was sometimes made into fonts. For example Bohemian in the Miller and Richard Type Foundry of London and Edinburgh specimen book, digitized by Nick Curtis as Millrich Moravian NF <a href="http://www.myfonts.com/fonts/nicksfonts/millrich-moravian-nf/">http://www.myfonts.com/fonts/nicksfonts/millrich-moravian-nf/</a><br>
      It was also used on buildings. For example on the Kumla Skofabrik in Sweden cira 1920. Digitized by Göran Söderström as Kumla <a href="http://www.myfonts.com/fonts/autodidakt/kumla/">http://www.myfonts.com/fonts/autodidakt/kumla/</a><br>
      There are also some similarities to the ATF Thermotype circa 1930 digitized by Nick Curtis as Deux Chasses NF <a href="http://www.myfonts.com/fonts/nicksfonts/deux-chasses-nf/">http://www.myfonts.com/fonts/nicksfonts/deux-chasses-nf/</a><br>
      Don</p>
