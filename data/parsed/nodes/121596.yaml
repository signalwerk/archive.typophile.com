    <p>Hi,<br>
    I'm looking to identify the font used in "Berlin: a symphony of a Great City". This is a documentary film made in 1927 by Walter Ruttmann. I'm working on a video-art project with reference to the film. Any idea how to find such a font?<img src="/sites/default/files/old-images/font1_4738.jpg"></p>
