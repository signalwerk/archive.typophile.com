    <p>I’ve just purchased the lovely <a href="/wiki/Relato" class="wiki-create">Relato</a> by <a href="/wiki/Eduardo%252BManso" class="wiki">Eduardo Manso</a> (a bargain until the end of Feb over at MyFonts), and have been admiring some of the details on the modelling of each letter. One feature in particular struck me as unique in my (admittedly limited) experience of fonts intended for extended text. The lower case e has a beak (?) that points slightly *downwards*, whereas usually the beak is flat or pointing upwards (see image)<br>
    </p><div class="imageWrap"><img src="/files/relato_e_5528.png"></div><p></p>
    <p>Is this feature indeed unique, or are there any other text fonts that have it?</p>
