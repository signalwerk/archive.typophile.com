    <p>Hi all,</p>
    <p>originally I wrote <a href="http://justanotherfoundry.com/tools/generator">this test text generator</a> for my own use but I think it may be useful for every type designer. It is similar to Miguel’s <a href="http://adhesiontext.com">adhesiontext</a> but the texts are synthesised using a different system.<br>
    I hope it works with all your browsers and OSes - if you have any problems or suggestions just let me know! Implementing further languages would be fairly easy if there is need for it (Danish/Norwegian is already on my list).</p>
    <p>Tim</p>
