      <p>Hi Tim,</p>
      <p>Congratulations for this text tool.</p>
      <p>I don’t know if it’s because of the text sources you’ve used, or the system you’ve used, but I have to say that the output for Portuguese doesn’t look like Portuguese at all. There are way too many ’y’s, ’k’s and ’w’s. I also see many sequences of letters that in Portuguese are not frequent or don’t exist at all, like ’ll’, ’ff’ and ’nn’. (I’ve just searched <a href="/wiki/adhesiontext" class="wiki">adhesiontext</a> and the only words using ’nn’ that came up were ’scanner’, ’cannabis’, ’connosco’ and a few obscure ones)</p>
      <p>On the generator’s page you say that the “text is synthesized on the basis of language-specific lists of triplet frequencies”, and I wonder, did the system take syllables into account when those lists of triplets were created?</p>
