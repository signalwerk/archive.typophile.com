    html: |-
      <p>Miguel,<br>
      you must have selected something else in addition to Portuguese because the triplets list for Portuguese does not contain any 'y's. Note that if you check Portuguese and "neutral" it will mix these two databases, introducing letters and combinations from other languages. If you really want purely one language make sure all others - including the ready-made mixes - are unchecked.<br>
      Also, if you want a typically Portuguese letter frequency distribution you should set both "variety" settings to 0 because otherwise letters which are rare in Portuguese would be boosted.</p>
      <p><strong><a href="http://justanotherfoundry.com/tools/generator/generator.py?language=pt&amp;characters=all&amp;chars=&amp;kern=typ&amp;kernchars=&amp;kernlevel=0&amp;lettervariety=0&amp;pairvariety=0&amp;frequencies=output&amp;generate=Generate+Text">This </a></strong> should generate a more Portuguese-looking text. Does it look better?</p>
      <p>The tool does not take into account syllables, not even words. Every character, including the space character, is processed in the same way (with a little tweak to avoid extremely long words).</p>
