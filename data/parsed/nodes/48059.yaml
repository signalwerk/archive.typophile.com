      <p><em>Designers are saying that Adobe kerning causes more problems than it solves.</em></p>
      <p>I am somewhat conflicted about how many kerns to put in a font, and according to the typeface, have followed different kerning schema. These days, I'm reducing the amount of kerning, both for aesthetic and practical (huge glyph sets in OpenType fonts) reasons.<br>
      I don't think there's a simple answer.<br>
      The fact that some typographers turn off kerning is not necessarily an argument against it.<br>
      As far as Robert Slimbach's types go, I used Myriad Condensed a lot when I was doing editorial and brochure design, and I found the tight fit was brilliant.<br>
      However, I can see where those typographers who turn off kerning are coming from, in my own response to new versions of types such as Univers, which have the copious kerning their metal predecessors lacked. To me, Univers doesn't look like Univers any more, and I think it may be the metrics. In particular, kerning after the "r" does seem to effect the tonality.</p>
