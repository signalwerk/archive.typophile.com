      <p>Moving on from the specific kerning and application issues...</p>
      <p>The problem with fixes or upgrades to fonts is how to get them to the licensed users of previous versions. This isn't a problem only for fonts, but it is one which system and application developers have largely solved, using 'push' mechanisms to notify users via their Internet connection of updates, often with the option to download and install the updates. I have not seen such mechanisms used for font updates, and I suspect some important pieces of such a mechanism for fonts are currently missing. An OS or application can carry its own code for connecting to a server, checking for updates and alerting the user. For fonts, this would presumably need to be some kind of separate applet (or applets, presuming that font vendors would have their own: an Adobe Font Updater, a Monotype Font Updater, etc.). It gets messy in a number of different ways, especially for fonts that are available through cross-licensing from multiple vendors.</p>
