      <p>Well, Thomas and Chris, who earlier wrote</p>
      <p><em>Thomas talked about the library revision and its bug fixes at TypoTechnica in April 2007</em></p>
      <p>these could be firsts, and mark an extraordinary shift in the wind. I don't want to take away from that.</p>
      <p>And let's be fair to the type team: making Adobe's hinting tools available was a very generous piece of philanthropy that even I can't find any conspiratorial loopholes in. (Well, it helps to ensure the continued vitality of PostScript.) Nor is it a one-off, but part of a concerted program of trying to provide as much gratis (and great) type technology as possible. Another public gift of similar magnitude was recently planned, only to be frustrated by a paranoid third party. </p>
      <p>Well, well, looking ahead to the future, and to more successful productization of type, all I can say is what I've said before: set up an old Mac with System 7.6-8.1 with the GX extension. Run LightningDrawGX. See how easy, and how much fun, type can be. </p>
      <p>Think I'm crazy? The Illustrator team didn't. LightningDrawGX fueled many of the best new features in Illustrator 7, 8 and 9. That's an impressive legacy for a program that was only developed for 18 months.</p>
      <p>I'm not saying it's the only way. I'm just saying it's the only way I've seen to date.</p>
