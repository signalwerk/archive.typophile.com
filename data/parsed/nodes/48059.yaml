      <p>&gt;please give me just a quick reminder how I can use their OT layout features in Word again.</p>
      <p>Jens, I brought up the issue of MS apps and OTL (lack of) on the OT list seven years ago! (October 2001) Microsoft's wonderful Greg Hitchcock then promised he would escalate it to the highest levels. One problem was that the app developers didn't want to support OTL because of perceived performance hits, which Greg took issue with. Whatever the case, seven long years later, we still don't have much OTL typography support in MS apps. This just shows that it takes a long, long, long time for people to do anything about fonts when it doesn't seem important to the app people. Actually, it doesn't. OT is very, very unsexy and most app developers are not interested in it. And most customers aren't interested in it. People on Typophile are interested in it. So what? </p>
      <p>Isn't it funny that this thread would also never have occurred had Nick not chosen to use Arno as his example, since that seems to be the only Adobe font that doesn't work in Quark 7. In the meantime, I need to solve why my OT font for Nicola works in Quark 8 but not in InDesign CS3. This is still a format for geeks, not letter designers. I wish it weren't so, but at the rate we're going, it's obviously going to be a long, long time before things get straightened out. </p>
      <p>By the way, Adobe's OT support has always been partial, and there were one or two features that Quark implemented in 6 of 7 that Adobe hadn't yet done -- I've forgotten which. There's something the matter here. App developers are being forced to do way too much work, and take too many hits, whatever John or anyone else says to the contrary. The co-developers of the format -- Adobe and Microsoft -- are both app makers and have substantial difficulty in supporting the format, 11, 12 years after it was specified. You can't get away from that. AND USERS ARE CONFUSED.</p>
      <p>Artur, you may dislike my tone, but I deal in <em>facts</em> not tone. You say I misquoted Miguel. When I say someone has misquoted someone, I illustrate with the quote and with the misquote. I warmly recommend this method to you. It is infallible.</p>
