      <p>Nick, that's a subtle point since in Lino Univers New there are only three lowercase kerns after r, each of -12: s, q, o. The kerns in Adobe Univers are quite different. I know some think Bitstream's version is the best. One thing I'm reasonably sure of is that most metal versions would probably appear quite a bit looser at 8 or 9 points than any of the comparable photo/digital versions. I don't know the font well enough to comment further.</p>
      <p>I would like to make the point that extensive kerning does not necessarily dictate tight fit. Kerning can be strong or weak; can often, with advantage, be positive, not negative, depending on the scenario. It would be interesting to look at the Berthold Univers, which is probably optimized for a smaller size than the others.</p>
