      <p>Actually, I've frequently discussed bugs in public. Mostly in the Adobe user forums. Somebody speaks up about something they see as a problem, and I comment. That's how we improved our polytonic Greek support last year and got a new beta tester, for example.</p>
      <p>Also, many years ago we set things up so that the online bug forms sent in got seen and reviewed by multiple folks, including me. Almost all of them that aren't empty or sent to the wrong team due to user mistake get a personal response, as well, usually from me or Ernie. Again, a minority turn out to be actual bugs, but sometimes they are.</p>
      <p>Far and away the most frequent issue we see and hear about is people thinking there's something wrong with the fonts because in "normal" Windows apps not all their fonts show up, due to style linking. That resulted in adding info about style linking to our OpenType User Guide, and to our OpenType readme file, plus revising an existing Adobe KnoledgeBase article. Additionally, we're working on font-specific readmes that will contain family-specific info. The old PDF readmes we had for our Pro fonts also had this info. Plus I've blogged about style linking. Maybe we should also have an article on the main Adobe.com web site... the main problem here is that people just don't read, but we try.</p>
