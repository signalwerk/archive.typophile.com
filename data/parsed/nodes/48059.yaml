      <p>you're wildly changing subjects as this suits you. This won't help. </p>
      <p>1. Adobe last fixed pretty much _all_ of their OpenType fonts in 2005 or 2006 — introducing many fixes to problems that have been reported since the initial release of some of their OpenType fonts in 1999 or 2000. They fixed many of the problems I reported, including some crucial glyph design problems. </p>
      <p>2. Once a font is released, many vendors consider it problematic to change the font's metrics (and kerning) because this would cause document reflow depending on which version of the font the user uses. For this reason, for example, after Verdana was mistakenly released with no kerning in the Italic, Bold and Bold Italic styles (kerning was only in the Regular style), it was never fixed. </p>
      <p>3. My own opinion is that kerning is one of the most ill-specified elements of OpenType, mostly because it exists in two places: the "kern" table and the "GPOS" table. There are fonts out there that have a "GPOS" table with no "kern" feature while they have kerning in the old "kern" table (Times New Roman, Windows), there are such that have a "kern" feature in the "GPOS" table but not "kern" table (Calibri, Minion Pro), there are fonts that have kerning both in the "kern" feature of the "GPOS" table and in the "kern" table. And, the behavior for kerning is defined differently for .ttf and .otf. And, there are numerous ways to express the same kerning information in a GPOS table (using multiple lookups, multiple subtables, classes or pairs, extension lookup types etc.). I think the "founding fathers" of OpenType screwed up here. Well, the "founding fathers" of TrueType and Type 1 screwed up elsewhere, that's life. </p>
      <p>This is all quite complicated for the implementers of OpenType Layout engines. I personally know three major OpenType Layout engines in which the developers tried to implement the behaviors exactly as specified in the spec, but made mistakes because they either did not implement the unspecified "common knowledge" that is shared between Adobe and Microsoft, and is only sometimes described unofficially on some lists. </p>
      <p>But the problem as I see it is not that Adobe or Microsoft are trying to sabotage their competition. After all, if it were so, at least OpenType fonts made by Adobe or by Microsoft would work equally well in Adobe and Microsoft applications — but that is not true. The German smallcap ß specified in Microsoft OpenType fonts (Calibri etc.) does not work in Adobe applications, and kerning in those fonts does not in Word, and kerning specified in Adobe OpenType fonts such as Arno Pro does not work properly in Microsoft applications. </p>
      <p>But this is not due to ill-made fonts. Most OpenType fonts are made with FontLab Studio plus Adobe FDK plus Microsoft VOLT, and there are THREE people involved in developing the key elements of those applications altogether, so it's easy to make sure crucial bugs get identified and fixed. </p>
      <p>But implementing the layout engines — it's not trivial. Not only you need to follow the published specs and the unpublished notes, you need to cooperate with UI designers and convince managers and marketing people that certain aspects of text layout are important, so you will be given a chance to implement it at all. Plus, text layout code has been sitting in operating systems and applications for years, and it's not an easy decision to just "revamp it all". </p>
      <p>The one instance I'm actually really angry about is that Microsoft blew the chance to add some proper OpenType Layout features for non-complex scripts when they were working on Office 2007. They changed the file format, for the first time since 1997, so they could have used this chance to look away on the reflow issue. They changed the UI, quite drastically, so they could have used this chance to do away with some ancient font-related options, ancient four-styles-linking, the necessity to explicitly activate kerning and other absurdities of Word, and could have given Word a text engine worthy of the 21st century, with an UI to activate the most important OpenType Layout feature. </p>
      <p>And they ended up shipping an app in which for the new default fonts they bundled (Calibri, Constantia, Cambria etc.) there is no way _at all_ to get kerning working, not even if you turn it off, which is actually a step back compared to what was the case with Word 95, Times New Roman and Arial. </p>
      <p>I do understand things like release schedules, manpower, deadlines etc. —&nbsp;and yet still, I am angry about that one. </p>
      <p>But this issue aside, I think both Microsoft and Adobe have done wonderful job in the last ten years when it comes to original type design, multilingual support, typographic quality, font technology. Hell, imagine that 6-7 years ago, one still had to explain to people that they have to use two different fonts if they wanted to typeset Italian and Hungarian. </p>
      <p>Yes, there are flaws, and the industry makes mistakes all the time. Nobody's perfect. I have learned that in the last ten years that are passing since my first ATypI conference. And I have learned to accept that. I do agree with you, Bill, however, that people should acknowledge the actual problems and shortcomings, and "cut the crap". </p>
      <p>When Maxim Zhukov was teaching a Cyrillic type design weekend in New York last year, he quoted his former boss at the United Nations who would occasionally ask him the question: "Maxim, is this a screw-up or is this a position?" I very much wish that people would sincerely try to answer this question when it comes to discussion like this. </p>
      <p>However, save your ammunition for problems of real magnitude, Bill. And don't shoot at people who are actually on the same team that you are, even if you don't really know it. </p>
      <p>Best,<br>
      Adam</p>
