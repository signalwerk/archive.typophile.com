      <p>I just read this entire thread and was amazed at the depth and quality of information posted in it. It's all quite valuable in terms of education and keeping up on the never-ending development/improvement of typography across the aisles, so to speak.</p>
      <p>Sadly, as I left the thread and tried to review in my mind what I'd learned, I realized I couldn't steer my mind away from the same unfortunate comment:</p>
      <p>"So please, next time do your homework first and stop wasting my time with nonsense."</p>
      <p>First and foremost, what might be a "waste of time" to some might be interesting, educational commentary to others regardless of its ultimate veracity. I failed to notice anyone being dragged here by the ear and forced to look at or read anything.</p>
      <p>Second, as it turns out the so-called "nonsense" was at least substantial enough to subsequently warrant lengthy discussion ... which must make all of that "nonsense" too, I suppose.</p>
      <p>And finally, comments like this seem to echo louder - and for much longer - than others. What's that old axiom - you could have a baseball game in the north part of town, a football game in the west, a basketball game in the east and a fight on the southside and most people will go see the fight?</p>
      <p>This sort of disenchanting dialogue was in my mind poisonous to what otherwise was healthy, informative debate. I'm sorry to see that.</p>
