      <p><em>the main problem here is that people just don’t read, but we try.</em></p>
      <p>They don't read, and never will -- that's what we've all been trying to achieve through computer interface design. But there is a solution that will have to come sooner or later, and it should be being architected now: teach fonts how to talk.</p>
      <p>Fonts must, in the future, be able to interface with users, if the font industry wants any large success. So there has to be an executable component. What everybody asks is, how on earth does the user interface with that component?</p>
      <p>Two ways:</p>
      <p>1. Every font name you see in the OS has a down arrow to its right which presents a menu.</p>
      <p>2. Right clicking on the font name presents a menu item.</p>
      <p>Or, most simply, clicking on a font name, anytime, presents a menu, and doesn't act, merely, as a mechanism for selecting that font.</p>
      <p>OK. What's the font going to say to you? </p>
      <p>Well, at the simplest level, the font could say hello, I'm Gabbo. I'm a standard OT font and I speak Western European. GPS tells me you're in Roumania. Nice place. Would you like me to tell you what I know about the T-cedilla? OK, and by the way, click here, and for just 1 euro, I'll install the Roumanian component of this font. Hey, you could have Polish and Hungarian for just a couple more euros. </p>
      <p>Come to think of it, that's not a bad future model for modular, extensible, software. To participate, you have to set up e.g. a Paypal account. All software comes with modules, in continuous development, that you can add on. <em>A single button press</em> adds the module and debits your account. </p>
      <p>This could work for all software, not just fonts. Because people love to shop, especially, and repetitively, for small amounts (hence the phenomenal success of iTunes), it's just about the only constructive, positive, attractive way to counter the idea, hard-wired into all persons under the age of 30, that software is free.</p>
      <p>But it has to be made easy! Easier, even, then going to the iTunes store. Just that single button press which gives you a simple choice:</p>
      <p><em>Click me, and I'm yours, for something you can easily afford.</em></p>
    html_clean: |-
