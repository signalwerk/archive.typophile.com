      <p>Clarification: when I propose this modular model, it should be clear that the modularity will probably be more virtual than real. That is to say, if the customer click-buys the Roumanian component of Gabbo, what the OS will install is a completely new binary file, not Gabbo WE binary + Gabbo Roumanian binary with the expectation they would somehow work together sans bugs. Similarly, if a customer for 'Basic Word Processor' wants to add some worthwhile feature like multi-level footnoting, I would assume that an entirely new build of 'Basic Word Processor' would be sent to that user. Needless to say, we want to see these virtual modules automatically downloaded and installed. The customer should not have to do anything other than click to buy. </p>
      <p>In an era when even clicking on a webpage to go shopping takes up more time than we are willing to give, the attraction of an ultra-simple affordable one-click purchase strategy may prove unexpectedly effective.</p>
