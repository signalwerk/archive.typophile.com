      <p>I don't think you're right, Artur. Had we left it to Adobe, we'd just have Adobe's response, which is that there isn't and never has been a problem, either with its kerning system or with its OT implementations. And please note that Microsoft is not making incompatible fonts. This thread should never have existed, because the problem should never have arisen. A technical problem as anomalous as this does not arise for no reason at all. The method may be painful, but we have learned something about why it arose. My quote from Quark is verbatim. Mail me, and I'll mail you their note. Ten, fifteen years ago, you could go to Adobe with questions and get responses from high calibre people like David Lemon, Rick Wulff, Chris Holm, and many others. Where are they now?  </p>
      <p>In the meantime, would you like to take on any of the <em>issues</em>? The responses in this thread have been <em>pathetic</em>. Adobe's in total denial, Microsoft's not interested, John's reflex-evangelizing any threat to OT because his livelihood depends on it. Badly as I may be doing it, I am the only person representing the voice of the <em>user</em>, other than the user who started the thread. Where do <em>you</em> stand?</p>
