      <p>How pleased I am that someone told me about this thread! (I'm sure everyone else will be glad to see me reviving it.)</p>
      <p>Bill, I want to call attention to this statement you made:</p>
      <p><cite>Folks, people have been complaining, vigorously, about these Adobe kerning problems for nearly 20 years.</cite></p>
      <p><cite>Do you really care if your problems are ’logged’ or not? They’re never, never, never, going to be fixed. After nearly two decades of customer complaints, I think we can safely make this statement.</cite></p>
      <p><cite>... When was the last time Adobe fixed a font?</cite></p>
      <p>I want to note that quite a lot of the kern pairs that you are complaining about (cited by Kathleen Tinkel ten years ago) were, in fact, fixed by me many years ago during the conversion to OpenType. I can't say I got all of them, but I was aware that there were many such kerns in various Adobe Originals, and I tried to remove those when they crossed my path. Furthermore, some kerning problems (among many, many other bugs) were recently fixed in the revision of the Adobe Type Library. Some of these had been logged from customer bug reports (a.k.a. complaints), and some were flagged internally. In any case, all these logged kerning bugs were considered during the revision and many were corrected. Unfortunately many of the more subjective, less-offensive kerns were left alone, because with any change that affects text flow, we are concerned about the impact on legacy documents. You are welcome to state your own preference that all kerns which you consider wrong be fixed immediately, but there are always matters of personal taste and concerns about backwards compatibility which fall into the mix.</p>
      <p>Which leads me to the next hilarious quote:</p>
      <p><cite>I deal in facts not tone.</cite></p>
      <p>You've asserted more than once that we are not interested in customers or bugs. I think that if you asked around you would find many people who have had their Adobe font complaints acknowledged with great interest and appreciation. I can tell you that we in Adobe Type are keenly interested in knowing about, evaluating, and fixing bugs -- but our ability to do so rapidly and completely is always limited by time, resources, and other practical matters. I think for the font profession and for the software industry in general, this is not unusual.</p>
    html_clean: |-
