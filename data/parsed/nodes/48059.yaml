    html: "<p>Let's move on to a more interesting question: who on earth thought up Adobe's daffy kerning system to start with? We know that Sumner Stone was responsible for the early triumphs of the type group, including the Originals program. Yet looking through Cycles (which, along with Miller, I would exchange for the entire Adobe type library) I don't see any of these crackpot kerns that have caused so much trouble. For me, a Matthew Carter font is like a master class in type. Everything, not excluding the interesting kerning system, is a lesson that is just within my reach to grasp. But when I look at Cycles, I wonder if I will ever know what it's all about . . . . just look at the k and ask why he does what he does - - so eccentric, so willful, and yet it all makes sense. Sorry, I can't snip the k until I restart, and I can't restart until I've moved some files from my dying Vista drive to my Mac . . . . can someone else?</p>"
