      <p>Adam, this is all brilliantly expressed and anyone who reads it will be grateful for the clear exposition of your viewpoint. I had hijacked the thread for what I thought were some really good new ideas because I thought it was dead, and I am glad you have revived the original topic. But . . . when you write,</p>
      <p><em>I personally know three major OpenType Layout engines in which the developers tried to implement the behaviors exactly as specified in the spec, but made mistakes because they either did not implement the unspecified “common knowledge” that is shared between Adobe and Microsoft, and is only sometimes described unofficially on some lists.</em></p>
      <p>You are saying OT is a broken product that nobody can fix.</p>
      <p>Now look at it from my point of view: I saw it all working on the Mac in 1995 in 4MB of memory space. Code was available for both Apple and Windows. Yet nobody wanted it! Neither Microsoft nor Apple. And certainly not customers. Now 13 years later you're telling me to be patient.</p>
      <p>I say maybe it's time to start fresh? </p>
      <p>Years ago the late Carla Ow-Chu, when she was still at Apple, said, re OT, 'they can't do it without us.'</p>
      <p>I said, come on, it'll take them a year or two at most to iron out all the quirks. </p>
      <p>Oh no, said. And she was right.</p>
      <p>And Adam, I don't think these people are really on my side. I'm on the side of products that <em>work</em>. </p>
      <p>Or let me put it another way: here's a situation where a technology vastly affects an enormous amount of application and typeface developers. The technology is spec'd by Adobe and Microsoft. There are two principal problems. One you have identified: they don't share vital information with other app and typeface developers. Two, you were too diplomatic to identify, they don't get on too well with one another.</p>
      <p><em>These</em> two problems are capable of solution. But when? Why not start today? </p>
      <p>One thing is clear: no ordinary pressure will work. In eleven years, no ordinary pressure has worked. Only leadership at the top -- and maybe including Apple this time -- can work. Or passive resistance from users. Or else users will respond with sheer indifference.</p>
