      <p>Hello Christopher,</p>
      <p>some of the people involved in this discussion -- in order of appearance: Miguel Sousa, John Hudson, Thomas Phinney, Christopher Slye, Adam Twardoch -- better than most others know what they are talking about. They have produced the technically most advanced fonts available.<br>
      The problem is that Bill ascribed intentions to some of them that make for a grand story but are not backed up by facts. (Which Miguel addressed in straightforward way ... Also note that Bill's last interpretation of Adam's post was kindly ignored.) Indeed, interesting things were said in the course of the discussion, like in later posts by John Hudson, Christopher Slye and Adam Twardoch, yet the length of it was not caused by the matter being so substantial but by Bill's insistence that Adobe does suspicious things. Which simply is not the case:</p>
      <p>The trivial reality is that OSes' and applications' OpenType support is still far from sufficient but improving. (Way too slow, if you ask me.) This forces type designers and/or font developers to make tough decisions: Do I add this or that advanced feature, at the risk that some applications won't support it?* Or do I create less than perfect fonts, so they at least behave the same even in less advanced apps?<br>
      * Including MS apps which makes it an even tougher decision.</p>
      <p>Amazingly, this thread is highly informative <em>despite of</em> Bill's interpretations. And XPress 8 has made it obsolete anyway&nbsp;...&nbsp;&nbsp;;-)</p>
      <p>Best wishes,<br>
      Karsten</p>
