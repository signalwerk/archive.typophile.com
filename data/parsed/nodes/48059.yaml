      <p>Bill, I can't recall that Adobe has ever replaced a customer's font for free due to a bug. I'm not sure it's never happened, but I don't know of any such case off the top of my head.</p>
      <p><cite>This is the first time in 20 years I have heard Adobe acknowledge a font bug.</cite></p>
      <p>Thomas talked about the library revision and its bug fixes at TypoTechnica in April 2007, and mentioned this talk on his blog the following month, so the bug fixes are not really the revelation you perceive them to be. I'm sure the revision has been mentioned elsewhere. (I just gave a presentation on it at TypeCon.)</p>
      <p>I think you would agree that it's better to fix bugs than to leave them unfixed forever. Our first priority is to identify font bugs and log them, and then fix and release them. Getting them to customers is a distinct step. Obviously the latest fonts are available now to customers who want to buy them.</p>
      <p>Regarding font "updates", this is something we're hoping to offer soon. The fonts available for upgrading will likely be quite limited in the beginning due to the complexities of font licensing and so on. My point here is that, like everyone else, we are quite interested in offering this to customers and we're working on it. It is not a trivial undertaking.</p>
      <p>As I mentioned in my TypeCon talk, fonts are rapidly becoming bigger and more complex, such that they are practically like "little applications". We expect to continue to find, log, and fix bugs, like any application developer would.</p>
