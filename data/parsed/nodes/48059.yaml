      <p>&gt;Obviously the latest fonts are available now to customers who want to buy them.</p>
      <p>Christopher, people who buy fonts at all spend vastly more on fonts than they do on apps. I'm sure it's not uncommon for designers to spend ten or twenty or forty times as much on fonts as on all their other software and perhaps even hardware put together. And, as we're always telling people, fonts do take an enormous amount of work. </p>
      <p>But fonts are priced accordingly. For $200, or $600 for a larger family, you are getting a product that has had considerably less man hours put into it, probably, than the average application that costs as much.</p>
      <p>What are they getting for that? Is all of Photoshop, or Microsoft Office, worth four smallish font families? What's the difference in man hours spent on a few fonts versus MS Office? And what are you getting when you re-buy OT STD fonts? Is it really worth the money?</p>
      <p><em>fonts are rapidly becoming ... like “little applications”.</em></p>
      <p>When they do, and once they have some kind of intelligent interface with the user, maybe users will become more interested in fonts. Maybe that will happen in ten, twenty, forty years.</p>
      <p>But -- and I don't intend to pursue this tired point much further -- I know of only one way to engage a user interactively and intelligently with fonts, and that's with LightningDraw style sliders -- right up front, always available -- for varying the appearance of a font. And that means MM or Variations. Until you get the user at that point of simple, fun, engagement, which no application other than LightningDraw ever did, the font is merely a more or less tiresome utility. </p>
      <p>The fact that I am one of the few voices in the wilderness willing to criticize Adobe type is an illustration just how unimportant type is in the rest of the world. Who, besides me, ranted for ten years that the opticals in Adobe MMs were badly designed and pleased no-one? Finally, in the OT opticals, we got a bit of grudging redesign. But that came too late to save MMs. Were type really important to users, there would be hundreds of thousands of complaints, not dozens. Hundreds of thousands of complaints: that's, paradoxically, success!</p>
      <p>The goal we ought to have is to get fonts to be a product that everybody cares about, not just a few. That means treating them like a competitive software product and productizing them accordingly.</p>
      <p>Oh I give up! How many times can one say the same thing?</p>
