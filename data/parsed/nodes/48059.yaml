      <p>Re the A-quoteright-period problem in Arno, is this something new? I don't see it in Minion MM, for example.</p>
      <p>It almost seems that Adobe is occasionally (and without ever informing customers) 'fixing' kerning bugs only to add new ones. </p>
      <p>In Arno we have the case of a font with so many kerns that a special, unsupported kerning technology has to be used which is not supported by the vast majority of programs. </p>
      <p>Why not simply use fewer kerns? </p>
      <p>Why build fonts that are not supported by most software? </p>
      <p>You gotta wonder.</p>
      <p>What I do know is that I have seen books from major publishers that show lavish and careful use of Minion and Minion expert, but where kerning is turned off because Adobe kerning causes more problems than it solves. This from designers who are going through the pain of using all f-ligs, small caps, osf, etc. where appropriate, in 700-page books. </p>
      <p>Anyway, that's the thing. Designers are saying that Adobe kerning causes more problems than it solves. Maybe it's time to stop the gimmicks?</p>
