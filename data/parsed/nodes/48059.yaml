      <p>Bill, re. the 'conflicting quotes':</p>
      <p>I'd need to go and find the context for the 2006 quote, but I think the viewpoint as stated can be reconciled with what I wrote in this thread by an automotive metaphor. The vast majority of people need cars that are road-worthy, reliable and safe to drive in a variety of weather conditions and on a variety of surfaces. But the development and racing of Formula-1 cars is not unrelated to that need.</p>
