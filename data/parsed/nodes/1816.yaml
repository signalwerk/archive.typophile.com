    date_raw: null
    votes: null
    html: "<p>Typical Windows apps have a fixed family size of 4 or less fonts: regular, italic, bold and bold italic. If you have a larger family, you need to creatively name the fonts into discreet four-font families, e.g.: <br> <br>MyFont <br> MyFont-Regular <br> MyFont-Italic <br> MyFont-Bold <br> MyFont-Bold Italic <br> <br>MyFont Light <br> MyFontLight-Regular <br> MyFontLight-Italic <br> <br>MyFont Bold <br> MyFontBold-Regular <br> MyFontBold-Italic <br> <br>However, while you still need to do this for any TT and OT font, the latest versions of the name table specification include a second set of OpenType preferred family and subfamily names, which are what Adobe apps reference in menus and what future MS and other apps will use. Using the same example as above, the OT preferred family name could be set to 'MyFont', with the preferred subfamily names as indicated in brackets below: <br> <br>MyFont <br> MyFont-Regular [Regular] <br> MyFont-Italic [Italic] <br> MyFont-Bold [Semibold] <br> MyFont-BoldItalic [Semibold Italic] <br> <br>MyFont Light <br> MyFontLight-Regular [Light] <br> MyFontLight-Italic [Light Italic] <br> <br>MyFont Bold <br> MyFontBold-Regular [Bold] <br> MyFontBold-Italic [Bold Italic] <br> <br>You can set OT preferred family and subfamily names in FontLab, on the second panel of the FontInfo window.</p>"
    html_clean: "<p>Typical Windows apps have a fixed family size of 4 or less fonts: regular, italic, bold and bold italic. If you have a larger family, you need to creatively name the fonts into discreet four-font families, e.g.: <br> <br>MyFont <br> MyFont-Regular <br> MyFont-Italic <br> MyFont-Bold <br> MyFont-Bold Italic <br> <br>MyFont Light <br> MyFontLight-Regular <br> MyFontLight-Italic <br> <br>MyFont Bold <br> MyFontBold-Regular <br> MyFontBold-Italic <br> <br>However, while you still need to do this for any TT and OT font, the latest versions of the name table specification include a second set of OpenType preferred family and subfamily names, which are what Adobe apps reference in menus and what future MS and other apps will use. Using the same example as above, the OT preferred family name could be set to 'MyFont', with the preferred subfamily names as indicated in brackets below: <br> <br>MyFont <br> MyFont-Regular [Regular] <br> MyFont-Italic [Italic] <br> MyFont-Bold [Semibold] <br> MyFont-BoldItalic [Semibold Italic] <br> <br>MyFont Light <br> MyFontLight-Regular [Light] <br> MyFontLight-Italic [Light Italic] <br> <br>MyFont Bold <br> MyFontBold-Regular [Bold] <br> MyFontBold-Italic [Bold Italic] <br> <br>You can set OT preferred family and subfamily names in FontLab, on the second panel of the FontInfo window.</p>"
