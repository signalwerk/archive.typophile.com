  html: <p>I have tried to create TTF and OTF fonts (using FontLab for Mac) that would work cross-platform. Everything is perfectly fine until I come to the part where the grouping in font families does come in. Is there a way to create a TTF/OTF font file that would show up with a submenu (say Helvetica Neue as the main font menu item and then 33 variations of it as its submenu items) so that it would work the same way in BOTH Mac and PC? <br> <br>I have tried many different combinations but there's always a problem on one of the platforms. If I get decent submenus on the Mac, the font won't work on a PC (it can then only have 4 submenu items). And if I name the fonts so that they show up on a PC (basically fill all the font info into all the name fields in FontLab - i.e. 'HelveticaNeue-LightExtended' for every field),  the Mac font menu becomes huuuuuge. <br> <br>Is there some way to solve this problem? Maybe you can briefly explain the standards (if there are any?) of naming decent cross-platform fonts? Or point out some tutorials? <br> <br>Thanks! </p>
  html_clean: <p>I have tried to create TTF and OTF fonts (using FontLab for Mac) that would work cross-platform. Everything is perfectly fine until I come to the part where the grouping in font families does come in. Is there a way to create a TTF/OTF font file that would show up with a submenu (say Helvetica Neue as the main font menu item and then 33 variations of it as its submenu items) so that it would work the same way in BOTH Mac and PC? <br> <br>I have tried many different combinations but there's always a problem on one of the platforms. If I get decent submenus on the Mac, the font won't work on a PC (it can then only have 4 submenu items). And if I name the fonts so that they show up on a PC (basically fill all the font info into all the name fields in FontLab - i.e. 'HelveticaNeue-LightExtended' for every field),  the Mac font menu becomes huuuuuge. <br> <br>Is there some way to solve this problem? Maybe you can briefly explain the standards (if there are any?) of naming decent cross-platform fonts? Or point out some tutorials? <br> <br>Thanks! </p>
