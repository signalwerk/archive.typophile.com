    html: <p><a href="http://www.fontshop.com/fonts/font_rend.php?idt=f&amp;id=19910&amp;rt=a&amp;rs=388" rel="nofollow">Helvetica</a> and <a href="http://www.fontshop.com/fonts/font_rend.php?idt=f&amp;id=20744&amp;rt=a&amp;rs=388" rel="nofollow">Neue Helvetica</a> are easy to tell apart. What’s used in the above <a href="http://typophile.com/files/helvetica-poster_4215.jpg" rel="nofollow">poster</a> is certainly the <em>Neue</em> variety. Historically, there were so many <a href="http://www.fontshop.com/fonts/font_rend.php?idt=f&amp;id=19880&amp;rt=a&amp;rs=388" rel="nofollow">Helvetica versions</a> developed, adjusted, customised, &amp;c., for various typographic media and uses. None of them compares to the original Helvetica Medium, née <a href="http://typophile.com/files/haas01.jpg" rel="nofollow">Neue Haas Grotesk halbfett</a>.</p>
    html_clean: <p><a href="http://www.fontshop.com/fonts/font_rend.php?idt=f&amp;id=19910&amp;rt=a&amp;rs=388" rel="nofollow" class="link-external">Helvetica</a> and <a href="http://www.fontshop.com/fonts/font_rend.php?idt=f&amp;id=20744&amp;rt=a&amp;rs=388" rel="nofollow" class="link-external">Neue Helvetica</a> are easy to tell apart. What’s used in the above <a href="http://typophile.com/files/helvetica-poster_4215.jpg" rel="nofollow" class="link-lost">poster</a> is certainly the <em>Neue</em> variety. Historically, there were so many <a href="http://www.fontshop.com/fonts/font_rend.php?idt=f&amp;id=19880&amp;rt=a&amp;rs=388" rel="nofollow" class="link-external">Helvetica versions</a> developed, adjusted, customised, &amp;c., for various typographic media and uses. None of them compares to the original Helvetica Medium, née <a href="/files/haas01.jpg" rel="nofollow" class="link-kept">Neue Haas Grotesk halbfett</a>.</p>
