      <p>Chances are that the ‘real thing’ you’re looking for is Helvetica Bold, with rather tight (or very tight) tracking.<br>
      That’s what you see in the famous works of <a href="http://www.experimentaljetset.com/archive/seizoen0506_1.html" rel="nofollow">Experimental Jetset</a> or <a href="http://www.thedesignersrepublic.com/" rel="nofollow">The Designers Republic</a> and even on the <a href="http://www.helveticafilm.com/shop.html" rel="nofollow">packaging of Helvetica – The Film</a>.</p>
      <p>Besides that, I second Dav-</p>
