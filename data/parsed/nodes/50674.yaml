      <p>In general, with Type1 (and OTF), you have very limited possibilities for hinting.<br>
      Hinting is a very important thing, but working on it is a big effort, repaid mostly if you generate TrueType or TrueType based types.</p>
      <p>My friend Fabrizio Schiavi is one of the few designers (not only here in Italy) putting a lot of care into hinting (not being a large enterprise, I mean). When he designed his typeface Sys:<br>
      <a href="http://www.fsd.it/fonts/sys.htm" title="http://www.fsd.it/fonts/sys.htm">http://www.fsd.it/fonts/sys.htm</a><br>
      he adjusted the geometry of the forms to help the hinting process.<br>
      Our common friend Oded Ezer (<a href="http://www.odedezer.com/fonts.html" title="http://www.odedezer.com/fonts.html">http://www.odedezer.com/fonts.html</a>) asked Fabrizio to design a Hebrew version (you can see it in the page I linked: scroll down, it should be called "Systeza", with Hebrew writing). To work on the hinting requires a thorough dedication, and I prefer to concentrate on the design as a whole. Besides, it's such a "technology dependent" thing that I'm unsure if it's worth such a big effort in the long term…</p>
      <p>I have the impression that this thing of the word roots is the most wonderful character of Hebrew language, although I don't know them. I have epiphanies each time I get into the meaning of a word. Not something you have to "rationally hold". It's really like a gift you receive: as you get the "transversal" meaning of a word (even if it has been translated into Greek in later codes, it seems it holds a good part of this), whole worlds opens before you, at the innermost level…</p>
      <p>I understand Hebrew needs little kerning, if the letters are spaced evenly, but this goes also for Latin, if you take enough care to design well-thought forms.<br>
      Of course, any cursive form benefits from this, in any script…</p>
