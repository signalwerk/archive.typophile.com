      <p>"Hebrew letters are so beautiful"</p>
      <p>I'm back again...<br>
      I don't think all Hebrew letters are beautiful. Some are nondescript and others just don't fit to their fonts despite the best efforts of the designer. I take this to be true not because I sit on high and deign to judge on some "aesthetic" grounds which glyphs are inherently good and which are not but because I do have an objective measure. This is simply the number of times I have redesigned a glyph. Why it was redesigned doesn't need to be considered here. I can just take the number itself. I don't actually count design changes but I do remember making changes to certain glyphs again and again...</p>
      <p>The winner is <strong>Mem</strong>.  It has a stupid chubchik stuck on the top left.<br>
      Close runners up are <strong>Tet</strong> and <strong>Sin</strong> which should be different yet not too different.<br>
      Also <strong>Gimmel</strong> is has this stupid appendage on the lower left.<br>
      <strong>Lamed</strong> must be tall. The long neck is no problem. One makes it as long as possible. The problem with the Lamed is the lower part. Different designers have quite different solutions and so the designer is free to choose (or to be indecisive).<br>
      <strong>Tsadeh</strong> is a solid balanced glyph but Tsadeh Sofit is weak and spindly.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ugly_ducklings_4331.jpg"></div><p></p>
      <p>The version of the font is the last release.<br>
      Surely the next will be better?<br>
      Mike</p>
