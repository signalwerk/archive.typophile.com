      <p>piccic,<br>
      Thanks for suggestion to use "Automatic Text". The approach may be useful in a technical sense however it seems to me a step in the wrong direction.</p>
      <p>My situation is that I am able to read Hebrew if I know what it's about, if I don't know what the Hebrew text is about I have difficulty in reading it. If I have an audio of prose or singing then its much easier for me to follow the Hebrew. Using the keyboard to enter Hebrew is very slow and if nikud are involved it's quite painful!</p>
      <p>It seemed that to make a font fluid and natural I had to develop some new skills. Fortunately, the Internet has come to the rescue. I can listen to any part of the Old Testament and follow this in a display using my own font. I have the choice of hundreds of Israeli songs on You Tube and for almost any Hebrew song can find the lyrics in Hebrew. For many songs the Hebrew transliteration and English translation may be found.</p>
      <p>Listing to a song and following the text displayed in Mike Hebrew has greatly improved the way I "see" the text. In particular I can now see whole words rather than letters.</p>
      <p>To test a font I seek to choose expressive texts as much as for my enjoyment as for a technical goal. On my web site are some examples.  I have about thirty texts with audio (or video) to match and am using these to improve the shape of common words and also the appearance of the entire page.</p>
      <p>Mike</p>
