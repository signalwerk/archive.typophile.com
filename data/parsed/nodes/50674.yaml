      <p>Thanks for your comments. The idea of designing a Latin face from scratch is daunting!</p>
      <p>To complete my presentation of the problem, may I introduce "Mike Hebrew Italic".</p>
      <p>This was developed from my calligraphy of prayers, biblical texts and poems for relatives or friends. The font resembles my hand lettering style but with some idiosyncrasies and flourishes removed. Here it is “Mike Hebrew Italic”.</p>
      <p>The italic form posed a real problem for the Latin letters and the numerals: Which way should they lean?  I decided they should be slanted the same way as the Hebrew. The reason for this should be apparent from the next example </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bialik_italic_with_dates_5737.jpg"></div><p></p>
      <p>The Latin in this font can't be used for a block of text. It just looks ridiculous! So if we want a side-by-side Hebrew and English translation of a poem, the Mike Hebrew family doesn't have a suitable match for the Hebrew.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jonatan_italic_4388.jpg"></div><p></p>
      <p>In the above poem by Rachel, both fonts are Mike Hebrew with the Hebrew in italic and the English in regular. The result is less than satisfactory. I don't have any idea of what to do about this. Of course the layout designer could chose a different font for the English but would have problems matching baselines, sizes etc.</p>
      <p>Mike</p>
