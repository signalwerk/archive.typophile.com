      <p>Open Type<br>
      Many of the very advanced topics that cause hundreds of posts on this special interest group for Hebrew are tackled using OpenType.  I'm truly impressed by the expertize and energy that goes into it!<br>
      In my simple way, I have been using Font Creator (<a href="http://www.high-logic.com" title="http://www.high-logic.com">http://www.high-logic.com</a>). This is a relatively inexpensive tool and is about as complex as I should care to learn. There remains a great deal of functionality in Font Creator which I havn't yet utilized. The tool is excellent for TrueType but doesn't support the added functionality of OpenType. </p>
      <p>The Mike Hebrew font family has a lot of potential for improvement within TrueType without the added problems of OpenType development.</p>
      <p>There are two areas of functionality in Font Creator which I haven't yet used.<br>
      1) Kerning - Israel, You are right in your suggestion that the font would benefit from this.<br>
      2) Transformations using scripts e.g to go from regular to bold.</p>
      <p>Mike</p>
      <p>---------------------------------------------------------------------------------</p>
      <p>Michael Cunliffe Thompson<br>
      Seascapes and Landscapes of New England and...<br>
      Hebrew Calligraphy at <a href="http://cunliffethompson.com/font" title="http://cunliffethompson.com/font">http://cunliffethompson.com/font</a></p>
