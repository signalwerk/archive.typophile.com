      <p>piccic,</p>
      <p>Are you trying to make an ancient Greek typeface for the Bible? If yes, perhaps, we can work together here, as I was to do similar projects that I am doing for Biblical Hebrew, for Ancient Greek, Vietnamese, Thai, and other languages.</p>
      <p>I use FontLab, but it was renamed as FontStudio. I think that it's the same thing.</p>
      <p>Do you have a Macintosh or Windows (XP or Vista?) ? If you have a Mac, then you can download a free demo at <a href="http://www.fontlab.com/font-editor/fontographer/" title="http://www.fontlab.com/font-editor/fontographer/">http://www.fontlab.com/font-editor/fontographer/</a>. Try it. It is very intuitive and easy to use, but lacks some of FontLab's or FontStudio's capabilities (but FL or FS lack very basic simple things that Fontographer can do on the editing level.</p>
      <p>Hence, I use Fontographer as an editor to create the font. Then, I use Font Lab or Font Studio to generate the font as TrueType, and add any advanced features that it offers. Then, I complete the TrueType font in Volt, say the project. Close Volt. Then, I reopen the TT font in FL or FS, and generate it again as OpenType. Then, I reopen Volt, open the OpenType font, import that project, and "ship" the final OpenType font.</p>
      <p>Be sure to append all the names, as .volt (in Volt) or .fl (in FontLab or FontStudio) to avoid confusing then. I call the final shipped product just its font name with no suffixes, but save it in a special folder.</p>
      <p>If you do not use Volt, then I don't see how you could contextual substitute without the GSUB routine, or accurate placement of diacritics without the GPOS routine.</p>
      <p>About decompossing glyphs, I need more information.</p>
      <p>Two last things about Volt and FL or FS, </p>
      <p>1) All development work you did in Volt can be saved 100% in a project file, and only in part in the shipped final OpenType font,and totally lost if openned later in FL or FS.</p>
      <p>2. The number of glyphs in FL or FS must correspond exactly to Volt, or everything goes haywire.</p>
