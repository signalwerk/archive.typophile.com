      <p>&gt;<cite>I understand Hebrew needs little kerning, if the letters are spaced evenly, but this goes also for Latin, if you take enough care to design well-thought forms.<br>
      Of course, any cursive form benefits from this, in any script…</cite></p>
      <p>Depending upon the design, certain Hebrew letter pairs create large gaps of empty space, that can be significantly reduced by kerning.</p>
      <p>For example, the beit ב by nature protrudes a little on the lower right. When the daled ד or reish ר are in front of the beit: דב רב , there is a gap that can be reduced through kerning, or if there is no nikkud a ligature can be created for the pairs in FontLab (or another font editor), and a GSUB routine can be defined for them in Volt.</p>
      <p>Cursive or handwriting fonts are very complex, and could benefit enormously from ligatures, or even other amazing effecta.</p>
