      <p>A good font goes through stages of improvement in its development.</p>
      <p>Let's put on our critique hats now.</p>
      <p>I suggest that your font needs to be kerned properly, so that certain letter combinations appears more evenly spaced.</p>
      <p>I suggest the side-bars be adjusted to give it slightly more space between the letters.</p>
      <p>Spacing, like kerning, is a very subjective issue. As they say, "some like it hot". More space, less space. Kern close, kern far. As they say in Hebrew, "טעם וריח אין להתווכיח" - "Taste and smell can not be debated"; or in English, we say: "Beaty is in the eye of the beholder".</p>
      <p>In general, the rule is greater space and further distance in kerning when the text size is less; less space and closer distance (or even very little and sometimes overlapping) in kerning when the text is more.</p>
      <p>I think that this is related to overall text "color" - the relationship between black and white (space). When text is small, more white is needed to create a blanced effect. When text is large, less white is needed to create a balanced effect.</p>
      <p>Likewise, readability and easier comprehension results when letters are farther apart at smaller text sizes. Greater aestetics is achieved when letters are closer, even touch, at much larger sizes.</p>
      <p>That's my two cents.</p>
