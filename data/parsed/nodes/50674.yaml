      <p>Mike,</p>
      <p>I like your two Hebrew fonts. The style is both script-like and informal, yet very readable and clear.</p>
      <p>Each though each typeface has different qualities. So to share a single name, and just to be distinquished by their recommended use, does not do design justice to them.</p>
      <p>I agree that the Latin faces, though well chosen in terms of weight and clarity, don't really match in ideal terms.</p>
      <p>Because of the informal and stylistic qualities of the Hebrew, why not try to create a matching set of Latin faces, too?</p>
      <p>The English is very "straight" and block-like. The Hebrew "moves" much more, adding movement to its informality. This is not at all reflected in most Latin faces. Hence, due to the inherent "straight-ness" of the Roman letter forms, I beieve that you need an unconventional Latin typeface design, which I don't think exists yet.</p>
