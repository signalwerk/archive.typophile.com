      <p><code>Hence, since eye movement in Hebrew is to the left, I believe all Hebrew italic should lean to the left.</code></p>
      <p>A spontaneous question from a left-to-right reader:<br>
      Gohebrew said Hebrew does not have a tradition of an inclined italic writing style, but it seems Mike's alphabet is based on his handwriting, so – in some ways – we have a custom of writing Hebrew leaning left (at least in recent times).<br>
      The bottom line, in these cases, seems to me a question: «How does it look in Hebrew?»<br>
      Because, if you ended up leaning your handwriting it means it works good, and it's a good direction to explore.</p>
      <p>For the Latin complement it's not easy, but I would not worry excessively. Surely it would be a challenge to design a Latin face leaning left (however you try, it looks quite bad). But I think there should be a few faces doing this. In general, I would choose a quite "casual" face, it would work best than a traditional "text" face.</p>
