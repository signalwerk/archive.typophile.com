      <p>The leaning of letters is a debate among professionals. Should Hebrew follow the direction of English, towards the right, particularly since Hebrew has no italic tradition. The only true Hebrew italic is "David Italic" and it leaned to the right.</p>
      <p>When I worked at Font World (<a href="http://www.fontword.com" title="www.fontword.com">www.fontword.com</a>), I reversed its direction to lean to the left. I learned many decades ago that eye movement is an important aspect of fine art. Hence, since eye movement in Hebrew is to the left, I believe all Hebrew italic should lean to the left.</p>
      <p>Now, you are asking about a matching Latin font, if it should lean to the left or to the right.</p>
      <p>If Hebrew is the dominant language, and English is used to add a word or two or three to the Hebrew paragraph, my view is the English should lean to the left as well. Again, this follows the principle of eye movement.</p>
      <p>If each language is dominant, like in side-by-side text, it's debatable. Do we follow the principle of eye movement, and lean the Latin font to the right,or do we follow aestetics and match the English to the Hebrew (as Hebrew really is the dominant language, and English is secondary)?</p>
      <p>My view is that both languages should lean to the left, as in your title. </p>
      <p>Again, your style is informal and non-level like much handwriting. Hence, you need to create either a hand-written like font to match (it's not so daunting), or find a more informal existing font (I'm sure it's there somewhere, but it won't match exactly).</p>
      <p>I suggest to look and find it, and then modify it in Fontographer or FontLab to match exactly. Weight and kerning is a big issue. If you plan to also create a "smart" version in MS Volt in OpenType, then FontLab is a better option than Fontographer (although Fontographer has a minimal learning curve).</p>
