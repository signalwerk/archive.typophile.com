      <p>Hi, many thanks for your answers! :=)</p>
      <p>So it's not uncommon at all to have sloped handwriting/calligraphy in Hebrew, right?<br>
      I guess it's pretty natural, it's quite common to lean sligtly towards the handwriting's direction when you start writing quickly.<br>
      Some 7-8 years ago, frustrated by the way people tend to use the keyboard even for the smallest writing tasks, I started to pick up again handwriting and to use it extensively.<br>
      This brought me back to the habit of using small capitals for emphasis, and as the need arose to write quicker, I realized I started to develop a lot of ligature between the capitals.<br>
      It's fascinating, since you actually see how naturally more cursive forms (in any script) develop from more "affirmative" forms, like the capitals.</p>
      <p>Hebrew letters are so beautiful, but I have not had the opportunity to get into them properly yet (I'm currently trying to acquire some familiarity with the Greek alphabet first). I have some things about the dead sea scrolls, and I recall we have a lot of examples of ancient Hebrew in our "Archivio Paleografico Italiano" (which I can check at our library Estense, here in Modena). I'm sure I took some picture of a passage from Isaiah.<br>
      Coincidence, I went to the cemetery a few days ago on the festivity of the dead, and I visited also the Hebrew section in the cemetery. It's a pity, since nowadays the Hebrew community is pretty small, and the cemetery is quite barren and left to itself.</p>
      <p>During the seventies… I guess you were listening "The Orange Season is Over" by Tamouz all the way… :=)</p>
