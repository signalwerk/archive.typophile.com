      <p>Mike, no matter what the letter forms of the script are, I still think you'd get an ideal basic spacing by doing a comparative text for each glyph. I.E. if you are evaluating an Aleph, use a similar string<br>
      |א| OאO SאS IאI VאV  סאס באב ןאן שאש</p>
      <p>Add as many comparision pairs as you need, and compare them in subsequent lines.</p>
      <p>Only after that, start by evaluating actual text, and only when you are entirely satisfied with the basic sidebearings, then start to consider adding some kerning…</p>
