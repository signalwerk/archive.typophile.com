      <p>piccic<br>
      If you go back far enough all Hebrew was written by hand. There are many reproductions in "The Book of Hebrew Script" by Ada Yardeni. I have just taken out my copy and I see that many early examples slope to the left. It was the Dead Sea Scrolls that inspired me to calligraphy and for some years my style was really a copy of this. During the seventies I lived in Israel and wrote a cursive that leaned to the left. I don't remember anyone commenting on this. In school they teach a vertical cursive however in Israel some people lean their handwriting to the right. The font "Yad" which simulates handwriting, slopes to the right.<br>
      Mike</p>
      <p>By the way I am right handed.</p>
