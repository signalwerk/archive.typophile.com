      <p>OpenType is only supported in a very minor way by FontLab.</p>
      <p>The free tool from MicroSoft, MS Volt, supports the very advanced features of OpenType.</p>
      <p>You can use any front end, FontCreator, Fontographer, FontLab to edit and create the fonts.</p>
      <p>Afterwards, you open it in MS Volt. After you create the "projects" with the advanced OpenType features, you then "ship" the font, with those features, but without the source code which created them.</p>
      <p>Then, in the programs that support OpenType in all its glory, your advanced OpenType font will operate in all its glory. The programs that do not support OpenType in all its glory (even though they do support a very limited form of OpenType), your advanced OpenType font will not operate in all its glory, but only in a limited way.</p>
