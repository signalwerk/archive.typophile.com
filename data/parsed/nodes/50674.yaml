      <p>I recall FontStudio or LetraStudio - one of them, I think the latter. I even bought it, as I later bought Icarus too and its big clunky scanner.</p>
      <p>But, I got a long string of very interesting jobs, like a Thai typeface for Smith-Corona (they needed the code in PostScript Type 3), a font logo for Estee Lauder in Cyrilic, fascinating candy wrapper logos in Arabic for Nestle of Canada (you typed it on the US keyboard and didn't have to know Arabic), Vietnamese, Georgian, Greek, Ukrainian, Belo-Russian etc.</p>
      <p>So, I had no time to learn them, even just ther interface.</p>
      <p>I kept with Fontographer until a few years ago. In the old days, the Altsys people were very kind and warm, and implemented most of my multiple pages of suggestions. I wish FontLab Studio had them. When Aldus bought them, they celebrated with a big bar-b-que in Plano, Texas. They called me in Rochester, NY, and very warmly invited me to join, which I would have. They claimed jokingly, "We're gonna have the biggest fattest juiciest steaks in the whole wide world! Please come. You'll drive down, join us, at sleep at Jon's house." I am an Orthodox Jew, who eats only kosher food and drink kosher wine. So, I refused politely, explaining it was one of my kid's birthdays.</p>
      <p>Anyway, I started a new blog. We can move this dialog to over there, and this cab be reserved for Mike's Hebrew stuff.</p>
