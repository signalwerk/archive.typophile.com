      <p>piccic,</p>
      <p>The real advatantages of OpenType are much greater than those related to file format or the way curves are defined. This is merely <strong>technical</strong>.</p>
      <p>There are also <strong>functional</strong> advantages, which few fonts have mastered yet, to my limited knowledge. These advantages are more seen in non-Roman languages and the placement of diacritics.</p>
      <p>The examples which you showed in the "this" link, about are very simple subsitutions. True, you don't need Volt to do this, as very basic substitutions can be done in FontLab (although I never saw anyone actually do this).</p>
      <p>Where Volt really outshines FontLab are the complex positioning of multiple diacritics under and/or over a base letter, as is required in Biblical Hebrew. This is achieved with the GPOS command. An ingenious way to address multiple diacritics is to first have them replaced by a ligature and positioned correctly. This is done with the GSUB command, which is processed before the GPOS command.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Diacritics_4270.jpg"></div><p></p>
      <p>At this time, it can not be done in FontLab, plus we do not see a graphic example, as OpenType programming is code-based, and not graphical, in FontLab.</p>
      <p>At this time, FontLab should be the font editor only. Or it could be Fontographer, or FontCreator. I personally prefer Fontographer's superior interface and flexible feature set to create the fonts. Then, I use FontLab to generate the actual but interim font file. Finally, I use Volt to do the heavy OpenType development work, and "ship" the final font product.</p>
      <p>I suggest that Mike uses the lower cost easy to use FontCreator, and then cost-less Volt to do the sophisticated stuff. He doesn't need FontLab, since he knows the FontCreator interface already.</p>
      <p>If he was focusing on Latin languages, he could center everything on one tool, like FontLab.</p>
      <p>Adam, I've been using Fontographer for over 20 years. I helped Jon Von Ehr at Altsys revamp Fontographer's interface and feature set from 1.x to 2.x to 3.x to 4.01. FontLab needs to be seriously overhauled. I suggest that you use Fontographer as a front end, as a wrapper for FontLab. Make one product in two versions, Light for $399, and the full version for $799.</p>
      <p>FontLab is a very powerful program, but a pain in 'a - -' to use.</p>
