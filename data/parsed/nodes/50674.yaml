      In FontLab I use anchors to define combined glyphs, although, of course, we do not have super-complex combinations. Besides, I generally prefer to draw accent glyphs specifically (I do not have experience yet, but I recall I edited some Polytonic Greek which my friend Panos designed for me, and I ended up getting rid of the "composed" accents to specifically design them. I mean, the "dieresistonos" accented letters made me redesign a custom combination of Dieresis and Tonos, since overlapping the two did not gave satisfactory results (you need to have enough space between the two dots of the Dieresis).<br>
      I don't understand what you mean by saying "an ingenious way to address multiple diacritics is to first have them replaced by a ligature and positioned correctly".</p>
      <p>As for FontLab, I never used Fontographer. I tried, but I totally hated the clumsy interface, although it was a very solid program. To design, I always used FontStudio, which was buggy but light-years ahead in terms of interface and glyph editing. Then, as FontLab came out I hated it as well, up to version 4.x. In version 4.x, everything changed. True, the interface is still quite a mess (too many buttons and ways to accomplish single simple tasks, and the menus organization is bad), but nonetheless it's an effective program. I often jump back and forth from FS to FreeHand while I design, since each program have unique ways to treat the drawing process (I often find useful to blend forms, and make curve editing in one or the other).</p>
