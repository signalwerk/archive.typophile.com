      <p>I think you should redesign your nikkud to match the letters better.</p>
      <p>The nikkud is too "straight" with 90 deree and 180 degree angles, which are traditional shapes for traditional designs.</p>
      <p>The font employs many non-traditional angles, which gives it its informal appearance. I suggest the nikkkud should be similar.</p>
      <p>In that way, if I set Hebrew poetry, which often has nikkud, the whole look would match.</p>
      <p>I would employ larger elements, with non-traditional and informal-looking nikkud to match the letters. Don't be afraid to increase the height of the nikkud. This allows the vertical strokes to be at an angle.</p>
