      <p>Mike,</p>
      <p>&gt;<cite>I am reviewing the design of the entire font so as to reduce or largely eliminate the need for kerning.</cite></p>
      <p>The truth is most every Hebrew typeface only requires very few kerning pairs.</p>
      <p>If you devote much thought and time to adjust the side-bearings, ie. the space on each side of the letter, very little effort must be spent on kerning.</p>
      <p>Kerning, as you know, adjusts the appearance of space between the letters. So, even though a kerning pair may reduce or increase the distance between the letter pair, the overall look will be improved, and the distance between all the various pairs of letters "appear" to be consistant.</p>
      <p>The classic pairs are the daled and gimmel (from right to left), and the reish and gimmel, as there is a perceived large gap between them, due to the right bottom void of the daled or reish, and the leftward incline of top of the gimmel.</p>
      <p>Other known pairs are the gimmel and daled or reish, daled and beit; zayin and taf, yud and beit; nuhn and daled; ayin and daled (sometimes); reish and beit; shin and taf (sometimes); taf and daled; taf and yud; taf and lamed; and taf and kuf.</p>
      <p>If you do not plan to use it for text with nikkud, you could make a set of ligatures in FontLad or any font editor, and then create an OpenType font in Volt which will automatically replace the pairs with the correct ligatures, and then the kerning could be put to rest. Good night!</p>
