    <p>So here it is. At least two people have wondered about my avatar. So here it is. It’s a monkey candle I picked up at a thrift store. The photos look gritty because it was shot with my pinhole lens on my digital camera, which requires that I shoot at ISO 3200 to get even the most basic of shots. </p>
