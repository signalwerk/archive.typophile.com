    <p>I’m working on a cosmetic redesign of the Martlet, the student paper for the University of Victoria, and I’m having trouble coming up with a good font combo for headlines and body text.</p>
    <p>Currently, we use ITC Slimbach for headlines and Warnock for body text. We’ve used Warnock for the last three years, but we’ve used Slimback, Baskerville, and Rotis Serif for headline fonts as well. Before that, we used Caslon Book for everything, and in the years before that it was Stone Sans for everything.</p>
    <p>My main goal for choosing a new font is to replace Slimbach. I chose to use it when I started this year, but I’m no longer happy with it. I want something that is a bit stronger and a bit more modern, but that isn’t too forceful and bold. Any suggestions? So far, I’m considering Cronos, Goodchild (by Nick Shinn), Laurentian (by Rod Macdonald), and Chapparal. We are an alternative student paper, so I’d like a font that reflects that by being a bit different and having suble little touches.</p>
    <p>A secondary goal is to use Canadian type, since we are a Canadian newspaper. I’ve contacted Nick Shinn and Rod Macdonald through email, and they recommended me some fonts to use (Goodchild and Laurentian, for example). I looked at Canadian type foundaries such as 2Rebel and Canada Type, but I didn’t see anything there that I felt was suitable.</p>
    <p>Third goal is to find a new body type that both prints well on newsprint and goes with the new headline font. This can’t really be decided upon until the headline font is decided, though. Of course, I don’t want to fix something if it’s not broken. I’m not happy with Slimbach, but I don’t mind Warnock at all. If it’ll still work with the headline font then I don’t mind keeping it. Some of the body types I’ve considered are Laurentian, Minion, Mercury, Nobel, Parable, Lexicon and Linoletter.</p>
    <p><a href="http://www.martlet.ca/special/martlet.pdf">Here’s a sample page</a> so you can see what the Martlet looks like now.</p>
    <p>All ideas/suggestions/critiques are welcome, of course.</p>
