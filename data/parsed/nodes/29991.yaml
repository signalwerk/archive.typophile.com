      <p>Slate looks great for your page, but do all of your headlines require the same weight? And do your decks need to be the same typeface as the main headline?</p>
      <p>Since the page folio is set in ITC Slimbach I wouldn’t change it. That’s really tempting the fates when you get into messing with page navigation. You could also keep Slimbach for use in photo captions and sidebars and things just to keep some kind on continuity with previous designs of this year. Continuity is very important when trying to establish a publication’s identity.</p>
      <p><cite>Also, I may just be overthinking things.</cite><br>
      Bingo. Just because you’ve been staring the typeface eye-to-eye daily for eight months doesn’t mean that everyone else has. Most readers are not in the same contact with it as the designer. That’s why I caution large or dramatic changes. If you do overhaul things, do it slowly, bit by bit. That way your redesign will be more transparent to your readers.</p>
