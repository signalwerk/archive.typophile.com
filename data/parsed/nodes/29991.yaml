      <p>Thanks for the feedback, everyone.</p>
      <p>seventy7: I mentioned Linoletter, Nobel, and Minion just because they had caught my eye when I was looking through type catalogues. When I tried them out, Linoletter didn’t fit, but Minion might work. I don’t have Mercury on hand, so I can’t try it out to find out for sure. </p>
      <p>londontype: Thanks for the suggestions, but I don’t think Lido fits with what I’m going for since it looks so much like Times. I’ll download it and try it out, though.</p>
      <p>John: Goodchild is nice, but the version of Cartier I found (<a href="http://www.fonts.com/FindFonts/detail.htm?pid=203132" title="http://www.fonts.com/FindFonts/detail.htm?pid=203132">http://www.fonts.com/FindFonts/detail.htm?pid=203132</a>) looks a bit too distressed for headlines.</p>
      <p>DanGayle: You have a very good point about the importance of body copy, and I guess I hadn’t considered the impact of possible changes enough. The headline font has changed every year, but Warnock has been the body copy typeface for over going on three years now. Like I said, I certainly don’t want to fix something that isn’t broken, and I don’t think Warnock really is broken. But I do really want to change away from Slimbach, and I was concerned that the new headline font I chose wouldn’t work with Warnock.</p>
      <p>I originally choose Slimbach based on just browsing through the Adobe FontFolio when I was preparing an example paper for my job application. I liked it then because it was bold, but not overpowering, and it had some personality to it with the calligraphic touches. But as I’ve been working with it over the past eight months, it’s started to look more dated and too weak. Maybe it’s just the same effect as looking at a single word for too long: you notice the letters gradually, exaggerate them, and eventually the word doesn’t even make sense anymore. </p>
      <p>I am fighting for more options and diversity, but I’d also like to bring more of a sense of strength and seriousness to the page, but not have it be overpowering. Also, I may just be overthinking things.</p>
      <p>As for using Officina Sans for headlines, I think that at display sizes it starts looking too rounded and even a little bit like marker writing.</p>
      <p>Rod McDonald sent me his new Slate Condensed typeface, and I think it’s pretty close to what I’m looking for. It’s solid without being overpowering, and it’s Canadian. I’ve only been able to get four staff to comment on it so far today, but they all seem to like it.</p>
      <p>Here’s links to versions of the pages with different font combinations. These are still tests, so any letterspacing or other fine adjustments aren’t final.</p>
      <p><a href="http://martlet.ca/special/tests/chapparal&amp;warnock.pdf">Chapparal &amp; Warnock</a><br>
      <a href="http://martlet.ca/special/tests/cronos&amp;warnock.pdf">Cronos &amp; Warnock</a><br>
      <a href="http://martlet.ca/special/tests/goodchild-b&amp;warnock.indd.pdf">Goodchild &amp; Warnock</a><br>
      <a href="http://martlet.ca/special/tests/laurentian&amp;warnock.pdf">Laurentian &amp; Warnock</a><br>
      <a href="http://martlet.ca/special/tests/officina&amp;warnock.pdf">Officina &amp; Warnock</a><br>
      <a href="http://martlet.ca/special/tests/slate&amp;warnock.pdf">Slate &amp; Warnock</a> (my current favorite)<br>
      <a href="http://martlet.ca/special/tests/slimbach&amp;warnock.pdf">Slimback &amp; Warnock</a><br>
      <a href="http://martlet.ca/special/tests/slimbach&amp;goodchild.pdf">Slimback &amp; Goodchild</a><br>
      <a href="http://martlet.ca/special/tests/slimbach&amp;calisto.pdf">Slimback &amp; Calisto</a><br>
      <a href="http://martlet.ca/special/tests/slimbach&amp;minion.pdf">Slimback &amp; Minion</a></p>
