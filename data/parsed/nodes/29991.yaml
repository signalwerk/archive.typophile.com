      <p>There is a definite hierarchy to the elements in a newspaper’s design. Be careful before changing things too much, because you threaten to undermine the stability of the entire works.</p>
      <p>The body copy comprises the bulk of the paper and as such it forms the main identity of the paper. Even though most people can’t tell the difference between Warnock and Bodoni, they still <cite>feel</cite> the difference. Changing the body copy will completely change the feel of the paper to a huge extent, more so than changing the headlines. Because of its importance, changing the body copy to better complement a new headline typeface is backwards.</p>
      <p>But as to headlines, here are a few things to think about:</p>
      <p>ITC Slimbach is a slightly condensed serif, which is a very good thing for headlines. It’s hard to find a decent condensed serif that doesn’t look squished. If you are to replace it with another serif, keep an eye out for typefaces with a decent condensed weight.</p>
      <p>Do you use other typefaces for decks or sub-heads? I notice that you use Slimbach medium for all display use. Maybe slipping in a complementary sans for subheads and decks would add enough change? Your photo credits use Officina Sans. It has a much larger weight range than ITC Slimbach. Have you considered increasing its use, especially since you already have the license?</p>
      <p>The reason I suggest subtle changes is that there was a reason you chose the use ITC Slimbach to begin with. What was that reason? My guess is that the reason is still valid, but you’re fighting for more options and diversity in the designs. Instead of replacing it altogether, sometimes just opening up the style guide a little makes huge difference. And it can also help organize the page hierarchy more clearly, a very nice bonus.</p>
      <p>For good Canadian type that might work well in newsprint, check out RTF Dokument or RTF Credo.</p>
