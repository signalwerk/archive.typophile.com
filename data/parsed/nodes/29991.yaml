      <p>If I’m not going to be using Slimbach for headlines, then I’d prefer to eliminate it entirely for consistency’s sake.</p>
      <p>You also have a good point about continuity, which is making me more and more reluctant to change the body copy from Warnock. But the Martlet often undergoes a lot of changes; there’s usually a mostly-new staff each year, along with a new look, and a new group of students who have never seen the paper before. In four months, the whole thing might change again when the next production co-ordinator joins on. So the identity of the Martlet is often in a bit of flux, and depends more on the editorial purpose and goals.</p>
      <p>This does give a good oppportunity for experimentation with design and layout, which is what I’d like to take advantage of. The past production co-ordinators have all, except for one, put in their end-of-year reports that they regret not experimenting more with the look of the paper. Of course, even if I don’t end up changing things in the final product, then at least I’ll have looked at the alternatives and learned stuff, which is the whole point.</p>
