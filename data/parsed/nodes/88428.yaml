    <p>Yes, I know it says Brandon Grotesque. </p>
    <p>I'm looking for other fonts that share the characteristics of the period (I think it's 1920s or 30s - correct me if I'm wrong)</p>
    <p>Pointy top of the upper case A when bolded<br>
    Perfectly round O<br>
    Pointy downward-pointing middle bit of the M<br>
    Gothic kind of R with the diagonal stick straight and more vertical than angled.<br>
    Pointy ends at the top and bottom of the N where the diagonal joins the vertical lines.</p>
    <p>Sorry I should know my type anatomical terms.</p>
    <p>Thanks for your help :)</p><div class="imageWrap"><img src="http://typophile.com/files/brandon_6552.jpg"></div><p></p>
