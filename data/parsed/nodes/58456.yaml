      <p>I think Bringhurst recommends this because he loves Renaissance printers and therefore he admires almost all of their practices. (“This rule […] was followed more often than broken by the best of the early typographers who set books in italic: Aldus Manutius, Gershom Soncino, Johann Froben, Simon de Colines, Robert Estienne, Ludovico degli Arrighi and Henri Estiene II”).</p>
      <p>I admire Renaissance printers as well, and I have no doubt that they were far better than us, but certainly some of their ideas are not good for contemporary use. </p>
      <p>I mean, I love Manutius, but when I use an italic font I want to see the caps sloped, not upright. Same for parenthesis.</p>
