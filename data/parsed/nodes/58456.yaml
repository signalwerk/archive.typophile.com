    html: <p>Aldo Novarese—ITC Novarese, all weights. He’s probably done that in some other of his many fonts, as well. One is also free to disagree with Bringhurst; much depends upon the font and angle of the italic; while the effect can be pleasing with italics of 7°–9°, such as Novarese Italic, Perpetua Italic or Futura Oblique, it can also be horrifying at the pseudo-italic (shudder) standard of 12°.</p>
