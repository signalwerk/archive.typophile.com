    html: |-
      <p>I slant those in most of my typefaces.<br>
      It looks silly to have a paragraph of italic text where everything is slanting--except a few odd characters.<br>
      However, I draw the line at © and ®.</p>
      <p>All these non-alphabetic characters (including figures) were traditionally not provided in italic founts, for reasons of economy.<br>
      But that's not an issue now.</p>
      <p>However, I decided to include italic parentheses as an option in some roman fonts, to cater to the Bringhurst set, and also to provide kerning for when a word or phrase in italic is bracketed within roman text, and the parentheses are necessarily upright because they are punctuation and not part of the emphasis.</p>
