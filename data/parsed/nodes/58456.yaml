      <p>I have proposed the following OpenType Layout feature to be added into the OpenType specification. Of course, if it's accepted, it will take quite a few years until it's actually implemented in any major applications, if at all. Nonetheless, I'll let you know once (and if) it gets accepted.</p>
      <p>Best,<br>
      Adam</p>
      <p>==</p>
      <p>Tag: 'uprf'</p>
      <p>Friendly name: Upright Forms</p>
      <p>Registered by: Adam Twardoch</p>
      <p>Function: Some italic fonts (such as ShinnType's Scotch Modern Italic or Peter Baker's Junicode Italic) will have both italic and upright forms of some characters in a single font: typically parentheses, other punctuation characters as well as other symbols such as mathematical characters or the © sign. This feature replaces the italic glyphs with the corresponding upright glyphs.</p>
      <p>Example: The user would apply this feature to replace ) with ). In some typesetting practice, when an italic phrase is enclosed in parentheses within text set in Roman type, the parentheses should remain upright rather than italic. When the user sets the parentheses using the Roman font, spacing problems may occur in pairs such as the italic "f" followed by the Roman ")". By including the upright alternate glyphs for parentheses in the italic font, the type designer can control the spacing and kerning behavior in such pairs.</p>
      <p>Recommended implementation: The uprf table maps the italic forms in a font to the corresponding upright forms (GSUB lookup type 1).</p>
      <p>Application interface: For GIDs found in the uprf coverage table, the application passes the GIDs to the table and gets back one new GID for each.</p>
      <p>UI suggestion: This feature should be off by default. Note that not all italic fonts have italic style-linking in the family, so this feature should be accessible for any font that includes it.</p>
      <p>Script/language sensitivity: Applies mostly to alphabets that have distinct upright and italic styles such as Latin, Cyrillic or Greek; note that many non-Latin fonts contain Latin as well.</p>
      <p>Feature interaction: This feature is mutually exclusive with 'ital', which should be turned off when it's applied. It may be used in combination with other substitution (GSUB) features, whose results it may override.</p>
      <p>== Revise feature description 'ital' ==</p>
      <p>In the feature description for 'ital', in the "Feature interaction" section, add as a first sentence:</p>
      <p>"This feature is mutually exclusive with 'uprf', which should be turned off when it's applied."</p>
