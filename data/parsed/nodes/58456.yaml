      <p><cite> &gt;I tend to think of it as throwing the “filter” of italicization (is that a word?) over the entire thing</cite></p>
      <p>Yes, but there are some other signs that typically are immune to this “filter”.</p>
      <p>Upright:<br>
      @ - – — | + ÷ ± ≈ ≠ ¬ ~ &lt; &gt; ≤ ≥ ^</p>
      <p>Italic:<br>
      <em>@ - – — | + ÷ ± ≈ ≠ ¬ ~ &lt; &gt; ≤ ≥ ^</em></p>
