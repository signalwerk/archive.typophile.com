    <p>In Bringhurst's <em>Elements</em>* he directs us to use upright parentheses, brackets, and braces even if the context is italic.**<br>
    <em>Not like (for example) this<br>
    but </em>(<em>rather</em>)<em> like this.</em><br>
    I'm curious: has anyone released a font in which the parentheses etc. slots in the italic font house upright glyphs?</p>
    <p>* section 5.3.2 in my version (2.5)<br>
    ** he does mention a special case (brackets that are part of a title) in which sloped brackets would be appropriate.</p>
