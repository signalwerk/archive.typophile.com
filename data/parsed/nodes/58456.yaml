      <p>So what's the point, exactly, of the upright parentheses? Craig's example looks pretty weird to me, and Bringhurst's argumentation à la "makes little sense" and "generally to be preferred" does not <em>really</em> help to penetrate the issue.</p>
      <p>I mean I understand that he says they aren't letters and an italicized parenthesis per se is a strange thing to conceive of; but certainly <em>if I'm speaking like this and including a (little) parenthesis in the process</em>, I really don't see why I should break the flow of the current italicization. <em>What if an entire paragraph is italicized – I tend to think of it as throwing the "filter" of italicization (is that a word?) over the entire thing. No way for a parenthesis to escape, and no apparent reason for that either.</em><br>
      And I mean, that question mark up there, the italic one, in the italicized parentheses, isn't a "letter" either – should it be upright too?!</p>
