    html: |-
      <p>So wait, what cooking oil does one use for dog meat?</p>
      <p>--</p>
      <p>Well, metal versions of Fry's (such as ATF's) had optical scaling,<br>
      so they worked fine. But to me Fry's is in fact different enough<br>
      that it's a shame it's called Baskerville. You have to remember<br>
      though that it was a clone, intended to cannibalize on the sales<br>
      of the original. Except both actually fared poorly on the market<br>
      at the time! It was the French who ended up saving it.</p>
      <p>BTW, Berthold later replaced that cut of Baskerville<br>
      with a much better one, done by GGL. Many people<br>
      think it's the best (digital) version out there.</p>
      <p>Lastly, don't forget Fountain's Baskerville.<br>
      It does happen to have the best "g" for one.</p>
      <p>hhp</p>
