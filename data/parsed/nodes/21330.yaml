      <p>Use Monotype Baskerville for text. It's a little light, but generally faithful to the original.</p>
      <p>If you try to use Fry's Baskerville at text sizes, you will not be happy. The hairlines are too thin to hold -- think Linotype Didot. Unreadable. It looks great at large sizes, especially if you tighten the letterspacing and tweak the kerning.</p>
      <p>As an alternative to Baskerville for text, try Utopia. It looks really good in a range of sizes.</p>
