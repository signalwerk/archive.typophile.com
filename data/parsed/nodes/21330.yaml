  html: |-
    <p>Is it appropriate to mix John Baskerville's Baskerville and Isaac Moore's Fry's Baskerville on the same page? The conventional wisdom, I think, is that Fry's Baskerville is a sharper face, more appropriate for display sizes. </p>
    <p>It's also interesting that there was a time when one could reinterpret a face, and both give credit to the inpiration while still taking credit (or blame) for the changes. I wish I could do that with a few fonts.</p>
