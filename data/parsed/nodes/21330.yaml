      <p>The date I have on Bitstream's Fry's Baskerville is 1990. A bit early for digital type foundries to consider reproducing from sizes larger than 10- to 12-pt.</p>
      <p>That heavy weighted cap to lower case weight and the reduced x-height though is far more technically traditional than the others shown.</p>
      <p>Gerald<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
