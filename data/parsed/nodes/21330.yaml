      <p>In response to speculation on the origin of Fry's Baskerville, here's an bit from <cite>An Atlas of Typeforms</cite> (James Sutton and Alan Bartram):</p>
      <p>"Fry's Baskerville is much later in feeling than the original, and has more in common with Bell or Scotch Roman than with Baskerville. This "improved" version was cut by Isaac Moore for Dr. Fry in 1769, and reproduced by Stephenson and Blake in 1913."</p>
