      <p>Erin, I just re-read your original post: I had missed the fact that you're choosing a font for a <em>novel</em>. Unless your novel can be set at a smallish point size you might like to find a font with a smaller x-height - I think Elmhurst will be less-than-deal at sizes typical of books. Tellingly, FontBureau's description of it recommends it for newspapers and magazines.</p>
      <p>hhp</p>
