      <p><em>Rolling Stone</em> has mostly used Elmhurst for headlines and display. I think it still shows up occasionally since the simplifying of the typography and the reformat last year. But I can't think of any instances of use in text.</p>
      <p>Have you downloaded the PDF specimen from Font Bureau's <a class="freelinking external" href="http://www.fontbureau.com/fonts/Elmhurst" rel="nofollow">Elmhurst</a> page and printed it out for yourself? Granted, that will not be the same as book production printing; but at least you can compare directly with whatever else you've been trying.</p>
      <p>Maybe Chris Slye will stop by this thread and chime in. He may know of some book examples and be able to steer you toward specific titles.</p>
