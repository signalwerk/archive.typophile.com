      <p>Hi there. Sorry I missed this thread the first time around.</p>
      <p>I made Elmhurst a long time ago as a text face. I didn't necessarily succeed, but I gave it a whirl. :) Funnily enough, <em>Rolling Stone</em> is the only place I've ever seen it in print, and they made very good use of it solely as a display face the entire time, for many years. Amazing.</p>
      <p>If anyone ever spots it used for text, I'd like to hear about it. Font Bureau does manage to sell a few copies here and there, so I suppose it must be getting used somewhere!</p>
