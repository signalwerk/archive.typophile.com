    html: |-
      <p>I think it's doing all the right things to be a text face. The fact that it's dark is congruent with its large x-height - you just have to set it a bit small (like 9 point). And it seems loose enough for smaller sizes too. Also, its descenders are nicely short, as are its caps. The fact that its most famous usage is for display says more about the user than the font.</p>
      <p>BTW, that "a" is one of my favorite forms. Blumenthal did something similar in his Emerson - although much of the credit for that should go to his German punchcutter Louis Hoell, who had cut a tellingly similar "a" decades prior in Bremer Antiqua.</p>
      <p>Lastly: A comparable font would be Iowan Oldstyle, although its descenders are a bit too long and it might not be dark enough to match its ample x-height. On the other hand, I've always liked Iowan's caps - quite majestic.</p>
      <p>hhp</p>
