      <p>I had an uncle who was a nuclear physicist. His first job was being a lab assistant on the Manhattan Project during the secret development of the atom bomb during World War II (he was in a betting pool at the lab on the yield of the bomb's first test and he bet it wouldn't work), and then he went on to work as a scientist at the Las Alamos Nationals Labs his entire career. But I never got the feeling that his income was high — always lived in a modest home, drove used cars, etc.</p>
