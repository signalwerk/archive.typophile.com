      <p>@ Caffeinomane: Yeah, great job with the logo! I prefer your version with the tubing; the broken |o| design could be just about anything.</p>
      <p>As a fellow physicist, I have to agree with you — our community is crawling with typographic crimes, with the use of red-on-blue Comic Sans on PowerPoint slides ranking among the mildest. Logos are particularly bad. The one linked below is a pretty mild case for science standards, just rather shrill, impractical, and unrefined. It represents a large-budget international consortium of European scientists that have been designing and building an instrument for the Very Large Telescope for the past 10 years or so. I haven't even tried to propose an alternative because it's so well-entrenched and design just seems to be everybody's lowest priority.</p>
      <p><a href="http://www.staff.science.uu.nl/~kelle105/Logos/sphere_logo.jpg" title="http://www.staff.science.uu.nl/~kelle105/Logos/sphere_logo.jpg">http://www.staff.science.uu.nl/~kelle105/Logos/sphere_logo.jpg</a></p>
      <p>And no, just because we get to use hugely expensive accelerators and telescopes doesn't mean we get paid well.  :(  The problem is that we're enthusiastic enough about our work to endure underpayment, non-existent job security, and the need to move to another country every 2–3 years.</p>
