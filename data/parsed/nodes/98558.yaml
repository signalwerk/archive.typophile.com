      <p>I say this very rarely: OMG.  :-)</p>
      <p>The rounding of the terminals and turns (do even more for the latter though) looks good, but I have to apologize for suggesting thinning the joins - that was a knee-jerk reaction and did not consider the nature of Biome... Actually you need to make the joins <em>thicker</em>. :-/ In fact even filling-in, like the joins in Biome. Also, I would use a darker weight, and space the letters tighter. And shorten the descender of the "p" (it seems to be overshooting the bottom spiral arm). Lastly, the overshoots of the spiral arms are different: the top-left one seems to be going further out than the bottom-right one; I would shoot for the latter degree.</p>
      <p>BTW, if you really have settled on Biome you might consider making the spiral arms shallow arcs, not totally straight.</p>
      <p>hhp</p>
