      <p>Thank you very much for your help to everybody!<br>
      And thank apankrat for your proposal which I like, but I prefer the idea of the tubing coming out of the cyclotron.</p>
      <p>Yes a cyclotron is a very expensive apparatus but the problem is that the people working on it are not well-paid, at least here in Italy. A plumber here earns more money per hour than what I am paid for giving lessons at the University.</p>
      <p>By the way, our institute does have an official <a class="freelinking external" href="http://www.infn.it/comunicazione/" rel="nofollow">pubblic relationships office</a>. I think that office should be the one taking care of the design of experiments logos and such. I am wondering, though, why is the official website for the PR office not even in english?<br>
