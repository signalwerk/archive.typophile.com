    html: |-
      <p>I just realized that it is better if I explain more about the experiment and the logo.</p>
      <p>'Apotema' means Apothem but it has nothing to do with the meaning of the word. It is just an acronym. With this experiment we aim to produce Technetium, that is a radioactive source used for scintigraphy, with a cyclotron, that is a particle accelerator. In a cyclotron, particles are put in the center and are accelerated following a spiral trajectory inside a cylindrical cavity and come out from one of more wholes on the side of the cylinder. The generated beam is forced to go through some tubing and just outside the cylinder it is forced to bend.</p>
      <p>The upper left logo is just centered on the meaning of apothem, so I used a regular polygon and emphasized one of its apothems.<br>
      The other logos are more centered on the experiment itself. The 'o' symbolizes the cyclotron and the lines, coming out of it, symbolize the tubing in which the beam goes along with the bend. The spiral inside the 'o' is the particle trajectory.</p>
