      <p>Now this is much better. It shows that you've put thought into it, made art direction changes instead of just slapping together elements that seemed to go together. </p>
      <p>I like the direction number 2 is going, this minuteman illustration is nice. Course, it still feels tacked on, making me think you can get away with just the logotype only. I would suggest beefing up the 's's and 'r's in Appraisals, they seem a bit too wispy.</p>
      <p>I might suggest a font pairing of Cezanne and Engravers (or something similar, like Farnham), for you Name, title and phone number later on. </p>
      <p>Another thing to consider would be printing methods. Something more hand-hewn or letterpressed would make this art direction really sing. Paper selection coupled with perhaps a foil-stamped logo would look awesome (I'm picturing an off-white paper with a Colonial Brick Red back and the logo gold-foil stamped) then you'll have plenty of white space to set the important contact info which will make it seem even more luxurious... i.e., an appraiser who knows his stuff and will appraise a little on the higher-end perhaps or he appraises quality homes. Anyway, it would equal more money for both of you.</p>
