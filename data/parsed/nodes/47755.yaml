      <p>Patriotism is the cornerstone to the birth of America. The ultimate unifier, as we fought for our independence from British rule. Most Americans understands the intrinsic history of what being a Patriot is... and it's not only being a soldier on the war front. It's an idea, a belief that when unified against something much bigger than you, you'll still have a chance to defeat it.</p>
