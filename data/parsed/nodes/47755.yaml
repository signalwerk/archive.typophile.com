      <p>As I said - fast, accurate and reliable next to an image of an armed guy has menancing undertones to me - but i'm definitely NOT your target market so take that with a grain of salt. Its obviously not a global company and you have to look at who you are designing for - if you think the solution will resonate with New England home owners then i guess you have your answer. </p>
      <p>In terms of the design i think the new version is an improvement, its less cluttered than the others. A couple of things i'd look at...</p>
      <p>- Generally i'd put the job title under Patrick's name then have a large bit of leading or even a line break between the job title and phone. Does the number need a preface/label? ie Mobile/Office/Home. Is there a website or email address too?</p>
      <p>- I don't like the gray line. You've now got a lot of white space that could more elegantly accomplish the visual seperation of logo/contact details. Seems like the logo is sitting a little low too, could it be nudged up? If you're still experimenting it might also be interesting to look at a version with the logo much smaller and maybe positioned up the top right corner?</p>
