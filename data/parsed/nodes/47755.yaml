      <p>Wow, what great and interesting comments (and some really good design suggestions as well). I certainly didn't expect a little minuteman to stir up a debate. A bit of a myopic view perhaps however given the project it just may be the view to have.</p>
      <p>I added the line because the figure seemed suspended in space, it sounds like it's an unnecessary element so I'll try without. I also tried the figure smaller, but he started becoming an indistinguishable blob - which just means he needs to be drawn better and I already knew he needed more work. As for making him less literal, I'm afraid he might truly then become just a guy holding a gun. The client had envisioned his card to have a figure. When we discussed using other symbols (doorway, column and etc. to represent real estate) it seemed odd to use the name minuteman paired with a symbol other than a minuteman. And to dberlow's question Does it need a figure at all? No, I think not, so I'll be getting to work on refining the figure and trying some strictly typographic solutions.</p>
      <p>Oh yes, and I agree with mad grab. Usually when working on logos I complete the logo and then move on to it's applications. This however is a start-up company that will be run out of his home. There will be no signage, no ads, no other applications (perhaps stationery for invoices at some point in the future) When I showed initial sketches, the client was concerned not seeing his name and contact info. Which is why I've been working on the whole of the card.</p>
      <p>Finally thanks again to you all for your thoughtful comments and suggestions. It's a small side job but that doesn't mean I want it to look like it's a small side job. Have a lot of work to do now. hopefully will post again soon.</p>
