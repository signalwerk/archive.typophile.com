      <p>Might I suggest dropping the minuteman figure and just using the elements that make him a minuteman... his rifle and hat, and constructing a logo image out of those 2 elements? </p>
      <p>Personally, I don't think you need the "Fast • Accurate • Reliable" on the front, but that might not preclude it from being used on the back. Unless this is a single-sided black &amp; white business card.</p>
