    <p>Hello all,</p>
    <p>I've been working on a business card project and could use some feedback. Minuteman3 is from the first round of designs and my friend was leaning towards this one. The art is from a famous statue that has also been converted into stock art. This piece is from my combo sketches from both sources. However it is quite common and has been used in many other logos. The name "Minuteman" is not set in stone, there is another Minuteman appraiser in another state. The client is thinking of just changing the name to "Minutemen" but I want to suggest changing it to "Connecticut Minuteman". Minuteman16 and 17 are revised with the name change and new original art. I also modified (the i and the u) in the Cezanne font a little to make it more readable. The new minuteman is more of an icon than drawing. I thought he would reproduce better and be more recognizable as a minuteman. However does the script style of font now work with a less sketchy style of image? I've been looking at this a lot on my own and could really use some fresh eyes.</p>
