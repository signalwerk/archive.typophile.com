      <p>Oh my, you need to step back.</p>
      <p>Things are starting to feel like a ransom note... all cut up and pasted where ever. </p>
      <p>Lets get this back to a decent start point. Stop focusing on the icon/image. Stop worrying about the guy's name, title, phone number. Stop worrying about where or if to include FAST ACCURATE or RELIABLE.</p>
      <p>You need to get a consistent logo. Is it just the Minuteman script or is APPRAISALS also part of the logo? </p>
      <p>Once you have that figured out and consistent... then you can start thinking about the tag line... which should be consistent as well.</p>
      <p>After that, then you can start focusing on the name/title/number... remember Hierarchy is your friend. The logo will be more important than the name, but the name should be more important visually than the title and phone number. As I suggested earlier, you can do this with type styles and weights. Bold/Italic or Small Cap/Regular weight... </p>
      <p>I'd even lay out a grid to work within. You're alignment is atrocious (number 23 isn't even centered and it's sooo tiny, you'd need a magnifying glass to read it.) </p>
      <p>Do one or 2 version and print them out, looking at them as a physical proof will be extremely revealing than just looking at them on screen.</p>
      <p>I don't mean to come off harsh, but things are definitely getting away from you. You're juggling more than you need to and you're losing focus because of it. </p>
      <p>It's just a business card, it's 2 inches by 3.5 inches... it's small; keep it that way. You'll never fit the Mona Lisa on it, so stop trying. Keep things simplistic, and add flavor with small embellishments.</p>
