      <p>I don't get a negative sense from the fact that the minuteman has a gun, and I want to lend support to your claim that the image evokes more of a sense of history and reliability than violence.  The pose you chose in this latest rendering reinforces this idea.  People that can't handle the historical fact that minutemen carried rifles need to get over themselves.  If your client is going to stick with the name "Minuteman Appraisals," then I think you need to stick with the guy holding a gun.</p>
      <p>Additionally, I think you're right about the cultural context of New England.  Having grown up in New Jersey, and now living in California, I've always been in a politically progressive context, and generally hold politically progressive ideas myself.  Nevertheless, now that I live in California, I've found many West Coast people annoyingly politically correct and considerably uptight about being laid back. (Before anyone gets too offended by my criticism,  mind you that my wife is a Californian.)  I think this business card is well executed and appropriate for the client's context.  As always, I'm open to dialogue and push back on my opinions, but sometimes West Coasters and Europeans need to understand the unique paradox of progressive, "politically incorrect" Northeasterners.</p>
      <p>--<br>
      Nick Hladek</p>
