      <p>I agree with Asvetic.</p>
      <p>Your bottom two are the cleanest, but they're still jumbled. You need to look at what's most important and set their font size and weight accordingly. Don't get too crazy with different sizes and weights though. Keep it simple.</p>
      <p>Can you cut "fast accurate reliable" out? I generally think that good companies can stand on their own without a tagline. I don't think anyone's going to pick a company based on a tiny tagline pasted on a business card. ie: "hmm I wonder if this company is any good. Oh look! It says they're fast, accurate and reliable! It must be true!" It really doesn't add much. If you do decide to keep the tagline, however, put it with the logo and not with the info for the guy - It's the company you're describing . . . not Patrick Henry.</p>
      <p>What size font are you using by the way? If it's any smaller than 8 or 9 pt. you need to scale it up.</p>
