    html: |-
      <p>Thank you all, I greatly appreciate your feedback.</p>
      <p>I'm posting a revised design but first I want to address David's concerns about an armed figure. My client and I discussed the impression of the minuteman holding a gun may have. However he really likes the tag line Fast Accurate Reliable. The minuteman is a strong historical national symbol, especially in New England. He represents the spirit and independence of the individual. That said guns certainly are a negative in modern society. Which is why we opted to go with a relaxed yet ready pose rather than a figure firing or aiming. In my first round of designs I did present versions with architectural elements (focusing on the real estate angle). My client felt that with the name Minuteman it needed to show a minuteman. He is considering a name change, so perhaps he will re-think the figure as well.</p>
      <p>I've simplified the overall design and drew a new minuteman (He still needs work). I also tweaked the second "n" so that it is not exactly like the first and thus appears more like handwriting. I kept the serif font, after trying many sans, with the name and colonial figure it just seemed too modern and out of place.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/minuteman18_4614.gif"></div><p></p>
    html_clean: |-
