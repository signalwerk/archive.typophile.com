      <p>………</p>
    <p>Great British Design?<br>
    Sixth annual Friends of St Bride conference<br>
    ===========================================<br>
    31 May and 1 June 2007</p>
    <p>The original St Bride Conference returns to London in 2007 with its<br>
    characteristically eclectic and inspiring mix of speakers, workshops,<br>
    exhibitions and events.</p>
    <p>At this year's conference Ken Garland will be nominating his top five<br>
    unsung graphic design masters 1950-2000:</p>
    <p>"I have chosen five - it could have been fifteen - four of whom will<br>
    be revealed only on the day; the fifth is Alfred Wainwright, the<br>
    author, artist, designer and publisher of his 'Pictorial Guides to<br>
    the Lakeland Fells', and I hope the other four will understand if,<br>
    given the limited time at my disposal, I give him the lion's share of<br>
    it. My choices are, of course, personal, but I hope to convince my<br>
    hearers that they are well worthy of their consideration."</p>
    <p>Ken Garland completed his studies in graphic design at the Central<br>
    School of Arts and Crafts, London, in the 1950s. He was Art Editor of<br>
    Design magazine from 1956-62, when he left to establish his own<br>
    graphic design studio as Ken Garland and Associates. Ken has written<br>
    several books on design, contributed many articles to design<br>
    periodicals in the UK, US, Europe and Japan, and has taught and<br>
    lectured all over the world. His photographic work has been seen in a<br>
    number of one-man exhibitions; the most recent being Metaphors, a<br>
    portfolio of text and image (Brighton and Coventry, 2002, Hull, 2003,<br>
    Glasgow and Portugal, 2004); The children of Bangladesh/The rickshas<br>
    of Bangladesh (Coventry and Reading, 2006).</p>
    <p>………</p>
    <p>For anybody interested in type and graphics, and their place in the<br>
    world, our conference is the event to see and be seen at.</p>
    <p>Come and join us for edification, conversation and visual provocation.</p>
    <p>Booking<br>
    =======<br>
    . Venue: St Bride Institute, Bride Lane, Fleet Street, London EC4Y 8EQ.<br>
    . Admission: £100/£50 for concessions (£150/£75 after 10 May)<br>
    . Contact St Bride Foundation:<br>
       lauranewport [at] stbridefoundation.org<br>
       020 7353 3331</p>
    <p>More information at <a href="http://www.stbride.org" title="www.stbride.org">www.stbride.org</a></p>
