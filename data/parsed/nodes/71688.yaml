  html: |-
    <p>Hello All,</p>
    <p>Looking to identify the primary typeface used on this site: <a href="http://msg.cordonmedia.com/msg.php" title="http://msg.cordonmedia.com/msg.php">http://msg.cordonmedia.com/msg.php</a></p>
    <p>It resembles New Republic but the characters are wider &amp; there is a noticeable difference between the "S"<br>
    and New Republic's "S".  This also seems to be a "light" type version &amp; I do believe New Republic does not<br>
    have a light version.</p>
    <p>Once the site load's select the center option "THE SUITE EXPERIENCE" once all of the animation finishes you'll<br>
    see a title (top left) "SUITES AT THE GARDEN"  it's a great example of the differences between the "S" character.</p>
    <p>Any help in identifying this typeface would be much appreciated.</p>
