    <p>Hey guys,</p>
    <p>So this is a set that i found in my letterpress lab at school, and it is labeled "adscript"<br>
    and since I can't find it anywhere I am sure that it was just a general name for it.</p>
    <p>Does anyone recognize this font?</p>
