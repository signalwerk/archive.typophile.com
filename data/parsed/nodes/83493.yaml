    <p>&nbsp;<br>
    <strong>Gerard Unger’s New Additions to the Linotype Library Combine Ancient and 20th Century Inspiration</strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has added the <a class="freelinking external" href="http://www.fonts.com/FindFonts/RecentReleases/2011/VestaBigVesta.htm" rel="nofollow">Vesta™</a> and Big Vesta typeface families to the company’s Linotype® collection. Created by award-winning typeface designer, Gerard Unger, and inspired by lettering from the republican period of ancient Rome, the 28 Vesta typefaces are available from Fonts.com for use in a wide range of 21st-century applications, from print to website design.</p>
    <p>Vesta’s name derives from the temple of Vesta in Tivoli, Italy, where inscriptional lettering on the temple’s frieze provided motivation for Unger. In the late 1990s, he set out to create a typeface for signage and wayfinding for Rome’s Jubilee 2000 celebration. He instead created a serif typeface for the festivities, at the request of his client. However, Unger continued to develop Vesta and integrate characteristics from French sans serif typefaces of the 1940s and 1950s, designs that favored a marked contrast in character stroke weights.</p>
    <p>“It’s rare for a sans serif typeface to have Vesta’s outspoken difference between thick and thin parts,” said Unger. “French typefaces from this timeframe were my inspiration for the stressed strokes. There is a slight difference between the thick and thin, and the letters are narrower.”</p>
    <p>“Unger masterfully orchestrated the interplay of weights within individual characters,” said Allan Haley, director of words and letters at Monotype Imaging. “Vesta and Big Vesta both receive high marks for legibility. They have slightly narrower proportions than most sans serifs designs, so less space is required – a big plus when you need to be more ‘space economical.’” </p>
    <p>Compared to Vesta, Unger’s Big Vesta features a larger x-height – the distance between the baseline and the mean line of lowercase characters – in addition to shortened ascenders and descenders, and tighter letter spacing. “As its name implies, Big Vesta is designed specifically for larger text sizes. It’s ideal for headlines, banners, billboards and environmental graphics,” Haley said.</p>
    <p>Dating back to the early first century B.C., the temple of Vesta holds typographic significance beyond Unger’s choice as a typeface name. The temple of Vesta has been considered the ancestral home of all sans serif typefaces. </p>
    <p>Available as OpenType® Pro fonts which also support most Central European and many Eastern European languages, Vesta and Big Vesta both consist of seven weights, ranging from light to black, each with a complementary, cursive italic. The Vesta family also includes small caps and old style figures.</p>
    <p><strong>Availability</strong><br>
    Vesta and Big Vesta fonts can be viewed, purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>. In addition, the new fonts are available as Web fonts for webpage design at <a class="freelinking external" href="http://webfonts.fonts.com/" rel="nofollow"> Fonts.com Web Fonts</a>.</p>
    <p>Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973 or in Europe at 44-1737-765959 (U.K.). Linotype may be reached at 49-6172-484-418 (Germany). Customers from other parts of the world may dial 1-781-970-6020 (U.S.).</p>
    <p><strong>About the Linotype typeface library</strong><br>
    Established more than a century ago, Linotype is a Monotype Imaging brand that represents exceptional quality typefaces for brand managers, designers, publishers, IT administrators and product developers. Influenced by its German and Swiss roots, the Linotype collection is home to some of the most widely used and celebrated typefaces in the world, including the renowned Helvetica®, Frutiger® and Univers® families. Typefaces continue to be released on an ongoing basis into the Linotype collection from some of the world’s most talented and accomplished type designers.</p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype and ITC® typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
