      <p>Interesting topic to come along as i am addressing this issue currently.</p>
      <p>I have a graphic treatment along with the identity in front in landscape. Then i have two versions of the back, one an appointment card and the other a business card, but both have the name and contact material on both. I tried to make it landscape, but it came off looking odd since I didn't want to use a light background. So i kept the format horizontal. This by the way is for a salon.</p>
      <p>I understand the practical reasons for perhaps not rotating type, but maybe we all are thinking too much when there suddenly has to be a conceptual purpose to designing a vertical business card. I have a card from MetaDesign and i really don't think there was a conceptual purpose behind it other than differentiation. Is that conceptual enough?</p>
