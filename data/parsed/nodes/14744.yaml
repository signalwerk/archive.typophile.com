      <p>I'm developing some stuff right now where 'being able to write info on the back' was desire voiced for the design. This pretty much eliminates dark/lush colors on the back, which is common for two-siders. It'll be conservative, but that's not a bad thing by any stretch. It's what's called for. I agree with blackbirdsign that concept and practicality really are married for business cards and sometimes the concept is catching the eye and mind of the recipient, even if they are inconvenienced at the rolodex.</p>
      <p>If any of you have Punchcut's business card (it happens to by laying on my desktop as I write this), they've got a portrait info side, landscape fluff side, type in different directions, and a slightly slimmer format. But all of these moves work with the very restrained type to show personality and interest without looking like a novelty or a little circus. Plus, the design allows them to be distinct but still have their name in big red caps for the rolodex users. Sacrifice a bit of convenience for a bit of distinction.</p>
      <p>If there's no reason not to make a business card stand out, why wouldn't you?</p>
