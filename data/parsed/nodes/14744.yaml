    <p>Hi Typos,</p>
    <p>What are people's thoughts about having a business card which is landscape on one side and portrait on the other? Does anyone have examples of this? I'd like to hear pros and cons of such a layout.</p>
    <p>I did a little quick research into how people hold/handle and flip cards, and was quite surprised that there are actually a number of different ways people do this.</p>
    <p> -t</p>
