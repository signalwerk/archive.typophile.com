      <p>I've had several cases where the front of a b-card was landscape and the back was portrait. My opinion is the left side of the front needs to be the top of the back. This works well for right-handed people. Also, there is a real world example of this that has been in use for many years. Your paycheck – all checks for that matter. Top of one side with the left of the other. That's my take.</p>
      <p>Strangely, I had an argument with a printer who kept ignoring my instructions on how I wanted this type of card setup. He insisted, as a matter of standards, that they always oriented the two sides right side to top. </p>
      <p>I've handed this type of card setup to unsuspecting people and watched how they flip it over. They get it right about half the time.</p>
