      <p>"People tend to get conservative out of fear, rather than actual needs, with their business cards."</p>
      <p>I used to agree with that until work with a very talented salesperson/account manager a few jobs back.</p>
      <p>He pointed out how truly functional business cards can become and that they really need to fit the proper use. His main point, which I've found is fairly true, is that many, many folks still use rolodexes and, as such, it's only a good thing to have a landscape card with all the pertinent info on one side.</p>
      <p>A flash b-card is still a great ice-breaker/memory-sticker, of course, so I now tend to make one side of the card practical, the other side flashy.</p>
