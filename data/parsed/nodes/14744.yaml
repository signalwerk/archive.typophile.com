      <p>If you put the hard info in landscape and the more promo/splashy stuff in portrait, that'd probably be the best. This way you do something unique on the attention-getting side and keep it traditional for the side most often used in organizers (as Jeffrey mentioned).</p>
      <p>Honestly, I don't think mixing them is bad at all, as long as you aren't ingnoring any usage issues specific to the project. People tend to get conservative out of fear, rather than actual needs, with their business cards. If it fits the project, I say go for it.</p>
