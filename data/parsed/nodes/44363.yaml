    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 17.Apr.2008 6.26am </div>
      <p>HAVE I GOT NEWWWWS FOR YOU! </p>
    <p>That’s what I say when I step out of the above mentioned vortex, and I’m wearing cooler clothes than the last time we spoke and you’re like wow, I thought he was dead but he was just in the future and he has newwwwws for ME! And this isn’t some lame “Back to the Future” thing with stupid flying cars, no, it’s vortexes, cool clothes, cool new ideas and a pair of shades that are either perched on my head or covering my eyes. It is the Electric Light Orchestra album “Time”, which is a real mind-blower, by the way.<br>
    HAVE I GOT NEWWWWS FOR YOU!</p>
    <p>Hall of Best Knowledge Book<br>
    Look, I am gonna be talking about this book for a while, as it’s just coming out and I am proud of it, so be prepared for this section to appear in every newsletter for the next while. I’m just sayin’ is all. Here are some HOBK related bits:</p>
    <p>- Early reviews are amazing! This is not me gloating, this is me relieved. People have ACTUALLY said the following things (except for one, can YOU pick the false one?)<br>
    “This is a life-passage story that reveals itself as such so slyly that the joy and loving humility it evokes at the end are breathtaking.”</p>
    <p>”...may best be described as the world’s funniest dictionary”</p>
    <p>“I tried to pet it and it bit me, it f***king BIT me, I mean, I paid through the nose for the thing and fed it and all that s**t and it f***ing bites me?”</p>
    <p>“A tremendously engaging work.. filtered through a dry sense of humor, an unusual set of narrative techniques and a surprisingly cohesive story in the end.”</p>
    <p>- The amazing people at Tiny Showcase are going to be doing a special secret promo for HOBK very soon. They’ll be selling a limited edition run that comes with something special that they commissioned from me. More info on that soon!     </p>
    <p>- There was an article in yesterday’s National Post about HOBK. </p>
    <p>- The official launch for HOBK is here in Halifax on May 14th—also happens to be the birthday when I turn SUPREME ANCIENT years old.<br>
    - I’ll be doing a mini micro tour to a couple cities for it in june, I think. Montreal, Toronto, NYC? More info on that later.</p>
    <p>COMICZS [sic]</p>
    <p>- I continue to have comics and art in Fantagraphics’ MOME Anthology. In the forthcoming Summer 2008 issue I start my Truth Bear comic, which I am already well into and will be serializing over issues to come. Oh, and in the very same issue there’s an interview I did with Gary Groth that contains all eight of my darkest secrets.<br>
    Here is a loong link to that issue: <a href="http://www.fantagraphics.com/index.php?page=shop.product_details&amp;flypage=shop.flypage&amp;product_id=1459&amp;category_id=152&amp;manufacturer_id=0&amp;option=com_virtuemart&amp;Itemid=62" title="http://www.fantagraphics.com/index.php?page=shop.product_details&amp;flypage=shop.flypage&amp;product_id=1459&amp;category_id=152&amp;manufacturer_id=0&amp;option=com_virtuemart&amp;Itemid=62">http://www.fantagraphics.com/index.php?page=shop.product_details&amp;flypage...</a></p>
    <p>- I am doing something that is like a comic, as a special commission for Tiny Showcase. This is something separate from the HOBK promo, and if it’s half as good as it is fun to work on then it’s going to be so outrageous that it will shoot a beam of light into space. That’s more “fantastic” than “outrageous” but I’m already on the next sentence and can’t go back. </p>
    <p>ART<br>
    - I have recently been drawing friendship bracelets, and plan to draw about 30 more.<br>
    See: <a href="http://www.flickr.com/photos/rayfenwick/sets/72157604576020105/show/" title="http://www.flickr.com/photos/rayfenwick/sets/72157604576020105/show/">http://www.flickr.com/photos/rayfenwick/sets/72157604576020105/show/</a></p>
    <p>ILLUSTRATION<br>
    - I am totally doing that! <a href="http://www.coandco.ca/ray/#id=illustration&amp;num=1" title="http://www.coandco.ca/ray/#id=illustration&amp;num=1">http://www.coandco.ca/ray/#id=illustration&amp;num=1</a></p>
    <p>VIDEO<br>
    - I am totally sort of doing that! <a href="http://www.flickr.com/photos/rayfenwick/2402991621/" title="http://www.flickr.com/photos/rayfenwick/2402991621/">http://www.flickr.com/photos/rayfenwick/2402991621/</a> </p>
    <p>Okay. I am, right now, late to meet a friend for the first skate(board) of the season, so I’ll leave things there. Don’t forget about the free stuff!</p>
    <p>Getting rad,<br>
    Eventually,<br>
    Ray</p>
