    <p>An infrequently occurring newsletter regarding engraving and all that pertains to social stationery.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/NSC_newsletter_V_BIG_5587.gif"></div><p></p>
    <p>In Issue Number Five read all about … incredible engraving from New Orleans c1862 … where do monograms come from … what to do when a friend has suffered a loss … mash notes from the real Mad Men era … what to do to get that job.</p>
    <p>Since its inception in the Dumbo area of Brooklyn in 2003, The Doctrinaire has been produced on Mohawk Superfine paper, a paper upon which we been engraving since since 1997.</p>
    <p>Now available on Mohawk Fine Papers curated shop, <a href="http://www.feltandwireshop.com/products/318" title="http://www.feltandwireshop.com/products/318">http://www.feltandwireshop.com/products/318</a></p>
