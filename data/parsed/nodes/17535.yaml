      <p>The best but very expensive approach would have been a Photofont with a custom size for each integer step from 5px to 72px. - Yeah right!</p>
      <p>But if I was able to create an anti aliasing method in pixen (almost pixel by pixel) in 2 weeks to make Photofonts look great on screen, the smart heads as Apple, Adobe and Microsoft should be able too. Why they don’t join forces in this is beyond me. Probably a pissing contest.</p>
      <p>Thing is that it’s not easy to do that for ALL fonts and currently the only ’global’ anti aliasing method that really works is ATSUI and even that I’d consider as the lesser evil, we’re not there yet. I should add that I read about 98% of my content on-screen. PDFs<!--
