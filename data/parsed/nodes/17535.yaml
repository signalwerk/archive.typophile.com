      <p>Weird, why does the alleged 1997 look better than Adobe’s or Microsoft’s font rendering.<br>
      It’s not about how accurate each nibble of a glyph is reproduced when viewed at an 80% view but how pleasing it is to the eye.</p>
      <p>With ClearType and CoolType I never fail to get an upset stomach when trying to read longer passages of text. Another reason why I got rid of the final Windows XP laptop here.</p>
