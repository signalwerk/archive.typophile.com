    <p>Attached is a screenshot of the recent Quark 7 Beta which display of type leaves Adobe in the dust. Quarks interface however remained in the late 1980’s though. The only ray of light of it’s interface is the multi pane window allowing for viewing master pages and their impact on the actual document pages, or multiple levels of zoom for your current page.</p>
    <p>Like Adobe, Quark failed with the font picker, engineer’s laziness or dumb oversight call it what you want. In any sane application I just hit CMD + T and get the system font picker with all categories I set up. For example I create a folder in FontBook for each current job containing all the fonts for the job in question. In Adobe apps and Quark XPress I just get a mile long list, duh - how stupid can one be?! I just don’t see the point in deactivating fonts - WAKE UP ADOBE, it’s 2006!</p>
    <p>That said, my layout application in the last few months was almost exclusively Apple Pages, to which I had to add a baseline grid “feature” to make it work for me. Only used InDesign for one deal where the template was in InDesign format already.</p>
