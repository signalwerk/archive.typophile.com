      <p>To your comment “why would we support a proprietary single-platform technology?” Easy answer: So you don’t stand out at the prime idiots on that platform. Every developer should live to the best they can on a platform, your comment would tell me that Adobe’s a lazy company - maybe not that bad, but close. </p>
      <p>I mean do you really wear snow-boarding attire when going to surf?</p>
      <p>The cascading windows feature of InDesign is more annoying than useful. I find the splitting of a window is nicer to the user as it cuts clutter and saves a few clicks.</p>
