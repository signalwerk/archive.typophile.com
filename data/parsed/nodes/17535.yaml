      <p>Interesting that you like that anti-aliasing better. The outlines are much more crisp, but the edge of, say, the large lowercase e looks very oddly angular and not as round as I know Warnock Pro is. But “de gustibus non disputandum est,” as they say.</p>
      <p>With regards to FontBook integration, I suspect the answer for both may be the same - “why would we support a proprietary single-platform technology? We want to be able to get the same results on both major platforms.” Certainly that would be my initial thought if somebody brought up the question internally. (BTW, why are you only angry at Adobe and not Quark on this point? Are your expectaions inherently lower for Quark or something?)</p>
      <p><cite>The only ray of light of it’s interface is the multi pane window allowing for viewing master pages and their impact on the actual document pages, or multiple levels of zoom for your current page.</cite></p>
      <p>That’s a fine feature. InDesign has had it for a while - not sure if it was new in CS2 last year, or how far back it goes. Just go to Window &gt; Arrange &gt; New Window.</p>
      <p>Cheers,</p>
      <p>T</p>
