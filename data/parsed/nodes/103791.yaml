    html: <p>I will second Nick's suggestion of drawing it yourself. I would also take care to rebalance the current "GEL" letterforms. They appear to be the result of some horizontal condensation so either thicken the verticals or lighten the horizontals. As it stand now it looks amateurish.</p>
