      <p>Offhand, I don’t know of any circle-based fonts that have that kind of “uncial” /E.<br>
      If it’s just the word EQUIPPED you need, as part of the logotype, why don’t you make it in Illustrator, to match the GEL letter style? That would take less time than trying out lots of fonts that obviously don’t match. It’s not as if there are any tricky letters like /S to draw.</p>
