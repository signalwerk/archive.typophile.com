    html: |-
      <p>My problem wasn't with the design choice of presenting information by horizontal scrolling.</p>
      <p>Rather, it was with the technical issue that although there was some very wide information there that needed horizontal scrolling to access, it was also true that the page was still, <em>in addition</em>, somewhat too tall to allow me to see everything in my browser vertically, <strong>and yet</strong> no vertical scroll bar was available to remedy this, even though the browser would normally automatically provide one - because the technology they used to display the page with a horizontally-scrolling element suppressed that natural response of my browser.</p>
      <p>Just before the text "Bonesana is a very sober transitional typeface in the style of Baskerville...", the heading, "Bonesana" is cut off, and I cannot move upwards to see the top of it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bon_scrsh_4554.jpg"></div><p></p>
