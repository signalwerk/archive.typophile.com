    <p>I noticed that the web site for the lovely font Bonesana,</p>
    <p><a class="freelinking external" href="http://www.nonpareille.net/en_GB/page/bonesana-np" rel="nofollow">http://www.nonpareille.net/en_GB/page/bonesana-np</a></p>
    <p>is seriously flawed. Although the page is too large vertically to fit in my browser, and my screen is reasonably large, the page only allows itself to be scrolled horizontally. (I was viewing it with Firefox, should that make a difference.)</p>
    <p>What <em>is</em> it with these web designers? A beautiful web page reflects well, but one that does not even work in the simplest ways undermines one's ability to be taken seriously. And, of course, this was a consequence of using the most advanced web technologies to give control over the appearance of the site.</p>
