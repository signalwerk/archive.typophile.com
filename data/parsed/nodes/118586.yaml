      <p>Speaking as someone who designs websites, some designers tend to ignore a basic tenet of good design, which is that form should follow function. In other words, cleverness tends to take precedence over what the website is actually meant to achieve.</p>
      <p>There's nothing inherently wrong with the concept of horizontally scrolling websites, but like the website in question, they tend to annoy some visitors, and their novelty runs the risk of being more noticeable than the content of the site itself.</p>
