    html: |-
      <p>Dwiggins was a great admirer of Cheltenham (having selected it for his subject when asked by the Eastern Paper Company to create a broadsheet specimen of his choice for them).</p>
      <p>At one point, he toyed with his own design inspired by and based on some of the Cheltenham proportions and characteristics. In the end it came to nothing.</p>
      <p>During the course of this short-lived experiment, C.H. Griffith sent to WAD a package with this note: "For such interest as it may have, I am enclosing a photostat reproduction of the original Goodhue drawings of Cheltenham. These drawings were subsequently modified by Morris Benton, resulting in the present Cheltenham Old Style letter. Benton's drawings were used for our cutting."</p>
      <p>To this Dwiggins replied: "The Goodhue drawing most interesting -- shows that he was a better architect than he was type-designer."</p>
      <p>-- Kent.</p>
    html_clean: |-
