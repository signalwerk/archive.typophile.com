    html: <p>Nick -- I'm not sure why you're referring to Benton's cleaned up and regularized Cheltenham as a "slab serif," or even a "toned-down" slab (as James qualified it). The original ATF Cheltenham shows, for the most part, rather thick, stubby, and heavily bracketed serifs. Not quite as filled-in on the hard stock of the 1923 catalog as the somewhat fuzzy reproduction that Mark posted, but still, not what I would call slab.</p>
