      <p>Okay, Nick. I suppose it's a matter of semantics. I consider the Cheltenham serifs more of a Clarendon structure -- bracketed, low-constrast, squarish ending. I suppose some consider Clarendon a slab-serif. But for me it doesn't become slab until there's no bracketing.</p>
      <p>I'm not contesting the essence of your point; clearly Benton shifted the design toward a low-contrast finish even while trying to maintain Goodhue's underlying letterforms.</p>
      <p>I think it's a little misleading, though, to compare the later Cheltenham family additions as the Benton characteristics became more pronounced as the family developed, especially in heavier wider styles. </p>
      <p>I think the original Oldstyle actually retains a fair amount of Goodhue's quaintness.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ATFCheltOS_3619.gif"></div><p></p>
