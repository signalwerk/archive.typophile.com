      <p>Thanks very much for posting the link to the Rosart specimen pages, Frank. The more time I spend with Rosart's types, the more impressed I am.</p>
      <p>Some of my favourite type specimens:</p>
      <p><em>Proeven van Oostersche Schriften.</em> Lettergieterij 'Amsterdam', Voorheen N. Tetterode. (Numerous editions; mine is 1915. Particularly valued for its Javanese and Buginese types.)</p>
      <p><em>Le Cabinet des Poinçons.</em> Imprimerie nationale, Paris. (Mine is the 3rd edition, 1963.)</p>
      <p><em>Specimens of Oriental Founts.</em> Cambridge University Press. (nd. but 1933.)</p>
      <p>The Berthold specimen of Hebrew types from 1924 is worth mentioning, although I don't like many of the types very much. It is a handsomely produced volume, showing off some extravagant colour printing and ornament use. It is also a sad thing to handle, as an artifact of German Jewry at the moment when the Nazi party was beginning its rise to power. The specimen was produced under the guidance of <a href="http://yaronimus.files.wordpress.com/2013/05/lubell.pdf" rel="nofollow">Joseph Tscherkassky</a>, who was saved from the Holocaust by being sent to be Berthold's rep in Brazil in 1930.</p>
    html_clean: |-
