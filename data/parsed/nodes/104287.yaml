      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DTL_type_specimen_4621.jpg"></div><p></p>
      <p>At <strong>No. 1</strong>: the loose-leaf type specimen of the Dutch Type Library. It contains more than 400 digitally (high-res) printed pages in black and red on <em>Mellotex mat</em> or <em>Promail</em> 115 grams A4 paper in a handmade linen binder. A matching –handmade, of course– linen slipcase is available also. Production costs of specimen and slipcase are quite a bit higher than the retail prices, by the way.</p>
      <p>Produced in small quantities over the past 15 years; normally sold-out almost immediately. Therefore 51½ weeks <strong>not</strong> available per year.</p>
      <p>FEB</p>
