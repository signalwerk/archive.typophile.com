      <p>Indeed, the specimens by Underware, including the one for Fakir are really well designed, produced, same as their fonts of course! I'm also quite fond of the specimens by House, which are vibrant books of typo-energy. </p>
      <p>But it depends of course, I mean, the specimens mentioned above are large, illustrated overviews, while the classical specimens, with waterfalls of wood-and-leadprint, are a journey of discovery which often show that even the most far-out ideas in type design have been done before.</p>
