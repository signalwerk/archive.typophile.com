      <p>ATF's big books from the first third of the last century. These were major printing operations using a huge range of metal type and included suggestions to printers for use. Printers were guided to styles that expressed the fashion of the day. Fascinating to see this change over the years. Digital versions at archive.org from University of Califorina and University of Toronto are good, ones from other sources are much less satisfying.<br>
      Don</p>
