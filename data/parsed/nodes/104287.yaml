      <p>Unfortunately, the only Enschede type specimens I could find online were really old ones.<br>
      But that search - or maybe it was a search related to the typeface Forma, instead - led me to learn about Deberny &amp; Peignot's Serie 16 - and the <a class="freelinking external" href="http://www.cataloged.cc/?pid=82" rel="nofollow">revival</a> of it currently being attempted.</p>
      <p>While the italic has definite idiosyncrasies, the Roman (at least its lower case) is very reminiscent of Century Schoolbook; thus, like some of the Scotch Romans by Fleischmann that I saw in those old Enschede type specimens, it approaches the canonical invisible typeface that I've been looking for (my interest in Textype was from this  quest as well).</p>
