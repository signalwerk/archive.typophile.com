  html: |-
    <p>Hello everybody,</p>
    <p>Expletus Sans is finally online, available for commercial use (web and print) for free! <a href="http://www.google.com/webfonts/family?family=Expletus+Sans&amp;subset=latin" title="http://www.google.com/webfonts/family?family=Expletus+Sans&amp;subset=latin">http://www.google.com/webfonts/family?family=Expletus+Sans&amp;subset=latin</a></p>
    <p>Many thanks to all typophiles who have helped me so much during the design process!<br>
    Italics coming in May.</p>
    <p>Cheers, Jasper</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/expletus-showoff_4942.png"></div><p></p>
