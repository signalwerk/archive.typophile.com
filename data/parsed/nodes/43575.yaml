    votes: null
    html: |-
      <p>Thanks Adam, that's a good point. </p>
      <p>Apple might disagree, since their TrueType 2.0 extentions are not part of OpenType, but for most purposes an 'sfnt' is an 'sfnt'. Best to avoid proliforation of MIME types. </p>
      <p>I still think there is a use to having a MIME type for type1 pf[ab], because there are still a lot around and the distinction between ASCII and Binary doesn't affect most font consumers (and the less common formats are ignorable).</p>
      <p>But you are right that an OpenType MIME is the most important.</p>
