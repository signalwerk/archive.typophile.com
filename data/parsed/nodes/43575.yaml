      <p>The "x-" namespace is inappropriate for opentype. It is for experimental stuff. And OpenType does not qualify as experimental.</p>
      <p>Yes, a better approach would be to get someone from the ISO opentype group to register<br>
         application/font-opentype.<br>
      And even better approach would be for someone from the ISO group to register a top-level MIME type for fonts and then register<br>
         font/opentype<br>
      Both of these require someone in an established standards group to spearhead the effort. The IANA will not accept requests from random people for such things.</p>
      <p>Which is why I suggested "vnd." -- because it is something which I could do without depending on others.</p>
