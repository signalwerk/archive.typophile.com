    html: |-
      <p>Well the thing which started me looking into this was someone involved with freedesktop asking about fontforge's sfd. That seemed pretty simple, something like application/vnd.fontforge-sfd.</p>
      <p>But if there were a convention for font types, then I should follow that. And if there is no convention for font types there should be.</p>
      <p>And that is really my question:<br>
      No one seems to have registered MIME types for the standard font formats with IANA. I think that should happen, otherwise there will be a proliferation of "x-" types with no consistency. Given that no one has done this, should there be a standard format like</p>
      <p>application/vnd.font-truetype<br>
      application/vnd.font-opentype<br>
      ...</p>
      <p>or should things be just</p>
      <p>application/vnd.truetype</p>
  - id: 268717
    user: 1133
    date: 2008-03-27T07:34:00
