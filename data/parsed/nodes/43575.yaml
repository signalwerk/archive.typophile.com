    <p>Someone asked me what the appropriate MIME type was for a FontForge sfd file.</p>
    <p>I can't find any MIME types for any font formats. The IANA registry list does not include any<br>
       <a href="http://www.iana.org/assignments/media-types/" title="http://www.iana.org/assignments/media-types/">http://www.iana.org/assignments/media-types/</a></p>
    <p>I see at one point there were discussions about getting a top-level MIME type for fonts<br>
       <a href="http://www.w3c.org/Printing/chase.html" title="http://www.w3c.org/Printing/chase.html">http://www.w3c.org/Printing/chase.html</a><br>
    but I presume that has since foundered as nothing seems to have come of it.</p>
    <p>So are there any existing standards I can't find?<br>
    If not, would</p>
    <ol>
    <li>application/vnd.opentype
    </li><li>application/vnd.truetype
    </li><li>application/vnd.pstype1
    </li></ol>
    <p>seem reasonable MIME types to try and register?</p>
