    votes: null
    html: |-
      <p>George, </p>
      <p>I think application/vnd.font-truetype is somewhat superflous. application/vnd.font-opentype obviously applies to both .otf and .ttf, and I can't think of a font that would need to have the MIME type application/vnd.font-truetype without it just being application/vnd.font-opentype. </p>
      <p>On the other hand, PostScript Type 1 is by no way a standardized data structure. You have the Mac FFIL and LWFN resource fork structures, you have the .pfb and .pfa data fork structures along with the auxiliary files .pfm, .inf and .afm. </p>
      <p>I think it would do good to just forget any attempt to clean the old Type 1 mess up and just proposed one MIME type for the one font format that is currently of interest, that is ISO/IEC 14496-22 (Open Font Format), also known as OpenType. </p>
      <p>Adam</p>
  - id: 268730
    user: 28793
    date: 2008-03-27T08:22:00
