      <p>Are you talking about the SFD (FontForge internal file format) or for the fonts generated (or both?)</p>
      <p>Since FontForge's file format is cleartext, the MIME type could any of the following I think</p>
      <p>text/x-fontforge<br>
      application/x-fontforge<br>
      application/vnd.fontforge-sfd<br>
      application/vnd.fontforge.sfd</p>
      <p>Although I think one of the latter two would be prefered in modern day coding.</p>
