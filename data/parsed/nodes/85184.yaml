  html: |-
    <p>I am considering to establish a kind of virtual meeting place for the users of Andron. It’s the field of rather highly specialized typesetting in the humanities and I’d like to provide a forum dedicated to the users, where they can discuss experiences and questions, work samples and so on. </p>
    <p>What might be the most suitable basis for such a site? Facebook? Google groups? A seperate domain?</p>
    <p>Any thoughts welcome.</p>
