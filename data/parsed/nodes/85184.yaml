    html: |-
      <p>I've not heard of Andron, and Google didn't reveal many clues. I'm interested. Could you describe it a bit more, and perhaps give us a link?</p>
      <p>Regarding a forum platform: Google Groups seems to work well for communication among relatively technical users. A Facebook group could be alright, especially for more technically naive users, but FB use tends to be seen as fairly personal and noncommercial. Another idea is a web forum, although I tend to hate the things myself.  The answer probably lies in what the Andron user base already uses: you want to make a forum easy to access, with few barriers. That's more important than finding some supposedly perfect system.</p>
      <p>--John</p>
