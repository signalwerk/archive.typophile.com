    html: <p>Well, obviously the Y could use the same glyph of the 4, like you did with the 6/G, and the 2 suggestion by Shreyas is very good. I disagree with Hrant, the whole feeling of Digitize is something way beyond "numbers as letters", it's "letters as numbers" as well, and back again. I think it is very intriguing. <br>Whi don't you call it "Digitease", the sound is similar and it could mean Digitize, Digi-tease, and Digit-ease at the same time. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
