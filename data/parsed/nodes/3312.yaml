    <p>Okay so here's my first go at posting something for critique. I'm somewhat timid about posting anything here for fear of being ripped to shreds, but you don't learn without some mistakes along the way huh? Anyhow, here are two projects i've been playing with (thats what type design is for me. i'm sure you'll be able to tell!) <br>The first, Seventies Schoolbook, is based on letterforms that i first saw as a kid in elementary school on some reading textbooks. The second is based on letterforms drawn to illustrate a book called "Aha, Gotcha!" Both are in the very formative stages, but i thought i'd post here to get yer feedback as to whether either of these projects have artistic merit and whether i should spend any more time working on them. Both are missing characters, i'm more concerned about Digitize tho, because the letterforms are all variations of highly stylized numerals, but i haven't quite figgered out how to manipulate the basic forms to create suitable glyphs for K,P,Q &amp; Y. Anyhow, without further ado...</p>
