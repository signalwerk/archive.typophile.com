      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> <br>One thing i've thought about doing with this one is to slightly tweak out the basic letterforms to make them fit each letter better, but i'd want it to be something subtle if i did that. Anyhow, just a few things i've been playing with. <br>Hmmm, a 2 for a Q, why didn't I think of that??? i'll see if i can work it with what i've got. Then again maybe i'll play with the forms and really "own" them!</p>
