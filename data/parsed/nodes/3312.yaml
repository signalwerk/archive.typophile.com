      <p>Thanks for the input, guys. I guess the digits are fairly 80s huh? I guess thats a little bit of nostalgia for me then and with the 80s styles back on the rise... maybe this one will be interesting again (and then again, maybe not) <br>Darren, i tried to "solve" as many of the glyph issues as i could. I'll post a sample. Obviously some of my solutions don't "work" as well as others. <br></p>
