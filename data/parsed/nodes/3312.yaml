    html: "<p>It's pretty straightforward to make a 2 into Q simply by extending the top bit around until it gets close to the tail. (this works best in handwritings where the 2 is closer to the Devanagari 2 numeral form: <a href=\"http://omniglot.com/writing/devanagari.htm\" target=\"_blank\">http://omniglot.com/writing/devanagari.htm</a> .)</p>"
