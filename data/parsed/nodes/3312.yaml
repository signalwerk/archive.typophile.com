    html: <p>Martin Gardner's numbers/letters aren't they? If they're not, I've seen them in one of his books. Don't think they're a full font. I'm wondering how you intend to handle the A/a and B/b, which don't appear in number names until 1,000 and 1,000,000,000.</p>
