    <p><a href="http://vimeo.com/6746313" title="http://vimeo.com/6746313">http://vimeo.com/6746313</a></p>
    <p>Student Steffen Knoesgaard's Motion Week assignment for Hyper Island was to make a short animation to be completed in an accelerated schedule of only 24 hours based on something that you like.</p>
    <p>I am honored that he chose a typeface of mine, and am blown away by the results. Hopefully you will appreciate it as well.</p>
    <p>Motion design by Steffen Knoesgaard<br>
    Audio by The Battles &amp; DJ Koze</p>
