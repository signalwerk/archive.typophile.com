  html: |-
    <p>Hi all,</p>
    <p>For those of you who typeset books in-house or spec interior designs for books with non-standard diacritics (outside of the open-type pro capabilities), can you recommend any text fonts that can support extended diacritics such as under dots?</p>
    <p>I found that Adobe Garamond Premier Pro offers some under dot characters, but not for the letter “H,” which I would definitely need included. </p>
    <p>Thank you!</p>
