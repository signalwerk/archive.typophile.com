  html: <p>The actually quite excellent CBC Radio technology show <cite>Spark</cite> has <a href="http://www.cbc.ca/spark/2012/05/full-interview-steve-matteson-on-designing-fonts-for-mobile-tech/" title=" Steve Matteson on Designing Fonts for Mobile Tech" rel="nofollow">posted</a> the full recording of its interview with rough, tough Steve Matteson, which forms part of <a href="http://www.cbc.ca/spark/2012/05/spark-183-may-20-23-2012/" title=" May 20 &amp; 23, 2012" rel="nofollow">the May 20–23 episode</a>. (Or download <a href="http://itunes.apple.com/ca/podcast/full-interview-steve-matteson/id276617577?i=115524641" title="iTunes version" rel="nofollow">the interview</a> or <a href="http://itunes.apple.com/ca/podcast/2012-05-20-spark-183-phone/id263242885?i=115569213" title=" May 20 &amp; 23, 2012" rel="nofollow">the episode</a> from the iTunes.)</p>
