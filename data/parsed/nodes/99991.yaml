    html: |-
      <p><cite>As a rule all the cleaning up is relegated to the point when I feel a glyph is done or obvious extra nodes are laying around. I often click on the "Optimize" too to help me get rid of extraneous nodes.</cite></p>
      <p>I suppose that's OK, but it really is easier to clean up as you go along. And my experience -- for what it's worth -- is you cannot rely on program functions such as "remove overlap," "optimize," "set path direction," etc. for correcting the particular error that occasioned this post. The original purpose of these routines  wasn't to correct this kind of error, so don't squawk when they don't fix it. Again, I speak as one who has paid to own the  T-shirt...</p>
