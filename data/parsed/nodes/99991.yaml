    html: |-
      <p>@Graphirus: I believe you're looking at the technical reason in your screenshot: overlapping areas are very often rendered as negative space, especially in Postscript-based fonts.</p>
      <p>Regarding weirdness in merging contours— in your above screenshot, merging contours in glyphs like the /a and /u probably won't pose much of an issue, but glyphs with large overlapping areas like the /p or multiple overlaps and crossing contours like the /x and /t <em>could</em> produce unpredictable weirdness and extra points requiring manual clean-up. So you should certainly do a thorough check for any such oddities before generating a finished font.</p>
    html_clean: |-
      <p>@Graphirus: I believe you're looking at the technical reason in your screenshot: overlapping areas are very often rendered as negative space, especially in Postscript-based fonts.</p>
      <p>Regarding weirdness in merging contours— in your above screenshot, merging contours in glyphs like the /a and /u probably won't pose much of an issue, but glyphs with large overlapping areas like the /p or multiple overlaps and crossing contours like the /x and /t <em>could</em> produce unpredictable weirdness and extra points requiring manual clean-up. So you should certainly do a thorough check for any such oddities before generating a finished font.</p>
