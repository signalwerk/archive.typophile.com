      <blockquote><p>I don't want to merge contours yet since I'm not finished tweaking characters shapes. Is there any solution?</p></blockquote>
      <p>You should merge contours and decompose glyphs before generating test fonts, so best to save a copy and generate from that. You can automate some or all of the process by using an Action Set or a macro (see Ben Kiel's scripts for generating test fonts at <a href="http://benkiel.com/typeDesign/" title="http://benkiel.com/typeDesign/">http://benkiel.com/typeDesign/</a> ).</p>
