    <p>Hi,</p>
    <p>I'm having a strange problem and I hope someone may help me.<br>
    I'm trying to test the font I'm working on in InDesign but a lot of glyphs are showing white spots where contours merge. When getting very close (+800% magnification) everything looks like it should. The problem is I need to check my font at small sizes and the white contours make it impossible. I thought that FL merged contours on export... I don't want to merge contours yet since I'm not finished tweaking characters shapes. Is there any solution? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-01-24 at 2_6633.17.17 PM.png"></div><p></p>
