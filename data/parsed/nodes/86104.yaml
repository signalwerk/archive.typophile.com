    html: |-
      <p>OpenType does not support many to many substitution, but you can use contextual substitutions to achieve similar effect, something like:</p>
      <pre>lookup f_1st {
        sub f by f_component;
      } f_1st

      lookup f_2nd {
        sub f by f_e;
      } f_2nd;

      feature calt { # or clig, support varies between engines
        sub f' lookup f_1st
            f' lookup f_2nd
            f;
      } calt;
      </pre><p>
      Which substitutes "fff" by "f_component f_e f".</p>
