    <p>Help needed: Opentype multiple characters substitution workaround ?!<br>
    Hi everybody,</p>
    <p>I’m currently developing a revival of a cursive fat face, created by famous Bulgarian type designer Milka Peykova in the mid-70s. Her design was based on François Boltana’s Stilla, but feels a bit different (not to speak that it has complete Cyrillic character set, but no Latin, so it had to be ”interpolated/reimagined”). So as you all know the *F* *f* of Boltana’s script may cause some inconveniences, even in loose spacing, but Peykova’s design is much more tightly spaced. This creates a big disturbance in the font’s rhythm (ball terminal to next letter leaving a big hole...). So I had two choices, either to completely redesign the F,f (which didn’t wanted) or to rely heavily on f-ligatures (ff fi fl – being common and the uncommon fr ft fo fa fe fu fy …. etc.). </p>
    <p>So to the problem… </p>
    <p>After completing all the f-ligatures (plus all the Opentype coding) it all worked flawlessly until I faced another problem – (thus speaking a non-Latin language) I somehow “forgot” that combinations like ffo ffe ffu … etc. are possible.<br>
    So I created a f_component - being the first f in the ligature ff(sometnig), trying to achieve all the possible combinations trough coding – f_comp + (some already-made f-lifgature). </p>
    <p>I know that the liga function allows substitution of the following:</p>
    <p>sub A B C by D<br>
    or<br>
    sub A by B C D</p>
    <p>but can somebody show me a workaround for the following</p>
    <p>sub A B C by D E<br>
    ...menaning…<br>
    sub f f f by f_component f_e</p>
    <p>or do I have to make all the possible combinations again, thus creating many more new gliphs ?</p>
    <p>Thank you in advance!</p>
