      <p>Well, I can chime in here that Friedrich Neugebauer was in an English prison camp in Egypt for a good part of WWII and used toothpaste — I’ve seen and held the original. Of course, the formulation of the toothpaste in 1943 may not have <em>any</em> resemblance to the formulation of today’s.</p>
      <p>Friedrich was conscripted into the Austrian army after Hitler’s Anschluss in 1938 and as he put it, after four years of serving in the army against his wishes, he had the great fortune of being captured and was able to spend the rest of war (1944-1947) not shooting at anyone. They lived in tents in a camp somewhere near the Mediterranean, where the Brits were generally humane to the prisoners. (Although 55 years later it still brought tears to his eyes as he recalled that some of the camp personnel simplistically lumped all prisoners together: “Give a table knife to a Kraut and he’ll turn it into a machine gun!”) </p>
      <p>The authorities allowed him to make artwork using letter paper donated by a sympathetic officer, colors made from pigments that he ground himself from foraged minerals and other raw materials, and brushes made from his tentmates’ hair. The cover of a small book of traditional songs has the title lettered in toothpaste, and if I remember this accurately, the binding cloth is a flour sack scrounged from the camp kitchen. I just looked in both of my books, <em>Schrift als Kunst</em> and <em>The Mystic Art of Written Forms,</em> to see if I could upload a picture, but a there isn’t a photo of this cover. However, I’ve made a shot of an interior page. (Sorry that the lighting is not good, I just did a quickie handheld.) This book is 30 x 22 cm, and I’m still stunned by the grace and beauty of it, when you consider the circumstances under which it was made. </p>
      <p>I can tell you from memory that the toothpaste is quite mounded up — higher in profile than the typical raised gesso with gold leaf on top, if that helps you imagine it — and he must have made it even higher to begin with, since the toothpaste <em>must</em> have some loss of volume as the moisture departs the ribbon. </p>
      <p>I wonder if loading toothpaste into a cake decorator’s piping bag would be a help to you, since you would have a choice of nozzle tips, and far more control over the material than if you simply squeeze a plastic tube.</p><div class="imageWrap"><img src="/files/prisoncamp_6562.jpg"></div><p></p>
