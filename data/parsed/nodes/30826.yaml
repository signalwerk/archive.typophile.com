    <p>hello everyone,</p>
    <p>i’m currently working on an art catalog and i’m thinking about a historically inspired look of the typography. the art performance deals with an incident that took place in the early 19th century (1816 to be precise).<br>
    although there is really no need for absolute historical correctness in the final design, i’d like to have a base for the choice of a possible typeface and the kind of layout and typesetting. at the end, i’ll have to decide, whether it’s possible to combine the rather wild and kind of “trash chic” performance with a historical typesetting.</p>
    <p>the country involved in the incident was basically france. on the other hand, one could also imagine to have another country’s press reporting about it. unfortunately, i’m quite unsure about what actually typography looked like in countries like france, england, netherlands and germany at the mentioned point in time. it meets the almost late period of classicism in typography/typedesign. in germany, i guess, broken letters were ruling most of the printed work (what about books/novels?). but before posting more inadequately simplified consderations about the typogaphic state of affairs in the other countries – like france=didot, italy=bodoni etc), i’d like to hear some opinions from the experts here.<br>
    once again, my basic question is: which typefaces where used commonly in a) books and b) newspapers or reports around 1816? </p>
    <p>kind regards,</p>
    <p>alex</p>
