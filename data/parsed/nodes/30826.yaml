      <p>maybe this could help you ...</p>
      <p>at the library I’m working at, there are two small letter specimen books of two small printing shops at Augsburg (southern Germans) from 1806 / 1811. If you think those could be interesting, I could mail you those.</p>
      <p>In Germany, at this time, almost all newspapers were printed with broken types - same applies to 90 percent or more of the novels. On the other hand scientific texts (in German) could be printed either in blackletter or in antiqua (about 60 / 40 percent). And of course all latin and french texts were printed in antiqua. </p>
      <p>wolfgang</p>
