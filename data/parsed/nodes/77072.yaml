    <p>Hi all, </p>
    <p>I wonder what piece of software most of you use to create typefaces? I have been advised to get Fontlab, details for fontlab :<br>
    FontLab Studio + ScanFont Bundle for Mac OS X<br>
    <a href="http://www.fontlab.com/buy/" title="http://www.fontlab.com/buy/">http://www.fontlab.com/buy/</a></p>
    <p>apparently this gets you the normal fontlab studio liscence (might want to check this covers multiple computers?) and also software that allows Professional font creation from scanned images.</p>
    <p>This Costs: $699 or £443.64</p>
    <p>Is there any way of finding this cheaper? Or any problems you have had with the software? Anyone use fontographer? What are the differences? Thanks.</p>
