      <p>@CaleD - It doesn't harm that it is easy to write a program that makes an SFD file -- easy when compared to writing a VFB generator.</p>
      <p>Last Friday I woke up very early with the urge to Hack Fonts Fast. Long to short, I hacked together code on the Linux box that converted EGA/VGA screen fonts to SFD, then used FontForge to create a TTF file. Goal achieved.</p>
