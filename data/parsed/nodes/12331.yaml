    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Christina Torre</strong></p>
    <p>Christina Torre has been with P22 type foundry since January 2000. She graduated from the State University of New York at Buffalo with a BA in Communication Design. Christina has designed a variety of fonts and print materials, and has also designed for the web. She worked at <a href="/wiki/The%20Pushpin%20Group" class="freelinking" rel="nofollow">The Pushpin Group</a> in NYC and at Dog Eat Dog Advertising, Inc. in Buffalo, NY.</p>
    <p>Typefaces by Christina Torre: <a href="http://www.p22.com/ihof/dearest.html" rel="nofollow">Dearest</a>, <a href="http://www.p22.com/ihof/mucha.html" rel="nofollow">Mucha</a>, <a href="http://www.p22.com/ihof/salon.html" rel="nofollow">Salon</a></p>
