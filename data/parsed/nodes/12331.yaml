    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Christina&nbsp;Torre</strong></p>
    <p>Christina Torre has been with <span class="caps">P22</span> type foundry since January 2000. She graduated from the State University of New York at Buffalo with a <span class="caps">BA</span> in Communication Design. Christina has designed a variety of fonts and print materials, and has also designed for the web. She worked at <a href="/node/add/wiki?edit%5Btitle%5D=The%20Pushpin%20Group" title="Create node &quot;The Pushpin Group&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Pushpin Group</a> in <span class="caps">NYC</span> and at Dog Eat Dog Advertising, Inc. in Buffalo, <span class="caps">NY</span>.</p>
    <p>Typefaces by Christina Torre: <a href="http://www.p22.com/ihof/dearest.html">Dearest</a>, <a href="http://www.p22.com/ihof/mucha.html">Mucha</a>, <a href="http://www.p22.com/ihof/salon.html">Salon</a></p>
