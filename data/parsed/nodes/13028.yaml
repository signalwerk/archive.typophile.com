      <p>A great font manager is "Font Suit" from Iseatech - <a href="http://www.iseasoft.com" title="www.iseasoft.com">www.iseasoft.com</a></p>
      <p>I use it myself. It allows you to create different sets of fonts for different projects and activate fonts as and when required. By activate I mean temporarily install. On restarting the computer or closing the software, the font is deactivated. So its slightly bothersome having to keep fontsuit open while working with its fonts.</p>
