    <p>I have been acquiring more and more fonts and recently learned that it is not a good idea to have all of them installed.  I need a good font manager.  Do I understand a font manager will let you preview and use a font without actually installing it ... just indicated the font and leave the font manager running?<br>
    Thanks!</p>
