      <p>I was going to say you should do a Google search for "font manager" or "font management software" but then I did one myself, and I was very scared with the top results. I suggest you take a look at Extensis' Suitcase and Adobe's ATM, which can be found in Support -&gt; Downloads at their website. ATMLight is free, but I'm not sure it does what you want.</p>
      <p>Oh, and I'm sure other people can point other good software and/or companies. I point these two because they're the ones I'm more familiar with.</p>
