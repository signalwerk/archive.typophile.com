    html: <p> Hi, Miguel! <br> <br>I am planning to launch a "one person foundry". <br>At the beginning this was not my idea, but is difficult to find partners... <br> <br>I agree the concept, but the problem is offering more than 2 new fonts by year (I can't design more typefaces...) <br> <br>And when you have partners the font's testing is easier... <br> <br>Regards. <br> <br>Ramiro Espinoza. <br>www.jazz.futurezone.com <br>Ps, Are you spanish? I am from Argentina... </p>
