    html: <p> Hrant, <br> <br>Tu español es menos "poor" que mi inglés, ha-ha! <br>La palabra "trans-andino" no se si esta reconocida por la Real Academia Española, pero es de uso frecuente, lo cual la hace válida para mi. <br>Si no es reconocida por la R. Academia actualmente, lo será dentro de algunos años... <br> <br>El significado que le otorgas es el correcto. <br> <br>Cordiales saludos. <br> <br>Ramiro Espinoza. </p>
