    html: '<p>1.-Ché Ramiro: <br> <br>Well, my email is: <a href="mailto:screenfonts@hotmai.com">screenfonts@hotmai.com</a>, and you can see a couple of designs here, on the critique forums (bitmap) Please let me know what you think about the "three dots" post. Lo cierto es que es una mis tipografías favoritas y pienso que al contrario de su uso para pantalla, puede servir para su uso en soportes impresos. ¿Puedes leer los caracteres? (conozco a los de tipografía.cl y sí, han hecho las cosas bien desde un principio) <br> <br>2.-Mr.Hrant <br> <br>The challenge is create an unique concept of type design, like Fontomas or Matthew B. , visionary guys that are an example of independence and cuality. I mean a complete package. You cxan see the Fonts, and the using of the characters in action (House Industries makes a new school) <br> <br>The Freedom of Design Patters are a good reference to the design comunity, the bad thing about big foundries are this...they dont show designs and the fonts in action(exept CSA images) <br> <br>That`s the point, or not?</p>'
