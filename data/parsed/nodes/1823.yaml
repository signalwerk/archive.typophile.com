    html: <p>Hi <br> <br>I've spent the last six months going through the process of setting up a foundy, after four years of running a free font site ( <a href="http://www.fontmonster.org" target="_blank">http://www.fontmonster.org</a> ). <br> <br>Initally I expected to launch in January - Febuary, we are actually launching in June. Things which I thought would be very easy turned in to a bit of a slog, like dealing with the bank (I am not a terrorist, I've banked with you for years), getting the back end of the site built in a way that allowed us to expand the site easily. <br> <br>On the plus side, I have met some great designers who are now selling through the site, and who have been great over the past six months... and it is inspiring to see the work which these designers are creating. I am very pleased to have a site which showcases new talent along side established font designers. (14 designers, 9 countries, just under 100 fonts) <br> <br>The site will beta launch later this week. And the stage which I'd expect most foundries would struggle with will start, the marketing. With 10,000 visitors a month to my fontmonster site, the marketing contacts I've built over 4 years with fontmonster and a bit of cash, its going to be a big job to get us noticed, with only one or two fonts I personally feel it would be impossible to be noticed. <br> <br>Good luck if you do go ahead with it. <br> <br>Jim <br>--------------------------------------------------- <br><a href="http://www.unionfonts.com" target="_blank">http://www.unionfonts.com</a> <br></p>
