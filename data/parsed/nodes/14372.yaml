      <p><em><a href="http://americanart.si.edu/1001/2001/01/011601.html" rel="nofollow">This un-event was created by newspaperman Harold Pullman Coffin and was first observed in 1973. The goal of National Nothing Day is "to provide Americans with one national day when they can just sit without celebrating, observing, or honoring anything."</a></em></p>
      <p>I feel special!!</p>
    html_clean: |-
