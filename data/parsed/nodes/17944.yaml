    <p>I'm curious about how the Mac OS X (10.4) provided ZapfDingbats works. It seems that it only has glyphs mapped into the Unicode range intended for dingbats. However, in Word, Quark 6.5 or InDesign CS2, if I type "a b c" on my keyboard, dingbats appear. In TextEdit, letters appear, but they are in a fallback font. This is with a US keyboard setting. Do some applications make an exception for Zapf, or is this expected behavior?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ZapfABC.jpg"></div><p></p>
