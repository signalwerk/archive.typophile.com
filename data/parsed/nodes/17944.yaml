    html: |-
      <p>I knew about Zapf Dingbats having its own 8-bit codepage, and the rest is guesswork based on this fact and the sometimes strange behaviour of applications when encountering fonts with 'ding' in the name, e.g. <a href="http://typophile.com/node/17883" title="http://typophile.com/node/17883">http://typophile.com/node/17883</a></p>
      <p>There is a tendency in programming to hard code special cases. So if you have a font that has unique properties, you stick in some lines of code that say 'if this font is used, perform this operation'. Often, the assumptions involved end up causing problems at a later date.</p>
