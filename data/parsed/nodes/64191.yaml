  html: |-
    <p>Suomi Hand will soon be available from FontShop (Stephen Coles talked me into signing with them), but – greedy me – if you want to get this font right now, send me an e-mail. I've sent the signed contracts to FontShop, so Suomi Hand should be available in within a month or so. </p>
    <p>So, Mike Diaz, you do in fact have a chance to have this font; Lumene company went from advertising company to another for some two years, micro-managing their tag line from "The Secret of Nordic Beauty to "The Secret of Nordic Nature", and never implemented the Lumene font, so I got fustrated, and re-draw the whole font, and re-named it Suomi Hand. It was used in a charity event, and I promtly got an e-mail from Lumene company complaining inappropriate use of their font, but I just told them to check their lisence agreement that has a three year exclusive right, and also pointed, that I've in fact re-drawn the glyps. (Just to be sure.)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SuomiHand_5834.png"></div><p></p>
