    html: |-
      <p>Hrant, I can guess what your question is aiming at.</p>
      <p>A foundry can sell their fonts through different channels, FontShop USA being one of these channels. Those distribution contracts are usually non-exclusive, that means the foundry still can sell their fonts through other distributors, like MyFonts or their own foundry website.</p>
      <p>On the other hand, if a designer submits his work to a foundry to get his fonts to the market, the foundry usually gets the exclusive distribution rights to the fonts (but could, as above, use different channels for distribution).</p>
