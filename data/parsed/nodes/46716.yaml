      <p>Sure:</p>
      <p><code>from robofab.world import CurrentFont</code></p>
      <p>f = CurrentFont()<br>
      k = f.kerning</p>
      <p>l = k.getLeft('A')<br>
      for ((c1, c2), x) in l:<br>
      --&gt;print c1, c2, x</p>
      <p>Replace '--&gt;'  by a tab. Hope this helps. :)</p>
