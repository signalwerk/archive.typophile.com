    <p>Hi all,</p>
    <p>I want to get a list of the Kerning pairs for certain glyphs.</p>
    <p>I using this code to get a list of the kerning pairs for 'A'</p>
    <p><code><br>
    #<br>
    #GetPairs---------------<br>
    #<br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()<br>
    #<br>
    kerning = f.kerning<br>
    #<br>
    print kerning.getLeft('A')<br>
    print kerning.getRight('A')</code></p>
    <p> </p>
    <p>This works fine, but the output window shows the results in a array format like :</p>
    <p><code><br>
    [(('A', 'w'), -40), (('A', 'W'), -50), (('A', 'G'), -20), (('A', 'quoteright'), -20), (('A', 'Q'), -20), (('A', 'backslash'), -90), (('A', 'v'), -55), (('A', 'asciicircum'), -30), (('A', 'V'), -85), (('A', 'U'), -10), (('A', 'at'), -10), (('A', 'question'), -20), (('A', 'O'), -20), (('A', 'slash'), 20), (('A', 't'), -25), (('A', 'OE'), -20), (('A', 'T'), -65), (('A', 'Y'), -65), (('A', 'trademark'), -70), (('A', 'C'), -20)]<br>
    [(('quoteright', 'A'), -20), (('J', 'A'), -15), (('backslash', 'A'), 20), (('D', 'A'), -20), (('P', 'A'), -40), (('slash', 'A'), -90), (('U', 'A'), -10), (('Q', 'A'), -20), (('F', 'A'), -45), (('Y', 'A'), -65), (('O', 'A'), -20), (('B', 'A'), -5), (('T', 'A'), -65), (('W', 'A'), -50), (('V', 'A'), -85), (('at', 'A'), -10)]<br>
    </code></p>
    <p>Is it possible to the results in amore readable list format like :</p>
    <p><code><br>
    ('A', 'w'), -40)<br>
    (('A', 'W'), -50)<br>
    (('A', 'G'), -20)<br>
    (('A', 'quoteright'), -20)<br>
    (('A', 'Q'), -20)<br>
    (('A', 'backslash'), -90)<br>
    (('A', 'v'), -55)<br>
    (('A', 'asciicircum'), -30)<br>
    (('A', 'V'), -85)<br>
    (('A', 'U'), -10)<br>
    </code></p>
