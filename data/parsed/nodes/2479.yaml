    html: "<p>I should point out that from books I see, Trade Gothic has  Light, Regular, Bold, and Bold No. 2 weights (that is the term you were looking for, I think), with an Oblique version of each. It also comes in two additional widths: Condensed  and Extended. Both have a Bold &amp; Regular weight, and the Condensed has both weights in Oblique form too. That makes a total of 14 fonts. <br> <br>However, I applaud the idea of looking for a fresher alternative to a design from 1948. Eduardo suggested <a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=10663172097593320&amp;fontname=BentonSans\" target=\"_blank\">Benton Sans</a> from Font Bureau (which I think is a retail version of Benton Gothic, a 1995-2000 Font Bureau Studio Font, available only by special licensing from them). Both are new takes on Morris Fuller Benton's News Gothic and related designs produced for ATF in the period before 1910. There are 26 fonts, so there would be more variety, but not much noticeable difference in appearance to the average reader (I don't mean the font fanatics you find at this Board). <br> <br>If you are truly looking for something to set you apart from Trade Gothic, which is itself a near-copy of News Gothic, it seems you might want to consider something different from either of them.  <br> <br>There are too many fonts being designed to keep relying on the same designs with new names and more weights.  <br> <br>What are the features that Trade Gothic has that you like so much? The 2-storey g? The simple monotone weight? The machined, precise look? The x-height? The mostly-closed C?  Do you want a 'transparent' typeface? These are all questions to answer in your own mind and then start looking at font families. <br> <br>Some newer families you may want to look at: <br> Hoefler's <a href=\"http://www.typography.com/catalog/gotham/index.html\" target=\"_blank\">Gotham</a>.  <br>House Industries <a href=\"http://houseind.com/house.php?kit=NEUTRAFACE-FO\" target=\"_blank\">Neutraface</a>.  <br>Terminal Design's <a href=\"http://www.terminaldesign.com/retail_specimen.php?ID=1001&amp;viewFam=1\" target=\"_blank\">ClearviewOne</a>.   <br>Storm's <a href=\"http://www.stormtype.com/jsans.html\" target=\"_blank\">John Sans</a>. <br>Or for something more different, Storm's <a href=\"http://www.stormtype.com/sebastian.html\" target=\"_blank\">Sebastian</a> <br> <br>These are only a few families. LucasFonts and FontFonts also have a range of sans serif designs.  <br> <br>Go explore them all and see what attracts you. <br></p>"
