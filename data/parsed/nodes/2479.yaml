    html: "<p>I was searching high and low for a different sort of gothic as well, and I'm very happy to have settled upon <a href=\"http://www.myfonts.com/Search?searchtext=aaux\">Aaux and Aaux Office</a>. You can see it in use <a href=\"http://www.impacttheatre.com\">here</a>. In addition to the weights there, Neil Summerour is either about to release or has just released black and poster weights as well as small caps/OSFs. One thing: if you do decide to purchase Aaux (this doesn't apply to Aaux Office), make sure you ask T26 for real quotes/apostrophes -- Neil had decided against it when he designed the face, but in my view it severely limits its application. When I asked, T26 was kind enough to supply me a version with angled quotes (Neil was completely fine with their doing so, by the way).</p>"
