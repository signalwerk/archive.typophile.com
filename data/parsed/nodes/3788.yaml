    html: |-
      <p>Try this:</p>
      <p>feature calt {</p>
      <p>lookup calt1 {<br>
      sub @minuscules' @capitales by @grandes; #first level of sub.<br>
      sub @capitales @minuscules' by @grandes;<br>
      } calt1;</p>
      <p>lookup calt2 {<br>
      sub @minuscules' @grandes by @moyennes; #second level of sub.<br>
      sub @grandes @minuscules' by @moyennes;<br>
      } calt2;</p>
      <p>lookup calt3 {<br>
      sub @minuscules' @moyennes by @petites;<br>
      sub @moyennes @minuscules' by @petites;<br>
      } calt3;</p>
      <p>} calt;</p>
