  html: "<p>Bonjour, <br> <br>I'm working on an experimental font for titling, using Fontlab with the calt feature (ot). <br>Please have a look to the attached files to see how i'm trying to do... \"Abracadabra\" version is less important, it will be the result of a random feature. <br>To obtain the effect of deformation that you can see in the \"colonel\" exemple, I've created 5 sizes in the same font. First I digit my word with lowercases, then I choose one letter (in the middle of the word) and I change it in capitals (the biggest size). <br>I've created five classes for each sizes (from the very small to the biggest : minuscules, petites, moyennes, grandes, capitales), and I've tried to apply calt feature to make contextual substitutions. <br>The code : <br> <br>feature calt { <br>  sub @minuscules' @capitales by @grandes;   #first level of sub. <br>  sub @capitales @minuscules' by @grandes; <br>  sub @minuscules' @grandes by @moyennes;   #second level of sub. <br>  sub @grandes @minuscules' by @moyennes; <br>  sub @minuscules' @moyennes by @petites; <br>  sub @moyennes @minuscules' by @petites; <br>} calt; <br> <br>The problem is that the program consider only the first substitution. The second and the third substitution refer to the first substitution, but it doesn't works because everything is in the same feature. I don't know if it's quite clear for you, it's so difficult to explain in my bad english... My question is : do I need to put some lookups to make that the first level of substitution takes effect, so the second will may refers to...  <br> <br>Thank you so much for your patient attention <br> <br>E.A.<img src=\"http://www.typophile.com/forums/messages/4101/29230.jpg\" alt=\"colonel\"><img src=\"http://www.typophile.com/forums/messages/4101/29231.jpg\" alt=\"abracadabra\"></p>"
  html_clean: "<p>Bonjour, <br> <br>I'm working on an experimental font for titling, using Fontlab with the calt feature (ot). <br>Please have a look to the attached files to see how i'm trying to do... \"Abracadabra\" version is less important, it will be the result of a random feature. <br>To obtain the effect of deformation that you can see in the \"colonel\" exemple, I've created 5 sizes in the same font. First I digit my word with lowercases, then I choose one letter (in the middle of the word) and I change it in capitals (the biggest size). <br>I've created five classes for each sizes (from the very small to the biggest : minuscules, petites, moyennes, grandes, capitales), and I've tried to apply calt feature to make contextual substitutions. <br>The code : <br> <br>feature calt { <br>  sub @minuscules' @capitales by @grandes;   #first level of sub. <br>  sub @capitales @minuscules' by @grandes; <br>  sub @minuscules' @grandes by @moyennes;   #second level of sub. <br>  sub @grandes @minuscules' by @moyennes; <br>  sub @minuscules' @moyennes by @petites; <br>  sub @moyennes @minuscules' by @petites; <br>} calt; <br> <br>The problem is that the program consider only the first substitution. The second and the third substitution refer to the first substitution, but it doesn't works because everything is in the same feature. I don't know if it's quite clear for you, it's so difficult to explain in my bad english... My question is : do I need to put some lookups to make that the first level of substitution takes effect, so the second will may refers to...  <br> <br>Thank you so much for your patient attention <br> <br>E.A.<img src=\"http://www.typophile.com/forums/messages/4101/29230.jpg\" alt=\"colonel\"><img src=\"http://www.typophile.com/forums/messages/4101/29231.jpg\" alt=\"abracadabra\"></p>"
