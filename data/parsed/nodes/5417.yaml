    html: <p>I agree that the symbol needs work. The illustration of the man should probably take on more characteristics of the Arabic forms used, to bring a cohesiveness to the whole that isn't quite there yet. The logo you present (the one with the small type) is certainly a step in the right direction, but it's a small step. Try ideas that push you far from the original (unless you were told not to) and use those new ideas to find a good balance. <br> <br>Since the symbol seems to be the most important part, I'd focus on that first, and let the type choice follow. Also think of ways to mirror curves from the type in the symbol, or the symbol in the type.</p>
