    html: "<p>Hi, <br> <br>I've been reading these posts with interest. I'm certainly less qualified to give advice than most of the other people posting but I'm going to voice my opinion anyway <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>What does a little dancing man have to do with hosting or bandwidth? I presume he's supposed to be happy because of the excellent service he receives from alnadeem? That could be used to justify using a little character dancing for almost every business in the world. I'd drop the little man, he doesn't give anything to the logo. <br> <br>Whilst it's a little predictable, I like post #44. I think it's way stronger than anything else here. Firstly it's simple and abstract which feels like a telecommunications based company. Secondly, a wave is relevent to what alnadeem seem to do. <br> <br>Finally I would not drop the double language. By keeping arabic and latin alphabets united you imply an international identity which fits nicely into the idea of world commerce and breaking national boundaries that the web (and one might presume, your customers) aspire to. <br> <br>That's what I think anyways.</p>"
