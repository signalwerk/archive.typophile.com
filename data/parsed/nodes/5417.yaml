    html: <p>R. A couple of suggestions that apply to you and to alot of other people. Consider reading the books, Elements of Typographic style by Robert Bringhurst, The New Typogrqaphy by Jan Tshichold, and Treasury of Alphabets and Lettering by Jan Tshichold. These books will help you make quality design desicisions based on the central principles of typography and graphic design. No the rules before you break the rules. As for the logo presented, it kind of reminds me of an acitve wear company for lazy men and women. My advice is to dig deep deep deep into your soul and you will most likely find the solution you are looking for.</p>
