    html: "<p>In the West the swoosh is overdone, but maybe in the Middle East it can be used to good effect. Although the first thing I think of when I see the logo is a fitness club, I like the idea of combining the Arabic \"noon\" (on top, good) and the Latin \"n\" (although I think you need a small stem on the top-left - that would actually be a nice clue that it's letters - otherwise I think it's too subtle). <br> <br>As for the name settings, because Arabic is small on the body you'll always have some trouble getting the relative apparent weight/importance to match up. Your first solution (bigger Arabic type, but in a lighter tint) isn't bad. Although the Kufi style matches neither Palatino nor the logo, I don't think. <br> <br>I think Eurostile might work (another element overused in the West but maybe OK there), but you need to make a nice-looking Arabic Eurostile match (not what you have now). BTW, if you make an Arabic font to match an existing Latin font, make sure not to make it too Latinized - although a little bit is OK here, considering the subject. <br> <br>BTW, in your setting with the curved text lines top and bottom, I'm not sure a kasheeda can go between the \"noon\" and the \"daal\". <br> <br>&gt; \"Bahrain is four seas\" <br> <br>Not TWO seas? The \"ain\" suffix in Arabic means \"two of them\". The singular is \"bahr\", and the plural \"bihaar\", I think. (In Arabic the plural of a feminine word gets an \"aat\" suffix, but masculines are irregular - and it can get pretty funny, like when a foreign word gets pluralized: \"jante\" means a car wheel in French, and in Lebanon the plural is either \"jnaat\", \"jantaat\", \"janat\" or \"jnoot\" - you can actually tell which part of the country somebody's from depending on how they pluralize \"jante\". ;-) <br> <br>-- <br> <br>If you need further help, you might try these two experts: Nadine Chahine, and Habib Khoury. <br> <br>hhp <br></p>"
    html_clean: "<p>In the West the swoosh is overdone, but maybe in the Middle East it can be used to good effect. Although the first thing I think of when I see the logo is a fitness club, I like the idea of combining the Arabic \"noon\" (on top, good) and the Latin \"n\" (although I think you need a small stem on the top-left - that would actually be a nice clue that it's letters - otherwise I think it's too subtle). <br> <br>As for the name settings, because Arabic is small on the body you'll always have some trouble getting the relative apparent weight/importance to match up. Your first solution (bigger Arabic type, but in a lighter tint) isn't bad. Although the Kufi style matches neither Palatino nor the logo, I don't think. <br> <br>I think Eurostile might work (another element overused in the West but maybe OK there), but you need to make a nice-looking Arabic Eurostile match (not what you have now). BTW, if you make an Arabic font to match an existing Latin font, make sure not to make it too Latinized - although a little bit is OK here, considering the subject. <br> <br>BTW, in your setting with the curved text lines top and bottom, I'm not sure a kasheeda can go between the \"noon\" and the \"daal\". <br> <br>&gt; \"Bahrain is four seas\" <br> <br>Not TWO seas? The \"ain\" suffix in Arabic means \"two of them\". The singular is \"bahr\", and the plural \"bihaar\", I think. (In Arabic the plural of a feminine word gets an \"aat\" suffix, but masculines are irregular - and it can get pretty funny, like when a foreign word gets pluralized: \"jante\" means a car wheel in French, and in Lebanon the plural is either \"jnaat\", \"jantaat\", \"janat\" or \"jnoot\" - you can actually tell which part of the country somebody's from depending on how they pluralize \"jante\". ;-) <br> <br>-- <br> <br>If you need further help, you might try these two experts: Nadine Chahine, and Habib Khoury. <br> <br>hhp <br></p>"
