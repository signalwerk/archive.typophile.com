    <p>Hi, </p>
    <p>I know I'm asking much, but here it goes:</p>
    <p>I've chosen House's Paperback for the scheduled set of broschures. It should cover body text and, likely, heads (titles) and subheads. </p>
    <p>I contacted House Ind. to obtain a specimen and got a 1 page pdf containing a mix of the Paperback samples, which unfortunately hasn't got more then one line of text per style. I can't properly judge a book typeface after one line sentence, so asked for a more text sample. I got answer to request a catalog, which I did in November. After a month I asked why catalog hasn't arrived yet and got an answer they sent catalogs to Europe in packages, after certain number of requests in this direction had lined up. This unfortunately seems not to had happened yet... </p>
    <p>Now, the deadlines are coming and I'd like to stick to the Paperback idea, so I ask you fellow typophiles for help. </p>
    <p>Maybe some of you have a Paperback specimen with considerable amount of text set (to judge the color of the text) in the Paperback 9pt and title set in the Paperback 96pt? </p>
    <p>Or maybe some lucky license owner could prepare an "Lorem ipsum" pdf for me (9pt Paperback text, 30p0 column width and some 96pt title)?</p>
    <p>Or at least please say, if you are satisfied after you've seen the Paperback offset printed and tell me what kind of publication you used it for an what kind of paper has it been printed?</p>
    <p>BIG BIG BIG thanks in advance,</p>
    <p>Antoni</p>
