    html: |-
      <p>Antoni – I have used Paperback in books. I first used it in a pastiche of an old mass-market paperback, so of course the typeface was perfect, but I've just put it to use again, in a larger book of fiction. It ought to work quite well for your purposes, I think, judging from the samples you've shown. </p>
      <p>There's one thing to keep in mind, though, about Paperback: it's quite wide, so you may want to use a smaller size than you would expect, especially in narrow columns. It's not an "economical" typeface, in that sense.</p>
