    html: <p>Yes. I would highly recommend reading through, <a class="freelinking external" href="http://kltf.de/downloads/FontMetrics-kltf.pdf" rel="nofollow">Karsten Luecke's guide to font metrics</a> (fair warning, depending on your browser, that link will trigger an automatic download of a PDF). There are also numerous discussions elsewhere on Typophile, but the one about <a href="/wiki/UPM%20and%20vertical%20font%20metrics%3A%20please%20help%20to%20clarify" class="freelinking" rel="nofollow">UPM and Vertical Font Metrics</a> should have the level of detail you need and cover most questions.</p>
