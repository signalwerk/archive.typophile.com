    <p>Basically, we like the geometry and size of the font (numbers of characters per line) and the semibold-weight itself.</p>
    <p>We want something classical and "stylish" but typefaces like Bodoni in Condensed versions have too thin areas.</p>
    <p>Any suggestions?</p>
