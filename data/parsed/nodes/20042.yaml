    <p>Greetings Bay Area type friends.</p>
    <p>It's been a while since this group gathered in earnest. Let's fix it. No time better than Saturday, May 20. Why? Because type designer <a href="/wiki/Alejandro%20Paul" class="freelinking" rel="nofollow">Alejandro Paul</a> will grace our city this weekend - all the way from Argentina. Let's get together and show him a good time north of the border(s).</p>
    <p>For those unfamiliar with Alejandro's work, have a look at <a href="http://sudtipos.com.ar/fonts2.htm" rel="nofollow">Sudtipos</a> and <a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=search/results.aspx?keyword=alejandro+paul" rel="nofollow">Veer</a>. Ale is a new master of the script font, with hundreds of releases over the last few years, and a lovely jovial fellow to boot.</p>
    <p>-=-=-=-=-=-=-=-=-=-=-=-=-=-=-</p>
    <p><strong>Los Details</strong></p>
    <p>When: Saturday, May 20, 7:30 p.m. (note, changed from the original plan of 7:00)</p>
    <p>Where: <a href="http://www.yelp.com/biz/Sd061OOPTxMSEdQK4enD8g" rel="nofollow">Maya</a>. Wonderful modern Mexican cuisine in SOMA.</p>
    <p>Attending:<br>
    Tamye Riggs<br>
    Zara Evens<br>
    Joachim Müller-Lancé<br>
    Delve Withringon<br>
    Stephen Coles<br>
    Lourdes Livingston<br>
    Amy Conger (?)<br>
    Christian Robertson<br>
    Carl Crossgrove<br>
    Ale &amp; wife Laura</p>
    <p>Please reply if you're not listed and I will gladly add you to the reservation.</p>
