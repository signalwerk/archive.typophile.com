    html: |-
      <p><em>Exercises</em> become more productive when you do them routinely in life. Refining your typographic skills and awareness is just like learning to play the piano (or other instrument)... if you don't practice, you simply will not get any better!</p>
      <p>Luckily, kerning is less difficult a skill to refine than learning to fine tune the color of text. Yes, learning to visually balance kern pairs in lines of copy goes hand-in-hand with text color, since imbalances in inter-letter spacing disrupts eveness of color.</p>
      <p>But even when all the kerning is "correct" (visually balanced), the color of text blocks can still be off or can be improved. This is a skill more difficult to refine let alone be aware of.</p>
      <p>For a while I have been reviewing graphic design and typography curriculum for assignments and exercises to improve type color awareness, and I haven't seen many at all. If anyone is aware of such useful programs, I would greatly appreciate hearing about them.</p>
      <p>Since I don't believe graphic design students take much time scrutinizing, proofing and adjusting typesetting output (high-res hardcopy), I don't feel they can develop a higher awareness of text color and the subtleties of texture, flow and weighting.</p>
      <p>I think I have come up with a short and simple series of exercises/assignments (three sequential activities that I hope to present at TypeCon) that would help bring text/type color sensitivities to students. I think they will definitely learn about color, but getting better at any skill is a matter of sustained practice.</p>
