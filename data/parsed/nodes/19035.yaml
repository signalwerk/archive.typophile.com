  html: <p>i would like to improve upon my typesetting skills. I have never really come across any specific "drills" per say that aid one in understanding letterspacing properly, but I was curious if anyone has any suggestions. Overall, I can do it rather well, but I do struggle with some aspects spacing.</p>
