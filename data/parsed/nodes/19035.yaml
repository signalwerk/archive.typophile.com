      <p>Here's what I learned from the great John Langdon about kerning:<br>
      1. Visually center each letter between its surrounding two letters.<br>
      2. Make sure recurring negative spaces are spaced exactly the same.<br>
      For example in the word "miniature", the mi should have the same kerning as the ni, since the negative space between those pairs are identical.</p>
