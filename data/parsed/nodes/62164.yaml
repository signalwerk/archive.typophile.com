      <p>visually, it reads more more like a literary journal or review. just because the readers are well educated you don't have to treat it like a white paper or one of those sorts of documents. the enjoy a diversion and to be entertained and engaged like the general public, not hokey-jokey with wacky fonts and useless elements, but more in the spirit of giving them a visual package that makes them stop and absorb what they're reading rather than having just another publication from work or school.</p>
      <p>the rag right with indents and no paragraph spacing along with with narrow column gap makes it difficult to feel a good flow down the page. i recommend to either widen the gap or space out the paragraph blocks to remedy that.</p>
      <p>the kerning on optima makes the body copy feel dense. are you closing it up or is it the default variation of the font you are using? </p>
      <p>i'd recommend opening up the kerning a little and at least one more point of leading. you have a fair amount of whitespace in the outside edges of the pages and i think a little more will keep the page flowing better, give it some more air so to speak.</p>
      <p>thanks for sharing it with us and i hope the advice will help you with the redesign. </p>
      <p>In the spirit of unbridled creativity,</p>
