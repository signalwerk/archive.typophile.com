    html: <p>Optima is a font that people tend to use because they see it as a bland design that occupies a space between sans and serif. So when you use it in a low-budget, text-heavy magazine you end up with a design that looks like a lot of low-budget, boring, inoffensive corporate graphics. To really make Optima sing it needs to be blown up in a large book on fine paper that echoes the monumental renaissance feel of the face.</p>
