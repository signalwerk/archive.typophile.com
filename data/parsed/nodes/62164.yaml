      <p>Thanks you for your comments, Troy. It's interesting that you should point out 1) space between paragraphs, and 2) leading. The first few drafts had more leading and had space between each paragraph, with no indents. Paragraph spaces were removed and leading was slightly reduced to increase the wordcount per page so that it was consistent with the wordcount in past issues. I can see that with the ample margins I have, there is room to expand into that white space. We are considering adding pages to the magazine to accommodate more art, and more breathing room overall.</p>
      <p>I haven't adjusted the tracking on body copy at all; that's Optima's default. However, since the version of Optima in the sample PDF is not pro open-type, I will hold off from adjusting the density until I see what the pro version looks like. As a general rule, I try to avoid tracking out professional typefaces used for body copy.</p>
