      <p>Regarding the point size and tracking question, most common digital text typefaces of the 80s and 90s were optimized for 12 point. There are exceptions, but that's a good working theory until/unless one knows better. Of course, the eye is the ultimate arbiter of spacing.</p>
      <p>Also, I'll just agree on everything said above about Optima. Don't get me wrong, it's a great typeface, and was incredibly innovative 50 years ago. But like a number of other great typefaces which have been over-used, it bears a certain amount of baggage. For example, the fact that it has long been the overwhelming choice of the cosmetics industry makes it feel "just wrong" for representing rationality and skepticism, to me.... I think I want something a little more sturdy/practical feeling. Most of the other suggestions do well on that score.</p>
      <p>Cheers,</p>
      <p>T</p>
