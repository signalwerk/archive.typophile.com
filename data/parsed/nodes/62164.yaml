      <p>William (Bull) -- For real-world examples of Whitman in use, you might want to pick up a copy of the current <em>Women's Health</em> at your newsstand. The October 2009 issue marks the debut of a new design utilizing Whitman extensively. </p>
      <p>It looks like Whitman is used generally at about 10 pt in running text. I believe that 10-point Whitman approximates the x-height of 8.5-point Optima.</p>
      <p>Mostly their columns are narrower than yours, I think. (Obviously, this a very different style of magazine layout). But on page 136, for instance, you'll find columns very similar in width to the 2-column layout on page 5 of your sample. </p>
      <p>Also, the <em>Women's Health</em> type palette has Whitman combined with H&amp;FJ's <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100034" rel="nofollow">Sentinel</a>, which has some general qualities similar to Parry. </p>
      <p>As another possible reference for you, <em>Brides</em> magazine uses Whitman in some feature text and they have Parry in their palette. However, there's not a lot of serif text in this magazine, and I don't think the two end up sharing the stage much.</p>
      <p>Finally, FWIW: <em>Women's Health</em> uses <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100008" rel="nofollow">Gotham</a> for sans-serif. <em>Brides</em> uses <a class="freelinking external" href="http://www.fontbureau.com/fonts/Relay" rel="nofollow">Relay</a>. Both are pretty frequent and popular pairings for Whitman.</p>
      <p>I hope these examples are helpful to you. Let me know if I can be of further assistance.</p>
      <p>-- Kent.</p>
