      <p>I would use Neutraface for the titling and Gill Sans ( yes you read me correctly ) for the text.  These are light enough to give a "whiter" texture to the copy which I think is needed in this context.  The magazine is text heavy and needs a lighter font to prevent it from looking oppressive.  I would use more pull-outs than the sample does - even resorting to a third font for these  - going serif with Plantin italic for example.  The all-text pages can be very tiring.</p>
