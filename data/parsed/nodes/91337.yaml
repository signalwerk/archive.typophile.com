      <p>Looking at this again, I suspect that you provided the real error message,  not just a paraphrased version. If the error message does really complain about running the program "FDK", then you are using a much older version of the FDK that is pre-Intel. The FDK version 2.5  does not have the "FDK" program. Did you download from:<br>
      <a href="http://www.adobe.com/devnet/opentype/afdko.html" title="http://www.adobe.com/devnet/opentype/afdko.html">http://www.adobe.com/devnet/opentype/afdko.html</a>?</p>
      <p>If so,  you  nevertheless have an older version of the FDK on your system, and the current "PATH variable is pointing to it. Please follow the instructions for installing the new FDK as described in FDK/Read_Me_First.html.</p>
      <p>Best regards,<br>
        Read Roberts</p>
