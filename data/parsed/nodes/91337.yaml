      <p>This is bizarre. The FDK is still built with support for PowerPC chips  as well as Intel chips. This message is from the operating system, not the FDK program, and it is saying that it doesn't see the Intel code, only the PPC code.  This has nothing to do with Python version or the options you are using with the programs. </p>
      <p>It is possible that the Lion OS on the latest Airbook does not support the somewhat old FDK Intel code, but I have not heard about that kind of problem. I will look and see if there are other cases. I think it more likely that your download is damaged. Can you try down-loading the FDK again and re-installing?</p>
      <p>The error message seen by Theunis de Jong  is another issue altogether. "BlueValues" are the PostScript name for alignment zones. Hinting a font is a lot more useful if there are some alignment zones, and  fonts without any are illegal and not guaranteed to work in all rasterizers. so autohint is built to object strongly if the alignment zones are missing.</p>
