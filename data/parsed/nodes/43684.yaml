      <p>Yes, it's hinting. If you want to avoid manual hinting of your existing files, get Helvetica Com OpenType font from Linotype which is optimized for best screen quality (an XSF, excellent screen font). Then switch to ClearType, instead of standard smoothing, in Windows XP.</p>
      <p><a href="http://www.linotype.com/12753/neuehelvetica55roman-font.html?#format" title="www.linotype.com/12753/neuehelvetica55roman-font.html?#format">www.linotype.com/12753/neuehelvetica55roman-font.html?#format</a></p>
