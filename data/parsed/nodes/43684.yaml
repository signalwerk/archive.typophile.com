      <p>"How would I go about turning off hinting on Windows XP or while I “generate” the font?<br>
      If you are using FontLab, you can go to the truetype specific hinting preferences in the font generation window and select, don't hint, whatever that is called...I'm not looking right now. You can also edit the "gasp" table which can tell MS apps what to do, including ignoring the hints, also in Fontlab, I think.</p>
      <p>"How would I also go about manually hinting my existing Helvetica .ttfs as well?"<br>
      Learn the TT instruction language MS.com/typography, get Visual TrueType MS.com/typography, learn how to use it, and then hint the y direction of your font.</p>
      <p>I have no idea how serious you are, but my general experience is that users seeking better screen output are more likely to deal succesfully by selecting another font. </p>
      <p>Cheers!</p>
