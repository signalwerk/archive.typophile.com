      <p>" I’m looking for any information regarding what I need to do to fix this. "<br>
      You have several options:<br>
      1. you can go into the outline font and make the characters you want to be the same ht. in bitmaps ,exactly the same ht. in the outlines.<br>
      2. you can turn off all hinting when you generate your existing font, and take another look.<br>
      3. you can manually hint the existing font as it stands. Windows still respects y hints and this will fix it. </p>
      <p>Cheers!</p>
