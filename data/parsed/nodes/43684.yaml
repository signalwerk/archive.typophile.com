    <p>Hello Typophile, I've been looking for a problem for my Helvetica-attempts in integrating the font over the impostor, Arial.</p>
    <p>I've been having some strange results; Helvetica looks fine in some cases, but in other cases, looks awkward. I mean this by strange pixel densities, character spacing, and just plain awkward-looking characters (r's too short, e's look awkward, etc).</p>
    <p>Here's a sample picture of what I'm talking about:<br>
    <a href="http://img.photobucket.com/albums/v150/aznhomig/Strange.png" title="http://img.photobucket.com/albums/v150/aznhomig/Strange.png">http://img.photobucket.com/albums/v150/aznhomig/Strange.png</a></p>
    <p>As the picture details, there are some sections (including the typed text I added myself in Helvetica, of course :)) that look fine, but other parts that don't. I mean this in often short characters, especially in "x"'s, "e"'s, and "r"'s and numbers that just doesn't match up.</p>
    <p>I've heard that Windows XP just has bad font rendering when it comes to PostScript or OpenType, so I'm looking for any information regarding what I need to do to fix this. Perhaps I need to get myself a Helvetica font file in a different format? (Right now it's in TrueType, but I also have OpenType versions that also look awkward when I use them).</p>
    <p>Any help would be appreciated! :D</p>
