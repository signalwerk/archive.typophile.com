  html: |-
    <p>Hi crowd,</p>
    <p>I've been designing a few caps features for one of my text typefaces. Think of the Van Krimpen hyphen, and of course height-adjusted parens, middots, endash and emdash (with hopes of making cap-specific tabular numerals too — one day!). Question is, how do I go about naming them? hyphen.alt is too vague and might clash at some point. hyphen.caps? I was looking for examples, but after ten minutes in the Adobe specification site, I threw in the towel. Is there a convention?</p>
    <p>--<br>
    <em>Edited title to reflect proper nomenclature; post left intact to keep the thread sensible.</em></p>
