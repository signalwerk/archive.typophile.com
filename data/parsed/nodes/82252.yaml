    html: |-
      <p>Fontographer's Metrics Assistance and Kerning Assistance are similar in concept to the metrics and kerning classes in FontLab Studio. Since there are differences, the class kerning in FLS and the assistance values in FOG do not convert between each other (if you use VFB files to exchange the data), and the upcoming version of Fontographer (5.1) will also not change this functionality. But a future version of FOG may incorporate this. </p>
      <p>Best,<br>
      Adam</p>
