    html: |-
      <p>You can use Kerning Assistance to help with that. It lets you create groups of characters that have similar left and/or right sides, and then lets you apply the same kerning values to all of them. It's been a while since I've used it, so I don't remember the details. It's all explained in the manual.</p>
      <p>Incidentally, when you say you "kerned all 56 characters" it kind of makes me think that you used kerning to do the basic spacing in your font. The font should be reasonably spaced with no kerning pairs at all, just by adjusting the space on the sides (called the sidebearings) of each character. Kerning is for exceptions to the normal spacing, problematic pairs such as AT or LW, where your standard sidebearings are not adequate to get reasonable spacing. If you try to space your font primarily with kerning, you're going to create a hell of a lot of work for yourself, create a huge kerning table (possibly too big to function properly) and the font will be useless in programs that don't support kerning. If I guessed wrong about what you've done, then never mind and I apologize for bringing it up. However, if that <em>is</em> what you've done, then you should reset your kerning and space the font properly before doing the kerning.</p>
