    <p>Hi all.<br>
    I've kerned all 56 characters through Fontographer 5 via the manual kerning pair window. It took a bit but I'm satisfied with the result.<br>
    I'm moving on to glyphs with diacritics and realize I don't want to kern the lowercase /a/ 7 times (for each existing pair). I know classes resolve this time issue. How can I access that from Fontographer 5 or from some set .fea file code ("where a then a" for all diacritically marked /a/).<br>
    Does this question make sense? I hope I've worded it well enough.<br>
    Thanks in advance (for saving me hours).</p>
