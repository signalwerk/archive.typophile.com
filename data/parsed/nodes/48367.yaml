    <p>I’m doing a logo for the town of Kindersley and I would love some comments &amp; critique on my logo. </p>
    <p>Requirements:</p>
    <ul>
    <li>Same color blue</li>
    <li>Discover Kindersley name in that order</li>
    <li>A goose must be included</li>
    </ul>
    <p>Look forward to your input</p>
