      <p>You’re welcome!</p>
      <p><cite>That ’g’ is hauntingly familiar, and obviously not typical.</cite></p>
      <p>At this year’s <a href="/node/12338" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TYPO Berlin</a>, <a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a> named this ultra-open ‘g’ the <cite>Danish g</cite>. In fact, this style seems to be quite popular in Denmark – and Sweden. Thomas aka Formschub compiled some of his favourite ‘g’s in a fabulous ‘<a href="http://formschub.de/blog/?p=218">g-trospektive</a>’, with most of the fonts actually coming from Scandinavia. In addition to his great list, there is <a href="http://www.fontshop.com/fonts/downloads/samuelstype/elliot_samuels_pack_ot/?sample_text=g&amp;sample_size=144">Elliot Samuels</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Hans%20Samuelson" title="Create node &quot;Hans Samuelson&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hans Samuelson</a>, <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/trotzkopf_vp/?sample_text=g&amp;sample_size=144">Trotzkopf</a> and <a href="http://www.fontshop.com/search/?q=naniara&amp;x=0&amp;y=0&amp;sample_text=g&amp;sample_size=144">Naniara</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Bo%20Berndal" title="Create node &quot;Bo Berndal&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bo Berndal</a> or <a href="http://www.myfonts.com/fonts/pizzadude/dandygal/">Dandygal</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Jakob%20Fischer" title="Create node &quot;Jakob Fischer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jakob Fischer</a>.<br>
      Having said that, <a href="http://www.fontshop.com/search/?q=hobo&amp;sample_text=Pumuggl&amp;sample_size=96">Hobo</a> is not a Scandinavian design. And even Germans can do freaky ‘g’s: just have a look at <a href="http://www.fraugerlach.de/karbid2.html">Verena Gerlach</a>’s <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_karbid_display_extra_bold/?sample_text=g&amp;sample_size=388">FF Karbid Display</a>. Gee!<br>
      F</p>
