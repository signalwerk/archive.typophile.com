      <p>You supposed was right, there are 2 characters in the font that are actually strongly inspired by the via from kontrapunkt.  The small "g", that's by the way just one of the greatest "g" ever made is and a arrow. The font Eklekta is a mix of total 4 different typefaces. The name "Eklekta" means, to take the best of all and merge into something new. That's exactly  what we did with this font. But beside the fact that we took elements from existing fonts, we spend a lot of work and energy in making a well design and drawn font that in it's self is quiet unique. I agree with you that this is not best practice, but in this case, the font is only used internally for the corporate design for the agency. It's <em> <strong>not</strong></em>  for sale or public available. </p>
      <p>We just put together what we like a lot and shaped our own version from it. To have a great font to making nice looking Posters and other stuff.</p>
      <p>Regards,<br>
      Lars</p>
