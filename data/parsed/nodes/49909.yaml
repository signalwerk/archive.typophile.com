    html: |-
      <p>Thanks to a new thread* I remembered<br>
      that I was planning to get back to this...</p>
      <p>* <a href="http://typophile.com/node/91187">http://typophile.com/node/91187</a></p>
      <p>Lars, thank you for coming here to post that<br>
      honest response - I have to say I only expected<br>
      a reply to my private email to you outlining<br>
      the concern. Doing this in public will surely<br>
      help more people make each other happier in<br>
      this case and in the future. Call me hopelessly<br>
      optimistic!</p>
      <p>That's said, it's still not OK. Meaning ideally<br>
      some steps should be taken, or at the very<br>
      least practices should change in the future.</p>
      <p>The "g" is a special case in the Latin alphabet;<br>
      many people need help making it work. Maybe<br>
      this isn't what happened in your case - it sounds<br>
      like you were simply deeply inspired by it. And I<br>
      agree that the font isn't a clone of the original(s).<br>
      But that does not excuse copying outlines. If you<br>
      did "spend a lot of work and energy" making some-<br>
      thing (sufficiently) unique, you should have just<br>
      spend a little bit more energy making a new "g".<br>
      It's really too cavalier swiping its outlines.  I do<br>
      believe that inspiration is highly necessary; but<br>
      this practice isn't.</p>
      <p>Also, saying that your design is only for internal<br>
      use doesn't excuse this. Via was only for internal<br>
      use too and look what happened! :-/  I also have to<br>
      wonder how the other inspiration-fonts were used<br>
      in the making of Eklekta.</p>
      <p>I'm not some sort of judge, and I only want to help,<br>
      so here's what I recommend - it might be hard to<br>
      swallow: make a new "g" yourself (it can look very<br>
      close); tell Kontrapunkt what happened; and give<br>
      Reinhard &amp; Ostmann the new version, even if they<br>
      probably won't care (and wouldn't want to go the<br>
      trouble of replacing the existing version).</p>
      <p>Good luck, and again, thank you.</p>
      <p>hhp</p>
