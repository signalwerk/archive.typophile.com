      <p>You’re welcome!</p>
      <p><cite>That ’g’ is hauntingly familiar, and obviously not typical.</cite></p>
      <p>At this year’s <a href="/wiki/Typo%20Berlin" class="freelinking" rel="nofollow">Typo Berlin</a>, <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> named this ultra-open ‘g’ the <cite>Danish g</cite>. In fact, this style seems to be quite popular in Denmark – and Sweden. Thomas aka Formschub compiled some of his favourite ‘g’s in a fabulous ‘<a href="http://formschub.de/blog/?p=218" rel="nofollow">g-trospektive</a>’, with most of the fonts actually coming from Scandinavia. In addition to his great list, there is <a href="http://www.fontshop.com/fonts/downloads/samuelstype/elliot_samuels_pack_ot/?sample_text=g&amp;sample_size=144" rel="nofollow">Elliot Samuels</a> by <a href="/wiki/Hans%20Samuelson" class="freelinking" rel="nofollow">Hans Samuelson</a>, <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/trotzkopf_vp/?sample_text=g&amp;sample_size=144" rel="nofollow">Trotzkopf</a> and <a href="http://www.fontshop.com/search/?q=naniara&amp;x=0&amp;y=0&amp;sample_text=g&amp;sample_size=144" rel="nofollow">Naniara</a> by <a href="/wiki/Bo%20Berndal" class="freelinking" rel="nofollow">Bo Berndal</a> or <a href="http://www.myfonts.com/fonts/pizzadude/dandygal/" rel="nofollow">Dandygal</a> by <a href="/wiki/Jakob%20Fischer" class="freelinking" rel="nofollow">Jakob Fischer</a>.<br>
      Having said that, <a href="http://www.fontshop.com/search/?q=hobo&amp;sample_text=Pumuggl&amp;sample_size=96" rel="nofollow">Hobo</a> is not a Scandinavian design. And even Germans can do freaky ‘g’s: just have a look at <a href="http://www.fraugerlach.de/karbid2.html" rel="nofollow">Verena Gerlach</a>’s <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_karbid_display_extra_bold/?sample_text=g&amp;sample_size=388" rel="nofollow">FF Karbid Display</a>. Gee!<br>
      F</p>
