      <p>More on the Eklekta font can be found here:</p>
      <p><a href="http://www.zuopinji.eu/project.php?menu=2&amp;project=8" title="http://www.zuopinji.eu/project.php?menu=2&amp;project=8">http://www.zuopinji.eu/project.php?menu=2&amp;project=8</a></p>
      <p>Lars Vorreiter writes:<br>
      <cite>"For the self presentation of the Agency a corporate typeface was developed. In the development I rebuilt all the characters in Fontlab. I made corrections on the Curve definitions and fitted elements from other fonts in it. The design of the fint consists mainly of three different source fonts. The “Via DSB,” “DTL Argo,” and “LT Rotis’. The font name ›Eklekt‹ was chosen because the word ‘eclectic’ reflects the characteristics of the typeface. It means taking the best of everything. So it just did. This typeface taken all the best features of its source fonts and creates a unique font with lot’s of character."</cite></p>
