      <p>Two more quotes, with links:</p>
      <blockquote><p>In 1997 Danish design agency Kontrapunkt designed the new typeface ‘Via’ for the Danish State Railways to replace the previous ‘British Rail’ typeface who looks like Helvetica Bold. — <cite>Claus Eggers Sørensen: Danish Humanist Modernism at <a href="http://www.forthehearts.net/Danish_Humanist_Modernism"> forthehearts.net</a></cite></p></blockquote>
      <blockquote><p>Bo Linnemann [of Kontrapunkt] professed being influenced by Knud Engelhardt, the famous Danish architect who lived about 100 years ago. The guiding principle in all of Linnemann’s work, accordingly, is legibility. Engelhardt used to open up glyphs such as A, M and N. Linnemann’s face VIA for the Danish Railways (DSB) has inner spaces bigger than those of Helvetica, which was the face used previously by DSB. VIA’s identity is in the lower case g, a neat feature found in more and more corporate typefaces these days. — <cite><a href="http://cg.scs.carleton.ca/~luc/atypi01.html">Luc Devroye: Report of ATypI 2001</a></cite></p></blockquote>
