      <p>A few fonts I have discovered that might qualify to be in the "g-trospective" are: <a class="freelinking external" href="http://www.unifonts.com/e_pages/everyosflight.htm" rel="nofollow">Every OSF</a> and Every Condensed, by Victor de Castro (Unifonts), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/target/" rel="nofollow">Target</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/tantalus/" rel="nofollow">Tantalus</a> by Tomi Haaparanta (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/percolator/" rel="nofollow">Percolator</a> by Adam Roe (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/metamorphosis/" rel="nofollow">Metamorphosis</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/interviewer/" rel="nofollow">Interviewer</a> by Anuthin Wongsunkakon (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/jones/" rel="nofollow">Jones</a> by ? (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/jones/" rel="nofollow">Formica</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/beetle/" rel="nofollow">Beetle</a> by Toby Stokes (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/fox/" rel="nofollow">Fox</a> by ? (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/roland/" rel="nofollow">Roland</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/uniglow/" rel="nofollow">Uniglow</a> by Jim Marcus (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/monolein/" rel="nofollow">Monolein</a> by Joseph Stitzlein (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/compass/" rel="nofollow">Compass</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/septa/" rel="nofollow">Septa</a> by Ramiz Guseynov (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/fasciani-senza/" rel="nofollow">Fasciani Senza</a> by Lee Fasciani (T-26), <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/xyperformulaic/" rel="nofollow">Xyperformulaic</a> by Matius Gerardo Grieck (T-26), and last but not least,   <a class="freelinking external" href="http://www.moorstation.org/typoasis/designers/klein02/text/index_t.htm" rel="nofollow">Parma-Petit</a> by Manfred Klein (once for A*I, now free).</p>
      <p>From this list it's apparent that T-26 is home to many odd g's (and this was not a complete list of the oddities, believe me). </p>
      <p>- Mike Yanega</p>
