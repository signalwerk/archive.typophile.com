    <p>Hi everyone,</p>
    <p>I'd like to use AFDK to compare the glyph widths between two fonts: a revised version, and it's original. I need an easy way to list which glyphs have been modified in the newest revision. If there's a way to do this without using AFDK that would also be useful. I'm new to AFDK so please bear that in mind when responding.</p>
    <p>Thanks in advance.</p>
    <p>Jonny</p>
