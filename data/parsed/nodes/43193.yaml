      <p><cite>«Yes, I know all those letters are needed for portuguese, but are they all considered basic letters? (you must have long blackboards in portuguese schools ;-) What I’m looking for is the stream of letters a child would give you if you asked if it knew the alphabet...»</cite></p>
      <p>No, they’re not all considered basic letters, only the letters without diacritics are. And unlike in Spanish where Ll, Ñ, and Rr are considered separate letters (though Rr is sometimes an exception; it also never occurs initially, and thus has no separate dictionay entry), the Portuguese equivalents of these letters, Lh, Nh, and Rr, are considered regular digraphs, too, not individual letters. (See <a href="http://en.wikipedia.org/wiki/Portuguese_alphabet#Basic_digraphs" rel="nofollow">Wikipedia article</a>)</p>
      <p>&nbsp;</p>
      <p>And yes, Gaeilge (or Gaedhilge, Gaedhilg, Gaoluinn, Gaolainn, etc.) is Irish Gaelic, pronounced [ˈɡɛɪlɪk]. Scottish Gaelic, pronounced [ˈɡa(:)lɪk], would be Gàidhlig (interestingly, unlike the Irish, they don’t seem too keen on having half a bazillion different names for their own language). :-)</p>
      <p>[Edited for IPA accuracy]</p>
