    <p>I'm curious to know how you learned the <a href="/wiki/alphabet" class="freelinking" rel="nofollow">alphabet</a> in school. You know, the selection and order of the letters used to teach children the official alphabet in your country/region - what might be on top of the blackboard in first grade ;-)<br>
    <strong>NOT looking for ALL characters used/needed in a language (I got that covered), only the basic "A to Z" or whatever you call it.</strong></p>
    <p>This to get an overview over what may be considered separate basic letters in your language - it could perhaps be useful for a type specimen/sample directed towards specific languages?</p>
    <p>I'll start with the five languages I know first-hand - and expand with your input (*):</p>
    <p>*Bulgarian: 29 letters =&gt;АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЬЮ<br>
    *Croatian: 30 letters (A to Ž) =&gt; ABCČĆD Dž ĐEFGHIJKL Lj MN Nj OPRSŠTUVZŽ<br>
    *Czech: (42(!) letters =&gt; AÁBCČDĎEÉĚFGH CH IÍJKLMNŇOÓPQRŘSŠTŤUÚŮVWXYÝZŽ<br>
    Danish: 29 letters (A to Å) =&gt; ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ<br>
    English: 26 letters (A to Z) =&gt; ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>
    *Esperanto: 28 letters =&gt; ABCĈDEFGĜHĤIJĴKLMNOPRSŜTUŬVZ<br>
    *Finnish: 29 letters (A to Ö) =&gt; ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ<br>
    *German: 30 letters =&gt; abcdefghijklmnopqrstuvwxyzäöüß<br>
    *Greek: 24 letters (Α to Ω) =&gt; ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ<br>
    *Hawaiian:  13(!) letters =&gt; AEIOUHKLMNPWʻ<br>
    *Hungarian: 44(!) letters =&gt; aábc cs d dz dzs eéfg gy hiíjkl ly mn ny oóöőpqrs sz t ty uúüűvwxyz zs<br>
    *Icelandic: 30 letters (A to Ö) =&gt; ABCDÐEFGHIJKLMNOPQRSTUVWXYZÞÆÖ<br>
    *Irish Gaelic (Gaeilge): 18(23) letters =&gt; ABCDEFGHILMNOPRSTU (ÁÉÍÓÚ)<br>
    *Italian: 22(29) letters (A to Z) =&gt; abcdefghijlmnopqrstuvz (àéèìòù î)<br>
    Norwegian: 29 letters (A to Å) =&gt; ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ<br>
    *Polish: 32 letters =&gt; AĄBCĆDEĘFGHIJKLŁMNŃOÓPRSŚTUWYZŹŻ<br>
    *Portuguese: 26 letters (A to Z) =&gt; ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>
    *Russian: 33 letters =&gt; АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ<br>
    Saami (north): 29 letters =&gt; AÁBCČDĐEFGHIJKLMNŊOPRSŠTŦUVZŽ<br>
    *Saami (skolt): 37 letters =&gt; АÂBCČƷǮDĐEFGǦǤHIJKǨLMNŊOÕPRSŠTUVZŽÅÄˊ<br>
    *Slovak: 46(!) letters =&gt; AÁÄBCČDĎ DZ DŽ EÉFGH CH IÍJKLĹĽMNŇOÓÔPQRŔSŠTŤUÚVWXYÝZŽ<br>
    *Spanish: 27(29) letters =&gt; ABCDEFGHIJKLMNÑOPQRSTUVWXYZ (Ch Ll)<br>
    Swedish: 29 letters (A to Ö) =&gt; ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ<br>
    *Turkish: 29 letters (A to Z) =&gt; ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ</p>
    <p>Please supply the "ABC" for your country/language :-)<br>
    (apologies if this has already been covered - I searched, but found nothing on these forums)</p>
