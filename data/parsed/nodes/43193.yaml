      <p><cite>«Danish: 29 letters =&gt; ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ»</cite></p>
      <p>Growing up, I was always taught in school that the Danish alphabet has only 28 letters, w not being part of it; but this seems to have changed recently. Even <em>Retskrivningsordbogen</em> now has a separate entry for w, which it did not before.</p>
      <p>I’m glad of this, by the way, since lumping w in with v never made sense to me.</p>
      <p>&nbsp;</p>
      <p><cite>«Gaeilge: 18(23) letters=&gt; ABCDEFGHILMNOPRSTU(ÁÉÍÓÚ)»</cite></p>
      <p>What is the status of h as a letter in Gaeilge? J, k, q, v, w, x, y, and z are only used in foreign words and are not counted as parts of the actual <em>aibítir</em>, but then again, the same goes for h, doesn’t it? The only indigenous word I can think of that contains an h would be <em>hurlamaboc</em> (and that’s an onomatopoeia, barely an actual word)—is one word really enough to consider h a separate Irish letter, rather than a function?</p>
    html_clean: |-
