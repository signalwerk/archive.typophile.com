      <p>In Typical's transliterated Devanagari alphabet, note that the distinction of capitalization doesn't actually exist in Devanagari, so the capitals are only used to follow certain romanized conventions. </p>
      <p>And, as I'm sure is probably true of some other alphabets, there are certain Devanagari letters which will never appear at the beginning of a word, and so the capital transliterated form is truly only theoretical. At least not in Sanskrit; there might be some Hindi or Pali conventions that I'm not aware of.</p>
      <p>Also, Typical has, in his bottom summary, listed both m-underdot and m-overdot (sorry, I don't know how to enter the glyphs here) -- but I believe that those are both just alternatives for transliterating anusvara and are not two different members of the alphabet (and may be exclusive of one another, depending upon the transliteration scheme).</p>
