      <p>I'm a Native Portuguese, and as we do learn the alphabet here is not 25 but 26 letters, with the w included although we, not that long ago did just care to learn 23 letters, as in ABCDEFGHIJLMNOPQRSTUVXZ, we didn't use the remaining 3.</p>
      <p>This happened because we have a grammar that's based only on those 23 letters (plus the accents ´`^~, we dont use the ¨ like brazillian portuguese does; the "nh" – equivalent for the spoken "ñ" in spanish – and "lh" – sort of like the spanish "ll", but rather unique – digraphs).<br>
      But with these foreign language words appropriations into our own language and neologisms, the portuguese grammar evolved, so we now include all the basic roman alphabet.</p>
