      <p>Hi Roger, my list is actually copied from Slovak wiki:<br>
      http://sk.wikipedia.org/wiki/Slovenská_abeceda</p>
      <p>It's 46 letters. Yes, children must learn to read and write them all in the 1st school year.</p>
      <p>The letters represent different sounds.</p>
      <p>á, é, í, ó, ú, ý are long sounds for a, e, i, o, u, y<br>
      E. g. Slovak ice-hockey player Marian Gaborik (Minnesota) is actually Marián Gáborík, pronounced Maria:n Ga:bori:k<br>
      ĺ, ŕ are long sounds for l, r. Although r is pronounced very differently from English r, difference in length between r and ŕ is similar to r in English "straight" and "burn".<br>
      These long sounds are not sorted separately in alphabetic lists.</p>
      <p>Carons:<br>
      č is prounounced as ch in English "child".<br>
      ď is a little similar to UK pronunciation of d in "dew". (Uppercase form is Ď)<br>
      ľ is pronounced similar to gl in Italian "Cagliari". (Uppercase form is Ľ)<br>
      ň is pronounced as gn in Italian "lasagne", simlar to ny in English "canyon"<br>
      š is pronounced as sh in "English"<br>
      E. g. Slovak ice-hockey player Miroslav Satan (NY Islanders) is actually Miroslav Šatan, no association with Lucifer.<br>
      ť is a little similar to UK pronunciation of t in "tune" ((Uppercase form is Ť)<br>
      ž is pronounced as J in French name "Jean" or s in English "pleasure".<br>
      These are sorted separately in alphabetic lists. Č after C, Ď after D etc.</p>
      <p>Then there is dz and dž:<br>
      dz is pronounced similar to ds in English "odds"<br>
      dž is pronounced as dg in English "edge" or j in "jam"<br>
      Typography-wise, it is not a ligature but simply d followed by z (or ž).<br>
      Dz and Dž should be sorted separately. But sometimes they are in the end of D-section of alphabetic lists.<br>
      Written as DZ and DŽ when all caps is used.</p>
      <p>Ch: written as Ch if it is the first letter of names , sentence etc. Written as CH when all caps is used.<br>
      Pronounced as J in Spanish name "Juan" or Kh in Russian surname Khrushev or ch in Scottish pronunciation of "Loch Ness"<br>
      Ch is placed after H in alphabetic lists.</p>
      <p>Then we have ô:<br>
      it is "uo" pronounced simultaneously, little similar to uo in English "quote".</p>
      <p>ä - pronounced as a in English "mad". Something between a and e, but majority of native speakers now pronounce it as simple e, like in English "bet".</p>
      <p>y is pronounced as i - no difference, only in written language.<br>
      j is pronounced as y in English "yes"<br>
      w is pronounced as v - no difference, only in written language (w is used in the words of foreign origin only)</p>
      <p>What is much more important, Slovakia has the greatest concentration of pretty women in the world. Especially Englishmen and Germans are very often embarrassed because of this in the streets of our towns.</p>
      <p>BTW, Slovak model Adriana Karembeu-Sklenarikova has Czech surname: it is actually Sklenaříková with Czech ř character, pronounced as r and z simultaneously.</p>
