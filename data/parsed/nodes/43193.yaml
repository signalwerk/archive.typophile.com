      <p><cite>«Part of the reason that the double r is not seen a separate letter is that, in reality, it simply represents a normal r, twice.»</cite></p>
      <p>I don’t doubt that your information is more correct than mine (you’re the native speaker, after all), but I have often heard Spanish people spelling words like <em>pero</em> and <em>perro</em> as, respectively, “Pe E Ere O” and “Pe E Erre O”, which led me to believe that Rr is (at least in the mind of the common man) a separate letter. I’ve never heard a Portugese person spell out similar words like “Pê Ê Erre Ô”.</p>
      <p>(Theoretically, I suppose he’d be more inclined to spell it out as “Cê A com tilde O”, anyways, but that’s a different matter.)</p>
      <p>Not sure exactly how I managed to leave Ch out of the list before, though …</p>
      <p>&nbsp;</p>
      <p><cite>«Dictionaries are no longer sorted according to the alphabet»</cite></p>
      <p>What, then, length? ;-)</p>
