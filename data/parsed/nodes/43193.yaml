      <p>a, ā, i, ī, u, ū, ṛ, ṝ, ḷ, ḹ, e, ai o, au, ṃ, ḥ<br>
      k, kh, g, gh, ṅ<br>
      c, ch, j, jh, ñ<br>
      ṭ, ṭh, ḍ, ḍḥ, ṇ<br>
      t, th, d, dh, n<br>
      p, ph, b, bh, m<br>
      y, r, l, v<br>
      ś, ṣ, s<br>
      h</p>
      <p>Or, in addition to "regular" letters, āĀḍḌḥḤīĪḷḹḸḶṃṂṁṀṅṄñÑṇṆṛṚṝṜṣṢśŚṭṬūŪ</p>
