      <p>I'm not a native speaker, though I study Spanish academically (native English but after living in Spain now my English has noticeably gotten worse mostly in syntax)</p>
      <p>As I mentioned, many people mistakenly think that since LL is a letter, that RR is as well, even making its way into games like Scrabble, so as you mention, in the minds of the average person it is often thought of as a letter.  I generally say "erre doble" when it pops up like I do with t when I inevitably have to spell out my obviously foreign name over here (eme a te doble hache e uve doble); otherwise they think I'm just repeating myself for emphasis, rather than because it actually is a doubled letter. Even for the CH, I generally spell Stuckwisch as ese te u ce ca uve doble i ese ce hache, to make sure they heard me correctly and because it's not of Spanish origin and thus it actually IS a c and an h. (it is possible to have a double R that is not a digraph, such as in the word superresponsable, which <em>technically</em> should be supe<strong>rrr</strong>esponsable) because it's a flap followed by a separate and in theory distinct trill, but unlike the recent German reform, the Spanish realise that three letters like that in a row looks kind of silly).</p>
      <p>In the entry for «abecedario» in the Diccionario panhispánico de dudas (published by the RAE) it mentions the following (I'm posting the translation for others, but the original is at rae.es in the DPHD </p>
      <p><strong>alphabet</strong>. 1. To designate the ordered series of letters with which ones represents the sounds of a language, the terms abecedary and alphabet are used indistinctively.  Like the rest of the romance languages, Spanish basically uses the Latin alphabetic series, which was adapted and completed over the course of the centuries.  The Spanish alphabet is today formed by the twenty-nine following letters: <em>a, b, c, ch, d, e, f, g, h, i, j, k, l, ll, m, n, ñ, o, p, q, r, s, t, u, v, w, x, y, z</em>.<br>
      2. This Spanish variant of the universal Latin alphabet has been used by the Academy since 1803 (forth edition of the academic <em>Dictionary</em>) in the production of all its alphabetized lists.  From this date, the digraphs <em>ch</em> and <em>ll</em> (graphic symbols composed of two letters) were conventionally considered letters of the alphabet, being that each of them represented a single sound.  Nonetheless, in the 10th Congress of the Spanish Language Academies Association in 1994, it was agreed to adopt the universal latin alphabetic order, in which the <em>ch</em> and <em>ll</em> were not considered independent letters.  Consequently, words which begin with these two letters, or that contain them, are alphabetized in the corresponding spaces under <em>c</em> and <em>l</em>, respectively.  This reform only affects the alphabetic ordering process of words, not the composition of the alphabet, of which the digraphs <em>ch</em> and <em>ll</em> still form a part.<br>
      3. While the digraphs <em>ch</em> and <em>ll</em> are the only glyphs that represent, respectively, the sounds /ch/ and /ll/, the sound that represents the digraph <em>rr</em> is the same a that represented by the <em>r</em> in the initial position of a word, or preceded by the consonants <em>n</em>, <em>l</em>, or <em>s</em>.  This overlap explains why <em>rr</em> has never been considered one of the letters of the alphabet. [<em>My addendum: not to mention that there is a minute difference between intervocalic r and the other r-based sounds especially compared to the large distinction that the second l or the addition of the h makes</em>]</p>
      <p>You probably missed it because most of us when we don't think about it will instinctively look up a word like "llave" in the L section.  If we don't find it and say to ourselves "¿qué coño es este?" it dawns on us that we need to check the LL section.  Of course if it IS in the L section it doesn't cross our minds.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
    html_clean: |-
      <p>I'm not a native speaker, though I study Spanish academically (native English but after living in Spain now my English has noticeably gotten worse mostly in syntax)</p>
      <p>As I mentioned, many people mistakenly think that since LL is a letter, that RR is as well, even making its way into games like Scrabble, so as you mention, in the minds of the average person it is often thought of as a letter.  I generally say "erre doble" when it pops up like I do with t when I inevitably have to spell out my obviously foreign name over here (eme a te doble hache e uve doble); otherwise they think I'm just repeating myself for emphasis, rather than because it actually is a doubled letter. Even for the CH, I generally spell Stuckwisch as ese te u ce ca uve doble i ese ce hache, to make sure they heard me correctly and because it's not of Spanish origin and thus it actually IS a c and an h. (it is possible to have a double R that is not a digraph, such as in the word superresponsable, which <em>technically</em> should be supe<strong>rrr</strong>esponsable) because it's a flap followed by a separate and in theory distinct trill, but unlike the recent German reform, the Spanish realise that three letters like that in a row looks kind of silly).</p>
      <p>In the entry for «abecedario» in the Diccionario panhispánico de dudas (published by the RAE) it mentions the following (I'm posting the translation for others, but the original is at rae.es in the DPHD </p>
      <p><strong>alphabet</strong>. 1. To designate the ordered series of letters with which ones represents the sounds of a language, the terms abecedary and alphabet are used indistinctively.  Like the rest of the romance languages, Spanish basically uses the Latin alphabetic series, which was adapted and completed over the course of the centuries.  The Spanish alphabet is today formed by the twenty-nine following letters: <em>a, b, c, ch, d, e, f, g, h, i, j, k, l, ll, m, n, ñ, o, p, q, r, s, t, u, v, w, x, y, z</em>.<br>
      2. This Spanish variant of the universal Latin alphabet has been used by the Academy since 1803 (forth edition of the academic <em>Dictionary</em>) in the production of all its alphabetized lists.  From this date, the digraphs <em>ch</em> and <em>ll</em> (graphic symbols composed of two letters) were conventionally considered letters of the alphabet, being that each of them represented a single sound.  Nonetheless, in the 10th Congress of the Spanish Language Academies Association in 1994, it was agreed to adopt the universal latin alphabetic order, in which the <em>ch</em> and <em>ll</em> were not considered independent letters.  Consequently, words which begin with these two letters, or that contain them, are alphabetized in the corresponding spaces under <em>c</em> and <em>l</em>, respectively.  This reform only affects the alphabetic ordering process of words, not the composition of the alphabet, of which the digraphs <em>ch</em> and <em>ll</em> still form a part.<br>
      3. While the digraphs <em>ch</em> and <em>ll</em> are the only glyphs that represent, respectively, the sounds /ch/ and /ll/, the sound that represents the digraph <em>rr</em> is the same a that represented by the <em>r</em> in the initial position of a word, or preceded by the consonants <em>n</em>, <em>l</em>, or <em>s</em>.  This overlap explains why <em>rr</em> has never been considered one of the letters of the alphabet. [<em>My addendum: not to mention that there is a minute difference between intervocalic r and the other r-based sounds especially compared to the large distinction that the second l or the addition of the h makes</em>]</p>
      <p>You probably missed it because most of us when we don't think about it will instinctively look up a word like "llave" in the L section.  If we don't find it and say to ourselves "¿qué coño es este?" it dawns on us that we need to check the LL section.  Of course if it IS in the L section it doesn't cross our minds.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
