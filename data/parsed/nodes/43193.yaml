      <p><cite> And unlike in Spanish where Ll, Ñ, and Rr are considered separate letters (though Rr is sometimes an exception; it also never occurs initially, and thus has no separate dictionay entry)</cite></p>
      <p>Close, but most native speakers get it confused too.  In Spanish the alphabet is (letters not in the English alphabet emboldened)</p>
      <p>A B C <strong>Ch</strong> D E F G H I J K L <strong>Ll</strong> M N <strong>Ñ</strong> O P Q R S T U V W X Y Z</p>
      <p>Part of the reason that the double r is not seen a separate letter is that, in reality, it simply represents a normal r, twice.  Two flaps are for all intents and purposes, a trill.  A single r is an alveolar flap in most dialects, and a double r is a alveolar trill.  In the dialect of Portuguese I learnt, the r is either a flap or aspiration, and the double r is another sound entirely, roughly a voiceless uvular fricative though not quite exactly the same as the Spanish j.</p>
      <p>Dictionaries are no longer sorted according to the alphabet, as in 1992 the RAE decided to not use the Spanish alphabet for collating purposes, although children are still taught the above alphabet. Additionally, each vowel can have an acute accent placed over it, though they aren't considered separate letters.  As well the U can take a diæresis.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
