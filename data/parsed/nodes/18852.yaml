  html: |-
    <p>Hi There. First time post.</p>
    <p>I'm looking for the variant of Futura that IKEA is currently using. The closest one I have found is Elsner+Flake Futura New (which I can't even find for purchase anywhere, but did find on Identifont).</p>
    <p>It's similar to that, and EF Futura 6 Heavy, with some differences. In general, the differences that I have noted between most versions of Futura and the IKEA 2005 catalog version (Heavy/Bold weight) are:</p>
    <p>In the IKEA version...</p>
    <p>$ has line through entire glyph<br>
    S and $ shaped more like S from Avenir<br>
    j curved *unlike* E+F New, but *like* most editions of Futura<br>
    1 has angled serif<br>
    M and W have flat spurs<br>
    , " are rounded<br>
    e has angled tail even in Bold weight<br>
    m and n are slightly less "symmetrical"</p>
    <p>Any thoughts would be most appreciated. Thanks!</p>
