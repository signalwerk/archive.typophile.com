    html: |-
      <p>I'm sorry, I don't know any font with such a /O but I can't state it's custom made. May be it is as simple as "generic extended sans like Helvetica/Akzidenz Grotesk with a custom /O".<br>
      What I can propose though:<br>
      - the logo itself, freely available to download as vector: <a href="http://www.brandsoftheworld.com/logo/only-denim" title="http://www.brandsoftheworld.com/logo/only-denim">http://www.brandsoftheworld.com/logo/only-denim</a><br>
      - some similars: <a class="freelinking external" href="http://www.foundrytypes.co.uk/the-foundry-typefaces/sans/params/foundry-monoline-12" rel="nofollow">Foundry Monoline</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/northernblock/neo-gram/" rel="nofollow">NeoGram</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/sui-generis/" rel="nofollow">Sui Generis</a> (which comes very close, for the /NLY part at least), <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100041" rel="nofollow">Forza</a><br>
      - a possible track to follow: have a closer look to the /® (register mark), the external circle and /O look like to share the same design. /R reminds me once again of <a class="freelinking external" href="http://www.foundrytypes.co.uk/the-foundry-typefaces/sans/params/foundry-monoline-12" rel="nofollow">Foundry Monoline</a>. So my last call: custom job based on Monoline.</p>
