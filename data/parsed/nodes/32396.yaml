      <p>I have sketches in some of my old sketchbooks that I found quite interesting, but I never knew exactly what to do with them. Till now I suppose ;^)</p>
      <p>Dwiggins is a major reference and I tried to use some of his studies like The "M formula" that seemed quite appropriate for this typeface, but I don't want to go too close to Dwiggins work.</p>
      <p>I don't intent to make it too stylish. The main idea was a typeface that could have different reading levels in different sizes. In small sizes it should be "readable" and in large sizes it should be "visible".</p>
      <p>I was thinking in three weights with italics, along with swashes and ornaments.</p>
      <p>Dino</p>
