      <p>I could work! Total m-formula flashback. It's helpful to use the rough/angled approach to set languages with many diacritics like e.g. Czech. Look here: <a href="http://diacritics.typo.cz/image.php?id=47" title="http://diacritics.typo.cz/image.php?id=47">http://diacritics.typo.cz/image.php?id=47</a> and here <a href="http://www.stormtype.com/typefaces-fonts-shop/families-39-preissig" title="http://www.stormtype.com/typefaces-fonts-shop/families-39-preissig">http://www.stormtype.com/typefaces-fonts-shop/families-39-preissig</a> and here <a href="http://www.emigre.com/EF.php?fid=130" title="http://www.emigre.com/EF.php?fid=130">http://www.emigre.com/EF.php?fid=130</a></p>
      <p>I would carry on. Maybe avoiding to formalise it too much, as it would get closer to Electra, but keeping the extreme angles and such.</p>
