      <p>Don't shy away from being influenced by Dwiggins. He's one of the good ones. ;^)</p>
      <p>I think it is a great idea and while not wanting it to be "stylish" is a fair concern, you can't control how some of us crazy designers will not follow your hopes. Something with this much faceting would have me wanting to show it off. It is like Josh Darden's Freight Micro. It was meant for small point sizes but W magazine liked it so much they commissioned a version for display purposes.</p>
