    <p>American, born 1955.</p>
    <p>Type designer, calligrapher, letterer and educator.</p>
    <p>Together with <a href="/wiki/Peter%20Bain" class="freelinking" rel="nofollow">Peter Bain</a>, curated the 1998 <a href="/wiki/Blackletter%3A%20Type%20and%20National%20Identity" class="freelinking" rel="nofollow">Blackletter: Type and National Identity</a> exhibition at the <a href="/wiki/Cooper%20Union" class="freelinking" rel="nofollow">Cooper Union</a>.</p>
    <p>Typefaces: Bermuda, Donatello, Goteborg, Kolo, Stockholm, and Uppsala for <a href="/wiki/LetterPerfect" class="freelinking" rel="nofollow">LetterPerfect</a>.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/fonts/designer/paul_shaw/" rel="nofollow">Paul Shaw at FontShop</a></p>
