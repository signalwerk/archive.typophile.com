      <p>I do believe in listening and communicating. I was trying to be succinct, but maybe it came off as too dismissive. A "default" typeface choice is just such a common and damaging trait among many designers that it's hard for me to remain tentative about combating it. Although I don't believe in subscribing to a formal school of thought, I can say that every font says something, and there are so many fonts out there it's almost guaranteed that something like Myriad (especially something so over-used) will not be the best choice. For anybody who can't justify the expense of getting just the right font for a project, that's an understandable compromise that nonetheless should be admitted as such.</p>
      <p>Your definition of "neutral" is pretty much mine as well, but it simply varies too much with time and among people to be anything more than a misleading dream. When it comes to the power of type, Vignelli simply did not grasp it. It's almost like he was an artist who didn't want to give credit to the quietly ever-present type designers; to me trying to remove a typeface's particular voice from a typographic composition is irrational.</p>
