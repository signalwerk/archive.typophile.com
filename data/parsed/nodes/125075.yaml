    <p>Hello, I've often used Myriad for my clients as a title and copy font, because of its 'neutrality' and elegance. The black and light version are incredibly well done, and the regular version fits almost every use. In zen tongue some might say it has a transparent quality.<br>
    But it's getting old. I'd like to try out something different. Immediate use would be for the printed things of a school of English in Europe. Any suggestion is welcome.<br>
    Thanks!</p>
