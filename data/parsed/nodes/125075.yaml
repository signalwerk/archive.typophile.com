      <blockquote><p>I was trying to be succinct, but maybe it came off as too dismissive.</p></blockquote>
      <p>Frequently. :)</p>
      <p>I interpret the term neutral as 'suitable for a wide range of purposes'. It's not that a neutral typeface communicates neutrality, but that it doesn't communicate anything overly specific, and so can be used in a lot of different contexts without fear of it being stylistically at odds with the content or the context. There are lots of situations in which this sort of neutrality is desirable — more so today, when type is used to display dynamic content coming from online feeds, messaging, etc. —, and having a go-to neutral typeface isn't a bad thing for a typographer to have on hand, any more than having more strongly voiced typefaces for specific purposes. The point of having a go-to typeface in any style is that one is familiar with how to use it, which is a virtue often overlooked in typography today.</p>
