    html: "<p>Interesting. Without knowing any details of what the client needs/wants, you are prepared to pontificate your subjective opinion? Personally, I would have opted to simply ask questions, such as: (a) what technical capabilities does your client need... meaning, do you need a font which includes built-in superscripts/subscripts/numrs/denoms/smallcaps, etc... (b) is this for more technical copy, informational copy, etc... (c) how diverse of weights do you need (hairline to heavy, or just the basic reg/ital/bold/boldital)? Aren't these types of questions more helpful to the person asking the question, rather than \"not a good idea to use a neutral font\" straight out of the gun?</p>"
