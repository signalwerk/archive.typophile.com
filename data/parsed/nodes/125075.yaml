    html: <p>Hrant, if that is the case, then, why not express your subjective opinions as opinions and not as constructive assistance. Sometimes, people do not even know how to ask the right questions... maybe it is someone who is tapped on the shoulder and told to manage the school publication, and they know little of typography. I have to observe that Vignelli represented a "movement" of thought... although I may have personal disagreements with the school of 10-12 types, as a moral philosopher, I am duty-bound to understand that others may find some element of truth in any school of thought. If you are committed to any specific school of thought, then morally, you have the duty to state the fact that you subscribe to a specific school of thought (I hope you can logically see that to subscribe to any specific school of thought is delusion). Neutrality is a word that means different things to different people. Perhaps the original question referred to a desire to pick a type that did not take the reader's focus away from the text... you would agree that choosing Ayita for a school workhorse type would be a bit over the line, as opposed to a "neutral" workhorse sans such as FF Clan or Secca... in short, we have a collective responsibility to "listen" rather than show others how much we think we know...</p>
