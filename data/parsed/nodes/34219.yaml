    <p>Just wondered what digital cameras board members use and recommend? My 3 year old point &amp; shoot Samsung still does the job, but is starting to look very bulky and outdated.  </p>
    <p>So i’m looking to get something new, i’ve got around £250 to spend, and want another point &amp; shoot (I can’t afford an SLR &amp; would miss the convenience) but I want something with a little extra quality which really makes it stand out from the crowd.</p>
    <p>I’ve been looking at the new Panasonic Lumix DMC-TZ3EB-K <a href="https://web.archive.org/web/20080704154316/http://www.panasonic.co.uk/high-zoom/dmc-tz3eb-k/index.htm" title="http://www.panasonic.co.uk/high-zoom/dmc-tz3eb-k/index.htm">http://www.panasonic.co.uk/high-zoom/dmc-tz3eb-k/index.htm</a> which has a great 28mm lense and lots of features, but what would you spend your money on? thanks.</p>
