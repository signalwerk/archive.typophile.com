      <p>I’ll second the recos for the Canon Powershot line: I bought an A540 (now discontinued) a year ago and love it. Nice interface with my Mac, reasonably intuitive software, and the Basic manual will have you up and shooting within 15 minutes. </p>
      <p>The only negative I can think of off-hand is that it doesn’t take pictures in RAW format, but JPG.</p>
      <p>(edit: and one of the reasons I bought it was because it does have a real viewfinder.  I think only Canon still has them for point-and-shoots, but not on the ELPHs)</p>
