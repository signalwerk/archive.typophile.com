    html: <p>Anti-shake is good, although it doesn’t work if people in the picture are moving. I also specifically chose a camera with the 28mm wide angle range; not all cameras have that. Olympus cameras have good color reproduction, which for me was an important factor. Some camera review websites have downloadable sample photos, which I would encourage you to download and take to your developer and then compare the prints rather than going mental over pixels on the screen.</p>
