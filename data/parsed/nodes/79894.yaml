    html: <p>Someone I've been tutoring in FontLab was having that problem with Photoshop. Turns out for her on the character palette where the kern setting is it was toggled to optical rather than metrics. Metrics is what's in the font and optical is you choosing kern pairs as you set the type. Not sure what the Illustrator problem is but from looking at the graduated difference it looks like its tracking out and the kerning is actually present.</p>
