    <p>I'm having problems with the kerning on my font in Adobe programs. I've attached an image to help explain. </p>
    <p>The black text shows how the font's kerning looks in FontLab. The pink overlaid text shows how the font appears in Photoshop CS5 with standard tracking/kerning.</p>
    <p>The ligatures are working in Photoshop, and the font appears fine in Illustrator CS5, so I know the features file is working.</p>
    <p>Does anyone know what I've done wrong or what is causing this?</p>
    <p>Thanks in advance.</p>
