      <p>All letters of "PRIMARY SYSTEMS INC" except /Y seems to come from <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=URW&amp;ffam=Castle%20T%20Light%20-%20Regular&amp;fid=c6c2b9cad904e2bce35a61754ece6ed6&amp;fsize=60&amp;text=PRIMARY%20SYSTEMS%20INC&amp;fit=1" rel="nofollow">Castle Light</a></strong> by  Steve Jackaman (available from URW++, E&amp;F, Linotype)</p>
      <p>I'm not actually the right person to say if this is appropriate for a engineering firm... but the overall feeling is like it's designed from the engineers themselves and not from a graphic artist.</p>
      <p>=&gt; "psi" dot is out of balance<br>
      =&gt; The high contrast (line thickness variance) between the "psi" and "PRIMARY SYSTEMS INC" makes it inappropriate for small scale sizes<br>
      =&gt; The Blue/Gray transition on the lower band is totally optically unbalanced relative to the "System Engineers" words</p>
      <p>and take into account that I'm just a computer programmer...<br>
      I'm sure that a trained graphic artist eye will discover even more flaws.</p>
      <p>Having done the same mistake myself, my advice is to hire a professional graphic designer to re-design your logo (probably by keeping some basic elements or colors, if you want to keep a connection to the old one).</p>
