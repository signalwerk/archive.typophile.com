    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PrimarySystemIncLogo_3720.jpg"></div><p></p>
    <p> I have attached a logo which was designed in the early 1990's for my employer, an engineering firm specializing in control and system integration.  It is still used, with some variations, in print  materials.  A different logo/look was created in the early 2000's for use on the company's website <a href="http://www.primarysys.com" title="www.primarysys.com">www.primarysys.com</a>.  I recently came on-board as a one-man marketing department, and have inherited all of these different looks.  I'd like to develop (or re-use) a logo which will work in both print and on-line, in 1 color as well as 2 or 3 color.</p>
    <p>I think I have identified 2 of the 3 fonts used.  The “psi” appears to be monotype corsiva bold, which was then made bold again.  (or, as Mike Yanega of Bowfin Printworks pointed out to me, it might have been made bolder using stroke thickness).  The “system engineers” is myriad pro bold italic with a tracking (extension) of about 133%.  I’m about 90% sure of these results, but could very well be wrong – I’m not  a designer, I’m a marketing person!</p>
    <p>For the life of me, I cannot identify the font used for “Primary Systems Inc.” – it’s obviously a san serif type, with an unusual “Y” with uneven arms, and variable thickness in the type.  I certainly don’t have it on Adobe Illustrator and haven’t been able to find anything like it on-line.</p>
    <p>So 2 questions.  Can anyone identify the font for Primary Systems Inc.? and does this logo work for an engineering firm?</p>
