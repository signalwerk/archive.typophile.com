    <p>Hi guys,</p>
    <p>A while ago a famous Argentine cartoonist had an ilness that paralized his arm and did not allow it to draw anymore. So a good illustrator and friend draw the comics from him and to keep his characteristic handwriting style which was a signature some designers converted his calligraphy to regular fonts. The Anarosa Font. Here is the link</p>
    <p><a href="http://www.tipo.net.ar/custom.html" title="http://www.tipo.net.ar/custom.html">http://www.tipo.net.ar/custom.html</a></p>
    <p>Do you know what software could i use to convert the handwriting of an architect that i know to a digital font? Is there any info in the web about how to do it. Besides, one of the great technical challenges i guess is to make a digital font that reflects the different preasure strokes that a good handwriting style sometimes have.</p>
    <p>Thanks for any info and cheers,<br>
    Sebastian</p>
