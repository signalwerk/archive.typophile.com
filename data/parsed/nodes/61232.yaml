    html: <p>I've built custom symbol fonts using Illustrator and Fontographer. Each icon was saved as an individual EPS and imported. Setting your compound paths correctly in Illustrator takes a little practice so they display correctly in Fontagrapher. The same process could certainly be used to create a handwritten font.</p>
