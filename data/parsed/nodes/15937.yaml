      <p><em>the overlap with my own data is significant ... most people buy boring, classic fonts</em></p>
      <p>Certainly, many vintage type designs are sold, and many designers say they use them (while no doubt keeping mum about Comic Sans and Papyrus).</p>
      <p>Nonetheless, your "top 19" is exclusively comprised of old typefaces from corporate sellers.<br>
      It may well be, as you claim, "19 top fonts most preferred by [some] graphic designers from around the web", but it is missing at least ten typefaces from the "tidbits" list you mention, that were designed and published in the present millennium.</p>
      <p>Why are you biased against contemporary, independent foundries?</p>
      <p>Perhaps it is because the majority of the fonts on your 19 came bundled with Adobe applications and the Mac OS?<br>
      (I know, because that's how I acquired them.)<br>
      Are you suggesting that designers' best practice is to stick with fonts from corporate publishers, that they acquired through bundling?</p>
      <p>Take a look at the MyFonts bestsellers, and get up to date.</p>
      <p>Alright<br>
      Bree<br>
      Klavika<br>
      Narziss<br>
      Origins<br>
      Brandon Grotesque<br>
      Geogrotesque<br>
      Champion Script<br>
      Museo<br>
      Mrs Eaves<br>
      &amp;c.<br>
      &amp;c.</p>
      <p>And then there are the Hoefler and Frere-Jones types.<br>
      I understand they are quite popular, and highly visible in the media, although they may not be AS popular with the majority of designers who use free, bundled, and less expensive fare.</p>
