      <p>Aggregating creates bias because not only does it report the long tail, it feeds it.</p>
      <p>Consider <a href="http://www.fontshop.com/fontlist/n/jason_santa_marias_favorite_fonts/?utm_source=NewsletterJune8&amp;utm_medium=web&amp;utm_content=JSMFavoriteFonts&amp;utm_term=em&amp;utm_campaign=DesignerSantaMaria" rel="nofollow">Jason Santa Maria's favorite fonts</a>, as featured at FontShop.</p>
      <p>He has chosen several classics, such as Garamond and Trade Gothic, which are on many people's lists.<br>
      He has also chosen recent fare, such as Freight, Skolar, and Vista Sans, which are less broadly established.</p>
      <p>So even though a poll of designers may reveal that their font choices are 50/50 classic/new, because the old faces come from a small stable of classics, whereas the new are a more disparate selection, the old faces will beat out the new in a "most preferred" list.</p>
      <p>But this is a lie, because it gives the impression that most designers prefer classics exclusively.</p>
      <p>Doug, you have used the metaphor of the long tail: abide by it, and find a way to reflect the truth that together, the belly and the tail are bigger than the head. This is the nature of the digital font beast.</p>
