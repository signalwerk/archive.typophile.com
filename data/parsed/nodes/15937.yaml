    html: |-
      <p>I think the list has <em>some</em> relevance. Two independent articles that came to very similar conclusions:</p>
      <p><a href="http://abduzeedo.com/17-designers-favorite-fonts" title="http://abduzeedo.com/17-designers-favorite-fonts">http://abduzeedo.com/17-designers-favorite-fonts</a></p>
      <p><a href="http://justcreativedesign.com/2009/03/04/the-top-100-best-fonts-of-all-time/" title="http://justcreativedesign.com/2009/03/04/the-top-100-best-fonts-of-all-time/">http://justcreativedesign.com/2009/03/04/the-top-100-best-fonts-of-all-t...</a></p>
      <p>I'm just reporting what I found by doing my own "unscientific" research. That is all.</p>
      <p>My sample was big enough so that there was no meaningful (to me) distinction in the "long tail" of self-reporting "favorite font" data I could find on the web after a certain point. My own statistics showed that after the first 19 fonts (20 and beyond, on my list) the "tail" shot out and I concluded my data was broad enough. I was not interested in doing more than that, since I wasn't interested in the tail so much as the consensus.</p>
      <p>If you simply took the excellent results from the survey in the first article at Abduzeedo, and got rid of the long tail, you will find an extremely close overlap with my own research, perhaps close to 90%. And that is just with 17 designers.</p>
      <p>The results from the second article, primarily based on sales, confirm nearly the same.</p>
      <p>One last tidbit I just found from 2009:</p>
      <p><a href="http://szstudiodesign.com/wordpress/typography/best-selling-fonts" title="http://szstudiodesign.com/wordpress/typography/best-selling-fonts">http://szstudiodesign.com/wordpress/typography/best-selling-fonts</a><br>
      ===<br>
      "According to fonts.com   and fontshop.com  the following fonts were best sellers in 2009:</p>
      <p>Arial •  ITC Franklin Gothic • Benton Sans • FF Meta • FF Din • Eurostile •  Gill Sans • DIN Next • Avenir • Futura • Frutiger • Helvetica • Interstate • Akzidenz Grotesk • Univers • Trade Gothic • the Sans • Neo • SoHo •  ITC Avant Garde Gothic • Rotis • Zapfino • Optima • Estillo • Helvetica Neue • Estilo Script • Waza™ • Olicana Smooth OT • Louisiana • Metroscript OT</p>
      <p>There are many more <strong>classic fonts</strong> than I would have imagined."<br>
      ===</p>
      <p>You'll once again notice, based on recent sales stats from the vendors mentioned, the overlap with my own data is significant, as well as the reliance by many font purchasers on classic typefaces. </p>
      <p>So, my data, while not clinical in a formal sense, are nonetheless devoid of willy-nilly spuriousness. It does reveal that most people buy boring, classic fonts though, according to many sources and not just mine.</p>
    html_clean: |-
