      <p>Thanks for the offer Doug, but the ad hoc inclusion of this critic's fonts won't appease me or make your list relevant.</p>
      <p>"Several hours" of internet aggregation may indeed provide a "top fonts" list, but the assumption that this corresponds to the fonts "most preferred by graphic designers" is completely spurious.</p>
      <p><em>...these ARE the fonts that most designers use on a routine basis.</em></p>
      <p>That sounds authorative, but it's bullshit with no meaningful statistical basis. Who are these "most designers"? How big is your sample? Did you ask them to analyze their recent work and name the fonts used? Did you do a survey of web sites and print publications? Or competitions?</p>
