      <p>@ Nick:</p>
      <p>I see your point. I would emphasize that the data is not a lie, but rather, it represents only one aspect of a complex picture to the exclusion of another from a particular perspective. That is nearly unavoidable, as the intro to Tamye's book suggests, with any discussion about.</p>
      <p>You are right in saying the picture is not so simple. The problem, though, is that the other aspects (facets of the "long tail") are indeed much, much harder to represent. It's like trying to quantify "The top 10 independent Bed &amp; Breakfast Inns": it just can't be done because they are so localized and specialized, that "top" doesn't apply. You could say "10 great independent Bed &amp; Breakfast Inns", but that would not be data; it would be opinion.</p>
      <p>I guess it's how you read the data - the meta narrative surrounding the facts.</p>
