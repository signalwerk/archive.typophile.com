      <p>If you're talking about mixing fonts, I would say that any two fonts can be mixed, according to one principle or other.<br>
      So the principle is the important thing. (And in a way, a named font represents a principle, especially if it is one that has entered the collective conscious as an archetype, through many revivals at different hands--i.e. a classic.)</p>
      <p>Don't name each B&amp;B, but you will have to make some effort at defining categories in an abstract way. Rather than "like Helvetica", say Swiss. And don't get so hung up on "top". </p>
      <p>Where is the beauty of serendipity and unprejudiced encouragement to people to construct their own strange and unprecedented meanings, in the formulaic world of If You Liked That You'll Like This?</p>
