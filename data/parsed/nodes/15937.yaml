      <p>There is a language involved in all this, and exposing curious people to the common denominators is helpful for learning the basics, specifically when they are asking about the basics. Before serendipity can happen, there must be a common language to facilitate it: my little article is geared towards that "boring" common denominator that Google tells me people are asking about.</p>
      <p>All that said, you are making me think about where I could take this to help facilitate the unexpected.</p>
