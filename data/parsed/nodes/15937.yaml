      <p>(* = overlap in top 20)<br>
      (** = overlap in top 50)</p>
      <p>** Futura<br>
      Garamond<br>
      * Frutiger<br>
      * Helvetica / Helvetica Neue<br>
      Minion<br>
      Bodoni<br>
      Clarendon<br>
      Franklin Gothic<br>
      * Univers<br>
      Gill Sans<br>
      * Akzidenz Grotesk<br>
      * Avenir<br>
      Caslon<br>
      ** Myriad<br>
      FF Din<br>
      ** Trade Gothic<br>
      Baskerville<br>
      Warnock<br>
      Bembo</p>
      <p>The Hoefler and Frere-Jones types still didn't register outside of the top 20 in my research, though I'm pretty sure Interstate was in the top 40 somewhere, as was Gotham. I was kind of surprised that Gotham wasn't in the top 20 actually. </p>
      <p>It's a *very* good assumption that many designers get typefaces like Arno, Warnock, and Myriad with Adobe products and/or Mac OS. While not exciting, they are versatile and above all - included in your Adobe purchase and thus likely to occupy a soft spot in the hearts of many new designers.</p>
      <p>The data is skewed towards corporate and otherwise free or low-cost classic faces due to distribution channels for them, like Adobe, having sheer numerical dominance. It's hard to compete with free. But unless the sales data at MyFonts is misleading, people are still going out of their way with cash money in hand to buy some of these oldies for reasons attributed to the overall usefulness of the typeface. If you are on a limited budget and are just starting out and want to acquire a type library, it makes good sense to get a Helvetica Neue expanded collection going. Gotta start somewhere.</p>
      <p>"Why are you biased against contemporary, independent foundries?"</p>
      <p>Again, I'm just reporting the fact, not setting an agenda. </p>
      <p>"Are you suggesting that designers' best practice is to stick with fonts from corporate publishers, that they acquired through bundling?"</p>
      <p>I'm not suggesting that is a best practice, but I'm reporting it as a matter-of-fact practice.</p>
      <p>I think a best practice is to encourage designers to spend money on new typefaces especially from independent foundries, like they would on music gear if they were musicians, or on paints and materials if they were artists.</p>
      <p>I will be doing new research and blog content focused on independent foundries in the coming months.</p>
      <p>It just happens that the last type book I purchased a few weeks back, "Typeface: Classic Typography for Contemporary Design" by Tamye Riggs is a real delight to read. The list of typefaces she works with contains 46 typefaces, all of which are on the lists and research I did. She got a lot of flack from her "fellow type fanatics" about what should and shouldn't be on the list. </p>
      <p>Her concluding sentence in the intro rings true for me:</p>
      <p>"What is included is ultimately not the preference of the authors - the content evolved organically from a thorough exploration of typography in the design world."</p>
      <p>Her research mirrors mine nearly identically. She did more research than I, so I'll defer to her list, even though I did my research before her book came out earlier this year.</p>
      <p>But the second paragraph of the intro is even better:</p>
      <p>"I could see tremendous potential for such a type book. Let me preface this by saying that I'm a big fan of living type designers and I support their efforts as much as possible. But while plenty of graphic designers employ new typefaces in their projects, there is still a tremendous amount of stunning work being produced using type that originated in the twentieth centuries and much earlier."</p>
      <p>I couldn't say it any better myself, so I won't try!</p>
