    <p>Hi,</p>
    <p>This isn’t quite font ID but close enough. I am working on a project that is a recording of some music by a Spanish composer called Pablo de Sarasate. Does any one know of any fonts that are similar to any of the fonts used in this image? </p>
    <p>Any help or suggestions would be great, cheers!</p>
