      <p>My best suggestion to find fonts representing this era is to search for <a href="http://new.myfonts.com/search/victorian/fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Victorian</a> and pick some that you think will work. I doubt if you will exactly match these, but you could be true to the feeling of the time period.</p>
      <p>- Mike Yanega</p>
