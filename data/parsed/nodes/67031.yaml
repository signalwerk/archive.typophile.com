      <p>Try this:</p>
      <p>f=fl.font<br>
      fIdx=fl.ifont<br>
      classes = f.classes<br>
      for k in range(len(classes)-1,-1,-1):<br>
      &nbsp;&nbsp;&nbsp;if len(classes[k].strip()) and classes[k][0] == "_":<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;del classes[k]<br>
      f.classes = classes<br>
      fl.UpdateFont(fIdx)</p>
