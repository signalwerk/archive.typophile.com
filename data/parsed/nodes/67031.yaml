    <p>Hi</p>
    <p>Can anyone tell if it's possible to delete OT Classes using Python. I have tried something like:</p>
    <p>for k in range(len(f.classes)):<br>
      s = f.classes[k][0]<br>
      if s=="_":<br>
        del f.classes[k]</p>
    <p>to delete every class that starts with an underscore, but this approach doesn't work. Is there another way to delete classes or am I doing something stupid?</p>
    <p>tia<br>
    M</p>
