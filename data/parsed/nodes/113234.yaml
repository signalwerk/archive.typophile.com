      <p>Hmm. It ain't ever quite that simple. If the sizes used are similar, you'll have to take a close look, as to weight, as to compatibility. If the sizes are quite different, almost anything reasonable works.</p>
      <p>I do think if I were using an OpenSource font like Gentium &amp; wanted a sans, I'd pay close attention to Lato</p>
      <p><a href="http://www.latofonts.com/" title="http://www.latofonts.com/">http://www.latofonts.com/</a></p>
      <p>Which in it's own right is an excellent font family. That it's free &amp; open source is just gravy.</p>
      <p>BTW, when we've used Gentium, we've found the Book -- available only in basic-- has better weight for text for our uses, which includes both print and the smaller size tablets, such as the Kindle Fire &amp; Android phones.</p>
