    html: |-
      <blockquote><p>and Myriad offers that (and it is not so cold and sterile as most sans-serifs, which is why it seems to me that it might work well with Gentium...</p></blockquote>
      <p>Or perhaps a more cold, sterile look would be exactly right. If this is academic Anglo-American philosophy, often the authority of a "sterile" sans would be more in keeping with the discipline than a humanistic one. Metaphysics has been banished, don't you know (not to mention all that soft, soapy stuff...).</p>
      <p>Knowing the subject matter, you might take a look at Thomas Phinney's <strong>Hypatia Sans</strong>. Yes, I know there is a humanistic element in Hypatia, but the geometric element might go well with the topic, and I think will work nicely with Gentium.</p>
      <p><a href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html" title="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html">http://www.adobe.com/type/browser/landing/hypatia/hypatia.html</a></p>
      <p><cite>Edit:</cite></p>
      <p>As I remember, there is no bold for Gentium. Depending, you may feel this lack if there are many formal propositions in the text... Not too many proofs use bold, but occasionally it is needed. If the publisher want's to stick to Open Source, Charis may suit the text better -- though I'm not sure it has all the needed logical/mathematical operators. The publisher needs to either inform you of the requirements of the text, or pay you to go through it &amp; discover them. Good luck with it,</p>
