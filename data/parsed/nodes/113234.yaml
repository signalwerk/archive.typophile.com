    html: |-
      <blockquote><p>This book in fact places itself in the nowadays already thriving metaphysics-revival strand.</p></blockquote>
      <p>Metaphysics never went away -- it just migrated over to the English department, under the guise of deconstructivism, etc. Are you saying it is now moving back to academic philosophy?</p>
      <p>&amp; a reminder, the usual caution in designing is to select fonts that will make the reader comfortable. Nothing like an old, familiar pair of shoes to make you pull out the wallet &amp; buy the book (to mix a metaphor). If you want to "challenge" a reader (an oft-heard remark by people who teach design, but do not hire out), write your own damn book. While the reader (buyer &amp; hopefully enjoyer) is usually the most important member of the audience, if something is written by a famous author, or an author the publisher wants more work from, by all means consider their preferences. Finally, remember the title page is for you (as designer), the author, and esp. the author's mother. Have fun, no one else will comment on it...</p>
