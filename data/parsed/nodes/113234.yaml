      <p>Sorry for the drop-out, too busy...</p>
      <p>Thanks for your comments. I would never call that thing in the English departments a "Metaphysics". But yes: there is a metaphysics - and I mean real metaphysics, of the Plato-Aristotle-Aquinas style - revival in philosophy ever stronger since the 60's. But back to typography: I have no ambition to "challenge" anyone through type; I just want the typography to be good: as good as possible with my limited means. For my profession (I mean the one I am paid for) too is not typesetting but writing philosophy books :-)</p>
      <p>I have settled on keeping the Myriad as my sans-serif font; here is a specimen of the result:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/specimen_3705.png"></div><p></p>
      <p>Thanks everybody for your feedback!</p>
