    html: |-
      <p>Thanks for the comments!<br>
      It is a philosophy book, about 250 pages with much technical stuff like formulas, arguments, blocquotes etc. and many (really: 6!) levels of headings; which is why I need some means to distinguish them without getting too messy and Myriad offers that (and it is not so cold and sterile as most sans-serifs, which is why it seems to me that it might work well with Gentium). No illustrations, just 2 diagrams; intended for philosophy of religion nerds. The choice of Gentium is determined by the house style of the publisher. Yes, I am using the "Book" version.</p>
