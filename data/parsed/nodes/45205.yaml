      <p>Is this book a romance novel? A collection of anecdotes? A guide?<br>
      The type should match the text.</p>
      <p>Scotches are truly beautiful! </p>
      <p>Matthew Carter designed Miller with newspapers and magazines in mind. And since you are using Miller Daily, even more so. It has the most “literary” feel of the do-it-all scotch systems lately. Chronicle is the most sterile.  The only thing that concerns me is that Miller Daily has (I think) shorter descenders and ascenders.  These are key for reader cognition.</p>
      <p>People set books in Times all the time- does it look great? - not award winningly so, but Miller is much better than Times. </p>
      <p>Your cover is lovely!</p>
      <p>Mikey :-)</p>
      <p>PS... Why are you using cheap paper for a book?</p>
