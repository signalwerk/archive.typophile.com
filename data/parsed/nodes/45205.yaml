    html: |-
      <p>Thanks Mikey,</p>
      <p>About the book: actually there will be forty titles or so in this series. The assignment is from a medical publisher, they wanted something simple and clear for their new paperback editions to be sold in pharmacies, supermarkets and kiosks here in Finland. As the titles vary from depression to insomnia and smoking I decided to do something generic. The color in the upper Fibonacci section will always be a different PMS spot and the little black supersharp 1-bit image will change with the theme. Besides that, they’ll be uniform.  The texts are prose - or kind of ... so I felt that a “medical” font would feel too cold. The idea here is to get close to the reader with rather difficult issues.<br>
      I myself come from a magazine design background. Maybe that’s why I went for Miller and the descenders and ascenders feel ok to me. Somehow finnish looks better that way ...<br>
      The paper was already chosen before I was called in, and it’s not super bad ...<br>
      By the way, I tried Chronicle. Didn’t work.</p>
