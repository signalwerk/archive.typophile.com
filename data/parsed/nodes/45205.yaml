    <p>Hi,<br>
    I know that Matthew Carter’s Miller was designed for newspaper use. However, trying different fonts for body copy in a book I’m designing right now, Miller looked just right – thus I’ve decided to use it.<br>
    Is this a faux pas?<br>
    Are there any cultural connotations or traditions regarding Scotch Romans that I am not aware of?<br>
    Will I be laughed at by typophiles?<br>
    The book is printed on cheap uncoated paper – isn’t this one reason a newspaper font would actually work better?</p>
    <p>On the cover I used a combination of Neutra and Miller Display Italics.<br>
    Again, did I go wrong here?</p>
    <p></p><div class="imageWrap"><img src="/web/20080906124051im_/http://typophile.com/files/cover_6103.jpg"></div><p></p>
