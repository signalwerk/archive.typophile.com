    <p>In my quest for a perfect subtitle font for DVD, I have tried in vain to identify the one that I think is ideal. I have attached a sample of subtitles I have copied from the movie, and I hope you can help to shed some light on it.</p>
    <p>Ideally, I am looking for a san-serif font with double-storey "g" and curly "y", and preferably in condensed form. Any help is welcome.</p>
