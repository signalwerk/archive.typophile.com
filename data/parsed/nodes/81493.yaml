      <p>Riccard0,<br>
      Thanks for your lead. Andale Sans is indeed close, if not because of the letter "W", which does not have a lower middle. The spur of "Q" is also slightly different.</p>
      <p>The subtitle is in fact from another Lionsgate movie (similar to your lead), "The Red Violin".</p>
      <p>As to Trebuchet, personally I find it a very good choice for subtile too, but the software I am using could not render the italic font correctly (it becomes bolder than usual). Adjustment has to be made too to the spacing during rendering to produce easy-reading subtitles. But it has a plus point compared to most san-serif fonts, as it has a curly tail for lower cap "L". It looks nicer actually on screen.</p>
