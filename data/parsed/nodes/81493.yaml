      <p>Hi Hrant,<br>
      I get your point. Unfortunately, DVD subtitle has many limitations in terms of anti-aliasing, and most fonts would appear blurry, unlike subtitling for other movie formats, such as DIVX or MKV. Also, the rendering software imposes its own limitation in terms of character spacing and outline. That is why it's difficult to find an ideal font, though there are tonnes of fonts available out there.</p>
      <p>I have heeded Mike's advice and use a font editing software to customize the font set I need (curly "f", curly "l", musical symbol, etc, based on Franklin Gothic Condensed), and I am fairly satisfied (80%...) with the outcome. My quest is over temporarily, until such a time I can find a better rendering software. Thanks for all the input. It's a pleasure to receive help from the professionals.</p>
      <p>YK</p>
