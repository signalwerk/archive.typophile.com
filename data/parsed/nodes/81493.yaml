    html: |-
      <p>Hrant,</p>
      <p>&gt;&gt; Some professional subtitling tools can improve on the rendering</p>
      <p>&gt;How do they do this?</p>
      <p>&gt;OK, a question: When that's the case is it then true that a bitmap font (as opposed to &gt;an outline font) can address specific pixels and not suffer from as much blur?</p>
      <p>The designers of these tools have striven to optimize the rendering engine/algorithm, so as to achieve the best contrast/smoothing/anti-aliasing of the font edges under the severe limitations of color choice and transparency depth. For example, some work based on 8-bit color and on bigger font first before scaling the final subtitles back to the desired size and to 4-color graphics (it's 4-bit actually, but only 4 colors are allowed at any time). In this way, the outline would be more defined. It also means choosing the right font becomes paramount as the output of the algorithm differs in quality on different types of fonts. (These tools/software typically cost more than 1000 Euro.)</p>
      <p>Some hobbyists even use Photoshop to render the subtitle individually with specially designed filter to achieve the desired effect. It's painstaking as typically a 2-hour movie would have 1500 subtitles. You may read this under <a href="http://home.comcast.net/~c.linke/dvdsub/" title="http://home.comcast.net/~c.linke/dvdsub/">http://home.comcast.net/~c.linke/dvdsub/</a>.</p>
      <p>I believe a bitmap font would thus be more difficult to achieve the desired anti-aliasing effect as there are more "gaps" to fill and apparently the algorithm would be much more complex. But that is just my guess.</p>
      <p>Also, the "burnt" subtitles I have attached appear blurry as I believe it is caused by the blending of the font edges with the background shadow using proven techniques such as "Gaussian Blur" so that they appear smooth. "Burning" the subtitles onto the movie is akin to printing text using a printer, while DVD subtitling is essentially an overlay over the movie. Thus the latter could not come close in term of sharpness.</p>
      <p>If you interested, you may read this article under <a href="http://forum.doom9.org/archive/index.php/t-116734.html" title="http://forum.doom9.org/archive/index.php/t-116734.html">http://forum.doom9.org/archive/index.php/t-116734.html</a>, in which they discuss about how to render high quality subtitles. Based on their experience, the choice of the right font type is apparently vital.</p>
      <p>Also, there is an article under <a href="http://screenfont.ca/fonts/today/interim/" title="http://screenfont.ca/fonts/today/interim/">http://screenfont.ca/fonts/today/interim/</a>, which discusses what is the ideal font for subtitling. For font specialist like you, you will definitely find it insightful and interesting.</p>
      <p>YK</p>
