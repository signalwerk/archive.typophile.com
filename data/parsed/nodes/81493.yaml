      <p>HI Hrant,<br>
      The problem with DVD subtitles is due to its primitive format/specifications. They are actually rendered from bmp/tif graphics that can only support 4 colors at any time,  and based on very small font size (about 18~24 typically). Thus it is almost impossible for a "perfect" anti-aliasing to smooth out the edges. So if you observe the subtitle next time you watch a DVD movie, you may realize the edges of the fonts are jagged. Some professional subtitling tools can improve on the rendering, thus giving a better and smooth-looking subtitle, such as those DVDs produced by Criterion. Still, it is far from perfect.</p>
      <p>In fact, the sample I attached in my original post is not "really" the normal DVD subtitle, but they are being "burnt" onto the movie itself (the original dialogs are in German for that section, thus the special treatment of the subtitles for this portion of the movie). Hence it appears to have a smoother edge than normal but looks blurry.</p>
      <p>It is only in blu-ray that these limitations are being overcome, with 8-bit color depth, alpha transparency, and can work on large font size. The end result? the subtitles look as if they are being printed by laser. Thus they appear sharp and crisp.</p>
      <p>YK</p>
