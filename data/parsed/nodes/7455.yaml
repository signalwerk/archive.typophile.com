  html: '<p>I am a design student. We are expected to design a typeface based someone with social influence. Though conrtoversial, I chose Tupac Shakur. I believe he is misuderstood by many people, specially by the older and conservative group of the society because of his unconventional approah to expressing his fears, anger, hope, and other feelings. <br> <br>Now I am in the explortory phase and I am reading a lot about him. However, i might appreciate any assistance on approach that would make his believer happy and his critics more open. I am collecting words that describe him. Here are some of them: <br>controversy, ultra-masculinity, rough, soft, thug,  activism, poverty, god, urbanism, fast/speedy, tension, contradiction, unstable, self-destructive... <br> <br>Here is his site that i got most of his information from: <a href="http://www.2paclegacy.com/" target="_blank">http://www.2paclegacy.com/</a> <br> <br>any info that can help me decide on a direction or conceptualizing is really appreciated... <br> <br>TC</p>'
