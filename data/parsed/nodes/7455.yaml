    html: "<p>Hi everyone, it seems like i have a lot to write about for not responding ontime.Thanks everyone for your input. <br> <br>Scott, thanks for the cool link. Actually, there is a small book which consists word illustrations: <br><a href=\"http://wordsatplay.com/\" target=\"_blank\">http://wordsatplay.com/</a> <br> <br>Raja, I like the idea of having a mixture of a classic typface and wild graffiti characters. Would be interesting to see the expected and unxpected qualities of them, it is kind of like hinting one thing over another like Hrant says. I'm his big fan too, thus why I am taking the risk of showing it off to conservative designers, while many are doing traditionl ones. <br> <br>Thomas, \"Glamour, wealth and beauty in the presence of death\" nice keywords. I'll look into them.  <br> <br>Chris, Emigre's Priori has some features that relate to tupac as well. I like how the letter \"t\" looks like a cross that tupac has on his back and he refers/hints it/God in a lot of his poems. That's a cool tip. <br> <br>This class goes a little slow at the begining as we have to research a lot. But, I'll make sure to update u with the approaches, progress, and results. <br> <br>Thanks U all!! <br>Tseggai</p>"
