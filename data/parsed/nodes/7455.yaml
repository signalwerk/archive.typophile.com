    html: <p>On top of everything, he was a voice, a poet and a philosopher. So maybe a typeface that reflects his ability to express his views while balanced with some regularity to reflect his rhyme and reason. If that made any sense, what I mean is, utilizing some wild graffiti tag elements here and there  (overcoming adversity), but held intact firmly by some charachteristics of a classic typeface? A bit of challenge I'm sure, anyway, I thought some input from a fan might be helpful. <br> <br>Nice link Scott</p>
