  html: |-
    <p>As you probably already know, Adobe is unleashing the <a class="freelinking-external" href="http://www.adobe.com/products/creativesuite/">CS4</a> soon. The upgrade price tag is not a pleasant surprise, almost 900€, and the price for a regular Design Premium Pack more than 2.638€.</p>
    <p>My question is, is anyone into the multiple licenses on Adobe products? Any drastic price discount over the normal licenses?</p>
