    html: |-
      <p>There is too many things happening in this logo. First off, go back to designing in black and white, color is one of the last things you deal with in a logo.</p>
      <p>First off, you might want to consider picking a different font, especially if you’re “geared towards women”. Second, the weight change for “ress” isn’t necessary and adds little to the meaning, same with the illustrator brush stroke ’v’.</p>
      <p>The tagline also needs reworked, it’s much too small, and looks smashed up under the end of the logo like a wad of clay. </p>
      <p>The icon, I assume is a calendar, doesn’t look like a calendar. Pull it out and rework it to resemble a calendar more. This could become the logomark and work side by side with your logotype. </p>
      <p>Back to the sketch pad with this one.</p>
    html_clean: |-
