    <p>I'm working on a logo for a friend, who's opening his own plumber company. The companys name is «MR Sanitär Service &amp; Boilerentkalkung». MR are the initials of his first name and surname. </p>
    <p>My aproach is to use the initials as a monogram. The M symbolises the heater (radiator) and the R a wrench.</p>
    <p>Use of typeface:<br>
    MR = Bauhaus 93<br>
    Sanitär ... = Eras demi</p>
    <p>What do you think about the monogram and the use of typeface?</p>
    <p>Looking forward to hear your crit!</p>
    <p>Cheers<br>
    Chris</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_5350.jpg"></div><p></p>
