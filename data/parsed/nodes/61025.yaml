      <p>I think it's a fun idea, and I especially like the concept of an R as a wrench. The typeface is beautiful. </p>
      <p>But ... a few things prevent it from really working. Until I read your description, I struggled to try and figure out what was going on. The bolt is very distracting because it's not obvious why it's there or what it is. The wrench doesn't look wrench-y enough, and my gut is telling me that's because it's chopped off so abruptly on the left and it's not actually gripping the bolt. It's in the perfect position to badly strip the bolt. (Bad plumber!)</p>
      <p>The second issue is the radiator. I don't know about you, but the only time I've ever seen a slanted radiator was after an earthquake. So, it doesn't read as anything except a letter M, which is fine, but not really what you were hoping for, right? </p>
      <p>Third; do plumbers work on radiators? Can I guess that long word that begins with 'Boiler' means 'heating' somehow? </p>
      <p>The mark vs the typography need work, too, mostly the scale, but I think I've said enough now. :)</p>
