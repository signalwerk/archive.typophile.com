      <p>Thanx Alaskan for your crits, there are very helpful!</p>
      <p>I double checked if he works with radiators and you right, he doesn't. To keep my concept with the monogram, I removed the bolt and added a drop – so the M stands as M or as waterpipe. It is important that the MR is readable. The reason why I slanted the M is to have the same angle as the Eras typeface. I redesigned the the R so it's equally the letter or a wrench. Do you think the mark is to big? </p>
      <p>Here is an update!</p>
      <p>Cheers<br>
      Chris</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile2_4684.jpg"></div><p></p>
