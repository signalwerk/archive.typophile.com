    votes: null
    html: |-
      <p>There are situations where research does go into the selection of typefaces for signage. Thus, we have the special typefaces used for highway signage in the United States - because legibility, even under the poorest conditions, will save lives.</p>
      <p>In other circumstances, though, the choice of typeface is left up to individuals who make their choices based on aesthetics and the image they wish to project.</p>
      <p>Thus, Helvetica Medium has been treated as the ideal typeface for certain kinds of signage - subway stations, airline terminals, and the like - modern, efficient, inoffensive.</p>
      <p>Unless there are critical legibility concerns, therefore, if you happen to like a particular rounded sans-serif typeface, go for it.</p>
