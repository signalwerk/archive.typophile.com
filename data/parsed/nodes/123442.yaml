      <p>Why not?</p>
      <p>FF Info is a rounded (or roundish) sans designed for wayfinding.</p>
      <p>According to Erik Spiekermann, the rounded corners can save a lot of time in plotting and weeding the vinyl when manufacturing a large number of signs.</p>
