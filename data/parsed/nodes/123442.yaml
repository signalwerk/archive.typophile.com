    html: |-
      <p>I guess I would say that there are other features of a sans serif other than whether or not it is rounded that make it better or worse for wayfinding. Rounding probably hurts a bit, but I expect that the difference between say Helvetica and Frutiger is still much greater than that between Helvetica and Helvetica Rounded.</p>
      <p>(Actually, in the case of Helvetica, the rounding might help, as it slightly opens the nearly-closed apertures that are the big problem of Helvetica.)</p>
