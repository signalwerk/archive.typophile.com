    html: |-
      <p><cite> I just imagined with all the testing and research that goes into way finding typefaces there surely would be some commentary on rounded typefaces in signage.</cite></p>
      <p>I don’t know studies which researched such a specific design feature. In my opinion: It simply isn’t a relevant factor. Letter skeleton, stroke width, letter-spacing and of course type size are so much more important. So I would say it’s more a matter of stylistic freedom to pick a rounded font or not. </p>
      <p>I am also not clear about how much roundness you are thinking about. Something like <a href="http://www.myfonts.com/fonts/linotype/din-next-rounded/refby=opentype" rel="nofollow">DIN Rounded</a>? Or just rounded corners as in FF Info or Wayfinding Sans?<br>
      If it’s extreme as in DIN Rounded, I would say it slightly decreases legibility, because you remove information from the stroke ends. They are more “fuzzy” and not as articulated as they could be. But like I said: that’s a minor effect and can easily be compensated.</p>
