  html: |-
    <p>Our company is being re-branded. We haven’t received a style guide yet but have been told in advance that all non-headline text - print as well as online - is to be in Verdana. The only example of long-form print copy being set in Verdana I can think of is from Ikea, where it looks brutal or anti-design - e.g. their Yearly Summary at <a href="http://www.ikea.com/ms/en_GB/about_ikea/facts_and_figures/yearly_summary.html" title="http://www.ikea.com/ms/en_GB/about_ikea/facts_and_figures/yearly_summary.html">http://www.ikea.com/ms/en_GB/about_ikea/facts_and_figures/yearly_summary...</a> . Anyway, that PDF may be read online; we have to produce some print-only documents. I’ve shown the Ikea example to the designers and they say they would be happy with that sort of look on our print work.</p>
    <p>Has anyone got any examples of Verdana working successfully as print body copy - or is it (as I suspect) a non-starter borne out of a ‘print is dead’ mindset?</p>
