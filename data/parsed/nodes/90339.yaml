    html: <p>In scalable font formats, what does "too large on the body to work well" mean? (I.e., what remains of the "too large" problem if you just lower the point size?)</p>
    html_clean: <p>In scalable font formats, what does "too large on the body to work well" mean? (I.e., what remains of the "too large" problem if you just lower the point size?)</p>
  - id: 496066
