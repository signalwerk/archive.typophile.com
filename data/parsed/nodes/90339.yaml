    html: |-
      <p>Verdana is too large on the body to work well<br>
      for extended reading in print. In print it can<br>
      only work well for small sizes (I mean below<br>
      the reading comfort zone).</p>
      <p>Good fonts are designed with a focus on a narrow<br>
      range of tasks. Verdana is a good font. But long<br>
      printed text is not at all its focus.</p>
      <p>Hopefully enough of us will chime in with similar<br>
      opinions and your superiors will read this thread<br>
      and decide to find a better typeface for the task.</p>
      <p>hhp</p>
