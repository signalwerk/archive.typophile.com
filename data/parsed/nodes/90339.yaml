    votes: null
    html: |-
      <p>&gt; what remains of the "too large" problem if you just lower the point size?</p>
      <p>Nice way to put the question. "Too large on the body"<br>
      effectively means the x-height and/or the width (usually<br>
      more the former) are too great. What "remains" when you<br>
      lower the point size is too great a reliance on letterform<br>
      bodies (x-height region) which are only good at making<br>
      individual letters easier to see, hence decipher; in contrast<br>
      the extenders (which lose out when the x-height is too great)<br>
      help extended reading. Here's a -simplified- explanation:<br>
      <a href="http://themicrofoundry.com/ss_read1.html" title="http://themicrofoundry.com/ss_read1.html">http://themicrofoundry.com/ss_read1.html</a><br>
      See the rightmost image if you'd like to cut to the chase.</p>
      <p>This is a classic issue, and the reason that newspaper<br>
      fonts are large on the body while book fonts are small.<br>
      Nevermind that no ideal text fonts are sans...</p>
      <p>BTW, Verdana is also too loose to promote comfortable<br>
      extended reading in print. Onscreen is a different story,<br>
      in fact there Verdana is basically a one-pixel-looser<br>
      version of Tahoma because the latter -which is nothing<br>
      more than a [good] UI font- is way too tight for extended<br>
      reading.</p>
      <p>hhp</p>
