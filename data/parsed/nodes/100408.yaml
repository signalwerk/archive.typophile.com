      <p>An update on this. I have found a good, working example of Akkurat with a serif face:</p>
      <p><a href="http://heydays.no/2009/premiss/" title="http://heydays.no/2009/premiss/">http://heydays.no/2009/premiss/</a></p>
      <p>I think that's exactly what I was looking for. I regard myself as very good at identifying sans serifs but not as good with serifs, so I can't figure out what has been used for this. It is quite similar to Tiempos (Village) but not quite - a thinner version for one.. I like the rounded off finishes at the end of some of the stems as opposed to a regular serif (in the italic). </p>
      <p>Well, any help in identifying would be much appreciated.</p>
