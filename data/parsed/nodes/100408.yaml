    <p>Hi folks,</p>
    <p>Appreciate anyone who chips in to this. Fleshing out a branding/identity project and looking for pairing a serif typeface with Akkurat:</p>
    <p><a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/">http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/</a></p>
    <p>Akkurat is already established, used in the logo and has been used for body text. It is for a design agency. The challenge I've had is choosing a serif face to partner it. Why? When creating documents with longer passages of text, I'd rather not use Akkurat for absolutely everything. A lot of the clients are Universities and in the Education sector, and I always feel they prefer serifs as well (albeit ungrounded research). </p>
    <p>I've been looking for character shapes that match Akkurat (and the usual elements like x-height, descender/ascender height). I feel the old classics just aren't doing it: Baskerville, garamond, bembo, sabon, century, even bodoni – they just seem too big a jump. I feel it will be something more 'modern'. Even slab serif.</p>
    <p>So far, I've liked FM by A2 type. I like how it shares the square dots i.e. full stop, 'i', 'j'. I am a fan of Publico and Mercury as well, but don't feel they are right for this.</p>
    <p>So that's the pairing challenge – appreciate any help.</p>
    <p>Thanks,</p>
    <p>Lewis</p>
