      <p>Sweet Irony. I actually did suspect that when I was looking at it, but it was hard to tell. Are you certain? It seems quite thin... maybe it is the 'G1' version of it?</p>
      <p>---</p>
      <p>Upon closer inspection I think it must be. That'll teach me to be so dismissive. It is always amazing how many different ways a typeface can "look" and "feel" even though we usually think of the character of a face has creating a particular, consistent "feel". Context is key. That's why I love type!</p>
      <p>So lesson learnt – Mercury goes well with Akkurat.</p>
