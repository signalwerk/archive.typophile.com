      <p>In December 2010, I purchased second-hand a highly interesting voluminous large-sized 530-page thread-sewn catalog of the former German photocomposition company "TypoBach" published more than 30 years ago.</p>
      <p>This huge font catalog also includes hundreds of "Serials" photocomposition fonts of many trademarked fonts, depicted as "backmatter" on pages 331 through 502 of this huge catalog, e.g.</p>
      <p>- "Helvetica Serial 1" through "Helvetica Serial 13",<br>
      - "Optima Serial 1" through "Optima Serial 9", etc.</p>
      <p>On page 329 of this catalog, Typobach claims that these "Serials" are the "Exclusiv-Schriften" of the TypoBach company.</p>
      <p>From the technical point of view, these "exclusive fonts" are photographically modified versions of original fonts produced by other font companies.</p>
      <p>It seems that the ripoff companies Brendel &amp; Pabst, Elsner &amp; Flake, etc. grapped these Serials fonts, renamed them and sold them as their own "original" fonts to which they claimed authorship.</p>
