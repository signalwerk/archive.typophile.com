      <p>Walter Brendel (1933-1992) was the founder of Brendel Informatik, Brendel &amp; Pabst and the Typeshop group of phototypesetting houses. He also co-founded the European Typeface Corporation (ETC) which was connected with Typo Bach, another group of phototypesetting houses. Together with Peter Karow, Brendel worked on the initial version of Ikarus and developed the phototypesetting machine Unitype for which he created a large range of typeface families. Most of these were based on existing typeface designs, which had typically been made fit for creating a range of 7 weights from extra light to extra bold by interpolation and have been marketed as ‘Serials’ for some years. Currently, the Type Shop / Serials typeface library is maintained by Elsner+Flake.</p>
      <p>More information on the history of these companies and typefaces:<br>
      <a href="http://www.fonts4ever.com/portrait_library.php?language=en&amp;id=3" title="http://www.fonts4ever.com/portrait_library.php?language=en&amp;id=3">http://www.fonts4ever.com/portrait_library.php?language=en&amp;id=3</a></p>
      <p>Type Shop typeface library at Elsner+Flake<br>
      <a href="http://www.fonts4ever.com/foundry_detail.php?f_shops_id=3&amp;f_fonts_belegung_id=0&amp;view=1" title="http://www.fonts4ever.com/foundry_detail.php?f_shops_id=3&amp;f_fonts_belegung_id=0&amp;view=1">http://www.fonts4ever.com/foundry_detail.php?f_shops_id=3&amp;f_fonts_belegu...</a></p>
      <p>and at MyFonts<br>
      <a href="http://www.myfonts.com/search/typeshop/" title="http://www.myfonts.com/search/typeshop/">http://www.myfonts.com/search/typeshop/</a></p>
      <p>Serial Type Collection ‘compatibility’ list / typeface analogue / ‘similar to’ document by Elsner+Flake<br>
      <a href="http://www.fonts4ever.com/download/entdecken/Serial_Compatibility_List.pdf" title="http://www.fonts4ever.com/download/entdecken/Serial_Compatibility_List.pdf">http://www.fonts4ever.com/download/entdecken/Serial_Compatibility_List.pdf</a></p>
      <p>also have a look into this thread for a similar case<br>
      <a href="http://typophile.com/node/76344" title="http://typophile.com/node/76344">http://typophile.com/node/76344</a></p>
