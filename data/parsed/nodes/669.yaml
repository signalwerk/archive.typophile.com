  - id: 4684
    user: 1491
    date: 2003-07-21T04:39:00
    date_raw: 21 Jul 2003 — 4:39am
    votes: null
    html: '<p>Peter -- whose presentation was outstanding -- showed uses of both Eureka and Fedra. The Eureka animations were simply beautiful! <br> <br>William Drenttel at Winterhouse Editions has recently employed Fedra Sans (okay, not the serif, Ralf), and as you may know, the New England Journal of Medicine has -- as of the beginning of this year -- used FF Quadraat as its text face (together with FF Scala Sans). See: <br> <br><a href="http://www.wdny.com/" target="_blank">http://www.wdny.com/</a> <br><a href="http://content.nejm.org/" target="_blank">http://content.nejm.org/</a> <br> <br>Jon</p>'
