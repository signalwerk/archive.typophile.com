    html: <p>Roberto de Vicq de Cumptich worked with <a href="http://www.muccadesign.com/">Mucca Design</a> to produce a poster using Mrs. Eaves that was distributed during the last HOW Design conference. I am trying to locate a version of this poster online, but have not had any luck so far. The strangest thing about this poster was that it was designed for Adobe to promote OpenType, yet doesn't use any of Adobe's own OpenType fonts.</p>
