    date: 2003-07-22T07:29:00
    date_raw: 22 Jul 2003 — 7:29am
    votes: null
    html: "<p>With regard to Mrs Eaves, I have a pet theory that one can position oneself anywhere in a Barnes and Noble and spot the use of it on a book or magazine cover, not to mention on B &amp; N's own signage. For better or worse, it is ubiquitous... <br> <br>Two notable uses are (1) on Poets &amp; Writers: <br><a href=\"http://www.pw.org/\" target=\"_blank\">http://www.pw.org/</a> <br> <br>...and (2) on the cover of Louise Erdrich's recent (2001) book, <i>The Last Report on the Miracles at Little No Horse</i>: <br> <br><a href=\"http://www.harpercollins.com/coverimages/large/0060005629.jpg\" target=\"_blank\">http://www.harpercollins.com/coverimages/large/0060005629.jpg</a> <br> <br>Jon</p>"
