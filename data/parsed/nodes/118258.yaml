    html: <p>One of the name I've found is TRM フォント JB (sample <a href="http://dc-crafts.main.jp/trm/f/zxx_jb1b-sample03.gif" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> identical to above digits), TQ (sample <a href="http://dc-crafts.main.jp/trm/f/zxx_tq11-sample02.gif" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>) and MT (sample <a href="http://dc-crafts.main.jp/trm/f/zxx_mt10-sample01.gif" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>). Can't say for the moment if it's the original name and if it covers all glyphs present on this plate.</p>
