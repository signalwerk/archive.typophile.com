    html: <p>One of the name I've found is TRM フォント JB (sample <a class="freelinking external" href="http://dc-crafts.main.jp/trm/f/zxx_jb1b-sample03.gif" rel="nofollow">here</a> identical to above digits), TQ (sample <a class="freelinking external" href="http://dc-crafts.main.jp/trm/f/zxx_tq11-sample02.gif" rel="nofollow">here</a>) and MT (sample <a class="freelinking external" href="http://dc-crafts.main.jp/trm/f/zxx_mt10-sample01.gif" rel="nofollow">here</a>). Can't say for the moment if it's the original name and if it covers all glyphs present on this plate.</p>
