      <p>No, not business cards. It's all part of my fact sheet hoopla. Most of the contact information is related to military installations, which could have 4-5 lines just for the address. I'd like to be able to par it down, but since I'm not providing the content, I have to work with what is provided.</p>
      <p>I just wanted an idea of an ideal layout. I'm currently fitting everything into a small box in the bottom corner of the fact sheet.</p>
      <p>My inexperience is showing quite a bit with this project. Plus, since these are for the military, being creative isn't a positive. This would be easier if I had a style guide to follow with rigid parameters.</p>
