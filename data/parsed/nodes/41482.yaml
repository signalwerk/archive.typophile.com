      <p>Are we talking business cards here? That is a lot of lines, and I would work out some way to minimize them. Can you get the address down to two lines ... one for the street related bits, and the other for city, state, code, country, etc. Phone numbers can also be placed two or more per line. As for whether to align or otherwise, that is a design decision, not something you want to standardize. Sometimes it will work best aligning the second phone number on a line to something, other times, not so much.</p>
      <p>As for phone numbers, I tend to use your example, but many designers are now omitting the brackets and/or hyphens. I have seen center dots replacing the hyphens as well.</p>
