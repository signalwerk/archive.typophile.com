    <p>I'm working on a piece that has multiple levels of contact information.</p>
    <p>The largest that I've come across is set up this way:</p>
    <p>Name* - Bold<br>
    Title* - Small Caps Bold<br>
    Program Title - Medium<br>
    Building/Department<br>
    Address<br>
    Address<br>
    Address<br>
    Phone Number*<br>
    Internal Phone Number*<br>
    Fax Number*<br>
    Internal Fax Number*<br>
    Email*<br>
    Web Address</p>
    <p>*Most common contact information.</p>
    <p>Structurally, what would be a good way to layout this out. I've used tables in the past to align all the phone numbers and email address, where I'd use the titles "phone", "dsn" (internal phone), "fax" , "email" would be in the right column and the numbers and address in the left column. </p>
    <p>I tend to Bold the Name and Small Caps Bold the Title everything else is Medium or Normal weights.</p>
    <p>Also, what's the norm for laying out phone numbers and emails. I tend to used the (000) 000-0000 and emails are always lowercase <a href="mailto:user@site.com">user@site.com</a>. Is there any tracking standards?</p>
    <p>I hope that isn't too confusing. Thanks.</p>
