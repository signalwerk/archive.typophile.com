    html: <p>Although there are always exceptions to any rule, generally speaking, cheap fonts are cheap for a reason.  <br> <br>$50 for 10,000 typefaces almost certainly translates to poor quality outlines, badly-executed or non-existent metrics, limited character sets and legally- and morally- dubious copies of original works. Remember also that a poor quality copy of a typeface design is an insult to the original designer. <br> <br>The difference is quality. You get what you pay for. Well, as a general rule anyhow... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
