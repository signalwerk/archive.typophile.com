  html: "<p>I'm new to the site. I've always indulged in my typophilia alone, as a self-taught amateur. I aspire to expert competence, but I have some very basic, beginner questions---as Tallulah Bankhead said, please be kind! <br> <br>I've noticed that many font collections available for sale appear to use \"generic\" names. For example, the Murray Hill from 1956 often appears as \"Muriel.\" <br> <br>How do these clones come to be, and is there any danger to using them instead of the originals? Is there any real difference between the original and the generic font? I checked the comp.fonts FAQ and didn't see this question addressed, and I made some Google searches but did not find it answered anywhere. <br> <br>I seem to recall reading about this years ago. My understanding is that while a font itself may not be copyrightable, the name can be trademarked---so these cloned fonts with generic or non-standard names are generally scans or otherwise inferior reproductions of an original, whose name is trademarked, and they are best avoided. Is that correct? <br> <br>Case in point: I saw an advertisement for a <a href=\"http://www.softmaker.de/megafont_en.htm\">\"Megafont\" CD</a>, containing 10,000 typefaces for US$50. They're TrueType and they appear to be of this \"generic\" variety---Murray Hill was \"Muriel,\" etc. How does such a collection compare to the original typefaces?</p>"
  html_clean: "<p>I'm new to the site. I've always indulged in my typophilia alone, as a self-taught amateur. I aspire to expert competence, but I have some very basic, beginner questions---as Tallulah Bankhead said, please be kind! <br> <br>I've noticed that many font collections available for sale appear to use \"generic\" names. For example, the Murray Hill from 1956 often appears as \"Muriel.\" <br> <br>How do these clones come to be, and is there any danger to using them instead of the originals? Is there any real difference between the original and the generic font? I checked the comp.fonts FAQ and didn't see this question addressed, and I made some Google searches but did not find it answered anywhere. <br> <br>I seem to recall reading about this years ago. My understanding is that while a font itself may not be copyrightable, the name can be trademarked---so these cloned fonts with generic or non-standard names are generally scans or otherwise inferior reproductions of an original, whose name is trademarked, and they are best avoided. Is that correct? <br> <br>Case in point: I saw an advertisement for a <a href=\"http://www.softmaker.de/megafont_en.htm\" class=\"link-external\">\"Megafont\" CD</a>, containing 10,000 typefaces for US$50. They're TrueType and they appear to be of this \"generic\" variety---Murray Hill was \"Muriel,\" etc. How does such a collection compare to the original typefaces?</p>"
