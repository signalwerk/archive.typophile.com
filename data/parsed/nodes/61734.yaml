    html: <p>When I worked in business, I never wanted our corporate logo as a font because too many times I’ve seen a strange letter(s) in an arbitrary font appearing on e.g. a presentation that got sent out us working on a pc without the font in question. That result is more unprofessional than not giving the client the option to make that mistake! Not sure you can trust the average client not to do the same. Ban logo fonts, I say (you won’t have to worry about the legalities either)!</p>
