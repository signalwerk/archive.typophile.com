    <p>Here’s a confused question.</p>
    <p>I’m finalizing a logo for a client, and suddenly started wondering if it wouldn’t be a nice extra service to give the client not just individual files, but maybe a “logo font” just with the different versions of the logo in it (so only maybe 5 glyphs). That way it might be easier for the client to use the logo (fewer different files/formats), and I wouldn’t have to worry a lot about the thing being scaled wrong or whathaveyou.</p>
    <p>So if I have a logo that’s based on a (commercial) font which I’ve customized in Illustrator, and I make this into a font again, is this technically a legal problem?</p>
    <p>Also, is there anything else I’m forgetting that might make this a bad idea to offer to the client?</p>
  html_clean: |-
