      <p><cite>[I]f I have a logo that’s based on a (commercial) font which I’ve customized in Illustrator, and I make this into a font again, is this technically a legal problem?</cite></p>
      <p>I assume you’d put every logo variation into a single glyph? It doesn’t sound anything like you distributing a custom version of that font — rather, you supply the <em>image</em> in the form of a font. I don’t see how that would differ from giving them an EPS or PDF version.</p>
      <p>It would get slightly complicated if they asked for the customized font, to use for advertising or other graphic work.</p>
      <p>The few fonts I made (for internal use only!!) use an OpenType feature to change “JW” into my own logo :-) as a sort of easter egg.</p>
    html_clean: |-
