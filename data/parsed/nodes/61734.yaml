    html: <p>The only big technical downside is that some programs, including MS Word, will not display glyphs that are more than too wide (I can’t find documentation of the actual numbers). For some logos this will mean either shrinking it down so small that fidelity is lost or chopping it up across glyphs. So be careful before you make promises about what you can stuff into a font!</p>
