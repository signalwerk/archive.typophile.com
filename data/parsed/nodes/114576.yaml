    html: |-
      <p>Frank</p>
      <p>I agree with what you say. However, even with your light version of DTL, the user needs to know what to look for, and where, and for fsSelection the display is hardly better than with TTX. </p>
      <p><img src="/files/fssel_6146.png"></p>
      <p>In my opinion, to properly display the relevant information, some very basic python code using the fonttools would be preferable. Just to read the fsSelection bits, here is some code that assumes that AFDKO is installed; just copy the lines between the cut lines and paste them in a terminal window (on the macintosh).</p>
      <pre>---- cut line
      TTX=`which AFDKOPython`
      TTXF=`dirname $TTX`
      cat &gt; ${TTXF}/fssel &lt;&lt;'EOF'
      #!/usr/bin/env AFDKOPython

      from fontTools.ttLib import TTFont
      import sys
      fsbits = {0x001:'Italic',
                0x002:'Underscore',
                0x004:'Reverse video',
                0x008:'Outlined',
                0x010:'Striked out',
                0x020:'Bold',
                0x040:'Regular',
                0x080:'Use Windows spacing metrics',
                0x100:'WWW',
                0x200:'Oblique'}

      f=TTFont(sys.argv[1])
      fs = f["OS/2"].fsSelection
      print "The fsSelection bits say:"
      for bit in fsbits:
        if fs &amp; bit:
          print "     ", fsbits[bit]
      EOF
      chmod 755 ${TTXF}/fssel
      ---- cut line
      </pre>
      That saves an executable called <code>fssel</code> in your path. Now, here is a trace of execution on the same file as the grab above:
      <pre>----
      605 % fssel /Library/Fonts/ArnoPro-BoldItalic.otf
      The fsSelection bits say:
            Italic
            Bold
            Use Windows spacing metrics
      ----
      </pre>
      Slightly more readable, no?
