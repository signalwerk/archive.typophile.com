    html: |-
      <p>Michel: <em>‘I see that FontForge adjusts those bits automatically.’</em></p>
      <p>Remains the question whether what FF automatically does with this bits is what you want it to do. In case of the four styles/weights in question this will be no problem, I reckon. But working with FF requires decompilation of the fonts to FF’s internal format, which is not the case with TTX or DTL OTMaster (OTM). Depending on the (quality of the) program used for the conversion of .ttf to .otf (is that allowed anyway?) that could be considered a disadvantage or an advantage though.</p>
      <p>My advise is to ﬁrst check the consistency of the font naming and style bits with the free <em>Light</em> version of OTM, which can be downloaded from the <a href="http://www.fontmaster.nl/" rel="nofollow">FM website</a>.</p>
      <p>FEB</p>
