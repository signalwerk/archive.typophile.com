    <p>Hi,<br>
    I have got a set of four .OTF fonts that in the font menu of MS Office 2003 are displayed as follow:</p>
    <p>Times Regular<br>
    Times Italic<br>
    Times Bold<br>
    Times Bold Italic</p>
    <p>I would like to edit the font files so that in the font menu they are displayed as a single line "Times".<br>
    Picking "Times" from the menu I should get Regular.<br>
    Italic, Bold and Bold Italic should be activated via the correspondent button in the toolbar.</p>
    <p>I've already installed TTX and I have concerted the OTF files to XML. What lines should I edit to get what I want?</p>
    <p>Thank you</p>
