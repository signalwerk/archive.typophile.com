    html: |-
      <p>How to do it with FontLab will not help. The relevant Microsoft information for the Naming table is</p>
      <p><a href="https://www.microsoft.com/typography/otspec/name.htm" title="https://www.microsoft.com/typography/otspec/name.htm">https://www.microsoft.com/typography/otspec/name.htm</a></p>
      <p>The Name IDs need to be fixed. </p>
      <p>In the xml file produced by ttx, the line after <code>namerecord nameID="1"</code> should be the family name, here <code>Times</code>; the line after <code>namerecord nameID="2"</code> should be the subfamily, here either <code>Regular</code> or <code>Italic</code> or <code>Bold</code> or <code>Bold Italic</code>; the line after <code>namerecord nameID="4"</code> should be the full name, i.e. either <code>Times Regular</code> or <code>Times Italic</code> or <code>Times Bold</code> or <code>Times Bold Italic</code>.</p>
      <p>Notice that <code>nameID="1"</code>, <code>nameID="2"</code> and <code>nameID="4"</code> normally appear at least twice, once for the Macintosh, once for Windows.</p>
    html_clean: |-
