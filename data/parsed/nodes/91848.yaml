    <p>Hello, this is my first post, so hi to all.</p>
    <p>I study graphic design in a school in italy, and im at the first year.</p>
    <p>My class was given the assignment to design the corporate identity for a factitius contemporary art gallery. The gallery will be located in a monastery originally builded in 1582, wich became a law court in 1974, and has been recently restructured, in particular with a modern a geometrical inside, to became a cultural and art gallery. </p>
    <p>Here are some photos of the inside and outside of the building: <a href="http://www.padovanet.it/dettaglio.jsp?id=12026#par_0" title="http://www.padovanet.it/dettaglio.jsp?id=12026#par_0">http://www.padovanet.it/dettaglio.jsp?id=12026#par_0</a></p>
    <p>Aniway this is the logo i made: </p><div class="imageWrap"><img src="http://typophile.com/files/newseum_4281.jpg"></div><p></p>
    <p>It's a custom lettering based on Itc Avant Garde Gothic.</p>
    <p>I have to realize a brochure and a depliant for the opening, i wich the main event will be a showcase of the art of some local young illustrators.</p>
    <p>Until now i used Gill Sans for all my preliminary concepts,  even for the "galleria d'arte contemporanea" part of the logo,  but im not happy with it, and plus, the logo isn't even avant garde but a personal re design. So im searching some typefaces that could suit the job, but i dont know much about fonts because like i said i study design only since a few months.</p>
    <p>Im searching two typefaces, a display  one and one for the body of text, that goes well with the geometry of my logo. They have to be modern faces, but maybe with a touch of classicity that goes well with the contradiction of the location, with it's classic outside and modern inside.</p>
    <p>The teachers said we could use different typefaces from the corporate ones for the brochure because the main theme is the showcase of young illustrators, but im not to keen on this, i think it's best to find strong corporate ones and stick with them to reinforce the identity.</p>
    <p>Untill now, i was thinking to switch to gotham display + whitney text.</p>
    <p>What do you guys think? Suggestions?</p>
