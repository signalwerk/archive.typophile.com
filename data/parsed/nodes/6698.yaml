    html: <p>I found it. Nick Curtis's free 'Hobbyhorse'. (See sample below). Nick usually bases his on revivals or old typefaces, sometimes mixing styles. The numerals look like Poor Richard, but some other letters look like they have other sources. You can find this font using <a href="http://www.fontseek.com" target="_blank">Fontseek</a>, or contact me by e-mail for the site where I found it.  <br> <br><img src="http://www.typophile.com/forums/messages/83/49079.gif" alt="Hobbyhorse sample"></p>
    html_clean: <p>I found it. Nick Curtis's free 'Hobbyhorse'. (See sample below). Nick usually bases his on revivals or old typefaces, sometimes mixing styles. The numerals look like Poor Richard, but some other letters look like they have other sources. You can find this font using <a href="http://www.fontseek.com" target="_blank" class="link-external">Fontseek</a>, or contact me by e-mail for the site where I found it.  <br> <br><img src="http://www.typophile.com/forums/messages/83/49079.gif" alt="Hobbyhorse sample"></p>
