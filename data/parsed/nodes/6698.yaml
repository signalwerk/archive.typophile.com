    html: "<p>Nicely identified Mike. <br> <br>Nick's freeware fonts are collected <a href=\"http://www.moorstation.org/typoasis/designers/curtis/index.htm\" target=\"_blank\"> here</a> � with his blessing, but without most of the original ReadMe files. Those, along with other notes on the fonts' sources, may be found <a href=\"http://home.planet.nl/~voogt053/\" target=\"_blank\"> here</a>, compiled by Sander de Voogt � again with Mr. Curtis' blessing. <br> <br>The ReadMe for Hobbyhorse gives an interesting parentage: <i>\"The second in a series of �Storybook Fonts,� reminescent of the typefaces found in children�s books around the turn of the twentieth century. This quirky face combines an adaptation of the uppercase letterforms of Poor Richard with an adaptation of the lowercase letterforms of Nuptial Script, backslanted 22�. A spritely, rounded serif has been added to the letterforms, so they rock.\"</i> <br><br></p>"
    html_clean: "<p>Nicely identified Mike. <br> <br>Nick's freeware fonts are collected <a href=\"http://www.moorstation.org/typoasis/designers/curtis/index.htm\" target=\"_blank\" class=\"link-external\"> here</a> � with his blessing, but without most of the original ReadMe files. Those, along with other notes on the fonts' sources, may be found <a href=\"http://home.planet.nl/~voogt053/\" target=\"_blank\" class=\"link-external\"> here</a>, compiled by Sander de Voogt � again with Mr. Curtis' blessing. <br> <br>The ReadMe for Hobbyhorse gives an interesting parentage: <i>\"The second in a series of �Storybook Fonts,� reminescent of the typefaces found in children�s books around the turn of the twentieth century. This quirky face combines an adaptation of the uppercase letterforms of Poor Richard with an adaptation of the lowercase letterforms of Nuptial Script, backslanted 22�. A spritely, rounded serif has been added to the letterforms, so they rock.\"</i> <br><br></p>"
