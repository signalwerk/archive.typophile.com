    votes: null
    html: <p>Thanks Mike for the link with the notes and other background info. That is the sort of stuff I like learning about fonts that are not fully original works. I know Nick gives such notes on his commercial fonts, but hadn't found it before on his freeware fonts. I knew that typOasis had Nick's permission (that's where I got my font), and so does <a href="http://www.fontfreak.com/authors/nick_curtis.htm" target="_blank">Font Freak</a>, and maybe at leastone other site, but because of the issue about other fonts that might, or might not, be at such sites, I decided I would give a more indirect route to the locations. On reconsidering I think these sites are worth knowing about, so I added the other link I knew about. The site owners have been helpful to me and my Guides, and I think they are responsible in the way they present their collections.</p>
