  - id: 559065
    user: 2969
    date: 2013-07-02T11:11:00
    date_raw: 2 Jul 2013 — 11:11am
    votes: null
    html: <p>I think the general qualities of this work are great. What's been compared here, though, is rather subtle. If the publishers at some point decide to pump a PX into the cap ht., and the browser decides to kern, the differences between these two samples are so small, few would stretch to describe the difference as significant, (much less, any more than that).  There was most likely a difference in devilopment paths with the one on the left being a pain in the ass long after the one on the right is complete. And... at 9 PX, i think there are very few users on the right side to begin with.</p>
