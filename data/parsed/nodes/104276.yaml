    html: <p>Windows is doing some horrible things to those caps. Look at the bar on the 'H'. You could drive a bus between the 'F' and 'J'. If we're equating rendering superiority with sharpness alone then Windows is winning here, but it's lost most of the character of the typeface and is showing a fair bit of dazzle. If I was going to be reading anything more than a paragraph I'd plump for the OSX rendering.</p>
