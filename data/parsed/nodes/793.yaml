    html: <p>Thanks for the thumbs up. Actually the 'R' is one of the letters that I had a reference for! but i see what you mean - i'll give it a tweak.  <br>The one that was really giving me problems was the 'M' - I had 'Barnum' (<a href="http://www.identifont.com/show?4AX" target="_blank">http://www.identifont.com/show?4AX</a>) by my desk to give me a hand but it didn't help much, I hope my solution fits in ok. <br>The numerals should be cool - could have some fun with those. There won't be an uppercase but I may use the slots for alternate versions, I was thinking maybe broken or worn-out characters or improvised characters. Any other ideas? Does anyone know if/how wooden type typicaly gets broken or worn-out? any examples? <br>BTW I hadn't done a seting in it yet thanks! Looks cool.</p>
    html_clean: <p>Thanks for the thumbs up. Actually the 'R' is one of the letters that I had a reference for! but i see what you mean - i'll give it a tweak.  <br>The one that was really giving me problems was the 'M' - I had 'Barnum' (<a href="http://www.identifont.com/show?4AX" target="_blank" class="link-external">http://www.identifont.com/show?4AX</a>) by my desk to give me a hand but it didn't help much, I hope my solution fits in ok. <br>The numerals should be cool - could have some fun with those. There won't be an uppercase but I may use the slots for alternate versions, I was thinking maybe broken or worn-out characters or improvised characters. Any other ideas? Does anyone know if/how wooden type typicaly gets broken or worn-out? any examples? <br>BTW I hadn't done a seting in it yet thanks! Looks cool.</p>
