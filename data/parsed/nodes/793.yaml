  html: <p>Hey guys, not been around here for quite a while, but things have been slow at work so I've had some time to work on another font. This one has been kicking around for a while - I got the inspiration from a 60's jazz album cover. I wanted to do a worn out wood-type font - this one looks hand lettered on the reference I have and I liked the effect. Anyway it's in an early stage right now - just working out the character shapes in freehand, so just general comments wanted really on the work so far.</p>
  html_clean: <p>Hey guys, not been around here for quite a while, but things have been slow at work so I've had some time to work on another font. This one has been kicking around for a while - I got the inspiration from a 60's jazz album cover. I wanted to do a worn out wood-type font - this one looks hand lettered on the reference I have and I liked the effect. Anyway it's in an early stage right now - just working out the character shapes in freehand, so just general comments wanted really on the work so far.</p>
