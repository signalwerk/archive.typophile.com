    <p>Hi there, </p>
    <p>I'm looking for a rather simple font, or something similar. </p><div class="imageWrap"><img src="http://typophile.com/files/samograffiti_3498.jpg"></div><br>
    It's the all caps font used by Jean-Michel Basquiat for his graffiti art, and in some of his paintings. I'm guessing an exact replica doesn't exist so I'll settle for one similar, that hasn't the distinctive E for example. Hoping that some of you can help me out here. <p></p>
    <p>thanks in advance</p>
    <p>Geert</p>
