      <p>I think that companies that can get away with a simple logotype are those with already extraordinary names. Abercrombie &amp; Fitch doesn't need a mark to identify itself because it is identified by its name.</p>
      <p>Conversely, companies like AT&amp;T or Apple don't have names that can really stand alone without an icon. Hence Apple's almost exclusive use of their apple to brand their company or AT&amp;T's use of their striped sphere.</p>
      <p>The bottom line is that companies with memorable names don't need to try hard to create associations with other icons to strengthen consumer recognition. An understated yet elegant application of a type treatment is often the best way to let the name speak for itself. </p>
      <p>penn</p>
