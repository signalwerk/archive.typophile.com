    <p>One of the most beautiful logos out there, I think, is Abercrombie &amp; Fitch's. Set in a modified Garamond Bold (I THINK), it just has a very calming, yet powerful effect to it. And I'd always wonder:</p>
    <p>How would I, as the Designer for that logo, and any like it, know enough that a simple WORD/PHRASE is enough to be my client's logo? Does it suddenly strike you? Do you say to yourself that no symbol or additional accents are good enough to accompany this word?</p>
    <p>More importantly: How do you approach a client? How do you say, "Well I know you're paying me a lot of money, but I really think the best I can give you is our name in this font..."</p>
    <p>Etc. Etc.</p>
    <p>Thoughts?</p>
