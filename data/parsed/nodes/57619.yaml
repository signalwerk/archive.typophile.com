    <p>Born in London in 1929, Mike has degrees in architecture and graphic design from Yale. In 1958-59 he was lucky enough to be the person who put in order the punches, matrices and molds at the <a href="/wiki/Plantin%20Moretus%20Museum" class="freelinking link-lost" rel="nofollow">Plantin Museum</a>. Jackson Burke at <a href="/wiki/Mergenthaler%20Linotype" class="freelinking link-lost" rel="nofollow">Mergenthaler Linotype</a> believed that this experience might be turned to account preparing type libraries for photocomposition machines. Inheriting the design staff originally trained by <a href="/wiki/Chauncey%20H.%20Griffith" class="freelinking link-lost" rel="nofollow">Chauncey Griffith</a>, Mike managed the expansion of the Linotype library from a collection of 150 American hot metal designs for text-setting to an inclusive library of nearly 1,500 international digital designs for full page setting. In 1981 he left Linotype with <a href="/wiki/Matthew%20Carter" class="freelinking link-lost" rel="nofollow">Matthew Carter</a> to found <a href="/wiki/Bitstream" class="freelinking link-lost" rel="nofollow">Bitstream</a>, went on to found The Company in 1987, and Pages Software in 1990. Pages developed a word processor on the NeXT platform which provided the writer with powerful graphic support.</p>
    <p>Courtesy of The Font Bureau, Inc.</p>
