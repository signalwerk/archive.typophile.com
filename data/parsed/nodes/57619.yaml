    <p>Born in London in 1929, Mike has degrees in architecture and graphic design from Yale. In 1958-59 he was lucky enough to be the person who put in order the punches, matrices and molds at the <a href="/node/31233/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Plantin Museum</a>. Jackson Burke at <a href="/node/13676/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Mergenthaler Linotype</a> believed that this experience might be turned to account preparing type libraries for photocomposition machines. Inheriting the design staff originally trained by <a href="/node/13377/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Chauncey Griffith</a>, Mike managed the expansion of the Linotype library from a collection of 150 American hot metal designs for text-setting to an inclusive library of nearly 1,500 international digital designs for full page setting. In 1981 he left Linotype with <a href="/node/13520/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Matthew Carter</a> to found <a href="/node/13429/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Bitstream</a>, went on to found The Company in 1987, and Pages Software in 1990. Pages developed a word processor on the NeXT platform which provided the writer with powerful graphic&nbsp;support.</p>
