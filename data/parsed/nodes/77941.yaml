    html: |-
      <p>In his 2013 book <cite>Teaching Type to Talk</cite>, Alan Peckolick says:</p>
      <blockquote><p>I designed the logo, record jacket, and posters for musician Paul Simon’s album and movie, <cite>One Trick Pony</cite>, which came out in 1980. I used the typeface Avant Garde Latin with pointy serifs, which had never been released to the public, and broke up the word “One-Trick” with a hyphen. It’s strong, in your face, and the right look.</p></blockquote>
