      <p>100% match with "Ravi Script," a font for an embroidery machine -- definitely not "photographs of pipe cleaners."  </p><div class="imageWrap"><img src="http://typophile.com/files/Ravi_Script_4371.jpg"></div> For details see <a href="http://www.milligift.com/products/fonts.html" title="http://www.milligift.com/products/fonts.html">http://www.milligift.com/products/fonts.html</a><br>
      Still searching for a digital version that you can use as a regular desktop or web font.<br>
      Don<p></p>
