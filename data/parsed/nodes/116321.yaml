    votes: null
    html: |-
      <div class="comment-spam-body"><p>I believe that Monoline Script -- already mentioned by Mike Yanega -- has the letter forms used as the basis for much of this script. Some letters such as _f_ look almost identical, others such as _A_ or _k_ have the same basic form but have been modified to make some of the strokes more flourished. The result seems less mechanical than Monoline Script, and perhaps has improved legibility when embroidered.<br>
      Don</p>
      </div>
