  - id: 577741
    user: 2088
    date: 2014-05-06T16:16:00
    date_raw: 6 May 2014 — 4:16pm
    votes: null
    html: |-
      <p>I think it resembles a blend of two scripts: Monotype <a class="freelinking external" href="http://www.myfonts.com/search/monoline+script+mt/fonts/?refby=bowfin" rel="nofollow">Monoline Script</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/brassfonts/fiona-script/?refby=bowfin" rel="nofollow">Fiona Script</a> from Brassfonts. Notice the o and w loops and the r shape of the latter font. However the I is all wrong, as are the k and s shapes, but that's where Monoline Script comes in.</p>
      <p>The shapes are not exact, but I could imagine this being a design compromise to make the embroidery lettering easier to read.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
      <p>I think it resembles a blend of two scripts: Monotype <a class="freelinking external link-external" href="http://www.myfonts.com/search/monoline+script+mt/fonts/?refby=bowfin" rel="nofollow">Monoline Script</a> and <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/brassfonts/fiona-script/?refby=bowfin" rel="nofollow">Fiona Script</a> from Brassfonts. Notice the o and w loops and the r shape of the latter font. However the I is all wrong, as are the k and s shapes, but that's where Monoline Script comes in.</p>
      <p>The shapes are not exact, but I could imagine this being a design compromise to make the embroidery lettering easier to read.</p>
      <p>- Mike Yanega</p>
