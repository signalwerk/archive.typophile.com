    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Geography" class="freelinking" rel="nofollow">Geography</a> : Switzerland</strong></p>
    <p>Small European country located in the Alps, in the heart of Europe. Surrounded by the European Union, although not a part of it. </p>
    <p>Switzerland has around seven million inhabitants, and four official languages.<br>
    The capital is Bern, but Zürich is the biggest city. Other large cities include Lucerne, Basel, Geneva, Lausanne, etc.</p>
