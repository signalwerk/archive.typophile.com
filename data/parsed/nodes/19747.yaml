    <p>Small European country located in the Alps, in the heart of Europe. Surrounded by the European Union, although not a part of&nbsp;it. </p>
    <p>Switzerland has around seven million inhabitants, and four official languages.<br>
    The capital is Bern, but Zürich is the biggest city. Other large cities include Lucerne, Basel, Geneva, Lausanne,&nbsp;etc.</p>
