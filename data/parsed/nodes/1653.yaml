    html: <p>Did you ever try Linotype Gianotten? It's designed for text in smaller sizes and has a far lower contrast. The light version even has Small Caps! Antonio Pace created Gianotten in 1999. The Milana Citta is a modified version for the house style of the city of Milan. <br>see <a href="http://www.linotype.com" target="_blank">www.linotype.com</a> or <a href="http://www.myfonts.com" target="_blank">www.myfonts.com</a></p>
