  html: <p>Hello Gang, <br> <br>I'm going to be writing a 1,500 word term paper on Biambattista Bodoni. I've thought about setting the type in Bodoni but the contrast of the typeface dazzles the eyes. What would be an appropriate typeface for a text about Bodoni? What would be an appropriate style for designing the page? thanks.</p>
