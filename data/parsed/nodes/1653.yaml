    html: "<p>What about a Didot?  ;-&gt; <br> <br>Actually, some Bodonis (like the ITC - but make sure you use the \"12\" version, or maybe even the \"6\" at like 10 point) work OK for short text. But if you wanted a highly readable font that's related, try a Baskerville: that was Giambatista's original inspiration. <br> <br>hhp <br></p>"
