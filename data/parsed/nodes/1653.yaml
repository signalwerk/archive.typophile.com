    html: <p>While I was researching those funky Deberny fonts (see the Javal thread), I read up on all the "transitional" material I have handy, and I think all of them (or at least those that go into any depth about Bodoni) mention that he was basically enamored with Baskerville's work. He even tried to make a trip to Britain to meet him in person, but fell ill along the way. My references would include Lawson's "Anatomy" for example. <br> <br>hhp <br></p>
