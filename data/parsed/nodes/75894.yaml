    html: |-
      <p>Just a quick update to let you know that more weights have been added.<br>
      Terminal Dosis is now a 7 weights Family (Extralight, Light, Book, Medium, SemiBold, Bold y ExtraBold)</p>
      <p>The lighter weights are minimalist. The bolder weights have more personality.<br>
      Also featuring lots of alternates. The overall result is a family that's clean and modern, and can express a wide range of voices &amp; feelings.</p>
      <p>Download the new version at <a href="http://www.impallari.com/terminaldosis/" title="http://www.impallari.com/terminaldosis/">http://www.impallari.com/terminaldosis/</a></p>
