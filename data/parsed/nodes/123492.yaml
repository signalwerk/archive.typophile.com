      <p>Thank you for the alternatives. I've found this in Nvidia's website (<a href="http://www.geforce.com/" title="http://www.geforce.com/">http://www.geforce.com/</a>) you will be able to find more samples of it here, tho they're all images.</p>
      <p>Here is another use of the typeface.<br>
      <img src="http://shield.nvidia.com/images/shield-logo.png"><img src="http://www.geforce.com/sites/all/themes/geforce/logo.png"></p>
      <p>I've also found this guideline (<a href="http://international.download.nvidia.com/partnerforce-us/Logos/way-its-meant-played/GeForce-Notebook-Brand-Guidelines.pdf" title="http://international.download.nvidia.com/partnerforce-us/Logos/way-its-meant-played/GeForce-Notebook-Brand-Guidelines.pdf">http://international.download.nvidia.com/partnerforce-us/Logos/way-its-m...</a>) but they don't mention the typeface used here. Hope this is helpful.</p>
