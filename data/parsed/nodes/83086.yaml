    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HOW Conference_4254.jpg"></div><p></p>
    <p>&nbsp;<br>
    Join Monotype Imaging in Chicago for <a class="freelinking external" href="http://blog.fonts.com/2011/06/14/join-us-in-chicago-for-three-typography-sessions-at-the-how-design-live-and-in-howse-conferences-save-100-on-registration/" rel="nofollow">Three Typography Sessions</a> at the <a class="freelinking external" href="http://howconference.com/" rel="nofollow">HOW Design Live and In-HOWse Conferences</a></p>
    <p>The HOW Design Live Conference, a mega-gathering of thousands of designers, freelancers, in-house managers and packaging designers, begins June 24 in Chicago. If you’re attending, see our Fonts.com Web Fonts service in action at our booth (212) and the latest version of our FontExplorer X® font management tool. Sunday, June 26, will be a busy day for us. We’ll be presenting three sessions between the HOW Design Live and InHOWse Managers Conferences:</p>
    <p><strong>“Don’t let Your Fonts Manage You”</strong> – Tobias Meyerhoff, senior project manager for Monotype Imaging, will discuss how successful font management can improve your daily workflow. June 26, 9:00 a.m.</p>
    <p><strong>“Cheap Type Tricks”</strong> – Allan Haley, director of words &amp; letters at Monotype Imaging, will provide a bevy of type tricks for creating great typographic communication and explore real-world examples of great typography done on the cheap. June 26, 2:00 p.m.</p>
    <p><strong>"Googley Fonts, Custom Type Design as Brand Touchpoint"</strong> – Steve Matteson, creative type director at Monotype Imaging who has designed fonts for Google and Microsoft, will demonstrate custom type as an integral part of corporate branding programs. This presentation will take place at the InHOWse Managers Conference, to be held in conjunction with the HOW Design Live Conference. June 26, 12:00 p.m.</p>
    <p><strong>Type Meetup in Chicago on June 25</strong><br>
    In addition, join us for a casual evening of drinks and typographic talk next week in Chicago. Meet the Monotype Imaging team of typographic aficionados (Spanish for font geeks) for informal conversation about Web fonts, font management and new typeface releases. We’ll be at Sweetwater Tavern &amp; Grill at 8:00 p.m. on Saturday, June 25.</p>
    <p>Sweetwater is just blocks from the HOW Design Live Conference where we’ll also be exhibiting and presenting three sessions. Conference badges are not required, so feel free to drop by even if you’re not attending the show. How will you know who we are? Just look for the most attractive people in the bar! We’ll be right next to them, chatting them up on the latest slab serif released to the Linotype® library. While you are there, be sure to request a Monotyp-ini. Or try an ITC-breeze. Or how ’bout a Text on the Beach? See you there!</p>
    <p><a class="freelinking external" href="http://maps.google.com/maps/place?um=1&amp;ie=UTF-8&amp;q=Sweetwater+Tavern+%26+Grill+chicago&amp;fb=1&amp;gl=us&amp;hq=Sweetwater+Tavern+%26+Grill&amp;hnear=0x880e2c3cd0f4cbed:0xafe0a6ad09c0c000,Chicago,+IL&amp;cid=13824726057476680713" rel="nofollow">Sweetwater Tavern &amp; Grill</a><br>
    225 North Michigan Avenue<br>
    Chicago, IL 60601<br>
    (312) 698 7111</p>
    <p>If you have not yet registered for the HOW Design Live Conference, we’re pleased to offer you a special $100 (U.S.) discount on the individual full-conference registration rate. Just use discount code HSPON when registering. We hope to see you in Chicago!</p>
