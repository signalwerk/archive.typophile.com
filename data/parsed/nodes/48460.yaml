      <p>I love lettering like this &amp; I'm trying to perfect the style myself. If you ever get hold of old sign painting books you'll find alphabets like this usually called "Casual" or sometimes "Utility". Red Rooster's <a href="http://www.myfonts.com/fonts/redrooster/portobello-rr/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Portobello</a> is another close-ish one, especially the demi, bold &amp; extra bold weights.</p>
      <p>I've just noticed Bello &amp; Portobello. I presume there is a connection but what is the source?</p>
