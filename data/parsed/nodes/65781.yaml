      <p>I think that avatar_06.jpg actually has to do with a different project.</p>
      <p>Obviously, were I a competent professional type designer with such a responsibility, I would design a quality custom font for the movie, so that value would be received for money.</p>
      <p>But what kind of a font? To say what it would look like, one would need to give examples.</p>
      <p>Adobe Present might be a good substitute for Papyrus if you’re opening a sushi restaurant, but it’s the wrong kind of font for this kind of movie. Ondine and Lydian are clearly wrong.</p>
      <p>Ereshkigal, and Papyrus itself, might be good sources of inspiration. So might Codex or Oxalis.</p>
      <p>For that matter, Outpost might be a goud source of inspiration... but that font doesn’t seem to be in MyFonts.</p>
      <p>Ah... <a class="freelinking-external" href="http://new.myfonts.com/fonts/canadatype/rhino/">Rhino</a> might be a good source of inspiration.</p>
