      <p>Subcontracting rules.</p>
      <p>So one day NASA wants to send an astronaut on an extremely dangerous mission - minimal chance of returning alive. They hire an agent to recruit the best candidate for the money. The guy finds a French woman, she asks for 2 million dollars. Too much money. Then he finds a German man, he asks for 1 million dollars. Still too much. So he goes to Vartanik, an Armenian guy, and tells him to please give him a good price. Vartanik says 5 million dollars. The recruiter says: “Are you crazy, the others wanted much less! How could you ask for 5 million?!” Vartanik replies: “1 million for me, 2 million for the French babe to move in with me, 1 million for you to pick me for the mission, and we send the German.”</p>
      <p>hhp</p>
