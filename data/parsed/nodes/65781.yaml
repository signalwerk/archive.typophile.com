      <p>I wonder how often things like a film’s logotype end up decided in a committee board room stuffed chock-full of studio representatives and stakeholders and marketing and advertising departments and film supervisors all goup-art-directing everything into mush. In such a minefield it’d probably be tempting to just open the door, pull the pin and toss in a comp with glowy blue papyrus. </p>
      <p>Of course, when you’ve made as much cash as James Cameron (who’s probably a far safer and more profitable investment bet than the stock market come to think of it)—I bet you’d have the pull to keep control over your film’s logoform...</p>
      <p>I like Armin Vit, and I’d like to see him put his own work up more often for the legions of snarky logo-sharks always commenting over at Brand New...love the sub-contracting idea, but I’d probably be too excited and greedy to subcontract. I mean, unless I was too busy doing title sequences for David Fischer or something...although hiring a great, raw, ink-loving calligrapher might get things to an interesting place visually...</p>
