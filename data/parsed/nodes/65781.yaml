    <p>So...what would you do if James Cameron called and said, “Hey, I need a logotype, and probably subtitles and so on, for AVATAR 2. You interested?”  </p>
    <p>What typefaces / treatments / etc. would you take into your first meeting at the studio?</p>
    <p>I enjoyed the thread examining the choice of Papyrus, and thought...hey—I wonder how cool it could have been if Cameron had called on some pros...</p>
    <p>Here are a few pics of treatments I found advertising Avatar in various stages of the (long long) project, etc:</p>
