      <p>Thank you, thank you, thank you...... ill post more on the project soon, this is for the actual guggenheim, well at least my city is competing so far for first Latin American guggenheim, I was invited to do the webpage but found a lot of image problems starting by the typography selection. The logo was rendered with verdana, and myriad in some cases, and then it was crucified with some arial for the second part. I kind of felt the Gs were too diferent, I did thought of neutra speccially for the New York one. Im sorry i didnt do a search in typophile. I googled for a while and I didnt find something relevant. Ill post mockups of the project on the project section soon. </p>
      <p>BTW this work is amazing the winning project for the building itself its amazing. Ill show pics soon.</p>
