      <p><em>Nick, would you really classify fonts not according to the design’s intention, but actual usage?</em></p>
      <p>What's this Nina, <em>reductio ad Aachen</em>? </p>
      <p>There are many ways to categorize any font.<br>
      We're talking about a face, designed for an upscale newspaper, that has become the most-used, most-read face in book publishing. It seems absurd to not consider it a book face, amongst its many other uses. </p>
      <p>Morison's antipathy represents the hypocritical snobbery that exists within the type and design world, looking down upon the "trade" work that most of us must do to make a living--serving mammon--while we admire work that is more refined and "creative". But he was mistaken about the rudeness of Times: it was used as the text face of the Penrose annual for many years, during his lifetime, in an open, generous and ample layout. Apparently, it passed muster with his peers.</p>
      <p>There is no reason "classic" (hardcover) book faces need have a small x-height and supposedly aristocratic proportions. Dante, for instance, is quite proletarian in that respect.</p>
