      <p>Frankly, I wouldn't be above typesetting a book in Corona. But my reasons would not be entirely "mean and puritan"; rather than trying to save trees, it would be because the face was once so familiar - and still blends familiar ingredients and proportions - that it might be more nondescript than Century Expanded, and thus better approach the worthy ideal of the "crystal goblet".</p>
      <p>But snobbery though certain things may be, I'm not sure it's hypocritical. Designing Paragon and Aurora and Excelsior and Corona... yes, it was a living, but as a post here noted, designing the TTS legibility fonts was more "work" and less "fun" than working on something that would be more creative, more of a labor of love.</p>
      <p>Thus, cutting Jenson Oldstyle or Poliphilus - that's the sort of thing a type designer wishes to get to do when he gets to the top of the field. That's what will be acclaimed and remembered when rubber rollers on stereotype presses become museum pieces.</p>
      <p>It's not hypocritical to pay one's rent by doing the work that one can find, or to prefer to be doing something more creative. That's true in technical fields as well as artistic ones.</p>
