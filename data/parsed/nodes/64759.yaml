      <p>&gt;Therefore describing x-height in terms of cap height would give a better idea of absolute x-height at a given point size.</p>
      <p>Nick, in digital fonts x-height is of course specified relative to the Em, and the Em is scalable. </p>
      <p>So instead of a 'better idea' why not just use the x-height relative to the Em, as I suggested above, which gives a completely *exact* idea of the x-height at a given point size?</p>
      <p>The x-height of Times Roman is 450 when the Em is 1000. And the x-height of Minion Regular is 438 on the same scale. That is a complete specification of the x-height. </p>
      <p>If you want to discuss how it will set, and the readability in a given usage, then you need to look at other factors: length of ascenders, descenders, cap height, set width, color, and diacritics, depending on the use you are considering.</p>
      <p>This is also my answer to you, Hrant. You are right that how small or large on the body matters, but so do all the other factors I mentioned. So we'd do better to express x-height as it is actually specified in a digital font: in proportion to the em. Everything else can be a bit misleading.  </p>
      <p>Note: After your input, I revised the TypoWiki to include the fact that in digital fonts the x-height is specified in Em units.</p>
