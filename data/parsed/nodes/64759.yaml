      <p>Your test is the sort of naive thing only the shallowest of typographers would perform. First of all, a font's x-height is certainly not the only player in apparent size. But also, if two fonts have the same absolute x-height but one's ascenders are taller, you need more leading; and that puts pressure on the vertical proportions, hence the point size. All these dimensions are linked, and cap height is one of the very smallest factors. You're allowing a font's size-on-body to completely throw off any valid evaluation. So your comparison is nearly totally useless, and no decent typographer would be "hard put" to realize that Times and Minion are not similar in vertical proportions, which is what you said, and I objected to.</p>
