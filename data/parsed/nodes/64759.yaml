      <p>The problem with defining x-height size in proportion to the EM (as intuitive as it might sound) is that it gives a font's size-on-body a deciding say on how big the x-height seems; if the font has a lot of talus (internal leading) the x-height will seem deceptively small, and vice versa.</p>
      <p>This is a problem because a user can choose any point size and he often does this to compensate for a size-on-body that's too small or large; but a user cannot change a font's vertical proportions.</p>
      <p>So talking about x-height with respect to extenders* really is the best compromise I think.</p>
      <p>* Which can be limited to ascenders since descenders are: usually predictably slightly shorter than ascenders; and most of all, rare in text.</p>
      <p>hhp</p>
