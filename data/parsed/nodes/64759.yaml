      <p>Well, Nick, the x-height in a piece of metal is a fixed number, however many fractions of an inch or how many millimeters. When we go to digital type, because it is scalable, I think it is preferable to compare the x-height to the em. Then, for example, you can speak of how sizes of x-heights compare across fonts, and when they match in setting on one line. If you pin the comparison in relation to either the cap height or ascender height, you lose that. Also in the font itself the x-height is actually a number in units based on the em. So I think the Typowiki would better define size of x-height as percentage of the em, rather than the cap height. </p>
      <p>What do you all think?</p>
