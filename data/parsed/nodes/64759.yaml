      <p>I think the most useful measure of size of x-height for the sake of type discussions is the percentage of the em. For then you can specify caps, ascenders, descenders etc independently in relation to that as well. </p>
      <p>However, as 95% plus of type in extended type is lower case, the relationship between the x height and the ascenders is visually the most significant figure for aesthetics and possible affect on readability. </p>
      <p>The actual affect of x-height on readability I think is pretty hard to pin down, in a case when differences are as small they are between Minion and Times New Roman. </p>
      <p>The difficulty is that the overall readability is, as Nick is fond of pointing out, a matter of the overall setting. If you have short columns tightly set at 10 point, then Times might win. If columns of a somewhat longer measure set at 11 point with a little more leading, then Minion might win. But we don't have any good measures yet anyway.</p>
      <p>Further, as Hrant points out, the width and color of the type are also important variables. These may not be independent factors in readability, but interact with x-height/ascender-height ratios.</p>
