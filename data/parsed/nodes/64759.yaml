      <p><em>It’s not hypocritical to pay one’s rent by doing the work that one can find, or to prefer to be doing something more creative.</em></p>
      <p>No it's not, if those two situations are considered separately; but the connection between them is tenuous.<br>
      It's hypocritical to assert that one's rent-money work is inherently inferior, or that one's work which achieves popular acclaim is thereby second rate.  </p>
      <p>Further on Morison's hypocrisy: he was happy to take the acclaim for having excogitated Times, although it is now understood that he swiped the design from Starling Burgess and Victor Lardent did all the work.</p>
      <p><em>Thus, cutting Jenson Oldstyle or Poliphilus - that’s the sort of thing a type designer wishes to get to do when he gets to the top of the field.</em></p>
      <p>A bit of a generalization. I suspect that more of us take a crack at reviving Jenson early on.<br>
      And if you made it to the top and wanted to leave your mark on history, surely doing something original would make more sense than a revival?<br>
      BTW, Poliphilus wasn't designed or "cut": it was pure concept, a photo-facsimile.</p>
