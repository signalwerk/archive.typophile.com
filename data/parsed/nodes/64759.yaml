      <p>&gt; Most certainly true. But it is the job of a text face designer to<br>
      &gt; design not for the consciousness, but for the subconscious.</p>
      <p>Yes, it is true that people don't have to be directly interested in or aware of fonts to be affected positively when a printed page is a thing of beauty.</p>
      <p>But when a response is subconscious and not explicit, that also means we're dealing with something that isn't out in the open, and that means - as one would expect when the subject is aesthetics, in any case - that we're dealing with something likely to be subjective rather than objective.</p>
      <p>I think that Times Roman can be, and has been, a contributing part of many beautiful pages of text. It does have design limitations - so it is unsuited to the kind of typography where one would want Centaur instead - and it has been misused, as can happen to any font. Times, optically condensed by 10%, is something that deserves the kind of obloquy you appear to be hurling at the font in general. But all of this is just my personal taste, and you therefore do not have to account for why your taste may differ from mine - nor I for why mine differs from yours.</p>
