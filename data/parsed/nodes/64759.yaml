      <p>I agree that Times New Roman is a great typeface, with many assets. </p>
      <p>As Mark said, it is extremely compact, which makes it good for shorter columns--newspaper and magazine columns, paper backs. Also of compact types it combines being dark, readable at small sizes, and clean all at the same time. </p>
      <p>Whoever did it basically took a large x-height Dutch type and put sharp, lapidary serifs, like Gill's Perpetua, on it instead of the slabby originals. This worked very well, and it is hard to beat for compact, short printed columns at small size. </p>
      <p>However, to me it is a little too compact for ideal comfort in reading. Also its sharpness and compactness has a certain kind of "I'm all business" aesthetic about it that I don't think is best for many uses.  </p>
      <p>At long measure, such as in a single column on letter size or A4 paper with narrow margins, it is pretty much of a disaster.</p>
