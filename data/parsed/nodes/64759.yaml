      <p><em>Which, as I explained, is not nearly as useful as talking about<br>
      the relationship of x-height to ascender height. And you agreed.</em></p>
      <p>Same old Hrant, misrepresenting to score points.</p>
      <p>What I said was "significant", not useful.<br>
      If we're talking theory, ascender height is significant. In practice, less so.</p>
      <p>Try this test: set two paragraphs with the same spec, one in Minion, one in Times.<br>
      You will be hard put to determine which has the larger x-height.<br>
      Now suppose you say, "well, Minion has 8% taller ascenders, therefore I will reduce the Minion setting by half a point size for a more accurate comparison, and now Minion has a smaller x-height." Well duh, you made it smaller, so of course it now has a smaller x-height!<br>
      With regard to ascender height in this comparative setting, the typographer would be more inclined to say that the ascenders of either face are too long or too short with regards to the leading, or the mise-en-page. </p>
      <p>Ultimately, ascenders are long or short in comparison to x-height, not the other way round.<br>
      Because x-height is the most apparent vertical dimension of a typeface.</p>
