      <p><em>I wasn’t aware that the definition of a “book face” had to depend on the conventional definition of x-height even if an alternative view of that parameter was more typographically valid: it is unclear to me what reasoning this is based on.</em></p>
      <p>It won't be typographically valid if typographers don't understand you.<br>
      In a meaningful discussion, the participants should all understand the terms involved to mean the same thing.<br>
      So it's logical to observe the conventional meanings of words, even if you think they don't make sense.</p>
      <p>You proposed that a smaller x-height version of Times would be worthwhile, because "book faces" have small x-heights.<br>
      I alerted you to the fact that they do not, according to the conventional understanding of what x-height is.<br>
      I didn't make this up, or write the TypoWiki. I have been in the type business many years, in various capacities, and my understanding is that x-height is defined in terms of cap height. Of course, that may not be entirely logical, and one may work with a different understanding, but that doesn't alter reality.</p>
      <p>There are cross purposes here.<br>
      As Hrant says, when comparing typeface design, it is useful to consider ascender length in assessing x-height.<br>
