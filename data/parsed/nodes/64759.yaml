      <p><em>...wouldn’t the x-ht/extender ratio really be more relevant than x-ht/cap?</em></p>
      <p>I think all three (cap height, extender height, descender length) are relevant to x-height.</p>
      <p>However, isn't it true that in typography we normally discuss x-height in relation to cap height, and extender length in relation to x-height? In other words, we say that a typeface has a small x-height if it is small in relation to cap height. But if it is small in relation to extender length, we don't say that it has a small x-height, rather, we say that that the font has long extenders.</p>
      <p>Therefore, it is correct to say that Times has a large x-height and short extenders; and that Minion has a large x-height and long (er) extenders. What you are saying, Hrant, is that any typeface with long extenders has a small x-height, according to which logic Minion does not have a large x-height. But if you ask typographers about Minion's x-height, I think the consensus would be that it is medium to large, because they will compare it to cap height. Duh.</p>
