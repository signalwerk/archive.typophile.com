      <p>&gt;&gt; Book designers specify Times for text<br>
      &gt;&gt; because they like the way it looks and reads.</p>
      <p>&gt; Complete hogwash. Most book designers who specify Times<br>
      &gt; should not even be designing a toilet paper dispenser.</p>
      <p>I don't know if I can really dispute that statement. After all, a lot of books do simply use Times Roman by default, without much thought being put into their design.</p>
      <p>But I will at least point out that Times Roman has been used in some very well-designed books. The Codebrakers by David Kahn, from Macmillan impressed me very favorably with how Times Roman looks when used well. (They did get the chapter heading for the chapter titled "Russkaya Kriptologia" badly mangled, even though the italic page headings were right... nobody's perfect.)</p>
      <p>&gt;&gt; Publishers and distributors report no adverse sales effects.<br>
      &gt;&gt; Readers don’t have a problem with the face.</p>
      <p>&gt; You know no such thing - there are no reference points!<br>
      &gt; This is pure, baseless fabrication.</p>
      <p>It's true that he is being... anecdotal. However, I think that it can be safely said that except for the few who take an interest in such things, most people don't pay much attention to fonts.</p>
      <p>If a book is set in Univers or Optima, people will notice that it's trying to be "contemporary", so that usually happens in books on art and design.</p>
      <p>If a book is set in one of the condensed Scotch Romans from the 19th Century - or even in the vastly superior Binney &amp; Ronaldson Oldstyle, they'll notice it's old fashioned.</p>
      <p>"Typeset" the book on an IBM Executive typewriter, and they'll notice there's something fishy right away.</p>
      <p>Otherwise - Bembo, Palatino, Times Roman, Caledonia, Baskerville, Century Expanded... if the responsible parties have made a reasonable effort to choose a halfway-decent serif font, and an appropriate point size given the font's x-height, a column width not stupendously long, and a little leading if necessary... and they will just go off merrily reading without noticing the effort that has been made on their behalf.</p>
      <p>Whatever may be wrong with Times Roman, I strongly doubt that it is so seriously wrong as to percolate into the consciousness of the general public. It would indeed be kind of nice if Times with long descenders were seen more often - given that 12 point Times on a computer is 10 1/2 point Times with 1 1/2 points leading or thereabouts <em>anyways</em>, it's not as if we would have broken kerns falling out of our laser printers - but I think someone could set a mass-market paperback in Corona with hardly anyone noticing anything was amiss.</p>
