      <p>Thank you for all of your thoughtful comments. </p>
      <p>I agree that teaching underlying design principles is critical, but I do not think that devalues the teaching of the current digital tools of the trade. I require my Type I students to do concept development with pencil and paper. We spend a lot of time learning to draw type by hand, analyzing thumbnails and roughs, before going to the computer lab for production. </p>
      <p>In my more software-oriented Desktop Publishing class, I integrate teaching software features with design principles and practices. Examples: setting up a well-constructed grid on a Master Page or using Style Sheets and Baseline Grid to teach the importance of consistent formatting. </p>
      <p>I am happy if my beginners learn typographic measurement, terminology and can classify type into the major historical groups.  If they can recognise Baskerville, they will be able to work with Mrs. Eaves when the time comes. With a little luck they will learn to see like artists, with even more luck, some of my love for the Roman alphabet will rub off.</p>
      <p>The employment ads on the Creative Hotlist make interesting reading.  We have limited time with our students, but the bar for entry into the better design jobs continues to be raised. We are teaching a new generation, more oriented to Google and MySpace than reading newspapers or textbooks. </p>
      <p>Back to the original question, I often remind myself that we have more typefaces available to us than ever in the history of printing. The typographers of the past managed to do stellar work with whatever lead type was available. They could scarcely have imagined the riches we take for granted in our font menus.</p>
