      <p>&gt; What is ink density?  </p>
      <p>My print experience isn't equal to that of others in here, but my understanding of ink density is the total value of ink that a CMYK image will have. 230% rings a bell as a common maximum ... which means that the total percentage of the four inks should not exceed that amount. It is press dependent, and too much ink will result in a crappy look.</p>
      <p>In the old days things like GCR (grey component removal) and UCR (undercolor replacement ... or have I mixed up the Rs?) were used by prepress people to get the ink levels down. Now the artist has to be the prepress person. (And I'm not sure if you can access UCR and GCR in all DTP programs ... it is in Photoshop somewhere.)</p>
