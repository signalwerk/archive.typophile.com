    <p>Has anyone found the list of included fonts for the new CS3 packages? I looked around adobe.com and found only vague references to "over 100 fonts included".<br>
    In the CS2 copy, they refer to "over 180 fonts included". I do not know if this is just advertising copywriting, or if the fonts have been cut back. I am hoping to see Arno Pro in there. </p>
    <p>I am a community college educator. Our lab really depends on the bundled fonts, as we do not have the budget for outfitting 60 workstations with a large font library. We have to get along on system fonts and whatever Adobe gives us with the CS.</p>
