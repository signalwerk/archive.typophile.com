      <p>"For example too many design portfolios contain wildly impractical pieces such as books with 6 kinds of paper, metallic ink, die-cut, etc etc. This was my biggest problem with the design students I interviewed"</p>
      <p>I've found that there's 3 general groups of design graduates:</p>
      <p> a) the group Patty describes. Comes from a respected design program, usually with a BFA. Work tends to be highly experimental and conceptual. Strong fine arts influence. Not necessarily practical. Student may or may not be technically savvy with the software.</p>
      <p> b) Also comes from a respected design program, usually with a BFA. Work tends to be more assignment based using more pragmatic scnearios. More emphasis on problem solving. Student may or may not be technically savvy with the software.</p>
      <p> c) The 2 or 4 year tech school. Might have a BS. Work tends to be quite bad conceptually and practically. Student does typyically have a solid grasp on the software.</p>
      <p>Of those, people from A or B tend to be the best hires for design work. Both have slightly different strengths, but, in the end, tend to make solid designers.</p>
      <p>Group C never quite catches up, as they simply haven't had a solid  foundation of art and design theory and history courses. Their skillset ONLY encompasses the ins and outs of a particular set of software apps. They may make decent production artists, but not terribly great designers. </p>
      <p>Of course, there's exceptions to all 3 of those groups, but, in general, that's how I see it...</p>
