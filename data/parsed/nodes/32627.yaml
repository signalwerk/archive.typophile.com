      <p>I think it's limiting to go to design school. Period. In many countries you are forced to decide on a "trade" before entering university. America still offers the liberal arts degree. I entered college expecting to major in art, ended up majoring in... art. But along the way I took astronomy, intellectual history, dance, psychology, russian literature, etc etc. Those were some of my best classes. I'd never have taken such a range of subjects had I been in design or art school (and if I had, the profs would probably not have been as good.) I feel like I graduated a more well-rounded, better-educated person than had I narrowed my focus to what interested me at age 18. And that no doubt makes me a better designer. It's not just about design.</p>
      <p>Or software.</p>
      <p>Plus I think it broadens one's perspective to be around all types of people, not only designers or artists.</p>
      <p>And yeah, I learned how to write, too. That has been an immeasurable help in publishing. It's amazing how illiterate some designers are.</p>
