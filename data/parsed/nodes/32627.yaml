      <p>"Aluminum - this is the kind of attitude that sends grads to me applying for a print job and when asked what ink density is - they stare at me blankly. Are you saying that the technical aspects of what we do are solely the students responsibility?"</p>
      <p>That's not quite the same thing. Learning ink density is a production concept of the media itself. And is important to learn. Learning a specific printing press? Not so much. The concepts are the same regardless of the printing press.</p>
      <p>Trapping, overprinting, CMYK, spot colors, line screens, etc...these are all important technical issues students should underststand. The specific software? Not so much, as understanding the underlying printing and pre-press technology is more important than a specific set of keyboard commands.</p>
      <p>I don't care you you use Adobe Illustrator, Freehand, Corel or inkscape to draw me a logo. If you understand the concept of printing, line art, and proper bezier curves, you'll do fine with any of them.</p>
      <p>Maybe another way to say this: It's easier to train staff on a specific piece of software vs. teaching them the vast underlying concepts and history of the media overall.</p>
      <p>Take web designers today. A lot of 'design schools' offer 'interactive design' which really is just a few semester's worth of Dreamweaver and Flash. These kids can't tell a UL tag from a MP3. As such, they really don't understand the medium they are working in. I'd much rather have a student that was tought HTML with notepad. I can teach them DW in a matter of hours if they fully understand the underlying concepts.</p>
      <p>"Does anybody still use Freehand?"</p>
      <p>I do. And it's like sticking with an abusive spouse. Yea, Freehand leaves us with a black eye every other weekend, but we love it so. Why can't I quit you Freehand!?</p>
      <p>(And may Freehand RIP...you will be truly missed!)</p>
