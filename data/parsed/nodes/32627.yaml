      <p>Pursuant to the comment above mine - I think it's the responsibility of a design school to turn out designers who are employable. That means training them in design principles, current software, and in relevant technical issues. You can't cover everything, but the more a student is prepared to actually enter the profession, the better a job they'll get. Schools can't be asked to anticipate where the industry will be in the future, but they can do their best to prepare their students for the present. </p>
      <p>For example too many design portfolios contain wildly impractical pieces such as books with 6 kinds of paper, metallic ink, die-cut, etc etc. This was my biggest problem with the design students I interviewed, many of them had little or no practical training. Design is an applied art, there is always a client, always a budget. Pretending that isn't so is foolish.</p>
