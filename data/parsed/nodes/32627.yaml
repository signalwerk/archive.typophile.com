      <p>Darrel - I spoke to Adobe. If you purchase the full CS 2.3 premium right now (for $1199 + tax) you will get a free upgrade to CS 3 when it's released. It seems much easier to purchase it either from Adobe or a licensed reseller. I believe this offer is good for 30 days from the announcement date of March 27.</p>
      <p>Back to the thread - yes, of course you need to learn principles of design and type if you're going to be a designer. But it seems nonsensical to have students work in a software that is barely used professionally. Given that Bonnie is teaching at a community college and not Pratt I'd guess she's teaching the students professional skills as well as the fundamentals of design and therefore is right to have them working in InDesign, Illustrator or Quark.</p>
      <p>You'd be hard-pressed to find a design job description that includes Corel, especially at the expense of those other programs.</p>
