      <p>&gt; What is ink density?</p>
      <p>In cmyk it is the total of the 4 inks. In grayscale it is the blackness of the black for lack of a better description.</p>
      <p>It is also known as DMAX, TAC (total area coverage), Total Ink.</p>
      <p>In glossy magazines it is almost always 300%.</p>
      <p>In newsprint it ranges from 220%-240%. Usually.</p>
      <p>So the default black in Photoshop if you are using SWOP (v2) in your colorspace it will be:<br>
      75-68-67-90</p>
      <p>Add them together you get 300% since the ink density max in that profile is 300%.</p>
      <p>It's a crappy black mixture but that is another topic.</p>
      <p>It becomes critical in newsprint. The way to get there is color management.</p>
      <p>To check it I set the second color readout in the Info Palette in PS to Total Ink. Running almost any tool then will give you the density in any given section.</p>
      <p>Different media can accept different amounts of ink basically. If you short something you're not getting as much as you can from a print job - if you put too much ink you'll end up with a pile of mud. If you learn how to use color management and profiles printing quality stuff will be a lot easier.</p>
      <p>It pays to learn some of this production stuff. More and more companies are cracking down on designers to learn this so they don't have to hire color correctors, separators, etc…</p>
      <p>peace</p>
