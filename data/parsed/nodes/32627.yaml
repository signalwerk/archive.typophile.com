      <p>Adobe is clever. They practically give away fonts in the Educational pack (less than $1 a font, I think). Other foundries are offering 20 and 30% discounts for students. Not in the same league.</p>
      <p>The result is that the graduating student thinks first of Adobe, having worked with quality Adobe products and crap (sometimes/often) free web fonts while in school. So where does he/she look first when later specing and buying fonts?</p>
      <p>The independent font producers might be wise to collaborate on a $99 package with 100 or more quality indie fonts. Then a school can make that a requirement, perhaps for second year students, who will be ready to expand their typographic horizons a bit.</p>
      <p>Suggesting that students buy individual fonts won't work. Good instruction works best if the students are on the same page with the same options. A teacher might assign a student to choose a good indie font, and 98% of students will come up with a web freebie, or a warez version of a commercial face.</p>
      <p>Practically giving away the fonts to students now will result in sales later on.</p>
