    <p>Hi typophiles!</p>
    <p>Long time no see,<br>
    Im about to buy a new computer and was wondering about monitors.</p>
    <p>I actually have an 17’ CTR, cheap and “small” but good...</p>
    <p>What do you think? CTR or LCD?<br>
    I read that LCD monitors order pixels very different from CTR, for me is very important couse i work web, type design and other graphic activities.</p>
    <p>Small plasma monitors exist? hehe</p>
    <p>Salutations<br>
    Ferchules</p>
