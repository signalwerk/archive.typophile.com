      <p>i’ve recently been in a large monitor spec’ing and ordering session for my current project - a CG animation rendering digital 4K frames for transfer to imax film format. the monitor color space management is a huge headache.</p>
      <p>here’s a few things i’ve learned:</p>
      <p>the industry is in transition from CRT’s to LCD’s and the options are not yet optimized. there’s a lot of groaning in the animation post-production industry these days on account of this netherzone we seem to be in between a clearly obsolete old standard and a not yet fully realized new one.</p>
