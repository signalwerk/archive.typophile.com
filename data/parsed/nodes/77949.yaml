      <p>Thanks guys.<br>
      I've gone through the Font Metrics and this is how it's set now:<br>
      Ascender 896, Cap height 896, Descender -128, left sidebearing 0, right sidebearing 128. I moved some anchor points that were off the grid by 1 unit. I also tried to change the UPM to 2048, but that didn't seem to change anything. </p>
      <p>I've used auto-hinting on "A" and "B" in this example. Should I?</p>
      <p>I think it looks a little better, at least the scaling is right, but some gray is still leaking to the neighboring pixels.</p>
      <p>Any ideas what could still be wrong?</p>
      <p>Thanks!<br>
