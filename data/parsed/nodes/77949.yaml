    date: 2011-01-12T08:30:00
    date_raw: 12 Jan 2011 — 8:30am
    votes: null
    html: |-
      <p>As Jason pointed out, ALL measurements must equal whole pixel values for the font to work.<br>
      Therefore, the Ascender AND Cap heights MUST equal 896 and the Descender MUST equal 128. The Left Sidebearing should be zero, and the Right sidebearing 128.</p>
      <p>BTW, if you scale everything 200% and generate a TTF-flavor font, your measurements would be ideal (2,048 UPM) for the format.</p>
    html_clean: |-
      <p>As Jason pointed out, ALL measurements must equal whole pixel values for the font to work.<br>
