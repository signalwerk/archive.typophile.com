  html: |-
    <p>I don’t know if this is the appropriate place for this but I have a few comments/suggestions.<br>
    (the new site looks great, by the way! and is so much faster!)</p>
    <p>1. Does the initial post/topic have to be so HUGE???</p>
    <p>2. Links seem to open automatically in the same window - is there a way to set the preference so that they automatically open a new browser window? Also in the html formatting guide I don’t see a way to do this.</p>
    <p>3. Can the FAQ anchor to the top like the Fontshop note?</p>
    <p>If this isn’t the right place to post this I’m sorry but I don’t know who to direct this to…</p>
