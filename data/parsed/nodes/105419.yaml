    html: |-
      <blockquote><p>But if the word processor is to be able to [place the editing caret inside a ligature] it must have some information from the font designer giving the locations of appropriate caret positions.</p></blockquote>
      <p>Not necessarily. In case any particular ligature is missing caret placement data, text shapers usually divide the ligature’s advance width between the number of its character components and use that as the caret positions. It’s not some heuristics but a mere equal division, so obviously this doesn’t always work well. Still, it’s better than nothing, especially when it’s so rare for a font to have any ligature caret data at all. HarfBuzz, as far as I know, does this, so does CoreText. Not sure about others.</p>
