    html: "<p>If a single backspace is deleting the entire 'longs_longs_t' ligature, that suggests to me that something other than the underlying three-letter character codes was stored in the text: either a PUA codepoint or possible a raw GID. This could depend on how the ligature was input in the first place.</p>"
