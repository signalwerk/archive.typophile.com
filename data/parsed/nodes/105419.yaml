      <p>Thank you very much.<br>
      John, you are right - I put 'longs_longs_t' via Glyphs window.<br>
      EB Garamond edited: 'longs_longs_t' with ligature caret:<br>
      Printscreen 6<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/longs_caret_5504.jpg"></div><br>
      InD 5: longs + longs + t ligatured:<br>
      Printscreen 7<br>
      <div class="imageWrap"><img src="http://typophile.com/files/longs_idd_6108.jpg"></div><br>
      As you can see InD ignores ligature caret info, splits are (probably) based on advance widths of underlying letters. What a pity that Adobe does not support the specification.<p></p>
