    <p>I have a text with some ligatures. When I try to delete a part of a ligature strange things happen (all samples in InDesign 5, font EB Garamond OTF/CFF by Georg Duffner):<br>
    1. Ligature longs_longs_t. I want to delete the "t" character; placed the cursor after "t" and hit 'backspace'. Unluckily ALL my ligature disappeared!<br>
    2. Ligature f_f. I did the same and magically ONLY second"f" disappeared. What a confusion.<br>
    Printscreen 1<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/del_test2_4627.jpg"></div><br>
    Printscreen 2<br>
    <div class="imageWrap"><img src="http://typophile.com/files/del_test1_3907.jpg"></div><br>
    I found some info: <a href="http://fontforge.org/editexample4.html" title="http://fontforge.org/editexample4.html">http://fontforge.org/editexample4.html</a> :<br>
    "Some word processors will allow the editing caret to be placed inside a ligature (with a caret position between each component of the ligature). This means that the user of that word processor does not need to know s/he is dealing with a ligature and sees behavior very similar to what s/he would see if the components were present. But if the word processor is to be able to do this it must have some information from the font designer giving the locations of appropriate caret positions."<br>
    Let's try to select a character in our ligatures:<br>
    Printscreen 3<br>
    <div class="imageWrap"><img src="http://typophile.com/files/caret_test2_5533.jpg"></div><br>
    Printscreen 4<br>
    <div class="imageWrap"><img src="http://typophile.com/files/caret_test1_5484.jpg"></div><br>
    It looks like "f_f" have "ligature caret' information, "longs_longs_t" have not.<br>
    Actually:<br>
    Printscreen 5<br>
    <div class="imageWrap"><img src="http://typophile.com/files/liga_caret_5778.jpg"></div><br>
    So it is up to font designer. For example Luc[as] writes: <a href="http://forum.fontlab.com/index.php?topic=8778.msg29007#msg29007" title="http://forum.fontlab.com/index.php?topic=8778.msg29007#msg29007">http://forum.fontlab.com/index.php?topic=8778.msg29007#msg29007</a><br>
    Some remarks?<p></p>
