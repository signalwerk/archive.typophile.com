    html: <p>You could draw two glyphs in Illustrator, one with an angle of 30 degrees, and the other with an angle of 55. Then, with the blend tool, interpolate. Double clicking the blend tool icon gives you more options like setting the number of steps. Make sure you have an equal number of anchor points though.</p>
