  html: |-
    <p>Hi all,</p>
    <p>I'm working on some pretty blocky type and its angle cut off points (ege the first angle of a 2 is sliced) are around 45 degrees, now I was thinking it would be cool if I could automatically generate these angled lines at different angles, eg from 30degrees through to 55degrees and then I could pick and choose the one I like.</p>
    <p>Just wondering if anyone knows a way I could do this using specific software, via an action in illustrator or something maybe?</p>
    <p>Any help, ideas would be great</p>
