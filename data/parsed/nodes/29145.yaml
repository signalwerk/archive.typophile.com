      <p>Thanks for your suggestions, Gudmund. I took a look at The Foundry and de Groot's types. I like many of them (especially Foundry Form Sans), but they feel too "new" for what I'm looking for. Their humanism is probably what's not clicking; I think I'm latching on to a bit of an early 20th century vibe in what I want.</p>
      <p>I think you're right; I am looking for a display typeface, especially since I'm planning on finding a good serif for body copy later on. That said, I do want to have the <em> option </em> of using the sans for longer passages if I need to.</p>
      <p>James, I may just go with Neutraface, especially since it does have the flexibility of being both display and text (luckily, I don't use the dimension sign all that much, but that is odd). Plus, it's designed by Christian Schwartz, just about my favorite designer. But it doesn't quite grab me like Relay does. Any other typefaces that I should consider?</p>
