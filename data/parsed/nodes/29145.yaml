      <p>Thanks for the suggestion, Terry. I had seen Proxima Nova, but it's not quite the style I'd like. After seeing these fonts, I think I'd like something different from the very humanist (like Frutiger) and the Swiss neutral geometric, in which Proxima Nova seems to fit. So the R where the tail joins the stem without a crossbar (hope I got the terminology right), the A and N with sharp tops, a near-perfectly circular O, and a G without a bar in the counter appeal to me.</p>
      <p>I happened to find another one I like on my own (looking through the book <em> Contemporary Newspaper Design</em>). The <em>National Post</em> uses Jim Parkinson's <a href="http://www.myfonts.com/fonts/parkinson/richmond" rel="nofollow">Richmond</a>, which has the sort of Deco/Johnston character I like. And its italic isn't just an oblique roman! Yay! In fact, seeing this face a while back might have started me on this very quest. So for me, the ones I'm seriously contemplating are Relay, Neutraface, and Richmond, with Verlag, Agenda, and Nobel close behind.</p>
