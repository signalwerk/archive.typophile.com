      <p>Replying to Carl (didn't see your post before now).</p>
      <p>Oh, I'd love to bust out FontLab and make it myself, but three things stand in my way: 1) not having it (and having already had the demo for the 30 days), 2) not having used it before (though I may buy Leslie Cabarga's book later this year to try my hand at designing my newspaper's nameplate), and 3) living the busy life of a student. That said, later in the school year, when I have more free time, I might try my hand at putting my anchor points where my mouth is.</p>
      <p>I actually don't want it for any specific purpose; I just want a really great-looking typeface to use, and I love that Deco flavor.</p>
      <p>The posts expressing interest/mild disdain for my dislike of slanted romans as italics come as a bit of a surprise to me. I use Myriad Pro, with its rather italic italics, all the time, and after seeing Relay's italic a and g, I thought that typefaces like this would be the norm. Looking back at Relay and Richmond, their "italic" italics are actually evident in just a few key characters, so maybe I overstated my love for them just a bit. Neutraface's may be the missing link; it has by far the most divergent letterforms. As I mentioned previously, I like a clear differentation between roman and italic for combined use in text; I also can never get the taste of MS Word's horribly skewed false italics out of my mouth after using it unwittingly for years.</p>
      <p>I'm glad that I was able to suggest something interesting to get you thinking. Maybe if I have a few minutes I might try some sketching too. But I'm afraid of what my pencil will produce.</p>
      <p><em>Tangentially related to this discussion of italics:</em> without getting this thread sidetracked, as I'd still like to know if there's anything else out there I'm missing (though that doesn't seem likely at this point), I've found two really interesting and unconventional uses of italics in typefaces. One is <a href="http://www.typography.net/type/aspect.htm" rel="nofollow">Aspect</a>, which I think is well known around these parts. Pampatype's <a href="http://www.pampatype.com/html/tipografia_caracteres_rayuela_reg_home.html" rel="nofollow">Rayuela</a> seems less known, but equally intriguing. The roman has this remarkable ability to be legible and upright and yet feel wonderfully italic - did I mention I love using italics for running text? And its italic is loads of fun too - I especially love the alternate o and s's - check them out in the <a href="http://www.myfonts.com/HelpImages/Rayuela.pdf" rel="nofollow">PDF</a>. Just wanted to put Rayuela out there - I might get that after the geometric sans if my funds haven't dried up.</p>
    html_clean: |-
