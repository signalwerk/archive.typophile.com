      <p>Has Typophile been down? I couldn't get on all yesterday. I felt lost without seeing new posts on this and other threads.</p>
      <p>John (mondoB), thanks very much for your picks. You're right about Metro - too few weights for me. I actually prefer Neutraface over Verlag because Neutraface has a more differentiated italic, is designed by Christian Schwartz (although I love H&amp;FJ nearly as much), and Verlag just has this slightly more sterile feel (perhaps owing only a little to the typeface and more to my knowledge of its origins for the Guggenheim). Gill Sans, Freight Sans, and John Sans, though all great faces (I especially love John Sans' concept of being Baskerville minus serifs), aren't quite Deco enough for me, the same way that Johnston and Nobel aren't, on further reflection.</p>
      <p>Gotham hasn't been mentioned, Chris, but in looking at it, it doesn't grab me like some others. I want to say it feels <em> too </em> geometric, maybe too workmanlike, but it's more of a gut reaction. And, like many sans-serifs, its italic is an oblique roman, which I'll use if I love the roman, but would prefer not to.</p>
      <p>Tiffany, thanks a ton for your sample! For me, it's pretty much down to Relay, Richmond, and Neutraface, with Relay edging ahead. Actually, I never found the Font Bureau specimen to be that cold - I kind of like Relay and other similar faces' quality of being somewhat stark and machined - that's why I like those pointy A's and N's! I'm glad to see, from quickly glancing at your specimen, that what makes it interesting in large sizes doesn't distract as text, which was one of my concerns (since it lacks Neutraface's text and display fonts). Did you use the compressed version for this sample? Anyhow, I'm very happy to see that you consider it a worthwhile text face as well as display.</p>
