    <p>I've been thinking about buying a great sans-serif for use on all kinds of things for some time now, but I've only just gotten around to it. While I would be content with just about any well-designed sans, I've found while browsing that certain qualities stand out. Can anyone recommend sans-serifs that have a number of the following characteristics?</p>
    <ul>
    <li>Generally geometric design (but preferably not overly geometric, so Futura's out); possibly almost Art Deco in flavor </li>
    <li>Some sharp points (I especially love an N with pointy ends) </li>
    <li>An italic that uses italic letterforms, not just sloped romans </li>
    <li> A decent, preferably wide, range of weights and widths </li></ul>
    <p>In my searches, I've found a number that could serve me well. The front-runners are Font Bureau's <a href="http://fontbureau.com/fonts/Agenda" rel="nofollow">Agenda</a> and <a href="http://fontbureau.com/fonts/Relay" rel="nofollow">Relay</a>, with <a href="http://houseind.com/index.php?page=showfont&amp;id=18&amp;subpage=viewfontspecimens" rel="nofollow">Neutraface</a> and <a href="http://fontbureau.com/fonts/Nobel" rel="nofollow">Nobel</a> close behind. I'm particularly enamored with Relay, as it has lots of weights, a real italic, and that smooth, Decoish character; it's taking some self-control not to just buy it now. I've also looked at <a href="http://www.linotype.com/90672/avenirnext-family.html" rel="nofollow">Avenir Next</a>, but it lacks a "true" italic, and Kabel, Erbar, and Metro, but all three are missing italics. One thing that would truly make my day would be to find a sans like the one I described, <em> plus </em> alternates for certain letters (which Neutraface and <a href="http://fontbureau.com/fonts/Anisette" rel="nofollow">Anisette</a> have). Thanks in advance for any help you can give.</p>
