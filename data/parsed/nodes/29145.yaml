      <p>Marc, I had seen Verlag, but tossed it away at first. Looking back, it is significantly more attractive than I had first thought. The caps, which I realized are what I'm most looking at in these faces, are especially up my alley. Unfortunately, the italics are sloped romans, and I've always preferred it when there is some differentiation more than the angle (as in Neutraface). But the wide range of weights and widths does definitely keep it a strong candidate ...</p>
      <p>Stefan, both Stalemate and Sophisto are great looking, but they're both too modern in tone. On a complete aside, looking at macrhino.com, I was struck by Ommegaand. The fact that it's Dutch and combines straight and wedge serifs reminds me somewhat of Farnham, which I'm using in my newspaper's design. Do you have any more information on it, such as a firmer release date or what those 6 to 9 weights could be, that you could share?</p>
