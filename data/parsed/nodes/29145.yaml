      <p>I'm really overwhelmed by everyone's enthusiasm, especially since it got me my first post on the "Hottest" list on the main page! Thanks to everyone who's contributed to helping me find that perfect typeface.</p>
      <p>Chris, thanks for your idea. I do like Thesis (I was considering it when I was looking for a comprehensive type system), but it's too modern, too much like Myriad, Meta, and others mentioned in this thread. But I'd love to get a new-feeling, humanist sans at some point to supplement my largely system fonts.</p>
      <p>Paul, sounds like a good idea; know anyone who will work for free? Otherwise, it's a bit out of my price range, but who knows? Maybe some day I'll get someone to make one for me (or even better, I'll do it myself). I can dream, can't I?</p>
      <p>Now you've intrigued me about Thomas Phinney's sans. While I wouldn't want to overwhelm him (as I look forward to his posts here and on his blog), I second Carl's motion to see a sample.</p>
