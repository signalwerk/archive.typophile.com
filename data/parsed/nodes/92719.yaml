    html: |-
      <p>The join of the leg on the R is smooth in your sample, and definitely not in the Intertype face. The homogenized widths led me to believe that this might be a hot-metal face, but Linotype didn’t offer a Gill alternative, and I’m not hep to the scooby-doo about Ludlow.</p>
      <p>In which case, I would have to agree with Hrant that it’s probably a predigital version, with the width finagled for the particular size of this font.</p>
