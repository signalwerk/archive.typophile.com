      <p>Depending on how old your sample is, it may be Intertype’s <strong>San Serif No. 2</strong>, which is based on Gill Sans, but has a narrower M and N, and a somewhat straighter leg on the R.</p>
      <p>I’m not aware of a digital version but, then, I’m not all that hep to this interweb stuff…</p>
