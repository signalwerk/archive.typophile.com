  html: <p>i'm looking for some good block-type fonts, such as the one used in the <a href="http://www-ccs.cs.umass.edu/~cris/pix/2898/spaceneedle-starbucks-067.3.jpeg">Starbucks</a> logo. <br> <br>and also, the font used on the new Fall Out Boy CD, <a href="http://www.interpunk.com/itemimages2/23899.jpg">Take This To Your Grave</a>, is pretty close also. <br> <br>any help you guys could give me on those two, or any good block kinda fonts (preferably free!) would be awesome.</p>
