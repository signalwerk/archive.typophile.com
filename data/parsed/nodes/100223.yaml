    html: |-
      <p>Whatever the method, Signika is clearly conceived as a ﬁnessed Meta, not an original design.</p>
      <p>In order to distance from the source, some letter proportions have been altered, some terminal constructions changed and overall “softening” applied. It’s all a bit much, no matter how pleasing or effective the ﬁnished result, because the design does not establish its own identity—the modiﬁcations being piecemeal and unrelated, unable to escape the fundamental presence of Meta asserting itself.</p>
      <p>The reason that types such as Gotham and Avenir are successful developments of obvious sources is that, ﬁrst, they are not informed by so idiosyncratic a design as Meta, and secondly, they restrict themselves to one primary thematic counterpoint to the original.</p>
