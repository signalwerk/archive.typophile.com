      <p>Don't think there would be a "rule of thumb" since you're breaking the normal rules. But there certainly are examples of other companies using unusual capitalization in product names and logos to be distinctive, such as Apple's "i" products (iMac, iPhone, etc.). I remember that when the iMac first came out, some news articles wrote it as "Imac".</p>
      <p>Can't offer an opinion about which looks better in your logo without seeing layouts of both versions.</p>
