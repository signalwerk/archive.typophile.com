    html: |-
      <p><em>...why?</em></p>
      <p>Convenience.</p>
      <p>However, that is only part of the reason that sans + serif families exist, and not the main reason.</p>
      <p>They exist for the expediency of the type designer/foundry, not because having a sans + serif family is necessarily a good idea for the end user.</p>
      <p>I extended the Fontesque family to include sans, not because I envisioned typographers mixing the two in layouts, but because the original serif face had proven to be a popular type design, and brand, so a product extension seemed like a good bet.</p>
      <p>Also, once the type designer has one version of the face, it's a big time saver to use its outlines and metrics to construct the other.</p>
      <p>Of course, typographers can use a mega-family sans + serif in the same layouts to good effect, but speaking from under my art director hat, I think it's much more interesting to see someone artfully match a pair of typefaces that no-one else has previously teamed up.</p>
      <p>Using sans + serif from the same mega-family is in danger of being rather obvious, and may even be just plain lazy.</p>
      <p>James Montalbano, among others, has a better idea -- matched typefaces (Alfon and Giacomo) designed to work together, but with sufficient stylistic contrast to be <em>piquant. </em></p>
      <p>The main thing is to give them the same vertical metrics, and similar horizontal proportions.</p>
