      <p>Panoptica is the champ, with seven different typeface styles.</p>
      <p>Fontesque has Display and Text versions of the serif styles, five weights of sans, and four styles of ornament.</p>
      <p>Scala<br>
      Quadraat<br>
      Fedra and Eureka (Typotheque)<br>
      Clearface<br>
      Legacy</p>
      <p>***</p>
      <p>Gill Sans/Perpetua<br>
      Avant Garde/Lubalin Graph<br>
      Optima/Palatino</p>
      <p>Many of Gerard Unger's designs have a commonality of proportion, so his sans faces would work well with serif, and this is probably true of quite a few other designers' work.</p>
