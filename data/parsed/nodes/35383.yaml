    <p>Recently, I started a new job at a firm using a font called NaturaRoman for its text.</p>
    <p>I have since learned that NaturaRoman (although I have it in ttf and Mac PS 1) does not<br>
    technically exist. Someone created it from Requiem by Hoefler.</p>
    <p>So, I have a problem. Obviously, I cannot use the ttf file for production work. And I am working on a Windows OS machine, so the Mac PS 1 version I have won’t work either.</p>
    <p>So, I need a Windows PS 1 version of NaturaRoman, Italic, what have you ...</p>
    <p>Or, I could purchase Requiem. Not a problem. But I am unclear whether or not the 3<br>
    weights Hoefler mentions on <a href="http://www.typography.com" title="www.typography.com">www.typography.com</a> (Fine, Display and Text) translate to what<br>
    I’m used to as Roman, Italic, Bold, Bold Italic, Small Caps, Swashes, etc.</p>
    <p>Regardless, I am looking at font substitution issues. I can deal with those but what I can’t deal with is the thought of sending a True Type font (even with outlines which might shift my InDesign layout when preparing for RIP.)</p>
    <p>Any suggestions? Anyone familiar with NaturaRoman? Under the info on a Mac OS X I have found that the Nature Conservancy produced via a license from Hoefler ... what the heck is that?</p>
    <p>Kills me how people can rip off font designers ...</p>
