      <p>Hi William,</p>
      <p>Natura is indeed a variant of Requiem, which was made for The Nature Conservancy. We (and they) have since replaced it with Requiem proper, as well as some new variations of Requiem that eagle-eyed typophiles might notice at <a href="http://www.nature.org" title="http://www.nature.org">http://www.nature.org</a>.</p>
      <p>If you’re using the Natura fonts, just let us know and we can arrange a license for you. We’ll throw in Requiem as well, since I think you’ll like it better (The Nature Conservancy did!) Feel free to e-mail me offlist, or contact Romeo Ruz at my office for speedier service, at ruz at typography.com.</p>
      <p>By the way, I hope that while any of you are scoping out the typography on The Nature Consevancy’s site, you’ll take a moment to learn about the organization. They’re fighting the good fight for our environment, and they’re one of the many non-profit organizations that H&amp;FJ is especially proud to be working with.</p>
      <p>Thanks!</p>
      <p>Jonathan</p>
