  html: |-
    <p>I do not have any sample of this font, but I remember that I sometimes used to use a font called "Blue Jeans" at my previous work place. If I remember correctly, it is a Type1 font, but I am not 100% on that one.</p>
    <p>So, if anyone has any information at all about "Blue Jeans" (foundry / who made it / where can it be bought), then I would appreciate hearing it. I haven't been able to even come up with anything proofing this font's existance through google, although I remember using it for several DVD covers.</p>
    <p>Information that I remember:<br>
    - Blue Jeans (100% sure about name)<br>
    - It is a trashy font. We found it suitable on the covers for horror movies and such.</p>
    <p>Thanks in advance,<br>
    Johan</p>
