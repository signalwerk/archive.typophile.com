    html: |-
      <p>Not sure "NEW HOLLAND" is a type, more probably a custom job. Part of loosely reminding of <a href="http://www.myfonts.com/fonts/urw/handel-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Handel Gothic</a> (obviously because of the /E), the type looks very generic and not so memorable. I guess you could easily mimic it by keeping those flat-topped /E, /O and /D (which could have been done using the same letter shape).<br>
      Some in the same vein: <a href="http://Forza" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Forza</a> ("just" need to recreate this Handel-like /E with left half part of /O, extending top and bottom stroke and adding a middle one), <a href="http://www.myfonts.com/fonts/typodermic/domyouji/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Domyouji</a> (bigger customization needed), <a href="http://fonts.gestalten.com/category/display/traffic-wide.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Traffic Wide</a></p>
