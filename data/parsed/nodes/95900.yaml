    html: |-
      <p>Not sure "NEW HOLLAND" is a type, more probably a custom job. Part of loosely reminding of <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/handel-gothic/" rel="nofollow">Handel Gothic</a> (obviously because of the /E), the type looks very generic and not so memorable. I guess you could easily mimic it by keeping those flat-topped /E, /O and /D (which could have been done using the same letter shape).<br>
      Some in the same vein: <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100041" rel="nofollow">Forza</a> ("just" need to recreate this Handel-like /E with left half part of /O, extending top and bottom stroke and adding a middle one), <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/domyouji/" rel="nofollow">Domyouji</a> (bigger customization needed), <a class="freelinking external" href="http://fonts.gestalten.com/category/display/traffic-wide.html" rel="nofollow">Traffic Wide</a></p>
