      <p>Thank you so much for posting that. Now we can see what is you, and what is Joaquim! It looks like it would be interesting to read this book (and understand it!). Do </p>
      <p>This kind of early rational grid-fitting in type design is definitely facinating (such as the Romain Du Roi), though I wouldn't be very excited about using the results for text. It suffers from many of the issues that happen when an engineered approach is applied to letters. Again the thinking is interesting, but the results flawed. For example you can clearly see his Y is based on the X. But that pushes the crotch too high. And the X is made of 2 straight lines. But optically the thin stroke looks broken. The bottom of the Z is too narrow (because it's exactly the same width as the top). Same with the S. F crossbar is too high compared to the E. Likewise, the P too high compared to the R Not to mention the proportions suffer from being crammed into a box. Etc.</p>
      <p>Maybe for your purposes, try less fixing and use a straight interpretation as a starting point.</p>
      <p>Randy</p>
