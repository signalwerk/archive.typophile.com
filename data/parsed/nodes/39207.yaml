      <p>Numberals* have fought with type designers for as long as anyone can remember. I was rudely awoken in the middle of the night by a vicious gang of Fibinachi numbers. Being an ex-fontcop I recognized their faces --- Signor Gelati, Ravenna de La Rochelle and Henri Duke de Orleans a.k.a Scarface, Saunier "train wreck" du Clunk, and the notorious Claude St.Cyr.</p>
      <p>* in correspondence between Arbo and Ray Larabie numerals are referred to as <em>numberals</em> to eliminate the other two terms.</p>
      <p>j a m e s</p>
