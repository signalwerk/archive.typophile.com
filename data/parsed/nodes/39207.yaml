      <p>For an Old Style, this type is pretty modern. That A would feel right at home in bodoni and the stress is vertical. Can we see your original source?</p>
      <p>• Make all the thick strokes the same width (see the K), cuved thick strokes also need more weight.<br>
      • Beak terminals and serifs on thin strokes are all to light. Weight them up to match the thick stem serifs (see the I vs C)<br>
      • Curves need to be smoother. Its hard to tell in a gif, but the R and P for example seem to have a corner going from straight to curved.<br>
      • Y should join lower<br>
      • W should be wider and the angles corrected as mentioned.<br>
      • The leg of the r feels like it bends to much. The idea is fine, but a little to wavy.</p>
      <p>Again: can we see your original source?</p>
