      <p>P: I'd lower the p even more (a good 15%)<br>
      Q: I don't like the phantom Q :-)<br>
      N: upper left serif. It should be a smooth continuation from the diagonal (see James' N)<br>
      S: Bottom curve has a lump (both you and James)<br>
      A: Looks a little thicker at top than bottom (should be the reverse)<br>
      V: Same as the A only flipped<br>
      J: It's point should feel similar to the R and Q (maybe a hair thicker)</p>
      <p>Finally, where your horizontals go from thin into thick curves (B,D,P,R) there is still a corner. try moving the point to the left and extending the bezier handle to make it smoother.</p>
      <p>Keep in mind that most of the advice you're getting are sound type-design principles, but some of it is preference. You've certainly created a useful set of caps. Much improved compared to your original and also your source. Good work!</p>
