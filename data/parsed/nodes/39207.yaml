    html: |-
      <p>Hi Ben : ) It is possbile to build a font using a consistent set of rules for upper and lower case. I made one such font and realized the solution required a reductive design. Other type designers discovered the same thing long before I was born, and the general consensus is that reductive design is a <em>cul de sac</em>---the types are consistent, and efficient, but not much fun compared to designs in which the lower case preserves pen-derived rules of construction. People desire idiosyncracy but thrive on eccentricity in the same breath.</p>
      <p>I think x, y, and z wound up at the end because they're the least-used letters. A bit like Google and the internet, the pecking order is based on relevance.</p>
      <p>I call the gapped Q a "phantom" letter because part of the structure isn't there, or is not shown, but spectators infer the missing parts from experience of complete examples. I borrowed the term from anatomy / medicine, where amputated limbs are called phantom limbs because 1) they used to be there, 2) amputees experience a "phantom limb effect", percieving the missing limb to be there, much like seeing a ghost. This Q isn't a particularly strong example of a phantom glyph. A better example is a P with the stem section between the bowl removed, or an N with one stem removed. Aldo Novarese designed a typeface featuring a large number of phantom letters---<a href="http://www.myfonts.com/fonts/linotype/stop/" target="_new" rel="nofollow">Stop</a>. Disappointing that page at Myfonts has no description of Stop. I should talk Laurence Penny into letting me write one for them, it's such a significant face.</p>
      <p>j a m e s</p>
