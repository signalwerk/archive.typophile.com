      <p>Hi António.</p>
      <p>My very first impressions:</p>
      <p>J looks cut off by the baseline.<br>
      K, F, T, Z have very sharp points (might be a problem under not so good printing conditions?).<br>
      I find that some characters (e. g. K, H, Y) are heavier than others (i. g. C, G, X).<br>
      For example, stems of H are quite bold (H looks heavy next to some other characters – maybe make the right stem a bit lighter?).<br>
      There are sort of funny angles in W.<br>
      Right serif in U is almost a slab serif (for balance reasons?).<br>
      In my eyes, some serifs seem to make for slightly clumsy feet (like in P, Y) and stand in contrast to the strong overall stroke width modulation.</p>
      <p>Please understand that this is not a balanced critique (I focussed on what I considered possible problem zones) and that not everything that struck my eye is necessarily a bad thing. I just wrote what came to my mind.</p>
      <p>JP</p>
