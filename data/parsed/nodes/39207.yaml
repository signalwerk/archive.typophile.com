    html: |-
      <p>Most of the changes I've made are in pursuit of harmony. Typeface design involves a good deal of philosophy. So-called "humanist" philosophy accomodates and encourages anomalies, aberrations, inconsistencies attributable to a human effort eschewing modularity, matching angles and widths, and dogmatic abeyance to the grid. So-called "modernist" philosophy favors the opposite. The changes I've made can easily be construed as reductive modernism aimed at modularization. While I dislike modularity and have moved away from it in my own type designs, modularization is to some extent an inescapable function of the desire for harmony.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/evenwidth_4209.gif"></div><p></p>
      <p>Which phiilosophy, if either, is appropriate for this font? If it had angled stressing, proportional character widths and calligraphic artefacting or finish, the conventional answer would be Go Humanist, let it all hang out baby! But the plot here is vertical stress, even width and a strict synthetic finish. According to conventions in type design, modernism wins. According to convention this is a modernist type, not old style.</p>
      <p>Acceptance of conventions in type design is not mandatory. You're at liberty to reject them.</p>
      <p>I don't see any reason to drop the bowl of Y as Randy does. That kind of preference seems to be a personal one---years ago I had the same preference, but presently I favour Y's that harmonize with X. Nevertheless, I'm glad Randy made the suggestion as it is no less valid than mine and he has every right to make it.</p>
      <p>* A -- widened. I used a flipped V. Now it looks a tad too wide.</p>
      <p>* C -- overshoot corrected, fixed upper serif.</p>
      <p>* D -- narrowed. Why? If you make D wide (enough) the counterspace starts to rival the counterspace of O. Is that really a bad thing? In most fonts the capital O contains the largest counterspace of any letter, and the same can be said for the lowercase o of "most fonts". The reason has to do with saliency and cueing value in relation to readability. The large counterspace of an O is thought to have a significant saliency or explicit cueing value that helps the eye / brain reading hardware recognize it as an O. If that's true, a wide D with a cueing value rivaling O might compete with O for recognition. The most visible example of this is Helvetica. Another reason for keeping D narrow is enhanced elegance. Elegance seems to be one of the key characteristics of this font. Wide fat D's look ungainly.</p>
      <p>* E -- extended crossbar fills counterspace, creates more even tone and density. Thickened crossbar. </p>
      <p>* F -- same plot as E.</p>
      <p>* G -- overshoot corrected, fixed upper serif.</p>
      <p>* H -- widened, solves former heaviness problem without narrowing stems. H width now approximates N, increase in harmony.</p>
      <p>* K -- redesigned so that diagonals harmonize with X.</p>
      <p>* L -- narrowed for improved fit with other letters.</p>
      <p>* O -- overshoot corrected.</p>
      <p>* S -- baseline overshoot corrected.</p>
      <p>* W -- new unit built from two overlapping V's. Diagonal angles harmonize with V and A.</p>
      <p>* Z -- corrected horizontals, serifs replaced with E units.</p>
      <p>Another thing to reconsider is J. The thin part looks a bit thick, and it sports the sole ball-end in the caps set. In settings combining the caps with the lowercase the ball end will blend in, but in all caps settings it will stick out like a sore thumb.</p>
      <p>Keep going with this font. It's been done before, many times over, but it's a good learning opportunity.</p>
      <p>j a m e s</p>
