      <p>Lois. I am a fellow "Richmonder" as was his cousin Oscar Ogg, another integral figure in the design of their time. Much of his work I think is housed at the UVA library. I have many of his original books. I will contact one of his later collaborators, Rick Cusick (A Proverbial Bestiary) and see what I can find out about obtainable material. His study with Rudolf Koch was seminal in his long and industrious career, he brought Bauhaus back to the states. Your uncle was a true master calligrapher, type designer, book designer and is known by many and his work is loved by all. A true giant amongst his peers.</p>
      <p>Michael Clark</p>
