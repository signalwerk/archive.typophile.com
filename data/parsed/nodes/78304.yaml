    html: <p>I searched A proverbial Bestiary and there are many available. It is a delightful little book that your uncle did the illustrations for in 82 and Rick Cusick did the lettering. Look for a good copy but do not pay more than 20$ for it. It was a small run by TBW which was Rick's printer/publisher in New England. It would be wonderful to sit down with the kids with this gem.</p>
