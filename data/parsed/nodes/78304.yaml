    <p>Hi! I am one of Warren Chappell's only descendants which, while cool, has always been merely a novelty. Now my own children are teenagers and they have begun to understand how important their great-great-uncle was. </p>
    <p>Just yesterday we found A.A. Milne books designed by him. They were excited! We know a little bit of the distant family stuff, but now I want to find more sources about him beyond those on the general search.  </p>
    <p>Can any of you help me? Thank you.</p>
