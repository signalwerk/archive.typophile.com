      <p>Lois — Welcome to Typophile! </p>
      <p>Your uncle was indeed an important and respected illustrator and book designer.</p>
      <p>I grew up with the Winnie-the-Pooh books Chappell designed for E. P. Dutton &amp; Co., and they are still treasured items in my collection (if a little worse for wear than most).</p>
      <p>You’re probably already aware of the series of children’s books retelling operatic stories that your uncle illustrated (developed with John Updike). These are delightful books and nice examples of his illustration style.</p>
      <p>In addition to being a prolific illustrator, he was also an important book designer. Since he did much of his work in this area for Alfred A. Knopf, and since Knopf books almost always included thorough colophons (statements at the back of the book giving information and credits about the type, design, and production), it is fairly easy to identify Knopf books that Chappell worked on.</p>
      <p>Many that I’ve come across include his personal mark. Here is an example for you:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WarrenChappell-pressmark_4014.jpg"></div><p></p>
      <p>&nbsp;<br>
      I don’t know if anyone has ever compiled a complete bibliography of Chappell’s works (that would be a nice thesis project for some graduate student to tackle some day).</p>
      <p>But if you go the <a href="http://www.abebooks.com/" rel="nofollow">ABEBooks</a> and do a <a href="http://www.abebooks.com/servlet/SearchResults?an=Chappell%2C+Warren&amp;sts=t&amp;x=68&amp;y=11" rel="nofollow">search with “Chappell, Warren” as author</a>, you’ll discover plenty of used and collectible books that he worked on (not just as author). </p>
      <p>The search I just ran returned 1366 results, ranging in price from a few dollars up to $2500 (a Knopf first American edition of Sartre signed by the author).</p>
      <p>Something that might be of interest to you in particular is <a>a handmade book</a> that Chappell made and sent as a Christmas greeting in 1935. You may not be in a position to acquire it (at $960), but you might contact the bookseller and see if he’d be willing to snap a few pictures of it and give you more information. Couldn’t hurt to ask.</p>
      <p>In terms of authorship, Chappell’s <cite>A Short History of the Printed Word</cite> is considered a classic among overviews of printing history and the history of books.</p>
      <p>— Kent.</p>
