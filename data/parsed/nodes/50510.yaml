      <p>Yea, wonderful logo graphic! I love the fork. I'm not so sure I'm feeling the plate though. Have you tried it without the plate? It just seems like stock photography, feels a little amateurish, which doesn't do your graphic justice. Yea, I don't think you need the plate.</p>
      <p>As for the text, too much. And it's sloppy, people are going to be eating there, if you are looking for class, stick with a font that would compliment your "W" I mean, why aren't you using that same typeface? so there's a connection with the two W's. It possibly will not work well, but it's worth looking at.</p>
      <p>But great idea! I'd love to see it when you're finished.</p>
      <p>courtney</p>
