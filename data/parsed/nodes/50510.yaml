    <p>Any constructive criticism for this logo would be much appreciated.</p>
    <p>This logo is for a restaurant that will be opening early next year in Laguna Beach, CA. The name is WaterMarc--it will be contemporary take on a seafood bar and grill. </p>
    <p>The concept for the logo is that the "W" throws a shadow of a three-tined cocktail fork on the plate. I tried doing the W first and then the fork, but it didn't look right, so I drew the fork's shadow the way I wanted it to look first, then custom drew the "W" to kind of match it. I am a self-taught designer and have never tried to draw my own letters before, so I'm looking to this venerable community to help me out!</p>
    <p>Thank you, and peace.</p>
