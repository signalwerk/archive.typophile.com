      <p>The fork being a "W" is brilliant, but don't show the fork itself, just the shadow. You'd make the "W" of the shadow upright (with the stem bending over the plate's contours*) and that's that. Very classy. They could raise their prices just based on that logo!  ;-)</p>
      <p>* Maybe use a slightly more contoured plate.</p>
      <p>BTW, interesting name they chose. Is the interior decoration going to involve watermarked coarse ecru wallpaper? Then I would go.</p>
      <p>hhp</p>
