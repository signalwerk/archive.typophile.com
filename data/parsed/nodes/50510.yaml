      <p>This design captures the essence of what makes for a good logo--once seen always remembered. I disagree with hrant; I would leave the graphic exactly as is. If anything, I would think about softening the "W" a tad. It's a bit on the stark contrast side.</p>
      <p>Do you mean to use the text beneath? Don't! Find a way to work that "W" into the text as well, and you have a double-good design. But, just to stress: don't let that graphic anywhere in public with that text!  </p>
      <p>Curt Akin</p>
