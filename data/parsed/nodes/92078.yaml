    html: |-
      <p>Updated to v8.4 to accommodate for the Firefox 15 public release.</p>
      <p>Firefox has changed the way it handles the OT features:<br>
      in FF 14, they used a custom "Firefox only" syntax style (now deprecated).<br>
      in FF 15, now they have switched to the standard CSS3 syntax.</p>
      <p>It's a good thing. Now all the browsers use the same syntax.<br>
      On the bad side, what used to work on FF 14 is now broken in FF 15.</p>
      <p>The same applies for the testing page:<br>
      Now it works on FF 15, but no longer works on FF 14.</p>
