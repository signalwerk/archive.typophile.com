      <p><em>AFAIK applying a different color to a fallback font is not possible.</em></p>
      <p>Identifying a font on a page is possible with JavaScript; see <a href="http://fount.artequalswork.com/">http://fount.artequalswork.com/</a> for an example. </p>
      <p>So after loading a font from the menu at the top, and a delay of say 2s, you should be able to iterate over every character in the page and check if it uses the expected font, and wrap that char in a span with an 'notgottheglyph' class that has background:yellow or whatever.</p>
