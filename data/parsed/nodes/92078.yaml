      <p>Updated to v7</p>
      <p>Including a handy OT Features Panel for Firefox</p>
      <p>This should work on the latest versions of Firefox for Mac, PC and Linux.<br>
      For older versions of Firefox, it may be necessary to change the "gfx.font_rendering.harfbuzz.level" preference to "1" in about:config in order to access the OpenType features.</p>
      <p>I'm also working on the next update -v8- to make it work on all browsers.</p>
