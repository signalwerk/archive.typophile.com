  html: |-
    <p>The Font Testing Page is a tool primarily intended for type designers and independent foundries. It can also be used by art directors, graphic designers, teachers and students interested in seeing how a typeface works on the web.</p>
    <p>There is a short video at:<br><a href="https://vimeo.com/40296571">https://vimeo.com/40296571</a></p>
    <p>Operation is simple:<br>
    - First, you must accept the request from the browser.<br>
    - Then drag the font you want to try to the upper area of the Testing Page.</p>
    <p>Below you will find 8 buttons: Headlines, Text, Lowercase Only, Adhesion Only, Caps, All Caps, Layout and Kern.<br>
    - Headlines: Displays examples: 72, 60, 48, 36 and 30 to 12.<br>
    - Text: Displays text blocks, from 20 to 10.<br>
    - Lowercase only: Displays examples of 72, 60, 48, 36, 30, 24, 18 and 16 to 10.<br>
    - Adhesion only: Shows examples using only 'adhesion' text. Intended for the early stages on a typeface design.<br>
    - Caps: Displays examples of words in Sentence Case at 60.<br>
    - All Caps: Displays examples of words in All-Caps at 60.<br>
    - Layout: Displays examples of Headline, Subhead and Body text.<br>
    - Kern: Displays examples of combinations of letters and miscellaneous signs.</p>
    <p>Use it freely at:<br><a href="http://www.impallari.com/testing/">http://www.impallari.com/testing/</a><br>
    - Requires Firefox 3.6+/Chrome 13+<br>
    - 100% safe: Your fonts are only stored in your own browser 'localStorage'.<br>
    - Nothings gets uploaded to the server.</p>
    <p>By Pablo Impallari (impallari.com) and Pablo Cosgaya (omnibus-type.com).<br>
    Based on Fontdrag (fontdragr.com) and Dave Crossland's FontTest.</p>
