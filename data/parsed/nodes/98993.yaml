    html: |-
      <p>In Amsterdam, be sure to visit <a href="http://www.nijhoflee.nl/" rel="nofollow">Nijhof &amp; Lee</a>, the most excellent typography and design bookshop, now located in the special collections building of the University of Amsterdam (be aware that Google Maps may still point you to the old location, so best to search for 'Bijzondere Collecties' to locate the building).</p>
      <p>In London, the <a href="http://www.bl.uk/" rel="nofollow">British Library</a> is definitely worth a visit even if you don't have an excuse to get a reader card and spend some time doing actual work there. Their well-reviewed exhibition of Mughal Indian manuscripts will be on while you are there, and their permanent exhibit remains amazing even though I have been there many times.</p>
      <p>When you know your dates for London, check to see what events might be on at the <a href="http://stbride.org/events" rel="nofollow">St Bride Printing Library</a> and the <a href="http://www.letterexchange.org/" rel="nofollow">Letter Exchange</a> society; the latter hold their events in an extraordinary Arts &amp; Crafts guild house.</p>
