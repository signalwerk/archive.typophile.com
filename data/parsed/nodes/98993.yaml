    html: <p>For London, I would highly recommend the <a class="freelinking external" href="http://designmuseum.org/" rel="nofollow">Design Museum</a>, <a class="freelinking external" href="http://www.serpentinegallery.org/" rel="nofollow">Serpentine Gallery </a> and the <a class="freelinking external" href="http://www.vam.ac.uk/" rel="nofollow">Victoria and Albert Museum</a>. The V&amp;A opens late on Fridays and it is amazing to have a glass of wine and wander around with music playing.</p>
