  html: <p>Hello! I'm taking a solo backpacking trip through Europe in January and February. I'll be going through Iceland, London, Amsterdam, Berlin, Prague, and Istanbul for sure. Other than that, my plans are open. I love typography, and I was wondering if anyone had any suggestions for great typography/design sites? I was planning a Bauhaus day trip to Dessau, but beyond that I'm not sure. Any suggestions would be very much appreciated, thank you!</p>
  html_clean: <p>Hello! I'm taking a solo backpacking trip through Europe in January and February. I'll be going through Iceland, London, Amsterdam, Berlin, Prague, and Istanbul for sure. Other than that, my plans are open. I love typography, and I was wondering if anyone had any suggestions for great typography/design sites? I was planning a Bauhaus day trip to Dessau, but beyond that I'm not sure. Any suggestions would be very much appreciated, thank you!</p>
