  html: <p>I’m a veteran type designer (early T-26 fonts) wanting to explore OpenType for converting my older Type-1 fonts. I’m intrigued by the <span class="caps">FDK</span>, but the worst part is installing it on my new 17” <span class="caps">FP</span> iMac (Jaguar).  All of Adobe’s docs seem dated (older python on <span class="caps">OS9</span>) or just plain confusing. <br><br>I can get MakeOTF.py (-n) to run from a command line, but I can’t ﬁgure out where to locate the necessary ﬁles nor tell MakeOTF.py where to look for them. <br><br>If anyone has any words of wisdom on how to get up and running, I’d be forever&nbsp;grateful.</p>
