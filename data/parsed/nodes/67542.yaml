      <p>To me the shape of the letters and the round terminals give it a playful and/or feminine vibe, really don't think you're hitting the feel you're going for at this point. I do like the name, though the addition of "vision" comes off as a bit forced and sort of cliched (not to mention competing with the main title in that serif face).</p>
      <p>Have you thought about maybe drawing typographic inspiration from some more cinematic sources, maybe classic movie posters and the like?</p>
