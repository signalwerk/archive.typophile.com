    <p>Hi,</p>
    <p>This is for a school project. We're supposed to come up with a name for a fake TV channel, design a logo and guidelines. Quote from the brief "We segue effortlessly from escapist, to gritty, to humanitarian, to sensationalist". They show drama, reality TV, films, soaps and nice programmes.</p>
    <p>Target audience -&gt; Love being entertained, 16-45 with slight male bias, cultural mix, articulate, not affluent but have sophisticated spending and tastes.</p>
    <p>I've chosen Capra as a name. Taken from the Alpine mountain goat (Capra Ibex) and italian director Frank Capra. Here I have some logo suggestions where I've modified Clarendon to try and make it more contemporary. Clarendon has a nice property that reminds of the big round horns of the Capra Ibex.</p>
    <p>Any feedback much appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/capra_v1_4308.jpg"></div><p></p>
