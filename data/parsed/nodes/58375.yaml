      <p>Sorry for not posting an update yesterday but Im full of work.<br>
      Prolly won’t have the time until the weekend. However by then I’ll try to get it done since its a friend’s work.</p>
      <p>Anyway, I have few doubts / questions. I like the type direction I’m taking. Even less confortable with the S after Paul pointed out.<br>
      I’d appreciate if anyone who knows squarish fonts could post squarish S examples or tell me the font names so I can have an idea of what can be done for that matter. </p>
      <p>About the symbol, theres not much concept to support it besides the fact that the company works on networks (therefore the triangulation geometry/lines work well) and had a triangle on previous logo.<br>
      Do you think I should take another direction (I’ve had a few before but none as solid), tweak it, redraw it? </p>
      <p>Suggestions on the positioning. As it is with the 4 versions I have I like nº 2 the most. Less static, and with a nice scale. However its still not there, and Im kinda stuck at this point.</p>
