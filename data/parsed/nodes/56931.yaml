    html: |-
      <p>I had to use a vector logo in Word once. It was a pain in the ass, and I ended up using a high res bitmap image instead. Google "vector MS Word" for more on the subject!</p>
      <p>You might want to consider creating a standalone pdf with empty text fields to be filled in by your client. It can be done quite easily in Acrobat Pro, but you have to stick to fonts installed on the clients computer (if I remember correctly).</p>
