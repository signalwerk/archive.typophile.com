  html: |-
    <p>Help.<br>
    I need to create a Business Card template in MS Word for my clients.</p>
    <p>I need the  logo to be a scalable vector (like the clipart)</p>
    <p>How do I convert my Illustrator Logo into a clipart which I can use in Microsoft Office Word?</p>
