    html: |-
      <p>Windows WMF and EMF are vector formats. Just copy your Illustrator logo to the clipboard, and then in Word, select Edit &gt; Paste Special &gt; Picture (Enhanced Metafile). If Enhanced Metafile isn't an option, choose Picture (Windows Metafile). If both are available, EMF is better.</p>
      <p>If you want to save the logo in .wmf or .emf format, there are any number of programs that will extract those formats from the clipboard.</p>
