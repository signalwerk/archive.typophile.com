      <p>I have to say this is very peculiar, John. Typography is fundamentally about consistency; and calligraphy was never about <em>wasting</em> time or money, so it has its own shortcuts that lead to inconsistency. The only reason early typography looked less consistent than <em>some</em> manuscript writing was simply because the technology was lousy at first. Furthermore: inconsistency in paper, ink, etc. applies to calligraphy just as much as it applies to typography; and good (read: consistent) typography also depends on one's skill and the time spent - you can take care to ink properly, you can avoid worn sorts, etc.</p>
      <p>But most of all, sending people who associate good (text) calligraphy with a font (which BTW is virtually everybody) back in time is completely pointless. What isn't pointless is realizing that even on Typophile there are people (including me) who had trouble figuring out this example was calligraphy before Frank spilled the beans.</p>
      <p>Something else: some years ago I took a calligraphy class and the instructor actually explicitly said that the highest compliment we would get is people thinking our work was from a font... Now, I'm not saying my instructor was omniscient, but especially when a professional calligrapher says that, there's something there.</p>
      <p>hhp</p>
