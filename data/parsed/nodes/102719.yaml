      <p><em>But there must be limits to how inconsistent things can get before what -I think- you're calling functionality is affected.</em></p>
      <p>Of course. But my point is that whatever those limits are the great majority of historical text production has been inconsistent, mostly within those limits, rather than consistent in its reproduction of individual letter shapes.</p>
      <p><em>The efficiency of typography is also tied to the fact that it takes less time to hit a key than write a letter by hand, not to mention that you can change your mind about things with near-zero cost.</em></p>
      <p>You are confusing typography and typing. Typing is an input method, and as an input method for type it is not much more than a hundred years old, so I don't think it is something that can be considered an inherent quality of typography. Again, consider the kind of document we're talking about: one off, prestigious, part of the theatre of monarchy. Even if calligraphy had not been the chosen method of text production, this was never something that was going to be typed up on a computer and output to a bubble-jet printer. Against the multiple processes of typesetting and printing such a text -- handset, mechanical or computer generated to polymer plate, setting up a press, testing papers, running multiple proofs, ammending ink, etc. -- hiring a scribe to write it seems to me at least reasonably competitive in terms of efficiency <em>for a single copy.</em></p>
      <p><em>Why did Demoed use Constantia instead of Frank's talents?</em></p>
      <p>I presume this was spec'd by the designer,  Jaap Drupsteen; Trudie Demoed was just the craftsperson. I don't know why Constantia specifically was chosen, but monumental caps have a quality that differs considerably from pen-made caps, and Drupsteen seems to have wanted that contrast between the gilded caps and the less monumental text. Also, I believe consistency is usually more difficult to achieve the larger the writing is, which is why big pieces of calligraphy tend to be more expressive than formal text production. Drupsteen evidently wanted consistency to be a characteristic of this document, part of its aesthetic, and used different text production methods to achieve that at different sizes.</p>
      <p><em>Any document that's meant for "regular" people...</em></p>
      <p>Pretty much by definition not a royal family!</p>
      <p><em>I'm saying it should break free of its long-dead role of being readable and realize its new role: Art. Calligraphy can really only be about personal expression now, where consistency is not a natural element.</em></p>
      <p>A huge proportion of calligraphy in the West has done exactly that, for a long time now, but there remains a rôle for scribes in producing certain kinds of formal documents whose purpose is to be readable, impersonal and not expressive. In the production of such documents, scribes exercise one of the skills that they spend a long time developing: the ability to reproduce fairly closely the characteristic letter shapes of the style they are writing. In Islamic calligraphy, this is precisely what is taught and certified in the <em>ijazah</em> system.</p>
      <p>Here's something for you to think about: if the Act of Abdication had been set in a font representing a similar style of letter, and this were put side-by-side with Frank's calligraphy, do you really think you wouldn't immediately see the difference? And don't you think that while appreciately the skill and beauty of the calligraphy you might think that the font was a bit naff, as overly calligraphic fonts often are?</p>
