      <p>Odd, where I am, the spelling naïve is common, but the spelling coöperative is so rare as to be almost non-existent.</p>
      <p>But as for the main debate in this thread: calligraphy is something that involves time, effort, and (if one is not doing it oneself) expense. Using a font that looks like handwriting is trivial. Thus, while consistency is a valued characteristic in calligraphy, <em>under current conditions</em>, whether those conditions came into being when Gutenberg invented the printing press, when Linn Boyd Benton applied the pantograph to typefounding, or when laser printers became available for home computer users... perfectly consistent calligraphy can now be mistaken for something of less value.</p>
      <p>That isn't a negation of the value of consistency in calligraphy, but it <em>is</em> a cruel paradox.</p>
      <p>And, come to think of it, it's also the perfect moment to bring William Morris (the handicraft movement, after all) into the mix.</p>
