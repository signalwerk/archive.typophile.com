      <p><em>Typography is fundamentally about consistency</em></p>
      <p>I don't think that statement can stand. Typography is fundamentally about efficiency, the fact that one can produce many copies of a text much more quickly by printing from type than one can by copying the text by hand. Consistency has never been a notable feature of typography until quite recently, because of the variables of the printing processes that I described above. You only need to start pulling older books of the shelves and looking at them closely to see just how much variation there is in the impression, in the relative wear of individual sorts, etc. Consistency improves with hot metal typesetting, which avoids the problem of worn sorts, and with rotary presses, but it isn't until photomechanical processes become widespread and letterpress is abandoned that consistency in letterform reproduction becomes quite high, affected mostly by variables in paper quality and presswork.</p>
      <p>Perhaps I need to be clear that I don't believe consistency of letterform reproduction is very important, and that it is primarily an aesthetic rather than functional concern, which is why it is a feature of the kind of formal document we're discussing here and of things like Torah scrolls: it is part of what characterises their formal aesthetic. The reason I don't think letterform consistency is functionally very important is that for most of the history of writing and typography it has not been the case, and yet people have happily and immersively read texts produced without such consistency. The evidence suggests that readerability has a fairly generous allowance for variation in the display of individual letters within a text. The period in which letters were consistently reproduced in printing has been quite short; the period in which they were consistently reproduced on screen is also now behind us, thanks to subpixel positioning and antialiasing that, rightly I think, puts a higher premium on consistency of spacing than consistency of letter display.</p>
      <p><em> inconsistency in paper, ink, etc. applies to calligraphy just as much as it applies to typography</em></p>
      <p>Note that I was specifically talking about formal scribes producing the kind of document we're talking about in this thread, so sort of thing over which a great deal of practice, planning and time would be spent, and for which as many variables as possible would be eliminated. Now, it would be possible to exact a parallel level of quality using typography and printing -- not the same quality, because the characteristics of type and calligraphy are not identical --, also with practice, planning and time, but there would be no point because the efficiency of typography is in the production of multiple copies, and it seldom makes sense to use type to produce a single copy of a document. It is not only more prestigious to hire a scribe, but also likely to take less time.</p>
      <p>I'm not suggesting that you or anyone else 'go back in time', I am pointing out that the confusion that you describe is due to the fact that most people have very little experience of formal manuscript text production, and hence don't really have a framework within which to understand what they're looking at. The idea that, because of this confusion, calligraphy should try to more obviously look less like typography seems to me like the idea that letterpress printing should draw attention to itself by being deeply impressed into thick rag paper, to which I know you object. Text should conform to the conventions and design of the document for which it is intended, regardless of the medium of its production. That is craft. The very excellent piece of  Michel D'anastasio's calligraphy to which you linked is a fine piece of art, but it has nothing to do with formal document production.</p>
      <p>BTW, Frank has a proposal in to talk about the design and production of the Act of Abdication at this year's ATypI in Amsterdam.</p>
