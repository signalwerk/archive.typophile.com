      <p>The writing in that document has much more of a typographic regularity than any ancient manuscript I've seen, in either Latin or Hebrew. Also I wonder about the point of it, though the skill is awesome. </p>
      <p>I'm reminded of the great cabinet maker James Krenov. He wrote that if he was going to do something by hand he was going to do it in a way that took advantage of the fact that he was doing it by hand. It would show the hand of an individual; the living soul who made it would shine through the final piece in a way it could not in any designed and machine mass-produced object. </p>
      <p>Another anecdote. A famous lettering artist was asked by a friend why he isn't asked by type design classes to give a talk. He answered, "Possibly because I hate type." His attitude was: if he could not personalize it, screw it. (He's never done a font.)</p>
      <p>So I think more expressive variation in the hand work would have been more appropriate, but perhaps that wasn't his brief.</p>
