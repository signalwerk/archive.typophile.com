    html: <p>For much of the history of printing, typography has struggled to come close to the quality of formal manuscript production. We tend to forget this, both because we don't spend enough time looking closely at older printed books and because most of us have never handled really top quality manuscripts. The consistency of letterform reproduction that we now associate with typography is a relatively recent phenomenon, the result of photographic plate making and offset lithography. Even a printer of John Baskerville's excellence, with his famous innovations in paper quality and impression, <a href="http://www.tiro.com/John/Baskerville-a.jpg" rel="nofollow">couldn't produce two identical letters <em>a</em> on the same page.</a> Printed letters are subject to many variables -- ink consistency and coverage, evenness of pressure, worn sorts, etc. -- while the letters produced by an experienced and practiced scribe are subject only to his skill and the amount of time he spends on the document. Formal scribes have always had the advantage of much better consistency of stroke density from carefully prepared inks, and much sharper, crisper letters on, typically, much higher quality, sized paper, vellum or other substrate. Typography has had the advantage of speed of reproduction and greater efficiency, <em>not greater consistency.</em> People who interpret a strongly consistent formal manuscript hand as 'looking like a font' should go and look at samples of such writing from before fonts existed.</p>
