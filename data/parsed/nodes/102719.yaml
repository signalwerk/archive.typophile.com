    html: |-
      <p>John, I can concede that typography is more about efficiency (and it a way that calligraphy isn't) than consistency, but consistency is nonetheless an inescapable part if its spirit. At least in contrast to typography, I feel calligraphy should <em>relish</em> its inherent human divergence. This is why, as much as I admire and even envy the talent, skill and training involved, calligraphy that people -including people attuned to letterforms mind you- have trouble distinguishing from typography bothers me on some level. Do note that script fonts bother me too on some level.  :-)</p>
      <p>{Added:<br>
      And most of all, I maintain that it's entirely safe to state that once typography figured itself out* it produced much more consistent results on average than the average manuscript work; and at its highest level (I mean even in the cold-metal age) it was more consistent than the most regular calligraphy. Frankly I find it pretty strange to contest that.</p>
      <p>* I mean technically; spiritually I think it's <em>still</em> living with its parents!<br>
      }</p>
      <blockquote><p>I don't believe consistency of letterform reproduction is very important, and that it is primarily an aesthetic rather than functional concern</p></blockquote>
      <p>But there must be limits to how inconsistent things can get before what -I think- you're calling functionality is affected. As there are also opportunities (I'm thinking of judiciously diverging boumas). But I don't know what the limits are, and I don't even know anybody who I think does know what the limits are.</p>
      <p>More importantly, I for one don't believe in separating functionality from aesthetics. <em>If</em> the "subvisible" inconsistency of calligraphy (which it seems you agree that these days is a given) makes the reader feel different (without realizing it*) that's part of functionality too. In fact without that there would be very little reason to make yet more text fonts! At least conventional ones...  :-)</p>
      <p>* If you do realize it, <em>then</em> it's probably more aesthetic than functional. Maybe. But anyway that's not immersive reading.</p>
      <blockquote><p>subpixel positioning and antialiasing that, rightly I think, puts a higher premium on consistency of spacing than consistency of letter display.</p></blockquote>
      <p>This is veering a bit off-topic, but: I agree that varying the rendering of a glyph slightly to avoid a large inconsistency in spacing is a good compromise. However it's not really a <em>necessary</em> compromise - you can in fact have both. How? By abandoning the illusion of WYSIWYG. We don't mention WYSIWYG much these days, but it still haunts us on dead trees.</p>
      <blockquote><p>the efficiency of typography is in the production of multiple copies</p></blockquote>
      <p>Not only. The efficiency of typography is also tied to the fact that it takes less time to hit a key than write a letter by hand, not to mention that you can change your mind about things with near-zero cost. Plus it looks much nicer for virtually anybody on the planet! This is why:</p>
      <blockquote><p>it seldom makes sense to use type to produce a single copy of a document. It is not only more prestigious to hire a scribe, but also likely to take less time.</p></blockquote>
      <p>?<br>
      People type things up, print them (without even saving the files) and post them in quite important places way more often than they handwrite things (or get things hand-written). The only kind of handwriting that takes less time is post-it notes to yourself that nobody else is forced to decipher.</p>
      <p>Hiring a scribe <em>is</em> more prestigious (in extreme cases like this) but there's no way it's more cost-effective. Case in point: why did Demoed use Constantia instead of Frank's talents?</p>
