    <p>I'd like to be able to say that my Constantia typeface had brought down the monarchy, but it did at least play a rôle in this week's transfer of royal power in the Netherlands. Here it is used for the gilded names in the official Act of Abdication by which Queen Beatrix ceded the throne to Prince Willem-Alexander. [Click image for full document.]</p>
    <p><a href="http://www.nrc.nl/wp-content/uploads/2013/04/ANP-23178448.jpg" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.nrc.nl/wp-content/uploads/2013/04/ANP-23178448.jpg" rel="nofollow"><img src="http://typophile.com/files/abdication_4762.png"></a></div><p></p>
    <p>The document was designed by Jaap Drupsteen, the calligraphy is by Frank Blokland, and the gilding by heraldist Trudie Demoed.</p>
