    <p>In this newsletter we have fonts from 2 CheapProFonts newcomers: Guillaume Séguin is a master of grunge fonts, and Vic Fieger is a very creative cartoonist - both have a great selection of fonts that I'm currently reworking to a professional and multilingual standard.<br>
    Please enjoy this bunch of recently released quality fonts - all available at our usual low price of only $10 each! :)</p>
    <p>Like the idea behind CheapProFonts? Like our selection of multilingual fonts? Like our friendly and reasonable licensing? Like us to inform you about every new font? Like us! :)<br>
    <a href="http://www.facebook.com/pages/CheapProFonts/216135682084/" title="http://www.facebook.com/pages/CheapProFonts/216135682084/">http://www.facebook.com/pages/CheapProFonts/216135682084/</a><br>
    Our Facebook page updates with every single release!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts-NEWS-10-03_5732.jpg"></div><p></p>
    <p>In this news release I present 13 fonts:<br>
    - a 4-face family from Kevin King<br>
    - 3 grunge fonts from Guillaume Séguin<br>
    - 1 handwriting from Kimberly Geswein<br>
    - 1 constructivist font from Vic Fieger<br>
    - 2 font family expansions from Levente Halmos<br>
    - and 2 picture fonts from Levente Halmos</p>
    <p>CheapProFonts is dedicated to supplying high-quality OpenType and TrueType fonts for setting "foreign" languages (languages requiring more than the basic A-Z characters) for professional Mac and Windows users.<br>
    Check our site (or Facebook) for constant new releases, and see you in the next newsletter!</p>
    <p>Roger S. Nelsson<br>
    --<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
