      <p>Whether or not 2 columns is more readable depends on the trim size. Since it’s a text book I’m guessing it’s at least 8 x 10 in which case 2 columns probably is best. You don’t want too many characters per line, but not too few either.</p>
      <p>However I’m not sure about Goudy for a medical text, it is such a warm friendly face. I might go for something simpler such as Adobe Caslon or Garamond or Minion, and then use a sans serif for the graphs and tables.</p>
