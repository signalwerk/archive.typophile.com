    html: |-
      <p>Since there is much from where to choose, I believe you should try to identify the personality of the written text and kind of speech, because there is much difference between setting text with Adobe Garamond and Swift, for instance. I usually choose body text between 9 and 11, with a difference of 2,5 or 3 pts leading, that is, 9,5/12pts. Beware of the proportion! Why 2 columns?<br>
      A very good setting can be achieved with Slimbach’s Minion 10x12,5pts with a 21 pica line length single column. It’s a elegant typeface and also quite condensed.<br>
      Did that help?</p>
