    html: |-
      <p>thanks everyone for your replies! Fayon looks great indeed; I particularly love its italics. As for New Standard -- this just how invaluable a few real people's advice is, compared to WhatTheFont, which didn't come up with New Standard even though it's in MyFonts' database. I'll go check out that Lenin edition you mentioned; I'm sure there's a few copies in Berlin's libraries...</p>
      <p>ITC Bodoni has been a long-time favorite of mine; in its category, it's probably the most accessible and reader-friendly face I've worked with so far.</p>
      <p>@Nick: I'm glad to hear »stroke value« mentioned by a pro, as I've always thought this is only what non-pros do (hoping to emulate good old ink squash). So I never even tried it, as I'm a non-pro myself, trying to avoid anything that's only done by non-pros :) ...are you suggesting this is a serious option, or even a standard procedure in book production? Same goes for the artificial »bold« feature found in font editors. Of course one could apply a tiny (vertical) bit of it, to fatten up the hairlines, but I can't imagine the results to look anything but awful -- I might be wrong though; maybe I'm just too old-fashioned...</p>
