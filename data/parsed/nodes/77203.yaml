    html: |-
      <p>Nils, I believe one should trust the judgement of one's own eyes, and experiment rather than operate blindly on someone else's principle, even if it is commonly held.</p>
      <p>I first used the Stroke feature to strengthen type when creating small caps in InD and Quark, for typefaces where there were none.<br>
      I combined it with adjustments to tracking and horizontal scaling.</p>
      <p>Cheating has been going on in typography for aeons: shaving metal type to squeeze in justification, for instance.</p>
      <p>I'm wary of faux bold, a little bit is OK, but the more it's used, the more "cleaning up" that needs to be done afterwards..</p>
      <p>"Stroke" is the basis of how type designers make "grades" and optical sizes.</p>
