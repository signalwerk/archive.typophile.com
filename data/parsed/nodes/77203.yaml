      <p>Series Nº 27 (Neo Didot) had a Cyrillic (‘Russian’) version. I don’t know when it was developed. A lot of books in USSR and world-wide were set in Neo Didot.<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123035630im_/http://typophile.com/files/1904_5589"></div><br>
      Neo Didot was so popular that around 1940 its Soviet clone was developed, Obyknovennaya Novaya Garnitura (‘Ordinary New Typeface’). It was custom-designed for the <a href="https://web.archive.org/web/20150123035630/http://www.rarete.ru/order.php?dname=book&amp;id=332" rel="nofollow">4th edition</a> of Lenin’s <em>Collected Works</em> (its 1st volume was printed in 1941, and the last one, 39th, in 1967). That typeface was later <a href="https://web.archive.org/web/20150123035630/http://www.gostedu.ru/26805.html" rel="nofollow">released for general use</a>. It is now offered in digital form by ParaType, under the name <a href="https://web.archive.org/web/20150123035630/http://www.paratype.com/pstore/fonts/New-Standard.htm" rel="nofollow">New Standard</a>.<p></p>
      <dl>
      <dt> </dt>
      <dd>The picture above comes from a Russian edition of Camille Flammarion’s <em>Petite astronomie</em> published in Berlin in 1922 (it was printed at Spamer Druckerei, in Leipzig).</dd>
      </dl>
