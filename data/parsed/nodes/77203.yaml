    <p>This is Monotype's "Neo-Didot", released in 1904 (IIRC). I've only seen it used once, in this wonderful 1985 edition of Lucian's stories and dialogues, produced by Franz Greno. </p>
    <p>As far as I know, this face hasn't been digitized yet, which is a shame, as the digital Didots currently available have a stroke contrast way too high to be useful for longer stretches of text...  </p>
    <p>best<br>
    Nils.</p>
    <p><img src="https://web.archive.org/web/20150123035630im_/http://lindenhayn.com/public/neodidot003sm.png"><img src="https://web.archive.org/web/20150123035630im_/http://lindenhayn.com/public/neodidot001sm.png"><img src="https://web.archive.org/web/20150123035630im_/http://lindenhayn.com/public/neodidot002sm.png"></p>
