      <p>Corita, yes!</p>
      <p>After I had read an article in Eye magazine a few years ago I found a boxed set (book and portfolio of prints) from 1968 in an antiquarian book store (with a webshop) located in San Francisco. — Sometimes I think the internet was invented for things like this. — Anyway, the prints were in perfect condition and the printing was excellent. We now keep six prints framed in our kitchen. </p>
      <p>I'm happy she once again attracts attention with the <em>Come alive</em> book.</p>
      <p>Although I'm not sure this qualifies as typographical art <em>per se</em> I find some of Ben Shahns posters typographically inspiring.<br>
      Here's a classic; <em>Passion of Sacco and Vanzetti</em>.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/shahn_3954.jpg"></div><p></p>
