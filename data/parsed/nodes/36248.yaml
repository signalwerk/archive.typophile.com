      <p>Look at any current hipster magazine for type/lettering based art. Or Sister Corita Kent. She was featured in a ANP Quarterly 3 issues ago, and now has a monograph, if you need a visual reference. You can still back order the magazine. Marian Bantjes is effing amazing, look her up. Also checkout the blog fecalface.com</p>
      <p>Or modern art from the Rauschenberg / Warhol era. Or Jenny Holzer and Barbara Kruger. Just do some research in a few art books and you are guaranteed to find something.</p>
      <p>Good luck,<br>
      Easton</p>
