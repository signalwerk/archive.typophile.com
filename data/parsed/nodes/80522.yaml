    html: |-
      <p>We're happy to work with your very fine lines and type at Slow Print Letterpress.<br>
      See <a href="http://www.slowprint.com/portfolio/letterpress-samples/P9240044.jpg" title="http://www.slowprint.com/portfolio/letterpress-samples/P9240044.jpg">http://www.slowprint.com/portfolio/letterpress-samples/P9240044.jpg</a> for example<br>
      Of course this was on expensive Copperplate Etching paper, which takes light inking perfectly.</p>
      <p>I'm a big fan of minimal inking on the press, and micrometer roller settings.</p>
      <p>Unfortunately, many designers expect letterpress to have the depression of a 35 ton weight (we can do that, but we don't like to) AND the density of 6-color litho AND the texture in the stock of a wool blanket.</p>
      <p>Assuming the designer/client understands the letterpress process, we will produce exceedingly fine impressions.</p>
      <p>Basic equation:  more texture in the stock =  more ink to get solids</p>
      <p>Therefore, if we prefer less ink (which we do) we must accept less solid coverage on textured stock. </p>
      <p>For type on white-ish stock, this is generally not a big problem, since even low coverage will be plenty for typical caption sized type. However, on larger sizes, there will be EITHER too much ink, or less than 'perfect' coverage.</p>
      <p>For those who understand, we will double-hit the larger solids, cutting away the small type from the form (this is photopolymer, of course) and running the sheets back through the Windmill to lay a second layer of ink in the larger areas. The Heidelberg Windmill is capable of pinpoint perfect registration. This technique was used with silver ink on black stock in this card: <a href="http://slowprint.com/sources/PC160082.jpg" title="http://slowprint.com/sources/PC160082.jpg">http://slowprint.com/sources/PC160082.jpg</a><br>
      Everything but the "Projekt, Inc." was cut away from the form and then the sheets were run a second time. There's a tiny bit of ink creep on the second impression in order to  cover. But the fine type is... fine, no?</p>
      <p>For those who don't understand and want them cheap and fast, there are plenty of other letterpress printers out there.</p>
      <p>Cheers!</p>
      <p>Peter</p>
      <p>slowprint.com</p>
