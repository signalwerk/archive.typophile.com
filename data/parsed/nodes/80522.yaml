      <p>Thank you all for your excellent input, it has really helped me along.</p>
      <p>I will have to get an updated version uploaded once I get home, but for what it's worth, I fixed the kerning, the tracking, and the placement is all meticulously measured now. After a few trial inkjet prints I think I have the text size at an optimal point taking into account a little dot gain.</p>
      <p>I removed "Tel" as well, as it didn't really make any sense in retrospect, and have gone with the +1 201 123 4567 advice. Looks much better. </p>
      <p>Also, Trevor, the font is Avenir... obviously a cousin of Futura but a little sexier IMO. Especially in the C, which is obviously important in this case. But I agree, I'm going with a cream paper tenatively.</p>
      <p>I got a quote for $150 for 1000. 100% cotton 110lb./300g. How's that price?</p>
