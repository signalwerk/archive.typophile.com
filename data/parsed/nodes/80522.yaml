      <p>There are other aspects of minimalism too that you're missing out on. Again because it is just the barest elements, you need to get those elements exactly right.</p>
      <p>The relative weights of the name and the title, for instance, feel off for me. The colour is too-uneven-or-not-uneven-enough, and the combination of the wide version of Avenir with the spaced-out regular emphasise precisely the differences between the two, when you're trying to achieve a cohesiveness.</p>
      <p>But my major problem is the spacing, the rhythm. Pay super-good attention to the composition, the margins, the optical look of the placements in relation to each other. The two lines in the center really jar for me because the rhythm is almost, but not quite, a whole line of small-type while space between the two - it makes it feel cramped and stilted in a way nudging the type up or down wouldn't.</p>
      <p>Cristopher Dean's granddad's card works well (besides the kerning issue) because the composition is so straightforward, with a clear top half and a coloured bottom half; because the typefaces gel better; and because the spacing is based on a much more thought-through, rigid grid.</p>
