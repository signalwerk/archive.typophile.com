      <p>BTW, Scalawag, my big concern with your piece is that you're only looking at the black bits, not at the white. Just moving the type around is just (ok, just once) rearranging the deck chairs on the Titanic (Sorry ;-) unless you are <em>using the type to arrange the white space</em>.</p>
      <p><code>The space between the chunks is far&nbsp;&nbsp;too&nbsp;&nbsp;obvious&nbsp;&nbsp;in my view. &nbsp; We don't&nbsp;&nbsp;speak&nbsp;&nbsp;with&nbsp;&nbsp;big&nbsp;&nbsp;pauses, eh?</code></p>
      <p>When you start seeing the relationships of the white space, things like optical centering and alignment become simple. Painfully obvious, in fact ;-)</p>
