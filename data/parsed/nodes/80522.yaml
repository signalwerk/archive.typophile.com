    html: |-
      <p>Hi Chris, er, @dezcom...</p>
      <p>I don't double-hit all large solids. Lower contrast between the ink color and substrate will of course make this unnecessary. Also, it depends enormously on the stock itself.<br>
      The smoother the stock the less it's necessary. Also if I'm running on the Miehle Cylinder, it's possible to get better coverage (although the same equation still applies) due to the moving impression rather than the instant pressure of the platen.</p>
      <p>Regarding running two forms, it's far easier, given the perfect registration possible on the Windmill, to just run it through a second time after removing the lighter stuff from the plate (one reason I prefer plastic-backed polymer over the steel stuff!). Don't need to re-register to a second form, etc.</p>
      <p>The 'trapping' technique is still a good one, of course, but the main thing is trying to educate people to respect their materials and to understand the 'mechanickal art' in the process. I love the look of slightly under-inked type - because I see letters as individuals (as a type designer). Really, to me it's perfect if it's slightly under-inked. When printed on dampened stock, the coverage simply can not be better! See my Rudolf Koch piece.* </p>
      <p>But a graphic designer wants (reasonably) the whole piece to have visual power, which often means the subtle crispness of perfect inking must be slightly compromised to gain density. (on a textured stock, that is. On coated stock, it's all sharp and gorgeous and dense. But who wants a deep impression on coated stock? Yuck.)</p>
      <p>* <a href="http://typophile.com/node/66350" title="http://typophile.com/node/66350">http://typophile.com/node/66350</a> ("Pace" Hrant, I know we disagree on the depth of the impression, which on dampened stock is quite acceptable ;-)</p>
    html_clean: |-
