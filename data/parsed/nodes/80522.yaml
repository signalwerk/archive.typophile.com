      <p>Did someone say "minimalist letterpress business card?" A little late to the party, but I've got one! Bonus visualization of ink spread, though I am but an amateur printer.</p>
      <p>Printed version:</p><div class="imageWrap"><img src="http://typophile.com/files/marcychef_5067.jpg"></div><br>
      Slightly different digital mockup version:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/marcydigital_6564.jpg"></div><br>
      I think the bolder ink-spread improves the look, actually. This version was printed slightly deeper than kiss, but not as deep as is popular these days. I have a couple of flat-kissed versions which have retained more of the lightness of the second line.<p></p>
      <p>I personally think they're a little boring, but the client didn't go for my metal-type-and-vintage-copper-cut mockup...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/marcymixer_4882.jpg"></div><p></p>
      <p>She probably made the right call.</p>
