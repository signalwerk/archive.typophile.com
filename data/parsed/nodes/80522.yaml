  - id: 459444
    user: 3135
    date: 2011-04-09T13:40:00
    date_raw: 9 Apr 2011 — 1:40pm
    votes: null
    html: |-
      <p>Yes, I did see and play with a few NeXT workstations both at trade shows and in use.  I never owned one, too much money, but I sure loved Display PostScript and true Unix multitasking! My use of the machines was all in the design/publishing arena so the apps I saw were limited to a specific arena. It was like I have always coveted a Porsche 911 or even the old Speedster but knew it was only a dream to ever get one. The Unix workstation never came down to the price range of what people were willing t pay for the competitive DTP market.  Microsoft saw Unix as more of a threat to the straight business market outside of engineering and science and Apple's new leader  sure was not going to jump in and help his old boss prove he was smarter after all.  Steve Jobs did his usual brilliant job of hype at publishing conferences--I saw him at Seybold a few times and was impressed.</p>
      <p>I might also ask if you have much direct experience working for large organizations or corporations and getting agreement on corporate identity materials?  Rand was a master of this but even he knew when a done deal was a done deal by the boardroom Brooks Bros suit guys.  Rand always made a very logical and thought out book to present a logo.  After seeing his books for IBM, Westinghouse, and even his wayward attempt with Ford Motors, I can't imagine any remote chance of the usual flippant, ad jockey whipped out quickie being even a conversation with him.  Jobs loved Rand and what he stood for as a designer.  rand was surprised to get the call from such a young gun like Steve but was glad to go beyond the mammoth IBM mega-bureaucracy in the high-tech market.<br>
      I am sure we can differ on our opinion of what landed on the cube but you have to give Rand the credit he is due for creation of the corporate identity as a must for any operation worth its salt.</p>
