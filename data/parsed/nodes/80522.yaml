    html: <p>If you want to do minimalist, read Zen and the Art of Archery.  To many people minimalism is just things that are sparse, simple, or uncluttered. That is just a vague surface.  When you limit yourself to very few elements, each one and its relationship to the next is extremely and specifically important.  It is much easier to send a huge unabridged dictionary.  It is another to extract from it just the exact words to be a poem.  I think you must first ask yourself, "Are you REALLY a minimalist" or do you just admire that kind of work? If you are attempting to indicate to a client base that this is who you are, then truth in advertising would mean you had to actually be? If you truly are, then it will just happen when you work. It is not a snap-on aesthetic.</p>
