      <p>Minimalism is about choosing the fewest pieces necessary and using them in the most considered possible way.</p>
      <p>You put your name and title in the middle and the two other details in the corners. I agree that it is "templatey". You're spreading yourself out for no reason, and not creating a simple visual flow between the elements.</p>
      <p>Try minimizing the "footprint" of your text. Group it, create a vertical axis that aligns them all. Paul Rand's card is classy because it is one font, in one weight, and he leads your eye down a single path. On that path you see things in the order he has chosen for you: name, address, telephone number. When your eye jumps to the left (because he breaks his vertical axis) it sees the company name, not something about him. See what I mean?</p>
      <p>Minimalism is my favourite thing. When you reduce your card into its bare components, you have to be extra considerate about the fundamental properties: alignment, size, weight, contrast, etc.</p>
      <p>Also, don't you need an email address? I think in today's market you could get away with a card that said: </p>
      <p><a href="mailto:first.last@yourURLInADifferentWeight.com">first.last@yourURLInADifferentWeight.com</a></p>
      <p>...and nothing else.</p>
