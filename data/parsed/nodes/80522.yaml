      <p>A bit late for the discussion, but</p>
      <p>&gt; And of course there was the nice little box he designed for NeXT...</p>
      <p>I personally think NeXT logo is awful (and the 30+ page manuscript that explains why the box needs to be turned 28 (?) degrees is just full of itself).</p>
      <p>In fact, I don't know a single person who actually used NeXT machines and liked the logo. NeXTs were truly incredible for their time and the logo did not do them <em>any</em> justice whatsoever. It looked foreign, like something hastily slapped on a otherwise exceptionally polished and elegant piece of computer machinery.</p>
