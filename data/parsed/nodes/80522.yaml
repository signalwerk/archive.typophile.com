      <p>Don't take it the wrong way, but the card looks rather dull. It <em>is</em> minimalistic, but it is forgettable. It lacks the A-HA moment. At the very least I'd consider alternative layouts. </p>
      <p>Without implying that these are any better, here are some options I sketched for my card some time ago:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/layouts_3715.png"></div><p></p>
      <p><code></code></p>
      <p>Perhaps look at two-sided (black/white) stock, or sandwiched stock. Or do a blind press of something on a back of the card. Or die-cut corners with a very small radius (1 mm or thereabouts). Or add a quirk to the actual card content, e.g. say you are a "professional creative"... Something to stand out. But in a subtle, minimalistic way :)</p>
      <p>Also, I would advise against going with the letterpress. </p>
      <p>For one there's something called dot gain - an effect of finer details coming out far heavier and coarse than they are in the design. This can be accommodated of course, assuming the printer knows his stuff (Mandate Press, for example, does not). </p>
      <p>For two, the delicate appearance, which is frequently what one wants with a minimalist card, is not exactly compatible with the letter press. If you haven't done it already, go out and physically look at the finest possible letterpress you can find. Letterpress photos found online are <em>extremely</em> misleading. The shots are made from that exact angle that makes the piece looks great, but from other angles it may look crude and heavy. You can probably tell that I got burnt by this. So here's my $250 (+tax +s/h +sneaky-ups-charges) advise - do look at physical samples first.</p>
      <p>Also, have a look at (intaglio) engraving as an alternative. The printed part has a texture similar to that of thermo print (which is said to be a poor's man engraving), but it allows for much finer detail. I did a run of white on black cards few years back and they came out really impressive (<a href="http://www.flickr.com/photos/37230902@N04/3429442086/sizes/l/in/photostream" rel="nofollow">here is a close-up</a>).</p>
      <p>Yet another option appears to be silk-screening, however I only saw a sample of a card made with it on Flickr (with a macro close-up) and it looked very precise. I asked around and that appears to be a European specialty. I couldn't find any silk-screener in Canada capable of reproducing that card.</p>
      <p>Lastly, for the design inspiration swing by business card related groups on Flickr. There's plenty of junk there, but lots and lots of really good ones too.</p>
