    html: <p>Dot gain is a function of half-tone dots gaining weight due to inking and blanket pressure during printing. The same phenomenon happens with type, the smaller and lighter, the more noticeable. There are no dots but the name that is more accurate for solid type is "Press Gain" or "ink spread".</p>
