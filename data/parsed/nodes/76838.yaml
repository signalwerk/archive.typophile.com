    html: |-
      <p>David, </p>
      <p>I'm only exposing what's in the OS. No magic :) </p>
      <p>Rob, </p>
      <p>the black-and-white rendering does indeed use hinting to its full extent. It's switching to the "old" Apple TrueType rasterizer. Verdana and Georgia render pretty much identically to what they look like on Windows. There may be minimal differences due to some potential differences in how Apple and Microsoft treats some instructions, but really really minimal. </p>
      <p>Actually, I was rather surprised that the CSS -webkit-font-smoothing:none property (which my tool simply applies to the "body" element of the HTML page -- there is no magic involved) works, and what results it delivers. I did not know that hinted TrueType display is possible in modern Cocoa apps, but well -- it seems that it works. </p>
      <p>As I explained in the Typographica thread, I do not consider the tool an "ultimate solution", more a little helper that helps the lazy Mac user who does not own a Windows license to get a peek at what Windows rendering with ClearType disabled might look like. </p>
      <p>Best,<br>
      Adam</p>
