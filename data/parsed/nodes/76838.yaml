      <p>Apropos of quick checks, on Windows, Safari for Win has several rendering modes available in its Preferences that I find handy until bouncing a font over to the MAC for a native look-see.</p>
      <p>The changes are immediate. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/safari-rendering-prefs_3427.jpg"></div><p></p>
      <p>One other solution, short of multiple machines, is VMWare or Parallels running XP or Win7, or Ubuntu, for that matter. They can all run in virtual machines on the Mac.</p>
