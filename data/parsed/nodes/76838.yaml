      <p>The pixel outerform of a TT glyph as it's hinted to appear onscreen doesn't look like it's outlines, either. Yet there is a relationship. One thing can tell you things about the other once you become familiar with that relationship.</p>
      <p>I find printing to a PDF and viewing the font in that helpful, too. That isn't native to any OS, either.</p>
      <p>To each their own.<br>
      But sooner or later you DO need to look at it in its native environ and not some gif screenshot.<br>
      Unfortunately, this is becoming a very expensive proposition. A major problem.</p>
