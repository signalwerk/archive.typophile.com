  html: |-
    <p>A bit of shameless self-promotion: I’ve just written a small <strong>extension for Google Chrome for Mac OS X</strong> that can aid Mac users to select webfonts that work well on Windows. It’s called <strong>Crisp Text</strong> and installs a button in Google Chrome that allows the user to toggle the text rendering on any web page between unhinted antialiased (the Mac default display) and hinted black-and-white (which is what Windows users will see with smoothing turned off).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Crisp-Text_6075.png"></div><p></p>
    <p>It works well with webfonts, so you can navigate to any webfont-offering service that uses live webfont previews and check the screen quality in the crudest of all environments (black-and-white aliased).</p>
    <p>It’s a one-click install at the <strong><a href="https://chrome.google.com/extensions/detail/ifijlgjpdgojmjphpleniimbgbkbpedo" rel="nofollow">Google Chrome extensions</a></strong> page (visit the link with Google Chrome, then click on Install). </p>
    <p>After installation, you'll see a small icon:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/icon-16_5372.png"></div><br>
    next to the Chrome address bar. Clicking on it will turn font antialiasing off and on again. The extension is not perfect (you need to click twice on the button sometimes, and you need to activate the black-and-white rendering on every page), but it works well. <p></p>
    <p>It only works on Google Chrome for Mac OS X. Windows users should use the system-wide font antialiasing switch (in Control Panel / Display). </p>
    <p>Enjoy,<br>
    Adam</p>
