      <p><a href="http://www.fontshop.com/fonts/downloads/shinntype/figgins_sans_family/">Figgins Sans</a> is based on the birth of the sans, though it's a very personal interpretation. See the PDF on <a href="http://www.shinntype.com/figgins.html">Shinntype</a>.<br>
      <a href="http://new.myfonts.com/fonts/berthold/akzidenz-grotesk-be/?refby=typographica">Akzidenz Grotesk</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/monotype/monotype_grotesque_std_complete_vp/">Monotype Grotesque</a><br>
      <a href="http://www.fontshop.com/fontlist/families/rhode/">Rhode</a></p>
      <p>For a slab, <a href="http://www.fontshop.com/fontlist/families/giza/">Giza</a> or an <a href="http://www.fontshop.com/fonts/designer/the_fan_street_foundry/">early Clarendon</a> would be your best bet. Possibly <a href="http://www.fontshop.com/fonts/downloads/linotype/memphis_std_complete_vp/">Memphis</a> or <a href="http://www.fontshop.com/fonts/downloads/monotype/rockwell_std_complete_vp/">Rockwell</a>, though they are more 1930s.</p>
