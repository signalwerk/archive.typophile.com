      <p>I second the nomination of Nick Shinn's Modern Sans: it shares the construction of the English modern serif style.</p>
      <p>I'm impressed by the Victorian eclecticism of Jeremy's Trilogy types, but the sans doesn't fit the period and construction.</p>
