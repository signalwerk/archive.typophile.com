  html: <p>I'm killing myself trying to remember the name of a font. It's a slab serif, fairly squat and extended face that I have most often seen used for the word "stereo" on album covers from the 50s or 60s. <br> <br>You can picture it, can't you? But where can I find it? <br> <br>Thanks.</p>
