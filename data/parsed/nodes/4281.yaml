    html: <p>What if you made the 'o' a full letter, entirely in green?  <br> <br>I think if you really want the O as part of the identity mark, then it needs to be immediately recognizable. Even if you went to something with block letters that defined the O as negative space, you'd still be directly conveying the letter as opposed to suggesting it with the caret/hat.</p>
    html_clean: <p>What if you made the 'o' a full letter, entirely in green?  <br> <br>I think if you really want the O as part of the identity mark, then it needs to be immediately recognizable. Even if you went to something with block letters that defined the O as negative space, you'd still be directly conveying the letter as opposed to suggesting it with the caret/hat.</p>
