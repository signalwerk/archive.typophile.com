    html: <p>If you use a graphic image in a design it must mean something -- either immediately understood (in the millesecond you will get for recognition) or readily discovered, which is a pleasant experience for the viewer. The green roof doesn't explain itself and causes an awkward linkage between the m and h. I would advise substance over manipulation. You can't be faulted for explaining yourself in a clear, clean, and concise solution.</p>
