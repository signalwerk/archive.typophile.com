    html: <p>Hi Mads. Nice work. Reminds me a bit of Keedy's ol Jot face although they are not that similar, but I would guess design process is similar. It is excellent. H is very unique but fits well with rest of glyphs. A is a bit too angular, although form is very nice. Maybe P should have a tad bigger bowl... <br>Also alternates would be ideal so it does not look too computer generated when used.</p>
