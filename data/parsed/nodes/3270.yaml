    html: "<p>Mange tak Ole. You are definetly right about the alternatives. I'll have a second look on A and P as well. Though I'm glad that both of you are so positive towards it, I'm quite surprised that none of you comment on the X and Z.. <br>I'm thinking the X might be a bit 'too much'. Of course, this would be solved if there were and alternative without the curl. Also, the Z doesn't have quite the right curve yet, I think. <br>I've been told that the T, Y and M stands out because they are very straight-legged in proportion to the other glyphs. Personally I like that they are a bit 'quiet' in comparison to for example the X.  <br>Any thoughts on this? <br> <br>Also, Ole: do you have a link to Keedy's Jot face? Is it Keedy as in Jeffery Keedy? I've tried searching the board and Google, but haven't found anything. <br> <br>Mads <br> <br>ps. I keep getting an 'Internal Server' error and no upload-dialogue when I try to upload pictures to the board. Does anyone know how to solve this?</p>"
