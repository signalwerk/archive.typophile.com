    <p>brampitoyo and I have decided to start a font band. We will be hosting auditions for this online collaboration here on Typophile.</p>
    <p>Typical songs include the following hits:</p>
    <ul>
    <li>Baby, kern me closer to you</li>
    <li>(Yves) Peters, give me one more chance</li>
    <li>The Futura Is Now</li>
    <li>And much much more!</li>
    </ul>
    <p></p><div class="imageWrap"><img src="/files/Untitled-1_5601.gif"></div><p></p>
    <p>Both Bram and I play drums, guitar, bass, and we can sing a little too. We’re in need of the following:</p>
    <p>A flugelhorn<br>
    An Alpenhorn<br>
    A singerist<br>
    A manager<br>
    The other stuff in the smarmy little graphic above with the horrendous font<br>
    Etc., you name it!</p>
    <p>We’re also excepting lyricistical ideas and mumblings. Please feel free to submit a link to something. Anything really. As long as it is good. Or not. </p>
    <p>I live in Seattle, Bram lives in Portland, and you live? We’ll have to figure out the details later, but rest assured, we have the frontman straight from Typecon2007:</p>
    <p></p><div class="imageWrap"><img src="/files/20070428_0013_3564.jpg"></div><p></p>
