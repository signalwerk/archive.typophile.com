    html: |-
      <p>Armin Haab's _Lettera_ Vol 1 1959 [1954] has a high quality reproduction at pp. 82-83 of Jean Midolle's _Alphabet Lapidaire Monstre_ of 1834-35<br>
      It is also reproduced in Frederick W. Lambert's _Letter forms_ 1964 at p. 119<br>
      Today's Trivia: The bottom third of each letter includes surnames of famous men which begin with the  letter. Some of the people are obscure today, such Quinault, but others such as Goethe and Rabelais are still familar. Urban Outfitter used some of the letters on it's shopping bags in 2008.</p>
      <p>Don</p>
