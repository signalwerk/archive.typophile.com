      <p>What The Font identifies it as "Antenna Bold" by Font Bureau.</p>
      <p>If you're looking for a font with that lined shadow, it doesn't exist.  The shadow was produced by duplicating the finished words, applying the pattern, and applying some graphic layering.</p>
