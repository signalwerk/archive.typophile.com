    <p>Hi, Typophile!</p>
    <p>I'm updating a Flash file for a customer, but I don't have the font file. The font's name is Swiss 721 Cn BT, but what does Cn and BT stand for? I figure Cn means condensed, but BT? Could someone help me out with this, or even better... point me to the correct font on MyFonts? I'd love to buy it. :-)</p>
    <p>Thanks.</p>
