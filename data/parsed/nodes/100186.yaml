      <p>I printed out sample pages in several options I had at hand--Garamond, Georgia, Cambria, and PT Serif, and liked the latter best, though I'd still love to blend a little whimsy back in.</p>
      <p>Actually, the region in question is Dresden. The piece is written by Carlo Farina, a Mantuan, who was employed in Dresden at the time, and was printed by one Gimel Bergen (a Jr.; his grandfather apparently set out to name his progeny after the entire Hebrew alphabet, but didn't get far). It occurs to me it could be fun to try to find something--at least for headers, perhaps--inspired by Bergen's typeface; it can be seen <a class="freelinking external" href="http://digital.slub-dresden.de/werkansicht/dlf/823/5/cache.off" rel="nofollow">here,</a> with a few Roman words scattered among the Fraktur, or with lots of italics <a class="freelinking external" href="http://digital.slub-dresden.de/werkansicht/dlf/823/31/cache.off" rel="nofollow">on this page.</a></p>
