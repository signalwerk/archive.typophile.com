      <p>How about that! I grew up in that building and teach there now. However, my degree is coming from UNCG. I'm honored by your input; a little Googling turns up <em>bona fides</em> enough.</p>
      <p>Incidentally, there's a small section in this dissertation about seventeenth-century letterpress printing, although it's about the printing of music. Specifically how cutting-edge musical techniques pushed printers' abilities to represent practice in print. The printer in this case wound up hand-inking some notes because he wasn't equipped to print two pitches "stacked" on one staff ("double stops"). A Venetian contemporary managed it with a couple of other composers, but he seemed to be financially comfortable, because he cut entirely new characters for the occasion.</p>
