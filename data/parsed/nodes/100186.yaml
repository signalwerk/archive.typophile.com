    votes: null
    html: |-
      <blockquote><p>I suspect that the deficiencies in the Adobe version have to do with licensing issues.</p></blockquote>
      <p>The Adobe licensed versions of fonts for which they do not hold intellectual property rights, such as ITC Mendoza, remain fairly static within their collection, to the best of my knowledge. When licensing a font that has been sub-licensed by another foundry or developer, common practice during the heyday of Postscript in the late 80s, it is often worth doing some research around the available versions.</p>
      <p>A search for ITC Mendoza on MyFonts will bring up three distinct versions, ITC, Adobe and Monotype. The rights to most (if not all) ITC intellectual property now resides with Monotype and as such those two versions are effectively Monotype intellectual property and subject to update and change, whereas the Adobe version most likely has and will remain fairly static, and other than the update to OpenType is unlikely to have changed greatly since its Postscript Type 1 version.</p>
