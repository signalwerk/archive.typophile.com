      <p>Actually Garamond sounds too staid for the music you describe... Maybe a Fleischmann would be better, although it would be hard to translate its eclecticism to the screen.</p>
      <p>BTW a measure of 7" might be narrower that we're (sadly) used to seeing on a letter-size page, but it's not narrow in terms of good readability; in fact at 10 point it's probably too wide (so it's good you're using 11 - you could even go to 12 with something like Baskerville).</p>
      <p>Palatino: part of its problem is the x-height being too big - it's really not a bona fide text face. Try Aldus, its more bookish sister.</p>
      <p>But let me understand: you want something that can be mistaken for Time, but isn't Times?</p>
      <p>hhp</p>
