    <p>Forgive me if this question gets posted here all the time. I'm coming to the end of my dissertation for a DMA (Doctorate of Musical Arts), and it has come to my attention recently that apparently only squares and idiots use Times New Roman ever ever ever. I'd like to not be a square or idiot, but I also need something that (even I know this phrase is heard too often) "looks like Times New Roman." I.e. conservative, serif, doesn't draw attention to itself. Doesn't look clever or pretentious. I'd love to use Garamond, especially given that my dissertation is about a 1627 piece of music, but its italic Qs give me pause.</p>
    <p>Further, I'd like to not just be novel, but readable, especially on screen, since if anybody eventually reads this dissertation it will probably be electronically.</p>
    <p>Thanks for your time!</p>
