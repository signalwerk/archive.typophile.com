      <p>You have to be mindful of not engaging in design for its own sake: changing the font just so you can semi-privately gloat that you changed the font... Whatever typeface you choose, there has to be a rational reason why it's better than Times, even if confusability with Times is indeed a desirable parameter.</p>
      <p>That said, most laymen are shockingly insensitive to differences in fonts that we consider chasmic, at least consciously. I always fondly remember the story of the test subject in a legibility study being asked to compare Georgia to some other serif font, and saying something like "This Times looks bigger than that Times."  :-)</p>
      <p>And this can extend beyond laymen as well. I remember the first time I made a high-quality output of my Patria* at a service bureau, I eagerly asked the owner what she thought of it: she felt a little bit put on the spot, because she confessed to thinking it wasn't much different than Times... And I almost hugged her, because that's exactly the sort of <em>conscious</em> evaluation a text face designer wants to hear.</p>
      <p>* <a href="http://themicrofoundry.com/ad/CR.pdf" title="http://themicrofoundry.com/ad/CR.pdf">http://themicrofoundry.com/ad/CR.pdf</a></p>
      <p>Ergo: You have more freedom on this than you might think.</p>
      <p>hhp</p>
