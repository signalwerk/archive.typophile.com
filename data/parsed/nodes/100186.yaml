      <p>The piece is Carlo Farina's <em>Capriccio Stravagante</em>, which uses violin-family instruments to imitate things like trumpets, shawms, hurdy-gurdies, cats and dogs.</p>
      <p>I should also mention that the official formatting instructions, while leaving it open to "an appropriate typeface," also specify margins of 1.5 inch top and 1.5 left (1 right and bottom), which makes for a narrower than usual page, and "a 10 pt minimum for the text." Right now I'm using 11 pt for body and 10 pt for footnotes.</p>
      <p>Also that of course free is good, and that I've tried Lido STF, and for whatever reason it just does not render well on my screen at 11 pt and 88% document size! Near illegible.</p>
      <p>My Garamond just says "Garamond." It's not something I paid for, so either standard with Win 7 or Office Pro 2010. It's not the italic Q <em>per se</em>, though that's what I noticed most. It's just that I don't want anybody saying, "Hey, this isn't TNR, is it?" Plus, although I'm a sucker for extremely overt faces (as an early music person I make heavy use of Chapbook), for my money Garamond isn't as screen-friendly as TNR. Oh, and maybe it's just because I used it a lot in undergrad, but for some reason Palatino feels amateurish to me.</p>
      <p>Thanks for the Brill tip; I'll try that out.</p>
