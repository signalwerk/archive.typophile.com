      <p>For what is worth, I used Sabon for my dissertation. I was happy with the end result. I also used Gill Sans as a partner sans serif for the main headers and captions. </p>
      <p>Although, you would probably look for something you can actually download and use i.e. a free licence one? Check out font squirrel in that case: <a href="http://www.fontsquirrel.com/fonts/list/style/Serif/50/" title="http://www.fontsquirrel.com/fonts/list/style/Serif/50/">http://www.fontsquirrel.com/fonts/list/style/Serif/50/</a><br>
      there are a huge amount of 'silly' ones and ones unfit for proper body text typesetting, but worth a look.</p>
