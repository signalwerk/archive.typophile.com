    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Karlgeorg Hoefer</strong></p>
    <p>1914–2000<br>
    German<br>
    <a href="http://www.kghoefer.de/English/E_index.html" rel="nofollow">kghoefer.de</a><br>
    <a href="http://www.linotype.com/7-435-7-12899/karlgeorghoefer.html" rel="nofollow">Profile at Linotype.com</a></p>
    <p>Karlgeorg Hoefer was one of the foremost German calligraphers of the 20th Century. He taught at the <a href="/wiki/HfG%20Offenbach" class="freelinking" rel="nofollow">HfG Offenbach</a> from 1947 through 1979. During the 1980s, he founded the <a href="/wiki/Schreibwerkstatt%20Offenbach" class="freelinking" rel="nofollow">Schreibwerkstatt Offenbach</a> (Calligraphy Workshop Offenbach), which organized calligraphy lessons, workshops, and exhibitions for the general public. This is very closely alligned with the <a href="/wiki/Klingspor%20Museum" class="freelinking" rel="nofollow">Klingspor Museum</a>.</p>
    <p>Hoefer designed many typefaces throughout his career. His first typeface was <a href="/wiki/Salto" class="freelinking" rel="nofollow">Salto</a>, which was published by the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry during the early 1950s. He would later design typefaces for <a href="/wiki/Ludwig%20and%20Mayer" class="freelinking" rel="nofollow">Ludwig and Mayer</a>, <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a>, and <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a>. <a href="/wiki/FE%20Engschrift" class="freelinking" rel="nofollow">FE Engschrift</a>, the font from which German license plates are made, is based off of one of Hoefer's lettering experiments from the 1970s.</p>
    <p>One of Hoefer's sons, <a href="/wiki/Otmar%20Hoefer" class="freelinking" rel="nofollow">Otmar Hoefer</a>, followed his father into the printing industry, and today is the Product Marketing Director at <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a>.</p>
