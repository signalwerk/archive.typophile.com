    <p>Hello everyone,</p>
    <p>I'm looking for a typeface with these features:</p>
    <p>- square dots</p>
    <p>- base shape for curves: circle</p>
    <p>- weights from ultra-thin to bold/black</p>
    <p>currently the only one which satisfied these criteria is Gotham by Hoefler.</p>
    <p>Please help me!</p>
    <p>Thanks!</p>
