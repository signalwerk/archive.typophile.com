  html: <p>Is there a term for typefaces such as <a class="freelinking external" href="http://www.blambot.com/font_wizardspeak.shtml" rel="nofollow">Wizardspeak</a> from Blambot, or their acclaimed Lovecraft's Diary (no longer available from them, unfortunately, even if, presumably in violation of the license, it's floating around a lot of the free font sites), or the Cthulhu Runes font by <a class="freelinking external" href="http://moorstation.org/typoasis/designers/omega/omega.htm" rel="nofollow">Omega Font Labs</a> and so on and so forth?</p>
