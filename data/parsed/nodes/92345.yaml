    html: |-
      <p>I might say these sorts of fonts are more of a <em>faux</em> con-script as their main purpose is to <em>look</em> like an alien language, which works just as well if you mash your keyboard for nonsense.<br>
      While you can use them as a substitution cipher for English (or whatever language of the Latin alphabet is that of the writer and/or reader), which is <em>technically</em> an English con-script and allows readers to decode it, the intent is still to represent in its fictional framework a language which is not English and does not sound like English when spoken aloud.</p>
      <p>You can see that the Blambot site categorizes them as symbol fonts. This might seem like throwing two categories together for convenience, but it's hard to say there's a clear line to be drawn: I've seen Wingdings used in comics to represent an unknown language.</p>
