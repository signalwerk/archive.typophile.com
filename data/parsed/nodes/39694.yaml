      <p>Hello Hanno,<br>
      Freight Sans has alternative glyphs for g and a, according to the <a href="http://www.joshuadarden.com/shop/freightsans.pdf" rel="nofollow">PDF specimen</a>. Maybe there’s an alternate ß for Freight Text, too, though it doesn’t appear in the <a href="http://www.joshuadarden.com/shop/freighttext_charset.php" rel="nofollow">character set</a>. Then, the alternate Sans glyphs <a href="http://www.joshuadarden.com/shop/freightsans_charset.php" rel="nofollow">don’t appear there</a> either. I suggest contacting the foundry directly.</p>
      <p><cite>I’m afraid this otherwise great font not is suitable for german language without one.</cite><br>
      I agree. This form is only suitable in an historic context.<br>
      If a type designer wants to include ſs, then the best way to go would be to do it like in <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_meta_serif_pro_book/" rel="nofollow">Meta Serif Pro</a>: as linked alternates, with ß as default.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ss-alternates_5479.png"></div><br>
      F<p></p>
