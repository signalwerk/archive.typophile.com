      <p>Hi Adam,</p>
      <p><cite>Well, ſs is not ß, […] Those letters have lost their original ligation contexts centuries ago</cite></p>
      <p>Well, I agree – partly. The ß – as a ‘real’, discrete letter, not just a ligature – <em>in Latin script</em> (i.e. ‘Antiqua’, not ‘Gebrochene Schrift’) is quite young. So, in this case, not centur<strong>ies</strong>, but rather only one or one and a half …&nbsp;;°)</p>
      <p>Have a look at this book, picked from what Google has to offer from that period (of course, most of the German books then still were set in Fraktur):<br>
      Jacob Grimm: Deutsche Mythologie. Göttingen: Dieterichsche Buchhandlung, 1854. (p. VI)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/grimm-m_4478.png"></div><p></p>
      <ul>
      <li>einfluſs — present day spelling: Einfluss — before the 1996 reform: Einfluß</li>
      <li>bloſser — present day spelling: bloßer</li>
      <li>heiſse — present day spelling: heiße</li>
      <li>daſs — present day spelling: dass — before the 1996 reform: daß</li>
      </ul>
      <p>Given this situation, I consider putting ſs (and ss) as an alternate of ß very helpful.<br>
      Cheers, F</p>
