      <p>Well, ſs is not ß, just like ü is not an u with a superscripted e and ç is not a c with a subscripted Ʒ. Those letters have lost their original ligation contexts centuries ago. If Joshua designed ß like ſs, it is an obvious error -- I would contact the designer and complain. </p>
      <p>I also don't see a huge practical point of putting ſs as an alternate of ß, let alone putting it in the font if there is no physical ligation. If anyone wants ſs, he will type in ſs. If one chooses to make a "longs_s" aka "uni017F0073" glyph after all, he might consider associating it with ß in the "hist" feature. </p>
      <p>A.</p>
