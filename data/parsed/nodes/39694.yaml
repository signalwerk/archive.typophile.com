    <p>Hello everybody,</p>
    <p>has anybody out there used Joshua Darden's Freight for German language? I've considered it for several projects now, but I think because of the germandbls it's pretty much unusable. I understand the thought behind it (long s + normal s = double s) and also like it aesthetically, but no one I tested it on could actually read it. At least not without thinking about it for a while.<br>
    For anyone who doesn't know what I'm talking about, I took a screenshot from Joshua Darden's homepage.</p>
    <p>Is there an alternative??? I'm afraid this otherwise great font not is suitable for german language without one.</p><div class="imageWrap"><img src="http://typophile.com/files/freight_6035.jpg"></div><p></p>
