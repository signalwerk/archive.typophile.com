    <p>Is there any way of fixing this? I want to make the text selection box the same size as it is on Fontlab, covering just one line but for some reason it gets way too big when I use the font, what dictates it's size? The values I input on the Key Dimensions? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/probfont_3891.jpg"></div><p></p>
    <p>The left G is what I get on Illustrator, the right G is what I get on Fontlab (which is what I intend).</p>
    <p>Any suggestions? </p>
    <p>Thanks</p>
