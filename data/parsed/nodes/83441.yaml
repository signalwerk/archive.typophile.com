      <p>I believe the FDA is on record as permitting drug warning disclaimers in magazine ads (as opposed to such warnings in prescription bottles) to use any clear and legible font that's at least 8 point. The FDA's formal typography standards are posted online at:  </p>
      <p><a href="http://www.gpo.gov/fdsys/pkg/FR-1999-03-17/pdf/99-6296.pdf" title="www.gpo.gov/fdsys/pkg/FR-1999-03-17/pdf/99-6296.pdf">www.gpo.gov/fdsys/pkg/FR-1999-03-17/pdf/99-6296.pdf</a></p>
