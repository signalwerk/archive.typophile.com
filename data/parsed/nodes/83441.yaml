    html: |-
      <p>I'm a graphic designer and one of my clients is a large pharmaceutical company. I've never done a magazine ad for them, but based on my general experiences working with them my guess is that a manager either said:  1) "regulators require that we do it this way", or else 2) "regulators have approved disclaimers done this way so let's not try something different".</p>
      <p>If a certain font and point size has been approved by regulators in the past, they'll play it safe and stick with those specs.</p>
