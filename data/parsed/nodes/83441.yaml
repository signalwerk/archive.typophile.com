  html: <p>It seems that magazine ads for trademarked drugs are always accompanied by a page or two of legal boilerplate that's set in Arial or Times New Roman. All the medical qualifications and patient warnings are no doubt required as protection against potential lawsuits, and not intended to promote reading, but I wonder if there's a marketing psychology when wealthy drug companies use a PC system font in their magazine ads. Do you think the reliance on PC system fonts is mostly to discourage reading of the legal boilerplate or is it equally designed to suggest the drug companies are just plain folks who stick to the fonts already installed on their computers? My personal assumption is the latter.</p>
