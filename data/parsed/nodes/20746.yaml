    html: |-
      <p>Thanks very much! There's nothing on the colophon. But I put Gerald's and Cromy's comments together and managed to figure it out. There's no 'Bold Face Outline' but this did ring a bell with an article I read on the publisher a while ago. Cromy's clue provided the final link - I managed to unearth a copy of the Monotype Printing Types Specimen Book. The type in question is Monotype Old Style Bold Outline 176. See image attached with great many thanks for all the help!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/oldstyle001_5467.jpg"></div><p></p>
