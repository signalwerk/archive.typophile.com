  html: |-
    <p>I need some help identifying the typeface which the book's title—'Woods beyond a cornfield-is set in. The book was printed by hand letterpress in London, in 1979 and I know the printer-publisher used mainly Monotype or special Foundry typefaces. Any help (and info on the typeface if possible) would be GREATLY appreciated! Thanks in advance!</p>
