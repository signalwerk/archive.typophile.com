    date_raw: 11 May 2004 — 1:58am
    votes: null
    html: "<p>I do not see why the logo needs in any way to \"enact\" a pulse. It says pulse already, to anyone who can read. Anyone who does not \"get\" pulse from the word \"pulse\" is missing something pretty basic. I suspect that most attempts to embody some sort of pulsing in the logo will either (a) be so obvious they look ghastly (the heart monitor) or (b) be so subtle they are irrelevant or (c) introduce unwarranted associations (as I think the \"musical\" logos do). <br> <br>Nor can I see, with respect, why one has to get <i>design</i> from the logo. The logo will not be used in a vacuum, and presumably it will be obvious from what is around it that design is what it is about. <br> <br>It seems to me to be perfectly credible and indeed creditable that the logo, rather than saying <i>design</i> tells people who already know that they are dealing with a design company <i>what sort</i> of design they can expect: what its aesthetic tendency is. If the original logo does that, then I'd stick with the original. <br> <br>The associations I'd get from the original are: spare, clean (super clean), perhaps a little bland, conservative (in a modernist sense), understated, heavily typographical. This is the sort of design I'd want for the annual report of a pharmaceutical company, not for a rock album cover. <br> <br>If those are the right associations, then the logo is working. If they're not then (for me) it's not. For instance, if you wanted to project playfulness, or political commitment, or a sense of being at the bleeding edge, the logo does not do that for me.</p>"
