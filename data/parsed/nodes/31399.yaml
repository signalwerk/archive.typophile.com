      <p>I have edited my basque list, because I misplaced JEEP in double J, instead of being in final P. It is corrected now.</p>
      <p>I have completed the most part of the list myself, and searched for difficult or loan words in an online <a href="http://www1.euskadi.net/hizt_el/indice_e.htm">basque/spanish dictionary</a>, plus another <a href="//www.euskaracorpusa.net/XXmendea/Konts_arrunta_fr.html">webpage</a> searching basque texts from the 20th century.</p>
      <p>The eki resource gives also Ç and Ü as characters needed to write basque. However, it seems to be an error there:</p>
      <p><cite>c, q, v, w, y only occur in foreign words and are not considered part of the alphabet.</cite></p>
      <p>As they are needed to write foreign words, they are considered part of the basque alphapet (noted by the <a href="http://www.euskaltzaindia.net/arauak/dok/ProNor0017.htm">Academy of Basque Language</a>).</p>
      <p>Ü is never used in standard basque (it has been historically used to represent a sound from a specific dialect, non existent in the so-called "unified basque"). Ç is considered as a variant of C, and following the online dictionary it only appears in the loan word "curaçao".</p>
      <p>I truly like the idea of maintaining this list as a freely distributed shared resource.</p>
