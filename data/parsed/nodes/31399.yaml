      <p>Well, I originally meant it to use greater-than and less-than signs, but apparently the forum backend was eating ’em, interpretting them as HTML mark-ups.  I decided to go with open-bracket for a prime letter, and close bracket for a terminal letter.  Hyphen is for a medial letter, and 2 for a double letter. Hence</p>
      <p>[ prime<br>
      - medial<br>
      2 double<br>
      ] terminal</p>
      <p>I could probably have come up with something snazzier but I was lazy :)</p>
