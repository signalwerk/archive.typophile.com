    <p><strong>The Languages we already have are now compiled into two documents -  a .txt file and a reference PDF version. This is version 1.2</strong></p>
    <p>You can download the PDF &amp; txt at the bottom of this post. There is also an RTF file but Typophile does not support posting that file type. If you want that contact me &amp; I will email it to you.</p>
    <p>Last Updated: October 18, 2007</p>
    <p><strong>Please help the project: It's fun, quick &amp; kinda cool!</strong></p>
    <p>Please use the the downloadable files as a guide for adding languages or improving the ones we already have.</p>
    <p><cite>Langauages we still need include:</cite></p>
    <p>- Afrikaans<br>
    - Albanian<br>
    - Azeri<br>
    - Croatian<br>
    - Estonian<br>
    - Hausa<br>
    - Indonesian<br>
    - Latvian<br>
    - Lithuanian<br>
    - Malaysian<br>
    - Romanian<br>
    - Tagalog,<br>
    - Yoruba, and others.</p>
    <p><cite>Languages that are seemingly complete include*:</cite></p>
    <p>- Basque<br>
    - Latin<br>
    - Danish<br>
    - Dutch<br>
    - English<br>
    - Finnish<br>
    - French<br>
    - German<br>
    - Hungarian<br>
    - Icelandic<br>
    - Italian<br>
    - Lingala<br>
    - Norwegian<br>
    - Polish<br>
    - Portuguese<br>
    - Slovenian<br>
    - Spanish<br>
    - Swahili<br>
    - Swedish<br>
    - Turkish</p>
    <p>Thanks!</p>
