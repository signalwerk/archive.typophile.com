      <p>I'm surprised nobody has done Latin yet; perhaps there's a shortage of native speakers here :) Rather than wait for a native speaker to show up, I threw this list together. Some notes: in ancient Latin lettering, there is no J or W and U is the same letter as V. In modern publications, a distinction between U (vowel) and V (consonant) is often made, and in some modern publications, mostly older ones, a similar distinction is made between I (vowel) and J (consonant). Because the latter is mostly obsolete (more so than the Latin language in general), I have used the modern U/V distinction throughout but only used the modern I/J distinction for the J entries. Any U/V letter could potentially be set as either U or V, though. The letter K is not normally used in modern Latin except for a couple of special words, but it was sometimes used more in ancient Latin instead of C at the beginning of a word when followed by A. The letter W doesn't exist at all in Latin (though, just to confuse matters, that's how the V sound was pronounced before the first century AD). For letters that can't be doubled, I've included an example of single occurrence in the middle of a word.</p>
      <p>Diacritics are mostly not used, but in textbooks or dictionaries, A E I O U and rarely Y can have a macron or (less often used) a breve. In transcriptions of ancient inscriptions, A E O or U can have an apex (looks like an acute accent) and I can either have an apex or be taller than the other letters.</p>
      <p><em>Edit:</em> I've changed all U's in the all caps words to V's. This is because lower-case or mixed-case setting of Latin normally occurs in texts where U and V are usually differentiated by modern editors, whereas all cap setting is normally either copying inscriptions or pseudo-inscriptional and thus is more likely to follow ancient practice in not making the U/V distinction. I also added the missing forms of <em>chely</em>.</p>
      <p>A<br>
      ars, Ars, ARS<br>
      phraates, Phraates, PHRAATES [loan words only]<br>
      naufragia, Naufragia, NAVFRAGIA</p>
      <p>B<br>
      buxus, Buxus, BVXVS<br>
      subbrevis, Subbrevis, SVBBREVIS<br>
      ab, Ab, AB</p>
      <p>C<br>
      cattus, Cattus, CATTVS<br>
      vacca, Vacca, VACCA<br>
      hoc, Hoc, HOC</p>
      <p>D<br>
      damnatio, Damnatio, DAMNATIO<br>
      meddix, Meddix, MEDDIX<br>
      aliquid, Aliquid, ALIQVID</p>
      <p>E<br>
      eructamus, Eructamus, ERVCTAMVS<br>
      praeemptor, Praeemptor, PRAEEMPTOR<br>
      rete, Rete, RETE</p>
      <p>F<br>
      faenerator, Faenerator, FAENERATOR<br>
      officina, Officina, OFFICINA<br>
      [none except in abbreviations]</p>
      <p>G<br>
      glis, Glis, GLIS<br>
      agger, Agger, AGGER<br>
      magog, Magog, MAGOG [loan words only]</p>
      <p>H<br>
      haruspex, Haruspex, HARVSPEX<br>
      traho, Traho, TRAHO [can't be doubled]<br>
      ioseph, Ioseph, IOSEPH [loan words only]</p>
      <p>I<br>
      ibidem, Ibidem, IBIDEM<br>
      piissimus, Piissimus, PIISSIMVS<br>
      latrunculi, Latrunculi, LATRVNCULI</p>
      <p>J* [see explanation above]<br>
      janus, Janus, IANVS [or JANUS]<br>
      major, Major, MAJOR [can't be doubled]<br>
      [none except in obsolete late medieval or early modern spellings]</p>
      <p>K [can only occur at the beginning of a word before the letter A]<br>
      kalendas, Kalendas, KALENDAS<br>
      [none]<br>
      [none]</p>
      <p>L<br>
      laena, Laena, LAENA<br>
      caballus, Caballus, CABALLVS<br>
      nihil, Nihil, NIHIL</p>
      <p>M<br>
      mel, Mel, MEL<br>
      commodus, Commodus, COMMODVS<br>
      enim, Enim, ENIM</p>
      <p>N<br>
      natalicia, Natalicia, NATALICIA<br>
      penna, Penna, PENNA<br>
      pan, Pan, PAN</p>
      <p>O<br>
      opusculum, Opusculum, OPVSCVLVM<br>
      laocoon, Laocoon, LAOCOON [loan words only]<br>
      mango, Mango, MANGO</p>
      <p>P<br>
      perna, Perna, PERNA<br>
      appius, Appius, APPIVS<br>
      [none except in abbreviations]</p>
      <p>Q<br>
      quingenaria, Quingenaria, QVINGENARIA<br>
      atque, Atque, ATQVE [can't be doubled]<br>
      [none except in abbreviations]</p>
      <p>R<br>
      rabidus, Rabidus, RABIDVS<br>
      terror, Terror, TERROR<br>
      per, Per, PER</p>
      <p>S<br>
      sic, Sic, SIC<br>
      passus, Passus, PASSVS<br>
      nummularius, Nummularius, NVMMVLARIVS</p>
      <p>T<br>
      transpadani, Transpadani, TRANSPADANI<br>
      battuere, Battuere, BATTVERE<br>
      et, Et, ET</p>
      <p>U* [see explanation above]<br>
      usucapio, Usucapio, VSVCAPIO [or USUCAPIO]<br>
      duumvir, Duumvir, DVVMVIR [or DUUMVIR]<br>
      cornu, Cornu, CORNV [or CORNU]</p>
      <p>V* [see explanation above]<br>
      volturnalia, Volturnalia, VOLTVRNALIA<br>
      avis, Avis, AVIS [can't be doubled in standard spelling except when using V for both V and U]<br>
      [none except when using V for both V and U]</p>
      <p>X<br>
      xiphias, Xiphias, XIPHIAS [loan words only]<br>
      axis, Axis, AXIS [can't be doubled]<br>
      rex, Rex, REX</p>
      <p>Y<br>
      [none in standard spelling but possible in nonstandard spellings of loan words]<br>
      hypocaustum, Hypocaustum, HYPOCAVSTVM [loan words only; can't be doubled]<br>
      chely, Chely, CHELY [only in rare loan words in the vocative case]</p>
      <p>Z<br>
      zodiacus, Zodiacus, ZODIACVS [loan words only]<br>
      rhazes, Rhazes, RHAZES [loan words only; can't be doubled]<br>
      [none]</p>
      <p>There are also assorted language-specific typographic arcana like the Claudian letters (an abortive attempt to add three letters to the alphabet) and various symbols used as abbreviations that are mainly of importance for transcribing ancient inscriptions.</p>
