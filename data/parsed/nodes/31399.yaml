      <p>As for the missing languages, I'm sure there are on-line word lists or dictionaries that we could cull the right words from. It would be time-consuming to be sure, but the programmers among us can maybe help automate the process. Volunteers?</p>
      <p>I only have an amateur's general insight into the Korean font scene, but I can tell you it has witness a boom in recent years. Because of the amount of work needed to produce a hangul font, decent ones are still hard to come by, but there have been some really impressive designs. To mention just one development, <em>Hankyoreh</em>, a daily newspaper, introduced a revolutionary news text face with its redesign in 2005--it abandons the traditional scheme of fitting the glyphs into squarish blocks.</p>
      <p>I have not yet designed a full Korean font though I've drawn some glyphs. It's too much work. I've designed full sets of Roman glyphs (as well as basic Cyrillic and Greek ones), but they're still works in progress. Maybe I'll let the see some light in the Critique forum soon..</p>
      <p>I have zero background on the Malay and Indonesian languages, but Wikipedia tells me various scripts have been used historically--a modified Arabic script called Jawi which is still in limited use, and before that, Pallava, Kawi and Rencong script. We have Western colonization to thank for the Latin script.</p>
