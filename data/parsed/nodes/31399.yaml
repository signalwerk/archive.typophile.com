    html: |-
      <p>Regarding double letters an their non existance in some languages: In a case where a a given letter is not doubled then a word where the letter appears in the middle is a good substitute I think. </p>
      <p>Looking at Just van Rossum, &amp; Peter Biľak's Letter frequency Meter ( <a href="http://just.letterror.com/ltrwiki/LetterFrequencyMeter">http://just.letterror.com/ltrwiki/LetterFrequencyMeter</a> ) I also thought about trying to get a deliberate mixture of straight sided &amp; round sized for each letter , and both sides of each, to make the list stronger still. But maybe the best place for that is in the brute force testing model which I am also working on. So I am leaning that way for now because I think brevity is part of what makes this tool appealing. Do you agree?</p>
      <p>The thing about this project is that it isn't really a substitute for an organzed brute force approach to testing where you can look at any &amp; all combinations of glyphs &amp; it is not a substitute for setting a longer text either. It's not even a substitute for pangrams really. But before you test a font with a longer text I think a quick check using a test like this might reveal a problems that would take longer to find using any of the other methods. Mostly though I think this tool is a way of seeing how another language feels in your type design so you can see if your kerning is going well for that language, to see if the ascennders and decenders are working nicely, and to see how your CE glyphs with diacritics feel.</p>
      <p>Alejandro, would you be willing to do the Spanish one or part of it?</p>
      <p>Lorenza, Thank you! That sounds great!</p>
      <p>Aleksander, Would you do the Polish?</p>
