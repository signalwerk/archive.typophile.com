      <p>In my list, I used loan words only if necessary. As they are not frequent formations, I have noted them with an asterisk.</p>
      <p>For example, double g is not natural in basque and there can be no native word with it, but 'reggae' does exist in basque, as it is in the dictionary and it is used. So a 'gg' combination is only found in loan words, but it may appear in basque texts (there is no other word for 'reggae').</p>
      <p>And yes, there is 'pizza' too. And we use it! ;)</p>
