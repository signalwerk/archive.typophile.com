      <p>Since there are a number of fluent Spanish speakers on this board, I'm not going to embarass myself trying to create a list (unless no one else chimes in). But I am pretty sure that Spanish has a dearth of double-letter combinations. My classmates constantly make the mistake of using double-s's, double-f's, double-m's, double-p's, etc., which do not exist in Spanish as far as I know. Only rr and ll occur naturally. Maybe there are some loan words from English or other languages that do have other double letters, but I don't know of them.</p>
      <p>So I guess the question is, should this list contain examples of all three types for every language or just for the languages in which they naturally occur? Maybe this is a bit picky when this project is just getting off the ground, but it's what I thought of first.</p>
