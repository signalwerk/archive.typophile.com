      2 correr, Correr, CORRER<br>
      ] teclear, Teclear, TECLEAR</p>
      <p>S:<br>
      [ soportar, Soportar, SOPORTAR<br>
      - asimismo, Asimismo, ASIMISMO<br>
      ] naciones, Naciones, NACIONES</p>
      <p>T:<br>
      [ trabajo, Trabajo, TRABAJO<br>
      - atento, Atento, ATENTO<br>
      *] chalet, Chalet, CHALET</p>
      <p>U:<br>
      [ unanimidad, Unanimidad, UNANIMIDAD<br>
      - denuncia, Denuncia, DENUNCIA<br>
      *2 duunviro<br>
      *] espíritu, Espíritu, ESPÍRITU</p>
      <p>Ú:<br>
      [ último<br>
      - antepenúltimo, Antepenúltimo, ANTEPENÚLTIMO<br>
      ] champú, Champú, CHAMPÚ</p>
      <p>Ü:<br>
      [ [none]<br>
      - vergüenza, Vergüenza, VERGÜENZA<br>
      ] [none]</p>
      <p>V:<br>
      [ versos, Versos, VERSOS<br>
      - polvo, Polvo, POLVO<br>
      ] [none]</p>
      <p>W:<br>
      *[ watt, Watt, WATT<br>
      *- sóftware, Sóftware, SÓFTWARE<br>
      ] [none]</p>
      <p>X:<br>
      [ xilófago, Xilófago, XILÓFAGO<br>
      - exemplar, Exemplar, EXEMPLAR<br>
      ] fénix, Fénix, FÉNIX</p>
      <p>Y:<br>
      [ yegua, Yegua, YEGUA<br>
      - desayunar, Desayunar, DESAYUNAR<br>
      ] virrey, Virrey, VIRREY</p>
      <p>Z:<br>
      [ zapatos, Zapatos, ZAPATOS<br>
      - mozárabe, Mozárabe, MOZÁRABE<br>
      ] rapidéz, Rapidéz, RAPIDÉZ</p>
      <p>* These formations are extremely rare and found either exclusively in loan words or with a total occurrence of about 1-5 native words. </p>
      <p>I hope that helps.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos.» (La Luz Oscura, por Javier Guerrero)</em></p>
