      <p>Pizza is in my Larousse. </p>
      <p>And, I am from Quebec where French is often largely English. (OK, that could be a really contentious subject. Let's not get into it...) </p>
      <p>I'll rephrase: It has been my experience that much of the French spoken here is English. I once worked at a gas station. A man came in and with great agitation asked if I spoke French, to which I replied "oui". He proceeded to ask, and I quote, "tu-peux-tu me caller un tow-truck, mon motor a stallé." I'm sure even those of you who speak no French could figure out what he meant. Call a tow truck. My motor stalled. Pizza is the least of the anglicizing that occurs. Also, in France, "parking" and "shopping" are more common than the French terms. </p>
      <p>Eben : Holler if you want French words with accents.</p>
      <p>K.</p>
