      insel, Insel, INSEL<br>
      liiert, Liiert, LIIERT<br>
      mami, Mami, MAMI</p>
      <p>J<br>
      januar, Januar, JANUAR<br>
      verjüngung, Verjüngung, VERJÜNGUNG<br>
      -</p>
      <p>K<br>
      krönung, Krönung, KRÖNUNG<br>
      mokka, Mokka, MOKKA (no kk in words of german origin)<br>
      gestank, Gestank, GESTANK</p>
      <p>L<br>
      leidenschaft, Leidenschaft, LEIDENSCHAFT<br>
      keller, Keller, KELLER<br>
      tal, Tal, TAL</p>
      <p>M<br>
      musikakademie, Musikakademie, MUSIKAKADEMIE<br>
      kammer, Kammer, KAMMER<br>
      schlemmen, Schlemmen, SCHLEMMEN</p>
      <p>N<br>
      name, Name, NAME<br>
      kenner, Kenner, KENNER<br>
      mann, Mann, MANN</p>
      <p>O<br>
      offenbarung, Offenbarung, OFFENBARUNG<br>
      boot, Boot, BOOT<br>
      so, So, SO</p>
      <p>Ö<br>
      öffentlichkeit, Öffentlichkeit, ÖFFENTLICHKEIT<br>
      böse, Böse, BÖSE (no öö)<br>
      -</p>
      <p>P<br>
      pappnase, Pappnase, PAPPNASE<br>
      klappe, Klappe, KLAPPE<br>
      kap, Kap, KAP</p>
      <p>Q<br>
      quelle, Quelle, QUELLE<br>
      erquickend, Erquickend, ERQUICKEND (no qq)<br>
      -</p>
      <p>R<br>
      rahmen, Rahmen, RAHMEN<br>
      rohrreiniger, Rohrreiniger, ROHRREINIGER<br>
      über, Über, ÜBER</p>
      <p>S<br>
      steuern, Steuern, STEUERN<br>
      tasse, Tasse, TASSE<br>
      gras, Gras, GRAS</p>
      <p>ß<br>
      -<br>
      größe, Größe, GRÖSSE (no capital ß)<br>
      maß, Maß, MASS</p>
      <p>T<br>
      traum, Traum, TRAUM<br>
      trittbrett, Trittbrett, TRITTBRETT<br>
      anstatt, Anstatt, ANSTATT</p>
      <p>U<br>
      unruhe, Unruhe, UNRUHE<br>
      stauung, Stauung, STAUUNG<br>
      frau, Frau, FRAU</p>
      <p>Ü<br>
      überraschung, Überraschung, ÜBERRASCHUNG<br>
