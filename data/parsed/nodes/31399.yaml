      äffisch, Äffisch, ÄFFISCH (ä in the beginning is really rare)<br>
      märchen, Märchen, MÄRCHEN (no ää exists)<br>
      - (no german word ends on ä)</p>
      <p>B<br>
      belletristik, Belletristik, BELLETRISTIK<br>
      ebbe, Ebbe, EBBE<br>
