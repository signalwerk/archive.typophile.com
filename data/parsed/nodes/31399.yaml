      <p>G:<br>
      [ gasolina, Gasolina, GASOLINA<br>
      - paragüeño, Paragüeño, PARAGÜEÑO<br>
      *] gong, Gong, GONG</p>
      <p>H:<br>
      [ hielo, Hielo, HIELO<br>
      - deshacer, Deshacer, DESHACER<br>
      ] oh, Oh, OH / ah, Ah, AH </p>
      <p>I:<br>
      [ intelectual, Intelectual, INTELECTUAL<br>
