      <p>Denis, Thank you very much!</p>
      <p>I am really glad to have this new langauge in the group. But before I can use it I need to clarify something:I am seeing a bunch of 'boxes' between words. When I cut &amp; paste into a text editor I see accents. So for instance I see: </p>
      <p>ádeké koyángana awá Ádeké Koyángana Awá ÁDEKÉ ?</p>
      <p>I am guessing what I am meant to see is:</p>
      <p>ádeké koyángana awá Ádeké Koyángana Awá ÁDEKÉ KOYÁNGANA AWÁ ?</p>
      <p>or even</p>
      <p>ádeké Ádeké ÁDEKÉ</p>
      <p>koyángana Koyángana KOYÁNGANA </p>
      <p>awá Awá AWÁ</p>
      <p>I have an idea that maybe formating from a word processor is interfering with the result I am seeing here on the web page. In any event I hope you can advise me.</p>
