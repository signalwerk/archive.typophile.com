      <p>There are at least hundreds of languages left to go if you want to include all languages written in some form of the Roman alphabet! Some major ones are: Turkish, Danish, Polish, Malaysian, Indonesian, Albanian, Afrikaans, Tagalog, Azeri, Estonian, Lithuanian, Latvian, Croatian, Slovenian, Hausa, Yoruba... It makes one's head spin.</p>
      <p>There are several romanization schemes for Korean. The most important ones might be the <em>new</em> official romanization used in South Korea, the <em>old</em> official romanization used in South Korea, the official romanization used in North Korea, the McCune-Reischauer romanization (upon which the latter two are based), and the Yale romanization scheme... Mostly though, people use ad hoc romanizations that stick to no system. I could provide lists, but I don't see how useful they would be, since romanized Korean serves a limited purpose anyway.</p>
