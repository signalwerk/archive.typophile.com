      <p>Eben, sorry I somehow forgot the thread for a while.<br>
      The data I gave is as I typed it on our Congolese keyboard layout. We don't bother having precomposed characters since we need the combining diacritics for things like ɛ́, so we just use the same accent for á (instead of á).</p>
      <p>If your application isn't displaying Á like Á, that a missing feature in the font or a bug in your text layout libraries. It might be a lot of work to add diacritics placement but it is a requirement for many African languages.</p>
    html_clean: |-
