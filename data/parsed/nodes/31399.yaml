      <p>Kristina, I am happy to stick with your list of words except that I was thinking it might be ideal to have for instance a seprate a &amp; aacute. Do you see what I mean? It means doubling up on the a ( or trippling?) depending on how many accents are used in french. Actually you can find ( I think...) an authoritative list here: </p>
      <p><a href="http://www.eki.ee/letter/">http://www.eki.ee/letter/</a></p>
      <p>Looking there just now I see that we do need 3 'a' entries for french. We need an acircumflex too!</p>
      <p>The eki resource can be used to check your list or test somebody else's. Libraries that have   dictionaries, translating dictionaries, are good for searching for words. And then there are online sources too. If we end up missing a langauge I will use those sources to fill in that langauge. </p>
      <p>Goran, yes I do intend to collect the examples and if needed correct or add to them because I or anybody else may have left something out or made some sort of error. </p>
      <p>When there are a good number of them and they are reasonbaly finnished and share formatting I will try to find a place to keep them. Maybe Typophile will do that - they could live in the wiki maybe - or maybe I will see if the diacritics project will do it or maybe eki will. Certainly I will email the complete text to anybody who asks. And I may be able to serve it from a web site of my own. The main consideration as far as I am concerned is that we maintain this effort as a shared resource freely distributed and kept safe from being hijacked or copyrighted by somebody so it becomes unsharable. I also expect that people may want to make derivative works and even keep those to themselves. I don't have a problem with that as long as they don't impinge on our right to share our own versions with each other.</p>
