      <p><cite>Will you tell us about your relationship to Latin and about publications that are in Latin?</cite></p>
      <p>I'm not fluent in the way that a classical literature person would be, but I can read Latin partly because of a few years of it in school and partly because I do Roman archaeology. In publishing, I've never done a whole book in Latin, but plenty of short phrases or sentences show up in lots of kinds of books: it's unavoidable in classics or medieval history or art history, of course, and you also find a bit in other areas like law or medicine, for example.</p>
      <p>I probably should have done the all caps words using V for U (HYPOCAVSTVM, for example), but I was afraid that switching the spelling like that would confuse matters.</p>
