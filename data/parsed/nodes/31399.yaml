      <p>I'm guessing <em>hihhulit</em> must be a loanword from Finnish, one of the few that went in that direction. It doesn't look like a native Swedish word.</p>
      <p>I do know <em>kassa</em> means "cashbox" or "cashier's", which we were always confusing with <em>kasse</em> ("bag") all the time in Swedish class when we were talking about shopping situations.</p>
