      <p><cite>So when you see romanized korean maybe it’s for titles, signage and other short purposes not running text - is that right? You would never see a novel or comic book set in Romanized Korean. Correct?</cite></p>
      <p>That's exactly right. A novel set in romanized Korean would be really interesting to slog through, I should say. There were plans in the Soviet Union in the 1920s to introduce latinize Korean, and it's fascinating to think what the result would have been like if they had gone through with them. I can't imagine reading in Korean in anything other than the Korean script give or take a few Hanja (Chinese characters).</p>
      <p>I would love to contribute an additional language, but I'm all out, I'm afraid. I also speak some Swedish and French, but those have already been covered. I'm not a linguist, though I am deeply interested in different languages; I lived in several different countries growing up. Since you're interested, my exposure to Swahili was from when I lived in Kenya for two years. Maybe one day I'll design my long overdue Kenya-inspired typeface...</p>
