      <p>You are welcome :)<br>
      Regarding the two lists: pick the words that fit your purpose best. In choosing, I would try to also include words with common pairs of letters like hj, hv, sj and sk. The only word I would not recommend from the first list is "quinde" since this is an outdated spelling and not kosher.<br>
      Danish and Norwegian spelling is very similar, but, if required, I can get you a Norwegian list as well. And, with a little more labour, also Faroese and Greenlandic if interested. Especially Greenlandic has a lot of dubble letters and might be interesting. Have a look at <a href="http://www.nanoq.gl/" rel="nofollow">This page</a> in Greenlandic, Danish and English.</p>
