      <p>Okay, time for the Spanish.  The only letters that can be doubled are vowels, <em>n</em>, <em>l</em>, <em>c</em>, and <em>r</em>. It's technically possible to have a double s in voseo regions or in Spain where the <em>os</em> reflexive could be used in conjunction with the indirect <em>le</em> morphed into an indirect <em>se</em> due to a final third-person direct object, but besides the fact that A- it's pretty unlikely (I can only ever think of quite off the wall statements to line all of them up), I'm quite sure the RAE's position is that it's reduced to a single <em>s</em>.  In old Spanish, however, it was quite common though, used in the same areas where for instance Modern Portuguese would use <em>ss</em>.  <em>Ll</em> was prior to ’94 sorted as a separate letter, but I'm including it (as well as ch) as I suppose for people making specifically Spanish-use fonts it could open up some interesting design considerations (the font used by Cátedra kerns the <em>c</em> and <em>h</em> when together a bit closer than normal.  Also, note that the accents are not required on capital vowels (Ñ always has accent), but especially in modern times they are almost always included.</p>
      <p>A:<br>
      [ animal, Animal, ANIMAL<br>
      - manzana, Manzana, MANZANA<br>
      2 portaaviones, Portaaviones, PORTAAVIONES<br>
      ] pantera, Pantera, PANTERA</p>
      <p>Á:<br>
      [ águila, Águila, ÁGUILA<br>
      - matemáticas, Matemáticas, MATEMÁTICAS<br>
      ] nadará, Nadará, NADARÁ</p>
      <p>B:<br>
      [ bebida, Bebida, BEBIDA<br>
      - caballo, Caballo, CABALLO<br>
      *] club, Club, CLUB</p>
      <p>C:<br>
      [ claro, Claro, CLARO<br>
      - acontecimiento, Acontecimiento, ACONTECIMIENTO<br>
      2 inspección, Inspección, INSPECCIÓN<br>
      *] coñac, Coñac, COÑAC</p>
      <p>Ch:<br>
      [ charlar, Charlar, CHARLAR<br>
      - mancha, Mancha, MANCHA<br>
      *] sándwich, Sándwich, SÁNDWICH</p>
      <p>D:<br>
      [ demonio, Demonio, DEMONIO<br>
      - nadar, Nadar, NADAR<br>
      ] ciudad, Ciudad, CIUDAD</p>
      <p>E:<br>
      [ escuchar, Escuchar, ESCUCHAR<br>
