      <p>Hi everybody!<br>
      This is my first post, here goes an attempt for basque.</p>
      <p>All the words from the list are correctly spelled, but I have inserted some notes:</p>
      <p>(!) rare, not natural basque formation<br>
      (*) only found in loan words<br>
      (?) non-existent</p>
      <p>Aa:<br>
      anitz, Anitz, ANITZ<br>
      haatik, Haatik, HAATIK<br>
      kexa, Kexa, KEXA</p>
      <p>Bb:<br>
      bazter, Bazter, BAZTER<br>
      * hobby, Hobby, HOBBY<br>
      ! klub, Klub, KLUB</p>
      <p>Cc:  (*)<br>
      * curriculum, Curriculum, CURRICULUM<br>
      * accesit, Accesit, ACCESIT<br>
      * picnic, Picnic, PICNIC</p>
      <p>Dd:<br>
      dzanga, Dzanga, DZANGA<br>
      onddo, Onddo, ONDDO<br>
      * polaroid, Polaroid, POLAROID</p>
      <p>Ee:<br>
      etxebizitza, Etxebizitza, ETXEBIZITZA<br>
      besteen, Besteen, BESTEEN<br>
      hiltzaile, Hiltzaile, HILTZAILE</p>
      <p>Ff:<br>
      finantza, Finantza, FINANTZA<br>
      * graffiti, Graffiti, GRAFFITI<br>
      * naif, Naif, NAIF</p>
      <p>Gg:<br>
