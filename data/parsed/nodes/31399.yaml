      <p>Sorry you're right. A plain text file would probably be much better in Unicode format. You could paste it anywhere you'd like.</p>
      <p>BUT. A PDF could be very usable. If you'd layout all these (one language per page for instance) using some perfectly complete font, there would be no problem on any platform to see how it should look like. Because If you'd be opening a text file and displaying with incorrect font, you wouldn't see those texts.</p>
      <p>So for usability purposes <strong>both</strong> would serve all purposes. Text file to lay out your own font (or any other) and PDF as a reference.</p>
