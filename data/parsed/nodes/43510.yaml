      <p>The story of the evolution of Minion would be one worth telling, I think, because it represents the ongoing problem-solving of Slimbach, one of our best designers of text faces. </p>
      <p>For <a class="freelinking external" href="http://www.typophile.com/node/2989" rel="nofollow">this thread</a> back in 2004 I did a PDF comparing Minion and Minion Pro. I think Slimbach subtly but decisively improved the face in that upgrade. </p>
      <p>Minion tries really hard to be economical, packing the most letters in the smallest space. J-F Porchez pointed out that it is intended to be a rival to Times New Roman in that respect. Aesthetically, I think something was given up for the sake of economy, but I think you have to admit that it is one of the great workhorse faces of our times, with huge glyph coverage (including Greek and Cyrillic), optical sizes, four number styles, many weights, and even a condensed version.</p>
