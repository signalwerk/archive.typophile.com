    <p><a href="http://dotsies.org/" title="http://dotsies.org/">http://dotsies.org/</a></p>
    <p>"Dotsies is a font that uses dots instead of letters"</p>
    <p>"The latin alphabet (abc...) was created thousands of years ago, and is optimized for writing, not reading. About time for an update, no? Dotsies is optimized for reading. The letters in each word smoosh together, so words look like shapes! Follow me on twitter for periodic tips on learning it (it's not that hard) or to tell me what you think."</p>
