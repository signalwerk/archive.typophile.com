    html: |-
      <p>Braille had exactly the same concept (whereas his motive was far away from Dotsies), but with six dots (bits). This also means that Braille has twice as much possible character definitions as Dotsies (including the space). As the Braille system spread around the world, the character set size restriction turned relevant. Unavoidably, new added letters had to be plotted in the same picture; e.g ß has the same coding as è. Back at the 21-century, Dotsies can't represent upper-case letters, not even numerals, which is an enormous constraint. But then, Dotsies is (just) an experimental typeface.</p>
      <p>Another issue is that I don't seem to be able to discover a systematic idea in the character assignment. Why should be a,b,c,d,e the one-point-characters? Wouldn't it make more sense to assign those glyphs to the vocals (first I thought this was the reason for using five "dot-cells")? Or better, assign the simplest characters to the letters with most frequency (etaoin shrdlu).</p>
      <p>What I really like and have not seen before, is that in Dotsies' characters "merge" to form a word. There are no spaces between letters. Every word is a long ligature itself: a pictogram.</p>
      <p>Good legible? I'm not sure... There are no extenders, which are (speculatively) essential to form distinguishable boumas, and thus for a good legibility, if I may recall the ALL-CAPS problematic.</p>
