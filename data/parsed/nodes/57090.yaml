    <p>One of our recent releases, Bonnining, is proving particularly succesful for Greater Albion Typefounders, having made it into both "Rising Stars" on the Myfonts site, and "Hot New Fonts" on the New Myfonts sit *as an aside, interesting that these two are apparently different ratings based on the same sales!).</p>
    <p>We thought we'd sho off a little bt posting a few more previews of the family 'in action' on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
    <p>Bonning is currently offered at a 40% discount on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bonning/overview.html " rel="nofollow"> MyFonts.com</a>. The family also includes bone fully licensed free face.</p>
    <p>Here's one 'taster' of Bonning:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/antique-rose-vase copy_4410.png"></div><p></p>
