    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12369" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">How-To</a>&nbsp;: Cyrillic Character&nbsp;Design</strong></p>
    <p>Common mistakes in deigning for Cyrillic include:<br>
    - Horizontally flipping a roman cap R to create the ya. (Watch the stress!)<br>
    - Horizontally flipping a roman cap N to create the e and ekratkoya. (Again, watch the stress.)<br>
    - Using a roman cap K to create the zhe. (This often leads to a form that is too&nbsp;wide.)</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/464">Cyrillic Lower Case</a><br><a href="http://typophile.com/node/5028">Cyrillic Kern Pairs</a><br><a href="http://typophile.com/node/16550">Cyrillic: equivalence of upper and lower case&nbsp;?!</a><br><a href="http://typophile.com/node/27960">Cyrillic Script Glyphs</a><br><a href="http://typophile.com/node/30024">Understanding Cyrillic&nbsp;Letters?</a></p>
    <p><strong>Books:</strong><br><a href="http://www.artlebedev.com/everything/izdal/kniga_pro_bykvy/"><em>Книга про буквы от Аа до Яя</em></a>, Юрий Гордон (<a href="/node/34828" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Yuri Gordon</a>), <em>Russian</em>.<br><em>The Lettering Art: Works by Moscow Book Designers&nbsp;1959-1974</em></p>
    <p><strong>Printed Articles:</strong><br>
    “<span class="caps">ITC</span> Cyrillics, 1992–” <em>Language, Culture, Type: International type design in the age of Unicode</em>. 2002, New York, <span class="caps">AT</span>ypI, Vladimir Yefimov.<br>
    “Civil Type and Kis Cyrillic” <em>Language, Culture, Type: International type design in the age of Unicode</em>. 2002, New York, <span class="caps">AT</span>ypI, Maxim Zhukov.<br>
    “On the Peculiarities of Cyrillic Letterforms” <em>Typography Papers</em> 1. 1996, Reading University Press, Maxim Zhukov.<br>
    related thread: <a href="http://typophile.com/node/8709">http://typophile.com/node/8709</a></p>
