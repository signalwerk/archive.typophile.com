    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/How-To" class="freelinking" rel="nofollow">How-To</a> : Cyrillic Character Design</strong></p>
    <p>Common mistakes in deigning for Cyrillic include:<br>
    - Horizontally flipping a roman cap R to create the ya. (Watch the stress!)<br>
    - Horizontally flipping a roman cap N to create the e and ekratkoya. (Again, watch the stress.)<br>
    - Using a roman cap K to create the zhe. (This often leads to a form that is too wide.)</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/464" rel="nofollow">Cyrillic Lower Case</a><br>
    <a href="http://typophile.com/node/5028" rel="nofollow">Cyrillic Kern Pairs</a><br>
    <a href="http://typophile.com/node/16550" rel="nofollow">Cyrillic: equivalence of upper and lower case ?!</a><br>
    <a href="http://typophile.com/node/27960" rel="nofollow">Cyrillic Script Glyphs</a><br>
    <a href="http://typophile.com/node/30024" rel="nofollow">Understanding Cyrillic Letters?</a></p>
    <p><strong>Books:</strong><br>
    <a href="http://www.artlebedev.com/everything/izdal/kniga_pro_bykvy/" rel="nofollow"><em>Книга про буквы от Аа до Яя</em></a>, Юрий Гордон (<a href="/wiki/Yuri%20Gordon" class="freelinking" rel="nofollow">Yuri Gordon</a>), <em>Russian</em>.<br>
    <em>The Lettering Art: Works by Moscow Book Designers 1959-1974</em></p>
    <p><strong>Printed Articles:</strong><br>
    "ITC Cyrillics, 1992--" <em>Language, Culture, Type: International type design in the age of Unicode</em>. 2002, New York, ATypI, Vladimir Yefimov.<br>
    "Civil Type and Kis Cyrillic" <em>Language, Culture, Type: International type design in the age of Unicode</em>. 2002, New York, ATypI, Maxim Zhukov.<br>
    "On the Peculiarities of Cyrillic Letterforms" <em>Typography Papers</em> 1. 1996, Reading University Press, Maxim Zhukov.<br>
    related thread: <a href="http://typophile.com/node/8709" title="http://typophile.com/node/8709">http://typophile.com/node/8709</a></p>
    <p><strong>Online Articles</strong><br>
    <a href="http://www.yt.cache.waseda.ac.jp/fontguide.html" rel="nofollow">A Guide to using computer in Russian studies</a></p>
