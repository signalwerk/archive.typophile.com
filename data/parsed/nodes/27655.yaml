      <p>I'm afraid you are outside the time frame that most of us have any information for. 'Menu1' looks largely hand-lettered to me, and Menu 2 is the only one that says (to me) that it was made in 1834. I think the 1834 in Menu 1 may just be the date that Delmonicos was established. You know how businesses like to tell how how long they have been around.</p>
      <p>The small lettering on Menu2 is interesting because it is so beat up and misshapen. I notice that a 'g' was used for an 'a' in 'Sausages' or I would have suggested that the small lettering was hand-printed too. Maybe it says the printer (Smith &amp; Handford) used really old, beat up, overused type, which seems plausible.</p>
      <p>Some of the larger lettering may have been wood type. You said you identified the PEARL STREET type. Can you tell us what it was?</p>
      <p>There must be books about early 19th Century printing in America, but I sure don't have any of them, so I guess that's all I can contribute. Sorry.</p>
      <p>- Mike Yanega</p>
