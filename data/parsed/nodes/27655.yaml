      <p>The typeface used to print "494 Pearl Street" and the little doo-dads at the end of Menu 2's "Delmonico's" is MacKellar, Smiths and Jordan's "Kitcat" series font, patented April 10, 1883, US patent #13, 849. I am sitting here with 3 books on typefaces: Encyclopedia of Type Faces, Printing Types, and the 1896 American Type Founders Co. sample book. My eyes are crossing. </p>
      <p>The type fonts were not handprinted, nor were they hand-run. These menus were "mocked up" circa 1946. They were given out all over the East coast as "marketing" thingies but the menus over time were separated from the "postcards" that came with them, and Menu 2 has attained the status as a "real" menu from 1834.</p>
      <p>The type faces in both are similar BUT not identical. For example, in Menu 1, the "Regular Dinner" looks like ATF Garamond, while in Menu 2, it resembles Linotype Old Style Regular. In Menu 1, the "RESTAURANT" looks like ATF Bodoni, while in Menu 2, it looks like ATF Garamond Roman. These are just fairly reasonable guess on my part because I don't know beans about type faces - just what I'm seeing in books. </p>
      <p>Am desperately trying to identify the numerals that compose "1834." The "3" looks like a medical number in the ATF book, but I cannot locate a type face for these with certainty.</p>
      <p>Thanks again for trying to help. I truly appreciate it!</p>
