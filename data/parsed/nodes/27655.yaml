    <p>These 2 menus appeared circa 1946 purporting to have been made in 1834. I have identified the typeface of "494 Pearl Street" and the "greater than" and "lesser than" symbols at the end of the word "DELMONICO" as being Kitcat patented April 10, 1883 (already a clue that these menus are frauds). </p>
    <p>However, after searching Caslon, Garamond, Ionic, Cheltenham, and other fonts, I cannot identify the other typefaces used in these menus. I suspect they were commonly around in a print shop, and were chosen because they looked "old."</p>
    <p>I also suspect that the “DELMONICO” name was composed of different fonts. The “M” in each menu is different. The “N” is pointed and goes below the line. The “O” is also different in each menu. The “1834” looks to me like it was supposed to be a woodcut, but I have no idea. I cannot locate a font with those numerals.</p>
    <p>I am a complete neophyte in the area of font identification. This research is for an academic talk dealing with culinary history.</p>
    <p>I have linked to the images because they are large. You can click on them to enlarge them even more. These are photocopies I have from archives, so the quality is not that great. Apologies in advance.</p>
    <p>Any assistance would be greatly appreciated. </p>
    <p><a href="http://www.windycitybooks.com/menu/amermenuco.jpg" rel="nofollow"> Menu1</a><a href="http://www.windycitybooks.com/menu/buttonwood1.jpg" rel="nofollow">Menu2</a></p>
    <p>In the event the links do not work, kindly access the files at: <a href="http://www.windycitybooks.com/menu/" title="http://www.windycitybooks.com/menu/">http://www.windycitybooks.com/menu/</a></p>
