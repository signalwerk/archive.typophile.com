      <p>Not sure if I even agree with the premise of the challenge: To promote a particular visual artist that has a very strong and unique visual style by emulating their own style?</p>
      <p>No matter how talented of a designer one may be, they're still just trying to emulate someone else's well-known style, so it'll always pale in comparison.</p>
      <p>So, in many ways, pris is trying to do the impossible. </p>
      <p>If you must do this project, I'd suggest going for an 'essence' rather than a 'duplicate' of her style. Do your own thing with some tie to what she does, but don't try to emulate her actual style.</p>
