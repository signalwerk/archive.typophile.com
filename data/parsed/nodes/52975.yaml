      <p>You don't necessarily have to imitate her style literally to be effective. You could opt to showcase a singular piece, using your own layout and typographic flavor and then elements of Bantjes work could be added for emphasis. Artistry that unique is hard to duplicate. As some contributors noted, exhibition promotional pieces are not always replications of featured work. </p>
      <p>Because her work is so stunning, I wouldn't try to compete with it, it's so distinctive that it speaks for itself. Possibly you could use a san serif sparingly where bits of her work could "lop" over it, all against a simple background. Start with her website to see how she mixes the "organic" with a serious underlying of geometric structure and work from there.</p>
      <p>But because this is "your" project, you should come through too.</p>
