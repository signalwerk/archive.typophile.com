    <p>Aloha~~~<br>
    I'm currentely doing a project on a selected typographer where i have to do a exhibition for her and design stuffs to promote that exhibition. I have chosen Marian Banjtes as my designer, i'm going to produce a poster,invitation card and commenmorative book to promote her exhibition. The outcomes must related to her style and the themes i have chose, which is 'Ornament, MB's way to rationalize emotions'. </p>
    <p>Please leave any comment for the piece of art work i have done...Thank you very much=)</p>
