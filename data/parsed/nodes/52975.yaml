      <p>If you're looking for inspiration, why not contact her directly?  Most designer types are quite flattered when someone, especially a student, shows an interest in their work. The impression I've always gotten from her writings is that she's not completely full of herself. She might even be able to suggest an archetypal piece of hers that you can use to build your program around.  </p>
      <p>I agree that you should probably not try to duplicate her style. She's a one-off, not prone to much imitation. Find a way to present her designs in a supporting context that can show your understanding of her work. I assume that's the real point of the class project anyway.</p>
