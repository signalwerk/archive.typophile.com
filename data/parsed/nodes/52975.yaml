      <p>I'm afraid I have to agree with James (terminaldesign): this design really fails to capture what Marian's work is all about. Marian deliberately avoids using fonts in her work: it is all about melding lettering and ornament in ways that are only possible when both are made in the same way by the same hand. You can't get that effect by taking some fonts and some ornaments and slapping them together. It is worth noting that Marian's rejection of the use of fonts extends to her own typeface design, Restraint. For Marian, the Restraint font is the design, not something to be used in design. Of course, other people can use it, and perhaps it is something that you should consider: it is the easiest way to inject some genuine Bantjes elements into your poster.</p>
      <p><a href="http://www.tiro.com/Restraint/index.html" title="http://www.tiro.com/Restraint/index.html">http://www.tiro.com/Restraint/index.html</a></p>
