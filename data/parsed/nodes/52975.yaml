      <p>Wow, harsh crits.</p>
      <p>I think Bantjes style is hard to knock off because I'm still not convinced she was born on this planet. Her work has an other-world quality. To me her work shares a biological/organic quality similar to Margo Chase, but with smaller, more detailed ornament. If I were to try to mimic her work, I would try to imagine drawing an organic form on a grid, yet not always bound to symmetric growth.</p>
      <p>Good luck with it, and with luck maybe MB will pop in to give her opinion.</p>
