      <p>I am seeing something in your work that reminds me of Marian’s work: the idea of drawing a complex design out geometry. That reflects the isometric perspective work she did for Typecon 2007 and the gridded sustainability piece she did for a paper company. I think that you can do much better by throwing this away and focusing on the kind of deep and thoughtful process behind Marian’s work, so that you have something really special of your own instead of a poorly-informed attempt at aping her work. </p>
      <p>Try contacting Marian and see if she can send you the presentation she gave about the process behind the sustainability piece. Once you see that you’ll understand what I mean and be in a better position to respond to her work with some of your own.</p>
