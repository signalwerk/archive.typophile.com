      <p>Your design isn't completely hopeless.<br>
      I like the colours, and your small geometric components.<br>
      But there are several serious lapses of taste.<br>
      Firstly, the square proportions are nasty.<br>
      Secondly, the typefaces you have chosen are horribly kitsch; yeah they are fancy and ornamented, but not in a way that is relevant to design today, where designers are more thrilled by encrusting Helvetica with flourishes--a quite different kind of ornamentation.<br>
      So I would say change the proportions, and choose a face that Ms Bantjes might use in her work, such as FF Sanuk (for TypeCon 2007).<br>
      Also, you have three or four kinds of ornamentation going on: the quilt panes, the spirals, the star, and the type flourishes--it's better to limit the number of element classes.</p>
      <p>Bear in mind that it's Your design for a gallery, you're not trying to do it as if she is self-publishing a book, so you could try to establish some kind of dialectic between what represents the work shown in the gallery, and the brand of the gallery. The usual way galleries do this is by going totally "neutral" and bland with their layout and typography, letting the work depicted create the vibe.</p>
      <p>So, any one of the elements, contrasted against a plain type. But then, the viewer would wonder, is that ornamental thingy one of Bantje's? </p>
      <p>Show some Restraint?!</p>
