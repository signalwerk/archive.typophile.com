    html: <p>InDesign CS supports psd and ai files directly no need to convert.  <br>As for extracting there is a good article in the new Photoshop Users magazine on that subject. I find if you use two tools you can get a good extraction. The extraction filter and the history brush. Make your extraction, go to history pallet and set it on the step before your extraction. Select the history brush and paint back what you need.  <br>My favorite no-destructive way of handling silos is use a layer mask. You have all the control and none of the destructive qualities of extraction. This allows you to make changes to the image on the fly as the client changes their mind.  <br>Its another reason to psd placement in InDesign. It links to the original file and warns you when the image has been changed and updates it.</p>
