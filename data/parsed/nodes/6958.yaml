  html: <p>Im bringing an image into InDesign and want to drop the background, Id usually delete the background and save the layer on a transparent background and save as a .psd. but am afraid a psd is not as good as a tiff for printing (am I wrong?). <br> <br>Is there anyway of doing this with tiffs perfectly. clipping paths never seem to work as well and alpha channels never look perfect (not as perfect as the selection). <br> <br>Thanks for any tip's</p>
  html_clean: <p>Im bringing an image into InDesign and want to drop the background, Id usually delete the background and save the layer on a transparent background and save as a .psd. but am afraid a psd is not as good as a tiff for printing (am I wrong?). <br> <br>Is there anyway of doing this with tiffs perfectly. clipping paths never seem to work as well and alpha channels never look perfect (not as perfect as the selection). <br> <br>Thanks for any tip's</p>
