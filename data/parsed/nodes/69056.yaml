      <p>I'd agree that #2 is perhaps best in terms of fitting with the style of the mark (but maybe it's really a tad too spiky); I'd think #3 is too plump. And perhaps obviously, anything [strongly] slanted would make zero sense with that mark, and a name with «balance» in it.<br>
      All that said, without knowing the context it's really impossible to say what kind of font you should pick: with a script font this seems more yoga/dance-y, whereas paired with a sans it might come across more sporty or wellness-like. Stylistic matching isn't the only dimension to consider.</p>
