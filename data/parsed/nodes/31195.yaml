    html: |-
      <p>From the Fontlab Ltd. perspective: </p>
      <p>Fontographer is quite simple, easy to use for people who have learned it well, and very reliable (on Mac — the Windows version did not age so well). However, the current version is a bit dated, produces poor-quality TrueType fonts and no OpenType fonts, so it’s only good for making Western Type 1 fonts (but it is really very good at doing that). </p>
      <p>FontLab Studio is more complex, a bit less reliable. Version 5 is also reasonable easy to use given its complexity. People who have taken the time to learn the switch from Fontographer to FontLab Studio can work in it as fast, or sometimes even faster. Currently, the great advantage of FontLab Studio is its user community: you will find many tips and tricks here on Typophile or on the <a href="http://groups.msn.com/fontlab/">FontLab forum</a>, and most of the professional type designers use FontLab Studio. The <a href="http://www.fontlab.com/Typographic-Resources/Font-Typography-Books/Learn-FontLab-Fast/">Leslie Cabarga</a> book combined with the official FontLab Studio manual give you quite good documentation. And of course, FontLab Studio allows you to produce not only Type 1 fonts, but industry-strong TrueType and OpenType fonts. </p>
      <p>Fontlab Ltd. is working on new versions of both Fontographer and FontLab Studio, and I cannot at this point tell you much about them, other than that we intend to develop both lines of products. </p>
      <p>If you compare Fontlab Ltd. applications to Apple’s sound editing applications, then TypeTool is GarageBand, Fontographer is Logic Express and FontLab Studio is Logic Pro. Oh, and AsiaFont Studio is Logic Pro with all possible plugins ;) </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
