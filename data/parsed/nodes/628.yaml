  html: <p>Our type tutor said that the traps used on bell centennial were modelled after the shape of the crimping of the glass on cathode ray tubes. I thought the shapes were arbitrary. Were they, to anyone's knowledge, modelled after anything or nothing? thanky sai.</p>
