      <p>I have a copy of an old version of "Teach Yourself Calculus", in which there are a few pages with log and trig tables... set in old style figures. In the metal type era, at least, digits were monospaced whether they were old style or lining, because many typefaces came with only one kind of digit (although there were also several where both were available as alternates) and you could never be sure that at some point tabular matter would not be needed.</p>
      <p>With today's technology, providing additional alternates is much easier, and so getting away from monospacing, at least with oldstyle figures (also doing so with lining figures, even lining figures with small cap height, sounds very bold and adventurous to me) is now an option open to consideration.</p>
      <p>But given the precedent that digits were monospaced just about universally (except in the more outré display typefaces) a monospaced version should always be available as an alternate, I would think.</p>
