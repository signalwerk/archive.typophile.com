      <p>There was an Adobe publication (broadside, <cite>Font &amp; Function</cite>, was it?) a few years back where it was mentioned that when signage became an important part of printing in the latter part of the 19th century, a lot of the advertisements used full caps. SPECIAL TODAY! etc. The numbers of the time -- "old style" figures = looked bad with those full caps. So "Modern" figures became standard. From a timing perspective, "modern" figures are just as modern as the hoop skirt. </p>
      <p>As with so much for too long, advertising rules the type world.</p>
