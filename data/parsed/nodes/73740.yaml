      <p>I prefer the term text figures, since their temporary eclipse by lining figures in the nineteenth century doesn't make them old per se, just out of fashion for a while before people rediscovered that using lining figures within text is the equivalent of all-caps within text, i.e., shouting. I prefer to use lining figures in titles and other all-caps settings, numeric tables, folios, and other places where they stand apart from the text proper, and to use text figures otherwise.</p>
      <p>Effectively, lining figures are upper-case figures and text figures are lower-case figures, names I've not heard used much for them but that better describe their purposes.</p>
      <p>As long as we're distinguishing cases of figures, a far rarer case of figure that I use in a special circumstance is the small-caps figure - numerals scaled to work in strings of small caps. This setting was pointed out by Geoffrey Dowding in Finer Points on the Spacing and Arrangement of Type, namely when using strings entirely composed of small caps as display matter, such as in ads or in secondary or tertiary subheads. In these settings, text figures don't blend with the small caps much better than lining figures do, since none of the rest of the line has ascenders or descenders. However, although I do use small-caps figures with small-caps letters in these special situations, normally I pair small-caps letters with text figures. When small-caps letters are used in their usual setting, i.e. to represent acronyms or other secondary forms of emphasis within text matter, it's better to pair them with text figures, which blend better with the lower-case letters that make up the bulk of the line. The recent Linotype faces (such as Optima nova and Palatino nova), Lapture, Tabac, Underground, and Mrs. Eaves include small-caps figures; I wish more would.</p>
