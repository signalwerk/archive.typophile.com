      <p>Adobe Garamond (1989) was an important typeface, making all the bells and whistles of traditional typography available in the digital realm.</p>
      <p>However, FF Scala (1990) was the first digital typeface (and a new design, at that) to have old style figures as the default.<br>
      The lining figures were in its Capitals font.</p>
