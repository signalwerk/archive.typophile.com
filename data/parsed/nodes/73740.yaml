    <p>I know they're older than lining figures, and I read somewhere that lining figures fit better with the emerging styles of the early-20th-century Modern revolution, but the term "<a href="/wiki/oldstyle%20figures" class="freelinking" rel="nofollow">old-style figures</a>" has always puzzled me. It makes them sound outdated. I use them all the time where they're appropriate...</p>
    <p>Anyhow, just a newbie being curious. I'm eager to hear your responses.</p>
