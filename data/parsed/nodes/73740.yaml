      <p>Type was first knowingly modernized in the early 19th century.<br>
      It was understood at the time that technical improvements in printing necessitated a new style of type: it was described as modern at the time (more accurately now "didone"), although not named as such. Foundries then named their basic text types solely by the size.</p>
      <p>As well as the new didone style there were other changes, most notably dropping the long "s" and introducing lining figures.</p>
      <p>However, all the old type was melted down, so it wasn't around to be called "old style".<br>
      That comparison came in the mid 19th century, with the introduction of the modernized old-style, which was not a strict revival of any particular historical type, but a version of the modern type with certain old-style features -- including old-style figures, but not necessarily. It was called old-style, while the "basic" text type continued to be named by its size, or as just "roman": the modern was the default.</p>
      <p>I don't know when old-style figures were first referred to as such.</p>
      <p>Interestingly, when Futura was first published in the 1930s, it had old-style figures.</p>
      <p>Now, with the InDesign OpenType palette suggesting that all typefaces should have both old-style and lining figures, even if that creates anachronisms, the picture gets a bit post-modern. For instance, I have included old-style figures in Scotch Modern, which is a facsimile-class revival of a face that would never have had them.</p>
