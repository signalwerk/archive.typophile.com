    <p>hello, i am a journalist/grad student in new york working on an article about typography on the highway. am trying to track development of highway fonts, specifically the creation of fhwa series fonts (also known as highway gothic). all i have been able to determine is that highway gothic seems to have come out of caltrans research in 1940s and 50s, but nothing beyond that. but information on any of the different fonts that have been used on the highway would be great.</p>
    <p>i have contacted caltrans library, other transportation research centers, done all the database searches, etc. and can't seem to find exact inventor or any insight into the creative process behind the highway fonts we use today. the creators of clearview -- don meeker and james montalbano -- also don't know too many specifics. but maybe someone out there does? or has an idea of where to look? would be happy to talk in more detail with anyone who's interested. thanks in advance for any help.</p>
    <p>joshua</p>
