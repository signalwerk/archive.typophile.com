      <p>thanks for the links, i know the clearview story pretty well, that's what my article is essentially about. </p>
      <p>i'm afraid that the words of one highway engineer in texas with whom i spoke recently will prove true, "you are asking questions that don't have any answers."</p>
      <p>that said, i have spoken with the librarian at the uc berkeley transportation library, she is sending me some caltrans studies done in 30s and 40s, sounds somewhat promising from what i've heard so far. but i think it's safe to say that whomever created the fhwa fonts, it was a highway engineer and not a type designer. will let the board know what i find.</p>
