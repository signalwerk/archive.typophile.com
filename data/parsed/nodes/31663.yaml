      <p>At the risk of stating really obvious things you probably already found for yourself, you might want to look into published articles about Clearview, as they might contain information on the older U.S. highway signage systems.</p>
      <p>Here's a <a href="http://query.nytimes.com/gst/fullpage.html?sec=travel&amp;res=9E0DE5D81038F932A15752C0A9639C8B63" target="_blank" rel="nofollow">2005 article</a> from The New York Times, in case you haven't seen it. (I also remember that one of the design magazines ran an article on Clearview a couple of years ago -- if I can find it, I'll let you know which magazine and issue! Again, I apologize in advance if you've been down that road already -- no pun intended!)</p>
