      <p>"Any credence to this connection? Perhaps..."</p>
      <p>I personally believe it's more in the line of "Hm, spark sounds good. Active. Incentive. Yeah, name it so. Oh, and spell it with a Q: Sparq, [delete]so that it reads like Iraq[/delete], [insert]so that it catches the eye[/insert] and is conformist with new Web 2.0 naming conventions."</p>
      <p>I doubt the Marketing guys of Nike thought of the Roman (farfetched, admittedly) connection. I mean, you were the first to get it. Is that something specific American, or is it not en vogue to have classical education any more in general, a world phenomenon?</p>
      <p>Szabolcs</p>
