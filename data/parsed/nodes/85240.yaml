    <p>I was wondering if anyone could ID the font used on the cover and as titles in the book accompanying the V&amp;A exhibition "Power of Making: The Importance of Being Skilled". Doesn't even say inside what it's set in so little hope of naming the title font. I think it might be custom &amp; there was an initial edition with a different set of fonts, I want the one with the green bits. </p>
    <p>Link: <a href="http://www.vandashop.com/product.php?xProd=8948&amp;xSec=282" title="http://www.vandashop.com/product.php?xProd=8948&amp;xSec=282">http://www.vandashop.com/product.php?xProd=8948&amp;xSec=282</a><br>
    ISBN: 9781851776535</p>
