      <p>Nobody here seems to be taking this seriously, which isn't surprising.<br>
      Contemporary Brit artists tend to be big on gimmicky ideas, with rudimentary skills at actually making things.<br>
      This Four Corners series could be compared to a "ghost written" book.<br>
      So let's hope the real designer was well paid.</p>
      <p>The Dracula sounds interesting--a different typeface for each character--wow, what a brilliant idea! LOL.</p>
