      <p>I think that the historical context should indeed be considered when choosing typeface.  I work for a library system in the southern United States and we have our own "press," mainly focused on reprinting local historical texts.  I am the "design department" for these efforts, and I am constantly looking to original text samples (when available) to aid my choices.</p>
      <p>For example, I am in the process of re-designing a medical dissertation text from 1849, and am fortunate enough to have a scanned copy of the original typeface available to reference.  I have been able to find two fonts that come very close to matching the original, and am doing my best to present the text in a very similar way as that original.</p>
      <p>When making these decisions, the audience is another important consideration.  For most of our projects, the audience is "old-world local;" little old ladies and good ol' boys who want to preserve the "heritage" of the local area. As a consequence, I mostly don't venture into anything too modern, unless the subject matter calls for it or presents some room for re-interpretation.</p>
      <p>Very good, very thought-provoking question, ncaleffi...!</p>
