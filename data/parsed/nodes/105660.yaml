      <p>Generally, in the good old U. S. of A., a logotype is not copyrighted: it is either a trademark (™) or a registered trademark (®).</p>
      <p>The former offers common-law protection to the mark; the latter, when filed with the Patent Office, offers civil law protection.</p>
      <p>Or so I've heard...</p>
