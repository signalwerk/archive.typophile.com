      <p>Don't overlook the Celtic triskelion, triple spiral, and running man symbols. They may only have three segments, but they're Indo-European solar and good luck symbols nonetheless. There's also the lauburu (Basque cross) and the Japanese tomoe.</p>
      <p>Now, since there were three Axis members (ignoring, of course, the twenty-odd minor powers, co-belligerents, puppet states, and collaborator states), but the swastika has four legs, that can only mean that Hitler intended to enlist one more major power. Certainly, there were significant fascist and pro-German movements in the United States before WWII. Was Walt Disney Hitler's front man and subliminal propagandist in the United States?</p>
      <p>Well, when Leni Riefenstahl went to the US in 1938 to try to make film deals, Walt Disney was the only studio head who met with her. This means you should look for hidden Mickeys* in Victory of the Faith, Triumph of the Will, Day of Freedom, Festive Nuremberg, Olympia, and Tiefland. You can use the Chryse Planitia or Cydonia filters in Photoshop to do so (these were originally developed by NASA to identify human faces on Mars**).</p>
      <p>* <a href="http://www.hiddenmickeys.org/WhatIs.html" title="http://www.hiddenmickeys.org/WhatIs.html">http://www.hiddenmickeys.org/WhatIs.html</a><br>
