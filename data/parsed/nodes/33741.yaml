      <p>Okay - it's a day later. Thank you all for your concern about my poor little dog. </p>
      <p>The other dog, Lauren has been running around searching - including going many times to the last place she saw Bogie. I hope she will be okay. She always knew how to keep to herself for long periods of time -- it was Bogie that forced her to play, run, skip, jump and dance. (Yep the two of them would cha cha cha all over the living room.)</p>
      <p>As for swatstikas and Mickey Mouse - it is a laugh and a topic that to me, does not make sense here -- even in the "design" column.</p>
      <p>If you continue your research you will learn such lovely words as:</p>
      <p>"For the sheer power of the graphics," the sculptor Ernest Trova once said, "Mickey Mouse is rivaled only by the Coca-Cola trademark and the swastika."</p>
      <p>and I think you have twisted what Ernest Trova said into this ridiculous question.</p>
      <p>Or maybe you stumbled across a little bit of information in an anti-nazi campaign of the 30s - where Goebbels was portrayed as a mouse with a swastika -- in an attempt to allow the masses to know that the master race was not being controlled by the master race.</p>
      <p>Perhaps you are a fan of the art director Chip Kidd - who once said, ""...Graphic Design, if you wield it effectively, is Power. Power to transmit ideas that change everything. Power that can destroy an entire race or save a nation from despair. In this century, Germany chose to do the former with the swastika, and America opted for the latter with Mickey Mouse and Superman."</p>
      <p>and somehow in your giggly mind I think you take pleasure in antagonizing -- being familiar with some of your threads, I have noticed you just like to pick a topic, maybe confuse it even, and try to get people to jump. You probably don't even care what they are saying or how they are saying it. And if someone is oppose to what you say - you change your meaning in mid-stream. If some one is with you - oh, wait - I haven't found that yet, so I cannot comment.</p>
      <p>********</p>
      <p>I do thank you for taking my mind off my grief even only for a moment. </p>
      <p>I will now say kaddish for tens of millions of deaths, that includes 6 million jews, 6 million gypsy and Eastern Europeans, soldiers and civilians from all nations. Among that I will say an extra prayer for my own family members who did not survive the war. Followed by prayers for my mother, grandmother, great aunt, uncle - all of whom I've missed for the past 25 years and a special prayer for Bogie.</p>
      <p>Please try to be careful Miss Giggles - life is very short. The world is smaller than you think. And since I'm going for cliches - What comes around -- goes around.  Perhaps thinking what you really want to say and add to the community before writing would be a great asset to your future endeavors.</p>
      <p>*****<br>
      P.S. I see you have taken a shorter version of your quesiton to Yahoo<br>
      <a href="http://answers.yahoo.com/question/index?qid=20070424135335AA3XJeQ" title="http://answers.yahoo.com/question/index?qid=20070424135335AA3XJeQ">http://answers.yahoo.com/question/index?qid=20070424135335AA3XJeQ</a><br>
      and didn't get much of a response.</p>
      <p>Maybe that is the answer...</p>
