    <p>Apart from them being the same colours and the fact that Hitler dipised the Jews and so did Walt Disney. They were both icons of the 1930's  but the swaztika symbolised good luck. Is that true? and why would Hitler not allow students to wear the Micky Mouse badge when they were supporting Hitler? That's weird and he made them wear the swaztika instead. Did you know that Hitler was found with a Mickey mouse watch on? Hmmmm...so why did he get rid of Mickey mouse badges from students then? So back to my original question, they were both meant to be symbols but what of? Symbols of power? Were they both rebelious?<br>
    What about the crucifix and the swaztika? Do they have much more in common than that of Mickey mouse and the swaztika? I know that the swaztika is a bent cross from the religious cross so it derives from there but it was meant to be a symbol of well being. So from my knowledge, did the swaztika come before the cross or after but then it's confusing because they say that the swaztika derived from the cross so what came first? Anyone able to confirm?</p>
