      <p>Good point. I wasn’t clear about this, and didn’t think it clearly through in my head either when I wrote that.</p>
      <p>’Traditional’ probably wasn’t the best word. What I meant was the shape we conventionally think of when we think of lozenges, and I don’t confine myself to typographic lozenges here (although a quick check through the fonts on my computer show a range of about 50 to 80 degrees, with around 60 degrees being the typical angle). Do an image search of ’lozenge’ and see what kinds of shapes turn up. Something between 60 and even 90 degrees is typical.</p>
      <p>If we make a lozenge 3/4 of the cap height <em>and</em> make it 45 degrees, it will be quite small. Below, Georgia’s original lozenge is shown on the left and a 45-degree 3/4-of-cap-height lozenge that I quickly threw together is shown on the right, so you can appreciate the difference. Sure, I could have employed some tricks to make the new lozenge appear larger, and Georgia’s wide design arguably calls for a wider lozenge than usual, but I think this will do to illustrate my point.</p>
      <p></p><div class="imageWrap"><img src="/files/georgialozenges_6228.gif"></div><p></p>
      <p>I don’t think of the lozenge as a mathematical symbol, by the way. As I said before, I am of the opinion that the diamond-shaped mathematical symbols used in some specialized branches of mathematical logic are not typographical lozenges, but either a diamond that looks like a square rhombus or a diamond suit. Ideally, these should get appropriate typographical treatment (using special sorts for instance) and not be lazily substituted with typographical lozenges you find in most fonts.</p>
      <p>The typographical lozenge, as I take it, is a sort of generic symbol without such rigid expectations on its shape, like bullets. So the Microsoft Character Design Standards are a rough guideline only, and the designs where the lozenges reach cap height are not breaking some inviolable rule. Its width is not completely independent of the design, as I mentioned in connection with the Georgia sample above. Note that the Microsoft Character Design Standards also state that the advance width of the lozenge should be proportional to the design.</p>
