    <p>This is what the <a href="http://www.microsoft.com/typography/developers/fdsspec/symbol.aspx">Microsoft Character Design Standards</a> (which otherwise I have found a pretty good guide) have to say about the Lozenge:<br>
    “<em>Design:</em> This is an open diamond shaped character that is commonly three-quarters of the uppercase height with the strokes being monoline.”</p>
    <p>I just checked a bunch of fonts and the only ones I found that have the lozenge at roughly 3/4 the cap height are Verdana and Tahoma; very many are not even close.<br>
    Cap height or very similar seems to be the rule.</p>
    <p>1) What’s the story?<br>
    2) What is this thing used for, anyway?</p>
    <p>Cheers.</p>
