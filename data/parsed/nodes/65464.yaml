      <p>Actually, I doubt that there ever would be much occasion to use the White Diamond Suit ♢ in reasonable proximity to ◇ the White Diamond, such being the relative obscurity and unrelatedness of the two topics even if they both fall under the broad heading of mathematical logic.</p>
      <p>In any case, for such specialized usage, something like TeX would most likely be used, where the symbols would be entered as \diamondsuit in one case and \Diamond in the other. Then TeX would call up the right symbol font to supply these symbols. So unless you intend to make a symbols font usable in TeX, you don’t have to worry about any of this at all.</p>
      <p><cite>And re the 45/60 degree debate – surely that’s also at least a little bit dependent on the design &amp; proportions of the font, right?</cite></p>
