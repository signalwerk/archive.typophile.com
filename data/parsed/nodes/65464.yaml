      <p><cite>I assume the 1st loz isnotaloz, and you know the 2nd loz is small cap ht?</cite></p>
      <p>The first lozenge in the sample is indeed the lozenge included in the font Georgia, if that’s what you’re wondering. Or were you questioning whether Georgia’s lozenge was a true lozenge or not? Before this thread, I wouldn’t even have thought to question that...</p>
      <p>The second lozenge has exactly the same height as the original Georgia lozenge; it was mechanically modified from the original glyph only in the horizontal dimension to make it narrower while maintaining the same outline width. I have marked the sample below to show that this height is indeed around 3/4 of the cap height. Georgia has a large x height compared to the cap height, so this does turn out to be close to the small cap height. Maybe I should have chosen a different font, but I only picked the one serif font I assumed everyone was familiar with, being the font used for Typophile and all.</p>
      <p></p><div class="imageWrap"><img src="/files/Georgialozengesmarked_4109.gif"></div><p></p>
      <p>Now, on the 45-degree business, it seems that at least one technical definition of the lozenge is that of ’an equilateral parallelogram whose acute angles are 45 degrees’. The definition comes from <a class="freelinking-external" href="http://mathworld.wolfram.com/Lozenge.html">MathWorld</a>. It is immediately followed by the statement, ’Sometimes, the restriction to 45 degrees is dropped, and it is required only that two opposite angles are acute and the other two obtuse’.</p>
      <p>I did not know about this 45-degree requirement before. And to repeat what I said before, I think in popular usage no such requirement is in force, so that a range of 50-80 degrees is typical. Perhaps whoever put in the 45-degree requirement for the typographical lozenge on Wikipedia had the stricter technical definition in mind, assuming (wrongly, I think) that this also applied to typographical tradition.</p>
