      <p>Hold on, are we sure that the symbol used in modal logic is supposed to be the lozenge?</p>
      <p>I thought not, but on investigation, the situation seems a bit murkier. Wikipedia’s page on the lozenge seems to think so, for instance.</p>
      <p>In modal logic, the modality ’possibility’ is represented by the diamond shape, while ’necessity’ is represented by the box shape. Typographic preference would be for both symbols to be square-like, and you can see this from the above example. So the traditionally narrow lozenge would not be the best fit for this symbol.</p>
      <p>Indeed, in LaTeX, \Diamond and \Box are usually used for these symbols. \Diamond comes from the LaTeX symbol font and is a square diamond. The best match in Unicode might be ◇ ’White Diamond’ U+25C7. The \lozenge is separate in LaTeX, available from the AMS symbols package.</p>
      <p>My guess is that modal logicians have been using the square diamond symbol without ever meaning it to be a ’lozenge’, but their similarity has led to some confusion, or at least some imperfect solutions where lozenges are substituted when a proper square diamond symbol is missing. I think Wikipedia is wrong here; I see no reason at all to call the ’possibility’ symbol a lozenge. It’s not that lozenges are traditionally narrow but modal logicians like them square, but rather that modal logicians use a square diamond symbol that is somewhat similar in appearance but is a different character from the lozenge.</p>
      <p>Separately, in axiomatic logic, there is something called diamondsuit that is represented by ♢, the ’White Diamond Suit’ U+2662, as in the card symbol. There’s also the clubsuit, represented by ♣.</p>
