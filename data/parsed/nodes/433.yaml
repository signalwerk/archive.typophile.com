      <p>I think the most expensive font you can own -- is asking a type designer to design an exclusive font for you -- and have fun negotiating a price.</p>
      <p>Meanwhile, depending on what year you bought commercial fonts, I spent more than 900 US Dollars for the Gill Sans family from Monotype. I couldn't believe I was spending it. But considering I owned it all on typositor at $30 a weight, and on Alphatype $60 per weight -- spending the 900+ seemed like a bargain -- it included more weights than the typositor or typesetter did.</p>
      <p>Most I was ever taken for at one time -- Adobe. They put me on an automatic font release program. One January I came in on a bill for over $1500 -- it was everything I didn't need, old style numbers, mathematical fonts...how do I say it nicely? I was pi**ed.</p>
