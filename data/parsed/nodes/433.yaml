    html: |-
      <p>I can think of a few reasons to charge gazillions for a font:</p>
      <p>1. If someone will pay for it, then why not?<br>
      2. If you only sell one or two licences, then you can easily spot unlicenced use.<br>
      3. If people are paying that much, they are less likely to copy the font for their friends, and might even be careful about embedding it and such.<br>
      4. Having the most expensive font might bring at least a little fame or notoriety within the font community.</p>
      <p> - Lex</p>
