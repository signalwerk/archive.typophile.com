    html: |-
      <p>Hi Moira,<br>
      I doubt there the one list to rule them all.<br>
      A few links that might be helpful:<br>
      <a href="http://www.paratype.com">ParaType</a>: lets you search by encodings, e.g. <a href="http://www.paratype.com/asearch/default.asp?search=&amp;ftype=All&amp;ffoundry=All&amp;enclang=enc&amp;fenc=1&amp;x=19&amp;y=5">‘Cyrillic Standard’</a><br>
      Typophile Wiki: <a href="/wiki/Cyrillic" class="wiki">Cyrillic</a><br>
      MyFonts: fonts <a href="http://new.myfonts.com/tags/cyrillic/">tagged with ‘cyrillic’</a>; fonts that <a href="http://new.myfonts.com/search/charset%3Acyr">support Russian language</a><br>
      <a href="http://www.fontshop.com/search/?q=cyrillic">FontShop</a><br>
      <a href="http://cg.scs.carleton.ca/~luc/cyrillic.html">Luc Devroye’s link collection on Cyrillic type design</a><br>
      F</p>
