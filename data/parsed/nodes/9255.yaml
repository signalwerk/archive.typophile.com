    <p>Creators of Palemonas declare that an inducement to begin this work, was a need of independent, unlicensed, original and truely lithuanian font. Another reason � to insert diacritics and hundreds of specials marks used for philological researches. It is free. It is Unicode. And you can download it from the State Institution website. Palemonas was presented at the Govenment and leading newspapers. <br> <br>Officially it is said to be the �first original lithuanian typeface�. And that it was �inspired by types from Italian Renaissance�.  <br>I think that Palemonas is at least the redesign of S.Morison's Bembo. Moreover, I don't reject the probability of modification of existing digital typeface. <br> <br>I would be very pleased, if somebody answered me some questions: <br>Is it ethical �revival�, even if we don't know how it was made? Just look at the result. <br>Can we treate this font as original design inspired by Italian tradition in general? (as Aldine style Minion) <br> <br> <br> <br>I've read some stuff concerning revivals: �Revival of the Fittest. Digital Versions of Classic Typefaces�, �A Discussion on Type Design Revivalism� (Alejandro lo Celso, MA), �Call It What It Is� (by John Downer) and the TypeRight Guide to Ethical Type Design... but inspite of that, i'm full of doubts about originality of this typeface <br> <br>P.S. <br>Don't expect typographic adornments or irreproachable kerning... <br>Search for a yellow .zip icon at the right corner of this website:   <br><a href="http://www.vlkk.lt/" target="_blank">http://www.vlkk.lt/</a><!--attachment: palemonas_vs_bembo-65373.pdf*mime_pdf.gif*application/pdf*83.3*comparison*palemonas_vs_bembo%2epdf --></p><center><br>
