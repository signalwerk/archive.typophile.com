    html: <p>It is similar (aren't they all) to a font called China, which I only know in digital form as the FontBank font called <a href="http://www.buyfonts.com/value_for_money/chimes.htm" target="_blank">Chimes</a>. You use the U to make the N, or an alternate A, and you can recreate 70% of these bleeping 'Tech' fonts. Square off a corner here or there; take a notch out here or there, who could tell? Use Eurostile for the rest. Aarghh, I'll be glad when this look finally goes out of style! (Sorry for the outburst, I'll be better in a while.)</p>
