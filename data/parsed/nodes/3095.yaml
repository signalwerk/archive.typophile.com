    html: <p>Mike, I understand where you're coming from. I, too, get tired of some of these typographical clich�s.  <br> <br>In fact, when I did Changeling, it was as much in the spirit of a parody as it was a tribute to that style. What I tried to do was to take China, with it's very limited range of characters, fix the problem characters (at least in my opinion), and then push it over the top. Whether people get it or not, I don't really care. But it was fun to do. <br> <br>(I suppose if I want to go all the way, I should really do a swash version. :-)</p>
