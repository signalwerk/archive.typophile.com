    html: <p><i>With apologies to Mike. :-)</i> <br> <br>No, Mark, the apologies should be mine -- I should have recommended Changeling, and would have, if I had known about it. You have several of the alternate letterforms already made, and the variety of weights certainly makes it more versatile. <br> <br>That geometric style fits well with much of your retro repertoire, and in fact I group the square tech look in with the Bauhaus-style geometric fonts in my Bauhaus-style Font ID Guide. The simplicity of the tech look seems in keeping (to me) with the Bauhaus principles of reducing type to simpler forms.  I just get ill over the clich� that has equated square fonts with high technology. It might have been you who pointed out the ironic connection between the square fonts and the simple, and relatively unsophisticated LCD-style letterforms. Lo-Tech surely, by today's standards.  <br> <br>Don't mind me, I rant sometimes.</p>
