  html: |-
    <p>Hi all, for a Dutch foundation I'm looking for a serif/sans combination for their quarterly reports. Besides bodytext, the reports have quite a lot of tables, info- and discussionboxes and portrets. So I will be using the sans a lot.<br>
    Now the foundation wants 'something fresh' – whatever that may be. </p>
    <p>Anyway, they rejected my Scala/Scala Sans and Haarlemmer/Haarlemmer Sans proposals (which I both use daily). Miller/Meta new, they are taking in concideration.<br>
    They don't mind herhaps purchasing fonts – also for future use. I've been looking at Lisboa from Fountain, nice but I'm not sure wether I like the numerals. But definitely refreshing.</p>
    <p>Some help would be highly appreciated; anybody got any ideas or suggestions? Thanks in Advance, Brieck</p>
