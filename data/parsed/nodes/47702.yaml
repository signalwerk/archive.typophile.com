      <p>Thank you both for your suggestions. While I was checking out the fonts, I received an email with an idea of their own: Dolly. Obviously an employee came up with this suggestion. I've done a few books with Dolly in the past – never could make it sing on the page.<br>
      Besides, I find it a bit obligatory by now. Anyway, they like it, I don't. So any suggestions to alternatives (that come close to Dolly) would be very welcome. The only one I could find so far was <a class="freelinking external" href="http://www.suitcasetype.com/index.php?lmut=en&amp;part=fonts&amp;font=9 " rel="nofollow"> Dederon</a><br>
      Thanks in advance, Brieck</p>
