    html: |-
      <p>Here's a Dutch combination (probably a little obvious to you, but it has any possible kind of numerals you may want for tables etc): TheSans + TheAntiqua from LucasFonts.com.   Taz is another of Lucas' sans-serifs, a little less "warm and friendly" than TheSans. Also, you probably know Fresco/Fresco Sans by Fred Smeijers (OurType).  From the same foundry, the gorgeous Versa by Peter Verheul. The sans version may be to close to the serif though to really stand out.<br>
      Outside Holland, have you looked at Leitura from Dino dos Santos? A family with sans, serif, news and headline fonts.<br>
      Veel succes! Jan</p>
