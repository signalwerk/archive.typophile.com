      <p>hhp, oh man, you made my day. I didn’t know I drew a danish /g/, but I’m very happy!<br>
      I’m already approaching your advices. Thanks a lot.<br>
      But remove all the serifs, really? This hurts. I think it’s important for it’s industrial charm. Makes it rougher, though. I get the feeling of an old wooden box or conex here.</p>
