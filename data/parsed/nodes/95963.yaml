      <p>I think this is a pretty nice mix of conventional elements and funky ones - good job! Like the "n" is pretty normal, but the "y" is novel, without however being showy. And yes, go with the funky caps for sure.</p>
      <p>The "g" (which, I don't know if you realize, happens to be very Danish*) needs a bigger gap between the head and the join. I would also think some more about its ear.</p>
      <p>* <a href="http://www.flickr.com/photos/tags/danishg/" title="http://www.flickr.com/photos/tags/danishg/">http://www.flickr.com/photos/tags/danishg/</a></p>
      <p>If the funky cap "W" has splayed sides, maybe the "M" should too? BTW I'm not sure about using those funky structures in the lc. My gut feeling is no (although as alts they'd sure be great).</p>
      <p>I would flatten the top of the "t".</p>
      <p>The "3" is quite nice!</p>
      <p>I can't agree with Dave about the eszets - in fact I would remove <em>all</em> the serifs/bars, except <em>maybe</em> the foot one in the lc.</p>
      <blockquote><p>I meet a nice girl from Kopenhagen as I started designing this font</p></blockquote>
      <p>For some reason that happens quite often! :-)  Then you have kids and they start inspiring you.</p>
      <p>hhp</p>
