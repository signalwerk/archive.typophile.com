      <p>The <a href="http://www.microsoft.com/typography/otspec/head.htm" target="_blank" rel="nofollow">head</a> table. xMax is the topmost extremum found in all glyphs, usually calculated automatically e.g. by FLS5.</p>
      <p>As to the more general question: Like every testing tool, FontValidator tests what its programmers told it to test. Regard results as hints -- in the end it is <em>you</em> who decides if this or that is an error or not.</p>
