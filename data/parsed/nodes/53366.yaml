    <p>Hi,<br>
    (Point 1) Have been running my font through Font Validator and researching, and I cannot in layman's terms find an explanation or definition of 'head.yMax'</p>
    <p>(Point 2) Also noticed that Font Validator nearly finds fault with every Font I own that I run through it. What is it with that?</p>
    <p>I run free &amp; nasty fonts off the web through Font Validator.<br>
    Problems found with the font.</p>
    <p>Beautifully designed and reputable commercial fonts through it.<br>
    Problems found with the font.</p>
    <p>Fonts that come with Apps through it.<br>
    Problems found with the font.</p>
    <p>Font Validator normally has issues with most of my fonts.<br>
    Yet, the Fonts run correctly in real life?</p>
    <p>So I think, what chance has a newbie got with Font Design when Font Validator picks out something on every font!...whether it's processes or standards being left out,wrong sizing, contours or nodes not being to its liking, etc?</p>
    <p>Please comment on either point.<br>
    Cheers</p>
