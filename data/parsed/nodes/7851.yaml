  html: <p>Hello, <br> <br>At work we have an epson stylus pro 4000 since using it I have noticed that the type in anything I print out, on close inspection, is quite fuzzy. No clean curves. <br> <br>The problem is not with the fonts, its the same in all cases, and they print out perfect on other printers. The images print out great but the type is slightly rough. <br> <br>Am i expecting too much from this printer? or maybe is there a setting im unaware of that may help. <br> <br>Ive tried convert to outlines which results with the same outcome and the outlines fonts now print bolder, which i know shouldnt be the case. <br> <br>Any ideas greatly appreciated, <br> <br>David.</p>
