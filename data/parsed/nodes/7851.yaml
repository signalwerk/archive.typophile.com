    html: <p>I'll second Chris' comment about paper. With any inkjet printer, using good paper can make a huge difference in print quality. The right paper can minimize the bleed one gets at the edges of letters. <br> <br>Additionally, like most printers, yours has variable resolution. You want to make sure it is set to the highest possible resoltution in the printer driver. <br> <br>All that being said, I can't tell from that sample whether you're already at the maximum resolution or not. <br> <br>Regards, <br> <br>T</p>
