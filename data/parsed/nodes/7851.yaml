    html: <p>Thanks everyone, the problem was that the postscript RIP was installed but not added to the printer list or at least couldnt be, I uninstalled and installed it again, added to the printing list and now its printing type as clear as I imagine its going to get. <br> <br>Thanks for your help.</p>
