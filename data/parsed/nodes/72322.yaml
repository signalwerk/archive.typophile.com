    <p>Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, has released the 16-font ITC New Esprit™ typeface family into the ITC® typeface collection. Available in both text and display versions, ITC New Esprit can be viewed, licensed and downloaded from the company’s Fonts.com, ITCFonts.com and Linotype.com e-commerce sites. </p>
    <p>“ITC New Esprit beautifully blends precision and legibility with personality and lyricism,” said Allan Haley, director of words and letters at Monotype Imaging. “It’s also an exceptionally comprehensive typeface family.”</p>
    <p>ITC New Esprit was created by Jovica Veljović, who designed the ITC Esprit® typeface more than 25 years ago. Veljović took the basic letterforms of his original typeface to create two variants of ITC New Esprit: one for improved text composition and the other for display typography. “At first, I wanted only to clean up a few characters and expand the kerning pairs,” said Veljović. “I soon realized that some characters could benefit by more refined shapes and proportions. I ended up working on just about every character in the original design.”</p>
    <p>The text designs are characterized by strong serifs, a moderate contrast in stroke weight and an ample lowercase x-height to aid readability. To help ensure optimum readability at small text sizes, ITC New Esprit text fonts are also designed with slightly wide proportions and sturdy thin strokes.</p>
    <p>The display designs are more condensed than their text counterparts. “The condensed nature of the display faces translates to space saving benefits for graphic communicators,” said Haley. “Veljović also imbued subtle design touches that become more profound at large sizes, creating a vitality that is ideal for display typography.”</p>
    <p>ITC New Esprit comprises 16 typefaces that are available in four weights (from regular to black), each with an italic counterpart in the text and display variants. All ITC New Esprit fonts are available in the OpenType® format, which supports both Windows® and Macintosh® platforms. Selections are also offered as OpenType Pro fonts, which enable the ability to apply advanced typographic features and effects, such as the automatic insertion of old style figures, ligatures and small capital letters. ITC New Esprit Pro fonts provide an extended character set to support the English and Romance languages, in addition to most Central European and Eastern European languages. </p>
    <p>Availability<br>
    Individual fonts, selection packs and typeface families can be viewed, purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a> and <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. Customers may also contact Monotype Imaging in the U.S. toll-free at 800-424-8973, or in Europe at +44 (0)1737 765959, or 001781 970-6020, option 2. Linotype in Germany can be reached at +49 (0) 6172 484-418. Customers from other parts of the world may dial 001 781 970-6020 (U.S.).</p>
    <p>About Monotype Imaging<br>
    Monotype Imaging (Nasdaq: TYPE) combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras, e-book readers and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 13,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
