    html: <p>Pngs are supported by IE7, Firefox, Safari etc. Supersleight.js (google it) brings IE6 up to standard as well (but with a tell-tale flicker on page loading). Roughly two thirds of browsers support png fully, and with hacks for IE6 99% of browsers do.</p>
