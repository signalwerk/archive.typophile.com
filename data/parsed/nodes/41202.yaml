    html: <p>The site looks great.  There is one issue, though.  The logo is not rendering very well.  The type and icon appear jagged.  It seems that you have used a transparent gif.  You should try a png-24 instead, which preserves transparency much better than a gif.  I believe you'll find that it looks much better.</p>
    html_clean: <p>The site looks great.  There is one issue, though.  The logo is not rendering very well.  The type and icon appear jagged.  It seems that you have used a transparent gif.  You should try a png-24 instead, which preserves transparency much better than a gif.  I believe you'll find that it looks much better.</p>
  - id: 253750
    user: 2172
    date: 2008-01-24T08:50:00
    date_raw: 24 Jan 2008 — 8:50am
    votes: null
    html: |-
      <p>I agree with dch, but I don't know if .png is the best solution. Is it fully supported by the major browsers now?</p>
      <p>The site and logo feel solid and contemporary. I admit, it feels so solid and contemporary that it lacks unique personality for me as a designer. But I imagine for your clients, it's very appealing. I wish the aesthetic of the top navigation was allowed to wander beyond the top area. I prefer the more intriguing and sophisticated dark/light thing you have going over the beige on tan on beige of the rest of the site. Though this allows your work samples to really pop forward, which I imagine was your intent.</p>
      <p>Ultimately, it's a taste thing, so go with your gut.</p>
      <p>Oh, one more thing. I really, really want the tail of the 'a' in your logo to have some custom adjustment to follow the curve of the of the 't' it's next to. The 'ut' in 'south' feels better to me, even though I can tell they aren't following the exact same curve. The at looks so close that my brain wants it to be the same curve, but not different enough for it to feel intentional. Though this may simply be a result of the low resolutions of the screen being less faithful to the full resolution version.</p>
      <p>Again, your site is solid and appears to do exactly what you're looking for, and isn't that what design is all about? Nice stuff. I will now just quietly envy your beautiful locale from my office in chilly Philadelphia.</p>
    html_clean: |-
