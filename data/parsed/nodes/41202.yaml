    <p>Hello Everyone,</p>
    <p>I'd greatly appreciate some feedback from the experts here. We've just launched the new South Creative portfolio/site.<br>
    Any thoughts, suggestions, criticisms regarding the logo, web typography, and layout is much appreciated.</p>
    <p>Most of the website body is set in Georgia (not like there's many other Serif choices).</p>
    <p>The site:<br>
    <a class="freelinking external" href="http://southcreative.com.au/gold-coast-web-design.html" rel="nofollow">Gold Coast Web Design by South Creative</a></p>
    <p>For those of you who commented in my previous thread, I ended up going with Freight Text as body text (in documents) to compliment the logo type. </p>
    <p>Cheers,</p>
    <p>Trevor</p>
