      <p>Hi Kris,</p>
      <p>We have a similar place here called the <a href="http://home.vicnet.net.au/~typo/welcome.htm" rel="nofollow">Melbourne Museum of Printing</a>. It's called a museum, but it's basically a huge warehouse o' stuff in piles that survives because of the passion of a dedicated few. I've been a couple of times to see the machines they have working in action, and the main guy, Michael, gets so excited. It's brilliant. </p>
      <p>One way that they've tried to get themselves out into the public eye (well, the design public eye anyway) is through the AGIdeas design conference that runs annually here in Melbourne. Design Nights are held on the first night of the conference where groups of students get to go and spend an evening at a design studio somewhere around Melbourne. MMP has been involved over the last two years, and from what I've heard the nights have been very successful, with students heading back later to get a print or a bit of type made for an assignment, or whatever.</p>
