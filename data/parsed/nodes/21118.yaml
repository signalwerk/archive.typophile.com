      <p>The <a href="http://www.museumofprinting.org/" rel="nofollow">Museum of Printing</a> has such a collection. You could e-mail them and ask them what they are doing to promote themselves. One thing is that they have regular visits from students at design schools in the area. </p>
      <p>I visited it this spring and it is wonderful. </p>
      <p>Another thing they are doing is co-sponsoring TypeCon this year. There will be a trip to the museum also as a final activity. </p>
      <p>The Museum of Printing also holds the Merganthaller Linotype library of over 250 thousand measured drawings of type, including Dwiggins' types--pretty amazing stuff.</p>
