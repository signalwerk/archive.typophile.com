    <p>Hi all,</p>
    <p>Last night I made a trip out of town into the middle of nowhere to find a place called the <a href="http://www.bedplatepress.org.nz/" rel="nofollow">Bedplate Press Printing Museum</a>. The chaps there are total enthusiasts, all skilled in various areas of letterpress, Intertype / Linotype machines, rotary &amp; platen presses. The have a fairly solid collection of wood type, hand-set metal type (Univers! Yes!) and those Linotype/Intertype matrices (I think that is what they are called). It is most definately a working museum. </p>
    <p>Anyway, my head was reeling last night, all I dreamed about was what I could do with this stuff. However, I am aware that it may be of limited interest to other people, especially in New Zealand. So I was wondering what we could do to garner interest in the museum. What have others done to revive interest in this beautiful technology? Who would be the ideal people to target? What sort of businesses would benefit from letterpress printing? </p>
    <p>Any ideas would be gratefully received. </p>
    <p>—K</p>
