      <p>Oust I believe is Timothy Donaldson'e Airstream.<br>
      I think it may seem to have a similar feel, but overall maybe not very close.</p>
      <p>You might try something like:</p>
      <p>One of MIchael Clark's designs P22 Pooper, Sneaky or Sweepy.<br>
      If you open these up a bit and stretch a few things you could come reasonably close.</p>
