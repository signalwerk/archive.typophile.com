    html: |-
      <p>Don't make it too complicated. We humans are born in a way that we see signs everywhere and in many things. We are experts in interpreting them. Everything we see we interpret with the informations we already have. </p>
      <p>So a sensible approach to study the semiotic aspect of a subject is to understand what other people, or even the creator, say about the studied subject, not as facts or knowledge, but as interpretation or “reading”. Yes, depending on the “ aesthetic database” and the level of awareness people will say different things, but that can be put into the respective context of the person making a statement. People will always do interpretative work anyhow on things we understand as signs, because they try to figure out the meaning. </p>
      <p>Btw, I send you a message through the forum software to your mail account you are registered here with.</p>
