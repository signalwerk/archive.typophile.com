    html: |-
      <p>Not a lot to go on -- the i and the t are probably customized, the u an n are fairly generic, and the the sample's too small to get much info from the s.</p>
      <p>The bold/black weight humanist sans like Frutiger or Myriad would get you pretty close.</p>
