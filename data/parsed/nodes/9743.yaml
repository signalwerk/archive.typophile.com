  html: "<p>Hi!  I operate the site: <br> <br><a href=\"http://www.lunaroma.com\" target=\"_blank\">http://www.lunaroma.com</a> <br> <br>Currently we have a CGI shopping cart that works pretty well.  Basically, I maintain MySQL tables of our products, sizes, scents and prices.  I have PHP pages that read the MySQL tables, and using forms, call the CGI shopping cart scripts necessary to add items to the cart.  I like how this works, because we have many products, and I already have a PHP interface I use to maintain the products. <br> <br>One crucial aspect of the CGI shopping cart is that it allows us to see pending orders, in order to calculate actual shipping costs before we charge credit cards. <br> <br>But, not being a CGI person, I cannot customize the shopping cart, nor can I pass PHP session variables to the invoice.  Also, the CGI cart has one drawback...it requires cookies. <br> <br>So I want to switch to a PHP shopping cart that provides the same flexibility.  One that does ONLY the cart portion...not the inventory and product tables.  One that I can pass information to from my pages in order to add items to a user's shopping cart. <br> <br>All of my research has only uncovered PHP shopping carts that you have to enter all your products into.  Are there any PHP shopping carts that ONLY provide the shopping cart and invoicing piece, and allow the web master to handle the products and pricing tables? <br> <br>Thanks in advace, <br> <br>Matthew Brand <br>Lunaroma, Inc.</p>"
