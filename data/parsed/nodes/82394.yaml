    <p>We've been developing an OTF font in Fontlab Studio 5.0.2., Windows, periodically generating the font and using it in InDesign CS3, Windows for testing. Everything has been going well until yesterday when InDesign started locking up while trying to output a PDF with the font. InDesign also cannot display the font in its glyph pallet. Again, it locks up.</p>
    <p>I have Roman, Italic, Bold and BoldItalic fonts. Roman and Italic have the problem, Bold and BoldItalic do NOT! Compared to other professional fonts there is little by way of features and classes and I've tried deleting all the classes and features and copying them from one of the fonts that works.</p>
    <p>I've narrowed the problem down the small caps, I think. When I set a single line of type in InDesign it will PDF. Turn the small caps on for even a single character and InDesign locks up trying to export a PDF. I'm suspecting the glyph pallet won't display because it also would have to access the small caps.</p>
    <p>I know there is little to on here as far as problem solving info, but I'm hoping someone as seen this issue with InDesign and can give me something else at which to look.</p>
    <p>Thanks,<br>
    Ken</p>
