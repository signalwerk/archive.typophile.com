      <p>Well, so much for the left over stuff theory. Tried to use the font on a machine that had never before run CS3 to no avail. Same issues.</p>
      <p>On another forum I received a reply that someone saw strangeness in InDesign, though not specifically what I'm seeing, that he found was related to an error in the OTF language processing in CS3, fixed in CS4. So I'm now looking at the language stuff, though I don't see anything right off.</p>
      <p>Oy.</p>
