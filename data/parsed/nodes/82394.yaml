    html: |-
      <p>OK, fixed the problem but haven’t solved the mystery.</p>
      <p>The font has a rather large liga feature designed to be used for keyboarding of multiple Greek accents. One of the last things I did was to re-encode a glyph from the private use area to the Unicode standard. Trouble was, I didn’t update the liga feature with the new glyph’s name, so InD couldn’t resolve the liga substitution to a glyph that wasn’t there.</p>
      <p>Curiously, CS5 was able to resolve, probably more like ignore the issue.</p>
      <p>What was so perplexing is that I kept comparing the features and classes of fonts in the family that worked, and those that didn’t and they were identical. So, the mystery still remains as to why two of the fonts worked and two didn’t even though they all had the same liga feature with the error in it. And also why it would PDF from InD without small caps in the file, but not with small caps.</p>
      <p>I’ve set the bummed out FontLab files aside, maybe if I see something along the way I’ll go back and try and solve the last mystery.</p>
      <p>Thanks again for everyone’s help!</p>
      <p>All the best,<br>
      Ken</p>
