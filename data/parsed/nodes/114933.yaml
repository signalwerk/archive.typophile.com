    html: |-
      <div class="comment-spam-body"><p>While I did not personally write this post, this article provides the best explanation as to why the new Olive Garden logo fails by a landslide <a class="freelinking external" href="http://www.adrants.com/2014/03/heres-whats-wrong-with-olive-gardens.php" rel="nofollow">http://www.adrants.com/2014/03/heres-whats-wrong-with-olive-gardens.php</a> </p>
      <p>Imho, what's wrong with the new logo has more to do with tonality than design style. The new logo looks more like something you might design for a frozen yogurt shop. It's particularly juvenile in appearance - not that juvenile is bad, but it isn't appropriate for a sit-down restaurant where a couple is expected to pay $60 for dinner, and that's before the wine arrives.</p>
      <p>I didn't love the old logo either. It was complex and clunky, and completely over designed. But this one is infinitely worse because it says "cheap, fast and easy " -- a far cry from the sophisticated class of customers that OG wishes to attract.</p>
      </div>
