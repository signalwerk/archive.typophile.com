      <p>While the old and new logos have big differences, I don't think customers will be confused. It's not unusual for companies to make significant changes to their logo. Some customers won't even notice the logo change.</p>
      <p>I'm not in love with the new logo, but it's okay. A lot of the criticism at the Brand New site is due to negative reactions to Olive Garden itself. Sure it's not the best or most authentic Italian food, but people don't go to Red Lobster, Applebees, or Olive Garden for fine dining, they go for a decent meal at a reasonable price.</p>
