    html: "<p>Curve-wise, I think the lack of optical compensation where strokes meet is a problem. I also think there is a style conflict within the word: some letters appear constructed and static, only with a tail or swash tacked on as an afterthought – others appear more fluid. It’s all over well composed and the swashed capitals are very charming. The twig is nicely drawn.</p>"
