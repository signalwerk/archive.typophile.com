    html: |-
      <p>Negative reaction to this "update" is quite reasonable given that they are effectively discarding *everything* but the name and re-creating the brand from scratch. These two logos are completely unrelated. They don't share the look, they don't share a feel and they imply a completely different restaurant atmosphere. The company effectively is closing down all existing Olive Gardens and opening something different instead. *This* is what people don't like, not the curves on the glyphs.</p>
      <p>Imagine Coca-Cola deciding to re-brand using a geometric sans-serif against steel-gray background. Same here.</p>
