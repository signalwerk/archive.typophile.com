  html: |-
    <p>So I'm sure everyone's heard of <a href="http://www.underconsideration.com/brandnew/archives/new_logo_for_olive_garden.php#.UyFQL-ddWhY" rel="nofollow">Olive Garden's rebranding</a>. So far most of the feedback I've seen online seems to be negative.</p>
    <p>I'm still pretty wet behind the ears as a designer, and I'm afraid that whatever atrocious errors those with more experience see in this logo are completely flying over my head with a great billowy <em>swoosh</em>.</p>
    <p>Could I trouble anyone for a constructive crit about what works and doesn't work with the logo? I feel like if I could put myself behind your typographically-attuned eyes, I could hopefully learn something.</p>
    <p>Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Olive-Garden-Logo-Redesign-2014_4762.png"></div><p></p>
