    html: <p>Never heard of Olive Garden or the re-branding! I like it your design and it looks better with the brown background on the website.  The old logo was horrible kitchen-kitchy with the words "olives" and the image of grapes together giving instant brain-pain.  In this design the lettering is elegant and friendly, but perhaps a bit too large compared with the olive branch?  If the owners prefer it, you can have some continuity with the old design by embossing the lettering and drawing slightly, even giving the lettering a slightly rough edge?  The olives can be a bit more elongated.</p>
