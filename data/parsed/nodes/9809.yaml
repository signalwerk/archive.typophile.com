  html: <p>Hello all, first post, newbie typophile. <br> <br>I am working on a lawyers business card and letterhead which uses Copperplate Regular true type version. I have been asked to find a fitting sans serif companion that is mac/windows available to be used as the body copy. <br> <br>Also, a script (my inclination) or other style font to be used in creating a monogram with the letters DRB. The client (really a friend of a friend who owes a favor) just wants something simple, no connecting letters or anything, just something to put in the background, a watermark if you will. <br> <br>As a side note, I have found great info here, and references to great reading as well, which is simply awesome. Thanks everyone.</p>
  html_clean: <p>Hello all, first post, newbie typophile. <br> <br>I am working on a lawyers business card and letterhead which uses Copperplate Regular true type version. I have been asked to find a fitting sans serif companion that is mac/windows available to be used as the body copy. <br> <br>Also, a script (my inclination) or other style font to be used in creating a monogram with the letters DRB. The client (really a friend of a friend who owes a favor) just wants something simple, no connecting letters or anything, just something to put in the background, a watermark if you will. <br> <br>As a side note, I have found great info here, and references to great reading as well, which is simply awesome. Thanks everyone.</p>
