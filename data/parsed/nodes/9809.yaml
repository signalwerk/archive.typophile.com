    html: <p>It depends on what you're trying to convey. For a strong, formal, traditional effect, try <a href="http://www.myfonts.com/fonts/bitstream/bank-gothic/">Bank Gothic</a> (also see the E+F version). If you want something a little more stylish, I'd go for <a href="http://www.myfonts.com/fonts/ef/bernhard-gothic/">Bernhard Gothic</a>. <br> <br>There are a number of classic fonts, though, that I'm sure would work. Franklin Gothic (make sure to get a good version), Gill Sans, Frutiger, even Helvetica. <br> <br>For the monogram, may I suggest <a href="http://www.myfonts.com/fonts/linotype/snell-roundhand-script/">Snell Roundhand</a>. It's very elegant and formal, but still quite legible.</p>
    html_clean: <p>It depends on what you're trying to convey. For a strong, formal, traditional effect, try <a href="http://www.myfonts.com/fonts/bitstream/bank-gothic/" class="link-external">Bank Gothic</a> (also see the E+F version). If you want something a little more stylish, I'd go for <a href="http://www.myfonts.com/fonts/ef/bernhard-gothic/" class="link-external">Bernhard Gothic</a>. <br> <br>There are a number of classic fonts, though, that I'm sure would work. Franklin Gothic (make sure to get a good version), Gill Sans, Frutiger, even Helvetica. <br> <br>For the monogram, may I suggest <a href="http://www.myfonts.com/fonts/linotype/snell-roundhand-script/" class="link-external">Snell Roundhand</a>. It's very elegant and formal, but still quite legible.</p>
