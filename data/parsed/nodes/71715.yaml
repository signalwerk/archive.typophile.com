      <p>“What are the fonts … ?” </p>
      <p>I don’t think you’ll ever find a good answer to that. Most of the people on Typophile (if you’re not counting the general ID requesting crowd) are type designers, and we continue to draw new typefaces because we believe they can add something. The “best” font is certainly not a static thing, if it’s even a thing in the first place.</p>
