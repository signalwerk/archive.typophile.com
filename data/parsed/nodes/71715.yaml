      <p>1) Brushscript.<br>
      At least if you want to open a stall in the market, a cafeteria near a railway station or design a logo for a knitwear brand. I once started to make a photos of usage of brushscript in business environment. The trend ir transcontinental, I swear.</p>
      <p>2) Mistral.<br>
      Preferred by sportswear and vegetable stands in the market. Or a youth oriented magazine.</p>
