    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Word&nbsp;shape</strong></p>
    <p>Word shape is the overall visual impression of the outer boundary of a given word. Word shape is attributed as one of the key factors in <a href="/node/19563" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">readability</a> and is widely considered the reason that <a href="/node/13807" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lowercase</a> words are more readily recognizable than their <a href="/node/14510" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uppercase</a> equivalent. The belief is that because uppercase words always have a rectangular word shape they are less distinct than lowercase words which have a varying word shape, given definition by <a href="/node/12043" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ascenders</a> and <a href="/node/12051" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">descenders</a> that create unique, and therefore more recognizable&nbsp;shapes.</p>
    <p>Word shape is believed to be one of the two probable ways that information is processed by the eye. Researchers are divided between word shape recognition and <a href="/node/39767" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">letter identification</a> as the process by which information is processed during&nbsp;reading.</p>
    <p>See also <a href="/node/19563" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">readability</a>.</p>
