    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Word shape</strong></p>
    <p>Word shape is the overall visual impression of the outer boundary of a given word. Word shape is attributed as one of the key factors in <a href="/wiki/readability" class="freelinking" rel="nofollow">readability</a> and is widely considered the reason that <a href="/wiki/lowercase" class="freelinking" rel="nofollow">lowercase</a> words are more readily recognizable than their <a href="/wiki/uppercase" class="freelinking" rel="nofollow">uppercase</a> equivalent. The belief is that because uppercase words always have a rectangular word shape they are less distinct than lowercase words which have a varying word shape, given definition by <a href="/wiki/Ascender" class="freelinking" rel="nofollow">ascenders</a> and <a href="/wiki/Descender" class="freelinking" rel="nofollow">descenders</a> that create unique, and therefore more recognizable shapes.</p>
    <p>Word shape is believed to be one of the two probable ways that information is processed by the eye. Researchers are divided between word shape recognition and <a href="/wiki/letter%20identification" class="freelinking" rel="nofollow">letter identification</a> as the process by which information is processed during reading.</p>
    <p>See also <a href="/wiki/Readability" class="freelinking" rel="nofollow">Readability</a>.</p>
