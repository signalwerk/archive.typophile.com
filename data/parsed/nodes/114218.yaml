      <p>Ran the font through font forge, and you're right. Apparently NameID #3 and #6 are required to make a font installable. So I suppose that solves half the problem; the other being "where might one find documentation on these requirements rather than discovering them through experimenting" =)</p>
      <p>Thanks for pinpointing the name table!</p>
