      <p>A decade ago Windows didn't complain about those missing naming fields.</p>
      <p>So I'm afraid there is no easy answer as there are requirements, recommendations, and assumptions. The specs evolved. Same goes for Windows.</p>
      <p>To make it worse; there might even be font validation or rasterizer bugs involved. But that is also an assumption ;-)</p>
      <p>Also be aware Microsoft Font Validator doesn't check for all possible issues, and sometimes incorrectly detects an error.</p>
