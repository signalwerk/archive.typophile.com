    html: <p>Not to divert the subject back to the orignal question, because I find this side note Gill's life interesting in a disturbing way.  But, in school we had a similar challenge.  We had to  choose 1 typeface and use it on the table of contents page for an international design magazine(1960's era Graphis) (index, articles, 3 laungages, side notes, publisher information, subscrition information...etc)  The idea being to take one face and build the appropriate heirarchy and maintain readability.  I chose Futura because of it's extensice family and legibility in both large, small and text sizes. It is clean, modern and geometric in nature. and for the most part sterotypically void . It was a fun &amp; challenging when your so used to having 100's of fonts to choose from on a daily basis. <br>Futura</p>
