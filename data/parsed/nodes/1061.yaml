    html: "<p>If I had to live with just one typeface, I'd pick one that would work well as a text face at most sizes, especially small. It's easier to make a text face work as a display face than to make a display face work as a text face. As such, most sans serifs would be ruled out, although a few might be in the running, like Gill Sans, Syntax, Scala Sans, Myriad, and the like. <br> <br>If we're allowing the whole typeface family, I wouldn't worry so much about having an extensive range. The old masters made do quite nicely with roman, italic and bold. Instead, I'd focus on beauty, legibility, readability and timelessness. <br> <br>My choices would likely boil down to one of: <br> <br>a. AGFA-Monotype or Linotype Plantin: <br> <br><a href=\"http://www.myfonts.com/fonts/agfa/plantin/\" target=\"_blank\">http://www.myfonts.com/fonts/agfa/plantin/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/plantin/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/plantin/</a> <br> <br> <br>b. either Adobe Garamond or Stempel Garamond: <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/adobe-garamond/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/adobe-garamond/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/stempel-garamond/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/stempel-garamond/</a> <br> <br> <br>c. either Adobe Jenson, URW++ Cloister or Font Bureau Hightower: <br> <br><a href=\"http://www.myfonts.com/fonts/adobe/jenson/\" target=\"_blank\">http://www.myfonts.com/fonts/adobe/jenson/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/urw/cloister/\" target=\"_blank\">http://www.myfonts.com/fonts/urw/cloister/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/fontbureau/hightower/\" target=\"_blank\">http://www.myfonts.com/fonts/fontbureau/hightower/</a> <br> <br> <br>d. either Adobe/Linotype Minion, Monotype Poliphilus (can I have Monotype Blado too?) or Linotype Bembo: <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/minion/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/minion/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/agfa/poliphilus/\" target=\"_blank\">http://www.myfonts.com/fonts/agfa/poliphilus/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/agfa/blado/\" target=\"_blank\">http://www.myfonts.com/fonts/agfa/blado/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/bembo/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/bembo/</a> <br> <br> <br>e. Monotype Bookman Old Style: <br> <br><a href=\"http://www.myfonts.com/fonts/agfa/bookman-old-style/\" target=\"_blank\">http://www.myfonts.com/fonts/agfa/bookman-old-style/</a> <br> <br> <br>f. either Adobe Caslon or Berthold Caslon Book &amp; Expert: <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/adobe-caslon/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/adobe-caslon/</a> <br> <br><a href=\"http://www.bertholdtypes.com/adobe_lib/080295000.html\" target=\"_blank\">http://www.bertholdtypes.com/adobe_lib/080295000.html</a> <br> <br><a href=\"http://www.bertholdtypes.com/adobe_lib/080296000.html\" target=\"_blank\">http://www.bertholdtypes.com/adobe_lib/080296000.html</a> <br> <br> <br>My final choice would probably be either Plantin or Cloister. If forced to choose, I'd probably pick Plantin, since its larger x-height makes it a bit more versatile at smaller sizes. <br> <br> <br>David <br></p>"
