    html: <p>i used to like Futura a lot, but that was loooong ago.  <br> <br>there's a fairly new women's magazine out in germany called 'woman' (how creative is that?) and it uses Futura for everything. along with its 80's layout it looks extremely outdated. i said "five issues and goodbye", but i was wrong. it's selling fairly well, and my wife, who's an editiorial designer, even reads it once in a while. must be some kind of retro-thingie. <br> <br>anyway, after long consideration, i would have to choose Luc de Groot's Thesis family. the whole package, of course. not very elegant, but extremely versatile, imho.</p>
