      <p>Well, you can have A.init and A.fina which will be automatically placed in "init" and "fina" features using one-to-one subs, and then you write the "swsh" feature yourself. </p>
      <p>A somewhat trickier case is if a glyph has two sources, e.g. you just have one small-cap glyph that substitutes two different glyphs ("A" and "a"). This cannot be easily expressed in a glyphname, but we have some ideas regarding this.</p>
