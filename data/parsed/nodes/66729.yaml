      <p>Yes, having more than one period feels dangerous!</p>
      <p>It seems to be my preference (looking at my font) to have a single unit postfilx and to use underscore when compounding discriptions.</p>
      <p>so if I had two types of lowercase g:  [ where   <code>' &gt;' </code>  means 'becomes']<br>
      <code>g  &gt;  g.alt  </code>   to map to the alternative form<br>
      and<br>
      <code>g  &gt;  g.sc</code>   to map to the smallcap form (this just changes the lowercase, but you can set up another OT class for Caps to point to the same small caps glyphs, controlled by grouping sets of glyphs in classes)</p>
      <p>This is frowned upon by some and so I also am considering to use myself:</p>
      <p><code>G  &gt;  G.sc</code></p>
      <p>You would also need to add in your alternative form into your class but just map it to the same <code> g.sc</code>:<br>
      [I have not done this yet so would need to be confirmed.]</p>
      <p><code>g.alt  &gt;  g.sc</code></p>
      <p>Later you might want to do some alternative glyphs for Caps with dieresis...<br>
      (The alternative is usually with the Caps version of A, U, O, W, so...</p>
      <p><code>U  &gt;  U.alt</code></p>
      <p><code>U.alt  &gt;  U_alt.sc</code>    (so I am keeping my single postfix:  <code>.sc </code> at the end)</p>
      <p><code>u.alt </code>    shouldn't exist or isnt required under normal typographic circumstances. </p>
      <p>I think that the ligatures are pretty obvious ie <code>f_l_l</code> with underscores between single letters with no postfix so I see it as OK to use the underscore in also assigning compound postfixes.</p>
      <p>Another point is to consider your source when digging around UNICODE and working out what to do and what to call stuff. Dont just look at 2 and have a fifty fifty chance on something, the more you dig around the better you will see the path.  =)</p>
      <p>From someone who used to put the period after eps! it helps me to have the postfix and class names to be named differently. This is my reson for sticking with .sc for the glyph and smcp for the class title (though like you my first attempt, I also wanted to name my glyphs <code>smcp</code>. .</p>
      <p>I think @Charles covered your question.<br>
      but be careful because what you suggested was wrong.</p>
      <p><cite>So you're saying if I want to make an alternate for "A.smcp", I should simply call it "a.smcp" and substitute it in the small cap OT feature code?d</cite></p>
      <p>Er, no.</p>
      <p>because what you are saying here is a substitution CAP(small cap) of a substitution lowercase(small cap). Code as I understand it will always start from the master glyph and map onto the substitute, in this case either an alternative glyph or small cap. I don't think substitution of a substitute is good practice. (This would need to be confirmed or denied by others).</p>
      <p>I hope this perspective helps.</p>
