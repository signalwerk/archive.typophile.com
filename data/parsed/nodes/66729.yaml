      <p>Robby, </p>
      <p>The glyph naming convention used in the upcoming Fontographer 5 will be as follows: </p>
      <p>For glyphs that are accessible through a certain OpenType Layout feature, use the same basename for source and target glyph, and as the suffix used for the target glyph, use the four-letter OpenType Layout feature tag. </p>
      <p>For example, if you have a glyph that is the alternate of "A" accessible through the caps-to-small-caps feature (c2sc), use the glyphname "A.c2sc". If you have a glyph that is the alternate of "a" accessible through the small-caps feature (smcp), use the glyphname "a.smcp". So if you choose to create your fonts the Adobe way (i.e. provide two sets of small caps glyphs, one that map to uppercase letters and one that map to lowercase letters), use the glyphnames "A.c2sc" and "a.smcp". If you name your glyphs that way, Fontographer 5 will be able to generate the OpenType Layout features automatically for you. </p>
      <p>If you want the same glyph to be used in two features at a time, you just concatenate the OpenType Layout feature tags directly. For example, if you name your glyph "one.subssinf" then Fontographer will generate mappings from "one" to that glyph in both the "subs" feature and the "sinf" feature. </p>
      <p>If you want to generate a "chain" of substitutions, you can indeed concatenate the OpenTpe Layout tags using a period. So if Fontographer finds the name "A.c2sc.salt", it will attempt to generate the mapping from "A.c2sc" to "A.c2sc.salt" in the "salt" feature. </p>
      <p>We will post a comprehensive guide for naming that will be compatible with our automatic OpenType Layout feature generation. </p>
      <p>Of course, for most common OpenType features, Fontographer will include a set of "synonym suffixes", so ".sc" and ".small" will be treated the same way as ".smcp". </p>
      <p>Michael, </p>
      <p>the glyphname "U_alt.sc" is interpreted by Acrobat as a ligature of "U" and "alt". Not a good idea.</p>
