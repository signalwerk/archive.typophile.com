  html: |-
    <p>The font I am working on has several stylistic alternate caps. </p>
    <p>I know how to name these. For example the A alternate would be A.salt</p>
    <p>I want my small caps to have the same alternates. What is the best way to name these glyphs?</p>
    <p>Would A small cap alternate be A.smcp.salt?</p>
