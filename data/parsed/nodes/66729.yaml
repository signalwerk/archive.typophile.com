      <p><cite>So you're saying if I want to make an alternate for "A.smcp", I should simply call it "a.smcp" and substitute it in the small cap OT feature code?</cite></p>
      <p>No, don't do that. Lots of text winds up in PDF format. If you take text from a PDF, everything after the period drops out. So A.sc or A.smcp becomes "A". Equally, a.smcp or a.sc becomes "a".</p>
      <p>There has been some discussion about using double periods; I believe there might be some issues -- though Adobe (again as I believe), drops everything after the first period. So one way would be to use A.sc and A.scalt. Easier to read would be A.sc and A.sc.alt, but there is the double period. You could also an underline to separate the alts. e.g., A.sc_alt, though that is the structure for a ligature.</p>
      <p>In any case, you're going to have to write a feature or two, and I can't think of any reason why you can't substitute A.sc with A.scalt (done one way, as stylistic alternatives in either salt or as stylistic sets), or A.alt with A.scalt in the small cap feature -- (or both, depending on how you write things).</p>
    html_clean: |-
