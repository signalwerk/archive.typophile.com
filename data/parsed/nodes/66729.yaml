      <p>@Adam: You covered cases where one glyph might appear in two features, but what about two versions of a character that appear in one feature? E.g., with a <code>.swsh</code> feature I might have an <code>A.init</code> and an <code>A.fina</code> (controlled by separate lookups with "ignore" statements); they can't both be named <code>A.swsh</code>.</p>
      <p><code>U_alt.sc</code> should be <code>U.alt_sc</code>, right?</p>
