    html: |-
      <p>Ps, there is no danger in having more than one period. Anything after the first period is discarded by the Acrobat parser. Basically, the structure of a glyphname is the following: </p>
      <p>basename (up to the first period, or if there is no period, the entire glyphname)<br>
      suffix (anything after the first period)</p>
      <p>The basename should allow Acrobat to resolve the glyphname to a meaningful Unicode string. The suffix is fully up to the font developer. However, font tool developers such as FontLab may impose some conventions on the suffixes so that the automatic generation of OpenType Layout features can be facilitated. And this is what we're doing. </p>
      <p>Best,<br>
      Adam</p>
