      <p>I have notes about typefaces shown in the Solotype Catalog, and they say that Morgan Gothic (p.35) is the same as OptiMorgan One. It's a 1800's era sans serif headline type. You didn't show a picture, so I don't know if that fits what you are looking for.</p>
      <p>- Mike Yanega</p>
