    html: <p>Not only is the Lopez-Ortiz font 'better built' it doesn't look the same, since Chris wants the identical font. It is only similar (just as some of the other suggestions have been). <br> <br>It has occurred to me that you could make something more like the Hell's Angels font, using Zebrawood Fill, or one of the other close suggestions, and duplicating the closer-looking serifs and using them to replace the other serifs. But it requires special graphics tools, and would be a lot of work. <br> <br>Chris, you originally asked if I knew someone who could draw it, so apparently you don't have the tools or skill to duplicate this look yourself, is that so? <br> <br>I REALLY think you should just use Zebrawood Fill, or Saloon Girl, or Saloon, and give up trying to match this any closer.</p>
    html_clean: <p>Not only is the Lopez-Ortiz font 'better built' it doesn't look the same, since Chris wants the identical font. It is only similar (just as some of the other suggestions have been). <br> <br>It has occurred to me that you could make something more like the Hell's Angels font, using Zebrawood Fill, or one of the other close suggestions, and duplicating the closer-looking serifs and using them to replace the other serifs. But it requires special graphics tools, and would be a lot of work. <br> <br>Chris, you originally asked if I knew someone who could draw it, so apparently you don't have the tools or skill to duplicate this look yourself, is that so? <br> <br>I REALLY think you should just use Zebrawood Fill, or Saloon Girl, or Saloon, and give up trying to match this any closer.</p>
