      <p>Calling my offer "shameless" is shameful. I only offer my paid services when it's not possible to help directly on Typophile; you're trying to undermine that, I suspect simply because you don't like me (along with pretty much all type designers it seems).</p>
      <p>Furthermore, you're putting words in my mouth (and type designers collectively) possibly in order to fight a personal bugbear. Anybody who works with letterforms and/or their spacing -in a font- is a type designer, and you certainly don't need to have designed a stand-alone font to add a stroke to an "i". However -unless you're going to perform some contorted hack- you <em>do</em> need a font editor, and you need to know how to use it. In fact you are a type designer yourself (although you should know that most typesetters are not). But not because you use InDesign! You have made ridiculous statements concerning the viability of typesetting software in carrying out typeface design - don't expect to get away with that in front of people who rely heavily on something like FontLab, for good reason. All this should be obvious to you, but I feel you're allowing some misplaced inferiority complex -or a convenient belief that type designers are leeches- to cloud your objectivity.</p>
      <p>And lawyers? Here's a riddle I enjoy telling: What's 20,000 lawyers at the bottom of the sea? A good start. I don't care what lawyers <em>pretend</em> they believe; I care about what David, Christopher and Thomas believe. And to me it is people like that who represent Adobe's typographic presence.</p>
      <p>I don't offer my modification services because I think I can get away with it; I offer the service when I believe it's a legal, ethical and mutually beneficial solution.</p>
      <p>And FYI: <a href="http://typophile.com/node/101351" title="http://typophile.com/node/101351">http://typophile.com/node/101351</a></p>
      <p>hhp</p>
