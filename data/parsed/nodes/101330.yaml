      <p>There is a difference between casting aspersion on someone's work and someone's opinion that only they -- either singularly, or as a group -- can do such work.  I don't know your specific work, so could not cast aspersions on it. In any case, I wouldn't.</p>
      <p>What does rile me to no end is your 100+ posts per fortnight that only a *type designer* is capable of doing anything to a font -- and often to a text --  save, perhaps, writing it and setting justified lines. Even here, some  type designers claim superiority. Maybe it's in the water?</p>
      <p>* * *</p>
      <p>If one reads the thread I cited carefully, I think what you should come away with is the Adobe lawyers have written something, and no one is quite certain what it means. What one can get away with, yes. I think you're correct that the odds of a lawsuit are remote to none. It is a little different to say "Adobe <strong>means</strong> this or that."</p>
