      <p>I'd be just a little careful taking up Hrant's shameless plug. David Lemon at Adobe once told him it was OK for a third party (him) to modify someone else's fonts, and it probably is all right, though you can see from the long discussion below no one wants to be too terribly clear.</p>
      <p>(For reference, aside form David Lemon, Christoper Slye is another Adobe employee, and Thomas Phinney was head of the group for a while, though I believe he'd left when this thread occurred.)</p>
      <p><a href="http://typophile.com/node/47313?page=1" title="http://typophile.com/node/47313?page=1">http://typophile.com/node/47313?page=1</a></p>
      <p>* * *</p>
      <p>The character you mention is an IPA phonetic character -- rather than an i with the combining diacritic U+0335. I'm not sure if there is any real syntactical distinction between the two, but not being sure is enough to stay safe. Besides, few of the font publishers put in the combining diacritics (though according to Unicode, all should).</p>
      <p>Since it's not a common phonetic character -- others are usually needed in any phonetic context, I suspect it's for a "Native American" language. In fact, I think I've seen it in an Mexican/Central American Indian language, newly given a written form.</p>
      <p>Anyway, if that's the case, you're apt to need other characters -- or other phonetic characters, if it really is a case of phonetics. Best is to learn how to do the work yourself; alternatively, pick a font family where the work's already done -- like Ross Mills Huronia, which covers most Native American orthographies.</p>
      <p><a href="http://www.tiro.com/huronia/index.html" title="http://www.tiro.com/huronia/index.html">http://www.tiro.com/huronia/index.html</a></p>
    html_clean: |-
