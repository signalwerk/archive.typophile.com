  html: <p>We would like to learn how to incorporate a unicode character that exists in one (or more) font sets, but not in the font that we wish to use. Unicode 0268 is a small letter i with a stroke in, for example, New Tomes Roman, but we want to have it in Caslon. Any suggestions</p>
  html_clean: <p>We would like to learn how to incorporate a unicode character that exists in one (or more) font sets, but not in the font that we wish to use. Unicode 0268 is a small letter i with a stroke in, for example, New Tomes Roman, but we want to have it in Caslon. Any suggestions</p>
