    html: |-
      <p>It depends on the font, and how set you are on using that font...</p>
      <p>The proper way to do something like this is to add the missing character(s) directly into the font, but most commercial fonts don't allow modification (which means you need to have the modification done by the font house itself, a proposition that's often expensive and sometimes slow). There are some notable exceptions to this, and all open-source (AKA libre) fonts allow modification, but you might want to keep an open mind about switching to a different font.</p>
      <p>In the absolute worst case you can use a separate font with just the missing characters (in the same style) and sub that in as needed, but of course that's very inelegant (plus you can't kern across fonts).</p>
      <p>So: Which Caslon?</p>
      <p>hhp</p>
