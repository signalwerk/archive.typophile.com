    <p>I'm perpetually visually curious, and I've been playing around with the logo for the church I work at. I'm curious what people think – whether I've improved (or dis-improved) the logo. </p>
    <p>Mine's on top, set in an Eisner+Flake Giovanni small caps (with serifs tweaked a bit).</p>
