    html: "<p>Kent Lew couldn't post this morn. He wishes to add this: <br> <br>Capitalization is generally an editorial matter, not a typographic one. This is definitely true in publishing, less so in advertising.  <br> <br>As such, editorial style guides should be followed. There are valid arguments for various styles; the important thing is to determine a style and then apply it consistently. If you're working for a publishing client, you darn well better follow their editorial style. If not, then pick a style and stick with it. <br> <br>In establishing an editorial style, most publishers will follow one of the two main style guides -- The Chicago Manual of Style, which began as merely the house style of the University of Chicago Press but later became popular for its thoroughness and widely adopted by most other publishers; and AP style, which is the style of the Associated Press and is widely used by newspapers, as well as some publishers.  <br> <br>-- K.</p>"
