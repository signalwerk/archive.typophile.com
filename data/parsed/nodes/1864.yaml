    html: <p>Steve is right. As long as you define your publication's style <br>and stick with it, the scheme doesn't matter so much. As <br>long as you're consistent your product will look professional. <br> <br>Ask the <i>New York Times</i>, they use an apostrophe in their <br>plural years (1990's) while nearly everyone else writes it <br>without the apos. Personally, I think it's a dumb choice, but  <br>it looks right in the <i>Times</i> because they have used that  <br>style consistently forever.</p>
