    html: <p>Sorry to sound like a nitpicky editor, but I must clear the CMoS name on a couple of points. It doesn't say to use double hyphens instead of em dashes. (It says that in a manuscript, that is a piece of writing being prepared for eventual typesetting and publication, double hyphens should stand in for em dashes, which will then be replaced by the typesetter.) And it calls for only one space to follow a sentence.  <br> <br>Turabian really is for papers. CMoS is for scholars and other non-publishing-types to prepare their work for eventual publication, and for editors in publishing to prepare that work for typesetting. That's a pretty big distinction. <br> <br>As someone who deals with both editorial and typographic matters, I tend to think it's possible to be picky about both without much conflict.</p>
    html_clean: <p>Sorry to sound like a nitpicky editor, but I must clear the CMoS name on a couple of points. It doesn't say to use double hyphens instead of em dashes. (It says that in a manuscript, that is a piece of writing being prepared for eventual typesetting and publication, double hyphens should stand in for em dashes, which will then be replaced by the typesetter.) And it calls for only one space to follow a sentence.  <br> <br>Turabian really is for papers. CMoS is for scholars and other non-publishing-types to prepare their work for eventual publication, and for editors in publishing to prepare that work for typesetting. That's a pretty big distinction. <br> <br>As someone who deals with both editorial and typographic matters, I tend to think it's possible to be picky about both without much conflict.</p>
  - id: 14837
    user: 2021
    date: 2003-10-30T10:07:00
    date_raw: 30 Oct 2003 — 10:07am
    votes: null
    html: <p>One advantage of the "All Initials Capitalized" style is that you don't get descenders on capitalized letters. Hence its poularity in the 1970's and 80's in hyper-tight, negative-leading ad headlines. And with word spaces reduced to less than zero, the capitalization served to differentiate words.  <br><img src="http://www.typophile.com/forums/messages/4100/19537.jpg" alt="8Ways"> <br> <br>However, the disadvantage is that you also get the situation where the "f" of "Of" runs into the "T" of "The", bridging the space, especially in faces like Garamond. Not a problem in Palatino, though. <br> <br>These are the kind of typographic factors that can influence the style decision, quite apart from the purely editorial.</p>
    html_clean: <p>One advantage of the "All Initials Capitalized" style is that you don't get descenders on capitalized letters. Hence its poularity in the 1970's and 80's in hyper-tight, negative-leading ad headlines. And with word spaces reduced to less than zero, the capitalization served to differentiate words.  <br><img src="http://www.typophile.com/forums/messages/4100/19537.jpg" alt="8Ways"> <br> <br>However, the disadvantage is that you also get the situation where the "f" of "Of" runs into the "T" of "The", bridging the space, especially in faces like Garamond. Not a problem in Palatino, though. <br> <br>These are the kind of typographic factors that can influence the style decision, quite apart from the purely editorial.</p>
