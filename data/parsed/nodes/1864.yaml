  html: <p>He-Man and the Masters of the Universe <br> <br>He-Man And The Masters Of The Universe <br> <br>Up until today I was confident that I was making the correct choices when it comes to caps in headlines that use upper and lower. In the above example I would use the top one. Is that even correct though? Should <i>the</i> be <i>The?</i> <br> <br>Specifically, the one you see below is what brought this on. <br> <br>Designed For the Collector <br> <br>Wondering if it should be <i>Designed For The Collector</i> has got my head in a spin. This is about to be printed as <i>Designed For the Collector</i> <br> <br>AAHHHH HELP! <br> <br>Is there a good resource for this type of thing? Book? Site?</p>
  html_clean: <p>He-Man and the Masters of the Universe <br> <br>He-Man And The Masters Of The Universe <br> <br>Up until today I was confident that I was making the correct choices when it comes to caps in headlines that use upper and lower. In the above example I would use the top one. Is that even correct though? Should <i>the</i> be <i>The?</i> <br> <br>Specifically, the one you see below is what brought this on. <br> <br>Designed For the Collector <br> <br>Wondering if it should be <i>Designed For The Collector</i> has got my head in a spin. This is about to be printed as <i>Designed For the Collector</i> <br> <br>AAHHHH HELP! <br> <br>Is there a good resource for this type of thing? Book? Site?</p>
