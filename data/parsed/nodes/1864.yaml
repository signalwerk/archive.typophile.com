    html: "<p>For what its worth, <i>Fowler's Modern English Usage</i> says: \"Let it be repeated: the employment of capitals is a matter not of rules but of taste\". <br> <br>For an idea of the kind of work this is, though, try this comment on newspaper headlines: \"If sometimes there is a touch of vulgarity in them, that is not likely to lessen their appeal to the average newspaper reader\". </p>"
