      <p><em>Am I normal?</em><br>
      i doubt it. there's no such thing as "normal."</p>
      <p>maybe i have it all wrong, but to me , the term <em><a href="/wiki/humanist" class="freelinking">humanist</a></em> refers to letters that are influenced by <a href="/wiki/ductal%2520logic" class="freelinking">ductal logic</a>, whether they're <a href="/wiki/sans%2520serif" class="freelinking">sans</a> or <a href="/wiki/serif" class="freelinking">serifed type</a>.<br>
      in <a href="/wiki/calligraphy" class="freelinking">calligraphy</a>, the <a href="/wiki/humanist%2520minuscule" class="freelinking">humanist minuscule</a> is a descendant of the <a href="/wiki/carolingian%2520minuscule" class="freelinking">carolingian minuscule</a>. The humanist model of calligraphy is what influenced the earliest <a href="/wiki/Roman" class="freelinking">Roman</a> (<a href="/wiki/whiteletter" class="freelinking">whiteletter</a>) types, particularly those of <a href="/wiki/Nicholas%2520Jenson" class="freelinking">Nicholas Jenson</a>. The <a href="/wiki/Vox-ATypI%2520classification" class="freelinking">Vox-ATypI classification</a> system uses the term humanist to refer to the <a href="/wiki/Venetian" class="freelinking">Venetian</a> model of type.</p>
    html_clean: |-
