    html: <p>Doesn't sound wrong to me, Paul. But I rarely see "humanist" bandied about in regard to serifs (with the exception of typefaces inspired by Italian Renaissance type), maybe because many more serifs are "humanist" by your ductal-logic definition than are sans- and slab-serifs. I'd guess that this comes from the early slab-serifs and sans-serifs not being too concerned with ductus as far as I know until Johnston and Gill in the early 20th c. and Frutiger in 1968. So to say "humanist" doesn't separate a group out as much for serifs as it does for other type genres.</p>
