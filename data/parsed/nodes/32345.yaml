      <p>Usually, humanist does come up in connection with sans-serifs, but it's not so unusual to hear about humanist slab-serifs. Other than PMN Caecilia, the humanist slabs off the top of my head are <a href="http://www.lucasfonts.com/index_neu.html">TheSerif</a>, <a href="http://www.myfonts.com/fonts/linotype/chaparral">Chaparral</a>, and the brand new <a href="http://www.linotype.com/3273/soho.html?PHPSESSID=34e1c19945b7c8e50a9d4660378eb6fc">Soho</a>. I also can't resist throwing in <a href="http://pampatype.com/php/English/Tipografias_RR.php?secc=cara&amp;menu=menu_T_C.html&amp;sub1=sub1_T_RR_C.html&amp;sub2=sub2_T_R_C.html&amp;pag=pag_T_RR_C.html">Rayuela</a>, which, though not really a slab-serif, does have a distinct humanist quality, greater than that of most non-script typefaces.</p>
      <p>Hope these non-sans typefaces could be useful alternatives; I don't mean to hijack the thread. To atone, here's a thread purporting to offer a list of the best humanists sans-serifs: <a href="http://typophile.com/node/13281" title="http://typophile.com/node/13281">http://typophile.com/node/13281</a> . Check the list at the very bottom.</p>
