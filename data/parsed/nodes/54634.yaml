    <p>Hi!<br>
    I'm writing a paper about the graphic design of Lula magazine,<br>
    I've found out the Lula typeface is a modificated Kursivschrift stehend from Linotype.<br>
    I want to know more about it but can't find a lot of information (all I know is that it's german and it's based on cartographic lettering)<br>
    Is there someone who knows something about this type, or where I can get information about it?</p>
