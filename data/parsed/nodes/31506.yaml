    html: |-
      <p>Pretty much. The only lowercase/uppercase pair I routinely look at is "c", as in Mac- or Mc- (All capitals). Punctuation/uppercase is usually limited to the apostrophe (Unicode 2019), the open &amp; doubleopen quotes, and periods with a few abbreviations such as U.S.A and D.C. where the period needs a kern to the following letter (particularly the "A"). The same would be true of punctuation/smallcap, since abbreviations &amp; acronyms are often set in small caps.</p>
      <p>I dunno if I should include small caps in that optomistic time estimate; it would certainly push it toward or more likely over the 6 hour figure. Too, the itals &amp; bolds tend not to have small caps, though I usually make up a rudimentary set [where the EULA allows this, of course ;)]. The occurrence of ital or bold small caps is usually so low in the work I do that they could be handled in the job file -- esp. when a designer has chosen a font no one will ever use again.</p>
      <p>We all evolve our routines, and since I primarily set scholarly monographs – and not even the jackets – certain kinds of things tend not to arise. And as I said, I have to go back &amp; fix – and add – things with the kerning from time to time.</p>
      <p>Another thing that helps me move along is I only try to get things right for text-size settings, say 8 to 12 point. I've always felt that in display setting, you have to do your kerning as it comes up. What is right for 18-point is not right for 72-point.</p>
      <p>Hope that answers the question,</p>
      <p>Charles</p>
