      <p>I went and looked at kernking. I suppose it can be useful, but I did notice it left out one of my favorite "pairs," namely Yg. I once had to set a book involving the Artherian legend, and Arther's mom, Ygraine, came up a lot. It should go without saying I had to go back &amp; re-kern the font; I'd missed it in my early effort.</p>
      <p>As a typesetter, I've been kerning fonts since 1980 or so. That means that I've had a lot of practice, but it also means I'm a bit set in my ways, so you can take what I say with a grain of salt. At this point, If I'm serious about a text font, I look at all combinations of letters and punctuation, as lowercase, as cap-lowercase, and as cap-cap.</p>
      <p>Since the advent of Fontographer, and now FontLab, it has gotten easier. Both have a metrics window that lets you put up whole words, with spaces. I make sure the "metrics window" has about five words, with spaces, and then run through the pairs. With tricky letters, such a cap-V or cap-W, I make sure I look at not pairs, but triplets -- if you use WAVE for kerning the "A", you'll wind up with a very different decision than if you use WARF. And of course, same with the lower case.</p>
      <p>Another thing you will notice, especially if you are making your own font, it that you can pick sidebearings for the caps to either work well (minimal kerning needed) with other caps, or work well with lowercase letters, but rarely both. One or the other will needs more work.</p>
      <p>Don't forget the numbers, and numbers with endashes, commas, and periods.</p>
      <p>You will notice -- I hope you will notice -- that too tight is worse than not-quite-tight-enough. The font itself will give you some hints on how it should be kerned &amp; spaced. I'll change sidebearings &amp; re-kern if need be. The lower-case "f" is a typical candidate. In order to skip kerning with the vowels, some designers will give it a large negative right sidebearing. When the "f" is the last letter in the word, the wordspace will get too small. So they'll add a "f space" positive kern. But that's a patch, if you get it right for "of Wilbur" it will be wrong for "of anything". Better to get the sidebearings right &amp; deal with the letters.</p>
      <p>After almost 30 years of practice, It takes me about 4-6 hours to kern a font for the Latin alphabet, and maybe another hour after I see the first book printed, and a little bit of "font maintenance" from time to time as I see the results from other books. That's a plus a compositor has over a type designer, I suppose. But this is a small amount of time to spend on a font; far far less than it took the original designer.</p>
