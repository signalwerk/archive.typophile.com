      <p>This is just a way of looking at the problem but, shouldn't we design kern tables for individual languages? Or to take it further, for individual publications in their particular context (country, particular way of writing, most common words, etc)? Like for the special case Charles mentioned above, with Ygraine?</p>
      <p>And if writing the tables for particular languages, shouldn't we use sample texts specially designed for those languages?</p>
      <p>The "My" pair for instance, would be really rare in Spanish, except for the cases of proper names such as "Myriam" (Which isn't very spanish-like by the way). So it wouldn't be of huge relevance in the tables. But not the same applies for the English language, were the pair "My" is very common.</p>
      <p>I think that maybe samples like Kern King work best when getting to know how the font works with the default spacings, but becomes less useful when writing the kern tables. For those, it would be useful to design texts according to the language/country the font will be used in, and ideally offer different packages for different countries.</p>
      <p>Does anyone know if theres available data about the most common (irregular) pairs on English or other languages?</p>
      <p>Perhaps there is a list of the irregular pairs in the basic Latin alphabet?</p>
      <p>Regards,</p>
      <p>__________________________________________________<br>
      <a href="http://www.gabssnake.4t.com" title="www.gabssnake.4t.com">www.gabssnake.4t.com</a></p>
