    html: |-
      <p>Always look at three glyphs, never two. Although you can only kern one glyph against another, you need the third glyph for context. </p>
      <p>The best program to do kerning in is the one you designed your type in.</p>
      <p>Do not automate the process, you will not learn very much if you rely on automatic tools.</p>
      <p>Before you even begin to kern, make sure your glyph metrics are as perfect as they can be.</p>
      <p>Don't hesitate to redraw the glyph if you cannot get it spaced or kerned satisfactorily.</p>
      <p>Use your eyes.</p>
