    html: <p>The problem with vector images is that normally in InDesign they don't reflow if the text changes. If you've got an order form with 30 checkboxes as images and the leading changes, you've got to manually go back and reposition each one.  A workaround is to paste each image into the text as an inline image, and then it'll reflow, but I've always found inline images to be tricky to work with, so if there's a way to insert a checkbox as regular text it's what I'd prefer to do.</p>
    html_clean: <p>The problem with vector images is that normally in InDesign they don't reflow if the text changes. If you've got an order form with 30 checkboxes as images and the leading changes, you've got to manually go back and reposition each one.  A workaround is to paste each image into the text as an inline image, and then it'll reflow, but I've always found inline images to be tricky to work with, so if there's a way to insert a checkbox as regular text it's what I'd prefer to do.</p>
