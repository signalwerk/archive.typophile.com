    html: |-
      <p>It's always best to do as much as possible natively in InDesign, so Joshua's GREP style suggestion above is a great one.</p>
      <p>As long as you use a dingbats font common to Mac and PC there's no reason to start obtaining other fonts specifically for this. Which isn't good news for those selling fonts but your life will be considerably easier.</p>
      <p>I'm harping on about this I know, but you don't get any points for choosing more complex solutions, the reader just sees the box.</p>
