  html: |-
    <p>Sometimes I need to prepare a business form with checkboxes. Unfortunately if the page has a colored background,  the color shows in the center of the box. If I prefer that the center of the box be white I have to use an awkward workaround like pasting the box in place as an inline graphic (I'm using InDesign).</p>
    <p>Is there such a thing as a font in which the checkbox's center is white and knocks out the background?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/checkbox_4809.jpg"></div><p></p>
