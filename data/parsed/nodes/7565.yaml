    <h2><a href="/battle31" title="Type Battle 31 // Slasher Magazine masthead">Type Battle 31 // Slasher Magazine masthead</a></h2>   <p>// THE CHALLENGE</p>
    <p>Create a masthead for a magazine called “Slasher”.</p>
    <p>Winner take all, no holds barred. May the best designer win.</p>
    <p>// REQUIREMENTS</p>
    <p>- Image size: 550 width x 400 height. 72 dpi<br>
    - Color: Black and White only (Red optional)<br>
    - Format: JPG or PNG</p>
