      <p>As Cuttlefish said this is not the purpose of html. </p>
      <p>For example, look through these forums and you will see widows and orphans everywhere - on a typography site. Just explain this to the proofer, there is no work-around that will have cross-browser and cross-platform coherency. Anything you do in this regard is only to make it look right on your own particular screen, and in all likelihood in one particular browser. Among other issues you will cause are problems for visually impaired users who need to scale text up or to have it read out by the computer.</p>
      <p>If you must have your text conform to the rules of the (superior) world of print then place it as a static image or dynamic flash image. I wouldn't recommend this as you should work within the medium in its simplest form in order to alienate as few users as possible.</p>
