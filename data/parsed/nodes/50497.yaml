      <p><cite>This reminds me of a conversation with my wife, when I tried to suggest that a screwdriver was not also a pry bar, hammer, chisel, gouge, trowel, etc.</cite></p>
      <p>Charles, that is so wonderful about a screwdriver: it IS also a pry bar, hammer, chisel, gouge, trowel, etc. And it even can be used to (un)screw those thingamajingies, wat are the called again — oh yeah: screws.</p>
      <p>On a sidenote: even in the formalised environment of newspapers and magazines w&amp;o’s appear all the time. There seems to be a break point where the cost in time and money of copyediting and repositioning apparantly outweighs the principles of good typography.</p>
      <p>But then — good typography is pretty scarce. And has been for ages. The best typography was done in the first half or threequarter century after Gutenberg invented the ‘art’.</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
