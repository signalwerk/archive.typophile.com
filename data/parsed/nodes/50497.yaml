  html: |-
    <p>Hi All!</p>
    <p>I am not sure if this is the right category to post, but here goes:</p>
    <p>How do you deal with coding <a href="http://en.wikipedia.org/wiki/Widows_and_orphans" rel="nofollow">orphans and widows</a> in HTML? I never used to think about this until I started working in my current job and the proofreader would mark up the widows. My quick fix is a  tag before the last word of the sentence before the widowed line. My dilemma with this solution, however, is when text gets resized by the user (using their browser settings), the  tag can move to the next line, thus prematurely breaking the line midway and making the paragraph appear disjointed.</p>
    <p>Any designers/front-end developers have an alternative solution to this?</p>
    <p>Thanks muchly! :)</p>
  html_clean: |-
