      <p>Orphans/widows are defined in paged media section of CSS3 standard. So it was supposed to work on printed pages. However, they have exactly the same meaning in multicolumn layout, which is also defined in CSS3.</p>
      <p>According to <a href="http://en.wikipedia.org/wiki/Comparison_of_web_browser_CSS_support#Properties" title="http://en.wikipedia.org/wiki/Comparison_of_web_browser_CSS_support#Properties">http://en.wikipedia.org/wiki/Comparison_of_web_browser_CSS_support#Prope...</a> Opera, Safari and Chrome support orphans/widows. This page does not mention IE8, but it supports them too. FireFox is still behind in paged media support.</p>
      <p>Thanks,<br>
      Sergey</p>
