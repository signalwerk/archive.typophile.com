    html: |-
      <p>It depends on what you mean by *display*. But yea, you're on the right track.</p>
      <p>xml = the content marked up via generic xml --&gt; xslt = lets you transform the generic xml to a specific structur (in this case HTML) --&gt; html = the markup language that tells the browser what the content 'chunks' are --&gt; Web Browser = the *display* that will render the html using whatever default styles it wants to use --&gt; CSS = the styles that are to override the browser's default styles to layout the page, style the type, add design elements (color, decorative images, etc.)</p>
      <p>Technically, XML is a SUBSET of SGML, while valid HTML is an APPLICATOIN of SGML. But don't ask me to tell you what that actually means. ;o)</p>
      <p>On top of that, many folks are using xhtml or, at least, xhtml syntax, which takes it back to being an SUBSET of SGML (as xhtml = xml).</p>
      <p>In fact, newer browsers will allow you to use xml and css all by themselves to present and format in a web page. Not really the original intent, but viable.</p>
      <p>Going all the way back to the original question...the reason you don't deal with widows online is that to have widows to begin with, you need a fixed canvas and fixed variables such a specific typeface and specific type size. You have control over this in print, buy you have no real control over it online. The end users can over-ride any design suggestions you may make. I can change the font, the size, the size of my browser, etc. So it becomes a rather futile thing to dwell upon.</p>
      <p>The copyeditor might just be old-schooling it and marking up everything via habit so you can just ignore the elements that aren't applicable online. On the other hand, if they are insisting on things like this, then they need to get some basic training on how online typesetting works.</p>
