      <p>HTML is meant to describe the information presented, not set its layout. That job is left to CSS, or at least it is supposed to be if you're using idealized coding style standards.</p>
      <p>The best I can think of to prevent widows and orphans is to substitute spaces between the last couple/few words of a paragraph with a nonbreaking space (&amp; nbsp; without the space) to keep them glued together on the same line, though this might result in the preceding line having very few words there too.</p>
