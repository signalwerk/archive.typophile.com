      <p>In the world I live in (which includes a private toolchest), widows are to be banished but orphans allowed. That's if you're referring to lines. If you're referring to words, the last word in a paragraph is only that.</p>
      <p>People keep talking about "good typography" as if the compositor allows the last word of a paragraph to fall on a line by itself out of laziness or ignorance. Usually, it is a matter of compromise. If you take down the last word -- or an even greater sin, hyphenate it, you also preserve close, even word spacing we all aspire to. Of course if you're allowed to edit the copy, you can make things fit, but in this case, what pleases a typographer will give an editor apoplexy.</p>
      <p>The funniest couple of PEs I ever saw was "PE--loose line, with a mark right beside it "PE--hypenated last word." Well, even if you threw out all the wordspaces, that word wasn't going to go up. And the line sure wasn't going to get any tighter if you took the entire word down. Did I mention that it was a three-line paragraph?</p>
      <p>I know editors who apply the principle even to bibliographic entries, which are usually only two lines long. Where do they think that extra space is going to come from?</p>
      <p>My rule of thumb is that however many words it takes, the last line of a paragraph should be longer than the paragraph indent of the following paragraph. Sometimes two words, such as "of it." aren't enough.</p>
