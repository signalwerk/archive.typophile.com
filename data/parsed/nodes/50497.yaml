      <p>As to the out-dated definition:</p>
      <p>Is it *definition*, or current practice? I know a bunch of web designers are using HTML in ways for which it it wasn't designed. Most of the people in the print world I know are moving toward XML for files that are to have multiple uses. For web display, those would be converted (using XSLT). In this model, HTML is still for *display*.</p>
      <p>I've always taken XML to be an extension of SGML -- that is, generic, unlike HTML.</p>
