      <p>Talib isn't bad as a typeface. It seems to be a serious and well-designed typeface, whereas most faux-Chinese, faux-Arabic, faux-Hebrew and so on faces have an amateurish look about them - even when they're in the font catalogue of a reputable place like Adobe instead of on dafont.</p>
      <p>I would say though, that it <em>is</em> still going to be in the 'currently unfashionable' category for many potential users. Use of it by any entity outside the Arabic script community to relate material to that community could potentially be misconstrued.</p>
      <p>This is why, in the present climate, so many people play it safe and use Papyrus, making it an overused face that many people <em>here</em> love to hate.</p>
