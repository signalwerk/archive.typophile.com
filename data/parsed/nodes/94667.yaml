      <p>Chinese-American and Greek-American restaurants are misleading sample sets, I think, when it comes to judging today's typocultural attitudes, because they exhibit a graphic 'language' that became conventional decades ago. Discerning proprietors and their customers are less likely to reject such conventions out of any sense of political correctness than a desperate desire to visually distinguish a higher quality dining experience, hence one doesn't see the same conventions in Chinese and Greek restaurants that try to offer more authentic and regional-specific dishes of the kind that you might actually eat in China or Greece.</p>
      <p><em>...these are Chinese restaurants, operated by Chinese people, and they're using an atmospheric typeface to remind potential customers of the nature of their business.</em></p>
      <p>Specifically, they are signalling to the <em>gweilos</em> that this is a Chinese-American restaurant serving a range of dishes that are as predictable in their flavour and price as the conventions of the typography. The Chinese customers aren't reading this stuff at all, either culturally or literally, any more than they're looking at the English language menu. [I had a great experience at a restaurant in Vancouver late one night. I arrived with the first half of our party -- a bunch of white guys -- and we were seated and issued with English menus. A few minutes later the rest of our party arrived, including one Chinese guy, and the waiters immediately came along and took away our menus and issued us with new, bilingual ones <em>listing a different selection of dishes</em>.]</p>
