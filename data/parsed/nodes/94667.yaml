      <p>@Maxim Zhukov:<br>
      <cite>Do you find this typography politically incorrect?</cite></p>
      <p>It's not what <em>I</em> find politically incorrect, so much as it is what I believe others would so find.</p>
      <p>There's nothing in the first photo of the four you included in your post to raise qualms. I think that, in the second, the face in which "Chinese Food" was set, and in the third, the one in which "Lin's", as printed on the glass of the window was set, could cause difficulties depending on the context.</p>
      <p>You are right that it isn't really reasonable to complain about <em>any</em> of your examples; these are Chinese restaurants, operated by Chinese people, and they're using an atmospheric typeface to remind potential customers of the nature of their business. But people aren't always reasonable these days, and such typefaces can also be used in other contexts for the purpose of mockery of the script community in question.</p>
      <p>So I think that a <strong>national chain</strong> of restaurants serving Chinese food, where the outlets aren't necessarily owned or staffed by people of Chinese ethnic origins, <em>would</em> avoid this category of typeface. Local Mom and Pop restaurants, <strong>fortunately</strong>, don't have to (pardon the expression) kowtow to political correctness to the same extent.</p>
