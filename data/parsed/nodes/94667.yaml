      <p>@John Hudson:<br>
      <cite>[I had a great experience at a restaurant in Vancouver late one night. I arrived with the first half of our party -- a bunch of white guys -- and we were seated and issued with English menus. A few minutes later the rest of our party arrived, including one Chinese guy, and the waiters immediately came along and took away our menus and issued us with new, bilingual ones listing a different selection of dishes.]</cite></p>
      <p>I read <a class="freelinking external" href="http://www.press.uchicago.edu/ucp/books/book/chicago/E/bo5969886.html" rel="nofollow">this book</a> in an earlier edition; it talks about this phenomenon, as well as presenting a more accessible method of indexing Chinese characters for lookup by people unfamiliar with the script, and I would recommend the book to people curious about this issue.</p>
      <p>@HVB:<br>
      <cite>John, can you cite any examples of people or organizations having taken offense at such usage?</cite></p>
      <p>I have to admit I don't have any specific examples in mind. I've simply noted the increased use of Papyrus and Ondine, and the decreased use of more traditional simulation typefaces, and drawn the conclusion that this is likely due to today's climate of increased sensitivity in this area.</p>
      <p>Self-censorship doesn't require a specific incident as a motivator.</p>
      <p>Of course, not all simulation typefaces have anything to worry about... for example, I'd say that</p>
      <p><a class="freelinking external" href="http://xuanzhangdesign.com/Akchessima" rel="nofollow">http://xuanzhangdesign.com/Akchessima</a></p>
      <p>in any context in which it would be likely to be used would not be perceived as potentially risking giving offence.</p>
      <p>And, given that this thread was started by <em>Hrant Papazian</em>, one could muddy the waters a bit more by noting double standards.</p>
      <p>It has been noted that there is a tendency in today's Armenian type design scene towards faces which adopt norms of X-height and serif structure carried over from Latin typefaces. These faces aren't used as display faces either to evoke or mock the Latin alphabet world, they're used as primary text typefaces for the Armenian language.</p>
      <p>So, here, despite the apparent double standard, it makes sense to cast the Armenian script community as the victim rather than the perpetrator - having the distinctiveness of their own typography smothered by the dominance of the Latin alphabet.</p>
      <p>(And the situation is complicated by the fact that, as Hrant has pointed out, Armenia being a small place, and having endured restrictions on printing in its own language for much of its history, it needs to be open to outside influence, as opposed to being insular and tied to Bolorgir... I presume the solution he is hoping for is a fruitful interaction between the homeland and the diaspora Armenian communities, which are currently at the two opposite extremes.)</p>
