      <p>I <em>have</em> noted in discussions here about Papyrus that, these days, typefaces in one language that imitate the look of a different script are unfashionable. And, indeed, that is because of "things like this".</p>
      <p>However, as "foreign-look" faces go, the one in the photograph is at least <em>understated</em>, and I presume it had been chosen (long ago) by Jews themselves.</p>
      <p>So I don't see a reason to condemn or criticize people for celebrating their own culture simply because they've done so in a way that doesn't sit well with our <em>current</em> sensitivities. I would advise people against the use of foreign-look faces in current projects, but that is pragmatic advice - perhaps someday it will be possible to again draw the distinction between faces in poor taste and those which, like the one used on that hospital, which are sufficiently understated to be a nod to another script system rather than tending to give the appearance of being a mockery of it.</p>
      <p>But, more importantly, I think it's very important to draw the distinction between "currently unfashionable" and "inherently evil"... even when one is advising people to avoid the former, and even when one recognizes the reasons behind something having the former status as legitimate.</p>
