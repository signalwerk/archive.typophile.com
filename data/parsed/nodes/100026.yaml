    html: |-
      <p>Probably a custom job as most wordmarks of car industry. You could pretty much to do the same with any Extended/Wide Sans Bold/Extra Bold/Black.<br>
      Some suggestions: <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/annonce/" rel="nofollow">Annonce</a> (the closest I have), <a class="freelinking external" href="http://www.myfonts.com/fonts/betatype/doublewide/" rel="nofollow">Doublewide</a>,  <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/" rel="nofollow">Azidenz Grotesk Extended Bold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/titling-gothic-fb/" rel="nofollow">Titling Gothic Extended/Wide Bold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/zeppelin/" rel="nofollow">Zeppelin 43/51 Bold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/betatype/doublewide/" rel="nofollow">Doublewide Bold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typetrust/reservation-wide/" rel="nofollow">Reservation Wide</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/presicav/" rel="nofollow">Presicav</a><br>
      You can also download it legally as vector <a class="freelinking external" href="http://www.brandsoftheworld.com/logo/land-rover-6" rel="nofollow">here</a>.</p>
