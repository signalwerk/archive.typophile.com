    html: |-
      <p>This thread has some similarities to another over at the <a href="http://forums.adobe.com/message/1946302#1946302" rel="nofollow">InDesign Scripting forum</a>.  Miguel Sousa already suggested that it would be wiser -- not to mention much simpler -- to modify a script than to change the names in a font family.  The script discussed over on the ID forum is a standard *.JSX javascript, not compiled, so it can be modified.  And the author, [Jongware], might well happen along here, to explain things better.  Still, his contributions over there mention the strategy of <strong>temporarily</strong> changing the fonts in an InDesign document to a family using the the usual variants (regular, italic, bold, and bold italic) in order to run the JSX script that relies on them.  After running the script, InDesign's "Find Font" command can quickly change all instances of, say, Times NR's "italic" to Archer's "book italic".  As for footnotes, InDesign's can search them, but only if that is included in the search options: check out the options disguised as icons below "Search:" on the Find/Change menu.</p>
      <p>David</p>
    html_clean: |-
