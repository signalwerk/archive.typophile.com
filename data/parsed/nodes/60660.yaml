      <p>"The script" has been mentioned a few times without any background story, so perhaps I should explain a bit further.</p>
      <p><a class="freelinking external" href="http://www.jongware.com/binaries/preptext.zip" rel="nofollow">Preptext.jsx</a> searches for any combination of bold, italic, superscript, subscript, underline, and small caps (and, by editing a few out-commented lines, strikeout). It creates character styles for each combo found and applies these to the text, so when editing you no longer can remove them by accident.</p>
      <p>In this particular case, <em>some</em> work has to be done by hand (preserving a special version of italics) but, honestly, in most cases it works nigh on perfect ...</p>
