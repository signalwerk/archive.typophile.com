      <p>This morning it suddenly occured to me. It is no problem at all.</p>
      <p>What NLX should do is <em>first</em> replace his "Book Italic" with a character style of choice and only <em>then</em> run the script to apply character styles to the rest of italics. The script is smart enough to leave existing character styles unchanged!</p>
