    <p>Ok i have a nifty problem. I'm working in a long technical books with Indesign, and i'm running a script that change italics in the text to Charactere styles. The script only works if the italics are named as italics.</p>
    <p>But Archer is using 'Book italic' as a name and not 'italic' so the script doesn't work… !</p>
    <p>Is there anyway i can correct this in the font file, using a text editor, or is too complicated/impossible ?<br>
    I have no code abilities, btw.</p>
