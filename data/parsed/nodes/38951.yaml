      <p>I think the AIGA says it best:</p>
      <p>"AIGA believes that doing speculative work seriously compromises the quality of work that clients are entitled to and also violates a tacit, long-standing ethical standard in the communication design profession worldwide. AIGA strongly discourages the practice of requesting that design work be produced and submitted on a speculative basis in order to be considered for acceptance on a project."</p>
      <p>See also this <a class="freelinking external" href="http://www.aiga.org/content.cfm/new-challenges-from-the-lowballersand-what-to-do" rel="nofollow">lowballers article</a>, which gives more insight into the respect our profession deserves, though focusing on a different situation.</p>
      <p>Please know and respect your audience's views before bringing something like this to the table.</p>
