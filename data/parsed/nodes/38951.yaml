    <p>I hope I'm not infringing on any unwritten rule by posting a link to this other site, but I value the input of the creative members of typophile.</p>
    <p>I am looking for critque, ideas and possibly entries into a logo design contest that we are hosting on another site.</p>
    <p>The contest is being held at <a class="freelinking external" href="http://contests.sitepoint.com/contests/4033" rel="nofollow">http://contests.sitepoint.com/contests/4033</a>.</p>
    <p>Details of our intentions are in the summary and brief.</p>
    <p>I've also posted another link <a class="freelinking external" href="http://scn.ca/SCN_Logo_Contest/index.html" rel="nofollow">http://scn.ca/SCN_Logo_Contest/index.html</a> to our current logo (top) and the recently redesigned logo of our broadcast network. The <a class="freelinking external" href="http://scn.ca/SCN_Logo_Contest/SCN_Station_ID.mp4" rel="nofollow">SCN_Station_ID.mp4</a> link at the bottom portrays the full effect of our rebrand and how we identify on-air with our viewers. </p>
    <p>I would really like to hear some feedback regarding our recent Broadcast Network rebrand.</p>
    <p>Thanks in advance.</p>
