      <p>Imagine a hospital where anybody could enter a contest to diagnose a patient, and the one who was right would win a prize. No truly qualified doctor would ever enter because it would not be worth their time, the patient would most likely suffer, and nobody would take the hospital seriously.</p>
      <p>Obviously this would never happen in real life, but if you replace "doctor" with "designer", "patient" with "logo", and "hospital" with "client", it somehow becomes acceptable? Do the right thing and hire a real designer unless you want your logo to suffer and nobody to take your business seriously.</p>
      <p> - Lex</p>
