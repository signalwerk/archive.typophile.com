      <p>I think I would start over with all the logos and your website. I would have a hard time getting inspired with the current website. It shouldn't be hard to find a designer who could handle the whole job. Find someone whose work you like and be prepared to pay them.  Maybe you could find a local design firm who would do it at a discount in exchange for on-air and website promotion. I see shows on PBS that say "This program is brought to you by the Cheryl and Henry La-dee-dah Foundation". Maybe you could make some kind of exchange that way. Then your station and the designer would get something of real value.</p>
      <p>Sharon</p>
