    html: '<p>Worth it? You have to figure out that one out on your own. Possible plus: more "uniform" than Helvetica, not so squarish, good OT handling, better text figures, nice a &amp; l alternates. Possible minus: The northwestern part of the lowercase s looks slightly ankward, Æ is too wide and the Ø slash is too thin.</p>'
