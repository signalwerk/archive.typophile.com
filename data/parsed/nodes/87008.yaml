  html: |-
    <p>Trying to work out if it is worth purchasing this Suisse BP font (from <a href="http://swisstypefaces.com/" title="http://swisstypefaces.com/">http://swisstypefaces.com/</a>) They let you download a font test font which is very helpful so I've been able to use it on layouts. </p>
    <p>My company would have to buy it, but not sure how eager they will be to purchase a font which is very, very similar to Swiss, or even Helvetica which we already have.</p>
    <p>Have you any opinions of this font? </p>
    <p>(It would be used in magazine editorial - not for vast amounts of body copy, but more for box copy/headlines/caption text etc)</p>
    <p>thanks!</p>
