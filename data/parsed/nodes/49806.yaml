      <p>I don’t mean to sound . . . mean, but I find honesty is the best way to go about design. I don’t get your mark. And “Conferware” sounds so “Compuglobalhypermeganet”. It doesn’t convey any sort of meaning to me other than a very abstract corporate environment. It reminds me of companies like the ones in the movie <em>Office Space</em>; Initech, Initrode, etc. In short, it’s very web 2.0.</p>
      <p>The mark itself is also very contrived and generic. Nothing about it would make me want to do business with your company. The two little dot square pilly things in the middle of the mark will get lost at scaled down sizes, and I don’t really get what they’re doing there.</p>
      <p>I think you need to be thinking about more than just the font right now. It won’t save your logo (and your company) from getting lost in the sea of the corporate world. </p>
      <p>penn</p>
