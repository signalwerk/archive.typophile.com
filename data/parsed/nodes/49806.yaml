    <p>I used to think choosing the right typeface for our new logo would not be any major issue. I used to. We have developed a graphical element that represents our company core. We are a communication and collaboration technology company and the logo should evoke communication between (two) sides. The next step is a typeface.</p>
    <p>After a few suggestions from our designer and several own attempts I realized the font plays a biiig role in the logo! I discovered the whole new world of typography. Beautiful.</p>
    <p>Being (just) a CEO, I don’t go too much into detail, but I think I am able to understand what it takes to create a good typo and yes, to use it properly.</p>
    <p>After quite a extensive research, we (designer and us, in the company) have made a shortlist of typefaces. These, in our opinion, work quite well with the slanted, dynamic graphical element.</p>
    <p>The first two use FF Daxline (gradiented web version and a spot one). The third is an alternative with RR Lesmore Condensed. All in italic. Please see the attachments.</p>
    <p>Daxline is good, not so common as Dax, but inherited the good things. Lesmore gives a different flavor. To me, a traditional, elegant.</p>
    <p>My question to you, esteemed typography pros, is whether Daxline is a clever choice and/or whether would you suggest any other fonts (and why).</p>
    <p>Thank you!</p>
