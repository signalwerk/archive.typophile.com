    html: <p>Given the choice of those two fonts I prefer the Daxline. Penn&amp;Ink is correct though, your mark itself needs some more work. The two dots between the swooshy things will be tiny specs when reduced to business card size. The swooshes are rather generic, in this design they actually remind me of a curly telephone cord. If you can go into greater detail about what your company does and who is your targeted audience we may be able to give better suggestions.</p>
