  html: |-
    <p>Hello</p>
    <p>I am in the process of developing a font with FontLab (I am a newbie to it) and I want to know if I can get some aid from you. </p>
    <p>FontLab will freeze when trying to export the characters to OpenType. It will be OK when generating TrueType, though. When trying to generate either format, an error message pops up stating that some characters contain open contours.</p>
    <p>So, question 1:</p>
    <p>Any idea of why FontLab will freeze through the export dialog when generating the OT font? The TT Font weighs 406 Kbs so far and contains around 500 characters.</p>
    <p>Question 2:<br>
    Do you know of any FontLab forum that can be accessed through a) Outlook and/or b) web?</p>
    <p>Question 3 (a bit off the main theme):<br>
    How can I turn the colour red off the glyph cells that are supposed to have open contours once I've made sure that the contours are closed? (No more nodes marked with an X). When I re-open the font the cells are still marked red.</p>
    <p>Thanks,<br>
    Mosh</p>
