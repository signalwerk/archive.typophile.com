    <p>The idea behind Geotica was to build a font out of -more or less- simple geometrical line elements. The open wire frame could then be left open or (partially) filled.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/geo_specimen_5737.png"></div><p></p>
    <p>Geotica comes in four different grades or line thicknesses (One, Two, Three and Four) so it’s suitable for a broad use. Each grade has four styles and is loaded with swashes, final forms, lots of ligatures and ornaments. There are 16 fonts in total.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/geo_family_4908.png"></div><p></p>
    <p>More info on availability you can find &gt; <a class="freelinking external" href="http://www.josbuivenga.demon.nl/geotica.html" rel="nofollow">here</a>.<br>
    Also don't forget to have a look at the pdf attached below.</p>
    <p>Hope you like it!</p>
