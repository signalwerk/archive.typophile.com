    html: |-
      <p>Doing this reminds of how easy production art is these days compared to my earlier years. This took me 20 minutes this morning. In the 1970s, it would have been days of film neg opaquing and reversing with even more time doing camera ready art, followed by:<br>
      Reverse board art and come back as Pantone 123, surprint layer B as Pantone 456 printed last. Print layer C first as Pantone 789 and Spread to trap. Do not choke hairlines on overlay A. Dull varnish board art and Reprint layer A as gloss varnish. Must see composite proof before printing.  See you at press check...</p>
      <p>Best wishes and continued success, Jos!</p>
      <p>ChrisL</p>
