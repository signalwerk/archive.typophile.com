      <p><code>Make a custom version of the font(s), using FontLab.</code></p>
      <p>That would be ideal, and I have edited some of my own fonts (the ones I use most). However, if you take the complete Minion Pro, Myriad Pro and Cronos Pro families, right there you have almost 150 files to edit. A few more Adobe Pro families (if you do work for a firm that has Portfolio 10) and you've become a full-time font patcher. And that's if the firm has FontLab.</p>
      <p>Of course you can patch only the fonts you need to use (if that's a possibility), but I was hoping to find a simpler, less time-consuming solution. I think the bottom line is that such a solution doesn't exist.</p>
