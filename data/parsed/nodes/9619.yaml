    html: <p>It once was something like Neil Bold, but it has been grossly distorted. OptiFonts has a digitial version as discussed on <a href="http://www.typophile.com/forums/messages/83/65618.html" target="_blank">this thread</a>. It is closer to the original than Mobley, which just claims to be 'inspired' by it. Note that there is some doubt about which name OptiFonts used. It may have been 'Natty', based on information in one font file I saw.</p>
