    html: <p>Nice catch, Paul! ;) <br> <br>I know of <a href="http://www.philsfonts.com/showing.html?sku=AG61706101P1&amp;start=1" target="_blank"> Quirinus Bold</a> (we actually purchased a  <br>license a few months ago) but the contrast between  <br>strokes and hairlines is so extreme in that cut that  <br>I never made the connection with your sample.  <br>The version in your sample is simply delightful and  <br>should be digitized. It looks so contemporary that  <br>it made me believe it was something by <a href="http://www.psyops.com/html/specimens.html" target="_blank"> Psy/Ops</a>  <br>or <a href="http://www.cape-arcona.com/" target="_blank"> Cape-Arcona</a>).</p>
