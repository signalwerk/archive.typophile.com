  html: <p>I had a sample that the type gurus here couldn't identify a few months ago. <br> <br><img src="http://www.typophile.com/forums/messages/83/11073.jpg" alt=""> <br> <br>Anyway, I just identified it thanks to a link someone posted in a different forum.  <br><a href="http://www.creativepro.com/story/feature/19512.html" target="_blank">http://www.creativepro.com/story/feature/19512.html</a> <br> <br>It's by Aldo Novarese, and it's called Quirinus. Agfa-Monotype has it digitized. I'm surprised no one caught it, but I appreciate the attempts! <br> <br>Paul</p>
  html_clean: <p>I had a sample that the type gurus here couldn't identify a few months ago. <br> <br><img src="http://www.typophile.com/forums/messages/83/11073.jpg" alt=""> <br> <br>Anyway, I just identified it thanks to a link someone posted in a different forum.  <br><a href="http://www.creativepro.com/story/feature/19512.html" target="_blank" class="link-external">http://www.creativepro.com/story/feature/19512.html</a> <br> <br>It's by Aldo Novarese, and it's called Quirinus. Agfa-Monotype has it digitized. I'm surprised no one caught it, but I appreciate the attempts! <br> <br>Paul</p>
