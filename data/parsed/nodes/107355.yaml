      <p>Neither Bembo nor Garamond is particularly <em>difficult</em> to read.</p>
      <p>Before Century Schoolbook came along, textbooks for children were often set in Caslon - and, of course, for a while, nearly <em>everything</em> was set in Caslon.</p>
      <p>But typography is only an instrumentality - words and meaning are the goal. So it is natural and reasonable that if a simplified typeface will enable children to read texts with bigger words sooner, that will be the alternative chosen. As I pointed out earlier in this thread, an increased level of literacy, once achieved, can be expected to help people cope with dyslexia, because they will have more context, more sensory channels, and so on to aid them in reading.</p>
