      <p>I've never heard of that before and I'm not sure what you're implying.</p>
      <p>I've read a few but none of them have convinced me so far. I'm still puzzled as to how to cater to people with dyslexia particularly. When it comes to children, I have more faith in the tests that are being done, but when it comes to dyslexia they often start with faulty premises. When you hear about a dyslexic person who designed a typeface specifically for dyslexic people which is essentially designed to cater to his exact needs, and you then read scientific tests which completely undermine the premises this man has worked with, you don't quite know what to think anymore. I usually have tremendous faith in science (though comparing only three typefaces and no multiple ones from the same category [and possibly worse: not testing all categories for sans, serif and possibly slab] would invariably give scientific results of limited scope and practicality), but I also tend to believe someone with dyslexia knows exactly what he needs to perform better at reading. And yet, it's just anecdotal evidence. The typeface this person designed should also be tested scientifically with control groups.</p>
      <p>I must also say I haven't looked specifically into this issue. Now and then my obsessions lead me to research these areas, but I'm not actually looking to design typefaces for children at this point so I haven't done my very best to be able to draw a conclusion. As I said the tests I have read are either questionable or inconsistent with other tests. I don't have enough insight into the matter to draw any appropriate conclusions, but I do have just enough insight to suspect that while Verdana may perform wonderfully for kids, it's probably not the pinnacle of clarity and optimal reading for kids. More elaborate tests need to be done to get to such a conclusion.</p>
      </div>
