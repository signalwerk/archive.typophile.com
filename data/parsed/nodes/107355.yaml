      <div class="comment-spam-body"><p>Unmistakably? Yes, within the confines of the test, absolutely. I agree with a lot of the tests done there regarding point size and x-height, but I feel they fail quite miserably in the final tests which lead them to the conclusion that Verdana is the best option. First off, they only compared three typefaces. Of Verdana it was already expected it would perform well, Times New Roman is used to check whether sans or serif works better but I submit TNR wouldn't be a good serif choice for children in the first place so the only thing you might conclude here is that sans in general works better for children, and of Sassoon Primary it could almost be expected it wouldn't perform as well as Verdana considering the /a looks too much like /o, and the /g has a similar shape while it's probably best practice to use a double-storey /a and a single-storey /g. They start off with questionable typefaces, test them on a rather small group and then conclude that Verdana performs best, which was already to be expected.</p>
      <p>From all the typefaces around, I'm convinced Verdana performs rather well for children, but I'm absolutely not convinced Verdana is the best choice. I feel tests like these are often done by people who aren't particularly well versed in typography. I may be wrong, but that's the feeling I get from this test.</p>
      </div>
