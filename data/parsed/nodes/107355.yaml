      <p>When talking about typefaces for dyslectics, I think it we should take notice that several researchers in this field find it highly questionable wether typefaces such as ‘Open Dyslexic’, ‘Dyslexie’ and ‘Sylexiad’ even meet the needs of dyslectics at all. To me, projects like ‘Open Dyslectic’ seem rather idiosyncratic and unreflected. For example the ‘banding effect’, caused by the thickening of the horizontals,  can also be achieved by more line feed, or taking a slightly bolder typeface. More differentiation between characters (as promoted by the creators of ‘Open Dyslexic’, ‘Dyslexia’ and ‘Sylexiad’) such as bdpq can also be reached by designing asymmetric counters (such as in ‘Source Sans’) or by increasing the thick-to-thin contrast in a more conventional, but still asymmetrical way (such as in Albertus, Angie or DTL Argo). As far as I know, none of the researchers involved in projects such as ‘Dyslexie’ tested their own ‘inventions’ against other sans serif typefaces than Arial. Their interpretation of the ‘banding effect’ was not even tested against other typefaces of similar (but professionally executed) design such as the widely available typeface Antique Olive or, of more recent date, FF Balance by Evert Bloemsma. For type designers and typographers it may be interesting to know that our colleague Henk Gianotten got into contact with the person who did the research accompanying the development of ‘Dyslexie’ (designed by Christian Boer). He asked her if she had been aware of literature on the subject of legibility and readability such as Robert Hillier (who did Sylexiad), Sofie Beier and Gerard Unger. The answer was ‘No’ … When Henk Gianotten asked why she had not been reading this literature, she said that it was because ‘it was not available in the databases’ she had access to. Which is a bit strange, because Christian Boer happens to be a graphic designer. The Netherlands are a small country and so is the graphic community. Being a graphic designer and not having heard of people like Gerard Unger or Gerrit Noordzij is virtually impossible. Especially when you are a researcher. When googling dyslexia one can hardly overlook Robert Hillier I think. Maybe they simply did not want to know about other opinions on the subject, let alone research projects, findings or results?</p>
      <p>I think it is more interesting hear what researchers who know both about science and typography tell us about typeface design for children with learning problems:<br>
      In her PhD project at the university of Leiden, Ann Bessemans scientifically tested modified versions of Frutiger and DTL Documenta that were distorted in ways that are similar to those in ‘Dyslexia’ against the non-distorted versions of these typefaces. It was proved that none of this kind of distortions were of any help. The only kind of ‘distortion’ that seems to help is one in which she changed the horizontal proportions by widening and narrowing some of the characters. But this was only of help for children who are beginning to read, it did not seem to be of any help for children with more reading experience (if I remember this correctly). And (at least in my opinion) even this kind of ‘irregular patterns’ can also be achieved by using existing typefaces which already show clear differences in horizontal proportions by design. Examples of this are typefaces such as Futura, Gill Sans and DTL Haarlemmer Sans, just to name a few. But that has not been tested, so it is just my personal guess. I am aware that Futura, Gill and Haarlemmer are not free fonts, I only want to point to the kind of ‘features’ to look for when choosing (free) sans serif typefaces for dyslectics and/or dyslectic children. But beware of Futura, its single story ‘a’ and ‘g’, also know as ‘infant characters’ are often believed to be of help for beginning readers. From a scientific point of view, this seems to be highly questionable as well. Here is an excellent review and an article on this subject by Thomas Phinney: </p>
      <p><a href="http://www.thomasphinney.com/2012/06/should-dyslexics-unite-on-a-typeface/" title="http://www.thomasphinney.com/2012/06/should-dyslexics-unite-on-a-typeface/">http://www.thomasphinney.com/2012/06/should-dyslexics-unite-on-a-typeface/</a><br>
      <a href="http://www.commarts.com/columns/should-dyslexics-unite.html" title="http://www.commarts.com/columns/should-dyslexics-unite.html">http://www.commarts.com/columns/should-dyslexics-unite.html</a></p>
