      <p>"Is there any sense in Dutch dyslexia organizations promoting Verdana?"<br>
      I think they overestimate the impact of Verdana's design principle, which is high legibility for low resolution screens. Wouldn't a monospaced typeface like Courier work much better?</p>
      <p>Now I think about it, I actually think that's a valid question. If asymmetry and variety in letter forms is so important, why have I never seen monospaced fonts mentioned in dyslexia research? As I said, they probably fabricated solutions before even properly understanding the issues.</p>
      <p>And I just realized something else. Why is there so much time wasted on dyslexic fonts when in all likeliness a lot of issues can be solved by proper typography? Read this: <a class="freelinking external" href="http://uxmovement.com/content/6-surprising-bad-practices-that-hurt-dyslexic-users/" rel="nofollow">http://uxmovement.com/content/6-surprising-bad-practices-that-hurt-dyslexic-users/</a></p>
      <p>Most of these bad practices are being avoided in dyslexia-specific material, based on image results on Google, but perhaps doing proper typography in general helps dyslexic people read regular typefaces better. I understand typography and typefaces aren't mutually exclusive, but progress should be made in all areas, not just the typeface. It's good to have a wheelchair when you can't walk, but its application is limited in a world full of staircases.</p>
