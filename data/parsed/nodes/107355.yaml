      <p>(My comment here is not speciﬁcally about slow learners.)</p>
      <p>It seems to me there are two opposing concepts of “readability”.</p>
      <p>On the one hand, favoring the textual content, the idea is to use simple, child-friendly typefaces that help the learners to progressively read more sophisticated content (measured in terms of “reading age”).</p>
      <p>But I wonder, why not turn things around, and assess “reading age” by how well learners deal with more sophisticated typography? Let’s assume that would involve Bembo, Garamond, etc.</p>
      <p>It could be argued that restricting learners to simplistic typography restricts their ability to progress, stunting their cultural growth.</p>
      <p>Ideally, reading and typography go hand in hand.</p>
