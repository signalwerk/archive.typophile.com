      <p>Being dyslexic and coming from a different background are two different categories.</p>
      <p>Can't think of a free font at this moment, but commercial font families like <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/frutiger/" rel="nofollow">Frutiger</a>, <a class="freelinking external" href="http://www.felicianotypefoundry.com/cms/fonts/flama" rel="nofollow">Flama</a> or <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/guardian/sans_text" class="freelinking" rel="nofollow">Guardian Sans</a> were conceived for satisfying the typographic needs of large groups of people. There is an interesting article in <a class="freelinking external" href="http://www.baselinemagazine.com/browse_buy/magazine/current_issue/contents/" rel="nofollow">Bseline's 61th Summer issue</a> tittled "Letter and symbol misrecognition in highly legible typefaces for general, children, dyslexic, visually impaired and ageing readers” by Thomas Bohm which will be useful to read.</p>
      <p>On the other hand you have the perfect environment for conducting your own tests. All you have to do is to print text samples with different fonts and ask what your readers think about them.</p>
