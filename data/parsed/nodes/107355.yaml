      <div class="comment-spam-body"><p>Well, I suppose with these tests one wanted to gain insight into what typographically works best rather than insight into the children themselves. Assessing reading age would be on an individual basis, wouldn't it?</p>
      <p>You have a point though. By assessing the reading age one could better cater to their needs, rather than complimenting their reading level now. Theoretically they may improve in reading performance on the long run.</p>
      <p>I have the feeling this aspect of practice will be better for children anyway. I mean, practice is inherent in learning and I'm not suggesting they don't do that. However, initially I had problems with reading so my parents practiced with me every day, and in no time I was at the top of the class and even won a reading competition and later some poetry competitions. I bet reading development can be improved on, if only more tests are being done that give a lot more insight into reading development and the correlation between typography and age. I often feel we pretend to have the best educational system that is achievable, but I think we're greatly undermining our abilities. Dyslexia is a particularly good example, where many schools still think it's akin to being a slow reader or being unintelligent. People with dyslexia tend to be very intelligent but just require a slightly different education. Our psychologies need to be taken into consideration more when it comes to education.</p>
      </div>
