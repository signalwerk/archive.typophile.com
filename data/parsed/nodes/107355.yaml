      <p>&gt;Is there any sense in Dutch dyslexia organizations promoting Verdana?</p>
      <p>The organizations supporting dyslexic communities are unlikely to promote any one font over another, because there is zero science to support the belief that a particular font helps dyslexic readers. They might post something on their blogs or sites that make common sense suggestions and recommendations  about general readability, or they might even point to anecdotal reports that individuals like a particular font, but this is a very, very long way from "promotion".</p>
