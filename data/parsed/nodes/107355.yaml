      <p>"But beware of Futura, its single story ‘a’ and ‘g’, also know as ‘infant characters’ are often believed to be of help for beginning readers."</p>
      <p>I find that rather funny, because one argument says these simplistic forms work better while the other argument recommends as much variety between characters as possible, which is the opposite of Futura's design principle.</p>
      <p>My father is slightly dyslexic and I might be too. When I was a kid my parents used to practice reading with me every day, though this was to compensate for learning difficulties due to Pyknolepsy (a form of epilepsy) and Asperger syndrome, though the latter wasn't known then and the notion that I might be slightly dyslexic didn't come until quite recently. I've been experiencing more issues reading, switching some letters around at times and forgetting how to spell certain words while I've always been pretty good with language, despite my shortcomings. Either way, I can't say this will work for everyone, but I was taught to read with conventional methods and a lot of practice and eventually I became the best of the class in reading and writing. Whether I have slight dyslexia or not though, I've always been skeptical about the dyslexic fonts I've seen. I haven't done any tests or done any research, but I tend to believe that non-repeating elements will potentially make it easier for a dyslexic person to differentiate between letters, because as far as I'm aware they have a tendency to rotate letters in their head (my father even forgets what's left and right at times) which is what supposedly causes them to read less efficiently. However, I never understood why dyslexic fonts have to be so ugly. I'm fairly convinced a typeface could be made which is easy to read for the dyslexic and not aesthetically displeasing for regular readers (assuming for some reason dyslexics don't notice aesthetics in type). Perhaps such typefaces already exist. Perhaps an exaggerated Legato would do the job.</p>
      <p>Also, although I certainly understand why some designers feel the need to design a typeface for dyslexic people, I think the solution to the problem has been established before even doing proper scientific tests. I also wonder on what grounds these typefaces will be validated by the end users. Grown up, non-dyslexic friends of mine often can't say which typeface is more pleasant for them to read (this often requires some knowledge of typography, optics and human psychology I think), so I question the accuracy with which dyslexic children could validate the efficiency of a typeface. And when you hear the people involved in these dyslexia type projects haven't even read basic legibility books, it doesn't confide confidence in me.</p>
      <p>Also, I know this is not entirely valid reasoning, but I find it odd that it often takes more than 10 years before someone is identified as being dyslexic, and yet everyone pretends to know the solution for them. In other words, they can't spot the symptoms well but they're experts at the solutions to these symptoms they barely recognize. I find that odd.</p>
