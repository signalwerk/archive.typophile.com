    html: |-
      <p>Verdana has an asymmetric, nib-informed ductus, which means that while /d and /p have rotated bowl shapes, /b and /d are not ﬂipped versions of one another. </p>
      <p>I’m not sure how visible this principle is during reading, but it conforms to the the idea that easily transformable glyphs can be problematic, which is the big gimmick in dyslexic fonts (as noted by AJ above).</p>
