    html: |-
      <p>I hate this subject. The misconceptions are vast and ignorance is boundless. </p>
      <p>Even if there was a miracle font out there which would make reading effortless for those of us who are dyslexic, what is the point? First, this miracle of typography does not exist and never will. Second, are we proposing a special library of books for dyslexics similar to braille? If this miracle font does exist, will all the newspapers and road signs change to the dyslexic friendly font? If you teach youthful dyslexics to read the this wonderful font, how does this in any way help them navigate a world of dyslexic unfriendly fonts.</p>
      <p>The problem is not dyslexia. The problem is the outdated, ineffectual methods used to teach people with dyslexia. Non-dyslexics simply have no concept of the organization of the dyslexic thought process, and yet they feel comfortable devising torturous, useless methods of teaching people in this spectrum. Learning anything for dyslexics is only as difficult as the obsolete structures used to teach them can make it. </p>
      <p>The one idea which essential is that dyslexia is not a disability. It is a slight difference in design.</p>
    html_clean: |-
      <p>I hate this subject. The misconceptions are vast and ignorance is boundless. </p>
      <p>Even if there was a miracle font out there which would make reading effortless for those of us who are dyslexic, what is the point? First, this miracle of typography does not exist and never will. Second, are we proposing a special library of books for dyslexics similar to braille? If this miracle font does exist, will all the newspapers and road signs change to the dyslexic friendly font? If you teach youthful dyslexics to read the this wonderful font, how does this in any way help them navigate a world of dyslexic unfriendly fonts.</p>
      <p>The problem is not dyslexia. The problem is the outdated, ineffectual methods used to teach people with dyslexia. Non-dyslexics simply have no concept of the organization of the dyslexic thought process, and yet they feel comfortable devising torturous, useless methods of teaching people in this spectrum. Learning anything for dyslexics is only as difficult as the obsolete structures used to teach them can make it. </p>
      <p>The one idea which essential is that dyslexia is not a disability. It is a slight difference in design.</p>
