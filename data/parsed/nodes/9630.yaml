    html: <p>I've been an on-again-off-again member since being in school. For me, it's the events and the possiblity for networking that matters. But even then, it can be hard if the design community is insular. <br> <br>AIGA seems like one of those things where 50% scoff and roll their eyes and 50% treat it as part of being a designer. I'm still undecided.</p>
