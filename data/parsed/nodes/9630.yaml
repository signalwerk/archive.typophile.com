  html: <p>When I was first in school for design I remember finding the Pricing &amp; Ethical Guidelines book and found it very intriguing.  I also found it cool that there was a organized union for Designers, and they could help you get a lawyer if  you ever felt ripped off.  (nice insurance for those of us in school weary of becoming a freelancer).  I never did join but was something I wanted to do once I graduated school. <br> <br>Anyway in the middle of here I transfered to Portland Oregon. <br> <br>The head of design of my new school is an AIGA member(an organization that is a lot more potent it seems than GAG) and he stresses that AIGA is very important to join, just for the contacts alone.  The only impact I feel they have had in my community is a bunch of guest speakers (and I am not complaining).  On the surface level they seem to offer a lot of the same stuff that GAG does. <br> <br>So I am a little confused.  Who does what?  If they both do the same thing who should I join?  Should I even join at all? <br> <br> <br>A while back I was talking to a friend of mine who is also the head of the AIGA student group, and I asked him... <br> <br>"What does AIGA do?" <br> <br>"pfft no one really knows". <br> <br>I graduate really soon and am confused.  I was hoping I could get some good testimonials on here. <br> <br>Thanks for any information.</p>
