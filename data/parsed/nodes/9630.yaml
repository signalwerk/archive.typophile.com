    html: <p>"he stresses that AIGA is very important to join, just for the contacts alone" <br> <br>He's 100% right about that. AIGA's main benefit to any member is that it's a good networking tool. <br> <br>The other benefits are all debatable. Some folks find a lot to get out of the AGIA, some folks don't. I was in it throughout school and a handful of years afterwords before finally bowing out. <br> <br>It's not a union of any sort. More of a club.</p>
