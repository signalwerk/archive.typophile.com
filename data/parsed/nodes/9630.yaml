    html: <p>After not attending a single AIGA function for 5 years, I gave up my membership.  It is better for young people as a place to meet.  Our local chapter does a lot of TGIFing at bars.  It is definitely a 30s and younger thing. If you are new in your area, it might be something to join for a year or two.</p>
