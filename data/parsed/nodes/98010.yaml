    <p>Hi all!</p>
    <p>Did you know that GlobalType is the world’s largest collection of historic typefaces? Almost complete for the 19th and 20th century (til ~ 1970) and before? Available online since 2004? Thanks to the acribic work of Mr. Hans Reichardt from Linotype who allowed me to publish his typeface stock?</p>
    <p>We de not compare with the commercial typeface collections like myfonts or Fontshop that you need for your daily business. We will never sell fonts. GlobalType is meant as a resource for research, inspiration and education. We’ve got 91,076 typeface names, 2348 type designers and 1047 foundries – by now. Combined with ~ 4,000 sample pictures out of the German type specimen “Seemann”, it is possible to get an idea of what these typefaces look like, although the sample is mostly a simple “Hamburg”. For example, you will find 840 different “Garamonds”.</p>
    <p>The collection includes typefaces from Europe, America, Asia and Australia. The basis has been the standard references (Seemann: Handbuch der Schriftarten 1926, with supplementations through 1939, Jaspert/Berry/Johnson: The Encyclopaedia of Typefaces 1970, and Mac McGrew, American Metal Typefaces of the Twentieth Century 1995).</p>
    <p>For those of you who didn’t know yet about GlobalType, here’s the entrance:</p>
    <p><a class="freelinking external" href="http://www.global-type.org/Searching.743.0.html" rel="nofollow">Searching for typefaces</a></p>
    <p><a class="freelinking external" href="http://www.global-type.org/Explanatio.785.0.html" rel="nofollow">How-to for the effective use of the Search menu</a></p>
    <p><a class="freelinking external" href="http://www.global-type.org/Handbuch-d.757.0.html" rel="nofollow">Description of the “Seemann” type specimen</a></p>
    <p><a class="freelinking external" href="http://www.global-type.org/Onion-mode.593.0.html" rel="nofollow">The “Onion Model”</a></p>
