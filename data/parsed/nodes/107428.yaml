    html: |-
      <p>Sorry, don't know the answer and doubt actually there's one. I'm pretty convinced this is no font but a custom lettering by <a class="freelinking external" href="http://www.artbyforster.com" rel="nofollow">Anthony Forster</a> himself.<br>
      Reminds me of <a class="freelinking external" href="http://www.myfonts.com/fonts/profonts/thalia" rel="nofollow">Thalia</a> though. There are also <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/?q=mikado" rel="nofollow">Mikado</a>/OPTI <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/?q=miyako" rel="nofollow">Miyako</a>/Scriptorium <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/?q=cipango" rel="nofollow">Cipango</a>/Solotype <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/?q=emperor" rel="nofollow">Emperor</a> without being any of them of course... May be they inspired him to create this lettering...<br>
      Another one: <a class="freelinking external" href="http://www.myfonts.com/fonts/coffee-bin-fonts/letterhead" rel="nofollow">Letterhead</a> by Coffee Bin</p>
