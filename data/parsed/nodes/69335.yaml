    <p>I'm sure American people know the story, but I'm certain that everyone here will find it interesting. In an article about Mark Twain I've read yesterday, I've discovered that the writer went bankrupt in late XIX century, losing 200.000 dollars in a financial investment in the Paige Compositor, a typesetting machine which was a commercial failure. A fast Google search gave some interesting info on the episode:</p>
    <p><a href="http://www.uh.edu/engines/epi1372.htm" title="http://www.uh.edu/engines/epi1372.htm">http://www.uh.edu/engines/epi1372.htm</a></p>
    <p><a href="http://www.marktwainhouse.org/themuseum/archivist.shtml" title="http://www.marktwainhouse.org/themuseum/archivist.shtml">http://www.marktwainhouse.org/themuseum/archivist.shtml</a></p>
    <p>The story soon remined me about another tyepsetting system gone wrong, the German Uhertype, which predated photocomposition in the Twenties (more info on Christopher Burke's book on Jan Tschichold, who designed a Gill-inspired sans for the machine).</p>
