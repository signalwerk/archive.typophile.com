    <p>Hi!<br>
    Happy spring to everyone. At least it feels like spring. (No more snow, thanks.)</p>
    <p>It's been a while since our last update, but we've been busy. We have two new releases and an update to tell you about.</p>
    <p>/ / / / / </p>
    <p><strong>New release: Galaxie Copernicus</strong></p>
    <p>Five years in the making, the Copernicus typeface has finally joined the Galaxie stable. Galaxie Copernicus is a reconsideration of the 16th-century types of Christophe Plantin.</p>
    <p>The face is a collaboration between Kris Sowersby and Chester Jenkins, and reflects both designers' styles and approaches. The face is a Plantin for the 21st century, reflecting the technology and aesthetics of today; not a revival, but a reconsideration of Plantin.</p>
    <p><a href="http://vllg.com/Village/GalaxieCopernicus/mudTyper+Weights/" title="http://vllg.com/Village/GalaxieCopernicus/mudTyper+Weights/">http://vllg.com/Village/GalaxieCopernicus/mudTyper+Weights/</a></p>
    <p>/ / / / / </p>
    <p><strong>New release: Stag Stencil</strong></p>
    <p>Stag Stencil is the latest addition to Schwartzco's growing Stag family. The faces - a collaboration between Christian Schwartz and Berton Hasebe - were commissioned by Esquire and Red Bull's racing magazine, both of whom wanted Stag's masculinity amplified by revealing Stag's "constructedness". The resulting Stencil faces are unusually organic for the style, which led naturally to stencil-ing the matching italics.</p>
    <p><a href="http://vllg.com/Schwartzco/StagStencil/mudTyper+Weights/" title="http://vllg.com/Schwartzco/StagStencil/mudTyper+Weights/">http://vllg.com/Schwartzco/StagStencil/mudTyper+Weights/</a></p>
    <p>/ / / / / </p>
    <p><strong>Update: National V2</strong></p>
    <p>National is the greatest New Zealand typeface ever published.* Since its release in October 2007, National has been incredibly well received and praised: the face was a Judge's Choice in the Type Directors Club TDC2 2008 competition; a great achievement for any designer.</p>
    <p>Due to public demand and personal curiosity, Kris has added three weights to National: Thin, Light and Black in roman and italic. These new weights extend the versatility and usefulness of the family and notch up the covet-ability of the face to "Must Have".</p>
    <p><a href="http://vllg.com/KLIM/National/mudTyper+Weights/" title="http://vllg.com/KLIM/National/mudTyper+Weights/">http://vllg.com/KLIM/National/mudTyper+Weights/</a></p>
    <p>*Until Kris releases his next design.</p>
    <p>/ / / / / </p>
    <p>Coming in the next few days: A new tote bag and a mini catalogue / poster. Stay tuned...</p>
    <p>/ / / / / </p>
    <p>...at our Twitter feed. </p>
    <p>Where you can read all the latest news, sightings, and whatnot. (We promise not to over-twit.) </p>
    <p><a href="http://twitter.com/vllg/" title="http://twitter.com/vllg/">http://twitter.com/vllg/</a></p>
    <p>/ / / / /</p>
    <p>Thanks again.</p>
    <p>Chester &amp; Tracy Jenkins<br>
    Village<br>
    206 Front Street #4A<br>
    Brooklyn, NY 11201</p>
    <p>telephone ++1 718 852 1005<br>
    fax ++1 718 852 1006</p>
    <p><a href="http://vllg.com/" title="http://vllg.com/">http://vllg.com/</a> / / / / / / / / / / / / / / / / / / / / / /</p>
