    html: |-
      <p>Is it just me (or my computer) or are some of the longer stems a good bit thicker than shorter stems?  Like the j and the alt-j, the straight one looks chunkier.  Maybe it's just my eyes plying tricks on me with the way the semi-serifs are placed in there making a sequence like "un" feel like the middle two stems have different widths at the top and bottom. Not necessarily a critique, just be aware.</p>
      <p>I echo Dan about the g, although I think it might have the same weight as most of the others, but the e and o and f to me seem a bit thin.  The R looks somewhat anemic, but what might work better is to lengthen out the P R E F characters, which have a lot smaller horizontal width, so maybe make them as wide as the V or N might help.</p>
      <p>Also you P and R have quite distinct bowls on to, is this intentional or just testing two types?  If so the one you've got on the R is the one to go with.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
    html_clean: |-
