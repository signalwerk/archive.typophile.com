      <p>Nice. Just two ideas:</p>
      <li>If you're thinking about text composition as well as display, will the tails on the <strong>a</strong> and <strong>u</strong> be distracting in full paragraphs? They're the only decorative flourishes in an otherwise rather austere design, and they might create an inconsistency in spacing (<strong>gh</strong> will set closer than <strong>ah</strong>, <strong>nn</strong> will set closer than <strong>un</strong>).</li>
      <li>To my not-so-fresh-anymore eyes, the top and bottom of the bowl on <strong>b</strong> look thinner and more tapered than the corresponding strokes on <strong>g</strong>.<br>
      </li>
