      <p>Hrm, if you're going to use the flourish on the d and the a, I'd probably make the j and r also use it and possibly the f, or at least see how they'd look with it.  The r as it is now looks a bit clipped at the join compared to the m, n, and p, although all of them seem a bit slim.  The q on th eother hand looks great.</p>
      <p>Maybe for the a (before doing other changes mentioned above), if you move over the join for the tail a little to the bottom left and then pull down more for the curve on the bowl.  Right now, it feels like it's been pushed way over to the right.  Something more like this (I didn't touch the bowl in this):</p>
