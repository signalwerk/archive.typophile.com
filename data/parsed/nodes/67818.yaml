    html: |-
      <p>Also, it is quite possible that you did nothing wrong at all. Someone else was just a better fit. </p>
      <p>I've applied to many jobs where I left the interview knowing that I nailed it, and did everything perfectly. The only question then is whether the next person interviewed, or the one before, did a better job. Sometimes yes, sometimes no.</p>
      <p>Asking why you didn't get the job can be touchy. You are pretty much questioning the judgment of the hiring team. I would only do so if I personally knew someone on the interview team.</p>
