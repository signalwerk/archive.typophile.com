    date_raw: 25.Feb.2010 12.31pm
    votes: null
    html: <p>I don't bother. If it's an email, which is easy to reply to, I might respond, "Thank you for the opportunity to apply/interview." My Creative Director is in the habit of emailing people who've sent in their resumés and telling them what was wrong with it that they didn't get an interview (usually typos and such). She said none of them had ever responded, but she seems to have wanted something from them. Not sure what as it can be an awkward situation. Perhaps a simple thank you for the warning would have appeased her but I doubt they were feeling grateful.</p>
