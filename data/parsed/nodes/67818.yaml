    html: |-
      <p><cite>Would it make any sense to ask them to reconsider ever?</cite></p>
      <p>No. They’ve already hired someone else before they get around to turning you down. Worse, you might be interpreted as a mental/unstable/stalker type, which is not something you want going around in the professional community.</p>
