    html: |-
      <p>Given how rare it is for anyone in the design field to send a rejection letter I think it might be worthwhile. Don’t beg or ask why didn’t get hired, just slip a business card into a nice thank-you note so they know you’re not holding a grudge should they need someone later.</p>
      <p>But only if they actually rejected you after an interview. if they rejected your resume it’s probably all automated anyway.</p>
