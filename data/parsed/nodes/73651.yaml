    <p>I know this might not be the correct place for this but this forum gets the most quality responses. I've never really tried to create lettering from scratch and this is my first attempt. I've only spent about 45 minutes on it and it is still very much a super rough idea. I just wanted to post it and let you guys tear it apart. I know it's nothing special but I would like to see what the community has to say.</p>
    <p>Thanks,</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vivital_5124.jpg"></div><p></p>
