      <p>Are you trying to make a new typeface or just a logo? Have you defined the idea behind this?<br>
      Anyway, VIV should be spaced evenly since both letters are mirrored; I would make the top of the i as tall as the V, while the bottom (the vertex) needs to be optically adjusted (<a class="freelinking external" href="http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=01#pictloader" rel="nofollow">have a look here</a>), same for the A's bowl.</p>
      <p>Keep in mind that I'm not an expert, I would wait for other people's comments to show up</p>
