    html: |-
      <p>So I've been comparing this to Carter Sans, and am having a surprisingly hard time deciding if it's too close; usually I'm quite decisive about these things (often ending up with a more lenient opinion than many others). It's tantalizingly close to my personal threshold of tolerance, challenging me to better define it. So I'm curious what others think (and what elaborations Tomi, who's graciously not hiding Martti's origins, might provide). I'm personally interested neither in berserker protectionism nor an "anything goes, dude" attitude, but I <em>am</em> highly interested in smart and sensitive analyses.</p>
      <p>hhp</p>
