    <p>Hi-</p>
    <p>The Church of Finland commissioned me to make this family. Two of my old students re-branded the institution, and since there are so many independent parishes with their own graphic look, Kalle and Anssi thought it was best to do the make-over with typography.<br>
    They used Carter Sans for their initial presentation, and when it was accepted, they contacted me to make the Martti family.<br>
    I took some time to study the Carter Sans and Albertus, and their pre-Roman origin, and in the end I decided to just use the triangle shape serifs, and keep the basic design more modern, and since Martti is a display font, I kept the forms fairly narrow. I am currently making a wider variants for text setting.</p>
