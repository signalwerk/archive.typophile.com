    html: <p>Well, I can just say that while both Albertus and Carter sans feel rough-hewn and glyphic to me (lots of sharp corners (and cut-and-corner solutions in the latter), low contrast, relatively dark), this font made me associate rather more to the sort of semi-calligraphic display lettering <a href="http://www.puh.nu/listor/bocker/z/images/16986f.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">frequently</a> <a href="http://www.math.spbu.ru/user/jvr/LVK_html/jpg/aw_nobel.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">seen</a> in sophisticated Scandinavian graphic design from the twenties to the seventies, precisely the sort of look in fact that evokes "church" to us nordics. I would say that even more clearly than Carter sans, Martti marries these vague feelings with lettershapes of a conteporary dutch serif. It works better than with Carter sans (which I don't like, however well-crafted) because there's a shared chirographic DNA that binds them together.</p>
