    html: |-
      <p>And I'm suppose to add something positive after being called an old fart?</p>
      <p>Mr Puckett, if you don't know how to do all of that stuff you list, why not hire someone to advise you on it, or do it for you. Is that work worth giving away 50 or more percent on the royalties of the design?</p>
      <p>Yes its easy to miss details when your new to this, but hammering away at it until you get it right does give you the experience to maybe do it a little better the next time. It is a process you know.</p>
      <p>My fonts did not start out perfect, nor are they perfect today, not with "best practices" changing as new applications get released.</p>
      <p>For my clients, I've looked at and fixed many others designers work over the years, and trust me, font quality and design reputation have nothing to do with one another. So don't be so afraid of updates, fonts are software, and all that software stuff has to get updated now and again.</p>
      <p>I went the foundry route when I started, and release several designs through ITC. What a laugh riot that has been these last 15 years or so. Those 20% royalties (up from the 10% ITC used to pay) really add up to a revenue stream that just about feeds my cats. When you see 95 cents as your take on an individual font sale, you quickly realize that your well-being is far down the list of whoever is selling your work.</p>
      <p>Selling licensing exclusively, on my own, pays me a respectable income, I know where every font goes, I have a personal relationship with most of the people who license my fonts, which allows me to be flexible and respond to their needs. Like adding additional glyphs, or allowing them to do things prohibited by our EULA. </p>
      <p>I guess I'm different than most type designers in that I like doing business. Drawing type and making fonts is great, but so is negotiating a large enterprise license. And when that large enterprise license gets sold, I get the money. (my lawyer gets some as well).</p>
