    html: <p>As has been noted in other threads on this subject, royalties are more complicated than what the basic rate offers. For instance, if I sell through MyFonts I get a higher royalty than Fontshop, but if I sell through Fontshop I get the benefit of Fontshop’s international direct sale, international sales partnerships and the benefits of Fontshop’s international marketing. And some vendors might pay a lower royalty on their direct sales, but a much higher royalty on fonts re-sold through a third party. Finally, when working with a foundry that pays a lower royalty, one can often get help testing and finishing production on the font—specialized labor that their staff may do much more efficiently than a single designer working alone.</p>
