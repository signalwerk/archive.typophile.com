    html: <p><i>It's surprisingly rare.</i> <br> <br>Really? I'm under the impression that most type designers  <br>agonize over naming their fonts. I mean, you spend all that  <br>time on the font itself, you want to be just as careful with  <br>the name. I think the name can be just as important as the  <br>design and it's not easy to come up with a good one. I  <br>almost never use the one I start out with. And I'm not  <br>always happy with what I end up with, especially some of  <br>my earlier ones.</p>
