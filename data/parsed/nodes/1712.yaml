    html: "<p>I hesitated putting Mostra on the CD. But I wanted to  <br>include something useful that you couldn't get for free.  <br>Plus, it's only one of a five weight family, so maybe  <br>someone would like it enough to buy other weights. <br> <br>I got lucky with the name Coquette, which turned out to be  <br>much better than the name I wanted to use: Ruby Script.  <br>When I did the usual research to make sure the name  <br>wasn't already in use, I found out that there was a scripting  <br>language by that name. It would have been a mess on  <br>Google.</p>"
