      <p>Hmm, could it be a hinting problem?</p>
      <p>Have you checked your alignment zones and bluescale? Perhaps they are telling some details not to overshoot at a specific point size. I dont know arabic but it looks like a detail on the first example could infact be there but has been pressed up to the baseline because of such hinting instructions.</p>
