      <p>I just want to make sure I haven't gone completely looney and aren't seeing things just to quench my desire to find this font.</p>
      <p>Per Niks suggestion I had a look at Chevin, which seemed awfully similar to the font in question, but then went on to use MyFont's "More fonts like" feature where I, completely accidentally, came across this font.</p>
      <p><a href="http://new.myfonts.com/fonts/presencetypo/adesso/" title="http://new.myfonts.com/fonts/presencetypo/adesso/">http://new.myfonts.com/fonts/presencetypo/adesso/</a></p>
      <p>95% sure it's Adesso Italic. In the screenshot it looks like it might be a Light version, but as far as I found there is no such weight.</p>
      <p>Anyway, some confirmations before I stop searching, go ahead and buy this font would be reassuring :)</p>
