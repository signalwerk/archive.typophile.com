    html: <p>If you're a Mac user, you should look at PopChar (OS 9) or PopChar X. This is one of my absolute must-have utilities; I've been using it since the early 1990s. PopChar installs a little icon in your menu bar, whose menu shows every character in the selected font. All characters are shown in the actual typeface, and at the size you selected in your preferences. If you're typing and forget or don't know a particular keystroke, simply select that character from PopChar's menu and it will be inserted into your text just as though you had typed it. PopChar will also show you the correct keystroke and ASCII code in a little information bar, so you can learn and remember it. <br> <br>Since PopChar is always in your menu bar, you can access it from any program without leaving that program; you don't need to switch to another utility. <br> <br>Depending on the program, PopChar sometimes has trouble determining which font you have selected, but if this happens, you can manually change the font PopChar displays by using a little submenu. <br> <br>Pop Char is also very handy for simply looking at all the characters in a font; it's especially nice for things like expert fonts, and you can also explore all the keystrokes. Whenever I get a new typeface, especially if it has an expert set or dingbats, the first thing I'll do is look at it with PopChar. <br> <br>You can also click on a sequence of characters and have them set in a little text field and then cut and paste them, but it's much easier to simply select them directly and let PopChar set them. <br> <br><a href="http://www.macility.com/products/index.html"> http://www.macility.com/products/index.html</a> <br> <br>By the way, f ligatures other than fi and fl are almost always packaged in a separate font as part of an expert set, so you won't find them by looking in the main text font. Different manufacturers bundle expert sets in different ways. Sometimes there is a little font that just contains ligatures and other alternate characters, sometimes ligatures, small caps, figures for fractions, and other goodies are together, but you usually don't get all the f ligatures (fi fl ff ffi ffl) unless you buy the expert set.</p>
