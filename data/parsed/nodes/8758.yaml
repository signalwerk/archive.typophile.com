    html: '<p>Ligatures: John is right, it depends on the designer, as far as we are talking of pre-Opentype formats. <br>My Reality (from Thirstype) includes even an rt ligature (as well as st and ct), an oddity to increase the contrast between the "displeasing" feel of the face (fostered by my personal malaise at the time, circa 1996) and my taste for classical typography. <br> <br>The spacing of the commercial version is messed up anyway. Even if they have sold nothing I would like to find the time to fix the spacing of the faces I care most about.</p>'
