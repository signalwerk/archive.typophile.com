    html: <p>Even better than Keycaps is the ITC Character Chooser. Displays every glyph in a given face at 18 and 36 points, and lets you copy and paste the characters into another program. It also shows the key combination.  <br> <br>Hmmm... seems they're calling it the Fontek Character Chooser these days. Don't let that dissuade you from downloading this utility. <br>(Mac OS9 only, as far as I know.) <br> <br><a href="http://www.itcfonts.com/support/utilities.asp?sid=HM6THHFVJQTL9KQ5RCRJVUKSPD9FCET7&amp;sec=sup" target="_blank">http://www.itcfonts.com/support/utilities.asp?sid=HM6THHFVJQTL9KQ5RCRJVUKSPD9FCET7&amp;sec=sup</a></p>
