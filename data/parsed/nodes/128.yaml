  html: <p>Is your problem that you're hoping your device font will be Verdana?  <br> <br>If so, device fonts map to whatever system font on the users system is of the same "type" (serif, sans-serif or "typewriter"), according to the tech notes (<a href="http://www.macromedia.com/support/flash/ts/documents/flashfonts.htm" target="_blank">http://www.macromedia.com/support/flash/ts/documents/flashfonts.htm</a>) these will be Arial on a PC and Helvetic on a Mac. <br> <br>If you want, you can embed Verdana and control its quality with actionscript. This will give you small, more readable, aliased text, but of course it will give you a bigger file. <br> <br>... or am I misinterpretting the problem?</p>
  html_clean: <p>Is your problem that you're hoping your device font will be Verdana?  <br> <br>If so, device fonts map to whatever system font on the users system is of the same "type" (serif, sans-serif or "typewriter"), according to the tech notes (<a href="http://www.macromedia.com/support/flash/ts/documents/flashfonts.htm" target="_blank">http://www.macromedia.com/support/flash/ts/documents/flashfonts.htm</a>) these will be Arial on a PC and Helvetic on a Mac. <br> <br>If you want, you can embed Verdana and control its quality with actionscript. This will give you small, more readable, aliased text, but of course it will give you a bigger file. <br> <br>... or am I misinterpretting the problem?</p>
