    html: <p>O.K., once again I hope I'm getting the problem right. <br> <br>I think that "device fonts" is a fail-safe, so that if the machine doesn't have the specified font, it will still be displayed in the proper style. Could it be that you have all of those fonts loaded on your machine and therefore "device fonts" doesn't have to switch over to the default? Try turning off Baskerville and see what it looks like. <br> <br>The filesize should tell you whether or not the font is being embedded.</p>
