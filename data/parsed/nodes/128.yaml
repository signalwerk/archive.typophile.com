    html: "<p>I think his problem was not a lack of understanding about aliased and anti-aliased text, but rather a concern that if a user didn't have a particular font loaded on their machine and if \"Use device fonts\" was selected, the font wouldn't be mapped to the proper device font (i.e. Avenir mapped to _sans). <br> <br>A few tests I made seem to prove this true. <br> <br>Here is a screenshot of an .swf file using Avenir, with Avenir loaded on my system: <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/11366.gif\" alt=\"Avenir in system\"> <br> <br>... and here is a shot of the same file after I turned off Avenir: <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/11367.gif\" alt=\"No Avenir in system\"> <br> <br>Apparently it maps to _serif as a device font. Can't think of a solution at the moment, except that if you want to use a device font, just use the device font (_sans in this case). <br> <br>~p</p>"
    html_clean: "<p>I think his problem was not a lack of understanding about aliased and anti-aliased text, but rather a concern that if a user didn't have a particular font loaded on their machine and if \"Use device fonts\" was selected, the font wouldn't be mapped to the proper device font (i.e. Avenir mapped to _sans). <br> <br>A few tests I made seem to prove this true. <br> <br>Here is a screenshot of an .swf file using Avenir, with Avenir loaded on my system: <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/11366.gif\" alt=\"Avenir in system\"> <br> <br>... and here is a shot of the same file after I turned off Avenir: <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/11367.gif\" alt=\"No Avenir in system\"> <br> <br>Apparently it maps to _serif as a device font. Can't think of a solution at the moment, except that if you want to use a device font, just use the device font (_sans in this case). <br> <br>~p</p>"
