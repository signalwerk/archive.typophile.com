  html: |-
    <p>I just completed a three month over haul of my entire web site. The learning curve was pretty strong, but I mucked my way through it. The biggest improvement is that I have e-commerce on the site now. </p>
    <p>Previously, I didn't have a way to offer automatic downloads at my site. Customers would pay for a font with PayPal and then I would get an email letting me know the order was placed and that I needed to send the customer their font(s). Now, it's all automatic, so I don't need to be at my computer 24/7.</p>
    <p>If you get a chance, stop by. I'd be interested in comments or suggestions for further improvements.</p>
    <p>Rob Leuschke<br>
    <a href="http://www.typesetit.com" title="http://www.typesetit.com">http://www.typesetit.com</a></p>
