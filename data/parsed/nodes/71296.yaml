      <p>Thanks Frode,</p>
      <p>As it has probably become apparently, I know enough to be dangerous. Some of the things I have found are just plain strange. For example, I used Adobe Fireworks to create some menus. But when I checked the browser compatibility (which I should have done before I released the site), Fireworks had created code that simply was incompatible with most browsers. Other issues deal with the use of  and  attributes.</p>
      <p>At any rate, thanks for the offer. I just need to work thru it, and learn in the process.... then I will be even more dangerous.</p>
      <p>Oh, and Hozea Ngoh... thanks for the screen shot. It helped. My wife did a screen shot of a couple of pages as well from a computer she has at work, and now I realize how bad my web creation really is. </p>
      <p>I'll get it working eventually. So thanks to every one who was kind with their comments. Time to get a clook into  Indexhibit or Wordpress.</p>
      <p>RL</p>
