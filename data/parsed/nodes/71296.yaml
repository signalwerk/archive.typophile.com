    html: <p>The front page is a disaster in Firefox and Safari—you’re breaking the HTML box model all over the place. There are misalignment and overlap problems all over the place in the menus. If you have a hard time with web design I recommend going with a CMS system like <a href="http://www.indexhibit.org/" rel="nofollow">Indexhibit</a> or Wordpress and just using a canned theme. You can setup a Wordpress site using a good commercial theme and throw in a store plugin without ever having to deal with any of the code yourself.</p>
