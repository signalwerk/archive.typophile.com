    html: "<p> the correct meaning of the word \"entasis\" is \"(being) in tension / tendency\"...  <br>the opposite of this term would be \"adraneia\" which means \"in-activity\"...  <br> <br>anyway, if you say in greek that something is in \"entasis\", then you mean that something is very strong... <br> <br>so i don't know, if soren's explanation (in other words, 'entasis' is the conception of 'helping \"less\" to look \"the same\" by turning it into \"more\"') is okay...  <br> <br>\"entasis\" is the phenomenon which leads to the action of the conception... and not the action itself... <br> <br>but maybe i'm wrong and the danish altered the meaning of this term for their vocabulary... <br> <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>ps: as far as for the dictionary, you will be amused to get to know what happened here in greece with the greek version of bringhurst's \"elements\"... george matthiopoulos and michael makrakis of the greek font society (gfs) who edited and translated this book, tried to introduce new typographic terms and invented some terms which didn't exist in greece... this lead of course to a discussion with some other \"experts\" on how correct the new terminology is and \"why using your term and not mine\"... greeks are so funny... </p>"
    html_clean: "<p> the correct meaning of the word \"entasis\" is \"(being) in tension / tendency\"...  <br>the opposite of this term would be \"adraneia\" which means \"in-activity\"...  <br> <br>anyway, if you say in greek that something is in \"entasis\", then you mean that something is very strong... <br> <br>so i don't know, if soren's explanation (in other words, 'entasis' is the conception of 'helping \"less\" to look \"the same\" by turning it into \"more\"') is okay...  <br> <br>\"entasis\" is the phenomenon which leads to the action of the conception... and not the action itself... <br> <br>but maybe i'm wrong and the danish altered the meaning of this term for their vocabulary... <br> <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>ps: as far as for the dictionary, you will be amused to get to know what happened here in greece with the greek version of bringhurst's \"elements\"... george matthiopoulos and michael makrakis of the greek font society (gfs) who edited and translated this book, tried to introduce new typographic terms and invented some terms which didn't exist in greece... this lead of course to a discussion with some other \"experts\" on how correct the new terminology is and \"why using your term and not mine\"... greeks are so funny... </p>"
