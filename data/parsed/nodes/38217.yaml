      <p><cite>In other words: putting serifs on i, j, l or r makes a sans face less sans.</cite></p>
      <p>I agree.&nbsp;&nbsp;;-)</p>
      <p><cite>With proportional type you still get the benefit of more white space around narrow letters, which supposedly makes serif faces more pleasant (if not easier) to read.</cite></p>
      <p>I cannot see the benefit of adding serifs plus space to <cite>some glyphs only</cite>. It does not solve anything, but may cause uneven spacing. Why does an i j l or r need more leftside space than an h or m or n or u? If a sans is spaced too tight, all letters need more space. In my desire to know how it feels to design an l-with-a-tail, I tried and considered it a pain: Either you add only little space to the right -- then you need positive kerning to make sure it does not bump into following letters &amp; punctuation marks. Or you avoid these collisions by increasing the l's right space, which results in holes in the text image, with some letter combinations -- then you need negative kerning to compensate for this. No extra trouble without the tail.<br>
      [Read as a remark about design technique, aesthetics or personal preferences being irrelevant here.]</p>
