    html: <p>If type designers start adding serifs to sans serif fonts to make them more legible, or for whatever reason, at what point do you say this is not really a sans serif font anymore? It's cheating! Sans serif means "no serifs"! Of course there's nothing wrong with the practice---there are many typefaces that combine elements of serif and sans serif design to good effect. Interesting that I've never heard of a serif font where serif's were removed to enhance legibility.</p>
