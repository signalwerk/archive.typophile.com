  html: <p>I am trying to nail down why it is believed that the serif on the lowercase <strong>i</strong> and <strong>j</strong> in fonts like FF Info increases legibility and readability. Is it that the serif makes the shape differ more from <strong>I</strong> and <strong>l</strong> when viewing conditions are poor and the dot joins with the rest of the letter?</p>
