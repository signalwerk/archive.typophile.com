    html: |-
      <p><em>He may have kicked it off in Officina Sans</em></p>
      <p>I most certainly did not, but I may have re-started the trend. ITC Officina is very much my version of Letter Gothic, which has the serif-i. The monospaced faces had to make the narrow letters wide and the wider ones narrow. So f, t and r had to be extended, i and j got a top serif and the l sometimes both top serif and bottom curl to the right. Same goes for cap I. </p>
      <p>With proportional type you still get the benefit of more white space around narrow letters, which supposedly makes serif faces more pleasant (if not easier) to read. In other words: putting serifs on i, j, l or r makes a sans face less sans. The fact that this also avoids common confusion between l, i, I and 1 is really only important for forms, lists, directional signs and other information where one has to pick out single letters rather than read word shapes.</p>
