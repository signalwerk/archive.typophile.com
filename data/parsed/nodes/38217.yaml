      <p>This is probably obvious but on the off chance that it is not - the origin of those 'serifs'*  is typewriter fonts where they clearly do serve a purpose. I can easily imagine a situation where somebody want to make a new sans &amp; is interested in the techy feel of the mono and 'hey presto!' the semi serif is born. Also, the fact that these 'serifs' clearly help in a mono may have led the designer to extrapolate that they helped in their design too. And depending on the design - they might have.</p>
      <p>The interesting question it seems to me is who started it? Was it by any chance... Erik S?</p>
      <p>*I don't know that I would call them that actually because they end up being part of the deep structure to my mind...</p>
