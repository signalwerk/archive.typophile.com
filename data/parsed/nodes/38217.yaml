    html: <p>You will hear many things on this topic if it gets going but let me start with the idea that a distinctive shape is helpful in reading the serif on some lc i &amp; j forms may help enhance distinction. Another thing it may be doing is helping to ensure that even with rougher treatment in spacing that some needed negative space is maintained. The bar may also draw your eye to or in some way highlight the dot - the real marker of difference for i &amp; j. But as far as I know there is no science on this. Just observation &amp; supposition.</p>
