      <p><cite> - there are so many other factors </cite></p>
      <p>I agree - Serifs per se added to the r i &amp; j etc do not generically* help. Speculating a little, apart from monos; It seems like with a really featureless Sans ( by which I mean an overly geometric one ) I can imagine the block serifs might help. Designs that are 'breaking' rules and are therefore harder to recognize might be candidates as well,** and faces where the design is modular too maybe. What do you think?</p>
      <p>* as in 'every time'</p>
      <p>** Talking about the Mix vs the Sans.. It seems like the Mix is pretty darn masterful really whereas I think Rotis isn't so much. Rotis may need the extra help. This is just shooting from the hip of course.</p>
