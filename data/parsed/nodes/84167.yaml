    html: |-
      <p>Thanks for the feedback, everyone. I'm willing to take another look at heavier weights—I just felt the whole page got to looking too heavy, but I'm not an expert and would like to broaden my experience.</p>
      <p>Nick, one of the things I'm most interested in is the way classical music is portrayed, and that includes typography. I want the subject matter of the site to appear ordinary and normal, so I don't want to go the New Music route of highly noticeable sans serif typefaces. (I'm a graduate student in composition, and I get enough of that in my conservatory.)</p>
      <p>I have no budget, so I'll look at the Myriad lookalike CartoGothic. Any other suggestions are highly welcome! Thanks! :-)</p>
