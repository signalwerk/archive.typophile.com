    <p>Hi everyone,</p>
    <p>Łukasz Dziedzic's "Lato" is just right for my web design, except it doesn't offer inline numerals or, more importantly, true small caps. Can anybody recommend something similar? To get a feel for what I'm looking for, observe Lato in action on my site: <a href="http://www.utcolmus.org/auditions.html" title="http://www.utcolmus.org/auditions.html">http://www.utcolmus.org/auditions.html</a> .</p>
    <p>I'm using Lato Light as my regular weight, and its Regular weight as my bold, so I need a typeface that's fairly light (not hairline, though), or offers a few different weights.</p>
    <p>Thanks!</p>
