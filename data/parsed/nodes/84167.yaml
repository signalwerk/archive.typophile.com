    html: |-
      <p>Mostly, I think that with webfonts the problem is: they should have been designer for screen.<br>
      The first and foremost think which hinders legibility is having not enough overall space. Lato is spaced tightly, and the lighter weights, they just give an headache to anyone which has even minor unease with reading onscreen. This, of course, goes for smaller point sizes.</p>
