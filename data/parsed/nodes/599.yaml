  html: '<p> I recently showed an illustration of a ﬂag with an “@” as the party symbol… Anyway, Now I’m looking for some political/revolutionary pangrams! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"><br><br>Something like this, but written like a pangram: <br><br>“The strength of the party is the unity with the motherland” <br><br>I’m really out of ideas, and my english isn’t that great… Anyone care to help? It should ideally contain “the party”, but anything that sounds political is good. <br><br>Thanks </p>'
