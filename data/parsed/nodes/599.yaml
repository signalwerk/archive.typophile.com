    html: <p> It's due tomorrow. I'm printing it on a inkjet in a semi-huge size... 1000x1400 mm.  <br> <br>I know that pangrams often yields clumsy results, but I feel it would be nicer than just writing the alphabet. One way around might be to collect a few of the typical catch-phrases for the revolutionary parties, and do some sort of text collage... <br> <br>I think it would be nice to use all the letters, but it doesn't neccesarily have to be one sentence now that I think about it. <br> <br>Thanks </p>
