    <p>Hi, i am sort of new here, long-time lurker, too shy to post...This is an arial-related question, so don't laugh...or do. I didn't want the first time i ever posted to be about Arial of all things, but what can you do? </p>
    <p>We have a client that needs Arial in semi-bold form, but from what i (think) i know, Arial Semi-Bold doesn't exist. You can almost mimic what it would look like by applying a faux bold to the regular font, but that's not going to help the client.</p>
    <p>Any ideas?</p>
    <p>Thank  you so much in advance and i apologize if this is such a ridiculous post,</p>
    <p>Olivia</p>
