      <p>Are you sure he needs Arial? Or does he think there are only two fonts in the world, Arial and Times New Roman?</p>
      <p>If the latter is the case, then you can safely give him a semibold version of Helvetica or Helvetica Neue (or perhaps even another more attractive sans).</p>
      <p>But you are right, there is no Arial semi-bold that I know of.</p>
