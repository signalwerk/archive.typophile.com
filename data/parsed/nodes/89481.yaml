      <p>I removed the V class, which contained /V/ and /W/, and kerned them independently to see what was really going on. In fact, I noticed that ALL kerning pairs are missing, except those of the <em>key glyphs</em> from each kerning class. Now I have a problem. I thought I could "brute-force" solve this by kerning each problematic pair individually, but now this isn't an option anymore.</p>
      <p>Any ideas? Does this has to do with the OpenType export preferences? What am I missing?</p>
      <p>I'm going insane: trying it all, comparing with other fonts... nothing seems to enlighten anything.</p>
