    html: |-
      <p>Sometimes, you have to go through and delete the over rides of class kerns.  If you keep the selection "class kerning with exceptions" on, it is quite easy to just tab to the next pair and add a zero to it by accident.  Overrides are marked in red, so you can run down the kern table and see if that is your problem.</p>
      <p>When you combine 2 classes, you have to remember to delete the kerning in the old key glyph that is now just a class member.</p>
