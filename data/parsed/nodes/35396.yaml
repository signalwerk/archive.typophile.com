    <p>Article: <a href="http://www.theage.com.au/news/travel/new-logo-new-class/2007/07/24/1185043075092.html" rel="nofollow">The Age</a>.</p>
    <p>Disregarding the kangaroo graphic... I really don't like the new type. The old type - a classic and memorable identity - had real <em>strength.</em> The new one looks lettered by a 12 year old. Examine that 'N'! <em>Mon dieu,</em> that 'S'! It looks, at best, like type from a toilet roll pack.</p>
    <p>Another unnecessary and backward provincial identity hack job! (IMNSHO as ex-Australian designer)</p>
