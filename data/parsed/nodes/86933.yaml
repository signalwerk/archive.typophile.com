      <p>Do agree with some of Garfield's least favorites - could never stand Souvenir, for instance, or Avant Guard or Rotis (with which The Economist had a brief flirtation). </p>
      <p>The small type in the original, great little Penguin historical atlases by Colin McEvedy was economical, attractive and read legibly and fluently in Times. Times was replaced by the higher x-height Rotis in new editions of some of the books. Trying to be contemporary, I suppose, they made the books look and read ugly: with Rotis, the sense is chopped up - it's harder to take in whole phrases and thought units at one time.</p>
