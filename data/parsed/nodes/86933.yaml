      <p>In terms of serving an introduction to typography Garfield did a good job.</p>
      <p>What is wrong with writing a book to give some depth to a topic in which most don't even realize exist? Every typography book I have ever opened starts with kerning and readability, typically an instant turn-off. Think about the first time all of you have come across that "aha" moment when you actually realized letters and words are packed with various functionality and personalities. Did this moment come when you had a personal experience with type, or were you force fed principles of typography by someone who knew more than you? 98% of the people I know “breath helvetica” not only ignorant to its rich history but in addition there are thousands of other faces that have crazy and interesting backgrounds. This allows the average reader to create a connection with a typeface and then hopefully realizing there is much to be learned about the topic as a whole.</p>
      <p>The book is a open door that invites people to learn more about a topic they didn't even know existed. </p>
      <p>Coffee Table Book? Sure. Successful in its intent? Yes.</p>
