      <p>His comments about Brush Script seem particularly off base:</p>
      <p>"Brush Script was made available by American Type Founders (ATF) in 1942, and its designer Robert E Smith gave it a lower case with joining loops, creating a quaint and consistent type that looked as if it was written by a fluid, carefree human. The problem was, no one you had ever met actually wrote like that"</p>
      <p>BRUSH Script isn't supposed to look like someone's writing. It's supposed to look like someone painted it with a BRUSH.</p>
