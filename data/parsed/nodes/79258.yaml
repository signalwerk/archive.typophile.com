    html: |-
      <p>I think in the beginning, you were saying "clean and simple" and so with that in mind...</p>
      <p>I think you've decided to put the dots back on the "i's" which is a wise move. I think because the name of the company is not a normal english word, it's important to dot your "i's" so to speak. Perhaps try it in the same color, you know, for cleanliness.</p>
      <p>I'm not thrilled about the biline font. perhaps try a sans serif font for the biline. Perhaps make it all caps so it's nice and blocky. Specifically, it's the two "A's in ALI and Accounting that aren't working together. Also, the ampersand is sort of jutting up and creating weird tension between the two lines of the logo.</p>
      <p>However, I DO like the two blues together. Perhaps once you choose the font for the biline, make it one of your lighter blues. Where you have the two blues and the gray isn't working for simplicity.</p>
    html_clean: |-
