    html: |-
      <p>Having a look to fonts tagged '<a class="freelinking external" href="http://www.myfonts.com/search/tag%3Abackslant" rel="nofollow">backslant</a>' on MyFonts might be helpful.<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/kursivschrift" rel="nofollow">Kursivschrift</a> Rueckwaerts and <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/roemisch" rel="nofollow">Roemisch</a> Rueck are the one I know.<br>
      Some Sudtipos might work too: <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/seashore-pro" rel="nofollow">Seashore</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/miss-packgope" rel="nofollow">Miss Packgope</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/miss-blaker" rel="nofollow">Miss Blaker</a></p>
