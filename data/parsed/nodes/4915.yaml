    html: <p><i>&gt;No Paul or Art? No James? No Carley?</i> <br> <br>Alyce, I'm glad to know that I'm not the only dinosaur around. Most of these youngsters are too hip for me.  <br> <br>I must confess that my popular music development was effectively arrested in the late 80s when I lived in an ashram. When I listen to anything with lyrics, it's most likely to be nostalgic. Plenty of James. Cat. Paul &amp; Art.  <br> <br>Or Elvis (C, not P). Sometimes Sting Andy &amp; Stewart. Or even David Jerry Tina &amp; Chris (anyone remember them?). <br> <br>More often than not, however, it'll be purely instrumental -- Wolfgang, Joseph, Ludwig. Or Antonin, Camille, Sergei.  <br> <br>In the afternoons, maybe Benny, Duke, Dizzy, Monk,  Miles, Metheny. Or possibly Weather Report. <br> <br>What can I say? Hopelessly anachronistic. <br> <br>-- K. <br></p>
