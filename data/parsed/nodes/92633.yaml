      <p>I saw this in my email the other day, and fell in love.<br>
      A few years ago I had alluded to this sort of thing:<br>
      <a href="http://themicrofoundry.com/ss_fraktur2.html" title="http://themicrofoundry.com/ss_fraktur2.html">http://themicrofoundry.com/ss_fraktur2.html</a></p>
      <p>The most notable thing to me is the rotational aspect of the Italic, which reminds me of the work of Gareth Hague (most of all his 2012 Olympics font, which I adore). I'd love to see more of that (and one day wrap my head around it well enough to implement it myself).</p>
      <p>hhp</p>
