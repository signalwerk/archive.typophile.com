      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Letraset1980catalog_5001.jpg"></div><p></p>
      <p>My father originally bought this 1980 Letraset catalog back when he was attending the photo-journalism school at Syracuse University. The sample book had a price of $1.00. Dang.</p>
      <p>I've kept the thing ever since he got out of college and then collected a number of others. In looking through these books one can easily find a lot of really nice display faces of which there is no "digital" TTF, T1 or OTF version. I'd love to have OTFs of faces like Transmission or Magnificat.</p>
