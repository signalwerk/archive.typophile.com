      <p>Your best bet is to try ebay for example:<br><a href="http://cgi.ebay.co.uk/Letraset-Original-Font-Book-Typography-1979_W0QQitemZ230006774812QQihZ013QQcategoryZ27322QQrdZ1QQcmdZViewItem">http://cgi.ebay.co.uk/Letraset-Original-Font-Book-Typography-1979_W0QQit...</a></p>
      <p>There is a pdf of a brief contents of a catalogue somewhere online (I've forgotten where at the moment) which is more annoying in its tantalising. I wish I had kept mine. Wouldn't recommend buying old sheets though, they had a short enough life when they were in general use.<br>
      Tim</p>
