      <p>Thank you all. Nick Job hit on the nose. Agree with all you suggestions. i have been given the opportunity to create an identity for a Mobile Electric Charging vehicle. The brief outlines the need to create branding for a "pilot" launch for a mobile electric charging station (vehicle) for 100% electric vehicles. the service will be available to eligible members in the US. The focus is to deliver/create something "green" and "environment" safe, convenient and service member focused.</p>
      <p>I originally had the E without the black border and without the slant. felt it needed a little more movement/emphasis, so i quickly used the slant tool in ai to get a feel for 'movement' and added the border. anyway, here are a few other ideas i'm kicking around. any thoughts are welcomed. </p><div class="imageWrap"><img src="http://typophile.com/files/e_6264.jpg"></div><p></p>
    html_clean: |-
      <p>Thank you all. Nick Job hit on the nose. Agree with all you suggestions. i have been given the opportunity to create an identity for a Mobile Electric Charging vehicle. The brief outlines the need to create branding for a "pilot" launch for a mobile electric charging station (vehicle) for 100% electric vehicles. the service will be available to eligible members in the US. The focus is to deliver/create something "green" and "environment" safe, convenient and service member focused.</p>
