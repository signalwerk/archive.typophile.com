    html: <p>I agree that the first version is the strongest icon, if you will. The curves need to be corrected, but I think it certainly conveys the concept of what you are trying to achieve here, and as a mark I think it is quite nice. Where it falls apart for me is in the later version when it tries to become the "e" in "e-charge." It feels like it is really trying too hard to become an "e." And I also agree with typeidentity, the type looks very clumsy and overly tweaked. Have you looked at pairing your first exploration with a simple logotype that says "eCharge?" As opposed to having the icon physically be the "e" in the logotype? Just some thoughts.</p>
