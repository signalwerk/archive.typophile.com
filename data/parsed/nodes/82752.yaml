    html: <p>hey everyone, here is the almost final version of the e-charge logo. Went through several renditions of the E and found the green E the best fit for what it will represent and readablity. Stylized the E a little to give the feel of a plug/pump without getting to detailed. The pump image is pretty close to what the actual charging mechanism looks like, but felt it was too redundant. The logo will be used on a promotional electric charge vehicle and will have supporting messaging/graphics. pretty content on where it's at. any glaring issue you might see, type, kerning, balance...etc...and if it's to clumsy of type be specific as to what bothers you. =) muchas gracias. </p><div class="imageWrap"><img src="http://typophile.com/files/e_12_4747.jpg"></div><p></p>
