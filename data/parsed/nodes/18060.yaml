    <p>I am looking for visual of a 15th century Russian letter 'A', and was hoping someone may be able to point me to a web site or other resource. If it is the 'cyrillic' alphabet then, fom my understanding it looks exactly like an 'english' letter A, though I would still like to see how that 'A' was drawn or painted during that period.</p>
    <p>Many thanks.</p>
