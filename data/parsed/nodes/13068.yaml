    html: <p>The best way to my point of view is to use the plug in Q2ID from Markzware. I use it for one years and I never regret my choice. I think there is a second option, but I'm not pretty sure. Open your Xpress file in the OS 9 system (Classic), save the file in version 4 and come back to OS X to open the file in InDesign. That way need to have the both system available on your hardrive. I found the Q2ID plugin easier to use. All information are saved and usable as it was in Xpress.</p>
