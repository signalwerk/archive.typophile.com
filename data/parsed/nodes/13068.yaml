      <p>InDesign can open Quark 4 files, but as far as I know it can't open any later versions, which makes it of limited use in that capacity, since I haven't used Quark 4 in awhile now.</p>
      <p>There is a nifty trick for Quark users - you can set your InD keyboard shortcuts to Quark shortcuts which makes the transition far easier. It's also helpful if you switch back and forth between the two programs as I do.</p>
