    html: |-
      <p>I've read that InDesign should be able to open Quark 4 files, thanks to some in-built capabilities. I tried, but it didn't work for me. The error message suggested the InDesign may not support the file format, or I may be missing a plug-in that supports the file, or the file may be open in another application. Not in my case.</p>
      <p>Have you hear of a Q2ID plug-in by Markzware? It enables you to open Quark 3.3 - 7.x  files in CS2 and CS3. It's a great idea – or a 'must' should I say, because the Classic in OSX Leopard (10.5) does not support Classic (or Quark 4 for that matter which only runs in Classic). We at work are about to get it so have no experiences yet, but it sounds very handy and worth the bucks.</p>
      <p>Get it here:<br>
      <a href="http://www.markzware.com/q2id/" title="http://www.markzware.com/q2id/">http://www.markzware.com/q2id/</a></p>
