  html: "<p>Hey, it's been a while.  <br> <br>Today I saw that this site, <a href=\"http://www.skycaptain.com/\" target=\"_blank\">http://www.skycaptain.com/</a>  <br>which happens to be my most anticipated movie of the year,  <br>was updated with all kinds of cool stuff, and in particular most <br>of the site is now using the font Futurex Phat, that I designed <br>and put into the public domain several years ago as part of the  <br>Futurex project! <br>see: <a href=\"http://www.1001fonts.com/font_details.html?font_id=180\" target=\"_blank\">http://www.1001fonts.com/font_details.html?font_id=180</a> <br> <br>Yeah, I'm sure some of you actually get paid to do fonts for  <br>movies, but this is my little time to shine! :D <br> <br>Take care!</p>"
  html_clean: "<p>Hey, it's been a while.  <br> <br>Today I saw that this site, <a href=\"http://www.skycaptain.com/\" target=\"_blank\" class=\"link-external\">http://www.skycaptain.com/</a>  <br>which happens to be my most anticipated movie of the year,  <br>was updated with all kinds of cool stuff, and in particular most <br>of the site is now using the font Futurex Phat, that I designed <br>and put into the public domain several years ago as part of the  <br>Futurex project! <br>see: <a href=\"http://www.1001fonts.com/font_details.html?font_id=180\" target=\"_blank\" class=\"link-external\">http://www.1001fonts.com/font_details.html?font_id=180</a> <br> <br>Yeah, I'm sure some of you actually get paid to do fonts for  <br>movies, but this is my little time to shine! :D <br> <br>Take care!</p>"
