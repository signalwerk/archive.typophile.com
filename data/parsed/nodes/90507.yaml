      <p>Mike, you’re right.</p>
      <p><em>RBIO-09R and RBIO-09DB are corporate fonts of Roland Corporation’s. The fonts have been used for logos etc. for their products. The original fonts were RBIO - REGULAR and RBIO - DEMI BOLD digitized by Roland about 1995–1996. (The typeface had existed before digital-era since 1980s.) Maniackers Design redesigned them. *Those are corporate fonts, not for sale.</em></p>
