  html: '<p>July 17, 2003 Malmo, Sweden <br> <br>The Fountain catalogue has been updated with the release of 2 new type families: <br> <br>Borgstrand - a mechanical font inspired by an old neon sign designed by Martin Fredrikson. <br>[ <a href="http://www.fountain.nu/catalogue/borgstrand.asp" target="_blank">http://www.fountain.nu/catalogue/borgstrand.asp</a> ] <br> <br>FTN Sauerkrauto- a family based on german license plates also designed by Martin Fredrikson. <br>[ <a href="http://www.fountain.nu/catalogue/sauerkrauto.asp" target="_blank">http://www.fountain.nu/catalogue/sauerkrauto.asp</a> ] <br> <br> <br>  <br>Malm</p>'
