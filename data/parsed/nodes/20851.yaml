    <p>—</p>
    <p>TypeCon2006 Update - June 22, 2006 - TypeCon Registration is Now Open!</p>
    <p>TypeCon2006: The Boston T Party<br>
    August 9-13, 2006<br>
    Hyatt Regency Boston<br>
    Boston, Massachusetts USA</p>
    <p>presented by The Society of Typographic Aficionados (SOTA)<br>
    in partnership with Massart and the Museum of Printing</p>
    <p>————————————————————————————————-<br>
    JOIN US IN BOSTON FOR THE TASTIEST TYPECON EVER!<br>
    ————————————————————————————————-<br>
    TypeCon2006: The Boston T Party is the ultimate event for anyone who<br>
    works with type or loves letters. The eighth annual TypeCon plays<br>
    host to a delicious mix of legends and innovators from Beantown and<br>
    beyond, including David Berlow, Mourad Boutros, Matthew Carter, James<br>
    Craig, Dave Farey, Sibylle Hagmann, Kit Hinrichs, Akira Kobayashi,<br>
    Kent Lew, Thomas Phinney, Paul Shaw, Nancy Skolos and Tom Wedell,<br>
    Clif Stoltze, Ilene Strizver, Adam Twardoch, and Robin Williams.</p>
    <p>The TypeCon2006 program will explore Boston’s rich printing history<br>
    and contemporary culture, type in motion, experimental lettering,<br>
    typography for gaming and mobile devices, and much more. Hands-on<br>
    workshops range from digital font production and expert typography<br>
    techniques to calligraphy and letterpress printing. Special events<br>
    include a type and design education forum, the Typophile Film<br>
    Festival, tours of Boston’s typographic hot spots, and the opening of<br>
    the TypeGallery, SOTA’s international exhibition of new type and<br>
    design.</p>
    <p>TypeCon2006 offers five days of education and entertainment in an<br>
    intimate, friendly setting. Conference registration fees start at<br>
    just $120, making TypeCon2006 the most affordable event of its kind.<br>
    Secure registration will be available on the TypeCon2006 website<br>
    shortly! Make plans to attend TypeCon2006 - it’s an event created<br>
    especially for you!</p>
    <p>TypeCon2006: <a href="http://www.typecon.com">http://www.typecon.com</a></p>
    <p>————————————————————————————————-<br>
    EARLY BIRD REGISTRATION IS NOW AVAILABLE! DON’T MISS THIS CHANCE TO SAVE BIG!<br>
    ————————————————————————————————-<br>
    SOTA is committed to bringing you a high-quality and affordable<br>
    conference. Conference registration and workshop fees are the lowest<br>
    you’ll find at an event of this quality in North America. Early-bird<br>
    discounts are offered to all attendees registering by June 30. Join<br>
    SOTA while you register for the conference, and receive an extra<br>
    discount!</p>
    <p>Early registration (through June 30)<br>
    SOTA members: $195 professionals/$120 students<br>
    Non-members: $235 professionals/$140 students</p>
    <p>Regular registration (July 1-July 27)<br>
    SOTA members: $225 professionals/$135 students<br>
    Non-members: $265 pro/$160 students</p>
    <p>Late/walk-up registration (after July 27)<br>
    SOTA members: $295 professionals/$175 students<br>
    Non-members: $345 pro/$200 students</p>
    <p>Optional pre-conference workshops are $50 for each half-day session<br>
    and $100 for each full-day session, plus materials/lab fees, if any.</p>
    <p>Secure registration is now available on the TypeCon2006 website!<br>
    Seating is limited - register today to book your spot!</p>
    <p>TypeCon2006: <a href="http://www.typecon.com/typecon2006_register.htm">http://www.typecon.com/typecon2006_register.htm</a></p>
    <p>————————————————————————————————-<br>
    NOW BOOKING - TYPECON2006 HOTEL AND HEADQUARTERS - HYATT REGENCY BOSTON<br>
    ————————————————————————————————-<br>
    The TypeCon2006 conference hotel and headquarters is the Hyatt<br>
    Regency Boston. The center of activity for TypeCon2006, the Hyatt was<br>
    recently updated with contemporary furnishings and plush, incredibly<br>
    comfortable Grand beds. The Boston Common, theatre district,<br>
    Chinatown, shopping, and other attractions are just around the<br>
    corner. The “T,” Boston’s efficient mass transit system, runs<br>
    underneath the Hyatt (Downtown Crossing stop). The hotel offers both<br>
    wired and wireless high-speed internet access, amazing views, and a<br>
    friendly staff. The Hyatt features top-notch restaurants and a<br>
    spacious but cozy lounge area, heated indoor pool, sauna,<br>
    state-of-the-art fitness center, and many other amenities.</p>
    <p>We have negotiated a discounted room rate for TypeCon2006 attendees<br>
    at the Hyatt Regency Boston. Your special attendee rate is $169 (plus<br>
    tax) per night for single and double rooms. This is a great rate at a<br>
    wonderful hotel, and rooms are going fast. Book yours today!</p>
    <p>PLEASE NOTE: This discounted rate is only available until we fill our<br>
    room block or July 10, 2006, whichever comes first. We always sell<br>
    out our room blocks, so please don’t wait until the last minute to<br>
    make your reservation.</p>
    <p><a href="https://resweb.passkey.com/Resweb.do?mode=welcome_ei_new&amp;eventID=25804">https://resweb.passkey.com/Resweb.do?mode=welcome_ei_new&amp;eventID=25804</a></p>
    <p>Hyatt Regency Boston<br>
    One Avenue de Lafayette<br>
    Boston, MA 02111<br>
    Tel: 1-617-912-1234 or 1-402-592-6464<br>
    Toll-Free in the US: 1-888-421-1442<br>
    Fax: 1-617-451-2198</p>
    <p>Online Hyatt Regency Boston reservations for TypeCon:<br>
    <a href="https://resweb.passkey.com/Resweb.do?mode=welcome_ei_new&amp;eventID=25804">https://resweb.passkey.com/Resweb.do?mode=welcome_ei_new&amp;eventID=25804</a></p>
    <p>Book by phone (mention SOTA/Society of Typographic Aficionados and<br>
    TypeCon) at 1-617-912-1234 or 1-402-592-6464, or toll-free in the US<br>
    at 1-888-421-1442</p>
    <p>Hyatt Regency Boston information site: <a href="http://regencyboston.hyatt.com">http://regencyboston.hyatt.com</a></p>
    <p>————————————————————————————————-<br>
    THANKS TO OUR PARTNERS AND SPONSORS<br>
    ————————————————————————————————-<br>
    We’d like to thank the wonderful individuals and businesses that make<br>
    TypeCon possible. Without their continued support, we would not be<br>
    able to offer such an affordable, high-quality event. Please support<br>
    our sponsors and partners!</p>
    <p>PARTNERS:<br>
    Museum of Printing - http://www.museumofprinting.org<br>
    Massachusetts College of Art - <a href="http://www.massart.edu">http://www.massart.edu</a></p>
    <p>HEADLINE SPONSORS:<br>
    Monotype Imaging - http://www.monotypeimaging.com<br>
    Bitstream - http://www.bitstream.com<br>
    Font Bureau - <a href="http://www.fontbureau.com">http://www.fontbureau.com</a></p>
    <p>72 PT SPONSORS:<br>
    Adobe - http://www.adobe.com/type<br>
    Extensis - http://www.extensis.com<br>
    FontLab - http://www.fontlab.com<br>
    Linotype - http://www.linotype.com<br>
    MyFonts - http://www.myfonts.com<br>
    Veer - <a href="http://www.veer.com">http://www.veer.com</a></p>
    <p>OTHER SPONSORS: Daidala, Microsoft Typography, Oddica, P22 type foundry, Typeco<br>
    MEDIA PARTNERS: Graphic Design: USA, HOW magazine<br>
    TECHNOLOGY PARTNER: Three Islands Press<br>
    EXHIBIT PARTNERS: Letras Latinas, Masscribes, Mexican Blackletter,<br>
    Typographica, Type Directors Club<br>
    EVENT PARTNERS: Boston Public Library, Typophile</p>
    <p>TYPECON2006 IDENTITY DESIGNED BY:<br>
    Stoltze Design, Inc., Boston - <a href="http://www.stoltze.com">http://www.stoltze.com</a></p>
    <p>SPONSORSHIP AND VOLUNTEER OPPORTUNITIES AVAILABLE: If you would like<br>
    to contribute to TypeCon2006 by sponsoring, donating goods and<br>
    services, or volunteering, please send an email to<br>
    <a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>
    <p>————————————————————————————————-<br>
    ABOUT TYPECON AND SOTA<br>
    ————————————————————————————————-<br>
    TypeCon2006 is the annual conference of SOTA, an international<br>
    non-profit organization dedicated to the promotion, study, and<br>
    support of type design, typography, and the related arts. For more<br>
    information about SOTA, please visit the website at<br>
    <a href="http://www.typesociety.org">http://www.typesociety.org</a>.</p>
    <p>Have questions, need answers? Send us an email! </p>
    <p>Can’t wait to see you in Boston!</p>
