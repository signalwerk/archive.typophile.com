    <p>I've downloaded an "Old English.ttf" font several years back and now I'm thinking about using it for commercial use.  But the zip.file wich contains the txt.file doesn't say exactly what author I should contact for purchasing and negotiations.  It just lists a bunch of not so serious looking websites.<br>
    Even when I google the name of the font I'm given a bunch of none sersious looking e-shop sites.</p>
    <p>*****************  Question 1.) **********************<br>
    Can someone recommend me to a trusted e-shop which sells the "Old English.ttf" font?<br>
    Which doesn't cost a fortune.<br>
    ----------------------------------</p>
    <p>I want to use the font for my website, logo, and use the font to print messages on T-shirts which I want to sell commercially.</p>
    <p>*****************  Question 2.) **********************<br>
    What sort of license fits my needs?<br>
    ----------------------------------</p>
    <p>Any kind of guidance and tips would be much appreciated.</p>
