  - id: 199271
    user: 14556
    date: 2007-04-25T15:14:00
    date_raw: 25 Apr 2007 — 3:14pm
    votes: null
    html: |-
      <p><cite>I’m gonna make it for the web that’s like several 1.000 visitors, and I’m planning on selling T-shirts using that font to several 1.000 visitors.<br>
      Will this 1-5 License cover me legally?</cite></p>
      <p>Generally, with a regular user license, you are allowed to sell images of the characters comprising the font on finished products. That's what fonts are for. (Some free fonts specifically disallow this under their non-commercial use only clause.) Sometimes the amount of use comes into the terms of the license, but that is not typical.</p>
      <p>What you can't do is package the font software, either on a disc or as a downloadable file and sell or give it away it yourself. An entirely different sort of licensing is required in that case.</p>
