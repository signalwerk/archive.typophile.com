    html: <p>No, I didn't mean the background gradation, I meant the "ripples" around the letterform, which are JPEG lossiness artefacts. Our gammas are probably way different. Anyway, if you want to keep a nice gradation <i>and</i> you want to get rid of the halos, then you'll have to accept even larger file sizes (and probably resort to PNG). <br> <br>hhp <br></p>
