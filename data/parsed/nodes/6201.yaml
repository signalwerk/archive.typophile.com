    html: "<p>Alastair Johnston did an entire book on the literature of nineteenth-century typefounders' specimens: Alphabets to Order. <br> <br>The specimens aren't well presented (more often just as text) but it is a very thorough examination. Still in print from Oak Knoll.</p>"
