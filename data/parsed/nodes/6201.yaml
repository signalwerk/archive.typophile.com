  html: <p></p><center>Join us in the next collaborative gallery show at Typophile!  <br>  <br><img src="http://www.typophile.com/forums/messages/72/4391.jpg" alt="editor">  <br><i>Cheltenham Condensed, ATF Specimen Book, 1912, p.201 - Contributed by Tanya Sprowl</i>  <br>  <br><img src="http://www.typophile.com/forums/messages/72/4392.jpg" alt="lemon">  <br><i>Century Expanded, ATF Specimen Book, 1912, p.254 - Contributed by Tanya Sprowl</i>  <br>  <br><b>* Specimen Book Poetry *</b></center>  <br>  <br>A collaborative collection of specimen book "type haikus", scanned from actual antique type specimen books. Crawl through your type catalogues and specimen books and email us your favorite scans for an upcoming gallery show here on Typophile!   <br>  <br>Please be sure to include full credits for each submission, including title, publication date, typeface, and page number.  <br><p></p>
  html_clean: <p></p><center>Join us in the next collaborative gallery show at Typophile!  <br>  <br><img src="http://www.typophile.com/forums/messages/72/4391.jpg" alt="editor">  <br><i>Cheltenham Condensed, ATF Specimen Book, 1912, p.201 - Contributed by Tanya Sprowl</i>  <br>  <br><img src="http://www.typophile.com/forums/messages/72/4392.jpg" alt="lemon">  <br><i>Century Expanded, ATF Specimen Book, 1912, p.254 - Contributed by Tanya Sprowl</i>  <br>  <br><b>* Specimen Book Poetry *</b></center>  <br>  <br>A collaborative collection of specimen book "type haikus", scanned from actual antique type specimen books. Crawl through your type catalogues and specimen books and email us your favorite scans for an upcoming gallery show here on Typophile!   <br>  <br>Please be sure to include full credits for each submission, including title, publication date, typeface, and page number.  <br><p></p>
