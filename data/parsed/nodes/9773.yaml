    html: "<p>I think you're doing a fine job here, and it definitely has potential to be better than the original. <br> <br>There's only one characteristic of the original that I don't see you capturing (I have the Solotype book): the pips on the rounds (C and O) pull the curve out a bit, while on your version they seem to just be thorns on the stalk (as <i>is</i> the case for the pips on the sides of straights in the original).</p>"
