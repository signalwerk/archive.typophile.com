    html: |-
      <p>It appears to be hand-drawn, and based on several sources.</p>
      <p>The B resembles the one in this typeface:<br>
      <a href="http://www.myfonts.com/fonts/wiescherdesign/cacao/" title="http://www.myfonts.com/fonts/wiescherdesign/cacao/">http://www.myfonts.com/fonts/wiescherdesign/cacao/</a></p>
      <p>Most (but not all) of the rest of the letters resemble Bromwich:<br>
      <a href="http://www.myfonts.com/fonts/gatf/bromwich/" title="http://www.myfonts.com/fonts/gatf/bromwich/">http://www.myfonts.com/fonts/gatf/bromwich/</a></p>
