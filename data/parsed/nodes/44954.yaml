    <p>Here’s a notation that references something I’d found in the way of conversations at the Typophile forum. The follow up, here: </p>
    <p>Hey, Typophilics — this is an old thread, <a href="https://web.archive.org/web/20080706173113/http://www.typophile.com/node/6777" title="http://www.typophile.com/node/6777">http://www.typophile.com/node/6777</a>, but it’s funny because I just found it. I was looking for something else, and this came up. To the nature of the font, it’s not Trajan — it’s a customized Girvin titling font; surely, it’s based on 1st century epigraphy, but not on Twombly’s Trajan. Trust me, I’ve had so many of my logotype renderings converted into Trajan solutions by agencies, it’s a joke.</p>
    <p>I’ve been working as a designer for motion picture marketing since 1978-79, and Apocalypse Now, Francis Coppola. And what happens is that you create solutions that are endlessly juried and judged by either the directors, the studio leadership, the talent, whomever is involved in the proposition — and toned down. The art fullness, diminished. So, doing a rendering of the Last Samurai, or Lord of the Rings, Gladiator — The Ghost and the Darkness — or Lemony Snicket’s A Series of Unfortunate Events, each of these treatments is entirely customized — tuned and built by hand. And if there’s an agency conversion, the customized solutions move to easily built imitation solutions by the agencies, and...<!--
