  html: <p>I am needing some suggestions to help me finish up a logo I have be asked to help redesign. Before all we basically had was just our text name. Then they added our denominational symbol. But we are needing things to be more modern. Here are 3 designs I pulled together what are your thoughts or is there another direction I should go in?</p>
