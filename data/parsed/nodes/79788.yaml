    date: 2011-03-07T14:07:00
    date_raw: 7 Mar 2011 — 2:07pm
    votes: null
    html: <p>I suggest you set aside a budget for this process as it's going to be an important part of your identity as a whole. You might be more comfortable with a christian designer, but don't write off a non-believer. A good one (from each category) would treat your needs with respect and dare to stand up against the design by comitee these things tend to become. A bad one (in this category you'll often find those buddy favours that don't cost you much) would probably end up just as <em>you</em> want it to be, which unfortunately is far off from what it could and should be judging by your samples.</p>
