      <p>I cannot believe it - I can answer an InDesign question.</p>
      <p>You can stay in paragraph composer - no problem. Where ever you want the typeset line to end place a "shift return" in. It breaks it and starts the next line. </p>
      <p>Then again, I've asked for the quark keyboard with the InDesign I work with - and it's one of those great features I couldn't live without.</p>
      <p>Hope that helps and makes it a bit easier for you.</p>
