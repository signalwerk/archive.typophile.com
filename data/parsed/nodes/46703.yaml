      <p>Hi Pamela,<br>
      switch off hyphenation in the paragraph options palette (or, even better, via your paragraph styles).<br>
      Additionally, you can try using the Adobe Single-Line Composer (in place of the Adobe Paragraph Composer, see flyout-menu in paragraph options palette), for a better manual control over each line.<br>
      F</p>
