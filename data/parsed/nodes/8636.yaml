  html: <p>I am trying to use the infinity symbol by copying from the character map to Illustrator. When I paste it, I get a question mark instead of the infinity symbol.  <br> <br>I've tried pasting first into Word and then copying from there. I can get the inifinity symbol in Word but then when I copy from Word to Illustrator I get a number 8. (You could say I'm getting closer <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">) <br> <br>Any help?</p>
