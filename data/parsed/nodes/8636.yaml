    html: <p>Good tip. Thanks for your help. <br> <br>Does Illustrator have the same problem on the Mac?</p>
    html_clean: <p>Good tip. Thanks for your help. <br> <br>Does Illustrator have the same problem on the Mac?</p>
  - id: 56802
    user: 1262
    date: null
    date_raw: null
    votes: null
    html: <p>Yes. These days, Adobe are pretty much maintaining total parity between their apps on different platforms. One of the ways in which they are managing this is by not using common system text components; they are 'rolling their own' instead. Gradually, the core text processing of each Adobe app is being rewritten to support Unicode encoding. InDesign and Photoshop have this done already. My guess is that Illustrator is likely to be next, but Adobe refuse to comment.</p>
