    html: <p>Rants are good, asides the spelling but, who gives? As long as the opinion is out there. I am not a copy editor, I work hard enough doing what I do. And because I grew up designing my own typefaces and within the whole 'deconstructionist' typography era, this controversial work still inspires me, and what's wrong with that? I am here to challenge the reader, not hand it out on a plate to be glanced over and forgotten. I work in the public eye and it is the public who appreciate my work, and I see many books still covering a vast variety of styles of typography, from legible to illegible. Type to me isn't just about communication. it's about reader involvement... It's about creating a stir. Being different yet true to yourself, like art. I personally don't want to have everything clear to my eyes, I want to hunt... Search for the story, become involved in it and all the detail around it. My writers agree. Many world-class photographers seem to agree. Thousands of students I have taught seem to agree, even go home to other countries and get work doing the cool stuff; mags, cds, entertainment work. So this work exists and seems to be remembered... And yes, something will start up, with the support of people who do want something new. If I can have my own work distributed throughout the world thanks to a great team of people who believe in what I believe in, even at a cost of hundreds of thousands of publisher's dollars, then why not a Type Club? Without the attitude that disintegrated typography is not communication, but mere folly. As it is ALL worthy of note. Variety is what life is about.</p>
