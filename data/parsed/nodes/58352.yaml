  html: <p>Isn't it typography done by people working in Australia? Is there an 'essence' of what Australian typography is or should be? The question I have always wondered about and given a great deal of my thoughts to seems so fluid and ever changing... As we are a very young country and the majority of all of our typographic past comes from hand-me-downs from our English ancestry via food and product packaging and people who worked in industry throughout the world prior to Australia, one must see that Australian typography encompasses so much. It is a vast playing field of styles, merging of cultures and ever-changing ideology rather than the standard 'kangaroo and Cooper Black' mentality, even if that train-of-thought is still perfectly Australian and cool. But likewise a design with multicultural aspects is equally as Australian if made in Australia, right? Today, the world is a vast stage and everyone is linked to someone else, another place via this wonderful beast called the internet. So walls come down, no longer are we secluded into seeing over simplified Melbournian design with inklings to Swiss basel-school fundamentals. New designers and students continue to break this barrier down which keeps us not only modern but gives us a front on a world stage. I do not believe, and have not for years, AGDA does enough for up-and-comers. Students are still forced to pay large fees to see people who will not give them hope, people with little interest to them go for over-priced lunches at the expense of members, but where can a member find the community that should support them? After working at Black+White for many years and having all the help in the world from this 'Association' then finding it near impossible to even speak with them post Black+White, it seemed there only interest fell in talking to those who they see as 'popular' or beneficial to their own well-being as an association. Now, as art director for Kurv. Magazine it seems all of my support comes from US and European sources both in design circles and in the photographic world. The magazine itself even sells out in the US 100-1 by comparison to here. Support for an Australian Typographic club is needed. We need this fresh air that says, hey we are more than ready to move forward to the future, and, face the world...</p>
