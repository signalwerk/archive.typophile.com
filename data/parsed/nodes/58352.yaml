    html: <p>I agree with you, Andrew. Australia does need an Australian Typographic club/ whatever you want to call it. It had one once, but that was squashed out by AGDA who have done nothing much except collect money. I was a member once in the early days of its formation, but failed to renew membership after the first year and have seen no reason, incentive or benefit to renew in the years since.</p>
