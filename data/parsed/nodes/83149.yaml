      <p>"and isn't it pretty much WindowsGDI essential only? far less an issue with the 'other' render engines."</p>
      <p>Steps is steps. This voodoo is rendering independent or it's doodoo.</p>
      <p>But yes, what works for the l.c. n at one size does not work for h at that size, much less the Icelandic LC thing that ascends and descends and angles vary to optically appear alike, and this wasn't an isolated case if WTF I felt listening to that presentation. </p>
      <p>" Goodness, this stuff is complex."</p>
      <p>Not this, this is simple. </p>
      <p>For me though it is never so simple, I walk a thin line day after day, year after year, between support for colleagues, and the font public's right to know the truth about web fonts. I have all the stab wounds in the back to prove my vigilance, and am sure to have more soon:)</p>
