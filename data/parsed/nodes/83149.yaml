      <p><cite> . . . uneven steps like 2-3-2-3 which they corrected to 3-3-3-3. My understanding was that converting to a rational angle helped this? </cite></p>
      <p>Yes. But what David was saying is that there is no single magic rational angle that will do this for all rendered sizes. The above illustration works much smoother at 12px, sure, but will again give an uneven stairstep at 10px or 11px for instance.</p>
      <p>It’s somewhat size-dependent. So, if you're working with a single outline, it’s a matter of choosing your poison.</p>
