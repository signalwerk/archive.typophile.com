      <p>&gt;Hoefler explained that the original Gotham italic resulted in a slope with uneven steps like 2-3-2-3 which they corrected to 3-3-3-3. My understanding was that converting to a rational angle helped this?&lt;</p>
      <p>actually it's 2-3-2-3-2 (12) and 3-3-3-3 (12) in the example - it's a 12px high stem, the first stem has a 5 x 12 px box, the second stem has a 4 x 3 px box (hence the difference in gradient angle)</p>
      <p>The formula (so called) only works when the height of the glyph part in question can be sub divided equally AND still create the same-ish slope angle, eg. 9, 12, 20, etc  What was suggested for all those other intermediate pixel sizes? That's where it gets interesting :) Also what was suggested for a font where the x-height obeys the formula but the baseline to Cap height does not? or vise versa?</p>
