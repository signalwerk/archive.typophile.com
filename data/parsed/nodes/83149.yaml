      <p>Ah, that's not quite what I understood. In context, Hoefler (and David Berlow) was talking about a typeface really being an abstract idea that is realised in different technologies by different 'design systems'...in that model the screen version is not trying to mimic the print version, but remain true to the underlying concept, just using a different design system.</p>
      <p>At the same time, I totally understand the need to be driven by pixels (or sub-pixels). The question Hoefler asked was whether the screen font was still Gotham, and I guess the answer is as long as it looks more like Gotham than print-Gotham does on screen, it's a successful design system.</p>
