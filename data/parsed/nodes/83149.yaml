    <p>Excerpt from GigaOm:</p>
    <p>"On Friday, I heard Jonathan Hoefler, one of the founders of the massively respected type foundry Hoefler &amp; Frere-Jones, explain exactly what it takes to turn a typeface designed for print into a real web font. And it was amazing.</p>
    <p>He was appearing at Ampersand — a conference in Brighton, England, dedicated to the art of web fonts — where he stood on stage and announced that the studio has now converted 100 percent of its typefaces for use on the web.</p>
    <p>The news was greeted with a sage nod by attendees, but in truth it should have been met with crazed whoops, wild cheers and yelps of astonishment — because it’s really a task of herculean proportions."</p>
    <p>Full article <a href="http://gigaom.com/2011/06/20/what-does-it-take-to-make-a-web-font-a-lot-of-work/?utm_source=feedburner&amp;utm_medium=feed&amp;utm_campaign=Feed:+OmMalik+%28GigaOM:+Tech%29" rel="nofollow">here</a>.</p>
