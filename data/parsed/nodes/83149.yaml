    html: |-
      <p>But we're talking about a pixel-size-<strong>de</strong>pendent angle, meaning a slant of atan(1/n) where n is an integer greater than 1. In Patria for example n is 16, so the angle is ~3.58 (which is very slight, but I'm like that :-). Especially in b&amp;w rendering (which still exists, so we can't ignore it) this method gives better results than choosing some integer degree. Also, when I'm working on a slanted design I can move a vertex one em laterally and n ems vertically and I won't be changing the angle. And most of all, there is <em>no</em> reason to stick with integer degrees in a digital world (except for extreme revivalism).</p>
      <p>hhp</p>
