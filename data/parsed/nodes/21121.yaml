      <p>Well, another german link here, sorry. But quite interesting in this case I think.<br>
      Jürgen Siebert from fontshop.de was contacted by Bruno Maag from DaltonMaag because of his weblog-entry regarding jersey-typography. And Jürgen posted the comments of Bruno Maag in his weblog <a href="https://web.archive.org/web/20190929000230/http://www.fontblog.de/files/bruno_maag-spricht.html#unique-entry-id-315">Fontblog</a>.  Enjoy. </p>
      <p>EDIT: Here is a poor translation of it, please forgive my english: </p>
      <p>"A comment on my contribution thought on the Worldcup-jersey-Typografie came from the creator of the Puma typeface ” Pace “, Bruno Maag. </p>
      <p>Quote:</p>
      <p>Regarding lowercase-writing: It is unusual, because you always see uppercase. But I find it refreshing doing things new. </p>
      <p>No special characters for Polish: The Font has a full character set with all necessary specifications for West and Eastern Europe. If users do not use it, it is not a fault of the typeface. Other nations have managed to use their characters. </p>
      <p>Organization of the numbers: there are clear regulations from FIFA and UEFA concerning the design-area. I think italizing the numbers is a refreshing idea. It indicates movement and the shadowline is a decoration element, which is not necessarily wrong. </p>
      <p>Names have different lengths: We have to live with this fact. Designing specific fonts with different widths is not a practicable way. Don’t forget that the jerseys are made at local print shops (which aren’t the best in typography). They simply get their font and insert the name. Period. It doesn’t makes much sense to give them more opportunities. </p>
      <p>Football jerseys have a fashionably expiration date: What we see at the WC today is out of date next year. According to it the Typo has to present itself. Balanced Typografie is not important, what matters is the uniqueness in the competition. In the case of Puma we chose numbers developed on a rectangle. </p>
      <p>Typeface Design: We co-operated closely with GBH Design. The basis were sketches, developed from a rectangle. Deliberately no curves were integrated. We worked on   different versions of the serifs, but in the end we decided that the current are the best. The problem of the readability is solved, because everything is written in uppercase.</p>
      <p>Readability: You always have to be aware in which cases the typeface will suit the purposes. The typeface was never be intended to be used anywhere else than on jerseys. For something longer than names it is not useful. And don’t forget: The readers do not read letter by letter, they always read whole names</p>
      <p>Branding: Puma has succeeded in having created a profile against the competition (Nike, Adidas). All Puma jerseys use the same typeface. It is a beautiful example of corporate design.  I think that this typeface is perfect for the purpose. I do not know what happens next year  or at the European Cup also. Anyhow, the typeface is practically, either in fashion matters also regarding jersey-production. Finally, for me as a type-designer: The job was well done.</p>
      <p>Bruno Maag, Dalton Maag Ltd."<br>
      End of quote.</p>
    html_clean: |-
