      <p>Interesting to me is that so many contrries have the same jersey design. Adidas seems to have mandated how its country teams' jerseys will look. This is why Germany, France, Argentina, etc. all had the same (ugly) type and numbers—this ITC Bauhaus monstrosity. Italy, Switzerland, and at least one other country were sponsored by Puma, who got their type from Dalton Maag.</p>
      <p>Umbro and Nike seem to have taken a different approach. Their jerseys all have <strong>different</strong> lettering, some of which, like that for England, was even designed by "local" typographers (i.e., The FA uses a custom typeface by Jeremy Tankard).</p>
      <p>So, we can't really say that the best typography won yesterday: Italy may have had better lettering on their jerseys, but those letters weren't really Italian. Tonight, Nike's Portugal jerseys go up against Adidas' French ones (which look quite similar to the German jerseys from last night…). Will the final be Puma–Nike or Puma–Adidas? I love the new Puma lettering (and the ingenious lowercase!), but I'd like to see Adidas… errrr, France, take it all on Sunday anyway.</p>
