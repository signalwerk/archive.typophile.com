    <p>Hi everyone, I'd like to ask the community here at Typophile for some help. I'm designing some pamplets for typography students to give them some tips and rules to aid them in the assignments given during the semester.<br>
        I've already gathered some notes from Letters of Credit, Stop Stealing Sheep, and going to dig through Elements of Typographic Style soon, but I thought it prudent to ask you guys if there is anything you've noticed, rules or guidelines you stick to, or just things that bug you that you'd like students to stop. There are plenty of tpographic blunders that get under my skin, but I'm sure if I don't ask for more input I'll miss a few key ones.</p>
    <p>Thanks for whatever input you guys have.</p>
