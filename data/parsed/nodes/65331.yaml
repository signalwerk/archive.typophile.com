      <p>Altaira sums it up beautifully.<br>
      You might also consider teaching your students a bit about font quality.<br>
      When my students start in my class, they are usually busy downloading loads of free, crappy (pardon my French) fonts that are available out there.<br>
      It takes a while before they learn to see the difference between well designed fonts and the bad stuff.</p>
      <p>My students also often ask for a list of great fonts to use for different purposes (books, display etc.)</p>
