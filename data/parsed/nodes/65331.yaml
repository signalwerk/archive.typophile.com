      <p>Get to know all the things people do with type. An understanding of the possibilities, techniques, variables and conventions means informed choices can be made, even when you create work that experiments and breaks the rules.</p>
      <p>Develop a critical eye for detail but focus positively on what works best in any given piece. Any kind of art needs careful composition and adjustment so as Nina said, be thoughtful and purposeful. And yeah, white space is really important.</p>
      <p>Are you able to post your conclusions here? It would be fantastic to see you how distil everything into a pamphlet.</p>
