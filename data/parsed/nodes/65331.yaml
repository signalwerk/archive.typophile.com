      <p>What counts is the careful crafting of visual hierarchy.<br>
      I think it's most important that beginners learn to work with the different variables at their disposal, like size, color, placement, font choice, style, weight, etc etc, as well as the power of the «white space»; and learn to use them with extreme restraint – and with a reasoning behind it. In my view, beginners tend to wildly combine too many variables without much reason, and end up producing unstructured, messy layouts that don't communicate.<br>
      Take it one step at a time, and know exactly why you're doing what you're doing.</p>
      <p>Hrant, I'd argue that the idea of a grid has a much different function, and value, in typography and type design respectively. I think in typography, depending on what it is you're making, grid systems can be useful starting-points, especially for beginners who mess everything up otherwise. </p>
      <p>But after you tell them to be prudent, and disciplined, and thoughtful, by all means tell them to question everything. That the grid alone doesn't solve anything. That sometimes it needs to be broken. That in some designs it can't even be there because it would kill the idea.</p>
