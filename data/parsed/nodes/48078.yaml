      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Didot_4669.jpg"></div><br>
      This is a pocket book printed by the Didots in 1800, by stereotype.<br>
      The text is 10 on 12, and the stock is a very creamy-coloured laid paper.<br>
      While there have always been typographers who have played up the sparkle of the didone style, and that is certainly the 20th century meme, it's not the impression one gets from reading this--although the quality of typography is nonetheless sharp and precise.<br>
      What is most striking is the exquisite <em>mise en page.</em> It's very hard not to be captivated by just how perfect everything about the book is. That first line of text breaks so perfectly...<em>de rigueur.</em> The attention to detail--everything working together meticulously--holds one's attention, assures its readability.<p></p>
      <p>The overall effect is pointedly anti-chirographic. The cool, understated neo-classicism of the layout has the quality of ancient Roman lapidary inscriptions. At the same time, the neatness of the type's impression has the quality of high-tech engineering, not the pen. One finds the same fusion of ancient and modern in the origins of the sans serif, contemporary, so it would appear to be a driving force. </p>
      <p>When the pendulum swung the other way later in the 19th century, the context was a Morrisonian disgust with industrialism. No humanist sans serif just then, as the sans genre itself was too tainted by its association with the modern world. When modernism became acceptable again, c.1930, there was really no call for an organic, chirographic-looking sans serif, as that rather defeated the purpose of the new modernity. So when did it become acceptable for a sans serif to overtly reference chirography? </p>
      <p>Well, I don't think the pioneering "humanist" faces did that. They were referencing the organic and hand-made, but not necessarily the pen. Although they may have employed forms that are chirographic, that was incidental. Consider Eras. It was originally designed in the 1960s, and has never been touted as a humanist face, as far as I am aware. If anything, the sophistication of its drawing gave it a very sleek and streamlined up-to-date look.</p>
      <p>Sorry James, I must echo Bill's first post, that the "development of sans serif humanist type" is a pretty weak and haphazard concept, prior to the influence of Gerrit Noordzij. Probably originating as a convenient term of categorization for a few odds and ends, rather than anything more purposeful.</p>
