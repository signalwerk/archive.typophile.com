      <p>Hello, Jan, here:</p>
      <p><a href="http://www.typotheque.com/articles/interview_martin_majoor.html" title="http://www.typotheque.com/articles/interview_martin_majoor.html">http://www.typotheque.com/articles/interview_martin_majoor.html</a></p>
      <p>Majoor states,</p>
      <p>'I get my inspiration from certain (and sometimes very old) traditions in type design, but at the same time I am ‘inspired’ by the possibilities and speed of today’s software. Small capitals come from an old tradition, but designing something like Scala Sans Italic Caps was not done before. Old style figures have an even longer tradition, but making them for a sans serif (like in Scala Sans and in Seria Sans) was only done before by Paul Renner for his Futura.'</p>
      <p>Neither of these statements is true. Small caps and italic small caps were in Today and so of course were OSF. It's practically inconceivable that Majoor (or Bilak) was unaware of Today Sans at the time this interview was published, and in the meantime, it has been up on the web for years without correction. Today included every possible typographical feature and refinement, including two optical sizes and of course inktraps in the text size.</p>
      <p>&gt;As for the uniqueness of your article: Albert-Jan Pool wrote lovingly about Today Sans in Types Best Remembered.</p>
      <p>Yes, Jan, that's why I said it was a quotation. It was Albert-Jan who provided me with the Scangraphic books and all the background information; he also reviewed the article closely. What is your interest in uniqueness per se here? It was a 1200 page article with 120 given over to Albert-Jan -- more or less. I'm certainly not claiming it as serious writing about type. It was for a Desktop Publishing magazine and was designed to get people to buy Today Sans. I was not writing for type designers, who don't as a rule buy much type. I once encouraged Carol Twombl(e?)y to buy Miller, and I think she did, but that's exceptional. </p>
      <p>(I wonder if Majoor is ever going to fix those single quotation mark kerns?)</p>
