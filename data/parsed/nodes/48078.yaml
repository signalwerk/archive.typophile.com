      <p>The upper case is originally derived from painted and inscribed letters, according to the <a class="freelinking external" href="http://www.typophile.com/node/45708" rel="nofollow">recent account of Sumner Stone</a>. The reflects the views of other historians, which he references. The origin of the Carolingian minuscule is undoubtedly calligraphic or chirographic, pen-driven. However, in the 15th century it was modified to make it less calligraphic, influenced by the Imperial capitals, and I think Jenson and Griffo made it less pen drawn in ways that made roman type more even in color and readable. </p>
      <p>This makes sans in turn influenced by Jenson and Griffo's proportions only remotely derived from the pen. Still, the pen is an important "underlying force" (as van Krimpen put it) in the letter shapes. At least that's my story, and I'm sticking to it :)</p>
