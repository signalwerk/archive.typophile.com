      <p>I think of humanist sans faces being further towards the "written" rather than the "constructed" pole than other sans types. The aforementioned contrast styling and dynamic letter structure certainly push it that way. I would add that other details do, too. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/humanistsans_4444.gif"></div><p></p>
      <p>The 45-degree diagonals in Gill's Q tail and t top (among other letters) help to evoke the pen, for example. And the u having a stem implies a letter written with two strokes, not plotted out mechanically as in Futura.</p>
      <p>Perhaps it is a measure of the success of humanist sans faces' implication of "writtenness" that this thread started with the assumption that there is a written hand at their roots.</p>
