      <p>Bill, after citing Majoor's "it must be said that most of Unger's typefaces are derived from each other", you write:<br>
      <cite>What is that remark, if not insolent, considering that Unger's designs are overwhelmingly the most successful Dutch typefaces of the 20th/21st centuries? He's dissing him completely!</cite></p>
      <p>The fact that Unger's typefaces are successful does not render Majoor's description wrong, nor does it forbid criticism. If Majoor does not like the way Unger designs, he is free to say so. Other people may not like Majoor's method of constructing letters. Different designers, different approaches, different opinions.</p>
      <p>You write (in order of appearance):<br>
      <cite>you will see that Küster very definitely was working with the forms of the Bembo typeface</cite> [...] <cite>I would argue, however, that Küster's goal was to put as much of Bembo as he could into a sans serif</cite> [...] <cite>Küster looked at Bembo</cite></p>
      <p>Do you refer to images given in the Scangraphic specimen (showing Bembo, Today and Gill Sans)? These are for comparison, to locate the <em>style</em> of Today, in relation to renaissance antiqua, as represented by Bembo, and to Gill Sans. The caption points out that renaissance antiqua and Today share a stroke contrast as created by writing with a broad nib pen, while Gill Sans is constructed. Küster is a very good writer, he does not need an existing typeface to create a new one, as your suggest.</p>
      <p>The other part of one of the above remarks is obviously wrong:<br>
      <cite>I would argue, however, that Küster's goal was to put as much of Bembo as he could into a sans serif whilst remaining within the vernacular parameters established by the 19th century gothics. These parameters are strict in my view, applying to many specific shapes, contrast, stroke weight, x-height, and more.</cite></p>
