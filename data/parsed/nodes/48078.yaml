      <p>For what it's worth, on humanism, see</p>
      <p><a href="http://vlib.iue.it/carrie/texts/carrie_books/gilbert/05.html" title="http://vlib.iue.it/carrie/texts/carrie_books/gilbert/05.html">http://vlib.iue.it/carrie/texts/carrie_books/gilbert/05.html</a></p>
      <p>which brings me closer to the idea that humanist in typographic usage is simply an unnecessary synonym for Aldine. </p>
      <p>'With the invention of printing in the middle of the fifteenth century, it became possible to turn out in large quantities texts of classical writings. During the fifteenth and sixteenth centuries the great bulk of all known classical literature, both Greek and Roman, came from the press. Although printing was not an Italian invention, most of the first editions of the classics were printed in Italy until about the time of the Sack of Rome. The greatest of the early Italian printers was Aldo Manuzio of Venice ....</p>
      <p>humanist in type really does seem inseparable from Aldine.</p>
      <p>But I thought Morison et al. did a lot of work to show that why what Aldus and his lot did was so great was that it _rejected_ the calligraphic in favour of the purely _typographical_. So we go back to the earliest cap inscriptions . . . . which are not calligraphic.</p>
