      <p>John, the Noordzij cube is interesting and informative, but I don't think it is "Everything you need to know about the difference between ’grotesque’ and ’humanist’ sans." </p>
      <p>Here are the lower case bold o's from Helvetica, Futura, and Myriad. These are usually taken as examples of Grotesque, Geometric, and Humanist, right?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Three o's--Helv, Fut, Myriad_6186.gif"></div><br>
      .<br>
      Now all of these have vertical stress. There is no evidence of the slanted stress here from the broad-nibbed pen, including in the "humanist" Myriad. <p></p>
      <p>But you do see clearly in the outline the more squared o of the grotesque, the circular geometric, and the more strictly oval interior of Myriad--as I mentioned in my earlier post. And in the regular weight the exterior of Myriad is also a narrower oval, more similar to the interior.  </p>
      <p>Now overall, I just don't think it is worth getting very exercised about these classifications because none of them is "right". They are just more or less helpful in different circumstances, and in shedding light on different aspects of design. It is the nature of innovation in design to break through neat categories, so I think the categories may be most useful to identify different aspects: stress,  proportions, openness of counters, etc. and get an understanding of a design. But one 'right' classification? No.</p>
