    html: <p>The term parachirographic was introduced by Peter Enneson -- on the ATypI member discussion list I believe -- to qualify the relationship of type design to writing and to get beyond notions of 'chirographic type design' (I had already rejected 'calligraphic' as an adjective since calligraphy implies writing as art not as text). I believe that almost all type design is parachirographic in one way or another -- which is not to say that it must be so --, while very little type design is purely chirographic (implying direct reproduction in type of handwritten forms). In parachirographic type design, the structure and characteristics of written forms, as derived from gesture and tool, are referenced but are modified by the designer to achieve either stylistic or technical goals (adapting shapes for size-specific designs is an obvious example). I've found it a useful term if one wants to be reasonably precise in characterising different design processes.</p>
