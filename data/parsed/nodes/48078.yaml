      <p>Nick, I completely agree that what the Didots were doing had everything to do with improved printing (hairlines being possible in mass printing) and very little to do with anything else. It's notable that for the Didots, everything had to be high contrast, whilst for Walbaum and to a lesser extent for Prillwitz, display sizes of type could have dazzling contrast but text sizes must have considerably lower contrast. 'What attracts attention immediately and only for a few moments' vs 'What can comfortably be read over a period of hours' -- both embodied in metal Walbaum, and digitally in the difference between Berthold's Walbaum Standard (text) and the inaptly named Walbaum Book (display). </p>
      <p>This happens over an incredibly short time; Vafflard's transitional premiere maniere type comes into use about 1783 (transitional according to Updike; Aldine according to Unger) (<a href="http://www.typophile.com/node/47453" title="www.typophile.com/node/47453">www.typophile.com/node/47453</a> for examples and a cite to Unger); by 1789, the Didots already have fully developed their ideas about modern type. So all it takes is six years. (Also see Veyrin, cited probably by Unger.) </p>
      <p>I don't believe this has got anything to do with chirography, but perhaps I am too influenced by early writers such as Morison and Updike. Nor should I really be speaking since I really don't know anything about it. But Hudson once admired my hand, the g in particular, and I have been dreadfully conceited ever since. It's all his fault!</p>
