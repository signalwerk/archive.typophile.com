      <p>Instead of using "humanist" or "humanist form principle" Hans Peter Willberg* has suggested the term "dynamic". On the other hand he suggested "static" instead of "modern"<br>
      For example, Adobe Garamond is classified as a dynamic typeface, Bodoni as a static typeface. Syntax a dynamic Sans-Serif, Helvetica a Sans-Serif with the stylistic feature of a static form principle. I find this quite handy for a first classification. </p>
      <p>* a well known typographer in Germany, died in 2003</p>
