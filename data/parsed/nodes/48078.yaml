      <p>&gt;But what is the origin of those proportions and shapes?</p>
      <p>John, I grant you that the shapes are influenced by the broad pen. But I suspect that the narrower widths (compared to Didone) and the proportions of the Carolingian miniscule are not dictated by the pen, but other factors. One is economy--fitting more text on a page, and the other is readability. </p>
      <p>I acknowledge that this is one of my pet theories--that faces are based on the oval rather than circle are inherently more readable--but I do think it is a factor.</p>
      <p>I don't see why the broad pen dictates the narrower letter forms. I think they could have done wider if they wanted to. </p>
      <p>I am guessing that with the Didone style, these shapes are more dominated by aesthetic considerations, rather than originally being derived from writing of extended text. That is, most written text in this period was written in cursive, and hand writing and lettering in roman was really more for display. The Didone forms are unquestionably very elegant,  but in many versions I and many others have felt that they are less readable for text.</p>
