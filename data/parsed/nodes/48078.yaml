      <p>James,</p>
      <p>I think your terms may need a massage. I suspect that you'd get several very different answers from Frutiger, Meier, Zapf, Johnston and Stone regarding the specific models that influenced their typefaces. Specifically we know it was stone inscriptional lettering Zapf built Optima on, And I think Meier has referred to renaissance typefaces in discussing Syntax. Frutiger I very much doubt was looking at anything scribal. At the time, Frutiger was a very unusual hybrid of type forms. I actually think none of your examples are very closely related to anything scribal, they are probably all more related to other types. I especially think "handwriting" is not an appropriate term if you are trying to trace influences in these specific types. </p>
      <p>"Humanist sans" probably is meant to suggest that the structure follows the Aldine, renaissance, or whatever you want to call those classic proportions. But I think it's generally true that the references are to typefaces, not necessarily writing or calligraphy.</p>
