      <p>Mea culpa again, but I introduce a quote from my embarrassing article on Argo, because it raises the issue that a humanist typeface (how can Argo not be humanist?) is not necessarily based -- at all -- on renaissance letterforms - - thus making nonsense of the terminology yet again: </p>
      <p><em>Virtually all previous humanist sans serifs are based on the letterforms of classic Renaissance typefaces like Bembo and Garamond. Not so Argo. Unger is a great admirer of the American designer W.A. Dwiggins (____-____), whose text typefaces Caledonia and Electra were amongst the most widely used and highly esteemed in American publishing from the 1930s up until the 1960s. Neither typeface made a particularly convincing transition into either photo or digital type--they remain at their best in good metal settings. That is perhaps the main reason why they are no longer so popular. Unger has utilized some of the best of Dwiggins's ideas, and successfully applied them to digital type. With Argo, Unger decided, essentially, to make a sans serif out of Electra. The result is fascinating.</em></p>
