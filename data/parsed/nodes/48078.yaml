      <p>Bill [B]: is <em>Gerald</em> a typo? The actual Vox designation is <em>Garalde</em> — combining the <em>Gar</em> of <em>Garamond</em> and the <em>ald</em> of <em>aldine</em>. This compares with <em>Didone</em>, which combines <em>Didot </em>and <em>Bodoni</em>.</p>
      <p>Bill [T]: in Bringhurst’s section on unserifed faces in <em>The Elements of Typographic Style</em> the single most convincing example of a humanist sans in the sense that John and I have been putting forward — a sans based on translation — is Volkler Küster’s 1988 <em>Today</em>. See the lowercase “o” and “e” for intstances of a clearly humanist axis. The humanist — translation derived — axis is consistent throughout the lowercase.</p>
      <p>Bringhursts calls this neo-humanist.</p>
