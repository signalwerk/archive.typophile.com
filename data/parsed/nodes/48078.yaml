      <p><em> the idea that humanist in typographic usage is simply an unnecessary synonym for Aldine.</em></p>
      <p>An early and influential use of "humanist" for seriffed types is the Vox classification, in which, it seems to me, the term is used (invented?) precisely to <em>distinguish</em> Jenson-like types from Aldine ones (named "garaldes" in his scheme).</p>
      <p>James - I've been researching the question of how the concept of the "humanist sans" developed (thus my initiation of the earlier thread cited above). Still a work very much in progress but if you're interested in seeing some of what I've written, shoot me an email.</p>
