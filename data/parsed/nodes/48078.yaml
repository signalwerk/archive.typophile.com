      <p><cite>Today remains a special case — the world’s first sans superfamily (in spite of Martin Majoor’s insolent claim to the contrary). </cite></p>
      <p>Bill, you said that twice now; you've made your point but I don't think it's a very good one. I don't think  Martin ever claimed Scala Sans to be a "superfamily". Although, as far as I know, the term has not yet been precisely defined, it was coined to describe multi-style families that  have compatible sans serif and serif versions, and often a third style such as the semi-serif (TheMix) in Thesis or the slab serif (confusingly called Nexus Mix) in Martin's latest superfamily Nexus.  Today Sans was never a superfamily, because it was always   only a Sans; unless you want to claim the term to have  the meaning you choose it to have,  of course.<br>
