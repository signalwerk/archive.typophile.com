      <p>Mea culpa! I find that I am guilty of recklessly using the term humanist in my articles on Today Sans (1997) and Argo. However, at least I defined the term as I was using it. </p>
      <p>' ... sans serifs based on humanist models--an important concept which means that the letter-forms are based on the proportions that grow out of Italian Renaissance typefaces like Bembo.'</p>
      <p>Bad, but at least it's there. </p>
      <p>Here's what I quoted from Albert-Jan's lyrical article in Norton's Types Best Remembered/Forgotten (with permission, my duenna):</p>
      <p><em>It disobeyed all of the rules that I had thought to be appropriate for such a sans serif design. It looked so irregular, with each character featuring its own peculiarities. To my eyes it was sparkling with detail in all of its elements. It was one big idiosyncrasy. I showed Volker my design and told him that I was striving for evenness and harmony by repeating as many forms as possible. Volker explained to me that he was doing exactly the opposite in order to achieve the same goal. This was how I started to get a visual grip on the interaction of readability and legibility, and this is why for me Today Sans Serif is best to be remembered.</em></p>
      <p>It's interesting that Albert-Jan mentions readability and legibility here . . . . . and highlights idiosyncrasy. In his article as printed in Norton, there are some interesting bits about Frutiger but I don't have the book with me.</p>
