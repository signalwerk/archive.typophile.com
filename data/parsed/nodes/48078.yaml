      <p>I think the word ‘humanist’ in this context means: ‘similar to the writing of italian humanists like Poggio Bracciolini etc.’ </p>
      <p>So you can think at humanist sans-serif as a humanist hand without contrast. I have the little book of Ann Camp ‘Pen Lettering‘ where in the first chapter ‘The Alphabet in Skeleton Form’ the first excercises are made with a soft pencil: the result is an alphabet similar to Gill Sans, without contrast and with the proportions of the ‘Roman Hand’ (after that stage you must construct a double pencil to see the effects of the pen).</p>
