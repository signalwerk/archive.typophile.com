      <p>&gt;So you can think at humanist sans-serif as a humanist hand without contrast.&lt;</p>
      <p>Don't you mean by humanist -- i.e., Aldine -- type? </p>
      <p>Humanist sans = sans with Aldine proportions. </p>
      <p>Where does the hand come into this? </p>
      <p>Can we get rid of this word that seems to confuse everyone?</p>
      <p>And please let's not forget that Monotype created a version of Gill Sans which with something like 8 letters replaced out of 52 - - I forget how many - - made an acceptable clone of Futura. That alone is enough to put a big dent in any claim that Gill Sans is significantly humanist, renaissance, Aldine, anything but what it is, a stylish clone of Johnston. Why do we have to be more serious about it? We're in constant danger of looking silly when we read too much into Johnston/Gill Sans, etc. See Walter Tracy, Letters of Credit, as I recall, for the quotation and illustration.</p>
      <p>Good heavens, everyone wanted to get the hand out of anything to do with Gill. That's one of the reasons it wasn't cut by hand as a guide first. It was supposed to look machined. But let's not forget the humanism applies to the difference of the human and the divine, not the difference between the human and the machine.</p>
