      <p></p><div class="imageWrap"><img src="http://typophile.com/files/NewWoman_5882.jpg"></div><br>
      I may have mentioned this before, but it seems pertinent to repeat.<br>
      When I designed Shinn Sans in the early 1980s, it seemed to me that most available sans serif faces were not very chirographic.<br>
      At the time, that wasn't the term I would have used, and I can't recall whether I was aware of the term "humanist" either.<br>
      But I had been practising calligraphy, and it seemed to me that it would be interesting to take some of the chirographic features I had noticed in one or two faces--in particular some of the Gill characters such as "a" of course, and go a bit further in that direction.<br>
      I was influenced by Bernhard Gothic, very much aware in my studies of type history that this was the anti-Futura, with much less severe and reductive geometry. Kabel, Metro and Syntax, for some reason, were not influences. <p></p>
      <p>Perhaps it comes down to intuitive responses, and personal circumstances. I felt an affinity to the Bernhard shapes, had been doing a lot of calligraphy, and at the time developing my first sans serif along similar lines seemed like a reasonably unusual, and therefore worthwhile pursuit.</p>
