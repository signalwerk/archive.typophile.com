      <p>To Bill Berkson: o is the least informative letter shape, and it is also the one in which axis is most likely to tend toward the vertical even in some typefaces with a slanted ductus. But slant is irrelevant to the contrast issue, since expansion model strokes can also be written at a slant (this is one of the characteristics of the Gabriola typeface that I showed at TypeCon): it just happens that they were not during the neo-classical and romantic periods in which they flourished and influenced typography.</p>
      <p>***</p>
      <p>To Bill Troop: you'll have to elaborate on what you find 'unconvincing' about the cube. It is a demonstration of visual relationships between shapes of greater and lesser contrast; as such, it enables you to 'see' the contrast patterns inherent in shapes with low contrast. But you can also do it yourself: start with a high contrast letter and systematically reduce the contrast to see what you come up with. If you start with a renaissance-style humanist minuscule, such as Arno Pro, you end up, not surprisingly, with a 'humanist sans'.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eesans_6556.gif"></div><p></p>
      <p>It has been a while since I read Johnston's account of the design of the London Transport letters, but I believe this was basically his approach: to start with a mental model of humanist letters and to reduce their contrast to produce a new style of sans serif.</p>
      <p><em>The Aldine sans is not a thing in itself, but a very minor, very subtle variation of the Modern sans. </em></p>
      <p>The post-romantic or 'modern' sans popularised the style, most importantly by demonstrating how lowercase letters could convincingly be made, which earlier experiments in sans serif lettering had not managed. But I disagree that the 'humanist' sans is a variation per se of the post-romantic letter. It has a different underlying architecture. To some extent, the reason for that difference is moot, but the stroke contrast model allows one to say some meaningful things about the letterforms that vague historical or self-referential labels do not.</p>
