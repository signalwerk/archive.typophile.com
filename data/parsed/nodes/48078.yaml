      <p>Craig Eliason: <em>So could you draw a truly monoline letter (that is, one that had not low contrast but rather no contrast) that read as “humanist”?</em></p>
      <p>Yes, because what would be retained and would give the letter its 'humanist' character would be the proportion and shape.</p>
      <p>Which leads nicely to Bill Berkson's comment: <em>But my point was that [Garalde] proportions and shapes are also different, and these are reflected in ’humanist’ designs.</em></p>
      <p>But what is the origin of those proportions and shapes? It is the translation stroke contrast of the renaissance formal manuscript bookhand. This of course is parachirographically interpreted by punchcutters, is translated into a new medium, but the most distinctive characteristic of these shapes -- when contrasted with those derived from the expansion stroke contrast of the romantic period -- is their open forms, which are evident in both manuscript hand and type. The relatively closed forms of the romantic and post-romantic types (Didot, Bodoni, Walbaum, the various Scotch Romans) -- which is translated into post-romantic sans serif types -- are interesting because they are not <em>determined</em> by the split nib, but they are enabled by it and they become a primary characteristic of the late 18th and 19th century styles, again in both formal writing and in type.</p>
      <p>So I'm basically in agreement with you, Bill, about the contribution of the shape and proportion of humanist serif letters to the character of 'humanist' sans, but want to draw attention to where those shapes and proportions came from.</p>
      <p>The proof of the pudding is in trying to write a Scotch Roman letter such as a lowercase e with a broad nib pen and a fixed translation stroke (a really skilled calligrapher could fake it reasonably well with some rotation and/or a nasta'liq lift). The lower right terminal will always end up heavy instead of the characteristic hairline of the Scotch type, which is only possible in the expansion stroke model. To avoid this heaviness with a translation stroke, you have to avoid closing the shape, hence the open forms of the humanist bookhand, which become the open forms of the renaissance typefaces, and then become the open forms of the 'humanist' sans serif types.</p>
