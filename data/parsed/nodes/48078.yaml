      <p>Peter, please do not bring up Today Sans Serif again! I was the first and only person to write an article about it, and I was the one who tried to persuade Adobe to license it around 1996. As Fred Brady, the director of the type department at that time said, 'If you like Today, you're going to love Cronos.' (Search Google for the grotty details, some of which emerged on Typophile.)</p>
      <p>Today remains a special case -- the world's first sans superfamily (in spite of Martin Majoor's insolent claim to the contrary). If you look at the wonderful books that Scangraphic published to announce Today, you will see that Küster very definitely was working with the forms of the Bembo typeface which he loved and had spent much loving time redigitizing for Scangraphic. </p>
      <p>I would argue, however, that Küster's goal was to put as much of Bembo as he could into a sans serif <em>whilst remaining within the vernacular parameters established by the 19th century gothics</em>. These parameters are strict in my view, applying to many specific shapes, contrast, stroke weight, x-height, and more. </p>
      <p>However, it would be best to get his own, or Albert-Jan Pool's input on this. Last I heard, Albert-Jan was on vacation, so he might not be available for comment just now.</p>
      <p>An even more extraordinary adventure to the extreme of what is possible with the fixed vernacular we have been handed down from the 19th century is Unger's magnificent typeface Argo. </p>
      <p>Küster looked at Bembo; Unger looked at Electra and Swift, which is his contemplation of Electra. (This is not strictly my view; it is Unger's view which I have direct from him; Carl Crossgrove, my duenna, has been seeking confirmation from Interpol; we hourly await his results.) None of these people seem to have been interested in nibs, broad-based or otherwise, or any of these other far-fetched rationalizations. And Frutiger, as Nick Shinn has helped me to understand, is an absolutely unique event in type that really does represent an original break with the past. </p>
      <p>One of the problems with this thread is that everybody is trying to discover things about typefaces without asking the people who designed them what was going on in their heads at the time. Since so many of the decisive players are still around, why not give them a call?</p>
