      <p>For dynamic = oldstyle, Aldine, etc.<br>
      and static = modern, Didone, etc.</p>
      <p>I ask -- why? The terms are highly value-laden and the values are outside typography or aesthetics. You could reply that the terms oldstyle and modern are, albeit a few degrees less, also value-laden. So what's the problem with Aldine and Didone? Except that neither is useful in classifying a sans. Sans serif classification is tough.</p>
      <p>I find Peter's view difficult to accept. There is no sans serif that has anything like the contrast of a broad pen penstroke. The first thing one learns in designing a sans is that there is only so much contrast the vernacular will allow, and it is small.</p>
      <p>Robert Slimbach said that Chronos was not a clone of Today Sans Serif because to the extent he drew over Today, he drew over it with a felt pen and then digitized the results. Be that as it may, the two typefaces are remarkably similar. To speak of one as pen-derived and the other as not would be stretching it. </p>
      <p>My view is that if a humanist sans has diagonal stress -- which it needn't at all have to enjoy this classification - - it derives its stress from Aldine letters, and only therefore quite indirectly from the pen. I still don't see how any sans serif comes from the pen, except for those with absolutely calligraphic italics. </p>
      <p>By the way, Today Sans was the first sans superfamily, not, as Martin Majoor claims, Scala Sans. </p>
      <p>By the way, if there's something intrinsically humanist about a sans roman, such as, presumably, Frutiger, and you then slant the roman to get the italic, what is it about the slanted version of the italic that is not humanist -- except in the mind of a PR guru? At just what degree of slant did it lose its humanity? For, as we know, the only italics that count as humanist are those that are explicitly calligraphic or, in practice, chancery-derived.</p>
      <p>There's another point where the humanist label fails. Strictly speaking, it ought to mean the same thing for an italic and for a roman, yet it doesn't. Indeed, it ought, probably, to apply either to the hand-derived 15th century italics, OR to the 15th century purely typographic romans, considering that they were not, then, when humanism was actually happening, paired types, but entirely separate types. When you try to use the label for both, it's particularly difficult to tell what you might be meaning by it.</p>
