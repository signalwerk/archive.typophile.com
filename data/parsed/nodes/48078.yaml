      <p><cite>It’s not always easy to know what people meant when they said it.<cite></cite></cite></p>
      <p>This is true for almost all type terms it seems. Our specialist language is squishy in the extreme. </p>
      <p>Actually when I read"humanist" I expect to see a diagonal stress present. Slight or great. An not much more. As in contrast to no stress or a vertical one. That's all. Maybe that's the result of the term's overuse. But still, that's the ad copy derived sense of the thing I have. I don't make claims for the oprimacy of this. But I also reject the idea that another definition has primacy either. At least not yet.</p>
      <p>I do think that given the squishy nature of the specialist terms you have to accept that unless &amp; until you develop a body of shared terms with another type designer where you know what they mean &amp; they you ( a shared or mutual set of definitions or touch-stones) you will not be able to use the terms all that effectively. It's a bit sad but - too bad! That's how it is. This is part of why new terms come burbling up!</p>
