      <p>I thought the cube was there for a joke. I find it unconvincing. </p>
      <p>The thing that is wrong with all of these arguments is that the Aldine sans has two parents: secondarily, the Aldine roman, but primarily the Modern sans.</p>
      <p>It is the Modern sans which overwhelmingly sets up the possible vernacular of the sans serif. It is what prevents us from having high contrast sanses. They just don't look right. I'll try to illustrate later what I mean with some old drawings from a study for Romanee sans. The Aldine sans is not a thing in itself, but a very minor, very subtle variation of the Modern sans. </p>
      <p>We could have a true Aldine sans -- that would be my claim -- only that nobody would want to see it.</p>
