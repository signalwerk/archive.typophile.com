      <p>Bill, faces with low contrast conceal the differences in their approach to contrast styling by definition, but John is right when he states: "if one takes letters created with a split nib pen (expansion stroke, ‘modern’, ‘didone’, ‘romantic’) and systematically reduces their contrast one ends up with a grotesque sans. If one starts with letters created with a broad nib (translation stroke, ‘humanist’, ‘garalde’, ‘renaissance’) and similarly reduce the contrast one ends up with a humanist sans." The difference, though subtle, is fundamental and readily perceivable from a contrast-styling point of view. </p>
      <p>In the sans serif, history is reversed: the first sans serif typefaces are the grotesques or Modern sans. Bringhurst calls them Realist. Than there is the Geometric Modernist sans which takes the Realist sans and applies geometric rules of construction associated with the perfect circle and the square. Finally the Humanist sans substitutes a pre-Modern (in the Oldstyle / Transitional / Modern sense) contrast styling for the Modernist contrast styling of the traditional or Realist sans in some or all of the letters.</p>
      <p>The descriptive protocols for contrast implicit in the cube provide an important handle on gauging formal features.</p>
