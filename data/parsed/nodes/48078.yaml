      <p>Bill: <em>There is no sans serif that has anything like the contrast of a broad pen penstroke.</em></p>
      <p>Look at the cube (see image above). Everything you need to know about the difference between 'grotesque' and 'humanist' sans is shown there. What is important to understanding the difference is what happens in the rest of the cube, because the contrast of the actual sans letters is so low that the stroke dynamic isn't obvious. But once you see the whole picture, you realise that ‘grotesque' sans correspond to the construction of expansion based stroke letters, while ‘humanist' sans correspond to the construction of translation based stroke letters. Sans serif letters are, apart from their obvious lack of serifs, typically letters with greatly reduced stroke contrast. But if one takes letters created with a split nib pen (expansion stroke, ‘modern', ‘didone', ‘romantic') and systematically reduces their contrast one ends up with a grotesque sans. If one starts with letters created with a broad nib (translation stroke, ‘humanist', ‘garalde', ‘renaissance') and similarly reduce the contrast one ends up with a humanist sans.</p>
      <p>The terminology that we apply to these forms is cultural and, hence, freighted with associations (as you note with regard to ‘static' and ‘dynamic'). This isn't a bad thing, but it shouldn't be mistaken for understanding of letterform construction.</p>
