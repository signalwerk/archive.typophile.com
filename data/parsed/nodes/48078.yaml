      <p>James, I will be interested to hear what you learn and how your thinking evolves. Without knowing anything about it at all, I have never been comfortable with the idea that Underground developed from calligraphy. It doesn't look like a calligraphic typeface to me -- does it look like Flora to you? Just because the caps are proportioned less rigidly than in conventional grotesques does not somehow endow this typeface with calligraphic value. Johnston was a great calligrapher. So what? I think the sources are more likely to be found more widely in art nouveau and art deco.</p>
      <p>I also object to the idea that calligraphy is, necessarily, in and of itself, a desirable influence on type.</p>
      <p>And finally I am uncomfortable with the designation 'humanist'. This is a warm, fuzzy word that implies that there is something 'human' rather than machine-like about a type. You constantly read, in font PR, about 'warm, humanist touches' in this that or the other typeface. OK to have PR, but let's not fall into the trap of believing it.</p>
      <p>The word itself was developed to contrast not with the machine but with the divine, and the OED, as yet, has not recognized the use of the word in typography. (OED3 draft)</p>
      <p>In my sometime role as reader for the OED, I will be sending my editor there a note on this because like it or not, the word has been used extensively in writing about type. Any help identifying sources for the earliest quotations using the word in its typographic sense would be greatly appreciated. </p>
      <p>In this thread: <a href="http://www.typophile.com/node/35213" title="http://www.typophile.com/node/35213">http://www.typophile.com/node/35213</a></p>
      <p>there is a fair share of nonsense. When Updike, a tremendously careful writer who would never introduce a novel term without defining it, spoke of humanist influences, he will have been using the word properly, something like 'the system of the Humanists, the study of the Roman and Greek classics which came into vogue at the Renascence' or 'Pertaining to or characteristic of the humanists or classical scholars of the Renascence; classical.' </p>
      <p>It's not always easy to know what people meant when they said it.</p>
      <p>And type people, the divine Bringhurst not excepted, have taken too many unnecessary liberties with the language in late years.</p>
      <p>It would be great if you could separate some of the wheat from some of the chaff. Stone has really been studying this topic. I would contact him directly.</p>
      <p>I think I know what happened to 'humanist' in type. Someone, too clever by half (maybe Updike?) used the term humanist to refer vaguely to Renaissance-style proportioning of letters. The usage was picked up by someone who was at a loss to describe the Johnston sans serif caps. Others, not so clever, picked up on it, or, on the other hand, spotting a great potential PR manoeuver, said, what the hell, let's go with it, even if it is daffy. It works! (and it does)</p>
      <p>The thing is, when you use the word 'humanist' today, to people who don't know that all it really means is 'not Godly', it has enormous cachet, enormous allure. </p>
      <p>But I am firmly of the opinion that the first thing we should do in talking about type is to reject cute neologisms. Just because one has thought of them or found them clever doesn't mean they are good enough to be used in our discourse. I am so glad that I haven't heard Bringhurst's 'bicameral' lately, but maybe I haven't been reading Typophile enough. Or is his influence on the wane? A fabulous book, but ... trust the language. I don't like special vocabulary in philosophy any more than I like it in type, or in any field. Plain English is good enough for me!</p>
