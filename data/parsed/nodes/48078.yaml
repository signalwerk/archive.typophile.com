      <p><em>...inherently more readable...</em></p>
      <p>That wasn't what Didot et al were thinking.<br>
      Here's what Austin had to say in 1819 about the coming of the modern (didone):</p>
      <p>“The modern ... printing type at present in use was introduced by the French, about twenty years ago: the old shaped letters being capable of some improvement, it was judged expedient to re-model the alphabet to render them more agreeable to the improved state of printing…” </p>
      <p>So, new, high-tech printing made the old-style unpalatable.<br>
      Those were revolutionary times. How quaint, irrelevant, and unreadable the old style must have seemed, and even a few words would have tormented the reader with the burden of centuries.</p>
