      <p>Who is James? Is James John? </p>
      <p>John, I love your latest post - - ingenious. However, I cling to my position at least as a historical position. It has been better stated largely by Nick. Nick also makes a point I was about to make, '“development of sans serif humanist type” is a pretty weak and haphazard concept, prior to the influence of Gerrit Noordzij.'</p>
      <p>In my words, whatever the merits of my position on past typefaces, I accept that going forward there is a great deal more sophistication in the field and that the rules henceforth could well be different. I propose caution when applying contemporary knowledge, taste, attitudes to historical phenomena. </p>
      <p>That leaves us with the question of how to classify Argo. Or even something like Scala. Take the sharply diagonal humps on m and n. Do they remind you of pen strokes? They remind me of the same gesture in one of Monotype's early metal Century cuts more than anything else. I see the affect as an industrial era, a late Victorian fillip, not as a questing for the pen. I have always loved that mannerism, and longed to employ it somewhere, but who wants to be accused of stealing from Scala, which now effectively 'owns' the form, however it was arrived at? Also, because I knew the form well before I ever saw Scala, I naturally inferred that it must come from that particular typeface. But it could have come from plenty of other sources, not excluding the pen.</p>
