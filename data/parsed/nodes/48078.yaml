      <p>Karsten, you'll discover what the vernacular parameters are if, as all of us have done, you take the serifs off a face like Bembo (or better yet, something like Romanee, which is lower in contrast), and realize that the typeface is completely unusable.</p>
      <p>Relatively high x-height is one of the crucial components of the sans vernacular I am talking about (one of the reasons why Futura is not much used for text today is that the high-x-height versions, designed for text setting in metal, have never been digitized). Other parameters are low contrast and absence of stress. </p>
      <p>Here are some ghastly examples of experimental work I did in 1993 and then abandoned after a day or two because it seemed clear that the literal approach I was testing was never going to work. With apologies (not least for no fitting!) and also with the idea that such mistakes are often the best way to learn:</p>
