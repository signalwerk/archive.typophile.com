      <p>Bill: <em>Relatively high x-height is one of the crucial components of the sans vernacular I am talking about .... Other parameters are low contrast and absence of stress.</em></p>
      <p>The 'absence of stress' is a function of low contrast; in fact, there are few designs with a complete absence of stress, since there are few designs with a complete lack of contrast. As soon as you have any contrast at all, you introduce stress, however minimal or even optically unapparent. Why are almost all sans serif types low contrast? I think basically because that's the only way you can make stable letters with straight, serifless stems. Once the serifs are gone, the thin stems become unstable, they either need to be flared as in Optima, or they need to be made heavier. If you make them heavier, you start to close up the inside of the letter, so you compensate by making the thick stems lighter, and hey presto you have a low contrast letter.</p>
      <p>The x-height issue is an interesting one. I think it is worth noting that, prior to the revival of renaissance type styles in the 20th century, x-heights had, on average, been getting larger for a period of 250 years. After Garamond, they could hardly have gotten smaller! By the time Scotch Roman and 'Egyptian' types develop in the 19th century, their x-height is pretty large, so there is a direct precursor in serif type to the large x-height of the post-romantic sans. There is also a practical consideration that arises in the Egyptian slab serif style and which applies also to sans: once you start increasing the weight of thin strokes to reduce overall contrast, you need to make room for them vertically. This is especially the case for letters like a and e, in which the only way to keep the counters open as the stroke weight is increased is to make them taller. Although 'humanist' letterforms are typically more open, they are also subject to this condition when their stroke contrast is reduced, and so they share a similarly large x-height in their sans guise.</p>
