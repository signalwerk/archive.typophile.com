  html: <p>I’m looking for reading materials on the humanist sans-serif calligraphy that lead to the development of sans-serif humanist type. Zapf and Stone have documented their influences but I’m looking for more information on the roots of Johnston’s Underground, Frutiger, Syntax, etc. What can I read to learn more about the handwriting that inspired these designs?</p>
