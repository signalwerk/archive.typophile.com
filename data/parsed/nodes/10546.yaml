    html: |-
      <p>And again I miss him. </p>
      <p>As his students we all wrote a few lines to commemorate him. I described him as a genius wearing a workman’s overall of modesty. (’Een genie in een stofjas van bescheidenheid’) It doesn’t translate well into English, but this is what he was.</p>
      <p>I seriously doubt I will meet a person combining total seriousness with gentle playfullness in that way ever again.</p>
      <p>——————————————————————————<br>
      My work is a game. A very serious game [M.C. Escher]</p>
