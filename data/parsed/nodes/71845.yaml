      <p>Can you give more details about the date and country of origin of each sample? I have Updikes "Printing Types" and it would help to narrow the century and nation for each. The Latin does not necessarily mean these were Italian, because Latin was often the language of scholars, regardless of nationality.</p>
      <p>- Mike Yanega</p>
