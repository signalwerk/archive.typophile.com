      <p>So many, many people to thank – Rich and Carima for their generous hospitality, Shu for taking a hit for the team by staying up late to entertain the attendees, Tamye, Kent, Michelle, Jon, Deb etc., for all their work behind the scenes, the sponsors, the speakers, - truly amazing! Thanks SOTA!</p>
