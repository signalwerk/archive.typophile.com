    html: |-
      <p>Thanks, James. You’re quite welcome.</p>
      <p>And right back at you. It’s the attendees and participants, as much as the organizers, that make TypeCon what it is. As you know, the whole thing is pretty much volunteer. So TypeCon is all of us and we all help to create it in our different ways. </p>
      <p>Peter, it was great to see you and Stefan. I’m glad the Swedish delegation was there again to “represent.” You guys are always great fun to have around. But next time, get your stuff to me in time to go in the goodie bag ;-)</p>
      <p>Nancy, I enjoyed what I was able to see of your presentation. As someone said to me in the hall afterward, you always manage to make the most seemingly mundane things so fascinating.</p>
      <p>Mark (“Jupiter Boy Hatley” ;-), it was great hanging with you &amp; Pam (and Craig and Jason) at the Roycroft, however briefly.</p>
      <p>It was great to see many of the usual suspects and meet some more Typophiles face to face. </p>
      <p>Hope to see y’all again next year in Atlanta!</p>
      <p>— Kent.</p>
    html_clean: |-
