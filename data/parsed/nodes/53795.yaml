    <p>Type choice advice by people who boldly state that "nowadays, everyone is a typographer", even "everyone is a font designer" and, of course, also a "foundry":<br>
    I just got my hands on the magazine of <a href="http://www.prolitteris.ch/" rel="nofollow">Pro Litteris</a>, the Swiss copyright society for literature. For some reason, they're now doing a series on, you guessed it, fonts. This is the first feature: "The 12 most readable fonts."</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/readablefonts_5348.jpg"></div><br>
    My favorite comment on that spread: "If you don't feel like designing, or don't have any talent, use Courier. No Design at its best!"<p></p>
