    html: |-
      <p>Yeah; I suspect this is supposed to be a "beginners' collection" so they tried to feature in a reasonable portion of the fonts that anyone would find on their computer anyway. Courier really baffled me too, though ("A design masterpiece from the typewriter era"!). </p>
      <p>William, there are some very short (1 to 3 short lines) comments on the individual fonts, and they actually say to handle Verdana with care in print. The rest of the comments seems rather… unuseful ("Veto comes very close in approximating the invisible skeleton of letterforms" – what's that supposed to mean, especially to laymen?).</p>
      <p>I'll be curious to see how this progresses. Next issue will have the "12 most decorative fonts" (Curlz anyone?) and after that, it's going to be the "12 most visionary fonts" (that's going to be interesting).</p>
