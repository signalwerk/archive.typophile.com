      <p>I think the only legitimate way to access un-released proprietary fonts for personal use might be through journalism. Write about fonts, get good at it, get published and only then will people possibly trust you with their unreleased work. Based on this a request to use these fonts for D&amp;D work may be considered strange - but hell, there are stranger people in the font world.</p>
      <p>Cheers, Si</p>
