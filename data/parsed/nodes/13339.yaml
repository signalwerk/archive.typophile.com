  html: <p>i love typophile. i really do. but sometimes it makes me more than a bit sad to see us attacking eachother on <em>personal</em> issues. i realize that type doesn’t exist in a vacuum and that even type design is interconnected with languages, cultures, ideologies, politics, &amp;c. Passion is what brings a lot of us to typophile—a passion for type. it would be ludicrus to expect that such passionate folks wouldn’t be passionate about other things as well. likewise, it’s unreasonable to to believe that we’ll all see things the same way. this is what makes typophile so wonderful—to see the head-to-head comparison of ideologies concerning different aspects of type and type design. however, i think it’s a travesty when such wonderful discussions spiral out of control and begin to include vicious attacks on each other. it’s dissappointing to see persons for whom you hold so much respect sink to a dog-eat-dog level, meteing out insults on an “eye for an eye” basis. aren’t we better than that? is it too much to ask for us to use a little tact in what we say here on typophile? i’ll admit i’m not faultless in this regard, but i do my best to show respect to all of you and i would hope to enjoy the same.</p>
