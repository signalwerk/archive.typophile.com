    <p>During the last days I had an idea for a little font quiz. The aim is to identify the fonts of some particular sentences. Each sentence is missing one word. And this word is the name of the wanted font. Try it out –&nbsp;if you solve too fast, I will have to make the next level a bit harder ;-)</p>
