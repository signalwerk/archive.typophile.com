  html: |-
    <p>This is how it works:</p>
    <ul>
    <li>A portion of a glyph is published in the Type ID Pop Quiz.</li>
    <li>Try to identify the glyph and the typeface. To win, you need to name at least:
    <ol>
    <li>typeface
    </li><li>weight
    </li><li>character/glyph</li>
    </ol>
    </li>
    <li>Show off your knowledge by casually mentioning additional trivia, like who designed it, when and by whom was it (first) published, and other cool stuff to impress your fellow Typophiles with.</li>
    <li>The winner produces a new challenge -- a portion of a glyph, black on white background, presented in a 288 x 288 pixel square, including a R204G000B00 1 pixel border.</li>
    <li>The person who posts a challenge can't win the next game.</li></ul>
    <p>In case of any disputes, I will act as judge, jury and avenging angel of wrath.</p>
    <p>If you think this is a little too difficult, maybe try the <a href="http://typophile.com/node/31362" rel="nofollow">Entry Level Type ID Pop Quiz</a> or <a href="http://typophile.com/node/31363" rel="nofollow">Intermediary Level Type ID Pop Quiz</a> first.</p>
    <p>Good luck everyone, and have fun. ;^)</p>
    <p><em>With respectful thanks to the originator of this utterly useless but highly entertaining waste of time, the often imitated but never duplicated Cheshire Dave.</em></p>
