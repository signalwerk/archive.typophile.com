    html: |-
      <p>Raph, best of luck with the blog, but what's with the revisionist history, or perhaps a bit too much champagne during the post launch research? </p>
      <p>&gt;The first web fonts actually shipped in December 1994 (Netscape 4.0 shipped with support for the proprietary PFR format). </p>
      <p>&gt;Internet Explorer has had support for its own flavor of web fonts since IE6, </p>
      <p>IE 4 first supported EOT (not IE6), and Netscape wasn't even called Netscape until late 1994, Netscape 4 shipped a few years later than that (June 97 according to Wikipedia). There was no FONT tag until 1995 and IE.</p>
      <p>"light and breezy" indeed :-)</p>
      <p>Cheers, Si</p>
