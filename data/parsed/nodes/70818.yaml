  html: |-
    <p>I just put up the first post of my new blog: <a href="http://hotlead.levien.com/" rel="nofollow">Hot Lead</a>. The first one is a little light and breezy, but I plan to get into a lot more detail about what we're doing with the Google Font API, open source fonts, performance, rendering, font technology, and more. Please subscribe and wait for updates.</p>
    <p>We had a great launch, and I'm still recovering a bit from all the excitement - and definitely looking forward to relaxing a bit this holiday wekeend. Again, thanks to everyone here at Typophile for supporting the effort in many different ways.</p>
