    <p>Hey all, I'm trying to identify the slab on the "Black &amp; Mild" logo.  I saw an empty pack on the ground the other day (the blessing and curse of being a designer: noticing type everywhere) and have been trying to figure out what it uses since then.</p>
    <p>I thought the bowl in the "d" was quite peculiar for a slab.  Any ideas?</p>
