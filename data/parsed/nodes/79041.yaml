    <p>TYPE DESIGN INTERNATIONAL STUDENT COMPETITION “MILOSZ 2011”</p>
    <p><em>2011 has been designated as the Year of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Czesław_Miłosz" rel="nofollow">Czesław Miłosz</a>, and as such it will abound in momentous events making literature an everyday experience and enhancing the status of culture in public sphere. The Year will celebrate the book itself – the word and its setting.</em></p>
    <p><em>The ZNACZY SIĘ New Art Foundation announces the International Student Competition for Typeface ‘Milosz’.</em></p>
    <p><em>We hope the competition will highlight the importance of the written word and the craft of typeface design.</em></p>
    <p><a class="freelinking external" href="http://typemilosz2011.pl/en/" rel="nofollow">http://typemilosz2011.pl/en/</a></p>
