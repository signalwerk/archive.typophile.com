    html: |-
      <p>You have to divide the paths where the strokes are overlapping, in order to make the effect of something on top, or below.</p>
      <p>Then zoooom in very much so you see detailed info where the “overlaps” are and edit.</p>
      <p>There can’t be one closed path, but 5-6 of them in order to make the illusion work properly.</p>
