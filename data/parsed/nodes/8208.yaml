    html: <p><i>&gt;Torgeir, I gather the limitations on fonts were the amount of glyphs it could hold. Thus some designers either left out true small caps and things like old style numbers. The reason I bring this up is with Open Type that will change.</i> <br> <br>Torgeir, Daniel is exactly correct. If you look at a new big re-release of an older font family in OpenType, you'll see that these things have been added in where they weren't previously. Avenir NEXT, for instance, has italic small caps and old style figures. The old Avenir had neither SC nor OSF in any of its weights. <br> <br>Often in text, small caps serve a very good visual role�they keep the grey matter grey. For instance, long strings of caps is visually very distrurbing. In a text about the Cold War, you'd have USA and USSR cropping up non-stop. Small Caps make these texts look better and more even.  <br> <br>When a sentence in this cold war sample text would be set in italic for emphasis, the small cap rules should apply, too right? Well, with new OpenType fonts, it can, and it will in the right hands.</p>
