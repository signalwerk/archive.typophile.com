    html: <p>Torgeir, I gather the limitations on fonts were the amount of glyphs it could hold. Thus some designers either left out true small caps and things like old style numbers. The reason I bring this up is with Open Type that will change. The amount of glyphs an Open Type font can support is huge. So look for OT on future purchaces of typefaces.  <br> <br>As for Swash Caps they are ment to be used sparingly. I also use Small Caps sparingly. For body text its Roman. For emphsis its Italic.</p>
