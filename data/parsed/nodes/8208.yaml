    html: <p>I don't know if glyph amount limitation has been the cause, there are often separate fonts for small caps (and text figures). But maybe Open Type will change the situation either way. <br> <br>My understanding of small caps is that they're used for e.g. initialisms (if that's what you mean by sparingly?). The problem of italic small caps appeared when I wanted to emphasize a phrase/expression containing an initialism, but unless I misunderstand, using italic small caps for these rare cases would be prefered?</p>
