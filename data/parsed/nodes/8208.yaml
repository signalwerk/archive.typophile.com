  html: <p>Hi! <br> <br>I need some help with understanding the "relationship" (for the lack of a better word) between italics, small caps, and swash caps. It seems not very common for fonts to come with italic small caps, so I suppose this means they're not frequently used. But if italics is to be used for a phrase that normally includes small caps, how is this normally resolved? By just using normal italic caps instead? Mechanical italic small caps? Or is it the best to choose a font that contains optical italic small caps? This is my main question, but it also leads me to wonder (out of curiosity), how is it common to deal with this issue if italic swash caps are used? <br> <br>Thanks, <br>Torgeir</p>
  html_clean: <p>Hi! <br> <br>I need some help with understanding the "relationship" (for the lack of a better word) between italics, small caps, and swash caps. It seems not very common for fonts to come with italic small caps, so I suppose this means they're not frequently used. But if italics is to be used for a phrase that normally includes small caps, how is this normally resolved? By just using normal italic caps instead? Mechanical italic small caps? Or is it the best to choose a font that contains optical italic small caps? This is my main question, but it also leads me to wonder (out of curiosity), how is it common to deal with this issue if italic swash caps are used? <br> <br>Thanks, <br>Torgeir</p>
