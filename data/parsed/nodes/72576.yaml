    <p>I have always been really good with identification of typefaces, all the way back to college, but this one is killing me. I thought I knew what it was, then when I went to set what I needed, I wasn't even close.</p>
    <p>The catch is, I only have access to numbers... if it helps, these were originally created in the early to mid 80s. </p>
    <p>PLEASE HELP!</p>
