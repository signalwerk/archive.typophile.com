    html: <p>I would not infer anything about the kerning or spacing  <br>of Carter's MoMA Gothic from the overlay. I suspect that  <br>this illustration was built on the old logo. From the scan  <br>of the article which RK mentioned above, the old logo  <br>looks unevenly spaced in the MoM, while Carter's looks  <br>fine to my eye. <br> <br>I would expect that in a heavy sans serif like this the M  <br>and the o would quite likely have symmetrical sidebearings.  <br>Probably no kerning necessary. <br> <br>Georgia does not have kerning, presumably, because  <br>kerning has little meaning for screen display, and  <br>probably because MS didn't ask/pay Carter to provide  <br>kerning. That's my guess. <br> <br>-- K.</p>
