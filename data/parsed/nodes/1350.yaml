    date: 2003-09-22T17:17:00
    date_raw: 22 Sep 2003 — 5:17pm
    votes: null
    html: <p>The problem with the question as posed by the NY  <br>Times caption, and with the subsequent perseverating  <br>over the two logos, is that Carter wasn't hired to  <br>redraw the MoMA *logotype* -- he was hired to create  <br>a revised cut of Franklin Gothic (two of them, in fact,  <br>text and display). <br> <br>Any comparison of four letters -- well three, actually --  <br>especially these particular few, will inevitably show  <br>little perceptible difference. The real differences, I  <br>suspect (and justification for the project) will only be  <br>seen when the fonts are used in mass. Then the  <br>cumulative effect of refined letterforms and spacing may  <br>show up in a difference in overall fit and color --  <br>moderate passages of text in a catalog or brochure,  <br>large display signage, etc. <br> <br>A logo alone is bound to be an inadequate demonstration,  <br>IMHO. <br> <br>-- K.</p>
    html_clean: <p>The problem with the question as posed by the NY  <br>Times caption, and with the subsequent perseverating  <br>over the two logos, is that Carter wasn't hired to  <br>redraw the MoMA *logotype* -- he was hired to create  <br>a revised cut of Franklin Gothic (two of them, in fact,  <br>text and display). <br> <br>Any comparison of four letters -- well three, actually --  <br>especially these particular few, will inevitably show  <br>little perceptible difference. The real differences, I  <br>suspect (and justification for the project) will only be  <br>seen when the fonts are used in mass. Then the  <br>cumulative effect of refined letterforms and spacing may  <br>show up in a difference in overall fit and color --  <br>moderate passages of text in a catalog or brochure,  <br>large display signage, etc. <br> <br>A logo alone is bound to be an inadequate demonstration,  <br>IMHO. <br> <br>-- K.</p>
