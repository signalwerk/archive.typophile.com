    date: 2003-09-23T10:28:00
    date_raw: 23 Sep 2003 — 10:28am
    votes: null
    html: "<p>I thought it strange that the writer didn't note that a <i>very</i> slightly modified Franklin Gothic No. 2 shows up all over the Times, in major section heads, captions, etc. Does anyone know how the Times arrived at their version of No. 2? It's very slightly condensed, and the dots of the i and j are a little taller, closing up the space between themselves and the lower parts of their letters, and the top of the lower-case t extends nearly to the cap height. Other than that it looks identical. <br> <br>So: is the Times' No. 2 the same thing they're calling \"soulless\" in the old MoMA usage? If so, I suggested in a letter to the Times that they should ask Matthew Carter for a copy of the new and improved No. 2. <br> <br>(I wonder: will Carter call the revised face Franklin Gothic No. 2.1, or does it merit a whole-number upgrade?) <br> <br>Tim: I thought the same thing about the o kerning, but, of course, the typeface isn't finished yet.</p>"
