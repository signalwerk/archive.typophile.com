      <p>One computer installed, 3 more to go -- but, hey, we're in no hurry. No problem so far with any font -- we didn't try very hard, as we had other fish to fry.</p>
      <p>Item: Safari's Java is not compatible with Java applets we have to use to upload. Firefox works fine, but .. what the 'eck?</p>
      <p>Item: printing to a Postscript file, using Adobe's PPD, is <em>not</em> dead -- well, not for us. That option disappeared from InDesign! Some web searching provided the answer: copy the Adobe PPD from your old (yes...) OS 10.5 Library/Printers/Contents/.. (some more path) and paste into Snowie. Works again.</p>
      <p>Sigh. I'll let you know when we get to the fonts. The guys at the office are not <em>extremely</em> impressed, so far.</p>
