    votes: null
    html: <p>Just speculating here.... Mac PostScript Type 1 fonts are comprised of two files, one containing the PS outline data and basic metrics (the sidebearings) and the other, a Mac "suitcase" file containing the kerning, style linking and other metrics data. Could it be that Snow Leopard is getting all its info from the outline file and ignoring the suitcase file? That would explain the lack of kerning and possibly the line spacing discrepancy for some fonts. Perhaps Snow Leopard needs the .afm file as well (which was needed for programs that couldn't get the metrics from the font suitcase)? Like I said, just speculating.</p>
