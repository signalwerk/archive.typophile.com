    html: |-
      <p>I usually get any visual input (be it an other font, graphics design, some scribbles, architecture, etc.), and this is my starting point.</p>
      <p>This input also decides which letter i draw first (on paper yet). The scribbling is terrible, not to be comparable to other scribblings I see here on typophile sometimes. I try some other characters, rather randomly, but they usually are lowercase (about 10). I try to get every stylistic element in the draft, like stems, bowls, slants, etc., but I'm not too consequent. This phase is for developing the idea, so there can be different styles yet. I do not draw a "final" draft on paper, but start doing this on the computer.<br>
      There, i start with the character i'm in the mood for, but this often ends in the dilemma that I need another character first, because it influences the character I'd like to start with. So this is a continuous change of "i want to" and "i have to do first". Usually it ends up in doing "n", "o", "H", "A" as leading characters, and there, it is pretty much where the "final" style is determined.<br>
      Then I do a-z and A-Z rather fast (2 days or so?), and then start the long long long balancing process. The problem then is, that I start to be keen on ligatures. I draw them too early and have to revise them about 100.000 times :)<br>
      If I've had enough of the design part, I start creating diacritics or do some opentype-coding...</p>
      <p>This are the observations of a typedesign beginner still learning (3 fonts so far, none finished completely), but I think this is much more effective than the method I started with (a-z, A-Z from scratch). The problem there is, that you have the atypical characters first (a, e, g), which are difficult to derive a common style from.</p>
      <p>sebilar</p>
