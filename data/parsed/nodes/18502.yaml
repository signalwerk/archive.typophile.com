      <p>I'm going to sound like a total dick for saying so, but only a complete novice would draw the alphabet in order: abcdefgh etc.</p>
      <p>It's one thing to draw a typeface on paper, and quite another to draw a typeface in software. Personally, when I'm drawing a typeface on paper, the letters come out in no order, and I don't direct them; one thing leasds to another. For giggles, here's what I have drawn in my sketchbook. (Each line is a different page):<br>
      knitsse / efagior / EDL / n<br>
      ANSWER / WW<br>
      FJ / MMN / ZZ WVY / FFFZFJ / TZ<br>
      245011 / 786 ENC / E 3 q 6<br>
      2 21 / 5 4 478 / 8336<br>
      verygaaa / V V U A B / D R P Q S / X S T<br>
      01233445 / 222229 / 97778 / 88614<br>
      k kentis / ornacri / koikiva<br>
      village / ubibir / r rare<br>
      af affluent / f azimxu / yungli</p>
      <p>Makes no sense, of course</p>
      <p>When drawing letterforms in FontLab or FreeHand, the n and o are starting points. From there you're led to make h, l, r, u, and m, as well as p, d, b, q... Things lead to other things which suggest still other things.</p>
      <p>I'd be curious to know how many people drawn randomly versus those who have a plan of attack...</p>
