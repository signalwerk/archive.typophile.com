    <p>Hi everyone,<br>
    I'm a Graphic Design student, and i've always loved type. From time to time, I've tried creating my own typefaces on paper. Problem is, i'll create a few letterforms and then when I try to expand beyond that, the letters start to lose their resemblance to my original idea. So I guess my question would be...what's a good letter to start with? I usually start with a lowercase A, but is there a better starting point to help maintain consistancy among the letterforms? I browse free font sites a lot, and see a lot of HORRIBLY designed fonts, and I would rather produce something a professional designer might actually use. Also, any general tips or books I should pick up would be great as well.<br>
    Thank you all,<br>
    Eric</p>
