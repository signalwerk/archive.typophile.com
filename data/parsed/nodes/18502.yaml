    html: |-
      <p>I find that which letters I start with depends on the individual typeface, but in general terms I try to mix in both forms that establish proportion (h i n o) and what are usually 'characteristic' forms, i.e. letters that do more to establish the flavour or personality of the face, (a b e g). The lowercase a is often the first thing I sketch, since this letter more than any other establishes the personality of the face, but I don't finalise this letter until I have done things like h and o.</p>
      <p>If I am working on a multiscript typeface, I'll work on the different writing systems concurrently. So alongside my initial Latin letters I'll be making initial Cyrillic or Greek etc.</p>
