      <p>Is alphabetic order not just another “prejudice”?</p>
      <p>I find it helps avoid prejudice, because there is not much rhyme or reason to it, in terms of character shape. Some though -- i and j, m and n, and v and w, are beside each other, probably because of letters that were spun off others were placed next to their source letter.</p>
      <p>Perhaps that's the point of alphabetic order -- it's a special sequence of letters that doesn't contain any words longer than 3 letters (OK Scrabblers, prove me wrong!)</p>
