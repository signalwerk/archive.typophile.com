    html: |-
      <p>Mmmm? The pencil/pen, has nothing whatsoever to do with the recording of typefaces and usually gets in the way. Though you may find mental...play space in scratching around with old tools, it is only that, mental and play. when you're done you still need to execute a "pure" line which a pencil cannot do, and fails to represent in even the best sketch. Until the digital line is cut, and thus the letter recorded, nothing else counts, or matters since none of it is left when the dust clears from the digital font. </p>
      <p>As for order of design, the press likes pat answers, but anyone whose done more than 1,000 or so, should tell you that "it depends." e.g. if it is the first letter of a new family, you *can* "start" anywhere. But it is not until you draw the "controls" (noted elsewhere I'm sure), that you "know" the appearance of the repeating things and so you can finish by designing the unique things, and not "chase your tail."</p>
      <p>If it is not the first letter of a new family, there is an algorithm where the selection of character to draw is based on intended use that leads you from the existing styles to the right choice, which always follows after the control characters. E.g., if an agate is to be drawn well, based on the text face, then you must draw the controls from the text first, and then head for the most "congested" characters, like e.g., e or g, and then, loop back to the controls if you need to, early in the process, to make sure the controls and special-est characters, whatever they may be, work.</p>
