      <p>Bezier curves do impart a natural flavor to curves. If you're not careful stuff can start to look all the same. That being said, most people that say that you must start with a pencil suck at bezier curves. Since I can get my ideas out more quickly and clearly with beziers, that's where I often start. So my advice is this: if you are going to do type design, figure out how to use bezier curves.</p>
      <p>As for which letter order you should use: it doesn't matter. I think it's a type design myth that doing the o and n first gives you a better sense of what the other characters are going to look like. In some ways, those characters are the most vanilla, and give you less of an idea than some of the more challenging characters. </p>
      <p>If you are simply manufacturing a font, then it makes sense to start with o and h or even O or H, where elements can be easily reused. If you are designing a font, you might start anywhere your idea is most relevant.</p>
