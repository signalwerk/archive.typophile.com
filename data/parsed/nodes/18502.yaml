      <p>Sometimes alphabetic order can lead you down a primrose path from which there is no escape.  Several months back, I ran across an enchanting little typeface in a book of handlettering with very unusual serifs. They resembled a dancer's foot <em>en pointe</em>, and so I thought the name <em>Twinkletoes</em> would suit the typeface well.</p>
      <p>Since I was presented with a complete upper and lowercase alphabet A-z, I dutifully recreated them, and then fleshed out a complete character set. It was only <em>after</em> I imported all of my outlines into Fontographer, generated a PS font and opened it in FontLab (have I mentioned before that I think FogLamp is a rip?), and started the process of setting widths, sidebearings and kerning, did I discover a VERY serious problem. The alphabet fit together beautifully A-Z and a-z, but virtually EVERY other letter combination required kerning. Before I got too far into it, I estimated that, at my present clip, expanding the basic kerning to include accented characters would result in over 10,000 kerning pairs--not a practical solution. So, I shelved the project; maybe someday, when everything in my life is settled and I <em>need</em> some aggravation, I'll go back to this project.</p>
      <p>The moral of the story: sometimes it works, sometimes it don't...</p>
