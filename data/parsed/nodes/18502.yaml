    html: |-
      <p>I think how the identity of a face is defined depends on how the initial idea came.<br>
      For this reason, the starting point to me has been often a different letter (or numeral), or a small group of them. When I started to learn software I played with geometric faces directly in FontStudio.<br>
      Later on, all my few finished or released types have seen the first ideas generated in the form of pencil sketches.</p>
      <p>I think the best advice emerged from different perspectives. John Hudson with his huge experience is right, since you have to define or fix reference glyphs as the design proceeds, otherwise you'll lose focus (your problem). The key ones people underlined are the one to do, but it depends on the idea as well.</p>
      <p>What Nick Curtis said about not having a strong or clear idea at the beginning seems not to make much sense. As Hrant pointed out, a design evolves as you start considering its problems, and it may turn out to be good, or to be just a better basis for something else.<br>
      But I think you'll start seeing this in perspective.</p>
    html_clean: |-
