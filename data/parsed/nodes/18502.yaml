      <p>Often I start with something like habrgefits (a stripped-down "<a href="/wiki/hamburgefontstiv" class="freelinking" rel="nofollow">hamburgefontstiv</a>") and HAOP, and play around with those. But sometimes I'll just do a handful and then fill in the rest in alphabetical order.</p>
      <p>I tend not to do a lot on paper, but I do spend a while refining the concepts in my head. Sometimes I can noodle on letterforms for days before I try anything. Occasionally I'll jot stuff down, but often it's only a few key elements to remind me of the serif structure, or relative proportions, or the like - not necessarily very many whole letters.</p>
      <p>I've noticed that there is a correlation (not a rule, just a correlation) between the age of the type designer and whether they draw on paper first. Seems like the 50+ crowd tend to be overwhelmingly paper-firsters, and the under 40 crowd have a lot more folks who go straight to the computer.</p>
      <p>Cheers,</p>
      <p>T</p>
