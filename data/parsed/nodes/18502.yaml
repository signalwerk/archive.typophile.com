      <p>&gt; you probably didn’t have a very clear idea to begin with</p>
      <p>Maybe, but there's also the paradox that <cite>things change</cite> when you go from certain modes of drawing/painting/whatever to digital outlines. The severe exactitude of the latter (in constrast to the interpretation-inviting fuzziness of the former) typically imparts a particular -and often unexpected- flavor to the results. And lack of experience with this can lead to a sense of confusion concerning "what happened?" and "how do I fix this?"</p>
      <p>hhp</p>
