      <p><em>things change when you go from certain modes of drawing/painting/whatever to digital outlines. The severe exactitude of the latter (in constrast to the interpretation-inviting fuzziness of the former) typically imparts a particular -and often unexpected- flavor to the results</em>.</p>
      <p>This is true; however, since our inquisitor in this forum is a design <strong>student</strong>, I presume that he (again, I presume) may never have had the opportunity, which was actually a <em>necessity</em> for those of us who began our careers in the pre-digital days, of actually working with pens, pencils, drafting tools and the like.</p>
      <p><em>only a complete novice would draw the alphabet in order</em></p>
      <p>Maybe, maybe not; on the other hand, perhaps only a complete fool would believe that there's a certain magic formula which must be followed to ensure font success. Back in ye olden days when I was doing only freeware fonts, I took notice of the words of Ray Larabie, who--at the time--was the king (or at least the most prolific) of the freeware fontmakers. His particular formula was to start with the lowercase h; from there, saith The Ray, all other letters flowed. However, when I attempted to follow this sage advice, it seemed to me that the only things that flowed naturally were m, n and, occasionally, r. So maybe I'm a dope, but the Larabie method didn't work for me. More often than not, what <strong>does</strong> seem to work for me is to begin with the uppercase I, especially if it's a serif face: once I nail it, the same basic form can be used on 20 other letters--a slightly better payoff than two or three. But that's just me...</p>
      <p>If Nick Shinn's A-to-Z method works for him, then his method is beyond reproach. So, yes, Chester: you <strong>are</strong> a total dick for assuming your way is the only way, as are the Mac users who assume that their OS is the only OS, as are the PC users who assume that their OS is the only OS, and so on. In terms of how one chooses to tackle a project, the best approach FOR YOU is the one that works FOR YOU. After all, we're talking typography here, not religion...</p>
