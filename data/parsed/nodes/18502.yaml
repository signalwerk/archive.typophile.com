      <p>I'm not a designer, but I can report what the big guns start with, according to the New Yorker profile on Matthew Carter from December.</p>
      <p>According to Tobias Frere-Jones, the "classic approach" is to begin with H and O, then R.</p>
      <p>Carter likes to start with h and o, then p and d, then maybe v.</p>
      <p>The article goes into a bit more detail about why those strike the designers as good places to start. I recommend it.</p>
