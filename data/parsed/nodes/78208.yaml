    html: |-
      <p>I agree with Martin. Why mix it with another sans? There are condensed weights of Gotham if you’re thinking that Gotham is too wide for your headers.</p>
      <p>If you’re looking for something ‘fancier’ you could also try Museo / Museo Slab, it’s ten a penny (actually, one weight is free – although I’d go with one of the extreme weights).</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/exljbris/museo_slab_family_ot/" title="http://www.fontshop.com/fonts/downloads/exljbris/museo_slab_family_ot/">http://www.fontshop.com/fonts/downloads/exljbris/museo_slab_family_ot/</a></p>
