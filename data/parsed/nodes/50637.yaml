    <p>Hi there,</p>
    <p>Hope someone could help me out here… deadlines are horribly tight and I’ve got a small problem here I think…</p>
    <p>I’m working on a project in two languages. Priva is one of the typefaces selected for the project, and noticed something a little weird with certain characters.</p>
    <p>1) One of the strange things here is that the charcter ‘B’ in priva looks a little weird. Compared to Charter in this image and other typefaces we have, it looks different. Is this some sort of alternate version of this character?</p>
    <p>2) This other is that in Priva the character ‘э’ gets inverted and looks like the western ‘E’. I am basically copying all the text from Word and it inverts this character whenver Priva is used. Why is this?</p>
    <p>Anybody here ever dealt with this situation?<br>
    Any recommendations? Sadly, budget’s tight… and looks like we can’t change the typeface as this is the typeface the client uses on their material.</p>
    <p>:( This is the first time I have to deal with a foreign language other than Spanish and English. Help! :o)</p>
