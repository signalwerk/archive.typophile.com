    html: |-
      <p>The glyph sample you show doesn’t show all the letters of the Russian alphabet, and instead has several archaic letters (Ѣ, Ѵ, IA, Ѳ) and a couple of Ukrainian letters (Є, І).</p>
      <p>Some of those archaic letters have questionable designs in Priva pro. For example, Ѣ looks very strange considering it is supposed to be a capital letter. Also, I’m not sure how acceptable a Ѵ that looks like a V is.</p>
      <p>There’s also something funny going on with the outline of the Х as well.</p>
      <p>I would strongly recommend that you run the typeface choice by typographically-trained Russian eyes. As wonderful as Dino dos Santos’s Latin typeface designs are, these Cyrillics don’t look really professional.</p>
