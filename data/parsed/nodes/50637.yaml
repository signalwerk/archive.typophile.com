      <p>That there is an alternate Greek theta that got dropped in the wrong slot. Luckily, you could replace it with a Latin B. The worse problem is that э and є are two different Cyrillic letters.</p>
      <p>I would guess that if you contact <a href="http://www.dstype.com/profile.html">the creator</a> about these two mistakes, he would probably be glad to correct them and replace the font, because it’s something that can affect future buyers and he would want to know about it.</p>
