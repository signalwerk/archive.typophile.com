  html: |-
    <p>I'm sure you get requests for games, but it still feels a little weird asking.<br>
    I'm a bit at my wits end fining the Typeface used on the "blueprints" on the Engineer Update page for Team Fortress 2. I know the stuff in all caps is definitely another typeface, but I'm more interested on the "body" text. I feel like I’ve seen it before, but can’t remember for the life of me where.</p>
    <p>Attached is a bit of said "body" text, and below is the update's page for a better look.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/engihandsample_6696.jpg"></div><p></p>
    <p><a href="http://www.teamfortress.com/engineerupdate/" title="http://www.teamfortress.com/engineerupdate/">http://www.teamfortress.com/engineerupdate/</a></p>
    <p>I'm aware brush/handwriting fonts are difficult to identify, so I wish you the best of luck, and thank you regardless of whether or not this gets resolved. I’ll be continuing my search on my end as well.</p>
