    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Gerrit Noordzij</strong></p>
    <p>Pronounced "Herit Noortza", Gerrit Noordzij is a designer, historian, author, and long-time professor at the <a href="/wiki/Royal%20Academy%20of%20Art" class="freelinking" rel="nofollow">Royal Academy of Art</a> in the Hague. He developed an original theory of writing, published in his books, <a href="/wiki/The%20Stroke%20Theory%20of%20Writing" class="freelinking" rel="nofollow">The Stroke Theory of Writing</a>, and <a href="/wiki/Letterletter" class="freelinking" rel="nofollow">Letterletter</a>. </p>
    <p>There is a prize in his honor given every three years. Past winners were <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a>, <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a>, and <a href="/wiki/Wim%20Crouwel" class="freelinking" rel="nofollow">Wim Crouwel</a>.</p>
    <p><strong>Typefaces:</strong><br>
    <a href="http://www.teff.nl/fonts/ruse/ruse.html" rel="nofollow">Ruse</a>.</p>
    <p><strong>Links:</strong><br>
    See the <a href="http://www.letterror.com/noordzij/index.html" rel="nofollow">Gerrit Noordzij section</a> on the <a href="http://www.letterror.com/" rel="nofollow">LettError</a> site (includes a <a href="http://www.letterror.com/noordzij/bibliography/index.html" rel="nofollow">bibliography</a>).</p>
    <p><a class="freelinking external" href="http://www.katranpress.com/stamps_noordzij_1_1.html" rel="nofollow">Postage stamps by Gerrit Noordzij</a></p>
