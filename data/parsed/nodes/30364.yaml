    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Gerrit&nbsp;Noordzij</strong></p>
    <p>Pronounced “Herit Noortza”, Gerrit Noordzij is a designer, historian, author, and long-time professor at the <a href="/node/16297" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Royal Academy of Art</a> in the Hague. He developed an original theory of writing, published in his books, <a href="/node/79670" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">The Stroke Theory of Writing</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Letterletter" title="Create node &quot;Letterletter&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Letterletter</a>. </p>
    <p>There is a prize in his honor given every three years. Past winners were <a href="/node/13587" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fred Smeijers</a>, <a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>, <a href="/node/12062" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tobias Frere-Jones</a>, and <a href="/node/50953" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Wim Crouwel</a>.</p>
    <p><strong>Typefaces:</strong><br><a href="http://www.teff.nl/fonts/ruse/ruse.html">Ruse</a>.</p>
    <p><strong>Links:</strong><br>
    See the <a href="http://www.letterror.com/noordzij/index.html">Gerrit Noordzij section</a> on the <a href="http://www.letterror.com/">LettError</a> site (includes a <a href="http://www.letterror.com/noordzij/bibliography/index.html">bibliography</a>).</p>
    <p><a href="http://www.katranpress.com/stamps_noordzij_1_1.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Postage stamps by Gerrit&nbsp;Noordzij</a></p>
