    html: |-
      <p>They are swash versions of "a" and "l" (lowercase L). If you use the font in a "Cocoa" app, such as TextEdit, open the Fonts window and select "Typography" from the little "gear" pop-up near the bottom left, you can see that there are several swash and alternate versions:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/texteditswash_4742.jpg"></div><p></p>
      <p>If you enable the Character Viewer (from the Keyboard preferences in the System Preferences app), you can see all the different forms available for each basic character (such as lowercase L):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/characterviewer_5770.jpg"></div><p></p>
      <p>But, since Apple Chancery is an AAT (Apple Advanced Typography) font, not an OpenType font, InDesign doesn't recognize any of this. AAT is an extension of TrueType that preceded OpenType. It can do similar things (like swashes and alternates), but only works on Macs. It's probably because it's not cross-platform compatible that Adobe doesn't do much to support it in InDesign and their other apps.</p>
      <p>However, you can use the Character Viewer to insert these special characters into an InDesign document.</p>
