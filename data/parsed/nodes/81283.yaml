      <p>It's an alternate for "l" (lowercase L), not "L" (uppercase L). That may be why it's not showing up on your system. </p>
      <p>In any case, any characters you see in InDesign's glyph palette can be inserted into your text at the cursor position by double-clicking in the glyph palette.</p>
