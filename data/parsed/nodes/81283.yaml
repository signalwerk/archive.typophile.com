    <p>First of all I apologize if this isn't quite the appropriate forum, but I'm hoping someone will be generous enough to be patient with me! I also apologize if this was brought up before; I searched and could find nothing so please point me in the right direction if it has! </p>
    <p>I'm fairly new to typography and design. To make a long story short, I was digging around the glyph palette of Apple Chancery and stumbled across these: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/applechanceryglyph_3719.png"></div><p></p>
    <p>My name's Alexa. These look to me like my initials, so pardon me but I suppose I've become a little spooked!</p>
    <p>A. Are these specific glyphs with a meaning or just swash caps?</p>
    <p>B. In InDesign at least, when I hover over these glyphs in the palette, they're named "null". A lot of characters are, actually. Is there a way to identify these in the future besides posting them here? </p>
    <p>Please guide—or shove if you'd rather—me in the right direction. Thank-you!</p>
