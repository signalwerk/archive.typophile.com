    html: "<p><i>Don't want to really reduce this down to atomic level, but you actually wrote (John Hudson):  <br> <br>&gt;If you can service 500 members, you can  <br>&gt;probably service a thousand at not much more cost.  <br> <br>This sounds like a proposal to me to double the mmbership.</i> <br> <br>I wrote that in the middle of a discussion of economy of scale, as an example of the reduction of per member costs relative to increasing numbers of members. Everyone else seems to have understood this, and I've already explained to you once that it was not a proposal to double membership, any more than the same example citing a hypothetical 1500 members would be a proposal to triple membership. The amount of money one needs to spend on each member dimishes the more members one has: precise numbers are not important to understanding this basic concept, and I only picked 500 and one thousand as a simple example. At least, I thought it was simple. Perhaps I should have been more vague: if you have a big number of members, it will not cost much more per individual member if you have an even larger number. Understand the point now? <br> <br>I don't think for a minute that discounting fees for South Americans is going to double membership. I think some interesting and worthwhile people would join the association, who might not otherwise, and we would be helping our colleagues who are less fortunate than ourselves. If this can, in fact, be done without reducing overall revenues, it would be churlish not to.</p>"
