    html: <p>&gt; One thing that I find very difficult of understand is why some ATypI members are more  <br>&gt; interested in the financial balances than in the possibility of new contribution and  <br>&gt; experiences from others countries.  <br> <br>I find this fairly shocking myself, Ramiro, but then a lot of people cant understand why I sometimes work for free by trying to organise meetings, writing documents etc.  <br> <br>I'm not about to change my vision of things and I don't think they are either. In the past, I've tried to convince people to come to meetings that would have been very good for them but they wanted to be paid and didn't show. If I live another 100 years I still won't understand their attitude and they, for their part, think I'm absolutely crazy and totally naive.  <br> <br>What can we do? Compromise? I'm not so sure that it's possible. <br> <br>I'll end with an anecdote I heard recently. Apparently, a few years back, Boris Yeltsin wanted to be paid for appearing in one of his own publicity campaigns. The PR people were all standing around in the snow in Red Square trying to explain to him by phone that he was actually paying them. In the end he refused to turn up and the PR crew went home. <br> <br>I reckon shooting yourself in the foot will be an Olympic sport soon enough. <br> <br>Matha. <br> <br>  <br></p>
