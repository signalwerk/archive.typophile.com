    html: "<p>&gt; .... are far better in all aspects. <br> <br>Not to digress, but for almost a <i>month</i> now there's been a superb discussion about optical scaling and the merits/demerits of interpolation/extrapolation on the TD list, a complex issue of central importance, especially in light of the situation with MM. The \"two sides\" have been dueling intelligently and giving enlightening insights all around, and the protagonists involve people from all facets of type design, from Apple employees to Letterpress printers. I know why you left, but I think more perserverance and a better strategy could pay off for you; it's never too late to come back, and the list would be an even better place if you did. <br> <br>In comparison, the reaction to your <i>wonderful</i> question on the ATypI list concerning newspaper typography has been nothing short of pitiful, considering the extant potential. <br> <br>Trying to bring this back around: <br>If we can get at least some of the experts on the ATypI list to share just a <i>trickle</i> of what they know, and actually reply to direct questions in some shape or form, you can be sure we would increase membership, since you need to be a member to ask something (as opposed to just listening to other people's questions). <br> <br>hhp <br></p>"
