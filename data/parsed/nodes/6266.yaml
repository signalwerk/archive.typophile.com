    html: "<p>Don't want to really reduce this down to atomic level, but you actually wrote (John Hudson): <br> <br>&gt;If you can service 500 members, you can  <br>&gt;probably service a thousand at not much more cost.  <br> <br>This sounds like a proposal to me to double the mmbership. I would suggest that halving the annual fee to those in S America <b>would not</b> result in 500 extra members. <br> <br>You've mentioned the comparative incomes in several countries - such a comparison suggests to me not only do people have less money to pay on org fees, but also that clients have less money to spend on professional fees to the people you are trying to \"service\". <br> <br>Additionally, given that the org HQ is in Europe, servicing members in those countries, South America, is actually going to cost more than those in Europe. <br> <br>However, I do agree with you that the future of such an org is online - bcause of the relatively low cost of distribution. Although this of course again impacts ngatively on countries with lower incomes. <br> <br>I don't really see away around this apart from localized support networks.</p>"
