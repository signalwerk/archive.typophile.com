    html: "<p>Re. servicing members (sounds ruder than it is): <br> <br>In recent years, ATypI provided members with reasonably regular newsletters and a journal. Attendees of the Rome conference also received a complimentary copy of <i>Language Culture Type</i> (just one of many books that the association has published over the years). Our anonymous friend is correct to entail that such things entail some fixed and non-recoverable cost per member. He is incorrect to think that I am seriously hopeful of doubling the membership: I used the figures as an example of the economy of scale. I could easily have inverted the example and said that servicing half our membership would not be much cheaper than servicing the current total. Consider the newsletter or the journal for example: the only fixed cost is mailing, the production cost <i>per unit</i> goes down the more copies one produces. <br> <br>Now, as members have doubtless noted, it has been some time since any of us received a newsletter in the mail, and the last issue of journal was not printed but only available online via the member's section of the website. The simple fact is that ATypI cannot currently afford to service members with such printed material. It is an ineffiecient waste of scarce resources to print and mail a newsletter to all the members, when the news it contains is delivered in a more timely fashion via the Internet. Realising this, a small group of people within ATypI -- among whom Mark Barratt deserves most thanks -- put a huge effort into the new website. Members are only just beginning to realise and take advantage of the news and announcement sections of the website, and I have great hopes for it. <br> <br>Of course, there are bound to be some members who do not have regular Internet access, and I would like to have options for them to benefit from their membership, but given the limited resources priority must be given to the majority who can and do access the website. We are, if all goes well, at the beginning of a process of renewal, and it is going to take a while to get the association to where it should be, to where it can benefit all members equally and make serious contributions to the type industry as a whole.</p>"
