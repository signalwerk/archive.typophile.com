  html: "<p>Having had the privilege of closely observing and analyzing the frenzied behavior of anonyrats, I predict a certain pattern of behavior: once the specimen becomes generally ostracized because of its rabid, irrational statements, it will quickly proceed to making seemingly rational statements (albeit rational only on a most simplistic, assumptive level), and manipulatively baiting people into resuming dialog. If you're tempted to defend yourself and your views, the specimen will quickly revert to gnawing mode. The specimen will do this until it is bored - there's nothing else to stop it. Furthermore, the specimen does this because anonymity causes the whole process to be an exercise in relieving frustration, as opposed to publicly working towards improvement (not even of the self). The more one humors the specimen through this cyclic process, the more frustration it relieves, so if you feel a humanitarian urge to help a psychologically unfit stranger, please do spend the time. <br> <br>But what if one wants it to stop? There is no magic bullet, so to speak, but ignoring the vermin often works wonderfully, with no active effort required, just some self-discipline. <br> <br>hhp <br></p>"
  html_clean: "<p>Having had the privilege of closely observing and analyzing the frenzied behavior of anonyrats, I predict a certain pattern of behavior: once the specimen becomes generally ostracized because of its rabid, irrational statements, it will quickly proceed to making seemingly rational statements (albeit rational only on a most simplistic, assumptive level), and manipulatively baiting people into resuming dialog. If you're tempted to defend yourself and your views, the specimen will quickly revert to gnawing mode. The specimen will do this until it is bored - there's nothing else to stop it. Furthermore, the specimen does this because anonymity causes the whole process to be an exercise in relieving frustration, as opposed to publicly working towards improvement (not even of the self). The more one humors the specimen through this cyclic process, the more frustration it relieves, so if you feel a humanitarian urge to help a psychologically unfit stranger, please do spend the time. <br> <br>But what if one wants it to stop? There is no magic bullet, so to speak, but ignoring the vermin often works wonderfully, with no active effort required, just some self-discipline. <br> <br>hhp <br></p>"
