    votes: null
    html: "<p>Latin Americans, perhaps they need to contact first their local Country delegate to see how they can built together something locally. The ATypI website say: <br> <br>ATypI Country Delegates produce an annual report on the state of type and typography in their country and facilitate communication and action with other ATypI members (*). They are currently: <br> <br>Argentina Ruben Fontana <br>Brazil Claudio Rocha Franco <br>Mexico Felix Beltran <br> <br>(*) I think, their role is not restricted to members only, locally. So, if they share information to give to ATypI members worldwide, they also have the function to do the reverse, bring locally ATypI Worldwide informations. This last way, is necessary open to non-members, to attrack them one day. <br> <br>If a group of 10 or more, rather than 2 or 3 guys here actually, built something locally with the approval of the country delegate, share info and so on, make a proposal to a lower fee for the complete group, its another possibility to find an good answer. <br> <br>I have a strange idea, but considering the urgent need, why not: What about if this group, share a same free email account, to read and post on the web, the ATypI list? <br> <br>Its better to think about new ideas ourself rather than complain to others who is always more easy. no? <br> <br>Last, but lot least, I thing that the language is a ALSO a strong problem to attrack more members than the just economical side. Its also another reason why their is more fluent English members than everything else.</p>"
