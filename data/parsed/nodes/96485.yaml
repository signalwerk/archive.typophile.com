    html: |-
      <p><em>…the only feedback you can get is subjective, aesthetic guesswork…</em></p>
      <p>Not at all. A stylized image may be complemented by a similarly stylized type, if one can identify the style, which I did in this case as “melted”.</p>
      <p>If you take a sharp typeface and blur it, then adjust the sliders to make it high contrast with no grey, you end up with a melted effect like Ketchupa. (Thermography produces the effect quite literally.)</p>
      <p>If you take a greyscale image of a face, and adjust the sliders to high contrast with no grey, you end up with a melted image like that of the OP.</p>
      <p>I had a go with your avatar and Souvenir Demibold seemed to work quite well, better than Ketchupa—the trick seems to be too relate the B/W proportion and the scale of detail of the typeface with that of the image, and that is not guesswork but a matter of skill and taste.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dean_6661.png"></div><p></p>
