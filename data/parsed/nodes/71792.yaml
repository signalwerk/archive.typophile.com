    <p>I know this has been discussed here before but I'm curious if there are plans to modernize  Typophile's front page? I like having popular and recent posts on view but at the same time, I hate the loading delay, the size and how it doesn't show up at all on iProducts.</p>
    <p>Also, I'd really like to be able to turn off the swear filters as I am not under 10 years old.</p>
    <p>I hope I don't come across as snarky, I'm just wondering if there are plans to change it or is the status quo what Typophile will be in 2011, 2012.</p>
