      <p>A bit more about the inconsistency of being able to open links in new tabs. I do realize that I can ctrl-click some links to open them in new tabs. Or right, click/open in new tab. The inconsistency is frustrating because clicking on links is something that's done unconsciously. I pretty much spend all day with a browser open and I usually nail the control key when I click on links. Even though I visit Typophile often, I still try to ctrl click the links on the front page . . . just because that's the way the rest of the web works. If I'm writing a message and I want to open a new instance of Typophile to check my facts, I often absent mindedly try to right click the logo. A few years ago, yeah, there were a lot of sites that were Flash heavy and you weren't surprised if ctrl-clicking failed. I guess maybe I notice it more because Flash sites are getting rare.  I know this has been discussed before but here we are in the middle of 2010 with the same deal going down, wondering if anyone's taking notice.</p>
      <p>And the censorship has got to go. Really. Why can't that just be turned off? Is it hard coded in the Typophile mainframe or something? Am I on the Disney Channel? C'mon.</p>
