    html: |-
      <p>As you can imagine, Flash has been the key way we attract sponsors who want to show their releases to the type community. </p>
      <p>I'm pleased to tell you we've engaged a Drupal developer to build a non-Flash home page that we expect will render much more quickly. (If you care about the technical details, it's that extra step of pulling the aggregated content out of Drupal, writing an XML file on the fly and loading that XML into the Flash that means longer load times for the home page).</p>
      <p>We're also investigating non-Flash (non SIFR) ways to render the type that meet our sponsors' requirements for the use of their fonts. This update will affect all pages in the site, not just the home page.</p>
      <p>Steven: Regarding design for Apple's iOS. It's not just to support Apple devices - though our traffic logs show a significant amount of iOS traffic. There are more modern ways to display custom type on a page. SIFR has always been a workaround, and finally the web is moving beyond this workaround. (Viva HTML5!)</p>
      <p>Regarding swearing: If you want to add color to a conversation you'll have more impact if you smoked a pipe, or used words like penultimate.</p>
    html_clean: |-
