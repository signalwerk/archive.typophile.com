  html: "<p>I got my hands on a type specimen book from 1889 and liked it alot. One thing confused me though and I was hoping for some help from my dear typophiles. <br> <br>Almost every single '4' was drawn in this fashion(excuse my sloppy modification... but something along the lines of this): <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/3228.gif\" alt=\"sloppy four\"> <br> <br> <br>Notice the angular cut, I can't remember seeing this in any recent design, or any 'traditional' (besides in this very specimen book) typeface for that matter either. 'Regular' 4's are AFAIK either closed or drawn with a cut that is not angular but horizontal. <br> <br>Is this still used today, was it popular before, yaddfa yadda... please shed some light over my neophyte type knowledge. will ya? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"></p>"
  html_clean: "<p>I got my hands on a type specimen book from 1889 and liked it alot. One thing confused me though and I was hoping for some help from my dear typophiles. <br> <br>Almost every single '4' was drawn in this fashion(excuse my sloppy modification... but something along the lines of this): <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/3228.gif\" alt=\"sloppy four\"> <br> <br> <br>Notice the angular cut, I can't remember seeing this in any recent design, or any 'traditional' (besides in this very specimen book) typeface for that matter either. 'Regular' 4's are AFAIK either closed or drawn with a cut that is not angular but horizontal. <br> <br>Is this still used today, was it popular before, yaddfa yadda... please shed some light over my neophyte type knowledge. will ya? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"></p>"
