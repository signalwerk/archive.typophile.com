    html: <p> Tifanny, yeah... that would be a plausible explanation if there were more characters looking like this, but it was limited only to the 4's. <br> <br>Hrant, yes, some of them. Quite a few were bold in their original cuts also. <br> <br>Anyway, I'm not negative about it or anything, I was just surprised that it was so common. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Thanks. </p>
