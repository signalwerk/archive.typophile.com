      <p><em>The problem with doing things for free is that the goodwill and vitality of the originators only lasts so long before burnout. </em></p>
      <p>As a person who has released over 200 free fonts, I would have to agree with Nick's assessment, especially since there are so many unprincipled low-lifes ought there who will steal free work and re-sell it. All the proposed website would do is provide them with more product, And there are clueless morons out there who believe that, since you give your work away, you must be Santa Claus or, at the very least, their personal font monkey, and they can make special requests of you which, of course, you will gladly fulfill. The proposed website would then enlarge the pool of personal font monkeys.</p>
      <p>If the objective is to create a forum in which neophytes can present their work and have it critiqued, then you want to re-invent the wheel: this website does that. If the objective is to create a clearinghouse where the cheap bastards of the world can come and glom onto free stuff, wham-bam-thank-you-ma'am, that's been done, too.</p>
