      <p>I think it's a great idea, of course.  Unfortunately, like Raph, I can't devote significant time to actually creating a site.  I can offer space on tug.org, although I admit the server configuration is rather barebones, since I don't do much for tug.  I'm also happy to pay for a domain name and do dns, although that is the least of the problems, I realize.  If there's other things TUG might be able to do to help, I'm open to suggestions.</p>
      <p>Regarding existing free fonts, I'd just like to mention the <a href="http://tug.org/fonts/" rel="nofollow">fonts page on tug.org</a>, which I wrote to try to consolidate information about free and semifree fonts with TeX support.</p>
      <p>Also, some people may be interested to know that George Williams wrote an <a href="http://tug.org/TUGboat/Articles/tb24-3/williams.pdf" rel="nofollow">article on FontForge</a> which was published in <a href="http://tug.org/TUGboat" rel="nofollow">TUGboat</a>.</p>
      <p>Incidentally, if anyone is interested in working on Raph's huge scan collection which we've uploaded to tug.org, let me know.  Just creating index files for all those many, many images would be a great start in making them more accessible.</p>
      <p>Finally, I should mention that the support for Hrant, Raph and others comes almost entirely from individual member donations.  Memberships and donations are what keep TUG going, so if you have any interest, please consider <a href="http://tug.org/join.html" rel="nofollow">supporting TUG</a>.  (end of commercial; sorry :)</p>
      <p>Happy designing,<br>
      Karl (current TUG president)</p>
