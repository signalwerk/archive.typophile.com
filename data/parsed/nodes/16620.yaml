      <p>If I understand this correctly I think what Raph is pushing for is significantly different than the 'old' model for releasing free fonts. </p>
      <p>Opensource development of software has had a huge success in many areas, most obviously on the internet. This site I believe runs on Drupal, Apache and MySql (?) All of these have been developed as open source for many years without being bled dry by the 'cheap bastards'. <strong>Perhaps there should be more discussion of how the opensource model fits typeface development. </strong></p>
      <p>One of the biggest challenges to fonts being opensourced is perhaps that <em>typefaces</em> as opposed to fonts are primarily a visual design. Visual designs are traditionally more personal and have a stronger emotional hold on their creators than 'invisible' software. I know this would true of myself—while I'm very attracted to the ideas, when I've been thinking about Raph suggestions, the 'designer' side of me has been saying 'but would you really let anyone do anything with <em>your</em> creation?'. Do designers have too big of an ego for this work? (This is a serious question, speaking as a start-up designer with a (probably misguided) ego/pride in my work.)</p>
      <p>How do other opensource communities support their main contributers? I understand that it can be through commercial sponsorship, this seems to happening to some degree allready with type design. Sometimes it is through 'kudos', people starting out can make a name for themselves if they contribute good work, which could then lead to work on commercial projects. If there was a 'professionally' run organisation for promoting quality opensource fonts could this serve as a launch pad for talented novice type designers? Sometimes the originators of the software sell additional services or extensions to people who are already using their work, perhaps it could lead to work creating custom versions of the fonts?</p>
      <p>Are any of these senarios realistic? I've only really just dabbled in both opensource software and type design, so I'm not really able to offer much besides questions.</p>
      <p>It would be fantastic to have a high quality website to point people to when they realise Times New Roman isn't the only typeface and want to learn about and use high quality type, where they aren't intimidated by (the justifiable) £££ price tags. If there could be some sort of centralised 'opensource foundry' to present, promote and distribute the <em>good</em> opensource fonts, I'd hope it would quickly find it's place along side commercial foundries, not competing with them.</p>
      <p>Ed.</p>
