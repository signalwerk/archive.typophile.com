    html: <p>Raph, great idea. It would be a great way to educate people about the time, effort and skill that goes into creating a truly usable typeface as well. They will come for the free fonts, but will learn something along the way. Also, since you will be appealing both to typophiles and to the general public, including graphic designers such as myself, it will be important that the site have visual appeal, and shouldn't bombard people with technical jargon right off the bat.</p>
