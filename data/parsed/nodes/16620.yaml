      <p><em>raph — Great idea. What happened? </em></p>
      <p>I have been very busy, and am unsure if we have bumped into each other on this topic in another thread.</p>
      <p>At this time Raph and I are working, and openly accepting all other interested individuals, to a project called Typosium. This is designed to be a wiki-like factbase for font releases, a magazine focusing on reviews and analysis, and, while not a font host, an integrated place where you can get to the free or proprietary product. I am specifically bringing over an interactive user/expert paradigm from another media-related project.</p>
      <p>Typosium Manifesto<br>
      <a href="http://typosium.org/deptofplanning/index.php?topic=2.0" title="http://typosium.org/deptofplanning/index.php?topic=2.0">http://typosium.org/deptofplanning/index.php?topic=2.0</a></p>
      <p>Currently, we are discussing organizational structure, and how to create a standard for the editorial content.</p>
