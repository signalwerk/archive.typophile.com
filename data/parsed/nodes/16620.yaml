      <p><em>I’m likin’ it.</em></p>
      <p>Excellent. I know it is vaporware at this point, but I'm motivated because it is exactly the type of site I would love to have in my bookmark short list, but can't find yet. I welcome you to come throw your 2¢ in, as I imagine you will have constructive ideas before and after launch, particularly based on your familiarity with widely divergent type styles and type culture. Well, that and I encourage everyone to join.</p>
      <p><em>Free Fonts + Free Tools?!</em></p>
      <p>Tho' I'm limited to a machine translation, which is particularly weak in converting that script, I don't think those are free like "freedom". That is what the OFLib, Free Software Foundation, and such are all about. A lot of confusion exists in the free software community because common English uses free to mean "gratis" or "liberty". In this case those in the movement are referring to the freedom of concepts like math and logic, and thusly, programs. And for now that is interpreted as releasing type under special licenses, like the OFL, GPL or such.</p>
