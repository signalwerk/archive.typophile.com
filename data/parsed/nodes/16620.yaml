      <p>raph — Great idea. What happened? Do you (or others) still have plans for a platform (website) that (a) is a handsomely styled and logically structured download archive for free high quality fonts, with advanced testing tools (acting as an Open Foundry); (b) is a discussion and collaboration forum to allow teams of developers to design, critique, edit, code, build, update and manage free fonts?</p>
      <p>As for the quality benchmarking, I think user voting is but one approach, certainly valid, on the condition that votes by accredited users should have more weight. Additionally, and not in the least, there should be a set of minimum quality requirements, such as the file format (e.g. Type 1 being low, OpenType high grade), encoding (mapping), number of glyphs and multilingual support (i.e. extended glyph sets), the availability of small caps, oldstyle figures and ligatures, a minimum set of layout features &amp;c. A grade of sets is also possible, ranking Standard to More-than-Pro fonts.</p>
      <p>If you still have plans, you can count on me. I'd happily post OpenType feature code, help with designing glyphs, and supply documentation regarding historical, traditional use of type.</p>
