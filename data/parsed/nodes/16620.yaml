    <p>Quite a number of things are happening now in the world of free fonts. I've been tossing around ideas in my head for a website to foster the development of fonts to be released under licenses compatible with free software distribution (as opposed to merely "freeware" fonts, which is much less interesting). In this post, I will set down my vision for what such a site might look like.</p>
    <p>I'm posting this on typophile so I can get feedback from the typographic community, and am also inviting people from the free software world to weigh in, as well. As such, there will probably be some introductions to be made, and I won't be surprised if some controversy erupts as well.</p>
    <p><strong>What's been happening?</strong></p>
    <p>For those of you who have been following the free font scene closely, this will be old news, but there's been quite a lot of activity I want to briefly summarize.</p>
    <ul>
    <li>The TeX User Group <a href="http://tug.org/tc/devfund/" rel="nofollow">Development   Fund</a> has sponsored the completion of two font projects: Hrant's   Baskerville TMF, and my Inconsolata.
    </li><li>SIL has released <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a>,   an attractive font with good multilingual support, under their new   OFL license.
    </li><li>The Creative Commons project has hired <a href="http://creativecommons.org/about/people#53" rel="nofollow">Jon Phillips</a>,   someone with a longtime interest in both free software (notably, the Inkscape   project) and graphic design.
    </li><li>The tools available in the free software world have been steadily   improving. For example, <a href="http://fontforge.sourceforge.net/" rel="nofollow">FontForge</a>, while   nowhere nearly as polished as FontLab or Fontographer, has matured   to the point where it is definitely usable for creating real fonts.
    </li></ul>
    <p>All of these developments bode well for the future of free fonts.</p>
    <p><strong>What would a free font site do?</strong></p>
    <p>While there is a lot of activity, and much in the way of existing infrastructure (including typophile itself), there are several holes that I believe a new site could fill.</p>
    <p>First and foremost, there is currently no site that presents free fonts well. There is nothing for free fonts like the trial setting features of online font shops. Doing something like the mudTyper at <a href="http://www.vllg.com/fonts/" rel="nofollow">vllg.com</a> would be very exciting, and, since the fonts are free, there needn't be any stipple background or other such encumbrances.</p>
    <p>A person looking for good free fonts pretty much has to go digging, and that means sorting through a great deal of crap. The various "thousands of free fonts" sites don't do much to help with that.</p>
    <p>Indeed, the major theme for my ideal site would be quality. Not just abundance (millions of fonts!) or freeness, but quality. When a person posts a really good font, it should be celebrated, which of course will also help motivate people to contribute.</p>
    <p>I think an emphasis on quality would be a benefit to the entire font community. There are very, very few top-quality free fonts, and I'm sure this will continue to be the case for a long time. People who are looking for quality can always choose to pay for it. My ideal site would gently encourage people to buy fonts if they find no free font that meets their needs, with an emphasis on independent foundries. Note that this philosophy is fairly different that of many free software proponents, the most radical of whom encourage people to use no non-free software at all.</p>
    <p>Many, if not most, developers of free fonts will be people who are not yet very skilled at the craft of font design, but are trying to learn. My ideal site would invite people to post their work, and provide critique, encouragement, and feedback. This role of the proposed site overlaps the critique forums on typophile considerably, and so should perhaps not be separate. I am continually impressed by the level of discussion on the typophile forums. The <a href="http://typophile.com/node/16550" rel="nofollow">Cyrillic uc/lc discussion</a> is an excellent recent example of the kind of feedback that would be incredibly useful to aspiring, as well as experienced, font developers.</p>
    <p><strong>Fine-grained collaboration</strong></p>
    <p>One of the great strengths of the free approach is the way it enables collaboration. If I see something I want to improve, there are as few barriers as possible standing in my way. Similarly, I don't have to commit to a huge project to make an improvement. I can improve a Wiki page in as small a way as correcting a single spelling typo, something that might take ten seconds.</p>
    <p>I believe this approach to fine-grained collaboration can also work well in the context of font development. We already see something much like it with people extending existing fonts to cover more scripts, sometimes (as in the <a href="http://www.nongnu.org/freefont/" rel="nofollow">freefont</a> project) but not always above-board. Another tantalizing glimpse at how fine-grained collaboration might work is the new 'g' for Matrix from the <a href="http://www.typophile.com/node/14378" rel="nofollow">Freestyle Remix Challenge</a> thread.</p>
    <p>Fine-grained collaboration can also be good for pedagogy. The craft of font design has intimidatingly many facets. Learners may well find it easier to start with just one aspect, such as diacritics or creation of small caps. Someone else might decide to tackle spacing (which, as we know, is one of the major stumbling blocks for beginners). Again, an improvement may be as minor as a single tweak to a kern pair or side bearing, but with a large and active user community, these improvements would add up.</p>
    <p>There are concrete ways in which a font development website can foster such fine-grained collaboration. Primarily, it can treat a font as something like a Wiki or version-controlled repository. If there are multiple versions of the same glyph, it should present the variants to the user, and ask for a vote. To be really ambitious, the site could dynamically synthesize an .otf file based on choices entered on the Web form (on the backend, this would be relatively easy to achieve using the batch scripting capabilities of FontForge).</p>
    <p><strong>Other resources</strong></p>
    <p>The Creative Commons philosophy includes tending to the body of public domain work in existence, and making it readily available. Fortunately, due to the relatively long lifetimes of fonts as creative works, we have a fantastic array of public domain materials available. I've put a small archive of scans from ATF specimen books <a href="http://levien.com/type/" rel="nofollow">online</a> (and TUG is generously <a href="http://tug.org/levienfonts/" rel="nofollow">hosting</a> the multigigabyte raw archive of 2400 dpi scans). If there is interest, there is plenty more where that came from. Among other things, my older son can be hired to do some scanning. My experience is that digitizing classics drawn by long-dead masters is a great learning experience.</p>
    <p>The world of free fonts is intimately connected to the world of free software tools for publishing. Of these, TeX is the great granddaddy of them all, and is still actively used, primarily for mathematics work. One of the reasons why TeX rocks out for math is that it natively supports optical scaling, so subscripts and superscripts don't look spindly and anemic like they do in almost all other math systems. I'd love to see more optically scaled fonts available besides Computer Modern, a fairly poor face by typography standards.</p>
    <p>There are also a number of free GUI page layout projects in the works, of which <a href="http://www.scribus.org.uk/" rel="nofollow">Scribus</a> is probably the most polished. They're constantly improving their support for OpenType and typographic refinements. A number of good things could come from collaboration with this project, not the least of which is a set of kick-ass good default style sheets.</p>
    <p>I have to remain a bit vague and secretive about this because I've been too busy to file the patent yet, but I expect some cool things to happen in the space of free tools for drawing fonts in the next few months. These tools, I think, will be especially useful to amateurs who have not climbed the arduous learning curve of drawing well with Beziers.</p>
    <p><strong>Summary</strong></p>
    <p>My ideal site would encourage development of fonts for distribution under free software licenses. It would emphasize quality, especially aspiring font designers who want to learn to do better work. It would foster fine-grained collaboration, so that fonts can be improved incrementally, both in quality and in script coverage.</p>
    <p>Building such a site will require a nontrivial amount of resources. Much as it appeals to me, I'm nowhere near in a position to be able to launch it myself. However, there may well be enough tappable energy to make it happen. Certainly, there are lots of people and organizations with an interest in free fonts.</p>
    <p>Is a site along the lines I've presented worthwhile? Would you participate as a developer? As a user? Which organizations, if any, are prepared to throw their weight behind such a project? Who might be willing to put their own time into its development?</p>
