      <p>I've wanted a Free/Libra Font portal for some time now.  A few years ago I tried to get a bunch of fonts donated to the <a href="http://www.gnome.org/" rel="nofollow">Gnome</a> project; we did get Bitstream Vera, and we had offers of quite a few more, but I felt that we needed to do rather more.</p>
      <p>I wanted to see the font chooser display font copyright information (or at least the comment field from fonts) and extract URIs from it for a "visit the Font Web Site" button... and maybe also a "Get more fonts' button that would take you to a font portal.</p>
      <p>I don't think there is a good business model for Free fonts right now.  It's not at all the same as Free software, partly because the work/percieved-value ratio is very different, and of course also because people outside the graphic design and art communities tend not to value type and design.</p>
      <p>As we start to get more software on the GNU/Linux[tm] platform that caters to designers (e.g. inkscape), perhaps we'll start to attract some more people who will create demand for more polished fonts and font software.  I don't just mean FontForge and other tools for font designers: try <em>installing</em> a font on Linux sone day!  Often you can drag it into <code>~/.fonts/</code> but there's no good user interface for inspecting an uninstalled font, nor a way to deactivate a font without removing it.</p>
      <p>So I think we need some more infrastructure.  I think what's needed is a combination of raising awareness of typography (this is why I gave a talk on typography at Guadec, for example, explaining how a large part of typography and graphic design involves the human perception system and not just arbitrary "creative" decisions that engineers often despise),and at the same time as raising awareness, providing tools.</p>
      <p>A portal site for users of Free software should not, I think, exclude links to commercial fonts, since, as I said, I don't believe we have a business model for open source font designers to make a living and pay for food and clean socks.  Commercial sponsors of typefaces (e.g. La Monde) generally don't want the fonts being freely distributed and weakening their brand.</p>
      <p>I did speak with Richard Stallman about a GNU Font Licence and/or font portal some time ago, and he sounded at least reasonably positive.  Today I think the SIL Open Font Licence (er, License) would probably be very satisfactory.</p>
      <p>--<br>
      <a href="http://www.holoweb.net/%7Eliam/" rel="nofollow">Ankh on the Web</a><br>
      <a href="http://fromoldbooks.org/" rel="nofollow">Words and pictures from old books</a></p>
