    html: |-
      <p>Well, if your font has [an option for] monowidth numerals, the Florin should have that width too, which sort of nicely constrains you. Then it's a matter of taking into account which side of a numeral it might abut against, with the other side being almost certainly a blank. But a quick search on Google* for "ƒ50", "ƒ 50", "50ƒ" and "50 ƒ" seems to show that although the prefix position is more common -and as far as I know the standard- the suffix position cannot be ignored, because we're here to make settings look good and work well, not to try to dictate usage of language; this is by looking at the number of hits for each.** So I'd say you have to mind both sides (but really with numerals only). Think kerning.</p>
      <p>* Which also reveals some interesting indepedent uses of the Florin!</p>
      <p>** I actually use Google for spellchecking.</p>
      <p>My middle initial stands for Hratch, my father. And my son's name is Hrad.<br>
      The root "hoor" means "fire" in Armenian. But they're nothing like me.</p>
      <p>hhp</p>
