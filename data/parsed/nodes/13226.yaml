      <p>The florin was used to denote the Dutch Guilder ("gulden").<br>
      Former Dutch colony Surinam switched from the Surinam Guilder to the Surinam Dollar.<br>
      The Dutch Antilles use the Netherlands Antillian Guilder (ANG). That's still called a florin according to<br>
      <a href="http://www.xe.com/iso4217.htm" title="http://www.xe.com/iso4217.htm">http://www.xe.com/iso4217.htm</a><br>
      where you may also note that no other currency nowadays uses florin as a denomination. (Though they could use the symbol...).</p>
