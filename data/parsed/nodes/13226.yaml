      <p>Historical texts may still refer to florins. It is still usefull in text. For instance: "When I was a child, a pack of gum cost just 2 florins. Now I see the same candy for 75 cents!"</p>
      <p>There are lots of reasons to need to print the florin symbol. It has just has fallen out of contemporary use…</p>
      <p>In Germany, when someone wants to imply how expensive something is, they say houw much it would have cost in Deutsche Marks (2 DM = 1 Euro), i.e., "You can afford that car! It cost 70,000 Marks!"</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
