      <p>I guess I'm a little late coming to this party, but I think the font which has been used for DG "The Twilight of the Gods" is in fact - Excelsior Sans.<br>
      Grab a copy from here:<br>
      <a href="http://www.dafont.com/excelsior-sans.font" title="http://www.dafont.com/excelsior-sans.font">http://www.dafont.com/excelsior-sans.font</a><br>
      Please be aware that this font is seriously lacking in the glyph and diacritical department - see attached example - no umlaut available, but should be no problem to anyone with access to font chopping software.<br>
      Warp factor 6, Mr Sulu. Mmm... maybe not!<br>
      Hope this helps anyone else looking for this in future.<br>
      Check sample below.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/EXCELSIOR_SANS_4120.jpg"></div><p></p>
