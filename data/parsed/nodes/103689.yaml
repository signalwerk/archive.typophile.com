    html: |-
      <p>Thanks. Interesting. Horizon is a sans squared bold weight with a somewhat similar discordant effect to "DG Ring" but is otherwise different.  Particularly in Horizon's use of angled cross strokes.<br>
      I opened Horizon in Fontlab and changed some of the cross stokes to horizontal and the result was pretty similar to "DG Ring."<br>
      I wonder if the Bitsteam staff designers who created Horizon in 1992 also created "DG Ring"? Or did the DG designers edit Horizon?<br>
      Anyway, I wonder if the horizontal cross stroke version has been seen anywhere other than DG material, and if there is a name for it.<br>
      Don</p>
