    <p>This squared sans serif has me stumped!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SansSquared@66_4663.jpg"></div><br>
    Its from the booklets packaged with Deutsche Grammophon's DVD presentation of Robert Lepage's Wagner Ring at the Metropolitan Opera in 2011-12.<br>
    Among the blind alleys I followed were: <a href="http://www.myfonts.com/search/tag%3A%28sans+squarish%29/fonts/" rel="nofollow">fonts with a sans+squarish tag at MyFonts</a>,  <a href="http://typophile.com/search/node/squared%20sans" title="http://typophile.com/search/node/squared%20sans">http://typophile.com/search/node/squared%20sans</a>, and a fascinating discussion of The Mystery of Steile Futura <a href="http://typophile.com/node/18227" title="http://typophile.com/node/18227">http://typophile.com/node/18227</a>.<br>
    So what am I missing?<br>
    Don<p></p>
