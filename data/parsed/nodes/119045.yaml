    html: <p>According to Luc Devroye, that font has been revived by Ralph Unger as <a href="http://www.identifont.com/find?font=trybuna&amp;q=Go" rel="nofollow">Trybuna</a></p>
    html_clean: <p>According to Luc Devroye, that font has been revived by Ralph Unger as <a href="http://www.identifont.com/find?font=trybuna&amp;q=Go" rel="nofollow">Trybuna</a></p>
  - id: 586786
    user: 217867
    date: 2014-08-28T13:39:00
    date_raw: 28 Aug 2014 — 1:39pm
    votes: null
    html: |-
      <p>Thank you, <strong>Michel</strong>! Looks like I can download the font from e.g. <a class="freelinking external" href="http://www.myfonts.com/fonts/rmu/trybuna/" rel="nofollow">myfonts.com</a>, though not directly through <a class="freelinking external" href="http://www.dtp-studio-unger.de/fontdesign.html" rel="nofollow">Ralph's website</a>. Indeed, Trybuna looks <em>very</em> close to what's on that text page!</p>
      <p>The only difference is in the German character ß which I like better in its "original" printed form :)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/trybuna-sz_6298.jpg"></div><p></p>
      <p>According to an email from Ralph: "es ist einfach ein typographisches Update von mir, da sich die Originalform des „sz“ nach der damaligen „Mode“ richtete." (That [the different ß] was a typographic update I made, because the original form of the „sz“ conformed to the „fashion“ of that time.)</p>
