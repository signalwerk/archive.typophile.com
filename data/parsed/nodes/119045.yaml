    <p>The following is a photograph of the first page of “Willhelm Tell,” a play by Friedrich Schiller. The book was printed by Verlag (publishing house) Philipp Reclam jun. Leipzig in 1970. The text typeface was called <em>Liberta Antiqua</em>.</p>
    <p>I am curious if there are digitizations of this typeface. Or, if not, which typeface would be a good approximation of it.</p>
    <p>Thanks :-)</p><div class="imageWrap"><img src="http://typophile.com/files/liberta-antiqua_3425.jpg"></div><p></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
