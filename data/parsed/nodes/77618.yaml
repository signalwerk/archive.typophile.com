      <p>I believe there is indeed a good chance that, yes, due to both Hebrew and Arabic being normally written so that individual letters are considerably less legible (or certain pairs of letters are much harder to distinguish, to be specific) than with the Latin alphabet, it may well be easier to experimentally detect the contribution of recognizing the shape of a word as a whole in reading those languages.</p>
      <p>The skepticism of other posters about being able to determine what is really going on when people read through the kind of clumsy experimental techniques that are available is justified, but, on the other hand, that is not an excuse for not doing what we can to at least begin to have hard evidence and quantitative measures which can be a solid foundation for some forms of progress.</p>
      <p>Not everything can be made a science instead of an art. But those things that have been changed from craft to engineering have yielded great progress. So if even a sliver of the type designer's art can be aided by science, it could well be worthwhile.</p>
