      <p>David [B]: below is a riff on what you wrote.</p>
      <p>A letter is a combination of 1) positive shapes built up from black strokes, and 2) white or negative space. The white space is the space around and inside the letter and the negative space, the space between the strokes. The space around the letter is background. When the negative space is the space between adjacent or opposing strokes — that is, the space inside the letter where the background shows through —, it can have a shape, or be given form. Negative or white space becomes evoked form with a more or less tractable shape. Designers of letters attend to both: for the designer a letter is two shapes. Both the black and the white are information for vision. Perceptual psychologists and cognitive scientists tend to forget about the white.</p>
      <p>A word is exponentially more complex. On the one hand it is — at least in alphabetic scripts — an ordered combination of letters. On another level, it is an aggregation of the shapes, the more elemental whites, and the simple-to-complex stroke-constituted blacks. Within the word the combination of letters makes a second set of whites — between-letter whites. These whites appear to be less shaped and less informative. Yet conventional craft wisdom wants <em>all</em> the whites to be ‘in synch’ and it wants the blacks to be well-coordinated according to their proportions (the implementation of Cartesian space), weights, compositional logic (construction) and ‘swept-object’ logic (contrast). The total wordfrom is the totality of all this: the totality of in synch whites and the coordinated blacks. </p>
      <p>Notan-think wants the black and white to be completely equipotent. Designers should at least think of how they relate. (This has to do with ‘colour.’)</p>
      <p>All of these things interface with sight. A functional ontology of reading has to go hand in hand with a well-developed theory of writing. Currently they don’t. For example, arranging the whites so they are in synch, and tuning the blacks so they are well-coordinated affects ‘phase’ alignment. Arguably this will have an impact on processing routines. It will bias the system toward taking a more holistic or gestalt approach. But what that means in neural architecture and information processing terms is unclear. So the question becomes again, “Is it possible to translate an inchoate notion of holistic or gestalt processing into a set of more precisely specified possibilities based on the characteristics of information processing?”</p>
      <p>I said both the black and the white are information for vision. By Stanislas Dehaene’s logic the decomposition of words into their component letters and the increase in phonemic awareness has to have something to do with the adaption of certain parts of the lateral geniculate nucleus to reading. I’ll bet ‘reading’ the whites, and the neural entrenchment of a decomposition of the blacks into role-units (through writing!) does too.</p>
