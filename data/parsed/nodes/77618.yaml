      <p>David: <em>I think it's just simply much more important not to fool around with word shape than pretty much anything else.</em></p>
      <p>What you imply by ‘word shape’, though, based on your comments, is something very different from word envelope as illustrated by Rolf, Hochuli et al. You are talking about the relationship of letters and how they succeed or fail to cohere as what I'll call wordforms, since the meaning of ‘word shape’ is ambiguous. This is a cognate of letterforms and, like letterforms, wordforms are composed of the relationship of positive and negative shapes, and it has to do, as you say, with how type is used (composed). The obvious conclusion to draw is that any typeface <em>optimally</em> produces wordforms at a specific size, track, resolution, etc., and may only acceptably produce wordforms at some variations of those factors, and not at all at others.</p>
