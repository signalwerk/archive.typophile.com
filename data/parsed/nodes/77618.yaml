      <p><em>One of the fundamental, no... foundational principles of readability design, in the realm of optical trickery, is the modest to excessive exaggeration of the lowercase ht. relative to all other hts.</em></p>
      <p>IMO this is a "legibility" requirement.<br>
      Consider this model of the reading process:</p>
      <p>1. Sentence structure (purely textual) suggests a set of options for the upcoming word.<br>
      2. Word shape narrows the field.<br>
      3. However, at small size, legibility is more important to fine tune the exact coding, as more acuity is needed to distinguish letters precisely, for instance, differentiating between "e", "a" and "s". Therefore x ht is made larger for small text.</p>
