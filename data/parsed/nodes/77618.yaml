    html: <p>White space not enclosed by the glyph takes on great importance when glyphs have neighbors.  The resulting shape of the interlocking white spaces created when set together is every bit as descriptive of the letter-word conglomeration as the black that it brings to life. You cannot make a form without it being affected by the shape it makes in its surroundings. To call this a "word shape" for want of a better term is okay, but to then redefine "wordshape" as something loosely encompassing the blurred outer edge of the word, is a different story.  If we need a term for the lassoed shape of the word without consideration of all the internal and external whitespace, then let's create 2 separate terms.  Granted, some negative shapes do less to activate the figure than others but this, perhaps, aids in reading and helps us decode the forms.  I don't know this to be true but I would hate to throw out avenues of investigation just to be neat and tidy with terminology.  We have a tendency to spend more time arguing about the exact classification of pigeon holes than we do looking at the migrations of birds.</p>
