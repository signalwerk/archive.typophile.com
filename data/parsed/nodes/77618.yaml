      <p>"I can't honestly recall any colleagues claiming to design for word shape, in the sense of word envelope."</p>
      <p>I quite agree. I know I tend to design for letterfit with left and right neighbor.  Typically, the same kind of groupings into classes we use for kerning, tend to yield what I will call "shape groups" for fitting and sidebearings.  I, and others, make necklaces of glyphs that put each glyph in position with all of its potential neighbors as well as control characters to check fit.  After coming to some reasonable satisfaction with this process, long texts of various languages are set and printed at various sizes looking for fit, color, readability, and even aesthetics. This is not just a word outline, it is permutations of all players to seek problems out and solve them.</p>
