      <p>"“Our comprehension of the text we read is based largely on the tops of lowercase letters, the bottom halves consisting mostly of 'legs and feet.' "</p>
      <p>'...and only believe some of what you read'</p>
      <p>Rolf Rehe's1974 book "Typography, How to Make it Most Legible" [the one with the crashing over-tracked Helvetica cover] became the mantra of many design educators. Page 35 shows a  word-shape example to describe how lowercase reads better than uppercase. There were other  studies at that period in time professing the "Top half of words" theory.  This is the period in time that spawned most of today's design professors, therefore the spreaders of the true WORD on what is good typography to today's young designers. Sadly, some of these theories which were tested to some degree, were quickly elevated to the level of "GOSPEL TRUTH" in the eyes of adjunct professors seeking tenure on the grounds that they were actually using Science to teach design. I guess some folks, including Mr Felici, still give these theories more ink than they deserve. When social scientists measured for the density of information in upper vs lower halves of words, they found an interesting tidbit of information which may help other scientists explain reading in the future.  It was the design education community of that era that went a bit overboard with it, not the scientists. In practical use, cutting off the bottom half does less damage than cutting off the top half but it still Does Damage.  It is like saying most human activity and sustaining organs are in the the top half of the body.  Cuttoff the head or thorax and death swiftly follows.  Cuttoff the lower half and you will still live to be a happy paraplegic with a colostomy bag and a hampered sex life. Design professors used this kind of thing as a parlor trick to show they read the research.</p>
