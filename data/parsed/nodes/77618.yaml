      <p>@kevlar:<br>
      <cite>"I can't honestly recall any colleagues claiming to design for word shape, in the sense of word envelope."</cite></p>
      <p><cite>That is fantastic if most typographers and type designers don't actually believe in simple word shape, then we’re in agreement.</cite></p>
      <p>As three experts have already noted above, there's a distinction between typographers and type designers with respect to this issue. Typographers do believe in word shape to some extent, which is why they prefer using normal upper and lower case to ALL CAPS. But there isn't much that type designers <em>can</em> do about word shape; after designing each individual letter to be beautiful, and then ensuring that the letters look like they belong together, and then adjusting for the right side-to-side fit, there's not much they can do for more distant concerns.</p>
      <p>However, there is one respect in which this isn't entirely true.</p>
      <p>Type designers - at least if they're trying to revive Jenson or Aldus - do tend to try for generous ascenders and descenders. It's commercial considerations, not aesthetic ones, that led to the stubby descenders of Caslon 540, Goudy Old Style, and even Times New Roman.</p>
      <p>Of course, there are also typefaces in which the x-height is very small for a deliberate effect in a display face.</p>
      <p>But the ascender and descender height of a classic face (Cloister Lightface, Bembo, Poliphilus, Caslon Old Style, Garamond) is, I would think, generally regarded as optimal for readability provided a suitable point size of type is used.</p>
      <p>For applications where smaller point sizes are used, well, you can't have readability if you don't have legibility: the two are not the same, but legibility is a prerequisite for readability. Definitely at 8 point and below, and even at, say, 10 point (and the default settings on computers are such that "12 point" is really often "10 1/2 point, with 1 1/2 point leading" - I was quoting foundry type sizes, not what you get these days) you do need a large x-height. But that's a situation where one is struggling for legibility in the face of severe constraints, not one in which optimal readability is possible of achievement.</p>
