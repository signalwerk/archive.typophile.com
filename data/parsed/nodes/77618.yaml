      <p>I developed the word recognition talk and paper because the people on my team at Microsoft (as well as other typographers and type designers) told me that they were designing for word shape. Here is a recent quote from p.23 of Jost Hochuli’s 2008 edition of Detail in typography:</p>
      <p><em>“Given that an adult reader’s eye registers not individual letters but whole words, or parts of them, it is not surprising that words play a particularly important role in the reading process. With an easily readable typeface the individual letters are always designed with regard to their impact as parts of a word. While being clearly differentiated, they must be capable of fitting together as harmoniously as possible into whole words.”</em></p>
