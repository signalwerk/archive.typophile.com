      <p>Thanks David H. for summary of the paper on Hebrew vs English reading. It makes sense that Hebrew readers process via a common root path, since the roots are so much of an organizing principle in Hebrew. In English we have such a mixture of sources we are most often unaware of roots. I don't know whether this implies anything with regard to the issue of letter recognition first or not. That's because in Hebrew root and meaning usually, but not always go together. </p>
      <p>David B., Peter's theory does not privilege extenders over other letter features, and their length is not the main thing. This idea that whole word pattern is just a matter of ascenders and descenders was an oversimplification of the idea of word pattern. In Peter's view it was a straw man used to dismiss a promising line of research, which he has taken up.</p>
