      <p>I wouldn't equate any general understanding amongst typographers that people read word shapes with the way that type designers work.</p>
      <p>Do type designers ignore the idea that people read word shapes, even if we happen to believe it's true? I would say so. There is a gulf between theory and practice. I mean, how would a type designer put the "word shape" theory into practice?</p>
      <p>H&amp;FJ give some indication of not having done so in their description of the nonetheless very word-shapey Mercury, by not mentioning word-shape readability benefits, leading me to believe that it was not an explicit criterion in the type's design, whereas these other criteria which led to short capitals with much higher ascenders are cited: "…[allowing ascenders] to help define the lower case", "…more compact capitals that help economize on space", "…a useful advantage for older typesetting systems that aren’t equipped to handle true small caps", and "…look[ing] less conspicuous on the printed page." --</p>
      <blockquote><p><strong>Maximal Lowercase</strong><br>
      Every typeface designed for small sizes begins with a large x-height, which helps a font feel bigger than it really is. Where Mercury differs from most newspaper faces is in its ascenders and descenders: many fonts truncate these forms, rather than allowing their shapes to help define the lowercase.</p>
      <p><strong>Minimal Caps</strong><br>
      Mercury uncouples the height of the ascenders from the size of the caps, and introduces more compact capitals that help economize on space. As an added benefit, abbreviations set in ALL CAPS merge more seamlessly with the text, a useful advantage for older typesetting systems that aren’t equipped to handle true small caps.</p>
      <p><strong>Efficient Widths</strong><br>
      Even many classic newspaper faces have sprawling capitals (Times Roman, despite its popularity, has some of the worst.) Mercury’s capitals have been made as discreet as possible in order to look less conspicuous on the printed page — an especially important feature when setting news stories that are filled with proper names.</p></blockquote>
      <p>I would suspect that if word-shape had been the principle upon which a type was designed, then it would have been mentioned in promotional material and type histories -- but I have never come across any such thing.</p>
      <p>If we accept that prioritizing word shape leads to small x-height, then ironically, or perhaps paradoxically, the claim of "large x-height for superior readability" is usually made, if any readability claims relative at all to word shape are made, and I have never seen a face described as "small x-height for superior readability".</p>
