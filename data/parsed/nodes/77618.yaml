      <p>Peter: <em>Deheane adds, “In the hope of improving readability, typographers intentionally designed fonts that created the most distinctive visual “boumas.” His source for this observation is — wouldn't you know it — Kevin Larson's 2004 “The Science of Word Recognition.”</em></p>
      <p>Kevin: <em>I developed the word recognition talk and paper because the people on my team at Microsoft (as well as other typographers and type designers) told me that they were designing for word shape.</em></p>
      <p>Type designers have historically made a lot of more or less voodoo claims about how they work -- e.g. 'designing the white not the black' --, especially then they are to be quoted in print. The disconnect between how people claim to work, or how they think they work, and how they are actually observed to work can be considerable.</p>
      <p>Words are the primary context of letters, so of course when we design letters we look at them in words, and we adjust them to produce words that look good. We also look at them in sentences, and paragraphs, and pages of text, because these are also contexts of letters, and we want the typeface to look good in all these contexts, and different contexts reveal different things about the design. For instance, the slightly-too-heavy left diagonal on a letter v might not reveal itself when looking at some individual words, but will reveal itself in page tests.</p>
      <p>I can't honestly recall any colleagues claiming to design for word <em>shape,</em> in the sense of word envelope. Rather, I reckon we might reasonably claim to design for words, in Peter's excellent phrase, as ‘lettered things’. And by the same token we design for sentences, for paragraphs, for pages....</p>
    html_clean: |-
