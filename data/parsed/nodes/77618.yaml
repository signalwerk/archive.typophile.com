      <p>Nick, for your #2, I'd say <em>the compilation of ensemble or summary statistics in parafoveal vision</em> narrows the field. Both terms occur in the perceptual psychophysical literature on object perception and crowding, and in some cases reading. Summary statistics capture more than information about the outer contour of the word, but not as much or as accurately as the information made available by ‘sharp-rendering’ in foveal vision. This is shown by a juxtaposition of the tests that Kevin recruits to argue that “letters are used,” with tests that show words in parafoveal vision are susceptible to “silent substitution” [Denis Pelli]. But in the case of words, summary statistics render precise identity indeterminate.</p>
      <p>In relation to your #3, I’d drop the word ‘legibility’ and say <em>access to role-unit level information</em> is important to fine tune the exact coding. This is as true at normal sizes, where acuity is not a problem, as at small sizes. At small sizes, it's not that more acuity is needed, but that there are thresholds to discrimination affordance, which can to some degree be addressed by fiddling with x-height.</p>
      <p>Role-unit level information is letter-part level information, that is information about the shapes of counters and individual strokes.</p>
