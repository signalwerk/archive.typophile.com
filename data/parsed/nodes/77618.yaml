      <p>Notan-think wants the black and white to be completely equipotent. Designers should at least think of how they relate. (This has to do with ‘colour.’)</p>
      <p>All of these things interface with sight. A functional ontology of reading has to go hand in hand with a well-developed theory of writing. Currently they don’t. For example, arranging the whites so they are in synch, and tuning the blacks so they are well-coordinated affects ‘phase’ alignment. Arguably this will have an impact on processing routines. It will bias the system toward taking a more holistic or gestalt approach. But what that means in neural architecture and information processing terms is unclear. So the question becomes again, “Is it possible to translate an inchoate notion of holistic or gestalt processing into a set of more precisely specified possibilities based on the characteristics of information processing?”</p>
      <p>I said both the black and the white are information for vision. By Stanislas Dehaene’s logic the decomposition of words into their component letters and the increase in phonemic awareness has to have something to do with the adaption of certain parts of the lateral geniculate nucleus to reading. I’ll bet ‘reading’ the whites, and the neural entrenchment of a decomposition of the blacks into role-units (through writing!) does too.</p>
