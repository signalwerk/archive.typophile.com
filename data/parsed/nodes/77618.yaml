      <p>Kevin&gt; quoting.., "With an easily readable typeface the individual letters are always designed with regard to their impact as parts of a word."</p>
      <p>Look. One of the fundamental, no... foundational principles of readability design, in the realm of optical trickery,  is the modest to excessive exaggeration of the lowercase ht. relative to all other hts. Now, the accompanying ascenders and descenders are shortened in this process. That's not an option, it's a requirement, and this most assuredly has a clear impact on diminishing the uniqueness of word shape. Thus, anyone who says what's quoted above is not saying it right, or worse, not doing it right, or even worse simply not a designer of readable  faces and just blabbing for gold.</p>
      <p>Maybe, this Hochuli fellow was thinking of headline fonts, where indeed the design  of larger size provides spacial freedom to wander more in word shape via letter forming, but not in design for readability. On a much larger scale, I still wonder how those hundreds of millions of  letterless  Chinese get any reading done at all, without word shape recognition.</p>
