      <p>Nick, Stanislas Dehaene puts forward a combinatorially-based hierarchical coding scheme that moves from oriented bars through letter fragments, case-specific letter shapes, and local bigrams to frequent substrings, morphemes, small words and beyond. He might applaud your concern to make all these things look good, and recruit your list as evidence for the aptness of his scheme.</p>
      <p>In relation to your ‘fit’ comment, I’d say the type designer and typographer is oriented to strengthening our immediate or everyday, ordinary, lived-experience of words as 1) unitary rather than broken-up or fractured; 2) internally differentiated but not chaotic; 3) uncrowded; 4) familiar rather than foreign, or strange; and 5) sense-invested rather than as cryptic or meaningless things. As you say, “letter spacing (sidebearings and kerning) is as important a component as glyph shape” in ‘fit’. Perhaps scientists understand this, perhaps they don’t. But a hierarchical scheme such as Dehaene presents, with local combination detection as it’s foundational routine and parallel letter recognition as it’s defining mechanism, has difficulty addressing how it is that we experience words in this way.</p>
      <p>So that's in part where my discomfort lies, and one of the things that motivates my search for a less heirarchical and less letter-based coding scheme. But of course, “global shape” or “outer contour” don’t do any better at addressing or lived experience of words. I want a coding scheme that is both richly evidence-based and addresses the lived experience of skilled readers.</p>
