    html: <p>When we first learn to read, we sound out syllables and check memory maps for similar phonic or written matches.  We also do this when we come across a foreign word or words new to us that are in our own language. After enough readings, we learn the word as well as the glyphs and then read it more quickly without needing so much time needed for analysis. This process never stops as long as you come across an unfamiliar pattern of glyphs. Read any foreign text or a technical jargon that you are not familiar with and you slow down, decode, compare, and interpret or find a source to translate what is still a mystery. I don't see how we are talking about an exclusive either-or situation.  The brain is much smarter than we give it credit for. Reductionism only works some of the time, the brain works all of the time, even if the answer is "I don't know that word"</p>
