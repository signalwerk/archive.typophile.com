    html: <p>When I first drive to a location I am not familiar with, I consult a map, or one of the online directions sites for detailed directions.  After I have made the journey enough times, I not only don't need the directions but have probably found a shortcut and a way to avoid traffic.  That does not mean that someone else may either know it like the back of his hand already or else never be able to find it unassisted. We have to allow for the various pathways to reading and not assume all readers are possessed of the exact same knowledge or way of achieving it.  My wife MUCH prefers a GPS that spouts out "Turn left in one tenth of a mile" to my preference of a map (or at least street names mentioned instead of discreet distances). Luckily, I can still find maps and she can use her Garmin ;-)</p>
