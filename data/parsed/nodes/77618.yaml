      <p>Legibility and readability are two different things, and legibility is easier to measure than readability - as others have noted in this forum in other discussions.</p>
      <p>Typefaces like the Linotype newspaper face Corona, or the 4 3/4 size of Times Roman designed for what the British call "Newspaper Smalls", known as Claritas, most definitely exaggerate the x-height. This allows letters like a, c, e, and o to be distinguished from each other.</p>
      <p>But once letters have a large enough size so that legibility is not the issue, instead of going from 11 point Times Roman to 14 point Times Roman, going to 11 point Times Roman with three points of leading is a more reasonable thing to do. (Admittedly, three points of leading is a bit much, unless the lines are quite long.)</p>
      <p>Better yet, though, would be to <em>use</em> that empty space, and make the ascenders and descenders longer.</p>
      <p>Most English words can't be distinguished from each other purely on the basis of their pattern of ascenders and descenders. So if a lowercase "e" looks like a <em>dot</em> in the point size in use, reading will not take place. So "word shape" will have to involve delving a bit further down into the word, and it will only be a help to reading, not the main engine of reading.</p>
