      <p>JH&gt; Type designers have historically made a lot of more or less voodoo claims about how they work...</p>
      <p>An interesting take, and that may be so, but I think it's a different thing to publicize a flavor of voodoo, as if it were normal, when it is in fact contrary to good practice. </p>
      <p>The bottom line on letter vs. word for me, and perhaps for type design aimed at any sort of automated composition, is that I can give you letters that might look rather uneven and contrary-looking to each other (see Goudy, Brody or Excoffon), but if you allow an expert composer control over the word making, readability emerges from a seeming mishmash of letters. </p>
      <p>And, I can give you even and compatible-looking letters to each other with perfect spacing,(see a lot of stuff), but if you arbitrarily miscompose them (even by thin spaces), there are situations where words will just become a mishmash of letters.</p>
      <p>So, I think it's just simply much more important not to fool around with word shape than pretty much anything else.</p>
