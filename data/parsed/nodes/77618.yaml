      <p>Right Kevin, I think I can empathize with your motivation: it seems wrong to suggest that the adult reader’s eye doesn’t — in some form or other — register letters, but I wonder if you think that when Jost Hochuli says ‘whole words’, what this contains for him can be adequately circumscribed by terms like “envelope”, or “outline”, or “global shape”, or locutions like “the raw pattern of x-height neutral, ascending and descending shapes?” Is this in effect what the typographers you consulted and Jost Hoculi were anxious to convey?</p>
      <p>And if it isn’t, or can’t, can a marshaling of evidence that shows that “envelope”, or “outline”, or “global shape”, or “the raw pattern of x-height neutral, ascending and descending shapes” are in fact not used actually falsify Hochuli’s claim?</p>
      <p>I’m not sure how to properly operationalize ‘whole words’, but it seems wrong to me to do this with the terms I've place inside double quotation marks.</p>
      <p>The writings of James Townsend and Michael Wenger lead us to ask: “Is it possible to translate, [pe (their words, with my insertion here): within the realm of perceptual processes in reading], an inchoate notion of holistic or gestalt processing into a set of more precisely specified possibilities based on the characteristics of information processing?” Townsend and Wenger’s try to do this (witin the neural network domain) in terms of process architectures, stopping rules, degrees of process independence and process capacity. We might be well-served by taking a close look at how they try to do and test this.</p>
