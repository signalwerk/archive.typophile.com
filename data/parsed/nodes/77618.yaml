      <p><em>...typographers </em>[sic: type designers]<em> intentionally designed fonts that created the most distinctive visual “boumas.”</em></p>
      <p>I don't believe the major concern of type designers is either letter shapes or word shapes -- this formulation of our readability concern is simplistic, if not banal. We place a great deal of importance on "fit" -- of which letter spacing (sidebearings and kerning) is as important a component as glyph shape.</p>
      <p>I design typefaces as combinatory glyph reading systems with the goal of making individual letters look good as well as syllables, words, sentences and paragraphs -- at sizes from small body text to large display, in various media and with various text content. My readability concerns transcend the simple distinction that scientists have so far made between reading letters and reading words. </p>
      <p>I will not have my work reduced to the level of their understanding.<br>
      It is a gross misrepresentation.</p>
