      <p>I gave a talk at ATypI Dublin about dyslexia and what psychologists have learned about reading acquisition. I didn’t actually tackle the whole language debate because it’s not a debate anymore. The whole language idea for teaching reading was to provide a positive, reading-rich environment, and children will just naturally learn to read on their own. While it is certainly a good idea to read to your kids, it is false that kids will learn to read without direct instruction (some will, most won’t). Kids need to learn certain precursors to reading, particularly letter recognition and phonemic awareness. Kids who have learned these skills will go on to become proficient readers, and kids that are struggling to read in the 2nd and 3rd grades are still poor at these skills. I hope to turn this talk into a paper this year.</p>
      <p>Nick, the profoundly deaf struggle to learn to read. Conrad (1979) found that only 5 of 205 teenagers were reading at grade level. The 5 who were reading at grade level were the only ones able to detect words that were phonologically related.</p>
