      <p>Miller, P. (2010). Phonological, orthographic, and syntactic awareness and their relation to reading comprehension in prelingually deaf individuals: What can we learn from skilled readers? <em>Journal of Developmental and Physical Disabilities, 22(6)</em>, 549–580.</p>
      <p><strong>Abstract</strong><br>
      This study seeks to provide new insight into the phonemic, orthographic, and syntactic awareness of individuals with prelingual deafness and the way those contribute to reading. Two tests were used: one designed for the assessment of phonemic/orthographic awareness (PO/OA) and another examining reading comprehension (RC) in contexts where prior knowledge was either helpful or not. Participants were 83 prelingually deaf individuals (DIs): 21 primary school, 36 high school, and 26 university students. The control group consisted of 85 hearing individuals (HIs) from parallel education levels (29 primary school, 29 high school, 27 university). Contrary to predictions made by current reading theories, findings imply that the failure of DIs to develop sensitivity to the phonological properties of words may not underlie their reading difficulties. Rather, this weakness seems to reflect a processing deficit at the supra-lexical (sentence) level where the final meaning of single words is elaborated by its integration based upon syntactic (structural) knowledge.</p>
      <p>I have not read the paper. This is the abstract from the Web of Science database.</p>
