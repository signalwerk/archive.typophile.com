      <p>Nick, I know the map is not the territory, but I think I’ve happened upon a description that can address your skepticism about the powers of coding schemes. John, I’m not sure I can produce hard evidence at the outset, or introduce quantitative measures without assistance, but there are tantalizing convergences in existing data sets. Christopher, I’ll do my best.</p>
      <p>I’m going to wait with my description until I’ve finished reading Dehaene.</p>
      <p>As a side note to my comment about Dehaene’s dismissal of the Whole Language approach to reading instruction let me say that, on my view the testing of and systematic inculcation of phonemic awareness is vitally important. It's just not all there is. Systematic inculcation of phonemic awareness forces the mind to create vectors over bigrams, syllables, morphemes and small words. This is good. It also tends to erect a hierarchical and dendritically complex coding architecture. (Dendritic, means tree-like.) This is the kind of architecture Dehaene's book describes. Such hierarchies can be difficult for a processing routine to navigate. It's basis is a decomposition into letter-wholes. A less coarse-grained, more elemental recoding has to happen alongside of vector-formation to make word recognition rapid, automatic and effortless.</p>
