  html: |-
    <p>I was looking at a brand manual and saw something that stated the constraints for body copy as "7.5pt/14 The Sans CPQ Semilight and .3 dashed rule"</p>
    <p>What does the number 14 represent and how do I create a .3 dashed rule?</p>
    <p>Best Regards,<br>
    Rob</p>
