    <p>FREE SUNFLOWER SEEDS WITH ANY PURCHASE<br>
    For the month of April, I’m sending out a pak of sunflower seeds to anybody who buys a font at Chank.com. (U.S. residents only, sorry!) Get with your seeds free with purchase of Chank Fonts here:<br>
    <a href="http://www.chank.com/fonts_all.php">http://www.chank.com/fonts_all.php</a></p>
    <p>APRIL FONT OF THE MONTH: SUNFLOWER!<br>
    It’s a new typewriter font. Made with an old typewriter. In new OpenType format. It’s new and old at the same time!<br>
    <a href="http://www.chank.com/font_detail.php?sku=5580">http://www.chank.com/font_detail.php?sku=5580</a></p>
    <p>FREE FONT: FLOWER POWER!<br>
    It’s a quirky new display font. Old hippy charm from the pen of artist Pat Scanlon. Pick it up here:<br>
    <a href="http://www.chank.com/freefont_detail.php?sku=1097">http://www.chank.com/freefont_detail.php?sku=1097</a></p>
    <p>HOW NOW?<br>
    I’m so excited to be a guest speaker at the HOW Design Conference this year. My presentations are sponsored by Extensis, who can help with font management solutions. Best of all, the conference is happenin’ in Vegas.<br>
    <a href="http://www.howconference.com/">http://www.howconference.com/</a></p>
