    html: <p>If you're downloading free fonts, they are (probably) not well made.  There are a million sans out there, ten million ways to use them well, and ten billion ways to use them poorly.  I think that you need to educate yourself and your employer here, because there's not much we can do to help you without doing the work for you.  There's a reason that it is a professional skill.  It's hard.  It takes practice and education and sacrifice.  If you had more experience, I'd be more encouraging.  But I strongly suggest you hire a professional.</p>
