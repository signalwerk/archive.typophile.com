    html: |-
      <p>Sans isn't the name of a font, it's a classification type in typography meaning a type without the small features called "serifs" at the end of strokes.</p>
      <p><a href="http://en.wikipedia.org/wiki/Sans-serif" title="http://en.wikipedia.org/wiki/Sans-serif">http://en.wikipedia.org/wiki/Sans-serif</a></p>
      <p>I use Corel and the font selection is based off of your regular library of fonts, so there should be more then one Sans.</p>
