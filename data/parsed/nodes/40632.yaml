      <p>your logos are heavy on style effects and low on concept. It's easy to fall into the trap of adding a few photoshop filters here and trendy widget there.</p>
      <p>I'd step back a bit and work conceptually for a while. Sketch out some ideas...no matter how crazy you might think they are, and then look at them and see if if an idea begins to sprout.</p>
