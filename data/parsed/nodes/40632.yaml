    html: |-
      <p>Keep in mind that you will need to make a black and white version for situations in which you can't use full color (for example, in a fax).</p>
      <p>Also, it looks like you are using Arial... Please, don't use Arial. So many great san serifs out there! Also, pick a typeface that has a wider range of weights... The two weights you are using in "EKT Group" are not different enough from each other.</p>
      <p>In the second example, the "M" overlapping the orange circle doesn't look very good, because it's just the tip... It looks like an unwanted accident. Consider aligning "Managing Success" in some other way, rather than centering it exactly the same as in the first example.</p>
