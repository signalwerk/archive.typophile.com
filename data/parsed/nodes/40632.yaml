    <p>I am very much a beginner at any graphics oriented stuff.  I am trying to put together marketing material for a new company (logo, brochures, website) and am finding it much more difficult than I imagined.  It all looks easy until you try to put one together.  Also the foudner of the company is stuck on oranges and reds for everything.  Please help me out. My logos have been all over the place adn when I found one I liked I realized it wasnt usable on colored backgrounds.  Learning slowly.  VERY SLOWLY!  SO if its really horrible, just tell me its horrible.  </p>
    <p>Thanks!</p>
