    html: |-
      <p>I would start drawing the letters to get the feel &amp; flavour right. Perhaps I already have a typeface in progress that is suitable, perhaps not. I might even start straight into FLS, as Illustrator is harder to work the curves. It all depends on the budget &amp; client! For instance, <a href="http://www.klim.co.nz/content/lettering/kaweka.html" rel="nofollow">Kaweka</a>, <a href="http://www.klim.co.nz/content/lettering/conveyIT.html" rel="nofollow">conveyIT</a> and <a href="http://www.klim.co.nz/content/lettering/fiend.html" rel="nofollow">Fiend</a> all started as sketches. Pen and paper are still the easiest ways to nail the idea for me!</p>
      <p>—K</p>
