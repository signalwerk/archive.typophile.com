    html: |-
      <p>Type your word FRUIT! in a bunch of different fonts. You can even do this in your font browser. Certain characters and combinations will start to emerge. Then customize as necessary. You might decide, for example, to turn the I into a banana (I'm going for the obvious here) Wait to tackle the tagline until you know where you're going with the logo.</p>
      <p>You have a lot of questions, have you ever studied design? Might be worth taking some classses.</p>
