    html: |-
      <p>No, it isn't.</p>
      <p>A new font is almost never needed for the creation of one, single logo. If an existing font does not meet your or your client's needs, it is usually better in terms of time and budget to just create a vector art logo. A fount entails so much more work and investment that the few letters or symbols found in a logo.</p>
