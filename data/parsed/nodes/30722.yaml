      <p>Interesting answers! </p>
      <p>Let's take a simple word and do a test. Say you are creating a logo, which will be used first and foremost on stationary and eventually a website.Use the word below.</p>
      <p>Fruit!<br>
      Tagline- It's good for you.</p>
      <p>Would you design those five letter plus punctuation  and the tag line by scratch?</p>
      <p>Would you take another font and pop it into a program and change it? (Still confused whether that is legal in regards to the EULA- please hlep me on this...that is my ultimate question).</p>
      <p>If you had an existing font, would you just polish it up and pop it into a snazzy illustrative design?</p>
