    html: |-
      <p>If you're talking about incorporating letter shapes into a logo design, most font licences specifically allow it, and with those that don't it could be argued that you can since this is a customary fair use of fonts. (Be careful who you argue with, though.)</p>
      <p>Notable exceptions include most dingbat and picture fonts, since the glyphs in those fonts are essentially logos already. </p>
      <p>If you have the time and your client has the budget, by all means create a new custom font for the project.</p>
