    <p>Hi Forum!</p>
    <p>I really hope you guys can help me out here. I found this really cool looking font that was used for a custom motorcycle sticker on a vector site with the words "HotWheels" </p>
    <p>The Designer had used Adobe Illustrator to design them, but hadn't mentioned the name of the font he used! :( </p>
    <p>I hope you guys can help me find the name of this font because I really really like it and need it to design a custom logo!</p>
    <p>I would be forever grateful to you guys if you can help me!</p>
    <p>I'm having trouble uploading a pic of it here directly, so I hope you wont mind me using twitpic to post it here! </p>
    <p><a href="http://twitpic.com/8vgd9m/full" title="http://twitpic.com/8vgd9m/full">http://twitpic.com/8vgd9m/full</a></p>
    <p>Thnak you so much!</p>
