    <p>About a year ago I changed from Windows to OSX. I had purchased several postcript and truetype fonts for Windows and needed up upgrade these to opentype versions. Fortunately, most of my purchased fonts were standard or pro opentype fonts.</p>
    <p>I discovered some companies allow font upgrades and others do not. Adobe and Monotype do not (at least beyond 30 days, per their tech support). However Storm, Teff, HF&amp;J and others do. I would prefer to purchase future typefaces from foundries that allow upgrades (for a price) rather than require complete repurchase of fonts. Does anyone have a list of foundries which do not forget about you after 30 days?</p>
