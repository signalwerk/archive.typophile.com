      <p>As to some of Charles E's comments:</p>
      <p>&gt; Decompiling &amp; recompiling is not a black art, successful only with the appropriate chants and the addition of an eye of newt.</p>
      <p>Actually... it pretty much is. At least, that's my conclusion from the evidence. I have found bugs in EVERY tool I have ever used in the last few years to attempt to "round trip" fonts from compiled form to change something isolated and then recompile the font, whether it is FontLab, OTMaster, or ttx. FontLab does not even try to do clean round-tripping, and nobody should expect it. The other tools do, and usually succeed—but not always.</p>
      <p>Additionally, at both Adobe and Extensis, I have regularly seen problems created by botched third-party conversions of fonts. Not as common as problems simply created by poorly-made fonts, but not all that unusual, either.</p>
      <p>&gt; That's interesting, too. Though I wouldn't take adding an otf wrapper around a Type 1 font as a *conversion.* Nor can I remember any issues with "converting" a Type 1 PostScript font from Mac to PC format, or vice versa.</p>
      <p>In all these cases there is data that must be invented from whole cloth. The conversion tool has to guess at reasonable values for this data. It won't necessarily get the same or compatible results as what the foundry would have made. It is platform-specific data that would be preserved in a creation/conversion process run by an intelligent foundry (as at Adobe), but simply won't be present in a single-platform font from the "other" platform.</p>
      <p>For example, the Windows Type 1 fonts are generally likely to be style-linked, so they will not have Mac-like or OpenType-savvy menu names. The user must hope that other non-critical name fields are well-formed, or add the other menu names manually.</p>
      <p>Kerning is a problem because the kerning in the original platform-specific fonts is restricted to the standard character set for that platform. So even though your Windows Type 1 font may have fi and fl ligatures (Adobe's all did), they will not be kerned in the Windows version, nor in any font derived from it by usual processes.</p>
      <p>For older fonts, they are also likely to be missing some useful characters, such as the euro. Newer foundry fonts will have at least that added. (In converting their library to OpenType, Adobe also added 14 font-specific symbol characters to each font that were simply not present in the Type 1 versions.)</p>
      <p>That's just off the top of my head. If I think about it for a while I could come up with more examples of issues. But suffice it to say that I am thoroughly in agreement with Ralf. Despite not even being in the desktop font biz any more, either (no "revenue stream to protect").</p>
      <p>Oh, and besides which, ad hominem arguments suck. Even if somebody is arguing a point that happens to be in their best interests, that doesn't make them wrong.</p>
