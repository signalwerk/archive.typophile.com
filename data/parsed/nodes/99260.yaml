      <p>Well, if money is a concern for you, I can't imagine why you got a Mac. You pay a lot to swing with the in crowd. Far cheaper to just buy another black outfit...esp. since the Isle of Gough is uninhabited...</p>
      <p>Chiding aside, the Adobe license allows you to upgrade your Adobe-licensed fonts yourself. No cost. I only know the expensive way to do that -- Fontlab Studio. But my decision was made to allow me to write new OT features, etc. etc., with a one-package piece of software. FontLab Studio lets one do this while maintaining a general ignorance of computer programming...</p>
      <p>If your existing fonts were good enough for your work, and you just want access to them again,  I'm pretty sure there are a couple of relatively inexpensive programs out there that will let you put the otf wrapper around an exiting Type 1 font, so they'll again be available for you to use.</p>
      <p>Somebody here probably knows where there is a $100 or so font tool that's quick &amp; easy to use.</p>
      <p>Note this isn't permitted by many font publisher's licenses, including the Monotype conglomerate. </p>
      <p>As there are now gazillions of fonts out there, one factor I use in deciding to buy a font family -- I look at it as an investment -- is what the license permits. This is true for most of my clients -- university presses --  too.</p>
      <p>As an example, another thing to check is what the license permits in terms of using the fonts in digital publications, and what the fees are, if additional. Some font publishers require you to pay a not insignificant sum for each font, for each use. If you are part of a publishing a periodical, that can add up. I've seen scholarly journals published quarterly where <strong>each digital issue</strong> has an added cost of $250 -- $1,000 extra per year -- for font licensing.</p>
