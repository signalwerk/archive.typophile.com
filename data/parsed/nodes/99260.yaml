      <p><cite>I run a typography help board for over 10 years with over 100.000 posts. I know what font problems users have.</cite></p>
      <p>That's interesting, I really am curious. Is there a url where one can see some of these?</p>
      <p><cite>And fonts messed up through font format conversions is a problem I have seen hundreds of times.</cite></p>
      <p>That's interesting, too. Though I wouldn't take adding an otf wrapper around a Type 1 font as a *conversion.* Nor can I remember any issues with "converting" a Type 1 PostScript font from Mac to PC format, or vice versa. </p>
      <p>For a long time I wouldn't trust ttf fonts, esp. as U.S. printers wouldn't take them. So I did a number of conversions of ttfs to Type 1 PostScript, &amp; had only a very few issues. The instances I remember were when the original TrueType font had errors apparently forgiven by most rips, but not by (my, anyway) font editing program. I would not expect to find such errors from a major publisher such as Adobe. In any case, everyone now seems to accept TTFs, so perhaps the caution should be to not convert from one to the other -- though again, I've had no trouble. I find the "hundreds of times" number curious.</p>
      <p>Finally, as I said, I'm not a programmer, but I believe you can add an open type wrapper without affecting the font glyph data at all, no?</p>
      <p>Edit:</p>
      <p>The latter is like the early days of PostScript Type 1 fonts, where with Windows anyway, you added kerning data to the afm file. You didn't need to see the font in a font editor at all. Just run out your pairs, write your kerning table, and test the results by running the pairs out again. Refine kerning as needed. This is how we had to work with the Linotype 202 (or the equivalent Monotype) fonts BTW, you couldn't "bring them up" in a font editor at all.</p>
      <p>Opentype just adds more tables.</p>
