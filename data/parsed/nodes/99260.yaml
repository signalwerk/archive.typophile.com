      <p>Laurens:</p>
      <p>There are ways to look at the version info in a font. But regardless of how old your font is, if you have a bug, I suggest you just contact DSType directly, describe the issue, and ask if the most recent version of the font fixes it, or if they can fix the problem with a new update. (As for how to check date/version, are you on Mac, or Windows? Do you have a font management app, or a font editor, or are you reliant on the OS for font info?)</p>
