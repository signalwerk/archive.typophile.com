      <p><cite>Does anyone have a list of foundries which do not forget about you after 30 days?</cite></p>
      <p>I think there are no regular »upgrade paths« in the font industry, because that format change from Type1 to .OTF was or is a one time thing. I don't expect such a change anytime in the foreseeable future.<br>
      So for the future, if you stick to TTF/OTF you should be fine. All foundries should provide you with (usually free) upgrades for the same font type. So if you buy a license for SOMEFONT.otf with the version number 1.0, you will certainly get 1.1 for free and also very likely 2.0 and so on. If anything, that's an advantage over »regular software«. </p>
      <p>Concerning TrueType fonts: You don't need to repurchase those! Just transfer them to the Mac!<br>
      If you mainly rely on Adobe layout software you can also continue to use your Windows Type1 fonts. Just put them in the Adobe font folders. </p>
      <p><cite>You pay a lot to swing with the in crowd. </cite></p>
      <p>The irony is that using this silly argument is a perfect example of »swinging with the crowd« …</p>
      <p><cite>Somebody here probably knows where there is a $100 or so font tool that's quick &amp; easy to use.</cite></p>
      <p>Transtype for example. A new version for Mac is currently a free Beta. </p>
      <p>Still: Even if the EULA allows it, it's often not a good suggesting for font users to mess with the font files. You decompile a software and compile it again. That's not like opening a TXT and saving it again! You will very likely break something, even if you don't change anything deliberately. For example, because the font editor you use, just can't decompile every detail of the font file properly and you will generate a new file that has new problems.<br>
      Dealing with these problems can be time-consuming and in the end, you will have probably spent more time (→ money) than when you would have bought the new versions in the first place.</p>
