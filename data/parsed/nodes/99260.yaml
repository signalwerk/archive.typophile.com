      <p>I confess haven't read you blog, or your books, and so may be doing you an injustice. If what you write in your books differs from what you post here, I apologize for the assumption. But the attitude you're espousing is that of a protective type designer, with no notion of the <strong>use</strong> of type. Whatever your attitude on the matter, discouraging people from learning about the use of type serves the community poorly. What is type for, if not to be used?</p>
      <p>&amp; just BTW, what software do yo think Adobe uses for their font work? For the glyph work, it's FontLab. </p>
      <p>You wrote:</p>
      <p><cite>You decompile a software and compile it again. That's not like opening a TXT and saving it again! You will very likely break something, even if you don't change anything deliberately</cite></p>
      <p>If FL will open the font up right once, it'll likely open it up right twice, eh? -- Else the machines in Palo Alto could never once open the .otf, relying on the .vfb only, forevermore. Decompiling &amp; recompiling is not a black art, successful only with the appropriate chants and the addition of an eye of newt.</p>
