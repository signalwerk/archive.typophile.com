      <p>Thank you everyone for the comments. I found the second web reference from Jens interesting that smaller foundries often would give upgrade paths. I realize there are several inexpensive or even free downloadable or web based font converters available, but I am not sure they preserve kerning tables or other features reliably (as some of you have commented above). I have had good luck with Commercial type foundry, Storm, etc. Some foundries are somewhat helpful (Bertholdt) and allow upgrades up to a year. Monotype and Adobe have been poor (Monotype being bad all the way back to the old CD unlocking system from a decade or so ago). Teff has a progressive upgrade price where basically one pays 25% of the upgrade for each year after original purchase (so one needs a repurchase after four years). I had good luck with Tiro, but they have pulled most of their older fonts. The points raised about additional fees for embedding, etc. are good, and that is something I also consider in a purchase.</p>
      <p>Even with opentype, some of the postscript opentype fonts will not be read by some programs (e.g.: Madcap Flare, which is only really reliable with true type fonts and some true type opentype fonts). Dutch type library had upgrade options for older postcript fonts to opentype, but Teff has some of its more expensive fonts (like trinite) only available in postscript Win or OSX formats. When one considers the variety of uses of fonts (print and web based, in 3D and video applications, CAD programs, etc), it is good to have options for upgrades or sidegrades for fonts in the interest of compatibility. The reason I use a MAC now is that I spent a small fortune in fixing Dell computers before buying from a more reliable computer manufacturer; and I do collaborative work in video where some of the files I get are from strictly Windows (Vegas) or Mac (Final Cut) sources and I maintain dual boot partitions on an Apple computer. I don't care about the "crowd".</p>
      <p>I believe that the creators of type deserve proper reimbursement for their time and artistic work. There are a few fonts that are significantly overpriced, that that is not the rule for most. However, the arguments made in the Jens links mirror my own. It sounds like the best options are to purchase from the smaller foundries directly rather than from redistribution sites (fonts.com, myfonts.com, etc.). Adobe has its own business practices outside of font resale, and it appears to be reducing tech support to save money. They are moving to a lease based system for software, with substantial penalties for holding out on upgrades for several versions and purchasing upgrades the old way.</p>
