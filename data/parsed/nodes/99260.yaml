      <p><cite>You will very likely break something, even if you don't change anything deliberately. For example, because the font editor you use, just can't decompile every detail of the font file properly and you will generate a new file that has new problems.</cite></p>
      <p>Spoken like someone protecting a revenue stream. Pretty much every Adobe font we have originated as a Type 1 font, and I've converted most of them to otf. Occasionally, as with Minion, I went back to the Type 1 multiple masters fonts instead of using the .otf supplied by Adobe.</p>
      <p>OK, not fair, I've been using font editing programs since Altsys Fontographer 1.something, and could be considered experienced. </p>
      <p>But here's the deal. For display fonts, I don't do anything except open up the Type 1 font, click on the automatic .oft features in FontLab -- sometimes there are some, sometimes not -- and "generate font" as an otf. We view all display fonts as requiring handwork by the compositor; "OT features" don't save much time here.</p>
      <p>Number of problems with Adobe fonts: 0 (zero). Occasionally there is a problem with a free .ttf font -- when the font wasn't prepared correctly in the first place.</p>
      <p>So I'd say, as a user with about 500 fonts converted, you will almost never break anything. I have never had a problem, at least with an Adobe font, or other font from a professional foundry where I have permission to modify.</p>
      <p>But I'd also say this: if you try to bring up a Type 1 font aimed at text, with the automatic features offered in the OpenType format, you will spend a fair bit of time. If you could bill that time, you'd make far more money buying the font &amp; billing your time. What if you can't bill the time? Or what if you want to fix some of the inevitable mistakes in kerning, or add features (which, after all, are only time-savers)? The picture is less clear. </p>
      <p>Still, I find your answer both knee-jerk and wrong. Give me an example of something that went awry.</p>
