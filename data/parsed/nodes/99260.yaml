      <p>Before I go off and disagree with Charles on a bunch of things, let me say that I think that Isle of Gough is correct that we shouldn't think of fonts as a buy-it-and-forget-it item any more. Even if OTF/TTF are the end of the line for another decade or more, people live longer than that, and moreover the more complex fonts become, the more they have bugs that need fixing.</p>
      <p>I remember back when I started at Adobe in the waning days of PostScript Type 1 fonts (1997), our objective at ship time was pretty much to ship a font that was literally bug free. We hoped to never need to update the font file after it went out the door. Although difficult, one could actually strive for that, and achieve it or get close.</p>
      <p>Today, the vastly more complex systems and fonts we have in OpenType make such a goal absurd. Even if there are no known bugs in a font going out the door, any high end font *will* have bugs. If somehow magically it does not, changing ideas of best practices or new enhancements to specs will make updates desirable. It could be "Hey, now we can add names to those stylistic sets!" or "Hey, we need to rebuild this because the OpenType sanitizer rejects it!" or "We need to change the vertical metrics for Web fonts vs desktop fonts!"</p>
      <p>So, high end fonts will need fairly regular updates these days. That's life.</p>
