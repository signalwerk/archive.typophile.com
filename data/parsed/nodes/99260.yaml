      <p>I have no »revenue stream« to protect. Our own fonts specifically allow any user to do any modifications they want.<br>
      But I still don't recommend it –&nbsp;from a user’s perspective. I run a typography help board for over 10 years with over 100.000 posts. I know what font problems users have. And fonts messed up through font format conversions is a problem I have seen hundreds of times. So I speak purely from experience.<br>
      Fonts are compiled software made to be used, not to be modified. If you have done the latter successfully, that's fine for you, but that doesn't make it true for everyone else and every possible font.</p>
