      <p>Jens, I'm sure part of that comes from being "professional," too. I've been known to write some ugly code, but the printer's rips don't complain and it gets the ink on paper. For the OT features, I throw out most of the foundry code and just start over. What I use is simple, if not efficient.</p>
      <p>I imagine you, like my business partner (who does have programming skills), would look at some of my features code and utter some obscenities or vulgarities. We have an agreement -- he stays away from fonts. Not ideal, but cuts down on the arguing, which can waste A LOT of time. 30-some years ago, we spent 4 hours arguing over what was the best way to get a microphone line across the balcony of a large chapel...and so learned to focus a bit, because after 4 hours, there was still no line across the balcony...</p>
      <p>* * *<br>
      And of course, I'm just as bad when something in the type offends me...</p>
