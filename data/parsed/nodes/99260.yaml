      <p>Well, Trinité doesn't have kerning. Or ligatures. When I bought it, the Euro was about $0.85, a plus over now. But you had to send both a signed agreement to the license and the money before they'd send you the fonts. After much negotiation I did get them to change the license for us a bit. Anyway, without such goodies, an OT version doesn't save you much time.</p>
      <p>Merlo is offered in a couple places, albeit they're slightly different versions. I believe the Village license is very accommodating. Ask, and make your own OT version.</p>
      <p>As far as "improved" kerning, yeah, sure. Dunno about you, but I always do my own kerning. Goes back to the days before PostScrit, how do you think we worked?</p>
      <p>If the type designers can get uppity about their skills, so can the rest of us. Nowadays, all the graphic designers think they can set type. OK, show me the work. If it's long, like a book, all the automation you can get helps a lot. But that automation should come from like-minded people. For example, kerning for display type is usually no good for text. Adobe has some howlers, too, just like everyone else. </p>
      <p>And remember that Adobe, indeed, all the font publishers, don't know who's going to be using the type, and what the output will be. They probably have to assume that people using MS Word and a laser printer are their biggest customer base. Can't blame them for that.</p>
      <p>Just for fun -- from the types you like, I'd guess that most of your work is printed offset on coated stock, and is probably bookwork. Art books maybe?</p>
