      <p>Thomas -- the only chants I know can also be categorized as obscenities, profanities, and vulgarities. Until now, I thought that when I hurled them at the computer, I was just venting ;-)</p>
      <p>As to the rest, I guess we'll just have to disagree. But there is this difference: I'm a user.  Most of us have limited needs. Mine is putting ink on paper with a high-resolution offset press. The font software does have to pass through some other software -- a layout program, "conversion" to PDF, preflight check, the printer's rip, platemaker, etc. but as long as the printed words look the same, I call the fonts the same.</p>
      <p>That's a far different requirement than a font publisher has, I'll agree. And for all I know, when you round-trip a font, the program, in either code or binary, may look different. And that can and probably should be worrisome for a font publisher. A user's needs are far more focused -- But that's what IsleofGough is, a user.</p>
      <p>Ciao </p>
      <p>(BTW, I used what I called "database" fonts in the 8-bit days, long before OpenType was a gleam in someone's eye. As we used TeX, we'd just write an encoding vector for whatever 256 characters we wanted. But, for example all the roman glyphs &amp; all the kerning was in one roman font. When Adobe came out with the OT Pro series, I just wrote an OT wrapper around my "data base" type 1 fonts. Reason? Frequently, I still had more glyphs than were in the OT pro font, and I preferred my kerning. I bring this up to point out this isn't an idea that just occurred to me, I've been doing it for almost 20 years now.)</p>
      <p>BYW II: Adobe Jenson's kerning, as published, is <strong>still</strong> gefuched, just look at the string</p>
      <p>f_space_quotedblleft_(anything)</p>
      <p>e.g., all throughout Ambrose (fils)'s book <cite>The Pacific</cite>. Sadly, the word "of" followed by a word in quote marks is pretty common... I'd call that an unfixed bug, and I did mention it to the young Mr. Slye awhile back...</p>
