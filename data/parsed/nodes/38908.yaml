      <p>1: People generally value crispness onscreen rather than the soft appearance. So your taste differs from that tendency.</p>
      <p>2: There are people here from every age group, country, economic background, and stripe of being you can imagine. Add to that: type is a subject that inspires passion but does not necessarily bring wealth. so there is a small community and some people in it are defensive, overzealous, underemployed, or perhaps frustrated, by their own situation, or possibly someone else’s. There could be a million reasons for the attitudes and personalities presented here. I tend to agree; the level of bile gets unnecessarily toxic sometimes. It’s not necessary, since type is one of those things most of the world can safely ignore forever, but again with the passion....</p>
      <p>3: Same variance between visitors: some have all the time in the world, some have very demanding jobs. There’s a variance too in how speedy people are in developing their types. And each design has it’s own demands; one-style display types take a fraction of the time a 48-member text/display family takes. Autotraced? Cut the time in half! </p>
      <p>There’s experience level; the last large family I released overall took a long time to finish; but I started when I was a student, and learned a lot on the way; doing it again, it would take me much less time. It also depends how people define their work as finished; some people are frankly sloppy and do not have good digital hygiene, others obsessively tweak beyond the point when it makes a difference. And there’s the matter of originality. Whether it’s an honorable, faithful revival or a cheap knock-off, with revivals, many design decisions have been addressed before the design gets digitized. Some new designs need a lot of preliminary gestating to clarify their ’thesis’ or feel. Sometimes there’s a customer tapping their fingers, looking at their watch, and ready to write a big check if the work is delivered on time. That can motivate you! Retail type design is speculative; if other, paying work is waiting, you might put off terrific or easy retail designs for years in favor of paying the bills. </p>
      <p>Combine all these variables, and you can see there will be a huge range in the time it takes to finish a design. I know type designers who marvel at how their quickest, throwaway designs are the big sellers, and the fussed-over, long-gestating ones don’t get that attention. That has to do with their intrinsic appeal and usefulness, which is not really under the control of the designer. </p>
      <p>Yes, you can make a font in a week. You can make a font in a day. Depends....</p>
