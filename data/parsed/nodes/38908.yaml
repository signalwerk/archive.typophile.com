      <p>On the subject of your Fedra (Peter Bil’ak) and Typodermic question,<br>
      I will probably state the obvious, but nevertheless;</p>
      <p>Fedra is a very, very large text tailored typeface, where Typodermic mainly designs/sells display-type. Typefaces for text-purposes demand a high level of sophistication and attention for detail to be able to be used at textsizes, and thus take (<em>most of the times</em>) far more time to design and build than (most) display typefaces.</p>
      <p>Also, an extensive typeface like Fedra in OpenType for example, can contain thousands of characters to be able to set bodytext in as most languages as possible. But usually also smallcaps, alternates, ordinals, fractions, ligatures, lining- and oldstyle-figures (sometimes both as Tabular and Proportional), superscript, etc. These options also need to be programmed for OpenType, which is also another part of the design process. </p>
      <p>So for a large part it’s about what the designer has set out to accomplish.</p>
