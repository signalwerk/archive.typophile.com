      <p>Thanks for such an informative answer. It helps me transition perfectly into a more esoteric question:</p>
      <p>Above, you brought up two very intriguing issues. One was your comment “It also depends how people define their work as finished.” Wouldn’t an ability to also know WHEN to define their work as finished be just as important, provided there was no preset deadline? I would be interested to know one thing from you specifically ... how different was Beorcana one year before it was labeled “finished” than it was the day it officially was “released?” Was it so different that an ordinary layperson could successfully have identified half the differences? All of them? Any of them? In truth it doesn’t really matter because your final product was and is stunning. It’s almost too pretty to use, you know ... kind of like the fine china you just display in a case and look at. Whatever tangible returns you get from that typeface will never be enough because when I think of or refer to the upper tier of designs, that font immediately comes to mind. And speaking of production output, if I was in your position I’d be terrified to begin my next typeface and would give a lot of thought to making that my lone legacy. For at least 5-10 years. So were there or will there be any feelings of fear?</p>
      <p>Alas, though, you are certainly correct in that there are countless situations that can directly affect the amount of time it takes to build a typeface.</p>
      <p>Also above you wrote that some designers were “defensive, overzealous, underemployed, or perhaps frustrated, by their own situation, or possibly someone else’s.” First I can’t help but believe that eliminating the first two of those probably would help ease or even reverse a lack of sufficient employment or that level of frustration, but more than that, each of those things can slowly but definitively tear down one’s love for the very thing causing those previously mentioned conditions. It just seems like I’ve run across a few people who have forgotten the concept of typography is and always will be much bigger than they are, and I for one honestly thank God for introducing something to my life into which I can gleefully and energetically sink my teeth. I’m still in the believing in Santa Claus stage and it’s a downer to see some of the arrogance and/or blatant disparagement that can go on here. There is of course a foolproof cure for anyone with such a jaded, cynical view of their former love: just take it all away from them for a good while.</p>
      <p>Your response was quite thoughtful and very much appreciated.</p>
