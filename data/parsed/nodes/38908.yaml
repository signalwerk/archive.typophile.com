      <p>Thanks for those observations. I kinda picked Fedra out of the air for brevity’s sake rather than perfect illustration. I admire the ambition and dedication necessary to produce such a large amagalmation of function and art, and have been disappointed not by its continuing expansion but rather by the fact I am extremely anxious to see Mr. Bil’ak’s next sans typeface.Whatever the case, I think I approached this particular issue incorrectly. Let me try from a different angle.</p>
      <p>In your post you mentioned the tremendous amount of work put into the various Fedra families - including the display version - which to me is awe-inspiring. If I read your post correctly, however, part of the reason for such disparities in output could be that Ray Larabie creates a lot of display faces, which require less overall effort/time (though immediately coming to mind right now is the amount of work and time put into the Beorcana typeface. However, your point of course is accurate.).</p>
      <p>What I wonder is, could this disparity - and for that matter any disparities between two designers in production rate - be rooted in something much less technical, and perhaps much more prevalent than anyone might expect?</p>
      <p>My point: I believe the quality of a typeface owes at least some small part to a designer’s expertise and instinct just in operating a computer. Or in understanding the overall concept of how computers work and putting that knowledge to work while using Fontographer, FontLab, etc. I cannot then help but wonder how many times the copy and paste functions are used when successful Designer A is creating a typeface. Given the seconds in which these functions can be employed, taking years to produce a technically superior, attractive typeface - for text, display, or otherwise - seems inconceivable. For that matter, hypothetically speaking, a designer could all but create a solid, geometrically sound skeleton of an entire font in only a few hours just by using the copy and paste function.</p>
      <p>I also wonder how many designers - if any - release a font for sale after doing nothing more than selecting the “autohint” option in Fontlab, or auto-kern option in Fontographer? Certainly those kinds of options in font-creating programs were included to be used, but by whom? Are the top tier of designers using these options, or were they included for what in golf vernacular would be use by a typographic hacker having fun with a unique hobby? </p>
      <p>If someone were to ask me to guess how many income-generating designers were using these or other similar program options, I’d probably answer “British Columbia” and be just as confident in its correctness as anything . . . however if a gun was involved I suppose I’d probably say “zero.” Another question this raises: is there anything really wrong with using all of these functions/options? If you answered no, I cannot imagine you then being able to comprehend a font taking years to produce.</p>
      <p>I ask these things because I honestly don’t know the answers. To this day I’m just a guy in Florida with a fever for this stuff but still trying to put many things in their place. For reference’s sake, the one font I have somewhat completed - or got completely sick of looking at - is called “Myndraine” and is free at dafont. I strongly considered the far more applicable name “Crappy Sans,” but decided against it. It took me approximately two months to produce what was submitted to the site, with more than a few baseball games, History channel and UFC Fight Nights mixed in and battling for my attention. Trouble is, I spent the entire second of those two months making the font worse. When I said “sanity,” I weren’t kidding.</p>
