      <p>Speaking to whether to go with a friendly display face or friendlier display and body types, <a href="http://underware.nl/site2/index.php3?id1=underware&amp;id2=case-studies&amp;id3=01&amp;idpic=05" rel="nofollow">here's</a> an example of a bank choosing to use a typeface in every application -- and I think it was a fantastic solution. I believe that Citibank uses Interstate in this manner, too.</p>
      <p>One wide-ranging type family I can think of is <a href="http://www.typotheque.com/fonts" rel="nofollow">Fedra</a>, which comes in sans, serif, and display varieties <em>and</em> a monospaced version, which means that it could be used on automatically generated papers, too.</p>
      <p>Also, take a look at the suggestions <a href="http://www.typophile.com/node/17684" rel="nofollow">here</a>.</p>
