    <p>Hello!</p>
    <p>I wonder what the expertes suggestions might be:<br>
    Let’s say a bank gets a a new owner and plans to have a new corporate design: more friendly, more contemporary. They used a customized Futura so far and everything was quite the same for more than 15 years. As there will be a lot of different publications, a big Type-Family like Corpid or Corporate would propably be a good choice because of flexibility. But is there another suggestion? Especially concerning friendliness and contemporary feeling? Or maybe it is better to have a face that conveys those values for the display-sizes (headlines, advertisments, posters), and have a more neutral sans-companion for all the rest ...<br>
    Any suggestions /font-names are welcome.<br>
    Thank you for your ideas, I really appreciate this forum. </p>
    <p>anton</p>
