    html: |-
      <p>A quick rundown:</p>
      <p>vista - maybe not so bad, but a little bit too display'y<br>
      versa - too old fashioned<br>
      sansa - too rough'n'tuff for a bank<br>
      neue sans - too generic for branding<br>
      leitura - again too generic<br>
      absara - too bizarre for a bank<br>
      legato - again too old fashioned<br>
      klavika - more contemporary and visible, but perhaps too cold<br>
      kievit - again too generic and old fashioned</p>
      <p>Why not something whit a little more charcter (in general)? The face should be recognizable and unique to the bank. Also the friendly roundness is not really found in your examples, and Sauna is spoken for...</p>
      <p>Have a look at <a href="http://www.fontpartners.com/" title="http://www.fontpartners.com/">http://www.fontpartners.com/</a> FP Dancer might be what you're looking for.</p>
