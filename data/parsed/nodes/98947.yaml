  html: <p>I'll spare you my history (and histrionics) on this subject, but, long story short, I'm seeing more and more pamphlets and directories that come with a clear plastic cover on the front but not the back. To me, it degrades and cheapens (the perception of) the product. Is this the "new normal" in financially strapped times? Or is this a counter-productive cost-cutting measure?</p>
