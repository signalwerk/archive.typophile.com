      <p>Chris, the booklet in your photo has a <a class="freelinking external" href="http://www.youtube.com/user/mybinding?v=0MNB5r8bEsc&amp;feature=pyv" rel="nofollow">Wire-O binding</a>. </p>
      <p>Other options are <a class="freelinking external" href="http://www.youtube.com/user/mybinding?v=_P4l20OETuw&amp;feature=pyv" rel="nofollow">spiral (or coil) binding</a>, and <a class="freelinking external" href="http://www.youtube.com/watch?v=n1b5OPCOJvM" rel="nofollow">plastic comb binding</a>. </p>
      <p>For shorter runs, what you mainly see is plastic comb binding. At my house, the plastic-comb-bound church directory sits in a rack on the kitchen counter and gets dog-eared and ketchup-stained. I wish somebody had thought to put a plastic cover on it.</p>
