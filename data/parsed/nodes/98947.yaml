    html: |-
      <p>Acetate cover front and back or acetate cover front, card back is normal with those instant binding machines.</p>
      <p>I find the card back is more practical, helps stop the document folding over when standing on a shelf. </p>
      <p>But these are rarely long-term documents, with small or no design budgets, so halving the acetate budget is probably justifiable.</p>
      <p>Tim</p>
