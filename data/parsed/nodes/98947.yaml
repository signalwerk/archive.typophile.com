    html: |-
      <p>It's functional and cheap, the 'plastic' side almost always points up, so there is no need to use it for the backside as well. </p>
      <p>The use of plastic for covers is, to me, already questionable if you want to do a class act. But it helps with lastability and is cheap. Sometimes a class act isn't needed.</p>
      <p>It's probably a choice based on 'how many people bother with the aesthetics of printed matter' Which isn't that high.</p>
