    html: <p>My type library isn't so extensive that I can say I have books about the types of the 60's and 70's, which is what I think you need. You might try Googling or using AbeBooks  to search for books with those keywords, or seek out a good library with a graphic arts section. For some reason this era seems to be one that the Solotype Catalog doesn't have very much for. If someone else here has some of the newer phototype catalogs, that might help, but the maddening thing is that many of those books don't have full alphabets. <br> <br>Why not just scan and digitize this, if this is the only thing you are replicating? You only need these letters, right?</p>
