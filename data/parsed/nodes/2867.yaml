    html: "<p>The more I look at it, I'm thinking it might be lettering. There are a lot of inconsistencies among the characters. Take a look at this, especially the A's: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/25157.gif\" alt=\"diff\"> <br> <br>It could just be distortion due to the low resolution of the scan, or it could indicate hand work. <br> <br>--Mark, down at the forensics lab</p>"
