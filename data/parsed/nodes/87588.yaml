      <p><em>Their faith in my project is heartening.</em></p>
      <p>They will get a good price on having their work nicely printed in letterpress, with some publicity to boot.<br>
      What have they got to lose?<br>
      Either their artwork already exists, or they won't create it unless you raise the requisite funds.<br>
      The real faith is being exercised by those not on your artist list, who pledge funds for their rewards, sight unseen.<br>
      It might help your project if you could persuade one or two of the artists to produce poster art specifically for this project, and show these rewards now. That would appeal to those who are interested in exclusive art prints.</p>
      <p>Frankly, I don't think it's a good idea to mention Ink Dial if you don't already have patent and trademark protection in place.</p>
      <p>I would imagine that commercial paint manufacturers (eg Behr) use something similar to "dial up" colors, adding pigments to a neutral base.</p>
      <p>Another benefit to non-printers: it's a green product in that it reduces ink wastage.</p>
