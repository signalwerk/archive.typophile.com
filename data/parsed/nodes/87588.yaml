    <p>Dear Typophile friends</p>
    <p>I would appreciate you taking a moment and giving <a href="/wiki/www.kickstarter.com/projects/chouinard/the-ink-dial/" class="freelinking" rel="nofollow">my printing-related Kickstarter</a> a look-see. (You can also find it inkdial.com as well.)</p>
    <p>I’m not sure what any typographers would do with a tool to measure printing ink, but I think the rewards are particularly interesting. Perhaps some of you are friends, fans, colleagues, even collectors of the amazing artists who’ve graciously donated work for me to print in limited editions for kickback. </p>
    <p>Speaking of whom, check out some of the amazing artists who’ll be making prints:</p>
    <p>1. <a class="freelinking external" href="http://www.bantjes.com/" rel="nofollow">Marian Bantjes</a></p>
    <p>2. <a class="freelinking external" href="http://alanblackman.com/" rel="nofollow">Alan Blackman</a></p>
    <p>3. <a class="freelinking external" href="http://andrewbyrom.com/" rel="nofollow">Andrew Byrom</a></p>
    <p>4. <a class="freelinking external" href="http://www.typerror.com/" rel="nofollow">Michael Clark</a></p>
    <p>5. <a class="freelinking external" href="http://www.michaeldoret.com/" rel="nofollow">Michael Doret</a></p>
    <p>6. <a class="freelinking external" href="http://edfella.com/" rel="nofollow">Ed Fella</a></p>
    <p>7. <a class="freelinking external" href="http://er-h.com/" rel="nofollow">Eric Hanson</a></p>
    <p>8. <a class="freelinking external" href="http://lmgtfy.com/?q=carl+kurtz+calligraphy" rel="nofollow">Carl Kurtz</a></p>
    <p>9. <a class="freelinking external" href="http://lmgtfy.com/?q=carl+rohrs+calligraphy" rel="nofollow">Carl Rohrs</a></p>
    <p>10. <a class="freelinking external" href="http://www.mysticbluesigns.com/engraving.html" rel="nofollow">Yvette Rutledge</a></p>
    <p>11. <a class="freelinking external" href="http://www.paulshawletterdesigncom/" rel="nofollow">Paul Shaw</a></p>
    <p>12. <a class="freelinking external" href="http://www.facesofgm.com/2011/06/30/susan-skarsgard-designing-a-rich-and-interesting-career/" rel="nofollow">Susan Skarsgård</a></p>
    <p>13. <a class="freelinking external" href="http://www.johnstevensdesign.com/" rel="nofollow">John Stevens</a></p>
    <p>14. <a class="freelinking external" href="http://www.stonetypefoundry.com/" rel="nofollow">Sumner Stone</a></p>
    <p>15. <a class="freelinking external" href="http://www.jackunruh.com/" rel="nofollow">Jack Unruh</a></p>
    <p>Their faith in my project is heartening. </p>
    <p>If you can’t pledge, I would tremendously appreciate it if you could simply help get the word out. Every little bit of exposure by any ounce of effort will make a difference.</p>
    <p>Thank you from the bottom of my ink encrusted heart.</p>
    <p>Terry</p>
