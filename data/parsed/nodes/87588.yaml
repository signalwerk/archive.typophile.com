      <p>Thank you Nick. You make many good points.</p>
      <p>A few of the artists really wanted to be involved but they could only offer me work they'd already created. Others, most in fact, are creating original work for this project. Quickly off the top of my head I know Sumner Stone, Marian Bantjes &amp; Susan Skarsgard are all in the process of creating original work.</p>
      <p>I understand and share your trepidation about patent &amp; trademark concerns. I am failing to post a trademark symbol after the words Ink Dial™. This I understand grants me a measure of protection until the paperwork has cleared. Kickstarter made it clear that no one will pledge unless they can see the thing. On the other hand, what counsel I've received from patent attorneys is clear: I'd be a fool to utter one word about this until I am ready to take orders &amp; ship product. I am erring on the side of caution as best I can. WIthout the Kickstarter I have no other means to afford the protective paperwork.</p>
      <p>The idea was inspired years ago by standing in line waiting for my paint to be mixed at the hardware store. There exist large computer-operated ink distribution systems for massive offset presses, but my tool is intended for "micro-use" I call it. It not only reduces the waste of mixing too much ink but solves other ink maintenance problems.</p>
      <p>My gratitude knows no end. I thank the artists with every correspondence and I thank those of you who've pledged already cleaning 20% of my goal within the first week.</p>
      <p>Thanks again Nick. Discussion is just one of many ways to spread the word.</p>
