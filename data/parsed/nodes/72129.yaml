  html: |-
    <p>Opentype has a major flaw in it. The limited size of the GPOS subtable is set at 64KB. That puts a cap on the amount of Kerning pairs a font can have. Most people will probably never go over the amount alloted but for those of us who do it really puts a damper on making fonts. I know House Industries had the same problem and posted a video on it. I am not sure what Microsoft can do at this point to fix it.  Anybody who is involved with the opentype division at Microsoft, could you please pass this note to them.<br>
    Thanks!</p>
  html_clean: |-
