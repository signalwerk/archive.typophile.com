    html: |-
      <p>This was addressed nine years ago. The "extension" lookuptype 9 for GPOS (lookuptype 7 for GSUB) was added to the OpenType spec with version 1.3, released in April 2001.</p>
      <p>Now, be warned that some older apps and operating systems may not support extension lookups, but that is not something that can be addressed by the spec.</p>
      <p>This is arguably just a workaround for a limitation in the format overall, but changing OpenType to use four-byte offsets instead of double-byte offsets would be a huge and highly incompatible change. Maybe some day there will be strong enough reason to do that, but I'm not expecting it will necessarily happen in my lifetime.</p>
      <p>Cheers,</p>
      <p>T</p>
