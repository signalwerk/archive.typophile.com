      <p>How can I measure the GPOS subtable size in FontLab? I'd like to be able to expand kerning classes to squeak in just below the 64k limit.</p>
      <p>Ideally, FontLab would have an option to expand kerning classes to fill the remainder of the GPOS subtable space. In the background, it would test compile, check the remaining GPOS subtable space and calculate how many pairs could be squeezed in.</p>
      <p>A not-as-good but acceptable feature would be to produce an error message if the 64k limit was exceeded.</p>
