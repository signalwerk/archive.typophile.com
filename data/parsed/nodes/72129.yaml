      <p>This reminds me of a previous Microsoft "oversight" – the infamous 640k restriction. Sounds like the short-sighted attitude is well entrenched in some minds.</p>
      <p>I don't agree with Thomas' pessimistic timeframe though, just to quote Mr Gates:</p>
      <p>"I have to say that in 1981, making those decisions, I felt like I was providing enough freedom for 10 years. That is, a move from 64k to 640k felt like something that would last a great deal of time. Well, it didn't - it took about only 6 years before people started to see that as a real problem."</p>
      <p>(1989 speech on the history of the microcomputer industry)</p>
      <p>So, perhaps there is hope for the GPOS...</p>
