      <p>Yup, limited to 10,920 pairs in apps that are sticklers for that aspect of the spec.</p>
      <p>Individual apps faced with more than 2K or 4K pairs in a flat kern table may exhibit various kinds of failures. This was a serious problem about a decade ago, and although I expect the situation is much improved, I don't recall if anybody has done rigorous testing on it recently.</p>
      <p>Cheers,</p>
      <p>T</p>
