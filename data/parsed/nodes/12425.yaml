    <p>The popular practice of creating a new typeface that closely hews to existing designs. Famous revivals include the various 20th century interpretations of the types of <a href="/wiki/Claude%20Garamond" class="freelinking" rel="nofollow">Claude Garamond</a>, generally bearing his name; <a href="/wiki/Bruce%20Roger" class="freelinking" rel="nofollow">Bruce Roger</a>'s <a href="/wiki/Centaur" class="freelinking" rel="nofollow">Centaur</a>, a revival of <a href="/wiki/Nicolas%20Jenson" class="freelinking" rel="nofollow">Nicolas Jenson</a>'s types; and <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>, a revival of turn of the century <a href="/wiki/grotesk" class="freelinking" rel="nofollow">grotesk</a>s such as <a href="/wiki/Akzidenz%20Grotesk" class="freelinking" rel="nofollow">Akzidenz Grotesk</a>. The difference between "revival" and "plagiarism" is mainly a matter of acknowledging one's influences; revivals are controversial within typographic circles precisely because they bespeak a lack of imagination on the part of the designer. At the same time, waves of revivals typically accompany each new typesetting technology, as typographers try to replace beloved favorites from earlier generations of technology. Much of digital typography has revolved around revivals when there hasn't been outright piracy of existing designs.</p>
    <p>The term is also fairly flexible, encompassing not only close copies of existing designs. Therefore <a href="/wiki/Stanley%20Morison" class="freelinking" rel="nofollow">Stanley Morison</a>'s <a href="/wiki/Times%20New%20Roman" class="freelinking" rel="nofollow">Times New Roman</a> can be said to be a revival of <a href="/wiki/Plantin" class="freelinking" rel="nofollow">Plantin</a> types, and <a href="/wiki/Zuzana%20Licko" class="freelinking" rel="nofollow">Zuzana Licko</a>'s personal and idiosyncratic <a href="/wiki/Filosofia" class="freelinking" rel="nofollow">Filosofia</a> can be called a revival of <a href="/wiki/Bodoni" class="freelinking" rel="nofollow">Bodoni</a>.</p>
