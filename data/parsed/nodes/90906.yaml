    html: <p>In Sweden (and I believe other Scandinavian countries) an En Dash is used instead of an Em dash for the conversation dash. I'm assuming it has a separate codepoint so as to enable coutry/language-specific alternates without messing with the "real" Em dash? (Not that it matters much. In Sweden the Em dash is as far as I know only used for one thing these days – omitting the author's name in repeated references in a bibliography.)</p>
