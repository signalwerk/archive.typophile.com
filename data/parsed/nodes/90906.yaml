    html: <p>I've read those before but they really don't answer my question. Besides perhaps Math characters, Unicode don't encode character based on the semantic meaning and if does something like encoding specifics "glyphs" is for compatibility with other stuff. The em dash don't seems to having to look any different when used either for parenthetical text nor quotations (I speak Spanish and I use it regularly for both) so I'm intrigued about what is the purpose of the 'horizontal bar' at all.</p>
