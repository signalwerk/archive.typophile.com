      <p>The length of an em dash in contemporary typefaces these days tends to vary quite a bit and often does not measure an actual em. In my own work, for instance, I generally prefer an em dash which is on the order of 75–80% of an em, and I include modest sidebearings. This seems to work well for contemporary usage (current American practices, anyway).</p>
      <p>However, there are some traditions that prefer (or even demand) a nominal em dash — i.e., one that measures precisely a full em. I believe Spanish is one of these.</p>
      <p>And there are some situations where a full-length, nominal em dash may be preferable — building three-em dashes for bibliographies, for instance. </p>
      <p>The norm in Font Bureau fonts these days (I hesitate to call it a standard) is to provide both a “designed” em dash, according to the type designer’s preference, as the default, plus a “nominal” em dash which measures a full em and has no sidebearings. The default is, of course, encoded u+2014, while the nominal em dash is encoded as u+2015 horizontal bar. We provide a {locl} substitution for Spanish, as well as a dedicated stylistic set {ss18} for accessing the nominal dashes, for those who prefer.</p>
      <p>(We provide a similar pair of en dashes, but the nominal en dash is not assigned a unique code point.)</p>
