    <p>Hi there.</p>
    <p>I need to provide a short description about my typeface for a publication (deadline: today!), and as I'm not sure about a detail, I need some advices from experimented type designers. Here's my text:</p>
    <p>Chiavari is an elegant stencil which makes it a fashionable typeface for display uses, headlines and signage. Chiavari explores some particularities of both modern and renaissance typefaces, oscillating between a vertical and an oblique axis. It plays on the disappearance of the hairlines while geometric serifs and rectangular thin strokes give it a radical and modern twist. </p>
    <p>I have a doubt about the axis theory, witch in my case is mostly vertical, but on all curves, I made a pen rotation, as you do when you wanna draw a oblique axis based typeface.</p>
    <p>It would be awesome if you could sen me your thoughts.<br>
    Thank you!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chiavari1_5513.png"></div><div class="imageWrap"><img src="http://typophile.com/files/chiavari2_4515.png"></div><p></p>
