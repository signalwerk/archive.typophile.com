  html: <p>Our esteemed colleague, the sometimes unsympathetic Michael Everson, has embarked upon a project to <a href="http://phonetic-blog.blogspot.ca/2012/06/casing-ipa.html" title="Casing the IPA" rel="nofollow">transliterate <cite>Alice in Wonderland</cite> in IPA phonetics</a>, with full upper and lower case. (John Wells, who broke this red-hot newsflash on his blog, later <a href="http://phonetic-blog.blogspot.ca/2012/06/cursives.html" title="Cursives!" rel="nofollow">complained about confusability of <cite>æ</cite> and <cite>œ</cite> digraphs</a>.)</p>
