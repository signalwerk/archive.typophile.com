    html: "<p>Here’s an interesting puzzle: how do you uppercase a small caps symbol? In the IPA there are a couple of them: ʙ, ʟ, ɢ, ɴ, ʀ, ʜ, ʛ, ɪ, ʏ, ɶ. Everson didn’t have to deal with any of these because they represent sounds that aren’t used in English. There are a bunch of other ones used in non-IPA phonetics inventories, like ᴀ, ᴁ, ᴃ, ᴄ, ᴅ ᴆ, ᴇ, ꜰ, ᴊ, ᴋ, ᴌ, ᴍ, ᴎ, ᴏ, ᴐ, ᴕ, ᴘ, ꝶ, ꜱ, ᴛ, ᴜ, ᴠ, ᴡ, ᴢ, and ᴣ. There are even Greek ones around like ᴦ, ᴧ, ᴨ, ᴩ, and ᴪ. Even Cyrillic makes an appearance with ᴫ. There aren’t Unicode case pairs for any of these, but how would someone design an uppercase version of a small cap letter without it looking the same as the ordinary uppercase?</p>"
    html_clean: "<p>Here’s an interesting puzzle: how do you uppercase a small caps symbol? In the IPA there are a couple of them: ʙ, ʟ, ɢ, ɴ, ʀ, ʜ, ʛ, ɪ, ʏ, ɶ. Everson didn’t have to deal with any of these because they represent sounds that aren’t used in English. There are a bunch of other ones used in non-IPA phonetics inventories, like ᴀ, ᴁ, ᴃ, ᴄ, ᴅ ᴆ, ᴇ, ꜰ, ᴊ, ᴋ, ᴌ, ᴍ, ᴎ, ᴏ, ᴐ, ᴕ, ᴘ, ꝶ, ꜱ, ᴛ, ᴜ, ᴠ, ᴡ, ᴢ, and ᴣ. There are even Greek ones around like ᴦ, ᴧ, ᴨ, ᴩ, and ᴪ. Even Cyrillic makes an appearance with ᴫ. There aren’t Unicode case pairs for any of these, but how would someone design an uppercase version of a small cap letter without it looking the same as the ordinary uppercase?</p>"
