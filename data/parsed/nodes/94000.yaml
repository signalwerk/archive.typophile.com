    html: |-
      <p>Well, if Michael is using uppercase in his <em>Alice,</em> then he is not really using IPA, since the IPA alphabet has no uppercase (and doesn't need one).</p>
      <p>Joe, I think 'transliterating' is the wrong term to use here: transliteration refers to script-to-script text mapping. The IPA alphabet provides for phonetic transcription of spoken language, which I presume is what Michael is doing: i.e. transcribing the oral pronunciation of the text. And that's an odd project, since English pronunciation isn't exactly standardised. I wonder, is the transcription how Michael pronounces it? how Dodgson would have pronounced it? how someone in the Ozarks would pronounce it?</p>
