      <p>Hi again:</p>
      <p>I would choose a sans for the text for vertical and horizontal compactness... however Minion is a good choice tho, but you might like Karmina too (it has a little more personality without giving up the efficiency): <a href="http://www.type-together.com/Karmina" title="http://www.type-together.com/Karmina">http://www.type-together.com/Karmina</a></p>
      <p>I almost forgot—FF UNIT. This font is dead center neutral and is compact too:<br>
      <a href="http://www.fontshop.com/search/?q=unit&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=unit&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=unit&amp;x=0&amp;y=0</a></p>
      <p>Mikey :-)</p>
