      <p>I have to dissent against Univers—the default choice for annual reports and manuals for eons and it has the personality of a CAT scan.</p>
      <p>Flama accomplishes the same things, has more personality (but is still neutral) and costs significantly less... and not everyone and their grandmothers design agency uses it.</p>
