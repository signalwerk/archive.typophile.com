  html: |-
    <p>I need to design a manual for a company that I work for. The subject matter is quite dry; surveying, sampling and data collecting protocol for a mining company. I am going to try to make it a bit more interesting with diagrams, and photos.</p>
    <p>What might be a good font choice for this sort of document? I was thinking of Minion Pro, but would like to have something that has more of a modern feel..</p>
    <p>Thanks!</p>
