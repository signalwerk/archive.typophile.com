    html: <p>For what it's worth, Bison is the original name I think. The design is from 1935 by Julius Kirn for the Weber foundry (Berthold later acquired the design, and perhaps the foundry?). Bitstream and URW, who were probably the first to digitize the design, were apparently allowed to distribute it if they used other names. Jaspert states that 'Blizzard cut by Trennert is identical' to Bison, so that is apparently where URW got their name for it.</p>
    html_clean: <p>For what it's worth, Bison is the original name I think. The design is from 1935 by Julius Kirn for the Weber foundry (Berthold later acquired the design, and perhaps the foundry?). Bitstream and URW, who were probably the first to digitize the design, were apparently allowed to distribute it if they used other names. Jaspert states that 'Blizzard cut by Trennert is identical' to Bison, so that is apparently where URW got their name for it.</p>
