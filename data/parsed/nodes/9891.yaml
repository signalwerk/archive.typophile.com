  - id: 62991
    user: 1133
    date: 2005-03-23T16:32:00
    date_raw: 23.Mar.2005 4.32pm
    votes: null
    html: "<p>BTW, the reason many Adobe multilingual OpenType fonts do not exhibit this buggy behavior is... that there used to be (I'm not sure if there still is) a mis-behavior (sort of \"buglet\") of the Adobe FDK for OpenType that automatically turned on the flag indicating support for the Greek codepage even if just the Omega and the mu characters were included.  <br> <br>As we know, these characters are included in most Western and also Western+CE fonts because they're in the MacOS Roman codepage. According to the spec and general reason, a flag indicating support for a given codepage in a font should only be set if the font includes all or, at least, most characters of that codepage. But indeed, the Adobe FDK for OpenType logic that controlled the codepage support flags used to be *very liberal*.  <br> <br>Therefore, a large majority of Adobe OpenType fonts -- even those that only contain Omega and mu -- indicate the support of the Greek codepage. This leads to various problems in applications such as Microsoft Word, Internet Explorer, Firefox etc. For example, under certain circumstances, Internet Explorer may pick one of these fonts as the basic text font for Greek even if the font only contains these two Greek glyphs.  <br>Since FontLab 4 uses the Adobe FDK for OpenType (AFDKO) code to produce OpenType fonts, in the 4.0 and (I believe) 4.5 versions, FontLab behaved similarly. When an OpenType PS (.otf) font was produced, FontLab 4.0 and 4.5 ignored the Supported Codepages settings in the Font Info dialog and used the very \"liberal\" logic of the AFDKO code to generate the flags.  <br> <br>A side-effect of this mis-behavior was that, indeed, the presence of the Greek flag prohibited most of AFDKO- or FontLab-made OpenType PS fonts from being listed in the non-Western part of the font list in Apple and Adobe applications.  <br> <br>So the bug in the Adobe applications e.g. InDesign, and in Mac OS X was initially overlooked due to a bug in the AFDKO code that was used by Adobe to produce their OpenType fonts, and is also used by FontLab.  <br> <br>As I explained above, FontLab 4.0 and 4.5 ignored the Supported Codepage settings in Font Info when making OpenType PS fonts and used the AFDKO auto-logic. Since the stand-alone AFDKO version does not have explicit means to set the codepage flags, the use of the auto-logic in the stand-alone AFDKO did make sense (although the problem of course was that the logic was flawed.) But since FontLab has the Supported Codepage dialog to set these fields explicitly, the product should use them rather than always use the AFDKO logic. So with FontLab 4.6, we stopped using the AFDKO logic and started using the Font Info settings (that were always used in OpenType TT fonts, BTW).  <br> <br>At that moment, the Apple/Adobe problem with listing the OpenType PS fonts in the non-Western section manifested itself. So far, it was \"covered\" by the overzealous AFDKO logic that unvoluntarily set the Greek flag. But of course with FontLab 4.6, the users did not explicitly set the Greek flag, since logically, this does not make sense. But indeed, the fonts without that flag tend to show up in the non-Western section...  <br> <br>Of course setting flags for codepages that are not truly supported in the font is a bad idea. This was a bad idea in AFDKO, it was bad that most Adobe OpenType fonts have this flag set.  <br> <br>So the thing is: a superflous Greek codepage flag makes some applications (Word, IE etc.) think that the font supports full Greek. But this manifests itself only to people using Greek, which is a minority. The absence of the Greek codepage flag makes other applications (InDesign, various OS X apps) put the font into the non-Western section. This clearly affects many more users, namely all Roman script users in West, Central and East Europe, in North America and all around the world.  <br> <br>Setting the Greek flag is a hack. Yet, I believe this is \"less worse\" than not using it. After Apple and Adobe have fixed their applications, the font developers can update their fonts and remove the superflous Greek flag.  <br> <br>\"It's Greek to me\" truly gets a new meaning here...  <br> <br>Regards,  <br>Adam</p>"
