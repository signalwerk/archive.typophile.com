    html: <p>The fact that you're on Windows simplifies things. Don't have to worry about FOND IDs or the system font cache. <br> <br>Adobe font caches can be all over. Often (but apparently not always) in the same location as the fonts. The "adobefnt*.lst" files are the caches, where "*" is usually a two-digit number. <br> <br>Quitting and relaunching with the fonts not installed does indeed do the same thing. <br> <br>As long as you've made sure that the fonts are okay, it may be best to do nothing and let the OS makers and Adobe sort out the problem. <br> <br>That being said, in this particular case, if you get fonts in the same family being separated into different sections of the font menu, it's best to sort that out. With any luck it will turn out to be a caching problem. <br> <br>T</p>
    html_clean: <p>The fact that you're on Windows simplifies things. Don't have to worry about FOND IDs or the system font cache. <br> <br>Adobe font caches can be all over. Often (but apparently not always) in the same location as the fonts. The "adobefnt*.lst" files are the caches, where "*" is usually a two-digit number. <br> <br>Quitting and relaunching with the fonts not installed does indeed do the same thing. <br> <br>As long as you've made sure that the fonts are okay, it may be best to do nothing and let the OS makers and Adobe sort out the problem. <br> <br>That being said, in this particular case, if you get fonts in the same family being separated into different sections of the font menu, it's best to sort that out. With any luck it will turn out to be a caching problem. <br> <br>T</p>
  - id: 62979
    user: 1344
    date: 2005-03-23T04:57:00
    date_raw: 23.Mar.2005 4.57am
    votes: null
    html: "<p>Paul, there is a file AdbW1Fnt07.lst where every installed font has its own entry. Every font also has following line:  <br> <br>WritingScript:Roman <br> <br>Instead of Roman could be Cyrillic etc. <br> <br>Unfortunately, when you regenerate font file (with correct Script) and install the new one, the entry in this database file will remain wrong (in your case Cyrillic). <br> <br>Before you install newly generated fonts, delete particular entries in the AdbW1Fnt07.lst file - the structure of the file is very easy.</p>"
    html_clean: "<p>Paul, there is a file AdbW1Fnt07.lst where every installed font has its own entry. Every font also has following line:  <br> <br>WritingScript:Roman <br> <br>Instead of Roman could be Cyrillic etc. <br> <br>Unfortunately, when you regenerate font file (with correct Script) and install the new one, the entry in this database file will remain wrong (in your case Cyrillic). <br> <br>Before you install newly generated fonts, delete particular entries in the AdbW1Fnt07.lst file - the structure of the file is very easy.</p>"
