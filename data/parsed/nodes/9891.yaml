  - id: 62974
    user: 909
    date: 2005-03-22T14:39:00
    date_raw: 22.Mar.2005 2.39pm
    votes: null
    html: <p>The answer is often both. <br> <br>OS X has had various font related bugs. One was  associated with how it maps glyphs to characters for fonts with extended language support in apps that are not doing Unicode. Sometimes weird stuff would show up in what ought to have been the regular MacRoman range. I believe this was fixed in 10.3.6 IIRC. <br> <br>OS X and InDesign both have a notion of being able to identify the primary codepage of a font. This is an obviously questionable idea in today's universe of multi-lingual fonts, but they try to do it. InDesign uses this info to group fonts in its font menus, so all the Cyrillic fonts will be in one group below the western fonts, and so on. <br> <br>First, in addition to the obvious problems with the idea itself, there have been errors in the heuristics used by both OS X and InDesign to do this. InDesign has fixed some of its errors, but if the font is installed at the OS level, InD will simply query the OS for info. <br> <br>Adobe recognizes that there is a real problem here, and hopes to significantly improve this area in the future. However, I can't comment specifically on features and bug fixes for unannounced future products. <br> <br>Even if it solved the problem, I wouldn't recommend labeling your fonts as supporting codepages they do not in fact support. That sort of thing is bound to get you into trouble. <br> <br>If within a given family, some fonts are sorting differently than others, I would check your settings for supported codepages and make sure they are consistent for all fonts in the family. After that, I'd try cleaning both the OS X font cache and the Adobe font cache files. Also see if the behavior is the same if the font is installed in a private Adobe fonts location rather than in the Mac OS. <br> <br>Regards, <br> <br>T</p>
