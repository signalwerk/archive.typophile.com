    html: "<p>Mark,  <br> <br>&gt; Why can't FontLab generate an extended  <br>&gt; character set OT font that works without  <br>&gt; resorting to hacks???  <br> <br>This reads as if you were suggesting that the situation is somewhat FontLab's fault. As Thomas Phinney explained above, it isn't. This problem occurs with some (but not all) multilingual OpenType fonts created by Adobe using their FDK for OpenType.  <br> <br>But altogther, it's really not an issue of the applications that create the fonts. The fonts are fine and conform to the specifications. Currently, it's a problem of systems and applications that use the fonts.  <br> <br>I sincerely hope that both Apple and Adobe fix this behavior. I strongly recommend that every developer whose fonts are affected by this bug makes an archive with a documented case (detailed description, sample fonts, screenshots), puts that archive somewhere on your website (not publicly linked) and then writes and submits a bug report on that to Adobe and Apple. Your bug report should include a detailed description of the problem and a link to the archive containing the attachments.   <br> <br>Please use the bug report forms:  <br><a href=\"http://www.adobe.com/misc/bugreport.html\" target=\"_blank\">http://www.adobe.com/misc/bugreport.html</a> <br><a href=\"http://developer.apple.com/bugreporter/bugrptform.html\" target=\"_blank\">http://developer.apple.com/bugreporter/bugrptform.html</a> <br> <br>If you wish, you can also submit a copy of the bug report to us (adam at fontlab dot com). We have already documented some cases and filed a report, but from my experience I can say, the more problem reports and complaints the better.  <br> <br>Regards,  <br>Adam</p>"
