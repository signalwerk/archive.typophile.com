  - id: 62981
    user: 1043
    date: 2005-03-23T09:27:00
    date_raw: 23.Mar.2005 9.27am
    votes: null
    html: "<p>Okay. <br> <br>So this is a problem that Apple and/or Adobe will fix eventually, so mucking around with adding unsupported codepages (even though it seems to work, at least in some cases) should be avoided. <br> <br>In the mean time, I tried a bunch of stuff this morning trying to change things in the fonts, clearing caches, restarting, voodoo, standing on my head while crossing my fingers, etc. with no success.  <br> <br>Out of desperation, I waded through the message boards at the FontLab Forums (why in hell there is no way to search them is beyond me, and half the time Safari tries to download the .msnw pages instead of displaying them, arrgh!), and lo and behold, I found a work-around devised by John Butler that appears to be reliable and doesn't involve doing anything dodgy to the fonts themselves.  <br> <br>Here it is: <br> <br>In addition to installing the problematic OTF font in the usual way (I use FontBook), put a copy in [your hard drive name here]/Library/Application Support/Adobe/Fonts/ . <br> <br>This is actually slightly modified from John's version. He says to put them in a folder for a specific Adobe application, but this one is used by all of them (presumably) and seems more logical. <br> <br>The way it seems to work is that Adobe apps look in Adobe's font directories first, correctly identify the main script supported and place it in the correct section of the font menu. The other copy installed in the system font directory is ignored, but makes the font available to non-Adobe apps. <br> <br>I don't know if a similar procedure would work with Windows. I don't have Windows copies of Adobe apps to test. <br> <br>This general idea was touched on above when Thomas mentioned moving fonts to Adobe's private font locations for testing purposes, but that hides the fonts from other apps. The key thing that makes this work is putting copies of problem fonts in both Adobe and system locations. <br> <br>So far, I haven't found any problems with this work-around, and it seems like it would be a simple enough procedure to explain to customers, not that this sort of thing should be necessary in the first place.</p>"
    html_clean: "<p>Okay. <br> <br>So this is a problem that Apple and/or Adobe will fix eventually, so mucking around with adding unsupported codepages (even though it seems to work, at least in some cases) should be avoided. <br> <br>In the mean time, I tried a bunch of stuff this morning trying to change things in the fonts, clearing caches, restarting, voodoo, standing on my head while crossing my fingers, etc. with no success.  <br> <br>Out of desperation, I waded through the message boards at the FontLab Forums (why in hell there is no way to search them is beyond me, and half the time Safari tries to download the .msnw pages instead of displaying them, arrgh!), and lo and behold, I found a work-around devised by John Butler that appears to be reliable and doesn't involve doing anything dodgy to the fonts themselves.  <br> <br>Here it is: <br> <br>In addition to installing the problematic OTF font in the usual way (I use FontBook), put a copy in [your hard drive name here]/Library/Application Support/Adobe/Fonts/ . <br> <br>This is actually slightly modified from John's version. He says to put them in a folder for a specific Adobe application, but this one is used by all of them (presumably) and seems more logical. <br> <br>The way it seems to work is that Adobe apps look in Adobe's font directories first, correctly identify the main script supported and place it in the correct section of the font menu. The other copy installed in the system font directory is ignored, but makes the font available to non-Adobe apps. <br> <br>I don't know if a similar procedure would work with Windows. I don't have Windows copies of Adobe apps to test. <br> <br>This general idea was touched on above when Thomas mentioned moving fonts to Adobe's private font locations for testing purposes, but that hides the fonts from other apps. The key thing that makes this work is putting copies of problem fonts in both Adobe and system locations. <br> <br>So far, I haven't found any problems