    date: 2005-03-23T18:11:00
    date_raw: 23.Mar.2005 6.11pm
    votes: null
    html: <p>I don't think using the hack is a good idea. I've been arguing for our changing the FDK code in this area, because I think the FDK behavior is basically a bug. Replicating a bug by hand seems goofy to me. <br> <br>If I may move this into a broader realm of font dev philosophy for a moment.... <br> <br>I understand that this is frustrating, but this is another one of the frequent cases in font development when we have a choice between doing something the right way, or making a font deliberately defective to deal with a temporary limitation. <br> <br>Fonts tend to stick around for 5, 10, even 20 years. They're not like other software in that regard. Whatever hacks you put in your released font, you may have to live with for a very long time indeed. <br> <br>Of course, if it will have limited/controlled distribution, or you have direct access to all the customers, that's a bit different. In such a case you may be able to roll out an upgrade whenever you want and reach all (or almost all) your customers. If you're lucky enough to be in that position, you can better afford to do such things. <br> <br>Regards, <br> <br>T</p>
