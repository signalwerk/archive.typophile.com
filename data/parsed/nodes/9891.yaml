    html: <p>Well, with certain applications, TexEdit (not to be confused with TextEdit) was the one I noticed, the fonts displayed in Geneva. In something else (I can't remember now what--I was trying lots of things very quickly) only some of the fonts in the family were listed in the menu. Granted, some of these problems may have been transient, having something to do with caches or whatever, although I did my best to delete all the caches every time I made the slightest change before reinstalling and testing the fonts again.  <br> <br>I might add that this is a very big family, 21 fonts, and it will double when I get to the italics. That factor may contribute to some of the problems I've been having, but it doesn't seem so. <br> <br>The thing that's troubling me now is that Quark doesn't recognize the fonts at all, regardless of whether I use the hack or not.</p>
