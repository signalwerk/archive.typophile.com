      <p>Actually, I'm kind of digging what he has. It's very <a class="freelinking external" href="http://i23.ebayimg.com/03/i/02/78/c5/1d_1_bl.JPG" rel="nofollow">Polo Ralph Lauren</a>, which says "rich white guys riding around in yachts" to me.</p>
      <p>My only change would be to bring down the size of the S in Pivatus, and extend "yachting" and the logo over it. Yeah, you lose some of the symmetry, but then when they inevitably make the boat captain's hats for the club, they can emphasize the "P". Maybe with little laurels.</p>
      <p>-Andrew Welfle</p>
