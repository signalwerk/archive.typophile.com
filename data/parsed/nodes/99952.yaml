      <p>Wow ! I didn't expect so many comments. Thanks to all of you !</p>
      <p>@hrant : It's the « core structures » that we are interested in. But the « hundreds of fine lines » – it's really an idea ! Is it technically possible (not too complicated at least) to accomplish that in TypeTool3 ? I mean I guess technically you cannot have a line in TypeTool ?</p>
