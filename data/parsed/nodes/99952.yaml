      <p>I had an ulterior motive. To be honest, your logo looked to me more like a logo for a machine shop than an arts festival. Sorry, but that was my reaction. So I was trying to think of ways to keep the same general treatment but add some elements to give it a look which I associate more with festivals (fun, energetic, colorful, artistic, exciting, etc.)</p>
      <p>But I find 5stars' sketch (suggested by hrant) an interesting direction to explore. It's softer and more artistic looking. Maybe try some different media (charcoal, watercolor, etc.) Or maybe juxtapose rigid, carefully-drawn elements with hand drawn ones.</p>
