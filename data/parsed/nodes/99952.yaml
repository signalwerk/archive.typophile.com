      <p>I would say the logo needs a lot of improvement. Stroke widths are inconsistent, diagonals are inconsistent as well. Take a look at the way letters are constructed and then rework your lettering. Logo, Font &amp; Lettering Bible by Leslie Cabarga is a good source of information if you need some reading about font designing.</p>
      <p>Regards</p>
