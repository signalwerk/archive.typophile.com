      <p>@5star : Thanks for the sketch ! The core forms are really more obvious now.</p>
      <p>And there's a technical question. Is it possible to automatically round corners in TypeTool ? Of course I would adjust and polish them after it. But automatic corner rounding would be a very good tool to get the initial impression.</p>
