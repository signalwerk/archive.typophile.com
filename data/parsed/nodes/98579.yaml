    <p>Hi all!<br>
    Here is a pic of the Tabio logotype<a href="http://1.bp.blogspot.com/_PV-IbUKEByA/TTCHTC3Xd_I/AAAAAAAAAy4/j6-TV-N4SY4/s1600/tabio-logo.jpg" rel="nofollow">Tabio logo</a>.<br>
    Tabio is a japanese producer of socks.<br>
    Considering the typography, more as a group of glyphs than as a business-related symbol, what do you think about this combination of styles between "T" and "abio"?</p>
