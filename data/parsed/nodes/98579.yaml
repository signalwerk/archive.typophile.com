      <blockquote><p>Do you mean that T has a softer, inflated feel and other glyphs have pointy parts? I think it works well, a moderate contrast within a wordmark is not that uncommon.</p></blockquote>
      <p>Yes, I meant this. I think in this case the contrast, although it is not really correct in the world of typography, allows the logotype to be recognizable and living. With a homogeneous typography it probably would not have been so identifying. But I consider that contrast not so moderate.</p>
      <blockquote><p>Their kerning on the other hand might be improved a bit :)</p></blockquote>
      <p>Yeah, the kerning is disastrous!</p>
