      <p>I use Suitcase for Windows and there isn't a feature that lets you export/import sets currently. I'm supposing that is because you'd have to remap all the fonts associated with the sets and Suitcase does not do this automatically.</p>
      <p>This might be a stretch, and I'm not saying it'll work, but you can try this...</p>
      <p>Install Suitcase to your new machine, don't start it up yet. Then duplicate your fonts onto your new machine making sure that the directory paths are exactly the same. ex: <strong> C:\Files\Font Directory\...</strong>. Then copy the content of your Extensis Suitcase directory from your old machine to your new machine. With Suitcase 9.2 it was everything in the Data folder, with Suitcase 11 it's much more and I'm not exactly sure so copy it all. Finally, start up Suitcase and see if it sets have been duplicated.</p>
      <p>If it doesn't work, I'd suggest uninstalling and reinstalling Suitcase to start with a clean slate then get to work doing all that wonderful Font Management that Suitcase neglects to do.</p>
