      <p>This would be easy if Extensis took the iTunes approach and installed all the fonts into a Master file and actually "managed" the fonts for you.</p>
      <p>I can easily equate a font's family as if it were an music album, then each of the weights are tracks in that album. The foundry would be equal to the musician's label and it's style would be equal to the music's genre. All are sortable if you drag and drop your music files into iTunes and let iTunes manage your music folder. Why hasn't any font software made a similarly featured solution is beyond me. Even in the most basic of senses it's a solid foundation for font management.</p>
      <p>Suitcase cuts the management corner and makes a shortcut to the folder where the font resides, if that font is removed or the file directory is changed, that shortcut is useless. And you'll have to reconnect the files, imagine if that was your music, how can you enjoy your music if you're so busy keeping it organized?</p>
