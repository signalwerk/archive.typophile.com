      <p>This is quite easy to do with FontExpert; you just back-up the Font Sets folder that FE creates when you first create your sets, and move it to the newly installed program directory. One caveat: if you've specified "shortcuts" when installing fonts/sets (rather than actually copying the fonts to the Font Sets folder), as above, you need to be sure that the font files are in the same location that they were when the sets were created.</p>
      <p>As for Suitcase, when I was using 9 I used the method above and it worked fine, but it irritated me that I had to make sure Suitcase wasn't running in the background (which it normally is), and then clone the program files. Yet another seemingly obvious feature that Suitcase either doesn't include or is tricky to make happen.</p>
