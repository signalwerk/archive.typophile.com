    <p>I teach design at a local arts college. I needed a font for movie poster credits and need to be able to extensively modify the font when needed. I decided, for copyright reasons, to make my own. In that case, I could modify away and if the font got out "into the wild" by accident, it copyright would not be an issue. I thought I would allow edu free use.</p>
    <p>I've never been happy with the various highly condensed sans faces. I'm not sure why. dugud is in it's early stages. Kerning has not yet been started. As I see the font, I think I'll produce a much thinner version as a companion font.</p>
    <p>Be that as it may.</p>
    <p>Whatdayathink?</p>
    <p>Regards,</p>
    <p>Doug</p>
