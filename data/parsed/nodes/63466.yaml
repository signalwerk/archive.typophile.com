    html: <p>The tails (a,q,Q,u) feel a little too hesitant. It the form is going to be different, then make the difference more pronounced. Any anomaly in this geometric font is going to be very noticeable, so make them look more intentional. See how the a and d baseline regions look eerily similar, yet noticeably different. I think these tails could extend a little further past the stem's vertical.</p>
