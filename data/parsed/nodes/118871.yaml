      <p>Interestingly, after some more poking around I noticed that <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/zapf-elliptical-711/" rel="nofollow">Bitstream’s Elliptical</a> looks suspiciously close to <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/melior/" rel="nofollow">Linotype’s Melior</a>?</p>
