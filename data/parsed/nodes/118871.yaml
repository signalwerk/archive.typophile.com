  html: <p>I just looked at the different Melior fonts over at <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/melior/" rel="nofollow">myfonts.com</a>. What's the difference between the "Melior Com" and "Melior Pro" and "Melior"? At Linotype there seems to be <a class="freelinking external" href="http://www.linotype.com/1222/melior-family.html" rel="nofollow">only one</a>, yet all claim to be from Linotype?</p>
