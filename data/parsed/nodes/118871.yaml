    date: 2014-08-20T16:44:00
    votes: null
    html: <p>Myfonts seems to make a difference between Melior in truetype, Melior Pro which is OpenType Postcript and Melior Com which is OpenType TrueType. It’s strange as Pro or Com would normally refer to language support and coverage, not to the file format.</p>
