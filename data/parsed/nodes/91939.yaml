      <blockquote><p>Top to bottom is the point size.</p></blockquote>
      <p>Then there's something happening in Illustrator that I don't get. </p>
      <p>I type a line of (say) Palatino Linotype at 80pt, and the distance from the descender line to the ascender line is 80px. When I select the object, a box outlines the area the text is in, a hair below the descender line and 10px-11px above the ascender line. The "transform" tool tells me that this box is about 92px tall.</p>
      <p>I type the same text in another font at 80pt, I get 74px from descender to ascender. The bounding box is maybe 5.5px below the descender and 8.5px above the ascender, and the transform tool says that the object is 89px tall.</p>
      <p>Obviously these bounding boxes in Illustrator have little, if anything, to do with the Bottom Bearing Line and the Top Bearing Line. I presume that these lines originate from: they were the physical edges of the piece of metal that the letterforms were carved into.</p>
      <p>Surely I'm not alone in finding this perplexing? I'd think that some standard for the vertical positioning of the letters would have evolved organically in the industry. And I'd think that design tools would make the bounding boxes of objects have some relation to that standard. What am I failing to understand here?</p>
