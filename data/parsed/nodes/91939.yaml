      <p>Traditionally, an x-height measurement is most often specified as a percentage of the ascender height (less frequently as a percentage of the cap height). However this assumes certain value ranges for descender depth and talus, so it's not a robust measure.</p>
      <p>In terms of a percentage of the Em, the typical x-height is way less than 70% - it's closer to 40%.</p>
      <p>If your SmallXT and LargeXT only vary in x-height*, you have to realize that that affects the relative sizes of the ascenders versus descenders, a relationship that would get thrown off, possibly to the point of the descenders ending up longer than the ascenders (generally a design flaw, at least in a text face).</p>
      <p>* BTW: <a href="http://typophile.com/node/81755" title="http://typophile.com/node/81755">http://typophile.com/node/81755</a></p>
      <p>Similarly, in your typesetting scenario, besides Mark's observation that the 16 point text will look darker, you will also see a difference in terms of the dimensions besides the x-height. Now, with 4-6 points of leading descenders being too long for example is rather moot; but the texture will indeed have a different feel (especially at those large sizes) partly due to the caps as well.</p>
      <p>&gt; Does a small x-height allow you to get away with tighter leading?</p>
      <p>Indeed, yes.</p>
      <p>&gt; is there any way of determining a typeface's x-height short of busting out Illustrator and measuring it?</p>
      <p>Not necessarily Illustrator, but no, there isn't.<br>
      Hey, you can't even really tell the point size!</p>
      <p>&gt; is there a standard unit used to measure/specify x-height?</p>
      <p><a href="http://typophile.com/node/15367" title="http://typophile.com/node/15367">http://typophile.com/node/15367</a><br>
      :-)</p>
      <p>IIRC Jorge de Buen was working on such a measurement system.<br>
      There was at least one other guy too.</p>
      <p>hhp</p>
