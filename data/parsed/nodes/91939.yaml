      <p>I didn't have to do my own sample. A pretty comprehensive one comes with the @font-face kit. In one block of text, they have the line-height at 1.1, and the descenders of one line overlap the ascenders of the next. The same is true at 1.25. </p>
      <p>There are example text blocks elsewhere with line heights of 1.4444 - 1.5. The space between lines actually looks quite nice and balanced, but in places where descenders and ascenders line up between lines they *just* miss each other by an almost-acceptable amount. (Functionally, this is equivalent to "using less leading for typefaces with a small x-height.")</p>
      <p>They line up the baselines and the "x-height line" (if that's the term for it).</p>
      <p>Of course there are other rendering problems, because Centaur has all those little details and graceful curves. And at "12 pt", the /o/ is comically way too large. I only picked Centaur because I knew it had a tiny x-height and would make a good contrast to Georgia; it's clearly not made for low-res screens.</p>
      <p>So, via a circuitous route, I learned what I wanted to.</p>
