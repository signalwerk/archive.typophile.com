      <blockquote><p>Should there be a standard baseline position? </p></blockquote>
      <p>Oh, I didn't say that there <em>should</em> be one. If there <em>was</em> one, I'd automatically take more interest in type designers who gleefully bucked the standard. But I <em>am</em> surprised that there isn't one.</p>
      <p>And I'll just take anything that my Adobe products say with a grain of salt. Maxim's picture tells the tale.</p>
      <p>I don't think I need the visuals, Kent; I see what you mean. Rather than aligning the Top/Bottom Bearing Line and letting the Baseline fly where it may, we now align the Baseline and let the (invisible) Top/Bottom Bearing Lines fly.</p>
      <p>I thank y'all for taking the time and the interest! I learned stuff.</p>
