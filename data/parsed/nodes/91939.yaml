      <p>@Amado:<br>
      <cite>But I s'pose what I'm driving at is: is it customary to take a typeface's x-height into consideration when choosing a line-height? Does a small x-height allow you to get away with tighter leading?</cite></p>
      <p>I see Hrant did already answer this one with a resounding yes, but I had to look carefully to find that answer.</p>
      <p>Typefaces with a small x-height, such as the more authentic old-style faces, are commonly used without any leading at all.</p>
      <p>Faces with large x-heights <em>can</em> be used without leading too - this happens when space is at a premium, and a cramped appearance is accepted. But if the intent is to get an appearance that is good by the standards of traditional book typography, leading will be used.</p>
      <p>So the advantage of a large x-height is greater flexibility. A face like Times Roman can be used for book typography - the fact that there will be wasted space between the lines that could have been used by longer ascenders and descenders is relatively minor. But unlike Caslon Old Style or Cloister Oldstyle, Times Roman (or, for that matter, Century Expanded) could <em>also</em> be used without leading to achieve a high density of text.</p>
      <p>So a printer that can afford only <em>one</em> text typeface probably is better off getting Century Expanded instead of Caslon or Garamond. (Of course, there is Caslon 540 which does have stubby descenders...)</p>
