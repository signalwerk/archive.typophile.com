      <p>The bounding box surrounding a highlighted letter may differ in different applications depending upon which vertical metrics the programmers decided to interpret. There are now several different metric fields in the font meta data. None of which is absolutely required to coincide with what used to be considered the body of the type, nor the virtual lines identified in Maxim’s diagram as Top/Bottom Bearing Line.</p>
      <p>I don’t know which Adobe Illustrator is following.</p>
      <p>In the Postscript format, the ascent + descent were obliged to sum to the em. But digital type is virtual. These various metrics have drifted further and further away from any physical absolutes, for various reasons.</p>
    html_clean: |-
