      <p>For most of the 20th century, in metal there were a few standardized schemes for the placement of the baseline on the body. Standard Line (also known as Point Line) was probably the most common. Art Line was another. </p>
      <p>Standardization was desirable because mixing types on a single line was driven by the physical relationships of top/bottom, and they would only line up if there was a common placement of the baseline.</p>
      <p>Nowadays, software takes the baseline as the reference point, so top and bottom are virtual and related to the origin/baseline, rather than the other way around. If that makes sense; might need visuals.</p>
    html_clean: |-
