    <p>Jul 25, 2007: Ordered RTR Albertan for $101.36. Have trouble downloading fonts. (Connection with server was lost after 50% download. Six times!)</p>
    <p>Jul 26, 2007: Try downloading fonts the next day: ""Your allotted download time for this softgood has run out." Emailed P22. They email me the fonts. </p>
    <p>Jul 27, 2007: I emailed them and told them that FOURTEEN of  the PS font files are ZERO byte files! They email me the correct files. I had a problem installing the PS fonts until I deleted all the *.INF files. I email them with screenshots.  I then discover one of the small cap fonts is mislabeled. (My word processing program showed RTF AlbertanSC  [bold] and RTF Albertan SC [regular]. The bold font should have been labeled RTF Albertan SC with a space between Albertan and SC.) I correct it with a font program that I have, but the PFM file is reduced from 12,614 bytes to 5,246. I ask for a corrected replacement. A total of six emails to/from exchanged today.</p>
    <p>July 30, 2007: from an email from P22: "We will be examining the Albertan data ASAP, but I am afraid that an explanation might not be possible until next week.  At this point, I do offer a full refund." I erroneously construe that "offer" as rhetorical and that they gave me a credit.</p>
    <p>August 17, 2007: 15 business days later I email P22 again and ask about the refund and the corrected font. They said, "due to other projects already in progress, Albertan was not the first on the list. However, it will be fixed in about a week or two. If you do not want to wait that long for a replacement file, I will need to send you a quick form to fill out for the refund. "</p>
    <p>August 18, 2007: I let them know I'll accept a 50% refund without a form otherwise send me a form for a full refund.</p>
    <p>August 20, 2007: The "refund" was not for my doing their beta testing, or for my time or aggravation, or their delay, or just for "good will." In an email they advise me that the refund is conditional, based on my deleting the fonts.  They further said "any file renaming is not possible before Sept. 1st, if deemed necessary."</p>
    <p>In the meantime, what happens to anyone else who orders RTR Albertan from P22?</p>
    <p>I have ordered fonts from P22 for more than a decade, but never with fonts or service like this.</p>
    <p>It happened once. Shame on them. But it won't happen twice!</p>
    <p>Am I expecting too much?</p>
    <p>Did P22 act honorably?</p>
