      <p>On September 14th, I got an email from Jim Wallis of P22. He gave me an explanation, an apology, corrected fonts, and an extra goodie.</p>
      <p>I'm most grateful for his response. He still wanted to know if I still wanted a refund (if I did, I wouldn't have waited so long) but I really do like Albertan.</p>
      <p>In retrospect (or maybe because of all the heat) I shouldn't have labeled this thread a "Horror" story. But excuse me if I expect type designers and type (re)sellers to know more about fonts than I do. But "stuff" does happen, in spite of our best efforts, whether we're selling cars, or toys from China, or fonts.</p>
      <p>I'm grateful for P22's response. In spite of their vastly expanded library, a much larger selection of fonts than when I first ordered from them more than a decade ago, they still like to claim they're "not a big company." </p>
      <p>Whatever. Their resolution of the problem satisfied me. Thank God I'm not a professional who had a deadline. And what about all those people who ordered this font before I did?</p>
      <p>Bottom Line: Thanks, P22.</p>
