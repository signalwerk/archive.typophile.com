      <p>With only 2 pages of thread contributions, Mr. Karsten is a novice to Typophile and perhaps even to fine graphic design. He has even stated he is not a pro. Regarding the matter he even asks <em>"Am I expecting too much?"</em> If it was respect- then yes.</p>
      <p>Stephen, the punch line is at Mr. Marsten's expense. His $101.36 expense. Not funny- not a joke. I think Mr. Marsten has been respectful here and tossing sarcastic quips is not acceptable. Mr. Giampa is apart of the P22 company and should have said nothing of the sort. Kegler was fine until he left his parting shot. Mr. Marten is not a type designer crony either like everyone else in this thread.</p>
      <p><em>"I know it may seem like a gang of apologists..." </em></p>
      <p>I appreciate your desire for balance in this thread and I agree with much of what you said and some others. I like the free flux of opinions for both 'sides' to maintain fairness. I'm not completely on Mr. Marston side. I would have certainly handled this whole transaction very differently from how Mr. Marston did. I would have picked up the telephone and spoke to a technician directly. In that way, no one can hide intentions behind emails and things happen much quicker as well. Better yet, [perhaps] p22 should have called him when the quantity of emails got out of hand. </p>
      <p>But here is the part where I strongly disagree:<br>
      <em>"A title written by someone who has a record of routinely attacking organizations in public rather than resolving his issues with direct communication."</em></p>
      <p>As for Mr. Martens threads you cited to show his deliberateness: </p>
      <p>"Who's Who?" has zero relevance here. That is Mr. Marten not knowing where to communicate typophile suggestions or concerns and asking for help.</p>
      <p>"TheSans Office - Help me find a place to buy it!" Why should he bother the foundry when the experts right here on typophile have the answers? I certainly feel the same way especially when you don't want to pay overseas charges etc.  In fact I started a thread about Dalton Maag because of the same reason. I thought it would be tacky to discuss money when I'm just window shopping. If you absolutely needed to say something about that thread Mr. Marsten was inflexible in not wanting to upgrade his browser. But then again he uses Windows and coming from that world every time you install an update you open up a can of worms. Us mac-heads live in Utopia [-kinda].</p>
      <p>"Unprofessional Fonts from Professional Designers" This was Mr. Marsten polling other users regarding problems they have had with incorrectly built fonts. He did not name names. In fact he said he did not want to alienate anyone. When you lay out the cash and get something sub standard and you don't know how to go about it getting it rectified ask people who know- Typophilers. However, it does show someone at the beginnings of frustration.</p>
      <p>The real "horror" is your spurious distortion of facts attempting to pigeonhole Mr. Karsten as an 'over-the-top griper' saying "he routinely attacked organizations" when in fact he hasn't. Not even p22- he is a paying customer with a 'horrible' experience. And you can't be serious in including Typophile- there's more crap here from beloved members than novices like Mr. Marsten. You are very much out of gas. </p>
      <p>Mike Diaz</p>
