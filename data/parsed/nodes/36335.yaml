      <p>I had problems with Amethyst from P22 (Rimmer type collection) when I purchased a licence through Myfonts -- some really bad kerning. Myfonts contacted P22, who said it wasn't a priority to fix it. Myfonts gave me a refund on condition that I delete the files, which I did. The font itself (OTF) worked fine otherwise.</p>
