      <p>I bought Albertan back in 1991. I can't even remember the name of the company I bought it - but they would save their printer fonts with the letter "P" before it - like PAlbertanTit and PAlbertanLin with Italic counterparts. They were all Type 3 fonts - and made my Mac back then crash out. When I needed it again back in - oh, about 2004 - I just converted it to Type 1 (for MAC) and it was fine. I don't remember my printer having any trouble with them either. (He had a lot of trouble with a Sudtipos font I had bought a while ago...)</p>
      <p>So all I'm saying is Albertan itself has always been a problem. So were most of the fonts that were out then that started with a P - I can't seen them in my library anymore -- I'd really have to go digging through floppy discs! I think they were like PFlash and maybe PBoy and stuff like that.</p>
