      <p>So, aside from your initial hassles getting the fonts, there was a bug in the naming of the Albertan SC Bold font in Type 1 format for Windows. This causes the style-linking (if any) to not work, as well as being odd in the font menu.</p>
      <p>P22 was not able to fix the font immediately, and offered a full refund, which was conditional on deleting the font(s) in question.</p>
      <p>While this is not the level of bending-over-backwards that one sees on a wonderful day, it certainly doesn't seem like "bad customer service" to me. There was a minor failure in P22's font testing and possibly a problem in their store infrastructure (although it's hard to know the cause of your download problems).</p>
      <p>Cheers,</p>
      <p>T</p>
