      <p>My apologies to those that think I'm too often cranky.</p>
      <p>Typophile is a collection contributors who range from newbies to amateurs to type designers to type vendors. I thought one thing we had in common was the pursuit of perfection in everything from the minutest details of type design to the minutest details of typographic practice. But let a non-pro lover of type, who puts out a newsletter with a mailing list of 30, who spends too much of his own money on fonts merely because he knows a good font when he sees one, complain about a vendor who sends out files that include mislabeled fonts and zero byte files, and the vendor-defenders come out of the woodwork to attack the messenger, the pursuit of perfection be damned.</p>
      <p>Zero byte files are "a very common problem ." Not in my experience.<br>
      Mislabeling a font "was a minor failure." Not in my experience.</p>
      <p>One of the unmentioned vendors in the "Unprofessional Fonts from Professional Designers"  thread was PsyOps. I mention that now, only because the difficulty I had was resolved AND they offered me an additional font at NO cost for my troubles. That kind of consideration should be applauded, and that kind of consideration is in stark contrast to P22.</p>
      <p>I became interested in type when Font Bureau was publishing X-height and ITC was publishing U&amp;lc, and I still have those copies. I am SO glad I was around when type-for-print had printed samples and catalogs that you didn't have to pay for.</p>
      <p>For those who are keeping track of my computer proclivities, I now have the latest version of Firefox as my browser.</p>
      <p>Left out of this conversation is Jim Rimmer, the designer of Albertan. I wonder what he thinks of how his fonts are marketed by P22.</p>
      <p>In spite of the repeated misspelling of my name, I appreciate the posts of Mike Diaz. Although Mike took some of my threads to refute the accusations of vendor representatives (who are also some of the most prolific posters), I also believe he was being a consumer advocate. When I first put my foot into professional typographic waters (no longer satisfied with 1000 fonts on CD for $9.95)  my first purchases were Stone Serif (purchased directly from Sumner Stone) and Remedy from Emigre over a decade ago. For most of the decade from 1995-2005, I did NOT run into the problem of mislabeled fonts or zero byte files.</p>
      <p>The hostile attitude of so many "professionals" and "professional vendors" toward me is as understandable as is their hostile attitude toward "free fonts." As you can see, I do BUY good quality fronts from respected vendors, but some vendors who only sell their fonts in mega-bundles, or who overprice their fonts only invite rip-offs. Pardon me if I don't sympthasize.</p>
      <p>My loyalty lies with quality. And to a lesser extent with price. I bought Goodchild at Fonts.com because they price the TT version at $99 and the PS version at $129 (to this day), which according to Nick, is a mistake. That's the kind of mistake I can live with. I only hope that it's Fonts.com and not Nick that gets screwed out of $30.</p>
      <p>When the high-and-mighty types decide to opt for quality over attacking non-pros for not accepting unprofessional quality, please do let me know.</p>
    html_clean: |-
