    html: <p>The reason Rotis feels funny is that it was made like a engineering plan, not a typeface. I would look at a modern, sturdy Dutch face like <a href="http://www.fontshop.com/fonts/downloads/bitstream/oranda_ot/" rel="nofollow">Oranda</a>, <a href="http://www.fontshop.com/search/?q=Olsen" rel="nofollow">FF Olsen</a>, or <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_nexus_mix_ot/" rel="nofollow">FF Nexus Mix</a>.</p>
