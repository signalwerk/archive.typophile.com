    html: <p>I used to do this magazine in which I used Cholla sans &amp; slab with <a class="freelinking external" href="http://www.t26.com/fonts/961-Neutraliser-Sans" rel="nofollow">Neutraliser</a> for bodytext. May sound weird, but worked out fine.</p>
