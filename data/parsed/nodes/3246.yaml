  html: <p>Hey All, <br> <br>Born Magazine just launched their Summer 2001 issue, and I was invited to participate. I'd be curious to hear what you think of my piece, the visual interpretation of a poem entitled "Outside the Slaughterhouse" by Ted Genoways. <br> <br><a href="http://www.bornmag.com" target="_top">http://www.bornmag.com</a> <br> <br>//jared</p>
