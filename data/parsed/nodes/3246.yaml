    html: "<p> I think your \"clinical\" treatment gives extra <br>sharpness to the poem. If the choppy delivery <br>of the text (where the reader is hastened and <br>sometimes forced to backtrack - like the poor <br>livestock itself) is intentional, then that's <br>great. One idea: a subtle sound track (maybe <br>something like at snarg.net, or JMJ's Zoolook) <br>would add to it, as long as it's in a very <br>muffled, low-frequency range. <br> <br>hhp </p>"
