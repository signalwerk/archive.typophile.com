  html: |-
    <p>I'm trying to identify the "typed" font used on this form. It's an assembly line "build sheet" used by Ford back in the sixties. Several of these forms accompanied each car (in this case a 1963 Thunderbird), and the assembly line workers used them to identify which options to install as the car moved down the line. I've been unable to find it after hours of searching - any help would be much appreciated!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ROT_Sheet_5039.jpg"></div><p></p>
