      <p>This is a machine typeface that likely never got digitized. It lived inside a machine and it never got out.</p>
      <p>There are plenty of fonts that try to capture this mechanical feel. </p>
      <p><a href="http://new.myfonts.com/fonts/astigmatic/restraining-order-aoe" rel="nofollow">Restraining Order</a> even has that seductive 8! </p>
      <p>Also see...</p>
      <p><a href="http://new.myfonts.com/fonts/astigmatic/state-evidence-aoe" rel="nofollow">State Evidence</a></p>
      <p><a href="http://new.myfonts.com/fonts/astigmatic/military-document-aoe" rel="nofollow">Military Document</a></p>
      <p><a href="http://new.myfonts.com/fonts/aah-yes/rysse" rel="nofollow">Rysse</a></p>
