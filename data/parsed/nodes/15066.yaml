      <p>You mention the three into one which may be combined with the textile/weaving images that could be refined into a distinctive image, bearing in mind the <a href="http://www.mlm.com.au/work/miniwoolmark/index.html">woolmark</a> logo as a direction to be avoided.<br>
      The problem with a client who ‘knows what they want when they see it’ is a situation that may be resolved by showing/verbalising a single (not necessarily resolved) concept.<br>
      It is often the case that a client cannot visualise a concept even when presented by runouts, so if you reinforce your presentation with a paragraph or two explaining your thinking and show their logo in use on stationery, packaging, vans, clothing (if applicable) etc. Help the client become confident about the logo.<br>
      Tim</p>
