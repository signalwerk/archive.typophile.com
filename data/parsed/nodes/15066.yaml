      <p>I’d say the most interesting are in v5. However, I think the shape is hindering the organic nature of what could potentially become your logomark.</p>
      <p>I would explore the movement of shapes you have more. Forget about the type, for now, and explore. Keep textiles and fabrics in your mind as you do. The way a fabric drapes or a weave catches light.</p>
      <p>Once you have some solid textile studies — what I see them as — you can then consider how type should or shouldn’t interact with it.</p>
      <p>I like v5-2 — the textile study — the mostl.</p>
