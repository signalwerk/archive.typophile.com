      <p>Hi Kristina, thank you very much for your very helpful comments.</p>
      <p>I agree the words “neo” and “trends” work better together, the company name uses an space between them and I’m not quite sure as to how treat them in the logo, in some versions I put the words together and used bold or other value for “neo” but I’m not sure if that allows the viewer to recognize an space. I’m open to any suggestion about that point.</p>
      <p>I do like the triangle shape but I’m not sure how to relate it to the logo brief, or could I be so abstract and just focus in direction and stability?</p>
      <p>Direction is a very important part of this design, Neo Trends, as I said before, has put together 3 companies and they intend to enter new markets and use new strategies to grow their business, they are taking a new direction indeed.</p>
      <p>This business depends a lot in delivery times, if some brand needs to launch their summer season on a particular date the company in charge of making the clothing must be able to deliver on time and with good quality, trust is also very important and the logo should present a reliable company.</p>
