    html: <p>What will help you with direction is look at the end use of the logo, labels, signage even print applications. As yourself how will it be used will it be stiched into clothing or only screened on labels. End use will dictate how intricate or simple your mark will have to be. One company I’ve delt with as a customer Is Road Runners Sport. In the beginning they had the full name and a bird (Road Runner) as their mark. Over time they have dropped the bird logo and the full name and are now RRS and sometimes a big R with Road KOed out of it with Runner below it.</p>
