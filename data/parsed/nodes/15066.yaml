    <p>Hello, I’m new to Typophile, I’ve been reading this forum and found great comments and ideas, great professionals around. I would like to know if you could help me with some ideas about a logo I’m designing for a client.</p>
    <p>The company name is “Neo Trends”, it’s the merge of 3 textile companies (all of them from Peru), the new company (also in Peru), is dedicated to making apparel for different clothing brands in Peru and USA markets.</p>
    <p>The company now wants to expand its operations with the new brand, they are not a clothing brand, they make clothing for other brands (directly or via brokers), they need the logo to express they are a solid company, that they can fulfill and deliver on time, that their work is high quality and they are forward thinking.</p>
    <p>I have come with some initial ideas, some of them I like the most, some of them I just draw and after looking at them I thought “ouch, that’s ugly”, but I included them so I can get more feedback from the client (although I’m not sure this was a good idea after all, he has liked one of the ideas I hate :) )</p>
    <p>I’m also in a situation when the client thinks that he “will know which one is the correct logo once he sees it”, I’m worried about this because I could be making lots of logos until I get the “correct” logo, so far my client feedback hasn’t been so good, just comments like “I like # 5 but you could work more on it”, “# 7 is interesting”, very basic feedback as you see.</p>
    <p>A quick note: they make any kind of clothing, not only t-shirts, but t-shirts is a great part of their business.</p>
    <p>I would love to know your comments about dealing with undecided clients and what you think about these logo ideas:</p>
    <p><a href="http://www.ventanazul.com/~clientsection/neotrends/neotrends/logos-5.gif">logos v2</a></p>
    <p><a href="http://www.ventanazul.com/~clientsection/neotrends/neotrends/logos-6.gif">logos v3</a></p>
    <p><a href="http://www.ventanazul.com/~clientsection/neotrends/neotrends/logos-7.gif">logos v4</a></p>
    <p><a href="http://www.ventanazul.com/~clientsection/neotrends/neotrends/logos-8.gif">logos v5</a></p>
    <p>(I’m not including logos v1, they were very basic ideas and most of them were discarded by myself)</p>
    <p>Thank you very much!</p>
