      <p>I like the logos in v5 best, especially #6. In #7, ‘trends’ is too close to the nice fibers/threads for my taste. Also, if you put the two words into two lines, I am not sure if alignment to the right is the best option (at least if you use an italic or slanted typeface, where the combination of ‘o’ and ‘s’ at the ends of the lines makes the logo look as if it would tilt to the right in the next second).<br>
      Just another thought: Perhaps you could extend the fibers part on the left to give it more direction and to include a triangular shape symbolizing the 3 companies?</p>
