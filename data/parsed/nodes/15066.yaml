      <p>Hmm, just thinking about your client situation… </p>
      <p>Sometimes I put myself into trouble by showing a client too many versions. They don’t know what to choose! </p>
      <p>Even though your client claims that he will “know it when he sees it,” I feel as if that is just a thinly veiled way of saying “I don’t know what I want.”</p>
      <p>When clients are undecided, they sometimes have a tendency of doing the mix-and-match with your versions. You know, they want you to use this part of V1, that part of V3, and combine with V8—totally destroying your concepts. </p>
      <p>If you are still having trouble with a pesky client, perhaps show them one or two and revise as needed.</p>
