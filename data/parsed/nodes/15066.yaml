      <p>I agree that you should do away with the typography for now.<br>
      By settling on it early, you have put a constraintive and limiting element into all the concepts.</p>
      <p>And as someone else mentioned, don’t show too many versions to the client - especially the ones you couldn’t bear to have to work up into final treatments. Pick three that you can “defend” with a thorough rationale that describes why they are the best solutions.</p>
      <p>good luck</p>
      <p>pd</p>
