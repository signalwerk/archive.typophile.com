      <p>Hi, </p>
      <p>I don’t design type or logos, but I am involved in aspects of cover design, so here’s my opinion:<br>
      I liked a couple of the ones in logos V3 — #2 and #4. I quite liked the triangle shape of #2 – to me it shows direction and stability. #4 reminds me of a needle and thread and also provides direction. </p>
      <p>I emphatically dislike the arched dotted lines in logos V4.</p>
      <p>Several in logos V5 I liked: #3, 6, 7. Numbers 6 and 7 make me think of a bolt of fabric, and also show direction and movement. The angle or skew on #1 and 2 of V5 don’t seem as effective, and overall I think I wouldn’t separate “neo” from “trends”…<br>
      So, I’m voting for #2 in V3 or #6 or 7 in V5. </p>
      <p>Kristina</p>
