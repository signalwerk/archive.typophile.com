  html: <p>The gutter is an interval spacing that resides between two facing pages in a layout spread. This measure is usually twice the size of the outside margin. Additionally, the term gutter may be used to define any interval space that serves as a buffer or separating unit for blocks of type, photography, and other artwork in a page layout.</p>
  html_clean: <p>The gutter is an interval spacing that resides between two facing pages in a layout spread. This measure is usually twice the size of the outside margin. Additionally, the term gutter may be used to define any interval space that serves as a buffer or separating unit for blocks of type, photography, and other artwork in a page layout.</p>
