      <p>&gt; They dont even stick to their brand guidelines!</p>
      <p>That doesn't mean that you shouldn't, if they were developed by a professional. They might give you a solid starting point on your exploration.</p>
      <p>&gt; without being boring </p>
      <p>Boring to whom? Designers worried about being boring are the reason that work gets set in Comic Sans, one of the least boring typefaces around. Hopefully you are well past that stage.</p>
      <p>But I never consider "being boring" to be a deficiency. A designer is basically a problem solver. You need to determine what the problems are in the work, and then prepare something that will solve the problem. If boring is the only problem, then there is not much to do. It sounds to me like there is much more here that you have to solve.</p>
