      <p>thanx don! i appreciate your comments. ive re-read the brand guidelines and have made a few typefaces choices.</p>
      <p>the brand's image drivers: Young, Energetic.<br>
      a few keywords used to describe the brand:  Trustworthy, Innovative, Fast</p>
      <p>I have chosen frutiger for the headline+bodytext as i like the wide range of weights available and that it is clean, simple and does not distract from content.  im setting the headlines in italics ( to reference movement,innovation,speed) and the body text in regular. im hoping that would creating a touch of dynamism in the text. also the newsletter is text heavy so frutiger seems to work as well in regards to legibility as small as 9 pt.</p>
      <p>the title of the newsletter i have thought about setting in clarendon for these reasons: </p>
      <p>a) the newsletter is for an arabic oil company, therefore i felt that the serifs work beautifully in hinting a calligraphic touch whilst still remaining contemporary</p>
      <p>b) the newsletter will be read internally only. again the masthead set in clarendon i feel will appear inviting, friendly and familiar.</p>
      <p>altho it is a corporate newsletter i feel the masthead provides a humanistic touch, making it less intimidating and more approachable.</p>
      <p>if you guys have any other typeface suggestions or comments, id love to hear them!</p>
