    <p>Hi there,</p>
    <p>i am currently working on revamping a corporate A4 newsletter that has been badly designer by non designers. The newsletter is for a national  petroleum retailing company,<br>
    Their logo is set in avant garde and their corprate typeface is Avant Garde Medium and Bold.</p>
    <p>i have complete freedom to do whatever i want as the company is totally clueless in terms of design so i really want to try something new.</p>
    <p>I have experimented using avant garde as body text and also quite liked DIN but my only concern is legibily because the newsletter is quite text heavy i need to set it at a small point size.</p>
    <p>I am looking to make the newletters, modern, clean and elegant but i want to referenace its industrial roots. any help or suggestions would be greatly appreciated.  Also, any suggestons for what text to use for the headline? many thanx</p>
