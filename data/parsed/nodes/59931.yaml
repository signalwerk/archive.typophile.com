      <p>Point well taken. Student does not necessarily equal clueless. The fact that you are here asking for advice over-rides the naivity in thinking Avant Garde is suitable for text. But I work at a place where the "professional designers" think Century Gothic is a good text face in print and web. (Compare AG and CG and you will see they are very similar).</p>
      <p>A good starting point is to determine the type of message that you want the newsletter to take. Is it to be formal and old-school business, or more modern and up to date? Do they want to convey a feeling of "green" which many petroleum companies think they can pull off?</p>
      <p>Once you have set down your parameters, then you can delve more wisely in the choice of typeface and format.</p>
