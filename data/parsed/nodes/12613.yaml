    <p>Slanted is a German magazine that joins typography with many fields, such as design, illustration, photography and other topics. It portrays and interviews stars but also underground actors from the international typography and design scene. The theme focus of the magazine follows an interdisciplinary approach. The aim of the magazine is to reach everyone who has an interest in layout, design, creation and bring them together.</p>
    <p>Editors: Lars Harmsen, Uli Weiß<br>
    Language: German, English</p>
    <p>Website: <a href="http://www.slanted.de" title="www.slanted.de">www.slanted.de</a></p>
