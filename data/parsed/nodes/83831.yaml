    html: |-
      <p><cite>You can't replace the glyph tcaron by t + apostrophe, this is like replacing W by VV. [...] Unfortunately such an arrogant approach is quite widespread.</cite></p>
      <p>I apologise, the reason for my statement is a hasty misreading of The Unicode Consortium's <a class="freelinking external" href="http://www.unicode.org/charts/PDF/U0100.pdf" rel="nofollow">Latin Extended A code chart</a>: "Latin small letter t with caron: The form using apostrophe is preferred in all typesetting." </p>
      <p>Thank you for clearing this up. </p>
      <p>For the record: All my typefaces has uni0165, with the caron (in its apostrophe-like form) placed with care. (As well as all other Extended A glyphs and a well-thought-out selection of Extended B glyphs). This mistake is indeed very embarrassing for me.</p>
