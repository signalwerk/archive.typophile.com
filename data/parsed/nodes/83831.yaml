      <p>Sindre, you are absolutely wrong regarding tcaron glyph. Your sentence "(a couple of Slavic languages used that, both are now preferably set with apostrophe instead)" made me laugh, sorry.</p>
      <p>You can't replace the glyph tcaron by t + apostrophe, this is like replacing W by VV. </p>
      <p>The letter ť represents a distinctive sound and can be found in Czech and Slovak languages only. Although the diacritical marks is called háček (caron) it has a special vertical form, sometimes similar to a comma or an apostrophe. </p>
      <p>You can find a plain apostrophe placed next to the letter only in poorly designed fonts. Unfortunately such an arrogant approach is quite widespread. The result of this is simple: the fonts can't be used for typesetting Czech or Slovak and professional designers avoid such typefaces.</p>
      <p>If you'd like to see a good samples of tcaron, please visit Storm Type, TypeTogether or Suitcase Type Foundries to name a few.</p>
      <p>Please read very careful explanation how to design this kind of caron which is btw. used also together with d (ď) and l/L (ľ/Ľ; not to be confused with ĺ/Ĺ).</p>
      <p><a href="http://diacritics.typo.cz/index.php?id=5">http://diacritics.typo.cz/index.php?id=5</a></p>
      <p>Post Scriptum: The letter t followed by an apostrophe is also used in Czech language, but the meaning is different: the apostrophe represents missing letter, but you can only find it in poems or in an attempt to write slang pronunciation. This is another reason you can't replace ť by t'.</p>
