    html: |-
      <p>yeah that's right.  Saw how to do it in Nick Cooke's rollerball critique thread.  Metroscript does a similar thing with tails.  What's cool about it is that the underline glyphs can be put into ignore subs in lookups to make sure the letters either side of the underline still connect how they should:<br>
      <cite>lookup endforms {<br>
         ignore sub @tobeendform' @afterletter;<br>
         #ignore sub @tobeendform' @underline @afterletter;<br>
        sub @tobeendform' by @endform;<br>
        }endforms;</cite><br>
      greying out the ignore sub @tobeendform' @underline @afterletter; from this lookup means that there would be an endform on the character before the underline, like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ignore_5851.JPG"></div><br>
      <cite>lookup aftero {<br>
        sub @ovw @changeafterovw' by @afterovw;<br>
        sub @ovw @underline @changeafterovw' by @afterovw;<br>
       }aftero;</cite><br>
      is another example - means after letters with a high lead out (o, v, w, b etc. in this font), the next letter has a high lead in (or at least fits with the high lead out), and this remains true even if there are underscores after the o etc.:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/boy_5300.png"></div><p></p>
