      <p><cite>[...] anyone got a list?</cite></p>
      <p>Latin Extended A is the list you need. A very few of the glyphs there are deprecated, though. From memory: kra, I and i tilde, U and u tilde (all earlier used in Greenlandic, I think an Inuit dialect spoken in Alaska still uses kra, though); 'n (Afrikaans) and t' (a couple of Slavic languages used that, both are now preferably set with apostrophe instead). The Catalan mid dot l and L are also not used much, I think. And I doubt long s has any uses at all any more. (I make all of them anyway.) </p>
      <p>It is also a good idea to include uni1E9E, uppercase double s from Extended B.</p>
