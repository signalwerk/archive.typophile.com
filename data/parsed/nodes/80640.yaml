    <p>Checker is an all-cap ‘3-D’ display font which automatically alternates positive and negative tiled characters, by means of the Contextual Alternates feature.</p>
    <p>Checker is an attention grabber suitable for logos, titles and short headings. With its tiled construction, it’s a natural for colorful interpretation. The letters are properly italicized and back-slanted, and adjusted for maximum readability within the constraints of the font’s concept. The letter style is bold grotesque, so Checker will mix smoothly with any other fonts in a layout. </p>
    <p>After I had completed the typeface, I came across the old <a href="http://4.bp.blogspot.com/_3Rc6Tb9etmc/SrOPO-9HQ2I/AAAAAAAABwQ/Mqr5sT5tXcY/s320/This+Is+Cinerama+Program.jpg" rel="nofollow">Cinerama</a> logo (1952-1974), which has some resonance. When working on the face, I was aware that I was channeling nostalgia for a kind of counterpoint layout that was popular in the early 1950s, involving bold type and large areas of spot color, without referencing anything in particular. Memory and imagination have interacted to bring a half-grasped style, exotic in its vague recollection, into sharp reality, further informed by themes explored in recent work:</p>
    <p>Contextual Alternates (it's my fifth typeface to explore this OpenType feature), monowidth (Panoptica, 2005), ambiguous perspective (I spoke on linear perspective at Typo Berlin in 2009), extreme italicization (Figgins Sans Italic is at 20°), and the tension in readability between letter perception and word perception (an issue much discussed at Typophile).</p>
    <p><em>—Nick Shinn</em></p>
    <p>Related, an essay at I Love Typography: <a href="http://ilovetypography.com/2011/04/01/engaging-contextuality/#more-10568" rel="nofollow">Engaging contextuality</a>.</p>
    <p>Available at <a href="//new.myfonts.com/fonts/shinn/checker/" rel="nofollow">MyFonts</a>.</p>
