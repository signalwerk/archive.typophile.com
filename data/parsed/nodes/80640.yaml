    date: 2011-04-03T10:03:00
    date_raw: 3 Apr 2011 — 10:03am
    votes: null
    html: |-
      <p>James is correct, this principle is well known in signage (FF Info, for instance, IIRC, provides differently weighted versions of the same "weight" for positive and negative use).</p>
      <p>It is further complicated by the issue of reflective vs. backlighting.</p>
      <p>In this thread, I made my specimens in Photoshop, and was more concerned with getting the colors to work well with one another, than preserving the absolute weight of the type. Two Photoshop actions affected the weight:<br>
      Firstly, the choice of type antialiasing mode.<br>
      In the following sample, it goes Smooth, Sharp, Strong, from top to bottom.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bergaults_Flat_5856.png"></div><p></p>
      <p>Secondly, I used the paint bucket (Fill) a lot, and again, the anti-aliasing setting came into play, eating into edges.</p>
      <p>However, even recognizing the effect James mentions, I'm not sure it would apply to Checker, because it's debatable, for a particular character, whether the letter or the tile is the figure or the ground. That's particularly apparent in the first specimen at the top of this thread (with the black and red check background), where the yellow negative tile space behind the black letters really jumps out much stronger than the yellow letters.</p>
      <p>The role of the border and background plays a significant role in the viewer's perception of the type in a sign; in James' specimen above, there is:</p>
      <p>- Ample space between type and frame<br>
      - A keyline around the frame<br>
      - A grey background</p>
      <p>These all serve to focus attention on the weight of the type.</p>
      <p>In my specimen immediately above, the absence of a keyline around the solid tiles makes that setting recede, weaker, so the other style, black lettering on "white" tile, does not need to be emboldened to hold its own.</p>
