      <p>As a beginner I don't think you need to concern yourself with different sizes. Designing and producing one weight is difficult enough. You're becoming weighed down with the nitty gritty before you even start, so don't run before you can walk.</p>
      <p>Just buy 'Learn FontLab Fast' by Leslie Cabarga, read it, and then start work on one upright typeface to see if it is something you would wish to continue. Believe me - it is a LOT of time-consuming work with no guarantee of success.</p>
      <p>I'm not trying to put you off - you might enjoy the process.</p>
      <p>Nick Cooke</p>
