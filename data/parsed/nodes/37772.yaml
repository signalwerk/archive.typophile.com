    <p>I'm reading like crazy. Now I'm into <em>Letters of Credit</em>. One of the things that Tracy seemed to be saying is fine type design does not include letting the software you're using run routines to proportionally increase and decrease the size of one or two sizes that you've designed.</p>
    <p>So how many sizes do you create--I mean, I'm sure you can create a hundred sizes if you wanted to. But practically speaking, how do you handle making different sizes?</p>
    <p>And what about italic, do you simply slant a roman typeface?</p>
    <p>These may seem like awfully basic questions, but since I have no burning need to do any type design until I know what the hell I'm doing, I figured I should gather all the info I can first.</p>
    <p>Thank you.</p>
