    html: |-
      <p>&gt; And what about italic, do you simply slant a roman typeface?</p>
      <p>This question suggests that you need to spend a lot more time looking at type. Here is a starting point. Find a program that will slant text for you (many can). Type a line in Times New Roman 24 to 36 point, make a copy, and then slant it 12 degrees. Convert the top line to true italics and then compare the two. </p>
      <p>Do this with at least 50 different fonts. Compare the differences. (You will find that some sans serif fonts are pretty similar but almost no serif fonts are.)</p>
      <p>Another thing to do is to type similar lines in differing fonts, but the same weight and style (all roman or all italic). Look for the differences between the shapes of the characters. Once you get a good read on how the types differ, you can start to imagine which features you would like to use.</p>
