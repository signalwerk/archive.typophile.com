      <p>I recommend starting with Regular or Medium<br>
      When you're happy with that, start your Thin and Extra Bold by pasting it into the mask/template layer.<br>
      Make the Thin by drawing a single skeletal path and applying a stroke value of 20 units.<br>
      Make the Extra Bold by a combination of dragging parts of the letters wider, and applying "add weight"/"parallel path" commands.<br>
      Finally, you can use the Multiple Master feature to interpolate all the other weights between those three masters.</p>
