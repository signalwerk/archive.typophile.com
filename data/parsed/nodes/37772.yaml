      <p>Usually there are some different optical sizes made going from small to large, like: caption, body, headline and titling. These are optimised for normal sizes like eg. 9 or 10 for the body cut.</p>
      <p>Some typefaces have a slanted version instead of a true italic. That causes some problems, especially in the shapes of the characters a,e,f and so on – you get the idea. I suppose this was done so to save a bit of work in it's time before digital typefaces.</p>
