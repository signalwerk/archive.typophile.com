      <p>You may find it tricky to get others doing your course work in that tight a time schedule, but, at least I am willing to help with one remark: if it is gravestones it is not typography. It’s epigraphy, or lettering.</p>
      <p>However, have you considered a walk across the local graveyard next to you?</p>
