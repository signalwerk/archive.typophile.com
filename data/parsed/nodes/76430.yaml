    <p>Hey all,</p>
    <p>Long time fan, first time poster. My name is Gus Wezerek. I'm a visual journalism student at Northwestern University. For one of my classes I'm writing an paper about contemporary gravestone typography. I've seen the thread here with the man who was soliciting help with a relative's tombstone design, but the paper is a bit too broad for his case.</p>
    <p>Would anyone be willing to chat on the phone or email/point me in promising directions? I'm just looking for ideas about what makes (or you think would make) a good face for stone, special cases of gravestone typography or really anything you guys know or would be willing to speak about on the topic.</p>
    <p>The paper is due Monday, so hopefully I can speak with some of you within the next few days. I've included my contact information here and of course we can use this thread, too.</p>
    <p>Thanks,<br>
    Gus</p>
    <p>847.280.1705<br>
    <a href="mailto:gwezerek@gmail.com">gwezerek@gmail.com</a></p>
