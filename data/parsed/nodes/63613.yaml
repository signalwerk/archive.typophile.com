      <p>Sorry for my response everyone.</p>
      <p>To be more specific,I was asked some advice on choosing a font to set a phrase of text written in the Latin language. Translated to English, the phrase means *Fortune favors the bold.* I am not sure how to say the phrase in Latin.</p>
      <p>My main concern is cultural consideration. Should I choose a font from a particular historical era? Maybe a font created by a designer from a certain country? That is the type of stuff I would like to know.</p>
