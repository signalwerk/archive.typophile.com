    html: |-
      <p>Actually it's a very interesting question.* Do you worry only about caps? What about the "U" and "J"? Do you worry about the font featuring common Latin-language or Roman-era contractions, etc.? Most of all I would work the angle that Latin uses far fewer letters that have extenders in the lc. So maybe something with a highly varied x-height region, to help along readability? Unless you're shooting for what Latin text is famous for: aesthetic regularity. Unless unless you're being even more aesthetically-minded and you'd like cuspy-cupped serifs... Like I said, an interesting question.</p>
      <p>* Maybe Andreas thought Erik meant Latin-script as opposed<br>
      to Latin language? Which would indeed be a dumb question,<br>
      although still not deserving Andreas's reaction.</p>
      <p>hhp</p>
    html_clean: |-
