      <p>A good friend of mine is considering getting this as a tattoo. I just want to help him do the research and make sure he doesn't get something he will regret this. I guess he mostly cares about having it look cool since no one will be able to understand it besides him anyway.</p>
      <p>I have also been trying to learn more about fonts lately and not just choose a font because it looks nice, or it's popular. I am currently reading *The Elements of Typographic Style* by Robert Bringhurst. I figure by the time I am done reading it I will be more of an expert on fonts and typography. I am relatively young and I have just recently graduated from going to school for Graphic Design.</p>
