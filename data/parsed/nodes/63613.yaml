    votes: null
    html: |-
      <p>Well, I guess maximal cultural authenticity would require all-caps setting in an epigraphic font*; subbing "V" for "U" and "I" for "J"; and using a triangular midpoint instead of wordspaces. But the reader can never be ignored, so the "culture" of the user has to be factored in.</p>
      <p>* Hopefully not Trajan. Maybe La Gioconda by Farey &amp; Dawson.</p>
      <p>What's the context?</p>
      <p>hhp</p>
