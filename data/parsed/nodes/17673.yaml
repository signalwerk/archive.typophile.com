    html: |-
      <p>"missing font data fork" is quite the misnomer, but appears to indicate that you're talking about Mac OS PostScript Type 1 fonts.  If that's the case, and you still have the Type 1 font, you're in luck - many Mac OS X applications will use that without a "screen" or "display" font.  Older QuickDraw-based applications will not, but some newer ones will.</p>
      <p>If you have the Type 1 font, go look at the vendor's Web site - many of them make at least one bitmap suitcase available free of charge.  Adobe's old "Type on Call" CDs included free bitmap fonts (up to 24 point) for all of their Type 1 fonts, because without the PostScript fonts, you couldn't get high-resolution output anyway.  You might be able to download or request a vendor suitcase that solves your problem.</p>
      <p>If you're missing the Type 1 part, good luck - that's the part they never give away.  If you have a receipt, some vendors might let you have a new copy of the font, or send a replacement disc, but most probably won't.  With luck, you're only missing bitmap fonts, and those are easier to replace.</p>
      <p>--Matt</p>
