  html: <p>So it seems that I for some reason have a large number of fonts that are either missing their postscript printer or display partner. What is the easiest, and most cost effective way of rebuilding the missing font data fork and and pairing them together again?</p>
  html_clean: <p>So it seems that I for some reason have a large number of fonts that are either missing their postscript printer or display partner. What is the easiest, and most cost effective way of rebuilding the missing font data fork and and pairing them together again?</p>
