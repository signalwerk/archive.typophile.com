    <p>Hello,</p>
    <p>I have just generated a Family with 12 weights:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/2013-03-15_12h23_26_6386.png"></div><p></p>
    <p>All Fonts do have the same characterset, glyphorder, Unicode rages, Codepages. MS FontValidator and Adobe CompareFamily don't show any problems.</p>
