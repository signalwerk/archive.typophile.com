    html: <p>&gt;What a lot of people don't seem to realize is that a script like the one posted above is not a trivial thing to turn into a font. <br> <br>Or, more simply, a logo is not a thing you *should* or *would* turn into a font. Unless you want to design a font with almost endless letter variations. <br>Clients are so hard to satisfy exactly because nowadays people present them so many variations, using different typefaces (and piracy here works at its best), they will never be educated in understanding the values of a hand-drawn logo (hand-drawn, no matter the media you use). <br> <br>I draw quite an amount of logos where I work, and often clients choose the most crappy one, done with a modified typeface, overlooking the ones I have drawn freehand. <br> <br>Of course, in Italy there's a lot more ignorance around the value of our work as letterers, compared to other places in Europe or in the US, I guess.</p>
