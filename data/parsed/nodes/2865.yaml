    html: "<p>Doyald Young, on his site (<a href=\"http://www.delphipress.com\" target=\"_blank\">www.delphipress.com</a>) summed it up well. <br> <br>If there are thousands of fonts, why handletter or modify a font to create a logotype? Because every company desires a distinct image for itself and its brands, which is unique and copyrightable, an important point. A custom logo is one of of a kind, precisely fashioned. One of the many design approaches, are logos that carry an identifying shape, or illustration. But the majority of commercial logos exist as name only and must rely on their letterforms to impart a distinctive image that the public will remember.  <br> <br>Commonly used fonts such as Times Roman, Garamond, Baskerville, Helvetica, and Univers are available to everyone, and because they are seen everywhere, their distinctive qualities are diminished by the boredom of repetition. These same fonts though, may be gently modified to create a more coherent and distinctive logo that is reproduceable in a range of sizes, positive and negative, and on a wide variety of surfaces. <br> <br>A custom logo, handlettered or computer generated, must address only the letters that the name contains. Each letter can then be designed for maximum compatibility, a less daunting task than font design, where each letter of the font: caps, lowercase, figures, punctuation, and special characters, must be designed as a harmonious group. <br> <br>Whether the logo is drawn by hand, or is completely designed on the computer, a thorough understanding of letterforms is vital for the successful resolution of a logo that is eminently usable, with a lifespan of 15 to 20 years. <br> <br> <br>At his AIGA presentation, he said that drawing letters on the computer isn't drawing, <br>it's clicking. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br></p>"
