    html: <p>What a lot of people don't seem to realize is that a script like the one posted above is not a trivial thing to turn into a font. The complexity of just those two words is beyond what you would normally find in a font. For example, <br> <br>* The two capital letters are not the same height. <br>* The trailing letters--the "e" and "n"--would not work in the middle of a word, and the internal letters would not necessarilly work at the end of a word. <br>* The way the "C" overhangs the "a" would not work next to a character with an ascender, like an "h" or "l". <br>* The connecting stroke between the "o" and "r" would probably have to be treated as a ligature. In any case, it is difficult to incorporate an "r" like that into a font. <br>* The connecting stroke between the "i" and "f" is wider than the others to make room for the crossbar on the "f". <br> <br>This is not to say that some or all of these issues couldn't be resolved such as by adding alternate characters and ligatures. Unfortunately, users often don't know how to use such fonts.  <br> <br>For example, many of House Industry's script fonts have special characters and ligatures to overcome problematic situations. Yet, I often see these fonts used--even in design annuals--as if the designer had no idea these special characters existed. <br> <br>You can also design a script font in such a way to avoid features that don't work with certain combinations, but at the sacrifice of many of the qualities that give hand-drawn lettering its appeal. <br> <br>OpenType promises to make such complex scripts easy to use, but, so far, support is uneven. Yet, even when there is full support for complex fonts that can emulate custom lettering, it won't change the fact that if you want something unique, you won't get it by simply typing on your computer keyboard.</p>
