    html: |-
      <p>&gt; the different weights </p>
      <p>The width of the left vertical stem of the capital H may be used as a measurement for the different weights.</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/stem-width-1.jpg" title="www.sanskritweb.net/temporary/stem-width-1.jpg">www.sanskritweb.net/temporary/stem-width-1.jpg</a></p>
      <p>A peculiarity of the old News Gothic (and also of the later Trade Gothic) was that the normal weight of News Gothic was thinner than the normal weight of other fonts, but thicker than the light weight of other fonts.</p>
      <p>If we apply a UPM of 1000 units, then the normal weight of Helvetica has a stem width of 97 units (or 9.7 % of the em), and the light weight of Helvetica has a stem width of 68 units (or 6.8 % of the em), whereas the normal weight of the old News Gothics is exactly in-between. For instance, the normal weight of News Gothic BT is 79 units (and for example the normal weight of Trade Gothic LT is 80 units).</p>
      <p>But the normal weight of Benton Sans has 88 units and therefore is too thick.</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/stem-width-2.jpg" title="www.sanskritweb.net/temporary/stem-width-2.jpg">www.sanskritweb.net/temporary/stem-width-2.jpg</a></p>
      <p>If you prefer the in-between weight peculiarity of the old News Gothic font, you should use old digitisations, e.g. News Gothic BT, which is a clone of the old Linotype News Gothic.</p>
