    <p>Hey guys,</p>
    <p>I've finally got some money saved up and have been looking at buying either Benton Sans or News Gothic No.2. </p>
    <p>Benton is what Frere Jones redrew after studying Morris Fuller Bentons original drawings of News Gothic. While News Gothic No.2 is a family of news gothic with additional weights created by Linotype.</p>
    <p><a href="http://www.fontbureau.com/fonts/BentonSans/more" title="http://www.fontbureau.com/fonts/BentonSans/more">http://www.fontbureau.com/fonts/BentonSans/more</a></p>
    <p>have a look to see some comparative images. I felt that benton had some issues with the size of the counters especially in the heavier weights and some issues with the kerning. is it just me? What do you guys think? Benton was used to type set 2 Kilo's of KesselKramer and it looks good there. So am quite confused right now.</p>
    <p>What would you spend your money on?</p>
    <p>Thanks for the time!<br>
    --<br>
    Arjun</p>
