    <p>Part of: <strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Rounded Typefaces</strong></p>
    <p>Current URL:<br>
    <a href="http://www.dardenstudio.com/typefaces/omnes" title="http://www.dardenstudio.com/typefaces/omnes">http://www.dardenstudio.com/typefaces/omnes</a></p>
    <p>Omnes<br>
    Designed by <a href="/wiki/Joshua%20Darden" class="freelinking" rel="nofollow">Joshua Darden</a><br>
    Design and production assistance by <a href="/wiki/Jesse%20Ragan" class="freelinking" rel="nofollow">Jesse Ragan</a>. </p>
    <p>Originally conceived as the brand typeface for a national retail chain, Omnes fulfills the need for a <a href="/wiki/rounded%20typeface" class="freelinking" rel="nofollow">rounded typeface</a> which is neither overly mannered nor excessively literal. A selective approach to rounding adds subtle visual interest, while a large assortment of non-<a href="/wiki/geometric" class="freelinking" rel="nofollow">geometric</a> forms pay homage to 19th-century rounded <a href="/wiki/Grotesque" class="freelinking" rel="nofollow">Grotesque</a>s which appeared well before the crisp visual style of the <a href="/wiki/Bauhaus" class="freelinking" rel="nofollow">Bauhaus</a>.</p>
    <p>Link to PDF Sample:<br>
    <a href="http://www.dardenstudio.com/assets/pdf/omnes.pdf" title="http://www.dardenstudio.com/assets/pdf/omnes.pdf">http://www.dardenstudio.com/assets/pdf/omnes.pdf</a></p>
