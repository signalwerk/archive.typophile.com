      <p>Matthew Carter has said that to him revivals are like a new performance of an old score. The conductor, adding a new interpretation, creates a recording that has value in itself, beyond the original score. To take one of my favorites, Ella Fitzgerald's recording of Gershwin's songs added a lot. In fact, Ira Gershwin I believe said, "I never knew how good we were until I heard Ella sing our songs."</p>
      <p>Ella isn't Gershwin, and Leonard Bernstein isn't Beethoven, but their performances are of value in themselves. </p>
      <p>A straight copy that attempts just to be accurate is more craft than art, but it is valuable in my view, if what is revived is of value. Because of the changes in technology, I think the effort to be "authentic" is a trap, though, especially for very old types.</p>
      <p>I explained my views and my own process reviving Caslon's Pica 2, <a class="freelinking external" href="http://ilovetypography.com/2010/07/26/reviving-caslon-the-snare-of-authenticity/" rel="nofollow">over at ilovetypography</a>.</p>
