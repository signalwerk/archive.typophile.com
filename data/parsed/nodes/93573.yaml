      <p><em>Well then, if taking someone else’s design, and acknowledging that person as the author, and giving the revival the same name as the original (or its author) is not copying their design, what is it?</em></p>
      <p>It's pretty much like providing a new arrangement for an old song: the bare bones are there, but the arranger interprets what there according to his or her own tastes. It’s how an old loping pseudo-cowboy song from the 1940s called “Cow Cow Boogie” (“Get along: get hip, little dogie”) gets reinterpreted by Tiny Bradshaw in 1950 as “Train Kept a-Rolling,” which in turn gets reinterpreted by Johnny Burnette and the Rockets in 1956 under the same name, then gets reinterpreted again by the Yardbirds—and, later, Aerosmith—in the 1960s as a steamrolling, pile-driving, balls-out rock anthem.</p>
      <p>In all cases, the basic structure is precisely the same, but each arranger crafts a different vision from what went before. In all cases, it ain’t copying…</p>
