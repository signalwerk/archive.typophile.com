      <p>I’ve done designs in some of the old genres, and, as Hrant suggests, there were economic reasons for that—they were commissions for newspapers, a conservative medium by and large (I have also had newspaper commissions for original types). However, I wouldn’t say those were revivals per se, as I wasn’t reinterpreting a speciﬁc font, but rather drawing inﬂuences from a genre as a whole. </p>
      <p>When I did the Modern Suite revivals (Scotch Modern and Figgins Sans), it was because I had been highly critical of revivals—on Typophile—so I thought I should give it a try, to see what it involved, what the process was like. I don’t intend to do any more revivals.</p>
