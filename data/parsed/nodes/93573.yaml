    <p>With all the happenings around here involving the ripping off of other peoples work and questions about where that line may or may not be drawn; I thought it made sense to simply ask the house.  What are the best practices for purposefully recreating a font from the past?</p>
    <p>Hopefully the answer would involve the definition of past being anywhere from 5,000 years to 5 months. It should take the issue of Public domain into account, as well as gaining permission from anyone who requires it, and what one can possibly do if they are refused such permission.</p>
