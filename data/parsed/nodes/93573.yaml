      <p>In the world of art there are several prominent estates which have inherited copyrights ...Basquiat to name but one.</p>
      <p>From the interwebs:</p>
      <p>Question: Can You Transfer Copyright Ownership?<br>
      Answer: Yes. Like any other property, any or all of the copyright owner's exclusive rights may be transferred. However, the transfer of exclusive rights is not valid unless that transfer is in writing and signed by the owner or the owner's lawyer or authorized agent. Transfer of rights on a nonexclusive basis does not require a written agreement.</p>
      <p>A copyright can also be bequeathed by will.</p>
      <p>A copyright is a personal property right, and is subject to the same state laws and regulations that govern the ownership, inheritance, or transfer of personal property as well as legal contracts or terms business. Check your relevant state laws and/or consult an attorney.</p>
      <p>Most often transfers of copyright are made by contract. The Copyright Office does provide any forms for transfer contracts, you have to provide your own. However, you can make a record the transfer of copyright ownership in the Copyright Office.</p>
