      <p><em>"Copy" is not a word that engenders discussion on this topic.</em></p>
      <p>Well then, if taking someone else’s design, and acknowledging that person as the author, and giving the revival the same name as the original (or its author) is not copying their design, what is it? (Other than the euphemistic “revival”.) Perhaps following, but not revised or adapting, because the design remains the same.</p>
      <p>The revivalist’s execution might well be styled or nuanced in a distinctive manner, perhaps even with new ideas about the relationship between structure and detail, but the underlying design remains the same. Surely this is how the term “design” is understood in most of the plastic arts, as the plan or template which exists prior to the making of the artefact.</p>
      <p>It’s not that I don’t recognize the skill and creativity that can go into a redesign, but I don’t believe it is of as high an order as that which goes into original design, or that it should be fêted to the same degree, certainly not as heroic.</p>
      <p>To do so is a disservice to type design, and makes it seem bush league in relation to other arts.</p>
      <p>You’ve done a lot of revivals David, but for me you will always be ﬁrst and foremost the designer of Throhand, in particular I recall how impressive it looked when I ﬁrst saw it in <em>National Geographic</em>.</p>
