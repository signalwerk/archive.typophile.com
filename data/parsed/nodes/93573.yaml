      <p>But surely if the basic structure is precisely the same, it is copied.<br>
      In a typeface, isn’t the basic structure its design?</p>
      <p>The idea that musicians may change the lyrics to a tune and call the song their own is frowned upon, as George Harrison, amongst others, found out.</p>
      <p>Speaking of the 1940s, John Jacob Niles wrote a book <em>My Precarious Life in the Public Domain</em>, in which he observed that many people had used his folk-style compositions, assuming they were in the public domain. One of those was “Black is the color of my true love’s hair”; he kept the traditional words but wrote a new tune. Luciano Berio incoporated it into his <em>Folk Songs</em>. Berio called that process transcription—adapting exisiting works was an issue central to his. </p>
      <p>I would also note that in music, as you say, the revival is termed an arrangement, not a composition, whereas no such distinction exists in type design. Comparing type with music can only go so far, these things are complex enough in themselves.</p>
      <p>**</p>
      <p>I can see the merit in David’s reluctance to discuss this further.<br>
      Its utility, and the persistence of tradition, are things we all love about type.<br>
      Ideally, if anybody thinks type design is small beer, only 5% creative, that’s their problem.<br>
      I will adopt this approach in future, and let the type do the talking.<br>
      Noblesse oblige.</p>
