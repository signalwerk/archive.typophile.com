      <p>Ryan, you're missing the point of Erik's comment that 95% of fonts have to be the same in order to be legible, i.e. that the conventional structures of letters in a limited range of styles constitutes the fundamental common architecture. It is the 5% that makes any individual typeface desirable over another and hence constitutes something close to 100% of the value of a font. The value that derives from simply being able to set a text in a font and read it is minimal, i.e, the value that derives from the 95% that the font has in common with other fonts is minimal precisely because any other font supporting the same language set could perform this basic task as well. But that's not typography. As soon as you make a choice to use a particular font instead of another on the basis of its design, you are locating all of the value of that font in that design, in the 5% that  makes it different from the other options.</p>
      <p>[I've used the percentage you cited Erik as using, but in fact I'd argue that because the conventional structures vary across even common styles the percentage a given font has in common with <em>all</em> other fonts is actually quite a bit lower than 95%.]</p>
