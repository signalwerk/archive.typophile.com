      <p>I believe the date is 1923 in the U.S. currently. However the Walt Disney company keeps fighting to push that back to protect Mickey.</p>
      <p>I also do not believe that revivals are stinky, though I respect that point of view.  The thing is, despite how some may feel, revivals make up so much of what type design is and had been about.  Looked at from the long view, it is like a Symphony; one fugue or counterpart after another. Everything plays off of everything else.  Though some would hate me for saying it, I really think the idea of copying is kind of built-in to type design.  Erik Speikerman once said fleetingly, as he says everything, that 95% of all fonts have to be the same, or else they would be illegible.</p>
