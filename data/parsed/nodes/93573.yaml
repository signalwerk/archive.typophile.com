      <p>Ryan, I certainly agree that revivals are a normal part of something like type design, and I don't think all of them are stinky. But I'm with people like Unger in thinking it's not what we should ideally be doing. Now Nick, he's one of our most inventive type designers, so I have to think there are economic reasons for somebody like him electing to make a revival - and that's totally OK. I just hope I can avoid that pressure myself, at least in terms of self-initiated retail stuff; when I'm commissioned to make a revival I'm quite unlikely to say "No, I don't want your money."  :-)</p>
      <p>BTW there are in fact old fonts I'd love to see revived (or revived better). But I just don't see myself doing them (unless it's something exceptional). There's not even enough time in life to make all the original contributions one would like - why waste time reviving?</p>
      <p>hhp</p>
