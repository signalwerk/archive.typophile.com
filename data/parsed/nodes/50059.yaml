    <p>Hello Typophiles,</p>
    <p>This is kind of an odd post for Typohile, but then again this is the general discussions area, right? I have been looking for some valuable insight into this and thought you guys may have some opinions I would respect on it.</p>
    <p>I have been looking at this web host called <a class="freelinking external" href="http://www.businesscatalyst.com/" rel="nofollow">Business Catalyst</a> - they are what has been dubbed as a 'next generation web host' meaning that they provide easy to customize and add web apps, integrated CRM etc for designers to resell to clients. They also allow designers to rebrand their product to sell it as theirs, with billing through the reseller or direct to client. In their words:</p>
    <p>BC is an online, hosted application that allows your clients to:</p>
    <p>    * Build and manage their website<br>
        * Write a blog and build a forum<br>
        * Run an online shop and accept payments<br>
        * Create email marketing campaigns<br>
        * Build a customer database<br>
        * Analyze and improve results</p>
    <p>Has anyone used a hosting service like this before? What are your thoughts?</p>
    <p>It seems too good to be true, but for a designer to be able to offer all of these backend features quickly, easily and cost-effectively would be amazing.</p>
    <p>Apologies again for the non-type-related post BUT, you did say anything goes!</p>
    <p>So thanks,<br>
    Jay</p>
