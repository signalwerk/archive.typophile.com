      <p>Good point about the 'trapped' bit. I imagine that is a key component of their customer retention strategy. I am trying to determine if their apps are open-source (I imagine not).</p>
      <p>So, just to clarify Darrel, do you think a lot of web hosts would offer all of these features INTEGRATED with each other? The core foundation of their service seems to be a CRM which maintains a database of all of your customers which on turn can be used to drive full email marketing (included), take bookings, make sales etc.</p>
      <p>Maybe I am behind on what most hosts offer, but to offer all of this as an integrated solution in a format that a client can self manage and update seems great.</p>
