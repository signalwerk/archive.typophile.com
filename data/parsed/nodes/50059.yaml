    html: "<p>The last time I used one of these it turned out that the whole thing was a pyramid scheme. Whoever I bought from got tired of it and dropped out leaving my domain suddenly gone. I’d go with a known hosting provider who just gives kickbacks for recommending clients. And keep in mind the old truism: if it sounds too good to be true, it probably is.</p>"
