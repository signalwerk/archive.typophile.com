    <p>We are proud "again" to introduce Ahrar (Free we stay!) a new font to reflect freedom in the Arab world:</p>
    <p>The font is designed by Abdullah Aref (Egypt), Zakarya Saleh (Palestine).</p>
    <p>Ahrar is available in OpenType and TrueType flavors.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ahrar_new_arabic_type_3426.jpg"></div><p></p>
    <p>Please do not hesitate to contact us for any further information: aratypo [at] gmail . c-o-m</p>
    <p>Download link:</p>
