    html: "<p>Can't name it, most probably a proprietary font of Warner. Some in the same vein: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typeassociates/threepoints-north\" rel=\"nofollow\">Threepoints North</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/jnlevine/coldfield\" rel=\"nofollow\">Coldfield JNL</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typotheticals/sweetmix\" rel=\"nofollow\">Sweetmix</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/redrooster/block-gothic-rr\" rel=\"nofollow\">Block Gothic RR</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/flat-it/rama-gothic\" rel=\"nofollow\">Rama Gothic</a>/<a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/flat-it/dharma-gothic\" rel=\"nofollow\">Dharma Gothic</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fontbureau/heron-sans\" rel=\"nofollow\">Heron Sans FB</a> (probably the most interesting to rework), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/canadatype/trump-gothic\" rel=\"nofollow\">Trump Gothic CT</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/primetype/vielzweck\" rel=\"nofollow\">Vielzweck PTL</a></p>"
