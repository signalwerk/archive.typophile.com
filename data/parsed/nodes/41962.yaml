      <p>i agree with patty, but also i emphasize that while you're young it's extremely valuable to get into active teams (even as a freelancer) where you can learn about real world situations, client handling, production strategies of the experts (or at least the more experienced team members), problem solving, and larger format issues which you're likely to miss out on in a smaller independent capacity.</p>
      <p>even if your entry level tasks seem less creative or even menial, the on site experience is  priceless. if you're smart and can get things done you'll rise through the ranks soon enough.</p>
      <p>team experience in professional houses also scores points on a resume, and you can always pick up side work if you want more autonomy.</p>
