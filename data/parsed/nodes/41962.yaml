      <p>Adam - why not try to do both? Freelancing in a studio will give you a valuable look at how things are run, help you make connections, and maybe lead to a full-time position. Meanwhile picking up independent clients on the side will broaden your portfolio. </p>
      <p>If you are showing potential employers or clients work in which your contribution was small it is best to be very direct and clear about that. I knew a designer once who went around passing off logos she had inked as her own designs. The problem was that the person who had designed them was meeting with a lot of the same clients. Her reputation went south pretty quickly.</p>
