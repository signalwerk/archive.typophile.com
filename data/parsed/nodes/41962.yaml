    <p>I am four years out of school and looking for a full-time, entry level design position. It seems that here in New York City, freelance work is everywhere but full-time positions few and far between. And because most studios want someone with 2-5 years experience, I was wondering what the best course of action would be: Is it better to work freelance in studios, getting that "real world experience" but have very little original work to show potential employers?  -OR-  Do I go for independent clients that may pay little and are notorious for less impressive work, but will at least allow me to create most all the design myself, thus having more to show those potential employers?</p>
    <p>And if the former: What do you show potential employers when all of your work is but a small contribution to an otherwise large collaboration? How can you really show what work is yours.</p>
    <p>Any advice would be well appreciated.<br>
    Adam</p>
