    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Letter</strong></p>
    <p>The set of shapes upon which we all loosely agree on that carry certain <a href="/wiki/alphabet" class="freelinking" rel="nofollow">alphabetic</a> meanings and cues, which can be expressed with different <a href="/wiki/glyph" class="freelinking" rel="nofollow">glyphs</a> and <a href="/wiki/typeface" class="freelinking" rel="nofollow">typefaces</a>, as long as it shares enough of the commonly recognized shapes that it is recognized as a meaningful symbol.</p>
