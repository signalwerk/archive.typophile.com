    html: "<p>I misinterpreted your post. I thought you meant that this was the result of the exam and you wanted to tweak it. I agree with Tim on the french curves, if you aren't going to try a brush. <br> <br>A few more tweaks: Maybe this is just me, make your 'e's more e-like. They're a tad bit too vertical for my taste. Also, splay the legs of the 'A's a bit more to open up the counter (the space inside the 'A'). Make your 'D' less pointed and more bowled and curved. <a href=\"http://www.myfonts.com/fonts/linotype/trade-gothic/bold-no-2/\">Trade Gothic Bold No.2</a> is probably a good model for the 'DRAMA'. <br> <br>Good luck.</p>"
