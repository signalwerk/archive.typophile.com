    html: <p>Yes, a rapidograph pen and french curves are going to help. You can jack your curves up with some thin label stickers so the ink won't run underneath the curves. Apply the stickers to the side that sits against your coated illutration board so they lift the curve up from the surface. <br> <br>Best of luck.</p>
