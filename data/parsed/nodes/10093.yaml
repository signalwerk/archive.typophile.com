    html: <p>First off, welcome to Typophile. <br> <br>Secondly, your logotype has a decent concept and layout in this drawing, so that's good, but the strokes are weak. It's a very tricky but extremely important part of drawing type, particularly script faces. <br> <br>Without going into too much detail, what you want to do is draw the skeleton of the type, then apply the strokes to that, rather than drawing the outline. The strokes (in 'Queen') are meant to appear drawn with a brush or pen with which you can control the thicks and thins, right?. Right now, the strokes don't feel like fluid, organic, modulating line. I'd either get a Speedball pen or a brush and play around, or visit the site of Underware (a Dutch font house). They have some great curvy, full-bodied script fonts you could look at, such as <a href="http://www.underware.nl/site2/index.php3?id1=bello&amp;id2=overview">Bello</a>. They also have a site where they archive their <a href="http://www.typeworkshop.com/index.php?id1=type-basics">student workshops</a>, that may help you understand how letters are constructed and designed (without buying a book on the subject). <br> <br>Focus on 'Queen' first. Fix the strokes, close the space between the 'Q' and the 'U', and let that 'n' have a slightly more dramatic finish. <br> <br>Do that, then go back and tweak 'DRAMA'.</p>
