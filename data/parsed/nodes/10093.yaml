  html: <p>Hi guys, <br> <br>First post! As part of my ordinary secondary-level (high school) education, I do Art. One of our four exams is a design project. We get the brief a week before the exam but all the work must be done from scratch in two-and-a-half hours.  <br> <br>I did this by way of practice for this exam. No computers allowed! It was all graph paper and steel rules, done finally in Indian Ink on an A3 sheet of cartridge paper. It was my first experience drawing lettering in any meaningful way. <br> <br>The brief was to design a logo for a costume hire company. <br>  <br>What do you think? I'm sure there's room for improvement! <br> <br><img src="http://www.typophile.com/forums/messages/29/68660.gif" alt="Costume hire company logo"></p>
  html_clean: <p>Hi guys, <br> <br>First post! As part of my ordinary secondary-level (high school) education, I do Art. One of our four exams is a design project. We get the brief a week before the exam but all the work must be done from scratch in two-and-a-half hours.  <br> <br>I did this by way of practice for this exam. No computers allowed! It was all graph paper and steel rules, done finally in Indian Ink on an A3 sheet of cartridge paper. It was my first experience drawing lettering in any meaningful way. <br> <br>The brief was to design a logo for a costume hire company. <br>  <br>What do you think? I'm sure there's room for improvement! <br> <br><img src="http://www.typophile.com/forums/messages/29/68660.gif" alt="Costume hire company logo"></p>
