    html: <p>To help with the drawing process you might want to buy/borrow a set of french curves and some elipse tempates. Two and a half hours is a tight deadline, so you need to make it as easy on yourself as possible. On a type front the letters with curves at the top and bottom aceos etc should have a slightly larger x-height than the others. <br>Good luck <br>Tim</p>
