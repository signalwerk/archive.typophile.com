    html: |-
      <p>In a saddle stitched book with a large number of pages, the thickness of the paper can make the pages near the center of the book shift away from the gutter (“creep”), so you may want to make a small compensating shift in your margins.<br>
      If you are accordion folding, it sounds like you had a fairly low page count anyway.<br>
      An accordion fold puts all your pages on one long strip of paper. Depending on how many pages there are, and how wide they are, you could bump your job up to a more expensive press. For instance, if you have 8 panels across, and each panel is 4 inches wide, you can’t run on a 29-inch press, so you’ll have to run on a more expensive 40-inch press. And you won’t fit most digital presses either (they typically max out around 20 inches).<br>
      Another note about accordion folds: If this is a self mailer, you’ll have to <a class="freelinking-external" href="http://pe.usps.com/cpim/ftp/manuals/qsg300/q201b.pdf">put 4 wafer seals</a> on it.</p>
