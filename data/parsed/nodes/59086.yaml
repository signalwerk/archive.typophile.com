      <p>Again, with the accordion fold, talk to the printers. These are folded by machines, and they will have specific idiosyncrosies. The minimum panel to fold, maximum open length, etc. There may also be recommendations about layout for you to think about. Keep in mind that different printers will have different folding machines, so the maximum length at one place will be different from another.</p>
      <p>You want to design something that can be printed (folded) at at least one place. (Don’t laugh. Graphic arts students continually design beautiful projects that cannot be printed).</p>
