    html: |-
      <p>Running type across 2 panels won’t cause any problems at all for the printer. If you’re concerned about the reader, though, keep a couple of things in mind:</p>
      <li>Paper is made of fibers. Fibers distort along folds, and letterforms printed on those fibers distort, too. This isn’t a problem if your type is larger than about 14 pt., but don’t print smaller sizes across a fold.</li>
      <li>If you’re considering running text across 2 panels, remember that in full paragraphs, it’s hard for readers to follow text if the line length is more than about 60-70 characters. (I’m guessing here because I don’t know the trim size of your piece, or the width of the panels.)</li>
