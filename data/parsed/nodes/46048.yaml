  html: |-
    <p>Hello,</p>
    <p>I'm looking for a font ID on the rounded typewriter-y font used in the Clark's Shoes 'Enjoy Every Step' campaign.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/enjoy_6470.jpg"></div><br>
    Identifont and MyFonts came up with Antique Central and 58 Rodeo. They're close but aren't rounded and lack the swashes. I thought that perhaps it was a custom job, but then I saw the second sample whilst browsing through a magazine. It looked close enough to suggest that this could be an actual font.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bliss_5755.jpg"></div><br>
    Any help gratefully appreciated.<p></p>
    <p>Cheers,</p>
    <p>Brumble.</p>
