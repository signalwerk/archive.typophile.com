    html: <p><i>How original...</i> <br> <br>Actually, Target has been using Helvetica as part of their look consistently since the late '60s, back when it was "in" the first time around. The very first Target store, built in 1962, is (or, more accurately, was) about two miles from where I live. It was demolished about a week ago to make way for a bigger Target store. <br> <br>There was an earlier logo which is very hard to find examples of. It looked something like <a href="http://www.myfonts.com/fonts/linotype/poster-bodoni/bodoni-poster-italic/testdrive.html?s=target&amp;p=48" target="_blank">this</a>. It was used in early years when there were only a few stores.</p>
