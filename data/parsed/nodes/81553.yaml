    <p>Looking for blackletters on food packaging for the thread over in General Discussions, I saw this coffee brand over in the immigrant-item grocery store here in Kista, which appears to be from the Balkans somewhere, possibly Croatian as far as I can tell:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/artikel_9003_9004_9005_9006_4219.jpg"></div><p></p>
    <p>I really like the script at the bottom, that says "mljevena" and "pcžena u zcnu". It seems to nicely synthesise Baseball-style scripts with contemporary blackletters like <a class="freelinking external" href="http://new.myfonts.com/fonts/underware/fakir/" rel="nofollow">Fakir</a> and <a class="freelinking external" href="http://www.houseind.com/fonts/blaktur" rel="nofollow">Blaktur</a>, or possibly something in the Grecian vein, like the italic of <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100000" rel="nofollow">Acropolis</a>.</p>
    <p>Any idea what it could be? Custom? Or a typeface?</p>
