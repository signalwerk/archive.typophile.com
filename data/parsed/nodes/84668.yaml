      <p>Some thoughts:</p>
      <p>Appearance of equal length is often good to maintain, but there's<br>
      also the matter of meeting user expectations of lines not touching.</p>
      <p>Varying extender length is a fabulous unexplored avenue in text face design.</p>
      <p>The best Italic "f" (in a text face) is one that does not descend at all.</p>
      <p>hhp</p>
