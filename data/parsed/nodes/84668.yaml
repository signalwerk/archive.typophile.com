      <p>That’s an important point I overlooked. Thanks, quadibloc! Of course ‘f’ is one of the very few letters that grow a descender in italics (well, not <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_profile_pro_regular_italic/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=120&amp;sample_text=qgpfyjxa&amp;ft=liga&amp;acs_pt=32" rel="nofollow">always</a>).</p>
      <p>Interestingly I find the shortened ‘f’ to work quite well in Tisa, especially when there are no letters with a longer descender immediately adjacent (what I <cite>do</cite> find distracting is <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_tisa_pro_regular_italic/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=120&amp;sample_text=affable&amp;ft=liga&amp;acs_pt=32" rel="nofollow">this</a> ligature). The absence of a sweep to the left seems to make the unusual length more tolerable. In most other typefaces you mentioned the discrepancy feels unbalanced to me or at least as if they forgot to apply optical correction.</p>
