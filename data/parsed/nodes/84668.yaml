      <p><cite>But why would you make the descender of just one letter shorter than the others? And if you decide on doing so, why the ‘f’?</cite></p>
      <p>I would have thought the reason for that is <em>obvious</em>.</p>
      <p>The lowercase f normally has a descender in <em>italics</em>. It normally does not have a descender in the Roman.</p>
      <p>Hence, if one is designing a typeface that is to have a slightly cursive feel to it, one might give the f a partial descender in the Roman.</p>
      <p>On the other hand, if one wants to "modernize" the italic of a typeface, make it less cursive, but more like a sloped italic, then one might shorten the descender of the f without eliminating it entirely.</p>
      <p>I don't think this is particularly common, but it's something that might occur to people when trying to design a typeface that is "just a little bit cursive". It might indeed be a horrible mistake when they do it, just as you say.</p>
