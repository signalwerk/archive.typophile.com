      <p>Thank you very much for the pointer! I did check several popular old style typefaces, including both older and more recent releases, without finding a short ‘f’:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Descender length_3659.png"></div><p></p>
      <p>From top: Arno, Cambria, Constantia (all 2007), Adobe Garamond (1989), Minion&nbsp;(1990), Palatino (1948), Scala (1999), Times New (1932), Warnock (2000).</p>
      <p>Is the short ‘f’ descender a historical revival or an innovation of this century? Meta Serif, Tisa and Expo all are less than five years old. I was wondering whether the short descender serves any practical purpose I fail to see or whether it is rather a quirk that typeface designers might introduce depending on their taste.</p>
