    html: |-
      <p>You can't turn of basic script shaping features via OpenType Layout UI controls. Such controls are intended to control discretionary typographic features (as in the case of the Gabriola ligatures in your other test), not fundamental features of writing systems. The init, medi and fina features are applied by default to the Arabic script, and cannot be turned off. If one wants to disable such shaping, one has to do so via Unicode control characters such as zero-width non-joiner (U+200C).</p>
      <p>[Note that what you describe in the MSDN forum as an Arabic 'ligature' is not, in fact a ligature, but an init glyph followed by a fina glyph.]</p>
    html_clean: |-
