    html: |-
      <p>First, drag your generated font back into FontLab and check that the encodings have been correctly applied. This will rule out the possibility that the bug is in the font cmap table.</p>
      <p>As I recall, Windows apps expect any Arabic font to contain the OpenType GSUB features for init, medi and fina form substitutions, and may presume any Arabic font without them to be broken.</p>
