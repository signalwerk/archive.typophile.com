    html: |-
      <p>Perhaps Word automatically attempts to use the correct initial, medial, and final forms, and ignores your Isolated forms.</p>
      <p>I don't know about Word, but InDesign allows you to manually select the forms. IIRC it also defaults to 'Automatic', but in the Character panel menu ► OpenType ► Positional Forms you can select "Isolated Form".</p>
      <p>If this works and you are not planning to add the other glyphs, you could simply copy your glyphs into the positions for the others.</p>
    html_clean: |-
