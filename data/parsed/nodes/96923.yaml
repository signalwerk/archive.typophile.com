    <p>Hello,</p>
    <p>I am developing a very basic Arabic font using my hand writing, using FontLab on Windows 7.</p>
    <p>The problem is that I cant get the font to display in MS Word as well as InDesign.<br>
    No glyphs are shown. Only .NOTDEF shows for each character. I guess this has something to do with encoding, but cant figure out where to look for the solution.</p>
    <p>Kindly help.</p>
    <p>Thanks and regards.</p>
