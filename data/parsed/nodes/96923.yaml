      <p>Hello,</p>
      <p>Thanks Bob H, Theunis de Jong and John Hudson for replying.</p>
      <p>As I figured it, and correctly pointed out by John Hudson, the CMAP table was corrupt for my font.</p>
      <p>The solution:  I created a new font file from scratch and copy pasted the glyphs from old to new file.<br>
      Little bit of hassle, but the font is in initial stages so it was not a big deal.</p>
      <p>As an aside, I would request the community here to create a template for Basic Arabic font, and provide it as an starter for beginners. Or, if such resource exists provide a pointer to it.</p>
      <p>Thanks again for all the helpful answers.</p>
