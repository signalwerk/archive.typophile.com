  html: |-
    <p>Today, the <a href="/wiki/Diacritics%20Project" class="freelinking" rel="nofollow">Diacritics Project</a> was updated. Diacritics Project is a database of information related to diacritics: the correct shape, size and position of each accent. There are also lists of accented or special characters used in particular languages, historical background, language specific information, useful links etc. Many typographers contributed to the open project during last months. </p>
    <p><a href="http://diacritics.typo.cz" title="http://diacritics.typo.cz">http://diacritics.typo.cz</a></p>
    <p>Now the accents are grouped by a script. The database supports following scripts: Latin, Cyrillic, Greek, Sanskrit, and Arabic; other scripts could be added on request.</p>
    <p>I would like to invite you to <strong>join the project and to share your knowledge</strong> with other typographers.</p>
