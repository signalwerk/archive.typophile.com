      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Javal-Fig-60_5369_NS1_5597.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Javal-Fig-60_5369_NSb_3520.png"></div><br>
      I don't think there's much to be gained by detailed analysis of the measurements of Javal's specimen.<br>
      For the purposes of his argument, he was quite satisfied to consider the "hauteur des lettres" to be the nominal point size of the type.<br>
      However, to this day there is still no standard, objective way of defining type size.<br>
      The problem is fundamental, as was discussed in a recent Typophile thread about the definition of the em.<br>
      Still more recently, another thread discussed the design of "small" type, and the adjustments that type designers make to scale a style up or down (and by "scale" I don't mean in a strictly mechanical sense).<p></p>
      <p>These are some of the things that may be modified:<br>
      * x-height relative to cap height<br>
      * descender length relative to x-height<br>
      * serif width relative to stroke width<br>
      * sidebearings relative to letter width<br>
      * horizontal-to-vertical proportion of letter<br>
      * size on the body (i.e. how close extenders come to the edge of the em)<br>
      * contrast between thick and thin strokes<br>
      * weight</p>
      <p>I don't think this is a longer list for the designer of digital type than for the punchcutter, it's just that considerations which were once absolute are now relative.</p>
      <p>The amount of press gain in play (or anticipated) is hugely significant. A type which has an even scaling of weight, such that different sizes appear to be the same weight on coated stock, will, on uncoated stock, appear to be a heavier weight the smaller it gets.</p>
