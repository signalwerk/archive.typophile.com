      <p>Thanks Jongseong, this is much better than my previous Bablefish translation... but am trying to make it clearer...</p>
      <p>By tweaking this a little would this still be an accurate translation.... (or have I gone too far...)</p>
      <p>Upon a first glance, it is seen that line length decreases in direct proportion to the diminishing height of the letters. However under closer scrutiny, the line width decreases at a slower rate than to that of the height. The punch-cutters have recognised that by allowing the letters to become proportionally wider as the text becomes smaller maintains legibility. They understood that a negative impact in legibility is mainly attributable to the decrease in the width of the letters resulting from a 'natural' reduction in scale.</p>
      <p>I have included the Fig from the Book however - it doesn't follow the rule observation above very consistently!</p>
