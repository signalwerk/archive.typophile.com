      <p>The more I look at the fit for sizes under 10 points with the CM font, the more I am surprised. If I rely on Haralambous 1993, <em>Parametrization of PostScript fonts through METAFONT — an alternative to Adobe Multiple Master fonts</em> (<a href="http://omega.enstb.org/yannis/pdf/epodd-93.pdf" rel="nofollow">pdf, 552K</a>), sizes under 10 points are to be treated differently from those above 10 points. This thread being concerned with small sizes, we may just forget what happens above 10 points. It is also said that, from the 62 parameters used to generate a CM font, two are relevant for this scaling, "cap-stem" and "slab", shown here.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/stemandslab_5159.jpg"></div><br>
      On page 155 (Section 7, optical scaling) Haralambous goes on to say:<p></p>
      <dd>
      To achieve optical scaling we will apply general rules (again quadratic approximations to known examples) to create distinct fonts for every point size. The task of making the necessary measurements has been done by D. E. Knuth on Monotype Modern 8A (cf. [6, p. vi]). We will take his results and apply them to our case, since optical scaling coefficients have more to do with the properties of human vision than with the style of the font.<br>
      </dd>
      <p>Just for the record, those values are (cmr17 size being actually 17.28 points)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/parameters_3769.jpg"></div><p></p>
      <p>What I find surprising is that those values supposedly obtained after actual measurements have no direct obvious relationship with the line length. On the other hand, if all the lines in the grabs above end on the blue line, then that means that the length L(s) of the line at s points (for s less than 10) satisfies the formula L(s) = ms(s-1)+b where m and b are constants to be found by measurement. I wrote a XeLaTeX program that outputs the exact value of <strong>Length</strong> for each size <strong>s</strong> and then used Excel to find m and b (by linear regression of <strong>Length</strong> vs <strong>s(s-1)</strong> .<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/regression_3426.jpg"></div><br>
      I get that the length <strong>Length</strong> at size s is 0.5427s(s-1)+71.5982 with an error that is less than 1% in all cases but one, and less than a quarter of a percent in all cases but two.<p></p>
      <p>How could such a precise relation (quadratic in the size s) hold for Monotype Modern 8A, or even for any CM family whose parameters would have been filled by inspection and measurement?</p>
      <p>Michel</p>
