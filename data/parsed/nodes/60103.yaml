      <p>“se rendre compte de” means “to realize”.</p>
      <p>If that is so, what does "recognize without realizing" mean?!</p>
      <p>The text in question was written over 100 years ago. Words and phrases have many meanings, which change according to time and context; dictionary translations also change, and writers can indulge in word play. </p>
      <p>With that in mind, I translated "sans bien s’en rendre compte," as "instinctively", <em>taking into account</em> that the word "compte" may perhaps contain at least a trace of its discrete meaning. </p>
      <p>**</p>
      <p>Interestingly, the word "capital" (French) would have translated very nicely into "capital" (English) 100 years ago, although now that is an archaic usage (e.g. "Capital idea, Watson!" -- Sherlock Holmes). Is "capital" (French) in the Javal usage similarly archaic?</p>
