      <p>For me this is one of those black art - secret knowledge things, - that continue to bug me.</p>
      <p>A properly performing optical cascade is a rare thing. It would be an interesting project to compare from different foundries who were considering such things up until the beginning of the 20th century. I think by the time we get to Univers, new rules are in place and old ideas have gone (lost). We are now grappling for this insight.</p>
      <p>Where cascades are irregular (such as this one), it is really interesting to try and work out what was going on in-terms of intention, limitations and practical approaches to achieving intended results. Odd discrepancies such as the narrow set 4pt add added intrigue also reminding us that rules are to be broken when necessary.</p>
      <p>Why I have been fascinated in Javal, is that he is a lay person with a keen interest in optics. My imagination has him in correspondence with M. Tegu (perhaps actual meetings) where the secrets of type manufacture are being explained to him (Javal is blind), then they are being recounted in the book but only as half facts because Javal doesn't quite have the right knowledge to know for instance, if the punch-cutters (engravers) actually knew what they were doing!</p>
      <p>But it is precisely this outside position (mentality) which gave him permission to create with M. Dreyfuss radical designs solving optical problems.</p>
      <p>/m</p>
