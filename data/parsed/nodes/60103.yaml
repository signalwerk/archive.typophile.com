      <p>The paragraph that comes before the figure is: "Note that usual typographical characters don't give specimens that would come out if we simply scaled down the letters. Here is a series of types". The figure was thus clearly typeset with available characters. I think Javal expected the available fonts would behave in such a way that when the lines are typeset with them, the right ends would make about the same curve as CM does here (of course, at 4 points, it was also an optical that was to be chosen). I don't know how many fonts were available at the time but it is my feeling the typesetter may have chosen the fonts to get a figure to his liking; he did not understand what Javal had in mind. Don't forget that Javal graduated in 1860 from <a href="http://en.wikipedia.org/wiki/École_nationale_supérieure_des_mines_de_Paris" rel="nofollow">Ecole des mines de Paris</a> before studying medicine. He had an excellent background in mathematics and physics.</p>
      <p>Note: the straight blue line corresponds to the imaginary line the reader would have traced from the end of the line at 14 points to 0 points, at the bottom of the figure.</p>
