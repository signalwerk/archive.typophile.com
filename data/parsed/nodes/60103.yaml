    <p>I would very much appreciate the following paragraph to be translated to enable a clearer insight of Emilé Javal's finding on the relationship between type design (width?) and legibility...</p>
    <p>This is for my MA thesis: Compact Typography:The design of typefaces conceived for small size applications.</p>
    <p>Your help is greatly appreciated. I intend to post my specific findings on Javal and Dreyfuss's experiment here on Typophile.</p>
    <p>Here is the text...</p>
    <p>On voit que la longueur des lignes diminue en même temps que la hauteur des lettres, mais que la diminution de largeur est bien plus lente que celle en hauteur, parce que les graveurs ont reconnu, sans bien s’en rendre compte, que la diminution de lisibilité est attribuable principalement à la diminution de largeur des lettres. C’est là un fait capital que nous avons signalé depuis longtemps.</p>
    <p>Thanks,</p>
    <p>Michael Hernan</p>
