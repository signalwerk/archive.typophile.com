    html: |-
      <p>I was surprised to see Computer Modern used as an example! However upon reflection I realise that it is a great model to continue the argument because it forms an ideal to which to contrast against.</p>
      <p>Without undermining the sophisticated algorithms used by Computer Modern, it is still (to me) a very single minded and inflexible approach which is insensitive to broader or task specific usage.</p>
      <p>The original (Deberny) Javal (Fig.60) example is a more sophisticated model. (If we can assume that the figure *was* broadly the intention of the author)... Where we see a single arch in Computer Modern, in Fig 60 three arches can be seen which correspond to broadly accepted typographic usage's; Text, Footnote and Caption.</p>
      <p>I have an open agenda in promoting such a 'range' concept or 'size specific' design as I believe high quality typography comes out of such considered usage.</p>
      <p>Multiple approaches (non exclusive) have been revealed so far:</p>
      <p>A: CM - Design changes algorithymically where interpolation between a big and small size affects the with of a type to become wider the smaller it gets.</p>
      <p>B: Size Specific (Type I) - Litterally size specific with out attributed task. Each size has a slightly different design at the discretion of the punch cutter or designer seen with the 18c Caslons (seen also in Miniscule (inspired by Javal/Dreyfuss experimental designs)) without a specific task attributed to the design</p>
      <p>C: Size Specific (Type II) What I will call the AdobePro model (is there a more accurate term for this) which assigns a names use to a design.</p>
      <p>D: ??</p>
      <p>Note: I think it is worth mentioning for clarity for anyone new to this topic that what is not obvious until someone is made aware of the fact (was so in my case) that all the above conditions are in contrast to much of what exists in out digital type Library, which I can state confidently are types for the most part developed to work best at 9-12pt.</p>
    html_clean: |-
