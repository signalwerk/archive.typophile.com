      <p><em>One sees that line length decreases with letter height, but the decrease in width is much slower than that of height, because engravers recognized, instinctively, that decrease in readability is mainly attributable to decrease in letter width. Therein is a major effect which we </em>[I] <em>have long pointed out.</em></p>
      <p>In the chart, letter height decreases from 14 to 4, a factor of 3.5.<br>
      Line length decreases by a factor of 3.<br>
      All he's saying is that 3.5 is bigger than 3.<br>
      I don't think he intends there to be any exactitude in his demonstration, if one takes "sans bien s'en rendre compte" quite literally, i.e. "without properly committing themselves to counting".</p>
