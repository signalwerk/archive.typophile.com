      <p><cite>I have included the Fig from the Book however - it doesn’t follow the rule observation above very consistently!</cite></p>
      <p>First, I don't think that "en même temps" is to be interpreted as meaning "directly proportional". I read it as meaning that if point size decreases, so does the length of the line displaying a full alphabet. I would rather translate as follows: "The line length (in fig 60) is seen to decrease with point size" (which is a weird way of saying that the line length is an increasing function of the point size). The citation also means that if character height is decreased by some percentage, then the width will be decreased by a smaller percentage. That seems to be true except for the lines at 5 and 4 points. Indeed 4 points 20% less than 5 points but the length at 4 points seems to be about 24% less than that at 5 points.</p>
