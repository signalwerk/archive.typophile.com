      <p>I found the first translation by Jongseong very accurate and to the point, there's no need in over analyzing the syntax.<br>
      But I think it's important to note that the punchcutters didn't work in vectors and so scaling up and down was not available. In fact they didn't even think of it that way they had no intention of scaling the shapes they were cutting, because they were not executing architectural drawings. What they were doing were size specific fonts (size specific fonts were a technical limitation here, not a readability or aesthetic issue) then it made sense that all the sizes have the same style or be on "typeface"</p>
      <p>:D I just finished reading Counterpunch by Fred Smeijers and became an expert on punchcutting!</p>
