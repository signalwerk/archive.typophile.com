      <p>We see that line length diminishes at the same time as the height of the letters, but that the decrease in the width is much slower than that of the height, because the engravers have recognized, without fully realizing, that the decrease in readability is mainly attributable to the decrease in the width of the letters. That is an important fact that we have noticed for a long time.</p>
      <p>ETA: <em>graveur</em> probably should be taken as 'typecutter' in this context. Whether <em>lisibilité</em> is translated as 'readability' or 'legibility' depends on how you're using the terminology...</p>
