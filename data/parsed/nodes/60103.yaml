      <p><em>...the law expressed by Javal.</em></p>
      <p>What law?<br>
      He made a general observation, with a single typeface (or several, as it transpires?!) as example.<br>
      And his definitions of distance-- "hauteur", "largeur", and "longeuer"--are non-typographic with no mention of point size, x-height, letterspace, or picas.<br>
      Furthermore, line-space (leading) is fudged by equalization.</p>
      <p>Nonetheless, there is some truth in his observation, that display sizes tend to be more condensed than regular text, and micro-sizes expanded horizontally.<br>
      He attributes this to the demands of readability, however, my theory is that it is because in toto, there is more room for letter details to be heavied up in the vertical axis--which they must be when reduced in size, to avoid disappearing from sight-- by expanding into "ascender space", than along  the x axis. Therefore in the smaller sizes, extra proportional "heft" is accomodated in the vertical space of the type body, by increasing x-height, but that produces a condensed letter shape, so to maintain letter proportions, the character width is increased.</p>
    html_clean: |-
