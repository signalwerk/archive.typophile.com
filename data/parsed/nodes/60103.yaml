      <p>Michael, Maybe I was too categorical in my statement.</p>
      <p>Since all the lines are equally spaced vertically with a constant increment of 1 point, the line length would in fact be directly proportional to the point size if all lines ended on the diagonal red line in the following figure (since both vertical and horizontal scales are then linear).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Javal2_5539.jpg"></div><br>
      This would happen if the width of each character was proportional to its point size i.e. if incrementing height by a certain percentage would correspond to incrementing width by the very same percentage.  Now, most characters are taller than wide. For a character that is twice taller than wide, if proportions are always kept that way, the rate of increase of the height of that character will always be twice the rate of increase of its width; that is a trivial mathematical fact, having nothing to do with the skills of punchcutters; I thus can't image this is the kind of speed Javal had in mind and that is why I took for granted that he was comparing relative changes instead of absolute changes. If my interpretation is correct, then the line ends are not on the red diagonal (I guess they should be on some convex curve) and the line at 4 points should be much longer.<p></p>
      <p>After looking at other threads and links concerning that book, I now feel like  having a look at it. I guess I'll do that tomorrow.</p>
      <p>Michel</p>
