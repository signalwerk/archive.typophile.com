    html: |-
      <p>You could certainly solicit bids here, but please post an email address for people to reply to so that the thread doesn’t turn into a fight over pricing. </p>
      <p>Also consider AIGA Design jobs, a special version of Coroflot that only displays the portfolios of AIGA members. I don’t mean to suggest that AIGA designers are better or more reputable than other designers, but I find that most of the really bad/sleazy designers out there aren’t willing to pay for an AIGA membership and create another online portfolio.</p>
