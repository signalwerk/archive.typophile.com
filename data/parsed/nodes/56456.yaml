    <p>I did a search and couldn't find any information on this subject here.</p>
    <p>I am curious:</p>
    <p>Does anyone know a reputable place to look for freelance web designers / designers in general that can produce quality work? (Not eLance, craigslist, or Contracted Work - I have tried these services, and the designers are way sub-par for my interests.)</p>
    <p>Is this a place I could solicit bids? </p>
    <p>This board offers some of the most respectable designers on the web, and I figured I'd come here for answers.</p>
    <p>Thank you.</p>
    <p>Adam Dolch</p>
