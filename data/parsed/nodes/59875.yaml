  html: |-
    <p>Greater Albion Typefounders has just launhed a Gallery Page as a companion to our announcements blog.  The aim is to showcase typefaces in action.</p>
    <p>We've started off with a small collecton of images showcasing the role of typefaces in promoting the world's favorite confectionery, chocolate.  We plan to grow the gallery into a large archive.</p>
    <p>As well as our own material, we'd welcome any Gallery contributions from users of our typefaces-which can be e-mailed to <a class="freelinking external" href="mailto:gatf1@live.com " rel="nofollow"> gatf1@live.com</a> in .png, .jpg or .pdf formats.  A fully licensed copy of Absinette Regular will be supplied to everyone whose work is displayed in the gallery.  Feel free to base your work on any of out faces (including the free ones on Myfonts.com) and let us know your prefered format for Absinette regular .ttf or .otf, as well as what acknowledgement you'd like your ontribution to be credited with.</p>
    <p>In the mentime come and brows in our <a class="freelinking external" href="http://gatf.wordpress.com/gallery/ " rel="nofollow"> gallery</a>.</p>
