    html: <p> I guess you'd have to be a typographic news junkie to know the current standing of any one of these people.  <br>Frere-Jones is high profile due to being the most prolific designer at Font Bureau - I think. Maybe he does commissions too. So there's a tentative yes. <br>Zapf at, what is it, 85 could still walk into most any big corporation and they'd hire him as a  consultant. But I think I agree that perhaps he isn't that active compared to the younger professionals on this list. <br>Licko's reputation seems to rest as much on her other work and that of her partner, Rudy VanderLans as her type work.  <br>I don't believe Tankard should be on the list. I think his case needs to be made.  <br>The Dutch twins I think shouldn't be there as they most probably make a fortune as the hottest graphic designers over there, doing stuff for tv etc. I'm sure their font design work doesn't earn that much. <br>Unger and Carter are automatically on the list.  <br>Porchez is probably the Jonathan Hoefler of France. <br>Roger Black - yes - what have you done for me lately? But he does have an impressive track record. That's why I first put him in. <br> <br>I think we can only get there by discussion and consensus. <br> <br>Please throw your 2¢ in... </p>
