    html: <p> Hrant! - You're right. I think these designers are effectively their own "patrons" or "sponsors". They have a real income from other sources which subsidizes the labor of love that is type design.  <br>The number of type designers in the world that make enough money to call it their sole profession (that's not the best definition, but hopefully you understand what I mean) is probably less than twenty. (And if we put our heads together we could probably come up with a list of exactly who those people are.)  <br>I would be willing to bet that they can only say that because they are the sort of elite graphic designer who gets commisioned for a new font for a magazine or newspaper - NOT because they make so much money on retail sales of their fonts. <br>(By the way, I am not referring to lettering artists. Strictly designers of fonts available to buy retail.) </p>
