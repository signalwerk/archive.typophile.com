    html: "<p>Hrant! <br>I must admit, I did my research on font publisher's payments a few years ago when I was submitting designs. (I was only successfull once - selling Eastwood to ITC: <a href=\"http://www.itcfonts.com/fonts/detail.asp?sid=1X7VX1BE6C8S9KPC544DAL9CEE500439&amp;sku=ITC2126\" target=\"_top\">http://www.itcfonts.com/fonts/detail.asp?sid=1X7VX1BE6C8S9KPC544DAL9CEE500439&amp;sku=ITC2126</a>) (If anyone wants to know the story of the font, how long it took to make and how much money it has made so far then by all means email me.) <br>Perhaps I had, by then, learnt to attune my design submissions to ITC's sensibilities. But also, by that time I was tired of my work falling on deaf ears - so to speak - and I gave up.  <br>If I could come out with a new font once a month then $2500 or $2000 might be attractive. We all know though that this work rate is unrealistic.  <br>Also, like every other type designer who ever lived I was self-taught and had to learn everything the hard way, including the commercial side of the profession. Unfortunately I found that all too often, other type designers were simply coy about the commercial aspect of their work and would never get into conversations on the nitty gritty details about how much they were paid for particular fonts and how long the work took. This secrecy seems to continue today, and it remains a mystery to me how online font publishers such as Chank, Larabie et al make enough money to justify the work. I'm quite certain that font design is subsidized by the other professional work such graphic designers do, and is not really a viable economic concern in and of itself. <br>Sorry that the discussion has gone off topic. I'm new to this forum and just took the opportunity to bring up this subject.</p>"
    html_clean: "<p>Hrant! <br>I must admit, I did my research on font publisher's payments a few years ago when I was submitting designs. (I was only successfull once - selling Eastwood to ITC: <a href=\"http://www.itcfonts.com/fonts/detail.asp?sid=1X7VX1BE6C8S9KPC544DAL9CEE500439&amp;sku=ITC2126\" target=\"_top\" class=\"link-external\">http://www.itcfonts.com/fonts/detail.asp?sid=1X7VX1BE6C8S9KPC544DAL9CEE500439&amp;sku=ITC2126</a>) (If anyone wants to know the story of the font, how long it took to make and how much money it has made so far then by all means email me.) <br>Perhaps I had, by then, learnt to attune my design submissions to ITC's sensibilities. But also, by that time I was tired of my work falling on deaf ears - so to speak - and I gave up.  <br>If I could come out with a new font once a month then $2500 or $2000 might be attractive. We all know though that this work rate is unrealistic.  <br>Also, like every other type designer who ever lived I was self-taught and had to learn everything the hard way, including the commercial side of the profession. Unfortunately I found that all too often, other type designers were simply coy about the commercial aspect of their work and would never get into conversations on the nitty gritty details about how much they were paid for particular fonts and how long the work took. This secrecy seems to continue today, and it remains a mystery to me how online font publishers such as Chank, Larabie et al make enough money to justify the work. I'm quite certain that font design is subsidized by the other professional work such graphic designers do, and is not really a viable economic concern in and of itself. <br>Sorry that the discussion has gone off topic. I'm new to this forum and just took the opportunity to bring up this subject.</p>"
