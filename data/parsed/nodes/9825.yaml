    html: <p> Jared may want to move this monster thread into the  <br>General Discussions category (or create a new category  <br>for "Wild Speculation") but it's still good fun. <br> <br>The Font Bureau boys, Licko, and Hoefler/Jones  <br>(they work together now) are in a special category  <br>because a substantial portion of their income is  <br>certainly from their respective corporations (foundries) <br>consisting partly of designs other than their own.  <br>So perhaps this is a list of designers who *could* make  <br>a living designing type but happen to supplement  <br>those earnings with other work. In that case the Dutch  <br>fellas and Quay and Sack would be back on board.  <br>What about the folks at Dalton Maag and Wolff Olins? <br> <br>Of course this opens up a big ol' can of subjectivity  <br>worms. Who's to say these folks could or could not  <br>make a living solely from their own type designs? <br> <br>I suppose the original goal was to decide how good <br>you have to be or how rare it is to make a decent <br>living designing type. Which category of list brings us <br>closest to that goal? <br> <br>Stephen </p>
