    html: "<p>This can get interesting. But let's clarify <br>things a bit. Am I correct in assuming that: <br> <br>1. The List contains those who make *most* of their living from their own type designs (not lettering, not anything else), be it custom or retail. (I think we can all agree that virtually nobody can survive on just retail). <br>2. Fame has nothing to do with it. <br> <br>If so, Black and Spiekermann I don't think are on there. Zapf is hard to tell these days. Licko is probably that side of the border (she was commissioned -using the term somewhat loosely- for Journal, I think). Shinn is unlikely (as much as I like his stuff). Unger is a strong contender (but note that he teaches). Tankard definitely. Quay I don't think. Also, Miles Newlyn might be a possibility, but I don't know what he's up to lately. And Tobias Frere-Jones is probably in there. David Berlow might be, if he doesn't make too much money outside his own type designs. And don't forget the Dutch Twins (even though they bend the definition of \"type\" - good for them). <br> <br>BTW, another great on-line source for designers (and others in related fields) is: <br><a href=\"http://www.myfonts.com/Person\" target=\"_top\">http://www.myfonts.com/Person</a> <br>You can also search by \"Activity\", like: <br><a href=\"http://www.myfonts.com/Activity1.html\" target=\"_top\">http://www.myfonts.com/Activity1.html</a> <br> <br>So here's my \"cut\": <br> <br>Matthew Carter <br>Tobias Frere-Jones <br>Jonathan Hoefler <br>Jean-François Porchez <br>Jeremy Tankard <br>Erik van Blokland <br>Just van Rossum <br>Gerard Unger <br> <br>Sorry for not really growing it...  :-/ <br>If we're lucky, I'm wrong. Plus I'm sure <br>there are some smaller names we're <br>missing, like maybe Frantisek Storm? <br> <br>So, Stephen, it's looking like 10 is a *great* estimate! <br> <br>hhp</p>"
