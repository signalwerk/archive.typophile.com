    date: 2001-09-10T15:24:00
    date_raw: 10 Sep 2001 — 3:24pm
    votes: null
    html: "<p> Stephen: <br>I think we shouldn't go hypothetical - it's too distracting. As for the \"corporation\" aspect you bring up, that's definitely something to consider, but only case-by-case. I have to agree with Martin, and restate that -to me at least- the most useful question to [try to] answer here is: who makes most of their living from sales of their own designs? In the case of FB, it's difficult to say who gets how much of what (I'm sure some of you know, though); in the case of Emigre, it's clearer (see below); and in the case of HTF, although it's getting less clear, it's still relatively very clear: Hoefler's library is mostly his - he's the one who worked on  the bulk of the designs, and he's the one who gets most of the cash. TFJ is his partner now (but an equal partner?), so that makes it trickier, but I don't think HTF is really a \"font house\", so I suspect TFJ gets most of the money from his own designs. Insiders please correct me if I'm wrong. <br> <br>Joe: <br>In the case of Emigre, I have to ask: fonts designed by *whom*? In the past three years Licko has designed one new font family. And surely RvL doesn't live off of Suburban... Like most font houses, Emigre gives between 10-20% royalties to its designers, and the rest could be enough to make a living (although less and less with each passing day), but to me that's really beside the point: we're talking about investing time designing type, not leveraging a powerful brand to profit from the design work of others, as smart as that is (or at least used to be). <br> <br>hhp </p>"
