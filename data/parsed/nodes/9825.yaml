  html: "<p> Martin, <br>Adobe also offers an up-front payment, but I think it just covers your sales upto that amount (you only get more money if the royalties from sales surpass that amount). <br> <br>But in any case, you're right about the money aspect: there's almost none of it in retail, and to make a living (and I don't mean being a hermit in a barrel) you have to do many years of very high-quality custom work. And even then, you can never catch the Concorde. So, in the end, it's really a labor of love. And I mean that in the best possible way. I have bills too, but I always try to remember that they're evil. <br> <br>BTW, Stephen, is the Bitstream deal perpetual? If so, $2000 is way too low, unless the royalties are pretty high. <br> <br>hhp </p>"
  html_clean: "<p> Martin, <br>Adobe also offers an up-front payment, but I think it just covers your sales upto that amount (you only get more money if the royalties from sales surpass that amount). <br> <br>But in any case, you're right about the money aspect: there's almost none of it in retail, and to make a living (and I don't mean being a hermit in a barrel) you have to do many years of very high-quality custom work. And even then, you can never catch the Concorde. So, in the end, it's really a labor of love. And I mean that in the best possible way. I have bills too, but I always try to remember that they're evil. <br> <br>BTW, Stephen, is the Bitstream deal perpetual? If so, $2000 is way too low, unless the royalties are pretty high. <br> <br>hhp </p>"
