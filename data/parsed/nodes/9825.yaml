    html: "<p> Well, every case is different, and people mean different things by \"living\" in \"earn a living\"... But I think you've hit the nail on the head about \"subsidizing\": Chank for example sells paintings on e-bay for a lot of money. In my case, I'm a Macromedia Director developer, and even with the crappy economy my de facto hourly rate (as opposed to the rate I quote my clients) is pretty high. Lastly, about secrecy: there's still a lot of it, but all indications are that it's much better now than in the olden days. <br> <br>hhp </p>"
