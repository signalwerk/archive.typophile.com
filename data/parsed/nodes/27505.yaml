      <p>I'm usually not a big Rotis fan, but I like how this looks.</p>
      <p>To me, a compass is signified by an arrow pointing north. I see you've got an arrow in there, but it's pointing west.</p>
      <p>Does the spot on campus called La Brújula have some sort of recognizable landmark that could be worked into the logo?</p>
      <p> - Lex</p>
