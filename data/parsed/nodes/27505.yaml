      <p>I have reservations about the ru ligature, certainly there is a white area in the original, but that is part of the nature of the characters and I think that it is important to keep them seperate, in order to address the uneven white space I would suggest kerning the other characters further apart and redrawing the loop of the j to compensate (though without the arrow). I would also consider dropping any pictorial reference to a compass, there is enough in the name and I assume nearly all the students would make the connection. For the La the unicase style isn't working for me could you make them the same point size and nestle the a in the angle of the L. I find the accent a little stunted as if it is cut off before it reaches a point, the purpose would I guess have been to make it work within Rotis at text sizes, I think you could make it lean more to the horizontal more sympathetic to the angle of the serifs and finish it with a narrower end and return to the cropped off serif, you could even consider removing the dot of the j.<br>
      Tim</p>
    html_clean: |-
      <p>I have reservations about the ru ligature, certainly there is a white area in the original, but that is part of the nature of the characters and I think that it is important to keep them seperate, in order to address the uneven white space I would suggest kerning the other characters further apart and redrawing the loop of the j to compensate (though without the arrow). I would also consider dropping any pictorial reference to a compass, there is enough in the name and I assume nearly all the students would make the connection. For the La the unicase style isn't working for me could you make them the same point size and nestle the a in the angle of the L. I find the accent a little stunted as if it is cut off before it reaches a point, the purpose would I guess have been to make it work within Rotis at text sizes, I think you could make it lean more to the horizontal more sympathetic to the angle of the serifs and finish it with a narrower end and return to the cropped off serif, you could even consider removing the dot of the j.<br>
      Tim</p>
