      <p>Hi lex,</p>
      <p>Well, the spot on the campus is actually a compass, made out of bricks rising about 30-40 cms as a flat circled surface of a 2-2.5m diameter, having a compass drawn (incrusted metal of some sort) on its top. I'll try to get a picture soon.</p>
      <p>I see what you mean about the arrow. We were trying to make it more typographic rather than analogical (didn't wanted to show an actual compass), we only intended to show direction (notice oneway serifs), but the fact that it is "pointing" west I haven't realized.</p>
      <p>Right now I can't think of something to solve that, is it too bad, what do you think? Suggestions? We previously tried something with the descendant of the J; Ill post it with the pic of the campus' spot.</p>
      <p>Regards,</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/labrujula_spot_4461.jpg"></div><p></p>
