      <p>Hello!<br>
      I didn't post since a long time friends, and a lot of things happened to the header... First, terrible thing to say, is that the magazine crew didn't like it a all (we went with one of the above with slight mods), and I mean, AT ALL.</p>
      <p>We had to totally change it, this time they wanted something more "product-like", "according to current aesthetic tendencies", not so "classic" or "boring" they sayd. We'll, what can I say...</p>
      <p>We had to redo it, all the way from the drawingboard.<br>
      This time I took advantage of my partner and did it by myself.<br>
      The concepts were "variety/diversty" and "change (constant movement)", refering to the aspects which we presume identify the community.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cabezote_v0_6607.2b.jpg"></div><p></p>
      <p>We didn't had so mucho time, so this was only one first intent and one small correction. Then it went straight to the plates (30,000 on magazines already, also some posters/advertising).</p>
      <p>There have been released 3 numbers of the magazine, and we're planning to improve some things for the next year. I would like to start from the header. Then I remembered how supportive you guys were with the first one. ;)</p>
      <p>Don't go soft with critics/observations. I know we've got a lot to improve. Regards,</p>
      <p>PS: I'll be posting/linking some of the covers/pages of the magazine so you can check them out ;)<br>
      Btw, UJTL is short for "Universidad Jorge Tadeo Lozano".</p>
      <p>__________________________________________________<br>
      <a href="http://www.gabssnake.4t.com" title="www.gabssnake.4t.com">www.gabssnake.4t.com</a></p>
