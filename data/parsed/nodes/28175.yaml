      <p>I would make a caps-only* version with an "A-frame" set like you [mostly] have now plus a "V-frame" set so a user could alternate** them and get a nice tight texture out of the font in addition to the sawtooth. That could be useful. Sometimes.</p>
      <p>* It's much harder to make lc work well in confined polygons.</p>
      <p>** And I'd put one set in the lc locations and the other in the UC locations for ease of typing/composition.</p>
      <p>hhp</p>
