      <p>Oh I fully expected this font to be an uncomfortable read. It's a novelty font at best. I tried to constrain all the characters within the shape of the O, a rounded isoceles triangle, which obviously was impossible and I fudged that rule extensively. I see it as more useful for titles, signs, and logos, where it is only used for one or two words at a time. If someone wants to set a bible with it, that's great, but it's not my problem.</p>
      <p>I have made some better fonts. This is just my most recent one.</p>
