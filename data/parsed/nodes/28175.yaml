    html: <p>I got a little catalog in the mail recentlyand found that my font bears a vague passing resemblance to both <a>Tiki Wood and Trickhouse</a> by House Industries, but they tackle the problems I'm facing far differently than I have. If there is a name for this style, I guess you'd call it interlocking sawtooth. But my cap angles are inconsistent, and look better with the lc than with the alternating caps version.</p>
