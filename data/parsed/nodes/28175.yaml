    <p>I'm new to these forums, but I've been gradually designing fonts over the years as a hobby. I know I have a long way to go before even thinking of standing in some of your shadows. Anyway, here is my latest creation: Trialgulor<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Triangulor-1_4471.png"></div><p></p>
    <p>I fully expect to be ripped to shreds here. Please, tell me whether this or any of my other fonts are total crap, and what could be done to fix them.</p>
    <p>This one can be downloaded at <a href="http://www.1001fonts.com/font_details.html?font_id=3017" rel="nofollow">1001fonts.com</a>.<br>
    Others are linked from my author profile there. </p>
    <p>EDIT: It occure to me this might be more appropriate in the "experimental" category rather than "display". Please correct me if I'm wrong.</p>
