    html: |-
      <p>I dont feel qualified, or knowledgeable enough to give criticism, but dont go into this post feeling as if you will be "shot down in flames", rather look upon the information given as being helpful in furthering your knowledge so that you can apply this to future works.<br>
      The people here, with very few exceptions, will give an honest opinion and advice/methods/knowledge to improve upon your characters. </p>
      <p>Contrary to the view that some may get from the debate that can occur in some posts, it is all good... and contrary to my original statement regarding criticism I offer the following -</p>
      <p>Personally I would offer the opinion that the upwards leg of the N could be straighter.  The 'J' seems to lean a bit too far, the lc 'w' and 'x' seem to be of a different style than the rest. Also suggest you try typing a few sentences in this, and you could find that the opposing lean on characters gives for an uncomfortable read. You seem to have an idea for a optical distance lean (backwards). This would work better (like in the cap O) if rather than lean, they reduced in thickness over the height of the characters, eliminating the lean but retaining the effect.</p>
