      <p>There wasn’t an option for this…</p>
      <p>I would say that talking about points is irrelevant for web text, being an absolute measurement. I know there’s a pretty consistent cross-platform relationship between points and pixels these days but that still doesn’t take screen size/resolution into account. Using relative ‘em’ or ‘%’ measures would allow users to adjust text sizes in the browser.</p>
