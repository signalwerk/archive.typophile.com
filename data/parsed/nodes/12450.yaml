    html: |-
      <p>Thanks for your responsiveness on this! </p>
      <p>Polling of users is an excellent idea. Samples of three or four different sizes and leadings would help you get a more informed response. If the current size is 9 pt., 10 or 11 would be an improvement. </p>
      <p>Just testing with HTML e-mail, the Georgia at 10 pt with 1 1/2 line leading doesn’t look bad. 11 pt is even better in size to me, but 1 1/2 lines is too loose at this size. I don’t know how much flexibility you have in leading with HTML</p>
      <p>Again, a measure of not over 75 characters per line is definitely better. The measure and leading and contrast are probably more important than type size, but 9 point for extended text is just a strain for my old eyes. </p>
      <p>I agree with Stephen Coles that the background should be lightened to increase contrast with the type. </p>
      <p>I am looking at an LCD screen with a resolution of 96 dpi.</p>
