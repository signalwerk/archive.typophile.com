    <p>So I'm a student working on a display face inspired by traditional black-letter faces but with a more strict geometric system named vexation. My goal is to eventually have a cohesive family that includes this display face as well as more legible variations for other uses. I know I have some serious issues so I would love any feedback you'd like to give.<br>
    Thanks.<br>
    Turner.<br>
