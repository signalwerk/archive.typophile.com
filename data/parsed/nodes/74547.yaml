    <p>Hey everyone, I have this book, Christian Theology by H. Orton Wiley printed in 1940 and I was wondering what the fonts are.</p>
    <p>I think the cover is Gill Sans - but I'm not certain.</p>
    <p>On the title page there seems to be something like Memphis - but again, I'm not sure.</p>
    <p>The other serifs I just can't pick - but serifs are always what I find hardest to ID.</p>
    <p>Any help would be much appreciated.</p>
    <p>Thanks!</p>
