      <p>Simon, the sans on the INSIDE cover (image 2) is W.D. Dwiggins' Metromedium with it's Italic cut, which I believe was the inspiration behind Geometric 415 Medium.<br>
      I found this link on the web which shows a scan-to-font version of it <a href="http://www.eaglefonts.com/metro-medium-oblique-hplhs-ttf-95512.htm" title="http://www.eaglefonts.com/metro-medium-oblique-hplhs-ttf-95512.htm">http://www.eaglefonts.com/metro-medium-oblique-hplhs-ttf-95512.htm</a></p>
      <p>The text face is I think C.H. Griffith's Excelsior.</p>
