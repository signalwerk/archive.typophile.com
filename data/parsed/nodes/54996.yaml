      <p>First, I enjoyed meeting Chris. He's a great guy. During the Q&amp;A at the end of Carter's talk, someone asked a great question that I'd never thought of before: "Do you as a type designer find that what you want to put into a font differs greatly from what I, the graphic designer need from a typeface?" Carter said that, yes, the needs are sometimes very different, but necessary to take into account.</p>
      <p>Above, Chris makes the point about fame being overrated. Carter was introduced as a famous type designer, but humble, and I'd have to say that seems to be true. He's funny and self-effacing.</p>
      <p>The title of Carter's talk was "Why New Typefaces?" His premise is that there are so many typefaces out there already, why would the world need new ones? He answered that question from his point of view.</p>
      <p>He provided a bit of his background, which includes the fact that his dad worked in a type foundry, but did not push or encourage Matthew to follow in his footsteps. Carter sees himself as a technician, having carved type into metal, designed it for photolettering processes, and then digitally.</p>
      <p>Carter used his titling face Mantinia as a case study. He points out that it is a Renaissance face, not a classical Roman one like Trajan. He had been studying writings, sketches and etchings made by Andreas Mantegna and his friends as they made their way around an Italian lake. THe letters Carter saw in Mantegna's work and that of his friend Felici Feliciano inspired the typeface Mantinia (Latinized version of the name Mantegna).</p>
      <p>Carter also talked about his work for the Walker Art Center in Minneapolis. One innovative thing that came out of that was his development of Walker Sans, which has with it 3 different styles of serif that can be applied to the characters using particular keyboard commands. Personally, I thought this was really wild, and can see where such a concept could become more popular in the future.</p>
      <p>Carter talked about his work with Newsweek, which he was not originally commissioned for. A friend of his had mentioned a need for a certain kind of typeface, which fit the description of Vincent, a face Carter had started on, but was no where near finished, and had kind of been on Carter's back burner. Months later, the friend said, "By the way, Newsweek likes Vincent." Carter said, "Who's Vincent?" And the friend said, "That typeface you sent me—they love it and want to proceed with it." Carter was dumbfounded, as he described the typeface as being in a crude state. So, that turned into a set of 5 versions of Vincent for Newsweek. At this point, Carter said that he's not really into seeing his typefaces used in fine books, posters, annual reports, etc., in which the designer has the time to really craft how the type looks. He prefers to see his work used in quickly designed things like newspapers and weekly periodicals, because that shows how well he really designed the typeface.</p>
      <p>Carter briefly mentioned work he's done for Sports Illustrated and other publications.</p>
      <p>When asked about the trend of designing matched pairs of serif and sans serif typefaces, Carter said he prefers that there be as much contrast as possible between serif and sans faces used together. He said he thought Frutiger looked good with his Galliard face.</p>
      <p>When asked if there were any typefaces out there he wished he'd designed, he said there were many, and that he thinks there are more really good young type designers out there today than at any point in history, but he wouldn't name any so as not to create bias or hurt the feelings of folks he might leave out.</p>
      <p>Chris, or any others who were there, feel free to edit.</p>
      <p>-------------------------------------<br>
      <em>Inventor of the DVD rewinder</em></p>
