      <p>You're welcome, Florian. There is one thing I forgot. At one point, Matthew Carter showed a slide (yes, a real slide, not Powerpoint) of outlines of 3 versions of a lc h from one of his typefaces, overlayed on one another. This was to show the differences between the three weights, including width of strokes, width of characters and placement of the bezier points. He walked over to the screen and pointed to one area that showed the differences in point location between the three weights and said, "That right there is where I make my money." He was emphasizing the importance of detail in the craft, and that those details are what separates excellence and quality from the rest of the pack.</p>
      <p>-------------------------------------<br>
      <em>Inventor of the DVD rewinder</em></p>
