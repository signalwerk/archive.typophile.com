      <p>Thanks, Bruce!</p>
      <p>I remember suddenly realizing, after hearing Carter at TypeCon and talking with him, that he is first of all an enthusiast, a fan of great type. It made me happy to realize that the love of type unites the master, the tyro, the journeyman. I think that's what great about the type design community: you're not in it unless you love it.</p>
