  html: |-
    <p>A new typeface designed by Göran Söderström – Heroine.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blog_sept9_09_6106.jpg"></div><p></p>
    <p>The typeface is due to be released on September 15, 2009. So until then we've done a little promotional trailer for you available at:</p>
    <p><a href="http://www.youtube.com/watch?v=E7Ml2n_jfSk" title="http://www.youtube.com/watch?v=E7Ml2n_jfSk">http://www.youtube.com/watch?v=E7Ml2n_jfSk</a></p>
    <p>Inspired by the typeface Windsor, designed by Eleisha Pechey in 1905. Windsor is the typeface used in the titles of many Woody Allen movies. A modern interpretation of this rusty pearl is something that always have been missing in the major type libraries. But Heroine is not only an interpretation, it goes beyond that. With the addition of swashes and alternate letters in several styles it becomes very addicitve.</p>
    <p>More images here:<br>
    <a href="http://www.fountaintype.com/news/2009/09/heroine-movie-trailer" title="http://www.fountaintype.com/news/2009/09/heroine-movie-trailer">http://www.fountaintype.com/news/2009/09/heroine-movie-trailer</a></p>
    <p>Enjoy!</p>
