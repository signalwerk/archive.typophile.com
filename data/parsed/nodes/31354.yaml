      <p>Hey Marc,</p>
      <p>I'm sorry that I haven't been able to comment on Azoumbie. Actually, the reason I'm posting here right now is to excuse myself for a hiatus for several months. Lately, the agency has been getting a lot of projects (and meetings have also gone crazier, from several times a week to every day), so I feel that I have to focus on that for the time being.</p>
      <p>I'm really sorry that I wouldn't be able to leave a comment for Azoumbie in the next few months, but I do know that this typeface is looking better by the day, so please keep on working on it!</p>
      <p>Comments for now:<br>
      The g looks good, but it's lacking an angle on its bottom bowl (right now it's just plain square)<br>
      v and w looked excellent and more balanced. Love it. You need to do the same thing with y, but that shouldn't be too much of a problem.<br>
      Have you tried making the upper serif on l, t and i to face left (like what you did on h)? It would provide more balance to the letter, I think.<br>
      Also, the bottom-right serif on n will need to face right, so that the alphabet won't look like it's falling over :)</p>
      <p>This typeface is shaping up very nicely, and I'm looking forward to finally be able to see it to completion. Thanks a lot for your patience so far, Marc, and I'll be sure to see you soon!</p>
