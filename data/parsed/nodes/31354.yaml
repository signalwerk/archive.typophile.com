    html: |-
      <p>I like the direction you're going, but I question your decision to make the bottom of the uppercase letters slant up while the lowercase bottoms are nearly horizontal. It makes the capitals far too different from the lowercase, in my opinion. I'd choose one or the other to use for both uppercase and lowercase (I'd go with horizontal bottoms myself).</p>
      <p>It's looking good, but it needs some polishing. After a quick look, the M seems overly wide and lopsided, the meeting point of the center and bottom stroke of the W leaves a dark spot there that unbalances the letter, the top of the b's bowl should be more angled to match the other lowercase letters, the bottom of the j is too wide, the top part of the s makes too dark an area (you need more white space there), and the y and z are tilting too much to the right. There are other issues too, most to do with consistency between letters and the amount of white space you use. A common suggestion is to flip the letters horizontally so that they form a mirror image. After doing that, you can more easily evaluate any weight or other problems with the letterforms. Even with these problems, it's looking good. Keep going.</p>
    html_clean: |-
