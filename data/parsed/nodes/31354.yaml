      <p>Speaking about duality, inherent in Azoumbie's design I see a struggle between the extent to where you should keep the serif consistent (ie. all-right or all-left)), and where you should make it more natural (hand-stroke like). So I suggest you experiment with adding/cutting the serifs until you find a combination that's not only unique to each alphabet, but also work together with each other.</p>
      <p>Thanks for bearing with my often harsh critique ;-)</p>
