      <p>Marc,</p>
      <p>First of all, sorry about the long overdue reply.</p>
      <p>But wow, this typeface is really shaping up to be quite nice! Some quick remarks before I head to bed:</p>
      <ol> Love the new serif that you have at the end of <em>d</em>. Small, subtle touches like this is what's going to make your typeface unique, especially when printed large.
      <p>However, my eyes kept on wanting to see a normal arm on the <em>f</em>. I think the current slanted serif design is unique, but for some reason, it doesn't look like a normal <em>f</em> to my eye (which could be good or bad). You know, kind of what Eric Gill said about "what makes an <em>a</em> an <em>a</em>?" But this point is totally subjective to me, and you should get other designers to view the letter and see what they think.</p>
      <p>Love the new <em>i</em> and its new dot</p>
      <p>Speaking about the dot, it needs to be moved closer to <em>i</em> and <em>j</em>.</p>
      <p>Also love the new <em>k</em>, very nice touch there.</p>
      <p>You might want to eliminate the bottom-left serifs of <em>l</em> and <em>t</em> and replace it with right serifs. Right now they looks a little bit unbalanced, I think.</p>
      <p>There's also a balance issue on <em>m</em>, where the second and third downward strokes appear too thin, when compared to the first stroke (that you purposely made thick as a tool to achieve consistency). You might want to thicken the second downward stroke, so that the alphabet's progression goes more smoothly from thick (left) to thin (right).</p>
      <p><em>w</em> looks unbalanced, not only angle-wise but also visually. For instance, the second 'v' appeared to be on a slightly different angle when compared to the first 'v' shape, the crotch that's inbetween the two v's should be wider, and the two counterspace should be more optically equal.</p>
      <p>Designing <em>x</em>, like designing <em>s</em>, takes a lot of practice and patience to get them to appear 'right'. Is there any explanation behind the uneven angles on the <em>x</em>? If you want to make them uneven (which could be to a good or bad effect), you better connect them optically (ie. the strokes should look like they're connected, although, in vector, they really are a little bit off from each other).</p>
      <p>The <em>y</em>'s crotch seem too small. I understand that you want to keep all the left stroke thick, but maybe you can make <em>y</em>'s second stroke a little bit thinner to open up the counterspace.</p>
      <p>Love the <em>fi</em>, but I'm wondering if you could even take the ligature concept further (since this is meant to be a display face) and design it slightly differently, rather than jst connecting the letter <em>f</em> and <em>i</em> together.
      </p></ol>
      <p>I'm really sorry if my critique is harsh. I hope it can help your typeface for the better. I also hope that you got a buddy that can help you understand all the English. At times like these I wish I knew the French language more :)</p>
      <p>Thanks much, Marc!</p>
