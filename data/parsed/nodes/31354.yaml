      <p>Hey Marc,</p>
      <p>Right off the bat, there's something peculiar about the upper left part of the <em>f</em>. The stroke doesn't start naturally. In my opinion, you can't simply use the stem of an <em>l</em> and the arm of an <em>r</em> to make an instant <em>f</em> ;-)</p>
      <p>The <em>d</em> and <em>q</em> also look like mirrored <em>b</em> and <em>p</em> to my eye (you might have designed them differently; and if so, I apologize). As far as I know, this is not an uncommon practice in display faces (Alternate Gothic no. 2, for instance, use mirorred <em>b, d, p,</em> and <em>q</em>). But personally, I design every alphabet a little bit differently to not only account for its relative visual weight (this you must do) but also to impart subtle design touches to each one.</p>
      <p>Also, some of the strokes that you draw doesn't end naturally. For instance, the end stroke of <em>i, h, k</em> and <em>u</em> are missing the right part of the serif. See below for the "right stroke" example (this is taken from the typeface Costa). Your situation is different, but I hope you can grasp the general principle of stroke ending by seeing it in action. I understand your intention of making this face a semi-serif; so, In this case, if you do add the right serif to the stroke, the left one can be erased and you'll still have a semi.</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150124044453im_/http://typophile.com/files/ihku_3759.gif"></div><p></p>
      <p>Just shout if you have any question. Best of luck!</p>
