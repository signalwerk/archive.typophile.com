    html: |-
      <p>I suggest capitalizing the characters in the word hair. Lowercase letters and black letter fonts should never be tracked out like that. Frederick Goudy has a famous saying that anyone that would letterspace blackletter would steal sheep. For the gradients I like the tan much more than the pink. I also suggest finding another way to incorporate hair rather than the swirl on the i.</p>
      <p>Also consider removing the box. I have seen that done a lot. An alternative treatment to the word hair could be making it the same size as Anilia but just another weight of the font. Similar to the treatment of <a class="freelinking external" href="http://www.suzeorman.com/" rel="nofollow">Suze Orman's</a> logo.</p>
    html_clean: |-
