      <p>Here is how the saying originated according to the book Stop Stealing Sheep &amp; Find Out How Type Works by Erik Spiekermann and E.M. Ginger.</p>
      <p>“In 1936, Frederic Goudy was in New York to receive an award for excellence in type design. Upon accepting a certificate, he took one look at it and declared that ‘Anyone who would letterspace black letter would steal sheep.’”</p>
      <p>I can't remember where but I recall hearing somewhere that the original statement was about black letter and went on to refer to lowercase as well.</p>
