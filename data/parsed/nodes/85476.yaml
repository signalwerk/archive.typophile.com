      <p>I like the type treatment but the way the hair is implemented is a bit much. Consider doing something similar but having the hair element underline the text instead of having it becoming the i. That would make the logo more compact.</p>
      <p>The second gray may cause difficulties when printing. For example, if you got this embroidered on shirts the cost would go up for a second color thread.</p>
      <p>I like the idea of using different font weights. In addition to making Anila bold the word hair could be light and Anila could remain the weight it is. Just an idea. It is one of those things where you just have to try it out and see what works.</p>
