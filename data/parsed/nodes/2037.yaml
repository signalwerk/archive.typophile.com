    html: "<p>1) <a href=\"http://www.myfonts.com/country/fr/\" target=\"_blank\">http://www.myfonts.com/country/fr/</a> <br> <br>2) From S Carter's \"20th Century Type designers\": <br> <br>\" <br>Two of the designers of the generation after Roger Excoffon who have contributed most to French type design have been to some extent outsiders. Adrian Frutiger ... is Swiss, while the slightly older Jose Mendoza y Almeida, while born in France, is fiercely proud of his Spanish descent. <br>\" <br> <br>If you could nab Mendoza, that would rock. <br>Let me know if you need contact info (although I'd have to ask permission from a third party). <br> <br>3) Try asking here: <a href=\"http://typo.textbox.org/\" target=\"_blank\">http://typo.textbox.org/</a> <br> <br>As for Matha, type design or no, hook up with him - you won't regret it. <br> <br>hhp <br></p>"
