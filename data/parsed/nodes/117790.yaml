    <p>Hi,</p>
    <p>I'm trying to determine the font used for the subtitles in the film   "Inglourious Basterds "</p>
    <p>The auto font detect feature on a website says it is "St Transmission-600 Semi Bold font" but I disagree the lower case i is different. I've also heard it may be Ariel but I don't know, if anyone does please help.</p>
    <p>Thanks</p>
