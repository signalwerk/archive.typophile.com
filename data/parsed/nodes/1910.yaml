    html: <p>I'm thinking more and more that it's custom. I saw it on TV on some signage, and it just seemed so deliberate, like someone said, "well I don't like the e or the s, they just don't look normal." I mean, it's literally <a href="http://www.myfonts.com/fonts/linotype/frutiger/65-bold/win-ttf/187428/character/0065/CP2/"> the e from Fruitger</a>, which is not very Bauhaus.</p>
