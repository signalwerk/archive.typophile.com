  votes: null
  html: "<p>This might be some custom hack, I don't know... Most of the letters are in the round bauhaus style, but there are a few idiosyncracies: The 'e' looks light it's straight from Frutiger, the 's' is normal, and the 'C' is very closed, and more oval than round. Otherwise, most of the letters follow the bauhaus style. It's a medium-bold weight.</p>"
