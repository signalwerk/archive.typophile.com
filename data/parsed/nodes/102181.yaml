    html: <p>The new logo, <a class="freelinking external" href="http://tinyurl.com/cqmz2w7" rel="nofollow">as it appears here</a>, appears to be a fairly simple custom job based on any number of sans serif fonts, with different letters taking on characteristics of different fonts, plus some trivial modifications like trimming the bar on the /T.   - Herb</p>
