      <p>Big sample <a class="freelinking external" href="http://3.bp.blogspot.com/-0SRRScPk-lE/US3QN_2RjQI/AAAAAAAABu8/EoowJ5ZnooU/s1600/adsk6.jpg" rel="nofollow">here</a><br>
      Can't identify it and agree more with Herb. Very hard to say as there's nothing really distinctive to me part of /K diagonal strokes meeting at the vertical and may be the /S shape. Could be a lot of thing from totally made from scratch to customization from a commercial font... Some I like: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/salvo-sans" rel="nofollow">Salvo Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/processtype/locator" rel="nofollow">Locator</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/adequate" rel="nofollow">Adequate</a>, <a class="freelinking external" href="http://www.myfonts.com/search/co" rel="nofollow">Co</a> (don't ask me why but I would probably start from this one), <a class="freelinking external" href="http://www.myfonts.com/fonts/typeotones/arboria" rel="nofollow">Arboria</a>, <a class="freelinking external" href="http://www.myfonts.com/search/mr+eaves" rel="nofollow">Mr eaves</a>, <a class="freelinking external" href="http://www.myfonts.com/search/avenir" rel="nofollow">Avenir</a> (/S way off but the rest looks very close), <a class="freelinking external" href="http://www.europatype.com/articledetail/17" rel="nofollow">Europa</a></p>
