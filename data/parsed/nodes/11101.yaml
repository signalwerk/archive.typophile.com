  html: <p> I am looking for a font, that just looks like <br>greek style font "symbol", that probably everybody have on win- or mac system. <br>The thing is, that  you have greek style font, <br>but you have european letters in this font. <br>I probably seen this font, but can`t remember <br>me. :o( <br>Please help me with identification. Thanks. <br> <br>Pixelkind </p>
