      <p>This is great!  </p>
      <p>It makes me think of Leningrad Cowboys or Six-String Samurai or The Monks -- like a avant-garde punk band that came out of Eastern Europe or Communist Russia in the late Sixties.</p>
      <p>The R is my favorite and the I, S, and Z are particularly nifty. </p>
      <p>I want to see the numbers!</p>
      <p>When/where can we download this font once it's done?</p>
      <p>-matt</p>
      <p>P.S. And don't worry about this looking useless -- even if it was <em>just</em> catering to a fad, which it isn't, the fat font fad comes back around every few years. :)</p>
