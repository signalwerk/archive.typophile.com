  html: |-
    <p>Hi there,</p>
    <p>I am recently creating a font for a band. Their name is "the drei - gottes vorband" which means "the three - god's support act". Don't be distracted by the name, it's nothing religious.<br>
    The band's concept is having fun with funny lyrics and being a wannabe rock musician without really knowing how to play their instruments.</p>
    <p>This is why I made it look rough and not precisely elaborated. Which kind of music would you associate it with? I'm doubting a little, that it fits with rock music.</p>
    <p>What do you think so far?</p>
    <p>Thanks,<br>
    Dirk</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TheDrei-Schrift_3542.jpg"></div><p></p>
