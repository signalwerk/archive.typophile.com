      <p>I wasn't referring to the misspelling. Numerous incidents around the country involving fraternities and drinking have resulted in hospitalization, death, jail time, expulsion, and the shutting down of fraternities.</p>
      <p>I hope your fraternity does nothing foolish in that regard. But if something should happen, you have already suggested (if not gone on record) that Delta Tau Delta is committed to drinking, thus increasing your liability.</p>
      <p>I have nothing against responsible drinking, but linking your fraternity (even by a T-shirt) to drinking doesn't seem like a good idea to me. Also, copying a company's brand identity is neither original nor creative.</p>
