  html: |-
    <p>Greater Albion has just launched two new releases on <a class="freelinking external" href="http://new.myfonts.com/foundry/Greater_Albion_Typefounders/ " rel="nofollow"> Myfonts.com</a>.</p>
    <p>Crucis ornaments is the first in a series of traditionally inspired (but newly designed) sets of printers ornaments.  Deva is a modern interpretation of classic Roman text and Display faces, with a range of opentype features such as ligatures and stylistic alternates. You can read more about them on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a> or try them out for yourselves on Myfonts.com.</p>
    <p>Deva has been launched at a 30% introductory discount.</p>
