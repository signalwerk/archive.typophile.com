    <p>Here's the latest sans I've been working on. It's a slightly-condensed, squarish, DIN-ish sans (yeah, I know -- like we need another one of THOSE). </p>
    <p>Some concerns I have are about width (D, J, M, S, W, m), and the balance of upper and lower parts (g, S)</p>
    <p>As usual, any feedback is greatly appreciated.</p>
    <p>Thanks!</p>
    <p>Jonathan</p>
