      <p>Hi onathanhughes,</p>
      <p>Monologue has started quite well and it will evolve quite nicely eventually.<br>
      The relative widths of the capitals and the lower case letterforms could be similar to those of Eurostile Next Condensed. Or even better. go to the following link and look at typefaces in the same species as ‘Monologue’, actually Monologue looks more than the typefaces on the following link than DINish….</p>
      <p>EUROSTILISH</p>
      <p><a href="http://www.identifont.com/list?3+Eurostile%20Condensed+1+IE8+7+N8N+7+J3V+4+MJY+4+MJW+4+BQW+4+BQX+4+5PK+4+E0Z+4+R4+4+D7Q+4+HN1+4+HN2+4+HN3+4+HOI+4+HOB+4+IE7+4+CGK+4+F0H+4+KLI+4+6BT+4+BU2+4+MYY+4+EDV+3+VM+3+MQZ+3+HTI+3+9O7+3+9NV+3" title="http://www.identifont.com/list?3+Eurostile%20Condensed+1+IE8+7+N8N+7+J3V+4+MJY+4+MJW+4+BQW+4+BQX+4+5PK+4+E0Z+4+R4+4+D7Q+4+HN1+4+HN2+4+HN3+4+HOI+4+HOB+4+IE7+4+CGK+4+F0H+4+KLI+4+6BT+4+BU2+4+MYY+4+EDV+3+VM+3+MQZ+3+HTI+3+9O7+3+9NV+3">http://www.identifont.com/list?3+Eurostile%20Condensed+1+IE8+7+N8N+7+J3V...</a></p>
      <p>You will find there 29 typefaces with relatively similar attributes. </p>
      <p>DINish</p>
      <p><a href="http://www.identifont.com/find?similar=DIN&amp;q=Go" title="http://www.identifont.com/find?similar=DIN&amp;q=Go">http://www.identifont.com/find?similar=DIN&amp;q=Go</a></p>
      <p>You will find there 29 typefaces with relatively similar DINish attributes. </p>
      <p>The construction of lower case ‘s’ is better than that of capital ‘S’. </p>
      <p>‘Some concerns I have are about width (D, J, M, S, W, m), and the balance of upper and lower parts (g, S).’</p>
      <p>D: looks relatively OK.<br>
      J: It could either drop below the baseline for better spacing or it could have the lower part of ‘C’ reflected but shoter.<br>
      M: A little wider and with ink traps added.<br>
      S: C, G, S, a, c, J, j and y they would better have similar ‘beaks’ – ‘stroke endings’. Either like those of ’C’ or ‘G’, or even just straight horizontal.<br>
      W: Make it a little wider and add ink traps.<br>
      m: In relation to ‘n’ it looks relatively OK.<br>
      S: The diagonal stroke should move a little downwards and very slightly the diagonal of ‘s’.<br>
      g: Its ear on the x-height should be a little longer.<br>
      j, y: the end-stroke below the baseline could become a little horizintalized.</p>
      <p>The metrics need fine tuning.</p>
      <p>I hope all the above will be of some use.</p>
      <p>By the way I just posted some more things to Critique/San Serif/ Doric, you are welcome to tell me what you think about it.</p>
      <p>Cheers<br>
      Boris</p>
