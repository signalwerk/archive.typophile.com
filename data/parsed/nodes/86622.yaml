  html: |-
    <p>I am putting together a product catalogue for furniture. Catalogue will have large photos (mainly set on dark background) and some areas with copy. Look &amp; feel: contemporary/minimalistic. I want to use all serif for header, sub and body.</p>
    <p>I am set for the body with Fedra Sans Alt Book. What would work well for headers and subs?</p>
    <p>I was looking at poosibly using Irma Thin for header and Jigsaw Light for subs.</p>
    <p>Thanks for any help.</p>
