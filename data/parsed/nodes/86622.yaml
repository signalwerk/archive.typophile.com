    html: |-
      <p>Why not consider Fedra Serif then? It would look completely unified since you would use fonts from the Fedra typeface together.</p>
      <p>Jigsaw Light might be too similar to Fedra Sans to serve as a good contrast for the sub-body text relationship. Irma Thin is slightly different, but still a sans and would work only if your headers are big enough to contrast from your body text. Both of these are sans-serif, though — did you have any serif choices you were looking at already?</p>
