      <p>"At the very least, isn't this a step in the right direction?"</p>
      <p>Only if one assumes that only one direction is correct.</p>
      <p>The "gloss &amp; beveled art style" isn't just about 'looking cool' but has deep foundations in human factor/UX design. For instance, when a button is beveled and has a shadow one sees that as being 3 dimensional which offers an affordance to the user that it is a clickable object. This can be an important factor for general usability of the device.</p>
      <p>But that's not to say it's the only correct direction. The flat type-centric UI of Win7 mobile may work nicely as well. We'll have to wait and see.</p>
