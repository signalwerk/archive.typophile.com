      <p><em>Do you think there is a point w[h]ere digital is so understood, or accepted, or a part of ones life that it doesn't need to mimic to offer understandable(predictable) usability, but starts developing it's own traits and patterns?</em></p>
      <p>In terms of appearance, rather than behaviour, digital has ABSOLUTELY NO original visual qualities, so that point will never occur. Bytes are like that.</p>
      <p>The "swipe" action (formerly known as "scrolling" isn't uniquely digital: before the invention of the codex (book), documents were in scroll format. In movies, what are pan and zoom if not truncations exposed? In the 19th century, before even the invention of photography, there were scrolling panoramas: <a href="http://en.wikipedia.org/wiki/Moving_panorama" title="http://en.wikipedia.org/wiki/Moving_panorama">http://en.wikipedia.org/wiki/Moving_panorama</a></p>
      <p>In music, it is possible to digitally engineer sounds that no analog instrument could produce, but that is not the case with static visual images.</p>
      <p>I once claimed that my Beaufort face, with its asymptotic pointed serifs, demonstrated a unique digital quality of super-sharpness, but was straightened out by Kent Lew, who argued that resolution is a function of output device, and that metal type was far sharper than digital-to-offset.</p>
      <p>**</p>
