      <p>I don't think minimalism is somehow more "flawlessly" typographic than layout styles which use devices such as boxes, rules, and drop shadows. </p>
      <p>When you run text over a disruptive background (e.g. a "screensaver" pattern), then a drop shadow is also typographic: the offset, blur, and density have to be gauged to the type style, colour, and background, for optimum readability. Setting these values is a matter of typographic taste and discrimination, is it not?</p>
      <p>The page on the Phone 7 that shows type "surprinting" a photo could do with some drop shadows.</p>
      <p>If you have a lot of hierarchical text categories in a layout, boxes and rules are a good way to demarcate information.<br>
      By the same token, going the minimalist route does require "white" space.</p>
      <p>And in the Phone 7 GUI, that space seems to be latent, scrollably-accessible, in a way that I always associate with early Flash-enabled web pages.</p>
      <p>So the question is: how problematic is latent space?<br>
      Have we become used to seeing the picture cropped, and scrolling across it -- especially in map apps -- to the extent that a <em>word</em> which appears cropped and illegible when a page opens, is acceptable? Especially if it is the title of a frequently-visited page. Is becoming familiar with this partial word any different than becoming familiar with an icon -- learning its meaning? If you are going to a page via a link, don't you already know its title?</p>
      <p>It's a premise of Donald Norman, the philosopher behind the Mac GUI, that one learns by doing, that an interactive medium is not just information that sits there revealing all without being prodded.</p>
      <p>So good luck to those trying to out-Mac the iPhone with a minimalist GUI.</p>
      <p>And to those who would judge it by looking at static photos, that's a bit premature, the proof of the pudding is in the eating.</p>
      <p>**</p>
      <p>Si, CS4 replaced eye-candy (mostly) by text:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Adobe_CS4_mini_icon_set_by_Bobbyperux_3520.jpg"></div><p></p>
      <p><a href="http://www.shinntype.com/Writing/DeeperIn.pdf" rel="nofollow">My take</a> on GUI evolution (on the Mac).</p>
