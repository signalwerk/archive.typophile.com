      <p></p><div class="imageWrap"><img src="http://typophile.com/files/system_1_screenshot_5170.jpg"></div><p></p>
      <p>Perhaps current designers don't give it as much thought but just a decade ago, 3D buttons &amp; windows were really cool. Pushing a button in and out of the screen is useful. But there was a wow factor attached to simulated 3D interfaces. Mid 1980's operating systems and devices weren't 3D because they couldn't be. On a Macintosh, there was no gray scale but 3D was indicated with a heavier lines on the bottom and right. There were hacks to make the Amiga Workbench interface look more 3D but it looked pretty lame because the desktop palette was limited.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Amiga_Workbench_1_3_large_6047.png"></div><p></p>
      <p>I ran a hack on my Amiga that would create drop shadows for desktop windows but the drawing was painfully slow. I'm not sure when the Mac went 3D, but Windows 3.1 showed a little gloss. Buttons and windows had a little light and shade. Even though the colors were ugly, back then it looked pretty slick. Functionally, that was as 3D as an interface needs to get. You could tell what's clickable and how windows are overlapping. After Windows XP, the desktop was no longer restricted to the limited Windows default palette. Buttons had (ugly) shading, words had drop shadows and it made older operating systems look flat. Around the same time, the same thing was happening on the Mac with the transition from OS9 to OSX. Drop shadows, realistic textures, all designed to look 3D. While in XP, the effect was so poorly done that it looked unrealistic, in OSX, it looked very realistic. If you've never seen a computer before, you might think windows were suspended above the surface and buttons were shiny glass beads.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rhapsody_3759.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/win2000advserv_6155.png"></div><p></p>
      <p>If you were to design a semi-flat interface like 0S9 in 2005, it would look old fashioned. The man of 2005 might think the interface wasn't flat on purpose . . . just incapable/cheap. A phone interface with a color screen in 2005 with flat buttons looked lower tech than a phone interface with shiny buttons. If you had millions of colors with work with, you could even make those buttons look like shiny plastic.</p>
      <p>That's the state we're still in. If it's not glossy, it's low tech. The glossy interface used on the iPhone is trompe l'œil. Look at the start screen in iOS4. There's a glass shelf on the bottom with shiny plastic buttons suspended on it. The background has raindrops which look 3D. Whether we believe it's really 3D or not is not the point. It's an attempt to fool the eye into thinking that a flat "painting" is three dimensional. The only reason they don't have stuff hanging into the "picture frame" like some of the more clever trompe l'œil, is because they can't yet. If they could make the metal shelf in iOS4 pop right out of the screen, they probably would.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/iphone_40_home_screen_4114.PNG"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fussli_5356.jpg"></div><p></p>
