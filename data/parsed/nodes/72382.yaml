      <p>In identifying the fact that practically no one (on Typophile or elsewhere) is calling out what they consider bad typography on devices, I think Joe is onto something. Stewf’s iPad review and a few of Joe’s blogs posts being the notable exceptions. </p>
      <p>I’ve pointed the team to this thread. To their credit I think they’re trying to do something that no one has ever tried before in the smartphone space - building a device UI that relies primarily on typography - without relying on bevels, boxes, fake 3D, Photoshop lens-flares and brushed metal bitmaps used in other devices. Also worth remembering that this is a beta of a v.1 product. </p>
      <p>A bigger question is where are the apps, games and devices that showcase flawless typography. Is anyone making them? I don’t own an iPad, Kindle, Sony Reader, iPhone, Android phone, etc., actually I don’t own any devices (with the exception of a $20 Nokia phone that has one app – the “phone call” app). But I for one would be first in line for a typographically savvy device.</p>
