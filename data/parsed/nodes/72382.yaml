    <p>Wanted to share this with all:</p>
    <p><a href="http://gizmodo.com/5590572/windows-phone-7-gallery//gallery/12" title="http://gizmodo.com/5590572/windows-phone-7-gallery//gallery/12">http://gizmodo.com/5590572/windows-phone-7-gallery//gallery/12</a></p>
    <p>Shots of the new Windows Phone 7 in action—with its UI up and running. It appears that the type and copy will be the UI's principle element. I do not know the typeface but it's crisp and warm. ( EDIT: Type appears to be Segoe UI <a>here.</a></p>
    <p>Gizmodo's thoughts on the interface:</p>
    <p><cite> "The Interface<br>
    The phrase "authentically digital" makes me want to barf rainbow pixels, but Microsoft's description of the Windows Phone 7 interface is truth: It doesn't try to feel like anything but a flat, digital interface. There is no attempt to depict three dimensionality or any kind of real-world mimesis. No gradients, shadows, gloss or shading. Everything is crisp and flat. Everything pops, bright primary colors and white text on a black landscape. Touch a tile on the main screen, and the interface flies away like exploding puzzle pieces, revealing the app you wanted to see. Oversized text is the order of the day. (Yes, it still runs off the screen in lots of place.) It feels gloriously modern. I love it. I wonder how gracefully it'll age." <cite></cite></cite></p>
    <p>I'd have to agree. A complete breath of fresh air in the age of Web 2.0 iconography.</p>
