      <p>as a cartoonist I looked for these for a long time, for doing sketches while on the go, where a brush and ink weren't practical. The best I've found is the Pentel pocket brush pen, a japanese version you can get online. It's refillable with a black cartridge:<br>
      <a class="freelinking external" href="http://www.pentel.com/store/pentel-pocket-brush-pen" rel="nofollow">http://www.pentel.com/store/pentel-pocket-brush-pen</a><br>
