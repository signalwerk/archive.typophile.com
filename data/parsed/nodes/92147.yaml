    <p>I bought a pack of Prismacolor markers awhile back, the standard set you can get at any office supply store, with a couple different tip widths, a calligraphy marker, and a brush pen.  First time I have ever used a brush pen. Kinda falling in love with it.  However, it is much much too small.  I'd like to find one that could spread to about an inch diameter or so.  The current one I have might go up to an 1/8th of an inch or so.</p>
    <p>Any suggestions?</p>
