    html: |-
      <p>Yes, a felt tip marker.  This does look pretty close.  Id be using it to--what else--create brush script fonts. The only other thing that would be nice is if it was refillable with an ink cartridge, like these:</p>
      <p><a href="http://www.dickblick.com/products/pilot-parallel-pens/" title="http://www.dickblick.com/products/pilot-parallel-pens/">http://www.dickblick.com/products/pilot-parallel-pens/</a></p>
      <p>(though these are NOT brush pens)</p>
      <p>Bert, no not really looking for calligraphic style markers.  If you have never seen a brush pen their tips look and behave pretty much exactly like a pointed tip brush would, though they are made of one piece of material, not a bunch of fibers glued together.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PentelBrushPen_5435.jpg"></div><p></p>
      <p>Its kind of hard to tell from the picture but the tip is not as hard as a regular marker, it is very flexible, and the width of the stroke is not changed by rotating the pen in your hand to a certain angle, as with a calligraphy pen, but by how hard you apply downward pressure.  They are really quite fun to mess around with.  You can go very lightly and have an extremely fine, whispy line, or you can press down hard and get a very thick line.</p>
