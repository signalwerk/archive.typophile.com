    html: <p>I haven't really used classes for spacing and kerning yet, but making classes for OT features in FontLab is pretty easy. I just try to make several classes that capture similar glyphs, make one for lc letters a-z+lc accented lowercase, one for caps A-Z + accented caps, one for smallcaps + accented smallcaps, one for oldstyle figures 0-9, one for lining figures 0-9, one for tabular figures 0-9, etc. Then when you're building features it's pretty easy to build a smcp feature that replaces the lowercase set with the smcp set and the lining figures with oldstyle figures, etc. <br>Anyhow I hope that was somewhat helpful at least.</p>
