    html: <p> Randy, <br> <br>I just posted the other day the OpenType feature file for the next release of Minion Pro. Although glyph names can't be relied on to be correct (with our FDK we use "working" names that may differ from the final names in the generated font), they should be clear as to what they refer to. I think this would be a fine reference for some common class structures and how features are built--indeed, that's why I posted it. <br> <br> <br> <br>I hope you find this helpful. <br> <br>Thomas W. Phinney Program Manager Fonts &amp; Core Technologies Adobe Systems <br> <br>"Everything that can be invented has been invented." - Charles H. Duell, Commissioner, U.S. Office of Patents, 1899 </p>
