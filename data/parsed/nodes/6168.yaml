  html: <p>Just curious if there is a file of common FontLab classes anywhere online or in their support stuff. If not, I thought it would be handy if someone could post a basic starting place for kerning and OT features. I suppose after doing a few fonts that utilize classes you will have a class file you draw from regularly. <br> <br>Thanks, <br>Randy</p>
