    <p>Hey everyone,<br>
    Do you think there are too many similarities in typefaces and style used for most infographics designed today? Has anyone encountered an infographic that uses a serif typeface? Maybe serif typefaces are too decorative for infographic designs? </p>
    <p>What is the typeface Good.is uses? <a href="http://www.good.is/infographics" title="http://www.good.is/infographics">http://www.good.is/infographics</a></p>
