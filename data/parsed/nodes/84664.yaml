    html: |-
      <p>&gt; infographic that uses a serif typeface…</p>
      <p>A seperate treatment of the alphabetical and pictorial parts of info graphics seems still to be the average way of doing it.<br>
      I think a more fancy approach to info graphics is a field yet to be explored. As well as a more related design of both ingredients. There are quite interesting designs of the prominent olympic sports pictographs.  </p>
      <p>I provide this <a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/andron-corpus-publix/" rel="nofollow">Andron symbol package</a> via MyFonts and it sells modestly well. Haven’t seen it yet out in the wild though.</p>
      <p>– Sorry for yet another self ad.  ;-)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Stimmen_publ_t_5251.jpg"></div><p></p>
