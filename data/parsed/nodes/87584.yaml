    <p>hello everybody,<br>
    It's my first time posting here.</p>
    <p>My name is Redone</p>
    <p>Starting from 5 February for the academic year 2011/12 I would like to apply for a three-month internship.</p>
    <p>I&nbsp;am currently pursuing&nbsp;my&nbsp;master's&nbsp;degree at the&nbsp;École Estienne, Paris&nbsp;France.&nbsp;My second semester is going to be the study abroad semester.<br>
    I have graduated&nbsp;with&nbsp;a&nbsp;Bachelor’s&nbsp;degree of Arts&nbsp;from the National Institute of Fine Arts in Tetuan, Morocco.&nbsp;  </p>
    <p>I am always&nbsp;inspired by different cultures and backgrounds. I’m a native Arabic speaker that is to say, I have a firm knowledge of Arabic typography design and I'm also open to Latin typography because I live and study in France.</p>
    <p>So if anybody has some good ideas on how I could get such an internship or if anybody is looking for somebody to do an internship, please let me know... </p>
    <p>thanx,<br>
    Redone</p>
