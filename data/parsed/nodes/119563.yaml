    html: |-
      <p>I spent a little time researching this via trademark registration. Here is the earliest version of the logo I could find—it was in use from 1948 to 1996:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dporthault_1948_1996_5710.gif"></div><p></p>
      <p>Here's the mark from its 1984 Canada trademark registration:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DPorthaultCanada_1984_4542.gif"></div><p></p>
      <p>Here's how the mark looked on the company's website in 2003 (via archive.org):</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/dportaultApr2003_5818.png"></div><p></p>
      <p>And again in 2004:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DPortaultJul2004_3893.png"></div><p></p>
      <p>The company was sold in 2005, and I could get none of the archive.org links to work for 2005, 2006, or 2007. February 2008 is the first instance I could find of the logo in it's current form:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dporthaultFeb2008_5138.png"></div><p></p>
      <p>Based on this progression, I think it's pretty clear that the logo has been redrawn and refined from earlier versions (the most noticeable difference over the last decade being the removal of the horizontal foot on the P and the redrawing of the crest). I suspect the original was based on Daniel Porthault's own signature (or one drawn by his wife Madelaine, who was the creative force behind the company).</p>
    html_clean: |-
