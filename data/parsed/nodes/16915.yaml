      <p>Real Simple’s logo (I prefer to use “masthead” to refer to the list of staff and contributors on the inside of the magazine) is *not* Interstate. It looks to be based on older gothics like Engravers Gothic. ITC Blair is a contemporary reworking of that style.</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/engravers-gothic/" title="http://www.myfonts.com/fonts/bitstream/engravers-gothic/">http://www.myfonts.com/fonts/bitstream/engravers-gothic/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/blair-itc/" title="http://www.myfonts.com/fonts/linotype/blair-itc/">http://www.myfonts.com/fonts/linotype/blair-itc/</a></p>
      <p>And for the completists out there, the other typeface Real Simple uses is Meta, including the Hairline, Thin, and Extra Light weights, which were commissioned especially for the publication.</p>
