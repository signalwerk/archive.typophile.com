      <p>That thread wasn't a multiple-choice "what (personality/font) type are<br>
      you" game.<br>
      It was more about physical appearance than personality.</p>
      <p>Humour, certainly, but not mockery. It was an invitation by David<br>
      Goldstein to banter about which fonts one might find sexually attractive,<br>
      if one caricatured oneself as a typeface.</p>
      <p>I suggested that I was the auto-erotic Thesis, a typeface with both serif<br>
      and sans serif varieties--riffing on the previous poster's mention of Gill<br>
      Sans' attraction to Perpetua, which is to all intents and purposes "Gill<br>
      Serif", both designed by the sexually notorious Eric Gill.</p>
      <p>When Andy Clymer said, "I'm Akzidenz Grotesk, only more optimistic," well,<br>
      that wasn't about anything other than the horrific name of that particular<br>
      typeface.</p>
      <p>So I don't think that thread addressed the issue of whether personality<br>
      type/typeface correspondence is stupid or not. There are no doubt other<br>
      Typophile threads which do, but searching Typophile archives is difficult.</p>
      <p>_Nick</p>
