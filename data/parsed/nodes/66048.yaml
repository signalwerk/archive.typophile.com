      <p>The best place to read about my Alphabet Reform work is my essay "Improving the Tool", in Gunnar Swanson's "Graphic Design &amp; Reading" (2000). There's a quarter-length version in Spanish and English in issue #54 of Tipografica magazine:<br>
      <a href="http://www.tipografica.com/54/?id=4" title="http://www.tipografica.com/54/?id=4">http://www.tipografica.com/54/?id=4</a></p>
      <p>There is however a big caveat: Although the motivation and fundamental logic remain from that early effort, I have since realized something crucial that largely invalidates those results: letterform skeletons hold us away from optimal text face design; we must instead work "liminally" - designing the border between black and white.</p>
      <p>Hanging: I'm too full of myself for that.</p>
      <p>hhp</p>
