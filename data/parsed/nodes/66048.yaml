    html: |-
      <p>Sorry for the late answer, It was late and I had get up early this morning... </p>
      <p>Hey! It was awsome to read about you in that magazine! I used to buy it... I repeat: it is a very interesting and herculean work you've got there. I once read a book called "Diseño.com" by Nestor Sexe, I remember he mentioned the mutability and immutability of a sign. This is, as you said in the magazine's article, the letterforms do change but we will never notice maybe. The mutation of a form or the signification of a sign is a change that comes along with sociological changes (such as sumerian or egyptian script) or technological changes (such as the invention of the printing by Gutenberg).</p>
      <p>I think it's great that you lead and improve this changes to legibility and easy writing. I did an investigation on the characteristics of the typefaces and the aesthetics movements of the time they were created. It was very interesting to see how the form of the writing keeps changing according to the culture, art, technologies, and even religion.</p>
      <p>I would love to keep talking and learning about this, but I think we went off the topic of this thread...</p>
