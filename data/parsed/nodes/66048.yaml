      <p>Here is the transcript of my email conversation with John Allemang.</p>
      <p>&gt;&gt; Hi Nick,<br>
      &gt;&gt;<br>
      &gt;&gt; I'm writing a short article for Saturday's paper on the link between<br>
      &gt;&gt; typefaces and personality types -- based on Pentagram's What Type Are<br>
      &gt;&gt; You?<br>
      &gt;&gt; quiz. Would you have a few minutes to share your thoughts on how fonts<br>
      &gt;&gt; link up with personality?<br>
      &gt;&gt;<br>
      &gt;&gt; All the best,<br>
      &gt;&gt;<br>
      &gt;&gt; John Allemang</p>
      <p>&gt; Hi John,<br>
      &gt;<br>
      &gt; Pentagram has picked up on the "social research app" meme and larded it<br>
      &gt; with video and edutainment to create a viral promotion.<br>
      &gt;<br>
      &gt; There was a "What font are you" quiz on Facebook early last year which may<br>
      &gt; have given Pentagram the idea:<br>
      &gt; <a href="http://www.quibblo.com/quiz/87AyPEY/What-Font-Are-You" title="http://www.quibblo.com/quiz/87AyPEY/What-Font-Are-You">http://www.quibblo.com/quiz/87AyPEY/What-Font-Are-You</a><br>
      &gt; Or this:<br>
      &gt; <a href="http://www.buzzfeed.com/scott/what-font-are-you" title="http://www.buzzfeed.com/scott/what-font-are-you">http://www.buzzfeed.com/scott/what-font-are-you</a><br>
      &gt; Ot this:<br>
      &gt; <a href="http://www.pbs.org/independentlens/helvetica/quiz.html" title="http://www.pbs.org/independentlens/helvetica/quiz.html">http://www.pbs.org/independentlens/helvetica/quiz.html</a><br>
      &gt; Or this:<br>
      &gt; <a href="http://dev.typophile.com/node/5443" title="http://dev.typophile.com/node/5443">http://dev.typophile.com/node/5443</a><br>
      &gt; Or this:<br>
      &gt; <a href="http://blog.extensis.com/typecaster/" title="http://blog.extensis.com/typecaster/">http://blog.extensis.com/typecaster/</a><br>
      &gt; &amp;c. &amp;c.<br>
      &gt;<br>
      &gt; Trite amusement.<br>
      &gt;<br>
      &gt; **<br>
      &gt;<br>
      &gt; I don't believe in government by opinion poll.<br>
      &gt; I don't believe in product development by market research.<br>
      &gt; I don't believe in examination by multiple choice.<br>
      &gt; I don't believe in categorizing people, therefore I don't believe in<br>
      &gt; personality types. Only behaviour.<br>
      &gt; I believe in creating typefaces that resist categorization.<br>
      &gt;<br>
      &gt; A font is a tool that may be used to create many effects. The blackletter<br>
      &gt; style, for instance, is good for ecclesiastical work, alternatively hip<br>
      &gt; hop and heavy metal tattoos.<br>
      &gt; Fonts are like actors. Some can play many different parts, others always<br>
      &gt; play themselves.<br>
      &gt; Fonts are like musical instruments. Some, like the french horn, have<br>
      &gt; little range. Others, like the piano, huge.<br>
      &gt; Fonts are only superficially like anything else.<br>
      &gt;<br>
      &gt; If graphology is a pseudoscience, how much less meaningful that makes the<br>
      &gt; correspondence between typeface and personality type.<br>
      &gt;<br>
      &gt; Best Regards,<br>
      &gt;<br>
      &gt; Nick Shinn</p>
      <p>&gt; I'm assuming the responses in the typophile link below are all deeply<br>
      &gt; tongue in cheek -- you're playing this game, however cleverly, just to<br>
      &gt; mock the stupidity of it?</p>
      <p>- John</p>
      <p>That thread wasn't a multiple-choice "what (personality/font) type are<br>
      you" game.<br>
      It was more about physical appearance than personality.</p>
      <p>Humour, certainly, but not mockery. It was an invitation by David<br>
      Goldstein to banter about which fonts one might find sexually attractive,<br>
      if one caricatured oneself as a typeface.</p>
      <p>I suggested that I was the auto-erotic Thesis, a typeface with both serif<br>
      and sans serif varieties--riffing on the previous poster's mention of Gill<br>
      Sans' attraction to Perpetua, which is to all intents and purposes "Gill<br>
      Serif", both designed by the sexually notorious Eric Gill.</p>
      <p>When Andy Clymer said, "I'm Akzidenz Grotesk, only more optimistic," well,<br>
      that wasn't about anything other than the horrific name of that particular<br>
      typeface.</p>
      <p>So I don't think that thread addressed the issue of whether personality<br>
      type/typeface correspondence is stupid or not. There are no doubt other<br>
      Typophile threads which do, but searching Typophile archives is difficult.</p>
      <p>_Nick</p>
      <p>***</p>
      <p>I would imagine that Mr Allemang's article was also edited, and that a third party wrote the headline and deck.</p>
      <p>Although I think this stuff is trivial and the topic worthy of more than "a few minutes to share your thoughts", I feel obliged to participate from a business perspective, to keep myself in the public eye and on the usual suspects list when it comes to type design commissions. So I am slightly peeved that after spending quite a few minutes corresponding with Mr Allemang, I was mentioned as a "designer", not a type designer, and that the word "designing" was removed from my statement "I believe in designing typefaces that defy categorization", without, even, the substitution of an ellipsis.</p>
