    votes: null
    html: |-
      <p>I picked up the news via Berkson and Phinney on Facebook.<br>
      I spent a lot of time emailing with Bill. Chewing the fat about this and that. (For some reason, I remember a  bad joke - Bill mentioned running into Graham Nash on the plane to Hawaii and that, coincidentally, Nash had a house near Bill's on Kauai. I emailed Bill back asking if he knew whether it was a very, very fine house.)  It's ok to start singing.... go with it.</p>
      <p>To re-state what Thomas said on Facebook - I knew him, I liked him.</p>
      <p>He was a mentor and teacher to me in the field of fonts, typography, and readability. I owed him one.</p>
      <p>There's a song that was written by a guy named Nick Gravenites called Buried Alive In The Blues.<br>
      Janis Joplin was scheduled to record the vocals for it the day AFTER she overdosed. (They included the song on the record "Pearl" as an instrumental.)</p>
      <p>Bill was in super physical condition and had just announced a new "readability" related project that he had gotten involved with on his blog.</p>
      <p>The unexpectedness of it.....</p>
