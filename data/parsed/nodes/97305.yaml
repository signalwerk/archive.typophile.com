  - id: 526843
    user: 1262
    date: 2012-10-18T12:10:00
    date_raw: 18 Oct 2012 — 12:10pm
    votes: null
    html: "<p>This news was a sad way to start the day. Bill and I didn't always agree, but I admired his metaphorical mind: his ability to make sense of one thing through the prism of another, e.g. how his experience tracking animals informed his thoughts on reading. His <a href=\"http://www.billhillsite.com/osprey.doc\" rel=\"nofollow\"><em>Osprey</em> paper [MS Word Doc link]</a> is now in parts an historical document, as one would expect from something last updated in 1999, but I re-read some of it today and still found it interesting an insightful. I can't think of a more fitting tribute to Bill than to encourage everyone to spend some time today lost in 'ludic reading'.</p>"
    html_clean: "<p>This news was a sad way to start the day. Bill and I didn't always agree, but I admired his metaphorical mind: his ability to make sense of one thing through the prism of another, e.g. how his experience tracking animals informed his thoughts on reading. His <a href=\"http://www.billhillsite.com/osprey.doc\" rel=\"nofollow\" class=\"link-external\"><em>Osprey</em> paper [MS Word Doc link]</a> is now in parts an historical document, as one would expect from something last updated in 1999, but I re-read some of it today and still found it interesting an insightful. I can't think of a more fitting tribute to Bill than to encourage everyone to spend some time today lost in 'ludic reading'.</p>"
  - id: 526867
