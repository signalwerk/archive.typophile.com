    html: <p>ISO 8859-1 (Latin 1), ISO 8859-15 (Latin 0, revised from Latin 1 to include the Euro sign and Ydierisis), MacRoman, and Windows Latin all contain support for most western European languages to varying degrees. Your default encoding is likely one of these. English, Spanish, French, Italian, German, Swedish, Norwegian, Dutch, Danish, and Icelandic are generally covered in these encodings, though I think there are a few special accents and digraphs (notably the Dutch IJ and ij digraphs) that are missing for full and complete coverage of these languages.</p>
