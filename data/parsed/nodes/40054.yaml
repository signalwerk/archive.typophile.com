    html: <p>The 'Default' encoding is a Latin 1 implementation, which means it intentionally supports majority Western and Scandinavian European languages (incl. Icelandic) written in the Latin script. In this case, the definition of Western is political rather than geographic and dates from the Cold War period, i.e. Austrian is Western, but Czech is not. Minority languages are not well supported by the set, e.g. it lacks diacritics for Welsh, Saami, etc.</p>
