      <p>I suspect that VIDALIA ONION FACTORY is lettering rather than a single font. Fonts with elements found in the lettering include Blippo <a href="http://www.myfonts.com/search/blippo/fonts/" title="http://www.myfonts.com/search/blippo/fonts/">http://www.myfonts.com/search/blippo/fonts/</a> and Pump <a href="http://www.myfonts.com/search/pump/fonts/" title="http://www.myfonts.com/search/pump/fonts/">http://www.myfonts.com/search/pump/fonts/</a><br>
      Similarly for VIDALIA, GEORGIA you might tinker with Thats All Folks Bold <a href="http://www.myfonts.com/fonts/comicraft/thats-all-folks/" title="http://www.myfonts.com/fonts/comicraft/thats-all-folks/">http://www.myfonts.com/fonts/comicraft/thats-all-folks/</a><br>
      Don</p>
