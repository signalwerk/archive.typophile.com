    html: |-
      <p>MP3 is designed to have an arbitrary number of tags "tacked on" to the end. Font files are usually a bit more complicated -- see <a href="http://www.microsoft.com/typography/otspec/name.htm" title="http://www.microsoft.com/typography/otspec/name.htm">http://www.microsoft.com/typography/otspec/name.htm</a> for where foundry information and such is stored.</p>
      <p>The name table itself, and also the entire font file, are checksum-protected against modification. So you would need a full OTF (TTF) editor just to change the info; and modifying font files is usually against the EULA.</p>
      <p><cite>If I drag say a House Industries font over and the Foundry is listed as House Industries OR it is listed as nothing at all..</cite></p>
      <p>It depends on what House Industries entered into the field "Manufacturer Name" (for example -- there are a few more possibilities, I think). If they didn't enter their name, FontExplorer won't know what to display for "Manufacturer".</p>
      <p>Are you thinking of adding your own tags to fonts? FontExplorer can use your own custom classification:</p>
      <p><cite>Classification – The new classification feature allows users to “tag” their fonts by freely configurable criteria. Additionally it can be used to automatically set classification by receiving this data from the Linotype Server. The automatic classification is available for all fonts that have such an entry in the Linotype database. (<a href="http://www.fontexplorerx.com/macreleasenotes/" rel="nofollow">http://www.fontexplorerx.com/macreleasenotes/</a>)</cite></p>
      <p>but this extra information is (presumably, but extremely likely) stored 'outside' the actual font, and it does not modifies the real font file.</p>
