    html: |-
      <p>You're goning to have problems with any "current" font-management software release. Because font handling is one of the core functions of the operating system, it tends to get "fixed" or changed with every major update, if only a little. Font-management utilities (Extensis' Suitcase/FontReserve/Fusion, Lintoype's FontExplorer, Insider Software's FontAgent Pro) all use hooks built into the system to "fool" it into thinking the fonts they manage are installed in a "legal" location, and generally intercept calls for fonts made by applications so they can "auto-open" those fonts that are not currently active. All this tends to change with new OS releases.</p>
      <p>You're likely going to have to find an "older" version of one of these utilities, released when OS 10.2 was current. Most software I use/have installed will not guarantee proper operation under less than OS 10.3.x (Tiger); I know that I forced my co-workers to upgrade to 10.3 partly because font-handling was so problematic under 10.2.x.</p>
      <p>On a personal note, I'd stay away from Extensis -- tech support is notoriously hideous, and their updates are VERY slow in coming... I suspect they got WAY too big for their britches after aquiring so many applications over the years. I'd recommend FontAgent Pro (but unfortunately, it's current version does not support 10.2).</p>
