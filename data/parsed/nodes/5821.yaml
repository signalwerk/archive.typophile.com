  - id: 41467
    user: 3472
    date: 2004-08-13T12:35:00
    date_raw: 13 Aug 2004 — 12:35pm
    votes: null
    html: "<p>The R is still not resolved <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\">  <br>The Typeface in # 3 works the best. <br>Although I feel overall the type should be alot bolder. In this case the type should represent the resiliancy of a door or a vault. Right know using these typefaces makes me feel like I don't even need a key at all. There is not much contrast going on..........I wish I could write in words what runs through my head. Anyway, that key hole seems really weak and flimsy. Locks and Keys are strong and powerful things. You want a viewer to feel like they have gained something when they sign up for this site.  <br> <br>The metaphor is this: <br> <br>Turning a key is like opening a door, which is like gaining access to something inaccessible, which is like heaven and discoving something new. It's like opening a real estate treasure chest. It's like loosing your virginity, it's like being bar-mitzvahed, it's like having your first beer. It's like cracking the code. Anyway, you get the point. <br> <br>Good luck. <br></p>"
