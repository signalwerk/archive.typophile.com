    html: <p>1 I didn't see turkey, but that's just me. <br> <br>2 I didn't think Thanksgiving, but that's probably because I didn't see turkey, and that's just me. Actually, I think your color selection keeps you pretty safe from any Thanksgiving association. <br> <br>3 "key" might be a subtle reference to real estate, but "turnkey" is an obvious reference to real estate. <br> <br>4 Have you tried using a less compressed/narrow typeface? If you used a face that was a little less vertical, but left the keyhole-R, as is, then the attention given to the keyhole-R might overcome any other subtle associations (turnkey, Thanksgiving, etc.). <br> <br>Aloha! <br>Scott</p>
