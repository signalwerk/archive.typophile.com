    html: "<p>David, I like very much that way of thinking - making the viewer actually perform the name - and if this works, you've got a very memorable logo. <br> <br>Unfortunately, I see some drawbacks <br>- vertical type is low legibility <br>- vertical type is unpleasant to look at (to me at least ... I always think of somebody jumping from a high building, when I see vertical type on street signs) <br>- real estate agents need a more flexible, less space-consuming system for their ads, right? <br>- you have made the type perform a 90 degree rotation ... in fact it should be at least 360 degree (what I mean: the pun is too subtle) <br> <br>I hate to sound negative ... because, again, it's the right way of thinking. <br> <br>-- <br>Soren O</p>"
