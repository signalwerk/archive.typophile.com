    html: <p>"the logo needs to communicate that with TurnKey, creating a website is easy and simple" <br> <br>Sally, I'm sorry but I don't think you've achieved the goal you set for yourself. The logos you've created thus far say 'real estate' but more in the sense of a real estate agency, not a service for realitors. Is Turnkey a software program? A template to download? How will the logo be used? on packaging? on-line? The fonts you've been using give the design a delicate look. Appropriate for an agency that specializes in million + estates, but is it appropriate for this client and their product? If simple is the main concept you wish to communicate I think the logo is still too complex. The two-tone key hole is distracting and personally I don't think the shadow 3-d effect adds anything to your icon, and I do like the key hole. I know you are planning on wrapping this up soon. I'm sorry if this sounds negative - it's not meant to be. Your designs look nice, and are leaning towards quite elegant. It's just that from your own description it seems like they aren't hitting the mark yet.</p>
