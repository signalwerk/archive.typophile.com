    html: |-
      <p>Idris, if you like I can send you TTX dumps of a fairly basic Arabic OT font, so you can take a look at the structure. I don't think it would be too difficult to munge from various kinds of information that can be extracted from FontLab. Actually, you could do most of your GSUB stuff, kerning, etc. -- as much as possible given the FDK code limitations -- and then dump the resulting tables from a halfway font and edit the TTX files to add the additional stuff that you can't do in FontLab.</p>
      <p>But seriously, give VOLT a go: you might like it. Yes, Microsoft is a monopolising behemoth, but a lot of very nice and helpful people work in their internationalisation and typography groups, who are doing very good work supporting complex scripts and layout.</p>
      <p>And at least Microsoft didn't send me a Happy Holidays card with no postage on it, costing me $1.07 to find out who the envelope was from, unlike the typography group of a certain other large computer company. Ahem!</p>
