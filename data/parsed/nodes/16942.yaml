      <p><em>It’s a phobia: get over it.</em></p>
      <p>Hmm, I think there is some misunderstanding. I don't mind using VOLT; I just don't want to be <em>tied</em> to VOLT, as in <em>absolute dependence</em>. For advanced Arabic- (or other complex-) script development to have to depend on a single product from a single company, particulary a monopoly, is not a healthy situation.  </p>
      <p>OTOH I would still be happy to participate in their beta-testing program. I don't think that looking for alternatives is being not nice to MS;-) And my hat is off to all the hard-working people in the internationalisation and typography groups working for them. </p>
      <p>Thnx to all for your pointers. I especially look forward to Adobe's AFDKO 2.x release.</p>
      <p>Thnx for your patience, and<br>
      All the best,</p>
