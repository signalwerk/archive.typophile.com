    <p>Hi folks,</p>
    <p>Call it a phobia, but I hate to be tied to M$ products for anything essential-) so...</p>
    <p>Is M$ <a href="/wiki/VOLT" class="freelinking" rel="nofollow">VOLT</a> the only game in town as far as development of otf tables is concerned,<br>
    viz., support for features needed by Arabic, etc? Studio5 is not there yet, nor is FontMaster (as far as I know; maybe that is changing?)</p>
    <p>Related: Is there a way to design the tables not supported by Studio5 or FM in text files without using VOLT? Do OT features map to a scripting language that can be converted? </p>
    <p>Still green here, lots and lots to learn-)</p>
    <p>Happy Holidays<br>
    Idris</p>
