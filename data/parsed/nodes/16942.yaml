    html: |-
      <p>Adobe's FDK code is also the basis of the OpenType support in FontLab (and FL Studio) and FontMaster. Currently, the FDK and the applications that use its source code do not support mark attachment required for Arabic and many other complex scripts.</p>
      <p>If things proceed on schedule, Adobe hopes to release AFDKO 2.0 around February, and then have an AFDKO 2.x release around the end of the summer. That latter release will support mark attachment (and all OpenType lookup types), at which point FontLab and FontMaster will have the source code to do the same.</p>
      <p>Regards,</p>
      <p>T</p>
