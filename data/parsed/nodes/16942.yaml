    html: |-
      <p>VOLT is pretty much the only tool available, but don't be afraid: it is free, it is really good, and MS are about to launch a new version that is even better (I'm beta testing it now).</p>
      <p>The only other options I can think of are:</p>
      <p>a) use TTOASM, but it's also an MS product and is nowhere near as easy to use as VOLT. This is the pre-VOLT text-based tool, and really you don't want to use this. Trust me.</p>
      <p>b) code the tables by hand using TTX's xml syntax and then fuse them into the font. I can't really say whether this might be easier or harder than using TTOASM.</p>
