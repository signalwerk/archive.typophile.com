    <p>The Foundry of Ralf Herrmann</p>
    <p>Ralf Herrmann studies Communication Design at Bauhaus-University Weimar.<br>
    He is the webmaster of <a href="http://www.typografie.info" title="www.typografie.info">www.typografie.info</a>, the well-known independent web site dedicated to typography and fonts in Germany.<br>
    Herrmann is founder of a web design agency in Germany, writes books about fonts and typography and is advisor of FontShop Berlin.</p>
    <p><a href="http://www.fonts.info" title="http://www.fonts.info">http://www.fonts.info</a></p>
