      <p>Please remember that you’re talking about the use of quotation marks in English, but practically every language uses a different set of quotation marks. In many European languages, the opening quotation mark is „ and the closing mark is ” or “. I recommend not to deviate from the commonly-accepted shapes of quotation marks too much as they may turn out unusable for languages other than English. </p>
      <p>And as usual, I recommend thinking of English just happening to be one particular language among many that use the Latin script. </p>
      <p>A.</p>
