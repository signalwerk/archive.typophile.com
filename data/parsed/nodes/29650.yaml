      <p>&gt;No, not a matter of optical scaling. Frequently footnotes look better with shorter descenders, but ultimately I think it depends on the leading. There are book designers today who use the text leading with footnotes. In fact, I just finished setting a small book where the footnotes were specified 8/14.</p>
      <p>You are of course right that shorter extenders are not a requirement. But the practical constraint here is that if you have longer descenders at small size then you are more or less required to do more leading, and so the publisher has to pay more for paper. </p>
      <p>It seems like whenever economy is a prime consideration (eg newspapers), then publications both historically and now generally go for relatively small type sizes with large x-heights. That way you still get decent readability with economy. </p>
      <p>So as a designer, if you are going to do optical sizes—which I think are a good idea for readability—you have the question of what demands to serve. </p>
      <p>I really wonder how much demand there is for 8 point type with a small x-height with 14 point leading. I must admit it sounds weird to me. I would think that it is going to be more readable with a larger x-height than is ideal for an 11 or 12 point font. And then if you want to make the 8 point type still more readable you can give it some more space between the lines. </p>
      <p>Now you could design with three different extenders, like Trinite, and combine that with optical sizes, like Minion. But the question becomes whether you are making a huge amount of pointless work for yourself. </p>
      <p>I guess what I am saying is that I can see that larger x-height at 8 point is an advantage for many uses, and I am having a hard time figuring out when a small x-height at 8 point would be an advantage. </p>
      <p>You tell me: Is there a demand for such a creature? </p>
      <p>On display sizes: I already acknowledged that all bets are off there. It is mainly an aesthetic choice, and would depend on the design. For example the much-maligned ITC Garamond, with its large x-height, actually works at display sizes.</p>
