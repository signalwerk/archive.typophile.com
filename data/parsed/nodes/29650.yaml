      <p>For Mrs. Eaves, it was someone else who pointed out how the serifs are so long and thick, and the contrast so low, they look geared to tiny sizes, but the x-height is tiny with long extenders, implying display, or at least larger-size use. It can’t decide what size it’s for. With ITC Garamond, the conventions that led to it developed in advertising; hand-lettered headlines tended to be based on the text type used in small sizes, but adapted for display, with tighter fit, more delicate serifs, more contrast. As the decades ticked by and standards dropped, all that was left of those conventions was the urge to space everything tightly and fuss over serif shapes, so ITC Garamond was essentially a display variant of Garamond 3, except that other inescapable trend in the 70s was to make x-heights gargantuan, so the result was a typeface with detailing appropriate for about 120 points and up, with x-height and other proportions suitable for about 5 point. And now we get to look at miles of it in 9 point on glossy paper in grey ink. Puke. </p>
      <p>The original topic: Kern uncommon pairs, is a perpetual issue in designing type. Thanks for providing some real uses. That topic alone would be worth sticking to.... ;)   Anyone have others they always look for?</p>
