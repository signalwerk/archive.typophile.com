      <p>Hrant, thats the ugliest thing I’ve seen since I got my fingers caught in the mangle. A “close quote” or an “apostrophe” is, historically, a raised comma. An “open quote” a turned comma. If you’re going to redesign them, feel free. If I have to use the font, I’ll just turn them over &amp; kern them.</p>
      <p>As to the long descenders, you’re right about the “g” — it &amp; to some extent the “y” basically determine how long the descenders can be. I’m rather less convinced about the wasting of apparent size; you can’t be a book designer these days with out specifying type 10/15 or so.</p>
      <p>Bill:</p>
      <p>No, not a matter of optical scaling. Frequently footnotes look better with shorter descenders, but ultimately I think it depends on the leading. There are book designers today who use the text leading with footnotes. In fact, I just finished setting a small book where the footnotes were specified 8/14. Conversely, display type usually looks better (to my eye) with short descenders. But as always, much depends on the design of the letters, and the design of the book.</p>
