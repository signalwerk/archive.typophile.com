      <p>Bill,</p>
      <p>I’m a bit of a dinosaur, I still think in terms of the page, not an element like leading. But fashion changes, and paper has dropped in price relative to total (book) printing costs. And since (1) chapters usually begin a new page, and (2) book printing is purchased in terms of signatures, there really isn’t too much cost increase for a lot of leading, unless the book has over 1,000,000 characters. What usually suffers is the foot margin, due to a publisher’s requirement for, say, 2,800 characters per page, and a designer’s insistance on 14-15 points lead.</p>
      <p>If anyone wants to take a serious look at long descenders, they have only to look at, say, Monotype metal Bembo versus Monotype PostScript Bembo. Same with Monotype metal Baskerville versus Monotype PostScript Baskerville. And you’re right, it is ascenders too. I allow that type for book texts isn’t a hot item, but one of the plusses of OpenType is that it doesn’t take that much more effort to address two markets; print where packing in the characters is important, and print where the look of the page (really, the spread) is still considered important.</p>
      <p>Actually, the book I mentioned with 8/14 leading was a poor exaple, in that the leading works for this book. The book was a rememberance of Richard Eckersley, and the only piece with notes was by Richard’s son, Sam. There were only a few notes, and they were as important as the text. Would that more designers paid attention to just what is in the notes.</p>
      <p>And please kern the quotes. Changing the class kerning where “quoteleft” has another member in it’s class, namely “quotedblleft” is beyond me, since I don’t want to have a positive kern between two single quotes, &amp; can’t figure out how to add the exception. I’m a comp, not a computer programmer.</p>
