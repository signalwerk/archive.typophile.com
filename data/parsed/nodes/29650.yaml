    <p>When you guys make new fonts — or revisit older ones — can you remember to kern quotedblleft quoteleft, so “’He said’” doesn’t look so bad? And quotedblleft quoteright, for “’Tis of thee I mutter . . .” I suppose those in the UK would prefer the reverse, and it couldn’t hurt, along with the right/dblright.</p>
    <p>And for the two or three of us who still use type for book printing, kerning with superscript numbers would be very helpful. Footnote calls usually follow periods, commas, and quotemarks. If those could be kerned, we could struggle on &amp; kern the other superscripts by hand.</p>
    <p>Another wish would be a set of long descenders for type designs where they would be appropriate.</p>
