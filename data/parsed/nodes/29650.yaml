      <p>&gt; can you remember to kern quotedblleft quoteleft</p>
      <p>Or better yet, make both double quotes point up, and<br>
      both single quotes (and the apostrophe) point down.</p>
      <p></p><div class="imageWrap"><img src="/files/quotes_mine2_6568.gif"></div><p></p>
      <p>&gt; I am coming to the conclusion that this is a matter of optical<br>
      &gt; scaling, with small sizes calling for shorter extenders</p>
      <p>I assume it helped that <cite>this is in fact a long-established truth.</cite></p>
      <p>Specifically concerning the shortening of descenders more than the ascenders, it makes sense (up to a point of course) for a good reason: relative frequencies. When you give as much room to the descenders as the ascenders(see for example Ruse) you’re in effect wasting apparent size. In fact one indication of a good text font is the “g”: if it doesn’t look slightly cramped vertically, there’s something wrong. That said, aesthetics can of course be allowed to alter the course of efficiency, when it makes sense.</p>
      <p>hhp</p>
