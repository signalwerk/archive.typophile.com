      <p>&gt;I still think in terms of the page</p>
      <p>No doubt you’re right as a designer and compositor to think in terms of the page—or page spread.</p>
      <p>What I am thinking about in terms of x-height and descenders is readability and aesthetics, first and foremost. I need you and your colleagues to tell me what your needs are. </p>
      <p>Recently in one of the (interminable) threads on readablity, Kevin Larson quoted some research saying that 11 point type (I assume a relatively normal x-height, seriffed book face) is the most readable, and that bigger and smaller type people read more slowly. David Berlow cited research that newspaper readers prefer between 8 and 11 point. </p>
      <p>Books and newspapers have different demands, and I don’t have the knowledge to give numbers on what works best. I just observe two things: </p>
      <p>1. Aesthetically, as well as for readability, a variation in the same design seems to work better with a bigger x-height at smaller sizes. Personally, I think a lot of type today goes too far in chopping the extenders, but some reduction is traditional. I know it is for Caslon, and I believe also for Garamond, and probably many others.</p>
      <p>2. Reducing descenders only, as was the rule in the early 20th century, is aesthetically a problem. The ascenders and descenders should have some balance. It seems like it works best with the descenders somewhat shorter, but not massively. For example, what the short descenders forced on Goudy were pretty bad—at least in some versions I have seen—and P22’s full extender version is a definite improvement, I think. However, MF Benton designed Goudy Catalogue, also with short descenders. But it is intended for small sizes, and much heavier, and I think Benton pulled off the design of the short descenders pretty well, for the purpose of the type.</p>
      <p>I’ll kern the “’___’” Message received, thanks.</p>
