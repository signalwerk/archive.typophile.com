      <p>In the mythical font format I’m designing, there will be a slider that interactively dials in the ascender and descender lengths desired. The capability actually exists in Knuth’s <a href="/wiki/Metafont" class="wiki">Metafont</a> system, but it’s all but impossible to use in practice.</p>
