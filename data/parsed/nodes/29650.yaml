      <p>“Just how big was it, Johnny?”</p>
      <p>Actually, if you look at some of the hot-metal fonts, they were offered with optional long descenders. Traditionally, “short” descenders were used by newspapers, so they could pack in more copy. Linotype wasn’t dumb, since more machines were bought by newspaper publishers than book printers, the short descenders became standard, and “long” descenders became an extra-cost option.</p>
      <p>And I can’t resist, what are usually termed “modern” figures came about to support advertising, which used a lot of full caps. “Old style” numbers are better termed “lower case” figures, as that would indicate their use rather than date of origin. There is always a problem with date-of-origin: “modern” figures, for example, are just as up-to-date as corsets. Not really a “build” issue, though . . .</p>
