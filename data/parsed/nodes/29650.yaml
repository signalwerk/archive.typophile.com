      <p>Carl, interesting analysis. I agree with you about using Mrs. Eaves or ITC Garamond at small sizes—that they don’t work for the reasons you say. </p>
      <p>But at display sizes they do have a certain eye appeal. I think at display sizes there is no rule about extender lengths, and both typefaces both pull off their designs with a certain eye-appeal. </p>
      <p>My problem is that both have a stylishness and glamour that turns to distaste after a while. They are like exaggerated styles in fashion that look great for two months and then you look back and think: why did we ever think that looked good?  </p>
      <p>Maybe, though, both the appeal and the distaste is because of the incongruousness of detailing vs proportion that you point out. —So they work on one level, but the lack of balance makes them wear out their welcome.</p>
