      <p>What about drawing it in through a graphical tablet? It'll give you the imperfections you need while keeping it as a vector; it'll then allow you to trace a hand-drawn version. </p>
      <p>It's a fine line between cool and naff - it needs imperfection to give it character. Also, duplicate characters (the N, E and O) should have differing glyphs second time around.</p>
      <p>As for the wider picture, it might be nice to keep everything else formal except your logotype; it would allow you to get away with such a quirky logo, if it's kept in check by using relatively formal bounds (i.e. flat colour, conservative/minimal typography and so on).</p>
      <p>It takes some bottle to do something so different, nice one!</p>
    html_clean: |-
