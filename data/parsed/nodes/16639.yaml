    <p>I'm designing a logo for a local resturant for class (the One Caroline St. Bistro). The place is somewhat swanky, its old-style hip, like 1920's blues hip with a very formal quality. I thought for the logo I could design a typeface based off of european posters and magazine hand-lettered type from the 1920s/30s. People like Toulouse Lautrec and others. So I settled on takeing a lot of reference from the first cover to Simplicissimus (which is in the attached image). My typeface keeps coming out very childlike however, and I'm not sure if I should be trying to make it more formal or if the attempt at giving it straight lines is whats ruining its charecter. I've only really done one other typeface so I'm still very new at this, any ideas would be appreciated.</p>
    <p>also, I didn't know where to put this because technically it's only a typeface I'm asking about, but It's really for a logo... I settled on here because I think after I get this sorted out I'll post the rest of it (the full logo) to be critiqued here.</p>
