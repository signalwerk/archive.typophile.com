      <p>Wow, I find the third attempet a great improvement. The piano has found its position in a subtle but clear way, I like that a lot. And the bistro feeling is there, definetly.</p>
      <p>However I think you could work more on the lettering. On the whole it stills differ a little from the feel of the piano keys - the stroke in the drawing seems more natural, maybe because the "imperfections" are smaller and more numerous. You could try to give some of that feeling to the letters.</p>
      <p>The straight vertical lines on the counters of the o in "one" and "caroline" are distracting, I think. They don't fit. In fact, I think you should try to avoid long vertical or horizontal lines. Break them up in small parts, or make them subtly into curves and diagonals.</p>
      <p>Also, if you want to go for the "hands on" approach, you could try buying some heavy paper and cutting out the letters with scissors and/or an X-acto knife. And before doing, be sure to jump into  some ice-cold water for that extra-shaky effect ;)</p>
