  date: 2002-05-30T12:19:00
  votes: null
  html: "<p> I was recently approached by the design department of a college to generate a custom quote for them for some fonts they'd like to use for thier department and while it's a nice opportunity, it seems also riddled with problems. <br> <br>Here are some questions that came to mind: <br> <br>How many computers do they wish to put the fonts on? <br>How many students enroll annually in your program? <br>Will the students have access to the font files for use outside of school? <br>How many years do they intend to use the fonts on your computers? <br> <br>Knowing that piracy is so rampant on college campuses, how can I willingly quote this knowing that my faces will be vulnurable to piracy? <br> <br>Any suggestions? </p>"
comments:
  - id: 7022
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 30 May 2002 — 1:33pm
    date: 2002-05-30T13:33:00
    votes: null
    html: <p> Dude, would you rather make some money, get exposure, and generate positive word-of-mouth, or would you prefer to sit by the fireplace with the sole copy of your precious design? Don't let your anger against piracy (which is a *certainty*, btw, and really only a matter of degrees, in college or wherever) cripple your productivity. Enough people are making that mistake already these days. <br> <br>Depending mostly on how much money they have and what size family they want, quote them somewhere between 2000 to 5000 US$, do it, and move on. If they want exclusivity, add anywhere between 50% to 100% to the price, depending on the duration. <br> <br>hhp </p>
