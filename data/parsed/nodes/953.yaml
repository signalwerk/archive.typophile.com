    date: 2002-05-30T15:32:00
    votes: null
    html: "<p> The school wants a site license for several of my retail fonts. I found out a few more details since my original post: <br> <br>These would be loaded on 22 computers (PCs) and would be used for a maximum of three courses a year at a maximum of 22 students/class. (Typically only 2 of the 3 courses get enough enrollment to \"go\". Typically, there are about 10 students in each course.)  The fonts would not be made available to students for use outside of school. The fonts would probably be retired in three years along with the computers. <br> <br>I like many of the suggestions presented here. Overall, it's nice to understand the different directions I can take knowing where the fonts will end up before the license is created. <br> <br>Stuart :D </p>"
  - id: 137172
    user_id: 1160
    user_name: Joe Pemberton
    user_path: null
    user_image: /files/pictures/picture-1160.png
    date_raw: 30 May 2002 — 2:40pm
    date: 2002-05-30T14:40:00
    votes: null
    html: "<p> Stuart, <br> <br>Pros: <br>You'll be introducing your fonts to a bunch of students. <br> <br>Cons: <br>You'll be introducing your fonts to a bunch of students. <br> <br>Some of them may copy them (likely will copy  <br>them.) Some of them will remember your work later  <br>when they're professionals, when it really  <br>matters. <br> <br>Along with technical methods to prevent piracy,  <br>what does the University do to teach students  <br>about the ethics and effects of font piracy? I  <br>think this has the potential to be more  <br>effective in the long run. </p>"
