    html: |-
      <p>Hey Brent, you <em>are</em> welcome.<br>
      You just hit the sore point, I’m afraid. There are a lot of type designers here on Typophile, and they’re quite allergic to free fonts, you certainly can relate to that.</p>
      <p>However, there <em>are</em> free fonts – unlike free iPhones and MacBooks. Hell, there are a lot of Typophile type designers who give away (some of) their fonts for free. And there’s even a <a href="http://typophile.com/node/14652?">FAQ on free fonts</a> in the Typophile wiki.</p>
      <p>So – additionally considering that an adipose Frankfurter is not something like a genuine textface that would be considered as labour-intensive, requiring extensive kerning an whatsoever, but quite on the contrary rather a face that typically would reside in the realm of free fonts – I cannot understand the harsh reaction.</p>
