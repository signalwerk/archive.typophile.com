    <p>Hello,<br>
    I am looking for fonts (as many as possible) where the lettre 'a' is shaped as a flipped lettre 'e' like in "newman" logo.<br>
    The only font i found is <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/designer-genes/regular-fit/" rel="nofollow">designer-genes</a>, i little less square will be great.<br>
    Any help will be be very appreciated .<br>
    Thank you.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/newman_logo_4750.jpg"></div><p></p>
