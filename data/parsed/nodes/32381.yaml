    html: |-
      <p>Thanks—I was scared that that was going to be the sad truth.<br>
      It’s so unfortunate how many good-looking typefaces got lost or changed drastically when design went digital.  I would think there would be enough demand for some true-to-form digitization of these old school letterpress / letraset / etc. typefaces and variations for a foundry to take on the task.</p>
      <p>There’s another font on here I would’ve sworn is Futura at first glance, yet it has a 1 and a more similar to Avenir.</p>
      <p></p><div class="imageWrap"><img src="files/pharaohs-label2_4638.jpg"></div><p></p>
