    <p>Hi. Well 1st it’s nice to meet you guys. </p>
    <p>I’ve been getting a lot of tips from this forum for the past year now and I feel that I’m coming to the right place for help here.<br>
    It’s my 1st post and I desperately need help in redesigning a company’s stationery set. </p>
    <p>Here they have a logo which unfortunately are against the idea of a new concept but what they require is a complete revamp of their stationery.<br>
    I’m trying to give them a “wallpaper” look . Strong images accompanied with a clean layout. meaning to say lots of breathing space.<br>
    I just can’t for the life of me figure out what font would suit it best. </p>
    <p>I’ve tried going with the norm of sans for headers and serif for body copy but it just doesn’t suit it for some reason. So far the best that works for me is segoe light(free font) and frutiger/myriad. Here’s what I have so far. Would appreciate any critique or any suggestions for matching fonts. Thanks!</p>
