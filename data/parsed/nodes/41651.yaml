      <p>Well, one way would be to not have a serif at all and create hierarchy by using different weights and versions of the same sans. Sharon suggests a great option with Apex. The new featured face Clan may also work for you; as would some of the <a class="freelinking-external" href="http://www.dutchtypelibrary.nl">DTL</a> faces like Argo and Prokyon.</p>
      <p>The other safe way would be to look at some of the supefamilies like Quadraat or Fedra that have sans and serifs in a wide range of weights and variants. <a class="freelinking-external" href="http://typophile.com/node/39833?">This list</a> may be helpful. </p>
      <p>And if it’s just a serif that you’re looking for to match with Myriad/Frutiger, <a class="freelinking-external" href="http://www.gerardunger.com/allmytypedesigns/allmytypedesigns08.html">Swift</a> should work real well.</p>
