      <p>Hey thanks. Apex looks real sweet. I’ll try convincing my clients to stretch a lil more on the budget to get it but for now I think I’m stuck with segoe. Gonna take writingdesigning’s suggestion on the weights. So far it’s looking ok with dialog light. Looks a lot like myriad except for a few characters, the loops are open, not closed.<br>
      Would have used myriad itself but I think it’s getting a bit too over-used. </p>
      <p>Thanks for the tips! I’ll drop a preview of the next draft soon.</p>
