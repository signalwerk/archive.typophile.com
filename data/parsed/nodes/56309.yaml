    <p>Greetings all,</p>
    <p>I am just wondering what you do when you find out ONE glyph is not available in an open type font like Eurostile LT Std...<br>
    I need to use 1/3 and apparently its not here... and well making a normal 1/3 as fraction in the open type menu of in design does not fix the problem apparently.<br>
    SO what I do (and yes I feel stupid) is build it on illustrator and simply stick it where it should be used... (damn design huh?)<br>
    Anyone has a suggestion? I am seriously annoyed! and would /embrace a kind answer from you!</p>
    <p>Thanks</p>
