    html: |-
      <p><em>There was a annoying difference with the fraction /</em></p>
      <p>The fraction character (a.k.a. "virgule") is different from the slash, and should be the same in the font when both an isolated character, or when part of a composite fraction.</p>
    html_clean: |-
