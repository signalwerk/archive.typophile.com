    html: |-
      <p>If you're not a type designer without the necessary tools, then Illustrator might be your option.</p>
      <p>Otherwise, depending on your adherence to the EULA of the font and the availability of the proper font tools, you could cannibalize the ½ symbol and hack it in.</p>
      <p>Or, depending on the circumstances, you can use one from a different font. (Although, it's not going to be easy to match Eurostyle.)</p>
