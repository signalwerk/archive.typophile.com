  html: <p>I'm looking for the font that is used on the sign for <a href="http://www.emporis.com/en/il/im/?id=248811" target="_blank"> The Gas Company Tower</a> in Los Angeles.  It should be a full typeface since it is also used on the Parking sign.  It might be proprietary, though. <br> <br>My apologies for not posting an image in the thread, but the person wants $240 for using that crappy snapshot.  I'll try to remember to bring my digital camera next time I go for a walk and I'll take a better picture. <br> <br>Thanks!</p>
