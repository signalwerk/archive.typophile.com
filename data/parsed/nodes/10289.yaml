    html: "<p>Stephen, <br> <br>Here's some points: <br> <br>* I hope I don't sound too cheap, but fonts seem to often cost a little bit less at MyFonts.  If a font is $22 at FontShop it is often $21 at MyFonts. <br> <br>* Accept PayPal.  It's nice to buy a font once in a while when I have money laying around in my PayPal account. <br> <br>These seem to be the two main reasons for me.  But I'll be using FontShop more in the future. <br> <br>Here's what FontShop does better than MyFonts: <br> <br>* The new testdrive is awesome!  Up to 388pt in size.  I haven't seen that anywhere before... now you get to see the small details.  It'd be a nice added feature if you could enter the point size yourself.  And maybe for a future testdrive have an \"advanced\" link where you could test drive OpenType functions for the font. <br> <br>* The design of the site is a lot nicer than MyFonts, which is a little bit too cartoony for my taste.  Professionalism goes a long way. <br> <br>* Free font of the month.  I love this feature... and makes me come back to the site.  FF Absara is really great, and I'm doing to use that in some project in the future so I could buy some more weights. <br> <br>* You!  I don't see anybody from MyFonts identifying fonts and helping out in here. <br> <br>That's all I can think of at the moment.  I'll add more points if I think of something more. <br> <br>Thanks!</p>"
