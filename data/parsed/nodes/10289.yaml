      <p>I really appreciate your comments, Lauri. We crave customer feedback. <br> <br><br>
      </p><blockquote>
      <hr size="0"><!---quote-!--><b>quote:</b>
      <p>It'd be a nice added feature if you could enter the point size yourself.<!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
      <p></p><p> <br>This is actually possible already by "hacking" the URL. After  <br>running a custom sample, just change the very last number of  <br>the address in your browser to whatever point size you desire. <br>(The renderer can actually churn out samples above 388 pt. Shhh.) <br> <br><br>
      </p><blockquote>
      <hr size="0"><!---quote-!--><b>quote:</b>
      <p>improve the keyword search<!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
      <p></p><p> <br>Agreed. In fact, any sort of advanced search isn't enabled at all right now <br>while the people behind the curtain tinker with the keyword cogs. <br>We shall enable it soon and I think you'll be very pleased with it.</p>
