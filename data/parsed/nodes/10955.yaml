  html: <p>Does anyone have this book? <br> <br><a href="http://www.fontshop.com/virtual/index.cfm?area=other_products&amp;subarea=other_products_fontbook">FONTBOOK</a> by fontshop.com? My main problem on choosing fonts is a visual reference and this seem a nice tool. Looking at font on screen can tend to be tedious and evetually they look all the same (as a friend of mine theory where the fonts are all like Times new Roman and Arial). <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br><img src="http://www.typophile.com/forums/messages/4100/8661.gif" alt=""> <br> <br></p>
