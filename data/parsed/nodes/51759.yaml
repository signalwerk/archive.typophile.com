    <p>Hi there! I’m currently working on this typeface, named Lanita (in old bulgarian - "cheek"). So, here is my attempt for: regular letters (capital and small), old style numbers, latin ligatures and plucky try for cyrillic ligatures. I really want to know your opinion about them. Also, and for this typeface at all. Each comment will be valuable!</p>
    <p><a class="freelinking external" href="http://ipopov.net/vector/wip_lanita_1.jpg" rel="nofollow">Lanita Latin</a></p>
