  html: |-
    <p>I'm looking for a simple API or font-project-format or just font-format allowing to generate a font (font project) from my own program code with maximum ease.</p>
    <p>The properties I'd like to set for each glyph are:<br>
    - vector curves (eps/ai/svg/bitmap)<br>
    - width/height<br>
    - baseline</p>
    <p>The other properties could be tweaked manually in a font editor.</p>
    <p>Thus it should be either an open and friendly file format or well documented API.</p>
    <p>Please let me know if you know such a solution. Thanks.</p>
