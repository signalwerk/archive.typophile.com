    html: |-
      <p>In the OpenType panel I 'Copy features from a font…' which includes the 'kern' feature… and in the Classes panel I 'Copy classes from a font…'</p>
      <p>I guess in addition to that I'd need to, from the Metrics panel 'Save Metrics' and then 'Open Metrics' in the new font file to complete the process?</p>
      <p>I don't do this often but what happens is, sometimes I get caught up in the process of making changes to certain glyphs and/or making tweaks to additional weights of a particular font and I've often accidentally copy and pasted over some of the red marked 'key glyphs' to where, when I finish I basically want to just go back to the original un-touched weight and copy over all the kerning and class data to the additional weights or to the additional file I'm working in to ensure the data matches and nothing was 'thrown-off' in the process… not sure if that makes sense but that is why I was looking for ALL of the data to be copied over regarding kerning and classes…</p>
      <p>Thanks,</p>
      <p>Mike</p>
