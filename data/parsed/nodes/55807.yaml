  html: <p>Why is it that when you copy classes and kerning from an existing fontlab file to another, when you open the metrics window, it shows you have '0' pairs, when in the OpenType panel window and the Classes panel window it has all of the your kerning/class info… is there an easy way to compile the info so it shows all kerning pairs like it should in the metrics window?</p>
