      <p>I think Jeff (CreativeNRG) may have been on track by saying it might be from a typeset version, although the digital option was becoming dominant by the early 90's (I'd guess). They used something with SCOsF. Without any of my type/font books, I'm not sure which digital foundries offered that then, but Monotype, Linotype, ITC and Berthold were dominant at that time. (Adobe was mostly offering versions designed by one of those foundries, Relatively few fonts were their own versions at that time.)</p>
      <p> - Mike Yanega</p>
