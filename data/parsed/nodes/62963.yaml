    html: <p>Some of the characters (notably <strong>r</strong> and <strong>f</strong>) are visibly thicker than others, and the counters on the <strong>e</strong>'s are partially filled in. This makes me think that Penguin didn't set new type for the 1994 edition, but scanned tearsheets from an older edition that had been printed from Monotype or Linotype.</p>
