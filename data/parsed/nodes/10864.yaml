  html: <p> When generating MAC PS1 fonts with FOG, the suffix .bmap is added after the name of the font. <br>Is there harm in removing this? <br>I've done a number of tests and haven't found any problems.  <br>Does anyone know why this is added? <br>Many typefaces from professional foundries do not <br>feature this suffix but I suspect it may be a  <br>result of using Fontlab or RobFog for final font generation. <br> <br>Best, <br>Eric </p>
