      <p>Talk to your printer. They'll have a few sizes that work best with their presses.</p>
      <p>Some common U.S. magazine sizes:</p>
      <p>8" x 10.5"<br>
      8.125" x 10.875"<br>
      8.375" x 10.875"</p>
