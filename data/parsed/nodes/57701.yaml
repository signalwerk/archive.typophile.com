    html: |-
      <p>Find a magazine based near you, and phone the production manager to find out where it is printed. Then phone the printers and ask what sizes they can handle. Most places have a range of sizes, depending on press and configuration.</p>
      <p>At the same time you will be able to get some ideas of print runs and (though you will have to talk to a salesperson for this) costs with different types of papers. You will need to know these things as you work out your business plan.</p>
      <p>You were thinking of creating a business plan, weren't you?</p>
