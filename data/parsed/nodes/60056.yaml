  html: |-
    <p>I'm looking for a typeface that can in some way be traced back to Ireland—traditionally used there, the designer, etc. It will be used for the nameplate of a newspaper. </p>
    <p>I should clarify that I'm not interested in Celtic-style typefaces. Just a suitable serif with Irish roots. </p>
    <p>Thanks in advance.</p>
