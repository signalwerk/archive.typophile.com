  html: <p>This is the cleanest version of their logo one of our customers could provide us with.  I've been using it for about 6 months now and I can't stand it any more.  I'm going to recreate free of charge just so I don't have to look this peice of garbage.  The font is similar to Futura or Century Gothic, but the mid-point of the M doesn't touch the baseline.  Anyone recognize it? <br> <br>Thanks in advance for sharing your knowledge. <br> <br><img src="http://www.typophile.com/forums/messages/83/47917.jpg" alt="McNeals' really crappy logo"></p>
