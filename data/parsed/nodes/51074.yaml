      <p>Didoni and Sahara are both appealing, but the contrast between thick and thin isn't right -- the super-thin strokes is what made Pistilli Roman so cool, IMO, and what made it look great at big sizes.<br>
      I'll keep hoping that someone will digitize it someday -- I know people would buy it.</p>
