      <p>Kent,</p>
      <p>I've did a digitization of Pistilli Roman for a redesign of Glamour magazine years ago when Henry Connell was the art director. I know Dave Farey has done a digitization of it as well. At the San Francisco TypeCon, Dave and I compared our versions, and damn if they didn't look like the same face! No plans of any release. </p>
      <p>It is a really difficult design to space properly. Unless of course if you want to smash all the letters together like they did in the 70s.</p>
      <p>James</p>
