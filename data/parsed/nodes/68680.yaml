    html: |-
      <p>I doubt it's Garamond. As far as I can tell, I'm pretty sure this is Hoefler Text, widely tracked. Hoefler Text design was inspired by Garamond No. 3 and Jenson/Kis, so that's why it resembles them both.</p>
