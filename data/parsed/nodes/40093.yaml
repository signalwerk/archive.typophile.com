    <p>Of course this is no surprise to anyone here. <a href="http://www.typophile.com/node/37478" rel="nofollow">Typophiles</a> have <a href="http://www.typophile.com/node/29098" rel="nofollow">been all over</a> the <a href="http://www.veer.com/ideas/etched/" rel="nofollow">Trajan</a> issue <a href="http://www.typophile.com/node/2609" rel="nofollow">for years</a>.</p>
