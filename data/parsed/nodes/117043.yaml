      <p>Good digging Mike! If one wanted to make something like the sample this would work as a starting point. The letter-forms, weight, and contrast are definitely in the ballpark. About another  five degrees of slope and some editing of details, and Number Five is pretty close. In any case I appreciate Laura Worthington as one of our more accomplished script font makers.<br>
      Didn't get any further info from the ID requestor, so we really have very little to go on to determine if this is a script as such, or a custom word .<br>
      I am still interested in this project because the letters suggest something that would be [or is] an engaging script.<br>
      Don</p>
