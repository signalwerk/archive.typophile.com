    votes: null
    html: |-
      <div class="comment-spam-body"><p>Thanks for the source info. I did some checking on-line, and observed that this is perhaps the new version of Roundtree &amp; Yorke's _Caribbean_ trademark. At least it's shown on labels of Roundtree &amp; Yorke's _Caribbean_ items now being sold by major retailers. I was not able to find information on the date of trademark registration, but I did find labels on what may have been earlier stock of Roundtree &amp; Yorke's _Caribbean_ label with the word _Caribbean_ in a Roman text.<br>
      On balance, I'm going to guess that Roundtree &amp; Yorke's _Caribbean_ trademark as shown in the image, is the fairly recent work of a designer who may or may not have adapted Laura Worthington's Number Five Smooth, published in February 2013 or earlier.<br>
      Of course, the designer might have adapted another baseball style script.<br>
      Don</p>
      </div>
