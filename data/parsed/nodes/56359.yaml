    html: |-
      <p>Sebastian, </p>
      <p>After one lookup is processed, the application goes back to the beginning of the text string (or better: text run, i.e. the portion of the text string which has the same font, size, writing system/script, and directionality), and processes the next lookup. So your code should look like: </p>
      <p><code>feature calt {<br>
      lookup calt1 {<br>
      sub @condition1 x' by x.alt;<br>
      } calt;<br>
      lookup calt2 {<br>
      sub @condition2 x.alt' by x.alt2;<br>
      } calt2<br>
      } calt;</code></p>
      <p>Cheers,<br>
      Adam</p>
