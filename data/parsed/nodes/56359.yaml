    html: |-
      <p>Substitutions occur in sequence, in the order you wrote your lookups from the top to the bottom. So when you have your first lookup for changing x to x.alt1 , you have to pay attention for your second lookup whether the first condition has met, could be met or not. Whether for your second lookup you are dealing with x or x.alt1 or both, in order to change it to x.alt2<br>
      So it is important to pay attention to the sequence of events and write the lookups accordingly.</p>
      <p>You are right. There are a lot of good discussions about this in here but I don't remember the topics off hand. Keep looking. You'll find them.</p>
