    <p>Dear Typophiles,</p>
    <p>sorry for maybe asking a quite basic question, i just can't find a potent keyword that gets me to the for sure existing answers, so I'm asking for a link to other threads or a short explanation ... It should be simple, but it just does not work at the moment and I don't know what I am doing wrong. :(</p>
    <p>I try to to a "multi-step" one-after-another-replacement with opentype (fontlab 5):</p>
    <p>Let's say I have a glyph x.<br>
    in calt-feature, i substitute x by x.alt<br>
    after that, i want to check another condition,<br>
    and in case it applies, want to sub x.alt by x.alt2</p>
    <p>is this possible to do?</p>
    <p>To explain what i actually want to achieve with this:<br>
    i want to do a script font, that has three vertical levels of connectors to the glyph right before it. So i have 4 variations of each letter, i.e.   h h.low h.mid h.top<br>
    depentent on its predecessors "end", the basic "h" is replaced by its low mid or top connector variant so it fits seamlessly.<br>
    after that, i want to check if the glyph is set at the end of a word (followed by a space for the beginning), and if so, the .low .mid or .top variant is replaced by a .low.end .mid.end or .top.end variant ...</p>
    <p>thanks for your help<br>
    Sebastian</p>
