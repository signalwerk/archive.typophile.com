      <p>As they are using <a href="http://www.dafont.com/alte-haas-grotesk.font?psize=s&amp;text=GbR+Reinsburgstr+711" rel="nofollow">Alte Haas Grotesk</a> in their <a href="http://www.plotmag.com/mediadaten/PLOTmedia_2013.pdf" rel="nofollow">media PDF</a> I assume they are using it as the Sans Serif above, too. Alte Haas Grotesk is basically Helvetica with sort of an antique touch. </p>
      <p>The typewriter below looks indeed like Courier.</p>
