  html: |-
    <p>Hi guys,</p>
    <p>My team partner and me are creating a book about sign painting in Paris. We detected a great critique about sign painters’ work in general in the german book version of »Treasury of Alphabets and Lettering« by Jan Tschichold and we want to implement his text into our book.  We are germans so we have only access to the german version in our city. Sadly we haven't longer time to use the Inter-Library-Loan.</p>
    <p><img src="https://covers.openlibrary.org/w/id/251445-M.jpg"></p>
    <p>So I would like to ask you in a friendly way, if someone would be so kind to scan two pages for our project?</p>
    <p>The text is kind of the beginning in the german book on page 9 and 10. The german headline is called “Schrift als künstlerische Aufgabe” which could had been translated in the english book “Type as artistic duty”.</p>
    <p>Thank you very much :)</p>
