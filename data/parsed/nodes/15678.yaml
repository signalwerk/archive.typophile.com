    <p>Apologies to all and sundry if I missed an earlier thread in searching—but, to be honest, I’m not sure what I was searching for (Sunday typographer, etc.), so here goes:</p>
    <p>I am getting an odd character placement problem when using Scala (PS1) and Minion (OTF) in InDesign. Glyphs with counters, curved terminals, and crotches that touch the baseline (a, c, e, o; v, w) appear in print (ranging 10-12 pts) to float off the baseline, as if being squeezed up by the serifs of the surrounding glyphs. There is no visible effect on the screen, but on the page it’s a bit disconcerting. This appears to happen both with the font’s metrics and InD’s optical kerning activated. I am not such a greenhorn that I don’t know that characters shift in kerning, but comparing my outputs to known good texts (like that of Bringhurst’s <em>Elements</em>) does not make my output look good at all.</p>
    <p>I am using InD CS 3.0.1 on Tiger and printing to an HP LaserJet 1300 with the most recent drivers at maximum resolution (1200dpi).</p>
    <p>I’d attach a .pdf but, as I said, this problem appears only in hard copy. It all looks great on screen.</p>
    <p>Pointers to earlier threads, questions about factors I didn’t think to mention, or a fix would all be welcome. Maybe this is a printer issue, but I’d like to hear that from someone who knows what they’re talking about (which is to say, not me). Thanks.</p>
