      <p>OK, some more experimentation: I am finding this effect in Word, too, and with every serif font I have tried (including that old standby, TNR). I would more closely describe the effect this way: that the system seems to want to place the very bottom of every character directly onto the baseline. On screen, everything look great; in print, things are jumbly. As I said, the effect is subtle but noticeable (and more so in fonts like Scala).</p>
      <p>Yeesh. Can anyone suggest a test that would help me narrow down the problem? Maybe print a .pdf for me on their equipment to see if the effect really is local to my hardware?</p>
