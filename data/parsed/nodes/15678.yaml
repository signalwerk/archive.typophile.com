      <p>Thomas:</p>
      <p>Thanks for getting back. I took the printer to work (where I’m stuck with a PC) and found the same thing happening, so I was reaching the same conclusion as you: either the printer, or the driver (which for a non-hacker like me amounts to the same thing). I’ve had this printer for about 2 years; leave it to the neophyte to take that long to notice the problem at more than a subconscious level (getting the feeling that my output quality was not up to snuff).</p>
      <p>I did see that the problem appeared to go away, or had less impact on the appearance of the type, at larger point sizes (14 to 16pt and up, rather than 10 to 12pt and smaller). This would be in line with the diagnosis you’re suggesting, no? It’s a pity that HP wouldn’t have tried to deal with this in their 10.4 driver updates (or would that have been Apple’s responsibility?).</p>
      <p>I’ll give both your suggestions a try—HP now, a new printer after the holidays, bank account and the economy willing.</p>
