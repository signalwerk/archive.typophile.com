      <p>It’s the printer. You’re already getting their PostScript emulation, I imagine. Sorry for not picking up on the problem right away.</p>
      <p>Another type designer wrote me about this quite a while ago, and he eventually figured out that at least certain versions of the HP clonescript misinterpret hinting blue zones, causing them to suppress overshoots at far too large a ppem size. That causes exactly the phenomenon you describe, with both Type 1 fonts and OpenType CFF fonts.</p>
      <p>You can always try contacting HP and seeing if they have a ROM update or something.</p>
      <p>(Or buy an Adobe PostScript device.)</p>
      <p>Regards,</p>
      <p>T</p>
