      <p>Reed — the seven champions aren’t <em>Who</em>s.</p>
      <p>“When I entitled this paper The Seven Champions of Typography I had in mind (being a lay person) the seven champions of Christendom, the seven wonders of the world, the seven seas, stars, deadly sins, liberal arts, and some other ’sevens.’ But on counting up my champions, I was disconcerted to discover that there were but six [. . .]. So I propose to make my title good by adding to six Champions of Typography — Spacing, Leading, Indentation, Ink, Paper, and Imposition — one more — the most important of all, without which (as is alleged of charity) the rest profiteth nothing. That Seventh Champion, dear Reader, is <em>You.</em> And it all depends on how seriously you take the following pages, whether my title turns out to be truth or falsehood! I assume for it no further responsibility.”</p>
      <p>And No, sorry Inka, I won’t key in the whole essay for you. Perhaps you could assign the task to one of your students for extra credit.</p>
