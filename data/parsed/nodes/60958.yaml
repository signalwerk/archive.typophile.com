      <p>michel boyer said:<br>
      &gt;   It is also possible to use texts that are in the public domain.<br>
      &gt;   Some generous people have worked to make them available.<br>
      &gt;   Have a look at the link <a href="http://z-m-l.com/" title="http://z-m-l.com/" class="link-external">http://z-m-l.com/</a></p>
      <p>except the texts at z-m-l.com are just<br>
      reworked e-texts from project gutenberg.<br>
      i suggest you go to the source, where there<br>
      are thousands more than at z-m-l.com.</p>
      <p>&gt;   <a href="http://gutenberg.org" title="http://gutenberg.org" class="link-external">http://gutenberg.org</a></p>
      <p>more to the point here, most digitization of project gutenberg<br>
      e-texts these days is being done by “distributed proofreaders”,<br>
      a collaborative system that allows collaboration on digitization.</p>
      <p>(and, in the process, wastes lots of the time and energy of its<br>
      generous volunteers due to a workflow that is byzantine, but<br>
      hey, let’s not let that stand in the way for the time being, ok?)</p>
      <p>&gt;   <a href="http://pgdp.net" title="http://pgdp.net" class="link-external">http://pgdp.net</a></p>
      <p>as people have noted here, this essay in question _might_<br>
      be in the public-domain.  it’s extremely unclear, since it was<br>
      published in 1924, just missing the pre-1923 cutoff which<br>
      would ensure that it was public-domain.  but if it hasn’t had<br>
      its copyright renewed, it would indeed now be public domain.</p>
      <p>thus, if you can get someone at distributed proofreaders to<br>
      develop an interest in the essay, they would do the gruntwork<br>
      of seeing if it can be cleared, plus they would do the work of<br>
      actually digitizing it.  it might take them a while — years? —<br>
      since they are badly backlogged, but it could happen faster...<br>
      no matter how long it takes, if it is public domain, you would<br>
      have comfort that project gutenberg is willing to take the heat<br>
      for making that decision (and defending it in court, if need be),<br>
      so that you could proceed without fear of litigation in the future.</p>
      <p>again, i think inka should just go ahead and proceed with using it,<br>
      as the odds that anyone will clamp down on them are very slight...<br>
      i was just remarking about the double-standard here on copyright.</p>
      <p>-bowerbird</p>
      <p>p.s.  and again, it’s stupid that the law creates this field of obstacles.</p>
