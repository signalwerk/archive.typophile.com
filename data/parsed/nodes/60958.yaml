      <p>bojev said:<br>
      &gt;   I would like to give my students”<br>
      &gt;   this is a dead giveaway that<br>
      &gt;   the doctrine of “fair use” applies to this issue. </p>
      <p>[sigh]</p>
      <p>first of all, nothing is that cut-and-dried with copyright.</p>
      <p>“fair use” can be used as a _defense_ in court, certainly,<br>
      but the criteria are multifaceted, and it’s up to a judge...</p>
      <p>further, some of the _other_ criteria would _not_ be met<br>
      in this case — e.g., the essay is being used in toto —<br>
      considerations which complicate the issue substantially.</p>
      <p>the fact that the property is being actively commercialized,<br>
      as represented by its presence on amazon, is also relevant.</p>
      <p>plus it is telling that the content is applicable to the class;<br>
      if it was a piece on physics, or fortune-telling, or football,<br>
      and thus inapplicable to the coursework, that’d be different.</p>
      <p>&gt;   Copying for educational purposes is covered<br>
      &gt;   by different standards than regular copyright.</p>
      <p>i don’t believe a lawyer would put it in exactly that manner...<br>
      then again, i’m not a lawyer, so i can’t say.  are you a lawyer?</p>
      <p>but educational institutions still have to respect copyright...</p>
      <p>i’ll bet you dollars to donuts that if inka ran this question by<br>
      the school lawyers, they would advise against using the text,<br>
      precisely because landing in court is the last thing they want.</p>
      <p>the problem with copyright in this computer day-and-age<br>
      is that real people have to waste their real time and energy<br>
      being concerned about penny-ante crap questions like this.</p>
      <p>(i originally wanted to say “mickey-mouse crap questions”,<br>
      but that would’ve been a freudian slip of major proportions.)</p>
      <p>at any rate, i remind people that i don’t care what inka does;<br>
      i was pointing out the double-standard here on copyright...</p>
      <p>-bowerbird</p>
