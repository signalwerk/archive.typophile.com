    html: <p>I've got P22/LTC Deepdene, which is more accurate and extremely beautiful. But it isn't much good for text, being terribly light, with long descenders, and if I remember rightly (I haven't used it for ages) terrible kerning. The BQ version is nicely dark, well and closely spaced, has shortened descenders and makes a good if adventurous book type. Goudy Kaatskill is close cousin to Deepdene, with the advantage of having been given the once-over by Colin Kahn after Jim Rimmer's initial revival with an excellent Deepdene-based italic. It is a less startling type (it even has a horizontal bar on e), with good weight and spacing, and is very usable. Neither have bold fonts, which is fine by me.</p>
