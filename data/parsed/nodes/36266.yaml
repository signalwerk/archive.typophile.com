    html: <p>Hi Liam. Good call on Deepdene, it’s my favourite of Goudy’s typefaces. Walter Tracy talks briefly about it in his <cite>Letters of Credit</cite>, p. 121–122 (<a href="http://www.typophile.com/books/typedesign-history#000217" rel="nofollow">bibliographic entry</a>), mantaining that Goudy was fascinated by Van Krimpen’s own Lutetia typeface while drawing Deepdene. You might want to look up the similarities and differences between the two. Also of note is the italic which is strangely upright as far as italics go, but it works remarkably well in my opinion. Another later serif typeface with very vertical italics is Eric Gill’s Joanna, another of my favourites.</p>
