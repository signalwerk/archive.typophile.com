    <p>Hi Everyone,</p>
    <p>I am a first year uni student and I am doing a project on Goudy's 'Deepdene'.</p>
    <p>I am looking for the following:<br>
    - Any general comments<br>
    - Similar alternative typefaces<br>
    - Any comparisions you see between 'Deepdene' or similar typefaces<br>
    - Any pros or cons which you would like to point out</p>
    <p>I am looking for industry quotes from users. If you wouldn't mind popping down your role in the industry.</p>
    <p>Also if someone has the typeface, do you think it would be possilbe for you to make a heading and outline the heading, I just need the name 'Deepdene'. Its up to you.</p>
    <p>URL of 'Deepdene' – <a href="http://www.bertholdtypes.com/gifs/type_lib/pkg/90147000.gif" title="http://www.bertholdtypes.com/gifs/type_lib/pkg/90147000.gif">http://www.bertholdtypes.com/gifs/type_lib/pkg/90147000.gif</a></p>
    <p>Thanks for all your help</p>
    <p>Liam</p>
