  html: |-
    <p>With over five years of design and development, Desire is a pursuit of epic proportions and ready to make a statement by adding elegance and unique flair to your next design project. Cultivated by his passion of letters, Charles Borges de Oliveira has developed one of his largest typefaces to date. Featuring 644 alternate letters, 98 ligatures, 8 flourishes and 6 catchwords.<br>
    Now on sale at <a href="http://www.myfonts.com/fonts/charlesborges/desire/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Myfonts</a>, <a href="http://www.fontbros.com/families/desire/styles/regular" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Fontbros</a>, <a href="http://www.youworkforthem.com/font/T4668/desire" title="Click to visit an external URL." class="freelink freelink-external freelink-external">YouWorkForThem</a><br>
    Coming soon to other fine font retailers.</p>
