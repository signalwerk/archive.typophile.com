    <p>Hi,</p>
    <p>I made this image as a signature for a message board, but I need to redo it because it turns out I was mistaken about having permission to use the background.  Unfortunately I can’t remember what font I used for my name (“Michelle”).  I know I got it from some free font site, or else it was already installed on my computer.  (I am using a new computer now, of course.  Sigh.)  It can’t be too uncommon a font since I am usually too lazy to look very long for a font I like.</p>
    <p>Oh, the drop shadow is not part of the font; I added that.  I really appreciate any help you can give me!</p>
    <p></p><div class="imageWrap"><img src="/files/cm_aisling_5987.png"></div><p></p>
