      <p>Hi Michelle,<br>
      that’s Forelle, a script face by Erich Mollowitz from 1936. There’s a <a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/f/forelle.htm">commercial version by Mecanorma</a> and a <a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/f/forelle.htm">free one by Dieter Steffmann</a>.<br>
      F</p>
