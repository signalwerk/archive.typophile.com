    date_raw: 14 Dec 2003 — 12:52pm
    votes: null
    html: <p>In Germany, I mostly use the mobile net the cell-phone-user is in, as it is an added information (calls from d1 to d2 are more expensive than d2 to d2 and so on) <br>So I often end up using D1 or D2 as abbreviation. It doesn't work so wel with the E-net, as it is confusing (although no one would thing of a phone number as an eMail-address :-))</p>
