    date_raw: 14 Dec 2003 — 12:33pm
    votes: null
    html: <p>Judging by the majority of the business cards I currently have littering my desk and note board, I think 'cell' or 'c' would be the most commonly accepted abbreviations. But I have also seen 'remote', 'rem', 'mobile', 'mob', 'm', and 'clr' used.</p>
