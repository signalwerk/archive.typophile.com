      <p>Thanks Bart. In ’Dutch Type’ it also says that a digital version of ’New Alphabet’ (in three weights) was released in 1997 by The Foundry. So a more recent digital version could have been possible, but I agree about the numbers. If this was done in the late 80’s it might have been done using film type, and who knows how many Garamonds were in use then, or whether they were ever digitized.</p>
      <p>- Mike Yanega</p>
