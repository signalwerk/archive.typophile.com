    <p><strong>Volcano Type</strong></p>
    <p>Volcano Type is a small, independant type foundry in Karlsruhe, Germany. The foundry is run by the graphic design studio <a href="/wiki/FINEST%20MAGMA" class="freelinking" rel="nofollow">FINEST MAGMA</a>, who also organize the German-language type blog, <a href="/wiki/Slanted" class="freelinking" rel="nofollow">Slanted</a>.</p>
    <p><a href="http://www.volcano-type.de" title="http://www.volcano-type.de">http://www.volcano-type.de</a></p>
