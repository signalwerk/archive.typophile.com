  html: |-
    <p>I’m looking to identify the two major fonts used for Sony’s PS3 game Eye of Judgment, the first being the logo and the second being the print used for their website. <a href="https://web.archive.org/web/20080830035816/http://www.eyeofjudgment.com/" title="http://www.eyeofjudgment.com">http://www.eyeofjudgment.com</a></p>
    <p>the font used on their website is common, but haven’t been able to track down the exact font.</p>
    <p>see my most recent post for the third font that I could use some help identifying.</p>
