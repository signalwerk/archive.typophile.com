      <p>James, your idea has potential and variations are already being trialed by commercial type foundries.</p>
      <p>Rebecca Alaccari, proprietor of Canada Type, recently introduced a type of dual licensing scheme wherein fonts can be purchased (licensed) for commercial use at full catalog price, and purchased (licensed) for personal or non-profit use "at considerable discount prices".</p>
      <p>Canada Type's personal use license can be viewed here: <a href="http://www.myfonts.com/viewlicense?id=598" title="http://www.myfonts.com/viewlicense?id=598">http://www.myfonts.com/viewlicense?id=598</a></p>
      <p>In 2003 I introduced a dual licensing scheme for selected fonts in the <a href="http://www.myfonts.com/browse/foundry/sentinel/" rel="nofollow">Sentinel Type catalog</a>. Selected fonts are downloadable (ie: can be licensed) from Myfonts.com for personal or non-profit use at zero cost, and the same fonts can be purchased (licensed) for commercial use at their full catalog prices. I had students and non-profit users in mind, figuring that those types of users shouldn't have to pay anything. I know many who download the zero cost license versions are students because some have written to me to confirm my definition of non-profit use(s), citing student projects, resumes and the like.</p>
      <p>I'm constantly surprised at the number of commercial use licenses I sell for Midnight Kernboy, DeLouisville, Maus and Ganymede 3D, all of which commercial users can download for free and use on paying jobs. Many such users no doubt do so in contravention of the EULA they agree to online when obtaining those fonts. That part doesn't bother me.  It's a calculated risk I took when making the commitment to a "try before you buy" policy four years ago. I expect it to happen.</p>
      <p>What impresses me is how many honest users there are. When the font in question is a personal interpretation of the Latin alphabet that flies in the face of established convention---Midnight Kernboy---or a unicase Tuscan that takes serious risks with integration and asks the user to flirt with those risks too---DeLouisville---it seems only fair to offer such faces at no charge to allow potential customers to assess their merits first, in their own time, without obligation, before paying the usual fee for commercial use.</p>
      <p>Dan, the benefits include more than brand recognition and good will with future purchasers. The main point is students and non-profit users get to use decent fonts for low fees or zero outlay. It's about trusting those users and having faith in people.</p>
      <p>Nathan, there is no way of preventing commercial users from taking advantage of such a scheme. The revenue distributor Myfonts.com and I make from selling commercial licenses for some of my fonts covers the cost of making the same faces available for free for those who can't afford to pay for them. Abuse of the system does not cost me or Myfonts anything. We're only talking about potential revenue not gained. Nothing is lost per se, and enough commercial users are honest enough to make the whole thing whorthwhile.</p>
      <p><em>Why encourage discrimination against poor students? Why should only rich students deserve higher marks?</em></p>
      <p>That doesn't neccessarily follow. Cheap or free fonts of decent quality can be had by affluent and impoverished students alike---if type makers and vendors extent a little faith. If rich students attain higher marks by buying expensive fonts for their work, that is a function of their affluence.</p>
      <p><em>The benefits are minimal. The few extra dollars going into the pockets of corporations does not justify the trouble it causes everyone else.</em></p>
      <p>The benefits are potentially great. So far neither Myfonts or myself have experienced any trouble.</p>
      <p>Cassie, many of the participating foundries at Myfonts.com offer discounts on commercial licenses to students and non-profit users.</p>
      <p><em>...the real value of a font can be much lower to a student than to a professional, but current academic font discounts do not, IMHO, reflect this.</em></p>
      <p>I agree, but determining the value of a font to an academic user involves time-consuming negotiation which no vendor can afford. It works out cheaper and more efficient for everyone if some fonts are offered to academic users at no charge.</p>
      <p>Why, then, do I not offer a dual license arrangement for every font in my catalog? That would be commercial suicide, as it would be for other foundries. What I'm suggesting is that other foundries should offer <strong>some</strong> fonts in their commercial catalog, but not all, either very cheap or at zero cost to whoever wants them, to give all potential users an alternative to piracy, with the option to purchase a full commercial use license for those fonts if and when their use warrants it. Fonts so offered need not be unconventional faces like mine, but could be slow-sellers or anything else that looks like the font next door but a little off center. If that prevents those particular fonts from being pirated it's worthwhile, and if it saves other fonts (not dual-licensed) from the same foundries being pirated, even better.</p>
      <p><strong>"It's just amazing how fair people can be"</strong> --- Randy Newman, from his song Simon Smith and the Amazing Dancing Bear.</p>
      <p>j a m e s</p>
