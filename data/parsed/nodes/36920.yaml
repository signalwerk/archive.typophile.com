      <p>The iTunes option is interesting. Linotype has FontExplorer, which is an iTunes clone. Here's the scenario: Distribute a one time use font through FontExplorer, that has to be activated IN FontExplorer. After a set period of time, say two weeks or one month, the font becomes inactive and cannot be used again without paying the full purchase price. Less, of course, the amount you already paid.</p>
      <p>I can see this not only benefiting students, but everyone. Like people who are interested in a font, but need to have a working copy in order to evaluate it.</p>
