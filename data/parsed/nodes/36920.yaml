      <p><cite>And why a teacher would spec anything expensive is beyond me anyways. I would say “no” and tell the teacher to go to hell, but that’s just me.</cite></p>
      <p>Some professors can get really full of themselves at times. For students who rely on financial aid determined by academic success, arguing with such professors is not always an option. And I think that a lot of design professors have become so used to academic font piracy that they just assume students have no qualms about it.</p>
      <p><cite>How is that different than the current method of negotiating with the foundries?</cite></p>
      <p>The difference is that in a single-use system the foundries make so little money that negotiating would be a waste of time. But if such a system were set in place by a large online font vendor, multiple font purchases <em>might</em> pay the cost of the system, especially if larger schools submitted lists of eligible students to save the vendor from checking faxes of IDs and tuition bills. And if the system actually took off, who knows, maybe the money could add up to something for the foundries and designers.</p>
