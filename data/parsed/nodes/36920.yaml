      <p><cite>would be asking for some kind of antitrust smackdown from EU regulators.</cite><br>
      Ah, baloney. EU regulators can't even tell the difference between Times and Helvetica, meaning that the perception of the fontworld is very narrow. Monotype could make the same arguments that Apple makes for their exclusivity. </p>
      <p>But think about it, DRM is only crappy when it either invades your privacy or limits your ability to use the end software in a reasonable way. Apple's DRM prevents you from using an .mp3 on unauthorized devices, which sucks. But when you purchase a font license, the EULA's clearly state that you shouldn't be using the font on another system anyway.</p>
      <p>Plus, Apple's new tiered system could work equally well, as long as the DRM doesn't get in the way of actually using the font.</p>
