      <p>I don't think policing is entirely necessary.  Obviously, for (most) fonts, once you have the file, it's an honour system that you're using it as licensed.  I know my university didn't have a font library for us to use, and I could have greatly benefited from using different faces from some projects, but ended up reverted to something more standard for lack of funds.  I barely had money for the main design software after all the rest of my art supplies, and even a twenty dollar typeface would have broken my account.</p>
      <p>I remember back when Apple first announced the multiuser license (the "family pack") and people wondered if anyone would ever buy it, and sure enough quite a few people have partly because of the "I'm doing the right thing" feeling, but also a lot of people don't know the difference.  Offering a font very cheaply to students for one-time uses would introduce them to the idea of paying for fonts while still allowing them to do lots of experimenting with different ones.  What's the right price point?  I don't know, but $2-5 would be a pretty good spot.</p>
      <p>You could do a pretty accurate system to verify people are education simply by requiring an e-mail address from a school.  It'd still be possible to cheat the system, but let's face it, people already do, and if they'll pay 5 bucks to get a font as opposed to downloading it for free illicitely, I'd prefer the former.  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
