      <p>I'm not convinced massive discounts would work for typefaces, especially for students. The very first typeface I purchased, (oh, the thrill!) I have never used. Big lesson there—get to know more about the type I am using &amp; what is available before splashing cash on what I thought would be useful. </p>
      <p>The university that I teach at has an excellent, albeit smallish collection of typefaces. The students have never been introduced properly to the good types in the collection, which is hardly their fault. I understand that because these types are default/standard that they must seem dull to the students, it was certainly how I thought once. But I have made many a recommendation to students about typefaces that are right there for them to use, and I always see the "aha!" look on their face. </p>
      <p>I guess what I am trying to say is that student typographers really need to get their "eye in" by using what is available, explore the provided typefaces, become critically aware of what is good &amp; bad about a typeface before spending hard cash on new type. </p>
      <p>—K</p>
