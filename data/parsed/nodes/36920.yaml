      <p>The number of typefaces worth $5 for a single-time use in an academic assignment that has little to no commercial worth outside of being a portfolio piece to me is quite numerous indeed.  99¢ for a song on iTunes is a decent price.  But if you were only allowed to listen to it once, I doubt many people would pay more than a few pennies for it.</p>
      <p>A perpetual license of course would be worth more, and a perpetual commercial-use license at the even higher standard prices.  But I think with a low-cost single-use non-commercial-license, students might could start getting used to buying fonts, which I think would ultimately be any of us's goal.</p>
