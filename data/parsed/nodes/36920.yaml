      <p><cite>Education is a progression, and forcing students to use certain faces early in their education will expose them to more type. And making the student use a wrong face might help teach the student why such a face is wrong, and that can result in major learning</cite></p>
      <p>I know this one well.  In my colour theory class, we had to choose our ten favourite colours out of thousands upon thousands of colour chips.  Then we arranged them to be aesthetically pleasing.  Next step choose our five least favourite, then arrange them to be not so bad, then mix the two groups and rearrange again.  Then write our name on the back of our favourite and least favourite colour, and identify it as such.  Prof took them up, threw out all of the favourites, and handed them back, telling us our next project was to be based around it.    I had a putrid Tennessee orange.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
