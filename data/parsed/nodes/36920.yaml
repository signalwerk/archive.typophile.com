      <p>&gt; Why do teachers gotta suck so bad? Wouldn’t having a student make the decision on which fonts to use be better over the long run?</p>
      <p>While I never have specified a single face for a job, I can understand why a professor might. Education is a progression, and forcing students to use certain faces early in their education will expose them to more type. And making the student use a wrong face might help teach the student why such a face is wrong, and that can result in major learning.</p>
      <p>That said, something like this would only be a first term philosophy, and in later terms, as the students begin to be more comfortable with type, the choice of a proper face would have to be the decision of the student.</p>
      <p>It is a sort of walking before you learn to run thing.</p>
