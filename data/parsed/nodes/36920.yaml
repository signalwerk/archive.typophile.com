      <p>Dan, I have had three design teachers pass out CDs if fonts in class, two of whom made it quite clear that those fonts were to be used for the classes. And I have witnessed students be given explicit instruction in exactly what font should replace a font already being used in a piece.</p>
      <p><cite>What’s to prevent a student from using it more than the alloted amount?</cite><br>
      <cite>How would this system be policed?</cite></p>
      <p>I don’t think that the system can be policed, it would have to be an honor system. The idea behind it is that students who don’t necessarily want to pirate a font would license the font. Those who would abuse the system would likely just pirate the font, in most cases doing so would require less time and effort than actually buying the font.</p>
      <p><cite>Typography choices are often the springboard which helps attain higher marks.</cite></p>
      <p>Yes, they are. But a professional designer is able to use a font repeatedly to earn money, whereas a student may only be in a position to use a font once, and if he is not a freelance designer and will not become one in the future, will not be making <em>any</em> money from said font. For this reason the real value of a font can be much lower to a student than to a professional, but current academic font discounts do not, IMHO, reflect this.</p>
      <p><cite>It suddenly sounds like I may or may not be helping answer your college essay.</cite></p>
      <p>Oh please. None of my professors would accept writing on such a tedious subject, and I would not even consider boring them with it.</p>
