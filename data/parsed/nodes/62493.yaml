    <p>what is your favourite latin serif<br>
    typeface for extensive books or text<br>
    and small sizes?</p>
    <p>please tell more about the typeface like<br>
    designer information, foundry, history,<br>
    shape analysis and also the reason why<br>
    you like it!</p>
    <p>thanks sanyo</p>
    <p>ps: you can also post up to three typefaces,<br>
    if you have to.</p>
