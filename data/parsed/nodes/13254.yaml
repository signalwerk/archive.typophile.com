    <p>My budget is around $600. Would like 13x19, reasonable accurate color and crisp text. I just started looking and I have found the Epson Stylus Photo R1800. I am a freelance designer working from home so money is tight, but need a solid printer for client reviews.<br>
    Any responses would be greatly appreciated!</p>
    <p>Tommy</p>
