    html: |-
      <p>I’ve gone through a number of cheap inkjets and haven’t found anything that comes close to epson for final prints or proofs. Their ink quality and the colors are just way better than anything else I’ve found. Like any inkjet, they have a number of issues to be aware of. </p>
      <p>The most important problem is that the nozzles can clog and render the printer useless. This is best addressed by turning the printer off when it’s not being used. </p>
      <p>The other, more immediate and chronic issue is the cost of the black ink. Personally, I have a little $60 Canon that I use for utility printing and save the Epson for when it counts. </p>
      <p>Good luck.</p>
