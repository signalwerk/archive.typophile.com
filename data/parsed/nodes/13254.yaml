      <p>I’ve had to go to using PowerRip third party RIP for my 3000. I’ve always found the Epson RIP fussy and a paper eater.</p>
      <p>The 3000 needs too much attention with the print heads. It does, however, run banner paper which is fantastic. I’m cheap so I’ll keep running it until it dies.</p>
