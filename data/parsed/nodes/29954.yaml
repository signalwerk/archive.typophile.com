      <p>The fonts are used in Windows XP's UI, so are 'system file protected' - same thing will happen if you try to delete Tahoma. We originally licensed outlines from URW, and licensed the trademark from ITC - the full set of fonts were used for corporate branding, but eventually ended up shipping with Publisher - two styles were shipped with Windows XP (and subsequently Vista).</p>
      <p>Cheers, Si</p>
