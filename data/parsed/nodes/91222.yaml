      <p>Thanks for the kind words. I do indeed spend some time at Typophile every day (have been doing so for the best part of a decade) and am not averse to a little show and tell. I can send you the Modern Suite specimen book, which has an essay on Figgins Sans, with illustrations—contact nick“at”shinntype.com.</p>
      <p>In my estimation of the original 1836 bold caps face by Vincent Figgins, the style had not yet settled into the typical 19th century grotesque mode, i.e. fat and furled curves, but had geometric elements. Therefore I did not give my extrapolation the “funky grotesque” treatment which is the norm in neo-Victorian sans serifs. This also made it a better companion for my revival of the contemporary Scotch Modern, which is packaged with Figgins as the Modern Suite.</p>
      <p><img src="http://f.cl.ly/items/2j3y3I0s0l0w233F290e/NewFigs.png"></p>
      <p>That accounts for the styling. For the lower case letter shapes, generally speaking I made them correspond to the Scotch. So the “a” and “r” are a bit awkward. I suppose I should have made the arm of the “f” similarly wide, but that would have been impractical for a multi-lingual 21st century font.</p>
      <p>The italic is quite strange, but really just a straightforward sansification of the Scotch italic.</p>
    html_clean: |-
      <p>Thanks for the kind words. I do indeed spend some time at Typophile every day (have been doing so for the best part of a decade) and am not averse to a little show and tell. I can send you the Modern Suite specimen book, which has an essay on Figgins Sans, with illustrations—contact nick“at”shinntype.com.</p>
      <p>In my estimation of the original 1836 bold caps face by Vincent Figgins, the style had not yet settled into the typical 19th century grotesque mode, i.e. fat and furled curves, but had geometric elements. Therefore I did not give my extrapolation the “funky grotesque” treatment which is the norm in neo-Victorian sans serifs. This also made it a better companion for my revival of the contemporary Scotch Modern, which is packaged with Figgins as the Modern Suite.</p>
      <p><img src="http://f.cl.ly/items/2j3y3I0s0l0w233F290e/NewFigs.png"></p>
      <p>That accounts for the styling. For the lower case letter shapes, generally speaking I made them correspond to the Scotch. So the “a” and “r” are a bit awkward. I suppose I should have made the arm of the “f” similarly wide, but that would have been impractical for a multi-lingual 21st century font.</p>
      <p>The italic is quite strange, but really just a straightforward sansification of the Scotch italic.</p>
