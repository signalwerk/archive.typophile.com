      <p>Another “unborn” typographic taboo was rag right (or rag left, for that matter).</p>
      <p>Even when the sans started to come into its own, in mixed case, in Modernist layouts, it was justified. See Lissitzky’s <em>The Isms of Art</em>:</p>
      <p><img src="http://f.cl.ly/items/0w0Q1e3y0M171o383215/Izms_4496.jpg"></p>
