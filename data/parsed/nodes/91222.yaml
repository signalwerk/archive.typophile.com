  html: "<p>So In my never ending love for sans serif and my attempt to find the earliest appearances of it  (see my attempt at a 2 line english egyptian here, if you care:  <a href=\"http://typophile.com/node/87773\" title=\"http://typophile.com/node/87773\">http://typophile.com/node/87773</a> ) I stumbled, strangely after quite some time, into Figgins Sans.  What a beautiful thing.  Apparently it was created by some guy named Nick Shinn?  Anybody here ever hear of him.  I'd love to grill him sometime on how he came up with the lower case letters. Hmmmm.... If only...</p>"
