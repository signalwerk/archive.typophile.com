  - id: 194888
    user: 5094
    date: 2007-04-04T10:17:00
    date_raw: 4 Apr 2007 — 10:17am
    votes: null
    html: |-
      <p>Use the contextual alternates. Below is an example with a terminal "f". Note you should use the "period" construction, as in "y.terminal", not a ligature (underline) construction as in "y_end".</p>
      <p>feature calt { # Connection Forms<br>
       # Latin<br>
          sub f' space by f.terminal;<br>
      } calt;</p>
