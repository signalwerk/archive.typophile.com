    date: 2007-04-04T13:48:00
    date_raw: 4 Apr 2007 — 1:48pm
    votes: null
    html: |-
      <p>Note that the 'fina' feature is on by default and in some applications may be impossible to turn off, so you only want to use it if the substitutions should always happen. 'fina' feature support presumes character level analysis by the layout engine, so you don't need any context for it. The layout engine identifies the circumstances in which the substitution should occur and applies the feature.</p>
      <p>If using the 'calt' feature, I second Paul's suggestion to use the ignore syntax or, in VOLT, the EXCEPT syntax:</p>
      <p> f -&gt; f.terminal<br>
       EXCEPT |</p>
