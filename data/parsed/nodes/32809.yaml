    html: |-
      <p><em>There is nothing to “ignore.”</em></p>
      <p>sure there is, what the solution that i've linked to does is replace every letter with the final form <em>unless</em> it is followed by a letter: in these instances, the substitution rule is ignored. i think this is a better solution, because the ending forms are determined by the word boundary and not by the presence or absence of the space character.</p>
