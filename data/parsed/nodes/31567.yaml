    date_raw: 18 Feb 2007 — 9:49pm
    votes: null
    html: <p>Why does the <cite>a</cite> have a circular counter, but not the <cite>e</cite>?</p>
    html_clean: <p>Why does the <cite>a</cite> have a circular counter, but not the <cite>e</cite>?</p>
  - id: 185816
    user: 13605
    date: 2007-02-18T23:02:00
    date_raw: 18 Feb 2007 — 11:02pm
    votes: null
    html: |-
      <p>The counter is rounder/squatter to keep the horizontals equal width with the other letters. The outside of the bowl is equal to the g's and shorter than the xheight.</p>
      <p>The e's counter (including the open counter, ignoring the bar) is equal to the proportions of the c, o, d, b, p and q's counters. Though the p and q might change.</p>
    html_clean: |-
