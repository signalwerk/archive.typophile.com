    html: "<p>&gt;so ITC Garamond is a display face... isn�t it? <br> <br>My point is this: you never know till you try! Why theorize about what would look best when you can easily put a typeface through its paces and see the results? <br> <br>Here's my experience. I would say that both the big- and small- x -height Garamonds can be used for both text and display. <br> <br>However, for text settings, each will have to be used in a different way. Typically, people use Adobe Garamond for a longer line length, and with more leading. So, if you are setting a  novel, Adobe Garamond would be an appropriate text face, well leaded. However, for a retail catalog, ITC Garamond will set text with tighter leading, and shorter line length, for the necessary punch. <br> <br>One used to be able to inspect these kinds of distinctions in type specimens that compared paragraphs of a typeface set in different sizes and leadings. For instance \"The Designer's Guide to Text Type\" (King and Esposito, 1980), which included showings of Garamond #3 and ITC Garamond. <br> <br>As an art director in those days, I would occasionally photocopy the type from this book, trim it with a blade for rag right of the appropriate length, and stick it in my ad layouts to get an idea of what the whole effect would look like -- to get the spec right before sending my marked-up copy to the type house for setting, because I only got one kick at the can. (Well, two if I screwed up badly enough.) <br> <br>WYSIWYG is much better than that, and it's also better than taking advice off the Internet.</p>"
    html_clean: "<p>&gt;so ITC Garamond is a display face... isn�t it? <br> <br>My point is this: you never know till you try! Why theorize about what would look best when you can easily put a typeface through its paces and see the results? <br> <br>Here's my experience. I would say that both the big- and small- x -height Garamonds can be used for both text and display. <br> <br>However, for text settings, each will have to be used in a different way. Typically, people use Adobe Garamond for a longer line length, and with more leading. So, if you are setting a  novel, Adobe Garamond would be an appropriate text face, well leaded. However, for a retail catalog, ITC Garamond will set text with tighter leading, and shorter line length, for the necessary punch. <br> <br>One used to be able to inspect these kinds of distinctions in type specimens that compared paragraphs of a typeface set in different sizes and leadings. For instance \"The Designer's Guide to Text Type\" (King and Esposito, 1980), which included showings of Garamond #3 and ITC Garamond. <br> <br>As an art director in those days, I would occasionally photocopy the type from this book, trim it with a blade for rag right of the appropriate length, and stick it in my ad layouts to get an idea of what the whole effect would look like -- to get the spec right before sending my marked-up copy to the type house for setting, because I only got one kick at the can. (Well, two if I screwed up badly enough.) <br> <br>WYSIWYG is much better than that, and it's also better than taking advice off the Internet.</p>"
