    html: <p>Herb Lubalin did not design many of the ITC faces. The large x-height was dictated as much by graphic design at the time as it was by Lubalin and ITC. <br> <br>Many ITC faces were developed as Display-Text. For use in large size block of text. Specifically for advertising and collateral work. I don't think anyone developing ITC faces in the 70s and 80s had any illusions of being text face designers.</p>
