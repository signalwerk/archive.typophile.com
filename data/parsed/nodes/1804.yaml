    html: <p>It used to be easy to tell the difference when there were different methods for setting text and than there were for display. In fact, you didn't need to know there <i>was</i> a difference. It's just the way it was done and you didn't have any choice when specifying type.  <br> <br>The line started getting blurry with phototypesetting systems and digital type. There was also a trend in the 70s (notably promoted by ITC) to create typefaces that were suitable for both text and display with only one design. <br> <br>Personally, I think that losing the distinction between the two has been generally a bad thing. Many popular typefaces that have gone from metal to phototypesetting to digital have left their display cuts behind. The cuts you see now were generally designed for 12 point and many of them don't look that good large. You used to be able to get the display cut with headline setting phototype machines or even rub down letters. The display cuts have, for the most part, not made it to the digital typesetting world. <br> <br>Typefaces designed in the last 20 years are perhaps a different story. The same machines are used for both text and display and type designers are aware of this and, presumably, take this into account. It's been unusual to see typefaces released with different designs for text and display, but there are exceptions. House Industries has some like this, and I know there are others. <br> <br>I really miss the display cuts of certain classic typefaces like Garamond (ATF), News Gothic, Futura, Bodoni (ATF), even Helvetica. They are simply not availble in digital form and we are left with the clunky text cuts if we want to use them.</p>
