    html: <p>There is no easy formula. And theories and principles will only take you so far.  <br> <br>The best way to understand the difference between the properties of text and display fonts is to examine the differences in a typeface that has both. For instance Slimbach's Adobe Jenson, with its "optical scaling", ITC Bodoni, any one of many serif faces from Font Bureau or Hoefler, or my own Walburn or Worldwide. <br> <br>That would include experiments, varying parameters such as tracking, leading, line-kength, scaling and paper stock as well as font and size, preferably with press tests. <br> <br>You can also study things such as ascender length in some typefaces which have it as a variable (Fournier?), or by comparing similar fonts with different x-heights, e.g. Palatino vs. Aldus; or Adobe Garamond vs. ITC Garamond. <br> <br></p>
    html_clean: <p>There is no easy formula. And theories and principles will only take you so far.  <br> <br>The best way to understand the difference between the properties of text and display fonts is to examine the differences in a typeface that has both. For instance Slimbach's Adobe Jenson, with its "optical scaling", ITC Bodoni, any one of many serif faces from Font Bureau or Hoefler, or my own Walburn or Worldwide. <br> <br>That would include experiments, varying parameters such as tracking, leading, line-kength, scaling and paper stock as well as font and size, preferably with press tests. <br> <br>You can also study things such as ascender length in some typefaces which have it as a variable (Fournier?), or by comparing similar fonts with different x-heights, e.g. Palatino vs. Aldus; or Adobe Garamond vs. ITC Garamond. <br> <br></p>
