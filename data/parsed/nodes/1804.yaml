  html: "<p>assuming there wouldn't be something like the internet as general information source (i know, ain't easy, but try): is there anything to tell whether is font is meant to be a display or a text font?  <br>sure there a some types that are display ones obviously, but some are hard to tell. <br>i know this might be kind of stupid question, but i know that still lots of people use font meant for display as (long-)text font and i can't say for myself that i'm safe of doing this, too <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> thanks: lars</p>"
