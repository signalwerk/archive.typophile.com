    html: <p>Some MM faces have "Optical Scaling" as a design axis. However, there is no absolute correlation between what the "default" instance is for use at a particular type size, and what will work best in a particular setting. <br> <br>While optical scaling can provide a useful starting point, it cannot replace the discerning eye of the typographer -- honed through education and experience, and exercised with a keen awareness of all the job criteria which affect readability (paper stock, ink color, reader age, press quality, etc) -- in deciding which instance of a typeface is best for setting at a particular size. <br> <br>Quite apart from these "objective" typographic criteria, there is the aesthetic effect the typographer is aiming to create. For instance, one may decide to use a 6pt instance of an optically scaled face at 12 pt, with added letterspacing, to create a "naif" tone. <br></p>
