    html: <p>According to to Bruckner (Frederic Goudy (Masters of American Design) Harry N Abrams 1990), it was first printed in 1931 and later in several formats and typefaces. There is an illustration of one version from 1933 printed as a keepsake for the AIGA. It allegedly was Goudy’s favorite broadside.</p>
