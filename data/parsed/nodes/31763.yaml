    <p>Hi all,</p>
    <p>This type appears in the Yeah Right! skate video (quality not fantastic from the screen grab) — lots of variation in the letters, so I'm guessing not a typeface. Any suggestions for something similar? Or indeed if it is a typeface, the one in question?</p>
    <p>As always, thanks for the help!</p>
    <p>Higashi</p>
