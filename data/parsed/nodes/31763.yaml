      <p>I think you're right that it is hand-drawn, but you can get a sort of  similar bouncy connected script with <a href="http://www.myfonts.com/fonts/mvbfonts/mvb-emmascript" rel="nofollow">Emmascript Bold</a>, maybe with some horizontal stretching added.</p>
      <p>- Mike Yanega</p>
