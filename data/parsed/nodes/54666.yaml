    html: |-
      <p>For me this has a lot of problems. </p>
      <p>First, I don't see a coherent design. The DRP don't seem to have a reason to be flat on top and round on the side when the others are sort of the other way around. I say sort of because the verticals on the DRP are rounded inside and out, whereas the horizontals on the OSCG are round outside and straight inside. And the B is neither here nor there. </p>
      <p>Second, the weights of the horizontal strokes on the OSCG seem to be clunky compared to the verticals that are straight on both sides. I don't know if this can be resolved by keeping the shapes and changing the weights, because the strokes are so different. </p>
      <p>Maybe you can make it work if you take the idea of the DRP and make the others consistent with it. </p>
      <p>But in any case, I think this design would greatly benefit from being reworked to be more coherent.</p>
    html_clean: |-
      <p>For me this has a lot of problems. </p>
      <p>First, I don't see a coherent design. The DRP don't seem to have a reason to be flat on top and round on the side when the others are sort of the other way around. I say sort of because the verticals on the DRP are rounded inside and out, whereas the horizontals on the OSCG are round outside and straight inside. And the B is neither here nor there. </p>
      <p>Second, the weights of the horizontal strokes on the OSCG seem to be clunky compared to the verticals that are straight on both sides. I don't know if this can be resolved by keeping the shapes and changing the weights, because the strokes are so different. </p>
      <p>Maybe you can make it work if you take the idea of the DRP and make the others consistent with it. </p>
      <p>But in any case, I think this design would greatly benefit from being reworked to be more coherent.</p>
