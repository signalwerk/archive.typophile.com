      <p><cite>You won’t name this face “NS Gothic”, will you?!</cite></p>
      <p>No, that’s just what I’m calling it until I finish it. The original painted letters read “NO SMOKING BY ORDER OF DC FIRE MARSHALL”, so I started calling it “No Smoking” and then shortened it.</p>
      <p><cite>I think it’s done.</cite></p>
      <p>Thanks for the advice, Ray. You’ve really nailed what I’m working toward; a deliberately imperfect design, and sometimes it’s hard to let go and not fight for the total normalization of features that often comes with digital type design. </p>
      <p><cite>James, what is the ’RoundingUFO demo’ you mentioned?</cite></p>
      <p>RoundingUFO is an incredible tool that was designed to create to facilitate the design of Unit Rounded. It can round corners, bevel corners, or add inktraps to an entire font. And it’s only €100. I haven’t bought the full-version yet, but I’m already planning a design that will utilize it. <a href="http://roundingufo.typemytype.com/" title="http://roundingufo.typemytype.com/">http://roundingufo.typemytype.com/</a> </p>
      <p><cite>maybe a superthin/hairline would work?</cite></p>
      <p>This is as light as the font can go. If it gets any lighter the relationship between the corners and curves in letters like O goes from being a pleasant quirk to really distracting. I can fix it by curving the interior, but that loses the one feature that really justifies the font (at least in my mind.).</p>
