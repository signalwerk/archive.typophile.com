      <p><cite>Well, now that you have seen Clicker will you re-think your NS Gothic?</cite></p>
      <p>No, because there are also similarities to the majuscules of Eurostile, City, Agency, Univers, Franklin Gothic, Museo and other fonts that I referenced when working on this one. As for United, what, nobody else ever gets to publish an all caps face in multiple weights just because someone else did? Should everybody stop drawing multi-weight sans families because of Univers? Should the development of serif families have stopped in the 1930s when ATF and Linotype were done expanding Cheltenham?</p>
      <p>When I said this was an original I design, I meant that I sat down and designed all the characters myself without basing the design on an existing face. I even worked without a reference photo of the painted lettering that gave me the idea. And I think that is original. No it isn’t a paradigm shift or some unprecedented idea like Frutiger was, but I’m not claiming it is.</p>
