    html: <p>I think it loses something with the rounding. The appeal of this style is that it has a very strong, masculine presence, especially in the heavier weights. That said, I think this still needs refinement. To me, there appears to be a lot of inconsistency where curves, angles, arcs and straight lines are used both within individual forms (spline of the S, 2) and throughout (compare R and B). In particular, the bowls with rectangular interiors look "off" when compared to D, P &amp; R. I'm wondering if more of the curves should be mirrored in the interior as with these.</p>
