    html: |-
      <p>I really like it - and there's a clunkiness that isn't ... Well, as digital as Clicker comes across. And that's sooo wonderful to see. </p>
      <p>Often, using digital tools tend to over digitize a typeface, and I think what you're doing is on the right track. It screams 19th Century signage, I'd hate if you cleaned up that aspect too much.</p>
      <p>Little tweaks that are jumping out at me (and I know everyone sees things differently):</p>
      <p>The balance on the R seems off. I know the leg is deliberately sticking out on the right, but consider playing with it a bit more. It's not quite there yet.</p>
      <p>Same thing going on with the B, K and the E. They visually look right hand side top heavy.</p>
      <p>The overshoot of the S and Q are cool, but I'm wondering if they're too much. If there's a happy medium between too much and not enough.</p>
      <p>The A seems just a tad light compared to the other letters. Same thing with the I, T and W.</p>
      <p>I can't tell if the X is off at this size. But an X is a BITCH to draw and get to work.</p>
      <p>I actually like light weights a lot - and I sort of think the ultra ultra bolds have become a trend right now, that after it shakes out - people are going to be craving lights. Would love to see a thin version, actually.</p>
      <p>But what do I know, I just released an ultra bold! :)</p>
      <p>s</p>
