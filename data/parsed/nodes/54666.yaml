    html: |-
      <p>Back to the font design...</p>
      <p><em>• I’m not sure that 100 really represents a good starting point. Should this face start at a heavier weight?</em></p>
      <p>Maybe so - at the lightest weight the change in weight that happens on the strokes with a curved outside contour and a straight counter (e.g.. top/bottom of the round letters) is a little distracting, though perhaps with a touch less weight and a touch less overshoot they might work. But the blockiness really shows well in the thicker cuts.</p>
      <p><em>• I am especially interested in knowing what people think of the figures and the letter B</em></p>
      <p>The figures, again, work better as the weight gets heavier, in general. If you didn't already, I might try reversing the straights/curves on the bowls of 3 and 5 to see how that looks (so the curve is on the lower side and the bottom is flat, compare P). A 2 that looks more like a backwards S might be worth trying, too. My eye kind of wants an upper serif on 3 (compare 2 or C) to fill in that counter space (same on 7 would be a possibility).</p>
      <p>4's diagonal looks slight to me throughout. I like 6 and 9 in the heavy weights a lot.</p>
      <p>B seems out of character - that notch seems like it's from another font (true of &amp; too), and I expect the counters to have a curved side like PR. I'd look for another solution. </p>
      <p>B also seems very close to 8, and D to O, but I can see the argument that in a display face like this context will usually sort out those confusions.</p>
      <p>§ is a nice solution; £ needs work.</p>
      <p>Re: lowercase, I can see the blockiness of this arguing for a caps-only font. But I can also see the quasi-hexagonal foundation of it fitting lowercase letterforms well (think of fraktur minuscules).</p>
