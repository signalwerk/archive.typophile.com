      <p>New Guy - we learn by "failing". Every design you make is likely to be something you later regret in some way or even completely simply because you learn more and have better insight. Without pretending to judge James' design in that this context I do think it is worth asking if your design adds something or is just a "me too" design. But not necessarily too early in the process. You have to have room to see where something ends up going. Let it run a little.</p>
      <p>James - my take is that optically speaking if the curved forms begin their curves closer to the interior of the letters they will "jump about" less. Some of that jumpiness it their charm really so you would have to make a choice. But if you feel it's too much that might be one way to turn down the effect.</p>
      <p>What about letting the bottom bowl of the B be larger? I think a boxier top to the A will integrate with the others better. V too. Wider forms for split letters like s B R etc might work better too. Other letters too. If C is reference ( just for the sake of arguement ) Look at the K It might be the same width or wider but it feels narrower. So I would expand it's width a little.</p>
      <p>I don't know if this stuff will work but it might be worth a go.</p>
