    html: |-
      <p>James,<br>
      There is a major struggle that comes with bolder weights of low contrast sans serifs. Take a look at your first line and the word "INVISIBLE" and you will see Shilow, The Marne, and Normandy's blood-stained battlefields.  compare the N, B, S, V, E, &amp; L. There is precious little room to accomodate the color problems with the stroke weight.<br>
      The N is too wide to feel at home with the rest but narrowing it brings the typical angle impingement of the diagonal. You will need some creative trickery to make a family resemblance out of that combination. Compare the crotch of the V with the N and see how they need to relate more. You solved the V by tapering the diagonals but this fights the monoline feel of the rest. The S and B are quite bolder than the rest and the horizontals on the E make for a tough sell next to the B perhaps the E then is too wide. I have done battle in this genre several times but still can't tell you an easy fix. I can only say that you have to cheat on stroke widths and sidebearings to get a happy marriage going.<br>
      Keep at it, you may or may not find a good solution but whatever happens, you will certainly learn a great deal about type design in the process.</p>
      <p>ChrisL</p>
