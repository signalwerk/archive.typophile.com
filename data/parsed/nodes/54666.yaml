    html: |-
      <p>Great to see this back online!<br>
      Some comments (please have lots of salt ready):</p>
      <p>I very much like the basic idea and the consistent way you've thought it through. This has a bit of a Constructivist feel (or maybe I'm imagining things :-) ). I can see it working very well on posters and flyers, or maybe magazine headlines.</p>
      <p>I agree this gets really strong the bolder it gets, but I can see the usefulness of lighter ones as well. I wouldn't chuck out that 100 just yet.</p>
      <p>The glyphs with the curved tops &amp; bottoms are startling me slightly as well. Do they look tall? The "C" definitely seems larger than the "D". Maybe those could do with a bit less overshoot?</p>
      <p>You asked about the "B", and in fact it was the first thing that caught my eye. I was wondering why it didn't have the curves that "S" has. I see you did the same thing in the "8" and the ampersands, but I agree with Craig that it looks a bit like it'd belong to another font. </p>
      <p>Speaking of curves &amp; angles, I was also wondering about the notch on the right side of the "3" – that looks *extremely* angular compared to say the "6" and "2".<br>
      On the other hand, I'm wondering if the curve on the bottom of the "2" may be too soft.</p>
      <p>The "J" looks a bit clunky.</p>
      <p>I love the "K"!</p>
      <p>Is the "M" a bit too heavy? </p>
      <p>The tail of the "Q" looks a bit like it's embarrassed to be there :-) (though less so in the bolder weights). It could be bolder in my eyes – not bolder as in heavier, but as in, more daring. Also, did you try a (more) horizontal terminal on that?</p>
      <p>The "W" looks a bit uncomfortable in the heaviest weight. The bottom looks quite tapered, but the apex seems very dark. Can you still make it wider or would that be too much?</p>
      <p>I think the second ampersand fits better with the font – the first one looks a bit forced to me, and produces that awkward little corner on the inside.<br>
      How about making the top of the second ampersand curved?</p>
      <p>You might try an Euro sign with just one crossbar. That's not standard / intended, but I believe it can read quite well, and would let you keep a bold weight on the crossbar. (I wouldn't know if that works for the Yen, too, though.)</p>
      <p>Thanks for sharing this, James. I'm looking forward to seeing it progress. It does look yummy. :-)</p>
