  html: |-
    <p>Hey all!</p>
    <p>I'm creating a logotype for a band and in the stage of looking for type references. The band is a sort of sexy, female fronted, classic rock with an edge sort of sound and look. Equal parts Pat Benatar, Metallica, and early The Who.</p>
    <p>So I've found this typeface over at My Fonts and I feel like this is a good starting place for something that could be customized by hand to give it more of that sexiness and edge, while remaining classic and sophisticated:<br>
    <a href="http://www.myfonts.com/fonts/ania-a/lullaby/" title="http://www.myfonts.com/fonts/ania-a/lullaby/">http://www.myfonts.com/fonts/ania-a/lullaby/</a></p>
    <p>I'm hoping you guys can help me find more sources of inspiration for the direction I'm trying to go.</p>
    <p>Thanks!</p>
