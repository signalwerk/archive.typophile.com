    html: |-
      <p>Try inserting…</p>
      <p><code>subtable;</code></p>
      <p>…into the compiled kerning feature code, occasionally.</p>
      <p>If the number of kerns gets too long in this table, they don’t all work, and the A_V is where it breaks down.<br>
      At least, that’s what I recall from a similar issue I’ve come across in the past.</p>
