      <p>Thanks, Nick. The problem isn't with any particular set or class, it's all classes, in all cases now. The _V class was just a test example where the class had a set of five, for a total of five pairs in the entire test font, and it still failed.</p>
      <p>Flattening out isn't what I'm after as I cannot check any class kerning for accuracy for diacritics or like-style glyphs—which is the point of class kerning. My final projects have been successful with 50,000+ pairs, no errors; now that effort is not working.</p>
