    date: 2011-01-27T11:52:00
    votes: null
    html: |-
      <p>Ah, thanks penn.  This is my first ever attempt at creating a typeface, so I'm still making all the rookie mistakes.  Is there any easier way to regulate the stroke widths? Or do you just have to keep on manually adjusting it until it's correct?</p>
      <p>Thanks for the input!</p>
  - id: 449402
    user_id: 34359
    user_name: penn
    user_path: null
    date_raw: 27 Jan 2011 — 4:17pm
    date: 2011-01-27T16:17:00
    votes: null
    html: <p>Generally speaking vertical strokes are going to look heavier than horizontals. Once you understand that principle, you can then anticipate you'll have to make diagonals and horizontals a smidge thicker to compensate for that optical illusion. There's no easier way than by doing and gaining the experience.</p>
