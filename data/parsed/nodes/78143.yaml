    date: 2011-01-27T09:31:00
    votes: null
    html: <p>Your vertical strokes in general appear to be too thick (compared to horizontals and diagonals), and still somewhat inconsistent. Compare the stem of the capital 'I' to the lowercase 'i', compare the stem of the 'K' to its diagonals, compare the vertical strokes of the 'M' to its diagonals, etc.</p>
