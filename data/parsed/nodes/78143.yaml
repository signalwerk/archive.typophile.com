    <p>My new project, a compact, solidly constructed realist sans serif that draws its influences from Germany.  </p>
    <p><img src="/sites/default/files/old-images/Screen_shot_2011-02-20_at_12_5574.png"><br><img src="/sites/default/files/old-images/Screen_shot_2011-02-20_at_12-1_5146.png"></p>
    <p>It's only got one weight right now (hopefully over time I'll make this a large font family with 6 or 7 weights).  I'd love some help getting the rhythm and consistency just right.  I can spend hours just focused on one glyph, so it's hard to remember sometimes how crucial rhythm, weight and color are as well.  </p>
    <p>I just built it from scratch in 48 hours, but any input would be much appreciated!</p>
    <p>Cheers,<br>
    TB</p>
