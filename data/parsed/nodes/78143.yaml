    html: |-
      <p>First of all, let me start of by saying this: I said that it's a good start because I have seen your progress here on typophile. It still needs A LOT of changes and it'll probably look a whole lot different when you're done. You have to realise that there's a good chance that you'll be working on this for a year, or even longer, before you reach a decent quality. However, that's where we all start, so don't stop working on it! I'm no profesional myself, so take it with a grain of salt.</p>
      <p>Instead of telling you what looks 'wrong' to me for each glyph, I will just give you some basic advise, as I think that's a much better way learn it. All advise is based on my personal experience. In a later stadium I might come back here and give you some more specific critique.</p>
      <p>— Keep it simple. There are lots of unnecessary bends and twists in it.<br>
      — Trust your eye, not maths. It's the only way to get a better trained eye. This doesn't mean you should stop measuring. I see quite a lot of inconsistencies in stroke thickness. Once everything is mathematically correct (all horizontals same thickness/positioning + all verticals same thickness) you should use your eyes to make it visually correct.<br>
      — Focus on the lowercase for now. They're easier to work out because you use and see them more often around you.<br>
      — Try out every possible change that you see in comparable fonts or just comes into your mind, before dismissing it.<br>
      — Look at existing fonts with similar characteristics and don't be too afraid of getting a similar design. Officina, Din, Meta, etc.<br>
      — It's quite hard to focus on every aspect of the typeface at the same time, so I suggest this order. You might want to change it, but this is how I did it.</p>
      <p>1. Basic shape of letters<br>
      2. Width of letters<br>
      3. Stroke thickness<br>
      4. specific letter combinations</p>
      <p>Good luck!</p>
