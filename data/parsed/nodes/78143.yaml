      <p>Looking better and better.</p>
      <p>Still some weight inconsistencies — most noticeably in the lowercase 'i'. It seems rather dark when you compare it to the stems of some of the other characters. This is most likely due to the way the bar joins the top of the stem as well as the bottom curve.</p>
      <p>The cap 'J' looks heavy as well. I think it's mostly how far the top bar sticks out along with its bluntness (it's not tapered like the ones on lowercase 'i' and 'j').</p>
      <p>Your cap 'T' also looks too high. It's clearly higher than the cap 'R' that it's next to in the PDF.</p>
      <p>Oh and by the way, my earlier post stating: <cite>Generally speaking vertical strokes are going to look heavier than horizontals.</cite> — dead wrong. It's actually the opposite . . . brain was not functioning properly :)</p>
