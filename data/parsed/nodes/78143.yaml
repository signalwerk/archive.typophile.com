    html: <p>I'm not saying it's TOO condensed. It's just condensed. I think optimizing text for web use requires a lot experience and knowledge, so I think it would be best to focus on print use. The condensedness is simply the result of designing the glyphs quite narrow. The spacing is also a bit tight though. Compare uppercase and lowercase glyphs to each other and try to make all stroke endings look like they have the same thickness. The bottom ending of c and C looks too thick for example.</p>
