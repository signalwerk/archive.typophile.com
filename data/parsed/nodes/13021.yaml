      <p>I hate to subject that fairly fragile yet bulky specimen book to the back breaking scanner (the binding is a bit iffy the way it is, and it was an expensive purchase) but I’ll give it a try. I’ve got a blog where I will put it up (temporarily) in the next day or so. I don’t recall that there are full character sets though.</p>
      <p><a href="http://TypeRoad.blogspot.com" title="http://TypeRoad.blogspot.com">http://TypeRoad.blogspot.com</a></p>
      <p>I also noticed, belatedly, that the Romanians had caned the lowercase f. A bit odd. It certainly funks it up a bit. Wonder if that was just a nationalistic thing.</p>
      <p>Gerald</p>
