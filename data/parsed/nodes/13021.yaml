    html: |-
      <p>I have an old type specimen catalog of this period from the Nebiolo foundry, Torino. This is a Romanian knockoff of their Radio series which was available in chiara, corsiva, corsiva nera, nera, litografica styles. This looks quite like Radio Nera (black) to me. Hard to forget that lowercase t. The chiara and corsiva companion are quite nice. The Romanian seems to differ only in that the bowls of the uppercase are slightly condensed and thus range a bit higher throughout.</p>
      <p>Gerald Lange</p>
    html_clean: |-
