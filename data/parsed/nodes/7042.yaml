    html: <p> Eyesaw became Fontomas (fontomas.com). Just recently, Fontomas (fontomas.com) offered a free font every week but if you didn't go, you missed the free fonts. No archives to download. They have collected 52 fonts and are going to be offering a compact disc for sale soon. <br> <br>they have an archive of eyesaw @ <br>www.antidot.de/eyesaw/ <br> <br>bjh <br>fontomas p.r. dept. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> </p>
