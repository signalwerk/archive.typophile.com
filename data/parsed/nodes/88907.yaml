    <p>I was wondering how to make text like the one above. I am looking to make classic curved text for t-shirts. I prefer cheap or free, but am willing to spend up to $100 for a program to do so.</p>
    <p>Thank you for any help.</p>
    <p>Also looking for ways to make the text distressed, like an old faded T-shirt.</p>
    <p>Thanks!!</p>
