    date: 2004-05-22T21:50:00
    votes: null
    html: "<p>I got tipoGrafica #60 today. Wow. Besides even-better-than-usual articles, much of the issue involves a full-on, comprehensive treatment of the South American font scene, with a huge list of designs, dozens of them revealed in detail, full-color specimens, the works. And what's really great for me is seeing so many fonts that have grown here in the Typophile crit section - a very special feeling, not replicated anywhere before that I know of. <br> <br>At US$12 for the issue, if you like fonts, you have to buy this - it's really that simple. <br> <br>hhp <br></p>"
