    date: 2005-12-16T08:36:00
    votes: null
    html: |-
      <p>Los números están un poco mas pesados que los caracteres de caja baja y tienden a destacar levemente, me parece que su peso es similar al de las altas.</p>
      <p>Me parece también que la fuente negra funcionaría mejor con un poco mas de contraste en el grosor de los trazos, de hecho me parece que la fuente redonda tiene más contraste. Creo que el tener mayor contraste les permitirá replicar mejor la modulación tan original que manejaron en la fuente redonda.</p>
      <p>Creo que eso ya lo mencionó Randy, al igual que el asunto de la tilde de la eñe que parece estar muy pesada tanto en la itálica como en la redonda.</p>
      <p>Me encantaron la Q alternativa, el calderón y el signo se sección.</p>
      <p>Héctor</p>
