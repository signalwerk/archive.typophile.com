    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BFSYlogoJG580px_3699.png"></div><p></p>
    <p>CAN BUYING A FONT HELP SAVE SOMEONE'S LIFE? – YES IT CAN!</p>
    <p>#BUYFONTSSAVELIVES will sell typefaces to raise money for Cancer Research UK and Macmillan Cancer Support. The brainchild of Haymarket Creative Director Paul Harpin, all proceeds are going directly to these two great charities. </p>
    <p>The fund-raising project was inspired by Harpin’s niece Laura, who sadly died aged just 26. Paul created a new typeface family to sell in her memory. Other type designers and experts are kindly joining in to help raise funds.</p>
    <p>The fonts are available to buy and download from <a href="http://www.typespec.co.uk/buyfontssavelives" title="www.typespec.co.uk/buyfontssavelives">www.typespec.co.uk/buyfontssavelives</a> with the initial releases including the following:</p>
    <p>LAURA<br>
    A new typeface family in four styles – Plain, Shaded, Ribbon, Stencil – twelve weights plus italics in each style. Designed by PAUL HARPIN assisted by PAUL HICKSON. “This is my first ever typeface,” says Harpin, “and I now know how hard type designers work”.</p>
    <p>HESELTINE<br>
    Kindly donated by LORD HESELTINE. Two styles – Text and Titling. Originally produced as a gift from Haymarket Media Group to Lord Heseltine for his 75th birthday. Designed by PAUL HICKSON and his wife PATRICIA. For Hezza’s 80th we added italics, for Latin plant names.</p>
    <p>MFRED<br>
    Donated and designed by MATT WILLEY (assisted by HENRIK KUBEL at A2 -TYPE) in honour of his father Nick. This much sought after headline font was originally drawn for ELEPHANT magazine, then used in Matt’s PORT magazine and has featured in the US edition of WIRED.</p>
    <p>ORGANON<br>
    Kindly donated by G-Type's Nick Cooke, this special pack includes the Regular &amp; Bold weights of both Organon Sans &amp; Serif which have been designed specifically to complement one another. Feature rich OpenType fonts with Small Caps and extended European character sets.</p>
    <p>Please help to spread the word about this campaign or kindly buy one of the fonts. Get in touch if you’d like to donate a typeface.</p>
    <p>#buyfontssavelives<br>
    <a href="http://www.typespec.co.uk/buyfontssavelives" title="www.typespec.co.uk/buyfontssavelives">www.typespec.co.uk/buyfontssavelives</a><br>
    <a href="http://www.buyfontssavelives.com" title="www.buyfontssavelives.com">www.buyfontssavelives.com</a></p>
    <p>e: <a href="mailto:paul.harpin@haymarket.com">paul.harpin@haymarket.com</a> or <a href="mailto:joe@typespec.co.uk">joe@typespec.co.uk</a></p>
