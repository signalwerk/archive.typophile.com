    html: <p>Font Reserve work well here for last couple of months under MacX. Auto activation for various appl. To me, its close to ATMdeluxe that I used before. And as I never wanted to comeback to Suitcase, I like Font Reserve who is developed by a font company, so to me its another good reason to trust it.</p>
