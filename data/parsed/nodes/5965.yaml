    html: <p>I wish I had a more informed opinion. I was kind of forced into Suitcase and find that it works fine, although it's slow. It's slow to launch and it must be open in the background all the time (unlike the old ATM Deluxe under OS 9). The newest version of Suitcase auto-activates fonts in Illustrator only. (FontReserve doesn't auto-activate faces from any app.) <br> <br>I would love to know what FontReserve users think. <br> <br>I wonder if the folks at <a href="http://www.atmforosx.com" target="_blank">http://www.atmforosx.com</a> have given up on their petition yet.</p>
