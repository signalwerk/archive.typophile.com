    html: "<p>Re: ATMforOSX.org <br> <br>The site is still going, with al the petition names being forwarded to Adobe in late January.  Although the decision to wait has largely been informed by a lack of time on the part of the developers of the site, its is still an important project for both of them. <br> <br>In terms of Font Management tools... both Suitcase and FontReserve work well.  Most people I have talked to like Suitcase a little better for the way it displays loaded fonts. <br> <br></p>"
