    html: <p>I've been very happy with Suitcase. The fact that it runs as an application is a due to the nature of OS X and Unix; this was not a decision made by the Suitcase programmers. <br> <br>You can make it work more like an earlier Mac extension, however. In Suitcase's preferences, click on 'open automatically when I log in,' then you don't have to ever launch it manually, again. Next, open your System Preferences and select 'Login Items' (it's under 'Personal'). Make sure that the box next to Suitcase is checked (under 'hide'). This will cause Suitcase to remain hidden, even though it's running. When you log in or start your computer, Suitcase will launch automatically, but stay invisibly in the background. The only indication you'll have that it's running is that the Suitcase icon in your Dock will have the little triangle next to it. <br> <br>When you want to load or unload a font, simply click on the icon in the Dock, or else create a keyboard shortcut in Suitcase's own preferences (in which case, you can delete the Dock icon). <br> <br>Whenever  you're finished loading or unloading fonts, simply hit 'command-h' to re-hide Suitcase. Now you can completely ignore it and will never see it, unless you need it. <br> <br>I've been really impressed with the way it interfaces with Classic applications - there is an extension for your Classic system folder, and the OS X application and Classic extension talk to each other, so that the OS X Suitcase app can pass fonts to the OS 9 extension. The OS 9 extension doesn't even have a control panel - you still load or unload fonts with the OS X app. <br> <br>I have a font folder at the root level of my Home folder, with all my fonts organized in subfolders within <br> <br></p>
