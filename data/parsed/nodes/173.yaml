    html: <p>I would make optical adjustments to the horizontals (they should slightly thinner <br>than the verticals) this would improve <br>legibility. Also D seems too heavy around <br>the curves on the left. I do not think the S <br>fits with the rest of the glyphs. For additional <br>reference of similar designs, see Mark Von Bronkhorst's Conduit <br>(itcfonts.com or mvbfonts.com) <br>A good start...Keep it going... </p>
