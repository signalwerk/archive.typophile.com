      <p>Chimneys: I appear to be afflicted by the same problem.  Since I moved to Canada from Japan in August, I've been unable to start new topics in any forum.  I get only an "internal server error" page, followed by a message saying that my post has been "queued for moderation".  After two months, there's no sign that any of them is ever going to actually be posted...</p>
      <p>Messages to the administrators have not yielded any positive results yet.  And so I'm stuck in my current purgatory of only being able to post in existing threads...  </p>
      <p>I mention it here in the vague hopes that someone might be able to offer advice...</p>
