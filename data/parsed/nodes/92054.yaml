    <p>When clicking on an item under "Recent Posts", I occasionally get the message, "Access denied<br>
    You are not authorized to access this page. "</p>
    <p>I feel that it's just a timing issue, with the subject being listed under 'Recent Posts' before the post has been completely finished by the author or processed by the system. It's trying to access the appropriate node #, and instead of "page not found" for a non-existent node, it gives the access denied msg</p>
    <p> - Herb</p>
