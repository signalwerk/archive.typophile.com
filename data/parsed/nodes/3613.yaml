  html: <p>I have an old  non-latin postscript type 3 font for which there is no type 1 or TT versions. In OS X this font is recognized by Carbon applications like MS Office but is not recognized by Cocoa applications i.e. TextEdit. Is there a way to have Cocoa applications recognize PS type 3 fonts? <br> <br>I tried converting it to a PS type 1 font, but being non-latin, the results are unacceptable.  <br> <br>Will Acrobat 5 or 6 allow me to embed a type 3 font in a pdf file, so I can re-print it in the future? <br> <br>Will appreciate any assisstance. TIA.</p>
  html_clean: <p>I have an old  non-latin postscript type 3 font for which there is no type 1 or TT versions. In OS X this font is recognized by Carbon applications like MS Office but is not recognized by Cocoa applications i.e. TextEdit. Is there a way to have Cocoa applications recognize PS type 3 fonts? <br> <br>I tried converting it to a PS type 1 font, but being non-latin, the results are unacceptable.  <br> <br>Will Acrobat 5 or 6 allow me to embed a type 3 font in a pdf file, so I can re-print it in the future? <br> <br>Will appreciate any assisstance. TIA.</p>
