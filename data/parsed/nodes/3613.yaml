    html: <p>Type 3 will have the same encoding issues as Type 1; whatever differences you are seeing should be fixable. <br> <br>WHen you say it's "non-latin," what exactly is it? It might make more sense to turn it into TrueType or OpenType. <br> <br>You can embed Type 3 in PDF, but what will that accomplish? Is this some document you will never want to change? <br> <br>Regards, <br> <br>T</p>
