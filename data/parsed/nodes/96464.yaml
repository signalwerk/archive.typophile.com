      <p>Sorry Christopher, but speak for yourself. I've been using computers from way before I was aware of type, and I only started talking to other people about type thanks to Typo-L. I've never spent an inordinate amount of time perusing printed specimen books, and don't recommend killing more trees just to get better at ID-ing fonts. But that doesn't mean I don't appreciate real talent and skill at ID-ing fonts; running software to do it for you might be more efficient for the person you're helping, but it doesn't really help the person doing it get better at anything (and thereby helping others in more significant ways).</p>
      <p>hhp</p>
