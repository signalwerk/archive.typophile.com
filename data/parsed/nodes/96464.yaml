      <p>@hrant &amp; adydog:<br>
      “…<em>running software to do it for you might be more efficient for the person you're helping, but it doesn't really help the person doing it get better at anything (and thereby helping others in more significant ways</em>).</p>
      <p>“<em>Surely, the most important thing is to learn and try to remember</em>.”</p>
      <p>My points exactly. Using software and getting someone to do your work for you is not helping them learn. Yes, it’s taking advantage of valuable resources, but it ultimately stunts their ability to do it themselves. Perhaps I’m living in the past. I’ve also made the same point before in that if we as a community take care of other people’s leg work, they aren’t going to develop those muscles, and 10 years from now we’ll have a weaker community. A difficult balance, and obviously the solution lies in a combination of both, but all too many times I see “do my homework” “what’s this font” and a plethora of students doing a simple Google image search and slapping some type on it (which someone else probably told them to use), or even worse, “ffffinding” a solution and ripping it off. It’s really simple from where I stand. If your first line of attack is to ask Wikipedia, you are stunting your problem solving skills. I would match any stake that this will become a very important conversation in the next few years in the fields of sociology, cultural anthropology, heck, even neuropsychology (if it isn’t already).</p>
      <p>And as far as trees go, don’t get me started. The carbon footprint of the computer you are using right now is ridiculous compared to that of a book. Computers are made from finite mineral resources and (currently) powered by petroleum products which the world is at war over. That, and trees are a renewable resource which can lead towards a sustainable economy. <em>And</em> high quality acid-free paper is by far in a way the most stable way to archive information. #rant</p>
