    html: |-
      <p>@All: The reason us old guys can do it from memory is that we started before computers and internet. We didn’t have fancy software or forums. We had “books.” “<a href="http://www.urbandictionary.com/define.php?term=p-book" rel="nofollow">P-books</a>” at that.</p>
      <p>It was only from repeat exposure that, over time, we formed strong associative neural pathways which lead us to develop “long term memory.”</p>
      <p>We couldn’t ask Bing, Google was a funny word that had something to do with numbers, and you were probably just a twinkle in someone’s eye.</p>
      <p>It’s really simple. Taking advantage of your resources to assist in efficient problem solving only makes sense. But the skills development in the what I dub the “Search versus Solve” dichotomy still remains.</p>
      <p>In two proverbs:</p>
      <p>“<em>Give a man a fish, and you feed him for a Day. Teach a man to fish, and you feed him for a lifetime</em>.</p>
      <p>and</p>
      <p>“<em>Practice makes perfect</em>.”</p>
      <p>My advice? Just spend the money on a HARD COPY of the <a href="http://www.fontshop.com/products/fontbook/" rel="nofollow">FontBook</a>, bust out a pencil and sketchbook, and flip through a few pages every morning with your coffee. Take notes and sketch key letters. If memory serves, FontBook doesn’t show complete alphabets. <strong>Very</strong> disappointing, but a good start. Always keep your eyes peeled for good specimen books. Another one in my library I quite enjoy reading is <a href="http://www.amazon.ca/American-Metal-Typefaces-Twentieth-Century/dp/0938768344" rel="nofollow">American metal typefaces of the twentieth century</a>. Many specimens are accompanied by a short historical paragraph. A fun read. Don’t waste your money on a paperback. Hunt for a deal on a hard-cover. The paperback will simply fall apart within a year.</p>
      <p>No go! go off into the world of “Paper” and explore! Be free!!</p>
      <p>From the film Kung-Fu: <a href="http://www.youtube.com/watch?v=WCyJRXvPNRo" title="http://www.youtube.com/watch?v=WCyJRXvPNRo">http://www.youtube.com/watch?v=WCyJRXvPNRo</a><br>
      Caine: Old man, how is it you can hear these things?<br>
      Master Po: Young man, how is it that you can not?</p>
