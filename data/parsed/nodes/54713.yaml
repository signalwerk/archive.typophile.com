  html: |-
    <p>I am working on redesigning my companies internal communication newsletter. We are going for a clean modern look.</p>
    <p>I think we have decided on Cronos Light (<a href="http://new.myfonts.com/fonts/adobe/cronos/" title="http://new.myfonts.com/fonts/adobe/cronos/">http://new.myfonts.com/fonts/adobe/cronos/</a>)for body copy.<br>
    I am having a hard time picking a typeface for headlines, do you guys have any suggestions?</p>
    <p>Thank you.</p>
