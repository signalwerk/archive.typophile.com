      <p><code>START SNIDE COMMENT</code><br>
      Today Sans would match it perfectly :p<br>
      <code>END SNIDE COMMENT</code></p>
      <p>I actually really like Cronos Light. But for body copy? If you go with anything bold, your page's weight is going to be very top heavy. </p>
      <p>I bet a nice serif would work well. Sticking with Slimbach, I would second the Minion, but not the black. Perhaps Minion Pro or Pro Condensed set in all caps?</p>
