      <p>Thanks Matthew for the ideas. Unfortunately scripting isn't my forte, so I think it will be quicker for me to make an underline font in FontLab. I don't need all the characters--just plain a-z, A-Z, numbers and some punctuation.</p>
      <p>James: It's pretty much impossible I've found to authentically replicate the look of an old typewriter with an underinked ribbon in digital type. A lot of the distressed typewriter fonts look like a photocopy of a typewritten page when printed. Usually I just need a couple of lines, in which case I just bash it out on my real typewriter, scan it, and place it as a half-tone image.</p>
