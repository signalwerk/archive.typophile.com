    html: <p>I'd make a separate text box that has a bunch of underscore characters that match up with your underscored text (don't forget to fiddle with minor baseline shifts and some even more minor character width and height adjustments to give it an authentic look), and then just overlay it on your original text. Clumsy, but it should work.</p>
