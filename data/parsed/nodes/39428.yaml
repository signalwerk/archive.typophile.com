    <p>I've got something that has to be set in InDesign CS in a "typewriter" font to mimic typing in the old days, which includes using the underscore to indicate italics (old timers like me remember actually doing that, on a real typewriter).</p>
    <p>It happens the typewriter font I'm using, suitably battered, has a matching underscore (suitably battered, that is). Those who remember manual typewriters will recall how the underscore key was never quite aligned, so that the resulting underline was kind of wobbly, or saw-toothed. I need that effect.</p>
    <p>Problem is, I can't figure out how to place the underscore under the letters (there's a lot of passages). On the typewriter is was easy: you just ran the carriage back and typed the underscore--rat-tat-tat-tat-tat. How do you do this in InDesign? There must be a simple way that somehow eludes me. Using the underline feature is no good, as it doesn't access the underscore character, even through the stroke options palette (even a suitable custom stroke would seem to be impossible to create, at least in CS1).</p>
    <p>One solution, failing keyboard manipulatoin, would be to open the font up in Fontlab, add an understroke to each character, and save the result as the  "italic" font to be used where needed (EULA permitting, of course). Funny that "typewriter" fonts don't come with one of these ready-made (let me know if you know of one that does).</p>
