    html: "<p>Not that it'd be a whole lot easier but could produce more random results (what you want) than just making a font:</p>

      <p>Since it's a typewriter font you should be able to reasonably assume the location of any character on a page if you were, say, given a bounding box, the text that contains it, and its index in the text.  Then you could place the underscore characters in individual text boxes and then jostle them about.</p>

      <p>If InDesign scripting is as capable as Illustrator's then it should be pretty possible to just set a style that changes the color of the underlined text to red, and then before printing you could run the script, which would identify the red text and understand to place the underscores.</p>

      <p>But all this depends on a few things: that the font is perfectly fixed-width and that InDesign's scripting is as capable as I would hope to think it is.  But writing the script would only really be feasible if there are a high number of pages each needing the underline.</p>

      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>"
