  html: |-
    <p>I've been spending the last few days trying to decide on a font for a company I am starting. It's an apparel company where we focus our focus is simple and elegant experiences. Right now the logo I've designed is very simple so I need a typeface that goes along with it. I want it to be simple and elegant. By that I mean simple but looks really good. It must be both, the elegant fonts are not going to do and simple to is too broad. </p>
    <p>I really liked Avenir but a friend of mine whose opinion I trust turned it down quickly. He said I would like Chalet, which I do but I was wondering if any of you have any other suggestions?</p>
  html_clean: |-
    <p>I've been spending the last few days trying to decide on a font for a company I am starting. It's an apparel company where we focus our focus is simple and elegant experiences. Right now the logo I've designed is very simple so I need a typeface that goes along with it. I want it to be simple and elegant. By that I mean simple but looks really good. It must be both, the elegant fonts are not going to do and simple to is too broad. </p>
