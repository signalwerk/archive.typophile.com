      <p>Hi rhyde,<br>
      It seems you have an aesthetic in mind. When I'm at that point, I tend to do some freehand sketching in place of the font. I get a few scenarios to work with so I can see the graphic &amp; imagery as a whole. At that point, I look for something that can be applied to what came naturally. </p>
      <p>If all your work is currently on the screen, output your graphics and try sketching on overlays to determine good positioning &amp; weight.</p>
      <p>Mike Lee | ReadyType™</p>
