      <p>If you liked Avenir but don't want to use it, try Gotham. The only downside is that everyone is using Gotham right now so it's not going to be terribly unique. Maybe also check out Whitney or Verlag by <a class="freelinking external" href="http://typography.com" rel="nofollow">H&amp;FJ</a></p>
      <p>The Chalet family has a lot of different styles ranging from Bauhaus to Helvetica-esque. I'd just try to avoid Chalet London 1980. I think it ends up looking cheesy most of the time (especially if you use a lowercase t).</p>
      <p>I think <a class="freelinking external" href="http://www.christianschwartz.com/neutra.shtml" rel="nofollow">Neutraface</a> is a very elegant looking sans serif. It's often times used to look a little Art Deco if that's appealing to you.</p>
      <p>Just out of curiosity, what was wrong with Avenir?</p>
