    html: "<p>That's right, part of the /a which is probably why you're still discussing on this case, that's very close (if not matching) <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/linotype/trade-gothic/bold-extended-63882\" rel=\"nofollow\">Trade Gothic Extended Bold</a> and especially when you look at this <a class=\"freelinking external\" href=\"http://blog.iso50.com/wp-content/uploads/2008/11/dsc-1895-copy-tm1.jpg\" rel=\"nofollow\">sample</a> pointed out by Herb. Some more to think about: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq\" rel=\"nofollow\">Akzidenz Grotesk Extended</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/castletype/standard\" rel=\"nofollow\">Standard Extended</a> (probably the closest I've found), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typetrust/reservation-wide\" rel=\"nofollow\">Reservation Wide</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/mvbfonts/embarcadero\" rel=\"nofollow\">Embarcadero</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/sweet/sans\" rel=\"nofollow\">Sweet Sans</a>, <a class=\"freelinking external\" href=\"http://www.linotype.com/fr/149780/CGGothicExtraLightExtended-product.html\" rel=\"nofollow\">CG Gothic Extended</a> (only Extra Light unfortunately), <a class=\"freelinking external\" href=\"http://typophile.com/node/38174\" rel=\"nofollow\">Splendid Grotesk</a>, <a class=\"freelinking external\" href=\"http://www.fontbureau.com/fonts/Vonness\" rel=\"nofollow\">Vonness</a></p>"
