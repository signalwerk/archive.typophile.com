    <p></p><div class="imageWrap"><img src="http://typophile.com/files/small-caps_6104.png"></div><p></p>
    <p>Referring to the image, which do you feel is the most pleasing treatment for small caps?</p>
    <p>1:&nbsp;Caps and small caps using default weight &amp; size settings.</p>
    <p>2: Caps are dropped from bold to medium. Small caps unchanged.</p>
    <p>3: Caps are dropped from bold to medium. Size is dropped from 16pt to 15pt. Small caps are unchanged.</p>
