    <p>Hi Folks,<br>
    This serif has baffled me. It reminds me of <a href="https://web.archive.org/web/20080906161142/http://www.myfonts.com/fonts/bitstream/americana/">Americana</a>, but the x-height is quite different. The ’T’, ’k’ and ’g’ seem pretty distinctive, and do not match Americana. </p>
    <p>Anyone recognize this?</p>
    <p>Thanks,<br>
    - Mike</p>
