      <p>I've seen this several times in brochures, where customer testimonials are inserted into the text. It can work well. Might even be better in your case, where the quotations are longer stretches of text.</p>
      <p>One thing to note on your sample though... the mark you're using is a closing quotation mark and you have it at the beginning of your text. Was this intentional? Seems counter-intuitive to me.</p>
