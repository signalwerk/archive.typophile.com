    html: <p>Not all languages use the same quotation marks. The opening quotes for some languages, such as German, are "low-9" quotes. They are paired with the raised 6-shaped quotes on the right (which are the same as the English-style opening quotes). See the <a href="http://en.wikipedia.org/wiki/Quotation_mark" rel="nofollow">Wikipedia article</a>. I know they use these in Icelandic, so I'm guessing this is the convention in Norwegian as well.</p>
    html_clean: <p>Not all languages use the same quotation marks. The opening quotes for some languages, such as German, are "low-9" quotes. They are paired with the raised 6-shaped quotes on the right (which are the same as the English-style opening quotes). See the <a href="http://en.wikipedia.org/wiki/Quotation_mark" rel="nofollow" class="link-external">Wikipedia article</a>. I know they use these in Icelandic, so I'm guessing this is the convention in Norwegian as well.</p>
