  html: |-
    <p>I'm designing a book with a lot of long quotes from speeches. I wondered if i should place an oversized, pale quotation mark on the beginning of each font, tpo make it more obvious that it's actually a "spoken word quote". but there's something in my brain stem that tells me this could look really tacky. What do you guys think?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/quote.gif"></div><p></p>
