      <p>I might consider using guillemets for all the languages.<br>
      And if/where you use English quotes, consider making<br>
      them what I call "rationalist": horizontally-flipped-99 for<br>
      the opening ones, and 99 for the closing. I think that works<br>
      better for display, generally.</p>
      <p>hhp</p>
