  html: |-
    <p><a href="http://typosium.org">Typosium.org</a> now has a basic forum online. This is not the functional site, but a simple machines forum on which to brainstorm, assess goals and then decide how to implement them. It is open to all. I would love to see everybody who is interested in a web-based font newsmagazine. Those that like the idea, come on over, check the manifesto and join in debate. If you think the idea is awful, then stay here and discuss! :)</p>
    <p>I’m going to go watch House. I’ll check in for any questions later over there.</p>
