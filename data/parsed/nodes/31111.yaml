      <p>Today on the Typosium Channel, alongside our running debates of technology, community and philosophy, we are at the beginning of a contemplation of review standards for Decorative, Display and Passage typefaces. Or if there can even be one unified rating for them, or if it would even be beneficial to the users.</p>
      <p>I imagine some of the community has very strong opinions on this, and look forward to hearing them.</p>
