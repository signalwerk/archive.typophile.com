    html: |-
      <p>If art director / designer is a description of what you do vs. a formal title, it should absolutely not be capitalized.</p>
      <p>Personally, I find this sort of indiscriminate capitalization a huge problem, especially in advertising. Why are graphic designers not required to take basic courses in grammar, structure and spelling? The people responsible for the text we read should also have training that is a bit broader than aesthetics and tool-use.</p>
      <p>Certainly, I have never asked if there was “a Doctor in the house,” but I would address my friend James as Doctor Liau. Capitalize a title or honorific, sure … but not a description; that doesn’t make any sense at all.</p>
      <p>—-</p>
      <p>jlt : <a href="http://www.hewnandhammered.com">http://www.hewnandhammered.com</a> : rnrmf!</p>
