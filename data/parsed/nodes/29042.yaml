  html: |-
    <p>Hi everyone,<br>
    I left my job about six months ago and started freelancing. I’ve now decided it’s time to take things a bit more seriously and design a business card for myself.</p>
    <p>So far I’ve got four options, they’re not too different from one another but I’d like to get some feedback on the layouts.</p>
    <p>I’ve left them B&amp;W for the moment until I reach a decision on what colour(s) I’m after. I plan on getting them printed on a matt stock using an offset printer.</p>
    <p>cheers.</p>
