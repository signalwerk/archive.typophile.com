    <p>Hello everybody,<br>
    I have been put on a mission, my wife decided to get into graphic design school and she asks from time to time for help, right now she needs me to help her find a quote from one or each of the following, Robert Besley, Claude Garamond or Francesco Griffo.</p>
    <p>If any body has any info on where I can find these or if somebody has any, I (she) will really appreciate it.<br>
    I thank you in advance.</p>
    <p>badbye</p>
