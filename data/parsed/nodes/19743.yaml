      <p>&gt; Review several quality books of poetry to understand how poems are set typographically.</p>
      <p>I want to elaborate on this good advice. Ignore any poetry book printed after 1984. It is possible that it is well set, but that is the year that DTP started (well, soon after) and this meant books could be set by non-experts in typography.</p>
      <p>Books set pre-1984, if bound well and on good paper, probably followed the typographic conventions Norbert is mentioning.</p>
