      Imagine it is a pleasant, peaceful day. You are walking along the magical cliffside of type, and you cautiously creep over to the edge to steal a furtive glance at the Forbidden Canyon leading to the typographic Nether-World below. You begin to teeter – you think you're going to fall into the mighty crack and be sucked away into Oblivion, but as you regain your balance you manage to peek over the edge and notice a tiny ledge sticking out from the inside wall of the cliff that isn't visible from a safe distance. And on that ledge, safely out of reach like the bansai tree in the Karate Kid II, you briefly glimpse Simplex: </p>
      <p><a href="http://www.identifont.com/similar?4EY" title="http://www.identifont.com/similar?4EY" class="link-external">http://www.identifont.com/similar?4EY</a><br>
