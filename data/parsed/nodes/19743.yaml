      <p>Hi Terence,</p>
      <p>it's been a long, long time since I've set anything in metal, but others on this forum have kept the <em>Black Art</em> alive.</p>
      <p>&gt; <em>My questions:</em></p>
      <p>1) if you begin to typeset with lead type would you start with a poem (most people only print business cards)?</p>
      <p>In my opionion, a poem is fine, perhaps even better. Just keep the entire poem with title and author on a single sheet. Traditional poems have standardized typographic guidelines such as, line for line, flush left/ragged right with indents on lines that run over, etc. Review several quality books of poetry to understand how poems are set typographically.</p>
      <p><em>2) Would you start learning using fonts you do not know (not that I know any font personally)?</em></p>
      <p>I think that matters less than the selection of metal fonts and sizes that are available to work with.</p>
      <p><em>3) Which font would you’re choice to start with?</em></p>
      <p>Again, I think it matters less than the selection available, but for a traditional poem, at least try serifs first. It really concerns the "tone" of the poem itself. Try setting a line or two on the same sheet with different fonts. This will give you a sense of what might work better.</p>
      <p><em>4) Are there any books you would recommend too read before you try printing with lead type (it doesn’t have to be in english)?</em></p>
      <p>Here are a few links I have bookmarked for myself related to hot metal printing and types that may be useful even before purchasing a book:</p>
      <p><a href="http://www.fiveroses.org/" target="new" rel="nofollow">Five Roses Press</a><br>
      <a href="http://members.aol.com/aapa96/lpress.html" target="new" rel="nofollow">Resources for Letterpress Printers</a><br>
      <a href="http://www.mwbixler.com/specimens.html" target="new" rel="nofollow">Bixler Press -- some Monotype metal type specimens</a><br>
      <a href="http://www.donblack.ca/handset.htm" target="new" rel="nofollow">Don Black -- handset type listings</a><br>
      <a href="http://www.metaltype.co.uk/links.shtml" target="new" rel="nofollow">Metal Type -- Hot Metal Type Links</a></p>
