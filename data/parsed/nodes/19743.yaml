      <p>Great for a first print! Pretty good word-spacing too.<br>
      I have never set with individual slugs, just with prepared plates. I actually have a whole fount of a Civilité which is very nice, though I've never had the patience to try and print with it.</p>
      <p>If you want more lead type, I would suggest checking out Ohio. Many cities, Cincinnati in particular, were major printing centers, and there is much old printing equipment to be found. I saw someone on eBay selling dozens of complete fonts (amounting to hundreds of pounds of lead) for just a couple hundred dollars, but obviously you had to pick it up yourself as such a thing would be difficult to ship. Naturally these were mostly newspaper and old commercial types, but would be a cool thing to have if you get into printing.</p>
      <p>I have inquired before about full sets of new metal type, and it is horribly expensive, costing about $100 for one each A-Z, numbers and some punctuation. That was for Centaur. And I would expect you would need several sets to do a single page. The point is, if you see some old lead type for cheap, you might as well make the effort to buy it if you plan on doing a lot of letterpress.</p>
