    <p>Hello everybody,</p>
    <p>I have taken an interest in metal (lead) type. I have the opportunity to print at both my colleges. I have read the following book "Boek over het maken van boeken" and I observed someone else (making a business card for herself). </p>
    <p>I would like to typeset a poem (The Motive for Metaphor, by Wallace Stevens <a href="http://pocast.com/?p=88" title="http://pocast.com/?p=88">http://pocast.com/?p=88</a>). The fonts I can use are limited. From the list of the fonts they have (the complete list below) I have chosen 'Nobel' for the title and name of the author and for the body text I was thinking about 'Spectrum'. </p>
    <p>My questions: 1) if you begin to typeset with lead type would you start with a poem (most people only print business cards)? 2) Would you start learning using fonts you do not know (not that I know any font personally)? 3) Which font would you're choice to start with? 4) Are there any books you would recommend too read before you try printing with lead type (it doesn't have to be in english)?</p>
    <p>My goal is too (eventually) typeset a small booklet (someday; after I have practiced; a lot).</p>
    <p>Thank you for you're time.</p>
    <p>Best,</p>
    <p>Terence</p>
    <p>List of Fonts</p>
    <p>Antieke<br>
    Baskerville<br>
    Bordoni<br>
    Egmont<br>
    Egyptienne<br>
    Garamont<br>
    Gill<br>
    Helvetica<br>
    Hildago<br>
    Iris<br>
    Nobel<br>
    Spectrum<br>
    Times<br>
    Venus</p>
