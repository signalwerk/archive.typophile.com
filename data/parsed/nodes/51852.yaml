  html: <p>I have to go on an internship this (school)year. I was thinking about going to London, but amazingly enough I can't seem to find that many. London is known for it's high concentration of design firms i believe. I've bought and looked into some books, but I was also wondering if anybody on this forum knows some good firms.</p>
