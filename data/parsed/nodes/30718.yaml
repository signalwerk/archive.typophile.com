      <p>Quote from Jspass: <em><strong>"Even though my professional career has been somewhat brief, I have a strong aversion to these so-called clients…"</strong></em></p>
      <p>Carefully cultivating that aversion will save you a great deal of wasted time and effort. Potential clients who are more trouble than they're worth are often easy to identify if you recognize the symptoms.</p>
      <p>As demonstrated by this whole thread, one category to avoid are clients with visions of exactly what they want and who expect it at bargain rates. These clients are usually too heavily invested to relinquish enough control to enable a designer to succeed at any price. They expect designers to climb inside their heads and give birth to their brainchild (which is usually a rehash of something they've seen somewhere else). When the project fails, as it usually does, they will always blame the designer, refuse to pay, and feel perfectly justified in doing so.</p>
      <p>These clients are sincere, but usually leave a string of frustrated and unpaid designers in their wake. They often tell stories of the "untalented" and "lazy" designers they've hired in the past. They're usually extremely picky about specific and largely unimportant details. They expect endless revisions with no additional compensation and seem oblivious that they're wasting your time. If you bring up the time factor, they'll go on the offensive and accuse you of wasting <em>their</em> time by not giving them what they wanted in the first place.</p>
      <p>What they never admit to are their own shortcomings as clients. They view designers as hired pairs of hands who are mostly just supposed to implement and enhance their pre-existing visions. They hire "production artists," and expect them to flesh out their impractical or unworkable ideas. They never realize that their micromanagement and flawed expectations are usually to blame for their bad luck in working with artists. They rarely even realize that they are micromanagers. </p>
      <p>This, however, makes it easy for you, the designer, to spot them in advance. The warning signs, without exception, are always there and will become obvious during your initial visit if you ask the right questions. When you see the warning signs, it's time to say, "Thanks, but I'm not interested." Leave on good terms, but don't look back. Fooling yourself by thinking that you can work with them will only result in frustration, wasted time and too little compensation.</p>
