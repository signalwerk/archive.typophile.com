      <p>Edit: The original title of this thread was something along the lines of<br>
      <em>“Does anyone know how to find a good production designer?”</em> and started off with:</p>
      <p><em>“Check this out, I put up a contest, so t speak, on sitepoint.com to find someone to help with banner ad creation for a site that I do some frelance art direction for. Desipite the fairly detailed instructions and feedback that I leave for them, not one comes up with anything that resembles professional work.”</em></p>
      <p>The originator of this thread has removed this information for reasons that will be obvious to anyone who reads the responses. </p>
      <p><em>My original reply starts below.</em></p>
      <p>If you want great design, hire a great design firm and be willing to pay for great design. Expecting great design from a $300 spec job in the form of an online contest is stupid, cheap, arrogant, and insulting to many professional and student designers.</p>
    html_clean: |-
