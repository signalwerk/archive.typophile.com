      <p>It's called market economics, look into it.  If there's a supply, who am I (or who are you) to criticize?  No one is holding a gun to their heads.  They participate in the contest on their own free will.</p>
      <p>Unlike you guys, I don't have the luxury of lamenting and pontificating about the drudgery of business and design.  I design and I business... and the business side of me looks for value.</p>
      <p>For any of you that haven't ever picked up an economics book, value is at or below the price I'm willing to pay.</p>
      <p>In this case, I have not seen value yet.  I'm willing to pay zero.</p>
      <p>However, if there was a designer on their that was reasonably competent, I'd pay $300 + whatever terms we would agree as fair for future work.</p>
      <p>I'm not saying it isn't appropriate to pay someone up-front.  It certainly is, given the right circumstances.  But get off your high-horses about this contest thing!  If it turned out to produce appropriate design, you yourselves would venture to find resources there.</p>
      <p>But the mob is fickle.  I get it.  You would rather take pot-shots here 'cause you're all so much better than me. Haha!  What a joke.</p>
      <p>Aluminum:</p>
      <p>"How much should you expect to pay? I dunno. I’d say $50 - $150 but there are so many ‘it depends’ that it’s impossible to say. I would say expect to pay what they are worth."</p>
      <p>What they are worth to whom?</p>
      <p>If the answer is to me.. then I'd be happy to.  But prove that you are worth what you ask.</p>
      <p>elliot100:</p>
      <p>"you’re clearly looking for design rather than just knocking out banner ads:"</p>
      <p>I think you've hit the nail on the head.  Was hoping to find someone that could think on their own, but I guess none of those guys can.</p>
      <p>Ricardo Cordoba:</p>
      <p>"If you were a work- and money-starved young designer right now, would you enter your own contest?"</p>
      <p>Who cares?  I do my thing, they do theirs.  Like I said, no one is holding a gun to their heads.</p>
