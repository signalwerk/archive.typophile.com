      <p>You can thank the many who brought in the electronic age and it's side effect of ruining what used to run very smoothly.</p>
      <p>In the "olden" days - we had Art Directors who paid their dues to get to the spot they were in. We had Production Directors, who even when they had their job, they continued to be educated in the latest papers, printing presses, inks, etc. We had bullpens, where the young, bright and best from art schools would work together, helping each other with design thoughts. There were many checkpoints along the way. A basic comp, approval, execution. Ah, execution - is what happened to it. These persons working had outside suppliers - folks who very seriously took their careers. Many started as apprentices and worked their way up to journeymen. The artists and production people relied on the professionals.</p>
      <p>In fact, the whole industry relied on professionals. Literally hundreds of years of experience (from those who had the experience) went into every design piece.</p>
      <p>You, Sativo, are now seeing the new end product. Anyone who has made an investment in a computer can be a designer... Good luck.</p>
      <p>AND P.S. Give those folks a reason why you cancelled - select one winner, pay them the $300 PROMISED -- and say the contest is over. You don't have to use their work - but god damn - be a person of your word and fork over the funds and name the winner on your site.</p>
      <p>New question - Are you stale? Are you really a designer? You look as if you want new ideas to help you design. I remember your first "contest" select a name for the site - did anyone ever win that one?</p>
      <p>Come to think of it - have you ever really helped a young designer? All of this looks like you are more of a user of young designers...</p>
