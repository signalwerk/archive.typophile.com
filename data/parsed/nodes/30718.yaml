      <p>Jspass, I agree with everything Thylacine said above. In addition, my experience has been not only "you get what you pay for" but "you VALUE what you pay for" - don't make the mistake of thinking that working for cheap will endear you to your clients. The fact is, people are conditioned to value things partly by the price that is asked.</p>
      <p>If you ask too little for your services, unfortunately, some clients will associate your low price with low value - and they won't be as respectful of your time as they would if it were costing them more dearly. Obviously, clients have different budgets and if you're just starting out you'll probably have to be a little cheaper for a while - but don't give it away!</p>
      <p>I have never and will never work on spec.</p>
