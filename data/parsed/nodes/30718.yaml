      <p>Oh jeez!  Sorry to offend your delicate design sensibilities guys!  But get over yourselves.  I'm a designer too.. I know that places like this can give real designers a bad rap.  But I also know that I've had experiences not too dissimilar from this online contest where I contracted a designer with a relatively decent portfolio who banged out some crap work in a fraction of the time required and demanded market rate for 3x as many hours as he put in.</p>
      <p>FYI - I'm willing to pay market, but for production design.  I'm not hiring an art director.  The direction of the design has already been set.  Now I'm looking for someone to bang out some banner ads.  Should I pay $60 an hour for that?</p>
      <p>Anyway, I can't believe you guys can't relate with this experience.  Perhaps you've never needed to hire a designer to assist you on a project.  But if that's the case, just do me a favor and skip this thread -- go cry to someone else.  I'm looking for someone who has hired production designers and could give me some pointers on where to look, what to expect, and how much to pay.</p>
