      <p><em>get off your high-horses about this contest thing!</em></p>
      <p>There is a reason why professional organizations (AIGA, RGD, GDC, etc.) forbid spec work in their codes of ethics, and have stipulations regarding what kind of competitions members are allowed to enter. It's because independent designers are exploited by corporate market forces unless they group together.</p>
      <p>In that context, doing the right thing is not high-horse, it's solidarity.</p>
      <p>Of course, it's not mandatory for designers to be registered professionals in order to practise, as it is with doctors, lawyers, etc. So "non-ethical" mavericks can benefit financially from the status which those professional organizations bring to the work. On the other hand, they miss out on some of the benefits, such as the respect of their peers.</p>
