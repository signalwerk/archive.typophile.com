    <p>dear typophiles!</p>
    <p>i am glad to tell you about new original book about Cyrillic, and especially about Ukrainian handwrited letters. Vitalij Mitchenko -- artist, calligrapher, teacher and author of this book -- pays strong attention to our rich historical heritage, especially to Ukrainian skoropys, and to works of modern calligraphers. here is some pictures from this book:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/0003tzap_5322.jpeg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/0003p395_5028.jpeg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/0003r548_3588.jpeg"></div><p></p>
    <p>Мітченко В.С.<br>
    Естетика українського рукописного шрифту. — Київ: Грамота, 2007<br>
    ISBN 978-966-349-099-1</p>
