    <p>dear typophiles!</p>
    <p>i am glad to tell you about new original book about Cyrillic, and especially about Ukrainian handwrited letters. Vitalij Mitchenko -- artist, calligrapher, teacher and author of this book -- pays strong attention to our rich historical heritage, especially to Ukrainian skoropys, and to works of modern calligraphers. here is some pictures from this book:<br><img src="/sites/default/files/old-images/0003tzap_5322.jpeg"><br><img src="/sites/default/files/old-images/0003p395_5028.jpeg"><br><img src="/sites/default/files/old-images/0003r548_3588.jpeg"></p>
    <p>Мітченко В.С.<br>
    Естетика українського рукописного шрифту. — Київ: Грамота, 2007<br>
    ISBN 978-966-349-099-1</p>
