    <p>dear typophiles!</p>
    <p>i am glad to tell you about new original book about Cyrillic, and especially about Ukrainian handwrited letters. Vitalij Mitchenko -- artist, calligrapher, teacher and author of this book -- pays strong attention to our rich historical heritage, especially to Ukrainian skoropys, and to works of modern calligraphers. here is some pictures from this book:<br>
