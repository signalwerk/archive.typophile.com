    html: <p>When I said that Fontographer didn't make very good fonts, I meant that there were certain technical problems and limitations with fonts built by Fontographer. <br> <br>For example, Fontographer's auto-hinting is quite poor. IIRC, Fontographer doesn't do hint replacement, or doesn't do it well. The Windows version forces PostScript FontNames to match Windows menu names in inappopriate ways. It becomes particularly limiting if one wants to make fonts with more than 256 glyphs and use Unicode (it does have some support here, but it's not very well done). Fontographer's irritating habit of doing decimal precision in point locations makes it hard to maintain consistent stroke weights, and contributes to design problems. <br> <br>I'm sure there are other issues, but it's been many years since I used the tool, so I am probably forgetting some. <br> <br>But all that is just to say that fonts built with Fontographer tend to be less than perfect technically, and suffer various technical limitations. One can build fonts in Fontographer that are technically good enough, particularly if one knows what Fontographer will do automatically wrong. And none of that stops people from making fonts that are artistically great. <br> <br>Regards, <br> <br>T</p>
