  html: <p>So I'm sitting here working with Meta. I noticed it seems like there are no kerning pairs for Meta LF, wich is lining figures. if I select a chunk of text, there are not one kerning pair. If I change to meta (not Lf) it has them. Are they think that we are suppose to use LF only on the selected numerals? I'm curious. <br> <br>I believe its Meta 2, as well.</p>
