    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 7.Jun.2007 7.43am </div>
      <p>Ascender Corporation announced an agreement with Microsoft that allows it to<br>
    distribute the new ClearType fonts featured in Windows Vista and Microsoft<br>
    Office 2007. The ClearType fonts appeal to end users, graphic designers and<br>
    enterprises for use in earlier versions of Windows, non-Windows operating<br>
    systems or in applications other than Microsoft Office. The Microsoft<br>
    ClearType Font Collection can be downloaded from the<br>
    <a href="http://www.ascendercorp.com">http://www.ascendercorp.com</a> website.</p>
    <p>—</p>
    <p>ELK GROVE VILLAGE, IL - June 7, 2007 - Ascender Corporation, a leading<br>
    provider of advanced font products for hardware &amp; software developers, today<br>
    announced that they have entered into an agreement with Microsoft which<br>
    enables Ascender to distribute the Microsoft ClearType Font Collection<br>
    directly to end users. </p>
    <p>The Microsoft ClearType Font Collection contains six new typeface families,<br>
    each with regular, italic, bold and bold italic styles. These fonts were<br>
    carefully specified and cooperatively designed under the direction of<br>
    Microsoft’s Advanced Reading Technologies team by leading type designers,<br>
    consultants and font software engineers to significantly improve the<br>
    on-screen reading experience through a combination of design iteration and<br>
    by leveraging Microsoft’s ClearType technology. Each of the 24 fonts<br>
    contains extended multi-language support (including Latin, Greek and<br>
    Cyrillic scripts), advanced OpenType typographic features and specialty<br>
    character sets.</p>
    <p>“When our Advanced Reading Technologies team first approached me in 2003<br>
    with the idea to develop a new collection of fonts I was intrigued. This<br>
    collection could enable Microsoft to both leverage the great work done with<br>
    our ClearType technology and bring a fresh new set of high-quality fonts to<br>
    our environments. The ClearType Font Collection has surpassed my<br>
    expectations in both respects and I am thrilled that we have been able to<br>
    make such a significant contribution to both on-screen reading and<br>
    typography in general.” said Bill Hill, Chief Reading Technology Researcher,<br>
    Microsoft Corporation. </p>
    <p>The 24 fonts in the collection are featured in Windows Vista and Microsoft<br>
    Office 2007. This agreement makes these fonts more broadly available for<br>
    license in any operating system by individuals, graphic designers and<br>
    businesses. </p>
    <p>“We are proud that Microsoft has selected Ascender to offer their fonts.<br>
    Microsoft has made a tremendous investment in their ClearType technology and<br>
    in these fonts. Their willingness to make these fonts available outside of<br>
    their new flagship products which incorporate these fonts is impressive,”<br>
    said Ira Mirochnick, President of Ascender Corporation. “The ClearType fonts<br>
    will appeal to a wide spectrum of users, especially those users seeking<br>
    fresh, high-quality designs or document compatibility with Microsoft’s new<br>
    products.”</p>
    <p>Each typeface family in the Microsoft ClearType Font Collection has its own<br>
    personality and flair that are the hallmark of their particular designer:</p>
    <p>- Calibri, designed by Luc(as) de Groot, is a sans serif design with a rich<br>
    soft character that makes the font suitable for documents, email and Web<br>
    design. Calibri is the new default sans serif font in Microsoft Office 2007.</p>
    <p>- Cambria, designed by Jelle Bosma with Steve Matteson &amp; Robin Nicholas, is<br>
    a serif design suitable for business documents. Ross Mills designed Cambria<br>
    Math, featuring an extensive character set for mathematical, scientific and<br>
    technical publications. Cambria is the new default serif font in Microsoft<br>
    Office 2007. </p>
    <p>- Candara, designed by Gary Munch, is lively but not intrusive sans serif<br>
    design suitable for email, Web design and informal settings.</p>
    <p>- Consolas, designed by Luc(as) de Groot, is a monospaced font (like an old<br>
    typewriter) and good for programmers setting code (its core purpose). </p>
    <p>- Constantia, designed by John Hudson, is a modulated wedge-serif design<br>
    ideal for e-book and journal publishing both online and in print.</p>
    <p>- Corbel, designed by Jeremy Tankard, was designed to give an uncluttered<br>
    and clean appearance on screen.</p>
    <p>- Cariadings, designed by Geraldine Wade, is a new symbol font featuring<br>
    typographic ornaments that can be used as watermarks, border enhancements or<br>
    icons.</p>
    <p>The Microsoft ClearType Font Collection is available now for purchase and<br>
    download from the <a href="http://www.ascendercorp.com">Ascendercorp</a> website.</p>
    <p>More information on the Microsoft ClearType Font Collection, including an 18<br>
    page guide to the development and use of the typefaces can be found here:<br>
    <a href="http://www.ascendercorp.com/ctfonts.html ">http://www.ascendercorp.com/ctfonts.html</a></p>
    <p>About Ascender Corporation</p>
    <p>Ascender Corporation is a leading provider of advanced font products<br>
    specializing in font design, development and licensing. Ascender’s founders<br>
    are font industry experts, and have been involved in developing some of the<br>
    most important and influential fonts used in computers, phones and consumer<br>
    devices. Ascender provides multilingual, custom font development for<br>
    enterprises and hardware &amp; software developers. Ascender also provides high<br>
    quality fonts for immediate download from the Ascender Font Store website<br>
    (<a href="http://www.ascenderfonts.com">www.ascenderfonts.com</a>).</p>
    <p>Contact:</p>
    <p>Bill Davis<br>
    Ascender Corporation<br>
    25 Northwest Point Blvd, Suite 225<br>
    Elk Grove Village, IL 60007 USA<br>
    Phone: (847) 357 0730 ext. 10<br>
    Fax: (847) 357 0731<br>
    <a href="http://www.ascendercorp.com">http://www.ascendercorp.com</a></p>
    <p>Trademarks: Ascender is a trademark of Ascender Corporation. Microsoft,<br>
    Cambria, Calibri, Candara, Consolas, Constantia, Corbel, ClearType, Windows<br>
    and OpenType are trademarks of Microsoft Corporation. All other trademarks<br>
    are property of their respective owners.</p>
    <p>￼</p>
