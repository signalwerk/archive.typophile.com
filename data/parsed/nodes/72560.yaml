      <p>Thanks for the clarification. The language on SBL's <a class="freelinking external" href="http://www.sbl-site.org/educational/biblicalfonts.aspx" rel="nofollow">webpage</a> is the following:</p>
      <p><strong>Commercial uses of SBL Fonts</strong><br>
      SBL fonts are made available without cost to individual scholars for non-profit use. Commercial use requires the purchase of a license or membership is the SBL Font Foundation. Please download <a class="freelinking external" href="http://www.sbl-site.org/assets/pdfs/SBLFontOrderForm.pdf" rel="nofollow">this form</a> for information on obtaining a license to use the SBL Fonts for commercial purposes.</p>
      <p>---</p>
      <p>There's a great deal of additional language in an End User License Agreement (EULA) in the manual for the font (Appendix A). The manual is a separate download from the font on <a class="freelinking external" href="http://www.sbl-site.org/educational/BiblicalFonts_SBLHebrew.aspx" rel="nofollow">this page</a>, so an end-user downloading the font wouldn't necessarily know what they had agreed to in using the font without having also downloading the license. I'd recommend that the manual or EULA be bundled with the font in a common zip.</p>
      <p>I realize this isn't SBL's forum, but I really like the idea of a non-profit font foundation funding the development of open source licensed fonts. Similarly, I'd like a foundation to help fund the development of an open source OCR engine like <a class="freelinking external" href="http://hocr.berlios.de" rel="nofollow">hOCR</a> that can recognize different typefaces of Hebrew with or without nikkud. Perhaps if there is interest, SBL could take the lead or partner with another project on getting this going.</p>
