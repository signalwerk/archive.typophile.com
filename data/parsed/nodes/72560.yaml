    html: <p>Just to announce we've released our version 1.6 of our <a href="http://opensiddur.org/tools/fonts" rel="nofollow">Open Siddur open source and Unicode Hebrew font pack</a>. Over 80 fonts shared under the GPL, GPL+FE, or OFL font licenses. (These are fonts that are both free-without-fee, free for publishing without restrictive terms compatible with other licenses in the free/libre licensing ecosystem, and free for adoption, adaptation, and redistribution.) The font pack includes fonts by Michael Cunliffe Thompson, SIL, the Culmus Project, HaGilda, Refoyl Finkl, and others . Eleven fonts supporting the full range of niqud and t'amim. A PDF is available with a full list of the Hebrew fonts included in the font pack.</p>
