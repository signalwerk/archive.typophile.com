    <p>By my count there are now three <a href="/wiki/Hebrew" class="freelinking" rel="nofollow">Hebrew</a> fonts that are licensed with open source licenses:</p>
    <ul>
    <li>The SIL (Summer Institute of Linguistics) <a class="freelinking external" href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=EzraSIL_Home" rel="nofollow">Ezra SIL</a> font</li>
    <li>David Perry's <a class="freelinking external" href="http://scholarsfonts.net/cardofnt.html" rel="nofollow">Cardo</a> (using SIL's Open Font License version 1.1)</li>
    <li>and the Culmus Project's <a class="freelinking external" href="http://culmus.sourceforge.net/ancient/index.html" rel="nofollow">Ancient Semitic Scripts</a> family of fonts including Keter YG (using GPL v2 with the font exception clause).</li>
    </ul>
    <p>The willingness of these projects to open source the development, modification, and adaptation of their fonts is, I think, both noteworthy and laudable. I would love to see <a class="freelinking external" href="http://www.sbl-site.org/educational/BiblicalFonts_SBLHebrew.aspx" rel="nofollow">SBL</a> follow the lead of SIL in opening up their font, currently restricted to scholarly and educational use only.</p>
    <p>Given the twenty year history (at least) of Hebrew font development, I'm concerned that there are some abandoned or orphaned Hebrew fonts. Some of these were made "free" prior to the formulation of any of the popular open source licenses (or GPL's font exception clause). Others were developed prior to Unicode 4+. Any contribution of these older fonts to the cultural commons would be a great boon for open source projects committed to providing freely licensed resources for wide adoption and adaptation.</p>
    <p>If anyone here knows of some fonts that would be good targets for open source licensing, I'd like to hear from them.</p>
    <p>Thank you.</p>
    <p>Sincerely,<br>
    Aharon Varady<br>
    Founder &amp; Director<br>
    The Open Siddur Project<br>
    An open source (Print-to-Digital-to-Print) Design Your Own Siddur Project<br>
    <a class="freelinking external" href="http://opensiddur.org" rel="nofollow">http://opensiddur.org</a></p>
