    html: |-
      <p><em>I would love to see SBL follow the lead of SIL in opening up their font, currently restricted to scholarly and educational use only.</em></p>
      <p>This isn't SBL's decision to make. The terms of the license agreement are part of a contract between SBL and Tiro Typeworks (me), and I retain the intellectual property rights to the SBL fonts. The SBL license can't be changed without re-negotiation of that contract. I'm not in principle opposed to open sourcing fonts, but I'm not in favour of just giving away things that I own.</p>
      <p>The SBL Hebrew font isn't restricted to scholarly and educational use only, it is restricted to non-commercial use <em>by those who have not contributed to the cost of its development.</em> Anyone who wants to use the font in a commercial project or product can do so by becoming a member of the SBL Font Foundation or by making an appropriately sized contribution to the foundation. This funds further font development, and obviously SBL are interested in recouping some of their previous investment from commercial use of the fonts.</p>
      <p>It should also be noted that the Biblical Hebrew layout intelligence that is implemented in the SBL Hebrew OpenType Layout tables <em>is open source,</em> and is freely available to and usable by anyone who wants to incorporate it into their own Hebrew fonts. What's not open source is the particular typeface design embodied in the SBL Hebrew font. Ralph Hancock and I collaborated on the development of this layout intelligence, and we made it open source under the MIT license with the intention of encouraging the development of more Unicode and OpenType compliant fonts for Biblical Hebrew. We chose the MIT license because we didn't want to put any restriction on the use of that layout intelligence, but to give commercial, open source and free font development the same encouragement.</p>
