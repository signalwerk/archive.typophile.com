    <p>Hi there<br>
    I have a problem with my Adobe FDK build OTF fonts in InDesign CS4. As you can see, the selection of text is only from the x-height down to somewhere below the baseline. And when change the text, it's size or style the space around the black selection does not change/update. Very annoying. What could be wrong?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/error_4719.jpg"></div><p></p>
    <p>Thanks,<br>
    Claus</p>
