      <p>Next similar is <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=Moria%20-%20Regular&amp;fid=e2164d7a243a07594290ee23ce1e1e16&amp;fsize=60&amp;text=ADRENALINE%20OUTDOORS&amp;wrap=2" rel="nofollow">Moria</a></strong> by  Russ Herschler (Free for Personal Use)</p>
