      <p>Typophile is not a democracy. Typophile is owned and administrated by members of the Punchcut design studio in San Francisco. Without the time and devotion that they give—for free, after hours, when they should probably be with their spouses, families, children, friends, etc.—there would not be a Typophile for us to use. They make the code, they pay the bills (rather high bills!), they make the rules. Yes, reality is that harsh.</p>
      <p><em><br>
      &gt;why not using fonts designed with absolute perfection hundreds of years ago, the kind of ones everyone would actually not discuss about?</em></p>
      <p>Ummn, another Nota Bene… we cannot use fonts designed 100 years ago. Those were metal types. At best (for you), we could only use contemporary digital versions of those fonts. There is a big difference here!</p>
      <p>And lastly, I doubt that the Typophile administers and moderators would get so excited about old fonts. Many of us are type designers ourselves, or have worked in the type industry, and what we really care about is making and seeing new designs. Since fonts were made already "with absolute perfection hundreds of years ago," according to you we should all pack up our bags and go home, right? Thankfully, as I said at the top of this post, that isn't a possibility, because even those old fonts won't show up on anyone's computer screens automatically! Or at least until someone invents a technology where you can pour old metal type sorts into the top of a computer, and then magically see letters dancing properly on the screen.</p>
