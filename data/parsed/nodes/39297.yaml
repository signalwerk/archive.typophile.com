      <p>Vanina,<br>
      How it works is that Punchcut pays for the web site and the maintenance out of their own pocket. The labor is all done by volunteers with jobs and families and bills to pay like the rest of us. They do it in their spare time and are hardly ever thanked for their efforts. Punchcut tries to support the typography community worldwide buy giving us all this venue to speak and even complain about all things typographic. Sometimes they try to recoup a small bit of the cost to support the site by getting foundries or designers to sponsor a very small ad or use a typeface for headings for a fee. They also sell T-shirts to help with the cost. There is no drama or guilt trip intended by Punchcut or anyone else. Typophile is a community of people with an interest in typography. We don't agree with each other most of the time just like most groups of people. There is no "them and us". There is just dialogue. Sometimes you like it, sometimes you don't. No one says you can't voice an opinion but don't expect your opinion to cause someone else to always take action on your behalf.</p>
      <p>ChrisL</p>
