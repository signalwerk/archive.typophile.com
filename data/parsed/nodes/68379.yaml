      <p>I appreciate both comments. Thank you!</p>
      <p>I think the idea of a fingerprint scanner is great. I wonder if it can be adapted to work with type?</p>
      <p>The other thing I might be able to do is to have some brilliant computer science student write an edge-identification program for me, then we could just feed it scans, and let the database find similar edges.</p>
      <p>Once again, thank you!</p>
      <p>Brian</p>
