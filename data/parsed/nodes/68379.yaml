      <p>&gt;My idea is to scan the profile of a character in a font, then to make a digital record of the profile. Then, I would like to encode a series of numeric values for the size, position and shape of the various type nicks</p>
      <p>Have you considered adapting biometric identification (fingerprint, palm print, face, iris) software and hardware? All of those basically identify lines and curves and convert them into numeric values. A USB fingerprint reader might work just fine.</p>
