      <p>I thought about the same problem, when I started to print and scan my Font Collection of lead letter fonts:<br>
      <a href="http://www.bleisetzer.de/schriftensammlung.html" title="http://www.bleisetzer.de/schriftensammlung.html">http://www.bleisetzer.de/schriftensammlung.html</a></p>
      <p>Here I show a full character set with the following information:<br>
      font name<br>
      foundry<br>
      year of first produing this font<br>
      developer<br>
      Groups, using DIN 16518.<br>
      I upload a picture of the full character scan.</p>
      <p>The next problem, I saw, was to find a solution for an internal database. This was, what the website archive could not solve.<br>
      And I found another way, which might help you.</p>
      <p>I took Excel.<br>
      Included name, foundry, year of production, developer (and could, of course, add sizes, which I own, archive numbers of cabinets and case). And in the last column of the Excel file I wrote a link to the picture of the scanned characterset, together with a small picture of this it into the column.</p>
      <p>The big advantage now is:<br>
      I can sort the Excel file in every way I want.<br>
      I can sort by developer, by groups. Or (in your case) e.g. sorting by all 14 p sized fonts or whatever. From the sort file I can generate a PDF, what I offer to my visitors on my website for downloading. The PDF (this is not ready yet) can be generated, so the link with the picture of the character set, can be choosed.</p>
      <p>For my needs its a very satisfying solution.</p>
      <p>Georg</p>
