    <p>Monotype Imaging Adds the Bradley Type Handwriting Fonts into the ITC Typeface Collection</p>
    <p>Newest Releases Extend the Versatility of Designer Richard Bradley's ITC Bradley Hand Fonts </p>
    <p>Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, has released the six-font Bradley Type™ family of handwriting fonts into the company's ITC® typeface collection. The newest additions can be licensed and downloaded from Monotype Imaging's Fonts.com, ITCFonts.com and Linotype.com stores. Bradley Type is also available for website design from Fonts.com Web Fonts. </p>
    <p>Designed by calligrapher, lettering artist and type designer Richard Bradley, the latest design is intended to be a versatile counterpart to his ITC Bradley Hand™ fonts, released in 1995. "Typefaces are rarely designed in response to public demand, but that's exactly what led Richard back to the drawing board to create Bradley Type," said Allan Haley, director of words and letters at Monotype Imaging. Bradley said, "After listening to so many graphic designers ask for a version without ITC Bradley Hand's rough edges, I knew I had a mandate."</p>
    <p>During the design process, Bradley set out to retain the relaxed spontaneity of a handwritten look but with a more refined, condensed appearance than ITC Bradley Hand, which is more suitable for small blocks of body copy. The new Bradley Type family addresses larger text sizes for use in a diverse range of projects such as posters, banners, signage and advertisements. </p>
    <p>Availability<br>
    Bradley Type is available in weights of regular, bold and heavy. A complementary italic design is also available in all three weights. In addition, Bradley Type includes a suite of ligatures for each font, which extends the value and versatility of the family. </p>
    <p>Based on the OpenType® cross-platform format, Bradley Type fonts and the Bradley Type family pack can be viewed, purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a> and <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. Bradley Type is also available for website design to commercial subscribers of Fonts.com Web Fonts. Further information is available at <a href="http://www.bradleytype.com" title="www.bradleytype.com">www.bradleytype.com</a>. </p>
    <p>Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973, or in Europe at (+44 0)1737 765959, or 001781 970-6020, option 2. Linotype may be reached at +49 (0) 6172 484-418. Customers from other parts of the world may dial 001 781 970-6020 (U.S.). </p>
    <p>About ITC<br>
    ITC (International Typeface Corporation) is a Monotype Imaging brand and typeface collection that represents classic, high-quality typefaces for design professionals and brand managers. Established as a type manufacturer in New York City in 1970, ITC is rooted in American ingenuity and diversity, reflected by the originality and range of ITC designs. Today, typefaces are released into the ITC collection on an ongoing basis from some of the world's most talented type designers. ITC's printed publication, U&amp;lc, the International Journal of Typographics, is available for free download in a digitized form from the Fonts.com blog. Every month until completed, new volumes will become available, each representing a year's worth of the quarterly editions that were read by type enthusiasts during the publication's hard-copy lifespan, from 1974 to 1999. </p>
    <p>About Monotype Imaging<br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. ITC and U&amp;lc are trademarks of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Bradley Type, ITC Bradley Hand and ITC Franklin Gothic are trademarks of International Typeface Corp. and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. OpenType is either a registered trademark or trademark of Microsoft Corp. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
