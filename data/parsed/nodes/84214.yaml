    <p>Hi folks!</p>
    <p>I'm searching for this special Old English font like forever,<br>
    hope someone can help me with this...</p>
    <p>The font looks like this:</p>
    <p><img src="http://www.tattoo-designs-of-all-kinds.com/images/tattoo-lettering-fonts-Old-English.gif"></p>
    <p>Now I'm looking for exactly this font!</p>
    <p>I know there are a lot of similar fonts, some of the letters may be quiet likely<br>
    in those fonts, but look at, for example the letters U, V, W or the H.</p>
    <p>Those are different to all the other Old English fonts i found.</p>
    <p>I don't know if this is the original Old English font or what the name of the font is,<br>
    but I would be very happy to finaly get this font!</p>
    <p>Don't have to be a free font, be willing to pay for it if necessary.</p>
    <p>Thanks in advance!</p>
