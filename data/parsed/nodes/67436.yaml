  html: |-
    <p>I am looking for a font "Flammanion" which is a URW font included with the Gerber Omega CP software. I don't use Gerber software. I called Gerber, they were no help besides telling me that the font was not available for purchase as a TTF. They can not even send me a jpg/pdf to let me know what it looks like. Has anybody heard of this font? Is it similar to another font? I basically need the following letters in a vector format:</p>
    <p>NAMASTE<br>
    Namaste</p>
    <p>It would probably be enough if I can see the font / these letters in an image file so I can match or rebuild. Any ideas anybody?</p>
