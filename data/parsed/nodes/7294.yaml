    html: <p>There comes a point when dwelling on things like rag on a b-card doesn't make a whole lot of sense. Every card will have different contact info, so there's only so much you can do. <br> <br>If it is a huge deal, it looks like the URL is the culprit. I'd suggest just droping the 'www.' (provided you also check that the server is configured to not need it).</p>
