    <p>Hello <br> <br>This forum is great and I've learned a lot from reading the posts over the last few months.  <br> <br>I'm a grad student and I'm working on this project for class. The company, "FuseBox" makes a modular shelving system that consists of uniform wooden cubes that slide together via slots cut in the sides of the cubes. I'm attaching a jpeg of the logo. Also  I'm attaching pdfs of a business card, envelope and letterhead. <br> <br>The intersecting squares/grid pattern on the back of the pieces is essentially the design of the shelving once it's assembled. <br> <br>I have two slightly different versions of the letterhead -- do you have a preference? <br> <br>I'm at the point in this assigment where I can't really make significant changes to the logo but any comments you have on the stationery / business card would be great. My teacher seems hung up on the degree of the rag in the contact info, trying to fiddle around and change wording, etc. to make the rag more even. I don't really understand this since it's obviously flush left and it's not like a running column of text people would be trying to read like in a magazine, book, etc. When you're looking at an address, phone number, web site, etc. don't you expect them to be uneven in line length? I actually think maybe that makes it EASIER to read -- i.e. spot the line you're looking for (phone number for instance) and pull it out. What do you think? <br> <br>Thanks for any thoughts you have. <br> <br>Rob<img src="http://www.typophile.com/forums/messages/29/51821.jpg" alt="logo"><!--attachment: Bus_Card-51822.pdf*mime_pdf.gif*application/pdf*566.6*bus%2e+card*Bus+Card%2epdf --></p><center><br>
