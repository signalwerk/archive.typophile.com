    html: <p>The mini is almost as powerful as my TiBook, which runs most apps (such as CS) just fine. The mini is very attractive for a lot of reasons. It just doesn't seem <i>robust</i>, which is something people like us seem to need/like. Not expansion-friendly, etc. <br> <br>That being said, having to move two full-size towers makes me year for a computer that I could cradle in one hand, along with my limited desk space...perhaps I'll just get Apple's stamp-sized G7 in 2010.</p>
