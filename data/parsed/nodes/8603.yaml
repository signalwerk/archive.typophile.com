    date_raw: 12.Jan.2005 3.29pm
    votes: null
    html: <p>Well, either buy the mini for $500 and upgrade in 2 years for another $500, or by a $1800 tower now, and then uprgade it over the next 4 years piecemeal.  <br> <br>Also, I bet within a week or so you'll start seeing instructions on how to add RAM yourself to it. <br> <br>Now, if you're doing super-high-res Photoshop work, well, then maybe you want to go with a tower and maxed out RAM...but that'll cost you much more than than the Mini. <br> <br>What would be cool is if you could connect multiple MINIs together to increase processing and RAM...sort of a mini-supercomputer. ;o) <br> <br>Finally, I'm running a bunch of design software on an old Powerbook 665mhz machine. The minis are what? 3 times faster than that?</p>
