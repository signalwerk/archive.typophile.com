    html: <p>I assume that you would want better video performance than you would get in the mini. It is easy to add an external drive via firewire. <br> <br>If you deal with large files, a desktop mac would be a better choice. It also seems that the ram upgrade is expensive enough to put you in the desktop range by the time you make that addition. <br> <br>Shop the refurbs from the Apple site for nice deals.</p>
