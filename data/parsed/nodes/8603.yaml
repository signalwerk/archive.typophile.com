    date: 2005-01-12T14:09:00
    date_raw: 12.Jan.2005 2.09pm
    votes: null
    html: <p>I've run PS and the CS pkgs on a Cube (G4, 500Mhz.); a full install of apple software, Panther, full CS, 1000 fonts is only about 13 Gig storage. The key for me is RAM. On a G4, Panther and these apps work fine with at least 1Gig of memory, but will struggle at 512Meg. A separate Firewire backup drive is nice, also.  <br> <br>I feel the miniMac is more for web, email, wp, and PS Elements, not so much for serious work. <br> <br>JMHO. <br> <br>Regards <br> <br>John</p>
