    <p>Hello All, <br> <br>Since yesterday's announcement of the Mac Mini, I've been considering picking up one of these for the home. My only concern is upgradability (you can't upgrade the memory or hard disc yourself) and with power. How will the 1.4GHz G4 hold up to Design apps like the Creative Suite provided I get one with at least 512MB of RAM. My only experience with CS is on a G5 and on PCs. Any suggestions appreciated.</p>
