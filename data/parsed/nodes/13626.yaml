    html: |-
      <p>On the longest sentence spread:</p>
      <p>Actually, this was a spread displaying two consecutive sentences from James Joyce’s <em>Ulysses</em>. Both sentences have more words than Victor Hugo’s famous sentence from <em>Les Misarables</em>.</p>
      <p>Each page was composed in six “newspaper style” columns set in what looks like ITC Garamond Book. The first sentence opens with the word “YES” in large caps, and the last sentenced ends with “YES” in large caps.</p>
      <p>On the longest words.<br>
      This was a theme used from time to time as part of Herb’s fascination with long words.</p>
      <p>On the longest town name.<br>
      In one of these articles they dispayed the name of a village in New Zealand containing 70 consecutive characters:</p>
      <p>Raumatawhakatangakoauauatamateapokaiwhenuakitanantahuwhakatamahangakoa</p>
      <p>which translates: “Hill crest where the traveller Tamatea piped on his nose flute for his beloved one.”</p>
      <p>I retreived all the above info from U&amp;lc page reproductions in <em>Herb Lubalin</em> by Gertrude Snyder &amp; Alan Peckolick.</p>
      <p>I just don’t have the patience to dig through my archieves for the original U&amp;lc issues, which are hermetically sealed behind a brick wall in my wine cellar (not!).</p>
      <p>All of this reminiscing must seem boring to young readers, especially since we’re not showing images. I guess it’s sort of like old coots talking about a baseball game from the 1940s.</p>
      <p>——————————————————————————-<br>
      Yes, I’m old, and that’s the TRUTH (raspberries)!</p>
