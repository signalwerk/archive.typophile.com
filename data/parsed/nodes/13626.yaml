    html: |-
      <p>I haven’t seen the <a href="http://www.markbattypublisher.com/servlet/book_view?number=23" target="new">newly released book</a> (edited by <a href="wiki/John D Berry" class="wiki-create">John D. Berry</a>), but I’m sure there is a lot of background details and stories behind the graphic phenomenon of U&amp;lc.</p>
      <p>Most of the early editions were representative of the <em><a href="wiki/New York School" class="wiki-create">New York School</a></em> style of design, made popular by <a href="wiki/Herb Lubalin" class="wiki-create">Lubalin</a>, <a href="wiki/Seymore Chwast" class="wiki-create">Chwast</a>, <a href="wiki/Milton Glaser" class="wiki-create">Glaser</a> (<a href="wiki/Pushpin Studios" class="wiki-create">Pushpin Studios</a>) to name only a few of the giants involved. Also, it became a gallery of the superb work of <a href="wiki/Tom Carnase" class="wiki-create">Tom Carnase</a>, <a href="wiki/Tony Di Spigna" class="wiki-create">Tony Di Spigna</a>, <a href="wiki/Ed Benguiat" class="wiki-create">Ed Benguiat</a>, again, only naming a few.</p>
      <p>But the most brilliant aspect of the publication is that it became a “mother” of a marketing tool for the infant <a href="wiki/ITC" class="wiki">International Typeface Corporation</a>. This came about through the passionate leadership of Aaron Burns.</p>
      <p>ITC used U&amp;lc to sell the idea of “Licensing” typeface designs. In other words, it made it a <em>moral</em> issue not to use ITC typefaces unless they had the official “seal of approval”. A list of the ITC licensed foundries was published towards the back of each issue.</p>
      <p>As the popularity of ITC typefaces grew, this added a little pressure for more and more foundries and manufacturers of typesetting equipment to sign on with ITC.</p>
      <p>What made this so unique, is that ITC through U&amp;lc had found a way of popularizing their designs even BEFORE they were released and available for typesetting. </p>
      <p>You can imagine how many young designers who read U&amp;lc looked for the very first opportunity to emmulate their heros by specifying ITC typefaces.</p>
      <p>——————————————————————<br>
      Yes, I’m old, but I’m back in style!</p>
