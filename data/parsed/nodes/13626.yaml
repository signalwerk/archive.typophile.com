      <p>Jeff,</p>
      <p>did you see your first U&amp;lc issue in school, or did you get it in the mail?</p>
      <p>I’m trying to figure out how extensive the first few mailings were. I know that I used to buy typesetting from <a href="wiki/Photo-Lettering, Inc." class="wiki-create">Photo-Lettering, Inc.</a>, in NYC, so that’s how I got on the mailing list.</p>
      <p><a href="wiki/Milton Kaye" class="wiki-create">Milton Kaye</a>, founder and publisher of <a href="wiki/GraphicDesignUSA" class="wiki-create">GraphicDesignUSA</a>, told me he gave <a href="wiki/Aaron Burns" class="wiki-create">Aaron Burns</a> his mailing list of subscribers. Obviously Aaron sent them to schools and colleges around the country as well.</p>
      <p>If you or anyone can add any info I’d appreciate it as I would like to find out how Aaron built the mailing list for the first year of U&amp;lc. I guess one person to ask is <a href="wiki/Ed Rondthaler" class="wiki-create">Ed Rondthaler</a>, who was one of the three founders of ITC. If I’m not mistaken, I believe Mr. Rondthaler recently celebrated his 100th birthday.</p>
      <p>He and <a href="wiki/Ed Benguiat" class="wiki-create">Ed Benguiat</a> will be speakers at TypeCon2005 on Friday, July 22nd if someone in attendance is willing to ask him.</p>
      <p>———————————————————-<br>
      Yes, I’m old, but I’m back in style!</p>
