    html: |-
      <p>Sorry Stephen, not this year, but I’ll be there in spirit. Be sure to say hello to Ed Benguiat, Erik Spiekermann and Allan Haley for me.</p>
      <p>Chris, it’s a treasure. I also have the same ITC specimen book <em>THE ITC TYPEFACE COLLECTION</em>. It’s great since you can see all of the original alternates designed for Avant Garde Gothic, ITC Benguiat, ITC Zapf International Italics (no alternates for the roman), etc.</p>
      <p>“26 good reasons to use (name of typeface)” was the running sentence used for each weight of a typeface. </p>
      <p>In the back, there is a definitive list of all the designers of ITC typefaces up until 1980, a detailed explaination of the “ITC Concept” and instructions to designers for submission of type designs.</p>
