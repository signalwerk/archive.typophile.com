  html: <p>On a designer friend’s coffee table the other day, I came across a big gorgeous book that was nothing but a collection of the best of <a href="wiki/Uandlc" class="wiki-create">U&amp;lc</a> magazine!  (For anyone too young to remember, U&amp;lc, Upper &amp; lower case, was this brilliant oversized typography and design magazine that was around from the 70’s until 1999.)   In any case, it was a “must read” for graphic designers and I’m baffled that I hadn’t heard of this book before.  You can order it straight from the publisher <a href="http://www.markbattypublisher.com">http://www.markbattypublisher.com</a> who has lots of other interesting graphic-design books. (Check out the book about <a href="wiki/graffiti" class="wiki">graffiti</a> in the Paris Underground, it’s fascinating.)</p>
  html_clean: <p>On a designer friend’s coffee table the other day, I came across a big gorgeous book that was nothing but a collection of the best of <a href="wiki/Uandlc" class="wiki-create link-lost">U&amp;lc</a> magazine!  (For anyone too young to remember, U&amp;lc, Upper &amp; lower case, was this brilliant oversized typography and design magazine that was around from the 70’s until 1999.)   In any case, it was a “must read” for graphic designers and I’m baffled that I hadn’t heard of this book before.  You can order it straight from the publisher <a href="http://www.markbattypublisher.com" class="link-external">http://www.markbattypublisher.com</a> who has lots of other interesting graphic-design books. (Check out the book about <a href="wiki/graffiti" class="wiki link-lost">graffiti</a> in the Paris Underground, it’s fascinating.)</p>
