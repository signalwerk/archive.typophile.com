      <p>That portrait of Picasso on the cover of U&amp;lc inspired me to create a portrait of <a href="wiki/Ed Benguiat" class="wiki-create">Ed Benguiat</a> using <a href="wiki/ITC Barcelona" class="wiki-create">ITC Barcelona</a>. We turned it into a poster and sent it to all Compugraphic Type customers.</p>
      <p>One evening after one of Ed Benguiat’s lectures, several designers and myself met him for a few drinks. I framed the portrait of Ed and wrap it up as a present and asked <a href="wiki/Janice Prescott-Fishman" class="wiki-create">Janice Prescott-Fishman</a> (designer of <a href="wiki/Shannon" class="wiki-create">Shannon</a> with <a href="wiki/Renee LeWinter" class="wiki-create">Renee LeWinter</a>), if she wanted to present it to him. Unbeknownst to Janice, I inserted a photo of a bikini clad beauty with Janice’s face superimposed which covered the poster before I wrapped it.</p>
      <p>Ed opened the present (with the back of the framed picture facing Janice), looked up a Janice, smiled and thanked her very much. Then he turned it around to show all us all. What a fun night! Janice, wherever you are, I hope you’ve forgiven me.</p>
      <p>———————————————————<br>
      Yes, I’m old, and a joker as well!</p>
