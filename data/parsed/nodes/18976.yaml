  html: |-
    <p>I'm looking for a font similar to the one in this image. I hope the attachment shows up(!)<br>
    [also see the logo "Sunbelt" at: <a href="http://www.sunbeltsnacks.com/];">http://www.sunbeltsnacks.com/];</a> if not, I think that it is <strong>Textile</strong>, an Apple font. Can anyone suggest a similar font in a Windows format? The closest I've found so far is called<br><strong>Rostrum</strong> ( <a href="http://www.myfonts.com/fonts/canadatype/rostrum/">http://www.myfonts.com/fonts/canadatype/rostrum/</a> ). Another somewhat similar one is<br><strong>Challenge Bold</strong> ( <a href="http://www.myfonts.com/fonts/letraset/challenge-bold/">http://www.myfonts.com/fonts/letraset/challenge-bold/</a> ). Neither is as close as I'd like. </p>
    <p>I see this font used very often on food packaging - cereals, etc - and that's the look I'm after.</p>
    <p>Any suggestions?</p>
    <p>Thanks so much,<br>
    - Paul</p>
