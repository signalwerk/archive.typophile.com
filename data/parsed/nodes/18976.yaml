      <p>I was going to recommend <a href="http://www.myfonts.com/fonts/urw/lucida-cas-d/" target="_blank" rel="nofollow">Lucida Casual Italic</a>, which has a great deal in common with Textile. No coincidence, as both were created by by Kris Holmes. It would have required some artificial bolding.</p>
      <p>Never mind that, though. I just happened across the recently released <a href="http://www.myfonts.com/fonts/urw/lucida-big-casual/" target="_blank" rel="nofollow">Lucida Big Casual T Demi Italic</a> - which is a veritable match for Textile.</p>
