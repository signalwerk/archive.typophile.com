    <p>Hi Typophiles,<br>
    Here is a random question about Business card sizes. I got a hold of a couple BC’s of random sizes. Although I heard it’s best to stick to the common (3.5 x 2 in) just because it fits BC’s cards binders and such, I found some other sizes interesting. I don’t think going longer than 3.5 in is functional but shorter than 2 in looks nice. I found some specs<a href="http://www.clickbusinesscards.com/faq/cards_cut_smaller.html" rel="nofollow"> online</a> about sizes and said they could make height shorter than (in metric system) 53mm and showed a 89mm by 45mm card, I like that size but is there really another standard size besides 3.5 x 2 in? What are the pros and cons?</p>
    <p>Here are some size examples I found:<br>
    • WeWorkForThem ---&gt; 3.75 x 1.75 in (too long and doesn’t fit BC holder)<br>
    • Alterpop ---&gt; 3.5 x 1.60 in (maybe a bit too short)<br>
    • w.e.a clothing for children ---&gt; 3.5 x 1.5 in (way too short in my opinion)<br>
    • Sequence ---&gt; the closest measure to this BC was on my pica ruler 21p3 x 10p6 (about 3.5 x 1.75 in) in my opinion the most comfortable size.</p>
    <p>Thanks,<br>
    kco</p>
