    date_raw: 16 Aug 2006 — 9:34pm
    votes: null
    html: |-
      <p>It alludes to things like: let there be, being (both noun and verb), god, etc. But<br>
      it's not just meaning, the letter eh's relevance to us is also... transcendental?<br>
      For example, above the khoran (altar) of every Armenian church (at least for Apostolics, who constitute the vast majority) you will find a large letter "eh" hovering, by itself.</p>
      <p>hhp</p>
