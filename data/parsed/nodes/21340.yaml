      <p>I worked at a shop where a German visitor presented his card. It was a huge thing, about the size of a wedding invitation, and he presented it with two hands. The boss was very impressed, but a few days later realized the card was useless as he couldn't file it. He wrote the information on the back of one of his cards.</p>
      <p>Kinda makes the original one worthless.</p>
      <p>The only larger cards that can be useful are ones that fold to the regular size, and then the important information all has to be on one side, so it can be inserted in a card sleeve folded so the info shows.</p>
