      <p>Yes, it's a traditional brush-written form of the<br>
      letter "eh", which has great spiritual resonance and<br>
      meaning in our culture; among other things, it means<br>
      "it is". When I was deciding on a logo for my foundry<br>
      many years ago, it seemed the natural choice.</p>
      <p>BTW, the wine was Armenian too.  :-)</p>
      <p>hhp</p>
