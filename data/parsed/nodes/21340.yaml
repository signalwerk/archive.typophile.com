    date: 2006-07-18T14:00:00
    date_raw: 18 Jul 2006 — 2:00pm
    votes: null
    html: "<p>You can also use printing to disguise the standard dimensions; embossed rules along the top and bottom, thick bars of color on sides, breaking up the width horizontally, etc. etc. If the layout and design of a card is compelling *and* it fits standard holders, all the better. Then there are all those other things you can use to differentiate: mylar, plastic, vellum, letterpress, crazy inks, rounded corners, die cuts, laser cuts, heavier card, duplex card, metal foils.....</p>"
