    html: |-
      <p>Wow, this is really your first try at making a font?! Amazing!</p>
      <p>Well here are some comments from me. Take with a bit of salt because I'm not at all an expert.</p>
      <p>Proportions are very good; this does remind me of Arno.<br>
      Terminals on C could be heavier.<br>
      I'm worried the curves of D and O may need to be heavier.<br>
      Foot serifs on F and P could be wider on the right to balance the top-heavy forms.<br>
      M may be slightly too narrow; N too wide?<br>
      Upper counter of R seems too high; I think I'd make the top of the bowl a bit darker than the bottom where the leg joins.<br>
      S may be falling backwards but it's hard to judge.<br>
      Crossover at centre of W may need some offset.</p>
      <p>Lowercase<br>
      The contrast on e seems a bit too vertical. Particularly the nw segment looks too dark for classical contrast.<br>
      o seems to need some optical correction; is it symmetrical?<br>
      s may need some more weight in the serifs and perhaps a hair less in the spine.<br>
      Left arm of y seems to get rather fat at the baseling.</p>
      <p>Numerals<br>
      1 could have a larger flag.<br>
      6 needs a larger bowl I think.</p>
      <p>Great stuff.</p>
    html_clean: |-
