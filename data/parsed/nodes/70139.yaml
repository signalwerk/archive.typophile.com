    votes: null
    html: |-
      <p>The italic lowercase s is optically tilted more, I think it’s the upper terminal doing this.</p>
      <p>The italic lowercase w looks spindly on the left side, with the middle being very prominently dark. Shift weight from one to the other.</p>
      <p>I think that italic r, n, m are slightly closer to vertical than the letters with straight ascenders. This makes them seem out of place. You don’t seem to be aiming at a very baroque italic, judging by the consistent pen angle, so the differences between them and the others should be minimized.</p>
      <p>Your italic p bulges out too much on the top right.</p>
      <p>The italic a looks weak at the top, but I’m not sure this is a bad thing yet.</p>
      <p>I like the f, and the y is nice as well. I haven’t made up my mind about the k or the g yet.</p>
      <p>Great work! Keep at it!</p>
