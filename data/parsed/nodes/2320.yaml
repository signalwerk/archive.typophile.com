    date_raw: 7.Dec.2003 7.51pm
    votes: null
    html: <p>Mike,  <br>Thanks for uncovering that story. Mr Martin seems like a bit of an eccentric, but aren't we all?  <br> <br>My understanding of many of the URW fonts was that when they had one of the few (along with Bitstream) places where foundries could get typefaces digitized (with their tool Ikarus), they made a deal that they could sell every font they digitized as long as they changes the name (hence all the Latin-sounding names for familiar-looking fonts).   <br> <br>So Bitstream and URW truly do not belong in the bucket with other 'cloners'. I don't know what the Corel story is, although you say they made a deal to allow them to sell all these fonts re-named? Can you point to anywhere that this is documented just so I can clear up my own impression of them? <br> <br>As for the other foundries imitating the fonts of others, this is a practice that goes back to early type history.  I would love it if a type historian could unravel some of the 'genealogy' of many of these fonts.  Linotype's "Memphis" is an example of a metal type they created in the 30's to compete with Monotype's "Rockwell", so that they could offer the same kind of typefaces to their customers (I think I named the right fonts with their foundries, but apologies if I got it mixed up). The point being, just as in Marks tale of the Arial's of Monotype, that foundries are just as determined to keep abreast of their competition as any other business is. Still, these are newly designed, if not original, and not literally copied from each other's masters, and I think our intent in slamming certain suppliers (I can't call them foundries) is that they have no skill to design anything. They just copy the work of others and market it at prices that devalue all the other fonts, and give an excuse to folks who think if font companies can be corrupt, why is it wrong to steal fonts.   Aaarghhh! <br> <br>This has been an interesting thread, and again, Mike I think you were right to make your points and it was great work to find out the story of that 'g'. Now I wonder how it survived to be in the sample that William posted?</p>
