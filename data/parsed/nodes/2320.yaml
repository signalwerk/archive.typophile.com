    html: "<p>Hahaha, no, it's a concert of the Harmony band her  <br>brother and his wife play in. We're all musicians:  <br>a little over 10 years ago my sister started playing  <br>clarinet in the local Harmony band. My brother, who  <br>didn't play any instrument back then, met his wife  <br>there, a multi-instrumentalist (clarinet, keyboards  <br>and now bass tuba). After a couple of years he picked  <br>up the trombone. They asked me to join as percussionist. <br>My wife's brother -trombone too- was next, and he  <br>brought my  then future wife in, who plays keyboards  <br>and saxophone. My wife's brother started playing in  <br>a second Harmony band, where he met his wife, a  <br>flute player. Confusing, innit? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>The Claude Coppens concert is Thursday. We'll have a  <br>baby sitter for that one. <img src=\"http://www.typophile.com/forums/clipart/wink.gif\" border=\"0\"> <br> <br>THX for the compliment, Everybody at the music ensemble  <br>and the composer were very enthousiastic about the poster. <br>I just did a programme for another concert, but I had to  <br>rush and didn't have time to post it in the Critiques. I was  <br>very pleased how that one turned out, but the printer  <br>botched it up unfortunately. <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"></p>"
