    date: 2003-12-06T12:20:00
    date_raw: 6.Dec.2003 12.20pm
    votes: null
    html: "<p>That's the whole problem with URW fonts: URW Agenda  <br>is a rip-off of Clearface Gothic, as is the sample. Back  <br>in FontShop we bumped into those quick-steal-jobbies  <br>all the time. As Mike explained so well, all they did was  <br>change the most distinctive characters into something  <br>else, slant the roman instead of providing true italics, <br>digitally extrapolate some extra weights, maybe add  <br>an outline or rounded version, and bingo: <blink><b>1000 fonts  <br>for $24.95</b></blink> whattadeal! <br> <br>[edit] <br>I was a bit hasty in my phrasing: it should read \"URW  <br>Agenda is a <i>version</i> of Clearface Gothic\". Sorry, my bad. <br>I was convinced that the sample was not URW Agenda  <br>but one of \"those quick-steal-jobbies\". Excuse me for my  <br>error of judgement of both URW and the ID.</p>"
    html_clean: "<p>That's the whole problem with URW fonts: URW Agenda  <br>is a rip-off of Clearface Gothic, as is the sample. Back  <br>in FontShop we bumped into those quick-steal-jobbies  <br>all the time. As Mike explained so well, all they did was  <br>change the most distinctive characters into something  <br>else, slant the roman instead of providing true italics, <br>digitally extrapolate some extra weights, maybe add  <br>an outline or rounded version, and bingo: <blink><b>1000 fonts  <br>for $24.95</b></blink> whattadeal! <br> <br>[edit] <br>I was a bit hasty in my phrasing: it should read \"URW  <br>Agenda is a <i>version</i> of Clearface Gothic\". Sorry, my bad. <br>I was convinced that the sample was not URW Agenda  <br>but one of \"those quick-steal-jobbies\". Excuse me for my  <br>error of judgement of both URW and the ID.</p>"
