    html: <p>Here is a side-by-side comparison using MT Clearface Gothic Demi. I can see that a number of letters (C, c, M, and w) besides the g are not identical to Clearface Gothic (CG). However, the similarity is hard to escape, so I think we are looking at a customization that started with Clearface Gothic, and possibly 'borrowed' characters from other fonts, or made new/modified ones. It may be a 're-design' of  CG, although the resemblance gets closer if you stretch the type wider, starting from a lighter weight (which I don't have).<img src="http://www.typophile.com/forums/messages/83/21911.gif" alt="ClearfaceGothicCompare"></p>
