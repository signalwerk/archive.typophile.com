    date: 2003-12-07T10:56:00
    date_raw: 7.Dec.2003 10.56am
    votes: null
    html: "<p>First of all, I found your <b>g</b> William! Read on ... forgive the rant. <br> <br>I've got to speak up here. If somebody who knew no better were to <br>read this thread as it stands, they'd leave thinking that URW is a <br>scumbag font pirate company. I'm <i>really</i> not trying to be contentious <br>here, but I'd like to clarify some things. <br> <br>Yves, you lumped URW into the same paragraph (next sentence, <br>in fact) with \"those quick-steal-jobbies\" and then \"all they did was <br>change the most distinctive characters into something else, slant <br>the roman instead of providing true italics, digitally extrapolate some <br>extra weights, maybe add an outline or rounded version, and bingo: <br>1000 fonts for $24.95 whattadeal!\". This effectively equates them <br>with Southern Software or Bay Animation or any of those other crooks <br>who renamed fonts and sold CD's full of them at a pittance. <br> <br>Now surely you weren't speaking of URW here. If so, I'd honestly <br>like to learn what it's based upon. Specifically, <a href=\"http://www.urw.de/cgi-bin1/dalcgi/english/schnellsuche.htd?searchchar=agenda\" target=\"_blank\"> URW Agenda</a> has no <br>italic, much less a false one or outline or rounded variants. I'm not <br>aware of them doing this with other typefaces either. <br> <br>Secondly, Clearface Gothic is attributed to Morris Fuller Benton. URW <br>also offers <a href=\"http://www.urw.de/cgi-bin1/dalcgi/english/schnellsuche.htd?searchchar=clearface\" target=\"_blank\"> Clearface Gothic</a> and gives proper attribution to Benton, <br>1906. So why offer Agenda as well, if it's meant as a thinly veiled clone? <br>Agenda is attributed to <a href=\"http://www.urw.de/english/schrift/wahl7-set.htm\" target=\"_blank\"> Phil Martin</a>, who, prior reading has led me to <br> believe, was no slouch when it came to designing  at least a few well <br>known and well used fonts in an earlier era.  <a href=\"http://mm2000s.net/index2.shtml\" target=\"_blank\"> See here especially</a>. First <br>hit the Font History button and be ready to hold your cursor over the <br>Stop button in this awkward presentation (at least Agenda is the 2nd <br>font shown). Mr. Martin makes a statement much like Mike's about the <br>letter 'g'. Now hit the Font Graphic button and behold the very 'g' thought <br>to be \"homemade\". <br> <br>So, Martin takes a 1906 typeface and, in 1976, makes several significant <br>modifications to it. Absolutely he ought to have credited Benton. Two years <br>later, Victor Caruso takes that same old typeface and digitizes it. <br> <br>My beef here is that, while I detest the folks like Southern Software who <br>steal, rename and sell, there are so many gray areas to this topic. What <br>occurred with Agenda has occurred to varying degrees with many, many <br>font foundries, some of them large and well respected. An existing typeface <br>was modified, sometimes precious little and called something new. Even <br>worse, in my opinion, has been perpetrated: <a href=\"http://www.ms-studio.com/articles.html\" target=\"_blank\"> 1</a> &amp; <a href=\"http://www.ms-studio.com/articlesarialsia.html\" target=\"_blank\"> 2</a> (Thanks for these articles, <br>Mark. I'm sorry if you didn't intend them to be used this way). <br> <br>My intent is definitely not to paint Monotype black, but to show lurkers who <br>don't know better that ethical gray appears in lots of type foundries and to <br>call, say, ITC and Monotype the good guys and, say, URW and Bitstream <br>the bad doesn't do justice to any of them. I've seen, recently, Bitstream, <br>Corel and, now, URW labelled flatly as fiends, as if it's a known fact </p>"
