    html: <p>I think you're referring to "type specimen." Some font foundries will include a PDF of a type specimen to view. Off my head, <a class="freelinking external" href="http://www.marksimonson.com" rel="nofollow">Mark Simonson Studio</a> and <a class="freelinking external" href="http://klim.co.nz/" rel="nofollow">KlimType</a> has some samples.</p>
