  html: |-
    <p>Hi people,</p>
    <p>Which is the name in english when you have a page or chart of a font and put it in many different sizes, bold, italic, all caps and try them with various spaces?</p>
    <p>By the way, do you know of websites or pictures with some good samples of that? I have to present many of the fonts that i have at work in an A4 paper with this different moves.</p>
    <p>Thanks for any help,<br>
    Sebastiao</p>
