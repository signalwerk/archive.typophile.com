    html: |-
      <p>These are often drawn from scratch. The 'J' is unique. I can find you stuff that comes close, though.</p>
      <p><a href="http://www.fontshop.com/fonts/singles/font_bureau/bureau_grot_black/?sample_text=JAWS&amp;sample_size=60&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">Bureau Grot</a><br>
      <a href="http://www.fontshop.com/fonts/singles/urw/grotesque_no_9_ot_std/?sample_text=JAWS&amp;sample_size=60&amp;acs_ss=-1&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">Grotesque No. 9</a><br>
      <a href="http://www.fontshop.com/fonts/singles/monotype/headline_bold/?sample_text=JAWS&amp;sample_size=60&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">Headline Bold</a><br>
      <a href="http://www.fontshop.com/fonts/singles/mark_simonson/proxima_nova_condensed_black_ot/?sample_text=JAWS&amp;sample_size=60&amp;acs_ss=-1&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">Proxima Nova</a> (more straight)<br>
      <a href="http://www.fontshop.com/fonts/downloads/mvb_fonts/mvb_grenadine_two/?sample_text=JAWS&amp;sample_size=60" rel="nofollow">MVB Grenadine</a> (more comical)</p>
