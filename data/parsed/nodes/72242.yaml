    <p>This is to continue discussion from <a href="http://typophile.com/node/71989" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this thread.</a></p>
    <p>I proposed as a draft of an Irish-style mediuscule sans alphabet:<br><img src="/sites/default/files/old-images/lap_gae_02_5414.jpg"><br>
    .<br>
    As one can see it is not meant as an adaption or revival of some known older Irish typeface. But rather as a reinterpretation of Irish type on the sans ‘instrument’. An experiment, though.</p>
    <p>Michael Everson then was so kind to comment like follows:<br><cite>I find it a bit chilly, but I guess that's OK, as the font is a bit chilly. I dislike the W rather a lot. The hard angle at the lower left of the b is inauthentic. The hard angle at the top left of the F is inauthentic too; follow the f. Same for capital B and L. The ascenders of capital B, H, K, L rise above caps height in many Gaelic fonts.</cite></p>
    <p>*Chilly* – yes! This ought to be chilly. (Maybe this is due to the climate, we have 32…38°C in Central Germany these days… )</p>
    <p>I followed his remarks to quite an extend; see what changed in the next version:<br><img src="/sites/default/files/old-images/lap_gae_02_3_6491.jpg"><br>
    .<br>
    And now it looks that way:<br><img src="/sites/default/files/old-images/lap_gae_03_4410.jpg"><br>
    .<br>
    The b issue is rather obvious. Also the rounding of L. The ascenders of capital B F H K L (P?) are to consider. As you see I did not make them strech above the Capitals height. There are neccessary descenders already and also having ascenders in the uppercase would make the set too disturbed, I believe. However, I changed the angles into offsprings and that may well appear more Irish now.<br>
    .<br><img src="/sites/default/files/old-images/lap_gae_03_tx_4463.jpg"></p>
