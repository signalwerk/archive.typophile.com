      <p>Apologies for hijacking an old thread. The forum does not allow me to make new threads.</p>
      <p>Evertype &amp; Wikipedia both claim the ⁊ – tironian et sign (U+204A) – is used in contemporary Gaelic*, even when following the modern orthography without the insular letters and with letter+h instead of the dotted lenited consonants. I have searched all over for sources to confirm this, to no avail. Does anyone know if this is actually true?</p>
      <p>* “Whenever Irish Gaelic is written, whether in the Gaelic variant or in the Roman variant of the Latin script, the TIRONIAN SIGN ET (…) is commonly found in place of the AMPERSAND &amp;. ”</p>
