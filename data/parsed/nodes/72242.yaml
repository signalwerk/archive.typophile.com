      <p>Andreas... for what this is worth :-)</p>
      <p>Try and bring the exterior "stems" of the W in a bit. i.e. curve them in slightly. I think the "h" is a bit overdone, it does not have to curve in as much to give the same effect. You could also use the sane approach on the n and m.</p>
