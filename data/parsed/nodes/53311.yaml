    <p>I've recently started playing around with ambigrams, and the first one that really worked for me was---fortuitously---my girlfriend's name.</p>
    <p>I'm not sure if it's readable though (since I know what it says, I'm a terrible judge). There are, no doubt, some aesthetic improvements to be made too, but if you can read it, that's a good start.</p>
