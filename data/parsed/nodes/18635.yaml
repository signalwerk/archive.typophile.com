    <p>Hello kind people,</p>
    <p>I'm back to ask a question with a possibly obvious answer.</p>
    <p>I'm using the beautiful face of 'Cooper Std Black' for a current project.<br>
    I've roughed everything out in Photoshop CS, using this lovely font - but upon starting work in Flash, the font appears not to exist on my PC. </p>
    <p>I'm a self taught fly-by-my-pants Flash user so I may well have missed something technical, but unfortunately important.</p>
    <p>Any ideas, I'm puzzled?</p>
    <p>Many thanks in advance of your help.</p>
    <p>:)</p>
