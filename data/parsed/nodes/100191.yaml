      <p>Hey guys,</p>
      <p>A quick update on this front. As you've probably seen from this thread, we've “deputized” @5star and @apankrat to help us out on the spam front. Please join me in wishing them a warm welcome to this new duty.</p>
      <p>We're also looking at enlisting a few new moderators from around the world to help try and keep eyes on the boards 24/7 as we've had in the past. In the meantime, new account creations are passing through a vetting process, and that's already been instrumental in helping us see which accounts are humans and which are clearly bots. I'm also bringing in some local Drupal experts into my office during the next two weeks to get a sense on cost &amp; effort to better block spam and fix bugs moving forward... hopefully allowing our esteemed moderators to focus on more fruitful efforts, like making Typophile a better place to hang out.</p>
      <p>Message me if you've got inputs you'd like me to consider. Thanks-</p>
      <p>//jared</p>
    html_clean: |-
      <p>Hey guys,</p>
      <p>A quick update on this front. As you've probably seen from this thread, we've “deputized” @5star and @apankrat to help us out on the spam front. Please join me in wishing them a warm welcome to this new duty.</p>
      <p>We're also looking at enlisting a few new moderators from around the world to help try and keep eyes on the boards 24/7 as we've had in the past. In the meantime, new account creations are passing through a vetting process, and that's already been instrumental in helping us see which accounts are humans and which are clearly bots. I'm also bringing in some local Drupal experts into my office during the next two weeks to get a sense on cost &amp; effort to better block spam and fix bugs moving forward... hopefully allowing our esteemed moderators to focus on more fruitful efforts, like making Typophile a better place to hang out.</p>
      <p>Message me if you've got inputs you'd like me to consider. Thanks-</p>
      <p>//jared</p>
