      <p>Technically speaking you're right. But, you can contain it, and then nuke it! Also, setting a time limit between posts really helps to slow down bots. Another technique I'd like to try is to run a duplicate site where content is automatically up loaded to a replica site off-line. So when bots strike simply upload a copy of the replica site.</p>
      <p>Blocking whole blocks of IPs gets out of hand, and dynamic IPs come with the territory, so vigilance is our most effective weapon.</p>
      <p>n.</p>
