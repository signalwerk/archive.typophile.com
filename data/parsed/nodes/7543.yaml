  html: <p>Can someone enlighten me please, why is Dcroat glyph   always on “<span class="caps">00D0</span>” unicode index nr. and not “0110” like unicode standard deﬁnes it…(<a href="http://www.unicode.org/charts/PDF/U0180.pdf" target="_blank">http://www.unicode.org/charts/<span class="caps">PDF</span>/<span class="caps">U0180</span>.pdf</a>) <br><br>ps. i thought of posting this to Build subforum, but for unknown techincalreason&nbsp;couldn’t.</p>
