    <p>Dear all,</p>
    <p>I trust you have all seen the results of tdc2, 2010. I have failed to find everyone's opinion on the results. For me, there was one major surprise but I might be wrong.</p>
    <p><a href="http://tdc.org/tdc/tdc2-2010-winners" title="http://tdc.org/tdc/tdc2-2010-winners">http://tdc.org/tdc/tdc2-2010-winners</a></p>
    <p>What are your thoughts?</p>
    <p>(PS. Does anyone know whether it is possible to know what faces were entered, all I can get is the list of the award recipients?)</p>
