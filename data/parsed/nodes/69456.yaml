      <p>&gt;&gt;(PS. Does anyone know whether it is possible to know what faces were entered, all I can get is the list of the award recipients?)&lt;&lt;</p>
      <p>It is not possible to get a list of all the entries.</p>
      <p>I've been involved with his competition since the beginning, and there are always surprises to me.</p>
      <p>Please remember that the winners are what the four judges agreed upon on that day and that time. Perhaps if the weather was different or they had the salad instead of the sandwich for lunch, their selections might have changed.</p>
      <p>James M</p>
