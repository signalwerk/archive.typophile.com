    <p></p><div class="imageWrap"><img src="/files/1_4150.jpg"></div><p></p>
    <p>Ah, and I almost forgot... the site's in portuguese, so it has to be a font with diacritic marks and accents and all. I've been looking at some of the typefaces from The League of Moveable Type and most of them won't work for me because of that, which is very disappointing.</p>
