      <p>I agree Othello is very close, but at least the links that talked about using <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/atfiorello-condensed/" rel="nofollow">PL Fiorello</a> as a digital equivalent are wrong in this case, because that K is not the same, even if you ignore the width and weight differences. Maybe the film type Othello would have been used, assuming it had other forms, but Fiorello doesn't seem to be a match.</p>
      <p>- Mike Yanega</p>
