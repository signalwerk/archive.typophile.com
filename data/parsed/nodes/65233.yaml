    html: |-
      <p>I have a copy of McGrew's book on American Metal Typefaces at home, which probably shows Benton's Othello design for ATF, but until the weekend I won't be at home. Does anyone else have a copy they can scan so we can prove Othello is the right answer? (I believe it is) Unfortunately, other than that Outline version on the Dover CD, I have heard of no other digital versions of the typeface used on that book cover. What was the publication date? If it was the 70's they probably used film type, I would guess.</p>
      <p>- Mike Yanega</p>
