    <p>I was trying to use the AFDKO's checkOutlines and AutoHint, but it didn't work because the Python version was 2.5 in MacOSX 10.4. I got an error message that "This script supports only Python versions 2.3 and 2.4. The current version is 2.5."<br>
    So I would like to replace ver.2.5 to ver.2.4 or ver.2.3 but I didn't know how should I replace the python program. Or is there any way to solve this problem?</p>
