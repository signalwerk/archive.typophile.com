      <p>&gt; <em>shotype:~ okano$ tx -h<br>
      -bash: tx: command not found</em></p>
      <p>Hi Kunihiko, try this:</p>
      <p>1. Open a new Terminal window and type <code><strong>pico .profile</strong></code></p>
      <p>2. You should now have the .profile file opened in pico, and see some lines that look like this:<br>
      <code><strong>PATH=${PATH}:"/Users/your_username/bin/"</strong></code></p>
      <p>3. Select those lines, copy them, and close the file (Ctrl+X)</p>
      <p>4. Type <code><strong>pico .bash_profile</strong></code></p>
      <p>5. Paste the lines copied in step 3</p>
      <p>6. Close the file (Ctrl+X), answering "Y" to save the changes</p>
      <p>7. Close the Terminal window</p>
      <p>8. Open a new Terminal window. Typing <code><strong>tx -h</strong></code> should now work, as well as all the other AFDKO command line tools</p>
      <p>Hope this helps.</p>
