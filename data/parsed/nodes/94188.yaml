  html: |-
    <p>Hi folks,</p>
    <p>I'm in a bit of a dilly of a pickle and I was wondering if any of you had a simple answer for me. The problem is this: I am building an iOS app that allows users to create photobooks on their phone. The problem comes in with the type. I have the font sent to -40 tracking in inDesign but unfortunately the iPhone SDK does not allow for tracking between characters without some pretty headache-inducing coding. So now I'm thinking of tacking a different tack: adjusting the tracking in-font using software like FontLab. Any ideas how to do this? Is it even possible?</p>
    <p>Cheers!</p>
  html_clean: |-
    <p>Hi folks,</p>
    <p>I'm in a bit of a dilly of a pickle and I was wondering if any of you had a simple answer for me. The problem is this: I am building an iOS app that allows users to create photobooks on their phone. The problem comes in with the type. I have the font sent to -40 tracking in inDesign but unfortunately the iPhone SDK does not allow for tracking between characters without some pretty headache-inducing coding. So now I'm thinking of tacking a different tack: adjusting the tracking in-font using software like FontLab. Any ideas how to do this? Is it even possible?</p>
    <p>Cheers!</p>
