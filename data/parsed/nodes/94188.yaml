    html: |-
      <p>In FontLab: Tools, Action, Metrics, Adjust metrics, Right sidebearing, Adjust by -40, Apply to entire font, OK.</p>
      <p>I don't know if "-40 tracking" in InDesign is -40 units-per-em or some other measure, so check.</p>
      <p>Make sure the font license allows such modifications.</p>
