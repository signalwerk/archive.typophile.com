    <p>I'm a student Graphic Designer who is pretty bad at typography, though I love it. I've tried to put the following layout together but it just looks very ordinary to me, the typography particularly, no life to it - any tips or advice would be much appreciated. Thank you.</p>
    <p>Fonts in order are; House Slant, Gill Sans, and Cubano. (I don't know what the logo fonts are - just traced them)</p>
