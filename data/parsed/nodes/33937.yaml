      <p>Correction: I do <strong>not</strong> have a thing against ink traps. I have a thing against mimicking things without understanding their function. Of course Ondrej may understand the function of these perfectly well, but I should have made this more clear: reconsider the size of the ink traps; they're so long and deep they're cleaving the letters apart. They won't be "under the radar" at the current size. They only help if they make the letters more clear. If they make the letters weak, they backfire. You could turn them towards the bowl so that they take weight from the bowl, not from the stem. You could also make them less deep. In any case it's not something I'd make into a major feature, given the [pleasantly] dark texture of this design. It's something to add if it clarifies the intended appearance, but they were invented to compensate for ink filling in, and that is rarely a concern any more. If they are decorative, then add a bunch more, there aren't enough. </p>
      <p>The best measure for the right size ink traps is, unfortunately, a press test. Maybe you can find a project to use this on, even at the early stage. It's a good opportunity to get a fresh look at the design. Get makeready sheets from the printer, too, so you can see the type under-inked as well.</p>
