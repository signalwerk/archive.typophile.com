      <p>Ondrej,</p>
      <p>I like this. Its proportions look ideal for pairing with any of the plethora of semi-condensed info sans designs that have appeared lately. Contrast, weight, proportions, relationship between Roman and Italic and variety of shape are all working nicely here. </p>
      <p>I agree with Randy about the terminals and angles in s and S. Run through all your alphabetic characters and assess whether the serifs are the right length. This design seems right with long serifs, but some of them are sticking out, in a visual sense. </p>
      <p>I also agree about the angle of the entry strokes on the italic. with such flat intro serifs, the italic seems a little like it's tipping, and there's nothing else about the italic shapes that gives that effect. </p>
      <p>I also agree about the tail of R. It looks a little pasted on. This is the one thing I think is weak about Maiola as well. Given the variety of serif and terminal shapes you've used, it should be easy to find the right shape for this tail. This is also a feature that lends itself to a lot more experimentation and variety than even the terminals on S. Try a lot of different things; a knife point, flat feet, a tiny spur on the left, curved serif, taper going the other way, bent leg, bent leg the other way..... This is the fun part, don't miss out!</p>
      <p>Consider tapering the vertical thin stems of N as well. There is a lot of very effective tapering elsewhere, and the N looks a little bland by contrast.</p>
      <p>Yes, also to strengthening middle joints of MWw. I also think you should consider reversing the taper on one or both stems of u. </p>
      <p>I don't agree with William about the asymmetrical serifs. In text they behave nicely.</p>
      <p>One thing I think you should reconsider: The extreme ink traps in the italic adqu. They are actually weakening the visual weight of the main stems. Please go to a bookstore and look at various types as printed in magazines and books. Modern printing (even newspapers to some degree) is very very faithful to the original art and type, and ink traps of this size will still be apparent down to about 10 point. Given a choice between a little potential clotting at joints (of very few letters) and stems that seem to be breaking off, I'd go with the former. In text, this design is very lively and will not be muddied by the lack of ink traps; the sinuous stems, pronounced serifs, distinctive angled counters, and the rich color mean this design will stand up to photocopying, projection, printing in reverse, and all kinds of other harsh conditions. Don't make it fit just one, increasingly rare printing scenario, when the typeface will be so generally useful otherwise.</p>
      <p>You must have made arrangements to release this by now. It's very nice.</p>
