      <p>Wonderful. Reminds me in a way of Kinesis, which I love.</p>
      <p>Although the M is okay at text sizes, to me it looks kind of broken in the middle at sizes between approx. 36pt and 48pt. Perhaps the joint where the diagonal strokes meet could be strengthened a bit. This could be a limitation of the Acrobat zoom feature, though; I haven't actually printed anything out at high res to check.</p>
      <p>The other thing that bothers me is the leg of roman R. It looks a little too short and not adequately attached to the bowl. Also, the leg doesn't have its foot on the ground -- it actually looks like it's missing a foot, if you know what I mean by this weird visual metaphor. Maybe it's my fairly inexperienced eyes, but then you don't want a typeface to look right only to type design experts.</p>
      <p>All in all, my most sincere congratulations.</p>
