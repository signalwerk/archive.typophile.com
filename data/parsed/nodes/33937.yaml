    <p>hello.</p>
    <p>this is new or fixed:</p>
    <p>the bowl of <strong>a</strong> is a bit bigger.<br>
    the curves in <strong>h, m, n</strong> are more flat now.<br>
    i changed the diagonal strokes of <strong>K, k, R</strong> so they match <strong>Q</strong> in both roman and italic style. i like this new sharp feeling more, but maybe it needs some more optical fixes.<br>
    the italic style is more wild than i planned, so it is not possible for me to see all optical problems. </p>
    <p>i would really appreciate your help. thank you.</p>
