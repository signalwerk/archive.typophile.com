      <p>&gt;the overall idea of kompilat is to follow my calligraphy</p>
      <p>This may be a mistake. I don't think there is any problem in being inspired by calligraphy--Kinesis is an outstanding example. However, following it too closely can mess you up, because type and calligraphy have different demands. </p>
      <p>In the case of the serifs, there is assymetry in Jenson's serifs--influenced by calligraphy--and in those influenced by him. The Jenson style assymetry works not just because of calligraphy, IMHO, but because it gives a sense of motion to the right. Our latin script is left-to-right, and that is reflected in the letter shapes, which generally have a feeling of opening to the right, moving to the right. Even though our eyes fixate to read, this sense of movement is still a plus, I think.</p>
    html_clean: |-
