      <p>Finally I've made time to rejoin this exceptional thread!<br>
      It's rare to see such helpful sketches.</p>
      <p>Randy, I don't know if there's one answer to your wondering as to why I like the Italic... I think a lot of it has to do with it being an Italic and not a Roman, and the fact that ideally I'm seeing it used by itself. But another reason is that (as I've stated before on occasion) I actually like chirographic forms just as much as the next human being... as long as they don't intrude. Meaning that as long as they don't pretend to promote readability.</p>
      <p>&gt; I don’t think it makes sense on the f</p>
      <p>You see, this is the type of logic which I think is too literal. In <cite>type</cite>, the bulge works, this way or that, because it does, not because of where it comes from. Same thing with stroke contrast, serifs, and everything else.</p>
      <p>&gt; i’m left-hander</p>
      <p>Porbably quite telling (and positive) here.</p>
      <p>&gt; Forget two italics </p>
      <p>I would agree that at this point just stick to releasing the typeface with one, but being a big fan of multiple italics I would advise you to at least plan ahead: as you're making the first release one, make it in a way as to leave room (in various dimensions, mostly inclination and cursiveness) for the second one. Also, I would release the "pushy" one first and the more docile one later - that way you generate more interest and you'll get a better feel for how desirable a second Italic might be; even if most people say "I hate it" at least they'd be paying attention and would notice and value the second one. If you release the docile one first people will just go "Ho-hum" and forget about follow-ups.</p>
      <p>BTW Ondrej, Carl has a thing against ink traps... while I have<br>
      a thing <cite>for</cite> them! :-)  I think you should keep them, mostly<br>
      because they help "under the radar" of the reader. A lot of very<br>
      good type designers rely on them (although usually gently).</p>
      <p>hhp</p>
