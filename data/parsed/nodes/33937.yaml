    html: |-
      <p>Hi Ondrej,</p>
      <p>Thank you for posting your drawing. The brush script influence gives this font it's interest, so I think it's important to try and keep it as much as possible. I really like your sketch. I actually like it much better than your italic font. I compared the two in an image so that i can tell you more about the differences I see:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/m_p_4063.jpg"></div><p></p>
      <p>Generally, I think the sketch is much more strong and unified.</p>
      <p>RED: Shows the diagonal stress in the sketch. It is confused in the font. You can see it most on the last leg of the m, but it's everywhere (even in the p).</p>
      <p>BLUE: Where the stroke leaves the stem should be more consistent. Also in the p, it should be lower so it flows with the turn at the bottom of the stem.</p>
      <p>PURPLE: I think the exit stroke on the m (n, i, l etc) is too long. Consider shortening. Also, the beginning stroke and ending stroke will be more united if they follow the same angle. In the font they are flat (entering) and angled (exiting). In the sketch they are the same.</p>
      <p>- - - - - - </p>
      <p>Ss:</p>
      <p>Your english is GREAT. I will try to explain with a picture (I hope I don't confuse!).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/s_s_5799.jpg"></div><p></p>
      <p>RED: I'm showing the counter spaces. For most of your font they are open spaces like a square. You can see this in the R, q,and r. But the S is a very tight space like a triangle. It feels even more like a triangle because of the corner point.</p>
      <p>BLUE: I think the corner point is ok, but the spine (middle curve) of the S, s could bend more make the counter more open (like a square).</p>
      <p>PURPLE: The big dark finish on the lower case s makes the triangle even smaller and makes less room for white space to get in. Consider making it more open, and maybe try to match the style to the uppercase S serif (beak serif) or the r (no serif).</p>
      <p>GREEN: I think the italic s is one of the hardest letters to draw. Usually it is the last italic letter I do. Your italic s feels a little rotated to me. I think giving the spine more of the shape below, will help.</p>
      <p>- - - - - -</p>
      <p>Last thing: This is all my opinion. You are obviously talented, and have made many good choices without us ... so don't forget your design ideas because of our suggestions.</p>
      <p>Randy</p>
