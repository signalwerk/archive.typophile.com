      <p>Great effort! Especially the roman. I've often experimented with the curve &amp; corner concept you have working so nicely here. BTW, the 8/10 - 10/12 settings looks right for this.</p>
      <p><strong>Roman</strong><br>
      s,S: The apperature is too tight for me here. I think the spine might benefit from more hoizontal movement (see Palatino). They feel pinched at the moment. The s serifs may be a bit long.</p>
      <p><strong>Italic</strong><br>
      I think Paul's comments about the exit strokes are right on. To me they cause it to feel wavey gravey. It has a nauseating effect on me when reading blocks of text set in it. In short spells it's not so noticeable, nor when it's smaller. Also, the italic seems dark. </p>
      <p>I guess to me it feels like the roman is taught and muscular, where as the italic is sporting a beer belly. Consider bringing more of the flavor of your j,k,y,E,F into the italic. You might look at Chapparal italic mixed with Kompliat.</p>
      <p>Nice work! -- Randy</p>
