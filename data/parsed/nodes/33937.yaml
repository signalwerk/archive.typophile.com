      <p>The 4 seem bent to me. Isn't in keeping with the other figs.</p>
      <p>I read the lowercase f the same as Jelmar. But, but ... on the other hand it seems like a nice detail. I see how it mimics the q and p ... I wonder if the "bubble" couldn't be lengthened a bit to appear as smooth and subtle as the q and the p.</p>
      <p>Overall this is beautiful!!</p>
