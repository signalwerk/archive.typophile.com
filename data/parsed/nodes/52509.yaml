    <p>Hi,<br>
    i am an absolute beginner in the world of type design, but it is something i’m keen to get stuck into. so far i have just sketched a few ideas for fonts but as yet have not looked into software.</p>
    <p>i’m aware that fontlab studio is ’the one’ but at the minute i just dont have the money to shell out on it.  The alternatives seem to be type tool at $99 and fontforge which is free.</p>
    <p>does anyone have any experience of the latter two and can advise me what to get? at the minute i’m not too concerned about the fancy stuff - ligatures and the like, i’d just like to create a basic font in maybe regular and bold. i have illustrator and a reasonable grasp of beziers, although i believe it is better to create the characters within the font software - do these programs have this facility?</p>
    <p>many thanks for any replies.</p>
    <p>Jonny</p>
