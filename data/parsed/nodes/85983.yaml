    <p>Hi! I'm designing a book cover about corruption in the school system. the story is based in San Diego.</p>
    <p>I took a typographic/lettering approach. The title is supposed to look malevolent, dark, menacing. within the letters, there are scared teens' faces in there.</p>
    <p>i'd love to hear what you guys have to say about this. any suggestions on improvements?<br>
    Thanks.</p>
