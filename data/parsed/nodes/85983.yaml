      <p>blackquartz, You did not specify how this book is being marketed and sold. For books that will not be in bookstores, but will be marketed through the internet and sold on Amazon or on the author's site, different rules apply. For these books the main point of the cover is to look good as a postage-stamp-and-a-half sized image on Amazon or on the website of anyone who will recommend the book. How the book cover looks as a book is secondary. This is a little bit sad, but that's the current reality. Here are some tips:<br>
      <a href="http://www.thebookdesigner.com/2010/06/top-8-cover-design-tips-for-self-publishers/" title="http://www.thebookdesigner.com/2010/06/top-8-cover-design-tips-for-self-publishers/">http://www.thebookdesigner.com/2010/06/top-8-cover-design-tips-for-self-...</a></p>
