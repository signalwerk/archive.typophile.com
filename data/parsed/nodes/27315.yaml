      <p>&gt; <em>The Fell type, cut for Bishop Fell at the Oxford University Press, late 17th century.</em></p>
      <p>I thought that most of those types were not cut to the order of Dr. Fell. He bought punches and matrices in Holland and Germany in 1670 and 1672, and brought them to Oxford. The original collection was complemented by the larger sizes that were indeed custom-manufactured at his request.</p>
