      <p>Interesting article by Erik Spiekermann on Corporate typography in “An A-Z of type designers” by Neil Macmillan. Covers the basic rationale behind the function of typography as a tool for branding - message and identity all at once.</p>
      <p><a href="http://www.amazon.com/-Z-Type-Designers-Neil-Macmillan/dp/0300111517/sr=1-1/qid=1159836592/ref=sr_1_1/104-7313228-0799967?ie=UTF8&amp;s=books" title="http://www.amazon.com/-Z-Type-Designers-Neil-Macmillan/dp/0300111517/sr=1-1/qid=1159836592/ref=sr_1_1/104-7313228-0799967?ie=UTF8&amp;s=books">http://www.amazon.com/-Z-Type-Designers-Neil-Macmillan/dp/0300111517/sr=...</a></p>
      <p>Other interesting articles by type designers. The rest of the book is a list of designers with: fonts designed, bio. This aspect is much better covered by the Friedl, Ott &amp; Stein book. <a href="http://www.amazon.com/Typography-Friedrich-Friedl/dp/1579120237/sr=1-1/qid=1159836713/ref=sr_1_1/104-7313228-0799967?ie=UTF8&amp;s=books" title="http://www.amazon.com/Typography-Friedrich-Friedl/dp/1579120237/sr=1-1/qid=1159836713/ref=sr_1_1/104-7313228-0799967?ie=UTF8&amp;s=books">http://www.amazon.com/Typography-Friedrich-Friedl/dp/1579120237/sr=1-1/q...</a></p>
