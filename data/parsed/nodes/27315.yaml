      <p>Wow, great thread. This is a question I've always wanted to know the answer to. If this is not straying to far off the topic, I would like to know how type designers get involved in these projects. Are you approached by the companies, or do you approach the companies? </p>
      <p>As a graphic designer I know how many companies (even the big ones) are often very reluctant to purchase typefaces, let alone to buy a custom face. How is there so much difference between corporations and their understanding of the importance of typography?</p>
