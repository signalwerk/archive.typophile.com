      <p>Regarding the Macromedia branding font, that one is Vonnes from Font Bureau. It was available on the Font Bureau website at one time. But I just checked and it isn't there. Hmm.</p>
      <p>Danilo-Black has developed a number of custom type families for newspapers and magazines. They worked on "Houston" for the Houston Chronicle.</p>
      <p>Armin, I agree Clearview Highway is not really a "corporate" typeface (although AT&amp;T has adopted the similar ClearviewOne for much of their stuff). Though the funding for it came from other places than a specific corporation it is still a non-retail oriented font. The work on ClearviewHwy spanned over a decade and involved a lot of testing and research in areas not considered for very many other typefaces. It's a very significant development for sign-specific type.</p>
