    <p>Hi all,</p>
    <p>I'm to give a talk on corporate typefaces this Fall (2006), particularly on fonts designed exclusively for a company's branding. I will also cover fonts designed to answer special technical needs (signage, screen, ...).</p>
    <p>My list so far:<br>
    _ Jean-François Porchez (Mencken, Deréon, Parisine, Costa, ...)<br>
    _ Erik Spiekermann (FF, Meta, FF Info, DBahn, Nokia, ...)<br>
    _ Matthew Carter (Bell Centennial, Verdana, Georgia, ...)<br>
    _ the Clearview project<br>
    _ Nick Shinn (Richler)<br>
    _ Underware (Ulrika)<br>
    _ H&amp;FJ (Mercury, Verlag, ...)</p>
    <p>Any other milestones I should consider? Do you have sources of informations (www, books, magazines, ...) that would ease my research?</p>
    <p>Thanks for any suggestions and your help!!!!!!!</p>
