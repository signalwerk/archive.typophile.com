      <p><em>Interesting article by Erik Spiekermann</em></p>
      <p>I attach a jpeg with showings of most faces I designed over the years. The fonts for corporations were usually designed by teams, and some of my collaborators were Lucas de Groot, Ole Schäfer, Albert Pinggera, Henning Krause, Erik van Blokland, Just van Rossum, Conor Mangat and Christian Schwartz. I know I've left some faces off the list, as I can never remember all of them and as we shouldn’t get too much credit for adaptions like Univers for Audi Sans, Frutiger Condensed for FF Transit or Futura for VW Headline. And I just noticed that I left out The Economist, so I’ll have a think, try and find the original file and post an updated <strong>spiekertypes</strong> image soon. </p>
      <p>If anybody is interested, I can supply that article as a text file. </p><div class="imageWrap"><img src="http://typophile.com/files/spiekertypes06_5427.jpg"></div><p></p>
