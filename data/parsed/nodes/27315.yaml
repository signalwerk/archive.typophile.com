      <p>"Regarding the Macromedia branding font, that one is Vonnes from Font Bureau... It was never available for purchase, but a sample was available in their Custom section. That section is now AWOL, and I miss it."<br>
      Stephen, the custom section will be back, along with lots of new work to fill it with. Promise. Vonnes (now Vonness) was available offline for a brief pocket of time before Macromedia wanted exclusivity again. It can still be seen in Concierge magazine due to that tiny blip of availability.</p>
      <p>Martin, contact me at Font Bureau and I can supply you images of Vonness for Macromedia and others depending on what you're hunting for. The bulk of our library was originally commissioned type for publications. Some were for corporations including Proforma for Purup by Petr von Blokland in the mid 80s:<br>
      <a href="http://www.fontbureau.com/fonts/Proforma" title="http://www.fontbureau.com/fonts/Proforma">http://www.fontbureau.com/fonts/Proforma</a></p>
      <p>Another one of note is customized monospace Interstate for Citibank's massive credit report operation. You can see them at the very bottom of the list here:<br>
      <a href="http://www.fontbureau.com/fonts/Interstate/styles" title="http://www.fontbureau.com/fonts/Interstate/styles">http://www.fontbureau.com/fonts/Interstate/styles</a></p>
