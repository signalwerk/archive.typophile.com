    html: |-
      <p>&gt; <em>fonts designed exclusively for a company’s branding</em></p>
      <p>Martin, are you asking about branding ('signature') typefaces, or the proprietary typefaces?</p>
      <p>Many popular printing types originated as proprietary designs. Among them are Century (1894), Cheltenham (1896), Times New Roman (1931), Bell Gothic (1937), Californian (1939).</p>
      <p>In my opinion, Romain du Roi is a fine example of a proprietary typeface...</p>
      <p>The typeface for the Prussian Railroads (1905) is probably the earliest proprietary design for railway car lettering and signage. It precedes Edward Johnston's typeface for London Underground by ten years.</p>
      <p>Packard (1913), Metropolitan Oldstyle (1914), Saks-Goudy (1934), CBS Sans and CBS Didot Bodoni (196?), Bloomingdale's Gothic (197?) are some of the long-forgotten American branding typefaces.</p>
      <p>There are two useful books on the subject: <a href="http://www.amazon.com/gp/product/1568302487/sr=1-1/qid=1154489617/ref=sr_1_1/103-4457932-5827061?ie=UTF8&amp;s=books" target="_blank" rel="nofollow"><em>Branding with Type</em></a>, and <a href="http://www.printinghistory.org/htm/pubs/proprietary-typefaces.html" target="_blank" rel="nofollow"><em>American Proprietary Typefaces</em></a>.</p>
