      <p>I've also designed an early-reading face for Nelson Thomson publishing company.<br>
      Named, er, Nelson! See my web site.<br>
      And Brown Gothic and Walburn for the Globe and Mail -- although custom types designed for newspapers and magazines are a separate category, there are so many of them, Century, Times, etc. What foundries do is give the commissioning customer an exclusive licence for a limited time, and then release the face commercially. It's a great way to finance new product, although it does direct foundry output in a very staid direction, given the traditional look of newspapers, and the conservatism of the biggest market, American mass media.</p>
      <p>For more Canadian content, Usherwood's Flange for a government program, and perhaps his face used for the launch of Canada's Wonderland, Sycamore? No doubt he did others, check with Matt Warburton, who is something of an Usherwood expert, or Steve Jackaman of Red Rooster, who publishes a lot of Usherwood faces. </p>
      <p>Frutiger was designed for an airport.</p>
      <p>There are a lot of custom corporate faces in the UK.<br>
      Dalton Maag makes a specialty of it.<br>
      My currrent favorites over there include Jason Smith's design for Channel 4 (2004) and the national Westminster Bank typeface, by David Quay, I believe.</p>
      <p>Sources: <em>Goudy's Type Designs</em> will reveal many.</p>
