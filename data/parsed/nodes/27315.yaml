      <p>Part of the advantage of offering a custom solution is one of licensing and distribution. If a corporation is going to properly license a font or fonts for worldwide distribution: A. they are going to pay a lot for that license B. It is a license with its own restrictions and C it is a font that is already being used by others.</p>
      <p>A custom solution gives the client a unique font, and the freedom to do with it what they want. They still have to pay a lot of money, but they were going to do that anyway.</p>
      <p>Sometimes they come to you , and sometimes you go to them.</p>
      <p>James</p>
