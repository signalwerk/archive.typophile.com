      <p>LOW TIDE/HIGH TIDE: it's actually a roughen version of Hollister's own corporate font called "Custom Gothic" (complete alphabet coming from their website shown below). Similars: <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/alternate-gothic" rel="nofollow">Alternate Gothic</a> No.2, <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/League-Gothic" rel="nofollow">League Gothic</a>, <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/Bebas" rel="nofollow">Bebas</a>, <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/oswald" rel="nofollow">Oswald</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/trade-gothic" rel="nofollow">Trade Gothic</a> Condensed no.20, <a class="freelinking external" href="http://www.myfonts.com/fonts/yellow-design/veneer" rel="nofollow">Veneer</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/yellow-design/anodyne" rel="nofollow">Anodyne</a>, <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0020" rel="nofollow">Ultramagnetic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/vinyl" rel="nofollow">Vinyl</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/wordshape/stacker" rel="nofollow">Stacker</a>, <a class="freelinking external" href="http://www.stevenbonner.com/projects/langdon" rel="nofollow">Langdon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typeart/bellamie" rel="nofollow">Bellamie</a>, <a class="freelinking external" href="http://www.dafont.com/growly-grin.font" rel="nofollow">Growly Grin</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_dirty_faces_2_ot" rel="nofollow">FF Dirty Faces Seven One anb Two</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/custom-gothic_6310.png"></div><p></p>
