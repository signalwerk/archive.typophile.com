    html: |-
      <p>It looks like 구름 M (<em>Gureum</em>, meaning “cloud”, and M standing for medium weight) offered by the Korean font outfit <a href="http://yoonfont.co.kr/shop/han_view.asp?itemidx=723">윤디자인 (YoonDesign)</a>. In fact, you can see the Cyworld logo on the <a href="http://yoonfont.co.kr">front page</a> for their website. I can’t find any further information on the design, though.</p>
      <p>Korean fonts include latin alphabet glyphs by default in addition to the hangul (Korean alphabet). It is pretty common, I imagine, for Korean designers to use the latin alphabet component of their Korean fonts for latin-alphabet logos.</p>
