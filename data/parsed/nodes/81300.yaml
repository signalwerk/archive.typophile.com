  html: |-
    <p>Hi all — Any help with this is appreciated. I am trying to ID the typeface used for "Freeman Sporting Club's" wordmark. I believe it may be a modified version of "Decima" - <a href="http://new.myfonts.com/fonts/tipografiaramis/decima/" title="http://new.myfonts.com/fonts/tipografiaramis/decima/">http://new.myfonts.com/fonts/tipografiaramis/decima/</a> ... almost like certain crossbars have been lowered/raised, and it's corners have overall been rounded a bit.</p>
    <p>Here is a link to "FSC's" website for a specimen.</p>
    <p><a href="http://shop.freemanssportingclub.com/collections/all" title="http://shop.freemanssportingclub.com/collections/all">http://shop.freemanssportingclub.com/collections/all</a></p>
    <p>Thanks.</p>
