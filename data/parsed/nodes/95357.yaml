    html: |-
      <p>The conversion from ink to thread may have affected the shape.<br>
      It might not be a font, but a set of embroidery designs, such as one of these:<br>
      <a class="freelinking external" href="http://tinyurl.com/9lop5k9" rel="nofollow"></a></p>
      <p>Some font candidates:<br>
      Varsity (Broderbund) and Collegiate or Rah Rah (anon); -All would all need the outline removed and be condensed)<br>
      Freshman (William Boyd), CollegiateFLF &amp; CollegeFLF-Black (Casady &amp; Green) - would need to be condensed)</p>
      <p>There are a lot more that don't have the serif on the middle top stroke of the W.</p>
      <p> - Herb</p>
