      <p>Bold is the heaviest weight in the <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/trajan_pro_complete_vp/" rel="nofollow">Trajan family</a>. Here are inscriptional families that do have a heavier weight:</p>
      <p><a href="http://www.fontshop.com/fonts/singles/itc/itc_friz_quadrata_std_bold/?&amp;sample_text=TRAJAN%E2%80%99S%20COLUMN" rel="nofollow">Friz Quadrata</a><br>
      <a href="http://www.fontshop.com/fonts/singles/monotype/pompei_std_bold/?&amp;sample_text=TRAJAN%E2%80%99S%20COLUMN" rel="nofollow">Pompei</a><br>
      <a href="http://www.fontshop.com/fonts/singles/itc/itc_elan_std_black/" rel="nofollow">ITC Elan</a><br>
