    <p>Just bought this, as a gift, but decided to keep it for myself.<br>
    Dang, now I’ll have to go back to the store and get another copy.<br>
    Might even be tempted to go searching for the original card packages.<br>
    Book + selection of great music from 1927-31.<br>
    And as a bonus, the main type is Caslon’s Egyptian by the book’s designer Miko McGinty.<br>
    Goes great with Crumb’s lovely bold sans lettering (strangely, a lot in common with Dr Seuss...)<br>
    I like the way McGinty uses the “alternate” version of the G, without crossbar, throughout.<br>
    </p><div class="imageWrap"><img src="/web/20080905044328im_/http://www.typophile.com/files/Crumb_4568.jpg"></div><p></p>
