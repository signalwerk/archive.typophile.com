      <p>This is a version of a wooden typeface created by William Hamilton Page in the 19th century and now known as Concave Tuscan extra condensed bold with side spurs. Wooden Type Fonts has done a digital recreation of the font, without side spurs:<br>
      <a href="http://www.myfonts.com/fonts/woodentypefonts/concave-tuscan-x/condensed-bold/" title="http://www.myfonts.com/fonts/woodentypefonts/concave-tuscan-x/condensed-bold/">http://www.myfonts.com/fonts/woodentypefonts/concave-tuscan-x/condensed-...</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ConcaveTuscanXtrCondBoldWT_4324.jpg"></div><br>
      Presumably the embroidering people have their own font.<br>
      don<p></p>
