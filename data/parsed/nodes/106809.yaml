      <p>Thought also to some Concave Tuscan but gave up with the idea, too much different for me (/M centre vertex, median side spurs/thorns, slab...). Here are some I collected during the search: <a href="http://www.myfonts.com/fonts/aerotype/boxwood" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Boxwood</a>, <a href="http://www.myfonts.com/fonts/jnlevine/winnetka" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Winnetka JNL</a>, <a href="http://www.myfonts.com/fonts/intellecta/antique-tuscan-condensed" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Antique Tuscan Condensed ID</a>, <a href="http://www.myfonts.com/fonts/woodentypefonts/antique-tuscan-condensed/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Antique Tuscan Condensed WTF</a>, <a href="http://www.myfonts.com/fonts/emigre/council" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Council</a><br>
      Don't know why but reminds me also some 'Tiki' fonts... and <a href="http://www.myfonts.com/fonts/emigre/totally-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Totally Gothic</a>...</p>
