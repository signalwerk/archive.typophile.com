      <p>Thought also to some Concave Tuscan but gave up with the idea, too much different for me (/M centre vertex, median side spurs/thorns, slab...). Here are some I collected during the search: <a class="freelinking external" href="http://www.myfonts.com/fonts/aerotype/boxwood" rel="nofollow">Boxwood</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/winnetka" rel="nofollow">Winnetka JNL</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/antique-tuscan-condensed" rel="nofollow">Antique Tuscan Condensed ID</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/antique-tuscan-condensed/" rel="nofollow">Antique Tuscan Condensed WTF</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/council" rel="nofollow">Council</a><br>
      Don't know why but reminds me also some 'Tiki' fonts... and <a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/totally-gothic" rel="nofollow">Totally Gothic</a>...</p>
