    html: <p>Great job, Don! Just found <a class="freelinking external" href="http://www.myfonts.com/fonts/dunwich/becker-gothics/concave" rel="nofollow">Becker Gothics Concave DTF</a>, the closest so far to me. Adding slab serifs on /D, reworking /W centre vertex and scaling it horizontally should do the job quite nicely.</p>
