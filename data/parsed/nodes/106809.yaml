      <p>To test the match of Concave Tuscan Extra Condensed by Wooden Type Fonts, I used it to as a base for the letters TA K ONDO, added spurs and did some relatively minor tinkering with the outlines. I made D by adding serifs to O.<br><img src="/sites/default/files/old-images/ConcaveTuscancXCondBldSpursSM_4941.jpg"><br>
      Don</p>
