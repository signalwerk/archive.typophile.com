    html: |-
      <p>I was going to do a mockup of the words TAEKWONDO but found that it is too much of a Frankenfont to make this easy. Some letters have a base design, i.e. excluding the horizontal spurs which can be pasted on, that resemble Concave Tuscan: T, A, K, W [if apex brought to a point], O and N. Others have a base design, again excluding the spurs, that uses slab serifs: E and D. This is almost certainly not a revival of any classic font that I have seen.<br>
      Perhaps it might be most effective to ask the embroidery company about its source for the letters.<br>
      Don</p>
