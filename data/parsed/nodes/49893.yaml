    <p>Hello everybody, </p>
    <p>I am new to font design and I tried to generate a simple pixel font. I posted earlier another design - a helvetica-like sans  (<a href="http://typophile.com/node/49228" title="http://typophile.com/node/49228">http://typophile.com/node/49228</a>) and the pixel font here is the equivalent of that.</p>
    <p>I used the free font editor Fony. The font was set at 9 points (12 depending on dpi).</p>
    <p>Please let me know what you think.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Test_Carpathica_Px4_5204.PNG"></div><p></p>
