    html: <p>Actually, when you make a pixel font you have two choices, two pixel breaks or one. If you two as we see here it looks too wide. If yo go one then then it seems too tight. The main culprit in the over wide look is the r. r c ra r anything looks too wide. It's not a monospace so loose a pixel next to the r and you should have a better look.</p>
