  html: |-
    <p>I just received a notification today from a type designer / foundry that one of our recent releases has the same name as a previous release from said designer / foundry. They are asking me to change the name of our release to avoid confusion.</p>
    <p>I’m not opposed to changing the name by any means and feel somewhat neutral towards this conflict at this point.</p>
    <p>It seems that conflicts would happen somewhat frequently and I know that in other industries there are product naming overlaps as well.</p>
    <p>Does anyone have any experience with this issue, I imagine some people have ran into this issue and have dealt with a variety of situations that are similar.</p>
    <p>Thanks for your feedback.</p>
