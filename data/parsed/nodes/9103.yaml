    html: <p>There are several optopns for the vertical relationship of the first line of text to the top of a text box in InDesign. This can be set in <i>Object / Text Frame Options.</i> I believe the default is 'Ascent'. In any case, if there is even a small difference between the ascender, cap-height or x-height of two fonts, you will see different alignment if any of these options is selected. My recommendation is to use a leading or fixed value.</p>
