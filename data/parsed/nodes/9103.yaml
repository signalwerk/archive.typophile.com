  html: <p>Hi everyone  <br> <br>I made a family of fonts using fontlab 4.6 in MacOSX, including light, book, medium, bold and black weights and exported a Mac T1 suitcase.  <br> <br>The font files are ok, except by the fact that when I type something in InDesign with the black weight, for example, and then change the weight to light, the text box moves a little bit upward. I've checked the ascendents and descendents of all weights and they are the same, and I've checked in other existing fonts that this doesn't happen. What's possibly happening?  <br> <br>Thanks!</p>
  html_clean: <p>Hi everyone  <br> <br>I made a family of fonts using fontlab 4.6 in MacOSX, including light, book, medium, bold and black weights and exported a Mac T1 suitcase.  <br> <br>The font files are ok, except by the fact that when I type something in InDesign with the black weight, for example, and then change the weight to light, the text box moves a little bit upward. I've checked the ascendents and descendents of all weights and they are the same, and I've checked in other existing fonts that this doesn't happen. What's possibly happening?  <br> <br>Thanks!</p>
