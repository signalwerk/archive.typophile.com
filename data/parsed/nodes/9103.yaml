    html: <p>Maybe it's an Indesign problem, because I've tested the font in many other applications, including Illustrator and Photoshop, and in these applications it doesn't happen.  <br> <br>I've tried to change the text frame options too, but it didn't help. <br> <br>I also saw that a few existing fonts have the same problem, like Linotype Univers.</p>
