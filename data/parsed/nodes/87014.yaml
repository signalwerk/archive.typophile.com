    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Elena_release_5895.png"></div><p></p>
    <p>We’re pleased to announce the long-awaited release of Elena from type designer and Process Type Foundry partner Nicole Dotin. Designed specifically for text and extended reading, Elena is a contemporary text face well suited for magazines, books and editorial design. Pairing the inspiration of the broad-nibbed pen with a desire for a modern page color, Elena is a face of economical proportions, moderate x-height and spare details.</p>
    <p>Available in Regular and Bold with accompanying Italics, each style of Elena is replete with the necessary features one would expect for proper text work like small caps, case sensitive forms and a diverse range of numeral styles including those specifically for small caps. Basic versions start at $39 and full versions at $75.  <a class="freelinking external" href="http://processtypefoundry.com/fonts/elena/" rel="nofollow">Learn more about Elena.</a></p>
