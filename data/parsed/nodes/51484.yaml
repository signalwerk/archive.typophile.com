    <p>Hi guys:</p>
    <p>I've got a question here- what point size do you guys usually start with when you are designing a new font? I am refering more to "mainstream fonts" and of course for display and text, both would have different sizes to start with...</p>
    <p>I am sure different one of us would have different rationale to why he/she starts with a particular point size- let's hear your rationale as well...</p>
    <p>thanks<br>
    weng</p>
