    html: |-
      <p>Unless you are cutting type from metal or perhaps doing some sort of bitmap font, then point size has more to do with the end use in an application. If you mean how large are original drawings, that probably varies a lot. Many people start with sketches having a cap height somewhere between 2-4 inches.</p>
      <p> A lot of my work is with scripts, so I start with writing much smaller than that, but at like 800 DPI or higher in Photoshop. After cleaning up and arranging in the high rez file I copy into a much larger low rez file set up for importing into FonLab. I do all my vector work in FontLab.</p>
