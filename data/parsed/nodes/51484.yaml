      <p>Thanks, Stephen</p>
      <p>I suppose we are talking about designing on the computer here. Hard to find anyone still doing it the traditional way these days.</p>
      <p>As far as the original sketches are concerned, I think it really depends on how comfortable our hand can move and draw (and depends on what tools we use) to give us sufficient outline to start with. I think most of us would do a pretty rough drawings first, and then scan it in, and finish off the rest with Fontlab or with any other font deign software.</p>
      <p>Since it's done in vector, I suppose it makes no diferent what size we are working on screen.</p>
