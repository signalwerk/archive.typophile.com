  - id: 14943
    user: 1215
    date: 2003-12-04T15:04:00
    date_raw: 4 December 2003 - 3:04pm
    votes: 0
    html: <p>Jennifer — <br><br>As Yves explained (quite thoroughly and admirably), Meta 1, 2, 3, and MetaPlus are all essentially the same typeface family. But MetaPlus was an earlier release. If you are trying to work with a legacy document which uses MetaPlus, then you should contact one of the FontShops directly to get a copy of the old version, as the recent versions have some subtle diﬀerences. <br><br>I had to help a client in this situation once. After getting them a license for Meta 1 and 2, I spoke with a representative at FontShop who gladly provided a legacy copy of MetaPlus at no additional cost, in order to work with documents that an outside ﬁrm had designed using MetaPlus. <br><br>If you are not working with a previous document and don’t need to worry about changes in metrics, then Meta 1 and 2 are the current versions which match (and exceed) the range of MetaPlus. <br><br></p>
    html_clean: <p>Jennifer — <br><br>As Yves explained (quite thoroughly and admirably), Meta 1, 2, 3, and MetaPlus are all essentially the same typeface family. But MetaPlus was an earlier release. If you are trying to work with a legacy document which uses MetaPlus, then you should contact one of the FontShops directly to get a copy of the old version, as the recent versions have some subtle diﬀerences. <br><br>I had to help a client in this situation once. After getting them a license for Meta 1 and 2, I spoke with a representative at FontShop who gladly provided a legacy copy of MetaPlus at no additional cost, in order to work with documents that an outside ﬁrm had designed using MetaPlus. <br><br>If you are not working with a previous document and don’t need to worry about changes in metrics, then Meta 1 and 2 are the current versions which match (and exceed) the range of MetaPlus. <br><br></p>
