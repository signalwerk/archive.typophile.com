  html: <p>Hello, I came accross this forum while trying to track down a site that offers the MetaPlus font.  I've searched on all the big font sites (Fonts.com, MyFonts.com, Adobe Type Library, etc) but no one seems to offer this font for sale or otherwise.  Is there something I'm missing?   <br> <br>I really need it as a project I've been handed was started using the MetaPlus font. Alternatly, what would be a comparable font that I could substitute with? <br> <br>Thanks! <br>Chris</p>
