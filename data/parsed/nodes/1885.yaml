    html: "<p><i>&gt; Actually, many of Erik's fonts look quite similar,  <br>Officina, Info, Meta, Unit -- while all distinctively  <br>different, they all share certain similarities.</i> <br> <br>Some further theorizing and reactions from Erik himself  <br>at <a href=\"http://typographi.ca/000622.php#000622\" target=\"_blank\"> Typographi.ca</a>. <br> <br>Originally, back in 1991 when the very first batch of  <br>FontFonts was released, there was <b>FF Meta 1</b> (Normal,  <br>Bold, Small Caps). Hanging figures and additional  <br>ff-ligatures were already present in the Normal and  <br>Bold weights, with lining figures in the Small Caps. <br> <br>The first expansion came in 1992 with <b>FF Meta 2</b>  <br>{Italic, Italic Small Caps, Bold Small Caps}. <br> <br><b>FF MetaPlus</b>, released in 1993, was the big leap  <br>forward which tripled the number of fonts to 18, and  <br>included a fine-tuning of some characters (most notably  <br>the correction of the crossbar on the lc 't'). The family  <br>at that point featured Normal, Book, Medium, Bold and  <br>Black weights, all in Roman, Italic, Small Caps and  <br>Italic Small Caps (except for the Black weight which  <br>didn't include Small Caps). Still hanging figures in <br>the 'normal' weights and lining figures in the Small Caps. <br> <br>Eventually, in 1998 it was back to <b>FF Meta</b>, which  <br>saw a reorganization of the family into subfamilies:  <br>FF MetaNormal, FF MetaBook, FF MetaMedium,  <br>FF MetaBold and FF MetaBlack, all in Roman, Italic,  <br>Small Caps and Italic Small Caps, which all got  <br>coupled with their respective Expert and Lining Figures  <br>weights: yep, 60 fonts indeed. Biggest change this  <br>time was the addition of the Black Small Caps, and  <br>moving the extra ligatures (ff, ffi, ffl which were  <br>previously in the regular fonts) to the new Expert fonts. <br>And of course the Lining figures weights which means <br>you don't have to switch weights anymore to get the  <br>desired type of numerals. <br> <br>So, to conclude: don't mix the original six weight  <br>FF Meta with FF MetaPlus nor the new FF Meta family  <br>(different spacing, some redesigned characters), and  <br>when substituting FF Meta for FF MetaPlus be careful  <br>with disappearing ff-ligatures and different types of  <br>numerals. <br> <br>This concludes the lecture for today (whew). <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
