    html: '<p><i>&gt; Actually, many of Erik’s fonts look quite similar,  <br>Oﬃcina, Info, Meta, Unit — while all distinctively  <br>diﬀerent, they all share certain similarities.</i> <br><br>Some further theorizing and reactions from Erik himself  <br>at <a href="http://typographi.ca/000622.php#000622" target="_blank"> Typographi.ca</a>. <br><br>Originally, back in 1991 when the very ﬁrst batch of  <br>FontFonts was released, there was <b><span class="caps">FF</span> Meta 1</b> (Normal,  <br>Bold, Small Caps). Hanging ﬁgures and additional  <br>ﬀ-ligatures were already present in the Normal and  <br>Bold weights, with lining ﬁgures in the Small Caps. <br><br>The ﬁrst expansion came in 1992 with <b><span class="caps">FF</span> Meta 2</b>  <br>{Italic, Italic Small Caps, Bold Small Caps}. <br><br><b><span class="caps">FF</span> MetaPlus</b>, released in 1993, was the big leap  <br>forward which tripled the number of fonts to 18, and  <br>included a ﬁne-tuning of some characters (most notably  <br>the correction of the crossbar on the lc ‘t’). The family  <br>at that point featured Normal, Book, Medium, Bold and  <br>Black weights, all in Roman, Italic, Small Caps and  <br>Italic Small Caps (except for the Black weight which  <br>didn’t include Small Caps). Still hanging ﬁgures in <br>the ‘normal’ weights and lining ﬁgures in the Small Caps. <br><br>Eventually, in 1998 it was back to <b><span class="caps">FF</span> Meta</b>, which  <br>saw a reorganization of the family into subfamilies:  <br><span class="caps">FF</span> MetaNormal, <span class="caps">FF</span> MetaBook, <span class="caps">FF</span> MetaMedium,  <br><span class="caps">FF</span> MetaBold and <span class="caps">FF</span> MetaBlack, all in Roman, Italic,  <br>Small Caps and Italic Small Caps, which all got  <br>coupled with their respective Expert and Lining Figures  <br>weights: yep, 60 fonts indeed. Biggest change this  <br>time was the addition of the Black Small Caps, and  <br>moving the extra ligatures (ﬀ, ﬃ, ﬄ which were  <br>previously in the regular fonts) to the new Expert fonts. <br>And of course the Lining ﬁgures weights which means <br>you don’t have to switch weights anymore to get the  <br>desired type of numerals. <br><br>So, to conclude: don’t mix the original six weight  <br><span class="caps">FF</span> Meta with <span class="caps">FF</span> MetaPlus nor the new <span class="caps">FF</span> Meta family  <br>(diﬀerent spacing, some redesigned characters), and  <br>when substituting <span class="caps">FF</span> Meta for <span class="caps">FF</span> MetaPlus be careful  <br>with disappearing ﬀ-ligatures and diﬀerent types of  <br>numerals. <br><br>This concludes the lecture for today (whew). <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>'
    html_clean: '<p><i>&gt; Actually, many of Erik’s fonts look quite similar,  <br>Oﬃcina, Info, Meta, Unit — while all distinctively  <br>diﬀerent, they all share certain similarities.</i> <br><br>Some further theorizing and reactions from Erik himself  <br>at <a href="http://typographi.ca/000622.php#000622" target="_blank" class="link-external"> Typographi.ca</a>. <br><br>Originally, back in 1991 when the very ﬁrst batch of  <br>FontFonts was released, there was <b><span class="caps">FF</span> Meta 1</b> (Normal,  <br>Bold, Small Caps). Hanging ﬁgures and additional  <br>ﬀ-ligatures were already present in the Normal and  <br>Bold weights, with lining ﬁgures in the Small Caps. <br><br>The ﬁrst expansion came in 1992 with <b><span class="caps">FF</span> Meta 2</b>  <br>{Italic, Italic Small Caps, Bold Small Caps}. <br><br><b><span class="caps">FF</span> MetaPlus</b>, released in 1993, was the big leap  <br>forward which tripled the number of fonts to 18, and  <br>included a ﬁne-tuning of some characters (most notably  <br>the correction of the crossbar on the lc ‘t’). The family  <br>at that point featured Normal, Book, Medium, Bold and  <br>Black weights, all in Roman, Italic, Small Caps and  <br>Italic Small Caps (except for the Black weight which  <br>didn’t include Small Caps). Still hanging ﬁgures in <br>the ‘normal’ weights and lining ﬁgures in the Small Caps. <br><br>Eventually, in 1998 it was back to <b><span class="caps">FF</span> Meta</b>, which  <br>saw a reorganization of the family into subfamilies:  <br><span class="caps">FF</span> MetaNormal, <span class="caps">FF</span> MetaBook, <span class="caps">FF</span> MetaMedium,  <br><span class="caps">FF</span> MetaBold and <span class="caps">FF</span> MetaBlack, all in Roman, Italic,  <br>Small Caps and Italic Small Caps, which all got  <br>coupled with their respective Expert and Lining Figures  <br>weights: yep, 60 fonts indeed. Biggest change this  <br>time was the addition of the Black Small Caps, and  <br>moving the extra ligatures (ﬀ, ﬃ, ﬄ which were  <br>previously in the regular fonts) to the new Expert fonts. <br>And of course the Lining ﬁgures weights which means <br>you don’t have to switch weights anymore to get the  <br>desired type of numerals. <br><br>So, to conclude: don’t mix the original six weight  <br><span class="caps">FF</span> Meta with <span class="caps">FF</span> MetaPlus nor the new <span class="caps">FF</span> Meta family  <br>(diﬀerent spacing, some redesigned characters), and  <br>when substituting <span class="caps">FF</span> Meta for <span class="caps">FF</span> MetaPlus be careful  <br>with disappearing ﬀ-ligatures and diﬀerent types of  <br>numerals. <br><br>This concludes the lecture for today (whew). <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>'
