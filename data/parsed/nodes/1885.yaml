hts anymore to get the  <br>desired type of numerals. <br> <br>So, to conclude: don't mix the original six weight  <br>FF Meta with FF MetaPlus nor the new FF Meta family  <br>(different spacing, some redesigned characters), and  <br>when substituting FF Meta for FF MetaPlus be careful  <br>with disappearing ff-ligatures and different types of  <br>numerals. <br> <br>This concludes the lecture for today (whew). <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
