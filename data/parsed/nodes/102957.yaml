  html: |-
    <p>Greetings from the Midwest U.S. I released my newest font a few days ago. I wanted to say thanks to Mark Simonson for his help with some technical questions with regarding to encoding, naming, etc. And a big thank you to Maximiliano Sproviero for letting me bounce glyph looks off of him, and for his fantastic suggestions for making the font. </p>
    <p>Enjoy!</p>
    <p>RL</p>
