    html: |-
      <p><cite>This process leaves no marker specific to the original Greek symbol.</cite></p>
      <p>Surely it does show a big pink rectangle? That's InDesign telling you, "hey I don't have that character in this font."</p>
      <p>As for changing your current font, or replacing it with one that <em>does</em> contain Greek, I can't help.</p>
      <p>My usual way of inserting otherwise unsupported characters in a document is to create a character style that only defines another font that contains Greek to match the 'base' font (i.e., sans, serif, small x-height -- or "whatever", if nothing really matches!), then I locate each of the missing glyphs and assign this character style to it.</p>
      <p>In modern versions of InDesign -- CS4 and newer -- you can edit a Preflight profile to warn you for any missing characters. Since large preflight profiles tend to make ID unusably slow, even on really really fast systems, I created one profile that <em>exclusively</em> checks for missing glyphs.</p>
