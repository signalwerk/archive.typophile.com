  html: |-
    <p>We are using ITC New Baskerville and InDesign for a semi-annual  publication, unaware that  this font set  lacked several Greek symbols (e.g., kappa, chi, omega). A new ITC New Baskerville Pro version may add a few Greek symbols, but none of those mentioned. We can make do with substituting another font, if we have to, but a bigger problem arises in translating from an original document in WORD Times Roman to ITC New Baskerville in InDesign.  This process leaves no marker specific to the original Greek symbol. </p>
    <p>Questions: </p>
    <p>(1) is there a complete ITC New Baskerville font set available that has the key Greek symbols needed for statistics?</p>
    <p>(2a)  If not, Is there some way in In-Design that we can "program" a reading of each missing symbol into say the Times Roman equivalent - so that almost everything would be in ITC Baskerville except for these occasional Greek letters. </p>
    <p>(2b) Better still, if there is a way, do you know where we might get Greek letters in the ITC new Baskerville font to  add to our current set. </p>
    <p>(3) If there is no solution to suggest to the above,  can you suggest a font that is very close to the look of ITC New Baskerville but has a more complete Greek symbol set.</p>
    <p>(4) Any other suggestions welcome such as where else to look for a solution.</p>
    <p>Thank you to anyone who has information.  I am new to the group and apologize if this is a routine question. Please point me to the right FAQ section, if so.</p>
