    html: |-
      <p>The Unicode site says:</p>
      <p>"You may freely use these code charts for personal or internal business uses only. You may not incorporate them wholly or in part into any product or publication, or otherwise distribute them without express written permission from the Unicode Consortium. However, you may provide links to these charts."</p>
      <p>They also claim copyright in the information expressed in the charts. Additionally, according to this page (<a href="http://unicode.org/policies/logo_policy.html" title="http://unicode.org/policies/logo_policy.html">http://unicode.org/policies/logo_policy.html</a>), "Unicode" is a registered trademark.</p>
      <p>These may be things you want to consider, even though I think it's a great idea.</p>
