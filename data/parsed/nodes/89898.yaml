    <p>I was going to design a series of t-shirts based on the <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> Standard*, but I am worried they will violate the copyright of the charts.</p>
    <p>My questions are:</p>
    <ol>How different would they have to be from the posted PDF charts? In other words, can I use a grid?</ol>
    <ol>Can I mention the word "Unicode"?</ol>
    <ol>Assuming I own the typeface, is it a violation of the EULA to list all characters in a given block?</ol>
    <p>Thank you for any input you can give me.</p>
    <p>-Neil</p>
    <p>*I realize that it is rather foolish to mention this idea to a group of professional designers, but I trust you.</p>
