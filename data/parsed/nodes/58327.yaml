      <p>Timo, I think you are over thinking it, as it is often the case when working on your own things.<br>
      What is it that you don't like about your current word mark? The idea of breaking apart the "T" works well in my opinion.<br>
      An alternative option could be to use a squarish sans which would allow you break down the whole "BITS" part.<br>
      Some ideas: <a class="freelinking external" href="http://new.myfonts.com/fonts/feliciano/bs-mandrax/" rel="nofollow">Mandrax</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/capearcona/ca-monodon/" rel="nofollow">Monodon</a><br>
      Seb</p>
