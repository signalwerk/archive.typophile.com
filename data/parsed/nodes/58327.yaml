    <p>Hello everybody,</p>
    <p>I am running a web design business and I'm still not happy with my logo. This is what I have right now: <a class="freelinking external" href="http://www.designbits.de" rel="nofollow">current logo and website</a></p>
    <p>Last night I had this idea and I wonder if's got potential: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_mouse_5506.png"></div><p></p>
    <p>The s-curve in particular looks a bit shabby. I probably need a few more hours of Illustrator practice to get it going.</p>
    <p>I also wonder if the concept makes any sense and if the "DB" mark should be any bigger or even placed somewhere else.</p>
    <p>Any help is appreciated. Thanks.</p>
