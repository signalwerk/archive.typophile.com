    <p>I used this machine the other day:</p>
    <p><a href="http://www.epson.com/cgi-bin/Store/consumer/consDetail.jsp?BV_UseBVCookie=yes&amp;infoType=Specs&amp;oid=47915743&amp;category=Products" title="http://www.epson.com/cgi-bin/Store/consumer/consDetail.jsp?BV_UseBVCookie=yes&amp;infoType=Specs&amp;oid=47915743&amp;category=Products">http://www.epson.com/cgi-bin/Store/consumer/consDetail.jsp?BV_UseBVCooki...</a></p>
    <p>Its huge and fast and is a solid piece of plastic,</p>
    <p>but are they any real advantages to the average graphic designer besides its size?</p>
    <p>I just want to know why anyone would buy it for $3000 rather than a nice one for $200.</p>
