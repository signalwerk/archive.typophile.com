      <p>I guess it mostly comes down to..."I Wish". Honestly, if I could easily afford it, I'd get it. It's no doubt your scans will come out beautiful, especially in comparison to the $200 scanners most common people own. BUT...most of us can't afford it...so to us, they are just pretty to look at, hoping one day we work for someone that will let us play with it.</p>
