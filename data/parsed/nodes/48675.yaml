    html: <p>I would, if I could afford it.  After having used crappy scanners for the last year (after mine regrettably stopped working), I am positively in withdrawl.  There is nothing compared to the depth of shading and color that you get with a higher end scanner.  Especially since I scan subtle sketches, marker and watercolor renderings, there is such a difference.</p>
