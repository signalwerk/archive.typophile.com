    votes: null
    html: |-
      <p>I think James has it about right. It all depends on the work you are doing.</p>
      <p>One thing about the higher-priced scanners is you can scan in the 16-bit mode. There is a lot of detail, esp. shadow detail, that can be recovered from most photographs, but this requires some heavy manipulation of the image -- severe compression, then re-expansion, similar to HDR compression techniques. Working in the 16-bit mode pretty much eliminates posterization as an issue. Sample down to 8-bit as a last step.</p>
