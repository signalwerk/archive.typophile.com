      <p><cite>I have a cheap Epson scanner I picked up from the refurbished section of Epson.com for less than $100, and the scans it outputs are almost indistinguishable from the high-end Epson and Microtek scanners that I’ve used.</cite></p>
      <p>But I would imagine that all of those scans pale in comparison with a scan done on a professional drum scanner from Scitex or Hell. But then most of the great color separation houses have been put out of business by the "crappy scan, do-it-yourself, I'm not paying money for that" crowd.</p>
      <p>The race to the bottom continues.</p>
      <p>James</p>
