    html: <p>I have a cheap Epson scanner I picked up from the refurbished section of Epson.com for less than $100, and the scans it outputs are almost indistinguishable from the high-end Epson and Microtek scanners that I’ve used. The average designer is printing work at no more than 300 lpi, so what’s the advantage of a high-end scanner? A scanner like that might matter if you’re archiving important photos or doing high-quality enlarging. If something really incredible needs scanning you can always just have the printer do it on a drum scanner that will blows away a flatbed and just charge it to the client. And 11"x17" scanning is nice to have if you do a lot of drawing, but that can be had for $1500.</p>
