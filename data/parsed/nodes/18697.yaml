  html: <p>I have a true type font and i want to trascode it to open type so it can be used in both windowsxp and OSx. To be more specific i want to use it in ILLU CS (windowsxp) and CS2 (OSX). How can i begin? Are there any helpfull tutorials on this matter? Does it matter if  the font is Greek?</p>
