    html: |-
      <p>The TrueType format has been integrated into OpenType. Each Windows TrueType (.ttf) font is already an OpenType font, more specifically, an OpenType TT font (OpenType font with TrueType outlines). All such fonts work in both Windows and Mac OS X. </p>
      <p>Adam</p>
