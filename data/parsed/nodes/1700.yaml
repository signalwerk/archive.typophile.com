    html: <p>So. Hm. Damn. <br> <br>Any suggestions on a substitute? <br> <br>The stage show is a modern touring singing all-woman troupe that uses a lot of 1940's styling... I'm thinking of going with Jukebox's Kon Tiki Lounge typeface (<a href="http://www.veer.com/results.asp?image=JBT0000031" target="_blank">http://www.veer.com/results.asp?image=JBT0000031</a>), but it does have a little more masculine feel to it.</p>
