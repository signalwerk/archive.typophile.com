    <p>Okay, so I'm designing a logo for a stage-show, and am really taken by the Veer logo. <br> <br><a href="http://www.veer.com/" target="_blank">http://www.veer.com/</a> <br> <br>I'm told it's custom... but I'm betting "custom" just means "fiddled with". Anyone have an idea what it is? ... or a suggestion for a solid substitute?</p>
