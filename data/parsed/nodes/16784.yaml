    html: <p>I should clarify that, even if you are able to put characters in the lower ASCII range (as in a PostScript font), you may not be able to access them. The lower ASCII range is not meant as a place to put “normal” characters. This is where special codes like the carriage return, line feed, delete, and tab are found. Using them for normal characters will probably not work, even if you are able to make such a font.</p>
