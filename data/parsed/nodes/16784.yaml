    html: |-
      <p>TrueType fonts cannot have characters in those slots. PostScript fonts can, but access is very limited in older Mac systems, and not supported in later systems. In Mac PostScript fonts, for instance, low ASCII slots are sometimes used by font developers to store Windows-only characters for convenience sake. But there is normally no way to access them on the Mac, and definitely no way to type them.</p>
      <p>What kind of strange printing system do you have which only supports 7-bit ASCII? An Epson MX-80?</p>
