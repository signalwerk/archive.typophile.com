    <p>I’m editing an existing ttf using fontographer 4.1.4 (Mac OS 9) - I’m a new user — trying to copy a character from, say, decimal char # 195 into char # 15.  The fog file saves the change, but when I generate font (either ttf or PS type 1), the change is not generated.  I need to be able to use some from ASCII chars 0 to 32 as I have a printing system that only supports up to ASCII 127.  Need help badly.  Thanks.</p>
