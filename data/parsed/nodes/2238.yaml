  html: <p>hi Im looking for some fonts similar <br>to this one (super) <a href="http://images.webmagic.com/klov.com/images/S/mSuper_Pac-Man.jpg" target="_blank">http://images.webmagic.com/klov.com/images/S/mSuper_Pac-Man.jpg</a> <br> <br>or if you can remember on old tshirt when you put your name on the back,  its like the  font they used for the credits in cheers <br> <br>It does have to be that one but does someone know a place to look for these styles? <br> <br>Thanks again <br> <br>Ian</p>
