  html: |-
    <p>New to Typophile (thanks to Tiffany [here] and John [at ILT]) - former lurker, old to Fontographer, new to Fontlab (stuck on 4.6 for the time being), old to type design, new to Multiple Master design, old at breaking things and creating strange problems for myself...</p>
    <p>Well, I've been plugging away at my design for a few months now and have nice, full set of glyphs I'm pleased with - diacritics, alternates, ligatures, and so forth. I (naively) started replacing charatcers in an existing font whose character set I liked, made my own kerning classes (rights and lefts), defined a few other classes, set kerning nicely for my base set of U &amp; lc and Small Caps, got my alternates and old style refined - and I've somehow broken it so completely I have no idea what I did.</p>
    <p>Compiling in the OT panel (or at output) results in a delightfully vague response:</p>
    <p>"aborting because of errors"</p>
    <p>Hurray...</p>
    <p>For a while it would complain certain kerning classes were missing when they're in my list, so I made it worse and now I'm just bewildered. The Fontlab manual seems to think I already know what I'm doing, so I've run out of self-generated options.</p>
    <p>Help?</p>
    <p>Thanks.</p>
