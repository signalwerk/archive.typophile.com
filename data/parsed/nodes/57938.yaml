      <p>Jackson seems to have the best advice on this (and to Paragraph - I had two duplicate glyphs, thanks for that too). I've placed all characters in to a new, blank document and rebuilt/imported features and kerning from there and things are working correctly so far. Needed a good clean start apparently. </p>
      <p>A note to another vague error (see: <a href="http://typophile.com/node/33743?destination=node%2F33743" title="http://typophile.com/node/33743?destination=node%2F33743">http://typophile.com/node/33743?destination=node%2F33743</a>) I got a balk on output with no OT compile errors, turns out the file needed font name and info or it'd choke at 91% output every time.</p>
      <p>Thanks again,</p>
      <p>Michael</p>
