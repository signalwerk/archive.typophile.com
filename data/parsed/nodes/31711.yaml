      <p>Aziz, you wrote <em>Linda, do you live to design or design to live?</em></p>
      <p>Probably both.  ;-)  After having a career as a successful writer and broadcaster, I trained and practiced as an interior designer in NYC, and combined the two by doing pretty much everything in PR, marketing, communications and publications design -- for "fun", I did "craft."</p>
      <p>Then I went back to graduate school to do a Masters in Environmental Design and started exploring a lot more of the graphic/typography side of wayfinding and how we interact with our world.  Now I've brought that part of me together with the craft side to design and bind books.</p>
      <p>And write a little.</p>
      <p>Terry, you wrote <em>I’d probably be either a filmmaker/animator or an illustrator/artist.</em> </p>
      <p>Doesn't count, man: that's still "design."  ;-)</p>
