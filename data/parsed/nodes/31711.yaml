      <p>Actually, I wasn't kidding about the <em>Kung Fu Master</em> answer, though I did forget to mention <em>teacher</em>.</p>
      <p>For me art, design, typography, calligraphy, martial arts (I've studied nearly fifteen years traditional Japanese and Chinese martial arts with asian masters) and teaching are all part of <em>being</em>... and each one shares or infuses meaning into the others.</p>
      <p>Though not typically connected in Western thought, becoming a master swordsman or calligrapher was not seen as very different from an <em>Eastern</em> viewpoint.</p><div class="imageWrap"><img src="http://typophile.com/files/hero_combo_3516.png"></div><p></p>
