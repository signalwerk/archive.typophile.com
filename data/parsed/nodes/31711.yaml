      <p>Aziz, what do you mean by 'Designer'?</p>
      <p>'Cause I understand 'Designer' as one who can communicate - and one who can communicate in many different disciplines is one as valid(?) as one who can communicate in a single discipline ie. Type.</p>
      <p>I'm a grad of the Frank Lloyd Wright school of architecture, (only because it was the lesser of all evils), and I have dabbled in fashion design, graphic design, and industrial design. Unfortunately, and with deep regret, I only got a grip on the design of Type a year or so ago.</p>
      <p>Az man, if I couldn't design - I would die of a broken heart - serious.</p>
      <p>_________<br>
      Hiro</p>
