  html: |-
    <p>This is a facsimile of a book entitled <em>Los hombres que dispersó la danza</em>, by Andrés Henestrosa (yes, he was my relative). It was printed in Mexico by Compañía Nacional Editora Aguilas S. A. in 1929.</p>
    <p>Anyone knows what typeface is this, or if something similar has been digitized?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HombresDanza_5825.jpg"></div><p></p>
