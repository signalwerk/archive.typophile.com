  html: |-
    <p>I want to take a illustrator file into indesign.</p>
    <p>But when i do the text isnt a text box and each line is in its own box.</p>
    <p>Is it possible for each box of text to stay of box of text when taking a illustrator file into indesign?</p>
    <p>Thanks alot</p>
    <p>Tom</p>
