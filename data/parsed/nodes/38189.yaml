    date: 2007-10-18T14:06:00
    date_raw: 18.Oct.2007 2.06pm
    votes: null
    html: <p>The reason that it works well between AI &amp; PS, but not ID is that Illustrator &amp; Photoshop share the same underlying text engine. InDesign has its own, which was tuned for much longer documents and more complex text flows.</p>
