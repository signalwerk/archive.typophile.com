    html: |-
      <p>Hi Tom</p>
      <p>If you highlight the text with the type tool in Illustrator and then paste it into InDesign using the type tool it will remain as text.</p>
      <p>You will loose all text formatting applied in Illustrator, however if you set up a character style in InDesign with the formatting that you want and select it before you paste, the pasted text will appear in that style. Alternatively paste the text and then apply the style.</p>
      <p>Hope this helps</p>
