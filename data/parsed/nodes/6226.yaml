    html: "<p>I agree with Stephen: let's please not shoot the messenger here. <br> <br>Just a quickie to support Hrant's theory: <br>A bridge was built, connecting Paradise Island to Nassau in the Bahamas. In order to recoup the construction costs and maintenance, the companies that built it decided to ask people $2 to cross the bridge from one island to the other. <br>After a certain amount of time, those companies notice that they're actually losing money. First they intend to close down the bridge, but instead they lower the fee to $1. Since then, the bridge is economically viable: for that amount of money, using an alternative simply is not worth it anymore. <br> <br>Y <br> <br>PS You might ask yourself (and with good reason): is he on drugs? Well, I can guarantee you: I don't even drink coffe. I lock myself up for 4 hours twice a week in a rehearsal room that reeks of stale beer and armpits, though. ;)</p>"
