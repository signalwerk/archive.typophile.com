    html: '<p>I believe that is very very tricky the situation: "Rich guy living in a poor country / Poor guy living in a rich country". <br> <br>I can assure that I know almost every person developing fonts and interested in enter to ATypI in my country, Argentina (and many of the other latin american countries) and nobody is such "rich guy". Mr. Porchez... What is your source of information about the third world? The CNN channel? <br> <br>I strongly believe there are a lot of worthy designers in our poor countries and a *real* international designers asociation should help to spread the information and collaboration without any boundary or limit. <br>With its elitistic behaviour the ATypI is loosing a lot of good designers with fresh ideas and a rich tradition in popular lettering.  <br> <br>Ignoring the differencies between countries is just to confirm, to afirm, to increase the gaps. <br> <br>We do not want to be in the ATypI for free. But we want to pay fees in relation with the situation of our economies. <br>A politic of grants and voluntary work would be a great beginning. <br> <br>There is a long and rich humanist tradition in the design heritage. We should act as real humanists, being generous with knowlwdge and not acting like stupid snobs.</p>'
