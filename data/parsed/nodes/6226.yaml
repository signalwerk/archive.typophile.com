    html: "<p>A couple of things need to be noted. The financial model under which ATypI operates is not all that different from that under which our Argentinian friends find themselves. It is not a wealthy association: it struggles to make sure that costs are covered from one year to another, very rarely manages to produce a surplus, is almost entirely driven by volunteer efforts. Membership fees are basically the only way in which the association can pay for its activities between annual conferences. Personally, I think it will be necessary for membership fees to be increased in order to improve the operational effectiveness of the association. <br> <br>At the same time, I would love to be able to make the benefits of membership available to more people. One option that springs to mind (and which David Earls has also raised) is to develop affiliate relations with sister organisations (either national or regional) that would provide a means for more regular exchange of information between ATypI and type professionals who are not members but who may belong to sister organisations. So, for example, an Argentinian type association with its own membership rules and fees, might enter into such a relationship with ATypI, so that there would be a point of contact between Argentinian designers and ATypI. We would need to explore the ways in which this relationship could be mutually exploited, to ensure that members of both organisations benefit. It would also be necessary to establish guidelines for organisation structures, goals and activities to ensure that relations are only established with organisations that share ATypI's goals. If people think this is worth exploring, I could take the question to the ATypI board. <br> <br>It would be interesting to know what kind of type or design associations exist in Argentina, as an example case.</p>"
    html_clean: "<p>A couple of things need to be noted. The financial model under which ATypI operates is not all that different from that under which our Argentinian friends find themselves. It is not a wealthy association: it struggles to make sure that costs are covered from one year to another, very rarely manages to produce a surplus, is almost entirely driven by volunteer efforts. Membership fees are basically the only way in which the association can pay for its activities between annual conferences. Personally, I think it will be necessary for membership fees to be increased in order to improve the operational effectiveness of the association. <br> <br>At the same time, I would love to be able to make the benefits of membership available to more people. One option that springs to mind (and which David Earls has also raised) is to develop affiliate relations with sister organisations (either national or regional) that would provide a means for more regular exchange of information between ATypI and type professionals who are not members but who may belong to sister organisations. So, for example, an Argentinian type association with its own membership rules and fees, might enter into such a relationship with ATypI, so that there would be a point of contact between Argentinian designers and ATypI. We would need to explore the ways in which this relationship could be mutually exploited, to ensure that members of both organisations benefit. It would also be necessary to establish guidelines for organisation structures, goals and activities to ensure that relations are only established with organisations that share ATypI's goals. If people think this is worth exploring, I could take the question to the ATypI board. <br> <br>It would be interesting to know what kind of type or design associations exist in Argentina, as an example case.</p>"
