    html: <p>It would be fairest to index all membership fees to economic indicators for members' countries of residence. With access to such indicators, this is potentially easier than trying to divide the world into vaguer economic blocks. If the USA is taken as the high water mark, it is clear that the fee for members from that country would need to increase over current levels in order to maintain a balance with adjusted fees for members from other countries. Over time, the system could be finessed, but initially ATypI would need to look at it's current membership and work out a scale that produces an average fee suitable for not only maintaining but improving the operational effectiveness of the association. <br> <br>Hm. This could be quite fun. I think I'll pop out and buy a copy of <i>The Economist</i>.</p>
