    html: <p>Why should I as an individual pay the same for Adobe Photoshop as General Electric? Life, sadly, isn't fair, and until something dramatic happens (probably in about 15-20 years when the oil runs out) that is unlikely to change.   <br>  <br>What one <i>can</i> do is to formulate alternatives to ATypI. Perhaps by setting up a similar organisations in these "developing" areas?   <br>  <br>Having a diverse global community of groups is often a far better approach than having one homogenised umbrella organisation anyhow, and would allow each group to reflect and serve the needs of its members more effectively.   <br>  <br>I see no reason why ATypI could not work with such local organisations and form affiliations, maybe working jointly on some projects, thus fullfilling its remit to internationalism, helping to share information and furthering our noble art.  <br>  <br>Just a thought.  <br></p>
