    html: "<p>Ramiro writes: <i>What you John and David are saying is: \"We can't admit poor persons in our club. Come on, set up another club for persons like you. May be (if we consider it interesting and profitable) we'll have some relationship\".</i> <br> <br>This is not at all what I am suggesting. I was very clear that the relationship is not between rich and poor 'clubs' but between an international association and national and regional organisations. This proposal is in no way limited to developing countries or countries in financial crisis. I think it is a model that could be usefully applied to all kinds of countries in which there are interested and committed individuals who are willing to form associations and, through those associations, interract both directly and through ATypI with associations in other countries. There are already many countries with graphic design and/or specifically typographic associations, and these can and should provide a point of contact among designers internationally. The benefit of such national associations is that they can set membership fees suitable to the internal financial situations of the countries in which they operate. Regardless of whatever steps ATypI might be able to take to make it easier for designers in all countries take part, I don't think an international association can fully take the place of local and national organisations. Elsebra mentioned some of the problems of the ADG. Is there any 'grassroots' movement to take control of the ADG, to manage it better? or perhaps to create a new association, perhaps less formally structured that can respond more creatively to the situation of designers in Argentina today? <br> <br>Having said all that, I'm very happy to explore with my fellow ATypI board members ways in which the membership could be opened to our colleagues who cannot afford the current, 'one size fits all' membership fee. I do think it is important, and I would not want to deny the possibility without examining the potential impact for good or ill on the association's finances. There is no question that the impact would be for the good in all other things; this is only a practical (how do we do it?) and financial (how will it affect our income and expenses?) issue. Hrant's suggestion of indexing fees to national economic indicators, while untypical, is not a bad way for an international association to proceed, so long as the average does not represent a decline in current revenues. The fact that such economic indicators are regularly published electronically suggests that the pricing could be semi-automated and set by ATypI for each year. Obviously, the number of current, renewing and potential new members each year needs to be factored into such calculations: ten new members from the USA is going to have a very different impact on ATypI's finances than ten new members from Bangladesh. <br> <br>In response to Jean-Fran</p>"
