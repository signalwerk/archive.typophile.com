  html: "<p>An interesting topic was raised yesterday on the Typophile Chat: some Latin-American users complained about the high member fees for ATypI, and asked if it would be conceivable to have cheaper fees for -in their own words- \"development countries\". <br> <br>I think this concern is valid. Could it be possible to couple the fee (and other member fees in general) to the Gross National Income or Mean Income or whatever you call this in English? I don't mind paying more than someone from Argentina, as I probably earn more too. <br> <br>Any thoughts?</p>"
