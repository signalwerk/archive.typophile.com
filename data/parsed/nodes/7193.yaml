    html: <p>In University libraries, particularly art schools. <br> <br>Since you are in Vancouver, you could check out Emily Carr. I don't know what other art schools are in the Pacific Northwest. There must be copies in California somewhere. <br> <br>When I was at RISD, there was an excellent inter-library loan programin place throughout all of New England's colleges. That was great. Except for the Harvard books. You had to go to Cambridge and look at them there. Plus, you had to schedule an "appointment" to even get into the library. Well, almost all of the other libraries were nicer.</p>
    html_clean: <p>In University libraries, particularly art schools. <br> <br>Since you are in Vancouver, you could check out Emily Carr. I don't know what other art schools are in the Pacific Northwest. There must be copies in California somewhere. <br> <br>When I was at RISD, there was an excellent inter-library loan programin place throughout all of New England's colleges. That was great. Except for the Harvard books. You had to go to Cambridge and look at them there. Plus, you had to schedule an "appointment" to even get into the library. Well, almost all of the other libraries were nicer.</p>
