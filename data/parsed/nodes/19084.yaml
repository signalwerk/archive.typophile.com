    html: |-
      <p>I can't find anything on the name ... yet. The problem with finding too much info on this subject is that I didn't focus on this typeface in my dissertation. I do believe I have more information, it is just a matter of finding it.</p>
      <p>From the notes I have here, it began as #268 on/around March 18, 1942 and ended as #283 on July 18, 1945. The fact that there was any sort of type design happening during the war is amazing to me anyway. But, I think Linotype might have been looking toward the future. </p>
      <p>In the notes I have C.H. Griffith seems positive about the type as it is being developed. The drawings were returned to Dwiggins with a letter dated October 11, 1945 by Helen Jagau, C.H. Griffith's assistant. Note these were the A-Z cap italic drawings. I need to find my proof notes. I don't recall if this was completed or not. She states with these drawings and #269 (Eldorado), "Mr. Griffith suggests that you put these away pending such time as we are able to proceed with the cutting of the experimental characters."</p>
      <p>In a letter written sometime in 1942, Dwiggins refers to it as "268 Didot-Bodoni, 9 pt." So even at this time the name had yet to be given. Further on in the letter he states, "A new statement on the theme, but no soap yet." They were still working on it and he had yet to see it take full form.</p>
      <p>I believe I have a folder with information from Dwiggins archives at Kentucky in my notebooks at home. Mi dispiace. I'm sorry that I haven't gotten to this yet for you.</p>
