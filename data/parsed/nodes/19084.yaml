      <p>It was an unconventional Bodoni which Dwiggins worked on for a while but was never released publicly. It had the working numbers of #283 and #268.</p>
      <p>It strikes me, perhaps, as a different sort of experiment with the marionette theory. I have images somewhere, I just can't find them at the moment. </p>
      <p>Why are you interested?</p>
