      <p>This is from my notes taken at the Boston Public Library. Transcribed from a hand-written letter which I thought to be a rough draft. There was no date on the note, but there are some numbers and proofs mentioned which could give hints of a date if I weren't too lazy to back track in my notes. When I was transcribing I did my best to keep all punctuation and words that Dwiggins used. The brackets are mine.</p>
      <p>- - - -</p>
      <p>[Pg. 1]</p>
      <p>When you spoke of turning the Modern Face Dept over to Rudolph you were not (I trust) warning me to keep my hands off that end altogether? Because I can’t resist the temptation to twiddle with the idea behind the Bodoni-Didot experiment – I keep turning the picture this way and that to see how one might cure the trouble of the 268 efforts ‘f’ and, consequently, cure the trouble in the Bodoni, which the 268 stuff paralleled too closely. There is a better letter than Bodoni in that pigeon-hole if one could only get salt on its tail… Maybe Rud’s try fetches it, but I am not quite sure.</p>
      <p>	The word to describe all the Bodoni modifications – Lino, Mono, even the Bauer “original” – is stodgy. They make a book stiff and lifeless. I often want for a book the color and tone that a Bodoni-class type would provide, but can’t get it with our present outfit. </p>
      <p>	My lead on this Dec 6 Packet</p>
      <p>All this modified into a formula – not copied precisely from pen letters, but worked out in terms of a metal punch all the time. Judging from what came through in the 7 pt [ x x x ] there is a chance that a lot of this would come through, unseen, in 12 pt. You don’t want to see it, as detail, but you want it to all build up into an influence that gives motion to the line.</p>
      <p>[Pg. 2]</p>
      <p>My lead in this Dec packet is the action of a fine flexible steel pen. This steel pen action is quite close to the motion produced in a line of lettering by the buren on copper (to reproduce which “look” was, of course, the yen behind the Didot types.)</p>
      <p>	One trouble of the Bodoni class of types, when they get together into words, is the [something unreadable] rigidity, of course, ruled lines and compass curves – but the main “action” trouble is in the spring of the arches and loop-elements away from the stems. In all the Bodonis this motion is always ugly – all the fawn-like grace of a galloping cow. If one could only get a type-metal equivalent of the nervous, pen-formed action in these places (i.e. the free-hand motion properly modified to fit type conditions, so it can be repeated all over a page without giving you [gum, gem, gun ?] jams) I think the letters would swing together into words and march. Getting a curve-formula that is both free, and yet not so free that it is unsuitable for type, is the job.</p>
      <p>	The actual 12 pt is the only way to tell whether a curve-formula works or not, but after our success with 7 pt 2[big space, might have not finished writing] where such a formula certainly did work, I think there is a way to get life and nervous motion into the Didot kind of letter and still have it suitable for body-matter set.</p>
      <p>	Anyway, here is another crack at it – and you can put it aside, or try it, just as you think best.</p>
      <p>	Your eye will light on these details – swelled stem, such as a fine soft pen makes (Didot did it), stem not too rigid: motion in it – trick with serifs, something like our one-time “butterfly tie” idea; aiming to get a sharp click of serif, and yet not rigid.  – the pen-snap – in the arched element --</p>
