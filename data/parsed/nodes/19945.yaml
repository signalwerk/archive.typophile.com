    html: |-
      <p>I actually designed a book on Taxi way back in the ’80s when it was still on TV. I had to recreate that type with an enlarged stat and a rapidograph. I also had to draw the “checkers” border by hand, imagine. But the strangest part was that I needed a to draw a checker cab icon but had no reference (long long before google) and looked out my office window and there was one stopped at a light right across the street. It was one of maybe 4 or 5 still running at that time. Did a quick sketch right then and there.</p>
      <p>Young designers don’t know how easy they have it.</p>
