    html: <p>I just got a tablet - a "Nexus 10", which is a bit cheaper than an iPad, and has a higher resolution screen - to show my FontLab preview window at 300 pixels per inch via Air Display. So far it's working nicely. Maybe not much use to someone who already knows how tweaks will look when scaled down, but I'm hoping it'll help me learn faster, and save some paper.</p>
