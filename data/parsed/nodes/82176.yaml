    html: |-
      <p>I can confirm that iDisplay works on an iPhone 4 with FontLab. I'd never tried this before--interesting idea. It has no effect on the performance of FontLab, any more than any extra display would. I would be careful about leaving FontLab windows or panels on the smaller display--it leaves them stranded sometimes if you change display setups.</p>
      <p>BTW, there's another similar app called Air Display which gets better reviews, but unfortunately doesn't support the resolution of the retina display. The reason they give is that UI elements would be too small to tap on. Apparently they didn't think of this kind of use.</p>
