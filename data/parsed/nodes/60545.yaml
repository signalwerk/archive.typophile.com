      <p>This might be a minor thing, but I would suggest some way of changing the default colors.  It doesn't bother me personally, but I'm sure there may be someone out there that might be jarred by it.  Maybe a small dropdown next to each list where they can change the colors?</p>
      <p>On a related note, for the same reason as above, I suggest that the font colors should not be within the fontlists.  The blue especially might make it hard for some people to read the titles (as the font names are coming in black).</p>
      <p>Other than that, great job!</p>
