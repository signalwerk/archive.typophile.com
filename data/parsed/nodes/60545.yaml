      <p>Really cool idea and great execution.</p>
      <p>The only thing I'm questioning is the sole ability to compare fonts on one's own machine. Should there be a way to compare fonts that one doesn't have/own the rights to? Though I'm not sure how that would happen without necessitating a rather hefty online database. </p>
      <p>Anyway, like I said, great job so far. And I appreciate the ability to freely move around the two specimens. You may also think about incorporating some form of guide system, so the user can align the two fonts more easily. </p>
      <p>penn</p>
