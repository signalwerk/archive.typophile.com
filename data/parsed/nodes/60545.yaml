    <p>Hey all,<br>
    This is my first post. I have been a silent viewer for a while now.<br>
    I've written <a class="freelinking external" href="http://alecjacobson.com/programs/font/java">an applet</a> that allows the user to compare any two fonts on her machine. The applet let's the user fine tune sizes and location allowing for a close-up and detailed font comparison. It's a java applet that runs in the browser (as long as you have java enabled):<br>
    <a href="http://www.alecjacobson.com/weblog/?p=89" title="http://www.alecjacobson.com/weblog/?p=89">http://www.alecjacobson.com/weblog/?p=89</a></p>
    <p><a href="http://www.alecjacobson.com/weblog/?p=89"></a></p><div class="imageWrap"><a href="http://www.alecjacobson.com/weblog/?p=89"><img src="http://typophile.com/files/Versus_6191.jpg"></a></div><p></p>
    <p>Let me know what you think and if you have any suggestions for improvements!<br>
    Thanks</p>
