      <p>Many thanks again for the suggestions and compliments. I have a much changed (an hopefully much improved) version up now, still at <a class="freelinking external" href="http://alecjacobson.com/programs/font/java/">http://alecjacobson.com/programs/font/java/</a>. The old version is still available for comparison's sake, now at  <a class="freelinking external" href="http://alecjacobson.com/programs/font/java/old">http://alecjacobson.com/programs/font/java/old</a>. I implemented some sliders for the sizes, handles for dragging both fonts,  a text field (with the option of inputting the old way because I was used to that and why not), and some buttons.</p>
      <p>Still haven't found a way to easily host fonts users might not have locally. </p>
      <p>Anyway, enjoy and keep the suggestions and comments coming.</p>
