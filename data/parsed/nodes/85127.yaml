  html: <p>I'm looking for a typespecimen for Krimhilde designed by Albert Augspurg in 1934 for the Ludwig &amp; Mayer foundry. The most characters I have come across so far is <a href="http://i.imgur.com/WHyVq.jpg" target="_blank" rel="nofollow">this image</a>. Any help would be great. Sorry if this was something that should have belonged in Type ID.</p>
