      <p>[Some of this repeats things already mentioned above. Following is my take.]</p>
      <p>Like the term 'leading', 'typeface' and 'font' evoke the metal era. </p>
      <p>A typeface was what was cut by the punchcutter, and a font or 'fount' was what was poured by the foundry. What was cut made up a cohesive set, and what was poured filled an order. In other words, the font was the deliverable, but what's on the face of the deliverable is what was categorized and named.</p>
      <p>Punchcutters cut <em>typical</em> representatives of conventional or iconic letterforms. Hence the term 'type.' They cut them more or less according to a pattern, and as a set. The typeface is the 'cut set' originating in a specific time and place. It can be added to at a later date.</p>
      <p>The cut set could include an italic and small caps. So that typeface encapsulates a roman, an italic and small caps. Another typeface might not. The italic, roman and small caps would be deliverable as separate fonts.</p>
      <p>In the digital era a font became a deliverable item in a font-suitcase, and a typeface became what is digitally 'graphed.' As a design, for instance, the typeface univers has many weights and widths, as well as obliques; a full font suitcase contains a document for each of these. Some users will have univers but only as a selection of these fonts.</p>
    html_clean: |-
