      <p>Sorry, Don, but there has been consistent use of the term typeface in a way that distinguishes between major styles, weights and widths. Historically, the reason for this is obvious, because the idea of marketing e.g. roman and italic typefaces under a single name is a relatively recent phenomenon. Even as late as the 1930s, Eric Gill conceived his roman (Perpetua) and italic (Felicity) under separate names. It is also worth noting that some typefaces were independently conceived and only later, and sometimes erroneously, associated, e.g. the pairings of Garamond romans with Granjon italics.</p>
      <p>We have a separate term -- typeface family -- to refer to a collection of separate-but-related typefaces under a single name.</p>
    html_clean: |-
