      <p>Mark: <em>Words derive meaning from the way they are used, not from what people say they mean (or should mean).</em></p>
      <p>Undeniably true, although the implications of this statement are often ignored of seldom thought-through. One implication derives from the observation that the same word is used in different ways by different people: meaning, while seldom idiosyncratic, varies among different communities. Another implication is that people saying ‘what words mean (or should mean)’ are in fact reporting either how they use those words or how they think those words should be used.</p>
      <p>As I wrote in my first post in this discussion, I agree that font and typeface are interchangeable terms for a great many people, largely metonymic in common use. But I'm a professional type designer and font developer, and I use the terms distinctively in a way that is meaningful, i.e. useful, within the context of my work. And I'm not about to abandon that distinctive use, because I need to be able to talk precisely with others in my professional community, so a usage that conflates or confuses the two terms is not useful to me.</p>
      <p>Thomas, I hope the written results of your poll will pay due attention to varying use in different communities. It is often the case that a more precise use of terminology exists within a minority community or subculture, whereas a less precise use prevails in the larger populace. But it is also the case that this usually implies a greater importance of the terminology among the minority, who have particular reasons to desire greater precision.</p>
