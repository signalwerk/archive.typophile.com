      <p>Because he is.</p>
      <p>It just so happens that most digital typefaces are designed for one font size, say, 12pt for text, 18pt for display. The fact that we scale them to whatever we want doesn't mean that it isn't one cut, or font. Each different weight is a different cut, or font. Each style is a different cut or font. The size isn't specified any more, but it is implied, even though we ignore it.</p>
      <p>When you get into the optical sizes, then you even start to restore some more of the original meaning of a specific typeface cut for a specific size/weight/style. Garamond Premier Pro Light Italic DISPLAY, where DISPLAY is Adobe's way of saying 36pt or whatever.</p>
