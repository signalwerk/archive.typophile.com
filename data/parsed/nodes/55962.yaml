      <p>Here's an OLD GUY checking in, phrostbyte.</p>
      <p>When I was a young guy, daily working in letterpress book printing shops and in a Monotype house a "font" was a wrapped-up package of, say, 12-point Garamont. Another font would contain 12-point Garamont italic. Another would have 12-point Garamont small caps. Three other fonts would have those same typefaces, but in 11-point. And so forth.</p>
      <p>The typeface was Garamont or Garamont italic or Garamont small caps. I disagree with enne_son that a typeface "encapsulates" roman, ital, and smalls. To the compositor on the floor, assembling a book or an ad, or to the guy who ties and wraps the fonts, the roman, the ital, and the smalls are different typefaces.</p>
      <p>Yet it is indeed possible to speak of Garamont as a typeface in a more general sense, as in "That beautiful book is set in Garamont." A more thorough description of the book might note that three typefaces (rom, ital, and smalls) had been used, each in several sizes. </p>
      <p>Nowadays, sitting in front of a computer, a font is the digital data that allows me to see a typeface on a screen or to allow that typeface to be printed on paper. MyFonts describes LTC Garamont as "a font family of 12 fonts."</p>
      <p>The typeface is what I see on that screen or on that sheet of paper or on a tee shirt, etc.</p>
      <p>B U T :  This may be an issue on which we must agree to disagree. Just in this short thread there are quite a few differences between font and typeface, based on good thought and experience. And then there is the wider world's use of "font" to describe everything from printed typefaces to the words "I love Cheryl" scratched in the oceanside sand with a pointed stick. </p>
      <p>powers</p>
