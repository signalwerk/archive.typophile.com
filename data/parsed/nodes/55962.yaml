    html: |-
      <p>megax:<em>Very simply put: A typeface is a set of one or more fonts.<br>
      Typeface = Parent;<br>
      Font = Child;</em></p>
      <p>Nope, that doesn't work, because a ‘set of fonts’ may also imply a typeface family, which consists of more than one typeface, e.g. Time Roman, Times Italic, Times Bold, etc., all of which are separate typefaces. The best way to understand the distinction between typeface and font is not to try to define a relationship between the two -- e.g. parent and child --, but to realise that the distinction is meaningful precisely because the relationship is multivalent. And it is multivalent because of the variety of font technologies and how those technologies embody typefaces. For instance, a single typeface might be embodied in a single font (typically the case for OT fonts), but it might also be embodied in muliple fonts (as was the case with many typefaces in Type 1 format, requiring separate fonts for ligatures etc.), or multiple typefaces might be embodied in a single font (as is the case with individual Asian fonts containing both roman and italic Latin companions).</p>
    html_clean: |-
