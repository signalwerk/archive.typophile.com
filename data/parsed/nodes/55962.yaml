    html: |-
      <p><em>i reckon the terms have become interchangeable today.</em></p>
      <p>They're interchangeable until you need to make a distinction. In practice, this means that for the typical user, they are interchangeable, while for type professionals they are more like to be used in a more precise and differentiated way. I need to be able to distinguish between a design and an implementation of that design in a particular technology. As you say, the word ‘fount’ has been around for a long time, but it has always referred specifically to a particular implementation of a typeface: formerly a tray of metal type at a particular size -- e.g. ‘a 10pt font of Times New Roman’ --, then to a set of Linotype matrices or a Monotype matrix case, then to a variety of glass and film negatives or positives, and most recently to software.</p>
    html_clean: |-
