    html: |-
      <p>Paul let me try to sway you. ;^)</p>
      <p>Think of Dwiggins's M-Formula when you consider the italics. At smaller sizes it will be just interesting enough to be original and when you use it at display sizes it will be an entirely new font. Relato's italics, for me, are a lot of what I would consider the reason to license it. Where the roman is nice, I have many other fonts in my library which are similar enough that I couldn't rationalize the license. However, those italics! They remind me of the italics that <a href="/wiki/John%20Downer" class="freelinking" rel="nofollow">John Downer</a> designed for <a href="http://www.emigre.com/EF.php?fid=141" rel="nofollow">Triplex</a>. Don't shy away from something because it doesn't appear to be the norm. </p>
      <p>Although, I don't see a double-f ligature! So that might be a reason for me not to license it. ;^)</p>
    html_clean: |-
