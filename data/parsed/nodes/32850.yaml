    html: <p>I'm surprised no-one, except SuperUltraFabulous, mentioned the bold, which is beautifully emphatic. One of the reasons I bought Relato Serif was for the superb bold (plus it was also on the same ridiculously cheap deal at MyFonts a couple of months back:-). I'm certainly going to scoop up some Relato Sans faces at these prices! Plus, I would presume it will set more or less identically to the Serif, in which case it's a very economical font, almost identical to Myriad.</p>
