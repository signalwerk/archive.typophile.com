    html: |-
      <p>For me Relato Sans is a mix of Mundo Sans (and similar types), Klavika, and let say 'informational' dutch sans types.</p>
      <p>I have to disagree with the comments about the roman- perhaps the tone of its not serious enough for certain jobs but it is special. The hyper-modulation in the italics are not distracting (nor apparent) at book sizes. But like Tiff says... enlarge them and you have something new and very funky. And that goes for the roman too. </p>
      <p>The small caps look to die for!!!</p>
      <p>The Absara family has bony less friendly feel. And I don't like serif in print.</p>
      <p>I also would like to see more ligatures added to this family- as well as Bohemia!!!</p>
      <p>Mikey :-)</p>
    html_clean: |-
