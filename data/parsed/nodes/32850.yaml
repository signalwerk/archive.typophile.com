  html: <p>Okay, so i know <a href="/wiki/Relato%20Sans" class="freelinking" rel="nofollow">Relato Sans</a> is a TDC winner and all, and it's currently on special at myfonts.com, but i'm not sure if i should spring for it. i love the roman fonts, but the italics are a little out there for me. can any of you sway me one way or the other on whether or not i should scoop this one up?</p>
