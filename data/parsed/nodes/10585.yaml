  html: "<p>Hello, <br> <br>I've been asked to put together a couple of pages for our Corporation's intranet site about fonts and the legal issues that pertain to them. This would have to be short, sweet and to the point, but something more than just: <br> <br>Don't steal fonts! <br> <br>Feed the designers! <br> <br>Don't steal fonts! <br> <br>I'd love to hear your suggestions. If you could tell a massive corporation what they should know about fonts, what would you write? Better yet, can you do it in Power Point bullet point style so popular in the corporate world? <br> <br>Thanks! <br> <br>kristin</p>"
