    html: |-
      <p>These alchemical/astrological and monetarian character sets are actually a part of Andron Mega. I extracted them and put them into extra fonts because sometimes they are needed for specialized editing work. For those who need such characters but do not want to purchase Andron Mega. A few years ago I did the same with <a href="http://www.myfonts.com/fonts/andreas-stotzner/andron-corpus-publix/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Andron Publix</a>.<br>
      I also consider to release even more character sets out of Andron Mega as seperate fonts, e.g. Runic.</p>
