    date_raw: 27 Sep 2006 — 2:53pm
    votes: null
    html: <p>The logic may be that articles and propositions should not be separated from the following word because that's too much of a "broken meaning clump". This practice would help eliminate that. The worst example is when a two-word phrase is emphasized, either by quote marks or italics, and broken over two lines.</p>
  - id: 159831
    user: 13948
    date: 2006-09-27T15:35:00
    date_raw: 27 Sep 2006 — 3:35pm
    votes: null
    html: |-
      <p>I do this quite often with my ragged right settings. I don't like little words at the ends of lines. The wordspace before the little word is too close to the end of the line and makes the little word look like it's hanging in space. I also like to massage the rag so it isn't quite so ragged, and if that means moving a word down a line even if it fits the measure, I'll do that too. I might even track an individual line a little bit to help the rag.</p>
      <p>Also, I agree with Nick's comments.</p>
      <p>(They certainly are not called orphans or widows.)</p>
