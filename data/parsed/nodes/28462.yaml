      <p>That's strange. I understand if they don't want two characters at the end of a line before a hyphen (in fact I set that up as a preference in H&amp;Js), but a whole word? Never been asked to do that before. </p>
      <p>Is the text justified or rag right? If the latter it sometimes looks bad if a short word hangs off to the right but that is certainly not the case in your sample.</p>
  - id: 159754
    user: 2289
    date: 2006-09-27T10:21:00
    date_raw: 27 Sep 2006 — 10:21am
    votes: null
    html: |-
      <p>I go through my documents to turn them over if, for example, they are on the longest line of a block of text or if there is a ladder of one, two or three character words at the end of consecutive lines, I also prefer to turnover the first word of a sentence if it is short.</p>
      <p>The reason is to achieve a smooth rag, but I do hate being dictated to by a bit of software, rebel against its tyranny if you think your setting looks good:)</p>
      <p>Tim</p>
      <p><em>Edit: I should have mentioned that I normally only do this for ragged right, although ladders are more of a problem for justified text</em></p>
