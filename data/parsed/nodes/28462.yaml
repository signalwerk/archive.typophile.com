    <p>I know this has been hashed out a bit before, but not in quite this case:</p>
    <p>I've been setting some documents in FileMaker, to export from records. I had neatly made use of all of its (very limited) capabilities to make them not-bad-looking. So I was a little surprised when I was instructed to eliminate widows and orphans – I looked back over the document, found none – and asked again, and was told that I ought to be putting in non-breaking spaces in order to get rid of three-character or less words at the ends of lines. Yeah, lines, not paragraphs or columns or pages. For example:</p>
    <p><code>This is not an acceptable block of text because it<br>
    has a first line with a two-character entity at the<br>
    end. And a second, whereas the following, third line<br>
    is okay because I've carriage-returned “is”.</code></p>
    <p>Has anyone heard of this ? Apart from being maddeningly tedious, is this standard practice? I can't quite figure out the sense of it.</p>
