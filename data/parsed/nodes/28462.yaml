    html: |-
      <p>What an odd idea, and something I've never run into before either.</p>
      <p>The only rationale I can think of, particularly with a ragged right margin, would be if your font size/line length proportion was exceptionally unusual (i.e., small font/long line) where, indeed, you might get an excessive number of two- or three-letter words hanging out consecutively, particularly if there is no hyphenation.</p>
      <p>But there are lots of other solutions to that situation too.</p>
  - id: 159824
