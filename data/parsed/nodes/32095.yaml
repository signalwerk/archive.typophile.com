      <p>I just heard a lecture of Georg Salden two weeks ago at the "forum typografie", and he also talked about Polo. from what he (and Luc de Groot) said, I concluded that there seems to be… well… a disagreement concerning the originality of Meta.</p>
      <p>But, as i said, that's all just by hearsay.</p>
      <p>Salden is nowadays selling typefaces via <a href="www.typemanufactur.com">www.typemanufactur.com</a>. There are only a few of them available there, I think he designed dozens more. Very nice guy, by the way.</p>
