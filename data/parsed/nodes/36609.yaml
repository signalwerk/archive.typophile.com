      <p>There is a list of books here: <a href="http://typophile.com/node/12157" title="http://typophile.com/node/12157">http://typophile.com/node/12157</a></p>
      <p>Recommended for your purpose are:</p>
      <p>Tally of Types, A -Morison, Stanley. David R. Godine, Publisher, 1999.<br>
      Anatomy of a Typeface -Lawson, Alexander. David R. Godine Pub., 1990<br>
      Treasury of Alphabets &amp; Lettering: A Source Book- Tschichold, Jan. W.W. Norton &amp; Co., 1995<br>
      Letters of Credit: A View of Type Design -Tracy, Walter. David R. Godine, Publisher, 1986<br>
      Elements of Typographic Style -Bringhurst, Robert. Hartley &amp; Marks, Vancouver, 1997.</p>
      <p>Elements... is the more general of this selection, and the others take over where this one ends.</p>
      <p>Are you looking for info on scripts as well, then have a look in the main list.</p>
      <p>Enjoy the journey!</p>
