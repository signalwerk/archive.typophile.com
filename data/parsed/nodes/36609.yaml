      <p>Ooo. Didn’t know there WERE books on wine label design. Saweet! </p>
      <p>As to the color books, I prefer <a href="/wiki/Leslie%252BCabarga" class="wiki">Leslie Cabarga</a>’s “The Designer’s Guide to Global Color Combinations”. The pallets presented are more natural, and are richer, than plain old static color combinations because he resources classical and natural pallets from the world around us.</p>
