      <p>Wine labels need not always be classic... And I do not believe in one single “bible” of typography. Read many books, take in many opinions... then form your own. Here are some other titles — I think you need to <em>see</em> good typography as well as read about it:</p>
      <p><a href="http://www.amazon.com/Type-Image-Language-Graphic-Design/dp/0471284920/ref=sr_1_2/105-5539137-9346847?ie=UTF8&amp;s=books&amp;qid=1188445639&amp;sr=1-2"><em>Type and Image: The Language of Graphic Design</em></a></p>
      <p><a href="http://www.amazon.com/Typology-Type-Design-Victorian-Digital/dp/0811823083/ref=sr_1_4/105-5539137-9346847?ie=UTF8&amp;s=books&amp;qid=1188445639&amp;sr=1-4"><em>Typology: Type Design from the Victorian Era to the Digital Age</em></a></p>
      <p><a href="http://www.amazon.com/Meggs-History-Graphic-Design-Philip/dp/0471699020/ref=sr_1_40/105-5539137-9346847?ie=UTF8&amp;s=books&amp;qid=1188446108&amp;sr=1-40"><em>Meggs’ History of Graphic Design</em></a></p>
      <p><a href="http://www.amazon.com/Thinking-Type-Critical-Designers-Students/dp/1568984480/ref=sr_1_1/105-5539137-9346847?ie=UTF8&amp;s=books&amp;qid=1188446393&amp;sr=1-1"><em>Thinking with Type</em></a></p>
      <p><a href="http://www.amazon.com/Thinking-Type-Practical-Philosophy-Typography/dp/1581153848/ref=sr_1_9/105-5539137-9346847?ie=UTF8&amp;s=books&amp;qid=1188446512&amp;sr=1-9"><em>Thinking In Type</em></a></p>
      <p><a href="http://www.amazon.com/Quick-Solutions-Great-Type-Combinations/dp/0891345183/ref=sr_1_1/105-5539137-9346847?ie=UTF8&amp;s=books&amp;qid=1188446702&amp;sr=1-1"><em>Quick Solutions for Great Type Combinations</em></a></p>
      <p><a href="http://www.amazon.com/Type-Rules-Designers-Professional-Typography/dp/047172114X/ref=sr_1_1/105-5539137-9346847?ie=UTF8&amp;s=books&amp;qid=1188446798&amp;sr=1-1"><em>Type Rules!</em></a></p>
      <p><a href="http://www.amazon.com/Typography-Workbook-Real-World-Graphic-Design/dp/1592533019/ref=sr_1_2/105-5539137-9346847?ie=UTF8&amp;s=books&amp;qid=1188446912&amp;sr=1-2"><em>Typography Workbook</em></a></p>
