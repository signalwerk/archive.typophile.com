    <p>I design wine labels and some are very nice but I stink at typography. I am often blown away by my competitions use of type. I am not talking about designing type or reworking it. I am talking about what fonts to select and interesting compositions. I don’t understand how they consistently bang out great design. Often their type choices are clean and classic. Any tips on how I can improve so I can remain competitive. Books, web sites references. How do kick butt designers do it?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/36688" class="topic-previous" title="Go to previous forum topic">‹ Flavour, food? Type? HOW???</a> <a href="/node/36488" class="topic-next" title="Go to next forum topic">Enlightenment ›</a></div>
