      <p>With great respect to Bringhurst et al..........</p>
      <p>That’s what you need (or to start with): </p>
      <p>1. Imagery: Art for Wine — Bob L. Nugent</p>
      <p>2. Icon: Art of the Wine Label  —  Jeffrey Caldewey</p>
      <p>3. Wine Label Language —  Peter Saunders</p>
      <p>Also couple books (or several of them) about color; for example,  Designer’s Guide to Color — Jeanne Allen.</p>
