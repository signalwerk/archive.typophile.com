      <p>David</p>
      <p>I saw your note regarding the Princeton thing after I posted. Yes, this is one of the recent studies, there is another, more recent, that suggests that the letterforms in B42 were composites of letterforms rather than a glyph in its entirety. </p>
      <p>Sand casting was the traditional technique for casting coins and medallions and was used by the Koreans in the casting of their type. It was as well used in the West for some long time—Moxon writes about it (in 1683) as used for the casting of large letters. Moxon is credited as the first writer to fully examine the printing process (Mechanick Exercises on the Whole Art of Printing). However, when I early on made an inquiry to a knowledgable source about the sand casting theory in regard to B42 his remark was simply, "There wasn't enough blue sand in Mainz."</p>
      <p>Gerald</p>
