      <p>Tom</p>
      <p>Just something further. Some of the speculation presented in the Helmutt Lehmann-Haupt study (I assume you are referring to Gutenberg and the Master of the Playing Cards) is no longer valid, having been dismissed by subsequent research. A number of similar perfectly common-sensical ideas have been dropped by the wayside as well. An example would be that the wood block book preceded books printed with movable type. This would seem to be a logical progression but there is no evidence that this was the chain of events. Rather there is evidence that it was not.</p>
      <p>A book you might want to acquire is Printing in the Endo Period / Ieyasu: Typographic Man, which was published by the Printing Museum, Tokyo in 2000. Interestingly, therein is an article on the influence of Korean Dynasty Metal Type Culture on Japan as well as an article describing the introduction of Western printing to Japan. The first printing press arrived there in 1587–1590. The book is an attempt to examine and promote Japanese achievements and progression in printing history but despite this (from my reading of it) there is nowhere to be found within any claim that developments in Korea or elsewhere had influence on or were known in the West.</p>
      <p>This is a catalog of an exhibition and there are numerous photographs of printed materials, casting moulds, cast type.</p>
      <p>Gerald</p>
