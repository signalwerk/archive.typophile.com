      <p>David</p>
      <p>I'm not stuck on the validity of the idea, just entertaining it as a possibility for the sake of thinking about it. I don't think there is probability at play here. But I'm having a hard time following your argument regarding post-processing. </p>
      <p>The methodology of using punch, matrix, and mould to produce movable type that we know to be the successful approach may very well not be the way that it all began. Recent Gutenberg studies have turned up anomalies in letterforms in early printed artifacts that could indicate that the casting process initially employed was dissimilar. The development of movable type in the West was likely a bit more tortured than we have assumed. It is quite apparent that Gutenberg et al spent a great deal of time experimenting with various techniques but these recent studies would suggest that the eventual successful application may not have been fully resolved in the earliest of printed books.</p>
      <p>Gerald</p>
