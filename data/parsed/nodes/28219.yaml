      <p>xensen</p>
      <p>Actually, no, the burden would be on those trying to make a direct connection. There is no direct connection in terms of Asian type. Punchcutting is actually a very old process and was used by the Europeans for coinage, medallions, etc. It is likely that the written word had more social restrictions to the point that no one could think outside of the box. Which, wasn't such a cool thing in those days anyway.</p>
      <p>However. The Europeans had seen Asian currency and the Europeans had been printing for nearly a century prior to Gutenberg; but not with metal type. </p>
      <p>But the impetus for the development of mechanical writing was with the Church. It not only promoted the idea to eliminate the problem of corruption of text (copying error after error, and introducing error) but was also willing to finance. The prize was there for the taking. All one had to do was figure it all out.</p>
      <p>The Printing Museum of Tokyo has a few catalogs out that provide a great deal of information about Asian type with many wonderful illustrations of the sand moulds.</p>
      <p>Gerald<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
