      <p>While there is always the possibility that a Korean book, or word of the Korean invention, came through Mainz in years prior to Gutenberg's invention, it seems less likely by the fact that there wasn't an outbreak of printing presses being made in Europe.</p>
      <p>Gutenberg was a goldsmith, and he became very familiar with the trade and like many of his time he used a punch hallmark to imprint his 'signature' onto metal creations.  From there, it isn't a far leap to understand how he figured out the idea of a type machine based on the hallmark punch.  Especially since the punch and the type he made were relatively similar in construction.  So his understanding of metals and a tool he used most likely spurred him onto a fantastic idea.</p>
      <p>Other aspects of European life in the earlier century also led to the probability or feasibility of the printing press invention.  Since the black plague left so much money in the hands of the remaining citizens, better clothing was acquired which lead to more stray linen that could be used for making paper.  Paper was cheap and plentiful.  Also, the black death killed off many of the scholars and scribes so it opened a need for printing to convey information without needing to pay ridiculous amounts to someone who knew how to write and do it well.</p>
      <p>It isn't uncommon for inventions to simultaneously be spawned, or discovered in two unrelated areas or times.  Asian wood block printing never advanced much due to the nature of wood and wear, and the amount of characters in Chinese (and Japanese) language.  But, korea would have been perfect since they had a more limited alphabet (I'm assuming their text was fairly similar in 1200 ad to now).  However, Korea wasn't quite as central in trade and information as Europe was so it is an easy place to lose development of a valuable invention.</p>
