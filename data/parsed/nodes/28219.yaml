      <p>Tom</p>
      <p>For your interest the first known term was the Latin formae. The oft quoted passage below is the earliest description of the process. Patronae would be the mechanism of production. What is most surprising about this is not the mention of the process but the revealed knowledge of historical writing implements.</p>
      <p>Gerald</p>
      <p>By the assistance of the Most High, at whose bidding the tongues of children become eloquent, and who often reveals to the lowly what He conceals from the wise, this noble book, Catholicon, in the year<br>
      of our Lord's incarnation, 1460, in the mother city of Mainz (which belongs to the illustrious German nation, and which God has deigned to prefer and to raise with such an exalted light of the mind and<br>
      of free grace above the other nations of the earth), was perfected, not by means of quill, reed, or stylus, but by the admirable concord, proportion, and measure of patronae and formae . . .</p>
      <p>Colophon from the Catholicon of Johann Balbus of Genoa.</p>
