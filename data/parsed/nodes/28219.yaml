      <p>Some points</p>
      <p>The question of whether Gutenberg was first is not of great importance to me because I'm working on the cultural level, not the individual level. I take Gutenberg on the Western side to be similar to Cai Lun on the East Asian side -- We know that Cai Lun did not really invent paper, but he represents the invention of paper. I hope that someone else might want to follow through at the individual level, but this is beyond what I can do. (Albert Kapr tries to do something at the individual level, as Gerald noted above.)</p>
      <p>Because of the enormous amount of printing that occured in the second half of the fifteenth century I think it is fair to call it a revolutionary development. Once the spark of that revolution was lit the Europeans developed it into a formidable industry. When I refer to the Koreans' "perfection" of metal printing I of course mean that they made it meet their needs and produced a high-quality result. I'm not trying to judge their work by the standards of a foreign culture with different goals and values (I began my account by describing some of those differences). I'm quite happy to acknowledge the tremendous European achievement. I'm showing connections between cultures, not judging the achievements of one against the achievements of another.</p>
      <p>And a question</p>
      <p>What term (if any) would you folks prefer to "movable-type printing"? It seems a little misleading to me, but I've used it just because it seems to be the most common in the writing on this subject. (In places I've used the term "cast-type printing.")</p>
