      <p>Tom</p>
      <p>Cast-type printing could work. There was no viable industrial alternative to letterpress until about the mid-twentieth century thus the process was never referred to in this manner since there was no need. Note that type was actually never called by that name until 1701. Moxon simply referred to type as letters, which is probably what they were called for over two hundred years. Cast printing letters would probably make more sense in regard to the Korean work.</p>
      <p>Gerald</p>
