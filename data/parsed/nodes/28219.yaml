      <p>Gerald</p>
      <p>Well, one more comment. When you write <em>There are certainly Asian influences that “could” be discerned (and they are accurate as far as I know) but I don’t see any viable connection with Korea or Japan there and I would think these would be crucial to your thesis. (?)</em> you are actually quite close to my position. All I am really able to show is that such influences "could" have occurred. I feel that the statement that started me on this, "The invention of moveable type in China is an interesting historical fact, but of no direct significance for westerners" is a bit too emphatic and dismissive of the Asian tradition, and I was trying to demonstrate the possibility of transmission. I have no proof that it occurred in any direct way.</p>
      <p>The connection with Korea is that both China and Korea were part of the Mongol empire, and there was a great deal of cultural exchange between China and Korea -- I feel confident I demonstrated that. There were Europeans in Beijing at the time, and it would be surprising if they did not hear anything of Korean printing. I didn't mention it in the article (maybe I should) but China actually commissioned printing of Buddhist texts from Korea, where they had been better preserved because of Korea's intensive print tradition.</p>
      <p>As for Japan, I don't know much about its print tradition and consider it a little tangential to my present argument, which is intended to show that we cannot simply assert as a fact that no word whatsoever of movable metal type printing reached Europe.</p>
