      <p>Tom</p>
      <p>I'm not sure if you have already examined this but the most recent in-depth examination of Gutenberg is Albert Kapr's Johann Gutenberg: The Man and his Invention, Scholar Press, 1996. In his chapter Printing Parallels he has a section Did printing in Asia influence Gutenberg's invention. He examines the transmission lines or again the possibility of transmission. Much similar to your account. But he does end with a very important clue. Nicholas of Cues, the very same Papal authority who advocated for the development of a form of mechanical writing and is thought to have been involved with the planning of B42. Cues had gone to Constantinople in regard to the Council of Ferrara and Kapr suggests that his interaction there with folks who may have had knowledge of Asian developments could have resulted in his advocacy. He notes that this would not have had an effect on Gutenberg's experiments at the time but it may have provided the way and means for their realization. </p>
      <p>On the other hand, had this not actually happened, Gutenberg's work could have gone down the same dead end road as the Korean's.</p>
      <p>Not all scholars will agree with Kapr and not quite what you are looking for but if you have not already read the book you might very well want to.</p>
      <p>Gerald</p>
