      <p>Tom</p>
      <p>I think the information you portray about the exchange East and West, or at least the possiblility of it, or the potential for it, is quite good. But the information about the development of Western printing is a bit weak and it might be because you, as stated, regard Gutenberg as a symbol rather than an individual.</p>
      <p>A while back the artist Jeffrey Atherton and I decided to do a book project on Gutenberg. The idea at first was to do a three-act play based on the myth. So we started to do the research. I had actually amassed whatever I could on Gutenberg in terms of printed material for something like twenty years and we started there. We eventually interviewed and corresponded with scholars who specialized in the formative years of Western printing. </p>
      <p>There is an awful lot of wrong information that contributes to the myth. And the more we got into it the more the myth slowly faded away and, so did Gutenberg. At the higher levels of research, he hardly exists. There is very little known about Gutenberg except for information culled from legal documents, most of which surfaced in the mid-nineteenth century. There is, for instance, no evidence that Gutenberg was a goldsmith. There is documentation that he was associated with the mint but not a member. This would not be abnormal considering his social position. To a large extent the investigation here needs to get beyond the acceptance of the symbol and that is where the needed discoveries may be found.</p>
      <p>Your statement about copper plate engraving is of interest as I think that Gutenberg has been short-changed by the emphasis on his involvement with the work on B42, whereas his various activities prior to that project offer more clues in regard to the formative aspects that led to the "perfection" of mechanical writing. Typography does not begin with Gutenberg, it begins with Shoeffer. Gutenberg needs to be examined not as a printer but as a very inventive mechanic (in the sense of what that term meant in the time period).</p>
      <p>Gerald</p>
