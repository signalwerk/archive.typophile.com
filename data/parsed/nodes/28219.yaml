      <p>Max</p>
      <p>I'm less interested in Gutenberg the individual than Gutenberg as a symbol of a development in Western printing. I did mention his background as a goldsmith, and Helmutt Lehmann-Haupt has suggested that he invented not just the printing press, in the form he used it, but also the technique of copper engraving. He printed copper plates for playing cards -- which incidentally developed in Asia and spread from there to the West.</p>
      <p>Hangul, the Korean script you are thinking of, was created in the mid fifteenth century during the Joseon dynasty -- too late for the present argument.</p>
      <p>Asian woodblock printing was highly developed and well suited to Asian cultural needs. For one thing, it enabled combining illustrations with type, which is something the Europeans struggled with. Also, East Asians were not especially concerned with printing large numbers of copies. Chinese block hardwoods like beech and jujube were actually quite durable. I think you probably mean printing with movable wood type when you say "Asian wood block printing never advanced much." However we do know of wood type that was still being used to print books more than 200 years after it was cut (Pi Sheng's type, from around the end of the first millennium, was still being used under Khubilai Kan, who reigned at the end of the thirteenth century).</p>
