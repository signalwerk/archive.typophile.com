      <p>David</p>
      <p>Yes, those unknown craftspeople would not have known about Kang, but they would also not have known about Gutenberg. He never made a printed claim to have perfected mechanical writing, nor identified himself in any printed material thought now to have been produced by him. Nor was he claimed in any of the literature as the inventor of printing with movable type for quite some long time. The fairly well known colophon describing the circumstances of the invention of printing, in a book printed in 1515 by Johann Shoeffer, grandson of Fust, makes no mention of Gutenberg.</p>
      <p>Gerald</p>
