      <p>This is a fine essay, Tom. It pretty much cements the idea that easern "printing" was well known to 13th and 14th century Europeans.</p>
      <p>You start with...<br>
      "Johannes Gutenberg’s development...helped to spark the European Renaissance.1 Although ...[this] honor is sometimes claimed for a handful of other printers. This dispute has little bearing on the present argument."</p>
      <p>But in fact it does. The issue is first, how western printing developed from Gutenberg to an industry, via "revolution", if you want, (though I don't). Then you see why, "in Korea, where printing with movable metal type was perfected", is not really true, is it? unless it comes down to terms, granularity, and each of our "understandings". </p>
      <p>I think we all agree what "printing" is... But moveable type is several things. Printing a whole plate of Kanji is printing and at one point the type was perhaps moveable at the granularity of word, idea or linokanji. But the invention that changed the west was a sure and swift process from striking the punch to the finished letter in the hands of "a nobody", and then, the development of this into a profitable and unfettered industrial process, not by revolution, but rather by careful interplay between clients, readers and what was then the baby font industry.</p>
      <p>This part of your essay, "Lastly, one scrapes and files off the irregularities, and piles them up to be arranged." is at a heart of my "point". This point of the process, when each letter is being improved ex post matrix, is something JG shared with your Koreans, and in my opinion separates the process of moveable type from that of "makeable" type. Regardless of what JG might or might not have seen, if he saw printed materials from China, Mongolia or Korea, how would he have known if the type that produced it was movable? And even if said printed material was joined by a translatable expert from the east, JG did not get it, or he either could not afford or find the right materials, relative to the later craftspeople who did in fact, and "perfected" the process. And these unknown craftspeople most certainly knew more about JG than about Kang.</p>
      <p>Cheers!</p>
