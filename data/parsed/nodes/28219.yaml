      <p>Gerald, I'm sure I understand all of the points you've made, yet...The paiza?</p>
      <p>". The problem really is a transfer of thinking about the way coins and medallions were produced to that of making the same process work as writing."</p>
      <p>I don't thing so. The problem is solving "who cast first" without post processing the results. The reason I say this, is because the solution to this problem, I believe, lies in combinations of combinations of metal, and very skilled typeface design. Coins e.g. usually one or two metals, should not be post-processed, (in a strictly controlled mint), because of the relationship between the value and the form. Medallions are closer to their Sumerian or Minoan forebearers and thousands of years of similar artifacts, than to moveable Latin type primarily because medallions don't need to do much other than to "hang around", maybe diving into wax once in a while, or being rolled around on paper, but we are not talking about a part of a mechanism there.</p>
      <p>"a European examining an Eastern artifact and not[ing] that each [..] glyph was identical, in the right mind set [..] could trigger a realization that [...] mechanical “setting” was at play"</p>
      <p>Sure, but it could equally trigger a craving for Chinese food;) Glyph fidelity is hardly a characteristic of moveable type is it? An artifact could have been made as a whole plate, with templates used to start each repeating glyph, (as unlikely in Kangi) as that my be) ,with no moveable type to speak of at all...</p>
