      <p>Tom, I'm glad to see that my comments have sparked such a well-researched response. I'm preparing to leave for Europe shortly, to attend the ATypI conference in Lisbon, so do not have time now to read through all your essay, but I am impressed by what I see so far.</p>
      <p>The very widespread trade and movement of people during the Middle Ages is something that interests me very much, and for which I have healthy respect. I studied mediaeval history at university, and have always been impressed by how widely people travelled considering the difficulties of such journeys.</p>
      <p>There are a few things that should be kept in mind though (perhaps you consider these in the parts of your essay that I have not read yet). European trade with Asia was conducted through a series of intermediaries. Goods travelling from China passed through several marketplaces before they arrived in Europe, and there is frequent evidence that Europeans didn't always know where goods had originated. This observation isn't limited to the Middle Ages, of course, it is true even today. This isn't to suggest that material Asian influence in the development of moveable type in Europe wasn't possible, but that such material influence was most likely to be diffuse. That is, it is unlikely that any direct model influenced the European development, but a long, gradual trade would have contributed to technologies that made the development realisable. Of course, one also shouldn't assume that the trade was in one direction only. And European metallurgy had many centuries of development prior to the idea of casting letters in metal. So one also has to ask at what stage are technologies considered 'naturalised' and their further development not attributable to possible earlier influences.</p>
      <p>The other question that occurs to me is 'Why Mainz?' If a material Asian influence was significant, I can think of lots of places in Europe where the development of moveable type would have been more likely to occur.</p>
      <p>Regarding the burden of proof, I don't think 'circumstantial evidence of probable influence' is sufficient to shift the burden on to those who think that the Asian and European developments were unconnected. In any case, it is impossible to prove an absence. Applying Occam's razor, one can ask whether such an influence was in any way necessary to the European development, or were all the pieces -- the material, the metallurgical and punchcutting skills, etc. -- necessary for the invention of moveable type present in a sufficiently developed state in Europe?</p>
