    date: 2006-09-17T12:23:00
    votes: null
    html: <p>The concept of movable type ex post matrix may confuse the discovery process. If a European was examining an Eastern artifact and noted that each instance of a glyph was identical, in the right mind set that could trigger a realization that some form of mechanical "setting" was at play. When I examined the paiza in photo editing software, and transposed image over image, it seemed to me that certain instances of glyphs were identical. The resolution of the original image is so poor it is hard to say for sure. The problem really is a transfer of thinking about the way coins and medallions were produced to that of making the same process work as writing. I suspect cultural traditions in regard to writing prevented the connection. Punches are thought to have been used in some manner (for casting) for quite some long time. The Koreans were the first to resolve this. Add evidence of paper printed from mechanical forms to that of evidence of identical glyphs in cast artifacts and someone could have made the connection. The fact that printing in the West progressed from its source is simply the reason a possible connection was lost. It is clear from artifacts that survive, moulds, type, that Korean type was movable not just makeable.</p>
