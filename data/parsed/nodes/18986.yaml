      <p>Wow! Those are some really nice suggestions everyone! Thanks guys! =) </p>
      <p>I really like Chase, Grot Wood, and Vendetta cause they got a really nice design or texture to it.   </p>
      <p>Are there any fonts that look like they've been chewed i.e. bitten off maybe?? I was thinking more of a funny theme generated from the typeface. </p>
      <p>Nonetheless, I very much appreciate your opinions and recommendations! Keep the comments rolling! =) </p>
      <p>Vincent.</p>
