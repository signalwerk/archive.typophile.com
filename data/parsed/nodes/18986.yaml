    <p>Hi everyone! I have an upcoming project about creating a brand identity for a hardware store. My concept is based on a beaver and wood textures, but I’m having a lot of trouble finding a typeface to fit this design. </p>
    <p>Can anyone suggest for me a typeface that is suitable for the logo? I was thinking a font that’s chipped or textured that reflects this nature. </p>
    <p>If anyone can suggest another typeface or one that would fit better, that’ll be great too! </p>
    <p>Thanks. </p>
    <p>Vincent.</p>
