      <p>Hmm, it seems the reason the Serif Guide didn't find this is that the E (and F) in the small caps version has no serif on the middle arm, but the regular font's E and F do have the serif. I didn't realize that KUONI EXCLUSIVE was the SC typeface. I am updating the Guide to include that attribute in the description.</p>
      <p>- Mike Yanega</p>
