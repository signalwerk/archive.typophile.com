      <p>According to this <a class="freelinking external" href="http://www.culture-besancon.fr/sites/default/files/SONORAMADossierDePresse.pdf" rel="nofollow">PDF</a>, the font is called "sonorama", most probably a bespoke typeface exclusively done for this occasion (by <a class="freelinking external" href="http://www.helmo.fr/ongoing/sonorama" rel="nofollow">Helmo</a>?), some sort of DIN Rounded (Mono).<br>
