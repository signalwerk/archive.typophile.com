      <p>Stephanie,</p>
      <p>I would recommend that you consult with either the printing company or color house (separator) that you most do business with (and trust, of course).</p>
      <p>You might as well set up a companion balanced color viewing station to match your favorite vendor. That way you see what they see. It also makes it possible to do remote color correction conferences as well.</p>
      <p>—————————————————————————-<br>
      Yes, I’m old, but I’m back in style!</p>
