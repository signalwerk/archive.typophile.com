    <p><strong>Type Battle 25 - 2008 Typophile Tee Design</strong></p>
    <p><strong>// UPDATE</strong> We've <a href="http://typophile.com/node/47160" rel="nofollow">announced the winner</a>. Stay alert for pre-ordering information.</p>
    <p><strong>// DESIGN THE 2008 TYPOPHILE TEE</strong></p>
    <p>Design it any way you want. Literal, figurative, custom-lettering, &amp;c. There are no requirements to use the word Typophile or any given logo. (Just follow the terms outlined below.)</p>
    <p>Below are the past few years' tees for reference.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/typ_past_tees_Picture-15_5663.jpg"></div><p></p>
    <p><strong>// HOW TO SUBMIT AN ENTRY</strong></p>
    <p>1 Download the <strong><a href="/content/downloads/Battle25_Tee-Template.zip" rel="nofollow">2008 Tee Template</a></strong><br>
    2 Design your tee. Include your suggested shirt color from the <a href="http://www.americanapparel.net" rel="nofollow">American Apparel</a> website<br>
    3 Turn all your fonts to outlines. (We don't own every font!)<br>
    4 Convert to vector EPS and name your file thusly: Battle25_FirstName_LastName.eps<br>
    5 Compress the Illustrator EPS file (Zip, Stuffit, etc.)<br>
    6 Email the file to typophile [at] punchcut.com on or before Monday, June 30th 2008<br>
    7 You’re not done! You must post a GIF to this thread.</p>
    <p><strong>// CONTEST TERMS</strong></p>
    <p><strong>Judging</strong> // <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> will judge the entries, keeping in mind the popularity of the entries in the thread. We'll determine which design(s) get printed and the quantity of the print run. </p>
    <p><strong>Copyright Retention</strong> // Participants (those who submit entries to Typophile) grant Typophile permission to use the artwork/design for promotional use, including a t-shirt, as we see fit, for applications not limited to apparel. Any mentions of products or promotional items will be accompanied by proper credit to the designer (in online product listings, etc). Participants retain copyrights and Typophile agrees not to sell or transfer our usage rights. (In other words, we don’t require exclusive rights, just unlimited usage.) </p>
    <p><strong>Prizes</strong> // This is a battle. There are no prizes (unless some benefactor makes something available for us to give away). We will mail the winner 3 tees in your choice of sizes.* Your finished designs will be appropriately credited with your name or your firm’s name as you specify. By participating you pledge that your work is of your own design and further, that fonts or other rights-protected imagery used in your design are licensed for such use by you or the organization you represent.</p>
    <p><strong>*UPDATE! In addition to receiving three t-shirts, the winner will also receive their choice of the most complete digital type reference in the world, <a href="http://www.fontshop.com/products/fontbook/" rel="nofollow">FontBook</a> from <a href="http://www.fontshop.com" rel="nofollow">FontShop International</a> or <a href="http://www.fontshop.com/products/books/made_with_fontfont/" rel="nofollow">Made with FontFont</a>, a beautiful showcase of the history and influence of award winning foundry <a href="http://fontfont.com/" rel="nofollow">FontFont.</a></strong></p>
    <p>Thanks so much to FontShop for this generous offer.</p>
    <p><a href="http://www.fontshop.com" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontshop.com" rel="nofollow"><img src="http://typophile.com/files/tee_FS_4870.jpg"></a></div><p></p>
    <p>**UPDATE! OK, so we aren't done there. <a href="http://www.threadless.com/" rel="nofollow">Threadless</a> has been keeping their eye on this battle, they like what they see and have offered to give our winner a $100 gift certificate to their shop! What a deal - our winner is going to be the happiest little typographer, and the hippest.</p>
    <p>A big THANK YOU to <a href="http://www.threadless.com/" rel="nofollow">Threadless</a> for their generosity.</p>
    <p><a></a></p><div class="imageWrap"><a><img src="http://typophile.com/files/threadless_logo_5030.png"></a></div><p></p>
