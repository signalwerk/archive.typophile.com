      <p>Thanks for your input! :)</p>
      <p>Your first block: well, this was never a problem - it worked with a simple "sub l l' by l.calt;". They way you suggest it it looks like only three-letter repeats will be changed, and not double-letters...? I haven't tried it out, though - as I already had a working solution.</p>
      <p>Your second block: will not the first sub change every single-letter occurrence of the letter to the alternate form, too? Wouldn't want that...</p>
      <p>After some experimentation I have almost sussed it - using lookups! :)<br>
      This is very close to working:</p>
      <p>lookup calt1 {<br>
         sub g' g by g.calt;<br>
      } calt1 ;<br>
      lookup calt2 {<br>
         sub g.calt g.calt' by g;<br>
      } calt2 ;</p>
      <p>Only caveat is that with odd repeats of letters the last two in the sequence will be the colliding main forms. Hmm... My head hurts from trying to find a perfect solution to this... ;)</p>
