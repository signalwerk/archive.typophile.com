      <p>That's right.<br>
      You need to have alternates of every character, including punctuation and space, for the pseudo-random effect.<br>
      I've done it in a couple of typefaces.<br>
      In Duffy Script, I made three alternates of every character, but for Fontesque Pro, only one alternate, because it's very rare that you get three of the same character in a row, in any language. (That's the subject of another thread!)</p>
