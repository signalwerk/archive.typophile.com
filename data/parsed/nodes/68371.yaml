      <p>The basic letters have looped ascenders/descenders. When there are two consecutive loops (overlapping) I want to switch one letter to a straight form "piercing" the (other) loop. So for the ascenders the loop goes to the right, and the right letter has to switch. Easy. But the descenders are looped to the left, so the left letter has to switch. Which looks to be difficult to program for alternate substitution for multiple loops. Bummer.<br>
      I think I have to compromise a bit... Perhaps it is possible to program it (for odd numbers of loops) so that I get the sequence "g.calt g g.calt g ... g.calt g g.calt g.calt g"? So ending the sequence with two consecutive straighs and one final loop? Can that be done?</p>
