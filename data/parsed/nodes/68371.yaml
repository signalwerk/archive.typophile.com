    html: |-
      <p>By the way, there is also the command "reversesub", but I think FontLab cannot compile it. The actual AFDKO can and with the help of batch files it easy to handle. And you can use both, the AFDKO and FontLab. The GPOS and the GSUB table of a font can be extracted with TTX and merged into the OTF, that was generated with FontLab. You even can avoid, that TTX changes anything, if you temporarily remove the following files from the FontTools directory (in your Python directory):</p>
      <p>C:\Python26\Lib\site-packages\FontTools\fontTools\ttLib\tables\G_P_O_S_.py<br>
      C:\Python26\Lib\site-packages\FontTools\fontTools\ttLib\tables\G_S_U_B_.py</p>
      <p>and</p>
      <p>C:\Python26\Lib\site-packages\FontTools\fontTools\ttLib\tables\G_P_O_S_.pyc<br>
      C:\Python26\Lib\site-packages\FontTools\fontTools\ttLib\tables\G_S_U_B_.pyc</p>
      <p>Then TTX extracts the tables as hexdata! (TTX is unable to dump the FeatureParams-Tags correctly [TTX empties them], if they are present in the GSUB table.)</p>
      <p>The AFDKO and TTX are really cool! And for free.</p>
