      <p>I think I got it! :D</p>
      <p>This routine will make up to 8 letters in sequence alternate - and always ending with the base letter:</p>
      <p>feature calt {<br>
      sub g' g by g.calt;<br>
      lookup CALT_1 {<br>
      sub g.calt' g.calt g by g;<br>
      sub g.calt' g.calt g.calt g.calt g by g;<br>
      sub g.calt' g.calt g.calt g.calt g.calt g.calt g by g;<br>
      } CALT_1;<br>
      } calt;</p>
      <p>Thanks for the valuable input, Arno! I would never had sussed this in a million years on my own...</p>
