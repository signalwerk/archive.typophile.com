      <p>Okay, here is the dirty solution. (Personally I hate those solutions.) You can extend it. Actually it is enough to cover a string with a maximum of 32 letters, that have an alternate. If the string is broken by a letter, that does not have an alternate, the feature applies to both parts of the string and both parts can consist of a maximum of 32 letters. (For those ones, that have not read the whole thread: g and g.calt need to be replaced by classes.)</p>
      <p>feature calt {<br>
      ignore sub g' g;<br>
      sub g' by g.calt;<br>
      lookup CALT_1 {<br>
      sub g' g g.calt by g.calt;<br>
      sub g' g g g g.calt by g.calt;<br>
      sub g' g g g g g g.calt by g.calt;<br>
      sub g' g g g g g g g g.calt by g.calt;<br>
      sub g' g g g g g g g g g g.calt by g.calt;<br>
      } CALT_1;<br>
      lookup CALT_2 {<br>
      sub g' g g.calt by g.calt;<br>
      sub g' g g g g.calt by g.calt;<br>
      sub g' g g g g g g.calt by g.calt;<br>
      sub g' g g g g g g g g.calt by g.calt;<br>
      sub g' g g g g g g g g g g.calt by g.calt;<br>
      } CALT_2;<br>
      lookup CALT_3 {<br>
      sub g' g g.calt by g.calt;<br>
      sub g' g g g g.calt by g.calt;<br>
      sub g' g g g g g g.calt by g.calt;<br>
      sub g' g g g g g g g g.calt by g.calt;<br>
      sub g' g g g g g g g g g g.calt by g.calt;<br>
      } CALT_3;<br>
      } calt;</p>
