      <p>&gt; so you mean I just need one document?</p>
      <p>Yes. InDesign can make a PDF from any print document. When I have a document that needs both a print and a PDF version, I almost always make just ONE document.</p>
      <p>The only exceptions would be if there's some special reason why a PDF of the print version might not work well. Some examples might be if the print document uses special effects that won't be visible in a PDF (like embossing or die cuts), or if your boss wants users to view the PDF online (on their browsers) but the file size is so huge that it would take forever to load. In those special cases, a separate PDF version might be helpful as you can design it to avoid those problems. </p>
      <p>But generally speaking, I'd make ONE document for printing and then just make a PDF from it. It'll save a lot of time and effort, especially if you're fairly new to InDesign.</p>
      <p>&gt; Why do I have to choose the format</p>
      <p>The print/web choice when setting up a document just sets a few things like RGB vs CMYK, the ruler settings, etc. These are all things you can change later if you need to, but it saves time to set those things correctly right from the start.  If the document is going to be printed, I'd use the "print" setting. When it comes time to make a PDF, it's no problem, InDesign can make a PDF from any print document.</p>
      <p>&gt; combined in a book</p>
      <p>Regarding the "book" feature, I can't offer advice as that's a feature I don't use (I work mostly on shorter documents).</p>
      <p>&gt; I think with forums a lot of video tutorial</p>
      <p>That's a good idea. If you don't mind spending a few bucks, the subscription site Lynda.com has several online video courses on InDesign (some designed specifically for beginners) that are excellent.</p>
