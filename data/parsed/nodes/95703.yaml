      <p>First of all, this is a typography and type design forum. Your question is off topic. No biggy to me but you might et better replies elsewhere.</p>
      <p>However, (re. question #1) if you are a graphic designer, then from your point of view there should be no question. In a contest between MS Publisher and Indesign, it would be Indesign all the way. Not necessarily because it is the more appropriate tool for the job - or not, but because as a designer it is a good fit for the skill set that goes with the job.</p>
      <p>It sounds like you might be an in-house designer and some other "non-designer" folks you work with, who work with typical "office-job" tools are going to be involved in creating and maintaining the document. Then Publisher makes sense. Especially if you don't want to get stuck with the job. Speaking from some personal experience I'm glad to be clear of, many thanks to transitioning the doc in question to an MS product that others in my dept can work with. The end product is less elegant IMO, but it is a utilitarian thing for consultants and contractors and I may be to only person who cares.</p>
