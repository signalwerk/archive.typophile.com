    <p>Hi,<br>
    I am working for a company and have to design a few procut data sheets, broshures and finally a whole product catalouge.<br>
    I really would like to take Indesign because it is very famous and "the standard" for these topics.<br>
    But it is really expensive. I have some experience with the program. But I have some questions to you. Thank you a lot for answering my questions:</p>
    <p>1.) other members of my company would like to use Microsoft Publisher (they all usw Microsoft so that's no disadvantage)<br>
    Are there any advantages that M Publisher is not able to do?<br>
    I don't need any 3D or very special stuff. Just for my topics above.</p>
    <p>2.) I want to create single sheets. These sheets should be able to combine in a whole document.<br>
    Is this possible with these "books"?<br>
    Is it possible to easy create a table of content? automatically? an index that is changing if number of pages or size of documents change?<br>
    Is it possible to link inside the pdf document that users can jump from table of content to a specific chapter by clicking?</p>
    <p>3.) How should the structure have been done?<br>
    Do I need 2 versions for each file? One for printing and one for pdf viewing on computers?? Or is it possible just to create one?<br>
    Also with different languages. Is it recommend to use the laysers for this thing?<br>
    Or not (because of the idea of creating an easy catalouge.) I need 2 versions. So does it make sense to combine it in one single file?<br>
    The catalouge has to be switched otherwise in every single paper. isn't it?</p>
    <p>Are there any other tips and comments?<br>
    Maybe I use a differnt approach or designing idea?<br>
    thanks a lot for helping me!</p>
