    html: |-
      <p>&gt; combined in a book</p>
      <p>For regular documents, there are no pressing reasons to use the Book feature.</p>
      <p>First off, it means a lot of additional (uh..) book-keeping. InDesign <em>can</em> synchronise most important stuff along all of a Book's documents, but it doesn't help you <em>fixing</em> things automatically. If you decide to use another font in your styles in one document, then synchronise this one with the others, you still need to check all of your documents, all pages.</p>
      <p>Second: if you have rather large sections of pages (say, individual chapters, or self-containing articles) and you want to be able to move them around at a whim, make a Book. If the order of text is predetermined, no need for this.</p>
      <p>Third: in my work, I need a single PDF of a document, <em>plus</em> one separate PDF of each chapter. (And the inclusion and appearance of individual chapters are, at times, changed at a whim by its editors...) Rather than setting up some system to move pages around and somehow generate a PDF per so many pages, I make my books a Book.</p>
      <p>"Single sheets", is that to mean "pages"? ("Sheet", along with a bed cover, might mean something else in book printing. "Page" is pretty unambiguous.) You can drag individual pages around at will inside a single document. The same can be done, naturally, with individual documents inside a book, but somehow it feels more natural to keep this inside a single document.</p>
      <p>InDesign can generate both Indices and Tables of Contents, but not "unattended"; to set these up correctly you <em>do</em> need a pretty good understanding of the entire program. Besides, once generated, any page numbers will <em>not</em> magically update. After each change that may have affected pagination, you need to generate both a-new.</p>
      <p>InDesign is <em>not</em> a user-friendly program. It's not targeted at beginners. It uses terms unfamiliar to laymen (pica, bleed, slug, point size, ligature, process color, overprint, resolution; just to name a random 10). It assumes lots of previous knowledge of design, and more than passing knowledge of the printing process.</p>
      <p>Not tryin' to scare you off or anything. Jus' lettin' you know.</p>
