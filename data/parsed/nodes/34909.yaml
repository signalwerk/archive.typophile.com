      <p>Most probably custom designed. From the <a href="http://typophile.com/forum/typeid/faq" rel="nofollow">FAQ</a>:</p>
      <p><a name="Q_16" rel="nofollow"><strong>And logos of sports teams?</strong></a><br>
      There you have to keep in mind that sports merchandising -- everything from baseball caps to soccer jerseys -- is big business, so the popular sports teams have every reason to make their logo as difficult to imitate as possible. Most of them are custom designed or use heavily customized existing fonts.</p>
