    html: <p>Perhaps Apple will be dropping Lucida and going 100% Myriad in future products - it would makes sense to tie branding font and UI font in this way. Additional evidence in the Wiki... <br> <br><a href="http://en.wikipedia.org/wiki/Apple_typography#Apple_Myriad" target="_blank">http://en.wikipedia.org/wiki/Apple_typography#Apple_Myriad</a>  <br> <br>"Apple changed the name of their licensed version of the typeface when they had the format of the fonts converted to TrueType for their internal use."  <br> <br>Why convert to TrueType if you're only using the fonts in print and Photoshop'd graphics? <br> <br>Si</p>
