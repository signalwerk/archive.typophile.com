      <p>&gt;How many attend typographic events like Typo Berlin, TDC events, TypeCon, etc. as compared to ATyPI?</p>
      <p>I think it goes about like this, but they can correct me if I'm wrong: Typo Berlin 5,327, TDC events 96-564, TypeCon 647, ATyPI 538, SPECTORem 12.</p>
      <p>&gt;...for the longest time ATypI headquarters was in West New York, New Jersey</p>
      <p>The longest time? I'm having trouble parsing. </p>
      <p>Also consider that some conferences are produced and directed by organization members and are just a part of their organization's activities. While a separate huge block of conferences, from &amp; to SXSW, are conference-based entities with annual, or semi-annual rites and not another thing to do, because the conference (and/or their real jobs), is enough.</p>
      <p>The distance between any of these and old-ATypI is incomprehensible to anyone who didn't attend in those days. No guests not a spouse or child, No presentations except the state of the association, Two buses for outings, one for the men and one for the rest, and almost no discussion of what anyone was going to do, how, or what they had done, or why, typographically or technically over the past year or the next. </p>
      <p>The "workshop" conference at Stanford started changing the latter. Type90 the blew lid off it, and TypeLab kept anyone from putting the lid back on, for longest time.</p>
