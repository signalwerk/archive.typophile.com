    <p>Registration for this year's ATypI is conference in open! <a href="http://www.atypi.org/store" title="http://www.atypi.org/store">http://www.atypi.org/store</a></p>
    <p>This year's ATypI conference will take place in Reykjavík, Iceland, from 14 to 18 September 2011 (Wednesday to Sunday) at the new Harpa Concert Hall, situated by the old harbour in the city centre.</p>
    <p>Day 1  Wednesday, September 14<br>
    Registration includes your choice of individually priced half-day Workshop sessions, refreshment breaks, lunch, as well as a Conference T-shirt.</p>
    <p>Day 2  Thursday, September 15<br>
    Registration includes your choice of 2 tracks of sessions, refreshment breaks, lunch, as well as a Conference T-shirt.</p>
    <p>Days 3-5  Friday-Sunday, September 16-18<br>
    Conference registration includes three days of Conference sessions, refreshment breaks and lunches, opening reception the evening before, an evening party and entry to the exhibition area as well as a Conference T-shirt.</p>
    <p>ATypI (Association Typographique Internationale) is the premier worldwide organisation dedicated to type and typography. Founded in 1957, ATypI provides a structure for communication, information and action amongst the international type community.</p>
