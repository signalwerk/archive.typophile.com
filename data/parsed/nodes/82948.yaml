      <p>"How many attend typographic events like Typo Berlin, TDC events, TypeCon, etc. as compared to ATyPI?"</p>
      <p>Typo Berlin runs several thousand people. It is far and away the largest.</p>
      <p>TypeCon has varied quite a bit over the years. It started out very small (under a hundred), gradually ramped up until it was running at 400-550 (maybe San Francisco was the high water mark?), and then has declined a bit in recent years to be more like 200-350. I'm imagining that timing it right after the 4th of July in hotter climates allows for an inexpensive venue, but those same two factors may have also hurt attendance.</p>
      <p>ATypI has mostly run pretty consistently around 300-350 for the last six years or more, with very occasional upwards bumps for assorted reasons. I expect Reykjavik will run around 300, maybe a little less due to the economy combining with it not being as obvious a "destination" location as say Dublin was. But I think the lineup of talks is looking great!</p>
      <p>I can't speak to attendance at various kinds of TDC events.</p>
      <p>Regards,</p>
      <p>T</p>
