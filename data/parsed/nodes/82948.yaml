      <p>I could have sworn that I heard there were 3000 attendees at Typo Berlin when I spoke there in 2008? But perhaps I misremember. In any case, several times the size of the others, even if not a whole order of magnitude larger.</p>
      <p>I agree that Typo Berlin has a different focus, more on typography within current graphic design. It has none of the academic talks one sometimes sees at ATypI, no talks aimed at type designers and type foundries as audience members, and little of the other material one sees on designing type. But I figure maybe half the talks one sees at ATypI or TypeCon would be ones that would also be welcome at Typo Berlin?</p>
