      <p>Sorry to go off on a tangent here Eben, but when is ATypI going to get professional with its corporate communications—in particular copywriting?</p>
      <p>I've recently taken issue with the text for the Letter.2 competition, (and it was changed—thanks José).<br>
      And now this.</p>
      <p>What's the big deal with the T-shirt?<br>
      It's little details like this that grind. For instance, by replacing "a structure" from the ATYpI About page by "the structure" here, you go from understated fact to self-aggrandizing fibbing. Because Typophile, for instance, is also *a* structure for communication, information and action amongst the international type community.</p>
      <p>And what is the distinction in mentioning both "information…amongst" and "communication…amongst"? And what noun(s) does the preposition "amongst" qualify—structure, or the three "-ions" in the subordinate clause? Your writing is perfectly acceptable for a personal post to Typophile, but as corporate communication, I'm afraid it is too amateurish.</p>
