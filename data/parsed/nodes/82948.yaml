    html: <p>To give you some idea of the proper way to do things, I was asked a couple of years ago to moderate a panel discussion at the RGD's <em>Design Thinkers</em> conference. When I showed up for the gig, I was given a sheet of paper with my introductory text prepared, "Hello, my name is Nick Shinn…" which continued with a short bio of myself and the panelists, and an introduction to the topic. That shows the kind of control that an organization's information officer can exert. It's all about consistent branding, and words are just as much a part of that as typography and design.</p>
