    html: |-
      <p>On the one hand, I would say that neither recommendation should be binary Y/N because you can't anticipate all the factors (different browsers, different H&amp;J algorithms (or lack thereof), future-proofing, backwards compatibility, text size, etc.) that would influence the recommendation. On the other hand, I'd say that the recommendation has to be binary Y/N because you can't anticipate all the factors....</p>
      <p>Put it another way: the recommendation shouldn't have to be binary, but I don't see how you could make the recommendation more nuanced given that you can't know for certain what the reader will be seeing.</p>
