    html: |-
      <p>So, if a Yes can have conditions, then we'd want justification's Yes to be dependent on the ability to say Yes to hyphenation too. </p>
      <p>John, I'm thinking more along the lines of recommendations that are not dependent on 'all the factors' but focus more on the font's design factors alone, e.g. Monospaced fonts, seriously contextualized designs, or connecting scripts where all the Justification answers are stark. </p>
      <p>And then, I'm also thinking of dedicated headline fonts, where H &amp; J answers are also both fairly stark...</p>
      <p>Does that make more sense?</p>
      <p>Cheers!</p>
