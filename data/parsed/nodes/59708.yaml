    <p>I'm doing something, and I know there isn't much H&amp;J on the web, but I have a question(s).</p>
    <p>First, if a type designer were giving recommendations for Justification of a particular font, do you all think that recommendation should be a binary decision, (i.e. Y/N)?</p>
    <p>Second, if a type designer were giving recommendations for Hyphenation of a particular font, do you all think that recommendation should be a binary decision, (i.e. Y/N)?</p>
    <p>Thanks in advance for any input.</p>
    <p>Cheers!</p>
