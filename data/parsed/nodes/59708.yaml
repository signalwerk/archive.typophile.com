    html: <p>Justification without hyphenation on the Web tends to look pretty bad, so I would discourage it. As to the second question, I guess it depends on how the typeface stands fiddling with its spacing. But being that there’s no hyphenation on the Web – yet! – it’s another N for me.</p>
