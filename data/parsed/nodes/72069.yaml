    <p>Does anyone know if that font is on sale?</p>
    <p>You can find the logo here:<br><a href="http://www.controventogroup.com/immagini/martini.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.controventogroup.com/immagini/martini.jpg</a></p>
    <p>Best,<br>
    Khaa</p>
