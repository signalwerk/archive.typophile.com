      <p>Hi, thanks for all the advice!</p>
      <p>Is it possible to use non system fonts in Word and Powerpoint and retain portability between different platforms and versions? I know there is the embed font feature but as far as I know it dosnt work very well and there is always the problem of having the right font setup on everybodys machine if they want to create a document using it....</p>
      <p>Ive read one solution is to create pdfs of docs when sending to external people such as clients. Just wandering what everybody else does when they have to choose a font for clients to use?</p>
