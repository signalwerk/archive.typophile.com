    html: |-
      <p>&gt;That’s quite displayish, isn’t it?</p>
      <p>Well, it is used pretty regularly to print excerpts of movie scripts in books, or whole scripts. Actual scripts have to be in Courier, because then they are approximately one minute per page, which is convenient for  comparison and production. But produced for reading, American Typewriter, which is proportionally spaced, is more readable. </p>
      <p>&gt;portability between different platforms and versions?</p>
      <p>American Typewriter comes in an <a href="http://www.myfonts.com/PurchaseOptions?familyid=3479&amp;id[]=10035&amp;id[]=11096">Open type version</a>, so yes. </p>
      <p>Your work group would all need it on their machines for them to edit documents. Yes, PDFs work fine for distribution, but they won’t be editable, I believe.</p>
      <p>I know some programmers and some lawyers use Courier. And I don’t really know why lawyers want to use it. </p>
      <p>There are really better options for almost every purpose, though.</p>
