    <p>OK, this can't be that difficult...</p>
    <p>It looks like a simple san-serif, but for some reason, I am having a DICKENS of a time trying to ID it EXACTLY. So many fonts (like Avenir) come close...but I am looking for something with the same perfect roundness and symmetry in the O's and the lower e's. Even the counters within the p's and d's look like circles, and aren't off-center, elongated, or squashed. The descenders and ascenders aren't super tall, either.</p>
    <p>Can anyone help??</p><div class="imageWrap"><img src="http://typophile.com/files/SP_A0052_5024.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/SP_A0037_5191.jpg"></div><p></p>
