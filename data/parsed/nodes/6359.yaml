    html: "<p>chilla: <br> <br>If you are having trouble finding a script, you might try looking for an italic. Also, I don't think the N-stem of the flower works unless the flower is at an angle. It either has to be a different, angled flower with the N-stem or keep the R-swash, lose the N-swash, and keep the i-stem with the current flower. <br> <br>Below is a very rough illustration of the direction I was trying to explain (please ignore spacing, colors, and that heinous flower illustration). <br> <br><img src=\"http://www.typophile.com/forums/messages/29/50087.jpg\" alt=\"pincess flowers\"> <br> <br>RE: Color - A deep, dark, rich purple might go well with your pink flower. <br> <br>RE: Letterspacing - You have pretty nice spacing between the I-N-C-E, but the P-R-I, and E-S-S don't seem to be on the same page. Use the I-N-C-E as your reference and move the others. <br> <br>Aloha! <br>Scott</p>"
    html_clean: "<p>chilla: <br> <br>If you are having trouble finding a script, you might try looking for an italic. Also, I don't think the N-stem of the flower works unless the flower is at an angle. It either has to be a different, angled flower with the N-stem or keep the R-swash, lose the N-swash, and keep the i-stem with the current flower. <br> <br>Below is a very rough illustration of the direction I was trying to explain (please ignore spacing, colors, and that heinous flower illustration). <br> <br><img src=\"http://www.typophile.com/forums/messages/29/50087.jpg\" alt=\"pincess flowers\"> <br> <br>RE: Color - A deep, dark, rich purple might go well with your pink flower. <br> <br>RE: Letterspacing - You have pretty nice spacing between the I-N-C-E, but the P-R-I, and E-S-S don't seem to be on the same page. Use the I-N-C-E as your reference and move the others. <br> <br>Aloha! <br>Scott</p>"
