    html: <p>Be careful about trying to do too many things here. You've got a  <br>swash R, a pink flower, an unusual E, and two unusual S's. They  <br>all want your attention. Focus on one or two methinks. <br> <br>Swash letters are really hard to draw on a computer. Too often,  <br>the swashes just look unnatural. Your R is suffering that a bit  <br>plus it's creating a spacing problem for you. Print it out large  <br>and work over the shape with a pencil to get better flow. Maybe  <br>try to use the swash to tie the Princess to the word Flowers  <br>which is floating now. <br> <br>The C + - = E is an ok idea, but note that the cross bar should  <br>be thin for proper modulation. <br> <br>Like mike, the SS bugs. It's too Klingon for a princess IMHO. <br> <br>I like the flower in 2B because it reminds me of a Tiara. Maybe  <br>try pushing that connection a bit (but lean toward more floral  <br>and less representational tiara). Have fun! <br> <br>R</p>
    html_clean: <p>Be careful about trying to do too many things here. You've got a  <br>swash R, a pink flower, an unusual E, and two unusual S's. They  <br>all want your attention. Focus on one or two methinks. <br> <br>Swash letters are really hard to draw on a computer. Too often,  <br>the swashes just look unnatural. Your R is suffering that a bit  <br>plus it's creating a spacing problem for you. Print it out large  <br>and work over the shape with a pencil to get better flow. Maybe  <br>try to use the swash to tie the Princess to the word Flowers  <br>which is floating now. <br> <br>The C + - = E is an ok idea, but note that the cross bar should  <br>be thin for proper modulation. <br> <br>Like mike, the SS bugs. It's too Klingon for a princess IMHO. <br> <br>I like the flower in 2B because it reminds me of a Tiara. Maybe  <br>try pushing that connection a bit (but lean toward more floral  <br>and less representational tiara). Have fun! <br> <br>R</p>
