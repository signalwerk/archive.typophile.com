  date_raw: 25 Aug 2004 — 8:50am
  votes: null
  html: <p>Hi there, this logo is designed for a florist who have been established for more than 20 years. Their current logo is quite outdated. Now that there are many competitors out there, the owner wanted a facelift of the current logo and keeping it rather simple and unique. The main target audience is young executives, largely female. The client had requested to use the alphabet 'P' as part of the logo. For 1A, I have use 'P' with a curve join to the other end to form a flower. To reflect the freshness of the flowers, I have picked a brighter color palette.  <br> <br>Currently, I am unsure whether the brandmark works on its own. Also, I m quite disturbed by the placement of the brandmark when placed together with the logotype. <br> <br>What do you guys think about this? Looking forward to any comments or ideas. <br> <br>Thanks! <br> <br>Chilla <br> <br><img src="http://www.typophile.com/forums/messages/29/47528.jpg" alt="Princess Brandmark"></p>
  html_clean: <p>Hi there, this logo is designed for a florist who have been established for more than 20 years. Their current logo is quite outdated. Now that there are many competitors out there, the owner wanted a facelift of the current logo and keeping it rather simple and unique. The main target audience is young executives, largely female. The client had requested to use the alphabet 'P' as part of the logo. For 1A, I have use 'P' with a curve join to the other end to form a flower. To reflect the freshness of the flowers, I have picked a brighter color palette.  <br> <br>Currently, I am unsure whether the brandmark works on its own. Also, I m quite disturbed by the placement of the brandmark when placed together with the logotype. <br> <br>What do you guys think about this? Looking forward to any comments or ideas. <br> <br>Thanks! <br> <br>Chilla <br> <br><img src="http://www.typophile.com/forums/messages/29/47528.jpg" alt="Princess Brandmark"></p>
