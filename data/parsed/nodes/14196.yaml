  html: |-
    <p>i can’t figure out what a typeface is on an old letterpress poster that i own. it’s from the 40s.</p>
    <p>take a look at these two figures, which are Gothic 13. The upper case Q is identical to the gothic 13 Q that i’ve attached. same for the lower case t, which is pretty distinctive. however, the uppercase R doesn’t match Gothic 13’s.</p>
    <p>any of you guys know any typefaces that also have these characteristics, other than old Gothic 13?:</p>
