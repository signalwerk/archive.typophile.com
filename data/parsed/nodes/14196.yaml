    html: <p>yeah. one of the inspirations for champion and knockout has got to be it. the upper case R is just like Franklin gothic bold condensed- i’m still holding out that it’s all in the same semi-mysterious old wood typeface, but there’s always the possibility that someone mixed characters from different families. the lower case t is so recognizeable- definitely not franklin gothic.</p>
