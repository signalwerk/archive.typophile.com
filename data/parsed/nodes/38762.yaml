      <p>I’m a .gov minion. </p>
      <p>In our organization, when it was time to redesign our logo, I said ’go for it’ as I had had enough of design-by-committee after creating our first logo for them in-house.</p>
      <p>So, they went out, got an OK logo. Bland, but the committee agreed on it, and that was that.</p>
      <p>Then they asked me to create the branding style guide and manual like I had done for my own logo a year earlier, but cut and paste this new logo in to replace the one I had done.</p>
      <p>I had to explain to them 3 times that the style guide and manual was based on a specific logo and that if they want this for the new logo (which they should have) they need to have the firm that created it do it for them.</p>
      <p>The never got around to it.</p>
      <p>Oh well.</p>
      <p>All that said, I agree with russell...this isn’t a .gov thing. This is a big-organization thing. The only difference is that corporations are able to spend a bit more money in this realm without being criticized by legislature.</p>
