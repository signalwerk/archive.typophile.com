    <p>The city of Toronto is switching over to ClearviewHwy on it’s street signage. To toaday I saw several on which the letter spacing was scrunched to almost nothing. </p>
    <p>Too bad. They could have easily used a wider blade or a narrower version. (say, 3W instead of 5W) I’ll snap some photos on the weekend.</p>
