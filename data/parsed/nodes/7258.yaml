    date_raw: 26 Oct 2004 — 1:25pm
    votes: null
    html: <p>Juan Pablo, your version has had the interesting modulation removed. It's more conventional, which is good for some things, but certainly less interesting, less "progressive". As for the "i", I agree it's generally useful for the dot to be lower than the ascenders, but you will note that in the original the dot's curve does not overshoot the line, so it is in fact <i>visually</i> lower. This sort of aligned-but-not approach I think is sometimes useful, and I've done that myself in Patria a little bit (for example where the dot of the "i"/"j" aligns -visually- with the caps, but is lower than the ascenders). <br> <br>hhp</p>
