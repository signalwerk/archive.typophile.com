    html: "<p>The Q: the tail is too thin and too tapered. I understand that you probably did it that way because otherwise the whole glyph would look too dark. And there's another issue, the relationship between the tail and the bowl. <br> <br>See my small illustration below: <br>Left: original Q (I quickly traced over it directly on screen). <br>Middle: tail with increased weight and not-tapered. <br>Right: tail incorporated to the bowl, instead of being a separated element. The weight of the bowl was slightly reduced where it meets the tail, for optical compensation. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/52113.gif\" alt=\"q\"></p>"
    html_clean: "<p>The Q: the tail is too thin and too tapered. I understand that you probably did it that way because otherwise the whole glyph would look too dark. And there's another issue, the relationship between the tail and the bowl. <br> <br>See my small illustration below: <br>Left: original Q (I quickly traced over it directly on screen). <br>Middle: tail with increased weight and not-tapered. <br>Right: tail incorporated to the bowl, instead of being a separated element. The weight of the bowl was slightly reduced where it meets the tail, for optical compensation. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/52113.gif\" alt=\"q\"></p>"
