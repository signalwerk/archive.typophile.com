    html: "<p>Overall I agree with Hrant's comments. <br>I'd just like to add that: <br>- the bars of 'E' and 'F' are a bit too high <br>- Q: keep the thickness of the horizontal ending stroke until its end, the optical adjustment should be applied to the right-side curve of the bowl; <br>- the 'R' looks sad, I'd make its leg straight or subtly curve.</p>"
