    html: "<p>I think it's pretty cool - a nice mix of organic and 21st century. <br>But it seems to be trying too hard in some places. <br> <br>Vertical proportions: very good. <br>\"e\": too soft. <br>\"f\": too shy. <br>\"i\"/\"j\" dots: way too strong. <br>\"k\": out of character. <br>\"t\": out of character... heck, <i>no</i> character.  :-/ <br>\"v\"/\"w\"/\"x\"/\"y\"/\"z\": should be less stiff, somehow. <br>Numerals: nice and rationalist! \"3\" and \"5\" need polish, \"6\" is way off, \"7\" and \"9\" are imbalanced, great \"8\", the \"4\" should get its trapping at the very end!  :-) <br>UC: you got some great glyphs in there, like the \"Q\"; \"G\" needs help; \"M\" too much; \"S\" too dark; \"N\", same as \"4\" - trap last! <br>Spacing: decent, for now. <br> <br>Good luck! <br> <br>hhp</p>"
    html_clean: "<p>I think it's pretty cool - a nice mix of organic and 21st century. <br>But it seems to be trying too hard in some places. <br> <br>Vertical proportions: very good. <br>\"e\": too soft. <br>\"f\": too shy. <br>\"i\"/\"j\" dots: way too strong. <br>\"k\": out of character. <br>\"t\": out of character... heck, <i>no</i> character.  :-/ <br>\"v\"/\"w\"/\"x\"/\"y\"/\"z\": should be less stiff, somehow. <br>Numerals: nice and rationalist! \"3\" and \"5\" need polish, \"6\" is way off, \"7\" and \"9\" are imbalanced, great \"8\", the \"4\" should get its trapping at the very end!  :-) <br>UC: you got some great glyphs in there, like the \"Q\"; \"G\" needs help; \"M\" too much; \"S\" too dark; \"N\", same as \"4\" - trap last! <br>Spacing: decent, for now. <br> <br>Good luck! <br> <br>hhp</p>"
