      <p>One of my favorites.</p>
      <p>The "w" is quite badly mangled. I can understand that they couldn't handle the blackletter-style original, but they could have gotten somebody who knows how to properly modify letterforms to do it... John, if you also mind the original "w" (and the "v") , and have a -modest- budget, you can find people on Typophile (including yours truly) to do it right.</p>
      <p>hhp</p>
