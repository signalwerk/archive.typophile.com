    html: <p>Paul,  <br> <br>put the alternates into "ss01" and into "salt".  <br> <br>Illustrator CS (all versions), InDesign CS ME and Photoshop CS ME all support "salt". The upcoming Microsoft WinFX architecture with support both "salt" and "ssXX", I'm sure other applications will add "ssXX" support as well.  <br> <br>Regards,  <br>Adam</p>
