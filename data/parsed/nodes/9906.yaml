    votes: null
    html: <p>Contextual alternates won't work for this because you can't define the context in OpenType terms (nearby glyphs). <br> <br>Personally, I'd use stylistic sets. It's my firm belief that shoehorning glyphs into inappropriate features because of what apps happen to support this month is a bad idea. Stylistic sets are pretty much at the top of our list for next features to support. <br> <br>Failing that, make separate fonts. <br> <br>My two cents. <br> <br>T</p>
