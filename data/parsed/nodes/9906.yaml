    html: <p>Charles knows better than I, but I do agree with him about usage. Since I am pretty sure you are talking about your Lanston Goudy Old Style, I would think that people are not likely to mix the regular and full descender versions in the same paragraph. So with two fonts they can just set two styles--such as for body text and footnotes--and go with it.</p>
