    votes: null
    html: <p>I don't know, I think you should make 2 separate fonts, but I guess it depends on whether it is a text face or a display face. Because, theoretically, you won't mix long and short descenders in a text block. But that kind of variation may be very interesting in display fonts. <br> <br>The problem with using &lt;calt&gt; to this kind of thing is that you won't be able to include 'real' contextual alternates. Or, you can include contextual alts, but they'll only work with the alternate letters; and they'll <i>always</i> get activated with the alternate letters.</p>
    html_clean: <p>I don't know, I think you should make 2 separate fonts, but I guess it depends on whether it is a text face or a display face. Because, theoretically, you won't mix long and short descenders in a text block. But that kind of variation may be very interesting in display fonts. <br> <br>The problem with using &lt;calt&gt; to this kind of thing is that you won't be able to include 'real' contextual alternates. Or, you can include contextual alts, but they'll only work with the alternate letters; and they'll <i>always</i> get activated with the alternate letters.</p>
  - id: 63077
    user: 2910
    date: 2005-03-23T08:25:00
    date_raw: 23 Mar 2005 — 8:25am
    votes: null
    html: <p>Thanks for your comments, Eduardo. I guess I technically COULD make two separate fonts, but I thought it would work better as an OT feature. The face I'm working on is a text face, not display. I guess my logic in justifying the "calt" feature is 1) i have no other contextual alternates that these descender variants would interfere with. 2) ideally these alternates would be truly contextual if features could rely on leading and switch to the short descenders when leading is decreased below a certain level, say below 120% of the point size.</p>
