    html: <p>You probably need to clear your font caches. You can do it with a Utility like <a href="http://homepage.mac.com/mdouma46/fontfinagler/" target="_blank">Font Finagler</a>. This is pretty much required if you want to develope and test fonts on OS X anyway. Changing the font name during testing each time you make a new version (the font name, not the file name) can help, too.</p>
