  html: <p>Does anyone know why a TrueType font wouldn't be working in Flash or Dreamweaver? It works in InDesign, Photoshop, etc. The name of the font is there, but when I select the text &amp; font name, the text goes blank.  <br>I created the font in FontLab.   <br>Other fonts I've created are working just fine in these recently acquired Abode software products... <br> <br>very strange... <br>any thoughts are appreciated... <br> <br>thanks! <br>amy</p>
