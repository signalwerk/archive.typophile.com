  html: |-
    <p>There’s a novel set in New York City — a mystery story, I think, but one concerned with the printed word and mapping. In it, the hero/heroine traces out letterforms on the streets and avenues of the city with her path.</p>
    <p>I’ve never read the book, but I’d like to. Anyone remember the title? Got any impressions of it?</p>
    <p>Thanks,<br>
    David</p>
