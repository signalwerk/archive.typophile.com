      <p>· · · · · · · · · · · · · · · · · · · ·<br>
    <strong>Free plugins for Photoshop released!</strong><br>
    · · · · · · · · · · · · · · · · · · · ·<br>
    For Immediate Release<br>
    October 30, 2005<br>
    Contact: Ted Harrison<br>
    Fontlab Ltd.<br>
    136 E 8th St., Port Angeles WA 98362, USA<br>
    Tel: +1 (509) 272-3260<br>
    contact[at]fontlab[dot]com</p>
    <p>Port Angeles, WA, USA – October 30, 2005.</p>
    <p> Fontlab Ltd. announces the release of <strong><a href="http://www.fontlab.com/photofont/">Photofont Start</a></strong> for Mac and Windows.</p>
    <p>Photofont Start is a free plugin that allows any graphic designer to use photofonts in Adobe Photoshop and compatible applications for Mac OS and Windows. Photofont™ is an exciting new technology that allows users to create and use full-color bitmap type with transparency.</p>
    <p>“Photofont opens completely new dimensions in the field of typography that was until now dominated by black-and-white type. Imagine computer letters with true calligraphic expression, visible brush strokes and paper structure. This is now possible with Photofont. And the best of all, the plugin is free,” said Ted Harrison, President of Fontlab Ltd.</p>
    <p>The ability to create photofonts has been available for some time for users of BitFonter, Fontlab Ltd.’s professional bitmap font editor. Now, with the new free Photofont Start plugin, these designs can be easily used in the most popular bitmap-editing applications: Adobe Photoshop, Corel Painter, Macromedia Fireworks and compatible applications that accept Photoshop plugins on both Mac OS and Windows. The Photofont file format specification is based on open standards like XML and PNG and is publicly available. For more information visit the Photofont Start page at <strong><a href="http://www.fontlab.com/photofont/">http://www.fontlab.com/photofont/</a></strong></p>
