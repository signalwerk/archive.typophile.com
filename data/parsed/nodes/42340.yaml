    <p>Hi,</p>
    <p>I am picking out a geometric sans serif for a website. It needs to be similar to Futura but it also needs to be softer than Futura.</p>
    <p>What are the differences in feel between Futura, <a class="freelinking external" href="http://www.myfonts.com/fonts/dtptypes/graphicus-dt/regular/charmap.html" rel="nofollow">Graphicus DT Regular</a>, and <a class="freelinking external" href="http://www.bvfonts.com/fonts/details.php?id=45" rel="nofollow">Print Clearly Bold</a>?</p>
    <p>I really appreciate your help! Thanks in advance!!</p>
