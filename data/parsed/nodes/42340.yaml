    html: <p>Graphicus DT appears very similar to Futura; it seems to be a tad wider and the A,M,W are flattened on the top and bottom whereas in Futura they have points.  Also, the j has a slight curve at the bottom instead of just a straight line, and the descender on the g is less harshly geometric and more open.  Print Clearly is narrower than Futura and appears to have a rounded stroke.  Also, the I, J, and 1 have serifs to make them more distinguishable.  I'm not an expert, but I hope that helps.</p>
