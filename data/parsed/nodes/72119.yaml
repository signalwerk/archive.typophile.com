      <p><cite>However, the digital version many of these (even Bembo Book) do not do the originals justice.</cite></p>
      <p>Yes and no. If you mean can be substituted for the metal/letterpress without notice, then no. Each letter was individually cast in metal, so there could be slight variations. Not every letter rested exactly on the "baseline." The height of each letter would not always be the same, and shimming was time-consuming, &amp; impossible with Linotype. If you printed from the type itself, it would wear -- what, 5000 impressions from Linotype, 7,000 from Monotype, a bit more from foundry.</p>
      <p>In other words, there was some randomness with metal/letterpress that you do not have with current digital fonts. Perfect order is boring, we need some chaos in any work for it to be appealing. Having said that, there is still enough randomness available, usually with just the Latin alphabet itself.</p>
      <p>And having said that, most letterpress printing was atrocious. When speaking of it's beauty, most people pull out a favorite book or two or 100, ignoring the thousands upon thousands that are simply dreadful. (This was first pointed out to me by the designer Rich Hendel, it's not my original thought. But he's right.)</p>
      <p>If you like the classic types, you can get the same feel on the printed page. Usually, this will require a font editing program, and a license that permits modification. I suppose I have an advantage here, so many of the fonts I have were purchased with the Adobe license in the 1990s. You can't do that anymore. <a href="http://www.adobe.com/type/browser/legal/additional_licenses.html" title="http://www.adobe.com/type/browser/legal/additional_licenses.html">http://www.adobe.com/type/browser/legal/additional_licenses.html</a> Secondly, I'm old enough that I've met a number of the older designers, and can usually get permission to modify a font. They trust that I won't butcher their work. Anyone can do this, it is just a matter of time &amp; work.</p>
      <p>* * *</p>
      <p>I like Trinite, and don't particularly see a need to "reserve" it -- Eckersley used it for most everything the last 8 years of his life. Here's a book about early 20th-century radicals Richard designed. A long way from the Italian renaissance.</p>
      <p><a href="http://www.tug.org/texshowcase/6553-sample.pdf" title="http://www.tug.org/texshowcase/6553-sample.pdf">http://www.tug.org/texshowcase/6553-sample.pdf</a> </p>
      <p>I like Minion. Boring is good. I did go back to the PostScript Multiple Masters fonts and make up a version for DTP printing, but you could do the same.</p>
      <p>Etc.</p>
      <p>From a typeface perspective, the book world is "boring." There is no branding. Nothing to sell with the type or design. If the author writes poorly or has nothing to say, there will usually be no audience, no matter what typeface you pick. And it is easy to do damage with too much exuberance.</p>
