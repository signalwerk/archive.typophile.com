      <p><em>I'm living in the most highly taxed country in the world</em></p>
      <p>A mere fifth on the Big Mac Index, however.</p>
      <p><em>I take it morphism in this case means the overall shape and look of the typeset</em></p>
      <p>It's a term borrowed from category theory.<br>
      The functors of typefaces are abstract, variable, plastic qualities, such as weight, contrast, angle of stress, serif genre, etc., that can be used to describe any typeface.<br>
      Once you limit yourself to a set of particular typefaces, which fix a combination of functor values as specific morphisms, you exclude those functor values not represented by those faces.</p>
