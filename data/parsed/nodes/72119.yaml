      <p><cite>what are the new typefaces that you feel show promise for books over the past few years?</cite> </p>
      <p>I'm not a good person to ask that question of. For maybe 10 years now, I've been much more interested in *usefeul* than *like.* </p>
      <p>I typeset more than design, but when I do design -- that is, select the fonts for a book -- I find I select fonts that are open source (usually reworked), as this solves a real need in the scholarly publishing world. </p>
      <p>Other than that, I occasionally select fonts from a type designer whose work I think has been overlooked &amp; deserves a bit of promotion. </p>
      <p>And if  none of these seem appropriate for a project, I go with what I know will work, which given my age, throws us back to the "classics." I'm not terribly interested in newness for newness sake, nor do I care how many times a font has been used. </p>
      <p>There are other, equally valid approaches, as long as the work serves the reader, and as much as possible, the author. It's old school, but I feel book shows should be just that, not design shows. Too many years of insider stories about the jurying of the 50 best books... </p>
      <p>Edit:</p>
      <p>In other words, to return to the automotive analogy, If I were to abandon my truck for a car, it wouldn't be another Studebaker (not even an Avanti), or a new Jag. It would be a new Porsche 911, visually little changed for many years -- but  IMSLTHO, one of the best cars available. Not your question, you want someone with an eye for the new.</p>
