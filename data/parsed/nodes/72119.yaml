      <p>Jeez...I get hung up with "true classics." There isn't much of anything today that mirrors the true classics, because very little was done to emulate them. All you have to do is put a book printed letterpress along side a contemporary book purporting to use the same font, and you'll see the difference. If you want to even approximately mirror them,  you need a font editing program to beef things up.</p>
      <p>Then there is the notion of "a classic": if you're a car buff, there was something about the 1953 Studebaker and the E-type Jag. What we get today doesn't look at all like them -- today is all bulbous &amp; bulky. Same with fonts, I think. But so what? Remember, the E-type Jag also had electronics by Lucas, and the '53 Stude had that V-8 where the oil galleys meant only cylinders 1 &amp; 8 got adequate oil. (Or was it the other way around?)</p>
      <p>In the same vein, there are people designing type today that might become classics. Not much, maybe one or two new families a year, but if you free your eye from the small details of classic dimensions &amp; detail, some of the new designs show excellence, just like some of the new cars.</p>
      <p>I hesitate to mention any, because as a comic book aficionado, your needs and taste will run different than mine; my concerns are with long texts.</p>
      <p>While the type designers who populate Typophile tend to poo-poo the notion, in your situation, I'd get the best font editing program you can afford, and start to learn. You could start by fixing what's wrong with modern renderings of "the classics," you'd learn a lot.</p>
