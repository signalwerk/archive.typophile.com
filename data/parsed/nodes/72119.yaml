      <p>IsleofGough, don't mind the fans - name the fonts you don't like. I don't like Trinité. I <em>used</em> to like it. But back then I also liked Caxton.  :-/</p>
      <p>Lexicon (which is still not my cup of Lapsang Soochong) is much more respectable.</p>
      <blockquote><p>usually with just the Latin alphabet itself.</p></blockquote>
      <p>Actually the Latin alphabet is too boring. For one thing it uses the vertical space very poorly, especially when you factor in letter frequency.</p>
      <blockquote><p>They trust that I won't butcher their work.</p></blockquote>
      <p>Probably, but much more significantly: they trust you won't redistribute the modified version.</p>
      <p>BTW the Adobe Originals still allow modification.</p>
      <blockquote><p>Nothing to sell with the type or design.</p></blockquote>
      <p>Of course this makes no sense. Type design may not transform a horrible author, but anybody making or choosing a font nonetheless has a responsibility; to me anybody lacking a grasp of how text fonts manipulate the reader's unconscious -certainly at the level of texture if not individual letterforms- is only half a designer. Consciousness is over-rated, and "boring" (which is better called "translucency" - not even "transparency") is just another factor in design. So using Minion can make sense, but it makes a lot less sense than some people like to believe.</p>
      <p>Branding is everywhere, because humans are awesome observers.</p>
      <p>hhp</p>
