    <p>Hi, name's Lars Johansson. ( *ducks for obligatory Swede-jokes*)</p>
    <p>I found this outstanding site trough some searching on the web, for resources and information on fonts and typography.</p>
    <p>I'm a hobbyist web and graphical designer, as well as an amateur comic-book letterer and colourist. </p>
    <p>I'm also an editor for a comic-book fanzine here in Sweden, and one of my duties is the design of logos and promotional fliers. As such, I have been reading up on what is essentially considered to be the VERY BEST of the best, of the best, ( and on and on ;) ) fonts that a modern graphical designer needs to have in his arsenal.</p>
    <p>I've also come to the conclusion that quality most definitely don't come cheap. So, realizing that I at the moment do not have the funds to actually acquire the tools of the professional, I have started the search for the best hobbyists tools. </p>
    <p>That has led me to this board, mainly because I find an immense amount of knowledge seems to be contained here. Knowledge that I desperately need.</p>
    <p>You gents and ladies are some of the very best in the global typography industry. Can you help me out with putting together a list of the very best Open Source fonts that I can use in my work?</p>
    <p>I've been gazing the following sites in my quest, and they seem to hold part of the answers that I seek: </p>
    <p><a href="http://www.theleagueofmoveabletype.com/" title="http://www.theleagueofmoveabletype.com/">http://www.theleagueofmoveabletype.com/</a><br>
    --<br>
    Really great fonts there, already dl-ed some of them and used in a project.</p>
    <p><a href="http://www.alvit.de/blog/article/20-best-license-free-official-fonts" title="http://www.alvit.de/blog/article/20-best-license-free-official-fonts">http://www.alvit.de/blog/article/20-best-license-free-official-fonts</a><br>
    --<br>
    Vitaly Friedman seems to be taking a really good look at some of the best alternatives for a newbie like me. It doesn't seem like that many of these fonts can actually replace the true classics that professional designers use tho...</p>
    <p><a href="http://justcreativedesign.com/2008/03/02/30-best-font-downloads-for-designers/" title="http://justcreativedesign.com/2008/03/02/30-best-font-downloads-for-designers/">http://justcreativedesign.com/2008/03/02/30-best-font-downloads-for-desi...</a><br>
    --<br>
    Jacob Cass goes trough the very best of the best... and I have to agree, those types and fonts seem really versatile. </p>
    <p>So, do you think it's possible to find replacements for the true classics? As a start I just want to find some alternatives to the top 7-10 fonts, instead of the massive list of 30 classics that the real pro's use. Just want the bare bones, a little something to start me off, so to speak.</p>
    <p>Something that will replace these little nuggets:</p>
    <p>1. Akzidenz Grotesk<br>
    2. Trajan<br>
    3. Garamond<br>
    4. Futura<br>
    5. Bodoni<br>
    6. Bickham Script Pro<br>
    7. Frutiger<br>
    8. Univers<br>
    9. DIN<br>
    10.Trade Gothic</p>
    <p>Any help and suggestions are gladly received, ladies and gentlemen.</p>
    <p>-Lars</p>
