      <p>Thank you for your comments. I have a fondness for books printed with metal type in classic fonts like Bembo,  Sabon, Dante, Bulmer or even Caledonia. However, the digital version many of these (even Bembo Book) do not do the originals justice. The most flagrant example is Centaur (not really a book font, excluding the Oxford Bible) which was beautiful in metal type and pretty much unusable in its digital version. However, the practicalities of the linotype and monotype machines made proportions of these metal types much more restrictive than more modern digital typefaces designed without such constraints.<br>
      There are similar examples in typefaces that originated for photocomposition that don't quite work in their digital equivalents.<br>
      So if classic fonts mean those in the 1980s and 1990s at least loosely modeled after type from the 1400s onwards created as digital type, then that is only somewhat classic. It seems there have been two trends over the past decade or so: one to make some of the forms more authentic (accounting for ink spread with denser type - like ITC Mendoza) or more accurate renditions (Adobe Garamond Premier Pro vs Garamond Pro) and the other to incorporate newer elements and be less bound by classical forms. Some give a nod to French Oldstyles (like the wonderful Scala Serif and Sans) but are probably most successful because they are not too close a match.<br>
      There are a few classics I dislike (probably my deficiencies in taste): Jannon/Kis, Bembo Book, most ITC typefaces including ITC Baskerville, digital Bulmer, Galliard, and a great many Adobe fonts (not to be named in case their fans are here). Some of the more modern interpretations of older fonts are more successful: Mercury, Premiera, Documenta (only if set small), Iowan OS, scala, Albertina, Merlo, Quadraat, Cycles, Collis, Sina, and possibly Dolly (I own it but never quite can use it). Minion is ok but too boring. Lyon is not bad and I am currently experimenting with Sina Nova. My favorite is Trinite, but it is best reserved or just the right situation. I probably should just learn the classics better, since even a great font can look bad if the whitespace, leading, page dimensions, or printing are subobtimal.<br>
      I haven't had much luck with finding a free font that works. Some are well designed but don't fit the types of things I do.<br>
      I just was hoping for inspiration, but the reality is the best book font is subtle enough to almost be unnoticed - just to create a welcoming feeling to the reader. I am not sure it even needs to be authentic (like a Baskerville for a book about the turn of the 18th century). It just has to be inviting and contribute to enjoyment and comprehension of the novel, poetry, or scientific text.</p>
