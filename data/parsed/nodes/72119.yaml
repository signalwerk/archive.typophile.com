      <p>I am kicking myself for having lost the multiple master versions of Jenson and Minion; but with moves, computer crashes, changing operating systems, suboptimal backup practices, and believing the hype that optical variants of opentype made them obsolete - they are gone.</p>
      <p>I am guilty in comparing the beautiful and best books in letterpress against the average today. It is not only the minor variability in letter placement, but also the look of how the ink lies on the paper, the smell and feel of the paper and binding, the book proportions, etc. that sum together into the experience of reading these.</p>
      <p>My taste has changed some over the years. At one time I really liked documenta, but now I use it little. I still secretly like Calisto and once liked old style 7, and enjoyed several Bertholdt fonts. Lexicon is ok for newspapers, but I think it made too many compromises and lost some beauty. Many Adobe fonts are not bad, but they always seem to come in a second or third choice for me. Many of their designers are still living and have no doubt a better eye than I do...</p>
      <p>I would agree that while type that consciously is noticed is bad for books, an unconscious feeling is desirable. However, these days, the pick may have more to do with extended foreign language support, legalities or embedding or modification, or whether one needs a lot of italics or a matching sans, etc. Even in books about type, I have seen Minion, Galliard, Sabon, and Scala used - and I still think Minion is more boring that just transparent, compared with the alternatives.</p>
