    html: |-
      <p>If you've been looking for high-quality open source fonts, I expect you've found the GhostScript fonts  already:  <a href="http://downloads.ghostscript.com/public/fonts/" title="http://downloads.ghostscript.com/public/fonts/">http://downloads.ghostscript.com/public/fonts/</a><br>
      These versions are the latest release from URW (from some time in 2011, I think), <em>not</em> the various extended versions available from multiple open source distributions, which are mostly based on the 10+ year-old original releases.  The best of these extended versions (which do have broader language coverage) seem to be the <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/" rel="nofollow">TeX Gyre</a> fonts.</p>
      <p>They largely duplicate fonts that are distributed standard in most OSes nowadays, so how useful they are to you is an open question.  Still...</p>
      <blockquote><p>
      1. Akzidenz Grotesk<br>
      4. Futura
      </p></blockquote>
      <p>If you're limiting yourself to a basic selection of essentials, rather than Akzidenz Grotesk you'd probably be just as well off with a free Helvetica clone, like Nimbus Sans or Heros (from the above links).</p>
      <p>It's not Futura, but if you're looking for a good geometric sans in general, the Avant Garde clones URW Gothic or Gyre Adventor are also part of the same sets.</p>
      <blockquote><p>
      2. Trajan<br>
      5. Bodoni<br>
      6. Bickham Script Pro<br>
      7. Frutiger<br>
      9. DIN<br>
      10.Trade Gothic
      </p></blockquote>
      <p>Can't be much help with these ones, but...</p>
      <blockquote><p>
      3. Garamond<br>
      8. Univers
      </p></blockquote>
      <p>Whether you can legitimately call them open source is a matter of some debate, but the <a href="ftp://ftp.dante.de/tex-archive/support/ghostscript/AFPL/GhostPCL/" rel="nofollow">URW GhostPCL fonts</a> include a decent free Garamond, "Garamond No.8".   IMHO it's not quite as crisp as Adobe Garamond but it's reasonably nice, and it's a true Garamond (not a Jannon).</p>
      <p>The same set also includes an Univers clone called "U001".</p>
      <p>You should also check out the <a href="http://arkandis.tuxfamily.org/tugfonts.htm" rel="nofollow">Arkandis open source fonts</a> for some good alternative fonts.  Baskervald is particulary good, in my opinion.</p>
    html_clean: |-
