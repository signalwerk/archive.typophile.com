      <p><em>As a start I just want to find some alternatives to the top 7-10 fonts</em></p>
      <p>If you want alternatives, why circumscribe yourself by a "similar to" strategy?<br>
      Those typefaces define typographic range in an old set of morphisms.</p>
      <p>Why not seek a "top ten" that provides a broad palette of contemporary functionality?<br>
      That would include relevant genres such as square fonts, ultra-black, handwriting scripts, and slab serifs.</p>
