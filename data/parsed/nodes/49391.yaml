    html: <p>You need to hint the font. Try switching to Fontlab or Fontforge, convert the font to Postscript Opentype, and then you can use the Adobe autohinter from <a href="http://www.adobe.com/devnet/opentype/afdko/" rel="nofollow">AFDKO</a>?</p>
