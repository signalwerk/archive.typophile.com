      <p>The latest version of Type 2.2 (2.2.019 full) allows you to add global hinting to OpenType PostScript fonts (eg BlueValues etc). Typelight will now also retain these with edited fonts.</p>
      <p>Cheers,<br>
      Allan Murray</p>
