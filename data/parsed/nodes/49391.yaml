    html: |-
      <p>Did you hint your outlines, or did FontLab (?) autohint while generating the fonts?</p>
      <p>With ClearType turned on it may be better to not hint the font before you are finished designing it. Or try generating it as OTF with PostScript Outlines, then Windows won't use ClearType, just greyscale rendering, but the output will be less distorted and closer to your actual outlines.</p>
      <p>Good ClearType hinting can be quite a task ...</p>
