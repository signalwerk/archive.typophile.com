      <p>Yepp. Basic auto-hinting gives nice smoothe rendering in Word and most other type apps. I limit all my retail faces to just the very basic autohinting, as there is less and less need for interpolated cusp points, delta hinting &amp; instructions, or links in this age of reason.</p>
      <p>j a m e s</p>
