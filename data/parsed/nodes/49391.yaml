    <p>Hello everybody, </p>
    <p>I have recently started to learn about font design and attempted to generate a Helvetica-like sans serif (see also my font post: <a href="http://typophile.com/node/49228" title="http://typophile.com/node/49228">http://typophile.com/node/49228</a>). I have some problems, however, in getting the fonts to display smooth at different sizes.  </p>
    <p>I have noticed that when using the font in Microsoft Word in contrast to Acrobat some of the curves are rendered very badly - see the arrows in the image bellow. </p>
    <p>Question:  What one can do to make sure that fonts are displayed smoothly in Word at various sizes (OS: XP with Cleartype turned on)<br>
    - are there special design methods needed, is it a matter of metrics, or it is a problem with the outline shape i.e. bad design (the font is in a very early stage)?. </p>
    <p>Thanks in advance for any advice.</p>
    <p>Word:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Test_Word2_6507.PNG"></div><p></p>
    <p>Adobe Reader:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Test_Acrobat_3634.PNG"></div><p></p>
