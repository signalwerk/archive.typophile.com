    html: |-
      <p>I was fired in the fall of 2004. I had been working at a small design firm for three and a half years. The place had struggled the entire time I worked there... partly due to the struggling economy after 9-11, but mainly due to poor management by the owners. A large project an art director and I worked together on finally pulled the company out of debt from bad business decisions two years prior. Things started to look up. There was a small bonus for everyone and the company spent over 20K on new equipment. Then two months later they layed off the art director I worked with on the project mentioned above. That was the final wake up call to me that I had to leave. So I looked for new work and within 6 weeks of the art director's layoff I found a new job at an ad agency.</p>
      <p>Unfortunately, as a result of seeing how poorly the owners managed the company I developed an inflated sense of self as I thought anyone could perform better then that could.  I was blinded to my own inexperience and my stunted growth from working under managers who were poor mentors in my career development. Additionally, in my job search I thought I had developed "bad business radar" that would save me from selecting a job from another company doing poorly in business.</p>
      <p>The job posting I replied to at the new ad agency was for a designer with a focus in web design and at least two years experience. I promoted my three and a half years experience, web experience, and added print experience as a bonus. I ended up being offered the job. Right after I signed the papers to make the job offer official, and had given notice to the design firm I was working at, I was informed that the design firm had just fired their two top designers and only kept their newest designer who had little to no formal education in design and lacked basic design skills like layout and typography. They refused to disclose why they fired the two people before me, but insisted it was good cause.</p>
      <p>My first two months at the job they complained every single day about the two previous designers. From what I could see of the work done by the previous designers, they had been at least as talented (if not more talented) then me... but the quality of their work was often part of the complaints. Gradually the anger and complains became directed at me and my work in the same fashion as had been directed at the two designers they fired. </p>
      <p>The monday of my last week there I knew that I was on my way out as I was being isolated by interations within the office and gradually projects were being "postponed". I had one big project I was finishing and upon completing it that friday, after staying late Thursday to work on it, they "let me go." </p>
      <p>Being fired was a hurtful and humbling experience. In the end it was the best as the work environment was hostile. In many ways I am still hurt from the experience... however I am thankful for it as I am a better person as a result. I don't feel the situation was fair. The ad agency was not forthcoming in what they needed on the job posting and in the interview. Had they been I would have been the first to confess that I was not ready to be a creative director. However, I did have an inflated self image and needed to be kicked down so that I could be humbled and pick myself up with a new focus, resolve, and attitude.</p>
      <p>My unemployment was tough, but thankfully short. Through it I learned empathy for those who face hard times (prior I often felt judgement and disdain). I learned that I had much to learn both in design, management, and in how to be a better person. I learned that I had to be careful about judging others, as I was judged by my former employers and it didn't feel good or kind.</p>
      <p>Even when being fired for no good reason, there is almost always something you did, didn't do, or an attitude you kept within yourself that you can reflect on and improve upon. By learning from the situation you can grow for the next opportunity that finds you. I am a better designer, better employee, and a better person because of my 2004 firing and what I learned from it.</p>
