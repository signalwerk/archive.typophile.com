      <p>Susan<br>
      I've been fired often enough for one lifetime for a variety of reasons. As these were graphic design positions I guess I might deduce that a. I'm a crummy designer. b. I don't know how to listen to and follow instructions. c. a combination of a and b. d. I'd rather not work for people and prefer working for myself.<br>
      d. is actually my preference, not a reason to be fired. Before you decide which of these might apply to you, take a good look at yourself and how well you work with others, follow instructions and listen to everyone. Oh, and ps, at my age finding a job is very difficult, no matter what, so working for myself is really the only option I have, aside from bagging groceries at the local big chain.<br>
      Jordan</p>
