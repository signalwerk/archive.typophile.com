    html: <p>Michael, that sounds like a nightmare situation. It is also a good example of how ad agencies are usually run by "non-creatives".  The account and sales people are often lauded and given the spotlight, while the people who actually create the work the agency sells are secluded and treated poorly. This was my experience at one of the agencies I worked for as well as one of the design firms. It's unfortunate, but a lot of times there is a great division between these two sides. This is probably a whole 'nother topic...</p>
