    <p>I bet I've been fired more than you.  In an effort to encourage those losing jobs or having a hard time finding them, I've shared some of the experiences I've had in the graphic arts over the last 25 years.  Please share your experience if you think it will help our less fortunate peers in this soft economy.  The title is "Separations" and as an added bonus, I've posted my Columbus College of Art and Design photo ID so there I am--at age 17 and at age 2 with my dad.</p>
    <p><a href="http://blogs.graphicdesignforum.com" title="http://blogs.graphicdesignforum.com">http://blogs.graphicdesignforum.com</a></p>
    <p>Thanks.<br>
    SDK</p>
    <p>Try it now--Ha!  No s.  Sorry.</p>
