    html: <p>I've never been fired. Have worked at 1 in-house design group, 2 ad agencies, and 2 small design firms, in various capacities. When I finally found a good creative home, the creative director was fired. He didn't see it coming. I realized then that working for myself is the best option, and have been doing it for about 5 years now. I would consider joining a firm again, but probably have priced myself out.</p>
