    html: <p>FontLab is probably best. You could use TypeTool, though it would be more difficult. If you are okay with Unix and X11 and have Developer Tools in installed on OS X there's FontForge (<a href="http://fontforge.sourceforge.net/" target="_blank">http://fontforge.sourceforge.net/</a>).</p>
