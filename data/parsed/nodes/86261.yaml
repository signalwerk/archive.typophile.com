  html: |-
    <p>I'm researching this poster: <a href="http://www.loc.gov/pictures/resource/cph.3g10242/" title="http://www.loc.gov/pictures/resource/cph.3g10242/">http://www.loc.gov/pictures/resource/cph.3g10242/</a> and know very little of typography. Could any of you help me with identifying this font or point me in a direction as to where to look? I've been trying to figure this out for a while and have been browsing 1910-20s fonts but I'm afraid I'm utterly unqualified to be looking at this at all...<br>
    Thank you!!!</p>
