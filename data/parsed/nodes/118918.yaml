      <p>Hi,<br>
      Did you try to convert it on Fontforge?<br>
      In Fontforge you can export single path font (if I well remember you can choose it in font info). But then you can it just in illustrator.<br>
      To use in other way, you have to create parallel path in Fontlab or other.  </p>
      <p>In Autocad, you have also this kind of single path font.<br>
      You can also find <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> font on the web.</p>
      <p>Good luck.<br>
      Let us know if you find a way export these fonts.<br>
      SD</p>
