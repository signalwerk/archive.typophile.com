    <p>Hello,</p>
    <p>To all collectors and type enthusiasts, I'm selling my pristine copy of the book listed below. I thought you guys passionate about typography might be interested to own one of the most elusive and sought-after book of typography, lettering and phototypesetting.</p>
    <p>Check the photos from this link : <a href="http://imgur.com/a/irOS7" title="http://imgur.com/a/irOS7">http://imgur.com/a/irOS7</a><br>
    Price is $1000 (excl. shipping). If you are interested, please contact me from my Typophile profile page.</p>
    <p>Title : Alphabet Thesaurus Nine Thousand<br>
    Author : Photo Lettering, Inc., 1960. PROFESSIONAL EDITION.</p>
    <p>Photo Lettering, Inc. - ALPHABET THESAURUS NINE THOUSAND. New York. Original Edition. First Edition. Professional Edition, 1960 (at the time they were also selling a Reference Edition –abridged– sold at a cheaper price). Text in English. Some pages printed in color others in black. The cloth bound cover is lightly worn at the edges (see pictures). Binding is intact. Except one page with a side note in colored pencil (see photo), all pages are clean. A very good copy. Only one previous owner who took great care of it. A milestone of typography in the United States and worldwide. The book consists of an impressive collection of over 700 pages of original typefaces crafted by the world’s greatest letterers and artists. VERY RARE. Get your chance to own one of the most sought-after and elusive typography book.</p>
    <p>Printed in USA.<br>
    12" x 9 1/4" x 2 1/4" (DIN A4 format, 60mm of thickness).</p>
    <p>Contributing letterers and artists for this book include : Josef Albers, Alexey Brodovitch, J. Albert Cavanagh, Joseph Binder, Edward P. Diehl, Harold Hite, Harry Winters, Albert E. Nolan, Albert Soroka, Charles J. Freericks, George Suman, Herbert Feuerhake, Pete Dom, Gustav V. Meidel, William H. Millstein, Emil A. Schaedler, M. M. Davison, Tommy Thomson, C. E. Coryn, Tony Stan, George F. Trenholm, Sol I. Immerman, Oscar Ogg, Edwin W. Shaar, Garnett Megee, Herman Spinadel, Hollis Holland, Saul Haupt, Denis A. Edridge, Sidney Lisson, Sol Nodel, J. J. Karle, James D. Brooks, Victor Lamkay, Nasri Khattar, Alfred R. Bosco, John A. Karafa, Milton Crown, L’Harl Copeland, David B. Hills, Milton K. Zudeck, Melvin M. Tuch, M. R. Kaufmann, Maximilian R. Kerr, S. E. Norton, Frederick Blakeslee, Arthur Ohlman, George Piscitelle, Rodolfo Wallenberg, John S. Allen, AND MANY MORE…</p>
