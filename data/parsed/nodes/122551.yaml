    html: |-
      <p>This edition is the very first Alphabet Thesaurus from Photo-Lettering, Inc. Released in 1960. It is the professional edition and has nothing to do with other editions. The main thing is that many alphabets found inside were not reissued in the other editions.</p>
      <p>Also, it’s usually found in poor condition with the spine detached.</p>
