      <p>Might be a little verbose -- I'd be tempted to turn "contribute to or hinder" into simply "contribute to" -- but certainly a good start.</p>
      <p>The "Are my writing, editing and designs up to the standard of excellence the University wishes to project?" makes me a little nervous, though: if there's an extensive style manual that is rigourously adhered to, fine, but if there isn't, it become a pretty amorphous concept.</p>
      <p>I'd also want to see something in there that also mentions cost-effectiveness: for example, you find a way to do a great piece by creatively imposing it to print one side one colour and the second side four, instead of both sides four, and save a ton of money in the process.  Doesn't hurt to qualify being able to improve the bottom line.</p>
      <p>As someone once remarked to me, "The person wanting this job done will want you to do it fast, right, and cheap.  Always tell them they can only have two."  Might as well get credit if you can get close to three....  ;-)</p>
      <p>FWIW, I don't envy you having to do this: I know it's the backlash from Enron, but trying to wring "accountability" from intellectual and creative processes seems to frequently result in a lot of BS.  That's not to say that there shouldn't be some way to objectively measure the difference between two employees, but all this palaver about "excellence" simply strikes me as the latest management fad proposed by someone else with a book to flog.  </p>
      <p>Anyone else remember TQM?</p>
      <p>Linda</p>
