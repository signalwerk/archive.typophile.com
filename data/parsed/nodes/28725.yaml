      <p>Thank you. I guess my employment situation isn't typical of this industry. I'm not working on contract; I'm unionized and permanent. "Measuring excellence" is part of the university's new 5 year plan.</p>
      <p>For sure the measurements can't be like those for data entry, which is precisely why I was having difficulty. However, I quite appreciate my supervisor's point: if I don't provide the guidelines by which to assess my success, someone else will, and it may be along the lines of x number of mistakes gets me canned. </p>
      <p>I've included below what I came up with. Thanks for the input, and of course, I'd be happy to hear comments... I have a feeling this will be a work in progress. </p>
      <p>Thanks,<br>
      K.</p>
      <p>Measuring my success</p>
      <p>On message<br>
      Do I edit and design with an eye to clarity, accuracy and unity of message? Are my designs consistent with University branding and visually compelling for the target audience? </p>
      <p>Are my designs clear and readable? Do they contribute to or hinder the reader’s ability to find answers and information? Does the publication’s design/language fit its intended purpose?</p>
      <p>Are my writing, editing and designs up to the standard of excellence the University wishes to project?</p>
      <p>Accuracy<br>
      Do my publications contain errors and typos? How many? What (if any) impact do my errors have, financially or otherwise? Have I done my best to ensure accuracy? </p>
      <p>Adaptability and responsiveness<br>
      Am I flexible and able to adapt to new/changing technology, methods, and target audiences as required, and within reason? Do I set reasonable limits?</p>
      <p>Do I use creativity in solving problems? </p>
      <p>Do I strive to improve? Do I improve? Does my work address/correct issues raised with previous publications? Do I correct my mistakes and take steps to ensure similar errors do not recur?</p>
      <p>Overall contribution<br>
      How am I to work with? Am I flexible (again, within reason) with regards to work schedules and tasks? Do I assist the team or do I hinder? Do I set necessary limits? Do I contribute to the unit’s success?</p>
      <p>Measurement tools (Keeping in mind that opinions will vary.)</p>
      <p>1-End user surveys: recruiters, students, counsellors, graduates, applicants, professors, etc...</p>
      <p>2-Feedback from telephone services, or other front-line services about ease of use, clarity or other questions and comments resulting from the publication’s language/presentation.</p>
      <p>3-Casual feedback from other areas. </p>
      <p>4-Feedback from peer competition events. (I believe K. was submitting the faculty booklets in an award competition of some kind. This kind of response can tell us how we measure up against our peers, whether others in the industry think we’re doing a good job or not.)</p>
      <p>5-Self and peer evaluations.</p>
      <p>6-Checking admission statistics against the unit’s target areas for adjustments to be made in the future. (What has or has not had an impact, where do we direct our efforts?)</p>
