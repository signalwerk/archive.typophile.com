    <p>Hi,</p>
    <p>My unit (publications) is participating in a University-wide endeavour to measure success. In short what this means to me is that I have to provide my supervisor with the criteria by which he is to measure my personal success, as well as suggestions on how to measure the success of our unit as a whole.</p>
    <p>So I'm wondering how you all are measured or evaluated in your jobs. What elements are taken into consideration? It would be most useful for me to hear from people who hold editing/proofreading and page layout positions. Obviously, certain factors will be company-specific (ensuring that the success is in line with company goals), but what else? Is your performance evaluated based on how correct the publications are? How many typos slip by? What about measuring success at being creative? </p>
    <p>Any input would be appreciated!</p>
    <p>Thanks,<br>
    Kristina</p>
