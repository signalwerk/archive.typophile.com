      <p>Not true! I will gladly use time I should be using for making graphs of psychological-test data ;) I work at a University and there is, as far as I know, no performance reviews. I do, however, work on a contract basis so have to keep reapplying for my job year after year, so I would imagine that if I sucked then I wouldn't get rehired. </p>
      <p>I tend to measure my own success by whether the client is satisfied with their job, if it's delivered on time and if it's something that looks professional, is a bit special and functions well, vague huh. I am annoyed if I take too much time for a job that should be done more quickly, I am even more annoyed if I take more time and the result still sucks. I worry that sometimes jobs I would like to (and need to) be giving more attention to suffer because of other more pressing (but ultimately less important) jobs that monopolise time. </p>
      <p>My employer probably mostly emphasises time = money and likes to see things done efficiently but she also appreciates that good design/typesetting/editing takes time and is not overbearing about the former but gently (thank God) reminding of my real world obligations. She is also very encouraging about design that she appreciates which usually matches my own tastes.<br>
      hope this helps</p>
      <p>--N</p>
