      <p>Did someone from the business school come up with this slogan? Sounds like MBA-buzzword-BS to me...</p>
      <p><em>if I don’t provide the guidelines by which to assess my success, someone else will, and it may be along the lines of x number of mistakes gets me canned.</em></p>
      <p>"x number of mistakes" is not a measure of success: it's a measure of failure. Héctor is entirely correct: measuring success depends entirely upon setting goals and achieving them. Goals, according to standard MBA-buzzword-BS criteria, must be...</p>
      <ul>
      <li>
      specific;</li>
      <li>measurable; and</li>
      <li>attainable.</li>
      </ul>
      <p>Each project is different; each project has different goals. Ideally, the person who hands you the project should draw up his or her OWN list of goals, and your success should be measured against how well you do or don't achieve THOSE goals. If you don't have a clear idea of what you're supposed to accomplish in the first place, you shouldn't be held accountable if the end product doesn't meet (or <em>exceed</em>, to continue the buzzword-BS argument) the requisitioner's expectations.</p>
      <p>Of course, this approach requires extra work from the people who want work from you, and it requires that their goals meet the criteria listed above. Chances are, even if you were to institute this regimen, you would have a difficult time getting complete, accurate and realistic information from your internal clients...which is why I said, at first, that it sounds like MBA-buzzword-BS to me...lofty, commendable, proactive, but basically marketing hype, and nothing else.</p>
