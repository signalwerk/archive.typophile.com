      <p>As a freelancer, my clients evaluate me on how quick I do it and how much the print shop charges them -- they usually trust me to "do it right" already.  If I get the job done on schedule and make their print shop bill as small as possible, they come back.  If not, not.</p>
      <p>My accountant gives me a performance review -- if I'm making more money than I'm spending, I'm "successful." :-)</p>
      <p>In your case, I'd be excessively wary of standards like "make x typos and you're sacked" -- if you've got the job, it's because you passed their editorial test before they hired you, and it's a moot point (we all make mistakes sometime -- we're human!).  I suspect things like cost control and "customer service" are much more important (to them) measures.</p>
      <p>Linda</p>
