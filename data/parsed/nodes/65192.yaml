      <p><em>Do you consider the monospaced Courier to be unprofessional?</em></p>
      <p>No, he just means a version that is already optically spaced.<br>
      Henning is looking for a version of courier that is <em>not</em> monosapced, but has the <em>same</em> outlines.</p>
      <p><em>It will only look queer otherwise, imho.</em></p>
      <p>That may be, but that may also be intended.</p>
      <p>—</p>
      <p>Might I add, intentional distortion of typographic rules is not ignorance. Is it simply unimaginable that someone might want to make something difficult, ugly, etc? After all type designers are often keen on distressed fonts, with their neurotic predetermined 'mess'. Small piles of mess neatly arranged.</p>
