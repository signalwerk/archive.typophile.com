      <p>You could try the <a href="http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=3" rel="nofollow">Hermes family</a> from Optimo.ch, it looks a lot like ahttp://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=21 proportional Courier, but it doesn't *look* proportional. Also, there's Optimo <a href="http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=21" rel="nofollow">Executive</a>, which is more of a fauxnospaced sans.</p>
      <p>Both keep a certain monospace-edgyness to the text, interestingly. Of course you lose the effect of a true monospace, and quite frankly why one would want to have some of the disadvantages of a mono without going the whole hog is a mystery to me, but whatever floats your boat.</p>
      <p>hope that helps<br>
      Kai</p>
      <p>Edith: fixed link tag</p>
