    html: |-
      <p>Courier is monospace by design, it's not just a matter of re-kerning the letters, you'd have to make a whole new typeface. The letters are designed to have the same width, making the i very wide and the m very tight. I don't really see why you'd want to make courier not monospaced. I'd rather look for typefaces that have simularities in their letterforms but are designed to not be monospaced. It will only look queer otherwise, imho.</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
    html_clean: |-
