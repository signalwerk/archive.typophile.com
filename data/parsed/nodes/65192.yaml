      <p>Thanks everyone for your input. </p>
      <p>What I am really looking for is a courier with the outlines and forms of a courier. @ altaira: I definetly want those long serif on i an l. @ Nick Shinn and johnbutler: I want a professionally spaced and kerned font. Setting texts in courier and than spacing and kerning - no way, I have done that but no more!</p>
      <p>So if anyone knows of an actual version of the actual outline forms of a courier with professional spacing and kerning - please.</p>
