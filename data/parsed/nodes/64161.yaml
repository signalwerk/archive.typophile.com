  html: |-
    <p>We have purchased a font to use in InDesign CS4 and Word 2003 and 2007.<br>
    The font is Truetype and doesn't include specially made superscript-characters. </p>
    <p>Word has has the option to set font manually to a different styles like Italic, Bold, Smallcaps and Superscript. The problem is that Superscript doesn't work in fontsizes 7 / 7,5 / 9 / 9,5.</p>
    <p>Any suggestions how to solve it or what could be the problem? The font itself is okay, and Word works okay in rendering every other font that I use.</p>
