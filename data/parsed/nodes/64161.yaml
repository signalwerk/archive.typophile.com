    votes: null
    html: |-
      <p>Ok, I could mend it by changing the values of ySuperscript XSize and YSize in the OS/2 Positions table, which were very low (at ca. 20% of the Em Square).<br>
      It seems that Word (at certain font sizes?) looks at these values and uses them when they are lower than its own built-in reduction ratios for extrapolated superscripts.</p>
      <p>It seems that hardly any fontmaker cares about these values since they seem to be ignored by modern software - but apparently not by all and under all circumstances.</p>
      <p>Please contact your font vendor if you cannot - or aren't allowed to - fix that yourself. </p>
      <p>Andreas</p>
