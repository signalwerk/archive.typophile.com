    <p>Okay...I found this forum through googling for an answer to a random font question, and I’m hoping you font experts will be able to help me.  It’s kind of a random question.</p>
    <p>I’m the IT Mgr in my office, which is an office of Windows users.  We have 1 Mac user who works remotely.  He is running Win XP on his Mac, in order to run the software our company uses - namely, Lotus Freelance Graphics.  We do a lot of presentations with graphs of data, and we’ve found Freelance to be superior in that department. So even though the program was discontinued in 1999 or 2000, we still use it and have no trouble with it on XP Pro and Win2K machines. </p>
    <p>Recently, this Mac user brought to my attention that he had to change the fonts on every page of a presentation because the Freelance font engine is outdated, and when he opened the file on his Mac (running Windows), things got screwy.  However, our presentation template uses Arial. Not Arial MT, or Arial Black, plain Arial. Which I would think would have no problem across platforms.  And furthermore, we open presentations on tons of PCs — home computers, laptops, work computers, etc...and never had to change fonts on any windows-based machine.</p>
    <p>My question is: is it the font engine as my user stated, or is it a windows-on-mac issue?</p>
    <p>I don’t know anything about running Windows on a Mac, and how that affects fonts. And since Freelance is so outdated, it’s hard to find info online about that specific program.  </p>
    <p>I don’t know anything about font engines either...so any help you can provide will be much appreciated! My boss is anxiously awaiting my response. </p>
    <p>Thank you!</p>
