    html: <p>There are two ways to use Windows on a Mac -one is to use bootcamp and set up a dual boot system. This would be the safest option. The other is to run Parallels or similar virtualization software that lets you run Windows in a window on the Mac - I’d guess this is more risky. My gut instinct is that the problem relates to the fonts installed and how Lotus enumerates them, my guess is that it’s tripping over font conflicts related to the Mac fonts. That might be as simple as the user copying the Mac fonts over and installing them on the Windows side.</p>
