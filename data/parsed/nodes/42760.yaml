      <p>Mark is correct. Windows is windows. It has no concept of the OSX environment it’s running in. The only thing it can recognize are ’shared’ folders that Parallels creates. It ’tricks’ Windows into seeing a folder on your OSX install as a shared drive within windows.</p>
      <p>So, yea, if you want to use fonts in windows, you need to install them *in* windows.</p>
