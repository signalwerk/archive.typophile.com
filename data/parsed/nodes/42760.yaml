    html: <p>I don’t think Windows (or any other OS) running in Parallels has any access to the host OS or resources like fonts. It’s not like Classic running on OS X. Parallels virtualizes the PC hardware, not the software running on it. You can access files from the host system, but the host system appears to the virtual machine as just another computer on the network.</p>
