    <p>I'm having a hard time understanding a way to create a rounded corner on the inside of the lettter N (and also on A, etc). I've created a rounded corner on all the 90 degree edges. What's the "system" for creating reproducable rounded corners? Do I just eye it? Or can I use a system so I can reproduce this consistently across letters?</p>
    <p>Peek at the "E" and "L", I'd like to be consistent with these letters...</p>
    <p>Designing a face for a network...</p>
