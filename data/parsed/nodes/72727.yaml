    html: |-
      <p>I would suggest you have a look at the way various rounded faces have done this, identify the principles (internal design vocabulary/logic/strategies) which they have used, and then go about implementing a strategy of your own.</p>
      <p><em>we're actually trying to create a face that's a little like a cross between din next and gotham rounded.</em></p>
      <p>That doesn't sound like a very inspired brief.<br>
      Maybe all you need do is just:<br>
      1. Draw a monoline skeletal path.<br>
      2. Apply "Make Parallel Path..." (This step provides a bit more control).<br>
      3. Apply "Expand Path..."</p>
      <p>However, looking at what you've done so far, you appear to be a little out of your depth, in terms of your experience in type design, to be comparing your project with DIN and Gotham. I don't know who your client is and what their expectations are, and I wouldn't want to find fault with anyone for wanting to tackle a project themselves (it's the only way to learn), but this may not be the right time and place for that approach, and you may be better off to hire someone with more experience to do this.</p>
      <p>I would imagine your face will turn out like this novice design:<br>
      <a href="http://typophile.com/node/50437" title="http://typophile.com/node/50437">http://typophile.com/node/50437</a><br>
      It's nice, but with a naive quality, and there are limitations to heavier weights, which require considerably more drawing/design skills.</p>
