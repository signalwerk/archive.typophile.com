    <p>hey guys</p>
    <p>i am currently working on my new website. i have made quite some progress over the last few days (ehm... nights ;-) ) . however, yesterday I was showing the page to my girlfriend (she doesn’t study design - a fact that imho makes her conclusion even more credible for that she is not a pro but a user) and her sister and they both agreed, that the type is just too small. now I have my mac-screen set to 1680x1050 (20inch) and I didn’t get the feeling it’s too small - it looked just fine. I mean, when you have a resolution of “only” 1024 then it’s even bigger. so maybe it’s just me, you get used to even the worst design blunders, when you sit on your project for too long. I am well aware of the fact, that my chosen font (American Typewriter) is not an ultra font.</p>
    <p>what do you experts think - is it readable or too small? - in my screenshot I’ve also tried Frutiger 55. My beef with Frutiger is that I do like the font a lot for signs or airport boards but for my website I get the feeling it might be to “simplistic.”</p>
    <p>cheers,<br>
    jan</p>
