    html: |-
      <p>You have to remember that everyone has different resolution screens.</p>
      <p>If you’re making the site as HTML text (as you should, IMHO) then I’d stick with 10px type at a minimum, and expect some folks (like me) to probably adjust the type size larger.</p>
      <p>If it’s all flash, then definitely aim for something even bigger, as there’s no way for an end user to easily enlarge type set in Flash...and that will cause a chunk of your audience to just not bother reading the site.</p>
