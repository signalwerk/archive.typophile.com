    html: |-
      <p>If you are making it in Html increase the fontsize to at least 11px/pt for serif typefaces  (georgia is recommended) and 10 px/pt for sans typefaces (verdana).<br>
      The antialiasing of the typefaces is a problem if you have not restricted the design to follow a pixel grid. If you are working in Adobe illustrator CS3 (you can specify when creating a new document) that the resolution is 72dpi and pixel preview. Go into the preferences and create a grid 10px by 10px with 10 subdivisions. Make it snap to grid  (The clue here is to always think in pixels even with type (size and leading). If you do this it should solve the problem. Do this also if you are creating images of the text and save for web directly from illustrator (Make sure you create a background box which is exactly the documentsize and aligned to the artboard).</p>
