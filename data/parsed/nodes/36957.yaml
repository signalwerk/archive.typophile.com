      <p>Well, I’m looking at it on 1280x1024, and I would say that on my res it is not too small <em>an sich</em>, however it is too small for the typeface. The serifs clutter.<br>
      So I would say if you want American Typewriter, increase the size. If you don’t wan’t to increase the size, pick a good sans serif that can be used small <em>on screen</em>.</p>
