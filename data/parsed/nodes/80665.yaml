      <p>That's a bit odd considering that Illustrator has InDesign's multi-line composer and supports multiple pages. Surely a brochure is an appropriate task for it, if anything is.</p>
      <p>Freehand was perfect for jobs like these. How Adobe hasn't caught up to where Freehand was in 2001 – especially considering they own it – is a mystery.</p>
