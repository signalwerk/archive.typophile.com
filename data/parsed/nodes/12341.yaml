    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: Lanston Type&nbsp;Co.</strong></p>
    <p>Lanston Type’s rich history dates back to 1887 when <a href="/node/add/wiki?edit%5Btitle%5D=Tolbert%20Lanston" title="Create node &quot;Tolbert Lanston&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tolbert Lanston</a> received his first patent for a mechanical typesetting device. Later refinements led to the Monotype casting machine and the emergence of the Lanston Monotype Company as one of the most renowned type supply companies in the world. The <a href="/node/add/wiki?edit%5Btitle%5D=Monotype%20caster" title="Create node &quot;Monotype caster&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype caster</a> was revolutionary and along with other automated typesetting machines helped to usher in a new age of printing technology. Typesetting had, until this time, remained the same as <a href="/node/add/wiki?edit%5Btitle%5D=Gutenberg" title="Create node &quot;Gutenberg&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gutenberg</a>’s first hand-set movable&nbsp;type.</p>
    <p>In the late 1800s, Tolbert Lanston licensed his technology to an English sister company and became a major international force. Lanston grew rapidly with America’s pre-eminent type designer, Frederic Goudy, holding the position of art director from 1920-1947. The Philadelphia-based Lanston Monotype eventually parted ways with its English counterpart. English Monotype became simply known as <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a> from that time forth. Lanston was acquired by <a href="/node/13552" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">American Type Founders</a> in 1969. After a series of other owners, the company found its way to master printer <a href="/node/12138" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gerald Giampa</a>, who moved it to Prince Edward Island in 1988. During its time of transition, Lanston continued supplying the American market for monotype hot metal type needs until January 21, 2000, when the majority of Lanston’s machinery and historical records were tragically destroyed by a tidal&nbsp;wave.</p>
    <p>Giampa was one of the earliest developers of PostScript fonts. After the loss, he focused on digitization to an even greater extent. Under his stewardship, Lanston’s classic faces were digitized in a style that was true to the sources, which are the brass and lead patterns from which the metal type was made. The past few years have seen Giampa and Lanston travel from Canada to Finland, and back again. In late 2004, Lanston has completed another journey back to the United States to come under the care of a new steward: <a href="/node/12106" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">P22</span> type foundry</a>. Giampa is answering the call of the sea. He has traded his type founder’s hat for that of a ship’s captain to sail the northern Pacific coast. During his shore leaves, Giampa continues to act as typographic consultant to Lanston-<span class="caps">P22</span>. </p>
    <p>Lanston Type continues its hundred-plus year tradition of supplying quality type for discerning users. Now under the <span class="caps">P22</span> type foundry family of font collections, Lanston-<span class="caps">P22</span> will present many of the famous type designs of <a href="/node/add/wiki?edit%5Btitle%5D=Frederic%20Goudy" title="Create node &quot;Frederic Goudy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Frederic Goudy</a> and <a href="/node/29640" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sol Hess</a> as well as typographic classics that every designer should have in their library such as the <a href="/node/33638" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bodoni</a> and <a href="/node/12782" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Caslon</a> families. Periodic releases will be announced along with introductory special pricing. Lanston-<span class="caps">P22</span> reaffirms its dedication to the work of Lanston’s most famous type director; Frederic Goudy with eventual release of all of the Goudy faces based on the most authentic surviving sources. Many of the Lanston digital faces were digitized from the actual metal patterns which were used to make the master punches from which the type was originally cast. The addition of <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> will allow for expanded font character sets as well as alternates and ligatures. The historical focus of the <span class="caps">P22</span> font collections and the colorful history of the Lanston Monotype company offer a combined resource suitable for a wide variety of design&nbsp;solutions. </p>
    <p><a href="http://www.p22.com/Lanston/">http://www.p22.com/Lanston/</a></p>
