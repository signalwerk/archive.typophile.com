    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Lanston Type Co.</strong></p>
    <p>Lanston Type's rich history dates back to 1887 when <a href="/wiki/Tolbert%20Lanston" class="freelinking" rel="nofollow">Tolbert Lanston</a> received his first patent for a mechanical typesetting device. Later refinements led to the Monotype casting machine and the emergence of the Lanston Monotype Company as one of the most renowned type supply companies in the world. The <a href="/wiki/Monotype%20caster" class="freelinking" rel="nofollow">Monotype caster</a> was revolutionary and along with other automated typesetting machines helped to usher in a new age of printing technology. Typesetting had, until this time, remained the same as <a href="/wiki/Gutenberg" class="freelinking" rel="nofollow">Gutenberg</a>'s first hand-set movable type.</p>
    <p>In the late 1800s, Tolbert Lanston licensed his technology to an English sister company and became a major international force. Lanston grew rapidly with America's pre-eminent type designer, Frederic Goudy, holding the position of art director from 1920-1947. The Philadelphia-based Lanston Monotype eventually parted ways with its English counterpart. English Monotype became simply known as <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a> from that time forth. Lanston was acquired by <a href="/wiki/American%20Type%20Founders" class="freelinking" rel="nofollow">American Type Founders</a> in 1969. After a series of other owners, the company found its way to master printer <a href="/wiki/Gerald%20Giampa" class="freelinking" rel="nofollow">Gerald Giampa</a>, who moved it to Prince Edward Island in 1988. During its time of transition, Lanston continued supplying the American market for monotype hot metal type needs until January 21, 2000, when the majority of Lanston's machinery and historical records were tragically destroyed by a tidal wave.</p>
    <p>Giampa was one of the earliest developers of PostScript fonts. After the loss, he focused on digitization to an even greater extent. Under his stewardship, Lanston's classic faces were digitized in a style that was true to the sources, which are the brass and lead patterns from which the metal type was made. The past few years have seen Giampa and Lanston travel from Canada to Finland, and back again. In late 2004, Lanston has completed another journey back to the United States to come under the care of a new steward: <a href="/wiki/P22" class="freelinking" rel="nofollow">P22 type foundry</a>. Giampa is answering the call of the sea. He has traded his type founder's hat for that of a ship's captain to sail the northern Pacific coast. During his shore leaves, Giampa continues to act as typographic consultant to Lanston-P22. </p>
    <p>Lanston Type continues its hundred-plus year tradition of supplying quality type for discerning users. Now under the P22 type foundry family of font collections, Lanston-P22 will present many of the famous type designs of <a href="/wiki/Frederic%20Goudy" class="freelinking" rel="nofollow">Frederic Goudy</a> and <a href="/wiki/Sol%20Hess" class="freelinking" rel="nofollow">Sol Hess</a> as well as typographic classics that every designer should have in their library such as the <a href="/wiki/Bodoni" class="freelinking" rel="nofollow">Bodoni</a> and <a href="/wiki/Caslon" class="freelinking" rel="nofollow">Caslon</a> families. Periodic releases will be announced along with introductory special pricing. Lanston-P22 reaffirms its dedication to the work of Lanston's most famous type director; Frederic Goudy with eventual release of all of the Goudy faces based on the most authentic surviving sources. Many of the Lanston digital faces were digitized from the actual metal patterns which were used to make the master punches from which the type was originally cast. The addition of <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> will allow for expanded font character sets as well as alternates and ligatures. The historical focus of the P22 font collections and the colorful history of the Lanston Monotype company offer a combined resource suitable for a wide variety of design solutions. </p>
    <p><a href="http://www.p22.com/Lanston/" title="http://www.p22.com/Lanston/">http://www.p22.com/Lanston/</a></p>
