      <p>Thanks for your informed reply, Stephen. There's a chance this is custom, although from what I've seen, there isn't much precedent for using custom fonts in eurogames. I don't think they typically sell well enough to justify the cost of commissioning a custom design; in fact, I often see them using free or very cheap fonts.</p>
      <p>I'm still holding out hope that there is an exact match that is commercially available somewhere. If it turns out that there isn't, I would very much appreciate a pointer to the closest alternative.</p>
