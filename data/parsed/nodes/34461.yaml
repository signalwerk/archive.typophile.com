      <p>After I started this thread, I decided to look up and write the person who did the art for the game, Maura Kalusky. This morning, I got a reply!</p>
      <p>It turns out that the typeface is called Russka, and it was designed by none other than his girlfriend. (Maura Kalusky is male.) It's actually one of two fonts of hers that are used in the <cite>Power Grid</cite> design; the other one is called Waldmeister, and it's used for some of the text elements on the game box.</p>
      <p>According to Mr. Kalusky, Russka "should have some kind of silkscreen aesthetics", while Waldmeister "looks like printing with rubber stamps". Both fonts are available for purchase through him for €50 each.</p>
