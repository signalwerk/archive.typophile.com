    <p>I'm trying to identify the main typeface used in the 2004 German board game <a href="http://www.boardgamegeek.com/game/2651" rel="nofollow"><cite>Power Grid</cite></a>:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Power Grid_4729.png"></div><p></p>
    <p>I've found a few that are fairly close, including <a href="http://www.myfonts.com/fonts/t26/liquorstore/" rel="nofollow">Liquor Store</a>, <a href="http://www.myfonts.com/fonts/marksimonson/refrigerator/" rel="nofollow">Refrigerator</a>, <a href="http://www.myfonts.com/fonts/pizzadude/flim/" rel="nofollow">Flim</a>, and <a href="http://www.myfonts.com/fonts/chank/nicotine/" rel="nofollow">Nicotine</a>, but I'd like to find an exact match if one exists. I haven't found anything that has that distinctive <cite>X</cite>.</p>
    <p>Apologies for the poor scan; the actual type is very clean and not distressed in the least. If it helps, there are some more examples in <a href="http://www.boardgamegeek.com/images/game/2651?tag=Components" rel="nofollow">this photo gallery</a>. <a href="http://www.boardgamegeek.com/image/147429" rel="nofollow">Here</a>'s an image that features the full set of numerals.</p>
