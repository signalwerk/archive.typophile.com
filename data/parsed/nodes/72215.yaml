  html: |-
    <p>Not yet fixed, but very bothering. Firefox tries to provide the CSS line-height as precise as possible with the result of an uneven line height. It rounds up <strong>and</strong> down.</p>
    <ul>
    <li><a href="http://typophile.com/files/Firefox-Leading-Bug.html" rel="nofollow">Firefox-Leading-Bug.html</a></li>
    <li><a href="http://typophile.com/files/Firefox-Leading-Bug.gif" rel="nofollow">Firefox-Leading-Bug.gif</a></li>
    </ul>
    <p><code>&lt;style type="text/css"&gt;&lt;!--<br>
    pre {<br>
    line-height: 0.95em !important;<br>
    font-size: 16px !important;<br>
    font-family: Arial, Helvetica, sans-serif !important;<br>
    }<br>
    --&gt;&lt;/style&gt;</code></p>
