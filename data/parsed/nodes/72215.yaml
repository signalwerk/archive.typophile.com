    html: |-
      <p>@arno:</p>
      <p>It's just a hunch. I'm basing that hunch on how Firefox does rounding elsewhere. For instance, if you set up a horizontal layout with TDs or DIVs all set to percentage widths, it does the same thing...it rounds up AND down to make sure the total = 100%. This is different than other browsers. IE rounds everything up OR down (so you end up short or over). Opera rounds everything down (so you end up short).</p>
      <p>My thought was maybe it's a universal aspect of Firefox so not necessarily easy to change for one particular element (in this case line-spacing).</p>
