    html: |-
      <p>Firefox does this up and down rounding in other places, where it's actually a huge benefit compared to what the other browsers do (namely when dealing with horizontal percentage widths in a flexible container). </p>
      <p>So I can see it being the 'norm' by design.</p>
      <p>That said, I can't see a reason for it remain that way for line spacing. So while it may not be a bug, it really is something that should be looked at and fixed.</p>
