    html: |-
      <p>Subpixel baseline positioning? No, I don’t think, that this has to do with subpixel baseline positioning. 0.95 em are equal tp 15.2 px, if 1 em is 16 px. So, if the font size is 16 px and the line height 0.95 em, Firefox creates a line height of 16 px for every sixth line. And the height of the other lines is 15 px. Dependent from the fraction of em you have different line heights in the same text block. There is no other browser with that bug. I assume, it is a question of minutes to fix that bug! But it is not yet fixed, although it is documented since 2008.</p>
      <p>Again, the problem can also appear, if the unit for the font size is em or any other unit.</p>
