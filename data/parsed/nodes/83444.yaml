    <p>I made this font just over 10 years ago (it's the first and only font I ever made) and I've finally got the courage to dust it off and finish it.</p>
    <p>I know the flourishes need work and my kerning's not too hot either but right now, it's the shape of the letters I'm struggling with. The 'f'. the 'h' and the 'n' have different stroke widths but when you put them together they seem to work but when I look at it again, the 'f' needs to become thicker.</p>
    <p>What do you think?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mrbtonfont_closeup_4354.jpg"></div><p></p>
