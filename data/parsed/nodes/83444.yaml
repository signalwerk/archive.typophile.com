      <p>I decided to stop waffling and have a closer look and my curves are terrible, the letters too different and it's not even closed to becoming polished so I'm ignoring everything but my letter shapes.  This was made with a broken mapping pen and I wanted to have each letter a little different but I'm changing my mind as I go along.</p>
