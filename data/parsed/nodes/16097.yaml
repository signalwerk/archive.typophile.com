      <p>Actually, <a href="http://www.fontshop.com/showfont.cfm?fid=FF.10001.0.0" rel="nofollow">FF Dax Condensed</a> is about the same width as <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11416.0.0" rel="nofollow">FF Dax Compact</a>. The main difference is the latter has...</p>
      <p>"relatively small ascenders and descenders and the uppercase letters have the same height as the lowercase ascenders. This makes the typeface optically larger -- useful for headlines and posters where words must shout." - Hans Reichel</p>
