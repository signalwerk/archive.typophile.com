    html: |-
      <p>Typically the terms compact and compressed refer to a width narrower than condensed.  This width is almost always used only for large display sizes. Condensed can be used (in small doses) for text.<br>
      From what Stephen says, I infer that FF is using the compact description to indicate that it is a headline font.</p>
      <p>ChrisL</p>
