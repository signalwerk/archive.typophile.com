    <p>I've tried enhancing the image and splitting up the letters to run it through a font recognition site.  I've also tried searching manually.</p>
    <p>The key factors I was using to try and identify this font are the slight right slant, extended crossing to the lowercase 't', and how the 'n' is written with spaced out "humps".</p>
    <p>Any help would be greatly appriciated!</p>
    <p>Thanks,<br>
    -Will</p>
