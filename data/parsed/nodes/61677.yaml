  html: |-
    <p>hi all,</p>
    <p>I have an InDesign question I hope somebody can help with. I have a document with numerous statements such as:</p>
    <p>"To select, press s2."</p>
    <p>"s2" refers to a button, and I would like to represent that with a custom image or glyph which is not part of the font. The only way I know now is to create the artwork in Illustrator and manually place it. You can imagine with many instances this might become prohibitively cumbersome.</p>
    <p>Is there a process for enabling this custom glyph to flow with the copy in some automated way (rather than manually placing a separate piece of artwork)? I know for example, that I can do a find and replace with "s2" and a glyph - BUT that glyph is part of the font. I want the glyph to be independent of the font in the sense that "s2" should be represented by the same image regardless of whether the copy is set in Helvetica, Futura, etc.</p>
    <p>thanks much,<br>
    jarrod</p>
