    html: |-
      <p>The first solution that comes to mind is (if you manage to insert your glyph into a font*) to use the "More Options" in the "Find/Change" panel to set the desired font using the "Format" panel of the target glyph.</p>
      <p>* Maybe you’re able to draw it with Fontstruct?</p>
