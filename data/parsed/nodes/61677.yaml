    html: <p>That last tip is really hot, I remember it made for instance the setting of long flowing paragraps of music reviews a lot easier in a magazine I did ... the cover art just flowed with the formatting of the rest of the text. Also, I believe InDesign has a way to create ome sort of "library" of symbols (images etc) you can have open as a toolbar and insert freely. So there are many ways around this. Remeber you may have to format the inserted image with the appropriate line spacing etc, like text.</p>
