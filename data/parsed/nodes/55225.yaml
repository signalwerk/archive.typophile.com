      <p>///////////////////////////////////////////////////////////////////////////<br>
    SUDTIPOS. 02.09 NEW RELEASES. <strong><a href="http://sudtipos.com/fonts/117">Aladin</a></strong>, <strong><a href="http://sudtipos.com/fonts/118">Uplink</a></strong>  &amp; <strong><a href="http://new.myfonts.com/package/316829/">The Amazonian Pack</a></strong><br>
    ///////////////////////////////////////////////////////////////////////////</p>
    <p>We are proud to announce the release of two new fonts and the addition of the Amazonian pack designed by awarded-designer from Venezuela John Moore.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/aladinuplink_6732.jpg"></div><br>
    <strong><a href="http://sudtipos.com/fonts/117">Aladin</a></strong> is a calligraphic art deco face with an eastern touch, designed by Angel Koziupa and produced by Alejandro Paul. Casual, airy counters and friendly terminals give it an advantage as a packaging font for exotic coffees and teas. It also serves quite well on posters and book jackets where relaying the famous sense of eastern hospitality and playfulness is a must.<p></p>
    <p><strong><a href="http://sudtipos.com/fonts/118">Uplink</a></strong> is decorative upright lettering with heavy calligraphic influences and clear friendly forms. Alternate forms with artificial  "tail" connections, swashing their way from one letter across the vertical stroke of the next, add an unusual yet distinctly human  detail to the forms that shape the words. Uplink's reserved humor can be a little tolerant of mechanical abuses like shearing or stretching, which makes it ideal for food product packaging design.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/amazonian_6480.jpg"></div><br>
    <strong><a href="http://new.myfonts.com/package/316829/">Amazonian Pack</a></strong> is an incredible set of exotic sources; Makiritare is inspired by the craftsmanship of an ethnic baskets. Tepuy is a round font created to compose a new form and as the Makiritare comes in two weights Light and Regular. Palaima is a fonts with unusual architectural round strokes. To complete the set you found a pictorial font, Precolumbino, that contains an interesting collection of pre-Columbian petroglyphs from the jungle in the Amazon.<p></p>
