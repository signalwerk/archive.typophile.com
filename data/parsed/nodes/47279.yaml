    <p>Hi all</p>
    <p>I have made a logo for a client. The name of the client is within the PDF, so they aren’t finding this thread while googling their name... </p>
    <p>I have tried several ideas, but I think this idea is good. The initials of the name is made as ice cream balls like <a href="https://web.archive.org/web/20080905032653/http://www.mylilypads.com/images/products/me-bath-ice-cream.jpg" title="http://www.mylilypads.com/images/products/me-bath-ice-cream.jpg">http://www.mylilypads.com/images/products/me-bath-ice-cream.jpg</a> ...</p>
    <p>Do you guys have any other ideas how to make this logo???</p>
