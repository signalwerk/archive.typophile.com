      <p>Hmm, now that I see them together, it looks like Ingrid is only similar. Upon further looking in the Script Guide, I think this is a Casaday &amp; Greene font called Gazelle (a.k.a. Gaze). See the attached image, which is rather fuzzy quality. I can see why you may think it is hand-drawn, but don't you think those r's are awfully like each other, to the point of being identical?</p>
      <p>- Mike Yanega</p><div class="imageWrap"><img src="http://typophile.com/files/GazelleC_5982.gif"></div><p></p>
    html_clean: |-
