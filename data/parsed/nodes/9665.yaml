  html: <p>I'm currently working on a project for uni about the change in society and the existance of class systems in the UK. I've created maps, that are just simple line drawings that have become more intricate as I delved into looking at town layouts from a hundred years ago. (Upper class houses being built on crescents and working class on terraced streets etc.) I've created grids from this map to layout information from the census and at the moment it all looks very plain and straight forward.  <br>Does anyone have any recommendations as to other information graphic designers that could be useful in helping me kicking start my creativity again?  <br> <br>I've tried to look at Edward Tufty books from uni but there always on loan, I've also looked at Jan Tschichold for layout ideas and taken some of his principles. Any help would be greatly appreciated. <br> <br>Bec</p>
