    html: "<p>Otto Neurath worked in the 20ies and 30ies on information graphics that aimed at social change through education. he wasn't a graphic designer but an economist and worked with Gerd Arntz, a graphic designer. together they developed an astonishing system to show connections between for example living conditions in various districts and infant mortality in a clear and even for illiterate people understandable way. <br> <br>at which university do you study? a reasonable part of neuraths archive was given to the reading university - perhaps you could take a look (although i've heard the archive is quite a mess!) <br>i suppose his work is a must for your topic. <br> <br>here is another example, taken from this book: <br><a href=\"http://www.neurath.at/pdf/bildersprache.pdf\" target=\"_blank\">http://www.neurath.at/pdf/bildersprache.pdf</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/67294.gif\" alt=\"\"></p>"
