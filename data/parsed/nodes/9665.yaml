    html: <p><i>any recommendations as to other information graphic designers</i> <br> <br>You might consider <i>The Semiology of Graphics</i> by Jacques Bertin, translated into English by William J. Berg, Published by University of Wisconsin Press 1983. <br> <br>It provides some great theoretical underpinning for determining which kinds of graphical expression to use to express certain kinds of information. Awesome for MAPS with DATA. <br> <br><i>...and at the moment it all looks very plain and straight forward.</i> <br> <br>Which is <b>exactly</b> what you want to strive for. Restraint and clarity. Express different things with the smallest amount of perceptible difference. Don't try to go too far. Don't buy into the myth of instantly understood. Especially if the information that you are expressing is is a  complex dependent network of variables. Even those kinds of graphics that we imagine are instantly understood take cognitive skill and time to process, and some kinds of information just require some careful attention no matter what. <br> <br>Work-a-day mundane communications are critical tools. In our media saturated western cultures we tend to ignore their importance. It's also easy to worry that our plain and clear graphics will be glossed over or ignored in the visual maelstorm of hype and excess. <br> <br>I believe (and it's been my experience) that simple clear statements done with taste and restraint are far more effective than a hypodermic needle full of visual heroin. <br> <br>When people need information they <i>always</i> stop on the things that are clear and calm. <br> <br>Stay with simple open type for your labelling and legends. Stay with quiet colours and a limited pallette. The map should be a background providing just enough visual cue to locate the data geographically but no more. <br> <br>This will hold true no matter the media or presentation context. <br> <br>I hope this helps. <br> <br>Jon</p>
    html_clean: <p><i>any recommendations as to other information graphic designers</i> <br> <br>You might consider <i>The Semiology of Graphics</i> by Jacques Bertin, translated into English by William J. Berg, Published by University of Wisconsin Press 1983. <br> <br>It provides some great theoretical underpinning for determining which kinds of graphical expression to use to express certain kinds of information. Awesome for MAPS with DATA. <br> <br><i>...and at the moment it all looks very plain and straight forward.</i> <br> <br>Which is <b>exactly</b> what you want to strive for. Restraint and clarity. Express different things with the smallest amount of perceptible difference. Don't try to go too far. Don't buy into the myth of instantly understood. Especially if the information that you are expressing is is a  complex dependent network of variables. Even those kinds of graphics that we imagine are instantly understood take cognitive skill and time to process, and some kinds of information just require some careful attention no matter what. <br> <br>Work-a-day mundane communications are critical tools. In our media saturated western cultures we tend to ignore their importance. It's also easy to worry that our plain and clear graphics will be glossed over or ignored in the visual maelstorm of hype and excess. <br> <br>I believe (and it's been my experience) that simple clear statements done with taste and restraint are far more effective than a hypodermic needle full of visual heroin. <br> <br>When people need information they <i>always</i> stop on the things that are clear and calm. <br> <br>Stay with simple open type for your labelling and legends. Stay with quiet colours and a limited pallette. The map should be a background providing just enough visual cue to locate the data geographically but no more. <br> <br>This will hold true no matter the media or presentation context. <br> <br>I hope this helps. <br> <br>Jon</p>
