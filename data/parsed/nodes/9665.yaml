    html: <p>A lot of the design in information graphics is to provide the reader with information that is consistent, accessible and digestible. In other words, if it looks plain and straightforward that is probably a good thing, especially combining maps and census information. What is the final objective � is it going to be a printed document, model, web design or whatever? <br>Tim</p>
