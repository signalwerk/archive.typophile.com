    <p>I am struggling with the uppercase in this slab serif. But the lowercase has been refined the most. Check out the oblique lower case. The body is messed up due to fontographer not publishing my kerning pairs.<br>
    I was influenced by Nevelle Brody's Insignia, a little bit of Gill Sans, and a hint of Herbert Bayer's universal alphabet.<br>
    Any feedback would be helpful.<br>
    Thank you,<br>
    Terrance</p><div class="imageWrap"><img src="http://typophile.com/files/wholeset.png"></div><div class="imageWrap"><img src="http://typophile.com/files/caps1.png"></div><div class="imageWrap"><img src="http://typophile.com/files/caps2.png"></div><div class="imageWrap"><img src="http://typophile.com/files/caps3.png"></div><div class="imageWrap"><img src="http://typophile.com/files/oblique.png"></div><div class="imageWrap"><img src="http://typophile.com/files/body.png"></div><p></p>
