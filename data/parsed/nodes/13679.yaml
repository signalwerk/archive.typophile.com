    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Type%20Technologies" class="freelinking" rel="nofollow">Type Technologies</a> : TrueType</strong></p>
    <p>TrueType is a digital <a href="/wiki/type%20technology" class="freelinking" rel="nofollow">type technology</a> originaly developed by <a href="/wiki/Sampo%20Kaasila" class="freelinking" rel="nofollow">Sampo Kaasila</a> of <a href="/wiki/Apple" class="freelinking" rel="nofollow">Apple, Ink</a>, whose remit was to create a custom technology so as to avoid paying royalty fees to use font technologies developed by other parties, as well as to solve some technical limitations of <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe's</a> <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> based <a href="/wiki/Type%201" class="freelinking" rel="nofollow">Type 1</a> font format. TrueType differs from Type 1 in that it uses <a href="/wiki/quadratic%20beziers" class="freelinking" rel="nofollow">quadratic</a> as opposed to <a href="/wiki/cubic%20beziers" class="freelinking" rel="nofollow">cubic</a> <a href="/wiki/bezier%20curves" class="freelinking" rel="nofollow">bezier curves</a>. TrueType excels at on-screen rendering due to the fact that it can support sophisticated <a href="/wiki/hinting" class="freelinking" rel="nofollow">hinting</a> instructions. The technology was cross-licensed with a <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a> replacement for <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> called <a href="/wiki/TrueImage" class="freelinking" rel="nofollow">TrueImage</a>, but today only TrueType survives. A few years later the format was extended to support <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> and more complex linguistic and typographic behaviours such as automatic ligature substitution and Indic vowel rearrangement. However the new extensions, called <a href="/wiki/AAT" class="freelinking" rel="nofollow">AAT</a> (Apple Advanced Typography), were not licensed to Microsoft, who then set about creating their own extensions to TrueType (along with <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>), which they called <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a>. The two extensions are incompatible and whilst their feature sets overlap, there are many things that one can do which is impossible with the other.</p>
    <p>For other articles on TrueType, see:<br>
    * <a href="http://www.microsoft.com/typography/WhatIsTrueType.mspx" title="http://www.microsoft.com/typography/WhatIsTrueType.mspx">http://www.microsoft.com/typography/WhatIsTrueType.mspx</a><br>
    * <a href="http://www.microsoft.com/typography/TrueTypeFonts.mspx" title="http://www.microsoft.com/typography/TrueTypeFonts.mspx">http://www.microsoft.com/typography/TrueTypeFonts.mspx</a><br>
    * <a href="http://www.microsoft.com/typography/TrueTypeHistory.mspx" title="http://www.microsoft.com/typography/TrueTypeHistory.mspx">http://www.microsoft.com/typography/TrueTypeHistory.mspx</a><br>
    * <a href="http://developer.apple.com/fonts/TTRefMan/" title="http://developer.apple.com/fonts/TTRefMan/">http://developer.apple.com/fonts/TTRefMan/</a></p>
