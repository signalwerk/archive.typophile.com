    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/13082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Technologies</a>&nbsp;:&nbsp;TrueType</strong></p>
    <p>TrueType is a digital <a href="/node/16842" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Technology</a> originaly developed by <a href="/node/13970" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sampo Kaasila</a> of <a href="/node/add/wiki?edit%5Btitle%5D=Apple" title="Create node &quot;Apple&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Apple, Ink</a>, whose remit was to create a custom technology so as to avoid paying royalty fees to use font technologies developed by other parties, as well as to solve some technical limitations of <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe’s</a> <a href="/node/14482" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">PostScript</a> based <a href="/node/add/wiki?edit%5Btitle%5D=Type%201" title="Create node &quot;Type 1&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type 1</a> font format. TrueType differs from Type 1 in that it uses <a href="/node/add/wiki?edit%5Btitle%5D=quadratic%20beziers" title="Create node &quot;quadratic beziers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">quadratic</a> as opposed to <a href="/node/add/wiki?edit%5Btitle%5D=cubic%20beziers" title="Create node &quot;cubic beziers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">cubic</a> <a href="/node/13680" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">bezier curves</a>. TrueType excels at on-screen rendering due to the fact that it can support sophisticated <a href="/node/13964" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">hinting</a> instructions. The technology was cross-licensed with a <a href="/node/20191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Microsoft</a> replacement for <a href="/node/14482" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">PostScript</a> called <a href="/node/add/wiki?edit%5Btitle%5D=TrueImage" title="Create node &quot;TrueImage&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TrueImage</a>, but today only TrueType survives. A few years later the format was extended to support <a href="/node/12237" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Unicode</a> and more complex linguistic and typographic behaviours such as automatic ligature substitution and Indic vowel rearrangement. However the new extensions, called <a href="/node/add/wiki?edit%5Btitle%5D=AAT" title="Create node &quot;AAT&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">AAT</span></a> (Apple Advanced Typography), were not licensed to Microsoft, who then set about creating their own extensions to TrueType (along with <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a>), which they called <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a>. The two extensions are incompatible and whilst their feature sets overlap, there are many things that one can do which is impossible with the&nbsp;other.</p>
    <p>For other articles on TrueType, see:<br>
    * <a href="http://www.microsoft.com/typography/WhatIsTrueType.mspx">http://www.microsoft.com/typography/WhatIsTrueType.mspx</a><br>
    * <a href="http://www.microsoft.com/typography/TrueTypeFonts.mspx">http://www.microsoft.com/typography/TrueTypeFonts.mspx</a><br>
    * <a href="http://www.microsoft.com/typography/TrueTypeHistory.mspx">http://www.microsoft.com/typography/TrueTypeHistory.mspx</a><br>
    * <a href="http://developer.apple.com/fonts/TTRefMan/">http://developer.apple.com/fonts/<span class="caps">TTR</span>efMan/</a></p>
