    votes: 0
    html: |-
      <p>James: Thank you very much. Because I feel this sits somewhere a basic display set and wildly over-themed decorative face, I was really not sure what sort of reaction it would get. After the pdbq set, which I love, my personal faves are the g, m and 0.</p>
      <p>The 'a'which connects wherever it looks better, was quite a challenge. If I knew how much work it would be to make it behave, I probably would have skipped the hundreds of manual kerns it required. Now that it is done I tihnk it may now be the most subtle quality offered.</p>
      <p>The sliced variant is my favorite too! To get the effect I used Adam's fontlab filters to do vertical slices (after rotating) and then hand snipped and Tweak. Lots of zooming involved.</p>
      <p>I found it was impossible to get the slices to look good at both large and small sizes, so I went with "big". One goal was to make sure it held up on the same page as Carved, Celerite or other heavier fonts.</p>
      <p>Eben:<br>
      My original vision was large, busting off the page, tight spaced applications, like titling for posters and such. Since developing !Lestatic: Specimens, I am most currently fond of the treatment of The Lashed cut, and see a lot of potential for that look, which feels to me, both modern yet with a historical ambiance.</p>
      <p>Otherwise, I really like very long single line strings of text. The relation ships of all the vertical marks (Descender/Cap height/xheight, etc.)really suits this, I feel.  There is a certain pattern of black and white that appears that works; I might be biased, but hey, I've looked at it a lot. :)</p>
      <p>I predict that one style may get used for headlines and another for callouts. In the hard copy specimen, I have a spread that explores layers of stacked text in different variants.</p>
