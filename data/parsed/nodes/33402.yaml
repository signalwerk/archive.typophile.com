    <p>At long last, I have completed !Lestatic. This is a  woodcut-inspired project with five major styles and more variants then you would probably want to shake a stick at. The face has grown into an eclectic mix of circular counters and jagged stems with a pleasant color.</p>
    <p>I would love to get some press, even more preferably, the good kind! If you do reviews, and would like to tackle this one,  drop me a line (choz at exclamachine). If you are a legit reviewer(and I'll probably know who you are), I'll send you the full collection of thirty-five fonts, specimens and such.</p>
    <p>The completion party is at my house tonight here in Nashville. A few friends are coming over to see what this "big-deal font thing" is.</p>
