      <p>I shoulda guessed this as Handlettered as Patty ID’d it. I know better. I was actually just hoping for something similar. There is so much crap out there now I figured something like this must exist. My friend showed me the samples and they were from two different companies so it has been decided that they used the same artist to create both titles.</p>
      <p>Cheers.</p>
