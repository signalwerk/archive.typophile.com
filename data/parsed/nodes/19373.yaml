      <p>i’m pretty sure “Streets of Rage” is an old videogame from way back when you could actually count the pixels on your tv, and that image is most likely a screen capture taken directly from the opening of the game (from an newer emulated version of it).. so that whole image/logo was probably built pixel for pixel. not based on any font, most likely.</p>
      <p>and rather than handlettered, i’d call this one handpixeled.</p>
