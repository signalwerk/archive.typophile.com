      <p>According to the study done a few years ago by Ascender Corp of 100 top US Newspapers, the N. Y. Times uses a custom version of Cheltenham, and the New York Post uses Font Bureau Poynter. You can see the whole study <a class="freelinking-external" href="http://www.ascendercorp.com/pdf/Ascender_Corp_Fonts_on_the_Front_Page_11_19_2004.pdf">here</a>.</p>
      <p>These are for the main text, but the Study does list other typefaces used as well.</p>
      <p>The Cheltenham used by the Times was designed by Carter &amp; Cone for the paper, but a commercially available version from Linotype or one of the other foundries would not be very obviously different to most of us. </p>
      <p>You said ’available to download’, and I took that to mean ’purchase online’. If you are looking for free versions, don’t waste your time.</p>
      <p>- Mike Yanega</p>
