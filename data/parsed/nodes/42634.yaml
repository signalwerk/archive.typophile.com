    <p>I’m working on a project &amp; need to know what the different typefaces the New York Times &amp; New York Post use. If for some reason those aren’t available to download, alternate typeface suggestions would be appreciated. I’ve been trying to guess as to what to use, but I’d like to see what people say the actual typefaces are. Thanks.</p>
