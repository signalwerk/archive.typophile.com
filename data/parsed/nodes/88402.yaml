      <p>I found a better explanation of what is going on <a class="freelinking external" href="http://www.wired.com/threatlevel/2011/12/sopa-vote-delayed/" rel="nofollow">here</a>.</p>
      <p>I found this passage particularly interesting: </p>
      <p>"On Thursday, Chaffetz and a host of other lawmakers asked Smith to stop the hearing so that the committee could bring in experts to testify. But Smith had refused, and the committee voted 22-12 to leave the DNS redirect and firewall provisions intact.</p>
      <p>The committee heard from the Motion Picture Industry Association of America at a SOPA hearing last month, but has never called an expert on internet architecture. It was not immediately clear who Smith would ultimately line up."</p>
      <p>Evidently Chairman Lamar Smith (R-Tex.) follows Texas Republican rules: Only my side gets to talk. If you have years of experience, and know what you're talking about, shut the **** up. Seems fair :)</p>
    html_clean: |-
      <p>I found a better explanation of what is going on <a class="freelinking external link-external" href="http://www.wired.com/threatlevel/2011/12/sopa-vote-delayed/" rel="nofollow">here</a>.</p>
      <p>I found this passage particularly interesting: </p>
      <p>"On Thursday, Chaffetz and a host of other lawmakers asked Smith to stop the hearing so that the committee could bring in experts to testify. But Smith had refused, and the committee voted 22-12 to leave the DNS redirect and firewall provisions intact.</p>
      <p>The committee heard from the Motion Picture Industry Association of America at a SOPA hearing last month, but has never called an expert on internet architecture. It was not immediately clear who Smith would ultimately line up."</p>
      <p>Evidently Chairman Lamar Smith (R-Tex.) follows Texas Republican rules: Only my side gets to talk. If you have years of experience, and know what you're talking about, shut the **** up. Seems fair :)</p>
