      <p>Akshara (अक्षर = akṣara) may best be defined as "Indic syllable".</p>
      <p>Have a look at this famous saying here</p>
      <p><a href="http://en.wikipedia.org/wiki/Tat_Tvam_Asi" title="http://en.wikipedia.org/wiki/Tat_Tvam_Asi">http://en.wikipedia.org/wiki/Tat_Tvam_Asi</a></p>
      <p>If "tat tvam asi" were English, and if someone asked you to write down the syllables of this sequence of words, as if it were English, you would write down these 4 "English syllables":</p>
      <p><strong>tat - tvam - a - si</strong></p>
      <p>However, the Indic syllables in this case would be these:</p>
      <p><strong>ta- ttva - ma - si</strong></p>
      <p>I have deliberately drawn this example from the English-language book "Goldman/Sutherland, Introduction to Sanskrit", 1987, page 16 (section 2.23), so that English speakers may consult this English book in a library, if they want to learn more about Indic syllables.</p>
      <p>An Indic syllable may be defined in a technically simplified way as:</p>
      <p>(1) a single vowel at the beginning of a word (e.g. "a" of "a-gni" = fire), or<br>
      (2a) a single consonant (e.g. "t") or<br>
      (2b) a consonantal cluster (e.g. "ttv"), followed by a vowel.</p>
      <p>Further technical details, e.g. concerning visarga and anusvara, are omitted here.</p>
      <p>In Devanagari script, therefore<br>
      the sequence तत्त्वमसि (= tattvamasi)<br>
      is syllabified त-त्त्व-म-सि (= ta-ttva-ma-si)</p>
      <p>see also here <a href="http://en.wikipedia.org/wiki/Shiksha" title="http://en.wikipedia.org/wiki/Shiksha">http://en.wikipedia.org/wiki/Shiksha</a></p>
