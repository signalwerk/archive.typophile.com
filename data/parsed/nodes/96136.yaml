      <blockquote><p>Note that on some fonts display this as क् followed by ल, rather than forming a conjunct. This expedient is used by ISCII and South Asian scripts of Unicode.</p></blockquote>
      <p>This is not a feature of ISCII or Unicode, excepting either absence of smart font layout handling or absence of particular conjunct ligature or half-form sequence. ISCII and Unicode use the halant as a conjunct forming control character, applied during e.g. OpenType Layout; this differs from some earlier systems that had a dedicated 'conjunct key', which might explain the confusion in the Wikipedia article.<br>
      _____</p>
      <p>As I recall, the term akshara can mean simply syllable or may refer to each individual combination of letter plus vowel or halant. Because of this varying usage, I've never found it a very useful term.</p>
      <p>Adding further confusion, when talking about Indian writing the term syllable is sometimes used to refer to a grapheme cluster, which may not correspond to a linguistic syllable.</p>
