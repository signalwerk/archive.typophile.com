      <p><cite>"In Sanskrit, are anusvāra and candrabindu systematically distinguished?"</cite></p>
      <p>Mr. Hudson:</p>
      <p>1) In (post-Vedic) classical Sanskrit, the vowel nasalisation called anunasika and represented by candrabindu sign in Devanagari is only used in connection with nasalized l, and it can only occur, when l follows n, transforming "nl" to anunasika + double "l".</p>
      <p>see <a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="www.sanskritweb.net/itrans/itmanual2003.pdf">www.sanskritweb.net/itrans/itmanual2003.pdf</a>, page 12, note 3</p>
      <p>2) In Vedic Sanskrit, especially in Yajurveda texts, there is a bewildering variety of uses of anunasikas.</p>
      <p>see <a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="www.sanskritweb.net/itrans/itmanual2003.pdf">www.sanskritweb.net/itrans/itmanual2003.pdf</a>, page 12, note 4</p>
      <p>see <a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="www.sanskritweb.net/itrans/itmanual2003.pdf">www.sanskritweb.net/itrans/itmanual2003.pdf</a>, page 131-133</p>
      <p>Today, some of these signs now have been allotted Unicode code points.</p>
      <p>For a real sample text with a sprinkling of different candrabindu signs</p>
      <p>see <a href="http://www.sanskritweb.net/yajurveda/tb-1-01.pdf" title="www.sanskritweb.net/yajurveda/tb-1-01.pdf">www.sanskritweb.net/yajurveda/tb-1-01.pdf</a></p>
      <p>3) Transliterations of anusvara and anunasika are different in Sanskrit.</p>
      <p>see <a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="www.sanskritweb.net/itrans/itmanual2003.pdf">www.sanskritweb.net/itrans/itmanual2003.pdf</a>, page 9</p>
      <p>For an alternate Hindi transliteration of Hindi anunasik</p>
      <p>see <a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="www.sanskritweb.net/itrans/itmanual2003.pdf">www.sanskritweb.net/itrans/itmanual2003.pdf</a>, page 110</p>
