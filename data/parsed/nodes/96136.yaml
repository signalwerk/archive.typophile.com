      <p>Mr. Boyer:</p>
      <p><cite>... that conjunct will occur in a text if a word ends with ब् and the following word starts with न. Am I wright? Is that combination really impossible in Sanskrit?</cite></p>
      <p>Yes, really impossible, because there does not exist a Sanskrit word ending in "b" in pausa.</p>
      <p>("in pausa" (Latin) means as the last word of a sentence or line, where you make a pause while speaking.)</p>
      <p>Even if a word ended in a soft "b" in Sanskrit (which is only the extremely rare case of e.g. "cumb", which, however, is a root and not a declined noun), the soft "b" would be converted to hard "p" in pausa.</p>
      <p>PS: The word "impossible" should not be used in conjunction with an ancient language, because it is "impossible" to create "new ancient" texts. It is better to say: "bn" does not occur in the ancient Sanskrit texts, instead of saying: "bn" is impossible in ancient Sanskrit texts, because there will never be "new ancient Sanskrit texts".</p>
