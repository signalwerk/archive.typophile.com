      <p>Belloc:</p>
      <p><cite>"Does that mean that the Devanagari क्ल kla is formed by one akshara (or syllable, or grapheme cluster) and कल् kal requires two aksharas (or syllables, or grapheme clusters) ?"</cite></p>
      <p>Whitney wrote:</p>
      <p><cite>"a. Native Hindu usage, in manuscripts and inscriptions, treats the whole material of a sentence alike, not separating its words from one another, any more than the syllables of the same word: a final consonant is combined into one written syllable with the initial vowel or consonant or consonants of the following word. It never occurred to the Hindus to space their words in any way, even where the mode of writing admitted such treatment; nor to begin a paragraph on a new line; nor to write one line of verse under another: everything, without exception, is written solid by them, filling the whole page."</cite></p>
      <p><cite>"b. Thus, the sentence and verse-line</cite></p>
      <p><strong>ahaṁ rudrebhir vasubhiç carāmy aham ādityāir uta viçvadevāiḥ</strong><br>
      (Rig-Veda X, 125. 1: see Appendix B)<br>
      (I wander with the Vasus, the Rudras, I with the Ādityas and the All-Gods)</p>
      <p>is thus syllabized:</p>
      <p><strong>a haṁ ru dre bhi rva su bhi çca rā mya ha mā di tyāi ru ta vi çva de vāiḥ</strong></p>
      <p>with each syllable ending with a vowel (or a vowel modified by the nasal-sign anusvāra, or having the sign of a final breathing, visarga, added: these being the only elements that can follow a vowel in the same syllable)."</p>
      <p>see <a href="http://en.wikisource.org/wiki/Sanskrit_Grammar/Chapter_I" title="http://en.wikisource.org/wiki/Sanskrit_Grammar/Chapter_I">http://en.wikisource.org/wiki/Sanskrit_Grammar/Chapter_I</a></p>
      <p>Note: "l" is not a customary final consonant in Sanskrit words.</p>
