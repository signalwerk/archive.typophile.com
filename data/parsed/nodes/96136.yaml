      <p>Uli</p>
      <p>These two paragraphs <a class="freelinking external" href="http://en.wikisource.org/wiki/Sanskrit_Grammar/Chapter_I " rel="nofollow"> here</a> seem to contradict each other. Could you explain ?</p>
      <p><strong>First</strong></p>
      <p>a. Native Hindu usage, in manuscripts and inscriptions, treats the whole material of a sentence alike, not separating its words from one another, any more than the syllables of the same word: a final consonant is combined into one written syllable with the initial vowel or consonant or consonants of the following word. It never occurred to the Hindus to space their words in any way, even where the mode of writing admitted such treatment; nor to begin a paragraph on a new line; nor to write one line of verse under another:<br>
      </p><blockquote>everything, without exception, is written solid by them, filling the whole page.</blockquote><p></p>
      <p>b. Thus, the sentence and verse-line ahaṁ rudrebhir vasubhiç carāmy aham ādityāir uta viçvadevāiḥ (Rig-Veda X, 125. 1: see Appendix B) I wander with the Vasus, the Rudras, I with the Ādityas and the All-Gods is thus syllabized: a haṁ ru dre bhi rva su bhi çca rā mya ha mā di tyāi ru ta vi çva de vāiḥ, with each syllable ending with a vowel (or a vowel modified by the nasal-sign anusvāra, or having the sign of a final breathing, visarga, added: these being the only elements that can follow a vowel in the same syllable); and it is (together with the next line) written in the manuscripts after this fashion:<br>
      अहँरुद्रेभिर्वसुभिश्चराम्यहमादित्यै<br>
      रुतविश्वदेवैः।अहंमित्रावरुणोभा<br>
      बिभर्म्यहमिन्द्राग्नीहमश्विनोभा॥</p>
      <p><strong>Second</strong></p>
      <blockquote><p>Each syllable is written separately, and by many scribes the successive syllables are parted a little from one another: thus,</p></blockquote>
      <p>अ हँ रु द्रे भि र्व सु भि श्च रा म्य ह मा दि त्यै</p>
