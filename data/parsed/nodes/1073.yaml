    date_raw: 4 Sep 2003 — 4:11pm
    votes: null
    html: '<p>Thank you James, for the enlightening information. My own confusion stems from a creativepro.com article of June 8, 2001 <a href="http://www.creativepro.com/story/feature/13506.html" target="_blank">http://www.creativepro.com/story/feature/13506.html</a> about Parkinson. In it, the caption to the RB&amp;BB logo says: "The design for the circus has lasted for over twenty years." I must have assumed (incorrectly) that it meant the design has remained "unchanged" for twenty years. My mistake. Again, thanks.</p>'
