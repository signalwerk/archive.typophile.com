    html: <p>One of my students just pointed out the Gerhard Huerta site from James' link, and yes, the work is great. One question arises though. Previously, I've been told that Jim Parkinson is reponsible for the Barnum &amp; Bailey's circus logo, but it is shown on Huerta's site. Although my guess is that either Huerta or Parkinson is the art director while the other actually drew the letters, some explanation from one of them might clear up any perceived confusion.</p>
