  - id: 8332
    user: 1947
    date: 2003-09-04T14:16:00
    date_raw: 4 Sep 2003 — 2:16pm
    votes: null
    html: <p>&gt; <br> <br>The thing about logos is that a lot of people have their hands on them. <br> <br>Jim Parkinson did the RB&amp;BB logo, and later on Gerard redrew it for a new art director. If you compare the two they are slightly different. Gerard worked on the logo before he got involved with digital techniques, so he hired me to digitize the logo for him. I digitized it using an Aristo Tablet working in IKARUS, man you should have seen that data! <br> <br>Both Jim Parkinson and I have similar SELF logos on our website. Who did what, when, is lost in the fog of time. <br> <br> </p>
    html_clean: <p>&gt; <br> <br>The thing about logos is that a lot of people have their hands on them. <br> <br>Jim Parkinson did the RB&amp;BB logo, and later on Gerard redrew it for a new art director. If you compare the two they are slightly different. Gerard worked on the logo before he got involved with digital techniques, so he hired me to digitize the logo for him. I digitized it using an Aristo Tablet working in IKARUS, man you should have seen that data! <br> <br>Both Jim Parkinson and I have similar SELF logos on our website. Who did what, when, is lost in the fog of time. <br> <br> </p>
