      <p>Your typeface is <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=Eras%20Bold%20ITC%20-%20Regular&amp;fid=d5213044cfad1e4f4b5d1f3138752a80&amp;fsize=60&amp;text=Boccia%20Bandits&amp;wrap=2" rel="nofollow">ITC Eras Bold</a></strong></p>
      <p>What do you mean by "default typeface"?<br>
      If you ask if it's included on MS-Windows/Mac OS or it comes with some other standard software product, the answer is No.<br>
      It's a commercial font and you should buy it separately to acquire a license to use it.</p>
