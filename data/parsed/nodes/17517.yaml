      <p>Tom, thank you for shedding the light on this. I had looked into the <a href="http://store.adobe.com/type/browser/pdfs/OTGuide.pdf" rel="nofollow">OpenType Layout Feature Support by Application</a> chart but found no reference to the <strong>ccmp</strong> feature, so I was not sure if it was supported or not.</p>
      <p>Chester, like Fred said, there are no <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> code-points assigned to these characters. The composite characters do indeed exist within the font, but we have to rely on the Glyph Composition/Decomposition(ccmp) feature to access them.</p>
      <p>I came across this problem when I was developing a font that included several "unUnicoded" characters for Armenian transliteration. The best solution I could think of was to use the <strong>ccmp</strong> feature.</p>
      <p>Using something else (let's say <strong>liga</strong> for example) would simply be hacking. Personally I wouldn't do any workarounds on this. Just as an example, the <strong>locl</strong> feature is present in some Adobe fonts, nevertheless none of their applications support it yet.</p>
      <p>Fred, you could use VOLT to implement the feature, but that won't produce any difference on InDesign's behavior.</p>
      <p>Fred, I've also noticed one more thing. Looking at your 2nd post, I believe the order of the substitutions is incorrect. Sequences that are made up of larger number of glyphs must be placed before those that require fewer glyphs (f_f_i before f_i, for instance). So in your case, the order of lines 1 and 6 should be reversed.</p>
      <p>sub C commaabovecmb by uni00430313;<br>
      sub C commaabovecmb caroncmb by uni0043030C0313;</p>
