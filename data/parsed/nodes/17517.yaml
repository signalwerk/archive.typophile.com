      <p>Fred, I never said that the rearrangement of the substitutions would make the feature (ccmp) to start working on InDesign. As Thomas said, InDesign does NOT support this feature yet, so there's no way around it. What the rearrangement most certainly does — and you might want to test this under TextEdit, since it seems to support the feature in question —, is to make the substitution order to work as expected. With the order you had before, I'm quite positive that the substitution program would never have had been able to access the command on line 6, since line 1 would substitute the glyphs first.</p>
      <p>What do you mean by 'direct typing'? Are you able to type a <em>commaabovecmb</em> (U+0313) with your keyboard? What keyboard layout are you using? Is it a custom created one?</p>
      <p>Here's how Copy&amp;Paste work for me:</p>
      <ul>from InDesign to TextEdit
      <ol>Make a new document</ol>
      <ol>Make a text box</ol>
      <ol>Insert any composite glyph via the Glyph Palette (no other way works, since InDesign does NOT support the ccmp feature)</ol>
      <ol>Select the text and copy it</ol>
      <ol>Make a new document in TextEdit (RichText format)</ol>
      <ol>Paste it (Even the font settings go along!!)</ol>
      </ul>
      <ul>from TextEdit to InDesign
      <ol>Make a new document (in RichText)</ol>
      <ol>Insert any composite glyph via the keyboard (base glyph) plus the system's Character Palette (accent glyph)</ol>
      <ol>Select the text and copy it</ol>
      <ol>Make a new document in InDesign</ol>
      <ol>Make a text box</ol>
      <ol>Paste it (and select the correct font, if I haven't done that before)</ol>
      </ul>
      <p>It's obvious that you've hit a wall, if you're trying to make the substitutions work in InDesign through a ccmp feature. One thing I can think of right away that would make me not use a liga feature to accomplish this, is that the user can turn it off. It goes without saying that your neat text will completely break up in that scenario. So, if you want an alternative to ccmp, I would say Required Ligatures (rlig). However, InDesign does not support that one as well. I wonder if there's at least one feature that InDesign support which can't be turned off by the user...</p>
