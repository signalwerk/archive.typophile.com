      <p>What I've found with more experimentation with Photoshop CS2 on MacOSX 10.4...</p>
      <p>I have several different types of keyboard layouts I'm using. One is a standard keyboard with slight modifications to allow me to type the Unicode combining diacriticals with an option+ keystroke. Another keyboard is configured for 'touch typing' wherein a single keypress will enter the base + combining diacriticals + space modifiers. </p>
      <p>For NeoOffice, TextEdit, Mellel, InDesign and some others both keyboards work well. However, I found that the 'touch type' keyboard doesn't work in PhotoShop. I experimented with the other keyboard...where I type a base character and then individually enter the combining diacriticals...and found that I need to 'double enter' the combining diacritical. Once I do this, the character is properly rendered. In other words, for the ccmp (or liga hack) "sub C caroncmb commaabovecmb by uni0043030C0313", I first type a 'C', then I need to enter my 'option+' keystroke equivalent for U+030C twice, then I need to enter my 'option+' keystroke equivalent for the U+0313 twice. When I do this the composite character is properly rendered in PhotoShop. I initially thought it might be a problem with using an 'option+' for  the keystroke...but the same actions are required if I use the OSX character palette. All other applications do not require a 'double entry' of combining diacriticals.</p>
      <p>Any ideas what I might be doing wrong...or if this is the way PhotoShop CS2 Mac works?</p>
      <p>Thanks for any advice...</p>
