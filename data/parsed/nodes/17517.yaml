      <p>Chester: <em>Maybe I’m old-fashioned, but why not just build the composite characters and have them in your font’s glyphset? Especially if they have Unicode indices. Perhaps someone smarter than I am - Adam, Thomas, John H, everyone else - can share some insight to the benefits of ccmp versus “standalone” composites?</em></p>
      <p>Even if characters do exist as precomposed diacritics in Unicode, there is a good argument for supporting them in the ccmp feature as well as encoding them in the cmap. The reason for this is that a user may be working with an input method that results in base + combining mark sequences or, even more likely, text normalisation will result in canonical decomposition to base + combining mark sequences. So what is originally input as ǚ \01DA\ might, at any point between the input and the viewing of the document, be normalised to either ǚ \00FC,030C\ or to ǚ \0075,0308,030C\ depending on the normalisation form used. All these character sequences are canonically equivalent, which means that a robust rendering technology, including fonts, should be able to display them all identically.</p>
      <p>The easiest and quickest way to handle the canonical equivalence of \01DA\, \00FC,030C\ and \0075,0308,030C\ is for the layout engine to check the font cmap table for an entry for U+01DA and, if it finds one, to perform a buffered character substitution of the mapped glyph whenever it encounters the strings \00FC,030C\) and \0075,0308,030C\. This does not require any work from the font developer, other than mapping U+01DA correctly. This is how Microsoft's Uniscribe engine handles such cases.</p>
      <p>However, I am not confident at this stage that all rendering engines will perform this operation in the same way, so for the time being I am advising a full mapping of precomposed diacritics, whether encoded or not, in the ccmp feature. If the layout engine performs a character level substitution, the ccmp lookup entry for the sequence will be ignored, but if the layout engine does not, then the ccmp feature is the next best chance of rendering the sequence correctly and not as a munged mess of colliding combining marks.</p>
      <p>Note that all of this presumes that you intend to handle diacritics using GSUB. By far the best way to handle combining mark sequences is with the GPOS mark and mkmk features, as complex script developers have been doing for the better part of a decade now. This is much more flexible than GSUB, and does not rely on a font including a precomposed glyph for every diacritic that a user might want. Using GPOS, you can efficiently globalise a font for even those hard-to-reach languages.</p>
