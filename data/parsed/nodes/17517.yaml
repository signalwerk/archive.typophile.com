      <p>Unfortunately I don't have a final answer to this problem, however I did some tests and here's what I found out:</p>
      <p>I took a typeface that had a ccmp feature and played around with it in InDesign CS and TextEdit.</p>
      <p><strong>This is how the feature looks like:</strong><br>
      <code>feature ccmp {<br>
      	sub Ccaron dotbelowcmb by uni010C0323;<br>
      	sub R macroncmb by uni00520304;<br>
      } ccmp;</code></p>
      <p><strong>This is how InDesign reenders it:</strong> (the first line is set in Times)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/calouste_ccmp.png"></div><p></p>
      <p><strong>This is how the text stream looks like:</strong> (snippet of InDesign Tagged Text file)<br>
      <code>C&lt;0x010C&gt;&lt;0x010C&gt;&lt;0x0323&gt;RR&lt;0x0304&gt;R</code></p>
      <p>As you see, the text stream is correct.</p>
      <p><strong>Observations:</strong><br>
      — TextEdit rendered the caracters correctly. These were inserted via the keyboard plus the system's Character Pallete.<br>
      — InDesignCS rendered the caracters correctly, only when these were inserted via the Glyph Pallete.<br>
      — Copying &amp; pasting between TextEdit and InDesign worked correctly in both ways.</p>
      <p>So, looks like something is broken somewhere, however it might not be the font itself.</p>
      <p>Miguel Sousa</p>
