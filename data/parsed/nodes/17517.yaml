      <p>Chester: <em>So, how does a ccmp table get into a font? Does FLS encode it into the OTF upon generation? Is there a preference setting which handles this? Is it something one would drop into a TTXed file and then recompile?</em></p>
      <p>ccmp is an OTL feature, not a table. The spec is here:<br>
      <a href="http://www.microsoft.com/typography/otspec/features_ae.htm#ccmp" title="http://www.microsoft.com/typography/otspec/features_ae.htm#ccmp">http://www.microsoft.com/typography/otspec/features_ae.htm#ccmp</a></p>
      <p>It seems to me that much of the content of a typical ccmp feature could be automated using Python. For instance, it should be easy to determine that a glyph called /Aringacute/ should be mapped from /A/ /ringcomb/ /acutecomb/.</p>
