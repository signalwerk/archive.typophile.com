    <p>Hi,</p>
    <p>I'm working on an OpenType font that works OK in Mac TextEdit and NeoOffice. The composite characters use the ccmp feature class. When I try the font in Mac Office 2004 the characters are not rendered per the composite and instead each glyph that is part of the composite character appears as a separate character on screen. It was my understanding from reading elsewhere that Mac Office 2004 had good support for unicode and OpenType. Do I need to use Volt instead of ccmp in FontLab?</p>
    <p>Any ideas?  Thanks,</p>
