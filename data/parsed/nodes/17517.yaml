      <p>Sorry for the misunderstanding regarding the ordering of ccmp subs. As I mentioned I'm new to Unicode and Opentype and trying to learn as much as I can to accomplish the task at hand. I've used the generous references to InDesign limitations to understand the complexities that need to be addressed. By 'direct typing' I'm refering to using a Ukelele keyboard that enters multiple unicode codepoints with a single keystroke...as opposed to using the glyph palette.</p>
      <p>I copied the ccmp subs into a new liga feature, that proceeds ccmp, and the characters are rendering properly in InDesign. Yes, I realize it is a hack...but it appears to be only solution at this time other than resorting to a non-Opentype font. </p>
      <p>One other hurdle is to get basic functionality with PhotoShop. That seems to be elusive as the liga hack doesn't appear to work properly...even though Adobe docs appear to indicate that liga is supported.</p>
      <p>We have partial success in that they will be able to use NeoOffice, Mellel or TextEdit to type characters and then place the text into InDesign for publications. It appears that the text will cross platforms to the PC, where Word 2003 appears to support ccmp well enough. PDFs seem to generate OK using the font and properly transfer to folks that don't have the font installed. The other request was to use PhotoShop...but I'll need to keep experimenting to see if there is another alternative. We're hoping all of this will be sorted out better in the next several years. What's interesting is that apps like ComicLife, Safari, iWeb, iMovie, etc. all work well with the font with just the ccmp feature. I guess there's hope.</p>
