      <ol>Paste it (Even the font settings go along!!)</ol>
      </ul>
      <ul>from TextEdit to InDesign
      <ol>Make a new document (in RichText)</ol>
      <ol>Insert any composite glyph via the keyboard (base glyph) plus the system's Character Palette (accent glyph)</ol>
      <ol>Select the text and copy it</ol>
      <ol>Make a new document in InDesign</ol>
      <ol>Make a text box</ol>
      <ol>Paste it (and select the correct font, if I haven't done that before)</ol>
      </ul>
      <p>It's obvious that you've hit a wall, if you're trying to make the substitutions work in InDesign through a ccmp feature. One thing I can think of right away that would make me not use a liga feature to accomplish this, is that the user can turn it off. It goes without saying that your neat text will completely break up in that scenario. So, if you want an alternative to ccmp, I would say Required Ligatures (rlig). However, InDesign does not support that one as well. I wonder if there's at least one feature that InDesign support which can't be turned off by the user...</p>
