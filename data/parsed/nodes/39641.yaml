    <p>in brief: Deco style train station, built in 1933, abandoned for many years and refurbished in 1996. The original hand-painted signage was still there in the interior. it could not be preserved, but we opted to recreate the typeface. We re-drew the letters as vectors for our plotters, but they were just shapes. Not a font. </p>
    <p>My question is, can anyone here identify this as a font, or was it a lettering style of the sign painter who painted the signs? (ignore the numerals, they are Helvetica. The letters here are dimensional so there's a shadow cast, which is most apparent on the top two lines.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nov107 004_3414.jpg"></div><p></p>
    <p>Thanks</p>
    <p>R</p>
