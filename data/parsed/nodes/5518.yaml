    html: "<p> Indeed, it is tricky stuff. <br> <br>One of the reasons I have always designed the \"4\" as descending is that early on in my own experience, I registered that the bars of \"2\", \"1\" (when it has the base serif) and a descending \"4\" line up attractively and guide my eye as I read. At least to my own perception, this helps form a \"better\" word shape, although I'm not sure I could put my finger on what makes one word shape \"better\" (or more readable) than another. Certainly variety of ascenders/descenders plays a part, but the case-by-case design of the letter must be taken into account as well, I think. <br> <br>You also make some interesting and valid points on \"extenderness distribution\" ( <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ). However, specifically regarding your third point about vertical span divergence of numerals, two fonts which tried this with the numerals spring to mind: Richard Austin's \"Bell,\" which gave the numerals three-quarters the height of an otherwise lining-numeral design; and Jan van Krimpen's \"Spectrum,\" which keeps to the x-height but has very short (about one-third proportion, to my eye) ascenders and descenders. <br> <br>I'm not sure that either design is really successful as regards the design numerals. Spectrum's ascenders and descenders are too close to the x-height to offer any assistance to the word-shape, while Bell's numerals miss the argument entirely by employing dwarfed lining figures rather than text figures. They don't stand out from the text like full lining figures do, but they create bland, rectangular word shapes that also offer no additional assistance to gestalt comprehension. <br> <br>In short (no pun necessarily intended), I'm not sure if varying the vertical span for numerals offers any practical net assistance to legibility/readability. Still, I will grant you, it's an idea that is far from having been fully tested. <br> <br>(Chewing away... and intrigued by the idea nonetheless....) <br> <br>David </p>"
