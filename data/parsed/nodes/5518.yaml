    html: "<p>Anders: Thanks for the interesting references! <br> <br>It all seems plausible to me except for the bit about the supposed geometric origins of the Arabic numerals proposed by M. Erhayiem. (<a href=\"http://www.arabicnumerals.cwc.net/\" target=\"_top\">http://www.arabicnumerals.cwc.net/</a>)  I must admit that I am skeptical about this \"number of angles\" theory. <br> <br>Two elements of the theory specifically raise red flags in my mind. <br> <br>First, many of the forms that Erhayiem proposes (especially the \"7\" and the \"9\") seem contrived to fit the theory rather than being derived from it. <br> <br>Second, these forms don't seem to match what we know about the early development of many of the figures, notably \"4\", \"5\", \"7\" and \"8\". <br>(Review J J O'Connor's and E F Robertson's article at <a href=\"http://www-groups.dcs.st-andrews.ac.uk/~history/HistTopics/Arabic_numerals.html\" target=\"_top\">http://www-groups.dcs.st-andrews.ac.uk/~history/HistTopics/Arabic_numerals.html</a>) <br> <br>The rest of it, however, pretty much sustains what I remember from history classes and my own research. <br> <br>I also seem to remember reading somewhere that the Indo-Arabic figures had their basis in cuneiform impressions, and it was curiously similar in many respects to systems used by pre-Columbian civilizations in South and Central America. \"1\" was represented by a single horizontal line segment, \"2\" was represented by two stacking horizontal line segments, and \"3\" was represented by three stacking horizontal line segments. (The system altered from this pattern for numbers above \"3\".) A theory suggests that when drawn quickly (at least in left-to-right writing), connecting lines formed between the stacking lines forming characters resembling our current figures \"1\", \"2\" and \"3\". <br> <br>I'll see if I can track down some references to this theory. <br> <br>David</p>"
