    html: "<p> So, to get back to David's alphabet, I would like to point out that I would like to see another version of the \"ß\", which seems to me too marshmallow-y. I know that this a condensed typeface, but it could stand to be a little sprucer, you know, have a bit more juice in its pectorals. Also, I love the detail on the \"1\", very distinctive. I would love to see it somewhere else, but I can't think of where as it is obviously the \"distinctor\" (can you say that?) between the \"1\" and the lc \"l\". Also, I noticed that it is very strong in smaller size, would you consider making an attempt to design it as a screen font? <br>Also: the }{ guys seem wrong to my eye...too round, too much like a bird's beak. And the $ has a weird optical thing happening, where the stroke seems to tweak the inside arcs in a bad way. I don't know if the solution is to try a broken stroke or to tweak the counter space to make it breath a little bit more. <br> <br>*L* </p>"
    html_clean: "<p> So, to get back to David's alphabet, I would like to point out that I would like to see another version of the \"ß\", which seems to me too marshmallow-y. I know that this a condensed typeface, but it could stand to be a little sprucer, you know, have a bit more juice in its pectorals. Also, I love the detail on the \"1\", very distinctive. I would love to see it somewhere else, but I can't think of where as it is obviously the \"distinctor\" (can you say that?) between the \"1\" and the lc \"l\". Also, I noticed that it is very strong in smaller size, would you consider making an attempt to design it as a screen font? <br>Also: the }{ guys seem wrong to my eye...too round, too much like a bird's beak. And the $ has a weird optical thing happening, where the stroke seems to tweak the inside arcs in a bad way. I don't know if the solution is to try a broken stroke or to tweak the counter space to make it breath a little bit more. <br> <br>*L* </p>"
