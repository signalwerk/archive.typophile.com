    html: "<p> Hrant: <br> <br>I agree that traps aren't really a new design element. My wording was careless in my previous post. The point I intended to make is that some faces are charming without them, and with the resulting uneven color. <br> <br>The New York Times Magazine has used a woodtype-style (more or less) untrapped gothic (the name of which I do not know) with a very uneven color which is extremely inviting to read. Does anyone know the name of the font to which I'm referring? <br> <br>As far as numerals go, I'm still not entirely sure about the ascending \"2\", although it makes a great alternative to a \"2\" that would otherwise look unnaturally squished if constrained to the x-height. I'm also finding that the \"4\" can work equally well ascending or descending, depending on the design, although in most (if not all) of my faces, I have designed it descending. <br> <br>I wonder if a good rule of thumb might be to have the even numerals \"2\", \"4\", \"6\" and \"8\" ascend, and have the odd numerals \"3\", \"5\", \"7\" and \"9\" descend, while keeping \"0\" and \"1\" constrained to the x-height? That might seem to evenly distribute ascenders and descenders without departing too far from recognized type conventions. Any thoughts? <br> <br>David </p>"
