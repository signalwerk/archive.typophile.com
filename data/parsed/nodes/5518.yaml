    html: "<p> This is tricky stuff. <br> <br>I started writing a mini treatise, but the time and place are both wrong, so let me ask some questions instead: <br> <br>What are the numerals suppose to do in a text face? I mean beyond the obvious \"convey numeric information\". *How* does a numeral string do its job during immersive reading? Why are oldstyle numerals more readable? Is it only because their divergent extenderness helps differentiate between them? Or is also (perhaps more so) that they form better word shapes (just like lc versus UC), in particular in common numerals strings (eg \"1968\")? <br> <br>The answers to these questions will greatly help determine things. Tradition does have a role to play, but especially in the case of numerals a lot less than some old[er] folks would have us believe. <br> <br>Readers don't consciously care if a \"2\" is ascending or not. The question is, what does the subconscious -which is largely responsible for immersive reading anyway- really cherish? <br> <br>BTW, concerning the even distribution of extenderness, note that: <br>1. In running text (even more so than in the Latin alphabet itself), ascenders are much common than descenders. <br>2. Numeral frequency is not \"flat\": some numerals are much more common than others. <br>3. And another question: should numeral strings perhaps *diverge* to some extent from running text in vertical span/location?... This is similar to the question: does some degree of -probably- controlled irregularity help readability? I for one think that there is such a thing as too much even color. <br> <br>Chew on that, dudes...  :-/ <br> <br>hhp </p>"
