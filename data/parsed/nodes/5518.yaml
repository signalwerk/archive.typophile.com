    html: "<p> Anders: <br> <br>Actually, I know what you mean. You are referring to ink traps (a.k.a. light traps). To be honest, that's one of the things I like about the caps that this fonts was based upon; it has that old woodtype naïveté, well before the idea of light trapping became popular. As such, a lot of old wood types have an uneven color that is part of their charm. <br> <br>Still, I agree with you that more balanced characters should at least be offered with the font, so I'll likely include those with either the main font or with an alternate set. <br> <br>As for the lc \"g\", I've been resisting the idea of doing a monocle form, but perhaps that would solve the problem? <br> <br>On another subject, now that the font has been posted, I've noticed that the daggers are much too heavy.... <br> <br>(And no comments from Hrant about my ascending lc \"2\"? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ) <br> <br>David </p>"
