    html: "<p> Hrant: We'll miss you! You pretty much started us on this sub-thread, and I for one will miss your input on its discussion. Hurry back, and jump back in when you return! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Joe: Thank you. And back to your original question, I suppose we can't completely rule out the effects of the Bauhaus movement and its call for a unicase alphabet in our discussion as well. The Bauhaus did, in fact, \"question the descender on the lower case p,\" as well as the entirety of the bicameral alphabet system. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> Many of the Bauhaus fonts questioned the lining-/text-figure dichotomy as well, although ironically, many designers still fashioned lining as well as text figures for their fonts from this period. <br> <br>I'd be very interested if anyone can offer more history on the Arabic script numerals that we use today. <br> <br>David </p>"
