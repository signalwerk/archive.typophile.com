    html: "<p> That's probably a big part of it. <br> <br>And, of course, we can't forget the divergent histories of the alphabet itself, which is the reason we have upper and lower case characters at all; the upper case characters being descendants of the Cretan pictographs via Phoenecian characters via Roman inscriptions, and the lower case diverging at this point and developing through the uncial hand forms via half-uncials into the familiar ascender/descender forms we know today. It was the notion of enhanced legibility of word shapes (and ease of writing), in part, that contributed to the decision to merge the two systems into our current bicameral alphabet. (Tricameral, if one counts the small caps; insert prefix of your choice if one counts the italics as well.) <br> <br>(Apologies for restating the condensed history of the alphabet, but it's integral to the discussion, and besides, at least I crammed it all into one paragraph. ;) ) <br> <br>It seems that the same considerations of legibility led to the lining and text figure dichotomy of the Arabic script numerals: lining figures seem best suited for titles, tabular settings and other display applications, while text figures seem to be more legible and aesthetically pleasing in text settings. <br> <br>Which came first, the lining figures or the text figures? To be honest, I don't know for sure -- most of the books I have either ignore completely or gloss over the history of the figures. I suspect the original forms were closer to lining figures, and the text figures developed from them (much like the lower case figures derived from the capitals). <br> <br>While text figures didn't derive (directly, at least) from the uncial hand, they seem to have been intended to emulate it. This, I think, helps to alleviate the problem that Joe pointed out: a script-based figure set becomes more harmonized with a geometric-based alphabet when it carries visual elements in common, i.e., ascenders and descenders, and the rhythm and gestalt that they create. <br> <br>Different type designers have achieved this harmony in different ways, designing some figures to ascend and others to descend, or altering the length of the extenders relative to the alphabetic characters, or even doing away with the extenders completely. <br> <br>In Bell's time (mid-eighteenth century), the fashionable solution was the three-quarter-height lining figure, rather than text figures. Many nineteenth and twentieth century type designers attempted to do away with the text figures altogether (as well as the lower case set, in many cases), which helps to explain why there is such a dearth of typefaces with complete lining AND text figure sets today (to say nothing of superiors, inferiors and titling sets). <br> <br>It is only relatively recently that the value of the text figures (and the larger value of word shapes and legibility) has enjoyed a sort of renaissance, which is why we're all here discussing the subject today. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Credit must be given to Robert Bringhurst for most of the above history, and his book, \"The Elements of Style\" -- it holds a solid place among my favorite typographic references. <br> <br>David Thometz </p>"
