    html: "<p> I love to see good work inspired by wood types. This is very very nice. I love the \"s\" and the \"S\". I would prefer less modern shapes for cetain letters though - if you wanted to have something more \"woody\". The letters I don't like so much for this reason are the lower case: f, g, j and t. Very nice @ symbol. Do you have a website? </p>"
