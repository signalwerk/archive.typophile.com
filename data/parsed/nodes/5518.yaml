    html: "<p> OK, where were we... <br> <br>The true nature of the functionality of the numerals is still beyond my grasp, so I'll have to think about that off-line (even though talking out loud -not to mention listening to others- helps me think better). <br> <br>But there are some things I can bite into: <br> <br>Joe: <br>&gt; Why has this come to even be an issue? <br>&gt; It's not like we ever question the <br>&gt; descender on the lower case p. <br> <br>Well, I try to question everything all of the time, or at least as time and circumstance permit. <br>During my Alphabet Reform work one of the things I realized early was that -ideally- some letters should have their very extenderness changed. For example, perhaps the best candidate for this is the lc \"e\": making its jaw descend (maybe not all the way down) would really help form more distinctive word shapes, and would provide better vertical balance to text. Part of the reason is that its structure can easily accomodate such a modification, and part of it is that it's the most common letter (maximum impact with minimum application/learning) and another part of it is that the \"e\" is too similar to the \"c\" and \"o\". However, anticipating stiff resistance (even the best idea is useless if not enough people go for it), I decided to limit it to tweaking the extenders of letter which already had extenders. <br> <br>&gt; Does it all really stem from the fundamentally distinct origins of the Roman alphabet and Arabic numerals? (A more or less geometric alphabet clashing with more or less scripty figures). <br> <br>As far as I know, yes. But it's not just a matter of degree of calligraphy. The stress of Arabic is horizontal (as opposed to Latin's vertical), and that's what bugs me the most. <br> <br>&gt; Is there something more to it? <br> <br>Probably. <br> <br>David: <br>&gt; the upper case characters being descendants of the Cretan pictographs via Phoenecian characters via Roman inscriptions <br> <br>Just to nitpick: Anything going \"back\" from the Phoenecians is highly disputed among scholars. <br> <br>&gt; It was the notion of enhanced legibility of word shapes (and ease of writing), in part, that contributed to the decision to merge the two systems into our current bicameral alphabet. <br> <br>! <br>That would have been inspiring, but the earliest known indication of us realizing the importance of word shapes is towards the end of the 19th century (Javal). Not only that, but even today many (perhaps most) designers are in denial about it, or simply don't care. <br> <br>Anders: <br>Great numeral history! <br>And killer links too. <br> <br>hhp </p>"
