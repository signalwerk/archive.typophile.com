  html: |-
    <p>Does anyone have any idea what this font is? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/type_copy_6109.jpg"></div><p></p>
    <p>It's very similar to Garamond stencil: <a href="http://www.myfonts.com/fonts/urw/garamond/garamond-stencil-d-medium/" title="http://www.myfonts.com/fonts/urw/garamond/garamond-stencil-d-medium/">http://www.myfonts.com/fonts/urw/garamond/garamond-stencil-d-medium/</a> but not as solid.. and there seems to be only two cuts of Garamond stencil that exist. "What da Font" is also no help as the forms are broken and the app, for example, confuses each side of the 'O' as separate letters.</p>
    <p>Any help would be greatly appreciated, thanking you all in advance.</p>
    <p>M</p>
