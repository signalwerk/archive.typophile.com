  html: |-
    <p>Here comes a new experimental font based on 3d-molecules.<br>
    This is not just look-alike - these molecular structures really exist.<br>
    Until now I only developed the lower case letters. I don't know if I manage to design the capitals and numbers as well. That seems to be a more complicated task...<br>
    Ligatures seem to be quite logical however I think the readability would suffer - and to be honest, the readability is already bad.</p>
    <p>Comments, critics and suggestions are welcome!</p>
