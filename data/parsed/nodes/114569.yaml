    html: <p>Another "way" to reproduce it would be to start with some narrow ultra contrasted sans/serif and reconstruct some letters to match your sample. A good candidate would be <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/niagara" rel="nofollow">Niagara</a>, chopping off the serifs and recreating /K from /B.</p>
