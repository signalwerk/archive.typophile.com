    <p>I’m doing a logo for a new business called Brogan Brothers, which will make cabinets and also do general remodeling, to clients making over $200,000 a year. The remodeling and the cabinetmaking businesses will be legally separate entities, and therefore I need to have a base logo of “Brogan Brothers” to which I can add the words “cabinetmakers” and “remodeling/remodelers” respectively. I’ve found an interesting relationship with an italicized upper case B, and a lower case B.</p>
    <p>This is in my opinion, the best rough I’ve come up with for the client. The openness and negative space, along with the color palette and use of italics, seems best fitted for their elite audience.  Now, the client’s wife thought that the use of an upper and lower case B in the logo “suggests that one Brogan is far more important than the other Brogan.”</p>
    <p>Yet, I feel that since the name of the company is not “Brogan &amp; Brogan,” but rather, “Brogan Brothers,” this argument does not hold weight. The client has not seemed to interested in pursuing this, thanks to his spouse... but I am not going to give up on it yet. </p>
    <p>I’m using the font Disturbance, in regular and italic, I believe, under the BB. The reason being that it incorporates upper and lowercase within the same alphabet, thereby mimicking the Bb above, and also has a good rhythm and decorative feel to it.</p>
    <p>I’ld like to be able to show some references to the client of other logos that use acronyms, and an upper and lower case version of the same letter. If anyone knows of any— links, posts, or suggestions would be helpful. Furthermore, any critiques of the logo are more than welcome.</p>
    <p>*As a note, I don’t own disturbance yet and so I can’t color it..black for now</p>
    <p>Thankyou all!</p>
    <p>here’s an alternate link if my attached file doesn’t work:<br>
    <a href="http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;" title="http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;">http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;</a>...</p>
