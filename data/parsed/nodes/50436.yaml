      <p>Big B little b what begins with B?</p>
      <p>your first post (disturbance) is interesting, however it still needs some refinement. Some of the shapes look awkward. Perhaps do one more round, and show the client other successful samples but if they are still not wowed by the big B little b, move on. It’s a good idea, hold it for a client that will appreciate it. Don’t waste too much of your time trying to get someone, who sounds very set, to change their mind.</p>
      <p>Tansu: another interesting idea. I just wonder is their style of woodworking modern? Does this graphic suit their style?</p>
      <p>Geometric: too busy and not as solid an idea as your others.</p>
      <p>Dovetailed: Does it have to be BB? I would think one graphic B would be sufficient as a symbol. Dovetailed joints are used to join different kinds of woods especially on drawers where only the face is readily visible. Look at real dovetail joints, the one you’ve drawn looks too thin and fragile. Try some other font combos, I believe you can find a more sophisticated pairing.</p>
