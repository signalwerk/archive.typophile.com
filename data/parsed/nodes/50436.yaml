      <p>I would experiment with other fonts. From the lengthy script discussion elsewhere, have you thought of finding a more elegant script ’B’ and then a more robust lower case italic font? The reason I like the first design over all the others is this:  (and it might even win the wife over) that logo would make an excellent branding iron to mark the finished piece.  For example: the underside of the seat of a chair.  Very cool.  There are companies that will take your black and white art and create a brand from it.</p>
      <p>I also think the text font you’ve used for it is both bold AND elegant.  Nice selection.</p>
      <p>I guess I don’t really understand the big ’B’ little ’b’ problem.  The name ’Brogan’ (represented by the big ’B’) is the important part and ’brothers’ (represented by the little ’b’) is the less important part. The 2 ’B’s don’t HAVE to represent the two Brogan brothers...  one greater, one lesser.</p>
      <p>2 ’B’s or not 2 ’B’s...  that appears to be the question.</p>
