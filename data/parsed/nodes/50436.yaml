      <p>ok i added 3 more jpgs of the other roughs i’ve got.<br>
      tansu is just using the stair stepping of the type that happens from right rag, left justified text. the very quickly done, simplified mark is from japaneese stair-stepped chests (<a href="http://www.greenteadesign.com/living-room-tansu-step-chests.html" title="http://www.greenteadesign.com/living-room-tansu-step-chests.html">http://www.greenteadesign.com/living-room-tansu-step-chests.html</a>)</p>
      <p>the concept for geometric is thinking about all the right angles one has to work with when remodeling or creating cabinets—measuring angles, frames, doors, cabinets themselves, and those L shaped rulers. the client thought it might look better with ruler markings (although i worry the integrity of the lines will be compromised at smaller sizes).</p>
      <p>and dovetailed is meant to show dovetail joints, which are a true sign of good quality wood working, as they take no fasteners or anything, just glue.</p>
