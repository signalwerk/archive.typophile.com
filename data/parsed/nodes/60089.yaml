    <p>Hi,<br>
    Does anyone know of a Bodoni/Didot style typeface with an 'of' ligature?<br>
    I've tried searching, but search engines tend to ignore 'of'!<br>
    I don't mind something in a different style as long as it would fit, maybe something italicised.<br>
    Thanks in advance,<br>
    Henry</p>
