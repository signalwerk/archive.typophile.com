      <p>What would an 'of' ligature look like in a typeface in the style of Bodoni or Didot? Since the pair of letters normally doesn't clash and the 'o' in particular has no exit stroke of any kind, how do you imagine the ligation? The crossbar of the 'f' extending backwards to touch the 'o', perhaps?</p>
