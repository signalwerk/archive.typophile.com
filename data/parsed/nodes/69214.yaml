      <p>I suspect the demographics for Typophile members account for that.</p>
      <p>11 pm is 12 pm in a huge swath of Europe: lunch time! Can't talk with our mouths full, can we? (In addition, it seems 'we' Europeans have no moral qualms about some browsing during work time, as it seems to pick up again <em>after</em> lunch.)</p>
      <p>The Americans are still asleep at that time; perhaps the occasional Australian night-owl is still on-line.</p>
