    <p>I've noticed that after around 11 p.m. London time, there is a huge drop of posts for about an hour or two.</p>
    <p>Is this because of dinner(NY), leaving work (MI), leaving work early (CA), early lunch (NZ and AU) or pubs closing in England?</p>
    <p>Or is there some downtime thingy in Typophile maintenance?</p>
