      <p>Hello John riccardo hrant and Aziz its been a couple of years since my last type activities.<br>
       Thanks John for this specimen sheet of Hallock's type I heard about his work described by  Saad  Abulhab as a predecessor for  Saqqal's unconnected Unified Arabic type.  Some decades ago (tempus fugit!) I was experimenting with Apple's MacPaint using 'fatbit' mosaics to construct a font. It had the look of these letters here!  Hallock's glyphs seem to be generic multi-purpose shapes for example the 'jeem' also has a dot on top so the punch can be used to create jeem ha kha. Same from the ba ta tha noon where all the dots are featured to be 'deleted' later.  Interesting - it shows he was serious about the possibility of creating an actual typeface for practical use.</p>
