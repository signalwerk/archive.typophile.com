      <p>Hello</p>
      <p>I saw some books in english about finding the right type. Off the top of my head i'd say one of them is 'Typefinder', i'm not sure about the other ones. but so far most of th books i've seen are not very useful in that purpose: you just can't take them, insert a few adjectives or sentences to describe your job, its target, its purpose, its message... and come out with a list of 6 or 7 types that would fit. These books are hard to use. </p>
      <p>As a matter of fact, I am working on such a book myself, since 4 years. The book is very much a guide to choosing the right typeface, and it will be published in France (yep i'm french) at Atelier Perrousseaux in 2008. And I can tell you it's a very hard task to accomplish. I completely disagree with the previous posters who say that you can't read about this. If so, well, how do you learn to use the correct typeface? OK, it comes from your taste, your education as a graphic designer, etc... but this taste and education comes from something, from somewhere, from someone. An article, a book, a teacher. My book's purpose is not to give the 100% correct choice for each and any situation, but it should at least give a path to follow in order not to make a huge mistake.</p>
      <p>Good luck,<br>
      David R</p>
