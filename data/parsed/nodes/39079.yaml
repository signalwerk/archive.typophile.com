      <p>OK. To a certain point, yes.</p>
      <p>But if design is ultimately about getting a message across, when we choose a font, we should probably be aware of the tone it sets or the connotations it conjures up. This means there are reasons for the decisions we make beyond personal taste.</p>
      <p>Suppose a client asks why we've chosen a particular font. Or suppose the client wants us to use an inappropriate font. We'll have to back our opinions up somehow with relatively objective reasoning. Can't just say, "Look, Im the designer, I have better taste."</p>
      <p>We'll have to pull out some descriptive adjectives and verbalise -that's scary- the visual choices we make. Some fonts convey distinction, some are better for fashion, some look more technical, etc. Bodoni is a tuxedo, you know what I mean.</p>
      <p>Someone must have written about this... I hope. </p>
      <p>Not all who wander are lost</p>
