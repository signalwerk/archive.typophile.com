      <p>It's important to study type history.<br>
      I doubt there is any other area of culture where the old stuff is as current and widespread as typography, except perhaps religion.</p>
      <p>The concept of historical allusion is important. Typefaces designed in the same era work well with one another, not so much because the viewer realizes they allude to the same period, but because they tend to share the same kinds of letter shapes and proportions. They harmonize, because they were designed to work together from the outset.</p>
      <p>History will give you a background upon which to place and identify different kinds of typefaces, letterforms, and details, and will help to organize your knowledge and visual awareness.</p>
