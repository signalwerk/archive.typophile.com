      <p>&gt; <em>We’ll have to back our opinions up somehow with relatively objective reasoning. Can’t just say, “Look, Im the designer, I have better taste.”</em></p>
      <p>Well, actually, maybe you can? :)</p>
      <p>Not really of course. But to a certain extent... You should give type-choice thought of course, but I don't think you should want to have a massive elaborated reason why you picked a certain font. </p>
      <p>I ask myself what does the font need to do (e.g. be legible in small pointsize could be a criterium), and what kind of style it needs to be to fit the look and feel of the design (or content thereof) I'm working on.<br>
      Since you are a designer, you should also rely on your feel for style and aesthetics and so on, at least that is a important part of the job.</p>
      <p>But of course it's all going to be subjective, but I think that doesn't need to be a problem per sé: for example, a poetrybook I had to design. The poems were serious, yet with a somewhat quirky, weird and sometimes playful undertone. The type area was going to be relatively small compared to the lengths of the poems, so the type had to be set fairly small as well. In the end I went for Dolly. I think it fits all the criteria I mentioned; it has the offcial look you can find in typefaces like Trinité/Lexicon, but it's quirky and weird at the same time. And it sets remarkebly well in small pointsizes.</p>
      <p>I don't know if other people would agree with that, but I think it fitted well.<br>
      Well, just me thinking out loud. ;)</p>
      <p>&gt; <em>Ryan Holmes said (among other things):<br>
      In fact, for most graphic designers, aren’t Helvetica Neue and Franklin Gothic STILL the first two grotesk sans you turn to? Why not, they get the job done.</em></p>
      <p>I think that's probably a discussion that has been held here more than once. But I disagree with that statement. Sure, they probably get the job done, but things will start looking seriously bland if you use it for everything.</p>
