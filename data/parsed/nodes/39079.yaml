      <p>My own personal opinion this isn't something you can "read" about. Naturally there are probably books on this subject and certainly many more that attempt to "teach" this ability, but I would hesitate to recommend any. I am reminded of something Stephen King once said, "A good writer can become better, but a bad writer can never become good." I believe this applies to just about anything creative. Either you have the talent, or you don't.</p>
      <p>Now to climb off my soapbox....</p>
      <p>There are many resources on the Web that cover this subject; one of the most popular articles is <a class="freelinking external" href="http://www.designersmind.com/articles/choosing-the-right-font-for-the-job" rel="nofollow">this one</a>. Wichita University even did a study on this, <a class="freelinking external" href="http://psychology.wichita.edu/surl/usabilitynews/2S/font.htm" rel="nofollow">So What Size and Type of Font Should I Use on My Website?</a> Vitaly Friedman compiled a list of <a class="freelinking external" href="http://www.alvit.de/blog/article/20-best-license-free-official-fonts" rel="nofollow">25 best free quality fonts</a>, which is worth checking out.</p>
