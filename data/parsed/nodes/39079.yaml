    <p>Hi. Im looking for resources (books, sites, etc) to learn about how to choose the right font for a job. Im starting out as a web designer.</p>
    <p>My current level of knowledge: I know the difference between Gotham and Proxima Nova, I know I love Helvetica but am sick of seeing it, I can see the slightly squared feel to Galaxie Polaris, I understand why Apex New could be used as a font for a science magazine, but... I still feel my capacity for choosing the right font is quite limited (besides obvious things like readability).</p>
    <p>How to choose between Whitney, Meta, Frutiger Next, etc.? Based upon what criteria?</p>
    <p>Hope some type-lover out there could tell me where to start reading... Thanx!</p>
