      <p>Here you have a couple of examples of what I mean borrowed from another thread:</p>
      <p>QUESTIONS:<br>
      1. Which 3 words would you use to describe Helvetica?<br>
      2. Do you have any emotional response to Helvetica and its uses?<br>
      3. In your opinion, is Helvetica ‘neutral’?</p>
      <p>SuperUltraFabulous said:<br>
      1. Strong, Universal, &amp; Sexy<br>
      2. Yes, I love it. I love seeing it. It feels high fashion and classic to me. Many high end european furniture houses use Helvetica for their identity: Edra, Cappelini, &amp; Knoll.<br>
      3. Not absolutely. Univers is what I consider absolutely 100% neutral- cold- emotionless type. Helvetica does have some warmth, dare I say, quirkiness. Or perhaps instead of those qualities- attitude. She doesn’t exactly wear her heart on her sleeve. If Helvetica was a woman she would certainly be one of Helmut Newton’s amazons.</p>
      <p>Ryan Holmes said (among other things):<br>
      In fact, for most graphic designers, aren’t Helvetica Neue and Franklin Gothic STILL the first two grotesk sans you turn to? Why not, they get the job done. Univers is too truly antiseptic, Folio is quirky, Akzidenz Grotesk is authentic but less mannered than the big two, News Gothic and Trade Gothic are thin and wimpy.</p>
      <p>Thanx to these folks! I'm learning already!</p>
      <p>Not all who wander are lost</p>
