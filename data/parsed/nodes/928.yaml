    html: <p>Check the first half of <a href="http://www.typophile.com/forums/messages/30/14101.html?1060495139" target="_blank"> this thread</a>. <br>You'll find some links and info there. <br> <br>In my point-of-view, Zurich is not to Univers what Arial is to Helvetica. <br>The Zurich issue (naming, copyright) is different from Arial issue (design).</p>
