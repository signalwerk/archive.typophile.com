    html: <p>Zurich <i>is</i> Bitstream's version of Univers. The designs are as close as any two versions of the same typefaces can be except in name. Now that they've reached reached an agreement with Linotype, they will be <i>calling</i> it Univers as well. <br> <br>This will never happen with Arial. It's superficially similar, but its details are quite different from Helvetica. They do share the same character widths and weights. This is due to the fact that Arial was created as a substitute for Helvetica.</p>
