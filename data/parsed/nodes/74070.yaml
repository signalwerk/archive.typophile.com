    <p>This is a typeface that has been used a lot for the Harry Potter films, particularly the first two. However, just as I was about to start thinking that this font was custom designed, I found it on the packaging of each of the three films of The Lord of the Rings: The Motion Picture Trilogy (Special Extended Edition) DVD collection. Therefore, I conclude it must be a commercially available font (I say this because it looks expensive to me. XD). The examples I include here are from high-resolution PDF snapshots and scans of the DVD packaging of Harry Potter and the Philosopher’s Stone (Two Disc Set) and The Lord of the Rings: The Two Towers (Special Extended Edition).<br>
    I have discerned that there are differences between what I (rightly or wrongly) perceive to be the regular and bold weights, being noticeably the uppercase G, H, L, M, R, and lowercase g.<br>
    Please, please, PLEASE help me out with the name of this font!</p>
