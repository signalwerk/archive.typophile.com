      <p>Found it - by myself, I might add.<br>
      It's a gorgeous font family called Flourish by Judith Sutcliffe, sold through FontShop (<a href="http://www.fontshop.com/fonts/downloads/electric_typographer/flourish/" title="http://www.fontshop.com/fonts/downloads/electric_typographer/flourish/">http://www.fontshop.com/fonts/downloads/electric_typographer/flourish/</a>). The samples I provided are namely Flourish and Flourish Bold Special, so I was somewhat right about there being differences between the regular and bold weights. I was also right about it being expensive ($160 for the Flourish package of 6 fonts, with none of the fonts being available individually).<br>
      Oh my...</p>
