    <p></p><div class="imageWrap"><img src="/web/20081012144626im_/http://www.typophile.com/files/picc_6459.jpg"></div><p></p>
    <p>Hello everyone.<br>
    Please give me an advice if you know anything about Leopard and FFIL!</p>
    <p>I just got new iMac at my office and installed OS 10.5.1.<br>
    Till yesterday, I was using FFIL formatted font suitcase on my lovely old PPC iMac, with OS 10.4.11.<br>
    But it seems that my new Leopard OS dosen’t recognize FFIL file as a font but a “Unix execute file”. Even Font Book and Linotype FontExplorer can’t open the ex-FFIL files, which are about 50% of the fonts I have!</p>
    <p>I think this might be an problem of my computer, but since I’m the only one who works on Leopard in my office, so I decide to ask people here for an advice.<br>
    Does anyone know what’s going on with my new working equipment?<br>
    Please please help me!</p>
