      <p><strong>@James</strong></p>
      <p>I don't know what you are hoping to accomplish by that post, it feels very sarcastic and counter-productive to me, and is unlike any of the other insightful and helpful posts I'm used to seeing here on Typophile.</p>
      <p><strong><em>Oh. Thank you. The headstock of a guitar.</em></strong></p>
      <p>Well, not just any <em>headstock</em>, I do believe we're looking at a Fender Stratocaster 6-in-line headstock, to be exact.</p>
      <p><strong><em>Good guess. It’s sufficiently obvious, surely.</em></strong></p>
      <p>Oh I'm sorry, I must have missed the bit where it was explicitly said that is was for herself, would you mind quoting that from the original post for me, I'm obviously too blind to see it.</p>
      <p><strong><em>Not really Roman.  Not even Greek. Putti are a later .... invention</em></strong></p>
      <p>Wow, I had no idea that the words it reminded me of were in fact <em>not</em> the words it reminded me of.  How fortunate for me that you know better what it made me think of than I do thanks to your extensive knowledge on <em>Putti</em>, which are <strong>not</strong> Cherubs by the way if you were to actually look them up for yourself.</p>
      <p><strong><em>But you figured it out anyway</em></strong></p>
      <p>Did I?  I haven't heard back from the OP to see if the impressions I got from viewing her work were in fact the impressions she was trying to give.  Of course I figured out what it made <em>me</em> think of, I just don't know how close that is to what she intended.</p>
      <p><strong>@James</strong>, I think there are a couple of things here, 1) you can't be sarcastic and rude unless you're willing to be entirely devoted to the facts first, because the smallest little factual error in your rant turns what would have been a mean elitist remark into just a bitter and uninformed comment amidst a forum of helpful and nice people.  That's the kind of thing that breaks our hearts and have pity for you.</p>
      <p><strong>@Vanessapoka</strong>, well, I hope this hasn't scared you away, there are plenty of nice folks here on this forum who would love to help you, keep us updated with your revisions as you keep working on these.  For future reference, posting a PDF or an image about 500-800pixels wide is a good medium size that's small enough to see all at once, and big enough to get a good look at the logo.</p>
      <p><em>Best of luck,<br>
      innovati</em></p>
