      <p>Oh for god'sake, there's no pleesing some peeple. Ignore this grumbling person Vanessa.</p>
      <p>Hello Vanessa and welcome to Typophile.</p>
      <p>I like the purple one with the circle and the putti (cherub), but you cood do more with the type there, and add a few small details, like a shadow or something coming off the putti. Also the size of the putti may be a bit large relative to the circle. Making him smaller will add refinement and give it a more polished look.</p>
      <p>The script logo in cyan is nice but kinda neither here nor there, if you know wot I mean. The squiggly line around "Vani" doesn't look like anything specific so I presume it is abstract but I'm not clear on wot it represents, so that may have a mystifying effect on spectators, leaving them scratching their heads.</p>
      <p>Keep working on the purple one with the putti. Good potential there.</p>
      <p>j a m e s</p>
