      <p>ooh, I don't know who these are for (I assume they are for you?) and I don't know what you are trying to communicate with them, but I'll tell you my impressions of both of them, so maybe those will help you see whether or not they are working</p>
      <p><strong>Green one</strong></p>
      <p>I get: music, almost a 1950s feel, I think of Fender Guitars.</p>
      <p>I think that to me, this represents somebody who is classical, jazzy, modern, musical and probably a fun person</p>
      <p><strong>Purple one:</strong></p>
      <p>I get: classical, roman, artistic</p>
      <p>I think that this one communicates somebody who is quiet, classical and mature.</p>
      <p>I would love to see them, and bigger next time. (I can handle big images) keep it up!</p>
