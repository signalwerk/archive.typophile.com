    html: |-
      <p>I am no expert(so you can get the layman's point of view) but I personally really don't give a rat's butt about the white space between the characters and neither does the 90%+ people who are going to read your typeface, as long as it is legible. If your modifications cause some distractions/disturbances to the flow, then it is bad. I personally consider a font to be a disaster if I stare at a pair of characters wondering why the designer did it. Acc. to me the best part of font design is ensuring that reader is never discomforted and doesn't have to wonder why you did what you did.<br>
      P.S. I am novice and correct me if I am wrong.<br>
      P.P.S. As a typeface designer one should be concerned more about the intended audience than their pet peeves.</p>
