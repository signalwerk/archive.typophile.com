  html: |-
    <p>I'm putting together some secondary logo fields for a healthcare system's new identity and having major problems with the "rv" and "ry" pairings. I've searched the interwebs and haven't found any standard ligatures for these. I've had to keep the kerning pretty tight because some of the names get pretty long (ie: Physical Rehabilitation), but I don't think it's too tight.</p>
    <p>The font is DIN Next Regular, and I've gone ahead and created my own ligatures. I'm not a type designer so I thought I'd post what I've got and see if anyone has ever had this problem themselves and to get any general feedback on my solution.</p>
    <p>Fire away! And thanks for any help.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Outpatient_Services_6404.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Primary_Care_4995.png"></div><p></p>
