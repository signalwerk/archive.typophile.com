    html: |-
      <p>The first alternative is an interesting solution. Why not to let it available to users through a contextual alternate (stylistic set)?</p>
      <p>In my opinion, Vesper Pro has the best solution for this: an arm-shortened /r/ and /v/y/ with smaller serifs, which are actived through contextual alternates – actually, the same as Eliason indicated. The serif family I'm building will adopt the same.</p>
      <p>These /rv/ry/ ligatures are possible and seems to work, although I prefer a Vesper-like solution. I just would avoid to use them as default because they are out of the typographical standard.</p>
      <p>Another experiments with ligatures for normal text (I mean, not with a lyrical/literary flavour) are found on Quadratta with /ch/ and /ll/, digraphs largely used in Spanish.</p>
    html_clean: |-
