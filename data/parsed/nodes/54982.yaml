    <p>I found an interesting drink recipe in the Autumn 1937 issue of the Colophon, p. 620:</p>
    <p><cite>Tippling subscribers who live in New York may be interested to know that the Restaurant Dubonnet at 5 East 45th St. still serves the Colophon Cocktail, consisting of sherry, rye whiskey, apricot brandy, and Dubonnet. Make mine a blue blazer.</cite></p>
    <p>Any guesses about the proportions?</p>
