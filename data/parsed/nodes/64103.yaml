    <p>Super vague description but here it goes:</p>
    <p>• They had a really beautiful old french script font.</p>
    <p>• The website was comprised of floating old Apple OS windows, where you select a nav option and then it pop up another OS window for secondary nav.</p>
    <p>• when you tested a font it would place the words over the canvas/screen on little rectangles (like those fridge magnets) and you could alter color of background/foreground.</p>
    <p>• they didn't have a lot of fonts.</p>
    <p>Any ideas?</p>
    <p>Would love some help.</p>
