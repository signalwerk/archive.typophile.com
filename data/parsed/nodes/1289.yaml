  html: "<p>I've desperately been searching for a digital version of Herb Lubalin's Avant Garde, that is, the ORIGINAL (from the late 60s, used in the magazine), not the book, gothic, condensed, or mono versions that I've been finding everywhere else (yes, including ITC and Linotype). <br> <br>I'm fairly confident that it exists. I've seen it used in designs here and there. <br> <br>for example, <a href=\"http://images.amazon.com/images/P/B00004SBGD.01.LZZZZZZZ.jpg\"> this Travis CD cover. </a> <br> <br>And this Japanese designer's webpage: <a href=\"http://www.nendo.com\" target=\"_blank\">http://www.nendo.com</a> <br> <br>I a newbie to the typographic world, so show me some love!  <br> <br>Any help is greatly appreciated. Thanks! <br> <br>Ryan.</p>"
  html_clean: "<p>I've desperately been searching for a digital version of Herb Lubalin's Avant Garde, that is, the ORIGINAL (from the late 60s, used in the magazine), not the book, gothic, condensed, or mono versions that I've been finding everywhere else (yes, including ITC and Linotype). <br> <br>I'm fairly confident that it exists. I've seen it used in designs here and there. <br> <br>for example, <a href=\"http://images.amazon.com/images/P/B00004SBGD.01.LZZZZZZZ.jpg\" class=\"link-external\"> this Travis CD cover. </a> <br> <br>And this Japanese designer's webpage: <a href=\"http://www.nendo.com\" target=\"_blank\" class=\"link-external\">http://www.nendo.com</a> <br> <br>I a newbie to the typographic world, so show me some love!  <br> <br>Any help is greatly appreciated. Thanks! <br> <br>Ryan.</p>"
