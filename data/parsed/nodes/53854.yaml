    <p>You corrupted one of the fonts, Microsoft Sans Serif, Tahoma and tahoma bold. You deleted Micross.ttf, Tahoma.ttf and tahomabd.ttf except the font Courier New. If you're deleting Courier New, an undefined character will show when Vietnam character isn't defined, like an O with horn, shows up the font Courier New rather than Microsoft Sans Serif. You deleted tahoma. Pronouncing the word tahoma will be good. Why not reinstall the micross.ttf, tahoma.ttf and tahomabd.ttf? So why not add Kerning pairs like TA, FA, AV, PA, LT, into Microsoft Sans Serif? Tahoma already had kerning pairs. And why not add some kerning pairs like AW, WA, VA, TA, FA, Aw, Ay, AY, etc. to Gulim? How add some kerning pairs like AW, AV, TA, PA, WA, VA, YA, AY, Ay, Av, Ta, Tc, To, Te, etc. to Batang? And how add some kerning like AV, AW, AY, AT, TA, to Lucida Grande? And add all kerning pairs to Lucida Sans Unicode? Segoe UI had kerning pairs. Both Tahoma and Verdana has kerning and Microsoft Sans Serif has no kerning pairs. You can download the fonts that start with Tahoma. Code 2000 also includes 239 kerning pairs. You can download Code 2000 from the website. And you noticed Microsoft Sans Serif was to include the Oi.</p>
    <p>Please give me the font files for micross.ttf, tahoma.ttf and tahomabd.ttf so you can convert these to Tux Typing files!</p>
