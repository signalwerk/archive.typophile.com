    html: |-
      <p>You have the Microsoft Sans Serif font file and a corrupt Tahoma font file, then deleted the fonts.</p>
      <p>But you don't see any Abkhasian. If you copy and paste a letter like Ghe stroke, Zhe descender, Shha, Schwa, Barred O, it will change the font to Courier New. If you use ctrl backspace, the letter couldn't be changed. If you install Microsoft Sans Serif, the font looks good if you copy Pe middle hook or any Abkhasian letter, the font will change to Microsoft Sans Serif. If you delete the font then restart the computer, Microsoft Sans Serif will be unaccessible. If you copy the character, the font changed to a glyph named '.notdef', which is also in FontCreator 5.6 Glyph Postscript lists. If you copy a letter like O with horn, capital Schwa, U caron, u dieresis macron, A caron, A circumflex hook, Combining hook, then the font will change to Courier New, then press Ctrl+Backspace, the glyph will be changed to a glyph named '.notdef' and another .notdef glyph will appear. If you copy a Hebrew letter, the font is changed to Courier New. If you press Ctrl+Backspace, a .notdef glyph will be shown but the font shouldn't change for the Hebrew letters to your own font.</p>
      <p>It's why the PS name whitecircle wasn't in the FontCreator PS name list. It's why the name whitecircle will become available in the list, like this:</p>
      <p>Udieresis<br>
      Ugrave<br>
      ugrave<br>
      underscore<br>
      v<br>
      V<br>
      w<br>
      W<br>
      whitecircle</p>
      <p>It's how the PS Names like uni_2120, uni_212F, uni_2137, uni_2136 will become available in FontCreator's PS names. But how the PS name smallscriptl will become available in FontCreator? You ask Erwin Denissen to make<br>
      uni_2120 uni_212F uni_2137 uni_2136 smallscriptl uni_2223 uni_2228 uni_2227 uni_22BB _2566 _2567 _2568 _2569 _256a _256b _256c uni_25C7 become available by replacing Bitstream's glyph table with Custom Bitstream's glyph table. You ask Erwin Denissen to make uni_301A uni_301B uni_EFBF uni_EFC0 uni_EFC1 uni_EFC2 uni_EFC3 uni_EFC4 uni_EFC5 uni_EFC6 uni_EFC7 uni_EFC8 uni_EFC9 uni_EFCA uni_EFCB uni_EFCC uni_EFCD uni_EFCE uni_EFCF uni_EFD0 uni_EFD1 uni_EFD2 uni_EFD3 uni_EFD4 to become available in Custom Bitstream's glyph table. Asked Erwin Denissen to make uni_EFD5 uni_EFD6 uni_EFD7 uni_EFD8 uni_EFD9 uni_EFDA uni_EFDB uni_EFDC uni_EFDD uni_EFDE uni_EFDF uni_EFE0 uni_EFE0 uni_EFE1 uni_EFE2 uni_EFE4 uni_EFE3 uni_EFE5 uni_EFE6 uni_EFE8 uni_EFE7 uni_EFE9 uni_EFEB uni_EFEA uni_EFEC hp1089 hp1087 hp1085 hp1045 hp1030 hp0330 hp0323 hp0322 hp0321 hp0320 hp0319 hp0317 hp0318 uni_EFFA uni_EFFB uni_EFFC uni_EFFD uni_EFFE uni_EFFF available in glyphs list with uni_**** and hp****. You think the simple glyph Scaron contains 2 contours and 89 points. If you delete the caron, then it will change to a letter S. If you delete the 68 points then use Copmlete Composites, Scaron will become a composite glyph. The other glyph Racute has 69 points and 3 contours. The other glyph odblacute has 4 contours and 70 points. If you delete the whole glyph and use Complete Composites, then the glyph changes from simple to composite. You think the ŃńŇň were simple. Delete the letter and use Complete Composites to complete the selected 4 glyphs: ŃńŇň. These are in Unicode and encoded as Latin Extended-A Unicode block. You think the 8 glyphs ĒēĖėĘęĚě were simple. Click the letter then use the Delete button to delete the E letter and use Complete Composites.</p>
      <p>Copy and paste this to Nimbus Mono if your font is like Courier:<br>
      2-7-3-9-2-2-5-2-4-4</p>
      <p>You think the 4 greek letters ζξρυ also have serifs. 4 greek letters ζξρυ from Courier New doesn't, but Free Mono still has serifs.</p>
