    html: |-
      <p>@majus</p>
      <p>Thank you for your feedback.</p>
      <p>Actually, the fonts being discussed have been released for a while now.</p>
      <p>I received an email this morning from a customer who is using my fonts in LibreOffice application (similar to Word) on a Mac. I never heard of it.</p>
      <p>I asked customer to email me back a export text.rtf file to reimport into my InDesign file for testing.</p>
      <p>I got a similar thing happen when I selected my regular and bold weights (side-by-side).</p>
      <p>As per file attachment above.</p>
      <p>So, I decided to get to the bottom of it.</p>
      <p>I copied and pasted all glyphs into a new FontLab window and left the default setting created by FontLab. I did this for the new Bold weight of my font as well.</p>
      <p>Well, to my surprise, the fonts in the tables now work fine? Alignment on both sides is good.</p>
      <p>I am now trying to make another set of fonts, updating the parameters in FontLab (as recommended in FontLab) for the 'WinAscent' and WinDescent' to see what happens.</p>
      <p>If the alignments jump again, then these parameter values are important and are key in making this all work correctly.</p>
      <p>I'll let you know what happens after I perform this last test. I suspect that the alignments will be off after I update (auto) parameters in FontLab based on my internal glyph alignments heights, etc. We will see...</p>
      <p>I just never tested for this sort of thing, but now, I need to get a handle on this whole problem and resolve for future font update and releases.</p>
      <p>I'm surprised no one else has chimed in with a similar occurrence when testing their fonts. Stay tuned...</p>
      <p>Thanks again.</p>
