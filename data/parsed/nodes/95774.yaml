    <p>I have designed a font family with several weights and have discovered a problem with figures not aligning in tables with one weight typeset next to the other.</p>
    <p>To illustrate this better, I have attached a sample file as an example.</p>
    <p>My fonts have slightly taller cap, lower case and ascender and descender alignments.</p>
    <p>In FontLab these parameter settings are automatically calculated and used to generate the OTFs.</p>
    <p>Is there a parameter setting in FontLab that I need to adjust manually in order to correct this issue of alignments with tables?</p>
    <p>Any help would be much appreciated. Thank you.</p>
