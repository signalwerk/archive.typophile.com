  - id: 519850
    user: 68821
    date: 2012-08-23T12:18:00
    date_raw: 23 Aug 2012 — 12:18pm
    votes: null
    html: |-
      <p>FAYI,<br>
      Okay, I was able to finally resolve the problem.<br>
      As suspected, when I updated the font parameters (auto button) in FontLab for:<br>
      Metric and Dimension&gt;Key Dimensions and TrueType-specific metrics<br>
      I got the same mis-alignment issues with tables in InDesign.</p>
      <p>Sooooo, I painstakingly went parameter by parameter until I found the culprit.</p>
      <p>And, it's the [OS/2] TypoAscender and the [hhea] Ascender causing all the issues.</p>
      <p>I took the largest 'auto button' parameter in my entire font family of weights and styles.</p>
      <p>I think you need to use the largest values here because I did not want 'tops' of glyphs to start clipping in some apps.</p>
      <p>Anyway, and used the same 'values' throughout.</p>
      <p>Everything aligns perfectly now.</p>
      <p>Thank you, George.</p>
      <p>@George Thomas... drop me a personal email <a href="mailto:akaczun@verizon.net">akaczun@verizon.net</a><br>
      I would like to discuss other stuff on a personal note.</p>
