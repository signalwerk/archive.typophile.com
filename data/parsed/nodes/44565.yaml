    html: |-
      <p>You could use a typeface that has a "cultural" axis.<br>
      By that, I mean that instead of the usual axes such as weight, scale and slant, there are, for instance, historical variants.<br>
      Chalet, of course, represents several scenes.<br>
      Hypatia has options too, with old-style and geometric as variants on the same body.<br>
      Of my faces, <a href="http://www.shinntype.com/eunoia.html" rel="nofollow">Eunoia</a> and <a href="http://www.shinntype.com/panoptica.html" rel="nofollow">Panoptica</a> provide alternate vibes within the same general brand.</p>
