    <p>Hi all,</p>
    <p>This is an odd one. I'm struggling on a suitable typeface to use on a jazz website (all types of jazz, not just a specific genre (dammit! I was looking for an excuse to use Device fonts Blackcurrant; and a 60s style jazz site would've been perfect) but everything from Eartha Kittt to  Jamie Cullum.</p>
    <p>Apparently it has to be "classy". Now classy I can do. Jazz I can do. Together? </p>
    <p>Any quick suggestions - freeform or otherwise ;) - greatly appreciated. </p>
    <p>simon</p>
