      <p>Photography...</p>
      <p>Yes, also something I'm looking into - but primarily my concerns were firmly in the lap of type, which I *know* is usually the wrong way to go about things, but that's just the way I design. :)</p>
      <p>We have accounts everywhere with stock sites, but everything is so generic and bland (with the exception of Morguefile; somewhere that constantly surprises me, being royalty free, and, well, free).</p>
      <p>Clarendon looks like an ideal face, and something, possibly due to font "jamias-vu" (see it often, always forget it's there) I'd never have thought of.</p>
      <p>Thanks so much for suggestions, I'll start experimenting when I hit the office tomorrow.</p>
      <p>simon</p>
