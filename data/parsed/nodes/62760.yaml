    html: <p>It may be hard to find real 'fg' or 'gf' ligatures. Not a ligature but 'gf' in Grotext <a href="http://www.kltf.de/stuff/gf_in_KLTFGrotext.jpg" target="_blank" rel="nofollow">join like this</a>. Another decision to make is whether you go by Gofra (= 'gf') or by your real name (= 'fg'). The latter would allow, depending on the design of the letters, that the f reaches out above the g and g reaches out below the f. Perhaps it makes more sense if you post what you have, and then the crowd can tell which solutions are possible and which are not.&nbsp;&nbsp;;-)</p>
