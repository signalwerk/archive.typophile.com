    <p>Hi crowd - my first post here!</p>
    <p>I'm Frane, 30, and I live in Slovenia, Europe - I was sent here by a co-worker of mine - she's a great fan of the site. So, here's my humble "cry for help" :) :</p>
    <p>After few years of being employed, I decided to finnaly start with my private business as well. Mostly, I m preoccupied with webdesign but also work in the fields of illustration, logo creation and print design. So, in order to keep things neat, I need to come up with a good logo solution that will (hopefully successfully) represent me. Since I go by the nickname "Gofra" on most of the sites I decided to stick with this as my "brand" name (It's made of two parts of my first and last name - "GO" from Gorjanc &lt; my last name and "FRA" from Frane &lt; first three letters of my first name). Now, I've been thinkig of a solution in shape of a "fg" or "gf" logo and have also drawn some examples allready (will scan later in the evening) but what I would really love to see is some examples of ligatures.</p>
    <p>So if anyone knows about examples, please - I'd be thankfull!<br>
    Also, if someone knows or suggest better ideas on resolving this issue, I'd appreaciate it a lot!</p>
    <p>Thanks for your help!</p>
    <p>Frane</p>
