    html: <p>I find the two left ones in the second row most interesting though perhaps hard to decipher -- the stem serves both G and F but seems to be associated more with the F, which makes the G look like a C. (Similar case with the others in this row.) Perhaps it works better if the bottom curve of the G moves up again on the right side, and if you add a little square inside of the G like in the version to the very right which would indicate a little bar as in Gill Sans G.</p>
