    <p>I have this logo image on my website and for seo purposes would like to change it into a text logo. So, need to know, which google font is the most similar to the image logo text.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_3525.png"></div><p></p>
    <p>the website: <a href="http://www.dietetik.si/" title="http://www.dietetik.si/">http://www.dietetik.si/</a></p>
    <p>any suggestions for a google font would be appreciated,</p>
    <p>thank you</p>
