      <p><a href="http://www.myfonts.com/fonts/nicksfonts/faerie-queen-nf/" target="_blank">This font</a> is a reasonably faithful rendering of Gans Titania, in which the lowercase letters bear no resemblance whatsoever to the Intellecta version. I’d say Ray has a good case for concluding that his outlines were hijacked, which wouldn’t be the first time.</p>
      <p>At the present time, Jupiter Images is selling access to a font repository that contains a large number of freeware fonts (Ray’s, mine and a lot of other folks’) that were pirated by an outfit called Art I Need five or so years ago. It appears that their standard MO was to open freeware fonts in Fontographer, rename them, claim copyright ownership, and then peddle them. For reasons which may or may not have anything to do with this underhanded practice, the company went out of business a few years back, but not before selling a number of the pirated fonts to Jupiter Images. Bummer...</p>
