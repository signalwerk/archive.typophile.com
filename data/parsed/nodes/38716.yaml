    html: |-
      <p>One more thing: I occasionally use the blend tool in FontLab to blend fonts. For example: Chinese Rocks + Tank = Croteau. I have a handy back catalogue of a few hundred families to use as blend fodder. I once experimented blending some OPFs* in FontLab - just for kicks, not to create fonts to sell or give away. Didn’t save ’em. Just playing. Mkay?</p>
      <p>The most troublesome letter in blends is lowercase g. The structure is often different (monocular vs. binocular) and results in a mangled mess or a failed “red” glyph. A lazy solution is to suture a j to a q to produce a single storey g.</p>
      <p>What I’m getting at is: nothing. I’m just saying what what? Blend OPFs and then look at Intellecta fonts. Then look at your blended OPFs. Then look at Intellecta fonts again. Repeat until drowsy.</p>
      <p>Back to Densmore. Check out the rest of the character set. Even the little blade screwdriver head on the exclamation point.</p>
      <p>“Intellactual Property” would have been a better topic heading now that I think about it.</p>
      <p>* other people’s fonts</p>
