      <p>Quoting myself<br>
      <cite>(Vertical hints hint horizontal stems.)</cite></p>
      <p>This is a point, in which I am not sure. In Fontographer hints of horizontal stems are displayed as vertical arrows. In FontLab they are displayed as two dashed horizontal lines. And in the FontLab terminology a vertical hint hints a vertical stem. On the one side the FontLab terminology is more intuitive. On the other side it is contradictory regarding to the alignment function of hints. And it ignores the difference between a normal and a ghost hint. So I prefer<strong>ed</strong> to call a hint, that hints a vertical stem, a horizontal hint. But I am relatively sure, that it is defined in a specification. I only have to find it.</p>
      <p>Edited:</p>
      <p>From the Type1 blackbook:</p>
      <p><cite>The vstem hint, for each vertical stem (such as the legs of the<br>
      letter “n” or the leftmost and rightmost sections of the letter “o”)<br>
      takes two x values (expressed as x and delta-x) as arguments. These<br>
      two x values indicate the horizontal range that the vertical stem’s<br>
      width occupies in character space.</cite></p>
      <p>I change my opinion and call vstem hints vertical hints in future. Or vstem hints.</p>
    html_clean: |-
