      <p>It is little wonder that setsnap.pl indicates that "16" is the highest-frequency horizontal stem value, with 35,275 hits. (Keep in mind that the "Kanji" hint dictionary of this font includes glyphs for approximately 8,000 kanji.) In fact, the stem value of 16 is such a high frequency that we set only StdHW for this font, specifically a value of 16, and do not include a StemSnapH array. If I were to set a StemSnapH array, the stem value of 34 would be a likely candidate to include in it.</p>
      <p>Hopefully this helps to some degree...</p>
