      <p><em>Bold or black fonts, in which the contrast is stronger, seem to need more values.</em></p>
      <p>I don't think it's the contrast. There are often more quite distinct (numerically far apart) stem widths in the heavier weights.<br>
      That's because with reference to the desirability of an overall even quality in text, "colour" (or notan) is more apparent and more instrumental in bold weights than the thickness of stems.<br>
