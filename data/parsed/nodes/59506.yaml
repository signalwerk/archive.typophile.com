      <p>Arno,</p>
      <p>Your goal should not be to reproduce the standard stems of some of our fonts, because there are no "correct" values. Rather, think of this exercise in terms of choosing one of many possible "correct" or "appropriate" values.</p>
      <p>Science is used to reveal candidate stem values, either through simplistic calculations (highest-frequency, for example), or more complex ones (as the "-o" option of setsnap.pl uses, which takes resolution and point size ranges into account).</p>
      <p>Philosophy is then used to pick from among the candidate values, and a good rule is that if you cannot decide between two relatively close values, choose the lower of the two.</p>
      <p>Art even comes into play. Experience is also another factor.</p>
      <p>I also agree that you should not overthink this.</p>
      <p>If you'd like me to take a stab at a font, feel free to send to me the stemHist output files, and I'll let you know what I think are appropriate stem values.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
