    html: |-
      <p><cite>If you’d like me to take a stab at a font, feel free to send to me the stemHist output files, and I’ll let you know what I think are appropriate stem values.</cite></p>
      <p>Thanks, Ken. I would also send you a list of standard stems, from which I think, that they are well chosen.</p>
      <p>But another question: Imagine, that you have a font with the following real stem widths. (The font does not have any curves.)</p>
      <p>VERTICAL STEMS: 30 and 60<br>
      HORIZONTAL STEMS: 40 and 50</p>
      <p>Then I would set the following vertical standard stems:<br>
      30 and 60</p>
      <p>But I would think about deviding the sum of 40 and 50 for the one and only value of the horizontal standard stems, because the rasterizer tries to render in the width of the standard stems independent from the question, if their widths match with real stems. Would this be wrong? More to the point, there is no duty to choose standard stems, that really exist in the font, isn’t it? If, for example, the regular style and the italic style of a font are very similar in weight, I could use the same standard stems for both styles.</p>
      <p>And another thing with regard to bold and black styles: In my opinion it sometimes is better, not to provide any hints for those bold and black styles, but standard stems only. This often looks more smooth. Or alternatively vertical and horizontal standard stems, but vertical hints only. (Vertical hints hint horizontal stems.) Or as very elegant alternate way, vertical and horizontal standard stems and vertical ghost hints, that are exactly on the top and under the bottom of each glyph. I don’t know, whether that works, but I had this idea, when I saw the bar of a small t, which should align with the other small letters. I could not extend the alignment zone down to the top of the bar of the t, because there seems to be a maximum allowed width of alignment zones, but I have successfully aligned the bar of the t with the help of a ghost hint. (When I tried to extend the alignment zone down to the bar of the t, the alignment of all the other small letters did not work anymore.) And, surprise, if the ghost hint overlaps with the bar of the t and with the alignment zone, it will be additionally hinted.</p>
      <p>Yes, it may be, that I overthink this, but it really is hard to get detailed information about hinting without asking experts. The only tutorial with regard to PostScript-hinting seems to be David’s.</p>
      <p>----------</p>
      <p>Ken, I already have posted a bug report on the FontLab forum about the autohinting macro of the latest AFDKO. (The option "suppress hint substitution" does not work for sure and the option "allow changes in outlines" doesn’t seem to work.) But maybe it is better to contact the developers directly. Is there a better place, on which I can report bugs?</p>
