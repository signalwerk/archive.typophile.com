    <p>Hello!</p>
    <p>Ive been working on a new typeface design for<br>
    newspaper ingress, and book-text.<br>
    The idea is that  which is slightly condensed<br>
    but which doesnt appear that way. </p>
    <p>I would love to hear some critique and feedback here.<br>
    What do you think I should keep focusing on?<br>
    What are my biggest mistakes.. and so on...<br>
    Its still very much work in Progress.<br>
    (as you for sure can tell especially with upper case)</p>
    <p>Please take a look at the PDF,<br>
    (note;  I didnt kern the font yet properly, its just for a<br>
    quick sketch)</p>
    <p>Dag Brandsaeter</p>
