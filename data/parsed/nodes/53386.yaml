  html: |-
    <p>I was wondering if anyone could help me identify the typeface off of which this logo is based. The logo is from my school's literary sex magazine. I co-edit the satire page of the campus newspaper, and this week we're doing a parody of the magazine, so I'd like to make a parody logo, as well.</p>
    <p>Thanks!<br>
     </p><div class="imageWrap"><img src="http://typophile.com/files/opensexsurveyblue_6606.png"></div><p></p>
