      <p>Most probably a custom lettering somehow mixing influences from <a class="freelinking external" href="http://www.myfonts.com/search/ballantines" rel="nofollow">Ballantines</a>/<a class="freelinking external" href="http://www.myfonts.com/search/shelley+script" rel="nofollow">Shelley Script</a>/<a class="freelinking external" href="http://www.myfonts.com/search/edwardian+script" rel="nofollow">Edwardian Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/atmahogany-script" rel="nofollow">Mahogany MTI</a>/<a class="freelinking external" href="http://www.myfonts.com/search/monterey" rel="nofollow">Monterey</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/feel-script" rel="nofollow">Feel Script</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/jukebox/fenway-park-jf" rel="nofollow">Fenway Park</a>.<br>
