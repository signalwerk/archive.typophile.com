  html: |-
    <p>Hi there,</p>
    <p>Long story short, i would like to know if there is a perfect match for the chunky sans serif used on this cover</p>
    <p>first I thought about a Berthold BE bold extended, but the lowercase is clearly different</p>
    <p>then I thought about Aurora grotesk and went with Annonce by Canada type, an almost perfect match ... apart from the lowercase "r" whose ear is way longer.</p>
    <p><a href="http://www.myfonts.com/fonts/canadatype/annonce/" title="http://www.myfonts.com/fonts/canadatype/annonce/">http://www.myfonts.com/fonts/canadatype/annonce/</a></p>
    <p>Is there any other viable option apart from choping off the ear (ouch) of Annonce "r"?</p>
    <p>many many thanks,</p>
    <p>L. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cawthra_chp4_12j_4195.jpg"></div><p></p>
