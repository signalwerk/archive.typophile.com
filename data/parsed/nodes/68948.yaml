    <p>For an art project, a friend is looking for readily accessible fonts that would approximate these.<br>
    My first suggestions were:<br>
    - For ROLEX, an expanded, emboldened version of Open Baskerville<br>
    - For EXPLORER and SUBMARINER, Copperplate regular or light<br>
    - for SUPERLATIVE CHRONOMETER, ?</p>
    <p>What would you use to emulate these?</p>
