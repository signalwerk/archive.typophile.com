    <p>We've seen them in our travels, down the road from where we live and passed them on our way into work. They are signs and advertisements riddled with typographic errors that just make us cringe. They give meaning to the words, "Hire a Professional!" and instill in us the belief that wherever there is type, we are needed!</p>
