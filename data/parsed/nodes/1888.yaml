    html: <p>Flash has always supported anti aliased fonts (I'm hoping you wheren't just trying to be ironic here!) as flash is a vector based package. Pixel fonts are a bit of a fad, which (hopefully)  will pass. It's an escape route for 'web designers' who are scared of typography, choosing to make it small is the safe option. I suppose I'm being very generalistic here and that their are those who deliberately went out to use pixel fonts to tie in with a theme/style (the retro computer game look!). So why use pixel fonts? Well one of the problems with displaying type on screen at anything smaller than 8pt (some would argue 10pt), causes the type deteriorate in visual quality, where as pixel fonts are exactly that based on the pixels of your monitor. <br> <br>As for buying a piece of software to build these fonts?... I wouldn't.</p>
