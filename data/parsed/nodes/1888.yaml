    html: <p>Flash used to not support bitmap fonts. Preferring clear rendering (as opposed to blurry detritus) is not a fad, it's functional. The new Flash however does support bitmap fonts, although still not grayscale bitmaps. The good news is that Truth in Design has developed "Superpixel fonts" that fake gray dots via outlines. <br> <br>hhp <br></p>
