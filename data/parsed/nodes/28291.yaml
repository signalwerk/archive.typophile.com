    <p>You may all be aware of this website, but just in case you weren't i thought i'd share this typographic (or should that be glyphic for non-printed letterforms?) goldmine of inspiration i found purely by chance...</p>
    <p><a href="http://www.nb.no/baser/schoyen/index.html" title="http://www.nb.no/baser/schoyen/index.html">http://www.nb.no/baser/schoyen/index.html</a></p>
    <p>It seems picky to say, because the content speaks for itself, but it's a bit of a shame the website design doesn't really do it justice. If i weren't so busy i might offer a pro bono make over :)</p>
    <p>Here's a small sample of the wonderous beauties that lay within...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AristotelesEthics600w_5236.jpg"></div><p></p>
    <p>...i feel so talentless. Well, at least digitally fraudulent. All hail the scribe.</p>
