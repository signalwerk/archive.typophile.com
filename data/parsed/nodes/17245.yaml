      <p>Dav:</p>
      <p>It was a reference to a recurring joke on the animated TV show <a href="http://www.comedycentral.com/shows/south_park/"><cite>South Park</cite></a>.</p>
      <p>There is a character named Kenny who often gets killed in a humorous and grisly manner (only to be resurrected without explanation in the next episode). Whenever Kenny is killed, the following dialogue ensues between his friends:</p>
      <p><strong>Stan</strong>: Oh my God! You killed Kenny!<br>
      <strong>Kyle</strong>: You bastard!</p>
      <p>Sorry about that.</p>
      <p>Edward</p>
