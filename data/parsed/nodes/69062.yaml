    <p>Anyone know what font the word "PAWNSHOP" is in? I need to vectorize it, but can't seem to find an exact match. I'm not convinced that somebody spent the time to customize one, so I'm assuming I can find a pretty close match. Looked through dafont's western fonts and 1001fonts also, nothing that was right. Any Ideas?</p>
