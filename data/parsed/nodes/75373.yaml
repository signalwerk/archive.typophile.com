      <p>I like the ligatures — keep them.</p>
      <p>I think the spacing around 'Pears' needs some attention. 'Pea' is loose while 'ar' is tight. 'Pe' might need to be kerned a bit more in relation to 'ea'.</p>
      <p>'r' might be too small and next to 's' and 'o' it seems rather thick / heavy. It's shaped nicely, but it's just a tad short — same as last time :)</p>
