      <p>Thanks for the feedback so far. Penn, your always a great help. </p>
      <p>I've made the letterforms slightly wider to a. complement the 'panoramic photographer' type and b. address the characters relationships with each other. I've also made the curve of the s thinner and higher.</p>
      <p>I did have overshoot before. But since it looked like I didn't have any before doesn't that mean I did it right? or does it need to be more exaggerated? : )</p>
      <p>Also, In the bottom example I took out the ligatures. After looking at them, I feel I could go either way, however, I do like the ligatures, they add a little sense of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Wabi-sabi" rel="nofollow">wabi-sab</a> and are definitely more memorable. </p>
      <p>Thoughts? </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WillPearson_Typophile_03_4045.jpg"></div><p></p>
      <p>Also in this image are mocked up lock ups to show the type I plan to pair with his logotype.</p>
