      <p>Middle one also.</p>
      <p>Though it's feeling a tad disjointed for me. I think it's because both the tracking and the angle of each character makes everything seem like it's cropped awkwardly. The ligatures are also not helping with the tracking because it locks those two characters together, meanwhile everything else feels so loose.</p>
      <p>The bottom of the 's' feels too small especially in relation to the size of the bowls on 'e' and 'a'. It doesn't look like you have any overshoot on the 'e', 'a', 's' or 'o' which I think might help everything from feeling awkwardly locked in a box.</p>
      <p>Really like the feeling of this so far, a few edits and you'll have another great photographer logo.</p>
