    html: |-
      <p>Well, in Latin, "studium" means "eagerness" or "zeal."  Studium could have associations with studio, study, or student.  But Studeum, because of the 'e,' has too strong of an association with "student" to mean much else.</p>
      <p>--<br>
      Nick Hladek</p>
