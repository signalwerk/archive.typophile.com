      <p>thanks for the feedback -- this was actually the one thing i planned on keeping, as i had tried out shorter diacritics, but they didn't look good to me.</p>
      <p>in addition to that, vietnamese and other extended latin characters stack diacritics which effectively restricts using steep inclines or declines -- here's an example to illustrate what i mean (pinyin tones -- macron, acute and caron on top of dieresis):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SayItFat-uni01D8_3887.png"></div><p></p>
      <p>another problem would be that i'd have to change the dot accent and dieresis as well in order to maintain distinctiveness, as the other accents are based on them and it would disrupt the overall appearance -- but i will consider adding alternatives, thanks again for the suggestion. updates to follow.</p>
