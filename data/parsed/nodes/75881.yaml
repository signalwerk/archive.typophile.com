    <p>i would like to take the opportunity and ask for some advice/corrections in regard to the following project:</p>
    <p>a while ago i had downloaded the free font "say it fat" by timo titzmann -- <a href="http://www.id84.de/type/say-it-fat/" title="http://www.id84.de/type/say-it-fat/">http://www.id84.de/type/say-it-fat/</a></p>
    <p>while i like the style a lot, the original is very basic (~95 glyphs). i thus decided to overhaul the typeface and have completed the following codepages (the font is lowercase only):</p>
    <p>0000 - c0 controls and basic latin<br>
    0080 - c1 controls and latin-1 supplement<br>
    0100 - latin extended-a</p>
    <p>cyrillic is almost completed and greek and vietnamese latin are in the works, too. however, as this is my first font work proper and i am no type designer, there are loads of issues -- but it's a start.</p>
    <p>-&gt; <strong>đ</strong> and <strong>ħ</strong> need to be worked on, but the low ascender is a big problem here -- suggestions on how to handle it are very welcome. it would also influence the design of the cyrillic glyphs <strong>ћ</strong> and <strong>ђ</strong>.</p>
    <p>any feedback, tips, and/or help is appreciated (weird looking characters, inconsistency in design/appearance or the like).</p>
    <p>the original author has been contacted and has expressed interest in a possible update.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ec977ecf_3975.png"></div><p></p>
