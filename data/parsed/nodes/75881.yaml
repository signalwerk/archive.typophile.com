      <p>I think you will have an hard time with the kreska (<a href="http://www.twardoch.com/download/polishhowto/kreska.html" title="http://www.twardoch.com/download/polishhowto/kreska.html">http://www.twardoch.com/download/polishhowto/kreska.html</a>) ;-)<br>
      Seriously, I think that designing diacritics for a display face such as this one presents even more trade-offs than usual.<br>
      Overall, it seems that you are concentrating more on an aesthetic model and less on actual usage and recognisability.<br>
      Code-point completeness is a vain goal if the result isn't usable.<br>
      Make those accents fat! :-)<br>
      By the way, in this style of type, diacritics often reach above the ascenders. There are also several threads on the topic of diacritics, and about vietnamese ones (<a href="http://www.google.com/search?q=vietnamese+diacritics+site%3Atypophile.com" title="http://www.google.com/search?q=vietnamese+diacritics+site%3Atypophile.com">http://www.google.com/search?q=vietnamese+diacritics+site%3Atypophile.com</a>).</p>
