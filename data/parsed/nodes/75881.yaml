      <p>thanks for the links, riccardo!</p>
      <p><strong><cite>I think you will have an hard time with the kreska</cite></strong><br>
      i have a hard time with the entire font so far ... i think the kreska aspect is something way beyond my scope, requiring glyph substitution and ot programming (i'm just an interested layman). i will probably have to sacrifice typographic accuracy in this case.</p>
      <p><strong><cite>1. Overall, it seems that you are concentrating more on an aesthetic model and less on actual usage and recognisability. 2. Code-point completeness is a vain goal if the result isn't usable.</cite></strong><br>
      1. i don't know if the two are really mutually exclusive. 2. i'm a completist, there's no way this will change anytime soon.<br>
      as a matter of fact, i had made a pdf specimen with sample paragraphs in various languages -- it looked alright to me in croat, german and french (which i speak). but you have a valid point nonetheless.</p>
      <p>the pdf (italian included, plus a number of other languages, eastern and western european):<br>
      <a href="http://www.mediafire.com/?iof46nel7jxun1y" title="http://www.mediafire.com/?iof46nel7jxun1y">http://www.mediafire.com/?iof46nel7jxun1y</a></p>
      <p><strong><cite>Make those accents fat! :-)</cite></strong><br>
      alright, alright! consider it on the list. this means i will have to start over again ... wonderful (especially if i take into account how anal i am about never letting go of unifinished things).</p>
      <p>what bothers me more than the accents right now is still the way the đ (croat d) and the ħ (h bar) turned out.</p>
      <p><strong><cite>The acute and grave could be better distinguished if you cut them in half and made the low end start at or near the center of the letter.</cite></strong><br>
      as written above, i'll make an alternative version with heavy diacritics. the original had three characters with diacritics (strictly speaking there are five, with the i and the j): ä, ö and ü -- i took their design as the starting point for the others.</p>
      <p><strong><cite>You'll probably have to start over with the eszett after you've learned more about it.</cite></strong><br>
      kevin, i'm german.<br>
      but if you mean typographic conventions, then you're correct. the current shape has been a deliberate decision (which doesn't mean that it's right -- i happened to like the flow of the form coalescing). thanks!</p>
