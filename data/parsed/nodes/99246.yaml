      <p><em>Does the 'asymmetric' antialiasing mean that horizontal stems are confined to full pixel positioning?</em></p>
      <p>Yes.</p>
      <p>In DirectWrite you can control at what pixel size range(s) asymmetric/symmetric antialiasing should be applied. You need a <a href="http://www.microsoft.com/typography/otspec/gasp.htm" rel="nofollow">version 1 gasp table</a> for that and use the GASP_SYMMETRIC_SMOOTHING flag.</p>
      <p>If a version 0 gasp table is present (or, iirc, a v 1 gasp table without the symmetric smoothing flag), symmetric smoothing will be applied from 21 ppm upwards.</p>
