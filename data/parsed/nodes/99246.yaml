    html: |-
      <p><em>This is what I'm not quite getting. Isn't that true of all anti-aliasing?</em></p>
      <p>No, because in previous antialiasing glyphs have been positioned on full pixel widths, i.e. the 0,0 coordinate of each glyph's advance width has always been positioned on the leading edge of a pixel. This was also true of ClearType subpixel rendering in the GDI implementation. This accounts for sometimes uneven spacing in traditional greyscale and GDI ClearType.</p>
      <p>In DirectWrite ClearType and Metro greyscale antialiasing, fractional sub-pixel positioning is used, i.e. the 0,0 coordinate of a glyph may occur anywhere within the pixel. What is means is that spacing is much more even, but that there is variation in the actual pixel pattern for the same glyph at different places in a line of text. In the Metro greyscale rendering, this variation displays as differences in the grey tint of pixels (in DWrite CT it displays as differences in the colour tinting, and is generally more prevelant and noticeable than in the Metro greyscale). This is why I classify the Metro greyscale antialiasing as 'sub-pixel', because the pixel tint is being affected by the position of the glyph according to fractional positioning.</p>
    html_clean: |-
