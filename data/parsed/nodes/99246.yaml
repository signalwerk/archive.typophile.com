    html: |-
      <p><em>Does the 'asymmetric' antialiasing mean that horizontal stems are confined to full pixel positioning?</em></p>
      <p>No. In the context of Metro rendering, asymmetric refers to the difference in x- and y-direction supersampling (at text sizes). The rendering is 8x4 greyscale, meaning that the x-direction antialiasing has double the senstitivity of the y-direction antialiasing. Because of the sub-pixel fractional positioning, the x-direction benefits from this higher sampling resolution to maintain decent stroke contrast, whereas the y-direction, which is constrained to full pixels, can make do with a lower supersampling. At larger sizes, the Metro renderer switches to symmetric 4x4.</p>
    html_clean: |-
      <p><em>Does the 'asymmetric' antialiasing mean that horizontal stems are confined to full pixel positioning?</em></p>
