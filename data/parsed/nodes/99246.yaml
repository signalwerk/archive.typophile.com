      <p>Ben, here is a good general description of the change in font rendering in Win8, with examples:<br>
      <a href="http://www.extremetech.com/computing/138816-windows-8-the-desktop-review/3" title="http://www.extremetech.com/computing/138816-windows-8-the-desktop-review/3">http://www.extremetech.com/computing/138816-windows-8-the-desktop-review/3</a></p>
      <p>Broadly speaking, there are now three main ClearType rendering modes (with some version-specific variations in the GDI rendering):</p>
      <p>GDI : x-direction colour subpixel antialiasing, no y-direction antialiasing, full-pixel spacing.</p>
      <p>DWrite : x- direction colour subpixel antialiasing, y-direction greyscale antialiasing, sub-pixel positioning.</p>
      <p>Metro : x-direction greyscale subpixel antialiasing, y-direction greyscale antialiasing, sub-pixel positioning. [Note also: at small sizes the x,y antialiasing is asymmetric, at larger sizes it is symmetric.]</p>
      <p>All three of these rendering environments may be encountered in Windows 8.</p>
    html_clean: |-
