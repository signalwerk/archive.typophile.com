      <p>Hrant: David, what are you getting at?</p>
      <p>Well, you asked what font related bla bla bla Windows 8 bla bla bla. </p>
      <p>My point, as illustrated far above, aside from the indic of Hudson's grey, is that this windows renderer, and all CT rendings i have seen so far, (when the stem is between 1 and 2, or 2 and 3 device pixels), is lighter than it should be.</p>
      <p>That's a relative lighter for sure, so I'll qualify it as being lighter than everything but other versions of itself, where everything includes the Mac, all other non windows renderers and print, of compatible stroke width of course. </p>
      <p>Zoom around the glyph yourselves, doing your best with asymmetrical rendering, right? The y stems are color retarded towards high contrast, losing the actual remainder pixels which are whitened (CT) or lightend (CTDW), and the renderer must compensate on the x stems or else all fonts would have to be redrawn. (MS original, barely heeded, recommendation). </p>
      <p>You can see this clearly happening exactly as John describes it in my last posted specimen. Mac has no contrast, windows has a little more, and windows? it's all lighter, even when it's not specified as grey. </p>
      <p>That is my windows 8 problem. But still, I can't wait to get my hands on a loaded surface super pro with a telephonic keyboard, surroundish sound and a built in widescreen projector for impromptu elevator disco parties, and then read on the iPad later.</p>
