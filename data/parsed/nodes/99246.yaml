      <p>On the left is the Metro greyscale antialiasing (this screen capture was from the public beta of Win8; I don't know if the rendering was further tweaked for the release version); on the right is the same text string in GDI ClearType antialiasing. Zoom in to see the use of grey only in the Metro rendering and colour in the GDI CT. Note that stem weights are more consistent in the GDI CT rendering, but spacing is more consistent in the Metro rendering. Note particularly the above-line clash of the reph mark and following ikar in the GDI CT rendering, which has resulted from the full-pixel positioning bringing the latter too close; this is much better with the Metro fractional positioning (but would be better still with DWrite CT, which would have better stem weight consistency).</p>
