    html: |-
      <p><em>What's supersampling?</em></p>
      <p>Think of a glyph outline being stretched to a larger number of pixels than actually requested for the target display size/resolution, and then the mapping of the outline to those pixels being downsampled (like a scaled down JPEG) relative to the requested size. So in the case of an 8x4 asymmetric supersampling, each pixel in the requested ppem size is first represented by 8 horizontal pixels and 4 vertical pixels, and then scaled down to the requested size. Obviously at larger sizes more refinement of the relationship of outline to pixels is possible and hence more antialiasing precision (samples) is available. This captured information influences the rendering at the target size, where the relationships that were relative to pixel dimensions in the supersampling become relative to sub-pixel dimensions in the final rendering.</p>
    html_clean: |-
