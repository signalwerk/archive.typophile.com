      <p>&gt;Maybe, but Win 8 PCs and tablets are selling poorly so far.</p>
      <p>Well, f--k ME!<br>
      It's JamesM!<br>
      How ya been? And Happy New Year.<br>
      Been taking your Tourettes medication I see....</p>
      <p>Well - as far as Microsoft and tablets - in da woids of da foundah, "We are patient people".</p>
      <p>Me (and my wife, too) will most definitely buy a Surface Pro Tablet at some point in the next year and I agree with <a href="http://pogue.blogs.nytimes.com/2013/01/10/microsofts-surface-pro-tablet-changes-the-game/" rel="nofollow">David Pogue that it's a game changer</a>.<br>
      Oddly, it got released post-Christmas.  (So slow sales, no surprise. But it wasn't designed to be a stocking stuffer anyway. It would have just gotten lost in the shuffle - to its detriment.)</p>
      <p>If someone is used to Windows software and they need to stick with some legacy apps but yet "move up" to Win8, what's the other choice for the average user? Especially business users? Nothing as far as I can see.<br>
      (Hey, haven't we seen this before?)</p>
      <p>I think they have to be careful about price, though. Over the long term, Android mobiles are going to be constantly biting them in the ass from below and the one thing they can't afford is to hold an umbrella over them. If you space enough hundred dollar bills between the two options then Google Docs starts looking better and better.</p>
      <p>I use Apple products on a daily basis and their reputation for ease of use is bullshit. Good quality hardware, yeah.  And it holds its value well - I've never lost money on an iPhone resale yet.<br>
      But it still costs too much and all I get for the money is glitz.</p>
      <p>What was this thread about again?</p>
