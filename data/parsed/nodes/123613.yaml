    html: |-
      <p>Sorry, but House Industries is the only source for Neutra Face, and Display is only sold as a family (13 fonts) for $150.00. As far as I know, you can’t purchase single weights.</p>
      <p>But, you might want to email the folks at House Industries and ask if they would be willing to sell just that weight to you. The worst they can do is say no....<br>
      <a href="http://www.houseind.com" title="www.houseind.com">www.houseind.com</a></p>
