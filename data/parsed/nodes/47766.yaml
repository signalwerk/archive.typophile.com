      <p>Back to the main issue: Do you seriously expect that OpenType fonts do <em>not</em> make use of the things that quality them as OpenType fonts in the first place -- just because some application developers do not see a need to support these things? You better make some noise to wake up application developers than accusing font developers who take their job seriously and have a hard time anyway when it comes to find a balance between setting free OpenType's power and working around applications' restrictions.<br>
