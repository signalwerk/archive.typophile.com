    html: <p>I just went back and re-read a very lucid explanation by John Hudson. Has anyone tested to see if Q8 yet supports extension format lookups? Thinking of it from the font development side, I can imagine some frustration when an OS or application doesn't fully support useful features present in the font spec. The application developers have their frustrations too, because the fonts they're trying to support are actually a bit of a moving target, and end users are unlikely to have much sympathy. However, it's simply an engineering issue that requires some effort to overcome, not a deep philosophical dispute about what format to use.</p>
