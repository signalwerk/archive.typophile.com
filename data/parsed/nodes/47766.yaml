      <p>Quark had all the time in the World to "kill" InDesign at version 1.0 and their arrogance at the time got the better of them. By that time, you could get the Creative suite upgrade for just having a PhotoShop license and it was all over for them.</p>
      <p>But that wasn't my major problem with XPress; the poor screen quality of what I was working on was. Type looked terrible, so kerning was impossible until you output your work. Images were poorly pixilated and you just had to guess what your work looked like until you printed it (which could take 20+ minutes for a complicated layout).</p>
      <p>The Agency I'm at right now put up with XPress through 6.5, but when we upgraded to Mac/Intel workstations, the writing was on the wall for Quark. I had used InDesign since v1.0 and another art director was already using CS1, so it wasn't hard to transition the other 5 designers in our group to InDesign CS2. Sure it required a lot of emergency "come over here, I can't get this/somethings not working right" situations, but so does XPress with young designers (its them, not the programs).</p>
      <p>The worst thing still about XPress sounds like you have to spring a lot of extra money for basic functionality (of InDesign) with plug-ins. And are PDFs still rendered through that JAWS garbage that gave you horrific looking fonts and vector art renderings? That was a nightmare in 6.5.</p>
      <p>I can place a PDF (and determine what page displays) AND a INDD into another INDD file as a graphic. Let me know why you think this isn't that big of a deal and I'll elaborate (as if I haven't with this post already).</p>
      <p>To "Billtroop: about the optical type settings in InDesign - I agree they stink and do some very weird things to fonts. I never use the setting but we have one guy at the agency who sets all his layout up this way. Every time I pick one up it bites me in the ass. The only reason he does this is that "ones"=1 don't kern right on the Mac and optical settings means he doesn't have to kern ones all the time.</p>
      <p>I hope the best for Quark because I'd like to see the only competition left stay alive. I'll fork out the $299 to upgrade my personal license, but I haven't used the program or the last two years, because I don't HAVE TO.</p>
      <p>VIC</p>
