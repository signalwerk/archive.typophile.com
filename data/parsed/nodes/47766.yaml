    html: |-
      <p>I'm a Studio Manager and I'm transitioning a creative department of 30+ to InDesign now. After Sept 1st all new jobs will be created using ID. I have trained all myself and some of us have gone through individual training to support those who have a longer, tougher learning curve. </p>
      <p>I have used QXP for years and ID since it's weak conception years ago. But I have to say it is really a spectacular app now. So many features that really make workflow simple. Aside from a few minor glitches here and there, you can't beat the Bridge/PS implementation, placing multiple, easy automator and applescript implementation, export without fail PDFs, Glyphs, layer control in PS. Most of these features without weak quark extentions or plugins. I always hated how people would say to me when I complained about quark, "you can do that, with this cool extension" - yeah great, if you have to outfit 50+ user licenses, that's the kind of shit i can't stand.</p>
      <p>Out of the box InDesign does some pretty thought out stuff. It does take a while to load, just like all adobe apps these days, they have really become memory-dogs. I use lots of the functions in Bridge to catalog photoshoots for creatives, libraries, collections, and the place in ID function from Bridge is great, especially if you add keywords to selects when they are approved.</p>
      <p>Great, in Q8 you won't have to import images into boxes, just like ID, well too late. I like the ID double-click, then single click the box to edit it's content, then double click again to edit the container (or get back to the black arrow) and, I though in Q4 you have single keystrokes that would choose tools, or at least a 2-key combination. I use so many shortcut claws it's ridiculous! Lucky I play guitar! </p>
      <p>Also, that horrible export to pdf, if you don't have the right preference set, you get a gibberish file-name! Quark just didn't care about it's customers for too long for me to hang in for 8. I wouldn't eat a restaurant that kept serving me bad food, or had horrible service! I will however, get takeout, if the food is good. So I will purchase a few licenses of Q8 so I can test drive it and in the unlikely event that an outside agency partner of ours sends us over some Q8 files - it'll never happen!</p>
      <p>Well good luck all, I am personally psyched to be knee-deep in a cluster-F of transition! hahaha! Creative anxiety is sooooo satisfying!</p>
      <p>Peace!</p>
