      <p>Most of my straight book layout work, like 80 or 90%, I'm supplied Quark templates. I'm just not seeing InDesign overtaking Quark yet, tho' I get an InDy job once in a while. InDyCS2 was certainly an improved type engine over InDy2, which I cut my InDy teeth on. Quark 7.3 most certainly does not suck. But I still think there ought to be room for both of them.</p>
      <p>There's plenty wrong with monopoly. Without choice, there's no chance that pricing won't continue to skyrocket. And there's no real incentive for meaningful advancement in the product without a competing product.</p>
