      <p>I also hope it gets cheaper, or people will stop buying it. InD is making inroads all over the place, particularly when a group needs to buy new software. The bottom line argument is hard to beat. I agree with Kent that there are places that will probably never stop using Quark as long as the company is still around, but that mentality will only keep them alive for so long. It reminds me of how GM got addicted to fleet sales (to car rental companies) and ended up screwing themselves by losing sight on capturing new buyers to keep their consumer base stable.</p>
      <p>Full disclosure: I shed QX about 4 years ago.</p>
