      <p>People talk about Quark’s rude customer support. That is a thing of the past. As Quark's support has gone up, Adobe's has gone down. </p>
      <p>Over here, <a href="http://typophile.com/node/48059" title="http://typophile.com/node/48059">http://typophile.com/node/48059</a> there's a vigorous thread on why Adobe's Arno Pro typeface won't work properly with Xpress 7, Xpress 8, Microsoft Word 2007, Microsoft Publisher 2007, and who knows what else.</p>
      <p>Adobe's response to Nick Cooke's enquiry was blistering:</p>
      <p>’We, the Adobe Type Group, definitely have better things to do with our time ... no reason for it not to work in QuarkXPress ... Your concerns about Arno Pro’s kerning have no ground...stop wasting my time with nonsense....’</p>
      <p>I gave CS3 Mac Directory magazine’s annual award this year. On balance I thought it was earned, mainly for the small though brilliant improvements in Photoshop and for the purchase of Dreamweaver. I didn’t think much of what InDesign and Illustrator had racked up since CS2. But had I known that Adobe was bundling CS3 with core fonts that don’t work with other apps, I would have placed the award elsewhere, explaining my reluctance. I only wish I’d been aware of this problem a few months ago.</p>
      <p>And frankly, Adobe’s customer response in this forum is enough to ban it from ever getting an award from me until the company can prove to me that it is treating its customers better than this.</p>
