      <p>Quark costs $800. Adobe InDesign comes with CS3 (Design Premium) for $1800. For that extra $1000 you have a bundle of essential software: Illustrator, Photoshop, Acrobat, Dreamweaver, Flash and Bridge. Not to mention their key sales tactic of bundling by selling a 'workflow' solution.</p>
      <p>So to say it doesn't suck is hardly going to motivate the masses into a purchase. Quark dropped the ball and rejoined the curve too late. They will need to offer some serious value to compete - which I see they are trying to do with the web features in Quark 8. I have yet to see any serious web development come off the back off page layout software so we will have to wait to see.</p>
