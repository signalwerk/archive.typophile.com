      <p>There's not a single "customer" involved in the other thread.<br>
      Nick Cooke is not a "customer" but a fellow type designer (Olicana) who has problems with one of his own fonts, see the very first sentence of the very first post: "I was testing one of my own fonts". So the entire thread was not a discussion between type-users and type-producers, but a discussion among collegues.</p>
      <p>Indeed I <em>do</em> read entire threads before replying anything.</p>
      <p>canderson -- <cite>Thinking of it from the font development side, I can imagine some frustration when an OS or application doesn’t fully support useful features present in the font spec. The application developers have their frustrations too, because the fonts they’re trying to support are actually a bit of a moving target,</cite></p>
      <p>Very true as regards the first part. This always brings up questions like the one in question, whether or not to apply something like extension lookup type or more than one lookup in the kern feature.<br>
      As to the second part: Since all that font developers can do with available tools is producing fonts that are built according to the specs, there is no moving target. Application developers should simply bite into the sour apple and invest the time to support specs completely in one step, rather than bits and pieces that are likely to be found in available fonts -- that indeed would make an odd race between apps and fonts. Also, application developers should document which parts of the specs they <em>don't</em> support, rather than font developers justifying what their fonts <em>do</em>.</p>
      <p>This is a XP8 thread however. So I should emphasize that I have <em>not</em> yet tested XP8 and cannot say anything about it. My remarks are about applications and support of OT layout tables in general.</p>
