      <p>I've always loved Quark, and I would have loved InDesign to work as it was conceptualized, but I have always found the interface bad and the advanced typographical features other than OT access useless. The optical kerning feature, as I've discussed in a couple of reviews, is a sham which makes Adobe's own fonts look like crap (just look how it respaces the word jumps in Adobe Garamond OT Pro 12 point).</p>
      <p>Optical alignment never worked because of the presets. Emdashes and hyphens hang out of the margin like smuts on a mechanical. Quark 8 finally has optical alignment, and it is totally customizable. That's how it should be. </p>
      <p>And multi-line justification is overrated in Adobe's skimpy implementation.</p>
      <p>These problems would be acceptable in version 1 software. But we're at version 4 already and none of this has been adjusted.</p>
      <p>I am also far from convinced that the user base of Indy is as large as Adobe claims. Sell a copy of CS3 and you've registered a sale of InDesign. But how many people are actually using it? </p>
      <p>Macromedia used to bundle Fontographer with a suite, registering millions of sales. But how many people were using Fontographer? A very few thousand at most. </p>
      <p>That said, Adobe has done very well getting Indy into the education channel, and Quark's prices still seem too high. </p>
      <p>But Quark is a _very_ different company from what it was in the Fred Ibrahimi days. This is a company that wants to please, wants to innovate. They're fighting for survival, and I think they're doing it intelligently. </p>
      <p>Whatever - - the fact is that competition is the only for us to have great software. The only thing we have to dread is monopoly. Think how much faster Photoshop would be if there was a creditable competitor ? WOW!</p>
