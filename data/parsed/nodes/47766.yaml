      <p>There are still segments of the industry that are built on Quark infrastructure. Book publishing is the one I know. Because of a lot of legacy material (at least, for those that maintain any kind of backlist) and intricately integrated Editorial-Design workflows, many have continued along with behind-the-curve versions of Quark. </p>
      <p>If Quark 8 re-enters the fray as a suitable, up-to-date alternative to InDesign, then these industry niches will no longer need to confront the painful process of switching over. (I know: I've led a company through that transition. It was the right choice at the time; but it was not easy, nor intuitive, nor fun.)</p>
      <p>-- K.</p>
