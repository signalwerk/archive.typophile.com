    html: <p>Anyway, why on earth does it have to be one or the other? I always use everything. Years ago I loved Quark and disliked PageMaker, but I never would have set a long book in Quark. Although I have always preferred Quark for I think is its vastly superior interface, I would never hesitate to use InDesign for something I thought it would excel in. I like having a Mac, I like having Windows, and I like having all the software that could possibly be useful to me. I don't see where an X vs Y mentality would get me anywhere. As a type designer, I remain very annoyed with Adobe for not implementing its 'superior' typographic features better. And I am deeply alarmed at the disappearance of rivals to Photoshop and Illustrator. The best ideas in Illustrator since the late 90s have all come from the pioneering program LightningDraw GX which is also gone. Where are the new ideas going to come from ?</p>
