      <p>What is a "direct tracing"? Because that can mean about a billion things, none of them necessarily making it more accurate than another. In fact, without the original drawings or matrices, any "Garamond" is going to be subject to the type designer's whims and interpretations of the printed type specimens. </p>
      <p>That being said, Slimbach's Garamond Premier Pro is considered to be the *most accurate* rendition by most Typophilers, and will probably be as close to "original" as anyone can get short of resurrecting Garamond himself.</p>
