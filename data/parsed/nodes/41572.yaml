      <p><cite>The other problem I’m having is obtaining the original version of Garamond. I’ve studied the Egenolff-Berner foundry specimen of Garamond from 1592. But ideally I would need a digitised version of the original. Does such a thing exist? Has anybody made an accurate digital version of the original?</cite></p>
      <p>I can't help you with most of your questions, what I know is the common stuff of Granjon, Jannon, etc. But that last question is an interesting one -- what is the original? Is it the punches? The specimen? You've probably read Smeijers <cite>Counerpunch</cite>. Did whoever made the punches test them by lightly inking them &amp; pressing them into paper? What was he looking at as he adjusted the punches -- or did he bother?</p>
      <p>Ink &amp; paper &amp; printing were different then, too, so whatever was looked at was based on that technology. If you are just after a pure mechanical size, I suppose the punches themselves would give the dimensions of "the type." There would always be small variations in the printed type. But those dimensions aren't particularly interesting, either, nor would they show variations with current digital Garamonds, where (we hope) the digital punchcutter also look at the results of a printed specimen -- &amp; then decide whether to go with a version that worked best with (1) a laser printer, or (2) high resolution offset, the latter coming form either (1) repro-negative-plate, or (2) direct-to-plate.</p>
      <p>You get different answers depending on how you first answer these questions.</p>
