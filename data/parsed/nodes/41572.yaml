    <p>Apologies if this has been asked before, but I've searched and not been able to come up with any conclusive answers. I'm in my last year of my Graphic Design course at Staffordshire University. I've been studying the originality of Garamond to produce a set of designs which highlight how Garamonds originality has been lost throughout it's many versions. </p>
    <p>Basically without me going into great depth and detail. I was wondering if anybody knew which are the most prominent versions of Garamond and the characteristics which define them from the original 16th century cut, for example x-height. I'm going to end my design with ITC Garamond as I believe this is the furthest deviation from the original.</p>
    <p>The other problem I'm having is obtaining the original version of Garamond. I've studied the Egenolff-Berner foundry specimen of Garamond from 1592. But ideally I would need a digitised version of the original. Does such a thing exist? Has anybody made an accurate digital version of the original? </p>
    <p>I'm sorry to ask so many questions, any help would be greatly appreciated.</p>
