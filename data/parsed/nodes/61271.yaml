    html: |-
      <p>Hi everybody,</p>
      <p>I am the designer of Flaminia OS. Sexy? Thank you SuperUltraFabulous. :)</p>
      <p>Flaminia is a typographic system that allows its users to test the readability of fonts that can be used in wayfinding projects. It is a system not yet fully usable for writing (it was started as an experimental thesis), and its aim was to create a very fluid system that could have variables added and removed in order to always be an up to date research instrument. Although its glyphs are not all completed yet, the multiple masters and the variables I dedcided to take into consideration are already all present, and the .vfb files provided allowed the design of the signs pictured above.</p>
      <p>Mr Puckett, how exactly does Flaminia OS remind you of Aptifer? The design of Flaminia is all explained in the research book readable on my website and the shape of the glyphs designed derives from a research of the characteristics of the most common typefaces used in signage. Being a multiple master system, Flaminia has many shapes that can be combined, and the instances I decided to extrapolate and print on the signs are only a few.</p>
      <p>Anyways, whoever would like to contribute to the project is very welcome, I understand the limits of an uncomplete system like Flaminia, but really believe that a global effort could result in a very interesting and useful tool.</p>
      <p>Cheers from Italy,<br>
      a.</p>
