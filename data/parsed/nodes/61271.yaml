    <p>Take a look at the sexy Flaminia OS. It open source too.<br>
    Bummer tho, the font files are only available in VFB format so you have to roll your own MM instances. Nothing pre-made. No packaged Postscript or OpenType fonts that I could find.</p>
    <p>There wouldn’t happen to be open source tools for that purpose would there?...</p>
    <p>Free or not, there are a couple of commercial types by some big playas that are not as well designed as this... or at least, I think Flaminia is better looking design.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/flaminia03_5938.jpg"></div><p></p>
    <p><a href="http://www.mintea.org/flaminia/" title="http://www.mintea.org/flaminia/">http://www.mintea.org/flaminia/</a></p>
    <p><a href="http://www.theleagueofmoveabletype.com/fonts/3-flaminia-type-system" title="http://www.theleagueofmoveabletype.com/fonts/3-flaminia-type-system">http://www.theleagueofmoveabletype.com/fonts/3-flaminia-type-system</a></p>
    <p>Mikey :-)</p>
