    html: |-
      <p>Like Darrel, I get a Soviet-era propaganda feeling from this (the red star triggers that response in Americans old enough to remember the cold war).<br>
      The figure doesn't say "healthy athlete" to me; it looks more like a very strong robot. Overall, it's extremely macho, as if the client assumes that their product(s) will not appeal to women (which may be true, in which case macho is the way to go).</p>
