    <p>Roundtop Sans in a newspaper today.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/UnknownRoundtopInTodaysNewspaper_5986.jpg"></div><br>
    B is rounded, top and bottom, like R. D, F and L are not rounded on lhs. W is flipped M. C has terminals like S.  G has crossbar on inside and vertical spur. K arm and leg are straight lines that meet at lhs vertical stroke. Myfonts and identifont find a number of similars, but no match. Any ideas? Thanks.<br>
    Don<p></p>
    <div class="field field-type-text field-field-solved">
