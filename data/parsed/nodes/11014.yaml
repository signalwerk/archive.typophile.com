  votes: null
  html: "<p>Hello, <br> <br>I know this isn't directly type related but I am looking for a good blank T-shirt company that carries all of the colors in the rainbow in infant sizes. I have looked all over the place and all I can find are cheesy pastels. I am looking for some good rich bold colors. Anyone have an idea? Please contact me : <a href=\"mailto:jeff@jeeto.com\">jeff@jeeto.com</a>. <br> <br>If I am able to work with a recommendation you have I will send you a canvas hot off the press from our company : <a href=\"http://www.jeeto.com\" target=\"_blank\">http://www.jeeto.com</a>. Ill sign it myself and make you all happy and stuff. <br> <br>Thanks in advance!</p>"
