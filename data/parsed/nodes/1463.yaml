    html: <p>I don't see you as a jerk, but a bit uninformed. You didn't explain your needs in the original post, so you got a reaction to the information you gave. This gem, "I fully appreciate Isaac's posting on my site now but I would say that photography definitely has far more imagination than a simple few words of a font," only furthers the impression that you don't understand the point (from my perspective). <br> <br>A) The typesetting (or copying, as you put it) is only <i>part</i> of the equation. <br> <br>B) The font <i>as a whole</i> represents a lot of time and energy and creativity. <br> <br>You indicated in your original post that you wanted to circumvent the purchase of a font that you recognized and costs only $40. Why not add that negligible cost into your bill? The time spent on the purchase and typesetting alone should cover it anyway. Redrawing a font that isn't made of basic geometric shapes is time-consuming and difficult, and will just result in a sub-standard product anyway. <br> <br>Your needs are understandable, I'm put in that position occasionally as well, but you've stumbled onto issues that are large and long-running. If you want to people to understand your needs and your situation, then write clearly and completely next time. Just asking for free font outlines and typesetting without explanation doesn't garner much sympathy. <br> <br>I'm also curious what 'imagination' has to do with anything, as well.</p>
