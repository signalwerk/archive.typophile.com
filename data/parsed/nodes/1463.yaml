    <p>Hi folks, me again. <br> <br>It would have helped that if on my earlier thread, I'd have given the font name!! <br> <br>If ANYONE has a copy of Charlotte Sans Book and would be kind enough to set the text: NETWORKING SOLUTIONS LTD and then create outline and mail it to me, I'd be much obliged. <br> <br>Thanking you, Ian <br> <br><a href="https://web.archive.org/web/20070714142623/http://www.igimages.co.uk/" target="_blank">http://www.igimages.co.uk</a> <br> <br>I copied this post from MyFonts. Its pretty bold to ask someone to create artwork from a font they don't have and have it sent to them. Its a twist on "can you send a font to me for free". I included the email address because this guy needs to know its soooo wrong. Any thoughts, Dan</p>
