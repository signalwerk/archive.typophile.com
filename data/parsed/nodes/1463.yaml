    html: <p>In future I shall just use the scan that my customer provided and redraw the whole word and that way I shall keep everyone happy. How many times have you designers out there redrawn a 'no smoking' sign even though it was once drawn up by a designer who probably doesn't receive any more royalties for it. <br> <br>I fully appreciate Isaac's posting on my site now but I would say that photography definitely has far more imagination than a simple few words of a font. <br> <br>No, I would not class myself as a jerk, clueless or even a leech and I sincerely apologise for causing so much trouble. I would just class myself as asking a favour that one day I would like to return. As I said, I could have redrawn the words by blowing the jpeg up to around 400% but that would have taken time and that was against me. <br> <br>As a matter as interest, how many of you designers have been influenced by other's work and have incorporated an element of that design in your own work? How many photographers have tried to copy Ansel Adam's work, or how many painters have tried to copy Picasso's work? Do you get what I mean? <br> <br>Once again, I'll just spend that extra bit of time recreating the whole thing. This was part of a logo for a company based in England and I usually contact the particular company direct for their logo and that way I'm not in breach of copyright. <br> <br>Can't believe I've caused so much trouble over a rather innocent request and I can't apologise enough. <br> <br>Ian 'the jerk' Gregory</p>
