    html: <p>I have no objections against asking someone to set something in a font and convert it to outlines. It's not like 'borrowing' an actual font. The critical data is not in the outlines. But, for me, it's much easier to buy the actual font because you can do so much more with it, for such a small price. If you were to charge for the typesetting service, how much would you charge anyway? $50? I'd rather buy the font! <br> <br>That brings me to a question... I'm doing an identity program for a client using Luc(as) de Groot's Corpid. Now, they want me to set their address in Corpid in a proper format, as an outlined EPS file so they could drop it into their documents without having to buy the actual fonts. Is that acceptable? Just wondering...</p>
