    html: <p>Sergej... I think most people here do think in other terms than money. If you do work honestly as a designer or even as someone who designs type, you always end up underpaid, except if by some magic trick you end up being the next Neville Brody, David Carson or Stefan Sagmeister. You always put love in your work and do the details and stuff like that ... an no client ever pays enough for that. You don't become a designer for the money... and if anybody does, he or she will end up disappointed. As with any craft, I guess. You do it because you love your job.  <br> <br>&gt;you should be nice to people around you when  <br>&gt;you can <br>Most folks here are -- check out the typograhic ID section, It takes TIME to identify typefaces for the people asking here... and while other companies charge money for font identification, here it IS free.  <br> <br>The problem here is that the initial poster from MyFonts.com isn't willing to spend 35 $ or whatever it is on Charlotte Sans and NETWORKING SOLUTIONS LTD. doesn't sound as if he's doing a work-for-free or thing or a student job here, does it? And for a simple sample, there are enough type teasers on the web -- as on the Fontshop site -- to get a gif of the visual feeling of Charlotte Sans, but no, he wants a useable and scaleable and editable EPS -- ergo he wants to save money on not buying the font.  <br> <br>If he were a student or would make clear that it is pro-bono work, he'd probably gotten his outline. I've yet to meet a small-minded and petty type-designer.  <br> <br>I agree with your initial POV, that people should be nice to other people, but most remarks here didn't strike me as arrogant or mean-spirited but rather as tongue-in-cheek until you kind of  PO'd Yves and some others. </p>
