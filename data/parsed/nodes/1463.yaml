    html: "<p>Sorry for a late reply, guys, but I had my reasons. I'm no goddamn weasel. <br> <br>I never <i>wanted</i> to have a long-winded discussion about all this shite because the absurdity in that only makes me more disappointed in you. The absurdity is in the fact that it would take you five minutes to help a stranger who politely asked for help if you <i>were</i> able to provide him with the outline, but instead you choose to use your \"valuable\" time on talking out of your asses. This is what prompted me to write the original comment in the first place, so absurdity laughs me in the face when I see you continuing being totally clueless. <br> <br>I do mind answering a few questions for two reasons. First of all, no one answered, or even tried to answer <i>my</i> question, so I don't feel like answering yours. Second, I've heard \"What do you do for a living?\" argument a hundred thousand times before and you don't have to waste your time convincing me that the world revolves around money -- I know that already, and I do need money to eat and be able to talk to you. <br> <br>By asking me about what I do for a living, you are only proving my point. You think about money and even want to talk to me about money. Well then, why the fück don't you just say it? I mean, if you see nothing wrong with measuring everything with money, why don't you just stay cool and answer my question like this: No, I can't think in terms of anything other than money. Than we would agree and no one would get hurt. How about that, eh? <br> <br>If you want to talk about money, go talk to Meredith -- she seems to be more than willing to put words into my mouth. If you ask me more question, I'm sure she'll be glad to answer them for me. <br> <br>You don't have to call me mister to pretend to be polite when you aren't. I don't have the courtesy, but neither do you, so let's just cut the crap, shell we? I'm not insulting you on purpose, but you <i>are</i> being insulted by my honest opinion about you. You can change that opinion, if you wish to, or care -- it's mostly up to you. <br> <br>I don't \"barge\" in here. What is this, some kind of small, snobbish, private cocktail party? Am I supposed to crawl or squeeze in here? This is a public forum were I chose to voice my goddamn honest opinion. If moderators feel like it, they are welcome to ban me from here. And by the way, if you weren't all singing to the same stupid tune, I probably wouldn't have my voiced opinion the way I did. Do you realise how cliquish you all sound? <br> <br>My whole point, if you still haven't realised it, is that you should be nice to people around you when you can, when it doesn't really cost you anything. When was the last time you helped a old man on the street to carry a slightly heavy bag? I can argue that it does <i>not</i> take much to provide someone with an outline, if you have what it takes. If you can't help, or don't feel like it, just go by. I don't <i>care</i> whether you roll in the money or not, but when you start talking about charging money for five minutes of your time, you are making an arse out of yourselves. We are not talking about greed here, but arrogance. <br> <br>I'll comment on the original post that started this thread: It's not illegal to make an outline of a typeface and share it with someone else, nor do I think there is anything ethically wrong with that. Comparing an outline of a few letters with a font sounds like a bad joke -- there is much more to a font than that. It's almost an insult to someone who actually <i>has</i> created more than just a few letter outlines. It's not bold to politely ask for free help as the guy did. If anything, it's <i>daring,</i> and I wish there were more daring guys like him. <br> <br>To Yves: No, the typography section on my webpage is not my idea of being funny. In fact, I haven't written anything more boring than what you can read there. There are even some factual errors in there, like the claim of non-existence of system-wide font substitution in Win2000, but I'm too lazy to correct all that shite. On the other hand, I don't take myself too seriously, so you are welcome to laugh at my boring babble if you think it's funny. <br> <br>(I don't understand -- if everyone disagrees with me, who the fück voted my first comment so high? Should I suspect you guys for pulling off some kind of prank on me? I don't think this is amusing.) <br></p>"
