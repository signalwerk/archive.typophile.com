      <p>Have you seen the ‘gg’ ligature that Chris ‘Dezcom’ Lozos did for his <a href="http://www.typophile.com/froggy" rel="nofollow">Froggy</a> typeface? <a href="http://www.typophile.com/battle04#comment-107688" rel="nofollow">Here’s another variant</a> of it, with Cooper Black. And <a href="http://www.typophile.com/battle04#comment-107967" rel="nofollow">he said</a> his solution is available for licensing! ;-)</p>
      <p>Furthermore, I found this progression picture very illustrative: </p><div class="imageWrap"><img src="http://typophile.com/files/evolution-of-g_6627.png"></div>The evolution(s) of the letter g, according to <a href="/wiki/Hans%20Eduard%20Meier" class="freelinking" rel="nofollow">Hans Eduard Meier</a> – taken from: <a href="http://www.schulschrift.ch/d/pdf/a_6_16_entsteh_handsch.pdf" rel="nofollow"><cite>Entstehung der Handschrift</cite> [PDF, 1.3mb]</a><p></p>
      <p>It’s an excerpt from Meier’s book <cite>Die Schriftentwicklung. The Development of Script and Type</cite>. Sulgen (CH): Niggli. 48 pages, German/French/English, ISBN: 978-3-7212-0434-6</p>
