    html: "<p>Here's an extremely hasty pencil sketch  of another solution: bring in the suggestion of three dimensions, thusly, with the crossbar extending in opposite directions. This reduces the letters to abstract shapes, gives a distant echo to the Coco Chanel logo, and integrates the two Gs in a way that is less forced and less \"clever\"; not to mention that it sort of resembles a bracelet or earring or some other fashionable ornamentation.</p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/GG_5904.jpg\"></div><p></p>"
