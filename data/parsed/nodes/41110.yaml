  html: |-
    <p>I am working on a logo for a friend who is on the verge of starting of her career as a fashion designer. For the logo I am trying to integrate two Gs which are her initials. Here are some of my initial explorations where I have played around with an upper case and lower case G.<br>
    The logo has to look sophisticated and feminine. Feedback please!</p>
    <p>Vinu Chaitanya<br>
    Graphic design student<br>
    National Institute of Design, India.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/1_4213.jpg"></div><p></p>
