    <p>Hi guys,</p>
    <p>I am looking for a serif typeface along the lines of Marlene (<a href="http://www.typonine.com/fonts/font-library/marlene/" title="http://www.typonine.com/fonts/font-library/marlene/">http://www.typonine.com/fonts/font-library/marlene/</a>), that has a large family which includes stencil cuts. I am working on an online magazine layout and would like to implement the stencil version as a hover effect for links.</p>
    <p>The foundry selling it should therefore be able to host the type (have a web version).</p>
    <p>Thank you!</p>
