    <p>This is so sad! I used to have this font on my old laptop, but bought a new computer some months ago and can no longer find which font I used.<br>
    I've tried identifont, whatthefont, Bowfin printworks wihout success. It's driving me crazy!<br>
    What I love about this font is that not only does it seem "human", but it kind of fits in the spaces the way it should. It´s just awesome.</p>
    <p><img src="/sites/default/files/old-images/myfonts2_6124.png"></p>
