    <p>Hello</p>
    <p>I am looking for a font that is entirely made of dots, but its not a dot-matrix font. The characters are comprised two different sizes of dots. The dots are not structurally aligned and are more randomly scattered within the letter character. </p>
    <p>Any suggestions would be greatly appreciated!</p>
    <p>thanks.</p>
