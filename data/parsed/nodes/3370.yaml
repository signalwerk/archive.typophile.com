  html: <p>BUFFALO, NY, SEPTEMBER 19, 2002 - The Society of Typographic Aficionados (SOTA) has announced plans for TypeCon2003. To be held in Minneapolis, Minnesota, July 18-20, 2003, the fifth annual TypeCon will feature a stellar group of speakers, including Matthew Carter, John Downer, Dave Farey, James Montalbano, and Jim Parkinson. <br> <br>An international event designed for type makers and type users, TypeCon2003 offers workshops, presentations, panel discussions, type and design galleries, and plenty of opportunities for networking and fun. Letterpress printing, the history of wood type, and hand lettering techniques will be explored alongside the latest developments in digital type design, advancements in onscreen typography, and the art of producing quality typography with contemporary tools. <br> <br>While offering more education, entertainment, and exhibits than ever before, TypeCon2003 retains its uniquely intimate appeal - it's a gathering where first-year students and novice type designers can comfortably mingle with some of the biggest names in the type and graphic design fields. <br> <br>TypeCon2003 is presented by the not-for-profit Society of Typographic Aficionados, an international organization dedicated to the promotion, study, and support of type design, typography, and the related arts. Further information about TypeCon2003 may be obtained at <a href="http://www.typecon2003.com" target="_top">http://www.typecon2003.com</a>, or by email at <a href="mailto:info@typecon2003.com">info@typecon2003.com</a>. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" target="_top">http://www.typesociety.org</a>, or email <a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>
