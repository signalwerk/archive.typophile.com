    <p>I'm new here and I'm looking for a nice, slightly thinner typeface to go with Aldo as a subheading. Aldo only has a semibold style. I went through all my fonts and I don't really like any of them as far as going with this one. Any suggestions?</p>
    <p>Font is here: <a href="http://www.dafont.com/aldo.font" title="http://www.dafont.com/aldo.font">http://www.dafont.com/aldo.font</a></p>
    <p>Thanks! Cheers!</p>
