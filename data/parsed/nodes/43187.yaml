      <p>I think the T looks a little bit too much like the L.  Also you might try doing the Q as the G but with a lower crossbar instead of a trailing stroke.  I know I write my lowercase Gs and Qs identical except for it, and I went through a similar process a you did to simplify my handwriting.</p>
      <p>But, looking very good.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
