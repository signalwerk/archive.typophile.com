      <p>Today I saw a logo on a moving truck that reminded me of this thread.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/isaac_cordoba_cut_letters_3444.jpg"></div><p></p>
      <p>As you can see, while not as drastically chopped off as your examples (nor as nice looking), it shows what has been done,.  For example, the A I think most would not recognize if it were not for context, same for the S.  The R and the B I think could hvae some confusion as well.  But all put together, there is no trouble in reading it.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
