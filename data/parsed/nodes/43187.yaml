    <p>Hello</p>
    <p>I am currently intrigued by typefaces which aren't all there!</p>
    <p><a class="freelinking external" href="http://www.howenow.co.uk/suggestion.pdf" rel="nofollow">This is an idea I have been working on.</a></p>
    <p>These are a few other typefaces I have looked at (Phil Baines &amp; Barbara Butterweck - both for FUSE).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/letterforms_6494.JPG"></div><p></p>
    <p>Now I am interested in what everybody has to say on the matter - what works? What doesn't? Everybody I have asked seems to be able to read my design with little trouble when used in display and they have said that it is easier to read from a distance. I know we often see word shapes and not just individual letter shapes and this is important. Enough of my misinformed generalisations - tell me what you think please.</p>
    <p>Tom</p>
