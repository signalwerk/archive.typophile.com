    html: <p>I usually like this kind of thing (really, it's fun how me and Hrant get along so well!) but I appreciate it mostly when the surgeon's work does not show. The earliest example, besides Dead History, was Fudoni by Max Kisman. <br>As Paul Shaw has written in an essay for my "Letters" book (coming out before the end of the world), in Fudoni the letters were not collaged but "smashed together". <br>Bodolive does a similar thing and the result is not unpleasant, in my opinion.</p>
