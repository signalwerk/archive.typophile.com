    <p>The FT's nameplate uses a customised Times typeface, which I believe is unique to the paper. I would be grateful if someone could direct me to a similar typeface availlable in the public domain.</p>
    <p>the FT's nameplate can be found here: <a href="http://www.cida.co.za/2.13_Media/clippings/Financial_Times_Europe-uniqueJHBcampus-24March03.jpg" title="http://www.cida.co.za/2.13_Media/clippings/Financial_Times_Europe-uniqueJHBcampus-24March03.jpg">http://www.cida.co.za/2.13_Media/clippings/Financial_Times_Europe-unique...</a></p>
