    date_raw: 21 Apr 2012 — 10:24am
    votes: null
    html: <p>Closed counters and open counters. I would consider a counter any white space that is visually internal to the letter shape as distinct from space between letters. Obviously in the case of open counters there is no hard line between counter space and inter-letter space, and the dynamic relationship of the two is an important aspect of type design.</p>
