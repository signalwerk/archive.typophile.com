    html: |-
      <p>I disagree. One talks of humanist typeforms having 'open counters' to maintain legibility at small sizes. This refers to letters like /a/, /c/, /e/ and /s/.</p>
      <p>In metal typecutting, the matrix into which hot metal was forced was created by striking it with a steel punch. One way to get the right shaped punch was to use a 'counterpunch' to remove the insides of letters, even letters such as /H/ and /n/. So a counter originally would have been any white space removed from inside a letter.</p>
