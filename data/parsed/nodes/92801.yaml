    html: |-
      <p>@ 1996type: Thanks!<br>
      @ Nick: I lived in Amsterdam for about 8 years. There, walking down the Jordaan area, I realized traditional pubs and some stores were using a kind of script that was unknown to me. When I documented it and took pictures, it was obvious that the style was very consistent and there was probably an interesting story behind. Then, after finding and interviewing one of its painter (Leo Beukeboom), I continued digging up information from the Amsterdam Photographic Archives and getting information and documents from the relatives of J. W. J. Visser, the letter painter who created the style in the 40s. It is an interesting story and with some luck I will publish it. Cheers.</p>
