      <p>Wow! thanks a lot for the knowledge. Totally agree with you about how overlooked is typography and type design in the practice of graphic design in our Island. It seems to me like the more different type faces you can fit in a 4” by 6” the better designer you are. (jaja :)   </p>
      <p>I may not be a typophile as some might say around here but I wanted to have an impact no matter how small, that would have a direct effect on the profession in Puerto Rico. Idealistic I know, but true. Now reality, the school only cares about admissions and retaining students, the quality of the education and the caliber of professionals they are forming, it’s their least priority. The quality of the students is really low (I knew that from the beginning) I just didn’t realize how low. For example a college student, that aspires to become a graphic designer, that doesn’t know what a 1/4 of an inch is. They only care about the technical aspects of the profession, when it comes to think, and develop other skills they block. </p>
      <p>Now of what I asked, I should have said, letter <strong>(a) The importance of proper typography in graphic design.</strong> I’ll check the book that you recommend and see what I come up with. Thanks a lot. I’ll try to keep in contact with you, it seems that you can help me a lot. I want to elevate the profession just a little bit. </p>
      <p>Tomás J. Pagán<br>
      Graphic Designer<br>
      <a href="http://www.topagdesign.com" title="http://www.topagdesign.com">http://www.topagdesign.com</a></p>
