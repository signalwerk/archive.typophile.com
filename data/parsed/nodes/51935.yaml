      <p>Saludos desde San Juan…</p>
      <p>First I think it’s important that you clarify whether you mean <strong>typography</strong> (as in: <em>the practice of choosing and setting type</em>) or <strong>type design</strong> (as in: <em>the practice of designing the actual glyphs that go into a font for later use on a typesetting program/machine</em>). Both are clearly defined (yet always mutually referential) activities that, in my opinion, merit a separate project/chapter/exercise/&amp;c. for each.</p>
      <p>Now, I have to say I find “the importance of typography in design” a bit vague. It could well mean one of the following:</p>
      <p><strong>(a) You mean the importance of <em>proper</em> typography in graphic design.</strong> That is to say: the development and application of the sensibility necessary to make adequate decisions in choosing typefaces and setting them correctly, with practical and aesthetic considerations in mind, to produce a graphic product that adequately communicates its message. If this is the case, one can never go wrong with Robert Bringhurst’s <em>The Elements of Typographic Style</em>. I’m sick of reading praise after praise for this book, yet the simple truth remains: it is an excellent reference for any designer, at any level of experience. Period.</p>
      <p><strong>(b) You mean the historical, aesthetic and/or technological impact that type design and/or typography has had in graphic design as a discipline encompassing formal inclinations as well as functional considerations.</strong> That is to say: the influence that type design or typography has had on the graphic design craft, including the effects that the historical prevalence, aesthetic tendencies and technological limitations and advances of type have had on the practice of graphic design and the way it communicates with the viewer. If this is the case, I suggest you explore Soviet constructivist design, Swiss design and the history of the printing press. Also, the recently released Helvetica movie is a great reference I think they might enjoy.</p>
      <p><strong>(c) You mean all of the above!</strong> In this case, I might suggest you turn it into separate projects that illustrate the different levels of typographic exploration explained above. The importance of typography and type design in the practice of graphic design is terribly overlooked in the current design education climate in Puerto Rico, as well as our professional practice of design. In fact, I’ll go as far as saying that typographic sensibility is the single worst aspect of editorial, identity, environmental and promotional graphic design in our island. It is an epidemic, to be quite honest, and you have a golden opportunity to instill in these students a respect and excitement for typography that helps shape the way we use type in our country in years to come. So, rather than having one project dedicated to the overwhelmingly vast and potentially vague theme that is “the importance of typography in graphic design,” I suggest that you turn it into an recurring theme throughout your class projects, in combination with the other themes you use in your curriculum.</p>
      <p>¡Éxito!</p>
