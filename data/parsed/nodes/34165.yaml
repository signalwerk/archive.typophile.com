      <p>“That’s what i’m trying to understand Darrell :) I need to know the pros and cons.”</p>
      <p>Well, it depends on what you’re going to do with it. </p>
      <p>If you’re comparing hardware, then you need to realize that it’s not a PC vs. Mac issue. It’s an Apple vs. Dell vs. HP. vs. Sony vs. Lenovo vs. Gateway vs. etc vs. etc vs. etc</p>
      <p>And then you have to compare the multitude of models available by each company.</p>
      <p>In terms of the operating system, Windows and OSX and Linux are about 90% the same. They all do the basic same things, albeit in slightly different ways.</p>
      <p>In terms of software availability, again, 90% of the tools an average graphic designer would use are available on either Windows or OSX platforms (or there’s an equivalent for either one). </p>
      <p>In the end, if you are truly looking for a comparison, then you need to tell us your requirements for a machine. Based on that, then we can give you specific pros and cons.</p>
