      <p>Dearest Miss Giggles</p>
      <p>I’d suspect agencies use PC over Mac mainly because the hardware is cheaper, the software is better understood by the techs, etc. Mainly economics.</p>
      <p>Apple does not hold anywhere near the market share that the PC/Microsoft does, and in the late 90s was almost a goner.</p>
      <p>I’ve been working with computers since 1970. I was using mini-computers and the internet in 1975. In 1985 I was setting type on proprietary systems. In 1990 I was introduced to the Mac. While I have used PCs and my wife has one and swears by them, no way in hell I would use anything other than an Apple product. </p>
      <p>They aren’t necessarily expensive. I just buy used machines and gut them out. New processor, max memory, hard drive controller, video card, media ports; whatever it takes to get it to where it needs to be to function on a par with the newer than the newest. Cheaper and far more efficient than buying a junk new PC. The Mac OS is friggin unbelievably rock solid.</p>
      <p>Gerald</p>
