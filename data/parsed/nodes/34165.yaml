    html: |-
      <p>Like I said in the previous thread, this is like asking what brand of chisel Michelangelo used.</p>
      <p>Personally, I use a PC. I could probably switch to a Mac with no great loss of productivity. It’s not the computer, it’s what you do with it. Many bad designers use Macs. Many good designers use Macs. Many bad designers use PCs. Many good designers use PCs. Obviously the brand of computer being used has no bearing on quality of design.</p>
      <p>Wireless access, speed, and storage capabilities are not specific to any brand of computer. A Mac could have a smaller hard drive than a PC, or vice versa.</p>
      <p>I don’t see why this debate keeps coming up over and over again. If you work better on a Mac, then use one. If you work better on a PC, then use one.</p>
      <p> - Lex</p>
