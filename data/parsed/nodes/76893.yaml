  html: <p>Craig Eliason started designing type in 2008. His first commercial release was <a class="freelinking external" href="http://www.typophile.com/node/75182" rel="nofollow">Ambicase Modern</a> (2010), which also marked the debut of his foundry, <a href="/wiki/Teeline%20Fonts" class="freelinking" rel="nofollow">Teeline Fonts</a>. He is also a college professor who researches, presents, and publishes on the history of type design. He lives in Saint Paul, Minnesota, USA.</p>
  html_clean: <p>Craig Eliason started designing type in 2008. His first commercial release was <a class="freelinking external link-kept" href="/node/75182/" rel="nofollow">Ambicase Modern</a> (2010), which also marked the debut of his foundry, <a href="/wiki/Teeline%20Fonts" class="freelinking link-lost" rel="nofollow">Teeline Fonts</a>. He is also a college professor who researches, presents, and publishes on the history of type design. He lives in Saint Paul, Minnesota, USA.</p>
