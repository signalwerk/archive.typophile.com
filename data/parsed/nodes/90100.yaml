      <p>Thank you for your comments guys. I tried changing the appearance of black. That didn't fix the problem. I tried moving around some pictures (I have pictures or shapes on top of some pages) and it did change the color to darker, when ever I placed a picture on top of the page. So, Joshua, I think it's Case A. Any suggestions how do i solve it so everything looks the "same black" in pdf? Big thanks!</p>
      <p>p.s. When I delete the image from the page, I can visually see that there is a change in the text (in InDesign when zoomed out, I delete the image, and the color of the text lines turns from light gray to dark gray). So this is definitely connected with the images.</p>
