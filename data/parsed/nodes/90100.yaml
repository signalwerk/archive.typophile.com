      <p>Ok, so sorry about the spaming. I came up with a solution (probably not the best way to do it, but it works). I just added a dot (with transparency set to 0%) at the Master pages. Now every page has a transparent object, so the text in every page will seem "darker". If you have a different solution, please do tell me.</p>
      <p>Thank you all.</p>
