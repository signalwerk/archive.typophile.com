    html: <p>When I'm having an InDesign problem I can't solve, I try a process of elimination. Make a backup copy of your file; then take a couple of pages where you're having the problem and temporarily delete every object (photos, rules, background tints, etc) except for the text boxes. So you just have the text boxes and nothing else. Then see if you're still having the problem. If this fixes the problem, you know some interaction with another element is causing the problem.</p>
