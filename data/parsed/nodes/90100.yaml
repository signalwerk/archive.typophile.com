    html: |-
      <p>Ah! I think I've got this one.</p>
      <p>Possible cause A. Is your text that looks significantly darker closer to an image than the other text? (That would explain it being slightly "heavier.")</p>
      <p>Possible cause B. Are you using more than one "black" swatch, or maybe the [Registration] swatch in InDesign? (That would explain it being slightly "darker.")</p>
      <p>Cause A would be because text that is under transparent portions of images is rasterized. Cause B would be because "rich black" looks darker in PDFs than "pure black" and sometimes prints that way, depending on the printer etc.</p>
      <p>Go to InDesign preferences &gt; "Appearance of Black" and make all blacks appear accurately. Can you see the problem in InDesign?</p>
    html_clean: |-
