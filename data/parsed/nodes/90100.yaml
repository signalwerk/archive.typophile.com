    html: |-
      <p>I'd go with Joshua's suggestion of putting the type on a separate layer. In fact I know some designers who do that routinely as a precaution against various problems.</p>
      <p>It's pretty easy to do. Open the Layers palette and create a new layer and name it "Type". Then with the palette still open, click on your text boxes to select them. (If your text boxes appear on your master page, you can do it there rather than on each individual page.) In the Layers palette a little box will appear on the right side indicating which layer those objects are on. Drag that little box to the Type layer.</p>
