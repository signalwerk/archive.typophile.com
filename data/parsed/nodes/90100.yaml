    <p>Hello, I am new to InDesig and to this forum, and I have a question.</p>
    <p>I just started making a document in InDesign with pictures and text, but the thing is, when I export the project to PDF, in some pages the text is displayed in the proper color, while some seem to be "lighter" although the same exact text settings are applied to both texts. this also happens to the text which is merely continued (with the red +). It is black and ok in the first page, but when it continues on the next one, it is lighter. You cannot see the difference when the text is printed, but this time I really need to have the pdf version as well.</p>
    <p>Thank you</p>
