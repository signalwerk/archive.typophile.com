      <p>The names are as beautiful and evocative as the label designs...</p>
      <p>Shinkame - The Holy Tortoise<br>
      Kaganotsuki - The Moon over Kaga<br>
      Yukinone - The Sound of the Snow<br>
      Yamazaru - Mountain Monkeys<br>
      Echigo Tsurukame - Crane and Turtle of Echigo</p>
      <p>Thanks for the link Ian. It urges me to finally get around to designing and maybe translating some of my attemps at haiku. I so want to get to Japan someday.</p>
