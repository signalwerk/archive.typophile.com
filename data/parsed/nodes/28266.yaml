      <p>Ludwig – clearly I didn't understand your initial point about De Does' research (rather than anyone elses). Thank you for pointing me to Mathieu Lommens' book, and clarifying the Bobst/Autologic relationship.</p>
      <p>Without wanting to hijack the thread, what I've managed to work out and write about Trinité so far is contained in the following paragraph – for which I am looking for feedback/correction – so if anyone would like to comment?</p>
      <p><em>Trinité; Designed as a large interchangeable family of weights and styles, Trinité was a reprise of fellow Dutchman Jan van Krimpen’s ideas for a related text family, but made originally for photo setting by Bobst Graphic (later Autologic) in Switzerland. The typeface comprises of three weights of wide roman, two weights of narrow roman, two weights of small capitals and two weights of italic. The seven weights and widths of the roman and italic also come in three ranges of differing heights for the ascenders and descenders; with expert sets, pi fonts and ornaments, the total family consists of 81 separate digital fonts. Due to the pricing and licensing policies of Peter Mathias Noordzij’s Enschedé digital type foundry (TEFF), Trinité remains exclusive – a little-known but much admired typeface.</em></p>
      <p>Do you think this last sentence is 'fair'?</p>
      <p>The issue here is that I think Hrant's point about the high pricing actually protecting the face is correct; (I suspect that like a lot of people in this forum) I happen to know somebody who has been looking for a way of obtaining Trinité without paying the full price for several years – but they have been completely unsuccessful in this attempt. As the ongoing debates about piracy on typophile will suggest, there are not many typefaces one can say this about.</p>
      <p>Lastly, can either of you please tell me if TEFF still retain the copyright to Cancellaresca Bastarda? And whether they will ever release it as digital font?</p>
