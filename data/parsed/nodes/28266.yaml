      <p>Fairness is a tricky thing. For example, if your implication that De* Does doesn't agree with the pricing is true, then that does constitute a certain unfairness to him; on the other hand Trinite could have ended up at a much worse font house than TEFF, and he can be considered lucky in that respect. So it's a balancing act. And I think your own balancing act has been poor in this thread - the negative way you've cast TEFF in the overall. To an outsider (or at least to me) it basically seems like you're angry that you/more_people can't afford Trinite; although I'm all for helping "mass culture" along by promulgating good type, it can be argued that many talented people need to be compensated materially for them to engage in making good type to begin with - and making some people angry comes with the territory.</p>
      <p>* BTW, in Dutch "qualifiers" such as "de", "van", etc. actually become capitalized when the given name is omitted.</p>
      <p>In terms of the business angle, I would say there are (at least) two good reasons for unusually high pricing. One is that pricing is self-fulfilling: something that's expensive is seen as being more valuable. But much more relevant here is piracy: font files are tiny; their effort-to-K ratio is ridiculously high; and something that costs somebody a lot of money is less likely to be shared by that person with others. Even though it's technologically trivial, when you buy a TEFF font you're extremely unlikely to pass it along to your buddy - and you're buddy, if he's really your buddy, will probably understand. The only risk with very high pricing is that too many people will lose respect for you in thinking you're being unfair, arrogant, etc. You seem to be one of those people, and you're certainly not alone. But are there enough of you?</p>
      <p>But perhaps the most important counter to you that I would offer is that the quality of a text face is primarily based on its alphanumeric setting. Not fancy ligature code. The "magic" of a text face is in its notan, and superb notan should be pretty expensive, no matter how low-tech the font software is.</p>
      <p>For the history on the Autologic angle, thank you.</p>
      <p>hhp</p>
