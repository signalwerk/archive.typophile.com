      <p><cite>Technically speaking, their products are outdated and incomplete. I think lots of small foundries out there could do a much better job and likely would sell their product at more appropriate fees.</cite></p>
      <p>TEFF was one of the first foundries to publish Euro-glyphs for all their fonts…</p>
      <p>Sure, TEFF-fonts are quite expensive, but compare it to the cost of a single fount from Berthold in the "old days" — not excessive at all, I think.<br>
      Now consider the cost to a designer who wants to compose a publication with Trinité. You'll NEVER use all of the variants in one book, so it's a matter of selecting the variants needed. The more complex your subject matter, the more you'll probably need. But — guess what — the more complex a design, the more you'll charge for it. So what's the big deal? For a simple book you'll probably need no more than three cuts and that's 790 euro. Quite reasonable imho.</p>
