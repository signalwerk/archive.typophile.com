      <p>Spacing is fully half the story (and the hidden half) but I've actually come to realize that even color isn't the true objective; good notan lives around the threshold of too much divergence and too little. You can see this for example in the difficulty of making a lowercase "g" that's neither distracting nor too homogenous with the rest of the alphabet.</p>
