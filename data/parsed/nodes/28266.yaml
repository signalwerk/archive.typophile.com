      <p>Bert — Comparison to "the old days" simply doesn't make sense. I am speaking of today and the pricing scheme of one foundry to another. In the old days type production was a cumbersome and cost-intensive process: punches were chiseled by hand, matrices being struck and justified by hand, type was founded in costly alloys and so forth. Or different trials were executed with highly expensive glass or film material. Not mentioning the cost of dedicated typesetting systems and plate setters. Back in 1985 a Mac was really a bargain in relation to those one billion dollar systems; compared with the newest MacPro, though, it was outrageously expensive. But nobody makes that comparison. Technology evolves and so do price settings with it. Or at least they should.</p>
      <p>Sure, not all the different variants of a type family are needed in one project. So what? I might, one day, still need this or that variant and likely will not be happy having to purchase the extra fonts at a cost which in the end is twice the price of the bundle. Certainly not when a similar amount of variants and versatility is offered in that one package I didn't buy, from another foundry/vendor, at one tenth of that price. I also wonder what's the big deal with those variants: weight/width interpolations, adding or modifying the ascenders/descenders of only eleven glyphs. Yes, yes, "in the old days"… I know, then these variants were cut by hand, one by one, and founded on different body sizes.</p>
      <p>Hrant — thanks for the clarification. Could one say "notan" is the equivalent of what the Germans call "Rhythmus" or "Duktus"? You're completely right that more than spacing is involved. De Roos Romein — sigh… What a beauty! I have this Lettergieterij Amsterdam specimen book with the full range and I too hope to one day see it on screen and printed by offset or ppl. You know what? Over there in the U.S., type designs are themselves not protected (read: kept in custody) by copyright laws…</p>
