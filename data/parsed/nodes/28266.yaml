      <p>Hrant</p>
      <p>Perhaps my tone on TEFF is a bit harsh and therefore obscuring my point. I would very much like to use Trinité, but (1) I can't afford the TEFF license (which is my problem and nothing to be angry about with TEFF) and (2) I wouldn't even want to use their font software, because it's "technologically trivial". I am not angry with TEFF, but rather got "bad vibes", as you call it, on their "type squatting". TEFF has the exclusive right of producing and distributing Trinité. If they hadn't, I would produce it myself, or would welcome some or more foundries to do so. I would accept high pricing only, if the fonts shipped as OpenType, with complete glyph sets, proper hinting and with a fair EULA.</p>
      <p>I didn't mean to imply that Bram de Does doesn't agree with the pricing. I wouldn't know, since I didn't meet de Does yet. All I hear of him, is that he's a very sensitive and modest person, and certainly not the kind of fellow who needs "to be compensated materially for [him] to engage in making good type". I also know that back in the metal/photo composition days when he was still working at Enschedé (the original), font production was extremely expensive and pricing accordingly high. And it's a known fact that when market leader Adobe lowered it's fees in the 1990s, digital fonts became way cheaper — except for those of TEFF. Perhaps de Does is not aware of the pity stock flows in DTP world.</p>
      <p>Your argument on the piracy/pricing issue, I can follow. But then again, let's be real: it's only fonts! There are lots of things in this world that deserve protection, type design and font production included. Nonetheless should the protective measures be in accordance with the value of the protected good <cite>and</cite> to the likeliness or proportion of its theft. How many people out there have an interest in type? And is it so bad that if someone <cite>gets</cite> interested after all, he wants to try out? Hey, let that kid alone, till he decides to become another brick in the wall and uses the font for commercial purposes. Really, in the whole of human culture and its economy, fonts are not a big think.</p>
      <p>Trinité doesn't need "fancy ligature code", since it forms its ligatures automatically by its design — in fact it was the first design to do so. And you're completely right that the magic and quality of type "is in its notan", if you mean even spacing and overall even greyness by that. de Does spent a lot of effort on it, whereas TEFF just copied the original sidebearings. Coding for automatic glyph substitution, ligatures or otherwise, is however a conditio sine qua non in today's high-end font production.</p>
      <p>* As for the spelling issue: thanks for the suggestion. I am however natively Dutch speaking and have a degree in philology.</p>
