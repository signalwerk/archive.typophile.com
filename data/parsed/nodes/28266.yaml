      <p>Ben — Your summary is all right; Trinité sure is exclusive.</p>
      <p>As for Jan van Krimpen's Cancellaresca Bastarda. All of van Krimpen's designs were acquired by Peter Matthias Noordzij's brother-in-law Frank Blokland from the Dutch Type Library; DTL is not allied with TEFF. Potential "type squatting" of the Cancellaresca is on the part of DTL, not TEFF. Last time I spoke with Blokland, and asked him after his plans with the Cancellaresca, he said that he likely would not digitise it in the near future, since it has no commercial importance.</p>
      <p>Hrant — I am as much as you offended by what you call "type squatting". This is really my point with TEFF. We all agree Jan van Krimpen is a classic in type design. So is de Does. And, perhaps, so is S.H. De Roos. Alas, how very much we'd like to use their typefaces (digitally), we are not allowed to do so. Either because the fonts that are issued by the monopolists that hold the rights of reproduction, are way too expensive or their software is outdated, either because the monopolists regard us as too bibliophilistic, financially incapable and hence undeserving clients to make the effort for of producing these classics. Classics, by the way that belong "to the 'patrimoine humaine', not them " (cfr <a href="http://typophile.com/node/6411#5" title="http://typophile.com/node/6411#5">http://typophile.com/node/6411#5</a>).</p>
