      <p>Hrant — can you say why my statements aren't fair? And in what way the business decision makes great sense? As a business decision, sure. As a decision of people concerned with type and the divulgation of typography, no.</p>
      <p>The TEFF license rates are by far the most expensive. This would make sense if they had a lot to offer. But apart from designs in which they themselves put no effort at all, they don't. Technically speaking, their products are outdated and incomplete. I think lots of small foundries out there could do a much better job and likely would sell their product at more appropriate fees. But they simply can't, because of the copyrights TEFF acquired years ago in a completely different situation.</p>
      <p>I think people should get paid for their work. And they also have the right to rate the value of their work themselves. All I am saying is that TEFF determines the price of the work done by someone else (de Does' design), but does not put up an equal amount of work in maintaining the technical quality of the fonts. The complete package of Trinité is sold for almost the same price as Adobe's Font Folio, whereas one Adobe Original on merely technical grounds offers a lot more.</p>
      <p>Trinité was never owned by Autologic. It was and still is the property of its designer, Bram de Does. Because de Does was an employee of Enschedé, the company had the rights of distribution. When the firm ordered a photosetter from the Swiss company Bobst Graphic, Enschedé decided to have a new typeface designed by de Does, to be used with the new technology. This was to become Trinité. Bobst Graphic got the license to produce the font, but for exclusive use of Enschedé only. When Bobst Graphic got bankrupt, the firm was bought over by Autologic. It is at this point of time that the first specimen of Trinité was published, under the imprint of Autologic. Autologic tried to get the license to produce the typeface as a digital font, but de Does objected, because of the poor quality of the glyphs they digitised as samples. It is only after that, that Matthias Noordzij convinced de Does and TEFF was founded. I wonder what would have happened with Trinité when Autologic would have gotten de Does's permission…</p>
