      <p>I agree that the TEFF typefaces are outstanding—at least aesthetically. But this has to do more with their designers than it has with corporate policies. Bram de Does' "Trinité" is imho the most beautiful typeface ever designed and probably one of the most researched. The same goes for his "Lexicon".</p>
      <p>Bram de Does originally didn't want his "Trinité" to be digitised; at that time Matthias Noordzij experimented with Ikarus and suggested that he'd like to digitise Trinité. de Does was reluctant, but in the end convinced by the possibilities and adequateness of the new digital format. But, I guess, the fact that Matthias' father Gerrit had been student together with de Does was an extra argument. So was probably the fact that Enschedé (the esteemed old company) gave up its foundry division. Were it not because of these arbitrary coincidences and corporate tactics, Trinité might be affordable to more than a few Dutch publishing houses.</p>
      <p>Bram de Does is not only a great type designer, but a most fine human being too. I find it shocking that his talents are exploited in this way. If Noordzij (both father and son) whish to sell their designs at these outrageous fees, that's their decision. But most likely "Trintité" and "Lexicon" make up for the company's complete turnover, which is why it doesn't need to invest in much more publications.</p>
      <p>&gt; they publish so little because there are so few design(er)s that are worthy<br>
      &gt; of the name</p>
      <p>I think it's the other way around: the technical and other specs of TEFF fonts (no OpenType, no features, no complete glyph sets, harsh EULA) are not worthy of Bram de Does' designs. And as for the name: it was bought from the company that over the centuries added to its esteem by giving opportunities to such men as Fleischman, van Krimpen, Salden and de Does, not by simply buying pre-made designs.</p>
