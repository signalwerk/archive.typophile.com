  html: <p> Q1) Okay, lets pretend for a minute that I actually finish one of my fonts. What is the next step to release it through a reputable foundry? <br> <br>Q2) Would it be appropriate to show samples from incomplete fonts? It think I would be more motivated to finish a font if I thought I could sell it. </p>
