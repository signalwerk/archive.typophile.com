    date: 2001-11-10T09:46:00
    date_raw: 10 Nov 2001 — 9:46am
    votes: null
    html: "<p> Submitting to font houses: <br> <br>My view is that you need to show them that: <br>1. You know how to do the different things <br>   necessary in type design, like kerning <br>   weight compensation, odd sorts, etc. <br>   But you don't to carry *all* of that <br>   out to get their attention.  <br>2. You need to show an understanding of what <br>   you need to do to make your font salable, <br>   including the committment to finish it. <br>And note that some font houses (like Bitstream) <br>will finish the font for you. <br> <br>BTW, I've personally become partial to MyFonts. <br> <br>Joe: <br>What fun is that? <br> <br>hhp </p>"
    html_clean: "<p> Submitting to font houses: <br> <br>My view is that you need to show them that: <br>1. You know how to do the different things <br>   necessary in type design, like kerning <br>   weight compensation, odd sorts, etc. <br>   But you don't to carry *all* of that <br>   out to get their attention.  <br>2. You need to show an understanding of what <br>   you need to do to make your font salable, <br>   including the committment to finish it. <br>And note that some font houses (like Bitstream) <br>will finish the font for you. <br> <br>BTW, I've personally become partial to MyFonts. <br> <br>Joe: <br>What fun is that? <br> <br>hhp </p>"
  - id: 48245
    user: 851
    date: 2001-12-28T08:30:00
    date_raw: 28 Dec 2001 — 8:30am
    votes: null
    html: <p> If they like the design, some font houses will <br>get involved going on as little as "hamburgevons." <br>Very, very few fonts sold these days have manually <br>hinted outlines, delta or otherwise. With <br>programs like FL4 and BitFonter, there's a strong <br>case to be made for dumping hints in favor of  <br>screen bitmaps. </p>
