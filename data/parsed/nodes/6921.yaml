    html: "<p> Christian: <br> <br>As to Q1), I'm still trying to work through that one myself. The people at MyFonts.com have been very helpful in sending me information for selling through their service. <br> <br>As far as Q2), I say go for it! The disclaimer at the top of the Critique Forum points out that there is neither any font too complete nor too incomplete to post to the forum. And for the rest of us, I know we all check several times a day to see if any knew font has been posted. ;) (Well, okay -- I know I do, anyway. And people say I don't have a life.... :D Hah! What do they know? ;) ) <br> <br>David </p>"
