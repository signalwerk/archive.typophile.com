  html: <p>This is the identity for Pressure Washers Inc. a company that specializes in pressure washing for the trucking industry. <br>What makes PW stand out from competition (besides the nice new logo) is that they have better containment of debris and chemicals (a special wet n' dry vacuum system)-which translates to environmentally conscious.  <br>Clients of PW are mostly men, truckers and corporate clients that own fthe fleets. In this field there is no clear leader. My client and I are trying to establish his company PW as that leader of that industry. The usual identities related to this industry are amateur jobs.I am guesing other cmpanies in the field do not consider truckers critical in choosing companies to clean their vehicles. I agree they are properly less picky that someone shopping for a $3000 watch. We still think a slick identity will help getting new clients.  <br>BTW this job came with a 48hr. deadline as the Yellow pages ad <br>needed to be ready in 2 days. I think it is pretty good considering the time frame. I cam upload older version if anyone is interested. <img src="http://www.typophile.com/cgibin/board-post.pl?action=posting_upload_form&amp;what=show&amp;img=26718" alt="PWinc.-Identity-with-custom.jpg"> </p>
  html_clean: <p>This is the identity for Pressure Washers Inc. a company that specializes in pressure washing for the trucking industry. <br>What makes PW stand out from competition (besides the nice new logo) is that they have better containment of debris and chemicals (a special wet n' dry vacuum system)-which translates to environmentally conscious.  <br>Clients of PW are mostly men, truckers and corporate clients that own fthe fleets. In this field there is no clear leader. My client and I are trying to establish his company PW as that leader of that industry. The usual identities related to this industry are amateur jobs.I am guesing other cmpanies in the field do not consider truckers critical in choosing companies to clean their vehicles. I agree they are properly less picky that someone shopping for a $3000 watch. We still think a slick identity will help getting new clients.  <br>BTW this job came with a 48hr. deadline as the Yellow pages ad <br>needed to be ready in 2 days. I think it is pretty good considering the time frame. I cam upload older version if anyone is interested. <img src="http://www.typophile.com/cgibin/board-post.pl?action=posting_upload_form&amp;what=show&amp;img=26718" alt="PWinc.-Identity-with-custom.jpg"> </p>
