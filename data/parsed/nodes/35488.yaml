    votes: null
    html: <p>When I look at Monotype I don’t see a company worth investing in. Monotype’s business model seems to be focused on selling <em>old</em> type, not developing <em>new</em> type. I realize that there’s some new stuff coming out of Linotype and some of the other foundries Monotype has purchased, but it’s not the great stuff coming out of the indie foundries, and the promotion of these new typefaces is not nearly as good as Veer or Fontshop. While having thousands of old fonts to milk is by no means a bad business model, it is not one that can grow enough to justify investing in the company.</p>
