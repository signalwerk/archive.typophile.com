      <p>I think they are interested in developing new type. But, overall they have SO MUCH type in their library now it is going to take a lot more than a few email blasts to make some noise about the new type. Carl Crossgrove is proof that they are interested in creating new type. (To mention only one person.)</p>
      <p>They need a good dusting off. So many people still love the old classics which they have, me included, it is unfair to say they aren’t worth investing in.</p>
