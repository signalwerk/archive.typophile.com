      <p>The concept for this latest post is nice, however I think you need to work on the actual drawing more, the curve of the b counter needs some work especially around approximately 4 o’clock and at either end, the horizontals and verticals of the b and 7 need a more geometric and symmetric feel, maybe creating a 3d solid version and then removing the unwanted elements might help. On the name it has an onomatopoeic quality, a kind of rounded sound, I think that it might require more rounded forms, maybe you could emphasise roundness of the corners.<br>
      Tim</p>
