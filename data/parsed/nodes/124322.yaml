    html: |-
      <p>Allí hay dos tipografías distintas. Si te refieres a la del cuerpo principal de la invitación, la que no es caligráfica, es "Museo Sans" de Jos Buivenga ( <a href="http://www.exljbris.com/museosans.html">http://www.exljbris.com/museosans.html</a> ). Jos ofrece un par de fuentes gratis allí en su sitio, dentro de los varios grosores.</p>
      <p>La otra, la caligráfica, la recuerdo haber visto, pero no me acuerdo su nombre. Alguien con más conocimiento de ese tipo de fuentes tal vez te podrá asistir.</p>
      <p>Por cierto, aquí es preferible hacer estas consultas en la sección destinada a ello, que es Font ID: <a href="http://typophile.com/typeid">http://typophile.com/typeid</a><br>
      Allí te pueden ayudar mejor.</p>
