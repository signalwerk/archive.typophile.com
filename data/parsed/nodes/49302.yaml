    <p>Hi everyone!</p>
    <p>We are going to start a new catalogue for a cosmetic/beauty care brand.<br>
    We will go on a ligth sans serif, with high x-heigth for the main articles description.<br>
    The pages will have some background pictures (usualy ligth colors)- so we need a ligth sans with some "strength".<br>
    We are considering Koz Gothic for this.<br>
    Do you guys have some considerations to make? Suggestions and some serif pair? "Good examples"?</p>
    <p>António FOnseca</p>
