    html: <p>I can chime in about the ol' Master Juggler OSX. There is something very simple and clean about the interface. It's stripped down in terms of its capability, which I like. No font activation. You have to do that manually. Which I like.  <br> <br>I had assumed, as a result of this simplicity, that it would be speedy and reliable. And it's not. I've had lots of problems installing TrueType fonts as well. The Font Guardian feature, which analyzes the fonts upon installation, does not seem to understand TrueType. It asks for PostScript outline files on installation. Wha? And the whole program freezes up from time to time, I assume as a result of "bad" fonts. And its display of font samples, while pretty, is slow and cumbersome. It's disappointing. I'm praying that Alsoft will come out some sort of update� I think it COULD be quite nice.  <br> <br>Fonts are tricky, no? I wonder if our Macs will conquer them any time soon.</p>
