    <p>hello all,</p>
    <p>for a font design project i am looking for samples and resources of old armenian typewriter character sets (or scans of documents and texts that were written with said machines) that would help me work on a corresponding design or serve as a head start. i have begun with olivetti 32 as the latin basis, and have completed cyrillic so far.</p>
    <p>if anybody could point me to such resources or links, i would greatly appreciate it.</p>
    <p>thanks a lot.</p>
