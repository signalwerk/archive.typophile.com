      <p>There is a photo of an Armenian Underwood typewriter here:</p>
      <p><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></p>
      <p>and one of an Armenian Royal typewriter here:</p>
      <p><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></p>
      <p>The Olympia Armenian keyboard is pictured in the book "Century of the Typewriter".</p>
      <p>EDIT: On my web page at</p>
      <p><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></p>
      <p>I have added a diagram showing the Royal, Olympia, and Underwood keyboard arrangements.</p>
      <p>Thus, the Olympia arrangement is now visible on the web for those without access to the book "Century of the Typewriter", although only one of the two arrangements shown there is illustrated.</p>
      <p>Also, in preparing the diagram, I discovered that the specimen of an Underwood Armenian typewriter illustrated in a photo on Wikipedia had <em>two</em> of the keys with upside-down legends.</p>
      <p>EDIT: From this site:</p>
      <p><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></p>
      <p>a picture</p>
      <p><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></p>
      <p>of the active portion of an Armenian typewriter turned out to be of an Underwood model. And from this I resolved one ambiguity; although two keys had upside-down legends, those legends were also swapped between the two keys they were on, and whose right-side-up forms they resembled. So I was mistaken to take the little hook as the decisive factor - I will be correcting the diagram on my web page this evening.</p>
      <p>EDIT: In a flash of insight, I thought that at least Microsoft would have been able to find out the keyboard layout used in Soviet Armenia. And, indeed, they have an Eastern Armenian layout that does not correspond to that used by Royal, Olympia, or Underwood. However, I also ran across this page:</p>
      <p><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></p>
      <p>which says that Microsoft managed to get two keys switched around!!</p>
      <p>I am not feeling so bad about my blunder now.</p>
      <p>EDIT: Wikipedia also has this image</p>
      <p><a href="http://commons.wikimedia.org/wiki/File:Armenian_Library_P1130664.JPG" title="http://commons.wikimedia.org/wiki/File:Armenian_Library_P1130664.JPG">http://commons.wikimedia.org/wiki/File:Armenian_Library_P1130664.JPG</a></p>
      <p>of a Royal typewriter with an Olympia-like layout; the other one from Century of the Typewriter that I didn't show on my site resembles it more closely, but I think two letters on the right are switched.</p>
      <p>As I've also come across a news item saying that the government of Armenia was pondering whether to use a typewriter or a phonetic keyboard layout, I can only conclude that Armenian typewriters were not terribly common in Soviet Armenia; of course, typewriters were controlled in the Soviet Union due to the threat of <em>samizdat</em>, but one would have thought the bureaucracy would need them for its own use in quantity if nothing else.</p>
