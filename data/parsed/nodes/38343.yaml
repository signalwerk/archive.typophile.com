    <p>I’ve been eyeing the lettering from butter labels for a while, and I finally found the one I was looking for. I’ve seen the lettering for ’BUTTER’ on other grocer house butters, and I just realized it was originally Darigold. Wondering from the type experts around here if this is a custom face (i’m assuming) or if this is derived from anything else. I’d like to create an alphabet from the lettering on the pre-80s packages, I think it’s wonderful.</p>
    <p>Thanks!</p>
    <p>More on Darigold labels:<br>
    <a href="http://www.darigold.com/butterlabels.asp" title="http://www.darigold.com/butterlabels.asp">http://www.darigold.com/butterlabels.asp</a></p>
