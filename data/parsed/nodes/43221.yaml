    html: |-
      <p>What Chris Lozos means is that, in addition to the ’calt’ feature which you already have, you need to create an ’aalt’ feature looking like this:</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;feature aalt {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;feature calt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;feature onum;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;feature lnum;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;feature tnum;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;feature pnum;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# and other substitution feature ...<br>
      &nbsp;&nbsp;&nbsp;&nbsp;} aalt;</p>
      <p>Upon compiling features, AFDKO will check all features listed in the ’aalt’ feature and create substitutions like </p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;# single alternate ...<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub a from [a.alt.1 a.alt.2 a.alt.3];<br>
      &nbsp;&nbsp;&nbsp;&nbsp;# multiple alternates ...<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub b by b.alt.1;</p>
      <p>so that InDesign’s Glyph Palette can show <em>a.alt.1</em>, <em>a.alt.2</em> and <em>a.alt.3</em> as alternates to <em>a</em>. If you find that some alternates are missing from the Glyph Palette, you may add substitutions like the above one manually to the ’aalt’ feature. I think they should follow the <em>feature aalt;</em> etc statements.</p>
      <p>There’s one thing to keep in mind. You can add, but not omit, the presentation of certain alternates in InDesign’s Glyph Palette!<br>
      Even if you omit statements like <em>feature calt;</em> and write all alternate substitutions manually (with the ’by’ or ’from’ syntax), InDesign is clever enough to analyze all your other features to find alternates by itself. There does not seem a way around this. So InDesign may show more alternates than you would like it do do.<br>
      (Advantage: InDesign is capable to show alternate glyphs even with fonts that lack an ’aalt’ feature. Disadvantage: The type designer does not have full control over alternates shown in the Glyph Palette. — My suggestion would be that InDesign checks whether an ’aalt’ feature is present, if yes then it would switch off its automatism, if no then switch it on.)</p>
      <p>[Edit: Didn’t see your last post while writing mine ...]</p>
      <p>Karsten</p>
