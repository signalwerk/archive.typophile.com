    <p>Hello,</p>
    <p>I’m in the process of digitising handwriting into a font with 3 alternates for each glyph. I already have the opentype coding for the “randomnisation” coverd. The problem now is, that my glyphs don’t get combined in the Indesign glyph palette, as is automatically the case, when I design smallcaps. Is this because the opentype feature is programmed as contextual alternates? Or is this because of a different reason?</p>
    <p>Any help appreciated,<br>
    Dries</p>
