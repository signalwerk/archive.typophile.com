      <p>@Haley: <em>I don’t think he’s asking for specifics about people in those companies.</em></p>
      <p>@skywalker: <em>I’d like to know about any experiences, etc.</em></p>
      <p>He specifically asked for experiences. Surely the implication is that he wants to hear any stories font makers have had with vendors? I was working on that.</p>
      <p>Anyway, if Skywalker only wants to know things like, ". . . how one comes to have their fonts sold at Veer. Does Veer approach them? Do they have to submit something to Veer etc." the best way of finding out, the most appropriate way, is for him to ask Veer, P22, T-26 et al, or look on their websites for information. It's common for vendors to offer that kind of general information up front.</p>
