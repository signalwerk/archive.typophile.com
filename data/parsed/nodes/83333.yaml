    html: |-
      <p>Meanwhile, minor breaththrough i think.<br>
      I was thinking italic Q and Z, though handsome, looked a little old fashioned, so I tried an update (first line below, right is revised).<br>
      But looking more closely at that Q tail reminded me that (in Noordzij's terms) the contrast pattern of this typeface is expansion rather than translation. And that made me realize that my recent attempts at adding contrast to horizontals (of E, L, T etc) was hewing more closely to translation than necessary. Keeping the contours parallel was giving them the "calligraphy pen" look that wasn't quite appropriate. So the bottom shows a free-er swelling of those horizontals.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/expansion2_6159.png"></div><p></p>
    html_clean: |-
