      <p>The symmetrical counter idea is something I've wrestled with too, but I've so far always given it up. That doesn't mean it doesn't work here, but maybe it does the 'f' no favours. </p>
      <p>New 'a' width looks just right. But maybe the teardrop in the top example is slightly light?</p>
      <p>About the 'u' height: I always end up with the 'u' top serifs slightly different from the 'inmh' top serifs, the left one a little shorter (and therefore a little steeper), the right one a little longer (to close the countershape a little). This approach might make it appear slightly less tall, although it obeys the x height. Just thinking out aloud here. Your new treatment looks better, though. </p>
      <blockquote><p>How's this:</p></blockquote>
      <p>Just right.</p>
      <blockquote><p>Does it bug you?</p></blockquote>
      <p>I'm not sure, but maybe it's a bit strange that the "sanded" stems are (optically) similar to the stems in 'm' and 'n', that are compensated for the tight junction. </p>
      <p>Very good new ampersand! Much more in character, I think. </p>
      <p>I'd strongly prefer the closed four for this typeface. I really like the open shape, but it is more Didot in character, making it a bit anachronistic in this environment, maybe.</p>
