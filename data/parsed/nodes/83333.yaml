      <p>I can see how my idea might be counterintuitive, inasmuch as you'd think at small sizes you might pare down the inessential details rather than emphasizing them. But my idea is that (like hairlines) the transitive serifs get lost when scaled down unless given a little oomph, whereas at display sizes they needn't be so emphatic to perform their linking function.<br>
      This is more a hypothesis than a conviction, I should say.</p>
