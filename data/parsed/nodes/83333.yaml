    html: |-
      <p>Hi Craig,<br>
      Good to see this back in critique. Seems nobody has commented on the roman weights since your latest update to them. I have a problem with the new /a/ and /c/. To my eyes they look awkwardly skewed now that the counters have been opened up. They look like they're diagonal rather than horizontal across the top. I'd held off on commenting on this in case that was a feature that helped in text sizes, but having seen the latest pdf, I still find these letters a little jarring. This is what I mean:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/millenialac_3791.JPG"></div><br>
      I love the italic ampersand. My only comment would be that maybe the transition out of the curve in the lower right could be less abrupt in the black weight, by pushing it in slightly. Not as much as here, but it shows where I mean:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/millamp_6441.JPG"></div><br>
      Elsewhere, lining /3/ seems a little top heavy and slightly leaning to the left because of it.<br>
      Small caps thins look thicker than all the other thins?<br>
      Small cap /6/ and /9/ look too bold.<br>
      Italic /Z/ - I don't think there's enough weight in the bottom crossbar. In all weights but especially the darker weights. I think a less exaggerated wave would help.<br>
      I like the Cooper Black style /f/ in the black weight. Maybe there could be more of this in the lighter weights too.<br>
      Italic /y/ - the ball terminal feels lower than the left hand side (more pronounced in bolder weights). Also, it feels to me like the body of it dips too far under the baseline. Did you try any ways of cutting that thick stem rather than have it go all the way into the descender? Maybe using the /v/ shape would be good. Also has the added benefit of being easier to space well.<br>
      Black italic /k/ I think the eye could be more pleasingly round (at least for display cut):<br>
      <div class="imageWrap"><img src="http://typophile.com/files/millk_4657.JPG"></div><br>
      Overall it's looking really good. Different enough to stand out but not too different that it's unusable.<p></p>
