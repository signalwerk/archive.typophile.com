    html: |-
      <p>This is all very picky. </p>
      <p>R: Leg <em>slightly</em> thin? Personally, I'd chose another R model, not fond of the gap between stem and leg. But nothing wrong with it otherwise, of course. </p>
      <p>S: Very slight bumpiness on the inside curves. </p>
      <p>Y: Slightly thin arm (compared to V)?</p>
      <p>r: Should the thin part be ever so slightly thicker?</p>
      <p>s: Too thick stem. Look at hot-spots in preguess, nonplussed. I think the 's' almost always needs to be a little too light to look right in context.</p>
      <p>vw: I think the apex (is it called that on the bottom too? Anyway, that's what I mean) is too far to the left on both, but that too is perhaps a matter of taste.</p>
      <p>w: A little too wide, in my opinion. </p>
      <p>The ligatures containing ff are slightly too loose, in my opinion.</p>
      <p>Is the ampersand authoritative enough for this typeface? Cross-compensation needed anyway. </p>
      <p>Italics:</p>
      <p>MN: Too similar in width? </p>
      <p>X: Slightly too black, I think. Cross-compensation still needed. </p>
      <p>Y: Arm too light?</p>
      <p>abcde: Something with the rhythm slightly off in these? 'd' slightly wide? 'b' and 'e' slightly narrow? Not sure about this at all, but I recommend having another look. </p>
      <p>p: Too tall? </p>
      <p>§, æ, ‰ look slanted.  </p>
      <p>OSF rocks, perhaps 8 is a little uncompensated. </p>
      <p>I think this typeface would be happy to have distinct ampersands in Roman and italics.</p>
