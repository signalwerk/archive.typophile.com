      <p>On the topic of small caps:</p>
      <p>The subtlety is lost if the reader notices them, hence the further from cap height you go the less like capitals they will look. Now small caps are supposed to look like capitals, they just don’t have the function caps normally have: marking the beginning of a sentence. </p>
      <p>Capitals should be heavier than minuscles for many reasons, but I consider the primary one the larger counters. An “O” needs to be heavier then an “o” just to look similar. Since small caps are often—and indeed should be—tracked wider than minuscles, there is a certain need for some extra weight here as well. The loose spacing makes them seem thinner than they are. Remember, white and black are intertwined in <em>notan.</em></p>
    html_clean: |-
