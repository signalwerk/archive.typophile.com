    html: |-
      <p>Lovely work, Craig. I'm enjoying this.</p>
      <p>Some observations (remember the salt!)</p>
      <p>• I don't understand the serifs! Will their shape be visible at target size?<br>
      • Favourite glyphs /b/, /g/, /s/ and /y/.<br>
      • R looks a bit top heavy, maybe that's intentional? If so, make it more top heavy?<br>
      • Is the lining zero a bit pointy?<br>
      • There's something cuspy going on in the top of the counters of B, E, F, P, R and S (but not D). It's not pronounced enough to be a feature, but is poking my eye just enough to be something. Also check your lovely ampersand, there's a glitch on the arm.<br>
      • G may need a pointier spur to harmonise with b, q and @. Is @ a bit too pointy?<br>
      • Foot spurs on /d/ and /u/ may be a bit clotty? Perhaps trim the inside of the spur and/or make the notch taller?<br>
      • Descender of /j/ may be a bit of a loose curve? Similar story with /f/. Maybe that's just my preference though.<br>
      • Foot of /f/ in /fl/ has got mangled.<br>
      • Arm of /k/ looks to start a bit high up the stem.<br>
      • Comma/quotes I'd make the tail much longer...as you know I obsess about commas!<br>
      • Bold looks newsy, regular looks booky, somehow, is that because of the higher contrast in the bold?<br>
      • Check bold /u/'s width. Actually the regular /u/ may also work slightly narrower.<br>
      • Bold /g/'s ear may need to move upwards to prevent crashing/splotching.<br>
      • Lining numerals are splendid. 6 may need a bigger bowl.<br>
      • + is a little meek. Love the %.</p>
    html_clean: |-
