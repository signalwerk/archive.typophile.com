    date: 2011-07-16T01:08:00
    date_raw: 16 Jul 2011 — 1:08am
    votes: null
    html: "<p>I'm sorry for being a party pooper, but as a reader of several languages where 'æ' is part of the alphabet, I don't find this suitable for text setting. I also think using a two-storey shape where all other glyphs derived from 'a' are one-storey is ... er ... wrong. There is something distinctly uncursive about its shape too (though it is much better in that respect than the 'æ' it replaced), the way those two thick stems meeting from opposite directions is not graceful to these eyes, and that left-turned tear terminal has no precedence in your italics. Lastly, this glyph is somehow two-storey in the back and one-storey in the front. That will not look harmonious in settings with a lot of 'æ's. Try these sentences: \"Lærerens nærvær i ernærinslæretimen\" (standard Bokmål) or even \"Væræ me kællæne på Tælæk\" (older Tønsberg-dialect). These examples are extreme, but both makes perfect semantic sense.</p>"
    html_clean: "<p>I'm sorry for being a party pooper, but as a reader of several languages where 'æ' is part of the alphabet, I don't find this suitable for text setting. I also think using a two-storey shape where all other glyphs derived from 'a' are one-storey is ... er ... wrong. There is something distinctly uncursive about its shape too (though it is much better in that respect than the 'æ' it replaced), the way those two thick stems meeting from opposite directions is not graceful to these eyes, and that left-turned tear terminal has no precedence in your italics. Lastly, this glyph is somehow two-storey in the back and one-storey in the front. That will not look harmonious in settings with a lot of 'æ's. Try these sentences: \"Lærerens nærvær i ernærinslæretimen\" (standard Bokmål) or even \"Væræ me kællæne på Tælæk\" (older Tønsberg-dialect). These examples are extreme, but both makes perfect semantic sense.</p>"
