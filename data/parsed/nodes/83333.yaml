    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fours_3542.png"></div><br>
      Some old and new variants of oldstyle four.<br>
      a is latest closed form<br>
      --   It bows out very subtly. The lining four will be closed for sure.<br>
      b is the first open form<br>
      --   The danger here is that the counter is relatively too small with the other figures.<br>
      c is the recent convex open form with a more open counter<br>
      --   I think this solves the counter balance problem.<br>
      d is a new still more open construction, now ascending<br>
      --   Counter balance works pretty well with this too, I'd say. Looks a little weak at the baseline perhaps.<br>
      e is the same as d, but with a semi-ascending and semi-descending vertical position<br>
      --   The present italic OS four has this in-between positioning.<br>
      f is e with a baseline serif<br>
      --   Solidifies the bottom but gets busy in the lower right quadrant.<br>
      g is f with a three-way rather than four-way intersection<br>
      --   Helps with the busyness but is perhaps too weird.<p></p>
      <p>Maybe c or e is best.</p>
    html_clean: |-
