    html: |-
      <p>Per Sindre's suggestions, for the roman:<br>
      S smoothed, Y arm thicker, r thin thicker, s spine lightened, v and w angles changed ever so slightly and w narrowed, ff ligs respaced.<br>
      Then, the more exciting stuff: as I'm discerning the emergent personality of this typeface, I think it's time to disembark from the model for those character-filled glyphs R, Q, and ampersand. Pairs show Century-like original left and my new take right.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/roman_6519.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/roman2_6322.png"></div><br>
      Italic changes:<br>
      how does "abcde" look now? I raised the top of the counter of b and widened it slightly. Then, I think key was to make d's top bowl come into the stem at a downward angle (it was almost perpindicular before. I think this is more graceful and makes the counter rhyme a bit better with those of other letters.<br>
      lowered ascender of p, rejiggered curves of ae<br>
      narrowed N (I've gone back and forth widening and narrowing this glyph since I created it!)<br>
      lightened X and tried again at getting the optical correction right.<br>
      adjusted os8 to mesh with the other figs<br>
      Then the before and after of a dramatic rethinking of ampersand for the italic.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/italic_3961.png"></div><br>
      Sindre, your sharp eye is such a help and your compliments are good fuel for my project. Seriously, thanks!<p></p>
