    html: |-
      <p>I'm no fan of gimmicks either. It's just that sometimes our conservatism is not justified, and there are benefits to be had in features that might seem unconventional. I remember a discussion on Typophile many years ago where I asked Jonathan Hoefler whether he would consider implementing the French-style ascending "3" and "5"; his reply was something to the effect of "Why would I bother?" That sort of conservatism is very alien to me personally.</p>
      <p>Bowing the diagonal of the "4" gives it more apparent size (which is one reason I've recommended Craig do that to the LF "4" as well); making the "2" ascend has at least three functional benefits; and things not lining up is not so bad in a text font.</p>
      <p>hhp</p>
    html_clean: |-
