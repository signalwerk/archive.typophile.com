      <p>R: it's more about the 'black balance' — you could narrow the bowl or add a bit more weight to the right foot by splaying the serif a bit higher. Either way the black would be weighted slightly toward the base of the glyph.</p>
      <p>u: to me it still looks a bit counter-centric, I'd bring in the stems a little more, or add more black to the curve.</p>
      <p>I've just surprised myself by seeming to be now talking in terms of notan. Someone will be happy.</p>
