    html: |-
      <p>This is what the serifs look like up close: an asymmetrical quirkiness of my own that was one of the ways I thought I was inserting a little personality (but the question of whether they register at size is a good one...) The idea is that the asymmetry could provide a little "warmth."<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/serifs_4692.png"></div><br>
      I am struggling with what form larger-scale personality/originality could take in this typeface. I see the visual logic in the design, so quirks for the sake of quirkiness seem hard to justify. Maybe some value could be added in additional weights, e.g. taking this structure in a much fatter direction...<p></p>
      <p>Ben, thanks for the suggestions!</p>
