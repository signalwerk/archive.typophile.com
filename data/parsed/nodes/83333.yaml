    html: |-
      <p>All improvements! The /k can still look better. The old /k had a leg which looked good. Its thick-thin transition started halfway down the length of the leg, whereas in the new one it starts from the very origin of the leg. (God is this hard to explain!) Let the strokes encompassing the leg dance parallelly a bit longer.</p>
      <p>Dave's suggestion for the eye of /k, which he nicely illustrated in his comment, will IMO definitely make that /k go from looking good to looking great (once and for all!). I realize you want to keep the leg and the eye as two independent components (for the sake of consistency, because the regular shows this feature, as if the pen was "lifted" in between). I think you can keep this feature while also making Dave and me happy. The problem is that the straight edge of the leg seems to be pushing the loop of the eye to the right. Nevertheless, the loop does not necessarily have to join the leg at the very edge. Changing that would concede the loop a bit more concavity, which is what Dave wants.</p>
      <p>Hopefully this all makes sense. Otherwise I should follow Dave's example and start drawing more and writing less...</p>
