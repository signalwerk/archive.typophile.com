      <p>You know what I think, but this is the best place to say it: this is very polished and seems extremely readable, but it's also difficult to see people noticing it, and if they do, difficult to imagine them thinking it's anything but yet-another-Century. This will sound strange coming from me, but: put more of your personality in it!</p>
      <p>BTW, what's with the foot serifs: adnate on the left, and on the right what I call Doric (like in my Maral)? Isn't that too Po-Mo for this context? But hey, it might actually address what I wrote above... If so, why not apply that weirdness to the entire font?</p>
      <p>hhp</p>
