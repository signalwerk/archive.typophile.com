      <p>I think it's much more elegant with the full length descenders. I'm liking this more and more. You've done the right thing with the arched letters too, and I like the numerals.</p>
      <p>I'm looking at pdf03, salt and pepper ready?</p>
      <p>• italic y, maybe add a bit of springiness into the downstroke, it looks a little rigid.<br>
      • sorry to harp on about the commas/quotes, but I'd make the tails darker still, and longer. I'm not sure exactly what target size you're aiming for, somewhere around 10-11pt?<br>
      • counters of /e/ and /o/ at top are rather different; I prefer the /o/, but perhaps it's good to have a slight differentiation for reasons of legibility?<br>
      • tail of /Q/ to descend a bit more? Looks perhaps a bit bunched up and danger of clotting (more so in the italic somehow)?<br>
      • /W/ looks narrow.<br>
      • Italic /K/ did you try the loopy arm thing like on the /R/?<br>
      • Spur of /G/ seems to need more prominence — to the baseline? — to make it stable, or a bit more shaped like the spur on /b/.<br>
      • Italic /C/ add a bit more to the teardrop (and maybe pull in slightly)?<br>
      • Italic /U/ did you try an uppercase version of the /u/?<br>
      • Italics overall are delicious.<br>
      • Oldstyle 6 and 9 look somehow from an older era than the other glyphs. I guess that might be a good thing for 'oldstyle' numerals, but to me they stick out in an odd way.</p>
