      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bendy_5925.png"></div><br>
      Ironed out top counters of BEFPR.<br>
      Fixed ampersand arm.<br>
      Sharpened "spur" of G<br>
      Softened spur of a in at-sign, and also made the entire glyph smaller. I realized that the "a" inside could relate to the lowercase proportions without having to literally take up the x-height.<br>
      Gave more breathing room in notch of d and u (also narrowed u slightly).<br>
      Added some length to tails of commas, quotations marks.<br>
      Tightened radii of j and f hooks.<br>
      Lowered k arm on stem very slightly.<br>
      Softened pointiness of zero, and enlarged bowl of six.<br>
      Not shown: lengthened strokes of plus, minus, equals.<p></p>
      <p>Ben, by R looking topheavy do you mean the bowl's size large relative to the leg?</p>
