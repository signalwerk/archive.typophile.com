    <p>Going to try my hand at a typeface suitable for extended text. Morris Fuller Benton is my mentor.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Picture_4332.png"></div><br>
    I'm looking to Century Oldstyle for general guidance on structure and proportion--it's a great model, in my opinion--but I'm drawing this from scratch and departing from the prototype freely in parts.<br>
    I envision eventually creating a broad palette of size-specific cuts and weights.<p></p>
