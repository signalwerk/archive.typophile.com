      <p>Hi Craig, nice to see this progressing. I still think the beauty of this face is in its well-executed robustness rather than in the more idiosyncratic details; however, I prefer the first /Q/ with its loopy tail. Actually, I'd pull that tail down a bit on the left side, I think it's a bit too close to the bowl and that counterspace will clog. Q is a rare letter so I don't see a problem in its fluidity.</p>
      <p>Re the /s/, remember not to consider it in isolation. Your other terminals will need to follow similar patterns. I personally like version 5, but add a bit more weight to balance the top terminal.</p>
