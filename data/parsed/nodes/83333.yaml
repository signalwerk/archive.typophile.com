      <p>I think it's better now.</p>
      <p>BTW, the facilitation of tighter vertical spacing could<br>
      be seen as a byproduct of a great good: the proper vertical<br>
      distribution of information. Since ascenders play a much<br>
      greater role than descenders in the formation of boumas,<br>
      it makes sense to give them significantly more room. Yes,<br>
      this results in stubby descenders (and you certainly don't<br>
      want to go too far) but in my view that is in fact a fruitful<br>
      compromise. I myself determine the descender length such<br>
      that the "g" looks slightly cramped; if it's too happy then<br>
      you're paying a big price elsewhere.</p>
