    html: |-
      <p>It is not easy giving critique at this stage, but I've had a look at the latest pdf, and here are some thoughts on the base design. I have not had time to look closely at all the weights, I'll get back to it.</p>
      <p>I have not read all the posts here, so I will inevitably address things that are already well-addressed. Feel free to ignore any and all comments.</p>
      <p>Roman </p>
      <p>I'm wondering what the rationale for the sharp inside points of 'f', 'a', 'n' et al is? Is it too subtle to be a functional device, and shouldn't we also see them in the numerals and (more of) the upper case? This also applies to the very short straight line to the west of 'e'. </p>
      <p>Is 'a' (very) slightly wide? </p>
      <p>Is 'u' slightly tall? </p>
      <p>Are 'w' and 'y' a little light and dark, respectively?</p>
      <p>Why do 'i', 'l' 'h' et al have sanded-off right-tops? </p>
      <p>Why are 's' serifs so dissimilar? </p>
      <p>Is the right part of 'V's right serif too short?</p>
      <p>Should '&amp;'s arm be straighter? </p>
      <p>'five.lining's serif is very heavy, and the top of the curve much lighter than its OSF sibling's. Also, the characters of the two fours are maybe too different for one typeface? </p>
      <p>Italic</p>
      <p>'a' a little tight at the top junction? Maybe very slightly too upright? </p>
      <p>'z' lacks heft, I think. </p>
      <p>Something a little stiff or unfluent about the 'u' shape I can't quite put my finger on. Italic 'u's are always difficult. </p>
      <p>Unsure about the 'Z' crossbar, also because of uni01B5. </p>
      <p>I really like the heavy weights, I especially dig the f/j treatment. But more on that later.</p>
    html_clean: |-
