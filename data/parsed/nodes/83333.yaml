      <p>I don't know… I'd worry that any of these contextual alts might draw more attention to that specific pairing than the gap would.</p>
      <p>Since you asked for my opinion on the "cursive" caps: I think they're cool and interesting (like Sindre, I'm least convinced by the "T"); I would also prefer having them as stylistic alts, though. Mainly because the difference in "expressiveness" between them and the "all-caps caps" is so big that they kind of feel like different styles of the same typeface, which I'd worry may seem confusing in situations where all-caps and mixed settings coexist. That, and they're kind of, well, special, so they draw attention. Which should be great for some settings but may be distracting for normal running text (especially in the context of this face which otherwise doesn't strike me as especially "loud", extravagant, or flashy; so they do stand out). And there's maybe also the consideration that not everyone who uses all-caps settings actually uses the All-Caps command… (sorry, I'm being a worrywart!)</p>
