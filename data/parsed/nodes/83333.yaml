      <p>Thanks Dave for the input!</p>
      <blockquote><p>I have a problem with the new /a/ and /c/. To my eyes they look awkwardly skewed now that the counters have been opened up. They look like they're diagonal rather than horizontal across the top.
      </p></blockquote>
      <p>Yes, this is admittedly experimental, inspired by the fact that when I loosed the hooks of /f/ and /j/ they seemed a little more up-to-date, so I wondered what would happen with /c/ and /a/. Yet another Benton typeface, Clearface, was another inspiration (though one that takes the effect quite a bit further). I thought it might lend a little dynamism, but obviously if it's catching the reader's eye it should be done away with, or done more subtly. I'll keep experimenting.</p>
      <blockquote><p>I love the italic ampersand. My only comment would be that maybe the transition out of the curve in the lower right could be less abrupt in the black weight, by pushing it in slightly. </p></blockquote>
      <p>Agreed.</p>
      <blockquote><p>Elsewhere, lining /3/ seems a little top heavy and slightly leaning to the left because of it. </p></blockquote>
      <p>I've now made the top teardrop terminal a little smaller in the bold master and did some other tweaks; hopefully that fixes it.</p>
      <blockquote><p>Small caps thins look thicker than all the other thins?</p></blockquote>
      <p>Yes, that's actually because so far I've only drawn the regular small caps (not the display or bold masters) so among display letters the small caps will look clunky.</p>
      <blockquote><p>Italic /Z/ - I don't think there's enough weight in the bottom crossbar. In all weights but especially the darker weights.</p></blockquote>
      <p>What do you think of the revisions in the post above yours?</p>
      <blockquote><p>I like the Cooper Black style /f/ in the black weight. Maybe there could be more of this in the lighter weights too.</p></blockquote>
      <p>I very recently changed the bold /f/ that actually bends back, Cooper style, to one that pinches in from both sides (see below). </p>
      <blockquote><p>Italic /y/ - the ball terminal feels lower than the left hand side (more pronounced in bolder weights). Also, it feels to me like the body of it dips too far under the baseline. Did you try any ways of cutting that thick stem rather than have it go all the way into the descender? Maybe using the /v/ shape would be good. Also has the added benefit of being easier to space well.</p></blockquote>
      <p>Heh, if you go back a few hundred posts in this thread you'll see I tried all kinds of /y/s. I am very fond of the structure I wound up with (despite its admitted more difficult spacing). I have done a little tweaking now, including moving the top teardrop higher and the bottom one rightward as you suggest. </p>
      <blockquote><p>Black italic /k/ I think the eye could be more pleasingly round (at least for display cut)</p></blockquote>
      <p>I don't want to lose that bulge that sort of caps the leg inside that counter, but I have made it more subtle now.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/333fff_6570.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/eyyyk_5347.png"></div><br>
      Grateful for your time and eye!<p></p>
