    html_clean: |-
      <p>Thanks for the input Martin. Yes, I'm pretty settled on the /y/ that simply has its transitional serif docked, concluding as you did that the ones that varied more from the standard form were too different.</p>
      <p>Maybe I'm being too stubborn but I just feel like I want the binocular /g/ to work for this face. That said, I might sketch some ideas for a one-story and see what comes out. It's the stiffness of the binocular structure that feels fitting to me, but maybe I can come up with a one-story that shares some of that character.</p>
      <p>Glad to hear /g/ #3 works for you. I think that issue might be settled now too.</p>
      <p>What to do with the caps is still up in the air. I was thinking/hoping that the fancier ones could be standard, and the plain ones available as a stylistic set and/or when all-caps is triggered. But it sounds like you guys are seeing them more as swashes, in which case they shouldn't be default--and maybe in which case they, along with the open-bowl /g/, should be set aside for a display cut rather than put into the text fonts at all? (Of course the solution for one of these might be different than for the next--the /T/ is quite different from the /R/, which I can't imagine looks objectionably swashy in normal settings to anyone.)</p>
      <p>Can you specify what you find a little odd about the /K/?</p>
