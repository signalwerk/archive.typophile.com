      <p>There are more ways...</p>
      <p>Here's what I did in Nour&amp;Patria:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fiflx3_5327.gif"></div><p></p>
      <p>In the first two rows (Patria and Italic) the "fi" is a hybrid solution, since the x-height is rather large. In the third row (Nour's subordinate Latin) the "fi" is traditional, since the x-height is smallish. In all three the "fl" sees no contact between the two letters, and the "el" is trimmed instead of the "f" being neutered. There are many little tweaks (like pushing the tittles slightly to the right) to further balance the compromises.</p>
      <p>hhp</p>
