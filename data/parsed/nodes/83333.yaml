      <p>I also think that /g/ is "cute" as hrant puts it. I do however agree that it looks too contemporary for this typeface, but I think that's mainly the fault of this classical /y/ because the capitals have plenty of 'contemporary'.</p>
      <p>If the one-story /g/ reads well at text size but the spectacle /g/ is stylistically more appropriate, then that makes me wonder if it's a good idea to design a hybrid.</p>
      <p>&gt; and maybe in which case they, along with the open-bowl /g/, should be set aside for a display cut rather than put into the text fonts at all?<br>
      I personally wish these swash caps would remain available for the text face</p>
      <p>&gt; Can you specify what you find a little odd about the /K/?<br>
      Well, you have this slightly curved tail with a sudden upward stroke. In my opinion that's too contemporary for this typeface; something more classical would work better. But the tail on its own is not bad; it's that the arm is also curved and then has this chunky reverse serif which makes it look even more contemporary. I think it's just the whole curved but blocky look about /K/ and /R/ which I don't see as completely fitting to this typeface.</p>
