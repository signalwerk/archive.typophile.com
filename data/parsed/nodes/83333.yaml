      <p>&gt;Is it okay to keep the caps uncondensed, or will they jump out?</p>
      <p>I'd want it to be deliberate either way; make them obviously uncondensed (U, V, W and Y look rather narrow) and have a reason behind it, or draw them all in to match the lc. </p>
      <p>Cap G draws attention, looks a bit Ambicase!</p>
      <p>&gt;What relationship should extenders in the accompanying italic have to those of its roman?</p>
      <p>I read somewhere that the extenders should be visually the same length, which means shortening them slightly to compensate for the slant. See <a href="http://typophile.com/node/49550#comment-302136" rel="nofollow">here</a></p>
      <p>Are the stems of U slightly nonparallel?</p>
