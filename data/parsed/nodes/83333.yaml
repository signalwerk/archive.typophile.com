      <p>Okay, this image shows some italic fixes based on Sindre's feedback:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/italicfixes_6737.png"></div><br>
      - /a/ junctions are reworked a bit and counters are rotated very slightly<br>
      - /z/ is darker (and leans a little less than it did before)<br>
      - /u/ I didn't do anything with yet. I don't mind a little stiffness in this face, though I think it's a pretty homely letter on its own now. It's actually pretty directly a rotated /n/. And both are, again, based on a symmetrical counter (there's a canted, symmetrical, sort of parabolic arc in the counter). I'll probably try some more tweaking. You're absolutely right that italic /u/s are difficult!<br>
      - /Z/ in Zap shows the same glyph with the crossbar removed. I think at least in the higher contrast masters (#2 bold and #3 display) that long skinny diagonal gets awfully long without the relieving weight of the crossbar. So if just removing it doesn't work, one option would be giving up on the thin-diagonal structure (i.e. adopting the thick-diagonal structure of the roman). But I like the challenge of trying to get the thick horizontals to work :-)<p></p>
