    user: 3254
    date: 2013-07-17T15:26:00
    date_raw: 17 Jul 2013 — 3:26pm
    votes: null
    html: |-
      <p>Thanks a million for the feedback Sindre!</p>
      <p>On the roman comments:</p>
      <blockquote><p>I'm wondering what the rationale for the sharp inside points of 'f', 'a', 'n' et al is? Is it too subtle to be a functional device, and shouldn't we also see them in the numerals and (more of) the upper case? This also applies to the very short straight line to the west of 'e'.</p></blockquote>
      <p>I can tell you the thinking, though I don't know that it serves as justification. At some point in the development I had the idea of cleaning up all the counters so that they had a simple geometry based on symmetry (so, for example, /b/'s counter is an oval rather that being straight on the stemside). I was particularly intrigued with what this meant for the /n/ (and other humped letters), which if there was to be a corner at the join, there would be a corner opposite, too. But the outer contour would simply arch around smoothly, and the mass as a whole would read as a pretty conventional arch--the corner in the arch would be "subliminal"<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/countersymmetry_4904.png"></div><br>
      From there I decided to see how far the symmetrical-counter idea could be stretched. I wrestled it into the /g/, which I like. It was already there in letters like /e/. For the closed counter of /a/, the symmetry could divide the drop-shaped counter diagonally. The /K/'s counters could be up-down mirror images of each other, at least near the middle of the glyph.<br>
      From the /n/ I redrew the /r/ to have the same symmetrical arch underneath. I tried to do the same with /a/ and with /f/, but I probably hit the point of diminishing returns somewhere in there. The /f/ in particular feels like an outlier now. (The conceit is most obvious in "branching" structures which explains why it's less evident in figures and caps.)<p></p>
      <blockquote><p>Is 'a' (very) slightly wide?</p></blockquote>
      <p>I think it was, particularly in the display master. How's this?:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/awidth_4884.png"></div><p></p>
      <blockquote><p>Is 'u' slightly tall?</p></blockquote>
      <p>It's the same as the similar stem tops in /n/m/r/etc., which raises the question whether they too are too tall. I have now lowered the top point of those stems a few points, and also taken out the bulge of that long segment at the the top. What do you think?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/uheight_3805.png"></div><p></p>
      <blockquote><p>Are 'w' and 'y' a little light and dark, respectively? Is the right part of 'V's right serif too short?</p></blockquote>
      <p>Yes on all counts. How's this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/vowellyusethis_4766.png"></div><p></p>
      <blockquote><p>Why do 'i', 'l' 'h' et al have sanded-off right-tops?</p></blockquote>
      <p>I think I liked the idea of the top angle being a right angle, rather than acute. Almost like a mirror of baseline serifs, though bent over a bit. Does it bug you?</p>
      <blockquote><p>Why are 's' serifs so dissimilar?</p></blockquote>
      <p>I think that detail reflects my efforts to have the face be both classic and fresh. The full barb at the top feels more traditional, the cleaner solution at the bottom more modern, and I think maybe having them both be one or the other carries the letter too far over to that side.</p>
      <blockquote><p>Should '&amp;'s arm be straighter?</p></blockquote>
      <p> What do you think of this?:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ampersands_3619.png"></div><p></p>
      <blockquote><p>five.lining's serif is very heavy, and the top of the curve much lighter than its OSF sibling's.</p></blockquote>
      <p>Agreed on the curves; by the serif do you mean the teardrop at the bottom, or the one at upper right?</p>
      <blockquote><p>Also, the characters of the two fours are maybe too different for one typeface?</p></blockquote>
      <p>Hmm, maybe. If you were to make them more similar, which structure would you work with?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fours_3774.png"></div><p></p>
      <p>Responses to your italic comments later. Again, I really appreciate the careful look!</p>
