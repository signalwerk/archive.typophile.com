    <p>Dear type designers</p>
    <p>I tried to alert and alarm you about the piracy's and EULAs' violations dangers at ophello's topic, but you ignored me, didn't believe in me, if you continue ignoring me and being uncoscient of all, you'll be hazard being blackened and losing the market and money. Please be conscient of that all that you didn't know.</p>
    <p>Free and original fonts' EULAs dangers</p>
    <p>The type designers aren't conscient of that the clients buy the fonts or download the free original fonts without reading the EULA INfO notepad or PDF for using them unintended for the commercial use because they just ignore them, or because they don't understand or speak English and don't know what EULA is. The type designers forgot of writting the name's notepad "PLEASE READ THE RULES" in the place of "FONT INFO", and forget of translating the notepads into other languges for the clients to understand the notepads in another languages and after they'll obey the rules of EULA. </p>
    <p><strong>Resoltuion of these problems</strong></p>
    <p>Type deisgners may be conscient of all that. Type designers must warn the fonts shops that they tell the clients before of buying the fonts or downbloading the free original fonts [with new windows of warning [in some language]], if the font wished is or not for commercial use, they must ask the fonts shops to translate the fonts EULA rules into other languages. They must put a phrase "PLEASE READ THE FONT RULES BEFORE BUYING OR DOWNLOADING THE FREE FONT" on their own site in several languages and the client will understand the rules and obey the rules. They must add many international currencies for that the client be able to buy.</p>
    <p>Please be responsible!</p>
    <p><strong>Piracy dangers</strong></p>
    <p>The pirates WISH the excellent, most expensive and bright fonts, therefore, they hack and steal them. But why? Because the fonts can be bought only with the credit card, as Visa, Mastercard, etc. Therefore, the pirates want to buy the fonts with the money, the won national currencies or with the "payment coupcon", but the fonts eletronic shops don't accept them, they want only the dollar, euro or pound and the credit cards, then they're furious, gang for attacking, hacking and stealing the fonts as if the pirates of the fairytake gangged for attacking and destroying the another ship with the England flag. The pirates hate the fonts shops and the type designers as if the pirates hated the English people. Why do they hate them? Because the fonts shops and tye designers are greed, but the type designers aren't conscient of that. They don't recognise their mistakes, as absence of responsibility. </p>
    <p><strong>Resolution of these problems</strong></p>
    <p>They must add many international currencies for that the client be able to buy. The clients need to buy the fonts with the bank accounts, PayPal, Xoom or with the money when they don't have credit cards. Don't forget to warn them if the fonts bought are allowed for personal or commercial uses, you must warn them to read the EULA rules when they open the fonts, with new windows of warning. The EULA rules mustn't be big, but small and basic, because the clients don't have time or have laziness of reading, prefer violating the EULA's rules. </p>
    <p>If you disagree with some of my arguments, please criticize and give me your opinions.</p>
