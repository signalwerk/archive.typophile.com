      <p>&gt; must we report to the civil court or to the police?</p>
      <p>Someone can correct me if I'm wrong, as I'm certainly not an expert, but I think in most cases you simply inform the offender that they are in copyright violation. If they ignore you, your recourse is to sue them. At the trial (at a federal court) you'd present any evidence you have to prove you own the copyright, etc.</p>
      <p>I don't think the police get involved unless there is physical merchandise involved. For example, if someone is selling pirated movie DVDs on a street corner, then they are subject to arrest by the police. But for something like a website illegally hosting movies or songs or fonts or whatever, I don't think the police generally get involved at all. It's handled via a lawsuit.</p>
