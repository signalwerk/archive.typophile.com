      <p>Gustavo,</p>
      <p>EULAs and piracy are different matters. Someone making illegal copies of a font would do this disregarding what the EULA says. And piracy was already largely discussed here. So, let me focus on EULAs.</p>
      <p>I agree with you that an EULA must be more easy to read and understand. This would help people to follow EULA's determinations. And I also agree that some people violate EULAs due to misreading of their conditions.</p>
      <p>Anyway, there are limits to simplify a Law text –as an EULA. There are hundreds of technical terms in Law. As we talk about ascenders, descenders, terminals and x-height, lawyers talk and write using legal words which may cause confusion to people outside the Law world.</p>
      <p>The best try to make EULAs more accessible is what Commercial Type do. They show the EULA in a column, at left. And a short description of the meaning of that part of the EULA at another column, at right. You can see this <a class="freelinking external" href="http://commercialtype.com/checkout/eula" rel="nofollow">here</a>.</p>
      <p>About other languages, any auto translation would be disastrous when you're processing a technical text. A word could have one meaning in common usage of a language and a completely different meaning in Law. Sometimes, the difference is really subtle and there is no software able to handle all these questions.</p>
      <p>Finally, rules about customers, copyrights and software protection are fairly similar in most countries of Europa, Oceania and Americas, and also part of Asia and Africa. So, for people of most countries, the rules applied in EULAs from other contries are similar to the ones from his/her own contry. Of course, there are always differences, but the basic is very similar.</p>
