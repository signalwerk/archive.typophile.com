      <p>I think things are a bit mixed up here...</p>
      <p>Against piracy per se there is in most countries a law for that. So this should be dealt through the legal system with first making people aware of the breach of law by pirating, maybe they were not aware.</p>
      <p>The EULA is a complete different thing, as licensing rules are different in each country. If you want to translate the EULA into every language then this is only of limited use if you don't check which parts of this EULA actually can apply in which country.</p>
      <p>For example I know that here in Austria, and therefore probably Germany and maybe the whole EU, an EULA is often not valid, most of the time to the fact that it must be agreed on before the buy. In case of a software package in a local store this means that the EULA would need to be printed on the package. Online if one can take note of it (if there is a link on the page before you buy it), otherwise it does not apply at all. And if you can take note of it, then it is not said that every rule would apply, as consumer protection is quite high here. If I can't take note, then for example I could edit the font as much as I want, as long as I only print it at home for my personal posters or whatever (which would not be useful and is only a hypo-theoretical statement). I am not an expert though here. </p>
      <p>The issue with the EULA is different though from copyright violations, which means close rip-offs or redistribution. This is protected by law in most states anyhow.</p>
      <p>My point is that an EULA does not protect from piracy, because it might not apply. The legal probably has better means to confront piracy. As well there is probably no protection through an EULA, as people who pirate might be aware of what they are doing and that it is not legal, but don't care. It depends on the source where they get fonts. If a website hosts a font, it could be assumed this font is free. If one needs a file-sharing program or downloads a font from a file-hoster, it is clear that it is pirate-ware. In any case the EULA will not help you. It helps you to deal with those who stay within the law.</p>
