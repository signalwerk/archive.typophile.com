      <p>I think the EULA is important, but I think piracy is not so much the result of too little information, or non understood information. My feeling is most (font)piracy is done by people from the industry themselves, in other words people that should know better... In this sense I would say there is a culture of piracy, perhaps even an addiction.</p>
      <p>I used to work at a design agency that worked almost exclusively with illegal fonts and software. I came there as a student and was never thought or told where and how to buy fonts. Some came with software we used, some were provided by the university. So at first I did not see the fault in what the agency did. The fonts and software were mostly downloaded from torrent websites, where one could download the whole Linotype, Adobe or ITC library for free... I now realise that this practice is wrong and that fonts should be properly bought and licenced. </p>
      <p>What I'm trying to say is that education could be a way to battle piracy, if students are informed and thaught about licencing fonts, EULAs etc. And this would help to show respect to typedesigners as well.</p>
