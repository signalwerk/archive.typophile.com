      <p>I don't care about piracy except when pay fonts are presented as free on free font sites. But I am concerned about making the rules easier to understand for people who aren't as familiar with English.</p>
      <p>A EULA is a legal contract. You can translate it, but it's difficult. I've done mine in Japanese but at the bottom it indicates that for legal purposes, you have to abide by the English version. Apart from the EULA, it would be smart to provide simplified rules.</p>
      <p>As Kevin suggested, these rules should be internationally understood. Perhaps it could be done with pictures like an Ikea catalog. I think it would be best put them in a jpg, not a PDF. That way they show up as a thumbnail on most operating systems and people will be more likely to be curious and open it.</p>
      <p>As for the payment problem, what I think we really need is more font distributors in non-English speaking countries. It's not just a matter of taking payment internationally. A font distributor needs to be able to talk with customers. Buying fonts from an English-only distributor leaves the customer with no place to go when things go wrong.</p>
