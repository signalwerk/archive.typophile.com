    votes: null
    html: <p>It’s much more efficient to use indents than line breaks between paragraphs. A line break suggests a break in the text and should be used more judiciously. Line breaks + indents = redundant (plus bad typography).</p>
    html_clean: <p>It’s much more efficient to use indents than line breaks between paragraphs. A line break suggests a break in the text and should be used more judiciously. Line breaks + indents = redundant (plus bad typography).</p>
