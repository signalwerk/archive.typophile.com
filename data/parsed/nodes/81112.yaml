      <p>Protecting digital fonts doesn't seem to be a tough chore, and the laws seem to exist to do so.</p>
      <p>Protecting typeface designs through copyright though would seem to me to be very difficult due to the subjective nature of it, but could be done as they've done it with music. It never the less would be very, very subjective. With music, digital sampling was a new wrinkle for the courts and I guess it would be with typeface design too. Which of the many Garamond designs is an original work and which are too derivative? How far is too far with derivation? Where is the line to not cross?</p>
      <p>There would be some interesting cases if typeface copyright law in the U.S. is tightened up. Here's an interesting and classic case of the subjective nature of musical copyright law being enforced:</p>
      <p>George Harrison vs Bright Tunes Music Corp.<br>
      <a class="freelinking external" href="http://www.fairwagelawyers.com/most-famous-music-copyright-infringment.html" rel="nofollow">http://www.fairwagelawyers.com/most-famous-music-copyright-infringment.html</a></p>
