      <p><em>&gt;Fonts are not music.</em></p>
      <p>Would you consider the drawing of typefaces an art or science? I agree fonts are not music, but do think drawing typefaces is an art similar to writing music, and that like the George Harrison case it's a fine line that separates inspiration from appropriation. The difference is that with drawing typefaces there is no law against appropriation, where in music there is.</p>
