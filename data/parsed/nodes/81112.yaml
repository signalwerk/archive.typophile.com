    <p>Hi,<br>
    I'm new to typophile but I was curious whether there were any typeface designers out there who have opinions on the copyright law surrounding typefaces. The following are some questions I thought might propel the discussion:</p>
    <p>Firstly, as you see it, do you feel well protected by the copyright law concerning typeface design?</p>
    <p>What do you see as the main flaws of the way the law works to protect you as a designer?</p>
    <p>Do you feel the main problem to be piracy or plagiarism?</p>
    <p>Why do you feel so many people are willing to appropriate typefaces without the artist/designer's permission?</p>
    <p>How do you feel would be the best way to resolve this ongoing problem? Does it come from a change in legislation, or an attempt to change people's attitudes...?</p>
    <p>Thanks for your time guys and gals.</p>
