      <p>I'm not interested in these issues.<br>
      Hinting and screen resolution also leave me cold.<br>
      Of course, I must take these into account for business reasons, but generally I follow the norm, without any opinion as to whether that is good or bad or in my best interests.<br>
      I have held strong opinions about such aspects of the type business in the past, and have spoken out, but it seemed pretty pointless, as the voice of one small foundry doesn't carry much weight, and there is little solidarity amongst foundries.</p>
      <p>I don't think piracy and plagiarism, as far as they exist, have much affect on the digital type industry.<br>
      There has always been font piracy, plagiarism, free fonts, bundled fonts, &amp;c, and there is a perception held by some (generally not in the font business) that this is bad and a serious issue and it's hard to make a living selling fonts. But the digital type industry is thriving despite these putative impediments, which have been around since day one. Fonts are not music.</p>
