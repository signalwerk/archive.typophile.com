    html: |-
      <p>How about Postino or Bernhard Std.</p>
      <p>Montara by Jim Parkinson would be a fun choice, slight cutout feel with a bit of retro. </p>
      <p>Jos Buivenga's Diavlo might be an interesting choice depending on the tone of your poster, and it's also free. </p>
      <p>Another awesome font that happens to be free is Birra from Darden Studio. A little crazy, but too fun not to consider.</p>
      <p>Belwe looks like a good choice, fun without losing respectability.The flags on the the V, W, and Y make me think of festivals.</p><div class="imageWrap"><img src="http://typophile.com/files/GarlicComp_5856.jpg"></div><p></p>
