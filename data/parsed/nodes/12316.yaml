    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : James Grieshaber</strong></p>
    <p><strong>James Grieshaber</strong> attended <a href="/wiki/RIT" class="freelinking" rel="nofollow">Rochester Institute of Technology</a> and earned a BFA in <a href="/wiki/Graphic_Design" class="freelinking" rel="nofollow">Graphic Design</a>. Grieshaber was a staff designer at <a href="/wiki/P22" class="freelinking" rel="nofollow">P22 Type Foundry</a> and helped establish <a href="/wiki/IHOF" class="freelinking" rel="nofollow">International House of Fonts</a>. He has been honored with awards of Excellence in Type Design from <a href="/wiki/ATypI" class="freelinking" rel="nofollow">Association Typographique International (ATypI)</a> for <a href="/wiki/Gothic_Gothic" class="freelinking" rel="nofollow">Gothic Gothic</a> and from <a href="/wiki/TypeArt%2705" class="freelinking" rel="nofollow">TypeArt'05</a> for his <a href="/wiki/Operina" class="freelinking" rel="nofollow">Operina</a> Cyrillic type designs. He has been involved with the <a href="/wiki/SOTA" class="freelinking" rel="nofollow">Society of Typographic Aficionados</a> and served as Chairman of <a href="http://www.typesociety.org/about/" rel="nofollow">SOTA</a> from 2008—2010. Designer and Co-editor of the <a href="/wiki/Indie%20Fonts" class="freelinking" rel="nofollow">Indie Fonts</a> book series, Grieshaber has taught typography at RIT and now runs <a href="/wiki/Typeco" class="freelinking" rel="nofollow">Typeco</a>, his own type design studio, in Chicago, IL.</p>
    <p>Type designs by James Grieshaber include: <a href="http://www.typeco.com/cezanne-pro.html" rel="nofollow">Cezanne Pro</a>, <a href="http://www.typeco.com/operina-pro.html" rel="nofollow">Operina Pro</a>, <a href="http://www.typeco.com/segoe-print--script.html" rel="nofollow">Segoe Print</a>, <a href="http://www.typeco.com/reenie-beanie.html" rel="nofollow">Reenie Beanie</a>, <a href="http://www.google.com/webfonts/specimen/Black+Ops+One" rel="nofollow">Black Ops</a>, <a href="http://www.google.com/webfonts/specimen/Short+Stack" rel="nofollow">Short Stack</a>, <a href="http://www.google.com/webfonts/specimen/Atomic+Age" rel="nofollow">Atomic Age</a>, <a href="http://www.google.com/webfonts/specimen/Supermercado+One" rel="nofollow">Supermercado</a>, <a href="http://www.google.com/webfonts/specimen/Metamorphous" rel="nofollow">Metamorphous</a>, <a href="http://www.google.com/webfonts/specimen/Sarina" rel="nofollow">Sarina</a>, <a href="http://www.p22.com/ihof/posada.html" rel="nofollow">Posada</a>, <a href="http://www.p22.com/products/woodtypeset.html" rel="nofollow">Woodtype</a>, <a href="http://www.p22.com/products/artdeco.html" rel="nofollow">Art Deco Chic</a>, <a href="http://www.p22.com/products/dard.html" rel="nofollow">Arts &amp; Crafts Hunter</a>, <a href="http://www.p22.com/products/dard.html" rel="nofollow">Arts &amp; Crafts Tall</a>, <a href="http://www.typeco.com/glyphic-neue.html" rel="nofollow">Glyphic Neue</a>, <a href="http://www.typeco.com/chunkfeeder.html" rel="nofollow">Chunkfeeder</a>, <a href="http://www.typeco.com/trapper.html" rel="nofollow">Trapper</a>, <a href="http://www.typeco.com/super-duty.html" rel="nofollow">Super Duty</a>, <a href="http://www.typeco.com/cypher.html" rel="nofollow">Cypher</a>, <a href="http://www.typeco.com/gothic-gothic.html" rel="nofollow">Gothic Gothic</a>, <a href="http://www.typeco.com/cusp.html" rel="nofollow">Cusp</a>, <a href="http://www.typeco.com/numismatic.html" rel="nofollow">Numismatic</a>, <a href="http://www.typeco.com/yule.html" rel="nofollow">Yule</a>, and <a href="http://www.typeco.com/zaftig.html" rel="nofollow">Zaftig</a>.</p>
