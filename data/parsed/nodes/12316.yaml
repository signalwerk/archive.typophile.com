    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: James&nbsp;Grieshaber</strong></p>
    <p><strong>James Grieshaber</strong> attended <a href="/node/add/wiki?edit%5Btitle%5D=RIT" title="Create node &quot;RIT&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rochester Institute of Technology</a> and earned a <span class="caps">BFA</span> in <a href="/node/add/wiki?edit%5Btitle%5D=Graphic_Design" title="Create node &quot;Graphic_Design&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Graphic Design</a>. Grieshaber was a staff designer at <a href="/node/12106" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">P22</span> Type Foundry</a> and helped establish <a href="/node/12335" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">International House of Fonts</a>. He has been honored with awards of Excellence in Type Design from <a href="/node/13403" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Association Typographique International (<span class="caps">AT</span>ypI)</a> for <a href="/node/add/wiki?edit%5Btitle%5D=Gothic_Gothic" title="Create node &quot;Gothic_Gothic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gothic Gothic</a> and from <a href="/node/add/wiki?edit%5Btitle%5D=TypeArt%2705" title="Create node &quot;TypeArt'05&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TypeArt’05</a> for his <a href="/node/add/wiki?edit%5Btitle%5D=Operina" title="Create node &quot;Operina&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Operina</a> Cyrillic type designs. He has been involved with the <a href="/node/12153" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Society of Typographic Aficionados</a> and served as Chairman of <a href="http://www.typesociety.org/about/"><span class="caps">SOTA</span></a> from 2008—2010. Designer and Co-editor of the <a href="/node/12108" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Indie Fonts</a> book series, Grieshaber has taught typography at <span class="caps">RIT</span> and now runs <a href="/node/12444" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typeco</a>, his own type design studio, in Chicago, <span class="caps">IL</span>.</p>
    <p>Type designs by James Grieshaber include: <a href="http://www.typeco.com/cezanne-pro.html">Cezanne Pro</a>, <a href="http://www.typeco.com/operina-pro.html">Operina Pro</a>, <a href="http://www.typeco.com/segoe-print--script.html">Segoe Print</a>, <a href="http://www.typeco.com/reenie-beanie.html">Reenie Beanie</a>, <a href="http://www.google.com/webfonts/specimen/Black+Ops+One">Black Ops</a>, <a href="http://www.google.com/webfonts/specimen/Short+Stack">Short Stack</a>, <a href="http://www.google.com/webfonts/specimen/Atomic+Age">Atomic Age</a>, <a href="http://www.google.com/webfonts/specimen/Supermercado+One">Supermercado</a>, <a href="http://www.google.com/webfonts/specimen/Metamorphous">Metamorphous</a>, <a href="http://www.google.com/webfonts/specimen/Sarina">Sarina</a>, <a href="http://www.p22.com/ihof/posada.html">Posada</a>, <a href="http://www.p22.com/products/woodtypeset.html">Woodtype</a>, <a href="http://www.p22.com/products/artdeco.html">Art Deco Chic</a>, <a href="http://www.p22.com/products/dard.html">Arts <span class="amp">&amp;</span> Crafts Hunter</a>, <a href="http://www.p22.com/products/dard.html">Arts <span class="amp">&amp;</span> Crafts Tall</a>, <a href="http://www.typeco.com/glyphic-neue.html">Glyphic Neue</a>, <a href="http://www.typeco.com/chunkfeeder.html">Chunkfeeder</a>, <a href="http://www.typeco.com/trapper.html">Trapper</a>, <a href="http://www.typeco.com/super-duty.html">Super Duty</a>, <a href="http://www.typeco.com/cypher.html">Cypher</a>, <a href="http://www.typeco.com/gothic-gothic.html">Gothic Gothic</a>, <a href="http://www.typeco.com/cusp.html">Cusp</a>, <a href="http://www.typeco.com/numismatic.html">Numismatic</a>, <a href="http://www.typeco.com/yule.html">Yule</a>, and <a href="http://www.typeco.com/zaftig.html">Zaftig</a>.</p>
