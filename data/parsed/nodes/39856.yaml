  html: '<p>A new Farsi Font -1992 !- based on -ancient but still commonly used- Banaai Script (Literary means: arranging bricks and building blocks so that it reads, usually scared names, used as a part of exterior of important building). An early attempt to harmonise Farsi Font with some kinds of Western san-serif type face)</p><div class="imageWrap"><img src="http://typophile.com/files/YekanPrsnt_4170.jpg"></div><p></p>'
