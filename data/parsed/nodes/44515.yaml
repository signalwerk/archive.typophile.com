  html: |-
    <p>is it legitimate to use numbers in font names? e.g.: "Fontname2008"<br>
    I suppose there shouldn't be since Frutiger used his number system with his fonts, but just to make sure is why i am asking here.</p>
    <p>could there be problems with apps that wont accept this?<br>
    thanks for any replies<br>
    Henning</p>
