    html: |-
      <p>There may be some constraints. If I recall correctly, the PostScript naming convention for printer files is the first five characters for the first part of a font name, but the first three for every subsequent part. For instance, the printer font for Fontname Extra Bold Condensed would be FontnExtBolCon.</p>
      <p>If you had two fonts called Fontname2008 and Fontname2007, the printer font files would get the same name Fontn200. That would cause problems.</p>
      <p>I don't believe that OpenType has any of these restrictions.</p>
      <p>I'll leave it to Thomas or Karsten or someone else who understands naming issues much better than me to provide any correction or elaboration.</p>
      <p>-- K.</p>
