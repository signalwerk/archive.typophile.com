    html: |-
      <p>It's perfectly legitimate to use numerals in font names, and you shouldn't experience any problems when doing so.</p>
      <p>PostScript allows font names to contain any printable non-space ASCII character (character codes 33 to 126, inclusive), except for the following 10 characters: "[", "]", "(", ")", "{", "}", "&lt;", "&gt;", "/", "%".</p>
      <p>TrueType is even more permissive than that.</p>
