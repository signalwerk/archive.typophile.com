      <p>This is then a bug in FontLab. There have always been examples of fonts with numbers in the PostScript FontName. The document "Adobe Technical Note #5088 Font Naming Issues" at:<br>
      <a href="http://www.adobe.com/devnet/font/" title="http://www.adobe.com/devnet/font/">http://www.adobe.com/devnet/font/</a><br>
      lists the real PS name restrictions. Note, however, that this 1993 document covers a lot of issues that are not now a problem. The limit of 28 characters for Mac OS 7 is no longer   a constraint, and I would no longer worry about whether the 5-3-3 naming rule for Mac OS 9 Type 1 printer (aka LWFN) files is sure to to generate a unique file name. </p>
      <p>Read</p>
