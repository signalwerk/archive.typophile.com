    <p>I'm just starting a brand/visual identity project for a global organisation, and ideally I'd like to be able to render the wordmark part of the logo in any major world language/character set while keeping the look consistent.</p>
    <p>Particularly tricky are Chinese / Japanese / Korean characters. I'm aware that there are options such as pairing Helvetica World with DF Hei etc, and all-in-one solutions like Nimbus Sans Global. But ideally I’d like to know if there are any more contemporary alternatives  which don’t cost the earth (the client is a charity and they don’t have oodles of money to spend on the visual ID). If the only options are expensive, then maybe pointers on that too.</p>
    <p>Characteristics I’m looking for :</p>
    <p>Modern, Approachable, Not necessarily a Sans (but that’s probably what the client is expecting). They’re using Helvetica at the moment, and they want to move away from that to something a bit more distinctive and friendly (a *bit* more, as I appreciate the options are probably going to be limited.)</p>
    <p>Any other related advice would be very much appreciated.</p>
