      <p>goloub's project sounds fabulous, but I will note that does not cover Chinese and Japanese.</p>
      <p>There are very very few such typefaces in the world today. Mostly, it is a crazy huge amount of work. To ascertain what is available, you would have to define exactly what you consider to be the major world language/character sets. You mention Chinese, Japanese and Korean. I assume that you would include extended Latin and extended Cyrillic. Greek? Arabic? Hebrew? Indic languages (and which ones)?</p>
      <p>You might find this a useful reference to some fonts that might help: <a href="http://en.wikipedia.org/wiki/Unicode_font" title="http://en.wikipedia.org/wiki/Unicode_font">http://en.wikipedia.org/wiki/Unicode_font</a><br>
      ... although I will note that there are no particular criteria for what is included, as far as I can determine. It is an arbitrary set. But pretty much anything that meets your needs is probably in there, as well as a bunch of fonts which are no different from hundreds of others that are not in the list.</p>
