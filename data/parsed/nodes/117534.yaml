      <p>Well, two things:</p>
      <p>1) The question was about a single typeface, and<br>
      2) The question was about any *major* world language</p>
      <p>I did ask what constitutes “major.”&nbsp;I am quite certain that Chinese and Japanese would, as they were among the examples. I am not so convinced that the OP meant to include less widely supported African languages with that phrase.</p>
      <p>I am pretty sure that getting CJK support in one coordinated typeface is a lot less common than support for minority African languages in an extended Latin typeface. </p>
      <p>I also agree with Hrant and the OP that it is tricky to coordinate typographic feel across radically different writing systems.</p>
