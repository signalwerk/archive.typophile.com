      <p>You don't consider the African languages tricky? IMO, support for CJK is far easier to find, especially since not all characters needed for many African languages have single Unicode codepoints assigned -- they require Latin characters plus the combining diacritics.</p>
      <p>I'f anyone knows good examples, I'd be quite pleased to know of them.</p>
