    html: |-
      <p>Yes, many African languages are Latin based. Some are based on Arabic, and I'd imagine the support there is greater, but I do not know for sure. </p>
      <p>Within the so-called (African) Latin-based writing systems, the <strong>alphabets</strong> of these languages are not fully supported by very many fonts. See <a href="http://en.wikipedia.org/wiki/Languages_of_Africa" title="http://en.wikipedia.org/wiki/Languages_of_Africa">http://en.wikipedia.org/wiki/Languages_of_Africa</a> Off the top of my head, only the SIL offerings of Gentium, Doulos, and Charis support Yoruba, Pan Nigerian, Swahili, Boko (writing system for Hausa) etc. </p>
      <p>The sans Andika covers the several alphabets, but currently is available in roman only. If anyone knows of others, I'd be thrilled to know, and I'd think there would be some customers for such fonts.</p>
      <p>Maybe the excuse is there aren't <strong>any</strong> "majority" African languages? </p>
      <p>I think it was Thomas who, some time ago, remarked that when the alphabets are quite different, a variation in font design doesn't seem too distracting. That would be true for Latin versus CJK, but not the Latin versus Latin-based African languages, so maybe the final excuse is that from a commercial point of view, Africa isn't a large enough market to worry about.</p>
      <p>Well, a danger of getting too far off-topic.</p>
