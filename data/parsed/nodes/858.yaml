  html: <p> I got a book the other day and thought it'd be of interest here. It's called The Education of a Design Entrepreneur, edited by Steven Heller. <br> <br>There is great range in the subject choices. Interviews with Gary Baseman, Stefan Sagmeister, Clement Mok and Chip Kidd to name a few. <br> <br>The best part...interviews with Rich Roat, Erik Van Blokland and Rudy Vanderlans. <br> <br>bj </p>
