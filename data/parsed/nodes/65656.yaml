      <p>We're building a feature for Typekit that might help here. In a couple weeks, we'll launch screenshots of every font in our library in every browser that supports @font-face across platforms. Clicking through them gives a really good idea of all the different things that happen to fonts when rendered in browsers in the real world. All the systems we're rendering on have out-of-the-box default settings — we've not yet done things like changing ClearType settings.</p>
      <p>In the screenshot below, you can see we've organized all the browsers by operating system. (The ones grayed out are screenshots we haven't finished rendering yet.) You'll be able to click through them rapidly for comparison. Later, we'll make a bundled zip file of all of a font's screenshots so you can bring them into Photoshop and compare as layers, or whatever. We're curious what other info — like font metrics and file format — might be interesting in this context. Any ideas?</p>
      <p>We're testing the feature now, and would love some experienced eyes on all this. If you have a Typekit account, send me an email (jeff at typekit dot com) and let me know what address you used to sign up, and we'll give you early access.</p>
