      <p>For the most part, browsers are not really the variable, but OS rendering settings are. (Special cases: IE 7 has its own unique ClearType-on override, and Safari for Windows can invoke Mac OS rendering modes, as it has them built into the browser.)</p>
      <p>In order to get the most useful results, you need to further nail down *exactly* what your experimental question is (or questions are). Currently the high-level question is still a bit vague, making it hard to operationalize the experimental question. You want to "understand" the font rendering-in-browsers space, but what's the goal of that understanding? Who might use the results, and how?</p>
      <p>I also submit that it is likely that somebody has already done this sort of research. Probably several distinct entities/groups. It's possible that one of them might be amenable to sharing at least some of their results rather than see a bunch more people spending time on it, if you get to the point of really running tests.</p>
      <p>Regards,</p>
      <p>T</p>
