      <p>Yes John, I forgot about Windows Safari... but the point remains the same: because of those pesky eyeballs I talked about in Mexico, the standard could only become so useless, (breaking the direct chain of good fonts between type designer and reader), and then people started to wonder about the intent of its polluting forces. And try not to compound rendering and scaling into 'a problem', if possible. </p>
      <p>Yes Thomas, we have done a lot of research. Here is some sharing; Minion Pro and Myriad Pro in OpenType CFF render pretty well down to 9 pixels per em, and just fabulously at 12 or more, sometimes. </p>
      <p>No Rich, "having at it" is for those who have not had enough — and I think MS has had enough too. </p>
      <p>Cheers!</p>
