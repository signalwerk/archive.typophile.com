    <p>Hi Typophiles,</p>
    <p>So, fonts on the web.</p>
    <p>As many from this community have seen, when fonts are used in @font-face, they can come out looking quite different on the various browsers and operating systems. As part of the <a class="freelinking external" href="http://typerendering.com" rel="nofollow">Type Rendering project</a> (along with Tim of Nice Web Type, Ethan of Fonthead, and Zoltan), I want to figure this issue out. I want custom type on the web to succeed.</p>
    <p>At this point we’re ready to pin down and illustrate the aspects that contribute to poor rendering quality. But I need this community’s help in one key part: We need to select appropriate typefaces to use as baselines.</p>
    <p>We think we need three typefaces:<br>
    1) A CFF OTF font, designed for the web, with hinting.<br>
    2) A TTF font, designed as TrueType, designed for the web, with hinting.<br>
    3) A more amateur font, maybe something random from Font Squirrel?</p>
    <p>If we can acquire such typefaces, I, and the Type Rendering cadre, will put them through the paces — exploring how they render in all sorts of conditions. All our findings will be public, of course. We want everyone to win.</p>
    <p>I look forward to your suggestions.</p>
    <p>Paul</p>
