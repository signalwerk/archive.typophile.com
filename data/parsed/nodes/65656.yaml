      <p><cite>For the most part, browsers are not really the variable, but OS rendering settings are. (Special cases: IE 7 has its own unique ClearType-on override, and Safari for Windows can invoke Mac OS rendering modes, as it has them built into the browser.)</cite></p>
      <p>Right. Thanks Thomas, your clarifications are always helpful. I think even with these few special cases, there's cause enough to have a standard, public representation of web type rendered in each particular setting.</p>
      <p><cite>In order to get the most useful results, you need to further nail down *exactly* what your experimental question is (or questions are). [...] Who might use the results, and how?</cite></p>
      <p>Well, first of all we want to provide the design, type, and web development community with a single reference for screenshots of web type in its various rendered states. That alone would be an achievement.</p>
      <p>What happens as a result of this reference is anybody's guess.</p>
      <ul>
      <li>Can designers hoping to use @font-face fonts on the web use this reference to judge whether it's aesthetically okay, and legible, to do so? Definitely.</li>
      <li>Will viewers of this reference agree that some particular rendering is "worst," once they're all side by side? Perhaps these folks will organize themselves and complain.</li>
      <li>Will developers of the rendering technology suddenly see their work in a different light? I doubt it, but who knows.</li>
      </ul>
      <p><cite>I also submit that it is likely that somebody has already done this sort of research. Probably several distinct entities/groups. It’s possible that one of them might be amenable to sharing at least some of their results rather than see a bunch more people spending time on it, if you get to the point of really running tests.</cite></p>
      <p>That's a great point. Someone must have.</p>
      <p>Our <a class="freelinking external" href="http://twitter.com/typerendering" rel="nofollow">Type Rendering Twitter account</a> has aroused the interest of some special people already. Where else would you suggest we make our efforts known, to get the attention of these groups you have in mind?</p>
      <p>If someone else has done this research, I have no doubt it can teach us all and save the Type Rendering project time and effort. But I can also understand the competitive advantage in having expert knowledge about web type rendering.</p>
      <p>Maybe our effort will go far enough that more thorough, more expert researchers feel comfortable sharing—perhaps to show how much more there is to what we're discussing, perhaps to correct our mistakes ... but any way this reference develops, I think it will be invaluable.</p>
