      <p>@Simon I hear you, although some typefaces are "optimized for the web" ... and some type is clearly superior on-screen. I think what we're looking for is a typeface made for use on screens.</p>
      <p>@Alex Thanks for the browsershots link. We may use a service like this, but however we snapshot the way type renders we will want to be precise in knowing the "prefs + browser + OS" details of each instance, and be able to rely on the screenshot for accuracy.</p>
      <p>To Paul's point, we're looking for a few typefaces —&nbsp;well made CFF OTF and TTF, and then something produced more casually. What we want to end up with is something along the lines of <a class="freelinking external" href="http://kltf.de/kltf_notes_raster.htm" rel="nofollow">Karsten Luecke's excellent rendering samples</a>.</p>
      <p>Karsten used:</p>
      <ol>
      <li>CFF OTF: Adobe Arno Pro, Adobe Minion Pro</li>
      <li>TTF: Microsoft Corbel, Microsoft Constantia</li>
      </ol>
      <p>We could use these same typefaces ... just wondering about other suggestions.</p>
