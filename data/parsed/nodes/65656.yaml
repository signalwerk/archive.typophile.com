      <p>@dberlow</p>
      <p><em><br>
      Rich &gt; ...it’s going to have more of an impact right now, to make a list of what you shouldn’t do, rather than what you *should* do.<br>
      Impact on what exactly? Creating a web site including text that’s interoperable via @fontface is a list of lists of what one must do.</em></p>
      <p>Can I get a do-over on that comment? Dumb, yes.</p>
      <p>That said - </p>
      <p><em>1) A CFF OTF font, designed for the web, with hinting. We will not know what one of these looks like until IE-next is deployed with DirectWhatever.</em></p>
      <p>Misleading. To name one browser - Firefox 3.5 - there is no problem rendering an OTF CFF font (using standard Windows API's as I understand it, but I am not sure.)<br>
      The font I'm looking at right now is Galaxie Copernicus Medium from Village and it looks excellent from about 16px size on up. (Below that size, there are some issues. I wouldn't use it for body text. <strong>Avoid For Body Text</strong>)<br>
      It also might look just fine and dandy converted to a TTF, but I don't know if the EULA allows it and the last people in the world I want after me are The Village People.</p>
      <p>As far as knowing what an OTF CFF font is going to look like in IE Next, well, I don't think it's a stretch to judge based on the WPF samples that John Hudson and Thomas Phinney are working with/on.<br>
      <a href="http://www.typophile.com/node/64451" title="http://www.typophile.com/node/64451">http://www.typophile.com/node/64451</a></p>
      <p>Also, in IE Now (IE 6, 7, 8) it's certainly possible to see how crappy (or not) an OTF CFF looks simply by bypassing @font-face, installing the font in the OS, and viewing it from there - called from a typical CSS font stack.</p>
      <p>We need to see the good, the bad, and the ugly.</p>
      <p>Have at it, guys.</p>
      <p>rich</p>
