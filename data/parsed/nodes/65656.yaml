      <p>David: <em>There is no effective rendering heavier than Adobe’s, nor lighter than MS’ ClearType</em></p>
      <p>How are you defining heavier and lighter? By stroke width (amount of pixels/subpixels coloured) or by stroke density (darkness of pixels) or a combination of the two? On my system and screen combination, Apple's Quartz rendering is by far the heaviest in terms of stroke width but not in terms of stroke density; ClearType is heaviest in terms of stroke density but lightest in terms of stroke width. Adobe's Acrobat rendering has lighter stroke width than Apple but lighter stroke density than ClearType.</p>
    html_clean: |-
