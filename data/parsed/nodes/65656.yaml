      <p>Sii&gt;but today Web pages are rendered is a bewildering...</p>
      <p>I hear you too. But bewildering, or B.hilldering? :)</p>
      <p>Come out of the bewilderness. There is no effective rendering heavier than Adobe's, nor lighter than MS' ClearType, there are only five main options for hint interpretation, 2 contour formats and only a 19 pixel per em, or so, spectrum of trouble for subtext, text and subheads. And even if the typesetter doesn't stand still, eyeballs are still the target — how much more variation can there be before the be wilderness begins to look intentional? </p>
      <p>Paul&gt;We think we need three typefaces:</p>
      <p>Typeface families, I assume you mean. </p>
      <p>&gt;1) A CFF OTF font, designed for the web, with hinting.</p>
      <p>We will not know what one of these looks like until IE-next is deployed with DirectWhatever.</p>
      <p>2) A TTF font, designed as TrueType, designed for the web, with hinting.</p>
      <p>I'd use Verdana. Then later you can try an autohinted CFF version with IE next.</p>
      <p>3) A more amateur font, maybe something random from Font Squirrel?</p>
      <p>Pick 'em. </p>
      <p>With all due respect, I don't think you need us. </p>
      <p>Rich &gt; ...it’s going to have more of an impact right now, to make a list of what you shouldn’t do, rather than what you *should* do.</p>
      <p>Impact on what exactly? Creating a web site including text that's interoperable via @fontface is a list of lists of what one <em>must</em> do. </p>
      <p>Cheers!</p>
      <p>Cheers!</p>
      <p>and more Cheers!</p>
