      <p>Jeff, this new feature looks sharp! I would love to take a closer look.</p>
      <p>Even if there is no difference in type rendering between, say, Windows 7 + Firefox 3.6 and Windows 7 + Firefox 3.5 (which I believe to be true based on Thomas' thoughts here, but which I have not seen for myself), I still think this Typekit feature is useful. Just to be able to toggle through different operating systems is great! And it's an action you take after you've narrowed your search to a particular typeface ... seems like it will be a very natural, helpful feature.</p>
      <p>If the only differences in rendering within a particular OS are setting-specific, perhaps screenshots from such browsers could be taken with those settings enabled? Not a "worst" case scenario for each browser, but along those lines. Sort of a "most different from OS" case scenario.</p>
