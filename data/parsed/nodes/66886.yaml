      <p><cite>"In this case a ligature would be obsolete, wouldn’t it?"</cite><br>
      ?<br>
      A well-designed «unconnected» ligature glyph (for example, but not limited to, a solution with a shortened «f») can solve the exact same problems as a connected ligature, namely avoiding a crash while not introducing a mile of white space.* And it is technically still a ligature. Very handy to use for German.<br>
      Of course I realize that doesn't work for all fonts. It's also potentially less pretty. But I think the option deserves to be mentioned.</p>
