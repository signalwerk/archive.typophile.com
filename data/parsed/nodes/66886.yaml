      <p>I'm not sure the rule is completely useless. Words/parts in compounds do seem very slightly harder to recognize to me when their boundaries are obfuscated by ligatures reaching across – I wonder, has this actually been researched/tested?</p>
      <p>In any case:</p>
      <p>1) Instead of kerning, why not consider contextual alternates that avoid a crash without having to introduce a lot of white space? It bugs me when setting f + l/i/f without a ligature introduces large gaps; those combinations need to work without a ligature, too.</p>
      <p>2) Remember that [at least in German] the rule only really concerns «connected» ligatures. If you design your ligatures such that the involved characters don't touch (like with a shorter top on the «f»), I believe you can ignore the rule.</p>
    html_clean: |-
