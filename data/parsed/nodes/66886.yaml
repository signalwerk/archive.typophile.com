    <p>In which languages, except from German, are ligatures between word joints (“Auflauf” for example) forbidden?</p>
    <p>I think about adding kerning for letters pairs like fl to a font. But only for German and other languages, in which ligatures between word joints are forbidden.</p>
    <p>(And I need help verifying <strong><a href="http://typophile.com/node/66868" rel="nofollow">a few bugs [?] of Quark XPress</a></strong>.)</p>
