    html: <p>I meanwhile think, that it is needed to break the German ligature rule, if the ligatures are more legible than the single letters, if there is a big whole between them. But I would like to know from professional typographers of German texts, who is plucky enough to do that. Who has already done that? I mean, it is clearly a violation of German orthography rules (although it does not belong to the field of orthography in my opinion) and according to leading specialist in (German) typography, namely Forssmann and Willberg, they strictly avoid it. So these two are not plucky enough to break the rule, when breaking it improves the legibility. Even a word like Schifffahrt can be more legible with an fff-ligature in case of some fonts. I wonder, how much power typographers have in book projects. Who has the last word there, the editor (lecturer) or the typographer? And who is allowed to officially change those rules with regard to their strictness?</p>
