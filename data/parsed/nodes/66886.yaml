      <p>There are typefaces, in which letter combinations fl almost look like a ligature. I would like to know, if there is a way to turn the kerning of those letter pairs of or on with the help of an OT feature, independent from  the language. A kind of anti-ligature-feature and anti-fake-ligature-feature.</p>
      <p>In this context I wonder about the following: Where is the problem to program DTP software in a way, that it recognizes those features, from which the software knows, that they are registered; and the other features are simply listed by their custom name? Example: If Indesign would not recognize the dlig feature as a registered feature, it simply could add an item dlig to the OT menu. The programming language of features is the same in case of all features.</p>
