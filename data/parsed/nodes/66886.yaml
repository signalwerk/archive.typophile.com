      <p><cite>"I would really like to know what other books of that time (before 1900) say about the subject"</cite><br>
      Yes that would be interesting. Although I'd be even more interested in why exactly f_i is treated differently today. In a current context, I still doubt the syllable thing holds water, or at least that it is supposed to. (Your theory about typesetters «doing it wrong» so it became common usage sounds plausible to me.)</p>
