      <p>Altaira, in the book “Vollständiges theoretisch-praktisches Handbuch der Typographie” from 1870, it is explained that Ligatures should not be used between syllables and coupled words. Given as examples are, among others, “wol-len” and “schif-fen”, which should be set without ligature. However, the author states that in these cases ligature are sometimes used (he says this about the double l examples only, but I think the other cases are meant, too). The book is available scanned online, you can read the passage hier: <a class="freelinking external" href="http://www.archive.org/stream/vollstndigesthe00maragoog#page/n51/mode/1up" rel="nofollow">http://www.archive.org/stream/vollstndigesthe00maragoog#page/n51/mode/1up</a></p>
      <p>The ligature usage surely wasn’t uniform at the beginning; and, as you can see, syllables played a role. The now valid usage, following primarily morphemes, and no longer syllables, must have developed over time.</p>
      <p>I think the reason for the fi exception (using a fi ligature when a suffix begins with i) is, that the typesetters didn’t think, like linguists, about morphemes. They thought about “word parts”. Because suffices like “-lich” are spoken as separate syllables, they felt like separate word parts. The suffices beginning with i are spoken connected, and therefore just didn’t feel like separate word parts.</p>
      <p>By the way, if the stem ends with an s, in Fraktur setting a long ſ is used, for example in “roſig”. (With a ligature, of course.) So you can see: the morpheme boundary between the stem and suffices beginning with i really isn’t treated as a “word part boundary”. And I believe the reason is: that it’s spoken connectedly!</p>
      <p>Of course, these are just my beliefs. I would really like to know what other books of that time (before 1900) say about the subject. Maybe someone can help us with some information?</p>
