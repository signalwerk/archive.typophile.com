      <p>Arno, AFAIK the rule only regards morpheme boundaries; hyphenation breaks can differ from those, as you point out, but don't factor in the ligature question.</p>
      <p>See «Detailtypografie» (p. 194): «Ligaturen werden an <strong>Wortfugen von Zusammensetzungen</strong> weggelassen. […] Ligaturen werden <strong>auch über Trennfugen hinweg</strong> gesetzt – wenn die oberen Regeln nicht greifen.»</p>
      <p>Also see «Die Regel» and «Die Ausnahme» here (German):<br>
      <a href="http://www.typografie.info/typowiki/index.php?title=Ligatur#Die_Regel" title="http://www.typografie.info/typowiki/index.php?title=Ligatur#Die_Regel">http://www.typografie.info/typowiki/index.php?title=Ligatur#Die_Regel</a></p>
      <p>Brian, I agree it may seem strange; I think the idea is just to make it clear where the boundaries lie, no matter how «independent» the individual parts are.</p>
      <p>*</p>
      <p><cite>"What would you do with “Sauerstoffflasche”?"</cite><br>
      ff + fl. The words are «Sauerstoff» and «flasche».</p>
