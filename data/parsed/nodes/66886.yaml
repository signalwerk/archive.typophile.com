      <p>In Sanskrit, which has many many conjunct consonants</p>
      <p>see <a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="www.sanskritweb.net/itrans/itmanual2003.pdf">www.sanskritweb.net/itrans/itmanual2003.pdf</a> (page 28 seq.)</p>
