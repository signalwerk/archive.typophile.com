      <cite>Or even in German: the rule for «fi» has been eroded to a degree, and many people would now set words like «typografisch» with a ligature, which if you take the rule very seriously* should originally not be allowed and which I'm sure some purists still don't do.</cite></p>
      <p>I don't agree with you on this. I'm pretty sure suffixes beginning with an i (as in <em>typografisch</em> or <em>häufig</em>) have always been coupled up by a ligature, because they are spoken connectedly with the stem. So the traditional and still valid rule is, in my opinion:</p>
      <p><strong>Ligatures are to be used if the concerned letters are part of one morpheme or spoken connectedly.</strong></p>
