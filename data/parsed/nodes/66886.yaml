      <p>The German rule exists in Norwegian typography, but it's not much practiced anymore. I think it's to some extent still used in Denmark. </p>
      <p>Personally, I think it's a useless rule. Typography comes after semantics. Compound words are written and read as one word in all Germanic languages (except English). Not using a ligature is like introducing some pseudo space between the elements of the word. Besides, it would be great to see a fff-ligature in Schifffahrt.</p>
