      <p><cite>Of course, these are just my beliefs. I would really like to know what other books of that time (before 1900) say about the subject. Maybe someone can help us with some information?</cite></p>
      <p>In the French wiki on ligatures, it is said that <em>ligatures techniques</em> (technical ligatures) are those ligatures that were used to avoid metal characters from breaking due to collisions: the dot on the i could break after an f if the letters were not melt together. Of course they could have had different looking combinations to take care of linguistic rules, but that may help understanding the context.</p>
      <p>Edit: they add "En allemand, l’utilisation des ligatures esthétiques se doit de respecter des contraintes morphologiques i.e "In German, aesthetic ligatures need to satisfy morphological constraints". So there seems to be a difference between aesthetic ligatures and technical ligatures...</p>
