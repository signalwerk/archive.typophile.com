      <p>I think setting (or not) of ligatures is a decision that should be left up to the users. There are so many cases and conventions to consider that even a brave attempt at font-level automation will realistically still need manual intervention anyway. Plus, it's often not a clear-cut matter of right and wrong. I for instance cringe at ligatures in monospaced fonts like Joe's second example above, but I know other designers who think they're just dandy. Or even in German: the rule for «fi» has been eroded to a degree, and many people would now set words like «typografisch» with a ligature, which if you take the rule very seriously* should originally not be allowed and which I'm sure some purists still don't do.<br>
      (* since «-isch» and «-ig» etc. are suffixes just like «-lich» in, say, «höflich», where definitely no ligature should be used.)</p>
