    html: |-
      <p>Here, for Italian I conjured this for you on the fly. :=)<br>
      It includes all the main accented letters commonly used (àèéìòù), plus a few less used (ó, which is very little used, and î, which stands for 'ii' or the archaic 'ij').<br>
      No black magic used, but it turned out quite weird, and funny.</p>
      <p><cite> Se i principî si vedono sùbito, perché la città è ancòra così, come in una bótte? </cite></p>
      <p>(translation: If principles are immediately seen, why the city is still like this, as if inside a barrel?)</p>
      <p>P.S. Of course, I had to express a few accents which are commonly implied, like ó in 'botte'… :=)</p>
