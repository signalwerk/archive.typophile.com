    <p>[Also posted to ATypI member discussion list.]</p>
    <p>We're all familiar, I'm sure, with pangrams: sentences that contain all the letters of a given language alphabet, e.g. 'The quick brown fox jumps over the lazy dog' or 'В чащах юга жил-был цитрус--да, но фальшивый экземпляръ!'</p>
    <p>I would like to build a collection of pan-diacritic-grams, i.e. sentences that contain all the accented or other diacritic letters that occur in a given language alphabet. The sentences would not need to include the complete set of all letters used in that alphabet, just all the diacritic letters. This would be a handy resource when making character test documents for multilingual fonts.</p>
    <p>Some languages have well-defined diacritic sets, while others, like English, use diacritics only exceptionally or in load words. I'm not too concerned about the latter, but for languages that use diacritics regularly it would be great to have sample sentences showing them all.</p>
    <p>Does anyone know of any examples of such sentences, or would anyone care to try to make one for his or her language?</p>
