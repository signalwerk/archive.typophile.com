    html: |-
      <p>The set-up costs are the big up-front expense in printing. There is usually some break point where the savings is negligible if any at all for quantities below a certain amount. For offset printed business cards this is often 1000 units, though it can vary from shop to shop. Less than that and you won't save much, but above that you're just paying for more ink and paper and cutting, and the unit cost drops significantly.</p>
      <p>You might never actually use 1000 business cards before you need to change them, especially coming straight out of school, but it's better to have too many than not enough.</p>
