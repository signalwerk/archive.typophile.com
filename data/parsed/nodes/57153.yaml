    html: |-
      <p>I'd keep the info as general as possible if you're printing a large quantity - just name, email, web site, mobile. You'll move before you're through 100 most likely. I just had 500 printed, don't plan on moving, and wonder if I'll ever get through them.</p>
      <p>Had good luck with vistaprint - it's cheap, fast, the quality is good and if I DO move or change info it's cheap enough to reprint. I got 500 for about $45 including delivery and I went for deluxe stock, printing both sides, etc.</p>
