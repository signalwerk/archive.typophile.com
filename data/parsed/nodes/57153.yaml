    html: |-
      <p>I get lots of business cards from all over the spectrum: from new design grads to seasoned design veterans. Many have been printed on good ink jet printers in these people's workrooms. They print them several-up on letter-size paper, with trim marks. Then they cut them out by hand with a sharp knife while watching TV or something.</p>
      <p>Yes: they look different than cards printed offset. But if they are designed well and printed on a good printer, and cleanly trimmed out they can be quite good looking.</p>
      <p>I have no objection to getting these cards. They can be just as effective. You save lots of money, and you can change info as often as you want. &amp; you waste a lot less paper.</p>
      <p>powers</p>
