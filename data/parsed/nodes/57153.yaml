    html: <p>Consider that if you print 500 or 1000 the price will be the same, then, just make as many as 14.99 can pay. On a 14 pt coated stock with UV aqueous coating, two-sided 4/4. If you are a graduating student or a Five Stars General it doesn't matter. Go on and print the cards as you wish.</p>
