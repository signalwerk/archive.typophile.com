    html: |-
      <p>If you're printing offset (not digital) the printer is making 1000 anyway,<br>
      maybe 2000, and throwing out whatever you don't buy.</p>
      <p>Your card will be set with many other designs- just one copy of yours per page and 1000<br>
      copies printed. It's not worth turning on a press for less, and in fact, the press is so fast, it would be hard to print less- unless you crank it by hand.</p>
