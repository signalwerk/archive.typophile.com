    html: |-
      <p>Hmm... Neuzeit Grotesk is maybe so far the closest guess. There are still more details that don't quite match, like the curved lowercase l in the linotype version. On the other hand, if you look at other interpretations on the same subject, like Bitstream's Geometric 706, you can find a straight l. Maybe there was originally a bunch of alternative characters.</p>
      <p>Has someone seen the original specimen of Neuzeit Grotesk? Or the drawings of Wilhelm Pischner?</p>
