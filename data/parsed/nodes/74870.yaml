      <p>That was all I found on the DVD. It's a compilation of someone's collection, from what I gather (I don't understand much German), and some of it's a bit sketchy. The card in that scan says it's from Stempel, 1930. There are other specimens of Neuzeit Grotesk, but not with that "w". Here's a larger image:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bigger_3688.jpg"></div><p></p>
      <p>My guess would be that the "w" was changed early on to the form that you see in current versions.</p>
