      <p>At that time Foundries (and in that respect not a lot has changed) copied popular styles to keep a hold on their home market — your sample suggest Dutch ones. </p>
      <p>Your best shot for a proper identification is to look at specimens of Amsterdamsche Lettergieterij (my first bet) or Enschedé.</p>
