    <p>Hello! Can anyone help me with recognizing this typeface?<br>
    It's a geometric sans serif, looks lot like a mixture of Erbar, Kabel, Nobel and Futura.  I included the scan of the page as an attachment.<br>
    The book where I found it is printed in 1931 by Lumax printing press in Utrecht, Netherlands.<br>
    The most noticeable feature which makes a difference to other similar geometric sans serifs is the lowercase w which has a strange crossing. Lowercase a looks a lot like Erbar but it's a bit more condensed. Other letters are really round and geometric.</p>
    <p>I have a guess that the typeface might be german but i'm not sure.</p>
    <p>Any knowledge about the foundry or other sources to look at would be much appreciated.</p>
