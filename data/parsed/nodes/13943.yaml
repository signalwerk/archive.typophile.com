  html: <p>Rian Hughes studied at the <a href="/wiki/London%20College%20of%20Printing" class="freelinking" rel="nofollow">LCP</a> in London before working for an advertising agency, i-D magazine, and a series of record sleeve design companies. Under the name <a href="/wiki/Device%20Fonts" class="freelinking" rel="nofollow">Device</a> he now provides design and illustration for advertising campaigns, record sleeves, book jackets, graphic novels and television. Since setting up his studio, he has worked extensively for the British and American comic industries as designer, typographer, and illustrator.</p>
  html_clean: <p>Rian Hughes studied at the <a href="/wiki/London%20College%20of%20Printing" class="freelinking link-lost" rel="nofollow">LCP</a> in London before working for an advertising agency, i-D magazine, and a series of record sleeve design companies. Under the name <a href="/wiki/Device%20Fonts" class="freelinking link-lost" rel="nofollow">Device</a> he now provides design and illustration for advertising campaigns, record sleeves, book jackets, graphic novels and television. Since setting up his studio, he has worked extensively for the British and American comic industries as designer, typographer, and illustrator.</p>
