    html: <p>i think this logo is pretty funny. i always have trouble liking logos where a picture is incorporated into the letters, because you have to try to see a picture and a letter, and you can't see them at the same time. <br> <br>the first E has a weird ending, and could be better... i would suggest having the line drawing separate from the type.  also, why isn't the other E attached? <br> <br>are the words "Plastic Surgery" going to be incorporated?</p>
