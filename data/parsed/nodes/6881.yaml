    html: "<p>I would suggest ditching graphic representations <br>and focus solely on a wordmark for Elite. <br>Does the client want upscale and classy?  <br>A custom script or a delicate serif might <br>do the job. <br> <br>Scriptwise, there are wonderful opportunities with the: <br>* Capital E <br>* the i-t combo (dot on the 'i', crossbar on the 't' <br>) <br>* and the lowercase finishing 'e' <br> <br>You might find success sketching softly  <br>with a light pencil and trying as many <br>variations as you can. <br> <br>just suggestions.  <br> <br>Also, the 'lite' that you have <br>could be revised into something pretty nice. <br> <br>bj</p>"
    html_clean: "<p>I would suggest ditching graphic representations <br>and focus solely on a wordmark for Elite. <br>Does the client want upscale and classy?  <br>A custom script or a delicate serif might <br>do the job. <br> <br>Scriptwise, there are wonderful opportunities with the: <br>* Capital E <br>* the i-t combo (dot on the 'i', crossbar on the 't' <br>) <br>* and the lowercase finishing 'e' <br> <br>You might find success sketching softly  <br>with a light pencil and trying as many <br>variations as you can. <br> <br>just suggestions.  <br> <br>Also, the 'lite' that you have <br>could be revised into something pretty nice. <br> <br>bj</p>"
