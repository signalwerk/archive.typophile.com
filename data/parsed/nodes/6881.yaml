    html: <p>looks a little op art to me.  like something you'd see in the New Yorker a decade ago. <br> <br>However, the idea of the letters 'drawing' the face is a good idea.  I just think here your E is getting wonky, try looking at the E without the face, as just a letter. <br> <br>perhaps the face is more idiographic/abstract.  the face profile could be circular and tie in better with the E.  your letters could be a geometric sans serif.  something contemporary and sleek.  I think this would be more fitting for a plastic surgery clinic named Elite. <br> <br>also, for another concept the E could be an eye.</p>
