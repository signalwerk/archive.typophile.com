    date: 2004-09-28T13:06:00
    date_raw: 28 Sep 2004 — 1:06pm
    votes: null
    html: <p>The face seems as if it is being forced into the shape of the "e". At first glance, I just kept staring at the face wondering what was going on there instead of reading "elite". That might bring up some issues because if the name gets lost when people look at this, it will defeat the purpose of conveying the brand. <br> <br>The face looks like a football player from the 1920s, where a facemask wasn't a part of the helmet. Also, I thought of Amelia Eahart with the old pilot style cap which is confusing. <br> <br>I see what you're trying to do here by making the swash of the "l" cross the eye of the graphic. But it almost looks painful, almost poking into the eye which is probably not what the surgeon wants to convey.  <br> <br>Also, the face seems as if it is worried or concerned, as opposed to being happy and excited about surgery which might convey the wrong message.  <br> <br>Try to do some more research into the plastic surgery market in general, and ask the client some more specific questions to come up with more solutions.</p>
