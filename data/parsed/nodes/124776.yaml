  html: <p>I got this image from the printer of a page using my typeface SeriuosSans. At the press some characters magically disappeared, while they were correctly displayed in the pdf and in the proofing print. I suppose it has to do with my font, but does anyone have any idea what could have caused this?<img src="/sites/default/files/old-images/IMG_1778_4273.JPG"></p>
