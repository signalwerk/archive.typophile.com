    html: "<p>The font is OTF (postscript flavoured), the printing press is offset, the proofs were made digital. This is an insert I made in a magazine production of someone else; I do not know the printer's specifics, but proof and execution were seperate. My big question remains: if it is in the font, what did I do differently/ wrong from the fonts I produced earlier which never gave any trouble of this kind? Riddle me that…</p>"
