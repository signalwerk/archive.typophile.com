    html: |-
      <p>I kind of doubt that there is anything wrong with your font. </p>
      <p>You say they are printing offset, so:<br>
      1. They are using film to make the plates, or<br>
      2. They are going direct-to-plate.</p>
      <p>So I believe the problem might lie in the imagesetter or printer software since your proofing process came out correct. It may be that they are using a Postscript emulator rather than true Postscript, which can certainly cause problems.</p>
