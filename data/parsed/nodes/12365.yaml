    <p>I have a family of 4 fonts I am close to putting onto Myfonts.com. I have been testing the kerning &amp; design in Illustrator &amp; Word on screen. I plan to print out some samples as well. Because my font is modular &amp; only has a few kern pairs (250 maybe) in it, &amp; the kerns have to be in whole tile units ( <a href="http://typophile.com/node/9915">pool tiles</a> ) it has been straight foreward to check these things on screen. I am not sure what too look for or be worried about in print however. I imagine a thorough testing would involve an inkjet &amp; a laserprinter &amp; maybe reversing the type but I am just guessing/imagining. </p>
    <p>Which brings me to my question - What seems like a basic/minimal set of tests (on screen &amp; off) to you? I won’t have the luxury of trying the font on newsprint on a web press, but short of that, what do do when you have a display face? What do you do for a bodytext face?</p>
