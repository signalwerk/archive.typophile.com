      <p>I am working on my first typeface now, so keep that in mind I am no expert. It is a text face that could be used for display as well, and I have been seeting alot of paragraphs with Indesign filler text, using text generated from Adhesiontext, and also just random paragraphs from essays and stuff I have wrote. Then I have also done waterfalls of display sizes Like “Hamburgefonstiv” and I have been looking for a few things. a) counters filling in slightly or dark areas in the text b) bad kern pairs that are either two far away or two close. I usually just circle them and make notes on the side and then review them and look for common problems and go back and fix them. I have printed on a 2400x2800 dpi inkjet, a 600 dpi, laser, and a 2400 dpi laser.</p>
      <p>Not sure if this helps?</p>
