    html: <p>For TT and OT, I would consider Microsoft’s <a href="http://www.microsoft.com/typography/FontValidator.mspx">FontValidator</a> to be essential to any testing procedure. If you are doing any manual hinting, you should run FV before hinting to catch outline problems, and then again after hinting. The FV help is generally pretty good at explaining the error codes, but not necessarily at helping you figure out how to fix them. I’m going down to Redmond next month, and one of the things I intend to discuss with the MST folk is the idea of a collaborative online annotated help resource for FV, so that developers can share information about methods to fix font errors. In the meantime, you could ask here, or consider subscribing to the <a href="http://www.microsoft.com/typography/otspec/otlist.htm">OT developer list</a>, if you are not already on it.</p>
