    html: |-
      <p>For OpenType CFF, and maybe PC TrueType, I’d suggest running the “CompareFamily” tool from the Adobe OpenType FDK.</p>
      <p>You’re right that Adobe does do quite extensive font testing. We have people whose sole job is to test fonts, and since getting into OpenType we also make use of ourside beta testers, just like any other piece of software. Personally, I can no longer imagine shipping a font without outside testing, any more than I can imagine shipping InDesign without outside testing. But then again, I have funny ideas about treating fonts like other software in a bunch of ways.</p>
      <p>Anyway, you could also be looking at:</p>
      <p>- set up a Word doc on Windows and move it to the Mac OS. Can it find the fonts? Do the same going in either direction with at least one application that keys of PostScript FontName (e.g. Illustrator) and at least one application that does other weird stuff (e.g. InDesign).</p>
      <p>- Make sure that the font behaves as you wish with regards to font embedding.</p>
      <p>- Output on at least one Adobe PostScript device, one HP clonescript device, and one GDI/Quickdraw device. Both Mac and Windows. Do this from both an app that uses normal system drivers to print (e.g. Word) and from an app that handles output more directly (e.g. InDesign, QuarkXPress, Illustrator).</p>
      <p>Regards,</p>
      <p>T</p>
