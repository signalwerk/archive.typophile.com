      <p>John, My fonts will be in  Mac Type 1, Open Type CFF, PC type 1, &amp; PC true type. I am using fontlab &amp; using automatic type 1 hinting &amp; then for the true type I am using Fontlab’s type 1 to true type hinting tool &amp; getting rid of anything fontlab thinks is a stinky hint. Hinting a truetype display face may be overkill but I am doing it anyway. Actually - what do you think about that? The fonts I have are definitely in the display category. I am interested in non-dispaly related advice too though.</p>
      <p>Now that I have started to test them I realized that the grunt work of making sure you are not putting out stinky data is something I have not been spending enough time thinking about. Moreover there is no doubt a great deal of hard won wisdom out there! Some of it might be in house trade secrets - but not all of it. </p>
      <p>Also, no doubt Adobe checks many many OS’s &amp; kinds of printers. What do you think a small foundry’s level, a kind of baseline level of checking should be?</p>
