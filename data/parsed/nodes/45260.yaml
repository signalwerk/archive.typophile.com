      <p>Did you know these numbers were calculated by computers? That is, a person with the occupation of "computer". More likely -- a roomfull of persons...<br>
      Math skills were not necessary, at its basic level it was all done by simple additions and subtractions. Back at the end of the 19th century, they calculated π to a hundred digits (they made an error halfway through, tho').</p>
