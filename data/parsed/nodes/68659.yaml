  html: |-
    <p>Is there a 'correct' way to include spaces before and after items in a list (such as bullets)?</p>
    <p>I am working on a document that has a space of 12pt after each paragraph. I like the visual break this provides. Should I have a 12pt space after each item in the list? Sometimes this looks too much.</p>
    <p>I'm working to a 12pt baseline grid so it seems that the space should either be 12pt to match my grid, or nothing.</p>
    <p>Any tips/design examples?</p>
    <p>Thanks in advance!</p>
