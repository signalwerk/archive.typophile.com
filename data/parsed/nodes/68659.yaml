    html: |-
      <p>Thanks for this, have given this a go and things are looking good.</p>
      <p>I'm wondering though if it matters that using 6pt after my bullets means that I can't snap them to my 12pt baseline grid. There seem to be a few flowon effects I'm not happy with.</p>
      <p>Basically, all of my headings and paragraphs (except my newly spaced bullets) are snapped to the baseline grid.</p>
      <p>Using 6pt spacing means the bullets vary from the baseline grid. This looks OK to me, but it creates an inconsistency in the amount of space before headings and paragraphs directly below my bullet points, which are snapped to the baseline.</p>
      <p>Is this an issue? Is there another approach I could take with my paragraph spacing? I don’t really want to lose the nice structure my baseline grid provides.</p>
