    <p>It has been all over the place some time now, overused and abused to such a degree that I'm beginning to wonder if designers throw it in there just to boost sale. </p>
    <p>I just spotted <a href="http://www.typetrust.com/font/leituradisplay" rel="nofollow">this</a> (the "sp"), and it doesn't make any sence to me. Especially since the l and i in "uplift" so obivously crash on the third line.</p>
    <p>Argh!</p>
