  html: "<p>Typophile Announces: The Smaller Picture by Kevan Davis <br> <br><i>The network is the brain.</i> <br> <br>Smaller Picture is a truly collaborative experiment where users participate in the real-time growth of a bitmap alphabet. The system, developed by UK programmer Kevan Davis with inputs from Typophile's Jared Benson, presents a 20 x 20 pixel grid which begins as a random pattern of black and white pixels. Users determine whether a randomly highlighted pixel should be black or white. After thousands of interactions, the characters take shape. <br> <br>When Typophile proposed using Kevan's engine for a collaborative alphabet, he was intrigued, and enhanced his code to accommodate a full alphanumeric set. We're delighted to present it here. <br> <br><a href=\"http://www.typophile.com/smallerpicture\" target=\"_top\">http://www.typophile.com/smallerpicture</a></p>"
  html_clean: "<p>Typophile Announces: The Smaller Picture by Kevan Davis <br> <br><i>The network is the brain.</i> <br> <br>Smaller Picture is a truly collaborative experiment where users participate in the real-time growth of a bitmap alphabet. The system, developed by UK programmer Kevan Davis with inputs from Typophile's Jared Benson, presents a 20 x 20 pixel grid which begins as a random pattern of black and white pixels. Users determine whether a randomly highlighted pixel should be black or white. After thousands of interactions, the characters take shape. <br> <br>When Typophile proposed using Kevan's engine for a collaborative alphabet, he was intrigued, and enhanced his code to accommodate a full alphanumeric set. We're delighted to present it here. <br> <br><a href=\"http://www.typophile.com/smallerpicture\" target=\"_top\" class=\"link-lost\">http://www.typophile.com/smallerpicture</a></p>"
