    html: |-
      <p>There are 2 different logos here and bottom one is very <a class="freelinking external" href="http://www.myfonts.com/search/times" rel="nofollow">Times New Roman</a> (or <a class="freelinking external" href="http://www.myfonts.com/search/times+ten" rel="nofollow">Times Ten</a>).<br>
      Current logo (and official I guess) is first sample. For this one, I don't have a match and I doubt there's one as almost all woodmarks from the fashion industry are custom lettering. I can only suggest 2 very (very...) loosely similar, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/kumlien-pro" rel="nofollow">Kumlien</a> and <a class="freelinking external" href="http://www.myfonts.com/search/berling" rel="nofollow">Berling</a> and upload a better sample.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/bv_5252.jpeg"></div><p></p>
