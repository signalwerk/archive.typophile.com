      <p>There are 2 different logos here and bottom one is very <a href="http://www.myfonts.com/search/times" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Times New Roman</a> (or <a href="http://www.myfonts.com/search/times+ten" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Times Ten</a>).<br>
      Current logo (and official I guess) is first sample. For this one, I don't have a match and I doubt there's one as almost all woodmarks from the fashion industry are custom lettering. I can only suggest 2 very (very...) loosely similar, <a href="http://www.myfonts.com/fonts/canadatype/kumlien-pro" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Kumlien</a> and <a href="http://www.myfonts.com/search/berling" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Berling</a> and upload a better sample.<br><img src="/sites/default/files/old-images/bv_5252.jpeg"></p>
