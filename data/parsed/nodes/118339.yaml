      <p>I can suspect what the problem is (it happened before).<br>
      The image attachment is named "image_171.jpg".<br>
      There is something strange in Typophile server with "image_XXX.jpg" attachments (probably the server re-uses the filename) and it can appear as one image to one user and a different image to another (probably an older one, from another thread, or just taken from the user browser's cache).</p>
      <p>To cut a long story short, Kevin we both viewed the same (wrong) image but the actual image uploaded by Mary Lynn is different.</p>
      <p>Mary Lynn could you please upload your image again, but first change the local image filename in your PC to something totally different, e.g. "lynn-01.jpg" ?</p>
      <p>PS: This is the (wrong) image both Kevin and I viewed:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Lyn-wrong-image_5488.jpg"></div><p></p>
