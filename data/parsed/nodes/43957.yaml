  html: |-
    <p>Jörg Petri has made a typographic music video, called<br>
    <a href="https://web.archive.org/web/20081012182303/http://jpetri.macbay.de/dot/index.html">‘DOT · The book as a video’</a>.<br>
    </p><div class="imageWrap"><img src="/web/20081012182303im_/http://www.typophile.com/files/dot_4386.jpg"></div><p></p>
    <p><cite>‘DOT: The video as a book’ is a letterpress printed artist book, containing about 300 pages that were also used for a music video for Michael Fakesch’s song ‘dot’, released on his album ‘do’. Three copies of the book were created, containing the original prints used to produce the video. These books comprise every single frame as a lead type printed paper copy: every picture shown in the video has its materialized analogue twin.</cite></p>
