    <p>I've been a designer for quite a while and though I think that I'm pretty good at designing with type... and consider it vitally important to what we do as designers, I regretfully haven't developed the ability to really identify too many different typefaces. I have to admit that it's a bit of a weak point in my skill set. Anyway, here are a couple ones that maybe you type-identifying virtuosos can readily detect...</p>
