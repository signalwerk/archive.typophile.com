    html: |-
      <p>Thanks... Blair is pretty close... close enough. Actually, for what I'm doing I think that the Helvetica Neue LT Std that I was messing with would have been a close enough match, but the Blair is much more elegant (I really like that typeface) and I was able to find a free version of it (with a bit of looking).</p>
      <p>As for me JPGs. I double checked and they are indeed RGBs. I can't think of why one would display and the other not as they both were generated with the same "Save for Web and Devices" function in Photoshop with the exact same settings. Not that I doubt that they weren't working on someone's browser, but I'm curious as to what the reason might be.</p>
