      <p>I think a custom cut typeface is not all that expensive as compared to other things that are made for the individual. A custom built guitar isn't cheap. It's all a matter of priority. If a person is passionate about anything a higher price is not a hinderance. </p>
      <p>Quite honestly I have never been asked to design and/or cut a metal font, possibly because it's assumed that the price is outrageous. Most things I produce in the metal foundry bring me about five dollars an hour. That stinks even in Canada, but I do it becuse it feels good, and I've been barred from the saloon and the pool hall. </p>
      <p>Jim</p>
