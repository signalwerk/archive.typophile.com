    html: <p>When you are talking about a Garamond it seems like you have a fairly good idea about how it is likely to be used. In the case of Underground that seems less clear. And I think the use it is going to be put to may have a bearing on the choice. In many ways the best person to ask about differences is Paul Hunt because he was the man behind the P22 release. The P22 release Underground Pro is much more complex and covers more scripts than the ITC does.</p>
