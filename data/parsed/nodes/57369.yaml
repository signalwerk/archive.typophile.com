    <p>i was wondering if anyone could advise me on the differences (if any) between the P22 and ITC johnston Underground fonts...?<br>
    are there any differences in the letter forms, and if so which do people prefer?</p>
    <p>once before i caused abit of a rumpus when i asked which is the better Garamond , ITC or Adobe (adobe won hands down), so its always helpful and insightful to hear what more experienced people than myself think...</p>
    <p>thanks</p>
