      <p>Paul can confirm this, but I believe the goals of the two revivals were different. ITC Johnston is an updating of the original design. It it "regularizes" the original, removing some of its quirkiness and clunkiness. For example, it tapers the joins more, in line with current thinking about letter design. But I see the redesign also changes a number of letters and in the process loses some of the distinctive charm of the original. </p>
      <p>I believe P22's Johnston Underground is more of an authentic revival, with all of the quirkiness and charm, and also a much expanded character set. </p>
      <p>As Eben said, it depends on what you want it for. I think ITC Johnston was intended to for usage in signs where people were used to the original, but modernized a bit. I'm not sure I agree with the concept, but if that's what you want ITC Johnston is for you.   </p>
      <p>Personally, I loved the original signs in the Tube when I was a student in London back in the '60s, so I'd go for Paul's version.</p>
