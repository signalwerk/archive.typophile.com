      <p>I'm a bit confused about the large x-height criterion. Something like <a href="http://www.typotheque.com/fonts/fedra_sans" rel="nofollow">Fedra Sans</a> has a larger x-height, it seems on first glance, than Avant Garde Gothic or Kabel. But lots of contemporary sans serif designs have comparable x-heights, and even old standbys like Helvetica don't differ that much on x-height. Cuttlefish's Californian Grotesque, I'm sorry to say, has a tiny x-height relative to all the designs mentioned.</p>
      <p>So does Fedra Sans fit the bill? Or should we look for even larger x-heights?</p>
