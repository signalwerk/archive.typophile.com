  html: <p>Buenos Dias, fellow type enthusiast. I was wondering if anyone can help me in my search for a small printing press (like the one's used in letterpress printing). Doesn't if it's new or used or how old. I don'y need any movable type (I can make my own). Any help would be appreciated. <br>Gracias <br>IM</p>
