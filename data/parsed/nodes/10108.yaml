    html: <p>For titles - dramas and serious programming tends to use serif, comedy and reality TV tends to use sans. Legibility doesn't seem to be a major consideration - it's about branding. <br> <br>Your paper might be better if you focus on captioning, subtitles and other forms of small text on TV rather than titles. screenfont.ca is a good starting point if you're after some juicy quotes.  <br> <br>Cheers, Si</p>
