  html: "<p>Hi, <br> <br>I need to write a paper about serif vs. sans serif -  for tv: <br> <br>Is it easier to read a title when it's set in a serif or sans serif? why? what size? any good serif for tv? any good sans serif for tv? <br> <br> <br>Thank you for your help!</p>"
