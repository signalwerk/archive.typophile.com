    html: <p>&gt;Simon, what do you mean by small text? 8,10,14.....   <br> <br>Sorry, I don't know how size is specified in TV graphics and captioning, maybe by scan lines, maybe as a proportion of the screen height? <br> <br>The point I was making is that 'Titles' (the subject of your original mail) are not as interesting as subtitles and captions, or as interesting as the special fonts used in set-top boxes and digital TV. <br> <br>&gt;= "...the typeface has a host of design flaws...Tiresieas has not been tested with representative audience" (screenfont.ca)  <br> <br>Joe Clark's views may be at one extreme but I think a lot of font people and designers share them. You could write a whole paper on the subject of that one font. The process by which it was created and how it became a TV standard are quite well documented. And the people involved are probably quite approachable.   <br> <br>Cheers, Si</p>
