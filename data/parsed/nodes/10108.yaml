    html: <p>Isn't it mainly a resolution issue? Unless the type is large, any typeface with fine details will get lost in both the low-res of traditional TV and the inerit blurring that is added. <br> <br>That said, the parents just got a new HD-wide screen TV that I spent most of my saturday afternoon wasting away in front of and I must say that type looks absolutely stunning on it.</p>
