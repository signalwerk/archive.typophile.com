    html: "<p>Since reading on TV is non-immersive (at least if we're talking about short captions here) and the lo-res and interlacing cause of a lot of fuzz, well-spaced sans forms (with a generous x-height) work best I think. One of my most favorite fonts for this kind of work is Poppl-Laudatio (which also has a lot of character at large sizes). <br> <br>BTW, check out Tiresias too: <br><a href=\"http://www.myfonts.com/fonts/bitstream/tiresias/\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/tiresias/</a> <br> <br>hhp</p>"
