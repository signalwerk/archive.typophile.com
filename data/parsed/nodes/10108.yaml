    html: <p>BBC TV use Gill Sans for most of their captions, programme lists, interactive menus which works very well at most sizes (they also use Helvetica Thin for some full screen work). On Digital (a now defunct UK digital tv provider) used Tiresias for their interactive services and it was very efficient (ie my Mum could read it). I think if you take the worst case � low definition TV receiving analogue signals � many serif faces are losing so much quality that unless it is taking a large proportion of the screen it is better to use sans. <br>Tim</p>
