    html: <p>Think about TV today its about exploding graphics, fast cuts, and head shots. It has nothing to do about type. Its about cheesy photoshop techniques. Most type I see on TV is terrible (MacNeil Learer report type is so terrible to make me cry) there is no craft in TV type.</p>
