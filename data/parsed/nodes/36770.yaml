      <p>Hi Patricia. What kind of wine is it? Is it for wealthy retirees or young hipsters? Where does it come from? What sort of image does the company want to convey? </p>
      <p>These are all questions that you should ask when designing the label. We can help you find something that won't clash with Copperplate, but the field is far too broad. These more important questions come first.</p>
