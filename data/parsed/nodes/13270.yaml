      <p>I rarely venture into critique of type <strong>usage</strong>, but...</p>
      <p>1) That lc "a" is not "standard", it's Barbarella. Try something like Kievit* instead.<br>
      2) For the "airways" I think all-caps is good, but something smaller, wider, looser and darker.<br>
      3) For a logo, what about a pennant shape? Since "standard" also means flag, and the pennant is associated with wind.<br>
      4) Yeah, totally nail down the name first! :-/  Not to mention the target clientele, etc.</p>
      <p>* <a href="http://www.myfonts.com/fonts/fontfont/kievit/" title="http://www.myfonts.com/fonts/fontfont/kievit/">http://www.myfonts.com/fonts/fontfont/kievit/</a></p>
      <p>Oh, and don't forget the free peanuts if you use any of our ideas.</p>
      <p>hhp</p>
