      <p><em>I dont want to sound too harsh, but.:</em> So what you basically did yet is set two words, using pretty 'standard', common typefaces <em>( Like Helvetica, News or Trade Gothic )</em>.? I am not too sure about that being very unique, or memorable, what about you.? This could be for everything.. You could have tried to slightly customize / modify these typefaces.. But, I think you may want to return to sketching and scribbling various ideas on paper ( again ), instead of starting out with setting type on screen..</p>
      <p>What may help you as well is seeing what other airlines did, and what their logos look like.:<br>
      <em>&gt; <a href="http://www.aerosite.net/logos.htm" target="_blank" rel="nofollow">www.aerosite.net/logos.htm</a> ( Airline Logos )</em><br>
      <em>&gt; <a href="http://www.af.mil/library/symbol/" target="_blank" rel="nofollow">www.af.mil/library/symbol/</a> :)</em></p>
      <p><em>( Is this for a school / university project, Or do you actually have the opportunity to find a new name and create a new brand for an airline.? )</em></p>
