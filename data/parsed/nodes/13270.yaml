    html: |-
      <p>Branding an airline is one of the most difficult tasks for a designer. Mostly it's a team of designers who work on the first ideas for weeks. Designing every single unit, from badges to counters, from wingtips to guidebooks, that's a very intense job which takes months, even years.<br>
      There are examples of very basic low-budget airliners (Easy Jet, Ryanair...), but still they are very clever designs, using very common type like Cooper or Helvetica Extended, and it works. You don't want a low-budget liner looking too fancy.</p>
      <p>Anyway, good luck with it...</p>
