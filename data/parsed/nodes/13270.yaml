    html: <p>First thing I agree with Kyle this looks like a school project. If you intend to use the logo as signage think of a stop sign. It is knocked out type from a bright solid color. There is a reason for this, its because its visible from a far distance. The same think but opposite for a yeild sign (black type against a bright yellow background). In both cases the type has to be bold to be seen at a distance. Airline, distance get it, the thin type doesn't work.</p>
