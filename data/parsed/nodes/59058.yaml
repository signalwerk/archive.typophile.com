    votes: null
    html: <p>I hope they have another mock funeral like they did with OS 9. The coffin could be filled with .dfonts. It’s not that they were that terrible, but they did inconvenience customers by causing a lot of confusion. My understanding was that at some point Apple needed a data-fork only version of TrueType and it was easier to shoehorn the resource fork in and make a .dfont than to support the Windows-style .ttf format. They were a true evolutionary dead-end, because they offered nothing but incompatibility.</p>
