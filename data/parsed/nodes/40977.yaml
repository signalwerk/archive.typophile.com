      <p>Lukas,</p>
      <p>Yeah welcome, nice you found your way to Stockholm. I could give some advise but won’t do it all here. Please get my contact info on my web site and give me a call when you have time. Please also contact a wonderful second hand book shop south of Stockholm. It’s called “Antikvariat Morris” and the owner Glenn is a very nice fellow. Over the years he have specialised in Typography books, specimens etc. <a href="http://www.svaf.se/morris/index_eng.htm" title="http://www.svaf.se/morris/index_eng.htm">http://www.svaf.se/morris/index_eng.htm</a></p>
      <p>Cheers</p>
