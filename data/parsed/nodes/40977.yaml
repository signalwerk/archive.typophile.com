    <p>I accidentally posted in the wrong forum last time, but will try again here.  Sorry in advance to anyone who sees this post in the critique section.</p>
    <p>How’s it going everybody? I am Graphic Design student studying abroad in Stockholm. I am currently trying to research Swedish typography, but have run into a bit of a road block. I am curious if there is anyone out there who can give me names of great Swedish typographers? I am very interested in the old-style ornamental typography, but would love to hear of any great typographers or typesetters.</p>
    <p>Does anyone know of any books that document Swedish typography? I read in a past post (was from 2005) that there was a beautiful illustrated book of Swedish typography. Does anyone know the name of this book, or any other books that I might be able to take a look at. For my purposes I am more interested in looking at previous examples rather than a how to book, but would appreciate any response.</p>
    <p>Thanks much, and I hope to hear back from you guys soon.</p>
