      <p>I have definitely tried the google search.  I found a few links, but no matter how far I looked, I couldn’t find any  good books or quality images.  I have a few names, but was curious if anyone knew the masters of Swedish Typography.  </p>
      <p>Anders Bodebeck, Bo Berndal, Franko Luin, Lutz Baar, Lars Berquist, Karl-Erik Forsberg, Waldemar Zachrisson.  </p>
      <p>I have found all these names, but can only seem to find typefaces for sale by them.   While it is great to see some of the fonts they have designed, I would really like to see some of their work.</p>
      <p>Ideally I would like to find a book documenting the history of Swedish typography, but haven’t found one.  I also get lost once the websites switch to Swedish.  I have only been here in Stockholm for a few weeks, so I don’t speak the language yet.</p>
