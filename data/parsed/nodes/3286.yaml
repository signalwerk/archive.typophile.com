    html: "<p>I've taken on board the comments I've had from here and elsewhere, and made a few more changes. <br> <br>I've increased the size contrast between the main logotype and the tagline to help the tag fit underneath more comfortably -- I wasn't happy with tracking out the main logotype so I've tightened it up. <br> <br>I've increased the weight of the arc a little, and tried to position it slightly better wrt to 'dia'. <br> <br>I'm also experimenting with some different colours. <br> <br>Thank you kindly for your attention, opinions welcomed: <br> <br><a href=\"http://www.jordanharper.uklinux.net/diameter_logos_colours.gif\" target=\"_blank\">http://www.jordanharper.uklinux.net/diameter_logos_colours.gif</a> <br> <br>Jordan</p>"
