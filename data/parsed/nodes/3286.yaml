  html: <p>Hi all,  <br> <br>The company is a new technology transfer business -- they take newly developed materials and technologies and try to fashion useful products out of them. Their clients will mostly be people buying or selling these materials/products, so sciency material engineering type companies and people who buy weird and wonderful, high-tech things -- from aeronautical to IT manufacturers.  <br> <br>They are a British company, and want something that makes them look serious and modern, as well as something that will work equally well in the US, Europe and Asia.  <br> <br>To make things a bit more complicated, the name is pronounced dia-meter rather than just diameter, and I've been told not to punctuate the word in the logo to make this distinction clear. <br> <br>I'd love to hear any opinions on the logos I've come up with, including the colours and tag-line -- it's difficult to think of something snappy involving material applications! <br> <br>Thanks in advance everyone, it's most appreciated. <br> <br><a href="http://www.jordanharper.uklinux.net/diameter_logos.gif" target="_blank">http://www.jordanharper.uklinux.net/diameter_logos.gif</a> <br> <br>Jordan <br> <br>PS I know that the arc on 1a and 1b could do with shifting a little to be optically central wrt to 'dia'.</p>
  html_clean: <p>Hi all,  <br> <br>The company is a new technology transfer business -- they take newly developed materials and technologies and try to fashion useful products out of them. Their clients will mostly be people buying or selling these materials/products, so sciency material engineering type companies and people who buy weird and wonderful, high-tech things -- from aeronautical to IT manufacturers.  <br> <br>They are a British company, and want something that makes them look serious and modern, as well as something that will work equally well in the US, Europe and Asia.  <br> <br>To make things a bit more complicated, the name is pronounced dia-meter rather than just diameter, and I've been told not to punctuate the word in the logo to make this distinction clear. <br> <br>I'd love to hear any opinions on the logos I've come up with, including the colours and tag-line -- it's difficult to think of something snappy involving material applications! <br> <br>Thanks in advance everyone, it's most appreciated. <br> <br><a href="http://www.jordanharper.uklinux.net/diameter_logos.gif" target="_blank">http://www.jordanharper.uklinux.net/diameter_logos.gif</a> <br> <br>Jordan <br> <br>PS I know that the arc on 1a and 1b could do with shifting a little to be optically central wrt to 'dia'.</p>
