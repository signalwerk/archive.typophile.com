    html: "<p>Refer back to my post #196. <br> <br>If your client is going for \"serious\" and \"corporate\", the solution is to simply use almost any color, but dark. For example, your blue looks like PMS 641C (on my screen anyway), but to make it corporate you should use something more in the neighborhood of PMS 648C, and maybe replace the gray with PMS 647C. I'm not suggesting that these are the colors to use, but I promise if you show your client these darker ranges, he'll be a much easier sell. <br> <br>Aloha! <br>Scott</p>"
