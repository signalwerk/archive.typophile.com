    html: "<p>Thank you so much everyone for your feedback -- I'm kind of glad a common (stylistic at least) consensus has settled on 1b. Everyone else (non designers) points there too, so I think I'm on to something (as embryonic as it may be!) <br> <br>Just to clarify the punctuation thing: the word is pronouced (for the purposes of this client) diamEter, as if it were two words, dia and meter, but he wants to emphasise this without punctuating the logotype with a hyphen or anything (hence the duotone word). <br> <br>ole: I see what you mean about the orange -- rust + modern materials company = bad idea! Cholla is overused from our point of view, but (as BJ Harvey says) most non-designers don't see the overuse in the same light do, I don't think. I'm happy with the face at the moment (you may notice that I modified the upper join of the 'a' bowl a little). You're absolutely right about the tag-line too, it's an oversight on my part, thanks for bringing it to my attention. <br> <br>Scott: I'll look in to some more 'serious' colours, thanks for the feedback. <br> <br>Cristian: I agree about the 't' height, I may try bringing it down a little, thanks. <br> <br>Hrant: The arc is actually a segment of a (pixel) perfect circle, it's distortion may be an optical illusion caused by the fact that it's a little more than a semicircle and I've rounded the ends. Good spot though <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> Nice idea about the punctuation too, I almost want to try it out! <br> <br>Thanks again everyone, I'll post up some new comps once I've processed all this feedback. <br> <br>Jordan</p>"
    html_clean: "<p>Thank you so much everyone for your feedback -- I'm kind of glad a common (stylistic at least) consensus has settled on 1b. Everyone else (non designers) points there too, so I think I'm on to something (as embryonic as it may be!) <br> <br>Just to clarify the punctuation thing: the word is pronouced (for the purposes of this client) diamEter, as if it were two words, dia and meter, but he wants to emphasise this without punctuating the logotype with a hyphen or anything (hence the duotone word). <br> <br>ole: I see what you mean about the orange -- rust + modern materials company = bad idea! Cholla is overused from our point of view, but (as BJ Harvey says) most non-designers don't see the overuse in the same light do, I don't think. I'm happy with the face at the moment (you may notice that I modified the upper join of the 'a' bowl a little). You're absolutely right about the tag-line too, it's an oversight on my part, thanks for bringing it to my attention. <br> <br>Scott: I'll look in to some more 'serious' colours, thanks for the feedback. <br> <br>Cristian: I agree about the 't' height, I may try bringing it down a little, thanks. <br> <br>Hrant: The arc is actually a segment of a (pixel) perfect circle, it's distortion may be an optical illusion caused by the fact that it's a little more than a semicircle and I've rounded the ends. Good spot though <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> Nice idea about the punctuation too, I almost want to try it out! <br> <br>Thanks again everyone, I'll post up some new comps once I've processed all this feedback. <br> <br>Jordan</p>"
