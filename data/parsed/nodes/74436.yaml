      <p>Summarizing:<br>
      Compared to Romanized , Jawi Malay is easier-on-the-eye @  smoother-on-the-hand. </p>
      <p>1. Romanized has 52 letterforms (26x2: Capital @ Small).<br>
      Dropping Dots, Jawi has ONLY (19) dynamic forms as elaborated here:<br>
      <a href="http://typophile.com/files/QB3.3.pdf" title="http://typophile.com/files/QB3.3.pdf">http://typophile.com/files/QB3.3.pdf</a></p>
      <p>2. Malay is a phonetic language. It is better written (and crossworded) in Jawi.<br>
      <a href="http://typophile.com/files/Silang%20Kata%20Kelopak_0.pdf" title="http://typophile.com/files/Silang%20Kata%20Kelopak_0.pdf">http://typophile.com/files/Silang%20Kata%20Kelopak_0.pdf</a><br>
      ______________________<br>
      Thanks Chris Dean with Flowers</p>
