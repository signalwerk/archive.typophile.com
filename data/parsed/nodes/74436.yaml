    <p>Salam Sejahtera Kawanku,<br>
    Cintai Tulisan Jawi kerana ia identiti Bani Jawi/Yawi<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Yawi_6494.jpg"></div><br>
    Membandingkan dengan Rumi,<br>
    1. Jawi lebih indah, lebih mudah @ lebih menarik.<br>
    Rumi = 26 +A+B+D+E+G+H+Q+R = 17x2 = 34 bentuk berdiri sendiri.<br>
    Huruf Jawi - titik-2 =  Sahaja 19 bentuk yang manis @ tari-menari.<br>
    Tidak seperti Rumi, Jawi suka bercantum.<br>
    Hanya ekor perubahan seperti yang ditunjukkan di <a href="http://typophile.com/files/QB.pdf" rel="nofollow">sini</a><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Jawiware.PNG"></div><br>
    2. BM adalah bahasa fonetik, seperti Arab.<br>
    Cara terbaik adalah ditulis dan di<a href="http://typophile.com/files/Silang%20Kata%20Kelopak_0.pdf" rel="nofollow">Silangkata</a> dalam Jawi<br>
    <div class="imageWrap"><img src="http://typophile.com/files/FlowerUmberlla_4398.jpg"></div><br>
    Tetapi kebanyakan orang Melayu tidak mengetahui.  Rumi diambil, <a href="http://beritaharian.sg/gah/sastera/tak-ternilai-khazanah-akhbar-melayu" rel="nofollow">Jawi tak dihapus</a>. Masa akan menentukannya:<p></p>
    <p>______ Semarak Jawi melalui ______ </p>
    <p>1. <a href="http://ewandoo.com/arabic-pad-1-4/" rel="nofollow">Cute Apps</a><br>
    2. <a href="http://webctfatimah.wordpress.com/2010/10/30/ct20-tulisan-jawi-semakin-terancam/" rel="nofollow">Papantanda</a> <a href="http://www.sleeplessinkl.com/2010/08/25/going-crazy-over-jawi" rel="nofollow">Gila Jawi</a><br>
    3.  <a href="http://cisdel.com/2012/06/28/komik-yang-sangat-kelakar-ditulis-dalam-tulisan-jawi/" rel="nofollow">Komik @ Kartun</a><br>
    4. Tanda-tanda @ Signboards </p><div class="imageWrap"><img src="http://typophile.com/files/Signboard_4648.jpg"></div><br>
    5. <a href="http://typophile.com/files/PBMJ.pdf" rel="nofollow">PeriBahasa</a><br>
    6. <a href="http://typophile.com/node/120884" rel="nofollow">Tipografi</a> , <a href="http://www.inspirasikhat.com/" rel="nofollow">Khat</a> @ <a href="http://typophile.com/node/120811" rel="nofollow">Kaligrafi Digital</a><br>
    7. <a href="http://www.deepsouthwatch.org/sites/default/files/sinaran_15.pdf" rel="nofollow">Majallah , Kalender @ SuratKhabar</a><br>
    8. Pertandingan dan e-Menang<br>
    • <a href="http://emenang.com/community/index.php?/topic/54072-fly-high-jawi-contest-make-flower-win-macwin-kaligrafer/" rel="nofollow">Exchange Flowers</a> • <a href="http://typophile.com/node/118764" rel="nofollow">Type dn Menang </a> • <a href="http://typophile.com/node/119072" rel="nofollow">Dot dn Menang</a><br>
    • <a href="http://emenang.com/community/index.php?/topic/54845-fly-high-jawi-2-spot-the-differences-win-khattat-digital/" rel="nofollow">Spot the differences</a> • <a href="http://vectorise.net/forums/threads/5686-Fly-High-Jawi-%284%29-Terjemah-Menang-Perisian-Khat" rel="nofollow">Terjemah dn Menang</a>  • <a href="http://typophile.com/node/122435" rel="nofollow">Snap Foto</a><br>
    9. <a href="http://sejarahjawi.bravesites.com" rel="nofollow">Sejarah</a> @ <a href="http://eresources.nlb.gov.sg/printheritage/detail/42acab24-137e-4a0b-8068-093fb252467e.aspx" rel="nofollow">Forgotten Books</a><br>
