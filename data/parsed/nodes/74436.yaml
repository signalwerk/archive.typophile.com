    <p>Salam Sejahtera Kawanku,<br>
    Cintai Tulisan Jawi kerana ia identiti Bani Jawi/Yawi<br><img src="/sites/default/files/old-images/Yawi_6494.jpg"><br>
    Membandingkan dengan Rumi,<br>
    1. Jawi lebih indah, lebih mudah @ lebih menarik.<br>
    Rumi = 26 +A+B+D+E+G+H+Q+R = 17x2 = 34 bentuk berdiri sendiri.<br>
    Huruf Jawi - titik-2 =  Sahaja 19 bentuk yang manis @ tari-menari.<br>
    Tidak seperti Rumi, Jawi suka bercantum.<br>
    Hanya ekor perubahan seperti yang ditunjukkan di <a href="http://typophile.com/files/QB.pdf">sini</a><br><img src="/sites/default/files/old-images/Jawiware.PNG"><br>
    2. BM adalah bahasa fonetik, seperti Arab.<br>
    Cara terbaik adalah ditulis dan di<a href="http://typophile.com/files/Silang%20Kata%20Kelopak_0.pdf">Silangkata</a> dalam Jawi<br><img src="/sites/default/files/old-images/FlowerUmberlla_4398.jpg"><br>
    Tetapi kebanyakan orang Melayu tidak mengetahui.  Rumi diambil, <a href="http://beritaharian.sg/gah/sastera/tak-ternilai-khazanah-akhbar-melayu">Jawi tak dihapus</a>. Masa akan menentukannya:</p>
    <p>______ Semarak Jawi melalui ______ </p>
    <p>1. <a href="http://ewandoo.com/arabic-pad-1-4/">Cute Apps</a><br>
    2. <a href="http://webctfatimah.wordpress.com/2010/10/30/ct20-tulisan-jawi-semakin-terancam/">Papantanda</a> <a href="http://www.sleeplessinkl.com/2010/08/25/going-crazy-over-jawi">Gila Jawi</a><br>
    3.  <a href="http://cisdel.com/2012/06/28/komik-yang-sangat-kelakar-ditulis-dalam-tulisan-jawi/">Komik @ Kartun</a><br>
    4. Tanda-tanda @ Signboards <img src="/sites/default/files/old-images/Signboard_4648.jpg"><br>
    5. <a href="http://typophile.com/files/PBMJ.pdf">PeriBahasa</a><br>
    6. <a href="http://typophile.com/node/120884">Tipografi</a> , <a href="http://www.inspirasikhat.com/">Khat</a> @ <a href="http://typophile.com/node/120811">Kaligrafi Digital</a><br>
    7. <a href="http://www.deepsouthwatch.org/sites/default/files/sinaran_15.pdf">Majallah , Kalender @ SuratKhabar</a><br>
