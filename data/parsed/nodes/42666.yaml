    <p>Dear friends,</p>
    <p>My wonderful wife bought me several hundred gently used slugs of Futura in lots of sizes and weights. I saw plans for a press in Readymade, but doesn’t seem to be what I need for setting type. Does anyone know a place where I can find plans for such a device?</p>
    <p>Thanks.</p>
