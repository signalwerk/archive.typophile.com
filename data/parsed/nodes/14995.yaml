    html: |-
      <p>I personally don’t think you should share your source for inspiration.</p>
      <p>1. The client could end up liking the source and wanting you to round the corners of the source and you’ll be left with a typeface you’ve created and hope someone else wants it.<br>
      2. Giving clients too much information can sometimes muddy the waters of simplicity.</p>
      <p>So, you don’t have the typeface, but you did use it? How did you use it? Or I mean how were you able to draw inspiration from it?</p>
