      <p>“if you rebuild it from scratch, you shouldnt care about any EULA”<br>
      I could ’ave sworn I said that...</p>
      <p>” the etiquette of showing others where the inspiration came from”<br>
      I’m lost. Etiquette, really has nothing to do with it. I think the word you’re looking for is honesty, forthrightedness, or “being upfront,” about saying Y-type is based on X-type.</p>
      <p>“Perhaps Arial should have referred to Helvetica or Grotesque, but it didn’t. Some fonts do try to show the influence.” ?</p>
      <p>I did not realize how poor were my writing skills for short communications until I read the autobiography of U.S. Grant, a master in the early age of instant communications. He was one of the first to realize how screwed up the telegraph could make things if the message was fast, but unclear. : - )</p>
