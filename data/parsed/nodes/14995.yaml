    html: <p>1. The client licenses the original foundries type properly, i.e. for the number of machines and locations as specified by the eula. 2. you customize it as the client wishes. 3. the client replaces the customized font into the same licensing “footprint” as the original font. 4. You don’t license the font to anyone else unless they have the same deal as the first client, and it’s not exclusive to that client, or you totally recreate the font from scratch, remaking all the contours, all spacing and tables as if it was new.</p>
