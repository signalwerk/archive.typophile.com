      <p>im probably getting burned for writing this here, but my opinion is that if you rebuild it from scratch, you shouldnt care about any EULA. if you can convince the client to buy a license just because its better ethicaly, do it. but in the end you have all the work and have to build this thing from scratch, so you did it.</p>
      <p>if you use a grid you’ve seen used by somebody else, but you have to rebuild it entirely from scratch (in indesign, quark or whatever), its your work, not his. would you pay this other designer because your grid derived from his? no.</p>
