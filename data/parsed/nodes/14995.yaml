      <p>“Revealing your inspiration” sounds too fluffy but it won’t be a waste if you spin it into “demonstrating the visual evolution” or showing a “visual audit of the competitive landscape.” Then you’re on to something. </p>
      <p>See, it’s only fluff if you don’t attach quantifiable (objective) meaning to it — and I’m not talking about faking your way through it like kids in a 100-level college art class. I’ve found that some clients like to understand why something “feels” the way it does.</p>
