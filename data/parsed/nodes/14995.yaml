      <p>You say “small changes”, what does that mean? To me, the first thing is to look at the EULA.  If you don’t own the font, ask the foundry about it. If you are just doing a few words and not an actual font and the result will not be taken as the original you are probably OK. If you are making an entire font for sale competing with the original, it should be clearly enough different to not be taken as a rip off.  If it must look just like the original with a few minor changes, ask the designer to do it for you or give you permission to do it your self.</p>
      <p>ChrisL</p>
