      <p>Inspiration...<br>
      how and why doth thy muse descend?</p>
      <p>Was <a href="http://www.metmuseum.org/special/Matisse/15.L.htm" target="new">Joan Miro</a> inspired by <a href="http://www.myfonts.com/fonts/linotype/snell-roundhand-script/familytree.html" target="new">Charles Snell’s Script</a> or was <a href="http://www.artdaily.com/Fotos/galerias/201/h_NUMERO%207.jpg" target="new">Tom Carnase</a> inspired by Miro?<br>
      How many faces inspired <a href="http://www.ibiblio.org/wm/paint/auth/davis/blips.jpg" target="new">Stuart Davis</a> and was he the father of grunge type?</p>
      <p>Inspiration carries the torch from hand to hand, but copying steals the light. Be glad of what truly inspires you. Trying to introduce a client to your Muse is a wasted effort IMHO.</p>
