      <p>Poor writing skills kill the thread...I totally bunged this one up.  I was trying to get at something other than legal issues:</p>
      <p><cite>I don’t even own the face in question so there is no basis for me to copy their actual work…but I wonder if there is some etiquette regarding these kinds of things?</cite></p>
      <p>I was trying to talk about the etiquette of showing others where the inspiration came from.  The designer in question talks about where his inspiration originated (other fonts).  Perhaps it’s a completely stupid question...</p>
      <p>So, is there some etiquette that typographers (I’m a designer of 10 years but not a traditional typographer) use in these instances?  Are there some generic rules?</p>
      <p>The new font that I will likely be creating is unique enough...will not be for sale (unless somebody wants to handle that for me - too busy)...and is only based up the inspiration of another face.</p>
      <p>Perhaps Arial should have referred to Helvetica or Grotesque, but it didn’t.  Some fonts do try to show the influence.  I’m in new waters here...</p>
