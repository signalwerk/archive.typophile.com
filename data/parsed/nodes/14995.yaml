    <p>I recently presented a client with some initial concepts which were quite well received.  However, we quickly got into the disucssion about ’appropriateness’ regarding a particular typeface.  It’s an ultra-simple grid-based font.</p>
    <p>We agreed that it would probably be more appropriate if the edges of the elements were not sharp...instead they should all be rounded.</p>
    <p>And so, I’m in a position to build a font that is clearly based upon something else, yet I’m making some small global changes.  I don’t even own the face in question so there is no basis for me to copy their actual work...but I  wonder if there is some etiquette regarding these kinds of things?</p>
    <p>Any tips?</p>
    <p>Thanks...</p>
