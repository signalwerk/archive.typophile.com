    html: |-
      <p>Can you tell us how big these letters are, where they are located, and if possible, how long ago they were done?</p>
      <p>If this sample is on an airplane hangar, I doubt it's a font, in the sense of belonging to a set of letters you can install on your computer and use in a design/layout program. Lettering on buildings is often painted by hand, either because the letters are too big to render any other way, or because they're on a surface that's only accessible to a human on a scaffold. When letters are painted this way, the painter often uses improvised or simplified letterforms rather than precisely rendered copies of a commercially-available alphabet.</p>
