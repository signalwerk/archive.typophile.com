    html: |-
      <p>"This is the way these values are defined in latest Adobe and Microsoft fonts."<br>
      But not all Adobe and Microsoft fonts are defined thus, and future Adobe and Microsoft fonts may not be, and this ideal/default is also the same as it was in Fontographer 1.0.</p>
      <p>As I think we established some time ago, though I'm sure someone will correct me if I forgot, the Windows values were designed to inform applications of how much vertical space they have to write, (and erase) when composing text of a particular font. Some apps then took that for the em and confusion bestrode the issue. </p>
      <p>bvfonts, there are two options for the type designer, not as clearly put forth as they could be. </p>
      <p>Both are based first on the principle that the EM is split by the baseline at a ratio of 3 above and 1 below. Altering this ratio is done for all sorts of reidealizational purposes. And second that line gap is better expressed as "ideal leading"</p>
      <p>Then one option says; Design your font on the 3/1 em but Put Guides at yyy and -yyy and make sure all glyphs Stay Inside the Lines without much if any padding. I think this is the "something to worry about" option. </p>
      <p>And the second option says; Design your font on the 3/1 em, make reasonably sized accents and other kerns as the y dimension is filled up and down, and then push the button for Windows values. And I think <em>this,</em> is the "nothing to worry about" option, if it's not too late. ;)</p>
      <p>Cheers!</p>
