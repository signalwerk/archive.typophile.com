      <p>Yes, this is ok (A). Possibly adjust values a bit as described in footnote **.</p>
      <p>Another way (B) is what John Hudson describes in the Vertical Metrics How-to:*<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>"ideal" values:</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;TypoAscender = Ascender = 750<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;TypoDescender = Descender = -250<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;TypoLineGap = LineGap = 200**<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>maximum extensions found in the font/family:</em><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WinAscent = 850**<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WinDescent = -350**<br>
      This is the way these values are defined in latest Adobe and Microsoft fonts.<br>
      In this case, it is recommended*** to also set the OS/2 table fsSelection bit 7 and increase the OS/2 table's version to 4. This will tell applications -- those that understand this setting -- that they should use Typo... values rather than Win... values to calculate the default line-to-line distance. (Please note that as soon as OS/2 table’s version is 4, bits 7-9 need to be set or not set intentionally because whether these bits are 0 or 1 has a special meaning. More in the <a href="http://www.microsoft.com/typography/otspec/os2.htm" target="_blank" rel="nofollow">OS/2 table</a> and <a href="http://www.microsoft.com/typography/otspec/name.htm" target="_blank" rel="nofollow">name table</a> specs.)</p>
      <p>So both ways are possible, but for simplicity's sake I intend to either withdraw the PDF or change it so it reflects John Hudson's recommendation and Adobe's/Microsoft's practice, i.e. (B) -- much easier to describe and understand.</p>
      <p>* Especially see the "Update to the Update to the Update".</p>
      <p>** If you set WinAscent/WinDescent and Ascender/Descender e.g. to 800/-400 or 850/-350 (maybe future additional diacritic letters will get taller?), and TypoLineGap to 200, you get an "ideal" default line-to-line distance of 120%, comparable to setting 10/12pt.</p>
      <p>*** There are fonts that don't, and since your values match the equation<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;TypoAscender - TypoDescender + TypoLineGap<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= WinAscent - WinDescent<br>
      there's nothing to worry anyway.</p>
      <p>Karsten</p>
