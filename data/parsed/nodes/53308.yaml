    <p>I decided I wanted to configure the vertical metrics (TypoAscender, TypoDescender, etc.) instead of having fontlab do it manually. I'm very confused and after reading this: <a href="http://typophile.com/node/13081" title="http://typophile.com/node/13081">http://typophile.com/node/13081</a> even more confused.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/verticalmetrics_6577.jpg"></div><br>
