      <p>I thought about Nick's benevolent kick-back angle and I'm sure it's been done. But, uh, it's problematical. What if you get hit by a truck in the interim, before the money can be returned? (Sorry to be so grim, but stuff like that happens all the time.) Does Kickstarter have any provision for a project that gets funded but never begins for one reason or another?</p>
      <p>$8,000 at the outset seemed a little optimistic.  (Although what formula one could use to come up with a more "fundable" amount beats the heck out of me.)<br>
      If you're doing a talk about it, you might want to know about voyeurs like me: in addition to boosting your efforts with a link/post on Facebook, I also kept an eye on the totals. But by the last week it was clear that, barring a mighty big contributor, the project wasn't going to meet the required funding so I didn't bother pledging. It wouldn't have made a diff. I wonder if there were others keeping watch.</p>
