      <p>Hi Claudio,</p>
      <p>&gt; May I ask how this Kickstarter site basically works?</p>
      <p>Some bullet points from my TypeCon presentation today.  :)</p>
      <p>WHAT IS KICKSTARTER?<br>
      Biggest “crowdfunding” website<br>
      Run online funding campaigns<br>
      - Supporters pledge to get rewards (often the product you are getting pledges for)<br>
      - Neither investment nor charity<br>
      average pledge $71, most common $25<br>
      All or nothing funding<br>
      Time delay 2–3 weeks<br>
      10% overhead</p>
