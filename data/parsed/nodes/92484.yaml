    <p><a class="freelinking external" href="http://www.kickstarter.com/projects/tphinney/cristoforo-reviving-victorian-fonts-with-a-cthulhu" rel="nofollow">Help back my typeface “Cristoforo” via Kickstarter</a>, and choose from cool typographic goodies, including the fonts themselves.</p>
    <p>Cristoforo is a revival of some classic Victorian typefaces by Hermann Ihlenburg. It’s also known as the typeface of Call of Cthulhu, the H.P. Lovecraft roleplaying game, and as the original logo for Cracker Jack.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cristoforo-Kickstarter-headline-image-spaced_5633.gif"></div><p></p>
    <p>The campaign will only last until midnight on Saturday May 19. Basically, people pledge money for fonts and other goodies up front so I know the project is viable. Reward options for backers depend on their funding level, and include not only the fonts, but computer desktop wallpaper, postcards, T-​​shirts and posters.</p>
    <p>Kickstarter is all or nothing. Only if the total pledges exceed the minimum funding target are people’s credit cards charged and the project moves forward.</p>
    <p>If funding exceeds the minimum by enough of a margin, I can add more language support for central/​eastern Europe, and even pay an intern!</p>
  html_clean: |-
    <p><a class="freelinking external" href="http://www.kickstarter.com/projects/tphinney/cristoforo-reviving-victorian-fonts-with-a-cthulhu" rel="nofollow">Help back my typeface “Cristoforo” via Kickstarter</a>, and choose from cool typographic goodies, including the fonts themselves.</p>
    <p>Cristoforo is a revival of some classic Victorian typefaces by Hermann Ihlenburg. It’s also known as the typeface of Call of Cthulhu, the H.P. Lovecraft roleplaying game, and as the original logo for Cracker Jack.</p>
    <p></p><div class="imageWrap"><img src="/files/cristoforo-kickstarter-headline-image-spaced_5633.gif"></div><p></p>
    <p>The campaign will only last until midnight on Saturday May 19. Basically, people pledge money for fonts and other goodies up front so I know the project is viable. Reward options for backers depend on their funding level, and include not only the fonts, but computer desktop wallpaper, postcards, T-​​shirts and posters.</p>
    <p>Kickstarter is all or nothing. Only if the total pledges exceed the minimum funding target are people’s credit cards charged and the project moves forward.</p>
    <p>If funding exceeds the minimum by enough of a margin, I can add more language support for central/​eastern Europe, and even pay an intern!</p>
