      <p>A few months ago, I almost went down this path. I had the project approved, the rewards decided, all the time invested in the write-up and the beginning of a video. Then, I changed my mind and decided not to do it. My reasoning was that I didn't want to be accountable to anyone and I wanted the time-frame to be as long as I needed. The money would have been extremely helpful, of course, but I figured actually doing it myself would be more rewarding.</p>
