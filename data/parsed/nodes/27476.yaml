    html: |-
      <p>Path direction is key.  As noted above, all paths must be closed. Paths within paths like the counter of an o inside the outer border--need to wrap in opposite direction.  Starting with counterclockwise trhen the inner one becomes clockwise.  I don't know TypeTool but there must be a command to set postscript or truetype path direction in it somewhere.</p>
      <p>You must do your own spacing.  I assume you can drag the sidebearings in and out in TypeTool.  There surely must be a screen where you can type them in as well. Quantities may vary, if you try this at home, know that it takes practice a some skill to get it right.</p>
      <p>ChrisL</p>
