    <p>Hi,</p>
    <p>I am looking for some suggestions. I need a font for a nursery / day care center, for children.</p>
    <p>The characteristics I am after are trustworthiness, cheerfulness, playfulness, warm reception. </p>
    <p>The style of the website will follow the above directions and probably will use illustrations and decorations.</p>
    <p>Thanks in advance!</p>
