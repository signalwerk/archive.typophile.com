    <p>I am wondering who designed the original SPIN Magazine logo? The old original logo has slightly rounded corners, while the updated version, which is almost exact has sharp modern edges. Anyone know the typeface which this is based off of, if it is indeed custom which I believe to be so.</p>
    <p>Thanks,</p>
    <p>AGM</p><div class="imageWrap"><img src="http://typophile.com/files/OLD-SPIN-LOGO_4715.jpg"></div><p></p>
