    html: <p>I can't say this for sure, especially given the form of that S, but I work for some folks who were behind the start of SPIN. They have very strict rules about type, and I'm fairly certain that this is Akzindenz Grotesk or DIN Schrift. The S, as I said, looks modified, but those two faces are used on the logos of many of the magazines that have fallen under the ownership of the Guccione family (which started SPIN).</p>
