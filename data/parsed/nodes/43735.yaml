      <p>I think most of us were immediately frightened off by the fact that you were taking advice from a myspace poll. Also, typophile was 404 for quite a while earlier this week.</p>
      <p>I’ll give you my impression of what you’ve got so far. </p>
      <p>Overall, it’s way too detailed, and the mix of photographic elements with (what looks like) pencil lines doesn’t achieve rugged or grunge - it just looks sloppy. The third version is headed in the right direction, but it’s far from complete. </p>
      <p>I think (?) your spikes are meant to be a platform, but the way it looks now, it’s really more of a violent-looking star. I’d scrap the four “spikes” on the bottom and replace them with a mirror image of the top three spikes (which, btw, I would redraw to center the middle spike, and/or exaggerate the angles for drama.) </p>
      <p>Repeat after me; simple is GOOD. Simple is memorable, and simple will save you money. I suggest spending some time looking at vector art (icons and logos) and find some microphone art you like to inspire your rendering. (but stay away from gradients - $$$) Of your three versions, none will scale down AND up and still look like a microphone. The last one is looking ... well, naughty.</p>
      <p>In short, I think the silence on this thread is collectively saying; “The font is the least of your worries.” Sorry if this seemed harsh, but it’s honest. I hope it helps.</p>
      <p>AK</p>
