      <p>Hi Alaskan,</p>
      <p>ok, ’Simple is Good’.  Thank you for your critique and suggestions.</p>
      <p>Simplifying the starlike structure at the bottom and seeking inspiration in vector based art for the complex grille will be my next go.</p>
      <p>The grille appears to be the most incompatible portion in regard to flexprint.  This should - at least - solve the technical shortcomings ;)</p>
      <p>Regarding aesthetics, I like the violent appearance of ’the star’.  People who record in studios will identify it as a classic microphone shock mount.  Others will take it as a star. Exaggerating this structure is a good suggestion.  Also, I don’t mind the phallic qualities of the design, it’s not for streamlined corporate purposes so that’s ok.</p>
      <p>Too bad, I would have loved to integrate a font I’m confident with but I guess I’ll have to take care of that in step two.</p>
      <p>No worries about the ’harshness’ of your feedback.  I’ve posted here to learn, not for pats on my back. It was a lot milder than I expected and inspirational.</p>
