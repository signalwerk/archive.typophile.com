      <p>Listening to their music, I’d go for a brush script style font, like the style <a href="http://sudtipos.com/home" target="_blank">Sudtipos</a> specializes in. Something nice and fat like Calgary Script or Milk Script. Then I would draw an illustration to match the type.</p>
