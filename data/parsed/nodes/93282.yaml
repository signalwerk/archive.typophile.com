  html: |-
    <p>I have received a Word doc from a client with a word displayed in a phonetic alphabet font (see attached sample). I can't seem to find a font on my Mac OS 10.6.8 running InDesign CS 5.5 that will match the characters. I would have thought the OT version of Minion Pro, for example, would work, but no joy.</p>
    <p>FWIW the font used in Word is listed as HiraMinPro-W3, which to me indicates it is at least sourced from Minion Pro. Maybe I'm just a gumby and can't activate the required set through the Open Type dialog in InDesign?</p>
    <p>Any suggestions?</p>
