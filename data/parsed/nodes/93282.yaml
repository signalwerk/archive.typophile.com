      <p>Minion does not have IPA phonetic characters (unfortunately!), and the font you show is not Minion. Times New Roman, among other system fonts, does. My preference is Gentium, which you can download for free online.</p>
      <p>Here, for instance:<br>
      <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=Gentium_download" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=Gentium_download">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=Gentium_down...</a></p>
      <p>[Edit:] Actually, on second thought, Minion does have what you need for this one word, if you hijack the Cyrillic schwa:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/phonetics_3621.png"></div><p></p>
