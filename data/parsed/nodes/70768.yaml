  html: |-
    <p>Hi guys,</p>
    <p>I'm putting together a newsletter and wondered what you thought of this combination. We have licences for Guardian Egyptian text and Stag. Although I wouldn't normally pair two similar fonts, the proportions are quite different. Stag seems to convey a more friendly attitude suitable for the headlines and Guardian of course packs in a lot more letters per column.</p>
    <p>Here's a quick grab:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/stag_5038.png"></div><p></p>
