    html: "<p>Dana, apparently you succeeded in posting, but for some reason I for one didn't get a copy of the original message! <br> <br>As you say, this is very rough. Which makes it not <i>impossible</i> to evaluate, but requires some assumptions on our end of what your <i>intent</i> actually is, I mean [even] at the formal level. For example we can only guess whether you intend to make the final result smooth or rough, irregular or consistent, etc. <br> <br>One thing I would guess is that you're going for Modern (uniform) widths on the caps (as opposed to \"Classical\"). If this is true, then I would say that the \"C\", \"H\", \"L\", \"M\", \"T\" and \"Y\" are too narrow, while \"S\" is too wide. In the lc, compare the \"s\" and \"t\": these are characters that should [generally] be more harmonious in widths. <br> <br>Trying to figure out what kind of finish (as opposed to structure - which you seem to mostly have already) would make this design look its best, it seems to me that something with smooth, disciplined, contrasty curves -think of Peignot- would give it a character most likely to end up being used by numerous people. <br> <br>hhp</p>"
