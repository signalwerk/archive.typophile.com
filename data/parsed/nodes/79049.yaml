    html: |-
      <p>My advise for affordable typefaces would be the following:</p>
      <p>Epic seems to be interesting:<br>
      <a href="http://new.myfonts.com/fonts/positype/epic/" title="http://new.myfonts.com/fonts/positype/epic/">http://new.myfonts.com/fonts/positype/epic/</a></p>
      <p>In a summery about classical text fonts of the pre-digital age, found here: <a href="http://www.textism.com/textfaces/index.html?id=19" title="http://www.textism.com/textfaces/index.html?id=19">http://www.textism.com/textfaces/index.html?id=19</a><br>
      there are some fonts highlighted as "having survived the transition to digital well". I personally like Sabon, Dante und Janson, which are available for 29USD a weight. Albertina is a fine piece of work, but the Dutch Type Library is not a cheap foundry. </p>
      <p>DSType has a couple of nice serifs: Glosa, Leitura, Musee, Capsa<br>
      <a href="http://www.dstype.com/" title="http://www.dstype.com/">http://www.dstype.com/</a></p>
      <p>One font I have never heard being mentioned by anybody – nor can I find any information about the foundry – is Pevensey. It is very affordable, and is very similar to Times, but does not have the condensed proportions. <a href="http://new.myfonts.com/fonts/aah-yes/pevensey/" title="http://new.myfonts.com/fonts/aah-yes/pevensey/">http://new.myfonts.com/fonts/aah-yes/pevensey/</a></p>
      <p>Interesting as well is SFPL from Stone Type foundry, a classical looking serif font for only 39USD for the whole family. There is no bold italic and the character range is rather small though. <a href="http://www.stonetypefoundry.com/sfploverview.html" title="http://www.stonetypefoundry.com/sfploverview.html">http://www.stonetypefoundry.com/sfploverview.html</a></p>
      <p>All of the above mentioned come with the advantage, that they are not any of the usual suspects. </p>
      <p>There are even some interesting typefaces for free available:</p>
      <p>A common newspaper font is Utopia, available for LaTeX uses for free here: <a href="http://www.ctan.org/tex-archive/fonts/utopia/" title="http://www.ctan.org/tex-archive/fonts/utopia/">http://www.ctan.org/tex-archive/fonts/utopia/</a><br>
      Did not read up on the licence situation here. </p>
      <p>PTSerif was just released: <a href="http://www.paratype.com/public/" title="http://www.paratype.com/public/">http://www.paratype.com/public/</a></p>
      <p>Junicode follows the classic English old-style typefaces:<br>
      <a href="http://junicode.sourceforge.net/" title="http://junicode.sourceforge.net/">http://junicode.sourceforge.net/</a><br>
      but personally I would recommend to expand it by 3 or 4 per cent. </p>
      <p>With all the advise keep in mind please that I am not an expert. Let your eyes be the judges and please check if the character range suits your demands.</p>
