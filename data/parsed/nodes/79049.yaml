    <p>I'm trying to choose a font for correspondence.  These are relatively short letters to either companies or individuals.  I narrowed the list down to Stempel Garamond LT Std, Garamond Premiere Pro, Adobe Caslon Pro or Minion Pro.  Does anyone have any preferences or suggestions?</p>
    <p>Thanks</p>
