    html: |-
      <p>I prefer to privilege function over allusion.<br>
      In other words, it’s how a condensed or extended face is used in a layout that determines its effect.</p>
      <p>A condensed face may be considered horizontally compressed (narrow), or vertically stretched (tall). These convey two quite different feelings — either restricted or expansive.</p>
      <p>Factors like how big the condensed form is in relation to the page, and other type and graphics on the page, determine what kind of a feeling, symbolism, or meaning, it conveys.</p>
      <p>One thing: the amount of tracking (letterspacing) applied to a condensed face makes a huge difference to its effect, especially for all caps. But extended forms almost always look best set quite tight.</p>
