    html: |-
      <p><em> it is better to set it wider?</em></p>
      <p>As I said, it is the layout as a whole that determines the effect.<br>
      So you have to take into consideration how big it is on the page/card, and its relation with the other type. Also, the weight and style of the face have some bearing on the matter. And be more precise in your analysis — does “wider” mean horizontally stretched, tracked out, or occupying more width?</p>
      <p>Typography is a practical matter. Sure, you can follow Bringhurst’s “rules” as a starting point, but it only takes you so far. Beyond that, you have to try out variations and see what looks best. If you have no opinion as to whether one setting looks better than another, you should get someone else to do the job.</p>
      <p>This story about a newspaper editor’s relationship with his work<br>
      has a wide relevance, and may be applied to typography also:<br>
      The process of editing was neatly articulated by Ralph Ingersoll,<br>
      who helped launch Life and Fortune magazines in the USA in the thirties: </p>
      <p>“An editor may pass for print only what pleases him. It is his own taste<br>
      he must discover. If he then finds that people share his taste and like<br>
      or enjoy or approve of what his taste has chosen, then he is a successful<br>
      editor. If they don’t, then he had better choose another trade, for no man<br>
      can base his choice on what he imagines or reasons other people MIGHT like.” </p>
      <p>Having said that, Ingersoll went on to launch his own daily newspaper<br>
      –- PM — in New York City. It failed. He became an author.</p>
