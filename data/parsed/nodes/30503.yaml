    html: |-
      <p>You can argue for historical associations for particular cases. </p>
      <p>A grotesque face or a slab serif, by itself, probably doesn’t carry much baggage. Now, a headline set in a condensed grotesque starts to speak in the tones of mid-century newspaper typography. Really huge ultra-condensed slab serifs screaming across the page? We’re looking at 1800s advertising type. Palatino stretched in PageMaker so that it fills the width of the column? Why, it’s 1990 and we’re in the middle of the DTP revolution!</p>
      <p>I’m being flippant. Partly. These cases are recognizable because of someone went to the trouble of choosing condensed or extended versions of otherwise unremarkable typefaces.</p>
