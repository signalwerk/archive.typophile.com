    html: |-
      <p>You don't need SuperRoboGlyphsPolator or any fancy tool for good spacing.</p>
      <p>To me:<br>
      - The "H" is a hair loose.<br>
      - The "I" is a bit tight.<br>
      - The "E" is a bit loose on the right, and probably a hair loose on the left.</p>
      <p>hhp</p>
