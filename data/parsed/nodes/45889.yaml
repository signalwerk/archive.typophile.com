    <p>I am working on a logotype, that will be used both in black on white background and in white on a black background. I've heard that some designers make the inverted logo version a bit lighter to counter balance the optical illusion that makes it look bolder.<br>
    How common is this? Is it really necessary or does it just complicate things? And  how much lighter should it be. Are there any general rules? I have been trying this out so much that I have lost all judgement.</p>
