      <p>I see... So if I'm taking into consideration ink creep then there should be at least one bolder version for small print and one less so for larger sizes.</p>
      <p>Since it's a logo it will be used in several sizes, printed on different material and with different techniques, and I will not be able or present to adjust it every time. </p>
      <p>Furthermore I'm not sure my client will see the difference but instead be rather annoyed by the hassle of having a huge number of logo files. I should mention that this is a quite small business, so there will be no team of inhouse designers ready to assure that the logo is reproduced perfectly every time...</p>
