      <p>I guess that it makes sense. I work on a magazine and every time we have white lettering on a black background the rule is to 'go up' one weight on the letters (i.e. if you are using book you should go to medium). It does make a difference, if we let it stay in book it appears to be smaller then it is. All the best.</p>
      <p>Pedro Monteiro<br>
