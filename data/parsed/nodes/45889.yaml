    html: |-
      <p>Traditionally, reversed type would be slightly heavier for two reasons:</p>
      <p> - ink creep<br>
       - visual balance compared to the non-reversed type</p>
      <p>So, in the case of your logo, it really just depends on how it's going to be used, sizes it will be printed at, etc.</p>
