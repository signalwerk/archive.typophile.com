      <p>It is perfectly acceptable to make a logo in multiple sizes and weights. All this together along with documentation for their appropriate use comprise a corporate identity system manual, which you can charge a lot more for than a single logo.</p>
      <p>But for a small business, limit their choices as much as is practical, i.e.: direct them to use one most of the time, and the bolder one when reversed out or below a certain size. Clear simple rules, ne?</p>
