    <p>I am a design student currently writting a paper on Howard Gardiner and his multiple intelligences theory. While information regarding this theories usage in academic education is abundent, information on its influence on art and design education is not so plentifull.<br>
    Hopefully this paper will build into my final year project in which I hope to design several booklets detailling each intelligence. I am not sure what audience this will be aimed at as of yet, ideally the design community.<br>
    What I really need are sources containing alternative treatments of the seven intelligences (spatial, linguistic, musical, mathematical,  interpersonal, intrapersonal, bodily kinesthetic, and perhaps the eight alternative, naturalistic.) Have any other designers attempted to visually communicate this information?<br>
    Any help is greatly appreciated,<br>
    sara</p>
