      <p>I generally don’t discuss point size with clients - just show them what I think works and revise it to suit their problems with it. My advice is to design it in a way that you think is proportionate and readable, regardless of actual point size, and if she’s ok with it great. If she says the type is too small you might have to enlarge it. </p>
      <p>I have a client who won’t tolerate justified type, another one who hates green. I feel your pain. But it can be a waste of time to try to ‘educate’ them. They just get prickly.</p>
