    html: |-
      <p>Well, chose a font with a small x-height, obviously. </p>
      <p>Or set the publication in various font sizes and show it to the client (make a test page). Chances are she’ll appreciate just how big 12 pt is when she sees it in print. Tell her about how you can use more white space for readability, how lines will break better and how there’ll be more space for good articles if the point size is reduced. Show her other publications and tell her the point size they’re using.</p>
