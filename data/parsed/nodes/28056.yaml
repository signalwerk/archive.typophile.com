  html: <p>I have been putting together annual reports, magazines and multi-page docs for a long time. I have always been mindful of my audience, length of text, etc. and now have a client that simply insists that the text be at least 12 point. No matter what font. Typically, I have chosen serif fonts with large x-heights (for this particular project, Usherwood) to reduce the size to at least 11 pt and sometimes 10, just to get the enormous amount of text to fit in a reasonable number of pages. Long story just slightly shorter, what are your thoughts? And, are there recent articles about this topic readily available? I have a feeling that if I can present hard evidence to the fact that smaller than 12 pt is acceptable, I might be able to sway her. Audience is alumni and donors of a business college. Age is recent grads to 30-year-out grads. Any help or advice is greatly appreciated.</p>
  html_clean: <p>I have been putting together annual reports, magazines and multi-page docs for a long time. I have always been mindful of my audience, length of text, etc. and now have a client that simply insists that the text be at least 12 point. No matter what font. Typically, I have chosen serif fonts with large x-heights (for this particular project, Usherwood) to reduce the size to at least 11 pt and sometimes 10, just to get the enormous amount of text to fit in a reasonable number of pages. Long story just slightly shorter, what are your thoughts? And, are there recent articles about this topic readily available? I have a feeling that if I can present hard evidence to the fact that smaller than 12 pt is acceptable, I might be able to sway her. Audience is alumni and donors of a business college. Age is recent grads to 30-year-out grads. Any help or advice is greatly appreciated.</p>
