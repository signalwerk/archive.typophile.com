    html: <p>Thank you. I have actually already done most of that. I am in process of gathering publications similar to hers with effective use of 11 and 10 point type. Plus, I’m digging out all my old type books with entries about body text. Sometimes it’s just a little frustrating when professional experience and knowledge of said subject matter isn’t enough for people.</p>
