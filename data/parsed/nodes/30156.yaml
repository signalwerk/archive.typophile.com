      <p>Without a doubt, Underworld by Don Delillo, I feel a strange kind of regret everytime I go to a bookshop and see it on the shelf because I've read it and own it and have no need to buy it.</p>
      <p>Dostovesky's Crime and Punishment, possibly the greatest novel ever written, the writing is so good and immersive the divide between Raskolnikov's life and mine began to blur a little as i read it. I've heard the Borthers Karamoazov is as good if not better.</p>
      <p>Continuing the Biblical theme Pilgrim's progress by John Bunyan,  Screwtape letters by CS Lewis for two very different, entertaining, helpful and wise takes on what it is to live as a Christian.</p>
