      <p>Read <em>House of Leaves</em> by Mark Danielewski. It's a great example of stories-within-stories, American gothic horror, hardcore erotica, erudite writing, and it's got great typography set by the author, with words that go forward, backward, into shapes, etc. Literary critics describe it with respectful comparisons to Nabokov and Borges; Poynor included it in <em>Graphic Design and Postmodernism</em>. And getting funny looks when you have to keep rotating a book when you're on a plane is always great.</p>
      <p>If you want to read something tremendously fun, contemporary and erudite without delving into the design world, read <em>World War Z</em> by Max Brooks. On the surface it looks like a kitschy zombie book, but it's just as engrossing as Harry Potter, and far more intelligent.</p>
