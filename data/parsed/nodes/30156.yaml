      <p>Manilo,</p>
      <p>Yeah you could compare Delillo to pynchon, perhaps in intent more in style; I think both are interested to capture and comment on American consumer culture/hyper-capitalism in all its manifestations, (especially Underworld and White noise) Delillo is much less scatty/absurd then pynchon, much more formal and dramatic, I've only read Vineland so that's what I'm going off. I own gravity's rainbow and have managed a total of about 6 pages; I know Patty would disagree, but I found Delillo much more accessible to read than Pynchon.</p>
      <p>I reckon the trick with Dellilo is to accept early on that the characters don't speak quite like people speak but, though you seem to lose a level of identification (and ability to suspend your disbelief), you gain so much insight into reality and relationships and people through the actual content of the dialogue that it doesn't matter. White noise is fun and a lot less intimidating in size than Underworld, I'd read that first and see if you dig what's going on,<br>
      cheers, have fun in BH</p>
      <p>Nick</p>
