      <p><cite>Alice’s Adventures in Wonderland</cite><br>
      Absolutely. I even bought myself the pop-up book. A masterpiece by Robert Sabuda published by Simon &amp; Schuster in the UK, quite expensive and you need to keep the kids at distance, which is sad because they go mad when they see it.</p>
      <p>I loved <cite>A Confederacy of Dunces</cite> (Pulitzer Prize) by J.K. Toole. Set in New Orleans, it has been translated but I'm afraid it only makes sense in English. Awesome.</p>
      <p>When I left England I took with me 3 books by Jonathan Coe: <cite>The Rotters Club</cite>, <cite>The Closed Circle</cite> (follow up) and <cite>What a Carve Up!</cite> (The title in the US changed to <cite>The Winshaw Family</cite> I think) and a few Private Eye editions to remember my wonderful years in the UK! </p>
      <p>How could I forget: John Lanchester's <cite>The Debt to Pleasure</cite>. What a book: Eccentric, refined and voluptuous. And Manlio, the Italian translation is fine too (the title in Italian is <cite>Gola</cite>). </p>
      <p>Italian: anything by Calvino, Sciascia or Primo Levi, but I don't need to tell you that!</p>
      <p><cite>Perfume</cite> I read it when it first came out (or a couple of years later) and everyone was talking about it. For some reason I wasn't that impressed but maybe I should have another go.</p>
      <p>When I was working on the poster for a campaign against Tessa Jowell's Gambling Bill a couple of years ago, <cite>The Gambler</cite> by Dostoyevsky  was a great source of inspiration. His descriptions are so graphic it's amazing.</p>
