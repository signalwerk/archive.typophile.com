      <p>I have not read "Perfume" since the 1980s but it has stayed with me as few other books have. A powerful and sensual tale.</p>
      <p>Another literary high point for me -- not sure if it was popular enough to be translated into Italian -- is a book called "Le Mas Théotime" by Henri Bosco. It's a wonderful mystery about rural life in Provence in the late 19th century. It was published only once in English, in the late 1940s, but perhaps with luck it was also published in Italian. In France it seems to be perennially in print.</p>
