    <p>Few months ago I moved from Italy to Bosnia-Herzegovina and, since I could carry with myself only few design books and a Bible, I ended up reading Bringhurst and the Four Gospels from dawn till dusk.<br>
    Now I'm going to spend Christmas holidays in Italy so I can take some other book from my library and buy new ones. My suitcase isn't huge and I won't be back in Italy again before next summer so I must select carefully.<br>
    What would you choose?</p>
  html_clean: |-
