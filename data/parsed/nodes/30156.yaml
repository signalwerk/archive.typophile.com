    html: <p>I just zipped through Mark Z. Danielewski's <a href="www.onlyrevolutions.com" rel="nofollow">Only Revolutions</a>, as I am a big fan of his first novel, House of Leaves.  It's amazing. I can't recommend it to the 'classical' reader, but anyone who liked House of Leaves and is also a great fan of Kerouac will appreciate this road novel. It's also ingenuously designed, it has two front covers, and the pages are laid out so that there are always two stories on one page, but either one rotated 180 degrees. Well, you should just check it out in a local bookstore. It's wonderful.</p>
