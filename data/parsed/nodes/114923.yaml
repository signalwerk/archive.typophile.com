      It looks similar to Paul Renner's original design for Futura <a href="http://sietepecadosdigitales.files.wordpress.com/2012/03/004_paul_renner_theredlist.jpg" title="http://sietepecadosdigitales.files.wordpress.com/2012/03/004_paul_renner_theredlist.jpg">http://sietepecadosdigitales.files.wordpress.com/2012/03/004_paul_renner...</a> which I consider to be an excess of geometry for the sake of geometry. But then again, some people like this stuff.<br>
      Don<p></p>
