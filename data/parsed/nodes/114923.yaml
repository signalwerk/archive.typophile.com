      <p>Not perfect but probably closer than the previous suggestions is <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fountain/dessau_pro" rel="nofollow">Dessau</a> Zufunkt which looks to have almost all earmarks you need for this design.<br>
