      <p>Hi All,</p>
      <p>The logo was for a contest that was being held in our area. I chose the symbol of a crest because I wanted the logo to look somewhat traditional and in an Art Deco style. It was to look like a captain's hat for an airline. I know this isn't for an airline, but at the same time I wanted the viewer to have a sense of comfort in travelling on the transit, hence the crest to show stability. The colors were picked mainly because I felt that blue and red with grey is overused for transit companies. I wanted something different, more contemporary and sophisticated looking.  </p>
      <p>Was I off the mark in this approach?</p>
      <p>Reid</p>
