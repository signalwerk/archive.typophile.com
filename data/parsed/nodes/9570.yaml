    <p>Hey all. So I'm finally getting down to making some type instead of thinking and talking about it. My first experiment is on a (sorry in advance) handwriting font to match up with one of my clients' corporate face. <br> <br>I'm running the Scanfont/TypeTool combo (sorry, I won't be upping the ante to FontLab until I get my sorry ••• up to OSX). <br> <br>The specific problem I'm encountering now is that the screen version of the font looks quite terrible. For the most part this doesn't bother me as it's printing alright. But I'm thinking if I get around to letting this face into the world then I should do what I can to make it more usable for folks. <br> <br>What is it that I need to learn to make a font display sort of ok on screen?  <br> <br>Thanks in advance, free beer in Vermont, Hello Hrant, <br> <br>g <br></p>
