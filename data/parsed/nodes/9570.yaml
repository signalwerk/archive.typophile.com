    html: "<p>Hey Gahlord - you're alive!  :-) <br> <br>Assuming you're not going to upgarde to FontLab (which may be able to auto-hint your font satisfactorily - but maybe not, since it's handwriting), you have four choices: <br>1) Hint it manually using Fog. This is the normal practice for high-end fonts, but mucho work, plus Fog's hinting is half-baked. <br>2) Edit the GASP Table so that it renders anti-aliased at all sizes, so that the lack of hinting doesn't matter. Problems: you'll need special software (although VTT is free); and it assumes the font will be used on an operating system that has smoothing enabled. <br>3) Edit bitmaps. This isn't as bad as some people will have you believe, although it's too much work if you have to do too many point sizes, plus some OSes won't support it. <br>4) Leave it as is and tell the client they can't afford the real thing. <br> <br>hhp <br></p>"
    html_clean: "<p>Hey Gahlord - you're alive!  :-) <br> <br>Assuming you're not going to upgarde to FontLab (which may be able to auto-hint your font satisfactorily - but maybe not, since it's handwriting), you have four choices: <br>1) Hint it manually using Fog. This is the normal practice for high-end fonts, but mucho work, plus Fog's hinting is half-baked. <br>2) Edit the GASP Table so that it renders anti-aliased at all sizes, so that the lack of hinting doesn't matter. Problems: you'll need special software (although VTT is free); and it assumes the font will be used on an operating system that has smoothing enabled. <br>3) Edit bitmaps. This isn't as bad as some people will have you believe, although it's too much work if you have to do too many point sizes, plus some OSes won't support it. <br>4) Leave it as is and tell the client they can't afford the real thing. <br> <br>hhp <br></p>"
