    html: "<p>The GASP table is something in a TT font that tells the screen renderer at what PPEM (screen point) sizes to use hinting and/or bitmaps. The only no-cost way to edit it that I know of (short of hand-editing binary code) is by using VTT: <br><a href=\"http://www.microsoft.com/typography/links/News.asp?NID=655\" target=\"_blank\">http://www.microsoft.com/typography/links/News.asp?NID=655</a> <br>What you would do is tell it to ignore hinting at all sizes. <br> <br>&gt; What OSes won't support the hand edited bitmaps?  <br> <br>Good question... <br>I'm behind the times on the Mac side, but I've heard that newer MacOSes ignore bitmaps.  :-( <br> <br>Insight into this would be really appreciated. <br> <br>hhp <br></p>"
    html_clean: "<p>The GASP table is something in a TT font that tells the screen renderer at what PPEM (screen point) sizes to use hinting and/or bitmaps. The only no-cost way to edit it that I know of (short of hand-editing binary code) is by using VTT: <br><a href=\"http://www.microsoft.com/typography/links/News.asp?NID=655\" target=\"_blank\" class=\"link-external\">http://www.microsoft.com/typography/links/News.asp?NID=655</a> <br>What you would do is tell it to ignore hinting at all sizes. <br> <br>&gt; What OSes won't support the hand edited bitmaps?  <br> <br>Good question... <br>I'm behind the times on the Mac side, but I've heard that newer MacOSes ignore bitmaps.  :-( <br> <br>Insight into this would be really appreciated. <br> <br>hhp <br></p>"
