    html: <p> As far as the client goes, I'm set. I'm thinking long range. The client isn't buying exclusive rights to the face (but is funding a very small piece of the font development... it's a good client). <br> <br>Sooner or later I'll get done with it (it currently supports Western European languages, I want to support as many languages as House Industries does with Chalet, they're sort of my model in terms of language support; a future version would hit Greek, Cyrillic, Armenian, and Papazian style alphabets and a 3rd version might tackle Chinese and Katakana). And I want it to be considered a well made font. It prints as intended, I want people to feel the the computer representation is accurate enough. <br> <br>What beginning computer font designers realllllly need is a basic tutorial on the issues. First a big gloss of the main issues, then the nitty gritty...  <br> <br>Hrant (since I know you know a lot of this, and I know you're going to read this)... What would the table of contents of a book called Digital Typeface Development look like? <br> <br>thx, g <br> <br> </p>
