      <p>But what is the sans/serif opposition trying to convey? </p>
      <p>So, you could stick to something more "modern" like Proxima Nova or Gotham for a lower level of opposition. Or you could pick something like John Sans, which will contrast in two ways, both in serifs and stress, or you could go all the way and pick a humanist sans like Optima or Candara.</p>
