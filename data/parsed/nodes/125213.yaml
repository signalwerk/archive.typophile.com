      <p>Your sample is not much to go on. It would be helpful if you could post more example characters than this.</p>
      <p>It does look like Tahoma, but I am not aware of any typefaces older than Tahoma that would be this close. Whoever told you Tahoma was a knockoff was wrong. Your sample does not match any Frutiger fonts that I know of, and Susan Kare only designed bitmapped fonts for Apple. Tahoma resembles older typefaces in only the most superficial sense.</p>
      <p>In November 1991, TrueType fonts were very new. Among the initial set of TrueType fonts that Apple shipped, none looked much like Tahoma. (The fonts were Times, Helvetica, Courier, and TrueType versions of Kare's earlier bitmapped fonts Geneva, New York, Chicago, and Monaco.)</p>
