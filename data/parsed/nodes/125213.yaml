      <p><strong>The reason it matters:</strong></p>
      <blockquote><p>Jim Vanguard<br>
      Tahoma is a clone of VBF-42, a proprietary typeface designed by Adria Frutiger in 1965. It was revised in 1978 and again in 1989 for use with Windows 3.0 and early Macintosh. VBF42 was the resident font in software sold by Vanguard Business Forms until the company was purchased in 1994.</p></blockquote>
      <p>So is that the last word on this? No, not at all, because it isn't the truth. That "person" who wrote it does not legally exist under that name in the US. It is a lame attempt to mislead people by someone who made their very first post here using a name which was made up to imply they had information about the mysterious Vanguard Business Forms company and its proprietary font.</p>
      <p>In the 1990 Census for the US, of the 88,799 surnames listed, "Vanguard" does not appear. Nor does it appear anywhere in the 2010 Census of 162,252 surnames.</p>
      <p>There are too many loose ends in this story that don't tie up neatly. That's why it matters.</p>
