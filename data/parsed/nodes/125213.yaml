    <p>I have a loan document that was created in November 1991 by an attorney using an early Apple or McIntosh computer, probably a Mac SE. The computer is long gone and my attorney passed away in 2006. I think he was using some sort of business form software created for Apple. The type face in question is identical to Tahoma but Tahoma was not introduced until 1994. I'm told that Tahoma is a knock off of several other fonts that were in use decades ago and may have been created by Susan Kare or Adrian Fruitiger. Can anyone confirm my suspicions or has anyone used that early business form software I am referring to? Your help is appreciated. Sincerely, Tom</p>
