      <p>One of the biggest problems with Stiehl is that he uses a very pejorative word, “forgery,” in a completely inappropriate way. Part of the meaning of forgery is, yes, producing a copy of something. But the other part, what makes it “bad,” is passing it off as the original. A forgery is claimed to be the thing it is imitating. This does not, in general, happen with fonts. Everyone agrees that Dutch 801 is imitating Times (New) Roman; Bitstream never took Dutch 801 and labeled it as Times New Roman to sell it as the original. So “forgery” is a totally inappropriate word to use, in English.<br>
      It is as if somebody made by hand a copy of the Mona Lisa, clearly labeled it as a copy/imitation, and somebody else accused them of forgery just because they imitated it. Utter nonsense.</p>
