      <p>April 2006.</p>
    <p>  The Latin Letters Biennial 2006 is pleased in announcing the 70 works selected by the jury during days April 2-3 in the city of São Paulo, Brazil. The members of the jury wanted to emphasize the remarkable advance in the quality of the 427 received works. In this context the important growth is evident that has had our discipline in the region.</p>
    <p>Thanks to the Judges of the Letras Latinas Bienial 2006.<br>
    Francisco Calles Trejo (*)<br>
    Luciano Cardinali<br>
    Juan Carlos Darias<br>
    Priscila Farias<br>
    Rubén Fontana<br>
    Vicente Lamónaca<br>
    Candelaria Moreno<br>
    César Puertas<br>
    Rodrigo Ramírez </p>
    <p>(*) A Few days before the moment of the oath, Francisco Calles Trejo informed the organization of the Biennial that unfortunately he could not travel to be present at the moment of the oath. As opposed to this situation, the organization decided that Luciano Cardinali would occupy the place of the eighth juror, and Francisco Calles Trejo would be the ninth juror, sending their commentaries and decisions electronically.</p>
