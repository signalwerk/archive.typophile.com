    <p>I am designing an introduction piece for the website, which is basically a 900px x 200px image that should quickly explain what the site is about. </p>
    <p>This is what I got so far, scaled down to fit typophile's 590px width:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/banner-1_5840.png"></div><p></p>
    <p>I'd like to understand if it is clear what the intro is about. Specifically, that it is meant to be read from left to right as a timeline. Or should I add some visual aids to help guiding the viewer through the flow?</p>
