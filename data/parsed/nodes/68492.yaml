      <p>Thanks, guys. I appreciate the feedback.</p>
      <p>Ben, what I was trying to do was to show how the timestamping augmented and fit into a typical creative process flow. It is really a smaller part of the process, and I am concerned that putting it front and forward may assign it too much importance, and that would rub people the wrong way.</p>
      <p>I do agree with you that having whole five items to read through might be a bit too much for an average Internet Speedy Gonzales. I was considering employing an animation to reduce the number of simultaneous on-screen items, but then the animations are harder to get right than a static banner.</p>
