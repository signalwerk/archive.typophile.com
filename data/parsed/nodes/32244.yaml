      <p><em>does that jive with your “infinitely adjustable”?</em></p>
      <p>It’s true that there is a “benchmark” outlining weight for Softmachine, which corresponds to the closest distance between characters, carried through for internal counters — and this stroke weight has to be set by eye for a specific type size (not without its benefits, for instance making it easy to give the type outline exactly the same stroke weight as rules). Nonetheless, the typographer has the option to choose absolutely any stroke width, for whatever reason, and there are other thicknesses which might suggest themselves, such as the distance between vertical strokes in the letters h,m,n and u. Ultimately, for whatever reason a typographer is outlining some type, such as to get it to stand out against a disruptive backround, the way of working is to adjust the stroke weight till it looks right, and that’s why stroking is the best way to handle outlining, not layered weights.</p>
      <p>I might also add that the kind of gradient filter effects (bevel, dropshadow) in the garish “gel” specimen I posted above work on plain, not layered type — and while this was not my initial anticipation of the type’s use, its suitability was obvious early on.</p>
      <p>Layout application-generated outlining was behind this type from day one, because I’ve always considered that to be a much better way to apply special effects to type, rather than layering differnt fonts — in fact this “best practice”, initially developed as a faux feature of WP programs in the 1980s, was then introduced as a formatting utility via Quark Xtensions (Xtensis etc.) and add-on Photoshop filters (eg Alien Skin) in the early ’90s, before it was “hard formatted” into the default menus of Quark, Photoshop, Fireworks, InDesign, etc. So that’s what I’m playing to, not layers, which is a sort of do-it-yourself technique from the late ’80s.</p>
      <p><em>the authorship of the rounded type</em></p>
      <p>Rounded letterforms are not a typographic invention, but an imitation of other media.<br>
      This could be said of a lot of typographic features, but it’s important to distinguish the metrical-system dimension of type as being uniquely typographic, and that’s the design space Softmachine addresses.</p>
      <p></p><div class="imageWrap"><img src="/files/Round_6107.png"></div><p></p>
      <p>This is the first rounded type I am aware of, from an 1830s specimen of Caslon &amp; Livermore, presumably derived from brush lettering. Other non-typographic inspirations of rounded lettering are the “Speedball” nib, quite literally a rounded shape on the end of a pen nib, in the late 19th century. There is also neon signage, and Breuer’s tubular-framed armchair, both introduced in the 1920s. And the ball-point pen (Biro, 1940s) and Rotring + template (1950s).</p>
      <p>In criticizing my use of rounded letter shapes and terminals as unoriginal, you may be confusing form with function, which sets the bar impossibly high for originality, as everything looks like a bit like something else. The purpose of Softmachine’s rounded terminals is to facilitate outlining — by allowing an even stroke between characters, and by minimizing the opportunity for pointy artefacts that occur when corners are algorithmically enlarged: this is my claim for originality.</p>
      <p>Surely this principle — function not form — is something you can understand from your experience with design patents?</p>
      <p><em>your design effort was far less than his, no offense ok?</em></p>
      <p>None taken. I’m in two minds about the “design effort” of the person who produced that Caslon example. Sure, it was swiped from the signwriters, but the type designer had his own problems in making the concept work typographically, in terms of fit and colour — things which signwriters, working large and custom, could easily fudge. At any rate, the concept of a rounded type must have been quite outrageous at the time, <em>highly</em> original, shall we say. But how does that discount the lesser, though quite specific, originality of my repurposing of roundedness?</p>
