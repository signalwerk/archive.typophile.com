      <p>Dan, sometimes it is fun to be drawn in to long nights and obsessive sessions, other times it is not. If the passion of type is in you, I tihnk you should indulge them occasionally. Just like excess, moderation is only healthy in moderation.</p>
      <p>Some nights, I am up until 4:30 am, when I’ve got to bright-eyed and bushy-tailed at work in 3 1/2 hours. If I am enjoying AND productive AND have the mental acuity to make that time worthwhile, I think thats good. But I can’t do or recommend it everyday. Everyone has their limits.</p>
      <p>Keep in mind, this is supposed to be largely for fun for me.The dry work and the file wrangling is a side affect of trying to make something impressive enough to appear as viable product to others. IT isn’t the type design at all.</p>
      <p>If I am kerning accents for a language I don’t speak, or tediously working round a clumsy part of a software-work flow by manually repeating an action, I tend to call it quits earlier. I can usually do that stuff far faster when I start my work period, and my mood will be better, too.</p>
      <p>If you have a girlfriend, make time for her. If you don’t want to, and you’d rather do type, why are you (hypothetically) dating? If you are certain about type, think about what you want to get out of it. “Name in lights”, a paycheck, the respect of peers, mad experiments, a teaching job, some  cultural impact, what? Each of those requires a different level of commitment. Or, more precisely, different commitments.</p>
      <p>As far as the earlier comments about creativity under deadlines: A deadline helps to separate the wheat from the chaff asap, when a goalless creative exercise might otherwise drag on, hindering following ideas. Additionally, creative solutions often come from the limits in place from a client. “Deadline” creativity’s productiveness compliments abstract creativity’s loftiness.</p>
