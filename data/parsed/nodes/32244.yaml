      <p>Dan, you are still completely on-base with this question IMO; on a good day I can break a sweat teaching, but producing a typeface is just really really time-consuming ; )</p>
      <p><em> Hiro – And from the description you gave of vector stroking, can’t that be applied to any class of type?</em></p>
      <p><em>Nick S – ...initially developed as a faux feature of WP programs in the 1980s, was then introduced as a formatting utility via Quark Xtensions (Xtensis etc.) and add-on Photoshop filters (eg Alien Skin) in the early ’90s...</em></p>
      <p>I was so appalled by seeing badly outlined versions of Futura in the early ’90s that I went and drew up my own version of Futura Inline (– a face that had existed in metal, but had not been digitised or included in any of the standard foundry libraries of the time). </p>
      <p>I agree wholeheartedly with Nick for attempting to save people from the visible end results of their own ignorance, viz. <em>minimizing the opportunity for pointy artefacts that occur when corners are algorithmically enlarged</em> and so forth. In that my little effort (a single weight of display caps, neither infinite nor adjustable) was not as intelligent or as elegant as Nicks, means that it was a labour of love rather than a commercial effort. No harm in that; I did it for the sake of the thing itself. All it meant was that for a while I would rather have seen it finished than sleep or eat.</p>
      <p>It doesn’t suprise me at all to hear that Robert Slimbach works as hard as Thomas says he does; may his stamina continue unabated (and yours, Thomas, and yours, Miguel)!</p>
