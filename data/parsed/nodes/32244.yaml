      <p><em>it seems like this is not true, since the layering of purposefully-spaced weights is effectively the same as outlining.</em></p>
      <p>But it is true, because layering is a quite different process than outlining, requiring overlpapping text boxes or layers, which are much more of a hassle to work with than creating an outline by applying a stroke value. For instance, if you decide to edit the text, or adjust the size, or kerning or tracking in a layered setting, you have to do so in each and every layer, and that multiplies the confusion between stroke and fill button choices. There may also be problems with layer alignment, caused by the layout application’s interpretation of character placement. Furthermore, layering is not infinitely adjustable, whereas stroke width is. These are significant practical differences. </p>
      <p>And finally, the lower case character shapes and general proportions of Softmachine were designed specifically to accomodate an outline stroke of precise thickness.</p>
