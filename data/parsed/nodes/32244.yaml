      <p>Leslie Cabarga’s Logo and Lettering book has a nice albeit brief summary about the hours many of the font designers including me invest in working. Page 235 - I, Designaholic section . . .</p>
      <p>Personally I have 3 full workdays when the kiddos are in school and they run from 8:30 till 5:00 with a 20 minute lunch. On the other days, I’m checking and replying to e-mail about every 2-3 hours or so and making or taking phone calls throughout the day else I’m pre-planning my workload for my full workdays. Some evenings for 2-3 hours after the kids go to bed are spent working as well if the mood strikes me.</p>
      <p>It’s not optimal in terms of my desired output of work or the required focus of fontmaking when you’re in the groove so to speak but I’ve lowered my expectations of the quantity I’m able to produce a bit and am pleased with what I am able to produce. I’ve also spent time delegating work that I feel doesn’t require my expertise which explains all the phone calls.</p>
      <p>Overall, the family thing is a much bigger deal for me so it deserves my primary focus and everything else can fall out of the time not spent with my family.</p>
      <p>Stuart :D</p>
