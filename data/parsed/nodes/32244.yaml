      <p><em>the effort/robustness axis: layering.</em></p>
      <p>If a variety of weights were provided for layering, people would use them with the outline tool, as that’s far simpler.</p>
      <p>The beauty of using the outline tool is that experimenting with different stroke weights and tracking is so simple. This file took me a couple of minutes (and that includes experiments not shown), whereas with layering it would have been a pain.</p>
      <p></p><div class="imageWrap"><img src="/files/Outlines_4031.png"></div><p></p>
      <p>Here, the top four vary the stroke weight against one tracking value, the bottom three vary the tracking against one stroke value.</p>
      <p>The second example is the benchmark stroke thickness (note how the line continues into the counters of “s”).</p>
      <p>The stroke thickness of the third example is not that great, but there are nonetheless still many good ways to stroke and space the face.</p>
      <p>I had considered providing more weights of Softmachine, optimized for different stroke thicknesses, but a single font didn’t seem like such a bad idea for starters. I put the “extra” work into providing an alternate stylistic set, and full Latin script support, rather than more weights. To return to the thread topic, it was enough work making one font — it’s unlikely I’ll do any more extensions of this typeface (famous last words) unless they’re commissioned, or it becomes wildly successful.</p>
      <p>BTW, I just noticed that InD turned off contextual alternates in the bottom example (reverting to the default “l”), which is tracked at +70. InD made the change between +21 and +22.</p>
