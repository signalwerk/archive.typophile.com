      <p>My full-time job and commute subtracts 11 hours from my day (for the timebeing anyway). I have a wife and 2 kids but they are not young and all-consuming like they used to be :-)<br>
      This leaves me some amount of time for sleeping, eating, etc. I play tennis a couple of times a week and take voice lessons. All the rest is spent designing type, not because I have to but because I want to. I would love to be able to spend 12 hours a day designing type. I enjoy the time I do get to now. Since I am retiring in June, I will have more time to give it a go. Dino is right, as is James Montalbano of your 12 hour quote, designing type is a passion, not a job. Those who are not passionate about it probably won’t do it for very long.</p>
      <p>ChrisL</p>
