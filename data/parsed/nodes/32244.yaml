      <p>Yeah!, that’s exactly what I’m talking about Nick. Like in every other field of design there are those who break new ground and then those who follow (or worse). It’s the authorship of the rounded type which is at one end of designing type and then there is your Softmachine which is at the other end. You know what I mean?</p>
      <p>The guy who created rounded type poured his whole being into breaking new ground in the design of type (and I imagin also that his designs spoke of his time, ie Bayer and the school of Bauhaus). So when you came up with your Softmachine your design effort was far less than his, no offense ok? And from the description you gave of vector stroking, can’t that be applied to any class of type?</p>
      <p>Nick, I hold many copyright designs and several industrial design patents. I was given my first architectural award when I was twenty-seven and was then labelled avant-garde and a visionary. I know first hand (as did my father before me) the price one pays to give their life to design/art. And from what I’ve been able to find out about the masters in the design of Type - so did they. They would rather design than eat.<br>
      And since I have just recently been involved in the design of Type I have done a couple of font designs (which are no big deal) and I’m currently working a bold new method of script type, which I think is a big deal - although somewhat unusual.</p>
      <p>Dan’s question of commitment is not so black and white, because as I mentioned before to tweek someone elses work is one level of design commitment - and to come up with new forms is an entirely different level of commitment to the design of Type. </p>
      <p>_________<br>
      Hiro</p>
