      <p>This is getting too off-topic, but...</p>
      <p>&gt; layering is a quite different process than outlining</p>
      <p>Mechanically they’re different, but the result is pretty much the same; a graphic designer is simply given a different way to do a very similar thing (and what else is new?). The advantage of outlining is indeed convenience, but: layering isn’t as complex as you describe - all you need is to copy-paste the text box in place and change the font (assuming a set-up like Advert Rough where the fonts are spaced with that purpose); multiple weights allow the designer to design the outline, not leave it to a dumb algorithm; and the different weights provided in a layered scheme are: more fool-proof, in that a user is much less likely to apply tracking to a fatter version (since in layering the fonts are canned while in outlining they’re sort of made by the end-user anyway) thus ruining your careful spacing; and being available as different weights, are more... convenient!</p>
      <p>&gt; layering is not infinitely adjustable, whereas stroke width is.</p>
      <p>True, but:<br>
      1) It’s not hard to provide a finely gradated weight range.<br>
      And hey, people will think they’re getting more for the money.  :-)<br>
      2) There’s an upper limit to how much outlining one would use: beyond a certain point there’s no whitespace left between the letters, so your scheme becomes moot.</p>
      <p>&gt; the lower case character shapes and general proportions<br>
      &gt; of Softmachine were designed specifically to accomodate<br>
      &gt; an outline stroke of precise thickness.</p>
      <p>?<br>
      How does that jive with your “infinitely adjustable”? And how does a user know what that precise thickness should be? Don’t tell me you expect graphic designers to pay attention... and then actually follow advice to boot!  :-/</p>
      <p>Anyway, don’t get me wrong, outlining is probably a more cost-effective way of getting typically-desired results, but it does seem to be more brittle (opposite of robust) and less powerful than layering.</p>
      <p>hhp</p>
