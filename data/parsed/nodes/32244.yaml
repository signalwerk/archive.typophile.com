      <p>I find it’s different when I’m working on commissioned work vs. my own retail work. I think to some degree, having a commercial project “forces” me to be creative and meet deadlines, generally working 10+ hour days during daylight hours.</p>
      <p>On the other hand, with my personal projects, it’s only the creativity that is tough to come by. I can sit at the computer day and night only stopping for brief periods of sustenance when the creativity is there. </p>
      <p>Joe Kral is a man who can work in fontographer with the stamina of a marathon runner.</p>
      <p>In my opinion the quality of a type design is equal to the time put into it.</p>
