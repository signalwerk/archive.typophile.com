      <p>I recently finished two sans serif typefaces in 7 weights each, roman and italic, plus a serifed text face — basic four styles — all original from scratch, for a newspaper, in four months. Launching in May (so no jury decision on quality yet). Sixty-hour weeks, but it was winter, and a once-in-a-lifetime opportunity. My “Guardian”, as it were.</p>
      <p>Next step is to extend them for general release in OpenType with CE, Greek, Cyrillic, small caps etc., which will take much longer — especially as it’s not commissioned, paying work. </p>
      <p>So that’s the context. Adobe first, and now Microsoft with the CT fonts, have raised the bar for character count and OT features, and what constitutes a “quality” typeface that’s ready for market. And then there’s hinting... It’s harder and harder to do it all yourself.</p>
