    <p>I was just reading the Myfonts.com March 2007 Rising Stars newslettter, and I happened to see the following quote from Rebecca Alaccari of Canada Type:</p>
    <p><cite>Both Patrick and I put in an average of 10 to 12 work hours a day, 6 days of most weeks.</cite></p>
    <p>Damn. I also saw a recent post where someone mentioned if you couldn’t sit in front of a computer for more than 3 hours at a time you probably aren’t cut out for the type design business.</p>
    <p>So what’s the scale? What’s reasonable? I understand that it takes a long time to create a typeface, but there’s got to be a line somewhere. All work and no sleep or play makes Dan Gayle a grumpy mean person with bad hair and no girlfriend.</p>
    <p>What do you think is typical for the industry?</p>
