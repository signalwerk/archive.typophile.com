      <p><em>Nick, try selling complete sh*t - and you’ll quickly get to the truth of “…being my own boss enables me to design whatever the f*ck I want,” . Nice rhetoric, but that dog won’t hunt.</em></p>
      <p>While I wouldn’t categorize any of my work as complete sh*t, things don’t always turn out as expected, and following an idea for a typeface to its conclusion doesn’t always result in what I would consider great usability. However, I’m not the one who ultimately decides on usability, and the classic example of that is the art directors who take micro type (Bell, Freight Micro) and use it in completely the “wrong” way, huge. </p>
      <p>As a business model, I subscribe to the notion that I should make many fonts, and have many distributors. Potentially, my market is over half a billion computer users, and the internet reaches worldwide. So, according to the “long tail” theory, there is always someone somewhere who will see something in the obscure end of a product line, and the outcome is that the big sellers don’t account for the majority of sales. Surely the Long Tail theory is borne out by the proliferation of foundries at Myfonts?</p>
      <p><em>And I didn’t see anything important/original with your Softmachine - sorry bro, it’s a commercial bastardization of great work done way back. And we’re now getting to the truth of ‘The business of Type’.</em></p>
      <p>I’m sorry you are so jaded that you fail to recognize genuine originality. As far as I am aware, nobody has previously made a font specifically for digital outlining, despite that effect having been around twenty years; and no type designer has used contextual alternates to optimize the appearance of stroking. These features may not be a big deal, but they are original. Yes, it’s “commercial”, but aren’t all published fonts (except freeware) — so that’s not much of diss. And bastardization? Well sure, I didn’t invent rounded type! — but I drew Softmachine from scratch, not based on any particular model. Would you care to mention the sources which you think I ripped off? </p>
      <p><em>If you want to design an important/original typeface, then design of our time. Show something of ourselves never seen before. And that will involve putting Type ahead of business.</em></p>
      <p></p><div class="imageWrap"><img src="/files/soft462b_3915.png"></div><p></p>
