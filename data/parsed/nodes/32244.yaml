      <p>Dan I think you’re referring to something called the ’work/life balance’ here, and it’s something that artisans and craftspeople of all stripes generally have a difficulty with. It might sound awful, but there are any number of ’personal lifestyle coaches’ out there who will take your money in return for telling you not to work so late into the night...</p>
      <p>I used to work very hard all day, every day, when I was a freelance designer; I still work hard, but nowadays I’m more interested in having a workload that’s compatible with my life. Having said that, a particular project like a typeface deserves to be worked on intensively.</p>
      <p>If you’ve set yourself a personal deadline about finishing or releasing your type design, whilst meeting your other commitments, then pulling a string of all nighters is probably the only way it’s going to get done.</p>
