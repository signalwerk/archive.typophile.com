      <p>The windows in your picture don't look that dark. Or are there different windows not pictured?</p>
      <p>Unless the bulk of the traffic passing by is pedestrian, I think the logo is too difficult to read from a car, even at slow parking lot speeds. I think a normal, not extended face will be more legible in that case. If it's a clean, modern, mid-twentieth century feel you're after, how about Futura or Neutraface--though surrounding business might go the same route.</p>
      <p>I do suggest talking to a legitimate designer. If you are upfront about budget restrictions, but also open to making an investment in your business, most independent designers should be able to work with you.</p>
      <p>Good luck.</p>
