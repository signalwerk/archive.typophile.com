    <p>I posted a little while ago about my salon logo. I finally decided on a logo and had it refined.<br>
    However, a friend mentioned a few things about the logo that were 'off' that I hadn't even  noticed.<br>
    My area is undergoing a revitalization of midcentury modern buildings. The area is starting to have a downtown lofty feeling.<br>
    The salon is modern..clean lines. Fairly simple. No fluff. I wanted it to appear unisex..not girly or flowery like some salons. I have a full clientelle- not looking for clients but I plan on hiring two stylists and hoped the salon would appeal to variety of people.<br>
    This is getting wordy. I don't want a "bunch of blue haired shampoo set" people working there..<br>
    photos of the salon if you're interested - <a href="http://share.shutterfly.com/action/welcome?sid=9AZMWrZw3asWu" title="http://share.shutterfly.com/action/welcome?sid=9AZMWrZw3asWu">http://share.shutterfly.com/action/welcome?sid=9AZMWrZw3asWu</a> </p>
    <p>The logo-</p><div class="imageWrap"><img src="http://typophile.com/files/png_4759.png"></div><br>
    The logo is on a black background ***only because I have dark windows and they kept giving me black lettering**** My sign guy said he could extract the logo from the black background since it really isn't part of the logo. The windows aren't black anyway, just dark.<p></p>
    <p>She suggested stacking the words..since there is no heirarchy- ? I want people to know the name of the salon but I also want them to be driving by and go "oh a salon".<br>
    I wish I would have had her do the logo but she's so busy.. </p>
    <p>I used an online company for the logo. It was a horrible experience - not sure I can mention the name here but it wasn't ebay. Local companies were out of my price range..maybe because it's Scottsdale. And by that I mean over 1500.00. NOT that they aren't worth it and good for them because they are obviously getting it. I just couldn't swing that. </p>
    <p>So- having said all that- you won't hurt my feelings if you tear it apart...much. :)</p>
