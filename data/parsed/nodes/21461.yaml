    votes: null
    html: <p>As far as the overall feel - I think you are hitting it. Simple and clean on black is very upscale salon looking. As far as the naming goes Have you thought about something a little more concise. Many salons that are hip trendy have simple one word names (we have one here called hotlocks for instance) But you could go even ironic - something like flirt or stomp that has an attitude quality.  I wouldn't even have all that descriptor going on everywhere. I would assume that if you are like most high end salons 75% at least of your business is word of mouth referrals. Therefore being too over the top with signage isn't going to do you good (stay away from the FAUX NAGLE CLIP ART!!!! ARGH!). Instead use the sign to set the tone of what you are trying to accomplish from a brand standpoint. Tying your salon name to a location (ie downtown) makes it difficult if you ever wantto move/expand.The mark itself is what it is - two squished letters which can work in a pinch. My thoughts with salon and beauty marks is can you see a guy named Sven wearing the logo on a crisp black t-shirt as he gives you a color rinse (think Vidal Sassoon). I actually did a brand with a similar feel for a plastic surgeon (called IMAAGE - <a href="http://www.myimaage.com" title="www.myimaage.com">www.myimaage.com</a>). On the typeography I would pick one word to play up more than the others. I would at least remove the SCOTTSDALE from the name. If you want to really get the hip upscale urban feel what about metro?</p>
