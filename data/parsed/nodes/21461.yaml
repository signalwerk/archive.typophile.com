      <p>If you want to look up-market, how about a simple wordmark? It might suit better than generating a mark you're not entirely happy with. I agree with Tiffany's earlier post that you should steer clear of a playful approach. </p>
      <p>It seems to be heading in a more upmarket direction with your latest iteration - not quite sure about the skyline, but maybe if you picked a rich, solid colour and relied on the typography alone, it would give you the upmarket feel you were looking for - certainly the logotogogo or whatever that did the first logo missed the mark.</p>
      <p>It was really great that you posted the photos because it gives a feel of your salon and it looks contemporary and upmarket from the interior alone - i think it looks almost European somehow, it seems nice and refined. Your logo is important because it has to sync with the environment it's got to work in.</p>
      <p>Maybe look at a sans-serif typeface that isn't so Art Deco - I'm not quite sure that the Art Deco fits with the image your salon portrays. It could be something as simple as Helvetica or DIN, or a condensed Akzidenz Grotesque. If you wanted something with more to it, slab serif such as Serifa might be a good way to go. I really think a more minimal approach would suit your salon. I wouldn't be afraid of a thin typeface - if you use it on its own as a wordmark, you could make the type larger. If you use really heavy weights of type, it could cheapen the look.</p>
      <p>Si</p>
