      <p>Hughfire-<br>
      My licenses and advertisements (yellow page)ad are all under "downtown..." I've been in the downtown scottsdale area since 1990. I don't plan on moving anytime soon but I did consider that when I chose the name. We're on Miller Rd and I thought perhaps I would just name the salon with Miller in the name. Too specific though even if I decided to stay in the downtown area.</p>
      <p>We were "Nails,Etc" (purchased a salon that we worked in) and kept that name forever. We did nails and some tanning but no hair. My business partner moved out of town in January and I kept the space, totally remodeled and added hair stations. I knew that hair people wouldn't want to work at a "nails,etc". Frankly, no one likes to be "etc". So I chose Scottsdale Salon - which was taken. Scottsdale Hair &amp; Nails...and figured I would still answer the phone "scottsdale salon". It was approved by the city and state and then the State Board of Cosmetology said it was too close to Salon de Scottsdale and I needed to add something to it. I was there, doing the final paperwork so I made some quick phone calls and came up with the "downtown". My yellow page contracts were due and I had to renew my licenses with the new name so I was pretty much stuck. </p>
      <p>It's an established salon and you're right about word of mouth..that's where most of our clients come from.<br>
      Honestly I thought that if I could get a cool enough logo, the long drawn out name wouldn't really matter. It would be just a formality...because of what we need on licenses and such. </p>
      <p>Btw, your imaage design is very cool. Also- love the name "metro"..but like I said..</p>
      <p>Our old name was horrible- or so I thought...as far as a coolness factor but for advertising- great. When people called information looking for a nail salon in scottsdale, ours was first to pop up. When a stylist is building a clientelle it's great for obtaining new clientelle. </p>
      <p>I have to admit, there are times when I think "gah! I hate it all!" and think about starting over. It's just been a long road with the remodel and then getting a decent logo has been an effin' nightmare. I've approved the final logo and now I have to go back and at the very least, make the changes that were mentioned on this forum. </p>
      <p>I had company for over a week and I was glad to live in complete denial of the whole mess...but now I have to get busy. This has been dragging on for 8 months.<br>
      I've put off hiring anyone or even placing an add to hire because I want the signage and branding done.<br>
      I wouldn't want to work in a salon that was half done so I don't expect anyone else would want to either.<br>
      See? Here it comes..."gah!...."</p>
      <p>Perhaps it's more of a therapy issue than a logo issue...:)</p>
      <p>I appreciate all the comments and feedback. Thanks so much.</p>
