  html: |-
    <p>Usually I don't have any problems with FontExplorer, but mysteriously when I use Kennerly in QuarkXPress, only the Roman version appears, not the Italic nor Bold, although all are activated. I tried to redo this layout in InDesign CS2 (in which I am rebuilding ALL of my layouts), but now Kennerly will not obey there either. Should I try and split the font suitcases apart, as was suggested in earlier forums? Anyone have a better font management utility?</p>
    <p>Thanks.</p>
