    html: |-
      <p>First step for determining the source of the problem: do the fonts load in TextEdit?</p>
      <p>If so, it is probably the application that is the problem. Try placing the fonts in the Libary &gt; Application Support &gt; Adobe &gt; Fonts folder and launching InDesign again.</p>
      <p>If not, it is probably the font manager that is the problem. Try placing the fonts directly in your [user] &gt; Library &gt; Fonts folder.</p>
      <p><a href="http://typophile.com/node/30240" rel="nofollow">More on font managers.</a></p>
