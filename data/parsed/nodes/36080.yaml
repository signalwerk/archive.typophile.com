    html: |-
      <p>One option:</p>
      <p>Create 3 layers (as you’ve done).</p>
      <p>Top is as-is.</p>
      <p>Second layer is stroked with white at a rather thick line weight.</p>
      <p>Bottom is as is (moved at the 45 degree angle).</p>
      <p>It will give you a similar effect but the ’shadow’ will float more.</p>
