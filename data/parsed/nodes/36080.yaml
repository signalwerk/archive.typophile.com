    <p>I am trying to do a perfect shadow on a Neutraface-wordmark.</p>
    <p>Its meant to be old and classy, trustworthy and honest.</p>
    <p>I have NO idea on how to do this. Has anyone got examples of this executed well with this type of font?</p>
    <p>Ive just pasted the default one with shadows, then copy and move 45 degrees.</p>
