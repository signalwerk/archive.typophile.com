    <p><strong>Hello Typophiles!</strong><br>
    --------------------------------------------------<br>
    We are proud to announce our new release!<br>
    --------------------------------------------------</p>
    <p><a href="http://www.myfonts.com/fonts/tipotype/logomotion/" rel="nofollow"><strong>"LOGOMOTION"</strong> by Fernando Díaz:</a> a typeface specially designed for logotypes, but can also be used in headlines, posters &amp; signage. It has many OpenType feature programming, that give a more playful and rhythmic spirit, creating an interesting geometric-sans and script mix.<br>
    <a href="http://www.myfonts.com/fonts/tipotype/logomotion/" rel="nofollow"><br>
    <img src="http://ferfolio.com/files/(MAIN)Logomotion720x360_1.jpg" alt="LOGOMOTION" title="LOGOMOTION"></a><br>
    <a href="http://www.myfonts.com/fonts/tipotype/logomotion/" rel="nofollow"><br>
    <img src="http://ferfolio.com/files/Logomotion720x360_2.jpg" alt="LOGOMOTION" title="LOGOMOTION"></a><br>
    <a href="http://www.myfonts.com/fonts/tipotype/logomotion/" rel="nofollow"><br>
    <img src="http://ferfolio.com/files/Logomotion720x360_3.jpg" alt="LOGOMOTION" title="LOGOMOTION"></a><br>
    <a href="http://www.myfonts.com/fonts/tipotype/logomotion/" rel="nofollow"><br>
    <img src="http://ferfolio.com/files/Logomotion720x360_4.jpg" alt="LOGOMOTION" title="LOGOMOTION"></a></p>
    <p>Available in <strong>MyFonts</strong>, and as allways: <strong>40% OFF for Latin Americans</strong> on TipoType, and a lot of typefaces to come this year... Hope you like!</p>
    <p>----------------------<br>
    Best Regards<br>
    <a href="http://www.tipotype.com" rel="nofollow"><strong>TipoType.com</strong></a></p>
