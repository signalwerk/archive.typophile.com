    html: "<p>Hey June, <br> <br>I think the best you can do is read some books on the subject. <br>There are some wonderful specimens out there. <br> <br><i>Elements of Typographic Style</i> by <b>Robert Bringhurst </b>is the first that comes to my mind.  <br> <br>Amazon link: <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0881791326/qid=1076442246//ref=sr_8_xs_ap_i1_xgl14/104-0860516-9368748?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0881791326/qid=1076442246//ref=sr_8_xs_ap_i1_xgl14/104-0860516-9368748?v=glance&amp;s=books&amp;n=507846</a> <br>I think it's a very nice introduction to the wonderful and weird world of typography. <br> <br>Also, a large number of outstanding typographic books can be find on this site too; see: <br><a href=\"http://www.typophile.com/books/archives/1%20Essentials.html\" target=\"_blank\">http://www.typophile.com/books/archives/1%20Essentials.html</a> <br> <br>Oh, and don't start too early with those pesky computers... There are some nice \"manual\" ways to start a typography student's career...</p>"
