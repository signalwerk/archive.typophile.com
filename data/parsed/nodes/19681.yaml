      <p>I would be very (positively) surprised if FontExplorer for Windows enables system-wide font activation on Windows. I think it's unlikely for the reasons described above: Mac OS X has a mechanism to notify other applications if a font is requested, Windows (neither GDI nor WPF) does not have such a mechanism. </p>
      <p>Adam</p>
