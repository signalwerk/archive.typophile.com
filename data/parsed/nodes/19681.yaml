    html: |-
      <p>There are really two types of auto-activation. In some cases an application can communicate directly with a font manager. For example, Suitcase Fusion uses Quark and InDesign plug-ins to read font information from the file and comunicate those requests to the parent application. If there is enough customer demand, this functionality could be added to a Windows font manager. The other type of auto-activation is the system-wide auto activation provided by ATS_Server on the Mac. Mac OS has a separate process for each user that handles font functionality. There are programming interfaces provided by Apple that make font activation possible. Basically, if any application requests a font that isn't active, a font manager can be notified and turn it on. On the Mac, this doesn't require the application developer to do anything special. It works in Word, for example. </p>
      <p>There is a certain amount of complexity involved with this sort of functionality, and like any feature, it can create issues. With Microsoft, my guess is that the potential hazzards outweigh the benefits. It might be expensive or difficult to make a system that is backward compatible with existing applications, and it could introduce security risks. My guess is, there are very few users who would switch to Windows if they added it....</p>
