    html: |-
      <p>Thanks for the input Simon and Carl,</p>
      <p>Simon, your reply is what I've run into before, but it doesn't recognize that this sort of interaction between app and OS is possible on the Mac now. My question was to the fact that if it is available on the Mac, why not the PC?</p>
      <p>Carl addressed this, but it still doesn't make sense to me (by that I mean my ignorance has not been defeated quite yet). If plug-ins are available on the Mac for Quark &amp; InDesign (and others) to communicate with the font manager (in this case, Fusion or FontExplorerX), then isn't the same sort of plug-in possible on the PC? As for backwards-compatibility, the average user likely doesn't need a font manager, let alone auto-activation, and I'd be quite happy if this feature only worked with InDesign CS/CS2 as that's the only place I'm eager to have it.</p>
      <p><em>If there is enough customer demand, this functionality could be added to a Windows font manager.</em></p>
      <p>I've sent a few notes to Extensis in the past, with no response, but clearly my request doesn't amount to "enough customer demand."</p>
      <p>In the end I suppose this is, indeed, a "special-interest" issue, as I know I'm in the minority on my old PC, so I can't well expect quick solutions. The Linotype manager has frustrated the issue by hinting at an auto-activation-capable version for PC, and I suppose it's a combination of envy and impatience that led to my post.</p>
      <p>Dan, you out there? Can you confirm if FontExplorer for PC is going to have auto-activation? I won't ask for a release date because I know that's taboo, but perhaps you could speak to the issues that have held auto-activation back from the PC.</p>
