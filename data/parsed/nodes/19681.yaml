      <p>How do you define auto activation? I assume you mean that if an application requests a font that's not installed it would be automatically installed? As far as I'm aware this would require some intelligence in the apps - the system itself just falls back to a default font in this case, and I think it's close to impossible for a font manager to insert itself between an app and the OS in this way - this wont change with Vista.</p>
      <p>Cheers, Si</p>
