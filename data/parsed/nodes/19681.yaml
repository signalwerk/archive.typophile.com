    <p>Can anyone give me a simple answer as to why there are no font management tools for Windows that can auto-activate? I've heard bits &amp; pieces about this, and have heard rumors that if Linotype ever releases Font-Explorer for Windows it might include auto-activation, but I don't understand why there seems to be nothing of the sort at the moment.</p>
    <p>What's the deal?</p>
