      <p>New Vintage Type: Classic Fonts for the Digital Age<br>
      by Steven Heller &amp; Gail Anderson</p>
      <p>Filled from end to end with excellent examples of contemporary uses of classic styles. I've been going through it a few pages at a time and am constantly amazed and inspired by the work shown here. Huge range of historical inspirations (mostly 19th, 20th Century)- but all new artwork...</p>
