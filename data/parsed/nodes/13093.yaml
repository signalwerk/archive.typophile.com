      <p>Two more similar fonts: <a href="http://www.myfonts.com/fonts/t26/curvature/regular/testdrive.html?s=palgrave&amp;p=48" target="new">Identikal Curvature</a> and <a href="http://www.houseind.com/index.php?page=showfont&amp;id=11&amp;subpage=viewfonts" target="new">House Chalet Comprimé</a>, especially the 1970 variant. The latter would only need a redesigned e to flip for the a, as Patty suggested.</p>
      <p>- Mike Yanega</p>
