    html: |-
      <p>There are too many possibilities for similar ’techno’ fonts for me to be convinced yet that this is a custom font. I can believe that it is customized, like flipping the a/e letters, or using an upper case i for the l (’el’). I don’t think this is the font, but see how close <a href="http://www.myfonts.com/fonts/t26/leger/regular/testdrive.html?s=paIgrave&amp;p=48" target="new">Leger (T-26)</a> would be if you flipped the a and used the u.c. i for the l.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
