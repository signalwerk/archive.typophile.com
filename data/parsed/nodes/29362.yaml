      <p>Joachim: Thank you for telling us about your exprience &amp; ideas. I know we all appreciate that very much! I hope you will stay involved in the thread and on typophile. I am sure we can benefit from your perspective. Cheers!</p>
      <p>RE: the Examples Chris posted &amp; images generally: When I have been looking at Type examples I have been preparing them in photoshop cs which has several different rendering schemes. And then there are the differences widely observed in the rendering in various OS. No doubt all of these variables will alter the subtle relationship of the glyphs. Does anybody want to suggest a standard way of doing this so that are comparisons have a rendering model in common? Maybe this is fruitless...</p>
      <p>Hrant &amp; William: I agree with Hrant's point about sticking to observations. My ideas about Notan are highly provisional and it's time to rub them smooth by testing them on real type. That is indeed what this thread was for - creating an opportunity to share real observable examples for mutual benefit. </p>
      <p>There are so many other interesting points left but that's all I can get to just now. And it's probably better to keep these posts shorter anyway.</p>
