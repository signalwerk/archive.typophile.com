      <p>Eben,</p>
      <p>The screens we're looking at are so different from printed pages, we're already in a mire as far as interpreting what we see or rasterizing things consistently. My biggest issue is that the low resolutions seriously limit the size range we can evaluate. The additional variables of sharpness, contrast, reading environment, resolution settings, these things make it a very coarse and incomplete picture. </p>
      <p>I've been wishing someone would prepare some PDF samples with text fonts carefully set as consistently as possible: three realistic, common reading sizes, good measures, good leading, consistent x-height, built-in spacing and kerning, set ragged right, adequate white space, standard layouts. If this was done with a broad selection of faces, without a foundry or esthetic bias, it would be helpful for discussions like these, as well as to people needing more information for purchases or type selection. </p>
      <p>Maybe someone could devise a template in InDesign, and various designers (with various access to different fonts) could plug new faces into it (as long as they can adjust to match the standard x-heights). Each face could be a PDF, or collections of pages could be assembled by one person.... A Typophile PDF repository?</p>
