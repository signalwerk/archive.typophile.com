      <p>Here is an example of the changes in a hairline I was talking about. And yes, I was talking about changes within the glyph, not the whole page. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/o test copy_4172.gif"></div><p></p>
      <p>Here the hairline at the top and bottom of the right character is 100% thicker than that of the left. But the area of  white space within the right counter is only 13% less than the left.</p>
      <p>Hence the need to compare the blacks, and eg. attend to how hairlines and other strokes and terminals balance within characters and from character to character. </p>
      <p>According to the book, "The Yin/Yang of Painting", in the traditional Chinese philosophy of painting, nóng dàn (notan in Japanese) is one of four balances characterizing the overall balance of yin-yang within a painting: "value (light/dark) and texture (thick/thin) to color (warm/cold) and brushwork (sharp/blurred)" which together form "a true balance of opposites."</p>
      <p>Note that thick-thin is one of these that is traditionally regarded as an somewhat independent variable, as I have noted earlier and illustrated here.  </p>
      <p>Evenness of color is an additional concept special to reading scripts, because it helps only the key cues from the letter to be easily detected, without 'noise' from other variations of dark-light.  </p>
      <p>Hrant's caricature of evenness of color as meaning reducing everything to grey is a misunderstanding of the concept. You will note that Hrant boasted about the great 'notan' in his Patria. Then he acknowledged, though, that my point about the serif on the L being too small was correct. In fact, as I said my analysis was based on 'color', not notan. The notan in Patria is generally good, but there are all kinds of color problems, IMHO. </p>
      <p>Properly understood even color sometimes promotes *greater* diversity of form, as in this case, where the L often should take the biggest serif in the font for color reasons. As you referenced, I noted in my presentation at TypeCon Caslon's variations in letter forms. What I pointed out was that some of these variations actually promote even color better than more uniformity would.</p>
      <p>The reason why the 'grey' argument misses the point is that we are dealing with strokes, not pixels sprayed over an area. The question becomes how the strokes and terminals and their weights in different parts and orientations will balance best, within the constraint of an apparently uniform average black/white density from letter to letter. A (usually assymetrical) balance of blacks within the letter is also desirable for the same reason of keeping out 'noise' that distracts from readability, and promoting easy identification of those salient features of the letter that enable words containing it to be easily read.</p>
