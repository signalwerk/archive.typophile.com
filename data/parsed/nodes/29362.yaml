      <p></p><div class="imageWrap"><img src="http://typophile.com/files/e5635e3fad5a57b7b393e7897948b890_5238.png"></div><p></p>
      <p>Albertus uses a deep cut on the L, a similar solution to the lifted leg.<br>
      I think that there is a limit to the amount you'd want to reduce the hole as that is what makes an L an L and scale comes into play, a 48pt L would, in an ideal world, be narrower than a 6pt L (if not a display cut), so I think you'd have to separate text from display in your analysis. I find your script (including the blackletter) samples are moving towards a confusion with an uppercase C.<br>
      Tim</p>
