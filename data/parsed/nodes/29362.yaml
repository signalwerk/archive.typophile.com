      <p>Chris, I am beginning to suspect that you associate Notan with a kind of tricky suspension between views. Eg - it's a drop/it's a Q. A related kind of suspension seems to be present in Shirokuro and it Dead history too.  Am I getting warmer?</p>
      <p>Here is my sample. It's derived from online renderings, scans &amp; assorted other sources. It is imperfect. Let's try to use it anyway.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/comparingforms_5749.gif"></div><p></p>
      <p>1. is a bembo revival about which I make no claim except that it has a Bemboish r. Note the 'flag' shaped flag or arm.<br>
      2. is an 'ra' from metal 72 pt Caslon.<br>
      3. is Big Caslon<br>
      4. is Univers 65 Bold<br>
      5. is Scala<br>
      6. is Lucida console<br>
      7. is Patria</p>
      <p>Let's start by looking at the 'ra' in rahja.</p>
      <p>The problem it presents as I understand it is that the flag or the r and the top of the a may look as if they are going trhe clash unless you make arrangements to avoid it. When I look at the older typefaces aI see that the 'r's arm is bigger &amp; it is the 'a' that accomodates it. When I look at Univers this sitiation is reversed to a some degree. The 'a' becomes stronger &amp; the r's arm is shorter. After that even in serif faces such as Scala this trend continues ( obviosly not all  typfaces but you get my drift I hope ) despite the fact that the shape Scala's a is quite bembo-ish. Then there is the Monospace. I threw this in because it illutrates an modern but opposite condition where the r must become more assertive to help fill the monospace. In fact it has to get a vertical serif to appear balanced! Thinking about Courier ( not shown) you have a less asserive 'r' made possible by long serifs. And finally there is Patria. In Patria I see a synthesis of a strong but not wide r with a 'shy' but un'deformed' a. Each of these is a pretty succesful example of managing a tricky balance of forms to create   Notan that works. As you compare solutions you are looking at Notan in play. </p>
      <p>I have more to say but I will leave it at that for now. Hrant thanks for rendering Patria for me.</p>
