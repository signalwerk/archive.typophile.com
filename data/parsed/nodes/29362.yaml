      <p>Eben, so can you explain to me what is your concern here with the La and ra?</p>
      <p>As I said, to me the issue is one of even color, meaning visually the same average density of black on white. </p>
      <p>Do you know Doyald Young's 'Fonts and Logos'? He has wonderful studies of the evolution of his logos, starting with hand drawn versions of standard typefaces, and then adjusting them, partly for even color of the given combination of letters. The story of the evolution of the Prudential logo is particularly revealing.  </p>
      <p>At any rate, to me 'notan' makes more sense for individual letters, where you have closed or nearly closed counters. The way Frutiger talks about it, if I remember correctly, is how the white in the inner counter relates to the white on the outside of the line. What is at issue here is whether the whites and black 'lock' as Chris put it, or 'click' as I put it, or 'become part of the page' as Cyrus Highsmith put it.  </p>
      <p>And 'color' has more to do with how the letters in mass, next to other letters. Here both the design of the letter and the spacing affects whether you succeed with even color. </p>
      <p>Do others see this distinction between color and notan?</p>
      <p>Eg, the 'notan' in Nick's two examples is the same; the color in the second one is better, to my eyes. In my Caslon La scans, all the letters have good 'notan'--they become part of the page, with b &amp; w vitality--but the color is much more even and better in the lower example.</p>
