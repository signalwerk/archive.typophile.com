      <p>[again, relaive to 'valence' ratio]: I raise the asymmetry thing, because equal, or equivalent valence, pure and simple, might not be 'what the body needs.' I think the body needs a well-formedness of the white, though that doesn't necessarily mean geometrical well-formedness. But, perhaps the white needs a more positive valence in a coarser spatial frequency register than the black, while the black needs the stronger valience at a higher spatial frequency register or channel.</p>
      <p>And this might be because our neuro-synaptic codes for words or morphemes might have the form of compressed / compact large-cell or magnocellular encodings with specifying parvocellular (small-cell) codelets or attachments.</p>
      <p>Outside of this, dark / light (notanic) balance or equivalence might be just another term for good colour, and the dark / light of it isn't really leveraged in terms of 'what the body needs.</p>
