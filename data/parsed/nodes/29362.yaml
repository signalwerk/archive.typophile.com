      <p>HFJ's Gestalt is not significant here.<br>
      But the Hoefler Text "La" has good notan, like Caslon's.</p>
      <p>&gt; the r arm can be short</p>
      <p>1) But at the expense of its distinctiveness = legibility/readability.<br>
      2) So can the bar of the "L" (and with the same negative).</p>
      <p>&gt; we read more clues at the x-height</p>
      <p>I actually don't think this is true per se, especially not during immersive reading. On the other hand, there are indeed more clues there (and maybe that's what you really meant).</p>
      <p>&gt; There is an inevitable tension among three factors in glyph design:<br>
      &gt; diversity of form, even color, and avoiding too close proximity of blacks.</p>
      <p>I think this is about half right.</p>
      <p>&gt; it is important to keep in mind that the caps are really a different script</p>
      <p>Very good point. There is a pretty strict limit to how much you can make the two cases harmonize. The good news is that there's a lot more to type design than formal harmony.</p>
      <p>BTW, making caps too dark compared to the lc actually had a practical application: setting more attention-grabbing all-caps, out of the box.</p>
      <p>hhp</p>
