      <p>&gt;yourself are not listening to me at all</p>
      <p>Wrong. I just don't agree, and gave good reasons why. I did fuse Peter's praise of Patria with your response. Sorry about that. But if insults are your only response to carefully considered arguments, the fruits of hard work on type, then I can't be bothered to discuss type with you further, as I have probably unwisely tried in this thread. </p>
      <p>&gt;And that the white &amp; black do not shift ‘evenly’ hence a crack in the concept of Notan.</p>
      <p>I think it is a bit off too call it a 'crack in the concept of notan', as if notan in type design were a very clear and established concept and doctrine--which it is not. I wouldn't say 'crack' because that would be conceding that the concept of 'notan' is already a success in explaining a great many things. But I think it can only usefully explain some aspects of type design. I would say rather that you are trying to stretch the concept of notan to phenemona it can't really explain--including the greater impact in variation of hairlines vs of whites.</p>
      <p>What exactly about type design do you think 'notan' supposed to explain? All good design? Part of it? What part or aspect? </p>
      <p>I like the notion of 'notan' as describing what Chris called 'locking together' the whites and blacks. Or Cyrus Highsmith's description of 'becoming part of the paper instead of sitting on it.' It is indeed a very important part of good type design.  </p>
      <p>But as a general theory of type design what does it tell us? You seem to be advocating, if I don't misread you, that balancing black and white is pretty much the whole story. </p>
      <p>My arguments were to the point that evenness of color is another important consideration. The point I made about small changes in hairlines having a big impact on color is only one point. There are many more concerning color that I don't see how it is reasonable to explain by 'notan'. </p>
      <p>First of all there is the issue of consistency of blacks. The eye will pick up much more readily a variation in thickness of blacks from character to character than it will a variation in eg width of counters between the b and the d.       </p>
      <p>Second, there are all kinds of things done with terminals to give balance to a seriffed font. These are quite understandable in terms of balancing of the black of a character, but I don't see how you can 'get there from here' using 'notan'.</p>
      <p>As an example, look at a typical E--here from Caslon 540--with serifs cut off and then with serifs:  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/E Caslon 540 w and wo serifs_5457.png"></div><p></p>
      <p>If you use considerations of 'color' then the function of the heavy vertical serifs (much heavier than the horizontal) is easy to explain: they balance the character within its side bearings, so the black is distributed more evenly left and right, up and down. Without the serifs it is obviously unbalanced, as you can see. </p>
      <p>Now in the abstract, every time you change the black you change the white, so that theoretically you could give equivalent explanations with only the black, only the white, or both. But in practice the eye  feels the weight of the blacks more powerfully than the whites, so looking to that balance--even a physical balance as if they had real weight--is natural and I think likely reflects the way the brain works. And no, I am not saying that this balance excludes notan, it is just that notan cannot do all the work. </p>
      <p>So how do you explain why the serifs on the E help by comparing black and white, with no other concept? And if other concepts are needed what is wrong with 'even color' as one of them? </p>
      <p>I don't have any problem with notan as an important concept in type design. My problem is with 'notan imperialism', which wants to replace other traditional and valuable ideas, such as even color.</p>
      <p>As I said, within Chinese philosophy of art nóng dàn is only one of at least four balances; it seems to me that trying to make 'notan' do too much work in explaining good type design either broadens the concept to where nobody knows what is means, or pushes out other useful concepts.</p>
    html_clean: |-
      <p>&gt;yourself are not listening to me at all</p>
      <p>Wrong. I just don't agree, and gave good reasons why. I did fuse Peter's praise of Patria with your response. Sorry about that. But if insults are your only response to carefully considered arguments, the fruits of hard work on type, then I can't be bothered to discuss type with you further, as I have probably unwisely tried in this thread. </p>
      <p>&gt;And that the white &amp; black do not shift ‘evenly’ hence a crack in the concept of Notan.</p>
      <p>I think it is a bit off too call it a 'crack in the concept of notan', as if notan in type design were a very clear and established concept and doctrine--which it is not. I wouldn't say 'crack' because that would be conceding that the concept of 'notan' is already a success in explaining a great many things. But I think it can only usefully explain some aspects of type design. I would say rather that you are trying to stretch the concept of notan to phenemona it can't really explain--including the greater impact in variation of hairlines vs of whites.</p>
      <p>What exactly about type design do you think 'notan' supposed to explain? All good design? Part of it? What part or aspect? </p>
      <p>I like the notion of 'notan' as describing what Chris called 'locking together' the whites and blacks. Or Cyrus Highsmith's description of 'becoming part of the paper instead of sitting on it.' It is indeed a very important part of good type design.  </p>
      <p>But as a general theory of type design what does it tell us? You seem to be advocating, if I don't misread you, that balancing black and white is pretty much the whole story. </p>
      <p>My arguments were to the point that evenness of color is another important consideration. The point I made about small changes in hairlines having a big impact on color is only one point. There are many more concerning color that I don't see how it is reasonable to explain by 'notan'. </p>
      <p>First of all there is the issue of consistency of blacks. The eye will pick up much more readily a variation in thickness of blacks from character to character than it will a variation in eg width of counters between the b and the d.       </p>
      <p>Second, there are all kinds of things done with terminals to give balance to a seriffed font. These are quite understandable in terms of balancing of the black of a character, but I don't see how you can 'get there from here' using 'notan'.</p>
      <p>As an example, look at a typical E--here from Caslon 540--with serifs cut off and then with serifs:  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/E Caslon 540 w and wo serifs_5457.png"></div><p></p>
      <p>If you use considerations of 'color' then the function of the heavy vertical serifs (much heavier than the horizontal) is easy to explain: they balance the character within its side bearings, so the black is distributed more evenly left and right, up and down. Without the serifs it is obviously unbalanced, as you can see. </p>
      <p>Now in the abstract, every time you change the black you change the white, so that theoretically you could give equivalent explanations with only the black, only the white, or both. But in practice the eye  feels the weight of the blacks more powerfully than the whites, so looking to that balance--even a physical balance as if they had real weight--is natural and I think likely reflects the way the brain works. And no, I am not saying that this balance excludes notan, it is just that notan cannot do all the work. </p>
      <p>So how do you explain why the serifs on the E help by comparing black and white, with no other concept? And if other concepts are needed what is wrong with 'even color' as one of them? </p>
      <p>I don't have any problem with notan as an important concept in type design. My problem is with 'notan imperialism', which wants to replace other traditional and valuable ideas, such as even color.</p>
      <p>As I said, within Chinese philosophy of art nóng dàn is only one of at least four balances; it seems to me that trying to make 'notan' do too much work in explaining good type design either broadens the concept to where nobody knows what is means, or pushes out other useful concepts.</p>
