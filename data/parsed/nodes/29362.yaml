      <p>Hrant,<br>
      I will quote myself, perhaps you missed it the first time:<br>
      "I never said Dead History was a notanic study."<br>
      Look at the Dead History font with fresh eyes and look for something else operating there. There is a point to it.</p>
      <p>I notice that you have not posted an example either? I don't mean your own work. I won't post mine because, in all honesty, I never understood the meaning of notan in the way you describe it--I understand more now after the recent thread prior to this one. I would only say that I attempt to have figure and ground in a harmonious relationship which locks them together.  If this is called notan or not is not of much concern to me--I am just trying to make good type. Perhaps Froggy may be part of the discussion (not to say it is notanic) after someone takes a harder look at Dead History though. That is by no means to say that I think I have been successful in the execution, it just means I strive to be.</p>
      <p>If you want examples of type that I feel works towards equal importance of figure and ground, I would say Frutiger.  I don't really "look around" much. I prefer not to be influenced any more than I can help. I will also name one of the faces you hate, Bodoni--not because it is easy to read, it isn't. Just because of the positive and negative form. Legato is another one which works for me.  Most of Dwiggins stuff as well. I doubt if he ever thought about it but it was just within him. Some of the blackletter faces and Constructivist faces have it as well. I would say that Zapft's work generally does not, it is more linear an gestural.</p>
      <p>ChrisL</p>
