      <p>"And it makes no sense for there not to be a mechanism (like the one I describe) that reads things in the parafovea. Even if the limit of words is low, there has to be something else going on."</p>
      <p>Maybe not to you.</p>
      <p>The mechanism you sum up as 'heuristic guess-work’ needs to be formalized or operationalized or elaborated in perceptual processing terms that take into account the mechanisms known or thought to exist inside the visual cortex. Unless you think the heuristic guesswork happens beyond the visual cortex in some higher area of the brain. Then you need to specify what perceptual features the cerebral cortex works from, how they are assembled in the visual cortex, and what guessing looks like in neuromechanical terms in the cerebral cortex, and where it occurs.</p>
      <p>The limitations you like to believe are not hardwired are imposed by the constraints placed upon parafoveal detection due to what Denis Pelli calls 'crowding' and others call 'contour interactions' or lateral 'interference.' Study for yourself the literature on lateral interference, and study the literature on neuro-mechanical stimulus information pooling and relative receptive field densities as information moves through the visual cortex, and I believe the functional anatomical contstraints that make the limitations make sense will become apparent to you.</p>
      <p>I've claimed--in contrast to most of vision science--that the crowding in the parafovea that is anatgonistic to letter recognition in the parafoveal field serves a critical function in reading, because it biases the response of the visual cortex towards the whole, and provides some critical pre-recognitional information about it: just enough to make the selective activation of criterial letter-featural information provided by foveal vision at and around the point of fixation massively effective. The criterial featural information is set up by the black and white in concert, as is the pre-recognitional information that the parafoveal viewing extracts.</p>
