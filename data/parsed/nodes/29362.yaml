      <p><cite> Have you changed the whites? Yes, but barely—it could be less that 1%. On the other hand, the black might be increased by 100% or more. </cite><br>
      When I first read this I was shocked but then I began to realize that you don't mean in the 'gyph space' where the ratio would be 1:1 but on the page. The exact ratio of which is impossible to know but I do get your point I think. Also while I might take issue with the odd semantic issue here or there in what your saying - in general I say 'fair enough'. Go ahead &amp; build your arguement.</p>
      <p><cite> black relates to black, and white to white</cite><br>
      By this you mean thinks like stem to stem &amp; counter to counter - yes?</p>
      <p>Peter, about the valance ratio* and the asymetry: I have re-read your phrase several times now and I don't feel I have even started to understand it. Can you elborate for me? The closest guess I can hazard is that you are wondering if working for good color or 'balanced' notan is what we need on a fuctional basis for reading or if it's just a kind of related but side issue, or maybe just an artsy pleassure trip.</p>
      <p>* a relative capacity to unite or react or interact (ratio) - apparently</p>
      <p>I was saying something related earlier when I was talking to William about the 'disappearing' glyph. I had said that that some glyph sytems were easier to harmonize than others. And that the value of this harmony was lower in the sytems that were too easy. Yes, there might be Notanic balance there but it probably wasn't getting us the cue value needed.</p>
      <p>What I had meant to go on to say then was that complex notanic balances made neccesary by what might look initially like kooky glyph shapes probably add to the cue value offered by those kooky shapes. In other words the value of getting a glyph to become part of the family and stop drawing undue attetion to itself may be closely related or even parallel to the difficulty in getting it to happen. There is the O after all - it's quite a bit less kooky than an L which is mostly difficult or a double storey g which is to my mind hyper-wacky. I don't know- maybe suggesting that the power of the g's cue is stronger than the O is silly. What do you think?</p>
      <p>About 'forcing choice' - I agree with Hrant. I don't want to tell anybody what terms to use. I just want to make the case for Notan. If you a re student of type you shouldn't really avoid learning about the term color. But once you have you can choose your own tools. One - the other - or both. Everybody can ( &amp; will ) do what they want. I am hoping that by dicing the Notanic issues fine, ( after all Notan is a big idea and should not be swallowed whole! ) and showing how I see it at work that I will learn more about it and maybe make the idea &amp; it's utility more widely accessable &amp; then maybe accepted.</p>
      <p>About the parafovea, You are saying that Hrant's emphasis on it is not bourne out by the studies you have read. Is that it?</p>
