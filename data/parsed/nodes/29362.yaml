      <p>"I might talk about how that fact might be a notch against your theory of boumas being picked up in the fovea (as well)."</p>
      <p>It might be, but what you attribute to me is not an adequate characterization of what I claim. My theory is that boumas (bounded maps) are indexed in parafoveal vision and some ensemble statistics gathered about them there, with foveal vision detecting selective criterial specifying information essential to visual wordform resolution. In most cases sense-context cannot narrow down the field of possible next boumas sufficiently for just those ensemble statistics to push the probability summation to good enough certainty about identity to support sense following. Exceptions are the 60 most skipped words, which are mostly syntactically highly probable from context. 'Picking up' of boumas in immersive reading is a two-step operation--unless by picking up you mean what I've called indexing. Probability summation is by definition not an algorithmic thing. </p>
      <p>And, by the way, rods and cones are not 'street' terms for large-cell and small-cell neuro-transmitters, that is for 'magnocellular' and 'parvocellular' transmitters. The <em>retina</em> is a mosaic of rods and cones with different distributions and densities at different retinal locations. The <em>visual cortex</em> is a mosaic of large-cell and small-cell neuro-transmitters, existing in different layers of the brain, with different connectivities at different locations. Clusters of rods and cones project to clusters of neurotransmitters once they have passed through a ganglion cell layer, where they are summed and averaged. The mechanics and ratios of how many rods and cones project to how many and which neurotransmitters is a rapidly emerging area of research. How supportable your schematisms are is in large part dependant on what such research uncovers. </p>
      <p>This is tangential to the notan issue but not irrelevant to the perspectival issues predisposing you to a certain 'take' on notan.</p>
