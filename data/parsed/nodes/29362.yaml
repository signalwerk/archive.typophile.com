      <p>&gt; Shirokoru, which reminded me of State, got me thinking about situations where we can read even though there is no dominant side in the positive/negative gestalt  (Nick)</p>
      <p>I believe to remember that the Fuse series had loads of experimental fonts that challenged reading habits in one way or another or more... so I wonder whether other Fuse fonts might also hold interesting notanities in store?  Is there any place online where all fonts of the series can be seen?</p>
      <p>Shirokuro and State seem cousins (about equal amounts of black and white), though State is intersecting (using vector compounds) and thus reminds me of Shatter (for which the Letraset folks reportedly sliced Helvetica up with X-actos) -- while Shiro is interlocking, kinda like those complicated hand greetings that some dudes practice  :)<br>
      ...and that T of State is definitely "not resolved"  ;))</p>
