      <p>Chris, I prefer the metrics of the original Univers, without the kerning to the right of the r.</p>
      <p>I also think the r_a in the Big Caslon is too tight.</p>
      <p>I used to go for the tight, even look that can be achieved with kerning, but now I am more interested in the unkerned look of letterpress, especially for traditional serifed faces. I just did an OpenType version of Paradigm, which I designed in 1995, and have revised several characters and redone the metrics. In 1995 I was going for irregular shapes and reducing "excess" white space between characters by negative kerning. Now I've reined in the more frisky letter shapes (r and g no longer protrude above the x-height) and left more "interest" in the spacing. Above: 1995. Below, 2006.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LRpara_6533.png"></div><p></p>
