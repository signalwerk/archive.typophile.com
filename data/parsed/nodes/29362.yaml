  - id: 169084
    user: 1551
    date: 2006-11-17T08:42:00
    date_raw: 17 Nov 2006 — 8:42am
    votes: null
    html: |-
      <p>&gt;&gt;Hoefler Text “La” has good notan</p>
      <p>&gt;Is this because the ‘vertical’ serif creates a well for the white in the L or because the serif frames the white of the open counter of the a, or both?</p>
      <p>I don't think it is the relationship to the 'a', which is not that great anyway. </p>
      <p>You can look on the vertical serif as adding weight to the lower right quadrant, reducing the unevenness of color. Or you can think in terms of notan, and see the serif as counterbalancing the white expanse above it. Either way you slice it, it means the L leg can be a little longer and still look ok. With a sans, you are really forced to make the leg shorter, I think, as in Eben's examples above.</p>
