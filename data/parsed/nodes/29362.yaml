      <p>William: Thank you again for posting those scans! </p>
      <p>RE your question: I do think there are many differences between 'Color' &amp; 'Notan'. Here are a few ways they differ:</p>
      <p><strong>Specificity</strong><br>
      To begin, I think Color is a very broad almost sweeping term meant to encompass many variables. It is substantiually vague &amp; hard to understand precisely because it sweeps over so many aspects. It's not a useless term to people who spend lots of time with type but it does require experience to begin to be comprehensible. Notan is superficially much simpler but also more specific or precise &amp; therefore maybe a bit more useful. It's just about the relationship of lights &amp; darks. 'Relationship' is key to that phrase. </p>
      <p>Ironically Notan is even useful for thinking about bright yellow text on bright blue or vice versa where as our Typographic term Color is not. That's because unlike 'Type-Color' which is rooted in specific type history, Notan is just about lightness &amp; darkness which is an aspect of Color - in the common, or even scientific sense of the word. Notan is relationships in one Color Axis: Light Dark. Chroma, or Saturation or color intensity is another. And Hue is the last one - the color frequency eg red blue green etc. Ironically we can talk much more readily about the Notan of Bright blue text on Yellow because both colors have light &amp; dark values along with their Chroma &amp; Hue - so you can talk about the ways the relationship. In contrast, talking about the 'color' of colored text is messy for obvious terminological reasons ( which 'color' was that?) but also because of the relative imprecision of the term itself.</p>
      <p><strong>Implied Scale</strong><br>
      Color &amp; Notan also differ in that one implies something at the level of scale the other does not. Color is something you tend to be aware of or notice more broadly - like at the level of a paragraph. A single line of text cannot really be said to have color I think. Do you disagree? Maybe you can see it in a word. I am pretty sure I cannot. In contrast, Notan occurs at the glyph level, the inter-glyph level, the word level &amp; all the way up &amp; down the size scale. In type design practice I think we are most concerned with the glyph, interglyph, word &amp; paragraph levels. Graphic designers &amp; typographers are likelier to be concerned with Notan at the line, paragraph &amp; layout levels. </p>
      <p><strong>Descriptive of Magnatude ( or Not )</strong><br>
      Type-Color also refers to a degree of darkness or lightness on the page. It is to some degree quantitative. In contrast, Notan also does not refer to the degree of grey. I think it would be a misuse for instance to say: 'that has dark Notan'. Notan is not descriptive of Magnatude but to something superficially simpler - the relationship of the whites &amp; blacks. </p>
      <p><strong>Descriptive of Quality or Superiority ( or Not )</strong><br>
      The phrase 'good Color' is essential to any understanding of what is meant by 'Color'. It is not helpful to say 'Good Notan' because it implies that one relationship or arrangement is superior. Notan is not about that klind of judgement. Similarly you can't quite say 'good type' outside of a context : use, paper culture, audience etc. Notan refers to a way of looking - not a result or a judgement of that result.</p>
      <p><strong>Sequence </strong><br>
      Philisophically you might say that Notan is higher up ontologically - that it to say it comes first or put another way 'Color' results from Notanic interactions. Or if you prefer you could turn the order around could think of Color as being the observable phenomena and of Notan being a theoretical construct to explain an aspect of that phenomena. Either way they are not sequentially non-contemporary. </p>
      <p><strong>Usefulness</strong><br>
      Notan is more useful if for no other reason than because Notan is less vague than can the term 'Color'. I also think that new insights and progress in the design of type can be leveraged from observing and thinking about Notanic relationships.</p>
      <p>--</p>
      <p>Nick: Thanks for posting your example and your desription of your thinking about the choices you were making. I wholheartedly agree that the 2nd one is a BIG improvment.</p>
      <p>Peter: I like your distinction between 'visual (optical-grammatical) integrity' and ‘interplay’. I think an awareness of Notan can be used to either one or both and that they are indeed quite different. I can of course not prove it but I am wondering if visual grammtical integrity &amp; cue values in the bouma are enhanced by the successful notanic interplay between glyphs. Maybe not. Maybe interplay just gives the eye something more compelling &amp; comfotable to spend time with. But my gut says - no. My guts says this interplay is where the big gains are to be had and it's where I think the best new faces get their power from.</p>
      <p>Hrant &amp; Chris: Let's make an effort to keep the signal to noise ratio reasonable! ;-)</p>
      <p>Chris: It was fun trying to figure that one out. I am almost disappointed to have gotten it!</p>
      <p>Hrant: I agree this isn't easy. But I think examples and discussion of what we are seeing in them especially as they relate to Notan is the best way of helping a deeper, more useful understanding of Notan as it applies to type to emerge. Because Notan is so precise and can be seen at so many scales levels and is so superficially simple it is also hard to get a brain around. It's almost like an object you need tweezers to pick up. I hope our examples can be those tweezers. Eventually I hope we can just say Notan. Saying Notanic relationships is a little like saying 'Safe Safety'. It's weird.</p>
