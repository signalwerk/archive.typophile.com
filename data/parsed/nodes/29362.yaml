      <p>Long post again. Surprise, surprise, - right? </p>
      <p>Strangely all these statements tie together fvor me and remind me of idea I have been chewing on about Notan for a while:</p>
      <p>- <cite> 'Even color per se is anti-reading' </cite> ( Hrant )</p>
      <p>- <cite> '...even color has to be balanced with variety in letter form' </cite>( William )</p>
      <p>- <cite> '...we should target a notan that is adverse to componential abstraction, response bias collapse or letter-by-letter slot-processing' </cite>( Peter ) </p>
      <p>- <cite> '...but we will have leveraged the black and white of it intelligently' </cite> ( Peter )</p>
      <p>- <cite> 'I think the point is effectively demonstrated in pretty well every “Largo” you showed. In each case the ‘argo’ makes a notanically integral bouma-object, with the “L’” consistently breaking away'</cite> (Peter)</p>
      <p>Peter, thanks for answering my question! I think I can answer yours primarily &amp; the other more obliquely by saying that I think it's the Notanic strain that is perhaps one of the salient cues for the letter L. So I am argueing that a relative amount of 'breaking away' is maybe a signature of the letter. Unless it's blackletter maybe! But that breaking away like any characteristic can cut into bouma or become part of the richness of it. And so I suppose I also agree with your point about needing to leverage the variation &amp; cues - either by playinmg them up or toning them down to create a collection that works together. Which brings me to Williams quote : typographic 'Even color' properly understood ( as far as I can see) is a collection of variety that works. That variety might be pretty wild. Nick Fontesque comes to mind. Who would have thought it would hold together but it does! Even color achieved by too much reduction in this variety is, I think anti-reading. The modern faces that comparmentelize gylphs too much are guilty of this I think. Frutiger was brillaint at compensating for this modernist comparmentalization. In contrast, when I look at Calson or Bembo I can't help being amazed at their balance of Bizzare shapes. William, I think you said something similar at Typecon actually! They also offer greater interaction which works for not against the faces. </p>
      <p>Anyway I don't want to lionize Bembo. I want to suggest that there are lots of places to look for Notan at work and that we should keep looking for it and talking about it.</p>
      <p><cite>Frutiger/Notan</cite><br>
      William I agree you &amp; Hrant and many others I suspect that Frutiger's use of what I will call Notan was superb. I suspect you might be willing to say so too. Maybe not using the word Notan. Would you? Suffice it to say - he's amazing! I would love to talk to him about it if that were possible. Anybody got an 'in' for me?</p>
      <p>But, William I have to agree with Hrant that using his words to *define* Notan is a mistake. Unambiguosly. Especially if you are interested in debunking it. I don't begrudge you BTW if that if that's what you have in mind. It's your perogative! But either way your better off reading Japanese or Chinese folks in translation - it's their idea to begin with. </p>
      <p>It's also true that I have repeatedly said ( &amp; will say again it seems ) that White CANNOT be 'primary' from a Notanic point of view as you suggest here: <cite> I don’t think can be determined only by looking at the whites.</cite> Who knows - maybe white *is* primary. I have no evidence for that. So until I do - we agree. </p>
      <p>What I think is probably going on in that quote is a kind of rhetorical flourish or deliberate hyperbole. Why? Because an instructor who is on his game knows that in practice it will be hard for the student to stop being black-centric. So as a teacher they can be free to overemphasize the white to give the kids a chance to get some of that balance happening.</p>
      <p><cite> I conclude that you really don’t understand the concept of even color as the term is used by Young.</cite><br>
      Having not read the book I know that I can't have any idea. Perhaps I'll get a chance to read it &amp; get back to you. I have a feeling that you were still feeling insulted and this phrase was an expression of that. I want to reiterate that while I don't seem to agree with your about Color or Notan I don't see it as a bad habit on your part. Also, there certainly there are far more folks running around saying Color than Notan. It's an intrenched term of art as it were. </p>
      <p>But there are lots of things in type that wear out their usefulness &amp; we move on. Like consistant widths in a Linotype machine for Romans &amp; italics. You can compensate - sure. But who would want to if they could avoid it? I feel that way about the term Color. I think it obscures as much as it reveals. If it was the best we had I'd be happy to go ahead &amp; make the best of it. But I think Notan is a more useful, accurate &amp; descriptive term. It's a term that's going to take some getting used to but I think it will be worth it.</p>
