      <p>The hole created by the L is a problem of uneven color--because of no black in the northeast quadrant. With the r you have the same problem in the southeast quadrant, but it is less as the r arm can be short, and you can extend the serif to the right under the arm. Also we read more clues at the x-height, so the baseline gap is somewhat less obtrusive. </p>
      <p>The L problem is partly solved by the serif on the leg, which is often one of the biggest in a font, as in your Hoefler text. David Kindersley argued that the serif on the leg shifts the L's 'optical center' (the point ideally equidistant between sidebearings) to the right. And this allows more space to the right of the leg, and less to the left. This help to avoid the problem of the leg being too close to the next letter, creating a 'crash' or clotted spot. Too close seems to be a problem in the Albertus example given by Tim. </p>
      <p>There is an inevitable tension among three factors in glyph design: diversity of form, even color, and avoiding too close proximity of blacks. </p>
      <p>The L and sometimes the R are the biggest problems, and with the L particularly you can't really design it away. </p>
      <p>Glyph designs are always a compromise between the different factors, and trying to be too perfect on one is going to mess up the others. </p>
      <p>This is particularly true on the caps-to-lowercase combination. One of the things I have learned from working on Caslon is to keep in mind that the caps are really a different script that has been slapped together with the lower case. Trying too hard to harmonize them, which is the modern tendency, may backfire. They are, after all used as markers of sentence beginnings, titles, etc. Making them too harmonious with the lower case defeats this purpose. </p>
      <p>Caslon could on occassion make his caps way over weighted, as in the Double Pica L above. And sometimes they stand off too far from the lower case--the italic caps can be in the next county. Still, I think he understood that you can use the different structure of the caps to give strength and emphasis to a font, and that is a quality that can be lost in the quest for even color.  </p>
      <p>Finally, loose enough spacing, as in Caslon, helps make compromises work, and the mania for tight letter spacing can impose bad choices on you.</p>
