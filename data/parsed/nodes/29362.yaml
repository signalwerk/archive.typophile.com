      <p>[magnocellular] "What is it[?]"</p>
      <p>The visual cortex is a mosaic of large-cell and small-cell neuro-transmitters, existing in different layers. The term for the large-cell neuro-transmitters is magnocellular, and the term for the small-cell neuro-trasmitters is parvocellular. It is known that the parafovea projects to the one and the fovea mainly to the other. The magnocellular stream codes information at a coarser granularity and spatial frequency than the parvocellular.</p>
      <p>"what about it makes you believe that we can’t decide--if “only” through heuristic guesswork--what a bouma probably is?"</p>
      <p>1) I don't know what 'heuristic guess-work' is in perceptual processing terms. Is it 'probability summation' on the basis of selective activation?<br>
      2) The information is too coarse to be of use for visual wordform resolution without supplimentation, except when a n+1 or 2* item in the visual stimulus stream is highly probable in grammatico-syntactic sense-following terms. It is too course because anything beyond ensemble statistics is unavailable due to <em>greater</em> lateral interference or crowding <em>in rhythmically spaced bounded maps with distance from fixation during immersion, and rising sharply at the foveal /parafoveal boundary</em>. Lateral interference or crowding are very well-documented, but the precise nature of the ensemble statistics isn't--hence my surmise about the coding of boumaform material being bi-valent: involing both magnocellular (coarse) and (yoked fine) parvocellular elements. Taylor's statistics also show that perceptual access to the fine elements are necessary for sufficient wordform differentiation to make reading possible.</p>
      <p>* n = the word or word-part being fixated; n+1 or 2 are the next items in the stimulus stream.</p>
