      <p>Eben,<br>
      The continuum I spoke of earlier is my projection of figure/ground (or what I might call inner and out space).  The continuum starts resolved yet disjoined (but not harmoniously locked) as in the Dead History far left example (this is our “not enough to be good” extreme). It end at far right with the Water Quality logo which is two forms locked in a syntactic relationship which goes beyond their form in an attempt to be a referent to a meaning outside of them—Water Quality as opposed to just Q and Drop (this is our “too much to be good” extreme).  Both of the opposite polls operate by having disjoined figure/ground. This does not operate in all of the glyphs in Dead History, not the "o" or "a" for example. The positive and negative disjoin by being 2 different fonts interjected on each other. There is no specific meaning attempted though. It is a formal relationship that still just refers to the letterform. Dead History "H" is just trying to be an H. There may be some connotation perceived by someone looking at the type but this is not consistent or intended. The Water Quality logo, on the other hand, is intended to have a connotation other than just Q and Droplet. The point of the continuum is to place items between the 2 poles to see where they fall in relationship to others. If we, for the sake of a beginning argument, agree that the typeface Legato has something of what we are looking to define (call that notan only if you like) and place it between the outer poles, what would go after it and what before? Something after it would be the desired state we seek. Something beyond it to the right would be “too much” of it to remain positive. If I am testing items which might be too much, I might postulate that “meaning outside of or greater than” the glyphs would be too much—hence the Water Quality logo, You can replace the Water Quality logo with whatever you might deem “too much” as well to come up with another in-excess quality to create an ordinal system with. By the same token, you can replace the Dead History face with some other item which has “too little of” the desired trait. In my initial post in this thread, I said that the Dead History face was “one that should evoke some debate”. We can use this technique to test where we place visual examples fall next to each-other in relation to any 2 variables.  We can even place a very chirographic sample at far left and something antithetic to it at right and again place Legato as our zero point. The point of this is to have then a collection of variables and ratings. The value is in seeing what variables are in operation as well as having something physical and visible to compare and describe rather than just philosophical terms. Think of it like discussing what might be a recipe for good soup.  You can name ingredients but you have to determine relative quantities before you can test the soup meaningfully. You might also find out that a particular ingredient needs to be left out completely.</p>
      <p>ChrisL</p>
