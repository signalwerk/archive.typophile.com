      <p>William, I'm really not trying to strike you down indiscriminately, but you keep forging in the wrong direction, and not trying to listen, maybe even trying not to listen. Comparing percentages?! Jeezus. I would spend the time detailing the problems in your latest posts, but only if it benefits people besides you (since you yourself are not listening to me at all) and I'm not sure that would be the case. Guys, this is a group effort, and if I'm going to be the only one trying to curtail irrelevance (not to mention outright mischaracterization - "boasting about Patria's notan" indeed - complain to Peter, mensch boy) I'm not going to bother.</p>
      <p>--</p>
      <p>&gt; the parafovea projects to the [magnocellular stream]<br>
      &gt; and the fovea mainly to the [parvocellular].</p>
      <p>I did know that rods and cones (to use the more accessible "street" terms... hint, hint :-) have a different distribution in the fovea versus the parafovea, with one being able to pick up fine detail and color, with the other being better at picking up movement (look at a CRT monitor askance, and you are much more likely to see the flicker). But unless you can show that they map to different areas of the brain there's not much to talk about (and you'd further need to show that the area of the brain that the cones map to has some sort of bouma-decipherment impediment). If there is anything to talk about here, I might talk about how that fact might be a notch against your theory of boumas being picked up in the fovea (as well).</p>
      <p>&gt; I don’t know what ‘heuristic guess-work’ is in perceptual<br>
      &gt; processing terms. Is it ‘probability summation’ on the<br>
      &gt; basis of selective activation?</p>
      <p>I don't want to get too Rumsfeld, but it sort of refers to knowing you don't know. It's exactly not anything to do with summing probabilities, or anything deterministic. It's what happens when the brain needs to balance the risk of failure against speed, which does not [need to] happen in the fovea.</p>
      <p>&gt; The information is too coarse to be of use for visual wordform resolution without supplimentation</p>
      <p>1) But you do have the "supplementation" in the form of grammatical and letterwise redundancy. Although these are rarely enough algorithmically, <cite>they are enough heuristically</cite>.<br>
      2) If it wasn't enough, we would never completely saccade over words. We do, and you shouldn't choose to ignore that.</p>
      <p>&gt; What I’ve resisted is a too simple schematization</p>
      <p>It's a matter of educational progression. You don't teach hi-schoolers Einstein's laws, you teach them Newton's laws, which are known to be "wrong", but "right enough". This is especially true if you don't even know Einstein's laws yourself! :-/  It's not about Truth, it's about progress.</p>
      <p>&gt; very lacking in examples as asked for.</p>
      <p>Indeed.</p>
      <p>hhp</p>
