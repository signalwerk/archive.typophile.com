      <p>&gt;A single line of text cannot really be said to have color I think. Do you disagree? Maybe you can see it in a word. I am pretty sure I cannot.</p>
      <p>Yes, I can see even or uneven color in a word, I noted that the L in Caslon Double Pica gives the word 'Lady' relatively uneven color compared to the harmony of the L in the word 'Lads' in Caslon Great Primer below it. </p>
      <p>If you read 'Fonts and Logos'--which has a lot about evenness of color in logos--you will also be able to see color in a single word and will know what I am talking about. Evenness of color is one of the keys to readability, because you need a relatively uniform background matrix. If the background has uneven color, then it randomly adds information that interferes with the information you need to detect in the varying features of the letters--what Peter calls 'role architectural features and evoked forms' in the letters. </p>
      <p>To me 'good notan' does have a meaning in a glyph, at least for text faces. To me it means what I think Chris meant when he talked about in 'locking' the black and white together, or what Cyrus Highsmith said about 'becoming part of the paper'. But it may well be a quality that requires the glyph to be in context of others in the face to really see it. Perhaps that is because the other letters create boundaries and so define the outside space. </p>
      <p>Because evenness of color involves how the blacks of letters relate to other blacks in other letters, as well as the proportion of black to white, I think it is not a subset of 'notan'. </p>
      <p>Furthermore, I would say that evenness of color is more important in a text face. Lacking that, its usefulness is really compromised. Good notan adds a handsomeness of character which makes it a really good face. So you need both. </p>
      <p>So I can see the conceptual framework I have been using here is different than yours--which is why I haven't understood you. I do think the terminology of color is rooted in type design realities, as is shown by its long use and the in depth illustration and demonstration of it by Doyald Young.</p>
      <p>By the way, the way notan is used in Shirokuro is where whites become foreground, competing with and here cleverly complementing the blacks. This damages readability--though clearly that was not the goal in this display face. This would be very bad notan for a text face.</p>
