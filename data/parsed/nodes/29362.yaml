      <p>&gt;Do you mean in relation to the participation of the “L” in notan?</p>
      <p>Yes, I think that Peter's comment about the argo being an object separated from the L is well illustrated by Mrs Eaves, my comment was a reaction to the setting that Eben posted. Again on the La combination (apart from the length of the leg) there is something about that vertical serif that needs amending, either bigger (wider or taller) or shaped*. Of course this is treating it as a logo rather than as a character that is going to have to interact with other characters and that is going to have to retain the characteristics of an L within a range of sizes (although one can't control any subsequent use, I think the character should still be designed with some thought to an optimum use). Looking at Geneva in the same way it would be optimally intended for smaller scale and I think that for small sizes it is preferable to have a hole that is so obvious (the relatively tall x-height helps exaggerate it) to increase the qualities that make an L an L.<br>
      Tim<br>
      * or possibly it is just too similar to the other serifs to perform its purpose.</p>
