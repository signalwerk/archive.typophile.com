      <p>Eben, I have warmed up to Hrant's introduction of the term 'notan' into type talk. What has helped is to think of this in terms of 'leveraging' the light / dark, or leveraging the black and white of the item under consideration.</p>
      <p>What I've resisted is a too simple schematization of what 'good' or 'ideal' notan means in the typographic domain. You seem to be attuned to this as well. The constructs 'equivalence' and 'balance' when applied to the 'black and white of it' in type are 'floating signifiers'. What <em>specifically</em> do they call for? If it's something spatial, do lights and ultrabolds have non-ideal notan? If 'equivalence' is 'equi-valence' or equivalent valence, do we take our cue from zebras, camouflage, Shirokuro, Neville Brody's typeface State? Must the valence of the white be as strong as the valence of the black in 'psycho-active' (visual cortex centered neurophysical activational) terms? Or is the situation more like what Bill suggests, where the whites must be well formed and in some kind of synchronicity, and the blacks as well?</p>
      <p>We all have some good intuitions about this on a practical level, but at a certain point these intuitions diverge. My effort is to try to give the best intuitions perceptual processing 'teeth'. This can lead into areas as complicated as particle physics, and sometimes I let out ideas that are highly provisional (but that don't come out of the blue!). And it can lead to questions about how parafoveal processing is schematized, what it's role in immersion is, and what the prospects of an enhancement of it's role are. Because if the parafoveal component is of pre-eminent concern, an assessment of what it needs (perhaps in abstraction from or opposition to what foveal vision needs or wants) will skew our answer. It can also lead to questions about whether the information provided by the whites is dealt with in a different spatial frequency channel than the information coming from the blacks.</p>
      <p>I don't really want to be the lone hunter at this Hrant+1 level, but I do want to keep it in front of us, so that we don't foreclose too soon on the answer to the question of what in the typographic domain leveraging notan means.</p>
      <p>But, let me repeat, the lack of a final answer doesn't preclude intelligent action. Acknowledgement of the relevance of the reference axes indexed by the term goes a long way.</p>
