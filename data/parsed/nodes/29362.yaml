      <p>The HFJ link didn't work for me. But googling it took me here:</p>
      <p><a href="http://www.typography.com/catalog/gestalt/index.html" title="http://www.typography.com/catalog/gestalt/index.html">http://www.typography.com/catalog/gestalt/index.html</a></p>
      <p>It looks like I had better comment on 'La' first if I have any hope of getting your comments on the subject! Okay, so when I look at the samples we have here imprefect as they undoubtedly are I see that the 'problem' and some of the 'solutions' are maybe not so well represented. The examples I had for LA were just a little too middling. So here are some examples that I think suggest something interesting about 'hole' problem in the combination 'La'.</p>
      <p>Let's look at what I think of as an examples of 'problem' relationship. Here is Geneva. And Mrs Eaves. In both cases the gap just seems too big to me. It's too much of a 'hole'.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/geneva_4905..jpg"></div><br>
