      <p>I haven't drawn a geometric face, but I think it would be quite a big challenge with a geometrical face. The 'disappearing' comes from achieving even color and extensive visual consistency from character to character. Simple geometrical shapes go directly against even color in character after character, and they have to be masterfully modified--as Futura is--to achieve the harmony that makes type 'disappear'.</p>
