      <p>First things first:<br>
      There is very much good and bad notan, but it depends on the objective (like any aspect of Design). A given notan "scheme" can be good for aesthetic enjoyment, or immersive reading, or making people nauseous, or whatever, but it is always good or bad for various things. Everything does matter, but in different ways.</p>
      <p>--</p>
      <p>&gt; Shirokuro is pretty artsy for you no?<br>
      &gt; ... your disdain for dislay faces.<br>
      &gt; I thought the holy grail of notan was in increased readabilty?</p>
      <p>Are you maybe starting to realize that you don't really know what I've been talking about? To me it's now clear that you don't. And considering how much typing I've been doing here lately I think the ball is in your court to understand more than in mine to explain.</p>
      <p>But hey, what the heck:<br>
      1) There is no holy grail.<br>
      2) Notan is a thing, and it's always there. It doesn't have a goal.<br>
      3) A designer can leverage notan in different ways depending on what he wants to do, for whom. A good designer does this awarely, a bad one does it Vegas style.</p>
      <p>Concerning readability (which is only one place notan is relevant) my contention has been that the two halves need to be treated equally (and that chirography/painting inherently goes against this). Readability-directed notan is NOT the case in Shirokuro, and that's wonderful. The only think I have disdain for is pretending (to understand/leverage notan, in whatever way).</p>
      <p>&gt; Legato ... I don’t think it is any more readable than any decent sans.</p>
      <p>Pure conjecture.</p>
      <p>Plus you're firmly in the Emigre/Shinn camp of<br>
      "no inherent readability" so what's the point.</p>
      <p>&gt; I like Legato and it reads fine but I see no quantum leap there.</p>
      <p>Sometimes a quantum leap is the subtlest thing that can be. To see Legato's leap you'd have to be acutely aware of notan, how letters form it, and what can be good about it. Otherwise it's just another flavor-of-the-week that might sell well or not.</p>
      <p>&gt; I would be curious if you know of any unbiased testing of<br>
      &gt; readabilty between it and say Formata, Frutiger, Thesis, etc.?</p>
      <p>Of course not. But this is not about the numbers anyway. It's about thought: seeing the good kind, applauding it, and hopefully acting on it.</p>
      <p>&gt;&gt; is relevance completely moot, and admitting a mistake unthinkable?<br>
      &gt; I have no idea what that is all about. Care to explain? </p>
      <p>Dead History is irrelevant here; and I think you came to realize that.</p>
      <p>(Eben, the Zen comment was directed at Chris.)</p>
      <p>&gt; I have never been an artist</p>
      <p>Each of us is partly an artist. As you were saying about "notan", we shouldn't get hung up on terminology. It's not what your boss or your wife call you, it's what you are that counts.</p>
      <p>&gt; Think of a continium where the Water Quality logo is at the<br>
      &gt; right end and Dead History is at the left end. Shirokuro and<br>
      &gt; Legato are between the 2 extremes</p>
      <p>I'm not seeing any such thing.</p>
      <p>--</p>
      <p>Eben, your comparison can be revealing, but there are some textbook monumental obstacles here, such as apparent size, intended point size,  lo-res bitmap fidelity, etc. Frankly I don't envy you trying to do this!  :-)</p>
      <p>&gt; In Patria I see a synthesis of a strong but not wide r</p>
      <p>I hope it's actually slightly wide - which is in fact a conscious sacrifice of readability for the sake of reinforcing the style. This is a balance central to Design, and foreign to Art.</p>
      <p>--</p>
      <p>&gt; Placed in this context Patria looks pretty darn good.</p>
      <p>I'm very glad to hear you say that. I guess you've gone back on your former agreement with JFP that the forms don't hold together.</p>
      <p>The thing is, Patria is still way too black-centric. If it does enjoy good (text) notan that's most probably due to a combination of dumb luck (hey, I'm entitled to some too you know), a black-directed minding of spacing (a rejection of the form-&gt;space-&gt;kern idiom) and a concerted effort at functional divergence.</p>
      <p>&gt; Patria and Scala ... exist in different ‘notanic [or dark / light] registers’</p>
      <p>Could you explain?</p>
      <p>BTW, I really like the "La" in William's "Lady Willoughby’s Diary" samples. Color is one thing, but the interletter notan seems great.</p>
      <p>--</p>
      <p>&gt;&gt; "disposing of the linking between the two edges of the black"<br>
      &gt; I think you are saying that the outlines don’t follow ductus…<br>
      &gt; it sure as hell can’t be while still appearing conventional<br>
      &gt; to the reader now can it?</p>
      <p>The insides and outsides (so to speak) of the black have been disjoined (which is something more than saying they don't follow something or other). This is in direct violation of the moving front.</p>
      <p>As for appearing conventional while doing this, the way this is possible is that there's an essential difference between conscious  expectation and subconscious effectiveness. Unless you meant that fonts that follow ductus can't appear conventional: I assume you mean those that follow it slavishly (for example giving the "Z" a thin diagonal) and would point out that it doesn't have to be slavish to be relevant, and a font certainly can appear conventional while "alluding" -even strongly- to chirography.</p>
      <p>&gt; In some ways Patria is even weirder than Bembo &amp; Caslon.</p>
      <p>Thank you!  :-)<br>
      And (I hope) it's a "good weird", not merely an eccentric one (those Brits :-).</p>
      <p>--</p>
      <p>&gt; these Tokyo pictograms represent good (or considered) notan or am I fooling myself?</p>
      <p>They are "considered" notan (see how there are white spaces conveying things). Whether they are good or not can be debated - I think some are good and some not. Overall it feels like <cite>exhibiting</cite> notan has been made into an objective there, which is too much Art ("Look at meeeee!") and not enough Design ("Look, and use.")</p>
      <p>So it follows that the answer to:<br>
      &gt; Is the best place to look for good notan in the base character<br>
      &gt; or in the character in its environment (as per William’s samples<br>
      &gt; but maybe not cleaned up) or does one naturally follow the other?</p>
      <p>is: it depends on what the font is for. Notan is there for individual letters as well as letters in context; the effectiveness of a given notan scheme depends on what the font (or shape, or collection of shapes) is intended to do.</p>
      <p>hhp</p>
