      <p><em> … such metrics are integral to the synergy of those type designs.<br>
      </em>[Hrant said]<em> I don’t think that’s how readers function.</em></p>
      <p>Well, you can play Bach on anything, and irrespective of how the listeners function, the preference seems to be for acoustic instruments. In other words, there is a sympathetic relationship between form and the original technology for which it was created. I'm not proposing that one takes no advantage of new technology, just don't overdo the kerning.</p>
      <p>Also, people who make stuff, whether artists, designers, engineers, whatever, often have the wackest reasons, and can be totally f*cked up, but that doesn't have much bearing on how well their creations work. The Garamond typeface was based on some kind of metaphysical theory of I and O (and the Godess Io?) apparently, what was no doubt considered serious thinking at the time, yet the type still rules long after its theoretical criteria have become obsolete. Go figure.</p>
      <p><em> it’s the more active dimension of the design.<br>
      </em>[Hrant said]<em> Why?</em></p>
      <p>I'm really trying to get a different balance between lettershape and spacing. Before the letters were a bit wonky and spacing pretty slick, now I am trying to make the letterforms better behaved, and the spacing more varied. So I described more variety of spacing as making that dimension of the typeface more active.</p>
