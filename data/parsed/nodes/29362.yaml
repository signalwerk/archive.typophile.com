      <p>"But who would want to if they could avoid it? I feel that way about the term Color. I think it obscures as much as it reveals. If it was the best we had I’d be happy to go ahead &amp; make the best of it. But I think Notan is a more useful, accurate &amp; descriptive term." [Eben]</p>
      <p>Why force a choice? Both notan and colour are relevant reference axes vis à vis type. And their ranges of convenience are partly overlapping, creating, with many other relevant reference axes, a field of multiple countervailing but co-relevant, partially non-overlapping and mutually non-exclusive normative functional pressures. Typographical practice happens at the intersection. The different modernisms might navigate the pressures differntly, but it's my impression that Frutiger, for instance keeps them well in balance. Some modernisms might navigate the pressures poorly. Modernisim isn't a mono-dimensional entity or direction.</p>
      <p>Nowadays when I think of colour I think of the dark / light (notanic) 'register' the glyph set exists in. And relative to this, the criterion of colour evokes a concern for consistency across the glyph set of where the members of the set are on the dark / light distribution spectrum. While notan evokes over and above this a concern for the 'valence ratio' if you will, of the white vis à vis the black. A notanic emphasis comports well with the notion that both the black and the white in word-object bounded maps are perceptual decisionally 'psycho-active.'</p>
      <p>[relative to 'valence ratio']: It could well be that there is an assymetry in vision whereby the coarser, magnocellularly-based, fast, ensemble statistics collecting, parafoveal pre-processing of the word object relies more on the distribution of whites inside the bounded map than the finer, parvocellullarly-based, slower, foveal, visual wordform decisional processing, which might rely on finer features supplied by the black, like lack of closure here, sidednes of a stem there, disturbance of expressedness elsewhere.</p>
      <p>How do we adjust for this?</p>
