      <div class="imageWrap"><img src="http://typophile.com/files/fettefraktur_3622.GIF"></div><p></p>
      <p>Also, a serif can help fill that space - in many styles. Courier, and Rockwell and Cooper Black.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/courier_4474..jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/rockwell_3609.GIF"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/cooper_4226..jpg"></div><p></p>
      <p>Cooper Black is a little bit of a hybrid. It uses the bent serif as well like these fonts do: Hoefler Text and Goudy Oldstyle</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hoeflertext_5683.GIF"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/goudyoldstyle_4327.GIF"></div><p></p>
      <p>Or perhaps the most obvious choice in a Sans - the leg of the L can be shortened. Here we have Futura Medium, Humana Sans, and Meta Book Pro and Octone.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/futuramedium_4459.GIF"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/humanasans_4488.GIF"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/metabookpro_4239.GIF"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/octone_4007.GIF"></div><p></p>
      <p>In Graffiti There is another solution - raising the leg. Sort of appropriate for making a liquid mark.... Here is: Owned, Streetcred and Fanboyhardcore</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Owned_5818.GIF"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Streetcred_6461.GIF"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/FanboyHardcore_5875.GIF"></div><p></p>
      <p>And you can have a mix of lifted leg and serif a la Rockwell: Kickshaw</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Kickshaw_3478.GIF"></div><p></p>
      <p>And then there is stuff that looks like a contextual altrenate: Shake Your Head</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Shakeyourhead_4832.GIF"></div><p></p>
      <p>So, What do you think?</p>
