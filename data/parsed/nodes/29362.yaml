      <p><cite>...the basis for such leveraging is just not as there. </cite> </p>
      <p>I think it's more difficult to solve for Notan with many upper case letters. I will even admit  that the problems to be solved might be presented for the sake of teaching as being in a different class, kind, or category in general; but the ground in which the problem is solved (or not) is still Notan. And there are exceptions. The D is a great example to contast with the upper case I. The I is fairly simple to solve for upper case or lower. It's an exeption. But not an exception for Notan. I think that while the problems vary alot between glyph combos, uppercase &amp; lower &amp; even kinds of scripts - the same issue: Notan; applies across all forms - even Thai &amp; Hebrew &amp; Cyrilic &amp; Chinese etc.</p>
