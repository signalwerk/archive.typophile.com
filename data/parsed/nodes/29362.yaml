      <p>Here you see the 'hole' made by the shape of the L. It looks a bit too irregular.I see many many ways of compensating or ovoiding what looks imballanced to me. In fonts based on handwritting I see that the L is bent over filling that gap partially.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cezane_6702..jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/zaphino_3690.GIF"></div><p></p>
      <p>Blackletter partially fills the gaps too. Petras Script is not blackletter of course but it seems to use the same strategy as to Fette Fraktur to deal with the 'hole'. </p>
