      <p>Hrant, I have tried not to mention the "r" word (and I certainly haven't mentioned it in this thread). However, I didn't resolve to lose all interest in how we read.</p>
      <p>Shirokoru, which reminded me of State, got me thinking about situations where we can read even though there is no dominant side in the positive/negative gestalt -- in other words, where the notan does not directly map the typographic form as a letter with an area, a simple figure/ground image -- and hence outline type sprung to mind.</p>
      <p>It would be convenient to explain away how we manage to read an outline script by putting it in the "deciphering" and "legibility" category, rather than the "immersive" and "readability" one, but I'm afraid that although I admit these categories can be useful, I don't think they have much to do with the way we read.</p>
      <p>I believe that readerability is extremely flexible, and allows us to read different types in different ways. From our perceptual toolbox, we choose different tools to read a very tight Helvetica Thin setting than we would for a classic Bembo setting.</p>
      <p>And in reading text set in an outline script, as with all challenging settings, we probably rely more on guessing word shapes than the letter-first model proferred by Kevin. But that doesn't mean we're not engaged in immersive reading. Surely there are different depths of immersivity -- where do you draw the line: word, phrase, sentence, paragraph, page?</p>
      <p>Actually Carl, I showed outline of a monoline script because thatt is most promising for an outline text setting, as there is less problem with the outline doubling up between letters.</p>
