      <p>So Chris, "decent type designers have been giving equal importance to both blacks and whites for centuries", but you come up with Dead History, a black-centric exercise if there ever was one? Fusing the blacks of two very different fonts to get a new font. Right.</p>
      <p>To me you count as a "decent type designer", so you must have at least been keeping an eye out for exceptional instances of notan, right? Even if you might not have made anything notanically worthy yet (which is actually the case with me). Don't you go looking around now - you should have a few example sitting right there in your head...</p>
      <p>&gt; It’s your thread — walk the talk.</p>
      <p>I think providing one example as a starter might have been a good idea, but I actually advise people starting a new thread to give it some room/time to breathe, so you get more of what's in people's heads instead of putting things in their heads. In fact I thought Eben's second post was way too anxious.</p>
      <p>--</p>
      <p>Yes, Shirokuro is it. Is it heavy or what? And bi-script on top of it.<br>
      BTW, I will note that it has <cite>two</cite> "r"s in it, just not one at the beginning.  ;-)<br>
