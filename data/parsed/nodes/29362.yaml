      <p>&gt;how one can possibly read the above, let alone fluently</p>
      <p>I don't think the theories are that well developed. It doesn't mean they won't be in the future. </p>
      <p>On your thought-provoking example:</p>
      <p>1. I do think it is much harder to read than it would be if it were solid--that is, it would slow down and fatigue a reader more. </p>
      <p>2. The letters do have a rhythm and regularity which tells us where to look for a letter. And of course we've learned to read script shapes--more slowly and laboriously than print.</p>
