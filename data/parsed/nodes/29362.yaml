      <p>Eben, let me try to explain what I am driving at without using the terms 'color' or 'notan', which may be getting in the way. Then I will relate what I am saying to these. </p>
      <p>I think we all agree that some kind of dynamic balance and harmony is needed in a good text faces, and it involves both the blacks and whites. </p>
      <p>This harmony is not only a question of how black and white relate, but also how black relates to black, and white to white. </p>
      <p>For example if you thicken a hairline in a character, it has a dramatic effect on the look and balance of a character, and if you do it systematically, a big effect on the whole of a typeface. Have you changed the whites? Yes, but barely--it could be less that 1%. On the other hand, the black might be increased by 100% or more. And the eye is more sensitive to this 100% increase in a black that to the same amount which is say a 1% increase in the width of the white of a counter. </p>
      <p>Hence in judging how good the balance is in a type, the designer would do well to be attentive not only to how the black and white relate to each other and affect one another, but also the interaction of black and black. </p>
      <p>One of the features of a good text face is that the features of the letters that ‘read’ come across to the readers, but nothing else obtrudes or interferes with that information. Thus a black feature such as a stem or a terminal should be clearly noticable, but not force itself to attention more than other parts of the letter. In order to do this, the different black parts of the letter need to be in balance with one another. This is partly a matter of how dark each is, and how distant they are from one another—both factors affect whether the overall effect is balanced or not. </p>
      <p>Furthermore, in general one letter should not pop out as much more dominant than another. They need to be in balance with one another so that what is readily recognized is words, rather than individual letters. </p>
      <p>In a while I will post further applying this to the concepts of ‘even color’ and ‘notan’.</p>
