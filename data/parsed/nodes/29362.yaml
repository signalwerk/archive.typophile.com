      &gt; within the context of the glyph’s em box - not about creating<br>
      &gt; blanced glyph realtionships across a word.</p>
      <p>Check out the last word in my first post.</p>
      <p>This goes back to my opinion that there are different types of notan, for different purposes, most centrally display versus text. BTW, display notan is one place I think chirography can be very useful; and that's why I once paid money for Ex Ponto (and I still don't regret it). Digressing dangerously.</p>
