      <p>Joachim, thanks for that full elaboration (good move, Eben). Some very interesting and good points there. I'd love to get into a discussion concerning certain points in the interview, but... see below. My own admiration for Shirokuro is based on its "proving" that letters are not necessarily black - that we can decipher them much, much more cleverly than the classical views would have us believe. The PoMo exercices from the 90s were just the tip of the iceberg!</p>
      <p>&gt; In Blue Island? Or in Ed Interlock? :-)</p>
