      <p>Thinking about notan seems ideal for running scripts because the notan model isn't character or glyph centric. I don't think the mind is either which is part of why I like the bouma model so well. Also, according to Peter ( or so I imagine) the 'salient cues' for the letters are still there.</p>
      <p>Admittedly outlines introduce an additional factor in desciferment of a word or phrase or bouma if you like. I am not sure how to explain how we deal with that &amp; actually I think we don't deal with it all *that* well. Why? I definitely don't want to read too many words set in outline - even if it grabs my attention. </p>
      <p>I think you may have brought a particle physics problem to geometry class as it were. Still, it's a visual sample/example. So bravo. You are well ahead of the rest of us where that's concerned! </p>
      <p>Carl: VERY good idea. What kinds of Copyright issues are there? Without addressing issues of color on the page and for looking at how two or three glyphs relatemaybe we could say, render it at 96pt size or above or so x height equals 1 inch or something - what do you think? What do you think of Chris' PNG model? It sounds good to me... Also some of the examples I will want to post later will probably come from scans made by other people or photos of carvings. So I know ahead of time that not all of my examples will be superb.</p>
      <p>I hope to follow Nick's fine example &amp; post a new sample soon. But before I do: </p>
      <p>To reiterate just a little the idea I have had for this thread (true or not) is that notan is not easy to 'see' or rather notice when it's working well. However if we look at classic examples of difficult character combinations and see them working or failing by various degrees the Notan will be easier to see and perhaps it's applicability to our work will be too. And maybe I can gain the viability of my pet 'contextual notan' idea too. That's why I posted the 'ra' &amp; 'La' examples and asked William to help me with the samples I was missing. Let's look back at the samples of 'La' &amp; comment on them. I don't want William's good will to be wasted! Does anybody have any further comments about 'ra' combinations?</p>
