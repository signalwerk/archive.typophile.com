      <p>&gt; a relative amount of ‘breaking away’ is maybe a signature of the letter.</p>
      <p>Yes!<br>
      (With Tim saying the same thing too.)</p>
      <p>&gt; overemphasize the white to give the kids a chance</p>
      <p>And this is actually why I seem to extreme myself sometimes (although<br>
      subbing people for kids). It's sort of a well-meaning slap in the face.</p>
      <p>&gt; Why force a choice?</p>
      <p>Not a choice, an awareness, of differences and relative merits.<br>
      Because people (adults) don't change unless they're pressured.</p>
      <p>&gt; It could well be that there is an assymetry in vision ...</p>
      <p>This multi-frequency aspect of perception/cognition is something that's actually already somewhat accepted I thought. And yes, it does play into the fovea/parafovea duality, with the former being* higher-frequency and able to see -fewer- letters** with near-total assurance, and the latter being lower-frequency and able to see -more- letters (via multi-letter boumas) with more guesswork. BTW, when you take into account that English for example has a redundancy of over 50% (and apparently almost 70% according to one researcher) you start realizing that the parafovea playing over 60% of the role in reading (in optimal situations) is entirely plausible.</p>
      <p>* Or actually, choosing to be, since it has lower frequencies as well.</p>
      <p>** Special-case boumas.</p>
      <p>But I don't think parafoveal perception can work with the inside whites very much. Also, I wouldn't ignore the potential significance of cues in the parafovea.</p>
      <p>hhp</p>
