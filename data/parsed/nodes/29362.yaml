      <p>Isn't it the case that the most we can hope for in the "La" combos is a harmonious integration of the blacks between the right end of the leg of the "L" and the bowl of the "a", and a smooth flow of the white, from the white between the arm and bowl of the "a" into the white just above the leg and to the right of the stem of the "L"?</p>
