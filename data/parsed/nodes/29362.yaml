      <p>&gt;What’s the gist of this Doyald Young book?</p>
      <p>'Fonts and Logos' is a 385 page large-format book studying fonts and logos. It  is one of the best books on drawing letters, I think, and just has a wealth of information. It's value is not in any 'gist' but in the wealth of detailed comments on letters and illustrations of trial and error in drawing logos by a master of drawing letters. His goal is logos, not typefaces, but many of the same principles apply. The trial and error examples bring you into the mind of a master draftsman of logos, and that is its great merit. The Prudential example is the most extensive documentation of the process of developing the wordmark for 'Prudential', as well as a related font. </p>
      <p>I can't do better by way of summary than Hermann Zapf in the Introduction "This is logo design at is best by a designer with an outstanding international reputation of many years. Study the examples to open the door into this imaginative and inspiring world of logo design." </p>
      <p>Oh and Hrant often has recommended it along with the 'triumvirate' as one of the handful of best books on letters, and I agree. </p>
      <p>Personally, what I learned most from it was the importance of even color, and what it means in practice to achieve it. With all due respect, Eben, from your comments (can't see even color in a word; easy to achieve with geometric face) I conclude that you really don't understand the concept of even color as the term is used by Young. </p>
      <p>In so far as 'notan' is a different concept in type from 'color', it does have to do with the whites having a special kind of presence.<br>
      Here is Frutiger, who I believe is the most prominent type designer to advocate 'designing the whites'. This is from the Wikipedia article:<br>
      ***<br>
      “The white surface of the paper is taken to be ‘empty’, an inactive surface, despite the visible structures that are present. With the first appearance of a dot, a line, the empty surface is activated. A part, if only a small part, of the surface is thereby covered. With this procedure, the emptiness becomes white, or light, providing a contrast to the appearance of black. Light is recognizable only in comparison with shadow. The actual procedure in drawing or writing is basically not the addition of black but the removal of light. The sculptor's work also consists essentially of taking something away from the block of stone and in this manner forming it: the final sculpture is what remains of the material” (Rauri, ?) A professor of Frutiger's, Alfred Williman said: “Do not apply black but cover up white, so as to make the light of the white sheet active.” (Traces) Frutiger took this as his mantra.<br>
      ***</p>
      <p>So this, as in art exercises on 'notan' is more than balance; it is imparting a certain quality to the whites. </p>
      <p>Finally, in type design the relationship of the weights of the horizontals and vertical and diagonals I don't think can be determined only by looking at the whites. You also have to look at how the blacks relate to each other. For example, can you tell what the weight of the cross bars on the f and t should be only by looking at the balance of white and black? I think you also have to consider how it relates to the weight of the stem, of the serifs, the horizontal part of the arches, etc.</p>
    html_clean: |-
      <p>&gt;What’s the gist of this Doyald Young book?</p>
      <p>'Fonts and Logos' is a 385 page large-format book studying fonts and logos. It  is one of the best books on drawing letters, I think, and just has a wealth of information. It's value is not in any 'gist' but in the wealth of detailed comments on letters and illustrations of trial and error in drawing logos by a master of drawing letters. His goal is logos, not typefaces, but many of the same principles apply. The trial and error examples bring you into the mind of a master draftsman of logos, and that is its great merit. The Prudential example is the most extensive documentation of the process of developing the wordmark for 'Prudential', as well as a related font. </p>
      <p>I can't do better by way of summary than Hermann Zapf in the Introduction "This is logo design at is best by a designer with an outstanding international reputation of many years. Study the examples to open the door into this imaginative and inspiring world of logo design." </p>
      <p>Oh and Hrant often has recommended it along with the 'triumvirate' as one of the handful of best books on letters, and I agree. </p>
      <p>Personally, what I learned most from it was the importance of even color, and what it means in practice to achieve it. With all due respect, Eben, from your comments (can't see even color in a word; easy to achieve with geometric face) I conclude that you really don't understand the concept of even color as the term is used by Young. </p>
      <p>In so far as 'notan' is a different concept in type from 'color', it does have to do with the whites having a special kind of presence.<br>
