      <p>The reason I think it is useful to think in terms of 'color' here is that the L is so open that there is little 'activation of the white' that people usually think of in discussing notan. Assymetric balance of blacks within the bounds of the sidebearings and the body height is also very important. When it is done well, then you have a much better shot at fitting with other letters, including the a.  </p>
      <p>The handling of the L in Hoefler text is very traditional, and works. Albertus, a variation on the traditional approach, and works, but for some reason is badly spaced here. Patria and Mrs Eaves (above) have too small a serif in relation to the weight of the stem in IMHO, and color worse for that reason.</p>
