      <p>&gt; I notice that you have not posted an example either?</p>
      <p>I'm the one countering your claim that it's common, remember?</p>
      <p>Anyway Legato and Shirokuro are the two best -and nicely "opposed"- examples that I know of - and I for one have been paying attention*. And I think it's very important to pay attention to what others are doing - that's a difference between Design and Art. Being influenced by good things is good for one's own results. It's good for the user.</p>
      <p>* And if you haven't, how do you know that “decent type designers have been giving equal importance to both blacks and whites for centuries”?</p>
      <p>&gt; I won’t post mine because, in all honesty, I never understood<br>
      &gt; the meaning of notan in the way you describe it</p>
      <p>Hopefully these discussions aren't merely a means to acquire new terms, but to understand new things, to see them in new ways. When you say "I am just trying to make good type" I would reply that yes, of course you are, good for you, but to make <cite>better</cite> type you have to keep looking, listening and thinking. Maybe you are (sufficiently) notan-conscious, or even notan-savvy; but those who are not have a lesser chance of making good notan. True, awareness is not an absolute requirement (with Dwiggins a great example of that) but it can only help.</p>
      <p>&gt; I would say that Zapft’s work generally does not</p>
