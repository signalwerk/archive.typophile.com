      <p>&gt; Is this because ...</p>
      <p>I think in Hoefler Text (like Patria, and unlike Albertus for example) it's because the white -like the black- is well-proportioned, <cite>designed</cite> if you will (although -unlike the black- it's "design" in a necessarily non-deterministic way) and "happy" alongside the black.</p>
      <p>&gt; I don’t think it is the relationship to the ‘a’</p>
      <p>?<br>
      Notan is all about relationships, so by "the 'La' has good notan" of course I was talking about the balance of black and white between the two glyphs.</p>
      <p>&gt; You can look on the vertical serif as adding weight to the lower<br>
      &gt; right quadrant, reducing the unevenness of color. Or you can think<br>
      &gt; in terms of notan, and see the serif as counterbalancing the white<br>
      &gt; expanse above it.</p>
      <p>I guess Eben's long and studious elaboration on the difference between color and notan (and the importance and primacy of the latter) didn't do much...</p>
      <p>The relevance of notan (here, and in general) is about<br>
      relationships, not compartments. East versus West.</p>
      <p>hhp</p>
