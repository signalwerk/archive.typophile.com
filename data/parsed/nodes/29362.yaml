      <p>Thank you Eben, for inviting me to your thread.  Happy to find out that Typophile has a nice description of traditional Notan in its Wiki, but I think humans have come upon the concept outside of Asia too.  I guess I came to a similar approach from a different angle: As a teenager I was given Paul Klee's "Pedagogic Sketchbook", where, in chapters II.23 and .24, he explains "non-symmetrical balance" (and expands it interestingly in III.26 and IIII.40) – a concept which, to me, explains modernist composition quite nicely, and how effects of vivid tension can be achieved.</p>
      <p>A few words about Shirokuro – Akira Kobayashi just interiewed me for the Japanese magazine "Design no Genba" (I'll put the entire text on my website sometime soon) – </p>
      <p>"During my studies at the Basel School of Design we spent much time thinking and working in figure-ground shapes and exercises, which I enjoyed a lot. In type design class we also often dealt more with white space than black form. When I began designing typefaces in 1993, I therefore also played with Romaji whose shapes were composed of white as well as black shapes, but did not get far since I found too many possibilities. Years later when I learned Kanji, I remembered again and thought, in most Kanji I might be able to separate the radical (hen) and the rest of the character in a positive-negative treatment? Here too there were too many variations at first, but in the Kana I soon found the best design rule: On the upper right often appeared ten-ten or maru, and these had to be positive shapes, so they could simply be added separately. Hence the negative part could only be located on the left or at the bottom. Thus, Kanji with a 'hen' went fairly quickly, but simpler glyphs were difficult – i needed to 'break' them in a way. Back then I still did not understand much of good Kanji formgiving, and hid my ignorance behind a playfully-random papercut style. When my Japanese design was finished, I was able to create the Romaji with the same rules very easily – in only two evenings. Many designers hate rules – I in turn often search for them, as I like using them like toys."</p>
      <p>Correct, Shirokuro is not easy to read, actually in more ways than mentioned.  Readers of Kanji actually appreciate uneven color in their text, because it assists in recognizing the characters also by their color, i.e. amount of strokes.  Especially the Japanese who mix them with Kana, can easily identify the lighter-looking inflections, particles etc. in Hiragana, or foreign words in Katakana.  And that is where Shirokuro totally "fails", because every character has almost equal amounts of black and white, which results in rather even color, and the simplicity or complexity of a character can only be perceived indirectly through the coarseness of its details.  Still, they seem to like my idea a lot, since they told me they are trained to see Kanji only as collections of strokes, not as inside and outside shapes.  Which is evident when you see how even the comparably few closed shapes are built from several strokes placed one by one, not as continuous ovals and connectors like western writing.</p>
      <p>And yes, Shirokuro's notan is on a glyph-by-glyph basis only.  So where is "interlettral / panglyphal" notan? In Blue Island? Or in Ed Interlock?  :-)</p>
