    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a>: Disappearing Inc.</strong></p>
    <p>Delaware-based type collective headed up by designers <a href="/wiki/Jeff%20Prybolsky" class="freelinking" rel="nofollow">Jeff Prybolsky</a> and <a href="/wiki/Jason%20Lucas" class="freelinking" rel="nofollow">Jason Lucas</a>. Know for their 'take no prisoners' approach to design, the Disappearing Inc. library was best known for their aggressively grudge-flavoured faces.</p>
    <p>Typefaces included <a href="http://www.identifont.com/show?1RH" rel="nofollow">Fragile</a>, <a href="http://www.identifont.com/show?26J" rel="nofollow">Cowpoke</a>, <a href="http://www.identifont.com/show?8TR" rel="nofollow">Thumtax</a>, and Twoface.</p>
