    <p>Hi guys:</p>
    <p>While on vacation in Florida I was able to snatch up two clients. Here is the business card for the first. </p>
    <p>At first I wanted to get the look of Fournier's "Manual Typographique" with lots of ornaments but that would take up too much space and get really rococo really fast.</p>
    <p>The feel (I'm going for- this time) is buttoned-down british hunt club/french europe. I'm using Didot for the entire identity. (I'm trying to avoid the wild-wild-west look that's over used and abused in Florida)</p>
    <p>Tell me about the spacing.<br>
    Should I used another font- like a sans or a script?<br>
    Is it too tight? Tell me all your thoughts.<br>
    Does this look make you think $$$$ expensive? It supposed to.</p>
    <p>And what do you think of the section at the bottom:</p>
    <p>full board,<br>
    partial board,<br>
    pasture board,<br>
    &amp; retirees</p>
    <p>or should it be:</p>
    <p>full, partial &amp; pasture board<br>
    plus retirees</p>
    <p>Thank you in advance for all your help(s),</p>
    <p>Mike Diaz</p>
    <p>PS&gt;&gt;&gt;&gt;&gt;THE C3 AND C4 PDF ARE THE NEWST!!!</p>
