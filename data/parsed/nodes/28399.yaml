      <p>Spontaneously, it feels great! If it fits with their image and clientele, of course.</p>
      <p>I like the striped background. With the right kind of paper, it can be very strong.</p>
      <p>If you go for the one with one without background, I would consider doing the border embossed instead of printed, and use a nice thick  paper.</p>
      <p>Double divider line: keep, but I think it's a bit strong as it is. Tone down somehow (width or color).</p>
