      <p>Hello again:</p>
      <p>Okay here is some updates to the Saddle Ridge Farm business card. </p>
      <p>For the Front:</p>
      <p>I removed the bottom divider to add more air to the design. The boarder has been simplified although I may go back to original. I also made the background lines diagonal. If you look at the new pdf's (c3 &amp; c4) the colors are inconsistant but that's not my fault... Its an apple/adobe bug (I think.)</p>
      <p>I adjusted the letter spacing 'SADDLE'- made the 'addle' closer to the 's'. I increased the letter spacing in 'Quality Boarding by'.</p>
      <p>Oh and another serious deal... I added old style figures to the design. And apperently these do not work as expected and I'm not really happy as I has to manually adjust every single number. I probably will have to go back to using lining figures. Didot is a very old font- why they have not fixed it is beyond my comprehension.</p>
      <p>FOR THE BACK:</p>
      <p>I ghosted the image of the logo in the background and I used OSF figures and MANUALLY corrected them &gt;:-/ I added more space to "Saddle Ridge Farm".</p>
      <p>I have yet pin down the exact pantone yet but that's in the works. As the paper, its going to be somewhere between natural and warm cream.</p>
      <p>Thanks for new suggestions,</p>
      <p>Mikey</p>
