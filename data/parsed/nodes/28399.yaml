      <p>MarcoX: Hello and thanks for the feedback. I don't exactly get what you mean by a 'tone on tone' approach. As for screening the black diagonals- I don't think that's a good idea because that would created {ugly} half-tone dots. I did make a card without the black diagonals though.</p>
      <p>Also would it be better if the diagonals were vertical instead? As in 'space tweak 1.pdf'</p>
      <p>You are right about the spacing of the clients name. Although I do like italic but there is something wrong with 'stucture' of the bottom half of the card. I can't put my finger on it.</p>
      <p>Oh and by the way is it better to have:</p>
      <p>full board,<br>
      partial board,<br>
      pasture board<br>
      &amp; retirees</p>
      <p>or should it be:</p>
      <p>full, partial, &amp; pasture board<br>
      plus retirees</p>
      <p>Thanks for the input,</p>
      <p>Mike Diaz</p>
