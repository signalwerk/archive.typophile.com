      <p>Be very careful about quick conclusions concerning economy. Unless you have a mandated point size and you want to "cheat" by using a font that's unusually large or small on the body (which roughly translates to a font with a large or small x-height) most of any savings in space will come at the expense of readability. Times for example is actually very well honed to saving space, in "normal" typesetting situations. Baskerville tends to be more elegant but also less efficient in then end, once you facor in apparent size, which is strongly -although not completely- correlated to readability. Generally, the more elegant a font, the better it is for larger sizes.</p>
      <p>&gt; anyone knows why Filosofia doesn’t work in Word?</p>
      <p>It's because Filosofia doesn't work in any app, really.  ;-)<br>
      You don't want a Didone for text.</p>
      <p>hhp</p>
