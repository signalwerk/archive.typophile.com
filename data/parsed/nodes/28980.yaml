      <p>I have a feeling that cviviani is trying to find alternatives to the mainstay typefaces that are installed on Microsoft Office. Unfortunately, in a business, office, and public sector environment, if you want your documents to be consistent, there's very little in the way of straying from that frustratingly narrow selection. </p>
      <p>The typefaces we use for various projects that require this kind of compatibility include Verdana, Trebuchet for screen and Powerpoint presentations; and serifed Times New Roman or Georgia for print. I'm loathe to say this, but as much as I limit Arial's presence by substituting Helvetica (whose Helvetica is anyone's guess), there's no escaping it sometimes in such environments.</p>
      <p>I've always tried getting Garamond to work, but even though it is packaged in with many Office programs, I've had problems. If I can get it to work, I also try to replace Book Antiqua with Palatino. </p>
      <p>The United States government offices made it official that all documents were to be printed in Times New Roman 14pts (proof that most of the elected officials here are blind) instead of the previous Courier 12pts. I'd love to know what they decided on official line spacing...</p>
