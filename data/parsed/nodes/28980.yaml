      <p>I've been down a somewhat similar road, trying to find an alternative to TNR. I do mostly technical documentation and new business proposals with extensive engineering and scientific content. The problem I find is that a lot of the classical book fonts -- Bembo, Baskerville, Century -- just don't seem appropriate when used for our content. I can't say exactly why that is; maybe "too bookish" and "not technical enough." I also tried a number of modern fonts from foundries like DTL, FontFont, H&amp;FJ, and so on. There again, beautiful fonts that just don't seem appropriate. Or, more probably, I'm just too conservative. But if I am, then so is my audience.</p>
      <p>I'm also constrained by the absolute need to embed fonts in Word and PDF documents for delivery to customers. That means TrueType or OpenType in TTF format. It also lets out fonts like Mercury that I'd kill to use. Mercury is already expensive enough, and there's no way I could convince management to shell out the additional money for an embedding license when the Windows core fonts are "free and just as good." For other fonts, there's no embedding possible at all.</p>
      <p>Another part of the problem is that the customers often specify "12 point TNR or equivalent." Many fonts -- Sabon, for example -- set a half point or more larger than TNR, so 11.5 point Sabon is about the same as 12 point TNR in terms of characters per line and page. So then I have the problem of convincing a government agency that 11.5 is really the same as 12.</p>
      <p>Bottom line is that fonts like Granjon, Kis, and Janson Text seem to be the best compromise. Sometimes Caslon seems like it's OK, sometimes not. Times Ten is perhaps best of all for my situation, but there I have the 11.5 versus 12 problem.</p>
