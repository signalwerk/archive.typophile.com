      <p>Specifically regarding font embedding in Powerpoint and Word, in my experience it works within Powerpoint but can be unreliable within Word.</p>
      <p>But in short it isn't a great solution and raises as many problems as it solves. </p>
      <p>For example, what happens when an external user copies text set in your embedded font from one document to another they've created themselves, also with embedding turned on? (Not a rhetorical question, I did a load of testing ages ago and can't remember!)</p>
      <p>Also, given that you don't have a choice of which fonts you embed, you can easily end up with massive files (eg. full Arial Unicode font is 22Mb although there is some compression). This is compounded when documents have been edited by several parties with copying and pasting from various sources, you can end up with many redundant fonts included.</p>
      <p>There also is a suspicious lack of documentation available on the nitty-gritty of how it actually works with regard to the different levels of embedding permissions, and it doesn't seem to have been updated for many years, which is why it doesn't work with OTF.</p>
      <p>Many large organisations have a two-tier font policy within their VI -- Frutiger for "pro" use, or if you can deliver as PDF; Arial for MS Office use, etc.</p>
      <p>I would expect MS have come up with something as part of XPS, their "PDF-killer", but haven't looked into it...</p>
