      <p>Solipsism: Thank you for the suggestion. I hadn't specifically looked at Springer Wein before, but I will now.</p>
      <p>Geo Ben: I think your suggestion was intended for cviviani and not me, but switching to OpenOffice, in and of itself, wouldn't solve any of the issues I have. Plus, many customers specifically require Microsoft Word format.</p>
      <p>elliot100: I agree embedding isn't a panacea; I only mentioned it as a possibility. Most fonts aren't as big as Arial Unicode; when I have a 40 MB Word document, which mine run to, the additional overhead of 100K or so in fonts is hardly noticeable. Also, you don't have to embed the full font; there's an option to only embed the characters in use, but this does make it harder for someone downstream to edit. However, our customers don't touch documents after we deliver them, so this isn't an issue in my case. Re cutting and pasting, I'd have to experiment with fonts having Installable and Editable permissions, but I'm pretty sure that if the permission is Print and Preview, the pasted-in text loses its original font and assumes whatever font is in effect in the target document. In regard to having a lot of fonts that are only used for a few characters or lines of text, the solution would be to apply or reapply styles and make the unnecessary fonts go away, as Word only embeds fonts actually in use.</p>
      <p>(Later edit) I seem to have somewhat caused a hijack of the original thread, so perhaps any further technical discussion of embedding fonts in Word should be moved to a new topic.</p>
