      <p>What's wrong with Georgia? Have you tried the 'ClearType' fonts? Why Baskerville? Who is your audience? What tone are your speaking to them in? Why? Is it more imoprtant that the documents work on screen or in print?</p>
      <p>In general the trick will be geting a typeface you like in print &amp; one which which is well hinted well for screen too. That reduces your number severely. PLUS and this is faustian part - the best typefaces in print are not going to match from screen to page all that well. In order to get type to go from screen to print and match well ( lines having the same # of characters - WYSIWYG etc.)  all kinds of compromises were made. Those compromises mean less lovely faces in print in general. </p>
      <p>I guess that you could call fontfont and ask them if any of their faces have been extensevely hinting now...</p>
      <p>But really, I can't suggest anything too seriously because I don't know nearly enough about your goal.</p>
