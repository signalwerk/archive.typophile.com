    <p>Hello everyone,</p>
    <p>although I have a great passion for typography, and have read many books (including elements of typographic style of course) I am not a professional.</p>
    <p>I work in the public sector. Everyone uses Times New Roman + Windows. I am trying to change that. A recent official report was produced on my Powerbook using Baskerville and Word 2004.</p>
    <p>But I would like a more coherent approach, so the question is: which font should I try to introduce - at least in my office (15 people) - that will work smoothly on Windows 2000/XP and that is good for short memos (2-5 pages), letters, papers (10+ pages)? the version of Baskerville I used does not work on Win (besides the licensing problem).</p>
    <p>Do you have any advice on the format of the documents?</p>
    <p>Thanks and best regards</p>
    <p>Carlo</p>
