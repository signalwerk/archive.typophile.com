  html: <p> Recently I was contacted by a customer who has had little success with some Postscript Windows fonts I’ve generated from <span class="caps">FOG</span>. I’ve generated them several times and she installs them several times with the same unfortunate results — Being that they won’t install at all in <span class="caps">ATM</span>. <br><br>After several queries, several folks have told me it’s in the way the Mac version of <span class="caps">FOG</span> generates this format and that I should consider generating them from FontLab. <br><br>Apparently there is some sort of ‘Adobe’ glitch in <span class="caps">FOG</span>. Any suggestions? <br><br>Stuart&nbsp;:D </p>
