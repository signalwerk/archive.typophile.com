    html: <p>NC, cool. Most new fonts be created by the mid-sized to smaller foundries contain small caps these days. FontFont continues to release interesting stuff, as does the Font Bureau, House Industries, etc. etc. And, while I hate to plug my endeavours, you should check out some of the work at vllg.com. Mário Feliciano, Lux, Underware, and Thirstype all have contemporary designs with small caps. Upcoming are new fonts from Kontour (Odile) and Joshua Darden (Corundum) which are exquisite and have small caps...</p>
