      <p>If your looking for a plugin to convert InDesign to Quark and can justify the price tag (US$199) here you go:</p>
      <p><a href="http://www.markzware.com/id2q/" title="www.markzware.com/id2q/">www.markzware.com/id2q/</a></p>
      <p>I’ve only used the Quark to InDesign plugin in both CS2 &amp; CS3 (Quark 6 originals), saved a lot of time on a certain project which out weighed the cost. Imports all style sheets, guides etc. As usual remember that nothing is perfect, you’ll definitely have to watch out for any manual kerning and double check that all styles sheets are working as intended. At the end of the day a lot quicker than recreating multiple documents.</p>
      <p>Hope it helps.</p>
