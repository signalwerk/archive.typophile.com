      <p>Patty, what Paul said:<br>
      Go to <em>Edit &gt; Keyboard Shortcuts ... </em>. There, select <em>Object Menu</em> in the drop-down list, scroll down to <em>Text Frame Options</em>, select it. Key in a new keyboard shortcut (Command-M, if you like so) and assign it.</p>
