    html: |-
      <p>To import an InDesign file into an older version of InDesign, you must first EXPORT it to the INDESIGN INTERCHANGE format. This might also help resolve PC to Mac issues, although I have not tried it. Of course, any new functions not supported in the older version will be disabled and might mess up your files in surprising ways.<br>
      In my opinion, InDesign CS3 is worth the money. It handles transparency much better. If you are still working with Illustrator CS, an upgrade to the new Creative Suite 3 will give you some amazing new color tools.</p>
      <p>I was a Quark user for many years too, but have happily made the switch.</p>
