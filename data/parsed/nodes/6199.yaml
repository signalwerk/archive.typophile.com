  html: "<p>This was a link I found somewhat interesting: <br><a href=\"http://www.2001exhibit.org/arts/designs.html\" target=\"_blank\">http://www.2001exhibit.org/arts/designs.html</a> <br> <br>It's an exhibit of the graphic design (logos, signs, console displays, &amp;c) on the movie 2001. <br> <br>The designers didn't (unfortunately) do any custom type designs.  They seem to have made the assumption that the future will belong to Futura,  Classical Sans, Eurostile, and stencilled Helvetica.  One spaceship sign was odd, using Helvetica with Future M's. <br> <br>Paul</p>"
  html_clean: "<p>This was a link I found somewhat interesting: <br><a href=\"http://www.2001exhibit.org/arts/designs.html\" target=\"_blank\" class=\"link-external\">http://www.2001exhibit.org/arts/designs.html</a> <br> <br>It's an exhibit of the graphic design (logos, signs, console displays, &amp;c) on the movie 2001. <br> <br>The designers didn't (unfortunately) do any custom type designs.  They seem to have made the assumption that the future will belong to Futura,  Classical Sans, Eurostile, and stencilled Helvetica.  One spaceship sign was odd, using Helvetica with Future M's. <br> <br>Paul</p>"
