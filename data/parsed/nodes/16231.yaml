    <p><strong>Question #1:</strong><br>
    Well, I am looking for something similar to Bryant by Process type foundry. Either similar in the fact that it has rounded terminals, or similar in the fact that it is friendly; the more weights, the better.</p>
    <p><strong>Question #2:</strong><br>
    Once I have this font (which may end up being Bryant if I can’t find something out there more suiting) I would like suggestions of a text face to pair with it. Actually Microsoft’s new Calibri really has that same type of vibe, and would work as a text face. If it wasn’t the fact that it will be available on all the new windows system, it might be perfect candidate.</p>
    <p>Thank you for helping my out with these types of questions. Typophile really is a valuable resource.</p>
