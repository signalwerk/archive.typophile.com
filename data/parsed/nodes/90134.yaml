    html: '<p>Just to let you know: URW finally no longer offers Revis. And more good news: Daphne is now available digitally. Georg Salden and me worked hard to get all the great features of the original typeface into OTF. Because what Coen Hofmann ignored, is that the original Daphne had a large number of swashes, which optionally can be added to many letters via OpenType feature. I prepared a little GIF animation to show Daphne: <a href="http://www.typemanufactur.com/eng/index.html" title="http://www.typemanufactur.com/eng/index.html">http://www.typemanufactur.com/eng/index.html</a></p>'
