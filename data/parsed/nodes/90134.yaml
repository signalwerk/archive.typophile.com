      <p><cite>Well, since his designs are apparently worth reviving, maybe he can be convinced to stop squatting on them and team up with somebody to re-release them legitimately (and hopefully in better quality than Revis). </cite></p>
      <p>The last three years me and Georg Salden digitized, reworked and completed 15 of his typefaces: <a href="http://www.typemanufactur.com" title="http://www.typemanufactur.com">http://www.typemanufactur.com</a><br>
      There are still plenty to go, including Daphne. Anyway, I don't think only because a typeface is not available digitally, that allows anyone to do their own digital version. </p>
      <p><cite>it is clearly based on "a/the concept" but several letterforms have been improved</cite></p>
      <p>I showed Revis to Georg Salden. Here is his reaction: </p>
      <p>"At first glance, it's Daphne, the second one sees a lot of change for the worse. New to me is the phrase 'revival'. Literally it means 'revive'. Now, Daphne was never dead, neither the author. I am just very amazed at the words 'based' and 'reinterpreted'. One interprets something that otherwise would not be understood."</p>
      <p>Ludwig</p>
