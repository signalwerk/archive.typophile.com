    <p>Daphne was designed in 1970. For 12 years Bethold had the rights to use it on Staromat, a phototypesetting machine. Salden never published a digital version of his typeface Daphne (although he digitized it and still plans to publish it). Now, Georg Salden is still very alive and he still works active on existing and new typefaces. Hofmann never asked for permission to "redesign" the Daphne typeface, nor he has any rights on the design.</p>
