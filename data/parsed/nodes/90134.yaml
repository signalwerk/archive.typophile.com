    <p>Some weeks ago URW++ published a typeface called Revis by Coen Hofmann. On the website it states: "Revis is a formal script based on Daphne, a typeface that was originally designed by German type designer Georg Salden. Coen Hofmann re-designed, completed and digitally re-mastered the font."</p>
    <p>Daphne was designed in 1970. For 12 years Bethold had the rights to use it on Staromat, a phototypesetting machine. Salden never published a digital version of his typeface Daphne (although he digitized it and still plans to publish it). Now, Georg Salden is still very alive and he still works active on existing and new typefaces. Hofmann never asked for permission to "redesign" the Daphne typeface, nor he has any rights on the design.</p>
    <p>So what do you think about this? I find it quite rude to copy a typeface of a still active type designer, do some changes and label it "revival". </p>
    <p><a href="http://www.urw.de/cgi-bin1/dalcgi/source/schnellsuche_e.htd?searchchar=revis&amp;submit.x=0&amp;submit.y=0&amp;submit=go" title="http://www.urw.de/cgi-bin1/dalcgi/source/schnellsuche_e.htd?searchchar=revis&amp;submit.x=0&amp;submit.y=0&amp;submit=go">http://www.urw.de/cgi-bin1/dalcgi/source/schnellsuche_e.htd?searchchar=r...</a><br>
    <a href="http://www.myfonts.com/fonts/urw/revis/" title="http://www.myfonts.com/fonts/urw/revis/">http://www.myfonts.com/fonts/urw/revis/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Revis-Daphne_4651.gif"></div><p></p>
