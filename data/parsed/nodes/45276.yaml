      <p>Fiction wouldn't be much work. But non-fiction,with all the notes and citations, has a lot of italic. Moreover, some of the punctuation should be in italic, all you'd want to change would be when the italic ended or began, with parens &amp; brckets). I don't know how to write a feature that could determine that sort of context. Eventually, I'll write something to use in pre-processing a file to be imported into InDesign -- we already do most of our coding &amp; make an InDesign-tagged-text file to place as our import to InDesign..</p>
      <p>We did this with TeX, using Vedit. Vedit allowed multiple buffers, so you could have your text in buffer 1, general search &amp; replace routines in buffer 2, and font-specific routines in buffer 3. All the TeX codes are low-order ASCII, so for example, you could search for \IT{, move the cursor to the open curly brace, jump to it's mate, &amp; overstrike it with a uniquely assigned high-order ASCII character as a scratch character. That gave a unique string to search for, &amp; then insert a hard kern in the file.</p>
      <p>We automated all this, the only downside was those hard kerns in the file that had to be cleaned up if you needed to later make an XML file.</p>
      <p>If you can figure out how to specify the context of begin &amp; end within a font, I'd love to know how.</p>
