      <p>Some house styles are simply wrong. Longstanding use does not make them right. There is, additionally, no such thing as a definitive “Webster’s” dictionary, since anyone can use that term. People working in the 21st century use Oxford, which has a range of credible dictionaries for national variants, including British, American, and Canadian.</p>
      <p>I am waiting for someone to discuss the exceptional cases of bang and paren/bracket following an italicized segment (worst common example: <em>d</em>+bang+paren/bracket).</p>
