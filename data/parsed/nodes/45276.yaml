      <p></p><div class="imageWrap"><img src="http://typophile.com/files/comma_6047.jpg"></div><br>
      If you don't italicize the subsequent period/comma, you will get gappy text.<br>
      Note how the comma is practically midway between words, which is silly.<br>
      When both word and mark are in the same font, the font's built-in kerning is operative, as shown.<br>
      Otherwise, you are more or less committed to manually kerning (or applying optical kerning) on an individual basis for all words ending in f, r, v, w, y--if you want to do proper typography.<p></p>
