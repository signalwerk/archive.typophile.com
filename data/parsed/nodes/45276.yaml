      <p>Here is an analysis: If you use italic for brackets (&amp; parentheses), you remove the need for hand-kerning between, say, and italic ell and the bracket.</p>
      <p><cite>[pill]</cite> as opposed to [<cite>pill</cite>]</p>
      <p>But if the word spacing is tight, and the next letter has small or negative left sidebearing and an ascender on the left, all you do with the italic close bracket is to move the kerning problem over one character.</p>
      <p>. . . <cite>[pill]</cite> languishes . . . opposed to [<cite>pill</cite>] languishes . . .</p>
      <p>The problem is even worse with a footnote call.</p>
      <p>As a book compositor, I use to prefer commas and periods following italic to be in roman. But see Nick Shinn's post, and remember that there are 7,000+ lines in a book, and hand kerning all that punctuation is not something most publishers will pay for. It also exceeds my boredom quotient.</p>
      <p>I also apparently disagree with Bringhurst. There are times following a bold word/phrase when putting the punctuation in roman makes the text look odd.</p>
