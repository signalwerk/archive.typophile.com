    html: |-
      <p><cite>I doubt that adding upright punctuation marks plus a bunch of stylistic Set Features [...] would really serve designers and typographers well.</cite></p>
      <p>Let me state the problem differently. Assume I have to edit a one thousand page book containing lots of italics, in the main text, footnotes, endnotes and  margin notes. I am asked to give out and InDesign file. The fonts I am using allow "adding functionalities". Let's assume I am experienced in adding characters to a font, kerning them to my pleasure, and adding features. Let's also assume I can write InDesigns cripts (which in fact I have never done). What next?</p>
      <p>If my only resort is InDesign scripts, the script would essentially have to automatically kern the italic against the regular; is there any good algorithm I could implement to do that? If not, I would need to provide some kerning data, and all that looks like too much work for me.</p>
      <p>I could also add a few upright characters to the italic (parentheses, brackets, braces, colon, semicolon, comma), kern them using standard tools meant for that job, and add  a single feasure, say S01, that would just mean "upright" (that is simply the converse of the <code>ital</code> feature).</p>
      <p>The rest of the job looks simple if I assume that InDesign scripts can do simple standard tasks. One task might be, given a selected text, to find the italics, and give the "upright" feature to parentheses, brackets and braces that begin and end a sequence of italics. Another script might just give the "upright" feature to punctuations. Maybe the script could be applied only to paragraphs of a certain style, for instance, paragraphs that are essentially in "regular" and where the italics are considered as embedded, and not governing the shape of adjacent punctuation. </p>
      <p>Do you have any better idea?</p>
      <p>[added] I have seen InDesign script that select the italics. I just guess the rest can be done.</p>
