      <p>I read the link. The only person who got it right was Pattyfab.</p>
      <p><cite>. . . it’s a matter of house style. Some publishers italicize punctuation directly following itals, some don’t. There’s no across-the-board consensus. It’s very frustrating actually to try to keep track.</cite></p>
      <p>We keep a list of publishers with their preferences. One publisher lets the designers decide; even within one publishing house they don't agree.</p>
      <p>BTW, publishers don't all agree on dictionaries (&amp; hence hyphenation) either. In the States, many use Merriam Webster's -- the order of use is the Collegiate, backed up by the International. Note these don't always agree, which is why the Collegiate is the "first stop."</p>
      <p>However, others use the Random House dictionary. You want to tell them they're wrong?</p>
      <p>Worse, some of us learned to hyphenate words when the Second International was the latest dictionary. In the Third International, not to mention the many subsequent editions of the Collegiate, hyphenation has changed. "Standard" is one example. But you can't be looking up every word to see if someone has changed the preferred hypenation.</p>
