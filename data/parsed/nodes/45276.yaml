      <p>Well, yes and no. The first problem is most foundries don't allow the end user to modify fonts, so with those fonts, what you propose is unlawful, illegal or something like that.</p>
      <p>But there is always Adobe, which does give the end user such a right. Thinking this through, you had better standardize on which stylistic set you are going to use -- it will be called by number in the script -- and only use, say, SS19 for that purpose. I've had to go back into a lot of fonts &amp; change more than one number as, over time, something became a standard at our shop rather than one on my whims.   </p>
      <p>Finally, everything looks right. The publishers who want terminal roman (&amp; initial) have it, publishers who don't, don't. Until you export an XML file for one who want them roman, because those nice terminal "roman" characters are really in the italic font, which isn't what they wanted.</p>
