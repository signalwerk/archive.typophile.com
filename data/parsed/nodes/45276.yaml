      <p>I don't know if it is even possible. What I had in mind was much more simple and could not handle parentheses embedded in italic text. To handle the general class of texts you describe, I would also resort to preprocessing. So far, with LaTeX inputs (sometimes obtained using <code>rtf2latex2e</code>), simple <code>sed</code> (or <code>awk</code>) scripts have been enough. I have no idea how to process the Adobe .inx format.</p>
