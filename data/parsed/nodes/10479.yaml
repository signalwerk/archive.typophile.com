    votes: 0
    html: |-
      <p>More micro crit. Either the bottom bowl of the 'u' doesn't go far enough below the baseline, or the lower right tail goes too far, or maybe a little of both. At very large sizes, the curve of the left side of the 'e' doesn't seem to match up (try temporarily removing the crossbar to see what I mean). Righthand bowl of 'R' could probably be a bit darker.</p>
      <p>Righthand bowl of 'm' may join the middle vertical stroke too low, although maybe this is the effect you were looking for. To my eye, it's a bit asymmetrical.</p>
      <p>Italic 'agy' seem a bit wide. (btw, 'vwxy' are very nicely executed! I may have to steal ideas from those). I personally miss the lower left tail on the 'f', but again that's a matter of taste. The curve on the top arm of the 'k' stands out to me - you'll note it's backwards from the curve you usually see on a Greek kappa.</p>
      <p>Misc characters. The two-stroke '$' seems especially dark. Either going to a single stroke or pulling back on the darkness of the serifs would fix that. Braces aren't very curvy, a pet peeve of mine. See how I dealt with those in my <a href="http://levien.com/type/myfonts/pr-Century-Catalogue.pdf">Century Catalogue</a>. The florin has a similar problem - the segment of the central stem which is perfectly straight should be shorter. The eszet seems topheavy, but I think that could be fixed by making it a bit narrower (especially the 's' part of the glyph).</p>
      <p>Spacing on the italic could use some adjustment. rbearing on 't' is too loose, on 'i' too tight. ge is too tight 's' seems a bit loose. I think you've overkerned the 'ke'.</p>
      <p>Overall, very nice!</p>
