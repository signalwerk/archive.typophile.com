      <p>Congrats; this is very well done. I can hardly find anything to criticize. Here's what I personally think. These are extremely minor.<br>
      -bowl of P too big<br>
      -make the top of the q bowl rejoin the stem as a hairline (don't rethicken it)<br>
      -maybe lighten lower bowl of g a tiny bit<br>
      -make the t a bit more chiral at the bottom left; also maybe a bit less smooth up top (maybe)<br>
      -x a little out of balance<br>
      -perhaps s also a little out of balance<br>
      -zero could be a bit more square<br>
      -tail of the italic g seems out of harmony for some reason--maybe not<br>
      -I can't shake the feeling that the italic f should come all the way down, or at least some farther.<br>
      -italic a needs more chirality<br>
      -rethink top italic k arm serif ?<br>
      -black k too lo-fi at join<br>
      -perhaps give black C,c a smidgen more underbite<br>
      -you mistyped "black italic"<br>
      -pi too narrow<br>
      -Euro could use a little more underbite<br>
      -maybe don't rethicken tail of eng (not sure what you would do about Eng in this case--perhaps treat it like y)<br>
      -what'choo want an etc ligature for?</p>
      <p>Most of these are so minor I can't even definitively say if I'm actually seeing them or not. Overall I think it's very near to perfected. The vision is well captured. Where does the name Nosta come from?</p>
