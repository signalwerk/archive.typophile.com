      <p>Having tweaked and tuned and generally tried to follow everyone's advice, an updated pdf can been found at:<br><a href="http://www.protimient.com/NotanuthaSerif2.pdf">http://www.protimient.com/NotanuthaSerif2.pdf</a></p>
      <p>I think I've covered all the suggestions made. I've also slightly expanded the character set (although some of the ligatures may not make it to the final version). </p>
      <p>I must admit I'm still not 100% happy with the tail of the y, but I think it's going in the right direction (metaphorically speaking). The number of different approaches I've tried is quite astounding (second only to the ear on the g, which I have spent far, far, far too much time tweaking and changing). </p>
      <p>I think I've improved the tail of the j, as well as the tail on the Q, although I'm not totally sure about it yet. Does it work? Also, is the new italic ampersand good or does it look a bit too uncial? Is the italic k working? How are my numerals?</p>
      <p>And, again, much thanks to everyone who's commented so far.</p>
      <p>Ben</p>
