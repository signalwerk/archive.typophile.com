      <p>For a first text face (or even a second or third) this is amazing. It just works. Of course there are several little tweaks and adjustments to be made, but I'm afraid that no matter how long you work on it, you'll always find someone who'll tell you to improve something else. In a sense, no typeface is ever perfect or 100% finished.</p>
      <p>I'm not really in a position to criticize your design and can only hope to be as good as you one day. However, my overall feeling is that this face looks somewhat "generic". The capitals have quite a lot of personality, as someone else pointed out, but the lower case just looks very good and clean and well-behaved, without looking personable or unique.</p>
      <p>So I guess what I'm trying to say is, if this was just an exercise in type design, you should give yourself an A+, summa cum laude.</p>
