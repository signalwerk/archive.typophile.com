      <p>So it's been an entire year (exactly) since I first posted this and over half a year since I last posted. Yes, I know, that is quite a long time... I've been busy.</p>
      <p>Since then, however, I have actually worked on it, making the semi-bold, bold and black weights and their italics, as can be seen in this third PDF (<a href="http://www.protimient.com/Nosta.pdf">Nosta.pdf</a>). I haven't included the entire character set for each font but I have put in the character set for the regular weight (all the fonts have the same quantity of glyphs), as well as the a-z's for each font and some text settings.</p>
      <p>Any feedback would be much appreciated. </p>
      <p>(Oh, and I will most probably be calling it 'Nosta' (unless anyone can suggest a good reason not to!))</p>
      <p>Ben</p>
