      <p>Thank you!<br>
      All good points (and I'm quite glad they're not major problems like "change all the serifs"; I don't think I could really handle that at this stage). I'll look in to it all and update as and when.</p>
      <p><cite>you mistyped “black italic”</cite><br>
      $*#!... damn. </p>
      <p><cite>what’choo want an etc ligature for?</cite><br>
      A good question... I think it seemed like a good idea at the time. Who knows, maybe someone, somewhere will have a use for it. And besides, what's the point of designing type if you can't make ridiculous ligatures?!</p>
      <p><cite>Where does the name Nosta come from?</cite><br>
      It's a shortened form of the working title I was using for the font, Notanutha (serif). I'd been calling it Notanutha for the last twelve months and I think I'd grown too used to it, because I never liked any of the names I came up with that were a radical departure from it. Nosta is the closest I could get to it that sounded good (and not as silly). (It's a made up word, btw.)</p>
      <p>Ben</p>
