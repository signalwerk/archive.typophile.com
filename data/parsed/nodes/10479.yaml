    votes: 0
    html: |-
      <p>First: It's nice to see somebody scouring old crits to learn stuff; that's the mark of a craftsman. Second: This is quite good for a first text face! Some of the glyphs (like the "a") have a lot of maturity. With some polish it'll be a winner.</p>
      <p>Macro stuff:<br>
      Some of your corners seem confused, or indecisive. Like the bottom-left of the foot of the "a"/"d", and inside of the top serif of the "c". Considering how nice -I think- your general angularity is (like in the spur of the "b") I would just make those sharp too.</p>
      <p>Micro:<br>
      - I'd thin out the top bowl-stem join of "d".<br>
      - The top-right of "e" is too light.<br>
      - The tail of the "j" needs to... morph!  :-/<br>
      - In the "k", that join is too choppy.<br>
      - "s": a bit wide, and top-heavy.<br>
      - "t": the head is way too timid.<br>
      - The tail of the "y" is out of character.</p>
      <p>Caps: Your proportions are nicely classical (although I'd make the "L" a bit narrower). And for some reason the tail of the "J" seems to work here, I think; so does that stub in the "K". But the disjoin in the "P" isn't working - although I think it is working in the "R". The "Q" though seems entirely too 19th century. I'd make the "U" a hair wider, and the "W" slightly wider. BTW, you're using my favorite form of "B"!</p>
      <p>Numerals: the head of the "1" is best for making the numerals fixed-width (which right now they aren't); and its base could be a lot stronger. The "4" and the "7" need more presence I think. The OS "4" isn't working.</p>
      <p>Others: the Pound has an unusally strong top, but I think it's cool. The Florin should slant. The "a" in the At should be smaller. I'd remove the x-line tick in the Eszet.</p>
      <p>The Italic is quite refreshing, and its distinction from the Roman balanced very delicately, very... 21st century - wonderful. There's something old about it, like in its long diagonal serifs, but also something new in its ampleness and gentle slant (which I like a lot). Interesting, the "f" with a partial descender; I'm glad you've left the flourish out. The "k" might need to be less Art Deco. The "&amp;" is a flop.</p>
      <p>Spacing: assuming you keep the nice slight darkishness, I would tighten it all up a bit.</p>
      <p>Overall, quite encouraging!</p>
      <p>hhp</p>
