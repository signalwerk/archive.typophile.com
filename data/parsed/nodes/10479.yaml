      <p>The "f" and "y" are rockin' now. The "g" though is starting to look more and more homey - it needs to be more elegant; try making its head smaller and its curves more rigid. The head of the "t" is out of character. The "Q" is... interesting. It might work, but I'm not sure.</p>
      <p>Italic: I'd give the leg of the "k" some pizzaz. That ampersand is novel, but I have to doubt it's good enough. The little Roman alternate is cool though. Italic spacing: a bit loose.</p>
      <p>Your blank space is too wide in both Roman and Italic.</p>
      <p>I might just remove the tick from the long-s.</p>
      <p>That's it for now, sorry...</p>
      <p>hhp</p>
