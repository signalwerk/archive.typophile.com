      <p>&gt; <em>You’re giving me mixed advice, Maxim</em>.</p>
      <p>I am very sorry for the confusion. I should have made it clearer that my referring to the design of Elizabeth was mostly in conjunction with the construction pattern of the <strong>Д</strong>, <strong>д</strong>, <strong>Л</strong> and <strong>л</strong>. I did not mean to say that <em>everything</em> in the typefaces I referred to is perfect (just have a look at the very so-so figures in Elizabeth).</p>
      <p>I consider the inconsistency in the treatment of hanging terminals (of the <strong>Ц</strong>/<strong>ц</strong> and <strong>Щ</strong>/<strong>щ</strong>) a <em>peculiarity</em> of Elizabeth's design, that may be seen, alternatively, as either charming, or quirky, or annoying, etc., but not necessarily archetypal, exemplary, and commendable.</p>
      <p>&gt; <em>Cyrillic characters can have slightly different treatments in upper and lower case</em>. [...] <em>I like the idea that there should be such a differentiation between upper and lower case</em>, [...]. <em>No doubt this is because I am used to it in the Latin script</em>.</p>
      <p>No, Nick, it's not just your personal taste, or your background. The diversification of the upper- and lower-case glyphs (the subject of this thread, b.t.w.) happens to be one of the central issues in Cyrillic type design. It presents most challenge to both the beginners, and  the experienced designers. As you've already noticed, the difference in the treatment of the u.- and l.c. glyphs ranges from obvious to very complex and subtle. That relationship varies, and takes different forms, depending on the style of the typeface. Its resolution requires substantial analytical skills, knowledge and sensitivity. This is why the mix-and-match approach, referred to by John Hudson (above), is by no means a solution.</p>
      <p>Good luck</p>
      <p><em>ps</em>: Have you tried the small caps yet? :)</p>
