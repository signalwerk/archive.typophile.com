      <p>&gt; <em>Yefimov’s recent Didona, for instance, has the ‘wrong’ kind of de and el shape, trapezoidal.</em></p>
      <p>There is nothing wrong--or even 'wrong'--with the way the <strong>Д</strong>, <strong>д</strong>, <strong>Л</strong> and <strong>л</strong> are treated in <a href="http://image3.myfonts.com/textimage/92/92ea87dddf80e490d35ec0c22f66a666.png" rel="nofollow">Didona</a>. Didona belongs to a younger generation of Moderns--the Victorian designs of the second part of the 19th century (that subcategory of <em>didones</em> also includes <a href="http://www.linotype.com/1250/monotypemodern-family.html" rel="nofollow">Monotype Modern</a>, <a href="http://www.myfonts.com/fonts/bitstream/de-vinne" rel="nofollow">Bruce No.11, a.k.a. BT DeVinne)</a>, <a href="http://www.myfonts.com/fonts/agfa/atmodern-twenty" rel="nofollow">Stephenson Blake's Modern No.20</a>, and other similar designs). B.t.w., it looks like Nick's Albany can be classified as a Victorian Modern.</p>
      <p>As I already mentioned, the <a href="http://www.hi-edu.ru/e-books/AK/images/0033-040.jpg" rel="nofollow">triangular</a> pattern in the construction of the <strong>Д</strong>, <strong>д</strong>, <strong>Л</strong> and <strong>л</strong> is typical for the <a href="http://www.hi-edu.ru/e-books/AK/images/0039-039.jpg" rel="nofollow"><em>early</em> neoclassical</a> Russian typefaces that originated in the 18th century, and fully developed in the first half of the 19th century. The serif terminal of the diagonal stroke in the <strong>Л</strong> and <strong>л</strong> was abandoned, and replaced with the bulbous finial. </p>
      <p>Around 1850s the diagonal stroke in the <strong>Д</strong>, <strong>д</strong>, <strong>Л</strong> and <strong>л</strong> started shifting off the stem, and sagging. That evolution gave birth a new construction patter, trapezoid. That scheme became very popular. With time, the angle of the diagonal got steeper, the difference in length between the top and the bottom sides decreased. Taken to the extreme in some designs, that pattern imparted to the <strong>Д</strong>, <strong>д</strong>, <strong>Л</strong> and <strong>л</strong> a totally degenerate, almost <a href="http://image3.myfonts.com/textimage/ae/ae1e70efc91160e68d09a8fc82f72533.png" rel="nofollow">rectangular shape</a>.</p>
