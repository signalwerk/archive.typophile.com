      <p>Aside from the issue of correct and faithful rendition of the revival, is there anything Nick is doing with his so called "mix and match" that hinders reading or that would be objectionable if this were not a revival and simply Nick's own new design?<br>
      I am trying to separate a few things: the nature of the Cyrillic script; the nature of the modern didone style; the nature of any typeface to feel like a system unto itself; and the nature of a given typeface as a well usable tool for reading.</p>
