    html: <p>Thomas, I understand "isosceles" to refer to the angles at the base, not the triangularity of the top. If one were being super-precise, one would refer to the shape Maxim is describing as an <a href="http://mathworld.wolfram.com/IsoscelesTrapezoid.html" rel="nofollow">isosceles trapezoid</a>. Similarly, the other common style would be technically a "right trapezoid" rather than a "right triangle," but the usage is uncommon enough that "right triangle scheme" is probably the clearest way to describe it.</p>
