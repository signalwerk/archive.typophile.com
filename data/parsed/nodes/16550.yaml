      <p><em>for instance c has a straight serif in upper case, a ball in the lower</em></p>
      <p>This is no more true than it would be if you said the same thing about Latin typefaces: it is true of some typefaces in some particular styles, but it cannot be made a general statement about the script.</p>
      <p>Yefimov's Kis is hardly 'a provocative new direction': it is an historical re-imagining of Peter the Great's Civil Type, considering how it might have looked if the model for the reform had been based on the best Dutch types of the day rather than some rather mediocre specimens. I recommend Vladimir's essay in <em>Language Culture Type</em>, which explains the whole context for his Kis type.</p>
      <p>It is important to understand what details in Cyrillic letterforms are appropriate to which styles and why. There is a tendency for beginners dealing with the script to cut and paste ideas things they've seen in various different Cyrillic types without understanding the stylistic relationships. This results in hodge-podge designs in which, to make a Latin comparison, the ball terminal from a Bodoniesque romantic type gets stuck in the middle of a Jensonesque renaissance design. Done deliberately, it might be made to work as some kind of post-modernist exercise, but it is usually done in ignorance.</p>
      <p>These comments, of course, apply to any script: they all have their own histories and stylistic evolutions and periods. Sometimes, these styles coordinate very closely to parallel developments in the Latin script, but sometimes not.</p>
