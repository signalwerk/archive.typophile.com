      <p>Right. I don't see why it has to be consistent between the cases, and it's here that I'm breaking with precedent. I realize that this is a face in an historic genre, but people today use old type in new ways, and this is particularly so of capitals. Two instances; first is drop caps, and second is the tightly leaded layout (with negative leading sometimes). In these, descenders on capitals are problematic, they get in the way. Not a problem in the 19th century, with an open, letterspaced approach to all-cap settings.</p>
      <p>&gt;I find the upper arms on your ж and к to be stiff and strange:</p>
      <p>They started out bent, but I found the effect was too fussy in text, which is why I straightened them out, which fixed the problem. </p>
      <p>&gt;The bowls of the Ф and Ч should be squarer.</p>
      <p>Thanks, I'll try that.</p>
      <p>&gt;I really recommend hiring Maxim.</p>
      <p>Sorry, I already blew my Greek/Cyrillic development budget buying "Language Culture Type" :-)</p>
