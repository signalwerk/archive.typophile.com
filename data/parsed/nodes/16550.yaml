      <p><em>do Russians consider his</em> [Yefimov's] <em>historical reimagining to be quaint, a travesty, post-modern, or not worth bothering about?</em></p>
      <p>I do not consider the treatment of the u.c. <strong>К</strong> and the l.c. <strong>к</strong> in Kis BT any of the above. Cannot speak for all Russians, though.</p>
      <p>In fact, the use of two differently-styled terminals in those letters' arms (in the same typeface) is by no means Yefimov's invention, or discovery. Check, for example, two typefaces designed by Pavel Kuzanyan -- <a href="http://www.paratype.ru/ru/library/newstyles.asp?fontcode=PT_KZN" rel="nofollow"><em>Kuzanyan</em></a> (1959/2001) and <a href="http://www.paratype.ru/ru/library/newstyles.asp?fontcode=PT_NEV" rel="nofollow"><em>Neva</em></a> (1970/2002). By the way, some style details of both Kuzanyan's designs can be traced, at least in part, to the same source as Yefimov's <em>Kis BT</em>--the Civil Type of Peter the Great, and the early Cyrillics of the post-Petrine period. There should be more examples of a similar treatment of those glyphs.</p>
      <p>The <a href="http://www.fonts.ru/E-ZINE/issue04/pictures/peter_5.gif" rel="nofollow">larger size</a> of Civil Type featured <strong>К</strong> and <strong>к</strong> with the flat top serifs. The arms of the <strong>К</strong> and <strong>к</strong> in the <a href="http://www.fonts.ru/E-ZINE/issue04/pictures/peter_6.gif" rel="nofollow">medium-size</a> Civil Type terminate in ball finials.</p>
      <p>I feel, the title of this thread calls for some kind of terminal punctuation. Maybe a question mark. Or a question mark <em>and</em> an exclamation point.  Thusly: <em>Cyrillic: equivalence of upper and lower case [?!]</em>. Square brackets are optional...</p>
