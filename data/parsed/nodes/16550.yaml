      <p>&gt;... the mix-and-match approach ... is by no means a solution.</p>
      <p>I'm afraid I'll have to differ with you on that philosophical point.<br>
      I agree that skill, knowledge and sensitivity are important, but don't see why they should preclude a "mix and match" design strategy.</p>
      <p>If one has a design theme that is assembled from elements in a mix of typefaces, it should be possible to match them together (with appropriate massaging) and get them working in a way that produces good text colour. That is always the goal. And if these elements have already appeared in historical sources, that gives them provenance and authenticity. If they are thematically associated (rather than being a peculiarity, as the hanging terminals in Elizabeth may be) then they become meaningful and significant, rather than haphazard.</p>
      <p>Here's how my theory plays out:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Russ2.jpg"></div><p></p>
      <p>And in more depth, a pdf:<br>
      <a href="http://www.shinntype.com/UN_Poly3.pdf" rel="nofollow">Albany Cyrillic sample</a></p>
      <p>&gt;ps: Have you tried the small caps yet? :)</p>
      <p>Many a true word is spoken in jest.<br>
      While some in the West think that the Cyrillic lower case already looks like small caps, this applies more to the roman than the italic. It's worth bearing in mind that one of the best uses in the West of small caps is in layouts where they are contrasted with italic upper and lower case. The idea being that the roman lower case is common, so if you want, say, a distinguished title page or contents page, then you avoid roman lower case and use just caps, small caps, and italics.</p>
      <p>So, Cyrillic small caps, to be used as a contrast face to Cyrillic italic? Yeah, I'll do it.</p>
