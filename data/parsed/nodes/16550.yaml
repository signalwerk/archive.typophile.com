      <p>&gt;Which?</p>
      <p>I agree, David, the balls have it for text.</p>
      <p>As my Cyrillic is an extension to a Latin face in the didone genre, it already has a fair sprinkling of balled terminals in the lower case. In this genre, the only upper case Latin balled character is the J; it seems that balls detract from the austere dignity of the capitals.</p>
      <p>With the exception of the Y (cyrillic U) and El, Yefimov has no balled terminals in his Kis upper case, yet in the lower case in addition to the latin y and c, he has put balls on el (as in UC), and zhe, k, and ze (different from UC). </p>
      <p>This is unlike Cyrillic didones such as ITC Bodoni, and Yefimov's earlier Didona, where there is case-consistency for balled-terminal characters</p>
      <p>Although the Kis typeface is not a didone, I'm liking the way it works, and thinking that it is the route to go. I might even go further in this general direction, and put flourished descenders on lower-case tse and shcha, but "tick" descenders on their UC counterparts.<br>
      Would that be too "hodge-podge", Maxim?</p>
      <p>I'm also considering varying the shape of de and el, making them isosceles in the lower case, and right-leaning in the UC. But that might be a bit much.</p>
      <p>BTW, studying Bodoni's Manuale (Octavo CD) for a decision from the master is pretty futile, as GB riffs through umpteen variations in different sizes, with nothing definitive. However, it is extremely enlightening, as one gets to assess options, and see how they work in context. Manuale = Laboratorio.</p>
