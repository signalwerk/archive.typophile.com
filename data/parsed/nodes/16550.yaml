      <p><em>And if these elements have already appeared in historical sources, that gives them provenance and authenticity.</em></p>
      <p>But they appear in a stylistic context, and their authenticity is linked to that context. Once you change the context, by mixing and matching forms that are normative to different contexts, you lose some of the authenticity and, yes, end up with a hodge-podge of mismatched shapes. The typical forms of the major stylistic groupings tend to be the way they are for a reason, usually found in the ductus or stroke model of the style and consistent across the letters. This is true of pretty much any script, and is why it looks odd to mix romantic and renaissance forms in the same Cyrillic typeface. Perhaps not as odd nor as culturally alien as mixing ruq'ah and nasta'liq forms in an Arabic typeface, but odd nonetheless and certainly not authentic. Authenticity cannot be gained simply by using a bunch of details from existing Cyrillic typefaces without understanding why a particular shape has been used in one place but not in another.</p>
      <p>Apart from any other criticisms of the mix-n-match approach, it simply isn't necessary: there is plenty of scope for new, original and much needed Cyrillic type designs that observe the characteristics of the major styles, and if you want to create a new style there are better ways to approach the challenge than copying and pasting bits of other styles.</p>
