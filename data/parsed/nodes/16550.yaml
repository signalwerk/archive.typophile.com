      <p>I can't add anything intelligent to this conversation, except to quote Gary Munch, <em>Ya, Arrr!</em> =)</p>
      <p>(He was talking about the tendency to think the Cyrillic Ya is the same as the Latin R, but flipped.)</p>
      <p>The question of cultural sensitivity is an interesting one. Whenever I tell a Russian that I speak (barely) the language I'm usually met with first a twinge of suspicion and then of pleasant surprise. ("You mean you were offered something other than French, Spanish or German in high school?") It's almost always a pleasant interaction, the fact that someone would go out of their way to seek out their language and learn about the culture.</p>
      <p>I bet designing Cyrillic would be welcomed -- "Hey, somebody is interested in my culture, that's cool." And even if you make some mistakes you'll at least have learned it better.</p>
