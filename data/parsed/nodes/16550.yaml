      <p>...it looks odd to mix romantic and renaissance forms in the same Cyrillic typeface.</p>
      <p>That's not what I'm proposing.<br>
      The descender I'm putting on tse and shcha is no different in form than the ascender of the be -- they have the same ductus. It's a "tilde" shape, and it's also found in the centre of the Cyrillic "E"s. It also relates to the leg of Zhe, Ka and Ya. </p>
      <p>It bothers me that in many Cyrillic faces, the top of the "be" sticks out like a sore thumb, its shape not represented elsewhere in the lower case, not even echoed. To me, this is a design flaw. That is one reason I have decided to put matching descenders on Albany's tse and shcha, to keep that poor lonely be's ascender company, waving around in the extender zone. When I first considered doing this, I had seen it in Yefimov's Kis, and was later pleased to discover that it was also in a bona fide Didone face, Elizabeth. No matter that Maxim considers this feature to be peculiar, it is still authentic.</p>
      <p>I've seen enough 19th century Cyrillic fonts by now to realize that there was considerable leeway in interpretation -- and still is. Yefimov's recent Didona, for instance, has the 'wrong" kind of de and el shape, trapezoidal. But I don't think it looks odd, he manages to pull it off, on the strength of extreme fat-face attitude.</p>
      <p>&gt;better ways to approach the challenge than copying and pasting bits of other styles.</p>
      <p>Absolutely. I always make all my glyphs from scratch, by eye, and never pirate points or trace over scans.</p>
      <p><a href="http://www.shinntype.com/tails.pdf" rel="nofollow">Small tse alternate tails (pdf).</a></p>
