      <p>&gt;&gt; I might ... put flourished descenders on lower-case tse and shcha, but “tick” descenders on their UC counterparts.<br>
      Would that be too “hodge-podge”, Maxim?</p>
      <p>&gt;Yes.</p>
      <p>You're giving me mixed advice, Maxim.<br>
      First you say don't do that, and then you recommend a typeface, Elizabeth, which has exactly that feature!</p>
      <p>Anyway, thanks for introducing me to the beautiful Elizabeth, and straightening me out about the appropriate structure for de and el. I had tried all three variants -- isosceles, right triangle, and trapezoid -- and wasn't happy with the way any of them were behaving. So I redoubled my efforts with the right triangle, and now the characters look fine. The right triangle really does harmonize with the didone style.</p>
      <p>&gt;In what way the features of Kis, a Baroque typeface, could be applicable to a neoclassical design?</p>
      <p>It's the idea that Cyrillic characters can have slightly different treatments in upper and lower case. I've since discovered that this idea exists in the Elizabeth (swash descenders on lower case tse and shcha, but not on the caps) and Bodoni 72 (round terminal on lower case k, straight on upper case K).</p>
      <p>I like the idea that there should be such a differentiation between upper and lower case, with the lower case having rounder, fuller details, and the upper case being more severe and austere. No doubt this is because I am used to it in the Latin script. It is also a feature of Greek, and even some Cyrillic character forms, such as Be.  So, I have discovered precedents in period Didone typefaces, and I have collected them together and used then in my Cyrillic. Perhaps my taste in this matter could be considered as designing with a Latin accent.</p>
      <p>I will post an example when "Insert image" is working again.</p>
