      <p>&gt;Albany can be classified as a Victorian Modern.</p>
      <p>It's a quite literal digitization of a face I found in a book published in Albany, New York State, in 1869. I think it's by George Bruce. I term this style of face, with the extreme stroke contrast, huge serifs, and tiny aperture, "Scotch modern", to distinguish it from the more restrained didone faces of Didot, Bodoni, and Walbaum. (Font Bureau calls it "Old Modern".) While it originated in Britain prior to the Victorian era, it had its largest popularity in the USA in the second half of the 19th century, and well into the 20th.</p>
      <p>The book I have is a scientific work, so it has a pretty full character representation -- but no Greek or Cyrillic.</p>
      <p>So, back to the drawing board (metaphorically speaking), and a bit more trapezoidal.</p>
