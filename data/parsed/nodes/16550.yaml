      <p>Regarding the flourished descender on the ц and щ, I disagree with the assessment in your PDF that the spike is the 'normal' form. The flourish form is perfectly acceptable in certain styles, as you've discovered. Where we disagree is about the relationship of the upper- and lowercase forms when this flourished descender is used. Normally it would be used for both cases, not just the lowercase, leaving only Д/д and Џ/џ with the spike form. [Note, by the way, that Џ/џ may have an lacrymal shape instead of a spike, i.e. wider at the bottom than at the top.]</p>
      <p>I find the upper arms on your ж and к to be stiff and strange: it would be better to follow the Scotch form and bend these arms so that the hairline is close to vertical.</p>
      <p>There are some nice things in the Albany design, but the proportions and weights of several letters need work. The bowls of the Ф and Ч should be squarer. Nick, I really recommend hiring Maxim to go through a review process on at least one Cyrillic design: even if you end up rejecting most of his recommendations regarding design characteristics, you will learn a lot about fine tuning the proportion of Cyrillic letters relative to each other.</p>
