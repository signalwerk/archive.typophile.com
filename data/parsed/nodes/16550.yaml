      <p>&gt;Didona belongs to a younger generation of Moderns—the Victorian designs of the second part of the 19th century</p>
      <p>I think you are wrong on this Maxim.<br>
      It's named Didona, and is closely related to the Didot faces of the early 19th century.<br>
      Formally, Didona lacks the "closed aperture/big serif' quality of the later Victorian or "Scotch modern" -- in this example note the small aperture to the interior space of the E in Modern 20, and the "pot hook" serif on the a.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Didonas.jpg"></div><p></p>
      <p>The De structure of Didona had been used by Yefimov before, in his version of ITC Fat Face, where it is a necessity, as there is no room for a diagonal. (The same circumstance led to the interesting lambdas in Dimitris Arvanitis's Modula Tall.)</p>
      <p>I'm not discounting your general theory of the evolution of the De shape -- but I suspect the evolution was not completely linear and all-encompassing. Despite my profound ignorance of Cyrillic type history, I would expect there to have been more variance in display faces, and during particularly experimental eras of history, as in the West.</p>
