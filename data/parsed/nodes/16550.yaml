      <p>&gt; <em>my Cyrillic is an extension to a Latin face in the didone genre</em><br>
      &gt; <em>Although the Kis typeface is not a didone, I’m liking the way it works, and thinking that it is the route to go</em></p>
      <p>Your logic defies me. Why is it "the route to go"? In what way the features of Kis, a Baroque typeface, could be applicable to a neoclassical design? Nick, I am not being dogmatic or pedantic: of course, exceptions exist. I just don't get it.</p>
      <p>&gt; <em>I might even go further in this general direction, and</em> [...]<br>
      &gt; <em>Would that be too “hodge-podge”, Maxim?</em></p>
      <p>Yes. </p>
      <p>&gt; <em>I’m also considering varying the shape of de and el, making them isosceles in the lower case, and right-leaning in the UC. But that might be a bit much.</em></p>
      <p>Without doubt... The isosceles pattern in the construction of the <strong>Д</strong>, <strong>д</strong>, <strong>Л</strong> and <strong>л</strong> is more inherent in the Old-Style designs. And the right-triangle scheme is used in most classical Moderns of the 19th century. It's like the two patterns of the capital <strong>M</strong>: the one with the slanted sides works better in Old Styles, and the one with the vertical sides looks at home in Moderns.</p>
      <p>As to Bodoni's own Cyrillics, you are right, there is not much definitive to them. They feel, and were, rather tentative. Russian typefaces of 1810s–1850s look like more valuable models. Of the ParaType library  <a href="http://www.paratype.com/asearch/ptdescription.asp?page=descr&amp;fcode=PT_ELZ" rel="nofollow"><em>Elizabeth</em></a> and <a href="http://www.paratype.com/pstore/default.asp?search=ITC+Bodoni+72&amp;fcode=PT_B72" rel="nofollow"><em>ITC Bodoni 72</em></a> seem to offer good references in designing a Cyrillic didone if you want it authentic and credible.</p>
