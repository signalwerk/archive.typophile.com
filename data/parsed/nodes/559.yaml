  - id: 4132
    user: 1025
    date: 2002-05-06T14:41:00
    date_raw: 6 May 2002 — 2:41pm
    votes: null
    html: "<p>Richard Wikstrom: <br>&gt;Only thing I would suggest is \"humanizing\" the typeface a bit. Softening it up a bit...  <br> <br>I hear you. It definetly needs \"humanizing\"! <br>Still, doing that would probably make it necessary to change a whole lot (if not everything), which I'm not really up to... <br>The \"dead\" nature of this font might be because I was very (perhaps too) systematic about it. Building the letters out of small bricks. Next time I'll try a different approach. <br> <br>&gt;The K's does seem a bit odd though.  <br> <br>Joe Pemberton: <br>&gt;I think the K is nice. Perhaps an alternate is in order.  <br> <br>Odd? Nice? In what way? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> I thought they were pretty straight-forward.. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1288.gif\" alt=\"anton_kk.gif\">  <br> <br>Here's a pic of the old k's - but I don't really like them. I think this K resembles the X too much. Also, I was thinking the new k's would probably be more readable in context with the other letters, because they are more unique? But perhaps they're too unique? <br> <br>&gt;I think that q could, out of context be mistaken for a g...  <br> <br>I've heard that before, so it's probably true. But I must admit I'm quite fond of it as it is, so I think I'll take my chances <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Jonathan Hise Kaldma: <br>&gt;The 'Q' however seems too much like your 'q'. I'd round off the top like on the 'O'.  <br> <br>Good point. I will try that. <br> <br>&gt;Also I think the 'g' is too closed. Maybe open up the lower counter.  <br> <br>I was hoping nobody would notice that! I have earlier tried to do something about it, but I thought the results didn't work out that well. I just made two new versions though, which aren't just as bad. Or, one of them isn't. I think. Here they are: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1289.gif\" alt=\"anton_gg.gif\">  <br> <br>I sort of like the black one. But maybe the space in the middle (excuse my complete lack of english typographic words!) is still too small? <br> <br>Thank you all (including you Hrant) for the nice words - it went smoother than I expected... <br> <br>-Mads Rahbek Hougaard</p>"
    html_clean: "<p>Richard Wikstrom: <br>&gt;Only thing I would suggest is \"humanizing\" the typeface a bit. Softening it up a bit...  <br> <br>I hear you. It definetly needs \"humanizing\"! <br>Still, doing that would probably make it necessary to change a whole lot (if not everything), which I'm not really up to... <br>The \"dead\" nature of this font might be because I was very (perhaps too) systematic about it. Building the letters out of small bricks. Next time I'll try a different approach. <br> <br>&gt;The K's does seem a bit odd though.  <br> <br>Joe Pemberton: <br>&gt;I think the K is nice. Perhaps an alternate is in order.  <br> <br>Odd? Nice? In what way? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> I thought they were pretty straight-forward.. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1288.gif\" alt=\"anton_kk.gif\">  <br> <br>Here's a pic of the old k's - but I don't really like them. I think this K resembles the X too much. Also, I was thinking the new k's would probably be more readable in context with the other letters, because they are more unique? But perhaps they're too unique? <br> <br>&gt;I think that q could, out of context be mistaken for a g...  <br> <br>I've heard that before, so it's probably true. But I must admit I'm quite fond of it as it is, so I think I'll take my chances <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Jonathan Hise Kaldma: <br>&gt;The 'Q' however seems too much like your 'q'. I'd round off the top like on the 'O'.  <br> <br>Good point. I will try that. <br> <br>&gt;Also I think the 'g' is too closed. Maybe open up the lower counter.  <br> <br>I was hoping nobody would notice that! I have earlier tried to do something about it, but I thought the results didn't work out that well. I just made two new versions though, which aren't just as bad. Or, one of them isn't. I think. Here they are: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1289.gif\" alt=\"anton_gg.gif\">  <br> <br>I sort of like the black one. But maybe the space in the middle (excuse my complete lack of english typographic words!) is still too small? <br> <br>Thank you all (including you Hrant) for the nice words - it went smoother than I expected... <br> <br>-Mads Rahbek Hougaard</p>"
