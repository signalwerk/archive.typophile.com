  html: "<p><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"mrh_anton.gif\">  <br> <br>First of all: what a great initiative! Your comments and work is a great inspiration to me.  <br>This here is my first font. I mainly made it to to get experienced with the software, thus the utter simplicity of it.. it's been lurking around my hard drive for quite some time now, so I think it's about time I finish it <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br>Any comments as to what I should do better? <br> <br>Thank you, <br>Mads Rahbek Hougaard</p>"
