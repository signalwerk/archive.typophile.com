  html: |-
    <p><a href="http://www.baselinefonts.com">http://www.baselinefonts.com</a></p>
    <p>Baseline Fonts announces the release of several new typefaces this week, including Rough Egyptienne™, Grit Egyptienne™ and Antimony™.</p>
    <p>Rough Egyptienne™ is a three-font family including Regular, Italic and Left Oblique. It is nicely worn but highly legible even at small point sizes.</p>
    <p>Grit Egyptienne™ is an eight font family designed with heavy grunge in mind. The distressed look is what lead to the formation of Baseline Fonts - but now designers seem to be more willing to really extend even further into worn and nicely throttled type treatments. Grit Egyptienne™ and alternates are interchangeable to provide an endless array of variation in a block or single line of type.</p>
    <p>PDF specimen sheet is available for download: <a href="http://www.baselinefonts.com/sample-gritegyptienne.pdf">http://www.baselinefonts.com/sample-gritegyptienne.pdf</a></p>
    <p>Antimony™ is a vertical typeface with delicate, worn flairs and includes a regular version as well as a distressed version.<br>
    PDF specimen sheet is available for download: <a href="http://www.baselinefonts.com/sample-antimony.pdf">http://www.baselinefonts.com/sample-antimony.pdf</a></p>
    <p>Coincidentally, all three new typefaces enable a significant number of characters to be packed into a relatively small footprint.</p>
    <p>All fonts are available directly through the Baseline Fonts website (<a href="http://www.baselinefonts.com">www.baselinefonts.com</a>) and should be available through all Baseline Fonts vendors over the next few months.</p>
