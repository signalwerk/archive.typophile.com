  html: <p>Hi Typophiles! <br> <br>I was wondering about the origins and the further development of the so called pilcrow sign. All that i found was this small text. Does anybody of you know more about the "clenched fist with the index finger extended, pointing right"? <br>How it looked like in the different epochs and how it was used? <br>Thanks! <br> <br>hannum <br> <br> <br></p>
