    html: <p>I've never heard the "fist" explanation. It sounds suspicious to me. There is a history of printer's fists with fingers pointing, used to draw attention, but I believe these derive from the 19th century and have never heard of them having anything to do with the pilcrow or paragraph mark. <br> <br>The pilcrow began as an ornate form of the letter 'C' -- for "capitulum" -- and marked the head of an argument or thesis. You can see this form still in use in typefaces like Centaur which are based on the earliest type forms.  <br> <br>I don't recall exactly the evolution toward the current "backward P" form, but Hrant might have the references handy. Do you still have a copy of Parkes, Hrant? <br> <br>-- Kent. <br> <br></p>
    html_clean: <p>I've never heard the "fist" explanation. It sounds suspicious to me. There is a history of printer's fists with fingers pointing, used to draw attention, but I believe these derive from the 19th century and have never heard of them having anything to do with the pilcrow or paragraph mark. <br> <br>The pilcrow began as an ornate form of the letter 'C' -- for "capitulum" -- and marked the head of an argument or thesis. You can see this form still in use in typefaces like Centaur which are based on the earliest type forms.  <br> <br>I don't recall exactly the evolution toward the current "backward P" form, but Hrant might have the references handy. Do you still have a copy of Parkes, Hrant? <br> <br>-- Kent. <br> <br></p>
