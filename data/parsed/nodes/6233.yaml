    html: <p>if this helps with your research, i've also read printer's fists referred to as "bishops fists" (baseline magazine No 37, page 34). also on page 43-44 of rick poynor's book <i>typographica,</i> an article in a 1953 issue of herbert spencer's magazine of the same name entitled, "a show of hands" by charles hasler about printer's fists is references; the book reproduces a portion of this article, including some beautiful examples of fists and their origins, and if your eyesight is good you can read a some of this article, which includes a discussion on how "the only outstanding designer to turn his attention to the design of fists has been Eric Gill..." the issue of the magazine itself i suspect would be very difficult to track down... (i've checked on ebay for old copies of the magazine, no luck). anyways, that's all i can think of for now. ciau!</p>
