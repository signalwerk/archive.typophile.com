  html: |-
    <p>I'm preparing this typeface based on the 'architectural' handwriting of a good friend. </p>
    <p>The idea is that it should resemble the handwriting used for marks on architectural drawings and things of the sort. </p>
    <p>In the first place it will be bilingual (english and greek monotonic), and soon it will, hopefully, be "equipped" with polytonic support and german language support. </p>
    <p>Your comments/critique are more than welcomed. =) </p>
    <p><a href="http://utopia.duth.gr/~vkarageo/architectural.jpg" title="http://utopia.duth.gr/~vkarageo/architectural.jpg">http://utopia.duth.gr/~vkarageo/architectural.jpg</a></p>
