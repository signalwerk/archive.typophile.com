      <p>Sorry, don't know this type. A few similars though: <a class="freelinking external" href="http://www.myfonts.com/fonts/madtype/mercado/" rel="nofollow">Mercado</a> (global design very close, some cuts off and totally different /1) and <a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/colonel/" rel="nofollow">Colonel</a> (right /1, right cuts but overall design looks different, mainly for /S), <a class="freelinking external" href="http://www.myfonts.com/fonts/dimitrelima/0arame/" rel="nofollow">Arame</a> (part of the /S, looks too techy), <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/double-dagger/" rel="nofollow">Double Dagger</a><br>
      The easiest way would probably be to directly ask designer/agency in charge of this design.</p>
