    html: |-
      <p>Font Book's a stinker, activating fonts by moving files to the fonts directory. I'm surprised it's still doing it that way as there used to be many tales of woe. I can't suggest how to restore the sets, but you might like to look into better font management software for future happiness. I use <a class="freelinking external" href="http://www.linotype.com/fontexplorerX" rel="nofollow">Linotype's free FontExplorer X</a>. Which is fantastic at everything bar printing specimines. The built-in iTunes like shop is brilliant too -- you can quickly search for most things and get good (though usually brief) historical information really quickly. </p>
      <p>Thinking about it, on first run I think you can have it organise everything, so it might solve your Font Book mess if you point FontExplorer to the directories Font Book moved things into.</p>
