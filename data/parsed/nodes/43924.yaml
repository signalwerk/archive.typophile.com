    <p>I am sure I am not the only one that has fallen victim to the font book badness. I had all of my fonts neatly collected into the folders in which they should  be. House industries,  Carson.... yada yada...</p>
    <p>Apparently when I activate them in font book it pulls them from that folder. Does anyone know a way to recollect them from font book and put them back into the folders they were pulled from?</p>
