    <p>I've just released a new version of vectorian, the essential vector pack to create vintage designs: <a href="http://www.vectorian.net" title="http://www.vectorian.net">http://www.vectorian.net</a><br>
    Hope you will like the new design!</p>
    <p>Also, I've released for free some amazing vector flourishes, vectorized from the famous Foundry catalog George Bruce's Son &amp; Co, published in 1882.<br>
    <a href="http://www.vectorian.net/download-free-vector-ornaments.html" title="http://www.vectorian.net/download-free-vector-ornaments.html">http://www.vectorian.net/download-free-vector-ornaments.html</a><br>
    All these free packs are released under the Creative Commons license.</p>
