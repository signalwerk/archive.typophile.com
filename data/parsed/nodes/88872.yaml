    html: |-
      <p>While the examples are bad, especially the first one, you have to realize that most people do not see things the way typographers do. Because we are tasked with eliminating bad kerning, our eyes immediately spot the problem. To others, there is no problem (unless they are the minority that read a space instead of the bad kern).</p>
      <p>It would be interesting to find out how many non-typographer/designers can spot the problem with these samples. I suspect most of them will look for spelling and/or grammar errors, and totally ignore the typography. Ask your partner (if they are not in the field), and see if my theory holds water.</p>
