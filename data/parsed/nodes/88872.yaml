      <p><em>To others, there is no problem…</em></p>
      <p>Sure, if you ask them, most listeners might not be able to detect a wrong note, but that’s not the issue.</p>
      <p>If designers addressed every aspect of their work on a similar basis, then there really would be a problem. So it’s better to never let your guard down.</p>
      <p>As for spelling, people will read what they expect, but that’s no excuse for incorrect spelling, even though it may go unnoticed.</p>
