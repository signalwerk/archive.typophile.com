    html: |-
      <p>I for one am glad that Optical Kerning is not on by default in whatever program created this title.<br>
      So that’s why plain old Georgia (no kerning) looks like this.<br>
      Interestingly, the Segoe Script setting uses contextual alternates, presumably on by default.</p>
      <p>One should be more concerned that the designer chose such mundane bundled fonts, which expresses a certain disdain for the subject matter, even if such dependence on bundled fonts were occasioned by ignorance of more sophisticated alternatives.</p>
