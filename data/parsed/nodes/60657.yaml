    html: |-
      <p>I've always wondered about that first one. I don't think it's a real computer font from the when the film was made (1979). For one thing, it's proportional, not monospaced. It also seems like it has a lot of subtle curves and other details, which would mean it's probably not a bitmap font. My best guess is that it was set with conventional typesetting, animated on film or video and displayed on green-screen monitors. Still don't know what the typeface is. Could be custom. Whatever it is, it appears to be stretched horizontally. I tried condensing it, but it still doesn't look like any typeface I know.</p>
      <p>The second one appears to be a bitmap font based somewhat on Eurostile. (Square 721 is a clone, BTW.) It also appears that the smaller sizes were scaled down from the larger bitmap. You can see the usual distortion that happens when you do that.</p>
    html_clean: |-
      <p>I've always wondered about that first one. I don't think it's a real computer font from the when the film was made (1979). For one thing, it's proportional, not monospaced. It also seems like it has a lot of subtle curves and other details, which would mean it's probably not a bitmap font. My best guess is that it was set with conventional typesetting, animated on film or video and displayed on green-screen monitors. Still don't know what the typeface is. Could be custom. Whatever it is, it appears to be stretched horizontally. I tried condensing it, but it still doesn't look like any typeface I know.</p>
