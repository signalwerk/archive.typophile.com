    html: |-
      <p>I think the first one looks like a customized version of <a href="http://new.myfonts.com/fonts/berthold/city-be/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Berthold City</a>. All you have to do is make the serifs full and it's very close. The numerals seem to match as is. Optically widening it would have been easy, if they were using photo-type. City was designed in 1930, so it would have been available.</p>
      <p>The other option is that it might actually have been a computer screen font, even though Mark didn't think so. Each computer system had its own built-in screen font in those days, I believe, and they were probably editable through software.</p>
      <p>- Mike Yanega</p>
