    html: <p>I second Mark's assumption that the font isn't a computer font. The screen looks too clean, there are no scanlines or distortions like they are typical on CRT screens. All the other computer screens used in the movie (on the bridge mainly) have scanlines and look like typical CRT monitors but mothers screen doesn't actually fit right in there with the rest of the (rather rundown) ship.</p>
