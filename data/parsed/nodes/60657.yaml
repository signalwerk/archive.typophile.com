    <p>Hi font folks,</p>
    <p>I need your advice once again! I'm looking for two fonts that were used in the Alien movies, one in 'Alien' as the screen font of Mother (the board computer), the other is a font that was shortly used in 'Alien 3'. I've linked to two stills that display the fonts used ...</p>
    <p><a href="http://files.hexagonstar.com/?view=./images/movie/snag_0064.png">http://files.hexagonstar.com/?view=./images/movie/snag_0064.png</a><br><a href="http://files.hexagonstar.com/?view=./images/movie/snag_0182.png">http://files.hexagonstar.com/?view=./images/movie/snag_0182.png</a></p>
    <p>I would be extremely grateful if somebody could tell me what font types these are!<br>
    Thanks a lot,<br>
    loungelizard</p>
