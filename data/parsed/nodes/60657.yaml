      <p>Mike, you pretty much nailed it. It's Berthold City Light, not modified. The light weight has the serifs that are missing on the bolder weights. The heaviness seen in the sample is no doubt from the glow of the video screen. The letters are scaled to exactly 200% of the normal width and tracked out about 120-160 em units. Check it out:</p>
      <p><img src="/sites/default/files/old-images/alien1_5242.png"><br><img src="/sites/default/files/old-images/alien2_5898.png"></p>
