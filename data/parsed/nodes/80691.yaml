    <p>I cannot find the thread, in which we had collected German words with three f in a row. I just was bitten by a <em><a href="http://taz.de/1/politik/deutschland/artikel/kommentarseite/1/sprengstoffanschlag-vereitelt/kommentare/1/1/?tx_skpagecomments_pi1[showComments]=1&amp;tx_skpagecomments_pi1[success]=1#CommentForm#polloftoday" rel="nofollow">Sprengstofffund</a></em>.</p>
    <p>For those ones, that don’t understand German:</p>
    <p>A Sprengstoffhund is a dynamite (detection) dog.<br>
    A Sprengstofffund is a dynamite found.<br>
    “Und” means “and” and  “Hund” means “dog” in English.</p>
