    html: |-
      <p>Of course, the most obvious changes are: </p>
      <ul>
      <li>the extended character set. <a href="http://www.linotype.com/en/43839/aldusstdroman-charactermap.html" rel="nofollow">Aldus Roman OT</a> contains 408 glyphs, while <a href="http://www.linotype.com/en/109960/aldusnovacombook-charactermap.html" rel="nofollow">Aldus nova Com Book</a> has 677. Most of them are due to the added support of Central European languages. But Linotype also has added a number of ligatures, ordinals, superscript letters and a wider set of figures.</li>
      <li>the added Bold and Bold Italic</li>
      </ul>
      <p>It seems every single character has been revised and altered – sometimes sightly, sometimes strikingly (Q, s, t, …).<br>
      The ascender length has been reduced drastically.<br>
      Looking at the italic f, w or y, I have to say that I liked the classic (digital) Aldus better. The new version looks less characteristic. Or less quirky? Maybe it is just a matter of getting used to the new. Maybe Aldus nova has a better colour. And it certainly does integrate better with the other Palatino nova family members.</p>
      <p>I think it is impossible to draw any conclusions without having a couple of printed pages, in both versions with otherwise equal settings.</p>
      <p>Btw, <a href="/wiki/John%20D.%20Berry" class="freelinking" rel="nofollow">John D. Berry</a> wrote an <a href="http://www.creativepro.com/article/dot-font-hermann-zapf-at-87" rel="nofollow">article about Hermann Zapf and the development of the Palatino nova family</a> for creativepro.com.<br>
      F</p>
