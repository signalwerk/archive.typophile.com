      <p>"Leica" is an old, custom logo and I'm not sure your 'll find an associated font (at least not in digital format) - maybe you should look for something similar.</p>
      <p>"zinkia" must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=T-26&amp;ffam=Xyperformulaic2.1%20SB%20-%20Regular&amp;fid=a91e1765df5f9de7a1e2ac19502ef714&amp;fsize=60&amp;text=zinkia&amp;wrap=2" rel="nofollow">Xyperformulaic Bold</a></strong> by Matius Gerardo Grieck (T-26, 1997)<br>
      with a bit modified /z</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
