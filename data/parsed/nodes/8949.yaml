  - id: 58560
    user: 5815
    date: 2005-01-29T01:39:00
    date_raw: 29.Jan.2005 1.39am
    votes: null
    html: "<p>#4 is indeed a font, after all! Not at dafont, though. I just checked through the whole section (suggested by Ryan), and came up with nothing. Then I remembered fontgarden's gallery (found at fontgarden.com)...since there are tons of script handwriting fonts there, I thought I should at least find something similar. And voila! Not similar, but exact: Cindywrite. <br>Thought I would share, in case anyone else was wondering <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br>Well, that's two down...and I wonder if #2 is actually a font, too. I do really hope the first one is a font, that's the main one I'm hunting :-D</p>"
    html_clean: "<p>#4 is indeed a font, after all! Not at dafont, though. I just checked through the whole section (suggested by Ryan), and came up with nothing. Then I remembered fontgarden's gallery (found at fontgarden.com)...since there are tons of script handwriting fonts there, I thought I should at least find something similar. And voila! Not similar, but exact: Cindywrite. <br>Thought I would share, in case anyone else was wondering <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br>Well, that's two down...and I wonder if #2 is actually a font, too. I do really hope the first one is a font, that's the main one I'm hunting :-D</p>"
  - id: 58561
    user: 2088
    date: 2005-01-29T07:24:00
    date_raw: 29.Jan.2005 7.24am
    votes: null
    html: "<p>Just wanted to be clear that what I said about Number 4 was that it was an 'amateur font'. I didn't mean to create the impression that it wasn't a font.  <br> <br>The problem with identifying fonts like that is that you have to be lucky to find them in most cases, unless they are VERY popular, or very distinctive. I appreciate knowing about the Fontgarden site, because I now know a good place to refer people who have a quest like the one you were on. <br> <br>There are too many of those home-made fonts to possibly catalog them all, so I think you were lucky to have spotted that one in their collection. <br> <br>Thanks for sharing what you found. <br> <br>As for your #1 font. Have you looked at some of the scrapbooking sites? I have seen some fancied-up fonts like that at Letteringdelights.com, but be warned that you have to wait a while for the catalog  pages to download.</p>"
    html_clean: "<p>Just wanted to be clear that what I said about Number 4 was that it was an 'amateur font'. I didn't mean to create the impression that it wasn't a font.  <br> <br>The problem with identifying fonts like that is that you have to be lucky to find them in most cases, unless they are VERY popular, or very distinctive. I appreciate knowing about the Fontgarden site, because I now know a good place to refer people who have a quest like the one you were on. <br> <br>There are too many of those home-made fonts to possibly catalog them all, so I think you were lucky to have spotted that one in their collection. <br> <br>Thanks for sharing what you found. <br> <br>As for your #1 font. Have you looked at some of the scrapbooking sites? I have seen some fancied-up fonts like that at Letteringdelights.com, but be warned that you have to wait a while for the catalog  pages to download.</p>"
