  html: |-
    <p>Hi there</p>
    <p>I'm in the middle of laying out a book for the first time; I know a small bit of InDesign and am fairly ok with character styles.<br>
    What I'm not so clued up on is importing text from MS Word into InDesign. Here's my problem...</p>
    <p>I had effectively laid the entire book out, using text copied and pasted (not imported) from Word, and painstakingly manually<br>
    applied character styles (italics where needed, superscript etc...). I realise now not the cleverest way to do it, but anyway, it's done.<br>
    BUT – the client has now come out of nowhere with a rewrite of the text, and a fresh set of word files (no track and change and it's not an option for me to ask for this). </p>
    <p>What I want to find out is if, rather than me having to go through that whole slow, clunky process again, is there a way to link the current InDesign layout to the new Word files and somehow get it to update with all character styles intact? Does that make sense?</p>
    <p>Any help appreciated, sorry in advance if this is a basic thing to ask!</p>
