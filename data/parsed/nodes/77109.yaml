    html: |-
      <p>Don't forget that you can do "Compare documents" back in Word (as a sort of retrospective 'track changes') to see what he's amended (assuming it's not 100% different!). I occasionally find people resubmitting new manuscripts after the typesetters have started work on what was supposed to be the final version, and sometimes it turns out there's one new paragraph in the middle, and the odd word changed here &amp; there, and that's it...</p>
      <p>(Worse is when you send 'em a PDF proof, and they export it back into Word, make changes, and send THAT back to you. <em>Noooooooo, you f***ers</em>!!)</p>
