    html: |-
      <p>If you want to import styles or style sheets, import the text via the File &gt; Place command. When you're asked to navigate to the file to place, be sure the "Show Import Options" checkbox at the bottom is checked. This will bring up the screen of import options shown below, and you can tell InDesign how to handle the Word file's style sheets. See InDesign's "help" files for more info about what the various options do.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/screen-shot-1b_6115.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/screen-shot-2b_5294.jpg"></div><p></p>
