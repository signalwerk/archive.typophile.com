      <p>The symbol lacks definition.<br>
      Too many bubbles, colours too close.<br>
      Small, looks like a vaguely triangular smudge.<br>
      If ever in print, hard to reproduce, will go very dull in process colour.</p>
      <p>No doubt it demonstrates the rationale nicely ("a bunch of grapes, the different colours representing the variety of wine"), but if one is being literal, what has a cloud of coloured balloons got to do with wine?<br><img src="/sites/default/files/old-images/up-movie-1_4254.jpg"></p>
