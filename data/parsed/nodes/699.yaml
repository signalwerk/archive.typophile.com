    html: <p>Hello everyone! I got back to Vancouver this afternoon and after 5 hours of much needed sleep, it's great to see you guys here talking about the conference already! Armin, your report is excellent! Yes, the conference was just amazing. It was way beyond my expectations! I enjoyed it so much. It was a little weird at first to meet some of you in person after having known each other online, nothing can substitute a real meeting! I think we have to thank our online community for uniting us beforehand, which is partially why this event was so successful. I now know I have real friends all over the country/world that share a common passion! Of course we have to thank Tamye and SOTA, for their tireless work putting together such a well-organized and content-rich conference! Well done! I'll be back... I'm so tired I can't really think straight right now. I'll get myself organized and write up something on my site soon.</p>
