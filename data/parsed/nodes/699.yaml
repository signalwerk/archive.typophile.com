    html: <p>Friends and fellow Typophiles. My heart and mind are the both of them full.  <br> <br>TypeCon was amazing. The event itself was well-planned and well-executed!! But it was the people that "made the pudding". Being able to talk with others whom are as obsessed and in love with letters as much as am I, well, it left me content and happy and overwhelmed. All at the same time.  <br> <br>The conference high points for me were Letterror's presentation of their Metro (for reason's both obvious to those whom also attended, and a few reasons better left unwritten) and Peter Bilak's "Tschaikovsky Ballet". It was Tschaikovsky, wasn't it? &lt;<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">&gt; <br> <br>Jon, your summation is perfect. P-E-R-F-E-C-T!!  <br> <br>Meeting all of you, putting names to faces (and with this mind hopefully they'll stick) ... The internet is wonderful, but you certainly cannot replace the human warmth that comes from sharing your personal space with someone that understands your passions in life. <br> <br>I'm completely exhausted, but in a did too much, didn't sleep enough, didn't want to sleep, kind of way. <br> <br>For those that didn't go this year, create a little piggy-bank and start saving NOW!! <br> <br>Be proud of the little neighborhood that you've created here at Typophile. <br> <br>I'm going to bed now, 5 hours earlier than the last few nights. Possibly I'll have more thoughts to add tomorrow. For now I go to bed with a smile of satisfaction on my face.  <br> <br>Oh, and one more thing. Kristin, you rock!  <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
