    html: "<p>10 things Stephen Coles (might have) learned at TypeCon 2003: <br> <br>Hermann Zapf thought of himself as, foremost, a book designer. <br> <br>Chank enjoys mowing. <br> <br>The answer to the following trivial question: \"If you were a collector of Matthew Carter's typeface designs, which type technology would you (currently) be missing?\" <br> <br>To improve his faces, WA Dwiggins wanted to get \"closer to the machine.\" <br> <br>The twin cities (and typefaces thereof): more interesting than non-mid-westerner might assume. <br> <br>If you want your signage to be readable, you test it. <br> <br>Letterpress is addictive. <br> <br>The road to typography goes through one's self. <br> <br>\"I'm using type as image\" is not an excuse for typographic ignorance. <br> <br>TypeCon 2004 will be in the bay area.</p>"
