    html: "<p>I'm here, I'm here. I've been putting a review of TypeCon together, and I have so much stuff to say. It's going to take more time than I thought. I'll let you all know when I'm done. <br> <br>And well, I guess I have to step up to the plate and put my dream in writing and in Google's cache for generations to come. So here it is, uncensored, unbiased and with Hrant's blessing: <br> <br>I dreamt that Hrant came to my house, the weird thing is that it was his typophile picture only (since that is as far as I know what Hrant looks like). So he came in, and went \"Number Two\" in my bathroom without flushing, after that, he headed out to the kitchen to hang out and stuff. So I go into my bathroom and see these unflushed turds in my toilet. I go up to Hrant and say \"Excuse me, Hrant, you left your turds in my toilet.\" His response involved handing me a plunger and adding \"This should fix it.\" And that was it.  <br> <br>Freud would have a field day with this one.  <br> <br>TypeCon rocked! <br> <br>Oh, regarding the \"f\" word stuff, did anybody notice that I actually never said •••• during the talk?</p>"
