  html: <p>holy cow! what an awesome time i had in minneapolis. now i'm all excited because i actually know fellow type-heads on this site. probably the best part for me was just meeting people in the community and making personal connections. i always love making new friends, and am already excited about the prospect of returning next year, to hang out and meet even more of you fine folks. as far as the actual program goes, my favorite stuff was the lettering workshop with ken barber, the letterpress tomfoolery on friday afternoon (what's this colored stuff on my hands?), and the typeface; twin cities presentation. well, who can forget armin's repeated mention of "the f-word" during the blog panel discussion? funny stuff.  <br> <br>so, what was your favorite part everyone?</p>
