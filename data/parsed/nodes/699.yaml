    html: <p>Nice report Armin. I'm sorry a small joke about the candor <br>of SpeakUp became its mantra during the conference. I <br>wish people would just ••••-off. <br> <br>Tyler - was a pleasure to meet you. You are a good man,  <br>and funny. <br> <br>Kristin is the coolest. She is both the mom you wish you  <br>had and the distant friend you wish was living nearby,  <br>dispensing wisdom and humor with humilty <br>and ease. <br> <br>Praise to Mr. Coltz for gracing Typophile with his presence. <br>His posts from today are all indicative of the quality we can <br>expect from Jon. His writing is better than his dancing <br>(fortunately, we all have a much greater need for the former). <br> <br>Dyana, I envy your job and latin moves. Glad to finally meet <br>you, and I look forward to your FB releases. <br> <br>Mark Simonson probably didn't detect it, but I was in such <br>giddy awe of his presence at my table during lunch on <br>Saturday that I couldn't eat my quesadilla. What a friendly, <br>amiable fellow, full of talent, and willing to share. Mark <br>personifies the best aspects of TypeCon. <br> <br>Keith - Please monogram my linen. Your lettering skills are striking. <br> <br>Jared &amp; Joe - I expect you to post the video coverage of our  <br>panel discussion soon. It will prove that you two are the <br>driving force behind today's typographic dialogue and  <br>community. Without dominating the panel, you directed the <br>discussion down the most prudent path. I was proud to  <br>share the TypeCon experience with a couple of Utahns. <br> <br>John B, Chris, and the others. It really was grand to meet <br>your faces. I wish I had more time to spend with you. Next <br>year, for sure. <br> <br>Tiffany Wardle is the best roommate ever. I suggest you all <br>consider bunking with her at AtypI.</p>
