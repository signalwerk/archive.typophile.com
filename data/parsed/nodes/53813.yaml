      <p>AIGA says it like this:</p>
      <p><cite>Creative/design director<br>
      A creative director or design director is the creative head of a design firm, advertising agency or an in-house corporate design department. In all of these areas, key responsibilities can include the development of graphic design, advertising, communications and industrial design publications.<br>
      </cite><br>
      <cite>Art director<br>
      The art director establishes the conceptual and stylistic direction for design staff and orchestrates their work, as well as the work of production artists, photographers, illustrators, prepress technicians, printers and anyone else who is involved in the development of a project. The art director generally selects vendors and, if there isn’t a creative director on staff, has final creative authority.<br>
      </cite><br>
      (what Nick said)<br>
      <a href="http://www.designsalaries.org/definitions.html" title="http://www.designsalaries.org/definitions.html">http://www.designsalaries.org/definitions.html</a></p>
