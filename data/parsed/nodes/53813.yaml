      <p>My opinion is that in an ad agency setting, by the time you've been in the business 3-5 years, an AD should be able to come up with headlines and copy direction (though not necessarily write finished copy), and a writer should be able to visualize and describe accurately the look and feel of an ad (though not necessarily be able to draw, design or art direct). The most effective people I've seen in either discipline have been able to do that.</p>
