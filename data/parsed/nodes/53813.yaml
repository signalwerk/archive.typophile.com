      <p>It's not really traditional... those job descriptions Nick wrote still pretty much hold true in the advertising industry. Art Director and Copywriter teams present to the Creative Director(s) who have the final say in what concepts go to the client.</p>
      <p>It's true there is a lot of overlap now between Art Director and Graphic Designer now though. Previously the Art Director would do concept development and then hand a large portion of the design work to the Graphic Designers. Now Art Directors generally design (pixel push) the layout and look, and rely on Graphic Designers for expanding the concept look and feel into other sizes or medias.</p>
      <p>Glenn, most creative directors started out as art directors and copywriters, so they do know how to use the programs and stuff. When you're promoted to Creative Director it's more your role to oversee the entire creative department and give the thumbs up/thumbs down to what gets through - the idea being at that level you're probably a genius at strategy and what sells or whatever.<br>
      I found at the larger agencies the CD's never really did any design work themselves.. just provided feedback to the rest of the team regarding layout and strategy. But at smaller agencies it wasn't uncommon for CD teams to brainstorm with us or take on briefs themselves. The agency I work at now is around 90 people, and I often work with a CD team on projects. They make me do most of the design work though :)</p>
    html_clean: |-
