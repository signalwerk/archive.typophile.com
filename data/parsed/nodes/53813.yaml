      <p>To follow up on Nick's point, ad agency Creative Directors almost always come from the copy side. Rarely does an AD rise to become a CD in the ad world.</p>
      <p>I remember attempting to do a custom typeface for the CD (who came from copy and was in the business for years). I would show him test words and his comments were completely unhelpful in communicating what he was after. After several rounds he said that he liked what I did, but wished it were more musical, and that he was asking everyone on the project to listen to music (any music) while the worked on the campaign.</p>
      <p>He was fired and I got a kill fee.</p>
