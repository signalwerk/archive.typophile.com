      <p>There's probably no clear distinction on salary websites because the titles are so abstract now. Traditionally the Art Directors would present their ideas to the Creative Directors who would give feedback and yay/nays.. but everything is more blurred now. For instance the place I work as an Art Director, the Creative Directors are called Senior Partners and sometimes I work with them on projects. The Project Managers are called Producers, which is traditionally the name of people in production, but now we call the production people Developers.</p>
      <p>Also in advertising the Creative Directors could have either come from an Art Direction OR Copywriting background.</p>
