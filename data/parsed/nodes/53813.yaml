    html: <p>They seem like somewhat subjective terms based on the firm/company. Probably could be used interchangeably, however, my Creative Director tells my Art Director what to do. Personally I don't like the term "Director". The director of a movie usually doesn't act. The director of a band usually doesn't play lead guitar. The athletic director of a university usually doesn't play on the team. You get the idea. My point - that my Art Director still does plenty of graphic design but coordinates client requests, tracks time, bills clients works with print vendors, and many other tasks.</p>
