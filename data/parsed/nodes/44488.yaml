      <p>Thank you Mickey &amp; Stephen for your accurate comments. I’m fully agreed.<br>
      The comparison with Officina is not a surprise because Vista Sans was inspired by <a href="http://www.emigre.com/EFfeature.php?di=200">Spiekermann</a>  shapes - like Meta - and when I added serifs to Vista Sans, I kept in mind Officina but I deliberately didnt oserve it and tried - in vain - to forget it.</p>
