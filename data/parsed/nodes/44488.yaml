      <p>Thanks Coles for your observation. I would have not readily correlated a Officina and Vista slab. Nice catch.</p>
      <p>Personally, looking at the two designs here, I would say that Officina is a little bit more well thought out in terms of low-res printing and reader cognition. Notice the inktraps on the r, a, u, and the p. Also, the diacritics seem a little bit more friendly to the designer short on vertical space. Vista Slab looks more like a stylistic expansion as opposed to a learned industrial-strength compact multi-use type system. (Of course, I don’t know what I’m talking about, but anyway)</p>
      <p>Nevertheless, I’m totally digging it. You like the lowercase italic g, I love the lowercase italic x and k. </p>
      <p>Mikey :-)</p>
