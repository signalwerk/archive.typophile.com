    html: |-
      <p>One positive: your home page is not too busy. It's clear what you do and how to use the site. That's a great start.</p>
      <p>On version 1: Nix the arrow graphic and use a real word (English to Portuguese) or punctuation (English / Portuguese). If you really want the arrow, use a typographic arrow, preferably one from the same font as the surrounding text. But any arrow will work if it more or less matches the text.</p>
      <p>On version 2: You should definitely still say what languages you translate somewhere prominent.</p>
      <p>"File(s)" is unnecessarily fussy. Just say file.</p>
      <p>Why "Translations" and not "Translation" in the header?</p>
      <p>"Services" is more prominent than it deserves.</p>
      <p>Definitely try a serifed font. And try muting the colors. Pick only two colors and see what happens. Your design feels very commercial; you might want to try for something more literary.</p>
