      <p>Some general tips.<br>
      - No globe in its current form: it conveys the message, but it’s way too clip-art-looking.<br>
      - For a simple design like this, two typefaces (or even a single typeface in two weights) are more than enough. But you may want to differentiate the logo from the rest.<br>
      - For a friendlier and more “bookish” feel, you could also try a serif typeface.</p>
