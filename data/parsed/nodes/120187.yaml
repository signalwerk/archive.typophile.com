    <p>Hi guys!</p>
    <p>I am a professional translator and am making myself a website mostly for fun. I don't really expect to make any money off it, but I want to use it pretty much as an addendum to my curriculum and cover letter. I know the design is very bad and amateurish, but I would like to take it as far as it can and try to improve it a bit. Could you please check out the fonts I chose and give me some tips? </p>
    <p><a class="freelinking external" href="http://jg-translations.com/improved.png" rel="nofollow">http://jg-translations.com/improved.png</a></p>
    <p>The fonts I used are:<br>
    Open Sans for the logo, language options, welcome text on the left, link descriptions on the bottom part<br>
    Verdana for Services and next/previous buttons<br>
    Helvetica for text inside the white box on the right and for the About, FAQ and Contact headers/links on the bottom</p>
    <p>I don't mean to offend anyone if it's inappropriate to ask for advice without some form of compensation. Please just ignore this thread and don't take it personally. I certainly don't want to cause an argument and apologize in advance!</p>
    <p><strong>Bonus question:</strong> Sorry to abuse you guys, but globe or no globe on the logo? <a class="freelinking external" href="http://jg-translations.com/" rel="nofollow">http://jg-translations.com/</a></p>
