    <p>VTF is a free &amp; open source foundry producing open source &amp; free typefaces.</p>
    <p>More than 30 typefaces are already available!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vtf_banner_3803.gif"></div><p></p>
    <p><a href="http://www.vtf.fadebiaye.com" title="http://www.vtf.fadebiaye.com">http://www.vtf.fadebiaye.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/coqnegre_preview_5734.png"></div><p></p>
    <p>Typeface above: coqnegre perspective, a futurist fraktur typeface</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/babbage_preview_5029.png"></div><p></p>
    <p>Typeface above: babbage, a fancy futurist typeface</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pompidou_spec_6038.png"></div><p></p>
    <p>Typeface above: pompidou, a serif futurist typeface</p>
    <p>Enjoy!</p>
