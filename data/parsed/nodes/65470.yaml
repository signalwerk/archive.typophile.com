    html: |-
      <p>I think you need to recognize that when Perugino painted there were hardly any 'fonts', because movable type was still a novelty if it was available at all. His lettering was hand-drawn and probably based on Roman alphabets he had seen in use in Umbria, or whatever regions he traveled and studied in. I don't think I have seen a modern font that has all the attributes you are looking for. Goudy, who studied Roman inscriptions, designed the typeface <a class="freelinking external" href="http://new.myfonts.com/fonts/lanston/ltc-hadriano/">Hadriano</a>, which I think may come near the A you want.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
