    html: <p>Thank you for your reply! Sirenne is a bit alike, but I've found many that resemble it more or less. I'm trying to find something that is as close to the original as possible, the exact match would be perfect. I can't find any single font that has that type of long curvy serif like on letter "A". I doubt that it was his custom font since I've seen it on many paintings around that era. Out of the period, I guess that's gotta be some humanist serif type, but I've found nothing really close.</p>
