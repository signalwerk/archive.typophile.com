      <p>Karl,</p>
      <p>Thanks for the comments. The issue is not so much developing fonts for a specific environment, but rather choosing the format that is most likely to render properly with the least number of problems.</p>
      <p>I developed most of my library with print use in mind and, even more specifically, with display use in print in mind. Consequently, a lot of my fonts track tight, which is okay for print, but is probably not ideal for webfont and mobile usage—as in Ye Olden Days, “television spacing” was considerably looser than print spacing because of scan-line blur. Despite all of the whoop-ti-doo about improved screen resolutions and such, I am not entirely convinced that fonts developed for on-screen use shouldn’t have wider sidebearings as a general rule. In consideration whereof, I was considering making separate versions of my fonts for print and on-screen use. And, it seemed more sensible to make one flavor of OTF the print version (given Postscript’s long history with print, probably CFF), and the other the on-screen version (which kinda leaves TTF as default).</p>
