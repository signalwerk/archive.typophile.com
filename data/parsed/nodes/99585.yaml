    html: <p>Nick, a lot of work in this area has to do with targeted development. There is quite a significant difference between the available mobile devices and developing a font for each of them hinges on a combination of factors, including the consideration of OS, physical size, resolution and screen type/rendering environment, e.g., E Ink, LCD. As such it may not really be possible to have a one font fits all solution. The work that goes into optimising a font for an E Ink display would likely be of little or no benefit on a sharper colour LCD such as the one used on the iPhone/iPad or the HD Super AMOLED display used on the Samsung Galaxy SIII.</p>
