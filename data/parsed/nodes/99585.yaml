      <p>You could develop everything in TrueType flavoured OT and then append the .ttf or .otf file extension depending on your target market. Unless you have a proven reason to supply CFF OT fonts to your customers, it would save you the hassle of developing and maintaining both varieties. The discussion around this issue over on TypeDrawers gives some interesting perspectives on the matter:</p>
      <p><a href="http://typedrawers.com/discussion/200/reducing-font-family-bloat/p1" title="http://typedrawers.com/discussion/200/reducing-font-family-bloat/p1">http://typedrawers.com/discussion/200/reducing-font-family-bloat/p1</a></p>
      <p>If it helps and you are experimenting with web font settings on a public site I would be happy to send or post screen grabs from an iPhone 4 or iPad 3, so that you can get a feel for how those are displaying. I would be very interested in the results of any tests.</p>
