      <p>From what I have bee able to gather, implementation of @font-face is problematic in some mobile apps (which is what your table shows, basically), so embedding seems the safer (fewer annoyed costumers) approach—which covers the “predictable” part of the question.</p>
      <p>And, yes: the “clearly” part of the question was in regard to rendering quality. There are a lot of excellent tools for testing font rendering in various browsers. but I haven't stumbled across one yet that compares rendering in mobile apps. From the buzz I am picking up from business types, more and more traffic that was formerly web-exclusive is anticipated to become pure mobile, so it seems to me that fonts-for-mobile is an emergent trend with a lot of possibilities…</p>
