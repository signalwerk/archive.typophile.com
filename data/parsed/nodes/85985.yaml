    html: <p>You need to have them in a separate font for now, until true small caps are supported in the most common browsers.</p>
    html_clean: <p>You need to have them in a separate font for now, until true small caps are supported in the most common browsers.</p>
  - id: 479254
    user: 83217
    date: null
    date_raw: null
    votes: null
    html: <p>Currently, the best option is to put the small-caps (and maybe some alternate numerals and stuff) into a separate font file (one for each style/weight, naturally) and refer to it in a CSS class using <code>font-family</code> instead of <code>font-variant</code>. Troublesome, but since the only user yau can make any assumptions abous is yourveryownself...</p>
