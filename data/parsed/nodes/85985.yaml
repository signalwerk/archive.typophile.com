  html: |-
    <p>Hi all</p>
    <p>I have a font I've designed which contains small-caps. When testing the ttf in a browser with @font-face all the characters appear as expected apart from the small-caps.</p>
    <p>I have tested in all browsers on a mac, some produce false small-caps but none of them appear to use the small-caps in the font.</p>
    <p>Is there something I need to do with the font for a browser to use the font's small-caps ?</p>
    <p>ttmt</p>
