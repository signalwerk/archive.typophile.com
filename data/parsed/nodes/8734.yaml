    html: "<p>Justin, <br> <br>Thanks for the help! I tried SharpKeys and half a dozen other programs after I posted and it seems like SharpKeys comes closest to what I'm trying to do. The only drawback is that when I do remap Num: Enter to Special: Enter is that it changes both the keyboard enter and the keypad enter and not just one of them. But this is a lot better than having numerical enter on both of them. I guess this depends on the hardware, they probably both send the same code to windows, and if you change one scancode you change them both. <br> <br>Thanks for the help, I really appreciate it!</p>"
