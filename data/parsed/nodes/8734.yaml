    html: '<p>Try <a href="http://www.randyrants.com/2004/03/sharpkeys_11_of.html">SharpKeys</a>. It sounds like remapping "Num: Enter" to "Special: Enter" would solve your problem.</p>'
    html_clean: '<p>Try <a href="http://www.randyrants.com/2004/03/sharpkeys_11_of.html" class="link-external">SharpKeys</a>. It sounds like remapping "Num: Enter" to "Special: Enter" would solve your problem.</p>'
