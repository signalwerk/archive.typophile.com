      <p><em>NPC should mean Nonsalary.</em></p>
      <p>Let's come at this from the opposite tack. Does — or should — non-salary mean non-profit? Well, clearly it doesn't because there are all too many examples of for-profit enterprises, throughout history and still today, not paying salaries or wages to the people who do the work. And if non-salary were to mean non-profit then we would need to come up with new words to describe such enterprises. Again we see the essential independence of the profit orientation of an enterprise (for profit vs non-profit) from the remuneration of its workers (salaried or waged vs volunteer or slave). Again, the organisation is not the worker and the worker is not the organisation.</p>
      <p>I do not disagree with you at all the non-profit organisations should transparently disclose a) that they pay salaries to their officers and wages to their workers and b) what percentage of their revenues are disposed in this way. This is, in fact, pretty standard practice under law in many jurisdictions that formally recognise non-profit organisations for legal and tax purposes. What I disagree with is your idiosyncratic insistence that these non-profit organisations are in some sense not really non-profit or only semi-non-profit. They are non-profit organisations that pay their workers, and that does not make them non-profit, since paying salaries and wages is an <em>expense.</em></p>
      <p>If I'm donating money to an organisation, one of the first things I want to know about the organisation, apart from its goals, is what percentage of its revenues are disposed in administrative costs, including salaries, wages, rents, etc. As a rule of thumb, I avoid giving to organisations that expend more than 10% of revenues on administrative costs. These are costs, not profits, and my concern is not that they impinge in any way on the non-profit orientation of the organisation -- they do not --, but that this percentage represents a measure of how efficient and effective the organisation is in pursuing its goals.</p>
