  date_raw: 4 Apr 2011 — 12:49pm
  votes: null
  html: <p>I am being specific to the typeface / font design sector on this forum though this concerns all nonprofit organisations.  I am not happy with nonprofit organisations giving out salaries and wages to any staff.  The donors monies should not be used to pay for salaries or de facto salaries.  Thus the word nonprofit is a bit too broad and a distinction should be included for educating that a particular nonprofit is also nonsalary, e.g. 'A Nonsalary-Nonprofit organisation'.  This should educate and help to understand that the nonprofit is serious in it's objectives.  I find it objectionable and corrupt that nonprofit organisations are paying salaries, de facto salaries to staff and there are even salaried nonprofit careers.  The nonprofit activity is about doing things without any personal financial gain.  When you have nonprofit organisations, employment agencies putting salaries on nonprofit jobs, websites listing nonprofit jobs with salaries, it is all quite revolting.</p>
