      <p>‘Javascript’, you are the one who is repeating himself and not offering anything new to the discussion other than asserting, again, that ‘Nonprofit should mean Nonsalary’. I have demonstrated by analysis why these are two concepts that can and do exist independently of each other. How else could we meaningfully describe a for-profit organisation that was also non-salary? Indeed, if non-profit meant non-salary, why would we bother having two terms at all? We have these two different terms because they refer to two different things.</p>
      <p>If you are claiming that there exists corruption in some organisations and that paying of salaries by non-profit organisations is being used as a means of money laundering, that is surely true. These things happen, and it is to combat these things that laws require non-profit organisations to disclose their budgets, and why some organisations become the subject of investigation for fraud. So, given that this is the case, that laws are deemed needful to enable to monitoring and investigation of non-profit organisations to ensure that they are <em>not</em> laundering money or defrauding donors, you might ask why it is that the law also permits non-profit organisations to pay salaries to their officers and wages to their workers? <em>It is because this has been proven over time to increase the effectiveness of many organisations in the pursuit of their</em> non-profit <em>goals.</em> In this as in other areas, the law permits the risk of abuse in order to also permit a greater good.</p>
