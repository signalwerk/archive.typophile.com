      <p><em>They should state it there that they pay salaries and thus they are not 100 percent Nonprofit or that they are Semi-Nonprofit.</em></p>
      <p>Of course any non-profit organisation should be transparently open in disclosing whether or not it pays either salaries to its officers or wages to its workers, and most countries require that by law of non-profit organisations. But whether they pay or do not pay officers or workers does not affect their status as non-profit organisations. They are not rendered ‘not 100% non-profit’ or ‘semi-non-profit’ because they pay salaries or wages. Once again: the organisation and the people who work for it are not the same thing; it is the organisation that is non-profit, the people who work for it may be volunteers or wage earners without affecting the status of the organisation.</p>
      <p>Consider several different non-profit organisations:</p>
      <p>Organisation A discloses that it does not pay any salaries to its officers and uses only volunteer labour.</p>
      <p>Organisation B discloses that it pays a salary to its executive director, a full-time position, but not to other officers who are part-time volunteers; it pays a wage to the secretary/receptionist, but not to various other volunteer workers who come in a couple of days each week to help out.</p>
      <p>Organisation C discloses that it does not pay any salaries to its officers, pays wages to some workers, e.g. secretary and the IT staff, but does not pay wages to the volunteers who come in once a month to stuff envelopes.</p>
      <p>Organisation D pays a salary to its full-time executive director, a stipend to its other officers, and an hourly wage to employees.</p>
      <p>But despite these very different disclosed models of paying or not paying individuals for their time and labour, <em>these are all non-profit organisations,</em> because as organisations they do not seek to generate surplus income to be disposed of beyond expenses at the will of owners or shareholders. That is the criterion of a non-profit organisation, not whether the people who work for it are paid.</p>
      <p><em>'Corporate-ising' a word or claiming special ownership of it does not change it from it's ordinary usage and meaning.</em></p>
      <p>Indeed, but you are the one who is trying to assert a special, un-ordinary and uncommon usage and meaning of the term ‘non-profit’, a term that I have demonstrated -- <em>demonstrated,</em> mind you, by analysis, not merely asserted -- is independent of the renumeration of labour. The common meaning and usage of non-profit refers to the activities and financial model of organisations that do not seek to create profit and which, if they create a working profit inadvertently, must recycle that profit into the operation of the organisation. This in contrast to a for-profit enterprise, which exists in order to create profit that may be withdrawn from the organisation by owners or shareholders. You are trying to assert a contrast between non-profit and salary-paying; this is a false contrast because salaries are not profit, they are expenses. The valid contrast is between non-profit and for-profit.</p>
