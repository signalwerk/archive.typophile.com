      <p>You are confusing 'non-profit' and 'volunteer'. Profit is a particular accumulation of income above expenses, including the expenses of paying wages to people who do work and who, unless they are volunteers, are entitled to a fair wage for the work that they do. As James explains, non-profit organisations are those that do not seek to make or retain such surplus income; there is nothing to say that a non-profit organisation should not gainfully employ people in the pursuit of its non-profit goals. It is the organisation that is non-profit, not the workers. Most often, the decision whether to use volunteers or paid workers comes down to effectiveness: is an organisation more or less effective in pursuit of its non-profit goals if it relies on volunteers or pays people to work? Or, as Nick points out, an organisation that becomes effective through volunteer labour may find that it needs to employ wage earners in order to remain effective or to become more effective. For obvious reasons, the attrition or 'burn-out' rate among volunteers is generally higher than among paid workers.</p>
      <p>Of course, there are possibilities for true corruption in this system, but there is nothing inherently corrupt about non-profit organisations paying workers. There are also possibilities for corruption in volunteer organisations, which may turn out to be generating income and hence profit from the labour of unpaid workers.</p>
