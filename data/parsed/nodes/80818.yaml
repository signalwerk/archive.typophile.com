      <p>In some cases I suspect it's an adrenaline-rush kind of thing. People get involved in a new cause and it's exciting at first, but when things start settling down into a dull routine they move on. </p>
      <p>There are exceptions, of course, but I've seen it many times.</p>
      <p>&gt; not the 19th [century], when wealthy wives not admitted<br>
      &gt; into the workforce were the do-gooders.</p>
      <p>Yes that's a change that has really affected volunteer organizations. For example, there's a women's club in my town that used to have hundreds of members, mostly homemakers, and they were constantly doing volunteer work. These days their membership has dwindled down to mostly just retirees. Most of the younger women have full-time careers.</p>
