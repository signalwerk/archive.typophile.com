      <p><em>Nonprofit should also mean Nonsalary.</em></p>
      <p>So you assert. Assertion does not make it so. Where is your analysis? Here is mine:</p>
      <p>There are for-profit organisations that seek to generate surplus income that constitutes accumulated capital, which may be disposed of according to the will of owners or shareholders.</p>
      <p>There are non-profit organisations that do not seek to generate surplus income or that direct such surplus income back into supporting the non-profit goals of the organisation.</p>
      <p>There is for-wage labour, which is a commodity sold by workers in order to provide for their livelihood and to support their families. [There is a long and important discussion possible on the terms under which labour is bought and sold, but it isn't necessary to this analysis.]</p>
      <p>There is non-wage labour that is freely offered by the workers, i.e. volunteer labour, expecting no payment. [There is also non-wage labour that is not freely offered, i.e. slave labour.]</p>
      <p>Now, it should be clear from this that we're talking about two different things: the business model under which the organisation pursues its goals -- whether those goals involve profit or not --, and the business model under which the worker makes his or her labour available to the organisation -- whether for a wage or not. The organisation is not the worker, and the worker is not the organisation. The worker is a man or woman who is providing his or her labour to the organisation, whether selling that labour or offering it freely. Labour is a commodity, and if you want to really grasp the implications of this for your assertion, consider whether a non-profit organisation might reasonably pay rent for the property it occupies, or whether it might pay for the electricity it uses, or whether it might pay for the computers that it uses? All these things could be donated for free by supporters of the organisation's goals -- and often they are -- just as labour may be donated by volunteers, but equally they must often be paid for by the organisation, just as labour must often be paid for.</p>
      <p>That is my conclusion: there is no fixed correlation between the business model of an organisation and the business model of labour provided to that organisation. A non-profit organisation may employ paid workers or volunteers or, as James points out, some combination of the two. Likewise, a for-profit organisation does not automatically imply paid labour; that is the norm in our societies, but there are plenty of places in the world in which non-volunteer unpaid labour (slavery) is still found, and cases of indentured (compelled) labour, especially involving immigrant workers, are regularly uncovered in our own societies despite laws against such practices.</p>
      <p>The only time when there is a direct correlation between the business model of an organisation and the business model of labour is when the worker owns the means of production, and earns his livelihood not from selling his labour but directly from the fruits of that labour. That's how I run my own business, but that's another topic...</p>
