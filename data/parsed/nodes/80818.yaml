    html: <p>Note also that administrative costs, which includes salaries and wages paid to officers of the organisation and its workers, do not include expenditures in direct pursuit of the goals of the organisation. So, for example, if a non-profit organisation exists in order to enable production of some thing, e.g. a collection of fonts, that will be made freely available, on a non-profit basis, to the public, it is quite within the mandate of that organisation to pay someone to create those fonts, or to pay to purchase the rights to fonts, because that is the goal of the organisation. Yes, this means that the person who creates the fonts is profiting, but he is profiting from the products of his labour, just as if he were creating the fonts for any other client, and his labour is -- or should be -- entirely independent of the non-profit organisation. He is profiting, not the non-profit organisation.</p>
