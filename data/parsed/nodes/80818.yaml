      <p>&gt;'Corporate-ising' a word or claiming special ownership of it does not change it from it's ordinary usage and meaning.</p>
      <p>Javascript, it is you who are quite mistaken about the ordinary usage and meaning of the term "non-profit organization." As director of a 501(c)(3) non-profit corporation, The Jewish Institute for Youth and Family, I am well aware of what being a non-profit means. It is defined very clearly in the beginning of the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Nonprofit_organization" rel="nofollow">Wikipedia article</a>:</p>
      <p>"A nonprofit organization (abbreviated as NPO, also known as a not-for-profit organization[1]) is an organization  that does not distribute its surplus funds to owners or shareholders, but instead uses them to help pursue its goals.[2]  Examples of NPOs include charities (i.e., charitable organizations), trade unions, trade associations and public arts organizations. Most governments and government agencies meet this definition, but in most countries they are considered a separate type of organization and not counted as NPOs. In most countries, NPOs are exempt from income and property taxation. </p>
      <p>"Ownership is the quantitative difference between for- and not-for-profit organizations. For-profit organizations can be privately owned and may re-distribute taxable wealth to employees and shareholders. By contrast, not-for-profit organizations do not have private owners. They have controlling members or boards, but these people cannot sell their shares to others or personally benefit in any taxable way."</p>
      <p>As you see in the Wikipedia article, this definition basically holds around the world. Around the world non-profit does not mean non-income or non-salaried, but relates to the purposes of the organization, and restrictions on how the income may be used—the key thing being that it cannot issue stock and give dividends. </p>
      <p>You are entitled to your views, but you don't control the meaning of words, which in this case are carefully defined legally, as well as in common practice. </p>
      <p>I would also join the chorus in agreeing that requiring that non-profit organizations be also all-volunteer would kill most of them. And the existing very large non-profit sector in the US, in particular, has had the admiration of many countries.  </p>
      <p>And by the way, we at the Jewish Institute for Youth and Family gratefully receive your tax-free contributions and put them to good use helping children and families :)</p>
