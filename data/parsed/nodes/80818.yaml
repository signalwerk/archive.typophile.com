      <p><em>Javascript said, "Similarly 'Nonprofit' should mean 'Nonsalary.'"</em></p>
      <p>I understand your point. I know several instances where non-profit businesses were established that never made a declared profit, but have been enormously profitable to those who started the business through salaries. However I disagree that non-profits shouldn’t be able to help hire people to help fulfill the mission. Too many good deeds are done by charitable non-profits with hired hands. </p>
      <p>These are non-typographic related, but the Bill &amp; Melinda Gates Foundation, the RedCross and others come to mind quickly. Locally here in Memphis we have St. Jude Childrens Research Hospital. They pay some pretty hefty salaries to research physicians, administrators, as well as marketers, housekeepers and thousands of others, yet it is a non-profit organization. All income is put back into the mission of eliminating catastrophic childhood diseases. The progress they have made over the last several decades is stunning. You’re saying that all of those thousands of people working on that mission should live in poverty or the work they do just not be done? Or do you think St. Jude should be considered a profitable organization just like Exxon-Mobil?</p>
      <p>I get your point, but the totalitarian statement that non-profit should therefore mean non-salary would do more harm than good. It’s up to donors to provide the due diligence and review the legitimacy of the entity and check the organizational efficiency, review the operating and administrative costs. There is and will always be abuse, but the fix isn’t to force the elimination of the work the good organizations are doing.</p>
      <p>And like DA, I'm still missing what this has to do with the typography business.</p>
