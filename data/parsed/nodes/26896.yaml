  html: <p>[ Press Release from Agfa Monotype / Fonts.com ] <br> <br> <br><b>Agfa Monotype Adds Over 600 Products to Fonts.com From Three Foundries</b> <br> <br> <br>Wilmington, Mass. and Salfords, Surrey, England, Dec. 17, 2003 - Agfa Monotype Corp. has introduced more than 600 fonts and font packages on Fonts.com. The new collections from Cape Arcona, International TypeFounders and Martin Wait can be viewed at <a href="http://www.fonts.com/foundries" target="_blank">www.fonts.com/foundries</a>. <br> <br>"Expanding our product offering has always been our top priority for Fonts.com," said Allan Haley, director of words and letters at Agfa Monotype. "Our vast selection of fonts and our long list of type foundries ensure that visitors will find what they're looking for." <br> <br>Cape Arcona is a foundry headed by Thomas Schostok and Stefan Claudius, the king and president, respectively, and they've channeled their sense of humor into designing typefaces.For example, the movie poster lettering of the 1962 James Bond film, "Dr. No", inspired the Cape Arcona typeface, No Dr.(tm). The 22 fonts and font packages are available in Macintosh</p>
  html_clean: <p>[ Press Release from Agfa Monotype / Fonts.com ] <br> <br> <br><b>Agfa Monotype Adds Over 600 Products to Fonts.com From Three Foundries</b> <br> <br> <br>Wilmington, Mass. and Salfords, Surrey, England, Dec. 17, 2003 - Agfa Monotype Corp. has introduced more than 600 fonts and font packages on Fonts.com. The new collections from Cape Arcona, International TypeFounders and Martin Wait can be viewed at <a href="http://www.fonts.com/foundries" target="_blank" class="link-external">www.fonts.com/foundries</a>. <br> <br>"Expanding our product offering has always been our top priority for Fonts.com," said Allan Haley, director of words and letters at Agfa Monotype. "Our vast selection of fonts and our long list of type foundries ensure that visitors will find what they're looking for." <br> <br>Cape Arcona is a foundry headed by Thomas Schostok and Stefan Claudius, the king and president, respectively, and they've channeled their sense of humor into designing typefaces.For example, the movie poster lettering of the 1962 James Bond film, "Dr. No", inspired the Cape Arcona typeface, No Dr.(tm). The 22 fonts and font packages are available in Macintosh</p>
