    <p>Hello all,</p>
    <p>have read around various places online and this seemed to be the most informed on all typeface matters.</p>
    <p>I'm trying to find a font to write in that will be a match for the ff fortissimo symbol<br>
    <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/7/71/Music-fortissimo.png" rel="nofollow">http://upload.wikimedia.org/wikipedia/commons/7/71/Music-fortissimo.png</a> </p>
    <p>I found this discussion elsewhere in the forum <a class="freelinking external" href="http://typophile.com/node/58526" rel="nofollow">http://typophile.com/node/58526</a><br>
    but those suggestions weren't quite right as a match for the fortissimo lettering</p>
    <p>The closest looked to be the Berthold Bodoni Old Style BQ Italic but it's not quite right and i can't afford to buy fonts and not have them be the correct one.</p>
    <p>Any help or suggestions would be gratefully received. Thanks.</p>
