    html: <p>Now best remembered as a type designer, WAD was highly regarded in his day (1880-1956) as a designer and illustrator of books and book jackets, too. He wrote <a class="freelinking external" href="http://www.amazon.com/Layout-advertising-W-A-Dwiggins/dp/B0007DLEIM" rel="nofollow">serious prose</a> and <a class="freelinking external" href="http://imprint.printmag.com/daily-heller/digital-publishing-worrying-you-read-this/" rel="nofollow">satire</a>, and in his spare time, he wrote plays which he staged in his garage, with all the parts played by <a class="freelinking external" href="http://arrowstreetlive.com/2011/11/dwiggins-marionettes-at-the-bpl/" rel="nofollow">marionettes</a> that he designed and carved himself.</p>
