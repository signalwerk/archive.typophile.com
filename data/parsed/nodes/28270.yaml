      <p>Rodrigue</p>
      <p>It is not an attempt to "distort" the letterform but rather a modification. Besides a concern about the weight of digital type in general there is gain to the letterform during the letterpress printing process. A thinning of the letterform will help a bit to counteract this. The idea is to bring the letterform back to what it should look like when printed rather than allow the process itself to distort it.</p>
      <p>Modification is also a way to provide a form of optimization. I feel this is absolutely essential but it is not commonly practiced at all and yet it takes maybe five minutes to do this in either FontLab or Fontographer. Note that Hrant, our champion of optimization, did not alter the letterforms in this manner when he printed his business card. Maybe I need a fifth "trait."</p>
      <p>Gerald</p>
