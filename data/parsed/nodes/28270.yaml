      <p>I have a Vandercook SP15 proof press and print (not often enough) from magnesium engravings mounted type high. I compose digitally and have the plates made and mounted from film.</p>
      <p>I print on all sorts of cardstock and cardboard. My makeready skills are not great though so I don't usually do well with thinner stock, although the few times I've attemped anything of the level of bookwork, I've used Mohawk Superfine, cream, eggshell finish - which is IMHO the be all end all of book paper.</p>
      <p>I print because I love to print. not sure why. Ink in the veins maybe. my first job was as an assistant in a print shop, I did letterpresswork all through high school, and then operated a sign press and Heidelberg Windmill after school; in college I took apart and put back together a Windmill and worked on a C&amp;P Pilot in my apartment.</p>
      <p>---</p>
