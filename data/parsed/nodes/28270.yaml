      <p>I don't print nearly enough to have a "workflow", but I have been printing letterpress on and off for almost 4 years now. I've only ever used Vandercook cylinder presses, and have never done more than one color. Until recently I only printed from metal type in black ink, mostly to make specimens, including an ATF Garamond waterfall, 60pt Pascal (one version with rules between each sort to extract the sidebearings), and various Baskervilles. The one exception to that was a batch of parody courtesy cards* which I submitted to the TypeCon auction. Over the past few months though I had photopolymer plates made and printed my business cards - explained and shown in here: <a href="http://typophile.com/node/21340" title="http://typophile.com/node/21340">http://typophile.com/node/21340</a></p>
      <p>* "Don't Mention It" cards, intended as a preposterously formal reply<br>
      to a "Thank You" card... Set in a cloyingly self-conscious type of course,<br>
      in bronze ink.</p>
      <p>Paper: I like "honest" paper - white, hard, thin. Good inkjet paper actually works great! I can't stand the spongey crap that tempts so many printers to smother the type. Goo-goo-gaa-gaa letterpress. I favor what's called a "kiss" impression, but when I print specimens for digitization (not too often though) I go even gentler, to the breaking point of the blackness of the letterform bodies. I call that "platonic kiss" impression. :-)  On the other hand, well-paying clients can ask for whatever the hell kind of impression they want! :-)  As long as I won't be damaging some rare beauty of a metal face.</p>
      <p>I print letterpress because: it yields a different and useful (in more than one way) result; it's cheaper for small runs; and the control-to-price ratio is great - in the case of my business cards for example I made my own ink using reduced wine. But I personally feel metal letterpress is highly over-rated, and recommend using ppl as much as possible.</p>
      <p>&gt; this is the ultimate goal of type</p>
      <p>To me that's too creationistic, too Art. The primary goal of type is<br>
      to help multiple people communicate, not one person express himself.</p>
      <p>hhp</p>
