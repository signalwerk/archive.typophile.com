  html: <p>Does anyone print, I mean with a real press, for any sorts of typographical use? What kind of presses do you use, what size presses and how many colors? What is your workflow, what kind of plates. What kind of paper(s) are you using? Tell me all about it. Why are you printing? I'm getting the urge to maybe get a press and set some specimens and would like to hear from anyone who has undertaken this. I often think that this is the ultimate goal of type, to be printed (sorry webguys.)</p>
