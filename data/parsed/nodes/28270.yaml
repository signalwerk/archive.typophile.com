      <p>Monotype would be worth considering. Takes some-know-how. The lead alloy can be remelted keeping costs under control. No "base" is required. Also, polymer plates can be mounted on "high Monotype spaces". Typos can be corrected by hand, polymer plates with typos requires a new plate. I know all of you set perfect type, spell like Dr. Squid, so that may not concern you.</p>
      <p>We used both. So I am not biased. Polymer is certainly superior to magnesium plates.</p>
      <p>Gerald Giampa</p>
