      <p>Rodrigue</p>
      <p>I did a monograph _Printing digital type on the hand-operated flatbed cylinder press_ a while back. This will answer some of your questions since it is specifically about printing digital type via the letterpress process. You can find more information about it here:</p>
      <p><a href="http://bielerpressxi.blogspot.com/" title="http://bielerpressxi.blogspot.com/">http://bielerpressxi.blogspot.com/</a></p>
      <p>jlt</p>
      <p>I wouldn't actually recommend printing type from magnesium engravings. One reason is the lack of structural density if mounted on wood [this is also stated in the Heidelberg Windmill manual]. Another is that magnesium corrodes quickly. Of the three metals commonly used for engravings, copper, zinc, magnesium, the latter is the worst for holding detail. Digitally produced film generated engravings, however, aren't as bad as engravings that were generated direct from camera; the latter's distortion is why type was not commonly printed in engraved form. The conjoining of digital film output and the photopolymer plate process eliminated this problem and provided a viable alternative to metal type. You would get far more satisfactory results from this method.</p>
      <p>Gerald</p>
