      <p>&gt; Spammers can handle CAPTCHAs quite well</p>
      <p>That's absolutely not true (you must have something against captchas for some other -probably pointless- reason). If it were true, hundreds of high-end sites would not be relying so heavily on it. I've only seen one trick that tries to get around captchas - it was very devious, but has now disappeared, surely for good reason (probably because a captcha-using site can simply stop allowing an image referral on a captcha).</p>
      <p>Having a captcha for creating an account is a good -and sufficient- idea.</p>
