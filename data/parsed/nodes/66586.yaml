      <p>I’m not sure if there’s a different definition of “e-mail verification,” but Typophile currently requires a valid e-mail upon sign-up, where it then sends an automated message with a random password for first-time log-ons.</p>
      <p>What I’ve noticed (in the course of janitorial service) is that a lot of spammers use disposable e-mail services like yopmail and mailinator to get through that barrier. </p>
      <p>I don’t know if that sort of e-mail thing is automate-able for a spam-bot. If not, then there are real people spamming the system. In which case, a CAPTCHA will do little good.</p>
      <p>On the other hand, adding a CAPTCHA probably couldn’t hurt.</p>
