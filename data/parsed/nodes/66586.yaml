    html: <p>The spammers are problematic, obviously, but I honestly don't know if constrained membership is the solution. It's possible that it works, but on the other hand it's also very possible you end up with a forum where hardly any new people are being introduced. Then it'll be a secluded elite clique. I don't think that is desired. It's probably better to try and see what happens if you install every method of countering bot-registrations - make it as difficult as possible - like CAPTCHA, e-mail verification, and so forth. I'm quite sure that Joe is right when he says some spammers can circumvent these precautions, but also that it will become too much of a hassle for spammers to continue?</p>
