      <p>Spammers can handle CAPTCHAs quite well, Florian. It won’t solve the problem. Nor do I buy the idea that we’re just dealing with a couple of bad apples. Spam appears here on a weekly basis, or (let’s say) every 10 days.</p>
      <p>Another advantage of constrained new memberships is it requires administrators to actually tend to the site, instead of letting spammers sign up and, one minute later, post unsolicited commercial messages to the site, which admins can take days to notice. Constrained memberships force admins to actually administer instead of being absentee landlords.</p>
