  html: |-
    <p>It should not be possible to register a new account and immediately post to Typophile. That’s how spammers (and students who want us to do their homework for them) get in.</p>
    <p>Take a page from MetaFilter yet again:</p>
    <ul>
    <li>You have to pay a lifetime fee of $5 when you register. There are no other fees and the fee cannot be refunded.</li>
    <li>You have to wait a week after registration is complete (i.e., after Typophile receives your $5) to post a new topic.</li>
    <li>You may, however,  post a comment in a forum (e.g., an answer to a question) immediately after registration is complete.</li>
    </ul>
    <p>If you don’t like this prospect, what’s your alternative? Nothing? That’s what we’ve got now and it has led, as “moderators” should have predicted, to spammers infiltrating this site. Retaining the current system guarantees more spam. Something <em>has</em> to be done, and the MetaFilter system is proven to work.</p>
