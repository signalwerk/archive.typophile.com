      <p>It looks like you are going for a type treatment, but instead of playing with type variations, you're just randomly putting boxes and lines all over the place.</p>
      <p>Get rid of those for now, and focus on the type. See what you can come up with just with some different type treatments.</p>
      <p>And do NOT use a gavel or scales of justice...unless you want the logo to look like the logo that 90% of all legal related businesses have.</p>
      <p>Also, what is SW and Computer Law?</p>
