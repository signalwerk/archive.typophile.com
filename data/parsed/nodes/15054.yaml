    html: |-
      <p>I did a google search for White Computer Law which revealed <a href="http://www.computerlaw.com.au/index.html" rel="nofollow">this</a>, which is a clear indication as to why they need a new logo, or anything really. But it does indicate that you can drop the SW (which seems to stand for Steve White) so you are left with White, Computer Law with a clear hierarchy.<br>
      To get out of the square think about what a logo should achieve. For example, you might believe its primary task is to differentiate/identify it from competitors. Therefore, looking at the competition is only a tool, you don't have a client to deal with (who may say "we want a logo that looks like Browns Law Firm" or that "Times Roman is the only font we will use"), so you have a free hand. White is the unique feature of the name, so you could think about white objects that communicate the qualities that you are after for example an egg or a square (these are instant subjective choices, yours might/should be better), or how to represent white using colours that you can print. You may decide that you only want a type treatment for the logo, but rather than just typing out different fonts try sketching layouts and then go through type catalogues to pick a font that has the qualities you want and will work well with your layout. It is sometimes difficult to sit in front of a computer and put down ideas quickly, erasing sections, re-drawing etc, the time lapse tends to slow your speed of thought. If when you have finished sketching and chosen a font that you really want to use you can always e-mail the foundry and ask if they can help you. Alternatively buying a font need not be a huge expense and if you have chosen well, you will use it more than once, think of it as an investment.<br>
      Tim</p>
