    html: |-
      <p>I would avoid using a typeface that doesn't have genuine small caps. I would also avoid making any play with © copyright symbols. At the moment I am drawn to the sans version (not that it particularly strong and the rule is out of position, but the perception that serif equals professional/quality need not be true). My first thought on the name is that it gives you the opportunity to work with it, using the white areas of type, embossing, for example which might be a direction worth exploring.<br>
      Tim</p>
