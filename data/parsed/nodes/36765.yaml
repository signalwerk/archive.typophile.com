      <p>My first reaction: What’s with the green, is this a Berkeley high school paper? (Okay, now I get the colors.) Ooh, Franklin is nicer than I remembered at that large size. </p>
      <p>My second thought: Beware of white (empty) space here. For any other design job use white space liberally, and then some. But, here lots of groups (faculty, students and their dogs) will fight to get their thing on the front page since there’s room. (I’ve witnessed <a href="http://www.dwell.com">one too many home pages</a> follow the same downward spiral.) It is better if you prepare for the space to fill in (design for it!) than to let that happen later by people who will inherit your design and inevitably lack the design sensibility to do it right.</p>
      <p>Random thoughts:<br>
      - You could be more innovative with some things. The header area could present interesting, relevant, tidbits of news. Or you could go full width on THEFREEPRESS but only show the bottom 2/3rds of the words. How about a double S ligature, or something to add some surprise/customization to the masthead. Just don’t get too tricky and you’ll be fine.<br>
      - Don’t rely too heavily on actual lines when an implied line will do.</p>
