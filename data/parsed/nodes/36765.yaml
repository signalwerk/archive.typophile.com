      <p>I agree that it looks good.<br>
      Some tips: I would keep the references to the pages limited to one sidebar. That way you gain some space for a slightly longer main article, or some other small news pieces, bulletin board or an editorial.<br>
      As for the typography: I like your use of a sans-serif font, which gives the paper a good contemporary feel. I think it might be a good idea to use a slighly less bold font for the header, make the line under the header a bit thinner and increase the space between header and headline. This gives the layout a bit more room to breathe.<br>
      And you might want to consider making the layout a bit more assymetrical, for example by introducing some (horizontal) elements to break the now pretty dominant vertical columns. This might spice up the layout a bit more.</p>
      <p>Keep it up!<br>
      Queneau</p>
