    <p></p><div class="imageWrap"><img src="/files/FreeStatePg1Iss8_4616.jpg"></div><p></p>
    <p>I’m the new editor of my high school (free state high)newspaper, and I wanted some feedback on the cover I’ve been designing. Normally its an 8 page tabloid style, but our first issue is only going to be 4 pages. We come out every three weeks, our readership is somewhere around 1000 students with some parents. Our school colors are green and silver (hence the green “FREE”). Just in case you don’t know, the boxes are going to be pictures. </p>
    <p>Fonts I’ve been using:<br>
    Masthead/misc design elements: Franklin Gothic(Heavy,Book, etc.)<br>
    News Headline: Myriad<br>
    Feature Headline: Caslon<br>
    Body Copy: Goudy Old style</p>
