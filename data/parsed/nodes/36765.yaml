      <p>Don’t vcnter the headlines. But if your headlines are going to be centered, center the title? </p>
      <p>Why are you mixing two similar serifs instead of using different weights of one? And why are the feature headlines in a font used nowhere else instead of a lighter and smaller version of the headline font? You can clean things up a lot by using one font for the masthead and headlines, and a second font for the body copy.</p>
      <p>Also, are there going to be margins on this thing? I know that this is a school newspaper and budgets are tight, but you should really give it more air on the sides.</p>
