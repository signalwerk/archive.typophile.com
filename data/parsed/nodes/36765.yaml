      <p>You should stick to one sans family (Myriad or Franklin are both good, but use just one), and one serif. Both Goudy and Caslon are relatively wide, though I’m not sure which version of Caslon you have. Something like Minion Pro is more economical of space and has more weight variants than Goudy (and Caslon, depending on your version). I wouldn’t use Caslon for headlines, but that’s just my opinion.</p>
      <p>I’m not sure about those large white spaces in the left and right columns. I’m assuming they would ordinarily be filled with more inside features (i.e. for the intended 8-page version). If not, I would distribute the white space through the design. The masthead, headline seem crunched.</p>
