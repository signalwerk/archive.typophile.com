    html: |-
      <p>Step 1: Define the rough pattern in a square</p>
      <p>Step 2: Make a copy of the square, aligning it with the first; this will show any weird overlaps (see red arrows)</p>
      <p>Step 3: Select any element you want to move AND it's "clone", and move it til it's in a better position. </p>
      <p>Step 4: Keep doing this until your "original" square is completely surrounded by copies. If you need to tweak an element, make sure all its copies are selected at the same time (so any changes "update" in all nine squares).</p>
      <p>Step 5: Select EVERYTHING that overlaps your original square (any object going over the "edge" will be repeated on an opposite side, and anything on a "corner" will be on all four corners) and copy it to a new area/file/whatever. I find this easier to do in outline view. Select it all and define a pattern (rect should be in BACK, and probably not stroked).</p>
      <p>Step 6: test it and go!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/patterns_3964.jpg"></div><p></p>
