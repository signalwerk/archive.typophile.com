    html: |-
      <p>I turn the grid lines on &amp; turn on snap to grid. Make sure each seam point falls directly on a grid intersection. Keep an eye on the X &amp; Y coordinates in the transform palette so you know it's snapping to the grid like it should (you should have values such as 14 or -6, not something like 14.002 or -6.175).</p>
      <p>To me it's easiest to check how it will tile by duplicating your working copy, dragging it down and aligning it where it will tile. It sometimes takes a few times to get it right.</p>
      <p>I have noticed some patterns will still show tiny hairlines, even after I go through and inspect the seam points and everything checks out. They print fine though.</p>
      <p>When adding a pattern to a shape you may find that you want to move the fill itself without moving the shape. Make sure nothing is selected, then hold down the tilde (~) key, then click on the pattern within the shape to move it.</p>
      <p>I hope this helps. I must apologize if any of this is difficult to follow, I didn't get much sleep last night to make a deadline so I'm going through the motions today. :-)</p>
