  html: "<p>Here's a logo that I'm working on, unfortunately I'm not budgeted to spend too much time on it, so I'd appreciate any feedback I receive.  I've learned so much from reading Leslie Cabarga's Bible and I want to incorporate this into the logo; like points in extrema, stroke contrast, etc.  This early work-in-progress version was created a few months back. <br> <br>It's based on the Sho-Bud logo which you can see at: <br><a href=\"http://www.shobud.org/\" target=\"_blank\">http://www.shobud.org/</a> <br> <br>The extra letters are based on Loki Cola: <br><a href=\"http://www.dafont.com/en/search.php?q=loki+cola&amp;nb_ppp_old=10&amp;page=1&amp;text=Shot+Jackson&amp;nb_ppp=10&amp;classt=alpha\" target=\"_blank\">http://www.dafont.com/en/search.php?q=loki+cola&amp;nb_ppp_old=10&amp;page=1&amp;text=Shot+Jackson&amp;nb_ppp=10&amp;classt=alpha</a> <br> <br>So I've been tweaking these to make them blend together.  The client wants the Shot Jackson logo to look like the Sho-Bud one (they own Sho-Bud).  I've marked some changes that I'm going to start working on, and some changes that the client has requested.  So I thought I'd ask for some feedback and ideas before I get started.  Let the slaughter begin!  Thanks!     <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/57016.gif\" alt=\"Shot Jackson Logo\"></p>"
  html_clean: "<p>Here's a logo that I'm working on, unfortunately I'm not budgeted to spend too much time on it, so I'd appreciate any feedback I receive.  I've learned so much from reading Leslie Cabarga's Bible and I want to incorporate this into the logo; like points in extrema, stroke contrast, etc.  This early work-in-progress version was created a few months back. <br> <br>It's based on the Sho-Bud logo which you can see at: <br><a href=\"http://www.shobud.org/\" target=\"_blank\" class=\"link-external\">http://www.shobud.org/</a> <br> <br>The extra letters are based on Loki Cola: <br><a href=\"http://www.dafont.com/en/search.php?q=loki+cola&amp;nb_ppp_old=10&amp;page=1&amp;text=Shot+Jackson&amp;nb_ppp=10&amp;classt=alpha\" target=\"_blank\" class=\"link-external\">http://www.dafont.com/en/search.php?q=loki+cola&amp;nb_ppp_old=10&amp;page=1&amp;text=Shot+Jackson&amp;nb_ppp=10&amp;classt=alpha</a> <br> <br>So I've been tweaking these to make them blend together.  The client wants the Shot Jackson logo to look like the Sho-Bud one (they own Sho-Bud).  I've marked some changes that I'm going to start working on, and some changes that the client has requested.  So I thought I'd ask for some feedback and ideas before I get started.  Let the slaughter begin!  Thanks!     <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/57016.gif\" alt=\"Shot Jackson Logo\"></p>"
