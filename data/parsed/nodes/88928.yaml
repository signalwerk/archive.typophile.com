      <p>Nathan, you can also leave the fonts as-is and apply different CSS rules based on whether the custom font has loaded or not — which WebFont Loader can tell you: <a href="http://code.google.com/apis/webfonts/docs/webfont_loader.html" title="http://code.google.com/apis/webfonts/docs/webfont_loader.html">http://code.google.com/apis/webfonts/docs/webfont_loader.html</a></p>
      <p>We sometimes write about "font events" on the Typekit blog, because WFL is baked right into our standard JS. Here's an example you can follow even if you don't use Typekit: <a href="http://blog.typekit.com/2010/11/02/font-events-fallback-fonts-and-styles-2/" title="http://blog.typekit.com/2010/11/02/font-events-fallback-fonts-and-styles-2/">http://blog.typekit.com/2010/11/02/font-events-fallback-fonts-and-styles-2/</a></p>
