    html: |-
      <p>Ideally, you want to change the UPM while not touching anything else in the font, so I would recommend using <a href="http://sourceforge.net/projects/fonttools/" rel="nofollow">TTX</a> for this, if you want a free tool. I use DTL OTMaster for this kind of work, but it isn't free.</p>
      <p>Using TTX, you would decompile the font's head table using this syntax from the command line:</p>
      <p><code>ttx -t head [inputfontfilename]</code></p>
      <p>Then open the resulting .ttx xml file in a text editor, change the UPM value and save the xml file. Then merge the .ttx xml into the font:</p>
      <p><code>ttx -m [inputfontfilename] [inputttxfilename]</code></p>
    html_clean: |-
