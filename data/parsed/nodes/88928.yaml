    html: |-
      <p>If you do opt to adjust the scaling of your custom font, the easiest way to do this is simply to change the font UPM value. To increase the size of the font +10%, you would reduce the UPM value by 10%. So, for instance, if your font has a UPM value of 1000, you would reduce this to 900. This is the best way to scale an already mastered font, because it means that you don't have issues with rounding of outline geometry, loss of hints, having to recalculate vertical metrics, etc.</p>
      <p>The one caveat with this approach is that if your font is PS format some PDF creation software will incorrectly scale a font whose UPM does not equal 1000.</p>
