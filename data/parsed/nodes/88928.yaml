    <p>So I've run into an issue with backup fonts for a client specific font being used on a templated web site.</p>
    <p>The client font runs about 10% smaller than every other font, so that means if I specify the font-size at say 32px, and the user can't use the custom font for whatever reason, the displayed backup (in this case Impact) ends up a fair bit larger and can break unexpectedly.</p>
    <p>As far as I can tell the only solution is to take the custom font and scale it up to create a more custom version. Whats the best way to do this? Is there a quick piece of software capable of this or do I have to go into a font editing software and scale every single glyph (ughh!)?</p>
