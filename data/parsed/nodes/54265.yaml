      <p>I guess what Irene is trying to achieve is the aesthetic and stylistic connections between art movements like futurism/early XX century avant-garde and the so-called "punk rock" era of the late Seventies. That reminds me of a book by Greil Marcus, "Lipstick Traces", which deals exactly with this matter (Irene, an Italian translation of the book was published in 1991 but is now out of stock: "Tracce di rossetto. Percorsi segreti nella cultura del 900 dal Dada ai Sex-pistols"). In many ways, the early (English) punk philosophy has its roots in XX century movements like french Situationism (though a more proletarian side was certainly central in it), which I believe Malcolm McLaren knew well.</p>
      <p>Regarding Peter Saville, his graphical and aesthetical minimalistic approach should be considered more as belonging to the the post punk/new wave era than the punk movement itslef, which to me is fully and gloriously represented by the "do it yourself" approach of Jaime Reid.</p>
      <p>"Only when the design fails does it draw attention to itself; when it succeeds, it's invisible." (John D. Berry)</p>
