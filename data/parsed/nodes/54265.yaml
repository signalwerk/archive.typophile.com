      <p>It's not an original connection -- <a class="freelinking external" href="http://www.unknown.nu/futurism/protopunk.html" rel="nofollow">Futurism: Proto Punk?</a>.</p>
      <p>I got this via <a class="freelinking external" href="http://www.unknown.nu/futurism/" rel="nofollow">this Futurism links page</a> -- although I'm a little upset by the line "Too bad they were all Fascists." (Which may be factually true, but hopefully unrelated to the art. Hey, wasn't everybody at that time?)</p>
      <p>OTOH perhaps that's the connection: Punk -&gt; Vyvyan -&gt; Rick -&gt; "Fascists!"</p>
