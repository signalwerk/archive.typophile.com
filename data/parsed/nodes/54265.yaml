    html: <p>Tough one... were they ever comprehensively connected in a philosophical sense? I'm certainly no expert, but one seems to be more of a philosophically led movement, while Punk was more a youth driven culture focussed more on image than actual action. I see similarities, but does it follow that one actually led, or directly influenced the other?</p>
