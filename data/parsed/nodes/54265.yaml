      <p>One can find a connection in punk rock to any artistic movement. The only official qualification: outsider. There was a sad moment around 1979 when the "sound" and the "scene" became codified.</p>
      <p>Perhaps Nervous Gender were futurists without knowing it, as well as Kraftwerk, Eno, The Screamers, etc. We were punks, not Italian postwar drug addicts. Certain traditions were honored…</p>
      <p>pbc</p>
