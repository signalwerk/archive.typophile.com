    html: <p>Even if it's not it, can't stop thinking about <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100033" rel="nofollow">Archer</a> (misleading /a and /y with their ball terminals). The rest is far from Archer, more like a rounded (<a class="freelinking external" href="http://www.themomiverse.com/wp-content/uploads/2012/04/Company-Store-Stacked-Simple.jpg" rel="nofollow">a closer look here</a> to see the roundness) <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/rockwell/" rel="nofollow">Rockwell</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/geometric-slabserif-712/" rel="nofollow">Geometric Slabserif 712</a>. May be they simply start from it, tweaked /a and /y and manually round the whole thing.</p>
    html_clean: <p>Even if it's not it, can't stop thinking about <a class="freelinking external link-external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100033" rel="nofollow">Archer</a> (misleading /a and /y with their ball terminals). The rest is far from Archer, more like a rounded (<a class="freelinking external link-external" href="http://www.themomiverse.com/wp-content/uploads/2012/04/Company-Store-Stacked-Simple.jpg" rel="nofollow">a closer look here</a> to see the roundness) <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/mti/rockwell/" rel="nofollow">Rockwell</a>/<a class="freelinking external link-external" href="http://www.myfonts.com/fonts/bitstream/geometric-slabserif-712/" rel="nofollow">Geometric Slabserif 712</a>. May be they simply start from it, tweaked /a and /y and manually round the whole thing.</p>
