    <p>Hey all -</p>
    <p>With this face, I am trying to merge some renaissance influence with the sharp serifs of a post modernist typeface. I like the way it feels when it's large, but I'm thinking there is going to be some serious legibility issues at smaller sizes. Does anyone have any advice on how to check for legibility during their process? </p>
    <p><a href="http://cl.ly/1F1F1L0h02220i1q1p3z" title="http://cl.ly/1F1F1L0h02220i1q1p3z">http://cl.ly/1F1F1L0h02220i1q1p3z</a></p>
