    html: |-
      <p>Faceting itself does not necessarily destroy readability.*<br>
      There's much more to it than that! :-)  If/when you target<br>
      small sizes you will however need to worry about proper<br>
      "stroke" contrast, vertical proportions, width, spacing, etc.<br>
      In fact, just like thin strokes have to be thickened, those gaps,<br>
      being also small features, need to be enlarged. On the other<br>
      hand I might consider dumping those anyway.</p>
      <p>* You might want to look at the work of John Downer.</p>
      <p>BTW, although I'm not a fan or "constructed" type, if<br>
      done sensitively this can turn out to be quite nice.</p>
      <p>hhp</p>
