    date_raw: 29 Jan 2012 — 7:57am
    votes: null
    html: <p>The key test is in the intended use. If it is print, you need to regularly check printouts at intended size, taking into account the difference between your printer and offset, if that is your target. If on screen, then screen at intended size. Also you need enough characters to do words, so that it can be read, not just looked at.</p>
