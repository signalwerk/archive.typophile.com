    <p>Yay!  A typographic event in San Francisco! <br> <br>Our very own Hrant Papazian will be speaking on "Nature and Nurture in Typeface Design" at City College of San Francisco on Monday, May 2, 2005. <br> <br>It's on the Ocean/Phelan campus, in the Rosenberg Library, room 305 at 6:30pm.  <br> <br>It's free, exciting and all kinds of accessible, so come on down! <br> <br>Here's a flyer with more info: <br></p>
