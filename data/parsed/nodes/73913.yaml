      <p>This kind of hyperbolic language is common in rights licensing legalese. </p>
      <p>When I worked as a TV puppeteer I was once asked to cede my performance rights "in perpetuity, across the universe." I attempted, unsuccessfully, to talk them down to "an eon, across the galaxy".</p>
