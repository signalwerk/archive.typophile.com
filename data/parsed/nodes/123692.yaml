      <p>Available under at least 2 names:<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Elsner%2BFlake%20%2F%20%28Commercial%29&amp;ffam=Digital%20Sans%20EF%20-%20Medium&amp;fid=e03883b0881dd4a00353653e3268a728&amp;fsize=60&amp;text=MegaFileUpload&amp;wrap=2" rel="nofollow">Digital Sans EF</a></strong> by Elsner &amp; Flake [1999]<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=SoftMaker%20%2F%20%28Commercial%29&amp;ffam=DigitalSerial-Bold%20-%20Bold&amp;fid=dea9b07ea9eaf36ed9b5f3be16bf1538&amp;fsize=60&amp;text=MegaFileUpload&amp;wrap=2" rel="nofollow">Digital Serial (Bold)</a></strong> by SoftMaker [1991]<br>
      The 2nd one is a bit closer to your sample but although is available for purchase from myfonts.com, take into account that it's probably a clone and not an original design as most of SoftMaker's fonts under the '-serial' suffix/trick.<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=CanadaType%20%2F%20%28Commercial%29&amp;ffam=Sol%20Pro%20-%20Medium&amp;fid=a776335d7538528c359ca5c03b045308&amp;fsize=60&amp;text=MegaFileUpload&amp;wrap=2" rel="nofollow">Sol Pro (Medium)</a></strong> by Canada Type [2010] is another similar.<br>
      There are also at least 2 similar freebies out there (probably illegal clones).</p>
