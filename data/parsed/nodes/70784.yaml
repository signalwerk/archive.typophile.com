      <p>I'm not 100% sure, but I think it was Mr. Karl-Erik Forsberg. During his active time as a graphic designer/type designer he made a huge amount of corporate logotypes for many big Swedish companies. MAny of them are still around. In some cases slightly refined. I have some of his books at work and I'm pretty sure I've seen Electrolyx logotype in there.</p>
      <p>Cheers</p>
