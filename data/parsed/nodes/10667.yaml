  html: <p>Does any have a sample non-disclosure statement  to be used as some kind of assurance that you can safely submit your designs for consideration to foundrys? <br> <br>It is to be used  preceding your design submission in an effort to protect your designs from unauthorized copying. <br> <br>This protection is essential whenever you <br>submit your original work for review to anyone. <br> <br>An example would help everyone out I am sure. <br> <br>-smc <br> <br></p>
