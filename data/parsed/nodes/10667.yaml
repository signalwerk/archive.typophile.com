      <p>I, or any others employed or engaged by the Company, agree not to disclose, directly or indirectly, any information with respect to any business conducted by the Association.  Without restricting the generality of the foregoing, it is agreed that we will not disclose:Financial information, business plans, strategies for development or growth, or any other proprietary information not known generally to the public or in the public domain relating in any way to the business of the Association, or any other information regarding the management or method of operation of the Association, and That we will not copy or reproduce, in any form, information provided to us by the Association for the purpose of distribution or use outside the scope of the attached contract, and that all documentation provided to us will be returned to the Association<br>
