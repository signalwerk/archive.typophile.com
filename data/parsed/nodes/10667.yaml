    html: "<p>I don't have an NDA that is specific to submission of designs to a foundry, but I have uploaded a PDF of our standard, mutual <a href=\"http://www.tiro.com/transfer/TiroNDA.pdf\">NDA</a>. This is the agreement we use when people are doing work for us, particularly if it involves clients that require NDAs between all parties. It is a good boilerplate NDA, and will give you some idea of the kind of things that you need to specify in any such agreement. <i>NB: you should have any legal agreement reviewed by a lawyer in your own jurisdiction (or that of the counter-signing party).</i> Note also that you should exchange two copies for signing, one to keep in your own records and one for the other party to keep. Do not disclose any confidential information to the other party until you have a counter-signed copy of the agreement.  <br>  <br>If drafting an agreement specifically to cover submission of a design to a foundry, you might also want to include explicit prohibition against derivative works, although this is implicitly covered in the prohibition against 'disclosing, reproducing, summarising and/or distributing  <br>Confidential Information' and by the assertion that 'the Disclosing Party does not grant any express or implied rights to the Receiving Party.' <br> <br>[Note that I've disabled printing of this PDF, but you can copy and paste the text.]</p>"
    html_clean: "<p>I don't have an NDA that is specific to submission of designs to a foundry, but I have uploaded a PDF of our standard, mutual <a href=\"http://www.tiro.com/transfer/TiroNDA.pdf\" class=\"link-external\">NDA</a>. This is the agreement we use when people are doing work for us, particularly if it involves clients that require NDAs between all parties. It is a good boilerplate NDA, and will give you some idea of the kind of things that you need to specify in any such agreement. <i>NB: you should have any legal agreement reviewed by a lawyer in your own jurisdiction (or that of the counter-signing party).</i> Note also that you should exchange two copies for signing, one to keep in your own records and one for the other party to keep. Do not disclose any confidential information to the other party until you have a counter-signed copy of the agreement.  <br>  <br>If drafting an agreement specifically to cover submission of a design to a foundry, you might also want to include explicit prohibition against derivative works, although this is implicitly covered in the prohibition against 'disclosing, reproducing, summarising and/or distributing  <br>Confidential Information' and by the assertion that 'the Disclosing Party does not grant any express or implied rights to the Receiving Party.' <br> <br>[Note that I've disabled printing of this PDF, but you can copy and paste the text.]</p>"
