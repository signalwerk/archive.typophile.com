      <p>A cheap way to ‘deposit’ your design is to print it on a piece of paper, fold that in such a way that the design is obscured, tape it shut, write your name and address on it, slap a stamp on it and and drop it in a mailbox. </p>
      <p>Just do not forget to NOT open it when it arrives on your doorstep and keep it in a safe place.</p>
      <p>(BTW In the Netherlands it used to be possible to go to a Tax Office and have a design time-stamped)</p>
