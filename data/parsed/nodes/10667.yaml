    html: <p>I’m not convinced that an NDA, in the way I understand them, is super helpful here. Say you sign an NDA with a foundry, send them your fonts, you exchange some emails but at the end of the day they say they’re not interested, or you can’t agree to terms. Later they come out with a design eerily similar to your design. In signing an NDA you can’t disclose the communications you had with them without being in breach of the NDA yourself. And as it’s notoriously difficult to prove cloning you might find yourself on the wrong end of the law. Maybe.</p>
