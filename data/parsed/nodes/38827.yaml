      <p>- <em>what is the significance of the misspelling?</em> </p>
      <p>elis died last year, at 99 years of age, angry until the end. He said he had been born three times as an artist. I’m most familiar with his two last incarnations, characterized by his both childish and aggressive onomatopoetic works, of which this is one. The significance is perhaps better explained by Karl Nyberg, who wrote this for an exhibition at the Modern Museum in Stockholm: </p>
      <p><em>His classic phrase “HÅLL TJEFTEN” (SHUT YOUR GAB!) incites revolt and represents a refusal to submit to repressive norms, both linguistic and social. A peculiar writing style is one of the most characteristic features of Eriksson’s art. By making his own dyslexia a distinctive and individual form of expression, he turns accepted values on their head. What is normally seen as a restriction becomes instead his strength.</em></p>
      <p>More pictures of his work <a href="http://www.gallerilarsbohman.com/books.asp?art_name=Elis%20Eriksson">here</a> and the rest of the quoted text <a href="http://www.modernamuseet.se/v4/templates/template1.asp?lang=Eng&amp;id=2873">here</a>.</p>
      <p>Let’s just say that everytime I look at it I can feel a tiny bit subversive when everything I do is not. </p>
      <p>- <em>What an awesome view from that window. What kind of work do you do?</em> </p>
      <p>I’m a (typo)graphic designer, and as the myth goes, we must have inspiring work environments to be “creative”.</p>
