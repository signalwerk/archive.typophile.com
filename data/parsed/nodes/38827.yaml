    <p>Stephen King once said (I believe it was in On Writing) that he could tell a lot about a person by what books they own.  There’s quite a bit of truth in this statement.  I can tell a lot about people just by examining the odds and ends they keep around their home.  People will usually buy things that reflect their particular tastes.</p>
    <p>As a designer this fascinates me. Thinking about this I happened to glance at my coffee cup and an idea hit me; I should start a thread here on Typophile where everyone could share something from their own life that reflects their love of typography.</p>
    <p>For me it has always been anything old and ornate.  Last year about this time I had the opportunity to participate in a Photoshop Design contest.  The challenge was to design a billboard ad for Photoshop in the past or future.  I had no idea what I was going to make until I visited Leterheadfonts and spotted Tom Kennedy’s gorgeous Billhead font.  Looking at the old letterhead samples he had made (to display the font) I was inspired to create an early 1900’s billboard advertising Photoshop.  The challenge was to conceive of how this ad would present the program during that time period; what terminology would they use to describe the program? what pictures (if any) could I use to convey the message?</p>
    <p>It took me about three weeks to come up with my final billboard design.  Unfortunately, I did not even place in the finals, but Denise Buyers of Letterheadfonts offered to display my design in their Gallery section.  I was honored.  If you’re curious you can see the design there or visit it <a class="freelinking-external" href="http://photoshopcafe.com/contests/contest-5-finalists.htm">here</a> on the PhotoshopCafe design challenge page.</p>
    <p>So began my love of old typography and a more devoted search for “old things” to display around my home, including this great old coffee mug that I found one day when me and my mom were visiting an antique shop here in town.</p>
    <p></p><div class="imageWrap"><img src="/files/coffeemug_3463.png"></div><p></p>
    <p>So do you own anything that communicates your deep, abiding love of typography/design? Show it off here :)</p>
