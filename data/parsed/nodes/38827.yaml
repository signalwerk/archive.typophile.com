      <p>Doug, do you mean the Japanese words on the cats?</p>
      <p></p><div class="imageWrap"><img src="/files/Manekineko_5509.jpg"></div><p></p>
      <p>The word, ‘祝’, on the collar of the right cat means ‘to congratulate’, ‘to wish’ or ‘to pray’ and the word, ‘開運’, on the legs of the right cat means ‘to have a better luck’. ‘開’ means ‘open’, and ‘運’ means ‘luck’.</p>
      <p>The cat on the right is a good-luck charm.</p>
      <p>The word, ‘千万両’, on the legs of the left cat means ten million ryo’s (‘ryo’ is an old Japanese currency). In other words, it means a great deal of money.</p>
      <p>The cat on the left is an amulet which gives you money.</p>
