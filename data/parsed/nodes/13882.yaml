    <p>Hi everyone, I'm hoping someone here might be able to identify this machine.</p>
    <p>Someone in rural Western New York called us up here at the Cary Collection. She found a machine in a garage, and thought it might be a piece of printing equipment. The previous owner of the house used to work at Kodak. It was hard to describe over the phone, so we sent one of our student assistants on a road trip to take pictures.</p>
    <p>The machine is in pieces, but you can see it has a keyboard, and a cluster of wheels/gears with letters. Any chance someone out there might have an idea what this thing might do? We can't figure it out.</p>
    <p>The pictures are here: <a href="http://wally.rit.edu/cary/mystery_machine/mystery_machine.html" title="http://wally.rit.edu/cary/mystery_machine/mystery_machine.html">http://wally.rit.edu/cary/mystery_machine/mystery_machine.html</a></p>
    <p>Any help would be appreciated! :)</p>
