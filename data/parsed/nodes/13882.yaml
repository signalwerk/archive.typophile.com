      <p>Mystery solved: the machine is a "Graphotype." </p>
      <p>The Graphotype was used to stamp rows of type into small metal plates. Then, you could print from the plates with an Addressograph machine. For example, you could use the Graphotype to set plates for all the names and addresses on your mailing list. Then, you could print all your envelopes with the Addressograph.</p>
      <p>The Graphotype was also used to make dog tags!</p>
      <p>Evidently, there are many of these, and as with anything these days, you can find them on eBay.</p>
      <p>More pictures and information here: <a href="http://www.dogtagsrus.com/addressograph%20graphotype.htm" title="http://www.dogtagsrus.com/addressograph%20graphotype.htm">http://www.dogtagsrus.com/addressograph%20graphotype.htm</a></p>
