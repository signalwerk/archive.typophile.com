      <p>Yes indeed, Marnie is 100% correct - the machine in the photo is an Addressograph Graphotype.  The model in the photo is either an 6340 (emobsser)((characters raised as on a credit card)) or a 6341 (debosser)((characters indented in like on a dog tag)).  </p>
      <p>This machine has seen better days.  It is missing key parts and would cost a fortune to rebuild.  It appears that this machine is destin for the scrap yard - it is such a shame - these machines are great that is why we collect them and preserve them.  This machine would have been made between 1926 and the mid 1960's.  Currently we have 14 project machines and they can be reviewed at <a href="http://www.dogtagsrus.com/projects.htm" title="http://www.dogtagsrus.com/projects.htm">http://www.dogtagsrus.com/projects.htm</a>  </p>
      <p>The Graphotype is made of cast iron and as such the 6300 class machines weigh about 390 lbs. each.  The machines ran on a 1/4 hp 110 Vac motor.  As delivered from the factory the machine would have had a clipboard to hold copy and a work light for the operator.  The original factory color would have been either black, a real funky dark green or grey.  </p>
      <p>The Graphotype was a support machine that made the plates that were used by the Addressograph for addressing documents.  In the early 1940's the military adopted the Graphotype to make dog tags.</p>
      <p>The Graphotype is a machine that shaped our nation but alass the computer has religated them to the local land fills and scrap yards.  At present you can pick up almost any newspaper in a large city and you will find in the obituaries that someone was at one time or another an addressograph operator . . . it is so sad to see the machine in this photo in such a state of disrepair it makes me think of all the stories that machine might hold of the people that used it.</p>
      <p>If you wish to review more information about these machines you can visit: <a href="http://www.dogtagsrus.com" title="http://www.dogtagsrus.com">http://www.dogtagsrus.com</a> and click on the history and information section.  We are constantly updating our information and are always seeking information and photographs of Addressograph Graphotype machines.</p>
      <p>If you have ANY information on ANY graphotype machines, new, old, forsale, in a colletion, in a dump or where ever or you may have photos of these machines you may contact me direct at <a href="mailto:tagtech@dogtagsrus.com">tagtech@dogtagsrus.com</a></p>
      <p>Thank You<br>
      Kobie</p>
