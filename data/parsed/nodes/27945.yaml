      <p>There's already a font called Quicksilver... not sure if you'll run into copyright issues.</p>
      <p>As for the font itself, I agree with Stefan for the most part.</p>
      <p>Your 'F' and 'P' are too similar (I read both as 'F'), as are 'U' and 'O'. 'B', 'D', 'H', 'T', and 'Y' seem to be the least legible letters. If you work on these, it may increase the readability of your typeface. 'S', and 'R' could use work, although they will probably be readable in context with other letters.</p>
      <p> - Lex</p>
      <p>P.S. your image says "JIGSAW PVZZLE" not "JIGSAW PUZZLE"</p>
