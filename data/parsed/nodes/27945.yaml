    <p>Hi all,</p>
    <p>Since there hasn’t been paid too much attention to this topic:</p>
    <p><a href="http://typophile.com/node/27913" title="http://typophile.com/node/27913">http://typophile.com/node/27913</a></p>
    <p>... I’d like to come up with something more elaborated. ;-)</p>
    <p>I created a semi-capital font in almost the same type of grid, slightly more complex now.<br>
    The result are some written-like, quite decorative lettershapes.</p>
    <p>I really like the fluidity of some of the shapes, where others tend to be stuck in the grid and bear strength when standing on their own.</p>
    <p>I have attached a file with the font on it, including my work method.</p>
    <p>Below you can see a sample. Any comments, ideas, advice?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Examples_6558.jpg"></div><p></p>
