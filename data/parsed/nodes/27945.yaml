      <p>Disclaimer: those are just my views, so don't be offended. I'm often wrong, but here's what I think.</p>
      <p>I think the shapes are nice, but as a typeface it's almost impossible to read. This is almost always a disadvantage. How do you envision the font being used? Body text, signage, logos, on-screen? None of these are really feasible due to the low readability. Is there any way you could make it easier to decipher? Also, it's almost impossible to kern it the way it is.</p>
      <p>Anybody else think the letters resemble faces with various moustaches/beards? Sort of like stylized Beatles portraits (the "H" is definitely Ringo). And the strict "grid" (if that's the term) reminds me of LCD displays.</p>
      <p>As a thought experiment or conceptual art project, oh yes. As a usable font, not really.</p>
