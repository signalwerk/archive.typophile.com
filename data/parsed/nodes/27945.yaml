    html: |-
      <p>Termopolium: thanks for your comments.</p>
      <p>Actually, I think you're right. The font is not meant to be legible in the first place. My first concern was how to create lettershapes within the borders of the grid, I faced a very theoretical design problem. So to say, there were many restrictions, so many that they could be (appear to be) an obstacle if it comes to legibility and practical usability.</p>
      <p>I think this font, in its current form, can be used in short word images, maybe logos, only if the word itself is very easy to recognize. Some shapes are more distinctive than others, during design process I noticed that some words written in it worked, where others failed to do so.</p>
      <p>I think it is a matter of making the right combinations.</p>
