      <p>Agree with Riccardo, to me it also belongs to the DIN family even if obviously some earmarks are absent and details off: single storey /a, /J top bar and serifed /I monospace<br>
      Some more alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/emtype/ciutadella" rel="nofollow">Ciutadella</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/antartida" rel="nofollow">Antartida</a>, <a class="freelinking external" href="http://www.myfonts.com/search/decima" rel="nofollow">Decima</a>/<a class="freelinking external" href="http://www.myfonts.com/search/decima+mono" rel="nofollow">Decima Mono</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-eef" rel="nofollow">Eef</a>, <a class="freelinking external" href="http://www.fontshop.com/families/t-star" rel="nofollow">T-star</a>/<a class="freelinking external" href="http://www.fontshop.com/families/t-star-mono" rel="nofollow">T-star Mono</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dayflash/rotundus" rel="nofollow">Rotundus</a>, <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Simple" rel="nofollow">Simple</a>, <a class="freelinking external" href="http://www.myfonts.com/search/karben+205" rel="nofollow">Karben 205</a>/Mono</p>
