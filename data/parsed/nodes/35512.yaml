  html: |-
    <p>Jan Middendorp is a Dutch page maker and type writer, living in Berlin, Germany.<br>
    He was a literature and theater critic, <span class="caps">DJ</span> and b-2-b copywriter before that.<br>
    First type interviews: <a href="/node/13699" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudy Vanderlans</a> (1987, de Volkskrant, <span class="caps">NL</span>), <a href="/node/14015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Neville Brody</a> (1988, <span class="caps">MAN</span> Magazine, <span class="caps">NL</span>).</p>
    <p>Books:<br>
    Moving Minds (1999)<br>
    Lettered (about Clotilde Olyff, 2000)<br>
    Ha, daar gaat er een van mij! Graphic design in The Hague since 1945 (2002)<br>
    Dutch Type (2004)<br>
    <span class="caps">ARK</span>/<span class="caps">ABC</span> (about and with René Knip, 2004)<br>
    Made with FontFont (with <a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>, 2006)<br>
    A Line of Type (about Linotype, with <a href="/node/add/wiki?edit%5Btitle%5D=Alessio%20Leonardi" title="Create node &quot;Alessio Leonardi&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Alessio Leonardi</a>, 2006)<br>
    Area 2 (co-curator, 2008)<br>
    TypeBookTwo – Jeremy Tankard (contributor, 2008)<br>
    José Mendoza y Almeida (foreword, translations, 2010)<br>
    Playul Type 2 (co-author, 2010)<br>
    Creative Characters (co-author, 2010)<br>
    Precursor (co-author, 2011)<br>
    Type Navigator (with TwoPoints.Net, 2011)<br>
    I Love Gill Sans (introduction to a book ed. by TwoPoints.Net, 2012)<br>
    Shaping Text / De Vorm van Tekst (2012)<br>
    Hand to Type&nbsp;(2012)</p>
    <p>Design magazines:<br>
    Eye (London) – contributor since 2004<br>
    Druk (<a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> Benelux, Gent) – founding editor and art director, 1999-2002; “96” (same), 2002-2004<br>
    Other collaborations have included Items (Amsterdam), tipoGrafica (Buenos Aires), <span class="caps">TYPO</span> (Prague), Typographic (London), Etapes (Paris), Matrix (Bad Homburg), Baseline&nbsp;(Kent).</p>
    <p>Design:<br>
    Brochures, programmes and booklets for Belgian clients in the academic and cultural worlds (De Beweeging, Antwerp;  University of Leuven; the City of Ghent Culture Dept., etc. (1990s)<br>
    Books and book covers for Lannoo Publishers, Belgium (2000–2013)<br>
    Catalogues for <span class="caps">VOUS</span> <span class="caps">ETES</span> <span class="caps">ICI</span> Gallery, Amsterdam&nbsp;(2003–2008)</p>
    <p>Current and recent clients:<br><a href="/node/12184" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MyFonts</a>, <a href="/node/14103" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">LucasFonts</a>, <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>, <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a>, <span class="caps">BIS</span> Publishers, Gestalten&nbsp;Publishers</p>
