    <p>Jan Middendorp is a Dutch page maker and type writer, living in Berlin, Germany.<br>
    He was a literature and theater critic, DJ and b-2-b copywriter before that.<br>
    First type interviews: <a href="/wiki/Rudy%20Vanderlans" class="freelinking" rel="nofollow">Rudy Vanderlans</a> (1987, de Volkskrant, NL), <a href="/wiki/Neville%20Brody" class="freelinking" rel="nofollow">Neville Brody</a> (1988, MAN Magazine, NL).</p>
    <p>Books:<br>
    Moving Minds (1999)<br>
    Lettered (about Clotilde Olyff, 2000)<br>
    Ha, daar gaat er een van mij! Graphic design in The Hague since 1945 (2002)<br>
    Dutch Type (2004)<br>
    ARK/ABC (about and with René Knip, 2004)<br>
    Made with FontFont (with <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, 2006)<br>
    A Line of Type (about Linotype, with <a href="/wiki/Alessio%20Leonardi" class="freelinking" rel="nofollow">Alessio Leonardi</a>, 2006)<br>
    Area 2 (co-curator, 2008)<br>
    TypeBookTwo – Jeremy Tankard (contributor, 2008)<br>
    José Mendoza y Almeida (foreword, translations, 2010)<br>
    Playul Type 2 (co-author, 2010)<br>
    Creative Characters (co-author, 2010)<br>
    Precursor (co-author, 2011)<br>
    Type Navigator (with TwoPoints.Net, 2011)<br>
    I Love Gill Sans (introduction to a book ed. by TwoPoints.Net, 2012)<br>
    Shaping Text / De Vorm van Tekst (2012)<br>
    Hand to Type (2012)</p>
    <p>Design magazines:<br>
    Eye (London) – contributor since 2004<br>
    Druk (<a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> Benelux, Gent) – founding editor and art director, 1999-2002; "96" (same), 2002-2004<br>
    Other collaborations have included Items (Amsterdam), tipoGrafica (Buenos Aires), TYPO (Prague), Typographic (London), Etapes (Paris), Matrix (Bad Homburg), Baseline (Kent).</p>
    <p>Design:<br>
    Brochures, programmes and booklets for Belgian clients in the academic and cultural worlds (De Beweeging, Antwerp;  University of Leuven; the City of Ghent Culture Dept., etc. (1990s)<br>
    Books and book covers for Lannoo Publishers, Belgium (2000–2013)<br>
    Catalogues for VOUS ETES ICI Gallery, Amsterdam (2003–2008)</p>
    <p>Current and recent clients:<br>
    <a href="/wiki/MyFonts" class="freelinking" rel="nofollow">MyFonts</a>, <a href="/wiki/LucasFonts" class="freelinking" rel="nofollow">LucasFonts</a>, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>, <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a>, BIS Publishers, Gestalten Publishers</p>
