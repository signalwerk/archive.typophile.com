      <p>@Pentapus: I have thought about color schemes for the identity, but not specifically for the logotype, yet. The overall identity will most likely be blue, green, yellow or a combination of one of them. Reinforced with tinted whites and blacks, probably not straight white or black though.</p>
      <p>I’ll whole-heartedly consider Oxtail, although it wasn’t love at first sight (for this identity). I’ve added it to the sample type wall.</p>
      <p>I’m leaning more towards <a href="http://www.dardenstudio.com/typefaces/omnes">Darden Studio’s Omnes</a>, at the moment.</p>
