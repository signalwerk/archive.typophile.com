      <p>Thanks everyone, awesome suggestions! You didn’t let me down.</p>
      <p>@Stephen: Good point, I was thinking that about Comalle as well. No smaller weights either. I’m a newbie type designer, so any modifications I make will be minimal.</p>
      <p>@Jos: Yep, I agree. Rayuela Chocolate italic is right up my alley. Yea, I see the lack of contrast in the caps to lowercase.</p>
      <p>@Stefan: Yes, I plan on it! Thanks for the reminder and encouragement as well. (I promise I won’t hack up anyones hard work. If I must, I will contact the type designer directly and ask for their help.)</p>
      <p>@poms: I’m considering Sauna, although it looks a little too “fat kid eating marshmallow’s” for this identity. ;)</p>
      <p><strong>Omnes</strong> is a great suggestion, I’m digging that a lot! Will seriously consider.</p>
      <p>@Sharon: Thanks for the sample! I’m not quite sure a slab serif feels right. Appreciate the suggestion, of course. =)</p>
      <p>I’ll keep you updated on which I decide. Thanks again!</p>
