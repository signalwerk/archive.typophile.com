  html: |-
    <p>Background: The client is an agent for study abroad language learning. The purpose of their company is to help students research and book study aboard language courses. The media is mostly web, although I suspect biz cards will follow. Message should portray a reputable and trustworthy source for honest comparisons of language schools and their courses. The typeface will be for display. There might be illustrations with it, most likely a friendly looking “agent” or “counselor” type person.</p>
    <p>Here’s what I have in mind so far.</p>
    <p>Looking for something friendly like Comalle...<br>
    </p><div class="imageWrap"><img src="/files/MLG-Comalle_5607.png"></div><p></p>
    <p>Playful like Bello pro...<br>
    </p><div class="imageWrap"><img src="/files/MLG-Bello-pro_4893.png"></div><p></p>
    <p>Readable (and a little more serious) like Museo...<br>
    </p><div class="imageWrap"><img src="/files/MLG-Museo_4254.png"></div><p></p>
    <p>Asking for suggestions on which typeface might do the job well. As well as some inspiration. </p>
    <p>I greatly appreciate any feedback/questions. Thanks very much!</p>
    <p>(First-time post, long-time fan of Typophile! =)</p>
