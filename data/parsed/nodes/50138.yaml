      <p>I think Comalle is really fun, but dangerous for an identity as it’s not going to perform any smaller than you display it here. It was not made for business cards. Bello would need some modification to make it readable, and that’s quite the task if you’re not experienced as a letterer or type designer. Museo ain’t bad. </p>
      <p>Other ideas:<br>
      <a href="http://www.fontshop.com/fonts/downloads/pampatype/rayuela_chocolate_set_ot/?sample_text=MyLanguageGuide">Rayuela Chocolate</a> - slightly more open counters than Comalle, <a href="http://www.fontshop.com/fonts/downloads/pampatype/rayuela_family_ot/">lighter weights</a> too<br>
      <a href="http://www.fontshop.com/fonts/downloads/mvb_fonts/mvb_pedestria/?sample_text=MyLanguageGuide">Pedestria</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/mvb_fonts/mvb_grenadine_one/?sample_text=MyLanguageGuide">Grenadine</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_kosmik_ot/?sample_text=MyLanguageGuide">FF Kosmik</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/dalton_maag/co_headline/?sample_text=MyLanguageGuide">Co Headline</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/typetogether/bree/?sample_text=MyLanguageGuide">Bree</a></p>
