    html: <p>David, I think the reason you have seen it before is that the style is a very easy one to imitate. There must be at least 4 or 5 of these in <a href="http://bowfinprintworks.com/Script05Pg1.html" target="_blank">Part 5 of the Script Font ID Guide</a>.  If you give me a few minutes I may be able to pinpoint which one this is, or at least give you some similar alternatives.</p>
    html_clean: <p>David, I think the reason you have seen it before is that the style is a very easy one to imitate. There must be at least 4 or 5 of these in <a href="http://bowfinprintworks.com/Script05Pg1.html" target="_blank" class="link-external">Part 5 of the Script Font ID Guide</a>.  If you give me a few minutes I may be able to pinpoint which one this is, or at least give you some similar alternatives.</p>
  - id: 63652
    user: 2088
    date: 2005-03-30T08:29:00
    date_raw: 30.Mar.2005 8.29am
    votes: null
    html: "<p>Well, I've looked through all 38 pages of Part 5, and this isn't one of the eight 'blob serif' fonts I had already collected.  If you want to look them up, they are: Sheryl (p.1), Sorority Hack (p. 8), Telegram (p.9), Argetab Obbed (p.9), Chubble (p.21), Cool Dots (p.24), Joker Wild (p.26) and Bill's Holiday (p.29). There is also Adelita from Type-O-Tones, which I do not have a sample for (yet). <br> <br>Your font looks like it was done by someone with a better than average flair for lettering, so it's possible it's a commercial font, or at least the work of a professional. There are several scrapbooking sites that include fonts mostly done by amateurs, and this style is often seen. <a href=\"http://www.myfonts.com/fonts/linotype/telegram/telegram/testdrive.html?s=Scrappin+Fabulous&amp;p=48\" target=\"_blank\">'Telegram'</a> by Timothy Donaldson, which would need to be darkened, or Robert Schenk's  <a href=\"http://www.myfonts.com/fonts/ingrimayne/argentab-obbed/bold/testdrive.html?s=Scrappin+Fabulous&amp;p=48\" target=\"_blank\">Argetab Obbed</a> might be good alternatives among commercial fonts. <br> <br>I hope this helps.</p>"
    html_clean: "<p>Well, I've looked through all 38 pages of Part 5, and this isn't one of the eight 'blob serif' fonts I had already collected.  If you want to look them up, they are: Sheryl (p.1), Sorority Hack (p. 8), Telegram (p.9), Argetab Obbed (p.9), Chubble (p.21), Cool Dots (p.24), Joker Wild (p.26) and Bill's Holiday (p.29). There is also Adelita from Type-O-Tones, which I do not have a sample for (yet). <br> <br>Your font looks like it was done by someone with a better than average flair for lettering, so it's possible it's a commercial font, or at least the work of a professional. There are several scrapbooking sites that include fonts mostly done by amateurs, and this style is often seen. <a href=\"http://www.myfonts.com/fonts/linotype/telegram/telegram/testdrive.html?s=Scrappin+Fabulous&amp;p=48\" target=\"_blank\" class=\"link-external\">'Telegram'</a> by Timothy Donaldson, which would need to be darkened, or Robert Schenk's  <a href=\"http://www.myfonts.com/fonts/ingrimayne/argentab-obbed/bold/testdrive.html?s=Scrappin+Fabulous&amp;p=48\" target=\"_blank\" class=\"link-external\">Argetab Obbed</a> might be good alternatives among commercial fonts. <br> <br>I hope this helps.</p>"
