      <p>I would just go with Avenir or maybe Gotham. If there's just one letter you don't like, such as the one-storey {a} in Futura, many professional fonts will have a stylistic alternate (a two-storey {a}) available.</p>
      <p>You seem to be looking for a compact wordmark with short ascenders. That should be possible with any of the above-mentioned fonts, which have straight ascenders... just crop them a bit short if they're too long for you.</p>
      <p>As for the wobbliness in your hand-made mark, I agree with what Birdseeding said. Also, the stress in the {v} is the wrong way round; the downstroke should be thicker than the upstroke.</p>
