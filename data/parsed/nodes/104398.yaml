      <p>Hej Zoran,</p>
      <p>I'm not vaguely a professional, but I think I can give you a start? (Although this would all be much easier if you just went in and modded Century Gothic or something. ;))</p>
      <p>One key thing is to try to look at things based on how they appear optically, rather than going by metrics. You've definitely been trying to do this, but the thickness of the various letters are all over the place. The arms of the k look thicker than the stem, the D looks thicker on the curved part... S as you say looks consistently thinner than the other characters, with it's lower terminal thick-looking. k's upper arm loooks longer than the lower arm, t crossbar too thin, o needs to have overhang to work. u is too wide. And I think you need to work over a lot of curves there that seem "wobbly", connect slightly off, vary unintentionally in curvature with respect of the other side etc...</p>
      <p>Read something like this: <a href="http://66.147.242.192/~operinan/2/2.3.2a/2.3.2.06.illusion.htm" title="http://66.147.242.192/~operinan/2/2.3.2a/2.3.2.06.illusion.htm">http://66.147.242.192/~operinan/2/2.3.2a/2.3.2.06.illusion.htm</a></p>
      <p>Lycka till!</p>
