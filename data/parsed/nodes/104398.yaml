    <p>Hello!</p>
    <p>This is my first post here. I've been reading the critiques on this forum, and you guys are really good at this, so I thought I'd post this<br>
    piece to see if you can help me with some feedback.</p>
    <p>This is a logo for a singer, the name is in swedish - vocal studio. Her wishes were; simple, formal, readable, fairly minimalistic without frills. I took inspiration from geometric sans fonts like avenir, century gothic and futura, and fitted a coloured whole note into it. </p>
    <p>Any thoughts on the letters, color and overall impression?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vokalstudion - oliv_4632.png"></div><p></p>
