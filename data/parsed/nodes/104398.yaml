      <p>I'm interested in what makes it look inconsistent though, if you can pin it down that would be helpful.<br>
      I mentioned the other fonts because I tried to learn from them how to tackle specific problems, for instance using the 'a' glyph in an otherwise geometric font, which characters use thinning towards the stem etc. I did try the logo in different existing fonts, but we didn't find what we were after all in one place. </p>
      <p>I could use some help if you could say something specific about the letters. I think there's an inconsistency between the fairly bulky a and the thin s, but how to handle it without making a very wide 's' glyph... I'll try some variants.</p>
