      <p>Start off with the basic Robert Bringhurst book.</p>
      <p><a href="http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/0881792063" title="http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/0881792063">http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/08...</a></p>
      <p>Then work your way in with Kimberly Elams book on the<br>
      grid system.</p>
      <p><a href="http://www.amazon.com/Grid-Systems-Principles-Organizing-Design/dp/1568984650/ref=pd_bbs_sr_1?ie=UTF8&amp;s=books&amp;qid=1207028872&amp;sr=1-1" title="http://www.amazon.com/Grid-Systems-Principles-Organizing-Design/dp/1568984650/ref=pd_bbs_sr_1?ie=UTF8&amp;s=books&amp;qid=1207028872&amp;sr=1-1">http://www.amazon.com/Grid-Systems-Principles-Organizing-Design/dp/15689...</a></p>
      <p>Least this is how my school puts me through and itss<br>
      helped out a lot on my designs over the years.</p>
