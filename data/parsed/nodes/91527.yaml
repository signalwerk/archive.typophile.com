    html: <p>The closest I've found is <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United Sans Condensed</a>. As <a class="freelinking external" href="http://dribbble.com/super_furry" rel="nofollow">Simon Walker</a> (in charge of <a class="freelinking external" href="http://dribbble.com/super_furry/projects/2508-Austin-Eastciders" rel="nofollow">Austin Eastciders' identity</a>) is very well known for his ability to work, customize and create fonts, it could also be a custom typeface (and may be based on United).</p>
