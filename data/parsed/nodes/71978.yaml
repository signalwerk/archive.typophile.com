  html: |-
    <p>We proudly announce a new release in our award winning typeface family. 'Lavigne Text' is a 4 weights package optimized for ease of reading at small sizes. It features generous x-height, short ascenders and descenders, open counters and simplified details that improve its reproduction at small sizes.</p>
    <p>'Lavigne Text' has also a solid presence on paper and its weight make it ideal for the setting of fine books and magazines. Used in conjunction with 'Lavigne Display', they make a perfect team, bringing aesthetic consistency at every typographic hierarchy.<br>
    The philosophy behind the 'Lavigne type family' is to achieve the refinements observed in classic 'modern serif' typefaces, without borrowing too much from history.</p>
    <p>All 'Lavigne Text' versions have been produced in OpenType format and every weight has its own small caps. Features are available to easily set superscript and subscripts numbers, an extensive set of fractions, four sets of numbers (proportional old style, tabular old style, proportional lining, and tabular lining), matching currency symbols, case sensitive glyphs, and ligatures.</p>
    <p>Lavigne Text can be purchased at FontShop:<br>
    <a href="http://www.fontshop.com/fonts/downloads/retype/lavigne_text_complete_ot/" title="http://www.fontshop.com/fonts/downloads/retype/lavigne_text_complete_ot/">http://www.fontshop.com/fonts/downloads/retype/lavigne_text_complete_ot/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lavignetext-newsletter4_6151.gif"></div><p></p>
