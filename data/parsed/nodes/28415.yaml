      <p>Hrant — I do not care about the person behind these questions, neither about his supposed inner conflicts, nor his methods. I care about his questions only, in as far as they might disclose information that I consider useful for my business. If you tell me he's a "witch-hunter", that does not concern me. You may consider "witch-hunters" or "trolls" as your "enemies", not worthy of a decent answer, but you should not impose these personal moral judgements of yours onto the public's interest, by denying others a rightful answer. Morality simply isn't relevant for the plain factual matter that is at stake here.</p>
      <p>I recur that I am interested in the business tactics of the font industry, because as a font user and buyer I am directly involved. As a client of this industry, by paying for licenses that claim to give me a lawful user's right, I earned the right of verifying whether the goods and/or services I paid for, conform to what they are sold as, and/or to hear others that verified this for me.</p>
      <p>The way in which similar cases were handled before within our business, is painful and unbecoming. If there is something like a "Berthold Gate" in the font industry, this should be dealt with appropriately, that means publicly, by reasoning and proof, not by irrelevant emotional outbursts, and certainly not by populist summary justice and peer pressure.</p>
      <p>(Don’t say I'm being unfair, again ;-)</p>
