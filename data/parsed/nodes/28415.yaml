      <p>Erik Spiekermann:</p>
      <p>&gt; 1. Adobe fonts are distributed by many companies, e.g. Monotype, Linotype, Agfa. Data is always identical. Like you can buy a Mercedes from the plant in Stuttgart, from your local dealer, a dealer in another city.</p>
      <p>I think there is a fundamental misunderstanding here. The header on page 54 of FontBook 2006 is</p>
      <p>"Manufacturers (Hersteller)",</p>
      <p>and this page 54 lists these "manufacturers" with respective abbreviations, e.g.</p>
      <p>"FB = Font Bureau".</p>
      <p>Now let's assume, a FontBook user interested in the font "Agency" by David Berlow on page 5 of the "Sans" section wants to know the "manufacturer" (= foundry) of this font. For this purpose, the user looks up the font "Agency" in the "Contents" section, where he - in this case, luckily - finds the equation</p>
      <p>"Agency = FB".</p>
      <p>because here the "manufacturer" of the font is correctly given. But this is often not the case, as has been exemplified in my first posting to this thread, so that the reader may read the equation</p>
      <p>"Agency = M".</p>
      <p>This is bewildering, because "M = Monotype" is not the "manufacturer" of the font Agency, but only one of many dealers, sellers or distributors of this font Agency, or - worst case - a foundry which is neither the manufacturer nor the distributor of the font Agency.</p>
      <p>Exactly this happens in the "Contents" section with the Adobe fonts and also with many fonts by numerous other foundries, i.e. the "Contents" section often does not state the true "manufacturer", but instead a distributor or another company, which is not the true "manufacturer" (= true foundry).</p>
      <p>The confusion of the FontBook readers could be remedied by renaming the header on page 54 from "Manufacturer" to "Dealer", but many users want to know the "manufacturer". And the true "manufacturer", e.g. Font Bureau, certainly also prefers to see the true manufacturer equation "Agency = FB" instead of the wrong manufacturer equation "Agency = M".</p>
    html_clean: |-
