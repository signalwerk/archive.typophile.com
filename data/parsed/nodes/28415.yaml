      <p><em>“worked for Berthold”</em><br>
      I work for clients, that’s how i make a living. That doesn’t mean they employ me. I designed literature, advertising, exhibitions and specimens for Berthold from the early 80s until their demise and they paid my fees for that work. You should perhaps sometimes think about what you read and not simply repeat the words like a parrot. </p>
      <p>And only one word about the book: we can only print fonts that we have, as we do not steal data, nor scan specimens in from other books. If suppliers won’t let FSI have that data – for whatever reason – we cannot show it. Blame the foundries, not the publishers. With 35,000 showings, FontBook is still a compendium. It doesn’t claim anywhere to be exhaustive, complete or the only reference book. We measure ourselves by our deeds, not by someone else’s words.</p>
      <p>Don’t you have a day job or do you spend all your time complaining about other people?</p>
