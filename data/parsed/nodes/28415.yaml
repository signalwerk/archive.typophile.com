      <p>&gt; 1. My first name is spelled with a k, as in Erik, not with a c. It is printed properly on the cover of the FontBook. </p>
      <p>I intentionally wrote "Eric" instead of "Erik" to keep the Typophile readers happy and alert knowing that you as a hair-splitter would fall for that trap.</p>
      <p>&gt; 2. I have never been an employee of Berthold or any of its affiliates. I have no idea where you get that information from.</p>
      <p>In your own biography at the FontShop website, you write yourself: "arbeitete vornehmlich für die graphische Branche - darunter Berthold", i.e. "worked for Berthold". So you yourself confessed that you worked for Berthold, didn't you?</p>
      <p>&gt; 3. That book is called a “compendium” of digital fonts. Look up what that word means.</p>
      <p>In your own preface to the FontBook 2006, you declare that this compendium "is a truly unique type encyclopedia" (see page 6). So you yourself explained what the word "compendium" means for you, didn't you?</p>
      <p>&gt; Shoddy work like this disqualifies anybody from commenting on other peoples’ work.</p>
      <p>Do you mean by "shoody work" your own FontBook 2006?</p>
      <p>&gt; And as has been said by others, there are many reasons why not every typeface under the sun is in the FontBook. It always takes two sides to make a bargain.</p>
      <p>I did not say that a one-volume book can contain "every typeface under the sun".</p>
      <p>The crucial point is that you write in your own preface: "The editors emphasise their desire to present a work of reference rather than a sales catalogue" (see page 7). But your FontBook 2006 is not a work of reference, it is a sales catalogue:</p>
      <p>- In a "work of reference", in a "truly unique type encyclopedia", a font manufacturer (e.g. Adobe) and his fonts (e.g. Adobe Garamond Premier Pro) are included by objective criteria.</p>
      <p>- In a "sales catalogue", a font manufacturer and his fonts are included, if you can "make a bargain" (your own words) with the font manufacturer.</p>
      <p>Since the font manufacturer Adobe did not "make a bargain" with you, this font manufacturer was excluded from the FontBook, and since you could "make a bargain" concerning the Brendel font forgeries , they were included by you. "Bargain" may be okay for a "sales catalogue", but "bargain" is definitely not okay for "a work of reference", for "a truly unique type encyclopedia".</p>
