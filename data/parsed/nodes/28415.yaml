      <p>A  few <em>short, rightful answers</em>:<br>
      1. Adobe fonts are distributed by many companies, e.g. Monotype, Linotype, Agfa. Data is always identical. Like you can buy a Mercedes from the plant in Stuttgart, from your local dealer, a dealer in another city. It's always a Mercedes and it'll look just the same on a picture. Nothing false about distributing identical fonts from different sources.</p>
      <p>2. It makes a hell of a difference to me whether i had been employed by a company or worked for them in a designer-client relationship. If someone who pretends to be diligent and detail-oriented alters my biography with one keystroke, i feel obliged to correct it. That has nothing to do with other issues.</p>
      <p>3. There are many mistakes in the FontBook, which is inevitable with that amount of data. Some of them are human errors: we didn’t catch them or we left something out inadvertently. Some have to do with false data, late data or no data. There will be Errata pages as our readers help us collate omissions and other mistakes. Go to <a href="http://www.fontbook.com" title="www.fontbook.com">www.fontbook.com</a>, where our corrections will be posted; some as pdf for download.</p>
      <p>4. As has already been pointed out: the FontBook was out of date the minute we closed the database. And that was months before it was printed. We rely on foundries, friends and collaborators to supply new materials while we think about the next edition. Right now, we're all tired and proud that we managed to collate, edit, and print 1760 pages. </p>
      <p>5. The only way to avoid making mistakes is not to make anything. Which obviously is what some people are very good at.</p>
