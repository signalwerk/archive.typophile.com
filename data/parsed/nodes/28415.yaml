      <p>Uli</p>
      <p>The FontBook team have probably received their "Adobe" fonts from Monotype - that's why they are marked as "Monotype" fonts. Monotype is the FontBook source of these "standard" fonts. They could have been supplied by Adobe, they could have been supplied by Linotype...</p>
      <p>Note that most of the fonts available through Adobe are originally made by Monotype, Linotype and ITC, usually crosslicenced - for distribution purposes - between them.</p>
      <p>So e.g. Frutiger - originally from Linotype - is often referred to as an "Adobe" font - even when it is distributed through Monotype.<br>
      Not too difficult, is it?<br>
      ;-)</p>
      <p>Jacob</p>
