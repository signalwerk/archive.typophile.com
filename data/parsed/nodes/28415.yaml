    <p>In September 2006, the new FontBook 2006 edited by Eric Spiekermann and Jürgen Siebert and others was published replacing the old FontBook 1998. After comparing FontBook 2006 with FontBook 1998, I doubt whether the new FontBook 2006 is a non-partisan, objective reference work. It seems to me that the new FontBook 2006 is a non-impartial sales catalog selecting fonts by party-political criteria.</p>
    <p>Let's start by having a look at the list of font manufacturers. In the old FontBook 1998, the list of manufacturers (see page 17) started with</p>
    <p>- Adobe<br>
    - Berthold</p>
    <p>whereas in new FontBook 2006, the list of font manufacturers (see page 54) does no longer contain Adobe and Berthold. This means that the editors Eric Spiekermann and Jürgen Siebert make the FontBook users believe that e.g. Adobe does not longer exist as a font manufacturer.</p>
    <p>The newer Adobe fonts Warnock (2000), Bickham Script (2000), Chaparral (2000), Montara (2001), Brioso (2002), Kepler (2003) and Garamond Premier Pro (2005) etc. have been excluded entirely from the FontBook 2006, whereas some older Adobe fonts, e.g. Minion, Myriad, Utopia, Tekton, are still included in the new FontBook 2006, but are now described as fonts made by Monotype as font manufacturer and not as fonts made by Adobe as font manufacturer, because Adobe was deleted by the editors Eric Spiekermann et al. from the list of font manufacturers and replaced by Monotype.</p>
    <p>In the old FontBook 1998, on looking up Minion, Myriad, Utopia, Tekton etc., you will see in the yellow bar by the letter "A" (= manufacturer Adobe) that these fonts are manufactured by Adobe. In the new FontBook 2006, on looking up Minion, Myriad, Utopia, Tekton etc., you will see that the letter "A" for Adobe in the yellow bar was deleted, and on consulting the new "Contents" section at the beginning of the book, you will see that these Adobe fonts are now labeled "C" denoting "Monotype Imaging", e.g.</p>
    <p>Minion = C = Monotype (see page 31 of FontBook 2006),<br>
    Utopia = C = Monotype (see page 49),<br>
    Tekton = C = Monotype (see page 46).</p>
    <p>A few Adobe fonts are also ascribed to Linotype, e.g. Myriad = LH = Linotype (see page 32), but none of the Adobe fonts is ascribed to Adobe by the editors Eric Spiekermann et al.</p>
    <p>A final example: The old FontBook 1998 contained both Cronos by Adobe and Today by Scangraphic. Now in the new FontBook 2006, Eric Spiekermann et al. removed Adobe's Cronos, but kept Today of the defunct Scangraphic outfit.</p>
    <p>Although nobody can call me a friend of Adobe's (see my critical documentations about Adobe at <a href="http://www.forgers.de/forgers/#ADOBE9" title="http://www.forgers.de/forgers/#ADOBE9">http://www.forgers.de/forgers/#ADOBE9</a>), I consider it necessary to say in favour of Adobe that it is non-objective and even ridiculous by Eric Spiekermann and Jürgen Siebert, who edited the FontBook 2006, that they removed Adobe as a font manufacturer, and I also think that it is non-scholarly and non-impartial that Eric Spiekermann and Jürgen Siebert excluded most of the newer fonts manufactured by Adobe, e.g. Brioso, Chaparral, Garamond Premier Pro, Kepler, Warnock, etc., which are important enough for the history of typefaces to justify their inclusion into a FontBook containing 35,000 fonts.</p>
    <p>Whereas the old FontBook 1998 contained all Berthold fonts, the new FontBook 2006 contains none of them at all. Here again, from the scholarly point of view, a non-partisan reference work would include these fonts, although it is understandable that Eric Spiekermann, who once was an employee of the defunct Berlin stock-holding company H. Berthold AG, is not longer willing to include the Berthold fonts into the new FontBook on account of the fact that he was harassed and sued by well-known Chicago conmen (who no longer live in Chicago).</p>
    <p>For typeface researchers, the FontBook 2006 is not only made incomplete by the exclusion of the historically important Berthold collection, but there now also arise other problems for researchers. For example, in the old FontBook 1998, the font FF Dax was provided with the reference to the font Barmen, while in the new FontBook 2006, this reference was dropped with the consequence that readers are intentionally withheld the information that FF Dax distributed by FontShop is a reworking of the old Berthold font Barmen made by the same designer (see <a href="http://www.forgers.de/forgers/#BARMEN" title="http://www.forgers.de/forgers/#BARMEN">http://www.forgers.de/forgers/#BARMEN</a>).</p>
    <p>While the new FontBook 2006 annoys by the exclusion of Adobe, Berthold and other large font manufacturers, this new FontBook surprises by the inclusion of small font forgering outfits that had been excluded from the old FontBook 1998. An example is the Brendel font forging company. In 1997, FontShop initiated a multi-year lawsuit against the Brendel font forging outfit in Cologne (Germany) with the favorable result for FontShop that the Brendel outfit went broke. However the defunct Brendel outfit was founded again as the Quick Brown Fox outfit in Cologne (see <a href="http://www.qbf.de" title="http://www.qbf.de">http://www.qbf.de</a>) selling again the Brendel forgeries which are also sold by Greenstreet, Softmaker and other font forging outfits (see <a href="http://www.forgers.de/forgers/#GREEN" title="http://www.forgers.de/forgers/#GREEN">http://www.forgers.de/forgers/#GREEN</a>).</p>
    <p>Much to my surprise, these Brendel font forgeries (e.g. Diamante, Dragon, Lingwood, Nashville, Pasadena, etc.) which are sold by QBF, Greenstreet and Softmaker at 0.01 Euro per font and which had been excluded from the old FontBook 1998 for the reasons stated above, have now been included into the FontBook 2006, because the Elsner + Flake outfit in Hamburg recently grabbed these Brendel font forgeries (presumably by exploiting the Greenstreet font forgery CD) and is now selling these font forgeries at 35.00 Euro per font through FontShop. This explains why Eric Spiekermann and Jürgen Siebert decided to include these Brendel font forgeries into the new FontBook 2006.</p>
    <p>Under these circumstances, it cannot be denied that the new Fontbook 2006 is a non-impartial sales catalog and not an objective reference work. Here a final example: In the old FontBook 1998, in section Slab Serif, page 9, two Candida typeface versions are shown, the first one labeled "A" = Adobe, and the second one labeled "B" = Berthold. In the new FontBook 2006, on account of the fact that Eric Spiekermann and Jürgen Siebert no longer like Adobe and Berthold, two other Candida typeface versions are shown in the section Slab, page 11. The first one is the version by Neufville, and the second one is the version by Elsner + Flake which is selling the Brendel font forgeries through FontShop.</p>
    <p>Uli<br>
    (<a href="http://www.forgers.de" title="http://www.forgers.de">http://www.forgers.de</a>)</p>
