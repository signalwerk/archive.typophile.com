    html: "<p>Sorry, I had hoped that by now some SoTA member would have chimed in. Or, at the very least, the publication's designer: Stephen Coles. <br> <br>So yeah, Interrobang is a little 2-color newslettery type of thing. My scanner is broken and I can't find my digital camera, otherwise I would post some pictures. It has an article by Nick Shinn, another by Coles and it features some typefaces like Jared's own... um, yeah, Yakuza. Looks like a pretty cool project.  <br> <br>And I did not know what interrobang stood for.</p>"
