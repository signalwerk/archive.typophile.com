    html: '<p>“Interrobang” is a modest little something (32 pages,  8 1/2” x 5 1/2”, black + 1 spot color) for members of SoTA, and for us to put in the goody bag at TypeCon…and perhaps the <span class="caps">AT</span>ypI conference. <br><br>Contents: articles (2), member news items (1), new typeface designs (5). <br><br>I wrote an article for it, so did Stephen Coles. He designed it, using several of my typefaces for the editorial matter. Next time (Winter) the content and font sources will be diﬀerent. Bigger and Badder? Leaner and Cleaner? — It remains to be seen, but the kind of content will be similar. <br><br>There are 6 new typefaces proﬁled, from 6 diﬀerent sources. It’s nice to see a variety of new work in print — there’s not much out there (that isn’t a foundry self-promotion) since the demise of Druk. Sure, you get a good perspective in the Veer catalog, but there’s no depth on individual typefaces, which “Interrobang”&nbsp;provides.</p>'
