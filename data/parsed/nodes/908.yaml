  html: <p>So, just this past weekend I was able to go through my TypeCon2003 goodie bag and came upon Interrobang. Left me longing for a bit more of it… what’s the deal SoTAphyles? Are we gonna see more of it? Bigger and badder? Leaner and cleaner? <br><br>I like what you have done with it so far. I would love to hear all the perils of getting it&nbsp;published.</p>
