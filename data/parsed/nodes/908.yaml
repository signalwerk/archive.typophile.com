    html: '<p>google gave me this, I am not sure if it’s what this is about, but thought it was interesting enough to post. <br><br><br>The <span class="caps">INTERROBANG</span>: A twentieth century punctuation mark. <br><br><br>The <span class="caps">INTERROBANG</span> has been described as “an obscure punctuation mark.” The purpose of this page is to move the <span class="caps">INTERROBANG</span> from the obscure to the ubiquitous.  <br><br>A <span class="caps">SHORT</span> <span class="caps">HISTORY</span> <br><br>As an advocate of precision in communication, the concept of the <span class="caps">INTERROBANG</span> was introduced by Martin K. Speckter in 1962 in an article written for <span class="caps">TYPE</span>talks Magazine.*  <br><br>The <span class="caps">INTERROBANG</span> was created to ﬁll a gap in our punctuation system where writers often used typographically cumbersome and unattractive combinations of the question mark and exclamation mark to punctuate rhetorical statements where neither the question nor an exclamation alone exactly served the writer. (<span class="caps">HOW</span> <span class="caps">ABOUT</span> <span class="caps">THAT</span>?!)  <br><br>Mr. Speckter called his mark <span class="caps">INTERROBANG</span> from the Latin for query and the proofreader’s term for exclamation. Most dictionaries have spelled the word correctly, although several other spellings with no logical genesis have appeared.  <br><br>At the time the <span class="caps">INTERROBANG</span> was introduced in 1962, a number of graphic designs were sent to the magazine from many sources. An example from this outpouring is shown above. Many newspapers and magazines and talk shows reported on the new mark. In an April, 1962 editorial, The Wall Street Journal deemed this punctuation exactly right for “ ‘Who forgot to put gas in the car?’ where the question mark alone just isn’t adequate.” The <span class="caps">INTERROBANG</span> can convey in print an attitude, curiosity, and wonder.  <br><br>American Type Founders issued a metal typeface in 1966 called Americana which included the <span class="caps">INTERROBANG</span>. Remington Rand included the key as an option on its 1968 typewriters, commenting that the <span class="caps">INTERROBANG</span> “expresses Modern Life’s Incredibility.” In 1996, a New York art studio designed variations of the mark for each of the fonts in its computer library.  <br><br>You can ﬁnd an interrobang in Microsoft Word’s Fonts. Go to Format, choose Fonts, then Wingdings 2. You’ll ﬁnd 4 diﬀerent versions of the interrobang. Hit the ` ~ key, the ] } key, the 6 ^ key, or the — _ key.  <br><br><br></p>'
    html_clean: '<p>google gave me this, I am not sure if it’s what this is about, but thought it was interesting enough to post. <br><br><br>The <span class="caps">INTERROBANG</span>: A twentieth century punctuation mark. <br><br><br>The <span class="caps">INTERROBANG</span> has been described as “an obscure punctuation mark.” The purpose of this page is to move the <span class="caps">INTERROBANG</span> from the obscure to the ubiquitous.  <br><br>A <span class="caps">SHORT</span> <span class="caps">HISTORY</span> <br><br>As an advocate of precision in communication, the concept of the <span class="caps">INTERROBANG</span> was introduced by Martin K. Speckter in 1962 in an article written for <span class="caps">TYPE</span>talks Magazine.*  <br><br>The <span class="caps">INTERROBANG</span> was created to ﬁll a gap in our punctuation system where writers often used typographically cumbersome and unattractive combinations of the question mark and exclamation mark to punctuate rhetorical statements where neither the question nor an exclamation alone exactly served the writer. (<span class="caps">HOW</span> <span class="caps">ABOUT</span> <span class="caps">THAT</span>?!)  <br><br>Mr. Speckter called his mark <span class="caps">INTERROBANG</span> from the Latin for query and the proofreader’s term for exclamation. Most dictionaries have spelled the word correctly, although several other spellings with no logical genesis have appeared.  <br><br>At the time the <span class="caps">INTERROBANG</span> was introduced in 1962, a number of graphic designs were sent to the magazine from many sources. An example from this outpouring is shown above. Many newspapers and magazines and talk shows reported on the new mark. In an April, 1962 editorial, The Wall Street Journal deemed this punctuation exactly right for “ ‘Who forgot to put gas in the car?’ where the question mark alone just isn’t adequate.” The <span class="caps">INTERROBANG</span> can convey in print an attitude, curiosity, and wonder.  <br><br>American Type Founders issued a metal typeface in 1966 called Americana which included the <span class="caps">INTERROBANG</span>. Remington Rand included the key as an option on its 1968 typewriters, commenting that the <span class="caps">INTERROBANG</span> “expresses Modern Life’s Incredibility.” In 1996, a New York art studio designed variations of the mark for each of the fonts in its computer library.  <br><br>You can ﬁnd an interrobang in Microsoft Word’s Fonts. Go to Format, choose Fonts, then Wingdings 2. You’ll ﬁnd 4 diﬀerent versions of the interrobang. Hit the ` ~ key, the ] } key, the 6 ^ key, or the — _ key.  <br><br><br></p>'
