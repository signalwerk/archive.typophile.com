    html: |-
      <p>OK, it took me 14 months to figure this out: </p>
      <p>If the top of your Word 2010 document window says "Compatibility Mode" — as it will if you open a document created in an earlier version of Word — Word 2010 will disable the OpenType features (to preserve layout compatibility with previous versions). </p>
      <p>To fix this, go to File &gt; Info &gt; Convert and upgrade the document to Word 2010 format. Then the OpenType features will activate.</p>
    html_clean: |-
      <p>OK, it took me 14 months to figure this out: </p>
      <p>If the top of your Word 2010 document window says "Compatibility Mode" — as it will if you open a document created in an earlier version of Word — Word 2010 will disable the OpenType features (to preserve layout compatibility with previous versions). </p>
      <p>To fix this, go to File &gt; Info &gt; Convert and upgrade the document to Word 2010 format. Then the OpenType features will activate.</p>
