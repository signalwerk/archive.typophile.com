      <p>Most likely depends on which PMS 296 you mean. Coated, Uncoated, Matte, etc. I'd probably check with your printer for best results and keep the design file in PMS for them to separate.</p>
      <p>From Illustrator CS3</p>
      <p>Solid to Process - 100/46/0/70<br>
      Coated - 100/66/0/2<br>
      Uncoated - 100/94/0/29<br>
      Matte - 100/46/0/70</p>
