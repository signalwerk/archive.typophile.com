    <p>I’m having a bit of trouble finding the CMYK equivalent to PMS 296.<br>
    I have 4 different recipes.</p>
    <p>100 c 73 m 30 y 83 k (swatch pantone coated booklet 2005)<br>
    100 c 46 m 0 y 70 k (swatch pantone coated booklet 2002 &amp; Indesign/Illustrator swatch charts)<br>
    92 c 75 m 54 y 66 k (Photoshop equivalent)<br>
    100 c 47 m 0 y 69 k (google search)</p>
    <p>Could some one give me the CMYK equivalent from a 2008 or 2007 Pantone Coated swatch booklet.</p>
    <p>Thanks</p>
