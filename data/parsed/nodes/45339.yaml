      <p>Mine says 100c, 73m, 30y, 83k so it must be 2005 or later. It's the color bridge coated, first edition, and I think I got it within the last 2 years.</p>
      <p>I'd use the formula guide, not Illustrator equivalents. </p>
      <p>Some printers will charge extra if you have them separate the PMS colors for you, might want to check.</p>
