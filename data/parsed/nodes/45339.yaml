      <p>Thanks for your answer.<br>
      It's just that my client's version (recipe) of PMS 296 (solid to process) dates back to 2002.<br>
      I have a 2005 Pantone swatch book and the recipe isn't the same.<br>
      I just wanted to let them know that by declaring their logo PMS 296 they risk getting different shades of blue depending on which Pantone swatch book the designer has.<br>
      I also wanted to know if my 2005 recipe was the most recent. I know Pantone has released new swatch books but I don't have the latest version and was hoping to find someone with a more recent swatch book ie. 2006/2007 or 2008 to give me the recipe.</p>
