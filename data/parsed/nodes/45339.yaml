    html: |-
      <p>Hi you also have to look at how it is printed, Pantone changes colours like the wind, at least we are now aware of it. The best way I have found is to cross check with a SWOP Spot to Process vs Euroscale Spot to Process and make a educated guess based on how your printer prints AND THE STOCK you are printing on and also what they match to ie your proof or theirs. The safest way it to get the printer to match... though this can have unexpected results... because printers can get spots wrong.</p>
      <p>My first choice has always been Euroscale Spot to Process.  With magazines I use SWOP, though I am using Quickprint and Pagestore to manage this.</p>
