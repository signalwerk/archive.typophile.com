      <p>According to the still-evolving ATypI<br>
      multi-lingual terminology project:</p>
      <p>x-Height is:<br>
      "hauteur des bas de casse"</p>
      <p>and</p>
      <p>Baseline is:<br>
      "ligne de base"<br>
      or<br>
      "ligne d'écriture"</p>
      <p>hhp</p>
