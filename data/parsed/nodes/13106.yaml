      <p>I had wanted to learn these myself. I learned a few by comparing the english and french versions of Porchez's site, but I'm sure that they will not be much of a surprise:</p>
      <p>roman = romain<br>
      italic = italique<br>
      titling = titrage</p>
      <p>I'd also be interested in learning the rest.</p>
