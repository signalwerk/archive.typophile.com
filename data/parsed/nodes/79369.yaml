    html: |-
      <p>Elton:</p>
      <p>Since nobody helps you, I try to give you an explanation:</p>
      <p>I entered those letters of epson.gif supplied by you here:</p>
      <p><a href="http://www.linotype.com/de/22/fontidentifier.html" title="www.linotype.com/de/22/fontidentifier.html">www.linotype.com/de/22/fontidentifier.html</a></p>
      <p>But this font identifier did not find a <strong>single</strong> matching font.</p>
      <p>Therefore, it is very likely that Epson modified and mixed the letters of <strong>different</strong> existing fonts, for example the font "Handel Gothic", whose figures "1" and "2" and whose letter "L" are very similar.</p>
