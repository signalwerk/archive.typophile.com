  html: |-
    <p>Great news! We've got Twitter integration up and running. If you go into your profile via:</p>
    <p>My Account &gt; Edit &gt; Social Networks</p>
    <p>you'll see this new panel:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/twitter_integration_3778.gif"></div><p></p>
    <p>If you enter in your Twitter username and password, every time you post a new Forum Topic or Blog to Typophile, it will update your Twitter account with the new content! Tweets are not sent when commenting.</p>
    <p>Note: Twitter account information is encrypted and it's passing through to Twitter.</p>
    <p>You can edit the format of how tweets are posted by manipulating the Text Format field.</p>
    <p>Have fun!</p>
    <p>//jared</p>
