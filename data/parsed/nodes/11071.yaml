    html: <p>IMO, bullets are usually about 30% too large in most  <br>typefaces. If you're using Quark or InDesign you can set <br>up a character style sheet to make them a smaller point  <br>size. Just adjust the baseline to compensate. <br> <br>For alternate bullets try an underscore or a hyphen. They're <br>more understated. <br> <br>Or question bullets entirely. People don't always need to  <br>see a bullet to know they're reading a list. Achieve the same <br>thing with line spacing.</p>
