    html: <p>I get alot of text with bullets at work as well, and I've become convinced that copywriter's facination with bullet points can be blamed entirely on PowerPoint. <br>Generally, I find that removing bullets altogether is the best way to handle lists. They can be unsightly and clutter the text. Set a list the same way you'd set the body, and add a little leading between points (if the body is 10/12, then between points in the list, put a hard break of 14 or 16). It's not great typography, but it's not great copy either.</p>
