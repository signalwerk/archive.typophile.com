    html: <p>I am working on a long text right now (that I should  <br>have completed weeks ago!) that has a number of very  <br>necessary [originally bulleted] lists. I found that  <br>aligning to the initial indent of the text provided  <br>adequate emphasis without introducing an added  <br>element. <br> <br>sometimes I find the need to use a white line between  <br>list items, other times it's superfluous. but there are  <br>occasions when a bullet helps to clarify. as others  <br>mentioned, you simply have to make sure it's not too  <br>heavy. some fonts work best using the midpoint, others  <br>(eg Myriad) have well-proportioned bullets that need  <br>little to no adjustment.</p>
