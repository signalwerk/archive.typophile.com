    <p>I'm struggling with the amount of bullet points that are constantly in the texts I work with regularly. I personally despise bullet points, but I don't get to edit these texts. Any suggestions for formatting them to look their best? Currently, I have the bullet at the left margin edge, then a tab, with the rest of the text lining up to that tab (most of the bulleted text I work with is multiple lines). There are no paragraph spaces between items, or between the list and the text. I haven't found any examples of bulleted text that I like, so I'm not sure what else to try.</p>
