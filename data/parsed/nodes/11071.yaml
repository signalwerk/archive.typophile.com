    html: "<p>I really hate bullets and all they stand for: the inability to write coherent text, to express connection, or to organise a list into any order. I have a queasy suspicion that the very word \"bullet\" has coincidentally contributed to their grotesque popularity, with its connotations of deadly speed. A bullet point is not just a point: it is a killer, swift and sure and aimed at its target. <br> <br>I agree with those who suggest using either a midpoint or a reduced size of bullet. I would not succumb to the temptation to use some other symbol (asterisks, or hyphens, or guillemets, or plus signs or whatever ...) because each has its proper function, and appropriating symbols with common uses to do service in some other task causes momentary confusion. (I suppose a pure ornament would not suffer from this, but it hardly solves the problem. Anyway, what has an ivy leaf got to do with anything: decorated bullets are worse.) <br> <br>And I wouldn't dispense with the bullet altogether because I think the decision to use a bullet carries semantic weight for the writer: the writer wanted a \"set of bullet points\" (that's how these people think) not just a list, and if you give her/him a list you are in some sense altering the meaning of the text, subtly but perceptibly, in a way I think one normally shouldn't. At least, if you are going to do that you should go back to the writer and say \"These bullet points look bad, could we do ...\"</p>"
    html_clean: "<p>I really hate bullets and all they stand for: the inability to write coherent text, to express connection, or to organise a list into any order. I have a queasy suspicion that the very word \"bullet\" has coincidentally contributed to their grotesque popularity, with its connotations of deadly speed. A bullet point is not just a point: it is a killer, swift and sure and aimed at its target. <br> <br>I agree with those who suggest using either a midpoint or a reduced size of bullet. I would not succumb to the temptation to use some other symbol (asterisks, or hyphens, or guillemets, or plus signs or whatever ...) because each has its proper function, and appropriating symbols with common uses to do service in some other task causes momentary confusion. (I suppose a pure ornament would not suffer from this, but it hardly solves the problem. Anyway, what has an ivy leaf got to do with anything: decorated bullets are worse.) <br> <br>And I wouldn't dispense with the bullet altogether because I think the decision to use a bullet carries semantic weight for the writer: the writer wanted a \"set of bullet points\" (that's how these people think) not just a list, and if you give her/him a list you are in some sense altering the meaning of the text, subtly but perceptibly, in a way I think one normally shouldn't. At least, if you are going to do that you should go back to the writer and say \"These bullet points look bad, could we do ...\"</p>"
