    html: "<p><i>&gt;IMO, bullets are usually about 30% too large in most typefaces.</i> <br> <br>I think that's because the bullets are usually dimensioned proportionally to the typeface em-square (iirc, most typefaces have a bullet which diameter=1/2em), and not to the typeface weight. <br> <br> <br><i>&gt;I have a question concerning the design of bullet: do you prefer a bullet who change when the weight of the typeface change or stay identical for all the family?</i> <br> <br>This is a nice question. Most typefaces around have the same bullet for all weights. It seems a good solution, considering its conventional usage (as marks for listed items). But I'd like to listen to more experienced designers here too. <br> <br></p>"
