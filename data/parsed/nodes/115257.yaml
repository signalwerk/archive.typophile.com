      <p>Outstanding!</p>
      <p>Your link to the wikipedia article was a big help. It's also a big help to understand that there was a stylistic trend for "rugged" fonts at one point, and that they weren't at the time thought of as "distressed."</p>
      <p>I don't think it's necessary, for my client's purposes, for a type specimen of Goudy's 1903 "Powell" to be found. I'd certainly be interested to see one, just for the comparison, but there's no budget for anything like a revival.</p>
      <p>I'm about to recommend Goudy 38, Goudy's "Village", or (for a different direction) Roos (or Dutch Mediaeval/Erasmus if they want something darker). I don't think we're going to find what I'd think of as a "perfect match" for this display font... I'm just gonna have to make some thing "work well enough."</p>
      <p>THANKS for the great information.</p>
