      <p>In the late 1890s foundries started producing some fonts in a style called "rugged" which to our 21st century eye look "distressed" and we expect that there was a smooth font that was distorted. But circa 1900  the rugged fonts were produced as originals to give the impression of being produced by an artist on rough paper, or roughly cut by a punch cutter. Smooth versions of these typefaces were neither produced nor expected. This was part of the movement to replace "artistic" and "aesthetic" typefaces that had been in vogue for about 20 years with a new generation of typefaces that said, vigorous, virile and rugged This  coincided with a cultural shift to imperialism, empire and "manly expression."<br>
      Some well researched books describe the change, e.g. Clouse's _Handy Book of Artistic Printing_ (2009).<br>
      Note that the shift to rugged fonts was for the the part of the typeface market that was mainly advertisers who wanted display fonts that looked like strong handwritten statements and had the other qualities mentioned. This was the field for Morris ,  Goudy and the like.<br>
      For the book market the change was to stronger, i.e. darker, typefaces that achieved mechanical regularity by use of new punch cutting machines that produced type designed fort the new type compositing machines.<br>
      I am attempting to describe a complex set of changes in a relatively short post, a real challenge and clearly neglects important aspects. For example, I could have said more about Morris and his effect, but this was recently discussed at length in <a href="http://typophile.com/node/114418" title="http://typophile.com/node/114418">http://typophile.com/node/114418</a><br>
      Don<br>
      Don</p>
