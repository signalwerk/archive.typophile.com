      <p>Based on the information found so far, the best prospect is to think about fonts similar to Pabst Old Style, by F. W. Goudy. That's not the font, but the style is very close. It has many of the features that Goudy repeated in many fonts -- he was prolific to say the least. Many of his fonts are not digitized. Some info <a href="http://en.wikipedia.org/wiki/List_of_typefaces_designed_by_Frederic_Goudy" title="http://en.wikipedia.org/wiki/List_of_typefaces_designed_by_Frederic_Goudy">http://en.wikipedia.org/wiki/List_of_typefaces_designed_by_Frederic_Goudy</a><br>
      I suspect that this font could perhaps be Goudy's Powell of 1903, produced by the Keystone Foundry. Mr. Powell, who was working at the time as advertising manager for the Mandel Brothers company commissioned the font and it was named after him. Powell had previously commissioned a font for another company. That font became Pabst Old Style.<br>
      As this was a private font, a specimen is not available from the usual sources. But I expect it can be found.<br>
      This might be a false lead. Lanston Type Company has digitized a font called Powell which does not match Steffmann's Powell Antique. Won't know  until we find a specimen of Goudy's Powell of 1903.<br>
      There is at least one web pages reporting the progress of digitizing Goudy's fonts. <a href="http://www.goudyfonts.com/shop-numerical/" title="http://www.goudyfonts.com/shop-numerical/">http://www.goudyfonts.com/shop-numerical/</a><br>
      An alternative is that the font was made by a competitor at BB&amp;s OR elsewhere working in Goudy's style.<br>
      Don</p>
