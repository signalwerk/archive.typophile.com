    html: <p>Well  have to say glad you picked this one out of the original bunch :)  Looks great though, great color choice. Not a heavy black, but not a really light gray. Adds an element of sophistication. As for getting "nit picky" I think another font for the tag is in order as everyone else has said. I also want to see it a tad darker. Only a few shades, nothing too drastic. Or same shade and a slightly thicker font. I just think it sort of gets lost especially being a little far from the main part of the logo.</p>
