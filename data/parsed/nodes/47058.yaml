      <p>I think it looks great, but I agree with SUF that the font for the strapline doesn't quite look the right font, being just a tad too 'sharp'.  If you can try some other serif fonts I'm sure you'll find one that works better.  I'm also wondering if the strapline could be a little closer to the main logo, but i'm sure you tried all these things before settling with the layout you currently have.  I was just thinking maybe a little more equilibrium between the tracking of the strapline letters &amp; the space between the strapline &amp; the logo.</p>
      <p>Glad you feel you can still come here for opinions.</p>
      <p>JH</p>
