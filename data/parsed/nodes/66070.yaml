    html: |-
      <p>This has a lot of potential, Tomi! Make sure you keep those counters as open as possible in the heavier weights to avoid some pitfalls from your earlier families.</p>
      <p>- Some glyphs are missing the stroke modulation that's more obvious in those with curves. This seems fixable on the 's', but I don't know what to tell you on the 'k','v','w','x'. Maybe some very subtle, straight lined tapering? See Amira!</p>
      <p>- I like it's liveliness, but I think the 'g' is leaning a little too far to the left. Maybe move that bottom bowl a bit.</p>
      <p>- The italic needs a lot of work. I think there is too much evidence of automatic slanting, but someone with more experience can explain why.</p>
    html_clean: |-
