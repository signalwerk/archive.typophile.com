    <p>G’day guys,</p>
    <p>I’m working on a newspaper with a whole bunch of photos from a variety of sources and so quality varies greatly. Often I wonder if I should leave people alone or whether I should help nature out a bit: removing pimples, whitening teeth and generally make things look a bit more presentable. Is there an unspoken industry standard along the lines of, we do pimples but don’t whiten teeth, we remove stray beard hairs but we don’t take off kilos etc? </p>
    <p>It’s probably important to point out this is a pretty straight newsy newspaper<br>
    very curious,<br>
    thoughts?</p>
    <p>—N</p>
