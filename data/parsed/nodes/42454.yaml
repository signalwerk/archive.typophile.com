      <p>Usually I only tweak photos if it’s something absolutely garish that stands out because the photographer/makeup person botched the shoot. A little foundation/concealer and good lighting is what makes a photo work, retouching is just the last step in that process.</p>
      <p>But if a big zit is particularly distracting, spot healing brush it.</p>
