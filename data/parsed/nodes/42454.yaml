    html: <p>If it is a newspaper, you must not alter news photos. More than one designer has been fired for doing so. The news is what happened. Someone has a zit, God can remove it, not you. Remember the photog that was fired for adding an additional missile to a photo of an attack in the middle east. He no longer works there. Another controversy was when TV Guide used Oprah’s head and another model’s body ... dunno if heads rolled for that.</p>
