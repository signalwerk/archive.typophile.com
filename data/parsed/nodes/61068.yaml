    <div class="info">Submitted by <a href="/user/111" title="View user profile.">Zara Evens</a> : 17.Aug.2009 11.32am </div>
      <p><a href="http://www.punchcut.com">Punchcut</a> and <a href="http://portland.aiga.org/events/2009/08/33102869">AIGA Portland</a> are proud to present the premier of the <a href="http://portland.aiga.org/events/2009/08/33102869">Typophile Film Festival 5</a>, taking place on the final night of <em>Design à Trois</em> in Portland, Oregon on August 27th 2009.</p>
    <p>The Typophile Film Fest 5 is a one hour selection of typographic films hailing from all over the world including Argentina, The Netherlands, Russia and the United States. The films vary in subject matter and style; creating a dynamic presentation of motion design, typographic animation, short stories, documentaries and interviews.</p>
    <p></p><div class="imageWrap"><img src="/files/TFF5_a_6661.png"></div><p></p>
    <p>Watch the award-winning Typophile Film Festival 4 Opening Credits at <a href="http://www.youtube.com/watch?v=PHPvHwqmPFk" title="http://www.youtube.com/watch?v=PHPvHwqmPFk">http://www.youtube.com/watch?v=PHPvHwqmPFk</a></p>
    <p><a href="http://vimeo.com/typophile" title="http://vimeo.com/typophile">http://vimeo.com/typophile</a></p>
    <p></p><div class="imageWrap"><img src="/files/TFF5_c_4034.png"></div><p></p>
    <p>Venue: Art Institute of Portland, 1122 N.W. Davis Street, Portland OR<br>
    Cost: $10 at the door (members/non-members/students), cash or check only</p>
    <p><a href="http://portland.aiga.org/events/2009/08/33102869" title="http://portland.aiga.org/events/2009/08/33102869">http://portland.aiga.org/events/2009/08/33102869</a></p>
    <p></p><div class="imageWrap"><img src="/files/TFF5_d_3691.png"></div><p></p>
    <p>ABOUT THE EVENT</p>
    <p>Design à Trois is a three night event exploring rock poster design, book cover design and type design. We’ll kick things off with acclaimed rock poster design documentary, “Died Young, Stayed Pretty,” by filmmaker, Eileen Yaghoobian. Next up will be “You SHOULD Judge A Book By Its Cover” - an insightful and amusing presentation on 40+ of the weirdest book cover designs - by NYC designer/comedian, Patrick Borelli. And, last but certainly not least, we will conclude with the national premiere of Punchcut’s newest installment of the Typophile Film Fest, a collection of typographic film shorts.</p>
