      <p>This is rather a tall order.<br>
      I’ve taught “designing and building a typeface” as part of a graphic design degree course at several colleges/universities, and in each case a term/semester of around 14 weeks, 6 hours a week with homework assignments, has been allocated to the task.<br>
      Now, one-on-one software training, direction and feedback from a pro might speed things up a bit, but still…<br>
      Bjørn, how much time have you set aside—do you have 100 hrs?</p>
      <p>The problem is that all these ostensibly technical aspects of type design and production take time to understand and implement:<br>
      - BCP fundamentals<br>
      - Sidebearings<br>
      - Overshoot<br>
      - Stem width variation: horizontal and vertical, straight and curved, upper and lower case</p>
      <p>Therefore, I would recommend working with a simplified application such as Font Constructor.<br>
      Taking that route, the role of mentor would be more brief critique than lengthy instruction.<br>
      Sure, online feedback can play a role, but the stipulation is to have face-time with a mentor.</p>
