      <p>Typophile can offer some great criticism. And it was an incredible help to me when I got started. But there’s also a huge amount of bad information from clueless people (including some of my own posts!), impractical advice from people living in the 1990s, and confusing conversations that result from a lot of people using ill-defined technical language. Some posters write in riddes, and a few are just plain crazy. There is no list of people worth listening. I really would have been a lot better off finding a mentor to work with and ignoring a lot of what I read on Typophile.</p>
      <p>Bjorn, you are lucky to be in a city where you have access to some great mentors. Hopefully Simon will get you in touch with some people who can guide you one-on-one. Take advantage of that resource.</p>
      <p><cite>This is rather a tall order.</cite></p>
      <p>Sure it is, but there have been type designers who started in high school. Jonathan Hoefler is of course an outlier, but he did it. More recently, so has Jasper de Waard. And if high-school students have anything, it’s free time.</p>
