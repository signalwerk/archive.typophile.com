    <p>Hi, I'm a Senior at Shorecrest High School in Shoreline, WA. As a graduation requirement in the state of Washington, we all have to complete a final culminating project of our choice.</p>
    <p>I have chosen to design a typeface for my senior project.<br>
    k<br>
    As part of this requirement, I need a mentor, someone to show and teach me how to build a typeface.<br>
    If you'd like to volunteer your time to help me with this project it would be greatly appreciated.</p>
