      <p>Come on, cut it out!</p>
      <p>Bjorn, you certainly can finish a usable typeface in 30 hours, but you need to accept some constraints in order for it to work: Simplifly the design process by making a modular typeface and simplify the technical process by doing it in Fontstruct.</p>
      <p>You an start a critique thread in order to receive feedback on it's development.</p>
      <p>The most important decision you will face is what kind of modular system will you use. This decision must be determined mainly by the final intended use of the typeface and the aesthetic effect you have in mind.</p>
      <p>Have you already made up your mind about these two issues?</p>
      <p>Great designs are born out of a clear purpose and smart constraints.</p>
