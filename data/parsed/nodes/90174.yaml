      <p>In my experience Typophile critiques are like a bizarro-mentorship, because most of the input is coming from fellow relative newbies. They are the ones with most interest in participating. So it is kind of like a teacherless classroom, but full of motivated students. The blind leading the blind, but at least we're getting somewhere!</p>
      <p>One other point: I certainly have learned from putting my designs up for critique on Typophile (every one of the few substantial projects I've done so far), but I think I learned even more from participating in the threads on others' designs (Nina, Ben, Sindre esp.). So in addition to encouraging Bjørn to consider posting his stuff there, I'd tell him to go follow others' threads there, make observations and ask questions. </p>
      <p>James (Dunwich), you gave me the very first substantial <a class="freelinking external" href="http://typophile.com/node/50618#comment-307869" rel="nofollow">feedback</a> on my very first posted project four years ago. The content of your comments was useful, but even more, that encouraged me to keep going and kicked off the exchange with Typophile critics from which I learned so much. I'm grateful!</p>
