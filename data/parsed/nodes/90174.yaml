    html: <p>Listening to comments in the Critique area does not mean abiding by every one or even any, if that is how it turns out.  What you get is a smorgasbord of variation on your theme.  Many comments oppose each other.  That is a good thing!  It helps you see that there is not any "one true way" and that you have to be willing to make your own contribution based on what you have learned--not how happy you have made all the posters by taking their advice literally. Designing type is a long, mostly solitary, journey.  If you are the kind of person who can not only persevere but look forward to the endeavor, charge ahead.  Keep an open mind and be willing to work countless hours just because you want to.</p>
