      <p>&gt; There is no list of people worth listening.</p>
      <p>And there shouldn't be, lest we all become<br>
      yet more predictable cogs in the machine.</p>
      <p>And this is really no different than the rest of Life.<br>
      The more people you listen to, the better off you are.<br>
      Remember that listening is not equivalent to believing,<br>
      and it's absolutely no substitute for <em>thinking</em>.</p>
      <p>&gt; I really would have been a lot better off finding a mentor<br>
      &gt; to work with and ignoring a lot of what I read on Typophile.</p>
      <p>But you just said "it was an incredible help". And why does<br>
      having a mentor preclude using Typophile? But most of all,<br>
      how do you know? Don't you think your work would have<br>
      been less yours if you hadn't taken the time to slowly wade<br>
      through the good and the bad and decided for yourself?</p>
      <p>To be fair, I guess it depends on one's goals. If a person<br>
      wants to quickly produce imitative, salable fonts based<br>
      on the work of an existing expert, then sure, become a<br>
      good little apprentice.</p>
      <p>&gt; if high-school students have anything, it’s free time.</p>
      <p>Not the good ones.</p>
      <p>hhp</p>
