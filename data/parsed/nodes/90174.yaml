      <p>I don't want to turn Bjørn's first thread into a "your work<br>
      sucks" spitting contest. I wouldn't trade my work for yours<br>
      (or even James's) and I'm sure you feel the same. And I would<br>
      confidently challenge you when it comes to cultural longevity,<br>
      as opposed to number-of-fonts-sold.</p>
      <p>But let's focus on the topic. Type design is indeed complex.<br>
      I think it's even more complex than you think. Does that mean<br>
      a physical mentor is ideal? It sure saves you time. But such<br>
      an education also has a dark side: it tends to make a person<br>
      into a diluted imitation of the master. The amount of time it<br>
      could take to overcome this limiting influence could instead<br>
      be spent finding one's own path from scratch, stumbling much<br>
      more often and taking much longer to get anywhere useful, but<br>
      resulting in something Real. It's quite telling that most type<br>
      designers are self-taught. Aren't you? And in your 5+ years<br>
      of frequenting this place, what have you gotten out of it? Self-<br>
      taught in no way precludes asking for people's help and opinions.</p>
      <p><a href="http://typophile.com/node/90036" title="http://typophile.com/node/90036">http://typophile.com/node/90036</a></p>
      <p>Pay attention to Bjørn's situation. He's graduating high-school.<br>
      Does anybody expect him to produce a salable font? This can't be<br>
      anything more than an -enviable- opportunity to merely start to<br>
      unravel a fascinating craft. And Typophile would expose Bjørn to<br>
      much more than one person ever could.</p>
      <p>hhp</p>
