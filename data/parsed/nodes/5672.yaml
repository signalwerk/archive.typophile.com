    votes: null
    html: <p>Sally -- somehow I think that your moon pointing south-east, as well as Tom's first moon pointing south-west, don't work due to ... well, astronomy. You don't see the moon that way on our hemisphere, do you? Anyway, I think that north-east has most 'universalilty'. (Red Crescent -- the non-christian equivalent to Red Cross has its opening pointing east). <br> <br>I don't see a problem misreading O for C ... having read 'THE' and 'SLEEP' I'm sure noone would go on 'STCRE' ... <br> <br>You still need to adjust the upper stem/curve joints in P and R. <br> <br>I would prefer a normal leg to R ... considering its position right next to the pun. <br> <br>I agree with those that say the E is too broad ... the more 'dull' the other letters are, the more interesting the moon! <br> <br>-- <br>Soren O</p>
