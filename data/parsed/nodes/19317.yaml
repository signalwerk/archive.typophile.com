      <p>Hear hear. I for one am glad to have cut my teeth before the computer revolution. Because type was so much more expensive back then and mistakes/changes so costly, you were required to think much more conceptually from the outset, rather than just sitting down and messing around until you have something you like - or throwing more and more fonts at it until you have a huge mess on your hands. I had a genius boss/mentor who still does very elaborate sketches on paper before sitting down at the computer. I still use his ideas in my work.</p>
      <p>My favorite quote of his: if you do something only once it’s a mistake; twice it’s a design element. Saved my ass a few times.</p>
      <p>All that said, you couldn’t pay me to go back to the days of hand letterspacing, rubylith, and scotch rules.</p>
