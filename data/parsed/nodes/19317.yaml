      <p><em>What is yikes about this? Did I not call it the right thing?</em></p>
      <p>i don’t personally like it when people refer to designers as <em>graphics people</em> (or <em>graphics design</em>, or <em>graphics/design</em>)…it rubs me the wrong way because the only people who i’ve heard use it, usually don’t know much about this amazingly powerful and influential field.</p>
      <p>the plural “graphics” sort of commoditizes what we do as if we are the makers of some sort of widget or something.</p>
      <p>“i’ll get this to my graphics guy, and he’ll whip something up in no time (and not much cost)”</p>
      <p>although i wish there were another term,<em> graphic design</em> (singular) is preferable in this case because it has more to do with visual communication than with simply producing “graphics”. graphic design is a profound practice that affects everyone’s lives, and it just bugs me that we don’t get the respect and prestige we deserve…</p>
      <p>it probably isn’t that big of a deal to you, but i live and breath this stuff…</p>
