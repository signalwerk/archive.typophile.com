    <p>At Paul’s recommendation I asked for the catalog, but now I am wondering, is the 4”x 6” yellow booklet what was talked about, or did they run out of the regular ones? </p>
    <p>Printing quality is very nice, but for my eyesight, many samples were so small I had to strain to see them. Things like this tend to make me feel old, and I don’t need that!<br>
    : )<br>
    Maybe they should have a box you could check if you are over 50, and then send those people a larger version.</p>
    <p>But I will hook up my magnifier lamp thingy and take a better look, maybe this weekend.</p>
