      <p>Graphic designers work their magic in their brains and have had different tools to use over the years (including things not computer related).  Tools do what the human makes them do with both sides of the brain. Technique is just facility with a tool. Communication design exists above technique and requires thought process.  Some so called designers fail at thought process and achieve good technique; for some others, the reverse is true. We have to complete the whole process from concept to execution to be successful.</p>
      <p>ChrisL</p>
