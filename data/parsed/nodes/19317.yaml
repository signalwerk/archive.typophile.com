      <p>&gt; I have nothing but respect for good graphic designers. Every once in a while I am put in my place when I see some magical output from a Photoshop genius or illustrator.</p>
      <p>That’s the thing though, pretty “graphics” has no meaning or significance in the field of visual <cite>communication</cite> if it doesn’t <cite>communicate</cite> a message well. For instance, some Photoshop or Illustrator genius could whim up an amazing image or a sublime vector illustration and still be completely pointless in this regard (there is a lot of this garbage out there at the moment unfortunately, I just call them art). Graphic design is about effectively communicating a message visually, not about creating beautiful graphics. This is what I think Nick was trying to say. </p>
