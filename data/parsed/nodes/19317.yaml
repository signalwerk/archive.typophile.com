      <p>sure. when i’m working on a project i am excited about, i have a lot of fun doing what i love to do. i guess it’s hard to explain this to someone who is outside the field (directly), but it can be really tough to satisfy the needs of your clients, and even more difficult is to really nail something, which usually combines the perfect solution to the given problem with some kind of innovation that is the first of it’s kind.</p>
      <p>(deep breath)</p>
      <p>the very vague term <em>graphic design</em> is multi faceted and a <em>graphic designer</em> must be proficient in all the various principles of design, the variety of printing and manufacturing techniques required to mass-produce different materials, the software used, and all the technical difficulties that have to do with, proofing, color matching, pre-press, project management/workflow, archiving, and to top it off, all the larger issues like business practices, consulting, positioning, and of course strategy.</p>
      <p>so i think there’s a little more to it than selecting photos and choosing typefaces.<br>
      : )</p>
      <p>ps<br>
      i too am sorry for highjacking this thread. i’ll try to stop…</p>
