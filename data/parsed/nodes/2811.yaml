    html: "<p>I don't have read all this page, but what I can say is it more simple than formula and so on. Each new font require different way, just because the contrast is variable and some have Serifs, others not. Some need to be used in small size, so large counters in Black when others mostly for display. <br> <br>Don't miss also that a real letter is not just a + or a circle. <br>When designing a Black, I say BLACK not b l a c k as in many case, most of the job is to achieve the perfect visual weight, not the mathematical weight: So a g lc will be very different than n. Same for the horizontal of a B or E compared to vertical of a N, etc. <br> <br>And in Thin weight it will be more mathematical adjustment, as less contrast by definition. <br> <br>So, when you interpolate such extrems, your regular or demi can suddenly appear to contrasted when x an y interpolation are same values. So, again some adjustment need to be made. <br> <br>Not also that an interpolate curve is not straight, the regular between thin and black is not at 50%! <br> <br>Here after some adjustement made for Anisette intermediate weight. <br><img src=\"http://www.typophile.com/forums/messages/4100/24926.gif\" alt=\"\"></p>"
    html_clean: "<p>I don't have read all this page, but what I can say is it more simple than formula and so on. Each new font require different way, just because the contrast is variable and some have Serifs, others not. Some need to be used in small size, so large counters in Black when others mostly for display. <br> <br>Don't miss also that a real letter is not just a + or a circle. <br>When designing a Black, I say BLACK not b l a c k as in many case, most of the job is to achieve the perfect visual weight, not the mathematical weight: So a g lc will be very different than n. Same for the horizontal of a B or E compared to vertical of a N, etc. <br> <br>And in Thin weight it will be more mathematical adjustment, as less contrast by definition. <br> <br>So, when you interpolate such extrems, your regular or demi can suddenly appear to contrasted when x an y interpolation are same values. So, again some adjustment need to be made. <br> <br>Not also that an interpolate curve is not straight, the regular between thin and black is not at 50%! <br> <br>Here after some adjustement made for Anisette intermediate weight. <br><img src=\"http://www.typophile.com/forums/messages/4100/24926.gif\" alt=\"\"></p>"
