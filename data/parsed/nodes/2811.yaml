    html: "<p>&gt; BTW : DeGroot actually provides three equations on <br>&gt; his site but I have not been able to make anything <br>&gt; out of it so far. If anbody else can explain them  <br>&gt; please let me know! <br> <br>Actually it's only one equation, in different 'arrangements'. <br>I don't know what you want to be explained, I think it's <br>pretty simple. <br> <br>In any case, I've applied his equation to some of your data, <br>and it's surprising. For example: <br> <br>Your data: <br>a = 1.333333333 <br>b = 1.777777778 <br>c = 2.37037037 <br> <br>Result from De Groot's equation b = sqrt(a*c): <br>b = 1,777777777 <br> <br>Another try, your data: <br>a = 74.83091388 <br>b = 99.77455184 <br>c = 133.0327358  <br> <br>De Groot's equation: <br>b = 99,77455184 !!!</p>"
