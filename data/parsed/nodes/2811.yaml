    html: '<p>James, I agree with you as far as perception is concerned. But thats where it ends. Think of the labour. There is more to this issue than just thinking: ‘There it is! I have a nice set of weights.’  <br><br>Obviously if you are making two or three faces for a font then you may be able to wing things a bit — but what about 20 weights? <br><br>You might want to try to automate production. Then check results of course. (I am not advocating using blind dogma to replace the evidence of your senses) You might save maybe 100 or even 1000+ hours of work! Also you might have more time to critically look at the work — as opposed to slogging away. <br><br>Also, a theory which explains why something looks good <span class="amp">&amp;</span> is helpful in general is worthwhile to know about — even if you decide to leave it behind for some reason another. Ever heard of the ‘golden mean’? I don’t think it’s the be all <span class="amp">&amp;</span> end all. But it can be helpful in some cases. <br><br>I will post some experiments I have done over the next few days <span class="amp">&amp;</span> explain my current <span class="amp">&amp;</span> probably naive thinking a bit more.  <br><br>If only I had more math in highschool! <br><br>Hrant? Surely you have ideas about this?&nbsp;:-)</p>'
    html_clean: '<p>James, I agree with you as far as perception is concerned. But thats where it ends. Think of the labour. There is more to this issue than just thinking: ‘There it is! I have a nice set of weights.’  <br><br>Obviously if you are making two or three faces for a font then you may be able to wing things a bit — but what about 20 weights? <br><br>You might want to try to automate production. Then check results of course. (I am not advocating using blind dogma to replace the evidence of your senses) You might save maybe 100 or even 1000+ hours of work! Also you might have more time to critically look at the work — as opposed to slogging away. <br><br>Also, a theory which explains why something looks good <span class="amp">&amp;</span> is helpful in general is worthwhile to know about — even if you decide to leave it behind for some reason another. Ever heard of the ‘golden mean’? I don’t think it’s the be all <span class="amp">&amp;</span> end all. But it can be helpful in some cases. <br><br>I will post some experiments I have done over the next few days <span class="amp">&amp;</span> explain my current <span class="amp">&amp;</span> probably naive thinking a bit more.  <br><br>If only I had more math in highschool! <br><br>Hrant? Surely you have ideas about this?&nbsp;:-)</p>'
