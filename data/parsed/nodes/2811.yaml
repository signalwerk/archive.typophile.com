    html: '<p>John, That helps alot — I had a feeling that there might be a way to steamline the process of looking <span class="amp">&amp;</span> comparing the possibilities — even if it doesn’t give ﬁnnished results.  <br><br>Do you have any suggestions for sources of python scripts? <br><br>An aside about <span class="caps">MM</span> fonts: I think that <span class="caps">MM</span> instances are generated using a linear process. When you make a <span class="caps">MM</span> font you have to decide as the maker where the 50% mark is <span class="amp">&amp;</span> if you will have additional deﬁned midpoints <span class="amp">&amp;</span> if so, where they are  — which lets you establish a sort of curve. Not a true curve but something more like one.  <br><br>As a user of <span class="caps">MM</span> font you have to generate a font <span class="amp">&amp;</span> decide what values it will have and if the maker has only two extremes <span class="amp">&amp;</span> no strategically placed midpoints built in to cause sort of psudo curve then you might think a 75% value is going look like 75% — which it isn’t. Linear scaling does not equal optical scaling. <br><br>I’ll talk more about that in another posting because I see <span class="caps">MM</span> as (maybe) ﬂawed when it comes to generating weights in a purely theoretical sense both with <span class="amp">&amp;</span> without midpoints because it is a linear process. <br><br>There is more to this but I am going to hold oﬀ for now. <span class="caps">MM</span> per se is really a side issue <span class="amp">&amp;</span> not too important in a practical sense at this point.  <br><br>James, Sorry if I came oﬀ as snotty. I didn’t mean to be. I just thought your answer was incomplete. I see now that theory isn’t your thing. Fair enough. I don’t ‘trust’ theories either. I don’t reject them out of hand either. Dogma is a bad thing because it closes your eyes to your own authentic aethetic perception. Dogam about rejecting all theories is equally dubious in my opinion. <br><br>Am I seeking a way out of *all* the labour? No.  <br><br>Some of it? — Deﬁnitely.  <br><br>If I dig a ditch I might choose a shovel rather than a spoon. Does that make me less nobel or my ditch less good because it took me 3 hours vs. 6 days to dig my ditch?  <br><br>I want to avoid the drudgery that computers are good at so I can do what I hope am good at — looking <span class="amp">&amp;</span> judging.  <br><br>In the end I think you are right that the eye has the be the ﬁnal arbiter. I am admittedly new to this. I see that you are not. (Nice stuﬀ <span class="caps">BTW</span>).  <br><br>I also see how doing most things yourself by hand <span class="amp">&amp;</span> not leaving it to machines is the only way to make really solid wothewhile stuﬀ in nearly every case — even when making something like a handwriting font from scans.  <br><br>On the other hand if I can look at lots of sets of weights made with diﬀerent equations (&amp; therefore diﬀerent weight curves) then I imagine I can do a better job of making multiple weights — particularly if there are lots <span class="amp">&amp;</span> lots of weights. <br><br>Quite apart from whether you want math in your font process — you could talk about which model of weights looks better to you; Porchez, DeGroot, someone else, or maybe your own weight system. And you could talk about why you think that. You could talk about how you decided to make the weights you made for Alfon.  <br><br>You could talk about really skinny or fat fonts <span class="amp">&amp;</span> why you don’t make them — or haven’t so far from what I can see on your web site. <br><br>This kind of info could be seen as a trade secret too I suppose… <br><br>Hrant, <br><br>Do you work in multiple weights much or are you concerned with middle/normal weight forms for the most part?  <br><br>All, sorry this entry is so long winded. When I post some examples <span class="amp">&amp;</span> test images with the formulas behind them I am sure they will clarify what I am after <span class="amp">&amp;</span> why better than my typing here has for the past two&nbsp;postings.</p>'
