    html: <p>JFP's post with Anisette sums up the reality of this <br>situation. The Black is usually very different than <br>the thin. For instance, compare the shared stroke <br>weights on a black to that of a thin. It's common to <br>slightly reduce the stroke weight on letters like e and a  <br>in the black but not in the thin. These irregularties will <br>in turn create less than perfect interpolations. This is  <br>where the labor comes in! I recomend coffee <br>in the mornings followed by green tea in the afternoons <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Recently I've been using MM to create my intermediate <br>weights. I've had much better results than just a Blend. <br>I'm not actually making MM fonts, just using MM to  <br>define the weights.</p>
