    html: <p>Hrant, Where was James’ post? The one I referred to earlier? <br><br>Jean Porchez, thanks for looking in!  <br><br>I hope you have time to look closer at my arguement later. If you have anything else to say I would love to hear it — especially anything theoretical in nature, even it turns out that you, like James, reject outright using any sort of theory or math to design fonts. <br><br>Actually, I think I can prove my basic point about curves in general if only because DeGroot clearly used a formula to make some *really* nice fonts <span class="amp">&amp;</span> clearly didn’t use some sort of crude global process as James assumed I was inquiring about.  <br><br>Maybe, if I am fortunate, I can ﬁnd a better curve than De Groot did <span class="amp">&amp;</span> show how an improved curve can work to make something really nice <span class="amp">&amp;</span> really functional.  <br><br>Actually, I think ﬁnding a better curve will probably be easy.  Applying that curve in a sensitive, inteligent <span class="amp">&amp;</span> inspired manner will probably be much, much harder. <br><br>Using a formula for a major element such as acenders will probably be straightforeward. A modiﬁed set of formulas could probably be developed to handle many other aspects of develping a bold ( or light) face. Maybe a diﬀerent curve can or should be invented for altering each major aspect of a font. I don’t know if I will do it — but that it is possible to do <span class="amp">&amp;</span> that some mathematical process’ can help a typographer’s initial process’ both seem obvious to me now.  <br><br>I still wonder which aspects of DeGroot’s face were subject to his formula. Maybe all of them were —  in some way. Maybe he will enlighten us. Wouldn’t that be excellent?  <br><br>I’ll post to this thread if I ﬁnd anything in my experiments that seems useful.  <br><br>If anybody owns a license to a thesis series font <span class="amp">&amp;</span> can hypothesize about the weights work for diﬀerent aspects of the fonts that would be fun to hear&nbsp;about!</p>
