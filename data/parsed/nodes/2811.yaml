ting all theories is equally dubious in my opinion. <br><br>Am I seeking a way out of *all* the labour? No.  <br><br>Some of it? — Deﬁnitely.  <br><br>If I dig a ditch I might choose a shovel rather than a spoon. Does that make me less nobel or my ditch less good because it took me 3 hours vs. 6 days to dig my ditch?  <br><br>I want to avoid the drudgery that computers are good at so I can do what I hope am good at — looking <span class="amp">&amp;</span> judging.  <br><br>In the end I think you are right that the eye has the be the ﬁnal arbiter. I am admittedly new to this. I see that you are not. (Nice stuﬀ <span class="caps">BTW</span>).  <br><br>I also see how doing most things yourself by hand <span class="amp">&amp;</span> not leaving it to machines is the only way to make really solid wothewhile stuﬀ in nearly every case — even when making something like a handwriting font from scans.  <br><br>On the other hand if I can look at lots of sets of weights made with diﬀerent equations (&amp; therefore diﬀerent weight curves) then I imagine I can do a better job of making multiple weights — particularly if there are lots <span class="amp">&amp;</span> lots of weights. <br><br>Quite apart from whether you want math in your font process — you could talk about which model of weights looks better to you; Porchez, DeGroot, someone else, or maybe your own weight system. And you could talk about why you think that. You could talk about how you decided to make the weights you made for Alfon.  <br><br>You could talk about really skinny or fat fonts <span class="amp">&amp;</span> why you don’t make them — or haven’t so far from what I can see on your web site. <br><br>This kind of info could be seen as a trade secret too I suppose… <br><br>Hrant, <br><br>Do you work in multiple weights much or are you concerned with middle/normal weight forms for the most part?  <br><br>All, sorry this entry is so long winded. When I post some examples <span class="amp">&amp;</span> test images with the formulas behind them I am sure they will clarify what I am after <span class="amp">&amp;</span> why better than my typing here has for the past two&nbsp;postings.</p>'
