  html: <p>Does anybody have any sources for the theory behind exponential or ( or interpolation curve) font weight scaling?  <br><br>Does anybody use mathematical formulas for determining a weights up or down? <br><br>Does anybody have anything good to say about linear font scaling?  <br><br>Do you think that theories can’t be trusted <span class="amp">&amp;</span> only the eye can tell?  <br><br>What am I talking about? Go to <a href="http://www.lucasfonts.com/" target="_blank">http://www.lucasfonts.com/</a> and follow the links to ‘font families’ <span class="amp">&amp;</span> ‘the sans’ <span class="amp">&amp;</span> then ‘info <span class="amp">&amp;</span> samples’ <span class="amp">&amp;</span> then ‘interpolation curve’. He even oﬀers some formulas for making weights.  <br><br>What do you think is the limits are of the genuinely useful weight range? I got thinking about this because I was reading (in <a href="http://www.daidala.com?" target="_blank">www.daidala.com?</a>) that&nbsp;Jean-Fran</p>
