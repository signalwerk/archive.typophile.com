    html: <p><span class="caps">JFP</span>’s post with Anisette sums up the reality of this <br>situation. The Black is usually very diﬀerent than <br>the thin. For instance, compare the shared stroke <br>weights on a black to that of a thin. It’s common to <br>slightly reduce the stroke weight on letters like e and a  <br>in the black but not in the thin. These irregularties will <br>in turn create less than perfect interpolations. This is  <br>where the labor comes in! I recomend coﬀee <br>in the mornings followed by green tea in the afternoons <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"><br><br>Recently I’ve been using <span class="caps">MM</span> to create my intermediate <br>weights. I’ve had much better results than just a Blend. <br>I’m not actually making <span class="caps">MM</span> fonts, just using <span class="caps">MM</span> to  <br>deﬁne the&nbsp;weights.</p>
