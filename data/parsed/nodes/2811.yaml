    html: <p>Eben, <br> <br>You asked the question, I gave an answer. And personally "There it is, I have a nice set of weight." Is the only issue. <br> <br>As far as the labor, I have done and continue to do the labor. Have you? Maybe what you are really seeking is a way out of all the labor.  <br> <br>If you build a proper font MM database you don't need an underlying theory, just you eyes, and a problem that needs solving. <br> <br>I have never trusted any theory that explains why something looks good. <br> <br>Not only am I sure Hrant has an idea about this. He no doubt has his own name for the process.</p>
