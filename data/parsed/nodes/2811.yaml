    html: "<p>What I have done so far to make sense of this issue is to take the sample I found on the De Groot page (See above with the arrows) &amp; measure the density of pixels that compose the arrow's horizontal lines. A black pixel is 100 units &amp; grey one might be worth between 1 &amp; 99 units. Two black pixels measure as '200'. <br> <br>When I had estimated relative widths I looked for a rule or equation that could describe &amp; predict the changes that I saw from the thinest to the thickest.  <br> <br>The rule that seemed to be used for weight increase was: take 1+1/3 of the weight of a charcter add it to get the target weight of the next charcter. In excel the formula is =Cx/3+Cx where C is the column &amp; x is the number of the starting weight.  <br> <br>In this way 21 is converted to 28 &amp; so on. Not all number convert cleanly like this. For instance 28 becomes 37.33333... <br> <br>Because points in FontLab or Fontographer do not come in fractionally numbered positions some rounding must be done and an ideal curve/formula would therefore: <br> <br>- Provide a pleasing optical 'one step' increase. <br> <br>- Provide numbers that either were either whole or were as close to a whole number as possible eg 1.1 (1)is better than 1.4 &amp; 1.9 (2) is better than 1.5. <br> <br>- Provide a whole pixel em unit number at 9 or 12 points or whatever screen size you might be targeting. For the font I am working on now ( monoline ) that would be 100 em units for a target of 9 pixels on screen. This last point is irrelevant if you are making a font with no focus on screen rendering such as a display face. <br> <br>The em units I calculated using my hypothetically 'De Groot style' curve &amp; 1 as a base with every 2nd number sampled starting with 1 are <br> <br>1,2,3,6,10,18,32,56,100,177,315 <br> <br>These are also the rounded or clean numbers. The unrounded mathematical result is: <br> <br>1 <br>1.333333333 <br>1.777777778 <br>2.37037037 <br>3.160493827 <br>4.21399177 <br>5.618655693 <br>7.491540924 <br>9.988721232 <br>13.31829498 <br>17.75772663 <br>23.67696885 <br>31.56929179 <br>42.09238906 <br>56.12318541 <br>74.83091388 <br>99.77455184 <br>133.0327358 <br>177.3769811 <br>236.5026414 <br>315.3368552 <br> <br>Probably none of these numbers match the Thesis fonts exactly either in terms of their actual ratios to each other. If I have sussed the formula he used that would be interesting especially since it yeilds mostly nice #s. I like the fact that it yields a 10 &amp; a 100 for instance. <br> <br>Here is what the rule/formula looks like as a curve charted in excel: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/24914.gif\" alt=\"\"> <br> <br>Here is the same formula rendered to screen using a cross &amp; circle as examples. I have4 used weights 1-177 for 10 weights:  <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/24915.gif\" alt=\"\"> <br> <br>My reaction to this curve is that it emphasizes the light &amp; dark too much in 10 steps. A flatter curve would be better. The steps do feel even though - that much is good. A smaller fraction than 1+1/3rd might give better results. It would be nice to sample every number too. It might be better to start with 2 or 3 or even 5 rather than 1. These are the ideas I will be testing next. <br> <br>It seems like a golden mean ratio could be tried too. I have to look into it. <br> <br>If I owned thesis I could measure it directly - but I don't. As you can see it wasn't really crucial to know what he did exactly to be able to start experimenting. I am not sure I like his formula so well that I would want to use it in any case. I mean I really like &amp; respect his stuff, but Porchez may have something in that crit.   <br> <br>Also I'd rather work out my own rationale. It more fun, it's valid intellectual property ( if I was keeping it to myself ) and maybe it's even a noble kind of labour or something like that. <br> <br>BTW : DeGroot actually provides three equations on his site but I have not been able to make anything out of it so far. If anbody else can explain them please let me know! <br> <br>I will do some additional experiments and post them if folks are interested - especially if I make something I like.  <br> <br>I could also post the my excel sheet somewhere if it could help anybody work out formulas/weight curves they like. <br> <br>Does my original question make better sense now? Am I just nuts?  <br> <br>Do you think a split curve would make better sense or give better results? eg: One curve for the bolds &amp; one for the ligher weights with a normal weight in the middle. If you think so, why? <br> <br>Thanks!</p>"
    html_clean: "<p>What I have done so far to make sense of this issue is to take the sample I found on the De Groot page (See above with the arrows) &amp; measure the density of pixels that compose the arrow's horizontal lines. A black pixel is 100 units &amp; grey one might be worth between 1 &amp; 99 units. Two black pixels measure as '200'. <br> <br>When I had estimated relative widths I looked for a rule or equation that could describe &amp; predict the changes that I saw from the thinest to the thickest.  <br> <br>The rule that seemed to be used for weight increase was: take 1+1/3 of the weight of a charcter add it to get the target weight of the next charcter. In excel the formula is =Cx/3+Cx where C is the column &amp; x is the number of the starting weight.  <br> <br>In this way 21 is converted to 28 &amp; so on. Not all number convert cleanly like this. For instance 28 becomes 37.33333... <br> <br>Because points in FontLab or Fontographer do not come in fractionally numbered positions some rounding must be done and an ideal curve/formula would therefore: <br> <br>- Provide a pleasing optical 'one step' increase. <br> <br>- Provide numbers that either were either whole or were as close to a whole number as possible eg 1.1 (1)is better than 1.4 &amp; 1.9 (2) is better than 1.5. <br> <br>- Provide a whole pixel em unit number at 9 or 12 points or whatever screen size you might be targeting. For the font I am working on now ( monoline ) that would be 100 em units for a target of 9 pixels on screen. This last point is irrelevant if you are making a font with no focus on screen rendering such as a display face. <br> <br>The em units I calculated using my hypothetically 'De Groot style' curve &amp; 1 as a base with every 2nd number sampled starting with 1 are <br> <br>1,2,3,6,10,18,32,56,100,177,315 <br> <br>These are also the rounded or clean numbers. The unrounded mathematical result is: <br> <br>1 <br>1.333333333 <br>1.777777778 <br>2.37037037 <br>3.160493827 <br>4.21399177 <br>5.618655693 <br>7.491540924 <br>9.988721232 <br>13.31829498 <br>17.75772663 <br>23.67696885 <br>31.56929179 <br>42.09238906 <br>56.12318541 <br>74.83091388 <br>99.77455184 <br>133.0327358 <br>177.3769811 <br>236.5026414 <br>315.3368552 <br> <br>Probably none of these numbers match the Thesis fonts exactly either in terms of their actual ratios to each other. If I have sussed the formula he used that would be interesting especially since it yeilds mostly nice #s. I like the fact that it yields a 10 &amp; a 100 for instance. <br> <br>Here is what the rule/formula looks like as a curve charted in excel: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/24914.gif\" alt=\"\"> <br> <br>Here is the same formula rendered to screen using a cross &amp; circle as examples. I have4 used weights 1-177 for 10 weights:  <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/24915.gif\" alt=\"\"> <br> <br>My reaction to this curve is that it emphasizes the light &amp; dark too much in 10 steps. A flatter curve would be better. The steps do feel even though - that much is good. A smaller fraction than 1+1/3rd might give better results. It would be nice to sample every number too. It might be better to start with 2 or 3 or even 5 rather than 1. These are the ideas I will be testing next. <br> <br>It seems like a golden mean ratio could be tried too. I have to look into it. <br> <br>If I owned thesis I could measure it directly - but I don't. As you can see it wasn't really crucial to know what he did exactly to be able to start experimenting. I am not sure I like his formula so well that I would want to use it in any case. I mean I really like &amp; respect his stuff, but Porchez may have something in that crit.   <br> <br>Also I'd rather work out my own rationale. It more fun, it's valid intellectual property ( if I was keeping it to myself ) and maybe it's even a noble kind of labour or something like that. <br> <br>BTW : DeGroot actually provides three equations on his site but I have not been able to make anything out of it so far. If anbody else can explain them please let me know! <br> <br>I will do some additional experiments and post them if folks are interested - especially if I make something I like.  <br> <br>I could also post the my excel sheet somewhere if it could help anybody work out formulas/weight curves they like. <br> <br>Does my original question make better sense now? Am I just nuts?  <br> <br>Do you think a split curve would make better sense or give better results? eg: One curve for the bolds &amp; one for the ligher weights with a normal weight in the middle. If you think so, why? <br> <br>Thanks!</p>"
