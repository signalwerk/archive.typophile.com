    html: <p><i>Is anybody making new font weights using python scripts for in Font Lab? </i> <br><br>I’ll sometimes do this to rough out a weight. Generally, I’ll start with a single weight, use Python to extrapolate bold and light versions, and then make these axis extremes for a Multiple Master font. The results are pretty messy, and not useable for ﬁnal fonts, but the <span class="caps">MM</span> font is useful for guaging basic stems and trying diﬀerent&nbsp;weights.</p>
