    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : Logotypes &amp; Letterforms</strong></p>
    <p>By <a href="/wiki/Doyald%20Young" class="freelinking" rel="nofollow">Doyald Young</a>, published by his own <a href="/wiki/Delphi%20Press" class="freelinking" rel="nofollow">Delphi Press</a>. This large, expensive, thick book is less a manual or a reference as a catalog of Young's own design work that happens to be very informative and educational. Young has been based in Los Angeles for his entire career, and has spent much of that time closely associated with the <a href="/wiki/Art%20Center%20College%20of%20Design" class="freelinking" rel="nofollow">Art Center College of Design</a> there. He studied under <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>, whose work has clearly influenced him profoundly, and due to his location has done much work designing <a href="/wiki/logotypes" class="freelinking" rel="nofollow">logotypes</a> and bespoke alphabets for clients in the entertainment, cosmetics, and hotel fields.</p>
    <p>Much of the book is a display and discussion of this work; in some cases he displays the set of design comps for a logotype, as well as a discussion of the thinking that went into them. He also -- somewhat unusually -- takes the next step of discussing which typefaces go well with many of the logotypes, demonstrating  how corporate and brand identities can be designed outward from one piece of work.</p>
    <p>Young loves scripts and cartouches, so there are many fine examples of elaborate scripts in the book. He also loves <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>, which pops up in many, many guises and references, along with <a href="/wiki/Morris%20Fuller%20Benton" class="freelinking" rel="nofollow">Morris Fuller Benton</a>'s <a href="/wiki/Franklin%20Gothic" class="freelinking" rel="nofollow">Franklin Gothic</a>. Since these typefaces are respectively half a century and a century old, Young can't fairly be accused of being subject to the whims of fashion (even though, much of the time, he's working for the fashion industry), but at the same time, it is often easy to guess the age of many of his designs. It seems contradictory that his designs can be both conservative and dated, and it is intriguing to attempt to figure out why this is.</p>
    <p>The last part of the book is a set of specimens of some (most?) of Young's own typefaces, and is in some ways the most interesting part of the book. Young has, like his mentor Zapf, been unafraid to stick himself right into the middle of technological developments. He's designed an uncial-style unicase script for teletype machines and a typeface for transcribing American Sign Language, as well as creating a simplified sans for use in daisy-wheel impact printers. He has also indulged his love for scripts with his one commercially available typeface, Young Baroque, a beautiful baroque script.</p>
