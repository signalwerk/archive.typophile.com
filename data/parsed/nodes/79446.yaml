    html: |-
      <p>Not all versions of Univers appear to have the 'Et' ampersand. I'm assuming the original version had it but then the digitised version seems to have replaced it? Now in Linotype Univers (1999), guess what, it's back! That might be a somewhat simplistic way of looking at the history of the Univers ampersand, so someone in the know might like to flesh it out a little.</p>
      <p>As a matter of fact, Camphor's ampersand does not have the ascender on the 't' part of the the Et (it's more of a small caps T). Not altogther sure what influenced me on the Camphor ampersand. If it was Univers, it was pretty subliminal. Fairly sure I just went for a horizontally flipped 3 as a starting point and went on from there.</p>
