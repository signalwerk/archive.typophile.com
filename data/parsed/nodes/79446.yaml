    html: |-
      <p>&gt;&gt;&gt;Is that two different small capitals features shown (smallcaps &amp; c2sc)</p>
      <p>There are four features that effect small caps:<br>
      - aalt changes lower and upper case to small caps<br>
      - smcp changes lower case only to small caps<br>
      - c2sc changes upper case only to small caps<br>
      - ss03 changes numerals to small cap numerals</p>
