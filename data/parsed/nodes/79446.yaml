  html: |-
    <p>I am delighted to announce the release of my first commercial font, <a href="http://www.monotypecamphor.com" target="_blank" rel="nofollow">Camphor™</a> now available in six weights with corresponding italics from <a href="http://www.fonts.com" target="_blank" rel="nofollow">Fonts.com</a>, <a href="http://linotype.com" target="_blank" rel="nofollow">Linotype.com</a> and <a href="http://www.itcfonts.com" target="_blank" rel="nofollow">ITCFonts.com</a>. (Camphor™ is also available to commercial subscribers of <a href="http://webfonts.fonts.com" target="_blank" rel="nofollow">Fonts.com Web Fonts</a>.)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Header_4314.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/as_6326.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Weights_5768.png"></div><p></p>
    <p>Camphor™ comes in OpenType Standard and Pro formats with broad support for Central and Eastern European langauages.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Characters_4713.png"></div><p></p>
    <p>OpenType features include:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Features_5241.png"></div><p></p>
    <p>A pdf can be viewed <a href="http://www.fonts.com/NR/rdonlyres/68EB3A62-2CA0-4A16-9012-1250C98F73BB/0/Camphorspecsheets.pdf" target="_blank" rel="nofollow">here</a>.</p>
    <p>The press release can be viewed <a href="http://typophile.com/node/79340" target="_blank" rel="nofollow">here</a>.</p>
