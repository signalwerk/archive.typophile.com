  - id: 453847
    user: 2021
    date: 2011-04-11T10:13:00
    date_raw: 11 Apr 2011 — 10:13am
    votes: null
    html: |-
      <p>My understanding (completely subjective, as I've not done any statistical analysis) is that the Anglo* ampersand is a single stroke "eight-ish" shape, whereas the Continental model involves at least one extra stroke, and is more discernibly "E + t".</p>
      <p>I name-checked Univers, recalling that there had been some objection to its Et form of ampersand in the Anglosphere, with the substitution of the more normal, for there, shape in later editions of the typeface. </p>
      <p>*Also preferred in the former colonies.</p>
