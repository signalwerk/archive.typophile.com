  html: |-
    <p>Lith is a hand-drawn headline typeface inspired by Alice In Wonderland and the Brothers Grimm fairy tales. “Flawed” comes with a lot of alternate letters, ligatures, beginnings.</p>
    <p>“Mad” contains icons with catch-words, card- &amp; chess symbols and other gimmicks.</p>
    <p>Available now at myfonts:<br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/typocalypse/lith" rel="nofollow">Lith Flawed &amp; Mad</a></p>
    <p>"Lith Mad" is available for free until the end of 2011 and until december 24, 2011 there is a 25% OFF "Lith Flawed" </p>
    <p><img src="http://stuff.chickenandgasoline.com/lith.jpg"></p>
    <p>(c) 2011 Typocalypse Types</p>
