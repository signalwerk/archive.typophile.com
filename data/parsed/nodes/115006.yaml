    Apologies for the low resolution of this image. focus on the upper portion of the logo, thank you.<p></p>
    <p>So here I am having a client for my final output for a course in my university and we agreed on the rebranding of the logo as being like this image up here.</p>
    <p>my problem now is what "C" can be best similar to this? (See the center of the top portion of the logo.)<br>
    - has a ball terminal<br>
    - more or less constant width throughout the stroke of the "C"</p>
    <p>I am trying to have the look that the "C" that will be used in this logo will be the one that will be used for the brand name as well (since it also starts with C; both words to be exact.)</p>
    <p>In addition, I'd need a second type that will accompany the primary type (for touchpoints and other deliverables)</p>
    <p>Any suggestions, opinions or comments about this? Much appreciated and thank you for your time! (in advance of course ^.^ )</p>
