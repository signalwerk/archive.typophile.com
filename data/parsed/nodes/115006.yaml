    html: <p>Clean style or not, I would simply design the C yourself. Reading your post I was already thinking "Why would you want a typeface for this?" and then I read osamu's post in which he makes a lot of valid points. I personally really wouldn't recommend typewriter typefaces for this brand though. I would design the C myself and possibly select a slab serif typeface to work with the logo for display use and/or body copy. Perhaps <a class="freelinking external" href="http://www.myfonts.com/fonts/hoftype/cassia/" rel="nofollow">Cassia</a> by Hoftype? It's not monoline, but I personally think your brand could use a "human touch". If you insist on monoline, then <a class="freelinking external" href="http://www.typography.com/fonts/archer/overview/" rel="nofollow">Archer</a> by Hoefler &amp; Frere-Jones should be a great choice.</p>
  - id: 573793
    user: 13487
    date: 2014-03-16T10:33:00
