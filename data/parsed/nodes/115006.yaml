    votes: null
    html: |-
      <p><a href="http://www.typography.com/fonts/archer/overview/" rel="nofollow">Archer</a>, <a href="http://ernestinefont.com" rel="nofollow">Ernestine</a> (disclaimer, the latter is mine). Both not free. But then, branding with free typefaces is usually a terrible idea – not just because many of them are not that great, but also because one of the points is to make your brand stand apart – which a typeface available to everyone at the touch of a button doesn’t exactly help.<br>
      In this regard, drawing it yourself is of course the best idea. But since you’ll want it to mesh with your type choice I’d recommend to decide on the type first and then build on that.</p>
