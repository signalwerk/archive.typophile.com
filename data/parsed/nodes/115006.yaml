    html: |-
      <p>A couple of points:</p>
      <p>1. If you're just looking or the C in the logo, then why use a font? This should be easy enough to draw, and the advantages are that you get exactly what you want (what both you and the client envision), you don't have to worry about licensing/usage restrictions, and it costs nothing except your time which you would have to invest anyway.</p>
      <p>2. The fonts being free or not should make no difference whether the business is an established, ongoing concern, or with regards to usage. Often the commercial fonts will have fewer restrictions than many free fonts and you can be certain of your and your client's rights. With a commercial font you'll usually get a high quality design which is more likely  to be unique - and a commercial font doesn't need to break the bank. Many excellent fonts to be had for under a tenner.</p>
      <p>That having been said. It is difficult to suggest a font without knowing anything of the client - the business, the target market, the usage of the logo and other branding material. All of this will inform your choice regarding the mood you wish to convey and the appropriateness of the font.</p>
      <p>For the C and brand name style you've mentioned - a good typewriter font such as ITC American Typewriter, or Esfera from Nick Curtis (only $12.95) will give you the monoline character with ball serif. There are many great examples of complete branding solutions using fonts such as this also, so you may not need to look for a second font. However, if this is a cupcake business (kind of looks like a cupcake in the logo), then American Typewriter is probably a bit overused in this area and you may wish to consider an alternate style to set your client's business apart from the competition.</p>
