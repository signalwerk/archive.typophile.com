    html: <p>You don't necessarily need 1 typeface. I usually think 2 typefaces is the better option. It's just that we've been focusing on your current problem, which is to identify a typeface which can work well for your logo or will work as a basis for your logo. If you want advise on a complimentary typeface I think we need to have a better idea of which direction you're headed. I think I would first finish the logo and then find a secondary typeface.</p>
