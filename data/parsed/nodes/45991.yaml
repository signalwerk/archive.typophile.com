      <p>Monopoly actually uses Kabal, which we're using for the "Collect $200 as you pass" part, but we need something for the section headings that looks like GO. I ended up making my own font in Fontstruct. Some of the letters look a bit wonky (R in particular), but I'll fix the outlines in Illustrator when I make the images.</p>
      <p>Thanks for all of your help, everyone!</p>
