  html: |-
    <p>Does anyone know a typeface that has a complete alphabet that looks similar to the GO in Monopoly?<br><img src="/sites/default/files/old-images/go_6249.gif"></p>
    <p>I know there's a stigma attached to free fonts on this site, but I really can't justify spending any money on this — if I can't find a free typeface, I'll find an alternate solution. I'm making a book for a Monopoly-themed event, and the splash page for each section is going to say "Collect $200 as you pass [section]," with the [section] looking like the GO from Monopoly. I've looked through the square fonts section on — dare I say it — DaFont, but everything is either way off or not quite right.</p>
    <p>Thanks in advance.</p>
