    html: "<p>\"So is there anything special I have to do to make them work in OSX?\" <br> <br>Non-Unicode Mac OS X applications use the cmap(1,0) encoding stored in the font. It can be controlled in FontLab Preferences / TrueType / Use following codepage to build cmap(1,0) table. By default, it's set to Mac OS Roman which is fine for most fonts so you don't need to change anything. Also, make sure that your font's metrics and naming are compatible with the recommendations:  <br> <br><a href=\"http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=4356\" target=\"_blank\">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=4356</a> <br><a href=\"http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843\" target=\"_blank\">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843</a> <br><a href=\"http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065\" target=\"_blank\">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065</a> <br> <br>Regards,  <br>Adam</p>"
