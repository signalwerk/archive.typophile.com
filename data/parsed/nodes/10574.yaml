    votes: null
    html: <p>It is true that Mac OS X supports Windows TrueType fonts (.ttf).  <br> <br>Resource-fork Mac TrueType fonts from Mac OS 7 and later, and Windows TrueType fonts, had always been related. The same structure that is in the .ttf font was placed in the "sfnt" resource of the Mac TrueType font, along with some other pieces of data.  <br> <br>Mac OS X introduced data-fork Mac TrueType fonts (.dfont) which was a repackaged form of resource-fork Mac TrueType fonts known from Mac OS 7 and later. Indeed, both sorts of Mac TrueType fonts include the same pieces of data that are included in Windows TrueType fonts (.ttf).  <br> <br>However, Mac OS X data-fork Mac TrueType fonts (.dfont) are closer related to Mac OS Classic resource-fork Mac TrueType fonts than to Windows TrueType fonts (.ttf).  <br> <br>Regards,  <br>Adam</p>
    html_clean: <p>It is true that Mac OS X supports Windows TrueType fonts (.ttf).  <br> <br>Resource-fork Mac TrueType fonts from Mac OS 7 and later, and Windows TrueType fonts, had always been related. The same structure that is in the .ttf font was placed in the "sfnt" resource of the Mac TrueType font, along with some other pieces of data.  <br> <br>Mac OS X introduced data-fork Mac TrueType fonts (.dfont) which was a repackaged form of resource-fork Mac TrueType fonts known from Mac OS 7 and later. Indeed, both sorts of Mac TrueType fonts include the same pieces of data that are included in Windows TrueType fonts (.ttf).  <br> <br>However, Mac OS X data-fork Mac TrueType fonts (.dfont) are closer related to Mac OS Classic resource-fork Mac TrueType fonts than to Windows TrueType fonts (.ttf).  <br> <br>Regards,  <br>Adam</p>
