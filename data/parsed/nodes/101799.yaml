      <p>Just generally: </p>
      <p>There must be a setting with InDesign that controls whether or not it will substitute fonts. With our jobs, and with CS2, 3, 4, and 6, if a font does not have a particular character, it shows in salmon on the screen, and generates an error in the preflight panel. I believe preflight in CS6 will generate a printable report of "missing characters" -- we use to have to run a home-grown script.</p>
      <p>There are a huge number of bugs in InDesign, and it just gets worse.  CS6 reminds me of the reports about PageMaker 6. Having said that, with Windows, a few of the font handling bugs are bypassed by having the fonts one uses in a document located in in the applications font directory -- </p>
      <p>Program Files &gt; Adobe &gt; Adobe InDesignCS6 &gt; fonts.</p>
