      <p>@ahyangyi<br>
      I am well aware that Word text formatting allows an "Asian text font" to be included as part of a style definition for Latin text, as well as in searching.  In my work, whatever benefit that might have is undone by Word's "helpfully" but silently swapping in another font when the desired font lacks the intended character, regardless of language/script.  For me, the classic cases are macron vowels for romanizing Japanese, or <em>pinyin</em> tones not included among "European" accented vowels; or in CJK fonts, swapping in a font to access the 40,000 chars. added with CJK Ext. B.  InDesign, in contrast, highlights those situations with the "dreaded pink boxes," and its Find Font feature makes it easy to track down and address every instance.</p>
      <p>I've also wondered whether MS Word's dual-language assignment might be what causes ID to screw up the language attributes when importing MS Word files: applying "Chinese" to alphabetic text of course has the effect of disabling hyphenation.  But ID's problems importing Word formatting are well known, and I generally don't get to ask authors and editors how they handle files.</p>
      <p>David</p>
