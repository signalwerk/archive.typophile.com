      <p>Maybe I'm wrong, but I always thought the "composite fonts" users can make on the fly in CJK versions of InDesign were a different animal from the pre-Unicode CJK fonts sold by various foundries in the 1990s.  The alphanumerics in those early CJK fonts tended to be pedestrian, so this method of swapping in a western foundry font was a real convenience.  I always assumed such ID-made composite fonts could not be used outside of ID.<br>
      I note that in his wonderful 2007 book, <cite>Fonts &amp; Encodings</cite>, Yannis Haralambous writes (p. 684): </p>
      <blockquote><p>The “composite” fonts were then given a new name: OCF (for “original composite fonts”), where “original” was a synonym for “obsolete”. To this day, Adobe has never stopped denigrating OCF and singing the praises of CID.</p></blockquote>
      <p>David</p>
