      <p>There must surely be a way.  I found this text in an old IBM document describing how OS/2 implements this feature, so clearly Windows has a similar one (or had at the time this was written).</p>
      <blockquote><p>
      Windows 95 has a font association function. OS/2 is required to have a equivalent function to the Windows 95 font association.</p>
      <p>If a user creates a document using the 'Times New Roman' font (that usually does not include DBCS), with font association the user can actually display and print DBCS on Windows 95 with the document. However, the user will neither be able to display nor print DBCS for the document if the user bring it from Windows 95 to OS/2. If we have an equivalent function to the Windows 95 font association in OS/2, the user will be able to show DBCS with the document.</p>
      <p>Users would like to display or print DBCS documents even if a SBCS font is selected.</p>
      <p>— <em>Combined Font / Pre Combine Rule / FontAssocation</em> (internal IBM document).  10 December 1997
      </p></blockquote>
      <p>(DBCS == double byte character set, i.e. characters not normally encoded in a 256-byte codepage; in this context it's essentially synonymous with "Asian/CJK text")</p>
      <p>Anyway, you might try searching for "font association".</p>
