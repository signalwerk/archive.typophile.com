      <p>I realize the request is for a fall-back at the operating-system level, but I wonder whether MS Word would honor it: I've tried repeatedly to disable MS Word's penchant for silently swapping fonts when it encounters a missing character, and would be glad to learn how.  I work mostly in InDesign, mostly in English but with bits of other languages, which I distinguish with character styles, in part to apply the correct hyphenation (via the language attribute).  Western languages I generally eye-ball, but I can isolate CJK strings with a GREP search: [\x{2E80}-\x{9FBB}]+  This doesn't get everything, but I usually want to know about the chars. it misses; and I still must distinguish C, J, and K myself.</p>
      <p>	CJK versions of InDesign offer a fancier way to control font usage, "composite fonts" (an unfortunate re-defininition of an existing term).  In-Tools' <a href="http://in-tools.com/products/plugins/world-tools-pro/" rel="nofollow">World Tools Pro</a> brings this feature to western-language versions OF IDCS5 and later: according to the manual, "Composite fonts allow you to select which fonts should be used for specific Unicode ranges to correctly display characters in many different languages while using only a single font."  (Note that standard Western-language installations of ID don't offer CJK language attributes, but they are carried along when one imports formatted text that includes the attribute.)</p>
