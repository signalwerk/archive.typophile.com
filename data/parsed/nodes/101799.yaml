      <p>Yes, of course. And if it is a multi-office, or multi-national corporation, the Adobe license requirements need to be checked as well. I would imagine site licenses would be needed, and with them, the charges for modification could well be negligible.</p>
      <p>The point in passing is simply a corporation's performance better not be linked to something like a typeface, and they will know this. For branding, hire someone who hand letters. For work involving fonts, if you're large enough, either get a site license, or if you want to avoid such issues, hire graphic designers who will use fonts that don't lead you down such paths. Part of what you pay them for. And we're beginning to see this in University Press publishing, admittedly a market where no font publisher expects to find riches.</p>
      <p>The whole notion is just "needed" as a bullet proof way around a technical problem. Technical situations/solutions are ever more encountered. Sometimes they're a way around a modification clause, sometimes modification solves a general non-geekiness of users, like me.</p>
      <p>* * *</p>
      <p>BTW, I even got the OK to modify the initial portion of two FF font families, Scala &amp; Quadraat. It was the very early days -- early-mid 1990s? -- and there was only one FontShop outlet in the States, in San Francisco. Time was of the essence -- a journal was involved -- &amp; everything was new, so they said, basically, "Oh, just do what you need." Never happen today.</p>
