  html: '<p>My client has a corporate font (Unit Pro). The company produces many multilingual documents in languages using Latin script as well as in Chinese. Is there a way to tell Windows something like: <em>if Unit Pro is selected and some characters are missing, use "Custom Chinese Font" instead</em>? In other words, is there a way how to define custom fallback font for Chinese glyphs under Windows? Any help appreciated.</p>'
  html_clean: '<p>My client has a corporate font (Unit Pro). The company produces many multilingual documents in languages using Latin script as well as in Chinese. Is there a way to tell Windows something like: <em>if Unit Pro is selected and some characters are missing, use "Custom Chinese Font" instead</em>? In other words, is there a way how to define custom fallback font for Chinese glyphs under Windows? Any help appreciated.</p>'
