      <p>For Japanese display fonts, I’d suggest starting at Maniackers Design, <a href="http://mks.jp.org/" title="http://mks.jp.org/">http://mks.jp.org/</a> , and after you have a good look at their selection of fonts, poke around in their lengthy and (unfortunately) quite aged links page.</p>
      <p>You’ll find a lot of Hiragana and Katakana display fonts around, many having matching Latin alphabets, but very few Kanji fonts, and you’ll find that many of the Kana fonts are mapped to standard U.S. keyboard keyspaces rather than properly encoded for Japanese keying systems, but for the short passages of text one would use a display font for, that is usually sufficient.</p>
