    <p>Hi everyone,</p>
    <p>I’ve always been fond of anything Japanese &amp; I’m now studying the Hiragana &amp; Katana characters. Mind you, I’m not actually studying Japanese, I’m merely looking at the forms &amp; trying to figure out in what length they can be stylized.<br>
    I’ve been googling myself silly to find Japanese display fonts, but I’m not really getting the results I’m looking for.<br>
    Things I’m looking for include mostly digital (pixel based) display fonts used for cell phones and such (see attached image), but also any kind of Japanese letterlogo. I think by looking at pixel based Hiragana &amp; Katana characters, I’ll get a better insight into how much of it is “expandable” &amp; what the real characteristics of each character are. Logo’s would obviously also be helpful at this point.<br>
    Any links would be much appreciated.</p>
