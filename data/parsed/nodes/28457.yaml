    html: |-
      <p>Chris wrote:<br>
      <cite>One of the things I dislike is the difference in stroke width (modulation?) in the bold weight versus the regular weight. The regular weight has very little. And the bold weight seems to have too much. It almost doesn’t look like the same typeface to me.</cite></p>
      <p>That's one of the things I love about it. The serif approach to a bold cut. Almost a humanist sans, but still containing a very geometric base.</p>
      <p>Nick wrote:<br>
      <cite>Peter, I note that the dieresis dots have the same weight and height as the i dot.<br>
      Is this some kind of Malmö cooperative movement thing :-) ? </cite></p>
      <p><cite>Peter, I hope when the site is updated you’ll be releasing “South” that is one nice looking typeface.</cite></p>
      <p>Not the next release, which I hope to be within the next weeks, but i hope to have it fixed and ready befor ethe end of this year. Running a foundry on your own promoting other designers typefaces as well unfortunately leaves less and less time for your own designs.</p>
      <p>You're correct – it is the the same. I propably wouldn't have done it that way (I'm too boring), but I try not to interfere too much with the designers ideas and designs. One thing I like about Martin and his approach to type is that is so unbiased – he draws as he see's it, without  any presumtions of how type "should be done" but still with a lot of love. I think that is what makes them (his typefaces) stand out. It's the same feeling I get from looking at a typeface from the Nebiolo foundry. It's different but somehow it fits.</p>
      <p>tsongtze wrote:<br>
      <cite>Hey Peter, if I buy the font next week, will I get a chance to get the upgraded version and the OT?</cite><br>
      Yes..well almost! Everyone who's bought their licenses from Fountain the last 2 years will be able to upgrade for a very small price.  Hopefully most fonts will be OT within a few months, but I really can't say when. </p>
      <p>Here's a design were I used  Malmö Sans:<br>
      <a href="" rel="nofollow">http://www.bruhnfamily.com/portfolio/ma_folder_ap.asp</a></p>
