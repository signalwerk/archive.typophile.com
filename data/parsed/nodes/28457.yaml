  - id: 159793
    user: 1115
    date: null
    date_raw: null
    votes: null
    html: "<p>One of the things I dislike is the difference in stroke width (modulation?) in the bold weight versus the regular weight. The regular weight has very little. And the bold weight seems to have too much. It almost doesn't look like the same typeface to me. I love the headline weight, and the unicase characters. I love the character of the typeface though. It has a very friendly feel, while still being very constructed. PS: Peter, I hope when the site is updated you'll be releasing \"South\" that is one nice looking typeface.</p>"
    html_clean: "<p>One of the things I dislike is the difference in stroke width (modulation?) in the bold weight versus the regular weight. The regular weight has very little. And the bold weight seems to have too much. It almost doesn't look like the same typeface to me. I love the headline weight, and the unicase characters. I love the character of the typeface though. It has a very friendly feel, while still being very constructed. PS: Peter, I hope when the site is updated you'll be releasing \"South\" that is one nice looking typeface.</p>"
