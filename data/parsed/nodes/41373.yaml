    <p>I thought I'd pass this on. I ordered a portfolio with accessories today from <a href="http://www.officepdx.com/index.php" title="http://www.officepdx.com/index.php">http://www.officepdx.com/index.php</a>. I ordered the portfolio cover wrong; it was a little confusing. They not only checked my order for accuracy, which I thought was fantastic, they also called me to tell me about the problem. They had already corrected it and were shipping the order. </p>
    <p>I think this is fantastic customer service.</p>
    <p>Sharon</p>
