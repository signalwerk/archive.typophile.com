  html: |-
    <p>Greater Albion Typefounders has just launched 'Corton' a pair of display Roman small capitals faces.  </p>
    <p>Corton was inspired by the traditional lettering on a gravestone in an English village.  While that might sound a rather solemn beginning, Corton has wonderfully lively air, with distinctive lively serifs and beautifully swashed downstrokes.  Two faces are offered-regular and titular.  Between them they are ideal signage and display faces, merging 'olde-worlde' charm and fun character.</p>
    <p>Corton is currently available through <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/corton/ " rel="nofollow"> Myfonts</a>, and is offered at a 35% introductory discount.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Corton_Gallery4_5536.png"></div><p></p>
