  html: |-
    <p>Dear typophiles,<br>
    I’d like to present here the revised and improved version of Novecento, an uppercase-only font family inspired on european typographic tendencies between the second half of 19th century and first half of the 20th.<br>
    Initially offered for free as Novecento Wide, my family has now a condensed, a narrow and a regular versions. In addition, extra light and extra bold weights were added.<br>
    I’ve also added more OT features (12 now) and extra glyphs.<br>
    Please discover Novecento font family at <a class="freelinking external" href="http://typography.synthview.com" rel="nofollow">http://typography.synthview.com</a><br>
    <img src="http://typophile.com/files/novecento_0.png" alt="Novecento family overview"></p>
