    html: <p>Bringhurst says that you can remap your keyboard to allow access to any accents available in unicode fonts, but I have yet to discover how this is possible. It seems strange to me that in TeX (which is over 20 years old) all accents are readily accessible, but in modern software you have to go to a glyph palette to do this. For example, for e+macron in TeX you just type \={e} which is so much easier than locating a glyph from a palette or character map; but then, font installation and graphics in TeX are not exactly intuitive...</p>
