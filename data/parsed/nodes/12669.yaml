    html: <p>If you're using Quark, a simple -- if somewhat inelegant solution -- is to type the e followed by an _underscore. Select the underscore, then shift the baseline up the equivalent of 83% (five-sixths) of the point size you are using (more or less, depending on the typeface), and use negative tracking to place the underscore over the e. Crude, but effective.</p>
