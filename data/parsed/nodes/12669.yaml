    <p>I never learned how to type certain accents over letters. I have a client that needs the macron (I just found out its name) accent ' ¯ ' over the letter ' e ' but most fonts have premade é characters only as the closest (and incorrect) equivalent. I know that the accent is included, but aside from typing the ' &lt; ' key while holding down the Shift and Option keys on a Mac to get the accent by itself, I don't know how to get this accent over the vowel. </p>
    <p>Can someone tell me how to do this?  I learned page layout programs by myself in the 90s as I finished graphic design back when we still did paste-up, so I'm feeling rather unsophisticated about how to use accent features. But I figure I'd rather ask for help than go dumb - it's an accent I need for a particular client whose name is always mispronounced. </p>
    <p>Additionally, since many fonts have pre-made letters with accents, is this something that would be better off with a specific letter e with the macron already pre-placed?  It will always be used with this client, and I'm not sure if larger display layouts would represent the best application of the accent.</p>
    <p>Any help would be greatly appreciated.</p>
