      <p>In a way, I'm kinda glad that no one really knows the perfect way to type this accent in properly - it makes me feel less inept! I was under the impression that it was something I was just unaware of, especially in a typographic forum like this one, where I imagine people who create fonts would know all the keystrokes to type them.</p>
      <p>tphinney, I'm anxiously looking forward to trying out InDesign.  After waiting for my printers to begin supporting it, and after much positive feedback about it, my loyalties to Quark are wavering. I've avoided upgrading to OSX until now specifically because Quark Xpress was still buggy on all my fellow Art Directors computers, despite Quark's upgrades to supposedly make them OSX native (although I hear 6.5 is better). After using Quark Xpress for over 12 years, I'm so used to it that I didn't want to relearn a new program, but methinks now is the time.  Hell, if I didn't go with the flow, I'd probably still be using Syquest disks when sending things to the printers!  ;) </p>
