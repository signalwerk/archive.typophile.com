    html: |-
      <p>As I understand it, the new way is to form your own foundry, launch a website, but refer all customers to MyFonts, which will pay you 65% of each sale but give you visibility you could not possibly achieve on your own. Yes, you could sell directly from your website (see joshuadarden.com, a perfect example) but marketing and visibility count for as much as typeface merit.</p>
      <p>Make full use of OpenType's advantages; be sure text faces have oldstyle figures for each font; be sure text families are released with at least two weights and matching italics, never leaving out bold italic; and be sure to keystroke-link all fonts the way the big foundries do.</p>
    html_clean: |-
