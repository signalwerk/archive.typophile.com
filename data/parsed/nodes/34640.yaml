      <p>chopshop -- <cite>forgive my ignorance, what is URW++?</cite></p>
      <p>The former URW invented digital type as we know it today, i.e. describing letterforms as outlines rather than pixels.* Like the name of Gutenberg, this is a must-know for everyone doing digital type.&nbsp;&nbsp;:))</p>
      <p>* Roger D Hersch &amp; al: <cite>Electronic Publishing, Artistic Imaging, and Digital Typography</cite>. Springer 1998, isbn 3-540-64298-6, pp 265-280.</p>
