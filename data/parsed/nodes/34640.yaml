    <p>Which is the best way to sell our typeface?<br>
    • Sign a contract with a distributor on its personal behalf or by the way of its own registred company, if there is one?<br>
    • If the company is chosen, are the royalties are transferable with his personal name if one dissolves or if the company is sold?</p>
