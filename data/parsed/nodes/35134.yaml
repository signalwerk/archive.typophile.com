      <p><a class="freelinking-external" href="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509">Designing Type by Karen Cheng</a> and <a class="freelinking-external" href="http://www.amazon.com/Logo-Font-Lettering-Bible-Comprehensive/dp/1581804369">Logo, Font &amp; Lettering Bible by Leslie Cabarga</a> are good books about (designing) type.<br>
      There is also the <a class="freelinking-external" href="http://briem.ismennt.is/">Type, handwriting, and lettering</a> website of Gunnlaugur SE Briem, which is also quite good. And of course Underware’s <a class="freelinking-external" href="http://www.typeworkshop.com/index.php?id1=type-basics">Type Basics</a> on their <a class="freelinking-external" href="http://www.typeworkshop.com/">Typeworkshop website</a>.</p>
