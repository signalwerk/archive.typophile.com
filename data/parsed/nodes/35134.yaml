    html: <p>It’s not what you’re looking for, but if you’re digitizing calligraphy, there’s nice article on <a class="freelinking-external" href="http://www.typeculture.com/academic_resource/articles_essays/">TypeCulture</a> treating about “Problems Relating to the Translation of a Drawn Letterform to a Digital Typeface” written by Eduardo Berliner. <cite>A dissertation that looks at the difficulties of translating by means of a tool or machine the human qualities of the hand-drawn letterform.</cite> It could be a nice prelude to all this strictly technical stuff.</p>
