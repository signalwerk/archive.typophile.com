      <p>If you want really quick-and-dirty, <a href="http://www.myfirstfont.com" title="www.myfirstfont.com">www.myfirstfont.com</a> will help you create a font quickly and easily using Font Creator Program (a shareware font program that I use as one of my tools—I’m very much an amateur). Caveat, though, in that to make your font any good you need to spend a lot of extra time working on it.</p>
      <p>The books the others are recommending are definitely better, though, if you’re serious about font-making.</p>
