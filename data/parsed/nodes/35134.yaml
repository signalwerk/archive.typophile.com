    <p>I’m interested in attempting to make my own, based upon a few handwritten samples of very, very amateur calligraphy.  Are there any tutorials out there that describe how to quickly design a font within any of the more popular font-creation tools?</p>
    <p>These tutorials should be more detailed for newbies, as I have almost nothing in the way of schooling in graphic design (one year in high school, and most of that dealing with presses, cameras, and darkrooms, and I’m an expert, right?).  Should cover hinting and best methods of copying paths so that letters are uniform in size and shape.</p>
    <p>With luck, they should also provide suggestions on how to scale widths, to produce Bold and Narrow versions.</p>
