  html: <p>need a font like the one I have drawn in the attachment.  It is think, symetric, and has rounded angles.  Notice the 'w' is round on the bottoms instead of having sharp angles.   I also gave two examples of how the 'b' should look.  Note; these are hand drawings, I am not looking for a font that emulates handwriting.  Please help and thanks for your time.   <br>  <img src="http://www.typophile.com/forums/messages/83/69016.jpg" alt="Hand drawn font"></p>
