      <p>It's got a nice energy to it; I'd definitely try and take it to the next level. If people are going to download your font and use it, you might as well get the benefit of pointing at signs later, saying "That's my font!" and not being at all embarrassed by it.</p>
      <p>I'd suggest making the uppercase and lowercase forms distinct, even though they are the same height; it's always nice to have variety! (You could even use OpenType to create an alternating case thaT worked liKE tHIs.)</p>
