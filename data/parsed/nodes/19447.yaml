  html: |-
    <p>This is an "old" font for me, that I'd never had critiqued in the past.  I was originally putzing around with Illustrator, and came up with what I thought to be intriguing letterforms.  I didn't develop anything beyond this semi-unicase set of glyphs and then just dumped it into Fontographer to give away as a free font on my site.  I was surprised to see that it turned into one of my most-downloaded fonts, so I've decided to develop it into a complete font.  </p>
    <p>Opinions?</p>
    <p>(Note, the file wouldn't attacg, so the PDF is available here:  <a href="http://www.fontosaurus.com/dev/negotiated_i1.pdf" target="_blank" rel="nofollow">http://www.fontosaurus.com/dev/negotiated_i1.pdf</a>)</p>
