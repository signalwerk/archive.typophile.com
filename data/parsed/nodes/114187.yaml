      <div class="comment-spam-body"><p>Did you try using the <a class="freelinking external" href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a>? When I use it this is definitely Times, and I think the Compugraphic (CG) version that came from Agfa (now Fonts.com) looks like the right one. I think the serifs on your I and A were slightly misprinted, and not actually like the way they appear.</p>
      <p>- Mike Yanega</p>
      </div>
