    <p>I have been trying to find this font, but couldn't find it. </p>
    <p>To me it looks like a "Times" variant, but then I noticed the serifs of the capital italicized letters 'I' and 'A'  (see detail)</p>
    <p>Closest I came to it was 'Times BQ'  or in my library it is also listed under "Times New Roman* MONOTYPE Regular" ... </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2_4565.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/1-3_5938.gif"></div><p></p>
    <p>any help appreciated, the scan is from jd salinger's nine stories (1991 edition) </p>
    <p>(already tried identifont, whatthefont)</p>
