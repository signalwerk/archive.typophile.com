      <p><strong>canderson</strong>: It's a server thing. The plug-in that converts our webpages to PDFs only uses TrueType. Also, this has been a problem with FileMaker server printing layouts in the past, though not sure if it's a problem still with FM 11 or not. We've simply had ongoing problems with non-graphic design applications. Apparently, most computer engineers aren't aware of the move to OpenType.</p>
      <p><strong>JanekZ</strong>: Thanks for the tip. I also found TransType, but FontForge seems to be OpenSource.</p>
      <p>* And we've always used PS fonts in the past, so our TT library is pretty much what was installed with OS and software and no more. I haven't been able to find a TT version of <em>any</em> Garamond in our archive fonts.</p>
