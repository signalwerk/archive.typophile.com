    html: |-
      <p>Ahyangyi:</p>
      <p>The thing is, there are two <em>internal</em> types of OTF fonts. One uses Adobe's PostScript curves, the other uses Windows Truetype format. All TTFs are (or should be) Truetype, while an OTF can be either one of them.</p>
      <p>It sounds like Margaux' server can only use Truetype format fonts, independent of the actual font filename extension.</p>
      <p>(I admit, since this is purely conjecture from my side, there is no harm in <em>trying</em> ...)</p>
    html_clean: |-
