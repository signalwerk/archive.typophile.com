  html: |-
    <p>I've started to play around with <a class="freelinking external" href="http://www.princexml.com/" rel="nofollow">PrinceXML</a> to generate some fliers. The main text font is "Palatino Linotype" but since the text contains some diacritics it seems that PrinceXML automagically falls back to "Palatino". Both are installed on my system.</p>
    <p>Palatino Linotype:<br>
    <code><br>
    	PostScript name: PalatinoLinotype-Roman<br>
    	Full name: Palatino Linotype<br>
    	Family: Palatino Linotype<br>
    	Style: Regular<br>
    	Version: Version 5.00<br>
    	Unique name: Palatino Linotype Regular April 1998<br>
    	Manufacturer: LINOTYPE-HELL AG<br>
    	Trademark: Palatino® is a registered trademark of Heidelberger Druckmaschinen AG and its subsidiaries.<br>
    </code></p>
    <p>Palatino:<br>
    <code><br>
    	PostScript name: Palatino-Roman<br>
    	Full name: Palatino<br>
    	Family: Palatino<br>
    	Style: Regular<br>
    	Version: 3.8<br>
    	Unique name: Palatino; 3.8; 2006-02-23<br>
    	Copyright: Copyright © 1991-99, 2006 Apple Computer, Inc. Copyright © 1991-92 Type Solutions, Inc. All rights reserved.<br>
    	Trademark: Palatino is a registered trademark of Linotype AG<br>
    </code></p>
    <p>So I have two implementations of the same typeface design from two different sources. But both are used in the same document. Does this matter? How much a difference is there between these two? </p>
    <p>And more general, is there a tool that helps me compare two types? How do I know which one is more faithful to the original, if that is at all possible? (It seems to me that digital types in some instances are more of an interpretation of older casts than faithful reproductions.)</p>
    <p>Thanks!</p>
