    votes: null
    html: |-
      <p>Unicode 1E41 is a (precomposed) lowercase m with a dotaccent above. U+1E47 is a (precomposed) lowercase n with a dot accent below. Neither is in this Palatino font in precomposed form -- nor, likely, any Palatino you can find. You're in romanized Indic script country.</p>
      <p>However, you're in partial luck. The Palatino I'm referring to does have U+0323 (dotbelowcomb) as a combining accent, and it seems to have mark positioning. The font does <strong>not</strong> have U+0307, the combining dot accent. It does have U+02D9, the spacing modifier dot accent. Of course, there is no mark positioning with spacing modifiers, it isn't their purpose. Still, if the occurrence is infrequent, you could kern it back &amp; rekern to properly space the following letter. The Unicode in the file will be a trifle compromised. Or, you could use a proper combining dot accent (U+0307) from, say, Charis or Gentium -- funny thing about those periods, they look a lot alike. Just get the size &amp; spacing close in the application program.</p>
      <p>The license for the font I'm talking about forbids modification, even for personal use. </p>
      <blockquote><p>Modification<br>
      You are not allowed to edit or modify this font, even for your own use. Please contact Linotype Library GmbH if you require a customized version of this font.</p></blockquote>
      <p>Again, any dot accent from any Palatino would look the same, if you can find one with the combining accents to preserve syntactic meaning. Sadly, most fonts don't have any. </p>
      <p>On the other hand, an Adobe font does allow modification, if purchased before 2011, even if for one of the Monotype conglomerate companies' fonts (of which Linotype is now one). Otherwise, no time constraint.</p>
      <p>Tell your program to default to *that* Palatino font for the one character. </p>
      <p>Ain't EULAs fun? Isn't the new Monotype great? If you see one of Monotype exec's crossing the street, remember what the accelerator and brake pedals are for. Careful, don't get confused...</p>
