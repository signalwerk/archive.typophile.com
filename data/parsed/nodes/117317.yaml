      <p>Lots of the smaller foundries allow modification. Christóbal Henestrosa is another (though you're suppose to tell him), some of the fonts marketed by Village, etc.</p>
      <p>Sometimes it is automatic (in the EULA), sometimes you have to ask. The ones that turn you down are more often, but not always, involved in the advertising side of type use.</p>
      <p>I've researched this some, though I have not gathered hard data. What fits the questions posed &amp; answers I've gotten is the "no modifications" clauses began as an effort to limit/stop piracy. The small foundry (publisher) tells the lawyer what they are trying to stop, he/she words it a certain way. When that is all the publisher is after, they will usually allow modification, as long as it is well done and does not affect their product negatively.</p>
      <p>However, some publishers look at modifications as an extra revenue opportunity. This would include FontFont and the Monotype conglomeration. Even so, they are quite different companies. FontFont at least, is quite generous with both their backup and embedding policies. The new Monotype is not; I find them similar to some of the more aggressive pharmaceutical companies. You know the line about drug prices -- due to "research costs" -- esp. researching what gets you higher sales with your print &amp; TV advertisements...</p>
      <p>There is a funny story about FontFont, maybe even true. They had screwed up the encoding on a font, and a somewhat miffed customer finally agreed to pay to have it straightened out. Only at that point did FontFont asked "well, what's wrong?" That's asking a bit much of your customer, what? (Believe this was posted on Typophile many years ago.) But "modifications" aside, their EULA is still one of the better ones for many type users.</p>
