      <blockquote><p>
      Unfortunately, the font files extracted from the PDF seem somewhat incomplete wrt diacritics and other glyphs.
      </p></blockquote>
      <p>Those fonts date back from a period where the number of glyphs per font was rather limited. I have a FontLab demo version and here is a trace of execution in the folder <code>'/library/Application Support/FontLab/Encoding/T1 Roman-Western'</code> of my Macintosh (where one character per line is listed and commented lines start with a %):</p>
      <pre>% for i in *.enc
      &gt; do echo -n $i ; grep -v '^%' $i | wc -l
      &gt; done
      adobe_default.enc     230
      adobe_std.enc     149
      iso_latin1.enc     197
      mac_roman.enc     256
      win_1252.enc     224
      %
      </pre><p>Even if the maximum number of characters in Type 1 fonts was 256 (including .notdef), as you can see many encodings were far from providing so many characters. I count 202 glyphs in  PalatinoBQ-Roman.pfa, you add the "text figures" and smallcaps that are in the Expert font and you get a non negligible number of glyphs for that period in time. Those fonts are from 1992. The first Truetype fonts were  released  in May 1991 on Mac OS 7.</p>
