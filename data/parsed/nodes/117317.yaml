    html: |-
      <p>Nick is right with asking: "So to which shape should the redesigner/digitizer be faithful?"</p>
      <p>Palatino was originally a hot metal typeface.  When it was adopted for photo typesetting, the typeface was considerably modified.  While hot metal Palatino comes in distinct, specially designed versions for each size, photo Palatino comes only in one design, which is used for all sizes.  Additionally, some of Palatino's personality was ironed out; it seems Linotype wanted the new phototype Palatino to be more neutral and less lively.</p>
      <p>The digital versions of Palatino available today from Linotype and Adobe are based on the phototype variant.  Berthold has prepared a digital version based on the old hot metal typeface, but it is no longer available, as Berthold ceased to exist.</p>
      <p>Here you can see a comparison of the digital Palatino from Linotype, which is based on the phototype variant, (top), and the digital Palatino from Berthold, which is based on the hot metal typeface, (bottom):</p>
      <p><img src="http://666kb.com/i/cq6pzciro4l8u8063.png" title="hosted by 666kb.com"></p>
      <p>I much prefer Bethold's digitization, and I think it is a pity that it is no longer available.</p>
    html_clean: |-
