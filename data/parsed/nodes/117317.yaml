    html: <p>Yes indeed, interpretation is the name of the game when making digital fonts from metal-era designs such as Palatino. The issue arises because the letter shape on the face of the type changes when it is printed. And the printed shape varies depending on the printer, the paper stock and the condition of the type, among other things. So to which shape should the redesigner/digitizer be faithful?</p>
