      <p>I would not mix the fonts from two sources because the metrics may not match.</p>
      <p>As for originality, I would lean toward the Linotype version even though at one point their version likely went through the old phototype unitizing process. Linotype has a history with fonts, Apple is very late to the game. Linotype's type designers were very much concerned with accuracy and attention to detail.</p>
