      <p>Looking at the <a href="http://luc.devroye.org/palatino2.html" title="http://luc.devroye.org/palatino2.html">http://luc.devroye.org/palatino2.html</a> article, "The original Palatino," I do like its liveliness and warmth. It seems to have been captured best by <a href="http://www.bertholdtypes.com/" title="http://www.bertholdtypes.com/">http://www.bertholdtypes.com/</a> 's digitization (see <a href="http://www.sanskritweb.net/fontdocs/pala92.pdf" title="http://www.sanskritweb.net/fontdocs/pala92.pdf">http://www.sanskritweb.net/fontdocs/pala92.pdf</a> which has the font embedded) but that digitization is no longer available. There is the <a href="http://www.linotype.com/57056/palatinolinotype-family.html" title="http://www.linotype.com/57056/palatinolinotype-family.html">http://www.linotype.com/57056/palatinolinotype-family.html</a> version, and the <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/pagella" title="http://www.gust.org.pl/projects/e-foundry/tex-gyre/pagella">http://www.gust.org.pl/projects/e-foundry/tex-gyre/pagella</a> version, and <a href="https://www.myfonts.com/fonts/urw/palladio/" title="https://www.myfonts.com/fonts/urw/palladio/">https://www.myfonts.com/fonts/urw/palladio/</a> . Which else?<br>
      "</p>
