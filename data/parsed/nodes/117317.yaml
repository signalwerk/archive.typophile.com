    html: |-
      <p>"Palatino was originally a hot metal typeface."</p>
      <p>Nope, Hermann Zapf originally designed Palatino for the Stempel typefoundry as a handsetting typeface. An that’s just ‘metal’ ;–) ‘Hot’ metal refers to the line casters by Linotype and Intertype as well as to the Monotype machines. These machines produce set type by producing it directly from matrices in the desired type size. With hand setting, metal type is pre-produced and definitely ‘cold’ when the type setter picks them from the type case. The first Linotype-version of Palatino was called Aldus, a slightly modified version of Palatino, taking the technical restrictions of the Linotype line casting machine in account. Main problem to be tackled: duplex matrices which caused the regular, the italic and the bold weight to be designed at the same widths. <a href="https://www.flickr.com/photos/pietschreuders/8389641634/" title="https://www.flickr.com/photos/pietschreuders/8389641634/">https://www.flickr.com/photos/pietschreuders/8389641634/</a></p>
      <p>The Berthold version as mentioned above, is based on the metal / hand setting version by Stempel, not on some ‘hot’ metal / line caster version.</p>
    html_clean: |-
