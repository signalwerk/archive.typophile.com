  html: |-
    <p>Hi everybody,<br>
    I'm designing a typography-centered blog in Russian, so picking the right fonts for it is a priority.<br>
    So far, I've decided that body text will be in an oldstyle face like Garamond Premier Pro or Arno Pro, shall see which one is rendered better by browsers.<br>
    And I need to pair it up with a sans serif font for headings. Given there's a limited choice of Cyrillic web fonts (I think I'll use Typekit), I decided to use Baker Signet. What do you guys think about such a combo?</p>
    <p>The text is Cyrillic on purpose, since overall impression is very different from Latin</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/garamondandbaker_6432.jpg"></div><p></p>
