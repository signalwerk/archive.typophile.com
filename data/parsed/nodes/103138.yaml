    <p>Thinking more about <a href="http://typophile.com/node/102265#comment-554633" title="http://typophile.com/node/102265#comment-554633">http://typophile.com/node/102265#comment-554633</a>, I realized that I know zilch about fonts used on the older-generations typewriters.  You know: those before Selectric’s changeable type (or was there changeable type before IBM?), and before Courier.</p>
    <p>(For Selectric, it is clear what to do: the specimens are supposed to be available from IBM on <a href="http://ibmcomposer.org/joomla/images/stories/fonts/ComposerFonts.pdf" title="http://ibmcomposer.org/joomla/images/stories/fonts/ComposerFonts.pdf">http://ibmcomposer.org/joomla/images/stories/fonts/ComposerFonts.pdf</a>, but this download is broken; I used <a href="http://luc.devroye.org/IBMSelectricComposerFonts.pdf" title="http://luc.devroye.org/IBMSelectricComposerFonts.pdf">http://luc.devroye.org/IBMSelectricComposerFonts.pdf</a>.)</p>
    <p>All I could find on typophile is the discussion of keycap's font on <a href="http://typophile.com/node/60016" title="http://typophile.com/node/60016">http://typophile.com/node/60016</a>, and the what-is-this-typewriter police academy paper mentioned on <a href="http://typophile.com/node/58501#comment-480816" title="http://typophile.com/node/58501#comment-480816">http://typophile.com/node/58501#comment-480816</a> (and this paper mentions only shapes of a handful of letters, and not combinations).  Well, there is also <a href="http://typophile.com/node/16094" title="http://typophile.com/node/16094">http://typophile.com/node/16094</a>, but I cannot make anything from this.  So: </p>
    <ul>
    <li>how was the font for the first typewriter chosen?
    </li><li>why so ugly?  Is it to hide unreliable positioning of letters on the line? (And, in pre-electric times, variable strike force?)
    </li><li>how much choice of different types was actually there? (Within a manufacturer, or across manufactures?)
    </li></ul>
    <p>Thanks, Ilya</p>
