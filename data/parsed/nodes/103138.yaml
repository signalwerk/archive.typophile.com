      <p>The main issue, indeed, is that the letters were designed so as to compensate for the fact that they were monospaced. Over the years, designers got more practiced at dealing with that, and more attractive typewriter typestyles were developed, that more closely approximated the look of printing types, like Diplomat and Bookface Academic for the Selectric.</p>
      <p>But the first people who invented typewriters couldn't afford to go out and hire a professional type designer.</p>
