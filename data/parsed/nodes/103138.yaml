      <p>I doubt that there is any documentation on how the first typewriter faces were chosen, but it is reasonable to presume that the choice reflected current trends in metal typography, as seen in this photo of the Hansen Writing Ball, the first commercially-available machine.</p>
      <p><img src="http://upload.wikimedia.org/wikipedia/commons/e/e2/Writing_ball_keyboard_3.jpg"></p>
      <p>Why so ugly? One-word answer: monospacing.</p>
      <p>There were a wide varieties of choices of type both within and across manufacturers. ATF specimen books of the early twentieth century regularly featured a dozen or more typewriter-emulation typefaces.</p>
