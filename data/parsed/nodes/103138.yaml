    html: |-
      <p>I was thinking to assume the very first ones, the prototypes, were just punches, or type, from a relatively even-bodied font, trimmed and affixed onto hammers. If something was too wide, then they found something narrower from any font, or had someone engrave the few wide characters on narrower widths. In production, I think they had in-house engravers to cut punches for striking into molds containing hammer and letter in one piece. The designs usually look to have come from softened letterpress designs in monospaced versions. </p>
      <p>"why so ugly? Is it to hide unreliable positioning of letters on the line? (And, in pre-electric times, variable strike force?)"</p>
      <p>I think "ugly", "unreliable positioning" and "variable strike force" in typewriting are only seen that way in our time. In their time, one kept and used their machine as well as they could, and people lived with the results until it was time for a new writing partner or a new typewriter.</p>
