    html: <p>I liked the curved leg of the lc k, but I didn't see that design applied to any of the other characters so I would go with franz's idea of a straight leg, either that or maybe look at applying that to some other characters? Overall this seems like a very solid typefamily here, but is missing that 'something" that makes it unique, and it could just be a little touch to some of the characters. Keep in mind I am not a type designer, I'm a graphic designer. I think you have the basis of what could be an excellent type family, like I said it seems like it's missing something...</p>
