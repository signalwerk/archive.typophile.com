      <p>I for one don't have a problem with another sans. just looked over yours briefly, two things caught my eye:</p>
      <p>lc d<br>
      the lower left part feels a bit odd on close inspection, should be a tad smoother/the curve feels a tad too sharp IMO.</p>
      <p>lc k<br>
      the rounding feels odd, too quirky/too fancy, i think a straight lc k without any roundings would serve you better.</p>
      <p>just my tuppence though.</p>
