      <p>It must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=Charter%20ITC%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=88a88e9058a64bcf4a5467a3df784f64&amp;wrap=2&amp;text=The%20BC%20Provincial%20www.gov.bc.ca" rel="nofollow">Charter</a></strong> by Matthew Carter (1993).<br>
      It's available as Charter ITC (ITC), Charter BT (Bitstream), Charter BT Pro (Bitstream) and once upon a time there was also an Charter EF version from Elsner+Flake. I think the original design owner was URW.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
