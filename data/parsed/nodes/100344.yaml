  html: <p>Could somebody please name the companion font to Apex New as has been chosen for Emily Carr Institute? A picture can be found <a class="freelinking external" href="http://vllg.com/system/usage_images/images/192/original/EmilyCarr4.gif?1259537851" rel="nofollow">here</a>. Thank you.</p>
