      <blockquote><p>Wouldn’t it be feasible just to use a format 3 post table, and omit the glyph names altogether?</p></blockquote>
      <p>Perhaps. But I wouldn't want to try to write OpenType and Graphite rules without human-friendly glyph identifiers, and for this the PS names are extremely helpful.</p>
