  html: |-
    <p>I've asked this question over on the OpenType and mpeg lists, but I thought some of you might have longer memories.</p>
    <p>The current OpenType spec says, in the 'post' fmt 2.0 table, that:</p>
    <blockquote><p>
         Index numbers 32768 through 65535 are reserved for future use.
    </p></blockquote>
    <p>Does anyone have any recollection of why this limit is present -- or what possible "future use" such name ids might be put to?</p>
    <p>And I guess more practically, can anyone suggest a reason not to eliminate this restriction?</p>
    <p>tia,</p>
    <p>Bob</p>
