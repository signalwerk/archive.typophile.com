    html: |-
      <p>hello christian, nice to meet you here. :)<br>
      this font was actually bought by the client from veer after i suggested it for the work. apart from me, the font is used by a translator and a layouter, who don't even  know, that i want to have the "ß" changed. the deadline for printing is near, and i don't want to upset the people with bringing in a changed font right now. therefore i've been looking for a search&amp;replace solution. On the other hand, this is not very practical anyhow, because of wrong spelling and hyphenation problems. </p>
      <p>where did you get the inspiration for drawing the "ß" this way? i'm asking, because here in germany you won't meet this specific form very often – although, you can see it on a lot of street signs here in berlin (<a href="http://upload.wikimedia.org/wikipedia/commons/0/0d/Berliner_Strassenschilder.jpg" title="http://upload.wikimedia.org/wikipedia/commons/0/0d/Berliner_Strassenschilder.jpg">http://upload.wikimedia.org/wikipedia/commons/0/0d/Berliner_Strassenschi...</a>).<br>
      this form derives from the ligature long-s and blackletter-z. that's what makes it look a bit nostalgic. the commonly used one derives from long-s and short-s – double-s, so to speak. although it is not the same as "ss"... okay, german language – difficult to understand anyway. but whom i'm talking with – i guess, you have thought about all that when drawing the alternative forms.</p>
      <p>i'd like to come back to your offer after talking to the client (maybe he likes the "ß" the way it is anyway ;)).</p>
      <p><strong>edit:</strong> btw, it is the pill gothic condensed 1 package.</p>
