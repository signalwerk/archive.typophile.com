    <p>hello,</p>
    <p>i'm using christian robertson's typeface <a href="/wiki/pill%20gothic" class="freelinking" rel="nofollow">pill gothic</a> in a project. setting text in german language, i found the font's "ß" not that suitable for my purpose. it's looking a bit "old fashioned" whereas the font itself is rather modern. unfortunately, the two alternive "ß" are not evoked by the opentype titling alternatives or other opentype programmings. it seems as if it isn't even possible to search and replace the specific character in indesign, for i can't place the alternative glyph (taken from the indesign glyph table) into the replace field. it won't be recognized correctly then and just "^;" will be replaced instead of the real glyph.<br>
    any suggestions/solutions for that issue?</p>
    <p>alex schmidt</p>
  html_clean: |-
