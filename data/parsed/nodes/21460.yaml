    html: <p>Hmm. That's a tough question. Obviously picking the alternate in the glyph palette wouldn't be an option. Unfortunately, when this font was authored no one supported stylistic sets. The good news is that the license on my fonts allows users to decompile/recompile/edit as long as they don't resell them. I could probably give you a custom cut, though. I'm assuming that you bought a license ;)</p>
