      <p>I’m sure your tutor doesn’t really expect you to be a great photographer. He or she is just trying to encourage you to try many different things so that you have an appreciation of what goes into design. A broad set of skills is useful, and so is resourcefulness. The more work you do as a student in different areas of design will eventually give you a better idea of what you want to specialize in.</p>
      <p>Nick Cooke</p>
