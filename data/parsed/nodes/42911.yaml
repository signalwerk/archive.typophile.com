    html: |-
      <p><cite>Isnt that bad using someone elses photographs?</cite></p>
      <p>Not at all. A graphic designer’s job is to communicate by bringing various sensory elements together in a way that works technically and aesthetically. Nobody expects a designer to do her own photography—after all, just getting good at one area of photography can take years, much less being able to photograph everything from still life to portrait to urban architecture. If I wanted to do really great outdoor photography in downtown DC the camera alone would cost me tens of thousands of dollars and I wouldn’t even know how to use it—so using other people’s work is the only option!</p>
      <p>There are plenty of photographers who understand this and post their work on sites like Flickr and sxc.hu just for student (and low-budget) designers to use. And in most countries there are “fair use” exceptions in copyright law that allow students to use other works for non-commercial purposes.</p>
      <p>In the commercial world, all these specialists are pretty well compensated for their work. They also often get credit (ever notice the name of the photographer alongside an image) or get paid extra to leave their name off the work. So it’s really a win-win situation.</p>
    html_clean: |-
