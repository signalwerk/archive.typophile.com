    html: |-
      <p>first of all,  learn never to make excuses for your work.  that right there is a separation between those who can  and those who think they can’t. guess which one will get hired ?</p>
      <p>second : as a student you can employ all sorts of tricks and appropriation that will not be acceptable as a professional. it’s understood that students needto experiment with ideas on limited budgets. when showing these works in an interview it can actually speak very well to your integrity if outside sources are properly credited.</p>
      <p>third : most creative directors and “idea people” have risen in the ranks thru positions where they learned the skills that they now direct.</p>
      <p>fourth : be resourceful ! make a mock-up or a multi-view illustration if you can’t produce the actual object.</p>
      <p>fifth : investigate the skill sets of your fellow students and consider collaborating or trading services. taking advantage of available resources is another attribute that will recognized in an interview. try to get into a “can do” mindset. make things happen.</p>
