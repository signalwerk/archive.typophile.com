    html: <p>You’re confusing execution with production, and you’re also not learning to work within your limits. Most designers don’t do their own illustration, or photography, or molding of plastic packages; they pay productions specialists to do it. For school projects, don’t try to do that stuff—do other stuff instead. When I want great photos, I scan them or use stock, when I have to design a package I reuse existing components. But I don’t worry about ideas that I can’t produce—I just think of something else instead.</p>
