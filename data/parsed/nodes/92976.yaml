  html: <p>I am trying to set up my MySQL database to support Latin Ext B, but there is no such thing as Latin Ext B in the <a href="http://dev.mysql.com/doc/refman/5.0/en/charset-charsets.html" rel="nofollow">listed options</a>. I’m working with my developer here, so please forgive me if I mix up the terms. Have anyone else done something similar? Can you give me some pointers?</p>
