  html: |-
    <p>Can someone tell me how to extract a font face from a font family? I have the Gill Sans font family but need Gill Sans bold as a separate font.</p>
    <p>It's complicated to explain why, but I'm working on a big Flash project and the engineering team can only get one face for a font to work with our embedding process. I need both font faces as their own font to embed them both.</p>
    <p>Thanks!</p>
