    html: |-
      <p>I usually just go ahead and use the version I have.</p>
      <p>Unlike my old international book jobs, when fonts were automatically with them, today I get InDesign, or (God forbid) Quark files, and they have no fonts with them. They are instructed not to send them anymore. As a type designer I say yeah, but as a book designer, I say bugger me with 6 ft pole. And I did. And happily my publisher was ready to pay for the font.</p>
      <p>That means that language versions get their pay.</p>
      <p>So, designers, hold on to your designs; change could be happening.</p>
