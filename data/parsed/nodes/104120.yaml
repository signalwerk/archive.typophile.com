  html: <p>What is the difference in the dots of a simple geometric shape and calligraphic shape used in font designing? I would appreciate if somebody explain its details with some images and the advantages of one type of dot over the other?</p>
  html_clean: <p>What is the difference in the dots of a simple geometric shape and calligraphic shape used in font designing? I would appreciate if somebody explain its details with some images and the advantages of one type of dot over the other?</p>
comments:
  - id: 562715
