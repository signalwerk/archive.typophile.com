    html: "<p>I don't know who was the first to combine roman and italic in this way typographically, but the concept of using different type styles to indicate semantic or other kinds of textual distinction, like much else that we think of as typography, was exploited by scribes long before the dates you note. There's a nice example illustrated in JP Gumbert's brilliant essay ‘“Typography” in the Manuscript Book’ (<em>Journal of the Printing Historical Society</em> No.22 1993): a manuscript dictionary of difficult Latin words, with the words in uncial and the definitions in minuscule. It was written probably at Amiens c.800 AD.</p>"
