      <p>Of which types are you thinking? The split nib originated in the 16th Century, and was popularised by Cresci, but that is later in the century.</p>
      <p>It is interesting to put the timelines of typographic styles and writing styles from 1470 to 1870 side-by-side, and to realise that at either end of the period there is about a hundred years in which the styles reflect each other, in terms of stroke construction. But in the middle there is a period of two hundred years in which they increasingly diverge. Granjon's civilité represents an attempt to accommodate the popular writing style of the day within the expanding typographic canon. But it isn't until the mid-18th Century that Baskerville and others bring type and writing back into alignment again by making types based on an expansion stroke construction.</p>
