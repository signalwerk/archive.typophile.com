      <p>Bill: <em>John, I think the theory that Civilité was given up because of the change in pen styles has problems. Italic was also based on the broad pen, and survived.</em></p>
      <p>Italic is just what you get if you write quickly: your letters start to slant and they become horizontally compressed. The roman/italic distinction is just the same formal/informal distinction that you get in pretty much any advanced manuscript culture. Since the split nib lent itself particularly well to running hands (you can control the thickness of the inter-letter connections independently of letter strokes, regardless of direction; so, for instance, the connecting stroke coming off the top of an o can be the same thickness as a connecting stroke coming up from the bottom of an i, which is not possible with a translation broad nib connection), it was a natural tool to influence a new kind of ‘italic’.</p>
      <p>Typographically, this seems to me a key observation that almost everyone has failed to make: the written models of the Fournier, Baskerville, Didot and Bodoni italics precede the <em>models</em> of their roman types by more than half a century, and precede the cutting of e.g. Baskerville's types by more than a century. We're used to the idea of romans preceding italics, because that is the sequence in which they were developed <em>as type</em> in the renaissance. But there's nothing in the manuscript tradition to say that a formal letter always precedes a less formal or more cursive one.</p>
      <p>In Barbedor's Paris writing exemplar of 1647, there is a fully realised unconnected and serif'd italic written with a split nib. It isn't until 1695 that we see the first printed engraving of an crudely attempted corresponding Roman -- by John Seddon, whom I believe is probably due credit as the inventor of the style --, and another few years before George Shelley perfects it.</p>
      <p>Now, you go find yourself a split nib pen and try to write civilité with it.</p>
      <p>Peter: <em>But why did they change pens?</em></p>
      <p>They liked the new shapes they could make.</p>
      <p>The split nib pen requires more skill than the broad nib, but it is much more flexible -- literally and figuratively -- and you can create much more varied and dynamic shapes. The calligrapher <a href="http://www.paulantonioscribe.com/" rel="nofollow">Paul Antonio</a>, who is a modern master of the split nib, ably demonstrated its capabilities at the St Bride conference earlier this year. Its relative difficulty, of course, inspires virtuosity, which is one reason why penmanship became so greatly admired in the later 17th and 18th Centuries (the other reason being that engraving made it possible to reproduce these letterforms in print, leading to the popularity of writing manuals and exemplars such as Bickham's <em>Universal Penman,</em> only the grandest of a long line of such books).</p>
    html_clean: |-
