      <p>Hi. I think it was printer Aldus Manutius (Aldine PRess) who printed the first italic type, created by Francisco Giffo in the book "Virgils Opera" in  1501. It was based on the "can-cellersca" handwriting done by italian scribes at the time. Humanist in origin.</p>
      <p>There was also a desiner Robert Granjon (french 1540ish) who created an italic script called "Characters of Civility" (characters de civilite) and this was published in a book entitled "The first fabulous book of stories" but was not a success because it was difficult to read. Granjon was inspired by Claude Garamond, who was the first punchcutter to work independently of a printer. :)</p><div class="imageWrap"><img src="http://typophile.com/files/Vergils_Opera_6489.jpg"></div><p></p>
