      <p><cite> &gt; For instance first example of an italic and a roman being marketed as a pair </cite></p>
      <p>This is potentially problematic. For most of the early period we're talking about, typefaces were identified by size name. Were all these "marketed" as companions or not?</p>
      <p>For instance, picking just one random instance from Fournier (note: the italics are not named as such) -- Cicéro poétique; Cicéro poétique [italic]; Cicéro, petit œil; Cicéro serré; Cicéro ordinaire; Cicéro, œil moyen; Cicéro, gros œil; Cicéro ordinaire [italic]; Cicéro, gros œil, dans le goût Hollandois; and Cicéro, gros œil [italic]. Each presented on a separate page.</p>
