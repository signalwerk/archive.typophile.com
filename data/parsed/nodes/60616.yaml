      <p>What seems to me to be happening in the Lambrecht <em>r</em> and <em>n</em> is simply a stroke direction reversal forming a stem as closed loop. This is very much consistent with a broad nib, and actually very uncharacteristic of a split nib, in which reversals are usually sudden and not looped. A similar loop stem construction is seen in Fred Smeijers' Renard italic.</p>
      <p>I played around with a broad nib this afternoon, and it is possible to very easily make forms similar to the Lambrecht italic.</p>
