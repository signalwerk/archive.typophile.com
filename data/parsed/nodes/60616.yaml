      <p>Tiffany, I think the use you describe—yes, it was Aldus—would be what Eben would consider a merely stylistic use of roman and italic together, i.e. the two types do not signify different types of information or emphasis.<br>
      ____</p>
      <p>The questions of who first set roman and italic together as Even describes and who first cut roman and italic types as harmonised type designs are separate. I'm not sure the second question is really answerable, since it depends on what you consider harmonised and on the perhaps unknown intent of the punchcutter or his customer.</p>
