      <p>John is right - setting a Cap in Roman isn't what I had in mind. And actually even setting a different language in italic vs roman, while it is a kind of limited indication of semantic difference, ( it is a broad kind of distinction in information types ) it isn't what I was getting at either. But setting setting quotes in italics or scientific names or titles etc is the far more fine grained distinction I was thinking of.</p>
      <p>John's second points are also quite good although I do think there are some more specific things you could make a case for. </p>
      <p>For instance first example of an italic and a roman being marketed as a pair meant for each other in which case intent is stated - even if you disagree with the design choices they made.</p>
      <p>As far as purely design based criteria I agree with John that putting forward a first example of an italic made for a roman might not be reliable, but if you acknowledge the subjectivity of the assertion it is not an unreasonable thing to do.</p>
