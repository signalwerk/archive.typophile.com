    html: <p>The practice is usually credited to Robert Estienne the elder (c 1503-59), or at least it was when I was studying the history of letterforms back in the mid-1990s. See the biography of Estienne by Elizabeth Armstrong, who places the first usage with the 1532 edition of his French-Latin dictionary <em>La Maniere de tourner les verbes</em>, where the Latin is in roman type and the French in italic. (And, yes, he's the same 'Estienne' from whom I derive my user name...)</p>
