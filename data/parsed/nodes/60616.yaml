      <p>Morison's chapter on Granjon Italic does indeed contain a lot of pertinent information. Too much to try to summarize. I'm sure Eben can get his hands on a copy of <cite>Tally of Types</cite>.</p>
      <p>Morison doesn't ascribe the first practice to any particular printer or founder, but narrows the date &amp; location down to the middle 16th century (prior to 1590) in Paris. </p>
