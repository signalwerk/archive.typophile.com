      <p>...[<em>civilité</em>] <em>was not a success because it was difficult to read.</em></p>
      <p>Says who? Civilité types enjoyed popularity in France and the Netherlands, and even found use in England. Apart from Granjon's original civilité types — which were cut in a wide range of sizes, a fact that speaks to their popularity —, types in this style were cut by at least seven other known punchcutters, and there are numerous anonymous examples. Harry Carter and HDL Vervliet's standard monograph, <em>Civilité Types,</em> catalogues 33 different civilité types, the first of which is Granjon's mediane of 1557 and the last of which is a copy of Breton's gros romain (original c.1570) cut in 1811. Most of these 33 types were cut between 1557 and 1601. Granjon's last civilité was cut in 1587, so that's a 30 year period in which he found enough success with these designs to make them commercially viable.</p>
      <p>In cutting types in the civilité style, Granjon was simply doing what Gutenberg, Aldus and others had done before him: implementing typographically the popular writing style of his day. Civilité types fell out of fashion in the 17th Century during the same period that civilité writing fell out of fashion and split-nib styles became popular.</p>
