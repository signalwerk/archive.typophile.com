      <p>Thanks to you both.</p>
      <p>I had read the Vignelli cannon before, but confess I had forgotten about it. A re-reading had me re-consider my complex grid and come up with something more simple. I used 1 pica margins for the left and right, and 2 pica column gutters. Using James' advice on running rag right text, the large gutters seem less imposing, especially with a minimum type size of 8pt. </p>
      <p>Thanks again.</p>
