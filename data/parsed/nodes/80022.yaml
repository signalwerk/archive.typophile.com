    html: |-
      <p>Using rag right columns (rather than justified) may help make the uneven column spacing less obvious.</p>
      <p>For articles that span folds, perhaps a graphic element could be used to visually group together the related text. For example, put a tinted background behind the article's columns, or put them in a box, or have a rule span those columns, or group those columns via text style or color.</p>
