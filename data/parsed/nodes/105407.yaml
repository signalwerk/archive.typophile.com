    html: |-
      <p>Checked out <a href="http://search.veer.com/?keyword=phaeton&amp;producttype=IMG,ILL,TYP" rel="nofollow"> Phaeton </a> &amp; love the font:<br>
      Here is an endorsement from ilovetypography.com:<br>
      ---start quote--<br>
      Phaeton<br>
      by Kevin Cornell &amp; Randy Jones<br>
      A brilliantly talented and prolific illustrator (&amp; writer) hailing from Philadelphia, PA. Part super-hero, part … something else, you probably know him for his work at A List Apart, the Superest, or Mojo.<br>
      Looking hand-drawn and with its trousers pulled up high, this condensed serif display face is oddly wonderful. Randy Jones was just the right chap to bring Cornell’s lettering to digital fontdom. Wobbly cup serifs and a smattering of bouncy ball terminals combine to make this single cut a delightfully eccentric face that’s really fun to use. It bears some of the hallmarks of Jones’ Olduvai, and comes replete with numerous wordmarks and pictographs, plus a number of stylistic alternates. I wonder what Batman and Robin have up their other sleeves.<br>
      --end quote--<br>
      Link to<a href="http://marketplace.veer.com/font/Olduvai-Family-UMT0000054?skeywords=UMT0000054" rel="nofollow"> Olduvai</a>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PhaetonPromo_5018.jpg"></div><br>
      Don<p></p>
