  html: |-
    <p>Organisers of the International Design Festival Design Attack invite designers to submit their proposals for the exhibition "Material of the Future", a part of the first edition of Design Attack Festival, which will be held in Krakow on 6-30 November 2010. </p>
    <p>The subject of the exhibition Material of the Future will revolve around the evolution of materials considered to be the future - from plastic (first bakelites, tomofon, the first biodegradable materials, laminates AbetPrint) towards ecology, nanotechnologies, and hybrid composites. The exhibition will present works and projects of Polish and foreign designers interested in the issue of using new materials in 3d design.</p>
    <p>The call addresses designers specializing in design using innovative materials, as well as those who, for the purpose of the exhibition, will create experimental projects using new technologies and materials.</p>
    <p>The exhibition will present completed 3d objects, prototypes, concept sketches, photographs, advertising materials, and educational boards. </p>
    <p>The exhibition will be on display in the "Solvay" Center for Contemporary Art in Cracow during 1st international festival Design Attack. CCA "Solvay" is a cultural institution whose mission is to promote contemporary art, including interdisciplinary projects  combining visual arts, music and performance. The works and their authors will be also presented in the Design Attack Festival Catalogue and on the festival website. </p>
    <p>Call for submission is open for all participants. Deadline for submissions is August 31st, 2010. Submissions can only be made online at <a href="http://www.designattack.pl" title="www.designattack.pl">www.designattack.pl</a>, and send to the Organiser.  </p>
    <p>Submissions will be judged by a professional Jury. All submitting artists will be notified via email by September 10th, 2010.</p>
    <p>For more information go to: <a href="http://www.designattack.pl" title="www.designattack.pl">www.designattack.pl</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/DA_logo kolor_6658.jpg"></div><p></p>
