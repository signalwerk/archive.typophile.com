    html: |-
      <p>The fonts in the bottom sample, i.e. Bell MT and Times roman italic, are embedded. The previous fonts are not as you can see with Acrobat reader when you select "Document properties" "fonts".</p>
      <p>I have never had that problem on a mac. Maybe one thing to check is the embedding rights. In Fontforge, with "Elements" &gt; "Font info" &gt; "OS/2" &gt; "Misc" &gt; "Embeddable", you can fix those rights.</p>
      <p>Michel</p>
