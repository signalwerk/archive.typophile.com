    <p>Hello,</p>
    <p>I'm working on getting a font ready, and I'm having a problem with pdf embedding. Here's the summary: I design my fonts in TypeTool, then use FontForge to make .otf files. But, when I use these otf files to make a pdf with Word 2007 (currently the only pdf-making program I have that can deal with otf's, since OpenOffice can't), my fonts show up pixelated. Other fonts don't. I've tried fiddling with the options in the otf generation dialog in FontForge, but I can't seem to get rid of the pixelation. Does anyone know what could cause this?</p>
    <p>Here's a pdf of the problem, with the first six words being in my font family. You have to zoom in a bit to see the pixelation. If it'll help, I could send you a copy of the font for a look.</p>
    <p>Thanks in advance for your help.<br>
    Nathanael</p>
