    html: |-
      <p>Do you have figures only for paragraph/section openers, i.c. drop caps?<br>
      What's the range, I mean, do you have also 10, 11 &amp;c., that consist out of two figures?</p>
      <p>In case you have figures only, you might give it a try with 'hanging' drop caps, placed into the margins and both lining with the first and resp. second or third line of text.</p>
      <p>Try to avoid lining figs as much as possible. They are for tabular work and all caps settings (titling) only. (At least, that's my old fashioned  dada.)</p>
