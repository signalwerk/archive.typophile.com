    <p>I'm working on a piece that uses the numbers 1, 2, and 3 as drop caps. I'm working in Sabon, and the rest of the numbers in the document are OSFs. Doing the same thing for the drop caps yields the following horror:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/icky-cap_5621.png"></div><p></p>
    <p>Should I try to find some method of making the OSF drop-cap work, or should I stick a tabular figure in there?</p>
