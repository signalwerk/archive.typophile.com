    <p>Hello again folks. Need some more help finding the font in the Fairfield Inn by Marriott logo (just the relevant portion is shown here):</p>
    <p><img src="/sites/default/files/old-images/fairfield_6473.jpg"></p>
    <p>I don't think the <em>Fairfield</em> and <em>Inn</em> are the same (the serifs look a little different, and the <em>Inn</em> looks heavier as well), but just posting the <em>Inn</em> may not be particularly helpful. The <em>Inn</em> is all I really need to replicate, though.</p>
    <p>Assistance is most appreciated!</p>
