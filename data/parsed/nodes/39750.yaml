      <p>Based on the suggestion of Goudy, I played around with it in Illustrator this morning. When attempting to change the fill colour, I accidentally added a stroke to some type I set in Goudy Extra Bold, and, what do you know, it came pretty darn close. I should be able to play with the stroke and tracking and get it pretty close to perfect.</p>
      <p>Thanks for setting me on the right path!</p>
