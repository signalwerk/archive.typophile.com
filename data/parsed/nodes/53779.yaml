  html: |-
    <p>Chipperly, just released on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/chipperly/ " rel="nofollow"> MyFonts.com</a>, is a brand new face inspired by the art of the Edwardian poster, especially travel posters. It’s good for clear ad legible headings which need a gentle and unobtrusive period touch, and is the latest is Greater Albion’s line of faces to explore the ‘small capitals’ idea.</p>
    <p>In its regular weight, Chipperly’s glyphs are semi-shaded within an outer outline giving a distinctive look, while the Heavy weight maintains the separate outline but is completely filled. The Light form is an outline alone. All forms unite period elegance with the modern need for clear readability.</p>
    <p>Light:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Chipperly_l_5140.png"></div><p></p>
    <p>Regular:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Chipperl_R_4733.png"></div><p></p>
    <p>Heavy:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Chipperly_h_5778.png"></div><p></p>
    <p>See some examples of Chipperly in action at Greater Albion's <a class="freelinking external" href="http://gatf.wordpress.com/ " rel="nofollow"> announcements blog</a>.</p>
    <p>Try is out for yourself on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/chipperly/ " rel="nofollow"> MyFonts.com</a>.</p>
