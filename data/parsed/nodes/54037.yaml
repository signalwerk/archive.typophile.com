      <p>I second James, but rely more on the difference between size and leading then actual point size. There are thousands of different screens with varying resolution. </p>
      <p>As for choosing fonts, you'd probably want to style it like this: <em>font-family: Consolas, Lucida Console, Monaco, monospace;</em>, or this: <em>font-family: Courier New, Courier, monospace;</em></p>
