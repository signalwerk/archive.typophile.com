      <p>Outline version of Courier are terrible. In fact, they are the worst known renderings of a letterpress font (as IBM Selectric Courier actually was) in outline form. Really, avoid at all costs.</p>
      <p>You’re advised to surround font names that include spaces with quotation marks in any CSS file: <code>font-family: "News Gothic"</code> not <code>font-family: News Gothic</code>.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
