    html: |-
      <p>Courier, as Bud intended it, can only be acceptable when metal ball hits ribbon producing imprint on typewriter grade paper. You can digitize the image on the ball (as Monotype did) and produce an anemic hairline font. Or you can digitize the image on the paper, producing what amounts to a cliché. Or you can try for something in between. </p>
      <p>What's missing is that they was not designed or intended for the screen, or for regular printing processes.</p>
