      <p>Note that Courier New has a really narrow stroke-width. In Windows it gets beefed up under ClearType rendering. That "fix" isn't in the iPhone or Mac OS, AFAIK, so might want to specify Courier before Courier New - or at least verify the site on Mac, Windows and iPhone.</p>
      <p>Cheers, Si</p>
