  html: |-
    <p>I'm working on a web project where I need/want to use a monospace as the primary typeface. This isn't a design question per se, but in general, what can be done to set text in a monospace in a way that makes it easier to read? And if there are specific suggestions to one of the primary monospace web fonts, that would be great too.</p>
    <p>So far, what I am thinking is that leading should be greater than normal, since the extreme vertical orientation of the type creates a pattern that breaks up the left to right flow essential to ease of reading. But going too far is almost too easy since the x-height is so extreme.</p>
    <p>If you were forced to use a monospace, what would you do?</p>
