      <p>"...in general, what can be done to set text in a monospace in a way that makes it easier to read.."<br>
      Some monospaced fonts were digitized from an actual point size. Using a font digitized from a size and at that size, is the best you can do. So e.g., if a monospaced font says 10 pitch, use is usually best at 12 point. Bitstream's Courier 10 Pitch is based on the daisywheel plus a little if you are looking for accuracy to an original size/pitch for print... but you are doing a web project, so you're screwed in two dimensions — if the monospacing alone does not harm the type  the rendering certainly will. The one way to make the rendering better on the web is to enlarge, and poke-in-de-eye! it's monospaced. I'd refuse on the grounds of "You hired me!", or at least distance myself from all and any credit. Hope this helps.</p>
      <p>Cheers!</p>
