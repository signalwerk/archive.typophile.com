    <p>For my typography class. We were assigned to create an ambigram. I am posting this in hopes that I can get good feed back on what people perceive the ambigram is. </p>
    <p>When you read it: read the way it is displayed first, What name do you see?  Then, rotate 180 degrees and read another name. The second name is not common, so just let me know what letters you perceive. </p>
    <p>I would appreciate as much participation as possible. The more the better. Feel free to give constructive feedback for helping letters become more intriguing or more readable.</p>
    <p>Keep in mind this is a rough sketch, I will put up improvements as comments come in and as I further explore my own creative ideas.</p>
    <p>Again Thanks.</p>
    <p>Ryan</p>
    <p></p><div class="imageWrap"><img src="/files/HPIM0048_5715.JPG"></div><p></p>
