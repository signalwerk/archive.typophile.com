    html: "<p>Speaking of Gill and Morrison, there's a treasury of typographical history in 'A Poet in Walton Street' by Simon Nowell-Smith, and the collection of which it forms a part, \"Essays Mainly on the 19th Century Presented to Sir Humphrey Ward\", 1948, Oxford U Press. The article by Nowell-Smith primarily treats the printing history of Robert Bridges, poet laureate of England at the time. The poet and his wife superintended, exactingly, the typography of his books and Mrs. Bridges worked on a phonetic alphabet based on a half-uncial drawn in the 18th century. (She was also the author of \"New Handwriting for Teachers\".) Everybody who was anybody in the typographical scene of the early 20th century, including Edward Johnson, Logan Pearsall Smith, Bruce Rogers and D. W. Updike, has a walk-on in this relation, and the marquee fonts are there, too: the Fell types, Baskerville, Fournier, Centaur and Arrighi, Bembo and Blado.</p>"
    html_clean: "<p>Speaking of Gill and Morrison, there's a treasury of typographical history in 'A Poet in Walton Street' by Simon Nowell-Smith, and the collection of which it forms a part, \"Essays Mainly on the 19th Century Presented to Sir Humphrey Ward\", 1948, Oxford U Press. The article by Nowell-Smith primarily treats the printing history of Robert Bridges, poet laureate of England at the time. The poet and his wife superintended, exactingly, the typography of his books and Mrs. Bridges worked on a phonetic alphabet based on a half-uncial drawn in the 18th century. (She was also the author of \"New Handwriting for Teachers\".) Everybody who was anybody in the typographical scene of the early 20th century, including Edward Johnson, Logan Pearsall Smith, Bruce Rogers and D. W. Updike, has a walk-on in this relation, and the marquee fonts are there, too: the Fell types, Baskerville, Fournier, Centaur and Arrighi, Bembo and Blado.</p>"
