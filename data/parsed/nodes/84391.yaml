      <p>Detouring (I was going to say, 'deviating') from the topic of Gill, it's also noted in the Nowell-Smith article that Arrighi, which had lately been recut by Frederick Warde, was given a first trial in a collection of Bridges' poems, 'The Tapestry'. An edition of 150 copies was privately published in November, 1925, by Warde and Stanley Morrison. For this book the poet 'had prevailed upon Mr. Morrison to design an additional character in order to distinguish hard from soft 'g'.' This was a small instance of Bridges' use of special characters, a case of the poet's desire to bend the alphabet into serving his vocal intent.</p>
      <p>If there isn't already a book on poets' experiments with phonetics, there ought to be one written.</p>
      <p>Eric Gill designed and cut the dedication, "To the King', for a deluxe limited edition of Bridges' 'The Testament of Beauty'. It was printed in red ink. (It's seems minor irony [in view of Gill's politics] that Perpetua Italic seems to have become the go-to typeface for royal wedding invitations. It was used not only for the recent nuptials of Prince William, but also for Chas &amp; Di.)</p>
