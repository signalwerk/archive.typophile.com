    html: |-
      <p>That was really fascinating, thanks! </p>
      <p>Gill's devotion to honest work, his charm, his crankiness and his weirdness all come through.</p>
      <p>Beatrice Warde talks about how she posed nude as a young woman for Gill. She modestly refers to her legs as interesting to Gill, but there is a provocative woodblock of her as a nude that shows his interest was more --er-- wide ranging. Gill wrote of her "fine American carcass" and she uses the same language jocularly without offense, though it sounds pretty dreadful.</p>
