      <p>@Christopher Dean<br>
      On which platform/version are you seeing differences between Safari/FF/Chrome?</p>
      <p>@sii<br>
      The CSS3 Fonts spec contains more explicit controls.  I was pushing for kerning to be on by default but Apple *and* MS folks (Sylvain) preferred an 'auto' setting which would the browser to decide, along with explicit on/off settings.</p>
