    date_raw: 3 May 2009 — 7:14pm
    votes: null
    html: <p>I think these "What font goes with what" threads are a shortcut to nothing. How do you think typographers discover interesting combinations? Not by asking, but by doing. One of the great joys I had as an AD was experimenting with different type combos when a new project crossed my desk. Find your own combinations, on your own, and maybe, just maybe you will find the combo that is perfect and  has never been used. (I said maybe, I did not say likely).</p>
