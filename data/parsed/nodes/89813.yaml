  html: |-
    <p>Looking for examples of content-rich sites that make the best use of so called web safe fonts. Pretty easy to find examples for Georgia and Arial/Helvetica but having a harder time for Times, Courier, Trebuchet and (believe it or not) Comic Sans. </p>
    <p>Thanks, Si</p>
