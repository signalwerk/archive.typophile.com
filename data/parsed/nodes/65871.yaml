      <p><em>...spammers and/or jerks.</em></p>
      <p>I’d suggest a spammer is a jerk, no <em>or</em> about it.</p>
      <p>So is it me that decides who my buddies are? Or them? I can’t see a ’refuse to be buddy’ button. Not that I’m antisocial...</p>
      <p>When you hit ’Flag’ do you get a chance to explain why you think the post is ’problematic’? And if you get flagged, do you get a black mark, three strikes, that kind of thing?</p>
