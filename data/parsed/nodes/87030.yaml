      <p>A short G-search (in Dutch) digs up this:</p>
      <p>Voor de typografie van de naam Graphic Design Museum is gekozen voor een Nederlands letterontwerp. Luc(as) de Groot (Fontfabrik) is de ontwerper van de TheSans, de schreefloze versie uit de TheThesis familie. Dit lettertype wordt veelvuldig gebruikt voor corporate doeleinden over de hele wereld en staat als zodanig voor wat het is. De uit TheSans getypografeerde naam in het merkbeeld is door Luc(as) de Groot in de subtiele details gemodificeerd.</p>
      <p>Ergo: a modified TheSans — mod by its creator Luc[as] de Groot.</p>
