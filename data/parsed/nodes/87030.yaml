    html: '<p>Without being able to say what it is: It’s not a modified TheSans. None of the characters comes even close to the retail version. Only the heavy ‘B’ on the left-hand side seems to be taken from TheSans. And there <em>is</em> a different version with TheSans:  <a href="http://www.frederikdewal.nl/Graphic-Design-Museum-Beyerd-Breda.php" title="http://www.frederikdewal.nl/Graphic-Design-Museum-Beyerd-Breda.php">http://www.frederikdewal.nl/Graphic-Design-Museum-Beyerd-Breda.php</a></p>'
