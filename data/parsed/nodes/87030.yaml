      <p>Oww, sorry about my call on this. Shows that you just can’t believe what’s written on that thing called the Internet...<br>
      Taking a closer look at the image I’d say it is a modified Gill Sans (or any of its lookalikes, eg Underground or London Transport). How that came about? Your guess is as good as mine (and don’t use that thing called the Internet to find answers).</p>
