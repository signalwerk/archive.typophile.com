  html: |-
    <p>For those who are interested in Type and Hand Lettering, My friend John Downer and Paul Herrera are teaching a Brush Roman Class at Typecon. This is to me a once in a lifetime chance to study with 2 masters of letters.</p>
    <p>Wednesday, August 21st<br>
    Full-Day Sessions<br>
    9:00 am – 4:30 pm</p>
    <p>Full day workshops break for lunch from 12:00 pm to 1:30 pm.<br>
    Brush Roman Majuscules (Day 1)</p>
    <p>John Downer &amp; Paul Herrera</p>
    <p>Cost: $200 (Two Day Workshop)<br>
    Maximum Participants: 24<br>
    Location: Pacific Northwest College of Art</p>
    <p>This is a two day workshop. Participants must be prepared to attend both days.</p>
    <p>This course is being taught by two Iowans who have had vast experience in the lettering profession, especially with a brush. John Downer and Paul Herrera will provide instruction on the proportions of Imperial Roman Majuscules, and show how the letters are formed with a flat, one-stroke, lettering brush. Each participant will receive valuable pointers on paint control, proper technique, stroke sequences, and various essential aspects of brush manipulation. Regular demonstrations will also be given.</p>
    <p>Nontoxic, water-soluble tempera paint will be used. Materials will be included in the cost of the workshop.</p>
    <p>Hope to see you there!</p>
