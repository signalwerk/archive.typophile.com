      <p>The exact ideas in this thread were addressed by Henry Lewis Bullen a century ago in the passage quoted below. I find this passage really insightful. At the same time, the Orientalist assumptions expressed—typical of the time, 1912—are really distasteful in the context of colonialism. </p>
      <blockquote><p>"The model of roman types is at once the most rigid in its elementary lines, and the most flexible in its expression.</p>
      <p>"If we except the Greek capitals (which were parents of the Roman capitals) and Russian (which is also derived from the Greek), all other alphabets now in use are solely cursives, in the sense that they are constructed with the purpose of being readily produced by pen or brush, even in their most formal uses. Hebrew characters are... representative of hundreds of oriental alphabets similarly cursive in their structures, each of which conforms with an almost unvarying model. None of these lend themselves to decorative effects. While most of them are graceful, none afford scope to the designer; seemingly fluid, they are actually unyielding. They fitly typify the oriental civilizations, which, like their alphabets, had become stereotyped long before the invention of typography, and have remained practically unchanged ever since. </p>
      <p>"Opposed to these numerous and more ancient oriental cursive characters is the solitary roman letter model, structurally more severe and less graceful, seemingly less pliant, but actually more expressive. The roman letter is exactly typical of the ever-changing, ever-progressing occidental civilization; and probably the models of the characters by means of which the occidentals have been educated for centuries have had a stirring and beneficial psychological influence, which would have been lacking if Europe had adopted an alphabet purely cursive in its structure."</p></blockquote>
