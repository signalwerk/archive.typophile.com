      <p><em>Humanist typography is often referred to as Roman typography. I prefer the term Humanist, since it is much more true to the origins of it.</em></p>
      <p>Note that the use of the term 'roman' to refer to a style of type and typography references not classical Rome but the development of the first humanist types by Sweynheim and Pannartz at Subiaco, just outside Rome, and then within the city itself. The Subiaco types have been described as 'half-Roman', i.e. somewhere between blackletter and the contemporary humanist book hand. The types they made in Rome after 1467 are the first 'roman' types, and strongly influenced Jenson, who really established the style.</p>
      <p>So I'd say that 'humanist' and 'roman' are entirely synonymous in the context of typography: the one describes the cultural origin and the other the geographical origin.</p>
    html_clean: |-
