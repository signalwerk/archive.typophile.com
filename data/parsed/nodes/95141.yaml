    html: |-
      <p>Neither are the small letters, having already existed as uncial.</p>
      <p>But the writing system we use now has both small letters and capital letters, so it's not the one the Romans used - so the point raised is valid.</p>
      <p>However, I would agree that it is picky - the small letters also derived from Roman writing, if by a different path; it's not as if we're writing with twenty-six new symbols commissioned by Charlemagne.</p>
      <p>Of course, he <em>did</em> commission a brand-new alphabet of his own (with <em>twenty-four</em> characters), but that one was used as a cipher for secure communications.</p>
