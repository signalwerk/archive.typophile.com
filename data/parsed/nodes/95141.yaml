      <p>Since the Latin alphabet has but 26 letters, it is clearly much easier to design a new font for it than it is for Chinese, Japanese, or even Korean.</p>
      <p>Many other scripts, though, aren't <em>much</em> more complex than the Roman script; Thai, Tibetan, Devanagari, Burmese, Arabic, Hebrew, Armenian, Georgian, and Amharic, as examples.</p>
      <p>Here, "more widely used" is clearly <em>a</em> factor. But another factor, not noted in the list given above, is that the Latin alphabet, being used in the United States and Western Europe, <strong>is the alphabet of most of the world's richest countries</strong>.</p>
      <p>Thus, there is more money to spend on developing new typefaces for newspapers, magazines, books, and advertising than in most other places. Japan is also a wealthy country, but its script has many more glyphs, and Israel, Georgia, and Armenia belong to the developed world as well, but their scripts belong only to one small country in each case.</p>
      <p>Thus, if we confine ourselves to objective measures - the number of available typefaces, the economic importance of type design - the Latin alphabet is far ahead for obvious reasons. The objection that quantity is not quality can be made, however, and it's true that despite the handicaps noted, there are plenty of good typefaces available for many of the other script systems noted.</p>
      <p>The Cyrillic and Greek scripts, which I didn't give as examples above, are less widely used than the Roman script as well, but they're so closely related that a large number of typefaces are shared between all three writing systems.</p>
