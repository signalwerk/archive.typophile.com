      1. 1730's - Müteferrika, a polymath familiar with typography but most likely not an experienced printer himself, who was able to learn the basics of Arabic calligraphy (from experts) after his conversion to Islam, but he did not succeed in getting the aesthetics right. He only worked on naskh/nesih, which he managed to reproduce structurally correct, but not well shaped.<br>
      2. 1790's - Araboğlu, a famous Armenian printer, was ordered to work with Deli Osman. I am still studying the nature of his work, but clearly it was not the breakthrough. It is remarkable that, apart from naskh/nesih, he worked on (nas)ta`liq - one of the key scripts of the period.<br>
      3. 1860's - Mühendisoğlu, the dean of Armenian printers and creator of impressive (nas)ta`liq type, closely collaborated with the top calligrapher of his day, Mustafa Izzet Efendi on naskh/nesih. I do not know yet what the nature of their relationship and collaboration was. From the material in my possession it is visible that, though Mühendisoğlu cut all the necessary sorts for a perfect rendering of Islamic script structure, his mastery of the system was imperfect. He frequently uses correct forms in positions where they do not belong. Clearly it took an Islamic upbringing to master this writing system.</p>
      <p>None of them ever printed the Koran, but I do have a Lebanese printed Gospel dating from the 1890's in a Mühendisyan (derived?) typeface. </p>
      <p>The first typeset Koran was printed in Russia in the end of the 18th century probably by and/or for the Saint Petersburg Tatar Turkic community, with type imported from Germany that had all the typical European defects. The same type was still in use in Kazan (capital of Tatarstan) in the early 1990's. The same typographic style is used by Russian orientalists for Persian texts, notably the first volume of the two part Персидско-Русский Словарь by М.А. Гаффаров. It forms the basis of the persian flavour os simplified naskh, called kitabi.  </p>
      <p>The first typeset Koran in the Arabic world was printed in Egypt after the collapse of the Ottoman world, in 1924. Apparently, the Ottoman objections against inferior script architecture were dropped in favour of orthographic precision (tajweed), see:<br>
      <a href="http://dl.dropbox.com/u/9225177/Cairo_Koran_Orthographic_Rules_FINALoct2009.pdf" title="http://dl.dropbox.com/u/9225177/Cairo_Koran_Orthographic_Rules_FINALoct2009.pdf" class="link-external">http://dl.dropbox.com/u/9225177/Cairo_Koran_Orthographic_Rules_FINALoct2...</a><br>
      The typeface used for this Koran conforms dramatically better to Arabic script architecture than what is used by Dutch, German and French printers. It is claimed to be cut after the handwriting of the great Ottoman calligrapher Abdülaziz Efendi. However, while there is a visible relationship between Mühendisoğlu's nask/nesih and Mustafa Izzet Efendi's calligraphy, there is no such match between this typeface and the hand of Aziz. Moreover, e.g., a publication printed in Vienna (Theodor Nöldeke's Zur Grammatic des classischen Arabisch) in 1897 uses a very similar, Mühendisoğlu-inspired typeface - minus the necessary Islamic script architecture: like in Mühendisoğlu's case, all the shapes seem to be there, but, typical for Europeans, the awareness of the system was absent.</p>
