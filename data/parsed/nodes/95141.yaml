      <p>@froo:<br>
      <cite>We have them in Latin already: ž č š.</cite></p>
      <p>Yes, that's true; but presumably accented letters are confusing, and so each sound should have a separate letter all its own, rather than borrowing a letter for another sound just by putting an accent on it.</p>
      <p>Instead, to avoid what happens with Vietnamese, accents would be reserved for use as tone marks - so that the Latin alphabet would be fully suited for writing Chinese, which is what started me on this.</p>
      <p>Of course, when it comes to vowel sounds, on which I did not touch, wholesale borrowing from, say, Greek would be required in order to add extra vowels to the language. Maybe Armenian too!</p>
      <p>The idea being to have something like the Shaw alphabet, but composed entirely of conventional and pre-existing letters. And with a few extra letters for non-English sounds like the German U-umlaut (also used in Chinese!) and the Russian yerry (Ыы).</p>
