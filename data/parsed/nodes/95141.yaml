      <p>@froo:<br>
      You raise a good point. But I don't know how to address it.</p>
      <p>If I add letters to the Latin alphabet in order to represent additional sounds in a phonetic manner, one sound being assigned to one letter, then clearly <em>an</em> assignment of sounds to letters is being made.</p>
      <p>And, as you've pointed out, the pre-existing assignment of sounds to letters in different languages using the Latin alphabet differs. So, which letters to add and what sounds to assign to them would also differ.</p>
      <p>I suppose that this could work, though, if the speakers of different languages reviewed their requirements independently, with the result being that some added letters - like some existing letters, most notably W in French - would not be used in all Latin-alphabet languages.</p>
      <p>Note that I've tried to address <em>both</em> foreign-language transliteration and spelling reform; both areas have different needs, even if additional letters seeming to be useful is common to both.</p>
