      <p>Korean also has a three-way contrast between plosives (and even an affricate). They solve the issue nicely by just doubling the consonants. So the word for "lid", 뚜껑 [t͈uk͈əŋ] with tensed t and k, is transcribed "ttukkeong". With no need to borrow anything from Russian. </p>
      <p>Foreigners here in Korea have enough trouble figuring out the existing Romanization, and it's quite simple. I can't imagine if they tried to add entirely new letters. Not to mention that no one would be able to type "дuгeong".</p>
