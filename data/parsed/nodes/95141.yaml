      <p>The bicameral alphabet predates typography.</p>
      <p>And the innovations of employing contrast in layouts through mixing upright with italic (16th century) and different weights (regular with bold, 19th century) did not develop in the fraktur culture of northern Europe, which also used the Roman alphabet.</p>
      <p>So it is the Antiqua which has developed typographically, not the Roman alphabet (Latin script) per se.</p>
      <p>However, it could be argued that the Fraktur has developed more variety of letterform than the Antiqua, especially after perusing <em>Fraktur Mon Amour</em>. How much of this variety existed in fonts prior to the 20th century, or was it more of a script phenomenon?</p>
      <p>Latin script scripts are something else again, but their development has been primarily outside typography.</p>
