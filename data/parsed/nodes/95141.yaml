      <p>I wouldn't want to speak of the English alphabet, because that would imply the Germans and the French and the Italians obtained their writing systems from the English-speaking countries, which, of course, is nonsense.</p>
      <p>Even if we are responsible for the letters J and W. I'm not sure we are, and I'm quite certain U isn't a British invention, but instead originated on the Continent after the fall of Rome.</p>
      <p>EDIT: W might have originated from uu in English; U, however, was definitely a Continental invention from the Middle Ages, and J, according to Wikipedia, turned up first in German, then Italian, and then French before the English borrowed it from them.</p>
      <p>EDIT: It may also be noted that there is an urgent need to add the following letters to the Latin alphabet:</p>
      <p>Бб, Гг, Дд, and Зз</p>
      <p>...in order to replace b, g, d and z in Pinyin. In this way, the Latin alphabet will have b, б, and p as three distinct letters to properly represent the three consonants of this type in the Shanghai dialect, assigning the voiced one to English b, which it matches in sound.</p>
      <p>Of course, without worrying about Chinese, just to represent the sounds used in English, we need to add</p>
      <p>Жж, Чч, and Шш</p>
      <p>Θθ is also needed, but here, instead of going to the Greek alphabet, we could just go to Icelandic (and older forms of English) to get Þþ.</p>
