    <p>Hello everybody,</p>
    <p>Denedo is a font based in one of the impossible alphabets created by the Italian graphic designer Nedo Mion Ferrario during the 60's and 70's in Caracas, Venezuela, South America. As Maurits Cornelis Escher impossible shapes and optical ilusions, Denedo is a font impossibles to construct in three dimensions because it only exists as a drawing. The balance and incongruity of its forms is stressed in big sizes. All your comments will be very helpful.</p>
    <p>Thanks!</p>
    <p>--<br>
    Carlos Fabián Camargo G.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/denedo_cfcg_5005.gif"></div><p></p>
