      <p>Interesting concept, Carlos!<br>
      Congratulations! This is a cool project for a display font!</p>
      <p>Here's my modest opinions: </p>
      <p>I believe that there are some formal problems that attempt against the legibility in some signs: z, s, B, E, etc.<br>
      The font is close to be "rigid" because its letterforms were do without curvature. Perhaps it's interesting to combine curved and straight shapes for achieve "softening" in some glyphs.</p>
      <p>Perhaps the x-height could be bigger, to improve the legibility, i don't kwow.</p>
      <p>Best regards and keep working, you're doing good! :)</p>
      <p>elsebra<br>
      <a href="http://www.elsebra.com.ar" title="www.elsebra.com.ar">www.elsebra.com.ar</a></p>
