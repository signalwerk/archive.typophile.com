      <p>Hi,</p>
      <p>I'm really digging this font. As a fan of M.C. Escher, I always like to see how he has inspired others. I think this works well as a unique display typeface. How close is this to the original lettering of Ferrario? I would love to see some examples of his letters.</p>
      <p>It seems as though some of the lowercase letters are too intricate for the x-height (s,z) and appear crushed. Increasing the x-height would fix that, although I can see you'll have to modify the angles as well.</p>
      <p>And maybe this is an endearing trait, as many fonts like this have odd facets that make them unique. The spur on the top of the "1" looks a tad too long and it may be confused for a 7. </p>
      <p>Overall, though I think it looks great. I would love to see a version with curves instead of angles. You should also play with the width, a wide version could be cool. I would also like to see a fully filled in version with no slices through at all. </p>
      <p>Nice!</p>
