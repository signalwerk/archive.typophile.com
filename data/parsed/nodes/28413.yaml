      <p>Hello everyone,</p>
      <p>Matthew:</p>
      <p>M.C. Escher was a genius. I don't really know if he was Nedo's inspiration. I suppose it and that is why I think his impossible figures influence him. It is almost impossible to find information about Nedo's alphabet in the internet. Attached you will find a PNG file with the numbers of this font I am working on; based on that I am building the complete alphabet.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/denedonumbers_cfcg_5106.png"></div><p></p>
      <p>Regarding what you said about the lower case letters, you are right. The "s" and "z" are a little divorced. Number "1" and "7" have to be redesigned.</p>
      <p>Sergio:</p>
      <p>I will try to follow your advice. The work that is remaining is a lot.</p>
      <p>Hrant:</p>
      <p>What do you mean when you talked about being less literal and leave more to the reader imagination?  Do you think I am spending much time designing each letter details and not bearing in mind the global effect of the entire alphabet together?</p>
      <p>César:</p>
      <p>I think the 2 up and down thick sticks are used like a rail to guide the eye between all the optical effects shown. That is why I think they have to remain as they are, thicker than the vertical sticks.</p>
      <p>Thanks for all your time and comments!</p>
      <p>—<br>
      Carlos Fabián Camargo G.</p>
