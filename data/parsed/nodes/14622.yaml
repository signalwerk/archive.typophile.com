  html: |-
    <p>I recently came across an amazingly detailed 376 page manual of typography (Detail-Typografie by Friedrich Forssman and Ralf de Jong) – beautifully set and illustrated. But it’s in German! Does anyone know of a similar book in English?</p>
    <p>If you’re fluent in German, I hereby reccomend this one.</p>
    <p>Louise</p>
