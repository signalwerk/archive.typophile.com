    <p>Hey, this is a background of a current 4th year research project I am studying</p>
    <p>I have been researching into the term Democratisation of Information (accessibility of information to the general public). I came across thisterm as a result of an early interest in how western culture has become bombarded with information and how as a result of this it has become harder and harder to access accurate information. After thinking about the possibilities surrounding this term I came up with a selection of possible angles that proved to be somewhat inter-related with design, technology and information excess. They are,</p>
    <p>• Punctuation / language changes<br>
    • From page to screen (reading on screen vs. paper)<br>
    • Aesthetics, the loss of tactile qualities on screen<br>
    • Accessibility and value of design</p>
    <p>I began experiencing a significant amount of trouble narrowing this topic down, due<br>
    of it's broad nature. So to progress I began to think about this situation from a different angle. Instead of focusing on the technological ramifications I decided to think about the implications that uncertainty is having on people. I am thinking about how western society has become terrorized by fear, whether concerning national security, road safety, protection of public health, natural disasters, etc. and how "every form of risk is ever-present, contagious, and needs to be accounted for or immediately eradicated". From here I have begun to think about how "safety and security obsessions are leaving behind ever-more-visible traces, especially in public spaces, in the form of smoke-free zones, surveillance cameras" etc. With the information I am gathering I intend to interpret fear and space through typographic exploration.</p>
    <p>If anyone has any comments to make on possible angles for this, it would be much appreciated.</p>
