      <p>I'm with Nick Shinn on this one: if you think western society has become terrorized by fear, how does it compare to the threat of nuclear annihilation during the Cold War?  What about xenophobic reactions to Irish, German, Japanese, Russian, Central European, Mexican immigrants, among countless others?  If it has become harder to access accurate information, what about pre-internet days?  What about pre-telecommunication days?  Certainly the Hearst publishing empire didn't operate by accurate, dispassionate journalism.  </p>
      <p>I think you have some strong assumptions at the heart of your project, and I'm not saying that they're wrong, just that they need to be identified and examined as you find the direction your project will take.</p>
      <p>Also, would it be possible for you to elaborate a bit more on your bullet points above?  I'm not quite sure what they mean in this context.</p>
      <p>--Jim K.</p>
