      <p>Dennis, you should know by now that bringing out the phrase "moral relativism" when it has no bearing on the conversation is a one-way ticket to a flame war.</p>
      <p>Fear and uncertainty in typographic form? How about interstitial texts, subliminal messages... How about type that could be read to mean two different things, one innocuous and one malevolent?</p>
      <p>About information overload: you might be interested in Borges's short story<em>Library of Babel</em> or (a longer, much more confusing read) Jeff Noon's <em>Falling out of Cars</em>. Both really interesting interpretations of the idea of a signal buried by noise.</p>
