      <p>If you're talking about history, ie comparing how things are now to how things were, don't be too short sighted. You can make a more meaningful analysis is you study a longer historical period: more time, more changes.</p>
      <p>Information is not less accurate now than ... when? Consider how patent medicines (eg Cure for Cancer etc.) used to be advertised c.1900. First, some magazines stopped accepting ads for them, then they were legally prohibited. Was fear of death, particularly infant mortality, any more palpable in those days, when it was more likely than today? How could it be, given that people adapt to the norm?</p>
      <p>It's very easy to deal in generalizations, but all you're doing is gossiping. A tightly focused typography study would give you the chance to get specific, and see whether this idea of "bombarded with information" holds any water. </p>
      <p>I think it's a myth, and that corporate concentration, narrowcasting and tightly focued demographic marketing lessen the amount of information people receive. But if you are going to study the idea, surely you would have to do some kind of statistical comparison of (a) then and now? Or else you will just end up recycling the usual cliches, which is bombarding your professors with familiar information.</p>
