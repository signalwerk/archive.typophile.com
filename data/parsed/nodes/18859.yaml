      <p>Fear and uncertainty in these United States tend to be handled in different ways by different groups. Those with "religious" inclinations tend to retreat deeper into dogma, because all Western religions claim to be in possession of absolute truth and describe a <em>temenos</em> where the elect may collectively ward off the fear. This trend is evidenced by the growing influence of right-wing Christian groups in the political arena.</p>
      <p>A great many of those who walk no dogma simply ignore--or, at least, attempt to ignore--the fear and uncertainty, and retreat into their own little worlds, a task that has been made far easier by the increasing availability of portable electronic devices. Look in any public place and you will find cell-phone performance artists, Blackberry or Palm Pilot junkies, or iPod <em>isolatos</em>--all intensely wrapped up in their own personal little worlds, and increasingly oblivious to the presence (and rights and needs) of others.</p>
      <p>Both responses contribute to the dissolution of the social fabric: the pious by drawing lines between the saved and the damned, and the clueless by being, well, clueless.</p>
      <p>How do you interpret this typographically? I'm not sure, but it looks like we're in deep Dada to me...</p>
