      <p>The extra sad and scary things is though that increasingly, the poor don't know it.</p>
      <p>Democracy now acts as a veil that causes the oppressed to think they deserve what they're getting, and since people naturally tend to think better-than-average of themselves they <cite>must</cite> feel that things are going well, overall. It's very hard to blame one's-self, especially for something abstract like the refusal to accept that one is not capable of participating in decisions of state.</p>
      <p>If we accept that we are limited, we become less oppressed. We are told to daydream about our personal potential, that "anything is possible if you put your mind to it", that "we deserve it", that a single person can change everything, for the simple reason that such a mindframe makes us much better peons in the end.</p>
