    <p>Hey guys,</p>
    <p>I am checking my font in various applications and I think I hit a roadblock. I was rendering my font at 2 point sizes—12pt and 20 pt and I was comparing it with two other fonts Arial and Calibri.<br>
    At 12 pt:<br>
    My font appears unevenly spaced and and jagged. It looks dark when compared to the other two. The characters like w, v and bowls of o,q appear thicker than what they are supposed to appear. Is this because my font is not hinted?<br>
    At 20 pt:<br>
    My font looks okay and still there are some spacing issues(i am going to rectify them) but now it is lighter than the remaining two. Since I felt the bowls of q, o etc. and other characters(v w) were darker at 12 pt, I reduced the thickness of them and now they appear lighter at 20 pt. Am I missing anything here? </p>
    <p>Thanks<br>
    Typogruffer</p>
