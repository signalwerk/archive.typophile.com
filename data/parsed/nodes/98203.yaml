    html: <p>As gargoyle mentioned, TrueType hints offer greater control than Type1 hints, and this is particularly noticeable at small sizes. No matter how good your hints are, they aren't going to stand up to a manually (well) hinted TrueType font at smaller sizes. Some of these fonts have literally man-years put into hinting them.</p>
