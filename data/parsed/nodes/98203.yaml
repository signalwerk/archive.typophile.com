      <p>The format also has some effect—  many Windows apps use an older rendering engine for PostScript-based fonts, which generates grayscale rather than subpixel shading.</p>
      <p>With hinting, you're really talking pixel size or pixels-per-em (ppem) rather than point size. It's hard to compare the PDF sample since the pixel size is quite a bit larger than in Word (maybe it was zoomed?).</p>
