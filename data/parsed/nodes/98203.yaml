    html: |-
      <blockquote><p>So that problem is because the font is unhinted?</p></blockquote>
      <p>The problem with the appearance of the font at small sizes in Microsoft Word is likely because (1) it is unhinted and (2) the fonts to which you're comparing it have been extensively hinted in TrueType format, which provides far greater control than PostScript hinting and uses a different rasterizer. Office 2013 will use the newer DirectWrite engine, which provides improved subpixel rendering for both formats.</p>
    html_clean: |-
