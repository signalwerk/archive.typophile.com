    html: |-
      <p>I assuming you're looking at this as a ttf in a windows environment. Although which version of Windows would be helpful. </p>
      <p>Arial is hinted as low as 7ppm, while Calibri is hinted down to 9ppm (I believe). They're also hinted in VTT (using a lot of time and effort), where the diagonals can be controlled better than is possible using FL hinting. </p>
      <p>Jason C</p>
