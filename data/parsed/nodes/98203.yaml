    html: |-
      <blockquote><p>i can safely conclude that automatic tyoe1 hints are bad, right?</p></blockquote>
      <p>It depends on the font, but it's certainly true that automatic hinting at the time of generation — in either format — can often result in poorer, more irregular rendering than even a completely unhinted font. Better results may be achieved by autohinting the font before generation, possibly tweaking some of the options and values under Hinting Settings in Font Info, and inspecting/revising the hints before generating the final font.</p>
      <p>For FontLab-specific instructions on optimizing the process, see Adam Twardoch's <a class="freelinking external" href="http://docs.google.com/document/preview?id=1llTpJsbt2ENbWvMgkGAa90EVfFnTP3Womha3IEumy24&amp;pli=1" rel="nofollow">Autohinting guide</a>. For a better handle on basic hinting concepts such as alignment zones and standard stems, Miguel Sousa's <a class="freelinking external" href="http://vimeo.com/38364880" rel="nofollow">presentation on PostScript hints</a> provides a nice visual intro.</p>
