      <p>Thanks very much guys! </p>
      <p>Yeah, I'm paranoid too, I lock up everything that goes out externally and set printing to high res and changes to none etc. Eben thanks, making outlines is a good kind of failsafe, but it just does seem to bloat the files out to what seems like unreasonable sizes, also (less of a problem) some desktop printers seem to render outlined text a bit thicker. </p>
      <p>Thanks Dan, I appreciate you're on a break! Enjoy. I have contacted Monotype and Linotype in the past. What struck me was the great difference in my understanding from the legalese of the EULA and what they told me was OK. I was pleasantly relieved.</p>
      <p>Thanks for all your help people. To be honest it feels very strange to be agonising over the details of law which affects most people but which most people would never consider for a second. It feels strangely like obsessive behaviour and as is the case with obsessive behaviours, a bit alienating also. This is simply a personal observation and not intended as a backhanded rebuke of EULAs.</p>
