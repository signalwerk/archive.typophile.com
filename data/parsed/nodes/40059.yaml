    html: <p>I think that no matter what the EULA may or may not say that if you do graphic design for a living &amp; you have licensed a font you can create with the use of Outlines ( if embedding is not permitted) a PDF that may be sold as a finished product to the client. This is how for instance books are made. And Magazines. Somebody designs them ( maybe in house at the publisher's or not) and then they printed and sold. Now if you made a template that they could fill out with new content - say a book layout that could be customized or a Menu with a certain style and font ( add the dishes &amp; prices ) and they resold that.... That's different. So - would that be a problem? Yes, but <cite>only</cite> if they don't have a font license. Or that's my understanding. I should add that it is an understanding I would not hesitate to act on.</p>
