      <p>No. You may give your client a PDF. That is within the standard EULA and is fair use. AFAIK Your client can also give away that PDF to clients of his. I do not recall their EULA saying anything about needing extended licensing for that. </p>
      <p>They say: <em>1.5 Embedding of the Font Software into electronic documents or Internet pages is only permitted under the absolute assurance that the recipient cannot use the Font Software to edit or create a new document (read-only). It must be ensured that the Font Software cannot be fully or partially extracted from said documents.</em></p>
      <p>There is no mention of not giving your client a PDF that they will in turn use to give to their clients. </p>
      <p>I'm paranoid. What I would do is set the preferences in the PDF to no allowance for Changing the document, assembly of the document, content copying, page extraction, commenting, etc. Do you have Acrobat Pro?</p>
