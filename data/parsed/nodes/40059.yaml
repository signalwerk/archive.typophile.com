      <p>My understanding is that if the client has licensed the font they can use it in print in PDFs etc. A 'commercial product' would be something that makes letters or makes use of them - like a machine metal type - or cloth or paper letters - or an automatic engraving tool. Also a phone, or computer or ebook reader would be making use of the font in the same way. So Commercial product would be something that isn't using the font once ( like a newspaper) but is insteading using the font in an ongoing generative manner. </p>
      <p>Of course some fonts are not supposed to be embedded in a PDF - just outlines is okay (but won't render as well or as quickly).</p>
      <p>Other folk? What do you say?</p>
