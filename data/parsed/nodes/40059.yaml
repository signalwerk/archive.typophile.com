    <p>G'day guys, merry Christmas,</p>
    <p>Something's been bugging me for a while EULA-wise and I haven't found anything quite explicit enough on Typophile to answer my question, so forgive me if it's been covered in depth before. </p>
    <p>My current understanding of 'commercial product' is that it is something which keeps on generating revenue every time it's sold, like an ebook or magazine. Am I right to assume that a set of information leaflets which I sell to a client on PDF, for which he pays me, but which he is going to distribute free is not a 'commercial product'? What is the protocol here? Do I warn him of the licensing obligations the fonts carry and that these pdfs are not to be sold? What if he sells them in the future (not likely but concievable) am I liable? </p>
    <p>One more question, if I am paid to make electronic advertising brochures which market a product or service but which are distributed freely, is this now a commercial product?<br>
    blah, blah blah EULA EULA EULA, I know, I know, but it's just been bugging me<br>
    cheers and thanks</p>
    <p>--N</p>
