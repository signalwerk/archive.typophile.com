      <p>If the EULA allows beyond internal business embedding, and if the EULA doesn't have some kind of limit set to how many impressions can be made, and if the EULA allows for online distribution, then you client can share that PDF without needing an extended license. </p>
      <p>You are correct though that if you were creating a PDF which your client would then turn around and sell in some way, some EULA regard that as a Commercial Product. However, some EULAs also regard rubber stamps, alphabet stickers, etc. as a Commercial Product. </p>
      <p>Which foundry's EULA are your trying to decode?</p>
