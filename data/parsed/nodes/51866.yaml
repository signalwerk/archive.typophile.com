      <p>Wow, this looks incredibly a lot like a sign I hand lettered for the school that I work in and I was thinking about how it'd look nice as a font.  You beat me to it haha </p>
      <p>Anyways, the flat descenders and ascenders I really like.  I wonder if you might be able to pull out the j and the f and make them a bit longer, same for the p and the q.  The almost mechanical look is what gives it its character, play with it some more.  Also you might try making the serif a bit smaller on the b or the d (or both).  Because they almost connect with the bowl, the serifs look much heavier.  It doesn't seem to be a problem for the r, probably because of it's more horizontal approach to the stem.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
