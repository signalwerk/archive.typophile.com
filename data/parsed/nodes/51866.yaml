    html: <p>The h, k, n, t, u need to be a little wider. check the optical weights of the horizontal vs. vertical strokes (e.g. the descending stem of the g and the left of the bowl are not similar enough. It seems to have great potential. I can see a fantastic display version as well as a functional text version.</p>
