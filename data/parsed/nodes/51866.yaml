    <p>Hey all,</p>
    <p>I'm a design student taking my first serious stab at type design.<br>
    This is hard work and I'm getting a little overwrought. I thought I'd take<br>
    a break and post what I've got so far on the "chopping block" as it were.</p>
    <p>I know there are big issues with the face so far, but, let's talk about<br>
    'em and how I can improve the set. I have only developed what you see<br>
    here so far. I am trying for a humanist face <em> LOOSELY </em> rooted in Gill Sans.<br>
    The principle design elements are the curved slab serifs and the stroke<br>
    taper at the connections.</p>
    <p>Say what you will; let's get these letters into shape!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/baby_face_5377.png"></div><p></p>
    <p>Thanks,<br>
    Rachel</p>
