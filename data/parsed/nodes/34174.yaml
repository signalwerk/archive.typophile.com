    <p><strong>Mid to Senior Flash Developer (Flash, Flex, Flash Lite)</strong></p>
    <p>Punchcut is growing our Flash team to support ongoing demand for FlashCast, Flex and Flash Lite opportunities to create desktop, rich web and device interfaces (portable media players, mobile phones). This is a full-time, permanent position for mid to senior-level Flash developers, to start immediately.</p>
    <p>This is primarily a development position, but qualified visual designers with the required Flash skills will be strongly considered.</p>
    <p>The developer should have a strong understanding of Flash development best practices, ActionScript 2.0 for web is required (AS 2.0 and 3.0 for Flash Lite are plusses). The candidate should be equally comfortable working both independently and alongside other dev team members. The ideal candidate has 5 years of experience developing web and mobile or device interface products and/or services and thrives in a fast-paced, creative, agency environment.</p>
    <p><strong>// Responsibilities</strong></p>
    <p>Work with multi-disciplinary teams to represent development perspectives during the design process</p>
    <p>Meet with clients to understand client technical requirements, present Punchcut’s development perspectives and propose development solutions and approaches</p>
    <p>Understand web and mobile user interface standards</p>
    <p>Develop web-based Flash and Flex interfaces and applications</p>
    <p>Develop mobile and device related Flash Lite interfaces</p>
    <p>Support collaborative teams by creating Flash and Flash Lite prototypes of interaction models</p>
    <p>Write development specifications and guidelines for client delivery</p>
    <p>Work with a multi-disciplinary team to evaluate the technical feasibility of proposed solutions</p>
    <p><strong>// Required Qualifications</strong></p>
    <p>5+ years developing interfaces for web and/or mobile sites or applications</p>
    <p>Principled adherence to object oriented development practices and versioning</p>
    <p>Undergraduate degree in relevant field and/or equivalent work experience</p>
    <p>Solid understanding of the user-centered design process</p>
    <p>Ability to communicate technical concepts and development rationale to non-developers and clients</p>
    <p>Willingness to learn new languages and platforms (Flex, FlashCast, XHTML, uiOne, etc.)</p>
    <p>Focused attention to detail</p>
    <p>Sense of humor and positive, flexible attitude</p>
    <p>Ability to multi-task and work on or oversee multiple small-to-mid sized projects in parallel</p>
    <p>Strong interpersonal communication and problem-solving skills</p>
    <p>Design firm or agency experience a strong plus</p>
    <p>This position is located in San Francisco. Only candidates with proper permits to work in the United States can be considered. Punchcut is an Equal Opportunity Employer.</p>
    <p><strong>ABOUT PUNCHCUT</strong></p>
    <p>Punchcut is a user interface design company specializing in improving users’ experiences with mobile devices. We provide strategy, design, and development services — from user research to the complete design and development of custom interfaces and applications. Our clients span the wireless industry, including operators, device manufacturers, application developers, and leading entertainment brands. Our clients partner with us to create solutions that engage customers, streamline transactions, and enhance mobile user experiences.</p>
    <p>Interested candidates should email a resume and URL with work samples to work [ at ] punchcut.com.</p>
