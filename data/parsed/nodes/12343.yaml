    <p>Hi Typophilers,</p>
    <p>This is a typeface I've been working on for over 2 years now. I want to round it up and put it on my website which will be ready in some days.<br>
    For my site I'm looking for an image or styling that could go with it. For all my other fonts I have made designs that fit to the font. Have a look here at some examples (see 'related links'):<br>
    <a href="http://www.myfonts.com/fonts/characters/accelerator/" title="http://www.myfonts.com/fonts/characters/accelerator/">http://www.myfonts.com/fonts/characters/accelerator/</a><br>
    <a href="http://www.myfonts.com/fonts/characters/shell-shock/" title="http://www.myfonts.com/fonts/characters/shell-shock/">http://www.myfonts.com/fonts/characters/shell-shock/</a></p>
    <p>But for FatBoy I can't seem to find a good image to accompany it. Is there anyone that has a tip for me?</p>
    <p>If you have any other crits regarding the font, please shoot. </p>
    <p>Thanx,<br>
    ®ené</p>
