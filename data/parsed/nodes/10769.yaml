    html: <p>Vielen Dank Andreas! <br> <br>Gerhard Helzel is indeed The Real Thing. As far as outline quality goes, Helzel, FVL and Delbanco all have clean, top-notch outlines on par with Adobe or Linotype. <br> <br>Dieter Steffmann's outlines aren't quite as accurate, but he disclaims this up front and has a few designs unavailable elsewhere, particularly his lovely Wieynck fonts. As free fonts go, Steffmann does some decent work in terms of quality. <br> <br>The problem with many of these German blackletter fonts is the different character encoding standards and compromises one has to deal with. Character placement is inconsistent across vendors. Linotype, Monotype and Adobe are good about sticking to their Dfr standard, but Dfr does not always cover all the ligatures and special characters that some of the smaller foundries supply. I hope to make some proposals to remedy this eventually... more on that to come. <br> <br>I bought a few fonts from FVL in the past. Next on my list are several of Helzel's offerings--he can expect a large order from me in the coming weeks.</p>
