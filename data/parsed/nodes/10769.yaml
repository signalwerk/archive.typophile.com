    html: <p>Its not a foundry - its a painter who sells fonts. I take a closer look into the pdf cataloge - and the faces look very well shaped.  <br> <br>As you can see on the font proofs - he never had a feeling for type! - Do you believe this man has all types digitized by himself, drawing by hand?  <br> <br>He is not older than 40! Over 210 types made round about 11 type faces every year since his 20 birthday. Unbelievable - an anonymous genius.  <br> <br><a href="http://www.romana-hamburg.de/Schriftmappe.zip" target="_blank">http://www.romana-hamburg.de/Schriftmappe.zip</a> <br> <br>But maybe I`m totally wrong. <br> <br></p>
