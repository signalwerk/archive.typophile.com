  html: '<p>Hi <br> <br>In my effort to ID a BlackLetter face, I discovered <a href="http://www.romana-hamburg.de" target="_blank">www.romana-hamburg.de</a>. Amazing resource but somewhat chaotic. 2 questions: <br> <br>1. Is this an actual type foundry with typefaces for sale or more of an academic compilation of faces? <br> <br>2. Are there any other unique BlackLetter resources [small foundries, sites] out there that fans of BL faces should know about? <br> <br>Thanks!</p>'
