    <p>There are a lot of these, aren’t there? Certainly many one can learn at design school, but some only through experience. A dear friend of mine regularly violates the following:</p>
    <ol>
    <li>Do not include specific religious symbols unless the business or product has a specifically religious nature or clientele.
    </li><li>Do not include photos of hot chicks, unless the product is intended for use by, or are in themselves, hot chicks, or you intend to imply the customer’s enhanced sexual attraction by association with the product.
    </li><li>It is not necessary to display all the products in the business’s catalog on the first page of the ad.
    </li></ol>
    <p>I swear If I see one more ad for industrial water pumps with a Jesus fish and three bikini clad babes amongst hundreds of tiny pumps, with the copy lettered in Comic Sans and five other fonts, I think I might stab something.</p>
    <p>Are there any other rules you would add to the list?</p>
