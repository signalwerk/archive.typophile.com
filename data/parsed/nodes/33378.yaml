    html: <p>Never underestimate the number of goobers in this country who can be won over by low-class advertising. If Head-On taught me anything, it’s that a commercial need not be slick, expensive, or well-produced, it just needs to get attention. When one’s target audience chews tobacco, watches Nascar, and reads Hustler just make an ad with a hot chick, an American flag, and the phrase ”God Bless America.” Then promptly cash the check and move on. Good design need not be pretty if something quick and dirty can get the job done.</p>
