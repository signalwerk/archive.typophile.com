    <p>Over the last year, I have received many requests asking if I plan to expand on Contax Pro.</p>
    <p>Well, I'm happy to release today, Contax Sans, a new geometric sans family of fonts based on my original design of Contax grotesque.</p>
    <p>Similar yet different. A more delicate and elegant interpretation, with subtle detail in terminals and with thick and thin stem variations reminiscent of Hermann Zapf's "Optima" family of fonts. I hope you like it.</p>
    <p>In order to make my fonts more affordable, I offer the regular and italic free, and I have decided to cut my prices in half going forward.</p>
    <p>You can go to the links below to view and download your free fonts.</p>
    <p><a href="http://new.myfonts.com/fonts/typeinnovations/contax-sans/" title="http://new.myfonts.com/fonts/typeinnovations/contax-sans/">http://new.myfonts.com/fonts/typeinnovations/contax-sans/</a></p>
    <p>There is also a promotion for 50% Off on my Contax Pro family of fonts, during the holidays, till January 7th.</p>
    <p><a href="http://new.myfonts.com/fonts/typeinnovations/contax-pro/" title="http://new.myfonts.com/fonts/typeinnovations/contax-pro/">http://new.myfonts.com/fonts/typeinnovations/contax-pro/</a></p>
    <p>Thank you &amp; have a happy holiday.</p>
