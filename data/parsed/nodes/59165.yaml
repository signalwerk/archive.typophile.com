    html: |-
      <p>Thanks for evreryone's responses... all good fonts.<br>
      Upon further reflection, Lineto's Lettera is certainly something id consider as its 'Restrained character' is coupled with a strong contemporary feel... certainly something im after. I do also like Everson Mono (freeware: <a href="http://www.evertype.com/emono/" title="http://www.evertype.com/emono/">http://www.evertype.com/emono/</a> ) and maybe i can use this as a starting point to create something similar. Hm.</p>
      <p>Altaira, i like you're font, i think it fits the restrained character description for sure... certainly something id consider if/when it becomes available. </p>
      <p>Thanks everyone, anymore then keep them coming...</p>
