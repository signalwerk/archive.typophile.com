    <p>Can anyone recommend some alternatives to American Typewriter, Courier, Prestige, Archer and other such fonts? Im looking for something with character, but equally it shouldn't be too fun. Im after 'Restrained character' - you heard it here first.<br>
    Please pass on any links to fonts you like in a similar vein to those listed above.</p>
    <p>Thanks :)</p>
