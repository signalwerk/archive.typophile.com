  html: |-
    <p>It’s more rational than Helvetica or DIN, but also more friendly. A stricktly neutral international typeface for everyone.</p>
    <p>It’s accessable and open and it reads well. It comes standard with small caps, old style numbers, table numbers, ligatures, alternative glyphs for a, e, g and E, arrows in all directions and last but not least: Central European Language support.</p>
    <p>For some reason I don’t seem to be able to upload images to Typophile right now so here’s a link to a PDF:</p>
    <p><a href="http://www.alexscholing.nl/images2/CoreHumanistSans_specimen.pdf" title="http://www.alexscholing.nl/images2/CoreHumanistSans_specimen.pdf">http://www.alexscholing.nl/images2/CoreHumanistSans_specimen.pdf</a></p>
    <p>You can download CoreHumanistSans for free at <a href="http://www.alexscholing.nl" title="http://www.alexscholing.nl">http://www.alexscholing.nl</a></p>
    <p>Hope you like it.<br>
    Cheers, Alex</p>
