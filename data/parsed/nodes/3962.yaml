    html: <p> "Typology" is a good book for a quick visual coverage on the history of type. I find that I use it more for inspirational and less for historical purposes. --- In fact, all of the books by Stephen Heller and Louise Fili are useful for this purpose. --- Used in conjunction with books that are more academic they can serve as very useful for visual reference. </p>
