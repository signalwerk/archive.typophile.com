    html: <p> Guilherme, "neoclassicismo" can be translated as "neoclassicism". <br>Not so different. But beware! Followers of R. Bringhurst <br>(there must be quite a few around here) don't think Didot is <br>a neoclassical face, they call it "Romantic"... <br> <br>Regarding Linotype Didot specifically, there was a nice article <br>in TM a few years ago that, IIRC, offered a background on <br>the historic period of the original face, the Napoleonic wars <br>etc. I don't remember if it was written by Frutiger himself <br>(I think so) - my memory of it is dim, but I could send you a <br>xerox copy (pelo correio) if you wish. I'm in Rio. (The article is <br>in French in fact. It was published in the French-language <br>section of TM (RSI)) </p>
