      <p>Thanks for the feedback and link! I knew this was a hand painted sign but I guess I just figured there may be a specimen or alphabet it was based off of floating around somewhere.<br>
         I have actually created a font based on this sign using the existing glyphs while attempting to emulate the style of the original artist. I always wonder how the sign painter would have developed the rest of an alphabet...kind of feels like a puzzle with missing pieces. Anyways, I will post my interpretation here soon.</p>
