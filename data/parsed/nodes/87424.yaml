  html: |-
    <p>If anyone understands the logic behind making the width of the exclamation mark in Adobe Garamond (not Premier Pro) smaller than the width of the period, enlighten me! This obviously leads to the spacing to the following character being smaller after an exclamation mark than after a period. Rather annoying in my book. I have observed the same phenomenon with Slimbach's Utopia typeface.</p>
    <p>Mats</p>
