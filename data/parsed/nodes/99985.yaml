    <p>My new typeface, "Columbia Titling", is now on sale at MyFonts and for a limited time is just $8 for four weights!</p>
    <p>Columbia Titling is an titling-caps display family based on wide Clarendon-style wood type and industrial signage design from the late-19th and early-20th Century. It includes a small set of OpenType features, including both tabular and proportional figures, special superscript ordinal suffixes, underlined superscript alternate letters, and OpenType fractions. The typeface takes its name from the historic S.S. Columbia, a steamboat launched in 1903. Though not a true reproduction, the wide, slab serif letterforms on the front of the Columbia's wheelhouse provided some inspiration for to develop this typeface. Enjoy!</p>
    <p><a href="http://www.myfonts.com/fonts/typetanic-fonts/columbia-titling/" title="http://www.myfonts.com/fonts/typetanic-fonts/columbia-titling/">http://www.myfonts.com/fonts/typetanic-fonts/columbia-titling/</a></p>
