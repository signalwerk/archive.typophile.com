    date_raw: 27 Feb 2013 — 10:25pm
    votes: null
    html: |-
      <p>Thanks for the comments, everyone!</p>
      <p>In regards to pricing, Nick is correct — bargain sale prices are essentially a form of advertising. Plus, if there's the possibility of selling more typefaces at a lower price, the revenue stream stays the same — i.e. selling 20 licenses for $8 versus selling 4 licenses for $40. In a field growing as quickly as type design, it's good for a young foundry that might otherwise struggle to get noticed.</p>
      <p>And this idea is nothing new — several foundries post their fonts for 50, 75, even 90% off on first release for this reason.</p>
