  - id: 545066
    user: 2021
    date: 2013-02-28T10:07:00
    date_raw: 28 Feb 2013 — 10:07am
    votes: null
    html: |-
      <p><em>Does this extra-work ever pay-off?</em></p>
      <p>As a designer/foundry, one does develop a clientele of repeat customers attuned to one’s work.<br>
      Hopefully they study the PDF (and occasional printed) specimens we provide, and become familiar with the sophistication of the OpenType features at their disposal, and why we put them in the fonts.</p>
      <p>This is particularly relevant for ﬁgures.<br>
      You can’t do ﬁne typography without discriminating between the many different styles of ﬁgure available in an OpenType font, and it would be absurd to put these all in different fonts.</p>
      <p>The question is, are those discriminating typographers my potential customers?<br>
      I’d like to think so!</p>
