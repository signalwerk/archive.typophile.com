    html: <p>I thought about it, though I preferred they be used sparingly and for only very specific purposes (ordinal suffixes, surname prefixes — e.g. Mc-, Mac-, Di- — etc.). In making them lowercase I thought I might be unintentionally inviting their use as a full lowercase, which I didn't intend.</p>
