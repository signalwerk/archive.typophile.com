      <p><em>…not all programs can access those OpenType superior features…</em></p>
      <p>And in the ones that can, they are buried beneath several clicks, drags and/or popup menus.</p>
      <p>In fact, in InDesign, for instance, when the user goes digging, the ﬁrst “Supescript” is faux, and the OpenType real deal is a level deeper. Aaaagh!</p>
      <p>Alternates are actually more easily accessible as separate fonts, because the font ﬁeld is clearly on view in the top level of all layout applications.</p>
      <p>I don’t know why I’ve been making these all-in-one OpenType fonts for so long, other than to impress myself with how clever I am.</p>
