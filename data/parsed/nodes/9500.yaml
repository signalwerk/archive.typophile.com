    <p>Bruno Maag posted to the NEWS &amp; EVENTS area the following: <br> <br>--------- <br>I will be appearing on Tyler Brule's program 'The Desk' on BBC Four, tonight, Tuesday 1st March, discussing the merits of the Olympic bid logos. The program starts at 10.30pm UK time. More info can be found on <a href="https://web.archive.org/web/20081120003010/http://www.bbc.co.uk/bbcfour/" target="_blank">http://www.bbc.co.uk/bbcfour/</a> <br> <br>Bruno Maag <br>Dalton Maag Ltd <br>--------- <br> <br>Perhaps you can still get it online. Apologies for this grievous error.</p>
