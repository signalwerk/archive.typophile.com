      <p>I know Aziz is an enemy of Unicode but I am not.<br>
      These tools are very useful as graphic tools. They manage to produce text in a very complex visual styles. But the text produced by these tools have no portability. The fonts are encoded for the application functionality and are not at all Unicode compliant.<br>
      I have not tried these because they don't work on my Mac. But I viewed some of their work and they are quite impressive.<br>
      But I personally wait for Tom Milo to popularize his engine so that we could produce Arabic text as pleasant but Unicode compliant.<br>
      The Persian page essentially has the same approach as the English page. They have a variety of tools and variety of fonts, including fonts that are encoded in a way to be used with Applications that don't support rtl.<br>
      I am a very Unicode guy and very much against these kind of workaround.<br>
      However, until Tom makes the move, there is an OpenType Unicode Persian Nasta'liq font in beta version -very buggy- which worth to look at because as far as the character design goes, it is wonderful. Before you encounter a bug, you can see how beautiful this font can be.<br><a href="http://www.scict.ir/Portal/File/ShowFile.aspx?ID=bea5ca36-1fdf-41d4-8818-c1a4f9c71081">http://www.scict.ir/Portal/File/ShowFile.aspx?ID=bea5ca36-1fdf-41d4-8818...</a></p>
