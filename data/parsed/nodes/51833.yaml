      <p>Aziz<br>
      &gt;&gt;The Unicoded OTF Nasta’liq (re)developed by MaryamSoft.com will silence All</p>
      <p>Well, I hope not the Iranian taxpayers! But you most probably are right!</p>
      <p>But my main concern about this complex fonts is somewhere else. They are just too complex to be made.<br>
      As a user, if I don't like the shape of A in Times, I choose Arial, Helvetica something else and if none of them is satisfactory, somewhere someone will be able to produce a font with an A shaped to my satisfaction. The effort involved is comparatively minimal.<br>
      As a user, I will have exactly the same approach to a Nasta'liq font or a complex Naskh font. If I see a dot not positioned to my liking, I simply won't use the font, oblivious to the fact that how much effort was involved in producing such font.</p>
      <p>So to me, the issue is not simply the fisabilty. It can be done with GPOS. It is whether the effort involved is reasonalbe or not. This is the issue that I'm hoping Tom Milo's engine answer. Arabic font making should be technically reasonabley easy, so that the real designers don't sink in the complexity of the task. Otherwise, why not sticking with GPOS of OpenType and screw the designers as usual?!</p>
