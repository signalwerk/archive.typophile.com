      <p>This font face has a very complex and - so far - sad story.<br>
      It was originated in one of those special 'graphic' tools that Aziz mentioned. The character design is by one of the masters of the field, although I saw his name somewhere a while back, but now I can't find a trace of it anywhere. This may be a part of the story of the conflict that has been aparently developped around the development of the Unicode version of this font face.<br>
      It was commissioned by the Islamic regim of Iran. The government English site has no information about this project.<br><a href="http://www.scict.ir/Portal/Home/Default.aspx?CategoryID=3245b8ee-53dd-44ec-a3bb-1a264fea36a2">http://www.scict.ir/Portal/Home/Default.aspx?CategoryID=3245b8ee-53dd-44...</a><br>
      The Persian site has a little. It was first budgeted for 190 M Rls and what you see is the result of that commission! Now the developper is asking for more to fix the bugs and apparently 70 M Rls is approved or in the process of approval. This is mainly a technical side conflict. The original designer is faded in the turmoil, as it always happens with Arabic fonts. I am told the bug free version was already prepared when the developper delivered this to the government!<br>
      This is the government Persian page, announcing this font:<br><a href="http://www.scict.ir/Portal/Home/ShowPage.aspx?Object=News&amp;CategoryID=72ec3b79-8eb2-40bf-8308-4888712e594a&amp;LayoutID=44f4f30f-84f9-48ff-a3a6-7c5be4da31c4&amp;ID=f2bccb28-f5ec-4457-a2eb-f5346f016c07">http://www.scict.ir/Portal/Home/ShowPage.aspx?Object=News&amp;CategoryID=72e...</a><br>
      And it is all written with Tahoma!</p>
