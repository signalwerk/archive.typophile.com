      <p>The name of the display type used was “Othello” as listed in Dan Solo’s catalog under <em>Unusual Sans Serifs</em>.</p>
      <p>(Note: This is not the “<a href="https://web.archive.org/web/20081007114606/http://www.fonts.com/FindFonts/RecentReleases/2002/11-01-2002.htm">Othello</a>” originally released by Monotype in 1928, as competition to Rudolf Koch’s Neuland typeface.)</p>
      <p>I will try to find it’s digital conterpart if I can.</p>
      <p>And didn’t Dr. Frankenstein invent digital fonts?<br>
      ————————————————————-</p>
