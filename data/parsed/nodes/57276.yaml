      <p>I like the Yeti in no. 1 and 3, because the top of his head looks like a snow-capped mountain. Yeti no. 4 looks like Dick Cheney in a fur coat.<br>
      But this isn't an illustration forum, it's a type forum, so let's talk about type. The cameo around the Yeti dictates a centered layout, but when the type is mechanically centered, <strong>OUTDOOR</strong> looks wrong because of the shape of the. <strong>Y</strong>, so you ended up moving <strong>OUTDOOR</strong> to the right.<br>
      Maybe you could replace the cameo with a border around the whole logo?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/YETI_5598.jpg"></div><br>
      The border draws the eye away from the shape of the <strong>Y</strong>, so <strong>OUTDOOR</strong> can be centered and still look right.<p></p>
