      <p>I'm usually a lurker here.....but I climb (alot), so I thought I might weigh in a little on your logo.  A comment was made about the type of design being used in climbing (bad or too serious) and I agree to a point (Mammut's logo is great).  The bouldering scene (one form of climbing) leans towards the skate style, and sport climbing is getting there, traditional climbing is a little more/over serious.  I guess I am trying to say that there are 3 major divisions in climbing and they are each marketed very differently.  Ive also noticed a difference between companies that make gear (hardware) and companies that make colthes (software).</p>
      <p>I like the mean yeti, number three in particular.  I agree that it could probably use something else containing it, rectangle or a shield, but I think it works and could work cross "genre"? if handled well.</p>
      <p>Nice Logo.</p>
