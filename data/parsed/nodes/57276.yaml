      <p>There is a directness to the approach that I am not responding to so well. Although a mountain is cliché for climbing I wonder what other images might be more evocative and keep some of the mystery of the legend whole. Tracks are also a bit cliché but I wonder about other visual elements.</p>
      <p>I also wonder about Nepalese flavor, as you see in the Sherpa brand.</p>
