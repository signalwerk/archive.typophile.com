      <p>One problem with rendering a Yeti is that no one has seen one, or at least the general publics’ impression is the backside of a lumbering ape creature. What you have has an infant like proportion (baby head), like a young orangutan that has an angry or maybe pouting expression.</p>
      <p>There is also the issue of what is required to survive at high altitudes, which isn’t so much toughness or anger as good decision making skills under extreme stress. I still believe there is a self-reliance angle that is being missed.</p>
      <p>Most productive logo crit threads start out with four or five distinct ideas. You have versions of the same idea with minor changes.</p>
