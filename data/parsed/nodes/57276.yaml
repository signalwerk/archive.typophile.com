      <p>It may not be an either or proposition so much. <a class="freelinking external" href="http://www.core77.com/blog/book_reviews/book_review_new_skateboard_graphics_by_j_namdev_hardisty_13032.asp" rel="nofollow">Skate design</a>, at this late stage, is very diverse. Maybe there is a way to do something that doesn't feel old but also doesn't look as bold as a package for beef jerky.</p>
      <p>Also consider the usage situation. Logos for climbing gear brands often are incorporated into zipper pulls, at the base of a neck on a jacket, etc. and are sometimes embroidered.</p>
