    html: |-
      <p>I don't know if you need an exact match, but if you do, your sample isn't in HY Headline Bold (sample below, condensed to 90%), although it's certainly a similar style.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hangullll_5133.jpg"></div><p></p>
      <p>Most Korean foundries have their own versions of "Headline (헤드라인)" designs of this style, such as HY Headline, Rix Headline, etc. They may be offered in angled (<em>gak</em>, 각) or round (<em>dunggeun</em>, 둥근) versions, hence the HY Kak Headline, <em>kak</em> being an alternate romanization of 각.</p>
      <p>"Headline" faces are also called <em>jemok</em> (제목) faces, so you may also have to look through some <em>dunggeun jemok</em> (둥근제목, round headline) faces offered by different foundries.</p>
      <p>I haven't been able to find an exact match. It's not one of the usual suspects (Hanyang, Baekmuk, Sandoll, etc.) and I've exhausted the few specimens I have. Online samples are too small and most often don't include the glyphs "한글!". If you need an exact match, I can investigate further.</p>
