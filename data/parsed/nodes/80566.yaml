    html: |-
      <p>It has a lot in common with <a href="http://www.haroldsfonts.com/swizzlescript.html" target="_blank" rel="nofollow">Swizzle Script</a> - except the r and s are different.</p>
      <p>How old is this? I wonder if those letters could have been alternates in the original Stylescript (SolHess, 1940, Monotype). I can tell you that there were no such alternates in the VGC version.</p>
