      <p>I hadn't considered the possibility that this was a combination of fonts, but that would explain why I've had little luck tracking this down…</p>
      <p>Swizzle Script does seem to be the closest match out there.</p>
      <p>This is from a piece of certificate art produced by my employer during the mid to late 80's, rumor has it some sort of film based typesetter was used at that point in time.</p>
      <p>Thanks for the leads guys, now I have a leaping off point :)</p>
