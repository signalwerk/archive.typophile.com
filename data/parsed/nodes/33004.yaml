      <p>I doubt he would; based simply on the design; the orderly and regular stem and serif weights, and the rich bracketing of Galliard don't call for such illegal situations. If you look at the letter at a large size, this dent in the lower left is very uncharacteristic of the design. See the corresponding Roman shapes, or other Italic cap stems. Keep in mind that this is one of the earliest typefaces to be digitized; done in the infancy of PostScript. These could be artifacts of that time. </p>
