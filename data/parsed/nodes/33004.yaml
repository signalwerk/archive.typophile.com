      <p>It seems to me, from my but 3 years in the game, that italics have their own set of rules when it comes to extrema. It is just too damn difficult to get a smoothe transition from a straight to a curve with a slanted stem. You have to weigh the value of "The Rule" against the sweetness of the curve. It also helps a bit if italic glyphs are drawn above the 1000 unit limit. Since handles have to fall on the grid, doubling the resolution to 2000 or 2048 makes italics more aminable.</p>
      <p>ChrisL</p>
