      <p>Thank you William, it's very nice to have all that work recognized. </p>
      <p>I probably won't be able to pinpoint exactly how you get this result, platforms, versions and all, but I'm on a Mac with FLS5.02. Without Shift down, you can click on a curve and drag, causing the BCP handles to swivel all over the place; this might be useful sometimes, but holding down shift constrains the handles in their current direction (typical constraint from the Shift key). The result is that both BCPs slide out (smoothly) from the endpoints, and depending on where you move your mouse, the curve adjusts dynamically. This is like what you describe above in Shift-selecting a single node, except you are touching the curve, and both nodes move. It feels rather uncontrollable, which is why I suggest zooming in on the curve; more fine control and a better view of the results. This is a situation where you want a copy of the existing outline in the mask layer to compare with, since the changes can be very subtle. Try touching the curve in different places; there's a better place to grab that gives you more control - typically in the middle of the curve.</p>
