      <p>Notice that the curves have barely changed at all in any of the above example but adding or deleting points changes handle lengths. If a point is added mid-way between two existing points on a perfect circle, the handle length reduces by half.<br>
      Ballancing lengths of arms must take into accounct the length of the adjacent arcs, not just the handle arm lengths.</p>
      <p>ChrisL</p>
