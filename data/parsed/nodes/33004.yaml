      <p>William,<br>
      You will notice that the unequal arms of the handles of your Galliard D on the right would become close to equal if the "so called" extra point were removed from the lower right. This would of course add a bit of a bulge on the lower quadrant and probably why he put that point there to begin with.  As an experiment, draw a circle and then delete the points at the left and right. This would give you a near circle drawn with only 2 points. Note where they end by placing a blue vertical guide where the arms of the handles extend. Now put an extrema on the right half where the red arrow says you need it. Now notice that the two arms of the 2-point circle that had stuck out well beyond the extrema before, now have shortened to well inside the extrema. This shows the effect of adding another point between two.</p>
      <p>ChrisL</p>
