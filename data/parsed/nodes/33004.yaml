    html: |-
      <p>T Bones, the posts at 'Typies' are useful only if you don't take them too seriously, as they can also be seriously misleading. As one person notes in reply to your second link at the site, intermediate points and unbalanced handles may be desirable to get the right curve. You will find such things regularly in the fonts of masters like Matthew Carter, who says he doesn't hesitate to break such 'rules'. </p>
      <p>As I understand it--and my understanding is definitely limited--things like crossed handles are really the only things that are going to mess up your font in the sense of causing it to crash. </p>
      <p>The other 'rules' relate either to what is a 'good' or 'sweet' curve, or to hinting. </p>
      <p>On the hinting issue, the Adobe rules explicitly say that you don't need extrema points at something like the terminal on the e. Also there is something called 'flex' hinting and also placement of 'blue zones' that relate to drawing. </p>
      <p>I would be happy if someone would lay out what is really helpful and not in terms of what drawing rules in these three areas:</p>
      <p>1. What Bezier drawing mistakes may cause your font to not work or crash.  </p>
      <p>2. What is advantageous for 'good' curves. Here inevitably will be guidelines, rather than hard and fast rules.</p>
      <p>3. What rules will facilitate or harm hinting, both for roman and italic fonts. </p>
      <p>As it is, it seems to me the 'rules' are problematic, and it is not clear what is needed for what.</p>
