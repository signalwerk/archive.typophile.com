      <p>"you can’t get to the same curve with the nodes in those locations, and no intermediate point. So then you’d have to move the bottom node to the left, which would mess up the bottom arc..."</p>
      <p>William you missed my point completely. Put the points wherever you "see" them. I was not saying that intermediate points were a no-no. I was just indicating that the "equaled arms" rule was not always to be followed. Actually, only when symetrical arcs connect, should it be done. I was trying to indicate that you cannot just write a rule without including all the factors. As a matter of fact, I have gotten to the point where I don't bother with any such rules and just draw curves. When I am done, what is amazing is that I get very few little red arrows and know that those I can ignore because I know what is going on.  I can just draw faster and more freely without overanalizing operational technique. I allow my eyes to be trained and then trust them. </p>
      <p>"Zen and the Art of Archery" is still a good book and teaches much more aboutdoing things than rule books with recipies for success or failure.</p>
      <p>ChrisL</p>
