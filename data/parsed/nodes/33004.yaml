      <p>Carl, I cross-posted with yours. </p>
      <p>Interesting that the bezier drawing might not be his--but I would be interested to learn definitely if this isn't just what he wanted. I have heard Carter distaining the 'rules' and the current font does work. (Can anyone check the Carter &amp; Cone version?) </p>
      <p>As you rightly point out, the lower left arrow of FontLab's 'audit' is flagging an 'unnecessary inflection', not a missing extremum. It does flex in a way that many would not choose, but again I still wonder if Carter didn't want it that way. </p>
      <p>By the way Adobe Garamond's italic Cap D also has an intermediate point at the same place, and four 'missing' extrema. And certainly Slimbach is following or maybe setting the Adobe standard.</p>
      <p>So far as I can remember, Slimbach never does a situation where one of the handles, if extended, would cross the other on the same curve--the 'unnecessary inflection' situation. I don't have the chutzpah to do this violation either, but I wouldn't be surprised if Carter does.</p>
