      <p>There's a way in FL to grab the curve itself, with shift held down, and slide both nodes around. It can be awkward, so it's best used while zoomed in close. This is very useful in creating nuanced curves with fewer points. The general suggestion to have balanced handles is a starting point from which you can then refine curves greatly, while staying within the bounds of proper PS technique. If you ever need to replicate a curve with fewer points, this technique is excellent. It is what I use to get the curve I want in situations like the lower right Galliard D, where there's an extra point. Only if the curve isn't satisfactory will I then add a point. </p>
      <p>For more about Galliard, check Typophile node 6833.</p>
