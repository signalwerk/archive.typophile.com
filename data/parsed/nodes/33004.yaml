    html: |-
      <p>Chris, the handles for the top arc of the D are also not equal. Also when I deleted the intermediate point, the arms were still significantly unequal. More to the point, when I first pasted a copy of the glyph into mask I could see that the new curve overshot the old one both ways: first moving inside, then crossing over and going outside. </p>
      <p>And if you've played with this kind of situation you know you "can't get there from here": you can't get to the same curve with the nodes in those locations, and no intermediate point. So then you'd have to move the bottom node to the left, which would mess up the bottom arc leading into the serif.</p>
      <p>So basically, Carter knew what he was doing: this was the only way to get the curve he wanted. </p>
      <p>Just checking the Roman of Galliard, he doesn't seem to use intermediate points, but he does have many places with no extrema.</p>
