      <p>William,</p>
      <p>Be aware that the outlines from ITC Galliard are not likely to have been drawn by Matthew himself. The design came out long before Adobe first digitized it. I'm not completely sure, but it might be true that Carter and Cone's version of Galliard (with slightly longer descenders) is Carter's handiwork. That would be one to examine. That, or more recent designs which he digitized himself. </p>
      <p>The leftmost Font Audit arrow isn't pointing to a missing extrema point, it's flagging a curve constructed poorly; one handle is doing all the work and overextends the box or boundaries of a curve. The curve above (while missing an extrema point) is correctly constructed; the one at lower left is a good example of how not to make a curve. Notice how it bows in, narrowing the stem where it ought to be tapering out.</p>
