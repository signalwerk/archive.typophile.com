    html: "<p>Distributing free fonts (with the designer's permission) hardly seems immoral to me. <br> <br>I understand the argument that it may devalue the work of type designers in general, but I'd present <a href=\"http://www.yale.edu/printer/typeface/typeface.html\">the Yale typeface</a> as a good counter example. Granted, it's not free to <i>all</i>, but it is free to students and faculty. It's an example, in my opinion, of an organization absorbing the cost for the general betterment of their typographic environment. This strikes me as a moral act, or at the very least an act that isn't immoral. Proper credit and emphasis are also given to the designer and the intentions associated with the font family's designs, which contributes to my support for this project. <br> <br>Personally, if taking things that're free means I'm greedy, then I was greedy by reading Typophile before contributing, where I got insights, opinions, and help for free. I also offered them up without the promise of reciprocation from any individual I helped (and still do). Distribution of free fonts (or software, for that matter) can be done in the name of public good and open exchange of ideas, which has little to do with commerce and a lot to do with growth and community. <br> <br>I buy fonts, but I also download and appreciate generous free offerings such as Unibody and Silkscreen. I don't think honest, well-intended distribution of personal work is the problem. The gauging of type's value by the public at large is influenced much more thoroughly by Microsoft, Apple, and Adobe than by John Doe's Personal Font Site with his free <i>Star Wars</i> font knockoffs. <br> <br>Note: I do not condone font piracy, and my argument does not apply to those who publicly redistribute fonts outside of the terms of their licenses, or seek to make money from the designs of others.</p>"
    html_clean: "<p>Distributing free fonts (with the designer's permission) hardly seems immoral to me. <br> <br>I understand the argument that it may devalue the work of type designers in general, but I'd present <a href=\"http://www.yale.edu/printer/typeface/typeface.html\" class=\"link-external\">the Yale typeface</a> as a good counter example. Granted, it's not free to <i>all</i>, but it is free to students and faculty. It's an example, in my opinion, of an organization absorbing the cost for the general betterment of their typographic environment. This strikes me as a moral act, or at the very least an act that isn't immoral. Proper credit and emphasis are also given to the designer and the intentions associated with the font family's designs, which contributes to my support for this project. <br> <br>Personally, if taking things that're free means I'm greedy, then I was greedy by reading Typophile before contributing, where I got insights, opinions, and help for free. I also offered them up without the promise of reciprocation from any individual I helped (and still do). Distribution of free fonts (or software, for that matter) can be done in the name of public good and open exchange of ideas, which has little to do with commerce and a lot to do with growth and community. <br> <br>I buy fonts, but I also download and appreciate generous free offerings such as Unibody and Silkscreen. I don't think honest, well-intended distribution of personal work is the problem. The gauging of type's value by the public at large is influenced much more thoroughly by Microsoft, Apple, and Adobe than by John Doe's Personal Font Site with his free <i>Star Wars</i> font knockoffs. <br> <br>Note: I do not condone font piracy, and my argument does not apply to those who publicly redistribute fonts outside of the terms of their licenses, or seek to make money from the designs of others.</p>"
