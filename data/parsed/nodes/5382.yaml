    html: <p>If you are the designer of a font, why should you not be able to give it away free? I'm glad someone mentioned Gentium, which is a great example. <br> <br>People in the past have drawn comparisons with music - no-one asks why we need music, so the argument goes, so why should we ask why we need new fonts. Likewise on font distribution, surely?  <br> <br>I dont think that too many people would hold with the argument that ALL music HAD to be charged for (or not released or performed), so that those who are at the top of their profession should not feel somehow devalued, and I dont see why that analogy isn't fitting here. <br> <br>Type design isn't all about the money. Some people are designing fonts simply because they enjoy it and may want to share it with others. Others are learning (this is where I am at). Others to provide an altruistic service to the wider community. And many people are trying to make their living from it.  <br> <br>All are surely acceptable, if not welcome?</p>
