    date_raw: 28 Jun 2004 — 3:04pm
    votes: null
    html: "<p>A few students from Offenbach and I have formed a type collective, and we are putting together a website (I'll post the URL after it launches in a week and a half). <br> <br>We want to open our platform up to other interested students at our school as well. Last week, we began to think about what we wanted to be as a group, what we stood for, etc... This way, it would be easy for us to figure out which other students/work would be a good fit for us and our collective's site. <br> <br>Several of us have worked \"in the nearby type industry.\" We all have strong feelings about type design, and plan to continue focusing our studies/lives/etc. toward that. Anyway, here are our general guidelines for type that can be displayed on the site: <br> <br>1. the work may not be derivative <br>2. the work may not be available anyhere as a free font at the moment <br>3. the work should be \"good\" enough. By good enough, we mean, that we as a group should all be able to sit and talk about it. Of course, none of us are professional type designers, so \"good\" is still relative. But we have to set the bar for ourselves somewhere. <br> <br>Unfortunately, there are students at our school who make typeface design experiments that are derivative. As a group, we are all in agreement that derivative work is bad, and that we should not support it. <br> <br>While we all agree that we don't want to create a free font site, I'm not so sure that we are all in agreement about the distribution of free fonts in general. I tend to agree with Nick, and think that free fonts hurt the industry and individual designers, perid. I would not like to support this practive with my time, money, and creative efforts. <br> <br>I just wanted to see what the general opinion is. I don't want to seem like a reactionary; if I'm out of line, we might re-consider our free font position.</p>"
    html_clean: "<p>A few students from Offenbach and I have formed a type collective, and we are putting together a website (I'll post the URL after it launches in a week and a half). <br> <br>We want to open our platform up to other interested students at our school as well. Last week, we began to think about what we wanted to be as a group, what we stood for, etc... This way, it would be easy for us to figure out which other students/work would be a good fit for us and our collective's site. <br> <br>Several of us have worked \"in the nearby type industry.\" We all have strong feelings about type design, and plan to continue focusing our studies/lives/etc. toward that. Anyway, here are our general guidelines for type that can be displayed on the site: <br> <br>1. the work may not be derivative <br>2. the work may not be available anyhere as a free font at the moment <br>3. the work should be \"good\" enough. By good enough, we mean, that we as a group should all be able to sit and talk about it. Of course, none of us are professional type designers, so \"good\" is still relative. But we have to set the bar for ourselves somewhere. <br> <br>Unfortunately, there are students at our school who make typeface design experiments that are derivative. As a group, we are all in agreement that derivative work is bad, and that we should not support it. <br> <br>While we all agree that we don't want to create a free font site, I'm not so sure that we are all in agreement about the distribution of free fonts in general. I tend to agree with Nick, and think that free fonts hurt the industry and individual designers, perid. I would not like to support this practive with my time, money, and creative efforts. <br> <br>I just wanted to see what the general opinion is. I don't want to seem like a reactionary; if I'm out of line, we might re-consider our free font position.</p>"
