    html: <p>I should add that although I don't think giving away fonts for free is immoral, I do think it tends to devalue type, and is usually bad for the type industry and those who wish to make their living at type. <br> <br>So, if the question is, should we give away some fonts, given that we don't care whether we make money, I'd say "that depends." Personally, I'd suggest you decide what you think the fonts are worth, and charge that amount for them. They might be quite cheap. I guess the problem with that is that getting into the whole e-commerce setup might be expensive and troublesome, given that you don't expect to charge much. I wonder what one would do for sort of "poor man's e-commerce"? Maybe let people pay with PayPal, and email them their fonts afterwards? Say, you could auction the fonts on e*Bay! Okay, now I'm getting silly.... <br> <br>Seriously, though, one element of the problem is that most users don't understand the quality difference between most of the free and shareware fonts and high quality well crafted fonts. So as long as there are lots of free fonts, they think people are "greedy" or something if they want to charge for fonts. <br> <br>What I do think is unethical is making knockoffs of existing retail fonts (whether free or not), or distributing other people's retail fonts illegally (piracy). <br> <br>My two cents. <br> <br>T</p>
