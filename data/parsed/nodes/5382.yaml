    html: <p>Free fonts are the result of free font formats. As are most of the indie foundries. How many foundries pay for the use of the PostScript Type 1 format? None. Hey, its free. But it wasn't always. <br> <br>This whole argument is nonsense. If you piggie back on the format you have no reason for discussion. <br> <br>There is no reason why PS1 or TT or OT should be free to foundries, developers, software providers, or whatever. The fact that they are, to me, makes the whole free font movement, or even the indie font movement, argument, nonsensical. <br> <br>You are riding on someone's back for free and complaining about someone climbing on your back. <br> <br>Give me a break. <br> <br>Gerald</p>
