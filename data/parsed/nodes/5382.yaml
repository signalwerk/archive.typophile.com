    html: <p>I am one of the people who have been reading here, trying to educate myself about type.  Brian, you mention children and favorite typefaces.  As a child I loved to read and I loved to read books that had a certain type in them.  I never learned the names of the type I liked, but I did recognize that certain types made the reading experience better, the way good paper did. <br> <br>Now I'm working in a specialized web design field and I need to build a type library.  I have purchased a lot of type recently but I have also downloaded free type. When I found type that was obviously ripped off or downright stolen, I realized that I didn't have the knowledge to recognize which free fonts were original and which weren't.  So I went back and deleted the free fonts, except for a very few that I feel certain about.  <br> <br>I see nothing wrong with someone offering a free font if you purchase a font.  But I think that we should respect the artists who design type and pay them what they deserve or we will find that we are left with a lot of cheap, crappy type and not much else.   <br>  <br></p>
    html_clean: <p>I am one of the people who have been reading here, trying to educate myself about type.  Brian, you mention children and favorite typefaces.  As a child I loved to read and I loved to read books that had a certain type in them.  I never learned the names of the type I liked, but I did recognize that certain types made the reading experience better, the way good paper did. <br> <br>Now I'm working in a specialized web design field and I need to build a type library.  I have purchased a lot of type recently but I have also downloaded free type. When I found type that was obviously ripped off or downright stolen, I realized that I didn't have the knowledge to recognize which free fonts were original and which weren't.  So I went back and deleted the free fonts, except for a very few that I feel certain about.  <br> <br>I see nothing wrong with someone offering a free font if you purchase a font.  But I think that we should respect the artists who design type and pay them what they deserve or we will find that we are left with a lot of cheap, crappy type and not much else.   <br>  <br></p>
