    html: <p>I used to run a free font site (.ttf for anyone who's interested). Obviously there's a difference between home users who just want fun fonts and professional users prepared to pay for a quality product. I got some nice mails from folks who'd used my fonts in church missives and things like that. That said, I also saw my work cropping up in shop displays, on the sides of buses, one was even used in a TV news feature. <br> <br>I'd say it's not immoral as long as they're your own designs (not derivative) and you make no claims over quality, that could lead to a muddying the typographic waters. There are many more immoral things to do......</p>
