    html: <p>Brian, to be honest, I was a little surprised they could pay attention to my lecture. I got them in front of a white board and drew a few Bodoni letters and a few Garamond-ish forms to discuss stroke axis. Then I told them that this comes from the cant of a chisel-tip pen, and historical movements, etc. I followed with a few points about stroke contrast. Then, I pointed out x-height and character width. I used this to demonstrate the far more subtle differences between Times and Garamond, now that they understood the terms. Then I said, imagine the number of characters on a single page in a book. Now multiply that by the number of pages. Now you see why such little differences are so important, etc., etc. <br> <br>With some dry-erase markers and about 10 minutes, I was able to communicate most of that info. However, I also had a willing and intelligent audience of one. <br> <br>I also got into kerning and kerning pairs, how many characters are actually in a font, and how many weights a truly versatile text font requires (emphasizing that the bold is not just a computer extrapolation, but an actual unique design, etc.). But that was more aimed at demonstrating why font families can cost 100s of dollars when you get them packaged with software that costs about as much as one font. That was probably an additional 10 minutes or so.</p>
