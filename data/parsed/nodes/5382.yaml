    html: <p>&gt;Governments legislating morality has always seemed like a bad idea to me.  <br> <br>I agree, because I think it's impossible to legislate morality, in the sense of trying to use legislation to change a person's value system. <br> <br>There is a distinction between someone's broad morality (or value system) and anti-social, or socially disruptive behavior, which is frequently justified on moral grounds, and which government is entrusted to legislate against.  <br> <br>A lot hinges around the issue of whether an "immoral" act has a victim. Governents are more likely to legislate against anti-social behavior when there is a clear victim. <br> <br>It's one thing to say that the government has no business telling people how to behave when their behavior only effects themselves, quite another to use this as an argument to excuse activity which harms others. <br> <br>Of course, there are grey areas, such as "is a foetus a person" (sorry if the example offends, but I am not raising this as a partisan issue). And so the question with fonts is, does giving away free fonts on the internet harm anybody?  <br> <br></p>
