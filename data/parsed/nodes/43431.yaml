    html: |-
      <p>Ha! ha!</p>
      <p>You know what the really funny thing is?</p>
      <p>People sometimes buy both licenses! Woo hoo!</p>
      <p>Freelance graphic designers can buy the Personal Use License for their internal design work and sketches they make for their clients. Then, once the client approves the design, the designer can send them to MyFonts to buy the Commercial Use License for themselves. Or sometimes a designer will buy the Commercial Use license on the client's behalf.</p>
      <p>And it's pretty clear which use is which. If it's a freelancer who doesn't even know if the font is gonna be used or not, then he or she should be using the cheaper Personal Use version. If it's a company who decides to use it for marketing, packaging or the web, then they know they need to get the Commercial Use version.</p>
      <p>If it's student work, it's Personal Use. If it's a logo for a new small business, it's a Commercial Use. </p>
      <p>People are smarter than most people give them credit for. They will buy the appropriate license for their intended use if given an affordable opportunity to do so. </p>
      <p>I believe offering low-cost fonts for casual designer discourages piracy. I personally think my fonts are pirated less because I so readily make them available in a variety of venues. If I were elitist and were to charge more to sell my fonts to a more elite group, I would be more a target of font pirates. But since I'm "keepin' it real", people rarely deliberately pirate my fonts.</p>
      <p>I think the reason more foundries don't employ a multi-tiered licensing system is that it's just too complicated and confusing. And it takes a lot of time, energy and money to lawyers to write multiple End-User-Licenses. It's kind of a pain. Most font designers would rather make fonts than spend time re-writing EULAs. I'm an anomalie.</p>
      <p>But the way MyFonts does it is clean and easy for the end user (the font shopper). Theoretically a foundry can write any number of licenses and attach them to a variety of prices for an infinite number of SKUs. It's the clumsiness of shopping interface that makes it impractical. </p>
      <p>Remember the first rule of marketing: Keep it simple, stupid.</p>
      <p>-chank</p>
