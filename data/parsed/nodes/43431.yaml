      <p>David, I've discussed these problems quite often with my colleagues. Here are our stumbling blocks: </p>
      <p>&gt; <em>I’m talking about students who have been awakened to the beautiful art of typography, students who met typographers, students who know that there is a man behind each type</em></p>
      <p>These students are not the problem. If a student gets this interested in type, he or she is already almost, if not already, part of the choir we are preaching to. Also, when these students e-mail the foundry in question, or the designer, they may be able to work out an agreement. I know many big foundries and small designers who give fonts to students for specific projects. But the contact has to be initiated here by the student, and there has to be a discussion. This creates a small rapport and trust, too. I love getting e-mails from dedicated students, and always do my best to help. I can't always give them what they are asking for, but a solution is often available once I understand what they or their professors really need.</p>
      <p>A student font license would not be made for this group, but for the much bigger block of "all-the-other-students-in-the-world-who-use-fonts." This is a very different group of people. They don't meet the criteria you discuss above. Nevertheless, they are students, and I do think that they should be met halfway, as long as it remains doable. It unfortunately isn't something that is doable for everyone.</p>
      <p>&gt; <em>not to make a “student” license, but a “non commercial” license. Don’t you think it would be great if some guy at home uses, for 5 dollars, a type such as Fedra or FF Meta Serif on an invitation for his sister’s wedding</em></p>
      <p>Actually, many of my colleagues and I really do not like this idea at all. The problem is that "non commercial users" are really difficult to define. One can assume that quite many of the design students will become real professional designers in the future. Maybe more will than won't. OK. But many people who "fall in love with type" in the "adult" world might decide to become DTP professionals, or something similar. Who knows? Then they'd need font upgrades. Would they buys them? I don't know. This requires some more thought… Also, some designers might buy fonts for non commercial purposes, too… like their sister's wedding invite or such. Moreover, many of my customers who I'd call "non-professional" might actually think of themselves as professionals. This isn't for me to decide, but for them! It is their identity… I can't determine it for them.</p>
    html_clean: |-
