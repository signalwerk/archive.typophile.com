      <p><cite> there are a lot of people who aren’t professional designers and have very different needs in regards to fonts than designers do</cite></p>
      <p>And the vast majority of them will do just fine with the fonts that come bundled with their computer. I doubt that is a profitable market for foundries to chase. If there were to be a multi-tiered structure for font pricing, I'd rather see it have to do more with use. I.e. an individual designer or small studio who needs a font to design a logo for a neighborhood bakery vs. an agency that is licensing a font to use for a corporate identity. Perhaps this is something that should be reflected in the EULA rather than the pricing. I don't know.</p>
