      <p>hi y'all - </p>
      <p>My name's Chank and I'm a long time listener and a first-time poster.</p>
      <p>I make fonts and sell them through my own website, Chank.com, and through a number of other distributors.</p>
      <p>I sell the same font under different names at different prices all the time. I have hundreds of fonts that I offer for sale.</p>
      <p>You can get my fonts for as little as $4.95 or as much as $124 for a single weight of a font.</p>
      <p>The main difference in the price is usually the license that comes with it. I encourage and empower casual designers and give them a chance to test-drive my fonts by making them available at a very reasonable price. This low-cost option is called a "Personal Use License" and restricts what you can and can't do with a font. Sometimes these budget fonts are only available in TrueType format.</p>
      <p>I also sell my fonts to big corporations. When they buy a font, they like to be able to do whatever they want with it, so they're comfortable paying a bit more for a less-restrictive license. They also like Post-Script and OpenType. For them I offer a more expensive "Commercial Use License".</p>
      <p>Other distributors of mine have their own licenses that they bundle with my fonts, and then sell them at a different price, usually somewhere in between $4.95 and $124.</p>
      <p>(All these prices are based on a basic 5-user license; I'll try not to get into the murkier waters of multi-user licensing or freefonts in this post.)</p>
      <p>All these licenses have different wordings, and it may be confusing. But the reality of it is that they all sell. That's how my small business survives. I offer my fonts through many distributors at many different prices, because this is how I can reach the largest and most diverse group of designers. Because I want lots of people to use my fonts. It's only when people see other designers using fonts that they can really appreciate a good type design. So I try to get lots of copies of my fonts out there and in use, under whatever name at whatever price it takes to make the sale.</p>
      <p>The best deals are usually at my personal website, where sometimes I have crazy sales and sell fonts for as little as $2.95. But that only happens once in a while.</p>
      <p>One of my favorite sales tools is the split-license option I use for my fonts for sale at MyFonts.com:<br>
      http://www.myfonts.com/PurchaseOptions?familyid=75616&amp;id[]=154232</p>
      <p>There you'll see the exact same font, in different formats, with different licenses, at different prices. I've never really promoted this option, because I don't want to confuse people with licensing talk. But when people see different licenses for sale at different prices, they can pretty easily determine which one is right for them and purchase accordingly. </p>
      <p>I sell many more Personal Use licenses than I sell Commercial Licenses. But I make more money from the Commercial Licenses because the big companies can pay more.</p>
      <p>And that helps offset my costs. So I can make my fonts available to individual users and casual font enthusiasts at a lower cost.</p>
      <p>Ain't life grand?</p>
      <p>-chank</p>
