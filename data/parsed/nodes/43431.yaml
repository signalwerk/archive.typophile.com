      <p><cite>Do you really think that lowering font prices to $5 or even $1 would stop, or significantly reduce, student font piracy? I mean, if students have no money, then they have no money. You can’t afford $5 licenses without money</cite></p>
      <p>There’s a pretty big difference between $5 and $20 or $50. Broke design students can cough up $20 to get four weights they only want to use once. They often can’t cough up $80, much less $200.</p>
      <p><cite>If a font’s license expires along with student status, there is no way to control the actions afterwards… people probably won’t delete the files…</cite></p>
      <p>What happens afterward is irrelevant. The system I proposed has nothing to do with students getting access to files, <em>because they already have access to the files</em>. They can download everything Monotype, Adobe, Fontshop or almost anyone else sells in less time than you could ship them a legit collection on CD. What I am suggesting is to try monetizing a market that right now isn’t producing much income at all by selling one-time licenses. Sure the system would be a pain in the ass. Sure it will be abused. But unlike the current system—offering a few discount bundles and a lot of indignation—at least my proposal might generate some revenue and build a direct connection between the type industry and its next generation of customers.</p>
      <p><cite>One thing about a low price for a student is that it will teach the foolish student that type is not valuable.</cite></p>
      <p>That’s absurd. Students don’t think less of the software and hardware from companies like Adobe, Microsoft, Apple, Epson and Autodesk because they offer huge student discounts. The concept of a student discount really isn’t that complicated; anyone stupid enough to misunderstand student pricing as representative of open-market value is  uncommonly stupid and not worth working into a business strategy.</p>
