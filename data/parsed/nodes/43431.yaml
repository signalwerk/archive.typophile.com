    html: |-
      <p>nana - it depends on the foundry/vendor. I am pretty sure Veer gives Thaddeus a similar cut as other retailers (MyFonts is an exception at 65%). It's a direct relationship: designer to retailer. </p>
      <p>But some foundries give back less as the font makes its way through the reseller chain. A font can be sub-licensed twice before its sold on the retail market, giving the designer a smaller share of the retail price.</p>
      <p>The <a href="http://www.fontfont.com/about/become.ep" rel="nofollow">FontFont contract</a> is more fair in that regard. FSI pays a designer's royalty of 20% of the recommended retail price of each package sold worldwide. This is equivalent to 45% - 50% of the wholesale price of the font, regardless of where it is sold.</p>
    html_clean: |-
