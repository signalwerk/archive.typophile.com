      <p>&gt; <em>I suggested to make a system with 2 prices, one low for the student and the non-pro, and another one, higher, for the pro. </em></p>
      <p>Sounds like making a lower price to me!</p>
      <p>Actually, though, I'm completely in favor of two separate prices. This is not a problem for many in the font business at all. The problems are the nebulous questions around the lower, student price:</p>
      <p>1. Do you really think that lowering font prices to $5 or even $1 would stop, or significantly reduce, student font piracy? I mean, if students have no money, then they have no money. You can't afford $5 licenses without money. If students feel "entitled" to free software apps and fonts—which many do—pricing will not change their habits.</p>
      <p>2. Does the license expire once the student is no longer a student? I have purchased some academic software licenses were this was the case, and some were it wasn't. If a font's license expires along with student status, there is no way to control the actions afterwards… people probably won't delete the files and buy new, non-student licenses for all the fonts they got as students. Maybe for the few they like best. Ideally, they'd stop using all of the fonts they don't upgrade, but this requires a lot of trust.</p>
