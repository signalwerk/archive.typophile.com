      <p><cite>Fonts are not exclusive products just for designers. They are for everyone who uses computers.</cite></p>
      <p>You’re right, Dan, fonts are used by everyone out there. But I believe that there are a lot of people who aren’t professional designers and have very different needs in regards to fonts than designers do. To some extent Linotype has addressed this by selling individual fonts as tiered Opentype offerings at price points that scale upwards with features—a model I very much appreciate. I believe that there are a lot of different design and financial situations that keep users from purchasing fonts under the one-price-fits-all models, and that foundries might just bring in a whole lot of new customers by offering more licensing models. </p>
      <p>Unfortunately all my scenarios are just as hypothetical as yours—after all, I don’t have thousands of fonts on offer to play around with.</p>
    html_clean: |-
      <p><cite>Fonts are not exclusive products just for designers. They are for everyone who uses computers.</cite></p>
      <p>You’re right, Dan, fonts are used by everyone out there. But I believe that there are a lot of people who aren’t professional designers and have very different needs in regards to fonts than designers do. To some extent Linotype has addressed this by selling individual fonts as tiered Opentype offerings at price points that scale upwards with features—a model I very much appreciate. I believe that there are a lot of different design and financial situations that keep users from purchasing fonts under the one-price-fits-all models, and that foundries might just bring in a whole lot of new customers by offering more licensing models. </p>
      <p>Unfortunately all my scenarios are just as hypothetical as yours—after all, I don’t have thousands of fonts on offer to play around with.</p>
