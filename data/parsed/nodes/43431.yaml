      <p>In my life, I've met so many talented designers without money that it slowly drove me to globally consider typefaces'price way too high, especially on Veer. There should be a "student" price on each and every type in the world, such as 5 or 10 bucks, the same thing which is happening with softwares. A student can never afford most of the good, modern, independent types, and that's a pity, he needs a lot of them to practice, so he has to steal them, everybody knows that. Once he gets pro, once he has a deal with a customer, he then buys the license, and everybody is happy. Instead of finding a correct and honest solution, I constantly hear type designers whining about type thieves, this is really pathetic. </p>
