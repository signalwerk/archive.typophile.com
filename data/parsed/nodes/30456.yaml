    html: |-
      <p>Not a match, by any means, but the thread brought to mind the lettering of Elizabeth Colwell from the early 1920s. Two fonts made from this are Nick Curtis' <a href="http://www.myfonts.com/fonts/nicksfonts/mckenna-handletter-nf/" target="_blank" rel="nofollow">McKenna Handletter</a> and Andrew Lehman's <a href="http://www.cthulhulives.org/toybox/PROPDOCS/PropFonts.html" target="_blank" rel="nofollow">HPLHS Colwell</a>. There's also Fleisch &amp; apostrophe's <a href="http://www.moorstation.org/typoasis/designers/lab/lab_colwell.htm" target="_blank" rel="nofollow">Colwell</a> from her earlier (1916) work - but that's even further afield from the type sought.</p>
      <p>Thanks, Mark, for catching this ID.</p>
      <p>Oh, and props to <a href="http://www.typodermic.com/" target="_blank" rel="nofollow">Ray Larabie</a> for the nice work on Silentina. Mark, perhaps you could answer a question about the Silentina pair that's been nagging at me. I've got a 1925 BB&amp;S Catalog, so I know that Silentina Movie, including the alternates, was made from Pastel. Any idea where Silentina Film's different capitals come from?</p>
