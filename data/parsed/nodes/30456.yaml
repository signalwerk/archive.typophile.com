    votes: null
    html: |-
      <p><em>Any idea where Silentina Film’s different capitals come from?</em></p>
      <p>As a matter of fact, I do.</p>
      <p>A guy named Rodney Sauer, a musician who is also involved with restoring silent movies, contacted me about five years ago about identifying the typeface used for the intertitles in a certain film (or series of films, possibly). It turned out to be Pastel, but in some of the samples he had, the caps looked more like Della Robbia.</p>
      <p>I did a rough digitization of Pastel for him, but he really wanted the other caps. I said I would see what I could do, but got too busy with other projects and I ended up never finishing it.</p>
      <p>Fast-forward two years and Ray Larabie releases Silentina. It turns out that Rodney gave up waiting for me and went to Ray. In the end I think Ray did a decent job of it and I tip my hat to him.</p>
    html_clean: |-
