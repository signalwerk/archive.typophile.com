    html: |-
      <p>These are two intertitles from "PATHS TO PARADISE" (1925), starring Raymond Griffith, but I've seen this typeface used in lots and lots of Paramount silents from the early to mid-1920s.  I already have Silentina, which is rather different from what I'm looking for, and which came into heavy use with all studios in the mid-to-late '20s.</p>
      <p>Thanks for pointing me to Eutheric Bold.  It is sorta close; kinda reminds me of a cross between bookman and silentina.  It's possible if I try using Eutheric Bold and stretching it a wee bit I might get close.</p>
      <p>Anyone else have some suggestions to match the typeface I'm looking for would be much appreciated.</p>
      <p>Ben</p>
