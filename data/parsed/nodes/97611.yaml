      <p>I wouldn't hold my breath waiting for CJK fonts to be updated; one of the challenges indealing with CJK text is that fonts often differ in the number of characters they include.  The CJK Radicals Supplement is a case in point: I'm pretty sure those were added to Unicode years ago, but as you discovered few fonts have them.</p>
      <p>David</p>
