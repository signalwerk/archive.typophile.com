      <p>David W. Goodrich</p>
      <p>That's what I've just found out, and as a matter of fact, I was about to show my findings here, when I saw your post. If you look at this <a class="freelinking external" href="http://en.wikipedia.org/wiki/Template:Unicode_chart_CJK_Radicals_Supplement" rel="nofollow">Wikipedia site</a>, you'll see that the CJK Radicals Supplement didn't have those characters, at least until Unicode 6.1, inclusive. So my interpretation is that the fonts have not yet being updated with these latest characters, as Unicode 6.1 was released last March 31.</p>
      <p>Thanks for your reply</p>
