      <p>If you go to <a class="freelinking external" href="http://www.unicode.org/charts/" rel="nofollow">Unicode.org</a> and type in your codes, they will tell you that U+2EC8, U+2EC9, U+2ED4 and U+2EE6 fall in the CJK Radicals Supplement.  I don't recall when that was added, but I'm not surprised those characters are missing from most CJK fonts.  They are available with some of the Chinese fonts Adobe bundles with their software.</p>
      <p>David</p>
