    <p><cite>"While there are lists of official simplifications published by the PRC, most of these are obtained by applying a few general principles to specific areas. In particular, there is a set of radicals (such as U+2F94 ⾔  kangxi radical speech, U+2F99 ⾙ kangxi radical shell, U+2FA8 ⾨ kangxi radical gate, and U+2FC3 ⿃ kangxi radical bird) for which simplifications exist (U+2EC8 ⻈ cjk radical c-simplified speech, U+2EC9 ⻉ cjk radical c-simplified shell, U+2ED4 ⻔ cjk radical c-simplified gate, and U+2EE6 ⻦ cjk radical c-simplified bird). The basic technique for simplifying a character containing one of these radicals is to substitute the simplified radical, as in the previous example."</cite></p>
    <p>This was obtained from page 399 of <a class="freelinking external link-external" href="http://www.unicode.org/versions/Unicode6.0.0/ch12.pdf" rel="nofollow">Chapter 12 : East Asian Scripts</a> from "The Unicode Standard".</p>
    <p>I tried to print the above mentioned Unicode characters in MS Word, using the technique of typing the character code in hexadecimal followed by the keys Alt + 'x', to no avail. I don't know why, but there are certain situations where Word doesn't try to find a suitable font to print a character with this method, and this is exactly one of those cases. Then I found out that if I explicitly select the Meiryo UI font, I'm able to print the character codes U+2F94, U+2F99, U+2FA8 and U+2FC3. But I couldn't find a way to render the other characters,   U+2EC8,  U+2EC9, U+2ED4 and U+2EE6, after trying with every available Chinese and Japanese fonts in Windows 7.  Any suggestions on how to print these characters  ?</p>
