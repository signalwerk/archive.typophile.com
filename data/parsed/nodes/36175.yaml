    <p>I thought I’d post this here and see if I can’t get a few reactions.</p>
    <p></p><div class="imageWrap"><img src="/files/CP_ltd_vertical_Pos_3443.jpg"></div><p></p>
    <p>Part of it was designed by the company’s CEO’s six year-old daughter. (I’m guessing she did the computer).</p>
    <p>It was submitted as the worst logo ever and featured on the front page of Digg (<a href="http://www.digg.com/design/The_Worst_Logo_EVER" title="http://www.digg.com/design/The_Worst_Logo_EVER">http://www.digg.com/design/The_Worst_Logo_EVER</a>) today. </p>
    <p>I actually don’t mind it; it’s nice to see a more artistic approach to the static and cold designs of computer based logos. (I might have used a yellow background instead of a pink one though.) At least it’s not a web 2.0 style!</p>
