    <p>Hi,<br>
    a friend of mine asked for my advice on buying some serious books about Adobe Creative CS2 components, especially InDesign, Illustrator and Photoshop. He's a young web/print designer with a very basic knowledge of these powerful tools.</p>
    <p>For InDesign I have no doubts: "Real World Adobe InDesign CS2" is the standard reference.</p>
    <p>So what books should I suggest for the other two applications?</p>
    <p>Many thanks.</p>
