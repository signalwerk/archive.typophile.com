      <p>have you ever looked at the helpfiles of adobe? They are the best I've seen so far for computer programs, as they are very detailed and sometimes even explain some background knowledge (color seperation, etc.).<br>
      They definitely go further than explaining to somebody who already knows about it in theory, how he can achieve this with the specific adobe program.<br>
      So for Adobe-apps, I never needed an extra book so far.</p>
