    html: |-
      <p>Before everyone gets their panties in a bunch… :)</p>
      <p>The Featured Face on Typophile is a very unique way for designers to showcase their work in a dynamic environment, very different from your standard specimen. The typeface will be changing on a regular basis, so get used to it :) This feature has always been part of the design (since the redesign of 2005), but we are now taking it by the horns and have placed a selection of fonts into rotation.</p>
      <p>We are really excited to bring a fresh face to Typophile every so often, and hopefully you will enjoy seeing some new favorites splashed all over your screen. If anyone has interest in taking advantage of this feature, let us know!</p>
      <p><a href="mailto:typophile@punchcut.com">typophile@punchcut.com</a></p>
    html_clean: |-
