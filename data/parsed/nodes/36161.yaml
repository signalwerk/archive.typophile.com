      <p>The fonts being displayed are from type designers and foundries that are directly (financially) supporting Typophile in exchange for what we think is some nice, blanketed exposure throughout Typophile. So, we owe a thanks in a more explicit way to <a href="/node/29422" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carl Crossgrove</a> and <a href="/node/12444" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typeco</a> for helping out in that fashion (ahem, buy their fonts). Our aim is to have the sponsored face rotate on a very regular (monthly) basis. </p>
      <p>So, just when you'll be getting used to reading Super Duty, you can expect us to change it.</p>
      <p>Please email typophile [at] punchcut [dot] com if you'd like to receive an advertising/sponsorship rate sheet.</p>
