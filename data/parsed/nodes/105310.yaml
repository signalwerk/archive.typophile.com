  html: |-
    <p>As stated in the subject, and shown in the attachment:<br>
    Sans serif with rounded m, r, with no spurs, similarities to Helvetica and Century Gothic.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/photo_5249.jpg"></div><p></p>
    <p>I can't show the original photo of the font as seen in the wild, for client confidentiality reasons.</p>
    <p>The lower-case M is definitely a heavier weight than the other characters, that's not just "how it looks."</p>
    <p>While it appears to be a mashup of different type faces, I assure you, from what I've seen, it's an actual font with at least 2 weights.</p>
