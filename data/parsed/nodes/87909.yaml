      <p>The French Wiki on <a href="http://fr.wikipedia.org/wiki/Louis_Simonneau" rel="nofollow"><strong>Louis Simonneau</strong></a> does not give much more information: he was born in Orléans 22 may 1654 and died in Paris 16 jan. 1727. The reference (E. Bellier de La Chavignerie , L. Auvray) does not say much more. Here is a grab from Gallica.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Simonneau_5766.jpg"></div><br>
      There is no mention of the Romain du Roy, just of the paintings he reproduced.<p></p>
