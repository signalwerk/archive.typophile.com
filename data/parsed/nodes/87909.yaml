    <p>Does anyone know the dates for when Louis Simoneau (romain du roi) lived?</p>
    <p>My publisher is asking me when he was born/died. Every online source I find just quotes the same info: that he was the fella who actually engraved the designs (not the punches themselves) for romain du roi.</p>
    <p>Any further information, or leads as to where I can find more information on him, is much appreciated.</p>
