    <p>Hello everyone,</p>
    <p>Yes, I am one of those people who have been reading typophile for a while, but post only when they need help. I guess I think I have nothing to contribute to a cool comunity like this one:). I promise i will try harder from now on...</p>
    <p> The Project: </p>
    <p>I am designing a visual identinty for a really small nation (which I am part of) that is spread all over the world. We have a few small communities in Canada and they are my main focus group (Including every single Canadian to whom I have to explain who actually I am:). My main idea is to represent our history, culture, tradition, but finally in a very modern and “professional” way to represent who we are currently. I dislike websites and brochures with tons of text on irritating backgrounds (that sadly became a style) and  I understand that text is important, but lets face it : “normal” (can’t find a better word) person is not going to be intrigued by this aproach. Fast, interesting, modern and fun presentation of my nation ( It even rhymes:).</p>
    <p>Method of Attack:</p>
    <p>The primary project is a flash website ( Huge image of a small room set in traditional style for a background and “jump” navigation to different parts of the room to represent different aspects of our nation). As a secondary project, I would also like to include some brochures, posters... for our presentations at “folk fests”.</p>
    <p> Needed Resources:</p>
    <p>Two Cyrillic typefaces (sans + serif), they would have to work well in white on dark valued backgrounds ( Is that a typographic element?) + I love the look of white type on a brown background. :) Of course, they have to work well together. Text and Display. </p>
    <p>I am also on a budget (read student), with really no way of explaining to certain people that “fonts” matter and that you are supposed to pay for them. Did I mention I am not getting payed for this either? :)</p>
    <p>Cyrillic Univers (what do you think about this as my sans) ?</p>
    <p>PS I was warned (In really nice and funny context) by certain people that I should watch my spelling and writing style around here and I tried to the best of my knowledge (of English language) to follow this advice, again with the help of other certain people:) </p>
    <p>^ But I don’t know, you don’t look that scary to me:)</p>
    <p>Thank you,<br>
    Sebastian</p>
