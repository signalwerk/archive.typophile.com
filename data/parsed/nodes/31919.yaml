    html: |-
      <p>I think Trump Medieval is quite interesting. It’s not the square serifs alone but also the proportions of the letterforms: narrow B E R against wide D G.</p>
      <p>Couldn’t you just modify the R’s end (lift it up) and cut off the G’s bottom serif (or lift it a bit so it sits higher than the E’s serif) in Illustrator?</p>
      <p>Even if you space versals tightly: BR is too close, and RI too wide. As to DG, I would overlap the curves completely. (I have no image at hand, but if you go <a href="http://www.kltf.de/kltf_litteratra.htm" target="_blank">here</a> and then click on “glyph set” in the top right menu, there are DO OC OG ligatures which may illustrate what I mean.)</p>
      <p>Karsten</p>
