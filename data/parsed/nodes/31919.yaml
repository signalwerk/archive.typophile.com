    html: |-
      <p>I believe <a href="http://www.fontbureau.com/fonts/Whitman" target="new">Whitman</a> will do what you want:</p>
      <p></p><div class="imageWrap"><img src="/files/Bridge_Whitman_5240.gif"></div><p></p>
      <p>BTW, your use of the term “bracketed” is opposite to how it is usually used. When the transition from the stem to the serif is “curvy” and gradual, then the serif is said to be <em>bracketed.</em> When the transition is abrupt, as in a design like Trump Mediaeval, then it is said to have <em>unbracketed</em> serifs.</p>
      <p>— K.</p>
    html_clean: |-
