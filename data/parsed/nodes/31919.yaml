  html: <p>Does anybody know of a font similar to Trump Medieval that might fix my predicament? Or maybe just offer a suggestion. I’m trying to squeeze this letters together really tight, and it’s causing some unappealing results. I’ve circled the parts in the attachment that are bugging me. I can break it apart, and tweak it in Illustrator, but I have some other places where I’ll be using the same typeface. I would like them to come together easily for a straight kind of “bridge” effect with the text, if you know what I mean. Thanks a bunch!</p><div class="imageWrap"><img src="/files/bridge_5349.gif"></div><p></p>
