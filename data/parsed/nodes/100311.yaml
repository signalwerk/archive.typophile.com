      <p><em>The trema ¨ should be at exactly the same hight as the i-dot.</em></p>
      <p>I usually make it lower.<br>
      The principle is well demonstrated in Times:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dieresis_3544.png"></div><br>
      The ﬁrst “fül” is the composite character from the font. In the second “fül” I have vertically aligned the dieresis with the tittle, causing it to ﬂoat up high among the ascender serifs, dissociated from the letter it is supposed to be qualifying.<br>
      The jä combination is frequent in Finnish, where it can be seen that varying alignment of the accents improves distinction. <p></p>
      <p>See also:<br>
      <a href="http://typophile.com/node/40439" title="http://typophile.com/node/40439">http://typophile.com/node/40439</a><br>
      <a href="http://typophile.com/node/17484" title="http://typophile.com/node/17484">http://typophile.com/node/17484</a></p>
