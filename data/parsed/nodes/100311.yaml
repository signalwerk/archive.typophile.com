      <p>News fonts have massive x-heights for good reason - those proportions are not ideal for things like books. You can use smaller point sizes to avoid it looking horsey, but the main problem is there's little room for ascenders and descenders to play their important role in immersive reading (whereas reading a newspaper tends to be much more erratic and environmentally challenged, hence the need for good visibility = large apparent size = large x-height).</p>
      <p>hhp</p>
