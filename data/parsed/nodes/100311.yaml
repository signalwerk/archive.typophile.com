      <p>As hrant said, a custom font would be the solution.</p>
      <p>I did a quick search focusing the diacritics, but not paying much attention to resemblance with Quiosco. Regarding the available serif families with good diacritics and underlined ª and º, you may consider: Greta Text, Kingfisher, Tundra Pro, and Malabar. Some other quite different from Quiosco: Rooney Pro, Museo Slab, and Scotch Modern.</p>
      <p>Without the underlined ª/º but still presenting good diacritics: Argos, Calluna, Charter Pro, Guardian Text, Iowan OldStyle, Karmina, Freight, Marat Pro, Utopia, Alcala, PT Serif, Sina Nova, Sirba, Whitman, and Stuart Pro.</p>
      <p>SIL offers free derivations from Charter (Charis) and Times (Doulos), besides the original Gentium, all with underlined ª/º.</p>
      <p>Avoid Meta Serif. Its diacritics are a disaster to set up texts in Portuguese.</p>
      <p>Note that almost all fonts use diaresis (trema) smaller than dot, especially in ï, although many adopt a subtle size variation. And Ezset is still quite rare –from the lists above, I think just Calluna, Rooney, and PT Serif include it.</p>
      <p>A <a class="freelinking external" href="http://www.myfonts.com/search/char%3Aß+serif/fonts/" rel="nofollow">MyFonts search</a> may help.</p>
      <p>[edited to add SIL fonts.]</p>
