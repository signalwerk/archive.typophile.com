      <p>Ah, lovely quick response! The mark came from a bunch of doodling I did in the margins of my notebook, imagine that!</p>
      <p>I was wondering about it being too tight, the glyph designs have unique serif designs and as such I couldn’t make up my mind if it was ok to overlap them. There was even a slight mod. to the leg of the _L_ for spacing reasons...I’ll rethink my name.</p>
      <p>Maybe I should stick to original ideas and stop thinking so much, that’s what I did with the mark. The back was originally just the two colors, like you suggested.</p>
      <p>I shall report back!</p>
