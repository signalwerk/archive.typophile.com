      <p>I would echo the comments of Miss Tiffany...</p>
      <p>..and add that I’m not sure your choice of typeface reflects the interesting logo you have designed yourself. I like your logo design and think you could also push the layout a bit further. </p>
      <p>As a starting point I like the way the logo sits on the front, however I think you could be a bit more adventurous with the layout of the text, maybe reflect the shape of the logo a bit more... don’t be afraid of leaving white space? Maybe overlap some of the text on top of the logo in the way that the ’d’ and ’b’ interact with each other?</p>
      <p>The back does’nt match the design you have on the front, maybe keep it simple like the front without the text, or an abstract version of the logo?</p>
