    html: |-
      <p>Love the mark and the colors!</p>
      <p>For how tight you’ve spaced the letters in “Dave Bailey”, the word spacing isn’t tight enough. (I do think you’ve spaced it too tightly for the typeface.)</p>
      <p>I’m not sure about the em-dashes surrounding your titles.</p>
      <p>The three lines that follow need more line-spacing.</p>
      <p>I’m might consider make your name smaller and try left-justifying instead of right.</p>
      <p>I’m not sure about the white outline on the back. Or the white box for that matter. Gratuitous maybe? What if you just had the two lines/boxes of color? This would echo the logo and be more subtle.</p>
    html_clean: |-
