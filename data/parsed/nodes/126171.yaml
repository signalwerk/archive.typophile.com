    <p>First of all, let me say how happy I am typophile is back online! I've checked for years now. I don't know when it happened, but FINALLY!</p>
    <p>I am looking for recommendations on fonts for a book about the history of the Portuguese "founding" of Brazil circa 1500. It's a scholarly critique of a contemporary piece of writing on said history, so I'm looking for two fonts to contrast the historical and the contemporary. One possibility is that I switch between which font is used for headlines, while using the other for body. Perhaps the piece being critiqued has it one way, while the critique itself has it the other way. My other feeling is that I use a modern clean font for headlines, and a more traditional serif for the body. That's not ultimately important right now, but the more information the better, right?</p>
    <p>On the contemporary side, I found a font from a Brazilian studio that I liked, Ofelia: <a href="http://www.myfonts.com/fonts/blackletra/ofelia-std/">http://www.myfonts.com/fonts/blackletra/ofelia-std/</a><br>
    On the historical side, and from the same source, is Garibaldi: <a href="http://www.myfonts.com/fonts/harbor-type/garibaldi/">http://www.myfonts.com/fonts/harbor-type/garibaldi/</a>   I found it quite interesting that the second example in the carousel actually references Portuguese.</p>
    <p>I'm curious if there are other options out there for either font, but especially the historical font I need. On the one hand, the timeframe in question is only 50 years after Gutenberg so some sort of blackletter might have been common in Portuguese book design, but I think those are going to be a little heavy-handed and I don't want run the legibility risk either. Are there other humanist fonts from this time I could look at? (Centaur/Jenson Venetian fonts come to mind but perhaps something else I haven't heard of, or hopefully, created by a Portuguese designer.)</p>
    <p>Thanks,<br>
    -E</p>
