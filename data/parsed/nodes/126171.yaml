      <p>Hi, Evan, how's things?<br>
      First off, I've posed the same question to myself when I first started enjoying type design. Unfortunately the answer is NO, there is no original aldine portuguese types. The first typefaces in Portugal were Hebraic, founded in the Algarve region in the early 1500 (currently the books printed with those faces are in England, stolen like many other works of art in the piracy heydays).<br>
      Most early printers worked with German founders and there never was any local design/foundries doing aldine, or even baroque.<br>
      As a portuguese native you can imagine my frustration with this outcome to my queries.<br>
      If you're looking for contemporary portuguese designed typefaces there's a good number of fine people working at it, like Dino dos Santos, and even more so in Brazil (even tough it's not Portugal, different country, not the same), that you can see and sample today.<br>
      Hope I was helpful in someway!</p>
