    <p>I’m pleased to announce two new single font releases.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Abendschroth_5_T2_5108.png"></div><p></p>
    <p><a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/abendschroth/" rel="nofollow">Abendschroth</a> is a dreamy and whimsical typeface for novel titlings and other fiction headline settings. Also a sophisticated choice for lullabies, girl’s literatur, murder poems, short stories and christmas gift books.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Albyona_schnee_T_3777.png"></div><p></p>
    <p><a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/albyona/" rel="nofollow">Albyona English Nº 1</a> is also nice for titlings and headings in novels or fairy tales. It has a sentimental flavour of history, memories and the good-old-days feeling. Suitable for children’s books, fantasy literature, crime novels, natural food packaging and poison labeling, for infancy memories, vanitas kitsch items, dungeon museum bar menu cards, introductions to herbalism and witchcraft manuals.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Albyona_alph_T_4382.png"></div><p></p>
