      <p>Maybe I'm missing something, but if you just want your features in an external file (which is maybe not the only thing you're wanting to do), you can just put something like this at the bottom right pane of the OT panel:</p>
      <pre>include(myfeatures.fea)</pre><p>
      The .fea file would be in the same directory as the .vfb file in this example.</p>
