    html: |-
      <p>Matthew,</p>
      <p>resetting the features is possible if you don't use the command codes, but set the python attributes directly:</p>
      <pre>fl.font.features.clean()
      fl.font.ot_classes = "" # to clear the lower right part of the OT panel
      fl.UpdateFont()
      </pre><p>
      Loading feature code from a text file can probably be done, but it would be a bit more complicated. In principle, open a text file using python, detect the lines where one feature's code starts and ends, and add the feature to the font like this:</p>
      <pre>fl.font.features.append(Feature(myFeatureTag, myFeatureCode))
      fl.UpdateFont()
      </pre><p>
      Example:</p>
      <pre>fl.font.features.append(Feature("liga", "feature liga\n  {\n  sub f i by f_i;\n  } liga;\n"))
      fl.UpdateFont()
      </pre><p>
      hth,<br>
      Jens</p>
