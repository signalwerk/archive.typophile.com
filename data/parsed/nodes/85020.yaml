    html: |-
      <p>Well, you can easily change things in the external file, save and then hit compile in FontLab. It's really only one extra step (saving in the text editor), if you don't count switching between programs.</p>
      <p>Also, you can duplicate the external file, and "include" that instead, if you want to try different things out without messing with your official features file. It also works with more than one file (each on a separate "include" line), so you can break things out logically among multiple .fea files if you wish.</p>
