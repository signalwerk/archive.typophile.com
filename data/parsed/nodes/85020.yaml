  html: |-
    <p>I know how to compile OT features from inside a python macro:</p>
    <p>fl.CallCommand(33203)</p>
    <p>33203 being the code for the menu command OTCompile.</p>
    <p>Fontlab also provides codes for the menu commands OTFeaturesNew (33222), which resets the features, and OTFeaturesOpen (33210), which gets features from a file.</p>
    <p>The problem with OTFeaturesNew (33222) is that it pops an alert asking if you really want to remove all OT data.<br>
    The problem with OTFeaturesOpen (33210) is that it pops a dialog to select the file.</p>
    <p>I would like to be able to:</p>
    <p>+ reset the OT features WITHOUT popping an alert (ie. silently)<br>
    + get features from a specific fea file WITHOUT popping a dialog</p>
    <p>Can it be done?</p>
