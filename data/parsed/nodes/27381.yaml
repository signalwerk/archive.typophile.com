    html: |-
      <p>You can use kerning in a dynamic text field but only in Flash 8 for PC. Still there is no way of having kerning in input text. So in a flash font tester one has to separate input text and display text (with kerning). See my <a href="http://www.fonts.info/flashtest/flashtyper.html" rel="nofollow">example</a>.</p>
      <p>Ralf</p>
      <p><a href="http://www.fonts.info" title="http://www.fonts.info">http://www.fonts.info</a></p>
