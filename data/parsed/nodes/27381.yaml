    html: |-
      <p>Only when I found this thread did I discover that it's not possible to kern input fields. However, this is the fix I'm using just now:</p>
      <p>Firstly, make sure:<br>
      - You have an input TextField created<br>
      - You have setup a TextFormat object with 'kerning' set to true and 'letterSpacing' set to, for example, -1.</p>
      <p>Then use the following code:</p>
      <p><code><br>
      myTextField.onChanged = function():Void {<br>
      myTextField.setTextFormat( theTextFormat )<br>
      }<br>
      </code></p>
      <p>I hope that helps. If I've missed something and it's actually not a fix, please let me know!</p>
      <p>Edit: I just realised this thread's more than a year old :D</p>
