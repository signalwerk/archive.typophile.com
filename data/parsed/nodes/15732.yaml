  html: <p>Hi. I'm looking for information and recommmendations on where to source a budget-friendly yet useful collection of fonts for students of a 3rd level course in graphic design. The collection would need to familiarise the students with all the important typefaces, historically and aesthetically. The budget is 2,500 euro or thereabouts. Any clues?</p>
