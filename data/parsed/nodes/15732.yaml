    html: |-
      <p><a href="http://www.adobe.com/education/ed_products/typeclassics.html" rel="nofollow">Adobe Type Classics for Learning</a> ($99!) is the best overall value for a starter set.</p>
      <p>Add to it with a larger library of "classic" fonts. Bitstream's <a href="http://www.myfonts.com/info/bitstream-type-odyssey-2/?refby=typographica" rel="nofollow">Type Oddyssey</a> (1,450 fonts for $1495) or the <a href="http://www.myfonts.com/info/linotype-font-cds/#LinotypeEssentialsCDs?refby=typographica" rel="nofollow">Linotype Essential CDs</a>. Make sure you ask about an educational discount.</p>
      <p>Finally, top it with the best of contemporary typefaces with any of the <a href="http://www.fontshop.com/products/libraries.cfm#fontfont" rel="nofollow">FontFont CDs</a>. They offer a 30% educational discount.</p>
    html_clean: |-
      <p><a href="http://www.adobe.com/education/ed_products/typeclassics.html" rel="nofollow" class="link-external">Adobe Type Classics for Learning</a> ($99!) is the best overall value for a starter set.</p>
