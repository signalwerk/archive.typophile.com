    <p>Hi guys,</p>
    <p>Alright, we’re doing research on producing material for an Olympic bid.<br>
    We do have some research collected, but there’s so much nice stuff out there i’m sure that you guys know of.</p>
    <p>Anything from fonts made for different olympics, graphic manuals, moodshots, anything you can think of.</p>
    <p>Our project is a winter olympic, but all the stuff that’s integrated into summer olympics are also relevant.</p>
    <p>Typography is very interesting, i know there was a font at fountain.nu that was bought by (Vancouver’s?) olympic bid to be their proprietary font, but i cant seem to find it any longer.</p>
    <p>Thanks!</p>
