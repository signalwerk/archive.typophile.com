    html: <p>Part of the problem with this question is that it is highly subjective. In some ways, those typefaces with a bent towards the humanist are feminine and those that are bent towards geometric are masculine. Oh wait, what about grotesk. Perhaps Grotesk can fall in between, switch hitters so-to-speak depending upon how they are used. But then again all three styles could be either or depending upon how they are used. And what of typefaces like Meta? <br> <br>Metro, Gill, Parisine (Clair) --&gt; More Feminine <br>Futura, Gotham,</p>
