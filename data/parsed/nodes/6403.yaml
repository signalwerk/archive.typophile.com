    html: <p>In my opinion the epitome of femininity is script (IMO!) And Jill Bell a big name in type deisgn and I find many of her types to have a strong feminine flourish. <br>Also not designed by a woman... but i have always felt that Gill's Joanna is a very feminine face, if you need something for text... or there's ITC's Leawood....</p>
