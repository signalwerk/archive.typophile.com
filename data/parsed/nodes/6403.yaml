  html: <p>Hi Guys, <br> <br>I am currently doing a uni projet in which i am making a brochure all about how to be a man, but i am presenting it in the most feminine way possible.  <br> <br>I would like some expert opinions on some great feminine fonts out there, preferably designed by great female typographers. <br> <br>Many thanks in advance! <br> <br>Cheers, <br> <br>Ken</p>
