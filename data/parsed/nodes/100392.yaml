    html: |-
      <blockquote><p>converted by ALLTYPE</p></blockquote>
      <p>This company/tool? <a href="http://www.alltype.biz/proatc.php" title="http://www.alltype.biz/proatc.php">http://www.alltype.biz/proatc.php</a></p>
      <p>What I am getting at is that, Times-Roman and the many other variations of Times are well established commercial fonts, the most ubiquitous and well known versions of which are licensed by Monotype (Linotype) and Adobe. There are numerous versions knocking around which are advertised as freeware but are basically re-distributed without the permission of those foundries and developers that produced the digital files. My concern is that you have modified another font to add your characters to and it is not clear how the original file was licensed or what its origin is. This is problematic in a number of ways but it also means that advertising your version of the font as usable for commercial work is misleading, as without knowing the full heritage of the file and licensing, supported by a recognised or robust EULA, it would be difficult if not impossible for a commercial entity to take advantage of the font.</p>
      <p>You could avoid these issues by placing your original character set inside a new font file and applying clean metadata with a clear license and/or usage guidelines. Considering that you would like your data to be available for commercial usage but with a clause prohibiting modification, you might consider the <a class="freelinking external" href="http://creativecommons.org/licenses/by-nd/3.0/" rel="nofollow">Creative Commons Attribution-NoDerivs 3.0 Unported (CC BY-ND 3.0) license</a>. While this license is not mindful of fonts specifically (though it is used in association with the <a class="freelinking external" href="http://fontstruct.com/faq/licensing_legal_questions/an_overview_of_licensing" rel="nofollow">fontstruct font creation tool</a>), it is well established and covers your criteria.</p>
