      <p>Virtually no Armenian fonts have no Latin. It's actually good to include a Latin, the problem is few people actually make it themselves. :-/  The good news lately is the availability of good (or at least decent) open-source fonts that one can add an Armenian to. However this doesn't solve another problem: people who make Armenian fonts and give them away* have rarely spent the time learning to do it right (just like in Latin, actually).</p>
      <p>* Notable here is that few open-source fonts allow you to make money selling such derivations.<br>
      <a href="http://typophile.com/node/99972" title="http://typophile.com/node/99972">http://typophile.com/node/99972</a></p>
