    <p>Hi, my name is Sami A. Mandelbaum and I like to share my hebrew font "Pirkei Avot".<br>
    The design is based on a caligraphic font from a "Pirkei Avot" book.<br>
    This font is complet with Nikud and Teamim.<br>
    I am not a designer and I am better at programing or reprograming opentype features.<br>
    Please, try to be nice with the critics.<br>
    I hope you enjoy.<br>
    Sami</p>
