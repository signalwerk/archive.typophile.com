      <p>I can't think of any fonts that would fit your requirement in terms of preventing further modification once you have added and performed your own modifications, i.e., if you use a font that is subject to an open source, copyleft or other libre license, such as the GNU GPL (with or without font exception) then all the work that you do and release should (in the spirit of the license) be subject to the same terms and conditions.</p>
      <p>If you are willing to consider releasing under one of the open source licenses, such as discussed in <a class="freelinking external" href="http://typophile.com/node/97575" rel="nofollow">the open source typefaces thread</a> then you would probably find the <a class="freelinking external" href="http://www.fontsquirrel.com/" rel="nofollow">Font Squirrel site</a> to be the best single resource for finding something to match your needs.</p>
      <p>In some ways it comes down to this, it is inherently unfair, in my opinion, to take something designed by someone else, modify it and then ask that other people respect your wishes in <em>not</em> doing what you have done, particularly if you have no agreement with the originator of that data/design.</p>
      <p>From the perspective of your design, I would suggest that you consider releasing a clean font with just the characters created by you to support Hebrew. It would not be the first time that I have seen such a font with no Latin support, and with the design and data being yours from a legal and ethical perspective (though that is open to debate as well) you could place whatever restrictions or lack thereof on the font.</p>
