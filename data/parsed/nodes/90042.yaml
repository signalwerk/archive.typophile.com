    html: |-
      <p>In the case of <a href="http://en.wikipedia.org/wiki/FF_Scala" rel="nofollow">Scala</a>, opening up the counters definitely adds to its intended use. Martin Majoor conceived the typeface at the end of the 1980s with low resolution output devices in mind (such as the 300 ppi desktop laser printer). Hence also the slab serifs. So, a kind of ink trapping, indeed — or rather “pixel trapping”.</p>
      <p>But the open counter of P has a much older, palaeographic origin. (Deviate the “Roman” (= Old Italic / Western Greek) Π (Pi) from the Greek Ρ (Rho).) Cfr the Trajan capitals, most Garamont interpretations, Palatino, &amp;c.</p>
    html_clean: |-
      <p>In the case of <a href="http://en.wikipedia.org/wiki/FF_Scala" rel="nofollow" class="link-external">Scala</a>, opening up the counters definitely adds to its intended use. Martin Majoor conceived the typeface at the end of the 1980s with low resolution output devices in mind (such as the 300 ppi desktop laser printer). Hence also the slab serifs. So, a kind of ink trapping, indeed — or rather “pixel trapping”.</p>
