      <p>That doesn't work because -like any other small feature-<br>
      the gaps will be rendered differently depending on size,<br>
      closing entirely below a certain threshold*, completely<br>
      changing the character of the design.</p>
      <p>* And this threshold will furthermore<br>
      vary depending on the character since<br>
      the size of the gap varies.</p>
      <p>hhp</p>
