    <p>Every time I mention some object, I find that nobody today, except for a dwindling few, knows what I am talking about, so I have been grabbing pictures of admats, transposition brackets (I was later a telephone lineman), Paige compositors (always a lit major: Mark Twain invested heavily in this just when Ottmar was busy with his invention) and the like to explain.</p>
    <p>I should like to use your image of the linotype matrix 14919.jpg found on Google Image search (which lists the link as broken) in my work. I give good attribution with a link to your site, and I offer a copy of my eventual CD, if you would care to have one. Whom do I contact?</p>
