    <p>I was wondering if anyone has played around with using the new stroke width tool in Illustrator CS5 and had any luck bringing the stroke (after outlining the path) into Fontlab.</p>
    <p>Copy and paste really makes a mess out of the shape. Has anyone had better luck?</p>
    <p>D</p>
