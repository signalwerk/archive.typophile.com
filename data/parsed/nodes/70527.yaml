    html: |-
      <p>I've just tested it, and it works well. I mean, the shape in Illustrator after outlining the stroke (or choosing Object / Expand Appearance) already looks quite poorly, but FontLab Studio essentially gets 100% of what Illustrator has. I've just tried Illustrator's "Simplify" at 97% Curve precision after outlining the shape, and then FontLab's Optimize (with some conservative settings), and the results are quite nice. </p>
      <p>Of course, keep in mind that it's best to maintain 1:1 scale between Illustrator and FontLab Studio, so it's best to work in pt units in Illustrator, where 1 pt corresponds to 1 font unit in FLS. But this has always been true. </p>
      <p>One important thing: since version CS4, Illustrator has the concept of Artboards, which FontLab Studio knows nothing of. To make FontLab Studio understand the placement of the objects, you need to choose View / Rulers / Change to Global Rulers before copy-pasting. </p>
      <p>I have just posted an updated <a href="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/working-with-illustrator-and-fontlab-studio-updated-for-illustrator-cs5-t7596.0.html" rel="nofollow"><strong>Guide for working with Illustrator and FontLab Studio</strong></a> on the FontLab forum which you may find helpful. </p>
      <p>Best regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
