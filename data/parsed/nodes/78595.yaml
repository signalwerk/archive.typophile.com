    <p>Type@Cooper and the Herb Lubalin Study Center have joined together in conjunction with the TDC to offer a public lecture series.<br>
    The lecture series is still closely tied to the curriculum of the typeface design program. These lectures are free and open to the public. Here are the next two lectures being offered. For more information about the program visit <a href="http://coopertype.org/" title="http://coopertype.org/">http://coopertype.org/</a></p>
    <p>What You Should Never Do With Type And Why<br>
    Matteo Bologna<br>
    Monday, February 7, 2011, 6:30 pm<br>
    The Rose Auditorium in the New Academic Building<br>
    41 Cooper Square at East 7th St, New York, NY </p>
    <p>Mr. Bologna will talk about the reasoning that informs the choice of typefaces during the design process. Why does the designer choose certain typefaces instead of others and what do these choices mean for the audience? Mr. Bologna will accomplish this by exposing the behind-the-scenes operations of Mucca Design.</p>
    <p>Type Design as a Second Career:<br>
    W.A. Dwiggins Starts Over at Age 49<br>
    Paul Shaw<br>
    Monday, March 7, 2011, 6:30 pm<br>
    The Rose Auditorium in the New Academic Building<br>
    41 Cooper Square at East 7th St, New York, NY </p>
    <p>This talk will place Dwiggins’ type design efforts into the context of his wide-ranging career as a commercial artist, examining the impact of calligraphy, historical typefaces, stencils, marionettes and book design on his typefaces. It will explore his thoughts and theories about type design, especially the M-Formula which has had a far-reaching influence on contemporary digital typefaces. Dwiggins’ career will also be situated within the context of type design as a nascent profession in the 20th century.</p>
