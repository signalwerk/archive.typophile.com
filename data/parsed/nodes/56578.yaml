    html: |-
      <p>Queneau</p>
      <p>EDIT: to me the difference between calligraphy and lettering (as I practice it) is that the form that is laid down is not the "final word." I futz with it for hours on end!</p>
      <p>This is a tough topic to tackle... there are many facets to "hand" lettering. You are seeing the schisms as people post. Different people consider lettering to be different things (I noticed that you eschewed calligraphy BUT you have to remember that is is an integral part of understanding the tools). Tools can include the pencil and tracing paper, as well as ruling pens, chisel edged pens, brushes, round pens, square pens, pointed pens etc. ad infinitum. Then you can get into the division of commercial lettering artists, sign painters, sho card artists etc. (once again). What was lettering in the twenties is not the lettering of today. Engrossing is not the same as lettering of the '50's and is not the same as today. What they did for movie posters is not the same as they did for titling on product... is not the same as they did for grocery store windows... so you can see that it is a DIVERSE field.</p>
      <p>It is funny, as many of my lettering heroes reside in different camps. Some are calligraphers, others are sho card artists, sign painters, "lettering artists," and the list continues. </p>
      <p>As far as books... the chronologies are the best, but they do not show step by step. It is material that is meant to be absorbed, possibly copied until you get your wings, and or are inspirational in nature. The 21 editions of the speedball books is a good place to start, AS WELL AS some of the other stellar recommendations.</p>
      <p>I know this is disjointed and disheveled but it is better than if I delineated every thought I had on the subject. Talk about War and Peace : )</p>
      <p>Lettering Today<br>
      The ABC books by Eric Lindegren<br>
      Calligraphy Today by Heather Child (lots of lettering in there)<br>
      Creative Stroke (1 &amp; 2)</p>
      <p>These are fairly contemporary... 60's on. See the other similar thread that is going on for some more selections.</p>
      <p>Oh my goodness the list is endless and the books cover my walls in multiple rooms. So decide what facet you want to explore and let me know and I will send you a list!</p>
      <p>Michael</p>
