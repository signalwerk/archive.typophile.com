    html: |-
      <p>@Michael</p>
      <p>Thanks for your very elaborate and helpful post! I realise that lettering is a difficult field to define, and I try not to narrow myself down to one thing now, but the thing I am most interested in at the moment is the construction of letters, less so the 'writing' of letters. (I hope you catch my drift) It's not that I want to exclude calligraphy from the equation, but this is not the direction I am most interested in. I would like to learn how to create/build letters by hand, which don't neccesarily look like handlettering. So it's more Paul Renner than Hermann Zapf :-)</p>
      <p>To me letters are the kind of of base material to work with, like a set of shapes that can be combined and constructed (almost like Lego, perhaps also in 3D). So letters can be used to form words, but might as well be like concrete poetry, without semantic meaning attached...<br>
      It's sounds rather vague doesn't it??</p>
      <p>It's hard to explain, as I don't really have an example of the kind of things I'd like to be doing. I hope it clarifies a little what I am looking for though... </p>
      <p>cheerio Queneau</p>
