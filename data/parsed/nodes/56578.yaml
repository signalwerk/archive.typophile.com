    html: |-
      <p><em>Hand lettering is not something you trace and draw.</em></p>
      <p>It can be. There are many techniques of lettering, including the "built up" method, which is basically drawing the outline of the letters and then filling them in. You will see this covered in most how-to books about lettering. The page on the Letterheads site describes the typical method of showcard lettering, in which production speed and efficiency is most important, and usually only a brush and a minimum number of strokes is used for the finished lettering.</p>
