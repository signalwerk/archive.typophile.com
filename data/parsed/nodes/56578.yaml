      <p>Nice list from <a class="freelinking external" href="http://www.signmuseum.net/library/topbooks.asp" rel="nofollow">The American Sign Museum</a>. Those Speedball manuals are usually available on eBay although more recent editions are more common and cheaper. Most, if not all, of the plates from the Atkinson at the top of the list were still available recently in a book called "A Book Of Art Nouveau Alphabets And Ornamental Designs" which was published by Main Street Press. I think this might be what they are referring to as the 1980s &amp; '90s editions. You should find that on Abe or Amazon. </p>
      <p>Old lettering books do sometimes appear very cheaply on Abe. I think the professional second-hand dealers mark them down because they've got a few paint splashes or pencil drawings in them, but that actually adds to the charm.</p>
