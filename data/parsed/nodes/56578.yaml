      <p>Interesting pointers guys! Thanks!</p>
      <p>@David and Dave: You're probably right that it might still be good training to trace letters, so I will probably do this as well. Freehand lettering is more my 'thang' though. As to which methods I would likely use: as I said earlier it is not really calligraphy, but more like the "built up" method Mark described. In that sense it's closer to drawing than writing I presume. I don't know how people learnt this before, and this is what I'm interested in. I don't think I will start making fonts from my drawings any time soon, they are more one offs, and would lack the consitancy and characters to make it into one.</p>
      <p>@Phrostbyte: Thanks for the link, that's great! You have a point about lettering, though I'm likely to combine the method you talk about (using a brush to form the letters) with the "built up" method. I'll be using it for more 'expressive' purposes, probably not for extended pieces of text (though I might use it for this in the future)</p>
      <p>@Stephen: thanks for the link! I once attended a lecture by Wigger Bierma (from Werkplaats Typografie) and he also stressed this difference, with a certain disdain for lettering. He definately thought typography was a higher and nobler discipline than mere lettering. I don't share his views though :) I think they both have their using and can be used side by side. I won't give up the one for the other that for sure! </p>
      <p>cheerio Queneau</p>
