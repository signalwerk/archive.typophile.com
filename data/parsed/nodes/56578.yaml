      <p>Believe it or not Queneau, Herr Zapf's letters are more drawn than they are calligraphic. In the formation of a letter he employs many small strokes to achieve the form. It is, in essence, a building process. Most assume that letters so elegant would be done in a fluid motion but they are not. </p>
      <p>Michael</p>
