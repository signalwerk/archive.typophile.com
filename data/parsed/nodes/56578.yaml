    html: <p>I would have to agree with David here. If you trace a couple different styles of type, your hand will start to become used to the 'movement' of the type. From there, you can do what I do and draw yourself a baseline, x and cap height on a piece of paper then draw that same type freehand. Even if your new drawings aren't perfect 'tracings' you're still teaching your brain and arm how type flows. You're essentially creating the Queneau Caslon or Queneau Bodoni or Queneau Fette Fraktur. Get it?</p>
