    <p>Hi,</p>
    <p>I'm looking for good books on learning handlettering (not calligraphy). I'm interested in learning to write/draw letters of various types (serif, sans-serif, dispay) mainly for the use in titling, display and short texts. So I'm looking for a good manual to teach me these things. I know several cartoonists also do some great lettering (Chris Ware for instance), so any books from this field would also be very welcome.</p>
    <p>Thanks!</p>
    <p>cheerio Queneau</p>
    <p>PS: I've tried to search in the typophile database before I started this thread, but it gave no results at all. Is there some problem with the search engine?</p>
