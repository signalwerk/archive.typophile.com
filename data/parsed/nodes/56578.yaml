      <p>One of the exercises I run myself through (and it's fun too) is to try to exaggerate the letterform in new and in interesting ways. While that aspect is fun the learning part comes in as you're doing it - take notice of what letter attributes characterise a form as one letter, and not another; or the similarities and differences between uppers and lowercases.</p>
      <p>It's also a good exercise to loosen up the brain and get the gears spinning.</p>
