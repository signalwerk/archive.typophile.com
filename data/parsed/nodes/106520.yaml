  html: |-
    <p>Hi,</p>
    <p>I wanted to try out the TypeFacet autokern script. I'm using it with Anaconda. When I run the script, I get the following error:</p>
    <p><code>$ env PYTHONPATH=dependencies/RoboFab/lib:dependencies/pystache:dependencies/svgwrite:dependencies/PyYAML/lib:dependencies/FontTools/Lib:python/src-main python python/src-main/autokern/Autokern.py --ufo-src-path python/src-main/autokern/Regular.ufo --ufo-dst-path out/Regular-kerned.ufo --min-distance-ems 0.00 --max-distance-ems 0.00 --max-x-extrema-overlap-ems 0.0 --intrusion-tolerance-ems 0.0 --precision-ems 0.005 --log-path logs --kern-samples-only</code></p>
    <p>Processing configuration...<br>
    Renaming old logs folder to: logs.2<br>
    Error: 'NoneType' object has no attribute 'endswith'<br>
    Traceback (most recent call last):<br>
      File "python/src-main/autokern/Autokern.py", line 3248, in<br>
        autokern.process()<br>
      File "python/src-main/autokern/Autokern.py", line 3188, in process<br>
        self.configure()<br>
      File "python/src-main/autokern/Autokern.py", line 373, in configure<br>
        self.configureLogging()<br>
      File "python/src-main/autokern/Autokern.py", line 335, in configureLogging<br>
        srcCssFile = os.path.abspath(os.path.join(TFSProject.findProjectRootFolder(), 'data', 'styles.css'))<br>
      File "/Users/pascal/anaconda/lib/python2.7/posixpath.py", line 77, in join<br>
        elif path == '' or path.endswith('/'):<br>
    AttributeError: 'NoneType' object has no attribute 'endswith'</p>
    <p>Somehow it has to do with that findProjectRootFolder() doesn't return anything. However, I have no idea how to fix this. Any ideas, anyone?</p>
    <p>Cheers,<br>
    Pascal</p>
