    <p>Hey guys,</p>
    <p>Totally off the subject of typography, but I have a question about PDFs.</p>
    <p>I am trying to create editable fields and am able to do so inside Acrobat (I'm on 8 now, but created the form back in 6). I am able to edit the fields myself and save the PDF, however, when I send the form out to others, some are able to save it and some can't. For those who can't it gives a warning "Please fill out the following form. You cannot save data typed into this form. Please print your completed form if you would like a copy for your records."</p>
    <p>I know the IRS has forms like this online. The same people who can't save my PDF can fill out the IRS' and save it. So I don't know what's going on. Does anyone have any ideas of what I'm doing wrong or not doing at all?</p>
    <p>Thanks for the help!</p>
    <p>John</p>
