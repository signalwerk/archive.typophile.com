    html: <p> So it's called Tuscan, huh? This particular typeface is from a Rawlings catalog and is called "Fancy". (See also "Pittsburgh Pirates Typeface" posting.) I just now found a very similar one on the MyFonts website called "URW Wood Type D".  <br> <br>And I made a mistake on the team myself. It's the Pittsburg Pirates that use a similar typeface and not the SF Giants. I reversed the two names. Oops. </p>
