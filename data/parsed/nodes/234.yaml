    date: 2002-04-10T10:22:00
    votes: null
    html: <p> These are great, Tom. Where are you finding them? <br> <br>It's strange how many sports teams use Tuscan lettering. Our local New York Mets feature Tuscans in both their 'NY' monogram and the words 'NEW YORK' spelled out on their jerseys (or at least on the tie-in merchandise they license...) At least one of the 'Sox' teams uses a Tuscan as well, though I've forgotten which, and I'd hate to make a clay-footed blunder by guessing. (The only topic more contentious than font piracy is sports.) <br> <br>I'm collecting Tuscans for a project, so if you come across any others, I'd love to see them. </p>
  - id: 136173
    user_id: 101
    user_name: hoefler
    user_path: null
    date_raw: 10 Apr 2002 — 11:08am
    date: 2002-04-10T11:08:00
    votes: null
    html: <p> Tuscan's not the name of the typeface, it's the general species. "Tuscan" letterforms are those that have bifurcated (fishtail) serifs, and more often than not, some sort of ornamentation midway along the stems. For obvious reasons, the phototype crowd used to refer to this style as "pineapple type." <br> <br>Adobe's got a couple of Tuscans in their various Wood Type collections. And if you look very carefully at the banner at www.typography.com, you'll see some Tuscans lurking in the background. Another project to come... <br> <br>I'd love to get that Rawlings catalog. Could I trouble you for some more information about it? (Name, date, etc.) </p>
