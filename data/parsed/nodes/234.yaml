    date: 2002-04-10T13:25:00
    votes: null
    html: "<p> By the way, if you're interested in Tuscans, check out Nicolete Gray's \"Nineteenth Century Ornamented Types and Title Pages,\" and Rob Roy Kelly's \"American Wood Type: 1828-1900.\" They're both annoyingly out of print, but a good library should have them. They're both chocked full of Tuscans. </p>"
