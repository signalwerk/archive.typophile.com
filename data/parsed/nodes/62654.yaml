    votes: null
    html: |-
      <p>The × does indeed signify hybrid (cross-breeding). I believe that horticultural style guides vary on whether there should be space following the × or not. I think the current tendency is closed up, whereas previously it was open.</p>
      <p>In many typefaces, the design of the × has it raised above the baseline slightly, depending upon the default figure style. If this is the case and you're using a closed-up style (with no space after), then I suggest you try baseline shifting it down to the baseline (or center on the x-height is also an option).</p>
