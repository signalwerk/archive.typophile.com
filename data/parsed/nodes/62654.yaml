    html: |-
      <p>That's a multiplication sign. There are other glyphs to indicate multiplication as well, but “×” apparently is also used in botanical taxonomy to indicate hybrids. Spacing and kerning probably should be handled as it would be as a math symbol. </p>
      <p>I reason this only by parsing your question and not any extensive knowledge of the relevant subject.</p>
