    <p>Fragaria ×ananassa = strawberry</p>
    <p>Citrus ×sinensis = orange</p>
    <p>I'm putting together a few fancy pictures of fruits and veggies and have placed the Latin names as labels to the macroshots of the food.  My copywriter provided me with the correct words, however there is a strange "×" symbol that I have never encountered before.  What does it stand for?  I'm treating the kerning as if it where a regular "x" character but is it suppose to be ascended or descended?</p>
