      <p>Awesome! I love it!<br>
      Great work!</p>
      <p>Some feedback:<br>
      - The top of the /a/ bowl can be closer to the stem. So the counter centerline has more slope.<br>
      - The weight on the /N/ should be on the diagonal stem, not in the verticals ones.<br>
      - Not sure about the /e/ in "New".<br>
      - In York: the /Y/ can be wider, and the /o/ narrower.<br>
      - The ribbon effect can be a little distracting, use it sparingly.</p>
