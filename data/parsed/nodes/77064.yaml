    <p>I'm working on some custom script and this is my first time trying to pull off something this ornate. I know there are some serious issues with this guy, but I'd love some helping identifying some priority fixes since this goes to print in less than 24 hrs. Any feedback would be very appreciated!</p>
    <p>Also, I started cutting away sections of the path where things overlap, to give it a ribbony, dimensional feel. Do you prefer with or without?</p>
