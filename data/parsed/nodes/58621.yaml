      <p>In the company we are five, one designer/developper (me), one 3D specialist and better developper than me, one dialogue writer and humorist, tow specialist/writer of role playing game since they play every rpg/strategy game that existe starting with the table game more than 25 years ago. We will make first games for iphone. One of our goal is to buy a licence of a french comics, humoristic, sort of futuristic Improssible Mission with losers, and make some 3-4 hours episode of some adventure/rpg fun games we sell like 5$ each episode. but before that we have two other games i can't tell about (because it's someting new and exciting )except that they could need a lot of bandwith for live fight and we have the right partner for that. So right now technically speaking everything is going well. We will also have an gameplay advantage but cant tell about because of the patent process. Another thing, our main target i to gently make casual gamers come to the world of hardcore gamers, our games will<br>
      be progressive enough not to affraid casual gamers, and gently evolve for someting more evolved/hardcore trough a learning curve sytem.</p>
      <p>So i have to find another name, but i love this logo i want to keep it. So i think i will call the others to make a brainstorming, i we need/want to the word 'angel' is needed or whatever, maybe 'flyingcoders' would be better, i just don't know.</p>
      <p>The quotation mark thing is only for use in Title, big size (the text will be bigger and the quotation smaller and i don't think<br>
      the ending quote will be the logo, i think i'll snap the head, it's too much)<br>
      right now this is the very beginning of the communication process and i think we will focus more on communicating about the games we will make than about the company's communication who will be more... i dont know (we have the knowledge and competence to do a 3D flash website it would be a shame not to do it for ourselve, but what's the story/message would be, again<br>
      today i don't know)</p>
