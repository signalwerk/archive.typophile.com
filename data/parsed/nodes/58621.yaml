    html: <p>I'm going to add to the sentiment regarding the disconnect between the mark and the company name. I understand your explanation, but I think for a logo it's just too much of a stretch. For me, the meaning and intent of a logo should be pretty obvious, and this just isn't. And even if the intent is for the consumer to put some thought into divining its meaning, I feel that the payoff just isn't there.</p>
