      <p>a domain name being available is (IMO) one of the weakest reasons for selecting a name. Using QuotAngel as an example ... it conjurs images of "quotation angels" which (to me at least) makes no sense.<br>
      Surely you can find a better name, and th edomain doesn't have to be the company name, it can be a related phrase, or unrealted phrase/word ... just make it memorable.</p>
      <p>As for the mark ... it's got potential I particularly like the reference to programming - the core difference between games. In the examples you've provided the mark overshadows the text and won't work at realistic text sizes (for quotes etc.)</p>
      <p>Without wanting to burst your bubble too much, I think you've approached the thing a bit arse about - i.e, developing identity/branding treatments without thinking the core message through.</p>
      <p>:)</p>
      <p>So with all that said ... enlighten us, what's the company about?  what's on offer? what's it going to do? what difference will it make? who will it make a difference to? how will it communicate?</p>
      <p>----------<br>
      <strong>Paul Ducco</strong><br>
      <a href="http://www.solid-creative.com" rel="nofollow">Graphic Designer</a> - Melbourne</p>
    html_clean: |-
