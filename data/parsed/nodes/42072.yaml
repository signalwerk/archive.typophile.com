  html: |-
    <p>When saving a slightly edited font in Font Forge I ran the validation check and got a string of errors (not caused by me — they were in glyphs I hadn’t touched). Almost all of them were of the kind “extremal points missing”. Are these errors that I should endeavor to correct? Are they serious in any way?</p>
    <p>TIA</p>
    <p>El.</p>
