    html: |-
      <p>Yes, you should always draw your outlines with points on the extrema. It is good habit, and it makes curves much easier to tweak and edit later one (by you or by someone else… if you are using FontForge, you’d probably be OK with other people editing your fonts later on down the line…)</p>
      <p>Also, it can play a role in hinting and on-screen rendering. No points at extrema = bad… unless you have a convincing design reason not to put them in a few particular spots… there are always exceptions to rules. But in general, it is good to do.</p>
