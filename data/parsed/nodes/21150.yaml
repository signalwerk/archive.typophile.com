      <p>Thanks Patty. I find very interesting the reasons for the taste of a person who really has put a lot of time and thought into their work. Of course another person of similar experience and thoughtfulness might have quite different taste. But still it is quite informative. </p>
      <p>The sans you like I think are all quite strong, with a degree of formality. --Except for Today Sans, which has some modulation and some 'serif' action. That one doesn't seem to quite fit your list. Well, so much for theory! </p>
      <p>Anyway, I think what might be going on is that a lot of the strength of seriffed faces comes from their serifs, and when you take that away they but still have the variation in stress, they tend to be weaker, even when they have some charm. </p>
      <p>I think that bolder weights of stressed sans can still be quite strong, though with less formality.</p>
