  html: <p>Hi all. This is my first post here, so I'm not sure if I'm in the correct forum. In any case, I'm searching desperately for a sans serif that isn't so warm, fun, cute, etc. Something along the lines of Din in coldness/seriousness, but not so tech-y. I just tried Aaux Pro, but I think it's a bit too Din-like. Freight Sans and Whitney are nice, but a little warm. Galaxie Polaris is close, but maybe too similar to Helvetica. Am I crazy or is this hard to find? Any recommendations?</p>
