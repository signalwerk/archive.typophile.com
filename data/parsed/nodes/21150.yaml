      <p>I do like Whitney although I'm not crazy about the angles on, for example the cap A. Seems on some level to split the difference between Gotham and Verlag.</p>
      <p>I'm madly in love with Verlag and Nobel because they both have the retro elegance of a font like Neutraface without quite the quirkiness. </p>
      <p>As far as which other sans I like... there are so many! Seria Sans, Scala Sans, TheSans, Akzidenz Grotesk, Avenir, Bernhard Gothic (occasionally), Meta, Today. News Gothic and Franklin Gothic &amp; Univers have their uses. Mostly, however, those are fonts I own and have worked with. I'm sure there are SO many others I'd give a spin if I had endless funding and time to research them.</p>
      <p>Conspicuously missing from above list: all those DIN-alikes because I am so SICK of them. Ditto Interstate.</p>
      <p>I'm so over Futura, Gill Sans, and Helvetica. It's like going back to high school for me.</p>
