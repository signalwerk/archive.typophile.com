      <p>Hi Jean</p>
      <p>Most of the good ones have already been mentioned here already, but  also worthy of consideration would be (in no particular order)</p>
      <p>Goudy Sans (old but unusual). Syntax. Avenir Next (with condensed weights at last). Charlotte Sans. Finnegan. Information. Fedra Sans. Wayfarer.</p>
      <p>I find the comments from Patty and William fascinating; so focussed, so erudite. And all those lovely contemporary sans serifs under discussion. </p>
      <p>As for the idea that 'Optima can look majestic and contemporary' - well it might have been either of those things 48 years ago, when it was new, but I think the general taste has moved on from that, despite the release of Optima Next.</p>
