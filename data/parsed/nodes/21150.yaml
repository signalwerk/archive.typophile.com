      <p>Coranto is a pretty fancy looking typeface.</p>
      <p>Some of the typefaces suggested, such as Flama and Sophisto, look really really cool. But I don't think they really match up with Coranto; they seem a bit too technical.</p>
      <p>I really like ClearviewOne, but it has a certain kind of friendly looking quality to it (just look at all those bright AT&amp;T ads lately). You could go with ClearviewHwy for a more DIN-like feel. But it costs more than Pill Gothic. However, I don't think it goes well with Coranto either.</p>
      <p>Call it a boring choice, but I think something like Frutiger Condensed would work really well in combination with Coranto.</p>
