      <p>:^) I've said recently that Verlag is somewhere in between Whitney and Gotham.</p>
      <p>I think you and I might have similar taste in Sans. I licensed Whitney before I had a project for it because I really wanted to try it out. Same with Gotham. Now they are my go to sans for a lot of things. I will license Verlag because I do see it as a nice in between and because I see a lot of Metro in it and I love Metro. The only character I'm not completely enraptured with is the lighter weights of the lowercase t. In general I'm not fond of that sort of angling off of the crossbar. But, it suits the face so overall I won't complain about it.</p>
