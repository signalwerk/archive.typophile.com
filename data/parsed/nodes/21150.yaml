      <p>How about Mr. Majoor's Quadraat Sans? It's lively but humble at the same time.</p>
      <p>Personally, though, I like the Meditteranean-Catalan flavored neo-humanist sans with warm, curvy terminals and hooks like Costa, Lisboa and Eva. Their letterforms dance smoothly on the page when set on large, but are surprisingly usable at small sizes.</p>
      <p>But I can never say no to Kievit -- one of the most versatile creature out there. It managed to be clean without being too sterile, and has the workmanship of a Grotesk without being too impersonal. It has all the OpenType goodness, too.</p>
