  votes: null
  html: "<p>Hello! <br> <br>I'm an undergrad design student about to enter my final year of university, and I was wondering if I could get a few suggestions on a serif and sans-serif combination that could be applied consistently to the written work I'll produce this year. I've been using FF Scala and Scala Sans for the past few years to set my formal texts, and while they have served me well, I'm looking for something different. <br> <br>Some basic criteria: <br>* Work well in shortish texts (&lt;1000 words) and longer texts (~3000 words up to a 10,000 word thesis). <br>* Combine well together, but also able to stand on their own. On occasion, I might want to set a short document entirely in the sans-serif face. <br>* Versatile enough to be used in a standard-sized document, the occasional large-format poster, and the very-occasional slideware presentation. <br>* Combine well with the images I'll be using this year: namely, interface mockups and screen grabs, various diagrams, and maps and photos of urban environments. <br> <br>As way of additional reference, the project I'm working on this year is technology-based, utilizing a mobile computing device hooked up to a GPS unit and connected to the internet. The written material will draw quite heavily on such areas as: urban and spatial practices, architecture, the city in art, design and literature, new media theory, anthropology/sociology, Deleuzian philosophy, interaction design/human-computer interaction, information visualization, mapping/cartography. <br> <br>Any help very much appreciated!</p>"
  html_clean: "<p>Hello! <br> <br>I'm an undergrad design student about to enter my final year of university, and I was wondering if I could get a few suggestions on a serif and sans-serif combination that could be applied consistently to the written work I'll produce this year. I've been using FF Scala and Scala Sans for the past few years to set my formal texts, and while they have served me well, I'm looking for something different. <br> <br>Some basic criteria: <br>* Work well in shortish texts (&lt;1000 words) and longer texts (~3000 words up to a 10,000 word thesis). <br>* Combine well together, but also able to stand on their own. On occasion, I might want to set a short document entirely in the sans-serif face. <br>* Versatile enough to be used in a standard-sized document, the occasional large-format poster, and the very-occasional slideware presentation. <br>* Combine well with the images I'll be using this year: namely, interface mockups and screen grabs, various diagrams, and maps and photos of urban environments. <br> <br>As way of additional reference, the project I'm working on this year is technology-based, utilizing a mobile computing device hooked up to a GPS unit and connected to the internet. The written material will draw quite heavily on such areas as: urban and spatial practices, architecture, the city in art, design and literature, new media theory, anthropology/sociology, Deleuzian philosophy, interaction design/human-computer interaction, information visualization, mapping/cartography. <br> <br>Any help very much appreciated!</p>"
