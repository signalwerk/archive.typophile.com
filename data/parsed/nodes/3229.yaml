      <p>&gt; They just don’t want their fonts distributed via<br>
      &gt; embedding, which is mainly MS Word and PDFs.</p>
      <p>Did you miss the EPS bit? Since a font cannot be embedded in an EPS, it implies you can't even do a convert-to-outlines! The Emigre EULA has that problem too (in fact it's much more explicit about it). This is of course ludicrous, to the point of fascism.</p>
      <p>Claire, talk to Peter about it.<br>
      I can assure you he's much much nicer than his EULA.</p>
      <p>Unfortunately a EULA is a necessary evil.<br>
      But sometimes it can make a person evil.</p>
      <p>hhp</p>
