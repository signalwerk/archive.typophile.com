    html: |-
      <p>&gt;So any document or electronic image that you produce with typefaces from Typotheque belongs to them.</p>
      <p>No. They just don't want their fonts distributed via embedding, which is mainly MS Word and PDFs. Documents and images created in inDesign, Photoshop, etc. don't embed fonts, so they're not an issue.</p>
      <p>MS Word is very problematic, because a document with an embedded font can be distributed to a corporate network, thereby installing the font on all terminals of that system, which may not be licensed for the font. </p>
      <p>It would be like if you download an image file made by Photoshop, and bingo, the Photoshop application is installed on your computer!</p>
