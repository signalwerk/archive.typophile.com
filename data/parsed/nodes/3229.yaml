    html: <p>I'm a fan of Eric Gill, so I've been wanting to see Gill Sans and Joanna paired together, but I always feel that both of these faces are a little more on the display side and am not sure about how legible either would be for long blocks of text. Anyone wanna weigh in on this suggestion? i'd like to hear yer thoughts on whether this'd work (i hope this doesn't derail your thread, Ben!) <br>P.S. I just checked out Scala&amp;Scala Sans (I wasn't familiar with the faces befor I posted, sorry) and it seems to me that Scala&amp;Scala Sans have a lot in common with Joanna and Gill Sans (but i could be wrong) so if you're looking for something of a different look, I guess my suggestion wouldn't work that well.</p>
