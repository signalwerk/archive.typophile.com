    html: "<p>Thanks Nicolai! Fedra Serif A and Fedra Sans (leaning slightly to Alt) look near perfect for my needs: versatile, fresh and contemporary, yet unobtrusive and readable. A bit pricey for my student budget, but I think I'll manage. Tops my shortlist, for the moment at least. <br> <br>// <br> <br>Thanks t christensen! I was considering Sabon, I'm just a little unsure if it fits the character of my thesis completely. <br> <br>// <br> <br>Paul: <br>I like Eric Gill too! I'll have to rule Gill Sans out though – it's bundled with OS X and its ubiquity is steadily increasing. I personally don't like Gill Sans used in anything longer than a short single page document. And I couldn't use it without thinking of Edward Tufte (<a href=\"http://www.edwardtufte.com/\" target=\"_blank\">http://www.edwardtufte.com/</a>) or the London Underground. :-) <br> <br>// <br> <br>On a related note, I was browsing though a few related theses, and these are the typefaces used in a few of them (at least, the theses which bothered to pay attention to type): <br> <br>Scala Sans <br>Interstate <br>Akzidenz Grotesk <br>Meta <br>Frutiger <br> <br>TheMix <br>Rotis SemiSans (used in body text, urgh... difficult to read!) <br> <br>Scala <br>Sabon <br>Plantin <br>Vendetta <br>Melior</p>"
