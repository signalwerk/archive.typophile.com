    html: <p>You might consider Sabon for the sans serif. It doesn't require ligatures,  <br>won't give your readers eyestrain at low resolution, and would probably  <br>look okay with the Scala Sans you have been using. It will seem vaguely  <br>French to the Deleuze crowd. I don't think your fonts should show off --  <br>you want something that won't get in the way of the content of your writing.</p>
