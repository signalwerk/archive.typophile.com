  html: |-
    <p>Type@Cooper presents the first in our guest lecture series at Cooper Union "Turning Lead into Gold: 19th-Century American Type Foundries &amp; Their Specimen Books". Stephen O. Saxe will speak on Monday, October 18th at 6:30 pm in the Rose Auditorium at Cooper Union. This talk was adapted from the annual Hofer Lecture in Graphic Arts at Harvard in April, 2010. It covers the design and production of type in the nineteenth century from the earliest days of typefounding in America, technological advances, the aesthetics of “Victorian” type, the “Artistic Printing” movement, and the demise of the great type foundries and formation of the American Type Founders Company at the end of the century. </p>
    <p>For more information go to the Cooper Union Continuing Education website or CooperType.org</p>
    <p>TDC members receive a 20% discount on all lectures, but need to call to reserve a seat. 212-353-4195. General public can reserve seats at the link below. </p>
    <p><a href="http://cooperunion.augusoft.net/index.cfm?method=ClassInfo.ClassInformation&amp;int_class_id=901&amp;int_category_id=4&amp;int_sub_category_id=33&amp;int_catalog_id=0" title="http://cooperunion.augusoft.net/index.cfm?method=ClassInfo.ClassInformation&amp;int_class_id=901&amp;int_category_id=4&amp;int_sub_category_id=33&amp;int_catalog_id=0">http://cooperunion.augusoft.net/index.cfm?method=ClassInfo.ClassInformat...</a></p>
