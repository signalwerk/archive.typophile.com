    <p>Evening, I’m not sure if this is the right place to ask. As I’m new perhaps someone could point me in the right direction if it isn’t.</p>
    <p>I have to produce a Greek report where the required font is Frutiger LT 45 Light. I understand there was a Frutiger LT Greek a few years ago. Does anyone know where I can purchase this?</p>
    <p>If not, can anyone recommend a Greek font that looks very similar and where I may purchase that? Many thanks.</p>
