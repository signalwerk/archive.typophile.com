    html: |-
      <p>Since the Frutiger Next Greek Linotype commissioned from Eva Masoura a few years ago (which won a TDC2 prize) is not yet available, there is no "Frutiger Greek" you can use (although the regular Frutiger has a Cyrillic, it does not have Greek).</p>
      <p>Myriad and Segoe are in similar veins to Frutiger—humanist sans—or at least that is what many people seem to say. They both have Greeks, though, so you could check them out. Depending on your system and or software, you may already have these fonts installed anyway.</p>
