      <p>Oh, you asked where you can buy them, too. Here are links to <a href="http://www.linotype.com/1257/myriad-family.html" rel="nofollow">Myriad</a> and <a href="http://www.ascendercorp.com/msfonts/segoeUI.html" rel="nofollow">Segoe</a>. </p>
      <p>The Myriad fonts on the site that I linked to include Greek in their character sets. If you want to license Segoe, I think you have to e-mail Ascender at via the link on the page I linked to.</p>
      <p>Note that some Myriad fonts come with many Adobe and applications, and the OpenType Pro versions have Greek. Also, Segoe is the system font on Windows Vista, so if you are running current Windows, you should have that.</p>
