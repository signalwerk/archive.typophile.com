    html: <p>I am getting caught on the warped crossbar of the T, and the bottom prong of the C. <br> <br>The O is slanting downward to the right. I really dislike that. I think it's a bit too tall as well. The U is my favorite letter.  <br> <br>The logo is a rectangle that wants to be an oval. <br> <br>IMO, an ovular solution would be handsome.  <br> <br>Warp it all, or angle it. Both just bother me. <br> <br>I like the mark alone. Its very powerful. <br>It could be that the other text does not feel <br>as "Custom" too. <br> <br>Andrew <br></p>
