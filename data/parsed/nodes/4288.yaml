    html: <p>Dylan- <br> <br>I'm glad you're running this through the gamit even after you've done a short print run.   <br> <br>One of the biggest strengths of this mark is the hand lettering; you're able to achieve a definite sense of independence.  I don't think the letterforms swell too much.  In fact, I think you're on to something unique by juxtaposing crisp edges with somewhat organic forms.  Every curved line seems to be balanced by a straight one.  I would definitely not warp it all or angle it all.  Having both is what balances it and makes it custom.   <br> <br>Keeping with the theme of independence, "CUSTOM" by itself seems the natural choice.  Its not as descriptive verbally, but I believe it conveys the boldest iconic message of the three.  Alone, it should work at smaller sizes and in more contexts. <br> <br>On the other hand, you're still left with the dilemna of not explaining enough about your company through the name.  However, I think the mark is strong enough that it would be worth your time to find creative design solutions to design your way out of this problem.  Perhaps the design promotion and website could be designed in such a way to strategically identify Custom Art Co's various services. <br> <br>Custom Art Co., Custom Art Company,  or simply Custom?  Consistency in branding yourself through naming could be dicey.  Audibly, Custom Art Co. has the best ring to it.  I would guess that Custom Art Company is what will be on the books, and then CUSTOM is most interesting graphically by itself. <br> <br>Since your website is <a href="http://www.customartco.com" target="_blank">www.customartco.com</a>, I would think you'd want your customers to think of your company by that name.  Perhaps you could have "Custom Art Co" written out in addition to your "CUSTOM" logo.  "Custom Art Co" could shy away from being a logo element and become part of the introductory text of your design promotions and website. <br> <br>Overall, I'm very impressed by the mark "CUSTOM" makes.  It'd be interesting to see it scaled down, scaled up, reversed, and applied to a couple of promo peices.  <br> <br> <br> </p>
