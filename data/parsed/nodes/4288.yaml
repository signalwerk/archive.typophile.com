    <p>I need your feedback on this logo, as I'm about to take Custom Art Company from a fun little side gig to a full time business. I have done one short print run with this logo, but I'm willing to make changes. I'm about to begin designing a new website and make a second print run for design promotion. <br> <br>The Custom wordmark carries a somewhat heavy burden: I design for print and web, illustrate, and, like you, have this fetish for typography, particularly hand-lettered type. I like the wordmark as a solution, and I want to convey a mark that is strong, not too flashy, and shaped a little out of the ordinary. Swelling with pride, potential, but not bloated. I wanted something that instantly said, "This is not created from a stock typeface (or one that's instantly recognizable)". At the same time, I wanted a refined, clean, ordered finish on the thing. <br> <br>So this is where the logo stands currently (plain, with full name, and with URL). As I mentioned, I do have some equity in it, but not much at this point. Thoughts? Thanks, everyone.  <br> <br> <br> <br></p>
