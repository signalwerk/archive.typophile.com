      <p>Got it. But why ever leave overlapping outlines in the position? For one thing they take up <em>more</em> room than the overlap-removed one. So I assume Yanone is talking about referred components.</p>
      <p>Also:<br>
      - I assume the rendering varies because for referred components each glyph is rasterized individually, then the bitmaps are merged. If so, that means it's slower than rendering a single outline-merged glyph. So you're trading rendering speed for download speed.<br>
      - Component referral only saves space if you use a component enough times (which might be as low as three, or even two, depending). For something like the cedilla there's probably no contest, but for the slash, I wonder.<br>
      - A problem with referred components -especially overlapping ones, and in darker weights- is that there's no opportunity for modulation. For example the lower curve of the /C/c should get thinner when a cedilla is attached. Then there's the ogonek, which likes to affect the base glyph bigtime...</p>
      <p>hhp</p>
