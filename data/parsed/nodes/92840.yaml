      <p>@hrant - Components mean that the glyph outlines aren't defined in that character position, but are created by referring to other positions.  If you 'decompose' such a glyph, the outlines are now in their character's position. For example, the O-slash position could have pointers to the 'O' and the 'Slash' (component) or it could have the outlines right there (decomposed). There's a slight saving in file size using components; I believe that they must be decomposed before creating an open type font.</p>
      <p>Now why rendering agents should display them differently, I have no idea. Possibly something to do with the rendering sequence, or outline directions,  or conflicting hinting, or ... or ...</p>
      <p>- Herb</p>
    html_clean: |-
