    html: |-
      <p>"Now why rendering agents should display them differently, I have no idea..."</p>
      <p>The parts of a component are rendered to bitmaps separately and then the bitmaps are combined. Overlapping bitmaps are not a problem. Overlapping contours require the rendering to figure out the overlap and present a bitmap.</p>
      <p>"For one thing they take up more room than the overlap-removed one..."</p>
      <p>Plus.... a landscape oriented rectangle and a portrait oriented rectangle overlap and use 8 points and 10 hints. Remove overlap and you have 12 points and 14 hints. </p>
      <p>"...if an end user strokes the outline of the glyphs, they get undesirable results from overlapping components."</p>
      <p>Not in Cooltype or any other savvy app. You Occidentals don't know squat about overlapping issues. ;)</p>
