      <p>TP: "...that I both saw it and was taught about it being a problem." </p>
      <p>They taught about overlapping TT at Adobe?</p>
      <p>The TT spec allows overlapping contours and components from 1.0, and the only experience I've had where that didn't render properly was corrected by Apple in their iOS about two years ago, partly, I was told, because there isn't any software on the web that renders "western fonts" differently from "eastern fonts", and Apple has a lot of eastern fonts that follow the TT spec.</p>
      <p>Besides all that, last time I tried to stroke and fill a live font on the web, the support was so inconsistent, forgetting about the overlap issue, that I had to include SVG and graphics to make my presentation show up on all browsers.</p>
