    html: <p>NEVER MIND is <a href="http://www.myfonts.com/fonts/urw/grotesque-no-9/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=NEVER+MIND" target="_blank">Grotesque 9</a> or similar. <br> <br>THE BOLLOCKS is close to <a href="http://www.myfonts.com/fonts/linotype/new-century-schoolbook/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=THE+BOLLOCKS" target="_blank">Century Schoolbook Bold</a>, but narrower. <br> <br>All of the type here looks like wood type, maybe clipped from posters. There were wood type versions of many common faces (like Century Schoolbook) which looked noticeably different that what they were supposed to be.</p>
    html_clean: <p>NEVER MIND is <a href="http://www.myfonts.com/fonts/urw/grotesque-no-9/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=NEVER+MIND" target="_blank" class="link-external">Grotesque 9</a> or similar. <br> <br>THE BOLLOCKS is close to <a href="http://www.myfonts.com/fonts/linotype/new-century-schoolbook/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=THE+BOLLOCKS" target="_blank" class="link-external">Century Schoolbook Bold</a>, but narrower. <br> <br>All of the type here looks like wood type, maybe clipped from posters. There were wood type versions of many common faces (like Century Schoolbook) which looked noticeably different that what they were supposed to be.</p>
