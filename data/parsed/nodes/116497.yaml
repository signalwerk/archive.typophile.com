  html: |-
    <p>My fiancée surprised me with a just-because gift that blends her passion for New England history and literature--especially the Transcendentalists--with my love of the book arts.<br>
    It's "Spirit &amp; Matter," selections from Emerson's <em>Nature</em> and Thoreau's <em>Ktaadn</em> with commentary by <a class="freelinking external" href="http://hep.ucsb.edu/people/witherel/bw.html" rel="nofollow">Elizabeth Hall Witherell</a>, printed in an edition of 100 by Carolee Campbell at <a class="freelinking external" href="http://ninjapressbooks.com" rel="nofollow">Ninja Press</a> as a <em>festschrift</em> for the bicentennial of Emerson's birth in 2003. The paper is English Charter Oak, printed from handset Garamont and Erbar types, and sewn into a cover of handmade raw-flax paper.<br>
    I'm one happy typophile.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/emersonthoreau_image3_3986.jpg"></div><p></p>
