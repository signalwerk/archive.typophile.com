    html: <p>Hrant, that monotype specimen is quite dark! As far as offset goes, I presently have two books which are set in Octavian. The one on bookbinding actually looks quite good as far as color is concerned. The text has a good balance. The other is a textbook I borrowed from a friend printed on coated paper and for some reason the text is printed very lightly so that the thin parts are pretty much non-existent. So the contrast on that seems too high because the light parts are in fact almost white. This was the one that I had been reading when I said it was unreadable, which in fact it is. The other book is not bad, but I feel it is still a bit contrasty. This makes me think that I should soften up my font, if only just a bit.</p>
