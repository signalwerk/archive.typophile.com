      <p><a href="http://www.eventide.ca/typography/test-sheet.pdf" target="_blank" rel="nofollow">:: Another Adrichom Test Sheet ::</a></p>
      <p>I have revised the entire uppercase to balance the proportions and dimensions and tweaked out many of the little detail-y parts. I decided to lower the ascenders rather than raise the caps, because I personally like the short caps. Forrest, do you think the <strong>Th</strong> is acceptable this way, or does the contrast still seem wonky?</p>
      <p>I have redrawn the numerals to better represent the etchings of van Adrichem. Do you think that this is an improvement over the old ones? van Adrichem seems to make the <strong>8</strong> either as I have done it or centered vertically against the <strong>0</strong>. I am not 100% sure about my choice here. Also, many of his numerals vary widely in their style. Forrest, what in particular do you think I should do with the <strong>1</strong>?</p>
      <p>I changed the punctuation completely and the ampersand and added a <strong>TT</strong> logotype. I think I might look for other combinations that are written differently on the maps, like <strong>AT</strong> which tends to have the right part stick out further over the <strong>A</strong> than on the other side.</p>
      <p>Still no updates to the italic, though.</p>
