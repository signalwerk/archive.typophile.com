    html: <p>That's interesting, because I'm pretty sure that Adrichom was Dutch! How did you know? <br> <br>In terms of the design, the balance between <i>a</i> and <i>p</i> is definitely giving me troubles... I know that the <i>p</i> is more true to Adrichom than the <i>a</i>, but I find it hard to make the <i>a</i> look more like the {p} without making it look dumb. I think I will have to make top right part of the a more acute and pointy? What do you think?</p>
