      <p>About the bold issue. It seems like you could make a bolder version despite the low x height by doing what a scribe would do ( appropriate here no?) - by keeping the counter the same size for the most part but letting the stroke be wider in ooutside the counter - like a thinker nib on a pen. See what I mean? Not that you should do this - but it seems like you could. </p>
