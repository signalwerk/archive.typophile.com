      <p>I think I see what you mean about those bottom bowls, I'll experiment with extending them more.</p>
      <p>With the 1, the original varies a lot. Some have shorter bottom serifs, some don't have any ... I think the problem is that he made all of the numerals to blend with the italic. So that 45 degree serif makes more sense with the rest of the italic which shares this feature. Since his ones are so inconsistent, I actually looked more at the italic 1 from Centaur than I looked at Adrichom, which maybe is why it looks wunky.</p>
      <p>Currently I am reading Mercator's instructions on how to write italics and comparing it with Adrichom to detect the basic pen movements and go from there. It is really difficult! </p>
