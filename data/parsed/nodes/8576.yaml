    html: <p>The brackets on the p's descender are way too wide for my comfort. The contrast on the bowls of the a and the p seems a little wonky to me, too. The underlying character of the face is nice, though. It almost feels Dutch to me, only without the crazy variations in slant (which is my favorite thing about the Van Dijck italics, actually).</p>
