  - id: 56577
    user: 4886
    date: 2005-01-21T11:14:00
    date_raw: 21 Jan 2005 — 11:14am
    votes: null
    html: <p>Thanks paul for the comprehensive analysis! <br> <br>Most of the quirky features that you have pointed out are actually the reasons why I wanted to make this font! (as usual for me...) But you are correct that it should be in the Display section. I think that I will actually post future developments there. It was originally used for labelling maps, so non-text settings are really where it would work best. Also in non text-settings are where its unusual look would work best. If I decide to make a text version for this design I will probably take into account all of your suggestions, though.  <br> <br>For the intended context though, I will look at the P--R relationship. Definitely the bar on the H was out of whack! I fixed that immediately. <br> <br>I'm not sure I want to straighten out the S or s too much, as Adrichom's writing are even more extreme that what I have! The t and T will need to be more closely considered, though. His t's and T's are even more wrong than I have them, so I will have to play a bit more to determine if fixing them will have a negative effect on the overall character. <br> <br>Thanks again!</p>
