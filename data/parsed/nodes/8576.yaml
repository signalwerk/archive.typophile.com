    html: <p>Actually, I think you can make this a text face and still keep the quirky features, but as Paul said the descenders (and to some extent the ascenders, but not as much) need to be shortened, and for me as a book typographer, a more robust dot over the i and j would need to be added (perhaps keep the current treatment as alternate characters). <br> <br>Overall, though, I quite like the face, and I do hope you'll keep us updated.</p>
