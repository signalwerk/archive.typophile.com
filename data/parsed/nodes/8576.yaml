      <p>You're finding Octavian unreadable, and because of its stroke contrast?! And it looks particularly bad in offset?! Are we talking about the same font? Because it has less contrast than Times, and in metal it was a rather dark face, which caused its translation to digital -done in the typical literal way of the 20th century- to result in something much nicer in color than the anemic digital Bembo for example...</p>
