    html: <p>Here are a few changes made to the italic as well as the upright. Basically I just made the bowls on the upright letter rounder and made the "o" more calligraphic. All the italic letters are different in an attempt to make them more harmonius. Seeing them together I also realize also the upright is too light or the italic is too dark. Since I have more of the former done, I will probably just lighten the latter. <br> <br>(BTW, my spelling really is not as bad as it looks; I just want to accomodate those few italic characters which I currently have made!) <br> <br><img src="http://www.typophile.com/forums/messages/29/69919.jpg" alt="Mix-o-cases"></p>
