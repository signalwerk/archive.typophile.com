      <p>Despite the lack of attention here you have made a tasty face! I am not expert on text faces ( or any other kind for that matter) and I don't know your sources at all - but I think it reads pretty nicely. It is a little lighter that I generally like a text face to be. The italics seem to suit it because the separate without slowing reading. The 5 seems excentric to me. Is that from your source? Is it consistantly that way? It bugs me a little. looking closer I noticed that there is still some interspace adjustments to make. The 'a' seems a little too tight with other letters. I would open the sidebearings a little. The i too in places. The best &amp; worst thing about this face is that it feel not so much authoritative as personal &amp; idosyncratic. Like a specific person's writing. I like this.</p>
