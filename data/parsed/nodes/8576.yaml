    html: <p>It's been awhile... <br> <br>But I've been working a lot on the italic. I'm finding it quite difficult to make it look good. It is especially difficult because the samples I have of the original are quite poor, so I'm having to rely mostly on my experience with other types and my inexperienced eye. Here is an image "antiqued" to look more like the map on which I first saw it. I will put a PDF when I have more glyphs done. <br><img src="http://www.typophile.com/forums/messages/29/69711.jpg" alt="Exciting Italic Update!"> <br> <br>Also, I'm realizing that I will have to do a heavier weight for both of these with shorter asc/dec if it is to be used with text settings properly.</p>
