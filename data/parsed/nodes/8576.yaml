      <p>Thanks for the tips on the spacing, Hrant. People kept saying to "fix the spacing" but I couln't see what was wrong with it. I didn't know to start with "nun" before, but it seems to be a good approach.</p>
      <p>I have struggled with the big and small Gs. Currently I am working on redoing both of them. I think they are looking better so far. As for the S, I like the slant, but I think you are right that I should straighten it up ... but only very little!</p>
      <p>Yes, the italic is a defintely less thought out than the roman and still very far from completion. Especially since I have begun to "sober-up" most of the letters, those that are still authentic, like v and f, look out of place. I will have to rethink these. </p>
      <p>I find that, even with this calligraphic style, traditional cursives are just too distracting when paired with romans. (Not to mention the fact that they are difficult to read.) I will have to look more closely at other italics out there. I think the italic in Whitman is a good example of how to approach mating with the roman, but that it is almost too similar. Can anyone point me of examples of calligraphic fonts with italics that are not traditional (i.e. very distinct) from their roman counterparts? I also like Brioso, and think the pairing is excellent. However, I don't quite know how I would adapt that style of italic to mine.</p>
      <p>Eduardo, sorry about the file. I think I saved it as a version 6 file with security, which I guess can't be decoded by version 5. I highly recommend getting version 6 as it is a better app, and also it will likely be some time before I can post a new update. Unfortunately, my internet connection at home does not work anymore, I think it is the modem that is broken. So I have to burn a CD everytime I bring files to school which is tedious. I can leave the CD open, but then it inevitably develops errors after one or two trips back and forth. Hopefully my connection will be fixed soon so I can post more frequent updates!</p>
