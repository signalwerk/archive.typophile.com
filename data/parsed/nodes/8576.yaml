      <p><a href="http://eventide.ca/typography/adrichem-specimen.pdf" title="http://eventide.ca/typography/adrichem-specimen.pdf">http://eventide.ca/typography/adrichem-specimen.pdf</a></p>
      <p>Here is a list of the changes I've made:</p>
      <p><strong>1. Added small caps.</strong> These SMcaps are a bit taller than usual, because the x-height is so low. I tried making them smaller but they looked busted that way. I think these are quite nice, but I'm open to suggestions.</p>
      <p><strong>2. Shortened the caps.</strong>  I shortened them a little to blend better with the italics as well as the small caps. Some might not like this, but I think it works. Let me know what you think here.</p>
      <p><strong>3. Completely redrew the italics.</strong> I found a copy of Civitates Orbis Terrarum at school which features some of Adrichem's writing as well as that of other similar styles. I tried to use this to my advantage but got nowhere. Now they are based more on the roman than on the original cursive. I like the true Dutch style, but as a companion italic I cannot get it to work. These may be a bit more boring, but they are more practical. The weakest point here I think are the sloped caps, which are presently a bit ugly. I will try to make them nicer! Also, you'll notice that there are some wrong glyphs, viz. w, x and z. I'll get to them eventually ...</p>
