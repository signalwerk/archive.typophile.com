    html: <p>Well, I will suspend updates on the italic until I learn a bit more about how to make them properly. I am having a very difficult time with it. I think I will just have to figure out a way to pay for those scans of Adrichom's work from the Hebrew University collection. The images I am referencing are too small for me to grasp the structure of the italics, which is compounded by my limited understanding of calligraphy. Anyway... <br> <br>The upright is going very well, I think. I know I probably won't get responses until I put a PDF for people to examine up close, but I want to make a more complete character set until I do that. Until then, here is another gif. I completely reworked this from the old design after printing it on a laser printer and realizing that the serifs and whatnot were simply not robust enough, as Peter had pointed out. It should be more "printer-friendly" now! It might not be visible on the gif, but it is more robust technically. <br> <br>Also note that I will make the hyphen single between words eventually, with the option for the double to come at line end with some OT trickery. <br> <br> <img src="http://www.typophile.com/forums/messages/29/70717.gif" alt="IERVSALEM"></p>
