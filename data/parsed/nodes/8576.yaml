    user: 4886
    date: 2005-07-21T18:22:00
    date_raw: 21 Jul 2005 — 6:22pm
    votes: null
    html: |-
      <p>I seem to get strong reactions from everyone about that 5. The dutch style from the time is in fact more extreme than that. It leans farther forward and is more acute on top. I will have to post some images for you to look at so you can see how extreme it is. A friend of mine commented (about my 5) that you could poke an eye out with it and that it draws attention to the type and away from the content. I guess that makes for bad type, in a way. As for the rest of the letters, I have found them difficult to draw. I will rethink them all, especially those mentioned in light of your concerns, Eduardo.</p>
      <p>I took a look at the lc a and opened the side bearings a bit to see how it looks. I don't mind either way, so I'll leave it opened as you recommended. I'll post the changes later.</p>
      <p>I agree that it is far lighter than most text faces. However, because of the low x-height, I have found it very difficult to add weight without losing the open, crisp quality which makes this face what it is. I am presently working on a weight axis to see if I can use MM interpolation to gain more precise control over weight adjustments. It takes some time, but the direction I am going in is interesting to me. The x-height is too low to build and actual bold weight, so what I am ending up doing will more likely end up being useful as optical sizes. I will make probably three or four intensities for different sizes that each maintain the open and crisp quality as best as possible.</p>
      <p>I am unsure, but perhaps one more experienced in the ways of letterpress (Gerald or Giampa, maybe?) could advise me if this is suitable for letterpress use. The light crisp stokes might serve well in this purpose, especially with the size-optimized designs. Comments in this area would be welcomed.</p>
      <p>It is strange to me that when I look at the page printed in this from a bit of a distance, I think that it is bad type because it does not look at proper type. The overall page rythym normally present with a typeset page is pretty much absent. It does in fact look and feel like something written. However, when I hold tha page a bit closer, I cannot help but find myself drawn into the page, and I find it very comfortable and pleasant to read. I find I am able to read quite easily without having to rescan as much as I do with some other denser and softer fonts in a similar vein, like Adobe Jenson for example.</p>
      <p>Also, I am curious whether anyone would be interested in buying this unusual face. If there is interest, I will start thinking about all the extra characters needed to complete the font. Otherwise I will not because I have no need for them.</p>
      <p>BTW, I hope to release &lt; href="http://typophile.com/node/7596"&gt;Marquet soon as well.</p>
      <p>Thanks for the critiques and encouragement, everyone!</p>
