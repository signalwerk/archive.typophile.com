      <p>I think the problem with the '1' is that it is symmetric (rotate it 180° and the resulting shape is almost identical to the original one).</p>
      <p>When I posted my previous comment, the only suggestion I could think of was to give the '1' a foot serif, like the letters. But the important thing is to make it more 'asymmetric'. You can, for example, make its beak (the top) a bit longer, or remove the calligraphic serif at the bottom.</p>
    html_clean: |-
