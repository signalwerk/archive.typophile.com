    html: "<p>it's sad how little attention the type critiques get these days... that said i'll tell you what i see but first the disclaimer i am in no way an expert on lettering and any advice given is to be taken with a grain of salt <br> <br>The B looks very top-heavy. you could almost flip it vertically and then have it right, but then your modulation would be all out of whack... <br>The head serifs on the C and G seem very severe, maybe make them not quite so sharp. <br>The top arm of the E seems a tad too short. <br>The bar of the H seems too light. Even the middle arms of the E and F seem darker. Try matching the bar to that weight. <br>The bowl of the P could be a bit bigger than that of the R. <br>The tail of that Q is going to poke my eye out! it could use to be a bit less sharp IMO. <br>The S seems pretty shaky, it's leaning forward too much, and again the thing about the sharp serifs. <br>The T seems too wide to me. <br>I'd say the lowercase is pretty solid. Just a couple things: <br>the eye of the e seems a tad too small, especially if this were set at text sizes. <br>the s is leaning forward just a bit. <br>the bar of the t is too long, especially in combos like \"ty\" and \"tw\". <br>the u needs a little more work before it stops looking like an upsidedown n. especially that odd back serif up top. <br>and the tail of the y bothers me, but that's just me. <br>now the good stuff: <br>I think the D is excellent and i absolutely love the interesting serif structure. the g is just adorable and the f and r are exceptional. <br>As it is, this face seems very \"display\" to me. If you want to make it more suitable for text, i would think that you would need to reduce the length of your ascenders and descenders. <br>I think you've got great potential with this one. keep up the good work! (and don't get discouraged by lack of response here)</p>"
