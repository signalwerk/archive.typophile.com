    votes: null
    html: <p>I think the tall ascenders work in text, although you might want to bump up the cap height a little bit, or maybe just make a 'Th' ligature, because that's where the contrast between the cap height and ascender height is most striking / jarring. The f is tall enough that you could compensate for adding the 'Th' ligature by removing the 'fi'. <br> <br>If you were to make a display version of this face, you'd definitely want to increase the cap height. Anything set with an abundance of caps is going to have a strange rhythm, moving back and forth between the caps and the tall ascenders. It feels a little unpleasant to me right now, but maybe I'd get used to it. <br> <br>If you want more feedback on the spacing, set some text with a left-justified rag. It's too hard to judge with the full justification you're using in your latest specimen. <br> <br>The brackets on the y's tail feel over the top. <br> <br>I like the text figures as they are. Will there be lining figures as well? The only one I have any quibbles with is the 1. I especially like the peaked top of the 5. <br> <br>Overall, though, it's looking good! I'm interested to see where the italic ends up!</p>
