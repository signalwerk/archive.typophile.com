    html: <p>I used to always make letters like "S" really nicely balanced. I put a lot of effort into it. Then Robert Slimbach pointed out that the typeface I was working on was too static because the letters and numbers were too well balanced. So I went back and unbalanced a number of letters and numbers just slightly to make text set in the typeface just a little more dynamic. I let my S and 5 lean a little forwards, among other things. <br> <br>Certainly it's important to understand balance and know when something is balanced, btw. The point is just that one doesn't necessarily want to keep things completely balanced. <br> <br>T</p>
