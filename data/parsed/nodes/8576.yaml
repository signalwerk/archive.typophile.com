      <p>Here is a PDF finally. I think maybe the "S" has too much space on either side, and I do not like the punctuation at all. Its not completely unusable at text sizes, but it is definitely better suited for display uses, I think. Even in this role, though, the more I look at it the more I think those ascenders, though true to Adrichom, are just <i>way</i> too tall. Also, I have spent very little time on the numerals, so expect them to change. Any and all advice is welcomed! <br> <br></p>
