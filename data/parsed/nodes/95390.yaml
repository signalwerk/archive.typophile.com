      <p>First of all -in the US- font designs are not protected by copyright. Digital fonts do enjoy copyright protection over the actual data they contain, and a small number of fonts are protected by a <em>design patent</em>, but technically -if not ethically- you can make a knock-off of almost any existing design.</p>
      <p>The thing is, you don't need to worry about any of that if you're simply using a font*: you would purchase a license to use it, and that's that. It's only if you're making a font of your own based on an existing one (or if you're redistributing somebody else's font) that you have to worry about legal/ethical issues.</p>
      <p>* There are some exceptions however, in that some font houses require extra payment for certain uses.</p>
      <p>hhp</p>
