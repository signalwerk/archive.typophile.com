      <p>There is no difference between a Bodoni and, say, Minion, because they are both (in their digital versions) recent fonts created by specific designers. It doesn't matter that one of them is directly based on a previous font and one isn't. Which is to say, if you are talking about digital fonts, none of them are "rather old typefaces."</p>
      <p>As Hrant says, typefaces are not copyrightable in the US, but you do need to buy a license from the type foundry in order to use them. With some exceptions, that single license is all you need to use the font on any product, unless the type itself is really the relevant part of what you are selling (like decorative pillows with monograms in a certain typeface). In cases like that, some foundries will need extra compensation, because their font is essentially the only notable attribute of your product.</p>
      <p>But no one is going to sue you for using a font, as long as you obey the foundry's EULA.</p>
