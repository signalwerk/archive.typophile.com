    <p>I have a question regarding copyright laws.</p>
    <p>I am starting up a product line and was wondering what the laws were about using a typeface? I know that Bodoni, Clarendon and Univers are all rather old typefaces and wanted to know if older typefaces like that are royalty free or if typefaces can even be royalty free after a particulier amount of time like it works for music and images. and if so, does that count for their original creation date or if it changes when they move from foundry to foundry and when they get updates. for example, Bodoni was originally created back in the 1700's but what about bodoni std poster, would that fall under the same Bodoni copyright? Do I need to find out who owns it and contact them?</p>
    <p>What about new typefaces? I know that it really depends on the typeface and the licence agreement. What do I need to look for to see if i can use a type in my product line?</p>
    <p>Am I looking to far into this? should I just use whatever type I want or am I right to try and look into what I can and can't use?<br>
    I just dont want to put a typeface in my product line if i am going to get sued for using the typeface. there is a lot of grey area in this.</p>
