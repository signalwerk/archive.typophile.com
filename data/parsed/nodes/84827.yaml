    <p>Hello. I am looking for a reasonably priced A3 b/w laser printer for proofing typographic/design layout.<br>
    I currently use an Epson EPL N—7000 (for a marker point). </p>
    <p>Would anybody happen to know of any A3 lasers *I'm based in the UK*</p>
    <p>Many thanks in advance,<br>
    Pete</p>
