    votes: null
    html: |-
      <p>Try to find and buy a second hand Xanté Accel-A-Writer (higher end models) or Filmmaker. They mostly are A3-plus, print 1200—2400 dpi and are PostScript (v2). </p>
      <p>Many of these were used in the printing industry for direct-imaging on off-set plates &amp; a lot will have been replaced by more up-to-date direct-to-plate systems.</p>
