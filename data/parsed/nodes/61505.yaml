    <p>Hi, I stumbled across this forum and find it fascinating, although I have absolutely no training in design/aesthetics.  Can you please give me your criticism on a logo I’m playing around with for my new venture?</p>
    <p>I looking for a logo that is clean and simple (many clients use English as a 2nd language), yet indicates achievement (particularly scholastic achievement).</p>
    <p>Please be brutally honest, but dumb down any specialized vocabulary for this novice.  In particular, are there any rules for character spacing and sizing?  It seems I have a lot of problems in that area.</p>
    <p>Thank you,</p>
    <p>EMS</p>
