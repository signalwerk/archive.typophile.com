      <p>Thank you both.  This is is very helpful.</p>
      <p>riccard0: What do you mean by “the type on Best-Test is too light compared with the surrounding strokes” — which strokes are you referring to?</p>
      <p>Simplicious: Thank you for the link for the star.  Will definitely check it out and rework it.  I did not draw the letters.  The font is called “Unispace” — I was looking for a modern style font.  I did adjust the size/width of the “B” and “t” and the kerning just by my untrained eyeballs.  Yes, the “t” is an enlarged version of a lowercase one.  I wanted to emphasize the first letter without making it a capital letter.  I guess it doesn’t work well.  Also thanks for the hyphen comment.  I knew there is something wrong with it.</p>
      <p>The “.net” font is called “Bauer,” as in the skate manufacturer. I was trying to make it look modern overall, and wanted to space out the “.net” to better balance with the above “Best-test” — perhaps this doesn’t work well.</p>
