      <p>Before I start with the typography I’d suggest you to rework the star. It has some problems concerning consistency. Some of which are falling into the Gestalt Principles. Learn about them at <a href="http://www.andyrutledge.com/" title="http://www.andyrutledge.com/">http://www.andyrutledge.com/</a>. This is a must-read in my eyes. Nevertheless I think that my dirty illustration shows the biggest problems.</p>
      <p></p><div class="imageWrap"><img src="/files/star_4842.jpg"></div><br>
      <em></em><br>
      <em></em><br>
      Concerning typography ... did you draw the letters? If not, forget about sizing and concentrate on kerning (space between one and another character). In my opinion the characters themselves are to thin to be so close to each other. I think with a bolder font the connection between ’s’ and ’t’ and as a result the overall tightness of the two words might work better. Maybe you could also connect ’e’ and ’s’ then.<br>
      <em></em><br>
      The capital ’T’ from Test looks like a small-cap ’t’ though it doesn’t look like the other ones ... this kind of confusses me.<br>
      <em></em><br>
      The dash between Best and Test looks like an en-dash which would be a mistake in this context so I’d suggest to make it shorter and look more like a typical hyphen.<br>
      <em></em><br>
      Some personal taste at the end. For some reason I dislike the font in general. Maybe bolder and better kerned (maybe on the same baseline) would improve it and make it work for me but I would try another one ... but as I mentioned this is my personal taste. I do really like the font you’ve used for ’.net’ but you’d maybe try to get it a little tighter (especially the dot).<p></p>
