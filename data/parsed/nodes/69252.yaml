      <p>Back in Ye Olden Tymes, when "typesetter" was a profession, kerning was generally accomplished with a search-and-replace function after the text had been keyed in. Additions or exceptions to the standard pairs could easily be added to the swap file, so adjustments like this were no big deal. Sadly, the advent of desktop publishing and "idiot-proof" interfaces removed a certain level of control. This is one reason why--until Corel fouled up the works with Version 8--I always preferred WordPerfect to Microsoft Word: one had access to the underlying code, and global changes were easily accomplished with search-and-replace.</p>
      <p>Other things I miss from the days of yore: controllable vertical justification (one could add more or less space between selected elements) and Auto-tabs (the longest entry in an ordered or unordered list could be centered, and all other entries flush left with it). Sigh...</p>
