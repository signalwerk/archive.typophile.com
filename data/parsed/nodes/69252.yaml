      <p>Hey, Nina, great trick! I do have two additional remarks:</p>
      <p>To act upon <strong>each and every 'o'-like character</strong>, accented or not, you don't have to list the exact list. You can still use it if you need absolute control on which characters to include, but if you are positive you want to do this on all 'o' characters, you can use a <em>character class</em>: the command <code>[[=o=]]</code> will match on all o's, with and without accent. The only drawback is that a capital Oh is also an equivalent of plain 'o', so you have to find a way to exclude them. Well -- you can add <em>another</em> lookahead to include <em>only</em> lowercase characters!</p>
      <p><code>T(?=\l)(?=[[=o=]])</code></p>
      <p>The first lookahead asserts only lowercase characters may follow; the second picks up all equivalents of plain ohs.</p>
      <p>The other thing is: Unfortunately, GREP styles are oblivious to <strong>formatting</strong>, so this same trick will be applied to italic, bold, and bold italic, and on every font as well. If you are applying italics formatting though a paragraph style, you can create a new character style for "italic T o" kerning, but for plain text you still have to apply manually workarounds to non-plain text.</p>
      <p>Given this constraint, it's still a great trick. I agree: it's about time Adobe copied the Quark Kerning Pair Editor. And does anyone else think it's weird you cannot enter a Kerning value in a Character Style definition? You can only insert one using Nina's trick: first apply, then "Define New Character Style". And if you got it wrong, you cannot <em>edit</em> it. (Perhaps it can be done with a Javascript -- I'll have to check that.)</p>
      <p>---</p>
      <p>† Malcolm McLaren (22 January 1946 – 8 April 2010) ...</p>
