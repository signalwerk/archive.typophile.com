      <p>A very nice trick, though I'm still drawn to Peter Kahrel's <a href="http://www.kahrel.plus.com/indesign/kern.html" rel="nofollow">solution</a>, which puts all the changes in what amounts to a single kerning table covering a font's styles.  Kahrel's script can thus automate kerning for an italic f followed by a regular closing parenthesis.  But perhaps ID7 will make all such workarounds unnecessary.</p>
      <p>David</p>
