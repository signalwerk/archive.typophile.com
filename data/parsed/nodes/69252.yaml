    html: |-
      <p>Moraitis, if this is still an open question, here is a script to harvest custom kerning pairs inside an InDesign story. Save as a plain text file as "harvestKerning.jsx" in your InDesign scripting folder, click the text cursor in the running story that you want to harvest from, and run the script.</p>
      <p>It might run <em>very slow</em> as it has to inspect each and every single character ... perhaps you should try it first on a small amount of text.</p>
      <p>If the script encounters a manually kerned letter pair, it looks in its list if it already has encountered these before *with the same value*. If not, it will add them to the list. So beware! Some letter pairs may occur more than once in the list.<br>
      The custom kerning pairs and their value are written into a file named "kerning.txt", which will be stored in your local My Documents folder.</p>
      <p>Enjoy.</p>
      <p><code>results = [];<br>
      text = app.selection[0].parentStory.characters;<br>
      for (i=0; i&lt;text.length-1; i++)<br>
      {<br>
      	if (text[i].kerningMethod == "Manual")<br>
      		addToList (results, [ String(text[i].contents)+String(text[i+1].contents), text[i].kerningValue] );<br>
      }<br>
      myFileObj = new File(Folder.myDocuments+"/kerning.txt");<br>
      if (myFileObj.open("w"))<br>
      {<br>
      	myFileObj.write(results.join("\r"));<br>
      	myFileObj.close();<br>
      } else<br>
      	alert ("unable to create file kerning.txt");<br>
      function addToList (list, entry)<br>
      {<br>
      	var i;<br>
      	for (i=0; i&lt;list.length; i++)<br>
      		if (list[i][0] == entry[0] &amp;&amp; list[i][1] == entry[1])<br>
      			return;<br>
      	list.push (entry);<br>
      }<br>
      </code></p>
