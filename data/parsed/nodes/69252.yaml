    <p>Problem:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/GREP-kern-1_6550.gif"></div><p></p>
    <p>Solution:<br>
    While InDesign CS4 doesn't feature a kerning table, it does support GREP styles, which can be used to apply custom kerning values to extended text settings. Because I haven't seen this documented in a truly helpful way (not that I've looked <em>too</em> hard) and some peeps have asked about it, here's a quick writeup of a possible procedure. Maybe if some of you have corrections or suggestions how to do it better, we can put together a killer workflow. (Scuse the atypically looong post… I figured Typophile was still the best place to put this.)</p>
    <p>So in the text above, note the absence of a kern pair for «Tó» while «To» looks fine.</p>
    <p><strong>Step 1: Kern the pair manually, once.</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/GREP-kern-2_6377.gif"></div><p></p>
    <p>.<br>
    .<br>
    <strong>Step 2: Define character style for kern pair.</strong><br>
    It seems that this has to be done in a roundabout way, since custom kerning values cannot be entered in the Character Style dialog.<br>
    It's interesting to note that while InDesign only lets you insert a kerning value when the cursor is between the 2 glyphs in question, it seems that the kerning value is treated as a <em>property assigned to the first glyph in the pair</em>. Thus, by selecting the first one of these 2 glyphs and then defining a «New Character Style» you will be able to make a character style that contains this kerning value. (You want to pay attention that it doesn't contain anything else.) I'd name it something telling, like kern_T_oacute in this case.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/GREP-kern-3_6202.gif"></div><p></p>
    <p>.<br>
    .<br>
    <strong>Step 3: Apply this Character Style to all occurrences of the pair in question, via GREP.</strong><br>
    Make sure your text cursor is in one paragraph in question, then select «GREP Styles» from the Paragraph (not Paragraph Styles) palette flyout. Hit «NEW GREP Style…» and specify to assign the kern_T_oacute character style in case this condition is met:<br>
    <code>T(?=ó)</code><br>
    The important thing is to only assign the character style to the "T" (as the kerning value is treated as a property of the <em>first</em> glyph in the pair), but <strong>only if it is followed by "ó"</strong> – this condition is what the (?=ó) specifies as a Positive Lookahead (cf. <a href="http://help.adobe.com/en_US/InDesign/6.0/WSa285fff53dea4f8617383751001ea8cb3f-6f59a.html" rel="nofollow">Adobe Guideline on Metacharacters</a>). If you want to include other possibilities too (like odieresis), you can specify a class of possible second glyphs in brackets, like in the screenshot below.<br>
    When you hit Preview this baby should now automagically apply to all «Tó» pairs in the paragraph:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/GREP-kern-4_3891.gif"></div><p></p>
    <p>.<br>
    .<br>
    <strong>Step 4: Redefine Paragraph Style to include GREP style.</strong><br>
    Your Paragraph Style will now have a "+" added because the GREP style was added. Select «Redefine Style» to add the GREP style to the Paragraph Style definition. Now the custom kern pair should automatically be applied in all paragraphs based on this paragraph style. (Note that you'll have to do this for all paragraph styles you need the kern pair in.)</p>
    <p>Comments, suggestions, please shoot. I will add that in my case I actually solved it differently (via GREP Search&amp;Replace) but found out later that this way would have been much more elegant.</p>
