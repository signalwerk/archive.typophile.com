    html: |-
      <p>Thanks for the responses. I'm glad if this is helpful to some.</p>
      <p>Theunis, thank you very much for the input! I'm actually quite a newbie at GREP so these more advanced syntax constructions are quite illuminating.<br>
      Using that blanket character class wildcard (like <code>=o=</code>) seems like a bit of a dangerous technique from a type design perspective no? I mean considering that say the oacute and odieresis might need quite different kerning values when following a "T", depending on the design.</p>
      <p><cite>"Unfortunately, GREP styles are oblivious to formatting"</cite><br>
      Yes, this is really quite a bad constraint. I should have mentioned it. It's pretty stupid actually because if you do a GREP <em>search</em> then you <em>can</em> specify formatting (like in normal searches),* just not for GREP <em>styles</em>. Hmph.<br>
      (* I'm not quite sure, but there seems to be a problem here too: In the GREP Search, if any formatting is specified, not only the search term proper needs to match this formatting at but also the Lookahead too. Which is exactly a problem for this technique, since you'd only want to match the first glyph of the pair in terms of formatting. So if you have a pair like say "Ví" and the "í" already has a custom character style applied, and you search for "V(?=í)" with standard formatting it's not going to be found. :-\ )<br>
      The interface for these functions definitely needs refining, and I don't only mean a nice clickable GUI here, although that'd be rad too.</p>
      <p><cite>"does anyone else think it's weird you cannot enter a Kerning value in a Character Style definition? You can only insert one using Nina's trick: first apply, then "Define New Character Style""</cite><br>
      I'm thinking my "trick" might be a loophole. This is likely not <em>meant</em> to be done this way (or at all). Otherwise there would be a better interface for it. But I might be wrong.</p>
      <p><cite>"And if you got it wrong, you cannot edit it."</cite><br>
      Well you can edit it locally in one instance and then "Redefine Style". Which works, but is also a workaround. OK, hack. :-)</p>
      <p>Now of course the big question to the Adobe folks is, will any of this be improved in CS5?</p>
