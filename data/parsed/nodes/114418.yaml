      <p>Nick, is it possible people are talking about two distinct conceptions of fashion here?</p>
      <p>There's a famous quote by Brian Eno about The Velvet Underground: "Their first album only sold 30,000 copies, but everyone who bought one of those 30,000 copies started a band". A relatively small group of fans bought an album from 1967 (when the Velvet Underground was unusual), and precipitated a change that hit the mainstream ten or fifteen years later (when they were less so). This sort of thing isn't that strange, really: You have a small group of cognoscenti devotees of a particular style carrying on a line of thought different from the mainstream – and then at some point fashion changes and they're suddenly in the middle of it.</p>
      <p>So in this case it's perfectly possible some later-influential designers had a cult-figure Morris devotion going on, which bloomed into fashion when other trends ended up in a similar area. It may even have been fashionable in a smaller context, like the art world (there's plenty of examples of Morris-style lettering there), without breaking throught into the mainstream. It's not like the styling of today's graphic design avant-garde, to compare, is the same as its mainstream equivalent, though both are "in fashion" in distinct senses.</p>
