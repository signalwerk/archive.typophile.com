      <p>Craig, what I said is accurate. Caslon was first revived at the time you say, but it was only used for reprinting of old books, or books with stories set in old times. It was generally used only to create deliberate antique effect. </p>
      <p>The early Chiswick press books reviving Caslon did attract attention, I think, for their readability, as well as beauty. The next step was the creation of 'Old Style,' which was very widely used. But it has generally 'modern' features, but reduced contrast, which looked 'old style' enough to Victorian eyes. It was only after printer Emery Walker, a friend of Morris's, gave a talk about the history of type, showing samples of old printing, that Morris became passionate about type revival and designing and printing his own books. </p>
      <p>I did an article, 'Readability and Revival: The Case of Caslon,' for <em>Printing History</em> New Series no. 10 (July 2011), where you can read more of the story. William Peterson, who was editor then, and truly knowledgable of that period and its personalities, lives here in Washington DC, and was kind enough to share with me his research that is relevant to the story. So I think I got it right.   </p>
      <p>Morris was so much a taste and opinion leader that he changed the view of old styles, making them fashionable instead of quaint, and only after Morris did they start to be widely used. Morris wrote of "the sweltering hideousness of the Bodoni letter, the most illegible type that was ever cut, with its preposterous thicks and thins ..."  I don't agree with Morris—though his passion is wonderful—but it seems that at the time if William Morris said something wasn't cool, it wasn't cool. </p>
      <p>In America, for example, Vogue Magazine, started in 1892, adopted Caslon, and that started the Caslon popularity in the U.S.  Emery Walker himself, if I remember rightly, preferred Caslon to Jenson.</p>
