      <p>Earlier in this thread, we saw that Caslon was revived before Morris, not just before Goudy. That Goudy was influenced by Morris, though, while it shows that Morris must get some of the credit, doesn't itself show that Goudy didn't have an important role - although your other point, that Goudy wasn't the only typographer to be inspired by Morris, and then move on to more sober historical revivals <em>is</em> telling.</p>
      <p>Giving Morris full credit seems odd, since his own revivals are so different from the other revivals that came after him. But seeing how Goudy, Rogers, and Updike reacted to their initial inspiration by Morris means that they get some of the credit too, because they produced revivals that would be more popular and that would stand the test of time. Without their contributions, Morris might have been seen as only an eccentric, rather than someone who was influential and even pivotal.</p>
