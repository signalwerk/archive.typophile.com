      <p>Nick, your scenario that it was Goudy, not Morris doesn't wash, not least because Goudy was heavily influenced by Morris, as <a href="http://en.wikipedia.org/wiki/Frederic_Goudy#Biography" title="Click to visit an external URL." class="freelink freelink-external freelink-external">the wikipedia article on him notes.</a> Goudy's Village, 1903—was it Goudy's first type?—was strongly influenced by Morris's Golden type. Goudy bought Morris's physical Kelmscott Press, and the first thing Goudy published on his own Village Press was an essay by Morris and Walker. </p>
      <p>This story of going through a Morris phase, then rejecting it, but doing more sober historically influenced work, including revivals, happens again and again. Updike initially went through a phase of imitating Morris, producing the best book done in the US with a Morris aesthetic, according to Peterson. Then he rejected the Morris aesthetic, but did historical style printing, as the <a href="http://en.wikipedia.org/wiki/Daniel_Berkeley_Updike#The_Merrymount_Press" title="Click to visit an external URL." class="freelink freelink-external freelink-external">wikipedia article on him explains.</a>  And of course wrote his great history of types—but it started with Morris. Bruce Rogers got into book design because of seeing Morris's work. And of course Centaur is a Jenson-influenced type, though Rogers also rejected the heavy Morris aesthetic in .</p>
      <p>Also people were doing revivals before 1911, so it wasn't Kennerley that suddenly turned the tide. Inland Type Foundry did a Caslon in 1901, which became the basis for Monotype's Caslon 337. And Monotype did a Caslon as early as 1903. ATF's Caslon 540 was 1902, and their Caslon 471 was before that. Lawson's book also tells the same story about Vogue in America, but more extensively, with more details about the influence of Vogue's use.   Also the Doves type (1900), used by Walker's press, was influential, as Peterson documents. Morris was just all over the place, though you could argue it was equally Walker. The revival snowball was already rolling when Goudy started doing type.</p>
