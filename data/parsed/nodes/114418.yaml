      <p>&gt;If William Morris, who died in 1896, was so inﬂuential typographically, why the delay?</p>
      <p>Except there wasn't a delay. As I said, Caslon was used by Vogue in 1992, and—here I am relying on Mac MacGrew's book American Metal Typefaces—this started the popularity of Caslon in America. This would be the 'McKellar' Caslon, a foundry type allegedly produced by electroplating originals. In England,  George Bernard Shaw, who knew both Morris and Walker through Socialist circles, insisted on printing his plays in Caslon, before the turn of the century. You can see some of the story  <a href="http://here" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://here</a>. </p>
      <p>This *general use* of Caslon I think dates after Walker and Morris were praising it. The general revival of old style types involves both Caslon and the Jenson that Morris copied, as well as many other types. </p>
      <p>In America, certainly Theodore Lowe DeVinne was also an influence, criticizing the high contrast types of his time, and using his influence to reduce thick-thin contrast in the original Century type, commissioned for the magazine he printed. He gave a good review of Caslon in his Historical Printing Types, but I don't think he used Caslon himself, whereas a book by Morris was printed in Caslon in 1892, probably under the influence of Walker. </p>
      <p>It is a general revaluation of older types that I think is the main influence of Morris, though the case is circumstantial; I can't prove that Morris was a key factor in changing typographic tastes, but when you look at the big picture, it sure looks that way. Of course it is ATF, Linotype, Monotype who use the pantographic punch cutter to do the revivals over next forty years.</p>
