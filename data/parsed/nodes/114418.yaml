      <p>Thanks, Chris. Yes, I see looking at McGrew that Linotype's Caslon (not Caslon Oldface) was in 1903, and Intertype, a competitor to Linotype had one at the same time. So the Life Magazine is probably in one of those. As to what is "fashionable," Nick, I haven't done a study of the advertising of that day, but if Vogue used a Caslon in 1892 and Life magazine was using it in 1906, I would say that is probably evidence of its further use in text of magazines. By 'fashionable' I meant, as I indicated above, that it was regarded as 'cool' by taste leaders of the time, such as the owners of Vogue, who wanted to use a real old style (not Phemister's Old Style, which DeVinne had slammed in Historical Printing Types). As to its use in advertising, which I grant you is also a kind of 'fashionable' I don't know. </p>
      <p>You're right that I haven't studied magazines of the period, but your story, above is very off target. You wrote:</p>
      <p>"You won’t ﬁnd true old style typefaces, other than sporadic Caslon, Golden Type knock-offs, and Della Robbia, widely used in the U.S. mass media until Goudy’s Kennerley in 1911 (not a revival), which was the game changer. In the UK, Imprint (1913) appears to have been the ﬁrst new old style."</p>
      <p>Caslon was not "sporadic". On the contrary there was a race to have it, with all the leading foundries—ATF, Linotype, Monotype, Intertype—having to have it, and actually even multiple versions, before Kennerley was drawn. And we know of at least two popular magazines that were using it. And by the effort the foundries put into it, I would still bet that there was much wider use as well in books and the text of magazines. In any case, Kennerley was not a "game changer". Indeed, as you said, Goudy was trying to do an old style to improve on Caslon, which was already by 1911 seen as one of the best models.  The game changers were Walker and Morris. </p>
      <p>Here is the testimony in 1920 (from my article, and thanks to Peterson's prior research) of Charles T. Jacobi, who was for long editor of the Chiswick Press, which had first revived and used Caslon extensively, though for an antique look: "the excellent design of these different founts was not generally appreciated until about the year 1888, when the Arts and Crafts Society first came into existence, and Mr. Emery Walker was perhaps more responsible than anyone else for making known this series of faces." Walker was the innovator in seeing old styles as suitable for contemporary use, but the famous Morris, who took up the lance, was the force that spread the idea.</p>
