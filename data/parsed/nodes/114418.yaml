      <p>@Birdseeding:<br>
      Given that Goudy was inspired by Morris, your explanation is indeed the one that clarifies things.</p>
      <p>Since Goudy was recognized as a very talented type designer who produced many typefaces of immense and enduring popularity, while the types Morris designed largely remained quaint curiosities, it's natural to want to give Goudy instead of Morris credit for a major development in typography.</p>
      <p>By pointing out that Jenson Old Style made it to the <em>Ladies Home Journal</em>, of course, Nick Shinn might have refuted his own point. But I didn't feel that way until Nick Shinn's latest post just before yours. In 1900, a lot of typefaces were popular that hardly anyone would have considered in 1950 or today.</p>
      <p>The revival phenomenon that needs to be explained is the series of revivals including those of Baskerville and Garamond, involving both ATF and (British) Monotype.</p>
      <p>The candidate inspirations are:</p>
      <p>The revival of Caslon, which is known to have led to Phemister old style.</p>
      <p>Morris' revival of Jenson's type as Golden.</p>
      <p>Goudy's creation of Kennerley.</p>
      <p>Anatomy of a Typeface notes that Bembo was the last of the initial group of Monotype revivals, and that it came out in 1929. It specifically takes the position that this was engendered by William Morris and the private press movement. As well, it is noted that Monotype created a version of Centaur... and Bruce Rogers does seem to have been inspired by Morris.</p>
      <p>In my earlier post, I noted, in effect, that if none of those 30,000 people buying the Velvet Underground album had musical talent, then the Velvet Underground would not have been influential. Which is why I felt there was room for those who felt that the 'real' credit should go to Goudy or Rogers. And, of course, someone had to figure that it was worth reviving Garamond and Baskerville in addition to Jenson and Aldus: that decision changed revivals from being something for artistic books to something that impinged on general publishing.</p>
