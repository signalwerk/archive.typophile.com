      <p>Ps. I didn't say that Morris's revivals of Jenson were particularly readable. I don't think they were. My view is that part of the attraction of Caslon in particular, after its first 1844 book revival, was its readability. I think the subsequent creation of Old Style, the comments of DeVinne and later Updike lend credibility to this idea, which I argue in my Printing History article. I think Walker appreciated Caslon much more than Morris, whose influence was more general in the direction of the value of revivals.</p>
      <p>I am not disparaging the importance of advertising. But I do think it didn't drive the train of old style revival. Walker and Morris, Vogue Magazine, and then the book designers did.</p>
