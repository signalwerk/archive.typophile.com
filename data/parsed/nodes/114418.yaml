      <p>I somehow missed Johan's (birdseeding) post above. Yes, Nick has a different concept of 'fashionable', applying to advertising. That is an interesting approach, and I look forward to reading his article. However, the spread of actual printing with revivals, even if advertising came later, does show that the revival train was chugging away before Goudy's work in 1911. I wasn't conflating different senses of 'fashionable' as not looking at advertising at all. So I am happy for Nick's notice of this work, and look forward to reading his article. But it doesn't change the type revival story in the late 19th and first half of the 20th century. Putting Goudy at the center, rather than Morris, I just don't think is supported by the evidence.  </p>
      <p>As to fixing Caslon, absolutely everybody does it who has revived Caslon, including me. Generally people do reduce the weight of the caps, and do tighter spacing. I also reduced the weight of the caps (so did Carol Twombly for Adobe, but made them very tall), but for the text size I kept the looser spacing, as for me that was 'a feature, not a bug.' But as I have written, Caslon is a kind of Rorschach test for every revival of it: we see different 'good' Caslons and 'mistakes' in it. The same kind of thing happens with every revival, though probably more with pre-Baskerville types than after.</p>
