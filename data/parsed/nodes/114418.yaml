      <p>I think it's very important for typefaces to be beautiful instead of ugly, and to be readable. But I don't think it's necessary for a type to be an old style instead of a modern to have these attributes.</p>
      <p>As I've noted, the earlier Scotch Romans were wider and darker in color, and thus pleasing, but the narrower and lighter ones that came later are the ones I did not like. Century Expanded, while it has some transitional characteristics - its serifs are bracketed - is basically an attractive Scotch Roman.</p>
      <p>Why were the unattractive Scotch Romans tolerated for so long?</p>
      <p>There are many possible answers.</p>
      <p>Initially, the Scotch Roman faces took over because they did not include the long s; at the time, if a book was set in Caslon, it kept the long s.</p>
      <p>Maybe the Scotch Romans looked nice to the people at the time; judging things by current aesthetic standards may be wrong.</p>
      <p>The Scotch Romans became narrower to save space; given the cost of paper and printing, those faces were in use because books set in the kinds of face we would prefer would not be competitive.</p>
      <p>I suspect the third answer is what explains the situation, deplorable to our eyes, continuing for so long - and the first is also true, explaining how it got started.</p>
      <p>If Scotch Romans were what people were used to, and the initial designs were attractive and readable, why not just go back to them when economic conditions changed, and people could afford to pay more for paper and ink to spare themselves eyestrain?</p>
      <p>To me, <em>that's</em> the question that I find perplexing. And thus, I don't find it too odd that William Morris may get the credit for the oldstyle revival. If economic conditions made room for more attractive types, and printers who filled that demand wanted their types which used more ink and paper to be <em>visibly</em> different, so they would get the credit for what they were doing that added to the cost of their product -</p>
      <p>that is, when you make something more expensive, you want customers to be able to see at a glance that they're getting better quality for their money -</p>
      <p>then instead of using a more generously proportioned Scotch Roman, they will seize on any model they have to hand for a text type that people will accept even though it's distinguishable at a glance from what they're used to.</p>
      <p>Even if it's a Jenson previously used by the most elite and eccentric of private presses! Or, in the opposite direction, a pseudo-oldstyle that sticks a few of the features of Caslon on a Scotch Roman body - to take a more jaundiced view of the Phemister oldstyle than I normally feel justfied in taking.</p>
      <p>Kennerley is more of a Jenson than the Golden Type and its Jenson Oldstyle imitator were. So it contributed to the later Cloister Oldstyle to some extent, I'm sure. It was used in books, and to our eyes today, it looks like something worth using in a book - unlike Jenson Oldstyle and Phemister Old Style, for different reasons. But while it was <strong>the first modern revival</strong>, since Jenson Oldstyle already made Jenson visible, ATF could well have made something very like Cloister anyways; they knew what Jenson really looked like, and given that the Ladies' Home Journal would even use Jenson Oldstyle, there was a demand out there for distinctive premium body copy faces, which typefounders could most easily fill with revivals.</p>
      <p>So I feel I'm now in agreement with Nick Shinn on <em>two</em> points:</p>
      <p>Kennerly was the first really successful new old style.</p>
      <p>William Morris' immediate direct influence on popular culture was limited. (As the Ladies' Home Journal shows, not nonexistent, but his influence at least took time to be felt.)</p>
      <p>Cheltenham was a typeface widely used in advertising in the time period of interest. Cheltenham and Bookman (also by Phemister) are typefaces that have stayed around; Cheltenham was in the Kelsey catalog, and it was on phototypesetters. Bookman was on phototypesetters, and it was one of the earliest typefaces to be made available for laser printers, back when laser printer fonts were made of dots instead of outlines.</p>
      <p>While Kennerley dates from 1911 (from ATF? or did people buy fonts direct from Goudy?) it wasn't until 1920 that it was available <em>on Monotype composing machines</em>. That's when the popular taste got ahold of Kennerley, and sent a loud and clear signal that Kennerley was preferred to Cheltenham or Bookman as a text face replacement for Scotch Roman.</p>
      <p>Oops. Benton revived Bodoni in 1909, and Garamond in 1917. So although I think the real pivotal influence is a change in economic conditions, this seems to point away from Goudy as being the inflection point.</p>
      <p>Except, of course, that Bodoni and Garamond also took time to make the jump to the composing machine... so there could still have been earlier feedback from Kennerley from how popular it was with advertisers.</p>
      <p>Oops. Kennerley was from 1911. 1909 is before 1911.</p>
    html_clean: |-
      <p>I think it's very important for typefaces to be beautiful instead of ugly, and to be readable. But I don't think it's necessary for a type to be an old style instead of a modern to have these attributes.</p>
      <p>As I've noted, the earlier Scotch Romans were wider and darker in color, and thus pleasing, but the narrower and lighter ones that came later are the ones I did not like. Century Expanded, while it has some transitional characteristics - its serifs are bracketed - is basically an attractive Scotch Roman.</p>
      <p>Why were the unattractive Scotch Romans tolerated for so long?</p>
      <p>There are many possible answers.</p>
      <p>Initially, the Scotch Roman faces took over because they did not include the long s; at the time, if a book was set in Caslon, it kept the long s.</p>
      <p>Maybe the Scotch Romans looked nice to the people at the time; judging things by current aesthetic standards may be wrong.</p>
      <p>The Scotch Romans became narrower to save space; given the cost of paper and printing, those faces were in use because books set in the kinds of face we would prefer would not be competitive.</p>
      <p>I suspect the third answer is what explains the situation, deplorable to our eyes, continuing for so long - and the first is also true, explaining how it got started.</p>
      <p>If Scotch Romans were what people were used to, and the initial designs were attractive and readable, why not just go back to them when economic conditions changed, and people could afford to pay more for paper and ink to spare themselves eyestrain?</p>
      <p>To me, <em>that's</em> the question that I find perplexing. And thus, I don't find it too odd that William Morris may get the credit for the oldstyle revival. If economic conditions made room for more attractive types, and printers who filled that demand wanted their types which used more ink and paper to be <em>visibly</em> different, so they would get the credit for what they were doing that added to the cost of their product -</p>
      <p>that is, when you make something more expensive, you want customers to be able to see at a glance that they're getting better quality for their money -</p>
      <p>then instead of using a more generously proportioned Scotch Roman, they will seize on any model they have to hand for a text type that people will accept even though it's distinguishable at a glance from what they're used to.</p>
      <p>Even if it's a Jenson previously used by the most elite and eccentric of private presses! Or, in the opposite direction, a pseudo-oldstyle that sticks a few of the features of Caslon on a Scotch Roman body - to take a more jaundiced view of the Phemister oldstyle than I normally feel justfied in taking.</p>
      <p>Kennerley is more of a Jenson than the Golden Type and its Jenson Oldstyle imitator were. So it contributed to the later Cloister Oldstyle to some extent, I'm sure. It was used in books, and to our eyes today, it looks like something worth using in a book - unlike Jenson Oldstyle and Phemister Old Style, for different reasons. But while it was <strong>the first modern revival</strong>, since Jenson Oldstyle already made Jenson visible, ATF could well have made something very like Cloister anyways; they knew what Jenson really looked like, and given that the Ladies' Home Journal would even use Jenson Oldstyle, there was a demand out there for distinctive premium body copy faces, which typefounders could most easily fill with revivals.</p>
      <p>So I feel I'm now in agreement with Nick Shinn on <em>two</em> points:</p>
      <p>Kennerly was the first really successful new old style.</p>
      <p>William Morris' immediate direct influence on popular culture was limited. (As the Ladies' Home Journal shows, not nonexistent, but his influence at least took time to be felt.)</p>
      <p>Cheltenham was a typeface widely used in advertising in the time period of interest. Cheltenham and Bookman (also by Phemister) are typefaces that have stayed around; Cheltenham was in the Kelsey catalog, and it was on phototypesetters. Bookman was on phototypesetters, and it was one of the earliest typefaces to be made available for laser printers, back when laser printer fonts were made of dots instead of outlines.</p>
      <p>While Kennerley dates from 1911 (from ATF? or did people buy fonts direct from Goudy?) it wasn't until 1920 that it was available <em>on Monotype composing machines</em>. That's when the popular taste got ahold of Kennerley, and sent a loud and clear signal that Kennerley was preferred to Cheltenham or Bookman as a text face replacement for Scotch Roman.</p>
      <p>Oops. Benton revived Bodoni in 1909, and Garamond in 1917. So although I think the real pivotal influence is a change in economic conditions, this seems to point away from Goudy as being the inflection point.</p>
      <p>Except, of course, that Bodoni and Garamond also took time to make the jump to the composing machine... so there could still have been earlier feedback from Kennerley from how popular it was with advertisers.</p>
      <p>Oops. Kennerley was from 1911. 1909 is before 1911.</p>
