      <p>Gentlemen, you misrepresent me.<br>
      I’m not proposing Goudy as an instigator or inﬂection point, whatever that is.<br>
      I’m simply asking why, if Morris was so influential, the old style revival took so long after Kelmscott to produce any new old style faces—Caslon, as revival, having been around since Lady Willoughby.<br>
      And Caslon is an 18th century design, not Renaissance or Medieval, which was really Morris’ obsession.</p>
      <p>The other antiquarian elements of Morris’ graphic design had been well taken up.<br>
      Can you deny that Kennerley was the ﬁrst really successful new old style, in 1911?<br>
      I think it’s legitimate to term such success as “game changer”, and to connect it to Goudy’s demonstration of smooth, tight ﬁt, and in a face with Venetian “e”—that’s about as old style as it gets!</p>
      <p>And if, Bill, you are going to assert that old styles had wide usage, surely that must mean in mass-circulation magazines and newspapers?</p>
      <p>William Morris was a Great Man and makes a good academic narrative, but he didn’t have a monopoly on nostalgia. He got into printing late in his career.<br>
      The idea that historic style was only used for historic documents is at odds with 19th century currents of design.<br>
      In the ﬁeld of children’s literature, for example, designer-illustrators such as Kate Greenaway and Randolph Caldecott were producing nostalgic graphic picture books before Kelmscott, some of them set in Caslon. The text and subject matter of these children’s books was from earlier times, but their conception was contemporary, they were considered archetypal and ideal—following a sentiment of anti-industrialization—as the idea of progressive modernism had yet to emerge.<br>
      And Walter Crane, for Edmund Evans, before his association with William Morris.<br><a href="http://www.randolphcaldecott.org.uk/imgbackc/MlkmdBackCvrRtldg1st.jpg">This</a> from 1882.</p>
      <p>Another parallel thread, in America, was that of Colonial revivalism. Well known in architecture, but not without cachet in print.</p>
