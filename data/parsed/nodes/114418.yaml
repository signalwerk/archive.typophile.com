    <p>William Morris was a key artist in the second half of the XIX th century through the pre-raphaelites and the Arts &amp; Crafts and had a vivid influence on the creation of private press. Some typographers and calligraphers asserted they followed the path of Morris. Among them, find at least three names of early XX th century typographers: the American Frederic Goudy, the Austrian Victor Hammer and the German Rudolf Koch.</p>
    <p>Do you know other typographers under the influence of William Morris, by the way?<br>
    Thanks in advance.</p>
