      <p>Nick, your point about the leadership and popularity is interesting and valid. But Vogue magazine was apparently huge, and that kind of thing is influential. Similarly with Shaw. The fact that it took time to build is not surprising. To see trends, you have to look over time. That something started small is not unusual. Also people like Lawson and Peterson looked at a lot of literature of the time. I don't think they deserve your disparaging remarks.  </p>
      <p>John, I agree that the credit should be spread around. The earlier efforts of the Chiswick Press were also important, and all those people, including Goudy, were a part of what created the change. I'm not saying that Goudy didn't have an impact, Nick, but I think when you track it, Morris (or Walker-Morrison) is more of an inflection point. Of course the inflection point also coincided with the invention of the pantographic punch cutter, which enabled revivals to be made much more cheaply, I think. So that may have equally been a factor.</p>
      <p>By the way, on readability, I think it was Theodore Lowe DeVinne's critique of high contrast which was the influence. Benton the father did the first version of Century, following DeVinne's guidance. Later with M.F. Benton's Clearface, an effort to be highly readable, I think the influence was some research of the time.</p>
