      <p>I should have been more careful in indicating what I was seeking to clarify.</p>
      <p>I think it is a defensible position to take the series of revivals at Monotype, and note that they are clearly linked to the revivals of Garamond and Baskerville at ATF, but then to treat those revivals as a separate phenomenon from the revival of Caslon, which took place much earlier.</p>
      <p>Because Caslon's revival took place so much earlier, it can't be the only cause of those later revivals. (And if it was, since Caslon's revival preceded Morris' activity, this would also disprove the claim that Morris was pivotal.)</p>
      <p>That is all I meant when I referred to the later revivals as "real"; I meant they were the ones of interest, as part of a broad movement to revive numerous typefaces; I was not trying to disparage Caslon's revival.</p>
      <p>Excluding Caslon, which came along too early to be to Morris' credit, and excluding Morris' own specific revival, the Golden Type, we have a bunch of revivals that did take place in a post-Goudy time frame. People who didn't like Goudy's types (I like some of them, the most popular ones, but I admit I'm not myself a fan of much of his output) could still have been influenced by him at second hand.</p>
      <p>So, to me, the question is: was there really a big gap when while there were some oldstyle types - Caslon, Jenson Oldstyle, and Phemister's Old Style - nothing much else happened until ATF revived Garamond and Baskerville, which would support, from a timing viewpoint, Nick Shinn's argument?</p>
      <p>Or were there other revivals, or at least other indications of interest in earlier typefaces, in the time span following Morris' Golden Type, that show that it wasn't just a flash in the pan that would have led nowhere until an important later event - such as Kennerley by Goudy. (If someone else takes Nick Shinn's point of view, but sees another person, instead of Goudy, as the one to credit, they're welcome to come forward.)</p>
