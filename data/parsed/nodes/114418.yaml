      <p><cite>The Scotch was, and is, a brilliant design.</cite></p>
      <p>Yes, I shouldn't echo Updike when I don't really agree with him. The early Scotch Roman faces from around 1850 were beautiful, and it wasn't until later that the drive for economy in printing led to some Scotch Romans being overly condensed, overly light, and in other ways giving the face a bad name.</p>
      <p>However, that period was dark for typography for other reasons. If you didn't want to use Scotch Roman for body text on one occasion, your other choices were the Phemister Old Style - not a bad face - or some faces called French Old Styles.</p>
      <p>The additional choices that became available some time after the revival of Caslon and Morris' Golden Type (which I've learned is based on a face by Jacob Rubeus, not Jenson after all) immeasurably enriched typography, even before Baskerville and Garamond became available once again.</p>
