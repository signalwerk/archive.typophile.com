      <p>Nick, I look forward to reading your Codex article. </p>
      <p>However, advertising is not the only thing printed, and I think your high handed rejection of whatever isn't in advertising is ridiculous. You know, there were such a thing as books, and a lot of people read them. It may well be that books led the way on the adoption of Caslon, though Vogue (1892) was, I believe a hugely popular magazine—and of course still around. </p>
      <p>And the adoption of Caslon, and then other revival old styles, for general use, not just antiquarian effect, was, as I said, crucially influenced by Walker and Morris. And Caslon revivals were being churned out and sold by ATF and Monotype well before Kennerley in 1911. For example, <a href="https://archive.org/stream/brucerogersdesig00ward#page/n9/mode/2up" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Frederic Warde, writing in 1925 about Bruce Rogers</a> relates that seeing Morris "came as a revelation" to Rogers and changed his whole way of thinking about books. Rogers is known for using Caslon a lot, starting in 1897 (see the bibliography in the linked book), and had a special version of Caslon cast for his use on the Monotype machine, Riverside Caslon, in 1909. Daniel Berkeley Updike <a href="http://en.wikipedia.org/wiki/Daniel_Berkeley_Updike" title="Click to visit an external URL." class="freelink freelink-external freelink-external">purchased Caslon in 1904</a>. Updike was probably the biggest Caslon fan ever, and printed 14,000 items over his career, many of them using Caslon. His Marymount press, even though it specialized in fine editions, was commercial and also did a lot of other work. The point is, judging by the most revered and influential book designers, the Caslon freight train was going full speed before Goudy ever did Kennerley, and the popularity of Caslon with these taste leaders was itself an invitation to revive other old styles, quite apart from Goudy's work. And these guys who actually did the revivals sure knew about Rogers and Updike. Oh, and I believe, Stanley Morrison, who did the later revivals with Monotype England, despised Goudy and his work. (I like some of Goudy.)  </p>
      <p>So your idea about Kennerley leading the way for old style revivals isn't consistent with the facts of book history. And by the 20s, I know I can find many, many ads in Caslon. Not least in The New Yorker, which started in 1926, if I remember rightly. And it used in its text Linotype Caslon Old Face—not Kennerley. And it still uses versions of Caslon, including, er, mine.  So John's story of the Velvet Underground is very much on point, with Morris as the Velvet Underground, Rogers and Updike as in the first wave of those influenced, and popular taste in advertising following. And Caslon had it own momentum, apart from Goudy.</p>
