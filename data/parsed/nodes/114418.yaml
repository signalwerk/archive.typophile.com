      <p>I don’t think the dots connect quite so neatly, Bill.</p>
      <p>It’s a bit of a stretch to call the Golden Type an old style, it’s more of a caricature, not a general purpose “readable old style” design.</p>
      <p>Morris Benton at ATF produced several antiquarian styles, e.g. Roycroft and Bodoni, and the Arts and Crafts Cheltenham, and the functionalist Clearface, before he got around to reviving an old style (Cloister, his Jenson). </p>
      <p>You won’t ﬁnd true old style typefaces, other than sporadic Caslon, Golden Type knock-offs, and Della Robbia, widely used in the U.S. mass media until Goudy’s Kennerley in 1911 (not a revival), which was the game changer. In the UK, Imprint (1913) appears to have been the ﬁrst new old style. </p>
      <p>As you say, people were quite happy with “Old Style”. Morris Benton thought the readability road ahead was through Cheltenham, Century and Clearface, not old style.</p>
      <p>So, while William Morris, D.B. Updike, Will Bradley, Walter Crane (<em>Of the Decorative Illustration of Books</em>) et al can be said to have stimulated the fashion for historicist graphic design and page layout in the late 1890s, it didn’t translate into the production of popular “readable old style” text faces during the ﬁrst decade of the 20th century. If William Morris, who died in 1896, was so inﬂuential typographically, why the delay?</p>
