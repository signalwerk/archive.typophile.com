      <p>More on Kennerley as killer app:</p>
      <p>It was Goudy’s most successful type design, in terms of sales.<br>
      So it was huge.<br>
      It was the ﬁrst American typeface to be sold in Europe (Monotype licensed it).<br>
      It was Goudy’s ﬁrst big commission.<br>
      Prior to Kennerley the state of the art in antiqua or old style design was Caslon, “Old Style” and some private press Jensons. Nothing new in the way of old.</p>
      <p>But most importantly for the old style revivals that would follow, Kennerley presented a newly (or rediscovered) stringent concept of fit.<br>
      As Goudy described it, <em>“What was wrong with Caslon? I had by this time decided that the pages presented a spotty appearance, largely due to the strong contrast in color between the capitals and the lower-case, and partly due to the wide ﬁtting of the letters themselves, making it impossible to present each word as a compact unit, which I felt was desirable, for only if each word is a compact unit can close spacing between words be used.”</em></p>
      <p>Goudy would subsequently employ this concept of tight ﬁt in his Goudy Old Style, and in Italian Oldstyle, which took it to the max.</p>
      <p>You can see it in the sequence “p_e_a” <a href="http://f.cl.ly/items/1i1w3e2R0g172w023G36/Kennerley_CU.jpg">here</a>. The pointedly diagonal stress which Goudy attributes to the old style enables these three letters to be butted up against one another, without creating a clot between “p” and “e”. That’s how Jenson did it. And it’s how Morris Benton did it in <a href="http://f.cl.ly/items/320Q240R3R442Y331p3j/Meal.png">Cloister</a>, his Jenson.</p>
      <p>As a new typeface which demonstrated a theoretical principle, I believe that Kennerley was instrumental in opening typographers’ eyes to the look and potential of the old style. There were other related memes and connections in play too in the ﬁrst few years of the century, such as the method of Edward Johnston with broad-pen lettering, inﬂuential on Eric Gill, who worked with St. John Hornby of the Ashendene Press, who also owned WH Smith &amp; Sons, for whom Gill produced a corporate identity utilising a special “old style” <a href="http://f.cl.ly/items/231e1j1D263G3W2P3b2v/Gill_Lettering.jpg">lettering style</a> he designed. Again, note the combination of diagonal stress and tight ﬁt.</p>
      <p>I rest my case…</p>
