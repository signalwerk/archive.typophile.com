      <p>@William Berkson:<br><cite>And Goudy is aware of all this, and specifically is trying to 'fix' Caslon in his Kennerley, as he says in Nick's quote.</cite></p>
      <p>I must be losing track here, because I thought Kennerley was a Jenson, not a Caslon.</p>
      <p>The argument is that Goudy was the inflection point; so despite Stanley Morison being uninterested in Goudy, since the Monotype revivals were presumably triggered by the ATF revivals of Garamond and Baskerville... the question is whether or not Goudy was critical to <em>those</em> having happened, or whether they or something similar would have happened in any case because of the momentum started by Morris.</p>
      <p>Morris had followers, and <em>one</em> of them was Goudy. Already, Nick Shinn's argument is in deep trouble. <em>Unless</em> the efforts of Rogers, de Vinne, and so on would not have yielded much fruit by themselves, while Goudy alone among those Morris inspired had a major lasting influence.</p>
      <p>To answer this question, I think we need to get into the mind of Linn Boyd Benton.</p>
      <p>In researching this topic, I happen to have learned that de Vinne played a major role with respect to Century Expanded. <em>That</em> type becoming hugely popular would very likely have sent a message that a Baskerville revival was worthwhile without Goudy's help... this is the direction I think an argument aimed at refuting Nick Shinn's position must take.</p>
