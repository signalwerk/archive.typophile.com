      <p>Bill, you said:<br><em>“Morris was so much a taste and opinion leader that he changed the view of old styles, making them fashionable instead of quaint, and only after Morris did they start to be widely used.”</em><br>
      —but you haven’t studied the mass media of the day to see what was actually in fashion, instead relying on the skewed opinions of academics (under the assumption that this means you will “get it right”) and the evidence of specimen books—which tell only what was available, not what was popular.</p>
      <p>The record is clear in large-circulation publications of the ﬁrst decade of the 20th century—old style (antiqua) faces were not popular! (Other than the Old Style that originated c. 1850.)</p>
      <p>Yes, after Morris old styles did start to be *widely* used, but only long after, and after the efforts of Goudy.</p>
      <p>I don’t deny that “the ball was rolling”, as you say, but outside of the general fashion.<br>
      Bear in mind, the private presses were an incubator (which we can see with hindsight), a tiny market removed from the commercial mainstream.</p>
      <p>I asked: Why the delay?</p>
      <p>And I identiﬁed two reasons: ﬁrstly because the thinking, by those such as Morris Benton, about readability/legibility was towards ideas such as heavier weight and lower contrast (Century and Cheltenham) and clarity of form (Century and Clearface). I suspect that historicism was primarily an issue of authenticity for Benton, not a key to readability.</p>
      <p>And secondly, it took Goudy a while to ﬁgure out what made the historical old style tick, how to make it work again, and for it to become popular through the “killer app” of Kennerley. </p>
      <p>Isn’t it counter intuitive that a style hundreds of years old would have been considered to be efficient in the Progressive era? It took Goudy’s experiments with historical pastiche and text color to synthesize, through design, an attractive demonstration of a proposition that William Morris’ elitist typography had only hinted at, that the allure of the past could be a gateway to contemporary mass functionality.</p>
