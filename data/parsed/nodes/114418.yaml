      <p>John, I guess I haven't been sufficiently clear, so let me have a go at it again. Caslon got general notice after the revival by William Pickering, publisher, and Charles Whittington, printer at the Chiswick Press. The book that first got notice was Lady Willoughby's Diary, 1844. There were subsequent Chiswick Press editions using Caslon, but, and this is the important point, they were always of old books or books set in old times. They were used for antique effect. So far as know, nobody put them to general use for books, magazines, or for that matter advertising, before Walker brought them to attention of Morris, and through both their efforts to the rest of the English speaking world. </p>
      <p>For Lady Willoughby's Diary, it was not strictly speaking a revival; it was actually actually old fonts of foundry type stored at the Caslon Foundry, pulled out after long neglect. The first time you have actual recutting of old types—always with some changes—is with Morris. And *immediately* (in 1893) you get ATF doing a Jenson/Morris knock-off. And as early at 1897 you get a Caslon recutting, and then a whole bunch of new versions of Caslon beginning in the new century. And they are being used in popular magazines, Vogue in 1892, and Life, as we have seen from at least 1906. Further, both Bruce Rogers and Daniel Berkeley Updike are using revival versions, including Rogers' custom version for the Riverside Press. And you have good Jensons with the Doves type (1901, I think) by Cobden-Anderson, who had worked with Morris, and Centaur (1913) from Rogers, who was originally inspired by Morris.  The actual recutting of old types with revisions, including at ATF only begins with Morris. That's why I say that he was the 'inflection point'. </p>
      <p>And Goudy is aware of all this, and specifically is trying to 'fix' Caslon in his Kennerley, as he says in Nick's quote. </p>
      <p>Now you have both a bunch of Caslons and Jensons by 1911, and the revival of Bodoni by ATF in 1910-11 by Benton. Then in 1913 you have Plantin, done at Monotype England. <a href="http://en.wikipedia.org/wiki/Plantin_(typeface)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Here Frank Hinman Pierpont says</a> the 1913 revival is because he saw the fonts displayed at the Plantin Moretus Museum. And you have Centaur also in 1913. Now you've already had real revivals rolling for twenty years. So what is the evidence that Pierpont and Rogers were influenced by Goudy's success? I suspect the answer is none. That's why the story of Goudy influencing Monotype England to do revivals is unconvincing to me. Also when you get Morrison on board, he and Goudy apparently did the Garamond revivals at the same time, and he disparaged both Garamont and Goudy. So was he influenced by Goudy? Not likely.</p>
