      <p>In the book <em>Types of the DeVinne Press</em>, dated 1907, reference is made to Renner, a typeface cut at the Bruce typefoundry at the request of the DeVinne press in 1899.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Renner_5328.jpg"></div><p></p>
      <p>So this is apparently a revival which predates the other revivals (excluding Caslon) discussed in this thread.</p>
      <p>Incidentally, found</p>
      <p><a class="freelinking external" href="http://www.paulshawletterdesign.com/2012/09/book-review-type-revivals/" rel="nofollow">http://www.paulshawletterdesign.com/2012/09/book-review-type-revivals/</a></p>
      <p>this scathing review of a book on type revivals; I'm trying to look up Basle Roman. as well as the book typeset by Franz Renner, but haven't found them.</p>
      <p>(EDIT: I've found Basle Roman now; I'm not sure if I would call it a revival -</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Basle_5358.jpg"></div><p></p>
      <p>but in any case, I'm happy to have found it. However, I've noticed it's hard to see what that type looked like from the sample, so here's one on a larger scale:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Basle2_5022.jpg"></div><p></p>
      <p>And it is stated to have been derived from a sixteenth-century type by Froben according to search results other than the one that led me to The Wife's Manual, where it was (believed to have been) first  used.</p>
      <p>And this thread</p>
      <p><a class="freelinking external" href="http://typophile.com/node/56292" rel="nofollow">http://typophile.com/node/56292</a></p>
      <p>has an image of Froben's actual type; there's also a very accessible one</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Froben_4465.jpg"></div><p></p>
      <p>in Updike)</p>
      <p>Indeed, though, this now fleshes out the story that this thread discussed.</p>
      <p>For a while, Caslon was the near-universal choice for text printing.</p>
      <p>Then Baskerville came along, and produced some books of very high quality, and a typeface cut to a high standard of mechanical perfection.</p>
      <p>This was succeeded by the dark days of Scotch Roman.</p>
      <p>During those days, Phemister Old Style appeared, but that should, I think, be counted as a new face with older characteristics.</p>
      <p>Then the Chiswick Press revived Caslon and printed The Diary of Lady Willoughby.</p>
      <p>Subsequently, the Chiswick Press also produced a type in the Venetian style, Basle Roman. William Morris used  it when working there; two of his books, A Tale of the House of the Wolflings and The Roots of the Mountains, were set in it, but it was used several years before that. It was cut by William Howard.</p>
      <p>Then William Morris founded the Kelmscott Press, and his Golden Type as well as Troy/Chaucer were widely imitated.</p>
      <p>Yet another Venetian was revived - this time named after the type designer, as became the habit for revivals - by the De Vinne Press. Renner - in 1899.</p>
      <p>Later, in 1911, Goudy produced Kennerly, which to my eyes is definitely a Jenson.</p>
      <p>This fuller story makes clear that while Morris and Goudy were indeed very influential, no doubt contributing greatly to the popularity of revivals, there were others interested in reviving old faces who did not wait for the additional impetus these two men provided to the activity. Before Morris, there was Basle Roman; after Morris, but before Goudy, there was Renner, so the existence of revivals other than the Chiswick Caslon revival was not <em>completely</em> dependent on either of them, though doubtless without them it would have taken much longer.</p>
