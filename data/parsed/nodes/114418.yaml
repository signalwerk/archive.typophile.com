      <p>Nick, that's that's interesting about the Children's books. I didn't know Caslon had been used there. </p>
      <p>You ask:  "if Morris was so influential, the old style revival took so long after Kelmscott to produce any new old style faces—Caslon, as revival, having been around since Lady Willoughby."</p>
      <p>I think our disagreement is may be due to meaning different things by 'revival'. A recutting or fairly close reinterpretation of a specific older face to me is a revival. So Kennerley is not a revival, it is a new face, not taken directly from any single model—as his Garamont was intended to be. Why only then was a new design in the old style made? That's because designers as original as Goudy are rare. I do see your point that he was taking old styles a new direction, and he was influential that way. That's fair enough, but I don't think Kennerley or for that matter Goudy Old Style are revivals of any specific typeface.</p>
      <p>Caslon's revivals came after Morris, the way I mean revival. Before that it was just reusing Caslon for limited purposes. After Morris, you have recuttings and reinterpretations, not just re-use. And yes, you have use in mass-circulation magazines such as Vogue and Life, which I don't think was true before, and that has been my main point. Also books count too, including those of Rogers and Updike. Newspapers have been on their own track for a long time, and I'm doubtful that those adopted any old styles until Times New.</p>
      <p>Also I wrote initially in this thread about revivals of old type, not only old style. The Bodoni revival by Benton is part of the movement started by Morris, even though he hate Bodoni. The influence of Morris to me isn't his specific aesthetic, but both the idea of revivals, and the high art of the Kelmscott Chaucer, which raised the bar on people's ambitions for what could be done with books.</p>
