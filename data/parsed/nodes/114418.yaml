      <p>Since Caslon was revived before Morris, while it's clear that Morris' own types were copied, that does indeed complicate the question of how much influence Morris had on the revivals of Baskerville and Garamond, and on the creation of such faces as Plantin or Poliphilus or Bembo.</p>
      <p>Morris' revivals of Jenson were outliers, after all.</p>
      <p>But many of the earliest revivals - Cloister Old Style, Centaur - not only were Jenson revivals too, but they were clearly influenced by Morris' Golden Type. Not in the sense of their content, as with Jenson Oldstyle, but in the sense that he called further attention to the merits of the first Roman type.</p>
      <p>I did notice, though, a mention that the success of ATF's revival of Bodoni was one of the forces leading to Cloister Old Style. So there was an independent impetus to revival as well. Since the "butterfly effect" tells us history would turn out differently if even minor, seemingly irrelevant, things are changed, it's difficult to make the case that there was enough other impetus towards revival that without Morris it would still have happened the way it did.</p>
      <p>So it could well be that if it weren't for William Morris, the Caslon revival and the Phemister old style would not have led to a Baskerville revival and then a Plantin revival... and so there would never have been a Times New Roman. (Despite it having been "bigoted and narrow, mean and Puritan" and thus not the sort of thing of which Morris would have approved, I suppose.)</p>
