      <p><em>…the dark days of Scotch Roman…</em></p>
      <p>What the Dickens?!<br>
      The Scotch was, and is, a brilliant design.</p>
      <p>Speaking of revivals, blackletter (“Blacks”, as Fry, amomg others, termed it) was prominent in the early 19th century, both signifying antiquity and performing the function of bold contrast to roman text, in multi-font layouts. That function was taken over by slab serif, clarendon, sans, and extra-bold scotches. As a decorated display style, it was superceded by novel decorated styles (see Nicolette Gray).</p>
