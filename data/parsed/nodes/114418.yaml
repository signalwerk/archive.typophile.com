      <p>Yes, we are talking about two worlds here, mass culture and metaculture (the trade subculture of those who make mass culture).</p>
      <p>What I am contesting is Bill’s conﬂation of the two.<br>
      This is a hobby horse of mine! (See my article in Codex 3 for an elaboration.)<br>
      Bill said that William Morris’ revival of Jenson made old styles fashionable and widely used, with the subtext that their superior readability was involved (a hobby horse of his!)<br>
      However, I have a collection of mass circulation magazines from the early 1900s, and the text type styles which are fashionable in them, and widely used, are not old styles.<br>
      That is why I disparage his version of history, which follows the academic narrative centered on elite documents (from private presses) and metaculture or trade publications (e.g. type foundry specimens).</p>
      <p><em>“if none of those 30,000 people buying the Velvet Underground album had musical talent, then the Velvet Underground would not have been influential </em></p>
      <p>I bought the Velvets’ ﬁrst album, and although I didn’t start a band, I did go to art school, for which it may have been partly responsible. I should also point out that if one adopts the Velvets as a precursor to punk, then their signiﬁcance is the *lack* of musical talent required to bash it out like Sister Ray!</p>
