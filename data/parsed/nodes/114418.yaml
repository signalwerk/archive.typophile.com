      <p>Bill, there *was* a delay.<br>
      Your argument is cherry-picked from second-hand sources.</p>
      <p>Sure, there was some use of Caslon in literary circles.<br>
      But look at an assortment of mass-circulation magazines from the ﬁrst decade of the 20th century.<br>
      The majority of text faces, in both editorial and advertising, will be Moderns, Old Style, and Cheltenham.</p>
      <p>The idea that William Morris made true old style (antiqua) faces popular does not hold water. </p>
      <p>It was Frederic Goudy’s dissatisfaction with the spotty nature of Caslon (caused by its heavy caps—see his narrative in <em>Goudy’s Type Designs</em>) that led him to produce Kennerley in 1911, which immediately became widely used, and was shortly followed by Goudy Old Style, and ATF’s Garamond and Cloister (Jenson) revivals. </p>
      <p>Although Goudy had produced his Village and Light Old Style (E38) earlier, they were not yet fully realized old styles, and didn’t open the ﬂood gates for the antiqua in the way that Kennerley did.</p>
