      <p>Ah, here we are.</p>
      <p>Kennerley is named after Michael Kennerley, having been designed for a book of short stories by H. G. Wells which he printed.</p>
      <p>In "Monotype: A Journal of Composing-Room Efficiency", in the issue on-line which chronicles the origin of Kennerley, we have;</p>
      <p>"During the fifty years that followed the revived use of Caslon's type by the Wittinghams there is little else to record about the designs of type used for printing books, until about the year 1890, when William Morris set himself to design type, fired thereto by a lecture given by Mr. Emery Walker on the work of the early printers, to which he had listened."</p>
      <p>This from "British Types for Printing Books" by B. H. Newdigate in "The Art of the Book", reprinted therein as "History of Book Types &amp; Fonts of Some Private Presses".</p>
      <p>That book also notes that originally Caslon was considered for the book, but Goudy sought a typeface that would give a darker color to the page without making the letters bolder, and this he achieved through the close fit of the letters in Kennerley.</p>
      <p>And from that I've learned something else, unless we're dealing with a different typeface of the same name. I thought Imprint was a revised Caslon by the British Monotype firm, but that article says:</p>
      <p>"One or two admirable faces of type have, however, been produced by the Lanston Monotype Company for setting by the monotype machine. One of these is the 'Imprint' type, adapted from one of the founts used by Christopher Plantin, the famous printer of Antwerp, in the late sixteenth century."</p>
      <p>Ah: I see I may have been mixed up; the American firm was the Lanston Monotype Machine Company, while the British firm was the Lanston Monotype Corporation, according to "Anatomy of a Typeface". So that could have been either... or Lawson could have gotten it slightly wrong too.</p>
      <p>Also, the first Benton revival, of Bodoni, dated from 1909, which makes it relatively close to Morris.</p>
