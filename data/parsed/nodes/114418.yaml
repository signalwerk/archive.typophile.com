    html: |-
      <p>And Emil Rudolf Weiss was the highly influential designer of Weiss Roman and Weiss Initials.</p>
      <p>@Nick Shinn:<br>
      <cite>Can you deny that Kennerley was the ﬁrst really successful new old style, in 1911?</cite></p>
      <p>We've seen that the Golden imitator Jenson Old Style has been used in mass-market advertising. In fact, I recently ran across another example of that or a similar face like Kelmscott in an advertisement for a typewriter -</p>
      <p><a class="freelinking external" href="http://www.technocrazed.com/wp-content/uploads/2013/07/Historic-evolution-type-writer-49.jpg" rel="nofollow">http://www.technocrazed.com/wp-content/uploads/2013/07/Historic-evolution-type-writer-49.jpg</a></p>
      <p>but Kennerley, although presented as a new face, is much closer to an actual Jenson revival than Morris' Golden Type was.</p>
      <p>Another (not, as I thought, earlier: Jenson Oldstyle goes back to at least 1896) type that achieved some success is one that I only recently learned of, Caslon Old Roman. Like Caslon Antique, formerly XV Century, despite its name, it is not a Caslon.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/elston_hesp_6697.jpg"></div><p></p>
      <p>Instead, although having features that associate it with its own time, thus dating it and preventing it from being popular today, it looks enough like a Jenson to be used in private press books that are aiming for, and that have success in achieving, that Morris look.</p>
      <p>The Monotype catalog says that it was designed in the late 1890s for London's Caslon foundry, and it was in the Barnhart catalog for 1903 before finding its way to ATF until at least 1923. For it to have made its way to (Lanston) Monotype indicates it must have had some success.</p>
