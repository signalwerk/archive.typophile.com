      <p>How are all the revivals of Caslon, including by ATF, not 'real', but those of Garamond and Baskerville were 'real'? I don't understand what you mean by 'real'. </p>
      <p>And as to 'sporadic,' I didn't just refer to Life. I mentioned Vogue, which both Lawson and MacGrew say led to popularity of Caslon in the US. And I mentioned both Bruce Rogers and D.B. Updike, who are said to have designed a lot of books in Caslon. But above all, I just can't believe all four major foundries were idiots spending huge time doing versions of Caslon for no demand. And Linotype spent four years 1919-23 doing specific drawings of every character in every size of Caslon. That is after Goudy's Kennerley, but I never heard that Chauncy Griffith at Linotype had any particular love for Goudy, and I don't even think they published a single Goudy design, though they did do revivals.  </p>
      <p>By the way, who else besides Nick thinks that Kennerley drove the train? My view, that Walker and Morris led the change in taste, that Jenson revivals and Caslon came next, and the rest later climbing on the bandwagon is I think consistent with the view of other historians, and the facts that I know. Did Goudy ever say that his Kennerley influenced Linotype, Monotype, and ATF to do revivals? Is there any opinion from anybody of the time that says this? What's the evidence? </p>
      <p>By the way, ATF, having done several Caslon revivals already, did a Bodoni revival—Benton worked on it—from 1910 to 1911, when Goudy was working on Kennerley. That is not an old style, but it is a revival. The point is that the whole revival movement comes arguably from Walker and Morris, and the invention of the Pantographic Punch Cutter by Benton the father. The idea that it comes from Goudy, who was one of the followers, and specifically from Kennerley, is to me a non-starter. The ball had been rolling for 20 years by then.</p>
