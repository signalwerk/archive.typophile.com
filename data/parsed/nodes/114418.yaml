      <p>The book <em>The Kelmscott Press: A History of William Morris's Typographical Adventure</em> by William S. Peterson is very good, and includes a chapter on the immediate, direct influences of Morris. </p>
      <p>I think the impact of Morris is huge, but more general. For one thing, he made revivals of old type fashionable, resulting in a flood of revivals in the early 20th century. Second, the idea of a 'designer' separate from a printer was apparently created by his example, though I'm sure others know more about this history. Third, and more minor, the revival specifically of the types of Griffo and Jenson was led by him, so all later revivals of these are influenced by his efforts, even when they reject his heavy style. </p>
      <p>Another specific influence was his criticism of 'modern' types (Bodoni) and praise of 'old style', which led to specifically the revival of old style types. </p>
      <p>There may well be stories about the influence of his style of illustration, and of his example of 'art book', but I don't know the stories.</p>
