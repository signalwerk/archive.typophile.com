    html: <p>Don't know this font and don't even think it should be considered as. To me, looks more like some Elongated Gothic, customized "<a class="freelinking external" href="http://www.myfonts.com/search/huxley" rel="nofollow">à-la-Huxley Vertical</a>", just need to spot the right base font (spurless /G, /R...) and move/extend some crossbars. For instance, you could start with <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/bee/" rel="nofollow">Bee</a> which, part of the over-elongated crossbars, is very close to your sample.</p>
