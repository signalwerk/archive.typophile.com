  html: |-
    <p>I just found “Penguin By Design” this week, and fully awoke to the glory of Tschichold and Schmoller. Tschichold’s Penguin Shakespeare cover design—mmph! Schmoller’s rigid, beautiful typographic rules for every situation—ka-chah! I had always loved Schmoller’s hardcover <cite>Pelican Shakespeare</cite> (with its original spine and paper, still one of the most beautiful books I’ve ever seen), but without particularly fastening onto him as a Great Man. And Tschichold I mostly just associated with Sabon.</p>
    <p>My question: Where can I best glut my need for lots and lots of information about both these great Penguin typographers and designers? (Not only Tschichold.) I want to know everything they knew!</p>
    <p>In real life I am an author, and I now want to make sure my next book obeys all of their Rules. Or at least infringes them <cite>knowingly.</cite> The designer of my first book, a person employed by a major, much-loved trade publisher, wanted to letterspace its italic lowercase running heads. Which made me feel that it’s every man for himself out there.</p>
    <p>Thanks!</p>
