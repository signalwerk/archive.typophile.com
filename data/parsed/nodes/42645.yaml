      <p>In my experience (mostly trade illustrated reference), authors have no control over their books. Some very important authors may have influence, but no authority. They may have some limited veto power over certain elements, particularly as related to the proper communication of content. But this usually occurs through their editor, who is the author’s advocate within the publishing process.</p>
