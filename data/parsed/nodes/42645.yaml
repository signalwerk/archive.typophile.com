    html: <p>I got deeper into design as an author who wanted his books to look good, like you. I believe that your control over design will be nothing or minimal, unless you can get it into your contract that you will be consulted. Of course, there may be some agreeable people who are happy to have your input. But as usually I believe this stuff is done pretty quickly on deadline, it is tough. The book designers here should be able to tell you more about the process. Good luck!</p>
