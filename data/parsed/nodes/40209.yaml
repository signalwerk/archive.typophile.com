    html: |-
      <p>“Frames, and their replacements, are a feature of HTML and XHTML, and are used to layout pages.”</p>
      <p>Eh...sort of. Frames are used to group multiple pages into one browser view. For the most part, they are bad, and antiquated. (see florian’s post).</p>
      <p>As for showing another site within yours, well, that is actually the one main reason to use a frame, so yea, go for it. You might want to use an iFrame for that.</p>
      <p>That said, are you SURE you need to trap the other site in a frameset? It’s fine to just link off to that site. And often much preferred by site visitors. Also, external sites can block your ability to load their site in a frameset if they so desire.</p>
