    html: <p>It sounds like your IT guy was just parroting something he heard elsewhere, or he would have given you more useful advice. Frames, and their replacements, are a feature of HTML and XHTML, and are used to layout pages. CSS is a system used to create a visual style for a web page, and may or may not affect layout, depending on how the HTML/XHTML is set up. It sounds like you should probably take a few web design classes to get a handle on this stuff—these are circa 1999 web standards, at this point there’s no reason to be designing a web site without a firm handle on XHTML and CSS.</p>
