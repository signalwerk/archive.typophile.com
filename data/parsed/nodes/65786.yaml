    <p>Hello fellow typophiles, </p>
    <p>I've been working on a typeface that I painted on paper and as I kept on working on it it never occured to me that I will be needing to ever convert it to a digital format. As I was finishing it up I thought it would be a good excersice and practice if I created an real working font out of it. So I embarked on a journey to convert it to the digital format. </p>
    <p>I've never had any prior engagement with Fontlab Studio, so I knew it'll be an uphill struggle, but nothing like this. I'll show you what i mean: </p>
    <p>This is the E in my typeface. </p>
    <p><a href="http://img199.imageshack.us/img199/739/picture34.gif" title="http://img199.imageshack.us/img199/739/picture34.gif">http://img199.imageshack.us/img199/739/picture34.gif</a></p>
    <p>I scanned it, opened it in Illustrator and traced it. Selected the whole shape and then copied it into clipboard to paste it into Fontlab Studio. The problem is, when I do that, this is what I get in Fontlab Studio: </p>
    <p><a href="http://img42.imageshack.us/img42/41/picture35.gif" title="http://img42.imageshack.us/img42/41/picture35.gif">http://img42.imageshack.us/img42/41/picture35.gif</a><br>
    <a href="http://img42.imageshack.us/img42/9104/picture36.gif" title="http://img42.imageshack.us/img42/9104/picture36.gif">http://img42.imageshack.us/img42/9104/picture36.gif</a></p>
    <p>Why does it look like this in Fontlab Studio? Is it due to too many points and marks in typeface that when converted create these lines? Because I thought the shapes once they are in illustrator should copy perfectly to FLS. </p>
    <p>Any help would be appreciated. Thanks a lot and happy new year! </p>
    <p>Namhar</p>
