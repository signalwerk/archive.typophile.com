    html: |-
      <p>Good find Zoya! Definitely the closest digital so far. Seems to me that maker of the old font in the image and Monogram Fonts Co. designer Brian Bonislawsky may have both based their typeface designs on the “Pearl” letterset of 1854 by George J. Becker, cited by Monogram as their source.<br>
      Becker's Pearl:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BeckerPeal1854SM_6437.jpg"></div><br>
      A digital version of Becker's Book is available at archive.org<br>
      <a href="https://archive.org/details/ahn2554.0001.001.umich.edu" title="https://archive.org/details/ahn2554.0001.001.umich.edu">https://archive.org/details/ahn2554.0001.001.umich.edu</a><br>
      A final word. Tuscan designs like this were a dime a dozen circa 1850. Other designers could have independently created something virtually identical using one of the various Tuscan design formulas then in use. But the Monogram digital is probably the closest we will find to a digital version of the image.<br>
      Don<p></p>
