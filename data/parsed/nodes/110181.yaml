      <p>Hi Mike, I agree a little clarification by Lu of "elegant" would be helpful. The Victorians loved to make Tuscan fonts like Lu's example with amazing amounts of ornament and encrustation. Michael Hagemann's digitizations are well engineered and have a clean look not found in most other digital versions, which are usually autoscans with little editing. It is possible to prune some of the ornamentation to make something more streamlined. Kills the authenticity, but might be suitable.<br>
      Don</p>
