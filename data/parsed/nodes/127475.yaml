    html: |-
      <p>It appears to be custom, since I'm finding nothing that matches exactly.</p>
      <p>For the G, FF Zwo, by Fontshop/Jörg Hemker, is the closest match I could find.</p>
      <p>The rest of the letters, PF DIN Text Bold comes close, but is still a bit off for the R, A and P (width, shape of the counters):<br><a href="https://www.myfonts.com/fonts/parachute/pf-din-text-pro/">https://www.myfonts.com/fonts/parachute/pf-din-text-pro/</a></p>
      <p>If you want one typeface that approximates the overall look, try Program:<br><a href="https://www.myfonts.com/fonts/emigre/program/">https://www.myfonts.com/fonts/emigre/program/</a></p>
