    html: <p>The reality in Central Europe is little bit different. There are many CE fonts (mostly Adobe typefaces) localized in the middle of 90s. Such fonts have completely redesigned diacritics - not only for CE characters, but for all accented ones. Many western designers don't care about the look of the diacritics and the original accents look very ugly. Unfortunately in languages such Czech or Slovak almost every word contains at least one accent. Therefore correct shape, size and position is very important. Even now, to successfully use new fonts, the change of diacritics in many commercially available CE font is a must.</p>
