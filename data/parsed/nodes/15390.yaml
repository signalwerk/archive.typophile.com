      <p>LordKV, I can think of no more exciting contemporary superfamily of type, combining sans and serif fonts than Joshua Darden's "Freight". You can see the fonts on his site: <a href="http://www.joshuadarden.com/" title="http://www.joshuadarden.com/">http://www.joshuadarden.com/</a> , and follow his link to garagefonts/Phil's to make your purchase.</p>
      <p>As for accents... I personally like 'em, and like makin' em, even though I have heard people deriding the "glyph arms race". I was put on to this site - <a href="http://www.eki.ee/letter/" title="http://www.eki.ee/letter/">http://www.eki.ee/letter/</a> - and use it to learn which accented letters are necessary for which languages. Referring to this site is a good way of adding accents intelligently. If you're a schwa away from your font working in Azerbaijani, then you can design those glyphs and add them to your font. And when someone asks, "Does your font support Azerbaijani?" You can reply, "Yes! And Tatar as well!"</p>
      <p>But as for the less esoteric accents which are used in Eastern Europe... They are pretty useful to anyone wanting to show respect to people whose names contain those accents. (The next step is to learn how to pronounce those accented letters.)</p>
