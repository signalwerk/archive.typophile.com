      <p>Thanks for the clarification Thomas.  I was including the Spanish, German, Italian, French, etc., characters as "typical Latin characters" because they typically appear in most text fonts. I was trying to avoid the English-centric issue and be more inclusive of other common Latin based characters and languages.<br>
      I should have said: "It makes no difference to the user who  does not require the CE glyphs because the rest of the glyphs space and behave just as they would in a font that does not contain the CE set of glyphs."<br>
      I was just trying to reassure him that buying a font that included CE would not render it useless for the rest of the Latin based languages.</p>
      <p> ChrisL</p>
