      <p>I would say that the more you're interested in <cite>selling</cite>, the less you'd be interested in diacritics, at least beyond the EU countries. There's no money in it. And the only reason there's money in Central/Eastern European diacritics is that the EU requires documents to be created in all the union's official languages. This in fact seems to be the main reason for the contemporary surge in Greek fonts. Fortunately, there is however still craft, decency and graciousness in making extended fonts!</p>
      <p>hhp</p>
