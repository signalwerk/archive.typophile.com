    <p>Hi everyone!</p>
    <p>I need some help. I am no expert in the field of typography and would be greatful if anyone of you big guns can help me out.</p>
    <p> First What makes a CE version of a font different from the regular ones? If I am not mistaken then CE stands for Central European right? Is the kerning different? Cos i cant make out any difference.</p>
    <p> Second can someone tell me how to select a good pair of Sans and serif font? Would be fantastic if you can suggest a few so that I can start working on a project which involves making a brochure (4 page). Text is very important and should be easily readable and hopefully cast a impression. Money is of no problem. So doesnt matter even if it is one the costliest fonts.</p>
    <p> And lastly your personal favorites!</p>
    <p> Thanks</p>
    <p> LordKV</p>
