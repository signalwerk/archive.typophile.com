      <p>Chris L wrote: "It makes no difference to the user of non-CE text because those glyphs are not used. The typical Latin characters are the same."</p>
      <p>Single-byte CE fonts omit support for western European languages such as French, Spanish, German, etcetera. The correct statement would be "It makes no difference to us monolingual English-writing folks, because the non-accented Latin characters are the same."</p>
      <p>Cheers,</p>
      <p>T</p>
