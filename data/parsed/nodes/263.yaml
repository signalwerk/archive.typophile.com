  html: <p><a href="http://www.fontexplorer.com/FontStore/">Linotype Library</a> releases Bo Berndal's <a href="http://www.myfonts.com/fonts/linotype/dala-lt/text/">Dala</a>, Richard Yeend's <a href="http://www.myfonts.com/fonts/linotype/richmond-fraktur-lt/dfr/">Richmond Fraktur</a> &amp; <a href="http://www.myfonts.com/fonts/linotype/richmond-zierschrift-lt/dfr/">Zierschrift</a>, and Roland Goulsbra's <a href="http://www.myfonts.com/fonts/linotype/textur-gotisch-lt/dfr/">Textur Gotisch</a> &amp; <a href="http://www.myfonts.com/fonts/linotype/textur-lombardisch-lt/dfr/">Lombardisch</a>. <br> <br>Dala includes two extra fonts of <a href="http://www.myfonts.com/fonts/linotype/dala-lt/borders/charmap.html">borders</a> and <a href="http://www.myfonts.com/fonts/linotype/dala-lt/pict/charmap.html">vignettes</a>. The other fonts contain expert and alternate characters... Textur Gotisch even includes a half-r. <br> <br>Yeend also designed the slanting <a href="http://www.myfonts.com/fonts/linotype/buckingham-fraktur-lt/dfr/">Buckingham Fraktur</a> with some nice <a href="http://www.myfonts.com/fonts/linotype/buckingham-fraktur-lt/alternate/charmap.html">alternates</a>.</p>
  html_clean: <p><a href="http://www.fontexplorer.com/FontStore/" class="link-external">Linotype Library</a> releases Bo Berndal's <a href="http://www.myfonts.com/fonts/linotype/dala-lt/text/" class="link-external">Dala</a>, Richard Yeend's <a href="http://www.myfonts.com/fonts/linotype/richmond-fraktur-lt/dfr/" class="link-external">Richmond Fraktur</a> &amp; <a href="http://www.myfonts.com/fonts/linotype/richmond-zierschrift-lt/dfr/" class="link-external">Zierschrift</a>, and Roland Goulsbra's <a href="http://www.myfonts.com/fonts/linotype/textur-gotisch-lt/dfr/" class="link-external">Textur Gotisch</a> &amp; <a href="http://www.myfonts.com/fonts/linotype/textur-lombardisch-lt/dfr/" class="link-external">Lombardisch</a>. <br> <br>Dala includes two extra fonts of <a href="http://www.myfonts.com/fonts/linotype/dala-lt/borders/charmap.html" class="link-external">borders</a> and <a href="http://www.myfonts.com/fonts/linotype/dala-lt/pict/charmap.html" class="link-external">vignettes</a>. The other fonts contain expert and alternate characters... Textur Gotisch even includes a half-r. <br> <br>Yeend also designed the slanting <a href="http://www.myfonts.com/fonts/linotype/buckingham-fraktur-lt/dfr/" class="link-external">Buckingham Fraktur</a> with some nice <a href="http://www.myfonts.com/fonts/linotype/buckingham-fraktur-lt/alternate/charmap.html" class="link-external">alternates</a>.</p>
