    votes: null
    html: "<p>I agree with Paul about the serifs - it gives the design more character. Also the original has more contrast between the thick and thin strokes (ie: the underline and the top of the s). The newer versions lose that contrast and feel monotone. The connection between the G and o on the middle sketch causes me to read Too Many Grods. <br> <br>Personally, I'm not getting an \"edgy\" feel from this. Don't interprut that to mean I don't like it, because I do. It's just it makes me think more of the chrome lettering off a 50's Ford Fairlane or someting rather than a rock-n-roll band. And it may just be a matter of semantics, but when I hear the word \"edgy\" in relation to music I think more of punk or grunge. From your loose description I sense they cover more of Led Zep and the like. Is that correct? Obviously since one of the band members drew the initial sketch it is something they like and you should continue on that path. However, just as an additional option, you may want to look at the logos of the bands they cover the most it may give you additional inspiration as to how to better relate the music they perform with their logo.</p>"
