  html: |-
    <p>Hey all,</p>
    <p>I'm trying to knock out a set of slides for my friends' upcoming nuptials.<br>
    I am trying to portray unity through connecting swashes &amp; ornamentation without<br>
    losing the legibility of the words. The wedding colors are cream and lightish pink and the flowers are lilies and roses. The wedding is pretty upscale and the bride is a girly girl.</p>
    <p>I am stumped just now; what do you guys and girls think of what I have so far?</p>
    <p>Thanks,<br>
    Rachel</p>
    <p>ps I am open to crit/comments on anything/everything (type, concept, ligatures, legibility on a projection screen (worried about this) (not quite sure how large/far away the screens will be), contrast, whatever!</p>
