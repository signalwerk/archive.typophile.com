    html: |-
      <p>@Theunis – Turbo Pascal's STRING type has a maximum length of 255 characters with the length stored in the first byte of the string. I think that's pretty much standard for those microcomputer Pascals that have a STRING type.</p>
      <p>Other Pascals, like FreePascal and GnuPascal, may offer longer and wider strings, but these may well have length and data stored as separate records or even be C strings!</p>
      <p>Oh, and there are some Pascal manuals available from Bitsavers. I've seen Borland manuals there.</p>
