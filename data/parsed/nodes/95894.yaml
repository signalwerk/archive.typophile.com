      <blockquote><p>You do need to keep in mind that there is a limit to how long a glyph name can be (31 characters).</p></blockquote>
      <p>After processing, when OpenType features have been compiled, they only contain references to glyph <em>indexes</em>. Glyph <em>names</em> can be preserved in the 'post' table, but the OT specs do not refer to a maximum name length (other than "a Pascal string", and I'd have to check if this is an 8-bit, 16-bit or even 32-bit number).</p>
      <p> Is this constraint a remnant of Ye Olde PostScript Type 1 specs? Constrained for backwards compatibility somewhere inside ADFKO?</p>
