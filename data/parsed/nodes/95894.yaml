      <p>I did face the same question months ago while developing a <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">very large font</a> with dozens of alternative glyphs. After some tries, I built a schema combining suffixes when needed:</p>
      <p>Case groups: <strong>.uc, .sc</strong> and <strong>.pc</strong><br>
      Design alternative: <strong>.da</strong><br>
      Linguistic alternative: <strong>.la</strong></p>
      <p>When using two suffixes, the last one is always the case as it represents the larger group. In other words, the name goes from the more specific to the more general (glyph &gt; variation &gt; case).</p>
      <p>Thus a regular small caps a is <em>a.sc</em> while an alternative design for the same letter is <em>a.da.sc</em>. A special character with locale variation would be <em>uniXXXX.la</em> and the petite caps variant for this is named <em>uniXXXX.la.pc</em>.</p>
      <p>To save room for long names I use just two letters in each suffix, no matter if the related OT feature uses four characters.</p>
      <p>For number groups I use a letter for case [<strong>u, s, p, o</strong>] and a letter for the spacing criteria [<strong>p</strong>roportional/<strong>t</strong>abular]. This results in <em>.op/.ot</em> for oldstyle proportional/tabular, <em>.pp/.pt</em> for petite caps figures and <em>.sp/.st</em> for small caps figures. An alternative design (as an open 4 instead of a closed one) receive the .da suffix, resulting in .da.op, .da.st and so on.</p>
      <p>Although a bit complex at first look, this became very handy to manage a large project with multiple groups of glyphs.</p>
    html_clean: |-
