    <p>I conducting an abbreviation research to see what is best for my production rate regarding glyph names.</p>
    <p>Example:<br>
    Alternative [alt]<br>
    Small Caps [smcp]<br>
    Alternative Small Caps [????]<br>
    Petite Caps [pcap]<br>
    Alternative Petite Caps  [????]<br>
    Standard Numeral Caps? (cant’t find a better word for it) [????]<br>
    Alternative Standard Numeral Caps [????]</p>
    <p>What I need is basically a system that makes it easy to add new forms (swash, small caps, old style numerals etc.) with consistent four-letter suffix? So that I can keep true to it.</p>
    <p>(I hate to write for example “one.onum_tnum” or “oneonum.tnum” . . .)</p>
    <p>If a smart standard exist (that is shared by some developers) -- it would be perfect!</p>
    <p>BW,<br>
    Kristian</p>
