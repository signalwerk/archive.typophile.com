      <p>Ah, wait a minute. Culling the name interferes with "name based" semantic lookup:</p>
      <blockquote><p>Even when the original font file is present, glyphs which do not match characters in the Unicode specification may still be usefully connected to a Unicode character by the glyph name. For example, naming a decorative variant of "t" as "t.alt" allows a PDF producing program to note that "t.alt" carries the same semantics as "t", for searching.</p></blockquote>
      <p>A reasonable scenario.</p>
      <p>Adobe's sample glyph name "Lcommaaccent_uni20AC0308_u1040C.alternate" is too long, though.</p>
