    html: |-
      <p>Yes, the limit is mentioned in <em>Adobe's</em> guides. In the same vein, in FontForge:</p>
      <blockquote><p>If you intend to use feature files, then lookup names should be: less than 31 characters [...]</p></blockquote>
      <p>(Aside: <em>less</em> than 31 ... :?)</p>
      <p>Thus my thinking it's an ADFKO limit and for Type 1 fonts only, not an OpenType one.</p>
      <p>The backwards-compatibility bit makes sense, at least. Inside a Type 1 font, individual glyphs are still indexed by name -- how quaint!</p>
      <p>Underlying reason: I'm creating my own Type 1-flavored fonts, including necessary OTF code. The latter does *not* force short names, but the former does. Since any user supplied glyph names *inside* the font are "for internal usage only", I probably could cull long names and replace them with a simple numeric counter inside the CFF.<br>
      (I used to think Adobe InDesign was able to show "custom glyph names" but somehow that stopped working, or perhaps it never did.)</p>
