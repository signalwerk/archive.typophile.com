    <p>Hi,</p>
    <p>I am hoping to put the proper fonts from soccer teams into my favourite video game.</p>
    <p>I've collected the numbers in the attached pic, it should have 0-9 can anyone tell me what font it is, or even a close font. </p>
    <p>On the blue and white pic, there are 2 fonts here, the WHITE-ON-BLUE is font one (sort of Italic, offset); the BLACK-ON-WHITE is font two (big rounded numbers). </p>
    <p>On the red and white pic there is just one font, it seems strange because the characters are sort of cut (e.g. top of “1”).</p>
    <p>Any help would be great. </p>
    <p>Thanks, </p>
