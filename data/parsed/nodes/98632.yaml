    html: |-
      <p>"some obvious ones", "a lot of crap"</p>
      <p>What's obvious to me wouldn't be what's obvious to you! It all depends on the use to which the font will be put, the nature of the "packaging" and its contents, and of course personal tastes.</p>
      <p>You also didn't say whether this was to be used as a large attention-getting logo/display or for small text details such as the ingredients list on a food product.</p>
      <p>Do you need fonts that include accented characters, or support for any languages other than English? Do you need variants such as bold, italic, small caps, outlines, etc. ?  </p>
      <p>I won't dare go into a discussion of "crap"! As they say, one person's crap is another's pot of gold.</p>
      <p> - Herb</p>
