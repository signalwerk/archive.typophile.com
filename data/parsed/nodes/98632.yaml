    html: |-
      <p>Look for fonts that looks hand-lettered<br>
      Here are a few to get you started:</p>
      <p>A handlettered Typewritter/Stymie mix:<br>
      <a href="http://www.impallari.com/projects/overview/life-savers-handlettered-stymie" title="http://www.impallari.com/projects/overview/life-savers-handlettered-stymie">http://www.impallari.com/projects/overview/life-savers-handlettered-stymie</a></p>
      <p>A handlettered relaxed futura:<br>
      <a href="http://www.impallari.com/projects/overview/ranchers" title="http://www.impallari.com/projects/overview/ranchers">http://www.impallari.com/projects/overview/ranchers</a></p>
      <p>A monoline script by Rand Holub:<br>
      <a href="http://www.google.com/webfonts/specimen/Sacramento" title="http://www.google.com/webfonts/specimen/Sacramento">http://www.google.com/webfonts/specimen/Sacramento</a></p>
      <p>A casual sans brush style, also by Holub:<br>
      <a href="http://www.google.com/webfonts/specimen/Oregano" title="http://www.google.com/webfonts/specimen/Oregano">http://www.google.com/webfonts/specimen/Oregano</a></p>
      <p>Hipster Script, also by Holub:<br>
      <a href="http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/" title="http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/">http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/</a></p>
      <p>Another script, based on Chesterfield advertising:<br>
      <a href="http://www.google.com/webfonts/specimen/Satisfy" title="http://www.google.com/webfonts/specimen/Satisfy">http://www.google.com/webfonts/specimen/Satisfy</a></p>
      <p>Anything from Filmotype:<br>
      <a href="http://www.myfonts.com/foundry/Filmotype/" title="http://www.myfonts.com/foundry/Filmotype/">http://www.myfonts.com/foundry/Filmotype/</a></p>
      <p>A lot more from Nick Curtis:<br>
      <a href="http://www.myfonts.com/foundry/Nicks_Fonts/" title="http://www.myfonts.com/foundry/Nicks_Fonts/">http://www.myfonts.com/foundry/Nicks_Fonts/</a></p>
      <p>and Font Dinner:<br>
      <a href="http://www.myfonts.com/foundry/Font_Diner/" title="http://www.myfonts.com/foundry/Font_Diner/">http://www.myfonts.com/foundry/Font_Diner/</a></p>
      <p>You can also explore my favorites at flickr, there are lots and lots of ads from the 1950's<br>
      <a href="http://www.flickr.com/photos/pabloimpallari/favorites/" title="http://www.flickr.com/photos/pabloimpallari/favorites/">http://www.flickr.com/photos/pabloimpallari/favorites/</a></p>
