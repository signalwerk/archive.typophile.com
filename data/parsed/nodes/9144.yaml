    <p>From the Chicago Sun Times ... <br> <br>London's Metropolitan Police will change the typeface of its motto, "Working for a Safer London," from italicized script to plain block letters on all its signs, cars and stationery because the current typeface is "not compliant with the Disability Discrimination Act of 1995" in that it might prove "difficult to read for visually impaired people." <br> <br><a href="http://www.suntimes.com/output/quicktakes/cst-nws-qt07.html" target="_blank">http://www.suntimes.com/output/quicktakes/cst-nws-qt07.html</a> <br> <br>Does anyone have further info on this story? <br> <br>Si</p>
