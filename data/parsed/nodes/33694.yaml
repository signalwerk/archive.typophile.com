  html: |-
    <p>Please Pass the word around so that no one gets burned by Letterhead. I talked to them today and they will not budge on this. They know you can't embed the font in a PDF for a proof to customers and that you can't package the fonts with an Indesign document. I was told that the solution is for us as users of their fonts to convert them to curves/outlines before saving the files. The lady I talked to told me that this is going to be the policy from now on because of piracy and that they don't care if it makes customers mad or if they loose my business. She told me there are other font venders out there and I was welcome to go elsewhere if I did not agree with their policy.<br>
    I am saddened by this. We all know that this will do nothing to prevent piracy. We have many examples that this sort of anti-piracy effort does not work. It does however, curtail the rights of honest consumers, just trying to purchase and use their fonts.</p>
    <p>Please help me make this known</p>
    <p>"…Personally, I think they will regret this. I hope they do.<br>
    Let's make noise and boycott them so that maybe they will change.<br>
    We need to pass this along to others and get the word out.<br>
    Here is what they’ve done:<br>
    1. You no longer receive an actual font file, at least not that you can see.<br>
    2. Instead what you download is an installer that installs an application called “Letterhead Fonts” (at least on Macintosh which is what I use).<br>
    3. The fonts are either embedded in this “Letterhead Fonts” application or somewhere else unknown/hidden from the user. No fonts are installed in the traditional Font folder locations.<br>
    4. Once installed, the “Letterhead Fonts” application activates the fonts permanently, at least as far as I can tell, like a font manager. You see them only in the font menus of your other applications, nowhere else. It also doesn’t currently allow fonts to be seen or managed in font manager applications like Suitcase, Font Agent, etc., though LHF apparently plans to add this capability.<br>
    Aside from the obvious antipiracy objective, here are the biggest ramifications and problems I see for the user (myself, for one):<br>
    - You are completely prohibited from organizing the fonts like you want on your hard drive, such as for classification or other purposes. All your flexibility is taken away including any system or method that you might have had in place to manage fonts for your own needs.<br>
    - As mentioned, the LHF fonts can’t be activated individually. It’s an all or nothing proposition. (Unless/until they enable font managers to “see” the fonts perhaps, but maybe not even then, I haven’t seen them say.)<br>
    - It means you can’t add kerning pairs to a font, for example, or otherwise tweak the font yourself if problems are found or you have special needs.<br>
    - And of course, you can’t really back up the fonts themselves. Your only recourse if something were to happen is a reinstall from the various installers you may have accumulated over time, or else go back to their site for the installers there. (They do make provision for downloading previous font orders you have made with their new shopping cart system.)<br>
    A real shame since this will probably make a lot of people think twice about buying additional fonts once they see how it works the first time. I know it has me, despite LHF’s unique fonts. Lots of other good independent foundries around these days as alternatives. What do the rest of you think about where LHF has gone with this?"</p>
