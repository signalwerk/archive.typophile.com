    <p>as previously announced here is yet another lp-cover font!<br>
    wtfont had no match - perhaps YOU can do the magic… again.</p>
    <p>if the exact font is not out there, i'll manage without - as i have just found a sharper version of 'salome' but working with a font is always handier than blunt PS ;)</p>
    <p>pls check on the caballe zarzuela cover below as well; i've added better close-ups of 3 missing fonts (alas: editing does not put a request back in the top shelf!)</p>
    <p>THANKS</p>
