      <p>thanks for your input!</p>
      <p>very greatful that kthomps5 was quick with a fitting revival font. but after checking it out i reverted to the idea of using PS instead (and it turned out nicely) - as donshottype wrote: existing digital versions unfortunately are not very refined. i take it that (2 years on) cristoforo hasn't been released?</p>
      <p>i hope everybody is fine in this case with awarding the point to donshottype because he has pointed out the neat original font AND there is no good digital one out there at the moment.</p>
