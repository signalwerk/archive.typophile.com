      <p>This Columbus. The original was created by Hermann Ihlenburg in 1892 and sold by MacKellar, Smiths &amp; Jordan /​ American Type Founders as Columbus.  Thomas Phinney has launched a project for a quality revival under the name Cristoforo <a href="http://www.thomasphinney.com/tag/hermann-ihlenburg/" title="http://www.thomasphinney.com/tag/hermann-ihlenburg/">http://www.thomasphinney.com/tag/hermann-ihlenburg/</a><br>
      Don</p>
