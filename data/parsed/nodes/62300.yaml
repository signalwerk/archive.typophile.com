    html: <p>I think you're right. How could anyone design a logo without knowing what it's going to be used for? Won't they all look really generic? I don't imagine many professional designers or serious clients would be interested in this kind of setup. iStock can't possibly expect to get quality for $5. It'll be interesting to see what happens.</p>
