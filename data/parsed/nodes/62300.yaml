  html: |-
    <p>I just received an email from iStock Photo that they are going to be offering logos. They are looking for designers to submit logos that will be sold for one time use. They are offering $5 per and an additional $5 if they meet their goal of 10,000 approved designs.</p>
    <p>I initially saw this and thought about submitting a few however, upon thinking about it I think this is a pretty terrible concept. I know that there are plenty of sites out there like "$50 Dollar Logo" but iStock is a pretty popular site and I hate to see things go this way. It just undervalues the work of graphic designers and makes it harder to sell our services. I also question how well font licensing will be upheld.</p>
    <p>I personally hope that the design community does not support this venture and iStock doesn't receive enough submissions to move forward with this (although I'm sure they will).</p>
