      <p>I apologize for not replying earlier, but I started a new set of capitals which took much more work than I had expected. </p>
      <p>Matthieu, I assume that "obvious" meant you didn't like what I had done. Below are the new capitals that I have that I like. They still need a lot of refinement, but I think they are heading in a direction that I really like, and feel that they work well with the lowercase. I thought I would leave the original capitals as the default and place the new one under ss01, or maybe the other way.</p>
      <p><img src="/sites/default/files/old-images/ms-alt-caps_5626.png"></p>
      <p>Here they are in use.</p>
      <p><img src="/sites/default/files/old-images/ms-alt-caps-sample_4219.png"></p>
      <p>Nick, what is it about the "a" that you don't like? I can understand the "d", I knew it was an odd shape but I like it for some reason. Here is a redesign of the "a" and "d", they are much more traditional. For now I have moved the older letters into alternative characters.</p>
      <p><img src="/sites/default/files/old-images/ms-alt-a-and-d_3891.png"></p>
      <p>Finally here is a <a href="http://typefetish.com/downloads/ModerneSchriften-catalog.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">.pdf</a> to look at everything I have so far. The .pdf shows alternative characters and ligatures that are in the works. I still need to flush them out a bit and expand them to complete the character set.</p>
