    html: |-
      <p>Hi Michael,</p>
      <p>the gapped versions of {u} and {n} are certainly more legible. I don't think a gap is absolutely necessary, but the problem with your original version was that the contact on the "open" side of the glyphs looked heavier than on the closed side, misleading the eye. Even in your gapped versions, the bottom left foot of the {n} looks heavier than the top right shoulder. Imagine drawing that glyph with a broad-nib pen — you'd have trouble recreating that join on the top right. Now look at the {n} in your source image... that join actually makes sense in "pen logic"; you'd simply draw it as a short down-right diagonal stroke continuing straight downwards.</p>
      <p>Now, clearly, the original lettering isn't made to look like penwork. It looks more like the glyphic kind of letters intended for cutting into wood or stone — but it still respects pen logic as far as possible in order for the shapes to make "sense" as blackletters. I also broke pen logic here and there in my geometric blackletter, <a href="http://www.myfonts.com/fonts/catharsis-fonts/gryffensee/">Gryffensee</a>, especially when it comes to those circular arcs.  </p>
      <p>That's also why I found these thumbtack ornaments and concave circular serif bracings a bit jarring. They fit neither the pen nor the carver logic — if anything, they look wrought from metal. If the whole font was like that, no problem... but you mix it with those carved glyphs and the occasional pen stroke, and that's what feels off to me.</p>
      <p>EDIT: Oh, and I like that third {D} best. It's just that the glyphic stroke on the top grates with the metallic ornamentation on the sides...</p>
