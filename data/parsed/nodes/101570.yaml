    html: |-
      <p>Sorry to be the party pooper here...</p>
      <p>I find the original quite charming, but your digital recreation feels somewhat off to me. Blackletter is all about consistency, but your letters point here and there — just look at your {e} and {a} next to each other in "Breaking". Your {u} and {n} look like they're joined at the wrong end. The swashes in the capital letters are completely out of character — the font is made to look like glyphs carved into wood. The little geometric details like the "thumbtack" on the left side of the capitals feel at odds with the rough chunkiness of the font at large scales. The top of the {d} looks weird. The {D} of your first version of the capitals was illegible.</p>
      <p>In general, the thickness and angles of the "strokes" that make up the glyphs look haphazard and often unnaturally spiky, whereas the original respects the "pen logic" of blackletter glyph architecture even though the glyphs are build from wedges and rhomboids rather than pen strokes.</p>
