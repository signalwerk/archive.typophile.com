    html: |-
      <p>Thanks for your honesty Catharsis. </p>
      <p>I do agree with a lot of what you said. I had given myself a deadline to finish the typeface which let to some bad decisions and poor execution. The deadline has been cancelled. The swashes have been scraped, as I agree they really didn't fit with the rest of the letters. I can see where the "n" and "u" look like they are joined incorrectly, but I have to force myself to see it - that could be because I drew them and know what they are. I added a gap to help clarify the letter forms.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ms-nualt_5666.png"></div><p></p>
      <p>Here are a few alternative "D"s I had laying around. The first one is the original, the middle two are based on the uncial form and the fourth is more of a standard roman.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ms-Dalt_5864.png"></div><p></p>
      <p>I drew most of the lowercase on a 11x9 grid and I wanted all the points to end at intersections which caused the letters to lose some consistency in stroke width, but I thought that added some charm and character to a very gridded design.</p>
      <p>I'll post again when I have more done.</p>
      <p>Thanks</p>
