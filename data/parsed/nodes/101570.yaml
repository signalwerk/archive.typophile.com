    html: |-
      <p>OK, I went through and corrected the "pen logic" in the lowercase. I added a new "a" and "d" design and reworking the "f" to be closer to the source "f". Using the "pen logic" changed the design of the "k", which is great because I didn't like the old version. I then lightened the connections of the "m" "n" and "u" at the open end and made the closed end heavier.<br><img src="/sites/default/files/old-images/ms-modern_4474.jpg"></p>
      <p>Here is the new design in a text sample<br><img src="/sites/default/files/old-images/ms-modern-sample_5866.jpg"></p>
      <p>While looking at the source image again I realized that I had removed some of the elements that originally attracted me to the letters. Some were removed to prevent it from looking like a rip off and some where removed as I went to a cleaner design. The ascenders and descenders have been redesigned to widen as they ascend or descend. I made the "f" and "c" closer to the originals and brought the bottom of the "e" and "r" back.<br><img src="/sites/default/files/old-images/ms-old-style_6662.jpg"></p>
      <p>Here is the new design in a text sample<br><img src="/sites/default/files/old-images/ms-old-style-sample_3750.jpg"></p>
      <p>I really like both versions and plan on making one of them alternatives.</p>
      <p>It is currently called Moderne Schriften, which I don't like. If any one has any name ideas I would love to hear them.</p>
