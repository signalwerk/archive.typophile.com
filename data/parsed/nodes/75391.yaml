      <p>&gt;Is there any reason why I should NOT do this?</p>
      <p>Assuming you mean you are removing the hints, but leaving the stems themselves, yes, this is a good idea and the general rule of hinting for anti-aliased output is to not hint anything you can't align to the pixel grid.</p>
