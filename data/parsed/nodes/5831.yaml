    html: <p>Well, “<span class="caps">NET</span> <span class="caps">WT</span>. 1.76 <span class="caps">OZ</span>” is <a href="http://www.myfonts.com/fonts/linotype/goudy/old-style/testdrive.html?s=NET%2BWT.%2B1.76%2BOZ&amp;p=48">Goudy Oldstyle</a>, but beyond that, I think most of the package is hand-lettered — “<span class="caps">ALTOIDS</span>” is almost certainly custom lettering. <br><br>“<span class="caps">CURIOUSLY</span> <span class="caps">STRONG</span> <span class="caps">PEPPERMINTS</span>” is deﬁnitely hand-lettered (three diﬀerent P’s, two diﬀerent S’s, probably more inconsistencies than that), but Letterhead’s <a href="http://www.letterheadfonts.com/downloads/index.shtml"><span class="caps">LHF</span> Full Block</a> is a similar style, and it’s free! <br><br>“The Original Celebrated” is also probably hand-lettered — the face that this reminds me the most of is <a href="http://www.myfonts.com/fonts/linotype/windsor/">Windsor</a>… if you tweaked one of the weights of Windsor and added some strokes, you could probably get very close. <br><br>“<span class="caps">MADE</span> <span class="caps">IN</span> <span class="caps">BRITAIN</span>”, of course, is Helvetica Medium, maybe Bold.&nbsp;=)</p>
    html_clean: <p>Well, “<span class="caps">NET</span> <span class="caps">WT</span>. 1.76 <span class="caps">OZ</span>” is <a href="http://www.myfonts.com/fonts/linotype/goudy/old-style/testdrive.html?s=NET%2BWT.%2B1.76%2BOZ&amp;p=48" class="link-external">Goudy Oldstyle</a>, but beyond that, I think most of the package is hand-lettered — “<span class="caps">ALTOIDS</span>” is almost certainly custom lettering. <br><br>“<span class="caps">CURIOUSLY</span> <span class="caps">STRONG</span> <span class="caps">PEPPERMINTS</span>” is deﬁnitely hand-lettered (three diﬀerent P’s, two diﬀerent S’s, probably more inconsistencies than that), but Letterhead’s <a href="http://www.letterheadfonts.com/downloads/index.shtml" class="link-external"><span class="caps">LHF</span> Full Block</a> is a similar style, and it’s free! <br><br>“The Original Celebrated” is also probably hand-lettered — the face that this reminds me the most of is <a href="http://www.myfonts.com/fonts/linotype/windsor/" class="link-external">Windsor</a>… if you tweaked one of the weights of Windsor and added some strokes, you could probably get very close. <br><br>“<span class="caps">MADE</span> <span class="caps">IN</span> <span class="caps">BRITAIN</span>”, of course, is Helvetica Medium, maybe Bold.&nbsp;=)</p>
