    date_raw: 29 Jul 2004 — 8:35pm
    votes: null
    html: <p>Well, "NET WT. 1.76 OZ" is <a href="http://www.myfonts.com/fonts/linotype/goudy/old-style/testdrive.html?s=NET%2BWT.%2B1.76%2BOZ&amp;p=48">Goudy Oldstyle</a>, but beyond that, I think most of the package is hand-lettered -- "ALTOIDS" is almost certainly custom lettering. <br> <br>"CURIOUSLY STRONG PEPPERMINTS" is definitely hand-lettered (three different P's, two different S's, probably more inconsistencies than that), but Letterhead's <a href="http://www.letterheadfonts.com/downloads/index.shtml">LHF Full Block</a> is a similar style, and it's free! <br> <br>"The Original Celebrated" is also probably hand-lettered -- the face that this reminds me the most of is <a href="http://www.myfonts.com/fonts/linotype/windsor/">Windsor</a>... if you tweaked one of the weights of Windsor and added some strokes, you could probably get very close. <br> <br>"MADE IN BRITAIN", of course, is Helvetica Medium, maybe Bold. =)</p>
    html_clean: <p>Well, "NET WT. 1.76 OZ" is <a href="http://www.myfonts.com/fonts/linotype/goudy/old-style/testdrive.html?s=NET%2BWT.%2B1.76%2BOZ&amp;p=48">Goudy Oldstyle</a>, but beyond that, I think most of the package is hand-lettered -- "ALTOIDS" is almost certainly custom lettering. <br> <br>"CURIOUSLY STRONG PEPPERMINTS" is definitely hand-lettered (three different P's, two different S's, probably more inconsistencies than that), but Letterhead's <a href="http://www.letterheadfonts.com/downloads/index.shtml">LHF Full Block</a> is a similar style, and it's free! <br> <br>"The Original Celebrated" is also probably hand-lettered -- the face that this reminds me the most of is <a href="http://www.myfonts.com/fonts/linotype/windsor/">Windsor</a>... if you tweaked one of the weights of Windsor and added some strokes, you could probably get very close. <br> <br>"MADE IN BRITAIN", of course, is Helvetica Medium, maybe Bold. =)</p>
