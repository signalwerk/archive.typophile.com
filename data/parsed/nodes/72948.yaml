    html: |-
      <p>It would be nice if there were a standard, but I don't think that is the case. Sometimes 'T' would indicate Tabular numerals that line up. Sometimes it could be the weight, like Text, Bold, Ultra. It can often be the foundry designation, like ScriptMT, which originates with Monotype (MT), or 'BT', which is usually Bitstream. 'LT' is usually Linotype.</p>
      <p>I think the purpose is to identify font files with a unique name, especially for families, so that the software picks the right file in PS1 fonts that use two files to create the entire font data. That's my understanding, at least.</p>
      <p>- Mike Yanega</p>
