    <p>Hi everyone,</p>
    <p>could any one of you help me out to really and once and for all understand the file nomenclature use for fonts?</p>
    <p>For example this one</p>
    <p>CorinthianT</p>
    <p>Is the T stands for "Text" or it stands for one of the many publisher or type foundry?</p>
    <p>Please advise</p>
    <p>Thank you very much</p>
