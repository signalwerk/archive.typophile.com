    html: |-
      <p>There are some <a href="http://www.fontshop.com/fonts/downloads/mark_simonson_studio/proxima_nova_complete/?&amp;sample_text=TOM%20FORD%20ENGLISHFRAN%C3%87AISITALIANO&amp;sample_size=24" rel="nofollow">minute differences</a>: amongst others the the downwards point of the "M" is sharper, the cross-bar on the "A" is higher, the cedilla is different, but it's almost identical.</p>
      <p>If you need that atmosphere, that style, that look, get Proxima Nova. If you need an exact match, you'll have to look further.</p>
