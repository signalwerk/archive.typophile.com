      <p>The structure of the text influencing the structure of the building is not likely to yield much in the way of suitable examples. Perhaps we type-centric folks might be fond of such an idea but I doubt if you will find many architects with the same leanings. War memorials are the only structures that come to me as well or similar things like the Holocaust Museum here in Washington. There are numerous memorials which have lists of names or famous words inscribed (Lincoln Memorial, etc.). You will probably find several in the UK. I recall Dan Reynolds photographing some WWII sites over there. You might find some more ancient ones from the Roman Empire as well. Look up Armando Petrucci’s book “Public Lettering” for some historic sites.</p>
      <p>ChrisL</p>
