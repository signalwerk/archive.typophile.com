    <p>I posted a thread a little while ago asking for examples I could use for my dissertation on the use of <a href="http://typophile.com/node/37424">typography in architecture</a>. Everything that was said in that thread was really useful and interesting, but my tutor’s now suggested that I shift my focus a little so I’m back to appeal for more ideas!</p>
    <p>Basically my tutor feels that simple lettering on buildings has been done before, so he’s now suggested looking at lettering in the environment where the structure of the text influences the structure of the building/installation. I think this is a good idea in principle but I’m just not sure how many good examples of this I could actually find. The best so far is probably <a href="www.tern.org.uk/art-flockofwords">Flock of words</a>. Other examples I’ve been looking at include the Vietnam Veterans Memorial, the Little Sparta garden by Ian Hamilton Finlay and the work of Joan Brossa.</p>
    <p>I don’t really think many of these derive their structure from the structure of the text, more that the user’s experience of the lettering is important to the way it’s understood i.e. rather than taking it all in in one go you walk through it and experience it in a particular way that’s relevant to the text. This in itself is probably an idea that could be developed further and I might well end up going with this instead.</p>
    <p>To be honest I’m feeling a bit out of my depth, it’s getting a bit ’arty’ and conceptual and I’d really appreciate any ideas or examples that might be able to help me out! Anything near London would be a plus in terms of visiting the site itself.</p>
    <p>Thanks.</p>
