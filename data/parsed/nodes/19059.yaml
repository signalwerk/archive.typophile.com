      <p>We’re looking at a gothic that’s possibly not available digitally, but here are some options:</p>
      <p></p><div class="imageWrap"><img src="/files/BureauGrotesqueThreeFive.png"></div><br>
      <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FB.613.0.4&amp;attributes.sampleSize=48&amp;sampleText=REVOLVER&amp;sampleSize=48">Bureau Grotesque Three Five</a><p></p>
      <p></p><div class="imageWrap"><img src="/files/BureauGrotesqueThreeSeven.png"></div><br>
      <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FB.6603.0.4&amp;attributes.sampleSize=48&amp;sampleText=REVOLVER&amp;sampleSize=48">Bureau Grotesque Three Seven</a> (closest I can find)<p></p>
      <p>Similar: <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.107991.0.1&amp;attributes.sampleSize=48&amp;sampleText=REVOLVER&amp;sampleSize=48">Gothic No. 13</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.612.0.4&amp;attributes.sampleSize=48&amp;sampleText=REVOLVER&amp;sampleSize=48">Gothic No. 4</a></p>
