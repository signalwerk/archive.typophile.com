      <p>Whoops, not <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.108076.0.27&amp;attributes.sampleSize=48&amp;sampleText=REVOLVER&amp;sampleSize=48">Helvetica</a>. The type in question has noticeable stroke contrast (see the V and O), of which Helv has very little. There was also not a lot of squooshing going on in the pre-digital days. </p>
      <p></p><div class="imageWrap"><img src="/files/revolver.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/NeueHelvetica77CondensedBold.png"></div><br>
      <a>Neue Helvetica 77 Condensed Bold</a><p></p>
