    html: <p> Are you sure it was Peignot's refusal that triggered the suicide? I think D&amp;P was already committed to Peignot, and it was a later design of his (IIRC something more Greek-lapidary, possibly his "Metop"?) that was rejected by an unnamed German font house that did it. <br> <br>Anyway, Cassandre wasn't so distressed over just a simple case of font licensing. He was beside himself with grief because nobody took his alphabet reform efforts to heart, even taking his work, stripping out the reform, and selling it like hotcakes. (BTW, in my case I'm fortunate to be able to squarely blame you guys for being so tentative... :-) <br> <br>hhp </p>
