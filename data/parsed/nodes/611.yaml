    html: <p>Kent's pragmatic suggestion is a good one. <br> <br>If you're just setting a headline your  <br>best bet is to trace it by hand (scan it in, then  <br>draw over it in Illustrator/Freehand). Autotrace  <br>apps are only good for a general start, but by  <br>the time you clean up the points, you could've  <br>done it right from scratch. <br> <br>Good luck. I'd love to see the final result.</p>
