    date_raw: 10.May.2002 8.10pm
    votes: null
    html: <p> There are a number of reputable foundries around today who sell tons of ATF revivals. ITC revived Blair, Font Bureau has a number of ATF-derived designs, and what have you. <br> <br>Reviving one for your own personal use is kosher inside the US. Selling it can be harder depending on the design. Proceed with caution. <br> <br>As for the technical question, which was (I believe) the original question, buy ScanFont fron FontLab. I digitized a whole character set (in my case J.M. Fleischmann's Groote Canon Duits from 1748) inside of a weekend. It's amazingly intelligent. And that one I did with the three-day demo version, which led me to then purchase the full version. Worth every penny! I use it in conjunction with FontLab, but you can also use it with the cheaper TypeTool. </p>
