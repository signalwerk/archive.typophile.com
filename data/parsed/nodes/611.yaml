    html: <p> Personal-use and possession laws vary from state to . . . Oh, wait a minute, we're talking about fonts here. Scratch that. <br> <br>Seriously though, Hrant is right about any copyright expiring. Setting aside the whole issue of whether typefaces are covered under U.S. law, the longest term of protection offered under U.S. copyright is 75 years. So anything older is in the public domain. Less than 75 years and you'll have to research. <br> <br>I would not consider digitizing images from the 1923 ATF book for personal use as pirating -- especially a design which is not currently available in any other way.  <br> <br>If you want to turn your scans into a useable font, then there's always Streamline and Fontographer. But, if you're thinking of trying to set a decent paragraph of text, then you're in for a bit of work to get the font really up to snuff. You won't get professional outlines from a tracing program. You won't get good spacing from an auto routine. <br> <br>On the other hand, if you just want to set a headline, then skip the font. Set your letters manually. <br> <br>-- Kent. </p>
    html_clean: <p> Personal-use and possession laws vary from state to . . . Oh, wait a minute, we're talking about fonts here. Scratch that. <br> <br>Seriously though, Hrant is right about any copyright expiring. Setting aside the whole issue of whether typefaces are covered under U.S. law, the longest term of protection offered under U.S. copyright is 75 years. So anything older is in the public domain. Less than 75 years and you'll have to research. <br> <br>I would not consider digitizing images from the 1923 ATF book for personal use as pirating -- especially a design which is not currently available in any other way.  <br> <br>If you want to turn your scans into a useable font, then there's always Streamline and Fontographer. But, if you're thinking of trying to set a decent paragraph of text, then you're in for a bit of work to get the font really up to snuff. You won't get professional outlines from a tracing program. You won't get good spacing from an auto routine. <br> <br>On the other hand, if you just want to set a headline, then skip the font. Set your letters manually. <br> <br>-- Kent. </p>
