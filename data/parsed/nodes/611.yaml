    html: "<p> BTW, I forgot to tell this story: <br> <br>Excoffon worked for Fondrie Olive, the only main French rival of Deberny &amp; Peignot. Cassandre was finishing his Peignot for D&amp;P when Excoffon came to visit. Upon seeing Cassandre's drawings, Excoffon quickly took the first train back home and drew an imitation. And it was released *before* Peignot. Excoffon's imitation didn't adopt Cassandre's reformist efforts, however, so it actually sold better too... <br> <br>BTW, this incident was actually one of the main catalysts for the foundation of ATypI. <br> <br>hhp </p>"
