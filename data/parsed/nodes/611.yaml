    html: "<p>sorry to dredge up this old digitization issue but I need your vast expertise on a couple of things.  <br> <br>Hypothetical:  <br>you find an older piece of type on a vintage sign, piece of ephemera, old handwritten document... It does or does not have a complete set of letters. (I'm specifically *not* talking about specimen books where the letterforms were designed for printing, etc.) <br> <br>Questions:  <br>is there a set period of time before letterforms become public domain?  <br> <br>If it's an old company logo, does the company have to  be out of business? <br> <br>what if the handwriting is a public figure and part of their \"trademark\", like John Hancock sort of thing? <br> <br>or what if it's an image like P22 has Maxfield Parrish, Van Gogh, William Morris ornaments? Do you have to get permission from estates, museums? <br> <br>thanks for any assistance! I've been wondering about this stuff for quite some time.</p>"
