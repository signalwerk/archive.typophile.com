    html: "<p>ATL Lite doesn't do proper management but, if all you want is <br> <br>&gt;Something that he can load and unload fonts with <br> <br>I find that it's much easier than working through the Fonts folder in Windows. If you're using TrueType fonts, it's not going to work though. If you actually want font management (e.g., the ability to organize fonts in sets and such), then Anonymous is right: ATM Deluxe is probably you're best bet. <br> <br>Printer's Apprentice is OK I guess. I have it, but I only use it for compiling catalogs of typefaces. Not for managing. <br> <br>It sounds like you should figure out which is more important: (1) getting an easier way to install fonts for free; or (2) getting an easier way to install fonts AND the ability to manage fonts in sets AND paying $100. <br> <br>Good luck to ya.</p>"
