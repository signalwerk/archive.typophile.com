    html: |-
      <p>As said above, not without express permission from the foundry or designer. Really good quality libre fonts are limited in number but they do exist, the <a href="/wiki/https%3A/%252Fstore1.adobe.com/cfusion/store/html/index.cfm%3Fevent%3DdisplayFontPackage%2526code%3D1959" class="freelinking" rel="nofollow">Source family from Adobe</a>, <a class="freelinking external" href="http://www.latofonts.com/" rel="nofollow">Lato by Łukasz Dziedzic</a> and the <a class="freelinking external" href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=fontdownloads" rel="nofollow">SIL fonts</a> being some good examples.</p>
      <blockquote><p>Can you recommend any good font editors/creators for Linux?</p></blockquote>
      <p><a class="freelinking external" href="http://fontforge.org/" rel="nofollow">FontForge</a> will be your best bet. <a class="freelinking external" href="http://designwithfontforge.com/en-US/Installing_Fontforge.html" rel="nofollow">There is a great community currently supporting and updating the tool</a>.</p>
