    <p>Er... the god of default anybody? Seriously, they stuck this up at the end of my street the other weekend and I'm <em>not</em> amused. I recently coined the phrase ‘half-assed aesthetic’ to describe what goes on around here in place of a beautiful or useful visual language... but this really takes the biscuit (so far).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/billboard_5329.jpg"></div><p></p>
