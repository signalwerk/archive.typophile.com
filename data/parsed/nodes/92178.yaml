      <p>@cerulean:<br>
      <cite>Some even required assembling an exclamation point from a period and a relatively massive straight apostrophe.</cite></p>
      <p>Many mechanical typewriters did not have a 1 key, and required one to use the lowercase L instead. Nearly all of those also required one to compose ! from ' and . because ! is normally the shift of 1 in the manual typewriter layout as well as the electric typewriter layout.</p>
      <p>However, very few mechanical typewriters did not have a zero. That is for two reasons.</p>
      <p>The first is:<br>
      ( and ) are the shifts of 9 and 0 respectively, and thus omitting the zero would have meant an unconventional location for a vital character. As well, the * - key (or the _ - on an electric) is to the right of the zero key. It's the + = key that got omitted on smaller typewriters.</p>
      <p>The second is:<br>
      While the lowercase l is, like the numerals on a typewriter, an unshifted character, the capital letter O is a shifted character. Thus, omitting the zero would make numbers much more inconvenient to type, while omitting the one only changes typing a number slightly - one has to find the 1 in a different location, but no extra motions of shifting are required.</p>
      <p>So, at least for the typewriters I have experienced in my part of the world, ! is much more often omitted than 0.</p>
