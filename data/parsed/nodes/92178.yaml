    <p>I'm seeing that Oh-for-zero gimmick around lately... I know it's an old trick to replace ones and zeros with I/l and O/o (and vice versa) in passwords and such, but it really bothers me seeing it in actual typography, especially when there's an obvious mismatch (like the height variance in that example).</p>
    <p>Do type designers now have to add a StupidTrend stlystic set? :-)</p>
    <p>hhp</p>
