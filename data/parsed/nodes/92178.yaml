      <p>So a funny thing happened when I was perusing the fabulous -if labyrinthine- Reading University archives: Fiona Ross was showing me a 1972 typewritten letter from Adrian Frutiger to Walter Tracy, and I immediately noticed something...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Frutiger_zero_3962.jpg"></div><p></p>
      <p>At first I couldn't figure out why Frutiger would type a capital Oh where he meant to have a zero, but then I realized that on Swiss typewritters the need to accomodate extra characters probably meant the Oh and zero shared a key! Which BTW is exactly what happened on Armenian typewriters as well: the capitals Ձ, Յ and Օ did double-duty as the 2, 3 and zero (since we have 38 letters)... which BTW is where my Windows/OSX Armenian keyboard layout got that idea.</p>
      <p>hhp</p>
