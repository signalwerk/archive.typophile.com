      <p>When Burmese typewriters came out, they conflated alphabetics with numerals to fit as many characters on as few keys as possible.</p>
      <p>Here we have the little ga, numeral 8, curved ya and numeral 7. The two numerals were represented by these letters with similar forms, though the inner loop of the ya was removed, as is sometimes done in handwriting.</p>
