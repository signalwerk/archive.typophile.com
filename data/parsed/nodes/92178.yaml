      <blockquote><p><em>Actually, what you describe is an old trend, one particular adaptation necessitated by the limited number of keys available on a standard clankety-clank typewriter keyboard…</em></p></blockquote>
      <p>An old trend indeed. <a href="http://tdc.org/wp-content/uploads/2012/03/Screen-shot-2012-03-30-at-6.36.13-PM.png" rel="nofollow">This is</a> what the keyboard layout of Sholes &amp; Glidden Type Writer (a.k.a. Remington No. 1, before 1878) looked like: 43 letters, all caps, no figures 0 and 1, no parentheses and brackets, no exclamation point. In the 1960s I remember using Cyrillic У for Latin V, and figure 1 for Roman numeral I: in Russian typography Roman numerals are used in denoting centuries, thusly: ХУ111–Х1Х вв. But all typewriters in Moscow had Russian keyboard layout! Before decimal (soft-dotted) i (І), yat (Ѣ), fita (Ѳ) and izhitsa (Ѵ) had been dropped in 1918 Russian typists used fita for the V and Cyrillic decimal i for the I: ХѴІІІ–ХІХ вв. That substitution was standard practice in <a href="http://books.google.com/books?id=fYZBAAAAYAAJ&amp;pg=PA15&amp;img=1&amp;zoom=3&amp;hl=en&amp;sig=ACfU3U3uxXO7LsVS16hqbxlY4XuVyrBh-w&amp;w=685" rel="nofollow">typography</a> too.</p>
