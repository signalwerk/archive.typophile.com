    <p>So, somebody I kinda know is getting married, at a gallery converted from a movie theater. Out front he wants to put up a wedding announcement poster in the style of an old horror film. Think 1931 Dracula for instance. Here are some examples:</p>
    <p><a href="http://upload.wikimedia.org/wikipedia/en/d/df/Dracula1931poster.jpg" title="http://upload.wikimedia.org/wikipedia/en/d/df/Dracula1931poster.jpg" class="link-external">http://upload.wikimedia.org/wikipedia/en/d/df/Dracula1931poster.jpg</a><br>
    <a href="http://www.movie-list.com/posters/big/zoom/dracula31.jpg" title="http://www.movie-list.com/posters/big/zoom/dracula31.jpg" class="link-external">http://www.movie-list.com/posters/big/zoom/dracula31.jpg</a><br>
    <a href="http://2.bp.blogspot.com/-Rpy6Kg3cdyM/TbrjDVfhe9I/AAAAAAAAAB8/ozA1B8JHvnA/s1600/dracula_1931_movie_poster_76.jpg" title="http://2.bp.blogspot.com/-Rpy6Kg3cdyM/TbrjDVfhe9I/AAAAAAAAAB8/ozA1B8JHvnA/s1600/dracula_1931_movie_poster_76.jpg" class="link-external">http://2.bp.blogspot.com/-Rpy6Kg3cdyM/TbrjDVfhe9I/AAAAAAAAAB8/ozA1B8JHvn...</a></p>
    <p>Now, all these were hand lettered. Often they were hand lettered but in the style of period typefaces. Can anybody suggest typefaces that might work for this purpose, that look hand lettered like that?</p>
    <p>Thanks!</p>
    <p>T</p>
