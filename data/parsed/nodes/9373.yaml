    html: "<p><i>do the Odieresis and Udieresis only appear in German?</i> <br> <br>They are used in other languages as well: Turkish and Hungarian use both, and Finnish uses Odieresis (and Adieresis), while Estonian uses A-,O-, and Udieresis. There may be others, but these are ones I can think of right away.</p>"
