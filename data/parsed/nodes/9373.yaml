    html: '<p>&gt;does it make sense to give these characters "dropped" accents in the standard Latin encoding? <br> <br>simple answer: NO!!! These designs belongs to lead types / letters - mostly to the bigger ones, the titlings. It was a technical issue. An other "solution" was, to lower the caps high e.g. 90% compared to the regular caps, to get some space for the umlaut.</p>'
