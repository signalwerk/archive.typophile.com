  html: |-
    <p><em>Typefaces and textual information in general, despite their crucial importance to our culture and development, are often neglected when it comes to visual communication and graphic design. This problem is particularly acute in the Central European, post-communist environment. TypeTalks is a collaborative activity designed to raise awareness of the power of typeface design and typography among both graphic design professionals and students.</em></p>
    <p><strong>Read more at:</strong> <a href="http://typetalks.com" title="http://typetalks.com">http://typetalks.com</a></p>
    <p>Our one-day symposium will take place in Brno, Czech Republic in the House of the Lords of Kunštát on 21 June 2010 at 10:12.</p>
    <p>The theme or topic for this conference is type. This is a broad area embracing the history of type, the design of type, type education, the use of type (typography) and much more. The key criteria for the acceptance of a talk is that it have educational value. It is not enough to simply show work, knowledge must be shared as well. Indeed, TypeTalks’ reason for existing is the pleasure taken in learning and in sharing knowledge. Furthermore, we have excellent speakers this year!</p>
    <p>- - -</p>
    <p>Talks</p>
    <p>Tomáš Brousil (CZ): Tabac</p>
    <p>Veronika Burian (CZ/D): Typographic matchmaking</p>
    <p>Florian Hardwig (D): Localize! The dialects of handwriting in type design</p>
    <p>Michael Hochleitner (AT): A contemporary view on the relationship of lettering and type</p>
    <p>Rob Keller (US/D): Font technology is crazy!</p>
    <p>Dan Reynolds (US/D): The passion of the young, multi-script type designer</p>
