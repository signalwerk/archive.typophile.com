    votes: null
    html: "<p>Just to make it a little more interesting... <br> <br>\"<i>the question he poses: are truly neutral typefaces possible?</i>\" <br> <br>I'd say it's possible to use a 'contextually neutral' font, by which I mean a font that draws no attention to itself in a particular context (cultural, temporal, setting, etc.). An example would be TNR on a business document. But even that's pretty hard. It's more like a fulfillment of visual expectations than any inherent feature of the face. <br> <br>So perhaps I mean that a font can be <i>used</i> neutrally, but the <i>font</i> isn't neutral.</p>"
