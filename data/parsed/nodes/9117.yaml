    votes: null
    html: "<p>I like how he doesn't really answer the question he poses: are truly neutral typefaces possible? <br> <br>It also seeme a little weird to pass over Linotype faces like Basic Commercial and Neuzeit-Grotesk, which are arguably more characterless (and therefore more neutral?) than Helvetica or Univers. Basic Commercial has some funkiness going on with the line widths, but Neuzeit-S, at least, has very few unique characteristics at all, and doesn't have the curved-leg R I find so distracting in Helvetica. <br> <br>It's also weird even to bring a geometric sans like Futura into a discussion of neutral typefaces. In fact, most of the humanist sans he mentions in the later part of the article are far too \"warm\" to be considered neutral at all. During <a href=\"http://www.typophile.com/forums/messages/4100/1243.html?1085757699\">one of the previous go-rounds</a> in the never-ending \"Helvetica is the Devil\" wars on Typophile, Hrant suggested Kievit. I went and looked, and Kievit, too, is just too friendly to be useful in neutral contexts. <br> <br>I like some of Berry's columns and I realize it must be tough writing about typography for a more or less general audience, but this one seemed pretty muddled.</p>"
    html_clean: "<p>I like how he doesn't really answer the question he poses: are truly neutral typefaces possible? <br> <br>It also seeme a little weird to pass over Linotype faces like Basic Commercial and Neuzeit-Grotesk, which are arguably more characterless (and therefore more neutral?) than Helvetica or Univers. Basic Commercial has some funkiness going on with the line widths, but Neuzeit-S, at least, has very few unique characteristics at all, and doesn't have the curved-leg R I find so distracting in Helvetica. <br> <br>It's also weird even to bring a geometric sans like Futura into a discussion of neutral typefaces. In fact, most of the humanist sans he mentions in the later part of the article are far too \"warm\" to be considered neutral at all. During <a href=\"http://www.typophile.com/forums/messages/4100/1243.html?1085757699\" class=\"link-lost\">one of the previous go-rounds</a> in the never-ending \"Helvetica is the Devil\" wars on Typophile, Hrant suggested Kievit. I went and looked, and Kievit, too, is just too friendly to be useful in neutral contexts. <br> <br>I like some of Berry's columns and I realize it must be tough writing about typography for a more or less general audience, but this one seemed pretty muddled.</p>"
  - id: 59353
