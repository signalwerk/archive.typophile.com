      <p>How can it be a sans-serif typeface if it has balls?<br>
      Ball terminals are a kind of serif.</p>
      <p>Look at Archer and Bodoni Egyptian.<br>
      They are monoline faces with ball terminals, but also serifs, slab in fact.<br>
      Imagine them without the straight serifs.</p>
      <p>Perhaps something like Sari manages the integration, mixing balls with rounded "plain" terminals, due to greater contrast of stroke thickness.</p>
      <p>But if you're following a hard-edged didone model, perhaps the answer is small balls.</p>
      <p>Experiment and see what works!</p>
