    <p>Hey guys, first time posting in here, requesting some advice on a typeface I'm designing for uni. It's nothing groundbreaking, and given the timeframe (3-4 weeks), it is something that I will create, and then go back and refine when I am on my holidays.</p>
    <p>Anyway, I digress. I have 2 questions. </p>
    <p>1. Is it okay to use ball terminals on a sans-serif typeface? To give you an idea of what style I want to create, think something similar to Bodoni or Didot, minus the serifs. </p>
    <p>and 2. Say hypothetically I use a ball terminal on the letter 'f', does that mean I have to carry it through with the other letters that would have one too? like r, a, c etc? (should also note that I am only doing the lowercase, as we were only asked to do either upper or lower and numerals)</p>
    <p>Cheers</p>
