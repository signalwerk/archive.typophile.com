      <p>My feeling is that a ball terminal (or any particular terminal convention) usually exists not merely as a style of "decoration" but also a functional way to add a particular kind of weight to that stroke. And I can imagine an /a/ and an /f/ in the same font that would have rather different needs for weight at their tops. In that case, identical terminals for consistency's sake wouldn't be particularly desirable. </p>
      <p>In my experience, a close look at successful fonts often reveals more inconsistency in terminal treatments than I expected to find.</p>
