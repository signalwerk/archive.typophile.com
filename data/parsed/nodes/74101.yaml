      <p>1) Why not?<br>
      Remember, that you dont't make a didone minus the serifs, but also minus the high contrast.</p>
      <p>2) Yes.<br>
      Take an ink pen, the one that pours ink on paper when you don't move your hand. Draw these letters with one second of debt.</p>
      <p>1+2) Manage the resulting crisis, according to the effect that you want to achieve.</p>
