    html: |-
      <p>It appears that you have the class to be ignored on the wrong side of s' in the ignore command, so that you final 's' will never be substituted where 'ſ' follows another letter, but will only be seen where 's' is an isolated letter. Move the @LETTER class to the other side of s' and long 'ſ' will remain long whenever another letter follows, but change to final 's' when a space or punctuation follows. </p>
      <p>The other way to do this is the way I'm doing it in the font I'm now working on:</p>
      <p> sub s' @calt10 by s.calt;</p>
      <p>#where @calt10 is the calss of all punctuation marks and spaces before which long 'ſ' is supposed to change to final 's'.</p>
