      <p>Your 'swsh' feature won't affect the ligature o_s unless your 'liga' feature (or whichever feature you are using for ligature formation) precedes it.</p>
      <p>Also, in cases where you only have a single alternate, there is no reason to use the 'sub X from [Y];' syntax -- you can just use 'sub X by Y;'.</p>
      <p>André</p>
