      <p>You're right, the code you reference only provides for one alternate per glyph. A substitution rule for a glyph with several alternates uses a different syntax:</p>
      <p><code>sub <strong>glyph</strong> from <strong>class</strong>;</code></p>
      <p>So for an 'a' with four alternates, the rule would be:</p>
      <p><code>sub a from [a.alt1 a.alt2 a.alt3 a.alt4];</code></p>
      <p>Single substitution rules ("by") and alternate substitution rules ("from") can't be used in the same feature/lookup. So if you're using classes to minimize the code for single substitutions (as in the example from the website), you'll need to create separate lookups. For example:</p>
      <p><code>feature salt { # Stylistic Alternates<br>
      &nbsp;&nbsp;lookup single {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub @salt1 by @salt2;<br>
      &nbsp;&nbsp;} single;<br>
      &nbsp;&nbsp;lookup alternate {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub a from [a.alt1 a.alt2 a.alt3 a.alt4];<br>
      &nbsp;&nbsp;} alternate;<br>
      } salt;<br>
      </code></p>
      <p>Note that glyphs with multiple alternates should be removed from the classes used for single substitutions, so that there's a 1:1 relationship between the glyphs in @salt1&nbsp;and their alternates in @salt2.</p>
