      <p>Turoturom: <em>Does your last paragraph mean I should eliminate everything I put in CLASSES cause I no longer need them or just leave all the ones I named .alt1?</em></p>
      <p>Assuming most of your glyphs have only one alternate, and you're using predefined classes to code those alternates in a single rule (as in the example you referenced), then you'd want to strip those classes of any glyphs that have more than one alternate (including the first ".alt1"), and leave just the glyphs that have only one alternate. Since glyphs that have multiple alternates must be coded separately, leaving them in the original classes would be redundant and could possibly lead to conflicts.</p>
      <p>If you're following Adam's example (which may well be better practice, especially if you have many glyphs with multiple alternates), it would make more sense to scrap your original classes completely and create new classes containing the alternates for each glyph. So instead of classes like<br>
      <code>@salt1 = [a b c d e ...];<br>
      @salt2 = [a.alt1 b.alt1 c.alt1 d.alt1 e.alt1 ...];</code><br>
      you'd have classes like<br>
      <code>@a_salts = [a.alt1 a.alt2 a.alt3 a.alt4];<br>
      @b_salts = [b.alt1 b.alt2];<br>
      @c_salts = [c.alt1];</code><br>
      and the corresponding rules in the <code>salt</code> feature would be<br>
      <code>sub a from @a_salts;<br>
      sub b from @b_salts;<br>
      sub c from @c_salts;</code></p>
      <p>Note that using "from" rules requires that even lone alternates be referenced by a class, either predefined (as above), or inline (as in <code>sub c from [c.alt1];</code>).</p>
