      <p><cite> Also, the naming convention for ligatures is to place an underscore between the letters, i.e. "s_s" "o_s" "s_s.alt1" "o_s.alt1", but that makes no difference technically. </cite></p>
      <p>Actually, it does make a difference technically. If you use nonstandard names such as 'os' or 'ss', it will not always be possible for applications to reconstruct the original unicode values associated with the underlying text which may cause problems for searching, cutting and pasting text, etc. The underscore convention should always be followed.</p>
      <p>André</p>
