    <p>Hello, I am finishing a typeface that has 3 or 4 alternative glyphs for the same letter on FontLab. Not knowing much of programing I've been able to solve a lot problems searching on the web for I find that the FontLab Manual is not very friendly for me.</p>
    <p>I use this link (below) for the final touches for my font, this page has been very usefull, but it does not specfy what to do if you have more than one alternative letter for one character</p>
    <p><a href="http://blog.theleagueofmoveabletype.com/post/238296379/how-to-add-opentype-alternates-in-fontlab" title="http://blog.theleagueofmoveabletype.com/post/238296379/how-to-add-opentype-alternates-in-fontlab">http://blog.theleagueofmoveabletype.com/post/238296379/how-to-add-openty...</a></p>
    <p>I would write him but he has not replied to any of his question/comments of other users</p>
    <p>I named my glyphs as he suggests! For example</p>
    <p>a.alt1<br>
    a.alt2<br>
    a.alt3<br>
    a.alt4</p>
    <p>...and such</p>
    <p>What's written right below is where I get stuck, copied from his web. My main question is, how do I program for a.alt3 and a.alt4?</p>
    <p>------------------</p>
    <p>And finally, the code block for SALT. &nbsp;Click the + again and cut and paste this:</p>
    <p>feature salt { # Stylistic Alternates<br>
    # Latin<br>
    sub @salt1 by @salt2;<br>
    } salt;</p>
    <p>------------------</p>
    <p>This is all I need to complete post my font.</p>
    <p>Thanks in advance</p>
    <p>Mario Arturo</p>
