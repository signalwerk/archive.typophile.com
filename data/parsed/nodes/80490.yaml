    html: |-
      <p>A short explanation for the classes: </p>
      <p>1. You can define named classes in the FontLab Classes panel. </p>
      <p>2. You can define named classes in the lower part of the OpenType panel. Then you use the syntax @a_salts = [a.alt1 a.alt2 a.alt3 a.alt4]; -- in fact, when you define the classes in the Classes panel, when FontLab Studio is compiling feature definitions, it does (behind the scenes) write the classes using the @NAME=[...]; syntax, and then the features are compiled. Note that in the Classes panel, you don't use the "@" in front of the name, but in the OpenType panel, you do. </p>
      <p>3. You can define unnamed inline classes as in "sub a from [...];"</p>
      <p>These are all interchangable. You can define your "a_salts" OpenType class in the Classes panel, or the "@a_salts" class in the lower part of the OpenType panel, or you can write an unnamed class right in the "salt" feature definition ("sub a from [...];"). That doesn't matter. </p>
      <p>Indeed, the "sub ... from ..." syntax ALWAYS uses a single glyph before the "from" and a class after the "from" keyword. </p>
      <p>Best,<br>
      Adam</p>
