    html: |-
      <p>When gargoyle wrote the line</p>
      <blockquote><p>ignore substitute @LETTER e';</p></blockquote>
      <p>you should understand that as a line making an instruction about two different elements (separated by the space). It depends on you having a class named LETTER (*not* "LETTER e'") and says ignore the substitution of an e that follows anything in the LETTER class. Your LETTER class should, well, have all your letters in it!</p>
