      <p>Except for the missing semicolons, the code in your above post appears to be correct. As for where to put it, the <code>calt</code> feature (Contextual Alternates), or possibly <code>cswh</code> (Contextual Swash), seem most appropriate. Add the feature to list in the OpenType panel as you did for your other features, then add the rules.</p>
      <p>Like the manual explains, you must define the @LETTERS class to contain every glyph that might appear as part of a word (which may include alternates). That can be done using the Classes panel, adding the class and dragging in the glyphs.</p>
      <p>To better explain the contextual code:</p>
      <p><code>ignore substitute @LETTER e';<br>
      substitute e' by e.init;</code></p>
      <p>Loosely translated:<br>
      Ignore the following substitution rules if there's any letter preceding the glyph 'e'; if there's not, substitute the glyph 'e' with the glyph 'e.init'.</p>
      <p>For a broader understanding of the logic behind contextual substitution rules, it might help to read over that entire section of the manual, beginning on page 870.</p>
