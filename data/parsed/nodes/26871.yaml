    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 28.Oct.2003 12.44pm </div>
      <p>Recently the latest issue of Pts. magazine was presented.  <br> <br>Pts. is an infrequently published magazine on type design, typography and other areas of interest. <br> <br>5 Pts. is the do-it-yourself issue, and approaches type design and typography from an unexpected, maybe questionable but feasible perspective. This new issue contains contributions of Elliott Earls, Chris Vermaas &amp; Cyrus Highsmith, Ties Alfrink &amp; Marc de Bruijn, Hugo de Pagter, Stoffel den Drijver, Jan Willem Stas &amp; Rick Vermeulen, Paul Mijksenaar, Zack Ostrowski, Jocelyn Fuller, Kristen Borchardt, Christine Niemeier, Doug Kisor, Evert Bloemsma &amp; Jan Middendorp, Anka Kresse, Pekka Lähde and type-basics by Underware. <br> <br>5 Pts. is world-wide available in specialized bookshops. Pts. is published by Underware, Den Haag, the Netherlands. <br> <br>You wanna see what the book looks like? <br><a href="http://www.underware.nl/site2/index.php3?id1=underware&amp;id2=publications&amp;id3=pts&amp;id4=5pts&amp;id5=general" target="_blank">http://www.underware.nl/site2/index.php3?id1=underware&amp;id2=publications&amp;id3=pts&amp;id4=5pts&amp;id5=general</a></p>
