      <p>No need to redraw /R. Have a look to my previous post. I included a link pointing directly to the complete glyph set of Diamond and you'd see the /R they used specifically for this identity. 'Regular' /R is 2nd line 6th position (blue circle), the used one is the one after, 2nd line 7th position (red circle) and should be available as stylistic alternate through OpenType features.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/02_4656.png"></div><p></p>
