    html: "<p>Sorry, Fraher, don't have the answer for 'Fictive'. It loosely reminds me of <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/balmoral\" rel=\"nofollow\">Balmoral</a> and <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/sudtipos/feel-script\" rel=\"nofollow\">Feel Script</a> but there might be a long way to get there starting from it. Some more I like for this job: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/filmotype/yale\" rel=\"nofollow\">Yale FT</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typesenses/parfumerie-script-pro\" rel=\"nofollow\">Parfumerie Script</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/shelley+script\" rel=\"nofollow\">Shelley Script/English 111</a> (probably my choice for customization), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/mti/atcitadel-script\" rel=\"nofollow\">Citadel Script</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/bitstream/lucia\" rel=\"nofollow\">Lucia</a></p>"
