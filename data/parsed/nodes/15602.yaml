    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Sabon</strong></p>
    <p>Sabon is a typeface designed by <a href="/node/12609" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jan Tschichold</a> in 1967 for <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a>. The typeface was commissioned by a group of German printers, who wanted a good text face that would appear the same on all three metal type mechanisms used at the time (hand-set foundry type, the <a href="/node/12232" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Machine</a>, and the <a href="/node/add/wiki?edit%5Btitle%5D=Monotype%20Machine" title="Create node &quot;Monotype Machine&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype Machine</a>). Its design was based on <a href="/node/12481" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Garamond</a>.</p>
    <p>Sabon was later converted for use on photo-typesetting machines. Still later, it was made available in digital format. The digital Sabon is distributed by <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>.</p>
    <p>In 2001–2002, <a href="/node/20629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jean Francois Porchez</a> revived and extended Sabon, creating the type family <a href="/node/15611" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sabon Next</a>. Sabon Next is distributed by <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>, and is part of their <a href="/node/15662" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Platinum Collection</a>.</p>
    <p><a href="http://www.linotype.com">Linotype’s website</a> includes an overview of all of the <a href="http://www.linotype.com/1436/sabon-family.html">original Sabon font</a> weights, and all of the <a href="http://www.linotype.com/53159/sabonnext-family.html">Sabon Next</a> weights as&nbsp;well.</p>
