    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Sabon</strong></p>
    <p><img src="http://upload.wikimedia.org/wikipedia/commons/2/2f/Sabon.png" img=""></p>
    <p>Sabon is a typeface designed by <a href="/wiki/Jan%20Tschichold" class="freelinking" rel="nofollow">Jan Tschichold</a> in 1967 for <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a>. The typeface was commissioned by a group of German printers, who wanted a good text face that would appear the same on all three metal type mechanisms used at the time (hand-set foundry type, the <a href="/wiki/Linotype%20Machine" class="freelinking" rel="nofollow">Linotype Machine</a>, and the <a href="/wiki/Monotype%20Machine" class="freelinking" rel="nofollow">Monotype Machine</a>). Its design was based on <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a>.</p>
    <p>Sabon was later converted for use on photo-typesetting machines. Still later, it was made available in digital format. The digital Sabon is distributed by <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>.</p>
    <p>In 2001–2002, <a href="/wiki/Jean%20Fran%C3%A7ois%20Porchez" class="freelinking" rel="nofollow">Jean François Porchez</a> revived and extended Sabon, creating the type family <a href="/wiki/Sabon%20Next" class="freelinking" rel="nofollow">Sabon Next</a>. Sabon Next is distributed by <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>, and is part of their <a href="/wiki/Platinum%20Collection" class="freelinking" rel="nofollow">Platinum Collection</a>.</p>
    <p><a href="http://www.linotype.com" rel="nofollow">Linotype's website</a> includes an overview of all of the <a href="http://www.linotype.com/1436/sabon-family.html" rel="nofollow">original Sabon font</a> weights, and all of the <a href="http://www.linotype.com/53159/sabonnext-family.html" rel="nofollow">Sabon Next</a> weights as well.</p>
