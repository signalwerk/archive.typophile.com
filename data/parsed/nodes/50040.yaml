    <p></p><div class="imageWrap"><img src="/files/AmericanEmblem_3788.jpg"></div><p></p>
    <p>Does anyone know the name of this typeface?  It has an interesting combination of both official looking strong letterforms as well as a few whimsical curlicues.  This typeface will be used for the company branding of a Horsedrawn carriage company operating in a midwest river town celebrating their bicentennial.  I need to find something that is classy and historic, and horsey- Main Street America... but not mistaken for wild west or circus.  </p>
    <p>Open to alternative suggestions!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/50043" class="topic-previous" title="Go to previous forum topic">‹ BOHLERT MASSEY INTERIORS logo</a> <a href="/node/50041" class="topic-next" title="Go to next forum topic">Can anybody tell me what this is? ›</a></div>
