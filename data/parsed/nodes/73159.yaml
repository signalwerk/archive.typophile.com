    <p>Hi all,<br>
    I'm working on a magazine redesign, looking to incorporate a typeface from the Modern family. Really love Miller and Monotype Modern but I'm hoping to find something that is less commercial and exposed, something a little more unique.<br>
    Any suggestions would be appreciated!<br>
    Thanks in advance!</p>
