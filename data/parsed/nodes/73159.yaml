      <p><em>...the legibility is not great as a text face...</em></p>
      <p>I beg to differ, which is why I revived this style in the first place.<br>
      Sure, it bucks conventional wisdom -- for some reason art directors consider 400 (Garamond) and 500 (Bembo) -year old designs more readable than a 150-year old design. Sackbutts over saxophones. Go figure.</p>
