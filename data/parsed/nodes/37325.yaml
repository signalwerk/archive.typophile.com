  html: <p>We just posted a rather lengthy interview with Jens Gehlhaar, type designer and creative director at Brand New School in Los Angeles. The article includes a wide survey of Gehlhaar's type designs from the past decade or so, his thoughts on typographic education, and the expatriate experience. Check it out at <a href="http://www.neojaponisme.com" title="http://www.neojaponisme.com">http://www.neojaponisme.com</a>, a new online publication from Tokyo.</p><div class="imageWrap"><img src="http://typophile.com/files/jens_main_5890.gif"></div><p></p>
