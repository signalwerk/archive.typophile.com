    <p>About Concord<br>
    Yet another typeface with simplicity as it's core element. Concord is derived from a successful type family 'Accord Alternate' by giving geometric touch to it. Hence Concord is a geometric sans serif. It has large counters which enhance readability. It is available in seven different weights for emphasis.</p>
