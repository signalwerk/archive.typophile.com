    user_image: /files/pictures/picture-92807.png
    date_raw: 16 Nov 2011 — 2:13pm
    date: 2011-11-16T14:13:00
    votes: null
    html: |-
      <p>Thank you for your kind comments! I agree with almost all of your remarks. I'm already working on it :-)</p>
      <p>Craig, yes, the /f/ alternate is contextual. I also see some imbalances in the regular /x/, but that is if it is seen alone. I designed it to collide its right neighbor, so you have to take into account that the imbalance disappears within running text... almost, because I agree with you after all that it can be polished.</p>
      <p>I will make my best to make you change your mind about the discretionary ligatures. I admit they are "difficult".</p>
      <p>James, you are totally right about the alternate Q. I did the correction to the Q some time ago, but forgot to think about the alternate. Thank you very much! I try not to miss things like this by working very systematically, but errors can always sleep through.</p>
      <p>I will soon post an update of my corrections.</p>
