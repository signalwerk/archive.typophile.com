      <p>I especially like what you've done on the /x/ and /&amp;/. But maybe the bottom right stroke of /x/ goes a bit too low. Maybe that's desired maybe not. It should definitely show up better in a line of text because it may break the reading line.</p>
      <p>I'm not so sure about the /R/K/ alternates with angular tail. Because your type isn't really angular and seems odd. They should maybe be done more in a way that the /RU/ combination shows but maybe with a bit shorter stroke.</p>
      <p>Have you considered your /ri/ ligature to maybe lower the /i/ and hence also lower the ear of /r/. It wouldn't seem so stretched and over-exaggerated. Although /i/ shouldn't be too low because it may get distracting. So just a nice little shortening would do better to this ligature.</p>
