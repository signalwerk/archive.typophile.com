      <p>I chose the name mainly because of it's meaning in Spanish:</p>
      <p><cite>"f. Arte de bien decir, de dar al lenguaje escrito o hablado eficacia bastante para deleitar, persuadir o conmover." (Real Academia Española)</cite></p>
      <p>Nevertheless, as Florian pointed out, I can't forget it's etymology, which is the art of public speech. I like the way the term has been generalized to the written language in Spanish-speaking countries, but I don't know if this has happened elsewhere. I was aiming at <em>rhetorical device</em> rather than <em>rhetoric</em> per se. Do you think the majority of people will also tend to misinterpret "Rhetorica"?</p>
