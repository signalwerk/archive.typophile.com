      <p>I think the most concise and precise I've managed to be<br>
      concerning Legato's seminal nature is my mini-review of<br>
      2004, quoted here: <a href="http://typophile.com/node/55783" title="http://typophile.com/node/55783">http://typophile.com/node/55783</a><br>
      (The non-italicized second paragraph<br>
      is actually part of the review.)</p>
      <p>It's possible that focusing on single fonts is misleading.<br>
      Focusing on genres is better; so for example I would concede<br>
      that the genre of Sans is probably culturally more significant<br>
      than Legato. However: is there a single Sans font that can take<br>
      most of the credit? And consider how significant a Legato <em>genre</em><br>
      would be...</p>
      <p>So, if we do choose to focus on individual typefaces, exactly<br>
      what font is more significant, culturally? Ideal Sans? Charming.<br>
