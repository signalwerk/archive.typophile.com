      <p>Oh come on. The FIRST response in this thread said “it has all the characteristics of Adobe Minion.”</p>
      <p>It has been said elsewhere on Typophile that “if you don't have anything nice to say, don't say anything at all ... Silence is critique enough.” This is good advice in most cases. </p>
      <p>But there are cases — usually on the Critique forum — where people are engaged in acts of atrociously bad ethics or just flagrant deceit. And if people who know better "don't say anything at all," then Typophile becomes a little more of a safe haven for that kind of bad behavior. </p>
      <p>If minimum standards of civility are demanded of those who plan to critique the work of others, equivalent standards should be demanded of those who plan to post work. Right now there's an imbalance, leading to an implied policy of "post whatever you want and don't worry that you'll have to take any heat for it." </p>
      <p>In this case, Typophile encouraged the creation and sale of a font that was plainly a knockoff all along. I hardly think that's a very "typophilic" role for this forum.</p>
