      <p>I didn't mean to offend anyone. I'm really sorry if my study in Rhetorica resulted in an offensive pastiche: that was far from any of my intentions. I have just written to MyFonts to remove the typeface from the webpage. I also profoundly apologize with Slimbach, who I admire and respect most of all; I apologize with all typographers from all over the globe, because it's insulting: insulting to the endeavor of typographers which deserves fair remuneration for the work, and insulting to typographers as artists. I will refund to the people who bought Rhetorica. This should have remained as a study. I'm also sad that nobody ever pointed it out.</p>
      <p>If typography gives a me another chance, I will produce something genuine and worthy of being called art. I still want to become a good typographer and I think that have learned immensely while drawing Rhetorica and participating in this forum. I'm happy that such a rich community of great typographers is willing to share their knowledge. I really admire you and hope to someday be able to make amends with all of you.</p>
      <p>Sincerely,<br>
      Alexis</p>
