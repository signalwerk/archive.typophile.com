      <p>I'm afraid I have to agree with Toshi, it's clearly derived from Minion. There's simply no way an independent design could settle on the same x-height, caps height and extenders. The changes that have been made are whimsical small details applied without consistency. They also give the game away: they're handled badly and drawn much less confidently. The important design decisions made by Slimbach are evident: the way the strokes thin at junctions, the widths and proportions of most letters, style of serifs, spacing, errors with the ogonek connection, eszett with a spur etc etc.</p>
      <p>Some unfortunate buyer licensed the typeface and then complained on the <a href="https://www.facebook.com/myfonts/posts/316207625092324" rel="nofollow">MyFonts Facebook page</a> that the uprights and italics have different linespacing. Really they ought to be refunded for having bought something that's pretty un-useable.</p>
