      <p>I can't personally see much of a reason to adapt Rhetorica. I would hope if anything this episode has shown the futility of adapting an existing design. I'd really recommend drawing from scratch: that's a much better way to learn how to make design decisions about proportion, rhythm and typographic tone, and how to control curves. Those decisions are the fun part of the design process, testing ideas and seeing how they affect each letter, and how everything interrelates. For me the starting point needs to pose a question. Starting from existing curves precludes reaching a true answer, and curtails creativity.</p>
      <p>Alexis, I hope you haven't been put off type design, and I look forward to critiquing your next work.</p>
