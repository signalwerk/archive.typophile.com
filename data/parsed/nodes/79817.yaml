    html: |-
      <p>Since the last four months, I finally set aside some time to expand my character set prolifically. The development of the typeface had frozen in summer. I must admit it has been a demanding and meticulous task, to the extent that I almost give up. Two years ago, as the idea of making my own typeface was born, I wasn’t even considering drawing an Italic companion. One year ago, I was decided that the character set of the family would stay in a modest minimum. But after I started drawing my Small Capitals, I wasn’t resisting to add the Bold Italic version to the family anymore. The latter has unquestionably become my favorite amongst the four different variants; perhaps this is explained by the fact that it is the less “silent” of his brothers, it is the clear evidence of my lately playful attitude towards contrast, but resisting not to isolate it apart from the clean, harmonious spirit of the typeface.</p>
      <p>One of the most difficult and frustrating tasks I encountered was finding a name for the font. Nothing seemed suitable. Not until one month ago. Rhetorica is a name which I feel depicts the purpose of this typeface very precisely. I wonder what effect or impression this name has on different languages...</p>
      <p>Rhetorica now covers the Adobe Latin 3 character set, so I am proud to take into account a much wider range of languages, covering the vast majority of the Latin-Based CE forms. Additionally, I included Small Capitals with corresponding punctuation, as well as titling and oldstyle figures (both with tabular and proportional instances), fractional figures (numerators and denominators) ligatures and stylistic alternates.</p>
      <p>I'd appreciate all (or, should I say, ALL) kinds of comments: constructive, destructive, short, extensive, deep, superficial, &amp;c. A specimen can be found at the top of the post.</p><div class="imageWrap"><img src="http://typophile.com/files/TitleSmall_6125.jpg"></div><p></p>
