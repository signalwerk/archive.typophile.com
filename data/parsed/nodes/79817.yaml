      <p>&gt; I've said this before, and I'm not kidding: to me<br>
      &gt; Legato is the most significant single typeface<br>
      &gt; since Gutenburg's work.<br>
      I haven't seen you say this before, but that's quite a statement — especially considering it seems to neglect a lot of significant single typefaces between Gutenberg's work and Legato. I must say I'm incredibly impressed by Legato, but I'm just not sure if it's A method for a legible typeface or THE method. Two things are clear to me though: it does read very well and the variety in strokes is very aesthetic and lively. Is legibility the only factor to regard Legato so highly though? I'm interested in why exactly you speak of Legato the way you do. I'm personally not convinced type needs to evolve like Legato. I see it more as something aesthetically pleasing than a method to make perfect type. It's not like other typefaces neglect the interaction of black and white space, after all. Ultimately I find myself being more impressed by a typeface like Ideal Sans than Legato.</p>
      <p>I was just wondering where the talk about copying fonts came from though as Rhetorica seemed to have a genuine design process and similar to Hrant, I never cared to look at Minion long enough to see that Rhetorica is a modified Minion. I didn't read the middle part of this topic so I missed the climax. Quite a pity though, because as I said before Rhetorica seems more lively. Rather than abandon the project the letters could be redrawn with original dimensions (x-height, ascenders, descenders, cap height) — especially after Alexis' gracious apology.</p>
