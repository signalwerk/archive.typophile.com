      <p>Hi Alexis,</p>
      <p>I just found your font on MyFonts and I have some things to say about it. First of all, remove Rhetorica from MyFonts immediately. Right now. And I tell you why you should.</p>
      <p>Your typeface is a ripoff of Adobe Minion. Any defensive action is futile as this is obvious to the eyes of the experienced. Here’s why I believe this is a ripoff.</p>
      <p><a href="http://new.myfonts.com/fonts/alexis-luengas/rhetorica/regular/glyphs.html" title="http://new.myfonts.com/fonts/alexis-luengas/rhetorica/regular/glyphs.html">http://new.myfonts.com/fonts/alexis-luengas/rhetorica/regular/glyphs.html</a><br>
      <a href="http://new.myfonts.com/fonts/adobe/minion/minion/glyphs.html" title="http://new.myfonts.com/fonts/adobe/minion/minion/glyphs.html">http://new.myfonts.com/fonts/adobe/minion/minion/glyphs.html</a></p>
      <ul>
      <li>This is simply too well done for a first typeface (especially for a seriffed one).</li>
      <li>Most characters look way too similar to each other, especially the ones you didn’t care so much.<br>
      (e.g. Ω π ¤ ∫ ∑ ∞ and shape and position of diacritic letters)</li>
      <li>The ones that are different are poorly drawn.<br>
      (i.e. the ones you reredrawn or added such as strange swashes, ligatures and ampersands)</li>
      <li>The characters rather unique to adobe fonts are included and they look almost the same as Minion’s. Those things would never cross your mind if you are a beginner (but not a pirate) typeface designer.<br>
      (e.g. ck ch smallcap fi fl ss and all the alternate numerals &amp; punctuations)</li>
      <li>Your Italic too is Minion mixed with Palatino.</li>
      </ul>
      <p>There is nothing wrong about learning by referring, utilising, or even imitating the past work. It is surely an effective way to learn. However, it is unacceptable if you do not clarify your sources upon release. I personally recommend never to release such fonts because they are very likely to be similar to their references. This kind of work is a study material but not a creation.</p>
      <p>I guess you learned a lot about typeface design through this work and that’s very good. But please don’t release this pretending that this is your own work because it’s not. It’s Slimbach’s. Make your own typeface next time. I welcome you to this field so much and honestly want to see your next work.</p>
      <p>Lastly, it is sad that nobody on this thread has pointed it out before the release. No intention to blame anyone.</p>
