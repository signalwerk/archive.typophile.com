      <p>Gill, Syntax and Frutiger were also "revolutionary" if you don't take the term too seriously. I've been pondering what it is about Legato which makes reading more fluid than Syntax for example, and I think it has to do with the general color. Obviously type designers value a good texture and color, and humanist typefaces tend to deliver that quicker. I think I came to the right conclusion. What it is about Legato which makes it calm on the eyes is the fluidity.</p>
      <p>But here's why I don't think Legato is necessarily the better way to design type. Legato really isn't clear, crisp and pure. Ideal Sans comes much nearer to that ideal. So there's a bit of a dilemma as to what makes a typeface more legible. Clarity or fluidity? I think there are arguments for both and it might be contextual, as this is also the reason why we have specific typefaces for books and other typefaces (sans or serif) for shorter texts or display use or whatever. I find myself leaning towards clarity rather than fluidity most of the time though, which is why I find Ideal Sans aesthetically more pleasing.</p>
      <p>Legato is — when you look at individual letters — more a work of art than a typeface. It's fluid and humanist, and makes the other humanist sans serifs look more mechanical.</p>
      <p>Having said this, I must take back a bit of my passion when I was criticizing Hrant for calling Legato revolutionary. I still think it's a bit of an overstatement, but I have to admit I haven't seen a sans serif typeface more fluid than Legato regardless of how many humanist/cursive elements the other sans serifs might feature. As such, maybe Legato really can be the beginning of a new genre I would call "fluid" instead of "humanist".</p>
    html_clean: |-
      <p>Gill, Syntax and Frutiger were also "revolutionary" if you don't take the term too seriously. I've been pondering what it is about Legato which makes reading more fluid than Syntax for example, and I think it has to do with the general color. Obviously type designers value a good texture and color, and humanist typefaces tend to deliver that quicker. I think I came to the right conclusion. What it is about Legato which makes it calm on the eyes is the fluidity.</p>
      <p>But here's why I don't think Legato is necessarily the better way to design type. Legato really isn't clear, crisp and pure. Ideal Sans comes much nearer to that ideal. So there's a bit of a dilemma as to what makes a typeface more legible. Clarity or fluidity? I think there are arguments for both and it might be contextual, as this is also the reason why we have specific typefaces for books and other typefaces (sans or serif) for shorter texts or display use or whatever. I find myself leaning towards clarity rather than fluidity most of the time though, which is why I find Ideal Sans aesthetically more pleasing.</p>
      <p>Legato is — when you look at individual letters — more a work of art than a typeface. It's fluid and humanist, and makes the other humanist sans serifs look more mechanical.</p>
      <p>Having said this, I must take back a bit of my passion when I was criticizing Hrant for calling Legato revolutionary. I still think it's a bit of an overstatement, but I have to admit I haven't seen a sans serif typeface more fluid than Legato regardless of how many humanist/cursive elements the other sans serifs might feature. As such, maybe Legato really can be the beginning of a new genre I would call "fluid" instead of "humanist".</p>
