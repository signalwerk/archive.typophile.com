      <p>Third one for sure.</p>
      <p>I think this is a beautiful typeface - congrats and keep going! My only (small) criticisms are:</p>
      <p>- The softness of the crossbar/aperture of the 'e.' It looks a little too friendly compared to the other letterforms.<br>
      - The ear on the 'g' could be a little more rectangular, and less triangular. I would also shorten the bowl by a few clicks.<br>
      - The aperture of the 'a' is a little too round and friendly for my taste, and it doesn't relate as well to the top stroke, which is lovely.</p>
      <p>All in all, I'm really impressed - I would absolutely use this typeface myself. :)</p>
