    <p>On August 2009 I decided to make this book typeface.</p>
    <p>   While reading a book on September, I was caught by an ff ligature (I know, cliché, but I can't change the facts), and for the first time I became interested in typography and design. I started to read a few of books about typography, including The Elements of Typographic Style (of course), taught myself calligraphy and began working on Rhetorica right away. The Regular and Bold style were constructed using exclusively FontLab. By contrast, the Italic style was based on my hand-script, and then fine-tuned in Fontlab.</p>
    <p>   After a pause of six months, now I had time to resume the design. The character set has grown, and with it my knowledge of the dynamic of shape has improved.</p>
    <p>   All kinds of comments are welcome. Main point it help's me build up Rhetorica. I'm sure I have something to learn from most people here; I just hope they share their knowledge to me c:</p>
    <p>***</p>
    <p>The most recent SPECIMEN can be found <a class="freelinking external" href="http://www.fileden.com/files/2008/3/18/1822866//Rhetorica Specimen (15.11.2011)_2.pdf" rel="nofollow">HERE</a>. (Sorry, I've had problems uploading it directly to typophile).</p>
