    html: |-
      <p>That's great work for a starter! I'm no pro, so feel free to ignore my comments ;-)</p>
      <p>Look at the width of your horizontals. For example the horizontals in E look thicker than O.</p>
      <p>The tails in K R k need to be flatter at the bottom.</p>
      <p>The tail in J is too short.</p>
      <p>Riccardo is right about the G.</p>
      <p>The serifs in s are too thin, look at Adobe Garamond's s.</p>
      <p>For a textface, it would make more sense to give c and f ball terminals.</p>
      <p>Historically, the bowl of the a usually has a more vertically slanted look and is slightly narrower (see Adobe Garamond). Yours is not really bad, but consider the options carefully.</p>
      <p>b should be more flat at the bottom. Same thing for q. Most textfaces (again, see Garamond) have a small serif at the top of q. This is to prevent the u from looking too large next to the q.</p>
      <p>arm of r is too long and has a weird terminal.</p>
      <p>top of t is the wrong way around in the regular weight.</p>
      <p>I'm sorry, but that tail in x is horrible! Make it a serif.</p>
      <p>y terminal needs to be moved to the right. Try a Minion style terminal.</p>
      <p>The positioning off accents need much more attention. Use Garamond or Minion as a Mask.</p>
      <p>I don't like the first ampersand alternate (top right in the pict above), nor the y alternate.</p>
      <p>An ll ligature? I fail to see the beauty of that.</p>
      <p>f doesn't flow nicely in the tittle in fi and fj ligature.</p>
      <p>v and k are too wide in the italic weight.</p>
      <p>That's A LOT of stuff to consider. Don't let it demotivate you. From what I can tell by what you've made so far, you're a quick learner. Look often and closely at other text typefaces. Take your time. "A typeface is never finished, only abandoned" You should realise that there's a good chance that you'll be working on this for a year before you reach a decent quality. Once you've accepted that you'll find it much easier to strive for perfection. I hope you'll find this useful and I'll definitely return to this thread (in the critique section, where it should be).</p>
      <p>I can't really help you on the copyright question. I suggest you make a new thread for that. This typeface is also called Camille: <a href="http://www.font-zone.com/download.php?fid=457" title="http://www.font-zone.com/download.php?fid=457">http://www.font-zone.com/download.php?fid=457</a><br>
      Naming typefaces is a pain in the ass, I know.</p>
      <p>Cheers! Jasper</p>
