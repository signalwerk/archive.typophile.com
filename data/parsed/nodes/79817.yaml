      <p><cite>copying glyphs out of someone else's proprietary font, making minor changes, and presenting them as your own work is never okay</cite><br>
      As Martin and hrant noticed, I never altered Minion. My work ended up being a thorough study, and focalized in Minion. Stared, compared, tried, failed, tried, failed. I learned a lot, I don't regret having worked in that manner. What was really nonsense was the idea of releasing it. I blindly turned my study into the "knock-off" it finally became.</p>
      <p>I encourage the analysis of different typefaces, and agree with hrant, that if you ever plan to do a typeface (not a study), it is very important focusing on genres, rather than selecting what you think that is the "best representative".</p>
