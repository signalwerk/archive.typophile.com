    html: |-
      <p>Looking quite good.<br>
      It would be helpful to see settings that combined regular, italic, bold, and bold italic on the same line. Each has a rather different flavor to me, so I'm curious to see how they work together.</p>
      <p>Most or all of these are merely opinions to be taken or left as you wish:<br>
      The hook of roman /f/ hangs out pretty far (does that alternate rein it in a bit? what is your thinking on that?).<br>
      The tittles are both a bit too small and too low, at least in the regular roman.<br>
      The regular /x/ is fun but seems like it intersects too high. It looks to me like the / stroke could just use more slant.<br>
      The top of regular /t/ could be raised a touch, and/or the crossbar lowered a touch.<br>
      Is the regular comma/apostrophe shape a little too curly?<br>
      What a handsome pilcrow!<br>
      I don't think that fï ligature works. And to be honest, I'm not sold on any of the discretionary ligatures except maybe the more traditional /ct/sp/st/. Those longer tail alternates of /R/K/Q/ do work well, though.<br>
      Italic /y/ is fun, but maybe not quite there yet. Could it use a little more weight in the descender? The dagger-like italic /f/ is also cool.<br>
      This is really impressive stuff.</p>
