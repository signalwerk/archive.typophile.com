      <p>I have read that review. I tend to agree with you there but then you're not blowing anything out of context in that review.</p>
      <p>My main question now is how come type hasn't evolved since like Legato since Legato. Honestly, now that I find myself looking at and talking about more often I would love to do a typeface like it and especially a serif one, but I still think it's more of an aesthetic design than something which truly brings type to another level. I quite agree with William here:</p>
      <p>&gt; I don't see Legato as a significant breakthrough for the future of type design.<br>
      &gt; Note for a start that Bloemsma's theory of Legato is not Hrant's theory. Bloemsma<br>
      &gt; was concerned to get 'flow' from one letter forward to the next, and correct the<br>
      &gt; tendency of Roman letters to turn into a picket fence--which is indeed a real and<br>
      &gt; important problem.</p>
      <p>There have been several typefaces tackling various specific problems. I don't feel like Legato solves all problems, or a single one problem tremendously better than before.</p>
      <p>&gt; However: is there a single Sans font that can take<br>
      &gt; most of the credit?<br>
      Not to the extent that Gutenburg's work was revolutionary, no. But that's exactly my point. I don't think Legato could get much credit given the time and context in which it was designed in. Baskerville was ahead of its time, and the design of the grotesque itself was. I'm convinced Legato isn't going to make that kind of impact. For starters, you're about the only one I hear talking about it; I hear more from Museo for example. A Legato genre however could be very significant, but until that happens I don't care about Legato as much as you do. It's perhaps comparable to running into the LHC, accelerate and smash particles into each other one time and then come screaming out of the building you just discovered new physics. No, you didn't; Smash those particles another billions of times so it gains statistical significance. Equally, Legato alone does nothing more than impress people with its design, but doesn't win people over to adapt this method. Not yet anyway.</p>
      <p>Another thing which both annoys and amuses me about Legato though is no matter how divine you think it is, at body text size you don't observe the stroke modulations anymore; you might as well have used an other typeface which battles the fencing effect for the body text.</p>
      <p>&gt; However: is there a single Sans font that can take most of the credit?<br>
      Not to the extent you're giving credit to Legato, I don't think. However, there are several sans which in my mind are incredibly refreshing (as is Legato) but not revolutionary. As I tried to explain with the LHC analogy, we need more experimentation and more typefaces like Legato to make it a revolutionary genre. Legato alone doesn't do it. Perhaps it would if it had optical variants with a more severe modulation effect in the body text variant, but would that really give it that extra push? I think it's brilliant theory which works in a much more vague and subjective sense in practice.</p>
      <p>&gt; So, if we do choose to focus on individual typefaces, exactly<br>
      &gt; what font is more significant, culturally? Ideal Sans?<br>
      I don't find Ideal Sans to be culturally significant. Perhaps Gotham to some extent but that's only due to its use in the presidential campaign and not because of Gotham's design (pretty much the same case with Helvetica). A typeface I thought was about equally "revolutionary" to Legato is Calluna. Since Calluna there have been a few typefaces with the same directional serifs but it didn't exactly impact the type design community in a big way other than to appreciate the refreshing new detail in the serif base. Equally, Legato might be forgotten if you weren't here to mention it so often.</p>
      <p>&gt; All that said, nobody should think in terms of THE or "perfect".<br>
      I agree, and that was my initial objection against your statement about Legato. Legato certainly helps modern type evolve, but to say it's revolutionary is an overstatement.</p>
    html_clean: |-
