    html: <p><i>relativism is a way of thinking with doubt</i> <br> <br>and accepting that sometimes different things can be correct or true or right at the same time.  <br> <br>This is not a license to do whatever you like, William, and linking relativism with nazism is a cheap ploy. It's been done before and the only thing it has going for it is that it covers up a weak argument very nicely. The nazis used words like 'science' and 'truth' a hell of a lot while they were up to their necks in blood. <br> <br>And as for the search for truth, we build our own analytical tools inside the system we are trying to analyse, invent our own notation system to work whatever results we manage to glean into something coherent in our own eyes and we call the result 'reality'.  <br> <br>Truth in a courtroom or in politics? That's exactly where you'll find it, defined in a way that suits those in power (the ones that pay the scientists). <br> <br>Try and search for truth without language and see how far you get, William.</p>
