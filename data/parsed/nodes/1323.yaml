  - id: 10537
    user: 1250
    date: 2003-09-13T09:32:00
    date_raw: 13 Sep 2003 — 9:32am
    votes: null
    html: "<p>The basics (of which this subtopic is part) are really pretty simple once you have the model in your head. <br> <br>&gt; the olny thnig thta's iopmrantt is that the frsit and lsat ltteer of eevry word <br> <br>This is for example is a severe over-simplification. Reading is not an all-or-nothing deal, it's heuristic. There are levels of certainty, and the more proficient the reader the tighter the thresholds are. That's for example why typos can be glossed over successfully. These levels arise from the interaction -at different priorities- of things like bouma envolopes, semantic context, individual letters, etc. <br> <br>Certainly a word where all the middle letters are x-height is more easily read jumbled than one with a single \"f\" in it for example. BUT my point here is that the <i>favoring</i> of the first and last letters -irrespective of what's in the middle- supports my theory. <br> <br>Part of my theory is that the external envelope (what I sometimes call silhouette - but I've realized that could be misleading because a silhouette can have holes while an envolope can't) of a bouma is more important than the insides. The insides are generally only used in a fallback mechanism. Bouma's findings* as well as this finding (assuming it does show what we think it's showing) support this aspect of my theory very well. <br> <br>* See his papers: \"Visual word recognition of three-letter words as derived from the recognition of the constituent letters\", co-authored with Bouwhuis; and \"Visual Interference in the Parafoveal recognition of initial and final letters\". <br> <br>Context: of course it's very important, but it clearly doesn't explain the favoring of the first and last letters. That's the clue here. <br> <br>hhp <br></p>"
    html_clean: "<p>The basics (of which this subtopic is part) are really pretty simple once you have the model in your head. <br> <br>&gt; the olny thnig thta's iopmrantt is that the frsit and lsat ltteer of eevry word <br> <br>This is for example is a severe over-simplification. Reading is not an all-or-nothing deal, it's heuristic. There are levels of certainty, and the more proficient the reader the tighter the thresholds are. That's for example why typos can be glossed over successfully. These levels arise from the interaction -at different priorities- of things like bouma envolopes, semantic context, individual letters, etc. <br> <br>Certainly a word where all the middle letters are x-height is more easily read jumbled than one with a single \"f\" in it for example. BUT my point here is that the <i>favoring</i> of the first and last letters -irrespective of what's in the middle- supports my theory. <br> <br>Part of my theory is that the external envelope (what I sometimes call silhouette - but I've realized that could be misleading because a silhouette can have holes while an envolope can't) of a bouma is more important than the insides. The insides are generally only used in a fallback mechanism. Bouma's findings* as well as this finding (assuming it does show what we think it's showing) support this aspect of my theory very well. <br> <br>* See his papers: \"Visual word recognition of three-letter words as derived from the recognition of the constituent letters\", co-authored with Bouwhuis; and \"Visual Interference in the Parafoveal recognition of initial and final letters\". <br> <br>Context: of course it's very important, but it clearly doesn't explain the favoring of the first and last letters. That's the clue here. <br> <br>hhp <br></p>"
