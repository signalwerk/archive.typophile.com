    html: <p>The procedures inbedded in the brain, some of which are described in the book noted by Paul, are evidently heuristic in the correct sense. Normally they lead to a rapid and definite, though sometimes mistaken diciphering of a word. The procedures can also fail to come to a definite conclusion also, as when we fail to dicipher a piece of handwriting. <br> <br>Both the mistakes of normal and dyslexic readers I think would be important clues to what the heuristic rules are that are imbedded in our brain. On the positive side, our ability to read mixed up words, as noted in this thread, is also an important clue.  </p>
