    html: <p>I think you're jumping to conclusions, Hrant, because another explanation for the study results is that we see collections of individual letters and know that those collections only occur in particular words, informed by context. So I see pttaoo, and rather than seeing a bouma shape defined by the p and o and some intervening rounds and a couple of pointy bits, I see a p, two t's, an a and two o's, and I know that collection of letters only occurs in potato. This is very much easier if the context is such that I'm expecting to see 'potato' in the text. <br> <br>Note that I'm not saying that this is true -- I really don't know, any more than you do -- I'm just pointing out that there is more than one explanation for the test results as reported (we have not actually seen them yet).</p>
