    html: "<p>&gt;heuristics is based on not getting definite answers  <br> <br>I think you are misunderstanding heuristics, at least as conceived by Polya. Heuristics are a series of questions that are guidelines to problem-solving. The answers can be very definite. The difference is that there is a creative gap between question and answer, which can involve a lot of trial and error. In an algorithm, it is a completely set and pre-defined process. <br> <br>&gt;a textbook failing of contemporary Western science. <br> <br>Hrant, You misunderstand the nature of scientific method. The 'exceptions' are key tests of general theories, which must cover all cases. Jonathan Swift, author of Gullivers Travels, similarly said that 'natural philosophy' should be called 'unnatural philosophy' because it dealt with such weird stuff. He didn't understand it either.  <br> <br>Weird stuff such as electricity and magnetism proved a key to understanding universal principles, and to such technological breakthroughs as the computers and networks we are communicating through.  <br> <br>In the case of reading, understanding dyslexia as a test case will, I suspect, be a key to understanding the general normal processes.  <br> <br>Incidentally, G Noordzij in 'Letterletter' claims that he was able to cure dyslexic children by training them to be aware of the difference in white spaces between the letters.    <br> <br>If you want to understand scientific method better, I recommend 'Conjectures and Refutations' by Karl Popper (under whom I did my PhD in history and philosophy of science.) For one piece of the electricity and magnetism story you can read my own 'Fields of Force: The Development of A World View from Faraday to Einstein.' --Set in van Krimpen's Spectrum! </p>"
