    html: "<p>A term is only useful to the extent it represents something in reality accurately. The way William is using the term might be what the inventor of the word intended, it might even be the way a dictionary defines it (although dictionaries are very good at destroying subtlety) but to me it's simply not the way the brain works. The way the human brain works (as far I as believe - but that's always an automatic disclaimer for everybody at any time) is fundamentally different than the way a computer algorithm works in that it doesn't care to arrive at a \"correct\" answer - it only cares to move on to the next problem with sufficient certainty. Controlling the type and amount of <i>mistakes</i> is integral to this, whereas an algorithm cannot accomodate mistakes. It's really a very simple distinction, but a lot of people have a problem with it because it undermines the entire premise behind western science. If you think a human thinks algorithmically like a computer, you need some serious debriefing. <br> <br>My problem with western science -the way I see it as starting from Rome, as a qualitative if subtle break from Greece- is simply that it's too inward-looking, too concerned with the <i>algorithmic</i> results. As a result, it will only go for example from an understanding of dyslexia to one of normal reading by circumstance, not naturally. This is -again- the opposite of the what I might tentatively call the Ancient Way. So the problem with the western study of \"exceptions\" is that -in practice- the whole point is as a rule made secondary. Just like TV: theoretically very useful to culture, but in practice a tool for brainwashing and making the rich richer. Why do you think indifferent philanthropy is now gone, replaced by large corporations funding university research? Because it's better for the economy. The whole system is decrepit. <br> <br>But to be fair, I guess I had a too-strong reaction to William's \"superior\". The West is not superior, not by a long shot. It's not how far you can launch a satellite, it's what you do with it. The West is in fact destroying the world; converting culture to cash, at increasing low rates. <br> <br>hhp <br></p>"
