    html: "<p>\"And so to completely analyze what we do when we read would almost be the acme of a psychologist's achievements, for it would be to describe very many of the most intricate workings of the human mind, as well as to unravel the tangled story of the most remarkable specific performance that civilization has learned in all its history.\" <br>- E B Huey <br> <br>Reading will never be completely understood, because of <br>a simple tautology: a system can never understand itself. <br> <br>&gt; heuristics as a series of structured questions <br> <br>I think heuristics is based on <i>not</i> getting definite answers - the opposite of what an algorithm is about. Human reading is all about mushy, dynamic thresholds, it's about making the right amount of mistakes. That's why an algorithm will never fail to get tripped up by typos, while a good human reader will assimilate and gloss over them. <br> <br>&gt; Might help understand dylexia. <br> <br>A lot of effort goes into understanding and treating \"exceptions\" such as dyslexia. It's a shame, when we are still so far -and in some ways getting further- from understanding the main rules! This is a textbook failing of contemporary Western science. The Romans threw away all the masterful subtlety the Greeks had so nicely compiled form the <i>truly</i> ancient cultures. <br> <br>hhp <br></p>"
