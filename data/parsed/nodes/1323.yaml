    html: <p>&gt;The human brain may be more mysterious,  <br>but I would hypothesize that it's similar. <br> <br>I think that relatively simple algorithms will turn out to be part of the story, but only part. In a comparison, I don't think linguists have been able to characterize the syntax that every native English speaker knows intuitively, though they can get some of it.  <br> <br>The reading problem should be much simpler, I would think. <br> <br>&gt;No, heuristics is diametrically opposed to algorithmics.  <br> <br>I don't think this is accurate. George Polya, the Hungarian mathematician who pioneered heuristics and may have coined the term in this sense, had heuristics as a series of structured questions. The difference with algorithms is that they normally come to a definite conclusion (loops are possible, as in programming failures.) <br> <br>Polya's 'How to Solve It' is the source. <br> <br>I suspect that if and when the science is understood, there will be a pretty wide latitude for personal expression with little difference in readiblity.    <br> <br>What is interesting about the scrambling is that it does seem to be a way to test hypotheses about the algorithms for disciphering words. Might help understand dylexia.  <br></p>
