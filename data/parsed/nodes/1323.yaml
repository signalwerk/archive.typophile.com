    date_raw: 15 Sep 2003 — 8:07am
    votes: null
    html: <p>I don't know Bouma's theories, but these interesting examples I think refute the idea that the external profile of the whole word is the overriding factor in readability. The internal part of the profile is radically changed, and it is still readable. <br> <br>I notice that in some cases the second letter being out of place also has a bigger affect on readability. It is interesting that the algorithm for spell checkers seem to act the same way; if you've got the first two letters right, they can guess the rest better than if everything else is right, and the first two messed up.  <br> <br>There is clearly some kind of mental heuristic system going on, as Hrant says, but it seems to me that the legibility of the internal parts of the first and last letters are likely an important part of the heuristic, and not simply the external profile.  <br> <br>The first and last letters being particularly important also means that making both the left and right halves of the letter easily distinguishable from other letters may be important to readability.  <br> <br>If no one has studied this phenomenon, I think there is a lot to learn from it.    </p>
