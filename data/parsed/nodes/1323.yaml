    html: <p>&gt;What reality 'is' depends on what language you are speaking <br> <br>No, the whole notion of reality is that it is not language dependent. Our certainty about what is real is another matter. We are never sure we are right, and in fact we often err, but that is another matter.  <br> <br>If I say 'I have three children' or 'J'ai trois enfants' or 'Ich habe drei Kinder' or 'Wo you san haizi' or 'Yesh li shalosha banim' it doesn't change the reality. I do have three children. I may of course be wrong. There may be an extra kid I don't know about from an old girl friend, but the reality is what it is.  <br> <br>And when a person swears before a court that he or she promises to 'tell the whole truth and nothing but the truth' we know what is meant - even if there is a translator involved.  <br> <br>The whole effort to deny these obvious facts, a move influenced by Husserl, is destructive. It is Husserl in fact who wanted certainty, and thought he could get to it by only describing perception, and 'bracketed' the question of whether it corresponded to reality. <br> <br>The rottenness of this move becomes evident when we consider the SEARCH for truth, whether it is in science, the courtroom or politics. There truth - correspondence to reality - becomes a regulative idea (as noted by Kant) without which, for example, contradictions are not a problem.  <br> <br>It is this abandonment of the critical tradition (a tradition started especially by Socrates) which is the poison in philosophical relativism and idealism. Heidigger's support of Naziism and Sartre's support of Stalin are indicators of the evils that relativism can be used to support - because, having denied one reality, evidence doesn't matter, and you are left with only irrational commitment, and one commitment is as good as another.  <br> <br>The fact that relativism is fashionable in the humanities, particularly on the European continent, does not make it any less odious or misguided.  <br> <br>I don't think this has a lot to do with type, but since it has repeatedly come up on this board (I avoided comment before), I have commented.  <br> <br></p>
