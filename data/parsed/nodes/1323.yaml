    html: <p>The word 'heuristic' according to the dictionaries I have checked comes from the Greek 'heurisko' (sorry for the roman letters) meaning 'find'. Anything that is an aid to discovery can be called heuristic. Heuristic procedures may lead to definite answers, or not, as the case may be. For example, in the computer context it means, according to the Concise Oxford Dictionary (1990 edition) "proceeding to a solution by trial and error."  <br> <br>Thus Hrant's understanding that "heuristics is based on not getting definite answers" is mistaken.   <br> <br>Guillaume's usage is also accurate in English.  <br> <br>Another dictionary dates the usage of the word(in German) to 1821. <br>  <br> <br></p>
