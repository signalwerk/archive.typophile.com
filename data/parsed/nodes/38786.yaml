    <p>Help!</p>
    <p>I lost my “proper” job through redundancy what seems like aeons ago, and I’ve been freelancing as a graphic designer ever since.</p>
    <p>But six years down the line, I decided I’d had enough of sitting in my pants with Radio4 and the cat as company and strove towards a stable environment full of them “people” things.</p>
    <p>I start tomorrow. (Yay!)</p>
    <p>I am terrified. (Boo!)</p>
    <p>It’s like first day of school all over again. I’m thirty-cough and very aware I’m the new boy.</p>
    <p>Any advice from you lot as to nerves/first steps/just being in an office again would be greatly appreciated. I’m filling a new role which is apparently vital and will spend an awful lot of time doing stuff for the development/techy lot.</p>
    <p>It’s Sunday night. I’ve left it awfully late to ask for ideas.</p>
    <p>s</p>
