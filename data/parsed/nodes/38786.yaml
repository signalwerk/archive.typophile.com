    html: |-
      <p>(at the risk of sounding like a human resources consultant, which I’m not...)</p>
      <p>Be open-minded and ask a lot of questions. Find out why things are done the way they are before suggesting improvements. (Once you’ve got the lay of the land, of course, use your fresh point of view and the tricks you’ve picked up as a solo artist to help make things more efficient.) Be specific in your communication with tech folks — they’re so used to vague information from designers and users that detailed, technologically aware feedback will make them your allies for life.</p>
