      <p>I’ve been there, and I’d say prepare yourself for small talk about the “real world” from the cubicle habitat.  I’ve regretted giving too much of my personal story to new office-mates. You don’t want the the office scurge to know you share a hobby, or even worse - that you’re single!</p>
      <p>I try and point questions back at the questioner as much as possible, until you figure out the office politics. People love talking about themselves, so it’s not too hard.  Then, you can pick your own confidants and mentors.</p>
      <p>Oh, and please, don’t use kitten pictures on your desktop. Or drink the last drop of coffee without making new — I usually bring in a pound of my own overpriced-but-yummy gourmet blend on the second or third day and put a sticky “help yourself” on it.</p>
      <p>Good Luck!<br>
      AK</p>
      <p>PS Definitely the British version!</p>
