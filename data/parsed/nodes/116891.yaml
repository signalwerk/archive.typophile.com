      <p>Top two lines are Tudor Black, which was a very popular neo-Gothic revival. A staple with most foundries, it was used well into the 20th century. Jazzed up version with inline treatment by Nick Curtis as Fordor Incised NF <a href="http://www.myfonts.com/fonts/nicksfonts/fordor-incised-nf/" title="http://www.myfonts.com/fonts/nicksfonts/fordor-incised-nf/">http://www.myfonts.com/fonts/nicksfonts/fordor-incised-nf/</a><br>
      Don</p>
