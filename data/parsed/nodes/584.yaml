  html: "<p>FWIW, you can try using pfaedit for free on Mac OS X. (It makes Unicode/OTF files among others. Load a Type 1 font and Save As an OTF. A simple conversion.)  <br> <br>Goto Source Forge to download and install XonX. <a href=\"http://sourceforge.net/projects/xonx/\" target=\"_top\">http://sourceforge.net/projects/xonx/</a> <br>Download pfaedit and unpack. <a href=\"http://pfaedit.sourceforge.net/index.html\" target=\"_top\">http://pfaedit.sourceforge.net/index.html</a> <br>Drag the pfaedit directory to the Applications directory. <br>Start XDarwin (XonX). <br>In an X terminal window (not an OS X terminal window) type pfaedit and you're in business. <br> <br>pfaedit seems very solid, but the Aqua-XonX combo is rather tetchy. <br> <br>OroborOSX makes a nice window manager to go with X Darwin: <a href=\"http://oroborosx.sourceforge.net/\" target=\"_top\">http://oroborosx.sourceforge.net/</a> <br> <br>pfaedit is basically a Unix/Linux X11 app, but there is also a cygwin version that can be used under Windows. Installation instructions for both Mac OS X and Windows are available on the pfaedit home page:</p>"
  html_clean: "<p>FWIW, you can try using pfaedit for free on Mac OS X. (It makes Unicode/OTF files among others. Load a Type 1 font and Save As an OTF. A simple conversion.)  <br> <br>Goto Source Forge to download and install XonX. <a href=\"http://sourceforge.net/projects/xonx/\" target=\"_top\" class=\"link-external\">http://sourceforge.net/projects/xonx/</a> <br>Download pfaedit and unpack. <a href=\"http://pfaedit.sourceforge.net/index.html\" target=\"_top\" class=\"link-external\">http://pfaedit.sourceforge.net/index.html</a> <br>Drag the pfaedit directory to the Applications directory. <br>Start XDarwin (XonX). <br>In an X terminal window (not an OS X terminal window) type pfaedit and you're in business. <br> <br>pfaedit seems very solid, but the Aqua-XonX combo is rather tetchy. <br> <br>OroborOSX makes a nice window manager to go with X Darwin: <a href=\"http://oroborosx.sourceforge.net/\" target=\"_top\" class=\"link-external\">http://oroborosx.sourceforge.net/</a> <br> <br>pfaedit is basically a Unix/Linux X11 app, but there is also a cygwin version that can be used under Windows. Installation instructions for both Mac OS X and Windows are available on the pfaedit home page:</p>"
