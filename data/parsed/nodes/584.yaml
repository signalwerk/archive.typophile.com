    html: "<p> It makes me worry because a lot of stuff is designed around the 4:3 aspect ratio in general, and certain screen resolutions in particular. Like when I make a Director movie that takes over the screen, I don't want an unpredictable/ungainly border around it. <br> <br>Apple had its own resolutions for a while, but then they sensibly started conforming to the Windows sizes (except for that funky 1152 thing), but now they do this... The thing is, it's not just Apple: I was recently pricing different configurations of a Compaq laptop, and the options went 1024, 1440, 1600 - no 1280, which is such a nice resolution for a 15\" LCD. I think LCD manufacturers are targeting DVD playback, and the computer manufacturers have to go along to maintain good pricing. <br> <br>hhp </p>"
