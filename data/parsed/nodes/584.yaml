    html: "<p> Floating-Point Unit, or a chip (or part of a chip) that does (relatively) complex math in hardware, for speed (usually between a factor of 4 and 10, but can go up to like 30 for transcendental stuff). Before Motorola's PowerPC and Intel's Pentium, FPUs were separate (like the 68882 - man, I miss that chip), so software didn't assume you had an FPU, or had a special version for FPUs. The problem is that FPU instructions are specific to the FPU, so for example something written for the 68882 won't work on the PPC, which is why you use the non-FPU version, which won't be as fast as native PPC math, but like one of my CompSci teachers once said about a contract competition he had won: \"Hey, my code would be faster too if it didn't need to work.\" <br> <br>hhp </p>"
