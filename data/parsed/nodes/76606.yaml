    html: |-
      <p>As a plan, it's a decent layout. But you clearly need a lot more practice in drawing attractive curves from scratch. Here's what I think are your best curves:<br>
      The connection from N to &amp;.<br>
      The third loop from the right, and the arcs connecting it to its neighbors.<br>
      The loop just above the N (though composition-wise, it may be too close to the N).<br>
      In the monogram, the loop just under the right side of the M.<br>
      The rest are hard to rank, sinking into the category of "oh dear."</p>
      <p>The most important thing, though, is that your thins are <em>much</em> too thin. Swashes need to harmonize with what they're connected to. So look at the lightest connecting strokes in the Hoefler Text Italics, such as between the t's or inside the u, and never let a stroke get much lighter than that. (And, heh, sorry, I'm picturing the look on a screen-printer's face when you say, "oh yes, this one is for when printing problems arise" and you give him a design which, at five inches tall, contains strokes literally as thin as a human hair.)</p>
      <p>Some kind of regularity or consistency in the loops is called for. Pick a point, not necessarily the center, and make sure the axis, from crossing to tip, of each of the loops in a row is pointing to it, like one-point perspective. Perhaps, since there's room above "Mutton", the loops could get progressively larger from left to right. That would have something of the look of a cornucopia, which is appropriate for a restaurant.</p>
