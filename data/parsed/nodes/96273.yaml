      <p>Kerning is waaay too tight.<br>
      All descenders are chopped off - is this intentional?<br>
      The choppiness can be minimized by doing two things:<br>
      1. In Fontlab, while editting a glyph, hit Ctrl+A, right click &gt; Hints &gt; Autohinting<br>
      that should improve on-screen quality<br>
      2. Select a proper anti-aliasing mode in PS/Illu in the Character window (usually crisp or sharp works best)</p>
