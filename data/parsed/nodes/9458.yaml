  html: <p>O.k., i really dont have much of an idea what to do.  I have made a font (in 4 weights) and am in the process of making others.  They are not amazing, but they are my first so i suppose that's o.k. <br> <br>I am wondering, when i get my website set up...how do i get a 'license' or whatever i need to be able to sell my fonts, and generally what do i need altogether, so i have 'ownership' of the fonts, (or what all the other companys have) <br> <br>at the moment i just have fonts on my computer, but when i get some good started and finished, i would like to be able to sell them...i need to know everything involved, please. <br> <br>(by the way i'm only 15, would that be any trouble?) <br> <br>i did look around the forum for about 15 minutes, but couldn't find a relevant topic to exactly what i need, i may just be blind though</p>
