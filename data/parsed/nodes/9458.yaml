    html: "<p>I don't know if it's different in the UK, but over here in the US if you made it, it's yours. You can sell it any which way you choose: through a credit-card setup on your site, by licensing it through a font house (like MyFonts; but then you lose some rights/money), or even eBay I guess! You do have to pay taxes on sales (unless your total income is too small to qualify); and you might need a business license, but over here at least you can get away without that - or at most you should do a Doing-Business-As \"ficticious business name\" setup (costs around $75 or something). Maybe your best bet is to simply walk into your town/county offices and ask them what your laws are. Or a Brit Typophiler can assist you with the details. <br> <br>hhp</p>"
