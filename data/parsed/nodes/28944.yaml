      <p>i know both threads, but forgot about searching them for book references, thanks. i found a 2-volume Deberny &amp; Peignot specimen book from 1922. i made copies of the interesting faces, but i dont have a scanner. if im able to get a scanner from my school i'll put them on typophile.</p>
      <p>i found an extra-bold weight of VAG rounded (a specimen book by niggli in 1990, but i have never seen it in digital form). some reprints of original jenson-type, and maaaany strange grotesques. im happyyyyy ;)</p>
