      <p>We used to do this thing with smooth flat rocks. "cut the devil's throat". The object was to throw a stone as high and far as you could, but it has to hit the water without a splash. You'd watch the rock sail through the air in a smooth, predictable arc. Spinning, it turned on its side and would drop quickly, piercing the surface with the merest "thp" and hardly a ripple and be gone. As if from the face of the earth. Which in a way, it was. The fall to the deep and murky bottom of the lake was out of sight and mind. Like everything else down there. </p>
      <p>-=®=-</p>
