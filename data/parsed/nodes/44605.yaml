      <p>I will tell you a water story: I was at Echo Park Lake and I saw a dead duck floating in the lake. There were no ripples coming from it. Then I walked over to the bridge and I saw a duck sleeping. There were ripples. My conclusion: that's how life is, while we're alive we generate endless ripples, once we pass those ripples begin to subside.</p>
      <p>Ducks bob on liquid glass.</p>
      <p>pbc</p>
