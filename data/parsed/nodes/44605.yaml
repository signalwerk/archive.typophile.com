      <p>You might look at the elemental aspects. It is changeable like air in that it can conform to any shape or space. It can also be solid like earth as in a tsunami or a fast impact against the surface of water. It is cooling, as mentioned above. It is the nemesis of fire, able to mix with earth and air.</p>
      <p>You might look at the physics of it in that it has three very common states—gas, liquid and solid.</p>
      <p>I believe the Chinese represent it as two solid lines with a dashed line between, as a river might create a barier of motion that separates masses on land.</p>
      <p>Not to be too crunchy, but these are very old ideas.</p>
      <p>I took a canyoneering trek through the virgin river narrows one time. Spent about 48 hours floating or walking through a river with vertical canyon walls on either side. Two German tourists died a month before on the same route as a flash flood came through and essentially obliterated them. Nothing was ever found. That gave me a real sense for the absolute force of water.</p>
