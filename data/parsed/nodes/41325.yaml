    <p>Jan Maack (1968) is a graphic designer and type designer from Denmark. He has worked as an art director and graphic designer for 17 years, mainly designing logos, corporate identity systems, and packaging. Jan won a number of prizes for his work, was jury member for The New York Festivals Print 2006 and is member of The Association of Danish Designers.</p>
