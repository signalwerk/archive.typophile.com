    <p>Well, we were aiming to get this released yesterday, June 17, which was Bill Berkson’s birthday. We missed by one day.</p>
    <p>Hot off the press: <a href="http://www.fontbureau.com/fonts/WilliamsCaslonText" rel="nofollow">Williams Caslon</a> has just been released for retail license by the Font Bureau.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WmsCaslon-bday_4369.gif"></div><p></p>
    <p>&nbsp;<br>
    A belated happy birthday, Bill!</p>
