      <p>&gt; probably no more than ten pages...<br>
      &gt; I was thinking saddle-stitch</p>
      <p>Perhaps you already know this, but you can't have a 10-page saddle-stitched piece.  Must be in multiples of 4.</p>
      <p>2 sheets of paper folded and saddle-stitched become 8 pages, 3 sheets become 12, and so forth.</p>
