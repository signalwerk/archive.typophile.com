    html: "<p>\"Small-ish\" is a rather imprecise term. Practically speaking, something like 5\"×8½\"—or half a standard letter-size sheet—would be easy and cheap to produce: three sheets for the content and one for the cover. I offered a 5\" width to solve your creep  problem: simply face-trim the book to the 5\" width after it's assembled and there's no worry about having your slip showing.</p>"
