      <blockquote><p>&gt; Can gsm be converted in to millimeters of thickness?</p></blockquote>
      <p>Not directly. The bulk of paper will depend as much upon the density of the fibers, not just the weight. You’d need to get your printer or paper supplier to provide the caliper or ppi specs for your particular sheet.</p>
      <p>But since this is a student project, and probably a one-off, Bert’s suggestion is probably easiest: trial and error ;-)</p>
