    <p>Hi there! Print design has always been a mystery to me, but I've finally resolved to learn. Hopefully someone here can help me out.</p>
    <p>At the moment I'm creating a small-ish booklet as a student project, probably no more than ten pages or so (possibly less). I'm hoping to create a cover that wraps all the way around similar fashion to <a class="freelinking external" href="http://www.printingtips.com/print-term/t--2561/wrap-around.asp" rel="nofollow">this</a>, but first I have a few questions. Is this technique possible and does it have a technical name other than a 'wrap-around cover'? If it is possible, how best to bind the pages (I was thinking saddle-stitch for so few pages)? Also, how do I allow for the thickness of the pages as the cover wraps around? Can gsm be converted in to millimeters of thickness?</p>
    <p>Finally if you have any resources you'd recommend for someone new to printing techniques, I'd be glad to hear them! They'd be a great help.</p>
    <p>Thanks!</p>
