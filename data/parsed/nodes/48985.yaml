      <p>So here’s the thing...</p>
      <p>You have text at a specific size and you want it to be as non-poo-like as possible. The ’possible’ part may be constrained by non-typographic considerations — resources and time, technological limitations — compromising typographic quality. If there are no constraints, then the obvious way to make non-poo size-x text is to have a dedicated size-x font with appropriately designed outlines, spacing, kerning etc. Let’s be clear that this is the proper solution and <em>anything</em> else is a compromise. Interpolation is a compromise. Tracking is a compromise. Variant metrics is a compromise. The compromises are on a continuum between poo and non-poo. As Bill points out, variant metrics would be better than tracking: it would be further from poo, closer to non-poo.</p>
      <p>But the compromises are subject to the same non-typographic considerations and constraints as the ideal: resources and time and technological limitations. The closer the compromises get to non-poo — i.e. the fewer typographic compromises they entail — the more resources and time they are likely to require, and eventually they become essentially indistinguishable, in terms of cost, from the ideal, non-poo solution. At that point, such compromises simply are not worth spending time on: better to spend one’s time making those size-x specific fonts. On the other end of the scale, there are compromises that are so close to poo that they, too, are not worth spending time on. We don’t want to be in the business of making almost-poo.</p>
      <p>The question then, is whether there are in fact compromises somewhere in the middle of the continuum that are sufficiently non-poo-like to be worth doing and sufficiently cheap, in terms of resources and time to be viable. And I’m not convinced that the answer is yes, although if I had to pick a technology that came close it would be TT variations.</p>
      <p>Basically, I’ve come to the conclusion that the compromises are all a waste of resources and time because, ultimately, the results are not satisfying, and in order to become more satisfying they need to become more complex, and will eventually become technically more complex than making size-x specific fonts would be. We’ll know we’ve reached this point when designers are making size-x specific fonts and then processing them to fit them into the compromise technology. We may already have reached this point.</p>
      <p>The answer is not new font formats or extensions of font formats. The answer is font development tools that make it viable for designers to produce size-x specific fonts, i.e. that reduce the cost in resources and time of doing it properly. Letterror’s Superpolator and Tim Ahren’s RMX tools strike me as the most significant advances.</p>
