      <p>Quark’s tracking table Xtension has been doing this since 1989 (version 2.1).<br>
      Typically, if using a face throughout a publication, one would set the table to decrease tracking the larger the type size became.<br>
      I don’t recall ever adding tracking for small sizes.</p>
      <p>As Ralf notes, probably best to have it in the application, rather than the font.<br>
      Also, the user can kern display and text versions of a type differently with the XPress Kern Table Editor.</p>
