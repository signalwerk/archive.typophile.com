      <p>One of the misapprehensions here is that tracking can ever be a substitute for variable metrics. It can’t. As you go up and down the size scale, different letters will be spaced proportionately differently. At 6 points you might need proportionately more spacing around l shapes and less around o shapes — or vice versa. It  depends on numerous factors. Tracking is only the crudest possible solution. </p>
      <p>I love it that there is someone here who genuinely believes that fired people really just left to spend more time with ... their families. Who am I to be cynical?</p>
      <p>Meantime, MM still works.</p>
      <p>It’s painful to hear David break taboo about the janitorial class in type. I would like to say that I don’t have anything against janitors, and never have had. Love ’em.</p>
