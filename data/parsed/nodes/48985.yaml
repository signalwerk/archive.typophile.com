    html: |-
      <p>David,</p>
      <p>Is it possible to ammend or extend the OpenType specification (and MS Volt) to support a different character width per point size, or at least to substitute a different character width when a typeface’s point size is greater than a certain number?</p>
      <p>Or must we we wait for yet another typeface specification, like OpenType II, to have this?</p>
      <p>===</p>
      <p>I know that in Latin languages, this is useful for the M and N in the very least, and in Hebrew for the Shin in the very least; I’m certain that in other character sets this is needed as well.</p>
      <p>At Lintotype of Hauppauge’s Type Department, I was shown print samples of metal type typeface designs that had different character widths and slightly different designs at different point sizes. When I created a set of Linotype-like Hebrew type designs for the standard FrankReuhl typeface design, I inspected print samples of that typeface design at different point sizes. I found that each letter form had interesting design differences, created to be used at different point sizes.</p>
      <p>Hence, it is clear then this is an essential feature of a typeface design, and something that should not be lost for convenience sake. Variable character widths and designs that are point specific should be incorporated into this or the next typeface standard like OpenType.</p>
