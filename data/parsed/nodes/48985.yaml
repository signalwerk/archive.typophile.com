      <p>There are three issues here:</p>
      <p>1. The increase or decrease of spacing between the letters, known as tracking;</p>
      <p>2. The widths of a character’s design;</p>
      <p>3. The actual design of the letter.</p>
      <p>The first factor, a typeface’s tracking, affects all the letters of a typeface across the board equally.</p>
      <p>The second factor only affects the widths of those letters which the designer intends to be different at different point sizes.</p>
      <p>The third factor only affects the design shapes of those letters which the designer intends to be different at different point sizes.</p>
      <p>For example, if I was typesetting the phrase “time in a bottle”, and I created a typeface with these variable widths, then at very small type sizes, the shape of the “m” (and perhaps “n”) would have the horizontal strokes spaced further apart to increase its legibility and prevents ink spread on certain paper kinds, and the kerning between the two “t”s and the “l” of “bottle” (in kerning, there is no end, so I will not cite the other combinations where this would be helpful) needs also to be increased.</p>
      <p>At large type sizes, I might seek the opposite to occur: the strokes of the “m” should be closer together to minimize the unnecessary while space. Similarly, the extra space between the letters “t” and “t”, and “t” and “l”, would be decreased. Perhaps, I would make a three letter ligature with equal distances between the horizontal strokes of the t, t, and l, and join the first two letters, but not the “t” and “l”.</p>
