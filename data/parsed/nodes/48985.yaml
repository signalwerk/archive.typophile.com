  html: |-
    <p>Has anyone ever created or proposed a font format that allows metrics to vary with size? For example, a face might need more interletter spacing at small sizes and less at large sizes. So why not create a font that automatically increases or decreases interletter spacing by a set percentage as it changes from the default? Specific kerns could even be set to only activate above or below certain sizes.</p>
    <p>Thoughts?</p>
