      <p>”...a font format that allows metrics to vary with size”<br>
      Hot metal did this. The Merganthaler VIP typesetter did this. MM could do this. TrueType GX Variations too. All the current font formats allow any single outline to do it, so a collection of outlines can too. </p>
      <p>PageMaker and QuarkExpress allowed the user to define a table of a track-per-size, per outline. These work on a single outline with a value for each size. As long as the single outline master is still applicable to the range of size/track pairs used, somewhat fine!</p>
      <p>”...a hinted TrueType font to use hinted widths at small sizes...”<br>
      As this depends on the presence of a course grid, at which point the technique is most often being used for readability survival rather than as a refinement to spacing, it is really not a point to make.</p>
      <p>”...the OpenType feature “size”...”<br>
      is static, i.e. one label per font, it’s not related to anything of the dynamic issue being discussed.</p>
      <p>It would be great to have a truely dynamic version like GX Variations offered, but waaaaaay too many “type people” (lol) appear scared of this. It would bring out the cream of the crop in type design and use, and leave the janitorial type type people, (who must keep things understandable for themselves, or else!), in the dark at the back of the pack. Thus, since the janitorial type type people seem favored and rising for their lack of interest in granting type type intelligence, their lack of vision, and even of hearing, it’s unlikely to happen in any of the “big” typesetting systems, much less in a standard. . . ever, or until the next generation of typographic janitors arrives. ;)</p>
      <p>Cheers!</p>
