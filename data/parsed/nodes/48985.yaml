      <p>&gt; Nobody really knows why Adobe pulled the plug [on MM fonts]</p>
      <p>I talked about it at great length in a presentation at ATypI. I’ve written about it in public as well. You may choose to not believe the explanations I’ve given, but to simply say “nobody really knows” is a bit odd. Certainly those of us who were here at Adobe when the decision was made to not support MM in OpenType are pretty familiar with the issue.</p>
      <p>I was not thrilled at the time with the decision not to support MM functionality in OpenType, but I understood the many pragmatic factors that went into it. These days a decision like that today would be made by me and David Lemon, but if somehow we could wind back the clock, I couldn’t tell you which way we’d go on that one.</p>
      <p>&gt; Dan Mills was later fired</p>
      <p>Not at all true. He retired to spend more time with his family.</p>
      <p>Cheers,</p>
      <p>T</p>
