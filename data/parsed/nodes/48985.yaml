      <p>You could include this when using the OpenType feature “size”:<br>
      <a href="http://www.microsoft.com/typography/otspec/features_pt.htm#size" title="http://www.microsoft.com/typography/otspec/features_pt.htm#size">http://www.microsoft.com/typography/otspec/features_pt.htm#size</a></p>
      <p>But I don’t think it would be a good idea. The spacing isn’t just based on the size alone. It may also be based on the reading distance, text color, background color/material and so on. So it is really something the user has to choose. I guess people might even be annoyed if the font would apply such changes automatically.</p>
