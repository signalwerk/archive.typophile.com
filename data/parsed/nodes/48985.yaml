    html: |-
      <p>James, you must be pretty new to digital type! </p>
      <p>Precisely what you describe has already been available, and been implemented, and been abandoned. </p>
      <p>Basically, from 1990 to 2000, Adobe had a lot of Multiple Master fonts with optical axes that did just that. This development was spearheaded by Sumner Stone. Each font with an optical axis had size variation from 6 to 72 points. Spacing changed according to type size. In the mid-90s, one of the PC versions of Microsoft Word automatically selected the right optical size to use when it detected a multiple master font. If I recall, much later, one of the early editions of InDesign could accomplish the same trick, though clumsily. Microsoft’s implementation was invisible — I think I must have been almost the only person outside Microsoft who knew this was happening, and I publicized it wherever I could, but it wasn’t considered of overwhelming interest by anyone. </p>
      <p>Quark was on the verge of doing some great things with MM when Adobe pulled the plug around 2000. Nobody really knows why Adobe pulled the plug. We used to blame it on Microsoft, but I now accept Microsoft’s verdict that it was Adobe, in particular Dan Mills, who made the decision. Dan Mills was later fired — whether for this typographical treachery or for something else, I have no idea. </p>
      <p>Apple had a superior version of the technology called Variations but if I recall correctly, none of the released Variations fonts (of which Matthew Carter’s Skia was the most famous) had an optical axis. </p>
      <p>MM survives as a vital part of Acrobat and all its derivative products. (You will find two multiple master versions of Times and Helvetica — with invisible attributes — in every copy of Mac OS X - - they are supposed to work with Preview.)</p>
      <p>MM also survives as a vital part of the design process, thanks to the fabulous work done by Yuri Yarmola with Fontlab. </p>
      <p>MM optical axes had design change from 6 to 72 points. But there was never any reason why you couldn’t leave the design the same at each end, and simply use the axis to change spacing, just as you suggest.</p>
      <p>Oh, the dreadful, painful history you have missed! How I truly envy you! </p>
      <p>By the way, PageMaker had a great feature that would automatically apply tracking according to size - - this is not an ideal situation at all, but it often worked better than nothing - - much, much better — and it isn’t at all analogous to what was happening with MM. </p>
      <p>By the way, MM still works perfectly well with all versions of Windows including Vista - - simply install ATM Deluxe for NT and disable UAC. Try it - - you’ll like it! </p>
      <p>One problem with MM is the crazy nomenclature and lack of interactive control in programs. Only one program ever supplied up-front interactive slider bars without the confusing gobbledygook - - LightningDraw GX on the Mac. Had that feature been implemented in all layout and WP programs, everyone in the world would happily be using MM fonts today. </p>
      <p>It’s an unfair world out there!</p>
      <p>Be that as it may, many, including some at Adobe, predict that MM in some form will be with us again - - sometime within the next 5, 10 or 20 years, depending on whom you’re talking to.</p>
