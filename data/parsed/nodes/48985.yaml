      <p>I asked my OpenType/Volt expert who confirmed that “size” is not a [direct] way to handle variable widths in a font.</p>
      <p>Perhaps, Simon Daniels of Microsoft can confirm that OpenType is flexible font format that allows new features to be added to it, such as variable character widths.</p>
      <p>It would seem logical that if “size” can determine a point size range for tracking, then seemingly it can then input information to another unyet created or named operative that could change a character’s width based upon its point size.</p>
      <p>Maybe, in the next main release of OpenType by Adobe/Microsoft the feature of variable character widths will be implemented.</p>
      <p>Certainly, implementation of this feature is vital to OpenType, because digital type would then include an important feature of metal type.</p>
      <p>What do you think, Thomas Pinney? At RIT, wasn’t that an area of your study?</p>
