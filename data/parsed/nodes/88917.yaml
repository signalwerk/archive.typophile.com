    <p>Hi,<br>
    I'm working on an idea for a twa monogram, but I'm not sure if its working or not.<br>
    Does anyone have any suggestions? The 'w' part is what im having trouble with i think.<br>
    The logo is for an Archive organisation, and the idea was wanting to go from a serif 't' to a sans 'a' but i've tried different versions too.</p>
    <p>Any feedback would be great,<br>
    Many thanks<br>
    Toby</p>
