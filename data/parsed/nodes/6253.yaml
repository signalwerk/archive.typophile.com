    <p>Howdy. This is actually the ﬁrst font I’ve shown on Typophile. It’s not exactly a proper bitmap font just yet, but I wanted a bit of feedback before I pushed it any further. If anyone out there reads Thai, I’d be eternally indebted for any comments as to its general legibilty. <br><br>It’s quite derivative of van Doesberg and such, and the headings are quite blatantly the very same. <br><br>Thanks all. <br><br>Nate <br><br></p>
