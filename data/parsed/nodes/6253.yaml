    html: <p>Ah, quite true. Thanks for that link, hhp. Incidentally, the last character in the shortened version (Krung Thep) is called <i>pai yan noi</i>, and it's used for abbreviation or ellipsis. So in the case, it stands for the rest of the ridiculously long name ;-) Sometimes though, you'll see "Bangkok" spelled with the first twelve letters (or thirteen if you're counting the under vowel on the second consonant). </p>
