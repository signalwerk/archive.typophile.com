  - id: 44095
    user: 1026
    date: 2003-01-25T12:58:00
    date_raw: 25 Jan 2003 — 12:58pm
    votes: null
    html: <p>Yeah, when I was in Thailand I saw quite a bit of "Latinization" - ranging anywhere from a scary Thai version of Westminster to some pretty nice modern typography. E.g., the Futura-looking labels on the phone booths in Chiang Mai. I wonder if that's mostly due to the monstrous sweep of the West into Asia, or if it might just be the evolution of their script. After all, English has come a long way from Lombardic script and blackletter.  <br> <br>Incidentally, somewhere in vast expanse of cyberspace, there's a 14MB .pdf file of a 400 page book (in Thai) that, I believe, is a treatise of some sort on Thai letter design. The last 250 pages are a huge collection of specimens of available Thai faces. For the life of me, I can't find the link to it, but if anyone's interested, I could burn a CD of it and toss it in the mail. <br> <br>And I'll post another file soon of the revisions to this face. <br> <br>Cheers.</p>
    html_clean: <p>Yeah, when I was in Thailand I saw quite a bit of "Latinization" - ranging anywhere from a scary Thai version of Westminster to some pretty nice modern typography. E.g., the Futura-looking labels on the phone booths in Chiang Mai. I wonder if that's mostly due to the monstrous sweep of the West into Asia, or if it might just be the evolution of their script. After all, English has come a long way from Lombardic script and blackletter.  <br> <br>Incidentally, somewhere in vast expanse of cyberspace, there's a 14MB .pdf file of a 400 page book (in Thai) that, I believe, is a treatise of some sort on Thai letter design. The last 250 pages are a huge collection of specimens of available Thai faces. For the life of me, I can't find the link to it, but if anyone's interested, I could burn a CD of it and toss it in the mail. <br> <br>And I'll post another file soon of the revisions to this face. <br> <br>Cheers.</p>
  - id: 44096
    user: 1250
    date: 2003-01-25T13:14:00
    date_raw: 25 Jan 2003 — 1:14pm
    votes: null
    html: "<p>&gt; I wonder if that's mostly due to the monstrous sweep of the West into Asia, or if it might just be the evolution of their script. <br> <br>Well, both. <br>But \"evolution\" can often have bad effects - it needs to be managed. A writing system is an extremely powerful piece of cultural identity, and a homogenous gray world seems deathly boring, no? <br> <br>On the other hand, it's a complex issue: there are certainly some good reasons to bring \"modernism\" to different parts of the world - it's enriching. But it does have to be done sensitively: in the sample I showed (the bottom line), the results are both overly harmful to Thai culture <i>and</i> dysfunctional as well: when a person who reads both Thai and some Latinate language sees that thing, it's just confusing. <br> <br>-- <br> <br>Wow, that PDF you describe sound like a dream... <br>Why don't you just put it up on some site for us to download? Or use a service, like: <br><a href=\"http://www.whalemail.com/\" target=\"_blank\">http://www.whalemail.com/</a> <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; I wonder if that's mostly due to the monstrous sweep of the West into Asia, or if it might just be the evolution of their script. <br> <br>Well, both. <br>But \"evolution\" can often have bad effects - it needs to be managed. A writing system is an extremely powerful piece of cultural identity, and a homogenous gray world seems deathly boring, no? <br> <br>On the other hand, it's a complex issue: there are certainly some good reasons to bring \"modernism\" to different parts of the world - it's enriching. But it does have to be done sensitively: in the sample I showed (the bottom line), the results are both overly harmful to Thai culture <i>and</i> dysfunctional as well: when a person who reads both Thai and some Latinate language sees that thing, it's just confusing. <br> <br>-- <br> <br>Wow, that PDF you describe sound like a dream... <br>Why don't you just put it up on some site for us to download? Or use a service, like: <br><a href=\"http://www.whalemail.com/\" target=\"_blank\" class=\"link-external\">http://www.whalemail.com/</a> <br> <br>hhp <br></p>"
