    html: <p>zoinks. i can barely tell the difference between ru, tho thung, ko kai, kho khai, and kho khuat, at least from the unicode link i was looking at. this bitmap idea of yours is more challenging than i thought. apparently how the glyphs are read depends not so much on the mark but on where the mark is placed inside (or outside) of a certain shape, or even the length of a stem, kind of like we can tell the difference between a lowercase l and a lowercase i without a dot. at least i think this is what's going on. so, the difference between ko kai and tho thung doesn't need to be exaggerated. the question is whether a thai speaker would recognize a crooked leg or a nick out of the leg more easily. on screen at small sizes, the crooked leg jumps out more, but will it be recognized? any way, i'm starting to confuse myself.  <br>  <br>as for our conversation the other day, well, anyone reading bitmapped thai text on their pda most likely isn't concerned with the cultural authenticity of the thing. imagine everyone in deutschland reading books that look like they came straight off of gutenberg's press, or romans carrying books made of stone with words chiseled into them. i'm not promoting global homogeneity, but everything has to evolve. the curlycues being replaced by dashes or whatever seems like the equivalent of serif vs. sans. we all know f is f. the evolution of thai faces may be more modernization than latinization. we aren't trapped in world of handwriting, neither should they be, so bravo on your efforts. i hope they like it chiang mai.</p>
