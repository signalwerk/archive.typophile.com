    html: '<p>&gt; I wonder if that’s mostly due to the monstrous sweep of the West into Asia, or if it might just be the evolution of their script. <br><br>Well, both. <br>But “evolution” can often have bad eﬀects — it needs to be managed. A writing system is an extremely powerful piece of cultural identity, and a homogenous gray world seems deathly boring, no? <br><br>On the other hand, it’s a complex issue: there are certainly some good reasons to bring “modernism” to diﬀerent parts of the world — it’s enriching. But it does have to be done sensitively: in the sample I showed (the bottom line), the results are both overly harmful to Thai culture <i>and</i> dysfunctional as well: when a person who reads both Thai and some Latinate language sees that thing, it’s just confusing. <br><br>— <br><br>Wow, that <span class="caps">PDF</span> you describe sound like a dream… <br>Why don’t you just put it up on some site for us to download? Or use a service, like: <br><a href="http://www.whalemail.com/" target="_blank">http://www.whalemail.com/</a> <br><br>hhp <br></p>'
