    html: <p>Thanks for the suggestions, Paul. I’ve been tweaking kho rakhang et al — trying to extend those strokes without creating enough space under them to graze herds of sheep. I’m sure there’s a happy median somewhere. And, the more I look at it, I think you’re right about the half-width strokes. They get pretty annoying. Once I get some revisions done this weekend, I’ll throw up another image. <span class="caps">BTW</span>, I really like that no nu in Bangkok Bank. <br><br>Part of the impetus for starting work on Thai fonts is due to a friend of mine from Bangkok who was lamenting the dearth of good Thai language fonts. Both “modernist” display varieties (he’s of the opinion that Thailand missed out on modernism almost entirely and went straight to glorious <a href="http://www.thomasriddle.net/high-on-chatuchak/pages/elephant800.htm" target="_blank"> post-modernity</a>) — and also decent bilingual faces. That is, other than Angsana and Cordia and whatever other crap comes bundled in Windows. In fact, what he wants is something along the lines of what you posted Hrant. Something without all the “curlicues.” So I’ve also been working on another face (which I’ll post sometime soon) that’s supposed to work with Univers.  <br><br>And if you’re interested Paul, there are some good online <a href="http://seasrc.th.net/paper/paper.htm" target="_blank"> papers</a> about Thai characters by a computational linguist working at <span class="caps">CRCL</span> Bangkok. <br><br>Thanks again guys. <br><br>Nate <br></p>
