    html: "<p>&gt; what he wants is something along the lines of what you posted Hrant <br> <br>If you mean the bottom one, tell him that's called Latinization, and it's Evil: if he's a proud Thai, he should instead work towards more cultural authenticity: <br><a href=\"http://www.themicrofoundry.com/ss_rome1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_rome1.html</a> <br>(Especially Page 3) <br> <br>Getting rid of the curlycues isn't necessarily bad (although I'm pretty sure it would reduce readability, the way getting rid of serifs does in Latin), but wanting to imitate something like Univers too closely very much is. <br> <br>hhp <br></p>"
