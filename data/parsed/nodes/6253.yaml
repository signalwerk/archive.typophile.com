    html: <p>Yeah, when I was in Thailand I saw quite a bit of “Latinization” — ranging anywhere from a scary Thai version of Westminster to some pretty nice modern typography. E.g., the Futura-looking labels on the phone booths in Chiang Mai. I wonder if that’s mostly due to the monstrous sweep of the West into Asia, or if it might just be the evolution of their script. After all, English has come a long way from Lombardic script and blackletter.  <br><br>Incidentally, somewhere in vast expanse of cyberspace, there’s a <span class="caps">14MB</span> .pdf ﬁle of a 400 page book (in Thai) that, I believe, is a treatise of some sort on Thai letter design. The last 250 pages are a huge collection of specimens of available Thai faces. For the life of me, I can’t ﬁnd the link to it, but if anyone’s interested, I could burn a <span class="caps">CD</span> of it and toss it in the mail. <br><br>And I’ll post another ﬁle soon of the revisions to this face. <br><br>Cheers.</p>
