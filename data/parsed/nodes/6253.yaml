    html: <p>i brieﬂy looked at the two versions while i was at work, <br>and i noticed a couple of things. one was that i have no <br>idea what any of it was. i think that may have been a <br>good thing, since i couldn’t trick myself into knowing <br>what a shape  was without actually knowing. the only <br>speciﬁc forms i remember were the two that i posted, <br>one from the original, one from the revision. i can’t <br>remember which one was which. the shape on the  <br>left in the images is more legible (i think. remember, <br>i don’t know what it’s “supposed” to look like) because <br>of the more pronounced indent of the leg. there were <br>a few others that were similar, but i didn’t have time <br>to look at them today. press day and all. so there’s my two bits, <br>and mr. matteson knows how much that’s actually worth. <br><img src="http://www.typophile.com/forums/messages/29/4976.gif" alt="nates1"><img src="http://www.typophile.com/forums/messages/29/4977.gif" alt="nates2"><img src="http://www.typophile.com/forums/messages/29/4978.gif" alt="nates3"></p>
