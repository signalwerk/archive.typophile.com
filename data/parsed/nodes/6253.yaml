    html: '<p>If you’re interested James, The longer version (12 character: see below) of Bangkok is <i>Krung Thep Mahanakhon</i> or “Metropolitan Bangkok”. There’s also a three letter version which is like “<span class="caps">LA</span>” or “<span class="caps">NYC</span>” (also below).  <br><br>The two versions of “Thailand” that I posted above translate to (1) <i>bpratheht Thai</i> and (2) <i>Thai</i>. <i>Bpratheht</i> essentially means “country” or “nation,” but in Thailand most of the signage uses the second version, as <i>bpratheht</i> is really a Western concept, not very Thai. <br><br>Krung Thep Mahanakhon <br><img src="http://www.typophile.com/forums/messages/29/16012.gif" alt=""><br><br><span class="caps">KTM</span> <br><img src="http://www.typophile.com/forums/messages/29/16013.gif" alt=""></p>'
