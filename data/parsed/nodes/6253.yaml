    html: '<p>Nathan, I’m not a native but I read and speak a little Thai. <br><br>So far, what you have is pretty neat, and I think it’s great to see westerners working on Thai fonts.  I’d like to do a few myself.  Here are a few comments: <br><br>Serifs: Thai, of course, has those little circles (I don’t know the correct term) that begin the stroke, and are important in distinguishing letters.  I think your typeface would beneﬁt from indicating these with a more noticeable serif where they should be. <br><br>The Bangkok Bank’s logotype (<a href="http://www.bbl.co.th/Bangkok%2BBank/Main.htm" target="_blank">http://www.bbl.co.th/Bangkok+Bank/Main.htm</a>) has a similar face, but theirs could use a small boost in legibility too, I think. <br><br>? <span class="amp">&amp;</span>&nbsp;? (kho rakhang <span class="amp">&amp;</span> kho khuat): I think you’re going to have to emphasize the upper-left part of these letters more.  Give them more room, and the less you use the half-width strokes, the better, in my opinion. <br><br>? <span class="amp">&amp;</span>&nbsp;? (do dek <span class="amp">&amp;</span> to tao): I think the “inner stems” of these letters actually need to extend inside the letters’ counters more, and the left side should “bubble out” more if possible. <br><br>Some of these suggestions may apply to other letters too.  Good work!  I’d like to see more. <br><br>Paul</p>'
    html_clean: '<p>Nathan, I’m not a native but I read and speak a little Thai. <br><br>So far, what you have is pretty neat, and I think it’s great to see westerners working on Thai fonts.  I’d like to do a few myself.  Here are a few comments: <br><br>Serifs: Thai, of course, has those little circles (I don’t know the correct term) that begin the stroke, and are important in distinguishing letters.  I think your typeface would beneﬁt from indicating these with a more noticeable serif where they should be. <br><br>The Bangkok Bank’s logotype (<a href="http://www.bbl.co.th/Bangkok%2BBank/Main.htm" target="_blank" class="link-external">http://www.bbl.co.th/Bangkok+Bank/Main.htm</a>) has a similar face, but theirs could use a small boost in legibility too, I think. <br><br>? <span class="amp">&amp;</span>&nbsp;? (kho rakhang <span class="amp">&amp;</span> kho khuat): I think you’re going to have to emphasize the upper-left part of these letters more.  Give them more room, and the less you use the half-width strokes, the better, in my opinion. <br><br>? <span class="amp">&amp;</span>&nbsp;? (do dek <span class="amp">&amp;</span> to tao): I think the “inner stems” of these letters actually need to extend inside the letters’ counters more, and the left side should “bubble out” more if possible. <br><br>Some of these suggestions may apply to other letters too.  Good work!  I’d like to see more. <br><br>Paul</p>'
