    html: <p>Thanks Nick! Korinna looks like an interesting solution--and like it should be good for use on screens large and small. Before I started reading on Typophile, I never really considered how much the selection of lettering could affect the presentation of a product or business. It is interesting to me that so few people seem consciously aware of the impact of lettering and yet I believe a large number are greatly affected subconsciously. I think the choice I make here is an important one and your assistance is much appreciated.</p>
