      <p>&gt;  A company logo is still to be designed...</p>
      <p>It's premature to be picking fonts if the logo hasn't been designed yet. (Unless you view them as temporary fonts that might change later).  You say that "the present product logo uses Benguiat", but that doesn't necessarily mean it's the best choice for your company logo.</p>
      <p>Your entire identity system —&nbsp;logo, fonts, color palette, website, printed materials, packaging, signage, etc. — need to be designed to work together.</p>
      <p>&gt; I'm not a graphic artist</p>
      <p>It would be money well spent to work with one. If you have a tight budget perhaps a graphic design student at a local college could help for a small fee.</p>
