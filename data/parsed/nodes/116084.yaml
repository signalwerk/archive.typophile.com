      <p>Wether one should use sans for screen depends on your target group. When they still have SVGA monitors and older versions of Windows, I’d say yes … ;–)</p>
      <p>The number of pixels on an iPhone 4 retina display is about the same as an SVGA Monitor. The screen is smaller, but the users tend to read it at a smaller distance. In the 1980s viewing distances between 50 and 60 cm were advised. Smart phones are held at about 50% of that, I’d say. CRT monitors used to flicker, flat screens don’t. Above that, subpixel rendering suggests a resolution that is 3 to 9 times higher than the physical resolution of the screen. Deciphering small details as may occur when reading, has become far less cumbersome than in the past I think. Therefore, typefaces that have serifs and a thick-to-thin contrast which resembles that of regular body text typefaces as we see in books, newspapers and magazines perform very well on screens these days. As you suggested, we are (again) in a situation where the rules-of-thumb from the past have to be reviewed and revised.</p>
      <p>Thin hairlines and thin serifs such as they are often found in skinny versions of Bodoni and Didot or poor versions of classical typefaces such as Bembo and ITC Garamond light should be avoided for reading text though. Especially when sizes are relatively small and texts tend to be rather long. But in that context we did not like those skinny faces in printed media either didn’t we? ;–)</p>
