    <p>I need to select fonts to give a new business (mine - and I'm not a graphic artist) a specific vintage look and feel. Of course, I hope to create - as much as possible - a unified presentation for a variety of venues including letterhead, e-mail, e-commerce website (viewable on desktop, tablet and smartphone), print catalog, and collateral materials.</p>
    <p>In addition to a unified look, the other interest was in selecting fonts to create a memorable impression for the business. I'd like the lettering to stand out enough that people might notice it is something a little different –and yet be able to read it with ease.</p>
    <p>The present product logo uses Benguiat which, while a “young” font, was used to convey a product with qualities circa 1900 –a little art nouveau and a little arts &amp; crafts. A company logo is still to be designed, but the present thinking was to use Benguiat again to convey the relationship between product brand and maker. The website design target is essentially vintage modern –basically how a turn of the century business might have designed a website (had the internet existed at the time). </p>
    <p>Now to my core question: My understanding had been that “serif is for print and sans serif is for electronic media.” If so, having a single vintage serif font for text use in print and electronic media would not work. Please let me know if the use of serif fonts is still viewed as restricted to print (especially now that people are moving to ever smaller screens on smart phones). </p>
    <p>If not, then are there particular serif fonts suitable to use “everywhere.” If a separate sans serif font is needed for electronic media, are there those best to use for that media which would also work well with a “serif partner” for print. (BTW - Obviously, I do not think a single sans serif will work aesthetically for both print and web...but that does not mean I am right.)</p>
    <p>Thank you for your input! (And sorry for the length of this, but it seemed best to provide the particulars.)</p>
