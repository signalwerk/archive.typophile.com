      <p>Overall, I like it.</p>
      <p>I disagree with pattyfab regarding your use of serif and sans fonts apart from Ministry.  On the front, I <em>do</em> think the sans works better, but perhaps ever-so-slightly larger. I agree with pattyfab on point 2 though, the location and date are far too difficult to read at that size, try replacing with the sans font.</p>
      <p>On the insert, I think the periods after Mr and Mrs look jarring, but maybe that’s just because I’ve been reading the <em>Economist</em> lately... I don’t know if it’s okay to omit the period. I am American, and I know the convention here is to have the period after Mr and Mrs, but I think it would look better without.  Maybe someone else will comment.</p>
