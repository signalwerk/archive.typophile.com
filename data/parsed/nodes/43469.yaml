    <p>Here is the front cover (left) and an insert (right) for the first draft of my wedding invitation. Just looking for some feedback. It’s certainly a challenge finding the right pair to go with Ministry Script. Any feedback would be appreciated. The paper will be brown and we will most likely have the type foil stamped in a light blue (brown too dark for letterpress).</p>
    <p>The wedding will not be overly formal and will be in Vail, Colorado. Outdoors.. think nature, aspen trees, pine trees, rocky mountains, mountain creek, etc.</p>
    <p>I’m curious why some of the characters don’t seem to align/connect with each other with 0 tracking?</p>
    <p>The verbage isn’t dialed in yet nor is the upper/lowercase, etc. Also looking at ampersand options for the cover. Again, just showing an initial draft for feedback.</p>
    <p>Ministry Script, Bodoni Twelve EF, Frutiger Black Condensed</p>
    <p>Thank you!</p>
    <p></p><div class="imageWrap"><img src="/files/inviteshow1_6138.jpg"></div><p></p>
