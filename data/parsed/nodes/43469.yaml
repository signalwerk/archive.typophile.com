      <p>I like Bodoni with Ministry.  Like some others here, I don’t see the need for Frutiger. </p>
      <p>Might it be possible to use some of the alternates in Ministry to vary the look of the names between the cover and the interior? I don’t have it, but I understand there are quite a few alternates and ligatures, and you might be able to get a more hand lettered look if you explore a bit. For example, the sample at Veer seems to show a “er” ligature, or at least a contextual alternate “e”,  which you’re not using.</p>
      <p>I don’t understand why you set all the Bodoni in small caps... I think upper and lower case would be more readable and more pleasant, especially because I find the caps too big with the smallcaps. It might be just the screen shot, but the cap “M” in Mr. and Mrs. seem disproportionately large. If you do stay with the smallcaps, I’d at least use the UC ampersand in “Resort &amp; Spa”. To my eye a small ampersand looks out of place in a mixed line like that.</p>
