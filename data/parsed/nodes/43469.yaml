      <p>It’s a very nice invitation. Feedback:</p>
      <p>1. I don’t think you need both a sans and a serif font to pair with Ministry. Just use the Serif.</p>
      <p>2. on the front I’d put the location and date in the serif font. Just leave your names in Ministry. Ministry doesn’t read easily at such a small size and the cover will look more balanced.</p>
      <p>3. The serif type on the back looks just a little tight - maybe open the leading a point? I’m not sure you need “Wedding Ceremony” either. If you remove that you can open up the rest of the type.</p>
      <p>4. Don’t you need “to” in between the names on the back?</p>
