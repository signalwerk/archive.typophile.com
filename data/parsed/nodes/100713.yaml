      <p>Maybe it would be helpful to step back and re-frame the problem. Instead of asking "how can I deal with the length of this name aesthetically?" ask yourself "how can I communicate the identity of this organization in a way that is effective for the target audience?" An effective solution will depend a lot more on the impression you are trying to make than on some universal idea of what looks nice. Ask the visionaries in the company why the name must be exactly that to effectively communicate who they are. </p>
      <p>As for acronyms in general, unless they spell something memorable (but not necessarily a real word), you can always throw a bunch of money into marketing to make it remembered. The trouble usually comes when companies don't have the budget, marketing team, or insight to make this work. I think Paul Rand has more insight into this than Lubalin. But remember that he worked with huge corporations who assumed they would spend millions on marketing to make their brand recognizable. So he said:</p>
      <p>“It is only by association with a product, a service, a business, or a corporation that a logo takes on any real meaning. It derives its meaning and usefulness from the quality of that which it symbolizes.”</p>
      <p>“A logo is less important than the product it signifies; what it means is more important that what it looks like.”</p>
