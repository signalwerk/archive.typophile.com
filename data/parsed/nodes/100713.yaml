      <p>Five letters isn't a long name, and it's no more senseless (to use the OP's term) than many other company acronym names. </p>
      <p>GEICO — Government Employees Insurance Company<br>
      AFLAC — American Family Life Assurance Company<br>
      QUANTAS — Queensland and Northern Territory Aerial Services</p>
      <p>And in fact, some companies use names that are totally made-up or are deliberately misspelled. For example, "Google" is a deliberate misspelling of "Googol", and for all practical purposes is a nonsense word, but things have worked out pretty well for them.</p>
      <p>I know it can be easier if the company name is more descriptive, but I'm just saying that lots of companies face this challenge.</p>
