    <p>Hello,<br>
    Creative Director here tasked with coming up with a logo for a very long newly merged company. The company name is North American Home Furnishings Association- do you go with an acronym NAHFA? Or do you attempt something with the entire name spelled out? Or both? All of the companies involved in the new company previously had some sort of acronym in their logos, NHFA, HFIA, WHFA. </p>
    <p>And if designing using acronym - any design tips for something long and awkward?</p>
