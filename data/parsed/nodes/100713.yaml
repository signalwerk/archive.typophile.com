      <p>&gt; Crazy impossible to design anything decent<br>
      &gt; with a five letter senseless acronym</p>
      <p>Sorry but I've got to disagree with you. "CBS" is an acronym, but that didn't stop them from having a great logo.  Other acronym companies include ABC, NBC, KFC, AT&amp;T, NASA, and a gazillion others, and many of them have excellent logos. </p>
      <p>Come up with an elegant symbol that graphically represents what the organization does. (Yeah, I know, easier said than done. :)</p>
      <p>Since "NAHFA" is an unfamiliar acronym to the general public, you'll probably need to spell out the full name in small type below or beside the logo. I'd suggest breaking the long name into multiple lines, and maybe you can get away with abbreviating "association".</p>
      <p>As for the symbol itself, I'd start with research and make a collection of logos (both good and bad) from other organizations in similar lines of business. Obviously you don't want to copy anyone, but it may help give you ideas, help you see what works and what doesn't, and will help to prevent you from accidentally coming too close to an existing logo.</p>
