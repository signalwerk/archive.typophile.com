      <p>My impression, partly based on things I have read before, was that Chank doesn't actually do all of those handwriting fonts. Handwriting is, after all, handwriting, and usually reflects an individual style. Looking through those GFY fonts suggests to me that they were not all done by the same individuals, although I guess anything is possible.</p>
      <p>This is not to say that 'Spire' might not be right. My point was mainly that I think the information that Chank designed those fonts may be oversimplifying their true origins.</p>
      <p>- Mike Yanega</p>
