      <p>Thanks, gents, I think you've got it. I appreciate the homework and the fast reply, as always.</p>
      <p>And Mike: your ID Guides are phenomenal...thanks for providing such a great resource for the type community. I've already used them countless times. If I could humbly offer one suggestion to you about the site, inspired by Edward Tufte, it would be to integrate the Supplier Reference List into the ID Guide itself, so clicking on a given sample takes your visitor (via target="_blank" or something) to the respective supplier's site. I know it's more work for you to integrate the two, but I think it would ultimately make searching a simpler, one-step affair. Also, you could keep the Supplier Reference List, which has obvious merits unto itself, as a feature on the site.</p>
      <p>Thanks again all.</p>
      <p>--Michael.</p>
