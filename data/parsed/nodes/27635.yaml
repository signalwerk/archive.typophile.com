      <p>I just went and had a look at GFY Jeanna and I absolutely believe that the same person who did that lettering did your sample. The 'g' and 'G' are obvious differences, but it looks like the one used for the ad is a 'cleaned up' version of that lettering.</p>
      <p>The problem is still that this was probably done as a custom version, so you will have to find the best match available.</p>
      <p>- Mike Yanega</p>
