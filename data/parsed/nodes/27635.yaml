    html: |-
      <p>Michael, </p>
      <p>Thanks for your comments about my Guides. I agree that your suggestion would make things easier for the users, but there are two main reasons that I have not made links to suppliers from the samples:<br>
      1) There are multiple suppliers for most of the fonts, since the designing foundry is usually only one source, and I am not trying to play favorites, even though I could benefit from doing so, with sales referral fees.<br>
      2) Links have a way of getting out of date, and the maintenance task would be horrendous. I have been lucky enough to have wonderfully generous volunteers to help make samples for the Guides, and even to take on the design of the Serif Font ID Guide for me, but I'm spread too thin to take on the addition and maintenance of about 6,000 links.</p>
      <p>I am thinking about the idea of putting links into the <a href="http://bowfinprintworks.com/ListPages/SupplierCodes.html" rel="nofollow">Supplier Codes List</a>, and I already do have them on the <a href="http://bowfinprintworks.com/providers.html" rel="nofollow">Type Providers page</a>.</p>
      <p> - Mike Yanega</p>
