    html: |-
      <p>I've gone through the fonts on <a href="http://www.comicbookfonts.com" rel="nofollow">Comicraft</a> and <a href="http://www.blambot.com/" rel="nofollow">Blambot</a>, but I can't find an exact match.</p>
      <p>Oddly enough, the font I've found that has the most in common with your mystery font (in the basic letterforms) is <a href="http://www.myfonts.com/fonts/chank/gfy-handwriting-fontpak/gfyjeanna-regular/" rel="nofollow">GFYJeanna</a>, a <a href="http://www.chank.com/font_detail.php?sku=5456" rel="nofollow">"Go Font Yourself"</a> font from <a href="http://www.chank.com/" rel="nofollow">Chank</a>. I suppose there's a chance that your mystery font is a customized -- and much-improved -- version of GFYJeanna.</p>
      <p>If you don't need an exact match (and no one else is able to find one for you), I suggest that you go through the offerings of Comicraft and Blambot. They both have many fonts that are much nicer than an unmodified GFYJeanna.</p>
