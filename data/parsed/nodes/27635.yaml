      <p>Chank runs a service called <a href="http://www.chank.com/gofontyourself/index.php" rel="nofollow">Go Font Yourself!</a>; for $199 he will turn your handwriting into a font.</p>
      <p>The <a href="http://www.chank.com/font_detail.php?sku=5456" rel="nofollow">Go Font Yourself Handwriting Fontpak</a>, which includes GFYJeanna, is a collection of Chank's favorite GFY fonts. I presume that he's worked out some kind of deal with the respective owners of the original handwriting (that is, the ones who commissioned the fonts in the first place).</p>
      <p>BTW, Mike, you can call me Edward if you like. :)</p>
