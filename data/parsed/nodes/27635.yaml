      <p>I've been hunting for this in <a href="http://bowfinprintworks.com/Script11Pg1.html" rel="nofollow">Part 11 of the Script Font ID Guide</a>, which is all hand-printed fonts. I used the 'G' and the 'y' as my initial filter, and I couldn't find a match for this lettering.  </p>
      <p>The problem, as our <a href="http://typophile.com/forums/typeid/faq" rel="nofollow">FAQ</a> says, is that there are just too many hand-printed fonts, because they are cheap and easy to make. It's very possible that this is a custom font done for this company.</p>
      <p>My suggestion is similar to Spire's, although I suggest looking for a similar font in the Script Guide, and then looking up the supplier in the Reference List. Many of them can be found as free downloads, or part of a rather inexpensive font collection.</p>
      <p> - Mike Yanega</p>
