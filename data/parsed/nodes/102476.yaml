      <p>The fan website galactiguise.com notes that spaceage.vef was <a href="http://www.galactiguise.com/welcome/sets/signs-icons/">the "standard" font used on much of the standing sets of the 2003-2009 version of Battlestar Galactica</a>.</p>
      <p>As for Gayatri Pro, I haven't been able to find that. Although there's a "Gayatri Regular" that seems to be available at some of the free-font sites.</p>
