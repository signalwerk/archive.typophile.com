      <p>"The thesis guidelines require me to use a serif font for figures and sans serif for main body text".<br>
      So strictly speaking you can't use Helvetica or Arial for figures.<br>
      But do you mean figures or figure captions? Surely your software does not input captions directly, does it? Or do you mean text inside the image?</p>
      <p>Sans serif for whole body text is also a little bit unusual, though I've seen institutions forcing students to use Arial 12 points for sections, chapter titles, everything.</p>
      <p>Using only Word is also a problem, but I wouldn't suggest swithing to Latex/Xelatex either at this point (takes some time to get used to it), even though you could install it on a pendrive and in theory have it use any font in any directory with some commands.<br>
      And if you're using Word 2003 it must be a pain to insert equations, too (without additional software).</p>
