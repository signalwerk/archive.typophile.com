      <p>I looked at the <a href="https://www.wiki.ed.ac.uk/display/HowTowiki/Thesis+Template+for+Postgraduate+Students" rel="nofollow">Word thesis template</a> provided by your university and even if they say that figure captions should use sans serif, their template uses the serif font. If the sans that is not Helvetica is used only in headers, the difference may not show that much.</p>
      <p>Another option is to have the free font  <a class="freelinking external" href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/heros" rel="nofollow">Tex Gyre Heros</a> installed on your PC.  That font comes with the texlive 2010 installation; it is based on Nimbus Sans, that is installed on Linux stations in our grad lab (and available in Open Office...). </p>
      <p>By the way, Informatics has a nice <a class="freelinking external" href="http://www.inf.ed.ac.uk/student-services/graduate-school/for-research-students/work-and-play/creating-informatics-theses-slides-and-posters" rel="nofollow">LaTeX template</a> using Nimbus Sans for headers and captions. It might be worth a try.</p>
