      <p><cite>I'm using .eps figures, so editing is likely to be tricky.</cite></p>
      <p>Inkscape edits .eps and .pdf figures. I usually save my Inkscape figures as .eps and then run epstopdf to get the corresponding pdf though Inkscape can also save pdf files (Inkscape's "natural" mode is .svg). The resulting figures (.eps or .pdf) can easily be  included in a LaTeX document as vector graphics (to be used with  latex or pdflatex respectively). I use Inkscape on a mac, but it runs under X11. If your windows station has an XWindow terminal emulator, maybe you could run Inkscape from a unix server and get the display on your Windows station.</p>
