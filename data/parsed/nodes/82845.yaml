    <p>Hi everyone,</p>
    <p>This is not so much a design question, but I've already spent quite a bit of time trying to decide on the fonts and formatting of my engineering PhD thesis (I should really be writting it, not making it pretty, so I thought I'd ask for some advice).</p>
    <p>Some of my figures will be made using software that only allows for a choice between one serif or sans serif font. The thesis guidelines require me to use a serif font for figures and sans serif for main body text. I've been able to determine that the sans serif font included in the software for figures is Helvetica. However, I'm writting my thesis in word and don't have access to Helvetica (and I can't add fonts on my computer because it's managed externally).</p>
    <p>I can't resolve myself to use Arial for headings and captions throughout the thesis, but I want to limit the number of fonts and make everything look as consistant as possible. The amount of text in the Helvetica figures will be minimal (only labels and legends), so I was thinking of finding a nice font that might not be too obviously different and hope people don't notice... It's not ideal, but I have no better solution for the moment.</p>
    <p>What font would you suggest I use as a nice and clean (it's engineering, so it needs to look somewhat technical) sans serif font that has similarities with Helvetica (without being Arial, which is used to death and unappealing to me)? What serif font would you match it with? I'm also going to have a lot of math in my thesis, so I need to consider a font that includes an extensive range of symbols (math symbols and greek letters, mostly). Since I can't add fonts, it would be helpful if you can suggest fonts that are typically available on windows systems.</p>
    <p>My thesis will be printed, but most of the versions will be read on screen, so I'd like fonts that are a good compromise between screen and print legibility.</p>
    <p>Any help would be appreciated, as my sense of graphical design is twitching every time I look at my thesis in its current format.</p>
    <p>Thanks,<br>
    Audrey</p>
