      <p>Or, you could try the tandem Georgia (text, serif) &amp; Verdana (figures, sans), or Arial (the options are quite limited) &amp; Times New Roman. These four fonts should meet your typographical requirements and you most certainly have them installed.</p>
      <p>Focus on the typography and not on the typefaces. Print samples. For example, try to see at what size/leading does Georgia (which is optimized for screen but should work in print also) invites you to read it, provided there are no more than twelve words per line. Check out Times too. It is neither ugly nor boring. Arial, having so many glyphs, is highly useful. You could do a nice piece of engineering of your thesis with some carefully planned typography using these fonts.</p>
