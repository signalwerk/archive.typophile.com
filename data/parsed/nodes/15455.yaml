    html: <p>Probably not legit, especially when you take into account the other copies at that site. Deftone is a <a href="https://web.archive.org/web/20150123094936/http://www.myfonts.com/fonts/larabie/deftone/" rel="nofollow">Larabie</a> font. UntitledAF is <a href="https://web.archive.org/web/20150123094936/http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=solaris" rel="nofollow">Solaris</a>. Old Chicago is just the old Mac system font run through a filter.</p>
