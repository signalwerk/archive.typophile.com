  html: |-
    <p>Well well, what do we have here? I was clearing out my downloads folder and came a pdf specimen from <a href="http://www.australianfaces.com/">Australian Faces.</a> (To download, click on the Beauchamp link under the 'new' heading)</p>
    <p>It looks surprisingly like the wonderful Mantinia from <a href="http://www.fontbureau.com/">The Font Bureau</a>, with a badly modified B and G. Ugh. Perhaps it is accidental, a freak of nature where the Aussies have managed to design a frighteningly similar typeface?</p>
