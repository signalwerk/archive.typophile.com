    <p>I am considering using Charis SIL, an open source version of Charter, for a web site. The semi-slabbed serifs look nice and the Character set and OT features are very rich. As importantly, Charis SIL is one of very few Open Font License text fonts to come in the four major styles.</p>
    <p>I installed it into my fonts, and set it to default in my browser, as an easy "test drive" of a variety of text.</p>
    <p>Is it a technical problem on my part, or is the font very poorly hinted? I find that not only the x-heights, but also stem widths oscillate wildly as it scales from the 10-18 pt range.</p>
    <p>Face's background:<br>
    http://en.wikipedia.org/wiki/Charis_(SIL)</p>
    <p>Available here for those who want to look:<br>
    <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=CharisSIL_download" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=CharisSIL_download">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=CharisS...</a></p>
    <p>Since it is an OFL release, I should be able to simply edit the hinting and rename it. But trying to open it directly in FL causes a crash. Opening and resaving in other editors fixes this, but probably introduce their own artifacts. The FL autohinting after that still creates a rather poor result.</p>
