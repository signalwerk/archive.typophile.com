      <p>Jasonb, you caught the same things I did, so I am glad to know it isn't a local display problem.The way some characters are fully hinted and some are completely ignored was what made me think it might have been a problem on my end, messing with it.</p>
      <p>The issue is certainly irrelevant for print use. The font shines there, if you care for it, and I do. The only bummer for me personally is that it doesn't shine in screen format. While all fonts have their limits in display at small sizes, I would really like to see it up to par with other rich families.</p>
      <p>I imagine that SIL has focused on breadth of use while developing their improvements, and they claim openly that it is still intended for simple typesetting, only now in a wide variety of scripts and languages. Noble goals.</p>
      <p>It is the only exceptionally full font family with a free license. Thanks to this, I can go and roll my own version with different hinting, to use or release. Pretty neat stuff. If there weren't several thousand glyphs it might not be so intimidating a goal. Unfortunately, my hinting skills may never rival the major foundries, as that has been less important in my line of type interest. Perhaps I can improve it some, and attract others to do likewise.</p>
      <p>At this point, I think I will still use it as the example font for creating images and such where I can anti-alias the output in one-off situations. With the OFL license, other site contributors can access the font as needed to make their own contributions with a consistent look. (I'm working on a wiki.)</p>
      <p>Hopefully, some day, an updated version would make a great candidate for showcasing the (hypothetical) CSS @font-face embedding in web pages. Any year, now.</p>
