      <p>I've been looking at Charis SIL myself too.  Rather closely:</p>
      <p><a href="http://www.samiam.org/Chortle" title="http://www.samiam.org/Chortle">http://www.samiam.org/Chortle</a></p>
      <p>It's a very good font.  The reason why the hinting isn't is because font hinting is patented by Apple.  There is more information about the patent problems with hinting here:</p>
      <p><a href="http://freetype.sourceforge.net/patents.html" title="http://freetype.sourceforge.net/patents.html">http://freetype.sourceforge.net/patents.html</a></p>
      <p>The way I'm working around this patent is by making low-resolution bitmap versions of the font by hand using Fontforge.</p>
      <p>The reason why Charis can be a derivitive of Bitstream Charter is that Bitstream Charter (in the basic Roman/Bold/Italic/BoldItalic fonts) is a free typeface.  Basically, Bitstream donated Charter to X (a windowing system for Unix and Linux) back in 1992 with a copyright that allows free redistribution and modification.  In fact, Bitstream Charter is, to the extent of my knowledge, the only truly open source font by Matt Carter.</p>
      <p>You may notice, when compared to Charter, that Charis has slightly thicker strokes; it's a little more bold (Charter slightly-semi-bold).  Also, the accents are more rounded at the top than the accents in Charter proper.</p>
      <p>Also, Charis isn't the only open-source (free to download, modify, and re-distribute) font with Regular/Bold/Italic/BoldItalic fonts.  There are a few other attractive open-source typeface with R/G/B/BI support:</p>
      <p><a href="http://www.bitstream.com/font_rendering/products/dev_fonts/vera.html" title="http://www.bitstream.com/font_rendering/products/dev_fonts/vera.html">http://www.bitstream.com/font_rendering/products/dev_fonts/vera.html</a></p>
      <p><a href="http://dejavu.sourceforge.net/" title="http://dejavu.sourceforge.net/">http://dejavu.sourceforge.net/</a> Vera derivitive with good Unicode support and an oblique version of Vera serif</p>
      <p><a href="http://canopus.iacp.dvo.ru/~panov/cm-unicode/" title="http://canopus.iacp.dvo.ru/~panov/cm-unicode/">http://canopus.iacp.dvo.ru/~panov/cm-unicode/</a>  TTF/OTF conversions of the fonts that comes with TeX</p>
      <p><a href="http://www.ellak.gr/fonts/mgopen/index.en.html" title="http://www.ellak.gr/fonts/mgopen/index.en.html">http://www.ellak.gr/fonts/mgopen/index.en.html</a> Some greek fonts with English (but, alas, usually not accented letter) support.</p>
      <p>And some maybe open-source fonts:</p>
      <p><a href="http://www.greekfontsociety.org/pages/en_typefaces20th.html" title="http://www.greekfontsociety.org/pages/en_typefaces20th.html">http://www.greekfontsociety.org/pages/en_typefaces20th.html</a></p>
      <p>The GFS claims that DidotOT is an OFL font.  However, the actual zipfile doesn't have an OFL license in it.</p>
      <p><a href="ftp://ftp.io.com/pub/usr/hmiller/fonts/Thryomanes11.zip" title="ftp://ftp.io.com/pub/usr/hmiller/fonts/Thryomanes11.zip">ftp://ftp.io.com/pub/usr/hmiller/fonts/Thryomanes11.zip</a></p>
      <p>This font is supposibly GPL, which is a great license for software but a lousy license for fonts.  The GPL doesn't answer questions like "Can I embed parts of the font in a non-GPL compatible PDF file" or "Can I use the program with a non-GPL compatible program like Microsoft Word", and the source code requirement is a non-issue when just about any font can be opened by just about any font editor.</p>
      <p>- Sam</p>
