      <p>You know, I wonder if Matthew Carter is OK with people making these derivitives of Charter.  I understand that Matthew/Bitstream donated Charter to the X project all those years ago, but I wonder if Matthew was aware he was donating the font with a license that allow derivitives like Charis to pop up years later.</p>
      <p>Infact, it's legal to make a straight up true type version of the bitstream Charter font and put it (or even sell it) on a web page.  This may not be what Bitstream had in mind when giving Bitstream to X, especially since Bitstream still sells the Charter font.</p>
      <p>If you want small caps and old style numbers, you can buy the latest update of Charter here:</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/charter/" title="http://www.myfonts.com/fonts/bitstream/charter/">http://www.myfonts.com/fonts/bitstream/charter/</a></p>
      <p>They recently updated Charter in 2004.</p>
      <p>- Sam</p>
