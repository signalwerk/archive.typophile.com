      <p>"It’s a very good font. The reason why the hinting isn’t is because font hinting is patented by Apple."</p>
      <p>This isn't entirely true. Apple's patent has to do with using delta hints, and as far as I know, it restricts rendering systems from processing delta hints, not fonts from containing them.</p>
      <p>In any case, though, it's not the lack of delta hints that make this font render less than ideally at display sizes. I can see many instances where features and strokes are left completely uncontrolled, instead of applying bsaic TrueType instructions. These instructions are part of the base TT instruction set, are not patented, and do not rely on delta hints.<br>
      The font doesn't display well at small size simply because it wasn't intended to. If you wanted the font to perform better at display sizes, you could improve it's display quite a bit, even without using delta hints.</p>
      <p>Jason C</p>
