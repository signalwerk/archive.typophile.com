    html: |-
      <p>SIL describes Charis as "one of the first fonts designed specifically for laser printers."<br>
      If it was intended for laser printers, not screen display, then the hinting should not be expected to be up to the quality of something "hand-hinted", as Verdana, for example. Even on a 300 dpi laser printer, 11pt is 46 ppm, large enough to not worry about exacting manual hinting.</p>
      <p>I briefly looked at the hint quality (regular weight only) and the overall color is pretty good, but there will be some problems in screen display use. The verical stems are controlled fairly well, but many of the horizontal stems and features are left unhinted, which is why you'll see some problems with Cap heights and x heights. (e.g., bottom of Cap "F", top of cap "H".) There are other individual issues, "f", "h" are particularly bad, and the combination characters (DZ, Lj, Nj, etc,) show the left character hinted, the right char not hinted.</p>
      <p>Overall though, this appears to function as I'd expect for a font designed for printing, I'd expect the print results should be pretty good overall.</p>
      <p>Jason C</p>
