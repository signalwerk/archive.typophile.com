    date: 2008-02-18T13:16:00
    date_raw: 18.Feb.2008 1.16pm
    votes: null
    html: |-
      <p>CS2 applications have a bug that require at least one substitution feature in an OpenType font in order for the kerning to work. So you could add something like </p>
      <p><code>feature ornm {<br>
        sub bullet by bullet;<br>
      } ornm;</code></p>
      <p>to the OpenType panel. It doesn’t really matter so much what substitution feature the font has, but of course it would make sense if the feature would be somewhat meaningful and somehow related to your typeface. </p>
      <p>A.</p>
