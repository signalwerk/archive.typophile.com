      <p>Bringhurst (unless the newer editions have changed this) offers a good overview of 1930s British typography &amp; the page. While it is still a good model -- and still somewhat advocated in some recent books (e.g. Mitchell &amp; Wightman <cite>Book Typography</cite>, Libanus Press 2005), it isn't much used anymore, at least in the States. In the States, designers seemingly are trying to see who can be the first to set 10/16. Since the publisher wants more than 2,000 characters a page with a 6x9-inch book, the grid has to be thrown out. This pretty much holds true even with the 10/15 settings which a good number of designers have tried. I'm holding my breath for that first 10/16 x 26 design. How daring!</p>
      <p>The Mitchell &amp; Wightman offers a good 21st century view of what started with 1930s British typography. I must say though that Dutch designers seem to be doing better than their US counterparts.</p>
      <p>FWIW</p>
