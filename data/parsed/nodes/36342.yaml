      <p>This set of two volumes are <em>very</em> detailed and thorough, and come highly recommended.</p>
      <p>The first volume is about the details of setting text. Not a collection of rules, but more a discussion of the possibilities.<br><a href="http://www.amazon.de/Detailtypografie-Nachschlagewerk-alle-Fragen-Schrift/dp/3874396428">http://www.amazon.de/Detailtypografie-Nachschlagewerk-alle-Fragen-Schrif...</a></p>
      <p>The second one 'Lesetypographie' is about typography in multiple pages.<br><a href="http://www.amazon.de/Die-neue-Lesetypografie-Hans-Willberg/dp/3874396525">http://www.amazon.de/Die-neue-Lesetypografie-Hans-Willberg/dp/3874396525</a></p>
      <p>I have heard about or maybe even seen an english translation of one of the volumes.</p>
