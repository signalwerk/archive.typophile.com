      <p>Partly.</p>
      <p>But consider too that the proportions Bringhurst advocates work best with large format books opened flat on a table. Modern binding techniques (i.e., not Smythe sewn) don't really open flat, and the binding removes a considerable part of the inside margin. Books are three-dimensional objects; a frequent "design" error I see is to treat them as two-dimensional.</p>
      <p>As to The Grid, well of course you need one, but one of the best lectures I heard was given by Richard Eckersley -- In typical Richard fashion, he told a story of a poor design he'd done by sticking to his grid for the front matter. He wound up redoing the front matter (for himself, as an exercise, after the book was published) and treated each front-matter display page on its own merit (no grid). Much better result. Of course, Richard began his career as a poster designer and understands that aspect of graphic arts, but spent over 30 years as a book designer.</p>
      <p>As to the cost factor and the commercial aspect, you use less paper setting 10/13 &amp; having wider margins. Moreover, the small area of publishing I'm involved with (scholarly publishing) offers designers less in salary, but far more in creative control. It isn't a matter of costs.</p>
      <p>FWIW</p>
