    html: |-
      <p>Your absolutely right that working out each detail in its own way is always better than working with a system or grid, adding more detail to the proceedings and working based on the content rather than on the system. But I guess grids, measures and systems are also a personal fascination, like finding the 'perfect' grid is like finding the holy grail, I know its mythical and not reality but that exactly interests me. </p>
      <p>Another good point is that a book is a 3-dimensional object. With program's like InDesign and QuarkExpress one all too often forgets this until the book comes back from the printers. Hands on feeling is key to a succesful book, however nice the page may be.</p>
      <p>Thanks for the comments!</p>
