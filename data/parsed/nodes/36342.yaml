    <p>After thoroughly enjoying Bringhurst's "the elements of typographic style" I was wandering if you could recommend good books or other resources on the combination of typography in combination with page design/layout. This includes grid systems and theories how to build them and use type within them... Sounds a bit vague? I guess, but Bringhurst brought up the topic and just left me wanting MORE! Any good tips??</p>
    <p>THX</p>
