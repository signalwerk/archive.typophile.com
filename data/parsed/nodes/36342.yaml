      <p>I can imagine that Bringhurst is not 'used' a lot for commercial work, as he is not so much talking about cost-efficiency but more about the 'poetics' of the page. It's use of poetical and musicl language to create beautiful pages might not be the most concrete and efficient way, but I like the idea of finding meaningful ways of ordering the page, and connecting these fields with it seems a good approach.</p>
      <p>cheers Queneau</p>
