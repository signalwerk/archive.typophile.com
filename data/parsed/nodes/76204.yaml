      <p>from robofab.world import CurrentFont,CurrentGlyph<br>
      font = CurrentFont()</p>
      <p># make a list to collect your data<br>
      stuff = []</p>
      <p># naming attributes<br>
      stuff.append(font.info.fullName)<br>
      stuff.append('---------------------------------------------------------') </p>
      <p>for glyph in font:<br>
      	stuff.append('    ')<br>
      	stuff.append(glyph.name)<br>
      	stuff.append("(glyph has %d contour)" % len(glyph))<br>
      	stuff.append('-------------------------------') </p>
      <p>	for contour in glyph:</p>
      <p>		#stuff.append(`contour`)</p>
      <p>		stuff.append("  This contour has %d segments" % len(contour.segments)) </p>
      <p># make up a path where you want to save<br>
      # if you run this script in fontlab<br>
      # you need to provide a full path</p>
      <p>import os.path<br>
      path = os.path.join( os.path.split(fl.font.file_name)[0] , "segmentos.txt")<br>
      f = open(path, 'w')<br>
      f.write("\r".join(stuff))<br>
      f.close</p>
