    html: |-
      <p>You can use the robofab framework. A robofab glyph has a "isCompatible" method:</p>
      <p><code><br>
      <strong>isCompatible(self, otherGlyph, report=True):</strong><br>
      """Return a bool value if the glyph is compatible with otherGlyph.With report = True, isCompatible will return a report of what's wrong. The interpolate method requires absolute equality between contour data. Absolute equality is preferred among component and anchor data, but it is NOT required. Interpolation between components and anchors will only deal with compatible data and incompatible data will be ignored. This method reflects this system."""<br>
      </code></p>
      <p>... and it works on PC</p>
      <p>Eigi</p>
