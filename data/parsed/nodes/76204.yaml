  html: |-
    <p>Hello there:</p>
    <p>As there is nothing like Prepolator for PC....<br>
    I'm thinking of some kind of basic script to help PC users to prepare fonts for "mask to master" interpolation.</p>
    <p>Nothing too complex, maybe something simple like this:</p>
    <p>For each glyph in the current open font:<br>
     - Count number of points<br>
     - Count number of contours<br>
     - Save list as .txt file, or just output somewhere that can be copied and pasted.</p>
    <p>So, we can run the script in 2 fonts, open the list in excel &amp; quickly find the glyphs that needs more tunning to be compatible.<br>
    Can this be done? Where do I star looking for info to code this?</p>
    <p>Thanks in advance.</p>
