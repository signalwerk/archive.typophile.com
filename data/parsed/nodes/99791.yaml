      <p>I don't hate Comic Sans, but it certainly does have some less desirable aspects. Mostly, it is super inconsistent. I tried to line up the vertical strokes, and make everything the same height, and avoid the handwriting squiggles. I know there are tons of other comic fonts out there, and the world doesn't need another one. I just wanted to give people an alternative that fits in the same space, and doesn't suck quite as much.</p>
      <p>I figured out the name, too. Comic Relief.</p>
      <p>What is that font, by the way?</p>
