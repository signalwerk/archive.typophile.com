    <p>I know everyone loves to hate on Comic Sans, and I was having trouble finding a metrically equivalent replacement for it, so I made one. My concept is "what if Vincent Connare had a ruler?" I'm trying to maintain the character that people love about Comic Sans, while removing the oddities and irregularities. Using the same metrics means there is still plenty of WTF in here, but hopefully it is an improvement. This is my first font, so it's probably pretty rough.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/spans preview_4341.png"></div><p></p>
    <p>Here's a comparison to Comic Sans</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lipsum_6353.png"></div><p></p>
    <p>I also need a name. I was thinking "Liberation Comic", but it wouldn't officially be a part of the Liberation fonts. Maybe "Comic Spans" because it spans the same space as Comic Sans.</p>
