      <p>Shortcut? It's <em>more</em> work... It's not like Comic Sans has like cosmically good spacing worth copying.  :-)</p>
      <p>And I think if the plan is to come very close to the black forms of some existing font, you might as well make the spacing identical, just in case...</p>
      <p>One thing though, Jeff: I'm not sure this would be OK to release - and even less OK to sell. Apple might have gotten away with Chalkboard, but that's why some people don't respect Apple's role in typography any more.</p>
      <p>hhp</p>
