  html: <p>It's very <a href="http://www.myfonts.com/fonts/linotype/melior/" target="_blank">Melior</a>-like, but it's not Melior. <a href="http://www.myfonts.com/fonts/urw/renault/" target="_blank">Renault</a> is also similar. I suspect they were custom designed for the ratings board when they were introduced in the late 1960s. <a href="http://www.filmratings.com/images/poster5.jpg" target="_blank">This poster</a>, which shows all of them together, seems to support this. The ratings that were added later--NC-17 and the 13 in PG-13--don't match the style. In the early years of the system, there was also X, and, for a short time, M and GP.</p>
  html_clean: <p>It's very <a href="http://www.myfonts.com/fonts/linotype/melior/" target="_blank" class="link-external">Melior</a>-like, but it's not Melior. <a href="http://www.myfonts.com/fonts/urw/renault/" target="_blank" class="link-external">Renault</a> is also similar. I suspect they were custom designed for the ratings board when they were introduced in the late 1960s. <a href="http://www.filmratings.com/images/poster5.jpg" target="_blank" class="link-external">This poster</a>, which shows all of them together, seems to support this. The ratings that were added later--NC-17 and the 13 in PG-13--don't match the style. In the early years of the system, there was also X, and, for a short time, M and GP.</p>
