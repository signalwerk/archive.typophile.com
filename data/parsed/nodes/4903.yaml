    html: "<p>Wow, they didn't even bother to use the same font for the \"13\" and the \"NC-17\"�the \"13\" looks Korinna-ish, and the NC-17 Palatino-ish, but they don't seem to match digital versions exactly. <br> <br>As for the other fonts: RESTRICTED is <a href=\"http://www.myfonts.com/fonts/linotype/helvetica/black/testdrive.html?s=RESTRICTED&amp;p=48\">Helvetica Black</a>, but I don't know about the \"UNDER 17...\". Superficially it looks like Alternate Gothic or Trade Gothic Bold, but the Q and R clearly don't match those. The only face I know that combines that kind of Q with that kind of R is Folio, but I can't seem to find a weight of Folio that matches that sample.  <br></p>"
    html_clean: "<p>Wow, they didn't even bother to use the same font for the \"13\" and the \"NC-17\"�the \"13\" looks Korinna-ish, and the NC-17 Palatino-ish, but they don't seem to match digital versions exactly. <br> <br>As for the other fonts: RESTRICTED is <a href=\"http://www.myfonts.com/fonts/linotype/helvetica/black/testdrive.html?s=RESTRICTED&amp;p=48\" class=\"link-external\">Helvetica Black</a>, but I don't know about the \"UNDER 17...\". Superficially it looks like Alternate Gothic or Trade Gothic Bold, but the Q and R clearly don't match those. The only face I know that combines that kind of Q with that kind of R is Folio, but I can't seem to find a weight of Folio that matches that sample.  <br></p>"
