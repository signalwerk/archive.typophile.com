      <p>Thanks! I was wondering though: if you're using a Regular weight for your copy, when you bold that, do you use Medium (if there is one) or Bold as defined by the foundry? </p>
      <p>The same goes for if you were using Light: do you “bold” it with Regular, or with Medium, or with Bold?</p>
      <p>Or is it up to the setter?</p>
      <p>I guess why I'm asking is, in the case of DIN, should I get regular, bold (skipping medium), and italic? or medium, bold, and medium italic?</p>
