    <p>I'm thinking of buying <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_din_ot_collection/" rel="nofollow">FF DIN</a>. </p>
    <p>Which style would you guys say are most important?</p>
    <p>I wanna just get Regular, Bold, and Italic but the Medium, Black and Condensed look so tempting. Should I get italics for each variation? </p>
    <p>Except, $915 for the whole collection is a little ridiculous for my budget.<br>
    Does anyone know if FontFont gives student discounts? :D</p>
