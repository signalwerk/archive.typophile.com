    html: |-
      <p>Text: For the most basic use reg, italic and bold is fine. A really complicated editorial task might need medium or semibold+italics (or even better, a smaller optical size) and at times also a bold italic. But is DIN a text face? And how dark do you want your "regular" to be?</p>
      <p>Display: Anything goes, but the zeitgeist seems to be high contrasts: very dark vs. very light, thick vs. thin, or ornateed/untypical details: and in the case of DIN, perhaps the rounded version. Editorial work is much more convenient with a condensed and a compressed version.</p>
      <p>Disclaimer: This all depends on the kind of work you want to do.</p>
