      <p>I forgot to mention that both the E+F version and the Scangraphic version has been mastered in OpenType PS format by Elsner+Flake. I have no idea what the royalties distribution looks like but I imagine that either version you buy, E+F, Scangraphic and Volker Küster get their due percentages. </p>
