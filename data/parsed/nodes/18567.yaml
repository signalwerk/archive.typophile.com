    <p>What are the differences between these versions of Today Sans?</p>
    <p><a href="http://www.myfonts.com/fonts/ef/today-sans/today-b-ef-regular/" rel="nofollow">Today B EF Regular</a><br>
    <a href="http://www.myfonts.com/fonts/ef/today-sans/today-h-ef-regular/" rel="nofollow">Today H EF Regular</a><br>
    <a href="http://www.myfonts.com/fonts/efscangraphic/today-sans-sb/regular/" rel="nofollow">Today SB Regular</a><br>
    <a href="http://www.myfonts.com/fonts/efscangraphic/today-sh/regular/" rel="nofollow">Today SH Regular</a></p>
    <p>The EF varieties come from Elsner+Flake, but where do the SB and SH versions come from?<br>
    What's the significance of B, H, SB, SH?</p>
    <p>Excuse my naivete, but Volker Küster must have designed Today Sans in a format other than digital ... so these are all redrawn? Is any one version particularly good?</p>
