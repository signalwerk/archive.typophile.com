      <p>The Headline version is spaced considerably tighter than the Bodytext version. The Bodytext version has ink traps, and the brochure says that its "terminal strokes have been slightly accentuated". I'm not sure it this is still so, the big Scangraphic type overview shows differently positioned/sized guillemets, !?¡¿, parentheses, brackets, percent &amp; perthousand signs for Bodytext and Headline (earlier called "Bodytype" and "Supertype").<br>
      The typeface was digitized with Ikarus, was drawn before, and is based on writing.<br>
      (The ultra/ultra italic is one of the funniest fat faces I know.)</p>
