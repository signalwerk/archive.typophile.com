    date_raw: 16 Mar 2006 — 6:59pm
    votes: null
    html: <p>Today Sans and Cronos have very similar proportions and basic lettershapes, such that a page of Today Sans and a page of Cronos will have the same overall colour and typographic texture. But the treatment of the detailing is very different, and the larger the type size the more obvious the difference in flavour this produces. Cronos is softer, Today Sans is more formal. Together, they present an interesting example of the degree to which detail treatment contributes to the individual character of two typefaces whose basic structure is almost identical.</p>
