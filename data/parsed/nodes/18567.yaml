      <p>The body/headline versions differ only in spacing but then there's two different digital releases: from E+F and from Scangraphic. Both versions come from the same Ikarus data but were converted into PostScript using different tools, and have received different spacing and kerning. I have recently checked both versions -- IMO, the kerning of the E+F versions is better than that from Scangraphic. </p>
      <p>A.</p>
