    html: |-
      <p>From <a href="http://www.fontshop.com/showfont.cfm?mid=22" rel="nofollow">Scangraphic</a>'s blurb at FontShop.com:</p>
      <p>"Scangraphic offers an extensive range of fonts, all available in two special Scangraphic design formats called “Bodytext” and “Headline”.</p>
      <p>Scangraphic Bodytext (“SB”) faces are ideal for text in small point sizes. The hairlines and serifs of the Bodytext faces are thicker than normal hairlines and serifs to make them more legible in fine print. In addition to this, they have a special ink-traps incorporated in the font design to prevent blurring and loss of print quality.</p>
      <p>The Scangraphic Headline (“SH”) faces are made for text in large point sizes. Scangraphic optimized the Headline fonts specifically for this purpose, for example, by narrowing the spacing of the fonts and re-designing the umlauts in order to make them work better aesthetically with the overall design."</p>
    html_clean: |-
