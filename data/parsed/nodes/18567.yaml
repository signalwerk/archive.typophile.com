      <p>Thanks everyone. Typophile forums are awesome.</p>
      <p>Stephen, you mentioned Adobe: <cite>They certainly aren’t completely redrawn Adobe-style optical cuts by any measure[....]</cite></p>
      <p>In researching the aforementioned versions of Today, I also came across the <a href="http://cgm.cs.mcgill.ca/~luc/cronos.html" rel="nofollow">Today Sans - Adobe Cronos story</a>. I don't have any of these faces to experiment with (and examples online don't help), so I can't decide on much, but the Adobe faces I own have served me well. I'm faced with the ethical question of whether or not to use Cronos. Should I buy from a company whose type I trust to be complete, or should I expend more effort (and pester more typophiles for answers) to research slightly different versions of Today from unfamiliar foundries?</p>
      <p>I think it would be an injustice to dishonor Küster by purchasing Cronos, but I have reason to assume that Cronos would be a wiser investment. A good part of the project I would purchase for deals with on-screen use, and the Adobe faces I've dealt with have worked very well on-screen.</p>
      <p>Does anyone have an opinion about the on-screen anti-aliasing of Today (any version) or Cronos?</p>
      <p>Adam, you mentioned that: <cite>[...] the kerning of the E+F versions is better than that from Scangraphic</cite>, and <cite>[...] both the E+F version and the Scangraphic version has been mastered in OpenType PS format by Elsner+Flake</cite>. Do you have any experience with Adobe Cronos? If so, how does it compare?</p>
