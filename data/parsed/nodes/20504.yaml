    <p>I've been searching the Adobe.com website high and low and can't seem to find a list (PDF or txt) of all the typefaces included in the current edition of the Adobe Font Folio. Does anybody know where to find it (before I start bugging Adobe customer support)?</p>
    <p>THX</p>
