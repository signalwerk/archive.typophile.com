  html: |-
    <p><a href="http://www.high-logic.com/" rel="nofollow">High-Logic B.V.</a> proudly announces Scanahand 2.0, a font generator for Windows that allows users to <a href="http://www.high-logic.com/scanahand.html" rel="nofollow">make their own custom fonts</a> . Simply print a template, draw all of the characters using a black marker or felt-tip pen, and scan your drawing. Scanahand will build your font, and install it, ready for you to use.</p>
    <p>The standard edition allows you to create fonts that support English and most Western European languages. The premium edition does even more, as it allows you to make and use your own templates. For each template you can define your own character set, so it allows you to create multilingual fonts that suit your needs.</p>
    <p><a href="http://www.high-logic.com/download.html" rel="nofollow">Download your free trial version</a> of Scanahand now, and see how quickly and easily you can turn your handwriting into a font.</p>
    <p>Scanahand runs in reduced functionality mode during the trial period. The standard edition <a href="http://www.high-logic.com/register.html" rel="nofollow">costs $49.00(US) for a single-user license</a>. The premium edition <a href="http://www.high-logic.com/register.html" rel="nofollow">costs $79.00(US)</a>.</p>
    <p>High-Logic B.V.<br>
    <a class="freelinking external" href="http://www.high-logic.com/" rel="nofollow">http://www.high-logic.com/</a></p>
