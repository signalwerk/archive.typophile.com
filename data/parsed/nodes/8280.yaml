    <p>Hello, <br>Just finishing up a bottle redesign.  Some of you may recognize this project from a couple years back.  Reworked the logotype and typo in general. <br> <br>Thought I would solicit some feedback. This is for a screenprinted bottle, all black will be matte ink on a jet black glass.  Capsule will be red wax. <br> <br>This is a high-end napa cab. <br> <br>Thanks in advance. <br> <br> <br>jpeg of the front and back (Cabernet &amp; Sauvignon wrap around the sides of the bottle) <br><img src="http://www.typophile.com/forums/messages/29/56340.jpg" alt=""> <br> <br>here's a pdf of the bottle (flat mechanical file) <br><!--attachment: amicus_CSbottle1_2-56341.pdf*mime_pdf.gif*application/pdf*1246.6**amicus_CSbottle1%2e2%2epdf --></p><center><br>
