    html: <p>Hello, <br> <br>Very nice, clean, and elegant design. I don't see anything that needs improving, but if I had to throw out suggestions... <br>I might try adding a little more of the red somewhere – perhaps on the rules that wrap around the bottle. <br>And, hmmm, maybe tighten up the kerning on A/M of Amicus a wee bit.  <br> <br>Looks great! <br> <br>Cheers!</p>
