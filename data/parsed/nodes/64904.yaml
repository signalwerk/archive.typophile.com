  html: |-
    <p>As many here are aware, at</p>
    <p><a href="http://www.archive.org/" title="http://www.archive.org/">http://www.archive.org/</a></p>
    <p>a number of old specimen books, from ATF and others, are now available on the Web.</p>
    <p>I recently noted a typeface in one old ATF specimen book, called "Washington", that was immediately recognizable. (It didn't stick around much in later editions of their specimen book, however, although one other one had a light weight of that typeface. The different weights had different names.)</p>
    <p>I finally found this page</p>
    <p><a href="http://kleinletters.com/Blog/?p=634" title="http://kleinletters.com/Blog/?p=634">http://kleinletters.com/Blog/?p=634</a></p>
    <p>which discusses the different names under which this font was kept alive: a digital version now exists under the name Mephisto.</p>
    <p>Apparently, the version Ace Books used for their small-format pocket book editions of the Venus and Pellucidar books by Burroughs (as well as other related books) was called Alexandra, and provided by a small company called Photo-Lettering, according to that article.</p>
