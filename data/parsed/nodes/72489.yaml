    <p>Hello all, long time lurker, first-time poster.<img src="/sites/default/files/old-images/whatsthis_6419.gif"></p>
    <p>This scan (doctored, original in metallic silver over brown) is from a series of touristic brochures made in Italy no more than five years ago. I have to make a new one of those, but for the life of me cannot identify this font (and the original designer is proving extremely hard to get in touch with). What The Font has a hard time with it and brings to no conclusive results. The same goes with Identifont and fontshop's type navigator. </p>
    <p>Results obtained from research and posting elsewhere suggest an Emigré-esque look to it (Modula is a tiny bit similar, esp in the M) or Neville Brody (FF Dome) or even FF Dog (Paul Sych). In my opinion it has a 1990s feeling to it, but other than that I'm starting to be completely stumped.</p>
    <p>Thanks in advance,</p>
    <p>d</p>
