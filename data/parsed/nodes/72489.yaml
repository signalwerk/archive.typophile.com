      <p>Mark, You should be a detective!</p>
      <p>_dario, I'm happy to anyone a copy free of charge.</p>
      <p>Ha ha! Ironically, I was lecturing/demonstrating to my design students about "googling" yourself and this link popped up onto the projector. </p>
      <p>Well, class has just ended and I wanted to reply. The original lettering was based on some headlines I created for a Reebok print campaign at Leo Burnett in the '90s. Those headlines were in a "distressed" style, and at the urging of Carlos Segura and Scott Smith (back when we were first starting T-26)  I created a "more complete" alphabet in two weights - Normal and Organic.</p>
      <p>My apologies in advance for all the kerning you'll have to suffer through!</p>
      <p><img src="/sites/default/files/old-images/deccosample_5522.jpg"></p>
