    votes: null
    html: |-
      <p>Use this</p>
      <p><code><br>
      feature locl {<br>
      	script latn;<br>
      		language TRK;<br>
      			lookup ITRK {<br>
      				sub i by i.TRK;<br>
      			} ITRK;</code></p>
      <p>		language AZE;<br>
      			lookup ITRK;</p>
      <p>		language CRT;<br>
      			lookup ITRK;<br>
      } locl;<br>
      </p>
      <p>With this</p>
      <p><code><br>
      feature smcp {<br>
        sub @latin_lc by @latin_sc;<br>
        sub dotlessi by I.smcp;<br>
      } smcp;<br>
      </code></p>
      <p>And make the glyphs <code>i.TRK</code> for lowercase, <code>Idotaccent.smcp</code> for small-caps, and <code>Idotaccent</code> for upper-case.</p>
      <p>(Sorry for the formatting, it's Typophile's fault.)</p>
    html_clean: |-
