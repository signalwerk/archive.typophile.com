      <p>Highlights in this Issue</p>
    <p>&lt;1&gt; New Free Font This Month: Harlow</p>
    <p>&lt;2&gt; What’s Hot from ITC: ITC Berkeley Oldstyle Pro</p>
    <p>&lt;3&gt; Font of the Month: ITC CuppaJoe - Save 10%</p>
    <p>&lt;4&gt; fy(t)i: Thinking Small</p>
    <p>&lt;5&gt; Big Savings on the Family Fun Value Pack</p>
    <p>&lt;6&gt; Creatively Speaking: -Mark Twain</p>
    <p>———————————————</p>
    <p>&lt;1&gt;New Free Font This Month: Harlow</p>
    <p>Harlow is a monolineal outline script that recalls letterforms popular in the 1930s and 40s. Designer Colin Brignall created a strong baseline effect like that of an old automobile manufacturer logo so the lowercase letters would touch or slightly overlap in word settings. The TrueType versions of Harlow are free with any purchase on ITCFonts.com for the month of June.</p>
    <p><a href="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2476&amp;et=T&amp;s=47007&amp;da=0" title="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2476&amp;et=T&amp;s=47007&amp;da=0">http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2476&amp;et=T&amp;s=47007&amp;da=0</a></p>
    <p>———————————————</p>
    <p>&lt;2&gt; What’s Hot from ITC: ITC Berkeley Oldstyle Pro</p>
    <p>Meet ITC Berkeley Oldstyle Pro, a lovely and practical font family. With this release, one of Frederic Goudy’s favorite designs is finally available in OpenType format. Now graphic communicators can work with this beautiful design while taking advantage of OpenType’s capabilities, including the automatic insertion of old style figures, ligatures and small caps.The new ITC Berkeley Oldstyle Pro fonts offer an extended character set supporting most Central European and many Eastern European languages, in addition to English.</p>
    <p><a href="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2467&amp;et=T&amp;s=47007&amp;da=0" title="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2467&amp;et=T&amp;s=47007&amp;da=0">http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2467&amp;et=T&amp;s=47007&amp;da=0</a></p>
    <p>———————————————</p>
    <p>&lt;3&gt; Font of the Month: ITC CuppaJoe - Save 10%</p>
    <p>Nick Curtis’s inspiration for ITC CuppaJoe comes from Art Deco lettering, but not from the typical sources. Its foundation is the label art for Bokar, A&amp;P’s premium coffee during the 1930s. Curtis built on the gently sweeping curves and bold angular strokes of the original coffee-can lettering to create a distinctive typeface that commands attention. And, at 10% off, this rich, full-bodied typeface is as satisfying as a CuppaJoe!</p>
    <p><a href="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2477&amp;et=T&amp;s=47007&amp;da=0" title="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2477&amp;et=T&amp;s=47007&amp;da=0">http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2477&amp;et=T&amp;s=47007&amp;da=0</a></p>
    <p>———————————————</p>
    <p>&lt;4&gt; fy(t)i: Thinking Small</p>
    <p>Like Alice in Wonderland, type can be made to grow big or small depending on our whim. In Part II of a two-part article on font sizing, Ilene Strizver discusses when - and when not - to set display fonts at small sizes.</p>
    <p><a href="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2470&amp;et=T&amp;s=47007&amp;da=0" title="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2470&amp;et=T&amp;s=47007&amp;da=0">http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2470&amp;et=T&amp;s=47007&amp;da=0</a></p>
    <p>———————————————</p>
    <p>&lt;5&gt; Big Savings on the Family Fun Value Pack</p>
    <p>Fire up the grill and start sending those barbeque invitations! Summer is nearly here, and to celebrate we are offering the Family Fun ValuePack at 10% off. This entertaining package includes ITC Jambalaya, Lambada, ITC Kristen, Pump Regular, ITC Ziggy and ITC TotSpots. Purchase before the end of June to receive your discount.</p>
    <p><a href="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2479&amp;et=T&amp;s=47007&amp;da=0" title="http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2479&amp;et=T&amp;s=47007&amp;da=0">http://msg1svc.net/servlet/Gateway?p=AGFAITC&amp;u=2479&amp;et=T&amp;s=47007&amp;da=0</a></p>
    <p>———————————————</p>
    <p>&lt;6&gt; “You can’t depend on your eyes when your imagination is out of focus.”</p>
    <p>-Mark Twain</p>
