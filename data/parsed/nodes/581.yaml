    date_raw: 5 May 2002 — 10:30pm
    votes: null
    html: <p> Nice work! But to put a spanner in the works... I think the discussion about the irregularities is putting the cart before the horse, not least because they only seem apparent at 120 point or above. Personally I think the weight is wrong. I think you have a great idea here for a font that looks like a genuine 19th century Tuscan, but I think if they were making this design in those days they would have either made the stroke weight bolder and kept the ornamentation the same size, or they would have perhaps made the stroke weight slightly thinner and emphasized the ornamentation. I have yet to see an easy to read Tuscan, but there are beautiful ones, for sure.  <br> <br>Without going all the way and turning all the serifs into these ornamental "claws" - and possibly turning this font into something that has already been done 120 years ago - you might experiment more with the serifs and terminals. <br> <br>Sorry if I sound negative. Despite the criticism I think you are onto something very nice here. </p>
