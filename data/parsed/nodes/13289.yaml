  - id: 76742
    user: 3368
    date: 2005-06-24T22:22:00
    date_raw: 24 Jun 2005 — 10:22pm
    votes: null
    html: |-
      <p>Eklektic and Legerdemain are both digitizations of the old VGC typeface Elektrik (two k's) and either is about as legit a version as you are going to find.&nbsp; Eklektic came with my version of CorelDraw (8) as well.&nbsp; Eklektik has a Corel copyright,&nbsp; not BT,&nbsp; and Buyfonts is offering the old Fontbank fonts.</p>
      <p>Firenze ITC is bundled also on the same CD.</p>
    html_clean: |-
