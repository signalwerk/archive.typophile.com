      <p>I can certainly see the Titillium and Klavika influences. There's also a fair bit of Interstate in there as well, I think. Your challenge should be to differentiate it from Titillium, because at the moment, they are remarkably close. A few comments:</p>
      <ul>
      <li>T = straighten the left-hand crossbar</li>
      <li>e = the terminal is wider than the rest of the stroke</li>
      <li>q = where the bowl meets the stem, it looks too steep. Try raising the stem.</li>
      <li>J = very narrow!</li>
      <li>w (regular italic) = it looks unbalanced? Is it wider on the right than on the left?</li>
      <li>P = interesting terminal on the stem. Have you investigated giving the same terminals to all uppercase strokes with stems that terminate on the baseline?</li>
      </ul>
