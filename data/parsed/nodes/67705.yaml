      <p>I got this question as an e-mail and said I wasn't sure if it was a font. I looked through Part 1 of my Guide and think it may be a modification of Jukebox's <a class="freelinking external" href="http://search.veer.com/Annabelle?producttype=TYP&amp;category=Type" rel="nofollow">Annabelle</a>. At least the A seems right and the B is similar. Perhaps the B was redrawn to be simpler?</p>
      <p>- Mike Yanega</p>
