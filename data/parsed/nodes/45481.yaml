    <p>Hello,</p>
    <p>I’m working on a new identity for a group of old serious people.<br>
    The council discusses about socio-economic questions and submits it’s suggestions to the county.<br>
    At the moment, they use the county’s id, but they would like to have their own identity.<br>
    They want something that reflects what theay are, and that is also fresh, new and modern !<br>
    Obviously, fresh, new and modern is miles away from what they are. </p>
    <p>I don’t feel like giving them a pictogram, so I was thinking about fresh colour and a logo of letters, but I already can hear them say “we could have done this by ourselves” (Yes that’s the kind of guys I’ve got to struggle with...)</p>
    <p>Well, I’m now after letters that would <em>look like a logo</em>. </p>
    <p>I thought at first of <a class="freelinking-external" href="https://web.archive.org/web/20080905211617/http://www.fontshop.com/fonts/singles/psyops/reykjavik_two_d_gauge_oblique_ot/ "> reykjavik </a> but the uppercase E was of a bit too much, I decided then on FF Sanuk Bold italic, </p>
    <p></p><div class="imageWrap"><img src="/web/20080905211617im_/http://www.typophile.com/files/sanuk_3994.jpg"></div><p></p>
    <p>I feel this might be not enough, any help or advice would be really appreciated</p>
