      <p>Hardly. I use to run the recording studio at Duke University. We wanted to do something that might be construed as "unfair competition" (Duke is tax exempt), so went to see the university lawyer. "What's legal," he said, "is what I feel comfortable going into court and arguing." He was not bragging, he was being perfectly reasonable about both the law and lawyers..</p>
