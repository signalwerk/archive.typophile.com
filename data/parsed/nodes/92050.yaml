    html: <p>This brings up the whole subject of copyright in the world of fonts. It strikes me that no other art treads quite as fine a line between originality and infringement as type design does. After all, how different ways can you make an uppercase A before it is unrecognizable as an uppercase A.  Yes I know there are tens of thousands of different designs for the majuscule A, but I believe you all know what I'm getting at.  This issue becomes even more difficult when you get into specific genres, like grotesque sans.</p>
