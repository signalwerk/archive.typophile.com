      <p><cite>Yes, one can, of course, manipulate text one has printed in a font - but that, being less convenient, won't lose them sales of condensed versions of the font as separate products, they may feel.</cite></p>
      <p>Bad example. For example, using InDesign, just do the condensing once in the "Basic Paragraph Style," and base your other styles on that. However, beyond a small percentage, good condensing is usually more than just a mathematical formula. Try it &amp; see. </p>
      <p>On the other hand, there are some fonts where I think a 1% to 2% condensing actually improves the font. Arnhem Blond comes to mind, when used for books rather than the newspaper work for which it was originally designed (wonderful font, by the way). </p>
      <p>Even more -- if you need a new character, just start your own "supplemental characters" font, and sub them in with a grep search (with InDesign, anyway). The only issue is kerning, so get the side bearings right. Remember, in the States at least, a *design* cannot be protected by copyright, only data. I suppose you could even sell the supplemental character set in the States, under a different font name.. You might have to  have to prove you didn't copy the data from the original. Just keep the backgrounded character,  tracing, &amp; refining you made. Whether or not it is ethical would be another question. Personally, I'd find such sales unethical.</p>
      <p>About the only thing you can't do with an applications program is increase the weight of the glyphs in a font. But it wouldn't be impossible to add that feature ... </p>
      <p>Best would be for the EULAs to aim at anti-piracy rather than restricting an end-user from doing work. The font publisher is entitled to be paid for their work. However, in my opinion, that principle should not stop a user of type from accomplishing <cite>their</cite> work.</p>
