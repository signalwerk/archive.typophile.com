      <p>Two notes:</p>
      <p>While typeface designs may not be copyrighted in the United States, they can be <a href="http://www.uspto.gov/web/offices/com/iip/pdf/brochure_05.pdf" target="_new" rel="nofollow">patented</a>; one of the early U.S. design patents was issued to the Bruce Foundry in 1842. However, since  patents require a great deal more supporting material than copyrights, few designers avail themselves of patent protection.</p>
      <p>Second, in a civil lawsuit in the good old U.S. of A., the defendant must disprove the plaintiff's claims; in other words, in civil court, you're guilty until proven innocent. Failure to refute the plaintiff's claims generally results in summary judgment against the defendant.</p>
