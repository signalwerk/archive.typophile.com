      <p>Here's an example of hat I was talking about. It's getting pretty far afield, and I'm no lawyer. I just don't think normal individuals should believe a patent will protect their designs</p>
      <p>OK, as some of you know, I shoot benchrest. There was a guy, a writer, who got a patent on "the .300 Jamison." It was not new -- in fact, I'd been shooting something almost identical for some time before Mr. Jamison ever thought of it. But he got the patent, and threatened to sue Winchester &amp; Browning for some of their later cartridge developments. They settled out of court. Had they chosen to fight it, any number of us could have shown reamer prints (the reamer is what is used to cut the rifle chamber) predating Mr. Jamison's work. Winchester et al.  just figured it was cheaper to settle.</p>
      <p>Now consider type -- how can anyone hold, after 400 years of type design, that they've come up with something new &amp; better? I'm not even saying people haven't, but I'd think any lawyer worth his/her salt could show that something "new" had already been presaged.</p>
      <p>Getting a patent is fairly involved, but easy to "prove." Having that "proof" hold up is another matter;</p>
      <p><cite>Your invention is not new, as defined by U.S. patent law, if:</cite></p>
      <p><cite>    An identical (or too similar) invention was known or used by others in this country, or patented or described in a printed publication in this or a foreign country, before your invention was; or</cite></p>
      <p><cite>    Your invention was patented or described in a printed publication in this or a foreign country or in public use or on sale in this country more than one year prior to your application for a patent in the United States.</cite></p>
