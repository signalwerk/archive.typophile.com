      <p>Charles, US law recognises different kinds of patents. What most people think of when they hear the word is the kind of patent that applies to an invention, e.g. the proverbial better mousetrap. Such patents are properly called Utility Patents. Typefaces, and other forms of applied design, may be registered as <a href="http://en.wikipedia.org/wiki/Design_patent" rel="nofollow">Design Patents</a>, which is a different class of patent. It is quite specific and, as has been noted above, the very first design patent was granted to a typeface design, 170 years ago. One of the ways in which design patents are different from invention patents is that they are granted for a shorter limited term: 14 years from the date of filing.</p>
      <p>Other countries have similar provisions for design works, usually for similar periods of time, but use different terms. In Canada, the equivalent is a registered Industrial Design. So don't be confused by the term patent in US law and don't jump to the conclusion that it is silly without understanding the nature of design patents as distinct from invention patents.</p>
