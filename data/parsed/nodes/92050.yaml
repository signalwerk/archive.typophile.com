      <p>If an application is able to take the transformed <em>output</em> of a font and produce from that a new font, that wouldn't be violating the EULA prohibition against modifying the licensed font data, but depending on how the process worked it might violate other terms of the EULA regarding creation of derivative works. For example, if the process involved converting to outlines and then writing those outlines to a font file, that would seem to me pretty obviously a derivative work -- akin to the process that SSi used when producing derivatives of Adobe fonts --, whereas tracing the results of a Photoshop filter applied to text might not.</p>
      <p>None of this is a grey as you want to make it.</p>
