  html: <p>Maybe I'm reading these things wrong, but it seems some of these font's EULAs state I cannot transform the font in any way.  Does this seriously mean if I use the font in a design program and stretch it vertically that I am breaking the law?  For a font I paid for?  This just seems incredulous.</p>
