  html: |-
    <p>I just installed it, and it's quite interesting reading Typophile on it. There's one issue though, I can't login or post via Lynx, which is really too bad.</p>
    <p>Anyone else use Lynx? I think it's nice because all of the superfluous images that the web throws at you are gone. Instead, what is left is nice, clean text for reading.</p>
    <p>Good stuff.</p>
