      <p>I often use Lynx in dump mode to get some clean input. For instance, on my Linux server, if I type<br>
      <code><br>
      lynx -dump "http://www.antonchehov.ru/book/149/" &gt; dama.txt<br>
      </code><br>
      I get a rather clean unicode text file containing Chekhov's Дама с собачкой in Russian.</p>
      <p>Michel</p>
