    html: |-
      <p>I’ve been using Lynx essentially every day for the last dozen years. Typophile has a lot of unnecessary examples of standards noncompliance, and the login screen is one of them. It appears to require JavaScript or something, which is quite unnecessary. Also, the content area is entirely inside a Flash movie, also quite unnecessary.</p>
      <p>It borders on impossible to have a conversation about Web standards on this site without either being ignored or being told that it works fine in IE6, so I’ve long since given up.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
