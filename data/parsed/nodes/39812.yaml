      <p>Don, terms like "intolerance" I reserve for discussions at typophile, principally because of all people involved with type, designers and typographers can least afford to be intolerant. If a client objected to the ampersand in question on the grounds they think it looks ugly, that's their prerogative. They are entitled to their opinion as they are paying for consultation. I would not challenge or object to such a view. Only a fool would tell the client they are intolerant.</p>
      <p>This isn't a discussion with a client. This is typophile.</p>
      <p>I don't mind as long as somebody else is paying.</p>
      <p>j a m e s</p>
