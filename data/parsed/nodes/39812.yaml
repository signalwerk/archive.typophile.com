      <p>A crapshoot it can be for sure :) I once used the Fell pica italic unit on a huge billboard, with a picture on the left, ampersand in the middle, brand name on the right, equals sign, and the word "bliss" at the end. A kind of word and image puzzle. The client loved it, but when my boss saw it he flipped, "Are you fugging nuts? What's that &nbsp;t h i n g&nbsp; in the middle supposed to be? Don't ever do that again!"</p>
      <p>Ah well, I got a good laugh out of it. Told them, "In this business the only available rules are those of the gunfighter." In the sense that ads are so often hit or miss affairs. You just can't predict how people will react.</p>
      <p>j a m e s</p>
