      <p>The trouble with the ampersand in FF Olsen, in addition to the mere novelty, is that it juxtaposes a capital letter and a lowercase letter - <em>and</em> they have different weights. That can be legitimately questioned from an æsthetic point of view.</p>
      <p>Creativity and originality aren't "bad", but if a typeface is in some aspects outré or self-indulgent, whether in the design of the ampersand, or the letter Q, or some other such matter, it's entirely reasonable to look for an alternative typeface that can fulfill the same role without distracting elements.</p>
      <p>While the ampersand, unlike most other special characters, usually <em>was</em> designed specifically for each given typeface even in the days of foundry type, the technical limitation of always using a Bodoni-ish version of the sorts @, #, %, and * did at least have one thing to be said for it - problems in recognizing these less-common characters were avoided.</p>
    html_clean: |-
