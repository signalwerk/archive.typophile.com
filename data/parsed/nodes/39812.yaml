      <p>ROFL! In fact, I like all of the ones you posted -- they each have their charms, don't they?  ;-)</p>
      <p>That being said, I think using such exciting and personable characters can sometimes be a crapshoot. Something's that has been discussed rather frequently here (and that I am obsessively adamant about in classes I teach) is knowing the "rules" before trying to successfully break 'em. </p>
      <p>Quick example: the last newletter I used the Monotype Corsiva ampersand in was otherwise set overwhelmingly in ITC Tiepolo with Optima as subheads. When I switched over the template from PageMaker to InD, I turfed that ampersand, and had many complaints that it "didn't look 'right'."</p>
      <p>Needless to say, it was promptly reinserted in the next edition.  :-)</p>
