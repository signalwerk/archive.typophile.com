    <p>Okay, entirely subjective question here: I was recently wandering through the extra ampersands in the Poetica family - of which there seem to be too many for my feeble brain - and just wondered - what's everyone's favourite ampersand? Is it the most beautiful? Functional? Unobtrusive? Personally (Poetica aside) I must be a sole defender of Rotis here in saying I quite like that face's one.</p>
    <p>simon</p>
