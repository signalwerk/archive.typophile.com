      <p>On the other hand - just reflecting on how I read on the web here - there isn’t as much effort required in reading a single column as there is with navigating multiple columns.</p>
      <p>When the text is all in one column, I read 10-15 lines, scroll down, repeat. The eye doesn’t move across great distances, as it would when jumping from the bottom of one column to the top of the next.</p>
