      <p>We can -and need to- assume all kinds of things to be able to function. Like when we’re driving, we need to assume that the car next to us will NOT abruptly start driving across the lanes. But more to the point: we can <cite>confidently</cite> assume various things about the <cite>typical</cite> web browser. Like you know the DVD message that says “This movie has been modified to fit your screen”? I hate that, because they don’t know what my screen is. But if they said “modified to fit the typical screen” then I wouldn’t complain.</p>
      <p>&gt; most usability testing seems to indicate that people prefer vertical scrolling</p>
