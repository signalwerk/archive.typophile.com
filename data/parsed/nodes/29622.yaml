    <p>Is anyone aware of a JavaScript library or a collection of JS/CSS code snippets that takes care of finer points of typography such as first line paragraph indents (as opposed to vertical spaces between paragraphs)? </p>
    <p>I have not been able to find any yet, although it *seems* do-able. If it does not yet exist, I would like to try and tackle that, or suggest that the experienced coders look into it. It could, for example, become a plug-in module to the JQuery [www.jquery.com] JavaScript library.</p>
    <p>I’m hoping we can get a list started. What sort of typographic conventions are we  neglecting because they are not easily typeset on the web?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/32383" class="topic-previous" title="Go to previous forum topic">‹ Career changer from science to design.  Where do I begin?</a> <a href="/node/32357" class="topic-next" title="Go to next forum topic">[search]  Perform dynamic searches in Google ›</a></div>
