    html: |-
      <p>“Is anyone aware of a JavaScript library or a collection of JS/CSS code snippets that takes care of finer points of typography such as first line paragraph indents (as opposed to vertical spaces between paragraphs)?”</p>
      <p>CSS:</p>
      <p>p {<br>
      text-indent: 4em;<br>
      }</p>
      <p>Also, the best way to approach web typography is to let go of the ’finer points’ of control that you would normally have on paper. </p>
      <p>“The use of real Small Caps is one that comes to my mind”</p>
      <p>Again, CSS:</p>
      <p>yourTag {<br>
      font-variant: small-caps<br>
      }</p>
      <p>“Given the scrolling nature of the Web I would imagine that space between paragraphs is preferable to indented paragraphs for most forms of text setting.”</p>
      <p>I agree (though other’s may not, of course). The web is often more of a ’pan and scan’ medium where people are looking for excerpts vs. sitting down and reading an article from start to finish. Having the visual breaks between paragraphs makes that task a bit easier.</p>
      <p>Whatever you do, don’t indent AND have spaces between paragraphs. Way too redundant for my tastes. ;o)</p>
