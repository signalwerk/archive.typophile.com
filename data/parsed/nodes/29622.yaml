      <p>There might be something to the horizontal scrolling argument. Maybe the resistance  to (discomfort with)  scrolling this way has to do with the position of the  scrollbar? It could well have to do with right handedness and the vertical scroll conveniently placed to the right of the content. With a horizontal scrollbar reaching over way to the left to advance to the next column just does not <em>feel right</em>. Do the usability studies have any insights into why people prefer vertical / dislike horizontal scrolling?</p>
      <p>Just a speculation, but as people get used to the trackpad and mouse wheel scrolling (I have the Apple’s Mighty Mouse - unidirectional ball in mind), our natural reading habits may resurface and “turn the web on its side.”</p>
