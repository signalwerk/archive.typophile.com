      <p>Thanks for the resources, Alessandro. <a href="http://www.webtypography.net" title="www.webtypography.net">www.webtypography.net</a> is particularly useful. It had a solution to my original question, too:</p>
      <p>p + p {<br>
         text-indent: ...<br>
      }</p>
      <p>(“p + p” will intentionally ignore the first line)</p>
