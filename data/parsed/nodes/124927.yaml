      <p>At least some (and possibly all) of these problems are screen-only.</p>
      <p>The random thickening must be due to pixel rounding. Since you don't have hinting, the rendering engine is free to do what it likes (including not hinting at all). Hinting -- or lack thereof -- and on-screen representation depends on what text rendering engine you are using. Windows' is different from OS X's, and some software such as Adobe's Creative "Suite" have type rendering engines of their own. (I quote "Suite" because, as you found out, there are unaccounted-for differences between the individual programs.)</p>
      <p>If your primary target is for screen only, or you find it important, you need to address your issues, but: some of them cannot easily be fixed. The intercharacter white line/overlap problem, for example, is because a pixel needs to be drawn .. or not. Without overlap, the pixel may disappear due to rounding; with, you get a slightly fatter pixel than wanted.</p>
      <p>... Both the idea and its execution are pretty awesome, by the way.</p>
