      <p>Thank you, Theunis,<br>
      I agree the rendering issues are probably screen-only problem. I'm quite sure the outlines itself are OK.<br>
      And I know the rasterizing is really tricky in this very case, it will never be perfect at smaler sizes.<br>
      However I think at least all the glyphs should look consistent at certain pointsize - what should be the possible reason why some render bolder or lighter? (all the horizontal stripes/outlines are perfectly aligned and of exactly same width, ergo any eventual pixel rounding should be the same too?)</p>
      <p>I have tested it on PC only so far and it looks very similar over many different apps (Adobe and others)</p>
      <p>Regarding vertical gaps: I'm starting to believe that some small glyph overlap could make it better, I just wander what realtive value would be best.</p>
      <p>Cheers,<br>
      Vit</p>
