      <p>Cool project!<br>
      I can't help with the rasterization issues, but can assure you that changing out better fitting versions of letters can certainly be done with OpenType. What you want to look for are "contextual alternates."<br><a href="http://opentypecookbook.com/">http://opentypecookbook.com/</a> is a good introduction geared to those new to it.<br><a href="https://www.glyphsapp.com/tutorials/features-part-2-contextual-substitutions">https://www.glyphsapp.com/tutorials/features-part-2-contextual-substitut...</a> also might be useful (even if you're not using Glyphs).<br>
      For the leading, I would think you would want to leave it alone and trust the end-user to set the text solid if that's the desired effect.</p>
