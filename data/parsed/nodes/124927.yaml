      <p>To prevent those gaps, I'm pretty sure all you should need is one unit of overlap on each side.</p>
      <p>You can do your kerning thing with calt but you will probably have to do it without the little diagonal spacing glyphs. Opentype does one-to-one substitution or many-to-one; it won't insert more glyphs.</p>
