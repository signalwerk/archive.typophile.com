    html: |-
      <div class="comment-spam-body"><p>I have been surveying "typecast" websites for the last several weeks searching for typewriter type images to use in a fontmaking project. I regret that I am unable to identify your typewriter model.<br>
      I can, however, inform you that the base font for it's capital letters is found on the "element" [the thing that looks like a golfball] for IBM typewriters bearing the font Orator, designed for IBM typewriters by John Scheppler in 1962. Digital version sold by Adobe, Linotype and Bitstream as <a href="http://www.identifont.com/similar?TA" rel="nofollow">Orator</a>.<br>
      Some typewriter companies added a lower case to the Orator capitals.<br>
      Your typewriter font is rather rare in that the lower case is sans serif letters rather than serifed.<br>
      It may be digitized, but I have not come across it.<br>
      Perhaps one of our other typophiles has something for you.<br>
      Don</p>
      </div>
