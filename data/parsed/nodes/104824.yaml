      <p>Following this way I finally found what is this font.<br>
      It's the <a class="freelinking external" href="http://munk.org/typecast/wp-content/uploads/2011/04/NOMDA-type-Olivetti-03.jpg" rel="nofollow">Olivetti Elite Correspondence Gothic</a>.<br>
      And the machine was an Olivetti ET 2500 with "margherita" technologie.<br>
      Thanks Munk &amp; Don.</p>
      <p>Now if anyone know a digital version of this font, please let me know.</p>
