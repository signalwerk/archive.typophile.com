    <p>Hey.<br>
    I'm looking for informations about this typeface.<br>
    It come from a french rural town museum.<br>
    I suppose the text is composed with an 80's electronic typewriter.<br>
    If anyone have an idea about this typeface, machine model ... and if it's still digitalized, please let it know.<br>
    Thanks.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/typewriter1_3614.png"></div><br>
