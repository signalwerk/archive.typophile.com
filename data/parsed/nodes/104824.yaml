    html: |-
      <div class="comment-spam-body"><p>You're welcome.<br>
      Information on typewriter font styles was published annually in the NOMDA Blue Book, the "blue book",  as late as the 1970s, and perhaps the 1980s.  Separate sections or books for each manufacturer. Some parts have been scanned and are available on-line at: <a href="http://munk.org/typecast/?s=blue+book" title="http://munk.org/typecast/?s=blue+book">http://munk.org/typecast/?s=blue+book</a>.<br>
      If you can find a typewriter repair shop -- I expect they are almost extinct -- they may have copies that you could consult.<br>
      If you wish to undertake further research into typewriters Munk's page has a good set of links to get you started on exploring the "typosphere."<br>
      Good luck and good hunting.<br>
      Don</p>
      </div>
