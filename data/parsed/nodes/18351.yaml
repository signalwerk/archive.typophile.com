      <p>Yes, I know lots about the next version of InDesign, and no, I can’t say anything.</p>
      <p>I got the original magazine article, and it was quite interesting. Their headline for the software part of the survey results? “Adobe, Microsoft, Quark are the 3 Kings.”</p>
      <p>The survey had 67 responses from production managers responsible for 171 magazines altogether. Statistics Canada says there are 2383 magazines published in Canada, so that’s about 7% of the total magazines. If it were a ransome sample, that would be enough to be pretty representative, but of course it’s not. Hard to say just how representative it is.</p>
      <p>Some of the other stats from the same survey were interesting. For example...</p>
      <p>2003: 10% on OS X, 48% more planned to adopt within 12 months.<br>
      2006: 82% on OS X, 11% more plan to adopt within 12 months.</p>
      <p>Ad files submission:</p>
      <p>2003: 42% app file, 6% “Wacko &amp; other,” 30% PDF (28% X-1a, 2% regular), 11% PostScript/EPS, 8% TIFF-IT, 2% film</p>
      <p>2006: 17% app file, 19% “Wacko &amp; other,” 40% PDF (18% X-1a, 22% regular), 14% PostScript/EPS, 7% TIFF-IT, 3% film</p>
      <p>“Wacko &amp; other” is a category that includes taking PowerPoint, Word and other odd (for publishing) file formats. I was surprised to see the growth there, but I guess it means that people are being more responsive to customer demands. Interesting to see the 25% decrease in app file usage but only a 10% increase in PDF.</p>
      <p>Proofing takes many forms, but the single most common approach? None, at 23% (up from 18%).</p>
      <p>Cheers,</p>
      <p>T</p>
