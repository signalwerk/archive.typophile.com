      <p>I think the fullness of the subject matter is that Quark 3.xx-6.5xx has soooo many more pages than any competititon combined, that by saying “well now, my pagelayout program has x% of the market…” blah blah blah. I like IDcs2, but to me, Quark is  easier to navigate with its box implementation. Misleading too, is the CS concept. If I buy Quark, I’m going to use it, if I buy CS2, i may only use three, and choose to use Quark and Dreamweaver.  Adobe, clever marketing folks they are, do not tell us how many are using IDCS2. </p>
      <p>I have worked in several types (digital, label and presently offset) of print shops in the last 8 years and ID has made small inroads, but really and sadly Pagemaker has a larger page and user base, and combined they lag behind Quark by miles I think Adobe was so optimistic about dethroning Quark 7 years ago that they must be pulling their hair out and only getting such a small return. 7 years which is interesting, because I think that is how long Quark 3.xx was out and the industry learned everthing about the program and that gives Quark a mighty lead.</p>
