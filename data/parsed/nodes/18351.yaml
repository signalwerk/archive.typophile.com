      <p>As a magazine AD at a major Canadian publication, I think it’ll be interesting to see these survey results in 2007.</p>
      <p>We switched to InDesign about two years ago, but many of our sister publications have continued with Quark. The reason? InDesign’s hardware requirements. Moving 200+ staff from OS9 iMacs running Quark 4 to OSX capable hardware has proven to be a multi-hundred-thousand dollar investment.</p>
      <p>Still, over the past two years, computers have been upgraded piecemeal, and now any publication that has the means has moved to InDesign. I think the plan is to have all 15 of our magazines over to InDesign by the end of the 2006 calendar year.</p>
      <p>I’m not sure if anyone’s reading these stats as a lack of willingness to move to InDesign — it’s quite the opposite. Anyone here who’s not using InDesign is chomping at the bit to rid themselves of Quark.</p>
