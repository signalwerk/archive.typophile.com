      <p>It’s funny how one’s perspective might change the headline. I guess Nick’s “Quark still No. 1 for Canadian magazines” makes sense if your default assumption was that InDesign has dethroned Quark in the installed base. Since that wasn’t my assumption, wearing my Adobe hat I was heartened rather than dismayed by the stats.</p>
      <p>2003: QXP 84%, InD 11%<br>
      2006: QXP 53%, InD 38%</p>
      <p>So QuarkXPress has lost over a third of their market share (of the installed base), while InDesign has gone up by 3.5x.</p>
      <p>Looking deeper at the numbers, of the 46% of the market that was on QXP 4 and 5, and moved, 15/46 went to newer versions of Quark, and 27/46 went to InDesign, meaning that of Canadian magazines implementing newer DTP software in those three years, over 60% moved from Quark to InDesign rather than upgrading QuarkXPress.</p>
      <p>Regards,</p>
      <p>T</p>
