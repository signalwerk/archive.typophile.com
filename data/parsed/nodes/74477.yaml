      <p>David, what I say is "The Sages' names are pronounced following their pronunciation in Modern Hebrew, except for those with Greek names." And I use the underdot h for chet, kh for khaf. </p>
      <p>As far as Hebrew pronunciation, it's just what my Hebrew teacher taught me, a very simple version. I don't think that there's anything complicated about the Sages' names, but I may be wrong. I don't claim to have a system of transliteration that is a model. That it's very close to what the Koren Siddur has done is reassuring.</p>
