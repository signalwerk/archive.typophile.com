      <p>from:  <a href="http://en.wikipedia.org/wiki/Mappiq" title="http://en.wikipedia.org/wiki/Mappiq">http://en.wikipedia.org/wiki/Mappiq</a></p>
      <p>Mappiq<br>
      From Wikipedia, the free encyclopedia</p>
      <p>Mappiq<br>
      ּ<br>
      IPA	h<br>
      Transliteration	h<br>
      Same appearance	dagesh, shuruk</p>
      <p>Example<br>
      גֹּבַהּ</p>
      <p>The word for height in Hebrew, govah. The centre dot in the leftmost letter is a mappiq.</p>
      <p>Other Niqqud<br>
      Shva · Hiriq · Zeire · Segol · Patach · Kamatz · Holam · Dagesh · Mappiq · Shuruk · Kubutz · Rafe · Sin/Shin Dot</p>
      <p>The mappiq (Hebrew: מפיק‎, also mapiq, mapik, mappik, lit. "causing to go out") is a diacritic used in the Hebrew alphabet. It is part of the Masoretes' system of niqqud (vowel points), and was added to Hebrew orthography at the same time. It takes the form of a dot in the middle of a letter (usually he). An identical point with a different phonetic function (marking different consonants) is called a dagesh.</p>
      <p>The mappiq is used to mark the letter he (and rarely aleph), indicating that it is to be pronounced as a consonant, although in a position where the letter usually indicates a vowel.</p>
      <p>Before the vowel points were invented, some consonants were used to indicate vowel sounds. These consonants are called matres lectionis. The letter he (transliterated H) at the end of a word (Hebrew is written from right to left) can indicate the vowel sound a or e. When it does, it is not acting as a consonant, and therefore in pure phonetic logic the Biblical name Zechariah (among others) should be spelled "Zekharya" without the final "h". However, silent final h being also a feature of English, it is usually retained in Hebrew transliterations to distinguish final he from final aleph.</p>
      <p>The divine name Yah has a mappiq (a dot inside the last letter), so the last letter shall not be read as a vowel a, but as the consonant H - and therefore Yah (and not Ya).<br>
      The most common occurrence of mappiq is in the suffix "-ah", meaning "her".</p>
      <p>A he with mappiq is meant to be pronounced as a full consonant "h", and in Mizrahi and Yemenite Hebrew it is pronounced more strongly than a normal he, sometimes with a slight following shwa sound (this rule is also followed by Dutch Sephardim). In modern Hebrew, however, it is normally silent.</p>
