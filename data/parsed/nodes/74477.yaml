    html: <p>You might take a look at the article "Shva" in Wikipedia, which is accurate so far as I understand the issue. As a practical matter of phonology, we might benefit more from differentiating the dagesh kal from dagesh hazak, than worrying about the shva-na and shva-nach, which need less practical guidance. People from the Middle East pronounce the doubled consonants of the dagesh hazak quite naturally, whereas Westerners have trouble. The only Western  language I know that has a similar doubled consonant is Catalan, which has a doubled L (lowercase) separated by a raised dot. It may well be an artifact of pre-1492 Spain.</p>
