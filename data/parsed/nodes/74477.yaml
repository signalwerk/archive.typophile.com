    html: "<p>I was careful not to use the word ‘semantic’ in my last post because I understand that it can be variously interpreted. What I said is that the distinction, if it is made, is meaningful to the person using it, and hence not something that should be lost in text interchange. A desired plain text distinction isn't necessarily one that conforms to the definition of semantic that you suggest: Unicode includes a number of mechanisms for preserving visual distinctions, or at least the desire for such distinction (e.g. the ZWJ mechanism for indicating a ligature), in plain text in situations in which these are meaningful to particular users or user communities. Such mechanisms include control character sequences, free variant selector characters, and also optional disunifications. Since we already have a good example of the latter in Hebrew in the disunification of U+05B8 and U+05C6 for optional plain text distinction of a difference in pronunciation, there is precedence for a similar approach to sheva-nah. Having multiple mechanisms, some character based and some glyph based, for parallel text processing issues strikes me as a bad idea, and clever though I am sure the glyph processing solutions are, the time spent on them might have been better employed in crafting and submitting Unicode and ISO encoding proposals. [Israel mentioned furtive patach; this is not a direct parallel, because the distinction is one of mark positioning, not glyph shape; the distinction is not lost in text interchange, since it is always reliant on intelligent layout capabilities, and a font that cannot correctly position furtive patach is actually broken, as distinct from the very many that deliberately make no distinction between e.g. qamats gadol and qamats qatan, or between sheva and sheva_nah.</p>"
