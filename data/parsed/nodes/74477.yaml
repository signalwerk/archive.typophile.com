      <p>David,</p>
      <p>This was a great lesson. Also, thanx.</p>
      <p>Eli, I thought it was my blabberring. Yours was only virtual.</p>
      <p>I rethought Prof. D. and Rabbi R.'s remarks, and propose that if we transpose all Hebrew grammar rules into different graphic symbols, where a dagesh chazak or dagesh kal, are two different symbols or codes, and same for patachs x 2 = 2 different codes etc., then create GSUB rules, every shvah-na can be accurately replaced, and perhaps others as well.</p>
      <p>This is major endeavor, and would require a grant of sorts.</p>
      <p>Eli, is this what you did?</p>
      <p>I would prefer to reinvent the wheel, because I see the logic of these GSUBs could definately have commercial applications in security-sensitive fonts for security-sensitive environments, and I doubt that you would release your source code.</p>
      <p>I agree that the 3 views come after everything, for they simply differ on how the rules are applied.</p>
      <p>Clearly, my major hurdle is finding out in English a systematic definition of all the rules. I need a compact portable David, ie David in an iPod :) - perhaps, it's Chomsky's book on the Radak (RAbbi DAvid Kimchi zatzal) - although it was so poorly written.</p>
      <p>First GSUBs: replace all nikkud and dagesh with two different codes, referring to GyphGroups - all vowels<br>
      Then 2nd group of GSUB: applying different Hebrew grammar rules, and replacing those strings with new strings which insert shvah-nas </p>
      <p>Everything is in the nikkud: P. Dotan meant that the two forms of dagesh are also nikkudot (it's a dot, not a dim, Eli, right?).</p>
      <p>Is it soup, yet?</p>
