      <p>guys, Lets make some order here.<br>
      On the net there are plenty og forums discosing hebrew grammer.<br>
      typophile is not one of them.<br>
      typophile is a place to talk about font design, font development and open type solutions.</p>
      <p>Who ever dealt with volt for real complex functions learns real fast that volt is a powerfull tool but not without it's limits.<br>
      there is just so much you can do with Volt.<br>
      more so, Volt has a limit of the amount of lookups and context that when exceeded it simply won't compile.<br>
      furthur more, the fact that some function works correctly in the volt proofing tool does not mean it will work in indesign.<br>
      different versions of indesign behave differntly<br>
      in indesign CS4 they changed the way they deal with right2left and left2right characters.</p>
      <p>when one (in this case gohebrew) wants to develop a project that will deal with sheva na\nach ect' he must first know what can be done and what cant be done. what is important and what's not, what should the project solve and what to leave for the user to decide.</p>
      <p>I am saying again and again "forget all of the Shitot".<br>
      some of the arguments are about the grammer rules other arguments are about specific words.</p>
      <p>acourding to some opinions there are also a PATAH GADOL, HIRIQ GADOL and TSERE QATAN.<br>
      I ignore all that.</p>
      <p>then you have different opinions what is a TENUA GEDOLA and what is a TENUA KETANA<br>
      acourding to my project<br>
      Qamats, Tsere, holam are TENUOT GEDOLOT<br>
      Hiriq, segol, Patah, Shuruq are TENUOT KETANOT<br>
      Melupum if its the first letter in a word its a TENUA KETANA and if in the middle of the word the its a TENUA GEDOLA.</p>
      <p>Some wont agree on that 100%<br>
      Some say that a sheva after a meteg is allways a sheva na, my project does not behave that way.</p>
      <p>I do take into consideration a meteg when trying to decide if the qamats is qatan and the sheva is nach or if the qamats is gadol and the sheva is na.</p>
      <p>There are differnt issues that people argue about but alot of them in VOLT terms are insignificant.</p>
      <p>So not every differance of opinion should be taken into consideration.</p>
      <p>Gohebrew, you say its all in the nikud, I disagree.<br>
      Alot can be decided acourding to the nikud but to say that its all in the nikkud is incorrect.<br>
      some things are to do with the teamim which indicates some things.<br>
      some things are simply masoret.</p>
      <p>some time things change if the word is BESMICHUT and some times where is the word in the sentence.<br>
      in a lot of cases you cant do a sheva na\nach without reconing if a qamats is qatan or Gadol (RAHAV)<br>
      and the qamats qatan issue is a whol thing by it self.<br>
      even if you do say that it is all in the nikud, you have to check some issues back and forth again and again until its refined, any change you make can effect the behavior somwhere else.<br>
      so hierarchy is very important</p>
      <p>Personaly, if i want to talk hebrew grammer in general, i have better places to do so.<br>
      if you want to talk in VOLT terms, that is somthing else.</p>
