      <p>&gt;differences of pronunciation</p>
      <p>There are different issues here. </p>
      <p>1. Traditions of different communities. As is well known, different communities, such as Ashkenazi, Sephardi, Yemeni, Iraqi, etc. had different pronunciations of Hebrew by the time of the modern settlement of Israel by Jews. Scholars have discussed which of these most reflects ancient pronunciation. There is an Encyclopedia Judaica article on this. Eg. the ayin is pronounced "ng", there are distinctions between the tav and daled with and without dagesh, etc. I don't think a single scholar believes that either Ashkenazi pronunciation, such as the Chassidim use, or modern Israeli, accurately reflect ancient pronunciation.  </p>
      <p>2. The differences between pronunciation by the "rules" of grammar vs spoken Hebrew, now and in the past. William Chomsky's argument in the "Shewa" article was that some of the "rules" deriving from Rabbi David Kimhi, and now enshrined, are in error, as they probably never were followed, and not today. These rules affect pronunciation, so that some of the supposed rules of "holy" and correct pronunciations in fact are just blunders. For example, as I understand it, the "rule" is that a shva under the first letter is always pronounced—a mistake in Chomsky's view. Chomsky says that both Ashkenazi and Sephardic speakers in the 20th century did not pronounce the shva under the first letter, except in specific categories of letters: the "liquid consonants", prepositional first letters, and the conjunctive vav. Nor do Israelis today. So, for example, in the words k'tana and g'dola (feminine for small and big) there is no pronunciation of the shva. Nor is there in the word sh'va itself.</p>
