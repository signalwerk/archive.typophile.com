      <p>&gt;What does English Transliteration have to do with Hebrew, Modern Hebrew, or Spoken Hebrew???  We could find sewa, seva, schwa, shva, sheva etc etc.</p>
      <p>It depends on your philosophy of transliteration. If you decide that the transliteration should reflect the correct Hebrew pronunciation of the word, then the transliteration will reflect the difference between the shva na and shva nach. Then issues of Hebrew, modern Hebrew, spoken Hebrew will affect decisions on transliteration. </p>
      <p>For example in my <a class="freelinking external" href="http://www.jewishpub.org/product.php?id=444" rel="nofollow">newly published commentary on Pirke Avot</a> I had to decide on how to transliterate the names of the Tannaim, for which there is no single standard transliteration. So for example אֶלְעָזָר I transliterate as Elazar, rather than as Eleazar. The latter is used more traditionally, and by the Encyclopedia Judaica. But it is confusing to English speakers, as the second "e" transliterates a shva nach, which is silent. And English speakers will first think of pronouncing the combination "ea" as the "ea" in "eat", which is totally misleading. So I transliterate as Elazar. I notice that the new Koren Siddur has made the same choice as I have, transliterating closer to spoken Hebrew. </p>
      <p>These are non-issues for Hebrew speakers and readers, but for materials for English speakers they do make a difference.</p>
