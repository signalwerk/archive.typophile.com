      <p>Israel,</p>
      <p>Re: Tenua gedola, short, nun, vav, shin.... etc. etc.</p>
      <p>This is not a matter of 'patterns', but a matter of knowing Hebrew grammar and how to add the nikkud. This has nothing to do with different points of views.</p>
      <p>The word   ישראל is divided into syllables.  How many syllables? The same as the number of its vowels.  In this case יש/ר/אל<br>
      The first syllable is closed and unstressed -- and will get a short vowel, hiriq.<br>
      The second syllable is open -- and will get a long vowel, kamats.<br>
      The third syllable is closed and stressed  -- and will get a long vowel, tsere.<br>
      How do we know if it is  kamats and not a patach, tsere and not a segol? You need to know and understand, among other things,  how the Vowel diagram works (e.g. see the IPA vowel diagram).</p>
      <p>Here is another example: נ�צּ�ל�ה<br>
      This word has two meanings, the  same root (נ.צ.ל) and in both cases the tense is past. But If it is used in the context: the girl was saved by the doctor... by the fireman, etc. etc. then the binyan/conjugation is Nifal.<br>
      This binyan is identified by a prefix n/ni.  The dagesh is hazak. Its aim is to compensate for the lost letter. That is why this dagesh is also known as Mashlim.<br>
      Since the word already  has the letter nun נצל  and adding the prefix n/ni  will create this: נִנְצְל�ה, we drop one nun and add dagesh: נ�צּ�ל�ה.<br>
      If the word is used in the context: she took the opportunity to.... then the  binyan/conjugation  is Piel. This binyan is identified (again don't forget that we are talking about past tense!) by the hiriq (ayin hapoal, עי"ן הפועל ), and dagesh hazak  (pe hapoal,  פ' הפועל ) in any form. That said the hiriq &amp; the dagesh are part of the binyan! In this regard, one time you'll have a word that starts with the letter nun, and another time a different letter. </p>
      <p>The word שִימִי, as you can see,  has a hiriq and a yud; this  hiriq is gadol, a long vowel. In this word נ�צּ�ל�ה there's no letter yud; this hiriq is katan, a short vowel.</p>
      <p>Are we clear about "101 Hebrew Grammar"?</p>
      <p>1. Norzi, Minchat Shay: Norzi was not a grammarian in the full sense of the word, rather a Masorah researcher. In his own words: </p>
      <p>Since he saw printed text with errors his goal was to provide a reliable source. In this regard his was work valuable!!!. Norzi didn't develop any grammar specific rules, nor any rules that related to the ta'amim. Also his Ma'amar ha-Ma'arich is more articulation rather than writing rules from scratch.<br>
      What are those rules that were "formed" by Norzi?  There must be something if you're  designing a font based on those rules. </p>
      <p>2. Traditions: It is no secret that none of traditions are homogeneous. Each of them has a sub-category/tradition. For now,  I'll mention a  couple of them.<br>
      The Yemenite tradition accepted the Tiberian tradition who pushed away the Babylonian tradition. They accepted the Tiberian rules when reading the Bible,  but not in other fields.<br>
      If you own their  Babylonian Talmud you'll see something interesting:<br>
      (A) Segol: the vowel segol is not printed at all. They don't use it. It is not printed! Instead they use a patach. Why? Because they pronounce the segol and patach the same!<br>
      (B) Hataf: the same applies to the hataf (e.g. hataf-patach). They don't use it. It is not printed. Why? Because they pronounce it like sheva na!<br>
      (C) Sheva Nach: the sheva nach is not printed at all! In their real tradition the sheva nach doesn't exist.<br>
      Moreover, their rules of beged kefet while reading the Bible are not the same when reading  the Talmud. They are different.<br>
      But wait. Their reading tradition of the Aramaic  of the Targum is not like their Babylonian Aramaic.<br>
      Now this is not just  about the number of words, but knowing and understanding the differences that exist. Otherwise how could a person give a solution without knowing the "problems". </p>
      <p>It is also not a secret that the Targum, or Onkelus, has different MSS. What do the  printed texts look like?  Let's just view several of them:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Targum_3749.png"></div><br>
      Again this is not just the number of words, or word related issues but familiarity with the subject matter and how you can or can't provide a solution. And at any rate you'll never "cut the middle man", or the need for a grammarian!<p></p>
      <p>Other traditions are not so different, for example,  Jews from Tunis (and again I'm not getting into specific areas , towns, etc. etc. as differences are existing).<br>
      When they read the Bible, for example, they adopted the rules of Eliyahu Bachur.<br>
      But what is interesting is that they don't use the third rule: sheva na after a long vowel. In other words they  don't read this sheva as na!<br>
      More interesting is the fact that when they read a word from the Bible  e.g. קרבן<br>
      with "o" sound , or kamats katan; however, they  read it as "a" sound, just kamats ,  when they read the Mishna ( e.g.  סוכה ה, ז; תר' ח, א; מ"ש ד, י) </p>
      <p>And this is not even showing  the tip of the iceberg.  Would you mind teaching me the logic behind finding a solution first, and later looking for the "problems"? How does it work? </p>
      <p>3. Meteg: in the siddurim the Biblical meteg does not exist unless, of course, you cite a verse, or half a chapter, or the whole chapter with all and the  same ta'amim and nikkud.<br>
      That "meteg" should be called SM -- Stress Mark, or MM -- Milel/Milra Mark (whatever the intention of the publisher).<br>
      What should we (or your font) teach about that "meteg"?<br>
      Very few will notice that a couple editions of the Bible have two graphic marks for the Biblical meteg/ga'ya. One that  is longer than the other, or one that is shorter than the other.<br>
      Should we add that to the Unicode?<br>
      In terms of grammar there are 10 different kinds of Biblical meteg. They could be divided into 2 main groups, with five in each group: the must or have to group is based on the Masorah; the second group is the reshot, or non-obliged, where the Masorah gave a free hand to the scribe, and hence the many differences that exist between MSS.<br>
      Now, which meteg should the font  try to "teach"?  Should we add that to the Unicode, ten differents kinds of vertical lines? It is important like the dagesh &amp; sheva. </p>
      <p>Would it be wiser and easier first to familiarize yourself with the subject based on true investigation, understanding your subject(s), limitation, and then working with a specific client/publisher/editor on a specific solution/project?</p>
      <p>------------------------</p>
      <p>Bill,</p>
      <p>What  does English Transliteration have  to do with Hebrew, Modern Hebrew, or Spoken Hebrew???<br>
      We could find sewa, seva, schwa, shva, sheva etc etc.</p>
