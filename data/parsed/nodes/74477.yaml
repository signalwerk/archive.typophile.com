      <p>Bill: <em>Thus there is not much basis for thinking they actually reflect ancient spoken Hebrew.</em></p>
      <p>Indeed not. Some of the differences between ancient pronunciation and the later pronunciation applied to the Bible text by the Masoretes are evident from the text itself. The best known example is the change in pronunciation of <em>yerušālēm</em> to <em>yerušālayim,</em> which required the Masoretes to add hiriq between the lamed and the final mem in order to approximate the new pronunciation as <em>yerušālaim,</em> while preserving the consonant structure of the ancient manuscripts. The final four characters of this word are correctly encoded in the order lamed + patah + hiriq + final mem, and the hiriq is conventionally positioned under the right side of the final mem, following the Masoretic codices.</p>
      <p>[This is also a good example of the unfortunate collision of the Biblical text with Unicode's canonical combining class assignments for Hebrew marks, which were based on modern practice. If Unicode normalisation is applied to this word, the order of the patah and hiriq is reversed.]</p>
