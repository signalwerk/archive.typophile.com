    <p>Advanced OpenType Software Tool, like MS VOLT, can create an automatic replacement of a string of glyphs, and insert a needed glyph, such as a shva-na and a meteg.</p>
    <p>As a results, intelligent students can better study the grammatical use and proper placement of the shva-na and the meteg.</p>
    <p>At first. I was distracted by seemingly Hebrew experts as to the impossibility of doing this, as the use and placement of shva-na and meteg is purely grammatical, in their minds, and not at all contextual.</p>
    <p>So, I consulted with two truly Hebrew language experts, Prof. Aron Dotan of Tel Aviv University in Ramat Aviv, Israel, and Rabbi Shmuel Rabin of Toronto, Canada, a Lubavitcher chossid. They confirmed that this indeed was possible. Rabbi Rabin warned though that this was very difficult according to the viewpoint of Rabbi Zalman Hanau.</p>
    <p>There are basically three schools of thought based upon the writings of the Radak, Rabbi David Kimchi - the father of our understanding of Hebrew grammar. They are:</p>
    <p>1. Rabbi Zalman Hanau and most of Jewish thinking until about 225 years ago. The Chabad Lubavitch printing house in the USA, Kehos follows this approach.</p>
    <p>2. Rabbi Eliyahu Bachur, and later the Vilna Gaon. The ArtScroll printing house follows this approach.</p>
    <p>3. Minchas Shai. Shai LeMorah publishers of Jerusalem, and the Chabad Lubavitch printing house in Israel, Kehos, follow this approach.</p>
