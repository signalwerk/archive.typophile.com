    html: "<p>Israel, I thought I had been adequately clear all along that my objection to doing this with glyph substitution lookups has nothing to do with whether or not it might be possible; indeed, it if were not possible, what would be the point of having an objection? My point has always been that if an author or publisher wishes to visually distinguish sheva and sheva-nah, then it is presumably because he considers the distinction to be semantically important. If something is semantically important, then it should be possible to capture it and preserve it <em>in plain text,</em> i.e. at the character encoding level, not at the glyph processing level where it is subject to variant results in different software and is reliant on particular fonts. That is what I have stated repeatedly, and it has nothing to do with whether or not it is possible to do it at the glyph level in OpenType: it is about whether it <em>should</em> be done at that level.</p>"
    html_clean: "<p>Israel, I thought I had been adequately clear all along that my objection to doing this with glyph substitution lookups has nothing to do with whether or not it might be possible; indeed, it if were not possible, what would be the point of having an objection? My point has always been that if an author or publisher wishes to visually distinguish sheva and sheva-nah, then it is presumably because he considers the distinction to be semantically important. If something is semantically important, then it should be possible to capture it and preserve it <em>in plain text,</em> i.e. at the character encoding level, not at the glyph processing level where it is subject to variant results in different software and is reliant on particular fonts. That is what I have stated repeatedly, and it has nothing to do with whether or not it is possible to do it at the glyph level in OpenType: it is about whether it <em>should</em> be done at that level.</p>"
