      <p>Israel,</p>
      <p><em>John Hudson, who has this database of every verse with nikkud taam and meteg? Do they have the Chapters of the Fathers with nikkud and meteg, and the Jewish prayerbook with nikkud and meteg as well?</em></p>
      <p>Someone might, but not my sources, who are Christian Bible publishers working from the Westminster Theological College electronic Tanakh. [The WTC text uses a custom encoding to capture more distinctions than are possible in Unicode, e.g. between regular and furtive patach, and this is then converted to Unicode by various publishers for use with OpenType fonts such as SBL Hebrew.]</p>
      <p>I've not come across electronic texts and analysis of Jewish prayer books etc., but then I have not been looking.</p>
      <p><em>john hudson, what is (if any) is the upward limit in a string of glyphs that Volt can handle.</em></p>
      <p>I don't think there is a limit, but I have not stress tested this.</p>
      <p>I have two concerns with really long glyph context strings. First is processing time, i.e. such lookups might slow down text layout and rendering appreciably. Second is that if contexts involve word boundaries (which implies not only the word space but also maqaf) they may be broken by line breaking (OTL glyph runs do not cross line breaks). This is another reason why OTL GSUB is not an appropriate tool to implement grammar.</p>
