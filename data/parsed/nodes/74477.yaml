      <p>I simply have a lot of Shai L'Morah books with nikkud and shva-nas, based upon the Minchat Shai's approach to the shva-na, two lots of ArtScroll books with nikkud and shva-nas, based upon Rabbi Eliyahu Bachur's approach to the shva-na, and three lots of Kehot USA books with nikkud and shva-nas, based upon Rabbi Zalman Henna's approach to the shva-na.</p>
