      <p>Eli,</p>
      <p>&gt; The main reason is because you can't check a first letter of a word that is in the beginning of a line; all shevas at the first letter of a word is allways NA.</p>
      <p>Yes. We used to identify it with the boldened shva.</p>
      <p>But today, we do not identify it. Hence, It appears like a shva-nach, no different in any way. Only when a shva appears in the middle of a word, then a floating graphic is inserted by the special OT font - on the screen, at the printer or PDF, but not in the file.</p>
      <p>Again, my way seems logical and simpler, no? GSUB sees a certain string which according to the defined rules in GPOS look-ups based upon Gloyph Groups, then inserts above some shvas a floating glyph.</p>
      <p>It doesn't need to know if a dagesh is kal or chazak.</p>
      <p>A komatz katan can help define a shva-na I was told. In fact, I believe that the kollel is called Revach, in three words, the komatz is katan and then the shva is nach, but when the komatz is rabah, then the shva is na.</p>
      <p>So, the three letters could simply be a Glyph Group. And we can save search for komatz katan later, if it can be defined contexually.</p>
