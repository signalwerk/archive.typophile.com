      <p>From Wikipedia, the free encyclopedia</p>
      <p>see: <a href="http://en.wikipedia.org/wiki/Kamatz" title="http://en.wikipedia.org/wiki/Kamatz">http://en.wikipedia.org/wiki/Kamatz</a></p>
      <p>Qamatz Qatan and Hataf Qamatz</p>
      <p>[edit]Qamatz Qatan<br>
      A Qamatz Qatan (Hebrew: קָמַץ קָטָן‎, "Small Qamatz"), is a qamatz in a closed syllable. A closed syllable is one which ends in a consonant with shwa nakh (zero vowel) or in a consonant with dagesh khazak (essentially two identical consonants, the first of which has shwa nakh). For example, it is used in the word תָּכְנִית (program, pronounced [ˈtoχnit]). It is identical in appearance to the standard qamatz, but is pronounced as [o], rather than [a]. According to the standard Hebrew spelling rules as published by The Academy of the Hebrew Language, words which have a qamatz qatan in their base form must be written without a waw, thus the standard vowel-less spelling of תָּכְנִית is תכנית, although in practice many Hebrew speakers do add a waw and spell it תוכנית. This nonstandard spelling is common in newspapers and is even used in several dictionaries, for example Rav Milim. Words, which in their base form have a holam that changes to qamatz qatan in declination, retain the waw in vowel-less spelling: the noun חֹפֶשׁ (freedom, pronounced [ˈħofeʃ]) is spelled חופש in vowel-less texts; the adjective חָפְשִׁי (free, pronounced [ħofˈʃi]) is spelled חופשי in vowel-less text, despite the use of qamatz qatan, both according to the standard spelling and in common practice.<br>
      Some books print the qamatz qatan differently, although it is not consistent. For example, in siddur Rinat Yisrael the vertical line of qamatz qatan is longer. In a book of Psalms used by some Breslov hassidim the qamatz qatan is bolder. In the popular niqqud textbook Niqqud halakha le-maase by Nisan Netser, the qamatz qatan is printed as an encircled qamatz for didactic purposes.<br>
      Unicode defines the code point U+05C7 QAMATS QATAN, although the appearance of the character in the code chart is identical to that of U+05B8 QAMATS and its usage is not required.</p>
      <p>Perhaps, you are correct. It's the opposite of what I said. </p>
      <p>Sephardic pronunciation distinguishes, but Ashkenazic doesn't. Hence, many prayerbooks of people who pronounce words Ashkenazic do not identify the kamatz katan but identify the shva-na.</p>
      <p>Because an Israeli has said chochma and not chachma does not mean that he or she knows what is a kamatz katan.</p>
      <p>Raphael, when the sale of the Brooklyn Bridge is mentioned, it's a joke. JOKE. 4 letter word. Maybe, living among all those suicide bombers have caused you to forget how to laugh.</p>
      <p>As you see from the above admittance, I am just a ignoramus.</p>
