      <p>Eli,</p>
      <p>&gt; to start explaining to you why not to deal with meteg is diffcult.<br>
      but in general try avoiding inserting glyphs into text at an OT level that should absolutly be done at the charecter level, never ever by OT.</p>
      <p>Here I disagree.</p>
      <p>The who purpose of Volt and an advanced OT font is remove the difficult decision making about diacritic placement from the typeetter, and to place it in the responsibility of the type designer.</p>
      <p>The user does not to know where to place the komatz or patach. The type design needs to know, and place it correctly. If it's an aleph, it goes here; if it's a reish, it goes here. If it's a patach at the end of a word, and a hei, then replace it with a furtive patach.</p>
      <p>I want to do the same with a shva-na, and afterwards with a meteg if possible.</p>
      <p>Why?</p>
      <p>These are basic Hebrew grammar things that kids should learn, and teachers should teach. When a typesetter works on voweled Hebrew text, then these glyphs could be inserted automatically.</p>
