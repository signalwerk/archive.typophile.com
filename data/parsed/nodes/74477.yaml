      <p>Rabbi Yehuda Meir Shapira was born in March 1887. His father was Rabbi Yaakov Shimshon of Schatz (Bukovina), son of Rabbi Yehuda Meir, son of Rabbi Dov of Tlost, son of Rabbi Yehuda Meir of Shpitovka, son of the famous tzaddik and friend of Besht (the founder of Chassidism), Rabbi Pinchus of Kuritz, a descendant of Rabbi Natan Shapira, author of Megalah Amukot of Cracow. In his youth, he caused a stir in the world of the Torah with his wisdom and great knowledge. This is confirmed by the great sage, Rabbi Shalom Mordechai Svedron of Berzan, in the ordination certificate he issued for the Rabbi Meir, in which he writes, “I saw a young man named Meir and I offered the blessing Yotzer Ha'meorot (creator of the lights).”</p>
      <p>Rabbi Shapira had studied with his maternal grandfather, Rabbi Shmuel Yitzhak Schor of Munstritz, author of Minchat Shai, mastering all aspects of Torah and knowledge; soon he became known as a great scholar. A wealthy Galician Jew named Rabbi Yaakov David Breitman of Tarnopol gave him his daughter's hand in marriage.</p>
