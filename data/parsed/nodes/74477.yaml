      <p>Just came across <a class="freelinking external" href="http://curiousjew.blogspot.com/2009/08/biblical-hebrew-class-1.html" rel="nofollow">this interesting discussion of nikud.</a> This is notes of a student in a class on Hebrew linguistics at Yeshiva U. Note that he says that even medieval authorities agree that the nikud are not mi-sinai—do not have any sacred authority. I needn't have put a smiley above when I wrote that!</p>
      <p>The basics of the shva na are simple, but beyond that not only get incredibly complex, but it seems to me without justification for the decisions. These complex systems derive from Rabbi Kimhi in the 13th century—long after the Tiberian system was fixed, a system that doesn't record the sheva na. Thus there is not much basis for thinking they actually reflect ancient spoken Hebrew. In the link, it also explains that even in ancient times there were competing systems of nikud in Bablyonia and in Tiberias. It may be that choosing the Tiberian one was well justified, but it brings out the problematic character of the complex rules. That seems to me to justify following the current way Hebrew is pronounced by native Israelis, as Chomsky says. </p>
      <p>I recognize that this won't affect those who regard one or another of these traditions as authentic. I'm just saying from a liberal Jewish point of view—or dispassionate scholarly one—it doesn't make much sense to enshrine these as proper.   </p>
      <p>Eli Fried, who seems to know more about this than anybody, could perhaps tell us at what point the "rules" about the shva na get tenuous. </p>
      <p>By the way, I write shva na, not "sheva" na, because in spoken Hebrew the word contains a shva nach, not a shva na, contrary to the artificial "rules", but consistent with the real rules, according to Chomsky.</p>
