      <p>Oy, okay, here I get baited in again. Well done Mr Seldowitz.</p>
      <p>I think this is what is happening. Gohebrew has heard that something from experts in the field that something is theoritically possible and he wants to go ahead and try and do it.</p>
      <p>Now, an expert, in this particularly case, Typograph (and <em>I'm</em> calling him an expert) has done this nearly 100%. But typograph has stated that his purpose here is quite specific, ie to speed up the editorial process. This is quite a clever approach. That a fount is designed to help you editorially. This is not something that founts normally do nor are they classically supposed. </p>
      <p>For example, the autocorrect rules of mispelling, or say space hyphen space could be substited on the fly with the correct spelling or typographical style (in my opinion, space en-dash space and in somebody elses, just a very long em-dash :-) )</p>
      <p>Fonts are not <em>supposed,</em> to do that. But we all agree that it's okay for a font to substitute ffi for the appropriate ligature, so why not space dash space? And why not incorrect spelling.</p>
      <p>Let's go down the avenue of spelling to clarify this thread and gohebrew's problem.</p>
      <p>What typograph is saying is that yes, in theory, you could program a font to fix all your spelling mistakes, but in practice, let's just take the majority of common ones. To jump back to the substitution of shva na etc., to make it work for 99% is X amount of time, to make it work for 100% is 100 of years of work and VOLT wouldn't be able to compile it anyway.</p>
      <p>BUT, the real problem is that gohebrew's knowledge is so far from understanding even the basics, that perhaps he should be focusing on font design and other typographic pursuits rather than getting involved in a whole area of expertise that he doesn't have and frankly, except for specialised situations that typograph is in where this bizarre autocorrect actually makes sense, it shouldn't be in most foundry's founts anyway!</p>
