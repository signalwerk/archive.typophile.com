      <p>I think you have to separate the various issues:<br>
      1) should the font even include automatic substitution.<br>
      2) is the font trying to be 100% correct<br>
      3) is the font trying to do this for a Tanakh with taamim or regular text<br>
      4) is the font trying to cover all situations.</p>
      <p>1) Personally I don't think this should be encoded but if you are going to do it then...<br>
      2) Clearly to anybody who actually understands the subject, this is impossible. However, there is value in being 90% accurate and then the proofreading will be quicker. If you imagine a text probably has to go through at least 4 professional passes, if there is less things on the line to correct, this will be more accurate. Here it could be useful.<br>
      3) to those who understand the subject very well, then this point is crucial.<br>
      4) I think that obviously each publishing house will have it's own set of rules and no font can cover each system. And frankly a publishing house wouldn't need such a font! However, there is value in creating a font with <em>a</em> system for those who actually want this for a different reason and that is for using it as a basis of transliterating the text. I can definately see a teacher or school buying such a typeface for use and then they can easily make a transliteration for kids. As my time as freelance typesetter for major Jewish publishing houses in the USA, I saw that they had "experts" transliterating texts with sooooo many mistakes, clearly demonstrating their lack of ability to read the Hebrew language correctly by <em>any</em> system. Having inspected Typograph's sample of Psalms that he posted, a font such as this, even though "only" 95% accurate out of the box, would be fantastic for hundreds of thousands of students where the people behind the project of that particular book don't have the knowledge or more importantly the budget to do the job 100% correctly and do a job that's at best 60% good.</p>
      <p>However, it is critical before embarking on such a mission to have the knowledge of grammar. It's clear that Typograph has this depth and breadth of knowledge, but with respect to gohebrew, I'm not sure a meeting with a Professor here (even it is Dotan) and Rabbi there is <em>quite</em> enough. I know that at Koren, the qualifications for doing this are at least a Masters in Hebrew grammar, preferably a Ph.D. so I would say to gohebrew, before continuing make sure you grammar knowledge is at the level of Typograph's otherwise I'm not sure what the point of the font is.</p>
