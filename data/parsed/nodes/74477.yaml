      <p>&gt;Bill, don't you think that this was clear?</p>
      <p>It's clear that you want to use open type to automatically set the kamatz katan and sheva na. It's not at all clear why and how you want to do this, especially now that Eli Fried has already done it—though Raphael Freeman thinks his effort is, and can be, only partially successful. </p>
      <p>I think what Eli is reacting to in his comments is that you don't seem to understand the recursive character of the special grammatical rules here. Eli is telling you you need to first set what is a strong and regular dagesh before you can automate other stuff, because other stuff is dependent on that. Recursive here means there are rules built on top of other rules, and if you try to define only from immediate context it can't be done at all. So I think Eli Fried was telling you there is no way to avoid learning the grammar very well, to do this programming at all successfully. </p>
      <p>As to whether Religious schools will want this, I think that depends on the religious school. </p>
      <p>The history here is informative to me. Thanks to David Hamuel sending it to me, I have read William Chomsky's article "The Pronunciation of the Shewa." There Chomsky, as I read him, explains the history thus: these current "rules" were first laid out by David Kimhi, also known by the acronym Radak, who died in 1235. These rules were not only unknown before this, but were contradicted by other previous great scholars. Kimhi introduced the idea of long and short vowels, and a new view of when to pronounce the sheva. Chomsky argues that in fact, these rules were never followed before Kimhi. In other words, Kimhi didn't get Hebrew grammar right. He invented some complexities that never existed in spoken Hebrew, or the system of nikkud. </p>
      <p>However, Radak's innovations—some of which were genuine and correct new insights—were accepted by later grammarians. Thus the partially incorrect ideas were accepted as "correct" and became traditional, even though incorrect. Now you have a situation in which, I gather, there are competing diverse traditions built upon Radak's mistakes, all of which are thought to be holy and correct by their adherents. But even they cannot be reduced to rules that don't have exceptions. So Raphael Freeman has four authorities who go over text to get it right by their lights—and another authority will probably disagree.</p>
      <p>So what rules going to be helpful to a religious school or synagogue will depend on what tradition and authority they adhere to as relates to this. </p>
      <p>Personally I find most helpful is what Chomsky explains as the current rules of spoken Hebrew for the sheva na, which he says were in fact followed by both Ashkenazim in Europe and Sephardi style in Israel. And they are simple. If there are two shevas in succession the first is silent, the second pronounced. You also get a spoken sheva at the beginning of the word, when the first letter is a "liquid consonant" (yod, lamed, men, nun, resh) with a sheva, or when it is a prefixed preposition (bet, kaf, lamed), or a conjunctive vav. Otherwise, all shevas are silent, including at the beginning of a word. There are some more complications, but that's basically it. These rules make total sense to my mouth and my brain.  </p>
      <p>For those of us who are struggling with learning Hebrew just an visual indication of those rules would be convenient. And as far as God understanding the prayers, I think He'll do just fine in any case. David tells me that Chomsky also got some stuff wrong, but in any case for me the actual rules of spoken Hebrew is what I'd be very happy with. </p>
      <p>The whole Kimhi epicycles within epicycles stuff about the sheva na is, if William Chomsky is right, a wrong turn in Hebrew grammar anyway. However, Kimhi's work was I believe an inspiration for William Chomsky's son, Noam, to come up with "transformational-generative grammar" as a theory of the grammar of all languages, and that has made a big splash in the world of linguistics.</p>
