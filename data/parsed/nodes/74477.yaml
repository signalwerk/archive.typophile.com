      <p>Bill,</p>
      <p>I wasn't referring to the historical graphic form of the nikkud in my question about Arabic and other semetic languages (based on our earlier blog discussion by Hebrew's divine origins).</p>
      <p>Rather, I was referring to nikkud's complex oral tradition, reflecting Hebrew grammar.</p>
      <p>Avot are Mishnaic teachings from before the medieval period, as you know. They did not exist in a vacuum. They were pronounced. This pronunciation was the 'nikkud' system that later was transcribed into a graphic system, to which you refer.</p>
      <p>R' Zalman Henna and the Minchat Shai differ upon how it was pronounced.</p>
      <p>from: <a href="http://en.wikipedia.org/wiki/Middle_Ages" title="http://en.wikipedia.org/wiki/Middle_Ages">http://en.wikipedia.org/wiki/Middle_Ages</a></p>
      <p>Middle Ages<br>
      From Wikipedia, the free encyclopedia</p>
      <p>Ninth-century depiction of Charlemagne with popes Gelasius I and Gregory the Great<br>
      The Middle Ages (adjectival form: medieval or mediæval) was a period of European history from the 5th century to the 15th century. The period followed the fall of the Western Roman Empire in 476, and preceded the Early Modern Era. It is the middle period in a three-period division of history: Classical, Medieval, and Modern. The term "Middle Ages" (medium aevum) was coined in the 15th century and reflects the view that this period was a deviation from the path of classical learning, a path supposedly reconnected by Renaissance scholarship.</p>
      <p>from: <a href="http://en.wikipedia.org/wiki/Pirkei_Avot" title="http://en.wikipedia.org/wiki/Pirkei_Avot">http://en.wikipedia.org/wiki/Pirkei_Avot</a></p>
      <p>Pirkei Avot<br>
      From Wikipedia, the free encyclopedia<br>
      Rabbinical Eras<br>
      Chazal<br>
      Zugot<br>
      Tannaim<br>
      Amoraim<br>
      Savoraim<br>
      Geonim<br>
      Rishonim<br>
      Acharonim</p>
      <p>Pirkei Avot (Hebrew: פרקי אבות Pirqe Avoth in Classical and Talmudic Hebrew‎), which translates to English as Verses of the Fathers is a compilation of the ethical teachings and maxims of the Rabbis of the Mishnaic period. Because of its contents, it is also called Ethics of the Fathers. The teachings of Pirkei Avot appear in the Mishnaic tractate of Avot, the second-to-last tractate in the order of Nezikin in the Talmud. Pirkei Avot is unique in that it is the only tractate of the Talmud dealing solely with ethical and moral principles; there is little or no halacha found in Pirkei Avot, except for the Ein Mishpat Ner Mitzvah.</p>
      <p>...</p>
      <p>Structure of the work</p>
      <p>The tractate consists of six chapters. It begins with an order of transmission of the Oral Tradition; Moses receives the Torah at Mount Sinai and then transmits it through various generations (including Joshua, the Elders, and the Neviim, but notably not the Kohanim), whence it finally arrives at the Great Assembly, i.e., the Rabbis (Avot 1:1). It contains sayings attributed to sages from Simon the Just (200 B.C.E.) to shortly after Judah haNasi (200 C.E.), redactor of the Mishnah. These aphorisms concern proper ethical and social conduct, as well as the importance of Torah study.</p>
      <p>The first two chapters proceed in a general chronological order, with the second focusing on the students of Yochanan Ben Zakkai. Chapters Three and Four contain various attributed sayings in no clear order. Chapter Five departs from the organization and content of the preceding four in that it consists mostly of anonymous sayings structured around numerical lists, several of which have no direct connection with ethics. The last four paragraphs of this chapter return to the format of moral aphorisms attributed to specific rabbis.</p>
      <p>In liturgical use, and in most printed editions of Avoth, a sixth chapter, Kinyan Torah ("Acquisition of Torah") is added; this is in fact the eighth (in the Vilna edition) chapter of tractate Kallah, one of the minor tractates. It is added because its content and style are somewhat similar to that of the original tractate Avoth (although it focuses on Torah study more than ethics), and to allow for one chapter to be recited on each Shabbat of the Omer period, this chapter being seen well-suited to Shabbat Shavuot, when the giving of the Torah is celebrated. (See below.)</p>
      <p>...</p>
