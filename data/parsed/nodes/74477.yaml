      <p>You people are talking AS IF all the rules of shva-na / sheva hach are universally accepted by all authorities and all you have to now do is program them and, presto - you're done!</p>
      <p>Newsflash – nothing can be further from the truth! There are two major approaches to this subject alone. One the common one – (accepted by Academia LeLashon HaYivrit); the other one is that of Rabbi Zalman Henau. The differences between the two are so many, it will make your head spin. Like "malchuth" vs. "malechuth"; "ethchem" vs. "ethechem", etc., etc., etc.</p>
      <p>Secondly, there are various masoretic traditions and one man's sheva-na is another man's chataf-patach, etc.</p>
      <p>The same applies to quamatz-koton.</p>
      <p>SO EVEN IF you wish to create a graphic differentiation between these vowels (and all attempts in this direction have thus far been hideously UGLY), you best leave this at up to the editor.</p>
      <p>Lastly, the Tiberian system we use today doesn't distinguish between these vowels GRAPHICALLY. Why not just well enough alone?</p>
