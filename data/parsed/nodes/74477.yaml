      <p>Hi Eli,</p>
      <p>I don't think that I am confused.</p>
      <p>I use Volt mainly for the improvement of nikkud, meteg, and taam (and the combinations thereof) of Hebrews via GSUB look-ups, originally written by John Hudson.</p>
      <p>Shortly afterwards, I used the Volt software professionally, I discovered serious bugs with it. After testing the results of dozens of different possibilities I pinpointed and defined the problems. I created work-arounds, which I currently use. I stopped using John's 'program' after I taught myself how to create 'look-ups', 'GPOS', 'GSUB', 'programs' etc., with initial help from Diane Collier, recommended by Microsoft Type.</p>
      <p>I believe I no longer have these bugs, after months of frustration.</p>
      <p>MS Volt is powerful software, even with the bugs. But its graphical interface appears for programmers, and not for designers, who seek something intuitive and easy to use.</p>
      <p>Eli:<br>
      &gt; before before you get involved in the different opinions, first get down the basics.<br>
      First stage, the easiest on = Dagesh Kal &amp; Dagesh Hazak; then work out the basic sheva na/nach; then work out the basic Qamats Rahav/Qatan.</p>
      <p>Israel:<br>
      I decided to start with shva-na and meteg (among nikkud) because they could be contextually defined, and used in MS Volt with the GSUB routine - as explained to me by Prof. Aron Doton, formerly a Professor Emeritus at Tel Aviv University in Israel, and Rabbi Shmuel Rabin of Toronto, Canada, the greatest Hebrew language expert that I've spoken to. I feel privileged to have spoken with Prof. Doton, who at first thought it was impossible to contextually define a shva-na, because this was never done before. But, as a true genius, he thought about it in less than a minute, and changed his opinion. Rabbi Rabin never had a doubt, but warned that according to the view of Rabbi Zalman Henna or Hanau, this was exceeding difficult, as his rules were more complicated than that of the Minchat Shai (who we have on the entire Tanach), and Rabbi Eliyahu Bachur.</p>
      <p>Which view do you follow? Rabbi Zalman Hanau (Henna), Minchat Shai, or Rabbi Eliyahu Bachur.</p>
