      <p>First, I want to thank you for your advice and tips.</p>
      <p>Second, realize that much of my seeming opposition is very like that of my brainy brother-in-law, the devil's advocate.</p>
      <p>It seems that Boruch my friend, Raphael, and you, have not seen my lone tree in perceiving the vast forest of Hebrew grammar.</p>
      <p>I am a simple Jew with limited knowledge and experience in these matters. I know Volt (which after one masters it, it seems very simple), how to define a glyph group, and the two kinds of look-ups, GPOS and GSUB.</p>
      <p>And the great elderly Prof. Dotan, and the even greater young man, Rabbi Rabin, affirm that the shva-na can be defined contextually - and Volt can replace things contextually, so I feel that Volt can do the desired task.</p>
