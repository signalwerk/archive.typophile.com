  html: |-
    <p>Hi everyone,</p>
    <p>I have been developing a squarish sans intended for text (e.g. in brochure), for now there is only regular weight, others are still under development. I would like to hear your opinions on this before I move on.<br>
    Do you think this font can differentiate itself from other square sans?  What do you like or not like about the letters?<br>
    Comments and criticism are most welcome. Thank you for taking a look at this.</p>
    <p>Marica</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/melor-regular-m_5083.jpg"></div><p></p>
