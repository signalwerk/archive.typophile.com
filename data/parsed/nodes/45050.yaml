    html: |-
      <p>Neat and clean and yes I think different enough to be useful, it's very pleasant.<br>
      The bowl on the a needs slight adjustment, the left hand node of the counter is too high.<br>
      I think the eye of the e needs work too...if you take the segment from 12 o'clock to 3 o'clock and skew to the left a degree or two, I think that would do it.<br>
      Kk stick out to me, I don't like the horizontal connector.<br>
      Your spacing is very nice.</p>
