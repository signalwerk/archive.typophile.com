      <p>I think it looks good and you certainly have a good eye for letters.</p>
      <p>But you should know that there is a lot of similar typefaces out there. This type of squarish sans seems to be the new "Meta-syndrome". A couple of years ago everybody was doing their interpretations of Meta. Today we see a lot of squarish sans.<br>
      But, hey – that shouldnt stop you, should it? :)</p>
