    <p>The WEBDISK team would like to invite you to try our new file exchange tool at <a href="http://www.webdisk.gr" title="www.webdisk.gr">www.webdisk.gr</a></p>
    <p>The WEBDISK tool is a more stylish and robust alternative to FTP that was developed for the creative and printing industry in order to enhance remote collaboration and file management. It is not merely a file exchange tool as it provides additional functionality and customization.</p>
    <p>We would be very happy to have the Greek Designers among the first to try our service.</p>
    <p>Respectfully,<br>
    The WEBDISK team.</p>
