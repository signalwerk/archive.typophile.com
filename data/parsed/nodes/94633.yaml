      <p>Something to start you off:</p>
      <p>Capitals are often slightly heavier than minuscles, both to help its function as “sentence markers” but also because they are bigger and have more white inside them. The latter makes the black seem thinner than it really is.</p>
      <p>Ascenders often benefit from being slightly taller than capitals. IMO, yours would. Now they look smaller.</p>
      <p>/h/ join (and similar shapes) look too heavy. I would thin the joins.<br>
      /e/ crossbar: too heavy. Next to h it looks like it has too little overshot on the baseline.<br>
      /q/ the top curve looks out of place<br>
      /q, u, i/ there is something wrong with the heights here. q appears smaller than u. I take it the /i/ is lowered to make room for the tittle, but IMHO this doesn’t work as intended. Its tittle is also too small.<br>
      /c/ the straight-to-curve connection looks uncomfortable, and it also appears to get heavier towards the terminals. Internal white vs. black not in harmony,<br>
      /k/ the weight of the diagonals are off. The top one needs to be lighter, the bottom heavier (at least towards the baseline). One of the hardest letters to get right.<br>
      /b/ internal white not in harmony with other shapes. Needs thinning of joints.<br>
      /r/ too wide. I would start with thinning the joints of /n/, and flipping its “notch” (where the curve meets stem) 45 degrees to serve as the basis for a steeper shape.<br>
      /o/ looks heavy in the “corners” (NW, NE, SE, SW). Intended? If so, this should reflect in the other shapes as well.<br>
      /f/ the lowering off the crossbar may work, but your overhang is sloppy like spaghetti, making the whole thing look weak<br>
      /w/ is too heavy, especially in the joins<br>
      /x/ very unbalanced. The top looks amputated. Needs cross compensation with the diagonals<br>
      /s/ give the internal white the same attention as the black. As of now, they are not in harmony. </p>
      <p>In general, I think many of the shapes look like they come from different designs. You need to work on harmonizing the curves. They shouldn’t be exactly the same, but look like they are made with the same tool, at the same angle and the same writing speed.</p>
