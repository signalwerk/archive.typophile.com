      <p>OK, since this thing is serious about voice training...</p>
      <p>But first, Intent:<br>
      - Is this mostly a learning experience, or a desire to produce a font others would want?<br>
      - Do you want this to look polished or fauve?</p>
      <p>BTW:<br>
      Uncial is not a calligraphic style, nor a typographic style*.  It's an idea, involving forms that are hybrids between UC and lc. Just because they came about before type was invented means virtually nothing. What I find actually much more interesting about uncial is that it could serve as a starting point for replacing the caps we currently use, which are arguably too far removed from the lc in spirit.</p>
      <p>* I'm not even sure that means anything. If I were forced to name a font in that category I could only think of Legato.</p>
      <p>hhp</p>
