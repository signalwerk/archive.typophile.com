      <p>"I'd leverage your gargantuan x-height - make the descenders shorter! And I think making the caps x-height might make this thing become special. And maybe make everything super tight."</p>
      <p>The thing is that if the caps are reduced to x height, then effectively x height doesn't exist anymore.  Then the face would be a unicase, or uncial, depending on your point of view, with very short ascenders and descenders.  It wouldn't have an x height anymore, and so the x-height would not be gargantuan any more because it wouldn't exist.  Also, I would have to get rid of my uppercase J, which I'm surprised hasn't elicited a single comment yet.</p>
      <p>Thank you very much for taking the time to guide me on this.  I really appreciate it!</p>
