      <p><em>Unical is an aviation company. Unocal is a California-based petroleum company with Union 76 gas stations. Uncial - pronounced Un'-see-al or occasionallyh un'-shel, is a typographic style :) Someone else mentioned that in the other thread</em></p>
      <p>Well that's embarassing!  Thanks for the correction, and thanks to whoever else tried to correct me before.</p>
      <p>Frode Frank, thanks for the great review, I will have to start digging into this.</p>
      <p>The r was originally thinner, or at least the arm didn't stretch out as far.  After seeing it in some words however I felt widening it made it echo the b d g p and q better.  Perhaps the lowercase r is not supposed to echo these letters however?  I don't actually know if they are or not, it just felt like it should here.</p>
      <p>I extended the width of the f as well.  It's strange but true that if it extended up to normal ascender height it would look too wide as is, but in it's current shortened state, it just seemed to need to be wider.  I would guess this has something to do with the 'mass' or black around that area of space in neighboring letters.  That is, if it extended up to normal ascender height, there's not much other ink in other letters up that high, especially as the cross stroke makes it a lot darker than say, the h.  So because there is not much to compete with it, it can be thinner while looking wider.  In its present shortended state however, the top of the f is competing with a lot of other information, so I had to make it wider.  Thats my theory anyway, I could be wrong.</p>
      <p>The b d p &amp; q...  Not sure exactly why you think the top curve looks off.  I have seen other p's and q's  with a smooth top and no element there.  Am I doing it wrong?  Perhaps I should flip the b d p and q vertically and use the shape with the element protruding out as the p and the q, and use the smoothed over shapes for the b and d?  Also, I made the width of the d a little bit wider than the others.  I did this because basically I thought I was supposed to.  Isn't the lowercase d supposed to be the widest of these forms?  Maybe they're not.</p>
      <p>I totally see what you mean about the baseline part of the f.  Yes it is a lot farther off than I had noticed.</p>
      <p>I think I will leave the i and j as they are.  I feel they look a bit too short, yes, but if I want cap height to match ascender height (which I realize is not standard of course, but it's what I want to do with this face) I'm not sure if I could balance it out any better, perhaps you know a way?  I tried the lowercase j with no tittle, just extended it up to cap/ascender height.  That didn't really look quite right either, and it still left the problem of the i.</p>
      <p>Oh, and Ricardo, you are right, the h is <em>definitely</em> to thin.</p>
      <p>Thanks to both of you again for the help!</p>
