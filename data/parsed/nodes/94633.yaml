      <p>Here's the thing - many of your curves are very wobbly, some of your lines are not straight*, and some of your "strokes" are uneven. Compare to Verdana:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/versusV_4573.gif"></div><p></p>
      <p>* Which is particularly puzzling.</p>
      <p>Now, if you like that look (which I call "fauve") that could work, for a certain kind of font user. But most people (and seemingly you) prefer the polished look. So you have a lot of work to do, and probably a "mental shift" to perform before you can reach that point.</p>
      <p>That said, I <em>am</em> seeing some potential in your broader ideas for this, and find myself disagreeing with some people here whom I usually agree with. Mostly this is because I'd like to see this font be a bit idiosyncratic, which to me is the only way it can easily get some attention.* For example I'd leverage your gargantuan x-height - make the descenders shorter! And I think making the caps <em>x-height</em> might make this thing become special. And maybe make everything super tight.</p>
      <p>* Your other option is to go deep with fanciness like multiple weights, OT features, etc. but that seems like a stretch at this point.</p>
      <p>An alternative angle BTW is to try to make this fit a very narrow niche: truly tiny type. I'm talking on the order of 3 point. It could become useful/famous that way, since that's like the bottom of the Mariana Trench: very few things live there. Just know that things get very weird down there - like throw "x-height" out the porthole.</p>
      <p>hhp</p>
