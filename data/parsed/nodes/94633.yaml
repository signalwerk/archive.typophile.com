      <p>First of all: post a PDF, with black text on white background. It’s impossible to judge tiny bitmaps.</p>
      <p><em>Perhaps the lowercase r is not supposed to echo these letters however?</em><br>
      “Echoing” a shape does not mean “looking exactly like” it. You need some similarity, but you also need to reduce the whitespace on the right side of /r/. That is why I suggested a “flip”.</p>
      <p><em>The b d p &amp; q... Not sure exactly why you think the top curve looks off. I have seen other p's and q's with a smooth top and no element there. Am I doing it wrong?</em><br>
      It is not wrong to do so, I just think you are doing it badly. Another thing: If you want a spurless /p/, how come the /n/ has a spur? You should treat the same/similar shapes consequently.</p>
      <p>I don’t have enough time to comment as much and as quickly as I’d like to, even though I’ve learned a lot from similar threads in the past. Sorry. It’s certainly true that critique can kill your original idea, but at this stage I think your concept is the biggest problem: it is not well considered. Look at similar designs! How do they make similar shapes work together? How do they treat the white? What tricks are they using to fix optical problems like for example black spots?</p>
      <p>The other big issue is that you’re only (mostly) looking at the black parts. You need look at the white as well! Balance the white inside and between letters, and also the relationship between white parts in letters like /a/, /e/, /s/, /g/ ++. Take a look at the /s/ for example: the top and bottom white are totally different shapes.</p>
      <p>I’ll be back with better comments when I have more time.</p>
