    <p>The Font Bureau face <a class="freelinking-external" href="http://www.fontbureau.com/fonts/Stainless">Stainless</a> is pretty nice. My only gripe is that it has no italic that I can tell. Do any of you guys know of any fonts that are a similar design and have an italic?</p>
