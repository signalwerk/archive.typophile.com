      <p>Stainless is one of those “square sans” faces that crop up in discussions often. I know that whenever they do, people always tout <a href="http://processtypefoundry.com/typefaces/klavika/index.html">Klavika</a> as their favorite.</p>
      <p>EDIT: There are a bunch more in <a href="http://www.typophile.com/node/28458">this thread</a>. I did some searching for you, and all the types mentioned except for Cachet have italics.</p>
