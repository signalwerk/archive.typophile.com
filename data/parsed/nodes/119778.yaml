      <p>Hard to say with so few letters. Some sort of chopped-off serif Didot/Bodoni... More details (origin, website, more letters) would be needed to positively identify it. Some suggestions in the same vein for the moment: <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/chong-modern" rel="nofollow">Chong Modern</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/grenale" rel="nofollow">Grenale</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/search/bodoni+sans" rel="nofollow">Bodoni Sans</a></strong> (the closest so far, possibly matching)</p>
      <p>EDIT: what Kevin said + Bodoni Sans</p>
