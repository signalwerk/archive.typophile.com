      <p>I want to know exactly who it was at Apple that fell in love with Helvetica, critics be damned. I'm not a Helvetica hater, but typography has come a long, long way since 1950s Switzerland.</p>
      <p>Regarding the 35 weight, I was always taught that the more you notice the features of a font, rather than the words and the feeling of the words, then the font has failed. Helvetica is supposed to be one of the most transparent, "don't look at me" fonts in existence, which is why I assume it's been chosen as the font du jour. But using the light weight kills that premise.</p>
