      <p>It's easy to forget that many Apple products got bad reviews from bloggers when first released. For example:</p>
      <p>• When Steve Jobs unveiled the first iMac, many bloggers were shocked that it didn't have a floppy drive (very unusual back then) and there were many outraged articles even at Apple fan sites.</p>
      <p>• That antenna problem with iPhones a few years ago led to many angry editorials, but it eventually blew over and the phone sold well. (I had one of those models and never had problems.)</p>
      <p>• When the iPad was first released, there were numerous editorials that no one would buy it because "iPad" sounded like a sanitary napkin. Seriously, some people were really upset; some of those articles can still be Googled. People also said it was ugly, or was just an oversized iPod Touch. But it went on to be a huge success.</p>
      <p>I agree that the new interface needs some work, but it's a beta for heaven's sake. And bloggers know that outraged articles about Apple get hits. Let's see how this all pans out when the tweaked version is released in the fall.</p>
