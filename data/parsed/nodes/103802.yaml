      <p>The only way there's not at least a hint of denial here is if one simply hasn't seen the deluge of discontent. I certainly agree that people go out of their way to complain (yes, especially about a UI) and I'm all for abrupt shifts for the better. But this is quite a bit more than the usually expected negative whining; people who would normally give Apple the benefit of the doubt aren't being able to do that any more. And actually I think that's good news.</p>
      <p>But really, I'm not fixated on public opinion here - I could even grow to like those gaudy gradations that designers [are taught to] hate. I just believe that the appreciation of how type works is totally lacking; letterforms are being treated as just another decorative element, not vessels of language. This is the classic Modernist delusion, which results for example in the infamous gray rectangles I hope most designers now know to avoid.</p>
      <p>Let me ask this: would it be shocking if Ive really doesn't get typography? But I don't believe in demonizing individuals; it's the "process" that gives a celebrity a job he can't handle that's the real culprit.</p>
      <p>hhp</p>
