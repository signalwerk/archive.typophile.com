      <p>Thanks, but on reﬂection I’m not sure diaphanous is the right description—I just had a quick look at the link above, on my iPhone. On further examination, most of the page designs are quite ﬂat and solid, although the use of Helvetica 35 does have a bit of a “see through” quality.</p>
      <p>Perhaps the use of such a light typeface is because “now we can”, with the high-res screen.</p>
      <p>That was certainly the case for the implementation of Helvetica 35 twenty years ago in print, when direct-to-plate output enabled high res printing of thin types at small size, without the attrition that occurs in photographic pre-press production.</p>
      <p>I discussed this in 2001: <em>Seeing the Light</em><br>
      <a href="http://www.gxo.com/archive/ARCHIVESPDF/General/60110SeeingtheLight.pdf" title="http://www.gxo.com/archive/ARCHIVESPDF/General/60110SeeingtheLight.pdf">http://www.gxo.com/archive/ARCHIVESPDF/General/60110SeeingtheLight.pdf</a></p>
