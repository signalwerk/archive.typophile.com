      <p>&gt; a euphemism for derogatory use of "gay"</p>
      <p>Yes I think that was his intention. </p>
      <p>A significant percentage of iPhone users are female, so a less masculine look certainly isn't out of place. Some of the type seems a little light to me, but it's hard to judge from screen shots, we'll need to see how they look on an actual iPhone.</p>
      <p>&gt; most of the page designs are quite ﬂat...</p>
      <p>Definitely a move toward "flat design", which is a current trend in interface design, although interestingly Apple has also added a 3D effect. The phone's sensors know when it's being rotated and they rotate the background in response, creating the effect that the icons are floating in front of the background. You can see the animation effect here:<br>
      <a href="http://gizmodo.com/ios-7-instead-of-flatness-we-got-depth-512291484" title="http://gizmodo.com/ios-7-instead-of-flatness-we-got-depth-512291484">http://gizmodo.com/ios-7-instead-of-flatness-we-got-depth-512291484</a></p>
