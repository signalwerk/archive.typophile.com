    <p>OK, now that you've all seen the new iOS 7, for which some claim that it is “over-Helveticated”, British Guardian “tested it on” a designer and he said “hairdressers”: <a href="http://www.guardian.co.uk/technology/shortcuts/2013/jun/12/skeuomorphism-apple-ditched-ios7" title="http://www.guardian.co.uk/technology/shortcuts/2013/jun/12/skeuomorphism-apple-ditched-ios7">http://www.guardian.co.uk/technology/shortcuts/2013/jun/12/skeuomorphism...</a></p>
    <p>Why would he say that?</p>
    <p>Do you hate the new look and typography of iOS 7?</p>
