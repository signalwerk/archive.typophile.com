  html: |-
    <p>I am designing a website and I would like to use Gill Sans for display titles &amp; short bursts of text.</p>
    <p>My idea is to render as png and sifr Gill Sans Extra Bold or Heavy for logo, taglines and main titles and using the default Gill Sans for mac for secondary titles and support text (list of links, navigation, sidebar content).</p>
    <p>For windows, where Gill Sans isn't present I will fall back to Trebuchet/Calibri MS(dependending of the os version the user runs).</p>
    <p>But I would also like to use a serif for long-length body text (mainly articles's content) at a somewhat bigger size than the average (14/16px).</p>
    <p>Do you think is possibile and advisable to couple Gill Sans with a serif like Garamond, Georgia or Cambria? If so, which of these fonts do you think is more suitable to coupling with Gill Sans (mainly with the extra bold/heavy weights)?</p>
    <p>My possibile choices are (limited to os default fonts): </p>
    <p>Garamond (with Hoefler Text and Palatino as fallbacks), Georgia ( with Palatino or Times/Times New Roman.) or Cambria (fallbacks: Georgia and Times/Times New Roman)</p>
    <p>I am not an expert so I am not comfortable in combining fonts and i would really appreciate your help.</p>
    <p>Thanks in advance</p>
