    <p>Hi Everyone,</p>
    <p>First post here, I hope you can help me.</p>
    <p>I am a graphic designer and front-end developer working on a project where I want to use P22 Underground. Unfortunately the hinting on Typekits version is pretty shitty on Mac and even worse on Windows. You can do some browser sampling here: <a href="https://typekit.com/fonts/p22-underground" title="https://typekit.com/fonts/p22-underground">https://typekit.com/fonts/p22-underground</a></p>
    <p>Therefore I wanted to know if anyone have had experience with P22 underground from myfonts? <a href="http://www.myfonts.com/fonts/p22/underground-pro/" title="http://www.myfonts.com/fonts/p22/underground-pro/">http://www.myfonts.com/fonts/p22/underground-pro/</a></p>
    <p>Or if anyone have some ideas for great alternatives? I've been looking at ITC Johnston from fonts.com as one.</p>
    <p>Thank you very much in advance,<br>
    Nilas</p>
