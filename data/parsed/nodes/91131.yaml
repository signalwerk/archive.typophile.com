      <p><em>The hinting on Typekits version is pretty shitty on Mac …</em><br>
      I think the term you are looking for is “rendering”. The Mac doesn’t use the hinting included in the font files — it comes up with it’s own interpretation of the curves as pixels. From what I can tell it looks like it struggles with the complex g and the light weights. These kind of issue will be there in all fonts. </p>
      <p><em>… and even worse on Windows.</em><br>
      Look at the difference between IE8 and Firefox in Win 7. Something is definitely wrong here. I suspect the browser samples are to blame.</p>
      <p>Are you planning on using this for text sizes?</p>
