    html: |-
      <p>try this</p>
      <p>swsh {<br>
      ignore sub @ALL @swsh1';<br>
      sub @swsh1' by @swsh2;<br>
      } swsh;</p>
      <p>where</p>
      <p>@ALL = All letters and punctuation<br>
      @swsh1 = The letters you want to be replaced by swashes<br>
      @swsh2 = swash variants</p>
