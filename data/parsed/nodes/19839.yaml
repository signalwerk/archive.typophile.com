    html: |-
      <p>Maybe the first ignore also prevents the end-swash substitution. By defining separate lookups, you also define the boundaries for each "ignore" (only valid within the lookup in which it was defined).</p>
      <p>feature calt (</p>
      <p>lookup caltstart (<br>
      &nbsp;&nbsp;&nbsp;ignore sub @letter_start @start';<br>
      &nbsp;&nbsp;&nbsp;sub @start' by @start_swash;<br>
      ) caltstart;</p>
      <p>lookup caltend (<br>
      &nbsp;&nbsp;&nbsp;ignore sub @end' @letter_end;<br>
      &nbsp;&nbsp;&nbsp;sub @end' by @end_swash;<br>
      ) caltend;</p>
      <p>) calt;</p>
      <p>Mr Hunt's suggestion to include X.start glyphs in the @letter class may also applies for X.end glyph substitution.<br>
      Either you include X.end glyphs in @letter too. Or you create separate context-classes for caltstart lookup (including a-z and a.start-z.start) and for caltend lookup (including a-z and a.end-z.end); I indicated this by adding "_start" and "_end" to "@letter" in the sample above. Both may result different substitution behavior with one/two-letter-words, so you should try both ways and see which looks better.</p>
    html_clean: |-
      <p>Maybe the first ignore also prevents the end-swash substitution. By defining separate lookups, you also define the boundaries for each "ignore" (only valid within the lookup in which it was defined).</p>
      <p>feature calt (</p>
      <p>lookup caltstart (<br>
      &nbsp;&nbsp;&nbsp;ignore sub @letter_start @start';<br>
      &nbsp;&nbsp;&nbsp;sub @start' by @start_swash;<br>
      ) caltstart;</p>
      <p>lookup caltend (<br>
      &nbsp;&nbsp;&nbsp;ignore sub @end' @letter_end;<br>
      &nbsp;&nbsp;&nbsp;sub @end' by @end_swash;<br>
      ) caltend;</p>
      <p>) calt;</p>
      <p>Mr Hunt's suggestion to include X.start glyphs in the @letter class may also applies for X.end glyph substitution.<br>
      Either you include X.end glyphs in @letter too. Or you create separate context-classes for caltstart lookup (including a-z and a.start-z.start) and for caltend lookup (including a-z and a.end-z.end); I indicated this by adding "_start" and "_end" to "@letter" in the sample above. Both may result different substitution behavior with one/two-letter-words, so you should try both ways and see which looks better.</p>
