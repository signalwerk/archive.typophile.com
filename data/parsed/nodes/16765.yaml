    html: |-
      <p>&gt;I know now that people take their ats seriously.</p>
      <p>The reasons I think that it would be good to have an alternative form of the @ sign are: 1. It always looks to me out of place, like a 'wrong font' character stuck in the middle of a line. 2. If it were only  in price lists, that would be OK, but now because of e-mail addresses it is not only on the internet, but in print on business cards, stationary, in books, magazines and newspapers. I don't know if there is a good solution along the lines of a spiral, but a more harmonious form than what we have would be an advance. </p>
      <p>Also because it is relatively new for e-mail, people would be more likely to accept an alternative, if it looked good. This might be an exception to the general rule that type design is inherently a conservative art.</p>
    html_clean: |-
