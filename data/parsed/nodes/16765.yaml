      <p>Thanks for all the comments. Here's the one I've decided on, for now anyway. It's most similar to Dan Sandler's.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/at4.png"></div><p></p>
      <p>Dan Reynolds asked: <em>Raph, have you tried a lower @, one with the “a” on the baseline...?</em>, and Pieter posted an example.</p>
      <p>Yes, I considered this form, but decided against it because the chirality (direction of spiral) felt wrong. This font is intended primarily for code listings, and so gross similarity to traditional forms is important. So, not too surprisingly, I chose one not too dissimilar from the Courier precedent. It's kinda conservative, but maybe one of these more exotic proposals will find its way into an arty future font.</p>
      <p>Uppercase @? This sounds strangely like the <a href="http://std.dkuug.dk/jtc1/sc2/WG2/docs/n2888.pdf" rel="nofollow">proposal</a> for uppercase ß, but imho with less justification. We don't have uppercase $%&amp;*, and the role of @ isn't that different.</p>
    html_clean: |-
