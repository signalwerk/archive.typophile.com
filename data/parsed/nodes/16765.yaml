      <p>Thanks, Mark. Now I know how to do the images so everyone can see them. </p>
      <p>I stuck the trial characters into a string of Myriad letters. The idea I was testing is that the right kind of spiral, even though it is out of character with the alphabet--like the &amp;--will still read as an 'at' sign in context, and will "color" better than the @ sign. </p>
      <p>--I notice that in Myriad they make the @ much thinner than the strokes of the letters, I guess because of color problems. Also true for Georgia, here on screen--is this general? Of course, if the idea of a spiral is sound, how to draw it appropriately will depend on the font.</p>
