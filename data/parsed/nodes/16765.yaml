    <p>Hi,</p>
    <p>   One of the glyphs that's giving me trouble in Inconsolata (see <a href="http://typophile.com/node/16444" rel="nofollow">critique thread</a> for more discussion there) is the beloved at-sign. The problem is, of course, that in the classical shape there are four vertical stems that need to be squeezed into the width of the glyph. In most fonts, you can make the @ wide to accommodate all those strokes, but in a monospace font that is not an option.</p>
    <p>   There are a number of 3-stem variants, notably that of <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=22&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=courier&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=altern%40tive+%40" rel="nofollow">Courier</a> and <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=29&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=letter+gothic&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=altern%40tive+%40" rel="nofollow">Letter Gothic</a>, but I find them kinda plain, and I feel that the central bowl lacks a-nature.</p>
    <p>   I sketched a bunch of 3-stem variants, and this is the one I liked best.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ats.png"></div><p></p>
    <p>   Since I haven't seen this particular variant before, my big worry is that it's too strange, and will stand out when people see it. Any opinions?</p>
