      <p>Thanks, Linda. I had stumbled upon his website a while back; what I didn’t know was that this was the same author of <a href="http://www.will-harris.com/store-h/typestyle.html" target="_blank">TypeStyle: How to Choose &amp; Use Type on a Personal Computer</a>.</p>
      <p>I hate to get nitpicky, but his website doesn’t seem to be a companion to that book, whereas the ones listed above are meant as an online complement, if you will, to each book.</p>
