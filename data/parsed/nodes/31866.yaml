    <p>It seems that typography books lately come with the added bonus of a companion website. I only knew of two so far...</p>
    <p><strong><a href="http://www.thinkingwithtype.com/" target="_blank">Thinking with Type</a></strong> (by Ellen Lupton)</p>
    <p><strong><a href="http://www.designingwithtype.com/home.html" target="_blank">Designing with Type</a></strong> (by James Craig, William Bevington, and Irene Korol Scala; now in its 5th edition)</p>
    <p>...but now I just saw a link on <a href="http://www.designobserver.com/" target="_blank">Design Observer</a> for the 4th edition of the book</p>
    <p><strong><a href="http://www.typographicdesign4e.com/index.html" target="_blank">Typographic Design: Form and Communication</a></strong> (by Rob Carter, Ben Day, and Philip B. Meggs).</p>
    <p>It’s nice to have these resources online, no?</p>
