      <p>Pick nits all you want: I won’t disagree.</p>
      <p>I’ll admit to not having spent much time looking at the site (I do have the book), and what struck me about both of them now is that they’re kind of, um, dated: I know I look at type differently now that I did 15-20 years ago (the book came out in 1990), but the site still seems stuck in that era.  </p>
      <p>Just one woman’s opinion....  ;-)</p>
