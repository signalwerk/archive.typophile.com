    date: 2004-11-08T10:43:00
    date_raw: 8 Nov 2004 — 10:43am
    votes: null
    html: "<p>Here's what Mac McGrew (American Typefaces of the Twentieth Century) has to say about it: <br> <br>\"<b>FRENCH ROUND FACE</b> originally called <i>Didot Roman</i> or simply <i>Modern,</i> was one of the first revivals of the faces cut by Firmin Didot in France about 1784. This was cut for Monotype in 1910, under the direction of J. Horace MacFarland and William Dana Orcutt. The italic unusual in that some lowercase letters have serifs like the roman. No. 16 on Linotype and Intertype is similar but heavier. Compare <i>Suburban French.</i></p>"
    html_clean: "<p>Here's what Mac McGrew (American Typefaces of the Twentieth Century) has to say about it: <br> <br>\"<b>FRENCH ROUND FACE</b> originally called <i>Didot Roman</i> or simply <i>Modern,</i> was one of the first revivals of the faces cut by Firmin Didot in France about 1784. This was cut for Monotype in 1910, under the direction of J. Horace MacFarland and William Dana Orcutt. The italic unusual in that some lowercase letters have serifs like the roman. No. 16 on Linotype and Intertype is similar but heavier. Compare <i>Suburban French.</i></p>"
  - id: 51503
