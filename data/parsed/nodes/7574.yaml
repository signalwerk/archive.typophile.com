    votes: null
    html: <p>Your assumption is usually a good one, but I suppose nothing prevents a publisher from using any type that is legible at the required type sizes.  <br> <br>The biggest problem with italics is that they are often neglected in type specimen showings in popular books. <br> <br>I have finished looking through the Jaspert book, and I have found no better match than the French Face Extended which was a Monotype typeface.  <br> <br>One problem that we have had several times is that Central European types are not well known in the U.S., and my reference materials are rather limited on those typefaces. If these typefaces are not Western European or American, my chance of identifying it is very limited.  <br> <br>It appears that neither of the typefaces I mentioned exists by those names as digital type. If you do not have the Jaspert book, I would be happy to scan samples of Albion and French Face Extended. <br> <br>I am not optimistic that I will find the italic. Unless someone else on  this Board has better references for European typefaces, this may end up as a mystery we can't solve for you.   I know you said it was 'just personal curiosity', but that's often what motivates us to learn to identify these things, I think. <br> <br>Besides, questions about text type are relatively rare, and kind of fun to research. So I will look in a few more places, but I am running out of material to check.</p>
