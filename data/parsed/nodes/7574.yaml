    html: <p>Well, it was only my (uneducated) assumption that the italic and the roman belonged to the same family. Given the setter's choice to use a different bold type (not only for headings but also for emphasis in the running text), I wouldn't put it entirely past them to have used a third face for italics.  <br> <br>Maybe some more italic samples will help to decide whether there's really significant difference in the serifs. <br> <br>However, please note that this is not urgent business -- I don't want to take up too much of your time. This is just personal curiosity on my part; as a reader, I find this particular Bible a masterpiece of readability (and thus of typography), in particular when compared to some of its successors, and I wanted to take a look at the works behind it :-). <br> <br>Endre</p>
