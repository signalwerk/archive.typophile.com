    html: <p>Thanks for your joint effort, folks, also for the quote from McGrew. <br> <br>I ordered Jaspert's Encyclopedia at Amazon. <br> <br>Unfortunately I don't have all information I would like on the Bible edition in question, but it seems to me that it's an unchanged reprint of a previous edition set in metal type (metal setting is what an irregular baseline points to, or am I wrong?). <br> <br>I know that the text hasn't changed since 1908 (when it was published by the British and Foreign Bible Society), but it has probably been re-set a few times. <br> <br>As to the bold, I have included a few more samples in case it helps. But maybe I should open a new thread for that? <br> <br>Endre <br><img src="http://www.typophile.com/forums/messages/83/53413.jpg" alt="GagyjTkedb"> <br><img src="http://www.typophile.com/forums/messages/83/53414.jpg" alt="ARErc"></p>
