  html: <p>Another riddle I haven't been able to solve on my own is what exact type the most widely used Hungarian bible is set in. <br>The edition I refer to was published in 1989, so it may not be available digitally at all. <br>I'm looking for the type of the main text, but if the bold face used for the heading in the middle of the sample looks familiar to you, feel free to give it a shot. <br> <br>The cap height of the sample letters is approx. 1.7 mm, so the details are not necessarily 100% reliable. <br> <br>With the exception of "non-biblical" glyphs such as &amp; or Q, I can produce any sample needed :-). <br> <br>Thanks again, <br>Endre <br> <br><img src="http://www.typophile.com/forums/messages/83/53083.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/83/53084.jpg" alt=""></p>
