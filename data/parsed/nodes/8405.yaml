  html: <p>I admire the typography used by Tate Gallery, London. They use it for signage inside the museums, on the web, and other places. It kind of resembles <span class="caps">VAG</span> and Helvetica Rounded. Maybe it’s a custom face made by Wolf Olins, who created the identity for Tate Gallery. Can anyone clarify? <br><br>You can have a close (but brief) look at it by typing <br><br><a href="https://web.archive.org/web/20190927070937/http://www.tate.org.uk/britain/default.htm" target="_top">http://www.tate.org.uk/britain/default.htm</a># <br><br>… and the click on “Explore Tate Britain”. <br><br>Soren&nbsp;O</p>
