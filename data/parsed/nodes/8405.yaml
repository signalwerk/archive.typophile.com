    html: <p> This is genius. Not merely from a typeface  <br>perspective, but from a corporate identity  <br>perspective as well. <br> <br>Typical corporate identity systsems strongly  <br>caution against variation. You could even argue  <br>that too much variety dilutes a cohesive  <br>identity. But in this case you could see how  <br>variety would only strengthen the whole. <br> <br>Imagine you're an in-house designer at the Tate.  <br>Instead of being handed a system that you could  <br>potentially get very tired of, you're inspired by  <br>its a huge array of possibilities. Brilliant. <br> <br> <br>//joe </p>
