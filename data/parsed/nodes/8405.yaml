    html: <p> Handling a corporate design system is pretty much a matter getting other people to follow the rules for application. I guess the flexible Tate trademark does not have a guarantee against becoming uninspiring after some months or years. But I like Wolff Olin's way of rethinking what a trademark can be. <br> <br>Soren O </p>
