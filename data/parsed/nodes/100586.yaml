      <p>Some opinions:<br>
      - Are you sure it's a good idea to use DIN for the text? Is there not a lot of text?<br>
      - Caslon and Perpetua are very old-fashioned. Mrs Eaves is more interesting, but it's horribly spaced, so you would need to manually respace every single setting.<br>
      - I don't know what "squiggy" means.  :-)<br>
      - Instead of extreme contrast between text and titles I might aim for more harmony, choosing a squarish face for the titles (maybe Melior, or preferably something more recent). But first make sure you want to use DIN.</p>
      <p>hhp</p>
