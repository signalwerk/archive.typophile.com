    html: <p>Frutiger’s <a href="http://www.myfonts.com/fonts/linotype/egyptienne-f/" rel="nofollow">Egyptienne F</a> may be a good serif match for DIN, but unlike Melior (which I love) it doesn’t look so old-fashioned, at least to me. And I second Hrant, you may want to consider using the serif face for text and DIN for the headlines.</p>
