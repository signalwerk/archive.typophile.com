    <p>Hello everybody,</p>
    <p>i am currently writing a tutorial book about 3D design with an artistic spirit in design and typo and so on. Most of the papers in categories that have a lot to do with computers etc are not that much enjoyable to read according to layout and design :)<br>
    which i cannot understand because 3D professionals actually should provide a certain sense for design!</p>
    <p>however, i decided to use DIN LightAlternate or RegularAlternate for text and now am looking for a nice contrasting serif font for headlines!<br>
    I already considered Big Caslon, Mrs Eaves and Perpetua Titling but I don't know... probably they are still too boring (?)<br>
    The headlines can be a little squiggy because the book itself will be kind of classic (which is also the reason why i would not like the text to be in a serif font too because i like the contrast between classic and simplicity (DIN) )</p>
    <p>Thank you in advance!!</p>
