    <p>Hello all,</p>
    <p>I’m in the middle of a rush job for a friend who needs an identity for his startup…cornerstone 1 media. He’ll be publishing books about the key knowledge that helps influence decision making before the adaption of technology. That’s it in a nutshell.</p>
    <p>I’ve already shown him one round of designs and he gravitated toward the logo with the number one. This is the second round. Unfortunately, neither of us has a lot of time to spend on this so I’m trying to nail it down quickly. I would appreciate any comments or suggestions about the attached direction.</p>
    <p>Thanks so much for your help.</p>
    <p>Tammy</p>
