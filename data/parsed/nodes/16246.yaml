    html: <p>Hi Tammy, personally I see “Cornerstone Media” and don’t read the “1” as part of the title. I’m not sure what anyone else will think, but I would look at trying to integrate the 1 better. It’s always difficult to achieve legibility with this approach, personally I would look at using the dimensional 1 as a separate icon, and pull out the name as another element to avoid confusion. Best - Chris</p>
