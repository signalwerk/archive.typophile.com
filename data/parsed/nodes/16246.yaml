      <p>How does this shape relate to the idea of a cornerstone? I know it’s a corner but it just looks like the 1 is a dorr or something. I get a vague feeling from it.</p>
      <p>Take a look at this</p>
      <p><a href="http://www.senate.michigan.gov/Virtualtour/Virtual%20Tour%20Pictures/CapitolDome/cornerstone%20copy.jpg">http://www.senate.michigan.gov/Virtualtour/Virtual%20Tour%20Pictures/CapitolDome/cornerstone%20copy.jpg</a></p>
      <p>Thats a cornerstone. And with type too.</p>
      <p>I also saw this but I didn’t like it.</p>
      <p><a href="http://www.cornerstone.edu/">http://www.cornerstone.edu/</a></p>
      <p>What if you had 3 lines &amp; a random stone shape. Get it? Corner, stone?</p>
      <p>It’s a tricky thing on short notice. But then you can’t expect a miracle on short notice. Maybe you can talk him into more time. </p>
      <p>Whatever happened to *your* logo?</p>
      <p>Cheers!</p>
