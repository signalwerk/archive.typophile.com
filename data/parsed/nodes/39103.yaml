      <p>Are you sure this is the right approach?<br>
      Do you have a lot of stuff you’ve bought because you liked the packaging/it was a good deal — but then never used?<br>
      The book unread, the shirt not worn?<br>
      I’d say “the best way to begin to build a typeface library” is on an ad hoc, per project basis. That way, no wallflowers.<br>
      But ditto Tiff on working directly with indie foundries.</p>
