    <p>I would truly appreciate your advice on the best way to begin to build a typeface library. Say I have $1000 to spend on typefaces, what would you recommend I invest it in?</p>
    <p>I know there are a bunch of type libraries and collections out there, but they all seem to contain many not so useful typefaces along side the great ones. Is there a specific collection you would recommend? One that would be a great basis to build upon? You know how it is. I want to get the best bang for my buck! </p>
    <p>I have seen the list of essentials on here, and that is great, but I am interested in a concise list of bare necessities for under $1000.</p>
    <p>I can’t wait to see your suggestions! I think it would be very helpful for many who are starting a library.</p>
