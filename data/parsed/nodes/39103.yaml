      <p>Thanks so much for your advice. I really like the idea of approaching a foundry with a budget and asking them assist in putting together some workhorse typefaces—and in the process begin a relationship with them. I hadn’t thought of that. </p>
      <p>I appreciate the top 20 lists very much too. Although I notice that that many of the lists seem to come with caveats like ’these are workhorses, but most experienced designers end up using 5-6 faces over and over and get to know them really well’. Hmmm, this provokes the question ’What are your five or six favourites that designers keep coming back to? The typefaces you use that are not the classics or the workhorses? The faces that reoccur in the projects you love?</p>
      <p>I increasingly recognize that perhaps my approach is flawed and am reconsidering. But am interested in learning of others’ favourites as possibilities to consider in the future when approaching particular projects. It sounds like a slow building process may be more desirable than a blanket expenditure. Thanks for invaluable input!</p>
