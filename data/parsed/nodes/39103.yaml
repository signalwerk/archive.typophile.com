    html: <p>This really depends on what type of work you’re doing. I would recommend you spend 3/4 of your budget on “workhorse” sans and serif families, and get a few script and display faces as well. There are a lot of good suggestions on the lists posted above. I would encourage you to really think about usage, and to look carefully before purchasing. I’ve bought more than a few type families that I just couldn’t resist, that have yet to be used.</p>
