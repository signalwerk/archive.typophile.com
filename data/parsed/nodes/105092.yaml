  html: |-
    <p>Does anyone have any recommendations for a font(s) to use for a sophisticated and elegant holiday card? The kind of type that would be used by a high end fashion company or fashion pr company on their corporate holiday card. Nothing too cold though. Should have a personal and/or cute touch. </p>
    <p>Thanks!!</p>
