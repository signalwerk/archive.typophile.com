    html: "<p>I think that Einstein's spiritual or religious feelings were very strong from his childhood, and never diminished. Einstein was a friend of Gödel, I believe, but he had a very strong feelings about the mystery of the natural world from his early teen years, long before the incompleteness theorems. (This is what I get from Max Jammer's book.) Also there are many reasons to see mystery in the world other than Gödel. This is not the place to go into it, but I do discuss it in my new book, Pirke Avot: Timeless Wisdom for Modern Life.</p>"
