      <p>William, </p>
      <p>Thank you for the detailed response. </p>
      <p>The reason that I made the comment regarding <em>spiritual</em> versus <em>religious</em>, is simply because the term religion (and thus, religious) is, for the most part, associated with doctrine, or any form of a defined <em>system</em> of belief. As far as I know, Einstein never attended shul, prayed "Adon Olam", or proclaimed "Pour thy wrath upon the Gentiles" during a Seder. He was (as you mentioned) "in awe of the heavens", and saw God's silhouette in the very fabric of creation and the universe. As such, I believe that the term "spiritual" is perhaps more appropriate.</p>
      <p>Perhaps Einstein's increased sense of spirituality was, at least in part, due to the apparent failure of the greater Logical-Positivist project. Kurt Gödel’s <em>Incompleteness Theorem</em>, which delivered the coup de grâce to Logical Positivism, also left the door (slightly) open to more spiritual (and less positivist) conceptions of the natural world—it let some "mystery" into the equation.</p>
      <p>Now, just to keep the topic within the realm of typography, I agree that TNR is a superb typeface (for columns), but its ubiquity makes the magazine look cheap, and it certainly lacks the so-called "air of authority" that a good Caslon commands. I will write to the editors and share my typographic misgivings with them.</p>
