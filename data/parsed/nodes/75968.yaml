      <p>Thanks, Adam. On the typography. </p>
      <p>They have used Adobe Caslon for display and TNR for text for a long time. Actually I think Adobe Caslon is rather nice for display; I don't think it works so well as text. Of course, I think my Williams Caslon Heading and Display would be still better, but they're not yet complete or published. I do think that Williams Caslon would be much better suited for the text of this magazine. TNR is a great face, but rather impersonal and a bit cold. But I'm not the designer of the magazine, it's not my call.  </p>
      <p>I also didn't do the title of the article, which I only saw after publication. I do think it is accurate to call what happened to Einstein as a child a religious awakening, though I don't use those words in the article. Later when, as a pre-teen, he firmly rejected a personal God, but kept a deep religious feeling about his work, I think it is a toss-up whether you call it spiritual or religious. He himself says that in one sense, but only one, he is "deeply religious." </p>
      <p>Einstein's religious views are fascinating and hard to categorize, which is what the article is about. I had a lot more to say, but they cut it down to a journalistic report on Einstein, and not an assessment of his views, which I did a draft of. Another time and place, I hope ...</p>
      <p>ps For anyone interested, the article (without the print formatting) is <a class="freelinking external" href="http://reformjudaismmag.org/Articles/index.cfm?id=1828" rel="nofollow">online here.</a></p>
