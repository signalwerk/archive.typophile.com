      <p>Bill, a superb and rather illuminating article.</p>
      <p>I also just read and enjoyed your article in <em>Reform Judaism</em>, titled <em>Einstein's Religious Awakening</em>. Now I know that this might not be the correct forum, but... I did have two comments to make regarding the later article.</p>
      <p>1. Why is the title (and your name) set in <em>Adobe Caslon</em>??? In fact, why is the magazine set in TNR? Please help them see the light (typographically speaking)! I would much rather read the magazine set in your own beautiful rendition of Caslon.</p>
      <p>2. Was Einstein's "awakening" not a <em>spiritual</em> one, rather than a "religious" one?</p>
