      <p>Frederick, thanks for the kind words. </p>
      <p>Williams Caslon Text does have small caps lining figures. You can access them by going to Character/Open type/All small caps. Unfortunately, in InDesign the "Open Type" option, at least in CS4, is well hidden. You have to click on the box at the top right of the Character window to access it. </p>
      <p>On the Display and Heading sizes. A basic character set for the Roman exists for the Heading Medium size, and for a "Small" text size regular. The Heading size Medium is based pretty closely on the Great Primer of Caslon, 18 pt., and the proportions of the Small text is based on Caslon's Long Primer, about 9.5 pt. These are both sizes that historian James Mosley singled out, I think rightly, as some of Caslon's best. I also did the a small set of characters of Display italic for my <a class="freelinking external" href="http://www.jewishpub.org/product.php?id=444" rel="nofollow">recently published book.</a> (I didn't do the cover.) The display italic is more of my own thing. </p>
      <p>Here is the display italic in the book:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Avot_Acknowledgments_grab_4670.png"></div><p></p>
      <p>.<br>
      And here is a bit of the Small in the Appendix:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Avot_Appendix_grab_3851.png"></div><p></p>
      <p>.<br>
      I had been thinking to wait for demand to do the Display and to complete the rest, but now I'm thinking that having the rest will really help to get the Text size out there. In fact, I had to continually restrain myself from increasing contrast, which magically makes everything more pretty and elegant, though in my view less good for text size. So I will get to this sooner rather than later, but I dare not say how quickly—unless there is a commission to finish it, of course!</p>
