      <p>Very enjoyable essays, Mr. Berkson. Are you planning additional installments to discuss the specifics of your display and heading sizes? Given how independent Caslon's optical sizes are, I'd think you'd have more to say on the subject than most. I'm intrigued by how eclectic Caslon's influences are across those sizes. Have you been able to trace any of the specific influences, or do any specific sizes stand out as more idiosyncratic than the rest?</p>
      <p>Williams Caslon is likely to become my favorite Caslon revival. As much as I appreciate Justin Howes's magnum opus, I don't have any of the right applications for it in the kinds of works I publish. Adobe Caslon, as important a work as it is, lacks that essential Caslon warmth as you discuss in your essays; also, for my purposes, it lacks italic small caps, which are essential to taming the menagerie of acronyms I have to work with.</p>
      <p>Has Typophile run a thread yet about the release of Williams Caslon Text? If so, I haven't been able to locate. If not, they should.</p>
      <p>The earlier Caslons thread on Typophile should also be extended to mention the release of your text size, since it does mention your work in progress a couple years ago. Also, the Caslon page in Typowiki should be updated to reference and link to it.</p>
      <p>On a complete side note, would you be willing to entertain the idea of adding small-caps lining figures to Williams Caslon Text? I know you have plenty of more important things to worry about with your project, but I sure could use them to help tame variable names, program names, Canadian ZIP codes, and other alphanumeric scrambles.</p>
      <p>And finally, could you give us a status update on Williams Caslon Display and Heading? I'm in no way wanting to pressure you to finish sooner - things need to cook until they're done - but I'm sure I'm not alone in being genuinely interested in what you're working on.</p>
