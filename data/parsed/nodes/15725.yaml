      <p>I agree with all the assertions that this is probably handwritten, but the point should be do we know of a font that looks like this. I think it looks an awful lot like a font called <a href="http://bowfinprintworks.com/Script09Pg3.html" target="new" rel="nofollow">Desyrel</a> (forth row down). It is by Dana Rice and can be found with the <a href="http://www.moorstation.org/typoasis/designers/lab/a_d.htm" target="new" rel="nofollow">Apostrophic Lab fonts at TypOasis</a>.</p>
      <p>- Mike Yanega</p>
