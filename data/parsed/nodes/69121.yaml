  html: <p>The “<a href="http://topics.nytimes.com/topics/features/magazine/columns/on_language/" title="Column archives" rel="nofollow">On Language</a>” column of the <cite>New York Times</cite> has used custom-illustrated logotypes each week for years, which the Society of Publication Designers blog helpfully collected in two posts (<a href="http://www.spd.org/2010/03/post-3.php" title="Celebrating ‘On Language’" rel="nofollow">first</a>, <a href="http://www.spd.org/2010/04/celebrating-on-languagepart-2.php" title="Celebrating ‘On Language,’ Part 2" rel="nofollow">second</a>). Many Usual Suspects are represented among the letterers.</p>
  html_clean: <p>The “<a href="http://topics.nytimes.com/topics/features/magazine/columns/on_language/" title="Column archives" rel="nofollow" class="link-external">On Language</a>” column of the <cite>New York Times</cite> has used custom-illustrated logotypes each week for years, which the Society of Publication Designers blog helpfully collected in two posts (<a href="http://www.spd.org/2010/03/post-3.php" title="Celebrating ‘On Language’" rel="nofollow" class="link-external">first</a>, <a href="http://www.spd.org/2010/04/celebrating-on-languagepart-2.php" title="Celebrating ‘On Language,’ Part 2" rel="nofollow" class="link-external">second</a>). Many Usual Suspects are represented among the letterers.</p>
