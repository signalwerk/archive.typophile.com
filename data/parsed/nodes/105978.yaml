    html: |-
      <p>Perhaps our typophiles are stumped because the logo is extensively edited. About all I can offer are a couple of thoughts on origin of the base font.<br>
      This is a thickened version of measured designs that can trace their lineage to Trafton, designed by Howard Trafton and cast by Bauer in1933; Coronet designed by R. H. Middleton for Ludlow in  1937; and Stylescript designed by Sol Hess in 1940 for the Lanston Monotype Company. Harold's Fonts has digitized Stylescrpt as <a href="http://www.fontbros.com/families/swizzle-script/styles/regular/?code=identifont" rel="nofollow">Swizzle Script</a>. The logo in Swizzle Script:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SwizzleScript_4532.jpg"></div><br>
      Don<p></p>
