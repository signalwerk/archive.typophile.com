  html: <p>Well, TypeCon got me all fired up, so (against my nature and better judgement) I thought I might try to start a Forum for educators to discuss their particular (?) brand of problems. Maybe an "Idea Clearinghouse" of sorts. At my school, most discussions degenerate into b!tch sessions at an amazing speed. Hopefully this will be different, but perhaps there could be a special "Screaming into the Void" thread. All (including non-teachers) are welcome, of course. <br> <br>I'm not sure how many of you typophiles actually <i>are</i> teachers - but I was surprised for some reason to realize how many folks at TypeCon were educators. So perhaps this forum has legs. <br> <br>I'm fairly new at teaching - I've been at it for about 5 years now. I never had a formal design education myself. I went to grad school to study  painting and linguistics; that, coupled with having run printing presses for several years, engendered my interest in typography I suppose. So here I am. <br> <br>I'm probably not the best person to start or moderate a forum since I'm usually in the classroom or in unbearably stupefying meetings, but I look forward to talking to whoever may be interested. <br> <br>Cheers, <br> <br>Nathan</p>
