    <p>The first exhibition of Tipos Latinos 2010 opened in Santiago, Chile, on April 14th 2010. The program of activities included two days of lectures at the Centro Cultural de España. Scaglione was the keynote speaker on the first day, with a lecture entitled "Shaping Types" that focuses on typography for editorial design. On the second day, Isaías Loaiza presented a lecture about corporate fonts and the role of typography in a corporate id program. The TiposLatinos 2010 exhibition includes two typefaces by TypeTogether: Karmina Sans and Adelle. The photo in this story is courtesy of Consuelo Saavedra.</p>
