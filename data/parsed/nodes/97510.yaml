    <p>We've got Benton Sans as a house font which we've started to implement on the website. The devs are telling me that it's really heavy when users download causing huge caching issues. </p>
    <p>The bright idea to reduce the font weight be removing certain characters as now lead to this bodged jagged appearance of our font. Have the developers removed vital data files that effect the render in their hackjob.</p>
    <p>So my question is:<br>
    Is there a web version of Benton we can purchase, I couldn't find it anywhere.?<br>
    and<br>
    so webfonts aren't the holy grail that was once espoused if all these weight issues stop implementation?</p>
