    html: |-
      <p>It sounds like you are moving outside your license agreement. 1: Modifying the font files. 2: Uploading the font files to a web server. Nr. 1 is rarely allowed. Nr. 2 is allowed in very few situations, but for the most part foundries prefer (for licensing and technical reasons) to serve font files with renting services. Font Bureau’s fonts are available from webtype.com. <a class="freelinking external" href="http://www.webtype.com/font/bentonsansre-family/" rel="nofollow">Benton Sans RE</a> is a special version of Benton Sans optimized for text sizes on screen, and the <a class="freelinking external" href="http://www.webtype.com/font/benton-sans-family/" rel="nofollow">Benton Sans Family</a> (without the "RE" extension) offers the full range of styles for use at headline sizes.  I’m not sure if Webtype have a method for automatic subsetting, but most other web font services do.</p>
      <p>They do offer the option of hosting files on your own server. If you have special needs (re: file size etc.) I suggest you contact them directly via e-mail.</p>
