    html: <p><i>...eventually every possibility will be exhausted.</i> <br> <br>This might take a while. There are 22,300,745,198,530,600,000,000,000,000,000,000,000,000,000 possible combinations of black and white pixels in a 12x12 grid (2 to the power of 144). Admittedly, not all of these combinations are useful (relatively few even), but it does illustrate that there is plenty of room for variation, even in a relatively small area. <br> <br>Remember, too, that there are hundreds of characters in each font and some characters offer more room for variation than others (e.g., lowercase g vs. a period).</p>
