    html: <p><i>In terms of uniqueness, Mark's scary numbers notwithstanding, there is in fact a very real practical barrier of permutations at smaller sizes. That's why I try to only make grayscale pixelfonts now - calculate that, Mark! ;-) </i> <br> <br>Well, for a 12 x 12 grid with 16 levels of gray, that would be 247,330,401,473,104,534,060,502,521,019,647,190,035,131,349,101,211,839,914,063,056,092,897,225,106,531,867,170,316,401,061,243,044,989,597,671,426,016,139,339,351,365,034,306,751,209,967,546,155,101,893,167,916,606,772,148,699,136 combinations. <br> <br>If you step that up to 256 levels of gray you get 61,172,327,492,847,069,472,032,393,719,205,726,809,135,813,743,440,799,050,195,397,570,919,697,796,091,958,321,786,863,938,157,971,792,315,844,506,873,509,046,544,459,008,355,036,150,650,333,616,890,210,625,686,064,472,971,480,622,053,109,783,197,015,954,399,612,052,812,141,827,922,088,117,778,074,833,698,589,048,132,156,300,022,844,899,841,969,874,763,871,624,802,603,515,651,998,113,045,708,569,927,237,462,546,233,168,834,543,264,678,118,409,417,047,146,496 combinations. Personally, I think this is overkill and that 16 is plenty. :-)</p>
