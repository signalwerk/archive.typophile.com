    html: <p>&gt; will you elaborate further on the process? <br> <br>Where a b&amp;w pixelfont places a block (as an outline) where the "virtual pixel" is for a given PPEM size, a grayscale pixelfont fills that block only partially, to get a <i>shade</i> when it's rendered. However, the tricky part is getting consistent rendering accross platforms and apps, since for example Photoshop and Flash interpret the degree and type of filling differently... <br> <br>hhp</p>
