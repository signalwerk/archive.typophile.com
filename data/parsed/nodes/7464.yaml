  html: <p>I'm not sure how it happened, but all of the sudden I've become an enthralled, obsessed, captive audience to the concept of small-scale pixel fonts (I mean stuff for smaller devices, cell phones and the like). <br> <br>I know next to nothing about the theory of designing these fonts, and have a lot of questions about it all (like, what is the standard grid dimension--12x12, right?).  Regardless of the size, I know there are obvious limitations, anyone can see that with a limited number of pixels to work with, eventually every possibility will be exhausted.  I don't know what the total number of possibilities is if you take into account every possible permutation of the grid, but I do know that the number of possibilities when specifically carving letterforms from the grid is significantly lessened (for example, let's say you design the letter 'H' in the grid consisting of 23 pixels [9 per each stem, 5 for the crossbar], that's one possibility; but we're not going to consider it another [real] possibility if that same design is taken and a pixel is added to each of the four extreme corners--this demonstrates the constraints). <br> <br>So, you can only do so much, because it will [eventually] all be designed.  But, what are the possibilities if we stop seeing the design of these fonts on a microcosmic scale, and start looking at the bigger picture, i.e., a massive grid, each letterform design acting as a "pixel" in the grid of the font as a whole.  So, in other words, at some point in the future (let's say in the year 2525) when all the possibilities for each letterform have been set, my clone (which was born some time around 2497) takes a font designed by Joe Gillespie's clone and say's "Hey, I like all of these glyphs, except I don't think that the 'c' fits into this set, better would be to include the 'c' from "pixelfont XT37JM2323"--it's a totally different font then, right?</p>
