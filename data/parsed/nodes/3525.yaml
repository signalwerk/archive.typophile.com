  html: "<p> Folks, <br> <br>A quick update about what's been going on the last five days at Typophile: <br> <br>We've experienced an unprecedented amount of traffic. In september, we experienced somewhere over two million page requests, largely creditted to the flood of traffic created by the Smaller Picture project.   <br> <br>In a nutshell, we got a fat bill from our host for using 12.6 gigs of bandwidth over our allotted limit.  They shut down the smaller picture as it was causing server load issues. Inadvertently they shut down the forums as well. <br> <br>We apologize for the downtime in the forums - thanks to those who alerted us to it. We'll try to get the smaller picture back up soon, with some modifications.  <br> <br>Without further ado, the floor is yours-- <br> <br>jared </p>"
