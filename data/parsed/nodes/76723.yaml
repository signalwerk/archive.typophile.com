    <p>Hello,</p>
    <p>I'm studying graphic design in Finland and am quite new to the world of typography. I have been reading this forum for a some time now, and the time has come to ask for your assistance with a font from a logotype.</p>
    <p>I tried identifying the font at WhatTheFont, without luck. I think it has some similarities with bold and semibold cuts of Stone Serif, Cambria, Georgia and some Garamonds. Having read my Bringhurst, I think it has some baroque (drop terminal ‘a’, moderate aperture, axis) but it looks modern to me. The serifs (or stem) on ‘n’ and variable terminals should make it easier to identify. I am quite sure it's something really obvious, I just don't see it.</p>
    <p>Thanks,<br>
    Riku</p>
