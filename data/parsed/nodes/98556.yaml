      <p>The type needs more presence. I'm not sure why "vintage" is heavier in the top example - it makes it seem that's the name of the brand. Also, if you're shooting for class I'd make the shield taller - not so square. On the other hand the short shape does look more contemporary. But I don't think that sans is very contemporary - it looks like something that could have been made any time in the last 100 years...</p>
      <p>You might want to use "bicycle" instead of "bike" (which I think is too casual). Or for that French touch you want what about "bicyclette"?</p>
      <p>hhp</p>
