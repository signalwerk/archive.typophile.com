    html: |-
      <p>I'm not in love with it. I like the design out-right but I don't feel like it's representing the french style ... specifically vintage french bicycles (for which I am a huge fan)</p>
      <p>I would research Rene Herse, Alex Singer, Peugeot, Motobecane and other famous bike brands both bespoke and mass production. I think you'll find some remarkable imagery to consider. </p>
      <p>Many french bikes had steel tubing decals such as Vitus or Reynolds steel tubes. Those decals have a unique enclosure shape that might also tie this more closely to the subject. Google: "Vintage French Headbadge"</p>
      <p>Maybe make the word "Vintage" a larger script of some kind. I like that you're thinking about an enclosure. Very appropriate.</p>
      <p>S.</p>
