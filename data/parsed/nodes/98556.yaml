    <p>bike brand logo</p>
    <p>Hi everybody, </p>
    <p>I'm working on a logo for the future brand called "Franch Vintage Bike"<br>
    I want something simple and timeless, so I have chosen a shape of coat of arms (For the vintage style) and a sans serif font (for the contemporary style).<br>
    I want some advice to find a detail who will give an identity more spécific to my logo.<br>
    It could be a special characteristic on the type (or an other type for "Vintage), it could be an additionnal element for the French touch (symbol).<br>
    I have made several trials but I always return to my first draft...<br>
    I'm open for all your propositions and advices.</p>
    <p>Ps : Sorry for my english.</p><div class="imageWrap"><img src="http://typophile.com/files/Capture d’écran 2012-12-01 à 14_5438.44.10.png"></div><p></p>
