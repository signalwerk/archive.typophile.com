      <p>One thing to keep in mind whenever you see <em>regular, text, book,</em> and <em>normal</em> suffix type weights is that <strong>NOT ALL</strong> type families or expanded weight families were conceived or developed as a whole package.</p>
      <p>Many revival families with book or text weights, as well as expansions to initial releases of digitized font families were added <em>afterwards</em>, sometimes years or decades later, often to correct or enhance design of <em>regular</em> weight specifically for book/magazine publishing. The necessity to have additional weights often came as responses to market requirements.</p>
      <p>Since there are no standards associated with weight naming and actual type densitiy (not all text, book or regular weights are comparable to each other from type family to type family), you really have no way of determining what looks or works best for your projects other than testing the actual output. So follow what Patty and Chris suggest above and use your own judgement.</p>
