      <p><cite>I wonder what the typical Typophiler would say about text vs. book weight? Maybe it is poll time?</cite></p>
      <p>My $.02<br>
      Regular is the roman weight of a font that just can't bring itself to be called Roman, often in a Sans that was never meant for body copy. Text is for setting long blocks of text as opposed to ad copy. Book often seems to mean that some foundry is milking a cash cow and churning out more weights of a font than are really necessary, ie. AG Buch.</p>
