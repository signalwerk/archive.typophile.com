    <p>Hi guys:</p>
    <p>Assumptions: regular/normal <a href="/wiki/weight" class="freelinking" rel="nofollow">weight</a> is slightly (but noticeably) lighter that text/book weight fonts. Regular/normal weight tends to look anemic and high contrast at text sizes.</p>
    <p>I assume that the text weight is suitable for longer passages of text, as in body text, and probably optimized for sizes 8-12 points.</p>
    <p>Then when is it appropriate to use the normal/regular weight in design work. What's it for?</p>
    <p>I ask this because of the way some FontFont packages are divided. Examples are Kievit 1 &amp; 2, Milo 1 &amp; 2, Max 1 &amp; 2 and others. In these packages book/text and regular/normal are separated.</p>
    <p>So what choice does the designer who may not have the money nor want the overhead of having both packages do?<br>
    Its not as simple as roman, italic, bold and bold italic.</p>
    <p>And then to make matters more interesting take a look a Emigre Vista. In the "Love Letters" catalog the sample texts are set in the regular weight. The book weight is actually lighter than the regular weight. Go figure.</p>
    <p>So what is the intended function of regular/normal weight? And is the book/text weight really important?</p>
    <p>Thanks for helping ( I need it ),</p>
    <p>Mike Diaz</p>
