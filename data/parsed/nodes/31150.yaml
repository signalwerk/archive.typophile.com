      <p>This is also a question I wrestle with as a type designer. As far as things already on the market, there is no definitive answer. Frutiger has the best idea with his numbering system. You at least know which weight is bolder just from the number.<br>
      The terms Regular, Normal, text, book, light are sometimes used interchageably and sometimes have a clear meaning. I have also seen book look lighter than regular in some families. Patty is right, you really have to look at samples set as text blocks to be able to make up your mind. Designers who have created cuts for specific uses are giving you the most help in chosing. Many of the larger superfamilies have a cut for text, subhead, caption, and display. The cuts are optically sized to fit the intended job. Often, it is not just lightness that changes, it is usually contrast, xheight, and width as well. A caption cut will be a bit bolder, more extended, higher xheight, and have a bit less contrast than a text weight.<br>
      Another consideration is printing and paper stock. A more absorbent text paper may print a bit darker than a coated stock. Looking at a typical phone book page will give you the extreme.</p>
      <p>I wonder what the typical Typophiler would say about text vs. book weight? Maybe it is poll time?</p>
      <p>ChrisL</p>
