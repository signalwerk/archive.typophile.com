      <p>I usually find "book" weights to be lighter than "regular" or "normal".</p>
      <p>I think normal is a stupid name for a weight anyway. </p>
      <p>IMHO there is so much variety in font styles/weights that you should go with what intuitively looks best, and the only way to figure that out is to print it on a high dpi printer. Clearly when a font has a "display" weight that is designed for larger sizes and headlines. I am frequently frustrated by the (seemingly) arbitrary way fonts are packaged, usually I want to mix and match but that's sometimes more expensive. As in, I'd rather have book and regular but maybe not light and bold.</p>
