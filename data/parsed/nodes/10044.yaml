  html: <p>Apologies if this has been covered before; I couldn't seem to get the forum search to work. <br> <br>In many of my Pro families - Warnock, Jenson, etc - there are, in addition to all the various weights, faces for Caption, Subhead, Display, and other programmatic descriptions. <br> <br>What's the deal with these? How do they differ from the Regular face (I see differences in kerning, but I don't know the rhyme or reason to them), and if they only do differ in terms of spacing, what's the reasoning that makes, say, the 'Caption' face more tightly spaced than the Display, and so on?</p>
  html_clean: <p>Apologies if this has been covered before; I couldn't seem to get the forum search to work. <br> <br>In many of my Pro families - Warnock, Jenson, etc - there are, in addition to all the various weights, faces for Caption, Subhead, Display, and other programmatic descriptions. <br> <br>What's the deal with these? How do they differ from the Regular face (I see differences in kerning, but I don't know the rhyme or reason to them), and if they only do differ in terms of spacing, what's the reasoning that makes, say, the 'Caption' face more tightly spaced than the Display, and so on?</p>
