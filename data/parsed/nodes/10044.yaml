    html: '<p>You can ﬁnd information about these faces on <a href="http://store.adobe.com/type/opentype/main.html#adv" target="_blank">http://store.adobe.com/type/opentype/main.html#adv</a> under “Advanced Typography”. <br><br>One citation from there: “Historically, some of the highest quality typefaces have included diﬀerent designs for diﬀerent print sizes. Several of Adobe’s OpenType fonts include four optical size variations: caption, regular, subhead and display. Called “Opticals,” these variations have been optimized for use at speciﬁc point sizes. Although the exact intended sizes vary by family, the general size ranges include: caption (6-8 point), regular (9-13 point), subhead (14-24 point) and display (25-72 point).” <br><br>There has been a more detailed info about the “Pro” features some weeks ago, but since the adobe-website was redesigned meanwhile I couldn’t ﬁnd that yet. <br><br>Michael</p>'
