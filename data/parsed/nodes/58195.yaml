      <p>Hi, everyone. I'm a graduate student in linguistics and a bit of a type geek, and I've registered an account here to throw in my two cents this issue. In general, I very much agree with Jongseong. The differences between the various "a" characters in IPA is meaningful, and probably the only way to effectively handle it in italics is with either a separate font, or an OpenType or AAT Stylistic Variant (sorry, Andreas). As an end-user, I would personally favor the second approach, although I have no idea how much work is entailed in implementing such a feature.</p>
      <p>Charles_e's comment about fussy editors demanding italicized IPA is dead on, as I've experienced such things myself. In addition, there are a great many minority languages which have developed orthographies which include phonetic characters. When it becomes necessary to cite words or phrases from these languages, italic styles are practically indispensable. Unfortunately, there are very, very few acceptable IPA faces with italics, and none at all which include a matching typeface suitable for body text. This is one of the reasons I find Andron so exciting: it's an actually nice-looking typeface that features a nearly complete set of IPA characters. The requisite two-story variants of 0061 (a), 0252 (ɐ), and 00E6 (æ) (which, although not discussed above, becomes hard to distinguish from 0153 (œ) in most italic faces) would make it perfect.</p>
      <p>Andreas, I share your frustration that the designers of the IPA seemingly failed to consider some of the realities of type design, but the truth is that we live in an imperfect world, and we often have to live with the poor decisions made by our predecessors. It adds some complexity and challenge to life, and I think there are more than a few linguists out there who would appreciate your taking the trouble to work out typographic oddities like the italic two story "a".</p>
