      <p><em>When you say you would prefer the stylistic variant approach, is that because you already work with OpenType- or AAT-savvy software?</em></p>
      <p>Yes; for serious work I primarily use XeTeX for papers and Apple's Keynote for presentations, both of which support OpenType variations.</p>
      <p><em>In general, would linguists and other end-users of IPA fonts have the software to handle the stylistic variants? In your experience, how would they handle these types of issues?</em></p>
      <p>Linguists seem divided into two groups on this respect: on the one hand, I have encountered professors who still use SIL's symbol encoded legacy fonts because they have yet to master unicode entry. On the other hand - and I think this represents the majority of young linguists - there is a startlingly high level of typographical literacy. Nearly every publishing linguist is TeX-savvy and uses two or more linguistics-specific packages. A short ReadMe bundled with a typeface the likes of which we have been discussing, including some example XeTeX macros to enable stylistic variants, would probably be received very well.</p>
