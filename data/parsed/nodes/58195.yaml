      <p>Brian, the problem with having a two-story "a" in italic is there is no code point for it -- outside, of course, the regular "a" in 0061, which is usually a one-story a.</p>
      <p>So what to do? Switch it with an APPH or IPPH language tag feature? But not all a's in an italic sentence should be switched. More to the point, I have never seen a manuscript with any language tags, let alone an IPPH tag. Authors and editors just don't use them.</p>
      <p>We are left with having it as an unencoded glyph, to be found by the unsuspecting comp. Or a PUA glyph, equally hidden.</p>
