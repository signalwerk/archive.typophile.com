    html: |-
      <p>Since one of the threads listed was one I started, I might as well finish the tale. I could find no suitable commercial font that had all the needed characters, except, as noted, Times and Stone.</p>
      <p>Since Adobe allows modifications to their fonts by the end user for their own use, I used Minion, primarily because of its neutral feel, and because it does come with Greek (though you cannot simply use the existing Greek characters for all the IPA "Greek").</p>
      <p>I then made up the needed phonetic characters, roman and italic.</p>
      <p>While IPA may not require italic, try telling that to an editor who has been taught that all foriegn words must be set in italic. Many editorial decisions are religious in character, that is, they are reveled truths, brooking no argument. Italic is needed.</p>
      <p>It does not take all that long to draw up serviceable IPA symbols -- maybe a week for italic and roman. Note the word "serviceable." They probably wouldn't pass muster with a real font designer. But at text size, they worked well enough.</p>
      <p>* * *</p>
      <p>I have used Merlo in one book. It tends towards being too heavy, and I'm one of the guys who complains that most photocomp and digital fonts are too light. With a 10-point setting, it worked pretty well. With a larger setting, I doubt it -- a noted designer (Rich Hendel) tried a larger setting size and couldn't get it to work. That said, I will use it again, when it fits the project.</p>
      <p>* * *</p>
      <p>In conclusion, I would use a font from a foundry that allows the end user to modify the font for their own work, and make up your own symbols, as needed.</p>
