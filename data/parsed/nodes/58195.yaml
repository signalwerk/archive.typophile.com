      <p>You might take a look at <a href="http://junicode.sourceforge.net/" rel="nofollow">Junicode</a> also. It's in the same general family as Merlo, but I have a feeling the pair won't actually work well in practice (Merlo for text, Junicode for phonetics), because the former seems much heavier than the latter.</p>
      <p>For a Times-like font with IPA characters, take a look at <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=DoulosSILfont" rel="nofollow">Doulos SIL</a>.</p>
      <p>Both of these are free, and so actively encourage you to modify them for your needs. You might be able to make slight weight adjustments, for example, in your favorite font editor using a script.</p>
      <p>Best of luck!</p>
