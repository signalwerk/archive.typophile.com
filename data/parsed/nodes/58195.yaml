      <p><cite>Take your mild offense and ...</cite></p>
      <p>What I find hard to take isn't so much the cost, though there are times when and extra $1,000 (20 glyphs, each in roman &amp; italic, at $25 per) will kill a project.</p>
      <p>Rather it is the notion that the type designer is the ultimate authority, as opposed to the several end users. About once a month, we get someone, an author, an editor, or a designer, who wants something typographic changed. There have been so many of these instances over the years I can't keep track.</p>
      <p>This week, for example, proof came back where the publisher (probably the author, but who knows), wanted the breath marks on Greek capitals placed over the letter, rather than in front. I could tell them they are wrong. Or, I could admit that Greek began around 1,000 BC, and has undergone many changes in how it is written.  Maybe at some point in time, that's how they were written. I'm certainly no expert on the permutations of the Greek language. Or we could just set what they wanted, which is what we did.</p>
      <p>There were only a few occurrences, so we made the change using the layout program. If there had been a lot of instances, I would have gone into the font, created a separate variant, and written a feature to switch them on. The type designer would not have been consulted. Did I mention that second proof is usually due 10 working days from when it is received?</p>
      <p>I have also had authors insist that certain phonetic characters appear certain ways, in spite of the "guidance" about allowable variance that can be found in Chicago's <cite>Phonetic Symbol Guide</cite>. Again, you usually find this out when first proof is returned.</p>
      <p>Type isn't hung on a museum wall, and OpenType software can't cover all the users needs.</p>
      <p>If you want to put a clause in your EULA that your fonts cannot be modified, that's your right. It does affect their usefulness.</p>
