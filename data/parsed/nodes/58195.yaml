      <p>A separate IPA font is one way to go. Unfortunately, this means there is no kerning with the non-IPA font -- unless you have all the normal glyphs in the IPA font, which sort of defeats the purpose of "separate," unless all you were worried about were non-Latin characters.</p>
      <p>The problem is exacerbated by the fact that most romans use a two-story *a*, most italics a single story *a*, which means InDesign's "character style" probably won't work as a solution. It is just going to be handwork. BTW, I have seen several fonts where the nominal "a" in italic was two-storied, I just can't think of any off-hand. And that's not a solution, anyway.</p>
