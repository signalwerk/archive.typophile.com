      <p>In IPA, there are four different versions of the letter A (two forms and their respective rotated version).  As you know, it's standard in serif fonts for the lowercase a to change form between normal and italic faces.  This is a contrastive element in the IPA alphabet, so it requires this italic single-story a to be present in the regular upright face.  Just the same, in an italic font, the upright two-story a most be designed in italic <em>as such</em> and cannot revert to a single story form.</p>
      <p>Otherwise, a word like father in English when transcribed will become ambiguous: </p>
      <p>faðɜɾ = Scottish<br>
      fɑðɛɾ = Irish</p>
      <p>In Andron mega, if I set this in Italic, BOTH the Scottish and Irish transcription will appear identical which shouldn't happen.  The suprasegmentals are those symbols that indicate tonality, stress, and length and are in the spacing modifier letters block.  These are an integral part of IPA.  The English word for pot (SAE) should be pʰɑt, which uses the raised h.  Any tonal language needs some of the other ones, and some people might need occasionally the double tonal marks found in the 1DC0 block.</p>
    html_clean: |-
