    <p>We're in the preparation phase of a project where we will be designing an extensive grammar book. As expected there will be a lot of phonetic transcriptions. Book design is comfortable territory but we have never done anything using a font with phonetic symbols.</p>
    <p>Anybody got experience with phonetic fonts? Please let us know of any good, complete font families with phonetic symbols.</p>
