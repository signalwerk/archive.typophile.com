      <p>As a footnote to charles-e's point about losing kerning between fonts, I wonder whether this might be overcome with something akin to Peter Kahrel's <a href="http://www.kahrel.plus.com/indesign/kern.html" rel="nofollow">Scripted Custom Kerning Tables</a> for InDesign.  These allow one to set up kerning tables that work cross the different font styles in a family, so that one can prevent, for example, italic-f from crashing with an upright closing parenthesis.  I confess I haven't actually tried Peter's script, but am anxious to experiment as soon as I can find the time.</p>
