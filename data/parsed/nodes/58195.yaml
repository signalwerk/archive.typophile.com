      <p>Peter, Brian</p>
      <p>Peter probably has more to contribute to this thread at this point, but let me echo a few things he mentioned.</p>
      <p>First of all, while I use phonetic symbols reasonably often, the greatest use I encounter is in languages which never had a written form -- native American languages come to mind -- and the various scholars adopted various orthographies to come up with a written form. In the older days (e.g., Ella Deloria), they used what was convenient to note with a pencil, writing in the field - i.e., diacriticals. Later, phonetic symbols were more common,and are more often used today.</p>
      <p>Secondly, by in large the symbols used for phonetics were originally just what was available in type, specifically, foundry or Monotype, with their singly cast letters. So, a turned "a" was just that. A long s was just that. I'll speculate that over time, special sorts were created, to aid clarity and consistent usage, but I'm not really a type historian.</p>
      <p>Dictionary use was probably the financial motivator for making whatever custom sorts were needed. But for dictionaries, italic phonetic symbols were not needed, or at least, not often needed. It was other uses of phonetic characters that brought in the need for italic, and those were quite specialized -- i.e., had little potential for recovering the financial cost of making the characters.</p>
      <p>Thirdly, not everyone uses the IPA system. There are others.</p>
      <p>For all these reasons, a separate font containing IPA characters is not going to solve all users problems. It may solve the dictionary publishers problem, but that is not the only need.</p>
      <p>* * *</p>
      <p>Linguist are just going to be limited in the number of fonts they can use. The problem is, at this point the number of fonts suitable for bookwork approaches zero.</p>
      <p>The number of available fonts increases if not all that many phonetic symbols are needed. As I've said, for foundries that permit modification of their fonts, the end-user can add to the character set. But as the number of needed characters increases, and as the use moves toward serious linguistics, more and more precise characters are needed.</p>
      <p>For my money, for serious work involving academic linguistics, I would be better off to fix the several non-phonetic problems of Charis-SIL for bookwork (high-resolution offset printing) than trying to draw up all the needed phonetic characters. Others, whose skill level in drawing up characters is greater, may take a different approach.</p>
