      <p><cite>But what you simply *can’t* do is therefore change the italic a at 0061 into a two-storey glyph.</cite></p>
      <p>Why not? I am not saying that the italic <em>a</em> for general uses should be a two-storey glyph. I am saying that for use in phonetic symbols only, you could provide the two-storey variant for the italic <em>a</em>. That seems to me the most reasonable solution. Just because one would generally object to two-storey italic <em>a</em>s we shouldn't object to such a solution for a specialized use.</p>
      <p>You can't limit yourself to one glyph for one codepoint and expect it to work for all situations.</p>
      <p>By the way, I know that at least one phonetician, David Wells, has objected to the single-storey <em>a</em> as a phonetic symbol looking like a 'fish-shaped alpha', although he was talking about the roman, not the italic. I don't think that line of disambiguation in the italic works for phonetic purposes.</p>
