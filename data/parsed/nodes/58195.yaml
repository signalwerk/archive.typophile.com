      <p>Charles, that is true. The two-story italic <em>a</em> would be an un-encoded alternate glyph. Theoretically, one could set it up so that it would be used only for text tagged as IPA. However, support for this feature is generally absent and as you say, no one uses the language tags anyway.</p>
      <p>It will be up to the editor to make the substitution manually. I cannot imagine that there ever would be a text using the two-story italic <em>a</em> extensively; I've never seen an example myself, and I've seen a lot of linguistics texts.</p>
      <p>However, the Fe'fe' or Nufi language of Western Cameroon uses both a and ɑ in its alphabet, so setting a text in that language may require more substitutions than an editor could handle. In that case, assuming the entire text is in that language, modifying the font so that the italic <em>a</em> is the two-storey version would be the simplest way.</p>
      <p>John Hudson says he recommends having a dedicated IPA font, since there are examples where IPA symbols share code points with letters used more often in other contexts (like the Greek letters) that require design differences according to use. Distinguishing the italic <em>a</em>s in IPA would be another example to support such an argument.</p>
