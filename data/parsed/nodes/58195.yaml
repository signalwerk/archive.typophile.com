      <p>That's great advice from Charles. Depending on the scope and phonetic detail explored in the grammar book, you will probably need only a small number of additional phonetic symbols (around a dozen for Portuguese), not the entire IPA. Having the needed glyphs custom-made will not take too much time.</p>
      <p>Also, many dictionaries, including the Longman Pronunciation Dictionary, use the convention of setting the symbols for sounds that may be optionally dropped in italic. So you can never say IPA italics are not necessary.</p>
