      <p><cite>“four different versions of the letter A”</cite></p>
      <p>Of course I know this problem. It is actually unsolvable within a family which contains phonetic Italics. As you can see I applied the trick to make the 0251 and 0252 glyphs in the shape of the ‘fishy’ alpha in Italics to avoid this particular ambiguity. Someone once suggested this, don’t know anymore who it was. Yes, the one-storey a at 0250 in Italics corresponding to the two-storey a in Reg. is a mess for phonetics. But what you simply *can’t* do is therefore change the italic a at 0061 into a two-storey glyph. A two-storey italic a is rubbish anyway. But “scientists” like to invent such typographical nonsense and then leave us with the problem “BUT I WANT IT NOT THIS WAY, BÄÄÄH, I WANT IT OTHERWAYROUND MÄÄ MÄÄ MÄÄ!!“ Really anoying.<br>
      Seriously: HOW to deal with that sensibly? Any known best practice, recommendations? NO, no Opentype excuses, please.</p>
      <p><cite>“In Andron mega, if I set this in Italic”</cite></p>
      <p>Well, you can do *very* much in Andron Mega, but perhaps not everything. To say the least, it’s not the typeface being wrong here, it’s the script system itself bearing the fault.</p>
      <p><cite>The suprasegmentals …”</cite></p>
      <p>I’m not sure wether we are talking about the same thing, but all 1DC0-characters are there in Andron Regular.</p>
      <p>However, thanks for your remarks. If any convincing solution shall be feasible for the a-problem I’ll be happy to take care of it with the next upgrade of Andron.</p>
