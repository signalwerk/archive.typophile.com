      <p>More from the US Copyright Office:</p>
      <p><cite><strong>Why should I register my work if copyright protection is automatic?</strong></cite></p>
      <p><cite>Registration is recommended for a number of reasons. Many choose to register their works because they wish to have the facts of their copyright on the public record and have a certificate of registration. Registered works may be eligible for statutory damages and attorney's fees in successful litigation. Finally, if registration occurs within 5 years of publication, it is considered prima facie evidence in a court of law. See Circular 1, Copyright Basics, section “Copyright Registration” and Circular 38b, Highlights of Copyright Amendments Contained in the Uruguay Round Agreements Act (URAA), on non-U.S. works. <a href="http://www.copyright.gov/circs/circ1.html#cr" title="http://www.copyright.gov/circs/circ1.html#cr">http://www.copyright.gov/circs/circ1.html#cr</a>  http://www.copyright.gov/circs/circ38b.pdf</cite></p>
      <p><cite><strong>I’ve heard about a “poor man’s copyright.” What is it?</strong></cite></p>
      <p><cite>The practice of sending a copy of your own work to yourself is sometimes called a “poor man’s copyright.” There is no provision in the copyright law regarding any such type of protection, and it is not a substitute for registration.</cite></p>
      <p>(I'm understanding that to mean that it creates no extra protections under the law; of course you already had copyright at the time of authoring.)</p>
