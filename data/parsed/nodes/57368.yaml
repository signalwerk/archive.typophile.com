      <p>I believe even typeface software code can be copyright in the US, but not the design, as that is not a "verbal expression". One can register the font design as a design patent, but it is a bit complicated regarding what to submit.</p>
      <p>With the advent of PostScript, TrueType, OpenType etc., the restrictions in the USA regarding the copyright of fonts is no longer denied, as when font bitmap software was considered "mere digital data".</p>
      <p>Perhaps, protect refers to physical protection or copy protection, which is another topic. At this time, such a thing is possible on Windows (perhaps, also on Mac), but no one does this.</p>
