      <p>Basically, there are three things you can do:</p>
      <p>1) Register the name as a trademark.</p>
      <p>2) Copyright the font software (the digital code).</p>
      <p>3) Possibly get a design patent on the design. Not actually that complicated.</p>
      <p>The most important thing to do is actually to make sure you're not infringing somebody else's trademarked name. And, to avoid confusion, not overlapping too much even with a non-trademarked name. You don't want to have to change the name after you start shipping it....</p>
      <p>Cheers,</p>
      <p>T</p>
