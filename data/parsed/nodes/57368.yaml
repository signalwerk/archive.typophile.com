      <p>I think there is some legal backing behind "publicized" documents, as in published material available to the public – but I don't know how one would make claims on this. Also, there were comments floating around the Linotype offices (applicable to German law, if any) that the design needed to be registered (you can copyright designs in Germany, not in the US) no more than 6 months after the first public showing... whatever that means.</p>
      <p>All the big font guys care much much more about the font's name trademarks than the designs themselves. It is really really difficult to protect and enforce a design, but the names are straightforward.</p>
      <p>I have a quite safe method of protecting fonts, and have never had a stolen one to date... My policy is to simply to never finish or release anything. I will need to rethink my strategy soon though...</p>
      <p>Good luck.</p>
      <p>r.k</p>
