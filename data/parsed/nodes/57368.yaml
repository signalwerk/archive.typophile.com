      <p>IMO, UFOs qualify as "font software" in the USA because it is the digital representation of the typeface that the "Adobe v SSI" case established as subject to copyright. The judge said something like 'there is some creativity in placing bezier points when tracing a design from a paper model and so the points are subject to copyright' - if these outlines are SVG or UFO data, or a LOGO or python or C program, makes no difference.</p>
      <p>The law is about what people do, not about the fine details of how they do it, basically. </p>
      <p>I am not a lawyer :)</p>
