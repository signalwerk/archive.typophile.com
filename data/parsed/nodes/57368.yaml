      <p>Usual disclaimer about me not being a lawyer, and how you should consult one for legal advice.</p>
      <p><cite>How does one copyright the font software? Copy the code and paste it in the registration of the Copyright Office? How do you subtract the code from the font?</cite></p>
      <p>First, you have copyright simply by virtue of authoring it. However, in the USA *registering* your copyright allows you the possibility of collecting triple the actual damages, as well as fixed awards for each infringement. Without that, you're limited to "actual damages."</p>
      <p>To register the copyright, you'd need a meaningful text representation of the font code. For a Type 1 font, I'd go with a decrypted version of an ASCII Type 1 font (also called a ".pfa" or Unix Type 1 font). For TTF or OTF you could dump it with TTX or something like that.</p>
      <p><cite>Is it worth the time to copyright the code if it doesn’t protect the design (the most important part of a font)?</cite></p>
      <p>The code isn't the most important thing, but it's the most commonly and most easily pirated. My personal opinion is that as an independent type designer I'll certainly register the copyrights for my designs. It's really cheap (like $35 using the online registration).</p>
      <p>Design patent is trickier because although it's clearly valuable (in the US, anyway), it's extremely expensive. Even with the discount for being a "small entity" it looks like it's something like $660 up front and another $3800 or so divided into installments at 3.5, 7.5 and 11.5 years (though mostly rear-end loaded, so you could let it lapse if the font wasn't doing well). That's per font, so if your type family consists of, say, a whole series of fonts... dang, that could really chew up a big chunk (or all) of your profits. I don't know that it makes sense for most type designers and foundries.</p>
      <p>Cheers,</p>
      <p>T</p>
