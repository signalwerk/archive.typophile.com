      <p>It was Archie Proven, a really nice person with a great sense of humor - he was the type/print professor.</p>
      <p>The paper prof. was in another building, I think for imaging. RIT then worked closely with the CIA. He showed me a poster/map of Israel, with hot spots/red dots indicating nuclear weapons scattered all over Israel. I was amazed. He bragged that it was produced from RIT imaging technology that photographed two images of the landscape from 45 degree angles, and by doing so it could derive objects beneath the surface. </p>
      <p>He commented that they were using the very same technology to "dig" beneath the dirt covering the Dead Sea Scrolls. What was the name of that guy?</p>
      <p>I brought an early 19th century volume of Talmud to show him. He handled it very carefully, like a rare Egyptian vase. He explained that it was printed on the finest paper from Czarist Russia in those days. He pointed out that it didn't have the typical waterprint from Czarist government, indicating that it was "bootleg". Taxes were never paid by the paper manufacturers to the government for it, like most paper. This was because they gave the paper, and didn't sell it (paper is the largest expense in printing; afterwards is typesetting and the actual printing - the Talmud publisher went bankrupt before they completed typesetting the Talmud, and needed the paper to be donated, worth over a million dollars). Interestingly, I am a descendant of those paper manufacturers.</p>
      <p>Frank Romano wasn't there.</p>
      <p>RIT also had a great type library, and a very fine librarian from Brooklyn. Do you know his name?</p>
