      <p>Interstate commerce is usually a requisite for registering a trademark, not a copyright.</p>
      <p>The "complicated" drawings made by the Linotype drawing offices were created because they were a prerequisite for making the brass matrices -- this is back when font manufacture was a precise engineering and machining process requiring extreme accuracy and fine tolerances. They may or may not have been subsequently submitted to the US Patent Office, but that was not their primary raison d'être.</p>
