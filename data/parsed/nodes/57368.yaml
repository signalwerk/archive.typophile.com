      <p>In the very early nineties, I was invited to Linotype in Haupage, Long Island, New York to meet with a designer for Linotype Germany. It was a fascinating meeting, and Linotype USA host showed interesting enlargements of Times-Roman at different sizes from the days of hot type, where Times-Roman 8, 9, 10, and 12 had different widths, particularly for the m and w.</p>
      <p>Afterwards, I was given a tour of the type department production studio, where artists were working on very large architectural drawings of each letter belonging to many fonts. It was explained that these drawings were for submission to the US Patent Office.</p>
      <p>The drawings were very detailed with lots of measurements besides basic letter designs. This is why I described it as complicated. Today, Fontographer can instantly print each character in this manner with a few keystrokes.</p>
      <p>I don't recall why interstate commerse was an issue back in 1989. Perhaps, it was unnecessary, as Thomas states.</p>
      <p>Btw, what were the names of the three print/type professors at RIT? One of them was really into promoting a new encoding system, before Unicode was accepted by all. Another knew well the history and use of paper. He claimed that serifs were invented to control ink spread. I think that Frederik Goudy would argue!</p>
