      <p><cite>Is Archie’s AFII used anymore?</cite></p>
      <p>Not really. The only place I still see it is in the glyph naming Adobe first used for Cyrillic, which they may finally be moving away from, last I recall (in favor of uniXXXX names).</p>
      <p>@goHebrew:</p>
      <p>Lots of folks involved in imaging science at RIT, but the one most associated with the Dead Sea scrolls would probably be Robert Johnston.</p>
      <p>The Melbert B Cary Jr Graphic Arts Collection, a.k.a. "the Cary library," at RIT is is a world-class library devoted to the history of books and typography. Some pretty amazing stuff there. David Pankow has been the head of the Cary library since 1979. Not sure who it was before him, offhand. I worked with David for 5-10 hours a week as a grad assistant while I was at RIT, thanks to the Lawson fellowship.</p>
      <p>Cheers,</p>
      <p>T</p>
