      <p><cite> &gt; What are brass matrices? It was after the days of metal type.</cite></p>
      <p>Brass matrices were Mergenthaler Linotype Co.'s stock in trade.  </p>
      <p>I realize that the date you said you visited was past the prime of metal and into the decline of the U.S. Linotype company. But the practices and standards for those drawings were established ca. 1920s under the direction C.H. Griffith for manufacture of metal type. And I believe they changed little for producing phototype and right on up until they were being marked up with plotting data for Ikarus digization.</p>
