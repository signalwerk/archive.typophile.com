      <p>As I understand it, interstate commerce is not relevant here.</p>
      <p>"Your work is under copyright protection the moment it is created and fixed in a tangible form that it is perceptible either directly or with the aid of a machine or device."<br>
      - US Copyright Office<br>
      <a href="http://www.copyright.gov/help/faq/faq-general.html#mywork" title="http://www.copyright.gov/help/faq/faq-general.html#mywork">http://www.copyright.gov/help/faq/faq-general.html#mywork</a></p>
      <p>Now, ability to prove when you created something might be helpful in terms of establishing the priority of your claim to authorship, in the event of a conflict. AFAIK, that's why people sometimes mail *to themselves* a copy of a copyrighted work, so they have a sealed envelope with a postmark on it.</p>
      <p>I didn't know that Linotype had started applying for design patents; that would be relatively new on their part, I think. Last I knew, Adobe was the only type foundry that routinely did so.</p>
      <p>Cheers,</p>
      <p>T</p>
