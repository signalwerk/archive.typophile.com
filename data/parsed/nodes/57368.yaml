      <p>Regarding copyright registration at the US Copyright Office (you can do it online, as Thomas said), I did a registration for a large collection of fonts at a single price (like for one font), as an author registers copyright for a collection of short stories in a book.</p>
      <p>I made a sale to a customer (it could be just a cousin) in another state and mailed him or her my font product. That way it was dated by the post office. This is called "interstate commerce", and activates the copyright.</p>
      <p>Thomas said that the mere act of authoring or creating it is "unregistered" copyright. I believe that "interstate commerce" is also necessary, but I may be wrong. As Thomas warned, I'm not an attorney either.</p>
      <p>Linotype I know applies for a design patent for many of their fonts, but most type foundries don't bother.</p>
