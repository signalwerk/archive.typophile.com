      <p><cite>Btw, what were the names of the three print/type professors at RIT? One of them was really into promoting a new encoding system, before Unicode was accepted by all. Another knew well the history and use of paper. He claimed that serifs were invented to control ink spread. I think that Frederik Goudy would argue!</cite></p>
      <p>RIT has had a lot of print/type professors over the years. But some of the more prominent from way back have been Alexander Lawson (author of Anatomy of a Typeface), Frank Romano (print industry analyst), and Archie Provan (Archie was active in the AFII standard for glyph cataloging). Archie was my thesis advisor.</p>
      <p>More recently, Chuck Bigelow (co-designer of the Lucida meta-series of typefaces) has been teaching at RIT.</p>
      <p>Cheers,</p>
      <p>T</p>
