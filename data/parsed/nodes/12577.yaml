  html: |-
    <p>I’m in the process of re-vamping our approval forms.<br>
    I would be more than interested in seeing how others are going about the design approval process.</p>
    <p>We approach it like this:<br>
    We have an approval sheet that lists the designs, references the proposal/work order<br>
    and if necessary lists the digital files (PDFs) used for approval. If the the proof is printed and not digital we have them intial and date each printed proof as well.</p>
    <p>Hildebrant.</p>
