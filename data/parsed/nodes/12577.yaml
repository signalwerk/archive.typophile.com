    html: <p>Hildebrant, I have only one thought on approval process and this is being in the graphic design business for over 20 years. Approval forms are good intentions but when deadlines come up and key players can’t be found the work goes out the door signed or unsigned. The thinking is it can always be changed at the service bureau or printer.</p>
