      <p>Hello sasapetrova,</p>
      <p>Long time no see… whatever happened with Semele? Have you given it up or what? By chance I roamed in the Critique/Display forum and found your Lambo Sans  Serif and some quite controversial and interesting comments, hahahahahaha… Although ‘farquart’ is a bit overdoing it in an outspoken way, while ‘Bendy’, ‘speter’ and ‘cerulean’ were positively helpful. I think altogether it is not such a bad idea to see an artwork from the ‘devil’s advocate point of view. Therefore although ‘farquart’ doesn’t seem to have posted anything for critique and all the comments he has posted occasionally are mostly rather caustic and pointed, you should take seriously his point of view and improve as much as you can Lambo’s design concept in order to make it better and more original.</p>
      <p>Keep in mind though that if you go to <a href="http://www.identifont.com" title="www.identifont.com">www.identifont.com</a> and looks for similarities between typefaces, for example Eurostile (Lambo does bear a resemblance to Eurostile by the way) you will find quite a number of typefaces that are Eurostilistic.</p>
      <p>All in all, I believe that you should take all the comments posted so far and especially ‘farquart’s’ </p>
      <p>In order not to add to your possible confusion about what to do to improve Lambo, I will post some suggestions and critique at a later time.</p>
