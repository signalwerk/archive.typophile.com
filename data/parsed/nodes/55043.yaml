      <p>Farquart, I think it would be more constructive to explain what you don't like about this font, or give examples of fonts that are similar so the designer can make deliberate choices how to make it different or even perhaps better. The original question was how to make this more original or interesting.</p>
      <p>If you think it's a waste of time you don't have to comment. I think it's great to see a whole mix of different styles on this Crit forum, from people who've only just got interested in type to professional type designers. The point is that we all want to learn from each other.</p>
      <p>Natasa, I can see from the pdf that you are technically capable of doing more with this. I think there are similar styles out there but the fact that you think it needs more 'originality' shows you could choose many directions to take. I'd see this as more a starting point than a finishing point, which means there actually is more potential! Have a play with different elements. I'm thinking the pattern of straight stems could be broken a bit. How would it look with the hmn curving inwards on the right leg? Also, what would happen if you bumped out the sidebearings lots?</p>
