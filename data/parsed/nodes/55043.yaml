    html: |-
      <p>So James, like you say squarish sans have run their course, maybe yes maybe not, I still see quite a number of squarish sans appearing in most digital libraries and no one complains about it. Nevertheless, according to you which are the types of sans serif typefaces that have not run their course? Kindly be as specific as can be.<br>
      Starting with the design of a light weight and then going on to design the heavier or even lighter weights is not such an atypical phase of typeface production. </p>
      <p>What the infamous farquart said laconically and later on quite nastily (even if he seems to be right), was furthered by you in a very analytical way but at the same time dismissing totally any merit that the typeface would have attained if all of us here contributed positively our ideas and suggestions about how this typeface could be corrected, fine tuned and redesigned to get to be more wholesome. </p>
      <p>The proportions are very unappealing is an overstatement because you don’t support your view in any way. Of course both the lowercase and uppercase s is unbalanced, but this is something that could fixed quite easily. No big deal. The transitions from the diagonal strokes to those rounded details of the A, V, W are indeed very poorly drawn plus M and N and also v, w, and y should be a little more fine tuned.</p>
      <p>Here, we are supposed to be either typeface design experts or font freaks and all shades in between, a typical down to earth graphic designer might appreciate and use a typeface (even this one at its present state of development) quite differently than us.<br>
      That lowercase e has could stay as it and maybe fine tuned some more and then its design concept could be used in some other characters, in that case it wont draw too much attention to itself and instead it could become the basis of a unique style.<br>
      Yes, the lowercase round forms are too narrow against the square ones (although everything is squared and rounded at the same time) and the uppercase round forms are too wide against the square forms. This is something that can be fixed.<br>
      I believe that sasapetrova was designing up to now serif typefaces like the Semele that she had posted in the Critique-Serif forum</p>
      <p><a href="http://www.typophile.com/node/48721" title="http://www.typophile.com/node/48721">http://www.typophile.com/node/48721</a></p>
      <p>and which was quite nice according to most of the people who saw it there. Lambo is her first attempt in designing a sans serif display typeface and naturally she is off the mark in quite a number of points.<br>
      Sure, the r is should be more narrow. On the other hand, the assumption that the details on the lowercase h, m, n and u that flatten the stroke as it emerges from the stem are completely out of character and should be rethought seems to be a slightly valid point of view but not necessarily if this concept is also applied to all other structurally related letter forms. Personally, I find those completely flat terminals on the bottom of the c e and s quite welcome to my aesthetics provided that they conform harmonically with the overall design concept of the typeface.</p>
      <p>Naturally, it is quite obvious that the spacing in the text sample is indeed too tight and the word space too loose, something which is quite easily fixed.</p>
      <p>You say: “that five has got to go, as do all the numbers”, there is another way of dealing with this: 4 and 0 must become wider, 5 must become narrower and number 2 at the top is not designed well at all and should be fixed. That should do it. </p>
      <p>Theoretically, I do agree in general terms with your advice that sasapetrova takes whatever she has learned in bringing the design to this point, and to start over with a more carefully thought out design. But it would be better if she learns finer sans serif design aesthetics from her numerous oversights by fixing them all one after the other.</p>
