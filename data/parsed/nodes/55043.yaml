    html: |-
      <p>I normally don't spend much time in the critique section. I know speter so I'm usually drawn to threads he comments on. To be honest I downloaded the PDF with the intent of marking it up with comments to help you, but I unfortunately have to agree with the disagreeable farquart and say the design is quite a mess. </p>
      <p>First of all squarish sans have run their course. The weight is too light for small sizes and too heavy to be a display lightline. </p>
      <p>The proportions are very unappealing, both the lowercase and uppercase s is unbalanced. The transitions from the diagonal strokes to those rounded details of the A, V, W are very poorly drawn. </p>
      <p>That lowercase e has got to go, it draws too much attention to itself. The lowercase round forms are too narrow against the square ones, but the Uppercase round forms are too wide against the square forms. </p>
      <p>The r is too wide those details on the lowercase h, m and n that flatten the stroke as it emerges from the stem are completely out of character and should be rethought. Those completely flat terminals on the bottom of the c e and s are not helping at all.</p>
      <p>The uppercase R is completely out of character with that art nouveau diagonal stroke. The tail of the Q is too wimpy.</p>
      <p>That five has got to go, as do all the numbers. If you have to included a tabular set of figures you should rethink your approach since all of your figures are unbalanced. The zero looks too narrow as well.</p>
      <p>Just a few thoughts. Seriously, my advice  would be to take whatever you have learned in bringing the design to this point, and start over with a more carefully thought out design.</p>
      <p>And the spacing in your text sample too tight and the word space too loose.</p>
      <p>Hey but what do I know.</p>
      <p>James</p>
