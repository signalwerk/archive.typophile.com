      <p>Great to see you back Natasha, whatever happened to Semele? I keep wondering about it. Reading all the comments and suggestions posted so far about Lambo, I realize that you must be quite mixed-up, so I thought that I might add a few thoughts of my own.</p>
      <p>I agree with all that was written so far especially with the harsh views of farquart who obviously would never make a career in the diplomatic corps... I have never seen any typeface designed by him in Typophile but that shouldn’t exclude him form airing his, I believe quite honestly thought about, critiques so adamantly with his characteristic (I have read all his blog entries posted so far) touch of malice... I don’t know really, he may be just a font freak and yet despite that, what he points out: typeface originality and concept, is absolutely important and totally valid.</p>
      <p>So, I ask you “What is your concept for Lambo?” And please do reply, as  I believe that your original idea was not just another Eurostile-BankGothic-ish remake, (and yet Lambo does look like that) because in that case we should really take farquart very seriously. At this point, state clearly the Lambo concept please.<br>
      I will send you asap some of my own suggestions.</p>
