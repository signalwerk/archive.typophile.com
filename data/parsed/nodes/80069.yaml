    html: |-
      <p>A few German words:</p>
      <p>fähig [able, capable]<br>
      fällig [due]<br>
      fällen, gefällt [to fell, felled]<br>
      fälschen, gefälscht [to falsify, falsified]<br>
      färben, gefärbt [to color, colored]</p>
      <p>There are a lot more. The most common one might be ‘gefällt’ – as in ‘Gefällt mir’ (‘Like’ on Facebook).</p>
