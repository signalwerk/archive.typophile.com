    <p>ALL TYPOPHILES...</p>
    <p>This summer I am working in Vermont at an Internship. As part of my training I am setting a poster with 'found' sorts of wooden type on a Vandercook press. One of 3 layers is complete, and I am moving on with the second. </p>
    <p>Although I am unable to identify many of the fonts I have at my disposal in the shop - 'Annex Press.'</p>
    <p>     Please, can anyone identify any of the type faces printed in GOLD; the lines marked 1 - 4. Thanks for your effort and time!</p>
    <p>     ~ Rusty</p>
