    html: |-
      <p>I'm not sure that subtitles would necessarily be done using a conventional font. I suspect some special built-in bit-mapped font supplied with the subtitling equipment/software they use.</p>
      <p>This is not Verdana/Tahoma, which would be the most likely screen fonts. I guess it <em>could</em> be Arial, at a crappy screen resolution. </p>
      <p>- Mike Yanega</p>
