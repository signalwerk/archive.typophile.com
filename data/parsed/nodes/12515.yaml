    html: <p>Do you absolutely need the font in your Office apps? If you just need it in the Adobe CS suite, for example, you could put it in Library/Application Support/Adobe/Fonts, where InDesign, et al, can use it but apps like Entourage and Word won’t know it’s active.</p>
