      <p>There's a typo on 'public' (pulic) but I guess you would have caught that one! I'd agree with Chris - not loving the main headlines. Could maybe do with the leading turning up a couple of notches, and the type seems quite 'spindly' at the current weight. Excellent illustrations, and I think they really suit the layout. I do agree with Pilar that the third is not quite up to the same standard as the other two - it seems much 'blurrier' and less distinct.</p>
