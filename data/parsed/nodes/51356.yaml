    html: |-
      <p>I think in the third illustration of the man the mid-tones are not as defined and the photographic quality that gives these illustrations their (beautiful) zing is lost. The shaded side of the face merges into the hair, which merges into the neck shadow; the transition from the lips to the neck gets lost in the highlight of the shoulder (?); both of these areas overpower and confuse the rest of the illustration. Actually, I think the problem is that there is too much--the other two are mostly the face, with the positions of the rest of their body implied in an energetic and expressive manner, whereas the third one's shoulders, hands and neck are all there and the facial expression becomes secondary. The other two really have the beautiful drawn, penciled quality. </p>
      <p>...sorry, that had nothing to do with the typography.. but hope it helps still.</p>
