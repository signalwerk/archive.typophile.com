      <p>"I always start with a grid to be honest - I think in this case it is a 4 column and then the type set into 2. I always try and start with a grid and work the type that way, and then change it if the type works better in another grid formation. The illustrations actually were done before I typeset the brochure so they dont follow the grid too much. Have tried to overlap them bit as I thought otherwise it looked too seperate. I always use a baseline grid as well although I suppose in this layout because of the small amount of text it is not needed as much. But this always related a bit to the heading size and leading. That what you mean at all?"</p>
      <p>I guess I just mean, how do you decide on the grid at the outset? Deciding on the grid seems like an outer constraint (a general underlying structure). The "inside" for me is the specific location on the page of various elements. I sometimes feel like I'm just "pushing boxes" as they say. </p>
      <p>Do your grids depend mostly on the page proportion?</p>
      <p>I'm curious as to how other people get started.</p>
