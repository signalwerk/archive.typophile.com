    <p>I'd like identification of the fonts here: <a href="http://www.santambroeus.com/new/frameset.php" title="http://www.santambroeus.com/new/frameset.php">http://www.santambroeus.com/new/frameset.php</a>, namely the font used in the menu for 'Breakfast,' 'Brunch,' and etc, and the font in the menu pdf. Here's a sample: <img src="http://i.imgur.com/0occL.png"></p>
    <p>I'm also interested in this font, used for the text 'Sant Ambroeus':<br>
    <img src="http://www.santambroeus.com/new/img/nav/center.jpg"><br>
    if it's no trouble:)</p>
    <p>Thank you so much for your help &lt;3</p>
