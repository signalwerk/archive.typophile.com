    html: |-
      <p>These are good shapes. I think your main trouble is deciding where to put the little double barbs:<br>
      Left side of the first vertical of most letters: normal.<br>
      Making diamonds on the N: clever.<br>
      One on the thins of V and X: okay.<br>
      Right side of M and W: unusual, unnecessary, but potentially defensible as a sort of bracketing device.<br>
      Right side of other letters: hmm, no.<br>
      Clustered all over the middle of W: what, no.<br>
      Z: It's more of a tail than a structural vertical, so still a weird place for them.</p>
      <p>Moving on to overall letter form, Y is where you seem to have lost the plot. It's cut and pasted together a bit hastily as if you have no historical references for the letter Y. The inline element is reversed. Then with Z, you reverse the stroke angle on the bottom, which is sort of interesting but makes the thin line look even more out of place. Keep drawing.</p>
