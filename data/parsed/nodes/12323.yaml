    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Richard Kegler</strong></p>
    <p>Richard Kegler is the founding partner of <a href="/wiki/P22" class="freelinking" rel="nofollow">P22 Type Foundry</a>, which originated in 1994 as an outgrowth of his Master's thesis project on Marcel Duchamp. Mr. Kegler's background in <a href="/wiki/typography" class="freelinking" rel="nofollow">typography</a> and book arts includes ventures in bookbinding and <a href="/wiki/letterpress" class="freelinking" rel="nofollow">letterpress</a> printing. However, the historical context and background of <a href="/wiki/type" class="freelinking" rel="nofollow">type</a> continue to be his greatest interest and shape the evolution of P22.</p>
    <p>Typefaces by Richard Kegler (note that all font names are prefixed with the “P22” designation): Atomica, Bagaglio, Blackout, Constructivist, Dada, <a href="http://www.p22.com/ihof/daddyo.html" rel="nofollow">Daddy-O Hip</a>, Daddy-O Junkie, DeStijl, <a href="http://www.p22.com/ihof/dwiggins.html" rel="nofollow">Dwiggins Uncial</a>, <a href="http://www.p22.com/ihof/dyrynkset.html" rel="nofollow">Dyrynk</a>, Escher Hand, Folk Art, Goudy Aries, Hopper Edward, Infestia, Johnston Underground, Kane, Kells Round, Koch Nueland, Monet, Parrish, <a href="http://www.p22.com/ihof/platten.html" rel="nofollow">Platten</a>, Preissig Roman, Preissig Scrape, <a href="http://www.p22.com/ihof/lino.html" rel="nofollow">Preissig Lino</a>, Stanyan, Vienna, Woodcut</p>
