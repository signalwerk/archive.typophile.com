    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Richard&nbsp;Kegler</strong></p>
    <p>Richard Kegler is the founding partner of <a href="/node/12106" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">P22</span> Type Foundry</a>, which originated in 1994 as an outgrowth of his Master’s thesis project on Marcel Duchamp. Mr. Kegler’s background in <a href="/node/12026" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typography</a> and book arts includes ventures in bookbinding and <a href="/node/12409" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Letterpress</a> printing. However, the historical context and background of <a href="/node/add/wiki?edit%5Btitle%5D=type" title="Create node &quot;type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">type</a> continue to be his greatest interest and shape the evolution of <span class="caps">P22</span>.</p>
    <p>Typefaces by Richard Kegler (note that all font names are prefixed with the “<span class="caps">P22</span>” designation): Atomica, Bagaglio, Blackout, Constructivist, Dada, <a href="http://www.p22.com/ihof/daddyo.html">Daddy-O Hip</a>, Daddy-O Junkie, DeStijl, <a href="http://www.p22.com/ihof/dwiggins.html">Dwiggins Uncial</a>, <a href="http://www.p22.com/ihof/dyrynkset.html">Dyrynk</a>, Escher Hand, Folk Art, Goudy Aries, Hopper Edward, Infestia, Johnston Underground, Kane, Kells Round, Koch Nueland, Monet, Parrish, <a href="http://www.p22.com/ihof/platten.html">Platten</a>, Preissig Roman, Preissig Scrape, <a href="http://www.p22.com/ihof/lino.html">Preissig Lino</a>, Stanyan, Vienna,&nbsp;Woodcut</p>
