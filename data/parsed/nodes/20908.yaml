  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Transit</strong></p>
    <p>Designed at <a href="/node/15651" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MetaDesign</a> during the early 1990s for the <span class="caps">CI</span> and navigation system of the <span class="caps">BVG</span> (the Berlin transit authority). Distributed by <span class="caps">FSI</span> <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> International.</p>
    <p>Font descriptions from <span class="caps">FSI</span>:</p>
    <p><strong><span class="caps">FF</span> Transit&nbsp;Print</strong></p>
    <p><span class="caps">FF</span> Transit is a highly legible font that works well for readers who may need quick orientation while en route. It was originally designed by MetaDesign in Berlin for the official use of the Berlin Public Transportation Services (<span class="caps">BVG</span>) and Düsseldorf Airport, but will now be available commercially all over the world. Designed to blend aesthetic quality with legibility.<br>
    The <span class="caps">FF</span> Transit fonts are based on the Frutiger family (licensed from Linotype-Hell). MetaDesign pared the font design down and extended the family by creating a new set of matching italic fonts. In addition, they altered the widths and spacing of each font to enhance their functionality in different&nbsp;situations.</p>
    <p><strong><span class="caps">FF</span> Transit Front and&nbsp;Back</strong></p>
    <p><span class="caps">FF</span> Transit Front and Back are designed to compensate the visual distortion that appears on illuminated signs which are lit from the front or the back, and do so no matter whether the text is displayed as a positive or as a negative (white text on a dark background). Transit Front Negativ, for example, is thinner and has wider spaces, to balance out the visual illusion that negative fonts appear&nbsp;thicker.</p>
    <p><strong>Transit&nbsp;Pict</strong></p>
    <p><span class="caps">FF</span> Transit Pict contains pictograms, direction symbols and warning symbols. <span class="caps">FF</span> Transit’s extensive collection of pictograms makes it the perfect font for universal orientation systems. The pictograms can be used for local public transportation systems, airports, companies or on private property. It contains all warning symbols, informational symbols and up-to-date pictograms which cannot be found in comparable collections of symbols. As a special free bonus, each <span class="caps">FF</span> Transit package contains a special set of symbols used by Berlin’s Public Transportation Services for the various subway, streetcar and bus lines. <span class="caps">FF</span> Transit Linie is a versatile symbols font which is made up of letters, numerals and colored backgrounds that can be combined to form subway line signets. The considerable number of <span class="caps">FF</span> Transit pictograms is now also available for another FontFont typeface designed for orientation and information systems: <span class="caps">FF</span> Info Pict for <span class="caps">FF</span> Info, designed by Erik Spiekermann and Ole&nbsp;Schäfer.</p>
    <p><strong>External Links</strong><br><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=FF%20Transit"><span class="caps">FF</span> Transit</a> at&nbsp;FontShop</p>
