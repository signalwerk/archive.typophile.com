    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Transit</strong></p>
    <p>Designed at <a href="/wiki/MetaDesign" class="freelinking" rel="nofollow">MetaDesign</a> during the early 1990s for the CI and navigation system of the BVG (the Berlin transit authority). Distributed by FSI <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> International.</p>
    <p>Font descriptions from FSI:</p>
    <p><strong>FF Transit Print</strong></p>
    <p>FF Transit is a highly legible font that works well for readers who may need quick orientation while en route. It was originally designed by MetaDesign in Berlin for the official use of the Berlin Public Transportation Services (BVG) and Düsseldorf Airport, but will now be available commercially all over the world. Designed to blend aesthetic quality with legibility.<br>
    The FF Transit fonts are based on the Frutiger family (licensed from Linotype-Hell). MetaDesign pared the font design down and extended the family by creating a new set of matching italic fonts. In addition, they altered the widths and spacing of each font to enhance their functionality in different situations.</p>
    <p><strong>FF Transit Front and Back</strong></p>
    <p>FF Transit Front and Back are designed to compensate the visual distortion that appears on illuminated signs which are lit from the front or the back, and do so no matter whether the text is displayed as a positive or as a negative (white text on a dark background). Transit Front Negativ, for example, is thinner and has wider spaces, to balance out the visual illusion that negative fonts appear thicker.</p>
    <p><strong>Transit Pict</strong></p>
    <p>FF Transit Pict contains pictograms, direction symbols and warning symbols. FF Transit's extensive collection of pictograms makes it the perfect font for universal orientation systems. The pictograms can be used for local public transportation systems, airports, companies or on private property. It contains all warning symbols, informational symbols and up-to-date pictograms which cannot be found in comparable collections of symbols. As a special free bonus, each FF Transit package contains a special set of symbols used by Berlin's Public Transportation Services for the various subway, streetcar and bus lines. FF Transit Linie is a versatile symbols font which is made up of letters, numerals and colored backgrounds that can be combined to form subway line signets. The considerable number of FF Transit pictograms is now also available for another FontFont typeface designed for orientation and information systems: FF Info Pict for FF Info, designed by Erik Spiekermann and Ole Schäfer.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=FF%20Transit" rel="nofollow">FF Transit</a> at FontShop</p>
