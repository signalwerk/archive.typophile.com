      <p>Very interesting, and the fact it is a METAFONT is even more interesting, AFAIK no one made a real parametrised font with METAFONT except Knuth himself (May be the recent GUST fonts are, but they don't provide METAFONT sources), so I think it is very interesting experience, and even if you don't think any body will use it (though I think a free oldstyle family with optical sizes is certainly a very welcomed addition).</p>
      <p>For going from MATAFONT to PostScript there is, besides mf2pt1, METATYPE1 which GUST people developed for their fonts, though, IIRC, they use a certain subset of MATAFONT. I'd even an experiment to use directly MetaPost and FontForge to convert Knuth's Punk font to OpenType (but the funny nature of that font makes it a bit special, also the original sources were "metapostified" prior to my work).</p>
