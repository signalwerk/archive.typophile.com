      <p>1996typo could not be more wrong.  I like comparing fonts and the closer to TNR the better.  What is more, the big thing with fonts is the vibe they give the whole written page, not the characteristic of the letters.  I love Futura.  I'm pretty sure I can remember seeing it in a Ladybird book from my childhood.  The O is much wider than the L with its dumb little horisontal, but the the whole font seems so fresh, open and optimistic and without pretense. Those letters give me a good vibe.  So there.  </p>
      <p>And another thing, I recon it is better if there is variation between different letters.  If they are too in-proportion they look too much the same and readability suffers.  I like Exocet, and it has been prominently used.  The letters in Exocet look very different and don't all follow the same rules.</p>
