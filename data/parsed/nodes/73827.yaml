    html: |-
      <p>@Sebastian: The U is now a tiny bit narrower, thank you for your advice</p>
      <p>I deleted the documentation in the starter of this thread as it is out of date. I will instead publish now and then a new version of nlr10.pdf (in the starter) which contains all current glyphs and makes easy visible how the glyphs are constructed. In some time there will also be a new documentation</p>
      <p>Due to some stagnancy in lowercase ("e" is incredible awful to parametrize with all metaness in mind) and some progress in uppercase (optical correction for diagonal stems with hair width, adjusted serifs for N and U, new ideas about senseful kerning, etc) I decided to interrupt work on lowercase and to improve and complete the uppercase letters.</p>
      <p>So here is the rough plan for the font Nilus<br>
      - improvement and completion (Æ,Ø,Þ etc.) of uppercase letters<br>
      - punctation<br>
      - make Nilus TDS-compliant (for TeX-users)<br>
      - publication of experimental font (uppercase only) under restricted license<br>
      - roman lowercase<br>
      - roman numbers<br>
      - italic lowercase<br>
      - italic numbers<br>
      - special glyphs<br>
      - complete kerning<br>
      - addition of semibold(fast &amp; easy),condensed(probably fast &amp; easy),smallcaps(easy but annoying)<br>
      - publication of font </p>
      <p>About publication of experimental font: Does anybody know a license of the form "use it freely at your own risk, do not modify, sell or republish"?</p>
      <p>By the way, I said that I have been working on uppercase and optical sizes, I will prove this here with the following image :-)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/exa2_3809.png"></div><p></p>
      <p>And oh, Nilus is capable of generating font (smoothly) at any optical size (for example 12.24684167 pt) but I recognized (just as many before me as it seems) that there is no need for more than the following point sizes:</p>
      <p>72pt (absent in TeX, "Display" in Adobish, for large titles)<br>
      17pt (present in TeX, "Subhead" in Adobish, for normal headers)<br>
      10pt (present in TeX, "Regular" in Adobish, for normal text and standard math)<br>
      8pt (present in TeX, "Caption" in Adobish, for footnotes and sub/superscript math)<br>
      5pt (present in TeX, absent in Adobish, for subsub/supersuperscript math)</p>
