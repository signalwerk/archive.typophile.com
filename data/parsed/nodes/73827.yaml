      <p>To my knowledge, there are many essays and long papers Knuth writed and published before he understood font designing. They greatly influenced how people think METAFONT is working. </p>
      <p>Actually, these essays are about the old depredated version of METAFONT, now called as something like METAFONT-75. The current METAFONT has great support for manipulating bezier curves. </p>
      <p>Actually, Knuth used a mixed approach with defining outlines for most curves and pens for most stems for Computer Modern.</p>
      <p>As a domain-specific programming language, METAFONT should offer the most powerful (though unwieldy) expressiveness for a parameterized font, because you can virtually draw anything with it.</p>
      <p>Therefore, if a meta font doesn't look right, it should be its own problem. Technically METAFONT should be viable as long as the font maker has enough patience, font-making skills and programming knowledge.</p>
