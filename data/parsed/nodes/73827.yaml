    html: |-
      <p>Thank you hrant!</p>
      <p>At the moment, the parametric thing works like this:</p>
      <p>A small program fed with very few arguments (e.g. $nl bi 10) creates a file that stores the parametric informations (e.g. nlbi10.mf). These parameters based on some (moredimensional) exponential interpolations.</p>
      <p>These nl?.mf files can be processed directly by metafont/metapost. So if one want to change Nilus very strong, one can create an own nl?.mf file where all parameters are defined and process this file afterwards by metafont.</p>
      <p>However, Computer Modern has shown that not too many people like to change 60 interdependant parameters of a font (at least not themselves).</p>
