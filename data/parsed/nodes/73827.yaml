      <p>Slanted capitals still keep me working. D. E. Knuth defined the so called superarcs (as a quarter of a <a class="freelinking external" href="http://en.wikipedia.org/wiki/Superellipse" rel="nofollow">superellipse</a>) in his <a class="freelinking external" href="http://en.wikipedia.org/wiki/Computer_Modern" rel="nofollow">Computer Modern</a>. But they do not work well for slanted letters. I adjusted the superarc definition a bit and may present you here the result for a mono-width-stroke and slanted supercircle:</p>
      <p>(left: Computer Modern superarcs; right: Nilus arcs)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/exa8_5347.png"></div><p></p>
