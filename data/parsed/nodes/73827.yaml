      <p>Many thanks for your critique</p>
      <p>You are both right, this typeface in not meant to be something completely new. However, if I will ever publish this font it will be quite certain open source. And at this time I think there is no comparable free font coming in different optical sizes. So I surely want to learn from this project, but I could also imagine that this font will be used (probably not by professionals). The optical size 24pt can already be used for titles (same purpose as Trajan), I guess.</p>
      <p>I agree, that the W is too narrow and I will change that, but unbalanced? Compare it to <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/albertina-mt/regular/" rel="nofollow">Albertina</a>, I think many fonts have unbalanced W's. (Or am I getting something wrong?)</p>
      <p>The widths of the letters are actually quite similar to Minion Pro an if you look at some Garamond fonts (like Garamond No. 8) you will find an even larger contrast in widths between round letters and 'normal' letters.</p>
      <p>I will certainly work further on but I think that lowercase letters will not come before christmas.</p>
      <p>And thank you clauses for your appreciation of METAFONT. In opposition to this <a class="freelinking external" href="http://typophile.com/node/13885" rel="nofollow">article</a> this font shows that it is possible to generate type1 fonts using the METAFONT language (thanks to mf2pt1).</p>
