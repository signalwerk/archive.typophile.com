      <p>Slanted capitals still keep me working. D. E. Knuth defined the so called superarcs (as a quarter of a <a href="http://en.wikipedia.org/wiki/Superellipse" title="Click to visit an external URL." class="freelink freelink-external freelink-external">superellipse</a>) in his <a href="http://en.wikipedia.org/wiki/Computer_Modern" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Computer Modern</a>. But they do not work well for slanted letters. I adjusted the superarc definition a bit and may present you here the result for a mono-width-stroke and slanted supercircle:</p>
      <p>(left: Computer Modern superarcs; right: Nilus arcs)<br><img src="/sites/default/files/old-images/exa8_5347.png"></p>
      <p>(I just found it interesting and thought I would share it with you.)</p>
