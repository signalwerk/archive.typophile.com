    <p>Hi everybody</p>
    <p>I started designing a new font family with METAFONT (look at the pdf for more examples) and the uppercase letters seem to be quite finished.<br><img src="/sites/default/files/old-images/nilus_sylviaexample_4466.png"></p>
    <p>What do you mean, is it worth continueing with lowercase letters?</p>
    <p>Many thanks for your critique</p>
