    html: |-
      <p>@ hrant: Yes descenders stay the same, just like the ascenders (it's clear that this distorts the glyphs a bit). Weight can be interpolated easily between normal and bold face, extrapolation (light and extra bold) leads to problems at a certain point. AND: I want it too, but I need some (much) time to work on!</p>
      <p>@1985 I would recommend to learn METAFONT in the following way:</p>
      <p>- do NOT look at the sources of Computer Modern! (they are way too complicated for beginners)<br>
      - read <a href="http://the metafont tutorial" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://the metafont tutorial</a><br>
      - read the METAFONTbook, at least the first chapters. You will find it in libraries, there are also some (probably illegal?) copies of it in the internet as pdf, but with no pictures (knuth opened the source of the book but didn't make it free)<br>
      - forget about pens (and the following commands: bot top lft rt)<br>
      - concentrate on filling, unfilling and penstroke (and the following suffices: r l)<br>
      - forget about pixelproblems<br>
      - define some macros (functions)<br>
      - Still: do NOT look at the sources of Computer Modern! you may look at mflogo (but be aware, it works with pens, but it is a good example for a minimal font)<br>
      - When you look at the sources of Computer Modern (for serifs, diagonal stems etc), look also at the metafont output too see where the defined points are</p>
      <p>I am a mathematician but one can also work with METAFONT with little mathematical knowledge. Basic vector priniciple understandings and basic equation ideas are recommended though.</p>
