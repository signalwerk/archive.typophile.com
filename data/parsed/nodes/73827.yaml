      essentially pretending to be stroke-based.</p>
      <p>&gt; Why is the understanding necessarily local?</p>
      <p>I pluralized "individuals" in an [inadequate] attempt to<br>
      mean at most groups of people, as opposed to everybody,<br>
      or even merely "generally accepted". There is too much<br>
      [healthy] disagreement among type designers to believe<br>
      that we could formulate such formal relationships.</p>
      <p>On the other hand, Gorgias's #3 does always kick in:<br>
      1. Nothing exists;<br>
      2. Even if something exists, it cannot be understood;<br>
      3. Even if something can be understood, it cannot be communicated.<br>
      :-)</p>
      <p>hhp</p>
