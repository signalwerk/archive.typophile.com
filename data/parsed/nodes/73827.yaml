    html: |-
      <p>hrant: <cite>does Knuth believe/understand that defining expanded skeletons is non-optimal? I can't see that he does.</cite></p>
      <p>When Knuth and his students worked with Zapf to create AMS Euler in the early 1980s, they decided that it was too difficult to realize Zapf's designs using expansion of strokes.  So the initial implementation of AMS Euler was in Metafont directly constructing the outlines.  As far as I know, Knuth has only been involved in the design and creation of two font families: Computer Modern (and variations) and AMS Euler.  I'd say that it's a stretch that he believes that expanding strokes is optimal for all fonts.</p>
      <p>hrant: <cite>Yes, although such an understanding is always necessarily local (to individuals) and even provisional (over time).</cite></p>
      <p>Why is the understanding necessarily local?  I don't see why these principles could not be understood broadly by the whole typographic community.</p>
