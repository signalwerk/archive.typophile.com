      <p>There were only a few things in MetaPost that gave me problems, although I remember that there were some quirky aspects of programming it.  (Some of the quirks were elegant; others were simply arbitrary.)  The one real problem that I remember now is that I was trying to make a simple diagram with a fluid curve on top, and roughly rectangular regions below it.   I used a trigonometric function to make the curve, and at some point I wanted MetaPost to do calculations that were too fine-grained for it.  I'm not sure whether that was for the details of controlling the curve, or maybe for approximate calculations of areas of regions below it.  Or maybe I had problems with both.  I think that I found I was able to control the curve only to a degree, and if I tried to go further than that, the curve behaved oddly.   I think I also wanted certain 2-D regions to have specific total areas, despite being under different parts of the curve.  I recall using a simple approximation of the kind used to generate integrals in the limit.  Metapost either errored out, or produced weird results--I don't recall.  My conclusion was that Metapost just didn't have enough bits in its representations of numbers.  They weren't regular floating point numbers; they were something that was hand-coded into MetaFont/MetaPost.  That's what I thought at the time, anyway.  I didn't look at the source for more than a minute or two, if that.  That's what I mean by being limited by the era in which Knuth wrote the Metafont.  He needed to get a certain job done, and he needed to save memory, and he figured out a way to do what he wanted to do with the sort of memory limitations he had by constructing numbers and numerical routines that were very compact.  That's what I think, though I could be wrong.</p>
      <p>Easier methods:  I've used xfig a lot over the years.  I love it.  The interface is odd, and could be more convenient in some ways, but within the fairly broad limits of what it does, it allows a lot of control over diagrams.  There are tools that do the same sort of thing with nicer interfaces, but xfig is free, and I know it.  Other than that, I've used various things.  Whatever I am aware of about that's available and useful.  I've used GIMP, ImageMagick, OS X Grapher, Gnuplot--sometimes with Octave as a front end, and one or two programs whose names I forgot a long time ago.  I might start using Matlab or Mathematica at some point for mathematical graphics.</p>
