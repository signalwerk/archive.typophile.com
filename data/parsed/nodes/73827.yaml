      <p>fujito, as a LaTeX type user--not a designer--and fan of oldstyle typefaces, I'm eagerly awaiting the release of the results of this project.</p>
      <p>For a while, I used metapost (the adaptation of metafont for creating Postscript figures).  To me, metafont/metapost itself is beautiful.  I'm not talking about what is produced by it, or even Knuth's conception of essential components of typefaces (I have no opinion about that debate above) but rather that the programming concepts on which the metafont/metapost system is based--the concepts involved in writing a program--themselves have beauty.  Eventually I became frustrated with limitations of metapost--limitations which were the result of Knuth having written metafont in an era when computers had severe memory and speed limitations compared to recent computers.  Now I use easier methods of constructing diagrams, and am not sorry that I don't have to wrestle with metapost, but I still think of it as a beautiful thing--something from a past era.</p>
      <p>So it's fascinating to me that metafont still has functionality that's of value on its own today, despite the existence of modern font design programs.</p>
      <p>Very cool project--especially the ability to parameterize modernness vs. oldstyle.</p>
