      <p>Roughly said, the only difference between Computer Modern arcs and Nilus arcs is that Nilus arcs pay attention to the fact that slanted stems change widths.</p>
      <p>@hrant:<br>
      <cite><br>
      does Knuth believe/understand that<br>
      defining expanded skeletons is non-optimal?<br>
      </cite><br>
      I guess, I can see your problem: You do not like the idea of pens. I do not like them neither! Some posts ago I wrote:<br>
      <cite><br>
      - forget about pens (and the following commands: bot top lft rt)<br>
      - concentrate on filling, unfilling and penstroke (and the following suffices: r l)<br>
      </cite><br>
      (penstroke is in fact a filling command)</p>
      <p>As far as can see Knuth was quite convinced of the pen ideas when he wrote the book "TeX and METAFONT: New directions in typesetting" as the following citation shows:<br>
      <cite><br>
      Notice that instead of describing the boundary of the character, as the renaissance geometers did, my METAFONT system describes the curve traveled by the center of the pen, and the shape of this pen is allowed to vary as the pen moves. The main advantage of this approach is that the same definition readily yields a family of infinitely many related fonts of type, each font being internally consistent. The change in pens size is governed by cubic splines in a manner analogous to the motion of the pen's center. In order to define the 20 or so different type fonts used in various places in my books, I need for the most part to use only three kinds of pens, namely (i) a circular pen, used for example to draw dots and at the base of the numeral '7'; (ii) a horizontal pen, whose shape is an ellipse, the width being variable but the height being constantly equal to the height of a hairline pen - such a pen is used most of the time, and in particular to draw all of the numerale '3' except for the dots; (iii) a vertical pen, analogous to the horizontal one, used for example to draw the strokes at the bottom of the '2' and the top of the '5' and the '7'.<br>
      </cite></p><div class="imageWrap"><img src="http://typophile.com/files/americanmoderndigits_5727.png"></div><br>
      <p></p>
      <p>The font was a predecessor of the Computer Modern family (written in old METAFONT78) and was obviously only PEN based. But then he rewrote the font completely for the new METAFONT84 and then he used nearly exclusively OUTLINE constructions (pens were only used to draw round edges). I guess somewhere inbetween 1978 and 1984 Knuth "understood that defining expanded skeletons is non-optimal".</p>
      <p>@sgh:<br>
      <cite><br>
      As far as I know, Knuth has only been involved in the design and creation of two font families: Computer Modern (and variations) and AMS Euler.<br>
      </cite><br>
      Knuth designed at least two fonts more: MFLOGO and Punk</p>
