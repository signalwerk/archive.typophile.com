      <p>If this font is meant as a project to learn from, the answer to your question is yes. Otherwise, no. This typeface adds absolutely nothing to the existing typefaces. If you do want to continue this is has to become absolutely perfect for it to add something to the market, which it is not at moment. Just a few notes:<br>
      W is unbalanced and to small.<br>
      Z is to wide.<br>
      The contrast in width between round letters like the O and 'normal' letters like the V, T, N, etc is to large.</p>
