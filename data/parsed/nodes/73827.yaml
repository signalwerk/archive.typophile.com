    user_name: fujito
    user_path: null
    date_raw: 19 Oct 2011 — 7:54am
    date: 2011-10-19T07:54:00
    votes: null
    html: "<p>Thank you LexLuengas for this suggestion (and you seem to have very sharp eyes :-)  ). The breve is currently slanted 50% as much as the A. My first language is Swiss German, so I have no ideas about correctly slanting a breve. I often saw it slanted by 100% (respectively to the base glyph) and rarely slanted by 50%. My conclusion was that the font designer which slanted by 100% just did not knew better. What are your reasons to slant it more: Æstetic reasons? Historic reasons? Geometric reasons? Would you suggest to slant it 100% or 75%?</p>"
  - id: 481359
    user_id: 92807
    user_name: LexLuengas
    user_path: null
    date_raw: 19 Oct 2011 — 12:15pm
    date: 2011-10-19T12:15:00
    votes: null
    html: |-
      <p>My reasons are primarily æsthetic, which I know derived from the geometric nature (an upward crescent) and contrast of the breve accent. I don't know if there is an habit to slant the breve in a specific way, historically speaking. I am now occupied with the diacritics of an own typeface and couldn't resist noticing.</p>
      <p>I'd say 100% will look fine, but I don't have the faintest idea how it will look trying 75%. Let your eye guide you and take the option that looks better to you.</p>
