    html: |-
      <p><cite><br>
      Actually, Knuth used a mixed approach with defining outlines for most curves and pens for most stems for Computer Modern.<br>
      </cite></p>
      <p>This is not true. For stems Knuth virtually never used pens alone. He practically always defined outlines and filled them (and drew the outline also with a pen):</p>
      <p>First citation from the Computer Modern source file romanu.mf (the important command is filldraw which means <strong>filling</strong> and drawing alltogether):<br>
      <code><br>
      cmchar "The letter I";<br>
      beginchar("I",max(6u#,4u#+cap_stem#),cap_height#,0);<br>
      italcorr cap_height#*slant-.25u#;<br>
      adjust_fit(cap_serif_fit#,cap_serif_fit#);<br>
      pickup tiny.nib; pos1(cap_stem,0); pos2(cap_stem,0);<br>
      lft x1l=lft x2l=hround(.5w-.5cap_stem); top y1=h; bot y2=0;<br>
      filldraw stroke z1e--z2e; % stem<br>
      if serifs: dish_serif(1,2,a,1/3,1.05cap_jut,b,1/3,1.05cap_jut);  % upper serif<br>
       dish_serif(2,1,c,1/3,1.05cap_jut,d,1/3,1.05cap_jut);  fi % lower serif<br>
      math_fit(0,.5ic#); penlabels(1,2); endchar;<br>
      </code></p>
      <p>Second citation from <a class="freelinking external" href="http://en.wikipedia.org/wiki/Metafont" rel="nofollow">Wikipedia</a>:<br>
      <cite><br>
      More complex fonts such as the Roman text fonts in the Computer Modern family use a small pen to trace around the outline of the visual "strokes", which are then filled; the result is much like an outline font, but with slightly softened corners defined by the pen shape.<br>
      </cite></p>
      <p>And finally a colored image of the letter «I» from cmssbx10, showing the statement above:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cmssbx10-16_3545.png"></div><p></p>
      <p>*if* Knuth had really used pens only for the stems, they would behave correctly when being slanted, what they obviously not do:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Y_LMSans10-Oblique_5859.png"></div><br>
      (The three stems have all different widths, but should have same widths.)<p></p>
