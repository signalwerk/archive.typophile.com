  - id: 428567
    user_id: 72748
    user_name: fujito
    user_path: null
    date_raw: 7 Sep 2010 — 6:24am
    date: 2010-09-07T06:24:00
    votes: null
    html: |-
      <p><cite>AFAIK no one made a real parametrised font with METAFONT except Knuth himself (May be the recent GUST fonts are, but they don't provide METAFONT sources)</cite></p>
      <p>I think there are quite some  fonts written in METAFONT which are not by Knuth (look at this <a class="freelinking external" href="http://www.faqs.org/faqs/fonts-faq/metafont-list/" rel="nofollow">list</a>). However, many of them belong to the following 3 classes </p>
      <ul>
      <li> only related to TeX (maths fonts or extensions/improvements to Computer Modern)
      </li><li> not released in any proper outline form
      </li><li> not OpenSource (e.g. fonts from the old Metafoundry)
      </li></ul>
      <p>At the first glance I was stunned by the GUST project and the related METATYPE1. I still think they are doing great work but I had to discover that GUST writes the already existing font outlines to a pseudo-abstract form in METATYPE1 language (instead of a proper reenginering by coding means). In addition, METATYPE1 is not very powerful in comparison to METAFONT, and it seems that the language is still under changements. METATYPE1 could produce parametrised fonts, but afaik there is no such font published yet. Even the LatinModern faces make use of the 1990's outlines of Computer Modern instead of the existing METAFONT sources.</p>
      <p>mf2pt1 has also some restrictions (but not as severe ones as METATYPE1 has), in particular it has problems with unfilling and drawing commands (Computer Modern mainly "defines the outlines" and then draws along them with a pen).</p>
      <p><cite>Well, I know of other people who are also pursuing the METAFONT approach in order to make better smarter fonts for computer screens</cite> </p>
      <p>I must admit that I have not cared about pixels/bitmaps for the Nilus typeface.</p>
      <p><cite>By the way, does a graphical editor exist for METAFONT or is it all done in code?</cite></p>
      <p>I do not know any graphical editor for METAFONT but I also think that this is impossible in general. Personally, I coded the letters and ran METAFONT and gftodvi thousands of time to see how the letters are developping.</p>
      <p><cite>Do you have the source posted somewhere? I'd really like to see which parameters have manual values, and which are computed from others.</cite></p>
      <p>The sources are not published yet and unfortunately there are still a lot of errors in them. "Manual" values are only</p>
      <ul>
      <li> slant (italicness, regular has slant=0 and italic has slant=.25)
      </li><li> boldness (regular has boldness=0, bold has boldness 1, light would have boldness -1)
      </li><li> size (optical size)
      </li></ul>
      <p>All the rest of the parameters are computed of these with some very easy functions (mainly affine dependencies).</p>
      <p><cite>I'm a lover of all three TeX, open source, and good old-style text faces</cite> </p>
      <p>Me too!!!</p>
      <p><cite>Then again, I'm kinda glad XeTeX/fontspec have allowed us to say goodbye to METAFONT</cite> </p>
      <p>So am I. The pdf I attached is done with XeTeX. In fact I am too lazy to do experiments with the local texmf tree.</p>
      <p><cite>Can you tell me a bit more about what made you use that system?</cite> </p>
      <p>I love TeX and I find Computer Modern a very good typeface for formulas (but that is probably just because I seldom see something else), but I do not like it for texts. So I often combined "good old-style text faces" such as URW Garamond No.8 as text typeface with Computer Modern for formulas. Of course, such combinations cannot fit exactly. But I try with Nilus to compose a font that matches well with Computer Modern, which means that capital letter height and x-height are the same. The ascender height of lowercase letters (such as l) is a bit higher than in Computer Modern in order to set the sloped serif to the same height (because Nilus uses a larger serif drop as Computer Modern).</p>
      <p><cite>What are your plans for the typeface?</cite> </p>
      <p>I plan to fill the TeX 8bit encoding scheme (Cork encoding) which is similar to the Adobe Standard encoding.</p>
      <p><cite>Have you used outline editors before, and if yes, what is using MF like?</cite> </p>
      <p>I have been using fontforge for quite a while and it is a great editor, but there are things that a fonteditor never can do (e.g. optical sizes in a sensible way). Using MF is lots of fun for me now and lots of frustration at the very beginning (just like TeX). As I am used to mathematics and programming many things were easy to see for me but could be hard for people who find maths desgusting.</p>
      <p><cite>Have you considered joining other efforts or using existent free typefaces as a basis for your work?</cite> </p>
      <p>I have copied some code from cmbase.mf by Donald Knuth but I have not made use of any existing outline fonts in means of copying traces.</p>
      <p>Thank you for all your answers. This encourages me a lot and I have already begun working on lowercase.</p>
