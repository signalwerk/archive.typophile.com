      <p>"This typeface adds absolutely nothing to the existing typefaces"<br>
      I don't think that would be true even if this weren't a MF typeface. Well, I don't know much about MF but I assumed there is a huge gap in the market for a well thought-out and very expanded (in terms of weights, widths and optical sizes) typeface like this. A typeface like Athelas also doesn't really bring anything new to the table yet I absolutely adore that typeface and it rightfully received an award. Besides, it seems silly to write a font off based on the caps. There's still quite some room for "new" elements in the lowercase even if many of the rules are already defined by the caps.</p>
      <p>By the way, there's something about the 'A' which I find refreshing. Perhaps the angle of its top is a bit unconventional for an orthodox typeface. In any case I like it a lot.</p>
      <p>In any case, I do have a few minor issues with some of your glyphs.<br>
      - 'S' seems a tiny, tiny bit too heavy in its spine nearing the top.<br>
      - Horizontal strokes in letters like 'E', 'L' and 'Z' could be a tiny bit more bold. Right now I think it contrasts a bit too much with thin diagonal strokes.<br>
      - 'H' could be a little bit wider I think.<br>
      - The bowl of 'P' could be a little bit higher. At least, I like the bowl to take up a little bit more space vertically compared to the 'R' to fill a little bit more of the space below the bowl. I think this gives the text a more even color.<br>
      - 'Z' could be a tiny bit more narrow.</p>
      <p>The 85% slant in the diacritics seems perfect by the way.</p>
