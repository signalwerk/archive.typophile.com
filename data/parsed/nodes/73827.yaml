      <p>As I said, one can not see Nilus progressing at the moment, although many things are improving (slowly) in the background. For those who are interested:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/exa3_4508.png"></div><br>
      Creating an antiqua font that matches Computer Modern is difficult, so I decided to make Nilus more distinct from Computer Modern and to add a mixture between it: Nilus "Modern", which is of course not a modern font.<p></p>
      <p>The "normal" Nilus has optical corrections (look at the thin diagonal stem of the A), and lower capital heights, lower contrasts, is a bit wider etc.</p>
      <p>Nilus is the font intended for book texts, Nilus Modern is intended to be a text font for TeX documents that use Computer Modern math fonts.</p>
