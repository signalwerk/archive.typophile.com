      <p>Thank you very much for your appreciation, Sebastian. I have completely forgotten the creative common licenses, CC BY-NC-ND seems to be a good choice for the experimental font. The reason for this "restrictive" license is that it will probably take much time to complete the whole font. So if I would publish the experimental font under OFL there may be people who decide to "improve" it and that is something I do not want at all yet.</p>
      <p>My wish is to publish the final font under OFL or LPPL. However, this will be in quite some time. If I see that the font is shaping well and a (final) publication is in sight I will consider asking TUG for some grants (<a href="https://www.tug.org/tc/devfund/grants.html" title="https://www.tug.org/tc/devfund/grants.html">https://www.tug.org/tc/devfund/grants.html</a>) and then Nilus would be naturally free and opensource anyway.</p>
