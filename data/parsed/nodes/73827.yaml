    <p>Hi everybody</p>
    <p>I started designing a new font family with METAFONT (look at the pdf for more examples) and the uppercase letters seem to be quite finished.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/nilus_sylviaexample_4466.png"></div><p></p>
    <p>What do you mean, is it worth continueing with lowercase letters?</p>
    <p>Many thanks for your critique</p>
    <p>--------------------------- Current State -------------------------------------</p>
