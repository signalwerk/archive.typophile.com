    html: |-
      <p>hrant: <cite>The essence of Knuth's approach to font generation is fatally flawed. ... Anyone who considers stroke-based methods of producing notan is, of course, in a state of sin.</cite></p>
      <p>I see the essence of Knuth's work differently.  To create his fonts, Knuth created a tool that enabled</p>
      <ol>
      <li> a (relatively) simple way of specifying a curve (this includes interpolation and ensuring (almost) continuous curvature at segment boundaries), and
      </li><li> the ability to generate glyphs programmatically.  This allowed the designer to implement specified relationships between shapes based on a set of parameters.
      </li></ol>
      <p>Knuth chose to use Metafont to create fonts by expanding strokes.  However, Metafont (and descendants Metapost and Metatype1) can also be used to programmatically build outlines of glyphs based on parameters.  fujito's creation of Nilus is an excellent demonstration of the power of this approach and these tools.  In fact, Knuth's approach can also be realized without explicitly using Meta*; <a class="freelinking external" href="http://typophile.com/node/64835" rel="nofollow">http://typophile.com/node/64835</a> shows some preliminary work I did programmatically creating a glyph using only Fontforge's Python interface.</p>
      <p>The main difficulty I see with Knuth's approach is something that he also struggled with: how much to parameterize?  If every quantity is specified separately, then you've lost most of the power of specifying glyphs programmatically.  However, too few parameters, and the glyphs look too "cookie-cutter".  It's not clear to me that the typographic community has a clear and articulated (mathematical) understanding of the relationships between different features in a well-designed font.  I don't see any reason, though, why such an understanding could not be possible.</p>
      <p>Best wishes, Stephen</p>
