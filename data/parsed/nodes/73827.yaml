    html: |-
      <div class="comment-spam-body"><p>Hi oneweioranother,</p>
      <p>The key words «top, bot, lft, rt» are associated with drawing with fixed pens. With them you can either only draw a given path<br>
      <code><br>
      pickup pencircle xscaled a yscaled b;<br>
      draw z1{up} ... z2{right};<br>
      </code><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/draw_5718.png"></div><br>
      or envelop an outline:<br>
      <code><br>
      filldraw z1l{up} ... z2l{right}<br>
      -- z2r{left} ... z1r{down} -- cycle;<br>
      </code><br>
      <div class="imageWrap"><img src="http://typophile.com/files/filldraw_4809.png"></div><br>
      For these purposes, «top, bot, lft, rt» will help you to set the borders of the drawn line correct. However, most of the time you will probably only need filling commands:<br>
      <code><br>
      fill z1l{up} ... z2l{right}<br>
      -- z2r{left} ... z1r{down} -- cycle;<br>
      </code><br>
      <div class="imageWrap"><img src="http://typophile.com/files/fill_6106.png"></div><br>
      Or penstroke commands (which is just an abbreviated fill command):<br>
      <code><br>
      penstroke z1e{up} ... z2e{right};<br>
      </code><br>
      <div class="imageWrap"><img src="http://typophile.com/files/penstroke_4078.png"></div><br>
      For these purposes, «top, bot, lft, rt» are useless.<p></p>
      <p>I have written an  <a href="/wiki/https%3A/%252Fwww.tug.org/members/TUGboat/tb33-3/tb105romer.pdf" class="freelinking" rel="nofollow">article in tugboat</a> about filling and drawing, which can be viewed online as a TUG-member and will become publicly available around December 13, 2013. </p>
      <p>Cheers,</p>
      <p>fujito</p>
      </div>
