      <p><em>The difference is that “smart” quotes are difficult to enter quickly on most keyboards, while “dumb” quotes are easy. Complimentary is just as easy to type as complementary.</em></p>
      <p>I would say it's more difficult to correctly type the solution to a homophonic dilemma; it's not like simply using a dictionary to determine the correct spelling of a word, one also has to understand what two different words mean, before choosing the right one.</p>
      <p>SmartyPants replaces something that is vaguely incorrect most of the time ("dumb" quotes) with something that is patently wrong some of the time (backwards apostrophes).</p>
      <p>Here's another one for Smarty: the lower case "i" flanked by spaces is always wrong, therefore it should be capitalized. But what if someone prefers their personal pronoun to be timid and friendly? And what if someone prefers their quote marks dumb?  </p>
      <p>***</p>
      <p>Another choice of face would be Scala, on the principal that Scala Sans is somewhat of a humanist peer to Gill Sans.</p>
