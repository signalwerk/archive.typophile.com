    html: <p>I matched Gill with Perpetua in a marketing magazine for a bank, and they worked very nicely together for many years. It's a bit of an obvious pairing, but there are some interesting family members in both faces, such as Perpetua Titling, Gill Extra Bold and the Condensed Gills. And Gill Shadow. I had to make a beefed-up Perpetua for footnotes. In all, the typographic palette was quite large, although the Gill figure "1" is really nasty.</p>
