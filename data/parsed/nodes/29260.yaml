      <p><cite>Here’s another one for Smarty: the lower case “i” flanked by spaces is always wrong, therefore it should be capitalized.</cite></p>
      <p>But what about passages in the many languages (including most Scandinavian and those Slavic languages written in the Latin alphabet) where 'i' is a fairly common (uncapitalized) word? Take these lines from the Lord's Prayer in a few of these languages.</p>
      <p>Croatian: "... kako na Nebu, tako i na Zemlji"<br>
      Swedish: "Fader Vår som är i Himmelen"<br>
      Welsh: "Dyro i ni heddiw ein bara beunyddiol"</p>
      <p>I point this out because Microsoft Word always automatically capitalizes the 'i' when I try to type Swedish. It's the most annoying thing ever. In fact, I am against most attempts at autocorrection in word processors and such, smart quotes being the only major exception.</p>
