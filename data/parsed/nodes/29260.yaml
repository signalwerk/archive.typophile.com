      <p>I saw Goudy used with Gill Sans on a Junior Scrabble board game box a few months ago.</p>
      <p>The headings were set in Gill Sans and the body was set in Goudy. It looked like a nice combination together. The g and the a are similar in letter form too.</p>
      <p>Many of the headings were in Gill Sans all caps and the body text was set in Goudy.</p>
      <p>Some of the subheadings were set in Gill Sans upper and lower case right into the Goudy body copy (on the same line).</p>
      <p>Some other minor subheads were set in Goudy bold.</p>
      <p>There was some less important info to the side of the layout all set in a box in Gill Sans: Gill Sans bold u&amp;lc for heading and Gill Sans regulars for the paragraph text.</p>
      <p>This combination of Gill with Goudy provided a nice variety of text weight colour to the layout.</p>
      <p>I think Goudy works well with Gill Sans.</p>
