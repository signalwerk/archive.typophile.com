      <p>Pardon me while I belabour the point, as we pedants are wont. Being somewhat of a regular here, I can't help but notice that certain themes and questions frequently appear, déjà vu all over again.~  Hardly a day goes by without someone who has a particular typeface in mind inquiring as to what other face might go well with it, make a good companion, be the sans to its serif or vice versa --in short, as it's usually put, what would "compliment" the face in question.</p>
      <p>Might I suggest that as the word "compliment" is rarely used at Typophile in its correct meaning, and that as the said word is invariably proffered instead of the correct "complement", that SmartyPants be instructed to substitute "compliment" by" complement" on these here web pages?</p>
      <p>After all, ol' Smarty has a mind to replace hash marks (primes) by "proper" quotes, even though he frequently cocks it up -- I refer of course to abbreviations where a hash mark is turned into a left quote, when an apostrophe would be correct.</p>
      <p>So if, at the expense of blowing off the occasional abbreviation, "smart" quotes are deemed acceptable, surely by the same principle of digitally-enabled bowdlerization it would be desirable to improve the spelling to which one is exposed at Typophile, by the same means.</p>
    html_clean: |-
