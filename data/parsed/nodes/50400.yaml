    html: |-
      <p>Sort of.</p>
      <p><cite>Ella Deloria’s The Buffalo People</cite> by (with?) Julian Rice, published by the University of New Mexico Press, available at</p>
      <p><a href="http://www.amazon.com/Ella-Delorias-Buffalo-People-Deloria/dp/0826315070" title="http://www.amazon.com/Ella-Delorias-Buffalo-People-Deloria/dp/0826315070">http://www.amazon.com/Ella-Delorias-Buffalo-People-Deloria/dp/0826315070</a></p>
      <p>Typographically speaking, I remember setting this book. It was set before PostScript fonts, using a Linotron 202. What is significant here is that I was limited by characters available for the 202, and movement of characters limited by the 202 — not TeX, but the L-202, then called an “output device.”</p>
      <p>We could do a much better job today — at least, if we used a font where the EULA permitted modifications to create custom diacriticals.</p>
      <p>Typography aside, at the end of the book is an appendix showing two different orthographies for rendering Lakota in written form using the Latin alphabet.</p>
