    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Rob Leuschke</strong></p>
    <p>After graduating with a BFA from the University of Missouri in the early 1980's, Rob Leuschke began working as a lettering artist at <a href="/wiki/Hallmark%20Cards" class="freelinking" rel="nofollow">Hallmark Cards</a> in Kansas City, Missouri, learning from the best people in the industry. His talent as a calligrapher and lettering artist eventually brought him back to St. Louis to begin a freelance career. He has since moved on to typographic design. Rob now lives in St. Charles, Missouri in the middle of the USA. You can see more of Rob's typographic work at <a href="http://www.TypeSETit.com" title="www.TypeSETit.com">www.TypeSETit.com</a> and his hand-lettering and graphic design at <a href="http://www.Alphabytes.com" title="www.Alphabytes.com">www.Alphabytes.com</a></p>
    <p>Typefaces by Rob Leuschke: <a href="http://www.p22.com/ihof/corinthia.html" rel="nofollow">Corinthia</a>, <a href="http://www.p22.com/ihof/imperial.html" rel="nofollow">Imperial Script</a>, <a href="http://www.p22.com/ihof/petemoss.html" rel="nofollow">Petemoss</a>, <a href="http://www.p22.com/ihof/ruthie.html" rel="nofollow">Ruthie</a></p>
