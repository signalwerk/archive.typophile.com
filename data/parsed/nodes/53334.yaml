      <p>I think calligraphy can be beautiful and compelling. But faux type simply<br>
      turns me on much more. That's just a personal preference - nothing more.</p>
      <p>But also, practically speaking in this piece at least calligraphy<br>
      would have made it just-another-pretty-face, while faux type makes<br>
      it much more novel and perhaps arguably more appropriate as well.</p>
      <p>I'd suggest asking them for a copy of that mailer - it's a very nice piece.</p>
      <p>hhp</p>
