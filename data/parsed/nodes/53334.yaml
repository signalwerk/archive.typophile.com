      <p><em>to me it’s still so much more satisfying than calligraphy</em></p>
      <p>It is to me too hrant. Every calligraphy-based typeface that comes out makes hand calligraphy more obsolete. Whether it is based on a font or not, hand lettering is supposed to have variations and imperfections just like our everyday handwriting. That's what makes it interesting and compelling. </p>
      <p>My taste is for appropriate and beautiful communication. If that means using "dumbed down forms" then so be it. Sorry calligraphers, ITC Fine Hand put you out of the job.</p>
