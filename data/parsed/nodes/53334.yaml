      <p>I had a look at the way they used in on the website. The flash portion on the left was handled very gracefully and had a more striking contrast. The heading on the top of the paragraph on the right side was not. I thought it looked a bit too bulky and tight for the space.<br>
      One of the things that I do find compelling about these faux type settings is when the designer uses it like as if it were fine type. The contrast it sets up is compelling. Some of the hand rendered faux type and scripts that Chris Sickels of Red Nose Studio does are wonderful. He does 3d illustration and his lettering compliments it well.</p>
      <p><a href="http://rednosestudio.com/" title="http://rednosestudio.com/">http://rednosestudio.com/</a></p>
