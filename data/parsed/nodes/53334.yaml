    <p>I got a mailer with an amazing application of faux type.<br>
    Here's a detail (there's a ton more on the mailer):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/exgg_3604.jpg"></div><p></p>
    <p>It's not a font, it's all hand done - but to me it's<br>
    still so much more satisfying than calligraphy.<br>
    BTW, that "s" makes me think it was done from<br>
    memory, and not copied from a font.</p>
    <p>It's from a company called Exclusive Resorts, and<br>
    their website has the same style going* although it<br>
    doesn't work nearly as well as on the mailer.</p>
    <p>* <a href="http://exclusiveresorts.com" title="http://exclusiveresorts.com">http://exclusiveresorts.com</a></p>
    <p>hhp</p>
