      <p>Hrant, is there any reason you seem to dislike calligraphy? </p>
      <p>I studied calligraphy for quite some time and find it's not only enjoyable, but a good way gain an understanding of both type and form. I know calligraphy is not in style like it was years ago, but I think there is still a solid place for it in the design world. There are a number of lettering artist and calligraphers who do beautiful work that is still contemporary.</p>
      <p>Where I work I have to do both refined lettering/calligraphy and also very naive looking letters as in your sample. These days I do a lot more of the naive styles because the "regular Joe" style of handlettering is popular, but visually I like both ends of the spectrum when done in an appropriate context. </p>
      <p>Stephen</p>
    html_clean: |-
