    <p><strong>Cantillation&nbsp;Marks:</strong>  </p>
    <p>The cantillation marks are divided into two groups: disjunctive (separating)  and conjunctive (connecting). They serve three functions: musical, syntactical, and phonetical. The Poetical Books (Psalms, Job, and Proverbs) have a different system of cantillation marks than the Prose Books or 21&nbsp;Books. </p>
    <p>Read more here:<br><a href="http://www.typophile.com/node/43264">The Decalogue: The Cantillation  on the Ten&nbsp;Commandments </a></p>
