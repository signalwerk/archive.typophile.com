    html: |-
      <p>Gill can be used on both systems, but other, and in my humble opinion better alternatives would be <a href="http://www.p22.com/products/underground.html" rel="nofollow">P22 Underground Pro</a> or <a href="http://www.myfonts.com/fonts/itc/johnston/" rel="nofollow">ITC Johnston</a>.</p>
      <p>I guess the closest, commonly installed, face would be Century Gothic?</p>
