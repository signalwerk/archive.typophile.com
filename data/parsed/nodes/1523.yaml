    html: <p>I really like the first of the two logos posted on Jan 2nd, the way the drop is offset from the logotype definitely makes it more interesting and more unique IMO. <br> <br>I think that the 'u' appears a little to high though, and needs to be lowered -- not the whole character, just make the vertical bars shorter. They look a little like they're towering over the curved tops of the other letters. <br> <br>Maybe you could try rounding the tops of the 'u' bars a little, as if there was a curved top to the letter. If that makes sense. It might not work but I think it could be worth a go. <br> <br>Good work though, I really like the identity. <br> <br>J.</p>
