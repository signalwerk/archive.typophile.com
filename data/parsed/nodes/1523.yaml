  date_raw: 4 Oct 2003 — 7:34pm
  votes: null
  html: <p>Here's another one. This time for a water treatment company. They wanted a round continuous logotype so I build up this set of letters from the drop form used on the a &amp; q. the u &amp; n are again the same, the C and the O are very simmilar, but I skewed the top O to match the R ending curvature. The E comes from the C cutted and rotated into the center.  <br> <br>On the back of the card there is the type + logo, a simple water drop. I think I have some conflicts on the size of the letters, the tr ligature is of course the exception. <br> <br>Thanks for your time &amp; feedback again.  <br>adriano <br> <br><img src="http://www.typophile.com/forums/messages/29/17954.gif" alt=""></p>
  html_clean: <p>Here's another one. This time for a water treatment company. They wanted a round continuous logotype so I build up this set of letters from the drop form used on the a &amp; q. the u &amp; n are again the same, the C and the O are very simmilar, but I skewed the top O to match the R ending curvature. The E comes from the C cutted and rotated into the center.  <br> <br>On the back of the card there is the type + logo, a simple water drop. I think I have some conflicts on the size of the letters, the tr ligature is of course the exception. <br> <br>Thanks for your time &amp; feedback again.  <br>adriano <br> <br><img src="http://www.typophile.com/forums/messages/29/17954.gif" alt=""></p>
