      <p>I just went through nearly 1500 samples at Abstract Fonts and Dafont, just to see if this was a freebie at either site. No luck.</p>
      <p>It's possible it is a commercial font, but it seems less likely to me than a free one, because frankly, there's not much reason for people to pay for something when so many free fonts would be so close they would be hard to tell apart.</p>
      <p>- Mike Yanega</p>
