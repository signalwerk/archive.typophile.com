    <p>I am wondering, is there an easy way to preview all the fonts within fontfolio?</p>
    <p>I am using a win xp platform.</p>
    <p>I find it quite frustrating that some font preview programs only look into one folder, and not multiple levels of folders.</p>
    <p>I find this very time consuming, and eats into project times, when trying to find the ’right’ font.</p>
    <p>Can anyone suggest anything?</p>
    <p>Would have searched the forums, but couldnt find a search facility.</p>
    <p>Thanks</p>
