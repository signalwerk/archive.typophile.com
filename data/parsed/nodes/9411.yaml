  html: |-
    <p>hi everyone, feels great to be back ... I would like to know your opinion on a general topic, without providing any visual background first: is it a good and decent idea to combine serif and sans typefaces on collateral (letterhead, business card). The client I want to suggest this kind of typographic combo is an ophtalmology clinic, in search of a "cosmopolitan" look. <br>thank you. i will get back with the finalized logo, but I was hoping I would get some unbiased feedback meanwhile.</p>
