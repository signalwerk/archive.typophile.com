    html: '<p>and since I started out with a general topic, it might as well be just the right time to ask a similar question connected this time with my own design studio: i called it cellsius design (did you notice the double "l"?), and next thing I heard were my friends telling me how awfully wrong I was being in my choice. the general opinion was that the name will most frequently misspelled ... first: what do you think of the name as such? and second: since I like it and since it started with the "cells" and their visually evocative weight, would it make sense to visually separate the CELLS by italicising them in the logotype? <br> <br>george // cellsius design</p>'
