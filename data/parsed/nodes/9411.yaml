    html: <p>There's nothing wrong with combining serif and sans faces, in fact it's encouraged in some typography books.  <br> <br>There's a good thread on the subject here... <br><a href="http://www.typophile.com/forums/messages/4100/5163.html?1044881151" target="_blank">http://www.typophile.com/forums/messages/4100/5163.html?1044881151</a>  <br> <br>As for the name...I would have to agree with your friends. People will definitely have a hard time with the spelling, and some may think it's a typo. Another consideration; there are a couple of celsius design companies, one of which is pretty well known.</p>
