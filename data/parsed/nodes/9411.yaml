    html: <p>Waht bothers me most, is the cellsius design itself. The Caps are too close to each other, especially with the red font colour, and its interesting that at least on my screen the SI of cellSIUS has more distance than that of the SI in SIGN. The mix of the fonts used is problematic, to say the least. Meta and DIN is a nono, I'd say. The laymanwon't be able to distinguish the dynamic style from the more static/geometric style of DinSchrift, especially as you only use the Din for numbers. Combined with the OSF of Meta, it just doesn't add up. Too close to be a real contrast, it just doesn't make sense visually. You might just as well take the lining figures of the Meta.  <br>The mix above, in the first example, is a bit better. But I still don't see why you even WANT to mix these two types when the serif typeface (hard to see.. is that FFQuadraat) would do just nice in its own. Less, as always, is more :-D.  <br> <br>Getting a bit nitpicky, the phone-numbers need the right spaces, IASI should be in SmallCaps, the brackets, the divis</p>
