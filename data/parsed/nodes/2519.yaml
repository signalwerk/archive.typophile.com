    html: <p>A font friend recently sent me copies of parts of it, to help me figure out if I should buy it or not. I haven't read much of it yet, but just so you know it seems to be more of an informal discussion type thing (as opposed to something that addresses the techniques of design). So it's essentially more free-form and ideological than counterpunch, but of course anything that helps see inside the head of such a good designer is valuable. And it makes me want to write more. <br> <br>hhp <br></p>
