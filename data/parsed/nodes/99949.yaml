      <p>well, i would hope. i understand the concerns but in some cases, how would one know that there IS an "authentic" version if it can't be found? aside from having a lifetime of experience and a font history, some of us look and learn through daily experience. if there's some input on how we can positively i.d knockoffs, please let me know.</p>
      <p>only in the most extreme "can't find it" cases do i look on dafont and other sites. i try to stick with identifont, what the font, and whatfontis. the latter seems to be the one more likely to kick out  a "fake" so i usually take their results and search identifont for similars.</p>
      <p>for some i.d. cases doing a google on the actual subject will lead to the info. perhaps finding a pdf from the customer or a better sample that can be more readily used for researching.</p>
