      <p>Well, this isn't a court of law, but what about: Beyond a reasonable doubt?  :-)</p>
      <p>Actually, what am I saying? There's an admission right there:<br>
      "<br>
      Kingthings Frontwards<br>
      Daft font based on Times New Roman<br>
      "</p>
      <p>Now, swiping the outlines of <em>Times</em> doesn't really warrant making a big stink (just a small one) but what I worry about is that once you go down that path, it's unlikely you'll stop. And then I look at Serifique for example, and I worry more.</p>
      <p>All I'm saying is: be careful what kind of behavior you indirectly -often unwittingly- promote by recommending certain fonts (and designers). When somebody helps you figure out that your recommendation might be tainted, keep an open mind about it - and err on the side of caution.</p>
      <blockquote><p>"I claim no copyright to this font"</p></blockquote>
      <p>Oh, that makes it all OK then...</p>
      <p>--</p>
      <p>When I made Trajic notRoman* from the actual outlines of Trajan, and publicized it, I got dozens of emails wanting to pay money for it. I said no to each and every one.</p>
      <p>* <a href="http://themicrofoundry.com/ss_trajic.html" title="http://themicrofoundry.com/ss_trajic.html">http://themicrofoundry.com/ss_trajic.html</a></p>
      <p>hhp</p>
