      <p>Jan is entirely correct, on all counts. But of course one's "best judgement" is -hopefully- in a constant state of refinement: if somebody makes you aware of a negative aspect of something, it's both wise and kind to adapt to that reality.</p>
      <p>Merely IDing type <em>for its own sake</em> ignores the critical context of the people making the things you're IDing. With the "fun blinders" on you often end up helping/hurting the wrong people.</p>
      <p>hhp</p>
