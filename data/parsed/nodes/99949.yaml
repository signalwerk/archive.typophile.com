    html: |-
      <p>The ID forum is part of Typophile. It's not about me.</p>
      <p>In turn I would actually recommend the opposite to you: spend more time on Typophile's other sections, hopefully developing an appreciation for what's really valuable.</p>
      <p>This might however be another opportunity to reiterate this suggestion: since many people regularly IDing type don't want to be bothered by ethical considerations, and since they virtually never look anywhere except the ID section*, let's somehow implement a full and formal separation. If we do that I can guarantee you'll never need to suffer my presence again.</p>
      <p>* You can tell because when an ID request is placed elsewhere it gets virtually zero response.</p>
      <p>Just to be clear: I don't think anybody should get worked up trying to change other individuals; but <em>everbody</em> should be concerned with promoting the integrity of a place they spend a lot of time frequenting, thinking about the consequences of their actions as opposed to simply IDing fonts blindly.</p>
      <p>hhp</p>
