    <p>I use an Wacom Intuos 3 tablet with pen and mouse. Sometimes I find that the pen is too sensitive for certain tasks. A good example is in the Metrics Window. Sometimes if I click on a glyph instead of just selecting it, it will shift the glyph about. I don’t think this kind of sensitivity can be adjusted in preferences for the tablet. Is there a way to lock the glyph itself (not the sidebearing lines) so this doesn’t happen?<br>
    There are times when its a problem in the glyph window as well, but the metrics window one seems most annoying.Sometimes I don’t realize I’v accidently nudged a glyph till I see that it doesn’t connect properly in my script font. I’m hoping some tablet users will share their remedies.</p>
    <p>Stephen Rapp</p>
