  html: '<p>Dear colleagues, <br> <br>We are organizing a conference on visual communication design at the University of Alberta, in Edmonton, Canada. "CREATING COMMUNICATIONAL SPACES" is an international conference exploring interpretation, interaction, negotiation and culture in the creation of meaning. It will take place on May 1 to 4, 2003. See our website for the call for papers and other details.  <br> <br>www.ualberta.ca/comspace/ <br> <br>The conference program will include 20-minute presentations and several working sessions, and will be held in conjuction with "MOVING THROUGH MEANING" an exhibition exploring the theme of the conference through the production and analysis of design works from professional practice and education. We also invite proposals for the exhibition. <br> <br>We plan to develop white papers after the conference, and produce a publication as a way of making our discussions and reflections public. We hope you are going to be interested in being part of this. <br> <br>For information about the conference, the call for papers, and the exhibition, please visit our website at www.ualberta.ca/comspace/ <br> <br>For specific questions: <br>Jorge Frascara, Sue Colberg, Bonnie Sadler Takach <br> <br>Creating Communicational Spaces <br>May 1-4, 2003 <br>Department of Art and Design <br>University of Alberta <br>Edmonton T6G 2C9 Canada <br> <br>www.ualberta.ca/comspace/ <br>E-mail: <a href="mailto:comspace@ualberta.ca">comspace@ualberta.ca</a> <br>Tel: 1 (780) 492 3261 <br>Fax: 1 (780) 492 7870</p>'
