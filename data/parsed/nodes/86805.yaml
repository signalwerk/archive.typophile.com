      <p>The numbers "6:30 - 9:30" seems like <strong>Bookman Old Style</strong><br>
      <a href="http://new.myfonts.com/fonts/agfa/bookman-old-style/" title="http://new.myfonts.com/fonts/agfa/bookman-old-style/">http://new.myfonts.com/fonts/agfa/bookman-old-style/</a></p>
      <p>..all other text must be <strong>18thCentury</strong><br>
      <a href="http://www.dafont.com/18th-century.font?text=GROW+atmoSphere" title="http://www.dafont.com/18th-century.font?text=GROW+atmoSphere">http://www.dafont.com/18th-century.font?text=GROW+atmoSphere</a></p>
      <p>The /s/ in "atmoshpere" &amp; "easy" is actually the capital /S/ reduced in size.</p>
      <p>PS: I found them using <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
