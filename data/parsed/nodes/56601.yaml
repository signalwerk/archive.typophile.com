    html: |-
      <p>First of all: if you have a colourful symbol in you logotype, you "have to" have achromatic/nonvivid type. Otherwise it looks kitchy. White trash.</p>
      <p>Putting aside all resemblances to other logos and suggestions about improper type use. I agree with all of them above.</p>
      <p>Oh. Bahamas is a good example of what I just pointed out. Achromatic/Nonvivid type against colourful logo. Check others as well like <a class="freelinking external" href="http://www.nbc.com" rel="nofollow">NBC</a>, <a class="freelinking external" href="http://www.microsoft.com/windows/" rel="nofollow">MS Windows</a>, <a class="freelinking external" href="http://www.bt.co.uk" rel="nofollow">BT</a>, various Olympic logos...</p>
      <p>Of course there may be exceptions to the rule... but you have to know exactly what you're doing and what you want to achieve...</p>
      <p>@epsilicon: my thoughts exactly. Just can't remember where.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
