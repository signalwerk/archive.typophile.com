    votes: null
    html: |-
      <p>This person is back. </p>
      <p>No. This is not my logo. </p>
      <p>This logo was designed by a crowdsourced company, Crowdspring. </p>
      <p>I was initially approached about the logo (we're a small company, we're offering $500, yadda yadda) and not having time, I passed the project to a qualified intern. I am not exactly sure what happened, whether he spoke to my intern or not, but the guy decided to crowdsource the logo, eventually turning to Crowdspring. He's now singing its praises, and in passing made some disparaging comments about the design field in general. </p>
      <p>I decided to crowdsource critiques from various online message boards (besides design boards) for his logo.</p>
