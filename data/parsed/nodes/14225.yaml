    <p>Does anyone know which typeface is used for the ’A VIDEO GAME CARTRIDGE FROM’ text on the old Atari PB boxes like on <a href="http://intvfunhouse.com/atari2600/parkerbros/box/qbrt.jpg">these</a> <a href="http://intvfunhouse.com/atari2600/parkerbros/box/rotj.jpg">examples</a>?</p>
    <p>It is a lighter weight of the Parker Brothers logo without the custom A and is used for most cover text on those boxes.</p>
    <p>Any help would be great, best I could find was the Neuzeit variations.</p>
    <p>Thanks in advance!</p>
