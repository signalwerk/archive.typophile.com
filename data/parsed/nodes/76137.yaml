    date: 2010-11-09T13:41:00
    date_raw: 9.Nov.2010 1.41pm
    votes: null
    html: |-
      <p><em>Typophiles like type specimens more than they like fonts.</em></p>
      <p>I base that observation on the trade at Type events, and the experience that typographers will buy a font for use in a specific job, but not so much on impulse.</p>
      <p>So perhaps a licence/certificate is a good idea, because the recipient can redeem it when the occasion arises.<br>
      But I wouldn't suggest just giving someone a font as a present, unless it comes with a nice specimen, or is in a House Industries package.</p>
      <p>Gift certificates are a bit of a cop-out, third on the scale behind a cleverly-chosen purchase and something you made yourself specially for the recipient.</p>
    html_clean: |-
