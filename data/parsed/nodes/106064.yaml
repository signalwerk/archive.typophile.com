    <p>Hello this is my first message in this forum. I am freelance consultant and I am working in an agriculture/farming project I am not an expert in typography but I understand it’s value.  My standard typefaces are FFMeta+FFMetaSerif, not very original but I like them… :-)</p>
    <p>To increase my practice on typography and see new things I am considering to use a specific font set for this project. After examining "The Anatomy of Type" book I have as candidates Cronos+FFClifford, looking at the specimens on the websites the combination to my inexperienced eye looks good. To have an idea I also looked at the reports of one big Big BIG US company on this topic and they use Sabon+CorporateS, Sabon plus my already bought FFMeta also looks good to me but for a reason I can not see agriculture on those.</p>
    <p>I would appreciate any idea/recommendation; the idea around the topic in my report is innovation in agriculture and organic farming.</p>
    <p>Thank you and regards,</p>
    <p>Carlos.</p>
