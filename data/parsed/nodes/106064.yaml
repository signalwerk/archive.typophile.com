      <p>In addition to publications, you also might want to check packaging of organic and health food products. Maybe make a trip to Whole Foods or a local health food store. </p>
      <p>Although from your description of "innovation in agriculture and organic farming", I'm not sure if you're just focusing on organic, or on farming innovation in general. Less than 5% of total food sales in the U.S. are organic, so a lot of "innovation" in farming is probably in other areas, such as improved farming technology.</p>
