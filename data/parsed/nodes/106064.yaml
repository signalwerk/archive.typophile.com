      <p>Thank you for your answer. Regarding Monsanto they are the ones with Sabon+CorporateS ;-).<br>
      I have made a bit of research and the only relevant source that I have found with in my humble opinion interesting typography is using Precious Sans, but it seems that they are still developing OpenType and while I really like their "g" and "s" glyphs there are not old style figures and I really like to use that feature.</p>
