    html: |-
      <p>The Chank Fonts were 'digitally grunged'. The best way to get authentic looking letter pressed wood type is to get scans of authentic letter pressed wood type. AFAIK, that's exactly what the Wood Type Impressions product is.</p>
      <p>That said, for that price, go talk to a local letter press studio and I'm sure they could give you the real thing.</p>
