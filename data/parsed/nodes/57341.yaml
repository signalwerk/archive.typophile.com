      <p>I know nothing about the quality of the “Wood Type Impressions” products, but they seem to fit your bill, so take a look and let us know what you think:<br>
      <a href="http://withoutwalls.com/index.htm" title="http://withoutwalls.com/index.htm">http://withoutwalls.com/index.htm</a></p>
      <p>I would also recommend the Machine Wash filters from Mister Retro; I used them to create two of the fonts in my <a href="http://www.typetrust.com/fonts/font.php?id=ODEx" rel="nofollow">Black Monday</a> series and was very happy. They don’t necessarily do anything with Photoshop that you can’t do with stock images, layers, and blending modes, but they do it very quickly and conveniently at a great price: <a href="http://www.misterretro.com/machine_wash_filters_bundle.html" title="http://www.misterretro.com/machine_wash_filters_bundle.html">http://www.misterretro.com/machine_wash_filters_bundle.html</a></p>
