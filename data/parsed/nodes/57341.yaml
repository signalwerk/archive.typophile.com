    html: <p>There area variety of ways to weather type but none will look as authentic as the real thing, without a great deal of work. Look at the arrow in the sample above and how the ink works at the edge. This sort of thing could only be achieved on a character by character basis. A good basic approach would be to have a texture (wood grain, or solid letterpress coverage from a solid block) scan that, use threshold to reduce to black and white, lay texture under the type layer, and then cause the text layer to blend using the lighten function. Wherever the texture is white the type will appear to have decayed. Good luck.</p>
