    <p>hey,<br>
    recently i've really been enjoying the letterpress work of Anthony Burrill and Craig Ward....</p>
    <p>i found this (<a href="http://typophile.com/node/29280" title="http://typophile.com/node/29280">http://typophile.com/node/29280</a>) previous post on here, and these suggestions for letterpress style fonts (Monotype Grotesque 1 &amp; 2, Bureau Grotesque 1 &amp; 2, Grotesque No. 9, Gothic No. 13),<br>
    but as i have no access to an actual press, i was wondering if anyone has made any really nice authentic looking fonts directly from original woodblock or letterpress lettering with imperfections an' all....?</p>
    <p>i found some by Chank, but wasn't really digging them...</p>
    <p>or does anyone have any good photoshop tips on how to grunge up a font to make it look letterpressed....? i don't want a totally over the top grunge effect, just a look that is as real and subtle as possible, as close as possible to the real thing like the Burrill and Ward examples attached...</p>
    <p>all suggestions welcome!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/anthonyburrill_5777.gif"></div><p></p>
