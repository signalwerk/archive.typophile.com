    html: |-
      <p>I came here to ask for tools to create Apple's SBIX and Google's CBDT/CBLC fonts with. I figured I might as well post in this thread!</p>
      <p>I don't see these formats mentioned at BitFonter, and TransType 4 doesn't seem to export these when you use their layering tool to create colored glyphs. (Although TransType converts the layered Microsoft approach to SVG.)</p>
      <p>I would like to create a simple one-character font that I can use to check browser support for SBIX and CBDT/CBLC. Anybody interested in helping me out?</p>
      <p><strong>Edit:</strong> I tried Behdad's scripts to create fonts that should be compatible with Google's method (and work on Android and Linux). The script is <a href="/wiki/https%3A/%252Fgithub.com/behdad/color-emoji" class="freelinking" rel="nofollow">on Github</a>. I created the FruityGirl and Funkster fonts with the included script, but they don't work on Android. Anybody know what's going on?</p>
      <p><strong>Edit2:</strong> I also tried Jens Kutilek's script to generate fonts with Apple's SBIX table, according to <a class="freelinking external" href="http://typophile.com/node/103268" rel="nofollow">this thread</a>, but the generated fonts don't show up on test devices through Browserstack :(</p>
