      <p>Here is the FontLab webinar announcement.</p>
      <p>22 April 2014, 1100CST/12pm EST/2000CEST<br>
      Register with this link: <a href="https://www.anymeeting.com/AccountManager/RegEv.aspx?PIID=EA52DD89804B3B" title="https://www.anymeeting.com/AccountManager/RegEv.aspx?PIID=EA52DD89804B3B">https://www.anymeeting.com/AccountManager/RegEv.aspx?PIID=EA52DD89804B3B</a>  (Note: don't register using Safari on Mac. Some wacky bug. sigh.)</p>
      <p>Color fonts are here!<br>
      Until recently, computer fonts were digital imitations of traditional monochrome typefaces. However, since 2013, it's been possible to create OpenType fonts with glyphs that have multiple colors. They don't work everywhere yet, but where they do work, they're really spectacular. Think real calligraphy...corporate logos... icons... 3D letterforms or letters with visible brush strokes!</p>
      <p>In this webinar, FontLab's Adam Twardoch will show you how to create color fonts using BitFonter 3, FontLab Studio 5 and TransType 4 - from an alphabet written with a watercolor paint brush on a sheet of paper all the way to an OpenType font that works in Apple Keynote and Pages on Mac OS X!</p>
      <p>In order to get the most from this webinar you will need BitFonter, FontLab Studio, and TransType 4. To make it easy for you Fontlab is offering BitFonter at an unprecedented 80% discount (your cost =US$99) to registrants. In addition if you don't already have FontLab Studio or TransType 4 we'll give you a 50% discount on those products. That's a potential US$773 savings on the whole bundle.</p>
      <p>There are a limited number of seats available for this webinar, so don't be disappointed - register early.</p>
      <p>Color Font Webinar<br>
      22 April 2014<br>
      9 am PST / 12 noon EST / 20:00 CEST<br>
      Register with this link: <a href="https://www.anymeeting.com/AccountManager/RegEv.aspx?PIID=EA52DD89804B3B" title="https://www.anymeeting.com/AccountManager/RegEv.aspx?PIID=EA52DD89804B3B">https://www.anymeeting.com/AccountManager/RegEv.aspx?PIID=EA52DD89804B3B</a>  (Note: don't register using Safari on Mac. Some wacky bug. sigh.)</p>
