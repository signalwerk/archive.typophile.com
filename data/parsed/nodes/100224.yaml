    html: |-
      <p>Couple quick points -- As you already observed, your business card is for business, and your business is not graphic design. The portrait layout stands a better chance of getting into a museum, not your goal. Do what's best for business.</p>
      <p>The second is when you moved the bottom block, it was more like centimeters. Way too far. A point is 1/72 of an inch, about 0.3 millimeters. And yes, that can matter.</p>
      <p>You don't want either too close to the edge of the card, as I said, trimming won't be that exact.</p>
      <p>In passing -- I guess there is no semi-bold in the fonts you're using?</p>
