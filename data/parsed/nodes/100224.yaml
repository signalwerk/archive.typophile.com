      <p>I prefer the landscape version. If you should go with vertical, I wouldn't mix flush left type (the text above the illustration) with centered type; keep the alignment consistent.</p>
      <p>Don't forget that unless you plan to do all correspondence by email,  you'll need matching letterheads, envelopes, any business forms you plan to use (like invoices), and perhaps a mailing label for oversize envelopes and packages.</p>
      <p>I like your chair; would be cool if you had one like that in your office.</p>
