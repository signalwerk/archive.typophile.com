    html: <p>Thank you very much, David. And that's a good question. Being a psychologist I'll call it fetishism, in the sense of an emotion that is displaced to a physical object instead of it's usual target. In my case that object is stationery and paper goods and writing instruments and all that... I just love those things, not even for what they mean or represent, but just the things themselves (hence the term fetishism), the smell of the paper, the texture of the ink. You know when you buy a new book and the pages are kind of sticking to each other and you have to run your finger through the page's edge to separate them? That's almost like an **** to me. Haha.</p>
