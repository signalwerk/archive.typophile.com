    <p>Hi there. I'm new here, I'm from Brazil and, as the business card I attached says (in portuguese), I'm a psychologist. I just graduated and I decided to print my business cards in letterpress, but my budget is pretty tight, so I have to design them myself. Now I don't expect anybody to work for free, but since I have barely any experience at all with design I thought maybe you guys could take a look and tell me if I'm making any gross mistakes, maybe point me in the right direction. The same goes for the logo itself, the little couch, I designed it myself and it's my first attempt at something of the sort. Any help would be really appreciated.<br>
    Thanks in advance,<br>
    Daniel</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sofa3_5041.jpg"></div><p></p>
