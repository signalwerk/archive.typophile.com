    html: |-
      <p>I prefer the original version with the email address in italic. It helps break up that block, thus bounce your eye to the more important lines -- your name and occupation. Just another opinion... I'd agree the numbers are too bold. Is there a semi-bold? And if you lighten the numbers, maybe the email address should be not be italic...</p>
      <p>Watch how your eye moves, and where it winds up as you make changes.</p>
      <p>As mentioned, space will also have an effect. What happens if you stay with the original size &amp; leading, but move the numbers/email block down just a point or so? I would try that, too.</p>
      <p>Finally, I've been at this 30+ years, and will still trim a test printout to final size before being assured I have all the spaces/sizes right. It is so easy to fool yourself.</p>
      <p>* * *<br>
      Don't normally comment on business cards, but I like this. Well done.</p>
      <p>* * *</p>
      <p>Edit: Should have added that the internal space is most important, because they will mis-trim some of the cards. Yes, the "margin" space is important, just don't get it too critical, so the piece falls apart if it's mis-trimmed by a 1/16 inch or so.</p>
