      <p>Yes, I'm still considering the portrait version, I don't know. It's just that since my clients and I are already young I don't want to put off the older ones. I thought of having something like that, "Hi, I'm Daniel", but in portuguese it doesn't sound as good. "Oi, meu nome é Daniel". I don't know, it seems silly in portuguese. What I thought of doing was to write "Fale mais sobre isso" on one of the sides of the card, which is something like "Can you say more about that?"<br>
      But then it would get too expensive to print on both sides of the paper, I'd need thicker stock, and I also want to have some space on the card to write notes and whatever. And then I couldn't manage to make it look good with all that on the same side of the card, it starts getting too crowded, and I want to keep it simple. But I'm still thinking about it. It would be great in a situation when, for instance, someone it sharing too much about their personal lives with a stranger or something like that, they could just hand them my card: "Can you say more about that? Daniel Marques. Psychologist."</p>
      <p>Something like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/falemais_4815.jpg"></div><p></p>
      <p>But I'm not sure. I like the simplicity of the landscape version. And this looks a little top-heavy too, I don't like the composition.</p>
      <p>I've been playing around with the landscape version, here's another option:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/4_6732.jpg"></div><p></p>
      <p>I think the previous one is still my favorite, though. On the one hand I think my name in a bigger face would look nice in letterpress, and it has a more of a "bam!" effect. But on the other hand it sacrifices some of the simplicity too, and it looks a little more standard to me. The other version, without so much emphasis on my name, seems a little more challenging, in a good way.</p>
      <p>Ah, I don't know, I don't know! What do you guys think?</p>
