      <p>There’s nothing remarkable about your intial logo but, at the same time, there’s nothing really wrong with it either. </p>
      <p>Personally, I’ve found that with your own logo, you can’t strive for perfection. It’s best to strive for ’sufficiently adequate’ and let it be, as if you don’t, you’ll forever be focused on your logo to the detriment of getting everything else up and running. Kind of the cobbler’s kid’s syndrome.</p>
      <p>So, what you have is fine. Maybe let it rest and spend some time working on the ancillary branding elements like your web site layout and stationery and the like. Perhaps you’ll find that extra bit of ’aha!’ in those elements instead.</p>
