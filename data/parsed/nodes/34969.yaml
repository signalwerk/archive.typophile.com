      <p>Because the kerning is rather tight the ‘it’ is suffering, the type isn’t visually centred horizontally, on the other hand the palette is attractive. I think that logos should not necessarily try to represent the qualities or skills of a company too obviously, in this arena (web design companies) I would suggest that a simple well-drawn logo does set it apart from those that have had a batch of filters thrown at it. I am not a fan of Frutiger, although I would find it hard to define the reasons for my dislike but taking your post as a start I would loosen all the kerning and then work on the positioning in the panel.</p>
      <p>Tim</p>
