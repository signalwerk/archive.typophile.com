    <p>Hi,</p>
    <p>I am developing a new logo for my  <a class="freelinking-external" href="http://www.designbits.de">web design business</a>. I am using the font Frutiger (my all-time favourite) but I’m not quite happy with it. I would like to put more emphasis on the “d” and “b”, and I wonder if there’s another font that’s better up for the job. What I have in mind is a font with rounded “d”s and “b”s, i.e. without any serifs, so both letters look more like swooshs rather than letters. Can anybody suggest what font to use or maybe come up with a better idea on how to make a good logo out of this term? Thanks for any input...</p>
    <p></p><div class="imageWrap"><img src="/files/logo_db2_3648.png"></div><p></p>
