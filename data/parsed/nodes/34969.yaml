      <p>I have to say I agree with Aluminium that it’s OK. My own take on it is that it reminded me straightaway of <a href="http://www.simplebits.com/">simplebits</a>. I think it’s more the name than the execution, although the fonts are quite similar. Although the name is friendly, so I think the all lowercase wordmark supports this and gives a friendly feel.</p>
      <p>Don’t overwork it for the sake of it, you could have a minimal wordmark, but use another part of the branding to make it stand out - think about use of colour.</p>
      <p>It goes without saying, but if it’s for a web design company, it’ll be used online predominently. That reason alone is enough to keep it simple because being used small at 72dpi makes the logo work hard.</p>
      <p>Si</p>
