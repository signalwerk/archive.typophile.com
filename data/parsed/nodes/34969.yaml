      <p>The dice looks more like a projection than a perspective drawing, the bottom left and right corners of the hexagon need to move up shortening the left and right sides. </p>
      <p>Kerning is used to achieve an apparently equal space between characters, one way of seeing this is to squint at the image on a printout (upsidedown can help to stop the characters being apparent as characters) currently you will see a darker area under the crossbar of the t, ‘it’ especially, in the open counter of ‘n’ and slightly in the area where the open counters of the ‘e’ and ‘s’ meet; because of your admiration for Frutiger you probably don’t want to alter the characters to alter that, although it can be done, I would approach the kerning in two ways; taking the ‘gnb’ spacing as optimum and trying to make the spaces similar or the ‘it’ or a combination of the two.</p>
      <p>By ‘visually centred’ I meant that where there is a curve on the ‘d’ there is a relatively straight side on the ‘s’ so although it might be mathematically centred it should shift a touch to the left to appear centred.</p>
      <p>Tim</p>
