    date: 2003-12-30T19:25:00
    date_raw: 30.Dec.2003 7.25pm
    votes: null
    html: <p>Stout Books is an amazing place all of the type stuff is downstairs.  They actually closed the South Park store, Hrant (it was the smaller one with fewer type books). The other store is in North Beach, about a block from the <a href="http://www.tapyramid.com/">Transamerica Pyramid</a>. There's more info on Stout's <a href="http://www.stoutbooks.com">website</a>. <br> <br>If you are looking for just interesting neighborhoods with lots of type there's always some great stuff on the streets in the Mission district. Haight Ashbury is pretty good as well.</p>
