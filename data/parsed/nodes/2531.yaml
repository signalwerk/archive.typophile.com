    date: 2004-01-02T10:56:00
    date_raw: 2.Jan.2004 10.56am
    votes: null
    html: <p>M&amp;H Type is owned by Arion Press <a href="http://www.arionpress.com" target="_blank">http://www.arionpress.com</a> and they only give tours on Thursday. Best to call ahead. You should also check out Green Apple Books <a href="http://www.greenapplebooks.com" target="_blank">http://www.greenapplebooks.com</a>. Arguably the best bookstore in the City. If you can make it to Berkely, then you should check out Seredipity Books <a href="http://www.serendipitybooks.com" target="_blank">http://www.serendipitybooks.com</a> by some accounts the best bookstore in the nation. Very knowledgeable about type. Enjoy your visit!</p>
    html_clean: <p>M&amp;H Type is owned by Arion Press <a href="http://www.arionpress.com" target="_blank">http://www.arionpress.com</a> and they only give tours on Thursday. Best to call ahead. You should also check out Green Apple Books <a href="http://www.greenapplebooks.com" target="_blank">http://www.greenapplebooks.com</a>. Arguably the best bookstore in the City. If you can make it to Berkely, then you should check out Seredipity Books <a href="http://www.serendipitybooks.com" target="_blank">http://www.serendipitybooks.com</a> by some accounts the best bookstore in the nation. Very knowledgeable about type. Enjoy your visit!</p>
