    date_raw: 2.Jan.2004 3.28pm
    votes: null
    html: <p>Serendipty Books in Berkeley is very good and worth a visit, but mainly for literature. I didn't find much type stuff there on my last visit a couple of years ago. Also worth visiting in Berkeley is <a href="http://www.ucmp.berkeley.edu/people/brs/books/moes.html">Moe's Books</a>.</p>
