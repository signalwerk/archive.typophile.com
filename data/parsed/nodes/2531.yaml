    html: "<p>A couple of great bookstores: Builders Book Source, and William Stout. The former has the distinct advantage of being in Ghirardelli Square, while the latter has two branches, only one of which (I forget which) will actually serve the typographer well. <br> <br>hhp <br></p>"
