    date: 2004-01-02T15:54:00
    date_raw: 2.Jan.2004 3.54pm
    votes: null
    html: <p>While the printing and type section isn't huge at Seredipity, it's a great place to go to talk about type. The owner will give you a dissertation if you allow him.  <br> <br>Wm. Stout for hard to find type books. (Watch for meter sharks!) <br>Moe's for almost impossible to find type books. </p>
