      <p>@ Lasko</p>
      <p>Have a look at the bottom of the following page:</p>
      <p><a href="http://www.adobe.com/devnet/opentype/afdko/topic_font_wt_win.html" title="http://www.adobe.com/devnet/opentype/afdko/topic_font_wt_win.html">http://www.adobe.com/devnet/opentype/afdko/topic_font_wt_win.html</a></p>
      <p>“REG BOLD RANGE <strong>(usable in increments of 50)</strong>”</p>
