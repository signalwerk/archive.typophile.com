    html: |-
      <p>You can ship around by using an other font family name like Emila Extras - Patern. This is the best solution!</p>
      <p>The hard one:<br>
      Try to change the table OS/2 weight(class) and width(class) values. If you have no plans of expanding Emila with a condensed, compressed or extended weights declare the pattern &amp; frames to be condensed  - or extended weights. This should lead to an grouped sorting at the end or at the top of your style list. But you have to understand the weight and width classes first.</p>
