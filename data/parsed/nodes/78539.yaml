      <p>Right.<br>
      In FontLab Info panel one, you could change the Heavy name to Extra Bold (numerically 800), and then make the Weight of Pattern and Frames, as Black (900) and Fat (1000).<br>
      Applications that sort menu styles by number will then place them in the order you want.<br>
      That might work.</p>
