    html: |-
      <p>You can actually do increments of weightclass by as little as five (but not as little as one, as I recall).</p>
      <p>So if you only have one weight each of patterns and frames, you could do:</p>
      <p>Bold: 700<br>
      Heavy: 800<br>
      Black: 850<br>
      Ultra: 900<br>
      Patterns: 910<br>
      Frames: 920</p>
      <p>Or something like that.</p>
      <p>Cheers,</p>
      <p>T</p>
