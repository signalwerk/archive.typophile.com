    <p>Hi guys, I am working now on my new Emila font and i have encountered<br>
    some difficulties regarding the listing of the fonts.</p>
    <p>Is there any way you can arrange the different weights the way you prefer?<br>
    Because i would like my Pattern and Frames, to be on the bottom of the list, logically the weights<br>
    such as Thin, Medium Bold etc. come first...</p>
    <p>You can see on the picture what i mean exactly.<br>
    Please anyone who knows i would be very thankful.</p>
