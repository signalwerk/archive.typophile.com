  html: <p>I'm familiar with all the different methods to eliminate orphans and widows in book design (tracking, vertical justification, ending facing pages a line short, etc.), but I find them all very noticeable. What do you think is the best method, and what do you do when typesetting a book that contains a lot of two-line paragraphs?</p>
