    html: |-
      <p>When setting a section with a lot of two line paragraphs I personally try to have the page breaks between paragraphs. This means ending pages a line short frequently. Sometimes it is possible to give or take a line if there is a picture or figure on a page to adjust the layout. I try extremely hard to have the same numbers of lines on each spread. I find this very important. If a page lack a line, both pages on that spread should lack a line.<br>
      As long as I'm consequent and have good reasons, I feel I can stand by my choices and defend them if anybody asks. None of my clients/editors have ever mentioned anything about it, and I honestly do not think the public in general notice.<br>
      Also I find it faster to handle incoming corrections after proof reading if I do the layout in this way, an advantage when deadlines are tight.<br>
      I'm sure others have far more sophisticated ways and other rules they follow.<br>
      Best of luck with the book.</p>
