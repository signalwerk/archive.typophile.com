    html: <p>Thanks for the reply. I agree completely, yet there are still times when the text seems to fight back. In the book I'm working on now, there are SO MANY 2-line graphs that the "line short" solution on one page creates problems further along, and I find myself going round in circles. As it happens in this book, most times the last line of the paragraph is a half line in length, so I can't adjust the tracking to bring a line up or down. Pages that are 2 lines short look awful. Should I go into real estate? :)</p>
