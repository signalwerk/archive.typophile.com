    html: |-
      <p>When I find myself going in circles like you describe, I have on occasions removed a line above a nearby header to see what looks less disturbing to the layout. Most often the missing line above the header looks worse. I tell myself for comfort that a lot of short paragraphs on a spread will camouflage the missing lines at the bottom of the pages.<br>
      There is another solution that is a bit more on the dark side, but on the bright side gives you perfect text distribution. It involves reading the text and edit it, without changing the meaning, until the layout is perfect. Not recommended as the outcome could be much like in real estate ...</p>
