  html: <p>Are 2400 or 3600 dpi really reached in the production of books, cheap paperbacks for example? I am actually in a discussion about ebook devices with regard to their low resolution and my counterpart tells me, that I shall show him the book, that reaches a resolution of 2400 dpi. One of my arguments against ebook devices is their low resolution. I simply need more information about offset printing with regard to the resolution.</p>
