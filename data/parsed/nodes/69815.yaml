      <p>2400 dpi and higher is only necessary for outputting medium-to-high quality dot rasters. Theoretically, one could switch back a RIP to 1200 dpi (or even slightly lower) for plain text only, and have the RIP use less memory and a faster output rate.</p>
      <p>I'm not sure, though, if this is done in practice (perhaps there are text-only companies that use low res as default). I doubt my trusted magnifying glass can tell the difference on text offset-printed at, say, 800 dpi and 2400 dpi.</p>
