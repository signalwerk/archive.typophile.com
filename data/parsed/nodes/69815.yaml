      <p>@ Freiberger</p>
      <p>Yes. And I can ask in German. I better can express in German, what I would like to know. But it seems to be, that I made a mistake, when I had claimed, that an ebook device has round about 8% of the resolution as a "normal" print. There was a person on a non-typophile forum, who said, we should be glad, when the problem of turning the pages of printed books will be solved (by replacing printed books with ebooks on ebook devices.)</p>
      <p>The original German wording was: "Was soll am Seitenumblätterns bitte schön sein? Das hat doch eigentlich schon immer nur genervt.<br>
      Das sind doch nur romantische Klischees, die Nachteile gedruckter<br>
      Bücher werden völlig ausgeblendet: Man braucht beide Hände dafür,<br>
      wenn man das Buch loslässt, blättern die Seiten zurück oder es klappt<br>
      zu, es kriegt Eselsohren und der Rücken wird verknittert, wenn man es<br>
      zu weit umknickt. Wir sollten froh sein, wenn wir diese Probleme los sind."</p>
      <p>(I just remember, that you are from Brazil.)</p>
      <p>And that was too much ignorance for me. But I am amateur. It would be better if professional typographers and printers would comment those things. My argument was, that the most important and most comfortable thing is the legibility. If an ebook device is legible and comfortable as printed book with regard to the legibility, then we should be glad, if the printed book dies. What I want to say is, I am not against ebook devices because of pure ideological reasons.</p>
      <p>Another argument from my side was, that we should not compare books, that are printed in the lowest quality, with ebook devices. So I need a standard for the comparison between ebook devices and printed books.</p>
      <p>But I don’t want to start another thread about the future of the book.</p>
