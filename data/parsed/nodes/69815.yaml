      <p><em>2400 dpi is a great resolution for an inkjet printer but, realistically, very few--if any--commercial offset printing presses print at a higher resolution that 200 dpi.</em></p>
      <p>You are surely confusing dpi and lpi. 2400 dpi is quite normal for imagesetter rasterisation of text (even for straight-to-plate these days); 150 lpi (lines per inch) is quite common for halftone images, but stochastic screening is now pretty widespread.</p>
