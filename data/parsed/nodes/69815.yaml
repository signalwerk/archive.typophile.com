      <p><cite>The quality of the dots is drastically different. Imagesetter comes first, obviously, then, way down, laser, and way way down, inkjet.</cite></p>
      <p><cite>There is nothing absolute about 1200, 2400 3600, etc. The quality of the dot controls all.</cite></p>
      <p>Okay, a dot is not a dot. In case of inkjets I know, that the quality of the dots is very dependent from the paper. But that’s not all;  it’s also the way, in which the dots are set, which seems to be partly dependent from the printer driver.</p>
      <p>With regard to electronic devices Thomas already said, that the antialiasing improves the legibility. But the extra dots (pixel in this case) are still pixel.</p>
      <p>So I would like to know more generally, when a dot is a high quality dot? Is it the shape, the size, the regularity of the grid, in which the dots are set, or the reflection characteristics of the dots? Ten lined dots on a centimeter can be ten squares, that are all much smaller than a millimeter. The I have a dotted line. If they have a size of exactly one millimeter I have a line, that is not broken between the dots.</p>
      <p><cite>2400 dpi is a great resolution for an inkjet printer but, realistically, very few--if any--commercial offset printing presses print at a higher resolution that 200 dpi.</cite></p>
      <p>200 dpi? Did you forget a zero? I can hardly imagine, that this is true.</p>
      <p><cite>In the case of smallish text in high-quality printing, one<br>
      can certainly see the difference between 1200 and 2400.</cite></p>
      <p>One argument of my counterparts was, that the text in books is often set to small for old people. And my answer was, that it is not the point size only, that makes the text harder to read, but partly the downscaled font, that was designed for a bigger point size, and partly the low quality, in which the text is printed. I did say, that we need more font families with optical sizes, and more maintenance of our cultural achievements with regard to the apprenticeship of craftsmen. It is absurd to say, that a new technology is better than the old one, if the potential of the old technology is not tapped. If a person only knows wine, that costs one Dollar per bottle, he may come to the conclusion, that alcopops taste better than wine. And that is really a pity, because it is so unfair.</p>
      <p>Someone did tell me with regard of my pro book arguments, that we also should not use modern cars anymore, but carriages. He did not understand, that the speed, in which you can read a book, is dependent from the legibility. So the ebook device of today is a carriage in the outfit of a modern car – in the comparison with a well printed book.</p>
