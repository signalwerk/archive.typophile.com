      <p>And when are 2400 dpi required, if not for plain text? I thought, that such a high resolution is required for letters mainly. I mean, what is more sensible than letters?</p>
      <p>With regard to the direct comparison of printed text and ebook devices – what would you say, at which resolution could an ebook device beat a well made book, that is printed in a normal quality – I miss the right term, let’s call it a normal paperback, nothing exclusive and expensive. What resolution would an ebook device require, when it shall display body text in 8.5 points?</p>
