      <p>&gt;What resolution would an ebook device require, when it shall display body text in 8.5 points?</p>
      <p>Assuming some hints &amp; just average anti-aliasing (aa), and to be safe, one would want a font where all the main stems have become 2-pixels-worth of the em. For most text faces that falls somewhere around 22-24 pixels per em. For 23 pixels to be 8.5 point you'd need 195 dpi.</p>
      <p>Assuming no hints but scary-good aa, one can obviously get it to work at 135 or so, with user distance/size of screen — key.</p>
      <p>Cheers!</p>
