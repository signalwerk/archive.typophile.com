  html: |-
    <p>Hello, I am searching out ideas for a print project. I am looking for a text font to use with the (House) font <a href="http://www.houseind.com/index.php?page=showfont&amp;id=27&amp;subpage=viewfontspecimens" target="_blank">Castaway</a> (which I am using for headers). This is a fun eatery guide. Target is vegetarians. Needs to complement whimsical illustrations and be easily read at 10 or 11 pts. Something on the lines of <a href="http://www.myfonts.com/fonts/fontbureau/cafeteria/" target="_blank">Cafeteria</a>, but not Cafeteria as it is too condensed. Something playful, but no crazy hand lettering. Suggestions greatly appreciated.</p>
    <p>Thanks in advance!</p>
