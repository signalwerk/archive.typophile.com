      <p>Not for long text, but <a href="http://www.fontshop.com/search/?q=grenadine">MVB Grenadine</a> or <a href="http://www.fontshop.com/fonts/downloads/mvb_fonts/mvb_pedestria/">MVB Pedestria</a> might be just the thing.</p>
      <p>Otherwise, <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_sari_1/">FF Sari</a> would complement Castaway well and can be set in long paragraphs.</p>
