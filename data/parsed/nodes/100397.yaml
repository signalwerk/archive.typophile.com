    html: |-
      <p>I'm not sure what they do now. They used to give out a high quality bitmapped pdf version of their fonts and they would send you a printed copy if you asked or purchased a different set of typefaces. That was about six years ago, and I haven't purchased anything from them recently. The image above is in Elena, but is roughly the text they used in their Collis display (except for my typos).</p>
      <p>Their type is not only pricy, but they (like DTL) have very few opentype pro versions of their fonts. As far as I know, none of their fonts can be embedded legally in a pdf. For that reason, I have trinité, which has no equivalent, but have only printouts of their other type designs.</p>
