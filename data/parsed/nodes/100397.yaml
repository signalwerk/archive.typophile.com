  date_raw: 6 Feb 2013 — 1:52pm
  votes: null
  html: <p>Elena is an attractive font for mobile devices, but I am curious how it works for printed output for books or papers. It seems to have a nice italic, and many of the classic typefaces have only fair (Baskerville, minion, documenta) or poor (old style 7) italic fonts. I personally like quadraat, dolly, and mercury, And trinite italics. Since I have only seen Elena on an iPad, I do not know how it would work in print. Thanks.</p>
