    <p><strong>Improved Text Handling and Visual Effects Library among New Features for Speeding GUI Development</strong> </p>
    <p>Monotype Imaging, a leading global provider of text imaging solutions, has launched version 2.6 of its SpectraWorks™ graphical user interface solution, a suite of tools for creating embedded GUIs quickly and inexpensively for consumer electronics devices such as printer control panels, handheld devices and household appliances. </p>
    <p>“Developers can quickly integrate popular UI effects without having to build them from scratch, saving valuable time and resources. Text support, already a strong component of our technology, is now even stronger and more flexible with the addition of rich-text format widgets.”</p>
    <p>“SpectraWorks makes it possible to equip low-memory, small CPU devices, like digital cameras and refrigerators, with attractive, easy-to-use GUIs. An otherwise ordinary device can be transformed into delivering highly engaging user experiences that effectively convey brand personality,” said John Seguin, executive vice president of Monotype Imaging. </p>
    <p>New to SpectraWorks 2.6 are rich-text format widgets, which allow developers to apply various font formatting attributes to portions of text within a single widget. Several attributes are available, including italic, bold, underline, outline, drop shadow, emboss, glow and color effects. As an example, a phrase from a line of text can be emboldened or italicized, or appear in a different color for emphasis. </p>
    <p>SpectraWorks 2.6 also debuts with a library of visual effects, enabling developers to apply pre-built, reusable transitions, including turn, fade, spin and scale. In addition, advanced menu effects may be integrated, such as a carousel, where images appear in a 3D-style perspective as if they’re sitting on a rotating disc. </p>
    <p>“These robust, new features bring SpectraWorks to a new level,” Seguin said. “Developers can quickly integrate popular UI effects without having to build them from scratch, saving valuable time and resources. Text support, already a strong component of our technology, is now even stronger and more flexible with the addition of rich-text format widgets.”</p>
    <p>Further information about SpectraWorks 2.6, in addition to a free, 30-day trial version, may be downloaded from <a href="http://www.monotypeimaging.com/spectraworks" title="www.monotypeimaging.com/spectraworks">www.monotypeimaging.com/spectraworks</a>. </p>
    <p><strong>About SpectraWorks</strong><br>
    Licensed to OEMs, developers and designers, SpectraWorks is a platform-independent suite of tools that enable the design of highly interactive GUIs and applications for consumer electronics devices. SpectraWorks comprises three products: the SpectraBuilder™ design tool for constructing and customizing GUIs through a library of building block components; the SpectraCore™ embedded systems library that runs on target devices and serves as the GUI rendering engine; and the SpectraApps™ library of C-code applications that can be customized by OEMs to rapidly build unique products.<br>
    SpectraWorks works with the text rendering capabilities of Monotype Imaging’s iType® font engine, in addition to Edge™ Technology, the company’s solution for displaying superior quality, typographically rich East Asian text in a small memory footprint. Several font formats are supported, including TrueType® fonts, Monotype Imaging’s CATT™ (Compact Asian for TrueType Technology) fonts, Edge-enabled fonts, stroke fonts, font subsets, embedded bitmaps, custom fonts and linked fonts, in addition to text effects.<br>
    SpectraWorks also works with Monotype Imaging’s WorldType® Shaper, a character shaping technology engineered to clearly display characters from complex scripts such as Arabic, Indic and Hebrew – writing systems that contain characters that can change shape, depending on the order of certain characters entered by the user. WorldType Shaper also enables characters from complex scripts to display in the proper direction in which the characters are expected to appear. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype, iType and WorldType are trademarks of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. SpectraWorks, SpectraBuilder, SpectraCore, SpectraApps, Edge and CATT are trademarks of Monotype Imaging Inc. and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U. S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. TrueType is a trademark of Apple Inc. registered in the U.S. Patent and Trademark Office and other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
