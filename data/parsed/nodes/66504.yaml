  html: |-
    <p>The recent updates have had, to me, an interesting side effect: years old posts with great content are resurfacing, making Typophile a bit more fun to read.</p>
    <p>I think it would be cool if there were a feature that specifically highlights old posts that were both entertaining (Uli vs. the world, hrant vs. Nick Shinn) or educational (John Hudson vs. Maxim Zhukov, Kevin Larson vs. David Berlow)</p>
    <p>It's a major failure of most blogs/forums to let their best content die in the archives. To new users, you always want to put your best foot forward.</p>
    <p>Any thoughts?</p>
