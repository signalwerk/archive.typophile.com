      <p>To put a ﬁner point on it: Modernism and Traditionalism may be considered myths, in both of which serifs play a role irrespective of any empirically demonstrable function.</p>
      <p>In those mythical roles, serifs are true to the precepts of the myths, whether or not it’s true that that they improve readability.</p>
      <p>That makes perfect sense to me, because from my perspective as a typographer, more practical than ideological, I have always found it very useful to combine both in layouts with complex hierarchies of text, the contrast between sans and serif type proving practically indispensible.</p>
