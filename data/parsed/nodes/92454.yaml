    html: |-
      <p>@Nick Shinn:<br>
      <cite>The idea that serifs will become functionally obsolete is a nice little myth of modernism.</cite><br>
      <cite>Whether serifs are useful to the process of reading-as-deciphering-text is besides the point.</cite><br>
      <cite>Type forms are invested with far more meaning than that, and it is not just an aesthetic veneer.</cite></p>
      <p>You may be 100% right, but I tend to be inclined to take issue with some of this.</p>
      <p>I fully agree with your first paragraph... except that I'd be inclined to add "in the foreseeable future" as a qualification. I don't think it's absolutely <em>impossible</em> for serifs to go out of fashion.</p>
      <p>While it would seem incredible to me if typefaces like Helvetica, Univers, Futura, and Gill Sans pushed out serif faces, that the evolution of typographic preferences could go in the direction of Optima, Radiant, Lydian, Freehand... in short, towards some other cues which add redundancy to the letterform... thus displacing serifs as the attribute of choice seems not entirely beyond the bounds of possibility.</p>
      <p>When it comes to your second paragraph, I'm not sure that my unease with it is because of disagreement. I feel uncomfortable making definite categorical statements about matters of taste. My aesthetic preferences may not be the same as those of many or most other people, now or in the future.</p>
      <p>So, if serifs aid "reading-as-deciphering", at least that's one objective straw I can hang on to in an argument. I may feel that serifs will continue to be liked for aesthetic reasons, but what can really be said with any definiteness about the fickleness of public taste and fashions?</p>
      <p>Of course, we all know the story about Hitler and Fraktur. It's not beyond imagination that the Western world might be saddled with regimes that consider serif typefaces to be "bourgeois" and proscribe them. If that keeps on for long enough, even after liberation, sans-serif faces will be what people are used to and hence find legible.</p>
      <p>When it comes to your third paragraph: I'm sure you're right, but I find your meaning to lie somewhat beyond my grasp.</p>
      <p>Aside from the "aesthetic veneer", what is the meaning of type?</p>
      <p>One example might be that, at present, a sans-serif typeface sends one kind of message when used in, say, a letterhead... and a serif typeface sends another. A student newspaper at a college might be set in Univers, but never a major daily.</p>
      <p>But that kind of meaning tends to be relative to whatever the current baseline of fashion might be. So it doesn't seem to be much of a bulwark against a changed world in which using Optima instead of Univers sends the same message that using Times Roman instead of Univers currently sends.</p>
      <p>I don't <em>think</em> you were instead talking about how typefaces allude to Jenson and Aldus and company; that would invite derision if it were meant to describe the habits and reactions of the general reader without typographic sophistication.</p>
      <p>So this is why I'm having problems with your posting. I may, like you, feel convinced because of my strong subjective preference for serif fonts in some contexts that the Latin-alphabet using portion of the human race won't turn its back on them any time soon. But that seems to me to be just a personal opinion, rather than a finding based on hard empirical data, so I would feel ashamed to present it as a reliable conclusion to other people.</p>
      <p>And, as an example drawn from recent discussion here, although today Armenian is often printed in typefaces with serifs in imitation of Latin and Cyrillic typefaces, it got along for decades with the Bolorgir style of type which had stroke width variation but no serifs.</p>
      <p>For that matter, I've seen Gujarati typeset in faces that imitate Latin and add serifs, but that's not common except as a style of display type.</p>
      <p>I suppose, then, after being reminded of this by mentioning Gujarati (and there have been illustrations here of even Korean being typeset in mock-Latin styles) the strongest argument for the persistence of serif type is that even if it does fall strongly out of fashion as a primary text type, it will still exist as a stylistic option - and stylistic options don't tend to get completely discarded.</p>
