    html: <p>When I was a young lad, I thought that serifs were needless embellishments, and that they were old-fashioned, and we should move to sans-serif typefaces. Now, I appreciate the readability and beauty of serif typefaces, and I expect they will be around as long as the Latin alphabet.</p>
