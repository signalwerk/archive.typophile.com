      <p>All the available evidence, as well as generally accepted theory, suggests that if serifs touching has any effect on legibility, it would be bad.</p>
      <p>That includes this recent research, presented at ATypI Reykjavik (September 2011):<br>
      <a href="http://www.atypi.org/past-conferences/2011-reykjavik/programme/activity?a=109" title="http://www.atypi.org/past-conferences/2011-reykjavik/programme/activity?a=109">http://www.atypi.org/past-conferences/2011-reykjavik/programme/activity?...</a></p>
      <p>That does not mean that the effect would be significant under normal/good reading conditions. I for one was always surprised that setting entire paragraphs in Blue Island works so well. <a href="http://www.myfonts.com/fonts/adobe/blue-island/" title="http://www.myfonts.com/fonts/adobe/blue-island/">http://www.myfonts.com/fonts/adobe/blue-island/</a></p>
      <p>Cheers,</p>
      <p>T</p>
