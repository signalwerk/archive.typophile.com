      <p><em>Aside from the "aesthetic veneer", what is the meaning of type?</em></p>
      <p>Type has no meaning <em>per se</em>; rather, type is a <em>means</em> to an end. The “æsthetic veneer” is the more or less unique attitude which an individual typeface’s design contributes to the process of communicating information, whether of a factual or fanciful nature.</p>
      <p>Serifs will never “die” because memories have emotive power; from time to time, we revisit the past and mine those memories, for better or for worse.</p>
