      <p>HP: "I wonder if strategically letting them touch (laterally) might actually promote boumas"</p>
      <p>That's an interesting question, of course, but if the market is any indication, and outside of high resolution-specific specifications, (e.g. the Kindle), serifs have been relegated to the back seat. And I'm pretty sure from the designs of nearly all serif text faces that I'm familiar with, that serifs touching is not beneficial.</p>
      <p>"...serifs don't need to be an all-or-nothing proposition..." </p>
      <p>But when it comes down to executing a readable design in low resolution opentype-free environments, some-serif fonts show serifs on only I, 1 and maybe a few others. Why? "Sometimes-some-serif" fonts might be more promising, when contextual layout is more widely used. In the meantime, I'd very much like to see your trials of a bouma-optimized sometimes-some-serif font, which I think you think you can do now. The place I think feets could be more beneficial are on beginnings and ends of words, and on stems above and below the x-ht, incl. caps.</p>
