      <p>@rs_donsata:<br>
      <cite>Once people tought radio would kill the newspapers, then television was meant to kill radio, then internet was meant to kill television.</cite></p>
      <p>It's true that newspapers aren't dead yet.</p>
      <p>However, television has meant that people only listen to the radio for music. You don't hear drama programs on the radio, like Fibber McGee and Molly, or Little Orphan Annie, or Captain Midnight, or, for that matter, Gunsmoke - which was on the radio before it got moved to TV - any more.</p>
      <p>And the Internet is filling many of the otherwise idle hours of people that they might have spent watching television. And the effects of the many channels of TV on local broadcasters before that are well-known as well.</p>
      <p>Now, what might be the next big thing after the Internet... well, whoever brings it about stands to make billions of dollars, so if I were able to foresee it, I would be <em>doing</em> it, not telling you about it. But I agree that since the Internet is so flexible, and it allows people to create, not just consume, it would seem like any future media could be placed <em>on</em> the Internet rather than superceding it.</p>
      <p>Although it's hard to monetize stuff on the Internet, so that might be an excuse for putting stuff elsewhere - but then it's not likely that whatever it is would be nearly as big as the Internet, since it would cost more.</p>
