  html: <p>In 2375, after a long, hard fought battle, the last piece of media is released with the use of a sans serif font.  Old Vendome, was the last to go down. From this point onward, nothing containing serif fonts is created, physically or electronically. The death bell for serifs tolls in 2375.</p>
