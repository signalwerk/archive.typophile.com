      <p>@Nick Shinn:<br>
      <cite>The idea that serifs will become functionally obsolete is a nice little myth of modernism.</cite><br>
      <cite>Whether serifs are useful to the process of reading-as-deciphering-text is besides the point.</cite><br>
      <cite>Type forms are invested with far more meaning than that, and it is not just an aesthetic veneer.</cite></p>
      <p>You may be 100% right, but I tend to be inclined to take issue with some of this.</p>
      <p>I fully agree with your first paragraph... except that I'd be inclined to add "in the foreseeable future" as a qualification. I don't think it's absolutely <em>impossible</em> for serifs to go out of fashion.</p>
      <p>While it would seem incredible to me if typefaces like Helvetica, Univers, Futura, and Gill Sans pushed out serif faces, that the evolution of typographic preferences could go in the direction of Optima, Radiant, Lydian, Freehand... in short, towards some other cues which add redundancy to the letterform... thus displacing serifs as the attribute of choice seems not entirely beyond the bounds of possibility.</p>
      <p>When it comes to your second paragraph, I'm not sure that my unease with it is because of disagreement. I feel uncomfortable making definite categorical statements about matters of taste. My aesthetic preferences may not be the same as those of many or most other people, now or in the future.</p>
