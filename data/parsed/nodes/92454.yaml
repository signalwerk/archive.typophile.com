      <p>Myths may or may not be true.</p>
      <p>Modernism was inherently reductive with respect to form, and classic modernism removed serifs, considering them to be unnecessary ornaments. That is the myth.</p>
      <p>However, perhaps Modernism should have embraced serifs, if they do indeed perform a useful function to the process of reading. </p>
      <p>Certainly, traditionalists believe that serifs are indispensible for optimum readability. That too is a myth. The present scientiﬁc intelligence, as far as I am aware, offers no evidence one way or the other.</p>
      <p>In reading science, the myth seems to be that, beyond a few easily-identiﬁable categories, all the many different type styles which exist have no bearing on the process of reading-as-deciphering (no doubt because they don’t effect reading speed). That is what I mean by aesthetic veneer. </p>
      <p>However, I ﬁnd it hard to accept that typeface subtleties exist only to cue the reader into what sort of document she is about to read, and then vanish from awareness once she becomes immersed.</p>
      <p>In art theory, the “innocent eye” was long ago discredited.</p>
