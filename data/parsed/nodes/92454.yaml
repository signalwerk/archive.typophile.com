      <blockquote><p>horizontal strokes so thin that they're actually nonexistent.</p></blockquote>
      <p>I have a theory that this might come from blindly emulating eroded inscriptions.<br>
      <a href="http://armenotype.com/wp-content/gallery/highlights/dsc_0377.jpg" title="http://armenotype.com/wp-content/gallery/highlights/dsc_0377.jpg">http://armenotype.com/wp-content/gallery/highlights/dsc_0377.jpg</a></p>
      <p>In terms of the difference between long one-sided serifs versus crucial elements, it can get pretty subtle. Here's an illustration from my recent Armenotype article*:<br>
      <a href="http://armenotype.com/wp-content/uploads/2012/04/illustration2.gif" title="http://armenotype.com/wp-content/uploads/2012/04/illustration2.gif">http://armenotype.com/wp-content/uploads/2012/04/illustration2.gif</a><br>
      That's from my first-ever outline font, which I made by staring (without magnification) at the letterforms in a document set in Compugraphic's Barz (possibly the most ubiquitous Bolorgir, at least back then). Look at the bottom-left corners of the descenders: it was probably hopeless (I was too inexperienced to appreciated the total disappearance of tiny details at text sizes on laser printers on lousy paper...) but I tried to implement a difference between serifs versus actual horizontal bars - the «ի», «խ» and «կ» have serifs, while the «լ» and «ղ» have bars.</p>
      <p>* <a href="http://armenotype.com/2012/04/archipelago/" title="http://armenotype.com/2012/04/archipelago/">http://armenotype.com/2012/04/archipelago/</a></p>
      <blockquote><p>if the Armenians in Armenia are happy with thoroughly Latinized typefaces</p></blockquote>
      <p>Not all of them are happy. And some of them are "happy" because they see it as a necessary evil, sort of how -I and others believe- Ataturk converted Turkish from Latin to Arabic - to play along with the victorious West after WWI. As for the rest, I hope they'll attend my talk in Yerevan in the second week of June...  :-)</p>
      <p>--</p>
      <p>The Armenian communities in Lebanon have severely weakened over the years, and many of those that remain have trouble staying Armenian (something our US communities were previously infamous for). It's ironic that they were strongest at the height of the Lebanese Civil War. I still have a lot of family there (including a cousin who used to be the editor of Aztag, once the premiere diasporan newspaper) but sadly I can't consider the Armenian diaspora in Lebanon to be trend-setting in any way these days.</p>
      <p>BTW, Lebanon -still- has two official languages: Arabic and French. Coupled to the fact that English is the lingua franca, any Lebanese person (especially an Armenian one, since we're more Western than the average Lebanese) is at least as influenced by Latin forms as Arabic ones. There are even certain strata of Lebanese people who want to deny they're Arab, to the point of making some Arabic words sound French. :-/  A classic example is the word for rat, "jardon" (affectedly pronounced with a "gh" for the "r", and a nasal "n") which in fact is nothing but the Arabic word "jirthaan"! Lebanon is funny. Anyway, I digress...</p>
      <p>hhp</p>
