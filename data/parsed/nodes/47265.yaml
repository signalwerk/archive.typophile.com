      <p>I've read this thread with great interest but still struggling to work out how I can reconcile this with working in mm - it seems perfectly geared up to working with inches. I suppose like everyone using metric measurements as default, I'm looking a standard way of setting up documents in InDesign based on working with DIN-standard paper sizes, but keeping points as the units of measurements in the baseline grid and gutters ;o)</p>
      <p>To me, 6pt baseline grids look like the way to go - I think there's enough flexibility there but visually I don't think there's enough visual structure in using less than 6pt. I just don't like full line paragraph breaks, I think the distance looks too wide IMHO.</p>
      <p>I reckon the best way seems be to set document sizes and margins(possibly?) in mm and everything else in points? To me this logically seems the best compromise. That would mean ignoring Picas though as 1 pica = 12points, I might as well set up a 6pt document &amp; baseline grid in points not half-picas?</p>
      <p>I wonder if anyone can shed some light on how publishers in Europe handle this, given the amount of content they have to order and structure with DIN-page contraints.</p>
      <p>Anyone any ideas - is there a better way to do this?</p>
