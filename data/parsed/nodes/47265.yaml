      <p>YOTS,</p>
      <p>Three isn't necessarily THE magic number, but rather a catchy reference to the old School House Rock jam. Anyway, the base three approach is essentially the same rationale as your base 5 or 10 system for web.</p>
      <p>Since there are 72 points in an inch, 12 points in a pica, six picas in an inch, etc., the math rounds out nicely. You need to be judicious with type, but the base three system can be quite effective at slaying massive, disorganized, beastly documents. </p>
      <p>Imagine a newsletter that utilizes a variety of type styles: headlines of varying size, subheads, body copy, bulleted lists, bylines, and cutlines. Column widths aside, you can start by establishing body copy with, say, Adobe Garamond, 10/12. Pretty standard so far. Move on to small headlines: Trade Gothic Bold Condensed, 16/18. Large headlines: Adobe Garamond 36/39. Cutlines: Trade Gothic Medium 7/9.</p>
      <p>You get the idea. The base three system is really no different than using any other baseline gridwork, just that it seems especially versatile. Actually, the sample grid system in this tutorial could just have easily used a three point baseline grid.</p>
      <p>DOGG : : :</p>
