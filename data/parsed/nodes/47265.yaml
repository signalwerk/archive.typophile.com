      <p>Cool</p>
      <p>You could make the grid half the leading, that way you can avoid full returns. Also let people know how to set up their text frames, which are set to Ascent in InDesign by default. I always used Fixed frames if I am using a baseline, but maybe there is another way. </p>
      <p>Baselines are good for some tasks, but sometimes I like to use cap height because it allows you to align an image with the type at the top of the text frame. That gets complicated though.</p>
      <p>Feel free to correct me if I have led anyone astray, I'm a novice.</p>
      <p>Andy</p>
