      <p>The most important thing is to find a common multiple, whether using base 3 or something else. Always start with the text size, but if you need smaller captions, footnotes etc, you need smaller steps than 12pt. If your captions would be 7/8pt, you could use a 4pt baseline grid, if you need 7/9pt, a 3pt baseline is good. </p>
      <p>The smaller you get, however, the more difficult it gets for the reader to discern the inherent discipline a grid brings. Based on multiples of 3pt, headlines have a lot of flexibility, more than you’d want for a newspaper. If you work in metric, remember that 3pt is just over 1mm – a grid unit that Müller-Brockmann et al would have considered to fussy. Sometimes it is easier to work with metric grids, especially as the page size would also be metric. </p>
      <p>Unfortunately for us European mm-heads, both Indesign and Quark quietly convert metric input for leading (which isn’t leading, but line-spacing) back to points and you end up with strange decimals in the menu. But you can ignore them.</p>
      <p>The size of your baseline grid can help lining up type (and images), but it can also be a style issue. If your grid is coarser, increments will be more noticeable and the grid will become a design feature. working with a small common unit of line-spacing is like constructing a building with bricks: while they are too small to count, all the features (windows, doors, transoms, steps) of the facade are multiples of a brick, the baseline of the building, as it were. That gives it an honest, quiet authority that we seem to respond to. This also works with other materials, but like a coarser baseline grid, building with larger concrete slabs or glass panels would become more of a style than using those small bricks.</p>
      <p>The space between columns also depends on the way you set text. If you justifiy (which i wouldn’t do for narrow columns with less than 35 characters) the type, the channels need to show more white than for unjustified text where only a few lines will ever make full measure. I never draw space between columns, but indent my text from the right, so i can adjust that space between columns individually. That way, i can also cheat and sometimes widen a column by a fraction in order to bring over the occasional word – widow or orphan. So far, nobody has noticed that little trick in any of the work i have done.</p>
    html_clean: |-
