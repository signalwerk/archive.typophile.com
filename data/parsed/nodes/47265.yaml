      <p>Duckworth</p>
      <p>I guess it depends how happy you are working with different units, do you mind seemingly random values in mm when working in points/do you like to work to three decimals places etc. I don't think there is a way to reconcile DIN paper size with the point system exactly, no magic math as such, but you can make strong layouts with a bit of tolerance between the two systems. I usually do as you say and have the document set in mm and the type in points, I wouldn't worry about picas.</p>
      <p>If you base your grid on metric measurements it will result in long values when converted into points, but really that's not a problem for a complicated job as you can quickly add these values to style sheets, save you typing them. It is possible to have atom splitting measurements in InDesign which allow the paper size and point sizes to come together with very very small discrepancies.</p>
      <p>The best book on grids and baselines IMHO is Raster Systeme/Grid Systems by Josef Müller-Brockmann. It took me a long time to get into it but it does have fantastic advice on dividing up pages precisely. The example he employs is a DIN page and the type is in points, so it might help you with your question.</p>
      <p>Hope this helps</p>
