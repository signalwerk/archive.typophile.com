      <p>I thought I’d add my two cents to this excellent explanation. My sample layout is based upon Josepf Müller-Brockmann’s book, Grid Systems in Graphic Design. I’ve included a screen capture of the final grid. The layout grid, combined with InDesign’s underlying baseline grid aligns the type perfectly within each unit. I’ve departed from the treatise by using the x-height and baseline to size my grid unit. It’s a visual alignment that is far easier to do now than when the book was written. The gutter allows for a single line caption under each image. The final product is an 8 by 10 inch proof sheet for 35 mm images. There are many products on the market that do a far better job of making a proof sheet. I was working at an understandable example of the underlying structure. It’s somewhat complicated to explain how I set this up, but if there is enough interest, I’ll give it a try.</p>
      <p>-Bill Lomax</p>
      <p><img src="/sites/default/files/old-images/Grid_5072.jpg"></p>
