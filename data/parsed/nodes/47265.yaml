      <p>Hello Roger,</p>
      <p>What’s different about my sample grid is that it is specific to the body copy font. Helvetica Bold Condensed would be a horrible choice, but it works for this one task. If I substitute Garamond, it will not fit the grid correctly.</p>
      <p>The short version of how is that you need to know the exact x-height of the font. Most commercial fonts have a UPM of 1,000. If your font has an x-height of 395 (Arno Pro regular), then at ten points the x-height is 3.95 points. My example row is eight lines deep. The height of a row is: 7x leading (12 pt) + x-height = 87.95 pt. The horizontal alley (gutter) is: 2x leading (12 pt) – x-height = 20.05 pt. Set Preferences &gt; Grids &gt; Baseline Grid &gt; Start: 3.95 pt (x-height) | Relative to: Top Margin | Increment Every: 12 pt (leading).</p>
      <p>Then it’s a question of using the numbers to set up rows and gutters.</p>
      <p>You can make a very close approximation of the x-height by turning an “x” of your choice of font, at size, to outline. Then ungroup it and use the Direct Selection Tool to draw a marquee around the “x”. Drag ruler guides to snap to the x-height and baseline. Measure the distance between and you have your number.</p>
      <p>-Bill Lomax</p>
