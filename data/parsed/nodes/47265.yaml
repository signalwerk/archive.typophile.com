      <p>JT, you can set a custom baseline grid for each text field in the Text Frame Options.</p>
      <p>Very nice article. For anyone interested, I created a grid system for web work that incorporates a 10pt baseline grid. By setting the baseline to 10pts, you can multiple leading choices, as long as it's in increments on 5pts. You can <a href="http://www.aisleone.net/2007/design/designing-grid-systems-for-flash/"><strong>read more about it</strong></a> on my blog.</p>
      <p>Dogg, could you explain your system a little more. Why is 3 the magic number? By having a baseline grid os 3pts, wouldn't the leading have to be a multiple of 3?</p>
