      <p>Through experimentation, I've found that using a three point baseline grid is ideal for most documents. Of course, this isn't true for all pieces, but it's a good default for newsletters, forms, and leaflets that employ a broad range of type sizes (i.e., cutlines, body copy, headlines, and footnotes).</p>
      <p>My "base three" system has one mathematical advantage of being multiplied evenly into standard page sizes, which results in faster, cleaner layouts. I'm a workaday designer, and a majority of my typesetting is done at a mill pace--quick and dirty. This grid method is a lifesaver.</p>
      <p>My two cents.</p>
      <p>DOGG : : :</p>
