      <p>This is a great thread. I was dealing with similar issues recently when designing a book and decided to write a little Python program to do the job for me. Admittedly, it has a lot of shortcomings as it was built for a very specific task. That being said, I've since used it to set up grids for other print projects and it works well-enough.</p>
      <p>You can see a bit of it on my website <a href="http://www.sincerelyross.com/">www.sincerelyross.com/</a> (under Grid Generator)</p>
      <p>It does essentially what is described above and is also based first and foremost around the choice of leading (thus typeface and size). One difference at this point is that it is not as concerned with the x-height, though I can see from Grid's comment why this might be a valuable thing to incorportate. It started out as a means to create totally proportional grids and page formats (according to Van de Graaf and Tschichold's analysis of traditional page models) though I have since added the ability to specify things like margins, page format, etc manually. </p>
      <p>I'll try to post back as it develops. I'm sure I'll have a lot more questions as important decisions arise.</p>
      <p>Cheers!</p>
