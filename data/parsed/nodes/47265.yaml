      <p>Jennifer, you may work inside InDesign using whatever units you want, just by writing them. (example, in the top you've got the units you set in the preferences menu, but you can work in the boxes directly, or even make calculations with it. Draw a square 10x10mm. Them go to the "h" box (height) and type "10+25%". You'll get a 10x12,5mm rectangle, because you told InDesign to calculate 25% of the hight and add it. That works in every unit, namely points in the bodies of typefaces and leading.)<br>
      Imagine you set a 10/13pt text as a base text to build your baseline. For captions, deducted from it, you can calculate a leading ratio for the body of the caption, like 6/13-25%pt. This will result in a caption text 6/9.75pt and you be sure to align the grid in every four lines.<br>
      Summary: write down the units you want in the boxes: pt, mm, cm, p<br>
      calculate by association 12+25%,12*1,25pt (multiply by 1,25, which is equal to add 25%), 12/2 (divide by 2), etc. You will see how helpfull it is.<br>
      Hope it helps...</p>
