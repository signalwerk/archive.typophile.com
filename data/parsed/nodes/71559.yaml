      <p>It might help if you post a scan or PDF of the current newspaper. What's the size, is it a broadsheet or tabloid? Do you need to cram a lot of text onto each page, or is this more of a magazine-style layout with lots of white space? You mentioned Gulliver and Swift, these fonts have short ascenders and descenders which allow you to maxmize lines per column. Most newspaper fonts are designed this way. But if space isn't an issue, you can choose something more traditional.</p>
      <p>Also, the point size of the text and leading make a huge difference when it comes to readability, especially for "old people" as you say. They would probably appreciate something solid like Poynter from Font Bureau.</p>
