      <p>There is a local liberal city newspaper here where I live, which ironically uses a font developed for body text in a bible. I think it is a neat font and can recommend it, as I am a reader of this weekly paper. The thin paper and hard printing conditions typical for bible printing results in a need for a more solid design. This is a similar brief as it would be for a newspaper font, so no wonder a paper actually picked it up. It is unique enough to stand out, but still very legible, although in this sample paper I wouldn't mind a tad more leading. As you have a christian newspaper in planing, this font might actually just a very good pick.</p>
