      <p>I'd be wary of Tasman for news text.<br>
      It has low contrast and a tight fit, which, when substantial press gain is considered, and the effect of news printing being grey on grey, will produce a dull and heavy effect (see below). Also, the consistent widths of the lower case letters, the squarishness of the curves, and the narrow space character, further contribute to a lack of sparkle. The soft and nuanced finish which imparts friendliness when the face is inspected closely is a display quality, and will be problematic in text practice, especially for your particular audience.</p>
      <p>However, the short capitals and old style figures add interest, and it could be an OK magazine face, if the fit is opened up here and there.</p>
      <p>Think of your readers. What's friendly for them will be something familiar. Resist the temptation to experiment with faces that are not proven in newspapers.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tasman_4041.png"></div><p></p>
