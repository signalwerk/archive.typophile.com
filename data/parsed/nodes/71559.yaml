    html: |-
      <p>Harfang is nice, but it is not a news face.<br>
      It is too tightly fitted/kerned for text, and has too much personality (too large details) for headlines.</p>
      <p>Fedra is not really a news face either, which is why Peter Bil'ak produced Greta.</p>
      <p>For text, one must consider the large amount of press gain that occurs on newsprint paper.<br>
      For headlines, one must consider the length of extenders in multi-line settings, and how the face sets when tracking is reduced, among other things.</p>
      <p>Further to my comment on Comic Sans, I *seriously* question your pursuit of "friendliness". Faces which you deem friendly, such as Expo and Novel, are too soft and shapeless for news design, which requires instead styles which are dispassionate and authoritative. </p>
      <p>For many reasons, news type is one of the narrowest, most conservative areas of typography. Unless you have some experience in the genre, it's best to not stray too far from the conventions.</p>
