    html: |-
      <p>The difference between Microgramma (designed 1952 by <a href="/wiki/Alessandro%252BButti" class="wiki-create">Alessandro Butti</a> and <a href="/wiki/Aldo%252BNovarese" class="wiki-create">Aldo Novarese</a> for <a href="/wiki/Nebiolo" class="wiki-create">Nebiolo</a>) and Eurostile (designed 1962 by Aldo Novarese) is not only 10 years, but that Microgramma was <em>originally</em> a CAPS ONLY face.</p>
      <p>I had the pleasure of meeting Signore Novarese (pr. No-vah-reh-zay) and afterwards kept correspondence for a while.</p>
      <p>———————————————————————————————-<br>
      Sì, sono vecchio, ma sono indietro nello stile!</p>
    html_clean: |-
