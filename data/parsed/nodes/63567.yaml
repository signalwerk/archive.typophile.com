      <p>I remember seeing your older thread, Simplicious, and I'm curious... how come you are going with a lowercase S? Seemed like before I was able to read it as a nice combination of "Simple ease" much better. Now I can't help but read "sim please." Perhaps it's the dot-less i... to me, without it, there's more weight on the right side of the word (my eye interprets the descender on the p as some kind of seperation).</p>
      <p>Neo Sans does seem less strict. It feels extremely child-safe, actually; follows the current corporate re-branding trend of having no sharp edges. The more I look at it, the more I see that decapitated i as a small cap thrown right in the middle of s and m, interrupting the lowercase.</p>
      <p>Then again, I could just be weird. I love the name you got going, I understand the logic behind it perfectly and I think it's creative.</p>
