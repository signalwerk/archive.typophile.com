      <p>Thank you both for your feedback.</p>
      <p><strong>@David Boni:</strong> The reason why I decided to go with a lowercase 's' was, that I wanted to bring in more geometry. As a result of this, I also dropped the tittle. Both decisions lead to the impression of having an optical middle -- the 'l' respectively 'ple'. That's exactly the area where the words 'simple' and 'please' are blurred together. I want to emphasize those two words instead of 'simple ease', simply because many austrians don't know the word 'ease' -- most of the tested persons were able to see a connection to 'easy', but many don't know the 'ease of use'. That's why we decided to make the 'ease' kind of a bonus, for those who know the 'ease of use'. For all the others we have the word 'simple' which is easily associated with the industry (User Experience Design), and we have the word 'please', which is one of the first english words people learn in school. As a result we hope to get a very memorable name.</p>
      <p>I agree that it reads 'sim please', but actually that's also how it's pronounced by most people. Nevertheless I will try a dot on the 'i' to see how it works -- thank you for this comment.</p>
      <p><strong>@epsilicon:</strong> Thank you for your exquisite font-list. I've already tried some of your suggestions a few months ago, when I started to set the letters in different typefaces. Anyway, some of them are new to me and so I will definitely take a closer look at those. Thanks for your work, I appreciate it a lot.</p>
