    html: |-
      <p>I am currently working on stationery stuff. This example features the first page of a 2-page offer. The paper format is A4. Gutter and leading are set to 3,75 mm which equals 71 lines per page. The leading of the copy was adjusted to meet every third line of the standard baseline. <a href="http://www.simplease.at/stefan/simplease_offer.pdf" rel="nofollow">Download the PDF-Version.</a><br>
      <em></em><em></em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/stationery_details_5066.png"></div><p></p>
      <ul>Our corporate typeface is Univers (Light)</ul>
      <p><em></em><em></em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/12_column_grid_4005.png"></div><p></p>
      <ul>The layout is based on a 12-column grid</ul>
      <p><em></em><em></em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/golden_sections_6116.png"></div><p></p>
      <ul>The page consists of 2 'golden' elements</ul>
      <p><em></em><em></em><br>
      To have a pleasant column width for the copy I decided to divide this part into 2 different columns. The right one is for the text and the left one provides meta information to improve scanability. The longest line within the copy contains 64 characters.</p>
      <p>The idea was to design a very simple layout that suits our identity and considers all the 'rules' of typography. To design something like a 'user-experience' I decided to provide the reader with meta information which dramatically reduces the effort of finding the needed information -- let's just call it a more efficient way of reading and rechecking the content. Nevertheless this meta information is not meant to be headlines and so the text of a document always has to be coherent without the need of reading the meta information. (for all native german speakers: right now it doesn't -- this is just some sort of placeholder text)</p>
      <p>Any kind of feedback would be well appreciated and very helpful since I would like to carry on with the rest of our CI.</p>
