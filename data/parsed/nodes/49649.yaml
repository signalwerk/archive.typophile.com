    <p>Hi,</p>
    <p>I’m stuck with a major problem here. Since I’ve updated to Leopard, the OpenType &amp; Classes panels in FLS 5.0.4 don’t show anymore. I temporarily do all the features and class work on my old PowerBook running Panther (on which I haven’t encountered any problem so far). </p>
    <p>Is this vanished-panels-thing a known issue?</p>
    <p>Cheers,<br>
    Steph</p>
