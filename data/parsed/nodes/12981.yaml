    <p>Related to Nick Shinn's <a href="http://typophile.com/node/9373" rel="nofollow">thread</a>, I would like to carry on, but insisting on all accented characters in headlines or other situations that require tight leading.</p>
    <p>This issue is more common in French, German and most Eastern European languages, where the use of accented characters is a frequent headache.</p>
    <p>A solution is depicted <a href="system/files?file=stiintasitehnica.gif" rel="nofollow">here</a>, but it's not general. And while Nick Shinn's <a href="http://typophile.com/node/9373" rel="nofollow">approach</a> works for umlaut, it is not usable for other accents.</p>
    <p>[I posted this as a new topic, because I could not find a way to include photos in comments to other people's posts... sorry for that, but the new Typophile, while very nice, is not as intuitive as the old one].</p>
    <p>Marius Ursache<br>
    Chief Creative Officer<br>
    Grapefruit (<a href="http://www.grapefruit.ro" title="www.grapefruit.ro">www.grapefruit.ro</a>)</p>
