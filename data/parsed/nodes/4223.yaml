    html: '<p>I think you should bolster the lower-left leg (spine), perhaps having the vertex of the rays farther to the right. Obviously, the optical perception of the vertex will vary with print size and technique, but right now that part looks too thin IMO. <br> <br>What about alternating an extra-long (beyond the square shape) ray and a shorter one to add some visual interest to that side? <br> <br>Also, about the "80s look": Most of the companies that used a linear halftone logo were telecommunications (AT&amp;T) or high-tech, like the ones Adriano posted. Since Kentucky Lights is actually a lighting supplier, your use of rays in the logo is representative of their business rather than a trendy design feature. <br> <br>Make sure the new business cards spell "commercial" right <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>'
