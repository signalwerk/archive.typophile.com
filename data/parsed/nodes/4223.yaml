    date_raw: 12 Apr 2004 — 8:48pm
    votes: null
    html: <p>Tom, I like the image you're going for quite a bit, but I think the K needs to be sturdier. The righthand leg feels too flared, or perhaps too tapered at the top. The thinning of the upper diagonal is better in the second version, but I still think the flaring of the leg is too strong. Also, the lefthand leg is getting eaten away by the negative space of the rays, but I'm not sure that's as much of a problem. Adjusting these might help for smaller sizes, though (which will cause problems at all of those joins). I guess I'd recommend being freer with the manipulation of the original letterform. <br> <br>Are you still considering Champion Gothic Bantamweight? <br> <br>Also, I prefer the earlier versions, in spite of the piano interpretations. I actual saw a clock hand/ metranome moving at first glance. I like the concept a lot. I'm eager to see where it goes.</p>
    html_clean: <p>Tom, I like the image you're going for quite a bit, but I think the K needs to be sturdier. The righthand leg feels too flared, or perhaps too tapered at the top. The thinning of the upper diagonal is better in the second version, but I still think the flaring of the leg is too strong. Also, the lefthand leg is getting eaten away by the negative space of the rays, but I'm not sure that's as much of a problem. Adjusting these might help for smaller sizes, though (which will cause problems at all of those joins). I guess I'd recommend being freer with the manipulation of the original letterform. <br> <br>Are you still considering Champion Gothic Bantamweight? <br> <br>Also, I prefer the earlier versions, in spite of the piano interpretations. I actual saw a clock hand/ metranome moving at first glance. I like the concept a lot. I'm eager to see where it goes.</p>
