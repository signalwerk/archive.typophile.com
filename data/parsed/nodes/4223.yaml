    date_raw: 13 Jun 2004 — 3:35pm
    votes: null
    html: "<p>I find the first versions you posted best, Tom. They are the only ones communicating \"light\" at two different cogitive levels. The first level is visual description: rays. The second one is a subtle presentation of light by thin white spaces (between rays) which actually \"shine\" somewhere from behind the K logo. The thick parts, which are sitting on the rays then make little geometrical shadows. <br> <br>That first logos make the viewer FEEL the light. <br> <br>I am afraid this second layer of meaning has been spoiled in later versions. The reason might be in fact that you have turned those shadows into some kind of wall. This wall can even be understood as a device for stopping the light. You don't want that, do you? <br> <br>In case you agree with my advice, then maybe you will have to balance those thick parts of the K and white spaces a bit more carefully.</p>"
    html_clean: "<p>I find the first versions you posted best, Tom. They are the only ones communicating \"light\" at two different cogitive levels. The first level is visual description: rays. The second one is a subtle presentation of light by thin white spaces (between rays) which actually \"shine\" somewhere from behind the K logo. The thick parts, which are sitting on the rays then make little geometrical shadows. <br> <br>That first logos make the viewer FEEL the light. <br> <br>I am afraid this second layer of meaning has been spoiled in later versions. The reason might be in fact that you have turned those shadows into some kind of wall. This wall can even be understood as a device for stopping the light. You don't want that, do you? <br> <br>In case you agree with my advice, then maybe you will have to balance those thick parts of the K and white spaces a bit more carefully.</p>"
