  - id: 31409
    user: 2236
    date: 2004-04-13T19:40:00
    date_raw: 13 Apr 2004 — 7:40pm
    votes: null
    html: <p>I'll have to admit over-using the linear halftoning effect during the late 80s and early 90s myself, and for that reason I haven't found myself going there anymore, but I wouldn't steer Tom away from experimenting with the technique. I think exploring as many techniques as possible for value gradation is essential to any designer's education. This is a great collection of samples Adriano. <br> <br>I'm not quite feelin' the logo yet, Tom. Fortunately for you, I don't have to. I think I'm on a similar page to Ryan's. I'm not crazy about the flaring of the leg and upper arm/stroke (optical). I kind of like the light rays starting inside the base of the stem, but I wonder if they angled, causing a slight flare to the base of the stem, if it would offer more stability. Maybe even start the top ray by completely separating the base of the stem by following the upper arm/stroke through the stem. Have you tried stopping the rays at the outer edge of the leg? <br> <br>Just some thoughts. <br> <br>Aloha! <br>Scott</p>
    html_clean: <p>I'll have to admit over-using the linear halftoning effect during the late 80s and early 90s myself, and for that reason I haven't found myself going there anymore, but I wouldn't steer Tom away from experimenting with the technique. I think exploring as many techniques as possible for value gradation is essential to any designer's education. This is a great collection of samples Adriano. <br> <br>I'm not quite feelin' the logo yet, Tom. Fortunately for you, I don't have to. I think I'm on a similar page to Ryan's. I'm not crazy about the flaring of the leg and upper arm/stroke (optical). I kind of like the light rays starting inside the base of the stem, but I wonder if they angled, causing a slight flare to the base of the stem, if it would offer more stability. Maybe even start the top ray by completely separating the base of the stem by following the upper arm/stroke through the stem. Have you tried stopping the rays at the outer edge of the leg? <br> <br>Just some thoughts. <br> <br>Aloha! <br>Scott</p>
