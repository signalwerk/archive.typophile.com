    <p>Is it just me, or is Avenir EVERYWHERE right now?<br>
    Was there some hipster branding memo I missed this year?<br>
    I can't seem to turn my head right now without seeing it on something.</p>
    <p>...Just wondering if others have noticed, and what's causing its renewed popularity....</p>
