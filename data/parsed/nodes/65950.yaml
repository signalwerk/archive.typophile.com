  html: |-
    <p>I ran across the anti-smoking website "No Stank You" today --&gt; <a href="http://www.nostankyou.com" title="http://www.nostankyou.com">http://www.nostankyou.com</a></p>
    <p>They use a particular font that I've seen before (or at least similar-looking fonts), but I can't seem to identify it.</p>
    <p>It consists of blocky, solid letters with geometric forms... the upper-case "C" looks exactly like Pacman, i.e. a pie with a piece missing</p>
    <p>I've attached two images:<br>
    1) a screenshot of the website with the font in question<br>
    2) a screenshot of 'Black Boton Bold', which came up on Identifont, and is similar but not quite the same</p>
    <p>Does anybody know this font? And are there any similar, free versions of this type of fontface floating around?</p>
    <p>Thanks!</p>
