      <p>IMO, figures in headlines and titles should generally be lining.</p>
      <p>Because, as Kevin observes with "22", some combinations of old-style figures are just too small, and can look like a "wrong font" mistake.<br>
      This is camouflaged in body text, where the full variety of old style figures appears.</p>
      <p>Since I've been making fonts in the OpenType format, all those with small caps have included small-cap-height lining figures, which are deployed by the OpenType menu command "All Small Caps". Several other type designers do likewise, so look for recently-designed typefaces to have this feature.</p>
