      <p>Some of the more complete text faces do have small caps figures. If you're running into that issue a lot, you should get one.</p>
      <p>As for "capitalization", numbers can't be made to follow exactly the same rules as words. I think it's sensible to want lining figures where you would expect a capitalized word; a book title like <em>22 Facts About Cheese</em> begs for lining figures. But both digits should be lining, of course.</p>
