    <p>So everyone I look, it seems that if you're going to use old style figures at all in a work, then anywhere titling figures appear, it'd better be in an all caps environment. But if we're to really stick with the</p>
    <p>old style figures : titling figures :: lowercase : upper case</p>
    <p>analogy, wouldn't that mean the '7' in</p>
    <p>Chapter 7</p>
    <p>ought not to have that descender? After all, in words, it would be "Chapter Seven." (It actually makes me pause when I see "September 23, 2010" and all the numbers are text figures. That can't be good, right?) But then, following the rule strictly, </p>
    <p>Chapter 11</p>
    <p>ought to have two different styles for the two different '1's. !!! =(</p>
    <p>Another issue: the longer I stare at text figures mixed with small caps, the more out of place it looks. Why aren't there small caps figures too? Everything's looking ugly and I don't know what to do.</p>
