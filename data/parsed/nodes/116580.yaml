    <p>I recently came across the amazing branding for Arts Santa Monica. I know that the font in use is a custom font called ASM by Textaxis. Does anyone know any font like that. I don’t really care for the underlines, I’m merely talking about the shape of the letters: <a href="http://sgustokdesign.com/archive/Cla-se-Arts-Santa-Monica.jpg" title="http://sgustokdesign.com/archive/Cla-se-Arts-Santa-Monica.jpg">http://sgustokdesign.com/archive/Cla-se-Arts-Santa-Monica.jpg</a></p>
    <p>Thanks a lot in advance</p>
