  html: <p>Hi, <br> <br>This is a logo + 2 colors "outdoor street" poster(printed on white plastic) + tshirts for a "small" rock Festival to be held this month. <br> <br>The "dirty rock" logo for the festival was done last year and has migrated to this years event joined with an 8. The red + black colors are also final ones (same as last years). This year I wanted to give a really rock/headbanging mood to the event, and traced a typical rock pose and added some amount of long hair to it. The tshirt has another element on the back featuring a vocalist but I guess I'll drop this illustration and keep the whole image to the main illustration. There is also the backstage/staff pass that has the poster element along with the Cercal Rock logo. <br> <br>As for the poster, as I said it will be printed on white plastic and will be placed outdoor, so it's important to have a memorable poster with it's info (event + logo + date + bands) "readable" or on the best of it's purpose to get the drivers attention. <br> <br>The white stripe on the bottom is for the sponsers &amp; support logos. <br> <br>I wish I had budget for Psy/ops Oxtail. Maybe next year <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br> <br>Feel free to comment. Thanks. <br>adriano <br> <br><img src="http://www.typophile.com/forums/messages/29/52785.gif" alt=""></p>
  html_clean: <p>Hi, <br> <br>This is a logo + 2 colors "outdoor street" poster(printed on white plastic) + tshirts for a "small" rock Festival to be held this month. <br> <br>The "dirty rock" logo for the festival was done last year and has migrated to this years event joined with an 8. The red + black colors are also final ones (same as last years). This year I wanted to give a really rock/headbanging mood to the event, and traced a typical rock pose and added some amount of long hair to it. The tshirt has another element on the back featuring a vocalist but I guess I'll drop this illustration and keep the whole image to the main illustration. There is also the backstage/staff pass that has the poster element along with the Cercal Rock logo. <br> <br>As for the poster, as I said it will be printed on white plastic and will be placed outdoor, so it's important to have a memorable poster with it's info (event + logo + date + bands) "readable" or on the best of it's purpose to get the drivers attention. <br> <br>The white stripe on the bottom is for the sponsers &amp; support logos. <br> <br>I wish I had budget for Psy/ops Oxtail. Maybe next year <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br> <br>Feel free to comment. Thanks. <br>adriano <br> <br><img src="http://www.typophile.com/forums/messages/29/52785.gif" alt=""></p>
