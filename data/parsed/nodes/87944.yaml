  html: |-
    <p>I'm sorry for the quality of the logo, but this safe really does need to be restored.  Before it gets stripped and re-painted, I want to make sure that these fonts can be identified so that I can make some paint masks and put them back on looking exactly how they did 100 years ago when this thing was manufactured (actually I really have no idea how old this safe is, but the customer is saying that it is about that old).</p>
    <p>Any help that can be offered to me is greatly appreciated, as otherwise I will probably have to go through and vectorize it all--I really don't want to have to do that.</p>
    <p>Thank You.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DSCN2769a_4231.jpg"></div><p></p>
