    html: |-
      <p>I looked at the other Zapf fonts, and I don't think that 'y' is from any of them. The rest of your sample looks like Palatino, although my review of that was only quick.</p>
      <p>Sometimes when a supplier want to offer an alternative version (to use a euphemism for copying a design), they will create a 'new' font by changing a couple of letters, so it's not a complete copy. Old time metal type foundries did the same thing all the time. Mergenthaler Linotype, American Type Founders (ATF) and Monotype were constantly copying each other (or other foundries) so they could offer a similar style to their own customers.</p>
      <p> - Mike Yanega</p>
