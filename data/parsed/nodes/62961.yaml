      <p>It seems this is the original version of Palatino. There was also a modified version released in the 1950s. According to Zapf in his book "About Alphabets": </p>
      <p><cite>The somewhat calligraphically-stressed letters E F S q p s v w and y in the Palatino roman were given more traditional forms for the British and American markets....</cite></p>
      <p>I think the modified Palatino is the version one usually sees and the only one that has been digitized.</p>
