      <p>Palatino's designer is Hermann Zapf, and he designed a few similar fonts, like Aldus, and Zapf Rennaissance (I think Sistina and Michelangelo are all caps). I don't think this is one of those, but I haven't looked yet to confirm that. What I suspect is that someone 'customized' Palatino by borrowing a 'y' from another font to change the look.</p>
      <p>- Mike Yanega</p>
