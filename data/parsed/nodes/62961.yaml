    <p>Help identifying this one? I thought, based on the odd capital "S" and the outward facing front feet on letters like lower-case n's and m's this was Palatino...but the lowercase y is totally different. Eek! Help? Maybe it is really obvious, and I'm just being thick...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typeface_3882.jpg"></div><p></p>
    <p>Thank you!</p>
