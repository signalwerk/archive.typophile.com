    html: |-
      <p>The font now handles the furtive patah in all the cases where it occurs in the Mechon Mamre site <a href="http://www.mechon-mamre.org/c/ct/c0.htm" title="http://www.mechon-mamre.org/c/ct/c0.htm">http://www.mechon-mamre.org/c/ct/c0.htm</a>.</p>
      <p>I now need to add a word of caution. If you read the .css file associated to the link above, you get<br>
      <code><br>
      body {font-family:"Ezra SIL SR","Ezra SIL","Keter YG",  ...<br>
      </code><br>
      meaning that if the Ezra fonts are installed, they will be used by your browser (and that works well on Windows), else the next is Keter YG. The font I made was intended to install on my mac so that "Keter YG" would be used, and would render correctly in Safari the pages corresponding to the link above.</p>
      <p>The word of caution is that the font is not general purpose.  It assumes that the vowel points and marks are typed exactly in the same order as they are on the Mechon Mamre site, else, it will not display correctly your text.</p>
