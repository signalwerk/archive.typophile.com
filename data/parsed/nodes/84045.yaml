    html: |-
      <p>I finally added the code to reorder the diacritics. Assuming the dagesh, shindot and sindot follow immediately the consonant, there are at most three diacritics to reorder in the files I considered. Two rearrangement tables applied in a row do the job: the first selects the diacritic to go first, the second the diacritic to go second (that is a selection sort). To sort four, three rearrangement tables would be used etc. Being able to rearrange things that way was an advantage of the AAT fonts.</p>
      <p>Now, I am afraid this is a farewell. Indeed here is what ftxenhancer returns me on OS X 10.7<br>
      <code><br>
      Launch of "ftxenhancer" failed: the PowerPC architecture is no longer supported.<br>
      </code></p>
      <p>The Apple font tools no longer work on OS X 10.7. Goodbye.</p>
      <p>Michel</p>
