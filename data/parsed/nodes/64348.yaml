    <p>I’m redoing a logo for a design company whose name is a Latin word. We want to capitalize the Latin-ness, while also promoting the the diversity of their design. I’m not decided on the Latin type yet. I may design something myself. However, it will be similar to the Plato I have used here. </p>
    <p>What do you think of pairing it with Avant Garde? Any other suggestions?</p>
