      <p>Any opinions?</p>
      <p>My goal is to show contrast and diversity: The tradition of a Latin font (albeit a rustic, eclectic one) together with the clean, artsy look of the Avant Garde.</p>
      <p>Opinions of lower case versus all-caps? I realize the actual company name will make a difference on that. But overall, what do you think?</p>
      <p>And lastly, the business currently uses Avant Garde in its logo, with no other type. That’s why I continued using it. Does it work? If not, do you have suggestions?</p>
      <p>Or, do you have another Latin type suggestion?</p>
