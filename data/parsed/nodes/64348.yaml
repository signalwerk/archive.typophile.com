      <p>Hrant, my point is that there are two ways to approach Latin-ness.<br>
      Either through authenticity (Trajan) or through popular (mis)perception (Caesar’s Palace).</p>
      <p>IMO, some of the Shaw/Boge types would be good for “Latin”, e.g. Donatello, Ghiberti, Beata.<br>
      Based on Italian Renaissance inscriptions, they combine the authentic classic proportions of Latin antiquity with a slightly hewn effect, to satisfy the popular conception of something a bit rustic. A clean sans to complement such faces could be Futura, with its Classically proportioned capitals.</p>
    html_clean: |-
