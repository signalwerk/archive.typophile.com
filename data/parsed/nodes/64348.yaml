      <p>I think the Latin part should be all-caps. If there’s a “U” in there you might even show it as a “V”. :-)  The subtext could be lc (maybe all-lc) but with a nicely contrasting font it doesn’t have to be. In any case I’d avoid Avant Garde. It smells moldy. You don’t want moldy furniture.</p>
      <p>Also, the weathered idea make me uneasy. But it depends on what kind of customers the client wants. And that central question should guide the choice of an Avant Garde replacement.</p>
      <p>Nick, that’s more Greek than Latin.</p>
      <p>hhp</p>
