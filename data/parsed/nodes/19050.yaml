  html: |-
    <p>The Scottish artist, poet and gardener Ian Hamilton Finlay died a few days ago. Over the years, he worked very closely with a number of lettering artists, calligraphers, <a href="http://www.artnet.com/artwork/424497083/ian-hamilton-finlay-the-flageolets-surname--drum.html">stone carvers</a> and even <a href="http://www.artnet.com/artwork/424525270/ian-hamilton-finlay-je-vous-salue-marat.html">neon makers</a> to realise his visions. At the ATypI conference in Copenhagen in 2002, Michael Harvey gave a delightful presentation showing the fruits of many years of collaboration with the often difficult and combatative Finlay.</p>
    <p><a href="http://www.nytimes.com/2006/03/31/arts/design/31finlay.htm">NYT obituary</a></p>
    <p>I’ll try to find some time over the next couple of days to upload a few images of Finlay’s work.</p>
