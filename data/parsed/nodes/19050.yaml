    html: '<p>I recently received a copy of <a href="http://www.amazon.com/gp/product/0711220859/sr=8-1/qid=1148083121">this book</a> about Finlay’s garden and its many clever and delightful monuments. It is a wonderful book and I thoroughly recommend it to anyone interested in lettering: almost every page includes photographs of the many carved inscriptions at Little Sparta. The only criticism I have is that the book does not identify the individual lettering artists who collaborated with Finlay on particular projects, although it is kind of fun to try to guess from the lettering style. I think I spotted a few Michael Harvey pieces I had not seen before.</p>'
