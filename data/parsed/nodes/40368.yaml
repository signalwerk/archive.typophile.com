      <p>I think Aluminum is quite correct. Additionally, if you do not have, or are not planning to have, a full-time design business to operate, then you really should worry less about the absolute market value of your work and more about finding a price that both you and they are happy with. They have a variety of options open to them — from doing it themselves, to having a nephew do it for free, to having the designer at work take it on as a side project, to hiring an established design firm or ad agency, etc. — just as you have other options for how you spend your free time. So if everybody is satisfied with the terms, the project is more likely to go well and the friendship more likely to survive it. Irrespective of what the market is charging, be fair to yourself and work out the price with them.<br>
      I would only add that the offer/promise of future work seems to be something that clients mention instinctively in order to press the price down. As a general rule, I would not allow it to influence the price you set for each individual project. You'll address their being a repeat customer if and when it happens.</p>
