      <p>Are you  going to charge in $'s, £'s or another currency?  I'd say if you're in the UK (as a starter) and you want to build up a good working relationship with them for future work, maybe it's best to do a deal where you provide 3 logo ideas, based on what they're looking for, for maybe £100 - £150.  If they have no idea what they're looking for, chances are no matter how good the logo you may design, it may well not be 'what they imagined', so I'd say it's important to try and get as much info from them as possible.  If they can't give you an idea I'd say you'd have to then say that each additional design would have to be £50 a time unless they can then give you some idea of direction.  It's quite realistic to claim that they'd be paying a lot more than this for other companies' services.<br>
      Logo/corporate ID can be quite lucrative work.  You can see the fees that some online companies charge.</p>
      <p>Hope that helps, but I'll just say that's how I'd approach it, although some others here may disagree with me.</p>
