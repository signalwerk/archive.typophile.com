    <p>Hi, I need some advice on what to charge for a logo.</p>
    <p>Currently, I work as a graphic designer/retoucher for a beauty products company and a couple of my fellow employees are branching out to create their own eco-friendly beauty/skincare products. Their idea is to make an affordable, yet high-quality "green" beauty product. They approached me to design their logo. Eventually, this may turn into a full-scale identity project where I would design the packaging, be involved with or take product photography, etc. For now they need a logo as part of their presentation to potential financial backers.</p>
    <p>It's been a while since I've done freelance work, and even then it was primarly non-logo related- illustration, posters, CD covers, etc.- so I'm not too keen on what I should charge.</p>
    <p>I want to give them a fair price, make some money for myself, but at the same time not break their bank if their idea doesn't go anywhere.</p>
    <p>Any advice would be helpful. Thanks.</p>
