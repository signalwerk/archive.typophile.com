      <p>Asking what random people on the internet charge isn't going to really help you in any way.</p>
      <p>The way to figure out how much to charge is to first figure out what you'd need to charge if you were on your own full time doing this for a living. From there, you can adjust accordingly based on your situation, but without that baseline calculation, you're just throwing darts.</p>
      <p>The question is:</p>
      <p>total cash inflow needed per year / # billable hours per year = your minimum hourly rate</p>
      <p>Note:</p>
      <p>Your total cash inflow includes your salary and ALL expenses (software, hardware, desks, furniture, electriciy, phone, internet, books, insurance, travel, education, fonts,  etc, etc, etc)</p>
      <p>your # billable hours per year is NOT the same as # hours you work per year. As a freelancer, a lot of those working hours will be non-billable. You might decide to work a 40 hour week, but odds are that only 20-30 of those hours are actually billable. Don't forget to calculate for vacation and sick time as well.</p>
      <p>Once you do all that math, you'll find your baseline price. Then you can adjust accordingly based on factors like work load, the client, your expertise/skillset, etc.</p>
      <p>"you want to build up a good working relationship with them for future work"</p>
      <p>Agreed, but (IMHO) lowballing your first gig is NOT a good way to build that relationship. It sets unrealistic expectations and devalues your work--ESPECIALLY if these are friends, as both parties will, by default, tend to allow a lot to slip by that one would normally not tolerate in a business relationship.</p>
