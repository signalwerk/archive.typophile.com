      <p>Timely...I'm embarking on a pretty exciting frozen pizza project at the moment.<br>
      I charge $40/hour start to finish. I try to handle clients (which come via a generally friendly network) with the Jedi mastery of Obi Wan Kenobi: "These aren't the droids you're looking for..."; i.e. "I am giving you what you want." And usually things go very smoothly. This also requires a good amount of good question asking up front, careful listening (best with beer), and common-sense problem solving. I deliver a very functional, better-than-not-designed-by-a-designer logo for anywhere from $100-$400. Some people think that's a lot, some people think it's too cheap. I serve a very small rural community. I'm sure it might be a completely different story for metropolitan folk, or if you intend to jockey for position on the world wide web.</p>
