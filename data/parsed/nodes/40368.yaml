      <p>Drop by a bookstore or Amazon and pick up the <em>Graphic Artist’s Guild Handbook of Pricing and Ethical Guidelines</em>, it gives a lot of detailed information on logo pricing.</p>
      <p>If I were you I would avoid giving them a rock bottom rate just to establish a business relationship. Doing so devalues the entire design trade, but it would also put you in a situation where you are allowing friends to take advantage of you for next to no money, which is a good way to sour a friendship. If they really can’t afford a designer, do design work in exchange for a small stake in the business—50 Cent made hundreds of millions of dollars from plugging Vitamin Water that way!</p>
