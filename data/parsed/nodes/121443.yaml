    html: <p>If your tools let you export a CFF-flavoured (or PostScript-flavoured) OpenType font, how do things look like inside one? I'm guessing there is a conversion from cubic to quadratic splines that is messing things up.</p>
    html_clean: <p>If your tools let you export a CFF-flavoured (or PostScript-flavoured) OpenType font, how do things look like inside one? I'm guessing there is a conversion from cubic to quadratic splines that is messing things up.</p>
