    <p>Hello everyone, </p>
    <p>I'm having a small problem when generating my font with Studio 5. I'm new to this program and after looking through the manual with no luck and after I did some search o the internet with no luck also I thought to give it a try and ask here.</p>
    <p>I drew my fonts in Illustrator and they look nice, smooth curves, few points and everything. I import them in Studio 5 and they look very nice also. I hit generate font, install the font in windows and when I try typing with it to use it... the curves don't look nice anymore. Something happens along the way and I just can't figure out what. If I convert the letter to outlines in Illustrator it gets a lot of points also, like 50 instead of 15 when I drew it. The letters look nice in both Illustrator and Studio 5, but they don't look so nice after I generate it as a true type/open type.</p>
    <p>I have a feeling this might be a silly question for the experienced but I'm at the beginning and I didn't know where to turn to.</p>
    <p>Thank you in advance!</p>
