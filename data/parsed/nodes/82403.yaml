  html: |-
    <p>The great french typographer and historian Yves Perrousseaux, author of the first 3 volumes of the french typographic history encyclopedia "Histoire de l'ecriture typographique", passed away last friday. He never missed a Lure meeting in 30 years, he was my dear friend and a truely wonderful man, and he will be greatly missed.</p>
    <p>David Rault</p>
    <p><a href="http://newsletter.perrousseaux.com/06/" title="http://newsletter.perrousseaux.com/06/">http://newsletter.perrousseaux.com/06/</a></p>
