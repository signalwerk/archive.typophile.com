    <p>Okay, as an amateur, a dabbler, a dilettante if you like: I have been drawing my first(ish) font in TypeTool. It’s only a pixel font (yeah, yeah, I know, does the world need any more? but it’s only for my own edification really), and I’ve got a bit carried away drawing small caps and ligatures and different types of numerals etc.<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;My question is: short of upgrading to FontLab*, is there a cheap/simple way of adding OpenType layout tables to turn these characters into usable features?<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;I’ve spent a while trying to read the VOLT pages on MS’s website but it’s left my head spinning as I’m no techie.</p>
    <p>*which I may end up doing at some future point <em>anyway</em> I suppose...</p>
    <p>_______________________________________________________________<br>
    Ever since I chose to block pop-ups, my toaster’s stopped working.</p>
