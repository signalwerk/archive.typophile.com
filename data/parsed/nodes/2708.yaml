    html: <p>regarding the h and b ascenders, you might consider tapering the tops like the t. that would definitely lighten them, and i don't think it would be inconsistent. but it may make them appear "pointy" at small sizes. it may also contribute to an overall "forward" motion.  <br> <br>you might want to consider moving the tapering stroke of the a to the bottom, to lighten up that joint near the baseline, and let the upper portion of the bowl remain (optically) monoline.</p>
