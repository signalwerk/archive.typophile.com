    html: <p>Hi Ralf, thanx for your reply. FontFont sells Quadraat in either PostScript or TrueType (Win) format. I ve got PostScript cause I am working on a mac. The characters do not map my keybord, even if I switch to Russian in International Settings. Why a cyrillic version of the font is practically of no use?</p>
