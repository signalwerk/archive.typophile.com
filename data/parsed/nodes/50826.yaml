    html: |-
      <p>It would be helpful to know the exact version numbers of Mac OS X and InDesign that you are using, and also the file modification date of the FF Quadraat files. How does your text get into InDesign? Do you copy it, and if so from what source (e.g. Word Document, plain text file ...)</p>
      <p>It should work, I tried it and can type with FF Quadraat Cyrillic in InDesign using the Russian keyboard layout, and apply the font to Russian text that I copy from the web.</p>
      <p>By the way, TrueType fonts are also OpenType fonts, and not restricted to Windows. You can use them on any recent Mac OS as well.</p>
