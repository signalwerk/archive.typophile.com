    <p>Hello dear typophiles, can you help?<br>
    I setting a book in FF Quadraat. Some parts of the text are in Russian, so i purchased the cyrillic version of the font (Cyrillic, Postscript). The cyrillic glyphs do not appear in inDesign when i apply the font to the Russian text. I tried to go through TextEdit - it does not work. Please do not tell me that i will have to replace every cyrillic glyph via glyphs palette!</p>
