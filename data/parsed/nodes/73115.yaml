    <p>I will be speaking at TypeCon on the subject of my collection of vintage type and design from the English fabric trade and thought I should create a blog which gives a taste of the collection.<br>
    It is not complete or well done (I only started building it Monday) but please take a look at it here.</p>
    <p><a href="http://www.textiletrademarks.com" title="www.textiletrademarks.com">www.textiletrademarks.com</a></p>
    <p>Best regards and maybe see you at TypeCon</p>
    <p>Adrian Wilson</p>
