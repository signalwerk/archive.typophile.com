    <p>If you look at pages 28-31 in this PDF, you'll see a neat piece of font debugging software called 'Otted' for Mac and Windows.  </p>
    <p><a href="http://blogs.adobe.com/typblography/atypi2006/OpenType_Status_2006.pdf" title="http://blogs.adobe.com/typblography/atypi2006/OpenType_Status_2006.pdf">http://blogs.adobe.com/typblography/atypi2006/OpenType_Status_2006.pdf</a></p>
    <p>I imagine this is someone's internal tool, but does anyone know more about it? Seems very handy.</p>
