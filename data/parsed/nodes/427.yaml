    html: <p>Reviving the old, old thread. Now I have someone else, a Japanese magazine, who want to feature some of my fonts in an article of some sort. They've listed the fonts they're interested in, but may not realize that they're actually a version behind. <br> <br>I have access to a Mac, and PCs galore, including a friend's that has FontLab on it. Can I use <i>that</i> to make Mac fonts? Our first efforts seem to have made PC Type1 fonts that my Mac doesn't recognize. <br> <br>(Still clueless when it comes to Macs. I have a G4, and I can't manage to access anything on CD-ROM by myself. :/ )</p>
