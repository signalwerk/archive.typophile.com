    html: <p>Actually, it's not. It has a $45 US registration fee, and registration includes being able to make an italic version, which has been my specific problem. <br> <br>My big problem is that I don't know Macs, and my friend in France doesn't know the inner workings of fonts. <br> <br>I have Suitcase on the Mac, I haven't been able to make a suitcase that has more than one font in it, which I've seen. I know there are things I'm doing wrong. Does anyone have any advice, or a place to point me to for better instruction, before I start throwing money at the problem?</p>
