  html: "<p>Hello. Total newbie here. <br> <br>I've been making my own fonts for quite some time now using Font Creator Program (I hear groaning). One visitor to my site, a Mac user, downloaded my Tin Doghouse and Tin Birdhouse fonts, but found that the Mac versions lagged behind the current versions. <br> <br>I've lost my contact for converting to Mac, so I'm stuck doing it myself. Fortunately, I do have complete access to a Mac, and the person I'm trying to help has a conversion program, TTConverter. The trouble is that things have gotten weird. <br> <br>Photoshop doesn't seem to recognize the Italic version of the font at all. Outlook Express does recognize the font, but won't do \"special characters\". (He's from France, so he may mean accented characters.) InDesign works in a way: <br> <br>\"If i select a text yet typed and change the font to one of the tins, it works. But i can type anything, even spaces display always the same odd character. The special charcters function of InDesign works perfectly, but it's not very quick.\" <br> <br>Anybody have any idea what's going on here? <br> <br>The originals can be downloaded at: <br> <br><a href=\"http://dartcanada.tripod.com/Objets/New/tz_frame.html\" target=\"_blank\">http://dartcanada.tripod.com/Objets/New/tz_frame.html</a> <br> <br>I can post what I got when I tried converting to Mac if that would help.</p>"
