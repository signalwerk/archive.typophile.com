    html: <p>Sorry about the Crossfont information. I've downloaded it a long time ago, and never actually used it, so... :-/ <br>I don't know much about Macs and font conversions, but as a workaround, you can just rename the italic and not generate it as a proper italic. The user of your font will have to change the typeface each time he uses the italic.</p>
