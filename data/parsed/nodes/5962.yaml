  html: <p>Not your typical concept but the client loves the evil feel surrounding the name. The skull thing has been done so many times I'm finding it a bit worn.  <br>Anyway any help - constructive thoughts are much appreciated.  <br>Concept is for a custom bike company which wants to convey the freedom of biking while incorporating a skull. They manufacture custom bikes - you pick the parts - they assemble it. It has to fit within that "psycho" biking market, cool, hip etc. Some constraints - a crest logo for the front (about 1.5" wide) so it can't go horizontal. A wordmark only, no logo, will follow for the side frame (horizontal only). The concepts here are development stages from top to most recent. Fonts are not even a thought yet. So here it is skull w/riding mask, bike gear and pure evil! Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/29/42260.jpg" alt=""></p>
  html_clean: <p>Not your typical concept but the client loves the evil feel surrounding the name. The skull thing has been done so many times I'm finding it a bit worn.  <br>Anyway any help - constructive thoughts are much appreciated.  <br>Concept is for a custom bike company which wants to convey the freedom of biking while incorporating a skull. They manufacture custom bikes - you pick the parts - they assemble it. It has to fit within that "psycho" biking market, cool, hip etc. Some constraints - a crest logo for the front (about 1.5" wide) so it can't go horizontal. A wordmark only, no logo, will follow for the side frame (horizontal only). The concepts here are development stages from top to most recent. Fonts are not even a thought yet. So here it is skull w/riding mask, bike gear and pure evil! Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/29/42260.jpg" alt=""></p>
