    <p>The sans underneath Pacifica looks like a smoothed out version of URW Metropolitaines inspired of the subway type of old Paris. At first I though it was just a secondary logo but this type is consistent across the entire product line.</p>
    <p><a href="http://www.myfonts.com/fonts/urw/metropolitaines/">http://www.myfonts.com/fonts/urw/metropolitaines/</a></p>
