    <p>Because the client uses Word to produce so much of their internal communications, it was determined that bringing in an "outside font" for body copy would be too complicated (and expensive). And so now I've been asked to choose a typeface from the Microsoft Office suite to pair with Sommet Rounded Black for their corporate identity (business cards, pamphlets, posters, etc.).</p>
