    <p>I was recently challenged to refresh a corporate identity for a mental health training organisation. The brand currently uses Arial (!) exclusively. Body copy, headlines. Everything. After a few blissful days of research, I came up with </p>
    <p>Gesta Regular<br>
    <a href="http://www.myfonts.com/fonts/r-type/gesta/" title="http://www.myfonts.com/fonts/r-type/gesta/">http://www.myfonts.com/fonts/r-type/gesta/</a> as a text typeface and</p>
    <p>Sommet Rounded Black<br>
    <a href="http://www.myfonts.com/fonts/insigne/sommet-slab-rounded/black/" title="http://www.myfonts.com/fonts/insigne/sommet-slab-rounded/black/">http://www.myfonts.com/fonts/insigne/sommet-slab-rounded/black/</a> for headlines. </p>
    <p>I was quite happy with this solution; the slightly quirky Sommet Rounded looks quite nice with the easy, friendly elegance of Gesta. Everyone loved this pair. Until we consulted with IT.</p>
    <p>Because the client uses Word to produce so much of their internal communications, it was determined that bringing in an "outside font" for body copy would be too complicated (and expensive). And so now I've been asked to choose a typeface from the Microsoft Office suite to pair with Sommet Rounded Black for their corporate identity (business cards, pamphlets, posters, etc.).</p>
    <p>I need a sans serif with a few different weights, and unfortunately, there isn't much choice. At this point, I'm thinking about choosing Segoe and calling it a day, but I'm wondering if anyone out there has an ideas.</p>
