    html: |-
      <p>Interesting about Franklin being the only font with multiple weights. Wonder what the story is behind that? Both Segoe and Calibri have regular and bold weights in InDesign, so as long as I, the designer, have access to these, I can leave the client with their Microsoft-generated weights for producing documents in Word. </p>
      <p>Riccard0, I did consider Calibri as a match for Sommet. It seems like a good pair, although I do hesitate to use a typeface that also happens to be the default for Microsoft programs. Sigh. It's the old argument, rehashed over and over again: Why can't clients see the value in individuating themselves through typeface choices? (Oh right, they all look the same anyway.) I am floored that I would be asked to create a distinctive identity for a brand using fonts so generic and overused they practically blend into the table.</p>
