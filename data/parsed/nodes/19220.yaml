    <p>In April, the graphic design studio <strong><a href="/wiki/Designiq" class="freelinking" rel="nofollow">Designiq</a></strong> launched a new English version of its website at <a href="http://www.designiq.eu" title="www.designiq.eu">www.designiq.eu</a>. As before, it provides all elementary information about the studio, while its portfolio section has been significantly extended, offering a number of new work examples accompanied by a commentary. It also presents a new News section.</p>
    <p>From larger recent projects, the website represents examples of new graphic design of Respekt weekly, of the book Móda / Fashion presenting the work of fashion designer Liběna Rochová, posters for the theatre festival Příští vlna / Next Wave, and many others.</p>
    <p><a href="/wiki/Filip%20Blazek" class="freelinking" rel="nofollow">Filip Blažek</a>'s graphic design studio was founded in 1997, in 2003, its name has been changed to Designiq. It focuses on two main fields of work — the design of logotypes and corporate identity, and the promotion of groups and institutions from cultural sphere. The studio employs degree-educated designers with extensive work experience. The website was designed by Filip Blažek and Radek Sidun, and it is powered by Vizus CMS system.</p>
    <p>Contact:<br>
    Filip Blazek<br>
    Designiq — Graphic Design Studio<br>
    Simackova 18, 170 00 Praha 7, Czech Republic<br>
    Tel. +420 283871781<br>
    E-mail studio(at)designiq(dot)cz<br>
    <a href="http://www.designiq.eu" title="www.designiq.eu">www.designiq.eu</a></p>
