      <p>Unfortunately the PDF didn't attached.<br>
      However, I could see the trickiness of MA on an oval path.<br>
      My suggestion would be to go with a typeface which offer a fairly square shape of A, either with rounded/squared top or with an additional crossbar on the top.</p>
