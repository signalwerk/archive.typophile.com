  html: |-
    <p>Hello all,</p>
    <p>For an ecommerce webproject, I am in need of a font for body text that combines well with the Tartine Script Black that is used for the type logo. </p>
    <p>Currently the website uses Arial, which in a way makes sense, but I am looking for something (web-safe) slightly less boring than that. I have looked around but could not find anything suitable. hence the question here, boiling down to:</p>
    <p>What font combines well with Tartine Script Black?</p>
    <p>Kind regards,<br>
    Anthonie</p>
