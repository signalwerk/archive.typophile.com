      <p>Hi Mariel,<br>
      what Patty and Michael said.</p>
      <p>Linotype Luthersche Fraktur? Nope. That’s what What the Font suggests, but it’s not. The NYT blackletter isn’t even a <a href="/web/20190927153920/http://www.typophile.com/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a>, strictly speaking. It’s a <a href="/web/20190927153920/http://www.typophile.com/node/13831" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Textura</a>.</p>
      <p>Check out English textura faces like Cloister Black or Old English. They will bring you much closer. Here’s an <a href="https://web.archive.org/web/20190927153920/http://typophile.com/node/15773">older thread about that style</a>.</p>
      <p><a href="https://web.archive.org/web/20190927153920/http://www.typografie.de/Unsere-Buecher/Typografie/Judith-Schalansky/Fraktur-mon-Amour::589.html">Fraktur mon Amour</a> is a great book. The second edition (enhanced, in German and English) is out now. Yes, it comes with a CD full of Blackletter fonts, for private and restricted commercial use. Fontblogger Jürgen Siebert made a <a href="https://web.archive.org/web/20190927153920/http://www.fontblog.de/picts/FrakturMonAmour.pdf">PDF chart [3.8mb]</a> that shows samples of all the 150 bundled fonts.<br>
      F</p>
