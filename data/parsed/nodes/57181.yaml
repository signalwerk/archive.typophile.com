      <p>Got it!  <a href="https://web.archive.org/web/20190927153920/http://new.myfonts.com/fonts/ephemera/temporal/regular/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Temporal Regular</a>!<br>
      It's a near-perfect match, but with clean edges.  I would be very surprised if there is a closer non-custom font.</p>
      <p>The clean-up is especially noticeable on the left serif on the right arm of the Y.  The biggest other difference I see is the shape of the little ornament on the vertical bar inside the T, changed from an arrowhead to a diamond.  Also, the flourishes have been enlarged and their curvature increased—look at the lower right of the h, the left of the N (top and middle), and the left of the Y.</p>
      <p>(Sorry for reviving, but this page hits high on Google, so I thought this might be useful to researchers like myself.)</p>
