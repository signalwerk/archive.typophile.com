      <p>There are a number of different New York Times blackletter fonts in use, particularly in the "T Magazine". Some of the differences among them are subtle, while some are fairly extreme. All of the fonts and designs are proprietary and created or adapted for the Times by Matthew Carter.</p>
      <p>1) FrakturSix-NYT<br>
         This is the font that's used for most of the captions and blackletter text in T-Style Magazine. It has a large character component with some limited punctuation characters. It includes lower case accented characters but none in the upper case. There are many character positions containing no glyphs, a faulty upper case "Z" that hasn't been fixed in four years, and a few alternate glyphs that look left over from the creation process.</p>
      <p>2) Fraktur NYT<br>
       Used sparingly, this has sharper corners, straighter lines, and heavier spurs than Fraktur-Six. Thus far, I've found only 24 lower case letters (missing j and q) and only 2 upper case letters (A and R). The "A" is strikingly different than the "A" in Fraktur-Six, with an ornament similar to that on the "N" of the nameplate.</p>
      <p>3)NYTimes-MagStyle Bold<br>
        Used ONLY for spelling out "The New York Times Style Magazine", and contains only the necessary characters.  I haven't found out about anything concerning the glyphs use in the rarely appearing "Real Estate Magazine".</p>
      <p>4) NYTimes-FourCapT<br>
        Contains a number of variants of the unique T Magazine "T" logo.</p>
      <p>Occasionally a font will appear with a name like "Fraktur-Eleven NYT" but these appear to be personally created versions of Fraktur-Six containing only a limited number of glyphs.</p>
      <p>The designs used for the newspaper's nameplate and New York Times Magazine are different from each other, and different from the fonts listed above.</p>
