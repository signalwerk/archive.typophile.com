    <p>Has anyone else noticed the beautiful blackletter typeface that is used in the New York Times Style Magazine? It is the best blackletter typeface I’ve come across in a long time but I can’t figure out what the name of it is, if its for sale, or if it was created specifically for the magazine. The only things I’ve uncovered is that the T logo itself was designed by Matthew Carter. I thought that maybe Carter designed the accompanying blackletter typeface as well but I’ve not been able to track it down. I have actually e-mailed the New York Times asking about the name of the typeface, but of course they haven’t answered back. Any clues, suggestions, answers would be helpful. Thanks.</p>
    <p>-Mariel</p>
    <p>Link to T Magazine: <a href="https://web.archive.org/web/20190927153920/http://www.typophile.com/node/57181" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">http://</a></p>
    <p>P.S. I've had one person answer and say that it is called NYT-FrakturSix, but I can't find that font for purchase or download and that is what I am interested in doing.</p>
