    html: <p>Could be, but my 1920 Linotype specimen book doesn't show old style figures for Antique No. 1 whereas Antique Old Style (the one shown in Jaspert) has them. It would be helpful to see the italic--Antique Old Style has a cursive italic, similar to Century Old Style, while Linotype's Antique No. 1 has a slanted italic, like Bookman.</p>
