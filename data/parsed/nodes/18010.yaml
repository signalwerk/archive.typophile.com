    <p>Hi all,<br>
    This font, which is pretty similar to New York is puzzling me because it was used in 1914 and, of course, NY didn’t exist. Any ideas? It had bold and italics as well, which NY doesn’t have. Seems like it should be really easy for some of you…<br>
    Best<br>
    Robert</p>
