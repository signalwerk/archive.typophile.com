    html: |-
      <p>For what it's worth, if you want another vote, I just looked at an old Linotype book to see if that looks right, and I agree that Antique No. 1 is very close. The weight and letterforms look just about right. The clincher would be to see the R, because Antique No. 1 has an odd leg on the R that thickens toward the baseline, without much of a serif, unlike the Antique Old Style in Jaspert..</p>
      <p> - Mike Yanega</p>
