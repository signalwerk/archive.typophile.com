      <p>HI...thanks for all the great comments! </p>
      <p>After careful consideration I found Century Old Style to be the closest I could purchase commercially and indeed I had it on my machine as it comes with CS2. I tried that fancy-dancy super-duper online font id'er using my loupe on the characters but it wasn't very helpful as it turned out some bizarre results. Perhaps it just can't deal with such old fonts.</p>
      <p>Anyway, I think that COS is pretty darn close and will have to do for this project. </p>
      <p>Thanks again for all your help. Great suggestions and I learn lots everytime I come here!!</p>
      <p>Best,<br>
      Robert</p>
