    html: |-
      <p>There were only 6 letters in the sample that I could use in the <a href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" target="new" rel="nofollow">Serif Font ID Guide</a>:  (a, b, e, g, y and W) . With those I came up with 39 fonts, including Bruce Old Style, several Century versions, some Caslons, several Bookmans, including Phemister's original from 1860, Old Style No. 7 and a scattering of other faces too modern to be considered. If you could show a sample with a few more of the Guide's Key letters (such as E, J, K, M, R and U) the results could be narrowed down much more. As Mark suggested this could be something that has no perfect current match, but you might see something that would be hard to tell from it without precise comparison.</p>
      <p>(Unfortunately, the Guide is still in work, and we are still making sample images, but the names of fonts meeting the key characteristics are shown with the design, foundry and date information.)</p>
      <p>- Mike Yanega</p>
