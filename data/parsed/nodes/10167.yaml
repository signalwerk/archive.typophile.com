    html: "<p>Since nobody, other than Didot, has figured out how to make his types work in text (one reason being that the digital revivals are all based on display models, not text models), why not use one of only three Didone types that actually do work in text? These are, Lange's Bodoni Old Face, Stone's ITC Bodoni, and Berthold's Walbaum STANDARD, a text font not to be confused with Berthold Walbaum BUCH which, in spite of its name, is a display font. I think all of these faces have small caps. In any case, the problem isn't having small caps. The problem is having a text font that actually works as a text font. Oh - and of course - the obvious digital choice for a Didone with a thousand bells and whistles: Kepler MM, with three unbelievably extensive axes (weight, width, optical size). Though I can't really say I like it, and although I don't think the optical axis has been well-implemented, and although it is of course a Didone rather than a Didot, it cannot be gainsaid that Kepler is the most flexible digital font ever made. It is less like having a typeface, more like having an entire type library. If you don't have a problem with the fundamental design, there is not a conceivable composition problem that it cannot solve.  <br> <br>Finally I must say that the single ugliest bit of typography I have ever seen in my life was an issue of Serif magazine set in Hoefler Didot. Maybe there's a way of using it in text that works adequately, but if there is, Don Hosek sure didn't find it. <br> <br>It is interesting that an easily usable text Didot (as opposed to a Didone) has never been revived in the entire history of type. That shows how difficult it is, and that it simply isn't an appealing task for designers and manufacturers. Didot's own text types are much more readable than anything we have seen revived but, looking at them, it is difficult to summon any great enthusiasm when his followers such as Bodoni, Walbaum, Prillwitz (whose work has been revived in a still very rare digital font) and the English school, have done such a much better job with text. Nevertheless, this remains an interesting unfilled gap. (I am sorry to speak of Didot as if there were only one but it is convenient to do so; in fact it is a dynasty with several key players and several different punchcutters with unique styles producing a wide range of continuously evolving and disparate designs from roughly 1780 to 1830.)  <br> <br>The Didot type usable at text sizes that I have been designing for a million years, without yet actually releasing, would not be describable as a Didone type, but as a French oldstyle-based transitional. In any case, it has never been a straight revival. There is a real need, especially in French publishing, for a usable text face that looks like a Didot but acts, as to legibility, like a Jannon. <br> <br>Somewhere I have a version of Adagio Didot that I attempted to optimize for text. It is stiff, amateurish and unconvincing in my opinion. But anyone who wants to have a look at this embarassing thing just has to email me. At the very least, it illustrates some of the problems of the genre. Isn't it strange that Frutiger didn't figure a way out of this problem? I wonder what the type was really intended for. Perhaps I haven't adequately studied it.</p>"
