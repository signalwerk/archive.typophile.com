    html: <p>Mark, re. Diderot, I have a set of pages from two sections (writing and alphabets), and can check the type used. I'll upload some photos shortly. If I recall correctly, the Diderot was not set in a romantic (Didone) type, although obviously there is a cultural relationship between the rationalisation of knowledge and the rationalisation of type design. <br> <br>At the 1998 ATypI in Lyons, I spoke about Fournier's cataloguing of non-Latin writing systems in his Manual*, and likened it to Diderot's project. Cataloguing and organising knowledge -- even dubious knowledge, such as the supposed angelic alphabet -- was very much the programme of the day. <br> <br>* Most of Fournier's examples (woodblocks, not type) originate with the Breitkopf foundry in Leipzig, a reminder of the longstanding international nature of the type business. Thanks to James Mosley for bringing this to my attention.</p>
