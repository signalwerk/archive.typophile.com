    html: <p>Absolutely stunning, and simply fascinating to see the two styles in juxtaposition! <br> <br>Based on what I see here, I could perhaps achieve a similar effect with Monotype Fournier (that f especially, also the b, p, q, v and others; but not the g, alas), which I already have, for the text. Since none of the digital moderns I can find online closely replicate any of these engravings, I suppose the door is open simply for something harmonious in the modern vein, for any ancillary material. <br> <br>Ah, what fun. You and Bill and Tiffany have given me much to think about. Thank you so much for taking the time.</p>
