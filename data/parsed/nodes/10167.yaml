    html: "<p>Mark, a truncated version of my ATypI 1998 paper is available in the member section of the ATypI website; however, this does not include the discussion about Fournier's cataloguing of non-Latin writing systems, which was introductory to my main topic, included as an historical parallel to the research project I had been doing for Microsoft that year. <br> <br>Here are the Diderot images though. As I remembered, Diderot did not set his encyclopaedia in romantic types of the Didot/Bodoni manner, but in more established baroque types: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69486.jpg\" alt=\"Diderot 1\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69487.jpg\" alt=\"Diderot 2\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69488.jpg\" alt=\"Diderot 3\"> <br> <br>Where the romantic style of lettering does appear is in the engraved plates, but remember that this is not type: the lettering is engraved in the plate. Of course, engraved lettering had a huge impact of the development on both neo-classical and romantic type design (Baskerville had been an engraver, and Bodoni was a writing master in the newly fashionable split-nib styles, still called 'copperplate' in Britain and North America in acknowledgement of its engraved origins). <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69489.jpg\" alt=\"Diderot 4\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69490.jpg\" alt=\"Diderot 5\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69491.jpg\" alt=\"Diderot 6\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69492.jpg\" alt=\"Diderot 7\"> <br> <br>Nowhere is this more evident, of course, than in the plates for <i>l'ecriture,</i> where the fashionable romantic styles of writing are the only forms illustrated. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69493.jpg\" alt=\"Diderot 8\"></p>"
