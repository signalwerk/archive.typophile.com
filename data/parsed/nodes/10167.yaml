    html: |-
      <p>Here  at <a class="freelinking external" href="http://johntranter.com/00/fournier.html" rel="nofollow">http://johntranter.com/00/fournier.html</a><br>
      are three samples of various ways of typesetting a nineteenth-century French poet, Arthur Rimbaud. After a preamble concerning Fournier, there is an image of a scan of page 218 from Oliver Bernard’s excellent translation of Rimbaud’s Collected Poems. It was originally set by Clays Ltd, Bungay, St Ives, UK, in Monotype Fournier in 1965. The proofs were photographed and printed photo-litho. </p>
      <p>Then a modern setting of the same text in digital Fournier. Note how anaemic the font appears. </p>
      <p>Then the same text set in Corundum, a font cut by Joshua Darden in Brooklyn USA. The font has issues with InDesign, as it is not a fully OpenType font, but it works. </p>
      <p>I hope this helps. </p>
      <p>John Tranter, Sydney</p>
