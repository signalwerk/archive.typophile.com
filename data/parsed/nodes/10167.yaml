  - id: 64559
    user: 4019
    date: 2005-04-08T17:18:00
    date_raw: 8 Apr 2005 — 5:18pm
    votes: null
    html: <p>John is right to bring up Fournier for at least two reasons. First, there are some wonderful historical types there. Second, there is the issue he touches on indirectly, that it is not necessary, as to historical correctness, to set a book in a type exactly contemporaneous with its publication; it can easily and appropriately be set in one from say fifty years before. Mixtures of type shouldn't be out of the question either. For example, F.A. Didot &amp; his collaborators created some extraordinary transitional types, but they were always rather large, 14 points at least. If a book set in these types also required a smaller type, Didot would use Jannon. This is hardly ideal, but it was certainly practised. (Fournier would have actually been a better choice than Jannon, one must say! But the Didots were terrible misers, it seems, and perhaps it would have cost too much.) <br> <br>As to Fournier, there is no adequate digitization, and one is needed. However, given the excellence of Monotype's metal revival, which is especially impressive in the smallest sizes (the 8, or is it the 9 point? is absolutely gem like, a miracle of precision, readability and beauty, much more impressive than the larger sizes in my view), why not use that if the budget allows? There are some printers who can still do this, and the price might be surprisingly reasonable. It is hardly a seller's market. <br> <br>Mark, you are right, it is astounding to handle these gems of 18th century French printing, which seem to leap from the page. The brilliance of the bookwork is often astounding to this day.  <br> <br>Yet much of this richness and impact can be achieved today by the simple expedient of employing a printer with a monotype. And just think - you won't have to worry about kerning, and bogus optical kerning systems. You just have the type.  <br> <br>I really don't know why type enthusiasts don't focus a little more on throwing work the way of the printers who still use mono and linotypes. Can it be that few of us have any actual publishing projects? If so, one wonders, why on earth are we so interested? Isn't the final goal of it all to produce beautiful books?</p>
