    html: <p>I have the small specimen in Talley of Types, but I don't think it's really that good, and in any case I have lent the book to someone. The main difference is that it is slightly heavier than Fournier. I honestly think the 1970s Talley is overinked and does not show any of the MT types at their best. I realize that is a little heretical, but .... I also honestly think the best MT sizes are generallly in the 8-11 range, and then in the above 36 pt range. Anyway, there must be a better sample of Barbou than what I have. If I recall correctly, it was only cut in one size. Looking again at one of my favourite books set in Fournier, 'The Contemplative Life' by Sister Edna Mary, Penguin, 1968 (which is incidentally the first (and for that matter the only) book I have ever read to suggest that the Redeemer was clearly bisexual, a claim which for some reason raised no fuss at the time), I see that the thinness does cause colour and fitting problems. It becomes clear why revival is such a difficult task. One understands why MT had so much trouble with the digital revival, and left it until quite late, why Typoart made so many changes in its interesting adapatation, and why Carter started out with the assignment of making a Fournier revival and somehow wound up with Charter instead. Although I like Fournier's weight, I can now finally see why 'Barbou' would have been much easier to deal with and a better starting point. I can now finally understand Stanley Morison's point. There are so many Fournier types - is the Diderot one of them? It seems well within that style - post Romain du Roi, more practical, etc. However, the italic of Fournier is a straight copy of the italic of Romain du Roi as we all have posted a hundred thousand times in the past. So much for collective wisdom and the continuity of community. James Mosley had to print a book in digital Fournier and was unhappy; I attempted to revise it for him but was not successful - at that time I had some idea there was a problem but no clue as to what was really wrong, and James was not particulary good at explaining what was wrong. He just knew it was unconvincing. I do think the text type you show is too loosely fitted. I am not suggesting you do this, as it would be agony, but it would be so interesting to see a few lines of text in which one did some meticulous splicing to decrease the spaces slightly.</p>
