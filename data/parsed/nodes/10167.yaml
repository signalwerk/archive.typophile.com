    html: <p>About favorite books typeset in Fournier, you might for fun check to see if your local bookstore has a hardcover copy of Precarious Life, by Judith Butler (Verso, 2004, ISBN 1-84467-005-8), which I purchased solely for the beautiful type - a combination of Fournier text and ITC Franklin Gothic headings. Personally, I would prefer to read more books in Fournier and fewer in Baskerville, but that's just my particular heresy. <br> <br>As for my experiment in Monotype Fournier, so far it really seems quite crisp and workable in comparison with many other historic fonts in my digital library. And it even has small caps. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
