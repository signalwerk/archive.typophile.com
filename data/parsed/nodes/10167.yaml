    html: <p><i>Can anyone tell me when small caps became a regular fixture of the typographic landscape?</i> <br> <br>Smallcaps were very definitely part of the typographic landscape by the time of the Didot and other romantic types of the later 18th and early 19th centuries. <br> <br>Margaret M. Smith wrote an excellent essay for the Printing Historical Society journal (No.22, I think), on the 'pre-history' of smallcaps, tracing their development in early renaissance printing, beginning with the use of caps from smaller fonts, and progressing to properly designed smallcaps as we know them.</p>
