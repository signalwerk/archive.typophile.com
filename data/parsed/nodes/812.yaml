    html: "<p>The main problem in this nice font, is that the counters follow too much forms. The horizontals of the n, m, h and b, d, p etc. are really toooo light. The lower part of the a don't follow enough the usual way to connect u for example. You've designed mainly a vertical typeface and miss that horizontals exist too., connections between horizontals and stems are a key part in typeface design. really. <br> <br>To see more what I wrote, check the usual suspects: Galliard, Adobe Garamond, Sabon Next, Palatino, Apolline, etc.</p>"
    html_clean: "<p>The main problem in this nice font, is that the counters follow too much forms. The horizontals of the n, m, h and b, d, p etc. are really toooo light. The lower part of the a don't follow enough the usual way to connect u for example. You've designed mainly a vertical typeface and miss that horizontals exist too., connections between horizontals and stems are a key part in typeface design. really. <br> <br>To see more what I wrote, check the usual suspects: Galliard, Adobe Garamond, Sabon Next, Palatino, Apolline, etc.</p>"
