    html: |-
      <p>Hi All.  <br> <br>Here's a third version. I've done the spacing and some kerning. Also, I revisited the shapes. Previous versions still showed too much up and down movement -- not enough horizonal. I've reworked the branches and bowls to give more emphasis to the horiz/vert. transition of the curve (see the diagram in the pdf -- blue is old, black is new). In addition, I exaggerated the angle of the break to keep the character of the old sets despite the thicker horizontals. <br> <br>I'd love some of the experienced text folk to give me some feedback at this point. It seems much improved to me, but i value your opinions. <br> <br>Would you set long text in it? If not, why not. <br> <br>Thanks, <br>Randy <br> <br></p>
