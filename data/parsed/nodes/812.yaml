    html: "<p>Randy: I don't mind discord in a font as long as it is done purposefully and consistently. I agree with Hrant, between those two options, I would sharpen the joins. This, to me, is what makes the font interesting. But how far do you go with it? If the beak terminal does not work on the other letters, perhaps you should modify the \"a\" so they are consistent? Another thought: perhaps the angles could be slightly more obvious? (see below...it was easier to show than describe) <br> <br>Angled on the top stroke, slightly rounded on the bottom. Just a thought... <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13767.jpg\" alt=\"\"></p>"
