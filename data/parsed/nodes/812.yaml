    date_raw: 6 Aug 2003 — 5:23pm
    votes: null
    html: <p>I really like this too. <br> <br>For some reason, it makes me think of an angular version of Poppl Pontifex (<a href="http://www.identifont.com/show?U6" target="_blank">http://www.identifont.com/show?U6</a>), although it really is quite different in many respects. <br> <br>The only thing I might suggest so far is to try thinning the join of the lower-case "a" where the bottom of the bowl meets the main stem above the tail. It looks a bit dark there, and might clog up a bit at smaller sizes, or at least muddy up a bit. That might help alleviate the "flat tire" look that Kris mentioned. <br> <br>I'd also apply the same aesthetic that you applied to "hamb" above to all of the curves. The lower-case "f", "t" and "s" seem to want similar treatment. <br> <br>Nicely done. This will be a font to watch. <br> <br>David</p>
    html_clean: <p>I really like this too. <br> <br>For some reason, it makes me think of an angular version of Poppl Pontifex (<a href="http://www.identifont.com/show?U6" target="_blank" class="link-external">http://www.identifont.com/show?U6</a>), although it really is quite different in many respects. <br> <br>The only thing I might suggest so far is to try thinning the join of the lower-case "a" where the bottom of the bowl meets the main stem above the tail. It looks a bit dark there, and might clog up a bit at smaller sizes, or at least muddy up a bit. That might help alleviate the "flat tire" look that Kris mentioned. <br> <br>I'd also apply the same aesthetic that you applied to "hamb" above to all of the curves. The lower-case "f", "t" and "s" seem to want similar treatment. <br> <br>Nicely done. This will be a font to watch. <br> <br>David</p>
