    html: <p>I've been agonizing over the <b>a</b> for some time now. It was the original sketch that triggered this whole project, squarish-ness and all. I've rounded the bowl and you're right. It's better :-)  <br> <br>I've also been working over the e and the c. They both feel awkward -- like they're not sure if they're oldstyle or modern. Also on the e, i've been toying with a diagonal bar ala Berkeley. The nice part about this is that it keeps the hard diagonal theme i have working in the a, b, d, g,h, m, n, p, q, r, s ... we'll see. <br> <br>I'll post up a new pdf tomorrow -- Randy</p>
