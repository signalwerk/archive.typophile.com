    date_raw: 27 Aug 2003 — 5:39am
    votes: null
    html: "<p>Apolline, Berkeley too. <br> <br>Anyway to answer to the question about asymetric in serifs: <br>\"Is this treatment left over from a serif drawn in one   <br>motion with a flat tipped pen?\" <br> <br>Yes, the form came from a study of the ductus produced by the broad edge pen when doing the terminals. But, as there is various interpretation how humanistic letters has been done at serif level, their his place for infinite variations. <br> <br>I like particular the \"ecce hereditas Domini\" typeface done by Noordzij as illustration of his essay called 'The truth about the serif\" published in letterletter dating back the end of the eighties for ATypI. <br> <br>You can access again to the reprint of his texts published in lettereletter in a book of the same title published by Hartley and Marks in 2000.</p>"
