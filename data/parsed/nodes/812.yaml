    date: 2003-09-24T12:10:00
    date_raw: 24 Sep 2003 — 12:10pm
    votes: null
    html: <p>At 1200x1200 dpi <br> <br>Sabon at 6pt <br>Outlines version looks like a semibold version of the hinted text. Outlines are still crisp and well defined (you could id it as sabon), tight counters (lc e) still well open. <br> <br>Sabon at 9pt <br>Outlines version looks marginally darker than the hinted text. <br> <br>Sabon at 12 pt <br>Very very slight difference. <br> <br>Don't know if this is a good test or not? <br> <br>Cheers, <br>Randy</p>
    html_clean: <p>At 1200x1200 dpi <br> <br>Sabon at 6pt <br>Outlines version looks like a semibold version of the hinted text. Outlines are still crisp and well defined (you could id it as sabon), tight counters (lc e) still well open. <br> <br>Sabon at 9pt <br>Outlines version looks marginally darker than the hinted text. <br> <br>Sabon at 12 pt <br>Very very slight difference. <br> <br>Don't know if this is a good test or not? <br> <br>Cheers, <br>Randy</p>
  - id: 5931
    user: 1250
    date: 2003-09-24T12:58:00
    date_raw: 24 Sep 2003 — 12:58pm
    votes: null
    html: "<p>It's a good test, although somewhat predictable: assuming your printer isn't out of whack, outlines will gain half a pixel (on average, of course - since it's binary) in size when converted to outline. This is because of different rendering algorithms within Postscript - not smart, Adobe - unavoidable? <br> <br>On a 600 dpi laser outlines will gain twice as much as on a 1200, so the 12 comparison would be like your 6, and you'd have to go to 24 to get \"Very very slight\". <br> <br>The best test would be somewhat subjective: figure out at what PPEM most people can't tell the difference between a real font and outlined text. <br> <br>hhp <br></p>"
    html_clean: "<p>It's a good test, although somewhat predictable: assuming your printer isn't out of whack, outlines will gain half a pixel (on average, of course - since it's binary) in size when converted to outline. This is because of different rendering algorithms within Postscript - not smart, Adobe - unavoidable? <br> <br>On a 600 dpi laser outlines will gain twice as much as on a 1200, so the 12 comparison would be like your 6, and you'd have to go to 24 to get \"Very very slight\". <br> <br>The best test would be somewhat subjective: figure out at what PPEM most people can't tell the difference between a real font and outlined text. <br> <br>hhp <br></p>"
