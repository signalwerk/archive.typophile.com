    html: <p>Hrant, thanks for the explanation, makes sense.  <br> <br>Tom &amp; Hrant. sharp + round = discord.  <br>Yep I detected that but was hoping it might be ok. The  <br>slight roundings are mostly noticed at the break in the  <br>bowls which Tom saw, but also in the f, t, c and r. The  <br>sharp corners are most pervasive in the serifs (which I'm  <br>not totally thrilled about). <br> <br>a) round the serifs? <br>b) sharpen the joins? <br> <br>This has some garamondation to it which makes me lean  <br>toward rounding the serifs. Not sure though. Shorter  <br>decenders it is.  <br> <br>Tom, tried the a-style beak terminal on the s, c , f and r. It  <br>hurt legibility bigtime. But I don't want to lose it in the "a"  <br>as it's one of my favorite parts.  <br> <br>Thoughts on the g? I like how it keeps that nice angular  <br>rythm, but not sure about how it looks up next ot a foot  <br>serif as in "-ing." <br> <br>Randy</p>
