    html: "<p>I've taken your advice claudio and printed, going back to  <br>the pencil (started there too!) With certainty, the next  <br>incarnation will not be quite as condensed (this is definitely  <br>helping the horizontal flow). Plus I am reworking the serifs. <br> <br>I've been fooling around with an assymetrical serif--  <br>bracketed on the left, not on the right. The reasons I like it  <br>are: <br> <br>1) It seems to drive the type forwards <br>2) It has some of the sharp round discord found elsewhere. <br> <br>However, I see those same serifs (ok, not exactly exact!) on  <br>two recent postings in the serif forum, Quetzal and  <br>Bertrand (both super by the way). I don't know the history  <br>of this form, or how unusual this treatment is, I hadn't seen  <br>much of it in mainstream fontland. If there's a history  <br>lesson coming, I'd love to hear it... <br> <br>Please tell me: \"One of the old/dead guys thought this up  <br>long ago and it pops up from time to time, so don't get  <br>worked up about going there.\" <br> <br>- Is this treatment left over from a serif drawn in one  <br>motion with a flat tipped pen? <br> <br>- What are some other fonts that have this kind of serif? <br> <br>Thanks, <br>Randy</p>"
