    html: "<p>Looking at the PDF, my only problem is that you're using both <br>totally sharp corners and slightly rounded corners: discord. <br> <br>Linguistics: The Latin alphabet (when used for most languages, and particularly English) uses the vertical Cartesian space in different proportions in terms of ascender, x-height and descenders. The x-height conveys the greatest chunk of information to the reader, and the descenders almost nothing. You still have to balance that against the importance of diverging boumas, but irrespective of the proportion you give to the x-height/ascender ratio, the descenders have to be notably shorter than the ascenders. In a real text face. <br> <br>hhp <br></p>"
    html_clean: "<p>Looking at the PDF, my only problem is that you're using both <br>totally sharp corners and slightly rounded corners: discord. <br> <br>Linguistics: The Latin alphabet (when used for most languages, and particularly English) uses the vertical Cartesian space in different proportions in terms of ascender, x-height and descenders. The x-height conveys the greatest chunk of information to the reader, and the descenders almost nothing. You still have to balance that against the importance of diverging boumas, but irrespective of the proportion you give to the x-height/ascender ratio, the descenders have to be notably shorter than the ascenders. In a real text face. <br> <br>hhp <br></p>"
