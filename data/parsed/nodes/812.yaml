    date_raw: 24 Sep 2003 — 11:48am
    votes: null
    html: "<p>g: doesn't have to be vertical (and certainly not a Goudy horn), but I think making it more of a \"clockwise\" curl going above the x-height would be better. <br> <br>j: I don't do pens. :-)  Aesthetically it just seems to need something at the end of the terminal, instead of the wimpy tapering. Strong terminals on extenders help readability too. <br> <br>-- <br> <br>&gt; compare a paragraph with and without type converted to outlines. <br> <br>So what was the result? <br>And I <i>will</i> be waiting for the lino comparison!  :-) <br> <br>hhp <br></p>"
    html_clean: "<p>g: doesn't have to be vertical (and certainly not a Goudy horn), but I think making it more of a \"clockwise\" curl going above the x-height would be better. <br> <br>j: I don't do pens. :-)  Aesthetically it just seems to need something at the end of the terminal, instead of the wimpy tapering. Strong terminals on extenders help readability too. <br> <br>-- <br> <br>&gt; compare a paragraph with and without type converted to outlines. <br> <br>So what was the result? <br>And I <i>will</i> be waiting for the lino comparison!  :-) <br> <br>hhp <br></p>"
