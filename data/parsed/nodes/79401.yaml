    <p>Hi,</p>
    <p>I'm new to this site so apologies if I'm posting this in the wrong area. </p>
    <p>Some of you might be interested in a project I recently launched on&nbsp;Kickstarter.com&nbsp;called LetterMpress.</p>
    <p>It's a virtual letterpress for the iPad. It features authentic wood type and a Vandercook proofing press.&nbsp;</p>
    <p>I've included some screen shots. </p>
    <p>Here is the link to the project page:<br>
    <a href="http://kck.st/fSeL3B" title="http://kck.st/fSeL3B">http://kck.st/fSeL3B</a></p>
    <p>Thanks!</p>
