      <p>Hand lettering in the style of the era. Note the variations in repeating letters.<br>
      The beaked terminals on _T_ and  _S_ are distinctive, but are found in some fonts of the 1900s. Also with _E_ similar to the title. For example check the fonts at Greater Albion Typefounders <a href="http://www.myfonts.com/foundry/Greater_Albion_Typefounders/" title="http://www.myfonts.com/foundry/Greater_Albion_Typefounders/">http://www.myfonts.com/foundry/Greater_Albion_Typefounders/</a> and you might find something you like. Note the similarities with Bonning, Bonaventure and Vertrina.<br>
      Other similars include Canada Type's Ronaldson <a href="http://www.myfonts.com/fonts/canadatype/ronaldson/" title="http://www.myfonts.com/fonts/canadatype/ronaldson/">http://www.myfonts.com/fonts/canadatype/ronaldson/</a> and Intellecta's Benjamin Franklin   <a href="http://www.myfonts.com/fonts/intellecta/benjamin-franklin/" title="http://www.myfonts.com/fonts/intellecta/benjamin-franklin/">http://www.myfonts.com/fonts/intellecta/benjamin-franklin/</a><br>
      Don</p>
