    date_raw: null
    votes: null
    html: <p>Ishtu, as I recall, means what it sounds like (almost) -- it is a stew, but I don't recall the language (Hindi?). Xergis escapes me, but I found all of these in books I had around the kitchen.  I used foods and spices, because I thought everyone could relate to them.  <br> <br>They were also chosen to use every lower case letter at least twice, at the same time that each upper case letter was used for the 26 words. <br> <br>I will see if I can find the references again, or get a definition for those two.</p>
