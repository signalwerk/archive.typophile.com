    html: <p>Interesting deduction. <br> <br>I found 'Xergis'. It was in the index of 'The New Laurel's Kitchen' by Laurel Robertson, et al. It seems Xergis is a cold soup made with cucumbers, scallions and yogurt, with some spices. She says it is a 'Levantine beverage', so that tells me it comes from the the Eastern Mediterranean (Turkey, Syria, Lebanon &amp; Israel) <br> <br>The same book also had Ishtu. It's a 'South Indian dish that is almost a sauce' that is served over rice. I also found a dish (on the web) called Kozi Ishtu that was translated as Chicken Stew -- that's where I got the stew idea. <br> <br>Boy, do we digress, or what??</p>
