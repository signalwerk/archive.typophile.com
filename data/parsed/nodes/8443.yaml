  html: '<p>Buffalo, NY January 3, 2005 <br> <br>P22 type foundry is proud to announce that the first fonts of its newest division, The Lanston Type Company, are available for download. Since acquiring the Lanston Type Company in November 2004, P22 has been busy at work re-mastering the fonts and is now unveiling  "Lanston Collection A".  <br> <br>The first selection features the designs of Dave Farey, Sol Hess, Gerald <br>Giampa, Frederic W. Goudy, Robert Granjon, Jim Rimmer, Bruce Rogers, and <br>Edwin Sharr and include  fonts such as Bodoni 26, Bodoni Bold, Deepdene, <br>Flash, Fleurons, Garamont, Goudy Thirty, Jacobean Initials, Pabst and <br>Spire. Many of the Lanston digital faces were digitized from the actual <br>metal patterns that were used to make the master punches from which the <br>type was originally cast. The addition of OpenType allows for expanded font <br>character sets as well as alternates and ligatures. The fonts can be found <br>at our newly designed url:  <br> <br><a href="http://www.p22.com/Lanston" target="_blank">http://www.p22.com/Lanston</a> <br> <br>As a division of P22, Lanston Type joins the International House of Fonts <br>(IHOF) and the Sherwood Collection as a distinct component of the P22 <br>company. The historical focus of the P22 font collections and the colorful <br>history of the Lanston Monotype company offer a combined resource suitable <br>for a wide variety of design solutions and is one of the most diverse <br>available in the market today. P22 will be announcing periodic releases <br>along with introductory special pricing throughout 2005.</p>'
