      <p>As I understood from a presentation by Thomas Phinney, it is essentially producing a new glyph that averages the distances between points on two related glyphs--they need to have the same start point and number of nodes. The interpolation doesn't just have to be a 50/50 average, but can be 90/10 or whatever you want. You can also extrapolate.</p>
      <p>There are two things most available for doing this, the MM technology in FontLab, and Superpolator, which has additional capacities. </p>
      <p>Your can read more here (scroll about half way down the thread):</p>
      <p><a href="http://typophile.com/node/39965" title="http://typophile.com/node/39965">http://typophile.com/node/39965</a></p>
