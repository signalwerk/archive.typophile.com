      <p>That's why, when we began using Ikarus, and later tools, we started by digitizing our french curves, (and our scales). :)</p>
      <p>"adding a stroke to obtain bolder weight - is this the process most people use ?"</p>
      <p>FontLab is unkind to the original, sacred, points of a digitization, when "bolding" or "stroking" is used. To avoid the process of tediously having to go back through a sacred digitization, now polluted, to look 'under' every point, pan and zoom repeatedly in a hunt for FontLabs destructive ways, for me at least, is usually more time consuming than a careful, manual, bolding, or blackening, if in the end, blending, or interpolation, is required. </p>
      <p>Cheers!</p>
