    html: |-
      <p>The old saying "There is no such thing as a free lunch" comes to mind. If something can be done as easily as a push of a button, the odds are, it will do as much harm as good. The bigger the amount of bolding, the worse the mess will be to correct. If you must use the automatic feature, just paste it in the mask layer and make your drawing fresh in the glyph window. Feel free to ignore 95% of what the auto bold thing did. As David said above, the mess is mischievous and sneaky. It is kind of like buying a Rollex from a street vendor in Manhattan. It seems like a sweet deal untill the next day :-)</p>
      <p>ChrisL</p>
