    html: |-
      <p>"So Interpolation is the process of creating a medium weight from a Light and a bold weights ?"</p>
      <p>In a way, yes, but it is not just limited to changes in weight. Slant is another derivation but that gets trickier. You can have a slanted font and an upright font and interpolate something in-between but you must have compatible outlines to work with.</p>
      <p>Interpolation is finding an intermediate step between to known axis extremes with compatible outlines. Extrapolation is attempting to determine an instance which is beyond either of the known extremes and projecting what it might look like if the same rules were followed as with interpolation. With extrapolation, the odds of failure to make a reasonable image is higher and that failure rate grows with the greater distance beyond the known axis increases. If I attempt to create an instance of semi-bold between the known forms of light and bold, I have quite a good chance of success with minimal correction. If I try to determine an instance of an extra-bold from those same 2 light and bold known originals, my success rate will be somewhat less. Then, if I use the same pair to try to determine an extra black instance, my odds of success become even less likely and I will surely need much adjustment to make a tolerable looking Extra Black. As Tiffany said, fine tuning is important. With extrapolation the tuning is more than fine and requires much work. There is a point of diminishing returns where the corrections overcome the value in extrapolation.</p>
      <p>ChrisL</p>
