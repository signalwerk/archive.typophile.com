      <p><em>It just occurred to me: Rachel were you maybe asking about the interpolation tool in Font Lab</em></p>
      <p>I also wondered that, but the basic principle of interpolation is the same: for any two or more elements in a design space it it possible to interpolate intermediate elements. So, for example, one can interpolate between two weights of a typeface design to derive a new weight (as in a Multiple Master font), or one can interpolate a section of an outline or even a single node relative to changes in the position of other sections or nodes (the latter is what FontLab's 'Interpolate Nodes' tool does).</p>
    html_clean: |-
