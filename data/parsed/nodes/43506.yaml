      <p><em>So Interpolation is the process of creating a medium weight from a Light and a bold weights ?</em></p>
      <p>Yes. Which is why it makes sense to create the extreme weights in a type family first, and interpolate all the others from these.<br>
      In particular, the Thin in a sans serif is a good starting point, as all you have to do is draw a path and apply a stroke width.</p>
