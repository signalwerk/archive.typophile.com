      <p>Here are 2 quick samples. There was no adjustment made before or after so the results are not as good as could be.<br>
      The first example shows a range with 2 axii,  regular and bold. Between them (on the 2nd line marked demibold) is an interpolation with some need of fixing but still tolerable as a beginning point. The last line, as extrabold, is extrapolated and obviously in need of much more fixing. It looks better than it really is onscreen in low rez but don't let that fool you.<br>
      The second image is a blowup of the "a" from the extrabold extrapolation. Notice where the curves have flipped on eachother and caused overlaps? This example is not even extreme It is only 50% above the axis. If I went to Extra Black, it would look far worse. This is as far as FontLab will go though so I can't show you the really bad one.</p>
