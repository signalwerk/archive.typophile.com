    html: |-
      <p>Hi Rachel,</p>
      <p>Interpolation is essentially the same as creating a mix drink:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lisbon2006_Ahrens-6_4083.jpg"></div><p></p>
      <p>To create your cocktail (c) you would typically pour in a certain quantity (q) of drink 1 (d1) and then fill up the rest of the glass (1-q) with drink 2 (d2).<br>
      So: GinTonic = q Gin + (1-q) Tonic.</p>
      <p>Interpolation of fonts works in exactly the same way. Even the formula is the same, only it is applied to the node coordinates. You mix two flavours and what you get in the end is something that, ideally, feels like somewhere in between. Unfortunately, extra light mixed with extrabold does not feel the same as a real regular just like water plus brandy does not taste like wine even though it may have the same "weight". I hope this analogy helps to understand the issue.</p>
