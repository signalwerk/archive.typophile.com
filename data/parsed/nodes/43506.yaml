      <p>I was interested in how effective FontLab would be at interpolating, and tried using it on a font I've recently started. You can see the pdf at <a href="http://www.typophile.com/node/37639" title="www.typophile.com/node/37639">www.typophile.com/node/37639</a>. It's the one called Eternal Sample, where I've started from the Regular and Extrabold and interpolated the three weights in between. I hadn't touched the results, so that gives an idea exactly how good it is. There's one glitch on the semibold y, but otherwise just needs fine tuning. I didn't purposefully place nodes knowing how that would affect interpolation.<br>
      The font has now gone in a different direction so I'll redo these at some point.</p>
