  html: |-
    <p>I made a modular display typeface in 2003. Based in a 3*7 grid. I retooled it a bit in 2008 with much more characters and several corrections. I like it and people have said me that I can sell it at a local foundry, but I'm afraid because it look too similar (although not exactly the same) to the <a class="freelinking external" href="http://www.fonts.info/info/en_iwan-reschniev.htm" rel="nofollow">Ivan Reschniev</a> font and some logotipes, but I wasn't aware of those at first.<br>
    Respective specimens attached. The last one has latin-1 mostly and a few corrections.</p>
