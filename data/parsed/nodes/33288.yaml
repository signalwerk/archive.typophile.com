      <p>Paulo,<br>
      thanks for your feedback.</p>
      <p>Please let me address your comments.</p>
      <p>1. If you look at a typical Windows Vista box, and navigate to the system fonts directory in Windows explorer, there will be a font named "Franklin Gothic Demi Italic". The file name is FRADMIT.TTF.<br>
      2. The typeface numbering systems recognized by the WPF font selection model are indeed the ones used in Frutiger and Univers font families. The white paper provides appropriate links: <a href="http://www.linotype.com/6-1823-6/neuehelvetica.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.linotype.com/6-1823-6/neuehelvetica.html</a> and <a href="http://www.linotype.com/6-1805-6-15548/numeration.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.linotype.com/6-1805-6-15548/numeration.html</a>.</p>
      <p>Best regards,<br>
      Mikhail Leonov<br>
      Senior Software Design Engineer<br>
      Microsoft</p>
