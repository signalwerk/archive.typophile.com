      <p>David: <em>Guidelines for font manufacturers” doesn’t contain anything that we don’t already do...</em></p>
      <p>Well, it contains two name table fields that didn't previously exist and which are not yet documented in the OT spec, so presumably you're not already using those. But if you are only building WWS families, you don't need these new fields.</p>
      <p>Mikhail, if I understand the documentation correctly, a WWS family member should have fsSelection bit 8 set (i.e. to 1) in the OS/2 table. But this is just an efficiency mechanism, yes? Because of course there are huge numbers of existing WWS fonts out there that do have this bit set. If I understand correctly, these fonts will be subject to WPF font differentiation, but fonts with the fsSelection bit 8 set will not be, since they will signal to WPF that they are WWS fonts. Is that right?</p>
