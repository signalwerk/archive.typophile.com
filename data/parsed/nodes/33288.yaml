      <p>"Well, it contains two name table fields that didn’t previously exist and which are not yet documented in the OT spec, so presumably you’re not already using those"</p>
      <p>That is correct, thank you. The main object I have is that I do not define my fonts so they can be substituted for (even from within the family). The second concern I have is that my fonts never be confused with fonts that cannot be removed from the system. (as I continue to chase the need so many express every single day, and as was expressed at the last Typecon, Users Need Better Font Management Tools from the "Source of the Problem.")</p>
      <p>This document, beside ignoring the basics of reportage, (the "W's"?) says:<br>
       "Fonts should set typographically appropriate and unambiguous stretch, weight and<br>
      style values in the ‘OS/2’ table." (meaning I hope, within a family)...<br>
      "Fonts should support the same set of name table localization languages for all faces in<br>
      the same font family." like anything else is even intentionally possible?<br>
      "Fonts are encouraged to include native bold and oblique faces to achieve better<br>
      appearance compared to the simulated bold and oblique." I'm all over this "duh" point.</p>
      <p>It's 2007 now: my publisher font menu (when I'm composing for print) starts with Arial Unicode, Batang, BatangChe, Dotum, FangSong, Guli, Gu l imChe (che(ck) it out, lol) Gungsuh, GungsuhChe, MalgunGothic, Meiro... it goes on like this for another 4-5 inches, before I reach a font name I can "use", Agency FB. This problem is partly solved if I compose for the web, i.e. all of the non-Latin (and all but 11) font families vanish from the menu. (one wonders if non-latin users are allowed to publish web documents with non-latin fonts, lol,) but thanks that one font menu filter!</p>
      <p>So while I appreciate the need to catch up for developers who might have thought it was a good idea to name or otherwise identify their fonts ambiguously or incorrectly design or not, members of a family, 1994 was the last year I thought this was a problem for users. (I mean really, John, if someone has taken the time to compose a document in NeueHelvetica, do they want it to be substituted by Arial!? EVER?) Since then, of course many new problems have arisen that don't seem to get any attention. </p>
      <p>Font management, Size management, Quality management - ?</p>
      <p>Cheers,</p>
      <p>David Berlow</p>
