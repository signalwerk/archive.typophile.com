      <p>John,<br>
      Thanks for posting the link to the white paper.<br>
      I was asked a few questions offline on this, and I would like to share the answers with folks here.</p>
      <p>Question 1: Are 'name' table IDs 21 and 22 now "official"?<br>
      - The new ‘name’ table IDs were agreed upon with our partners, and their meaning is now well defined. Font manufacturers are encouraged to test their fonts with WPF font model, and I recommend adding the new ‘name’ table IDs for non-WWS families to resolve potential ambiguities and to make sure localized names are available for international clients. Please note that WWS families don’t need the new ‘name’ table IDs, they should set the ‘OS/2’ fsSelection bit 8 instead.</p>
      <p>Question 2: Should Oblique font faces that set the new ‘OS/2’ fsSelection “Oblique” bit 9 also set the old “Italic” bit 0?<br>
      - WPF font engine doesn’t depend on this decision, but I believe setting the old “Italic” bit is useful for compatibility with other platforms that don’t make distinction between Oblique and Italic font faces.</p>
      <p>In addition, there are concerns about changing the layout of a document when a new “Italic” face is added to a font family that already has “Regular” and “Oblique” variants, or a new native “Oblique” face is added to a font family.</p>
      <p>There are several things one can do to alleviate these concerns:</p>
      <p>1. WPF applications should use FontStyle = “Oblique” or FontStyle = “Italic” along with the appropriate FontFamily value (e.g. FontFamily=”My Font Family”) instead of specifying both family and face information in the FontFamily string (e.g. “My Font Family Italic” or “My Font Family Oblique”.) The former ensures that the application behavior will not be affected by Oblique faces that specify “Italic” in their subfamily string for compatibility with older platforms.</p>
      <p>2. Since adding, removing or modifying font faces on the system can generally change the layout of a document, applications or documents that would like to preserve the layout of a flow document are encouraged to embed relevant fonts, assuming the font licenses have appropriate permissions, of course. WPF has full support for font embedding for both fixed and flow documents.</p>
      <p>Thanks for the feedback, and best regards,<br>
      Mikhail</p>
