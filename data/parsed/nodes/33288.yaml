    date: 2007-04-25T17:30:00
    date_raw: 25 April 2007 - 5:30pm
    votes: 0
    html: |-
      <p>John,<br>
      yes, your understanding is correct. Setting the WWS flag will bypass the font differentiation algorithm, and WPF will trust 'name' table strings and 'OS/2' values from the font file without trying to adjust them for consistency.</p>
      <p>Before one ships a font with the WWS bit set, I recommend making sure names and style/weight/stretch values in the font are correct and consistent.</p>
      <p>We tested the WPF font selection algorithm with thousands of existing fonts, and it is amazing how many fonts out there have inconsistent values. In particular, discrepancies between 'OS/2' usWeightClass and preferred 'name' IDs 16/17 (or 1/2 if 16/17 are not present) are very common. The goal of the WPF font differentiation algorithm is to correct these discrepancies for existing fonts, so that they can participate in the new font selection model.</p>
      <p>I hope this clarifies why the new WWS bit is an "opt-in".</p>
      <p>Please let me know if you have further questions, and best regards,<br>
      Mikhail</p>
