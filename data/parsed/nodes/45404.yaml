    <p>This is a funny question, perhaps.<br>
    What are people’s least favourite letters to design when starting a font? Do they get left until last, or do you get them out of the way first? Are they the ones that are simple or complicated?<br>
    I’ve only started on one family but it seems my least favourites are left until last in all of the weights. I think I don’t like the ones that seem like their shapes can withstand less experimentation (like M, V or Y), or are similar to other shapes (P or Q), and love the freedom of experimentation with complicated curvy shapes (like a, g, e, s). I like designing x too.<br>
    I find number glyphs the hardest, but that’s probably because in my daily life I am subjected to more letters than numbers so they are more familiar.<br>
    Does anyone else find the same thing?</p>
