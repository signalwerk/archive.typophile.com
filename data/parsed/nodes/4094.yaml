      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> <br> <br>For he who cares, this is an update of Insider. I've done some heavy curvecontrol and mucho kerning. I'm almost ready with both fonts as singles. I want to crosscheck them because I have the feeling there are some inconsistencies (width, accents, spacing). <br> <br>Some minor things I will finish later: change ampersand in the Roman, change oe and ae in Italic, check numbers in Italic (I have the feeling spacing could be improved) and implement your crits ;-) <br> <br>I want to start working on the InsiderBlack Roman and Italic. Then I will interpolate the Bold. I will also make the Regular a bit more heavy, it's a bit to light now. <br> <br>Later, <br></p>
