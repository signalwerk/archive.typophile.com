    date: 2004-11-05T03:27:00
    votes: null
    html: <p>I like this typeface. But you really should make another one as well keeping the funky modulation intact. It is cool. <br> <br>Hrant, I think the monogram is supposed to be GB as in Gabrielle Birnstein, the lucky reciever of the typeface. Am I right Ren</p>
  - id: 30538
    user_id: 1946
    user_name: Rene Verkaart
    user_path: null
    user_image: /files/pictures/picture-1946.png
    date_raw: 8 Nov 2004 — 1:00am
    date: 2004-11-08T01:00:00
    votes: null
    html: <p>Hi guys, <br> <br>magnus, that's absolutely correct with the monogram.  <br> <br>hhp, what and where do some of the characters look mechanically inclined? Just to get a good feeling for what I should look out for. <br>With my italic I just, like you could see, mechanincally inclined it. I 'italized' it here and there to get the typical italic look and feel. But in fact it is not a real italic.  <br>Therefor the width is still the same. My spacing is a bit more tight than the Regular, but I can change that back.  <br> <br>I think you're right with the ampersand. I'll change it. What about keeping it in the italic? Would that work? <br> <br>This are the original sketches with the funky modulated typeface. I will start on that this weekend and keep you updated. I'm looking for a good name for it, so if someone has some good ideas... <br> <br><img src="http://www.typophile.com/forums/messages/29/53063.jpg" alt="Insider original sketch"> <br><img src="http://www.typophile.com/forums/messages/29/53064.jpg" alt="Insider original sketch 2"> <br><img src="http://www.typophile.com/forums/messages/29/53065.jpg" alt="Insider original sketch 3"> <br><img src="http://www.typophile.com/forums/messages/29/53066.jpg" alt="Insider original sketch 4"> <br> <br>Regards, <br></p>
