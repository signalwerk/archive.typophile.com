    <p>Hi guys, <br> <br>This is a new font I'm working on for some days now. I had sketched it some months ago, but only started recently. <br>I would like to have some good crits, please. Spacing an weight balancing is off right now. I only have the glyphs in Freehand. I would like to get the basic perfect before I go on with the rest. <br> <br>It has to be a font the works very well in small sizes. I will not make a big family out of it, just the regular bold and black. Caps and numbers are not available yet. They will be made upon this basic look-and-feel. <br> <br></p>
