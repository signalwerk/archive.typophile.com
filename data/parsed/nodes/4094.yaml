    html: <p>&gt; Hmmm. Well, the remnants of the funky modulation in th <br> <br>Very true, and the modulation is also not forgotten yet. For this version I skipped it, but I will finish the modulated type too. I liked it more, but I need a bit more zen before I can finish it. <br> <br>&gt; Now, if you're still going for small sizes <br> <br>Not neccecairily. Because I will be mainly used onscreen, the average size will be 12 pt. So in print it will propably be the same. Therefor I guess the spacing will be loose.  <br> <br>Thanks for the crits. More updates later. <br> <br>Regards, <br></p>
