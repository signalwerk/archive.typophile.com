      <p>Hi Randy and hhp, <br> <br>A small update on Insider Regular. I've been working on it again for the last week. I couldn't spend much time on it, I was to busy with our website and my hernia (grrr). <br> <br></p>
      <!--attachment: RV_InsiderReg-52030.pdf*mime_pdf.gif*application/pdf*50.1*InsiderRegular*RV%a9InsiderReg%2epdf --><!--attachment: RV_InsiderReg-52030.pdf*mime_pdf.gif*application/pdf*50.1*InsiderRegular*RV%a9InsiderReg%2epdf --><p></p><center><br>
      <table border="1">
      <tbody><tr>
      <td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align="left" alt="application/pdf">InsiderRegular<br><a href="http://www.typophile.com/forums/messages/29/RV_InsiderReg-52030.pdf" target="_blank"><b>RV</b></a></td></tr></tbody></table></center><p></p>
  - id: 30528
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 25 Oct 2004 — 2:35pm
    date: 2004-10-25T14:35:00
    votes: null
    html: "<p>Hmmm. Well, the remnants of the funky modulation in the original design are hurting you. Like the \"O\" and dots on the \"i\"/\"j\" look totally out of place now, I mean in the overall picture. I think you either need to go back to the original modulation (find out why it's making you \"angry\", and deal with it) or totally get rid of it. I guess you could alternatively make the funky modulation a very gentle presence throughout, but that will be very hard to pull off, I think. <br> <br>Structurally, the only glyph that really bothers me is the \"k\" - I'd make it like the UC. The \"C\" and \"G\" seem too wide. The diaresis is too strong, and I'd flatten the UC accents. Otherwise once you figure out the modulation issue you'll have a solid design on your hands I think. <br> <br>I think your spacing is loose. Now, if you're still going for small sizes, that's fine, in fact your vertical proportions are much better now for that; but the color will be too light then. Also, because your spacing is loose, you need a bigger blank space - and this might in fact be the problem with the all-caps setting: they're already hard to read, but with their taller height the small wordspace ruins everything. <br> <br>Don't give up!  :-) <br> <br>hhp</p>"
