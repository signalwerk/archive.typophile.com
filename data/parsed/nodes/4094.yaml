    html: <p>&gt; Try giving the "e" and "a" bit more bowl and counter. I will try that and make an update later. <br> <br>&gt; (Ole, you're really taking critiquing seriously! Cool.) I like that too. Keep 'm coming, Ole. I think you're right. I had it in my head but was not sure. With you saying that makes me sure that I have to change it. The first reaction is always the most important. <br> <br>&gt; the x-height is way too small; But that will change if I make the ascenders and descenders smaller. Like Ole also suggested, it will then have less negative space. <br> <br>&gt; and the weight is too light. Too light? Are you sure? I printed it many times in different sizes and it seems to be OK. How much darker does it have to be than? Is there something like a golden rule that I can follow? Do you have maybe a reference font that I can check up on? <br> <br>I'm personally not so sure about the 's'. Do you see a problem there? Another thought is that I would like to make the bowls of the 'd, p' g, q' a bit more round so that the little serifs more distinct (if that makes any sence). Or would you leave that like it is? <br> <br>Thanx, </p>
