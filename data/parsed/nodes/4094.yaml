    date: 2004-11-08T15:27:00
    votes: null
    html: "<p>The lc italic glyphs that look strongly mechanical to me are: c k o r s <br>Basically I guess the longer stretches of curves, and the diagonals need the most attention. <br> <br>&gt; What about keeping it in the italic? <br> <br>Seems smart. <br> <br>&gt; I'm looking for a good name for it <br> <br>For some reason \"Concrete Jungle\" just popped into my head. <br> <br>hhp</p>"
