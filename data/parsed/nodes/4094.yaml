  - id: 30535
    user_id: 1946
    user_name: Rene Verkaart
    user_path: null
    user_image: /files/pictures/picture-1946.png
    date_raw: 4 Nov 2004 — 8:20am
    date: 2004-11-04T08:20:00
    votes: null
    html: <p>Thanks Aaron for the compliment. What say you about the crit from hhp that I discarded the funky modulation that I had in the inner shapes in the beginning. It's not lost, but I skipped it out of this version.  <br>Personally I think it's became better without it, because I could let go of some difficulties. I found my error and I will make another display typeface with this funky modulation later on.  <br> <br>Is there maybe someone who can give me some good crits and tips on my spacing for the italic. I have difficulties with it. I did it on the fly, but there must be a more constructive way to do this.  <br>BTW, is the spacing in the italic narrower than in a regular??? <br> <br>Regards, <br></p>
  - id: 30536
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 4 Nov 2004 — 1:07pm
    date: 2004-11-04T13:07:00
    votes: null
    html: "<p>I think you have your (revised) modulation under control now. <br>- The \"k\" still bothers me; \"s\"/\"S\" too wide. <br>- It would be nice if you could give the numerals more character. <br>- The bars on the Euro are sitting high. <br>- The ampersand is a bit much here. <br>- Spacing: pretty loose. <br>- The italic is quite nice, although in some places it looks too mechanically inclined. <br>- Nice presentation. <br> <br>BTW, the funky version, what about calling it Insiderer? <br> <br>&gt; is the spacing in the italic narrower than in a regular? <br> <br>Do you mean is it, or <i>should</i> it be? <br>Italic forms tend to be narrower, and lighter (and often other things too). The former means the overall space it takes will be less, but the latter actually means the interletter spacing generally needs to be <i>more</i>. <br> <br>BTW: <br>1) What's that cool monogram, that looks like \"g3\"? <br>2) The usual term is \"waterfall\", not \"cascade\". Although I've actually used the latter myself sometimes - it just <i>sounds</i> so much nicer. Hmmm, so forget what I said, just use \"cascade\"! <br> <br>hhp</p>"
  - id: 30537
    user_id: 3408
