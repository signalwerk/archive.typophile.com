      <!--/attachment--><!--/attachment--><p> <br> <br>This is the latest version of the current Insider. I finished it up till this status because my girlfriend has her birthday tomorrow. The typeface is long from ready, but it's presentable for someone who doesn't know much about weights, proportions, kerning, etc. <br> <br>The italic is long from ready, because much of the weightproportions are wrong. I have to correct this all by hand. The kerning has to be done also. <br> <br>hhp, you will get your funky modulation. I've looked for my sketches again and found the mistake in my thinking. I will make a complete new version bases on this sceleton. I think I will call this version Insider HHP. ;-) It will be a display face with only two weight (+ Iitalics), a regular and a black. I like black italic typefaces. <br> <br>Later, <br></p>
