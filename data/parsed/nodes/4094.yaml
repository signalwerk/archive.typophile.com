    date: 2004-04-13T05:39:00
    votes: null
    html: "<p>a: Problematic structure. The bowl seems too small/low to me. Especially onscreen at smaller sizes. <br> <br>a,b,d: The way the bowls join the stem at the bottom is causing problems. They seem almost stemless because the join is thick and low. I'd raise it up a bit and maybe add a tail on the a. <br> <br>y: Try a traditional y. <br>g: bowl needs a little more raising. <br> <br>Randy  </p>"
  - id: 30525
    user_id: 1946
    user_name: Rene Verkaart
    user_path: null
    user_image: /files/pictures/picture-1946.png
    date_raw: 14 Apr 2004 — 1:11am
    date: 2004-04-14T01:11:00
    votes: null
    html: <p>Do you really think the bowl is too small? It looks good on my screen, though I know that doens't mean anything. I think it gives it a bit more personality. I'll try to change it later and see if you like that more. You've said it before, so I think you will. ;-) <br> <br>Does a tail on the 'a' fit to this concept? That would be the only letter that has a tail.  <br>I will enhance the stems in the 'a, b, d', I think that's a good thing.  <br> <br>I kinda like this 'y' that I have. I would leave it for now, can always change it later.  <br> <br>Will raise the bowl of the 'g' <br> <br>Randy, you are shaking my world. A lot you suggest goes against my original Idea with this font, but I'll follow you and see where it leads me. Please keep in mind that I should not look (too much) like all the other sans serif on-screen readible fonts out there. It needs a certain own personality. <br> <br>Thanx, <br></p>
  - id: 30526
    user_id: 618
    user_name: aquatoad
    user_path: null
    user_image: null
    date_raw: 14 Apr 2004 — 6:45am
    date: 2004-04-14T06:45:00
    votes: null
    html: "<p>Re: Shaking your world <br> <br>I've found that the intensity of immersing in the project makes me partially blind to the problems in my forms. Only time lets my eyes, see fully again. Barring that, it's a balancing act trying to borrow other people's eyes, but keeping my concept. The same is true of trying to write a paper in school. As you proof your own work, you combine what you've got in your head with what's actually on paper. Your readers don't have that luxury so their eye is more critical, but less aware of what you're actually wanting to say. <br> <br>Don't let me drag you off concept. All my suggestions are just that. Any other typophiles want to jump in here? <br> <br>One final suggestion :-) Move on to the caps. Immerse in those for a while. When you're *done* go back and look at prints of the  lowercase with fresh eyes. Then make your move. <br> <br>Randy</p>"
