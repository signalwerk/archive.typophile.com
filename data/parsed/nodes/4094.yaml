    date: 2004-11-09T08:03:00
    votes: null
    html: "<p>Hi Randy, <br> <br>Welcome back. :-) And thanks for the nice compliment. Coming from you I think that means something. <br> <br>Yes, it came right after Nordic. I guess you can see my handwriting. Could you recognize it as my font, not knowing that it came from me? <br> <br>About the funky version, I will finish it based on the sketches. I won't overwork Insider to push the modulation back in. This font will mainly work onscreen and needs no funky modulations; it's a working horse. Insider became more round over the time and the funky one needs a bit more tight curves. You can see that clearly on the sketches.  <br> <br>I'm really looking forward for working on the funky font. I've overcome my frustration and feel that I'm up to the challenge now. <br>The glyphs that frustrated me most are: b, e, s (although I now kinda like it with the funky curves in). <br> <br>hhp, what's going on in your head? :-) I don't see it beeing the name for the font, but perhaps the sample book that I will make for it. It's a great theme where I see some interesting images. <br> <br>Later, <br></p>"
