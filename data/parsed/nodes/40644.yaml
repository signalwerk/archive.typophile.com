    <p>Hello, I'm an occasional lurker of this forum and I am posting to pick your typophile minds.</p>
    <p>I am currently working on a corporate identity project requiring that I research fonts in common usage in the years 1870 - 1900. I have thought of a few ways to do this. Microfilm being the most efficient. </p>
    <p>Can you suggest other ways of going about this please?</p>
    <p>Also can you suggest where I could find authentic fonts from that era?</p>
    <p>Thank you very much</p>
