      <p>thank you! I had not thought of the Uni Library. Let's hope the local schools have what I'm looking for. </p>
      <p>I have been getting closer to what I'm looking for.</p>
      <p>I'm hoping to study typefaces such as the ones found in the GRAND THEATRE and BLACKPOOL posters found <a class="freelinking external" href="http://www.blackpoolcircusschool.co.uk/circus_history.html" rel="nofollow">here</a></p>
      <p>And the stuff Christopher H. Bing used in his re-design of "Casey at the Bat" in 2000. </p>
      <p>It's the first time in my life as a designer that type strikes a deep and resonant nearly emotional chord in me. </p>
      <p>Link<br>
      <a class="freelinking external" href="http://www.powells.com/cgi-bin/biblio?inkey=62-1929766009-0" rel="nofollow">here</a><br>
      (sorry, no pics of the interior spreads which are stellar! That first spread blew me away! I finally understood the genius behind the genuine typesetters of the era he was emulating.)</p>
      <p>I simply must study this further. I am quite possessed by this in fact.</p>
