      <p>Those posters are hand lettered. I want to say hand drawn, but I suspect they were created as woodcuts. I've long harboured a fantasy of building a font based on one of these, a Grand Trunk Railway timetable from about that time.</p>
      <p>I just looked, and can't find a link to it, but you might find the two sites below of interest. Railway and Steamship schedules of that era should have similar work.</p>
      <p><a href="http://www.sullboat.com/1883%20Timetable,%20Cover.jpg" title="http://www.sullboat.com/1883%20Timetable,%20Cover.jpg">http://www.sullboat.com/1883%20Timetable,%20Cover.jpg</a><br>
