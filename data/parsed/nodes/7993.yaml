    html: <p>I like Melior italic very much. <br>For movie subtitles I think that the bold roman'd do a great job. <br>Wonder if it has never been used for that purpose. <br>Any one knows ? <br> <br>AS <br> <br> <br>PS/ <br>Time ago I cached on mi Mac this text. <br>Cannot find the source though. <br> <br>"The origin of the "Super Ellipse" has an historical curiosity.  <br>Piet Heine, was a Dutch architect, poet and acknowledged <br>creative genius. (Somna, Hex, Super-ellipse, Super-egg, <br>"Grooks", etc.)  <br>Well, regarding the super-ellipse, here is the story. <br>In 1959 Piet Heine the architect was approached by the Stockholm <br>city planners to solve a difficult problem in urban planning. <br>This was the first time Heine ever focused on the subject of <br>ellipses. The city square, with all the streets leading into it, <br>needed a fresh approach, a pleasing architectural shape to create <br>a focal point for the town. None of the city planners were able <br>to solve the problem. The square didn't work, the ellipse didn't <br>work and the "segmented ellipse" didn't work. Indeed, it was a <br>devious puzzle.  <br>Enter Piet Heine ... Voila! ... and the super-ellipse was born!  <br>The curious thing about this story is that Hermann Zapf had used <br>a "super-ellipse" like shape in the design of his typeface called, <br>"Melior", which was designed in 1949 and commercially released in <br>1952. Now, that is 7-10 years earlier then the "super-elllipse" <br>was invented!"</p>
    html_clean: <p>I like Melior italic very much. <br>For movie subtitles I think that the bold roman'd do a great job. <br>Wonder if it has never been used for that purpose. <br>Any one knows ? <br> <br>AS <br> <br> <br>PS/ <br>Time ago I cached on mi Mac this text. <br>Cannot find the source though. <br> <br>"The origin of the "Super Ellipse" has an historical curiosity.  <br>Piet Heine, was a Dutch architect, poet and acknowledged <br>creative genius. (Somna, Hex, Super-ellipse, Super-egg, <br>"Grooks", etc.)  <br>Well, regarding the super-ellipse, here is the story. <br>In 1959 Piet Heine the architect was approached by the Stockholm <br>city planners to solve a difficult problem in urban planning. <br>This was the first time Heine ever focused on the subject of <br>ellipses. The city square, with all the streets leading into it, <br>needed a fresh approach, a pleasing architectural shape to create <br>a focal point for the town. None of the city planners were able <br>to solve the problem. The square didn't work, the ellipse didn't <br>work and the "segmented ellipse" didn't work. Indeed, it was a <br>devious puzzle.  <br>Enter Piet Heine ... Voila! ... and the super-ellipse was born!  <br>The curious thing about this story is that Hermann Zapf had used <br>a "super-ellipse" like shape in the design of his typeface called, <br>"Melior", which was designed in 1949 and commercially released in <br>1952. Now, that is 7-10 years earlier then the "super-elllipse" <br>was invented!"</p>
