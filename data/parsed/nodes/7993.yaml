    html: <p>Galaxie Polaris, Amplitude and Melior are more rounded than what I was thinking of. It's the more angular thing that seems to be popular right now. As Yves says, it suddenly seems like a good idea to a number of people.  <br> <br>It is interesting that Zapf says he designed Melior without knowing about the superellipse as a mathematical construct. He just was figuring how to increase counter space for a newspaper type, and drew it exactly. Then Piet Hein, I think, pointed out that it was the superellipse.  <br> <br>The rounding on Melior is softer than Apex etc. I don't know why, because I am otherwise a big fan of Zapf, but I've never liked the look of Melior.</p>
    html_clean: <p>Galaxie Polaris, Amplitude and Melior are more rounded than what I was thinking of. It's the more angular thing that seems to be popular right now. As Yves says, it suddenly seems like a good idea to a number of people.  <br> <br>It is interesting that Zapf says he designed Melior without knowing about the superellipse as a mathematical construct. He just was figuring how to increase counter space for a newspaper type, and drew it exactly. Then Piet Hein, I think, pointed out that it was the superellipse.  <br> <br>The rounding on Melior is softer than Apex etc. I don't know why, because I am otherwise a big fan of Zapf, but I've never liked the look of Melior.</p>
