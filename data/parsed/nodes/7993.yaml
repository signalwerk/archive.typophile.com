  html: <p>There seems to be a recent trend of partially squared Sans faces. There is Thirstype's <a href="http://thirstype.com/fonts.php?font=ApexSans" target="_blank">Apex Sans</a>, Christian Schwartz's <a href="http://houseind.com/house.php?kit=SIMIAN-FO&amp;sub=view" target="_blank">Simian</a> from House Industries, and the new <a href="http://www.processtypefoundry.com/typefaces/klavika/index.html" target="_blank">Klavika</a> by Eric Olson from his Process Type Foundry. Also here in the critique section, we have <a href="http://www.typophile.com/cgibin/show.pl?29/50157" target="_blank">Tramway</a>, being developed by Hanno Bennert. <br> <br>There are probably a lot of others I haven't mentioned. What do you all think of this trend? How do you compare the different fonts in this category? <br> <br>I think Simian, which is wide, is very stylishly done. Klavika is striking because it brings some warmth to this style, and seems exceptionally readable for a sans.</p>
  html_clean: <p>There seems to be a recent trend of partially squared Sans faces. There is Thirstype's <a href="http://thirstype.com/fonts.php?font=ApexSans" target="_blank" class="link-external">Apex Sans</a>, Christian Schwartz's <a href="http://houseind.com/house.php?kit=SIMIAN-FO&amp;sub=view" target="_blank" class="link-external">Simian</a> from House Industries, and the new <a href="http://www.processtypefoundry.com/typefaces/klavika/index.html" target="_blank" class="link-external">Klavika</a> by Eric Olson from his Process Type Foundry. Also here in the critique section, we have <a href="http://www.typophile.com/cgibin/show.pl?29/50157" target="_blank" class="link-lost">Tramway</a>, being developed by Hanno Bennert. <br> <br>There are probably a lot of others I haven't mentioned. What do you all think of this trend? How do you compare the different fonts in this category? <br> <br>I think Simian, which is wide, is very stylishly done. Klavika is striking because it brings some warmth to this style, and seems exceptionally readable for a sans.</p>
