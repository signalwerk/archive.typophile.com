    html: |-
      <p>Tom, </p>
      <p>you are right. Adobe Illustrator and InDesign are smart: when I insert a glyph using the Glyph palette, they try to guess the “best” possible way to access that glyph, and store that information. If a glyph has a non-private Unicode codepoint assigned, InDesign (and Illustrator) inserts that codepoint. If a glyph is accessible through a particular OpenType layout feature that InDesign can work with, InDesign inserts the Unicode codepoint of the basic glyph plus a feature code. When I insert a small-cap a, InDesign will store it as “a with smcp applied”. This is nice because if I switch the font, that formatting will retained if the new font also supports small caps. </p>
      <p>If the glyph is available through several different OpenType Layout features, InDesign makes a “best guess”. And only if the glyph is not accessible through an OpenType Layout feature and does not have a Unicode codepoint associated, the glyph id is stored, as a sort of “last resort”. </p>
      <p>The Mac OS X Character Palette works differently. If I switch it to the glyph mode and use it to insert a glyph to, say, TextEdit, the glyph id will be always used. </p>
      <p>Adam</p>
