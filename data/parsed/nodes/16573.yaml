      <p>Thomas, </p>
      <p>on an unrelated note: as we all know, Photoshop CS/CS2 doesn’t have the Glyph palette. I tried to use the Mac OS X Character Palette with it and it only works for “characters”, i.e. glyphs that have a Unicode codepoint assigned (even if that’s just PUA). Even though the Apple Character Palette has a “glyph” mode, unencoded glyphs don’t make it into Photoshop, or InDesign or Illustrator. I realize this has to do with the text infrastructure, and that Adobe apps don’t use the Cocoa text handling (AAT/ATSUI). However, I wonder if this could be looked into for all future CS apps on the Mac. Even though Illustrator and InDesign have their own Glyph palettes, I think a seamless integration with the system Character palette would be desirable. The Mac OS X Character palette is actually a pretty potent tool. </p>
      <p>Of course, I have submitted a request on this at <a href="http://www.adobe.com/support/feature.html" title="http://www.adobe.com/support/feature.html">http://www.adobe.com/support/feature.html</a></p>
      <p>Adam</p>
