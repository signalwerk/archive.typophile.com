      <p>it seems to me that this kind of encoding can easily result in a large # of replacement lookups. I’m sure I don’t understand OT compilation as well as Adam does, but for your given example if you have 4 letter variations in each of your classes and 120 lines you would end up with 7680 lookups, and easily many more if some of your classes have five or more alernates or your ligature strings are more than 3 characters long. (Adam, please correct me if my thinking on this is wrong!)</p>
      <p>An easy way to get around this problem is to put your dlig feature <em>before</em> your other features (salt, swsh, calt, etc.) But maybe you’re trying to achieve some other effect. Maybe you could explain a bit more in detail what you’re trying to achieve?</p>
