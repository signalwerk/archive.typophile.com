      <p>Not lookups but substitutions — but indeed, that’s the case. And your advice makes much sense, Paul. If you move dlig before calt, you may get away with just putting the basic variants into dlig (sub a a a by a_a_a.alt) instead of all the variants (sub [a a.alt a.swash a.alt2] [a a.alt a.swash a.alt2] [a a.alt a.swash a.alt2] by a_a_a.alt), and yet, largely, you’ll achieve the same functional effect (except that dlig will not work for variants that were manually inserted into the text string using the Glyph Palette, but it will still properly interact with calt). </p>
      <p>Adam</p>
