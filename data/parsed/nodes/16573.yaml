    <p>In another thread someone asked about an “overflow” problem when compiling OpenType kern feature in Fontlab. I am having the same problem, except with the dlig feature. The solution that was suggested for the kern feature overflow was using subtables. I tried that with my dlig feature, but it looks like subtables are not allowed with this feature. </p>
    <p>My dlig feature is quite simple. It’s just about 120 lines of things like “sub @lc_d @lc_a @lc_b by dab.alt;” nothing at all more complicated than this. I’m at a loss as to why it would could cause an “offset overflow”. I thought overflow errors were caused by tables that exceeded 64k in size. My dlig feature is nowhere near that size. In fact, my liga feature is about the same size as my dlig feature, but it doesn’t cause an overflow.</p>
    <p>If anyone can shed some light on this, or tell me of a workaround, I would very much appreciate it.</p>
    <p>Ale</p>
