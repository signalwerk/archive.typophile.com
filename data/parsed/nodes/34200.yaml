      <p>Well, my Bembo has been pretty heavily modified. When we were still running repro --early-mid 1990s, I took a look at a couple of books, one a fine-print book from Steinhour press, one an old Penguin paperback from college days, &amp; got a feel for the range of how Bembo printed in metal. First thing you noticed is that whoever made the PostScript Type 1 (3?) font shortened all the ascenders &amp; descenders. Second thing you noticed was the contrast of the letters was all wrong when printed offset. So our Bembo got one large adjustment when we were running repro, and a second adjustment when DTP became prominant.</p>
      <p>I don't know how to post a picture here. I can easily make a PDF, but most sites only allow you to post a gif or jpeg. Dunno how to do that with type.</p>
      <p>Anyway, I suppose the taller ascenders would help with your solution, but also allow my proposed solution. I guess to give an answer you'd have to <cite>see</cite> it.</p>
      <p>Charles</p>
