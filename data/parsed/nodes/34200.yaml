      <p>I suspect that the *high* position of the tittle in faces such as Bembo came about for the following reason:</p>
      <p>In the first place, it would have been quite possible to set an f followed by an i -- the i having a normally positioned tittle, as per Charles' fix--with the arm of the f kerning over the body of the i. However, this would have resulted in a lot of breakage in the reuse of type, as the "beard" of the arm and the tittle are awfully close.</p>
      <p>Therefore, an f_i ligature was designed, with the arm of the "f" covering the position where the tittle might be, so it didn't look as if it was missing, just obscured.</p>
      <p>Except, the tittle was relatively low, and the arm had to bend way down to hide its supposed position, and that looked odd.</p>
      <p>Therefore, the tittle was moved up, to make the f_i ligature more convincing.</p>
      <p>Just a theory.</p>
