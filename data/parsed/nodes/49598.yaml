    <p>[[http://www.josbuivenga.demon.nl/museosans.html|Museo Sans]] has been released. It comes in 10 styles: five weights with each an italic. Two styles (500 &amp; 500 italic) are free. <a class="freelinking external" href="http://www.myfonts.com/fonts/exljbris/museo-sans/">Available at MyFonts</a>.</p>
