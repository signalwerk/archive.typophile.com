    <p>I showed her some layout with Mrs.Eaves font and she liked it.</p>
    <p>My questions:<br>
    If I do use Mrs.Eaves, on the parts which goes telephone number and e-mail, what is "the right" or "correct" thing to do, to use old style numerals or lining ones?</p>
