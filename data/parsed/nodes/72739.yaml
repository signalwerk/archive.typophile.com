    html: |-
      <p>Mrs Eaves is a great utility typeface, and prints well at small sizes, so business card use is fine.</p>
      <p>There is no "correct" way to do phone numbers; however, if you have several of them stacked (e.g., office, cell, fax, etc., one above the other, all flush right or left), lining numbers are preferable from a visual balance standpoint. On the other hand, if you're stacking a single phone number and an email address, there's no real reason not to use the far more interesting oldstyle numbers.</p>
