    <p>Hello!</p>
    <p>I'm on this project right now in which I'm trying to design a business card to a friend who is a psychologist. She's not the most dogmatic or orthodox person, but she's somehow traditional.</p>
    <p>I showed her some layout with Mrs.Eaves font and she liked it.</p>
    <p>My questions:<br>
    If I do use Mrs.Eaves, on the parts which goes telephone number and e-mail, what is "the right" or "correct" thing to do, to use old style numerals or lining ones?</p>
    <p>What do you guys think of Mrs.Eaves being used in such thing as a business card?</p>
    <p>I appreciate your feedback!</p>
    <p>Thank you so much!</p>
