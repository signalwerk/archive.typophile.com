      <p>I'm not familiar with that font, but there are oldstyle figures that are tabular (that is, fixed width) that can be set up so numbers that are stacked will line up.</p>
      <p>And some fonts have lining figures that are proportional - that is different figures are different widths, even though all are the same height.</p>
