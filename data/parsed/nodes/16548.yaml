    <p>Good evening all.</p>
    <p>So I know henna is a medium, not a style, but I'm wondering if anyone can help recommend an ornamental font (not lettering, but that might be interesting too) that evokes the traditional style of arab and/or asian body art. It needn't necessarily be authentic, just evokative. </p>
    <p>So far I've come up with Altemus Arabesques;</p>
    <p><a href="http://www.myfonts.com/fonts/altemus/arabesques/altemus-arabesques/charmap.html" title="http://www.myfonts.com/fonts/altemus/arabesques/altemus-arabesques/charmap.html">http://www.myfonts.com/fonts/altemus/arabesques/altemus-arabesques/charm...</a></p>
    <p>which I think is interesting. Anybody else had fun/been inspired by this kind of work?</p>
    <p>Ta,<br>
    Anthony</p>
