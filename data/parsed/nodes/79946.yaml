      <p>That is all very well, but since some people insist on having something portable for reading e-books, it's still helpful to recommend to them that they buy the one with the ability to install one's own fonts - if one's goal is to encourage the whole world to use modified versions of fonts that help them to avoid... negative thoughts.</p>
      <p>Of course, I don't think Adobe Reader lets me change the font on most .pdf documents, and so the choice of e-book <em>format</em> has a significant effect as well.</p>
