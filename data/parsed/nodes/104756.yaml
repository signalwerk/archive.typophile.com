    html: <p>In more than 45 years of having stuff printed, I have yet to get one piece back from the printers (or finishers) that hasn’t got at least one mistake in it. And I’m not talking about bad line breaks, but major, often embarrassing typos, omissions, wrong fonts, missing illustrations etc. The closer you work with it, the farther it gets from your critical eye. Show me someone else’s work and I’ll spot a typo or similar misdeed immediately.</p>
