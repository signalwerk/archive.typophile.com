    html: <p>When talking about the relevance of the First Spiekermann Dictum and guessing how often that occurs, we should remember that Erik stated it back in the days of phototypesetting. In the case of Erik and many of his professional colleagues in mainland Europa and the UK, this was typically done on Berthold machines. On these machines, all the fonts had the same cap height. As a consequence of this, the real body sizes varied. Type size was defined in mm cap height and line feed in mm. The Berthold type specimen specified a minimum line feed for each typeface in a range of sizes from 5–16 p for kp, Êp and Ex-height. Because not all typographers liked to calculate and write their typesetting instructions that accurate, but simply wrote things such as 10/10p, ascenders and descenders would touch when applying this instruction to typefaces such as Syntax or Futura. You can imagine that mistakingly touching ascenders and descenders were quite common in those days. The large phototypesetting chain of Eduard Bos in Holland tried to cope with this by advising so-called line feed factors for each typeface family. These factors were communicated in the specimen books of the studio as ‘A’, ‘B’ or ‘C’. Typesetting operators would then calculate the appropriate line feed from that factor. Remember that back then, there were no Wysiwyg screens with an accuracy that could display the difference between 10/10 and 10/11 p … Of course, not all customers had these specimen books, let alone that they studied them thoroughly. Many of them learned by trial and error. Like me. Normally one would make such a mistake only one time because phototypesetting was quite expensive, but that one time was usually enough to make shure that you would never forget such a thing as the First Spiekermann Dictum in your life as a typographer …</p>
