    html: |-
      <p>One of the classics is the Hartley &amp; Marks edition of Gerrit Noordzij's <em>Letterletter</em>, on the spine of which his name is spelled Noordzig.</p>
      <p>The one that pains me most is in <em>Language Culture Type</em>. I managed to drop a letter from Adam Twardoch's witty chapter title, so it ended up as 'Picked herring...' instead of 'Pickled herring...'. Neither I, nor the editor, nor any proofreader spotted it. Adam, of course, saw it immediately, after the book was printed.</p>
      <p>I also recall a misspelling in 100pt type on the cover of a high Anglican service booklet, also missed by numerous people until the church secretary opened the box from the printers and spotted it immediately. In that case the text was running from bottom to top up the side of the cover, and the mistake might have been easier to spot if anyone had bothered to rotate the proofs. I don't remember exactly what the mistake was, but I do remember all the covers being carefully removed and new ones affixed.</p>
