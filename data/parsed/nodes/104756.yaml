  html: |-
    <p>Because we're talking about it on Twitter, I'm curious to see how many of you are aware of the First Spiekermann Dictum? I imagine that anyone who's set more than a few lines of type has come across the phenomena where a descender in a line of type clashes with the ascender in a second line of type.</p>
    <p>As written in Rhyme &amp; Reason: A Typographic Novel, the dictum states the following:</p>
    <p><img src="https://pbs.twimg.com/media/BPeFCsACcAAPa5t.jpg"></p>
    <p><img src="https://pbs.twimg.com/media/BPeEmsJCAAEqR8V.jpg"></p>
    <p>Any good stories on your encounters with the First Spiekermann Dictum? What would be your approach when it occurs?</p>
