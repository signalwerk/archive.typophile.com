    html: |-
      <p>That book was printed 30 years ago and nobody has seen that mistake until now, for a mistake it is. Paul Stiff and myself worked on this English translation of the German original and we never noticed that typo. Quite exceptional to have escaped an expert audience all these years. </p>
      <p>If I had the German original here I would check how it was handled there, but i remembered that we just set the sentences the way they came and clashes happened, thus the dictum. </p>
      <p>The <em>Spiekermann Dictum</em>, however, is to be found on the top of the right-hand page, not that headline setting. It doesn’t apply to text setting where – even without additional leading – most descenders won’t physically touch ascenders below, although they might still look uncomfortably close at times. But if anybody has ever set a headline for a package or some other display purpose where two or more lines have to be close for impact and/or space reasons, they will have come across this phenomenon. In other trades this is simply called “shit happens”.</p>
    html_clean: |-
