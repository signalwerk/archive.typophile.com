      <p>On a similar note, during my undergrad, I was asked to design a title page for a book titled “TRADITIONAL TYPOGRAPY.” My choice of title. My professor and I went through a few rounds of revisions with tissue markups advising me on kerning &amp;c, after which I submitted the final version, for which I received an A+. </p>
      <p>It was only after I got it back that I noticed I had actually misspelled the word TYPOGRAPY. I brought this to my professors attention, who’s first language was also not English, and we both laughed. We were so focused on the kerning we neglected to notice the spelling. I believe the expression is “not seeing the forest through the trees.”</p>
      <p>This is truly a thread for the <em>books</em> — pun intended.</p>
      <p>(he let me keep the A+)</p>
