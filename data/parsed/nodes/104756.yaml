    html: <p>The issue isn't getting the font to know there's a line break, it's having the line layout engine keep track of where things are in adjacent lines and applying appropriate layout features when specific conditions occur. It's a bit like mathematics or some complex script layout, in that you can't rely on font-level context rules, but need a layout engine to trigger the lookups.</p>
