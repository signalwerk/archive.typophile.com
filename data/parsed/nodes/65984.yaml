    <p></p><div class="imageWrap"><img src="http://typophile.com/files/swatchpalette_5677.png"></div><p></p>
    <p>Hi all,</p>
    <p>Ugh! Here's my issue.</p>
    <p>I took a clip art image and opened it in Illustrator-did the live trace and converted to live paint. This gave me a vector image. Then I copied this vector image and pasted it into my InDesign document and all of a sudden my swatch palette had all of these shades of CMYK in it. </p>
    <p>My client discovered this upon preflighting my file and was not pleased as this is going to the printer today. Can anyone tell me how this happens and how I can avoid this in the future?</p>
    <p>Thank you, Janet</p>
