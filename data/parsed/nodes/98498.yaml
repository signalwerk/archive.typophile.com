  html: |-
    <p>I loved spur/flare serif typeface very much and here are some lists that I like. Most of them I found on Myfonts.com. Hope you all can add to my collection.<br>
    *I would love also to see some typefaces coming from independant foundries(not listed on Myfonts.com) like treacyface..<br>
    1. TF Arrow (treacyface)<br>
    2. Seta Rena (Nick's fonts)<br>
    3. Cartesius (T4)<br>
    4. Mart (NocommenType)<br>
    5. Orpheus Pro (Canada Type)<br>
    6. Dragon EF (Esner + Flake)<br>
    7. Beaufort Pro (ShinnType)<br>
    8. Friz Quadrata</p>
