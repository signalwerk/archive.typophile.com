      <p>That is helpful advice: the typewriter I used has exactly 12 characters per inch, and 600 units (out of 1000) indeed makes the font have exactly the right size at 10 points. (Alternatively, I suppose I could use a width of 500 units, which would make the right size at 12 points. But 600 units seems like the best choice when compared to the size of other fonts on my system.)</p>
      <p>The line spacing of the machine was 170.5 mm per 40 lines, which works out to 12.08 pt per line. (It is notably <em>not</em> 12.1 pt, which would make 40 lines span over 170.75 mm; my measurement of 170.5 mm is, if anything, rounded up rather than down. But I don't know if 12.08 is the exact space intended by the manufacturer, or if it really should be 12.1 pt, and this particular machine is advancing the paper slightly less than intended?) In any case, if I have understood it correctly, there is really no good way to control that as a font designer? I notice that my test fonts (i.e. the one with 600 units @ 10pt and the one with 500 units @ 12pt) both have the same large line spacing of 14.1 pt (in the first and only program I tested in, OpenOffice). So, to get the correct line spacing, I suppose I simply have to instruct the users to set it explicitly in their typesetting program. Or is there a better way?</p>
      <p>What you write about inspecting the daisywheel with a loupe is intriguing, but for me as an amateur it seems like a daunting task: I wouldn't trust myself to be able to reproduce the proportions of the letters correctly. However, for me personally, it is a moot point: I don't have access to the daisywheel. I only have the typed pages, which were made on location in a shop specializing in repairing typewriters. I think, though, that by generating an average picture of several specimens, I will be able to get close enough (for my purposes) to the actual shape of the types on the wheel. (But it would indeed be very interesting to investigate that further; consider for example the small indenture on "s" which I mentioned above, and which I presume is a small damage on the type. It would be great to be able to confirm that by visual inspection of the wheel...)</p>
