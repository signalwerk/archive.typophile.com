      <p>I have uploaded a <a class="freelinking external" href="http://web.comhem.se/alatius/fonts/cubic-20111002.pdf" rel="nofollow">first draft</a>.</p>
      <p>I have here mainly concentrated on getting the letters uniform, making the stems consistently wide and reusing curves which should be identical (the right part of "e" is copied from "o", while the right part is identical to that of "b", and so on). The main difficulty I have faced is to decide to what degree I should simplify the letters. Primarily, the stems of "bdfhknmpqtu" have a noticeable swelling in the bitmap picture, which I have not reproduced. Thad however might have been a mistake; especially my "f" gives a very different impression, I think. So I will probably reconsider that.</p>
      <p>Another thing to notice is that I have deliberately drawn the horizontal elements of "ilrz" slightly at an angle. This is based on the scans, but again, that is something I have my doubts over.</p>
      <p>Anything else I should think of as I proceed?</p>
