      <p>Nice project! I've started several times to digitize a typewriter face that I'm in "love" with, and still am not sure about the best way to go ahead. By now I'm starting to think just to look at the daisywheel with a loupe and drawing everything by eye may be way to go. I just couldn't make scans of typewritten letters that showed enough detail in the letterforms.</p>
      <p>Before you start drawing, it may be useful to do some math to save you trouble later.</p>
      <p>Typewriters had a fixed spacing (a certain number of characters per inch). You can find it out like this:</p>
      <p>Type the same letter, for example I, about twenty times in a row. then measure from the stem of the first I to the stem of the eleventh I. If the distance is 25.4 mm (= 1 inch), then the spacing would be 10 characters per inch. If 13 I make up 1 inch, it would be 12 characters per inch. If you measure multiples of 1 inch, and divide accordingly, you will get more accurate results.</p>
      <p>There were a couple of models, especially in Europe, which use the metric system and would space 10 or 12 characters per 26 mm (instead of 25.4 mm).</p>
      <p>If you draw your font on a 1000-unit grid and make the characters 600 units wide, you will get exactly 10 characters per inch at a font size of 12 points, or 12 characters per inch at a font size of 10 points.</p>
      <p>If you have a metric typewriter with 2.6 mm spacing, you will need 614(.17) units character width.</p>
      <p>Good luck :)</p>
