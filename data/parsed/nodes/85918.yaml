      <p>I can now present a <a class="freelinking external" href="http://web.comhem.se/alatius/fonts/cubic-20111123.pdf" rel="nofollow">new draft</a>. As can be seen in the PDF, I have now drawn glyphs for all characters present on the typewriter. Now, are there any things in particular that you think that I should work more on?</p>
      <p>There is one aspect in particular that I am unsure of, namely how corners should be treated. There will naturally be some distortion of the letters when they are written on the typewriter, leading to sharp corners being more rounded, and the averaging process that I have used (mentioned above) may also introduce some further smoothing. To what degree should I adapt to this in a re-creation? Right now, I have made a compromise: angles less than 180° (measured on the inside of the contour) have been rounded, but angles larger than 180° have not, except for when they approach 360° (i.e. ink traps). Is this a reasonable approach, or does it seem inconsistent?</p>
