    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Italic</strong></p>
    <p>Italic is another style of letter, akin to <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a>, but with a more humanist&nbsp;nature. </p>
    <p>Italic is not the opposite of Roman, though. It is the opposite of <a href="/node/12475" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Oblique</a>. Oblique styles may also be called Sloped Roman, and they are mostly the same letterforms found in a Roman face, with a mechanical slant applied (See <a href="/node/12475" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Oblique</a>). “True” Italic letterforms have been drawn so that they are more formally differentiated from upright <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> letters, the inclination or “cursiveness” (<a href="/node/39906" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cursive</a>) is natural to Italics, as it has been conserved from its origins (See <a href="/node/14192" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aldus Manutius</a>).</p>
    <p>Also some formal aspects such as the particular glyphs used to represent letters are characteristic of Italics. The lowercase “a” for instance, is not the humanist lowercase “a” (As in Helvetica), but the much more rounded “a” similiar to the one seen in Avant Garde for example. Another character that makes Italics easy to distinguish is the lowercase “f” which extends below the&nbsp;baseline.</p>
    <p>Both Oblique and Italic are used for similar proposes within texts, sometimes for emphasizing or to make a citation evident, even though whole texts can be writing in Obliques or Italics. Fonts may include Obliques or Italics, <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a>’s <a href="/node/13517" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frutiger</a> uses obliques but <a href="/node/15609" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frutiger Next</a> has Italics, for example.<br>
    In the last years more and more attention is being put unto this difference, and fonts with Italics are gaining value for their aesthetic gain (seen as positive diversity).<br>
    The new Sans bundled with Windows Vista for example, have all specially designed&nbsp;Italics.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/19418">Italicize this!</a><br><a href="http://typophile.com/node/13743">Tips for Constructing True&nbsp;Italics</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.creativepro.com/story/feature/24681.html">dot-font: Slanted&nbsp;Communication</a></p>
