    <p><strong><a href="/node/12010" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Indices</a> : <a href="/node/98033" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Terminology</a> : Italic</strong></p>
    <p>Italic is another style of letter, akin to <a href="/node/14507" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Roman</a>, but with a more humanist nature. </p>
    <p>Italic is not the opposite of Roman, though. It is the opposite of <a href="/node/12475" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Oblique</a>. Oblique styles may also be called Sloped Roman, and they are mostly the same letterforms found in a Roman face, with a mechanical slant applied (See <a href="/node/12475" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Oblique</a>). "True" Italic letterforms have been drawn so that they are more formally differentiated from upright <a href="/node/14507" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Roman</a> letters, the inclination or "cursiveness" (<a href="/node/112917" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Cursive</a>) is natural to Italics, as it has been conserved from its origins (See <a href="/node/14192" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Aldus Manutius</a>).</p>
    <p>Also some formal aspects such as the particular glyphs used to represent letters are characteristic of Italics. The lowercase "a" for instance, is not the humanist lowercase "a" (As in Helvetica), but the much more rounded "a" similiar to the one seen in Avant Garde for example. Another character that makes Italics easy to distinguish is the lowercase "f" which extends below the baseline.</p>
    <p>Both Oblique and Italic are used for similar proposes within texts, sometimes for emphasizing or to make a citation evident, even though whole texts can be writing in Obliques or Italics. Fonts may include Obliques or Italics, <a href="/node/34726" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Adrian Frutiger</a>'s <a href="/node/13517" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Frutiger</a> uses obliques but <a href="/node/15609" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Frutiger Next</a> has Italics, for example.<br>
    In the last years more and more attention is being put unto this difference, and fonts with Italics are gaining value for their aesthetic gain (seen as positive diversity).<br>
    The new Sans bundled with Windows Vista for example, have all specially designed Italics.</p>
