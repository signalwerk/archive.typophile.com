  html: <p>I am posting samples from a few members of a font family I am building. The basic pattern or decision set is common to each memeber of the font but the overlay is different. The set of rules I gave myself were that the font should be monospaced, that it should fit a square grid &amp; the 'A' would fit in 5 across by 7 tall. The font has a full character set too which is partially presented here. Eventually I am thinking of making a non monospaced but still grid based version &amp; maybe expanding &amp; contracting the grid. At the rate I am going I amy end up with 500 fonts once I do weights &amp; so on. Before I go nuts with this I would like some feedback about my basic design choices. Because the font is made on a common bitmap format it has alot in common with other bitmapped fonts like The Process Type Foundry's 'find replace', thirst type's bitmaped offering &amp; even my clock radio's glowing blue LEDs. <br> <br> <img src="http://www.typophile.com/forums/messages/29/27927.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/27928.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/27929.gif" alt=""> <br></p>
