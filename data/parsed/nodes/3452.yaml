    html: "<p>To me this project has one distinct merit: to have different fonts be highly interchangable. Individually the fonts (especially the first one) are nothing highly interesting in my opinion, but the fact that one font can be used to highlight/differentiate words in a body of another (with affecting flow) is appealing, and useful in some contexts. <br> <br>Making them monospaced is not a requirement in this regard, on the other hand being monospaced allows you to swap in any <i>letters</i> without affecting flow, and that can be interesting in animation for example. <br> <br>hhp <br></p>"
