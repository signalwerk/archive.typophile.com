    html: <p>I should laso say that I had a hard time deciding whwere to post this - bitmapped/script, serif ( here) or in display. I took the advice of another typophile &amp; put it here. It does seem to me that a monospaced area might be the best place for it since the issues this font deals with have fairly little to do with serif type as we typically think about it.</p>
