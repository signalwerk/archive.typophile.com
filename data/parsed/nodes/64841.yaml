  html: |-
    <p>Miss Tiffany beat me to it, but I wanted to say (with the help of P22) I've released my first typeface: Stickley Text Pro, and thanks for the help and support - especially to jackson and paragraph for the seeds of clarity to get me functional - to all the random conversations that helped along the way.</p>
    <p>You can find it here: <a href="http://www.p22.com/ihof/stickley.html" title="http://www.p22.com/ihof/stickley.html">http://www.p22.com/ihof/stickley.html</a></p>
    <p>So, thanks. Hope you like it.</p>
    <p>Michael</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_4550.png"></div><p></p>
