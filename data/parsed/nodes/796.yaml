    html: <p> I'm going to propose that the art and artistry of lettering is not less valued today. I'm guessing that the businessmen of the sign painter era were just as annoying to work with. There is something inherent in hand lettering that allows for more innovation. Every time the letters are drawn they have to be reinterpreted. Often within the same word you'll see different treatments of the same letter. If designers were to custom render letterforms more frequently in our era, we would see an amazing typographic renaisance. </p>
    html_clean: <p> I'm going to propose that the art and artistry of lettering is not less valued today. I'm guessing that the businessmen of the sign painter era were just as annoying to work with. There is something inherent in hand lettering that allows for more innovation. Every time the letters are drawn they have to be reinterpreted. Often within the same word you'll see different treatments of the same letter. If designers were to custom render letterforms more frequently in our era, we would see an amazing typographic renaisance. </p>
