    html: <p> Perhaps...one might conclude that in times past, the art and artistry of lettering was much more important/more valued/more powerful than it is today. I think, for example, we have yet to have a discussion here at Typoophile about the title and credits letterers of movies from the days when it was all done by hand. It never ceases to amaze me how brilliant these "old-time" movie-titling artists were. </p>
