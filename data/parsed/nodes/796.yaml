    date_raw: 22 May 2002 — 11:23am
    votes: null
    html: <p> I agree that we have seen somewhat of a renaisance in the last few years with typographic experimentation via the computer. However, a sign or logo that uses an umodified font (whether there are a million or ten million fonts available) is still constrained in ways that a sign created from scratch isn't. In other words, I think there is a false separation between typographers and type designers. If more typographers were to create the letters they use for logos, titles, signs etc., we would see much more diversity and innovation. </p>
    html_clean: <p> I agree that we have seen somewhat of a renaisance in the last few years with typographic experimentation via the computer. However, a sign or logo that uses an umodified font (whether there are a million or ten million fonts available) is still constrained in ways that a sign created from scratch isn't. In other words, I think there is a false separation between typographers and type designers. If more typographers were to create the letters they use for logos, titles, signs etc., we would see much more diversity and innovation. </p>
