      <p>ID-1 (top) must be: <strong>Century Schoolbook [Bold]</strong><br>
      <a href="http://new.myfonts.com/fonts/bitstream/century-schoolbook/" title="http://new.myfonts.com/fonts/bitstream/century-schoolbook/">http://new.myfonts.com/fonts/bitstream/century-schoolbook/</a></p>
      <p>ID-1 (bottom) could be: <strong>DIN 30640 Neuzeit Grotesk Bold Condensed</strong><br>
      <a href="http://new.myfonts.com/fonts/agfa/dinschrift/din-30640-neuzeit-grotesk-bold-condensed/" title="http://new.myfonts.com/fonts/agfa/dinschrift/din-30640-neuzeit-grotesk-bold-condensed/">http://new.myfonts.com/fonts/agfa/dinschrift/din-30640-neuzeit-grotesk-b...</a></p>
      <p>ID-2 must be: <strong>BauerBodoni</strong><br>
      <a href="http://new.myfonts.com/fonts/agfa/bauer-bodoni/" title="http://new.myfonts.com/fonts/agfa/bauer-bodoni/">http://new.myfonts.com/fonts/agfa/bauer-bodoni/</a></p>
      <p>ID-3 seems custom and I don't know any similar ones</p>
