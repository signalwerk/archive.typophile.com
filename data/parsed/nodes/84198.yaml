    html: |-
      <p>Daniel,<br>
      I think you're about a mile away from your brief and moving back and forth in four-foot increments. So you know that you're not alone, I get this feeling from the entire rapping visual arts scene. Generally speaking, there's no visual sophistication there.<br>
      My advice is that you get out of your studio and go for a walk to clear your mind of what you've done on the project already, perhaps to a library or art museum. Find some art that you feel is to the level your brief demands: the most mature, sophisticated, feminine art available. It need not be type-related. Then ask yourself why it accomplishes what it does, and what allows it to do this. If you will take your lessons as they come and begin to let them open your eyes, they'll see you through this little logotype exercise.</p>
