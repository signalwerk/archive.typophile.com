    html: |-
      <p>Haha. How did I miss this thread?</p>
      <p>Yes, it is <a href="/wiki/DIN" class="freelinking" rel="nofollow">DIN</a> Mittelschrift, but I shortened the descent of the j since it was painfully awkward and lonely sticking out front. The client insisted on a lowercase j, which I didn't like at the time. But, since it's grown on me. The only reason I didn't use <a href="/wiki/FF%20DIN" class="freelinking" rel="nofollow">FF DIN</a> was because we had the license to the <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> version.</p>
