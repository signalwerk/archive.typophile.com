    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Robert Wiebking</strong></p>
    <p>Robert Wiebking was born in Germany in 1870, the oldest son of an engraver. In 1881 the family came to Chicago where his father made engraving machines and cut type matrices for the Marder &amp; Luse type foundry.</p>
    <p>When Robert was 14, he went to work for C. H. Hanson, an engraving company. By 1893 he had set up his own engraving business and was cutting matrices for both the Crescent and Independent Type Foundries. In 1900 he formed the Advance Type Foundry with H. H. Hardinge. Together the two men designed various pieces of machinery including precision tools for matrice fitting, an air driven automatic tool to break the casting sprues or jets off type bodies, and an automatic casting and finishing machine for type. The improvements allowed Wiebking to cut the matrices for the 14 point size of <a href="/wiki/Frederick%20Goudy" class="freelinking" rel="nofollow">Frederick Goudy</a>’s <a href="/wiki/Kennerley" class="freelinking" rel="nofollow">Kennerley</a> type, then cast and finish 400 lbs. of the type in 41 hours.</p>
    <p>Hardinge left the partnership in 1914 when Wiebking merged Advance with the Western Type Foundry. Five years later the Western Foundry merged into Barnhart Brothers &amp; Spindler Foundry. Several years later, Wiebking set up a small shop where he cut matrices for F. W. Goudy, the original <a href="/wiki/Centaur" class="freelinking" rel="nofollow">Centaur</a> matrices for <a href="/wiki/Bruce%20Rogers" class="freelinking" rel="nofollow">Bruce Rogers</a>, as well as matrices for the <a href="/wiki/Barnhart%20Brothers%20and%20Spindler" class="freelinking" rel="nofollow">Barnhart Brothers &amp; Spindler</a>, the <a href="/wiki/American%20Type%20Founders" class="freelinking" rel="nofollow">American</a>, <a href="/wiki/Inland%20Type%20Foundry" class="freelinking" rel="nofollow">Inland</a> and <a href="/wiki/Keystone%20Type%20Foundry" class="freelinking" rel="nofollow">Keystone</a> Type Foundries, and for John Haddon and Co. and <a href="/wiki/Stephenson%20Blake" class="freelinking" rel="nofollow">Stephenson Blake</a> in England. Later he cut matrices for <a href="/wiki/Ludlow%20Typograph" class="freelinking" rel="nofollow">Ludlow Typograph</a> and built several matrice cutters for them as well as trained their staff to use them. Among the people he trained to cut matrices were Frederick W. Goudy and <a href="/wiki/Robert%20Hunter%20Middleton" class="freelinking" rel="nofollow">Robert Hunter Middleton</a>.</p>
    <p>Typefaces designed by Wiebking: Artcraft &amp; Bold &amp; Italic, Caslon Clearface &amp; Italic, Engraver's Litho Bold &amp; Condensed, Advertiser's Gothic &amp; Condensed , Bodoni Light &amp; Italic, Caslon Catalog, Collier Old Style, Engraver's Roman,  Munder Venezian,  Steelplate Gothic Shaded.</p>
    <p>Related link: <a href="http://nobodoni.com/wiebking.html" title="http://nobodoni.com/wiebking.html">http://nobodoni.com/wiebking.html</a></p>
