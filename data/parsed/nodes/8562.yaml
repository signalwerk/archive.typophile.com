    html: <p>Yes, Hrant and John, I agree... I joined ATypI because I love type, and no one would choose to study type design because he/she wants to make tons of money. So, yes, I think the most important thing is the community that you get when you join an association like ATypI... <br> <br>BUT, with the internet, it might be just as easy to get support from other typographer/type designers... A good example is this board. I would still like to see tangible support and benefits, beause it is not cheap to join. I'm really not the kind who thinks about economic returns... it's just that I don't have a ton of money to spend. <br> <br>I'm more than happy to help... I would in fact like to get some local involvement for the next ATypI, and to involve myself. <br> <br>K.</p>
