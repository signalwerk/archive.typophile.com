  - id: 158064
    user: 1551
    date: 2006-09-15T07:23:00
    date_raw: 15 Sep 2006 — 7:23am
    votes: null
    html: |-
      <p>Chris, I personally don't think it's a matter of display vs text, but what your suits your design best. </p>
      <p>I just checked the print-out, and in the smaller size the higher contrast is not as noticeable. But I think this is because of the toner spread, which has percentage wise more of an effect in small size. </p>
      <p>I think you might look at the contrasts in Souvenir, and how that has been handled. Your Froggy is a crisper version of the kind of thing that Souvenir and Cooper Black do. </p>
      <p>I read in Mac McGrew's book that Benton drew only the medium weight, and Benguiat added the light and popular heavy weights. I don't find the light weight of Souvenir very satisfactory, but the medium and heavy are very good. </p>
      <p>On the joins vs other parts, as you know from my TypeCon talk about my Caslon revival, I think that the joins have a different visual logic than other parts, and one can thin the joins more than the rest, as Unger has done in his faces. </p>
      <p>And yes, your o is better. But I think also the joins need to get fatter, quicker longer coming out of the stems if that makes sense. That is if you want a very thin join. Also where the thin line coming into the thick line has more space, as in the e, it needs to be more like the top of the o and e, I think. You will need to proof this actually on a high resolution image-setter to get an accurate concept of the effect in small sizes.   </p>
      <p>Somehow I feel that because your design is quite wide, and the joins are relatively low, you don't really need a sharp join. The top of the mnr will still look clearly separate--particularly with your semi-serif action. </p>
      <p>Also I suspect that a light weight just won't work, as Benguiat's light Souvenir flops, where his heavy is a big winner. </p>
      <p>By the way, I know some people hate Souvenir, but they are wrong. My local library uses it on all signs, and it works great. It projects a friendly, welcoming image, while being very readable and disciplined. Your version is more hip and more crisp, but in the same space emotionally, with its warmth and touch of informality.</p>
