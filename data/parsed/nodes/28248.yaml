    html: |-
      <p>You shouldn't make the right stroke of the w as heavy as the right side of the o.<br>
      The reason being that it's OK in the o, because its left side is far away. However, the w has closely spaced strokes. (The principle is kind of like the building density allowed by bylaws.) You could perhaps keep the w strokes the same width, but you would have to make the whole character much wider.</p>
    html_clean: |-
