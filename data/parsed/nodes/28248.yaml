      <p>Thanks William, I think what the g needs (after so much bezier poking and pulling) is to go through a resmoothing process.  The curves get wounded after doing so much battle. Regarding te "thin joins" I think I need a hi rez output to see what effect that is. What I see from my laser printer looks fine, or even too heavy at the joins in small sizes.<br>
      While Typophile was down, I did several revisions including heavier serifs.  I just thinned them up somewhere between yesterday because the heavier serifs both looked too Clarendon-like to me and gave the font an off balance look.  I think a semiserif can't have the same serif weight as a full serif without getting the leaning tower look.</p>
      <p>ChrisL</p>
