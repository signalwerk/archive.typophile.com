      <p>&gt;i disagree that the regular weight needs to be any narrower.<br>
      General disclaimer: that suggestion had a question mark after it for a reason, and similarly I have tried to put everything as ideas to try, not definite judgments. This is not only because of appropriate modesty but because in my critiques on typophile I just look and write the first thing that comes into my head about what might improve the face. But it might well hurt it as well. So they are intended as brainstorming trial ideas, and with no pretense to being expert judgments.</p>
      <p>Chris, I really like your latest version in the graphic--I can't open the PDF for some reason. I think you were right to add more contrast back. I suspect Andre is right about about the g--good catch. I can see what is really tricky here is that changing the weight changes the counters and/or the outside, and you can't preserve both. So you have the challenge of figuring out what will preserve the look, or work best, depending on your goals...</p>
