      <p>You're going to Guantanamo!</p>
      <p>Unless you pull an Alberto Gonzalez I-don't-recall defense.</p>
      <p>I think your obligation is to let your friend know his activities are illegal and that you don't approve, but as far as ratting him out...? I dunno. Gets into a grey area. Am I gonna report everyone I know who messes around with their tax returns? Hardly (altho the thought did cross my mind after an ex cheated on me). And it's not like you're going to be held liable for knowing and keeping silent. There's no font police that I'm aware of, nobody's life is in danger, and reporting your friend sounds awfully iron curtain to me.</p>
