      <p>Your responsibility is to tell your friend that browser font embedding is a rather useless and silly technology that never really got off the ground.</p>
      <p>"I think your obligation is to let your friend know his activities are illegal"</p>
      <p>Are they illegal? Or is it merely a breach of contract? Or is this just a semantic issue?</p>
      <p>"therefore find I care about making sure font designers get their due."</p>
      <p>IMHO, embedding or not really seems to have no effect on the designer of the font. What's it to them if it's embedded on a web page or not?</p>
