      <p>FL zooms are keyed to the cursor position. Use the z and x keys by themselves to zoom in and out with the cursor as the target. I find this an incredibly useful feature, you can be editing a point on the outline, and you can zoom in or out while you are moving the point.</p>
      <p>Also you can make the "nodes" larger (and in color) in the Glyph WIndow Preferences.</p>
      <p>I do agree that ramping up some of default colors, makes it easier to see. I generally change the "global mask" red to a darker purple.</p>
      <p>JamesM</p>
