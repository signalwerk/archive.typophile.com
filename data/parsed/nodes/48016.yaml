    html: <p>HELP! Fontlab Studio 5. Blend command doesn't work properly. Take two absolutely compatible masters, blend, tell it not to change any points, and every curve point is changed to a corner point and the handles are changed, wrecking the design. How do you get around this?</p>
  - id: 293861
    user: 1947
    date: 2008-08-06T12:38:00
    date_raw: 6 Aug 2008 — 12:38pm
    votes: null
    html: |-
      <p>Bill, </p>
      <p>Do not use the blend feature. Use the Mask-to-Master technique to make a MM vfb.</p>
      <p>Place one of your designs on the Mask Layer and use Tools&gt;Multiple Master&gt;Define New Axis to create a weight or width or optical size axis. THen use Tools&gt;Multiple Master&gt; Mask to Master to create the MM instance. Make sure you indicate that you do not wan FL to add points. </p>
      <p>This is a much more reliable method than using "Blend"</p>
      <p>There was a thread on this a few weeks ago.</p>
      <p>JamesM</p>
