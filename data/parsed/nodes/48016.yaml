      <p>Here's an interface peeve:<br>
      If you ever hook up an external monitor to your Apple laptop, MAKE SURE that all of your windows are in the native monitor before removing the external.</p>
      <p>I left open my opentype features panel on the external monitor, unplugged, then went to work. When I got there, Fontlab expected that the external would be there as well, so it put the features panel where it thought the monitor was. </p>
      <p>Which was... Nowhere! </p>
      <p>There was no way to get access to the panel, except to go home and plug back in the monitor and drag the window over.</p>
      <p>Not the end of the world, but it was annoying.</p>
