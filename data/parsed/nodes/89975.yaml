    html: |-
      <p>I’m pretty sure it’s hand done. See how the imperfections in the same letters are different?  That’s a pretty good sign it’s hand done. When you see a “degraded” looking typeface, but every messy e looks exactly the same, that’s a dead give away that its a font, and not natural. There are, however, some fonts that have alternate characters to avoid this, but they are few. Without having looked into it, I would hazard a guess that this piece is fashioned after a pre-existing script with some of their own hand-writing mixed in.</p>
      <p>Good luck!</p>
