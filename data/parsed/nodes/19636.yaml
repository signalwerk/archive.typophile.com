  html: |-
    <p>Hey All,</p>
    <p>So the misses brings home some snappy pillowcases from Linens n Things and proceeds to open the packages . . .</p>
    <p>We look down and see one of the cardboard inserts that holds the fabric stiff has some scrawls from a ballpoint pen on it but we can't make out what it says - I believe it's freehand Arabic cursive but can't be certain . . .</p>
    <p>So I decided to open up this mystery to my fellow Typophiles to help us figure out what it says . . . Think you know? Let's all find out together shall we? :D</p>
    <p>Thanks in advance for your help . . .</p>
    <p>Stuart :D</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/note_5148.jpg"></div><p></p>
