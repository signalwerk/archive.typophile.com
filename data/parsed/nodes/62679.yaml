  html: |-
    <p>I'm trying to write a script that checks the compatibility of glyphs before generating a MM font.</p>
    <p>I wrote this which works for single glyphs </p>
    <p><code><br>
    ========================<br>
    from robofab.world import OpenFont<br>
    lightFont = OpenFont(None)<br>
    boldFont = OpenFont(None)<br>
    #<br>
    #<br>
    print lightFont.info.fullName,"/",boldFont.info.fullName</code></p>
    <p>print lightFont["A"].isCompatible(boldFont["A"], True)<br>
    ========================<br>
     </p>
    <p>I really wanted to do it with a loop, and loop through the whole font. </p>
    <p>I tired this, but it gives me a list saying all the glyphs are compatible but I know they are not. </p>
    <p><code><br>
    ========================<br>
    from robofab.world import OpenFont<br>
    lightFont = OpenFont(None)<br>
    boldFont = OpenFont(None)<br>
    #<br>
    #<br>
    print lightFont.info.fullName,"/",boldFont.info.fullName</code></p>
    <p>for glyph in lightFont:<br>
    	print lightFont["glyph"].isCompatible(boldFont["glyph"], True)</p>
    <p>print lightFont["B"].isCompatible(boldFont["B"], True)</p>
    <p>========================<br>
     </p>
    <p>I changed the outline of the "B" and tested the compatibility after the loop and it tells me they are not compatible but the loops tells me they are </p>
    <p>How can I loop through both fonts and test there compatibility ?</p>
