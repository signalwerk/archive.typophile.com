    html: |-
      <p>I would suggest to loop through the *glyph names* instead of the *glyph objects*:<br>
      <code><br>
      from robofab.world import OpenFont<br>
      lightFont = OpenFont()<br>
      boldFont = OpenFont()</code></p>
      <p>print lightFont.info.fullName, "/", boldFont.info.fullName</p>
      <p>for glyphName in lightFont.keys():<br>
      &gt; lightGlyph = lightFont['glyphName']<br>
      &gt; boldGlyph = boldFont['glyphName']<br>
      &gt; print lightGlyph.isCompatible(boldGlyph, True)<br>
      </p>
      <p>-Paul van der Laan<br>
      <a href="http://www.type-invaders.com" title="www.type-invaders.com">www.type-invaders.com</a></p>
