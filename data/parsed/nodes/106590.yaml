      <p>The one on the right ('CAREERS', 'CONTACT US'...) is one of their exclusiive and proprietary font called 'WMF Sketch Carton', a sketched version of <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-scala-sans/" rel="nofollow">Scala Sans FF</a>. You'd find some good alternatives browsing fonts tagged '<a class="freelinking external" href="http://www.myfonts.com/search/tag%3Asketch" rel="nofollow">sketch</a>' at MyFonts.<br>
      For the ones on the left, sorry but can't recognize any. Could be either bespoke or freebies. Having also a look at MyFonts to fonts tagged '<a class="freelinking external" href="http://www.myfonts.com/search/tag%3Achalk" rel="nofollow">chalk</a>' should be helpful. Google is also your friend. Some searches like '<a href="/wiki/https%3A/%252Fwww.google.com/search%3Fhl%3Den%2526source%3Dhp%2526q%3Dbest%2Bchalk%2Bfonts" class="freelinking" rel="nofollow">best+chalk+fonts</a>' should work perfectly. Many people have posted their best picks.</p>
