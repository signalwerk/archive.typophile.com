    <p>Hello my friends, im designing a blackboard sticker for a basket of whole wheat oatmeal cookies that im selling in Mexico, i want to put the prices and the names of the products in the sticker to show the people that information, so i have a special request for you, i was watching this chalkboard fonts in the whole foods website that looks realy awesomes, but i dont know their names, Can somebody help to ID any of this fonts in the picture, specialy the ones in the left side?</p>
    <p>thank you for your help :D</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-2_6053.jpg"></div><p></p>
