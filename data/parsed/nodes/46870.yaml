  html: |-
    <p>Check out our eco-bag!</p>
    <p>Featured in the DECOB exhibit that opened in Toronto last night at<br>
    Keep Six Contemporary Gallery.</p>
    <p>Hand Made Eco Bag Show – Eco-Bag / Eco-Life runs from June 26 - July 6, 2008</p>
    <p>Artists from around the world were invited to participate in this exhibition and asked to use cloth bags as a canvas to express their thoughts about global environmental issues. The hand-made eco-bag, Decorated Eco-Bag (aka DECOB) will be shown to international audiences in an effort to raise awareness of environmental issues and as a call to take active initiatives.</p>
    <p>Great idea, and some super fine bag designs came out of this! The show will be doing some international touring, be sure to check it out if it reaches your city.<br>
    This exhibit will travel to the following cities: Tokyo, Osaka, Hong Kong, London and New York.</p>
    <p>All original works will be for sale.</p>
    <p>Also available limited edition print bags by artist Jade Rude,<br>
    typotherapy + design and Keep Six</p>
    <p>Keep Six Contemporary 938 Bathurst Street, Toronto, Canada<br>
    <a href="http://www.keep6c.com" title="www.keep6c.com">www.keep6c.com</a> www.typotherapy.com</p><div class="imageWrap"><img src="http://typophile.com/files/typo-bag_4354.jpg"></div><p></p>
