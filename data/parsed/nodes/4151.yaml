    <p><img src="https://web.archive.org/web/20080709010539im_/http://www.typophile.com/forums/messages/83/32784.jpg" alt="slope"> <br> <br>Perhaps someone can point out the source for the type on this album cover, designed by <a href="https://web.archive.org/web/20080709010539/http://www.jutojo.de/" target="_blank"> Jutojo</a>. <br> <br>It looks familiar, perhaps I saw it in a book, but I can't quite place the book. It looks like a typeface from the 19th century, (Midolle, Silvestre or Klimsch). A "Dover" book perhaps? Any information would be appreciated.</p>
