    html: <p>Addison,  <br> <br>In a font, each little "picture" (of a letter etc.) is called a glyph. In OpenType PS (.otf) and OpenType TT (.ttf) fonts, most of the glyphs have a Unicode index assigned (they represent default forms of a character). But some glyphs are unencoded and can be reached with a special OpenType Layout feature.  <br> <br>For example, normally, the ligatures fi, fl, ffl etc. would be unencoded and an OpenType-aware application would insert them when the user types the two or three combining letters (e.g. f,i) and has the "ligatures" feature activated in the application. This is how it works in InDesign or Illustrator.  <br> <br>Applications that do support Unicode but don't support OpenType Layout can only access the glyphs that have Unicode indexes but cannot access these special "smart" features. So the ligatures would be inaccessible. Therefore, for these kinds of applications, some font vendors assign so-called Private Use Area indexes (custom Unicodes) to these glyphs. You can then enter the ligatures or alternates as "symbols" -- when inserted into text, they will most likely break hyphenation and spellcheck algorithms in the running text, but at least they will be visible. Corel DRAW 12 belongs to this category of programs.  <br> <br>Other than that, I think Corel DRAW 12 is a great drawing program. Every time I try to do some simple layout in Illustrator, I get frustrated and revert to Corel DRAW <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br>Adam <br></p>
