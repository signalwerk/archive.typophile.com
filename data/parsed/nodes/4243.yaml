    html: <p>The glyphs can be either encoded or unencoded, actually. Some of the f-ligatures have standard codepoints to enable compatibility with legacy encodings (like MacRoman which has fi and fl). <br> <br>On top of this, Adobe has a possibly bad habit of encoding all glyphs in its fonts, to allow you to work more effectively with them in apps that are Unicode savvy but not OpenType savvy, such as CorelDraw 12. So you may be able to use the Windows CharMap to get at these glyphs in Adobe's OpenType fonts. This approach is not necessarily portable, and messes up the underlying text representation, but it does allow you to get at the glyphs you want. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>The glyphs can be either encoded or unencoded, actually. Some of the f-ligatures have standard codepoints to enable compatibility with legacy encodings (like MacRoman which has fi and fl). <br> <br>On top of this, Adobe has a possibly bad habit of encoding all glyphs in its fonts, to allow you to work more effectively with them in apps that are Unicode savvy but not OpenType savvy, such as CorelDraw 12. So you may be able to use the Windows CharMap to get at these glyphs in Adobe's OpenType fonts. This approach is not necessarily portable, and messes up the underlying text representation, but it does allow you to get at the glyphs you want. <br> <br>Regards, <br> <br>T</p>
