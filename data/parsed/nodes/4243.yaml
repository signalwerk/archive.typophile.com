    votes: null
    html: "<p>Ligatures, just like small caps and other \"variant\" glyphs may or may not be encoded in an OpenType font. If they're encoded, they have custom (Private Use Area) codepoints. Applications should not access these glyphs via these codepoints unless they can't manage otherwise. InDesign does it the right way -- it parses the OpenType Layout tables where you have substitutions like:  <br> <br>feature liga { # Ligatures <br>  sub f i by fi;  <br>} liga;  <br>feature smcp { # Small Caps <br>  sub a by a.smcp;  <br>} smcp;  <br> <br>(The above is written in a sort of programming code used by Adobe FDK for OpenType, a free OpenType creation tool; of course in the font, the substitutions are stored as binary code).  <br> <br>So, in InDesign when ligatures are activated and the font contains the f i -&gt; fi substitution, InDesign stores the underlying text as \"f\",\"i\" but \"on the fly\" displays the single \"fi\" ligature. Similarly, for small caps, InDesign internally stores the letter \"a\" but \"on the fly\" displays the \"a.smcp\" glyph.  <br> <br>This way, spellchecking or hyphenation that uses the underlying text still works. This is a great advantage of OpenType over primitive technologies such as \"expert Type 1 fonts\" used by QuarkXPress.  <br> <br>I recommend that you read <a href=\"http://www.myfonts.com/info/opentype/\" target=\"_blank\">http://www.myfonts.com/info/opentype/</a> for more information.  <br> <br>Adam <br></p>"
