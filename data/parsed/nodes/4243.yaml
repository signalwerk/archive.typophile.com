  html: <p>I've only recently discovered that the fl and fi ligatures are not standard (I can't get to them!) on Windows type 1 fonts. Is there any way around this other than moving glyphs within the font? PopChar is now available for Windows, but I think it only allows the standard set of characters. Is there any difference with Windows TrueType? <br> <br>Thanks, <br>Addison</p>
  html_clean: <p>I've only recently discovered that the fl and fi ligatures are not standard (I can't get to them!) on Windows type 1 fonts. Is there any way around this other than moving glyphs within the font? PopChar is now available for Windows, but I think it only allows the standard set of characters. Is there any difference with Windows TrueType? <br> <br>Thanks, <br>Addison</p>
