    html: <p>If you've got a Unicode enabled application and a TrueType or OpenType font that actually has the ligatures, you should be able to get at them with PopChar or the Windows CharMap accessory. <br> <br>For Type 1, the glyphs are normally unencoded even if present (they are present in pretty much all Adobe's Type 1 fonts). The only applications I know of that can access the ligatures in normal Type 1 fonts are InDesign (any version, will use them automatically) and Illustrator CS (but you need to use the Glyph Palette in Illustrator). <br> <br>Hope that helps. <br> <br>T</p>
