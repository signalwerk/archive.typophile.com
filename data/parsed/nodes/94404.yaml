    <p>Statut is a ceremonial, elegant and highly readable display typeface with humanistic proportions based on Renaissance inscriptions. </p>
    <p>This sophisticated typeface is excellent for a variety of uses, including branding of hotels, cafes, restaurants, packaging of premium-class food products, editorial design as well as for projects in fashion industry. Also Statut will fit within projects with a potentially high cultural and historical significance. </p>
    <p>Statut typeface has been created under the influence of calligraphic works by Belarusian artist Pavel Semchenko. Works by Semchenko reveal the essence as well as unique characteristics of Belarusian writings in the slavic writing system.</p>
    <p>You can try and buy font on Myfonts.com:<br>
    <a href="http://www.myfonts.com/fonts/deniserebryakov/statut/" title="http://www.myfonts.com/fonts/deniserebryakov/statut/">http://www.myfonts.com/fonts/deniserebryakov/statut/</a></p>
