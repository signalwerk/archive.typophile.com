    <p>Does anyone know of a font similar with this? The name of the font appears on the top of the scan together with the foundry name and the year but I haven't seen anything like this digitized. I think it looks wonderful and I was wondering how the rest of the letters of the alphabet look like. So please, if anyone has some examples similar with this it would be great! Thank you in advance.</p><div class="imageWrap"><img src="http://typophile.com/files/Bruce Monograms_3918.jpg"></div><p></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Monogram Caps, No 530 by Edwin C. Ruthven, 1873         </div>
            </div>
