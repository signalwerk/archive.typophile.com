      <p>Hey Don, I have no words to thank you for all this. Truly! And I really appreciate all the effort you put into uploading the specimen. I love this font! I hope to be able to recreate it, especially now that I know how some of the letters look like. I was having trouble imagining how the letters X, K, and Y would look like. And yes, the typeface was cut by Edwin Ruthven from the Loy's book. Thank you again!</p>
      <p>Stefan</p>
