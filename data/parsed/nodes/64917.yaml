      <p>It doesn't look like any grid is in use, and a grid is paramount with this kind of aesthetic. Weights of fonts are all so close, that nothing stands out.. there is no sense of hierarchy.</p>
      <p>Here is what I would do if I were you:</p>
      <p>1. Create a grid (something that is flexible enough to allow for plenty of modularity).</p>
      <p>2. Pay attention to spacing. Keep all the spacing even (or at least visually balanced)</p>
      <p>3. Use variety in weight, and add color LAST. Color is often a false sense of hierarchy. If it doesn't work in B&amp;W, it won't in color.</p>
      <p>4. TEST your hierarchy by taking a screen shot, putting it in photoshop and adding a Gaussian blur. You should be able to pick out your 1st 2nd and 3rd levels, even though you may not be able to read them.</p>
      <p>Maybe also try adding some solid or dotted rules to cut up the space. And don't be afraid of white space.</p>
      <p>Hope that was mean enough ;)</p>
      <p>evan m</p>
      <p><a class="freelinking external" href="http://www.evanmade.com">http://www.evanmade.com</a></p>
