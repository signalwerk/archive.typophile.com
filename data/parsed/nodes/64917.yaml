    html: <p>Big gap after the first line annoys me. The ampersand can hang, but why do the two THEs at the top not follow the left margin of the other bit. 2009 would probably look better if it matched the baseline and cap height line of the rest of the date. I wouldn't use oldstyle figures in a poster that is all uppercase. OSF are really upper and lower case numerals. NEW YORK is the largest type on the page. Is it a key fact? (IS there really only one P in Shepard?</p>
