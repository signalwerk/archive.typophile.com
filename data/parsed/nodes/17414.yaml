      <p>Many eco-tourists would find the sexual stereotyping offensive.</p>
      <p>They may be confused, because male frogs are generally smaller and more angular than female frogs (eco tourists know stuff like that). Some might even think the cute frog with the lashes and flower denoted the john for drag queens.</p>
  - id: 105047
    user: 5022
    date: 2006-01-20T08:24:00
    date_raw: 20 Jan 2006 — 8:24am
    votes: null
    html: <p>Thank you very much Nick. In fact there is a broad public here not only ecotourists, also locals, lots of kids and regular non eco tourists which may find the flower cute, like hawaii welcome style. Although, what´s wrong with sterotypes anyway in this case?, i think stereotyping may be efective sometimes to put generic things in its very own place, in this case its not generic but gender. Anyway, does anybody knows something like a restroom signage collection?</p>
  - id: 105185
    user: 2289
    date: 2006-01-21T04:51:00
    date_raw: 21 Jan 2006 — 4:51am
    votes: null
    html: |-
      <p><a href="http://www.amazon.co.uk/exec/obidos/ASIN/8489994897/qid=1137846656/sr=1-22/ref=sr_1_0_22/026-4836135-4073226" rel="nofollow">This book</a> has, amongst many other pictograms, quite a few toilet signs.<br>
      I think that any multi-language signage should, if practicable, avoid type or clearly define the languages, possibly by different fonts or members of a type family. I think that many would find your illustrations confusing or at least hindering, it might be an obvious/cliche solution but the silhouette style of man and woman is internationally known, when somebody is looking for a toilet the silhouette symbol(s) are what they would expect/hope to see, there is still room for applying a style. Does the other signage in the hotel include the frog motif or do these work on their own, in which case how does it relate to that signage?<br>
      Tim</p>
