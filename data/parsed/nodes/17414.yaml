    <p>Hi guys, newbie around... i am  working on this rest room signage for an eco-touristic hotel at Mexico. A lot of foreigners come and stay here, so i dont know how to approach the work in order to function for a multicultural public. I started with these characters i made for the kids summer camp instead of using the neutral look, i think this can be good but i want to listen good critique... thanks for helping.</p>
