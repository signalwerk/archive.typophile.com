      <p>Here are some examples I've found on MyFonts:</p>
      <p><a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/karandash/basil/" class="freelinking" rel="nofollow">Basil</a><br>
      <a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/dootype/bommer-slab-rounded/" class="freelinking" rel="nofollow">Bommer Slab Rounded</a><br>
      <a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/dstype/breve-slab-title/" class="freelinking" rel="nofollow">Breve Slab Title</a></p>
      <p>One clear commonality I found is that the lower-case e clearly is <em>not</em> based on an ellipse. Instead of fighting against Bezier curves to approximate conic sections, or to imitate a quill pen at work, the new freedom afforded by modern type design tools is being put to use.</p>
      <p>And <em>that</em>, of course, points to the superellipse of Piet Hein, and its typographic embodiment by Hermann Zapf - <em>Melior</em> - as a typeface which, although not a member of this group, as being very definitely one of the roots of inspiration that led to it becoming possible.</p>
