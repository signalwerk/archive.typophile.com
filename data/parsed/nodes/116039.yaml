      <p>I'm not sure myself exactly what I'm looking for, what it is about so many contemporary wedge and slab serif faces that make me think of them as almost redrawings of the same face - or at least make me think, apparently incorrectly, that one typeface of this kind, whatever it is, has had a tremendous impact on type designers, making many of them explore that genre.</p>
      <p>In addition to the type, some of these faces - plus some that are normal serif and sans-serif faces - look to me as if they're in the same person's "handwriting", as it were, coming from the same prolific designer. Thus, for some reason, some <em>very</em> subtle typeface characteristics seem to be spreading like wildfire in the type design schools - I've found this tendency most pronounced in faces identified as being from new designers or students.</p>
      <p>Either something strange is going on, or it's just me - I'm so comfortable with the old typefaces from the 1960s and before that I'm lumping contemporary faces together without appreciating them individually.</p>
      <p>I had noticed cut-and-curve in some of those typefaces, but I don't think I considered it a defining characteristic. But at least that one apparently <em>did</em> have a known origin point, the italic of FF Quadraat by Fred Smeijers.</p>
      <p>And then there's Falcon - which actually made it to posthumous availability - and Stuyvesant, which was at least used to typeset <em>The Shirley Letters</em>. W. A. Dwiggins just keeps getting more and more interesting... first, I learn that he designed the digits "dek" and "el", and now this.</p>
