      <p>And going back to the 60s and 70s: Adrian Frutiger's Glypha and Serifa, Margaret Calvert's eponymous typeface Calvert? Haven't slabs – though cleary going in and out of style to a large extent – often closely followed concurrent developments in other typefaces? Both Sans and Serif styles have influenced slabs throughout. Pinpointing an origin "within the style" may not even be enough! Could FF Olsen exist without (less slabby but just as wedgy) 80s typefaces like Charter (which you mention), Oranda and Swift?</p>
      <p>(And even groundbreaking "first typefaces" often tend to be less original if you scratch the surface. Something as supposedly radical as Futura, for example, was wrapped in a cloud of similarly-styled influences.)</p>
