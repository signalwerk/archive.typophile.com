    <p>I've been seeing since about 2000 a new style of typeface all over the place.</p>
    <p>Various typefaces seem to belong to this style; Droid Serif, Adelle, Silica. Finally, though, I noticed that FF Olsen was designed in 2001. Is this the face that everyone else seems to be copying? Or did this general style of face originate at an earlier time? (Of course, I don't mean "general" in the sense of looking for the origin of Egyptians like Stymie.)</p>
    <p>Earlier, I had mistakenly put Gandhi in this category, but now I see that it isn't really this kind of face.</p>
    <p>Even Charter, although not as slab-like as these faces, has some hints of the style.</p>
