      <blockquote><p>I'm not sure myself exactly what I'm looking for, what it is about so many contemporary wedge and slab serif faces that make me think of them as almost redrawings of the same face</p></blockquote>
      <p>I find it hard to pinpoint what it is exactly myself but I've actually been having the same feeling towards many contemporary typefaces. It does seem to be a trend which pops up now and then and I particularly see it in low-contrast wedge serif typefaces.</p>
      <p>Isn't Skolar of the same sort as well? For some reason I often have to think of Skolar and Adelle even though they're quite different from each other. </p>
      <p>Here's a quote from the description of Skolar: "Equally, features such as its relatively large x-height, robust serifs and low contrast make Skolar a reliable choice even at small sizes."</p>
      <p>I feel like those are probably the commonalities between many of these type of typefaces. I think the trend might be to update classical typography to contemporary standards where the ability to read text at smaller sizes becomes even more important (due to the need for scalability in digital typography), and thus you see a higher x-height, a lowering of the contrast and a more minimalist approach.</p>
