      <p>Yes, I wasn't necessarily implying that these 60s and 70s fonts were necessarily part of the same sub group, merely that they – in a similar way – attempt to represent the (then!) contemporary in the slab genre. </p>
      <p>I'm guessing* that different aspects have appeared at different times, and outside the slab genre as well, and that they've gone into new slabs eventually. The super-chunky wedge serifs? One possible starting point (together with Oranda) is Mark Simonson's <a class="freelinking external" href="http://www.marksimonson.com/fonts/view/kandal" rel="nofollow">Kandal</a> (1994), but both are otherwise different (?). The cut-and-curve constructions in many of these typefaces? See the <a class="freelinking external" href="http://typophile.com/node/41687" rel="nofollow">long discussion in this previous thread</a>. And so on.</p>
      <p>*Still without knowing what exactly you're looking for! Perhaps you could draw up a comparison image highlighting some pertinent details, using Myfonts samples?</p>
