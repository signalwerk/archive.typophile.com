    html: |-
      <p>These are very useful comments - thank you all.</p>
      <p>Frode, the usual way to approach design for contemporary art institutions is indeed to use fonts that feel 'contemporary'. Commonly this means using sans serif faces throughout - and I'm keen to avoid that tactic. However, there are obviously more subtle ways of being contemporary - and I will look at the fonts that you are suggesting.</p>
      <p>Nick, I have thought hard today about this question of the relation to the period of the building - I agree it's an important issue. I have ditched Caslon Black. And my latest thought is to use fonts that are a bit earlier in origin: a slightly chunky Modern font for the logo, such as Berthold Bodoni Antiqua; and then a version of Baskerville for the titles and body copy.</p>
      <p>(Frode, you are of course right that the logotype should be treated separately, and perhaps shouldn't be set in a generic font. But at the moment the exercise I am doing is a notional one.)</p>
    html_clean: |-
