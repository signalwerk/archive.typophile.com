      <p>Contemporary art calls for contemporary type, but also something that is silent enough to let the artworks shine.</p>
      <p>How about <a class="freelinking external" href="http://commercialtype.com/typefaces/lyon/lyon_text" rel="nofollow">Lyon Text</a> paired with <a class="freelinking external" href="http://commercialtype.com/typefaces/lyon/lyon_display" rel="nofollow">Lyon Display</a> by Kai Bernau?<br>
      While you’re checking out <a href="/wiki/Commercial%20Type" class="freelinking" rel="nofollow">Commercial Type</a>, you should also pick up a copy of Wallpaper Magazine and see their <a class="freelinking external" href="http://commercialtype.com/typefaces/graphik" rel="nofollow">Graphik</a> surrounded by contemporary art and architecture.</p>
      <p>Another sans that just begs to be used for something like this is <a class="freelinking external" href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/" rel="nofollow">Akkurat</a> from <a href="/wiki/Lineto" class="freelinking" rel="nofollow">Lineto</a>.</p>
      <p>UK based <a class="freelinking external" href="http://www.a2swhk.co.uk/" rel="nofollow">A2/SW/HK</a> have a lot of design work that revolves around contemporary art and might serve as inspiration for you. They draw a lot of their type themselves, something you should perhaps consider for your project as well.</p>
