    <p>I am thinking about fonts to use in the graphics for a contemporary art institution, and I would really appreciate some advice.</p>
    <p>It's a big old beautiful Victorian building, a public institution in the centre of a city, and the programme ranges from younger artists to mid-career figures. The graphic vehicles include logo, posters, leaflets etc. The design has to communicate authority - even scholarship - but with a contemporary / funky edge. (Think: dandified librarian).</p>
    <p>I like the idea of using Dave Farey's Caslon Black as the main display font, EG for the logo of the institution. But could anyone recommend a less funky serif font that would go with it? Perhaps with regular and semi-bold weights, for body copy and titles?</p>
    <p>Or does anyone have other suggestions for a combination of serif fonts: a display fonts for the logo; and another font for the rest?</p>
    <p>Many thanks.</p>
