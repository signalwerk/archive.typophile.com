      <p>I would distinguish between typography as done by graphic designers and type design, and focus on typography.</p>
      <p>If you are speaking with visual aids (Powerpoint?), you can demonstrate how a typographer can change the appearance of a page by altering the basic typographic parameters: typeface, size, leading, and paragraph style.</p>
      <p>That way, your expertise in speaking and presenting will be demonstrated in the way that you strike a balance between what you say about the images, and the text that you have written for the descriptive captions in the images.</p>
      <p>It does seem to me that you should be using images in your talk, as the subject is visual. However, if it’s just talking, you could discuss a non-visual aspect of contemporary typography, such as the change that was brought about by digitization; the “how it’s done” in this case would be the emergence of the independent foundry and how we go about our business: technology, design process, marketing, distribution, the difference between royalties from licensed products (passive income) and commissioned work for fee.</p>
