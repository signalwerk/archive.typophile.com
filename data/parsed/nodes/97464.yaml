      <p>Dear Claire, in instances like this you should put aside your passion and think what might interest your audience and not what interests you.</p>
      <p>Assuming your professor demands that you hand in the writing assignment typed in a specific font, size, etc. — this could be a starting point.  Think of your classmates who forget or ignore professor's instructions and as a result get lower grades. To them this might make no sense, but you know that this things matter. </p>
      <p>For example you could pick a font i.e. Times New Roman and talk about its properties, history, how and why it has become the standard choice amongst the academics when there are many other fonts on our computers. Explain why is it a better choice than Arial for longer texts, etc. Good luck!</p>
