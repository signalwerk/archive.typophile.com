  html: <p>Hi all! I have to give a talk for about 7-10 minutes as part of my English course at the university. It has to be an informative talk on a topic of my interest and I have to describe how things are done. I am into typography and would like to give a talk related to it, but I have no idea where to start or what to talk about which will be interesting as well as simple for the students to understand. Can you suggest what I could do or talk about.</p>
