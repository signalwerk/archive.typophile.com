      <p>While 10 minutes can seem like a long time while you're talking, it is really only enough to give an overview of one aspect of typography. What I would choose, because you can show a lot of pictures, is font appropriateness, which fonts can be used for different topics. You could show pictures of both display and text fonts.<br>
      Fonts for business reports, like Skolar and others.<br>
      Unhip over-used fonts, like Times New Roman or MS Comic Sans.<br>
      Warm, friendly readable fonts for a cookbook, such as New Cuisine or Coline or maybe even Turnip.<br>
      Elegant fonts for a serious art book. Make sure they're not too thin.<br>
      Fonts that have good italics (which in my opinion means dark and full strength) for books with a lot of foreign words. Or fonts with complete Western and Eastern European coverage for this same category.<br>
      Book fonts, here are some nice dark ones: <a href="http://typophile.com/node/51171" title="http://typophile.com/node/51171">http://typophile.com/node/51171</a><br>
      Fonts for newspapers<br>
      Fonts for romance books<br>
      Sturdy fonts if you suspect the output will be photocopied a lot.<br>
      Of course there are MANY different opinions about what is appropriate. Make sure you say that you are just offering some suggestions!</p>
