      <p>If you're speaking to an audience of students who are not type designers or graphic designers, they may wonder why typography is considered a specialized skill. After all, most people have a word processing program that lets them choose fonts and layouts, so why should they pay a professional?</p>
      <p>I like to compare type to music. I love music, but I have never studied music theory. Some kinds of music make me feel happy, other kinds make me feel relaxed, other kinds make me want to get up and dance--or march. I don't know why music has these effects on me, but I feel them whether I understand them or not. The composer of the music creates these effects by choosing certain melodic lines, harmonies, rhythms, etc. </p>
      <p>Type design works the same way. The designer uses curves and lines, contrast, x-height, letterspacing, line spacing, line length, etc., to communicate to the reader that the text is is rigorous or accessible, elegant or edgy. The typographer's unique professional skill is that he or she has learned how the characteristics of type resonate in the eye and brain of the reader, and how to use type to amplify the message that is being read.</p>
      <p>You could show several examples that illustrate this point (and maybe play a little music, too).</p>
