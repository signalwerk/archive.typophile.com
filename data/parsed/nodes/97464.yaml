      <p>&gt; for a public speaking class </p>
      <p>Since some class members may not know or care much about typography, I'd suggest not getting too technical. You might want to look for a way to humanize the subject, such as telling an interesting story about a famous type designer, or a story about how advertisers use font choices to affect our view of their products.  As Nick mentioned, keeping it visual might be a good approach. If you use PowerPoint, one tip — don't put your speech on the slides; just put visuals on the slides that illustrate what you're talking about.</p>
