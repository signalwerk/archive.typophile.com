    html: |-
      <p>Never heard of Ribbon. What your sample shows looks like Futura with a new G and R. Another font with a similar structure is <a class="freelinking external" href="http://www.foundrytypes.co.uk/foundry_sterling/sterling_book.html" rel="nofollow">Foundry Sterling</a>. Only the numerals are an obvious mismatch, although details of the font are not exact either, on closer inspection.</p>
      <p>I think in past discussions we had noted that there are times when an 'unimaginative' (to be polite) foundry has altered a few letters from a familiar design, thereby creating a 'new' typeface. In my opinion, "Ribbon" began life as Futura and had a few of its letters replaced.</p>
      <p>- Mike Yanega</p>
