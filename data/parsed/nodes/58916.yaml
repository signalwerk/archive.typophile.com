    html: <p>Actually...Remember that you were browsing sign making fonts—characters that exist in three dimensions. While it <em>is</em> a bastardization of Futura, it's one that goes back to the 50s. Dimensional letters exist in, well, three dimensions—not in pixels or on paper—and so there is the X and the Y that graphic designers are used to, but there's also a Z. Most letters are relatively thin compared to the width of the stroke, but Ribbon is a thin stroke, so the <em>depth</em> is actually greater than the width. The letter O is actually a cylinder, and the letter S looks like, well, a ribbon. This is exaggerated by the "alternate" of Deep Ribbon, where the width of the stroke may be .5", but the depth may be 2", vs. maybe 1.25" in in regular Ribbon. These letters are produced by Gemini Signs &amp; Letters, and were particularly popular with architects in the Mad Men days of yore.</p>
