    <p>Hi there, </p>
    <p>I am new on the forum, forgive me if I'm posting in the wrong area...</p>
    <p>I wonder if anyone can help me? As part of a Graphic Art project I have designed a Display Font in Illustrator and ported it into Fontlab. As it's a monospaced font the kerning is all so has thus been relatively easy to put together...</p>
    <p>One thing I was wondering though, is it possible to have multiple versions of the same Glyph in one font set? so basically you can pick an alternate Glyph... it's just some of the letters I couldn't make my mind up on...</p>
    <p>any help at all is greatly appreciated </p>
    <p>Kieran</p>
