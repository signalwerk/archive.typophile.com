    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Goggling_4358.png"></div><br>
      Hobo (1910), by Morris Benton, his version of a popular lettering style of the time.<br>
      Souvenir (1914), also by Benton, with the form of the "g" taken, it is said, from certain German types:<br>
      <a href="http://typophile.com/node/14230" title="http://typophile.com/node/14230">http://typophile.com/node/14230</a><br>
      Schelter-Cursive (1906).<br>
      Perhaps there is something art nouveau and organic in this trope, more tadpole than pince-nez.<p></p>
      <p>Another Schelter &amp; Giesecke face, Belwe (1913), has "g" with a stunted tail, though not open.<br>
      Continuing the German connection, Kabel (1925) has an open "g" tail; and like Souvenir this too was given the ITC treatment and became hugely popular in the 1970s.</p>
      <p>As this was the form of "g" that appeared in the Javal type (late 19th century), there may be some association of this letter shape with legibility issues.</p>
      <p>Javal type reworked recently in Minuscule.</p>
      <p>Cheltenham (1896), tail terminated quite clearly by a ball serif, source of another ITC revival.</p>
