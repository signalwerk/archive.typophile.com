    html: |-
      <p>Thank you all for your answers. </p>
      <p>So… that would be a “danish g”, or a swedish one. </p>
      <p>Here are some interesting g I found, from and after your answers.</p>
      <p>Daniel Flösser post on a Typophile post related to a <a class="freelinking external" href="http://typophile.com/node/45378#comment-279301" rel="nofollow">Copenhagen street signage project</a>. In the <a class="freelinking external" href="http://typophile.com/files/Copenhagen%20signtype%20version.3.pdf" rel="nofollow">attached pdf</a>, one can found a few photos of danish street signs with danish g.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Signs-Typophile_3556_6069.jpg"></div><p></p>
      <p>On <a class="freelinking external" href="http://formschub.de/blog/?p=218" rel="nofollow">formschub.de</a>, a “g-trospektive” that collects a number of g, with really nice ones.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/g-nial_6275.jpg"></div><p></p>
      <p>I am specially loving the first one, coming from a corporate font for the danish rails company DSB, made by <a class="freelinking external" href="http://www.kontrapunkt.com/en/cases/dsb/" rel="nofollow">Kontrapunkt</a>, a danish agency. It’s “inspired by old Danish sign painters”. Referenced on Typohile <a class="freelinking external" href="http://typophile.com/node/49909" rel="nofollow">years ago</a>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/cases_dsb_06_3412.jpg"></div><p></p>
      <p>A corporate font for <a class="freelinking external" href="http://typophile.com/node/68964" rel="nofollow">Urban Splash</a> project by Dalton Maag (sans serif) that has some nice <a class="freelinking external" href="http://www.flickr.com/photos/hardwig/4039690964/in/set-72157622651348350/" rel="nofollow">alternates</a>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/UrbanSplash_5102.gif"></div><p></p>
      <p><a class="freelinking external" href="http://www.a2-type.co.uk/html/tram.html" rel="nofollow">CPH Tram</a> an <a class="freelinking external" href="http://www.a2-type.co.uk/html/dane_light.html" rel="nofollow">Dane</a>, by A2-Type, are interesting sans examples.</p>
      <p>Searching more, among the first pages of Typophile’s search for “danish g” leads to many fonts. A lot of sans serifs. </p>
      <p>Mr Nick Shinn, do you know where I could fing any Javal specimens online ? The optical / legibility questions that lead to Huot-Marchand Minuscule g, demanding that i stops on the baseline are an idea I’d want to digg.</p>
      <p>Thank you.</p>
