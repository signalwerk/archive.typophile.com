    html: "<p>Just a warning: any automated CMYK to RGB conversion is going to be a bit off anyway, so doing it by eye may be your best bet. If you don't care, just shift-select the colors in the Swatches palette and double-click on one of the highlighted ones. The group options window will appear, then choose the color mode. I think that's it. <br> <br>There are color managment options you can choose, but that's a larger, separate issue.</p>"
    html_clean: "<p>Just a warning: any automated CMYK to RGB conversion is going to be a bit off anyway, so doing it by eye may be your best bet. If you don't care, just shift-select the colors in the Swatches palette and double-click on one of the highlighted ones. The group options window will appear, then choose the color mode. I think that's it. <br> <br>There are color managment options you can choose, but that's a larger, separate issue.</p>"
