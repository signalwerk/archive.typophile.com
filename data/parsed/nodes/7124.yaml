    html: '<p>Thanks for all the replys, its an advert for a newspaper, but it turns out that one newspaper in particular has an RGB workflow. Ill be doing quite a few ads over the coming months and becuase most papers bar this one are cmyk, I was wondering if there was an option to just convert all colours to RGB. <br> <br>I dont know how common it is to have an RGB workflow, especially for a news paper but this is directly from their specifications sheet:  <br> <br>"NO CMYK images, only RGB - Independent Newspapers maintain an RGB ICC Profiled Workflow." <br> <br>For the moment Im just going to export the ad as an .eps. and select the file as RGB when doing so. <br> <br>Thanks again, <br>David.</p>'
