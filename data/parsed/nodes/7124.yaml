    html: <p>Indesign is more of a collaging program than an art program unto itself. <br> <br>You can click on swatches to make them RGB. Then you could do a batch automate in Photoshop, converting the placed images to CMYK. It's very slick, try it. <br> <br>If you're ultimately going to export, you can continue to work in CMYK, then set the PDF or JPEG or whatever as RGB while exporting. <br> <br>What is the end result of this project?</p>
