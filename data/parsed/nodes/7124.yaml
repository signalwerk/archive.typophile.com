    html: "<p>Neither RGB nor CMYK is an absolute space. That is, they both only exist in reference to some particular parameters. So any conversion you do becomes a color management issue. You can of course ignore the issue, but that doesn't mean that color management stuff won't factor into the conversion: it's just that you won't control it. <br> <br>Of course, depending on the nature of the job, this may not be particularly critical. <br> <br>To echo John B, what is it that you are trying to achieve by switching to RGB? How will this document ultimately be output or in what form will it be viewed? <br> <br>Cheers, <br> <br>T</p>"
    html_clean: "<p>Neither RGB nor CMYK is an absolute space. That is, they both only exist in reference to some particular parameters. So any conversion you do becomes a color management issue. You can of course ignore the issue, but that doesn't mean that color management stuff won't factor into the conversion: it's just that you won't control it. <br> <br>Of course, depending on the nature of the job, this may not be particularly critical. <br> <br>To echo John B, what is it that you are trying to achieve by switching to RGB? How will this document ultimately be output or in what form will it be viewed? <br> <br>Cheers, <br> <br>T</p>"
