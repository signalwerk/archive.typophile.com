      <p>Terry, three things I notice:</p>
      <p>1. The shadow in the top terminals of the CcGSs seems to be a different angle than the e etc. Might it work better if it were more consistent?  </p>
      <p>2. The staight lines eg in the right of the a, the left of the B D are straight whereas the circular lines and other of the verticals have a more hand-drawn feel. These seem like they need more of the hand drawn feel, as they are a little stiff compared to the rest, which has the friendly, hand drawn feel. </p>
      <p>3. I wonder about the 'upside down' H, since your E and F follow the traditional model. </p>
      <p>Overall, my feeling is that if you liberate this a bit more from the rigidity of a usual sans and make it a bit more playful, it will more fully realize the design.  </p>
      <p>As a model in this 'formal informal',  you might want to look at<a href="https://web.archive.org/web/20150123200010/http://www.myfonts.com/fonts/linotype/tempus-sans-itc/tempus-sans-itc/" rel="nofollow">Tempus Sans</a> and other Phil Grimshaw fonts, if you haven't already.</p>
