      <p>“m” should I widen it a bit?</p>
      <p>I think the second arch could be widened a bit, but the clear difference from the first arch I think helps with the hand-drawn feel. </p>
      <p>As I said my feeling is that it would help to be a bit freer in the sides of the straight letter forms. I like the treatment of the top of your h, for example, and would like to see more of that kind of taper and dynamism in the lines of your stems.</p>
      <p>But I feel it would be good to be boringly consistent in your shadow--so the diagonal lines connecting the corners of the face to the corners of the shadows would all have the same angle. The hash marks on the side of the shadow could still keep your hand-drawn freedom and variety as they do now, so you would kind of get the best of both worlds...</p>
