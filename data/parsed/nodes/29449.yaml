  html: <p>Hello all. This is a typeface I've been working on as of late called Bizzle-Chizzle. Since this is handdrawn, inconsistencies are part of the fun. I just need to know what can be considered charming, and what simply does not work. Let me know what you think! <a href="https://web.archive.org/web/20150123200010/http://www.terrybiddle.com/?page_id=13" rel="nofollow">Click here to view</a></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123200010im_/http://typophile.com/files/biz_chiz_5637.gif"></div><p></p>
