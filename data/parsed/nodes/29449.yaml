      <p>I think the complete face looks fantastic and, like the above comments, I'm sure there's room to improve parts of it, though I would lean towards understated changes as I think you've captured something great as-is.</p>
      <p>Aside from that, the comment I wanted to make was about the Solo version. I was flipping through the .pdf at a relatively small size on the desktop and while all the Complete samples read well at smaller sizes, when I flipped to the Solo page it looked distinctly darker and more muddy. I'm not imagining that you would be setting pages of 10pt text in this - but while Solo looks great at larger titling sizes (where you can really see the detail), the thin lines of the shadow seem to close up pretty fast as it goes down in size. I'm sure it's the light/dark contrast of the Compete cut that helps it read so well - and without that contrast the Solo letter and shadow seem to blur together. Increasing the thickness of the white lines would seem to be away around that - but certainly not a quick or easy way around it.</p>
