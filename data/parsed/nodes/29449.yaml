      <p>&gt;all of the inconsistancies in this kind of face add to the funk and make it work better.</p>
      <p>Chris, I agree that this kind of face needs a lot more freedom and variety in its letter forms. But the question is: which inconsistencies work? I think it is as hard or perhaps much harder to get this free hand-drawn look to work really well. And I think Terry has gone far toward the final result, but my feeling is that he isn't quite there yet. </p>
      <p>I don't know how the heck Phil Grimshaw did it, but in the case of Tempus Sans, even with all the lively and varied angles of strokes, splashing over baselines and x heights etc., it manages to have beautiful balance and color anyway. To me that is a worthy goal...</p>
