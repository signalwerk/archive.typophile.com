    html: |-
      <p>&gt;At what point do you know when you’re over thinking?</p>
      <p>There's productive thinking and unproductive thinking. Here's my effort to sort it out:</p>
      <p>1. Trying to figure what can be changed to make it better when you feel something is not right is generally productive, I think. </p>
      <p>2. Imaginatively trying to think up new ways to resolve the problems you see is generally productive. </p>
      <p>3. Second guessing yourself is, alas, part of type design! When Matthew Carter critiqued the typeface I'm working on, he said: 'If you're like some of us, you change a point one or two units, and then change your mind the next day and put it back. That's what will make the difference as to whether you really achieve a fine typeface.'</p>
      <p>4. After a while it gets ridiculous. Then you are overdoing it. I remember James Montalbano wrote one time on Typophile: 'Warning: being a perfectionist and a type designer will cause your head to explode.'</p>
      <p>Stop well before that! </p>
      <p>So basically I think it is a matter of having a standard for that particular project, a standard short of perfection. That's what will tell you to say: this is finished, publish it, and move on to the next project.</p>
    html_clean: |-
