      <p>My only comment is watch out for shadows that close glyphs. The 'e' is what I am thinking of. It;s the shape of the terminal. And in the overthinking category. The e is rotated right where most characters are rotated left a bit. This makes for a nice rhythm but I would dink with it to see what I thought if it was me. If you are using contextual altrenates one thing you could do is make sure the tilts change contextually so maybe one letter tilts this way the next will be this way &amp; so on.</p>
      <p>Congradulations!</p>
