    html: |-
      <p>Terry:</p>
      <p>When we made the final files for the Chromatic Woodtypes, we saved duplicates of the final, spaced decorative faces, then carefully deleted the fancy outlines from the new file, keeping only the fill outlines. That way, each font file had exactly identical character widths and kerning tables. I know your font has more layers, but maybe you could keep all your various layers in just 2 layers of a regular VFB, save as 4 different VFBs, then delete irrelevant outlines, switch Mask and Outline layers, etc. You would definitely have to have all the spacing etc. done before splitting it up. I don't know how else to ensure perfect alignment (which, you must admit, could be an interesting thing to toss out in a design like this).</p>
    html_clean: |-
