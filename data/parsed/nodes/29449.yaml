      <p>Yes my son, contextual altrenates is what you need.... (Sesame St. Count style laugh) heh heh heh heeeh!</p>
      <p>Actually I think it would help you add an even greater spontinaity to the face. Which would make it EVEN COOLER. :-) Feel free to contact me if you want to chat about it. I have been thinking about it a lot.</p>
      <p>My only comment is watch out for shadows that close glyphs. The 'e' is what I am thinking of. It;s the shape of the terminal. And in the overthinking category. The e is rotated right where most characters are rotated left a bit. This makes for a nice rhythm but I would dink with it to see what I thought if it was me. If you are using contextual altrenates one thing you could do is make sure the tilts change contextually so maybe one letter tilts this way the next will be this way &amp; so on.</p>
      <p>Congradulations!</p>
      <p>Some crazy ideas: What if you did a companion that looked cartoonishly chiseled out of rock?</p>
      <p>Perhaps this will be a Fontesque for the Aughties? It's usually in the 6th year of decade that defining culture for that decade emerges...</p>
      <p>-e.</p>
