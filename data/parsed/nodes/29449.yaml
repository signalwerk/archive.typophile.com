      <p>William -- all good points.</p>
      <p>Terry -- if this is a fun, loose-style, hand-lettered font (it is, just humor me), then perfection shouldn't be the goal. Maintaining the quirkiness should be. I look at the letters and see a few things I <em>might</em> change, but then wonder if those changes would regularize it too much. For instance:</p>
      <p>- the crotch of the "a" seems too high<br>
      - the shadow of the 'g' seems too heavy, same with the 'k'<br>
      - the shadow on you the 'đ' seems backwards on the top curve.<br>
      - the shadow on the 'AE', 'D', 'Q', 'O' slash, 'o' slash all seem a bit heavy too<br>
      - the bowl on the 'b' is squashed</p>
      <p>But you know what, I think the style allows for imperfections, heck, it even needs them.</p>
