  html: |-
    <p>Hi everyone,</p>
    <p>I would love a critique of the typeface I'm developing for my honours project this year. The two fonts below are the display cuts in an extra-bold and light weight. It's going to be used as part of an identity system for an artist-run initiative in Melbourne. Previously they were using Reader for headlines and Parry Grotesque for body copy. The naivety and clunkiness of early British grotesques was the formal starting point.</p>
    <p>This is my first proper foray in to type design and I've yet to go through kerning pairs so forgive any awkward combinations. Love to hear your impressions, criticism, suggestions.</p>
    <p>—Vin</p><div class="imageWrap"><img src="http://typophile.com/files/Jones_Preview_4208.png"></div><p></p>
