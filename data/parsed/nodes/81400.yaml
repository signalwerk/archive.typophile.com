    <p>Hi,</p>
    <p>I recently finished a course in FileMaker and became certified. I have been making some nice layouts and need help selecting nice, easy to read fonts and was wondering what fonts some of you experts would recommend. I want to make it easy on the data entry personnel's eyes.</p>
    <p>Thank you.</p>
