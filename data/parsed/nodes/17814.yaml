    html: <p>Hmm. Interesting exercise. Changing these few features didn't really change the original much. For example, you have changed the head serif, but not the foot that much. In the Fleishman scans, as well as the Farnham, Mercury and DTL Fleishman revivals, they all have the foot serifs much thinner. You have changed stress on the o but not the c and e accordingly. The joins of the m n on Fleishman are much thinner, the handling of contract on the o is different, etc., etc. And this doesn't even get into proportions. Any of the Fleishman revivals would look way different at text size, I would think, though I don't own any of them.</p>
