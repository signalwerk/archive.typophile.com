    html: <p>By and large Goudy would have been able to stay within two ten-thousandths of an inch of his drawings, because his drawn angles are generally slightly bracketted anyway (as one would expect from continuous freehand lines). The only exception I can think of is Deepdene, which the Berthold cutting (presumably from matrices or print) pudgifies, but which the LTC (from drawings) does not - but then Deepdene is a creative misinterpretation of Lutetia, like those jolly Medieval versions of the Greek myths which gave Daedalus a tonsure and a ready oath, and it was made in the belief that it would have to be redrawn by Monotype in any case.</p>
