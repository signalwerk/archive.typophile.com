      <p>1) Goudy didn't use an ATF-style pantograph: "The matrix-engraving machine which I found entirely satisfactory was not primarily made for such work, but with a few alterations which the manufacturer kindly made for me at my request it performed my work accurately; and - what was quite important - the machine, including the alterations, did not cost more than I could afford." Goudy goes into great detail and there is no sign at any stage of adjustments for size - rather the opposite, he values complete consistency with his drawings, to a stated minimum precision of 0.0025 of an inch.</p>
      <p>2) It's just possible that Goudy could not have known. Optical sizing may not have been done consciously or consistently by most punch-cutters - Caslon, despite his italic Q, did not make his types darker or wider at small sizes, and Haultin likewise. And Goudy never had close relations with the works of any foundry, mistrusting them because he had no real idea what they did - his approach was the opposite of Dwiggins'. But it's true that Goudy may just not have seen optical sizing as a good thing, particularly in the context of letterpress, since - though spacing will suffer - it's possible to embolden small type in the printing of it.</p>
      <p>Ridiculously I dont't have a scanner, though I should get one soon.</p>
