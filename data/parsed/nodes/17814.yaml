      <p>I can't remember where I read the Plantin story, but <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_23.pdf" rel="nofollow">this dissertation</a> confirms that Plantin (1913) was "a robust version of a Robert Granjon sixteenth century type for printing on art paper", and it was made at a time when new designs were not produced except for new printing conditions: the only designs offered by Monotype in the pre-Morison period which were not maximally literal revivals (or rather just versions) were, I think, Imprint and Plantin. Imprint was for periodicals which needed a sturdy, efficient Caslon-a-like, and Plantin was for coated paper. And so Glaister's 1960 Encyclopedia of the Book still has it that "For the printing of text on art paper (which is also known as coated paper) such heavy faces as Plantin or Times New Roman should be used".</p>
      <p><cite>So in a way you could say that one version of your exercise—clarifying Plantin—is Times New Roman!</cite><br>
      I know - I caught a glimpse of TNR in Generic 65 after one of my revisions yesterday; it prompted a frenzied attempt to cover the evidence.</p>
      <p><cite>the key thing here is that Plantin was design to be set small. Looking at it large can only be non-misleading if you know what to look for (and I’m not sure I do myself). </cite><br>
      Sure. The wonder of something like Plantin is that it could not possibly have been created by someone who drew the most beautiful letters he could and then tweaked them until they worked in text - at least in its final form (the design process would have involved an astonishing number of man-hours) it looks like it's been architected from scratch to fit a human sense quite unlike the ordinary large-scale vision for which Romanee was designed.</p>
