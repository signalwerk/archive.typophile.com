      <p>&gt;was meant not to be readable but to hide the impression of sharpness that inevitably came with printing on newly popular glossy paper</p>
      <p>Where did you read this story of Plantin? I'd like to read it too. I don't think Plantin is ugly at all. It is a work horse, not a show horse, but a champion work horse. I am just reading in 'Print's Types of the Twentieth Century' that it was done to the same widths as Imprint, which was a regularized Caslon with a larger x-height--and also a work horse. And I don't know which story about Times New Roman is true, but it does look a lot like a sharpened Plantin (with Perpetua style serifs). So in a way you could say that one version of your exercise--clarifying Plantin--is Times New Roman! </p>
      <p>By your lightening does give a cleaner impression, but it loses the comforting solidity of the original, without getting to the more clear and open look of Baskerville. So the interesting thing to me is that in lightening it up, something was lost as well as gained.</p>
