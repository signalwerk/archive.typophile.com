    html: <p>Goudy's machine was simpler, and there's no sign that Goudy was aware of non-linear scaling. As he proudly wrote in Typologia, "Since the tracing ball and the cutting cutting tool always bear the same ratio to each other which the work pattern bears to the point size of the type to be engraved, I contend that I can cut matrices for type from 8-point to 72-point from the same pattern and retain in each size the exact character of my original drawing, because each stem, hairline, serif or counter is enlarged or reduced proportionately. For instance, this book is set in [a number of sizes of UC Old Style], and all sizes have been produced from one set of raised work patterns". This is one of the black marks against Goudy.</p>
