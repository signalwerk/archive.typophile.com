      Pretty much anybody was. Until the 90s.</cite><br>
      Yup - though, of course, if the two lines join with a curve which is no sharper than the circumference of a circle of 0.75 mils radius, then Goudy's in the clear. His drawings don't as far as I know include any traps.</p>
      <p>By the way, I'm not sure the blame has to be laid on Goudy in that bit of filim. Goudy really was, in large and central senses, pretty dim - an endearingly bad writer, with a special gift for the quotation which is not a quotation ("'time marches on'"), and a scholar of type who still thought Garamond designed the type he revived as Garamont in 1946, twenty years after the Beatrice Warde article on Jannon. Perhaps he just didn't realise that the tracer ball was necessarily softening his angles (he was no geometer), especially since he lost the sight in one eye the same day he succeeded in making a cutting tool that worked.</p>
