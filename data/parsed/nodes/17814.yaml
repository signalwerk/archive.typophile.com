      <p><cite>But/so then are you using “clarity” to mean “lightness”?</cite><br>
      No, not lightness - to have too much clarity is to give the impression that letters are not atoms, that they are assembled from a number of merely juxtaposed black elements. But that's not right either - it has something to do with too narrow a range of qualities of black and white, from shining to dull.</p>
      <p>You're wrong about JvK, he worshipped the punchcutter in abstract and in particular (PH Rädisch, not Rosenberger). In his Letter to Philip Hofer he says that "Without [Rädisch's] zeal and skill my designs could hardly have become the printing material they are" - and this despite the fact the JvK's drawings were far more precise than, say, Gill's. Indeed van Krimpen's problem with Stanley Morison was that the Monotype design process obliterated the punchcutter's active and optical corrections; that's why he had every size of Monotype Lutetia made from Rädisch's punches as a separate typeface, with quite different relative widths from size to size.</p>
