    html: <p>The cutter could "cut a line one and one-half thousands of an inch in width"; the tracing-ball going round the pattern was in exact proportion with the cutter going round the matrix; and from this maximum accuracy Goudy "attempted to limit any inaccuracy in the matrix to not more than two-ten thousands of an inch". Relying on a tracing ball without hand-correction of the matrix will make perfect interior right angles impossible, and one and a half thousands of an inch plus one thousandth for inkpress does make for a certain pudginess - it's thicker than the average human hair.</p>
