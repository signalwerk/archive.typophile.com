      <p><cite>But are the boumas jumping out as much as with the previous version?</cite><br>
      Following a few tweaks, I hope they are. I'm not sure really - I made the changes that were screaming out to be made if the result was to look like something one could sit down and design from scratch. </p>
      <p>Plantin is one of the wonders of the world as a 9- or 10-pointer for pocket books*, but it's odd to think that Plantin's pleasant solidity in serifs and bracketting was meant not to be readable but to hide the impression of sharpness that inevitably came with printing on newly popular glossy paper. So Plantin was the first type designed to overcome the problem of that excess clarity which has, with digital printing, become universal. </p>
      <p>*The comparison between large-size Plantin and Romanee in Counter Punch is hilariously unkind to the former. There could hardly be two more different versions of the High Renaissance roman.</p>
