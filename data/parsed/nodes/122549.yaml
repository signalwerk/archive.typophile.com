    html: '<p>Reminds me of <a class="freelinking external" href="http://e-daylight.jp/design/fonts/type/o/othello.html" rel="nofollow">Othello</a>, an old ATF by Morris Fueller Benton, never digitized. Main difference is the /C. Some of its modern interpretation: <a class="freelinking external" href="http://www.myfonts.com/fonts/northernblock/dohrma" rel="nofollow">Dhorma</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/velvet" rel="nofollow">Velvet</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/kickingbirdfonts/bathysphere" rel="nofollow">Bathysphere</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/iago-nf" rel="nofollow">Iago</a>.</p>'
    html_clean: '<p>Reminds me of <a class="freelinking external link-external" href="http://e-daylight.jp/design/fonts/type/o/othello.html" rel="nofollow">Othello</a>, an old ATF by Morris Fueller Benton, never digitized. Main difference is the /C. Some of its modern interpretation: <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/northernblock/dohrma" rel="nofollow">Dhorma</a>, <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/reserves/velvet" rel="nofollow">Velvet</a>, <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/kickingbirdfonts/bathysphere" rel="nofollow">Bathysphere</a> and <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/nicksfonts/iago-nf" rel="nofollow">Iago</a>.</p>'
