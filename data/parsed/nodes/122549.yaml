    html: |-
      <div class="comment-spam-body"><p>Othello was originally cut by Gustav Schroeder for the Boston Type Foundry in 1884, and was revived by Morris Fuller Benton for ATF. Seymour Caprice used the original font as the basis for Bathysphere (2013) <a href="http://www.myfonts.com/fonts/kickingbirdfonts/bathysphere/" title="http://www.myfonts.com/fonts/kickingbirdfonts/bathysphere/">http://www.myfonts.com/fonts/kickingbirdfonts/bathysphere/</a><br>
      The exhibition lettering is similar to Othello but there are differences, ranging from the different _&amp;_ to various details of the letters.<br>
      Don</p>
      </div>
