      <p>As I wrote, this ends up being dependent on the capabilities of the individual font. Enclosing signs are a pain in the neck to deal with, because ideally the enclosed glyphs are optimised for that use, e.g. you might want to reduce the size of numerals and perhaps lift them off the baseline. There are always going to be limits on what combinations work acceptably, and the great majority of fonts don't support enclosing marks at all.</p>
      <p>Re. the behaviour you note with Cambria, it is entirely possible that what is happening is a Word-specific character substitution that happens to be supported by Cambria. It is likely that the resulting display that you see is actually a behing-the-scenes mapping to the circled numeral characters in the Unicode 2460 range. I also suspect that what you see working for Cambria roman might not work for the other fonts in the family. The roman has an expanded glyph set on account of its maths coverage.</p>
