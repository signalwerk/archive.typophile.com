    html: |-
      <p>The first of these looks like the default Cambria numeral 1 placed within the U+20DD glyph. The second of these is not Cambria at all. The circled number characters were added to Cambria only relatively recently, so it is possible that the version you have does not support them, in which case Word is applying font switching to render the character with some other font. Word tries never to fail to display a character, so will opt to switch fonts rather than show a .notdef box (there may be an option setting to disable this).</p>
      <p>This is what the actual Cambria circled number 1 character looks like, shown beside the default numeral glyph for comparison of size and positioning:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cambria1_4859.png"></div><p></p>
