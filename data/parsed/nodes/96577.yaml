    html: |-
      <p>Enclosing signs should precede the character that they enclose, not follow it. I believe this is standard for Unicode enclosing signs, regardless of text direction.</p>
      <p>Whether the combination of a particular enclosing sign and a particular following character render in a desired fashion, though, depends on the individual font. Some fonts provide ligatures of particular combinations expected to be used, others provide complex GPOS positioning (including, in the case of some Arabic enclosing signs, handling of multiple characters within the sign, e.g. end of ayah marks containing numbers), and some trust to blind luck.</p>
