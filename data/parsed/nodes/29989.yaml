      <p>Ruari McLean (in <em>The Thames and Hudson Manual of Typography</em>) also mentions that pica (along with terms like nonpareil and brevier) used to be a type size. </p>
      <p>Here are some definitions from the <em>Glossary of Typesetting Terms</em> (Eckersley, Angstadt, Ellertson, Hendel, Pascal and Scott, University of Chicago Press, Chicago &amp; London, 1994). No mention of word origins for pica, however.</p>
      <p><strong>Pica:</strong> A standard typographic unit of measure equal to 12 Anglo-American points. Six picas equal 0.9936 inch, though personal computer systems round this off to an exact inch. This system of measurement is used primarily by typesetters, but also by many printers and binders. Historically pica was a type size, roughly equal to a 12-point setting.</p>
      <p><strong>Point:</strong> The smallest whole unit in the Anglo-American measurement system used principally in typesetting and printing. The point is equal to 0.35136 millimeter or 0.0138 inch, making 12 points to a pica and approximately 72 points to an inch (actually, 72 points equals 0.9936 inch).</p>
      <p><strong>Cicero:</strong> A unit of type measurement in the Didot point system, which originated in France and is now employed throughout Europe except in the United Kingdom and Ireland. One cicero equals 12 Didot points, equivalent to 12.839 points in the Anglo-American point system. Ciceros are used in Europe to describe the width and depth of a block of text, serving much the same purpose as the Anglo-American pica.</p>
      <p><strong>Didot point (d):</strong> A typographic measurement introduced in 1775 by the French printer Francois-Ambroise Didot and used in continental Europe. The Didot point equals 0.375 mm or 0.015 inch, larger than the Anglo-American point; for example, 12 d is approximately the same as 14 points in the Anglo-American point system.</p>
      <p>Also interesting: the point system was originally created by another French typefounder, Pierre Fournier le jeune, in 1737. He used 0.349 mm for his unit of measurement. "Eventually a standard point of 0.013837 in. (0.3515 mm) was adopted by the American Type Founders' Association in 1886 and by the British in 1898..." (Ruari McLean again).</p>
