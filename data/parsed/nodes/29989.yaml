      <p>According to Oxford<br>
      &gt;— ORIGIN Latin, literally ‘magpie’, commonly identified with a 15th-century book of rules about Church feasts, although there is no known copy of this book printed in pica type</p>
      <p>Wheras Brewer refers to it as the initial letter of each order from litera picata</p>
      <p>Although I wonder if the Ecclesiastical references (which also call this type of book of feasts pie or pye) aren't related to the Latin <em>pius (&amp; pietas)</em> –&nbsp;dutiful, which makes more sense to me. Despite this fancy, many type size names are taken from church documents, brevier and primer are two more examples.<br>
      Tim</p>
