      <p>Bruce, I know the point measurement system was perfected by the Didot family from the experimentations led by the Romain du Roi committee and then Pierre-Simon Fournier "le Jeune". I knew as well about the list of church services and the type size used to print it ("cicéro" comes from the same kind of "semantic stunt" — the works of Marcus Tullius Cicero, obviously — when a type size was given the name of the kind of printing work it was primarily or most usually used for).<br>
      But I never could be able to find what the original word "pica" meant exactly. Could there be a relationship between the Latin word for "magpie" and the heterogeneous nature (hymns, recitations, etc.) of a church service ? Or the fact that church services are very different according to the period of the liturgical year ?<br>
      Or could the "church pica" bear no relationship at all with the "magpie pica", being the result of an abbreviation or an acronym ?</p>
