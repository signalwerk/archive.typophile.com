    <p>Hello everyone<br>
    Being French and for this reason very "metric system-oriented", I've always been fascinated by Anglo-American systems of measurement. I know roughly where the French term "cicéro" comes from but I'm wondering about the origin of the word "pica". Does anybody have a clue about this one ?</p>
