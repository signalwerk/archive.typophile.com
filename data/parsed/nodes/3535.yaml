    html: <p>FontAgent Pro 2.0 all the way here on Mac OS X Panther. <br> <br>The whole copying the fonts to a universal FontAgent Pro database doesn't bother me because it leaves my originals untouched. I'm not quite sure what it's doing when it checks/optimises the fonts but it seems fine. They also need to badly address their manual for version 2.0 as it references version 1.0 in the screenshots which seems very unprofessional. <br> <br>I have to admit that I also have Font Doctor 6.0 just to double check my fonts before I send them to Font Agent Pro. Some Mac OS X applications, especially Illustrator CS seem to be ultra sensitive to bad fonts and quit and crash while they're active. For some very strange reason it's extra important to ensure you have a font library that's in good condition. One missing outline or something along those lines can cause havok!</p>
