    votes: null
    html: <p>Stephen, <br> <br>I use to be a FontAgent pro kinda guy, until it stopped activating the  roman style of a font suitcase, also all of this copying and moving started to piss me off. MasterJuggler works in much the same way as ATM Deluxe, only it is Unicode savvy. <br> <br>You can activate fonts from anywhere, it does not copy fonts. After activation, you can QUIT the program, so it does not need to be constantly running in the background. Yes it does not have auto-activation, but I've never really needed it. When I did a lot of graphic design, I had very carefully organized font folders. Now that most of my time is in font development, I'm happy to have a very simple "Temporary" activation tool. <br> <br>I've sent e-mails to Alsoft to suggest that they make MJ available for a trial download, but they seem not to be interested. They say Auto-activation is coming in the next release. <br> <br>I still love the fact that they had me in their database at a different address with a different phone number from 10 years ago, and still gave me the upgrade price when I ordered over the phone. <br> <br>You can't go wrong with that.</p>
