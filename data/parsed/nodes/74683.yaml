    html: |-
      <p>Nice. (Although you might want to switch the nice blue for black until you've got the shapes down.) The tension between calmness and interestingness in this seems quite fitting. If that makes any sense :-)</p>
      <p>Yes, the "f" looks too big if it's supposed to be lowercase, or too round and too big if it's a cap. To me it looks like it wants to be a shower or something. I'd just make it, dunno, normal size. If you make the top-right less droopy (i.e. cut it earlier, before it curves down so much) it could maybe be quite a bit narrower too. (Although that may well have repercussions on the "r"…)</p>
      <p>I'm not sure the concept of the terminals is entirely cogent yet, but it's going in a nice direction. To my eye there are some funny things with directions going on – the "t"'s arm (and very small foot) is pulling it quite strongly to the right, as are the "w"'s x-line terminals, whereas other glyphs are more static. I'd think static would make more sense in this context than pulling forward too much…? So I might pull the "t" and "w" back if I was you.<br>
      Also: The "a" seems to look narrower than the "o" (which it probably isn't, but looks like).</p>
      <p><cite>"You're supposed to relax and forget all your worries in a sensory deprivation kinda way"</cite><br>
      Have you been in one? They rock.</p>
