      <p>Thanks peeps, </p>
      <p>A floatation tank wotsit, is a space age looking bath with a lid with luke warm salty water that you can float in. Its dark in there and they play bad whale music at the beginning and end. You're supposed to relax and forget all your worries in a sensory deprivation kinda way. Homer and Lisa try them in the Simpsons one episode.</p>
      <p>yeah, the longer leg of the k was intentional – it seemed to sit better. I'm not sure the bottom of the r and k strokes need to go down as far as the o &amp; w, but you're right they  could do with being a little lower.</p>
      <p>Thanks for your thoughts.</p>
      <p>Graham</p>
