    <p>Howdi, </p>
    <p>Any thoughts/suggestions with this logo here for an established floatation tank relaxation company?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/floatworks_4381.png"></div><p></p>
    <p>The work was through a friend of mine, he's the web designer and wanted something 'floaty, but business-like' or thereabouts. I did originally try a 'fl' ligature but it didn't really work – it forced the curve of the top of the 'f' to be too wide. </p>
    <p>Any thoughts would be most welcome.</p>
    <p>Thanks, </p>
    <p>Graham</p>
