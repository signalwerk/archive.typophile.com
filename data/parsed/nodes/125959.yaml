    html: |-
      <p>You stated you wanted the sign to be clean and readable with some sense of the era. I can well imagine an American Gothic in use there. I really like the revival of <a href="http://atftype.com/atf-alternate-gothic.php">Alternate Gothic</a> but my first pick to try out (if it should be clean and more modern) would be Tal Leming’s <a href="https://typesupply.com/fonts/balto">Balto</a>.</p>
      <p>If you are looking for a newspaperish text flavour, try a Scotch. Something from the Century type family or a contemporary one like <a href="https://www.typography.com/fonts/chronicle-text/overview/">Chronicle</a> could work.</p>
      <p>For additional research on your own, flip through digitized books of American Type Founders of that era, like this <a href="https://archive.org/stream/americanspecimen00amerrich#page/n0/mode/2up">specimen from 1912</a>. (Oh, and if you need a display or headline typeface resembling the octagonal “Western Newspaper Union” lettering from that photo you posted, give one of the narrower styles of <a href="https://www.myfonts.com/fonts/sportsfonts/winner/">Winner</a> by Christoph Koeberlin a try. There is also a sans-serif upcoming but I might prefer a serifed version.)</p>
