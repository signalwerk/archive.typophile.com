    <p>The design will be etched in stainless steel, not raised like a standard historical plaque. I can use any font I want. I want the sign to be clean and readable, but still have some sense of the era. Most of my research is turning up Victorian-stye typography, which doesn't fit with a midwestern Central Business District rehab. Photo is attached. </p>
    <p>Thanks!</p>
