    <p>hi guys,</p>
    <p>i’m new to typophile, and wow! what a great site. i’m learning a ton from the discussions in the forums. </p>
    <p>i’d like to get some feedback on work i’m doing for a friend’s (high end) yarn store. i don’t if this is totally suitable for this forum, but i thought it couldn’t hurt. the brief was: nothing literal (no yarn balls, nothing cutesy or crafty), clean, modern, fashionable, and VERY SIMPLE (the store is going to be all white, with the yarn being the colour, and with the name in extruded aluminum on the exterior.. you get the idea). </p>
    <p>the orange swirl was the chosen direction because of the abstract string-like quality/swirly “pudding in a bowl” effect (the name, btw, was a random “i like the word” choice). the idea is to have all the type set in different weights of the same font, with the swirl being cropped and scaled in various sizes as a background accent. i like the idea, but i’m afraid it might be too simple? also, i chose helvetica and avenir, as there wasn’t a budget to buy something new in the weights needed. plus, i kind of like helvetica when it’s not at book weight… to each their own, right?</p>
    <p>thanks,<br>
    miss_m</p>
