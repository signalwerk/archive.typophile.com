      <p>Don’t know if this logo/identity is still in development, but my wife had some comments. She’s a “modern knitter” herself:</p>
      <p>I love the front of the cards. My only question is in relation to the back’s design. I see that you were instructed to keep yarn out of the design (“no yarn balls, nothing cutesy or crafty). I think this is doing the product and the store a major disservice. I’m a knitter. I want yarn. I don’t want cute, but the fiber is the key part of the obsession. Computer created lines seem odd, when an equally abstract spiral of yarn would communicate the product, as well as a modern sensability. A clean white background could equally show off the texture, the color the twist of the fiber. I am only one person, with one opinion… I knit for the tactile sensation, the design oportunity, the creative freedom, and to bring color into my life. Why hide those things that I, as a knitter, desire most?  </p>
      <p>I’m less concerned with the basis for your design as with the store owner’s branding ideas. But regardless, if I ever get to Alberta, Canada, I’ll be sure to give Pudding Yarn a look-see.</p>
