      <p>Though not a knitter, I agree with crugen’s wife. The current “yarn” looks too computational to me. I think something thicker and more literal might do better. Does yarn come in balls or on conical spindals? If the latter, you might do something with the “A” or “Y.”</p>
      <p>As far as faces go, I agree Norbert. You should explore more options. Helvetica is too generic, and Avenir (while excellent) just doesn’t seem like a fit considering the industry. I know you said there is no room in the budget, but consider the importance of brand identity. With an abstract same such as “Pudding Yarn” and a clean/modern/minimalist look, you might have customers asking just that - Pudding Yarn?</p>
