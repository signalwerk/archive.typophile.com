      <p>Welcome, miss_m,</p>
      <p>I usually stay out of the logo critiques, but I would like to give you a few small suggestions.</p>
      <p>You do have a nice sense of design as evident by your samples.<br>
      The mixing of weights, and even the mixing of type designs have been well done by others, so continue working with the concept.</p>
      <p>Even though your client wants a “clean, modern, fashionable” look, and even though you “kind of like” Helvetica, I think you can go much further with the design simply by experimenting with another typeface or two.</p>
      <p>I won’t tell you what typefaces to try, others might suggest some. I only think that looking like literally thousands of other logos is <em>not</em> going to help your client, and you as a designer.</p>
      <p>Part of what building an image or brand is to develop something that would make it more memorable to potential clients (theirs, not yours).<br>
      Though it’s still not impossible to do with Helvetica, it just isn’t easy since so many others look like it.</p>
      <p>Hopefully some of the other forum members can suggest more interesting typefaces to complement your already good design.</p>
      <p>———————————————————-<br>
      Yes, I’m old, but I’m back in style!</p>
