    html: <p>I actually use the Font Creator Program (<a href="http://www.high-logic.com" target="_blank">www.high-logic.com</a>), a native True Type editing tool, so I'm directly manipulating the quadratic Bezier curves of my ttf file.  No PDF save option there.  I really am not the artist type.  I don't know what I'd do with a tool like Illustrator.  Probably nothing - it'd be so over my head. <br> <br>Hrant - I didn't take it personally, and I apologize if I sounded as such.  I just wanted you to know where I was coming from on this. <br> <br>Randy - that was incredibly helpful, and I am carving out some time to work with your suggestions.  Hopefully this evening will pan out.  As is, I thank everyone who has posted here.  You have inspired me and given me the guidance to continue working on this so that it becomes as good as it can. <br> <br>Thanks guys.  I'll post back as soon as I can implement most of this.  Hopefully, I'll find a PDF writer somewhere on campus by that time.</p>
