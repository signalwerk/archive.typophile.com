    html: "<p>Hello Van. <br> <br>Welcome to typophile. This is a great first effort! <br> <br><i>That said, what are the issues of structure and finish that you see being detrimental to the face as it currently stands?</i> <br>Being a first effort, you've turned up many of the classic first time problems. Many of the issues turn up as a result of the constructed nature of your font (ie. you've borrowed the o to make the c, you've borrowed the c to make the n, youve borrowed the n to make the h, and I don't know why she swollowed the fly.) This is a very common way of doing things (even among accomplished designers). With time you will learn how the constructed letters need to be *fixed* to look correct. Aside from that, consider first the following font-wide problem: <br> <br><i>Stoke Modulation:</i> This is the location and flow of the thicks and thins of your font. Kudos to you, the locations of thick and thin look pretty good, it's the consistent application of thick and thin that is a big issue here </p>"
    html_clean: "<p>Hello Van. <br> <br>Welcome to typophile. This is a great first effort! <br> <br><i>That said, what are the issues of structure and finish that you see being detrimental to the face as it currently stands?</i> <br>Being a first effort, you've turned up many of the classic first time problems. Many of the issues turn up as a result of the constructed nature of your font (ie. you've borrowed the o to make the c, you've borrowed the c to make the n, youve borrowed the n to make the h, and I don't know why she swollowed the fly.) This is a very common way of doing things (even among accomplished designers). With time you will learn how the constructed letters need to be *fixed* to look correct. Aside from that, consider first the following font-wide problem: <br> <br><i>Stoke Modulation:</i> This is the location and flow of the thicks and thins of your font. Kudos to you, the locations of thick and thin look pretty good, it's the consistent application of thick and thin that is a big issue here </p>"
