    html: <p>&gt; I have about a thousand glyphs <br> <br>Ouch. The "plunge" seems to have been a while ago, actually... <br> <br>Well, the good news is that such obsessive behavior is a requirement for type design.  :-) <br>The bad news is that -as far as I'm concerned- just what you've shown really needs a <i>lot</i> of polish... <br> <br>Unless the intent -or at least an acceptable result- is to have a rough, "naive" looking font, there are issues of both structure and finish that need to be commanded before you worry about the <i>quantity</i> of glyphs. I don't want to be discouraging - in fact I think your heart is in the right place! But before you do any more bezier-pushing maybe it's a good time to look closely at existing (good) designs first? Develop a grasp of how things balance. <br> <br>hhp <br></p>
    html_clean: <p>&gt; I have about a thousand glyphs <br> <br>Ouch. The "plunge" seems to have been a while ago, actually... <br> <br>Well, the good news is that such obsessive behavior is a requirement for type design.  :-) <br>The bad news is that -as far as I'm concerned- just what you've shown really needs a <i>lot</i> of polish... <br> <br>Unless the intent -or at least an acceptable result- is to have a rough, "naive" looking font, there are issues of both structure and finish that need to be commanded before you worry about the <i>quantity</i> of glyphs. I don't want to be discouraging - in fact I think your heart is in the right place! But before you do any more bezier-pushing maybe it's a good time to look closely at existing (good) designs first? Develop a grasp of how things balance. <br> <br>hhp <br></p>
