    html: "<p>I think what Chris means about the thickness is some of your diagonals: like the M, that is way off from the rest. It isn't really up to mathmatical precision of your stems, it is also things like the terminals and horiz/vert joins and the spaces around and within the glyphs. The size of the  'e',  for example, iseems larger and lighter than the 'd'. The hairlines in 'v' seem thinner than those of the 'y'. This is a good, fairly complete start! I reckon the next step is to make the glyphs a little more consistent. <br> <br>kris.</p>"
