    html: <p>Chris- Unfortunately, I don't have PDF capability.  I will check at school (I am an AmeriCorps volunteer) to see if someone has the software, but I don't know of any Acrobat writers at my disposal. <br> <br>Do you think the ball terminal of the j is too heavy, or is it the body?  And does the short ascender on the k make it too weak?  For h and i, is it more of a cramped flow (spacing/metrics) or are the glyph forms too heavy? <br> <br>Hrant - the purpose was to actually do something artistic, for once in my life.  And I never worried about the quantity of glyphs, it was just borne out of my process; If I got stuck, I'd go and find some composite characters to make till inspiration hit. <br> <br>That said, what are the issues of structure and finish that you see being detrimental to the face as it currently stands?  Does it lack historical cohesiveness?  Is it more a matter of color and feel?  And more importantly, what do you mean by "how things balance"? <br> <br>PS, it was the fit of obsessiveness with type design that turned me on to it in the first place.</p>
