    html: <p>Woah, that file is over a megabyte! <br> <br>Save down to 16 colours, that's more than enough for anti-aliasing and it'll bring the file size down. <br> <br>Anyway, some letters like the B, P, G and W are squished, could be wider.  The S is weird, but I don't know enough to say why it is, someone else might be able to elabourate. <br> <br>I like the concept for the ampersand, but it looks very rough, needs to be fixed up a bit. <br> <br>Also, I don't know if it's me or not, but the thickness of the letters doesn't seem to be very consistant.</p>
