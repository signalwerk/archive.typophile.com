      <p>While I too initially desired for there to be more symmetry in this, I’d hate to lose the nice loopiness that is there. There are a few places where the curviness gets a little bit too wonky, though. Each of the strokes that lead into the curls widen and curve at awkward places. Work on making the transition from straight to curved areas smoother.</p>
      <p>penn</p>
