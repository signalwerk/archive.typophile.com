    <p>This is a mark i have been working on for my wife. She is a seamstress and crafter, she wants some thing she can stamp on the back of cards she makes and sew into blankets and things like that.</p>
    <p>I am pretty happy with it and she likes it, but everytime I look at it I feel like it isn’t finished.</p>
