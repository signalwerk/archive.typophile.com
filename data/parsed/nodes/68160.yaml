    <p>Hello every one, </p>
    <p>I am a student at the City College of New York and is doing my thesis now,<br>
    My thesis is about signage system in a 3-d form/ structure.</p>
    <p>and is in search of a nice serif font to go with the system.<br>
    I am working on the sketch for the structure now.</p>
    <p>but I am wondering if anyone has information on the fonts choice that's<br>
    suitable for such project?<br>
    nicely defined san serif fonts and maybe with some variations?</p>
    <p>any reply is greatly appreciated. again,</p>
    <p>thanks all,<br>
    eric</p>
