      <p>Is the premise of the paper that quality is a poor predictor of popularity?  ;-)</p>
      <p>Real quick:<br>
      - The narrowness makes it suitable only for display and very short text. In that context, the vertical proportions are decent. However the grid-conscious chunkiness is more attuned to smaller sizes. Basically: narrowness and grid-conscious outlines are rarely rational partners.<br>
      - In some sizes the descenders are touching the ascenders of the subsequent line.<br>
      - The spacing needs work; look at "oxi" and "brew". If anybody has a budget for respacing it you know who to call.  :-)<br>
      - The widths of the capitals are too divergent, especially for this style of type.<br>
      - The "g" and "s" are out of character.</p>
      <p>BTW in the description it says "Updated again in September 2012 based on many users' feedback". Did you show it here? If not, where did you get your feedback?</p>
      <p>hhp</p>
