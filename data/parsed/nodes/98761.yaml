      <p><em>So there is a clear distinction that we can make here that completely separates a 'professional tool' like a font, from those other sorts of objects that are not 'professional tools'.</em></p>
      <p>That would appear to be what I said, but I wasn’t trying to make the point that fonts are exclusively for professionals (which goes against my own experience, as my customers cover the spectrum from amateurs to professionals, especially at MyFonts), only that the professional market for fonts makes fonts different from other digital products to which they are often compared.</p>
      <p>Pamela Pﬁffner stated in her 2002 history of Adobe, <em>Inside the Publishing Revolution</em>, that the number of practising graphic artists was increased 25 fold by the digital revolution. I suspect that those ﬁgures were based on assuming that every user of Adobe Photoshop or Illustrator was a 100% professional graphic artist. But the marketplace isn’t like that, there are  prosumers, part-timers (through desire or force of circumstance), and those who have a non-graphic job which requires a modicum of design work. Many of those working as graphic artists have no formal training as such, and those graduating from a 1-, 2-, or 3-year course may have limited typographic skills. I’ve taught type design to 3rd-year students, and have observed that many have by that time forgotten a lot of what they learned in their ﬁrst-year “type 101” course—there being so many things a designer is required to know these days, animation and programming, for instance.</p>
      <p>Some of the best typographers I’ve come across in the publishing business have a background in writing and editing—they are very keen on making the text as readable and as accessible as possible, whereas some graphic designers are not really into words and conceive of text as grey bars in a layout.</p>
      <p>I don’t see much fundamental difference between Google webfonts and MyFonts in terms of the professionalism of the markets they cater too, and foundries publishing through MyFonts have been offering free fonts for some time—the success of Jos Buivenga’s (Exljbris) Museo family was in large part driven by his “free” strategy and duly noted by other foundries. </p>
      <p>Fonts are more like cameras than photographs, they are used to add value to a product, rather than as a consumable. But I wouldn’t draw too close an analogy, as there is no indie-camera industry.</p>
      <p><em>The font is more and more not a professional tool at all, it is more a social object and a free roaming web object.</em></p>
      <p>The introduction of @fontface hasn’t made web typography any less professional. It just means that web designers, from amateur to pro, now have a greater variety of web fonts to choose from than MS “core TrueType” fonts (Verdana, Georgia et al).</p>
      <p>If anything, @fontface has professionalized web design, by opening up a new market for font licensing, offering a level of sophistication not available through the limited selection of MS fonts.</p>
      <p>The argument has been made that Google webfonts are giving the public the unsophisticated fonts they want—but they will learn, just as the MyFonts market did as it matured; compare MyFonts best sellers now with 10 years ago, when the list was dominated by script faces, distressed faces, and mid-20th century classics. Those were by turn naive and safe choices. Now the list is full of extremely well crafted original designs from living designers who own their own foundries. </p>
      <p><em> … non-traditional markets, where content is being created often by non-professionals, and is being created and consumed in large parts for free …</em></p>
      <p>Google webfonts are traditional, not only because their design is by and large non-innovative, but because free generic and conservative fonts have been with us from day one of digital — bundled with the LaserWriter, bundled with Internet Explorer, bundled with Adobe applications, and bundled with the Mac and Windows OS’s. The whole history of the digitization of graphics, its tradition from the late 1980s, has been one of democratizing what were once exclusive trades.</p>
      <p><em> … it is likely that the commercial markets will more and more mirror the visual trends and memes of these social markets. </em></p>
      <p>I would say it will be the other way round, with commercial fonts driving the scene.<br>
      That would seem to be the case with Vernon’s Nunito, a latecomer to the rounded sans trend that began in 1997 with the release of VAG Rounded by Adobe, and was picked up by independent foundries with faces like Bryant, Chevin, Gotham Rounded, etc. GE’s corporate face was also a part of that early-noughts trend.</p>
