      <p><em> … going down that route leads you away from some very interesting type related stuff … </em></p>
      <p>I’m afraid I don’t ﬁnd highly derivative or generic designs to be interesting (unless they’re mine).<br>
      Rendering issues don’t excite me either, although I do admit that they can occasionally inform type designs in an interesting manner.<br>
      Of course, usability is extremely important in the marketplace, but more often than not it is the uninteresting fonts that are most usable and hence popular, because their neutrality and familiarity are easy to work with.</p>
      <p>And that is why I don’t consider Oswald to be an experiment.<br>
      None of the most popular Google webfonts are experimental, but this is:<br><a href="http://www.google.com/webfonts/specimen/Snowburst+One">http://www.google.com/webfonts/specimen/Snowburst+One</a></p>
      <p>Well done Vernon, you have exploited the Google webfont opportunity and created a “best-seller”, owning the niche of bold condensed gothic web font, in the way that Gotham/Proxima owns its niche. Now you can build on that, perhaps by extending its range to include italics or a single-bowl /a and /g variant. More importantly from a ﬁnancial perspective, you could monetize this product (if you can resolve the name issue) and produce desktop variants under your own foundry imprint, that may be licensed via commercial font distributors.</p>
