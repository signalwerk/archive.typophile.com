      <p><em>The fact is that free software models can help build creative and innovative platforms on which people can make money.</em></p>
      <p>Google webfonts would only be free if Google were a not-for-proﬁt staffed by volunteers.<br>
      As it is, Google webfonts are, among other things, a promotion for the Google brand, and a means for it to monitor website usage, which is valuable information for its core business. These are encumbrances.</p>
      <p>We’ve been here before, prior to the Internet, with bundled desktop fonts facilitating Microsoft, Adobe, Apple etc. to make proﬁts in their core businesses, while also seeding a font culture that has a commercial sector. </p>
      <p>“Free” is the way it is, but despite having proﬁted from it personally I’m not convinced this model is the best way forward. I have a feeling that the way digital culture has developed these past 25 years is in some way complicit with the exploding income gap; but not being an economist or academic, it’s just a feeling.</p>
      <p>As an artist, I’m very aware how hard it is to make a living producing creative content as a writer, artist, fashion designer, or musician, now that the means of production and distribution are open to everyone everywhere; and how the humanities are being derogated in academia. Culture has certainly been democratized, but not wealth. </p>
      <p>I don’t think fonts are typical of this situation, because they are professional tools rather than consumable products like music, clothes, pictures, ﬁlms, games or writing. That makes big-picture generalizations about software and the internet a bit suspect, when extrapolating to or from the font sector.</p>
