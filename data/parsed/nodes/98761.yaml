  - id: 533974
    user: 82025
    date: 2012-12-12T11:45:00
    date_raw: 12 December 2012 - 11:45am
    votes: 0
    html: |-
      <p>i moved the quote from hrant from <a href="http://typophile.com/node/95079 " title="Click to visit an external URL." class="freelink freelink-external freelink-external"> here</a> to below, because it's a good one.</p>
      <blockquote><p>It's neither the popularity nor the free/open-source nature of Oswald* that causes "long-term" type designers to see flaws in it. We see flaws in it because there are flaws in it. More to the point: if you were to invest more time into it there would be fewer flaws. Except you don't live in a barrel.</p></blockquote>
      <p>I totally see and accept the flaws, but the remit for a font like Oswald was not to create a flawless font. The remit was very clear; this -<br>
      make a highly popular and easy to use webfont, i.e. one which would be used by a lot of web designers to typeset a <strong>lot</strong> of text on the web, text that previously would have been text-as-a-bitmap-image-file, a.k.a. turn a lot of jpegs and gifs on the web into editable, searchable, copyable , shareable, active text. </p>
      <p>Looking at the stats, the adoption of Oswald amongst web designers has been strong, and the stats for it's api pulls show that's it's being read a lot, only Open Sans is being read more as a webfont right now. I think we can also assume from the stats that Oswald's steady rise in adoption by designers meant that there have not been any real world issues with legibility, or other similar issues that would 'turn off' readers.</p>
      <p>With the design of Oswald, it's easy to say 'meh' and stuff like "it's Alt Gothic renamed" etc but going down that route leads you away from some very interesting type related stuff, in my opinion. Oswald contains an 'approximation' of a type style, it was built like that purposely because the design process would be quick and i sensed it would result in a popular webfont (i was right on both). I think that 'approximation-ness' may be a too often overlooked aspect of designing fonts. For example, fashion designers use it a lot, and in the right hands it's an art in itself. H&amp;F-Jones do it a <strong>lot</strong> with type, and to great success, but have smartly branded it more high-end, under 'revival'. But Oswald was not designed for that league; it was created as a straightforward approximation of a clear popular style, plus there should be no licensing issues with it's use, plus it should be easy to get at and use, and also the design does have amounts of it's own personality. It's a no brainer really?</p>
      <p>The money thing; The design of Oswald was funded by Google as they were the only people at that time who were interested in funding the ideas behind a type experiment like Oswald. The connection is obvious looking at the question "what sort of fonts would get a lot of web designers using active text in place of bitmapped text?" :) I doubt that any other type-related companies would have funded an experiment like that, seen it's interest, or could have provided the tools to make it happen.</p>
      <p>-v</p>
      <p>ps if anyone else is funding how to make highly popular webfonts, you know who to call ;)</p>
