      <p><em> … i'm curious to hear why why type designers think that no-one else had made a font exactly like Oswald before.</em></p>
      <p>I didn’t think (about) that, because the degree of difference is negligible, or imperceptible without a close examination. I haven’t memorized every detail of what Alternate Gothic looks like (despite having licensed it c.1990 and used it for several years), so I am taking your word for it that your revival is quite close to the original, which substantiates my general impression.</p>
      <p>Without checking against the original, and after giving your design a closer look, I suspect you have softened it up a bit, making the rounded vertical stems curved, not straight with two tangential extrema, which is how I remember the bold condensed sans faces were made from 1840 on, so it does seem slightly revisionist. But you’re in good company—that’s how recent updates to Univers Condensed have been done. And the three weights, not quite sure how they would fall in relation to the original. Also, I’m guessing your /e’s crossbar is lighter than in the original, and the tail of your /y doesn’t look authentic, I suspect the original would have been perpendicular across the bottom, not an angled kink. And so on.</p>
