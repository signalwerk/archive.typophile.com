    <p>I am writing some papers on webfont usage, free software, viral production etc and am deeply interested to get feedback from type folk on my Oswald webfont, which is currently one of the most used webfonts on the planet. E.g. last week the font had 500,000,000 api pulls via the google servers.</p>
    <p>So i'm hoping people can throw down here whatever they think about Oswald. Haters and lovers equally welcome. Seriously, please vent if you feel the need to :)</p>
    <p>ps the GWF page for Oswald is here <a href="http://www.google.com/webfonts/specimen/Oswald">http://www.google.com/webfonts/specimen/Oswald</a></p>
    <p>-vernon</p>
