      <blockquote><p>I am taking your word for it that your revival is quite close to the original, which substantiates my general impression</p></blockquote>
      <p>Oswald is not much like Alt Gothic at all. Same way that Steve Madden is not like Givenchy.<br>
      The first weight started from public domain scans of alt gothic, ATF 1912. Basic scans, nothing fancy. From there it was a matter of making a functional webfont of that general 'alt gothic' style. There's been a few around before, but never fully 'free licensed' i believe. I never really tried to stay close or purposely deviate from the original specimens, hence a certain indifference crept in (which i like). Also looked at quite a few specimens of other historic, condensed gothics, (the sort of faces that Alt Gothic itself was derived from, no doubt) just to inform a few details. The first version was put out pretty quick, proved popular &amp; got feedback &amp; got some fixes and tweaks. Further weights and version were drawn directly from the original Oswald weight.</p>
