      It is, with the addition of skill, not only in its use, but in its choice.</p></blockquote>
      <p>dberlow &amp; Nick Shinn - Yes, exactly. So there is a clear distinction that we can make here that completely separates a 'professional tool' like a font, from  those other sorts of objects that are not 'professional tools'. So a font is made by one set of skills, personified by the typeface designer, for specific use within another set of skills, personified by the graphic designer, printer, art director. We can see a clear 'market' within that too. Font X takes Y amount of skill &amp; labour, so designer B will invest Z amount of $$s into acquiring use of Font X in order to make his product B worth more $$s. That works very well.</p>
      <p>However, i think that is also a snapshot of an historic era; the world no longer fits as neatly into that hole as it did say over 10 years ago. There are other things today. Graphic designers and printers are no longer the sole consumers of fonts (just like by the 1970's printers were no longer the sole consumers of fonts).  Nowadays, where the boundaries between producer and user has eroded (what Axel Bruns calls <a href="http://produsage.org/node/2" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">‘produsage’</a>), the font is now equally a ‘non-professional’ tool. In the form of the webfont, the font is now an integral part of large amounts of online matter that is created much more for a 'social market' than for what we could call a 'traditional' commercial market. And significantly it's not your 'professionals' creating all that content, it is increasingly content being produced by users of these markets, or by 'produsers' in these social markets and satellite markets . These social or non-traditional markets use webfonts on a huge scale. Compared to just 2-3 years ago, it's huge. So this is where font design and font licensing enters the scene; how does the traditional font &amp; it's licensing operate within these social or non-traditional markets, where content is being created often by non-professionals, and is being created and consumed in large parts for free? It is also content that is largely transient, copy-able, share-able, and re-useable. The font is more and more not a professional tool at all, it is more a social object and a free roaming web object. Let's not even get into the question of whether the creators of  'fonts as professional tools' have a sense to what fonts these new social markets actually want and will use. If they don't know (or think they know better) then they should perhaps take note, because it is likely that the commercial markets will more and more mirror the visual trends and memes of these social markets.</p>
      <p>-v</p>
