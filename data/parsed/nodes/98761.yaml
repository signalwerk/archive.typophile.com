      <p>I often forget to say thanks for time and brain power, so first off, thanks for the comments.</p>
      <p>dberlow - yes the webfont-server sector is alive and well, but there's no comparison for me there; i suspect that 2+ years ago, only one of those companies could have reached the amount of users that Oswald reaches. I refer you to the Mercruiser 350 and a Wärtsilä-Sulzer RTA96 analogy above. </p>
      <p>It could be purely coincidental, but i bet that commercial webfont use has risen as a result of the huge usage the google webfont services have had. Certainly the ease-of-use, nothing to lose, aspect of trying a webfont from the google service is a significant non-hurdle to adoption. Once designers have tried the technology, they are more inclined to think to use that technology, to sign up with a commercial service, and be able to convince their clients that extra cost is a good investment.</p>
      <p>Nick Shinn - Richard Stallman, the 'godfather' of the free software movement, has suggested that the use of webfonts endangers users' freedom, as does any practice of running programs that come across the network. If the program comes straight from a server, then in practice you don't have control of it, and it's effectively not-free. That's the only serious argument i have heard for saying that free webfonts are in fact not 'free'. It's a good argument too.</p>
