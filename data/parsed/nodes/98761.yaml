      So in terms of subject matter, i am writing about type in a world where there are technological, commercial and social shifts occurring pretty radically, which are effecting artistic and design production, and are effecting the way that digital matter is authored and consumed.  Some of the things that are in the thick of all this are; textual information and it's distribution, viral spread of style or behaviour via the internet, intellectual property rights &amp; it's relation to innovation and creation. Type is just one field effected by these shifts, so it's interesting to see how these changes are occurring in say, publishing or fashion design, as well as in type.</p>
