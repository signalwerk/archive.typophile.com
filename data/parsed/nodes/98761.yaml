      <p>Chris, sure,<br>
      I write (and read) a lot, it's an old habit from art school, conceptualising and digging into what you do and why you do it. A lot of artists and designers do that, so nothing unusual. Right now i am extending that practise into specifically putting together some 'conference' presentations i would like to give sometime &amp; blog posts. Also the more i get into this area the more i think there's a 'story to tell', especially as people in different areas of design &amp; tech are telling similar stories, but from their separate fields.<br>
      Ok, so first off, i didn't really want 'feedback' on the typeface (e.g. "is my 'a' too fat?"), but it's interesting to what i am writing about to understand a little of how designers on a forum such as Typophile view Oswald, and what would they think and say about it, because it reveals something about why other people design type, and what they think type does when it functions out there in the world.<br>
      So in terms of subject matter, i am writing about type in a world where there are technological, commercial and social shifts occurring pretty radically, which are effecting artistic and design production, and are effecting the way that digital matter is authored and consumed.  Some of the things that are in the thick of all this are; textual information and it's distribution, viral spread of style or behaviour via the internet, intellectual property rights &amp; it's relation to innovation and creation. Type is just one field effected by these shifts, so it's interesting to see how these changes are occurring in say, publishing or fashion design, as well as in type.</p>
