    <p>Hello Everyone,</p>
    <p>I am currently in the market for a new scanner. The reviews at online shops haven't really been helping me much because I am not really sure where my standards should be set. Ultimately I want to be able to scan photos, patterns and textures for design projects as well as font sketches for typeface development. </p>
    <p>I was interested in the Microtek s400, but then I read some reviews that called it slow and one even said that it doesn't work with Mac OSX.</p>
    <p>Does anyone out there have any advice on what I should be looking for? What do you use? How do you like it? How much should I expect to spend? Do certain brands work better with Macs and Adobe CS?</p>
    <p>I really appreciate any advice or guidance you may have,</p>
    <p>Duncan Robertson</p>
