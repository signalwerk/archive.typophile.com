      <p>Well I found a pretty good deal on the Microtek s400 at the store today so I went ahead and got it. I've got it hooked up to my PowerBook and everything seems to be running nicely. For now I am using the "Vendor Code" along with Photoshop and my test scans are nice and clear. </p>
