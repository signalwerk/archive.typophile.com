    html: |-
      <p>It's a good thing. They are great.</p>
      <p>SilverFast is a relaitvely deep program. Where most scanners lack is in the ability to pull out details in shadows. SilverFast allows you to do all your correction that you might do in photoshop directly in the scan. With some practice you will be able to get as much dynamic range as you possibly can out of your hardware. Yes, it completely replaces the native software, comes with custom transforms for your scanner and interfaces with photoshop. It also has little how-to videos that can be activated at various stages to help on the learning curve.</p>
      <p><a href="http://www.whitecube.com/html/artists/gig/gig_frset.html" title="http://www.whitecube.com/html/artists/gig/gig_frset.html">http://www.whitecube.com/html/artists/gig/gig_frset.html</a></p>
