    html: <p>Commissioners are sometimes quite fussy and always ignorant about fonts. So don’t try to persuade them. Especially if they are 45+ women. No sexist intentions there, just mere experience. If a commissioner has the time to quarrel over fonts and to infringe on your design, likely he or she is someone fitting the <a href="http://en.wikipedia.org/wiki/Peter_Principle" rel="nofollow">Peter principle</a>. Be pragmatic, ignore the pedantry, do as you please and get the approval of someone higher in rank, someone with no explicit opinions about fonts, but who'll sure acknowledge the designer knows for the best. He/she will really <em>see</em> the difference, especially if you say him/her Arial is a discount wholesale product, lacking each and every distinction.</p>
