  html: |-
    <p>Hi all- this is all new to me so please forgive my ignorance up front.</p>
    <p>I've been tasked with laying out a 100-page textbook-like publication (research based) on student achievement... I don't have much of a design background at all.</p>
    <p>I chose Perpetua Titling for my headers, Garamond for my text body- and used some different versions of Garamond for my pull out boxes- back to perpetua for pullout quotes.</p>
    <p>My boss likes it for the most part- but she is a big fan of Arial, as all of our materials that preceded this particular project (handouts, powerpoints, workbooks, etc.) have used Arial. For everything. It's always been one of my least favorites, and really looks amateur in a textbook format.</p>
    <p>I'm using the newest Indesign, but I don't have time to keep playing with the type as much as I would like, so I found you all. I'm hoping you have some suggestions that could make her happy (but for real, how much of a "brand" can you build on an Arial font?)</p>
    <p>Thank you so much in advance! I can't wait for your thoughts! Jen</p>
