      <p>You might want to look at typeface design in Japan, where to serve the needs of the Japanese written language, one needs to produce designs for hiragana, katakana, kanji, and romaji (the Latin alphabet), not to mention Arabic numerals, that work together in text. A Japanese newspaper article will often require all of these different scripts to work seamlessly. Is it multiculturalism or capitalism at work? Hard to say. Perhaps a willingness to represent different origins in Japanese vocabulary through different scripts is at work here, although it’s certainly more complicated than that.</p>
      <p>In Korea, hangul (the Korean alphabet) and Chinese characters tended to be used together in the past because of the prestige of the difficult-to-learn Chinese characters, but 99% of the texts produced today are written exclusively in hangul. Typefaces for Korean use are designed to include hangul (Korean alphabet) and Latin as a minimum requirement. Most Korean type designs don’t include Chinese characters to match the hangul, since the time and/or design expertise they require isn’t usually available. The understanding is that one can choose from the handful of those fonts that include Chinese characters to match the hangul design.</p>
      <p>I wonder whether in the future, Korean type designers who want to include Chinese characters will find it desirable to collaborate with Japanese and other non-Korean designers who have more expertise and manpower in producing Chinese characters.</p>
      <p>Because of the different scripts required and the sheer volume of work in producing kanji alone (several thousands glyphs are needed), type design in Japan is already largely a collaborative process, even in the age of font-design software.</p>
      <p>For a fascinating example of such collaborative efforts that pool the expertise of designers working in different scripts, take a look at the recent <a href="http://www.khtt.net/artefact-106-en.html">Typographic Matchmaking Project</a> that brought together Dutch and Arab designers to produce Arabic designs to harmonize with existing faces by Dutch designers.</p>
