      <p>Of all the type designers I have met, I don’t believe I have ever met one with overriding capitalist interests. There just isn’t enough money to be made in the field to satiate that kind of desire. I think they just like the challenge of multiscript work and love the look of the several alphabets they work with. It is more like they thought, “I wonder what this face would look like in Cyrillic?” rather than, “I’ll bet I can rake in big bucks from those Ruskies if I do a Cyrillic version, too.”:-) </p>
      <p>They just do it for the love of letters.</p>
      <p> ChrisL</p>
