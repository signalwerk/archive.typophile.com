      <p>Might want to look at the ClearType Collection fonts and the booklet “Now Read This” - the book has details of how each typeface was conceived from the get go to support a pan-European glyph and feature set.</p>
      <p>Apart from that there should be material online around the idea that for a duo-script font, say one supporting English and Armenian, you need to produce two versions, one for use when Armenian is the dominant script used in a document and one for use when English is the dominant language.</p>
