    <p>I am curious what people think about the designing of multi-lingual scripts (i.e typographic matchmaking). </p>
    <p>Is there perhaps a dialectic at work? I mean that while on the one hand the designing of multi-script families seems to be a way of visually representing rising multi-culturalism and the displacement of peoples of different backgrounds.<br>
    An appeal in type for harmony in the “Contact Zone”!?<br>
    But then could economic factors be brought to bear on this as well (i.e. multi-script design perhaps reflecting a convergence with purely capitalist interests, using the vision of cultural harmony as smokescreen??).</p>
    <p>Although it seems to be a developing area I’d also sure like to know about historical precedents of scripts being designed side by side.<br>
    Is this the future of type design? Where does it lead?<br>
    (and pardon if my words be poorly formulated)</p>
