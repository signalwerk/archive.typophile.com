      <p>I like your last batch best also. Aesthetically, I think I would further develop the straight rgbo7 concept. If you went with that direction, I think there definitely needs to be a color distinction between rgb and o7. The angled concept, however, seems to more appropriately represent a "festival". I like Hrant's last suggestion. Use your current forms as a foundation, then loosen them up a little more. Make the shapes less rigid without losing the general shape. Maybe consider adding some additional graphic elements to further contribute to the festive feel...Being very careful not to make it look trite or hokey.</p>
      <p>Aloha,<br>
      Scott</p>
