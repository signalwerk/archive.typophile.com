      <p>This is a good resource for looking at swedish texts from the time: <a href="http://litteraturbanken.se/" title="http://litteraturbanken.se/">http://litteraturbanken.se/</a></p>
      <p>Basically, a lot of stuff from the previous two centuries, often weakly typeset. Caslons, blackletters, you name it.</p>
      <p>This one is set in Kis/"Janson": http://litteraturbanken.se/#!forfattare/ThorildT/titlar/Critik1/sida/4/faksimil</p>
