    <p>Hello to all type fans!</p>
    <p>I'm in desperate help of a school assignment i'm currently working on. :(<br>
    The brief was to find out about the history of a certain font.</p>
    <p>I was assigned to fred lambert's compacta.</p>
    <p>Searched high and low on google and the library for him on the related font, but efforts were in vain.</p>
    <p>I came across this book by the name of "American type design and designers" as reference according to some helpful source.<br>
    Only after reading more, i came to realize there's very little info about him.</p>
    <p>It's only about letraset corporation set-up and compacta being the company's 1st letraset font to be created.</p>
    <p>I can't figure these questions as the answers have to be long, not some one or two lines.</p>
    <p>(1)Reason behind the font<br>
    (2)Reason behind the font’s name<br>
    (3)History of the font</p>
    <p>Can fellow type fans please do me a favor by helping me out? Really appreciate it! :)</p>
