    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Jason Walcott</strong></p>
    <p>Jason graduated from <a href="/wiki/Kean%20College%20of%20New%20Jersey" class="freelinking" rel="nofollow">Kean College of New Jersey</a> in 1997 with a BFA in Illustration and Graphic Design. He formed <a href="/wiki/Jukebox" class="freelinking" rel="nofollow">Jukebox</a> as branch of his JAW Designs to market his type designs. Much of Walcott's work is inspired by the lettering aesthetics of the ‘50s and ‘60s Americana. Jukebox typefaces are available exclusively at <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>.</p>
