    <p>All</p>
    <p>I got some feedback on the initial drafts of this book design a while ago, but it is nearing completion now.  </p>
    <p>At the last minute I decided to get and try out a new typeface that I really love.  My first typeface is Arno Pro and the second is Feijoa.  I am not sure which works best in this context.  </p>
    <p>I would also welcome any other criticism on layout, leading, anything really. This is a piece of university coursework, which I have to submit as part of the degree.  I will, of course, include anything that I learn and use and reference my sources. I say this to be clear that I am trying to learn, rather than get something for free.  I have done a lot of reading and research, but as this is the first time I have designed a book, I would welcome opinions. For example I have used ligatures in the poem itself, but am not sure if they are too much here, especially opposite the calligraphy.</p>
    <p>Both of my pdfs have a couple of blank pages at the beginning and they are not completely finished yet</p>
    <p>Thank you</p>
