    html: |-
      <p>"If there is any general idea underlying Rumi's poetry, it is the absolute love of God. His influence...." God's influence or Rumi's influence?</p>
      <p>"As a native speaker...." This is a dangling modifier. The long phrase is not about "Khalili's translations", it is about Khalili himself. Rewrite.</p>
      <p>"Rumi 24 years old...." Does this need another comma?</p>
      <p>Is there some explanation of the calligraphy?</p>
      <p>"All rights reserved...." This entire paragraph is on the page twice. Is this intended? Also, at least in the US, the phrase used is not "prior permission of the copyright holders", but rather "prior permission of the publisher". </p>
      <p> Do you need a year referenced in the copyright? (I have no idea.) </p>
      <p>Well, I like the typeface in design 2; but this may be because I generally like darker fonts. And the dark face in design 2 goes with the calligraphy very well.  Design 2 is very readable. I vote for design 2. </p>
      <p>This, to me, is a very readable left-aligned (ragged right) work. Very nice.</p>
