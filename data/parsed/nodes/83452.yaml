      <p>sorry for the late answer, I was away a couple of days...</p>
      <p>Nick, it seems like you summed it up pretty well. The the raised diagonal certainly works better in condensed design, as they fx were quite popular in the late 18 – early 1900's and this is definitely a more plausible reason for its appearance than a purely stylistic inspiration.</p>
