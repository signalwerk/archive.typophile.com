    html: |-
      <p>If I'm not mistaken, the Book of Kells image shows a «diagonal» that's both moved down from the top <em>and</em> moved up from the bottom, so completely avoids pointy joins – sort of like a H with a tilted crossbar. The one from Korinna shown above can then be seen as a hybrid between that shape and the more usual one where the diagonal is, in fact, a diagonal, forming an apex and a vertex.<br>
      So much for observation. I'd like to learn more about the background of these forms, too.</p>
