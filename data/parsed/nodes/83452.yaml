    html: |-
      <p>It's more likely that the elongated aesthetic of art nouveau was interpreted in lettering as "high-waisted", and that this form of N harmonized with the look of capitals that have raised middle crossbars.</p>
      <p>Also, in ultra-condensed low-contrast styles, squeezing in a long diagonal crossbar is extremely problematic, so the higher join lessens the angle, and the problem.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/led-zeppelin_3882.jpg"></div><p></p>
      <p>When designing Beaufort, I found that this effect enabled me to keep the angle of the diagonal consistent across weights. Also, it provided a bit of interest to that bottom right joint in the heavier weights, to match the interest provided by the sharp point, descending below the baseline, in the lighter weights. A normal blunt join would have been too dull, and a less-than-stem-width flat terminal would have been an anomaly. And, also, it counterbalances the "overshoot" of the diagonal at the top left.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AN_3426.png"></div><p></p>
      <p>IMO, individual glyph shapes in original type designs are most often functional interpretations of the thematic vocabulary, concerning harmonies of shape and proportion, that characterize typefaces, and not primarily references to specific glyph forms associated with historical precedent—although previous themes <em>in toto</em> may inform the new typeface.</p>
