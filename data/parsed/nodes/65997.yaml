      <p>&gt;Can’t think of any right now (by name) but weren’t some fonts designed for computer programming. Unique 1 and 0, and monospaced widths.</p>
      <p>Consolas would probably count on two fronts - designed for coding and for ClearType. Which kind of leads one to consider OCR A and B - fonts designed to be read by computers as well as humans, and maybe code 39 barcodes - fonts designed to be read just by computers :-)</p>
