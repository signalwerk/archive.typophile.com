  html: <p>This is a subject I've been fascinated with since my freshman year of design school, after writing a paper about Matthew Carter and his work like Bell Centennial for phone books, Verdana for the screen, and Olympian for newspapers. I'd love to learn more about typefaces like this that have been designed to perform in really specific settings. Anyone know of any examples?</p>
