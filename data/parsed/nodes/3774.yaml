  html: <p>Hihi, I'm a graphic design student from Canada and I was wondering if anyone else had ever come accross with the problem of bilingual forms. <br> <br>Recently, for my typographic grid class my teacher assigned us with a very horrible looking form from a nearby university. Basically there are two copies of this form, one is in english and the other one in french. Our job is to redesign this form so that a) it's only one page and b) it's much more attractive than the previous one. <br> <br>Unfortunately, forms already tend to be packed with lots of information so it's kinda hard to keep in legible and <b>bilingual</b> on one page ... <br> <br>Any suggestions?</p>
  html_clean: <p>Hihi, I'm a graphic design student from Canada and I was wondering if anyone else had ever come accross with the problem of bilingual forms. <br> <br>Recently, for my typographic grid class my teacher assigned us with a very horrible looking form from a nearby university. Basically there are two copies of this form, one is in english and the other one in french. Our job is to redesign this form so that a) it's only one page and b) it's much more attractive than the previous one. <br> <br>Unfortunately, forms already tend to be packed with lots of information so it's kinda hard to keep in legible and <b>bilingual</b> on one page ... <br> <br>Any suggestions?</p>
