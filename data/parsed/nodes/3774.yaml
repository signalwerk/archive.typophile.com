    html: "<p>I really don't see how Shannon is whining. <br> <br>-- <br> <br>I think there are two possible strategies: make the two languages visually as close as possible; or apply some cultural sensitivity and risk the wrath of the cross-eyed Modernists. <br> <br>The first option is pretty easy. But it might result in the functional quicksand like in Emil Ruder's monolithic (in contentually great) textbook. <br> <br>The second option might benefit from using totally different fonts for each language. Ladislas Mandel for example insists that French type needs to have a smaller x-height. This would actually help in the technical realm too, since French will generally run longer (like Nick says). You could also be more conservative and simply apply width (friendliness versus elegance) by using an MM font with a width axis, and making the French font slightly narrower, which would also help with balancing the space usage. Note however that smaller x-heights and narrowness will make the French have a smaller apparent size, and some people might interpret this as \"less important\" (although others might see it as \"discrete\", which fortunately happens to be in cultural character). One thing you could do to counter this is put the French first, like on the left or on top. You could also use a bit more leading to make it seem \"larger\" in a different way. <br> <br>BTW, there are some great articles in old issues of the journal Visible Language about multilingual typography. <br> <br>hhp <br></p>"
    html_clean: "<p>I really don't see how Shannon is whining. <br> <br>-- <br> <br>I think there are two possible strategies: make the two languages visually as close as possible; or apply some cultural sensitivity and risk the wrath of the cross-eyed Modernists. <br> <br>The first option is pretty easy. But it might result in the functional quicksand like in Emil Ruder's monolithic (in contentually great) textbook. <br> <br>The second option might benefit from using totally different fonts for each language. Ladislas Mandel for example insists that French type needs to have a smaller x-height. This would actually help in the technical realm too, since French will generally run longer (like Nick says). You could also be more conservative and simply apply width (friendliness versus elegance) by using an MM font with a width axis, and making the French font slightly narrower, which would also help with balancing the space usage. Note however that smaller x-heights and narrowness will make the French have a smaller apparent size, and some people might interpret this as \"less important\" (although others might see it as \"discrete\", which fortunately happens to be in cultural character). One thing you could do to counter this is put the French first, like on the left or on top. You could also use a bit more leading to make it seem \"larger\" in a different way. <br> <br>BTW, there are some great articles in old issues of the journal Visible Language about multilingual typography. <br> <br>hhp <br></p>"
