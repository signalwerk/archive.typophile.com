    html: "<p>1. Allocate equal space for each language, but always allow for the longer (French) <br> <br>2. Use a different (though harmonious) type style for each of the two languages <br> <br>3. Don't be afraid to use rules to organize and separate items, and background tints to suggest hierarchy: although the tendency with modernism is to remove non-typographic elements, that's not the best strategy for complex forms. <br> <br>4. You won't find this kind of work in awards shows/annuals (it's not Hollywood enough) However, it is amongst the purest and most demanding aspects of graphic design. Take a look at some of Erik Spiekermann's forms design -- he obviously loves and respects this kind of work, and even manages to bring some style to it. (Sorry, can't remember where I saw the examples.)</p>"
    html_clean: "<p>1. Allocate equal space for each language, but always allow for the longer (French) <br> <br>2. Use a different (though harmonious) type style for each of the two languages <br> <br>3. Don't be afraid to use rules to organize and separate items, and background tints to suggest hierarchy: although the tendency with modernism is to remove non-typographic elements, that's not the best strategy for complex forms. <br> <br>4. You won't find this kind of work in awards shows/annuals (it's not Hollywood enough) However, it is amongst the purest and most demanding aspects of graphic design. Take a look at some of Erik Spiekermann's forms design -- he obviously loves and respects this kind of work, and even manages to bring some style to it. (Sorry, can't remember where I saw the examples.)</p>"
