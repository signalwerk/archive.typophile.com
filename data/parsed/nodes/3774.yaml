    html: <p>WOW~  <br> <br>I really didn't expect so many replies. First I'd like to thank you all for your helpful suggestions and you'll all be happy to know I handed in my form and I think my teacher smirked when he was grading my piece ....  <br> <br>I still don't know if that's a good thing or not. At any rate to answer Chris' question ... I believe my first drafts were trashed because the first one was "too symmetrical" (but I thought it was easier to read). And the second one was too simple (which I thought was the point of a form).  <br> <br>Either way, I learned a lot about form making that's for sure. Everytime I see a bilingual magazine now, I quiver ...</p>
