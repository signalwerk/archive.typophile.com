    html: "<p>Translate the form into 'Franglais': rather than assuming that the form needs to be bilingual, assume that the reader is competent enough in one language to be able to sort out the meaning from a combination of languages. If nothing else, you'll amuse yourself and perhaps win points for lateral thinking.</p>"
