    html: "<p>French more longer than English is a legend created by bad translators. I do most of my publications English French, and in many case my English is more longer (Yes, I'm one of these bad translator to English, so more long). :-) <br> <br>A very recent example from this afternoon: I just edited the French texts of the Avenir Next specimen. Booth English and French came from German source. My job was to edit the French, as the original translation was bad (BabelFish have done perhaps better job than that one). <br> <br>The main conceptual text take 1642 signs in French, 1708 in English. English more longer! <br> <br>Each language has his owns habits don't try to make them identical, its a stupid 50's universal approach. <br> <br>Sometimes, one language will take more space than another for many reasons, subject, translation, style of the writer, sometimes its the reverse. Who know the truth?</p>"
