    html: <p>Also, regarding the whole whining thing. I wasn't whining at all ... it's just that I have 8 classes, that are each 3 hours and that are basically all graphic design classes. Which means that for every class I have 2 hours of research and 6 hours of homework to do per week (minimum). You do the math and you'll realize that they're aren't enough hours in the day to allow me to do that. <br> <br>Then again, that's school for you. However, time because very precious to you in school as well as in the work place. No one likes to waste 6 hours working hard and then being told that what you did was "worse than the original" piece the teacher gave you. Which is what my teacher had told me. So yeah ... I was frustated, but I wasn't trying to whine. I'm sorry if some people felt like I was. I was merely frustated and had a mental block for my project. <br> <br>I believe that's called being human.</p>
