    html: <p>Although [literal] translation adds about 10-15%, some languages are still more verbose than others. English is generally very terse, while Latin languages (except Latin itself!) are more verbose. <br> <br>It's rare to find good benchmarks of language economy, but a handy one is Zhukov and Sadek's "Typographia polyglotta", which shows official, very tight, but <i>non-literal</i> versions of the UN Charter in 20+ languages. It shows that the main Latin languages run about 10-15% longer than English. So when you couple that to sloppy translation you can get a huge expansion. When Jorge de Buen translated my "Improving the Tool" essay (~2,500 words) into Spanish and got a gain of only 14%, that was pretty impressive - the UN Charter is 17% longer. <br> <br>BTW, an Armenian from Lebanon has four "unofficial" languages!  :-/ <br> <br>hhp <br></p>
