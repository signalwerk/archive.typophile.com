    html: |-
      <p>Yeah, the glyph combination isn't quite as fluid as we'd like. Hopefully we can improve that in a future update. In the mean time, it helps if you perform the glyph-combining pinch action with a bit of extra force. Chris Lewis describes it as though you're "poking someone's eyes out" :)</p>
      <p>As for the fonts the app is able to recognize... they don't have to be fonts that we have permission to <em>license</em> necessarily, but they do have to be fonts that we have permission to have in our database. For example we've gotten permission from <a href="http://www.fontfont.com" rel="nofollow">FontFont</a> to use their fonts for matching images submitted to WhatTheFont…but we don't have permission to sell licenses to end-users on their behalf.</p>
      <p>Now, if the font someone is trying to identify with WhatTheFont is something we don't have in our database <em>at all</em>, we can only suggest close matches. A perfect example: WhatTheFont gets tons of submissions of images of Obama posters that are set in Hoefler &amp; Frere-Jones' <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100008" rel="nofollow">Gotham</a>; but because we don't have permission to have any H&amp;FJ fonts in our database — for sale or otherwise — we're unable to provide a perfect match.</p>
      <p>With that said, MyFonts represents the world's largest collection of fonts (that I know of), so the matches for most images (of reasonable quality) submitted through WhatTheFont are pretty good, if not dead on. In that regard, a comparison between MyFonts and Amazon could be made: you might not find everything in the world, and some of what you do find might not be for sale, but it's a good place to start.</p>
