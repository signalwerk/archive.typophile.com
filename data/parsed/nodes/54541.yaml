    <p>Can someone build a Shazam-like, typeface-identification application for the iPhone?</p>
    <p>Here's how it would work: 1) you point the camera at the text in question; 2) you take a picture; 3) and then you let the app identify the typeface for you while you wait. (Maybe there's an intermediate step between 2 and 3 where you verify that you've taken the correct photo and that you didn't make it come out all blurry.)</p>
    <p>Scenario 1:<br>
    You're reading a beautiful old book and are wondering what type it's set in; you check the colophon and copyright pages--nothing doing. No problem, you take out your iPhone, open the type-identification app, snap a photo of the book, and wait a second. A second later, the app tells you the name of the type that the book was set in.</p>
    <p>Scenario 2:<br>
    You and your friends are arguing about the typeface that Wes Anderson always uses--the one that looks a bit like Futura but isn't Futura. Is it Avenir? No one can agree. Someone takes out her/his iPhone and . . . you get the idea.</p>
    <p>--Justin</p>
