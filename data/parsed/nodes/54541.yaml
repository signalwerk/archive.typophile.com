      <p>Hello, </p>
      <p>With regards to your problem, I think that main problem with the current iPhones (first and second model) is the camera—it's no good at macro unless you use something like <a href="http://www.griffintechnology.com/products/clarifi" rel="nofollow">this</a>.</p>
      <p>Other than that rather large obstacle, it shouldn't be too hard to develop a service to upload a photo from your iPhone library and generate a TinyURL-style address for you to enter into What The Font. It may already be possible to do this with a combination of available applications, but I haven't tried.</p>
      <p>So until the iPhone camera/lens improves, scenario 1 is going to be hard.</p>
      <p>Scenario 2:<br>
      It is Futura (bold).</p>
      <p>If/when the iPhone camera can do macro well, I look forward to something like this being developed (along with something like <a href="http://www.biggu.com/" rel="nofollow">ShopSavvy</a> from the Android Market).</p>
