    html: |-
      <p>URW Bodoni does not have an Italic though, only an Oblique. ITC Bodoni comes in three optical sizes and it suitable for longer text (most Bodonis are not). It al depends if you are looking for a Bodoni for headlines or logos or for running text. Bauer Bodoni is good for headlines, as is Bodoni Antiqua, both from URW, they are very affordable and good quality. ITC Bodoni is more suitable for text (the 6 and 12 pt versions) but the 72 pt version is very nice for display. It is less stiff in its geometry, more elegant, but very nice. <a class="freelinking external" href="http://www.stonetypefoundry.com/itcbodoniovervie.html" rel="nofollow">Stone Type Foundry</a> has them at a very affordable price.</p>
      <p>Otherwise you can search for <a class="freelinking external" href="http://new.myfonts.com/search/didone/fonts/" rel="nofollow">Didone</a> at MyFonts to get Bodoni-esque fonts</p>
