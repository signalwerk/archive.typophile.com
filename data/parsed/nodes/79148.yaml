    html: <p>I don't know which bodoni you are referring to. All bodonis go back to the typefaces of gianbattista bodoni. But as he cut various typefaces, for different sizes, there isn't one true bodoni of which others are derivates. Bauer Bodoni is a very classical cut, very good for display use, but a bit too thin and wide for text work, as the thin lines will be very hard to read. Berthold Bodoni is the same as Bodoni Antiqua, it is considered another succesful cut, which is slightly more robust than the Bauer version, so more suitable for text, but still perhaps a bit too refined for that. Then there is ITC bodoni which is actually three bodonis, the 6 is based on gianbattista bodonis small type, the 72 based on his display work, and the 12 is 'generated' as a mixture of the too. overall I would say that ITC Bodoni is a bit more organic than the other too, and more suitable for text work. These are the bodonis I know well, others will differ slightly in their geometry, thick thin contrast, and their detailing (serifs for instance). But these differences seem small at first glance.</p>
