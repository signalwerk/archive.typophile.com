    html: |-
      <p>You design the pages first at the size you want them, and then contact the printer who'll be able to tell you the right size of the cover, spine et cetera. The cover size (front + back + spine + inward folding) depends on thickness of the cardboard, the chosen style of spine (flat or rounded for instance) and more such parameters. Your printer should be able to help you out. </p>
      <p>Preferrably you'll contact the printer even before you start designing the pages. Together you'll be able to determine optimal sizes.</p>
