  html: |-
    <p>I have a question about hardcover book design. </p>
    <p>If for example designing a 6x9 hardcover book, what size do you make the inside pages, which will obviously be smaller to allow them to fit within the hardcover?  </p>
    <p>Or do you design the pages at 6x9 and then make the hardcover bigger?</p>
    <p>Is there a standard size convention used?</p>
    <p>any help would be very much appreciated. Thanks so much!!!</p>
