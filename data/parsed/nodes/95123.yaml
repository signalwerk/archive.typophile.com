      <p>Just a couple of thoughts:<br>
      I would move the cut on |O| and |o| to the upper right, to further differentiate them from |D| and at the same time nodding to their cursive forms.<br>
      Your |Ф| looks a bit small. I recently learned on this same forum it’s an accepted practice to extend the center stem above caps height and below the baseline in order to make room for the bowl.</p>
