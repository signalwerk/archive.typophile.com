    <p>The typeface I'm working on is a redesign of my own font I made a while back, an extra-expanded, futuristic font that I've decided to bring back to the chopping block and make something more valueable from it. I ended up making something entirely new and here it is - Cepheid.</p>
    <p>The typeface includes only capitals, latin + some diacritics + cyrillic letters and of course punctuation, all normal and italics. The design is meant to be futuristic, yet quite versatile - that's why I tried to minimize the "oddities" while maintaining the unique look. It's still much of a 'work in progress', still working on the geometry of the letters so I haven't touched much of the kerning yet.</p>
    <p>Any advice appreciated of course!</p>
    <p><img src="http://michalfigas.art.pl/cepheid.jpg" width="100%"></p>
