      <div class="comment-spam-body"><p>This is a repost of a comment I added to the thread mentioned above:</p>
      <p>Those of you interested in space and type will be glad to know about a book I packaged and produced for The MIT Press, to be released in a couple of weeks. It’s called:</p>
      <p>Marketing the Moon: The Selling of the Apollo Lunar Program<br>
      by David Meerman Scott and Richard Jurek<br>
      with a foreword by Captain Eugene A. Cernan--the last man to walk on the Moon<br>
      <a class="freelinking external" href="https://web.archive.org/web/20140720075429/http://mitpress.mit.edu/books/marketing-moon" rel="nofollow">http://mitpress.mit.edu/books/marketing-moon</a><br>
      <a class="freelinking external" href="https://web.archive.org/web/20140720075429/http://www.amazon.com/Marketing-Moon-Selling-Apollo-Program/dp/0262026961" rel="nofollow">http://www.amazon.com/Marketing-Moon-Selling-Apollo-Program/dp/0262026961</a><br>
      <a class="freelinking external" href="https://web.archive.org/web/20140720075429/http://www.marketingthemoon.com/" rel="nofollow">http://www.marketingthemoon.com</a></p>
      <p>It contains some three hundred period images, including all kinds of advertising and PR material, as well as some key documents that have never been seen before. One item of direct relevance to this thread is a handwritten note showing the relationship of Kubrick and Clarke and Julian Scheer, the head of the NASA Public Affairs Office at the time 2001 was in the works, as well as the relationship of some others involved with both NASA operations and the film.</p>
      <p>For those of you who are interested in period typographic analysis, it’s a gold mine of graphics related to the space program, all very well reproduced (if I say so, myself). I consciously avoided using space-program era types in the design of the book, which I thought would be gilding the lily, considering the illustrations.</p>
      <p>You won’t be disappointed!</p>
      </div>
