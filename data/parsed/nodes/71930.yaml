    date_raw: 4 Jul 2010 — 5:10pm
    votes: null
    html: <p>Check your Ascender and Descender values and double check that you don't have any stray elements that might be auto generating such an extreme default auto leading value. I like working with UPM at 2000 and depending on the type, Caps height somewhere around 1200-1600 with Ascenders/Descenders and x height set accordingly.</p>
