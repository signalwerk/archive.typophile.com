      <p>Since the question is one of terminology, I presume the Oxford English Dictionary should be a reliable reference. Here is the corresponding entry:</p>
      <blockquote><p>
      <strong>c.</strong> <em>Typogr.</em> Having no leads between the lines; unleaded; (see also quot. 1888).
      </p></blockquote>
      <p>and here is quot. 1888</p>
      <blockquote><p>
      1888&nbsp;&nbsp; C. T. Jacobi <em>Printers' Vocab.</em> 128&nbsp;&nbsp; <em>Solid matter</em>, type composed without leads; also applied to type with but few quadrats in.
      </p></blockquote>
      <p>Here is something else from the Treasury Board of Canada Secretariat <a href="http://www.tbs-sct.gc.ca/fip-pcim/glo-eng.asp">http://www.tbs-sct.gc.ca/fip-pcim/glo-eng.asp</a></p>
      <blockquote><p>
      <strong>Blank line (ligne de blanc)</strong><br>
      A blank space equal to the type size used. For example, a blank line for 10-point type, set solid, is specified as 10 points, but measures 20 points from base line to base line.
      </p></blockquote>
