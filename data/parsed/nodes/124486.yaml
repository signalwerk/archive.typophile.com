      <p>Well, it certainly is true from mathematical logic when the type in both lines belongs to the same font.</p>
      <p>It can be false, though, if the first line is Century Expanded (set on the Standard Line) and the second line is Cloister Lightface (set on the Art Line or Script Line). In the case of metal type, the position of the baseline within the metal type slug is variable depending on the typeface. (I see, though, you specifically said "in a given font".)</p>
      <p>In the late 19th century, for the convenience of printers, the major typefaces made their types lining by having only three standard baselines - one for classic typefaces like Caslon or Jenson, used also for script faces, one for the workhorse faces of the day with fairly short descenders, and one for titling faces.</p>
      <p>The differences between these baselines were made to be in whole point increments as far as possible - and 1/2 or 1/4 point if not.</p>
      <p>Before that, the baseline was an individual matter, depending on the typeface.</p>
