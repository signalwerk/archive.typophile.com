      <p>While this is almost always true, interestingly, Bringhurst chooses to point out a case where this isn't true, in his only example of a metal type sort in the newly added spread on setting lead type.</p>
      <p>For a reference, see Ralph W. Polk's The Practice of Printing, or even better, Printing for School and Shop by Frank S. Henry — both high school printing textbooks from the first half of the twentieth century.</p>
