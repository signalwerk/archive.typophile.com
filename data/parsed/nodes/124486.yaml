      <p>I don’t understand why you would want an authoritative reference for that. It’s pure mathematical logic and therefore undeniable. It doesn’t require any “metal type guy” saying so in a “metal type book”. </p>
      <p>The first baseline is at “top edge” (0) + x.<br>
      The top edge of the second line is at 0 + point size (y).<br>
      The second line’s baseline is at top edge of the second line (=point size) + x.<br>
      The difference between each consecutive baselines is therefore y + x - x = y (=point size).</p>
