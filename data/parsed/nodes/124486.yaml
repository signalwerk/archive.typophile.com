    <p>So, I know this to be true, I can explain it logically, but I am looking for an authoritative reference (other than this thread) that specifically mentions that with metal type, set solid, in a given font, the baseline-to-baseline distance is equal to the point size.</p>
    <p>I won't object if you chime in and say that this is true (or not), but a reference would be most helpful.</p>
    <p>Anybody?</p>
