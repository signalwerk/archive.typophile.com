      <p>I truly feel that using different treatments would work best on several levels.</p>
      <p>For one, changing typefaces and size, shooting static text, panning segments, etc., would do a lot to relieve the tedium of reading straight text, no matter how compelling the words.</p>
      <p>Consider how Pablo Ferro mixed several modes of reading text, and how the reader focus is maintained is the opening credits of <a href="http://www.pabloferro.com/portfolio_content90.htm#" target="new" rel="nofollow"><strong><em>To Die For</em></strong></a> (viewable as QuickTime movie).</p>
      <p>I know the subject matter and film mood is all together different, but before you watch the clip TURN OFF the soundtrack. That will allow you  to see how Pablo works the images on the screen. Also, you will know what mixing methods can mean as you get towards the middle of the clip.</p>
      <p>I won't reveal anymore since the clip will "speak" for itself. It would require more work than just using title text, but who said doing great work was easy.</p>
