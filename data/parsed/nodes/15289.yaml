      <p>The new Optima Next's display cut might work really well. For a motion/video piece though you do have to worry about excessive stroke contrast (typical of serif faces). BTW, considering the Aeschylus/Greek action in there, something with a Greek reference (Skia?) might be cool.</p>
      <p>Here's another idea, one that might leverage David's useful -if problematic- instinct: have two fonts, a main one that's sad/rational, and another vicious one which you would use for "vengence" etc. This type of thing can be just the ticket for a motion piece.</p>
      <p>Something like this pair:<br>
      <a href="http://themicrofoundry.com/f_cristaal.html" title="http://themicrofoundry.com/f_cristaal.html">http://themicrofoundry.com/f_cristaal.html</a> _<br>
      <a href="http://themicrofoundry.com/f_brutaal.html" title="http://themicrofoundry.com/f_brutaal.html">http://themicrofoundry.com/f_brutaal.html</a> _<br>
      Note that the three Daam personas are uniwidth, which means you could have an animation where a word in a line morphs from one font to another without affecting the setting.</p>
      <p>hhp</p>
