    html: |-
      <p>Are you doing only text and the voice? If so, I like Hrant's and Norbert's idea of changing typefaces for different parts. I'm afraid that the 'dagger' faces, like Hrant's might be too much, except maybe for a few words like 'violence', etc. </p>
      <p>You might use a newspaper face with some stuff as headlines and other as text. David Berlow's new Truth face might be just the thing. You can see his motion intro at the Fontbureau.com site. There are two motion intros to new typefaces, so if you get the other one, just refresh. So you could do the heavy weights for 'headline' information, the lighter weights for other parts, and a classic titling face for the poetry and the more poetic parts. </p>
      <p>If you are going to used photos also, then probably the type will have to take a back seat, except maybe for the poetic passages which you could do in all type. </p>
      <p>This sounds like quite a challenge but it could be really wonderful--great idea. Let us see the result!</p>
