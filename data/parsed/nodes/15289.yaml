      <p>No, not daggers. That he is urging people to avoid vengeance and instead "to tame the savageness of man and make gentle the life of this world". </p>
      <p>I think you want something formal and dignified like Perpetua. Also how you are using it? Are you scrolling it or what? If in short chunks, it might work with caps in Perpetua, Trajan or the new Garda from Village.com. This is how the Gettysberg address in engraved in the Lincoln memorial, and it is very effective. Optima caps will also work.</p>
