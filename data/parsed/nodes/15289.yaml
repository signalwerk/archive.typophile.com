    <p>I am designing and animating the speech Robert Kennedy gave in Indianapolis the night Martin Luther King was assassinated. The speech is somewhat impromptu and very moving. </p>
    <p>You can read it and hear it at:<br>
    <a href="http://www.americanrhetoric.com/speeches/robertkennedyonmartinlutherking.html" title="http://www.americanrhetoric.com/speeches/robertkennedyonmartinlutherking.html">http://www.americanrhetoric.com/speeches/robertkennedyonmartinlutherking...</a></p>
    <p>I would like to hear some opinions on what typeface comes to mind when you hear this speech. I'm looking for a somewhat sad serif that captures this mood. I'd be interested in hearing what everybody has to say. Thanks!</p>
  html_clean: |-
