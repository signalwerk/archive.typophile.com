    html: <p>As of right now I am trying different solutions to how the type will appear on screen. The method though will be appropriate to the content hopefully. Different parts of the speech seem to warrant different treatments (i.e. the poem, as opposed to the announcement of MLK's assassination.) I don't plan on using all-caps for this since it will be a longer passage with a good amount of reading. I think your suggestions so far are excellent, Meridien and Perpetua are very formal, yet have good character to them. Thanks.</p>
