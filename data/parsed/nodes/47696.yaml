    html: |-
      <p>I suspect Vera Wang is custom, but I think it is close to a Baskerville. I thought  <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/baskerville-ten/" rel="nofollow">Baskerville Ten</a> that has been condensed would be about the most similar. Notice especially the G. The E and R are the most different to my eyes.</p>
      <p>- Mike Yanega</p>
