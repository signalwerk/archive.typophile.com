  html: |-
    <p>I made this for a card front the other day and was so excited about it that I immediately showed two friends and my husband, all of whom said "that's cool... um, does it say something?"  Well, *I* can read it clear as day, but I'm beginning to think that there's a only a small corner of the population who shares that skill (and interest).</p>
    <p>At any rate, I just stumbled on this website and forum and have spent the last hour perusing old posts.  I think I'm in the right place!  </p>
    <p>So, my question for you is, how hard is it for *you* to read?  (Really, I'm just trying to get a grasp on how far exactly 'out there' I am, or if I'm lucky and there is some normalcy to be found in this group....)</p>
    <p>Cheers,<br>
    from The Newbie</p>
    <p>(p.s. I drew this by hand with a pencil, then played with a scan of it in Illustrator; so it's technically not a font... I hope this post still fits here!)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/thankyou_3959.jpg"></div><p></p>
