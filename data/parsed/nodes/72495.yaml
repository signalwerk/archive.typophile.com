  html: |-
    <p>Yesterday, whilst looking on the Internet for something else (you know how that happens!), I came across the name of a printer, ISAAC THOMAS, whom some have called "the American Baskerville". </p>
    <p>Also on Internet, I have been able to locate one book printed by him, and I would guess that he used his own font (typeface) — to me, it is just a bit reminiscent of Baskerville Old Face!</p>
    <p>Anyway, what I would like to ask you is this: do you know whether it is possible to obtain, for my Mac computer (using OS X 10.4), any font(s) using or incorporating Isaak Thomas' typeface?</p>
    <p>When you have a  moment, I'd be very grateful for any assistance you'd be able to provide.</p>
    <p>How is the weather where you live?</p>
    <p>Here in Perth, we've had the coldest June on record: for the first time, the overnight temperature went below zero degrees Celsius...</p>
    <p>Every good wish,</p>
    <p>Yours</p>
    <p>Andrew</p>
