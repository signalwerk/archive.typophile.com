    html: |-
      <p>Bookcoverarchive.com seems a brilliant resource... if the listed fonts can be relied on. Unfortunately not it appears.</p>
      <p>H&amp;FJ Didot looks to be right for <em>still</em>, <a class="freelinking external" href="http://new.myfonts.com/fonts/sugargliderz/michel/" rel="nofollow">Michel Medium</a> is also very close.</p>
      <p>Sackers Gothic doesn’t look correct for <em>LIFE</em> until you figure out it’s Sackers Gothic Heavy specifically and these are the lowercase/small caps, not the caps. So a bit misleading there.</p>
      <p>The author’s name though, that’s definitely not Trade Gothic (even the Condensed) with the straight sides on the O and G. Think it might be <a class="freelinking external" href="http://www.linotype.com/43170/AlternateGothicNo2-font.html" rel="nofollow">Alternate Gothic No. 2</a>.</p>
