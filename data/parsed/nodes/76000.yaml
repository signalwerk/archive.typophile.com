      <p>Golden type is based on the works of William Morris (<a href="http://new.myfonts.com/person/William_Morris/" title="http://new.myfonts.com/person/William_Morris/">http://new.myfonts.com/person/William_Morris/</a>), which, in turn, based his work on Jenson’s.<br>
      Another digital revival, with italics, was done by Scriptorium:<br>
      <a href="http://new.myfonts.com/fonts/scriptorium/true-golden/" title="http://new.myfonts.com/fonts/scriptorium/true-golden/">http://new.myfonts.com/fonts/scriptorium/true-golden/</a></p>
