      <p>&gt; There doesn’t seem to be such a font on Berthold’s site or anywhere else</p>
      <p>I have the Berthold Bembo version in PS type 1 format, but the font shown here is not Berthold's Bembo, because its "f" is as protruding as that of other Bembos (whereas the capital R is not as protruding).</p>
      <p>For exact identification, Jan should supply a scan of italic. Even a few short italic words will do.</p>
