    html: <p>Monotype does make some alternate versions of Bembo. For instance, if you check out Monotype Roman Alternate, you will see the difference on the leg of the 'R'. Monotype also makes a book version of Bembo; and Adobe has their own version of Bembo. If I had to guess, I would say it's one of these that accounts for the differences you are seeing.</p>
