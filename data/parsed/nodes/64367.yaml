      <p>No, it can’t be Dante (and certainly isn’t) because, like I said, the book was published in 1994 (and Dante is much younger). For the same reason it can’t be an alternate-glyph-opentype font. (I guess that’s what you meant by Roman Alternate, Aa.) It isn’t Adobe’s Bembo either.</p>
