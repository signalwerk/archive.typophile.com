    html: <p>Not knowing the title and the year of first publication of the book, I can only surmise on the basis of the blurred scans that the book could be a reprint of a book printed by letterpress and typeset on a DDR (i.e. former East-German) linecaster. This would account for the fact that there are no kerns (see italic f and Roman f, italic j etc.). I suppose that Roman J and italic J (which are not shown on the scans) will have no kerns too, because line-casting machines did not have kerned letters.</p>
