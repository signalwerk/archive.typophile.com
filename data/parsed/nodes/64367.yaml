  html: <p>I’ve got a book here, published in 1994. The textface is definitely <a href="/wiki/Bembo" class="freelinking" rel="nofollow">Bembo</a>. But there are a few minor differences compared to the Linotype/Monotype Bembo I know. The leg on the ‘R’ isn’t as extrem and the ascender/terminal on the ‘f’ doesn’t lean to right as far. The ‘W’ seems a bit narrower. Was/is there another version of Bembo?</p>
  html_clean: <p>I’ve got a book here, published in 1994. The textface is definitely <a href="/wiki/Bembo" class="freelinking" rel="nofollow">Bembo</a>. But there are a few minor differences compared to the Linotype/Monotype Bembo I know. The leg on the ‘R’ isn’t as extrem and the ascender/terminal on the ‘f’ doesn’t lean to right as far. The ‘W’ seems a bit narrower. Was/is there another version of Bembo?</p>
