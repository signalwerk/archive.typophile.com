    votes: null
    html: |-
      <p>&gt; What is or was that “Foundry”? </p>
      <p>Foundry type means Handsatz in German. In 1983, nobody would have typeset "Herbst in Peking" in foundry type. Linotype would have still been possible in 1983, but Linotype in West Germany never sold a linecaster version of Bembo.  That is the problem here. That's why I surmised that a East German linecaster (perhaps of Russian origin) was used here. There was a DDR Typoart Bembo, but I have no specimen.</p>
