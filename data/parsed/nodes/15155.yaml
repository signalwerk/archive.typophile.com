    html: |-
      <p>The height of the block of text from ascender of the top line to descender of the bottom line will be 22.43cm (636pts)* the top line won’t have any leading above it so it isn’t 22.50cm (638pts). This is only pedantry and won’t really affect a mark-up for text with such tight leading and the difference will only be tenths of a millimetre.</p>
      <p>*This figure is likely too high since the actual height of a font rarely takes up the full point size it is designated.<br>
      Tim</p>
