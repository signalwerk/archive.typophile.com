      <p>Actually that was a little uncharitable, plus I disagree with Eben!</p>
      <p>If you mean 10pt type on 11pt leading, your lines will be 11pt apart, and so 58 lines will be the same height whatever font you use; however, the amount of text which will fit on this number of lines will vary.</p>
