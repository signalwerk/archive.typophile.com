    html: <p>It will change with the type. Point size is just a relative measurement. There will be some relationship in size from font to font but not a precise one. Sometimes the difference can be huge. If you want to answer the question you have to choose a type &amp; then measure. Why do you want to know? What is your purpose?</p>
