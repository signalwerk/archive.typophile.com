      <p>While you should be highly selective in your use of typefaces, you should be using MORE of them, not fewer. Consider purchasing a new font family to provide each new client with a distinctive look of their own.</p>
      <p>But as a basic toolkit, that's not a bad lineup of fonts there.</p>
