  html: |-
    <p>Howlett, which is now released on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/howlett/ " rel="nofollow"> Myfonts.com</a>, combines great character with extreme legibility.</p>
    <p>It’s a simple display face that offers a sense of coziness and order, that speaks of all being well with the world. It is a modern design which pays due Acknowledgment to the past.</p>
    <p>An extensive range of Opentype features, including old-style numerals, terminal forms, ligatures and stylistic alternatives are included.</p>
    <p>Use it for headings and titles as well as eye catching poster work.  </p>
    <p>You can try out Howlett on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/howlett/ " rel="nofollow"> Myfonts.com</a> or see some examples of it in action in <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> our blog</a>.</p>
