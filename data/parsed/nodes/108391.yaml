    html: |-
      <p>Lettering, probably based on a mix of Art Deco ideas rather than a single font. The rounded tips are perhaps the result of the sign machining process rather than a design decision.<br>
      As for font ideas you might pick up the oblong shape of O and the crossbars that extend to the left of the LHS stroke from a font like Aldous/Huxley Vertical <a href="http://www.identifont.com/similar?3TS" title="http://www.identifont.com/similar?3TS">http://www.identifont.com/similar?3TS</a><br>
      and the C &amp; G from a font like Washington <a href="http://www.identifont.com/show?9Y0" title="http://www.identifont.com/show?9Y0">http://www.identifont.com/show?9Y0</a><br>
      also you might check Neutra Condensed Medium <a href="http://www.houseind.com/fonts/neutraface" title="http://www.houseind.com/fonts/neutraface">http://www.houseind.com/fonts/neutraface</a><br>
      Don</p>
