    html: |-
      <p>I had that issue once and when I used <em>FontNuke</em> it cleaned the problem right up.</p>
      <p>Another app I used that I highly recommend is <em>Onyx</em>.  There's a version tailored for each version of OS X.</p>
      <p>What you have is a corrupt font cache, it happens sometimes and a clean-out and restart is all it takes to fix.</p>
      <p>Good luck and happy hunting!</p>
