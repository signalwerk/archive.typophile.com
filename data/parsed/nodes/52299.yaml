    html: |-
      <p>Have you tried trashing your font cache?<br>
      I tried to reproduce the bug in Safari (3.2.1).<br>
      First, I got fine fractions with all Lucidas. However, the line set in Lucida Sans Unicode (5.00) swallowed the brackets <strong>and</strong> the ‘N’ in ‘No’ … scary! No problems in Firefox.</p>
      <p>After emptying the system font cache (you can do that with <a href="/wiki/FontExplorer%20X" class="freelinking" rel="nofollow">FEX</a>), Safari has no problems either:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/lucida_6018.png"></div><br>
      The dingbats are just there to check whether the correct fonts are loaded.<br>
      F<p></p>
