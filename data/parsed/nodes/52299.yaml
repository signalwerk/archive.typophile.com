    <p>Tested with 3 fonts: Lucida Sans, Lucida Grande and Lucida Sans Unicode.</p>
    <p>Lucida Sans: No problems with ¼½¾.<br>
    Lucida Grande: No problems with ¼½¾.<br>
    Lucida Sans Unicode: Problems with ¼½¾, contours should be overlapped into "Corrupted Fractions".</p>
    <p>Look at the image to see corruptions with ¼½¾.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/269_6665.png"></div><p></p>
    <p>MS DOS Latin 1 has this ¾ fraction.</p>
