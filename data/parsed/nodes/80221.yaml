    <p>All these stems (and even the round edges in o) are landing 100% on the pixel, but the Quartz rendering still manage to throw them off. My em is 1100, all stems are 100 units and all character widths are multiples of 100. The CSS font size is 11 px. Any idea why this is happening? Also, see "ploughline" which is all fuzzed up. Am I doing something wrong in the font settings?</p>
