    html: <p>I thought I had, but I'm not well versed in these areas. Under "font info" (I assume), which exact parts do I need to check/uncheck and which values might affect this?</p>
  - id: 456664
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    date_raw: 21 Mar 2011 — 4:44pm
    date: 2011-03-21T16:44:00
    votes: null
    html: |-
      <p>You can control the default autohinting settings in: Preferences &gt; Generating OpenType &amp; TrueType &gt; TrueType/OpenType TT (.ttf)</p>
      <p>You can override the default autohinting settings per font in: Font Info &gt; TrueType-specific settings &gt; OpenType export</p>
