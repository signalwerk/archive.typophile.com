    html: |-
      <p>My guess is that this is a raster-side by-product of colour filtering resulting in colour bleed. I made a similar test in Windows some months back, and found that even when outlines and metrics were snapped to a grid, as in your 'pixel font' example, there was a small amount of pale yellow and blue bleed.</p>
      <p>See the images and comments I posted in this thread:<br>
      <a href="http://www.typophile.com/node/71019" title="http://www.typophile.com/node/71019">http://www.typophile.com/node/71019</a></p>
