  html: <p>Anyone been to St Pancras International Station yet? Design Week magazine says the signage typeface is a Dalton Maag offering called <a href="http://upload.wikimedia.org/wikipedia/commons/a/a2/St_Pancras_signage.JPG">Barlow</a> (named after the designer of the magnificent trainshed there). Can't find anything about it on their website but I would love to see the whole family close-up...?</p>
