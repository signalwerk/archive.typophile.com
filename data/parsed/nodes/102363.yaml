      <p>Um,</p>
      <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/File:Bay1640.jpg" rel="nofollow">http://en.wikipedia.org/wiki/File:Bay1640.jpg</a></p>
      <p>I'd say Caslon. Which is not surprising. But in fact, it would be surprising, since even if the book was printed in 1640 instead of 1610, that's still over 50 years before Caslon was born.</p>
      <p>As it happens, though, that title page was reproduced in Updike's <em>Printing Types</em>, so identifying the typeface shouldn't be a problem.</p>
      <p>Hmm... further searching turns up</p>
      <p><a class="freelinking external" href="http://typefoundry.blogspot.ca/2011/11/elzevir-letter.html" rel="nofollow">http://typefoundry.blogspot.ca/2011/11/elzevir-letter.html</a></p>
      <p>showing that the "generic" typeface of the 17th Century does have a somewhat mysterious origin - even though it was the Elseviers that everyone was copying.</p>
