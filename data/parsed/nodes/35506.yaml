    <p>Hey Everyone,</p>
    <p>I’m just starting up a business card for a local Machine Shop. They are pretty small and just getting started.</p>
    <p>I’ve looked through a few fonts and have some ideas on where I want to go, but I want to hear what you guys (and gals) have to say.</p>
    <p>The only feedback I got from them so far is that they like Script fonts because of the way they flow. :)</p>
    <p>So any feedback/suggestions/ideas would be awesome - just curious to see what everyone else has for ideas.</p>
    <p>Thanks,<br>
    Mike</p>
