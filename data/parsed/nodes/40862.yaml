      <p>I don't know about book stores or cemeteries, but when I went there about 5 years ago, lots of old shop signage was still in existence. But the city was obviously changing fast - building sites everywhere, and fantastic old buildings being demolished. If you do a lot of walking you may still stumble across some gems.</p>
      <p>Good luck!</p>
      <p>Nick Cooke</p>
