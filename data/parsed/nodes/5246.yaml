    html: "<p>No matter how much logic you may apply I would never begin designing a typeface with the letter�n. <br> <br>To me . . .  <br> <br>John�s  <i>\"The n establishes a number of things about the face: x-height, basic lower case stem weight, contrast between thick and thin strokes, curve speed (i.e. how gradually or quickly the curve joins the straight) and, perhaps most importantly, provides a sound basis for spacing.\"</i> <br> <br>�������������� <br> <br>. . .is speaking of final stages of type design. To determine x height would be meaningless without determining ascenders, descenders, and cap height. Why not kern first and design later? Or give yourself a quick start by designing the accents and punctuation first? Or design the f ligatures before the f? All of these have reasons to consider. But not for long. <br> <br>It's not that I don't see the letter n, as useful, eventually you will need to finish it. As John says it contains much rhythm that would determine fitting the face, more important, possibly, would be the letter m, but maybe not. But later, much later for that. <br> <br>To me it's like washing your car before you drive in the mud.  <br> <br>My instincts would be to design rough word shapes. Draw words, clean them up later. That's why god gave us erasers. <br> <br>Everyone has their own way. Nothing surprises me any more. Anyway, John does a nice job. Interesting quirk, I would never have guessed. Don't you just love this business? <br> <br>However I have worked closely with many type designers. For that matter have been privy to several great American type designers <i>working memos</i> illustrating their habits. Their names are Frederic Goudy and Sol Hess. <a href=\"http://lanstontype.com/GoudyWoodcut.html\" target=\"_blank\">http://lanstontype.com/GoudyWoodcut.html</a> Neither of which stuck me to be anally fixated on the letter \"n\" as the initial design character. <br> <br>In fact I can quote Sol Hess and his sound advice. <br> <br><b>Sol Hess</b> <i>\"Usually, I like to use as basic characters the Roman caps A, D, E H M O and the lowercase a, d, e, g m, o and s. Selection is made of those characters because as a rule they incorporate characteristic features of their particular group. However, selection can be varied, depending on the specific design under consideration.\"</i> <br> <br><b>No mention of the n.</b> <br> <br>Sol Hess oversaw production of over 500 hot metal typefaces. Many type designs were attributed to him, many type revivals were under his supervision, and many designers�including Goudy, sought his wisdom. <br> <br>Trusting I have been helpful. <br> <br>Gerald Giampa <br> <br> <br> <br></p>"
