    html: "<p>Gerald G: <i>. . .is speaking of final stages of type design. </i> <br> <br>I should perhaps clarify that I was talking about the <i>making</i> of a typeface, not the design of a typeface in more generative or creative phase. When it comes time to start making a font, there are benefits to starting with the lowercase n, for the reasons outlined above: it is a letter that establishes some common norms that can be built on. I agree that 'design' precedes this.</p>"
