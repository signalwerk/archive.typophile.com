    html: <p>Matheus, <br>Perhaps your teacher is just trying to find an organized way for all class members to compare their experiences and the letter"n" would then be the common ground for discussion.  I am sure there are many different ways to begin a font.  I start with the lower case e and a and the tinker with ascender and descender letters untill I figure out the ratio that I want to use.  This is always subject to change for me at least. <br>I am not saying do it my way.  I think you should do as your teacher suggests and learn from him what you can.  Later, after you get more experience, you can figure out what works best for you. Just keep working at it and don't fear making changes, you only learn by them.  You can always save every variation and compare them.  This is a good learning tool. <br> <br>Keep at it! regards, <br> <br>ChrisL</p>
