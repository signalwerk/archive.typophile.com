    html: <p>Matheus, <br> <br>I trained under Nick Schwabe, a Swiss pressman who had worked with Jan Tschichold. I am not sure what to say about the Swiss. Nick was better than good, he was excellent. However the Swiss, at least he and Jan Tschichold, were very fixed with their opinions. About as flexible as a straight edge. <br> <br>Nick reminded me of my sister's husband. My sister's husband always insisted the correct way to bake a ham was to cut the ends off before putting it into the oven. His siblings did the same thing. My sister cut the ends off the ham before baking it under great protest because of the peer pressure upon her. Then one day her "mother in law" came over for dinner, yes, baked ham, and my sister asked her, "why do you cut the ends off the "ham" before you bake it? Her "mother in law" told her she doesn't, she only did that when the "ham was too big to fit into the oven". So don't be one of those "automatic ham end cutters". The reason may not be as good as you think. <br> <br><a href="http://lanstontype.com/PrivatePress.html" target="_blank">http://lanstontype.com/PrivatePress.html</a> <br> <br>So, although I have experience with Swiss printers, I have no experience with Swiss type designers. Perhaps you may think about this. The Swiss style tends to be mechanical rather than humanistic. That comment is bound to raise the ire of many in this forum. In fact I am not entirely married to the idea because I have examples of the opposite. <br> <br>Swiss type cutters worked much differently than the English or the American. Hunter Middleton of Ludlow expressed to me that there were two basic schools of Swiss/German punchcutters. One would cut a <i>counter punch</i> with the expectations of <i>first cutting a perfect punch, second striking it with perfect results</i>. A serious challenge in craftsmanship for sure.The "other Swiss/German school" did not believe in the counter punch but preferred, (wink, wink!) to cut it with gravure. By this I mean a counter punch was never used. <br> <br>A common practic with American and British punchcutters would be to cut an undersized counter punch, strike it, then clean up the imperfections with a gravure. <br> <br><i>A counter punch was not struck when using a Benton Punchcutter, the counter, in name only was cut much as they were in the Swiss/German school.</i> <a href="http://lanstontype.com/BentonPantograph.html" target="_blank">http://lanstontype.com/BentonPantograph.html</a> <br> <br>So, like I say, as you have pointed out, if it is true, the Swiss are the Swiss. And then there are others. The question to ask, which are you going to be? John seems to have followed the Swiss, I would have thought him to have been more British. John by the way is very good. Follow your own instincts, find out what works for you. I think if you "re-read Sol Hess" you will understand his great wisdom.  <br> <br>That said, I must say I have never heard of this annal fixation with the letter n. <br> <br>So there is several schools of thought. One would be to buy a smaller ham, the other would be to cut the ends off the ham, the third would be to buy a bigger oven.</p>
