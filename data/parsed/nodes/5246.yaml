    html: "<p>Well you don't <i>have</i> to draw n first -- unless your instructors require it -- but it is the usual starting place. The n establishes a number of things about the face: x-height, basic lowercase stem weight, contrast between thick and thin strokes, curve speed (i.e. how gradually or quickly the curve joins the straight) and, perhaps most importantly, provides a sound basis for spacing. The relationship between the internal space of the n and the space between two n's is the typical basis for spacing a Latin typeface. You should not only draw the n, you should then arrange several n's in a row and try to space them.</p>"
    html_clean: "<p>Well you don't <i>have</i> to draw n first -- unless your instructors require it -- but it is the usual starting place. The n establishes a number of things about the face: x-height, basic lowercase stem weight, contrast between thick and thin strokes, curve speed (i.e. how gradually or quickly the curve joins the straight) and, perhaps most importantly, provides a sound basis for spacing. The relationship between the internal space of the n and the space between two n's is the typical basis for spacing a Latin typeface. You should not only draw the n, you should then arrange several n's in a row and try to space them.</p>"
