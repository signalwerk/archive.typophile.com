    html: <p>In beginning the design of a new typeface, attacking the detailing of a lowercase n or any letter for that matter would be of little value to me. My approach is not so much methodical, but intuitive. I would leave the finiting of a letter like n to later on when I have developed something that is ready to be detailed. <br> <br>I favour lettering a short word or two in a loose but controlled manner until I come up with something that has possibilities. Rather than to carefully draft these first letters, my custom in most cases it to more or less "write" them using a flat sletch pencil sharpened to a calligraphic edge. That is not to say that I am in every case reaching for a calligraphic letter. A lead sharpened in this way gives me the form and proportions of the letters I choose to draw. <br> <br>I am not even certain that I select the same combinations of letters for each attempted type, but it seems to me that I make up the letter combinations that suit me ad the developing letterforms at the time. <br>This might seem by some to be directionless, but it is the way I work, and it is what I have become comfortable with. There are times that I might start out with a lowercase t, and the resulting t then tells me what letter I want next to it. When a combinations of letters begin to work together, I can think about expanding it to a complete set of lowercase. <br> <br>I think for the most part in terms of text. It's not that I don't like to tackle display faces, but I just think of words and phrases in composition, and this method of writing forms gives me a direction. <br> <br>I can accept that my method is "off the wall'" and not the best way for everyone to work. Neither is it valueless, because it works for what I want to achieve.  <br> <br>It is my curse that each time I attack a group of letters and it expands into a phrase; all the way through the process I am trying to see it under the effects of (letterpress) Impression. I guess you could say that I have channel vision, but on the other hand a face done in that way need not be focused toward letterpress alone. <br> <br>Gerald Giampa has mention the work of Sol Hess and Frederic Goudy, and that they both worked in an ecclectic manner. I have read a great deal about Goudy over more than fifty years of interest of getting type onto paper, and I can know that Goudy worked in a less than methodical way. (if a person can manage it, there is a very comprehensive collection of FWG's work in the Special Collections Dept of the University of Washington in Seattle) He could however design freely and quickly, and knew where he was going. In one of his writings he noted that he once took direction for a type he was going to draw from an ancient printed page, where on letter had a broken serif. Goudy saw value in that. It gave him direction. He has also written that he once got inspiration from the shape of an i. <br> <br>I have never heard of n being the first point of departure in the designing of a typeface, but who knows? If that works it would be no less bizarre than taking the dot of an i as an examplar. To me it seems somewhat rigid, and something that as Giampa has said would perhaps be better tackled later on in the process. <br> <br>My method is the result of forty years or so of comping layouts and designs in pencil, chalk, markers and gouache and brush. I do value this past experience for my own purposes. In Adrain Wilson's writings about book design he shows a good many examples of title page comping by the above mediums. I visited him some twenty years or more ago at this Press In Tuscany Alley in San Francisco, and he gave generously of his time an into the bargain, handed me his book as a gift to a visiting printer. <br> <br>Matheus should ask his typography instructor just why the n is the first letter to consider. I would like to know where the theory came from. <br> <br>Jim Rimmer <br> <br> <br> <br></p>
