  html: |-
    <p>For signage... </p>
    <p>it has been said that white text on 70% to 80% grey is easier to read than white on black. I think there is certainly less dazzle, and lately I have been seen this colour combo quite frequently recently.</p>
    <p>Is there any research on what colour combinations help or hinder legibility?</p>
    <p>Thanks.</p>
