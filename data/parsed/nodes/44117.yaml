      <p>While I believe there is research out there, I’m not sure if it specific to signage.</p>
      <p>I think you have to take into consideration what kind of material(s) the signage will be, location and lighting (indoor vs. outdoor), will it be paired with additional elements (a poster placed in a plexi sleeve—glare)</p>
      <p>David</p>
