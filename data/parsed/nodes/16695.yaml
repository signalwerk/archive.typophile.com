    html: |-
      <p>I have released one OT font, in CFF format, which is what I will continue to use.</p>
      <p>I am reluctant to start releasing in two OT formats, as I had hoped that OT would make things simpler. At the moment, though, due to market dictates, I am contmplating releasing my next typeface in FOUR formats, two versions of OT, plus "old" .ttf and type 1. </p>
      <p>There would be TWO versions of .ttf, one for OpenType where small caps are included in the base font, and another where there is a separate "Expert" SC&amp;OTF font.</p>
      <p>This appears to make no sense, and I can see why it would cause Adobe to go all-OT.</p>
      <p>But when I look at my font sales, I see that I *might* be foolish to forgo releasing a new typeface in a "legacy" format that is still alive and kicking for a significant market segment.</p>
      <p>And then, there might be even more versions of the same typeface, "Standard" and "Pro" versions of OT.</p>
      <p>I am also pondering what to do with Cyrillic and Greek support. It's all very well for non-foundries (yeah, browse their websites and see*) like Microsoft and Adobe to cram everything into massive Pro fonts and, if not distributing by bundling, flog them for peanuts, but that may not represent a very good ROI for the indie guy. </p>
      <p>But I suspect that it IS actually the way to go, and that there are massive multi-user corporate licensing deals waiting for that kind of monster font. </p>
      <p>I also suspect that many indie foundries are developing such product right now, so my prediction is -- 2006: Year of the monster fonts.</p>
      <p>*I'm not undervaluing their contribution to typography, and its importance, but they do: wouldn't it be something to see MS and Adobe flaunting their typographic prowess on their home pages?!</p>
