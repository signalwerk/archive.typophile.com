      <p>Dalton Maag release all their OTs in TTF format. Like John H, most of our work is custom related, with many corporate clients still in the world of NT4, and even OS/2. Also, all our OTs support a Latin A Extended character set, and from what I understand, there are (or were) some issues with CFF fonts in that respect. Furthermore, supporting TTF will give you backward compatibility on larger charactersets with Windows systems and Office apps because it's all proper Unicode.<br>
      And we have the option of applying high quality hints if we want to. As far as I am concerned I sell OT, not ttf or cff. It's OpenType, who cares what outlines are behind it as long as it works. </p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
