      <p>I think, the original question is from a users perspective, "Which format should I collect?" </p>
      <p>I think: "It doesn't make any difference." Long after the T1 format is gone-for-good, if such eclipse does in fact occur, OS and devices are still going to handle it. You don't need to have two rasterizers to deal with both, or at least that's what MS and Apple have been saying for some time, (auto-hinting converters with dual overhead OT generators, you know). And if anyone's nervous about the black-box Adobe rasterizer, it must be a slow-burning nerve...</p>
      <p>I think from a founders perspective, it's best to design and produce in the format you expect the market to use the font in most readily and easily. Most print clients want PS first, and everything else at the end. Most online, or on screen font clients, want TT and some get everything else too.</p>
