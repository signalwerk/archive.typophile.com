    <p>I tried to find a discussion on this already... but no luck. </p>
    <p>I currently work in a PC environment and have several fonts, some duplicates in both <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> and <a href="/wiki/Postscript" class="freelinking" rel="nofollow">Postscript</a> formats.  I don't see the point of keeping both version (Suitcase only allows me to activate one at a time anyway.) </p>
    <p>I primarily outline my work prior to sending it off to the printers. </p>
    <p>So my question is: Which Format should I keep versus the other. Is there an argument that anyone can make that tells me to keep them both? I'm currently leaning towards keeping the TTF due to the simplisticy of a single file over multiple files (1 file versus 2 or 4 files).</p>
