      <p>Nick, I totally agree with you. With a monster font containing small caps, several numeral sets, and supporting several ISO standard character sets, a 4-font OpenType family could easily be generated in hundreds of instances. Who has the time to manage all of that stuff? and why do it? Why step back in time? You might as well release your type in cold metal and wood and dry transfer sheets too. I say: make the legacy formats for those who request them, otherwise encourage users to get on board with this great new format. Users don't have to access the small caps or the alternate numeral sets or the additional accents and glyphs, but pretty soon the old formats will be like leaded petrol; only needed by those whose engines are antiquated.<br>
      PS; I have added you to the table. Thanks.</p>
