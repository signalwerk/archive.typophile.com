      <p>I would go with John Hudson's recommendation also, for several very specific reasons.</p>
      <p>Consider that the most recent version of FontLab makes no distinction between TTF-flavored Opentype fonts and Truetype fonts: both have the .ttf extension. Second, forget the myth that .ttf fonts cause problems printing. I have been involved with the printing trades for almost forty years and with the desktop version of same for fifteen, and I can tell you categorically that the anti-TTF propaganda is a load-o-cr*p, not unlike the Macs-are-inherently-better-than-PCs hooey that is pitched in the Mac community.</p>
      <p>I have used both Postscript and Trueteype fonts to output to imagesetters. It is true that there were some problems with .ttf fonts and level 1 RIPs, but we are way beyond that point now. I am also not entirely convinced that the perpetuation of that myth wasn't fueled by Adobe (following the principle of NIH -- not invented here).  It is curious that, NOW, with the advent of OpenType, developed jointly by Adobe and Microsoft (versus Truetype, which was developed jointly by Apple and Microsoft), Adobe is OK with .ttf. And I have used both Macs and PCs in a serious production environment, and neither machine has an advantage over the other (other than the fact that PCs are a LOT less expensive to purchase or lease).</p>
      <p>So, bottom line: keep the Truetype, sell the Postscript to unsuspecting suckers on eBay.</p>
