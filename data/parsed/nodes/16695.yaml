      <p>As a graphic designer or end-user, I actually prefer OpenType PS (.otf) fonts over OpenType TT (.ttf) fonts. </p>
      <p>From the production perspective, both formats have their problems. </p>
      <p>The B-spline outline representation is just stupid. Everyone, including John Hudson, designs using cubic Beziers, because they are the standard design tool. The subsequent conversion to quadratic B-splines is a tedious operation that you don't have complete control over (various tools will convert the same Bezier outlines into various B-spline representations). So there is a certain level of uncertainty and increased QA that needs to go into a production of a OT TT font. </p>
      <p>On the other hand, the internal structure of an OT PS font is just absurd. The "CFF " table that holds the Bezier outlines of the OT PS font has a structure that is totally alien to the rest of the OT tables. In OT fonts (both PS and TT), the glyph names are stored in the "post" table, the encoding in the "cmap" table and the font names and copyright strings in the "name" table. In OT TT, the "glyf" table only holds the glyph descriptions. But in OT PS, the "CFF " table, holds the glyph descriptions as well as... glyph names, encoding and a set of font names. But the glyph names, the encoding and the font names need also to be stored in "post", "cmap" and "name", where they belong. </p>
      <p>The OpenType specification advises software developers that only the information from the latter tables is relevant and should be relied upon but since there is no guarantee that some piece of software does not accidentally rely on the "other" information, the font developer (or the software he uses) needs to make sure that the redundant information is kept in sync. Although that information shouldn't actually be there in the first place. </p>
      <p>The reason for the whole thing is that CFF -- not the entire OpenType PS font, but *the "CFF" chunk itself -- was originally conceived by Adobe as a self-contained font format. It was a replacement for Type 1  that was used in PDF files -- instead of Type 1. So whatever was in Type 1 (glyph definitions, font names, glyph names, encodings), ended up in CFF. At some point, Microsoft and Adobe started talking and agreed to "merge" the TrueType and PostScript font formats. Since Adobe already had a spec for this new compact chunk of data called CFF, they decided, let's put the CFF chunk directly into the OpenType file structure. So what you end up with is actually a complete font inside of a font. In fact, when an OpenType PS font is being printed to a PostScript printer, the entire OpenType "wrapper" gets thrown away and only the CFF chunk remains. It gets converted to Type 1 and put into the .ps data stream. So yes, Type 1 lives *and will live*. Because PostScript doesn't know anything about OpenType PS: any OpenType PS font travels into a PostScript device as a plain Type 1. </p>
      <p>Type 1 fonts had also their problems, the biggest being that the kerning information was not part of the actual file but had to be stored externally (.afm, .pfm, FOND, you name it). Also, it was not really set up well for complex scripts and generally, non-Western typography. On the other hand, its beauty is in simplicity. Type 1 is very simple to create, edit and debug. In fact, one can write Type 1 source code in a text editor and the compile it using very simple code. </p>
      <p>But since Type 1 lacks advanced typographic features that would make it usable for writing systems such as Arabic or Devanagari, OpenType is a more mature solution. When it comes to the difference between OT PS and OT TT, I can tell you that creating and debugging OT TT is much easier. Several different rasterizers and toolkits exist for TrueType / OpenType TT while for OpenType PS, one is practically limited to just Adobe code. </p>
      <p>Whenever a problem occurs (e.g. you print a text set in a font and you get .notdef boxes on the printer), with OpenType TT, it's relatively easy to track it down. You build the font using different tools and check the font on different rasterizers, and you'll be able to quickly nail down whether the problem is in the font, the software used to create it or perhaps in the rasterizer. With OpenType PS, it's more problematic. I spent nights and nights trying to solve several particular problems once, and it turned out that the fonts were fine but the code used to create it (the Adobe FDK for OpenType) wasn't. </p>
      <p>Fortunately, the Adobe type people are very helpful and responsive when it comes to such problems, and are usually able to help one in debugging. Also, the quality of the code gets better and better. Since  the Adobe FDK for OpenType is used as a library in FontLab products, many people have built OpenType PS fonts over the last years, so the "infant illnesses" of the code have already been fixed. </p>
      <p>So these days, when I have a choice which font format to pick, I usually pick OpenType. If the font has been hand-hinted, I pick OpenType TT, otherwise I prefer OpenType PS. </p>
      <p>A.</p>
