      <p>From an operating system perspective, supporting one rasteriser is always going to be more attractive than supporting two rasterisers, and having one of those rasterisers provided as a black box by another company (Adobe) probably makes a lot of MS and Apple engineers quite nervous. So the internal push for OS developers would favour a single flavour of OpenType, namely TrueType. On the other hand, there does seems to be acknowledgement of the reality of font distribution and the inherited preference for PS fonts in the professional graphics market, so I think these companies understand that supporting CFF as well as TTF is important.</p>
      <p>But my uncerstanding is that there was a period when it wasn't certain that there was going to be any PS rasteriser in Avalon, which might give you pause for thought. About 95% of the fonts I've made in the past ten years are TTFs; in fact, Adobe are currently the only people for whom we make CFF fonts. But then I'm making custom fonts, not retail fonts for the professional graphics market.</p>
      <p>If I had to make a recommendation on purely technical grounds -- based on robustness of the format, availability of thorough QA tools, ability to get at the internals of the tables, and superior system and application support --, I would have no hesitation in encouraging foundries to favour TrueType over CFF. The only downside to TrueType is the relatively complicated hinting model and the additional work this requires to get decent results.</p>
