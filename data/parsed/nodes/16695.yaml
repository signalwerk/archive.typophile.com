      <p>On most of the issues being discussed here, it seems the consensus has settled on The Truth, so I'm not going to re-hash those things. I have just a few niggly comments:</p>
      <p>Adam wrote <cite>any OpenType PS font travels into a PostScript device as a plain Type 1.</cite></p>
      <p>This is technically true as long as one keeps that word "travels" in there. However, it is interesting to note that fonts resident on PostScript RIPs may be CFF!</p>
      <p>Old Nick wrote <cite>It is curious that, NOW, with the advent of OpenType, developed jointly by Adobe and Microsoft (versus Truetype, which was developed jointly by Apple and Microsoft), Adobe is OK with .ttf.</cite></p>
      <p>It's true that during the font wars of the early 90s, both sides denigrated the other's format. On the other hand, it's also true that "now" = 1996-97. So the period in which "Adobe is OK with .ttf" has now been longer than the period when Adobe was more begrudging in its support of TrueType. But even in the early 1990s Adobe was doing a lot of work to make TrueType function well with Adobe applications and PostScript (including licensing the TrueType rasterizer and building it into PostScript).</p>
      <p>rjohnston asked: <cite>Do Adobe, Apple or Microsoft intend to offer a tool to wrap PS fonts as PS-flavoured OT?</cite></p>
      <p>Adobe has made its OpenType font development tools available at no charge for quite a few years now. However, most folks will be best off using other tools - some of which incorporate Adobe source code, such as FontLab and DTL FontMaster. These can all take in Type 1 fonts and generate OpenType CFF (PS-flavored), but even they require a fair bit of setup and understanding.</p>
      <p>Chester's chart confused me a bit. Adobe offers 12 OpenType TT fonts and about 3000 OpenType CFF fonts. Currently, we continue to develop and release OT CFF.</p>
      <p>For what it's worth, I gather that Linotype and Monotype are doing primarily OT CFF. I wouldn't necessarily take that as an endorsement of technical superiority, but likely a combination of where they have the best quality outlines and what their markets prefer. The professional publishing market seems to have a strong preference for CFF, even if there is no technical reality behind that.</p>
      <p>Cheers,</p>
      <p>T</p>
