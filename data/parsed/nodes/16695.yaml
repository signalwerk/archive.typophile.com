      <p>Joe, </p>
      <p>both Mac OS X and Windows ship with a large number of keyboard layouts which you can use to type in pretty much any language. The Mac keyboard layouts are often a bit more interesting (they are more "complete", i.e. map pretty much every Option/Alt keystrokes to more or less useful characters, while the Windows keyboard layouts are far more conservative and only use a small number of Alt keystrokes just for the very essential characters). On the other hand, Windows has a far more superior support for various writing systems of the world, and ship with more fonts for non-European languages.</p>
