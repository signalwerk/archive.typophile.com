    html: <p>Chester, I think Tiro's entry on your chart should read majority TTF, minority CFF. What we make is very much in response to what our clients request. The only vaguely retail family on development at the moment is Ross' Plantagenet Novus, which I believe will be CFF. We've made CFF fonts for Adobe recently, as noted above. All other clients want TTF.</p>
