      <p>&gt; “The B-spline outline representation is just stupid.”<br>
      &gt; Wow, Adam, you’ve designed fonts with a B-spline<br>
      &gt; outline representation?</p>
      <p>I tried but failed. I know some (very few) people who do. I'm not saying that it's conceptually inferior -- there are even other curve representations that people use, such as the on-curve-point-only Ikarus geometry. In fact, I must say that I'm more comfortable with the on-curve-points-only Ikarus system than the TrueType B-splines. </p>
      <p>My point is that practically, it's stupid because the PostScript drawing model is standard in the publishing industry. Most people draw in PostScript curves. Even that FontLab has allowed drawing in native TrueType B-splines since version 3.0, I've yet to see the big run for it. In the last two years, I don't remember the TrueType drawing mode of FontLab/FontLab Studio being raised even once on forums or tech support submissions. </p>
      <p>So the reality is that most people draw in PostScript curves. Then they have a choice of either sticking with their carefully drawn curves by going into Type 1 or OpenType PS, or to rely on an approximative conversion by going to OpenType TT / TrueType. </p>
      <p>To sum up: I don't see a clear favorite. Each of the formats has its drawbacks. Type 1 does not support multilingual typography properly, OpenType TT / TrueType uses an unpractical curve system that is not native to most designers, and OpenType PS is still a bit of a double-shrink-wrapped black box, which, if something goes wrong, nobody really knows what and why. Of course, each format has its advantages as well: Type 1 being rock-solid, simple and splendidly debugged over the last decades, OpenType TT / TrueType being cleanly designed so to large extent, it's backwards-compatible to Windows 3.1, and OpenType PS being a kind of a blend of both worlds.<br>
      A.</p>
