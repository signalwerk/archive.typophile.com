      <p>&gt; Consider that the most recent version of FontLab<br>
      &gt; makes no distinction between TTF-flavored Opentype<br>
      &gt; fonts and Truetype fonts: both have the .ttf extension.</p>
      <p>The Adobe-Microsoft-owned OpenType specification replaced the Microsoft-owned TrueType v1.66 specification. OpenType is a Microsoft trademark and TrueType is an Apple trademark. This means that essentially, from the point of view of Microsoft or Adobe, TrueType doesn't exist anymore. </p>
      <p>Microsoft Windows displays a green OpenType icon for .ttf files that include a DSIG (digital signature) table. This is only a cosmetic distinction from the fonts with a blue TrueType icon. You can have .ttf files with a blue TrueType icon that include OpenType Layout tables and .ttf files with a green OpenType icon that include none. OpenType Layout tables are not a mandatory element of OpenType fonts. </p>
      <p>In short, one could write OpenType &gt;= TrueType. </p>
      <p>A.</p>
