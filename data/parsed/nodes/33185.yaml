    html: <p>By Canibalize I mean just using whichever key is the most sensical. EG using the v key if you have a va ligature &amp; so on. Not every ligature will be easy to choose a key for but dont forget there are caps &amp; lc spaces to take. ANd if you have to use an L key for a V ligature because you have too many - it's not the end of the world...</p>
