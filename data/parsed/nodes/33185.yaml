      <p>Choz, thanks for the feedback, it is very very helpful. You make some very excellent points that I'm definitely going to consider.</p>
      <p>I see what you mean about the Y and I will definitely try a version that is symmetrical. The reason I did the Y this way was because I saw an opportunity to create and not so traditional character that played off of the angles of the A, V and K. It's actually a K flipped and the top arm removed (I still don't have my type terminology down). </p>
      <p>I do have to see how the letters work with each other in a word and that's the next thing I'm going to try out. Not sure yet how closely the letter will sit but your idea with the A is very interesting. Should create some very interesting shapes.</p>
      <p>The B is starting to not feel right and yes the initial idea was to match it to the P and the R. I'm going to play with it some more I just feel that if I do change it and its not working with the P and the R that it won't be consistent.</p>
      <p>I have considered bringing more of the chopped feel into it but if I do adjust the K it will throw off the R as well. That's something I'm going to play with a little more.</p>
      <p>I have some ideas in my head based on your suggestion for the N that I'm going to play with and see how they come out.</p>
      <p>Thanks again for the feedback, it was very helpful and gave me some new ways to approach the typeface. I'm going to make some more adjustments and post again.</p>
