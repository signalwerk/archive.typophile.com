      <p>Choz,</p>
      <p>The A counter isn't blacked out for 2 reasons.</p>
      <p>1. I tried it out blacked out and the letter just didn't read well. The character had more "character" with the counter.</p>
      <p>2. If you notice all the blacked out counters are all curved ones.</p>
      <p>I do see what you mean about the \| version but this typeface is intended to be used very large and for big blocks of copy. Not meant to be used in a big copy block so I think even though it might be confused with an N at first, that the viewer will pick up that its a V.</p>
      <p>What do you mean by the free area in the lowercase zone?</p>
