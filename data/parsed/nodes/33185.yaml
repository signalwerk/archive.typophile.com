    html: |-
      <p>Welcome, new guy. It can be a quite tense experience just to throw a graphic up here. A'ight, I'll give it a go if everyone else is quiet. Some of my comments are guesses at what others might think, because thats sorta fun.</p>
      <p>Love the G.</p>
      <p>With so many other symmetrical letters, not super hot on the Y. I might think otherwise if I saw it in action.</p>
      <p>How closely are you planning the letters to sit? If they are too close it will make even headlined tough to read, but I think that A would look cool perfectly abutting its following glyph.</p>
      <p>The B makes gridsense, but is probably unsettling to the locals with the suggested center-stroke being so low. I suspect the logic was to match the P &amp; R, but if you want that purposely top-heavy vibe, bring it out in another letter or two as well, maybe? There is more room to play with "inside the grid" than you might first assume.</p>
      <p>The chopped centers of M &amp; W have some interesting potential. They fit well qith the uneven top-right of the V and the Bottom-right of the A. Perhaps you could snip the inside of the top-right corner of the W to a 45 degree? What I see here is not "formal", so play more and see what you get. What about moving the angled leg of the K up n' over a bit so it chops off like the A?</p>
      <p>The O is adequate and logical. The Q, however, is very cool, and requires that the O look exactly like you have it.</p>
      <p>If you aren't down with the N, maybe it could get a right triangle lopped off on the inside of the left top. That would make it look like  the W if that approach worked there, and would yet strangely reinforce the most striking aspect of the letter.</p>
      <p>Hide the grid for screenshots unless you need it to illustrate something particular, and I think people will be less distracted.</p>
      <p>Two more suggestions. Throw a word or two up for analysis, like, "hotdoggievons," or, "free beer with font." Then people can <em>see</em> the flow better. And if you think you <strong>might ever</strong> want a numeral or punctuation, start visualizing it now. (edit: I mean start actually drawing it alongside the letters, so that they can borrow from each other, synergize, or whatever one might call it.)</p>
      <p>Oh yeah, last of all, before you take any of my advice seriously, you should probably search what sort of fonts I make. Guess that goes for others, too.</p>
