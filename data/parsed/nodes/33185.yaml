    <p>Howdy folks, new guy here. This is the first typeface I’ve ever created and I’ve been working on it for a few days now and I still have some work to do on it. It’s all based on the grid you see in the background and all the angles are 45 degrees. I still need to adjust some of the widths of the characters and I’m not loving the N, but overall I like the way it’s coming out. I’m just creating uppercase characters cause I eventually want to use this for big headlines and such. I also plan to do numbers and punctuation as well. Let me know what you guys think. Go easy on me...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typeface_6200.jpg"></div><p></p>
