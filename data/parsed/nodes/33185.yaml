      <p>Seeing it used helps me get an idea about your intent. Is this meant to be good for posters where the idea is to catch the eye with a 'mistake' that can be interpreted correctly?</p>
      <p>I think your M is oddly enough working already. Whereas the V is not at all. The K is working. I think you should consider making more weird versions of the semi normal ones and some more normal versions of the weird ones. And just explore more. Like Choz said there are way way more solutions out there. Also, other folks have made a ton of fonts like this. Look at what they did. See if you can justify the existance of this font with a novel solution/letter-shape or overall feeling.</p>
