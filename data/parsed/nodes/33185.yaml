      <p>Seeing text really makes a difference in this one, since the charm is largely in the interaction, I think. The tight spacing is compelling in the AY. The mirrored variants are a great idea. That is the kind of thing I would have stumbled across back in the day, and happily agonized over which to choose in a banner or masthead.  Are those going to fill up some of the free area in the lowercase zone? (Of course, there's 3 Ys, oh no) :)</p>
      <p>I do have to note that the \| version of the V reads a bit like a minimalist N when I go fast.</p>
      <p>Stupid question, perhaps, but, uh, why don't the A's have blacked-out counters?</p>
