      <p>Ok so I worked on it some more today and I think I have all the characters down. I've adjusted the N, X, B, K, Y and Z. I also decided to use two versions of the A and V and 3 versions on the Y. When I create the actual FONT I want to build it so that it figures out which combnations of letters to use to make they work best together. I know this is possible cause I've seen multiple fonts do this but I'm not exactly sure how to create that. Anyone?</p>
      <p>I've arrange some words out to see how the letters play with each other and you will notice the use of the different A's, V's and Y's. Actually I just noticed that the A in the word Magic is the wrong direction.</p>
      <p>Anyways, I still need to create the numbers which will be my next step and I have started on some of the punctuations. I want to create as many as I can to make it as complete as possible.</p>
      <p>Let me know what you guys think.</p>
