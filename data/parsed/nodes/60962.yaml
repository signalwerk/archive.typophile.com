  html: |-
    <p><a href="http://finance.yahoo.com/career-work/article/107520/whats-in-a-new-logo.html" title="http://finance.yahoo.com/career-work/article/107520/whats-in-a-new-logo.html">http://finance.yahoo.com/career-work/article/107520/whats-in-a-new-logo....</a></p>
    <p>New logos make me feel fuzzy and warm - unless they're ugly!</p>
    <p>I do find it interesting, however, that many well-known brands are currently rebranding themselves. I think it's in part of reintroducing themselves in a more competitive (thanks to the recession) market. If you see something thousands of times, it loses its impact, much like the nike logo and mcdonald's arches have become fixtures in our modern culture. We see them too much, and therefore pay less attention. Should this theory hold water, it gives me hope for future endeavors - business always needs graphic designs. ^_^</p>
