    <p>Hi.</p>
    <p>I’m found in need of your help once more.</p>
    <p>I’ve been trying to id this font, but I can’t seem to find the right match for it, anyone who can please help?</p>
    <p>I have also asked previously at WhatTheFont and was pointed to <a href="http://www.myfonts.com/fonts/linotype/univers-lt/49-light-ultra-condensed/">Univers LT 49 Light Ultra Condensed</a>.</p>
    <p>And as I replied there too, indeed I also had gone through Univers. But some doubt remained (and remains) especially due to the counters of both the “D” and “R” (which seem not as wide, even comparatively to the width of the lines) and also the space between the vertical strokes of the “U” (which also seems to be not as wide as in Univers)... (Only hope I’m not talking nonsense with this what I’m saying?...)</p>
    <p>Thus I’d truly appreciate also your views over it please and thank you so much already for any further enlightenment.</p>
    <p></p><div class="imageWrap"><img src="/files/uc-dress-ls_4706.jpg"></div><p></p>
