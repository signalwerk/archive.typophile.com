    html: |-
      <p>i agree with Lex that the 1 seems too thick.</p>
      <p>i also think that'd be really cool to put TWO TWELVE above the mark, upside down. very neat idea, Lex.</p>
      <p>as for me though, i don't think the type choice works with the mark. to me they each speak a different style, and are not harmonizing. i'd rather see either a condensed serif or a thin sans-serif. and i'm leaning towards the sans-serif in my mind. </p>
      <p>or even a lowercase hand-drawn script could be nice. the 212 has an up-scale elegant look to it, and hand-drawn scripts usually represent that because it takes time to do. it's easy and cheap to just type out the words in Didot.</p>
      <p>for color, i prefer the top left and bottom right. it's simple and the color works well. for multiple colors, i like the top right one; the low-contrast tan on tan and gray blue are very nice. i'm not digging the yellow/maroon combo at all, but i do like where it's trying to go - it seems different, unique, and that's just what bars want.</p>
    html_clean: |-
