    <p>I posted some roughs a long time ago per the 212 Lounge - a school project. </p>
    <p>Heres another round, looking at some colour. Any suggestions or hatred would be greatly appreciated.<br>
    Cheers</p>
    <p>A quick overview. . . fakeshift identity for an upscale restaurant and private lounge in Walnut Creek, CA. Hard to sort of pin an indentity to a bar / lounge because most of the image can come from the interior decoration, but I wanted a mix of modern and elegant upscale. </p>
    <p>Cheers</p>
    <p>James</p>
