      <p>I like this in general. Much of the lc seems too wide, while the uc is too narrow, relative to each other. But that might just be my opinion.</p>
      <p>I see among your punctuation you have a "$" and a 2-story "a" which I guess could be an alternate or an "@". If it is the latter, it isn't recognizable as such, nor is the "$". While the vertical bar doesn't need to be continuous or even necessarily penetrate the outer contours, it still needs a little more of it. As it is, the "$" looks like an "S" with some obscure accent of some kind.</p>
