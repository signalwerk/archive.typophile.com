  html: |-
    <p>Hello,</p>
    <p>This is my first post here, and this is my first typeface.</p>
    <p>The face is conceptually based off the town planning grid of a town in New Zealand called Levin.</p>
    <p>Here it is. I have quite a bit of work to do on the kerning.</p>
    <p>This is the lighter weight version of the face.</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123163357im_/http://typophile.com/files/levin_4122.gif"></div><p></p>
    <p>Any feedback is welcome. I realise that the characters are a little odd, but that conceptually was what I was going for.</p>
