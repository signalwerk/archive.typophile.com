    <p>The last twenty years of the <a href="/wiki/20th%20Century" class="freelinking link-lost" rel="nofollow">20th Century</a> saw an overwhelming increase in the number of sans serif faces, of all kinds and descriptions. The kickoff to this explosion was probably the introduction of <a href="/wiki/Adrian%20Frutiger" class="freelinking link-lost" rel="nofollow">Adrian Frutiger</a>'s eponymous type family <a href="/wiki/Frutiger" class="freelinking link-lost" rel="nofollow">Frutiger</a>, a sort of master thesis on the possibilities of rationalism in type and the possibilities of the restrained use of humanist techniques in the construction of sans serif type. It has been much imitated and admired. Frutiger was not content with this, and later participated in the systemization of many of his type families, first revisiting the concept of the <a href="/wiki/geometric%20sans" class="freelinking link-lost" rel="nofollow">geometric sans</a> with <a href="/wiki/Avenir" class="freelinking link-lost" rel="nofollow">Avenir</a>, and later revising both the <a href="/wiki/Univers" class="freelinking link-lost" rel="nofollow">Univers</a> and <a href="/wiki/Avenir" class="freelinking link-lost" rel="nofollow">Avenir</a> <a href="/wiki/type%20systems" class="freelinking link-lost" rel="nofollow">type systems</a> with <a href="/wiki/Linotype%20Univers" class="freelinking link-lost" rel="nofollow">Linotype Univers</a> and <a href="/wiki/Avenir%20Next" class="freelinking link-lost" rel="nofollow">Avenir Next</a>. At the same time, <a href="/wiki/Hermann%20Zapf" class="freelinking link-lost" rel="nofollow">Hermann Zapf</a> and <a href="/wiki/Akira%20Kobayashi" class="freelinking link-lost" rel="nofollow">Akira Kobayashi</a> revisted <a href="/wiki/Optima" class="freelinking link-lost" rel="nofollow">Optima</a>, producing a new version called <a href="/wiki/Optima%20Nova" class="freelinking link-lost" rel="nofollow">Optima Nova</a> that brought the typeface into line with current fashion, adding a true italic, making the face more suitable for setting text, and adding a range of weights to the face. It is cleaner and more functional but not universally loved.</p>
    <p>Meanwhile, <a href="/wiki/Dutch%20type" class="freelinking link-lost" rel="nofollow">Dutch type</a> designers, many of them studying under the influential theorist and teacher <a href="/wiki/Gerrit%20Noordzij" class="freelinking link-lost" rel="nofollow">Gerrit Noordzij</a>, were taking the <a href="/wiki/humanist%20sans" class="freelinking link-lost" rel="nofollow">humanist sans</a> and making it their own. Building on the legacy of <a href="/wiki/Hans%20Eduard%20Meier" class="freelinking link-lost" rel="nofollow">Hans Eduard Meier</a>'s ahead-of-its-time <a href="/wiki/Syntax" class="freelinking link-lost" rel="nofollow">Syntax</a>, they created a new collection of typefaces that were essentially graceful, Renaissance serif faces minus the serifs. These new sans serif families were often part of ever-larger <a href="/wiki/type%20systems" class="freelinking link-lost" rel="nofollow">type systems</a> that encompassed sans serif, serif, and other typefaces, culminating in efforts like <a href="/wiki/Lucas%20de%20Groot" class="freelinking link-lost" rel="nofollow">Lucas de Groot</a>'s huge <a href="/wiki/Thesis" class="freelinking link-lost" rel="nofollow">Thesis</a> family. It can sometimes be hard to tell the players without a scorecard, but careful study of the Dutch humanist sans faces will reveal their considerable subtlety and sophistication.</p>
    <p>English type designers have continued to work in the mold of <a href="/wiki/Eric%20Gill" class="freelinking link-lost" rel="nofollow">Eric Gill</a>, whose types have had a near death-grip on the English imagination. <a href="/wiki/Gill%20Sans" class="freelinking link-lost" rel="nofollow">Gill Sans</a> is everywhere in England even today, and most English sans serif designs owe it a debt of inspiration. Probably one of the best interpretations of the "English humanist sans" is <a href="/wiki/Jeremy%20Tankard" class="freelinking link-lost" rel="nofollow">Jeremy Tankard</a>'s <a href="/wiki/Bliss" class="freelinking link-lost" rel="nofollow">Bliss</a> family, which does for <a href="/wiki/Gill%20Sans" class="freelinking link-lost" rel="nofollow">Gill Sans</a> what <a href="/wiki/TheSans" class="freelinking link-lost" rel="nofollow">TheSans</a> does for <a href="/wiki/Syntax" class="freelinking link-lost" rel="nofollow">Syntax</a> -- cleans it up, systematizes and freshens it.</p>
    <p>Because of their supposed neutrality, sans serif faces have continued to be massively popular for corporate identity and communications. This is the aspect that American designers have explored most thoroughly, with <a href="/wiki/Matthew%20Carter" class="freelinking link-lost" rel="nofollow">Matthew Carter</a> leading the way with his commissioned work for <a href="/wiki/Microsoft" class="freelinking link-lost" rel="nofollow">Microsoft</a> showing what can be done with small type on low-resolution screens. His <a href="/wiki/Verdana" class="freelinking link-lost" rel="nofollow">Verdana</a> and <a href="/wiki/Tahoma" class="freelinking link-lost" rel="nofollow">Tahoma</a> families were designed for the screen and extensively <a href="/wiki/hinted" class="freelinking link-lost" rel="nofollow">hinted</a>; they sacrifice economy for readability, a sensible decision when scrolling is cheap but pixels are scarce. Pushing things in a different direction are <a href="/wiki/Hoefler%20%2526amp%3B%20Frere-Jones" class="freelinking link-lost" rel="nofollow">Hoefler &amp; Frere-Jones</a>, who have recently produced both <a href="/wiki/Whitney" class="freelinking link-lost" rel="nofollow">Whitney</a> and <a href="/wiki/Gotham" class="freelinking link-lost" rel="nofollow">Gotham</a>, faces designed explicitly for use in the corporate vernacular. <a href="/wiki/Gotham" class="freelinking link-lost" rel="nofollow">Gotham</a>, in particular, is based on the <a href="/wiki/grotesque" class="freelinking link-lost" rel="nofollow">grotesque</a> sans serif hand-lettering found in New York, and possesses some of the erratic energy found in that lettering. It was recently honored by being selected as the typeface used on the cornerstone for the September 11th Memorial at the World Trade Center.</p>
    <p>Many type enthusiasts are very tired of the profusely overabundant Helvetica and outraged by the ubiquitousness of Arial, a near-exact (but uglier) Helvetica clone commissioned by Microsoft for obscure reasons. Proclaiming Arial as your favorite font is likely to win you few friends on <a href="/wiki/Typophile" class="freelinking link-lost" rel="nofollow">Typophile</a>.</p>
