    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Sans Serif</strong></p>
    <p>Category of <a href="/wiki/type" class="freelinking" rel="nofollow">type</a> where the <a href="/wiki/terminal" class="freelinking" rel="nofollow">terminals</a> of the letters have no <a href="/wiki/bracket" class="freelinking" rel="nofollow">brackets</a> or <a href="/wiki/spur" class="freelinking" rel="nofollow">spurs</a> -- otherwise known as <a href="/wiki/serif" class="freelinking" rel="nofollow">serifs</a>. Common sans serif typefaces are <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>, <a href="/wiki/Verdana" class="freelinking" rel="nofollow">Verdana</a>, <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>, <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>, <a href="/wiki/Frutiger" class="freelinking" rel="nofollow">Frutiger</a>, and <a href="/wiki/Gill%20Sans" class="freelinking" rel="nofollow">Gill Sans</a>. Sans serif forms originate in ancient Greek and Etruscan <a href="/wiki/chiseled%20inscriptions" class="freelinking" rel="nofollow">chiseled inscriptions</a>, a style later adopted by the Romans, but sans serif type was so novel upon its introduction in the <a href="/wiki/18th%20century" class="freelinking" rel="nofollow">18th century</a> that it defied any attempts at categorization. It was eventually categorized as <a href="/wiki/Doric" class="freelinking" rel="nofollow">Doric</a>, <a href="/wiki/Ionic" class="freelinking" rel="nofollow">Ionic</a> or <a href="/wiki/grotesque" class="freelinking" rel="nofollow">grotesque</a> type, and was in common use by the end of the century by industrial letterers. The most popular early sans serif typeface was cut by <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a> as <a href="/wiki/Doric" class="freelinking" rel="nofollow">Doric</a>, but the most prominent sans serif type known to contemporary designers is the much-imitated <a href="/wiki/Akzidenz%20Grotesk" class="freelinking" rel="nofollow">Akzidenz Grotesk</a>, ancestor of <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> and <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>, two of the most dominant type families of the second half of the <a href="/wiki/20th%20century" class="freelinking" rel="nofollow">20th century</a>.</p>
    <p>Sans serif types underwent a flowering in the early 20th century, and started to divide into many other families. The first prominent step beyond the <a href="/wiki/grotesque" class="freelinking" rel="nofollow">grotesque</a> industrial types was the development of the <a href="/wiki/geometric%20sans" class="freelinking" rel="nofollow">geometric sans</a> faces promulgated by designers influenced by the <a href="/wiki/Bauhaus" class="freelinking" rel="nofollow">Bauhaus</a>. These faces are built, as the name suggests, on "pure" geometric structures, and self-consciously move beyond the modulated strokes and classical proportions mimicked by the grotesques (as well as the serif faces on which grotesques were modeled). <a href="/wiki/Jan%20Tschichold" class="freelinking" rel="nofollow">Jan Tschichold</a>, <a href="/wiki/Paul%20Renner" class="freelinking" rel="nofollow">Paul Renner</a>, <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>, and <a href="/wiki/Jakob%20Erbar" class="freelinking" rel="nofollow">Jakob Erbar</a> all developed profoundly influential <a href="/wiki/geometric%20sans" class="freelinking" rel="nofollow">geometric sans</a> types. <a href="/wiki/Paul%20Renner" class="freelinking" rel="nofollow">Paul Renner</a>'s <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>, in particular, was an early example of a <a href="/wiki/type%20system" class="freelinking" rel="nofollow">type system</a>, and continues to be a very popular, coolly stylish <a href="/wiki/type%20family" class="freelinking" rel="nofollow">type family</a> even today.</p>
    <p>The next -- or concurrent -- development in sans serif types was the <a href="/wiki/humanist%20sans" class="freelinking" rel="nofollow">humanist sans</a>, as exemplified in <a href="/wiki/Eric%20Gill" class="freelinking" rel="nofollow">Eric Gill</a>'s <a href="/wiki/Gill%20Sans" class="freelinking" rel="nofollow">Gill Sans</a>, which was in turn based on <a href="/wiki/Edward%20Johnston" class="freelinking" rel="nofollow">Edward Johnston</a>'s lettering for the <a href="/wiki/London%20Underground" class="freelinking" rel="nofollow">London Underground</a>. Humanist sans typefaces more directly mimic the forms and structures of <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a>, and generally have somewhat eccentric, more classical shapes. Humanist sans faces have more <a href="/wiki/modulated%20strokes" class="freelinking" rel="nofollow">modulated strokes</a>, and their <a href="/wiki/italic" class="freelinking" rel="nofollow">italic</a>s are frequently more directly based on <a href="/wiki/cursive" class="freelinking" rel="nofollow">cursive</a> writing. They have always been more popular, for whatever reason, in Europe than the United States.</p>
    <p><a href="/wiki/Grotesques" class="freelinking" rel="nofollow">Grotesques</a> staged a huge comeback in the wake of World War II, with the development of <a href="/wiki/type%20systems" class="freelinking" rel="nofollow">type systems</a> and <a href="/wiki/Swiss%20typography" class="freelinking" rel="nofollow">Swiss typography</a>. <a href="/wiki/Max%20Miedinger" class="freelinking" rel="nofollow">Max Miedinger</a>'s <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> and <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a>'s <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a> are the most successful examples of these types. The new grotesques were designed for a new typography, where type was set to a rationalized <a href="/wiki/grid%20system" class="freelinking" rel="nofollow">grid system</a>, and the "characterless" type was intended to transparently serve the text. The readability of <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> types as <a href="/wiki/text%20faces" class="freelinking" rel="nofollow">text faces</a> is hotly debated, though, and <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> and <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a> found their greatest fame as advertising and corporate communications faces. A strange side development during this period was <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>'s more or less sui generis revival of Roman inscriptional forms with <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>, a stately sans serif that is frequently characterized as a <a href="/wiki/humanist%20sans" class="freelinking" rel="nofollow">humanist sans</a>, although it really belongs to no category but its own.</p>
    <p>Sans serifs played an integral part in the explosion of <a href="/wiki/display%20faces" class="freelinking" rel="nofollow">display faces</a> that occurred in the 1960s and 1970s. The number of typefaces and styles is innumerable, but one of the most characteristic fonts of this period was <a href="/wiki/Herb%20Lubalin" class="freelinking" rel="nofollow">Herb Lubalin</a>'s <a href="/wiki/Avant%20Garde" class="freelinking" rel="nofollow">Avant Garde</a>, a <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligature</a>-heavy stylized <a href="/wiki/geometric%20sans" class="freelinking" rel="nofollow">geometric sans</a> that was ubiquitous throughout the 1970s.</p>
    <p>The last twenty years of the <a href="/wiki/20th%20Century" class="freelinking" rel="nofollow">20th Century</a> saw an overwhelming increase in the number of sans serif faces, of all kinds and descriptions. The kickoff to this explosion was probably the introduction of <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a>'s eponymous type family <a href="/wiki/Frutiger" class="freelinking" rel="nofollow">Frutiger</a>, a sort of master thesis on the possibilities of rationalism in type and the possibilities of the restrained use of humanist techniques in the construction of sans serif type. It has been much imitated and admired. Frutiger was not content with this, and later participated in the systemization of many of his type families, first revisiting the concept of the <a href="/wiki/geometric%20sans" class="freelinking" rel="nofollow">geometric sans</a> with <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a>, and later revising both the <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a> and <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a> <a href="/wiki/type%20systems" class="freelinking" rel="nofollow">type systems</a> with <a href="/wiki/Linotype%20Univers" class="freelinking" rel="nofollow">Linotype Univers</a> and <a href="/wiki/Avenir%20Next" class="freelinking" rel="nofollow">Avenir Next</a>. At the same time, <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> and <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a> revisted <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>, producing a new version called <a href="/wiki/Optima%20Nova" class="freelinking" rel="nofollow">Optima Nova</a> that brought the typeface into line with current fashion, adding a true italic, making the face more suitable for setting text, and adding a range of weights to the face. It is cleaner and more functional but not universally loved.</p>
    <p>Meanwhile, <a href="/wiki/Dutch%20type" class="freelinking" rel="nofollow">Dutch type</a> designers, many of them studying under the influential theorist and teacher <a href="/wiki/Gerrit%20Noordzij" class="freelinking" rel="nofollow">Gerrit Noordzij</a>, were taking the <a href="/wiki/humanist%20sans" class="freelinking" rel="nofollow">humanist sans</a> and making it their own. Building on the legacy of <a href="/wiki/Hans%20Eduard%20Meier" class="freelinking" rel="nofollow">Hans Eduard Meier</a>'s ahead-of-its-time <a href="/wiki/Syntax" class="freelinking" rel="nofollow">Syntax</a>, they created a new collection of typefaces that were essentially graceful, Renaissance serif faces minus the serifs. These new sans serif families were often part of ever-larger <a href="/wiki/type%20systems" class="freelinking" rel="nofollow">type systems</a> that encompassed sans serif, serif, and other typefaces, culminating in efforts like <a href="/wiki/Lucas%20de%20Groot" class="freelinking" rel="nofollow">Lucas de Groot</a>'s huge <a href="/wiki/Thesis" class="freelinking" rel="nofollow">Thesis</a> family. It can sometimes be hard to tell the players without a scorecard, but careful study of the Dutch humanist sans faces will reveal their considerable subtlety and sophistication.</p>
    <p>English type designers have continued to work in the mold of <a href="/wiki/Eric%20Gill" class="freelinking" rel="nofollow">Eric Gill</a>, whose types have had a near death-grip on the English imagination. <a href="/wiki/Gill%20Sans" class="freelinking" rel="nofollow">Gill Sans</a> is everywhere in England even today, and most English sans serif designs owe it a debt of inspiration. Probably one of the best interpretations of the "English humanist sans" is <a href="/wiki/Jeremy%20Tankard" class="freelinking" rel="nofollow">Jeremy Tankard</a>'s <a href="/wiki/Bliss" class="freelinking" rel="nofollow">Bliss</a> family, which does for <a href="/wiki/Gill%20Sans" class="freelinking" rel="nofollow">Gill Sans</a> what <a href="/wiki/TheSans" class="freelinking" rel="nofollow">TheSans</a> does for <a href="/wiki/Syntax" class="freelinking" rel="nofollow">Syntax</a> -- cleans it up, systematizes and freshens it.</p>
    <p>Because of their supposed neutrality, sans serif faces have continued to be massively popular for corporate identity and communications. This is the aspect that American designers have explored most thoroughly, with <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a> leading the way with his commissioned work for <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a> showing what can be done with small type on low-resolution screens. His <a href="/wiki/Verdana" class="freelinking" rel="nofollow">Verdana</a> and <a href="/wiki/Tahoma" class="freelinking" rel="nofollow">Tahoma</a> families were designed for the screen and extensively <a href="/wiki/hinted" class="freelinking" rel="nofollow">hinted</a>; they sacrifice economy for readability, a sensible decision when scrolling is cheap but pixels are scarce. Pushing things in a different direction are <a href="/wiki/Hoefler%20%2526amp%3B%20Frere-Jones" class="freelinking" rel="nofollow">Hoefler &amp; Frere-Jones</a>, who have recently produced both <a href="/wiki/Whitney" class="freelinking" rel="nofollow">Whitney</a> and <a href="/wiki/Gotham" class="freelinking" rel="nofollow">Gotham</a>, faces designed explicitly for use in the corporate vernacular. <a href="/wiki/Gotham" class="freelinking" rel="nofollow">Gotham</a>, in particular, is based on the <a href="/wiki/grotesque" class="freelinking" rel="nofollow">grotesque</a> sans serif hand-lettering found in New York, and possesses some of the erratic energy found in that lettering. It was recently honored by being selected as the typeface used on the cornerstone for the September 11th Memorial at the World Trade Center.</p>
    <p>Many type enthusiasts are very tired of the profusely overabundant Helvetica and outraged by the ubiquitousness of Arial, a near-exact (but uglier) Helvetica clone commissioned by Microsoft for obscure reasons. Proclaiming Arial as your favorite font is likely to win you few friends on <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>.</p>
    <p>* <a href="http://rosendorf.us/blogdorf/archive/2006/01/18/1456.aspx" target="new" rel="nofollow">Serif vs. Sans Serif</a>: A discussion on Blogdorf about serif vs. sans serif type.</p>
