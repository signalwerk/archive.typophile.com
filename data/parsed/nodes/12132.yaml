    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>&nbsp;: <a href="/node/12038/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Terminology</a>&nbsp;: Sans&nbsp;Serif</strong></p>
    <p>Category of <a href="/node/add/wiki?edit%5Btitle%5D=type" title="Create node &quot;type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">type</a> where the <a href="/node/60942/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">terminals</a> of the letters have no <a href="/node/add/wiki?edit%5Btitle%5D=bracket" title="Create node &quot;bracket&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">brackets</a> or <a href="/node/12057/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">spurs</a> – otherwise known as <a href="/node/13702/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">serifs</a>. Common sans serif typefaces are <a href="/node/13514/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helvetica</a>, <a href="/node/79472/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Verdana</a>, <a href="/node/15685/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Optima</a>, <a href="/node/12494/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Futura</a>, <a href="/node/13517/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Frutiger</a>, and <a href="/node/12627/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gill Sans</a>. Sans serif forms originate in ancient Greek and Etruscan <a href="/node/add/wiki?edit%5Btitle%5D=chiseled%20inscriptions" title="Create node &quot;chiseled inscriptions&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">chiseled inscriptions</a>, a style later adopted by the Romans, but sans serif type was so novel upon its introduction in the <a href="/node/add/wiki?edit%5Btitle%5D=18th%20century" title="Create node &quot;18th century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">18th century</a> that it defied any attempts at categorization. It was eventually categorized as <a href="/node/add/wiki?edit%5Btitle%5D=Doric" title="Create node &quot;Doric&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Doric</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Ionic" title="Create node &quot;Ionic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Ionic</a> or <a href="/node/19193/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Grotesque</a> type, and was in common use by the end of the century by industrial letterers. The most popular early sans serif typeface was cut by <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Monotype</a> as <a href="/node/add/wiki?edit%5Btitle%5D=Doric" title="Create node &quot;Doric&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Doric</a>, but the most prominent sans serif type known to contemporary designers is the much-imitated <a href="/node/17655/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Akzidenz Grotesk</a>, ancestor of <a href="/node/13514/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helvetica</a> and <a href="/node/13516/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Univers</a>, two of the most dominant type families of the second half of the <a href="/node/add/wiki?edit%5Btitle%5D=20th%20century" title="Create node &quot;20th century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">20th century</a>.</p>
    <p>Sans serif types underwent a flowering in the early 20th century, and started to divide into many other families. The first prominent step beyond the <a href="/node/19193/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Grotesque</a> industrial types was the development of the <a href="/node/add/wiki?edit%5Btitle%5D=geometric%20sans" title="Create node &quot;geometric sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">geometric sans</a> faces promulgated by designers influenced by the <a href="/node/13713/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Bauhaus</a>. These faces are built, as the name suggests, on “pure” geometric structures, and self-consciously move beyond the modulated strokes and classical proportions mimicked by the grotesques (as well as the serif faces on which grotesques were modeled). <a href="/node/12609/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Jan Tschichold</a>, <a href="/node/12191/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Paul Renner</a>, <a href="/node/12125/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Rudolf Koch</a>, and <a href="/node/13376/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Jakob Erbar</a> all developed profoundly influential <a href="/node/add/wiki?edit%5Btitle%5D=geometric%20sans" title="Create node &quot;geometric sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">geometric sans</a> types. <a href="/node/12191/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Paul Renner</a>’s <a href="/node/12494/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Futura</a>, in particular, was an early example of a <a href="/node/12495/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">type system</a>, and continues to be a very popular, coolly stylish <a href="/node/add/wiki?edit%5Btitle%5D=type%20family" title="Create node &quot;type family&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">type family</a> even&nbsp;today.</p>
    <p>The next – or concurrent – development in sans serif types was the <a href="/node/add/wiki?edit%5Btitle%5D=humanist%20sans" title="Create node &quot;humanist sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">humanist sans</a>, as exemplified in <a href="/node/12115/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Eric Gill</a>’s <a href="/node/12627/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gill Sans</a>, which was in turn based on <a href="/node/12134/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Edward Johnston</a>’s lettering for the <a href="/node/add/wiki?edit%5Btitle%5D=London%20Underground" title="Create node &quot;London Underground&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">London Underground</a>. Humanist sans typefaces more directly mimic the forms and structures of <a href="/node/13722/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Calligraphy</a>, and generally have somewhat eccentric, more classical shapes. Humanist sans faces have more <a href="/node/add/wiki?edit%5Btitle%5D=modulated%20strokes" title="Create node &quot;modulated strokes&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">modulated strokes</a>, and their <a href="/node/12463/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Italic</a>s are frequently more directly based on <a href="/node/39906/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Cursive</a> writing. They have always been more popular, for whatever reason, in Europe than the United&nbsp;States.</p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Grotesques" title="Create node &quot;Grotesques&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Grotesques</a> staged a huge comeback in the wake of World War <span class="caps">II</span>, with the development of <a href="/node/add/wiki?edit%5Btitle%5D=type%20systems" title="Create node &quot;type systems&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">type systems</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Swiss%20typography" title="Create node &quot;Swiss typography&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Swiss typography</a>. <a href="/node/13515/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Max Miedinger</a>’s <a href="/node/13514/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helvetica</a> and <a href="/node/12118/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Adrian Frutiger</a>’s <a href="/node/13516/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Univers</a> are the most successful examples of these types. The new grotesques were designed for a new typography, where type was set to a rationalized <a href="/node/add/wiki?edit%5Btitle%5D=grid%20system" title="Create node &quot;grid system&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">grid system</a>, and the “characterless” type was intended to transparently serve the text. The readability of <a href="/node/12132/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">sans serif</a> types as <a href="/node/add/wiki?edit%5Btitle%5D=text%20faces" title="Create node &quot;text faces&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">text faces</a> is hotly debated, though, and <a href="/node/13514/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helvetica</a> and <a href="/node/13516/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Univers</a> found their greatest fame as advertising and corporate communications faces. A strange side development during this period was <a href="/node/12150/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Hermann Zapf</a>’s more or less sui generis revival of Roman inscriptional forms with <a href="/node/15685/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Optima</a>, a stately sans serif that is frequently characterized as a <a href="/node/add/wiki?edit%5Btitle%5D=humanist%20sans" title="Create node &quot;humanist sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">humanist sans</a>, although it really belongs to no category but its&nbsp;own.</p>
    <p>Sans serifs played an integral part in the explosion of <a href="/node/add/wiki?edit%5Btitle%5D=display%20faces" title="Create node &quot;display faces&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">display faces</a> that occurred in the 1960s and 1970s. The number of typefaces and styles is innumerable, but one of the most characteristic fonts of this period was <a href="/node/63182/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Herb Lubalin</a>’s <a href="/node/add/wiki?edit%5Btitle%5D=Avant%20Garde" title="Create node &quot;Avant Garde&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Avant Garde</a>, a <a href="/node/12055/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Ligature</a>-heavy stylized <a href="/node/add/wiki?edit%5Btitle%5D=geometric%20sans" title="Create node &quot;geometric sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">geometric sans</a> that was ubiquitous throughout the&nbsp;1970s.</p>
    <p>The last twenty years of the <a href="/node/add/wiki?edit%5Btitle%5D=20th%20Century" title="Create node &quot;20th Century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">20th Century</a> saw an overwhelming increase in the number of sans serif faces, of all kinds and descriptions. The kickoff to this explosion was probably the introduction of <a href="/node/12118/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Adrian Frutiger</a>’s eponymous type family <a href="/node/13517/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Frutiger</a>, a sort of master thesis on the possibilities of rationalism in type and the possibilities of the restrained use of humanist techniques in the construction of sans serif type. It has been much imitated and admired. Frutiger was not content with this, and later participated in the systemization of many of his type families, first revisiting the concept of the <a href="/node/add/wiki?edit%5Btitle%5D=geometric%20sans" title="Create node &quot;geometric sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">geometric sans</a> with <a href="/node/12462/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Avenir</a>, and later revising both the <a href="/node/13516/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Univers</a> and <a href="/node/12462/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Avenir</a> <a href="/node/add/wiki?edit%5Btitle%5D=type%20systems" title="Create node &quot;type systems&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">type systems</a> with <a href="/node/15663/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype Univers</a> and <a href="/node/12461/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Avenir Next</a>. At the same time, <a href="/node/12150/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Hermann Zapf</a> and <a href="/node/12234/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Akira Kobayashi</a> revisted <a href="/node/15685/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Optima</a>, producing a new version called <a href="/node/15686/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Optima nova</a> that brought the typeface into line with current fashion, adding a true italic, making the face more suitable for setting text, and adding a range of weights to the face. It is cleaner and more functional but not universally&nbsp;loved.</p>
    <p>Meanwhile, <a href="/node/add/wiki?edit%5Btitle%5D=Dutch%20type" title="Create node &quot;Dutch type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Dutch type</a> designers, many of them studying under the influential theorist and teacher <a href="/node/30364/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gerrit Noordzij</a>, were taking the <a href="/node/add/wiki?edit%5Btitle%5D=humanist%20sans" title="Create node &quot;humanist sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">humanist sans</a> and making it their own. Building on the legacy of <a href="/node/15605/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Hans Eduard Meier</a>’s ahead-of-its-time <a href="/node/15603/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Syntax</a>, they created a new collection of typefaces that were essentially graceful, Renaissance serif faces minus the serifs. These new sans serif families were often part of ever-larger <a href="/node/add/wiki?edit%5Btitle%5D=type%20systems" title="Create node &quot;type systems&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">type systems</a> that encompassed sans serif, serif, and other typefaces, culminating in efforts like <a href="/node/41522/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Lucas de Groot</a>’s huge <a href="/node/61031/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Thesis</a> family. It can sometimes be hard to tell the players without a scorecard, but careful study of the Dutch humanist sans faces will reveal their considerable subtlety and&nbsp;sophistication.</p>
    <p>English type designers have continued to work in the mold of <a href="/node/12115/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Eric Gill</a>, whose types have had a near death-grip on the English imagination. <a href="/node/12627/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gill Sans</a> is everywhere in England even today, and most English sans serif designs owe it a debt of inspiration. Probably one of the best interpretations of the “English humanist sans” is <a href="/node/17624/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Jeremy Tankard</a>’s <a href="/node/add/wiki?edit%5Btitle%5D=Bliss" title="Create node &quot;Bliss&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Bliss</a> family, which does for <a href="/node/12627/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gill Sans</a> what <a href="/node/add/wiki?edit%5Btitle%5D=TheSans" title="Create node &quot;TheSans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">TheSans</a> does for <a href="/node/15603/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Syntax</a> – cleans it up, systematizes and freshens&nbsp;it.</p>
    <p>Because of their supposed neutrality, sans serif faces have continued to be massively popular for corporate identity and communications. This is the aspect that American designers have explored most thoroughly, with <a href="/node/13520/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Matthew Carter</a> leading the way with his commissioned work for <a href="/node/20191/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Microsoft</a> showing what can be done with small type on low-resolution screens. His <a href="/node/79472/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Verdana</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Tahoma" title="Create node &quot;Tahoma&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Tahoma</a> families were designed for the screen and extensively <a href="/node/add/wiki?edit%5Btitle%5D=hinted" title="Create node &quot;hinted&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">hinted</a>; they sacrifice economy for readability, a sensible decision when scrolling is cheap but pixels are scarce. Pushing things in a different direction are <a href="/node/add/wiki?edit%5Btitle%5D=Hoefler%20%26amp%3B%20Frere-Jones" title="Create node &quot;Hoefler &amp;amp; Frere-Jones&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Hoefler <span class="amp">&amp;</span> Frere-Jones</a>, who have recently produced both <a href="/node/add/wiki?edit%5Btitle%5D=Whitney" title="Create node &quot;Whitney&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Whitney</a> and <a href="/node/12657/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gotham</a>, faces designed explicitly for use in the corporate vernacular. <a href="/node/12657/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gotham</a>, in particular, is based on the <a href="/node/19193/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Grotesque</a> sans serif hand-lettering found in New York, and possesses some of the erratic energy found in that lettering. It was recently honored by being selected as the typeface used on the cornerstone for the September 11th Memorial at the World Trade&nbsp;Center.</p>
    <p>Many type enthusiasts are very tired of the profusely overabundant Helvetica and outraged by the ubiquitousness of Arial, a near-exact (but uglier) Helvetica clone commissioned by Microsoft for obscure reasons. Proclaiming Arial as your favorite font is likely to win you few friends on <a href="/node/12022/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Typophile</a>.</p>
    <p>* <a href="http://rosendorf.us/blogdorf/archive/2006/01/18/1456.aspx" target="new" class="link-external">Serif vs. Sans Serif</a>: A discussion on Blogdorf about serif vs. sans serif&nbsp;type.</p>
