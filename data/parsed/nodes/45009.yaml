  html: |-
    <p>Trying to identify the face used throughout the new BOOST Mobile identity. See it here: <a href="http://www.boostmobile.com/" title="http://www.boostmobile.com/">http://www.boostmobile.com/</a> in all of the Flash based elements. </p>
    <p>Below are screen grabs of some of the more distinct characters:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/PayGo_5224.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/UNLTD_4871.jpg"></div><p></p>
    <p>All I was able to discover after some Googling was that The Attik did the design of the new identity. Figuring it would be easier to figure out here than ringing them up and asking.</p>
    <p>Thanks.</p>
    <p>Benjamin.</p>
