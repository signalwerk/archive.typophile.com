  html: "<p>AMIRA <br> <br>The Font Bureau, Inc. announces the retail release of <br>Amira, an original sanserif family by Cyrus Highsmith.  <br><a href=\"http://www.fontbureau.com/Amira/\" target=\"_blank\">http://www.fontbureau.com/Amira/</a> <br> <br>Amira was a personal challenge for Highsmith who had <br>never attempted a calligraphic sanserif. Amidst the <br>many low contrast monoline sans that have been <br>dominating recently, Amira's personality is refreshing. <br> <br>Amira flexes and bends in such ways that publication <br>designers Roger Black and Christian Schwartz believed <br>it the only choice for Natural Health's recent redesign. <br>The magazine's new streamlined layout required an active <br>typeface that would work both in headlines as well as <br>in text. The sans family is built around the tension <br>between gothic and calligraphic forms, resulting in what <br>Schwartz calls \"The best thing Cyrus has ever drawn. <br>Organic but controlled. Very subtle.\" Black says, <br>\"It's the new Lydian!\". The Type Directors Club recently <br>awarded Amira a Judge's Choice Certificate of <br>Typographic Excellence. <br> <br><a href=\"http://www.fontbureau.com/Amira/\" target=\"_blank\">http://www.fontbureau.com/Amira/</a> <br> <br>For more information or to request a press kit, <br>please email <a href=\"mailto:info@fontbureau.com\">info@fontbureau.com</a> or call Harry Parker <br>or Robb Ogle at 617 423 8770. <br> <br>Best Regards, <br> <br>Harry, Samantha &amp; Robb <br><a href=\"mailto:typesales@fontbureau.com\">typesales@fontbureau.com</a> <br>The Font Bureau, Inc. <br>326 A St., Suite #6C <br>Boston, MA  02210 <br> <br>617 423 8770 (voice) <br>617 423 8771 (fax) <br> <br><a href=\"http://www.fontbureau.com\" target=\"_blank\">http://www.fontbureau.com</a></p>"
