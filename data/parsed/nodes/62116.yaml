      <p>Congrats, Jos! </p>
      <p>I understand if you don’t want to comment on numbers, but I love to hear your thoughts on the freemium business model compared to how most other type designers sell. Do you think it pays of economically? You obiously draw lovely typefaces, which is the main reason why people want them, but as far as I can tell you also get a lot of free attention from various free font blogs and general word of mouth. (I recently told a friend he should seriously consider investing in Museo instead of using those lousy things he got of dafont, and had it been Gotham I suggested, the price tag would have been a rapid turn off.)</p>
