      <p>Thank you very much, Stephen!</p>
      <p>@ Frode — I didn’t got into this freemium business model deliberate. It has evolved in a very logical way from giving my fonts away for free and It hasn’t crossed my mind still to do it any other way. For me it pays off, but that doesn’t depent on giving fonts away only. To sell (enough) fonts more things are of course important and it is imho always a combination of how well-known you are, how you market your fonts, the likability of your typefaces and the price you ask for your fonts.</p>
