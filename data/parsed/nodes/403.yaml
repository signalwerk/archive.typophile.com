  html: <p> Recently, I received an e-mail from Tabur Buhl asking my why I'd sent him a blank e-mail. In reality, I'd never sent Tabur any e-mails and we wrote back and fourth to determine the source of this wierdness . . . <br> <br>A few days later, his friend Brode of Sacred Nipple had similar encounters. I also received another blank e-mail with an .exe file attached from Fontosaurus. <br> <br>A day later, I found out the same thing had been happening to Brian of Astigmatic. I had been the recipient of e-mails from infected computers, but never from computers infected with font designers e-mail addresses. <br> <br>Has this happened to anybody else? <br> <br>Stuart :D </p>
