    html: <p> These are viruses. Someone has either sent you an email recently or has your address in their address book... and they have a Windows-based PC. The virus infects their machine, steals some email addresses and forwards itself and a randomly selected file (think about that!) to the email addresses it found. It may even be self-modifying in that it passes on email addresses through a couple of iterations. </p>
