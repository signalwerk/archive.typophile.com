    <p>Hi<br>
    I'm working on a complex arabic typeface with different weights and all of the kerning and mark positioning stuff are done in VOLT. I was wondering is there any utility to interpolate between two VOLT project files. I remember sometime ago there was a website that would do this, you could upload the files and just specify the percent of interpolation. anyone remember this website? if not, is there any workaround for me to interpolate the kerning pairs? please notice that kerning data are done in VOLT.</p>
    <p>Thanks in advance.</p>
