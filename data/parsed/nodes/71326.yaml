    <p></p><div class="imageWrap"><img src="http://typophile.com/files/edawards_5054.jpg"></div><p></p>
    <p>We are happy and proud to announce that we have received two awards in this years ED-Awards competition. Our multi-purpose typefamily Adelle was given Gold and Karmina Sans won Bronze in the category "Original Typeface". Veronika collected the nice but very heavy trophy at the awards ceremony in Rotterdam this past month. Many thanks to the jury and Ed-Awards!</p>
    <p>see adelle: <a href="http://www.type-together.com/Adelle" title="http://www.type-together.com/Adelle">http://www.type-together.com/Adelle</a><br>
