  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/whimsical-typophile_3951.png"></div><p></p>
    <p><a class="freelinking external" href="http://bit.ly/whimmusic" rel="nofollow">http://bit.ly/whimmusic</a></p>
    <p>''Whimsical Musical'' is a vivid hand drawn font with 405 alternate letters, all caps. Developed from a lighthearted drawing in my sketchbook saying the German word MUSIK cheerfully over and over in twenty vivid variations. Next to it was the date "6th April 2007." This initial idea has burst into a font that is full of surprises and whimsical turns. It is dynamically suggestive, like music, and humorously chaotic, as in Dada.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/whimsical_musical_sketchbook_4837.jpg"></div><p></p>
    <p>Each uppercase letter is enriched with ten stylistic alternates to create a heap of playful variations amounting to a mountain of possibilities. Recommended for display usage: gonzo headlines, fantastical picturesque covers, extravagant quirky flyers, chichi posters, individual labels and fun logos.</p>
    <p><a class="freelinking external" href="http://bit.ly/whimmusic" rel="nofollow">http://bit.ly/whimmusic</a></p>
    <p>More information about the Font is available at MyFonts: </p>
    <p><code>http://new.myfonts.com/fonts/harald-geisler/whimsical-musical/</code></p>
    <p>Or Behance:<br>
    <code>http://www.behance.net/HaraldGeisler/Frame/658044</code></p>
