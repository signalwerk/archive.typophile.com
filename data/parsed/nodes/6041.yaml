    html: "<p>Hello. As I was telling Hrant, this is really not  <br>'news'... I did this basically in 2000, and the book  <br>was published in 2001. <br> <br>If you're interested, there's a <a href=\"http://www.rcapeto.com/etc/houaiss-normal.gif\" target=\"_blank\">huge gif here</a> - the <br>normal weight only, but it also shows the italic - <br>and a <a href=\"http://www.rcapeto.com/etc/houaiss-prop.gif\" target=\"_blank\">small gif here</a> showing the general scheme of <br>vertical proportions. Be aware that this face was <br>designed to be used at around 6-7 pts. <br> <br>Paul: thanks. I hope to put up a decent showing of <br>that heavy sans one of these days (the PDF Hrant <br>pointed to is not \"under my jurisdiction\"). <br> <br>regards, <br>R</p>"
