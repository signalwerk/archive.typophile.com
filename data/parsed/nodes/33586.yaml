      <p>Dear Joe,</p>
      <p>Maybe it's just because I'm English but I don't find Kate Moss to be odd looking or anemic at all. Yes she's slender but quite average looking really, and that's why she's such a good model! I can imagine myself wearing a lot of the clothes she wears if only I had thousands of quid to buy them. Perhaps I'm not paying good enough attention but I haven't seen mention anywhere of a whole typeface being made for Kate, just this logo which I find quite cute and VERY Kate and I don't understand why so many people have piled on to hate it so much, particularly men. I'm going to assume that you're not a transvestite, so you're not really in the target market for Kate's fab new brand are you? I'd kill to look good in the hotpants but I'm quite pleased with the tunic dress I waited on queue all night for.</p>
