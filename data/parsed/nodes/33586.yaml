      <p>Everybody, put on your best <a href="http://www.wapers.com/tvsnmovie/zoolander/zoolander11024.jpg">Blue steel</a> face and realize: It was art directed by Peter Saville. By his mere presence in this project it <em>is</em> fashion. If we don't get it now, we will eventually.<br>
