    <p>Kudos to Kate Moss for having her own font... Every super model should have her/his own typeface, just as every one-person "celebrity brand" should. But, it shouldn't be released to the public when the design feels like a draft version.</p>
    <p>I can imagine the brand brief describing the need for a typeface that matches Moss' anemic and unnatural look, in which case, maybe this design fits the brief. There are just too many problems to mention, and this post would become a mean-spirited critique. See it for yourself -- it just doesn't hold up even under the most basic scrutiny.</p>
    <p><a href="http://www.creativereview.co.uk/crblog/kate-moss-the-brand/" border="0"><img src="/sites/default/files/old-images/katemoss_4751.jpg"></a><br>
    (Kate Moss typeface designed circa 2007)</p>
    <p>You probably remember Paul Barnes' much more successful design of Björk's typeface for her Pagan Poetry album in 2005. That font was available for download for free (and still may be <a href="http://www.dafont.com/font.php?file=pagan_poetry">free at DaFont.com</a>). However, the work for Pagan Poetry felt much more finished, even though it has a lot of the negative qualities of free fonts -- too oft repeated shapes and awkward characters forced into artificial compliance. But, overall, the Pagan Poetry face works, especially in the context of 2 words, and not a typeface meant for long text.</p>
    <p><a href="http://www.dafont.com/font.php?file=pagan_poetry" border="0"><img src="/sites/default/files/old-images/pagan_poetry_6031.png"></a><br>
    (Pagan Poetry typeface designed circa 2005)</p>
    <p>Read the article on <a href="http://www.creativereview.co.uk/crblog/kate-moss-the-brand/">Creative Review's blog</a>.</p>
