      <p>Nigella, I'm not an 11 year old, but I've designed for them. I'm not a mom, but I've designed for moms. I am a designer and I've designed for designers (probably the most fun, and most challenging at the same time). A designer worth any salt should have an ability to step outside him/herself and view something objectively. </p>
      <p>For the record I do think Peter Saville's work is very interesting. I also agree that fashion is fickle, fleeting, and ephemeral, but it doesn't have to be weakly executed.</p>
