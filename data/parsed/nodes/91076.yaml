      <p><img src="http://www.graphicdeclaration.com/images/e_study3.jpg"></p>
      <p>Thanks for the comments :)</p>
      <p>Eventually I had trouble with the expression right part of the letter and eliminated the narrower bits and removed the negative space seen just before the right side 'ball' terminal. It's now stouter and not so exaggerated.</p>
      <p>I'll post up the whole piece soon as I can.</p>
      <p>Hrant, the letters will be done in outline with a fill. The intersection of the v is a common graffiti technique of blending /merging separate elements. So I want to merge the v's right side ball terminal with the e whilst having the e as the dominant element seen as an overlap.</p>
      <p>n.</p>
