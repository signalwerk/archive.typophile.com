  html: |-
    <p>Hi,<br>
    I've seen somewhere (I'm sorry to be so vague, but I really can't remember where) a letterhead that used an em dash — between every paragraph of the "contact list", like this:</p>
    <p>My Name<br>
    My job<br>
    What I do<br>
    —<br>
    My street<br>
    My zip code<br>
    My city<br>
    —<br>
    Etc<br>
    Etc<br>
    Etc</p>
    <p>Is it a typographical habit? Or some original way to use the em dash?</p>
