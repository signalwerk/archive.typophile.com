    <p>Hello Guys et Dolls: </p>
    <p>In the fabulous FAQ section on the H&amp;FJ foundry website we learn of five fonts that have “weight duplexed” tabular numerals. These are highly useful for financial reports and statements (as they’ve mentioned), however; wouldn’t we also find this valuable for creating resumes, invoices and even cookbooks? </p>
    <p>Yes, of course. We love the optically perfect—both horizontally and vertically!</p>
    <p><a href="http://www.typography.com/ask/recentTopic.php?rtID=90" title="http://www.typography.com/ask/recentTopic.php?rtID=90">http://www.typography.com/ask/recentTopic.php?rtID=90</a></p>
    <p>Archer<br>
    Chronicle Text<br>
    Gotham<br>
    Mercury Text<br>
    Whitney</p>
    <p>Surely, these select H&amp;FJ types aren’t the last word in fonts that allow you to mix bold and regular weights without repagination.</p>
    <p>If you know of the other fonts or foundries that have this highly desirable feature please spill the beans.</p>
    <p>Mike Diaz :-)</p>
