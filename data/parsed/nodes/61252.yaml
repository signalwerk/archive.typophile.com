    html: |-
      <p>Well, grades are designed, according to H&amp;FJ, "using the same set of character widths, so designers prototyping with one font can switch grades later without affecting copyfit." So, yes, typefaces with grades have weight duplexing, albeit in smaller increments than a typical roman and bold, for example.</p>
      <p>If I understand your question, I don't think you'll find many typefaces that are duplexed between weights (rather than grades), since that would really mess-up the spacing in many cases. Some monospaced faces are duplexed between weights, and if you look for unaltered digital versions of Linotype faces you'll find duplexed italics, e.g. in <a href="http://www.linotype.com/1436/sabon-family.html" rel="nofollow">Sabon</a>. Another type family that's duplexed is the delightful <a href="http://www.typotheque.com/fonts/klimax" rel="nofollow">Klimax</a>.</p>
    html_clean: |-
