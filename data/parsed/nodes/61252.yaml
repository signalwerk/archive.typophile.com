      <p>Different concepts. <em>Grades</em>, at least as defined as H&amp;FJ, are slight weight variations on a single weight, usually used for optimizing the quality of text on different papers or presses. <a href="http://fontbureau.com/fonts/PoynterOSText/styles" rel="nofollow">Poynter</a> is another example.</p>
      <p>H&amp;FJ is defining a family with <em>duplexed weights</em> as one that shares the same width among all its weights. Other families like this:</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/samuelstype/maya_samuels_complete_pack_ot/" rel="nofollow">Maya Samuels</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fountain/delicato_pro/" rel="nofollow">Delicato</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/moretype/alwyn_new_family_pro/" rel="nofollow">Alwyn</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/moretype/faricy_new_family_pro/" rel="nofollow">Faricy</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/moretype/hedley_new_family_pro/" rel="nofollow">Hedley</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/moretype/mic_32_new_family_pro/" rel="nofollow">Mic 32</a></p>
