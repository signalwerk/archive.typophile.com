    <p>FontShop is currently advertising a new font management software for the Mac. Anyone here got any impressions? How does it perform while managing thousands of fonts, for example? Is it fast? Does it have some kind of possibility to spot duplicates and deactivate them?</p>
    <p>br,<br>
    tobias</p>
