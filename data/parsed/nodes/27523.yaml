    <p>Hello typophiles,</p>
    <p>I'm looking for a sans font that would look between a humanist font and a gothic/grotesk font. Serious and elegant.</p>
    <p>For example, FF Meta is too humanist for my purpose and Helvetica Neue is too cold.</p>
    <p>It's for a stationary so it should be legible in small sizes, but it should also work for body text. In addition, this font should be *slightly* condensed in its regular shape (like Meta or Frutiger).</p>
    <p>Frutiger seems like the right choice right now, but I'd like to test with a font a tad less humanist.</p>
    <p>By the way, please do not suggest any fonts that only come in 200 euros + bundles (DTL, I'm thinking about you). As beautiful as they may be, we're a small design studio and we can't afford them !</p>
    <p>Thank you for your help !</p>
