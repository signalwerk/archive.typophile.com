  html: |-
    <p>I'm looking for a simple way to print into output window the glyphs I have selected.</p>
    <p>I wrote this to select pre defined groups - like using classes but simpler<br>
    <code><br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()<br>
    #<br>
    #<br>
    myGlyphs = ['A','Amacron','Abreve','Aogonek','Agrave','Aacute','Acircumflex','Atilde','Adieresis','Aring']<br>
    #<br>
    for glyphName in myGlyphs:<br>
    	f[glyphName].selected = 1<br>
    	f[glyphName].update()<br>
    #<br>
    f.update()<br>
    </code></p>
    <p>Now I'm trying to do the other way so groups of glyphs I select will be printed in the output window - I was trying something like this.<br>
    <code><br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()</code></p>
    <p>toPrint = f.selected<br>
    print toPrint.name</p>
    <p>f.update()<br>
    </p>
