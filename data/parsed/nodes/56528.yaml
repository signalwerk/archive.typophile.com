    html: |-
      <p>If it's any help to anyone I worked it out</p>
      <p><code><br>
      from robofab.world import CurrentGlyph, CurrentFont<br>
      f = CurrentFont()</code></p>
      <p>for g in f:<br>
      	if g.selected == 1:<br>
      		print g.name</p>
      <p>f.update()<br>
      </p>
