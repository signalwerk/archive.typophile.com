    html: <p>nice work, Patrick! that's exactly it. <br> <br>it seems as though 'comstock' was a generic term for an inline typeface. does anyone know if this particular 'Comstock' was based on an existing non-inline sans?</p>
    html_clean: <p>nice work, Patrick! that's exactly it. <br> <br>it seems as though 'comstock' was a generic term for an inline typeface. does anyone know if this particular 'Comstock' was based on an existing non-inline sans?</p>
  - id: 53820
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>According to Mac McGrew in <i>American Typefaces of the Twentieth Century,</i> Comstock originated from the Inland typefoundry in 1902 and was later revived by ATF in 1957. It used to be commonly available from sources like VGC and rub-down type libraries. <br> <br>I think it became obsolete (along with outline styles of fonts) because it's so easy to simulate this style with digital type and graphics software. <br> <br>I presume the generic term derives from the typeface name.</p>
