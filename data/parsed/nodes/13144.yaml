      <p>Tim, thanks for your input. I should have been more careful with my words - it's not really a logotype in the normal sense of the word; it's a product name to be applied on packaging. So I'm hoping it'll gain a lot of strenght from the context. The good thing of analyzing it out of such context, I suppose, is that it has to stand by itself and be good just like that.<br>
      And you're right that it needs something to make it more of an image and less of a word. Again, thanks. When I have something relevant I'll post a link here (I still have to show it to my boss to see I should keep going or not!) :)</p>
