      <p>If you intend to perservere with your design, I recommend the spacing in the third option, but you will need to work on the S start with a more symmetrical shape and develop the smaller top from that and work on the modulation of the stroke. I think that as a logotype it needs something to pull it together to stop it looking like a word, you have a strong shape in the bar of the A, the style of the 19th century would be reinforced by something enclosing the whole or the kind of gradation that an engraver would produce.<br>
      Tim</p>
