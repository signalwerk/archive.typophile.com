    <p>Hello!</p>
    <p>I'm trying to create some lettering for a logotype. I didn't <em>art direct</em> this, so the concept isn't at all mine - I'm just an intern trying to create something "from scratch" that will stop my superiors from simply typing the word in a font they like, converting it to curves and saying "that's it!" (and don't even get me started on the name itself).</p>
    <p>In any case, it's supposed to say "19th century"(very vague I know) so I went for a late 19th century art nouveau feel.</p>
    <p>I'm looking mostly for advice on letterforms and spacing, and maybe pointings to historical references. As I said, the direction/concept isn't mine and I can't really change it.</p>
    <p>I've included three variations for comparison. Top one includes a "ligature" that in my opinion looks nice but I fear it may be too hard to read.<br>
    I like the middle one better but the space in TA and AL seems too uneven; I tried spacing everything to see if it got better (bottom) but it didn't, really. Plus the letterspaced version looks weaker. </p>
    <p>Okay, I've said too much already, thanks for any advice or comments ;)</p>
