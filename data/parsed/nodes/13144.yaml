      <p>In my opinion the LL ligature is not only hard to read; it creates a strong imbalance between the "black" and the "white". A better alternative for a LL ligature is to "stack" one "L" into the other.<br>
      Out of the three variations the middle one is the best. But the spacing does look uneven; try to positively track the TA pair. The space between "T" and "A" should be slightly larger than the space between "A" and "L", because of the horizontal stroke on "T". And finally, the "S" needs work; the curves are too irregular.</p>
