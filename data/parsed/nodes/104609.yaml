    html: <p>Actually it's neither the hyphen  (U+2010) nor the minus (U+2212). Instead, it's the hybrid "HYPHEN-MINUS" from in the pre-Unicode age.</p>
    html_clean: <p>Actually it's neither the hyphen  (U+2010) nor the minus (U+2212). Instead, it's the hybrid "HYPHEN-MINUS" from in the pre-Unicode age.</p>
