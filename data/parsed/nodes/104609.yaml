      <p>I can also type - in MorxTester on the macintosh an here here is what I get:</p>
      <p><img src="/files/hyphen_4546.png"></p>
      <p>Applications like calculators, Excel etc are expecting  U+002D when you type the "minus" key on the keyboard; that hex value belonged to the ASCII set long before Unicode and those applications don't care for fancy typesetting. To work properly, they need what they used to get before Unicode. Whatever application you are using, InDesign, Word, Excel, etc, the character that the application receives as input is fixed by the keyboard layout, and the keyboard layout knows nothing of the applications that are running.</p>
