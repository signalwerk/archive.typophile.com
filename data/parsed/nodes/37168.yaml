    html: |-
      <p>I have an incomplete set of Letraset supplementary catalogs from the Seventies and Eighties. Only a few are what you could call Letragraphica catalogs, but most of them have Letragraphica faces in them:</p>
      <p>18 New Type Faces / Letragraphica / Featuring Letraset International Typeface Competition Winners 1973 (1973)</p>
      <p>Range Extension 1974</p>
      <p>Letragraphica 16, 17, and 18 (1974)</p>
      <p>Letragraphix Number Two (features Ray Cruz; no date, probably 1975)</p>
      <p>New Typefaces 1976</p>
      <p>Letragraphix Number Three (designed by Kit Hinrichs, 1976)</p>
      <p>Catalog Supplement ’77 (1977)</p>
      <p>Letragraphix Volume Four (designed by SVA students, 1977)</p>
      <p>The Letragraphica Gallery (purple, orange and red cover; no date, but probably 1977 or 1978)</p>
      <p>The Letragraphica Gallery (black and brown cover; no date, but probably 1979)</p>
      <p>Letragraphix Volume 6 (no date, probably 1979)</p>
      <p>Sweet Treats (1980)</p>
      <p>Letragraphix Volume 7 (1980)</p>
      <p>Graphic Treasures (1981)</p>
      <p>Letragraphix Volume 8 (1981)</p>
      <p>Art-I-Facts (1982)</p>
      <p>Celebrate New Letraset Products (1984)</p>
      <p>LetraGazette Issue No. 1 (1984)</p>
      <p>LetraGazette Issue No. 3 (1985)</p>
      <p>LetraGazette Issue No. 5 (1986)</p>
      <p>(The ones where I have guessed at the dates are based on what typefaces were announced in the catalog.)</p>
      <p>One other thing: These were all U.S. editions.</p>
