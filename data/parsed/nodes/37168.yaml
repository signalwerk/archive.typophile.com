    html: "<p>The Letragraphix editions featured well known designers and illustrators. The early ones look more like brochures, the later ones look more like newsletters (more text). A bit of trivia: Letragraphix Volume 6 features the winners of the “Liberated Letter” contest, and one of the winning entries is by Rick Tharp. The “Art-I-Fact” editions are not as nice-looking.</p>"
