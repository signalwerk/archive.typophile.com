    html: |-
      <p>&gt; Does it work better for longer texts on screen than in print?</p>
      <p>No. In fact, it works badly even for very short amounts of text at small sizes. Let us say for example that you want to read an address off the screen. The high confusability of the numbers 3689 is a real problem.</p>
      <p>&gt; Is there a font that would be more suitable for either one of the two iPhone screens than Helvetica/Helvetica Neue? </p>
      <p>There are many such fonts. You could pick nearly any humanist sans, including Lucida Sans / Lucida Grande (one of Apple's system fonts), or Myriad (Apple's corporate identity typeface). At lower resolution such as the older iPhones (pre-Retina) having vertically/horizontally cut terminals or close to it would be a bonus, so something more like Segoe (Microsoft's UI typeface) or Frutiger might be best. Heck, my own Hypatia Sans would be an improvement over Helvetica.</p>
      <p>&gt; Has anyone experimented with readability on the devices?</p>
      <p>Yes, I spend about 8 hours messing with it after I jailbroke my iPhone 3G (which I did primarily for this reason), and will probably jailbreak my iPhone 4 primarily because of this issue.</p>
      <p>Cheers,</p>
      <p>T</p>
