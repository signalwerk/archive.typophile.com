    <p>The iPhone OS uses Helvetica/Helvetica Neue (depending on the phone model and its screen resolution).</p>
    <p>While most tech blogs praise the decision, I can only remember negative comments from type setters regarding Helvetica's readability in print, compared to Akzidenz Grotesk or other relatives, because the letters look so much alike. This feature was usually regarded as suitable for logos, not for continuous text. Does it work better for longer texts on screen than in print?</p>
    <p>Is there a font that would be more suitable for either one of the two iPhone screens than Helvetica/Helvetica Neue? Maybe just for smaller text (10-12 pixel height on an older iPhone screen)? Has anyone experimented with readability on the devices?</p>
    <p>Thanks for your opinion and avice!</p>
  html_clean: |-
