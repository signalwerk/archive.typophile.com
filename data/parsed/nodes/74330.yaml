    <p>Hi, again, wise-people. I want to know, in your opinion, what is the best open type feature to use with alpha-numeric ordinals (in fact, better say numeric-alphabetic ordinals). See the attached sample. I want to program a open type feature to use with this kind of gliph, where the first character is a arabic number, followed by a abreviation, like "1st", "2nd", "3rd"... But, I have two or three different kinds of each ordinal to program...</p>
