      <p>Yes, it is long-winded, but you have to do it this way in order to make the feature applicable in a Paragraph Style, and not have every letter made superscript, only those in "1st", "2nd", "3rd" etc., -- and also "11th", "12th", "13th" etc.</p>
      <p>The benefit is that each instance of an ordinal doesn't have to be individually selected and styled.</p>
