      <p>This works for English:</p>
      <p>@ordn1: one.lnum two.lnum three.lnum one two three one.onum two.onum three.onum one.tnum two.tnum three.tnum</p>
      <p>@ordn2: zero four five six seven eight nine zero.lnum four.lnum five.lnum six.lnum seven.lnum eight.lnum nine.lnum zero.onum four.onum five.onum six.onum seven.onum eight.onum nine.onum zero.tnum four.tnum five.tnum six.tnum seven.tnum eight.tnum nine.tnum </p>
      <p>@ordn3: zero.lnum one.lnum two.lnum three.lnum four.lnum five.lnum six.lnum seven.lnum eight.lnum nine.lnum zero one two three four five six seven eight nine zero.onum one.onum two.onum three.onum four.onum five.onum six.onum seven.onum eight.onum nine.onum zero.tnum one.tnum two.tnum three.tnum four.tnum five.tnum six.tnum seven.tnum eight.tnum nine.tnum</p>
      <p>[default = lining, proportional<br>
      lnum = lining, tabular<br>
      onum = oldstyle, proportional<br>
      tnum = oldstyle, tabular<br>
      These are my own abbreviations for class code names, probably not the most logical...]</p>
      <p>feature ordn { # Ordinals<br>
       # Latin<br>
          ignore sub [one.lnum one one.onum one.tnum] [one.lnum one one.onum one.tnum] a';<br>
          sub @ordn3 a' by ordfeminine;<br>
          sub @ordn3 o' by ordmasculine;<br>
          sub @ordn3 period a' by ordfeminine;<br>
          sub @ordn3 period o' by ordmasculine;<br>
          sub [one.lnum one one.onum one.tnum] @ordn1 t' h by t.sups;<br>
          sub [one.lnum one one.onum one.tnum] @ordn1 t.sups h' by h.sups;<br>
          ignore sub [one.lnum one one.onum one.tnum] [one.lnum one one.onum one.tnum] s' t;<br>
          sub [one.lnum one one.onum one.tnum] s' t by s.sups;<br>
          sub [one.lnum one one.onum one.tnum] s.sups t' by t.sups;<br>
          ignore sub [one.lnum one one.onum one.tnum] [two.lnum two two.onum two.tnum] d';<br>
          sub [two.lnum two two.onum two.tnum] d' by d.sups;<br>
          ignore sub [one.lnum one one.onum one.tnum] [two.lnum two two.onum two.tnum] n' d;<br>
          sub [two.lnum two two.onum two.tnum] n' d by n.sups;<br>
          sub [two.lnum two two.onum two.tnum] n.sups d' by d.sups;<br>
          ignore sub [one.lnum one one.onum one.tnum] [three.lnum three three.onum three.tnum] d';<br>
          sub [three.lnum three three.onum three.tnum] d' by d.sups;<br>
          ignore sub [one.lnum one one.onum one.tnum] [three.lnum three three.onum three.tnum] r' d;<br>
          sub [three.lnum three three.onum three.tnum] r' d by r.sups;<br>
          sub [three.lnum three three.onum three.tnum] r.sups d' by d.sups;<br>
          sub @ordn2 t' h by t.sups;<br>
          sub @ordn2 t.sups h' by h.sups;<br>
      } ordn;</p>
