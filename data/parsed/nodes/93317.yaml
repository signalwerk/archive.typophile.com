      <p>The 21st century equivalent of die-cutting is laser cutting.</p>
      <p>The publisher I work for has done this for several books -- rather small print runs, though. But much to my surprise, this could even be done <em>after</em> a book was perfect bound. In that particular case it had to be done after binding, because it had those colored inside pages that get glued to the cover (uh, I cannot recall the English term for this) and the idea was to see the colored page through the cover, rather than the original white "page 1".</p>
