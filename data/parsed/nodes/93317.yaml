    html: |-
      <p>I've used both both die cuts and translucent paper on jobs I've designed, but always with saddle-stitched binding, not glued. Your printer would probably be the best source of technical advice IF they have previous experience with these techniques on glued covers. Can they show you examples of similar pieces they've done? If so, then they would probably be the best source of advice. But if not, then perhaps you should be looking for a different printer for this job.</p>
      <p>From a design standpoint, my concern about translucent paper is that the entire page would show through, not just the area you'd planned to die cut. Unless maybe you have large inked areas to cover what's on page 2.</p>
    html_clean: |-
      <p>I've used both both die cuts and translucent paper on jobs I've designed, but always with saddle-stitched binding, not glued. Your printer would probably be the best source of technical advice IF they have previous experience with these techniques on glued covers. Can they show you examples of similar pieces they've done? If so, then they would probably be the best source of advice. But if not, then perhaps you should be looking for a different printer for this job.</p>
