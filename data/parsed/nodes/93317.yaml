  html: |-
    <p>For a client we’re considering die cutting their logo on a magazine cover, but the press gives us severe restrictions on the die shape. The problem is that the process of gluing the cover sheets to the body includes a high-speed 90 degree rotation as the sheets are pulled from the pile that has a tendency to get things tangled up. I wonder if any of you have done similar things earlier? Can you give me some advice?</p>
    <p>I have also considered the option of printing on a translucent/transparent paper, but I have yet to figure out if it is possible with offset, folding and gluing. </p>
    <p>Are there other ways to achive a see-through effect?</p>
  html_clean: |-
    <p>For a client we’re considering die cutting their logo on a magazine cover, but the press gives us severe restrictions on the die shape. The problem is that the process of gluing the cover sheets to the body includes a high-speed 90 degree rotation as the sheets are pulled from the pile that has a tendency to get things tangled up. I wonder if any of you have done similar things earlier? Can you give me some advice?</p>
    <p>I have also considered the option of printing on a translucent/transparent paper, but I have yet to figure out if it is possible with offset, folding and gluing. </p>
    <p>Are there other ways to achive a see-through effect?</p>
