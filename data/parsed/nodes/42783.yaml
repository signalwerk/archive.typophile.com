  html: |-
    <p>So, I'm launching my personal portfolio site, and I'm currently titling with a free font called <a href="http://www.dafont.com/alte-haas-grotesk.font" rel="nofollow">Alte Haas Grotesk</a>. I probably don't even need to point out that it's ... er ... quite Helvetica-inspired.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/altehaasgrotesk_5643.jpg"></div><p></p>
    <p>I'd love to buy a sans-serif font with a similarly gentle rounding aspect (not looking for anything as direct as <a href="http://www.linotype.com/13208/helveticaroundedbold-font.html" rel="nofollow">Helvetica Rounded</a>).</p>
    <p>I shouldn't mention my budget for this purchase isn't too liberal, so the more affordable the recommendation, the better.</p>
    <p>Thanks in advance for your suggestions!</p>
