    <p>I just got back from a cinema and the most interesting part of the movie were the end credits. I'm looking for a modern, geometric sans-serif font. If memory is not failing me the letters had a capsule like cylindrical shapes. Almost like FF Din with few distinctive characters, particularly the letter 'a'. Below, I have drawn it from my memory.   </p>
    <p>Thank you,<br>
    SB</p><div class="imageWrap"><img src="http://typophile.com/files/pink_4005.jpg"></div><p></p>
