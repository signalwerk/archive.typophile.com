    html: "<p>Have you tried Bitstream's Font Navigator? <br> <br>You can sort fonts by type (according to the metadata tag, I assume). Then you can easily move them into folders for each type. <br>Its still a manual solution, but at least you speed up the process by sorting into types. You can then install &amp; uninstall folders at a click. <br> <br>I think a fully automated solution would be impossible because many faces fall into more than one type category, and some are on the border of two or more. Type classification is a very subjective thing. <br> <br>Personally, I have: <br>Serif 1 <br>Sans 1 <br>Slab 1 <br>Script 1 <br>Display 1 <br>Client 1 <br>Symbol 1 <br> <br>always installed, with <br> <br>Serif 2 &amp; 3 <br>Sans 2 &amp; 3 <br>Slab 2 <br>Script 2 <br>Display 2,3 &amp; 4 <br>Client 2 <br> <br>waiting to be browsed and/or installed if necessary. Anything I use often is in the first set. <br> <br>Font Navigator was bundled with Corel from about version 7, so you should be able to get it for next to nothing on e-bay.</p>"
