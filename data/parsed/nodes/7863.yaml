    html: "<p>Noah : : Try using Font Book within OSX. I don't believe you can create a database for your type, but you can easily see what is enabled or disabled, and you can organize your type however you see fit, by foundry, family, client, etc. It has a search function built in as well, and you can resolve duplicate issues.  <br> <br>Also try to get your hands on a document that was provided by Apple at this summer's TypeCon in SF, entitled \"Advanced Typography with Mac OSX.\" This would be a great resource for download from the Typophile site (hint). This doc must exist as a pdf from Apple, try searching there first.  <br> <br>Good luck.</p>"
