  html: '<p>Your collection of digital typefaces has grown to the point where you can’t remember what fonts you have or if you have fonts that will ﬁt your need. Bummer. Does an application exist to do the following: <br><br>Scan the system for fonts, active and inactive <br>Create a database: <br>  catalog the metadata in the font (type, foundry, date, weight, family) <br>  download keywords from a site like <a href="http://myfonts.com">myfonts.com</a> <br><br>The purpose of this would be to make classifying, sorting, and searching your font collection painless. It should exist. <span class="caps">ATM</span> lets you create sets, but that has to be done manually for each family and there is no searching. No program I am aware of automates all these activities. None that I am aware of even creates a searchable database by keyword. <br>However, it is an obvious idea… so where can I ﬁnd&nbsp;it?</p>'
  html_clean: '<p>Your collection of digital typefaces has grown to the point where you can’t remember what fonts you have or if you have fonts that will ﬁt your need. Bummer. Does an application exist to do the following: <br><br>Scan the system for fonts, active and inactive <br>Create a database: <br>  catalog the metadata in the font (type, foundry, date, weight, family) <br>  download keywords from a site like <a href="http://myfonts.com" class="link-external">myfonts.com</a> <br><br>The purpose of this would be to make classifying, sorting, and searching your font collection painless. It should exist. <span class="caps">ATM</span> lets you create sets, but that has to be done manually for each family and there is no searching. No program I am aware of automates all these activities. None that I am aware of even creates a searchable database by keyword. <br>However, it is an obvious idea… so where can I ﬁnd&nbsp;it?</p>'
