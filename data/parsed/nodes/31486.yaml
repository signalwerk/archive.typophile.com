    html: <p>Interesting that when you get to the nuts and bolts of specific cultural practices, you have to count handwriting practices, not just printing and type. My grandfather, for example, took some mechanical drawing classes in his youth, and his handwriting always retained what they taught-- quick, straight strokes, a boxy kind of highly readable "font," etc. And speaking of cursive, I don't even know if they teach that in the U.S. any more. I learned it in 4th grade, I think. I never use it-- I print, but maybe with some messy connectors here and there that are vestiges of the cursive.</p>
