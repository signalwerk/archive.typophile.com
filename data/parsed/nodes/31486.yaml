      <p><em>the highminded authorities who discovered from Edward Johnston that the use of the broad pen was the exclusive basis of all good letters and that copperplate script was the work of Mammon if not the Devil himself. </em></p>
      <p>I have always thought Johnston's calligraphy was over-rated. I refer to his "Book of Sample Scripts", which I have in facsimile. It is considered his "outstanding work" in the preface, perhaps understandably, as this was written by LP Harthan, former Keeper of the V&amp;A Library, which houses the document.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/johnston_6102.jpg"></div><p></p>
      <p>Johnston's rhythm varies a lot in the long biblical extract from David and Goliath, becoming quite cramped in places. His work lacks the slick professionalism of traditional calligraphy of similar vintage, such as one may find in numerous church registers listing those fallen in the Great War. The amateurism of his technique may well be part of his appeal, with an Arts &amp; Crafts authenticity of rough "honest" labour. He certainly made calligraphy accessible to many people, by giving legitimacy to a more rough-hewn finish than the traditional, official calligraphy associated with the heraldic tradition, both secular and ecclesiastic, which would be considered the despicable "trade".</p>
      <p>Johnston was a man on a mission, who publicized his theories. An adage, "There is hope in honest error; None in the icy perfections of the mere stylist" by CR Mackintosh sums up the attitude.</p>
    html_clean: |-
