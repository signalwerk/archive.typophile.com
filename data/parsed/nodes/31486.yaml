    html: <p>The Cherokee syllabary makes an interesting case also. Apart from the politics of whether to use romanization or the syllabary (on which I've heard opposing opinions from the two Tsalagi speakers I've discussed it with), the formal qualities of the glyphs in the syllabary are also an issue. As a product of the 1820s, it was created in a context where modern faces, mainly scotch, were the norm. Serifs are functionally necessary in it, and if a typeface doesn't have a vertical axis with very strong contrast, it is apparently perceived as "not Cherokee enough" in appearance.</p>
