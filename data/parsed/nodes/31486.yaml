      <p>Early Greek letterforms were simple sans serif with little or no decorative features. Later, letters were adorned and formed more to some asthetic bent or another. The balance swings both ways and is rarely just a political thing. People in the arts and crafts have a history of being a bit eccentric and not big rote-step followers of political establishments. It is as much the case that letterform designers just did stuff then the politicians pronounced it theirs rather than the other way around.</p>
      <p>ChrisL</p>
