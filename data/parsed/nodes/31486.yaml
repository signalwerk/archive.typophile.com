      <p>Nick, Most interesting! </p>
      <p>One could argue that the Turkish adoption of the Latin alphabet was a conscript project, in that basic Latin letters were altered with diacritical marks. Although such diacritics are fundamental features of such languages as French and German, the Turkish adoption was in fact an adaptation which was explicitly rationalized as an effort "to improve the basic functionality of the phonetic coding of speech into script." The Turkish conscript argument was that the reforms would permit the language to be read more easily, and hence learned more easily, and that the new script would be amenable to modern printing. </p>
      <p>As a footnote, I should acknowledge the fact that there was an Ottoman Turkish (that is, in Arabic script) printing tradition which began in the early eighteenth century.</p>
      <p>I am trying to speak to Jay's second point, above. My point of departure is his reference to Carolingian miniscule. </p>
      <p>And thanks to Brian for expanding on Soviet attitudes toward national identity and scripts.</p>
