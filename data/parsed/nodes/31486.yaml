      <p>Yeah, it's a type of cursive, it's very connected, it looks beautiful but just like cursive when you're still getting used to it, very hard to read.  The primary feature of interest in it for modern day folks is that its e, like in Fraktur, was basically two lines, like //.  That's why even today some people (<em>generally</em> older IME, YMMV) will still write the umlauts as if they were double acutes.  With the younger crowd it might be either a hold over from seeing parents write, or simply a stylistic difference (like Spanish-speakers using a macron instead of a tilde for ñ).</p>
