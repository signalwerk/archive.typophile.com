    html: '<p>Design chauvinism is a handy term that could also be applied to a theme that I am currently doing my best to rework. A very long time ago I wrote about what I named, half-seriously, ‘English vernacular’, a tradition of signwriting and incised lettering that was in current use in the 18th and 19th centuries. but was almost annhilated by the highminded authorities who discovered from Edward Johnston that the use of the broad pen was the exclusive basis of all good letters and that copperplate script was the work of Mammon if not the Devil himself. Among types Scotch Roman and M. F. Benton’s Century Schoolbook preserved something of the qualities of the tradition. Here is an example of signwriting of about 1880 (I guess) to remind us of what we lost in the name of good taste: letters that (in this case) are vulgar, clumsy – and generous and full of life. The image was made in the 1960s in a country pub in Suffolk, by Desmond Jeffery – a friend, and a superb typographer and printer.</p><div class="imageWrap"><img src="http://typophile.com/files/Sign - Meet friendly_4806... aaa bw - 600.jpg"></div><p></p>'
