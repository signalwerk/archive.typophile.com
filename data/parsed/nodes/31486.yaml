      <p>Jay, FWIW, I tend to argue that blackletter is now being rehabilitated* by way of fashionable subcultures that mimic other earlier subcultural adoptions of blackletter for its shock value/association with WW2-era Germany. I believe that blackletter was pretty much 'typographically unspeakable' in western Europe until it had been culturally transformed by association with youth music cultures in the 70s and 80s (hence your ref. to the heavy metal bands, although now you can have thrash/speed/death metal as well!). </p>
      <p>*or should that be recycled?</p>
      <p>I see you're a college professor, so I perceive your question as running straight back into a conversation about design education at large.</p>
      <p>What gets left out of a wider picture of the cultural/political aesthetics of type and lettering systems – as other writers here are already pointing out – is clearly a major consideration.</p>
      <p>I recently read of a case in which a country in the Persian Gulf went to a well known American University and bought a graphic design degree programme 'off the shelf' – buildings, faculty, administration, syllabus, curricula – the whole lot. Only after the programme had completed an academic audit after three (or maybe five?) years of operation, did it become apparent that there was <em>no provision</em> on the course to teach, or even recognise, the importance of Arabic calligraphy within the context of this 'degree' programme.</p>
      <p>While I'm fascinated to hear of the earlier Latinization of vast parts of the globe by both Attaturk and Stalin, I feel it's necessary to be aware of how this process continues by other means. Cultural imperialism at this level means that entire generations, not just individual typefaces, get divorced from the cultural traditions of which they should be the rightful inheritants.</p>
      <p>I now live and work on the far side of the Pacific, and these are interesting times; a number of Chinese universities are already set to repeat similar mistakes as the one above, while conversely, a number of Pacific Island languages are being committed to written/typographic systems for the the first time ever – but I'm not aware of many P.I type designers, so who is making the decisions about what these 'new' languages look like on the page?</p>
