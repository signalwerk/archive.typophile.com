      <p>Not quite cultural imperialism, but closer to home: design chauvinism towards advertising typography.</p>
      <p>Updike "Printing Types": no sans serifs -- too "trade"<br>
      Warren Chappell "Short History": no advertisements shown<br>
      Robin Kinross "Modern Typography": 25 visual examples, none are magazines or advertisements.<br>
      Blackwell "20th Century Type": concentrates on the avante garde, ignoring the "living tradition".<br>
      Meggs "History": a couple of pages on "the new advertising", but nothing on the old.</p>
      <p>The standard notion of what constitutes our typographic culture is derived from collections of art posters, design awards annuals, and specimen books. Institutions do not collect or study the low art of their own culture.</p>
      <p>In the cultural picture, advertising typography is caught between the rock of "proper" book typography with its centuries of tradition, and the hard place of the modernist narrative that centres on the Bauhaus. Advertising is further dissed by the marxist tack of academia, where aesthetics is all about sexism and consumerism. No wonder the idea of advertising art and typography as a subject of aesthetic discourse sounds improbable.</p>
      <p>It has taken feminist historians to write an alternate narrative -- such as Bogart in "Advertising, Art Direction, and the Borders of Art", and Thomson in "The Origins of Graphic Design in America", treating the aesthetics of advertising art as worthy of serious cultural study.</p>
      <p>There does exist a popular design interest in advertising history, but it has gotten channelled into kitsch and nostalgia.</p>
      <p>***</p>
      <p>On the subject of cultural lacunae, mention must be made of Nicholson Baker, the anti-microfiche campaigner. Now this fellow is a novelist and writer, but he has recently rescued the single remaining whole archive of The World newspaper (published by Joseph Pulitzer from the 1890s), which would otherwise have been broken up. And he has published reproductions of its pages in a book "The World on Sunday", which are absolutely astonishing, literally, seeing these pages is like discovering a world you never knew existed. The irony is that The World had a circulation of over half a million, and yet it is less represented in libraries than the short runs which Aldus printed.</p>
      <p>***</p>
      <p>So this is the politics of type: what a sizeable percentage of typographers do for a living is ignored by their culture, and it has been written out of the history which design students are taught at college.</p>
