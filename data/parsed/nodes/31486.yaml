      <p>You can also see some of it within the American university system's greek system (and even outside) where they will attempt to designate a sigma as an E, simply to draw connexion to their organisation, which in turn can cause repudiation for independent students when they see Greek letters being used for anything else other than actually written Greek.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos.» (La Luz Oscura, por Javier Guerrero)</em></p>
