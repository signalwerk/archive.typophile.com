      <p>I hope I am not going too far off topic to add the example of the latinization campaign in the Soviet Union described in Terry Martin's excellent <em>The Affirmative Action Empire: Nations and Nationalism in the Soviet Union, 1923-1939</em> (Cornell UP, 2001). Soviet language planning in the 1920s and 1930s is a fascinating topic. Driven by the internationalist rhetoric of Communism, to overcome the non-Russians' mistrust of rule from Moscow, and other such complex reasons, Soviet authorities promoted national culture and opposed assimilation in this period.</p>
      <p>Among the symbolic markers of identity was the national alphabet. The latinization campaign "involved either changing the alphabet of a language from a script such as Arabic or Cyrillic to the Latin script or creating a new written language using the Latin script for previously exclusively oral languages" (185). Part of the reason was that "the Cyrillic alphabet was strongly associated with Orthodox missionary activity and Russian colonialsm". The Yakut in 1920 and the Ossetines in 1923 abandoned their Cyrillic scripts for Latin spontaneously for this reason, before any central policy was implemented.</p>
      <p>For the Islamic peoples who had traditionally used the Arabic script, the strong identification of that script to Islam and the conservative elites as well as the already-mentioned reasons for rejecting Cyrillic led to the choice of the more neutral Latin. A pan-Turkic campaign led by Azerbaijanis brought about the Latin-based Turkic alphabet, which celebrated a major triumph outside the Soviet Union in 1928 when the Turkish Republic adopted the Latin script.</p>
      <p>The latinization campaign expanded throughout the Soviet Union, its anti-Russian character became more transparent, and even the latinization of Russian itself was discussed: after all, "only the latinists were true internationalists". (Of particular interest to me is the campaign for the latinization of Korean. Plans for a Latin Korean alphabet "were approved but apparently not actualized" (200).)</p>
      <p>By 1932, 66 languages had been latinized and seven more languages were in the process of being latinized. However, the ideological atmosphere had shifted by 1933, with the political crises in Ukraine and Belorussia where local nationalists were charged with treasonous irredentism. The question was now about reversing latinization; this shift in the entire Soviet national policy would culminate in the deportations of 1935-1938, when "at least nine Soviet nationalities--Poles, Germans, Finns, Estonians, Latvians, Koreans, Chinese, Kurds, Iranians--were all subjected to ethnic cleansing" (311).</p>
      <p>Reading about the "war of the typewriters" is fascinating in that historical context.</p>
