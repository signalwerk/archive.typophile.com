      <p>That's interesting Fred, but the association of aesthetics with an alphabetic script is a different matter than with type, where it's generally understood to be design style-- something that is created by individuals, whereas alphabets are more of a social contract.</p>
      <p>However, there have been quite a few alphabet (re)designers who created "conscripts" (constructed scripts).<br>
      <a href="http://en.wikipedia.org/wiki/Artificial_script" title="http://en.wikipedia.org/wiki/Artificial_script">http://en.wikipedia.org/wiki/Artificial_script</a></p>
      <p>Peter the Great (Cyrillic, early 18th century)<br>
      Isaac Pitman (Shorthand, 1840s)<br>
      Jan Tschicold, Herbert Bayer (Unicase, early 20th C)<br>
      Henry Eveleigh (calligraphic-phonetic, 1950)<br>
      James Pitman (Initial teaching Alphabet, 1960)<br>
      Kingsley Read (Shaw alphabet, 1960)<br>
      Anthony I. Rozak (Phonetic alphabet, 1970)<br>
      Phillip Stamm (Phonograms, 1997)</p>
      <p>And many, many others.<br>
      Most of these were not primarily aesthetically driven, but were designs attempting to improve the basic functionality of the phonetic coding of speech into script. For pedagogic reasons, or to help those with reading difficulty. Shorthand has a particular focus of functionality, which is transcribing speech in real time -- to do more with writing than reading.</p>
      <p>However, there is always a political/cultural/social/aesthetic dimension to any design, and it is ironically perhaps more tangible in conscripts than in type design where, as Jay notes in his second point, the broader cultural connections are by association, which can be quite arbitrary.</p>
      <p>Graphology is an aspect of writing which is not given much credence as a science, but I suspect it has some connection with the sociology of type forms. As social understanding, it has been most developed by graphic designers and art directors, working with targeted demographics, in an intuitive way. Typography!</p>
