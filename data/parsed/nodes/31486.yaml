      <p>The Middle East/Islamic world offers some illuminating examples of the association between religion and script (and then in modernity, religion and type). </p>
      <p>A primary tenet of Islam is that the Koran is the word of God, written in the language of God. As a consequence, the Arabic language and script became valued in ways that are specific to the religion of Islam and its civilization. Note that the Arabic script spread along with Islam from the central Middle East beyond the limits of the spread of the Arabic language itself. Thus Persian and Urdu, among other languages of Muslim countries, are written in Arabic script. The association of religion with script was so clearly identified in the Middle Ages that Jews, writing in Arabic, used the Hebrew alphabet. Through this, we see Jews identified fully as Arabic speakers/writers, but who preserve the marker of the religious association of identity and script (called Judeo-Arabic).</p>
      <p>Another example is interesting. In 1928 Turkey, Atatürk initiated a massive language reform initiative that required the adoption of Latin script to the exclusion of the Arabic script. Arabic script had been used to write Turkish for a millennium, but in the context of language reform it was criticized for its complexity and unsuitability for the Turkish language. From the perspective of Turkish nationalism, Arabic script was also perceived to be "foreign," and therefore inappropriate. And, from the perspective of the secular nation-state, Arabic script was associated with Islam and the failures of the Ottoman Empire.</p>
      <p>In Central Asia, Turkic languages began to be written in the Latin alphabet in the late 1920s, but by 1940 Russian hegemony moved these societies to the adoption of the Cyrillic alphabet. Flash forward to the fall of the Soviet Union and we witness competition between the three scripts/type that could be used for writing Turkic languages. Sometimes called the "war of the typewriters," this cultural struggle was played out in part through the competing efforts of Russia, Turkey, and Islamic countries (esp. Saudi Arabia), each trying to get the newly-independent states to adopt a script/type which represented the larger cultural world to which they would be attached. The question was whether these countries would be aligned with the old imperial power of Russia, the larger transnational world of Turkish identity, or to the even larger world of Islamic civilization.</p>
      <p>The association of Arabic script to religion is not necessary by virtue of the script's form, but is a religious/ideological construct that remains a significant cultural artifact to this day.</p>
