      <p>Wow, this thread came back with a vengeance, just when I thought it had fizzled. Thank you all for the useful material. As I'd mentioned in the original post, I am interested in any clear connections between cultural/political initiatives and formal features of type (or print). Overt movements, like nationalistic campaigns that identify a particular design feature as somehow "representing" or embodying some feature of national culture, are particularly intriguing to me. But other kinds of connections are interesting, too-- I just was reading about a Czech typographer who wanted to get "Czechness" into his designs. </p>
      <p>Thanks again for all the input.</p>
