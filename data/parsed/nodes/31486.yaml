      <p>That's weird -- it differentiates between commercial/industrial vernacular and professional practice.</p>
      <p>I can see how that would apply to a long-standing accredited profession such as architecture, but not to graphic design, where the majority of the "despicable" trade practice is both vernacular AND professional (meaning that not just AIGA/GDC members are professionals, but anyone who makes a living in the trade). But perhaps some submissions will address this.</p>
      <p>An example of how design chauvinism works: the 1960s DDB VW ads are in all the history books, and won many awards. Therefore they are professional. However, concurrrent ads by GM, Ford, Chrysler and AMC weren't so "creative" (yo, car porn spreads!) and thus constitute the vernacular, ie. the unwritten history*. But in socio-economic terms, there is no difference, they're all products of Madison Avenue.</p>
      <p>And they all used sans serif fonts. </p>
      <p>*Except for vernacular history, now on the internet. Brilliant! --<br>
      <a href="http://www.oldcarbrochures.com/" title="http://www.oldcarbrochures.com/">http://www.oldcarbrochures.com/</a></p>
