  - id: 395865
    user: 14133
    date: 2010-02-13T18:19:00
    date_raw: 13 Feb 2010 — 6:19pm
    votes: null
    html: "<p>I eventually gave up on all mice as they all eventually ended up hurting my hands. Using a pen was even worse. I got into trackballs a few years ago. I tried Kensington, all the Logitech models. For a couple of years I used the low end Logitech with no scroll wheel. The Logicool cordless is a bad design, I tried for a few weeks but I could only use it for about 8 hours in a row. It's a poor design because you have to take the weight off your hand when dragging: sore shoulders. Also, the ball doesn't coast properly. For 50 cents I picked up a used Trackman Wheel. The ball's coasting is the best I've tried. Using a thumb gives you about the same control as fingers and a proper scroll wheel. I don't have to move my arm at all and the flick &amp; coast action means, I can go all the way across. When I need to cross the screen from right to left, I can drop my thumb on the ball and spin it, then stop,catch when it's in the right spot. Try it but save money and skip the Logicool cordless.</p>"
    html_clean: "<p>I eventually gave up on all mice as they all eventually ended up hurting my hands. Using a pen was even worse. I got into trackballs a few years ago. I tried Kensington, all the Logitech models. For a couple of years I used the low end Logitech with no scroll wheel. The Logicool cordless is a bad design, I tried for a few weeks but I could only use it for about 8 hours in a row. It's a poor design because you have to take the weight off your hand when dragging: sore shoulders. Also, the ball doesn't coast properly. For 50 cents I picked up a used Trackman Wheel. The ball's coasting is the best I've tried. Using a thumb gives you about the same control as fingers and a proper scroll wheel. I don't have to move my arm at all and the flick &amp; coast action means, I can go all the way across. When I need to cross the screen from right to left, I can drop my thumb on the ball and spin it, then stop,catch when it's in the right spot. Try it but save money and skip the Logicool cordless.</p>"
