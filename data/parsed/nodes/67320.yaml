      <p><em> it puzzles me how it can make your hand hurt</em></p>
      <p>It seems to be because I keep wanting to hold my middle finger slightly above the surface instead of touching it, which causes a strain over time. I think the reason I do it is that I'm afraid I might accidentally right-click or something, even though I know that won't happen. I'm giving it another go, being careful to keep that finger relaxed and resting on the surface. So far so good.</p>
      <p>I have a similar problem using a Wacom tablet. The stylus makes parts of my hand go numb after an hour or so. It doesn't happen when I use a pen or pencil, so I'm not sure why it happens.</p>
