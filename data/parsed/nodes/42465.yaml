    <p>Hi! I’m compiling a list of the 10 most influential classic and contemporary typeface, so far I have produced a list as follows;</p>
    <p>Classic typefaces</p>
    <p>1. Garamond<br>
    2. Gill Sans<br>
    3. Bodoni<br>
    4. Caslon<br>
    5. Palatino<br>
    6. Bembo<br>
    7. Baskerville<br>
    8. Clarendon<br>
    9.<br>
    10.</p>
    <p>Contemporary typefaces</p>
    <p>1. Avant Garde<br>
    2. Helvetica<br>
    3. Bell Gothic<br>
    4. Franklin Gothic<br>
    5. Futura<br>
    6. Optima<br>
    7. OCR- A<br>
    8.<br>
    9.<br>
    10.</p>
    <p>Please feel free to post your suggestions and any changes you feel necessary.</p>
