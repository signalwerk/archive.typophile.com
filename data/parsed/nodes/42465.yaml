      <p><em>your way of explaining the fact that marketing strategy is out of the frame makes me also cringe.</em></p>
      <p>Different foundries have completely different strategies for productization.<br>
      After all, there's a world of difference between the three main sectors of font production (megacorps, asset-holders, and independents.)<br>
      On the corporate side, Linotype is very much driven by the strategy of leveraging its brand assets.<br>
      Then there's Ale Paul, combining his penchant for scripts with Veer customers' insatiable appetite for them.<br>
      House and Diner have been driving the script market as much as following it, synergy.</p>
      <p>My retail sales would be stronger, no doubt, if I turnedd out a few more script fonts, but like many independent designers I compromise between doing what interests me and what I *think* will sell. But who knows what will sell until it's been designed, produced, and put on the market? So what I do is follow my nose, developing ideas that interest me, and trying to move them into directions that I anticipate will be useful, in other words, that people will buy.</p>
      <p>Yeah, I've noticed the Fleischmann thing, and it's certainly influenced me--to do the opposite!</p>
