      <p>Nick -- I totally agree that the deeper you get into the history of anything, the more it shows no clear narrative with starting points and ending points. I hinted at that a bit with my original response, where I said "...you start to get a picture that there’s a slow process of evolution at work in the history of type, and things rarely pop out of nowhere." Of course, we're also talking about Top 10 lists in the original post, so I don't think we can have that serious of a discussion :)</p>
      <p>Maybe Syntax is debatable, in terms of being the "epitome" of a certain typographic grouping -- it doesn't neatly stand out as an achievement of anything in a historical sense. You could say the same of Helvetica, although Helvetica is clearly omnipresent while Syntax is present, but by no means deserving of omni- status.</p>
