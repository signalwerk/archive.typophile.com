      <p><em>Syntax had a certain sense of modernity that you don’t see in Gill Sans, and it touched off a whole new interest in humanist sans.</em></p>
      <p>Like I said, I don't buy that theory, which is a connect-the-dots, post-facto application of simplistic narrative-style history, operating from face to face. I don't thin type design works like that, I certainly don't.</p>
      <p>Gill Sans was released in the 1920s, Syntax in the 60s. If they were so influential, how come there was no bandwagon or critical mass of humanistic sans faces emerging until the 1980s? </p>
      <p>I recall Shannon (1982) as another face that I noticed when I was doing Shinn Sans, and paid more attention to it than Syntax, as it was, indeed, a contemporary face. I didn't really think about Frutiger, it was just too sublime to get a handle on!</p>
