      <p>I don't believe in the great man theory of history, or the great typeface theory.</p>
      <p>With a little knowledge, one can detect trends, ignore what doesn't fit in, and construct a narrative.<br>
      Whether this has anything to do with the motivations of type designers is doubtful.</p>
      <p>Typefaces are designs which address complex issues to do with technology, page layout, and type culture--not sequels.<br>
      All types, that is, that aren't overly plagiaristic.</p>
      <p>Having said that, I've heard that Bodoni thought Baskerville was the shiz.<br>
      But what really compelled Bodoni to go mod and neoclassical, and leave behind the Fournier frills of his youth?<br>
      No doubt he was blown away by Baskerville's hard metal, smooth paper, and black ink.<br>
      But I would imagine that most <em>contemporary</em> typefounders were making the same trip, caught up in the neoclassicism, romanticism and modernity of the era, inspired by  revolutions and discoveries, just as we are today. For various reasons, one or two are in the history books, three or four if you're better read.</p>
