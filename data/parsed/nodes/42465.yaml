      <p>Whoa there James. The concept of "display" and "text" faces comes from an era probably before you were born, where you actually ordered them from different compositors. Display type was set in strips and intended for headlines and titles and such. Text type was set in galley form and intended for body copy. They have very different functions, at least when it comes to book design.</p>
      <p>The same font can exist both in "text" and "display" form, such as H&amp;FJ Requiem or Perpetua.</p>
      <p>As one who will be needing reading glasses very soon now, I appreciate the difference between thoughtfully set text faces for reading copy, and display faces to add character. The morons are the designers who think there is no difference between display and text faces and who try to foist unreadable text on their poor suffering readers.</p>
