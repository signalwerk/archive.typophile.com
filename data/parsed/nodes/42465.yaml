      <p>Dean, you might be categorizing these more as "fonts that look old" and "fonts that look new." </p>
      <p>If you want to look at influential fonts of the contemporary period vs. influential fonts of the "classic" period, you need to look at what the creators of these fonts were trying to accomplish. Two fonts that I think were very influential on contemporary type design, for example, are PMN Caecilia and Syntax, because they brought humanist elements into the world of slab serif and sans serif type. Of course, you can trace this idea back to older typefaces like Optima, and you start to get a picture that there's a slow process of evolution at work in the history of type, and things rarely pop out of nowhere.</p>
      <p>In terms of "classic" fonts, you might want to come up with a different way to describe these, because "classical" typefaces often refer to a specific period in type design. </p>
      <p>The more you study type, the more it becomes apparent that classifications are, at best, a way for us to hold a public converation about type, just like the music store has to file everything under a genre, even if it doesn't fit. All that is to say, do you think this exercise will help you in any way?</p>
