      <p>MondoB, I covered that point with my reference to Optima. If I was talking about the 90s, I wouldn't bring up Helvetica, I'd talk about Meta.</p>
      <p>Of course Syntax was born out of Gill Sans, but I'm talking strictly about contemporary faces. Syntax had a certain sense of modernity that you don't see in Gill Sans, and it touched off a whole new interest in humanist sans.</p>
      <p>A good example of this today is Galaxie Polaris <a href="http://vllg.com/Village/GalaxiePolaris/" title="http://vllg.com/Village/GalaxiePolaris/">http://vllg.com/Village/GalaxiePolaris/</a>. This obviously owes a lot to Helvetica -- a lot of people would not be able to tell the difference -- but it has a feeling of "nowness" that has maybe evaporated a bit from Helvetica. The same could be said for Kai Bernau's Neutral.</p>
