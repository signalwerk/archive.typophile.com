      <p>I designed a humanist sans in the early 1980s, when there weren't many around.<br>
      I certainly thought of Gill Sans as a precedent, and didn't pay any attention to Syntax.<br>
      However, I had been studying calligraphy at that time, as a means of getting inside the cheirographic soul of the typographic tradition, and I think that influential idea may have been "in the air" at the time -- no doubt reinforced by the presentation of Hermann Zapf's calligraphy in the trade media, as being an important part of his method.</p>
