      <p>Nick: I do not agree with you. I strongly believe that in the large scale, typographers are followers, sometimes they upgrade existing designs with genius, but most of the time, they just follow one's path. I think it's a huge mistake to think that 2, 3, 10 typographers in the world will create a similar kind of type because they are making "the same trip, caught up in the neoclassicism (...) of the era". I think they are indeed mainly attracted by the commercial possibilities of having a type which looks a lot like the successful one from "this other typographer". You give the example of Bodoni: he always aknowledged Baskerville as his main inspiration, and his early types were very close in the design, but he undoubtedly came to a design on his own some years later that was widely copied after encountering fame and recognition; he spent a lot of his life arguing with Didot for plagiarism, as you probably know. When you say that "typefaces are designs which address complex issues to do with technology, page layout, and type culture—not sequels", you are saying a very limited truth, for this is a true definition of, say... 3, maybe 4% of the total amount of typographers out there. In my opinion, that's very idealistic; I am certain that the motives of typographers now and then was much more mercantile, even if their names are Morris Fuller Benton, Frederic W. Goudy, Eric Gill or Adrian Frutiger - this being said with a sincere respect and admiration for their outstanding works.</p>
      <p>dr</p>
