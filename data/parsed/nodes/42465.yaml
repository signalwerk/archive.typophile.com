      <p>This is clearly the kind of post which will generate an endless string of rants from people who are always passionate in their strong belief of knowing the true truth. I've read a lot of intelligent things up there, altogether with complete crap (according to me, of course). If we are going in the direction offered by Hector, well then the only influential typeface is the first one, for all the other ones have been made after it... Well, I guess I have no choice but to give my own point of view. According to my understanding of the question, my list of typefaces which have "launched a stylistic / visual trend in typography", to make it simple, would be:</p>
      <p>- Jenson (basically, the first roman type, in 1465)<br>
      - Alde Manuce's italic (by Manuce and Griffo)<br>
      - Garamond's Romain (A significant upgrade of Jenson's, Manuce's and Griffo's types)<br>
      - Grandjean's Romain du Roi (Baskerville and Caslon, though skilled artists, were 100% influenced by this one)<br>
      - Bodoni (a true landmark which inspired many typographers)<br>
      - Slab serif (again, a significant upgrade to Bodoni, though it's hard to give a name to a specific type, for they existed as Egyptians before Clarendon was commercialized)<br>
      - Caslon two-line egyptian (the true influence to all the grotesks of the late XIXe century)<br>
      - Akzidenz Grotesk (significant improvement to Caslon IV's egyptian, direct influence to Franklin Gothic, Helvetica, Univers et al)<br>
      - Erbar (direct and aknowledged influence to Futura, which influenced kabel, avant garde, avenir, and the handpainted signs of chicago or new york that influenced gotham)<br>
      - DIN Mittelschrifft (though not designed in an aesthetic purpose, it influenced a great deal of typefaces)<br>
      - I have to mention Optima, though it can hardly be considered as an influence to anything: despite its huge success, it is still one of a kind, 50 years after its design.<br>
      - Syntax (a truely new style at the time, the authentic influence to most of the contemporary typefaces, including Stone's types and FF Meta)<br>
      - Frutiger (a big improvement on humanistics sans serifs which influence you can see on many contemporary designs, including Myriad)</p>
      <p>and, I think, that's all. the remaining types are either truely successful and original, but didnt influence enough types to be named "influential" (Eurostile, FF Cocon, FF Dax...), or they just show their parent's eyes or mouth too obviously.</p>
      <p>that of course is open to discussion.</p>
      <p>dr</p>
      <p>EDIT: I consciously omitted the script typefaces, otherwise I would have no time to work today.</p>
