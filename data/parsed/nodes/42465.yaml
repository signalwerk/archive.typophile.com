      <p>Romain du Roi influenced Baskerville who influenced Bodoni and Didot.</p>
      <p>The face for the London underground by Edward Johnston influenced Gill Sans which influenced a number of 20th century sans serif humanist typefaces.</p>
      <p>The roman typeface by Nicholas Jenson is the model for all subsequent roman typefaces.</p>
      <p>The typefaces by Griffo for Aldo Manuzio influenced Garamond.</p>
      <p>Arrighi's chancery italic has to be considered influential as well.</p>
      <p>Plantin's typeface influenced Times New Roman.</p>
      <p>Janson typeface by Nicholas Kis influenced Caslon.</p>
      <p>¿Could Bell be considered responsible for the XIX century type style?</p>
      <p>FF Scala is a "contemporary" influential serif face.</p>
      <p>Meta is a "contemporary" influential sans serif typeface.</p>
      <p>Héctor</p>
