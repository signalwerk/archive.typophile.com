      <p>Serif-serif, there's no need to crap on this thread's creator. It's always fun to swap favorites. First list: delete Clarendon (of no importance whatever) and add: Sabon, Galliard, and, obviously, Times. The first two kicked off the typhoon of new typefaces in our era—more instant classics since 1970 than in the entire history of movable type until then. Sabon and Galliard are the St. Peter and St. Paul of post-metal type. </p>
      <p>I question your distinction between classic and contemporary: a first-rate new face aims to become a timeless classic, as Sabon and Galliard certainly have.</p>
      <p>And don’t forget to give credit to the foundry ITC, which since the late sixties revived interest in typography as a living growing creative medium open to newcomers, well before digital and Postscript. Adobe moved into a field fertilized and sown by ITC.</p>
