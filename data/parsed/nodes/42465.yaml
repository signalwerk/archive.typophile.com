      <p>Thanks Nick, that's what I'm trying to get at but didn't say very well. These trends in design aren't a concerted effort. They just happen as type designers see gaps in the type library and fill in the hole with similar solutions. Syntax and PMN Caecilia are just two good examples of large trends in the 80s and 90s -- they were very popular, and embodied the idea of humanizing seemingly cold and stark slab serif and sans serif typefaces. </p>
      <p>I'm sure if you went back in time and told the heads of type foundries 100 years ago what type they'd be remembered for, there'd be quite a few that were obvious to them, and quite a few that pissed them off.</p>
