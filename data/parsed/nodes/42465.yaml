      <p>And I should add that all this display and text type was VERY EXPENSIVE. Which meant that if you screwed up you often had to live with it. Also meant hours messing around with a xerox machine and an x-acto to make sure your type choices were the right ones before you ordered it. Display type was priced by the word so we used to cheat by making up words out of our initial caps to save money.</p>
      <p>Text type involved copyfitting, character counts, etc. If you wanted to make an inset for a photograph you had to specify how many lines, and copyfit around it.</p>
      <p>But I'm way off topic here.</p>
      <p>On topic: I do think Clarendon is influential (in response to whoever said it isn't). There are a lot of slabs that came out of the Clarendon mold.</p>
