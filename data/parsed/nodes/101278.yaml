      <p>I think Proxima Nova would've been seen as having a lot of personality a decade or two ago - these days I think it's relatively sedate (which can be a good thing as you imply). I guess we need to get a better grasp of what "progressive" means here, and how much risk is desirable. To me every typesetting job is an opportunity to contribute something to cultural progress... sometimes covertly.  :-)</p>
      <p>BTW a good match to Proxima Nova might be Archer (although I'm personally not a big fan of its Italic) or some other serif font where the "a" has a bouncy bowl.</p>
      <p>hhp</p>
