      <p>Interesting discussion regarding the subject matter of the text in relation to the font.<br>
      Here's some more background: the book is basically an extended case against the status quo in regards to certain religious beliefs. Since it's making a book-length argument, the typography needs to be clear and not distracting. The last thing I'd want is for someone to open it up and think "wow--that's an odd font" or even just be left with the feeling that something seems "off" in with text as compared with other books. I'm not looking to make a huge statement with the typography...the meaning of the text is doing it well enough. But I would like something that steps beyond the usual choices, that seems fresh and new and maybe even inspiring. And a nod to the past is fine as well. Just because a religious tradition is being questioned doesn't mean that all connections with the past must be severed.</p>
    html_clean: |-
