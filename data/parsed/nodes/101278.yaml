    html: <p>I would second Mr. Ellerton's suggestion for Iowan oldstyle pro, not only because he has a lot of experience and good taste, but because proxima nova has a lot of personality and Iowan OS is quiet and elegantly unobtrusive. I would be careful about two typefaces with too much personality competing. A font without too narrow a vintage would be desirable, especially for prolonged reading.</p>
