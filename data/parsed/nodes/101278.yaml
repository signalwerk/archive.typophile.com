    <p>I'm designing a trade paperback: it's approximately 200 pages with the title &amp; headings set in Proxima Nova. The book is non-fiction and about progressive religion/spirituality. </p>
    <p>Any ideas of a good body font to use? Something clean, modern, forward-looking and extremely readable. Thanks for your suggestions!</p>
