    html: |-
      <blockquote><p>against the status quo</p></blockquote>
      <p>All aspects of the typography needs to harmonize with this - including the text font. But that doesn't mean it needs to scream "look at me" - in fact it almost never should. The thing is, text fonts work "under the radar" to make us <em>feel</em> things (as opposed to merely see things). Turnip for example certainly does look idiosyncratic when set/viewed large; but at text sizes that effect recedes and is replaced with a -judiciously- unconventional <em>texture</em> - that's the magic of text fonts. Does it recede enough? I don't know. That depends on a number of things, not least the point size.</p>
      <p>To me the worst thing you can do is give up and just revert to something the Pope would use. (I mean the next one. :-)</p>
      <p>hhp</p>
