    html: |-
      <p>There was a mention of Archer a few responses back, and while Archer is certainly a good match for Proxima Nova, it has the penchant off coming off too quaint or overly-friendly if not used in it's proper context. I would tend to look at a few contemporary geometric slabs that are constructed for better readability than their historical counterparts. <strong>Sanchez</strong> by Latinotype: <a class="freelinking external" href="http://www.latinotype.com/#/gallery-sanchez" rel="nofollow">http://www.latinotype.com/#/gallery-sanchez</a> is a slab I have experimented with that pairs fairly well with Proxima Nova, has a warmer personality than a traditional slab, and provides decent readability. </p>
      <p>If you do go decide to try this pairing, I would also suggest you use the alternate lowercase "a" in Sanchez (accessible via OpenType) to match Proxima Nova's double story lowercase "a" since by default Sanchez uses a single story.</p>
      <p>Overall, look into contemporary slabs, including those that lean towards Humanist characteristics if you want a font that is a bit more distinguished from Proxima Nova without straying too far from it's common underlying structure.</p>
