      <p>A Very Good Question. They <em>look</em> like Zapf Dingbats, but upon close inspection there are a few tiny differences (notably in the right one).</p>
      <p>I found a few surprises lurking in my Windows 7 font list (Lucida Sans has a nice own interpretation; Segoe UI Symbol has, erm, "sans" florals?); but MS Gothic is a perfect match for the symbols I see on the screen.</p>
      <p>Left: MS Gothic, Right: What I See in Explorer at 1000% (which may or may not be what you are seeing)</p>
