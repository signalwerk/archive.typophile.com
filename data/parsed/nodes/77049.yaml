    <p>Ignore this post if you’re reading it on a Mac.</p>
    <p>Either I was installing it wrong previously, or Microsoft fixed it in 1.4, and I was using 1.3, but finally I got Microsoft Keyboard Layout Creator to install and run in Windows 7, and I used it to build a custom German/English “typographer’s keyboard” layout. (My physical keyboard has a standard German layout.) This enabled me to add a bunch of extra punctuation and some archaic stuff such as ſ.</p>
    <p>I also managed to add two dingbats from the Unicode Zapf Dingbats subset range, U+2766 and U+2767.</p>
    <p>❦ ❧</p>
    <p>If you can see those, you are seeing them in pure Unicode. Windows is switching fonts somewhere to display them.</p>
    <p>My question: where in Windows is the font containing these glyphs? MacOS comes with Zapf Dingbats, but Windows does not. They’re not in Arial, or Tahoma, or Segoe, or Wingdings, or Courier, Lucida Sans Unicode, or any of the C-fonts. </p>
    <p>I am stumped. How do you hide a font in Windows yet still make it accessible in multiple applications?</p>
