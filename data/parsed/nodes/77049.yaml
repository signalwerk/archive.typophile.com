    html: |-
      <p>The line draw characters were officially part of the WGL4 character set so ended up in Windows core fonts. Most third party fonts tend to skip them even if they claim WGL4 support as they are considered optional.</p>
      <p>The Japanese font MS Gothic contains a lot of symbols, and as it's part of the font fall-back chain so you'll see them come up quite frequently.</p>
