    html: |-
      <p>Nice work. This has appealing character, and I especially like the ligatures.</p>
      <p>You should definitely move it to a font design program so you can evaluate it in more settings. Once you do that, here are some questions I would ask:<br>
      - Is the top of 'c', 'q' too light? 'C'?<br>
      - Are the lumps of 'm' too pointy? 'n'?<br>
      - Do the 'f's in the 'ff' ligature match well?<br>
      - Is the transition from thick to thin in 'S'/'s' too abrupt?<br>
      - Is 'N' too narrow? 'M'?<br>
      - Is 'J' off balance?<br>
      - Is the space under 'Q's tail within the bowl serving well at target sizes?<br>
      - Are some of the small caps too dark (for example 'M')?<br>
      - Should the right foot serifs of 'f' and 'r' be extended to help balance the letters?</p>
      <p>Hope that helps.</p>
