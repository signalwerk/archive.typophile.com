    <p>Hey there!<br>
    Well, I'm new here so maybe I should introduce myself.<br>
    My name's Filip Łysyszyn and I'm young <em>(typo)graphic designer wanna-be</em> from Warsaw, Poland. I'm not a design/art student (I study english philology).<br>
    I've recently started working on a new typeface that I hope to be my first "serious" one. However, I'm still very unexperienced and I really would appreciate professionals help (that means you, guys). </p>
    <p>So, let's get it on:<br>
    The typeface name is July, probably because I started it in July.<br>
    It's meant to be a roman type with rather big aperture, small contrast and strong but short sherifs.<br>
    These weird acutes you see are a polish diacritics "kreska". These strange accents in "a" and "e" are again polish diacritics called "ogonek". The "l" with a diagonal line in the middle is a polish letter "ł" (lslash).<br>
    I haven't put it in a font file yet, because some glyphs need corrections - that's why I can't show it in a paragraph here.</p>
    <p><strong>Work In Progress Specimen:</strong><br>
    <a href="http://lysyszyn.pl/projects/specimen01.png" title="http://lysyszyn.pl/projects/specimen01.png">http://lysyszyn.pl/projects/specimen01.png</a><br>
    <a href="http://lysyszyn.pl/projects/specimen02.png" title="http://lysyszyn.pl/projects/specimen02.png">http://lysyszyn.pl/projects/specimen02.png</a> - lowercase<br>
    <a href="http://lysyszyn.pl/projects/specimen03.png" title="http://lysyszyn.pl/projects/specimen03.png">http://lysyszyn.pl/projects/specimen03.png</a> - uppercase<br>
    <a href="http://lysyszyn.pl/projects/specimen04.png" title="http://lysyszyn.pl/projects/specimen04.png">http://lysyszyn.pl/projects/specimen04.png</a> - small caps<br>
    <a href="http://lysyszyn.pl/projects/specimen05.png" title="http://lysyszyn.pl/projects/specimen05.png">http://lysyszyn.pl/projects/specimen05.png</a> - ligatures</p>
    <p><strong>PDF PREVIEW</strong><br>
    <a href="http://lysyszyn.pl/projects/preview.pdf" title="http://lysyszyn.pl/projects/preview.pdf">http://lysyszyn.pl/projects/preview.pdf</a></p>
    <p>Again, I would appreciate any help and critique!<br>
    Your's sincerely,<br>
    Filip Łysyszyn</p>
    <p>PS. If I violated any rule of etiquete around here, please forgive and let me know.</p>
