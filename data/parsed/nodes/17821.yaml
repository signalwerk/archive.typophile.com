    <p>Hello</p>
    <p>I’m working on a women’s fragrance project and the theme is a swinging 1960s mod-girl kind of Carnaby Street look. Twiggy, vibrant colors and patterns, etc. Part of the packaging features Op Art patterns. I’m looking for a typeface that reinforces this theme. The research I’ve done has uncovered surprisingly staid and low-key typography on the actual graphics from the era, at least connected with fashion, and none of it seems right. I’d like something mod and idealy feminine/girly and fun, energetic, that evokes the era and its spirit. Maybe a script. Any ideas? Thanks much for any help you can offer.</p>
    <p>Rob</p>
