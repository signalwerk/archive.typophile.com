      <p>I think the hard part is that so much of that era’s stuff was hand drawn.  There was a return to hand-made craft (anything from bead making to macramé[sp?] and bread). The original practitioners were young and free from convention but soon Madison Avenue found something fresh to mimic. The result was kinda’ almost but did not have the personality of the hand-made originals.</p>
      <p>ChrisL</p>
