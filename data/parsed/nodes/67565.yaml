  html: |-
    <p>Hi,</p>
    <p>I have a question about owning font licenses. If an organization wants me as freelance a designer to use a font that is not a free font or a system font, do they need to purchase one license or two (two being one for them, one for me)? </p>
    <p>And if I own a font, does the organization still need to purchase it in order for them to use my design?</p>
    <p>Thanks!</p>
