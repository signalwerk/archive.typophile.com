    html: |-
      <p>It depends on the number of machines that you install it on, usually. MyFonts.com lets you select the number and the price varies accordingly. For example, I recently had to license Myriad Pro and by fiddling with the number of licences required I discovered that the fees go up after five licences, so I got five for the same price I would have paid for one.<br>
      In answer to your question, it depends if the organisation is going to install it in their office, and if so, how many times.<br>
      This answers your second question too. You can license a font and use it in design work for your client without them needing to install it on their machines.</p>
