    <p><strong>Lichtspiele — A typocalypse display typeface</strong></p>
    <p>Cinemas from the early 20th Century are called "Lichtspiele" in Germany. "Lichtspiele" transports you back to a time where neon lights and marquee letters decorated cinema facades.</p>
    <p>Of the 5 styles, three have two versions of italics - one for each perspective. Display is your basic style. Neon is inspired by the old neon letters found outside cinemas.<br>
    Add Neon Outline to Display or Neon to add another layer to your artwork. Neon 3D is a extruded version of Neon. Screen Credits is based on the liner notes of movie posters.</p>
    <p>You can get it at <a href="http://www.myfonts.com/fonts/typocalypse/lichtspiele/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a> for a introduction price of 29,85 USD<br>
    or with a limited edition (tote bag, showings newspaper, posters) for 59 EUR at <a href="http://lichtspiele3d.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">lichtspiele3d.com</a></p>
    <p><a href="http://lichtspiele3d.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">lichtspiele3d.com</a> &amp; <a href="http://www.myfonts.com/fonts/typocalypse/lichtspiele/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a></p>
