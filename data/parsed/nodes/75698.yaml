      <p>To explain why WOFF needs a dsig? I rewrote its FAQ instead. I will say this, the "division" between "web fonts" and "print fonts", is really a W3C &amp; UA construed faux-tech solution to get the foundries on board. The solution goes against the font behavior required by many of the coolest needs of modern publishing.</p>
      <p>This is Håkon's apparent, and repeatedly implied direction, and I agree completely. So if you have the time, talk to him about his vision and then what's the big deal!? put a damn dsig in and try to make the WOFF spec ignore the payload's dsig entirely, please. Pretty please :)</p>
