      <p>I'm not sure this is exactly what you're looking for, but FontSquirell's @font-face kit generator lets you create subsets from font files.<br>
      FontSquirrel Generator : <a href="http://www.fontsquirrel.com/fontface/generator">http://www.fontsquirrel.com/fontface/generator</a></p>
      <p>The tool is designed to create full @font-face kits but you can upload your TTF, choose TTF only as output format and use the “Expert” subset creation tool (which is very handy). It only takes 2 minutes so it won't be a huge waste of time if it's not what you're looking for :) Please note you have to tick the “Yes, the fonts I'm uploading are legally eligible for web embedding” check box even if it's not the case and you don't intend to use it on the Web. Otherwise it won't let you do what you want to do.</p>
      <p>Good luck!</p>
