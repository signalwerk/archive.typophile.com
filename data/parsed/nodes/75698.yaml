      <p>Thomas: <em>Kerning and (other) OT layout features are the tough parts for subsetting.</em></p>
      <p>We have put subsetting on the list of planned functionality for (one of) the next release(s) of OTM.</p>
      <p>In an FM-based workflow, subsetting is not very complex because the exported characters are defined by a .cha file and –as everybody knows by now– the character set does not have to cover the stuff listed in the linked OT features file (because the rewritten HOT tool removes the obsolete features from the font during generation). Of course, everything can be done in batch via command files.</p>
      <p>FEB</p>
