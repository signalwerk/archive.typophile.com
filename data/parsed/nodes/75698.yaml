      <p>&gt;...I'm all ears</p>
      <p>Subsetting is why I wanted to burn the former Appendix B &amp; C of the WOFF spec. </p>
      <p>Under what used to be best practices for WOFF producers, Appendix B said, WOFF makers must make WOFFs that are 100% compatible with the original font, or be outside of the W3C specification. (I'm not sure how this has changed since it was absorbed into other parts of this and other documentation). </p>
      <p>Then, under the best practices for WOOF-using user agents, Appendix C said these agents could subset the font, leaving out whatever might not be needed. (and I'm not sure how this has changed since it was absorbed into other parts of this and other documentation). </p>
      <p>The sad thing is, that UA's doing the subsetting on the user's machine is like refining petroleum in each homeowner's boiler. Even stranger, is that the W3C does not seem to appreciate, and RF, you obviously don't, that automatically subsetting a font, with its compressed kerning, glyphs and hints, will require a complete TT interpreter. </p>
      <p>I know I'm a complete TT interpreter and can subset any font accurately, but I wonder how many others there are out there.</p>
