    <p>How do I subset a font down to a custom codepage of glyphs? In other words, if I've got a font with 393 gylphs, and I want to bring it down to a particular subset of 228, how do I delete the glyphs I don't want efficiently? (Without saving to a new vfb file, and manually deleting them. Very laborious and prone to error.)</p>
    <p>Doesn’t seem to be anything in the FontLab manual about it and I've searched here on this site, too.<br>
    I have FontLab, FOG, TTX, OTMaster, FontForge. (Anything else I should acquire for this purpose?)</p>
    <p>Is there some kind of export/import procedure that will get me there?</p>
    <p>Thanks.</p>
    <p>Rich</p>
