      <p>FontLab doesn't provide a means to do this, other than as you describe (manual deletion). To avoid possible errors in the deletion, you can define a custom encoding, sort glyphs by encoding, and delete any glyph that falls outside the encoding.</p>
      <p>Ideally, you want a dedicated subsetting function, that will not only subset the glyph set but will also recompile GSUB and GPOS and other tables.</p>
