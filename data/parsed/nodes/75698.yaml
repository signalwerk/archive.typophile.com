      <p>David: <em>Under what used to be best practices for WOFF producers, Appendix B said, WOFF makers must make WOFFs that are 100% compatible with the original font, or be outside of the W3C specification.</em></p>
      <p>That's an understandable misinterpretation, and the text has been clarified. In this context, 'original font' meant the font that is placed into the WOFF wrapper, which must be losslessly wrappable and unwrappable. A tool that produces WOFF files might perform other functions to a font file, such as subsetting, before wrapping the resulting font data, but for WOFF purposes it is the font that goes into the wrapper that matters, not the font at the beginning of the process. This, as I say, has been clarified, and I believe the term 'original font' is avoided.</p>
