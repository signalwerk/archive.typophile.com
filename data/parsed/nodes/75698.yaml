      <p>David: <em>Now, is the dsig "in-scope", and if so how?</em></p>
      <p>The dsig table is preserved in the WOFF-wrapped font data just like all the other tables.</p>
      <p>This does mean that if you want a valid dsig in your WOFF'd fonts, then you need to sign or re-sign the font that goes into the wrapper after you have performed any other operations, e.g. subsetting or adding custom data such as serialisation, permissions, etc.</p>
      <p>The workflow would be:</p>
      <p>1. Input font, i.e. the TTF master from which the specific WOFF'd font file will be derived.</p>
      <p>2. Font data processing, manipulation, augmentation, e.g. subsetting, serialisation, etc.</p>
      <p>3. Digital (re)signing.</p>
      <p>4. WOFF</p>
      <p><em>All that remains now is the actual functioning of multi-dimensional industrial-strength typography amongst this herd of boons.</em></p>
      <p>Indeed.</p>
