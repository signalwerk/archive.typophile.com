    date: 2004-09-21T11:02:00
    date_raw: 21 Sep 2004 — 11:02am
    votes: null
    html: "<p>I think the combination of strong \"piecemeal\" stems &amp; curves and wedge serifs is cool. The vertical proportions are great for a text face, but since this is more of a display face (at least the weight you're showing here) you might make the ascenders a bit shorter. <br> <br>As for the glyphs, they all make sense to me so far, so I'd say make the rest and see how it goes. The two things I'd note right now are: the foot serif on the \"r\" should be longer; and the curve-ear join on the \"g\" needs modeling to relieve the clotting (like you already have with the \"n\"). <br> <br>hhp</p>"
    html_clean: "<p>I think the combination of strong \"piecemeal\" stems &amp; curves and wedge serifs is cool. The vertical proportions are great for a text face, but since this is more of a display face (at least the weight you're showing here) you might make the ascenders a bit shorter. <br> <br>As for the glyphs, they all make sense to me so far, so I'd say make the rest and see how it goes. The two things I'd note right now are: the foot serif on the \"r\" should be longer; and the curve-ear join on the \"g\" needs modeling to relieve the clotting (like you already have with the \"n\"). <br> <br>hhp</p>"
