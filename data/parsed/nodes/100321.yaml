    <p>Hi All!</p>
    <p>While working on a typeface in Illustrator CS6, I came across an aliasing issue, that I'm not sure what to do about. I've attached a screen cap of two different "n"s worked on in different occasions, (same system, same software) there was another post regarding aliasing in illustrator on this forum but it wasn't this particular problem. I tried saving the file in a legacy format and pasting them back in, but I really am just shooting in the dark...</p>
    <p>Any help would be appreciated!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ill_aliasing_4896.jpg"></div><p></p>
