    date_raw: 12 Mar 2013 — 5:35pm
    votes: null
    html: <p>Just for those who experienced this as well I found out that it was two overlapping compound shapes, the same form was duplicated on top of its' clone and it was held together somehow in one compound object, illustrator couldn't decipher the two from one another, but as soon as I pasted the form into fontlab, I was able to remove the duplicate that was causing those issues, god bless fontlab, I think I'll just try to work in fontlab from beginning to end. yay!</p>
