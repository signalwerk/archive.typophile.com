    html: "<p>I like the new changes too Peter. And I think these two comments from Chris and Tiffany will do a lot to point you in the right direction: <br> <br>&gt;Generally it's a bad idea to mix two similar faces  <br>&gt;I think you need something geometric.  <br> <br>I.e., use a sans serif, but a sans like Gill is still too close to classical letterforms (too much like MARK ZARNOW). Hence Tiffany's suggestion of a geometric. Well, I think - I certainly don't want to misrepresent anyone. <br> <br>One thing about the letters in MARK ZARNOW: the \"R\" is still too heavy to my eyes. Is it possible to widen it slightly - or make the tail thinner (more like \"K\") - in order to create more counterspace?</p>"
    html_clean: "<p>I like the new changes too Peter. And I think these two comments from Chris and Tiffany will do a lot to point you in the right direction: <br> <br>&gt;Generally it's a bad idea to mix two similar faces  <br>&gt;I think you need something geometric.  <br> <br>I.e., use a sans serif, but a sans like Gill is still too close to classical letterforms (too much like MARK ZARNOW). Hence Tiffany's suggestion of a geometric. Well, I think - I certainly don't want to misrepresent anyone. <br> <br>One thing about the letters in MARK ZARNOW: the \"R\" is still too heavy to my eyes. Is it possible to widen it slightly - or make the tail thinner (more like \"K\") - in order to create more counterspace?</p>"
