    html: <p>I like Z a lot too, Peter. Maybe if you make the notch (or "crotch") in the R a bit bigger, it'll lighten up the joint in the middle. I think that's one of the reasons it looks so much darker. I also think the reason the W seems unbalanced is the difference between the two apertures at the top - and the counter space. The left counter is much smaller and has a smaller aperture. Maybe it'd help to widen it some.</p>
