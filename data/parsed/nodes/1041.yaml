    html: "<p>Hrant.  Good call on the spacing, though I wasn't so sure on the AR tightening, but did it anyway so we can have a look. <br> <br>I love Apex, I think I may go with it.  Bank Gothic could work too, I like it's horizontal appeal, but not into those terminals on the G and S. <br> <br>Daniel, I disagree with you for the following reason:  The client wanted something classic and sheik, yet humble and unpretentious (maybe a little pretentious).  He's a fashion photographer, and this logotype is based off of elements of the Prada logo (see the A) and an old letterpress small caps font I found. <br> <br>I think I am acheiving exactly what I set out to do. <br> <br>Show me an example of the requirements I had that has more \"emotion\" and isn't as \"forgetable\" as mine, and maybe I'll reconsider. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/15078.gif\" alt=\"\"></p>"
