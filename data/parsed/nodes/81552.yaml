    html: |-
      <p>They are summaries, at least according to the introduction, which states, "For quick immersion, we suggest skimming Part I by reading the italicized sections only."</p>
      <p>Isn't that the way summaries work—defined as “a shortened version of a text that highlights its key points”?</p>
      <p>Alternatively, they could be considered as subheadings, in that they introduce ideas which are expounded upon in the immediately following text. Paragraph-length subheadings, that is.</p>
      <p>However, on a purely typographic reading (disregarding content), as there is no variation in the body text, other than style, it is merely <em>emphasis</em>, which is generally done by going into italic or bold face, or perhaps a sans. It could be compared with a block quote, which is a similar interruption of body text. So how about "block subheading"?</p>
