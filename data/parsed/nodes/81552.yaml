    html: <p>I don't think there's an exact term for this. They look a little like pull quotes (usually used to mean repeats of a quote in an article printed in large type in the margin or text column, which the main text flows around, so not exactly the right definition) or block quotes / extracts (still not exactly what you have). The term "deck" is also maybe applicable, though, like the other terms, not quite right (decks are introductory paragraphs printed in display size or special typeface). I might go with "extracts," though as I said, that has a slightly different definition of its own.</p>
