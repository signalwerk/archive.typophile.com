    <p>Could someone help me pin down some typographic terminology? I am trying to describe the form of Galloway and Thacker's book *The Exploit.* Here's a preview: <a href="http://books.google.com/books?id=_OsaKlegTbcC&amp;printsec=frontcover&amp;dq=galloway+thacker+exploit&amp;hl=en&amp;src=bmrr&amp;ei=7Za1TbjQM8LdgQfD0Km8Cw&amp;sa=X&amp;oi=book_result&amp;ct=book-thumbnail&amp;resnum=1&amp;ved=0CCsQ6wEwAA#v=onepage&amp;q&amp;f=false" title="http://books.google.com/books?id=_OsaKlegTbcC&amp;printsec=frontcover&amp;dq=galloway+thacker+exploit&amp;hl=en&amp;src=bmrr&amp;ei=7Za1TbjQM8LdgQfD0Km8Cw&amp;sa=X&amp;oi=book_result&amp;ct=book-thumbnail&amp;resnum=1&amp;ved=0CCsQ6wEwAA#v=onepage&amp;q&amp;f=false">http://books.google.com/books?id=_OsaKlegTbcC&amp;printsec=frontcover&amp;dq=gal...</a></p>
    <p>As you'll see (and as they explain in their note "On Reading This Book"), the first major section has fragments in italics which set off small bits of the text-- they're not headings, because they are part of the main text. Is there a typographic term for this kind of form? Or can I just call them "fragments and micro-essays"? Thanks for any help.</p>
