    <p>As you'll see (and as they explain in their note "On Reading This Book"), the first major section has fragments in italics which set off small bits of the text-- they're not headings, because they are part of the main text. Is there a typographic term for this kind of form? Or can I just call them "fragments and micro-essays"? Thanks for any help.</p>
