      <p>I would say book as soon as humanly possible. Somehow hotels were booked for the week of ATypI but not the weeks before or after. Is there another conference (or 5) going on just then? </p>
      <p>Dan, I found that hotel, but envisioned the sound effects of rock bands destroying it while trying to sleep. I could be overestimating the music scene in Brighton?...  Believe it or not I like to sleep a little bit during conferences. </p>
      <p>Eben, I think Joe and/or Simon blogged but I think that waned as the real-time version took over. Look in the blogs.</p>
