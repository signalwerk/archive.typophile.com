    <p>Hello everybody!</p>
    <p>I happened upon this old lead typeface recently (see attach). Its name is "Industria", and it was designed by Hermann Zehnpfundt for the Emil Gursch Foundry in Berlin in 1910/1913; Berthold later added a couple of weights in the 1920s. The most recent sample I have been able to find so far dates from 1933.</p>
    <p>So far, not too much to ID, but: Has anybody seen this typeface digitised, or anything that looks more or less closely inspired by it? I already asked on the German <a href="http://www.typografie.info/typoforum/index.php" rel="nofollow">typoforum</a>, where nobody had seen it, but I figured if anyone knows at all, then probably here.</p>
    <p>I'm kind of hoping you'll say no, since I'm inclined at having a go myself. I really like this one. :)</p>
    <p>Please let me know if you need / want more images. This is the base weight, I have also found specimens of the light, semibold, and bold weights.</p>
    <p>Thanks for any pointers!<br>
    Nina</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/industria_small_5469.gif"></div><p></p>
