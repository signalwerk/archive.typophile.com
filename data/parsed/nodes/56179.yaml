    html: |-
      <p>A see a reason not to.</p>
      <p>I mean, why do the kerning two times?</p>
      <p>Why not just open up your words in FontLab and kern directly there? You can prepare text files and load them into Metrics window.</p>
      <p>Then if you would like to see how it looks in InDesign, have the document ready and just update the font you are generating.</p>
      <p>I usually generate all test-fonts directly to the Adobe&gt;Fonts folder for immidiate updates in InDesign. Works very handy.</p>
