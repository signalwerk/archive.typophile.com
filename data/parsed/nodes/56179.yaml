    html: |-
      <p>Twice? Just <a href="http://www.kltf.de/downloads/ATypI2007-CrossingBorders-kltf.pdf">export</a> kerning from the ID document, for import into the font. (That could handle UPM conversion too.)</p>
      <p>Kerning in ID is more comfortable than kerning in the FLS Metrics panel. Just my opinion.<br>
      But better leave the test font unhinted. Hinting may interfere with glyph positioning on the screen, which means that what you see is not what you get.</p>
