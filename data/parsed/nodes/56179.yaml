    html: |-
      <p>As to the export/import scripts, I made them for my own use — they identify glyphs by GID which has awquard side-effects like: don’t apply features in ID. If I have some time later this year I’ll write a new ID script for reading out ID kerning which should also consider features applied. But maybe others have done this already? I’d appreciate it.</p>
      <p>Indeed Metrics Machine currently looks like the best interface for manual kerning since it also helps with secondary things like producing kerning strings, creating classes and copying kerning values from glyph sets to other glyph sets (including adjusting values). I enjoyed the RoboThon presentation a lot.</p>
