  html: |-
    <p>Working on a magazine grid where the main body copy is 8.5/10. I need some auxiliary sizes eg "large copy" and "caption/small copy". I'm thinking about 10.5/12 and then 6.5/8 for captions and other small text. Would using a 2pt baseline grid be ideal? I know it can get messy, I'm just wondering what the best solution is.</p>
    <p>Cheers!</p>
