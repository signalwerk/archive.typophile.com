    html: |-
      <p>Do not go there. Grids that are too fine are no good, they miss the point of using a grid. I prefer using baseline-shift to get some variety in the typography. Example in case: subheadings in bodytype can be too close to the bodytype — use the blank line before the subheading to solve this. Baselineshift in the order of  a fifth or quarter of the leading will do the trick.</p>
      <p>For captions that have to use less leading (aka linespacing) use the InDesign-feature Align first line to grid only in Paragraph Style. Go for solid fractions of the grid and you are all set : )</p>
