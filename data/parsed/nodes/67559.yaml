    html: |-
      <p>The method used by Bert is interesting, but have two drawbacks.</p>
      <p>The first is that this blank line will sometimes be the first of a column and may needed to be removed. Also consider the changes the matter may suffer until the final version: the blank line is removed, the text reflows due a layout change and now the blank line is needed again. More additional work and good possibility to a misplaced subhead.</p>
      <p>Second question occurs when the subhead is the first line of a column or box. The baseline shift will cause the subhead to be above the other first lines. And if you don't shift the baseline, the subhead will become different from the others, very near to text body.</p>
      <p>If you keep a blank first line just to put the subhead some points above baseline, the problem about different first lines remains.</p>
      <p>Vertical alignment is not suitable for this job? Every time I can use it nowadays, I prefer over the grid-based layout.</p>
