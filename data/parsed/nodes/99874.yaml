    <p>Here's another design I'm currently working on. Brand new <a>Binary Design</a> Soldiers font. I'm having fun with this one even though from a professional typographer's view they might look lame. Not sure yet how well it transcribed into b&amp;w only (every letter is a little pixel fellow). A bit kitschy but I guess I find them charming that way.</p>
