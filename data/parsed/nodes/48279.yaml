  html: |-
    <p>I’m looking for suggestions on what would be the most readable typeface for body copy on a design oriented blog my friend and I are working on. Obviously, going to need to be something users from different operating systems are able to see, and as of now would like to keep it around 10 or 11 points.</p>
    <p>Basically, it’s a blog on Wordpress by and for student designers, and we’re about to pay so we can edit the CSS. The current template we’re using has Arial strung across it, and I can no longer take it.</p>
    <p>So, body copy suggestion that will work at 10 or11 points? I’ve been going through the fonts on my computer and have some in mind, but am looking for some other thoughts.</p>
