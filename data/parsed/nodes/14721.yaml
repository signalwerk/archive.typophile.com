    html: |-
      <p>I found out that yes, he was correct! OSX will take that set of data seriously, and if you say the Ascender value is 663, and you are on the money with your outlines ( pixel perfect) in terms of height and that is that is say 693em, the render engine will make it look (at 12 or 13 pts) like you are overshooting 693 by 30em even though you are technically bang on the pixel! If you fix it so the Ascender value is correct that smudge at the top of your ascender goes away.</p>
      <p>This also means that (in the reverse of what I did, but more normally) you can tweak your ascender value to make a clearer screen render in OSX even if your font does not match a pixel perfect height for a particular pixel res pt size in it’s ascender outlines.</p>
      <p>Windows uses hints instead.</p>
      <p>Both cases involved TT fonts - I haven’t checked the PS Type 1 font to see if it is true there too. I suspect it is. </p>
      <p>Later on I will have to write to this fellow again &amp; ask if there is a paper of FAQ on the OSX render engine &amp; font design so I can design with it’s features in mind. If I find it helpful would you like to know about it as well?</p>
      <p>If this is confusing to folks, I can post images later.</p>
    html_clean: |-
