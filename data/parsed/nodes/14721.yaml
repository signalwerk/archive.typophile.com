      <p>Eben,</p>
      <p>For maximum distribution through foundries, I’d probably shoot for FontFont or Linotype.  And if you’d want you font integrated into an OS you could always talk to Simon Daniels or John Hudson for Windows; not sure who to talk to for other OS’s.  If I recall correctly there’s already a new monospaced typeface created for Longhorn/Vista so that might be a tough sell.</p>
      <p>If you don’t care about making money on the font you could talk to the people distributing different Linux versions, they’d probably be happy to have an extra typeface, and it could lead to commisions. [This might be bad advice with all the talk on free fonts.]</p>
      <p>Another option would be to talk to software companies and see if they would want to license the typeface for any of their products (programming related).</p>
      <p>I’ll shoot you an e-mail, thanks!</p>
