  html: |-
    <p>Some context: </p>
    <p>I am using FL 4.6 on a Mac 15” laptop</p>
    <p>I am working on a monospaced font that is meant to look good in hinted b/w on PC, in anti-aliased mode on PC &amp; in Anti-alised mode on a mac running OSX. My primary target size is 10pt PC / 13 pt mac. </p>
    <p>I would like to see good results outside of this ( in 9pc/12mac for instance ) but I want 10/13 to be as crisp as possible on screen. </p>
    <p>When I am hinting my font and I look at it in the hinting window I get boxes that are there to tell me where the pixels will be at a particular pt. size. 12 pt, 13 pt etc. When I set my glyph’s width metrics to match a multiple this of this size, and match my vertical stems to these (77em); I seem to get an good horizontal pixel match on screen at that size. Which is great. </p>
    <p>*But* the vertical match is not good - eg I don’t get exact pixel matching by the 4th pixel or so. The 5th one is about 1/2 of a pixel off.</p>
    <p>So, could it be the 13 pt interacting with the 1000 em square?</p>
    <p>Maybe : Here is the math </p>
    <p>The Grid I am using is 77em units in a 1000 em sq. The 77 comes from dividing the 1000 by 13 &amp; rounding up to the whole number em…</p>
    <p>Note: 76.92 would be the exact # ideally I guess, but that isn’t possible in FL or with fonts… </p>
    <p>So back to the discrepancy: The difference left over each time is 0.08 em units, which gives me 0.32 units in 4 pixels or 1/3 of 1 em unit difference. Should this make a big difference? I don’t think so because 1/3 of an em is 100x less than 33em units+ difference which is what I seem to see.</p>
    <p>So I don’t really think so. </p>
    <p>Am I figuring this wrong? If not, … What else could it be?</p>
    <p>Is this an LCD screen difference? eg Are my pixels not square? I think they are square &amp; maybe there is another explanation. </p>
    <p>I am pretty sure the pixel boxes generated when hinting based on 72dpi on the Mac version of Fontlab. In which case, hinting at 13 pt in the dialog would give me what I would see at 10 pt. on a PC </p>
    <p>This seems to have been bourne out nicely in my testing.</p>
    <p>Any other ideas?</p>
    <p>Also, has anyone changed the hinting grid on Mac Font Lab to reflect a 96 dpi ( or other setting ) ?</p>
    <p>Sorry about the hairball of questions. They seem inter-dependent to me &amp; won’t comb out!</p>
