  html: <p>Looking for three fonts to use for wedding invitations…one for a monogram, second for caligraphy and third for body text. The wedding is “elegantly formal, but modern”. Wedding takes place in a renovated opera/film house, overall design will employ swashes with a sort of parisian feel to it. Here’s a link to the site itself, because it’s really what the invitation will evolve from <a href="http://www.shomler.com/calsj/index.htm">http://www.shomler.com/calsj/index.htm</a></p>
