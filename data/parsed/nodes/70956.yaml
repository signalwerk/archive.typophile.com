  html: |-
    <p>On Danish medical prescriptions you will find # and Rp. written before the description of the prescribed drugs.<br>
    # RP. is a message from the doctor to the pharmacy. # is a double cross and short for "in nomine dei", while Rp. is short for "recipe".<br>
    In other words: In God's name take... (the prescribed drugs).<br>
    Now I am just wondering: is this just a local Danish use of the crosshatch, or do you know of similiar uses elsewhere?</p>
