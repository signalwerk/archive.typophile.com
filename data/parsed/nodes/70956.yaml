    html: |-
      <p>Is this an old, traditional convention or still practised today? I have not encountered that usage of the # sign (0023) so far. </p>
      <p>Apart from the typical meaning “number” my records reveal few other connotations, from more specific contexts:</p>
      <p>monetary: # Dukaten<br>
      phonology: # word boundary<br>
      mathematics: # equal and parallel (22D5)</p>
      <p>A similar technical sign is encoded as 2317; another common usage is on telephone keycaps.</p>
      <p>… and in music of course, though there it gets typically rendered rather vertically slanted (266F).</p>
