    <p><strong><a href="/wiki" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-lost">TypoWiki</a>&nbsp;: <a href="/node/12270/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Typefaces</a>&nbsp;: Proxima&nbsp;Nova</strong></p>
    <p>Designed by <a href="/node/15527/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Mark Simonson</a> in 2005, Proxima Nova is a complete reworking of his <a href="/node/add/wiki?edit%5Btitle%5D=Proxima%20Sans" title="Create node &quot;Proxima Sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Proxima Sans</a> from 1994. The original six fonts (three weights with italics) have been expanded to 42 full-featured <a href="/node/12420/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">OpenType</a> fonts. Proxima Nova straddles the gap between typefaces like <a href="/node/12494/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Futura</a> and <a href="/node/17655/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Akzidenz Grotesk</a>. The result is a hybrid combining <a href="/node/add/wiki?edit%5Btitle%5D=humanistic" title="Create node &quot;humanistic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">humanistic</a> proportions with a somewhat <a href="/node/add/wiki?edit%5Btitle%5D=geometric" title="Create node &quot;geometric&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">geometric</a> appearance.</p>
