    <p><strong><a href="/wiki" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypoWiki</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Proxima&nbsp;Nova</strong></p>
    <p>Designed by <a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a> in 2005, Proxima Nova is a complete reworking of his <a href="/node/add/wiki?edit%5Btitle%5D=Proxima%20Sans" title="Create node &quot;Proxima Sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Proxima Sans</a> from 1994. The original six fonts (three weights with italics) have been expanded to 42 full-featured <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> fonts. Proxima Nova straddles the gap between typefaces like <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a> and <a href="/node/17655" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akzidenz Grotesk</a>. The result is a hybrid combining <a href="/node/add/wiki?edit%5Btitle%5D=humanistic" title="Create node &quot;humanistic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">humanistic</a> proportions with a somewhat <a href="/node/add/wiki?edit%5Btitle%5D=geometric" title="Create node &quot;geometric&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">geometric</a> appearance.</p>
    <p><strong>On Typophile</strong><br><a href="/node/101278">Ideas for book body text paired with Proxima&nbsp;Nova</a></p>
