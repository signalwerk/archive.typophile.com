    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Proxima Nova</strong></p>
    <p>Designed by <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a> in 2005, Proxima Nova is a complete reworking of his Proxima Sans from 1994. The original six fonts (three weights with italics) have been expanded to 42 full-featured <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts. Proxima Nova straddles the gap between typefaces like <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> and <a href="/wiki/Akzidenz%20Grotesk" class="freelinking" rel="nofollow">Akzidenz Grotesk</a>. The result is a hybrid combining <a href="/wiki/humanistic" class="freelinking" rel="nofollow">humanistic</a> proportions with a somewhat <a href="/wiki/geometric" class="freelinking" rel="nofollow">geometric</a> appearance.</p>
