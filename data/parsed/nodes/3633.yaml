    html: <p>Just as a follow up I took my own suggestion and wrote to House Industries.  A person wrote back and told me that they think their fonts are properly priced and that less than $5 per font in that collection is a very reasonable price. She said that they do not, however, sell individual fonts.  <br> <br>So when you see a House font you like, remember, it's the whole collection/family or nothing when you buy them. <br> <br>I gave them my opinon that was only a good deal for someone who wants to use all the fonts, but I suppose it is just another marketing strategy as you talked about in another thread today with the Lineto fonts.</p>
