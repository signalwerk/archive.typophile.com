    html: <p>Or there are a ton of freeware fonts like this, because handwritten sloppy fonts are the easiest things to create, as Stephen suggested. That Part of the Script Guide I mentioned shows many freeware fonts included in with the commercial ones. I always try to show only original fonts where I know who designed them (anything else is listed under Alias Names). <br> <br>You might also try writing to House and seeing if they would sell individual fonts.</p>
