    html: "<p>Yves, don't forget the t-shirt that comes with the $250 set! <br> <br>Weren't the fonts in House's General Collection originally available individually, or at least in smaller sets? I do think $250 is way too much for the set -- at best you're probably going to only use any five of the fonts, and probably not too often at that, so practically it's more like $50 a font, and that's not a very good deal. I just bought* Neutraface, and at $199 for one huge family I think I got a much better deal than I would have had I bought* the General Collection, even though I'd have gotten a t-shirt as well. <br> <br>At least with the other sets, there's more of a theme to them (so you're likely to use a majority of the fonts in the set), as well as a more limited number of fonts per set so the price is more reasonable. <br> <br>The other thing is that back when the fonts in the General Collection were new, House was one of the few small foundries that were becoming more widely known, so well-made quirky fonts like these were much more rare. Now that the market is more or less flooded with them, having them available only as an expensive set seems bad for business. With Rich Roat jokingly complaining over at Typographica that making their new book put them in the poorhouse, as it were, someone might impress upon him the good business sense of offering individual faces at $20-30 a pop. <br> <br>Just sayin'. <br> <br>(Oh, and Seksay: don't do it, baby -- it's the first step on the road to hell.) <br> <br> <br> <br>*bought an overly restrictive license to use, that is. <br> <br></p>"
