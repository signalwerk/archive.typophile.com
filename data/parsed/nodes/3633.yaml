    html: <p>Mike F., <br> <br>Their letter didn't sound arrogant to me. It was polite and brief.  <br> <br><i>Sorry, we do sell individual fonts. A lot of work goes into the making of quality fonts so we believe our prices are fair. At $250 for the collection, and 51 fonts plus clip art, each font in the General Collection comes to less than $5. <br>Best, <br>Lynn</i> <br> <br>I think it's funny, almost Freudian, that she omitted the word 'not' in the first sentence. Clearly it was supposed to be there, from the rest of  the remarks. <br> <br>For Seksay,  <br> <br>Even if what you are planning to use this font for is <i>strictly</i> for your own use, I agree with the other comments made advising you against illegal copying of the fonts.  You have a better chance to be caught if it's used for commercial purposes, but it's unethical no matter how you rationalize it, in my opinion.</p>
