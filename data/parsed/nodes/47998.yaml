    <p>Here are my observations on WPF ClearType tuning on a lowly 96 dpi LG LCD fitted to a Compaq V5000 laptop running XP SP3. Before diving in, note that my observations are NOT relevant to ClearType for GDI, which is what the Control Panel applet tweaks!</p>
    <p>I relied on two WPF applications to test the various settings: Expression Design 2, and XamlPadX v3 using FlowDocumentPageViewer. Design 2 has a default white on black menu, which was a good torture test for legibility. I tried the surfaces (i.e. drawing areas) of these two apps with various C-series fonts and Segoe UI, but I couldn't get them to look exactly the same even using the same font, point size and zoom level. It seems that Design 2 doesn't use WPF's ClearType setting for its drawing surface. [BTW, Expression Web 2 seemed to ignore <em>all</em> WPF ClearType registry setting (perhaps it has its own??), so I couldn't test anything with it. Also Web 2 didn't show Segoe UI in its fonts list (bug?).] My sad conclusion after all this is that the only WPF app for which ClearType can be reliably tweaked is XamlPadX, which isn't exactly a production tool... In any case, on with the show:</p>
    <p>0) In contrast with GDI ClearType, there is no tool that I know of for changing WPF ClearType settings. I used the registry editor. The values I'm discussing are all decimal; make sure you don't enter them as hex in regedit (which is the default input mode). The reference on the registry entries is: <a href="http://msdn.microsoft.com/en-us/library/aa970267.aspx" title="http://msdn.microsoft.com/en-us/library/aa970267.aspx">http://msdn.microsoft.com/en-us/library/aa970267.aspx</a></p>
    <p>1) Unlike the GDI ClearType registry changes, which takes effect instantly on all GDI applications, the WPF ClearType registry tweaks require the WPF application(s) to be be restarted for changes to take effect.</p>
    <p>2) There are no default WPF ClearType registry entries, and contrary to what MSDN claims, the settings for the GDI ClearType were NOT used as default for WPF applications. Instead some built-in defaults seem to be used.</p>
    <p>3) Color fringes, perhaps the most annoying "feature" of ClearType, can (finally) be controlled for WPF apps by changing the GammaLevel setting. This setting doesn't affect the monitor gamma in any way, but only changes what WPF ClearType /thinks/ the gamma is. MSDN recommends that you match this with your actual monitor gamma. My experience is that the higher the setting, the better reduction of color fringes is. IMO 2200 (decimal), which is the max setting, seems optimal.</p>
    <p>4) The general level of glyph anti-aliasing seems to be controlled by the ClearTypeLevel setting. The best seemed the max value - 100 (which seems the default).</p>
    <p>5) There's another registry setting that counterbalances glyph aliasing: TextContrastLevel. This controls how thick the stems remain even after applying the anti-aliasing. The default is 1, which is okay at 12 point, but makes the menus hard to read. Lowering this to 0 was significantly better for white on black menus, but made black on white text a bit harder to read.</p>
    <p>6) The PixelStructure controls the order of sub-pixels. 0 means no sub-pixel rendering, 1, which looked best to me, means RGB order, 2=BGR. Beware that the default is 0! My Design 2's menu was really foggy with 0, which is what motivated me to investigate this whole matter. Also, don't worry much about getting your sub-pixel order wrong because at the wrong setting white text looks rainbow colored, so it's easily spotted.</p>
    <p>That's it. To recap, the best settings for me were PixelStructure=1, TextContrastLevel=0 (1 is okay too), ClearTypeLevel=100, GammaLevel=2200. I'd be glad to hear your comments on this.</p>
