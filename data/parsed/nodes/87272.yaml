    <p>Hey guys,<br>
    I'm currently doing a project which is to redesign a rather old book (re-arranging the layout, and providing various illustrations into the pages). The theme of the book is about French wine, and the visual concept took its inspirations from the richness and the earthiness the rustic winemaking villages across France. The book is novel-like with continuous text, will use manuscript grip system, and the pages are about 14.7 X 23.8 cm in size.</p>
    <p>After examining dozens of Garalde serifs that I'm going to use for body text, I narrowed down my selections into two major candidates. Janson Text and Linotype Granjon:</p>
    <p><a href="http://i297.photobucket.com/albums/mm224/shinnggo/Compare.jpg" title="http://i297.photobucket.com/albums/mm224/shinnggo/Compare.jpg">http://i297.photobucket.com/albums/mm224/shinnggo/Compare.jpg</a></p>
    <p>My concerns are:</p>
    <p>1. I think Janson Text looks more rustic but looks pretty similar with the typeface used in the original book, which is  <a class="freelinking external" href="http://i297.photobucket.com/albums/mm224/shinnggo/Bodytext.jpg" rel="nofollow">American Garamond</a></p>
    <p>2. I think Granjon looks lovely, but I'm worried it's gonna be too refined and bit anemic.</p>
    <p>In you opinion, which one looks better?<br>
    Thanks in advance.</p>
