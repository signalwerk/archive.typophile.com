    html: |-
      <p>The only thing I would offer about the original poster's question is to recommend that he look at offset printed examples, and not rely only on the screen. </p>
      <p>Caslon is obviously in the line of Griffo-Garamond, and an old style, as Nick mentions. It also has some significant differences, as John notes. Whether to classify it as a separate category or as a variation seems to me somewhat arbitrary, and dependent on the purpose of the classification. I haven't studied the various "Dutch" and French faces from the previous century, the 17th century, so I don't know how much they share with Caslon. </p>
      <p>I'd heard it said that the "goût Hollandaise" came from the Dutch being accustomed to black letter. Thus the Dutch roman types tend to be a bit blacker with shorter extenders. The aesthetic of Caslon is obviously different from Garamond, with Garmond being more delicate and elegant, and Caslon having a more robust, feet-on-the-ground feeling. </p>
      <p>Bringhurst points out that "Baroque" faces, which is where he puts Caslon, have more variation in stress (mixing oblique and vertical stress), and are still more modeled and less calligraphic than Garamond. I think the latter is particularly important. I see in Nick's comparison lines that my Caslon is generally a bit narrower than Adobe Garamond.   My proportions are pretty true to Caslon's Pica 2, and to me the somewhat narrower proportions is an important characteristic also. I should also confess, for clarity in this discussion, that I think Caslon's g's are ugly, so I drew a shape that looks more agreeable to my eyes. It is closer to Garamond than Caslon's own letter g is.</p>
