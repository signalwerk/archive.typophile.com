    html: |-
      <p>The underlying reasoning is that 'i' "ee" and 'ı' "ih" are two different characters. Capitalizing and small-capitalizing in a Western locale loses the dot, which makes it a different character in Turkish.</p>
      <p>You don't really need an "i.dot" glyph (as dotted equivalent of "dotlessi"), you can use the regular latin 'i' for that. So the translation you specify is not necessary.</p>
      <p>The only caveat is, for Turkish you should translate "i" to "idotaccent.sc" for small caps, and "i" to "Idotaccent" for capitals. The dotless 'i' can be converted to a 'regular' small cap I and capital I, for any locale, so it doesn't need a localized handling.</p>
      <p>You <em>will</em> get bonus points if you weed out the ligatures containing an "i" for Turkish, such as "fi" and "ffi" :-) (As a side note, your translation of 'i' to 'i.dot' may rule out that lookup; but I still think it makes life more complicated, instead of less.)</p>
