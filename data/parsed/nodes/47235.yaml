    html: |-
      <p>Goran, your approach is good, but there are some issues,</p>
      <p>1. <code>languagesystem dflt dflt;</code> is incorrect.<br>
      It should be <code>languagesystem&nbsp;DFLT&nbsp;dflt;</code></p>
      <p>2. If you want to be thorough, you can include other languages that need the same treatment such as Azeri (AZE) and Crimean Tatar (CRT).</p>
      <p>3. You can actually remove the substitution<br>
      <code>sub&nbsp;i.small&nbsp;by&nbsp;idotaccent.small;</code><br>
      from the 'locl' feature. The reasoning for this is, the glyph 'i.small' won't be in the glyph stream until 'smcp' is applied. Since 'locl' comes before 'smcp' (and assuming that the text engine will do the right thing which is apply the lookups in the order they appear in the font), at the time 'locl' is applied the glyph 'i.small' won't be available as input.<br>
      In any case, don't forget to include the following substitution in 'smcp',<br>
      <code>sub i.dot by idotaccent.small;</code></p>
      <p>4. <code>idotaccent.small</code> is not a good name because 'idotaccent' is not a standard name. ('Idotaccent' is, but that's different). You need to call it something like 'i.dotsmall'.</p>
