    <p>Could anyone tell me if this is a correct way to handle the turkish i problem.</p>
    <p>I put the locl feature on top so it overrides everything.</p>
    <p>I font know the language really, but tried to make some sense out of it.</p>
    <p>The glyph "i.dot" is a copy of i.</p>
    <p>Thanks in advance!</p>
