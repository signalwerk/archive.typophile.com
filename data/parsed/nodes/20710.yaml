      <p>Hi Chris. This chunky stuff is fun. But your using circular and losange counters is giving some of the characters major 'color' problems. </p>
      <p>The 'e' is an example, where the 'beak' is too heavy. Would giving it a diagonal cross bar or chopping off the point at an angle make the circular counter work better? Also the diagonal characters at the open ends. Also the D. The numbers work quite well as is.  </p>
      <p>I suspect that 'cheating' on circles and losanges, like you did with the K, might be the only way to overcome the color problems.  Or maybe you could introduce a third shape or more shapes in the counters. Eg, in the diagonal letters keep the semi-circle at the join, but open up the 'v' at the ends of the diagonals.</p>
