  html: |-
    <p>I started another display sans out of need for something bolder than average. This is the Alter Ego version. Some might say the round holes are counterproductive but I kind of like the black hole effect. There will be a tamer version, the Ego version, to follow.<br>
    There is Latin, CE, Greek, and Cyrillic with small caps, small numbers, nums, denom, sups, and infs in the figure arena.</p>
    <p>Here is the first cut:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/boulder-alt_4549.png"></div><p></p>
    <p>ChrisL</p>
