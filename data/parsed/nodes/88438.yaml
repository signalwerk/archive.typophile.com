      <p><em>I think is the other way around: the Cancellaresca was based on the italics cut by Griffo. The first italic script was invented by Ludovico Vicentino de'll Arrighi, and published in the Operina, around 1527....</em></p>
      <p>Arrighi's cancellaresca represents a formalisation of the humanist cursive hand. It's accurate to suggest that this was in response to the typographic italic, part of the flowering of fine writing in reaction to print publishing that occurred in the 16th Century in Italy and elsewhere, but incorrect to say that 'the first italic script' was invented by Arrighi and based on the Griffo italic types. Griffo's italic types -- and the Aldine pocket editions for which they were cut -- were inspired by contemporary informal copy books, written in the style classified by Michelle P. Brown as <em>littera humanistica corsiva libraria.</em> The specimen shown in Brown's book, <em>A guide to western historical scripts from antiquity to 1600,</em> is from 1483. Examples in the catalogue <em>Rome Reborn</em> are dated to the third quarter of the 15th Century.</p>
      <p>What Arrighi and the other writing masters of the 16th Century do is to take what had been a quickly written scholars' hand, relatively messy and inconsistent -- characteristics reflected in Griffo's types -- and restyle it as an elegant secretarial hand. As I say, this is part of the scribal reaction to print publishing: losing the copyist market to type, they improve the quality of their product, making writing a luxury item instead of a commodity. Arrighi then, in turn, translates his improved italic hand into type, and other printers base their italics on the hands of particular writing masters. [Mardersteig makes a convincing case, for example, that Marcolini's italic types are based on models provided by Francesco Alunno, probably the greatest calligrapher of his time.]</p>
