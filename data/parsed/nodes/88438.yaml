      <p>Hello Yves,<br>
      The Civilté type you mentioned is surely a crucial point in the development of modern script types; it is highly influent on the 'ronde' (or 'financière') and other 'French' scripts popular well into the last century (they are usually upright, bearing some gothic component and suggesting the use of a rigid, truncated pen).<br>
      The work of Pierre Moreau, from the 1640s, is another milestone: it shows the influence of his contemporary calligraphic (and typographic) styles, namely the changes in the way the pen is cut (informed by Cresci) and the delicate thin strokes related to copperplate engraving; Moreau's hand is slow, round, 'engraved'. The so-called 'copperplate' or 'English' style (it will dominate the field of formal scripts up until no long ago) descends from that path, notably taking its mature shape in the hands of Thomas Cottrell, in the 1770s; according to Morison the same derivation applies to most of the other so-called 'round hands'.<br>
      Another notable fact is the introduction in the US of the 'circular scripts', in the second half of the 19th Century, some of whose reach a degree of informality never seen before (and hardly later, until Excoffon times). I think formality is the key to understand, analyze and describe script typefaces; this becomes more and more true from the 1930s, (the decade when the most exciting things happen in the field, in my opinion).<br>
      This is a bit of a quick comment, please get in touch if you need reference texts or anything else: I'm happy to help, if I can; and do forgive my Italo-English.<br>
      Best,<br>
      Riccardo</p>
