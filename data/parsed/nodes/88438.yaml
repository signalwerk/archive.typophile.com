  html: |-
    <p>I have been invited to do a presentation about digital handwriting and calligraphy in three months. For this I would like to retrace the evolution of the reproduction of scripts in type, from the earliest days of metal type to feature-rich OpenType scripts. As I don't have any academic background in typography I would like to fact-check the earliest examples of scripts in metal type. I am not looking to be exhaustive, but want to have the key moments down.</p>
    <p>Johannes Gutenberg (c. 1398–1468) &gt; first textur type, based on blackletter handwriting (c. 1450–55)</p>
    <p>Aldus Manutius (1449–1515)/Francesco Griffo (1450–1518) &gt; first italic type, based on cancellaresca handwriting</p>
    <p>Robert Granjon (1513–1589) &gt; Civilité (1557), script with spectacular kerns</p>
    <p>What are the other key moments/scripts between the 16th century and the 20th? From the 20th century on I will only focus on scripts that are designed to look like (connected) handwriting, because this has to lead me to OpenType features that help simulate this.</p>
    <p>Mistral, ingenious connected script (Roger Excoffon, 1953)</p>
    <p>What are the first examples in metal type of formal calligraphic penmanship, like the <a href="http://www.fontshop.com/fontlist/genres/copperplate_scripts/" rel="nofollow">copperplate-style scripts</a>?</p>
