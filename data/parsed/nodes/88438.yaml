      <p>Hi Yves,</p>
      <p>"Aldus Manutius (1449–1515)/Francesco Griffo (1450–1518) &gt; first italic type, based on cancellaresca handwriting"</p>
      <p>I think is the other way around: the Cancellaresca was based on the italics cut by Grifo. The first italic script was invented by Ludovico Vicentino de'll Arrighi, and published in the Operina, around 1527, also known as "humanistica cursiva" and later, in several countries like Spain and Portugal, was also known as Bastarda (bastard) because it was a deviation from its original (Grifo).</p>
      <p>Hope this help.<br>
      Best,<br>
      Dino</p>
