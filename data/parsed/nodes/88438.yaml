    html: |-
      <p>These may not quite fit your category, but some typewriters were permanently configured with script. In addition, most later typewriters with interchangeable elements had script elements available. These included IBM and Smith-Corona type balls and the many printing terminals and desk printers that had type wheels.</p>
      <p>Somewhere I have an envelope with separate elements that replaced (or went over) a typewriter's hammer-style elements.  While mine aren't script, I have little doubt that they would have been offered.</p>
      <p> - Herb</p>
