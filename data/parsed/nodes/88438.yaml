      Basically the body was not slanted (it was rectangular, but much narrower than the glyph width) but they put massive slanting supports for the kerns to avoid breakage. Expensive stuff. BTW this font was called Excelsior IIRC; I once used it to make sarcastic letterpress cards that said "Don't Mention It / PLEASE*", which you're supposed to send in response to those pretentious "Thank You" cards... :-)  I donated a pack of ten to the TypeCon-SF auction. Anyway, as you were.<p></p>
      <p>* The "PLEASE" set in a narrow grot, smaller.</p>
      <p>hhp</p>
