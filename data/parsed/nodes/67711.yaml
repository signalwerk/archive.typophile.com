    html: |-
      <p>Mentioned Ratbaggys idea to the client but he didn't really go for it. Made a quick sketch with the microphone and AH as wings but I didn't really catch my fancy. I think I would have to draw it in more of a 3D view for it to work and that's not really where we want to go.</p>
      <p>If it looks like it's for a lation rapper, that's not such a bad thing. Kinda that style we're going for but more rock 'n roll. Showed it to some friends as did the client and they didn't connect the logo with a TV preacher, not even after I mentioned it, I guess that's because that phenomena doesn't really exist in Finland or any of the Scandinavian countries. Here religion is still pretty old fashion. It's a concern but I don't think many Finns will make that connection.</p>
      <p>The "sticker on a suitcase" is more of the direction I want. That's the plan as well to make stickers that he can put up where ever he has a gig.</p>
      <p>I've made some changes to it though.</p>
      <p>He also wanted the logo to portray how his performance evolves or changes, going from nice to angry/critical. So I've split the logo in to parts and added a distressed feeling to one side.</p>
      <p>Figured the orange colour might be too "nice" so I've tried using red instead.</p>
      <p>Any feedback appreciated, thanks.<br>
      Peter</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/anders_logo_v3_3611.5.jpg"></div><p></p>
