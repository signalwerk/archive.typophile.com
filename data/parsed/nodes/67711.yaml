    <p>Hello,</p>
    <p>I'm doing a logo for a stand-up comedian 'Anders Helenius'. Been struggling with this one, tried various concepts without any result but now I think I have something that will work.</p>
    <p>A smile and "vibrating/shaking" text. I'm designing the website as well and we're going for a "street" feeling so I'd like to convey the same message for the logo, bold and rough. This is the first version with my new concept. It might have a bit of a "wild west" feel to it.</p>
    <p>Any feedback appreciated<br>
    peter</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/anders_logo_v2_6340.jpg"></div><p></p>
