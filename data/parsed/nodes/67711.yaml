    user: 17519
    date: 2010-03-14T16:48:00
    date_raw: 14 Mar 2010 — 4:48pm
    votes: null
    html: |-
      <p>Distressing works fine in one colour. And for a solid colour I'll probably just split it in the middle so that the two sides are obvious. I will increase the distressed part so that it is more obvious in smaller sizes.</p>
      <p>Might not even make it one colour at all. This will have a fairly limited usage area and to provide a one colour version might not even be necessary. Or make it so that that only the solid colour version has a line through the middle of the microphone.</p>
      <p>Have to check with the client what he wants but everything that he controls the layout of can just use the colour version. This one is also going to have some limitations on what backgrounds it can be used against since there can't be a inverted colour version.</p>
      <p>You can have a grayscale version and maybe a semi transparent version instead of a full solid colour. That might work in colour as well, put the right side at 50% for example and then in red or something, then it will appear as it is two colours even if it's not, depending on the background. That might actually be kinda cool. Gonna try it and see how it looks.</p>
      <p>thanks, peter.</p>
