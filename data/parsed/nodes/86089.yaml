    html: <p>It says »Character recognition«  at the top. Looks like an OCR system for figures. There are 12 sensors and 3 conditions (1 Ziffer wird geschnitten – figure is crossed, 2 Ziffer wird nicht geschnitten –&nbsp;figure is not crossed, 3 Sonde is unbrauchbar für Erkennung dieser Ziffer –&nbsp;sensor is not suitable to recognize this figure.)</p>
