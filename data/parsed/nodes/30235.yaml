      <p>&gt; <em>I am a design student</em></p>
      <p>To my students interested in this subject I always recommend two nice pieces by John Berry, written for creativepro.com: <a href="http://www.creativepro.com/story/feature/8656.html" target="_blank"><em>The Justification for Hyphenation</em></a> and <a href="http://www.creativepro.com/story/feature/8868.html?origin=story" target="_blank"><em>The Hyphenation of Justification</em></a>. Read them, they are pretty good. And try to make your client read them. Of course, I am not sure that reading those short essays could change her mind, but it never hurts to try, no?</p>
      <p>My own take on this issue is fairly simple: hyphenation is beneficial for the readability of the body text (justified <em>and</em> FLRR), and a no-no in display typography.</p>
