      <p>Except in newspapers, hyphenating proper nouns in English is severely frowned upon (Chicago, APA, etc.) anyway: papers “get away” with it because of the narrow columns.</p>
      <p><em>I also prefer to have an hypentated verb, adverb or noun rather than an article, pronoun, conjunction or preposition....</em></p>
      <p>Um, well it’s hard enough to find to find an article, pronoun, conjunction or preposition in English or French that is even hyphenate-able.  (“L-e”?  “Sh-e”? “E-t”? “T-o”?  C’mon!)  </p>
      <p>There are lots of reasons to have rough rags, but I wouldn’t say that the majority come from “careless typesetting.”  “Ignorant typesetting,” maybe.  :-P</p>
      <p>There’s a difference....</p>
      <p>(This from someone who spends her weekends finding silly hyphenation in newspapers!)</p>
