      <p>Linda I didn’t mean that I prefer hypentated nouns rather than an hypentated article. </p>
      <p>I tried to say that hypentated nouns, verbs, and adverbs (generally long words) are not disruptive when reading because they are easily predicted using syntactic information.</p>
      <p>On the other hand pronouns, conjunctions or prepositions (mostly short words) can be more disruptive when reading if they are found at the end of a line because the sense of the text breaks.</p>
      <p>Short words at the end of the lines tend to appear much more in hard rags because of the attitude commonly assumed when setting them, mostly if you think that a rag doesn’t need to be tuned. </p>
      <p>One of the most annoying things for me is to find a short word of the aforementioned kind at the end of a long line.</p>
      <p>Shit, it’s hard to be coherent on a language you have never spoken.</p>
      <p>Héctor</p>
