      <p>As a general principle, I avoid hyphenation as well (I like setting full pages in bigger text), but it <em>is</em> difficult in narrow columns.  </p>
      <p>You might want to trot out Bringhurst’s thoughts on appropriate type/column size — he does a great job of explaining the how’s and why’s — and see if you can’t reach some sort of middle ground.</p>
      <p>I’ve done this with many clients, and while not all of them sign up, many do, and most of the rest are willing to discuss it intelligently.</p>
      <p>(We won’t discuss those who won’t.... (haha) )</p>
      <p>Justification in narrow columns without hyphenation is a definite no-no....</p>
