    html: <p>I’d rather see a rag that looks like it was gouged into the page with a rusty knife than hyphenation of words with fewer than four syllables. The way I see it, a rough rag adds character to the page; just as justification once reminded the reader that someone spent hours tweaking the spacing on jobsticks to get justified type, a rough rag can be a reminder that just because the machine can make it (relatively) easy to perfectly justify type, one can turn that feature off.</p>
