      <p>What an interesting topic. As a typesetter I use to have this dilemna all the time. The rule of thumb for our shop was — if it is advertising type - then no hyphens. This held true for all Headlines - and short blurbs on back of book covers, etc. We did our best making nice Coca-Cola shaped rags...</p>
