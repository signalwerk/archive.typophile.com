      <p><em>true small caps</em></p>
      <p>I was looking at the country abbreviations, where the small caps are set at a smaller size than the adjacent roman, and jumped to the conclusion that because they are thinner, they’re faux. My mistake. </p>
      <p>I note that you are using a double-f ligature, a very proper typographic nicety. If there’s one thing that looks out of place — even though with a specific hierarchical meaning — it’s the slanted roman. However, not an issue with your readers.</p>
