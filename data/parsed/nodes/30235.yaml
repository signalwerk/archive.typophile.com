      <p>is the final verdict for the “saviour” hyphen on asthetic design or information?<br>
      The variables are immense but in the end it boils down to familiarity with the reader. Who’s reading it and are they used to hyphens, does the hyphen read confortably with the audience? of course it does. It’s everywhere and anywhere. Use it with the satisfaction of knowing that it will not hinder leagibility. What does become problamatic is extreme short lines with less than 30 characters, under 50 is scary in itself. </p>
      <p>In my personal opinion, hyphens are removed when the copy is short, sweet and for advertising purposes only... a quick scan read if you must. ( outdoor, posters, magazine ads, etc) but when it comes to brochures or copy in which the audience will be dwelving into an informatic zone than I hyphen  it!</p>
