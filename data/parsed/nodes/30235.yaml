      <p>I have to admit this made me laugh. I would tell her with a high degree of confidence that an absolute no-hyphenation rule would be seen as extreme by typographic experts. There are many books with a variety of closely related by no means identical suggestions about how to handle when &amp; how to hyphenate. What is seen as the desirable sweet spot is something that has moved over time. Still, why not show her two or three? Maybe you can agree to something if she has some postive examples to look at rather than just an idea to cling to. Also, to my (admittedly non-encyclopedic) knowlege there are no major publications use that rule either.</p>
      <p>This said, I personally think rag fear is overstated. I like a left aligned text with a light rag very much. But this sort of thing enters the realm of taste. Without seeing a sample it really is hard to say what I think. What do you mean by ’fairly short’ BTW?</p>
      <p>What do my fellow typophiles think? Could any case whatever be made for an absolutely unhyphenated treatement? In either Justified or Unjustified mode?</p>
      <p>Wait! I just though of one situation in which such a rule might make sense: A children’s book.</p>
