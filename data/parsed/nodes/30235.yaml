      <p>Nothing like a server error when you’ve just typed a lengthy comment...</p>
      <p>Anyway, I don’t have time to read 4 pages of no-doubt interesting debate on the subject except to say that well set type is readable whether justified or ragged and which you choose is a matter both of personal aesthetics and function. </p>
      <p>Justified type gives a cleaner, more formal appearance. It looks better under centered heads. Ragged type is more friendly. To a student my advice is to try both where applicable and learn how they work for you. They can both be used in the same job: for example in book design I’ll often justify the main text and use ragged for sidebars or captions to set them apart.</p>
