  html: |-
    <p>I am a design student who does freelance work as well. I do work for a client quite often that just won't let me hyphenate anything, even when the column length is fairly short, which creates an awful rag. She says it is too hard to read. Does anyone have a suggestion on how to explain to her the importance of a clean rag, or is there anyone who knows some proven statistic that hyphenated text isn't hard to read? Newspapers hyphenate all the time. What would you do in this situation?</p>
    <p>-Thomas</p>
