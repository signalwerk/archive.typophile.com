      <p>I wouldn’t look to newspapers for elegant typesetting, I have seem some pretty appalling rivers, loose lines and widows even in the paper of record (the NY Times). Setting justified type in a narrow column does create problems - but so does ragging and in a multi-column design like most papers rag right could get ugly. I notice they use rag more for opinion pieces, reviews, commentary rather than reporting.</p>
      <p>I have noticed a bias on this site against justified type which I don’t think is quite fair - in many instances it is easier to read and cleaner than rag. I am leary of anybody - designer, teacher or client - who establishes absolute “rules” to govern design. The only rule should be what works best for that particular job, given its content, purpose, constraints.</p>
      <p>You’re a student, you will learn as you continue to work that you need to pick your battles. Some things are worth going to the mat for, others not. Which is not to say that you shouldn’t want each job to look as good as it can. But not every job will end up in your portfolio and maybe your time is better spent looking for new clients than arguing hyphenation with the one you already have. Sometimes a client just wants to piss on a job too, and you have to let them. They feel like they aren’t getting their money’s worth if they don’t put you thru your paces. Decide what you can and will concede and what you will fight for.</p>
    html_clean: |-
