    <p>Can anyone help with the fonts used for this book featuring Mary Blair’s art?<br>
    I’m particulary interested in the type used on the “Retold by”/”Pictures by” credit and the names “Jon Scieszka”/”Mary Blair”, in addition to the title. Also i think the book text in the second pic is Minion Pro - can anyone confirm?</p>
    <p>Thanks in advance.</p>
