    html: |-
      <p>First of all, thanks everyone for your comments, it's great to get some feedback...<br>
      In response to some of the posts:</p>
      <p>Dan: It does have a meaning behind it, but I think your right and it may be far to obscure and overly subtle. The four pieces coming together are supposed to represent wolfs, the three lines as claw-marks in the shape of a wolf's front leg. Also the star in the negative space relates to the Lupus (the wolf) constellation.</p>
      <p>Others: I think you are right the type could probably exist without the mark, and i am looking at going down this road, although I am very attached to that symbol :).</p>
      <p>Another point(probably why I'm finding this logo difficult to resolve) is that it's for a personal business venture.</p>
      <p>Again cheers for your feedback.</p>
