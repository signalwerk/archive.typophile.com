    <p>I'm a high school teacher in Ohio, and I'm trying to put together a customized practice test that looks as much as possible like the real Ohio Graduation Test. Naturally, that means matching the typeface! I've been using Trebuchet MS as a stopgap and it's an OK match, but I'd like to find the real thing.</p>
    <p>I've attached a sample image, but there's also as much as you could ever care to see on the Ohio department of education's website. They have several old tests posted:</p>
    <p><a href="http://www.ode.state.oh.us/GD/Templates/Pages/ODE/ODEDetail.aspx?page=3&amp;TopicRelationID=1070&amp;ContentID=7835&amp;Content=107293" title="http://www.ode.state.oh.us/GD/Templates/Pages/ODE/ODEDetail.aspx?page=3&amp;TopicRelationID=1070&amp;ContentID=7835&amp;Content=107293">http://www.ode.state.oh.us/GD/Templates/Pages/ODE/ODEDetail.aspx?page=3&amp;...</a></p>
    <p>I hope somebody can help me out!</p>
    <p>--Steve-o</p>
