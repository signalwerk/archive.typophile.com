      <p>It’s not Bernhard Gothic, but most likely a knockoff. The BG medium ’M’ has slant stems,  and the ’A’ in the sample matches the lighter weight, not the medium. Some of the letters also appear to be slightly extended like the ’C’ which isn’t round as in BG.</p>
      <p>George</p>
      <p>I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
