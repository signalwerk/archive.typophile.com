      <p>I really like this. </p>
      <p>/g/ and /y/ are quite off-kilter. They jump out to me, but at the same time they also pleasingly reinforce the bounciness of the font.</p>
      <p>I don't think the /a/ extended intersection works as well as /e/'s.</p>
      <p>/M/ looks weak to me in the upper left.</p>
      <p>I wonder if there's a way around the almost-crash of "Fu" (in "full character set"). I can imagine the low-hanging serif of /T/ posing a similar problem. </p>
      <p>The subtle swellings of the lines are attractive.</p>
      <p>Charming stuff!</p>
