    <p>I just released Tempest, a headline serif font in MyFonts, but while I worked on that, I wanted to make a more playful, whimsical little brother for it. </p>
    <p>Some glyphs still need work, and kerning is just in it's infancy, but you get a feel for the font here:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Tournedot_4074.png"></div><p></p>
    <p>I'm thinking of making some alternate glyphs; a and g are done already. I used them on the pdf, so you can see them there.</p>
    <p>I started with a serif design, but veered off pretty quick; Tournedot needed something different, so I turned it into a semi sans with pretty galligraphic tones going on with V, v, W, w, A, M and so on.</p>
    <p>What do you think?</p>
