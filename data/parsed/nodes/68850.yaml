    date_raw: 3 Apr 2010 — 8:40pm
    votes: null
    html: |-
      <p>This is a lot of fun, and clearly very refined. I love the /g/.</p>
      <p>I think the single-story /a/ works better than the double, but part of that is because the double is too narrow by just a bit. Come to that, the /s/ might need widened a tad as well... Like Eliason, I'm not sure if the extended intersection is working super well on the /a/ but it's not bad.</p>
      <p>/i/ and /r/ seem very slightly heavier than the rest. I think it's that they don't have the same stroke variance as some of the other characters. I'm looking at them amid /n/s and /h/s and the like, and when I cover up the the curved parts I can see the stems are the same. But having that thin part makes the character seem lighter as a whole. I doubt you could bring that into the /i/, but you might shave a hair's breadth off the side to compensate. As for the /r/, you probably could increase the stroke disparity.</p>
      <p>Lastly, I notice that you have two different styles of serif, one of which has a couple of sharp(ish) corners and the other of which is more curved. For the most part, I think these have been used appropriately, but I would switch them on the tops of the /I/ and /i/. The /I/ is very easy to mistake for an /l/, and I would expect a capital letter to have the slightly more formal "bent" serif. This would also segregate them by height (bent serifs up at cap-height level, curvy ones at x-height) which would seem to make sense. This is all just my instincts talking, however.</p>
      <p>Very nice work. I especially like the punctuation!</p>
