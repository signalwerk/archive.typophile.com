    html: <p>M. Kojo, <br> <br>You are early in asking. Lanston is soon to release the difinitive version of Californian Oldstyle based on the lead patterns which were made by Goudy's own hand. They were, and still are, at Lanston. We  cut punches for Monotype composition. <br> <br>These patterns I believe to be the only in existence. The others were lost in  his fire at Deepdene.</p>
