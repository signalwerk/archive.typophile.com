      <p>Bruno, you know I am going to ask you for a copy of the answers you get regarding the EULA questions, right?</p>
      <p>I agree with Chris, I expected to see something about embedding in that question. I would rather be able to embed into PDFs for proofs to my clients and final PDFs for the printer/bureau than be able to give a copy of the font to the printer/bureau.</p>
