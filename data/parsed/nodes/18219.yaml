      <p>Guys, thanks for the comments to the survey. We debated the "what's legal in your country" question here, and are aware of what the EULA says. However, what we tried to find out is what users *think* is legal in their place of work - in other words their perception of legality.<br>
      When we ask about giving the font to a service bureau, we definitely mean to pass the actual font software, not embedding (although that alone could be an entire survey).<br>
      The "use on all my computers" again refers to a perception that people have about fonts. Some people think that if they spend a few Dollars/Euros/Rupees or whatever, they actually own the font, thus being able to do with it whatever they like. So, we are trying to find out what their thinking is.<br>
      The EULA questions we placed into the survey because we are working on changing ours. Our (hopefully honourable) intentions are to protect our work but also give the user flexibility in using our fonts.</p>
      <p>I hope this clarifies some of your thoughts. And thanks for participating. I do appreciate your input.</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
