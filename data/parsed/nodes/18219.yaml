      <p>Hi Tiff,<br>
      :-), I know!</p>
      <p>Yes, maybe we should have put embedding in, too. However, as a company Dalton Maag has decided that all our fonts in the future will have Editable Embedding permitted. I think URW does the same.</p>
      <p>I know the question is vague, but I don't necessarily want you to think of a EULA. We're after expectations. You may also find that some parts of EULAs are not even enforcable depending on local legislation. We want to find out what people *think* they can do, whether they've read the EULA or not, based on their rights/duties in their localities. What good is it to bang on about copyright protection if the local legislation does not even know the meaning of copyright?</p>
      <p>Does that explain it?</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
