    <p>As a precursor to March's Infoletter (which should reach your inbox around<br>
    13 March), we're appealing for your help. What we're offering is a<br>
    straight swap - you give us your opinions, and we'll give you a free font.</p>
    <p>Everyone who completes our survey at <a href="http://www.daltonmaag.com/survey" title="http://www.daltonmaag.com/survey">http://www.daltonmaag.com/survey</a> will<br>
    receive a 5-user licence to a fully-functional demonstration version of<br>
    InterFace Regular, our most popular font (registration is required to<br>
    receive the font, but as you already receive our Infoletter, you're<br>
    already registered with us). Plus, we'll also give 10% off any Dalton Maag<br>
    Exclusive font licences purchased made before the end of June 2006.</p>
    <p>Dalton Maag Design Team</p>
