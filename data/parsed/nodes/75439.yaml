      <p><cite>"Serlio has a nice feel to it"</cite></p>
      <p>That feels very classic, exclusive and «rich» to me.<br>
      It's an interesting question if financial institutions these days should still be clothing themselves in such gold and brocade, if you know what I mean.<br>
      I personally might be looking for elegant but robust trustworthiness rather than golden faucets.<br>
      I'm not saying I'm right, and after all I don't know your client; what I'm trying to get at is that there's a whole lot of psychology going on under the surface here, and the selection of a typeface really ends up bearing a lot more meaning beyond «feeling nice».</p>
