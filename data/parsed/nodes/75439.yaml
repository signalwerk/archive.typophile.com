    <p>Hello all,</p>
    <p>I feel some remorse for this being my first post, but have been lurking for quite some time and seek advice. Hopefully I will get more involved in the community as time passes.</p>
    <p>Pardon my lack of technical terms, but I will do my best to explain a font that I am looking for. Small caps, not too prominent serifs, narrow, tall, and powerful. I realize this is as vague as can be, but I am designing the logo for an Investment Banking club and seek any feedback. Something that commands reverence and respect, perhaps even a little elitist.</p>
    <p>I've dabbled in type a little bit, but really don't have the eye for nor the arsenal of fonts that I once (if ever) had. Paid fonts, free fonts are great. I have some discretionary funds.</p>
    <p>Once again, any help would be appreciated.</p>
    <p>Thanks.</p>
