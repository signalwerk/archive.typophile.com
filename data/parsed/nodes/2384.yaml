    html: <p> Hi Keith, <br> <br> <br>There's no automatic translation from GX to OpenType that I've ever seen. If you change your mind about picking up the PostScript version from us, I'll be happy to send you the OpenType version when we get around to it, too. <br> <br>Regards, <br> <br>Jonathan Hoefler </p>
