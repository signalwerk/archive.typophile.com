    html: |-
      <p>It's been said before: InDesign won't recognize kerning unless there is at least one GSUB element (ligatures, fractions, ordinals, something). In short, if you ain't got no GSUB, you don't get no GPOS.</p>
      <p>Make up one substitution feature &amp; recompile. You should now get kerning in InDesign.</p>
