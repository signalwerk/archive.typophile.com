    <p>Hi there,<br>
    I have a major problem with InDesign CS2 not recognising kerning, neither class based nor classic kern table. InDesign CS1 works perfectly fine. I am generating OT TTF flavoured with all the necassary boxes ticked in FL 5.0.2 (see pic)<br>
    I know of at least another 3 people experiencing the same problem. </p>
    <p>Can anybody help?</p>
    <p>Much appreciated,<br>
    vik</p>
