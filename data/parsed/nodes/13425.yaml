    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Adobe Type</strong></p>
    <p>Adobe Type sells more than 2,200 popular typefaces for individual sale. The entire library, <a href="/wiki/Font%20Folio" class="freelinking" rel="nofollow">Font Folio</a>, is available in <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> and may also be purchased on CD at a substantial savings. Adobe makes a selection of their library avaiable for students under the title <a href="/wiki/Adobe%20Type%20Classics%20for%20Learning" class="freelinking" rel="nofollow">Adobe Type Classics for Learning</a>. </p>
    <p>Online at <a href="http://www.adobe.com/type/" title="http://www.adobe.com/type/">http://www.adobe.com/type/</a></p>
