    <p>I have been busy compiling the following list for historical purposes.<br>
    However, I am missing information particular to the "Looney Tunes 1 Font Pack, which I have preceded with a bullet •.  The complete list of fonts in that pack, and, if you have the original box, a scan of the front and back would be extremely helpful.  Thanks!!</p>
    <p>Bitstream Li'l Bits Novelty Font Pack Font Lists</p>
    <p>STAR TREK <br>
    Star Trek (Horizon)<br>
    Star Trek Film (Galaxy)<br>
    Star Trek Pi<br>
    Starfleet Bold Extended (Millennium Bold Extended)<br>
    Venetian 301 (Centaur)<br>
    Square 721 Condensed (Eurostile)</p>
    <p>STAR TREK: THE NEXT GENERATION<br>
    StarTrek Next (Sonic Cut Thru)<br>
    StarTrek Gen (Sonic Extra Bold)<br>
    StarTrek Next Pi<br>
    Crillee Italic [A Letraset Font]<br>
    Swiss 911 Ultra Compressed (Helvetica Ultra Compressed)<br>
    Transitional 521 (Electra)</p>
    <p>THE JETSONS</p>
    <p>Jetsons - [With Characters]<br>
    Jets Black (Sprocket) - [No characters]<br>
    Jets Original  (Sprocket Deluxe) - [Official Series Typeface]<br>
    Goemetric 231 (Kabel)<br>
    Egyptian 505 Light (Egyptios Light)<br>
    Bitstream Amerigo</p>
    <p>THE FLINTSTONES</p>
    <p>Flintstones<br>
    Bedrock (Stone Age)<br>
    Impress<br>
    Bitstream Cooper Light<br>
    Swiss 721 (Helvetica) Light</p>
    <p>LOONEY TUNES 1</p>
    <p>Looney Tunes [With characters]<br>
    Looney Tunes Tilt (Alphabet Soup)<br>
    Incised 901 Bold (Antique Olive Bold) - [No characters]<br>
    • Font used in the Sylvester Logo<br>
    • Font used in the Elmer Fudd Logo<br>
    • Unknown Font</p>
    <p>THE WINTER HOLIDAY FONT PACK </p>
    <p>SnowCap<br>
    Holiday Pi<br>
    Cloister Black<br>
    Shelley Allegro (Shelly Scripts Vivace)<br>
    Freeform 721 (Auriol)</p>
    <p>The font names in parenthesis ( ) are the more familiar Linotype names for the fonts or Bitstream renaming.<br>
    The items in brackets [ ] are merely comments.</p>
