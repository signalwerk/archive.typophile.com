      <p>I would like to re-iterate my plea for information regarding the "Looney Tunes 1 Font Pack" made by Bitstream,, Inc. in the early '90s.  </p>
      <p>If anyone out there can add to the information I have already gathered, please post it here.  </p>
      <p>If you know a former Bitstream employee,<br>
      perhaps you can see if they are able to help.  </p>
      <p>An alternative solution would be possible if someone has this pack:<br>
      A scan of the back of the box would be extremely helpful.<br>
      A scan of certain parts of the user guide would complete my task.  </p>
      <p>Any assistance would be greatly appreciated.</p>
