    html: |-
      <p>Continued Loonacy   (Spelling Intentional)</p>
      <p>Here is my best guess as to which fonts are missing from the Looney Tunes Font Pack font list, based on the samples shown in the image I uploaded, and fonts supplied in other packs:</p>
      <p>• Incised 901 Bold (Antique Olive Bold),<br>
      (mixed with "Looney Tunes") for "Employee" etc.,</p>
      <p>Also, this font is a match for the letterforms used in the Looney Tunes font, and could possibly have been renamed to Looney Bold for the font pack.</p>
      <p>From the scanned image, I believe I see: </p>
      <p>• Freehand 471 (Cascade Script) </p>
      <p>for "Awards Banquet" (partially shown title),</p>
      <p>and (this was difficult to make out at such a low resolution):</p>
      <p>• Aachen</p>
      <p> (all in caps with spaces between each letter) for "Fax Transmittal".</p>
      <p>• This leaves one font missing from this list, as a 1993 Bitstream press release indicates that there are six fonts in this pack.</p>
      <p>If anyone knows if this is correct or not, please let me know.  </p>
      <p>Scans of the user guide would be extremely helpful and greatly appreciated.  At least: the front cover,  the pages from "Let's Get Started" thru "Selecting a Point Size" and the back of the box, especially.</p>
      <p>I have been searching for some time and can find very little mention of the Looney Tunes 1 Font Pack online.  It was practically miraculous that I was able to purchase a copy online of the Jetsons Font Pack, which had an AD flyer inside that had a tiny photo of the Looney Tunes box front.</p>
      <p>A few mysteries remain (if I am thus far correct):<br>
      Which font was considered as used in the "Sylvester Logo"?<br>
      Which font was considered as used in the "Elmer Fudd Logo"?<br>
      Are one of those two the missing font?</p>
