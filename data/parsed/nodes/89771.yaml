      <p>The resolution for NES-games was 256x240 although for NTSC the top &amp; bottom screenlines were often omitted leaving you with a resolution of 256x224 which is the one I want to use. I intend to use the fonts at 100% (original image), but since it turned out bigger than expected when put together with the sprites &amp; tiles I've got so far I'll probably be forced to use cut scenes for the dialogues. I do plan on scaling the end result to 200% to fit the screen better &amp; to give it that retro jagged look ;-)<br>
      I might still try to make a 4px wide font to use 'in' the game.<br>
      I'll try &amp; post some pictures of fonts + tiles/sprites for size comparison later.<br>
      Any more thoughts on the @'s or suggestions on how to improve the 'good' zero?</p>
