      <p>Great work!. I can’t wait to see how it develops. I recommend changing the title of this thread to “Good vs. Evil -- two 8-bit style pixelfonts” as at a glance I kept seeing “28.”</p>
      <p>As far as the @ goes, can you post an enlarged image of them? I think 500 px wide is the max to avoid a horizontal scroll.</p>
      <p>When I set an @, I often baseline shift it down so the bottom of the a inside the circle rests on the baseline, as opposed to the outside of the circle. This essentially makes the bottom half of the circle a descender (see below). Perhaps exploring this may open up a few options.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/at_6673.jpg"></div><p></p>
      <p>While I seldom evaluate things on an aesthetic level, gut reaction prefers the first one, but upon closer inspection I begin to see a backwards s (and then the beginning of a backwards swastika). My preference then shifts to the 2nd one. Perhaps the 2nd one with the circle continuing around and falling below the baseline?</p>
      <p>And, given that there are good guys and bad guys, what’s to stop them from having their own @ characters?</p>
