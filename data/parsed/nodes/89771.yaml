      <p>Thanks for the tip, I already changed the title of the thread ;-)<br>
      I usually try to center my @-sign with the x-height, but due to the single pixels for descenders &amp; ascenders that only allowed me to align the a with the baseline in the first one. I've also included an enlarged image of the 'bad' @ since it probably isn't very clear at the original size.<br>
      For both fonts I attempted to give the symbols (@,*, &amp;,...) the same feel as the font it belonged to &amp; for both @-signs I started by making a smaller version of the a. Size limitations however kept me from making a full circle though. To keep in line with that I treated the © the same way extending the c's lower curve into an open circle.</p><div class="imageWrap"><img src="http://typophile.com/files/At_4592.gif"></div><p></p>
