    <p>I've started working on a videogame a while back &amp; since it's both inspired &amp; limited by 8-bit standards (I looked up the size &amp; colour limitations of NES-games) I had to make an 8x8 font to fit the 'tiles' (static 'building blocks' for backgrounds &amp; such) &amp; 'sprites' (animations) I've made so far.<br>
    At first I made a simple monotype (due to the size restrictions) serif font of which I made several variations, but soon one of them became more &amp; more script-like. Once I finished the entire scriptfont &amp; noticed how 'sweet' it looked I thought it'd be cool to add contrast by making a surly font to go with it so that I could use the sweet font for the good guys &amp; the surly one for the villains.<br>
    I'm quite happy with the outcome, especially since the 8x8 size (which already includes the kerning) was quite a challenge to add character to each font.<br>
    The x-height for both fonts was 6 giving me 1 extra pixel for both ascenders &amp; descenders. Not a lot, but I hope I still managed to keep it legible. Given that the total height comes to the full 8 pixels of the 'tiles', I'll be forced to include a 'blank' row between every line if I don't want things to get messy.<br>
    All in all, I'm quite happy with the result &amp; I'd love to hear your thoughts on it. Especially on the 2 @'s for the good font (which one do you prefer?) &amp; some tips on how to improve the 0 from the same font.<br>
    Thanks in advance!</p><div class="imageWrap"><img src="http://typophile.com/files/Good-vs-Evil_6706.gif"></div><p></p>
