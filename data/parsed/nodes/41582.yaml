    html: |-
      <p>This is such an odd serif font that it seems like it should be relatively easy to locate it — the K and A in particular are not typical — but searching with Identifont, my Serif Font ID Guide, and looking at every slab serif in MyFonts did not come up with anything even slightly resembling it. </p>
      <p>This is a mystery to me, but it feels like something I <em>should</em> know. The flat A top seems very Art Nouveau or 19th Century, and it’s making me nuts.</p>
      <p>- Mike Yanega</p>
