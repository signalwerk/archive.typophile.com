    <p>This font is used in a few of the <strong>dialogue in the dark</strong> ad campaigns, most notably the one in Japan seen <a class="freelinking-external" href="http://www.dialoginthedark.com/">here</a>.  The font has been clipped so that only partials of each letter are showing.  The letter elements that I have been focusing on would be the slight upward hump in the <strong>D</strong> and the wide and dipping top of the <strong>A</strong>.  The lower serif on the <strong>L</strong> lends itself to the courier font family... but I am stuck.  Any Ideas?</p><div class="imageWrap"><img src="/files/top_logo_6168.jpg"></div><p></p>
