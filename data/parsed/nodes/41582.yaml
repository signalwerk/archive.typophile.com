      <p>Dan Solo’s version of an 1889 typeface (Rivet) that he called <a class="freelinking-external" href="http://www.myfonts.com/fonts/solotype/riviera/">Riviera</a> shows an example of why this felt like an antique serif to me. Notice the K and A, in particular. This font is one I really hope we get an answer for.</p>
      <p>Mark Simonson, Mike F. or Angel would often be people to come up with ones like this. Any of you out there?</p>
      <p>- Mike Yanega</p>
