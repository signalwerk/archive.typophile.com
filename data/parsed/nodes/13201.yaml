  html: |-
    <p>Does anyone know of a OSX program that will print a cataloge of fonts by name in the actual typeface? </p>
    <p>For example “Futura” would actualy be listed in futura typeface.</p>
    <p>I know for os9 there is FONT Lister and font ganderer pro.</p>
    <p>Thanks</p>
