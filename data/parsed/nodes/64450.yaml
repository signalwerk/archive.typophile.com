    <p>Hello,</p>
    <p>I'm currently developing an online English phrase guide (<a href="http://www.speakenglish.co.uk" title="www.speakenglish.co.uk">www.speakenglish.co.uk</a>), which is being translated into a number of different languages.</p>
    <p>We are looking to make the site available in Persian and Urdu, and I am therefore researching which fonts would be best to use for these languages.</p>
    <p>We would need to use fonts which are Unicode-compatible, and they would also need to be available for free.</p>
    <p>My understanding is that Nasta'liq is preferred style for writing both these languages, so if possible would like to make our site available in Nasta'liq.</p>
    <p>One font we are considering using is Pak Nastaleeq, which seems to work well for Urdu. Would it be suitable for Persian as well, or is there a font which would work better for that language? Are there any other fonts which we should be looking at?</p>
    <p>Any advice would be much appreciated!</p>
    <p>Thanks,<br>
    Chris<br>
    <a href="http://www.speaklanguages.co.uk" title="www.speaklanguages.co.uk">www.speaklanguages.co.uk</a></p>
