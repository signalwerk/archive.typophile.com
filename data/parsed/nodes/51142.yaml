    html: |-
      <p>I am delighted to see this, Adam. </p>
      <p>I hope this will be a continuing policy, and that it will mark some new professional standards on this issue of copying. Not law, but professional standards. </p>
      <p>I do think that the cases you mentioned are arguably either quite different from this case, or are now moot.  </p>
      <p>First of all, with the consolidation of Monotype and Linotype, many of the most egregious copying cases, such as Arial and Helvetica, are now moot, as they have common ownership.  </p>
      <p>As to Bitstream, those faces were a product of the anarchy of the initial period of change to a new technology. As I understand it, the leader of the type division of Linotype was fired, and not allowed to digitize those faces, some of which he had directed development of. He and others founded Bitstream, the first digital typefoundry, and digitized what had been hot metal faces, most of them classics by long dead designers. Then Linotype did their own versions. And Bitstream is now giving proper credit, as I understand it. </p>
      <p>I really don't think Myriad vs Frutiger is in the same class as these. Myriad is heavily indebted to Frutiger, but it is a systematically thought out new design, with new terminals and curves, a softer aesthetic, and new italics and condensed versions. </p>
      <p>In any case, these issues were "litigated" in the court of public opinion before MyFonts came into existence, so it is understandable that MyFonts wouldn't take up these issues. And, of course, they are part of Bitstream.  </p>
      <p>The kind of copying and clumsy manipulation that this case represents really shouldn't get over the bar at MyFonts. I hope your decision here sets a policy that even if legal such clearly unethical practices won't be allowed to run rampant at what I suppose is the leading reseller of fonts.</p>
