      <p>(much laughter!) As if saying that is supposed to redeem you or somehow appease your peers. I'm not moved, not even by a fraction of an em. Remove Artichoke from your website and remove it from Myfonts before several other font makers and I start lobbying John Collins and Laurnece Penney to have it removed from Myfonts for you.</p>
      <p>Oh yes, I'll do it too (lobby Myfonts). You can put money of that.</p>
