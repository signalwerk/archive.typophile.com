      <p><em>It comes from a fresh trace and it is modified quite a bit as an exercise in making a font I couldn’t use into one that I now use all the time.</em></p>
      <p>Whether you steal a digital font's outlines directly by importing the font file into Fontlab, or whether you auto-trace a print of the same font, makes no difference to me. I won't claim to speak for how others here see the two methods, but I see both methods as theft and theft only.</p>
      <p><em>Yes, it has sold some (a few dozen copies), but it is certainly no threat to Papyrus.</em></p>
      <p>A paper-thin justification. That it isn't shooting up the starlets or best sellers charts does not justify your plagiarism.</p>
      <p><em>I’m releasing one next week that is a tracing of a printed page of Erasmus, one of Solo’s old display fonts. It too is heavily modified (and it is only part of a new study on making a book font family I can actually use). I really like it and I am making it mine while tearing it apart to try and see why it is so attractive to me.</em></p>
      <p>Your methods of font production are, at a minimum, very questionable. Certainly it cannot be deemed "typeface design". IHacking other people's fonts and calling the resulting violation your own is plagiarism. Your methods of font production amount to the kind of ass-clownery that gives our industry a bad name. I am stopping short of making an ad hominem personal attack on you David, an argument against you as a person. Instead I ridicule your working methods and pour icy cold water on your plagiarized fonts and lack of ethics.</p>
