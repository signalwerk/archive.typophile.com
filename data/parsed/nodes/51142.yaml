      <p>Hi Guys… Chris Costello here,</p>
      <p>Thanks for the emails. I suppose now is a good time to chime in.</p>
      <p>This is not new. Check out my Rouge’s Gallery of Type Design Thieves:</p>
      <p>Rip-off: Parchment “by Rick Mueller”<br>
      <a href="http://www.fontspace.com/rick-mueller/parchment-mf" title="http://www.fontspace.com/rick-mueller/parchment-mf">http://www.fontspace.com/rick-mueller/parchment-mf</a><br>
      100% counterfeit free font…why?</p>
      <p>Rip-off: Fidelma, “Designed by Patricia Lillie”: <a href="http://www.myfonts.com/fonts/lillie/fidelma/" title="http://www.myfonts.com/fonts/lillie/fidelma/">http://www.myfonts.com/fonts/lillie/fidelma/</a><br>
      A complete bastardization of Papyrus that retains only wisps of the original feel.</p>
      <p>Rip-off: Ereshkigal “Designed by David Nalle” and sold by Scriptorium <a href="http://www.myfonts.com/fonts/scriptorium/ereshkigal/" title="http://www.myfonts.com/fonts/scriptorium/ereshkigal/">http://www.myfonts.com/fonts/scriptorium/ereshkigal/</a><br>
      See below for more of David’s original work…</p>
      <p>Original design by Chris Costello: Blackstone: <a href="http://www.myfonts.com/fonts/chriscostello/blackstone/" title="http://www.myfonts.com/fonts/chriscostello/blackstone/">http://www.myfonts.com/fonts/chriscostello/blackstone/</a><br>
      During my “Jagged Edge Period 1983-88” :) </p>
      <p>Rip-off: Gaiseric, “Designed by David Nalle” and sold by Scriptorium <a href="http://www.myfonts.com/fonts/scriptorium/gaiseric/" title="http://www.myfonts.com/fonts/scriptorium/gaiseric/">http://www.myfonts.com/fonts/scriptorium/gaiseric/</a></p>
      <p>Mr. David Bergsland has now earned himself a place of honor as the most recent member of this fellowship. </p>
      <p>With the love/hate thing that swirls around Papyrus set aside, the font is still, without question, a completely unique and original design… there is nothing else like it in the world, except for these poorly executed fakes. I used no references, “tracings” or other crutches to create it… Papyrus simply came forth from a flurry of hand-drawn sketches (I still have the original doodles). As a professional illustrator and graphic designer, I really consider myself an amateur font designer. I do not have many fonts available for sale and I am just learning FontLab. It just so happens that the few fonts I have designed turned out to be hot sellers and are thus widely imitated. With the exception of Letterpress Text (a respectful tribute to the classics), every font that I have created is entirely original. </p>
      <p>“Artichoke”? Please, David… I’m just not flattered anymore. This is an argument that has angered true type designers since the advent of the computer and the accessibility of font software to just about anybody. You obviously input Papyrus, moved a few points here, a few transformations there and output “Artichoke”. Papyrus, like any original font design, does not need to be improved… it is pretty much what the designer intended it to be and does not require the touch of an “old hack” “to make it more readable, and easier to use”. If you feel the need to customize it for your own use that’s fine, but repackaging it and selling it under a different name is cheap, opportunistic and wrong. </p>
      <p>But it’s not the money issue that bothers me. I sold the rights to market Papyrus to ITC a long time ago and my royalty payments are modest. You are siphoning more of their revenue than mine, and I have informed them of your actions. What bothers me and many others is that you find this practice of “tracing”, “deriving” or otherwise copying other peoples work then passing it of as your own to be perfectly fine. Is this what you teach to your students? Do you address this subject in your books? </p>
      <p>“Artichoke started with adding a roughened, light edge to the character widths of my popular humanist sans font families.”</p>
      <p>Were you implying that you added the rough edges or are you giving me credit for the rough edges I created on the original?</p>
      <p>“I was trying to create the light, airy feel of hand-scribed letters on a rough natural surface.”</p>
      <p>Really? I’m sorry if I did I not do a good enough job creating the light, airy feel the first time around.</p>
      <p>"I did spend a ridiculous amount of time on it. Well over a hundred hours, as I recall."</p>
      <p>Why in the world would anyone spend this much time being redundant? Could the answer be found in the following quote:</p>
      <p>“David started to design fonts for sale rather than for self entertainment.”</p>
      <p>Somebody also mentioned earlier that 100 hours is nothing for a true type designer. Very true! I spent months handcrafting the original, and have spent countless hours digitizing my other hand-drawn fonts. You have done nothing here worthy of respect. There is not much I can do legally to stop you from what you are doing, but ethically speaking, you need to stop selling “Artichoke” and simply keep it for your own use. </p>
      <p>I confronted the “designer” of “Fidelma” and she swore up and down it was not a rip-off. You cannot argue with someone who does not hold on to reason. I respectfully asked David Nalle to stop selling “Ereshkigal” and “Gaiseric” but got no reply. Sadly, this issue of stealing intellectual property speaks volumes about the “Something-for-Nothing” culture that has been cultivated by the Baby Boomers over the past three decades. As I segue into social commentary mode, check out this quote from a charged and very revealing article below:</p>
      <p>“This generation lacks self control, morals, a work ethic, and savings ethic. Based on the recent actions of our government and corporate leaders, we seem to lack any ethics at all.”</p>
      <p><a href="http://www.speroforum.com/site/article.asp?id=16602" title="http://www.speroforum.com/site/article.asp?id=16602">http://www.speroforum.com/site/article.asp?id=16602</a></p>
      <p>I’ll leave it at that. This is a font forum. My rants on pop culture, U.S. foreign policy, the economy and politics can be found elsewhere. </p>
      <p>If you are going to call yourself a designer, then design… don’t simply imitate, then profit from the hard work of others.</p>
