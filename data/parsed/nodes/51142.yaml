      <p>MyFonts is good on their word when something is brought to their attention. but beyond that I don't think there is much attention given to the checking the originality of designs. I suspect there are a lot of fonts on the site that are of questionable origins. </p>
      <p>I was looking at a font of Lettering Delights a while back on MyFonts and so I followed the links to the LD site. Turns out there were several recognizable fonts there including P22 Dearest, T26 Lassigue D'mato, and my own Shoebop (with Veer). When I emailed the company the web person removed them and the "CEO" emailed me saying he would comply with my request to remove them and look into the matter with their font guy. I don't know who was making fonts for them, but at $3 retail they definitely aren't labored over.</p>
      <p>Stephen</p>
    html_clean: |-
