      <p>Quite true, Lucia, I agree. The trouble is, we have no right to prevent production of type designs we dislike. We do have a right to prevent taking someone's intellectual property (good or bad) and using it for profit--however meager that profit. I certainly hope Mr Bergsland requested and received permission from the original designer and foundry before beginning his tracing and copying. Perhaps Mr Bergsland would be better served to create truly original designs. He might then see that a mere 100 hours is nothing when it comes to type design.</p>
