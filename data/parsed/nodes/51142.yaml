    votes: null
    html: |-
      <p>In answer to the original question, the roots are obvious. My hope is that it is an example of the sincerest form of flattery. It comes from a fresh trace and it is modified quite a bit as an exercise in making a font I couldn't use into one that I now use all the time. Yes, it has sold some (a few dozen copies), but it is certainly no threat to Papyrus. </p>
      <p>I'm releasing one next week that is a tracing of a printed page of Erasmus, one of Solo's old display fonts. It too is heavily modified (and it is only part of a new study on making a book font family I can actually use). I really like it and I am making it mine while tearing it apart to try and see why it is so attractive to me.</p>
      <p>Here are some comments on  why I did Artichoke:</p>
      <p>1. Seeing how Chris did it.</p>
      <p>2. Make a font I could actually use</p>
      <p>3. Yes, I did spend a ridiculous amount of time on it. Well over a hundred hours, as I recall.</p>
      <p>4. Yes, I am pleased with the result. I use the font often and I can not use Papyrus much as is is because it is missing too many crucial things for me: my normal OpenType set with small caps, lining, oldstyle and small cap figures, and so on</p>
      <p>I hope it is not too offensive to you all. It is not a nefarious plot. Myfonts only approved it after they saw my original tracings. It is certainly not an attempt to make money on Chris. It will probably end up in a new display font eventually. Remember, I'm just an old graphic designer hack who is very surprised that his font designs actually sell.</p>
      <p>Thanks for your time,<br>
      David Bergsland</p>
      <p>Font designer, graphic designer, writer<br>
      <a href="https://web.archive.org/web/20150123142154/http://bergsland.org/" title="http://bergsland.org">http://bergsland.org</a><br>
      <a href="https://web.archive.org/web/20150123142154/http://bergsland.blogspot.com/" title="http://bergsland.blogspot.com/">http://bergsland.blogspot.com/</a></p>
