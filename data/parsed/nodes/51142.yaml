      <p>I would be surprised if every toy shop owner individually tested each toy he or she puts up on sale. This is simply not feasible. </p>
      <p>But please be assured that we at MyFonts always review cases immediately whenever there is a complaint (no matter whether the complaint came from the party who claims that their rights have been infringed, or from someone else). Our policy is to remove the font from sales temporarily until the issue is resolved. </p>
      <p>However, when it comes to fresh digital versions of typeface designs that some people view as derivative (such as Adobe's Myriad, FontFont's City Street Type, Linotype's Basic Commercial, Monotype's Arial or quite a few faces from the Bitstream library), we employ industry standards, which, well, are not perfect. </p>
      <p>I should also stress that in any case, the original rights owner always has the options to follow the conflict resolution path widely accepted in civilized countries, i.e. a court of law. </p>
      <p>Best regards,<br>
      Adam Twardoch<br>
      MyFonts typographic consultant</p>
      <p>Ps. Thanks to William Berkson for bringing this thread to our attention.</p>
