      <p>Minor obiter: <em>stop calling him “Mr. Bergsland” because it’s a trite form of put-down.</em> It was never intended as as such on my part. Instead, it's merely a matter of being polite. To be clear, consider the evenhandedness: in private correspondence I have addressed Mr. Costello as "Mr. Costello," not as "Chris," even though I doubt he'd mind the informality.</p>
      <p>Some folks regard the overly-casual use of first names as a status leveler, while others do not view it so. Similarly, "Mr." as an honorific oughn't be read mal fide as snide. </p>
      <p>Sometimes a cigar is just a cigar, after all, though other times they're loaded. ;)</p>
      <p>Best regards,<br>
      Ernie<br>
      (by which name you may all freely call me)</p>
