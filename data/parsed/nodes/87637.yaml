    <p>This is during my work on <em>Urbino Italic</em>. I keep various windows open for inspiration purposes and to compare letters to each others while I am drawing.<br>
    This one is during my work on the ‘g’. The photo showes Natalia Vodianova captured beautifully by the Italian [rooted] photographer Paolo Roversi.<br>
    <a href="http://typophile.com/files/Urbino_g_Natalia.jpg" target="_blank" rel="nofollow"><em>Urbino Italic</em> countered ‘g’s</a><br>
    <a href="http://typophile.com/files/YvesSaintLaurent_pict!.jpg" target="_blank" rel="nofollow"><em>Urbino</em> Composition</a> (for my forthcoming new website design)<br>
    <em>Urbino Italic</em> details: <a href="http://typophile.com/files/Schlinge_ag.png" target="_blank" rel="nofollow"><em>ag_g Schlinge</em> </a><a href="http://typophile.com/files/g_Schlinge.png" target="_blank" rel="nofollow"><em>g Schlinge</em></a></p>
    <p>*</p>
    <p>Zur <em>Urbino</em> Kursiven (aus <em>Frammenti della Bellezza</em>)</p>
    <p>[…] Schließlich brachte mich die ‘2’ über die Neuformung des ‘g’ in eine ganz neue Richtung. Immer die wunderschöne Dante Kursiv des Giovanni Mardersteig im Hinterkopf, begann ich die Buchstaben (wieder) mit mehr „Renaissance-esken“<em>1</em> Faltungen zu versehen, die den Buchstaben mehr Würde und Charakter verliehen. Hier das neu gewonnene hübsche Pärchen ‘y’ und ‘g’: [<a href="http://typophile.com/files/yg!.png" target="_blank" rel="nofollow">Abb.: ‘yg!’</a>]<br>
    Kleine, dennoch scharf gezogenene Rundungen kamen an verschiedenen Strichenden hinzu, die Schrift bekam einen etwas „spanischen“ Charakter. Viele Studien hatte ich ja in der Vergangenheit zu den spanischen Kursiven in der Spätrenaissance unternommen, die vielleicht hier wieder mit einspielten. Auf meinem Nachtschrank lag der wunderschöne Gedichtband <em>Diario Immobile</em> (‘<em>Diario Inmóvil</em>’) von Claude Esteban, fantastisch gedruckt von der Stamperia Valdonega in der <em>Dante</em> Schrift Mardersteigs. Schließlich nimmt auch die Sprache fast unmerklichen Einfluß auf die Buchstaben.<br>
    [<em>1</em> dem „rinascimentalen“]</p>
    <p>Zum ‘g’</p>
    <p>Dem ‘g’ hatte ich relativ schnell unten links, an der Stelle, an der die Kurve in den waagerechten Bogen zurückfließt eine deutliche Faltung hinzugefügt, was dem Buchstaben mehr Charakter verlieh. Dem hingegen war nun der Kopf des Buchstabens zu „brav“ verblieben. Zwar schön gerundet hatte der Letter insgesamt etwas „fliehendes“ nach rechts oben, so dass es mir schien die kleine Kugel wolle sich vom Rumpf trennen und sich nach oben ablösen. Als Lösung verschob ich den scharfen Knickpunkt der Innenkurve (ein sehr „Centaur“-inspiriertes Detail im übrigen) etwas nach rechts und ließ den Teil des Bogens vor dem Eintauchen der Anschlusskurve etwas dicker anschwellen. Damit etablierte ich eine Art Gegenbewegung im Buchstaben, die sich wie eine unsichtbare Achse von links oben nach rechts unten hin andeutet, entgegen der allgemeinen (durch die Neigung der Kursiven) Bewegungsrichtung von links unten nach rechts oben. Durch diese sozusagen „x“-förmige Kreuzung der dynamischen Achsen wuchsen der Kopf-Teil und der Schlingen-Teil des Buchstabens besser zusammen: er wirkt kompakter. [<a href="http://typophile.com/files/gg_g_links_Schwerpunkt_verschoben.png" target="_blank" rel="nofollow">Abb.: ‘gg_g_links_Schwerpunkt_verschoben’</a>]<br>
       Kopfstehend (gespiegelt) [<a href="http://typophile.com/files/gg_kopfstehend.png" target="_blank" rel="nofollow">Abb.: ‘gg_kopfstehend’</a>] bemerkt man, dass beim linken ‘g’ nun die Stelle, wo die Kopfkurve zurück in die vom Anschluss her ansteigende Kurve eintaucht (hier nun etwas länger breit als im rechten ‘g’) besser zum Anfang des unteren Bogens passt, also dort wo die Schlinge sich aus der gefalteten Anschlusskurve entwickelt: die (<a href="http://typophile.com/files/gg_kopfstehend_mark.png" target="_blank" rel="nofollow">in der Abbildung eingekreiste</a>) Zone wirkt weniger unruhig und die Kurvenabschnitte verlaufen besser parallel, was den Buchstaben, wie schon gesagt, stabiler macht. Allerdings verliert nun die starke Bogenbetonung in der Schlinge unten links (hier, gespiegelt, rechts oben) etwas an Notwendigkeit, da sich die Dynamik nun weniger durch die Stärkenkontraste im Strich definiert, als durch die dynamischen Bewegungsachsen im Gesamtkonstrukt. Eine Eigenschaft, die den Buchstaben in den Gefilden der Renaissance-typischen Schriften heimisch macht. Eine Gesamtentwicklung in dieser Kursiv-Type, die mich dazu veranlasste ihr einen eigenen neuen Namen (Urbino) zu geben. […]</p>
    <p>Tatsächlich sind die Bewegungen und unterschiedlichen Einflüsse auf eine Form sehr sehr komplex, und wir neigen dazu im Prozess des Konzentrierens uns auf einen dieser Faktoren zu fokusieren, die anderen dabei unbewusst auszuschließen, Was aber nötig wäre, wäre eine Art „allumfassende Konzentration“, die alle Aspekte einer Form in einer gleichberechtigten Art und Weise zusammenhält. So wie wir die Wölbung eines Unterschenkel-Muskels nicht verstehen können, wenn wir nicht die ganze Figur dabei im Auge behalten. Selbst die Neigung des Kopfes hätte schließlich Einfluß auf diesen usw. Ich versuche diese verschiedenen Einflüsse auf die Form des ‘g’ im einzelnen an verschiedenen Stationen der ‘g’-Zeichnung darzulegen. Keine dieser Zeichnungen ist die endgültige, sie enthalten aber jede für sich mehr oder weniger deutlich die einzelnen Aspekte. […]</p>
