      <div class="comment-spam-body"><p>Newspaper nameplate?<br>
      These were usually hand lettered.<br>
      Some have been converted into digital fonts for private use. such as the New York Times font based on its historic letterhead.<br>
      Foundries did produce some common styles for use by newspapers, but I don't recall seeing this particular blackletter.<br>
      There are a huge number of blackletter fonts only a few of which are digitized.</p>
      <p>Don</p>
      </div>
