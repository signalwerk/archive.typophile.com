      <div class="comment-spam-body"><p>Attempting to visualize the letters not shown, I note that that bottom swash on _A_, _B_, _D_, _F_, _M_, _P_, and _S_ resembles the one used on Fette Gotisch. The twin diagonal on _S_ resembles the one used in Wedding Text MT &amp; Wedding HiH.<br>
      Don</p>
      </div>
