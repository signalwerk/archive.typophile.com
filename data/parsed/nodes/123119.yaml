    votes: null
    html: |-
      <div class="comment-spam-body"><p>I agree with the description by Dino dos Santos of _Voz Gotica_ as an exquisite blackletter font, very calligraphic yet modular. He is a very versatile and productive font designer, but since producing Voz Gotica five years ago has not released -- as far as I know -- any more fonts in this genre, except for Hades, a "dark contemporary blackletter" and Albo, a 16th century derived lowercase, enveloped in a flood of calligraphic swirls.<br>
      I wonder if there are any more capital letters available for viewing other than the ones now on the DST website.<br>
      Don</p>
      </div>
