  html: |-
    <p>Hi everybody,</p>
    <p>just because it has a lot to do with the typography, I’ll make me bold and post a logotype I made for 4th Virtual Biennale of Graphic Design, which was held by <a href="http://aug.cz" rel="nofollow">AUG</a> –&nbsp;the topic was ‘Discrimination‘ and as usual, <a href="http://www.aug.cz/virtualni-biennale/2010/ucastnici-bienale-participants-of-the-biennale.htm" rel="nofollow">submitted posters</a> had to be just in black and white. And that’s why I decided to make a simple typographic logotype, using <a href="http://suitcasetype.com/index.php?lmut=cz&amp;part=fonts&amp;font=25" rel="nofollow">Tomáš Brousil’s Comenia Sans</a> typeface.</p>
    <p>Eventhough it has been already published, I will be pleased to read any comments and critics, while feedback is always very welcome!</p>
    <p>Thanks, JT</p>
    <p><img src="http://mancaft.cz/wp-content/uploads/2010/09/toman-diskriminace_logo.png"></p>
    <p>(the first line is in Czech)</p>
