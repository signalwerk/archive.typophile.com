    <p>Over a decade ago, I used the Palm "Pilot" to help make fonts. I used a bitmap editor and a simple vector drawing application.</p>
    <p>Examples:<br>
    <a href="http://new.myfonts.com/fonts/larabie/duality/" rel="nofollow">Duality</a><br>
    <a href="http://new.myfonts.com/fonts/larabie/counterscraps/" rel="nofollow">Counterscraps</a><br>
    <a href="http://new.myfonts.com/fonts/larabie/echelon/" rel="nofollow">Echelon</a></p>
    <p>Can you recommend some iPod/iPhone apps that might be handy for drawing glyphs?</p>
