      <p>Typism doesn't seem to suit the very small screen . . . unless I'm doing something wrong. I tried it in Safari and Opera . . . has anyone has success working with it on an iPod/iPhone?</p>
      <p>Adobe Ideas looks fun for only for Americans: it's not available in the Japanese iTunes store. Damn.</p>
      <p>The Palm was better suited for bitmap drawing because on the pen. I've tried Autodesk Sketchbook and Edge Touch but it's frustrating without a pen to get pixel precision. Although, I could get used to Edge Touch for really lo-res pixel fonts. <a href="http://iphone.takabosoft.com/en/edgetouch/index.htm" title="http://iphone.takabosoft.com/en/edgetouch/index.htm">http://iphone.takabosoft.com/en/edgetouch/index.htm</a></p>
      <p>I can sort of draw letters with the Buro Destruct app. (Check the T in the Typophile 10th Birthday thread) <a href="http://www.burodestruct.net/bdd/" title="http://www.burodestruct.net/bdd/">http://www.burodestruct.net/bdd/</a></p>
      <p>Are there any apps with Bezier curve editing?</p>
      <p>Somewhat related: has everyone tried the Typography Junkies app?</p>
