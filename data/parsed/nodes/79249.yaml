  html: <p>How about some up to date reasons for choosing one of these 3 or all three (I use them all)? Just up to date info on one, Type Tool 3 does generate Open Type fonts. Fontographer 5 is in its latest incarnation a very good re-do of the original program. FontLab Studio is the best and most complex program out there currently that I know of.</p>
