      <p>I can't speak for anyone else, but my workflow favors using Fontographer to build the basic font, then FontLab to do the fine tuning. I draw my outlines in CorelDraw, then export them as EPS. FOG's EPS Import actually fills the UPM height, whereas FontLab imports at about 95-98%. Also, FOG's basic tools are more easily accessible than FL's: instead of having to drill down a seemingly interminable list when you enter CTRL/CMD+T, FOG's Add Extrema and/or Clean up Paths, Set Sidebearings, Correct Path Direction and Remove Overlap commands are directly accessible with a few keystrokes.</p>
      <p>Once I have my basic character set and roughed-in metrics complete, I generate at OTF in FOG, then open it in FL to do the detail work. TypeTool is good for getting your feet wet...</p>
