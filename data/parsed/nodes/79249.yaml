      <p>I do what Nick does, first work on the font in Fontographer, then refine in FontLab Studio. Type Tool was very handy for a long time, but I still worked in Fontographer first. Hey Adam, don't trash your own program TypeTool. It is not just for beginners, and I used it for a long time. </p>
      <p>Adam, the comment that in Fontographer you can do less but you also need to know less is an oxymoron. How can you need to know less? One always needs to know more, no matter what field you might be in. </p>
      <p>I used Fontographer for many years and continue to do so. I like the new version and thanks to FontLab for reviving it.</p>
