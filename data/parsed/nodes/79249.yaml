    html: |-
      <p>Fontographer is for people who don't want to be bothered with technical details (because there is very good automation of the technical aspects), but are comfortable with having manual control over the design aspects (because there is not much design automation in areas such as composites building, class kerning etc.) </p>
      <p>FontLab Studio has much more potential automation, so once you know it well, you can work on large projects faster, but is somewhat more difficult to learn, and also you need to have some understanding of the technical aspects. </p>
      <p>In short: in FontLab Studio, you can do "more" but you also need to know "more". In Fontographer, you can do "less" but you also need to know "less". </p>
      <p>TypeTool is really just for beginners. I'd say it's good for modifying fonts, and for drawing your first couple fonts for practice.</p>
