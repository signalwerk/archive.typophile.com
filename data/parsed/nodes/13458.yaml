    <p>I’m not sure if this is specific to my universe or not, but when I am making a vector object in Illustrator, in this case a logo, if I turn something into a compound path the elements that are reversed out become much much fainter.</p>
    <p>Conversly, if keep those reverses as solid shapes and just layer them over the background fill then the reverse are strong.</p>
    <p>This happens both on screen and on paper!</p>
    <p>What the hell?</p>
    <p>I wouldn’t mind it so much, but in the case of a logo, I have to have a bunch of extra shapes in there so that it will work.  Kinda gets messy.</p>
    <p>I didn’t have this problem before CS though.</p>
    <p>In my attachment the logo piece uptop is compound, down below if layered/non compound.  I’d really love some insight on this. Oh, and I should add, those are the same EXACT shapes.</p>
