    <p>I know the correct font for the an iPod 5G is Podium Sans from searching this website, but my question is whether the font is the same for the outside too [http://www.apple.com/ipod/gallery/images/ipod02_20060912.jpg is a link to a picture of the outside front - the only text using the font is the word menu on the scroll wheel]. If they are indead the same like I sorta thought they would, is Lucidia Sans an ok alternative for Podium Sans? Thanks for the help in advance.</p>
