    html: <p>The outside is not Podium Sans b/c in the word “MENU” the “M” has splayed ends, and the Podium Sans “M” ends are verticle. Besides, Podium Sans is not used in any sales collateral, packaging, online, or anything else besides onscreen use for newer iPod. In all other applications, Apple still uses Myriad Apple.</p>
