    html: <p>Seems a lettering job to me. The forms of the serifs at the end of the E bars, and others are not typical of a true Serif text face, they are too small and too direct a mechanical copy of the regular serif. <br> <br>The overall seems visual a mixture of Times, Caslon and others! But yes, Bell or Miller can be a good replacement. <br> <br><a href="http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Miller" target="_blank">http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Miller</a> <br></p>
