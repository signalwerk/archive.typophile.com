      <p>It's hard to tell from the brief samples of the fonts mentioned above how well they'd work as text fonts, which I presume is what you're after, with mention of readability.</p>
      <p>Chester's point is interesting: does one appeal to a target market by using writing that looks like their writing (which might entail research and possibly commissioning a font), or by showing them something more stylish and "aspirational"? Reality or stereotype?</p>
      <p>One present technique (albeit DM tacky) is to use a rough script on a pseudo-PostIt note, to make it look like a buddy is passing on a recommendation. Is that anything like your creative strategy Troy? I mean, whose voice is the script representing in your ID?</p>
