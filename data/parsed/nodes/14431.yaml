      <p>Would it be out of line for me suggest that you don't speak down to your audience by trying to lure them in with your approximation of hip street graphic lingo, or by visually aligning yourself with a brand they apparently enjoy? (If this is your approach, maybe you should refer to the iPod logotype.) Would it also be out of line for me to suggest you listen to the people you are targeting, and maybe collect some writing samples, so that you can see how they express themselves, then use your research as the basis for your approach?</p>
      <p>If there is one thing I learned as a graphic designer it was that you have to be a member of the tribe to speak the language of the tribe; you can't be a tribal observer and expect to be trusted. (If there is a second thing that I learned it is that a typeface alone is not a design solution.)</p>
