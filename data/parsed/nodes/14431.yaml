    <p>I'm looking for a handwriting typeface with a bit of an edge to it. I'm working on an identity project to appeal to urban youngish people in their late 20s and 30s. I'd like to find a face that's casual and has some attitude, a little graffiti vibe in the style of the Mossimo logo (<a href="http://www.mossimo.com" title="www.mossimo.com">www.mossimo.com</a>), but not a bonafide graffiti face -- I need pretty good readability.<br>
    The closest thing I've found so far is Marydale <a href="http://www.philsfonts.com/showing.html?sku=3I00001201P2&amp;start=1" title="http://www.philsfonts.com/showing.html?sku=3I00001201P2&amp;start=1">http://www.philsfonts.com/showing.html?sku=3I00001201P2&amp;start=1</a></p>
    <p>Which is okay but not quite as stylish as I'm looking for.<br>
    It seems all the handwriting or casual script fonts seem too Hallmark greeting card/Yuppie woman "pizzaz" / Kraft salad dressing label...</p>
    <p>Any thoughts?</p>
    <p>Thanks</p>
