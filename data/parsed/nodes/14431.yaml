      <p>Thanks to everyone for your suggestions. They are really helpful. Dav, I wasn't aware of Rae Kaiser's fonts but I really love them. The Plz Script is the closest thing I've seen to what I'm looking for, and it also looks cool with her (his?) "Architectural" font. The two could work well together for my project. </p>
      <p>Chester, obviously research is an integral part of any successful design. However, my target audience/market is NOT graffiti artists or taggers. I'm  looking for a face with an element of that kind of influence or flavor -- but a "real" graffiti face would be all wrong for my purposes. </p>
      <p>Furthermore, you seem to be implying that we can't design for a group outside our own, which would be creatively confining, to say the least. Does that mean only designers with law degrees can design identities for law firms? Only gourmet cooks can design cookbooks? If I use a face like Cezanne am I "talking down to" my audience because I'm not a 19th century French post-impresssionist painter (and neither are they)?</p>
      <p>Also, you said that a typeface alone is not a design solution. Did anyone say it was?</p>
