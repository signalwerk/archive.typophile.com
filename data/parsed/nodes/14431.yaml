      <p><em> the principles behind communism are much older than Marx</em></p>
      <p>Hrant, this statement is generally true, but Marx's Manifesto was developed, I believe, in response to specific economic trends which were emerging at the time he wrote it; specifically, it was a reaction to emergent industrialism.</p>
      <p>Most people believe, because their history textbooks tell them so, that the American Civil War was waged to put an end to slavery. This tenet is utter nonsense: it was waged to see which manner of slavery would prevail -- chattel slavery or wage slavery. American industrial output exceeded its agricultural output for the first time in 1850, which is when the debate began showing up on the American political stage (the Missouri Compromise). The basic point of contention:</p>
      <ul>
      <li>Factories required large labor pools from which to draw workers, and thus required large cities; and </li>
      <li>Large cities were inimical to slavery, because they offered anonymous refuges for runaway slaves;</li>
      </ul>
      <p>By this point in time, most European powers were no longer in the chattel slavery business, but wage slavery was a growing concern throughout the industrializing world. So, yes, Marx's specific brand of communism was indeed inspired by capitalism: it's just a shame that such a dysfunctional bunch of brigands as the Bolsheviks tried to pull it off...</p>
