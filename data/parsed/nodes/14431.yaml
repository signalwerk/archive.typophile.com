      <p>&gt;Communism was mostly a result of a desire for decency,</p>
      <p>No, while there have always been "communal" social/political movements, Communism per se was a specific political system and movement, deriving from Marx's 1848 Manifesto. It's the Hegelian element in Marx's theory that I was alluding to: capitalism being the thesis producing, through economic determinism, its antithesis, communism.</p>
      <p>So, there are beer and smokes billboards plastered all over the poor side of town, that's the thesis, and a subway car covered in grafitti is its antithesis.</p>
