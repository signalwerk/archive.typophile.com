      <p>Chester, you have obviously directed your comment at me, since all of the other replies contain only typeface names.</p>
      <p>First, let me say that the "Village" is great (a comment which has nothing to do with this thread).</p>
      <p>&gt;<em>If there is one thing I learned as a graphic designer it was that you have to be a member of the tribe to speak the language of the tribe</em></p>
      <p>I think my descriptive terminology is strictly typographic: quill, grunge, crude marker, graffiti, and makes no attempts at approximating "hip street graphic lingo."</p>
      <p>If you mean that to be "a member of the tribe" you have to live and work within the environs of other members, then I am one of the Grand Elders, having spent the a great number of years in the gritty streets of NYC and East Village with the very people that made it "hip."  East Village was just a quite Ukranian neighborhood at one time.</p>
      <p>NYC spray bomb graffiti styles emerged on the scene on subway cars during the 1960s, and on the west coast in LA around the same time. "Rap" and "Gangstas," "Bloods" have been around for over thirty years and have made the "mainsteam" vernacular that even Soccer Moms know "waz up."</p>
      <p>If you mean "tribe" to be a member of the younger up &amp; coming urban designers on the scene, then you are right, I'm out in the pasture flinging cow chips.</p>
      <p>You are not <em>out of line</em> for expressing that you feel my comments were condescending, but just say it plain, clear and directed to the individual(s). Because anything I can learn about being more helpful or understanding to posters who seek advice would be very helpful to me. I have no "ego" axe to grind and enjoy this community immensely.</p>
      <p>--------------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
