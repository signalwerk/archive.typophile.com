      <p>Dan:<br>
      I love Cezanne (the typeface AND the artist) but I think it's too formal and antiquated looking for what I'm going for.<br>
      The project is an identity for a line of all-natural soaps that are handmade in Brooklyn by a friend of mine. They look great, I think.<br>
      Here is a link to a photo: <a href="http://serv1.uploadengine.com/1123705268D.jpg" title="http://serv1.uploadengine.com/1123705268D.jpg">http://serv1.uploadengine.com/1123705268D.jpg</a><br>
      They smell terrific too. You almost want to eat them.</p>
      <p>We wanted to do something that looks casual and contemporary and "youth" oriented, in this case middle to upper-middle income people who consider themselves fairly with it. We also wanted to avoid the romantic/precious references to historical styles (Laura Ashley, for example) that are so common in this category. Thirdly, we wanted something that would appeal to women AND men. </p>
      <p>I was thinking the handwriting look would reinforce the handmade nature of the soaps -- each one really is different.</p>
