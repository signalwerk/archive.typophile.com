      <p>Norbert, actually I was replying to the original post, and not to your font suggestions and other comments.</p>
      <p>Please allow me to speak specifically: When I spoke of "being a member of the tribe" I was thinking about the time when I worked at a design firm and we were working for a mountain bike company. I embraced and enjoyed the life of a mountain biker, traded in my roadie attitude for a mountain biker attitude, hung out with fellow mountain bikers, and competed in races - which we preferred to call "timed rides". I crashed, bled, and ate Clif Bars... I became a mountain biker. That was the only way that I could speak to my fellow mountain bikers through the work for the mountain bike company.</p>
      <p>Design isn't simply applying a "style" to provided content; it is understanding a set of needs and desires and finding the way to communicate those needs and desires. Modernism isn't sans serif typefaces, it's philosophy. David Carson is a design philosopher; thousands of designers have copped his "style" but they have no idea about the philosophy behind his work.</p>
      <p>To speak to the "youth market segment" requires much more than an edgy typeface.</p>
