    html: |-
      <p>Stanyan is nice.</p>
      <p>I think the popularity of this style and the sign painter style is that young people, in particular, respond well to authentic, one-of-a-kind, hand-drawn writing and art. There is an authenticity to handmade stuff that's harder to get with an all-digital approach. </p>
      <p>And the funny thing is that it's almost always easier to actually draw/write this style by hand than it is to search for a "handwritten" font. Out of the thousands of handwritten fonts, only a few do it well. And they are all so particular. Each handwritten font has its own distinct personality.</p>
      <p>BTW, isn't <a href="//new.myfonts.com/fonts/nicksfonts/spaghetti-western-wbw/" rel="nofollow">Spaghetti Western</a> a fat face Egyptian?</p>
