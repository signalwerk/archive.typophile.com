    html: |-
      <p>Wow! Beautiful! I hope you can excuse these outbursts... I have quite a fetish for stone carved letters. I spent about a month in college carving New England slate. Those letters were just terible, though... that stone is in a deep, dark place... never to see the light of day again!</p>
      <p>I found your comment “Square-ended ‘sans serifs’ are much harder…” quite interesting. When you are drawing with a brush (or even a broad nibbed pen), or carving, it is certainly more convenient to flare out and use serifs. But when one is drawing outlines, straight lines win out in the contest against curves every day of the week. So, digitally, serifed letters are much more different. Interesting parallel, I guess.</p>
      <p>In Emigre 64(?), Elliot Earls wrote an interesting piece about contemporary type design approaches. What I remember the most from that piece was his emphasis on stroke endings. He wrote that something has to happen there to define the design of the face (if I rememebr correctly).</p>
