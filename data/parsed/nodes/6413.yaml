    <p>So I totally have this plan to be the ultra-niche Nick Denton. Unfortunately my name has far more syllables but I'll try to live up to his example. <br> <br>Thus, some new projects of mine, currently undergoing extensive testing: <br> <br><a href="http://www.hewnandhammered.com/pho" target="_blank">www.hewnandhammered.com/pho</a> <br><a href="http://www.hewnandhammered.com/eats" target="_blank">www.hewnandhammered.com/eats</a> <br> <br>which will soon have their own domains, and perhaps more attractive mastheads. <br> <br>My own skill could not possibly match that of the beautiful &amp; talented Mark van Bronkhorst, who made me a great piece using his own Verdigris, which I find quite useful &amp; have been availing myself of on a daily basis for awhile now: <br> <br><a href="http://www.hewnandhammered.com" target="_blank">www.hewnandhammered.com</a> <br> <br>I'm also working on <br> <br><a href="http://www.mocosanfrancisco.com" target="_blank">www.mocosanfrancisco.com</a> <br> <br>and of course that old standby, my favorite, <br> <br><a href="http://www.typographi.com" target="_blank">www.typographi.com</a> <br> <br>Meanwhile, if anyone has ideas of niches that might warrant a site and fulfill the following criteria: <br> <br>a. audience must be own/use personal computer &amp; internet (this is why hewn &amp; hammered is not such a success; i missed this most important rule); <br> <br>b. audience must have disposable income <br> <br>c. audience must have time to contribute - as the entire idea here is to get these things self-sufficient to the point where i don't need to take much time editing, and can leave most of the content creation up to a group of 2-3 dozen individual authors. <br> <br>d. niche must be somewhat approachable and of interest to hobbyists/amateurs outside the professional practice, if there is one. <br> <br>e. each site needs a catchy name &amp; attractive identity or is not worth producing. <br> <br>f. and of course there needs to be some available content on the Internet - hopefully lots of disparate little bits all looking for some glue to hold them together. <br> <br>i was thinking of one for people involved in GIS - cartographers and planners and the like - they spend a lot of time on the 'net, work mostly on computers, professionally network just as much as folks in our own trade. <br> <br>any ideas?</p>
