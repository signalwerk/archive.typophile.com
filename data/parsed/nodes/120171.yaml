    html: "<p>Finally, did a complete round but came up with no match. Adding some more alternatives I've encounbtered with during the process: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fonted-house/hollyhock\" rel=\"nofollow\">Hollyhock</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/emily-lime/bombshell-pro\" rel=\"nofollow\">Bombshell</a>, <strong><a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/letters-numbers/sketch-script\" rel=\"nofollow\">Sketch Script</a></strong>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/trial-by-cupcakes/anna-clara\" rel=\"nofollow\">Anna Clara</a>, <strong><a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/eurotypo/gemmadonati\" rel=\"nofollow\">Gemmadonati</a></strong>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/great-lakes-lettering/asterism\" rel=\"nofollow\">Asterism</a> (more <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Great_Lakes_Lettering\" rel=\"nofollow\">Great Lakes Lettering</a>?), some <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/laura-worthington/adorn\" rel=\"nofollow\">Adorn</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fontforecast/santas-pen\" rel=\"nofollow\">Santa's Pen</a> (interesting lowercases), Eurotypo <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/eurotypo/kumma\" rel=\"nofollow\">Kumma</a> and <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/eurotypo/aleka\" rel=\"nofollow\">Aleka</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/tart-workshop/madelinette\" rel=\"nofollow\">Madelinette</a> (more <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Tart_Workshop\" rel=\"nofollow\">Tart Workshop</a>), <a href=\"/wiki/https%3A/%252Fcreativemarket.com/OnTheSpotStudio/66765-Emerson\" class=\"freelinking\" rel=\"nofollow\">Emerson</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fontforecast/perron\" rel=\"nofollow\">Perron</a> No 2, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/los-andes/garden\" rel=\"nofollow\">Garden</a> Catchwords (interesting one even if it does not come as a keyable font)</p>"
