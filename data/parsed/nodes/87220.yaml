  html: |-
    <p>This might seem like a stupid post, but I'd like to hear your opinions on this grid I've created for a brochure (76 pages).</p>
    <p>I've given extra space to the inside margins, set up my column gutters to 12pt, which matches the baseline grid leading. I've also set my column height to be divisible by the 12pt baseline, so I've got 61 lines fitting snug.</p>
    <p>Are there any fine details I'm missing? I know it's hard to comment on a grid without knowing the content that will populate it, but I'm trying to get more detailed oriented with my grid structure, and thought I might be able to get some good tips here.</p>
