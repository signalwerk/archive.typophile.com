    <p></p><div class="imageWrap"><img src="http://typophile.com/files/niemann_4582.png"></div><p></p>
    <p>Hello, all. The illustrator Christoph Niemann has a monthly <a class="freelinking external" href="http://niemann.blogs.nytimes.com/2011/08/19/rock-paper-scissors-2011-style/?pagewanted=all" rel="nofollow">column in the NY Times</a>. I love the grotesk face he uses on these recent illustrations, but can't quite figure out what it is – those terminals (and the 'a'!) are a little too quirky for WhatTheFont.</p>
    <p>But not for you – what is it? Thanks for the help!</p>
  html_clean: |-
