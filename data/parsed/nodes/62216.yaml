    <p>So I'm looking for a chunky, slightly modernist italic font but haven't really found what I'm looking for. </p>
    <p>I'm aiming somewhere between <a class="freelinking external" href="http://new.myfonts.com/fonts/imageclub/serpentine-sans/bold-oblique/" rel="nofollow">Serpentine Sans</a> which carries a certain unwanted 70s car chase movie vibe and <a class="freelinking external" href="http://new.myfonts.com/fonts/positype/muscle/" rel="nofollow">Muscle</a> which is just not quite legible enough. I'm mostly concerned with the digits and the uppercase alphabet for captions.</p>
    <p>Suggestions?</p>
