      <p>I'm of the camp that believes you <strong>should not</strong> begin a sentence with "and." I was taught it this way: a sentence should be able to stand on its on as an individual thought or idea. When it begins with "and" the sentence is completing a previous thought or idea and therefore is not a complete sentence.</p>
      <p>As has been pointed out, I think this rule can be broken when "voice" is taken into consideration. If a story is being written in first person, go nuts— but if I'm reading a corporate annual report written in third person it looks <em>wrong</em>. </p>
      <p>Back to ampersands...its best not to make people think too much about it. I'm not as much of a type scholar as many on this thread and I hadn't really thought of ampersands as anything but a "caps" thing. Crazy OpenType menus give me the willies. Keep it simple.</p>
