      <p>Bill, it's cool to be quoted alongside Churchill, Lincoln and the King James.<br>
      However, I still think that the teachers had it right.<br>
      The word "and" at the beginning of a sentence has a number of different meanings compared to when used as a simple conjunction. "Therefore", "consequently",  "furthermore", "then (next)," etc., as opposed to the simple "in addition to". Sure, it's not necessary to draw those distinctions if the meaning of the passage is clear to the reader, and the terse "and" makes for forceful expression. But doesn't it make sense to teach budding writers to shade their language and think more closely about how they're making their point, by using a variety of words with subtle distinctions of meaning, rather than a catch-all?</p>
