      <p>Type designers have the task of producing types that will be usable tools by those who purchase them.  This does not mean that every user will use every glyph in a given font. It does not mean that type designers can stipulate which glyphs must be used and when. If we include a small caps ampersand or even the less used section glyph as small caps, we are just making something available for those who may need it. The user will decide and may decide badly in our eyes--none-the-less, it is their choice.</p>
      <p>ChrisL</p>
