      <p>Nick, it's just not necessarily more precise or better. And Terry, even sentences that begin with 'And' can be and usually are gramatically complete sentences. </p>
      <p>I don't really want to argue this as every authority disagrees with you--I just checked two more. </p>
      <p>But if you are so confident that it is always better to avoid an 'and' or 'but' try eliminating the beginning 'ands' and 'buts' in the following and by doing it improve them. If you improve them I will gladly concede your point.  </p>
      <p>Here are those lame writers who worked for King James (reflecting the original Hebrew, which has all the 'ands' also):</p>
      <p>"In the beginning God created the heaven and the earth. Now the earth was unformed and void, and darkness was upon the face of the deep; and the spirit of God hovered over the face of the waters. And God said: 'Let there be light.' And there was light. And God saw the light, that it was good; and God divided the light from the darkness. And God called the light Day, and the darkness He called Night. And there was evening and there was morning, one day."</p>
      <p>And here is that dabbler Lincoln starting with a 'but':</p>
      <p>"Four score and seven years ago our fathers brought forth on this continent, a new nation, conceived in Liberty, and dedicated to the proposition that all men are created equal.</p>
      <p>"Now we are engaged in a great civil war, testing whether that nation, or any nation so conceived and so dedicated, can long endure. We are met on a great battle-field of that war. We have come to dedicate a portion of that field, as a final resting place for those who here gave their lives that that nation might live. It is altogether fitting and proper that we should do this.</p>
      <p>"But, in a larger sense, we can not dedicate -- we can not consecrate -- we can not hallow -- this ground. The brave men, living and dead, who struggled here, have consecrated it, far above our poor power to add or detract. ...."</p>
      <p>And here is that fumbler Churchill, again starting with a 'but':</p>
      <p>"I expect that the Battle of Britain is about to begin. Upon this battle depends the survival of Christian civilization. Upon it depends our own British life, and the long continuity of our institutions and our Empire. The whole fury and might of the enemy must very soon be turned on us. Hitler knows that he will have to break us in this Island or lose the war. If we can stand up to him, all Europe may be free and the life of the world may move forward into broad, sunlit uplands. But if we fail, then the whole world, including the United States, including all that we have known and cared for, will sink into the abyss of a new Dark Age made more sinister, and perhaps more protracted, by the lights of perverted science. Let us therefore brace ourselves to our duties, and so bear ourselves that, if the British Empire and its Commonwealth last for a thousand years, men will still say, 'This was their finest hour.'"</p>
      <p>These examples can be multiplied at will, both for the 'ands' and the  'buts', with every distinguished author you can name. But these three will keep you busy for quite a while trying to improve upon them ;)</p>
      <p>Oh, and one more, a rather articulate fellow writing on type: </p>
      <p>"Economics favor size, and digital culture has come to be dominated by a few companies--arbiters of taste--that rely on a handful of creatives for their content, which they spread worldwide at low margin. Individual purchasers are disinclined to commission local photographers or illustrators when they can get stock for far less. And why buy a contemporary typeface family when you can get Neue Helvetica, 51 fonts, for US$300? Not to mention all the free fonts that come with OS X."</p>
      <p>I would say that both the 'and' and the following incomplete sentence are excellent prose style. And maybe the writer, Nick Shinn, when he is not kissing the boots of his misguided teachers, would also agree :)</p>
