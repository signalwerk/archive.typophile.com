      <p>"I expect that the Battle of Britain is about to begin. Upon this battle depends the survival of Christian civilization. Upon it depends our own British life, and the long continuity of our institutions and our Empire. The whole fury and might of the enemy must very soon be turned on us. Hitler knows that he will have to break us in this Island or lose the war. If we can stand up to him, all Europe may be free and the life of the world may move forward into broad, sunlit uplands. But if we fail, then the whole world, including the United States, including all that we have known and cared for, will sink into the abyss of a new Dark Age made more sinister, and perhaps more protracted, by the lights of perverted science. Let us therefore brace ourselves to our duties, and so bear ourselves that, if the British Empire and its Commonwealth last for a thousand years, men will still say, 'This was their finest hour.'"</p>
      <p>These examples can be multiplied at will, both for the 'ands' and the  'buts', with every distinguished author you can name. But these three will keep you busy for quite a while trying to improve upon them ;)</p>
      <p>Oh, and one more, a rather articulate fellow writing on type: </p>
      <p>"Economics favor size, and digital culture has come to be dominated by a few companies--arbiters of taste--that rely on a handful of creatives for their content, which they spread worldwide at low margin. Individual purchasers are disinclined to commission local photographers or illustrators when they can get stock for far less. And why buy a contemporary typeface family when you can get Neue Helvetica, 51 fonts, for US$300? Not to mention all the free fonts that come with OS X."</p>
      <p>I would say that both the 'and' and the following incomplete sentence are excellent prose style. And maybe the writer, Nick Shinn, when he is not kissing the boots of his misguided teachers, would also agree :)</p>
