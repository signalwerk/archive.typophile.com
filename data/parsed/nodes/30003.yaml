      <p><em>I’m not sure I should make this letter a c2sc or an automatic smcp from the original ampersand.</em></p>
      <p>Don't include any ampersands in your smcp class. This will leave the default 0026 character as the "(caps with) small caps" glyph. Put the small-cap-height alternate in c2sc, which will activate it via the "all small caps" item in the OpenType menu.</p>
    html_clean: |-
      <p><em>I’m not sure I should make this letter a c2sc or an automatic smcp from the original ampersand.</em></p>
