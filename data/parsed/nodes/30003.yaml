      <p>As with any language style question, here, the answer is simple: if you want to start a sentence with "And", do it wisely and consciously. Don't overuse it, since some people may feel that it does not fit into daily, practical use. But if you know what you're doing, do it. </p>
      <p>Computer programs that do automated grammar checking, spellchecking, hyphenation or typesetting should never try to be smarter than the user. A certain amount of aid and guidance is helpful, but software cannot assume that the user is mindless. And a type designer should not treat the font user as being a mindless ignorant. </p>
      <p>The type designer may be the brick maker who creates the ingredients that shape the visible form of language but it is the writer who is the architect of the house, and it is the typographic designer who builds it. </p>
      <p>A.</p>
