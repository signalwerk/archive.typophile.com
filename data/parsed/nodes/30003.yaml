      <p>I too was taught not to begin sentences with a conjunction, but it wasn't malevolent, ignorant, or short-sighted. They just wanted to teach one to use language with power and precision, and not be sloppy. Of course, teachers may come to see a beneficial practice as a universal obligation, and standards guardians are apt to become pedants -- but like many things one does in one's protected childhood, such as the range of substances deemed acceptable to ingest, there's more leeway for grown-ups with their sturdier constitutions.</p>
      <p>It's an axiom of type design that If It's Possible They Will Do It, so we must be prepared for the collision of bands who decide their name should begin with an ampersand, and typographers who decide that editorial style will set band names in small caps. Strong stuff, indeed.</p>
