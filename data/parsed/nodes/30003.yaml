      <p>The dictionary.com statement contradicts every authoritative source I have seen on this issue. It is possible to find such wrong statements because this foolish idea is so common amongst poor teachers of English. I have already quoted an authoritative English source on this effort. Here is from an American one, the widely relied-upon 'Chicago Manual of Style': </p>
      <p>"There is a widespread belief--one with no historical or grammatical foundation--that it is an error to begin a sentence with a conjunction such as 'and', 'but' or 'so'. In fact a substantial percentage (often as many as 10 percent) of the sentences in first-rate writing begin with conjunctions. It has been so for centuries, and even the most conservative grammarians have followed this practice."</p>
      <p>They go on to quote a writer from 1938, whom they say "fairly sums up the situation even today." He says, "...no textbook supports it, but apparently about half of our teachers of English go out of their way to handicap their pupils by incalcating it. One cannot help wondering whether those who teach such a monstrous doctrine ever read any English themselves."</p>
