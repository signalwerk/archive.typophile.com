    html: <p>Found it. Apparently it is no longer in preferences. I found if you switch the header panel to the bottom then, and then only, do you see the options menu. Further down in that it has a selection for Automatic Line Feed. I suppose I'd know that if I toggled back and forth between upper and lower header panels regularly.</p>
