      <p>I don’t do web design at all but I’ve got a few links you may find useful if you haven’t got them.</p>
      <p><a href="http://www.alistapart.com/">A List Apart</a><br>
      <a href="http://webtypography.net/">The Elements of Typographic Style applied to the Web</a><br>
      <a href="http://typetester.maratz.com/">Typetester</a></p>
      <p>Here’s  been a lot of noise about font embedding for the web recently if you’re interested in that area.</p>
      <p><a href="http://www.beadesigngroup.com/blog/archives/2006/03/five_steps_to_font_freedom.html">Five Steps to Font Freedom</a><br>
      <a href="http://typophile.com/node/18418">Typophile reaction</a><br>
      <a href="http://blogs.adobe.com/typblography/2006/03/fonts_on_the_we.html">Fonts on the Web by Thomas Phinney</a></p>
      <p>and</p>
      <p><a href="http://typophile.com/node/19502">W3C takes a fresh look at linking fonts to Web pages</a></p>
