    html: <p>Except the “popular winner” last time had the “california job case” text removed… Kind of bummed me out, since I thought it was a great joke about the economy. I mean, subtlety is good if it ampliﬁes the value of what’s not said, but not for just its own sake. In that case for example, leaving the text in wouldn’t have made it “valuably” less subtle (because anybody who’s heard what a California job case is also knows what a type case <i>looks</i> like), and it would have preserved the joke. Without that text, the shirt was just cool, instead of being cool <i>and</i> funny. To be fair though, the shirt was still good without the text. <br><br>hhp <br></p>
