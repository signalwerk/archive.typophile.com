    html: <p>John,  <br> <br>OpenType PS (.otf) fonts also use the Slant operator so "dynamic" slanting is possible. In fact, for oblique typefaces, there are advantages of using the Slant operator instead of manually slanting outlines. You can hint the upright font for PostScript once, and then let ATM interpret the hinting and do the slanting. Authinting of upright fonts usually works better than autohinting manually slanted fonts.  <br> <br>Hrant,  <br> <br>seems like neither the OpenType spec nor the FOND Mac resource allows to specify the angle of automatic slanting if the italic/oblique style is missing.  <br> <br>Adam <br></p>
    html_clean: <p>John,  <br> <br>OpenType PS (.otf) fonts also use the Slant operator so "dynamic" slanting is possible. In fact, for oblique typefaces, there are advantages of using the Slant operator instead of manually slanting outlines. You can hint the upright font for PostScript once, and then let ATM interpret the hinting and do the slanting. Authinting of upright fonts usually works better than autohinting manually slanted fonts.  <br> <br>Hrant,  <br> <br>seems like neither the OpenType spec nor the FOND Mac resource allows to specify the angle of automatic slanting if the italic/oblique style is missing.  <br> <br>Adam <br></p>
  - id: 19759
