    votes: null
    html: "<p>Thanks for the extra details, Adam. I'm not surprised that support for the Slant operator has been carried over from Type 1 to CSS. I have to admit, that I've just about given up on PS fonts: Ross has made some CFF OT fonts, but I've done nothing but TrueType for the past couple of years. <br> <br>Hrant, most aspects of the OS/2 table can be input via FontLab, e.g. the TT/OT vertical metrics, codepage and Unicode range bits, etc., but most of these are not identified specifically as OS/2 table entries in the FontLab interface: you have to be familiar with the spec to know which FontLab fields correspond to which sfnt table entries.</p>"
