    html: "<p>The FontInfo field to which you refer is probably the Slant Angle. This does something other than what you want: it is a way to mechanically oblique a Type 1 on output, and was used a means to ship 'italic' fonts for families that don't have true italics. The original Adobe/Linotype Helvetica italic PS fonts used this mechanism, for example. The italic fonts were obliqued in use, but if you opened them in FontLab you would find that the outlines were upright -- identical to the roman fonts in fact -- and the obliques you saw in apps were as a result of the Slant Angle setting. <br> <br>I'm not aware of any setting to do what you want, but have a look at the OS/2 table spec. That would be the obvious place for such a setting in TT and OT fonts.</p>"
    html_clean: "<p>The FontInfo field to which you refer is probably the Slant Angle. This does something other than what you want: it is a way to mechanically oblique a Type 1 on output, and was used a means to ship 'italic' fonts for families that don't have true italics. The original Adobe/Linotype Helvetica italic PS fonts used this mechanism, for example. The italic fonts were obliqued in use, but if you opened them in FontLab you would find that the outlines were upright -- identical to the roman fonts in fact -- and the obliques you saw in apps were as a result of the Slant Angle setting. <br> <br>I'm not aware of any setting to do what you want, but have a look at the OS/2 table spec. That would be the obvious place for such a setting in TT and OT fonts.</p>"
