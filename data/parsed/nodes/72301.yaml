    <p>I'm working on the logo &amp; wordmark for a company that will be based online (it's a music service) and aimed at Churches, primarily older and smaller high-churches, like Presbyterian, Episcopalian, Lutheran, etc.</p>
    <p>Currently I'm using Proxima Nova or Gotham in the mockups (anyone want to weigh in on why I should pick one over the other?), set in all-caps, but I'd like to see something that looks a tiny bit more traditional.  I'm thinking some slight serifs or something. Normally I'd try to solve this with a slab serif like Adele or PMN Caecilia, but it ends up looking too tough, and most serifs just look too boring to be used for an online music service.</p>
    <p>So I'm looking for some suggestions...  Like I said, something current and contemporary is key, but with some sort of throwback to older styles, and preferably a wide letter form in the uppercase. It's be a plus if the typeface had some neat little quirk that gave it a personality as well.</p>
    <p>By the way, if I stick with a serif, I also thought about Eigerdals (<a href="http://new.myfonts.com/fonts/insigne/eigerdals/" title="http://new.myfonts.com/fonts/insigne/eigerdals/">http://new.myfonts.com/fonts/insigne/eigerdals/</a>), the bold weight in particular... anyone have any thoughts on that font or the foundry?</p>
