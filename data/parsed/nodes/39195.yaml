      <p>A quick and rather broad observation:</p>
      <p>I’d imagine global would by 2015 include a lot more regional strands. That’s as compared to today when global is, by and large, Western.</p>
      <p>On the other hand, regional styles would quite likely get more global in expression. That’s something we’ve seen a good deal in India over the past decade.</p>
