    <p>I’m a student of visual communication in Bern, Switzerland. For a school project called “Global – Regional” i have setup an <a href="http://www.questionpro.com/akira/TakeSurvey?id=823625" target="_blank">online survey</a>. It takes about 3 minutes to fill out. Everything else is described on the website.<br>
    This project aims to answer the question if design will be more regional or more global in style, colors, etc. in 2015 than now - and why that. Your answers will help me finding an answer.<br>
    THANK YOU.</p>
