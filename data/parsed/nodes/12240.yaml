    <p>FontLab 4.6 is a professional font editor for Mac <span class="caps">OS</span> and for Windows. It is the comprehensive solution for font foundries, professional type designers, typographers and graphic design studios, allowing them to design type, create and modify fonts. FontLab supports all major outline font formats, including Type 1, TrueType, Multiple Master and OpenType. The current release of this software is FontLab Studio 5, available for both Mac and&nbsp;Windows.</p>
    <p><a href="http://www.fontlab.com">http://www.fontlab.com</a></p>
