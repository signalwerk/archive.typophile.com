    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : <a href="/wiki/Font%20Editors" class="freelinking" rel="nofollow">Font Editors</a> : FontLab</strong></p>
    <p>FontLab 4.6 is a professional font editor for Mac OS and for Windows. It is the comprehensive solution for font foundries, professional type designers, typographers and graphic design studios, allowing them to design type, create and modify fonts. FontLab supports all major outline font formats, including Type 1, TrueType, Multiple Master and OpenType. The current release of this software is FontLab Studio 5, available for both Mac and Windows.</p>
    <p><a href="http://www.fontlab.com" title="http://www.fontlab.com">http://www.fontlab.com</a></p>
