  html: |-
    <p>I am close to having to decide what face to use for an upcoming book project. The project has one or two unique requirements. It is about 85,000 words, and will also contain about 25% illustrations/photos/designs--i.e. text will be broken up and it will be unusual to have more than 3 pages in a row consisting solely of text. It will be printed on a book printing web offset press (as opposed to standard web) on high-quality book paper.</p>
    <p>About 35-40% of the text will be printed in a dark-red ink like Pantone 186 or 193 (the rest in black). Because of this I want a font that is low in contrast, and dark, as I am trying to minimize the 'pinking' of the red ink on thinner letterforms.</p>
    <p>I am also looking for a tone that is contemporary and cold (or perhaps more appropriately, austere). I also prefer a fully expanded OT font, simply for utility and ease of layout in InDesign. I will be setting at around 10/12.</p>
    <p>Right now my current choice is <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_absara_ot/" rel="nofollow">FF Absara</a>, but I have some concerns, and their rather extremely limited specimen PDF is worthless. Has anyone used this to set a large work of text? I am concerned about it being just a bit too busy for such a long work. I am also concerned about readability, though I have read some opinions that say this is not a concern. It also seems to be an extra wide font, but it's hard to tell without being able to actually use it. I'd love to hear from people with experience setting Absara.</p>
    <p>I considered <a href="http://www.underware.nl/site2/index.php3?id1=dolly&amp;id2=roman" rel="nofollow">Dolly</a>, but in the end decided it was too warm for this book, and lacking an OT format. I am still considering <a href="http://type-together.com/font_karmina_home.php" rel="nofollow">Karmina</a> from Typetogether as a possibility.</p>
    <p>Can anyone please, please recommend some similar faces and/or share the experiences and opinions about these fonts?</p>
    <p>Thanks so much for your help,</p>
    <p>Paul</p>
