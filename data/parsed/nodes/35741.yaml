    html: <p>Absara looks like very small potatoes next to FF Scala, a real star that works superbly everywhere. Also, Bitstream Iowan, now available with oldstyle figures in a separate bundle, very warm and yet very clear, and not yet discovered. Quadraat and Eric Gill's Aries are worth considering. In the Adobe OpenType collection, take a look at Chaparral, Dante, Electra, and Giovanni. And though it offers higher contrast, Warnock is a really distinguished new option for all of us.</p>
