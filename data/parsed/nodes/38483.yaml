      <p>My only experience has been with the prebuilt Mac OS X package, but that is easy enough to install. Just make sure you have X11 installed (included on the system install DVD, but as an option that may not be pre-installed) and double-click the package, then launch X11 and select FontForge from its applications menu.</p>
      <p>You need Cygwin to run FF on Windows, and I don’t really know anything about that.</p>
      <p>But that’s just the pre-built package. The development builds (such as the one incorporating Spiro features) are a bit more involved to deal with. Michel has explained what to do with them, but it still goes way over my head.</p>
