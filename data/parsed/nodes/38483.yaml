      <p>Since the Gobuntu recipe, lots of modifications were made to fontforge and the recipe is now much shortened. A Spiro library is now available  <a href="http://libspiro.sourceforge.net/"><strong>here</strong></a>. You just install it and then compile fontforge with the standard recipe which has now replaced <a href="http://www.iro.umontreal.ca/~boyer/typophile/recipe.txt"><strong>recipe.txt</strong></a>. No need of the bytecode interpreter and my guess is that with the next build, installation on the mac will be fast and easy.</p>
      <p>Michel</p>
      <p>PS And, though I have not tried extensively the resulting binary, it looks completely functional.</p>
