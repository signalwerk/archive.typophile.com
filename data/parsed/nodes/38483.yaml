      <p>I followed the Gobuntu recipe almost as is on a ppc with 10.4.10 and got a running version. The recipe asks to define <code>TT_CONFIG_OPTION_BYTECODE_INTERPRETER</code> in the file <code>include/freetype/config/ftoption.h</code> where it is written<br>
      <code><br>
      Define TT_CONFIG_OPTION_BYTECODE_INTERPRETER if you want to compile a bytecode interpreter in the TrueType driver.  Note that there are important patent issues related to the use of the interpreter.<br>
      </code><br>
      Does anyone know what those important patent issues are?</p>
      <p>Michel</p>
