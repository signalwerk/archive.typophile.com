      <p>&gt; <cite>Perhaps these?</cite></p>
      <p>So, as long as the interpreter is not used for hinting, there seems to be no problem.</p>
      <p>What I get is not fully functional (for instance, I can’t import Raph’s files) but if you are in a hurry to see what is probably coming soon, you can try this <a href="http://www.iro.umontreal.ca/~boyer/typophile/recipe.txt">recipe.txt</a>. Just create some temporary folder, save <a href="http://www.iro.umontreal.ca/~boyer/typophile/recipe.txt">recipe.txt</a> it it, then <code>cd</code> there and type “<code>source recipe.txt</code>”. You will need to enter an empty password after the first line and then the installation password when you are asked; wget and darcs are not used. Patience required.</p>
