    html: |-
      <p>Building a Windows installer for FontForge is really quite cumbersome since Windows does not easily integrate X11, the Unix windowing system. Mac OS X ships with an optional X11 install right on the system DVD, AND it also contains all tools necessary to build (compile) FontForge. I have an easy shell script that downloads, compiles and installs FontForge and all its dependancies, all in one simple step — it would be more difficult on Windows. </p>
      <p>I uploaded my simple one-click FontForge installer onto:<br>
      <a href="http://www.font.org/software/fontforge/buildfontforge-macosx.zip" title="http://www.font.org/software/fontforge/buildfontforge-macosx.zip">http://www.font.org/software/fontforge/buildfontforge-macosx.zip</a></p>
      <p>Should work on Mac OS 10.5 and 10.4. You may need to first install subversion to get it work on 10.4. </p>
      <p>Adam</p>
