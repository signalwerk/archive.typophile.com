  html: |-
    <p>Translation Services </p>
    <p>Translationxperts, firm in its belief that businesses should focus on what they know and do best, provides translation services in the following language pairs only: </p>
    <p>         French - English<br>
             English - French </p>
    <p>Quality is an overriding concern for us. All work done by our associates and freelancers is carefully checked and revised before being returned to the client. Moreover, term glossaries are built and maintained, in conjunction with customers, to ensure that all text is consistent and adheres to client-specific or industry-specific terminology. </p>
    <p>Deadlines are rigorously observed, and our team is particularly skilled at translating large documents with very rapid turn around times. </p>
    <p>Fields</p>
    <p>         Special expertise in Administration &amp; Commerce, Science &amp; Technology, Communications &amp; Marketing.</p>
    <p>Documents</p>
    <p>         Administration &amp; Commerce: letter, contract, bid, form, report.<br>
             Science &amp; Technology: report, white paper, specification sheet, user guide, on-line help.<br>
             Communication &amp; Marketing: press release, article, speech, brochure, Web site.</p>
    <p>Website : www.translationxperts.com<br>
    E-Mail : <a href="mailto:info@translationxperts.com">info@translationxperts.com</a></p>
