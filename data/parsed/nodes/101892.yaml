    html: |-
      <p>Lo, long after I solved it . . .</p>
      <p>The answer is maddeningly simple: I was doing everything right, but FontLab and Windows' font preview funtions/tools simply do not reflect the actual kerning. You must test the font with any tool specifically designed for it. I use FontXPert's "Activate [font] Temporarily" functionality.</p>
      <p>FontLab's kerning/text etc. preview windows do seem to reflect the reality.</p>
