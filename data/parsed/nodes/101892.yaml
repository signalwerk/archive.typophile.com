    <p>I'm stumped; I'm not seeing kerning changes exported in FontLab, with I process that I *thought* had worked before. Here's what I do:</p>
    <p>I go to Window-&gt;New Metrics Window. I change to Text Mode, and type:</p>
    <p>.</p>
    <p>I change the Metrics Window to Kerning mode, and nudge the 'o' far enough to the right it's obviously wrong. I go to Tools-&gt;Quick Test As . . . </p>
    <p>And . . . I see no change.</p>
    <p>Maybe someone could tell me what steps I'm missing? I have Class Kerning with exceptions, and I've also tried rebuilding the Kern feature.</p>
    <p>Also, I have gotten this process to work by importing a commercial .otf file and saving it to .vfb, and after I make a kerning change and try the test, it will (if I remember) prompt me to rebuild the kern feature, and ask whether to save binary or compiled tables, and this only seems to work--rarely--when I select "compiled."</p>
