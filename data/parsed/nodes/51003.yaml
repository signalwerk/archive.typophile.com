    html: |-
      <p>If upper and lower case, Futura Mini or Avant Garde.</p>
      <p>- large x-height (less ink used in capitals)<br>
      -"missing" bits on letters, such as no tail on "t" and "j"<br>
      -minimal, single-bowl forms of a and g.</p>
      <p>Alternatively, a face that works well with ample letterspacing, such as DIN or Interstate, because it can be used smaller.</p>
      <p>Also consider a good editor, for shorter words, and the use of understatement and "white space" to convey your message.</p>
