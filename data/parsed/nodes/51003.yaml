    html: |-
      <p>mmm, dot matrix may work in some cases. stencil typefaces can look odd to the customers. </p>
      <p>how does Soho Gothic save ink: look at the upercase G of Soho Gothic it's minimalistic but still an easily recognizable G. another thing about Soho Gothic: it's an attractive, contemporary typeface, neither that bold like Helvetica Regular nor awkward like Arial.</p>
      <p>we don't print backgrounds, only headlines and logos. the usable letter weight of Soho Gothic for our purpose is Medium or Regular. bold and black would take up too much surface. hairline is not display except if you're lucky. in rare cases we can use stencil and hairlines. </p>
      <p>the banners are outdoor ads. it's about the effective surface that the letters occupy, the smaller the surface the less ink will be spent. we buy ink in gallons.<br>
      i would like to take bold typefaces but the ink is simply expensive at large banner sizes.</p>
