      <p>This is a peculiar question!  :-)<br>
      It sounds like you're not looking for huge savings, which makes this quest seem hopeful. Very light weights can't work for functional reasons, but here are some ideas:</p>
      <p>- Fonts with heavy trapping, like FB Amplitude or this:<br>
      <a href="http://www.type.fi/SuomiTang.html" title="http://www.type.fi/SuomiTang.html">http://www.type.fi/SuomiTang.html</a></p>
      <p>- Fonts that are made of up interrupted patterns, like:<br>
      <a href="http://www.myfonts.com/fonts/letraset/cabaret/cabaret/" title="http://www.myfonts.com/fonts/letraset/cabaret/cabaret/">http://www.myfonts.com/fonts/letraset/cabaret/cabaret/</a><br>
      (But contemporary.)</p>
      <p>- I think the best solution might simply be inline fonts:<br>
      <a href="http://www.myfonts.com/search?search%5Btext%5D=inline" title="http://www.myfonts.com/search?search%5Btext%5D=inline">http://www.myfonts.com/search?search%5Btext%5D=inline</a></p>
      <p>hhp</p>
