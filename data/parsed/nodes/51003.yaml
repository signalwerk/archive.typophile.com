      <p>the less ink you use per square foot of text, the lighter the average colour, and the less visual impact you have, so what's the real savings? </p>
      <p>If you use outline fonts, or an interupted pattern, you'll have more cutting time to make the paterns, which is probly more expensive than the ink. </p>
      <p>Maybe just apply a lighter coat or thin the ink?</p>
      <p>-=®=-</p>
