    <p>i'm looking for a ink-saving display typeface. it should have the following properties:</p>
    <p>1. sans or display.<br>
    2. contemporary (not cheap looking)<br>
    4. ink-saving.</p>
    <p>we air brush a lot of ink that is expensive on large banners up to 100 meters in length using laser-cut patterns. i have found a good, but still not the best choice: Soho Gothic Medium. do you know a better typeface for this?</p>
