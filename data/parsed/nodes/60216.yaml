    <p>I spotted these signs at Seattle’s Folklife Festival, a much-loved annual event drawing 100 thousand or so Northwesterners. Participants are gentle flute-playing, drum-circling, banjo-strumming, dope-toking hippie artists and performers of all generations. </p>
    <p>The perfect place for a True Believer warning of eternal damnation! Look how dynamic the typographic design and color on these. One is professionally printed, the other hand-stenciled.</p>
    <p></p><div class="imageWrap"><img src="/files/repent-signs-10i_3790.JPG"></div><br>
    <div class="imageWrap"><img src="/files/warning-sign-8i_6295.JPG"></div><p></p>
    <p>The sign he’s carrying isn’t enough, he also wears a sandwich board. This guy was dogged by the guitar-playing folkie behind him. </p>
    <p>I love how “rebellious wives and kids” are destined for hellfire along with murderers, thieves and sodomites. Enjoy this example of true folk art!</p>
