    html: <p>Gibson’s film of the Passion relies heavily on the meditations of St Anne Catherine Emmerich. One of the reasons I don’t like the film is that it is incapable of making a distinction between these pious mystical meditations and the Gospel account. It’s a mediaeval passion play given the Hollywood treatment, and what it loses of the simple piety of the mediaeval drama is not made up for by the realism of the gore; rather the opposite.</p>
