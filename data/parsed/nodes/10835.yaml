    html: "<p>&gt; How much rigidity is built in to the rest of the caps? <br> <br>What, you want a number?  :-) <br> <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/plat_reg.swf\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/plat_reg.swf</a> <br> <br>I think the bottom \"Q\" is better: it's less of an \"O\", more in character, and more balanced horizontally. <br> <br>BTW, I tested the word \"IRAQI\", since it might actually be the most frequent Q-not-followed-by-u/U word, especially these days... It came out OK, and seemed to strongly favor the second form too. <br> <br>hhp</p>"
