    date: 2002-02-15T01:19:00
    votes: null
    html: "<p> I hadn't much time to look at it. But a few things hit my eye... <br> <br>* I have a problem with the curve character. You are using more flat curves (Lc 's' e.g.) and very round ones (Lc 'c' e.g.). I would to try to make the 'flat' curves a little bit rounder. <br> <br>** Lc 'g': I would close his belly, or try to find a more subtle ending. The way it is now, the character is a little bit too much like ones we know from around 1900.... <br> <br>*** If this face is to become a face for newspaper, I wouldn't experiment too much with structure, as you did with Lc 'd'. I'd go more into changing details. <br> <br>**** the eye of the Lc 'e' is too big, i think. The character is unbalanced. <br> <br> <br>The font is promising, although it still need a little bit of balance and unified rythm. <br> <br>Jacques </p>"
  - id: 68263
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 16 Feb 2002 — 2:44pm
    date: 2002-02-16T14:44:00
    votes: null
    html: "<p>Guys, thanks for all the feedback so far. <br>It's proving even more valuable than I expected. <br> <br>Stephen: <br>&gt; the italic is very lovely <br> <br>Wow, thanks. I'm surprised to hear that. <br> <br>&gt; the overhangs on the 'f' and 'r' distract.  <br> <br>In the Italic, right? Well, I think I agree. <br>Probably the paucity of serifs in the Italic <br>is causing the beaks to stand out too much. <br> <br>&gt; The beaks bigger? A la Eureka?  <br> <br>(I assume you mean in the Roman only, <br> and not the \"f\" or \"r\" in any case.) <br> <br>Eureka is a great design, and there's stuff in Patria (eg the <br>serifs) that's pretty similar. Some of my beaks are larger, and <br>some of them *need* to be larger, but I'll note one significant <br>difference (which is also the case with Foundry's Form, as well <br>as FF's new Zine, and Parkinson's Azuza): the beaks are abrupt, <br>not adnate like mine. Formally, that's the way to do it, since <br>they then match the structure of the serifs. And I almost went <br>that way myself, except I realized that it makes the design too <br>mechanical in a way. I wanted to express more depth in my design, <br>so I'm going for a different level -or maybe flavor- of harmony, <br>even though I'll surely get some flack for it. <br> <br>I might still change my mind, but some people have actually <br>appreciated the duality, so I've kept it. But if I do change <br>my mind, I'd soften the serifs instead of hardening the beaks. <br> <br>&gt; Why hesitate on the 'U'? <br> <br>Because many people hate it. My main reason for preferring it <br>is authenticity: I think that's how the Romans would've made it. <br> <br>My \"d\" is in a similar vein, except I found a compromise <br>between the pure structural form (like Gill used), versus <br>the established one (which is way too homogenous with some <br>other characters -most notably the \"b\"- for my taste). <br> <br>Oh, and there's some of my Alphabet Reform in there too...  :-) <br> <br>Martin: <br>&gt; I don't think any newspaper designer would <br>&gt; want to use [those numerals] as they're more <br>&gt; designery (is that a word?) than utilitarian. <br> <br>You have a point. <br> <br>BTW, the best word I've encountered for <br>what you're describing is \"mannered\". <br> <br>&gt; The italic is a little too subtly angled. The word \"system\" <br>&gt; hardly stands out at all in that sample paragraph. <br> <br>&gt; I don't think it's neccessary to make the italic <br>&gt; version so similar in lettershape to the regular. <br> <br>This is a complex issue, and I worry about getting too deeply <br>into it here. I think I'll start another thread (eventually). <br> <br>For the moment, let me quickly state the following (hoping <br>that it's not too cryptic): when it comes to text fonts, I <br>think there's a huge difference between what we consiously <br>see versus what we think we see when immersed. <br> <br>&gt; I cannot see this working as a headline or subheading font, <br>&gt; unless you have something up your sleeve for the bold and <br>&gt; black versions. <br> <br>You're right. <br>The display cuts would have to be much more regular. <br>Note that my bold is a text bold, not a display bold. <br>(But as with the italics, a full elaboration of the <br> argument is certainly needed.) <br> <br>It's actually an interesting paradox, the text versus <br>display conflict. Certainly, a text font can be made to <br>look less ugly than it can get away with at small sizes, <br>but I ponder the true limits of that. I have this hunch <br>that any real -I mean really real- text font has to have <br>a certain ugliness. If that sounds crazy, just look at <br>some of Tracy's work. <br> <br>But maybe Patria could be less ugly. <br> <br>&gt; The \"g\": I would have thought that with a vertically stressed <br>&gt; font you should avoid the diagonal swoop of the top of the <br>&gt; lower bowl. Apart from the \"s\" this is the only letter that <br>&gt; doesn't conform vertically. <br> <br>Not surpisingly, I've thought long and deep about the \"g\". <br>My conclusions are somewhat unorthodox, but if I don't <br>follow them I'd be hypocritical. More to come... <br> <br>Stephen: <br>&gt; I think they stand out *too* much, and only because the weight is <br>&gt; too light. Even it up with the roman and keep the angle as it is. <br> <br>Note also that the x-height of the Italic is smaller. <br> <br>The weight calibration issue doesn't bother me, because everything is <br>on an axis. I just need to do some real print runs from Lino output to <br>decide the exact weight locations. What is increasingly worrying me, <br>though, is the extremes: they might be too close, especially the Bold. <br> <br>Tiffany: <br>&gt; maybe there is too much 'scotch' in [the numerals]? <br> <br>Now that's interesting. Do you mean that they're too <br>curly or something? Or that they need to sober up?  :-) <br> <br>&gt; The '2', '4' and '6' seem the most in need a fewer curves?? <br> <br>(What about the \"9\"?) <br>I agree on the \"2\", but the \"4\" is my darling. <br>As for the \"6\"/\"9\", I'm probably going to change them <br>completely, making them bowl-with-curved-diagonal-stick. <br> <br>(BTW, concerning the numerals, I'm sure you can tell that they're coming <br> from that thread I once started about \"Latinized Arabic\" numerals.) <br> <br>Stephen: <br>&gt; [The 'f' and 'r' hang too much] in the roman as well. <br> <br>Remember my penchant for promoting boumas (word shapes). <br> <br>The Roman's \"f\" especially I'm pretty content with. <br>But its \"r\" is admittedly more difficult to justify. <br> <br>&gt; Not fan of the 'g' either. <br> <br>:-( <br> <br>&gt; I'd buy. <br> <br>Cool. Just send me 500 Euro in advance, wire- <br>transfer to my Cayman Islands account is fine. <br> <br>Ole: <br>&gt; can you explain the design concepts of the fl and fi ligatures <br> <br>Well, Bob, I'm very happy you asked that question!  :-) <br> <br>Different fonts need different tactics for the f-ligatures, <br>but for some reason most designers appear to be to shackled <br>to some strange standards that were established who know how <br>long ago and for what peculiar reasons (maybe for showmanship). <br>My ligatures look like that because to me making a font work <br>is more important than pleasing the establishment. If my x- <br>height were smaller, I'd probably merge the \"f\"'s beak with <br>the \"i\"'s dot in the \"fi\". On the other hand, the conventional <br>\"fl\" ligature in particular usually looks horrid; it's really <br>a mannered display-font trick, not something text-worthy. <br>I decided to chop off the el's top serif. <br> <br>Martin: <br>&gt; there seems to me to be not enough difference in the weights. <br> <br>This is actually the same deal as with <br>the Italic issue you were making above. <br> <br>&gt; looking at the screen is less than optimal <br> <br>It's difficult to over-emphasize that. The lack of <br>congruence between the screen and the actual printed <br>end-result is really staggering. Even a 1200 dpi laser <br>doesn't cut it. <br> <br>&gt; it's of primary importance in designing a text family. <br> <br>Totally. <br> <br>Jacques: <br>&gt; You are using more flat curves (Lc 's' e.g.) <br>&gt; and very round ones (Lc 'c' e.g.). <br> <br>&gt; I would to try to make the 'flat' <br>&gt; curves a little bit rounder. <br> <br>This opens up another interesting world! Remembering that my <br>intention is to give Patria a certain rigid masculinity, let <br>me ask: what's more rigid, a perfect circle, or an ellipse?... <br> <br>I totally agree that making the \"s\" more curvy would make <br>things more harmonious, overall. But a very circular form is <br>perhaps \"closer\" to a straight form in a more nebulous way. <br>Also, a curvy \"s\" would make the font too feminine. Note the <br>other important glyphs which have some unexpected straight <br>segments: \"a\", \"e\", \"g\". <br> <br>&gt; Lc 'g': I would close his belly, <br>&gt; or try to find a more subtle ending. <br> <br>Like I said above, I'll try to elaborate more <br>in the future, but for now let me just say this: <br>1. I believe that the closed-bowl bicameral \"g\" is a flawed <br>   structure in terms of the nature of the Latin alphabet. <br>2. The strong ending reinforces boumas. <br> <br>&gt; If this face is to become a face for newspaper, <br>&gt; I wouldn't experiment too much with structure, <br>&gt; as you did with Lc 'd'. <br> <br>That's a good point. Although I feel my structure <br>is more readable, it might be going too strongly <br>against expectations. Gill got away with a much <br>more unconventional form... but that was Gill! <br> <br>&gt; the eye of the Lc 'e' is too big <br> <br>It's too big for optimal readability, true. But that's <br>one place where I decided to sacrifice a little bit of <br>readability for character. Some other places: <br>1. The \"a\"'s middle bar is too rigid. <br>2. The \"a\", \"g\" and \"s\" are all too wide, <br>   and too big-headed (which are actually <br>   structurally related things). <br> <br>BTW, check out this \"e\" (on the bottom-right): <br><a href=\"http://www.myfonts.com/Character0065Style8019.html\" target=\"_top\">http://www.myfonts.com/Character0065Style8019.html</a> <br>It's butt-ugly, but man, does it ever work like a charm! <br> <br>Anyway, I should consider making a more tame/readable version <br>of Patria, but in any case the differences will be very subtle, <br>at least on the surface. What to call it?... <br> <br>BTW, very much of these critiques here seems to me to be related <br>to the display versus text issue. When I hesitate about some of <br>the good points you all make, it's because I'm cautious in my <br>hazy understanding of the feral wolf that is text face design, <br>versus the domesticated hound that is display design. <br> <br>hhp</p>"
