    date: 2002-08-16T21:46:00
    votes: null
    html: <p> Seriously digging the Italic. I haven't actually done an italic yet, but I'm inspired by the seeming inconsitent slant. Is that an optical thing, or are the vertical strokes of a slightly varied slant? Also, the italic 'k' is just amazing. The shallow slant of the leg is spectacular. <br> <br>I'm having a hard time with the tail on the g. It kind of meanders without strength or direction. The concept is not that far off; as a matter of fact, I really like the g from harrier. I would recommend consulting harrier, but also drawing a bunch of quick, strong lineal versions of the character and consulting the curves that come from a bold stroke of the hand. It also feels like it's tipping forward a bit. </p>
  - id: 68296
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 16 Aug 2002 — 11:13pm
    date: 2002-08-16T23:13:00
    votes: null
    html: "<p> &gt; I'm inspired by the seeming inconsitent slant. <br> <br>Uh, that's a technical defect - the slants are all equal.  :-/ <br> <br>Certain forms (like the \"i\"), which are sometimes called pothooks, appear to rotate counter-clockwise. I thought that because my slant is very slight (1/16 = ~3.58 degrees), and because my serifs are small, I could avoid having to make optical corrections - but I was wrong. <br> <br>The structure of the \"k\" comes from my Alphabet Reform work. <br> <br>Anyway, I'm glad you like the italic - thanks! <br> <br>&gt; I'm having a hard time with the tail on the g. It kind of meanders without strength or direction. <br> <br>Well, I hope that the tail has \"inner strength\": note the rigid section in the middle. But quite possibly the join is too soft - maybe something more angular (like in the cedilla?) would be better. One thing I won't do is make the top of the tail horizontal: that has no place in the Latin alphabet - sorry everybody. Also, I don't mind picturing what the/a hand might do in drawing a letter, but I don't actually draw forms by hand - just the outlines - otherwise it's not really type. The forms are in my head - the less things interfere in their eventual physical manifestation, the better. <br> <br>&gt; I really like the g from harrier. <br> <br>Interesting. <br>Harrier's is the original, and Patria's was derived from it (mostly) my shortening things vertically. Maybe something got lost in the translation (or something needs to be added). <br> <br>Thanks for the comments! <br> <br>hhp </p>"
