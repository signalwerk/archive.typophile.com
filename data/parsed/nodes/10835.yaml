    html: "<p> An impressive piece of work that is swimming in subtlety. It is very readable, from what I can tell of the small paragraph.  <br> <br>I can tell you what I don't like far easier than what I do, because I like the sum of the parts, but not neccessarily the parts themselves.  <br> <br>I don't like the numbers at all. I think you should go back to the drawing board with them. I don't think any newspaper designer would want to use these as they're more designery (is that a word?) than utilitarian. <br> <br>The italic is a little too subtly angled. The word \"system\" hardly stands out at all in that sample paragraph. Also, given the overall aesthetic I don't think it's neccessary to make the italic version so similar in lettershape to the regular.  <br> <br>I cannot see this working as a headline or subheading font, unless you have something up your sleeve for the bold and black versions. The individual letters are not pretty enough, at least not in this regular version, and at least not in my opinion.  <br> <br>The \"g\": I would have thought that with a vertically stressed font you should avoid the diagonal swoop of the top of the lower bowl. Apart from the \"s\" this is the only letter that doesn't conform vertically.  <br> <br>That \"U\" works fine, like Stephen says. But apart from that one instance I can only say that I like the overall effect, but I can't point to anything specific as I think that for the most part you've successfully designed a font that works for word shapes and high readability. </p>"
