  - id: 68278
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 7 Aug 2002 — 5:20pm
    date: 2002-08-07T17:20:00
    votes: null
    html: "<p>So I've been ruminating about the Display cut of Patria. I know what structural mods I'll be making to the lc (like making the \"d\" mainstream), and some global changes too (more delicate serifs, higher contrast, narrower, etc.), but I'd really like to make all the caps line up: no descenders. The \"J\" is easy, but the \"Q\"... <br> <br>I did some rough outlines: <br><a href=\"http://www.themicrofoundry.com/other/patria_q.gif\" target=\"_top\">http://www.themicrofoundry.com/other/patria_q.gif</a> <br>Any preference or comments? <br> <br>hhp</p>"
  - id: 68279
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 7 Aug 2002 — 6:19pm
    date: 2002-08-07T18:19:00
    votes: null
    html: <p> Hrant, my thought is that if you're going to take away the descenderness of the Q's tail, then perhaps you should consider doing something inside the counter, either penetrating into the counterspace or perhaps a loop like -- what's a type that does that . . . okay, like Miller for instance. I don't recall the overall characteristics of Patria offhand, so I can't speak to which approach might be more appropriate stylistically.  <br> <br>My point is that without a descending tail, you're limited to how long you can make it, which means that it's going to be difficult to differentiate from the 'O', unless you also do something to distinguish it inside the counter. <br> <br>-- K. </p>
  - id: 68280
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    date_raw: 7 Aug 2002 — 6:37pm
    date: 2002-08-07T18:37:00
    votes: null
    html: <p> Why no cap descenders in the titling font? </p>
  - id: 68281
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 7 Aug 2002 — 10:28pm
    date: 2002-08-07T22:28:00
    votes: null
    html: "<p> &gt; perhaps you should consider doing something inside the counter <br> <br>Yeah, I guess. Pisses me off. <br> <br>Patria has a certain severity (especially in the caps), so it might be hard to avoid cuteness with an internal tail. But I'll try. <br> <br>&gt; what's a type that does that <br> <br>Tankard's Aspect does it very well. <br> <br>&gt; without a descending tail ... it's going to be difficult to differentiate from the 'O' <br> <br>To some extent - but remember: Display cut. <br> <br>&gt; Why no cap descenders in the titling font? <br> <br>Well, for this Display cut I would actually like to have alternates for the \"J\" and \"Q\" with descenders (although not nearly as long as the ones in the Text), but the main forms I think should fit between the lines, because you don't want a nice, solid all-caps setting ruined by a protrusion. And if you set multiple lines of caps (not necessarily long ones), a descender ruins your linespacing. <br> <br>hhp </p>"
  - id: 68282
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    date_raw: 7 Aug 2002 — 11:32pm
    date: 2002-08-07T23:32:00
    votes: null
    html: <p>Really? I welcome an occassional descender in cap-only  <br>headlines (see below). But I can't fault you for offering  <br>an alternate. <br> <br><img src="http://www.typophile.com/forums/messages/29/1981.gif" alt="quelled"></p>
  - id: 68283
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 8 Aug 2002 — 4:51am
    date: 2002-08-08T04:51:00
    votes: null
    html: "<p>Man, I sure do <i>love</i> Dante. Mmmm. <br> <br>Hrant, linguistic frequency! A descending J or Q here or there won't ruin your linespacing. If you're spacing tight enough for the odd descender to interrupt, then you've probably got other problems as well. <br> <br>But, back to your Q. Okay, if a loop would be too cute, then do something different. My point is to change the shape of the counter. Maybe just take your tail and jab it up and in to the counter. That might be severe enough ;-) <br> <br>Your point is taken, though: perhaps this is not so important in a display cut. Still, a little more something seems to be required in your samples. <br> <br>If I had to pick one, I'd go with the last example. Since it's almost always going to be followed by a U, can you extend the tail just a little more? (What other languages use Q and what letters follow?)</p>"
  - id: 68284
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 8 Aug 2002 — 8:30am
    date: 2002-08-08T08:30:00
    votes: null
    html: "<p>Stephen, funny! <br> <br>---- <br> <br>&gt; My point is to change the shape of the counter. <br> <br>I love that type of thing (since it makes the \"Q\" less of an \"O\"), and I've drawn some like that for Paphos (although descending*), but I've yet to arrive at a form that's sufficiently mainstream. <br> <br>&gt; can you extend the tail just a little more? <br> <br>That would be nice - I'll have a good length when I test the \"U\"/\"u\" after it. <br> <br>&gt; Maybe just take your tail and jab it up and in to the counter. <br> <br>Yeah, I'll try that. <br> <br>&gt; What other languages use Q and what letters follow? <br> <br>Well, in the transcription of Arabic to Latin you can get almost anything after a \"Q\"/\"q\"**. But some kerning pairs should be good enough to address such rarities. <br> <br>* <a href=\"http://www.themicrofoundry.com/other/paphos_ucq.gif\" target=\"_top\">http://www.themicrofoundry.com/other/paphos_ucq.gif</a> <br> <br>** From \"Making the Alphabet Dance\": tariqa, shuqba, qcepo (medical term), taluqdar, qere, cinqfoil, iraqgate, fiqh, qiviut, feqjakuqu (Albanian place name), aqkiyenik (Amerind), taqlid, luqman, qnaitra, qoph, maqpiato (from Ethology), zaqqum, miqra, buqsha, qtrah, quite, qvint, acqwyte, clerqx (Dutch!), qyrghyz, ahmaqzai. <br> <br>hhp</p>"
  - id: 68285
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 9 Aug 2002 — 3:52pm
    date: 2002-08-09T15:52:00
    votes: null
    html: '<p>So I got a bunch of Display-cut "Q"s for you: <br><a href="http://www.themicrofoundry.com/other/nour&amp;patria/plat_qs.swf" target="_top">http://www.themicrofoundry.com/other/nour&amp;patria/plat_qs.swf</a> <br> <br>Choose one, or critique, please!  :-) <br> <br>hhp</p>'
  - id: 68286
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 10 Aug 2002 — 5:15am
    date: 2002-08-10T05:15:00
    votes: null
    html: <p> I thought the descenderless Q was for all-caps titling. Anyway. . . purely on aesthetic grounds, just taken as they are here, I like numbers 2,3, &amp; 5. (1-12, left to right, top to bottom) The corners are subtle, but they help differentiate from the O. I'd still like to see the tail extended slightly beyond the right edge, maybe 15-20 units. I think the bottom concept works, but without seeing the rest of the caps I can't judge how it fits in. Among the four, I prefer number 12. I'm not crazy about the extra spur inside, but 10 is preferable to 11. </p>
  - id: 68287
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 10 Aug 2002 — 9:48am
    date: 2002-08-10T09:48:00
    votes: null
    html: <p> &gt; I thought the descenderless Q was for all-caps titling. <br> <br>Well, the descenderlessness (!) of the Display-cut "Q" is to ensure solid lines in case of all-caps setting, but the main usage is *still* mixed-case. I will have an alternate that descends (like the top-left one but a lot shorter), but this is for the main form. <br> <br>&gt; I think the bottom concept works <br> <br>Note that the "serif" form (on the outside) is the only such form in the font, which might be a problem. But anyway the only good reason I can think of to have a part on the inside is if otherwise it looks too much like an "O". Since the inside part is a bit disruptive, and the top two rows contain plenty of designs that are sufficiently different than an "O" (especially for a Display cut; and especially the ones with a corner at the bottom-left, like you said), I think I won't go inside. <br> <br>Thanks for the feedback! I've narrowed it down to like 4 choices, and I'll have those up soon. <br> <br>hhp </p>
