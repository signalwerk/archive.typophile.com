    date: 2002-03-12T15:17:00
    votes: null
    html: "<p> You're right, my wording was messy. What I meant by \"classicist\" was somebody who says \"this is the way it used to be done, so this is the way we should do it\". With \"theory\" (and please don't waste anybody's time nitpicking about typos in such an informal place) I was indeed pretty hazy, but what I did mean was a process by which tradition is often refuted. This is also related to the eternal battle between theory and practice, between people who paint signs for hardware stores versus those who try to understand -and improve- the underlying structures. <br> <br>BTW, not dismiss; dislike, and only on a personal level. Which doesn't mean I don't respect Catich's *work* (just like so many people hated Jan van Krimpen, but admired his designs, and even thoughts). In fact, on my next trip to UCLA I will be checking out a copy of his \"Reed...\" book, to see what I can learn from it. <br> <br>Now, two questions (for now) to you: <br>1. What do you think of Adobe's Trajan? <br>2. Are you the same person as \"Teri\"? <br> <br>If you refuse to answer these questions, then I think I (and most probably others) know who you really are. <br> <br>hhp </p>"
  - id: 68269
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 14 Mar 2002 — 2:24pm
    date: 2002-03-14T14:24:00
    votes: null
    html: "<p>Partly to clarify the development of Patria, but also hoping to spur others into providing glimpses into their work method, I thought to present a partial elaboration of Patria's development. BTW, it's pretty jet-set, so you might even enjoy it! <br> <br>Nour came first, and although it incorporates much of my thoughts on readability, it's based on the first style of Armenian type (which is still used, but is seen by many as being old-fashioned at best - I won't go there here/now). This first Armenian type was in turn was based on medieval Armenian manuscripts - a sample: <br><a href=\"http://www.armsite.com/miniatures/mnshow.phtml?slide=3\" target=\"_top\">http://www.armsite.com/miniatures/mnshow.phtml?slide=3</a> <br> <br>Here's one of the six sheets of drawings I made for Nour, while I was in Yerevan (during the summer of 2000): <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour_yerevan.gif\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour_yerevan.gif</a> <br> <br>Since I consider \"authentic\" Armenian writing to have a slant (noting again that Armenian doesn't really need italics), but weighing that against the bulk of current Armenian designs (which are upright), and furthermore minding readability, I decided to give the font a slight slant, specifically 1/16 = ~3.58 degrees. And this is actually where the slant of Harrier and Patria-italic comes from. <br> <br>Also, since I had plenty of time and no handy access to a computer, I went ahead and drew the letters as close to their (hopefully) final form as I could. It feels like I did more erasing than drawing, but as you can see I still made some small markings concerning adjustments. But in the end, only one letter (out of 38 x 2 characters) underwent a structural change. <br> <br>During ATypI's conference in Leipzig I realized that I simply *had* to make a Latin partner for Nour, and the evening after I went to a bar (called \"Letterman\"!), and over some Obsolut Mandarin I drew some rough stuff: <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier_leipzig.gif\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier_leipzig.gif</a> <br>I with I could blame the vodka for the poor quality, but the truth is my freehand-drawing skills suck. <br> <br>A couple of days later I drew these at a sushi bar in Frankfurt: <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier_frankfurt.gif\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier_frankfurt.gif</a> <br>It was over some Sapporo and a spider roll, so I guess that explains \"krab\"... <br> <br>The next day in Amsterdam, a few hours before boarding my plane back to LA, I was having some mint tea in a place called Goa, and I made a breakthrough: <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier_amsterdam.gif\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier_amsterdam.gif</a> <br>I say breakthrough because I figured out exactly how to apply my beloved \"rigidity\", and drew the \"a\" and \"e\" (a couple of *very* important characters) to satisfaction. You can also see the original \"g\", which I saw as too rigid in the end. That \"g\" also had a \"rationalist\" stroke contrast distribution, but I decided to compromise it with what other type designers expected to see.  :-/ <br> <br>Back in LA, I started doing the \"scannable\" drawings, but since I then had much more time-pressure as well as easy access to a computer, I didn't bother to \"normalize\" the weight, slant, width, or even the proportions - since those can be done with software. I drew the structures, and experimented a bit too (note the \"k\"). <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier_la.gif\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier_la.gif</a> <br> <br>After a pretty long, sporadic process, I ended up with the beta version of Harrier (around the spring of 2001): <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier-beta.gif\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier-beta.gif</a> <br> <br>At this point, I decided to make a somewhat complex \"balanced\" typeface system which combines Armenian and Latin fonts in different ways to maximize versatility. Among other things, this included the creation of the weight extremes for each of the 5 master designs. Harrier changed a little and became the Latin style subordinate to Nour, and it also spawned Patria and its italic, in parallel. After that, Patria got a subordinate Armenian style - which looks a lot like most of those current Armenian designs I mention above! <br> <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/patria-italic.gif\" target=\"_top\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/patria-italic.gif</a> <br> <br>Although different in proportions, \"serif-ness\", terminals, and even some characters (like the \"a\" and \"g\"), the two are structurally the same. As for the roman of Patria, it also comes from Harrier, but it required deeper changes, like in the arches of \"hmnu\", the armature of the \"k\", and other places. <br> <br>Patria's atypical provenance makes it admittedly somewhat unorthodox, but I hope I've applied everything with enough subtlety to avoid rejection. <br> <br>One last thing: I've decided to make some improvements to Patria, but one thing continues to escape resolution... Should I reconcile the abrupt serifs with the \"adnate\" (smooth) beaks (like in the lc \"s\"), or should I hope that they form a higher order of harmony (but maybe to the point of discord)? And if I reconcile them, should I make the serifs smooth (going towards early 20th century transitional designs, like Times), or should I make the beaks abrupt (like a lot of contemporary work - Eureka comes to mind)? Once I answer this line of questioning (hopefully with your help), I can start thinking about releasing this thing already! <br> <br>hhp</p>"
  - id: 68270
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 15 Mar 2002 — 5:53pm
    date: 2002-03-15T17:53:00
    votes: null
    html: "<p>BTW, here's a rough scan of page 29 (28 is the explanatory text) of \"Reed, Pen, &amp; Brush Alphabets\" by Catich, showing Petrarch: <a href=\"http://www.themicrofoundry.com/other/catich_petrarch.gif\" target=\"_top\">http://www.themicrofoundry.com/other/catich_petrarch.gif</a> <br> <br>Maybe it's kindest for me to simply say: no comment... <br> <br>But I can't help asking this: <br>&gt; As a calligraphy student of one of Father's disciples <br> <br>Who was this disciple, exactly? <br> <br>hhp</p>"
  - id: 68271
    user_id: 533
    user_name: gulliver
    user_path: null
    date_raw: 26 Mar 2002 — 2:50pm
    date: 2002-03-26T14:50:00
    votes: null
    html: <p> What a cool lc "g"! &gt;;] <br> <br>Seriously, I like the "g" a lot, even if (or, perhaps, "especially because") the stress isn't strictly vertical. I think some variations in stress add character to a face, and keep the face from having too much page sparkle and/or monotony. I also think that, with characters such as lc "a", "g", "s", UC "G", "Q" "S", et al., some variations in stress are appropriate to the glyphs' structures. <br> <br>David </p>
  - id: 68272
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 26 Mar 2002 — 3:41pm
    date: 2002-03-26T15:41:00
    votes: null
    html: "<p>&gt; the stress isn't strictly vertical. <br> <br>As you can clearly see by the Amsterdam sketches, my original \"g\" had vertical stress, because -just like the logic in my latinized arabic numerals idea- it makes sense. But even after I softened the join it still looked too strange. On the other hand, the conventional structure with the thick, monotone bar was just as bad (even when I canted it clockwise - those totally horizontal ones I find especially abominable). <br> <br><a href=\"http://www.themicrofoundry.com/other/gs2.gif\" target=\"_top\">http://www.themicrofoundry.com/other/gs2.gif</a>  Please ignore those ugly ears... <br>Left: Original v-stress version. <br>Right: Mostly conventional version. <br>Middle: \"Balanced\" version. <br> <br>And as you hint, the non-rational (but entirely acceptable) stress in the conventional lc \"s\" was my guiding light. That and the lc \"g\" in Zapf International: <br> <br>http://www.myfonts.com/CharacterInStyle0067-731.html <br> <br>hhp</p>"
