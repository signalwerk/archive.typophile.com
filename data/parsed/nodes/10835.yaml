    html: <p> &gt; I've always been a fan of a wide range of weights <br> <br>Well, that's certainly the norm these days*, and it can often be very useful. What bugs me about it is that -in a text face- it doesn't really make 100% sense, and it can confuse the spirit of a design, especially if everything is interpolated between the extremes. But if/when I make a display version, it will definitely need to have much further extremes. <br> <br>* Luc[as] de Groot is the master of this. <br> <br>&gt; Sexy type! <br> <br>I like that. Can I quote you?  :-) <br>Thanks for the encouragement. <br> <br>I'll probably be selling it through MyFonts as soon as it's ready - hopefully in a couple of months. <br> <br>hhp </p>
  - id: 68266
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 10 Mar 2002 — 5:55pm
    date: 2002-03-10T17:55:00
    votes: null
    html: "<p> &gt; How exciting it is to see that the teachings of Father Catich are still being studied. <br> <br>Wow - I'm embarassed. <br>I certainly wish that I'd studied them already (I've only perused his \"Origin of the Serif\"/Trajan work), but of course now I will - and I'm very happy to have heard this before releasing Patria: chances are I'll be able to improve it as a result. <br> <br>Well, so much for thinking I was being just a bit original... :-/  I guess it's like what Goudy said about the old folk, one more time. I've gotta check this stuff out - thank you! In the mean time, let me reveal something: Patria italics is derived *directly* (I mean Fontographer-directly, plus tweaks) from the Roman, mostly because I believe in Morison's sloped-roman ideas (in spirit if not details), his one good original (?...) idea, as far as I'm concerned. So that's where it's probably different than Catich's ideas (I hope...). <br> <br>Also, you could say that Patria has some Gill in it (like look at Joanna's italic), and that might tie in to Catich too. Patria has an inscriptional/lapidary flavor, so maybe that's another relation. BTW, I didn't realize that Catich had \"theorical\" leanings - I thought he was essentially a classicist. <br> <br>hhp </p>"
  - id: 68267
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 10 Mar 2002 — 9:25pm
    date: 2002-03-10T21:25:00
    votes: null
    html: "<p> Correction/Elaboration: <br>The development of Patria was so strange that I get confused myself sometimes! The italic was *not* derived from the roman - they're more like sister and brother. The father being a third design code-named Harrier, which is essentially a pretty unorthodox semi-serif sloped roman. It's a stand-alone design, but it spawned both the roman and italic of Patria (in parallel). Now here's where it gets really strange. Harrier was inspired by Nour (Patria's Armenian counterpart) and subsequently became a Latin design subordinate to it*; Nour itself is [in part] based on the first Armenian type (made in Venice in the first quarter of the 16th century), which was the principal style of type until about a hundred years ago, and still gets a lot of use. And this first type itself was based on medieval manuscripts. <br> <br>* Patria eventually got a subordinate Armenian design - to balance everything out. But there is no Armenian italic - it is not really needed, thanks to a floating emphasis mark (that can be placed on any vowel). <br> <br>hhp </p>"
