    html: "<p> &gt; Maybe opening up the curve at the base of the \"2\" might help unify the three figures? <br> <br>I think so. <br> <br>Regarding the weight gradation: <br>I don't expect people to mix weights that are one position apart (even though it's not out of the question). I envision two pairings: Regular &amp; Bold, and Light &amp; Demi (the latter possibly useful in situations of significant ink gain). The question is: Is there enough contrast between each of those two pairs? Even if I feel that contemporary ideals of weight contrast are exagerated, the answer might very well still be: nope.  :-/ <br> <br>I think I need more room on the weight axis at the heavy end for sure, maybe even both ends. <br> <br>hhp </p>"
