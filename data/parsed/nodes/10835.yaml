  - id: 68274
    user_id: 912
    user_name: David Cabianca
    user_path: null
    date_raw: 7 Apr 2002 — 6:37pm
    date: 2002-04-07T18:37:00
    votes: null
    html: <p> Hrant, <br> <br>Your font is really beautiful. I have been following the discussion and have learned a lot. I have started a MS Word file and have been able to follow the discussion and study the work via a hardcopy. [Jared and Joseph, if you read this, The forums would make a great edited compilation some day :-) and I'd be interested in helping out.] I was curious to know more about your background... Where did you learn so much about type design? Did you work under a mentor? How much type design/reading did you do in school? Any anything else you can suggest for an amateur. <br> <br>dc </p>
  - id: 68275
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 7 Apr 2002 — 7:25pm
    date: 2002-04-07T19:25:00
    votes: null
    html: "<p>Thanks for the compliment. <br>I know some things about type design, but I'm missing more than I know - and always will! <br> <br>For many years I was a typographic hermit, but for the past four years I've been discussing type with others and more importantly reading all the \"main\" books, as well as more \"exotic\" ones that appeal to me. The value of a good library (especially one with Inter-Library-Loan capability) cannot be overstated. Part of the reason for this is that -even if you're a submissive person, which I'm not- practically nobody will teach you too much these days unless you pay them. And since there's little money in type design now, this doesn't tend to work out... <br> <br>But even more important than reading and learning is *thinking* - on your own. I do that a lot, and it helps to guide my creativity too. One other thing: some people are better at learning through doing, others (like me) through thinking. You have to do both, of course, but it's important to take account of what kind of person you are - especially if you have a mentor (who might be incompatible with your \"style\"). And if you do have a mentor/teacher, always keep a core of doubt - see him as an equal, although you might have to keep that a secret from him. <br> <br>BTW, the Typophile boys *have* made a \"compilation\" (but just the first 50 fonts, so far): <br><a href=\"http://typophile.com/gallery/index.html\" target=\"_top\">http://typophile.com/gallery/index.html</a> <br> <br>hhp</p>"
