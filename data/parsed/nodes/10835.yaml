    html: <p> Well I guess it's up to me to continue to play the devil's advocate - apart from the fact that the italic is growing on me in this form.  <br>BUT...there seems to me to be not enough difference in the weights. We're talking infinitessimal amounts, but nevertheless I think there's just not enough difference between the regular and bold. Of course, looking at the screen is less than optimal, and I'd probably be proven wrong looking at the color of a printed page, but I just wanted to raise this concern as it's of primary importance in designing a text family. (And yes - I got the weights wrong when I tried designing my own text family.) </p>
