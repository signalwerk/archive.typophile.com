  html: |-
    <p>Hello,</p>
    <p>I’m looking for a good sans to be used with Arnhem for setting a wide variety of print materials, reports, brochures, price lists, etc. Farnham may make an occasional appearance as a display/titling face. Something contemporary with a nice dose of tradition like Arnhem. Univers is in the running, though something with a little more personality would be nice. I’ve looked at Fresco Sans but not sure how that would work with Arnhem and it didn’t feel quite right. It would be great if the uppercase G matched the tail-less Arnhem G and the K matched how the limbs meet the vertical at a point. And if the outer profile of the M was vertical instead of inclined ala Myriad. The materials will be related to international development, sustainability, and the like. Connotation would be humanist over corporate, classic printed Grotesks over computeresque.</p>
    <p>Thanks very much.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080906162228/http://www.typophile.com/node/34541" class="topic-previous" title="Go to previous forum topic">‹ Alternatives to The Mix / The Serif?</a> <a href="/web/20080906162228/http://www.typophile.com/node/34386" class="topic-next" title="Go to next forum topic">Body Copy : Humanist Slab Serif ›</a></div>
