      <p>That /g/ is just not reading for me at all. It looks like it was cut off in a printer error. Have you considered a complete, closed bowl? Maybe even a one-story /g/? I'd also suggest bringing in the flag on the /1/ a bit, probably in length but perhaps in weight, too. It's too heavy for me as of now.</p>
      <p>Other than that, it looks quite fun!</p>
