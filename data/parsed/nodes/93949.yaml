    <p>This typeface is a custom face for a car designers portfolio.<br>
    I want to do something maybe a bit generic with some nice details to bring variation/ something fresh.<br>
    Please, tell me what you guys think and if someone can suggest reference material, please let me know.<br>
    As you can see from my fonts I'm familiar with Audi's typeface already...</p>
    <p>Text from wikipedia (not about the designer, just about random Korean and Japanese stuff)<br>
    Everything is still indesign optical.</p>
