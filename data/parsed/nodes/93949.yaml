    html: |-
      <p>Are the angles sharp enough to work for a Car company?  A french car company would be fine, but I would think a manufacturer from anywhere else would want sharper, stronger looking corners.</p>
      <p>I'd take a look at Klavika Condensed (GM's current font)<br>
      <a href="http://www.myfonts.com/fonts/processtype/klavika/" title="http://www.myfonts.com/fonts/processtype/klavika/">http://www.myfonts.com/fonts/processtype/klavika/</a></p>
      <p> and Toyota's current font.<br>
      <a href="http://www.fonts-download.net/fonts/tables/T/Toyota-MR2A_C_table.png" title="http://www.fonts-download.net/fonts/tables/T/Toyota-MR2A_C_table.png">http://www.fonts-download.net/fonts/tables/T/Toyota-MR2A_C_table.png</a></p>
      <p>Another idea--since you're working with a car designer, you have a great opportunity to use line segments from the body work curves they have already designed.  Both type designers and car body designers essentially just create and shape curves..</p>
      <p>My 2 cents...</p>
