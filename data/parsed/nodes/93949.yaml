    date: 2012-08-11T13:03:00
    date_raw: 11 Aug 2012 — 1:03pm
    votes: null
    html: <p>I have noticed that Germans, Scandinavians, etc. tend to treat the letter Q as an O with a diacritic, since their languages don't really use it. For a bespoke font that isn't likely to spread to a global market, this might be a better choice than a normal "q" which may be mistaken for a "g" by such readers. It's quirky but still readable by English speakers, though I can't speak for q-rich languages like Spanish.</p>
