      <p>That's what's called the Danish "g", and I personally think it fits quite well here. A controversial glyphs can actually help sell a face (Spiekermann has said as much about Meta's "g") as long as it doesn't destroy functionality - and this is no text face!  :-)</p>
      <p>My only big gripe is the lc "q" - that one <em>is</em> too much!</p>
      <p>hhp</p>
