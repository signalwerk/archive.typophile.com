    html: <p>I like that you're being creative with the symbols, but your copyright symbol has probably gone too far afield. Conceivably, a mark that doesn't quite fit the description of a C enclosed in a circle may leave the user open to arguments that the legal criteria have not been met for what constitutes a copyright notice.</p>
