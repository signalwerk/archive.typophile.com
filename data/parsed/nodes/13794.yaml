  html: |-
    <p>Anybody know any good examples of arabic inspired logotypes or typefaces? I’m doing an identity<br>
    where I want to render English words in an arabic style, not using the actual arabic characters.<br>
    I’ve already got a load of arabic patterns and typefaces as a starting point.</p>
    <p>I may be going for a crest type logo so any strong examples of contemporary crests would be interesting.</p>
    <p>Ed</p>
