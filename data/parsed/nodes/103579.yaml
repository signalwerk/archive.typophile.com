    <p>Lasta is small serif font family with simple elegant shapes, refreshing Italics and poetic endings. Containing 2 weights and 2 italics, with lower x-height which brings more air (empty space, white space...) into paragraphs making text more graceful and legible. Thin serifs bring small touch of dynamic into letter forms, just enough to bring specific tone to paragraph. Beside being mainly imagined as fully text family, Lasta is suitable titles or decorative typography as well for, especially the Italics with fancy curvy endings.</p>
