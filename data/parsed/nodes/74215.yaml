      <p>#1 Performance: Looks like <a href="http://www.myfonts.com/fonts/stephensonblake/impact/familytree.html" rel="nofollow">Impact</a>. The ampersand seems to be from elsewhere. The web-url is Handel Gothic.<br>
      #2 looks like <a href="http://www.identifont.com/show?1ZO0" rel="nofollow">Geogrotesque</a> from Emtype.<br>
      #3: The Slab looks like <a href="http://www.identifont.com/show?C75" rel="nofollow">Soho</a> from Seb Lester.<br>
      #4: The multiline looks like <a href="http://www.myfonts.com/fonts/sparkytype/thri/" rel="nofollow">Thri</a> from Sparkytype</p>
