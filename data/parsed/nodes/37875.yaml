  html: |-
    <p>arabic type in blackletter(ish) design.<br>
    is there such a thing?<br>
    i want to make an experiment with my logotype:</p>
    <p><img src="/sites/default/files/old-images/Yaronimus logo_4309.jpg"></p>
    <p>small version:<br><img src="/sites/default/files/old-images/Yaronimus-logo-small_6465.jpg"></p>
    <p>as you see - i already made a hebrew blackletter version of my name,<br>
    and now i want to make another translation into arabic, so the logotype<br>
    will be tri-lingual (i hope it's pronounced okay).<br>
    my goal in this, is first to make an experiment,<br>
    and maybe to use this in my logotype, so it would appeal to larger audience<br>
    that may collaborate with me on designs not just for a hebrew speaking israeli audience,<br>
    and not just for western audience, but to arabic as well.</p>
    <p>my question is - is there an earlier example of arabic typeface or logo in a blackletter<br>
    style?<br>
    i understand it can be quite dificult, because every language has it's own needs, but im looking forward to it.</p>
    <p>i guess that there is no typeface that is ready, so it would be great if you can recomend on several plain fractured arabic types, to start working on them as a basis.</p>
    <p>would the "kufi" type face be suitable?<br><img src="/sites/default/files/old-images/arabic-styles_5910.jpg"><br>
    another kufi:<br><img src="/sites/default/files/old-images/kufi_6166.jpg"></p>
    <p>thanks very much,<br>
    Yaronimus</p>
