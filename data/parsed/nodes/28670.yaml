      <p>Adobe has direct e-commerce to many countries, and has been expanding the number of countries covered on an ongoing basis.</p>
      <p>In the meantime, if Greece is not yet on that list, Adobe has a special relationship with Veer, and Veer resells all Adobe fonts, including Garamond Premier Pro, to virtually every country in the world.</p>
