  html: <p>Hello. First off, this board has been very helpful! <br> <br>Can anyone identify the fonts below?  <br> <br>1. I want to know what font "Screaming For Change" is written in. <br> <br>2. What font is "Wishingwell" and "Records" written in? <br> <br>3. What font is "Side Two" written in? <br> <br>These look like very basic fonts so hopefully it will be a no-brainer for someone. I'm guessing the fonts are the same but just at different weights. <br> <br>Thanks again, <br>Sean O'Donnell<img src="http://www.typophile.com/forums/messages/83/37841.jpg" alt="Image of Uniform Choice labels"></p>
