    html: <p>Heh, I thought there was something very-not-1966 about it. I saw the date at the bottom and it looked like a 6, not an 8. I actually wondered if it was a fake. <br> <br>I still stand by my ID. Given that it was 1986, if it's actually a Helvetica knock-off, I think it could be Compugraphic's Helios which would still have been common then.</p>
