    html: <p>Well, it's from 1966 (if the date on the label is correct) and it is slightly different from the digital version of Helvetica we have now (the S is a bit narrow and the C and G are a bit wide). It could be that it's a knock-off version, but basically, yes, it's Helvetica.</p>
