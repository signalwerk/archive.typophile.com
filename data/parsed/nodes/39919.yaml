    html: |-
      <p>Here's some more on CBS News 36...the electronic version was first deployed on the early 1970s Vidifont, and in many ways this low-res version was the 'face' of television graphics during that time. I've put some <a class="freelinking external" href="http://jcbd.com/vidifont" rel="nofollow">scanned images from a Vidifont brochure</a> up on my site, it includes a screenshot or two of the entire alphabet...unfortunately, no where near the full resolution of the font. </p>
      <p>The big deal element of the design was that it had built-in cuts and counters (little positive and negative spikes at the corners) to compensate for the 'blooming' or blowing-out of the image you see on an old NTSC picture tube. </p>
      <p>One font that comes to mind that takes that approach is Matthew Carter's <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/bell-centennial/" rel="nofollow">Bell Centennial</a>...but of course he chose that technique to help tiny inked letters on newsprint hold up...kind of the same challenge.</p>
