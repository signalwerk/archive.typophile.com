      <p>Hey there,</p>
      <p>You're right, it is a custom typeface made my Marjorie Samuels (wife of Bill who created the bourbon), she got the idea from the "Maker's Mark" stamps on the pewter she collected.  I couldn't find the name that typeface has now, but hope that helps as a starting point!</p>
