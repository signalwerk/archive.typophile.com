    html: |-
      <p>I liked the Imus map.</p>
      <p>I should note that there is one major difference between it and the Nat'l Geo map that shows how it just has different goals. The Nat'l Geo map has at least twice as many cities marked on it, maybe more. Having so many places marked seems to me a likely reason why they couldn't show other details that the Imus map does, and need a plain background....</p>
      <p>That being said, there are some things that just seem better done on the Imus map. I like his approach to marking state borders for example, even if it is rather non-traditional.</p>
