      <p>I haven’t seen the Imus map in the paper, but it doesn’t fare too well in the Slate article, vis-a-vis the National Geographic map.<br>
      The type looks cluttered, because the designer has been reluctant to vary its alignment by “mapping” it to curved paths, or rotating away from the horizontal. Also contributing to the clutter is a lack of variety of type styles, and the rather generic sans typeface used, which lacks distinction, in more ways than one.</p>
      <p>Just because something is labored over in a traditional manner doesn’t make it a good design.</p>
