    html: <p>I have always been attracted by fine map making. Fortunately, the art of it is not dead at all. In Saxony there is <a class="freelinking external" href="http://www.boehmwanderkarten.de/kv/is_msto.html" rel="nofollow">Dr.-Ing. Rolf Böhm</a> who draws regional area maps entirely by hand (!) and distributes them. These maps outlevel any competing product in terms of precision and information density while retaining a breathtaking degree of visual balance. I can only recommend to look at his production.</p>
