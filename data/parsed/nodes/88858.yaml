      <p>I saw it, it's really beautiful, and sadly mapmaking is not where it once was. But the ugliness of today's maps is nothing new, as Dutch map-fanatic and designer Joost Grootens says: "Maps became ugly with the coming of CMYK printing, which muddled the clarity and atmosphere of a map" (beforehand they were often printed using up to 12 spot colors). The vibrancy and crispness of old maps is amazing compared to modern renderings.</p>
      <p>I'll have a peek if I can get one shipped over!</p>
      <p>Next to that, I'll post this great lithographed map by the English art collective Dorothy:<br>
      <a class="freelinking external" href="http://www.wearedorothy.com/art/song-map-unlimited-edition" rel="nofollow">http://www.wearedorothy.com/art/song-map-unlimited-edition</a></p>
