  html: <p>Slate has an <a class="freelinking external" href="http://www.slate.com/articles/arts/culturebox/2012/01/the_best_american_wall_map_david_imus_the_essential_geography_of_the_united_states_of_america_.single.html" rel="nofollow">article about an award-winning US map</a> that gets into the craft of hand-placed labels in cartography. It's framed as perhaps the last great effort of individual craft in a world now dominated by computer algorithms corrected by cheap outsourced labor.</p>
