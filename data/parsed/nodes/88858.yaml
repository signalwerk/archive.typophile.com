      <p>Doing a search on how maps are printed, I couldn't find too much, except information about wax engraving. That technique allowed maps to be drawn as a positive, rather than a negative, image; it was invented by Rand McNally in 1872, and was only displaced by photolithography around 1930.</p>
      <p>But that doesn't really relate to the quality factors noted here, such as hand placement of lettering and the number of colors used in the printing process.</p>
