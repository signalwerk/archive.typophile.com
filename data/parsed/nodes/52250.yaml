      <p></p><div class="imageWrap"><img src="http://typophile.com/files/exa2_6089.jpg"></div><p></p>
      <p>I apologize for lacking the knowledge - or perhaps the software - needed to produce a screen grab. Let me attempt to be more succinct.</p>
      <p>In the above diagram is an lc "e," with the fill outline turned off and just the outline itself showing. In the yellow area immediately to the right of the No. "1," there is a small line dipping below the long horizontal bar of the inner contour. This small line is not visible when the fill outline is on ... only when it's off.</p>
      <p>As you can see in the green shaded area numbered "2," that small overlap is gone. After some machination I discovered that if I move the handle next to the number "3" a few spaces to the right (using the arrow button on my keyboard), that line eventually disappears.</p>
      <p>My inquiry, then, is as follows: since all computers run on or are based in mathematics and equations, this small line next to the No. 1 obviously figures into how the entire glyph will be rendered since I can see it on my screen and can make it disappear when I move the handle next to the No. 3. Hypothetically, if the equation 5+5+3 ordinarily results in the visual we know as the inner contour of the "e," logic dictates that the left glyph - with the overlap - would require an equation of 5+5+1+3, taking into account what I can see in the yellow shaded area. This leads me to wonder ... could this small overlap - which potentially could exist in an assortment of other glyphs in the font - be a monkey-wrench in the overall look of a completed font? Or is it more likely just a grain of sand no one will ever know exists?</p>
      <p>Also as an aside - Mr. Cooke I noticed your collection recently has been made available on myfonts.com. I hope you're successful with that.</p>
