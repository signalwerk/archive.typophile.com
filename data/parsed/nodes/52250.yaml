    html: |-
      <p>One way I know of to get the effect you are getting at the corner is to construct a curve like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/badcorner_6077.jpg"></div><p></p>
      <p>This happens when you push the curve around counterclockwise forcing the bottom left control handle below its node. The solution is to move the control handles so they look like the curve on the right.</p>
      <p>Another thing that can happen is when you have a curve point and a corner point at the same location, like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/badcorner2_4444.jpg"></div><p></p>
      <p>The solution in this case is to move one of the overlapping nodes away, delete the segment between them, and then rejoin the two nodes (thus creating a single node).</p>
    html_clean: |-
