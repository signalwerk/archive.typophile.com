      <p>Ordinarily that would help but in this case my problem can only be seen with everything turned off. To get an idea of what I'm looking at, open a font in FontLab, then any letter, and under "View," turn off everything until only the skeleton of the letter exists. </p>
      <p>In other words, click off everything under the "show layers" menu option. Once you've done that, you'll have in the window a letter that looks similar to the one above. Once you do that, if you look real close in your open font you might see that little extra space pictured to the right of the arrow on the left "e." (which isn't there on the right "e," which is what happens when I move that upper handle a few spaces to the right)</p>
      <p>If you don't see it when viewing any of your letters, you can try moving a handle in a direction perpendicular to the direction in which that faint little line is showing. I know my description blows, but once you've seen a skeleton of a letter in FontLab, my renditions above will make more sense. Those aren't screen shots, I made them manually. Hopefully this will help some. I appreciate you taking the time to check it out.</p>
