      <p>Sorry for the delay in responding, especially when I need to thank you for taking time to share such great information.</p>
      <p>I went through your description of possibilities, but unfortunately none were the case in this situation. Both points on the horizontal inner contour bar were corner points, and neither handle in the top curve point extended past the horizontal position of either corner point. </p>
      <p>I suppose in reality the ultimate answer really isn't that critical since the best thing to do would be to simply remove these little overlaps from any glyphs in a font I may be creating at any given time. I can't imagine how removing them could do anything but help in the end, aside from perhaps being an unnecessary waste of time. However, between my knowledge of computers and my instincts where they are concerned, everything tells me these little nuisances are worthy enough to rectify.</p>
      <p>Also, I went to the link you posted, copied the instructions and gave the screen grab thing a shot. It didn't seem to work for me though. I'll keep trying. In the meantime, when you again find yourself working on a new typeface, try going into the show layers tab, unchecking everything, removing the fill color of the glyphs, and see if you encounter one of these little pests ... which invariably appear at corner points. If you do see one, trying to fix it will show you what I've encountered.</p>
      <p>Thanks again for the time.</p>
