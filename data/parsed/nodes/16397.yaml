  html: |-
    <p>Hi, I’m working on my final exam for a typography course, I have to show an example of a logo with each classification type. Right now I’m “stuck”, I can’t find anymore logos to show as an example and thats why I decided to post over here for help. The logos need to be very well known, like coca cola, google, etc… because I live in chile and the logo needs to be known over here.</p>
    <p>I also have my doubts regarding some logos I have, I don’t know what font they are or in what category of the classification they belong, thats why I added an attachment with the logos in case anyone could ID them. </p>
    <p>Could you help me?</p>
    <p>so far I have:<br>
    -venetian: Chivas Regal, berkeley old style<br>
    -Garalde:  ??<br>
    -Transitional: ??<br>
    -Didone: Calvin Klein, bodoni<br>
    Slab Serif: m&amp;m, rockwell </p>
    <p>Sans Serif<br>
    - Grotesk: government of chile logo<br>
    - Neo-grotesk: Toyota<br>
    - Geometric: ??<br>
    - Humanist: Saab</p>
    <p>Blackletter<br>
    - Textura: ??<br>
    - Rotunda: ??<br>
    - Schwabacher: ??<br>
    - Fraktur: Corona?</p>
