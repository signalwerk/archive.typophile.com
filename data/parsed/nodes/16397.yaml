    html: |-
      <p>Banco de Chile (and Corona) are Textura<br>
      Kunstmann is a Fraktur (I think)<br>
      Nivea is a Geometric<br>
      Nestlé is a Neo-grotesk<br>
      whiskas is a Wedge Serif<br>
      Ripley is a Garalde<br>
      Most logos are not a direct use of a font but adaptations or drawn from scratch based on styles.<br>
      If you want to understand the classification and see samples you could visit here<br>
      <a href="http://www.fontscape.com/explore?8C8">http://www.fontscape.com/explore?8C8</a></p>
      <p>Tim</p>
