    html: <p>I took me some time to discover what works best to me, but I have them organized by foundry. Have another folder called Collections on the same level where I collect some fonts grouped by various flavours. I also think that there is no need to group the fonts inside the foundry, rather pointless when you can have have My fonts/Font Book etc to look the font name/designer etc and get it on you hard disk with a few clicks. Why order it into families?Save clicks, it extends your life. Inside each Foundry I have 2 dirs, PC and MAC version. <br> <br>BTW, are you a font backup fanatic? Do you have several backups? just the hard disk copy? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Just curious.</p>
