    html: '<p>The Germans, in some sort of inner quest for order, have devised means to classify almost everything even vaguely industrial. Including typefaces. Also not surprising is that there are two DIN classification models, an older (longer) one and a newer one. An article briefly describing them is available via the following link, in German only <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br><a href="http://www.typolexikon.de/s/schriftklassifikation-din.html" target="_blank">http://www.typolexikon.de/s/schriftklassifikation-din.html</a> <br> <br>Below is the older, longer system (please excuse my quick translation): <br>01. Venetian Renaissance Serif (i.e., Centaur or Bembo) <br>02. French Renaissance Serif (i.e., Garamond) <br>03. Baroque Serif (Janson and the Dutch Romans) <br>04. Neo-Classical Serifs (i.e., Bodoni) <br>05. Slab Serifs (Egyptiennes) <br>06. Sans Serifs (e.g., AG) <br>07. Variations on the Serifed Letter Theme <br>08. Handwriting-like Typefaces (i.e., Mistral) <br>09. Caligraphic Serif Typefaces <br>10. Blackletter (there are at least four sub-families here) <br>11. Foreign Writing Systems (i.e., Greek, Cyrillic, Arabic, Kanji, etc.) <br> <br> <br>And here is the newer, current system: <br>1. Blackletter Faces <br>2. Traditional Serif Faces <br>3. Sans Serif Faces <br>4. Slab Serif Faces <br>5. Handwritten-like Faces</p>'
    html_clean: '<p>The Germans, in some sort of inner quest for order, have devised means to classify almost everything even vaguely industrial. Including typefaces. Also not surprising is that there are two DIN classification models, an older (longer) one and a newer one. An article briefly describing them is available via the following link, in German only <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br><a href="http://www.typolexikon.de/s/schriftklassifikation-din.html" target="_blank">http://www.typolexikon.de/s/schriftklassifikation-din.html</a> <br> <br>Below is the older, longer system (please excuse my quick translation): <br>01. Venetian Renaissance Serif (i.e., Centaur or Bembo) <br>02. French Renaissance Serif (i.e., Garamond) <br>03. Baroque Serif (Janson and the Dutch Romans) <br>04. Neo-Classical Serifs (i.e., Bodoni) <br>05. Slab Serifs (Egyptiennes) <br>06. Sans Serifs (e.g., AG) <br>07. Variations on the Serifed Letter Theme <br>08. Handwriting-like Typefaces (i.e., Mistral) <br>09. Caligraphic Serif Typefaces <br>10. Blackletter (there are at least four sub-families here) <br>11. Foreign Writing Systems (i.e., Greek, Cyrillic, Arabic, Kanji, etc.) <br> <br> <br>And here is the newer, current system: <br>1. Blackletter Faces <br>2. Traditional Serif Faces <br>3. Sans Serif Faces <br>4. Slab Serif Faces <br>5. Handwritten-like Faces</p>'
