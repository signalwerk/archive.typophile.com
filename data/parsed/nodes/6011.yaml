    html: <p>Backup is VERY important. I had a disk crash 2 years ago and I had to pay something like 2200US$ to recover the disc content (1 year Work + fonts included). Since then I have a 2 disc RAID mirror system. $hit Happens. <br> <br>On the collections folder I've mentioned I have my common/current fonts, which is something like 10 fonts I use the most. Organization does change from person to person. As long as you don't get lost and canfind a font in 20 sec I would say you are well organized :P <br> <br>Dan, nice! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br></p>
