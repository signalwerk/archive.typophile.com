    html: <p>Having just listed three differen, time-based classification systems, I should point out don't I don't use any of them. I <b>try</b> to organize my faces in folders by project (using type-managing software). This doesn't always work. So, I end up often trying to sort my faces by country (and then often in sub-categories for designers). I like this method a lot. Its fun to think that Alte Schwabacher, Fette Fraktur, AG, and Meta are all <i>equally</i> German... and put put everything American under one roof... that's just a blast, especially when Dwiggins comes right before Emigre.</p>
