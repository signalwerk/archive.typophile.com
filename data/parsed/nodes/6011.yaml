    html: "<p>There is also the Bringhurst System (Hans Peter Willberg has developed a similar system in German that covers both serifs and sans serifs equally extensively... but I don't have that book of his handy): <br> <br>1. Renaissance <br>2. Baroque <br>3. Neo-Classical (unlike the DIN system, this is for Transitional faces) <br>4. Romantic (he puts the Didones here) <br>5. Realist (AG) <br>6. Geometric Modernist (Futura) <br>7. Lyrical Modernist <br>8. Postmodernist <br> <br>This mirrors movements in Art, of course...</p>"
    html_clean: "<p>There is also the Bringhurst System (Hans Peter Willberg has developed a similar system in German that covers both serifs and sans serifs equally extensively... but I don't have that book of his handy): <br> <br>1. Renaissance <br>2. Baroque <br>3. Neo-Classical (unlike the DIN system, this is for Transitional faces) <br>4. Romantic (he puts the Didones here) <br>5. Realist (AG) <br>6. Geometric Modernist (Futura) <br>7. Lyrical Modernist <br>8. Postmodernist <br> <br>This mirrors movements in Art, of course...</p>"
