    html: <p>Ok... i understand there's many different ways <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I think what suits me best at last must be the one i mentioned, but maybe with some more alternatives as Tracy wrote. In those folders i only put my favourites or fonts that i think are good enough to use. Just to narrow my search when i shall find the best font for that specific moment. <br> <br>About the backup, well i wish i did backup more often but i got almost the same collection both home and on my work so i guess i wont loose them at the same time.... i hope <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
