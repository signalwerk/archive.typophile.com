      <p>While I haven’t any specific advice, there are various apps to navigate and extract individual files from the XP install disc.</p>
      <p>If you go down the route of a Windows refresh/install, can I suggest (from experience) that you make (’slipstream’) a new disc with service packs, updates and machine specific drivers included - saves a lot of time and effort.</p>
