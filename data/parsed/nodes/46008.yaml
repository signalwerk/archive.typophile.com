    <p>Can anybody shed any information on how to repair my fonts folder / strip it down to just the default fonts in Windows (XP)? I have been using Linotypes Font Explorer BETA and after a couple of installs / reinstalls/ uninstalls I seem to have corrupted things. A few of my fonts in the MS programs are not displaying correctly/wonrg fonts being used.</p>
    <p>Any ideas how to just revert to the defualt Windows fonts? Currently when looking at my fonts folder it just appears full of shortcuts rather than fonts. I don’t think this is due to Suitcase which I am now using.</p>
    <p>Also - on a side note - anyone know if Font Explorer will EVER see the light of day in a non beta version? I love it on the Mac but would love to have it workin properly on my PC at work as Suitcase kinda sucks....</p>
    <p>Thanks!</p>
