      <p>Are the fonts on the XP install disc? I can’t honestly recall.</p>
      <p>Microsoft have a list of the fonts supplied with the OS so I guess you could Find Files &amp; Folders for these on your system to see if the program moved them, then move ’em back to the Windows/Fonts/ directory manually. <a class="freelinking-external" href="http://www.microsoft.com/typography/fonts/winxp.htm">http://www.microsoft.com/typography/fonts/winxp.htm</a></p>
      <p>Personally I use <a class="freelinking-external" href="http://www.high-logic.com/maintype.html">High-Logic’s MainType 2.1</a> which works very well for $49. No install needed either so I can keep it on a flash drive.</p>
