    html: <p>You'll have to get two metric tons of flack from people who believe whatever works for them for each head you convince. But I'll point Albert here and see if he thinks it's worth a bother. <br> <br>BTW, Linotype Maral took about 800 hours for the Regular and Bold (no italics). But it was my second outline font - I can do it a bit faster now. But not in an hour, like those guys probably think. <br> <br>hhp</p>
