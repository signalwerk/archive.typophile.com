    html: <p>Well, it looks like they're only posting the font resource that comes with the game files anyway, which I believe doesn't have a complete character set. So, while that's not great, it's not terrible. <br> <br>My little tirade on the site was meant to be an indirect heads-up to the site moderators to cover their asses and quash any piracy, but we'll see. <br> <br>Ironically, Half-Life 2 can cost from <a href="http://www.ebgames.com/ebx/product/235059.asp">$55</a> up to <a href="http://www.ebgames.com/ebx/product/243836.asp">$80</a> depending on which version you get via retail outlets (the collector's version has all sorts of goodies). <br> <br>Another interesting note, Valve, the developer, is spearheading a new online content distribution method called <a href="http://www.steampowered.com">Steam</a>. On this platform, there's a $90 version. The interesting part is that it's an actual application that runs on your machine. You actually have to have a web connection to activate their products which is done via an application on your PC. A bit of remote DRM on their part. Considering how open these gamers are to letting Valve crawl onto their PCs and control their software, and the amount of $$$ it takes to get a PC to even play the game decently, I'm surprised they're so defensive about $40.</p>
    html_clean: <p>Well, it looks like they're only posting the font resource that comes with the game files anyway, which I believe doesn't have a complete character set. So, while that's not great, it's not terrible. <br> <br>My little tirade on the site was meant to be an indirect heads-up to the site moderators to cover their asses and quash any piracy, but we'll see. <br> <br>Ironically, Half-Life 2 can cost from <a href="http://www.ebgames.com/ebx/product/235059.asp" class="link-external">$55</a> up to <a href="http://www.ebgames.com/ebx/product/243836.asp" class="link-external">$80</a> depending on which version you get via retail outlets (the collector's version has all sorts of goodies). <br> <br>Another interesting note, Valve, the developer, is spearheading a new online content distribution method called <a href="http://www.steampowered.com" class="link-external">Steam</a>. On this platform, there's a $90 version. The interesting part is that it's an actual application that runs on your machine. You actually have to have a web connection to activate their products which is done via an application on your PC. A bit of remote DRM on their part. Considering how open these gamers are to letting Valve crawl onto their PCs and control their software, and the amount of $$$ it takes to get a PC to even play the game decently, I'm surprised they're so defensive about $40.</p>
