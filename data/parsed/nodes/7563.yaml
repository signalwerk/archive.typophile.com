    html: "<p>I've never made a font, and I've only made small promotional games, but I'm guessing that a game like half-life 2 would have taken many many times more hours than FF Din. I haven't checked the prices of either, but I would guess that FF Din costs more than a copy of half-life 2. <br> <br>But its not really about the hours, is it? <br>You would assume that game designers feel that their role is a creative one, and probably the programmers do too. Designing and creating a typeface is also a creative role. The cost of both products includes a premium for the creativity of their designers. The size of the potential market is also a factor, as well as the composition of that market in terms of individuals or businesses. <br>There are so many other factors that determine the price of a product that to reduce it to how many hours it took to create is irrelevant. <br> <br>Now Mr. 'FF DIN is a very basic looking font' has to answer the question: <br>If it didn't take very long, and its easy, why did he want to steal someone else's work instead of just knocking up a clean, basic font himself?</p>"
