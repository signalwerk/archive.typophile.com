  html: "<p>So, there's a videogame called <a href=\"http://half-life2.com\">Half-Life 2</a>. Its interface uses what appears to be <a href=\"http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.9467.11.1\">FF DIN Light</a>. I'm a huge fan of both. <br> <br>Well, as most fans of a game or movie are inclined to do, they want to get their hands on the font. Being the foolish typophile that I am, I chastised the people running the site for allowing font piracy on their site, while they berate game piracy. <br> <br>Here's a response I got from a fan on the site: <br> <br>\"<i>as for \"the amount of effort it takes to make a font\" please.. dont make me laugh. Making a font is EASY. There are fonts out there that cost thousands of dollars, just so you have the right to use it publicly, its a joke. <br> <br>Fonts are not hard to make, stop kidding yourself. and FF DIN is a very basic looking font, clean lines, nothing fancy. I bet it didnt take long to make at all. It would be like me making signatures for people and charging them $1500 a go.</i>\" <br> <br>I've already blasted him for his ignorance and explained (briefly) that he's wrong, but what I'd like to know is if anyone here knows how long <a href=\"http://www.fontshop.com/index.cfm?fuseaction=catalog.fonts&amp;searchID=692&amp;searchby=designer\">Albert Jan-Pool</a>'s FF DIN <i>actually</i> took to make? <br> <br>This is why people pirate fonts. Why non-designers do. I'm just throwing fists against the castle walls in an attempt to change maybe one of their minds.</p>"
