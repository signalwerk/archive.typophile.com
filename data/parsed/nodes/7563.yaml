    html: <p>This is certainly interesting.  If they�re posting the font for all the world to see I�m sure they�ve properly licensed the font. However, the feeling I have is that most games developers ignore font licenses and include derivative (mostly bitmap fonts) within games without getting permission from the fonts owner. Getting permission, or a license for these rights seems to be the exception rather than the rule. I think the game developers and the font vendors are both partially to blame� <br> <br>Games developers have always done this, they don�t read the licenses and even if they did this issue is not dealt with very well. Even if they know what they�re doing is wrong they don�t expect to get caught.  <br> <br>Font vendors themselves don�t seem to be particularly bothered with this type of misuse. They see the outlines as being their crown jewels and are not too concerned about bitmaps being distributed (see c. 1997 comments from LettError et al re. embedding) � some might even think it�s cool to have their fonts used in a top-selling game. Also even if they�re loosing a bit of difficult to recover revenue from extended license sales this type of use isn�t eating into other sales in same way as other forms of piracy might. <br> <br>Cheers, Si</p>
