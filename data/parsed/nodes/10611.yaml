  html: |-
    <p>i got an offer to make a magazine for a company, dimensions 4 by 6, 24 pages includeing cover &amp; back, i met the owner of the company through a friend im not too sure on what to quote him for the job...any suggestions??....i was thinking 50 USD a page...</p>
