    html: "<p>If you're taking over the production of an existing format, then a per-page fee may be appropriate.  <br> <br>If you're creating the magazine from scratch, you should charge a one-time fee for designing the logo, developing the architecture/grid/color palette, creating style sheets, etc.  <br> <br>Don't overlook the costs associated with licensing fonts, archiving/storing each issue, and handling ads. Ads in particular can eat up a lot of time, since advertisers may submit their materials in a format that requires work on your part. <br> <br>Two books with useful information on pricing: <br> <br>The Business Side of Creativity <br><a href=\"http://www.amazon.com/exec/obidos/ASIN/039373093X/qid=1114801241/sr=2-1/ref=pd_bbs_b_2_1/103-6784467-9905434\" target=\"_blank\">http://www.amazon.com/exec/obidos/ASIN/039373093X/qid=1114801241/sr=2-1/ref=pd_bbs_b_2_1/103-6784467-9905434</a> <br> <br>Graphic Artists Guild Handbook: Pricing &amp; Ethical Guidelines <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0932102123/qid=1114801106/sr=1-1/ref=sr_1_1/103-6784467-9905434?v=glance&amp;s=books\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0932102123/qid=1114801106/sr=1-1/ref=sr_1_1/103-6784467-9905434?v=glance&amp;s=books</a></p>"
    html_clean: "<p>If you're taking over the production of an existing format, then a per-page fee may be appropriate.  <br> <br>If you're creating the magazine from scratch, you should charge a one-time fee for designing the logo, developing the architecture/grid/color palette, creating style sheets, etc.  <br> <br>Don't overlook the costs associated with licensing fonts, archiving/storing each issue, and handling ads. Ads in particular can eat up a lot of time, since advertisers may submit their materials in a format that requires work on your part. <br> <br>Two books with useful information on pricing: <br> <br>The Business Side of Creativity <br><a href=\"http://www.amazon.com/exec/obidos/ASIN/039373093X/qid=1114801241/sr=2-1/ref=pd_bbs_b_2_1/103-6784467-9905434\" target=\"_blank\">http://www.amazon.com/exec/obidos/ASIN/039373093X/qid=1114801241/sr=2-1/ref=pd_bbs_b_2_1/103-6784467-9905434</a> <br> <br>Graphic Artists Guild Handbook: Pricing &amp; Ethical Guidelines <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0932102123/qid=1114801106/sr=1-1/ref=sr_1_1/103-6784467-9905434?v=glance&amp;s=books\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0932102123/qid=1114801106/sr=1-1/ref=sr_1_1/103-6784467-9905434?v=glance&amp;s=books</a></p>"
