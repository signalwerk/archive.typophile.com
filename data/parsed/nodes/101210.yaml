      <p>Sorry, don't know this one. Most probably a custom job for the occasion. You best chance is probably to directly contact the designer(s) behind this video and ask them.<br>
      If you need alternatives, some previous related discussions: <a href="http://typophile.com/node/100787" title="http://typophile.com/node/100787">http://typophile.com/node/100787</a>, <a href="http://typophile.com/node/100237" title="http://typophile.com/node/100237">http://typophile.com/node/100237</a>, <a href="http://typophile.com/node/98172" title="http://typophile.com/node/98172">http://typophile.com/node/98172</a>, <a href="http://typophile.com/node/94940" title="http://typophile.com/node/94940">http://typophile.com/node/94940</a><br>
      Unfortunately, don't know this one. As usual, looks like it has been started from <a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a>. Some suggestions: <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/diamonds/" rel="nofollow">Diamonds</a>, <a class="freelinking external" href="http://26plus-zeichen.de/en/fonts/tj-evolette-a/" rel="nofollow">Evolette A</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/matchandkerosene/lightyears" rel="nofollow">Lightyears</a>, many ones at <a class="freelinking external" href="http://www.tendollarfonts.com/" rel="nofollow">TenDollarFonts</a> (TWOFACED, Echelon, Rathe, Parqa, Fonecian, Finding 57, Harf 77, Labieno, Positano, Marina, Alumia...)<br>
      More inspiration: <a class="freelinking external" href="http://experimentalsans.tumblr.com/" rel="nofollow">I Am So Tired With Your Experimental Sans</a></p>
