    html: |-
      <p><em>I can only imagine how Erik feels about this. I’m so sorry, Mr S.</em></p>
      <p>No need to be sorry. When you design type for other people to use, you have to live with bad use. If you write a pop song, tone-deaf people will sing it in their bathtubs. Or – much worse – at Karaoke. Whatever the circumstances, your work has entered the public domain and you have to see any usage at all as a compliment.</p>
      <p>Mind you: people who pay for their type usually take a little more care not to harm it. </p>
      <p>I bet that 90% of all ITC Officina in use that I see comes from a font that somebody “found“<br>
      on their hard drive. The license fees are certainly not in step with its widespread use.</p>
