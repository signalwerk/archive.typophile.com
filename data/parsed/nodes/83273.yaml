  html: |-
    <p>Currently I am working on a digital typeface based on my nephew's remarkably dextrous handwriting. While I am studying FontLab, I would also like to find out how to approach digital font publishing, distribution, as well as the steps for the acquisition of a trademark for the typeface name.</p>
    <p>I would certainly appreciate your suggestions and references.</p>
    <p>Thank you!</p>
