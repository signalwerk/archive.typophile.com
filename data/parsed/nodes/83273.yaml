      <p>Thank you riccard0 and Jens for connecting me to the very helpful threads on copyright and trademark.</p>
      <p>Yes, there are already lots and lots of fonts out there. No drawings to share yet. Check out the MyFonts interview with Gerard Unger: </p>
      <p>"... I see too much repetition right now. Many of the “new” sans serifs, for instance, are trying to fill ever smaller gaps between existing sans serifs. If type designers would concentrate more on originality, not only personal originality, but trying to find answers to original design challenges..."</p>
