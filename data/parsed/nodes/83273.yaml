      <p>See also: <a href="http://typographica.org/2008/on-typography/taking-your-fonts-to-market-foundry-reseller-or-go-solo/" title="http://typographica.org/2008/on-typography/taking-your-fonts-to-market-foundry-reseller-or-go-solo/">http://typographica.org/2008/on-typography/taking-your-fonts-to-market-f...</a></p>
      <p>Could you show us an example of the font?</p>
      <p>The sad reality is, there are already lots and lots of fonts out there. Unless you've got something really outstanding, your chances for commercial success are slim. So what are your goals in publishing your font? There may be other motives than to make money from it, influencing your decisions.</p>
