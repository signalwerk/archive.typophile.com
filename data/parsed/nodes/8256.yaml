    html: <p>Unfortunately, I don't think this is Mercury, but it does have similar wedge-shaped serifs. <br> <br>See <a href="http://www.themicrofoundry.com/other/mercury.gif" target="_blank">here</a> for a sample of Mercury. It was originally designed as a newspaper font and is used IIRC by a few newspapers (among them the New Times chain) as well as Esquire. According to the staff at H&amp;FJ, it's not quite retail yet, but they told me you can buy it though "special arrangement." Everytime, I've tried to obtain it though, my calls are never returned from the lady who does their licensing. You may have better luck. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"></p>
