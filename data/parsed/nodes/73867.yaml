comments:
  - id: 428299
    user: 1133
    date: 2010-09-05T08:14:00
    date_raw: 5.Sep.2010 8.14am
    votes: null
    html: |-
      <p><code>@LETTERS = [A-Z a-z];<br>
      feature calt {<br>
      ignore sub a' @LETTERS;<br>
      sub a' by A;<br>
      } calt;<br>
      feature fina {<br>
      sub a by A;<br>
      } fina;</code></p>
