    html: |-
      <p>Khaled, </p>
      <p><code>isol</code>, <code>init</code>, <code>medi</code> and <code>fina</code> work in Latin fonts, e.g. in InDesign CS4/CS5, using the "Positional Forms" submenu in the OpenType flyout menu. This allows users of Latin fonts to have a fine-grain control over which forms should appear (typically, in <code>calt</code>, you'd have code to deal with all forms at the same time).</p>
      <p>You're right, though: in <code>calt</code>, the font designer needs to specify the context, i.e. identify the end of a word or a line. In the positional forms features, it is the application (i.e. the OT Layout engine) that "knows" where to apply those features if the user enables them. This is why in my example, the <code>calt</code> feature uses a contextual substitution while the <code>fina</code> feature uses a simple substitution. </p>
      <p>Best,<br>
      Adam</p>
