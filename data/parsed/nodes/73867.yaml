    html: <p>'fina' feature is script specific (Arabic and Syriac AFAIK), and requires certain knowledge about the respective script in the engine itself, since final position is not necessary at the end of the word and can be triggered by certain letter sequences even in the middle of the word. The same is true for "init", "medi", "isol" and other similar features. Actually, I don't think any of those features will work with Latin script.</p>
