      <p>vxhorusxv (nice nickname by the way :-) :</p>
      <p>moving was not easy, i guess it never is anyway, to start a new life from scratch in a country you don’t know. before thet i have been living 10 years in new york, 1 year in tokyo and 4 years in paris, but this was very different. it takes time to get fully used to this city, about 6 month. after that, its really very nice. to obtain a visa is very tricky and long, depending on your country: for french people, for example, you have to ask the working visa before you actually go and work there; that’s really boring. i dont know for other countries, but french citizens can go and stay in turkey without any visa for 90 consecutive days, which is a blessing: you can go hunt for jobs, eventually find one, and ask the company’s lawyers to get your visa (as in the USA), making things much faster done. job hunting is not very hard: just buy the newspaper hurriyet on sundays, that’s where 95% of the ads are posted. you also might try a spontaneous job request by contacting the agencies here, there is a crazy amount of advertising / graphic design companies, both local or international. in 70% of the time, their creative directors or top art directors are foreigners. if your portfolio is good, they will call you, believe me. 3 major companies called me in the week following my emailing, 3 years ago, and it is still true today.</p>
      <p>and to finish with the turkish language... i’m ashamed to say that my turkish sucks, still now. i can chat, order food, talk about graphic design specifics... but that’s pretty thin. i am even married to a turkish girl, but we speak english and she is learning french... so, dont be too much afraid: language is not too much of a problem (until you get in a taxi of course).</p>
      <p>david r</p>
