      <p>There are quite a few non-Finnish speakers here in Helsinki, and I think it would be possible to work in design without knowing the local languages. I know people who’ve been here for decades and still don’t/won’t speak the language. Houses are good and warm, infrastructure ok, air pretty clean and lots of nature around, even beaches. Downside is the climate, at the moment it’s snowing and we won’t see much sun for a few months from now. Summers are nice. As for swimming – my local beach offers a nice maintaned hole in the ice during the Winter months, so it’s possible to swim in the sea around the year...</p>
      <p>Actually, I suppose it’s not that different to Toronto, except it’s in Europe, there’s the sea and people speak strange languages.</p>
      <p>I lived in Munich for a year, and it was lovely. I was there only as a Hausfrau, it wouldn’t have been possible to get a design job with my poor German skills. A Central European location is a good idea, if you want to visit other countries easily. From Munich we wisited Austria, Italy and Switzerland by train – very convienient.</p>
