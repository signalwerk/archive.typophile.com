    html: <p>I lived in Germany from 2001–2002, and then again from 2003–2007. Now I’m at Reading in the UK, but I’ll be returning to Germany in late 2008. Both times in Germany, I was living near Frankfurt. It is possible to get work in Europe without speaking the native language, but you integrate so much better &amp; so much faster if you do learn it, and quickly. I love Berlin, but the job market there is rubbish, and the salaries low. From what I hear, designers make more there than in Athens, though, if that is consoling. Lots of people seem to like moving to the Netherlands. I think its cities must be quite cosmopolitan, and depending on what you are looking for, pleasant.</p>
