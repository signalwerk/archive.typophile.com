    <p>My partner and I have been discussing moving out of Toronto for about a year now and we have decided moving somewhere in Europe would be ideal. He was born in Greece and speaks the language and has a lot of cultural ties there still so really wants to move back to Athens. I was born in Canada and my Greek is not -that- good and although this wouldn’t be happening for at least another year and I would have time to work on it, is there really any chance of finding work in the design industry there if I don’t speak the language fluently? Is it like that all over Europe? </p>
    <p>My partner and I both work as Art Directors in interactive departments of advertising agencies.</p>
    <p>I know there are a lot of European designers here who could maybe provide some insights for me. I really don’t want to move to London.</p>
