      <p>There's a fine line between getting your inspiration from something that already exists, paying an ode to something &amp; stealing. I'm not sure when basing something new on something old is considered stealing, but from what I've seen it actually happens a lot.<br>
      I started working on a font &amp; I'm using Illustrator (since I'm also very familiar with it) &amp; Fontographer, but this combinaton leaves a lot to be desired. I haven't used Fontlab, but I do think it's most commonly used in designing typefaces. You'll probably be able to import Illustrator drawn letters in Fontlab as well.<br>
      Good luck!</p>
