      <p>Hello:</p>
      <p>Actually your drawing is not that bad... keep going- keep perfecting. Push comes to shove: the 'rough/irregular' look is highly desirable these days. But if its not working for you, try it once or twice more, then you need to move on to modifying exsisting type so you don't fail the assignment or run out of time. If you simply don't have the money that's okay. There are good free fonts out there but you have to look. FontShop being no. 1 on the list. And I would definately check out Maniakers. Look at the (mentionaed) Free faq on typophile. Also you need to have the concept down first. That will help. So when you go font hunting you know what to look for.</p>
      <p>BTW...Don McCahill your comments are so false. There are many excellent free fonts out there. You just have to look (sometimes really hard). FontBook (or other 3rd party utility) checks for errors and stops you from installing bad fonts so that argument is out... you are using Mac OS X right? If your 'friends' are unwise enough to install hundreds or thousands of fonts (free or otherwise), have them all activated, and not even validate them they must NOT be a professional.</p>
      <p>Mike Diaz</p>
      <p>PS... Also I think Stefan H (MacRhino) is awesome for offering a discount- I think thats very nice of you guy!</p>
