      <p>Notice how nine or ten people replied, and not one gave you a source for free fonts? Most of the people here are professionals, and know that some (not all or even most) free fonts can be defective and cause software to malfunction.</p>
      <p>I have heard dozens of stories of people downloading hundreds or thousands of free fonts and discovering that Photoshop or other programs no longer will load. All it takes is one badly built font. And finding the bad one in 100 is a chore. Finding it in 1000 or more is a ridiculous amount of work, and would make you sorry that you didn't spend $22 or more to buy a quality font.</p>
