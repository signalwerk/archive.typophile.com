      <p>It is usual to customise lettering for a logo, often this will mean amending a typeface to your design to improve on spacing and letterforms and is probably the most effective way of achieving it as somebody else (the type designer) will, with their knowledge and experience, have worked out a lot of the problems of stroke modulation etc. If your intention is just to create a logo rather than take a font change it and then use it as a font you are on safe moral ground is my perspective. And to that end I would just work in Illustrator.<br>
      Try it and if you want to get some opinions post it in the Critique section.<br>
      Tim</p>
      <p>ps In future perhaps you should start a new thread and link to another if you think it is relevant</p>
