    html: |-
      <p>This is a funny design :) I like the idea, and it's very well done. I haven't looked at it before, so I can tell what doesn't work for me on first glimpse:</p>
      <p>- H  (can't tell why, but I didn't recognise it)<br>
      - i: no dot? What about mirroring the upper part upwards (so there is a quarter circle with the round part on the lower left side)?<br>
      - j: like i?<br>
      - z: what if the upper left block was a square?</p>
      <p>I think things like &amp; and fi-lig work if they stand alone (i like the idea to do such things), but I don't believe that they will within words. And i fear that they would disturb the recognizability of the other letters, as there are "unknown" elements between them, making the viewer insecure about the rest.</p>
      <p>I like the alternative W better, but I would stick with the old M.</p>
      <p>The hybrid element is an excellent idea. And I specially like the "flaming" characters like E, F or N.</p>
    html_clean: |-
