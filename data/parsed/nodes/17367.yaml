      <p>I've added a file entitled "ty_psychology_05.pdf"  I have added an extra row at the bottom of the file with ideas for changes:</p>
      <p>• lowercase l - It would look the same as the uppercase I (eye) and number 1, but I thought it helped the flow and perhaps will make future ligatures easier</p>
      <p>• uppercase K - It becomes top heavy instead of bottom heavy. I think it's an improvement</p>
      <p>• three capital Xs - I'm leaning to the last of the three, as unusual as it looks</p>
      <p>• fi ligature - I decided to attempt a ligature. I'm not sure what others would work</p>
      <p>• star shape - Simply a decorative element that I thought looked interesting</p>
      <p>Thoughts?</p>
