    html: <p>Currently it takes forever to set the type in Illustrator, so it would be nice to have a more efficient way to type it out. Also, I would like to go through the process of finishing out a font. I plan to create other fonts in the future, so I see this as an opportunity to cut my teeth and learn the software and process.</p>
