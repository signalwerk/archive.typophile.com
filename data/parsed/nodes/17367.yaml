      <p>Tiffany and Mårten previously made comments on my font. Below are my responses to their comments:</p>
      <p>Tiffany:</p>
      <p>I have attached a PDF with some variations on the lowercase t. Which reads best to you?</p>
      <p>I like your suggestion about keeping the font for personal use. It has actually been used once already in the new logo I created for the design firm I work for. I'll post a link when we unveil the new logo.</p>
      <p>Mårten:</p>
      <p>Originally my intention was to create a font with only squares and wedges. The challenge came when I came to the 3, 8 and &amp;. I applied the hybrid shape to the w and W. I think that helps lighten them up some. I've attached a PDF - let me know what you think.</p>
