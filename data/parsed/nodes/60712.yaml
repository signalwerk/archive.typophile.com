      <p>Dear Satya,</p>
      <p>I cannot not react on some of your comments as I find them rather vague and some of them simply not valid. Please, excuse the length.</p>
      <p>&gt; I like everything about Reading students, but what I don’t like about them is the ignorance they pay to their non-Latin designs,<br>
      &gt; specially to the Indics. They never seem to do it properly. All their typefaces I have seen so far looks alike and has a typical Fiona<br>
      &gt; Ross style in them. Nice smooth curves, but lack of a balanced skeleton.</p>
      <p>Can you please describe what is the Fiona Ross’s style in more detail? As far as I am concerned Fiona never attempted to influence my style while I was designing my Gujarati. In fact she is extremely cautious about that. Her teaching method is style-independent I would say. Therefore, to me, and I believe to most of the people who did any Indian script with Fiona, this must sound like a ready-made opinion. It is not based on any evidence. There is a significant stylistic difference between Surat, Vesper, and Martel/Malabar for example. How can you not see that? It is three different styles and you refer to all of them as Ross’s style?</p>
      <p>Or is the balanced skeleton part of what you refer to as a style?</p>
      <p>Little note about the ignorance. Personally, I did (and every student is encouraged to do so) a significant research of Gujarati typography. I might be an ignorant, but I am not aware of studies of similar scale (about the same amount as Emma Williams’ work on Gurmukhi and other works on non-Latins) in Gujarati. The students' strive to understand the writing system and its conventions is immense. How could you possibly call such a research-based approach an ignorance?</p>
      <p>Also, please refer to Indian (or Indic if you wish) scripts only, not to non-Latins. Are you experienced in judging/designing Arabic, Ethiopian, Cyrillic, … As far as I understood, you are Hindi with some understanding of Gujarati. Correct me if I am wrong. In what respect you are entitled to judge the other Indian scripts more than the students? Have you done research of similar scale for all of the scripts?</p>
      <p>Last time I did ask you about my Gujarati and you did not have any comments (besides typos which is purely linguistic comment). I would very much appreciate some, once I am working on it again.</p>
      <p>&gt; I am not pointing towards any individual here, but a personal reflection to the course as whole. Never mind. :D</p>
      <p>It would have been better if you did point towards individuals, because as a reflection on the course it is simply not true as I attempted to explain above. And the reasoning is completely independent on readers’ understanding of Indian scripts. Hence anybody can make their own picture.</p>
      <p>I am not going to elaborate much on the misspellings as I would just repeat Eben's words. The limited time and focus on typeface design instead of language are the main reasons for such mistakes. My Surat specimen is full of them and nobody so far intepreted it as a typographic ignorance. Of course it would be much nicer to have it without them and much more respectable to the language, but it has nothing to do with typeface design. It is almost certain, that I left many typos in this text, but I believe the readers will get the meaning despite my language deficiencies.</p>
      <p>David</p>
      <p>—<br>
      davi.cz</p>
