      <p>I really see it as a privilege to have someone like Fiona as a teacher for designing non-Latin typefaces.</p>
      <p>In my eyes, Fiona is one of the few type designers with a trained and experienced eye in non-Latin typeface design who is able to guide students (and professionals) along the path of designing a non-Latin font. During the entire process your she puts the emphasis on experimenting with different calligraphic styles, understanding the various typesetting systems, achieving a good execution of the glyphs, taking advantage of the possibilities of contemporary font technologies and undertaking sound research in order to achieve contemporary fonts of high quality. She does not advocate a 'house-style' but encourages each of us&nbsp;to find our own voice and design methodology.</p>
      <p>Since 1978 she collaborated in designing typefaces for many non-Latin scripts (first for Linotype and later for Adobe), and I believe that the millions of international readers (and compagnies) that read the newspapers and magazines for which she (and her team) designed the non-Latin typefaces never complained about any unbalanced skeleton in her designs. On the contrary, I believe that her typeface designs just include a balanced skeleton, that's one of the aspects which makes them good textfaces for setting long paragraphs. And this is probably also the reason why so many clones (not to say rip-offs) of her non-Latin typefaces are out there. (Also, see: <a href="http://www.typojo.com/pages/kolkata.html" title="http://www.typojo.com/pages/kolkata.html">http://www.typojo.com/pages/kolkata.html</a>)</p>
      <p>Regarding the MA students, do not forget that they worked on their designs for period of&nbsp; 'only' 10 months, which does not make one a professional designers just yet. Should one not be glad that more people are trying to produce well-researched, good quality fonts for scripts where there is not enough variety? I have had excellent feedback from the Tibetan community on my font (also, designed under Fiona's supervision).&nbsp;</p>
      <p>- btw Satya, I recall that you spent an entire afternoon in the department with Fiona and me and John Hudson showing you (and Fabio) the Linotype Non-Latin collection. You did not show any indication then that you considered the typefaces poorly designed.</p>
      <p>regards,<br>
      Jo</p>
      <p><a href="http://www.typojo.com" title="www.typojo.com">www.typojo.com</a></p>
