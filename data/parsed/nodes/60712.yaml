      <p>I agree with satya, the English fonts look good, the Indics; with all due respect are pathetic. Linguistically, they have not even written a single line correctly. The letters are not balanced at all, some of them seem to have been written in the wrong (sequence)way. The Tamil is quite ungainly, it would have helped them a lot if they could have atleast learned the language or shown it to some Tamil font designers (who have a greater sensitivity than Tamil natives). It is one thing to look at a font as a novelty, completely another to use it everyday in every context, plus a comparative with exiting fonts by natives would somewhere suggest which one is more aesthetically pleasing.</p>
      <p>Fiona Ross is a wonderful researcher, but I think she is famous as a type designer only in the west. In India I'm not so sure as to how many people use fonts designed by her. I think most of Fionas' fonts were designed and used in the pre-digital era because linotype had a monopoly on printing machines, in the digital age this monopoly was broken and a lot of local designers have made some very nice fonts which are in popularly being used. I feel westerners are not exposed (or do not acknowledge) Indian type designers/researchers.</p>
      <p>Finally I'd say good work on the Latins, but I think you have a long way to go for the Indics, the first step I guess is learning the language.</p>
