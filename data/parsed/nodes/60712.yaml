      <p>Vikas: <em>I have friends both in NID and IDC, I’ve seen them work on a font for years. I myself have been working on some fonts for a while, I must I am as harsh on myself as I am on others hence have not been able to release/display any of my fonts.</em></p>
      <p>Similarly, it should be noted, very few of the Reading MA student typefaces are ever released (either the Latin or the non-Latin): they are student projects intended to develop and demonstrate certain skills, not to produce a releasable typeface. Some of the students go on to complete/extend and release their student projects after they graduate, usually with much revision such that the final versions are noticeably different from those shown in their student specimens (which are, by the way, one of the course deliverables; i.e. they're making the specimens because it is a requirement of the MA programme).</p>
      <p>Most of the Indic and other non-European designs produced by Reading students, so far as I can tell, tend to be unfinished. So some of the errors in the specimen text may be due to incomplete glyph sets or only partial OpenType Layout. Again, the goal is not to produce a font ready for commercial release, but to develop and demonstrate specific skills. As someone who has hired graduates of the Reading programme, I can say that I'm interested in what the designs tell me about the skill set of the student, not whether I like the typeface or consider it complete or ready for release.</p>
      <p>I also note that most of the non-European designs tend to be pretty conservative, more so than the Latin types (a notable exception is David's Gujarati). I suppose this might be a criticism, but given how many really crap non-Latin fonts exist in which someone has tried to be novel or has tried to apply decorative elements proper to display typography to text sizes, there's a lot to be said in favour of conservatism.</p>
