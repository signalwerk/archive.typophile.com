      <p>clauses—</p>
      <p>Splendid work to you and your cohorts. </p>
      <p><cite>Thank you everybody. Do continue to let the comments roll in, it’s very interesting to hear what the outside world thinks.<br>
      </cite></p>
      <p>I can gladly throw in the opinion of a complete laymen in typography and an aspiring graphic designer. ;) You'll have to work with me: my type lexicon is still in its infancy.</p>
      <p><cite>Personally</cite> speaking, I am particularly turned off by Capoeira, You Are Here, and Guillotine. ( I would say Okapi and Cantarell, as well, but I can tell that those two are designed uniquely to different categorical standards. This is a thought that I have that I cannot explain well, but just feel).</p>
      <p>Anyhoo, in particular, I do not like these fonts because it feels as though they are moving, like they are fluid or dynamic. I particularly am found of type that is eternal and static. But type that has this motion feel feels very novel—maybe even child-like—and it seems to lack the necessary rigid elegance and eternity that a "professional" font would otherwise have. I was first made aware of this when I laid eyes on MS's Candara ( <a href="http://www.microsoft.com/typography/fonts/family.aspx?FID=295" title="http://www.microsoft.com/typography/fonts/family.aspx?FID=295">http://www.microsoft.com/typography/fonts/family.aspx?FID=295</a> ) . </p>
      <p>I think I was raised in a time where the general public were exposed to sans serif typefaces that were a clean mix of thick lines and thicker lines—no nonsense. Now, it seems as though more and more type has this bulging, expanding, and subtle curvatures. It's very different from the ubiquitous—and comforting—presence of typefaces like Futura and Helvetica.</p>
      <p>But that's just my rambling!</p>
      <p>Nice job. :) </p>
      <p>PS How do you pronounce your last name? I have always found the word Søren to be overwhelmingly beautiful.</p>
