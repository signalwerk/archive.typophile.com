      <p>With Karsten's cue, I should maybe explain what I meant by that. I think that if a type works well as a text face as designers we stop looking very hard at why it is working. Similarly we don't investigate why the water works in our house. If it does, we are happy and we leave it at that. It doesn't make us bad people. But as this is a type site some of us will be wondering... So I will explain what I meant.</p>
      <p>Without meaning to beat anybody up ( see the text above!) I think it is fair to agree with Paul Halupka and admit that graphic designers do quite often lack the skill with which to assess a text face. Not all graphic designers set books or magazines after all. Some of us make logos or do other things. So some, even many, (most?) graphic designers will not be able to quickly assess the MATD designs, or to be fair, any other group composed of text faces. I have been a member of that group.</p>
      <p>Where I disagree with Paul Halupka is that you have to be a font freak to see the difference once you set some text in a few different type faces. Even a long time logo designer, once they try setting text will suddenly see a great deal of difference. Even if they don't know why that difference is there. </p>
      <p>And people who routinely make choices about setting text may not know in detail why they make their choices. But they are responding to differences in voice and weight and color. And if they are experienced they may also be making that choice based on factors like weight flexibility, glyph range, relationships betwen romans, italics, smallcaps etc. And in some cases because they know know how a type ( or formal charcateristic of a type ) acts on a given kind of paper stock when printed using a certain method.</p>
      <p>So with that as a context; what I think is fun about this crop of MATD typefaces is that the ones which are meant to be text faces of one kind or another* work in some ways partly because formal characteristics such as tending to be relatively low contrast for instance, which in this case they mostly share, but also in spite of very different approaches to construction, levels of noise in their shapes so on. Admittedly these differences in approach are hidden under the skin of "working". But if you start to compare the letters shapes closely, or set texts in the fonts, I am confident that the difference in he fonts voice or feel and the differences in suitability to a given task will jump out at you. </p>
      <p>*text faces come in a variety of sub varieties after all</p>
    html_clean: |-
