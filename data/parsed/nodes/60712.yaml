      <p>"I think most of the latin designs look alike, and they look similar to previous years...Perhaps the instructors influence the students too much."</p>
      <p>I tend to agree that not only Reading but design schools in general tend to graduate students with portfolios with a certain sameness. Perhaps I might say that the prevalent look of Reading work is towards chunky text faces. Having said this, I don't find that this requires admonishment.  We have to remember that this is a school whose job it is to produce competent students, not so much for the student work to be highly original. We have to remember that this is student work examined and discussed regularly by faculty and fellow students. This methodology would by its nature bring a certain amount of sameness to the classwork and final projects.</p>
      <p>A better question is, how good or original (if that is your criteria) is the work of the graduates a few years after completing Reading? We have to give each graduate time to blossom out of their student chrysalis and spread their own professional wings.</p>
      <p>ChrisL</p>
