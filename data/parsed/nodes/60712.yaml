      <p>Originality is a very difficult topic. But I do agree with Nick that a teacher can choose to emphasize helping the student to develop his or her individual voice and vision--or not. </p>
      <p>And I do get the feeling that the emphasis at Reading is on producing the skills and understanding to get a job in the font industry. That they seem to be succeeding at this is an impressive achievement. </p>
      <p>I do get the feeling from looking at the typefaces that they don't emphasize as much development of individual voice and vision. But it is very hard to judge this from the outside, as it is also a matter of which students choose to attend, and what those students want out of the year. </p>
      <p>At TypeCon in Atlanta Gerry Leonides did say that he wants the students at Reading to do text faces, as these have additional demands that display faces don't. This seems to me a pretty reasonable point. </p>
      <p>I agree it is harder to be original with text faces, but I don't agree that originality is impossible or unimportant. You have a narrower scope to express originality, but it can come out strongly still, if the designer has a strong and consistent enough vision. Just look at Goudy Old Style or Palatino. These are unmistakable, original text faces, even though they may vary less than 5% from the faces of Jenson and Griffo.</p>
