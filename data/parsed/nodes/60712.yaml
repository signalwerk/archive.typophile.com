      <p>Agree. Having done the Reading MA in 2004-2005, and watching Robert Slimbach's processes and struggles of designing text typefaces during the past 3 years, I believe that the level of originality in what we call a readable/legible typeface can only be about 5%.</p>
      <p>Just look back to Jenson's roman type in <em>De Evangelica Preaparatione</em> from 1470. How much have things evolved since then? What significant events happened in 500 years? Quirkiness was tamed, x-height grew, and sans serifs sprouted. Anything else? Is this comparable to the shift from blackletter to roman type? The development of sans serifs may be, assuming we don't acknowledge them as mere roman type without serifs.</p>
