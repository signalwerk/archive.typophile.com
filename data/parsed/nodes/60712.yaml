      <p>@_Palatine_  There is a point where the serif becomes too long and there is also a point where the serif is too short [from the point of view of the designer]. This might be different on either side of the glyphs stem, considering the whole of the letter and what the composite elements of the glyph are doing. Sometimes a serif may need to be shortened in the inside of a letter (n) to avoid serifs from becoming too close, with a chance of touching, when printed, and therefore closing up the character. When there are more than 2 or 3 occurrences of shortening the serifs on the inside of the letter this might suggest a style to populate throughout the character-set. I don't remember being told this, but it just seems to make common sense. </p>
      <p>I would have said this before... the course (any course) is a chance to try things out, why just do something boring and simple, try variety – experiment.</p>
      <p>My font Pseudo considered serifs to be malleable like clay, where I could add a little or take away to give balance to the letter-forms.</p>
