      <p>To state the obvious, all Latin typefaces to a greater or lesser degree look similar due to the fact that they are all based on the same skeletal forms. If you are to investigate similarities (totally valid) what is it that you find similar and then is this similarity a good or bad thing - is it correct or incorrect, is it useful or a hindrance?</p>
      <p>These fonts are not being designed in a vacuum. (I am of last years cohort) you do have the attention of your classmates and of the tutors of which access at variable frequencies (not every day). Also time factors into the design process. After a short time of experimentation, the thing (typeface) needs to become *real* and so perhaps similar processes are used here as 'proof of concept' that everyone *can * create a typeface.</p>
      <p>I am interested in the comment about the stability of a typeface and if the character stands firm or throws weight onto the next character. NICE.</p>
      <p>/m</p>
