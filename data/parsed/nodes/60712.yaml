    html: <p>i can't speak for others, but Grandia was influenced by (as far as i can best identify) Menhart + Dwiggins + Unger + perceived constraints for printing at small sizes + the desire to harmonize with Devanagari (highly calligraphic influence) + my own design aesthetic. I'm certain that certain other students have also been inspired to varying degrees by the first three influences at least, still others perhaps have been fascinated with type for small sizes. Had I chosen Tamil, Telugu, Sinhala or a script based on pointed pen construction for my non-Latin portion, I would probably have done a modern face for the Latin. The style I chose seemed to me to tie together all the influences/constraints that I wanted to bring together.</p>
