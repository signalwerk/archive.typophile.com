      <p>I like everything about Reading students, but what I don't like about them is the ignorance they pay to their non-Latin designs, specially to the Indics. They never seem to do it properly. All their typefaces I have seen so far looks alike and has a typical Fiona Ross style in them. Nice smooth curves, but lack of a balanced skeleton.</p>
      <p>Also, they never care to set a single line without making mistakes in their specimens. I understand it to a certain extent as they can't read the script, but then they can always get it proof read, if they care at all. They will use some random text with thousands of mistakes in it and overall it will make no sense. Remember, text is meant to be read, even if it's a dummy text. And it says the best about a typeface when it's set in a proper text.</p>
      <p>I am not pointing towards any individual here, but a personal reflection to the course as whole. Never mind. :D</p>
