      <p>The majority of Reading student designs are low-contrast, semi-condensed, non-geometric, serifed text faces of conventional letter shape (e.g. all g's are binocular), with large x-height and ascenders that extend beyond cap height.</p>
      <p>For differentiation from one another, they rely on styling details such as asymmetric serifs, which serve no function in a text face.</p>
      <p>That doesn't make them dysfunctional, because they can still work very well with redundant features, although very few if any classic, established text faces have asymmetric serifs, which would suggest that it is not a good idea.</p>
      <p>But the merit of any one face is not really the issue.<br>
      What does it say about a course in type design, that the majority of the faces hew so closely to a uniform template, year after year? </p>
      <p>Students should be encouraged to become aware of what is informed by both convention and trend in their shared taste (and that of the faculty) and step beyond it, experimenting with the basic parameters of type form-- x-height, extender length, and contrast (both of stem widths and letter widths), perhaps even adopt non-conventional letter forms. Is the New Typography of the previous decade dead history?</p>
      <p>There is plenty of time to be "contemporary" once one has graduated, but surely--notwithstanding a solid grounding in technical competence--design education should be more devoted to experiment with fundamental form than styling.</p>
