      <p>Nick: <em>For all the things that Tamil and Devanagari are, they are not inherently device-dependent (i.e. “calligraphic”) in their appearance, which IMO is a mistaken view, even though their letter forms may have originated with specific media, as did the Latin script.</em></p>
      <p>My take on this is that every writing system is tool-influenced and insofar as these tools influence the development of the normative shapes of writing during the maturation and standardisation of the script, then they more or less limit the kind of modifications that can be made without undermining those shapes in ways that may affect both legibility and cultural acceptance of new designs. Of course, other factors apply in the latter regard, not least the relative adventurousness or conservatism of the individual culture. But the influence of tools and how those tools are used can't be ignored willy-nilly. As I've written elsewhere, I think the term ‘calligraphic’ is imprecise and misleading, so should be ignored, but is what Paul is saying is that the normative forms of Devanagari letters are influenced by the use of a broad nib tool held at a particular angle, and that other scripts such as Tamil are influenced by different tools used in different ways, then this is a sound observation. He's playing it safe in treating Devanagari as he has in his Reading project, but if he chose not to play it safe, then he would have to deal with the contrast between the influence of traditional tools and methods on the normative shapes and trying to treat those shapes in different ways.</p>
      <p>Scripts are not device-dependent, but nor are they entirely device-independent.</p>
