      <p>I want to remind folks that the specimens you see from recent or soon to be graduates at MATD -Reading, KABK, or any other type design MA program are works in progress. They show engagement, process and thinking. They are not products. The specimens are made under significant time pressure and often include some errors of grammar setting etc. If they can sometimes be mistaken for products - that is really a statement in their favor. A kind of happy accident or proof of being exceptional. The reality is, obvious or no, is that all these projects will need more time to become polished and refined tested etc before they can be released.</p>
      <p>Also I actually disagree about the type looking alike this year. I think there is an amazing amount of diversity of style on the more obvious aesthetic level and of approach if you take the time to look more deeply. I think that it is great that students' strange experiments can be made bubble under the surface rather than jumping out at you. </p>
      <p>Christopher, read the eco font site more carefully. You have not noticed that you are supposedly forbidden from talking that idea and using it. I don't think they can enforce that but... But more importantly that post is off topic. Start a new thread or further one that is about that topic.</p>
      <p>Farquart Qimbosole, what is your real name? I have seen your registration and it looks made up to me.</p>
      <p>I have to confess for anybody who doesn't already know it that I am both a MATD student and a Moderator. No doubt this colors my view to a significant extent.</p>
