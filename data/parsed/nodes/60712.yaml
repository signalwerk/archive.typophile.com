      <p><em>The majority of Reading student designs are low-contrast, semi-condensed, non-geometric, serifed text faces of conventional letter shape (e.g. all g’s are binocular), with large x-height and ascenders that extend beyond cap height.</em></p>
      <p>At first, I am not completely sure if this statement is valid at all. How many years do you include in your calculation? Did you do that calculation at all or is it just a feeling?</p>
      <p>Second, perhaps the same can be said about contemporary text typefaces in general? So what does it say about the students’ work? That they understood the genre. The goal, for most of them, was to design a text typeface. Working text typeface. If somebody want to spend a year designing display type, that is their choice. The people usually aim bit higher, for dictionary typefaces, newspaper typefaces, … in order to make use of the academic year. So that is the reason why they chose to follow the way of "careful originality" or say "readable originality".</p>
      <p>Third, non-geometric, low capitals, serif that is a must for a typeface usable in long texts. Large x-height, low contrast is a need for small sizes. Give me high-contrast sans-serif newspaper or dictionary typeface. The students just understand their brief.</p>
      <p><em>For differentiation from one another, they rely on styling details […] which serve no function in a text face.</em></p>
      <p>That is exactly the point! The styling has minimal function that would affect the readability. Much better option than originality for the sake of originality (venetian -e- or single-storey -g- for example). The problem is the differing understanding of what readability is. Where you go for subjective evaluation of what is and what is not readable, I would go for definition based on convention.</p>
      <p>I would prefer if people avoided biased comparisons of the KABK and Reading. There are similar "inspiration threads" at KABK: Underware-like, Noordzij inspiration, … and at the same time there is some interesting stuff going on.</p>
      <p>Type design is a craft at the first place. If you think you can teach being original… ehm. well, you can keep thinking that. That would be a pain to discuss it.</p>
