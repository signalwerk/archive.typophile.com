      <p><em>Did you do that calculation at all or is it just a feeling?</em></p>
      <p>Neither, it's an observation.</p>
      <p><em>So what does it say about the students’ work? That they understood the genre.</em></p>
      <p>That they didn't question the conventions, or the trends.</p>
      <p><em>Large x-height, low contrast is a need for small sizes. </em></p>
      <p>For agate, perhaps, but otherwise that is simply not true. Presently, large x-height faces appear to be in vogue for text, as they were thirty years ago. Is that a need? </p>
      <p><em>Where you go for subjective evaluation of what is and what is not readable, I would go for definition based on convention.</em></p>
      <p>It may be better, educationally, to try to achieve readability in a type design based on unconventional premises. But in my experience, when a student comes up with a set of premises for a type design, it's difficult to anticipate what the outcome will be, or what will be learnt. It may well be possible to learn more from attempting the impossible and failing dramatically. At any rate, I do not grade students by "subjectively" looking at the face and deciding how good or readable it is, or how "creative" the premise, I look at how well they have gone through the process of crafting it.</p>
      <p>The journey is more important than the destination, and if you believe that, you will end up at the right place.</p>
      <p><em>If you think you can teach being original… </em></p>
      <p>I've never taught an MA in type design. But teaching type design to graphic design students, most of whom have no special interest in typography, they always amaze me with the variety of work they come up with.</p>
