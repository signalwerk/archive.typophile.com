      <p>I'm personally very much enamored of Coline. It carries the torch, I think, of the emerging aesthetic embodied in faces like Skolar, or Freight Micro, or the sketches of Kompilat that were kicking around here a year or two ago. </p>
      <p>Actually, insofar as a number of the faces this year seem to tap into that feel at various levels, I'd say there is a kind of cohesive school to the output of...um...the Reading school. I think that's a great thing, though. It all *feels* very contemporary and of the zeitgeist to me. </p>
      <p>I'll leave it to the better-informed and -read to offer less subjective insight. I'm sticking to unqualified admiration. Again, congrats.</p>
