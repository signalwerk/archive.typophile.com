      <p><em>Fiona Ross is a wonderful researcher, but I think she is famous as a type designer only in the west. In India I’m not so sure as to how many people use fonts designed by her.</em></p>
      <p>Linotype Bengali -- or the numerous unauthorised clones of it -- is the most widely used Bengali text type in both Assam and Bangladesh. The importance of this design, by Fiona Ross and Tim Holloway, was acknowledged in the recent exhibition of Bengali typographic history in Kolkata, to which Fiona was invited as guest of honour. To suggest that Fiona's work is not used in India is simply ridiculous.</p>
