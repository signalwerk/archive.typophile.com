      <p>&gt;then that 5% that accounts for their difference constitutes 100% of the value that determines the choice.</p>
      <p>Well put!</p>
      <p>Originality in type design is a weird thing in that it is so hard to pin down, yet there is a remarkable degree of commonality in response to it, at least with a design that is excellent as well as original.  </p>
      <p>For example Gotham is a revival and execution of traditional designs, yet people have widely responded to its freshness, particularly of the upper case. And even there it's hard to pin down what's new.  </p>
      <p>Also the truth about the impact of teachers is somewhat elusive. Here are two opposite sayings about teaching. One,from the movie The Karate Kid: "There are no bad students, only bad teachers." The other from a prospective guitar teacher for my son when he was a teen: "It's not the teacher, it's the student."</p>
      <p>No doubt there's truth and exaggeration in both, but the magic of what happens or not between teacher and student is a bit mysterious.</p>
