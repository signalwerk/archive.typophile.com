      <p>Perhaps relevant to the discussion of non-Latin (specifically Indic) typefaces in this thread, I am running a little experiment in the following thread:</p>
      <p><a class="freelinking external" href="http://typophile.com/node/67613" rel="nofollow">http://typophile.com/node/67613</a></p>
      <p>I have long suspected that those who don't read a script simply don't see the same things that a typographically attuned native reader sees. I've posted a sample of the hangul (Korean alphabet) of two fonts bundled with Windows, Arial Unicode and Gothic. The latter is a solid if dated design by an influential twentieth-century Korean type designer, while the former is a disaster; even Koreans who don't pay much attention to typography wonder why the Korean is displaying all weird when they come across web pages or applications that display hangul in Arial Unicode.</p>
      <p>You non-Korean speakers are welcome to comment on how you think the two compare in the sample.</p>
