    <p>Can someone help me out with a potential OpenType problem?  I say potential because I really don't want to go the OT route unless absolutely necessary (because, 1. I know nothing about it, and 2. I can't even afford to upgrade from TypeTool to Fontlab right now).  Here's the problem...</p>
    <p>I want to work with an indigenous script that is prone to be written with continuous connecting bottom segments, like a retro-style, futuristic, boxy script (think Fontdiner.com logo).  Each letter has two forms:  1. within the word (that is, connected to the letters appearing before and after it), and 2. terminal position (a connection line to the preceeding letter, but no terminal line after the final letter).  </p>
    <p>I could simply design two entire sets, and this writing system has no UC/lc distinction so using the shift key to vary between forms is not out of the question.  Of course, a standard keyboard layout has yet to be established for this language (it has only just recently entered the final stages of Unicode assignment).</p>
    <p>Anyway, how does OpenType work in this situation?  Will it be practical, or should I just resort to typographic tricks?  (The script has a connecting device similar to Arabic Tatweel--a solution perhaps, but I'd hate to make someone type this ancilliary character after every single letter in a word.)</p>
    <p>Thanks.</p>
