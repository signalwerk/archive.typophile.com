      <p>Drop me an e-mail at  and I'll put you in touch with Paul Nelson and Peter Constable.</p>
      <p>Regarding priorities in Unicode encoding, it all depends on someone submitting a proposal for a script encoding, not on the number of speakers of a language. Also, scripts with fewer users are sometimes easier to get proposed and approved than those with more speakers, because there are fewer bodies with a stake in the encoding. As I understand it, the N'ko encoding involved considerable academic and government activity, which is a good thing but also time consuming and expensive. A script like Vai can be proposed by one or two experts and make its way through the review and approval processes relatively quickly and inexpensively.</p>
