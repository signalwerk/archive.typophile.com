      <p>There are a number of issues to consider. What is the script?</p>
      <p>If it is not yet finalised in Unicode, I think your best bet is to discuss this question with someone at Microsoft Typography (I can put you in touch with someone, if you like), since they are likely to be the first people supporting the script using OpenType Layout, and what you need to do is figure out with them what approach they will take to the layout. There is some flexibility, of course, in how you make a particular OpenType font work, but you need to understand what the shaping engine model will be for the script, as this will determine what OTL features will be applied when an application encounters characters from this script.</p>
