      <p>Good, John, I was hoping you'd see this.</p>
      <p>The script is N'ko. It's West African in origin (and only a little over 50 years old!) with somewhere around 20 million users. As a side note, the Vai script and language was granted Unicode assignment (and attention from SIL) before N'ko--go figure, just under 100,000 speakers.</p>
      <p>Yes, I'd greatly appreciate you putting me in contact with Microsoft Typography on this one.</p>
      <p>Thanks John.</p>
      <p>A.</p>
