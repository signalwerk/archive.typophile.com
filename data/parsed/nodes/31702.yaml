    <p>(audio from pulp fiction, NOT SAFE FOR WORK)</p>
    <p>Quote by Motionographer:<br>
    <cite>SCAD student Jarratt Moody is in Time-based Typography I here at SCAD (a course for which I’m currently the teaching assistant), and he recently finished up a really nice piece for the first project in the class. The basic idea of the project is to take a piece of audio from wherever (movie, song, poetry reading, answering machine) and then represent that audio on screen using only typography.</cite></p>
    <p>Jarratt chose a famous bit of dialogue from Pulp Fiction as his subject matter. (Okay, what dialogue from Pulp Fiction isn’t famous?) The resulting piece is full of whimsy and style. Jarratt does some great things with scale and simple but effective camera movements. Get those headphones on and prepare yourself for several lashings of Samuel L. Jackson’s naughty tongue.</p>
    <p><a href="http://www.motionographermedia.com/jarrattmoody/intonation.mov" title="http://www.motionographermedia.com/jarrattmoody/intonation.mov">http://www.motionographermedia.com/jarrattmoody/intonation.mov</a></p>
