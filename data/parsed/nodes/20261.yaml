    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">ABC</span>-Schrift</strong></p>
    <p>Swiss type designer Hans Eduard Meier created a typeface for the use in primary schools called <span class="caps">ABC</span>-Schrift. It is a “continental” typeface which is closer to printing typefaces than the former typeface after which Swiss pupils had to learn to&nbsp;write.</p>
    <p>The typeface and instructions to it can be seen at <a href="www.Schulschrift.ch">Scriben lernen</a> (German) and is available from <a href="http://www.elsner-flake.de">Elsner+Flake</a>.</p>
    <p>The new primary school typeface is successfully in use in several cantons of Switzerland. Its informal approach provides that pupils achieve a more individual handwriting. Furthermore it is much more modern than the former so called “Schnürlischrift” which is still in use in some Swiss cantons. It makes it easier to learn to read and write because it is closer to printing typefaces pupils are confronted with in day-to-day&nbsp;life.</p>
    <p><strong>Other Resources:</strong><br><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=ABC"><span class="caps">ABC</span>-Schrift at&nbsp;FontShop</a></p>
