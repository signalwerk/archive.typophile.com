    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : ABC-Schrift</strong></p>
    <p>Swiss type designer Hans Eduard Meier created a typeface for the use in primary schools called ABC-Schrift. It is a “continental” typeface which is closer to printing typefaces than the former typeface after which Swiss pupils had to learn to write.</p>
    <p>The typeface and instructions to it can be seen at <a href="www.Schulschrift.ch" rel="nofollow">Scriben lernen</a> (German) and is available from <a href="http://www.elsner-flake.de" rel="nofollow">Elsner+Flake</a>.</p>
    <p>The new primary school typeface is successfully in use in several cantons of Switzerland. Its informal approach provides that pupils achieve a more individual handwriting. Furthermore it is much more modern than the former so called “Schnürlischrift” which is still in use in some Swiss cantons. It makes it easier to learn to read and write because it is closer to printing typefaces pupils are confronted with in day-to-day life.</p>
    <p><strong>Other Resources:</strong><br>
    <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=ABC" rel="nofollow">ABC-Schrift at FontShop</a></p>
