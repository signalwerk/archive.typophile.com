    html: "<p>Without knowing what is actually going on with your display, you could check whether everything is as planned by printing separations from your PDF to another PDF by printing from Acrobat to the Adobe PDF printer: Print-&gt;Advanced-&gt;Color: Separations and then select what you want in the ink manager. Probably the preview will already show you if everything is as you wanted it.</p>"
