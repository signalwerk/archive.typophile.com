      <p>your welcome...<br>
      Also, remember inks and especially black are translucent, so if you overprint a colour the based colour will show through when overprinting,  if the job was half green and half red the black if overprinted (and being a large graphic) would look different.</p>
      <p>when to use overprinting when the point size is 5point or less?.. or if 9 point or less on newspaper print.</p>
      <p>it's all trial and error.</p>
