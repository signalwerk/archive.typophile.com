    html: |-
      <p>Hi, it looks like you have the overprint switched on for your type, select the type and turn the overprint off, if not that then check your black it could be the registration black (though with the red showing through the black it looks like you have overprint switch on for that type)</p>
      <p>Also in preferences for Indesign, 'appearance of black' switch off 'overprinting black' and the options for RGB and grayscale 'printing/exporting' switch to 'output all blacks as rich black', (having it as 'output all blacks as accurately' can result with black not being 100% K when exporting a grayscale. </p>
      <p>With Indesign you can view with overprint on, then you will see where you are going wrong and what has an overprint or..... is registration black or special black.</p>
