    html: |-
      <p>Overprinting black is used to prevent gaps by just printing black over all the other inks. When you look at the separation plates you can create for both versions, you should notice that the red background isn't knocked out by the black objects when overprint black is turned on. When it is turned off, there would be white areas where the black will go.</p>
      <p>Disclaimer: You should verify with your print-shop and others here will also know a lot more about this than myself... My general understanding however is that you would usually  want to overprint black so you don't get gaps from misalaignment where the different colors meet. You could also use trapping to compensate that but as the black ink would be opaque anyway, overprinting would render more consistent results - given that it is suitable for your particular printing scenario.</p>
