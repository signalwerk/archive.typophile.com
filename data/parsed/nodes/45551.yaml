    <p>Hi,<br>
    I'm struggling with pdf export to print. I have a document, where the cover page has a red background with a black graphic and a black title on it. The graphic is imported from Illustrator (.ai) and created originally in the same cmyk profile as the ID document. It, like the text is 0c0m0y100k, but in ID overprint view as well as in final pdf file (Acrobat's overprint) it shows the graphic as gray but the title as dark black.</p>
    <p>What has happened there? I know that cmyk 100k black shows gray on screen, but I'm worried that these two black objects on the cover print differently, one gray, the other black.. I've checked that their (ID and Illustrator) color profiles are the same and without overprint preview in Acrobat both objects look gray. Only in overprint does the title turn out black. I also tried to import the graphic as Illustrator tif-file, but that looks gray, too.</p>
    <p>Any help appreciated,</p>
    <p>--patrik</p>
    <p>edit: added an image (screen shot) showing the problem when viewed in Acrobat..<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/two_blacks_6212.jpg"></div><p></p>
