    <p>Hey there, I am doing a new site called trini block.com (no spaces) and I am looking for a fun font. To give you an idea of content, check out trini scene.com, trini pulse.com and island vibes.com (again, no spaces in the names). I am looking for something nice, to put as the site logo, to make Tshirts and to use as a logo for watermarking images. We’re just stumped here and I understand this is an excellent community where typography is concerned, so any help would be much appreciated.</p>
