    html: |-
      <p>You are right, Scala Sans has some similarities (haven't noticed this yet).</p>
      <p>It's no modification of Scala, but was derived from <a href="http://typophile.com/node/17136" rel="nofollow">Sofa Serif</a>, which is based on a drawing of mine. But of course there are influences from post-modern typedesign Scala belongs to.<br>
      My first thought when drawing was "how would Formata Serif look like?", but I think it has left this initial thought, while working on it.</p>
