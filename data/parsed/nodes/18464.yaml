    html: |-
      <p>This is great - lots of feedback for you...</p>
      <p>I know you haven't tightened spacing yet (its good loose!) but, relatively speaking is there too much space on A? E and F right sidebearings loose?</p>
      <p>Plus (in no particular order)...</p>
      <p>Apostrophe (quoteright) seems to be a quoteleft in pdf?</p>
      <p>Lower arm of k seems optically thinner than upper arm? Upper case seems OK.</p>
      <p>u (and mu) seems considerably narrower than n and h? Maybe optical?</p>
      <p>breve light compared to other accents?</p>
      <p>Dots on i and j too heavy? Are they same as period?</p>
      <p>2 (and perhaps 7) looks wide compared to other numerals?</p>
      <p>Do arms of multiply deliberately not cross at right angles?</p>
      <p>Stroke at the top of the 1 seems inconsistent with the rest of the typeface? Tapering is a new treatment (except in accents such as grave, acute, circumflex, caron etc) I can't find another shape like it. Can't it be like other characters? Something like this (I have deliberately left the arm quite long to help with tabular numerals)...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SofaSans1.gif"></div><p></p>
      <p>Arms of E and F seem narrow compared with horizontals in D?</p>
      <p>t seems very hooked compared with f and j etc?</p>
      <p>Crossbar on T looks very straight (less organic than other 'straight' strokes, eg arms of E and L.</p>
      <p>Acute on Lacute is drifting left? Looks right on small caps lacute.</p>
      <p>Bar on Tbar drifting left? Looks right on small caps tbar.</p>
      <p>Dotaccent is lower on characters than dieresis? Both are lower than dot on i. Would the position of the dot accent be governed by the dot on either the i or the dieresis... it's neither.</p>
      <p>Numerators and denominators look small? Also the 1 (numerator, denominator, superscript and subscript) looks very bold compared to other numerators (and you already know my thoughts on the 1).</p>
      <p>Questionmark (?) seems to be falling over to the right at the top. Same with inverted question but bottom left.</p>
      <p>Beautiful work!</p>
