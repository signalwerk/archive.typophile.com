      <p>Nick, sorry for my late answer.<br>
      I've found out that I first have to finish <a href="http://typophile.com/node/17136" rel="nofollow">Sofa Serif</a> before I can work on with sans, as there are too many cross-links between the two fonts. If I change one detail in the first one, I have to do it in the second one too. This ends in madness...</p>
      <p>But I could make use of a lot of your comments on Sofa Serif as well, as they are applicable on the general design, not only on one part of the family. You can see some of my changes based on your comments on V25 of Sofa Serif already. I've left out the ones concerning Diacritics, as they change and shift too often at the moment. I'll do them right when finishing the font.</p>
      <p>Thanks a lot for that,<br>
      sebilar</p>
