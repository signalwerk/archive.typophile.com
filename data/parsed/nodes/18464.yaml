    <p>Dear sebilar-suffering forum readers,</p>
    <p>this is the third part of Sofa super-family, a sans serif-version of the original Sofa design with heavy serifs.</p>
    <p>There is not too much to say about it, mainly I have clipped serifes away and have redesigned the now-nude line endings. This was done for all except ligatures and some glyphs I've forgotten so far.<br>
    Spacing probably is too loose at the moment.</p>
    <p>Any comments on mistakes I've made when removing the serifs, and general annotations are appreciated.</p>
    <p>Sebilar</p>
    <p><strong>More members of this family</strong><br>
    <a href="http://typophile.com/node/17136" rel="nofollow">Sofa roman</a><br>
    <a href="http://typophile.com/node/18463" rel="nofollow">Sofa italic</a></p>
