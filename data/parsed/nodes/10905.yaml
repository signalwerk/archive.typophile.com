    html: <p>Yep, you're right there are some difficulties in the "e" and the rounding parts of "s".  <br> <br>Still if you haven't seen the previous non-compressed version would you notice it then ?? <br> <br>I'm trying hard to skip the nitpickin' part here simply because I'm not an expert in controlling vectors in Illustrator (I took me a while to finish the last version) <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>But the corrections are not inevitable... sigh! <br> <br>/Henriko</p>
