  html: <p>Mjellow, <br> <br>Remember me with the logo-issues?? <br> <br>Well I'm still on the search for a nice and functional logo for my company YESYES. <br> <br>I've taken another course since last time and now I've altered the characters more (based on interstate - 2 versions included) <br> <br>What do you think of it so far? <br> <br>Can anyone suggest a harmonizing symbol to add the logotype and perhaps a color-palette? <br> <br>Thanks again, <br>/Henriko <br> <br><img src="http://www.typophile.com/forums/messages/29/8455.jpg" alt="YESYES logo 2003 - part 2"></p>
