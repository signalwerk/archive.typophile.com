  html: |-
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Font%20Retailers" class="freelinking" rel="nofollow">Font Retailers</a> : Otmar Hoefer</strong></p>
    <p>Otmar Hoefer is the Director of Font Marketing at <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a>.</p>
    <p>In the late 1970s, while he was still a college student, Hoefer began working at <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> as a printing technician. After <a href="/wiki/Mergenthaler-Linotype%20GmbH" class="freelinking" rel="nofollow">Mergenthaler-Linotype GmbH</a> acquired D. Stempel AG, Hoefer remained with the company, eventually ending up in the marketing department.</p>
    <p>Hoefer is very active as a volunteer with the <a href="/wiki/Klingspor%20Museum" class="freelinking" rel="nofollow">Klingspor Museum</a>. Hoefer also raises donkeys and mules in his spare time.</p>
    <p>Hoefer is the son of the famed calligrapher and type designer <a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a>.</p>
    <p>Please note that, although the German o umlaut (ö) may also be written out as "oe", Hoefer's name is <em>actually</em> spelled with an oe and not an ö!</p>
