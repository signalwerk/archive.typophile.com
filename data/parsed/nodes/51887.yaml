      <p>@kldolinger - the internet isn't anywhere near the biggest library in the world. Libraries are full of good books - 99% of the Internet is unsubstantiated crap, full of holes and misleading "facts" and biased articles by people with something to prove, so heavily slanted that you can't trust it.</p>
      <p>Art Deco is an interesting movement, but as others said here, it was marginal at the time and is only the focus of so much attention now due to its relevance to modernism and what came from it.</p>
      <p>Unfortunately much design education today focuses only on what reverberated later, looking back at it through a lens colored only by things that informed later pop &amp; trendy styles. It's an unfortunate fact that many of the design programs I've had experience with almost totally exclude the much more interesting and philosophically intricate Arts &amp; Crafts influence that was peaking in the mid 1920s in all aspects of design.</p>
      <p>Joshua</p>
