      <p>Art Deco is an all the history books, but at the time it was a marginal part of typography, as was Modernism.<br>
      If you look at any mass circulation magazine of the era, there may be one ad out of hundreds that has a "modern" or art deco style. The rest are historicist.<br>
      The same thing is true of typefaces.<br>
      Most of the types designed during the 1920s were historicist.<br>
      The seminal sans serif types Gill, Futura, and Kabel were published at the end of the decade, and became established in the 1930s.<br>
      But if you want to appeal to your professors, by all means write about modernism in the 1920s, because they are academics who live in a dream world divorced from reality.<br>
      Just remember that you will probably end up working in the real world.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Victrola_3744.jpg"></div><br>
      Here is a high-tech audio ad from the 1920s.<br>
      The headline type is Benton's Cloister Bold, based on the 15th century work of Jenson.<br>
      The rest of the type is Goudy's neo-Renaissance design, Old Style.<br>
      This, rather than a poster by someone who taught at a small Weimar art school, is what most 1920s typography looked like.<p></p>
