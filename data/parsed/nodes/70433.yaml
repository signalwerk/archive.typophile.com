    <p>I know you counsel me not to use those fonts, but only the standardised fonts by the Blogger. But see the text at the site of FontsQuirrel, the fonts there work perfectly althought I don't have these fonts, but I know what the font are these!</p>
    <p>Do I mean @web-font? Does it work perfectly?</p>
    <p>Kevin</p>
