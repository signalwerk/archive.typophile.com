    html: |-
      <p>css's 'font-family' specifies fonts on the local computer.</p>
      <p>css's '@font-face' is how you can reference fonts located on a server that then are loaded into the browser for that page. For that to work you have to either create web formats of the fonts and put them on your web server, or use one of the hosted options such as FontSquirrel, Kernest, Typekit, etc.</p>
