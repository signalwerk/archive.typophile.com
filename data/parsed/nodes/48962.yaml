    html: |-
      <p>Now that’s what I wanted you to do. YES. That’s much much better than original vector version done on a computer. But as everyone else seems to agree (including you) S will need a change.</p>
      <p>@tiffany: Any image (even this one) can be converted to black &amp; white. And since we are in the age way over 60s’ there are lots of logos these days that are used in full colour in 95% of applications. They do have a BW version too but most of the time it’s not used. So in this particular case I’d focus on this soft-light-smear effect and then focus on vectorising it to also create a BW version.</p>
      <p>I’d still rather have a nice original logo like this than something not as distinctive.</p>
      <p>And as Cody said: you will “maybe” have to think of a negative logo. In your case it will be some colour on white background. Yes. But. If going for any colour I’d make both version in the same one, only different hue to create enought contrast with the background. In this case I’d push colours ot yellow-orange(ish) for black background (which would make it even more light related) and a bit darker orange version for white background. Regular people probably won’t notice the difference created by the change of hue. And it will still work as a uniform logo in both versions.</p>
      <p>GREAT CHANGE. May I also say that apart from playing with light I also like the non-closed elliptical shape around it. Makes it very stable and even more perfect. You must have great motorics in your arm to create such a nice and smooth shape. Just curious: how many attempts did it take to get it right? :)</p>
      <p>___________<br>
      <em>Robert Koritnik</em></p>
