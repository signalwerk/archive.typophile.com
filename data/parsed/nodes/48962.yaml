    <p>I whipped up some logos tonight. I wanted to make something that he could potentially use as a watermark (just the “S2”). What do you think? </p>
    <p>The concept drawing is a circus-y font (not sure what the correct name for it is) and a normal sans serif font combined with a transition into one another. I wanted to try this out because the website layout is going to be like that.. creative-&gt;professional. </p>
