      <p>Not even if there is a disagreement. </p>
      <p>When compiling feature definitions, FontLab Studio automatically copies the class definitions from the Classes panel to the OpenType panel. But if there are already class definitions in the OpenType FEA syntax in the lower-right part of the OpenType panel, then each class is being defined twice. If you don't need the class definitions in the OpenType panel, just remove them from there. </p>
      <p>Formally speaking, the title of this thread is misleading. The thread is called "Strange errors" and the poster writes "I get this error message", but then cites a message that clearly says "[WARNING]", not "[ERROR]". So it's not an error message, it's a warning message. </p>
      <p>A "warning" is not an "error". In FontLab Studio, an error message in the Output panel is prefixed with "[ERROR]", while a warning message is prefixed with "[WARNING]". </p>
      <p>In most applications, errors lead to a technical fail while warnings lead to a technically successful completion. Warnings are issued when the application can complete the process but its internal logic indicates there "may" be something wrong, so it raises a potential problem to the user, and it's up to the user to decide whether it's a "real" problem or one that the user can ignore. Errors are issues when the application cannot successfully complete a process at all. </p>
      <p>Based on this, it is evident that when it comes to seriousness, a warning message is less serious, and an error message is more serious. </p>
      <p>A.</p>
