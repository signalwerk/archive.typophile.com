    <p>I've created a new font using FL5 (Windows). When I generate the font, I get this error message:</p>
    <p>[WARNING]  Glyph class @Cardo-Italic redefined [C:/Users/David J. Perry/Documents/FontLab/Studio5/fontlab.fea 21]</p>
    <p>and likewise for fea22.  The font installs without complaint into Windows and works fine in Word 2007, OpenOffice Writer, and Abiword.  If I open the generated font (the .otf or.tff file, not the original .vfb) in FL, everything looks OK.  BUT: When I test it in XeTeX, every letter is off by one; in other words, "Now" appears as "Opx".</p>
    <p>1) what does that error message mean?  is it serious?  how would I go about fixing it?<br>
    2) is there any connection between the error message and the problem in XeTeX?  A problem like this would seem to indicate something seriously wrong with the font, yet it works fine in other apps.<br>
    3) it may not be an accident that the one app in which the font does not work (XeTeX) is the only one I have that support OT features (the font contains ligatures, historical forms, and oldstyle numerals).  The OT features work correctly in FL's preview.</p>
    <p>Any help will be greatly appreciated!</p>
    <p>David</p>
