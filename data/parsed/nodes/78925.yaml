      <p>I've had this message -- but not the phenomena you report -- happen to me. In every case, I have my classes defined in both the *class* window and the *features*. If there is a disagreement, you get the message.</p>
      <p>Pick one or the other. Since I write the features file off and use a text editor on them to do further work, I pick *features* as primary, and have all my classes there. When I get the message you got, it means I haven't cleared the separate *classes.* (with FL5 on a PC, I believe it is: window &gt; panels &gt; classes, then "reset".) </p>
      <p>Alternatively, if you want to keep the classes file (panel), I suppose you should not also have them in your features file.  </p>
      <p>Try this on a copy first, of course.</p>
