      <p>Regarding XeTeX, there are some bugs in its underlying ICU Layout library, but I don't think any that would produce this kind of behavior. Did you use fontspec to access the font? If so, try accessing it directly (using plain XeTeX, not XeLaTeX) as in: </p>
      <p><code>\font\samplefont = "[/Library/Fonts/Cardo.otf]" at 72pt<br>
      \samplefont</code></p>
      <p>and see if the problem also occurs. If it doesn't, it would indicate some fontspec caching problem. </p>
      <p>Adam</p>
