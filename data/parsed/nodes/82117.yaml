      <p>Thanks for all the great tips on this, much appreciated. I particularly like Arched Gothic Condensed and Seminary, they are definitely in the right territory, not quite as bonkers but getting there!</p>
      <p>Justin - yes it's an old Edward Lear book, the only other information on the cover is R. J. Bush, 32 Charing Cross Road, London.<br>
      The Fancy Type book looks like a brilliant reference and the Coffee Bin fonts are also great.</p>
