      <p>I've looked all over for this, and couldn't even locate a name for the style in any of my books. Algerian Condensed is a fairly popular font that is generally like this, but here are four other ideas for fonts with something like this feel: Arched Gothic Condensed, Seminary,<br>
       Hattan Antique and Coney Island (all at MyFonts). </p>
      <p>Maybe someone with a better collection of old type books, like Nick Curtis or Mark Simonson, could locate the name of the original, but I don't hold a lot of hope that this has been digitized.</p>
      <p>- Mike Yanega</p>
