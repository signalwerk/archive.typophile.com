      <p>Is this an Edward Lear book? Is it a British edition and if so, do you know who published it? Books from this era tended to be printed locally so it might help in tracking down the names of the original typefaces, presuming it is <a class="freelinking external" href="http://www.artisticprintingbook.com/" rel="nofollow">"fancy" type</a> and not lettering. </p>
      <p><a class="freelinking external" href="http://new.myfonts.com/search/coffee+bin/fonts/" rel="nofollow">Coffee Bin</a> at MyFonts have a couple of fonts similar to the "and", and others from this era. You might also find something you like at <a href="/wiki/www.letterheadfonts.com" class="freelinking" rel="nofollow">Letterhead Fonts</a>, but I don't remember seeing anything digital that is very close to this.</p>
