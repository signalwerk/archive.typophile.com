    html: <p>I think that blackletters, even frakturs, are beautiful. I find it disparaging, as an American living in Germany, when Germans tell me that these letters are ugly and evil. <br> <br>Anyway, Tim might be right. If these planes didn't emply blackletter type on them, then you shouldn't use it in your film. That <i>would</i> perpetuate a false stereotype. Since this is a documentary, you should show the truth (whatever that is!). </p>
