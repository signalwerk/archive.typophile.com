    html: <p>I have no idea what German Airplanes looked like during the first world war. <br> <br>However, I can think of a couple of typefaces for you to spec. <br> <br>First off is Fette Fraktur, from Linotype. Fette Fraktur is a "typical" victorian-era fraktur. Such typefaces were still in wide-spread use throughout Germany during the first World War. <br> <br>Second should be akzidenz grotesk. This can be bought through Berthold or Adobe, at least. This is not a blackletter face, but it was used throughout Germany at the time. <br> <br>Lastly, I would consider almost any typeface designed by Rudolf Koch. Most of his typefaces were designed after the first world war, but I would guess that this anacronysm could be forgiven. Koch also fought in the first world war (as did most other famous german designers from that time).</p>
    html_clean: <p>I have no idea what German Airplanes looked like during the first world war. <br> <br>However, I can think of a couple of typefaces for you to spec. <br> <br>First off is Fette Fraktur, from Linotype. Fette Fraktur is a "typical" victorian-era fraktur. Such typefaces were still in wide-spread use throughout Germany during the first World War. <br> <br>Second should be akzidenz grotesk. This can be bought through Berthold or Adobe, at least. This is not a blackletter face, but it was used throughout Germany at the time. <br> <br>Lastly, I would consider almost any typeface designed by Rudolf Koch. Most of his typefaces were designed after the first world war, but I would guess that this anacronysm could be forgiven. Koch also fought in the first world war (as did most other famous german designers from that time).</p>
