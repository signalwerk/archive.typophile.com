    html: '<p>Chris, please don`t use Fraktur or Blackletter for titling. And please don`t use Kochs types. Koch was a very brave man, made his types for the holy word - so it would work for films like Luther. But if you want extend the clichee of the ugly German - Fette Fraktur &amp; Co. will do this job. ;-) <br> <br>In this time Fraktur was not so popular (especially for scientific things and advertising)- it became more popular in contrast to Bauhaus and Futura later. <br> <br>fonts match the timeline: <br> <br>- De Vinne Latin  <br><a href="http://www.myfonts.com/fonts/bitstream/de-vinne/" target="_blank">http://www.myfonts.com/fonts/bitstream/de-vinne/</a> <br> <br>-  Clarendon <br><a href="http://www.identifont.com/show?2SA" target="_blank">http://www.identifont.com/show?2SA</a> <br> <br>- Akzidenz Grotesk, right <br> <br>You will find the above types in pre WWI Berthold specimens. <br> <br>Also Ehmcke Antiqua - now marked as Carlton matches the time (published by Flinsch Foundry 1908 and very common till WWI for titlings) <br> <br><a href="http://www.myfonts.com/fonts/linotype/carlton/" target="_blank">http://www.myfonts.com/fonts/linotype/carlton/</a> <br> <br>- some bold oldstyle Egyptienne, Grotesk or Antiqua designs with the typical flavor of this time work too, but I miss the right ones in the digital age. <br> <br>for plane signatures only, catch some historical sources of the german planes. <br> <br>Search for MANFRED VON RICHTHOFEN / RED BARON or FOKKER. <br> <br>BTW: I think the iron cross was used only - no types.</p>'
    html_clean: '<p>Chris, please don`t use Fraktur or Blackletter for titling. And please don`t use Kochs types. Koch was a very brave man, made his types for the holy word - so it would work for films like Luther. But if you want extend the clichee of the ugly German - Fette Fraktur &amp; Co. will do this job. ;-) <br> <br>In this time Fraktur was not so popular (especially for scientific things and advertising)- it became more popular in contrast to Bauhaus and Futura later. <br> <br>fonts match the timeline: <br> <br>- De Vinne Latin  <br><a href="http://www.myfonts.com/fonts/bitstream/de-vinne/" target="_blank" class="link-external">http://www.myfonts.com/fonts/bitstream/de-vinne/</a> <br> <br>-  Clarendon <br><a href="http://www.identifont.com/show?2SA" target="_blank" class="link-external">http://www.identifont.com/show?2SA</a> <br> <br>- Akzidenz Grotesk, right <br> <br>You will find the above types in pre WWI Berthold specimens. <br> <br>Also Ehmcke Antiqua - now marked as Carlton matches the time (published by Flinsch Foundry 1908 and very common till WWI for titlings) <br> <br><a href="http://www.myfonts.com/fonts/linotype/carlton/" target="_blank" class="link-external">http://www.myfonts.com/fonts/linotype/carlton/</a> <br> <br>- some bold oldstyle Egyptienne, Grotesk or Antiqua designs with the typical flavor of this time work too, but I miss the right ones in the digital age. <br> <br>for plane signatures only, catch some historical sources of the german planes. <br> <br>Search for MANFRED VON RICHTHOFEN / RED BARON or FOKKER. <br> <br>BTW: I think the iron cross was used only - no types.</p>'
