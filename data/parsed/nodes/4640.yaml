  html: <p>I'm doing titles for a film set in World War I. Are there any good typefaces that approximate plane signage from the period? (Blackletter/gothic ones?) Thanks.</p>
  html_clean: <p>I'm doing titles for a film set in World War I. Are there any good typefaces that approximate plane signage from the period? (Blackletter/gothic ones?) Thanks.</p>
