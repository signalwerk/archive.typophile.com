      <div class="comment-spam-body"><p>@Petar: OK, if you like the second version best, let's deal with that.<br>
      1. Some vertical strokes are still too heavy: /A, /O, /C.<br>
      2. Horizontal stroke on the first /A should be more like the /H, a tiny (TINY!) bit lighter.<br>
      3. The second /A is in need of a makeover. Both verticals are too light, relatively; the horizontal is too heavy, and the top horizontal should match the top horizontal of the /C. Minimize the little chop inside the top of the /A, perhaps half the size it is now, after you adjust the weight. Alternately, just do away with the chop altogether; it will probably look a lot better. Either way will help to overall make the character more narrow, which it needs to be.<br>
      4. The /W looks better but the one in example three is better, width-wise. The vertical strokes are all a bit too light though, and that middle stroke overhanging is just so out-of-place with the overall look of the logo.<br>
      5. The vertical strokes of the /M and /N are too light. They should be like the /H.</p>
      </div>
