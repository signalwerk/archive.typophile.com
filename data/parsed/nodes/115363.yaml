    votes: null
    html: |-
      <div class="comment-spam-body"><p>@Petar<br>
      The last sample is the best, but still needs a bit of tweaking.</p>
      <p>Use the /W from the third sample; the one in the fourth sample is too wide.</p>
      <p>The crossbar in the first /A is a little light now; heavy it up a very small amount (close to the /H crossbar weight) and lower it a little.</p>
      <p>I would make the first /A, the /O and the /C about 15% more narrow; they really don't work as squares.</p>
      <p>The second /A vertical stroke is optically too heavy due to the smaller counter now. Remove a very small amount of weight from the outside of the vertical stroke, OR better, move the entire stroke to the right very slightly and the chop back in but only about a third of what it was before. Position the chop so it aligns with the horizontal stroke of the /C next to it. The bottom of the left diagonal stroke below the crossbar also needs to be heaver; optically it looks too light. Make it the same weight as the vertical stroke. </p>
      <p>As for diagonal weights, it's in the eye of the beholder what works best in any given situation; experience is the best teacher. If they are the same weight as the verticals, they look heavier. The same is true of horizontals, especially connected between verticals. When type or a logo is quite large it isn't as noticeable as when it is small. Looking at art through a reducing glass or viewing it at different sizes on screen is quite effective at finding problems such as these. Using a reducing glass is a very good way because it's like looking at it from several feet away.</p>
      <p>As for literature, any good art instruction book would likely address the issue although I doubt there is a book completely devoted to the subject.</p>
      </div>
