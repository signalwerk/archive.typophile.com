      <p>This is a logo that I'm working on which needs to have that college feel to it. So my questions are:<br>
      a) The tilted A - Is there any way to know how to define the letter width in case like this? Do I need to align the top part of the counter with the counters of the other letters (such as in the top example)?<br>
      b) Does this type of M fit within this college style?<br>
      c) When I was analyzing the font United by Houseind. I noticed that the some letters whose edges aren't chopped off (M, N for example), have narrower stem than the other ones (A, O). Does this balance right in this situation?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HamonWac_6715.png"></div><p></p>
      <p>Thank you in advance for your thoughtful comments.</p>
