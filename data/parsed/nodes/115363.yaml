      <div class="comment-spam-body"><p>Thank you for the comment George and Hrant.</p>
      <p>@George, I really appreciate your in-depth analysis and remarks. It's very hard to notice these things and find solutions if you don't have someone more experienced to point them out. So your comment is a great lesson.<br>
      The attached image show (top-to-bottom): the first version, update with reduced W and update with bigger reduction of the /W</p>
      <p>a) One chopping was enough to make the /M in line with the other letters. Great remark! When i pushd the bottom point downwards the width of the fiagonal stroke decreased so now it's a little bit less than the vertical stroke.</p>
      <p>c) I fixed the verticals and also unified the widths of the letters in order to make the letters square format</p>
      <p>d) I made 2 versions of the /W based on your comments. The second version has a smaller width reduction and the thrid one has bigger width reduction. To my eye, the 2nd version looks better, maybe because the open counters have similar size as the open counters on the letter /N. I also tried adding a standard sans /W and it fits OK, but it looses the accent on the /W.</p>
      <p>Thank you once again for your time!<br>
      <img src="http://i.imgur.com/Qx3CdGe.jpg"></p>
      </div>
