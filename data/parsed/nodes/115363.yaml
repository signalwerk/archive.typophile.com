    html: |-
      <div class="comment-spam-body"><p>@Petar<br>
      a) Yes to aligning the counters, except on the second /A it could be just a little higher than the other for optical compensation so it doesn't look too dark.<br>
      b) That /M is not the traditional college look, IMHO. If it were my work, I would drop the diagonal strokes at the bottom down by about a third of the bottom white space, then chop off the bottom point to match the internal chopping in the counter of the /O. In addition, the diagonal strokes of the /M are a little too heavy, should match other diagonals. If they measure exactly what the verticals do, make them a little lighter.<br>
      c) There are some discrepancies, and no discrepancy is ever good. The verticals on the first /A, the /O and /C are too thick and should match the /H.</p>
      <p>The /C counter needs to be chopped off to match the /O in all respects.</p>
      <p>There are two bad things about the existing /W: it's out of character with the other glyphs and it is way too wide. Hrant said it best: a flipped /M would be far preferable, perhaps with a little modification so it isn't exactly a flipped /M. A good approach would be to reduce the width of the existing /W by about a third then rework the diagonal strokes; make them more like the /M only a little taller.</p>
      <p>Please post your results when you're done. It's an interesting problem. Remember, consistency is king.</p>
      </div>
