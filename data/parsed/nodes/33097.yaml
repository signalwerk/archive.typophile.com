  html: |-
    <p>Can any of you type geeks give me an example, or several examples, of a <em>good</em> type superfamily with the primary design serif (better Old-Style) and the companion design slab-serif. I only know of two such superfamilies: Erik Spiekermann’s and Christian Schwartz’s <a href="http://christianschwartz.com/dbnews.shtml" target="_blank">DB Serif / DB News</a>, or Jean-François Porchez’s <a href="http://www.typofonderie.com/alphabets/view/LeMondeLivre" target="_blank">Le Monde Livre</a> / <a href="http://www.typofonderie.com/alphabets/view/LeMondeCourrier" target="_blank">Le Monde Courrier</a>. I know there are more styles to either family, but I am primarily interested in the serif/slab-serif relationship. I suspect there should be more similar designs out there. Thank you in advance.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/33062" class="topic-previous" title="Go to previous forum topic">‹ Nick in the Toronto Star</a> <a href="/node/33101" class="topic-next" title="Go to next forum topic">+&amp;-=X Exhibition ›</a></div>
