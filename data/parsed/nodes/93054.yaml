  html: |-
    <p><img src="http://www.sintesi.ch/Bilder/vorschau_sintesisans.jpg"></p>
    <p>Sintesi Sans scores because of its readability, robustness and contemporary style. Its is a true Sans Serif and therefore really flexible, universally applicable especially as a body text font and in a broad number of other applications. </p>
    <p>Download the trial version of the font families Sintesi and Mimix for free:</p>
    <p><a href="http://www.sintesi.ch" title="www.sintesi.ch">www.sintesi.ch</a></p>
