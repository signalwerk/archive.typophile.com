  html: |-
    <p>Hi all,</p>
    <p>I trying to write a macro with RoboFab that works in the same way as FL copy to composites from the metrcis window, so I can quickly copy the metrics from glyphs like "H" to the Hbar. </p>
    <p>I was trying something like this :</p>
    <p><code></code></p>
    <p>#CopyToComposites<br>
    #<br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()<br>
    #<br>
    f['Hbar'].leftMargin = f['H'].leftMargin<br>
    f['Hbar'].rightMargin = f['H'].rightMargin<br>
    #<br>
    f.update()</p>
    <p></p>
    <p>The problem with this is it copies the actual sidebearing, so in cases like the Hbar the sidebearing is measured from the bar which overhangs the stem of the 'H', but I want it to be measured form the stem like you can do with the measuring line in the metrics window.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5264.gif"></div><p></p>
