    <p>Can anyone advise as to a "best practices" when managing the fonts on one's system?<br>
    I am going bonkers these days trying to manage all my typefaces. I use Linotype's Font Explorer, but it doesnt seem to do the job or i am doing something wrong. Of particular frustration is when running into multiple versions of one typeface (i.e. Futura — I have cuts from several different foundries and have to use them on different jobs, so i cant just trash the others— i turn them on and off as needed). And secondly, is there an alternative to Font Explorer? Do any of these Font Management Systems really beat all the others? Or are they all just the same? Which one is truly the BEST? Surely someone on Typophile can answer this?</p>
