      <p>For many years I would always start every new system software upgrade (Mac System 6x onwards) by stripping out the contents of the System Font folder down to the bare minimum – those fonts required by the system  only – and managing the font libraries elsewhere on the hard drive with a third-party solution like Suitcase or MasterJuggler. The ability to create font sets grouped and named for specific accounts/clients/jobs was a huge boost to productivity everywhere.</p>
      <p>After Mac OS X, things got more complicated, and Extensis, makers of Suitcase Fusion, produced a .pdf booklet called Font Management in OS X Best Practices Guide. It's recommended reading. I have a 5th edition which dates from 2009, but I suspect you can find it on their site still.</p>
      <p>For the last couple of years I have been using <a href="http://www.fontshop.com/products/fontcase/"> Fontcase </a> which is just great – very affordable, with a slick interface and pretty robust.</p>
