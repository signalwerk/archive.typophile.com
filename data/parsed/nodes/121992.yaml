    html: <p>I think that, as in lots of Japanese games, it's a <a href="http://fontworks.co.jp/" target="_blank">Fontworks</a> font - probably Reggae, which was also used in Legend of Zelda/Wind Waker. Unfortunately, the only <a href="http://www.lunaconcepts.com/e/downloads/LunaFontSamples_FW_JPN.pdf" target="_blank">image (# 32)</a> I can find of Reggae includes only a few letters. The Fontworks website seems to be totally Western-unfriendly.</p>
