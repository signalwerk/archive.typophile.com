      <p>As a professional in the world of typography, I personally ﬁnd your simple request straightforward and challenging  :-)</p>
      <p>I’m under the impression that you’re apt to do decent typographic work with some tradional taste to it. If modesty allows, I’d like to recommend <a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/andron-1-lat-corpus/" rel="nofollow">this typeface,</a> which is a new design of the digital era, yet owes much of its flavour to good old Venetian Roman style tradition. For $128 you get a decent starter package of Regular, Italic and Bold (all you need in 95% of works); that leaves the bigger part of your budget for a good sans, or some lovely script face for embellishments… for instance.</p>
