      <p>After you have enrolled, you may qualify for student discounts on <a class="freelinking external" href="http://www.adobe.com/education/products/" rel="nofollow">Adobe's education products</a>, including couple of font collections, <a class="freelinking external" href="http://www.adobe.com/education/products/fontfolioeducationessentials/index.html" rel="nofollow">Adobe Font Folio Education Essentials</a>, and <a class="freelinking external" href="http://www.adobe.com/education/products/typeclassics.html" rel="nofollow">Adobe Type Classics for Learning</a>. </p>
      <p>If you use a PC, you may want to investigate the <a class="freelinking external" href="http://www.corel.com/servlet/Satellite/us/en/Content/1152796563249" rel="nofollow">Corel education store</a>. Corel Draw comes with a large bundle of mainly Bitstream fonts.</p>
      <p>Your school may be able to advise you on what discounts will be available to you.</p>
