      <p>You’re welcome.</p>
      <p><cite>I’m sorry I didn’t find it before opening this thread.</cite><br>
      No need to be sorry. Typophile is a jungle.</p>
      <p>As is it not included in the Starters Pack list (for it is no ‘pack’):<br>
      The Stone Type Foundry is another place that offers topnotch fonts for serious, traditional typography. Some recommendations:<br>
      <a href="http://www.stonetypefoundry.com/cyclesoverview.html" rel="nofollow">Cycles</a> and <a href="http://www.stonetypefoundry.com/itcbodoniovervie.html" rel="nofollow">ITC Bodoni</a>, an old-style and a modern text family, in optical sizes.<br>
      <a href="http://www.stonetypefoundry.com/magmaoverview.html" rel="nofollow">Magma</a>, a humanist sans that works very well in text.<br>
      And <a href="http://www.stonetypefoundry.com/silicaoverview.html" rel="nofollow">Silica</a>, a friendly slab – no italics, still a steal!<br>
      F</p>
