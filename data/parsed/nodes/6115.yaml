    html: <p>I like the look of the drawings you posted; though on the other hand David is right that there are scads of geometric/grid faces out there. <br> <br>Maybe you could distinguish your face by doing a clean&lt;--&gt;rough/distressed axis, instead of the usual light&lt;--&gt;bold or condensed&lt;--&gt;extended axes. I think part of what can make these geometric faces all feel the same is that they often have razor-clean lines and angles, which comes across as sterile and soulless half the time, at least to me. If you had a clean, idealized version, but also versions that had the warmer look of your hand drawings, I'd want a copy.</p>
