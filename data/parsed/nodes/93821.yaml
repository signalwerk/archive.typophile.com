    html: <p>It may look different in  black/white/gold, but to me, "PROJECTEN" looks off-center, but not enough to appear to be deliberate.  It also looks disconnected, but the tail on the /R does tend to push it away.  I'm disturbed by the slope of the trim on the left leg of the /M. My eye keeps trying to make it parallel with the \R's tail and failing.  Just my two centimes.</p>
