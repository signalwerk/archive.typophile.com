    html: |-
      <p>Indeed, I agree with all of you..</p>
      <p>For example the card I am working on right now has a large wordmark with a subtag which is in a subtle color and doesn't bring much 'weight' to the overal composition, therefor i think it doesn't need to sit much higher.  I would place it slightly higher if the subtag was more substantial.</p>
      <p>(card will be screenprinted on tick black paper, wordmark white, tag gold foil)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/C_4270.jpg"></div><p></p>
