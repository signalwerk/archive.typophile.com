      <p>I would be more concerned with the letterspacing of the wordmark.<br>
      It is uneven—scrunched in the middle and tenuous at the left, contradicting the symmetry of the layout.<br>
      It’s a mistake to make a single feature in the middle of the word, which is not where the intial attraction should be.<br>
      Was just mentioning Cassandre’s YSL logo in another thread:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ysl-logo_3652.jpg"></div><br>
      Now, this style of letterpacing might not be <em>au courant</em>, but at least the density is evenly distributed.<p></p>
