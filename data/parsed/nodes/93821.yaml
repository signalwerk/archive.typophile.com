    <p>Hi guys,</p>
    <p>Ive been wondering about how other designers center-position their logo marks.</p>
    <p>Most of the time, I myself treat the entire logo incl. subtag as a block, placing that block slightly higher than 'dead center'. It seems more visually appealing to me.</p>
    <p>What's your take on this? Do you go by mathematics, purely by sight, is there a general consensus, any set rules, or does it vary on the logo you are implementing?</p>
    <p>thanks!</p>
