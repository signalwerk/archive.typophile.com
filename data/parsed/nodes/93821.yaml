    html: <p>The optical centre is indeed higher than the mathematical centre, but then again a logotype shaped as an upside-down pyramid might even things out because a pointed shape is optically smaller (lower) than a squared shape (like the apex of A that needs to ascend slightly above H to look equal).</p>
