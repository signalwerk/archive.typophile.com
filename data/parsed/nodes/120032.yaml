    <p>Please see my earlier posting with a similar request for help in choosing an English-language typeface for gravestone / headstone design.  That posting is here:</p>
    <p>  <a href="http://typophile.com/node/119579" title="http://typophile.com/node/119579">http://typophile.com/node/119579</a></p>
    <p>My difficulty with selection of Hebrew typeface is a good deal greater, since the only Hebrew typeface I already own is "Adobe Hebrew".  So, it's harder for me to easily play around with different typeface choices.</p>
    <p>Any thoughts or suggestions, please?</p>
    <p>Thanks!</p>
