      <p>My type is more modern :) You can see the two:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/2fonts_5283.png"></div><p></p>
      <p>There is also a typeface I designed called "Shabtai" <a class="freelinking external" href="http://www.samlil.co.il/shabtai/" rel="nofollow">- a blog post about the design process</a> - it has more of a biblical feel to it.</p>
      <p>As for Adobe Hebrew - it's not the best type in my opinion. It looks too much like Hadasaa, but misses the design subtleties. Letters like 'Alef' and 'Pe' are too dark and not carefully designed.</p>
