    <p>Here is an interesting find.<br>
    I was leafing through an old Russian font book from 1930, and came across a peculiar attempt at merging <a href="/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a> with a <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> aesthetic. I don't think the idea ever really caught on, as I can't remember any examples prior to the 90's (and no successful ones since)</p>
    <p><img src="/sites/default/files/old-images/cyrgoth_5450.png"></p>
    <p>Still, I wonder if this might be useful to someone attempting one.</p>
