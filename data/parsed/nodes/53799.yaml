    html: |-
      <p>Before the revolution of 1917 many Russian foundries carried both Latin and Cyrillic blackletter. Obviously, there was a demand for those types. I remember contributing a couple of samples to the <a href="http://www.cooper.edu/art/lubalin/bletter.html" rel="nofollow">exhibit</a> Peter Bain and Paul Shaw put together in 1997. The fashion for blackletter in Russia started in the first third of the 19th century. Interestingly, the title page (or was that the cover?) of the first edition of Gogol’s <em>Dead Souls</em>—designed by Gogol himself—featured blackletter (the words <em>Н. Гоголя</em>):</p><div class="imageWrap"><img src="http://typophile.com/files/1842_Dead_Souls_4530.jpg"></div><p></p>
      <p>Blackletter was shown in many Russian lettering manuals as late as in the 1920s and 1930s (what Ivan has found is not a type specimen but a lettering guide). Obviously, the demand for Cyrillic blackletter is still there. There are some fonts available for downloading on-line, all of them of questionable quality. Some attempts at Cyrillic blackletter, hand-drawn or hand-written, can be found in the books of Villu Toots.</p>
