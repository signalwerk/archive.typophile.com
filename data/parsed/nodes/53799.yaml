    <p>Here is an interesting find.<br>
    I was leafing through an old Russian font book from 1930, and came across a peculiar attempt at merging <a href="/wiki/cyrillic" class="freelinking" rel="nofollow">cyrillic</a> with a <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> aesthetic. I don't think the idea ever really caught on, as I can't remember any examples prior to the 90's (and no successful ones since)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cyrgoth_5450.png"></div><p></p>
    <p>Still, I wonder if this might be useful to someone attempting one.</p>
  html_clean: |-
