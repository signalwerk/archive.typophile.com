    html: <p>Hah! I bet this is the very snapshot <a href="http://www.flickr.com/photos/stewf/2186292033/">I took</a>. I love the script too, Dana. Nearly any film titles from that period were drawn by hand. Like Mike suggests, have a look at Ale Paul’s digitization of the <a href="http://sudtipos.com/home">Bleumlein scripts</a> (right column) which were lettering styles of the era. You might like <a href="http://www.fontshop.com/fonts/downloads/comicraft/matinee_idol/">Matinee Idol</a> too.</p>
