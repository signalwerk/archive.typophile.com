      <p>A font may be “up-graded” (or is it “down-graded”?!) by applying a small amount of Stroke in applications such as InDesign.<br>
      That would make Century Expanded look quite like Benton Modern Four.<br>
      However, proper foundry grading is superior—as can be seen from this before-and-after demonstration:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Stone_4751.png"></div><p></p>
