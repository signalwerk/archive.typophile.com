    html: |-
      <p>As the designer I would ask for any motifs of special relevance to you first. Can be everything, from a favourite saint, animal, place or season …<br>
      What books do you cherish? What are your subjects of interest, of reading?<br>
      A design could be rather typographical or more pictorial. Any particular style preferred?<br>
      If interested please contact me via the contact form of <a href="http://www.signographie.de" title="www.signographie.de">www.signographie.de</a></p>
