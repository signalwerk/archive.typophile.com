      <p>'Trying to explain the one font's problem at Open Office wordprocessor thoroughly would require a font designer experience.  Nonetheless I will try and hope it is comprehensible:</p>
      <p>Layout at existing document (ODF) on OpenOffice - The document is stored on the PC, when I reopened it after a while, a text block was mostly invisible.  After changing font size other than 11 to 11.6 it became visible or when font was changed.  When I put 11.7 as font size, the wordprocessor jumped to 11.6 and was visible.</p>
      <p>Layout on PDF on OpenOffice -  After a document is converted to PDF some very few documents became semi-garbled.</p>
      <p>Layout at ODF on OpenOffice -  Some very few documents are not able to accept a preferred layout again - line / words jump (could be due to header/footer or mix with another font?)</p>
      <p>The font is not available in smaller sizes up to 9.  When font is put as 9, the text area frame becomes larger, shifting the total document area.</p>
      <p>Is it possible  to rectify these problems if they are easy to investigate and correct them.'</p>
