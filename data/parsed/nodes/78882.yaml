  - id: 451553
    user: 29994
    date: null
    date_raw: null
    votes: null
    html: |-
      <p>"Redirecting"? Nothing to re-direct, really.</p>
      <p>Fake Small Caps: make all lowercase character caps and decrease font size by 80%.</p>
      <p>Opentype Small Caps:<br>
      * Parse entire Opentype font<br>
      * Look up current script<br>
      * Look up current language in current script list<br>
      * Look up 'smcp' feature in current language list<br>
      * For each character<br>
        o Check if it has a GSUB entry<br>
        o If so, do GSUB lookup for this character<br>
          - Take care to handle each Lookup Type correctly (there are eight of 'em)<br>
        o Display the glyph</p>
    html_clean: |-
