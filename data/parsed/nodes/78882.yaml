      <p><em>What happens when someone switches fonts with true/fake small caps applied. Seems to be more of a user experience problem than a technical problem.</em></p>
      <p>I don't see the problem at all. Small-caps aren't hardcoded into the document, they are stored as an argument of the respective style tag in the ODT's XML files (<code>fo:font-variant="small-caps"</code> in OO; I would imagine Word handles it simliarly). If the font provides real small caps, real small caps are displayed in the software. If it doesn't, scaled-down caps are displayed in their place.</p>
      <p>If users are stupid enough to hard-format small caps themselves, they won't be affected at all.* Or am I missing something?</p>
      <p>*I admit I have a hard time not ranting about the fact that word processors allow people to hard-format stuff at all ...</p>
