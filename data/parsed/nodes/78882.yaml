    html: |-
      <p>Supporting OpenType features may require a lot of programming, and, of course, since it's open source, it's not as if money coming in supports it.</p>
      <p>But if OpenType support is not trivial - so that even, say, WordPad would fully support all OpenType features - then it may be reasonably asked whether the features in OpenType are really useful to people. If a font can "do fancy things", then it ought to be possible to make it do those things <em>everywhere the font is used</em>.</p>
      <p>Which means that the mechanism currently used to get at things like variant characters, small caps, and so on and so forth, is deeply flawed.</p>
      <p>The "right" way for a font to behave on a computer, "of course" (and I realize what I'm proposing won't happen, since it's wildly impractical for many reasons) is for it to be simple and intuitive to control all its features, i.e. requesting a long s, disabling ligatures, and so on...</p>
      <p>when you're generating your text this way</p>
      <p><code><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WRITE (6,11)<br>
      &nbsp;&nbsp;&nbsp;11 FORMAT (11H Some text.)<br>
      </code></p>
      <p>Maybe like this:</p>
      <p><code><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WRITE (6,33)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WRITE (6,11)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WRITE (6,44)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WRITE (6,22)<br>
      &nbsp;&nbsp;&nbsp;33 FORMAT (51H*&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; =)<br>
      &nbsp;&nbsp;&nbsp;11 FORMAT (53HA word like official is printed with the ligature ffi)<br>
      &nbsp;&nbsp;&nbsp;44 FORMAT (18H*&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-)<br>
      &nbsp;&nbsp;&nbsp;22 FORMAT (20H representing the letters ffi.)<br>
      C 3456789 123456789 123456789 123456789 123456789 123456789 123456789 12<br>
      </code></p>
      <p>assuming that * as a printer control character indicates a line containing font behavior characters, and in such a line, = means "force ligature" and - means "prohibit ligature".</p>
