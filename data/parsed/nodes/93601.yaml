    html: <p>Actually, I think the text is not Antique No. 1, but Primer. The only digital version I know of is Bitstream's <a href="http://www.myfonts.com/fonts/bitstream/century-751/" rel="nofollow">Century 751</a>, which appears to be based on a larger cut and lacks small caps and old style figures, unfortunately.</p>
