    html: |-
      <p>You have a couple of different things going on here. The first sample is, most likely, from the original 1963 edition and looks closest to Linotype’s Antique No. 1, which included oldstyle figures.</p>
      <p>The contents is, obviously, from later: the listings may still be Antique No. 1, but the heading and the type on the cover appear to be Times Roman, New or otherwise.</p>
    html_clean: |-
