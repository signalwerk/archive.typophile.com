    <p>Curious if anyone can ID the serif typeface used in this "A Note About the Author" from Sterling Hayden's "The Wanderer" book published by Knopf in 1963.</p>
    <p>It looks to have been done by a Linotype machine from the justification, but not sure what typeface it is exactly.<br>
    Any ideas?</p>
