      <p>Mark,</p>
      <p>Primer isn’t in my undated 1,200+ page Linotype Faces catalog—whenever it was published, two small cans of Dunker’s Wax Beans cost 13¢. Was Primer an earlier release that was discontinued, or a later release than this catalog (I’m guessing 1950s)?</p>
