    html: |-
      <p>&gt; put the image in the master page as a background template</p>
      <p>Yes that's how I'd do it. </p>
      <p>&gt; save it [PDF] as a TIFF </p>
      <p>Or you could just import the PDF. InDesign can place PDFs as images.</p>
      <p>(If the PDF is more than one page, make sure that the "Show Import Options" checkbox is checked in the "Place" dialog box, so you can select which page of the PDF to import.)</p>
