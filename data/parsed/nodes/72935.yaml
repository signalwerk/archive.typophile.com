      <p>Can you supply any other information?</p>
      <p>How wide are your margins? Are they uniform (left and right, top and bottom)? It looks to be about 20 columns for the spread and the crosses are likely 80mm wide (240/3), which are likely used to setup the horizontal crossing lines of the grid.</p>
      <p>This might also help: <a href="http://www.markboulton.co.uk/journal/comments/five-simple-steps-to-designing-grid-systems-part-2" title="http://www.markboulton.co.uk/journal/comments/five-simple-steps-to-designing-grid-systems-part-2">http://www.markboulton.co.uk/journal/comments/five-simple-steps-to-desig...</a></p>
      <p>And here are some templates that could be useful: <a href="http://www.thegridsystem.org/categories/templates/" title="http://www.thegridsystem.org/categories/templates/">http://www.thegridsystem.org/categories/templates/</a></p>
