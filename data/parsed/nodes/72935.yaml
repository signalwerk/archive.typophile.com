    html: |-
      <p>You might want to post the PDF (if it's not proprietary).</p>
      <p>My take: I'd open the template and save it as a TIFF image and then set up a master page at the document size and just put the image in the master page as a background template. Then when you're done designing, delete the image on the master page.</p>
      <p>Simple work around. You can drag out your columns and margins to match the image so you have something to "snap" to. </p>
      <p>Does that help any?</p>
