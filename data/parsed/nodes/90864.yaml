    <p>Hello, </p>
    <p>I am a Graphic Design student at the National Institute of Design (NID) in Ahmedabad, currently in the second year. I have been working on a geometric sans serif typeface since the last few months. This is my first ever attempt to typeface design and so far I only have capital letters. I shall be adding lowercase later when I'm happy with the capitals. I received some feedback from my seniors at school but now I need expert advice from professional designers so that I can take this forward. </p>
    <p>I'm attaching a PDF of the basic characters and some sample text. I would really appreciate if you can give me constructive feedback on each letter. </p>
    <p>Thank you!<br>
    Manushi Parikh</p>
