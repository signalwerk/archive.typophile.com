    <p>Hey,</p>
    <p>I've got some red values amongst my kerning, which I'm assuming means they don't match what class 'leader's value. Could this be solved by expanding, and then compressing kerning, using fontlab's kerning assistance? Or will this cause new problems?</p>
    <p>And, what exactly does 'keep existing pairs' in the 'expand kerning' window mean? It seems quite logical to me that I wan't to keep my existing pairs, but apparantly it isn't?</p>
    <p>Thanks in advance,<br>
    Jasper</p>
