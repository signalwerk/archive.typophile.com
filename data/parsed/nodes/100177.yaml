    html: |-
      <p>Just delete them.<br>
      The values for those kern pairs will be replaced by class kerning values.</p>
      <p>If they persist, then you know that there are conﬂicts, with a glyph appearing in more than one class.</p>
      <p>For instance, you may have a class for (V' W), and another for (T' Y), but at some point have the bright idea that Y is quite similar to V and W, and decide to put it in that class, for (V' W Y)</p>
      <p>So if VA is kerned -80, and TA is kerned -100, then Y will be embarrassed, not knowing exactly how intimate it should be with A.</p>
