    html: <p>I wouldn't expand the kerning. The red values are, as you said, exceptions to the class rules, and if you meant them to be exceptions, it's fine to leave them there. If you've made exceptions by accident (by kerning in class kerning with exceptions mode instead of just class kerning mode) just go through and delete the red kern pairs. Exceptions are useful - for example, the /i/ class will probably contain all i diacritic glyphs, and the vast majority of the time they'll kern the same as i, but for certain situations different kerning is needed. It's easier to control these as exceptions rather than have a specific idiacritic kerning class.</p>
