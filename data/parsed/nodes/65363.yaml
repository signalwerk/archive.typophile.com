    <p>Ok my clients wanted blue and decided on this logo</p>
    <p></p><div class="imageWrap"><img src="/files/eg1_3759.jpg"></div><p></p>
    <p>So then last night I get an email saying could I try the following (specifically with these colours)....</p>
    <p>I ring them and ask them why the change in colour and apparently its because they looked at someone else’s site and those were the colours they used.....they wanted fresh and modern and to me what they want looks terrible in these colours (conservative grey, too many competing elements in the logo with the colours)</p>
    <p>I’m meeting with them in a few hours- and as I always say it’s their logo at the end of the day...but can anyone else see where I am coming from??</p>
    <p>TIA</p>
    <p></p><div class="imageWrap"><img src="/files/ANNARQ_5880.jpg"></div><p></p>
