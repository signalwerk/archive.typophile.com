    date: 2003-03-06T10:29:00
    date_raw: 6 Mar 2003 — 10:29am
    votes: null
    html: <p>The below is said in all seriousness, but with my tongue planted firmly in my cheek. Meaning, I do believe in what I've written, but sometimes the boss doesn't. <br>-- <br>If we are designers, and our job is to create identities for our clients that are to be unique and original, creating for them a strong presence in the marketplace in which they sell,which in turn will help them become profitable, doesn't it behoove us to have a greater variety of typefaces at our fingertips? <br> <br>Also, you can always build the price (or part of it) of the typeface into the cost of the work for which it was used.</p>
    html_clean: <p>The below is said in all seriousness, but with my tongue planted firmly in my cheek. Meaning, I do believe in what I've written, but sometimes the boss doesn't. <br>-- <br>If we are designers, and our job is to create identities for our clients that are to be unique and original, creating for them a strong presence in the marketplace in which they sell,which in turn will help them become profitable, doesn't it behoove us to have a greater variety of typefaces at our fingertips? <br> <br>Also, you can always build the price (or part of it) of the typeface into the cost of the work for which it was used.</p>
