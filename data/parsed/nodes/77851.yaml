    html: |-
      <p>Thanks Nick:<br>
      Totally agree.  I will try to fix 'wr'. I will test a bigger u also.</p>
      <p>Thanks Riccardo:<br>
      The low exit of the 'o' was made to make it connect to letters like 'r' and 's' without the need of a ligature.  Mostly because most web browser barely support ligatures (Only Firefox AFAIK). </p>
      <p>I'm struggling to make it flow as good as possible without using ligatures, but as you might know, r s x and z are problematic.</p>
