    html: |-
      <p>@Eliason, Bendy, frode, frank, Stephen:<br>
      Thanks!<br>
      The b, n and o where fixed, connections smoothed, and a few ligatures added.<br>
      The original swash M was left as an alternate only, since it was too "formal" for this "casual" script.</p>
      <p>It's called "Dancing Script", and version 1.01 was just released under the Open Font License.<br>
      <a href="http://www.impallari.com/dancing/" title="http://www.impallari.com/dancing/">http://www.impallari.com/dancing/</a></p>
      <p>The source FL files are available in the download .zip<br>
      Anyone wanting to contribute improvements for the next release is welcome.</p>
