    date_raw: 13 Jan 2011 — 6:45pm
    votes: null
    html: <p>I'm not terribly bothered by the loop style of the o as long as it does connect smoothly. I prefer that to the type of loop on the b which seems more out of character. I did notice some slant differences that show up in combinations like the o_n. The letter sizes vary slightly throughout, but this gives it a bit more of DIY touch which fits with a lot of design work these days.</p>
