      <p>I see an old banknote &amp; billhead influence, but also a touch of mid-20th Century chrome scripts. Rather than trying to make a complete font, I'd use this for one-off custom lettering or a logo.</p>
      <p>I think your W should be symmetrical like your V, and the tail on the Q could be a lot less heavy. The S &amp; Z don't quite work for me, but reversing the Z might make a slightly better S. The J might work better with the bottom serif being on the left side too.</p>
