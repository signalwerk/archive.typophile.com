    html: |-
      <p>Thanks for the suggestions and sorry for the delay. I've made some changes to the characters and working on a set of numerals. (I know the 2 and Z can be confused, but I'm working on solving that.)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Silverback-Sample2_3984.png"></div><p></p>
      <p><strong>Justin::</strong> The letters started from a sketch I did about a year ago and at the time I was looking at a lot of stock certificates and old financial documents. While I wasn't consciously doing it, the influence must have crept in there. But your comment now gives me a source to mine for the problems I cross. Thank you.</p>
      <p>• I've changed the W per suggestions and dug it.<br>
      • I flipped the Z design to make the new S and it looks better. The old S was too round.<br>
      • I was experimenting with the J design. It <em>does</em> look better with the serif on the other side.<br>
      • Made a new tail for the Q. I think it has the right weight and really makes the character unique to the font.</p>
      <p><strong>riccard0::</strong> After careful consideration and experimenting, I didn't change the "beard" on the G. The alternatives didn't carry the same strength and weight I wanted to keep.</p>
