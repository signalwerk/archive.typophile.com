    <p>I've been lurking around Typophile for quite sometime, but never really posted anything. So, here is my first (complete) attempt at a full set of characters. I'd like to hear if anyone thinks this thing has legs, or if it's a lost cause. I know it's got some problems, but that's why I'm here.</p>
    <p>Now for your critiquing eyes, Silverback…<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Silverback-Sample_6636.png"></div><p></p>
