  html: |-
    <p>I’ve been reading about the history of modern European Latin letterforms, working from the assumption that the modern alphabet is actually a combination in practice of Roman capitals, Carolingian miniscule, and italic cursives, corresponding to our present-day uppercase, lowercase, and italics.</p>
    <p>I’ve found good sources on the history of Roman letterforms (e.g., Gray’s <em>History of lettering</em>) and on the history of italics (e.g., Morison’s <em>Early italian writing books</em> and Atkins’s <em>Masters of the italic letter</em>), but does anyone have recommendations for the precursors of the lower case Latin forms?</p>
