    html: |-
      <p>The A&amp;W typeface is very late 1950s when "tipsy" or "bouncy" serifs were the height of fashion. A good fit with the A&amp;W retro values image. AFAIK A&amp;W is not going to make it available to the public.<br>
      If you want something with a similar treatment of the lettering you could try a couple of fonts by Alex Kaczun, Beatnick:<br>
      <a href="http://www.myfonts.com/fonts/typeinnovations/beatnik/" title="http://www.myfonts.com/fonts/typeinnovations/beatnik/">http://www.myfonts.com/fonts/typeinnovations/beatnik/</a><br>
      or Beatnick Barbie:<br>
      <a href="http://www.myfonts.com/fonts/typeinnovations/beatnik-barbie/" title="http://www.myfonts.com/fonts/typeinnovations/beatnik-barbie/">http://www.myfonts.com/fonts/typeinnovations/beatnik-barbie/</a><br>
      For a more funky version try Alex Kaczun's Hippyfreak:<br>
      <a href="http://www.myfonts.com/fonts/typeinnovations/hippyfreak/" title="http://www.myfonts.com/fonts/typeinnovations/hippyfreak/">http://www.myfonts.com/fonts/typeinnovations/hippyfreak/</a><br>
      Funky versions from Filmotype, Orlando:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/orlando/" title="http://www.myfonts.com/fonts/filmotype/orlando/">http://www.myfonts.com/fonts/filmotype/orlando/</a><br>
      Panama:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/panama/" title="http://www.myfonts.com/fonts/filmotype/panama/">http://www.myfonts.com/fonts/filmotype/panama/</a><br>
      Parade:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/parade/" title="http://www.myfonts.com/fonts/filmotype/parade/">http://www.myfonts.com/fonts/filmotype/parade/</a><br>
      Another funky version, Fontdinerdotcom Loungy:<br>
      <a href="http://www.dafont.com/fontdinerdotcom-lou.font" title="http://www.dafont.com/fontdinerdotcom-lou.font">http://www.dafont.com/fontdinerdotcom-lou.font</a><br>
      Don</p>
