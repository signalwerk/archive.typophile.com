    <p>The attached image shows One Arabic Word in 3 different Styles:<br>
    Two Computerized and the other Calligraphed (top)...</p>
    <p>This 4-letter word begins with the egg-shaped letter (Sad) and ends with (ö),<br>
    The 2nd letter has 2 arms (like &gt;) and the 3rd looks like dotless j.</p>
    <p>Which style is more attractive, shorter (less horizontal) and easier to the eyes?</p>
    <p>The Top! That’s right. Why? For 4 reasons:<br>
    1. the 2nd letter's upper-arm shouldered the 1st letter that happily hoped on<br>
    and its lower-arm curved slightly to join the third letter<br>
    2. the 3rd letter coiled itself slightly to fill(kill) the gap it makes with (ö), and<br>
    3. The last letter (ö) moved up and right as she always likes to be snuggled.<br>
    ...<br>
    Slight yet Smart Changes?<br>
    ...<br>
    Technically Speaking, the first 2 letters are ligatured and the last 2 letters are kerned.<br>
    Or: Ligatures integrate 2 or more letters into one and Kerning narrows the gap between 2 letters.</p>
    <p>By and large, in order to join appropriately to neighbouring letters (where applicable),<br>
    1. Letter Tails (not heads) slightly change to achieve smooth connection, and<br>
    2. Meem, Ha and likewise letters (Jeem and Kha) shoulder earlier Letters.</p>
    <p>Hope Designers won’t neglecte these 2 factors in their coming fonts.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/KL_5637.jpg"></div><br>
    _________________ Translating into Melayu _________________<br>
    Gambar yang dikepilkan menunjukkan satu Kata Arab dalam 3 stail yang berlainan :<br>
    Dua dikomputerkan (agaknya diimbas (scan)) dan satu kaligrafi (diatas)…<p></p>
    <p>Kata bermula dengan huruf berbentuk telur (Sad-huruf jawi) dan diakhiri dengan õ<br>
    Huruf kedua ada dua lengan (diatas dan dibawah) dan yang ketiga seperti j tanpa titik.</p>
    <p>Yang mana satu lebih nampak menarik, lebih pendek dan lebih sedap mata memandang<br>
    ...<br>
    Ya betul : Yang di atas<br>
    ...<br>
    Kenapa? Ada 4 sebab:</p>
    <p>1. Lengan atas bagi huruf kedua memberi tumpang kepada huruf pertama  dan<br>
    .. lengan dibawah bagi huruf kedua sedikit melengkung untuk bersambung dengan huruf ketiga,<br>
    2. Huruf ketiga berlingkar sendiri sedikit untuk memenuhi ruang kosong dan menjadikan huruf terakhir)<br>
    3. Huruf terakhir berada diatas dan dikanan kerana dia suka meringkuk dgn selesa<br>
    ...<br>
    Sedikit tapi perubahan yang bijak<br>
    ...<br>
    Uuntuk menyambung dengan huruf-huruf yang bersebelahan (dimana sesuai)<br>
    1. Ekor huruf diubah untuk menghasilkan sambungan yang lancar dan<br>
    2. rata (Meem, Ha dan huruf Jeem dan Kha) menumpangkan huruf sebelumnya</p>
    <p>Secara teknikalnya, 2 huruf yang pertama diikat dan huruf kedua terakhir di keluarkan sedikit<br>
    Pengikatan memerlukan 2 atau lebih huruf menjadi satu dan pemanjangan mengurangkan ruang diantara 2 huruf</p>
    <p>Saya berharap saya telah berjaya dalam penerangan 2 faktor yang selalunya diabaikan oleh penulis khat arab/jawi</p>
    <p>Semoga Berjaya<br>
    _________________ Translating into Poem _________________<br>
    Type is nothing but to Assemble, Compile and Shuffle<br>
    ... Letters on lines to make people bubble<br>
    Towards that end, fonts are handled and tackled<br>
    The inspired by butterfly and Candle is lovable and durable<br>
    But the inspired by beetle's tentacles is terribly horrible<br>
    Plenty are the Samples but few are the Examples<br>
    ...<br>
    There, every movement is probable: Scramble and Scribble<br>
    Ligatures and Kerning are the most Challenging variables<br>
    Ligatures is to bundle couple, triple and Quadrable<br>
    Kerning is the art of snuggle and nestle<br>
    In these, Arabic has no double.</p>
    <p>Before I make it, I fondle from all sides and angles<br>
    My fingers, I do wriggle and fiddle<br>
    For "o" I go round in circle, like a spindle<br>
    When the "Alif" goes like needle and the REST flexible,<br>
    I wrestle and wrestle to make it wonderfully single<br>
    As Twins are not allowed, unless the new outlook is remarkable<br>
    ...<br>
    Ending my riddle, one thing that will puzzle U and baffle<br>
    I dont even own a bicycle, and my bills I hardly settle<br>
    To the 99% I do belong, and gainst the 1% I still struggle and wrangle<br>
    ...<br>
    With <a href="http://typophile.com/node/51401" rel="nofollow">Flowers</a>, hope I have kindled a candle</p>
