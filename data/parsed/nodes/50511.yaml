    html: |-
      <p>To date, and in my opinion, presses that use dry ink (toner) do not rival offset printing for type quality, esp. when the offset press is running at 2400-3000 dpi.</p>
      <p>While I have no scientific evidence, this is less a matter of resolution per se. than a matter of, say, "nearest neighbor." For example, in photography, with silver halide images, the propensity of a silver halide crystal to turn metalic depends on what it's neighbor does. So, even with the lith systems used in the printing industry, "overexposure" results in thicker type, rounded serifs, etc. etc.</p>
      <p>For whatever reason, systems that image a belt which picks up dry toner seem to have a large "nearest neighbor" factor. So you don't want a heavy face to begin with.</p>
      <p>A pretty good test would be any type that looks good on your xerographic laser printer, assuming it is a fairly high quality one, stands a good chance of looking pretty good on the larger POD systems.</p>
      <p>FWIW</p>
