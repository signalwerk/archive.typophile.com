      <p>Whoa! </p>
      <p>"...tends to degrade fonts int the way that several generations of xeroxing would..."</p>
      <p>That makes me bristle. First of all: it's Xeroxing, at least if you respect trademarks and want to participate in keeping them protected.</p>
      <p>Second, Please take a page from a well set book. Xerox it "several" times. Compare the results with the absolute worst you can find from a PoD printer. </p>
      <p>One of the problems with PoD printers is that they get lulled into a do-it-fast stupor; shove it in one end and what comes out the other goes to the customer. QA is generally superficial (ie, if the signatures are in the correct order and the cover is properly oriented, it's a good book). </p>
      <p>We had a title that was originally printed by a superior offset book printer in Canada. There was a need for a quick 2nd, short-run printing. We used our PoD printer. I admit that I viewed the results through 70-year-old eyes worn out by looking at print products for roughly 4 decades, but I was hard pressed to see a difference. I could tell which was which by smell, but visual comparison was much, much harder. The book was set in Garamond. I would not suggest Bodoni, but its serifs are hard to hold anywhere.</p>
      <p>Spend as much time finding a competent PoD printer as you do looking for the correct typeface, and you'll do fine.</p>
      <p>And, let's remember: lightning print and lightning source are two VERY different printing establishments.</p>
      <p>Curt Akin</p>
