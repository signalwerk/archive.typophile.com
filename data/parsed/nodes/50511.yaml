      <p>Any well-run POD shop should be willing to run some tests for you. Set the same text in a few faces (the kinds of faces Charles mentioned) and have them run a test. A shop that won't do this for a potential customer is not worth doing business with. Maybe on a white and a natural stock. Lightning is so big, they might not want to do the test. There are a lot of good POD shops around.</p>
      <p>For years I saw no good work from Lightning. Their work looked to me as though they had cut the letters into the face of a potato, inked it on a rubber-stamp ink pad, and mashed it onto the paper. But last week I saw a book printed by them that was better. The type, a very plain sans, looks quite good.</p>
      <p>powers</p>
