    <p>looking for suggestions which work particularly well for print-on-demand books. georgia is apparently well suited for the p.o.d. process, which tends to degrade fonts int the way that several generations of xeroxing would, but the look is unappealing, perhaps too friendly or childish. constantia is the only other i'm aware of that's recommended. any suggestions?</p>
    <p>it will be for a new edition:<br>
    <a href="http://www.amazon.com/Where-Home-Stories-German-Jewish-%C3%89migr%C3%A9/dp/B001BARVF0" title="http://www.amazon.com/Where-Home-Stories-German-Jewish-%C3%89migr%C3%A9/dp/B001BARVF0">http://www.amazon.com/Where-Home-Stories-German-Jewish-%C3%89migr%C3%A9/...</a></p>
