      <p>Does the logo even NEED to say clothing? many / most successful clothing lines generally go by their name (prada, armani, &amp;c). If the tag is on a pair of jeans, I don't think it's necessary to tell someone that it's clothing. Perhaps this goes outside of your typography based inquiry and into branding (which you may or may not even be able to change), but it may free you up from what James was getting at.</p>
