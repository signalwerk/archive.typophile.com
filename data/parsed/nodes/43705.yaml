    html: <p>To me, metrosexual and masculine are somewhat opposite. The idea of "metrosexuality" makes me think of men who have accepted feminine ideas of fashion æsthetics. That being said, it's hard to give one a "masculine" typeface. You don't want to fall into a stereotype, and use some faux-photocopied grunge font, or some chunky ultra-bold / slab serif just to evoke a feeling of masculinity. I think nearly any typeface, depending on how you dress it (no pun intended) can have the potential to serve a masculine purpose. I'd imagine the fashion style would be the biggest influence. Is it like american apparel, abercrombie &amp; fitch, Banana republic, ralph lauren?</p>
    html_clean: <p>To me, metrosexual and masculine are somewhat opposite. The idea of "metrosexuality" makes me think of men who have accepted feminine ideas of fashion æsthetics. That being said, it's hard to give one a "masculine" typeface. You don't want to fall into a stereotype, and use some faux-photocopied grunge font, or some chunky ultra-bold / slab serif just to evoke a feeling of masculinity. I think nearly any typeface, depending on how you dress it (no pun intended) can have the potential to serve a masculine purpose. I'd imagine the fashion style would be the biggest influence. Is it like american apparel, abercrombie &amp; fitch, Banana republic, ralph lauren?</p>
