    html: <p>Nick, ‘qi’ is used in pin-yin, the system of romanized Chinese. The q is used for the ‘ch’ sound. This is used to input Chinese on computers, and also is the <span class="caps">PRC</span> preferred way to transliterate Chinese. <span class="caps">FYI</span>, qi (pronounced chee) means air, atmosphere, or spirit, and is also the term for the mysterious energy that is supposed to ﬂow through the body and the landscape. It is a key term in both acupuncture and fung shui, as well as being part of many, many Chinese&nbsp;words.</p>
    html_clean: <p>Nick, ‘qi’ is used in pin-yin, the system of romanized Chinese. The q is used for the ‘ch’ sound. This is used to input Chinese on computers, and also is the <span class="caps">PRC</span> preferred way to transliterate Chinese. <span class="caps">FYI</span>, qi (pronounced chee) means air, atmosphere, or spirit, and is also the term for the mysterious energy that is supposed to ﬂow through the body and the landscape. It is a key term in both acupuncture and fung shui, as well as being part of many, many Chinese&nbsp;words.</p>
