    html: "<p>Checking all possible combinations* (manually) is one thing, setting up elaborate sample texts to do that is another, and actually putting in kerning for everything yet another. <br><br>* Except things that should be <i>totally</i> handled by the default spacing (in fact during the determination of the base spacing), like “no”. <br><br>Andreas: Spacing your fonts intelligently to reduce kerning is good practice*, but trying to avoid kerning outright is a bit… quixotic! Unless there’s a peculiar technical -or user- limitation. <br><br>* Except for the rare case where leaning heavily on kerning is required, like for the highest quality Armenian setting. <br><br>hhp</p>"
