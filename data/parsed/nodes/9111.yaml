    html: "<p>I try it out at random on various brochures, magazines, ads, etc., that I've worked on and have Quark/InDesign files for. Even Word! Recipes are good.  <br> <br>I've also written my own text, to include the more infrequently used glyphs and marks. Caesar salad. <br> <br>\"five truffles offer sufficient flavo(u)r\" has all the f and f-ligature glyphs. Can't remember where I found that. <br> <br>Here is something I invented: <br>537+489=1026 <br> <br>...by trial and error. Luc Devroye subsequently calculated it mathematically -- there are over a hundred of these equations.</p>"
