  - id: 59323
    user: 4406
    date: 2005-02-10T23:31:00
    date_raw: 10 Feb 2005 — 11:31pm
    votes: null
    html: "<p>Thomas: yeah, that wordlist certainly has some gaps; fj popped out at me too. Good catch on the fp and fb! <br> <br>Zhao wouldn't have qualified because these are lc kerns only, but there is always Brezhnev. <br> <br>Part of my point in posting this is to show that the coverage of kern pairs by English words is in fact quite spotty--even just counting lc pairs, you're missing almost a fifth of the possible combinations. Once you add in uppercase, you get four times the number of digraphs that need coverage, and the rising popularity of <a href=\"http://en.wikipedia.org/wiki/CamelCase\">CamelCase</a> makes it even more likely to actually run into those. <br> <br>So yeah, I'm going to make sure to cover all possible digraphs when I actually get around to releasing my fonts, not just the ones that seem likely in English.</p>"
    html_clean: "<p>Thomas: yeah, that wordlist certainly has some gaps; fj popped out at me too. Good catch on the fp and fb! <br> <br>Zhao wouldn't have qualified because these are lc kerns only, but there is always Brezhnev. <br> <br>Part of my point in posting this is to show that the coverage of kern pairs by English words is in fact quite spotty--even just counting lc pairs, you're missing almost a fifth of the possible combinations. Once you add in uppercase, you get four times the number of digraphs that need coverage, and the rising popularity of <a href=\"http://en.wikipedia.org/wiki/CamelCase\" class=\"link-external\">CamelCase</a> makes it even more likely to actually run into those. <br> <br>So yeah, I'm going to make sure to cover all possible digraphs when I actually get around to releasing my fonts, not just the ones that seem likely in English.</p>"
