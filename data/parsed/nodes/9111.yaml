    html: <p>Nick, 'qi' is used in pin-yin, the system of romanized Chinese. The q is used for the 'ch' sound. This is used to input Chinese on computers, and also is the PRC preferred way to transliterate Chinese. FYI, qi (pronounced chee) means air, atmosphere, or spirit, and is also the term for the mysterious energy that is supposed to flow through the body and the landscape. It is a key term in both acupuncture and fung shui, as well as being part of many, many Chinese words.</p>
    html_clean: <p>Nick, 'qi' is used in pin-yin, the system of romanized Chinese. The q is used for the 'ch' sound. This is used to input Chinese on computers, and also is the PRC preferred way to transliterate Chinese. FYI, qi (pronounced chee) means air, atmosphere, or spirit, and is also the term for the mysterious energy that is supposed to flow through the body and the landscape. It is a key term in both acupuncture and fung shui, as well as being part of many, many Chinese words.</p>
