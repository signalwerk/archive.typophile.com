      <p>Logos need to work in a small size. Reduce your logo to postage-stamp size and you'll find that some elements become way too small to read.</p>
      <p>I'd eliminate "gunnery range", that "x" and "established MMXII" (or else find a much more interesting and legible way to present it).</p>
      <p>I wouldn't have a perched bird. It's not sporting to shoot a bird that isn't in flight.</p>
      <p>For inspiration you might want to research logos of other exclusive venues, such as high-end golf resorts, luxury restaurants and hotels, men's clubs (not strip joints but traditional mens' clubs for rich guys), etc.</p>
