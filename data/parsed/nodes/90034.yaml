    <p>I would much appreciate critique for this rough starting-point of a logo for a fictional organisation. This is for a school project.</p>
    <p>Basically, I am building a professional brand for an exclusive, members-only recreational rifle club that caters to professional shooters and affluent males such as businessmen, politicians etc. and their fathers/sons etc. The concept is to create a higher-end shooting facility and associated products to cater for professional shooters and hobbyists who have the resources to afford a greater quality experience.</p>
    <p>Regarding critique, I would like feedback on type combos/choices, general arrangement of elements and effectiveness at representing the brand I have described above.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo_5025.jpg"></div><p></p>
