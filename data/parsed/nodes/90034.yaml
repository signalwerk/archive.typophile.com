    html: |-
      <p>I think you've got the basis of a promising logo, but as apankrat mentioned, it's still looking a little cluttered.</p>
      <p>You've got a lot of elements in the logo, and they're all doing different things. The owl (I think it's an owl) is facing left, the italics slope to the right, and the other elements stand upright. Also there's a lot of difference in the relative sizes of the logo elements. The words 'Riflery, Guild, Noblemen' are much larger than the smallest elements.</p>
      <p>Perhaps you could try making all the elements closer to each other in size. Also try using the shape of a bird from front on and no italics, which might help with the centering of the logo. And I would have the date read 'EST. MMXII' so people know why the logo includes the year.</p>
      <p>Hope that helps</p>
