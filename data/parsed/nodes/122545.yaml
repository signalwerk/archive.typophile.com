      <p>You’re welcome to consider <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/andron-1-lat-corpus/" rel="nofollow">Andron</a> as well. It may fit your bill quite nicely:<br>
      1. $200 is fitting (we can make an off-site arrangement).<br>
      2. it’s Old Style, rather Venetian. A new design, no remake.<br>
      3. has a separate small caps font. SC Italic would be an additional option.<br>
      4. linespacing shall be OK (depends on your appl. settings).<br>
      5. Optical caption/titling variants exist, however, they are not (yet) released. – optional.<br>
      6. The Bold styles are clearly bold but not too thick.<br>
      7. A Swash option font (named Scriptive) is in the 6-font package.<br>
      8. lining figures are not in as a default. But I can make them default for you if you want.</p>
      <p><a class="freelinking external" href="http://stoetzner-gestaltung.prosite.com/279225/andron-special" rel="nofollow">Here</a> are some samples how it looks like.</p>
