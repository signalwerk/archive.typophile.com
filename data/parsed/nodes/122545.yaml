      <p>Let's see if any of my text favorites pleases you... I really really love <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/lyon/lyon_text" class="freelinking" rel="nofollow">Lyon Text</a>, you can get four styles for $200, say one of the two Regulars and Semibold with their respective italics. It is a beautiful face inspired by old-style (Granjon) but with a very friendly and contemporary appeal, with a lot of versatility IMO. It has lining figures, alternates and what not... The Text styles don't have swashes, but Lyon Display does have them.</p>
      <p>Also, for just $239 you can get the whole 20 styles (!) of <a href="/wiki/https%3A/%252Fphilsfonts.com/index.php/fonts/overview/GF060014X1" class="freelinking" rel="nofollow">Freight Text</a>, a fantastic workhorse text face, maybe not so close to the style you prefer, but one that I would never regret buying, especially at that price for the entire family.</p>
      <p>In <a class="freelinking external" href="http://www.typophile.com/node/39592#comment-244536" rel="nofollow">this thread</a>, there's a list of some other awesome text faces you can browse and compare.</p>
      <p>Hope that helped!</p>
