      <p>Thanks for the recommendations-I thought I'd come back to this! I ended up narrowing it down to a shortlist which I will probably think about for a while. </p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/andron-1-lat-corpus/" rel="nofollow">Andron</a> is very near the top of my shortlist, since having styles as separate fonts is very practical if I ever need small caps in Word.  And the <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/andron-1-lat-corpus/scriptive/" rel="nofollow">scriptive</a> italic is lovely - just the kind of extra bonus I was looking for buying something new. My one reservation was its sizing - using the free version it seems a little small with wide lines than other typefaces set to about the same width, I imagine not a problem in a book but more difficult if you need to fit the absolute maximum amount of material clearly on one single page as I sometimes do. Williams Caslon has been high on my shortlist too ever since I read Berkson's <a class="freelinking external" href="http://ilovetypography.com/2010/07/26/reviving-caslon-the-snare-of-authenticity/" rel="nofollow">own article</a> on it, which as an outsider to type design I found fascinating. Lyon and Freight not so much - Freight just felt a bit too close to Times New Roman for comfort! I hemmed and hawed about Skolar, but those dagger serifs just didn't work for me.</p>
      <p>I'm also considering <a class="freelinking external" href="http://www.fontspring.com/fonts/hoftype/ashbury" rel="nofollow">Ashbury</a> from Hoftype. It's a bit more modern than I was expecting I'd like, and clearly a bit of a display font with that x-height, but testing on paper with the free light weight everything about it feels really rather well-balanced. Some other Hoftype designs appeal to me, but that one most of all somehow. <a class="freelinking external" href="http://www.myfonts.com/fonts/lanston/ltc-kennerley/" rel="nofollow">LTC Kennerley</a> would be higher on my list - it's a lovely, rounded design that almost feels like Futura reincarnated as an old style serif with lots of near-perfect circles, and it has a small caps font - if it had an option to switch on a more restrained italic. I like swashes, but sometimes you just want to completely turn them off... Less likely, I also somehow like <a class="freelinking external" href="http://www.myfonts.com/fonts/schizotype/vulpa/" rel="nofollow">Vulpa</a> a lot (maybe it's nostalgia - I read a lot of books in that kind of chunky serif growing up), though the bold looks a bit thick for me, and I'm also considering <a class="freelinking external" href="http://www.myfonts.com/fonts/eurotypo/fiesole/" rel="nofollow">Fiesole</a> because of its optical size set-a bit above what I was hoping to pay, but not an unfair price for the range of options. Any thoughts?</p>
