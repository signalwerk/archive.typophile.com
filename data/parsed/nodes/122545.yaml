    <p>Hi! I do some freelance teaching work in my spare time. I have a tax credit because of that and am thinking about buying a nice body text serif font for my own freelance teaching work (mostly lesson plans and powerpoint slides) that’s got more range than Garamond. (If this post feels familiar I posted it just before Christmas, but I think nobody noticed!)</p>
    <p>I have a couple of criteria I’m looking for, in descending order of importance. No choice about foundry-in fact I’d be keen to support a small one doing something really good. </p>
    <ol>
    <li>Budget: ideally not more than $200 for the family. One-computer license, no web use envisaged.</li>
    <li>Old-style font would be my preference; something less hard than a Times. Should be very friendly and readable. I'd prefer something that looks genuine and authoritative without looking too mannered. I like Caslon, if that helps.</li>
    <li>Needs to plays nice with Word and apps that don’t understand everything about OpenType. Separate small caps fonts would be extremely helpful.</li>
    <li>Ideally reasonably tight linespacing.</li>
    <li>Optical caption/titling variants would be nice too.</li>
    <li>Bold style that’s clearly bold but not too thick. Needs to not stand out against quite small headings.</li>
    <li>Swash option would be nice, again ideally as a separate font or at least as a separate numbered stylistic set Word can use.</li>
    <li>Needs lining figures for maths.</li>
    </ol>
