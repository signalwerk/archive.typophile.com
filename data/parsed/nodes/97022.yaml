      <p>Another application is the 'ignore' rule, which is not really a feature file keyword. It works like this: every "ignore" rule and its "when not ignored" counterpart appear in a sub-table of their own.</p>
      <p>ignore [a e m n r u]' [ @alpha ];<br>
      subst [a e m n r u]' by [a.end e.end m.end n.end r.end u.en];</p>
      <p>This is meant to replace 'a', 'e', etc. with a swashed 'end' form, but of course <em>not</em> if another alphabetic character follows. So the first line is internally compiled to</p>
      <p>subst  [a e m n r u]' [ @alpha ] by [a e m n r u];</p>
      <p>(i.e., it does "nothing"), and if this line <em>gets executed</em>, the next line is skipped. This particular sub-table must end after the next line, because there might be other lines that should be evaluated for the rest of the characters.</p>
