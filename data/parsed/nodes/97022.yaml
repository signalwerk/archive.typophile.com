      <p>Possible further mind blowing-yet-enlightening may occur if you inspect a few ligature sets. I'd have to go through my font library to find a good example, but I think the text you copied from the specs also apply to sequences of "ff", "ffi", and "ffl" ligatures -- i.e., put them in the wrong order and/or without subtables, and some combo's will not work.<br>
      Perhaps one of the OT-savvy techies can recall an appropriate thread from the past where one has to resort to manually inserting a 'subtable' clause in a GSUB feature.</p>
      <p>A propos: I am <em>assuming</em> OTF compilers automatically generate subtables for GSUB features, because I can't find a concrete reference to them as well (or these references are very oblique), and the fonts I have are positively brimming with them.</p>
