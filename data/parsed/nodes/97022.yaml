    html: |-
      <p>Thank's Karl and Theunis, that were the elaborate answers I was hoping for!</p>
      <blockquote><p>subst [a e m n r u]' [ @alpha ] by [a e m n r u];<br>
      (i.e., it does "nothing")</p></blockquote>
      <p>This is really enlightening. I've been using the ‘ignore’ keyword a few times and wasn't able to deduce such an evident fact.</p>
      <blockquote><p>(...) standard behavior for (feature) compilers is to automatically create them when deemed necessary.</p></blockquote>
      <p>I realize my problems to understand OpenType's syntax mostly arise from the fact that the compiler generates subtables behind the scenes.</p>
      <p>Another issue is that the ‘subtable’ command is only supported for class kerning, so one must set up an entirely new lookup to avoid line ‘skipping’. I wonder why it hasn't been implemented yet...</p>
      <p>One thing that has clarified many of my doubts, re-reading Adobe's <em>OpenType Feature File Specification</em>, is the following part about chaining contextual substitution:</p>
      <blockquote><p>The entire sequence of glyphs – prefix plus input plus suffix – must match in the current context for the rule to be applied. The match sequence is aligned to the current context by aligning the first glyph of the input sequence with the current glyph of the text being processed. If the rule is matched, then the current context moves the current glyph pointer ahead in the original text <em>by the length of the input sequence</em>. Note that in the FDK syntax, the entire context string (backtrack sequence + input sequence + look-ahead sequence) are all written in the text string order. This is worth emphasis, as inside the lookup rule, <em>the glyphs of the backtrack sequence are written in reverse order from the text to be matched.</em> </p></blockquote>
      <p>I've emphasized the mind-blowing parts.</p>
