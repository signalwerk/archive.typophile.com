      <p>Unfortunately I do not have first hand knowledge of GSUB tables, but you may find these links useful:</p>
      <p>The <a class="freelinking external" href="http://www.microsoft.com/typography/tt/win95tt.aspx" rel="nofollow">Microsoft Typography overview of TrueType in Windows 95</a> includes the following:</p>
      <dl><cite>The GSUB and GPOS tables define glyph substitution and positioning features. GSUB supplies five types of substitutions to support different kinds of character-to-glyph mappings, such as many-to-one ligature glyph substitution and one-to-many ligature decomposition.</cite></dl>
      <p>You may also find the information on the FontForge site useful:</p>
      <p><a href="http://fontforge.org/gposgsub.html" title="http://fontforge.org/gposgsub.html">http://fontforge.org/gposgsub.html</a></p>
      <p>This also refers to the following page on Adobe's website:</p>
      <p><a href="http://partners.adobe.com/public/developer/opentype/index_table_formats1.html" title="http://partners.adobe.com/public/developer/opentype/index_table_formats1.html">http://partners.adobe.com/public/developer/opentype/index_table_formats1...</a></p>
