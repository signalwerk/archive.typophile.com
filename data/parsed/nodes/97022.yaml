    html: |-
      <blockquote><p>Really? Nothing?</p></blockquote>
      <p>Uh, you got an answer, dintya?</p>
      <p>Anyway, here is the promised example: 'frac' -- based on Tal Leming's <a href="http://talleming.com/2008/04/16/fraction-fever/" rel="nofollow">Fraction Fever</a> discussion.</p>
      <p>feature frac {<br>
          sub @figures slash' @figures by fraction;<br>
          sub @figures' fraction by @numerators;<br>
      }</p>
      <p>The class '@figures' contains 'zero one two .. nine', and the first line will replace a simple default slash, preceded by a figure, with a proper 'fraction' slash. After that, individual figures should be replaced with superior/inferior forms, to create proper fractions.<br>
      It will work as expected if you manually inserted a fraction slash (and the first line will not be used). However, because all sub-tables are terminated a.s.a.p., this code will stop if the first line was executed! So in this case you have to force a sub-table below the first line to make sure the second line is evaluated as well.</p>
      <p>Tal Leming's code doesn't specifically mention a sub-table, but I think standard behavior for feature compilers is to automatically create them when deemed necessary. In my example, the first line contains a 'fraction' on the <em>right</em> side of a substitution (target) and the second line on the <em>left</em> side (source), so to be able to process both rules, the compiler creates a sub-table at the second line.</p>
