    <p>Some time ago I bought a very old document from the 1920's on a second hand fair. I instantly fell in love with the used typeface and descided to scan it and make a font out of it. Intentionally I just wanted to use it as an excercise for future fonts, but meanwhile I've really put my teath in it.</p>
    <p>In the attached PDF you'll find the original text from the document. This contains words with the 'normal' s and the old German '<a href="/wiki/long%20s" class="freelinking" rel="nofollow">long s</a>'. My German is quite good, but I my backwords compatibility goes only back to 1995. So I don't know how the long s is originally used in German text. I couldn't find any structural grammar-rules in the text, because both s-forms are used in the same word. Sometimes only the normal s is used and not the long s.</p>
    <p>I want to make an OpenType Pro font that takes care of the historical grammar-issues when you activate the feature. Besides that it will be packed with cool ligatures that I'm going to make next. </p>
    <p>Does anyone have reference material, or can give me an insight in the 'long s'-fenomenia?</p>
    <p><a href="http://www.characters.nl/downloads/RV©Deutsch_Reich.pdf" rel="nofollow">RV©Deutsch_Reich.pdf</a></p>
    <p>Thanx,<br>
    ®ené</p>
    <p>PS: The name is just a working title, so if anyone has a cool name for it... please feel free to suggest it here.</p>
