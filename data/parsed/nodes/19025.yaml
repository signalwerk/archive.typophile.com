    html: <p>I think the "medial s/terminal s" still applies here (as in "Gesetzer", for example) — but since there are many « compound-nouns » in German, you have here some terminal s "stuck" in the middle of a word, because they are actually the last letter of the first part of the noun (like "Au<strong>s</strong>gefertigt" or "Tilgung<strong>s</strong>kasse"). I don't know if I'm perfectly clear here, though.</p>
