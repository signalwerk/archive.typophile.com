      <p><em>but I don’t think it’s possible to build an OT feature that can handle these kinds of issues.</em></p>
      <p>No, it is not, and I am very unhappy about that.</p>
      <p>You'd have to put in an entire dictionary and hypenation engine into the font.</p>
      <p>Ligatures, for instance, are another trick. Not ever instance of "fl" is replaced by a ligature in German. "Auflegen", for instance. "Auf" is a prefix. Prefixes and root words are not connected by ligatures. Otherwise, it would be difficult to notice the gap. But with words like "abfliegen", an "fl" liagure should be used.</p>
