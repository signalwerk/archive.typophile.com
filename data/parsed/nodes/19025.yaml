      <p>®ené,</p>
      <p>  I wonder how your attempt at an OT solution for correct long/short-s application worked. There is, btw, a script for MS Windows that automatically applies ligatures and s-versions to German texts in (few) historical fonts: <a class="freelinking external" href="http://www.ligaturix.de" rel="nofollow">Ligaturix</a>; maybe that can help.<br>
        It'd be great if software started to support historical letter features; as you know, this is not only important for German. Until and throughout the 18th century, French, Italian, English, Dutch, they all used two types of s (in Antiqua, of course) according to position in the syllable, and my bet is there also were rules for when and when not to use ligatures.</p>
      <p>Mk</p>
