      <p>The whole thing of ligatures and longs is very problematic in German. So the best thing you can do is to avoid any automatic substitution!</p>
      <p>The fi ligature will work in 99,9% right, but fl, like Dan pointed out, will result in a small number of false settings. It will became more problematic with other ligatures.</p>
      <p>So if you make your OpenType feature code, limit the ligatures for the German language.</p>
      <p># LIGA<br>
      feature liga { # Ligatures<br>
      script latn;<br>
      language dflt;</p>
      <p> lookup no_i {<br>
        sub longs longs i by longs_longs_i.lig;<br>
        sub longs i by longs_i.lig;<br>
        sub f f i by f_f_i.lig;<br>
        sub f i by fi;<br>
       } no_i;</p>
      <p> lookup STANDARD {<br>
        sub longs longs by longs_longs.lig;<br>
        sub longs l by longs_l.lig;<br>
        sub f f by f_f.lig;<br>
        sub f l by fl;<br>
        sub l l by l_l.lig;<br>
        sub lslash lslash by lslash_lslash.lig;<br>
        sub t t by t_t.lig;<br>
        sub t h by t_h.lig;<br>
       } STANDARD;</p>
      <p>language TRK  exclude_dflt;<br>
      lookup STANDARD;        	</p>
      <p>language AZE exclude_dflt;<br>
      lookup STANDARD;</p>
      <p>language DEU exclude_dflt;        # Only fi is availble for German<br>
      sub f i by fi;</p>
      <p>} liga;</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
