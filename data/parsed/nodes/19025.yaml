      <p>So in German text, you only substitute fi an no other ligature? This doesn't satisfy me. Same for Adobe's solution which requires that you activate dlig (discretionary ligatures) to get f-ligatures in German text ... [Side note: These language-dependent definitions would require that layout engines respect language tags which, to my knowledge, most of them don't do at the moment.]</p>
      <p>I am unhappy that no application yet supports proper substitution of f-ligatures and maybe long-s for German. Obviously this is the price of internationalization. And I am one of them who made a fuss about the earlier method of substituting f-ligatures everywhere, with typographically incorrect results at many places in a German text.</p>
      <p>But: Taking f-ligature substitution (almost) completely out of liga is just the other extreme!</p>
      <p>A very simple solution for German typographers is:<br>
      liga *should* substitute f-ligatures wherever they appear -- so, no additional lookups for German! If a typographer really cares, he can go through the text manually, place the cursor between two letter that shall *not* be ligated, and switch off the liga feature. Character styles may help.<br>
      The amount of work this requires is about the same as with Andreas Seidel's or Adobe's liga-implementation for German. Only difference is, corrections work the other way round ...</p>
      <p>In German typesetting it is not nice, but does not harm either if f-ligatures are used at places where they are typographically "wrong". This is what has become common anyway -- because the software does the job. If we are honest, there are maybe a hand-full of German typographers who really care if an f-ligature is in place or not. My impression is that this hand-full of typographers are responsible for the just-as-unsatisfying solutions described at the beginning. I worry for this, because the "solutions" are even worse than the original problem which is something one can live with! And definitely is not to be addressed on font level.</p>
      <p><strong>To non-German-speaking type designers: Just do it as you always did. Forget the talk about exceptions from German side. Dealing with these exceptions correctly is not to be solved on typeface but on application level (dictionary).</strong></p>
      <p>Karsten</p>
    html_clean: |-
      <p>So in German text, you only substitute fi an no other ligature? This doesn't satisfy me. Same for Adobe's solution which requires that you activate dlig (discretionary ligatures) to get f-ligatures in German text ... [Side note: These language-dependent definitions would require that layout engines respect language tags which, to my knowledge, most of them don't do at the moment.]</p>
      <p>I am unhappy that no application yet supports proper substitution of f-ligatures and maybe long-s for German. Obviously this is the price of internationalization. And I am one of them who made a fuss about the earlier method of substituting f-ligatures everywhere, with typographically incorrect results at many places in a German text.</p>
      <p>But: Taking f-ligature substitution (almost) completely out of liga is just the other extreme!</p>
      <p>A very simple solution for German typographers is:<br>
      liga *should* substitute f-ligatures wherever they appear -- so, no additional lookups for German! If a typographer really cares, he can go through the text manually, place the cursor between two letter that shall *not* be ligated, and switch off the liga feature. Character styles may help.<br>
      The amount of work this requires is about the same as with Andreas Seidel's or Adobe's liga-implementation for German. Only difference is, corrections work the other way round ...</p>
      <p>In German typesetting it is not nice, but does not harm either if f-ligatures are used at places where they are typographically "wrong". This is what has become common anyway -- because the software does the job. If we are honest, there are maybe a hand-full of German typographers who really care if an f-ligature is in place or not. My impression is that this hand-full of typographers are responsible for the just-as-unsatisfying solutions described at the beginning. I worry for this, because the "solutions" are even worse than the original problem which is something one can live with! And definitely is not to be addressed on font level.</p>
      <p><strong>To non-German-speaking type designers: Just do it as you always did. Forget the talk about exceptions from German side. Dealing with these exceptions correctly is not to be solved on typeface but on application level (dictionary).</strong></p>
      <p>Karsten</p>
