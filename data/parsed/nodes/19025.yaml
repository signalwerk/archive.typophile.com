      <p>Karsten,<br>
      I can not understand that a German would say something like that. Did you try to read German texts with these wrong ligatures (like auﬂiegen)? It doesn't work at all. The ligatures mostly appear inbetween compound words and these words become instantly to hard to read because you can't make out the boundaries of the two parts – and thats exactly what you expect to make out the meaning of the word.<br>
      Also I don't think it's just a matter of how it looks. It's a rule of the German orthography (and for a good reason)! And a type designer should never question that or build fonts that  don't go along with the orthography.</p>
      <p>Ralf</p>
      <p><a href="http://www.fonts.info" title="http://www.fonts.info">http://www.fonts.info</a></p>
