      <p>The distinction between ſ and s in German is really a spelling problem, and as such there won't be an automatic solution unless you plan to include a sizeable dictionary in your implementation... </p>
      <p>However, it's really only crucial for Blackletter. When using Antiqua for printing German, the short s has always been acceptable.</p>
      <p>Since you may still be interested, I'll try to explain the rules as far as I remember them.</p>
      <p>As pointed out before, the basic idea is that ſ comes at the start of a syllable, but s is written at the end.  (The ſ in ſp and ſt is always counted as part of the following syllable, unless etymology indicates something else.) The problems are that sometimes ſ can also come at the end of a syllable:</p>
      <p>If the end of the syllable coincides with the end of a word, the end of a prefix, or the end of a constituent of a compound word, s must be used; these rules are applied to words of foreign origin, too!  If a silent vowel has been elided (e. g., ich wechſle, unſre) ſ must be used. Before a suffix starting with a vowel, it's ſ. If the suffix starts with a consonant, use s. Before d, k, m, n, w (in native German words, there are few such combinations not covered by earlier rules) s is used. In all other cases ſ is used as the default.</p>
      <p>Doesn't seem to complicated, but in practice the issue can be quite subtle, for example transportieren (trans-portieren) vs. tranſkribieren (tran-ſkribieren), or Wachſtube vs. Wachstube (slightly far fetched, but there are a few examples where the form of the s changes the meaning completely.)</p>
      <p>Abbreviation and hyphenation do not affect the choice of s. You have to base the orthography on that of the complete word.</p>
