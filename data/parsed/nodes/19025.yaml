      <p>Hi Karsten,</p>
      <p>I think you are right about the f-ligatures, they're not even standard in FontLab. The German language has a lot of f-ligatures (ff, ffi, ffl, ffj, fft, etc.) that have been forgotten in fonts for a long time. You had to buy an expert font an work through your whole text to replace these ligatures. My god!...</p>
      <p>I'm also a person to correct my text by hand, as long as we're not talking about a 200 pages thick book. ;-)  IMHO I think every typographer and/or typedesigner should apply 'the correct typographic rules' set an example for people. If they don't, who will!<br>
      Most people nowadays rely too much on their software to do it right. Mostly this is not the case. Therefor I want to implement as much into my font as possible, so the machine does it right. </p>
      <p>If you make a font for a specific language, the etymological- and grammatical issues should be respected and applied correctly. You can't just producte the rights glyphs and put them into the designated box.</p>
