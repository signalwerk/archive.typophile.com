      <p>Fraktur has three different small "s" -<br>
      the Eszett "ß" (das Eszett)<br>
      the "Long-s" (das Lange-s)<br>
      the "End-s" (das Schluss-s)</p>
      <p>I try to translate the basic rule paragraph fromout the PDF with my poor english...</p>
      <p>###<br>
      Basic rule </p>
      <p>- The "Eszett" (ß) will be used the same way as in Antiqua, no difference.</p>
      <p>The "Long-s" mostly appears at the beginning of a word, respectively inside the word, at the beginning of a syllable.</p>
      <p>- The "End-s" mostly appears at the end of a word, repespectively inside a word at the end of a syllable.<br>
      ###</p>
      <p>This paragraph is followed by Examples for Long-s and End-s in Fraktur, this might be interesting for you. The real usage is getting more difficult, of course :)</p>
      <p>Thom</p>
