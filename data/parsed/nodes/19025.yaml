      <p>A German can say this. I had to read German texts with wrong ligatures and I  don't feel comfortable with it. It is against habits, but, sorry to say, it does work, and one can get used to it.</p>
      <p><cite>Also I don’t think it’s just a matter of how it looks. It’s a rule of the German orthography (and for a good reason)! And a type designer should never question that or build fonts that don’t go along with the orthography.</cite></p>
      <p>1. You are mixing up two aspects. Of course typographers should care for setting f-ligatures correctly. If they only would ... But: <strong>Orthography is not the business of fonts but of applications.</strong><br>
      2. Typesetting with normal fonts which substitute f-ligatures everywhere and doing the exceptions by hand e.g. with character styles is just as easy (or complicated) as doing exceptions to exceptions already performed by the font! At least you know what you can expect.<br>
      3. Typographer/editors of German texts who don't care about typography get "faulty" results with all of the methods! Sometimes visually, sometimes orthographically, or both, at least regarding one ligature, or the other, or both ...<br>
      4. As to typographers who care, the two solutions mentioned earlier don't help but complicate. In future, do I have to check each font for ligature behavior first? No f-ligature-substitution at all? Substituting only fi? Or only fl?</p>
      <p>Typographer should always question things! I prefer Renner ("it depends") over Tschichold ("do this! don't do that!").</p>
      <p>Karsten</p>
