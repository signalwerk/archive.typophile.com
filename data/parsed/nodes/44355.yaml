      <p>Two things to keep in mind:</p>
      <p>FIrst: 1 point in Illustrator = 1 em unit in FontLab*</p>
      <p>Second: In Illustrator, the coordinate space is accurate to 1/1000 of a point, while in FontLab, the em unit is the smallest possible unit</p>
      <p>In effect, when you paste art from Illustrator into FontLab, the coordinates of the nodes are rounded to the nearest whole point first. This is what causes the distortion. To minimize the distortion, scale your art up in Illustrator beforehand so that 1 point corresponds to 1 em unit (basically, what others have advised above).</p>
      <p>* Unless you change the EPS import settings in Preferences, and I wouldn't unless you know what you are doing.</p>
