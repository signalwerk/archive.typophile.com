    html: |-
      <p>I am pretty sure other explanations might follow, but to give it a reasonable start..</p>
      <p>Scaling problem as well as distortion of vectors:</p>
      <p>Before you start drawing your letterforms in Illustrator, activate "snap to grid" (view) and create/set up a grid from within the preferences menu.</p>
      <p>In the pref. menu set a grid line e.g. every 50pt with a subdivision of 50 as well. </p>
      <p>Depending on the subdivisions you like to see and use you can make a finer or coarsar grid, eg. a grid line every 100pt with subdivisions every 10points.</p>
      <p>As a result you will be able to set your bezier points/nodes actually on the grid and not somewhere in between. </p>
      <p>Since a glyph will be 1000pt x 1000pt correlating to the UPM glyph size in Fontlab you have pretty much possibilities to set a node..</p>
      <p>When you work without a grid and you import your vectors to Fontlab your nodes might get rearranged since they were slightly off position.</p>
      <p>And here we are concerning the scaling..</p>
      <p>If you then define the baseline, descender/ascender-height and x-heigth make sure to achieve 1000pt. E.g. -250 descender, 600 x-height, 150 ascender.. </p>
      <p>Now you can import your glyphs in Fontlab immediately in the correct size, no need for rescaling..</p>
      <p>--</p>
      <p>The way I would do it:</p>
      <p>- Set up a grid (50pt grid line / 50 subdivisions) and make sure to activate "snap to grid"..</p>
      <p>- Create a second layer and set up baseline, descender/ascender-height and x-heigth as thin coloured lines horizontally across the whole canvas.. pretty much the same layout you would have in Fontlab.</p>
      <p>- draw the glyph..</p>
      <p>- define a shortcut action that a) copies the current glyph b) pastes the glyph c) puts the glyph to the coordinates x0,y0 (reference point should be bottom left) d) cuts the glyph to the clipboard again..</p>
      <p>When a glyph is finished, click it an run the action, go into Fontlab, open the corresponding glyph and hit paste (command+v). The glyph will then sit at the correct place with the correct size.</p>
      <p>- -</p>
      <p>When you decide to draw your glyphs in Illustrator, familiarize yourself with the different aspects you have to keep mind to actually use the workflow (you might have developed in Illustrator) to your advantage.</p>
      <p>Some will ask, why not draw your glyphs directly in Fontlab?</p>
      <p>I really hope, my explanation will clear up some aspects :)</p>
      <p>Regards, Steffen</p>
