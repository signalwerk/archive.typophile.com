    html: <p>thanks steffen, your reply was a great help, though a few more questions... we have been using a grid and snapping to it. our more geometric letterforms translate fine, but our letterforms that resemble more organic yet sans serif faces such as helvetica or univers are the ones distorting. we even tried using univers in illustrator, converting to outlines, then copying it into fontlab, and it still distorts.. mind you this is a face that is already well designed/thought out by professional foundries. we seem to think that certain vectors that may be more complex are hard for fontlab to translate. we may or may not be right.. just a thought.</p>
