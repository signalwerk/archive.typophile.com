      <p>Even if you draw the letters in Illustrator with the right grid, you must correct small details in FontLab afterwards, so there is really no point in doing that unless you absolutely refuses to learn to master FontLab bezier curves.<br>
      Most people I know, who had crossed from Illustrator to FontLab realize after a couple of weeks/months that drawing in FontLab is SO much easier, and better – and that it saves SO much time.</p>
      <p>:)</p>
