    <p>A friend and I have been drawing up faces for university for the past year or so as an ongoing project, mostly display faces, but faces none-the-less. Having a strength with using illustrator, we naturally use that first to draw up the letterforms, but recently, we've been importing our vectors into FontLab to create the actual type files. In doing so, we've come across some glitches.</p>
    <p>The scaling.<br>
    The scaling from Illustrator to FontLab is ridiculous, but that's not our main qualm..</p>
    <p>Distortion of vectors.<br>
    Upon importing our more intricate faces, FontLab distorts the vectors beyond easy repair. We don't understand why fontlab would distort the vectors to begin with.</p>
    <p>for example.. certain nodes along a curves will kink or be thrown into a wrong curve projection, distorting the character completely.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/type_6496.jpg"></div><p></p>
    <p>If anyone knows of something we might be doing wrong in the import process that might be causing this, please let me know... other than not working directly in FontLab... we feel more at home with Illustrator's drawing capabilities.</p>
