      <p>I use the same procedure of creating in Illustrator and pasting into FontLab. I do it all the time, and not once have I seen distortion as severe as the image you included. Small tweaks are all I ever need to make. This leads me to think you could make improvements in your method of drawing in Illustrator. Can you show what the original letters looked like, and where you placed the bezier nodes in Illustrator?</p>
      <p>As for scaling, it's easy. If you use the standard 1000 units, with 700 units for cap height, you can draw a 700 unit box in FontLab (from the cap height line to the baseline), and paste it into Illustrator. It gives you a box with a height of 9.7222. Take something like an H and scale it up to that height. Take note of the percentage, and use it to scale the entire set of glyphs at the same time. Now you can paste them into FontLab and they will be the correct size and in proportion to one another. If you're starting a new project in Illustrator, build it with the cap height of 9.7222 in mind and you won't need to scale at all.</p>
