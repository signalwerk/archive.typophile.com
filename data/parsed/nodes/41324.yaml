    <p>Designed by <a href="/wiki/Jan%20Maack" class="freelinking" rel="nofollow">Jan Maack</a></p>
    <p>FF Speak is a <a href="/wiki/Humanist" class="freelinking" rel="nofollow">Humanist</a> <a href="/wiki/Sans%20serif" class="freelinking" rel="nofollow">Sans serif</a> from a new FontFont designer, Denmark's <a href="/wiki/Jan%20Maack" class="freelinking" rel="nofollow">Jan Maack</a>. With FF Speak, Maack wanted to capture the tone of voice of youthful conversation. He created smooth but lively <a href="/wiki/letterform" class="freelinking" rel="nofollow">letterform</a>s that would evoke different intonations depending on the weights and ligatures used. FF Speak features light, regular, bold, and heavy weights with companion italics.</p>
