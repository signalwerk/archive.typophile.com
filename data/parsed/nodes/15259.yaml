      <p>I too like to change my images often. For a long time though (and still every once in a while) I had different versions of the tiny Typophile logo background. The fading image rotation feature in OSX is so cool that I took and made subtle changes in the background color so that ever minute or so the hue would change, but the logo stayed there. </p>
      <p>There are 43 variations there, I would be willing to upload them somewhere, if anyone was interested. It wasn’t my original design, so I guess that is up to the Typophile guys or whoever made that background first. Let me know though if I am not upsetting anyone.</p>
