    <p>I'm not asking for some crazy illegal download or anything of the like. </p>
    <p>Does anyone know where we can find the Noteworthy font presently in the iOS operating system? We have a number of apps that could be designed much better utilizing this higher-quality font rather than Marker Felt or Chalkboard, but, obviously, to get client sign-off, w need to show them what it looks like.</p>
    <p>Any help would be appreciated!</p>
