    html: <p><a href="http://www.myfonts.com/fonts/linotype/itc-stone-serif-2/itc-stone-serif/testdrive.html?s=You+want+some+real+future-car+porn%3F&amp;p=24">ITC Stone Serif</a>. <br> <br><a href="http://www.myfonts.com/fonts/linotype/futura/heavy/testdrive.html?s=By+midcentury%2C+we+will+have+merged&amp;p=24">Futura Heavy</a>. <br> <br><a href="http://www.myfonts.com/fonts/linotype/futura/medium-oblique/testdrive.html?s=Watch+out+for+that+car%21+Red+liiiiiight%21%21%21&amp;p=24">Futura Medium Oblique</a>. <br> <br><a href="http://www.myfonts.com/fonts/linotype/futura/light/testdrive.html?s=In+his+essay+on+the+future+of+the+automobile&amp;p=24">Futura Light</a>. <br> <br>For the Futuras, the Linotype version is a better match than the Bitstream (look at the difference in bowl widths in the B).</p>
