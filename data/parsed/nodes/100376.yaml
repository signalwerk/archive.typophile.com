      <p>Thanks for the linkages! </p>
      <p>Today I received card stock samples and I've decided to go with the 220 lbs (600 gsm) Lettra Fluorescent White. </p>
      <p>Now with the card stock in hand I can push forward my business card design, ya! It will have three components to it. One side letter pressed with, Graphic Declaration, rendered in textura blackletter. The other side will have a quick services mention and contact info, rendered in sans serif which I'm considering hand stamping. And the card stock edges will be painted either neon green, or red, or black.</p>
      <p>Thanks again for all the assistance.</p>
      <p>n.</p>
