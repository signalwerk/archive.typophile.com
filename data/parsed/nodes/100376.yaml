      <p>Blackletter rules.</p>
      <p>A good letterpress printer can produce pretty much any combination of impression depth and color (sometimes by making two passes). But a good letterpress printer is hard to find/afford - most of them are sensationalist hacks who treat type like a sledgehammer.</p>
      <p>hhp</p>
