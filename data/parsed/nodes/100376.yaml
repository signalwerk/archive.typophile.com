    <p>Hi, I'm in dire need of a solid looking blackletter without many ornateness to it's expression. Perhaps something like this...</p>
    <p><img src="http://www.graphicdeclaration.com/images/blackletter_textura.jpg"></p>
    <p>And the /G/ must be legible at quick first glace.</p>
    <p>And hopefully it's not one of those free ones that I've seen every wheres. </p>
    <p>Thanks in advance!</p>
    <p>n.</p>
