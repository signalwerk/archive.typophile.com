    html: <p>Leslie Cabarga's Streamline, Rocket and Raceway from FontBureau</p>
  - id: 290724
    user: 27902
    date: 2008-07-21T14:06:00
    date_raw: 21 Jul 2008 — 2:06pm
    votes: null
    html: <p><a class="freelinking external" href="http://www.fontdiner.com" rel="nofollow">Font Diner</a> has several fonts that might work. Look at Rocket Script and Cool Air Conditioner in the Free Silverware section, Permanent Waves under the Doggie Bag set, and Continental Railway under the Brown Bag set.</p>
  - id: 290813
    user: 2088
    date: 2008-07-22T07:32:00
    date_raw: 22 Jul 2008 — 7:32am
    votes: null
    html: |-
      <p>A couple of other Leslie Cabarga 'chrome' candidates: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/magneto/" rel="nofollow">Magneto</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/neonstream/" rel="nofollow">Neon Stream</a>. Ray Larabie's <a class="freelinking external" href="http://www.myfonts.com/fonts/larabie/deftone/" rel="nofollow">Deftone Stylus</a> also works as a chrome script, and of course there is <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/laser/" rel="nofollow">Laser</a>, which even comes in a chrome version.</p>
      <p>- Mike Yanega</p>
