  html: |-
    <p>I received a call for entries from a Chinese publisher this week for a book about type. Next to my bio, images of the typeface in use and so on they also ask for the font files, which makes me suspicious. Plus, the sender has a hotmail address, not from the publisher’s domain.</p>
    <p>Has anyony else recieved this? Do you think it is trustworthy? Or, is someone trying to trick me into sending my fonts? I have no idea whether this is genuine.</p>
