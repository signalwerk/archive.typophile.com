    html: <p>There’s a fast-growing typesetting industry in China now, because US and European publishers often send books to China to be typeset. Most of these businesses are probably legit, but it would be prudent to consider the possibility that this “invitation” is really a shady typesetter trying to scam some free fonts.</p>
