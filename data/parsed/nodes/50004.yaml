    <p>I woke up today with vague recollections that there was some kind of kit available for making one's own dry transfer rub down graphics. I'm not sure if it was a sort of photographic process or if it used copier/laser printer technology or some other common studio machine. It could have even been a way to make wet transfer decals, like those found in model kits.</p>
    <p>Does anyone know the details of such a material or process, or did I just dream it?<br>
    Perhaps there is a service that will make them inexpensively nowadays.</p>
