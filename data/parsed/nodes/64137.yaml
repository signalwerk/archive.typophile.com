    html: |-
      <p>2nd what aluminum said.</p>
      <p>As a personal portfolio, this would be great. But not for image hosting.</p>
      <p>Image hosting is all about providing a seamless, reliable service, digital service. You don't want customers doing a double-take and wondering if they accidentally clicked on the wrong site. And the "analog" background is a big no-no, imo (unless you are going for the lo-fi image hosting market).</p>
      <p>And I would say never use blackletter on a mainstream site, unless you are a beer company.</p>
