  html: |-
    <p>This is already completed, but I thought I could get some critique anyway to learn a bit.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picsahoy_by_brianskywalker_6135.jpg"></div><p></p>
    <p>The title is a font called Manuscript Gotisch, which looks quite piratey. The text that says 'image hosting' is set in a more open, less condensed, less ornamented face, Fette Trump-Deutch, because the other is very wily at smaller sizes, the details of it.</p>
    <p>Everything else is Baskerville. </p>
    <p>I did the design, wrote copy, and coded the layout in css/html. Tools used_ Adobe Illustrator CS2, CotEditor, a bunch of web browsers.</p>
  html_clean: |-
    <p>This is already completed, but I thought I could get some critique anyway to learn a bit.</p>
    <p></p><div class="imageWrap"><img src="/files/picsahoy_by_brianskywalker_6135.jpg"></div><p></p>
