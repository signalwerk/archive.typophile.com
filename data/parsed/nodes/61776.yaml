    <p><a href="http://www.sudtipos.com/">Sudtipos</a> is proud to announce de release of a <a href="http://www.veer.com/download/pdf/semilla_specimen.pdf">Type Specimen "Top ten albums by Semilla Records</a> for the just released <a href="http://sudtipos.com/fonts/116">Semilla</a> font. </p>
    <p><img src="/sites/default/files/old-images/typophilesemilla3_4378.jpg"></p>
    <p>The specimen is a collection of fake album covers using the font. The artful photos used in this booklet are by French photographer and designer <a href="http://www.flickr.com/photos/stephaneginer/">Stéphane Giner</a>. He is very deserving of your patronage, so please keep an eye out for his marvelous work. </p>
    <p>Best,<br>
    Ale Paul</p>
    <p><a href="http://www.twitter.com/sudtipos">Twitter Sudtipos</a><br><a href="http://www.facebook.com/sudtipos">Facebook Sudtipos</a></p>
