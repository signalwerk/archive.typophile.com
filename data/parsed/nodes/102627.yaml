      <p>Hi Jürgen,</p>
      <p>those forms don't strike me as particularly German. The script-style {r} and {s} are internationally widespread in hand-writing (though actually I learned a more Antiqua-like {r} in school in Switzerland), and {e} is pretty close to the Antiqua shape anyway. </p>
      <p>Or do you mean the letters are generally not very legible and depend on context to be read properly? I'm deliberately pushing the boundaries of legibility a bit here in favor of a fresher look. It's certainly not meant for body copy.</p>
      <p>I do feel the {s} is not quite finished yet. I'm thinking of cutting off the spur to the top right to clear up that join a bit — let's see if it's still legible then (or maybe even more so?).</p>
      <p>Gruß</p>
