    html: |-
      <p>@ Jürgen: I agree on the {S}, not so much on the {T}. I like the fact that the current {T} needs no kerning other than with punctuation. I made a simple-stroke {I} as a stylistic alternate (.ss02). The .ss01 now houses a few alternate caps that eschew descenders.</p>
      <p>@ Hrant: I'm not sure a font that was made on a weekend deserves a "full crit". It's made from rough wood, and ain't no polish gonna make it sparkle.  ;o) But do tell me if you see anything stick out sideways, especially in terms of color or kerning.</p>
      <p>I don't know the first thing about Hebrew, so I'm wary to dabble in it. I've been thinking about a Greek and/or Cyrillic, though. And different weights... but most likely I'm going to publish a single Latin weight first, see whether people like it, and then decide whether or not to put that kind of effort into it.</p>
