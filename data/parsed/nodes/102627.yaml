    <p>Here's a little something I literally built over the the weekend. It's inspired by the broken antiqua signage in the old Berlin subway stations. Backstein is German for "[baked] brick".</p>
    <p>The idea of a squarish gemetric font is hardly original, but I hope I brought in some fresh air with those rather unconventional letter forms (especially the {r} and {s}).</p>
    <p>Here's a PDF specimen: <a href="http://www.cinga.ch/type/backstein_specimen.pdf" title="http://www.cinga.ch/type/backstein_specimen.pdf">http://www.cinga.ch/type/backstein_specimen.pdf</a> </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/astro_4909.png"></div><p></p>
