      <p>The {s} gives the impression of a smallcap J at times ("jorgenfrei") so I agree that it needs rethinking.<br>
      The terminal of {L} is uncomfortably deep and invites second-guessing (b? V?) I think it would read more easily if it were shortened some.<br>
      Otherwise, I think you've made strong choices overall. Maybe get more creative with {$} to go with the classy os figures.</p>
