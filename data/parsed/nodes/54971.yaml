    html: <p>From a programmers perspective, it's not that difficult as long as all the texts that are being supplied have the same encoding and as long as such things as line-breaks can be ignored. Remember that ck becomes k-k in German, so just discarding the line-break will not work. On the other hand, you might want to know how often a certain letter is followed or preceded by a linebreak, i.e. a hyphen. Different spaces are also rather difficult if you are interested in characteres at the beginning and the end of words. A rough estimate, however, should be not to difficult to obtain in C or even TeX. As for the sources, I'd try to find large chunks of text on the internet. (The quantified lexis of books might be more important than the overall quantified lexis of the language, as I assume the purpose is related to typography.) Ghostview can also extract plain text from PDFs. -- cs</p>
