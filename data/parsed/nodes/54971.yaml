      <p>Kent,<br>
      <em>"Your dedication is admirable. But I have to ask: Would it really matter how often an “r” is followed by round vs. straight? Won’t you want both combinations to look acceptable and well-spaced?"</em><br>
      Indeed I'm probably off on kind of a longish-term learning tangent here, rather than aiming for an actual, quick, tangible result that I'm then going to put to use in my font.<br>
      This curiosity about the frequency of letter combinations (especially regarding the "r" example mentioned) also wasn't triggered by thinking about kerning, but rather the lettershapes themselves. In different fonts, the "r" – not due to spacing/kerning, but judging from the shape of the arm/beak – seems to go especially well with subsequent round shapes; or it has particular problems with an "a" following it; or it may look too close to an "m" when followed by an "n", etc.; that made me wonder which combinations would be most important to consider in an "r" (&amp; I'm assuming there must be similar considerations considering other glyphs as well).<br>
      Of course I agree the goal has to be to make it look decent at the very least next to as close to "anything" as possible – but I'm wondering if there is one especially frequent pattern of combination that would take precedence due to its frequency.</p>
      <p>AtoZ: Thank you! That's awesome. I was wondering if the Brown corpus isn't somewhat out of date by now.</p>
