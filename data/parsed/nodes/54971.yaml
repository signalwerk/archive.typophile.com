      <p><cite> &gt; (Like wanting to know how often on average an “r” would be followed by a “round glyph” vs. a straight.)</cite></p>
      <p>Your dedication is admirable. But I have to ask: Would it really matter how often an "r" is followed by round vs. straight? Won't you want both combinations to look acceptable and well-spaced?</p>
      <p>There was a time when disk space and processing time were at more of a premium and there was a point of diminishing returns for adding kerning pairs for unlikely (or practically non-existent) combinations. But things have changed quite a bit in the past several years. Also, with class kerning capabilities in OpenType, these frequency issues are much less important considerations, it seems to me.</p>
      <p>-- Kent.</p>
