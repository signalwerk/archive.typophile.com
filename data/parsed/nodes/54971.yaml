      <p>By "quantified vocabulary" (which obviously is impossible to define exactly – apart from being worded awkwardly) I guess I meant a sampling large and broad enough that the results gleaned from evaluating it would be substantial enough to work from on a somewhat general level. That means the data basis must be *much* broader than a single text you can fill into those convenient boxes in typical online tools… plus selected/compiled in a non-arbitrary way.</p>
