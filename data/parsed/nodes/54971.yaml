      <p>Oh, right. But I think it's not the amount of text only; it's the way it's selected and collated. I guess I've spent too much time studying that collating "something, just a lot of text" myself would not feel like a hack job (and not enough time to actually do it myself, satisfactorily). Maybe I put too much trust in research, but I do feel this needs a basis that's thought through in a way.<br>
      Like, what's in the Gutenberg project? It won't have daily newspapers. Words used are highly context specific, which is one reason why I think the Brown corpus is (or was?) doing a pretty good job of collating different language usage contexts.</p>
