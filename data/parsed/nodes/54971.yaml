    <p>How would one go about finding out about relative frequencies of two-letter combinations in different languages* – ideally even discerning between uppercase and lowercase letters? I'm essentially looking for something like a list that would say, an "r" is (I'm making this up for the sake of illustration) 13% likely to be followed by an "e" in English, but only 2% likely to be followed by a "k".<br>
    I'm aware there will not be a Final Verdict on this to be found, but there must be some approximative data to work with?<br>
    * I'm most interested in German and English for the moment.</p>
    <p>A quick-ish web search has brought up charts with relative <em>single letter</em> frequencies in different languages, as well as <em>word</em> frequency lists, but not a lot about pairs of letters. Wikipedia has a list of <a href="http://en.wikipedia.org/wiki/Bigram" rel="nofollow">Bigram Frequencies in the English language</a>, but this is single-case – and also only lists the <em>most common</em> combinations, while I'm looking for something more in the vein of a "pairing" frequency table.</p>
    <p>Any good, reasonably reliable references/literature you guys can recommend?<br>
    I'm done looking at wonky charts that don't say what data they're based on…<br>
    Of course, please re-direct me if this has been discussed before. I couldn't find anything, but then the search has been hiccuping.</p>
