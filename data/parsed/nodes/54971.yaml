      <p>&gt; I’d be more interested in some scientific analyses based on, I don’t know, the quantified vocabulary of a given language?</p>
      <p>The obvious idea is to feed a vocabulary into one of those "applets" you saw. Though you probably want to feed a <em>book</em> rather than a <em>vocabulary</em>. That's because latter would have exactly one entry for "the", but former will have it aplenty thus severely affecting the counts for "th" and "he" ... so it really depends on what exactly you want to measure.</p>
      <p>A program that builds a histogram of letter combination probabilities (even if it's case-aware) is really a 5 minutes of work for any decent programmer in virtually any language. Find one, feed one cold beer, collect one "lettermeter" program.</p>
