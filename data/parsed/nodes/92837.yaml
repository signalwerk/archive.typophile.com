    <p>hi all<br>
    i have been trying to start fontforge in Windows xp sp3; i initially tried the cygwin-fontforge package; it needs cygwin to be installed first;</p>
    <p>i tried cygwin-mingw (using xming.zip) shown in this page; i downloaded both 2011 and 2012 versions and also xming.zip. After extracting and running the same i find it is starting; but with a hitch (see the image!) the selection window is present without any information!</p>
    <p>the command window (cmd.exe) is peppered with "Pango-CRITICAL **: pango-xft-render: assertion 'PANGO-XFT_IS-FONT (font) failed"  messages.</p>
    <p>any solution for a non-linux non pango/python guy like me?<br>
    regards<br>
    rnkantan</p><div class="imageWrap"><img src="http://typophile.com/files/CaptureWiz_5315.jpg"></div><p></p>
