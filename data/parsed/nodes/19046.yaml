  html: |-
    <p>I am commisioned to design a book on contemporary computer games. Can you please help me with some tips on </p>
    <p>a) Headline fonts<br>
    b) body text (what is the english term?) fonts</p>
    <p>More specifically, I'm looking for a contemporary, technical feel, with good legibility. The book is on games of all kinds, so I am not looking for "fantasy"-type fonts.</p>
    <p>Thanks!</p>
