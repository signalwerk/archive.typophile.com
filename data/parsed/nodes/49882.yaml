  html: |-
    <p>Hello, I manage my fonts through a css file : </p>
    <p>[code]<br>
    WindowedApplication {<br>
    	fontFamily: 		"儷黑 Pro";<br>
    	fontWeight: 		normal;<br>
    }</p>
    <p>@font-face {<br>
    	src:				url("taiwaneseFont.swf");<br>
    	fontWeight: 		normal;<br>
    	font-family:		"儷黑 Pro";<br>
    }</p>
    <p>@font-face {<br>
    	src:				url("taiwaneseFont.swf");<br>
    	fontWeight: 		bold;<br>
    	font-family:		"儷黑 Pro";<br>
    }</p>
    <p>etc...[/code]<br>
    But the bold characters aren't handle, or it is so slicely that we can barely see the difference.  Is it possible to use another font for bold ? if yes, how ? Or maybe it exists font that handle the bold directly ?Thanks for any answer !</p>
