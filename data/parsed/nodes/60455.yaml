      <p>In the UK anyone can call a firm "john doe architecture"</p>
      <p>In the UK the title "architect" or "architects" is a legally protected title and<br>
      only with membership to the ARB - architects registration board can you use this title.</p>
      <p>The reason for saying "architects" is that the firm is chartered</p>
