      <p>This brings up a problem I've seen before. Is it architects, or architecture? Is it John Doe-Photographer, or John Doe Photography. Personal preference is to opt for the later. </p>
      <p>You state the word architecture in your thread title, why not use that? Also, are there other people working for them? It sounds like possibly they do, so they may not be the sole architects in terms of creating absolutely everything. </p>
      <p>Maybe don't state what those guys do, specifically (architects), but what THEY, as a company do (architecture).</p>
      <p>Also, from a linguistic point of view, I find it more harmonizing to the ear. FolkeS Pickering ArchitectS--the doubling of the S's bothers me.</p>
