      <p>Everyone’s advice thus far has been spot on. A reflection can be useful in certain situations, but generally should not be used as a “weight-bearing” design element. For instance, a reflection might be appropriate in advertising, to make it look like a product is resting on a surface, but in this case the reflection should go unnoticed. The eye should just assume that the product is on a shiny surface. I feel a bit like a broken record, but to develop a strong logo, start with shapes/type, and positive/negative space. If you can make it work like that, then you know you have a strong logo. Adding color will then only enhance an already strong logo, not polish a turd. I like the suggestion of Franklin Gothic. Even Helvetica or Gill Sans or Frutiger would be better than Arial, although I think Franklin Gothic would be the best fit.</p>
      <p>Flaccid Penis “R” ... classic!</p>
