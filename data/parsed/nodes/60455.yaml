      <p>Oh, and also regarding that reflection, you know you're onto something if you can reduce the design to black and white. Not grayscale, just black and white. Not because you might ever need to use it in black and white (photocopied reports/letters/etc anyone) but because it distills your form down to the essentials. Reflection would get lost.</p>
      <p>Discussion here:<br>
      <a href="http://noisydecentgraphics.typepad.com/design/2009/03/should-we-retire-the-black-and-white-logotype.html" title="http://noisydecentgraphics.typepad.com/design/2009/03/should-we-retire-the-black-and-white-logotype.html">http://noisydecentgraphics.typepad.com/design/2009/03/should-we-retire-t...</a></p>
      <p>PS I'm struggling with the same kind of problem at the mo...!</p>
      <p>--<br>
      Henry Hadlow - <a href="http://work.dlow.org" rel="nofollow">Graphic Design / Art Direction</a></p>
