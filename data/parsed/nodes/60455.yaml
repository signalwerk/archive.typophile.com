      <p><em>But really guys - Arial - i really like it when its used properly</em></p>
      <p>But see, that's the thing — Arial carries with it such negative connotations of amateurism that there is very rarely (I want to say never, but I don't want to be so closed-minded) a situation in which there would not be a better choice. Someone above mentioned Franklin Gothic — that's a perfect typeface to use for this sort of treatment, and it doesn't look as cheap as Arial.</p>
      <p>EDIT: Also, if you're designing for architecture and structural integrity, I would avoid using Arial's flaccid penis of an R. There's nothing structurally sound about that.</p>
