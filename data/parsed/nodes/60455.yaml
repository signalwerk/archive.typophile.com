    <p>Ladies &amp; Gentlemen, players and pimps put down your Macbook Pros / Pimp Cains / Chalices</p>
    <p>First post on the forum and having read some of the previous crits you guys give good advice and the standard of work here is generally high.</p>
    <p>I have been working on a rebrand for swfoulkesarchitects.com who have decided to recognise the names of both directors.</p>
    <p>One guy is working overseas for the firm and one is handling business in the UK so by recognising his name they seek to clear up any ambiguity surrounding who's in charge etc.</p>
    <p>see attached and let me have it.</p>
    <p>Cheers</p>
    <p>J</p>
