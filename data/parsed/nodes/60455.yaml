      <p>Everyone else is skirting around it and being diplomatic, but I'm just going to say it.</p>
      <p>Everything about that logo screams, "I threw this together in five minutes in Publisher." The typeface choice, the cheap reflection effect, everything in it is stock. Arial, as a default typeface in most programs until it was supplanted by Calibri, is the ultimate "cheap" font. I'm assuming that you don't want this architectural firm to look cheap, so if I were you I would strongly reconsider the type choice.</p>
      <p>I don't think that your overall logotype treatment is horribly ineffective; it's the other choices you made that pull this logo down.</p>
