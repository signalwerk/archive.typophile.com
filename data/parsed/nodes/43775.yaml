  html: |-
    <p>I just got an email from Undeware (as I'm sure many of you did) about their crazy blackletter, Fakir, being chosen for the European version of <em>Rockband</em>. This is great news, as they do great work. However the real news is that as part of a contest they're running, they're giving away a free "rock version" of Fakir's black weight for free download.</p>
    <p><a href="http://www.underware.nl" rel="nofollow">Check out their rocking front page with a link to more info and the font</a>. Warning: audible rocking will commence upon click.</p>
