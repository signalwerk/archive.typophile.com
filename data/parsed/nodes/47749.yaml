    html: |-
      <p>Go to find/replace and click on the little magnifying glass next to "find format" near the bottom of the dialogue box. This pops up a new window. On the left hand side click on "Indents and spacing" and put in the current space after value in the "space after" field. Click OK.</p>
      <p>Then click on the magnifying glass on the "change format" and do as above, but this time put in your desired value in the "space after" field.</p>
      <p>Click OK.</p>
      <p>Click Find/Change or Change All if you're feeling brave.</p>
      <p>There are other options there as well.</p>
      <p>Hope this helps!</p>
      <p>I'm presuming you're on CS3?</p>
