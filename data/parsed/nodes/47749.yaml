      <p>"Good idea, but it didn’t work well, because whoever did this text originally (in PageMaker!) used the same paragraph style for different types of text, in places...I think...like I said, it’s such a tangle of stuff that I’ve tried my best to avoid dealing with paragraph styles; one small change somewhere might throw a whole page out of whack, and I’d have no clue what was going on with it."</p>
      <p>Sometimes you have no other option than to kill all the formatting and start over with precise paragraph and character styles.  This appears to be one of those times.  I'm sorry that it's not the answer that you're looking for, but it <em>is</em> the only answer that's correct.</p>
      <p>Here is why: the Find/Change format options are exact.  If you import text that is 6.295pt, InDesign will round that off in the <em>displays</em> to 6.3pt.  But when searching for it in Find/Change, ID still treats it as 6.295pt, so it won't be found.  Either find that discrepancy somehow and account for it in your search, or start over.  I wish you luck.</p>
