    <p>Sasha Tochilovski at Cooper Union has started a Flickr group for images relating to the Type@Cooper type design certificate program.  It's still coming together, but if you're curious about the program it might be worth a look.</p>
    <p><a href="http://www.flickr.com/groups/coopertype/pool/" title="http://www.flickr.com/groups/coopertype/pool/">http://www.flickr.com/groups/coopertype/pool/</a>  </p>
    <p>And if anyone has images to add by all means throw them in there!</p>
    <p>Daniel Morris<br>
    The Arm Letterpress/The Dale Guild Type Foundry/Cooper Union<br>
    NYC</p>
