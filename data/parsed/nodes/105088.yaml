    <p>I'm selling my copy of House Industries' out-of-print Ten Year Book.<br>
    Slipcase and CD included.<br>
    Slipcase has a very small tear on the back, in the upper edge (pictured in photo #16), and minimal shelfwear on the corners and edges, mostly visible on the inside. The book itself is in excellent condition and appears new and unread. CD jacket attached in the back has never been opened.</p>
    <p>More info here:</p>
    <p><a href="http://shop.gestalten.com/books/typography/house.html" title="http://shop.gestalten.com/books/typography/house.html">http://shop.gestalten.com/books/typography/house.html</a></p>
    <p>and here:</p>
    <p><a href="http://www.houseind.com/objects/objects/housetenyearbook" title="http://www.houseind.com/objects/objects/housetenyearbook">http://www.houseind.com/objects/objects/housetenyearbook</a></p>
    <p>Price is 150EUR.<br>
    Shipping worldwide from Portugal via Standard Mail, rates are as follows: Portugal: 3EUR; Spain: 10.50EUR; rest of Europe: 11EUR; rest of the world: 20EUR. Additional services like expedited delivery, tracking and/or insurance are also available at an extra cost.<br>
    Payment via (international) bank transfer (preferred) or PayPal (has fees). The book ships as soon as payment is received.<br>
    Feel free to contact me if you have any questions.</p>
