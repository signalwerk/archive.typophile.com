    <p>Good morning fellows, I come from the Dingbatdepot Forum after suggestion by other members, as my question seems to be a pretty hard one to answer to (even though I figured it was very easy, unlucky me!).</p>
    <p>I would like to find a font file similar to the one shown in picture. It was a font type WIDELY used in Italy (and elsewhere) in technical and scientific books preminently, but in other literature as well, from late 1800 to 1930 approximately. Oddly enough, nobody seem to remember the name.</p>
    <p>Please note the aspect of capital letters, L, E and C in particular, with that kind of nice diagonal “arrows” as serifs. The look of lowercase letters is less important.</p>
    <p><a href="https://web.archive.org/web/20080821133802/http://img146.imageshack.us/img146/3928/fonthoepliyk3.jpg" title="http://img146.imageshack.us/img146/3928/fonthoepliyk3.jpg">http://img146.imageshack.us/img146/3928/fonthoepliyk3.jpg</a> </p>
    <p>Many thanks for your help, I really appreciate it.</p>
