    html: <p>I think work is all really bad. Stretched type-never a good idea.This could be a logo for anything- old ladies pantyhose, broadband service provider, and anything in between.  <br>The idea that the U and N align is the only thing <br>clever it has going for it. Start from scratch. Browse design annuals for concepts, check out logolounge for inspiration, etc....Remember, you should come up with something you can trademark, so be original. <br>Good luck, post again when you work this out.</p>
