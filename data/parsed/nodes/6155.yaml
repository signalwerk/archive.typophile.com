    date: 2004-08-25T07:27:00
    date_raw: 25 Aug 2004 — 7:27am
    votes: null
    html: <p>This is a new direction for this project, and for some more information 'stylusnet' is a small internet and hosting business in the UK. They dont really have any idea what they want..so its up to me.  <br>This new direction is basically trying to make a logo out of the letters SN, I think the idea is starting to work but would like your thoughts. I dont have any strong feelings about the colours (those were the first that looked ok) nor the font underneath.  <br>The rotation of the logo is what I really interested to hear about from you, should I keep it head on or try to force a little perspective from it.  <br>Is it clear enough that its an S and and n? <br> <br>Anyway, I'll let you be the judge. <br>Thanks a lot everyone! <br><img src="http://www.typophile.com/forums/messages/29/47521.gif" alt=""></p>
    html_clean: <p>This is a new direction for this project, and for some more information 'stylusnet' is a small internet and hosting business in the UK. They dont really have any idea what they want..so its up to me.  <br>This new direction is basically trying to make a logo out of the letters SN, I think the idea is starting to work but would like your thoughts. I dont have any strong feelings about the colours (those were the first that looked ok) nor the font underneath.  <br>The rotation of the logo is what I really interested to hear about from you, should I keep it head on or try to force a little perspective from it.  <br>Is it clear enough that its an S and and n? <br> <br>Anyway, I'll let you be the judge. <br>Thanks a lot everyone! <br><img src="http://www.typophile.com/forums/messages/29/47521.gif" alt=""></p>
