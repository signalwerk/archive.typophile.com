    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 14.May.2007 12.17am </div>
      <p>Dear Reader, we would like to present you two new typeface families, one new t-shirt and one book.</p>
    <p>&gt; Greta Text, Greta Display<br>
    Typotheque is proud to introduce Greta, a contemporary typeface family specifically designed for the demands of newspaper printing. Greta Text consists of four primary text weights (each with three grades) and is optimized for use at small sizes. Greta Display was designed with increased contrast, tighter spacing and more refined details and is ideally suited for headline typography and nameplates. Greta received Type Directors Club Certificate of Excellence in Type Design, in 2007.<br>
    <a href="http://www.typotheque.com/fonts/greta_text/" title="http://www.typotheque.com/fonts/greta_text/">http://www.typotheque.com/fonts/greta_text/</a> -<br>
    <a href="http://www.typotheque.com/fonts/greta_display/" title="http://www.typotheque.com/fonts/greta_display/">http://www.typotheque.com/fonts/greta_display/</a> -<br>
    Or download PDF presentation<br>
    <a href="http://typotheque.com/data/specimens/pdf/GretaTextStd.pdf" title="http://typotheque.com/data/specimens/pdf/GretaTextStd.pdf">http://typotheque.com/data/specimens/pdf/GretaTextStd.pdf</a> -<br>
    <a href="http://typotheque.com/data/specimens/pdf/GretaDisplayStd.pdf" title="http://typotheque.com/data/specimens/pdf/GretaDisplayStd.pdf">http://typotheque.com/data/specimens/pdf/GretaDisplayStd.pdf</a> -</p>
    <p>&gt; Dutch Sky t-shirt<br>
    With a great deal of irony, Johanna Bilak created a second in the series of sky t-shirts. For those not so wonderful days we now offer ‘Dutch Sky’. Or pair it with the blue original Sky t-shirt, to cover all weather possibilities. Cool grey American Apparel shirt fits on virtually any body type.<br>
    <a href="http://typotheque.com/tshirts/dutch_sky/" title="http://typotheque.com/tshirts/dutch_sky/">http://typotheque.com/tshirts/dutch_sky/</a> -<br>
    <a href="http://typotheque.com/tshirts/sky/" title="http://typotheque.com/tshirts/sky/">http://typotheque.com/tshirts/sky/</a> -</p>
    <p>&gt; Edward Wright: readings, writings<br>
    This book is a reader on the work of Edward Wright, English typographer, painter and teacher. It brings back into circulation some forgotten texts written about Edward Wright by contemporaries – collaborators, students, critics, as well as his own writings.<br>
    <a href="http://typotheque.com/books/edward_wright_readings_writings/" title="http://typotheque.com/books/edward_wright_readings_writings/">http://typotheque.com/books/edward_wright_readings_writings/</a></p>
    <p>Warm regards,<br>
    Peter &amp; Johanna<br>
    <a href="http://www.typotheque.com" title="http://www.typotheque.com">http://www.typotheque.com</a></p>
