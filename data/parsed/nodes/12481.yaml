    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Garamond </strong></p>
    <p>Garamond is the original typographic naming disaster--a source of ongoing confusion. There are many types called "Garamond", almost to the point where garamond has emerged as a category among serif text faces. What most of the Garamonds have in common is that they are more-or-less accurate revivals either of type cut by <a href="/wiki/Claude%20Garamond" class="freelinking" rel="nofollow">Claude Garamond</a> in the late fifteenth century, or of type cut by <a href="/wiki/Jean%20Jannon" class="freelinking" rel="nofollow">Jean Jannon</a> in the mid-16th century.</p>
    <p>The basic story is this. A French punchcutter of the fifteenth century, Claude Garamond, was held in high esteem. In the early twentieth century the producers of matrices for machine setting were keen to revive or recut historical typefaces, and several versions of typefaces named for Garamond, and supposedly based on his typefaces, were produced: by <a href="/wiki/American%20Type%20Founders" class="freelinking" rel="nofollow">ATF</a> in <a href="/wiki/1918" class="freelinking" rel="nofollow">1918</a>, by <a href="/wiki/Lanston%20Type%20Co." class="freelinking" rel="nofollow">Lanston Monotype</a> (drawn by <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic Goudy</a>) in 1921, and by <a href="/wiki/Monotype" class="freelinking" rel="nofollow">English Monotype</a> in <a href="/wiki/1922" class="freelinking" rel="nofollow">1922</a>.</p>
    <p>It turned out that the original of these types, then believed to be the work of Claude Garamond, were not: they were the work of a different French punchcutter, Jean Jannon. This was discovered and made public by <a href="/wiki/Beatrice%20Warde" class="freelinking" rel="nofollow">Beatrice Warde</a> in an article for <a href="/wiki/The%20Fleuron" class="freelinking" rel="nofollow">The Fleuron</a> in <a href="/wiki/1926" class="freelinking" rel="nofollow">1926</a>. But by then the Garamond (or, as Goudy would have it, Garamont) name had stuck.</p>
    <p>Meanwhile there were and are other revivals (of which the most well-known is <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> Garamond, designed by <a href="/wiki/Robert%20Slimbach" class="freelinking" rel="nofollow">Robert Slimbach</a> (<a href="/wiki/1989" class="freelinking" rel="nofollow">1989</a>)) which <em>are</em> based on Claude Garamond's type.</p>
    <p>It is not hard, when the typefaces are seen side-by-side, to identify differences between the various Garamonds, and to perceive (broadly) two different "families"; but the similarities are quite striking too. Generally choice depends on aesthetic preference rather than historical correctness. These are usable typefaces with a slight air of conscious refinement that appeals to some and repels others.</p>
    <p><strong>Based on Garamond</strong>: <a href="http://www.linotype.com/1500/stempelgaramond-family.html" rel="nofollow">Stempel Garamond</a>, <a href="http://www.myfonts.com/fonts/linotype/adobe-garamond/regular/testdrive.html?s=Claude+Garamond&amp;p=48" rel="nofollow">Adobe Garamond</a>, <a href="http://www.linotype.com/505/granjon-family.html" rel="nofollow">Linotype Granjon</a>, <a href="http://www.linotype.com/1436/sabon-family.html" rel="nofollow">Sabon</a>.</p>
    <p><strong>Based on Jannon</strong>: <a href="http://www.myfonts.com/fonts/agfa/garamond/mt/testdrive.html?s=Jean+Jannon&amp;p=48" rel="nofollow">Monotype Garamond</a>, <a href="http://www.myfonts.com/fonts/linotype/simoncini-garamond/simoncini-garamond/testdrive.html?s=Jean+Jannon&amp;p=48" rel="nofollow">Simoncini Garamond</a>, <a href="http://www.myfonts.com/fonts/linotype/garamond-3/garamond-three/testdrive.html?s=Jean+Jannon&amp;p=48" rel="nofollow"> ATF Garamond</a> (Linotype Garamond 3), <a href="http://www.p22.com/lanston/products/garamont.html" rel="nofollow">LTC Garamont</a>, <a href="http://www.myfonts.com/fonts/storm/jannon/antiqua/testdrive.html?s=Jean+Jannon&amp;p=48" rel="nofollow">Storm Jannon Antiqua</a></p>
    <p>Note that <a href="/wiki/Jan%20Tschichold" class="freelinking" rel="nofollow">Jan Tschichold</a>'s Sabon, though not called Garamond takes Garamond's types as its starting point.</p>
    <p><a href="http://www.myfonts.com/fonts/linotype/itc-garamond/book/testdrive.html?s=Tony+Stan%3F&amp;p=48" rel="nofollow">ITC Garamond</a> is very much a creature of the 1970s (designed by Tony Stan). It is a type which tends to arouse strong feelings (not usually good ones). But even its supporters accept that this typeface, with its large <a href="/wiki/X-height" class="freelinking" rel="nofollow">x-height</a> is a Garamond only in name.</p>
    <p>Because of the profusion of garamond-like typefaces and the early confusion around its naming, it is common to see a typeface referred to as a garamond, the way we might categorize a typeface as a blackletter or a script.</p>
    <p>In addition to Sabon, <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=1&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=verdigris&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=I+%5Bheart%5D+Typowiki" rel="nofollow">MvB Verdigris</a> is another contemporary face that could be called a garamond.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/1920" rel="nofollow">Which Garamond? Typophiles Recommend:</a><br>
    <a href="http://typophile.com/node/12216" rel="nofollow">Garamond Premiere Pro</a><br>
    <a href="http://typophile.com/node/33124" rel="nofollow">Garamond Anyone?</a><br>
    <a href="http://typophile.com/node/33652" rel="nofollow">...And Garamond is Great Why?</a><br>
    <a href="http://typophile.com/node/37259" rel="nofollow">Garamond Is Not Garamond</a></p>
