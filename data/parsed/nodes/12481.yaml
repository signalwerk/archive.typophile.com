    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Garamond </strong></p>
    <p>Garamond is the original typographic naming disaster–a source of ongoing confusion. There are many types called “Garamond”, almost to the point where garamond has emerged as a category among serif text faces. What most of the Garamonds have in common is that they are more-or-less accurate revivals either of type cut by <a href="/node/add/wiki?edit%5Btitle%5D=Claude%20Garamond" title="Create node &quot;Claude Garamond&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Claude Garamond</a> in the late fifteenth century, or of type cut by <a href="/node/add/wiki?edit%5Btitle%5D=Jean%20Jannon" title="Create node &quot;Jean Jannon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jean Jannon</a> in the mid-16th&nbsp;century.</p>
    <p>The basic story is this. A French punchcutter of the fifteenth century, Claude Garamond, was held in high esteem. In the early twentieth century the producers of matrices for machine setting were keen to revive or recut historical typefaces, and several versions of typefaces named for Garamond, and supposedly based on his typefaces, were produced: by <a href="/node/13552" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ATF</span></a> in <a href="/node/add/wiki?edit%5Btitle%5D=1918" title="Create node &quot;1918&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1918</a>, by <a href="/node/12341" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lanston Monotype</a> (drawn by <a href="/node/19481" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frederic Goudy</a>) in 1921, and by <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">English Monotype</a> in <a href="/node/add/wiki?edit%5Btitle%5D=1922" title="Create node &quot;1922&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1922</a>.</p>
    <p>It turned out that the original of these types, then believed to be the work of Claude Garamond, were not: they were the work of a different French punchcutter, Jean Jannon. This was discovered and made public by <a href="/node/add/wiki?edit%5Btitle%5D=Beatrice%20Warde" title="Create node &quot;Beatrice Warde&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Beatrice Warde</a> in an article for <a href="/node/add/wiki?edit%5Btitle%5D=The%20Fleuron" title="Create node &quot;The Fleuron&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Fleuron</a> in <a href="/node/add/wiki?edit%5Btitle%5D=1926" title="Create node &quot;1926&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1926</a>. But by then the Garamond (or, as Goudy would have it, Garamont) name had&nbsp;stuck.</p>
    <p>Meanwhile there were and are other revivals (of which the most well-known is <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a> Garamond, designed by <a href="/node/16060" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Robert Slimbach</a> (<a href="/node/add/wiki?edit%5Btitle%5D=1989" title="Create node &quot;1989&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1989</a>)) which <em>are</em> based on Claude Garamond’s&nbsp;type.</p>
    <p>It is not hard, when the typefaces are seen side-by-side, to identify differences between the various Garamonds, and to perceive (broadly) two different “families”; but the similarities are quite striking too. Generally choice depends on aesthetic preference rather than historical correctness. These are usable typefaces with a slight air of conscious refinement that appeals to some and repels&nbsp;others.</p>
    <p><strong>Based on Garamond</strong>: <a href="http://www.linotype.com/1500/stempelgaramond-family.html">Stempel Garamond</a>, <a href="http://www.myfonts.com/fonts/linotype/adobe-garamond/regular/testdrive.html?s=Claude+Garamond&amp;p=48">Adobe Garamond</a>, <a href="http://www.linotype.com/505/granjon-family.html">Linotype Granjon</a>, <a href="http://www.linotype.com/1436/sabon-family.html">Sabon</a>.</p>
    <p><strong>Based on Jannon</strong>: <a href="http://www.myfonts.com/fonts/agfa/garamond/mt/testdrive.html?s=Jean+Jannon&amp;p=48">Monotype Garamond</a>, <a href="http://www.myfonts.com/fonts/linotype/simoncini-garamond/simoncini-garamond/testdrive.html?s=Jean+Jannon&amp;p=48">Simoncini Garamond</a>, <a href="http://www.myfonts.com/fonts/linotype/garamond-3/garamond-three/testdrive.html?s=Jean+Jannon&amp;p=48"> <span class="caps">ATF</span> Garamond</a> (Linotype Garamond 3), <a href="http://www.p22.com/lanston/products/garamont.html"><span class="caps">LTC</span> Garamont</a>, <a href="http://www.myfonts.com/fonts/storm/jannon/antiqua/testdrive.html?s=Jean+Jannon&amp;p=48">Storm Jannon&nbsp;Antiqua</a></p>
    <p>Note that <a href="/node/12609" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jan Tschichold</a>’s Sabon, though not called Garamond takes Garamond’s types as its starting&nbsp;point.</p>
    <p><a href="http://www.myfonts.com/fonts/linotype/itc-garamond/book/testdrive.html?s=Tony+Stan%3F&amp;p=48"><span class="caps">ITC</span> Garamond</a> is very much a creature of the 1970s (designed by Tony Stan). It is a type which tends to arouse strong feelings (not usually good ones). But even its supporters accept that this typeface, with its large <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-height</a> is a Garamond only in&nbsp;name.</p>
    <p>Because of the profusion of garamond-like typefaces and the early confusion around its naming, it is common to see a typeface referred to as a garamond, the way we might categorize a typeface as a blackletter or a&nbsp;script.</p>
    <p>In addition to Sabon, <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=1&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=verdigris&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=I+%5Bheart%5D+Typowiki">MvB Verdigris</a> is another contemporary face that could be called a&nbsp;garamond.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/1920">Which Garamond? Typophiles Recommend:</a><br><a href="http://typophile.com/node/12216">Garamond Premiere Pro</a><br><a href="http://typophile.com/node/33124">Garamond Anyone?</a><br><a href="http://typophile.com/node/33652">…And Garamond is Great Why?</a><br><a href="http://typophile.com/node/37259">Garamond Is Not&nbsp;Garamond</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.underconsideration.com/speakup/archives/001714.html">Speak Up: Claude Garamond Promotes His Old Style Typefaces</a><br><a href="http://www.fonts.com/AboutFonts/Articles/fyti/09-01-2004.htm">f{y}ti: A Garamond by Any Other Name</a><br><a href="http://www.lostmag.com/issue6/garamond.php"><span class="caps">LOST</span> magazine: Claude&nbsp;Garamond</a></p>
