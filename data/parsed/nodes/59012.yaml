      <p>Often buttons are made with bitmap fonts, but I didn’t find these at Dafont among their nearly 500 bitmap fonts. If it’s not a bitmap font, it’s so small it’s hard to get a good idea what to look for.</p>
      <p>- Mike Yanega</p>
