    <p>hey all.</p>
    <p>i thought you guys may have some good thoughts regarding my thesis, so here i am.</p>
    <p>basically, i think it’s impossible to remove the linguistic implications from a letterform and see it as a random shape.  granted, there are certain criteria you’d have to follow such as not counting dingbats etc.  im talking straight up, looking at a letter “A” and thinking “i dont get it.”  of course, this is can be influenced by context, scale, etc. also what happens when you enhance the basic form a letter with dimension, time, etc, where youre arent changing the basic structure, just adding to it. but i guess what im wondering is if you have any initial thoughts or resources you think i should check out.  anything would be appreciated.  if youd like some more in depth info on what im working on, you can contact me directly if you want or if everyones ok with some lengthy posts i can respond on here.</p>
    <p>thanks a lot.</p>
