      <p>apologies if i glaze over some thoughts, ive been going over this for a while.</p>
      <p>ok so when you look at a letter A, you will only see it as a letter A, whether it’s being used in text or as a design elements.  you’ll still understand that what you’re looking at is a letterform.  the only kink in that is adding dimension, texture, etc. to the shape.  like for example, looking at a 3-dimensional A from the top.</p>
      <p>also, i guess i should add the relevance ie. why i’m even asking.</p>
      <p>our capacity to read letterforms has flourished through the inundation of messages we receive and the proliferation of typefaces that challenge traditional letterform shapes.  im not saying they all look good or anything, but our understanding of these shapes has been enriched.  even with things like “wheel of fortune” we seek out letterforms.  seeing a bunch of sticks on the ground and thinking “that looks like a K.”  we’re just raised to search for messages.</p>
      <p>this all leads to a broader range within which we can deliver meaning and distress type and still create clear messages.</p>
      <p>at what point do these letterforms cease to retain their linguistic value?  i believe this only occurs when elements are added to the basic shape of what defines letterforms.</p>
