  html: <p>Hello <br> <br>I'm in grad school and I'm doing a project which is a movie poster for an invented mid-1960s secret agent / space travel and alien invasion movie (inspired by the old Gerry Anderson British tv show "UFO"). <br> <br>Does anyone have suggestions for an appropriate type face for the title? I want something that evokes a 60s version of the future, with an element of swinging groove to it -- but not psychedelic or hippy-ish. <br> <br>I was thinking about Typeco's Glyphic Neue (<a href="http://www.myfonts.com/fonts/typeco/glyphic-neue/" target="_blank">http://www.myfonts.com/fonts/typeco/glyphic-neue/</a>) <br>and also Pump (<a href="http://www.myfonts.com/fonts/linotype/pump-2/" target="_blank">http://www.myfonts.com/fonts/linotype/pump-2/</a>) <br>which I like but it may be a little too 1970s / disco-ish. <br> <br>Any thoughts? <br> <br>Thanks.</p>
