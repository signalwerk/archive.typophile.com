      <p>Sorry, I wasn’t online yesterday, so I have to catch up…<br>
      Some comments:</p>
      <p>&gt;Hrant:<br>
      &gt;I mean, really, how could the arrangement of parts made by other people into something static ever be as rewarding as the making of a useful, self-contained little machine that is a font?</p>
      <p>If you design a book and you try to make all the different levels of information - of linear reading and non-linear reading, of cross-references, footnotes, of captions, etc. - really working, then you also design a useful machine. The same applies for a signage system and for any serious (typographic) design job that tries to be more than just superficial decoration.</p>
      <p>&gt;Cursusductus:<br>
      &gt;Let’s open the eyes to another interesting schools, please.<br>
      There is also a type design course at the Atelier Nationale de Recherche Typographique in Nancy, but I hardly know more than the name… </p>
      <p>&gt;People who studied at Reading, can you tell us something more?<br>
      In Reading, calligraphy is important to understand the structure of the letter, but probably it is less important when it comes to actually design of the letters. This is my perception of having studied there, but other Reading students may have come to different conclusions. Generally people are encouraged to design also non-latin typefaces. Writing papers (essay, dissertation) is also part of the assignment. </p>
      <p>&gt;Paul Cutler<br>
      &gt;Academia often ruins creative endeavor.</p>
      <p>Sorry, I disagree. Of course, learning about the history of letterforms does not help you immediately to design a better ‘d’ or ‘s’. The ability to form well shaped letters is not so much a matter of controlling the movements of your hand (or your mouse?) as it is a matter of learning how to see, how to look at letters. So the most important thing is to train your eye, and this is best done by trying - and probably failing (failure is an important part of the learning process, probably more important than the all too easily achieved success) - to design letter forms, not by reading about them. But type design is also embedded in a broader cultural context, and this is where theory becomes important again. For me, design is nothing but the visual representation of a series of (hopefully well-informed) decisions about about how to structure and organize content. I do not think that ignorance of theory helps anyone to become a better designer.</p>
      <p>&gt;tbiddy<br>
      &gt;sometimes new developments can make old practices obsolete…<br>
      For this reason, I think design schools must  not rely too much on teaching computer programs, but they should teach design skills. Computer programs come and go. Good designer know what they want the computer program to do in order get a specific result, instead of producing easily predictable work by just using pre-defined program features.<br>
      People who are just applying the last photoshop-filter are not much more than decorators. The same applies by the way also to typographers who always use the trendiest type (sometimes the might have even enough taste to choose a really good typeface), but who do not take the pains to analyze the actual requirement of a specific job… This work is actually bound to be an ‘arrangement of parts made by other people into something static.’</p>
    html_clean: |-
