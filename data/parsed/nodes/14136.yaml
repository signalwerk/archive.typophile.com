      <p>CMU, when I was there from ’97–’01, excelled at the mental and conceptual aspects of design, but didn’t wow me in the technical and craft areas. It’s not that they didn’t make an effort, but it wasn’t satisfactory in my mind. Everyone seemed to expect someone else to cover it.</p>
      <p>That being said, because the CMU School of Design is part of the larger university, it’s an incredible place to be, particularly for the self-directed. The people, facilities, faculty, and community are a very rich resource.</p>
      <p>If you want to learn to design type specifically, you may not want to go there. But, as Chris L. said, Christian would know best about that.</p>
