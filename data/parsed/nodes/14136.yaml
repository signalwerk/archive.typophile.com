      <p>There’s really a fine line. There seemed to be a few types of students to me. One is a student who accepts whatever he/she is told because they feel that the professor has more knowledge in the subject and should be always listened to. Another student questions what the professor says and asks why and challenges both the professor’s viewpoint and his/her own. I fell in the later category. While I feel I was respectful in my questioning of ideas (wisdom should never be underestimated) road number two often gets you less respect. </p>
      <p>In the later example I feel the student learns less because they question nothing, they learn less. Anyone can regurgitate an idea, but it takes thought and questioning to produce something original. At my recent alma mater The Pratt Institute (Manhattan) I felt that the students that mirrored the “cool” design in annuals and made the slickest looking projects got the most recognition. With a few exceptions, concept seemed merely an afterthought. </p>
      <p>Sometimes methods become archaic and are not practical by today’s standards. This is something that I often combated. Theory and history are important elements to learn, but sometimes new developments can make old practices obsolete...like using new technology for example. Many of my professors from the golden age of design rejected such modern conveniences as the computer and saw it is the death of the field that many were once prominent in. Whenever a human being reaches a point where they feel they have nothing left to learn, they become obsolete.</p>
