      <p>Unfortunately there are some type designers who have no idea what typography is. Most of the successful type designers I have encountered ultimately realize that type must be used by an end user, thus typography. Although they can be separated, the relationship should be that of siamese twins. As we said at Typecon, type cannot exist in a vacuum. It relies on very specific contexts: publication, identity, video, etc....not merely a speciman for marketing to other designers. Type doesn’t exist unless it meets the public.</p>
      <p>I recently finished the Type &amp; Media course at the KABK. If strong cultural tradition (Dutch) coupled with the tremendous possiblities of backend technology are important to you then I would go to the Hague. I may be wrong, but I believe they have the largest number of teachers who are actually practicing type designers.</p>
