    <p>Hi, folks!<br>
    I was wondering how typography is included in graphic design courses, specially at the best design schools. I teach digital typography and typographic design at Barcelona Univesity, Spain.<br>
    First I would think about the top ten schools, in order to study their programs.<br>
    Here in Europe I would say Reading and KABK, but some help would be apreciate.<br>
    Thanks,</p>
    <p>Daniel</p>
