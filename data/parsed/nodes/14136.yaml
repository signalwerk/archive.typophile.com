      <p>The promised tangent:</p>
      <p>Daniel, the main reason chirography is flawed for text face design is that it creates the black bodies through “movements” (GN’s “moving front”, with the elaborations of translation, rotation and pressure), and this has nothing to do with the act of reading (the main point of typography, no?) which deals with black-white relationships. Basically, making type by thinking primarily about the border between the black and white is the ideal, and chirography confuses this.</p>
      <p>Like I said, I’ve already written a lot about this on Typophile, and don’t want to clutter this thread. Which doesn’t mean I don’t want to discuss it further - quite the contrary - just not here. But I didn’t want to seem to spurn you, hence the above elaboration.</p>
      <p>hhp</p>
