      <p>I think we have to give students credit for deciding what to accept while in school and what to reject later. It is fair to give something a good effort as a student so that they have experienced it before rejecting it. We all have had both dogmatic teachers and those open to dialogue.  I have learned from both but sometimes did not see the value (or the folly) until years later. Imagine having a professor who says path “A” is always a mistake and path “B” is always the choice to take. If we agree with him, life is simple (at the time). If we don’t agree, we are in for a bumpy ride.  Later, we might have other life experiences which causes us to reverse positions.  What I am saying is that a bright student is not condemned to a life sentence of agreement or opposition to what they experienced in school.</p>
