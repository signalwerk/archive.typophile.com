      <p>&gt;You imply that theory must be learned from a professor<br>
      Also reading books might help   ;)</p>
      <p>I do not think that theoretical understanding can only be obtained by formal education. The most important prerequisite is the curiosity of the student. It is more important to ask intelligent questions than to find too fast and ready made answers. Academic or formal (theoretical) education might only help you to formulate your questions more stringent. Probably your curiosity will be more focussed and therefore more ’fertile’. And if you are lucky, the place where you study is providing an atmospere which encourages curiosity. But that’s about it. If you are not curious enough, if you think you already know it all, then the best formal education won’t help you. </p>
      <p>There is no guarantee that theoretical understanding will have any direct positive influence on the (aesthetic) quality of your design. As far as the formal or aestetic side of design is concerned, the arbiter is the eye, and the eye needs to get educated by training, by doing. Theoretical explanations do not help much at this point. But design is embedded in a wider field (there is such a thing as society) and has also functional aspects. To get this aspect of design right, you can not only rely on your eye. You have to be able to ask the right questions and come along with conclusions.</p>
      <p>The third important part (apart from the training of the eye and of the theoretical understanding) in design education is in my view to teach the students design methods. This should help students to develop ideas further and to not just to add one potential solution to another. It is important that the student learns how to develop ideas ans turn a potential design solution to an actual solution. For this reason I mentioned Basle as an extraordinary example of the teaching of design methods, especially for typographic design. Without the teaching of structure, the danger of design being not more than superficial decoration is always at hand. But on the other hand, the teaching of methods is also a quite tricky point, because there is always the danger that after a while people tend to get lazy and the methods might turn into dogmas or into all to easy recipies. A school might produce ony clones of a specific style.</p>
      <p>By the way, some of the best designers I know had no formal qualification at all. </p>
      <p>I just think that the notion that all talent is so by nature, birth or destiny and that thinking only drives away your muses is simply bullshit. It just cuts you from the opportunity to learn and is an excuse for intellectual lazyness.</p>
      <p>You can be pretty sure that Miles Davis was quite curious and eager to learn. </p>
      <p>Yes, the trumpet is always the same, but there is more than one way to how play it.</p>
