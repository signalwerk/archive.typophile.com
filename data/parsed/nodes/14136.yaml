      <p>&gt;how typography is included in graphic design courses,</p>
      <p>I’ve taught at the B.Des course at York University, Toronto.<br>
      Typography is well integrated, from letterpress to type design.<br>
      In fact, it was a special requirement when the faculty moved into a new high-tech building in 2003, replacing studios with computer labs, that provision also be made for all the old metal type presses and their volatile chemicals. So students can get ink on their fingers.<br>
      The course I taught to 3rd-year students involved designing and making a digital typeface, creating a poster for it, and and a 15-second animation using it.</p>
      <p>Design professor David Scadding is the man most responsible for York’s typographic thoroughness. Students are impressed:<br>
      <a href="http://www.ratemyprofessors.ca/ShowRatings.jsp?tid=101521" title="http://www.ratemyprofessors.ca/ShowRatings.jsp?tid=101521">http://www.ratemyprofessors.ca/ShowRatings.jsp?tid=101521</a></p>
