      <p>&gt; there are some type designers who have no idea what typography is.</p>
      <p>Very true. Part of it is that some type designers don’t <strong>want</strong> to know, because they know they’re not good at it (the two tasks require very different skills) or they just find it boring.* The good news is that as long as a type designer realizes the importance of the user (which is sometimes the reader more than the graphic designer, for example in the case of newspapers) he can still manage to make good fonts; in fact I think there’s a certain benefit to being somewhat detached from the actual usage of fonts - you can look beyond current practice and maybe mark some real progress. So I think the main factor is respecting the user, as opposed to merely knowing the mechanics of current practice.</p>
      <p>* I mean, really, how could the arrangement of parts made by other people into something static ever be as rewarding as the making of a useful, self-contained little machine that is a font? I can’t dig it.</p>
      <p>My impressions of KABK versus Reading is that the former is better for quickly learning to make high-quality mainstream fonts of a certain -admittedly attractive- style, while the latter is better for theoretical groundwork and non-Latin design. As you might be able to tell, I personally lean more towards Reading - but that’s just me. Maybe it’s partly because I feel more Armenian than Dutch... Really, isn’t some certain thing lost when let’s say a South American is taught to make Dutch type? Especially when he’s an impressionable student and he’s -unavoidably, unwittingly- made to <strong>prefer</strong> Dutch type? I myself prefer to learn the underlying secrets, not how to elaborate a certain visual style.</p>
      <p>hhp</p>
