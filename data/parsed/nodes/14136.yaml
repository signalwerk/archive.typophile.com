      <p>There is a big difference between typography (the use of typefaces)<br>
      and type design (the creation of typefaces).</p>
      <p>I did the typeface design course in Reading, and I can really recommend it.</p>
      <p>Decades ago the best school for typography was Basel,<br>
      because they taught both attention to detail (microtypography)<br>
      and a systematic approach to design.<br>
      Now it seems that there are many universities and schools<br>
      where a lot of good typographic designers/typographers are teaching,<br>
      but often they stay only for a certain time, and afterwards these schools<br>
      fall back into mediocrity.</p>
