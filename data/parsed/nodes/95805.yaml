    html: |-
      <p>What are the texts? At what size will the type be set? Are you using the text font of Storm's Baskerville, or the display font?</p>
      <p>The Arabic script is traditionally writting with a broad nib reed pen, and the typical stroke modulation of the letters expresses this, as do most typefaces. Baskerville's stroke modulation is based on the flexible split nib, so my first question to you would be how committed are you to using Baskerville? There are a lot of Latin types that would easily harmonise with a range of Arabic types, and almost no Arabic types that harmonise easily harmonise with Baskerville. If you were to pick a Latin type with a stroke modulation modelled on a broad nib, e.g. anything from Italian romans to French mannerist or Dutch baroque types, or any number of recent designs, you would find your Arabic choice much more flexible and would be more easily able to select companions based on relative colour on the page.</p>
