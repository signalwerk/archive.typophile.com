    <p>Hello,</p>
    <p>I am currently working on a project which involves setting 20 short texts in English and in Arabic.<br>
    The texts are printed on big panels (107x72cm) and the Arabic text will sit under the English text.<br>
    I am using Baskerville Pro (by Storm) and was wondering which Arabic font would match the typeface?</p>
    <p>Your help would be much appreciated.</p>
    <p>Thanks!</p>
