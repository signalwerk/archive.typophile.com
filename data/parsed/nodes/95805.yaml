    html: <p>If we define Baskerville as a model of writing with high contrast in stroke and with expansion of contrast (as Noordzij explains it), and we don't think about how it is produced using a medium, we could come up with a similar style in arabic writing, which one of them is Nastaliq. Thickness of stroke in Nastaliq is controlled with pen pressure and tilting the pen. It might seem that the style could not fit with Baskerville but there is another typeface which is based on this discipline (expansion of contrast) and also could be matched with a latin typeface like Baskerville and that is Harir typeface.</p>
