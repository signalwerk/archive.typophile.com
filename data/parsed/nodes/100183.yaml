      <p>I agree that {opbd} could probably be dumped from the spec. Seems completely unnecessary.</p>
      <p>The UI could present a single toggle for turning “Optical Bounds” on or off. Then it seems to me that it would be the responsibility of the app to coordinate with the text-align attribute assigned in order to determine whether to call {lfbd}, {rtbd}, or both.</p>
