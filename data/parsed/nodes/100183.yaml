    html: |-
      <p>Good questions. </p>
      <p>Does InDesign’s Story &gt; Optical Margin Alignment respect {opbd} if present? Or does it only work off an internal algorithm (presumably related to the optical kerning algorithm)?</p>
      <p>Do any of the common tools know how to compile {opbd} and related tables?</p>
      <p>I, for one, am a little unclear how you’d write such a feature. I suppose the syntax depends upon the tool doing the compiling. </p>
      <p>The related {lfbd} and {rtbd} seem a little more straightforward: for a target glyph you provide two GPOS values. Presumably, for {lfbd} the XPlacement and the XAdvance adjustments would be equal; and for {rtbd} the XPlacement adjustment would always be zero, with adjustment only to XAdvance (i.e., the right sidebearing). So, practically speaking, the compilation of these feature could probably be extrapolated from a single provided value in each case. </p>
      <p>But do GPOS values get written into {opbd}, or is it just a coverage table that calls either {lfbd} or {rtbd}?</p>
