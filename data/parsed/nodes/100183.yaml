    votes: null
    html: "<p>We considered this for both the ClearType Collection fonts and for Gabriola, but in both instances we ended up not pursuing it for a variety of reasons. The lack of any existing application support would mean that testing would be problematic (InDesign's optical margin alignments does not use this feature; as I recall it is based on one of the Hz algorithms that Adobe bought from URW), and none of the existing GPOS development tools provided for multiple-line, left- and right-aligned proofing, which is what one would need in order to be able to make the necessary judgements. As Kent's message indicates, the feature descriptions are somewhat confused with regard to {opbd}. My own feeling is that there is no reason for that feature to exist at all: what you need is the left and right GPOS features with single adjustments to width and positioning, and then application of these would be an app level layout function. There isn't any need for the intermediary {opbd} feature, and I would favour dumping it from the spec and rewording the description for the {lfbd} and {rtbg} features to specify that a) applications are responsible for working with layout engines to determine left and right line termini and applying the appropriate GPOS feature, and b) that if appropriate apps should provide a unified UI for turning on and off both features together (this would be akin to InDesign bundling multiple ligature features under a single UI). In CSS, it would make sense to have a single high-level tag for optical margins, although lower-level OTL tag use would permit left- or right-only margin alignment.</p>"
