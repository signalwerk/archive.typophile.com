  html: <p>Would anyone know where I may download a free font viewing program, nothing fancy just to view all fonts on my system. For Windows. <br> <br>Thanks, <br>David.</p>
  html_clean: <p>Would anyone know where I may download a free font viewing program, nothing fancy just to view all fonts on my system. For Windows. <br> <br>Thanks, <br>David.</p>
