    html: "<p>FontLister lets you view all of your fonts, edit the sample text that each font is displayed in, get a close up of the font's character sets etc. <br>Its quick and easy to use. <br> <br>Version 2 is free from: <br><a href=\"http://www.theill.com/fl/download.asp\" target=\"_blank\">http://www.theill.com/fl/download.asp</a> <br> <br>Version 3 is free to download, but $5 to use for more than 30 days - it doesn't stop working or become limited in features after 30 days, which is even more reason to cough up the miniscule fee! <br> <br>(I've had version 3 for ages, and thought it was freeware until I went to the Help screen to get the details for this post, so I'm just off to pay for it now). <br> <br>Software for the cost of a pint and a packet of crisps - you just have to support it really.</p>"
    html_clean: "<p>FontLister lets you view all of your fonts, edit the sample text that each font is displayed in, get a close up of the font's character sets etc. <br>Its quick and easy to use. <br> <br>Version 2 is free from: <br><a href=\"http://www.theill.com/fl/download.asp\" target=\"_blank\" class=\"link-external\">http://www.theill.com/fl/download.asp</a> <br> <br>Version 3 is free to download, but $5 to use for more than 30 days - it doesn't stop working or become limited in features after 30 days, which is even more reason to cough up the miniscule fee! <br> <br>(I've had version 3 for ages, and thought it was freeware until I went to the Help screen to get the details for this post, so I'm just off to pay for it now). <br> <br>Software for the cost of a pint and a packet of crisps - you just have to support it really.</p>"
