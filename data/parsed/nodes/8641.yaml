    html: "<p>This might be interesting, because you find a lot of font-information in there: <br><a href=\"http://neuber.com/typograph/index.html\" target=\"_blank\">http://neuber.com/typograph/index.html</a> <br>As far as I remember there is a free 30-days-trial period. <br> <br>And of course there is Adobe's ATM Light: <br><a href=\"http://www.adobe.com/products/atmlight/download.html\" target=\"_blank\">http://www.adobe.com/products/atmlight/download.html</a></p>"
    html_clean: "<p>This might be interesting, because you find a lot of font-information in there: <br><a href=\"http://neuber.com/typograph/index.html\" target=\"_blank\" class=\"link-external\">http://neuber.com/typograph/index.html</a> <br>As far as I remember there is a free 30-days-trial period. <br> <br>And of course there is Adobe's ATM Light: <br><a href=\"http://www.adobe.com/products/atmlight/download.html\" target=\"_blank\" class=\"link-external\">http://www.adobe.com/products/atmlight/download.html</a></p>"
