      <p>Most modern version of Baskerville are not close to his original from 1757....for a good accurate version that really looks like what Baskervile printed in 1757 go to for the "Baskerville1757" typface....<br>
      <a href="http://marketplace.veer.com/type/FOT0000053" title="http://marketplace.veer.com/type/FOT0000053">http://marketplace.veer.com/type/FOT0000053</a></p>
