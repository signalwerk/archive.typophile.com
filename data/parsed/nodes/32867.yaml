    <p>Columbus Ohio cyber-company Skreened.com has made available a series of T-Shirts devoted to great typefaces.</p>
    <p><a href="http://skreened.com/" title="http://skreened.com/">http://skreened.com/</a> is the brainchild of Ohio State University Visual Communication Design alum Daniel Fox, and the company specializes in producing made to order T-shirts from a large variety of available designs.</p>
    <p>Skreened also allows anyone to create their own online "store" to sell their designs, which is what I (design professor Paul Nini) have done with the Great Typefaces T-shirt Series, available at <a href="http://skreened.com/PaulNini" title="http://skreened.com/PaulNini">http://skreened.com/PaulNini</a></p>
    <p>There is one group for sans-serif designs, and another for serif faces. Coming soon will be a group for decorative faces. So, if you feel so inclined, this is your chance to wear your favorite typeface on your chest.</p>
    <p>Skreened uses only American Apparel products - <a href="http://www.americanapparel.net" title="http://www.americanapparel.net">http://www.americanapparel.net</a>  - in a variety of styles and sizes. Suggestions for any faces not currently included are welcome.</p>
