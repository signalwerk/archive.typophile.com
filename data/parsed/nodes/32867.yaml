      <p>Reinhart Butter is indeed still there, but will be retiring soon, after 30+ years of teaching. We expect him to stick around as an emeritus faculty, however. </p>
      <p>Peter Megert did "retire" some years ago to focus on professional practice, but he has been teaching with us part-time since then. We're very glad to have him. It's a great experience for our new visual communication design students to have their first typography course with someone who practiced in Switzerland in the 60s, was hired by Paul Rand to work at Westinghouse, etc.</p>
      <p>Will Kunz was at OSU as a guest instructor in the 70s, when we had a large number of well-known guests on a regular basis. Unfortunately the funds for such things dried up years ago. We do still have guests, but now it's just for a day ot two, as opposed to a whole academic term.</p>
      <p>Finally, the Dept of Design will celebrate its 40th anniversry in 2008. You're invited to join us for the various events.</p>
      <p>Paul Nini<br>
      Dept of Design<br>
      Ohio State Univ</p>
