    html: |-
      <p>looks cool. here's my two cents:</p>
      <p>the S looks like it needs to be heavier and wider at the bottom. your E seems upside-down and the inside stroke is a little thin. The B is looking a little small (could be a bit wider). to make it more balanced, you might want to match the counters of the B to the those of the O,D,N, and G.</p>
      <p>a good resource (that someone recently told me about) is:</p>
      <p><a href="http://typeworkshop.com/index.php?id1=type-basics" rel="nofollow">type basics</a></p>
      <p>--------------</p>
      <p>nc</p>
