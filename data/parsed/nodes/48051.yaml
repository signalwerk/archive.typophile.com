      <p><a href="http://www.typophile.com/node/37248" title="http://www.typophile.com/node/37248">http://www.typophile.com/node/37248</a> (note the link to MyFonts)</p>
      <p><a href="http://www.typophile.com/node/3895" title="http://www.typophile.com/node/3895">http://www.typophile.com/node/3895</a></p>
      <p><a href="http://ieeexplore.ieee.org/Xplore/login.jsp?url=/iel4/1123/7851/00332968.pdf?arnumber=332968" title="http://ieeexplore.ieee.org/Xplore/login.jsp?url=/iel4/1123/7851/00332968.pdf?arnumber=332968">http://ieeexplore.ieee.org/Xplore/login.jsp?url=/iel4/1123/7851/00332968...</a></p>
      <p>You say that the project involves an actual seven segment display. Given that the segments are what they are, have you considered playing with the speed and sequence in which the various segments are lit up? You'd have to construct your own driver circuit instead of using an off-the-shelf BCD decoder/driver (that's easy to do) and interface it to some kind of sequencer -- your computer, for example. You might get some interesting visual artifacts.</p>
