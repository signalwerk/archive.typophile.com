    <p>Does anyone have any knowledge of work that's been done to try and innovate past the typical look of 7-segment display systems. Example of typical 7 segment display attached:</p>
    <p>This may be a case where the technology necessitates a very limited range of style, but I was hoping to find some example of this display format being pushed past it's familiar ubiquitous look. It seems the only variations out there are whether the whole character is vertical or oblique and the thickness of the stems.</p>
    <p>I have looked in the FSI Font Book, but even the similar typefaces there (LCD, Quartz) offer nothing new stylistcally and are not even consistent with the segment limitations. (meaning because they are designed to only mimic real segemeted displays.. they do not actually limit themselves to the same restriction for all characters)</p>
    <p>This is for a project that is using an actual LCD segmented display so I can't do any cheating. Any insight, ideas, or links would be much appreciated.</p>
