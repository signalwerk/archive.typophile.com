      <p>There does seem to be some variation in the terminals of the segments: slightly rounded or meeting at different angles. That's pretty much the extent of the evolution I've seen.</p>
      <p>Does it have to be limited to seven segments? A 14-segment display could show a larger range of stylistic variation, both in the segment design and in the glyphs:</p>
