    html: "<p>Wow. I leave for a cigarette and miss all the great debate. I gotta quit smoking ;-) <br> <br>Unfortunately, I can't claim to know much about Greek - my answer came from Donald Anderson's <i>Calligraphy: the art of written forms</i>, p. 37, Dover Press. Just good timing really. I happened to be reading it the other day. <br> <br>So, next question:  <br> <br>There are five (typically used) typographic or punctuation characters in Thai. I suppose some are used more than others. Name the 5 and give their function. <br> <br>Cheers. <br> <br>ps: I'm not sure if this violates Rule 9? If so, I'll pose a different question.</p>"
