  html: |-
    <p>Hello Typophile community,<br>
    Could anybody give me a hint on a FontLab issue: when I adjust the kerning in Kerning Pairs regarding a specific couples in a font, the change doesn't apply into the Illustrator file (or InDesign) file where this font is in use. I'm designing a Cyrillic font and took into consideration all possible Kerning Pairs in the font but these pairs doesn't look properly kerned in Illustrator. Do I make something wrong when applying "Generate Font" command or should look elsewhere.<br>
    Thank you very much in advance.</p>
