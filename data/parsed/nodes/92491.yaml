    html: <p>I don't know if this is still the case, but it used to be—at least in some applications—that your font had to include one other feature besides<strong> kern</strong> to get kerning to work.</p>
    html_clean: <p>I don't know if this is still the case, but it used to be—at least in some applications—that your font had to include one other feature besides<strong> kern</strong> to get kerning to work.</p>
