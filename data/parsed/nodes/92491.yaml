    date: 2012-04-25T23:55:00
    date_raw: 25 Apr 2012 — 11:55pm
    votes: null
    html: |-
      <p>Also, if you're making adjustments on the fly, you may need to clear your font caches for changes to take effect (how this is done will depend on your OS, but a google search should provide the necessary info).</p>
      <p>And depending on how your FL preferences are set, you may need to manually regenerate your kern feature from the OpenType menu (available in the OpenType Pane).</p>
      <p>André</p>
