    html: |-
      <p><cite>Any other feature will work, </cite></p>
      <p>Not quite true. In some applications programs, you need a substitution feature --  a gsub feature -- before the gpos features are applied. liga is, of course, a substitution feature. So too is frac (fractions). But capital spacing, for example, is not.</p>
