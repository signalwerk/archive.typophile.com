  html: <p>How come character map doesn't show me alt codes for every glyph? And what's the logic behind the numeration?</p>
  html_clean: <p>How come character map doesn't show me alt codes for every glyph? And what's the logic behind the numeration?</p>
comments:
  - id: 508374
    user: 1250
    date: 2012-05-02T10:36:00
    date_raw: 2 May 2012 — 10:36am
    votes: null
    html: |-
      <p>I think those codes are only for ASCII-8 characters. Note that the leading zero is a "trigger", so you really only have 1000 possible codes anyway. But only 0 to 255 are implemented. In fact try Alt-0321: you get "A". Because 321 = 65 (the code for "A") plus 256. So it's just cycling through (like how 370 degrees is the same as 10 degrees).</p>
      <p>And logic?!  :-)</p>
      <p>hhp</p>
