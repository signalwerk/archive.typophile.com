    html: |-
      <p>Microsoft. Logic. Choose one.</p>
      <p>The initial zero is a trigger allright, but for the incoming strokes to be interpreted as Windows-1252 or Unicode (on later and chromier Windowses) instead of CP437 or whatever your local DOS codepage is.</p>
      <p>The zero may not be needed on DOS-less Windows (anything after XP, I think), but I don't know for sure.</p>
