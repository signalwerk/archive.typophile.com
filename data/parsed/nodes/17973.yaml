    html: |-
      <p>you guys are totally right about the teeny size. but that's really the only decent sample we can dig up. i apologize.</p>
      <p>whatever typeface it is, it was commonly used from the 50s to 70s in the US. i've seen it on a lot of old print work, doors and signage from the era. uniform thickness in stroke, non-angled terminals, generally identical lengths for arms. if anyone has some hunches, then it's probably the obvious.</p>
      <p>it reads "TELEVISION FRANÇAISE".</p>
      <p>thanks again,<br>
      jaan</p>
