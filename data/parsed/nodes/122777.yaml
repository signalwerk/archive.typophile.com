  html: |-
    <div class="node-spam-content"><p>A lot of people who are not from Britain, usually say 'England' to refer to Britain. Dutch people do this all the time. I usually respond with "Only in England, or also in Scotland and Wales (and Northern Ireland)?" Most people react confused.<br>
    It is very easy to understand the different terms. </p>
    <p>Great Britain (island) is England, Wales and Scotland.<br>
    The United Kingdom (sovereign state) is Great Britain plus Northern Ireland. The abbreviation 'Britain' is used to refer to both the island and the state. Not complicated at all.</p>
    <p>I wonder what people from Britain think when they hear foreigners say 'England' instead of Britain.</p>
    </div>
