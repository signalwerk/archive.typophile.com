      <p>Hi everyone,</p>
      <p>Thank you very much for all the comments! They are all helpful, and I now know what to do next.</p>
      <p>johnnydib: thank you for your opinion on proportions of the characters. I will do some adjustments on these.</p>
      <p>eliason: the reason why the 'w' is 'broken' but not the 'W', is that in the lower case the lines cross each other, while in the upper case the lines 'just meet'. I guess this means that maybe the 'Y' and the 'G' shouldn't have break(?) I also tried to set the 'T' with a break, but didn't think this looked good at all. Have tried a lot of different options with the breaks, but am having a hard time in making up my mind on which ones I like and which ones I don't like.</p>
      <p>altaira: I have done testings in a lot of sizes, and I try to have a high focus on the small sizes. The gaps works down to 8pt size. Of course they do not come off as 'hugh gaps' at this size, but one can still see the impression they give on each character.</p>
