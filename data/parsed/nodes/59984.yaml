    html: |-
      <p>It's very pretty. I like the cultural background and how you integrate it into the type design! What I wonder is if this prettiness will come out, and work, at "body copy" sizes. Things like the tail of the "Q": I can see that looking smashing in a headline, but will (like Craig said) the gaps even come out at small sizes, and then what will they *do*? Will they look distracting (adding a bit of "white noise"), or will they help the glyph? Will they maybe – in this case – make the "Q" more confusable with the "O"?<br>
      The way I understand things (and I'm a rather new type designer, so take with a grain of salt), text face design is not just about making glyphs look beautiful up close – it's also very much about functionality. So if you're really wanting to target text sizes, prepare to do a *lot* of testing at your target point sizes; and you might have to sacrifice some solutions that look good up close if they don't work at small sizes :-/ – something that doesn't have to happen nearly so much to display/titling fonts, which enjoy much more "creative freedom".</p>
