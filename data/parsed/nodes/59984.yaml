      <p>Liker veldig godt mellomrommene! Rosemaling-inspirasjonen ville definitivt vært spennende å se som en displayskrift. </p>
      <p>Det er et par ting du burde ta tak i her, før du går videre:<br>
      • Bredde – ‘s' ‘t' og til en viss grad ‘a'  virker smale, ‘r' ‘v' ‘w' ‘x' ‘y' virker litt brede. (Når du tegner ‘r' er det veldig smart å løsrive seg mer fra ‘n'-kurven. Den burde være litt brattere, slik at du unngår et stort hvitt "hull" nede til høyre. Det kan være smart å dra den høyre seriffen litt ut også.)<br>
      • Avslutningene på ‘f' og ‘j' stjeler veldig mye oppmerksomhet.</p>
      <p>Lykke til! Gleder meg til å følge dette videre.</p>
