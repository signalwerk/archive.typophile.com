    <p>I am currently developing a typeface for body copy. This is my first typeface design, and it would therefore be great to have some critique/feedback from other typeface designers.</p>
    <p>The shapes of the characters are inspired by Norwegian national costumes, and Norwegian 'rose paintings', and the main purpose of the typeface is for use within the Norwegian written language.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fonttest_6378.jpg"></div><p></p>
