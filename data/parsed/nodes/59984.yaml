      <p>I found the "v" "x" "y" and "z" to be a little wide.<br>
      The uppercase S is a little narrow. Try to redraw it make it more similar to the C.<br>
      The G and the M are also a little narrow in my opinion.</p>
      <p>Upon close inspection the thicks and thins in the capitals don't seem consistent but overall they look nice. However I'm worried about the arms on the T and E I'm afraid they'll look too thin in small point size.</p>
      <p>I don't know the whole thing looks cool I love the "C" "c" "g" and "r" as drawings. I also liked the comma and the dots on the i and j a lot.</p>
      <p>Good works show us better capitals next time.</p>
