    html: <p>Bethany is right. Most text fonts contain oldstyle and lining figures. So I would first look for the typeface that is right for your project. <a href="http://fontfeed.com/archives/figuring-it-out-osf-lf-and-tf-explained/">More about figurestyles.</a></p>
