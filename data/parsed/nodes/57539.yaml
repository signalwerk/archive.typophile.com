      <p>I think you’re looking for Oldstyle numerals. Most professional fonts should have them, especially serif fonts (if you have Adobe software, you’ll probably have at least a Garamond Premier/Adobe Garamond, Myriad, Arno, Caslon, Chaparral, Constantia, Consolas, Georgia (cool, didn’t know that one!), Jenson, Minion...). Those are just from a quick scroll-through. Personally I’m quite fond of Garamond, Jenson, Arno, and Myriad.</p>
      <p>A more experienced type-nerd could give you more specialized recommendations.</p>
