    <p>Hey.</p>
    <p>Yeah, I guess the subjet line is worded a bit weird. What I’m looking for is if there is a term for the type design feature where certain numbers, most commonly 3,4,5,6,7,8 and 9, extends below the baseline or above the mean line whereas 0, 1 and 2 stays the same size as lowercase letters? Such as in the examples in the attachment.</p>
    <p>If anyone could recommend some (or a whole slew) of fonts with that design feature, either serif or sans serif fonts, I’d be most happy. Thanks!</p>
