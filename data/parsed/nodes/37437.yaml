  html: |-
    <p>Hello,<br>
    Does anyone know the origin and source for the font Tykewriter? It seems to be a free handwriting font that is widely used in childrens books, but the source is mystery. It comes in Regular and Bold Bobbing. There is a kids software product with the same name, but doesn't seem to be the source. Thanks for any suggestions.<br>
    </p><div class="imageWrap"><img src="https://web.archive.org/web/20141114141104im_/http://typophile.com/files/Tykewriter_4614.jpg"></div><p></p>
