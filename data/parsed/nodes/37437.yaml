    html: |-
      <p>Thanks for the input. It's a font that's been around publishing houses a long time, and is frequently requested or supplied to designers for producing kid's books. We use it a lot. However it's creator and original source is unknown. Perhaps it's a custom font that "escaped" from one of the publishers. It's definitely called Tykewriter. Here's a link to the myFont forum about it. Anyway, thanks again. Best.</p>
      <p><a href="https://web.archive.org/web/20141114141104/http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=28372" title="http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=28372">http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=28372</a></p>
