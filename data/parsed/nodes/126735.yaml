    <p>Hello dear experts, </p>
    <p>Been pulling my hair out for this one, I really hope you guys can help identify this typeface:<br>
    Pretty sure it's a calligraphic one but I can't seem to pinpoint exactly.</p>
    <p>Need to know the typeface used for "1898" the "1" seems to be unique to this.. IT's not palatino nor garamond. I figured movies usually use default / standard typefaces<br>
    Hope you can help!<br>
    Thanks in advance!</p>
