  html: |-
    <p>Like they always say, it's hardest for a designer to design her own logo. That's me.</p>
    <p>My business name is Adunate (adunate - very symmetric if done in certain types). It's Latin for unite because I unite graphic design and writing for successful communication. My target markets are home building industries, historic architecture/preservation, coffee, wine, food, religious organizations and other random businesses.</p>
    <p>I used the tiled pattern (log cabin pattern in quilting) in my old logo. It reflects the idea of parts coming together to make a whole, plus it represents the arts &amp; crafts I'm fond of. I've recently added the art nouveau-style curves. It adds an organic element, plus its another style I'm very fond of.</p>
    <p>Choosing a typeface has become my dilemma!</p>
    <p>I really like the contrast that Cezanne offers, done in lower case. However, given my business name is already difficult, I fear it complicates it further. Plus Cezanne is becoming overdone.</p>
    <p>Anyone have any suggestions? They don't even need to be anything like Cezanne. I'm open to every idea.</p>
