    html: <p>The logo has improved significantly. You responded well to this critique. <br> <br>I'm not sure if the wavy lines capture the essence of construction in any ways that I am familiar with, but I could just be naive. Given the choices, I think I'd go with the bottom layout, but I'd increase the gray space in the center and decrease the weight of the lower black bar substantially, either by making it thinner or changing it to a dark gray. <br> <br>Aloha! <br>Scott</p>
