    html: <p>The first thing I would do, is take it out of the box. I think this will help in evaluating the relationships between letterforms vs. the relationship between letterforms and the box. I think you're on the right track with the "r", but I'm not sold on the "F" yet. Outside of the black box, I think you can increase the letter spacing between some of the letters more easily (i-r, m-e for starters). <br> <br>Aloha! <br>Scott</p>
    html_clean: <p>The first thing I would do, is take it out of the box. I think this will help in evaluating the relationships between letterforms vs. the relationship between letterforms and the box. I think you're on the right track with the "r", but I'm not sold on the "F" yet. Outside of the black box, I think you can increase the letter spacing between some of the letters more easily (i-r, m-e for starters). <br> <br>Aloha! <br>Scott</p>
