    html: <p>Oscar, a few issues here imo .... <br> <br>* The dot on the i cutting into the F creates <br>an odd counter shape and sharpness that <br>doesn't fit in with the rounds. <br>* the Vertical stem widths appear consistent, <br>but the horizontals are inconsistent. <br>-- the counters on the m are too tall. <br>--the crossbar on the F seems too thick. <br>--the top horizontal stem on the F seems thick <br>in relation to the other letters, too. <br>You might set some guides, adjust, <br>and then eyeball a print out. (Actually, not you <br>but your friend.) <br>* the m seems too wide. <br> <br>bj</p>
    html_clean: <p>Oscar, a few issues here imo .... <br> <br>* The dot on the i cutting into the F creates <br>an odd counter shape and sharpness that <br>doesn't fit in with the rounds. <br>* the Vertical stem widths appear consistent, <br>but the horizontals are inconsistent. <br>-- the counters on the m are too tall. <br>--the crossbar on the F seems too thick. <br>--the top horizontal stem on the F seems thick <br>in relation to the other letters, too. <br>You might set some guides, adjust, <br>and then eyeball a print out. (Actually, not you <br>but your friend.) <br>* the m seems too wide. <br> <br>bj</p>
