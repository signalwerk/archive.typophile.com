    html: <p>Probably not. Part of the point of being able to do proportional spacing on a typewriter is not having to compromise the proportions of the letters by making them all the same width. The monospaced font you found shows such compromises (unnaturally wide i and l, unnaturally narrow M and W, for example) while the sample in your first post does not.</p>
    html_clean: <p>Probably not. Part of the point of being able to do proportional spacing on a typewriter is not having to compromise the proportions of the letters by making them all the same width. The monospaced font you found shows such compromises (unnaturally wide i and l, unnaturally narrow M and W, for example) while the sample in your first post does not.</p>
