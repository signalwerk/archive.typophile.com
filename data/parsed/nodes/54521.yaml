      <p>Hello all!</p>
      <p>I understand that I am replying to an incredibly old post, however I had been search for a similar typeface for over two years and only discover what it was a couple of days ago.  While doing so I found character sets that identified the typeface ivandurakov posted as IBM Bold Face No.2 which was available on some models of IBM electric typewriter.  The following is a sample of the typeface:<br><a href="http://munk.org/typecast/wp-content/uploads/2011/05/IBM-1960-Catalog-22.jpg">http://munk.org/typecast/wp-content/uploads/2011/05/IBM-1960-Catalog-22.jpg</a><img src="/sites/default/files/old-images/IBM-1960-Catalog-22_5583.jpg"></p>
