    <p>I am trying to ID two typefaces for a friend. See attached.<br>
    1) the word "FOUR" - looks like a wood type<br>
    2) the words "a play by..." - looks to be distressed<br>
    I believe that the word "sugar" is Chesterfield by Alan Meeks<br>
    Thanks for your help in advance,<br>
    Ryan M</p>
