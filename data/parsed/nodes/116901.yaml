      <p>Good find Bob. I couldn't find anything closer. To me _WWW.STRAYDOGTHEATRE.ORG_ looks like the same font as _FOUR_ and differs from the images mainly in that it is thickened and roughened.  I believe that someone has used Ong Chong Wah's design for Abadi MT Condensed Extra Bold to make either a graphic or a derived font, which may turn up as a "free" font under another name.<br>
      Don</p>
