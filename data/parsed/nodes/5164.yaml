    html: <p>Oh, this old thing. Unfortunatley this project fizzled out as quick as it fizzled in. Nice that it came up again though. The Reason why I intitally wanted to use a more rigid solution was because I felt that using curved lines would add a more feminine quality to the mark. I wanted the mark to be both feminine and masculine in a unified form. I also wanted show stability and balance which I felt curved lines would have been unable to represent. Yes, the Ying yang symbol shows balance, However we are dealing with two capital E's here. The Letter E naturally and simply interlocks with itself, I felt it unecessary to force some fancy curved lines upon this solution to try and mimic some ancient chinese symbol. </p>
