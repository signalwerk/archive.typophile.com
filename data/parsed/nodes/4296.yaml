    date_raw: 16 Apr 2004 — 9:27am
    votes: null
    html: <p>It's a near certainty that it's handlettering.  <br> <br>"Come in We're Open" and "Sorry We're Closed" signs exactly like this have been sold at hardware stores for as long as I can remember. I'd say the designer scanned and combined them for this hybrid version.  <br> <br>You might find a font with a similar style to the script, but I doubt very much you will find an exact match.</p>
    html_clean: <p>It's a near certainty that it's handlettering.  <br> <br>"Come in We're Open" and "Sorry We're Closed" signs exactly like this have been sold at hardware stores for as long as I can remember. I'd say the designer scanned and combined them for this hybrid version.  <br> <br>You might find a font with a similar style to the script, but I doubt very much you will find an exact match.</p>
