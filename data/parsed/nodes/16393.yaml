    html: |-
      <p>I think that you could use a little more space between the M and A as the join looks a little cramped. The ball terminal at the top of the M seems to conflict with the one below it, I wonder if you could do without one of them. You could also have a looser swash on the A,Y and make a more comfortable join between the verticals. Are you intending to use it in the middle of the front cover with the sub rotated?<br>
      Tim</p>
