      <p>That's great, congratulations!<br>
      For a piece of lettering to be considered an ambigram, is it enough for it to <em>read</em> the same both "ways", or do the shapes have to be simmetric too?</p>
      <p>I keep thinking it would be interesting to do something which reads, ie, "MAYA" both ways, but where the shapes aren't necessarily simmetrical.</p>
