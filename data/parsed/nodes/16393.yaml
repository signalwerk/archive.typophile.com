    <p>I was approached by my soon to be published literary magazine at school to do an ambigram for the mast head. I figured I'd at least have a go at it...and decided that I would like to end up in a scripty/flowing style since the magazine is all about writing. I plan to put a sub head under it, clarifying the magazine ie. Drexel University Student Literary Magazine or just Student Literary Magazine. Just wanted to see what you all thought. I was quite excited about the construction of the M and the overall style...as was John Langdon. Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/MAYA.png"></div><p></p>
