    html: |-
      <p>For serif headlines I would recommend Minion Pro (in a heavier weight).<br>
      For sans-serif headers anything but what goes along the lines of Helvetica / Akzidenz Grotesk. </p>
      <p>IMHO font matching is not about finding the(TM) perfect couple but about avoiding crude mismatches. Headline fonts should primarily be chosen according to the character of the publication (contents, media, target group), of which you tell nothing. I always thought Curlz MT goes well with Minion, I mean for certain purposes. But that's not exactly a sans-serif.</p>
      <p>Andreas</p>
