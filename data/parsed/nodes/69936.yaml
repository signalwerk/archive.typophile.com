    html: <p>Minion is pretty neutral, I would chose a contrasting face based on the subject matter/content of your publication. Most of the well-known sans-serifs would work well - Gotham, Myriad, Futura, Helvetica, Meta, Univers, Frutiger, Franklin Gothic, etc.</p>
