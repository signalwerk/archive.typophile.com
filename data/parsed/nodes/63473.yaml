      <p>Arno,</p>
      <p>Font Reserve is the previous font manger that was replaced by Suitcase Fusion 2.</p>
      <p>Font Doctor is an application that comes with every purchase of Suitcase Fusion 2 and is helpful when diagnosing and fixing problematic fonts.</p>
      <p>jfidesign,</p>
      <p>Sorry that Suitcase Fusion 2 wasn't working as you expected. Perhaps some of your fonts were orphan fonts (missing either part of a PostScript font file) and that's why they were removed. Your fonts could also have been corrupted though movement across a network, or other hardware errors. Suitcase Fusion does not allow corrupt fonts into its database, to help you keep them from making output error and such in your workflow. You are able to add corrupt fonts temporarily if you absolutely need them, but otherwise, it's best to keep them out of daily usage. </p>
      <p>Otherwise, you may have inadvertently activated a font temporarily, instead of activating it permanently. Fonts that are activated temporarily are automatically deactivated when you log off of your system. They are not removed from your font vault, merely deactivated. </p>
      <p>Hopefully this answers your questions about Suitcase Fusion 2.</p>
      <p>Jim Kidwell<br>
      Extensis<br>
      <a href="http://blog.extensis.com" title="http://blog.extensis.com">http://blog.extensis.com</a></p>
