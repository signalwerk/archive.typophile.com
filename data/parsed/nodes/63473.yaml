      <p>Ataliano,</p>
      <p>You can tell the Suitcase Fusion Core to launch at log-in if you want. The Core keeps all of your requested fonts active, even when Suitcase Fusion isn't open. </p>
      <p>To enable the Core to startup at log-in:</p>
      <p>1. Open the Windows Control Panel.<br>
      2. Double-click the Suitcase Fusion 2 Core item<br>
      3. Enable the "Start Suitcase Fusion 2 Core at Log-in" option<br>
      4. Close the dialog box.</p>
      <p>Hope that helps you take full advantage of Suitcase Fusion 2.</p>
      <p>Arno, if you haven't tried the most current version of Suitcase, it's been enhanced dramatically from the previous version. You can download a trial copy here: <a href="http://www.extensis.com/suitcasefusion2" title="http://www.extensis.com/suitcasefusion2">http://www.extensis.com/suitcasefusion2</a></p>
