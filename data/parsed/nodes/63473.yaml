      <p>Arno,</p>
      <p>I think I understand what you are looking for. Yes, you must add a font to Suitcase Fusion to be able to preview the font. Remember, adding fonts to Suitcase Fusion does not automatically add them to the system's fonts folder. They are not active on the system until you activate them with Suitcase Fusion. All fonts added to Suitcase Fusion can be previewed and even examined at a glyph level with the Glyph Viewer before being activated.  </p>
      <p>Fonts can be added to Suitcase Fusion in two ways: to the Font Vault, or add them in place on disk. Adding to the Font Vault makes a copy of your fonts into a secure location, while adding them in place merely refers to the file in its current location.</p>
      <p>Suitcase Fusion works like iTunes in this way. You wouldn't necessarily need to preview a song before adding it to iTunes. Mainly you just want it to know where all of your songs are located. You can of course then remove songs from playlists (sets) or the database (library) whenever you need.</p>
      <p>Hope that this helps.</p>
      <p>Jim</p>
      <p>Jim Kidwell<br>
      Extensis<br>
      <a href="http://blog.extensis.com" title="http://blog.extensis.com">http://blog.extensis.com</a></p>
