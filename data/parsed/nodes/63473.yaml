    <p>Hi guys!</p>
    <p>I'm new here so excuse me if this question is already answered, I tried to search for a topic talking about this, but I didn't found anything, at least what I was searching for.</p>
    <p>I'm now studing Graphic Design and actually I'm a PC and I'm a Mac (LOL). My main computer is a Pc and I've a Macbook Pro for working at university.</p>
    <p>I've some troubles finding some font manager for Windows, because I'm used to work with Font Explorer on Mac and I think it's one of the best choices for OS X, works fine, quick and have a lot of options.</p>
    <p>For Windows, there's Suitcase wich lots of people say's the best one, but not for me, I think it sucks. Now I've tried Suitcase Fusion 2 and it seems the worst suitcase I've ever tested, It didn't oppened on Windows startup and I've to open the program each time I want to activate a font... so frustrating.</p>
    <p>I know Linotype is working on a Font Explorer version for Windows, but the beta version have some bugs and there's not any link to donwload it at now... so I need some font manager program wich works like Font Explorer but over Windows (actually I've Windows 7 ultimate on my PC), and I've tried some of them but I don't likked them...</p>
    <p>So as I know here's the best place to put questions like that, please, suggest me one font manager to use with Windows.</p>
    <p>Thanks for your help!</p>
    <p>Regards from Spain ^^</p>
