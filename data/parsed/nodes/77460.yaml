    <p>Hi all,</p>
    <p>I have a logo design gig that might require the purchase of a typeface. Both Neutraface No. 2 (Display Titling) and Verlag Compressed (Black) seem to work equally well with it. I was wondering what you all would consider the better investment? I have to make these font purchases count, so I want the most bang for my buck, as it were.</p>
    <p>You thoughts?</p>
