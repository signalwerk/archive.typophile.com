    html: '<p>Egyptienne (F) is indeed a good match. <br><br>You might also try: <br><br>Candida <br><a href="http://www.myfonts.com/fonts/urw/candida/" target="_blank">http://www.myfonts.com/fonts/urw/candida/</a> <br><br>Edison <br><a href="http://www.myfonts.com/fonts/ef/edison/" target="_blank">http://www.myfonts.com/fonts/ef/edison/</a> <br><br>Marconi <br><a href="http://www.myfonts.com/fonts/linotype/marconi/" target="_blank">http://www.myfonts.com/fonts/linotype/marconi/</a> <br><br>Melior <br><a href="http://www.myfonts.com/fonts/linotype/melior/" target="_blank">http://www.myfonts.com/fonts/linotype/melior/</a> <br><br>Schadow <br><a href="http://www.myfonts.com/fonts/bitstream/schadow/" target="_blank">http://www.myfonts.com/fonts/bitstream/schadow/</a> <br><br><span class="caps">ITC</span> Slimbach <br><a href="http://www.myfonts.com/fonts/linotype/itc-slimbach/" target="_blank">http://www.myfonts.com/fonts/linotype/itc-slimbach/</a> <br><br><span class="caps">ITC</span> Zapf Book <br><a href="http://www.myfonts.com/fonts/bitstream/itc-zapf-book/" target="_blank">http://www.myfonts.com/fonts/bitstream/itc-zapf-book/</a> <br><br>or <span class="caps">ITC</span> Zapf International <br><a href="http://www.myfonts.com/fonts/bitstream/itc-zapf-international/" target="_blank">http://www.myfonts.com/fonts/bitstream/itc-zapf-international/</a> <br><br>Essentially, any text face that has an aﬃnity for <br>the square or super-ellipse should be a pretty <br>good match. <br><br>David</p>'
