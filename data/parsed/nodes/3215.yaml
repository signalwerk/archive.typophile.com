  html: <p>I am supposed to design a leaﬂet for a friend who is physical therapist. Her corporate design shows a quite modern impression using Microgramma typeface. Now I am wondering which typefaces would match well with Microgramma (with M. for headlines and X for continuous text, or vice versa — which seems to be less likely to me, but I am only an amateur…)? <br><br>Any hints? <br><br><span class="caps">TIA</span>&nbsp;Robert</p>
