  html: |-
    <p>Hi All,</p>
    <p>I’ve gone through all the fonts for most software including Photoshop,<br>
    Office, Quark etc.</p>
    <p>I’ve also tried all of the “automated” online font ID services with<br>
    no luck (some are good at asking the right questions but then suggest<br>
    fonts that don’t match my answers, anyhow).</p>
    <p>Also browsed many online fonts and foundries.</p>
    <p>ITC Ronda is definitely not it though it’s about as close as I could<br>
    get.</p>
    <p>Some of the key features are the single storey “a” and the no-spur “r”.</p>
    <p>Image below and thanks in advance for any help. I know this font came<br>
    from somewhere because I’m no font founder :).</p>
    <p>Cheers.</p><div class="imageWrap"><img src="/files/logo_3_5355.gif"></div><p></p>
