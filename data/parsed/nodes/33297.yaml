      <p>I seem to remember seeing a font like that in smaal book written in Spanish. My daughter was a 1st grader at the time and about 80% of the kids in her school were immigrants from Central and South America. My daughter was trying to help some of her classmates with English and they, in turn, were helping her with Spanish. The books were school level simple with big type that looked much like that. Perhaps you might check some Spanish sources?</p>
      <p>ChrisL</p>
