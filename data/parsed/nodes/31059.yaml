  html: |-
    <p>After spendig months on a new typeface family – the measurement line suddenly disappears from the FontLab .vfb-file even though its activated. What is wrong? The other .vfb-files seem to be intact. May it perhaps be a bug? I use FontLab 5.0.2 on a Mac running ‘Tiger’.</p>
    <p>Please, help me<br>
    KTKM</p>
