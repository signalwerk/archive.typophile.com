    html: |-
      <p>Tips and tricks.</p>
      <p>in the Edit Macro panel write: </p>
      <p>fl.font.measurement = 50<br>
      fl.UpdateFont(-1)</p>
      <p>and click on the Run macro button. </p>
      <p>Will that help?</p>
      <p>Regards,<br>
      Johnych</p>
