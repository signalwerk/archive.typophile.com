      <p><em>…does this have the implication that colored text should be used more sparingly when done with process color and on screen, as it's less sharp compared to black?</em></p>
      <p>In print, it depends whether it’s screened.<br>
      The worst is a beige with middle values of C and M. Those colors will have ragged edges in type, and if the registration is not bang on, even fuzzier.<br>
      But colors that are mostly C, M or K, with a touch of Y, are most sharp.</p>
      <p>100% Magenta or Cyan can be very nice in a Light type.</p>
