      <p>Do be aware of the colour-independent contrast between fore and background.  Don't rely on hue alone to distinguish them.  </p>
      <p>I used to work on UI design with someone who was partially colour-blind; many combinations which looked perfectly distinct to me were virtually monotone to him.  I got into the habit of testing my designs by taking screen captures and converting them to greyscale to see if readability suffered.</p>
