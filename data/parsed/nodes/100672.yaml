      <p>If you're going to reverse out the type, I'd made the type white or a very light color. So in your yellow/blue test I'd make the yellow much lighter. Same thing with your gold/red test. Will be more attractive and more readable.</p>
      <p>&gt; does this have the implication that colored text should<br>
      &gt; be used more sparingly when done with process color [on the web]...</p>
      <p>Nick was exactly right that using spot colors on printed materials will give superior results rather than using screen tints. (So for example gray type would ideally be printed with solid gray ink, rather than as a screen tint of black.) But when type is viewed on a computer monitor you're working with a totally different process, and its simply not going to be a sharp as text from a printing press. You just need to look at it onscreen and use your own judgement.</p>
