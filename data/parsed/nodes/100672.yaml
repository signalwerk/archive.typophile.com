      <p>I think it mostly comes down to contrast, and black on white is some of the highest contrast possible; one could argue for complementary colours providing more contrast but that’s a different kind of contrast, I think personally it’s mainly about light and dark, not colour v. colour even though human vision is so centred on colour.</p>
      <p>I’m reading a book at the moment where each chapter has a different colour for the title and some related text, many of the colours picked are strong enough that legibility even at around 14pt is fine but they went far too light in a few cases and it’s a struggle to read.</p>
      <p>A general observation I’ve made over the years: yellow text on white is rarely a good thing. It can work for headings, especially with a blocky face and a darker yellow, but a light yellow like a single pass of process yellow can make type that’s incredibly hard to see properly much less read.</p>
