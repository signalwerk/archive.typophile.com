      <p>Well, 100% contrast can only exist between total light (pure white) and total darkness (pure black), neither of which exists. What I was talking about is that historically people haven't had enough contrast (especially concerning the whiteness of the paper*) so more was always better; but I think these days we might in fact have too much contrast sometimes. So on screen using a dark gray for the text or a very light gray (or tint) for the background might be beneficial.</p>
      <p>* Which for example motivated Baskerville to make his special paper.</p>
      <p>hhp</p>
