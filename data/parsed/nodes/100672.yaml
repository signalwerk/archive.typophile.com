      <p>&gt; i'm thinking specifically for long form<br>
      &gt; writing, blog posts, books, and magazines.</p>
      <p>There are many factors that go into good design, and readability is only one of them. Otherwise we'd always use the easiest-to-read fonts and discard the rest. But in long-form documents, readability becomes a higher priority. I think putting a few paragraphs in reversed type (like white type on a colored background) is fine, or maybe even a whole page that way in a magazine article, but I wouldn't advise a whole book done that way. However I've seen blogs done that way that looked fine, but in those you're reading in smaller chunks. </p>
      <p>Very low contrast combinations, like yellow on white, are generally hard to read, although it might work for a large headline.</p>
      <p>It's important to consider the age of the target audience, as vision generally gets worse as we age. I wouldn't use tiny type or hard-to-read color combinations in an article aimed at seniors, but I might consider it for an article written for young folks.</p>
