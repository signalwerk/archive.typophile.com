      <p>How do you pronounce that word? Is it Spanish? Because in English, in my head, it sounds a lot like regurgitate. That's really not a good association for a religious media company!</p>
      <p>As far as design, the top one looks like jack-o-lantern teeth. Or an earthquake. I don't see the media or religious angle at all. </p>
      <p>The bottom one has more potential, but the white letters are illegible. Brutal truth? Sound waves are incredibly overused. As a rule I never use anything in a logo that's a standard icon already.</p>
      <p>Have you though about doing a simple logotype alone instead of a mark? IMO, PR companies are best served by classy, understated typography alone. Due to the dynamic nature of promotional work, far too many media companies use trendy graphics that don't stand the test of time. Just my opinion.</p>
