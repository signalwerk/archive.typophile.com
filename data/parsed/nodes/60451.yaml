      <p>Hi,<br>
      The name is extremely bizarre! Is it a purposefully misspelled name to protect your/client's confidentiality? If not, what's the rationale behind it?<br>
      In addition, sound waves are a rather over-used icon. However, I do think that the sound waves in the first version are an slightly unusual take on the sound-waves idea, suitably different to overcome the straightforwardness. It is a specifically Christian media company: do you want this to come across in the logo?<br>
      When designing a logo, I find it useful to consider how it will look in black &amp; white (B&amp;W only, not grayscale) - this will help you create a clear and uncluttered design. In fact, I'm working on something at the moment where this idea would've saved me trouble now, see the thread on Cupcakes!)<br>
      Hope this helps,<br>
      H</p>
