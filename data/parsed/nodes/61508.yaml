    <p>(!) This feature has high priority</p>
    <p>(1) Supports all opening and closing punctuation<br>
    (2) Only for Arabic<br>
    (3) These characters are deprecated<br>
    (4) Due to platform restrictions, not all UniPad features are supported<br>
    (5) UniPad does not combine characters automatically<br>
    (6) Automatic visual combination of Hebrew accents is not supported<br>
    (7) UniPad does not support Syriac shaping, the nominal glyphs are displayed instead<br>
    (8) Contextual forms of those letters are not supported, nominal glyphs are displayed instead<br>
    (9) Automatic arrangement of jamo components as Hangul syllables is not supported<br>
    (10) Automatic visual combination of vowel marks/accents is not supported<br>
    (11) Vertical direction is not supported, characters are displayed from left to right instead<br>
    (12) Shaping behaviour (i. e. selection of glyph variants) is not supported</p>
