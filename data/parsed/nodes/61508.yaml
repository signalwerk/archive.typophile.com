    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Technical%20Info" class="freelinking" rel="nofollow">Technical Info</a> : UniPad Features</strong></p>
    <p>This article is designed to list which features are supported and the UniPad Features supported.</p>
    <p><strong>Supported Platforms</strong></p>
    <p>Microsoft Windows 9x, Windows Me [OK]<br>
    Microsoft Windows NT 4.0, Windows 200X, Windows XP [OK]<br>
    WINE HQ, for x86-based Unixes, including Linux, FreeBSD, and Solaris [OK]<br>
    Windows CE (4)<br>
    Microsoft Windows 3.x<br>
    Linux / X-Windows (!)<br>
    Mac OS X<br>
    Palm OS (4)</p>
    <p><strong>General Features</strong></p>
    <p>Full BiDi support (Hebrew, Arabic, Thaana, Syriac)<br>
    Rendering of Arabic contextual forms<br>
    Separated rendering of non-spacing marks<br>
    Combined rendering of non-spacing marks (!) [only for future versions of UniPad]<br>
    Normalization (maximal decomposition) [only for future versions of UniPad]<br>
    Conversion to precomposed characters<br>
    Case conversion<br>
    Surrogate support<br>
    Printing<br>
    Multi-level undo<br>
    Attributed text [not for future versions of UniPad]<br>
    Coloring/highlighting of formatting characters [only for future versions of UniPad]<br>
    Automatic file format detection<br>
    Conversion of different line separators<br>
    Clipboard support for Unicode<br>
    Clipboard support for other character sets<br>
    Send file as email attachment</p>
    <p><strong>Handling of Formatting Characters</strong></p>
    <p>Line Separator<br>
    Paragraph Separator<br>
    Joiner / Non-Joiner (2)<br>
    Symmetric Swapping Activate/Inhibit [not for future versions of UniPad] (3)<br>
    Arabic Form Shaping Activate/Inhibit [not for future versions of UniPad] (3)<br>
    National Digit Shaping Activate/Inhibit [not for future versions of UniPad] (3)<br>
    BiDi (Embedding, Override, Marks)<br>
    Tabulator</p>
    <p><strong>Fonts / Glyph Sets</strong></p>
    <p>Proportional Unified Bitmap Screen Font<br>
    Fixed Width Unified Bitmap Screen Font<br>
    TrueType support [only for future versions of UniPad]<br>
    Multiple font sizes [only for future versions of UniPad]<br>
    User definable fonts [not for future versions of UniPad]<br>
    User definable Private Use glyphs [not for future versions of UniPad]</p>
    <p><strong>Formats / Encoding Schemes</strong></p>
    <p>UTF-16 / UCS-2<br>
    UTF-8<br>
    UTF-7<br>
    UTF-32 / UCS-4<br>
    ASCII + Universal Character Names (“\uXXXX“)<br>
    ASCII + XML Character References ("&amp;#xxx")<br>
    Standard Compression Scheme</p>
    <p><strong>User Interface Languages</strong><br>
    English<br>
    German<br>
    Other European languages [only for future versions of UniPad]<br>
    Other Non-European languages [not for future versions of UniPad]</p>
