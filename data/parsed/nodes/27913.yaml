    <p>Hello everyone,</p>
    <p>Since I really like Arabic calligraphy and its organic use of strict geometrical forms, I tried do something like that with Latin lettershapes. First I didn't really know how to start; but then I decided to begin with building an alternative, geometrical grid.</p>
    <p>I decided to take the undercast 'g' from the Silom typeface, took only the outlines of it, mirrored it both vertically and horizontally, rotated it 180 degrees and combined the 4 shapes together, which resulted into one rectangular shape.</p>
    <p>This was going to be my basic form from which the eventual grid is build of.</p>
    <p>My next step was to create lettershapes by filling some of the spaces in the grid. I only used the middle part of the grid; the lettershapes should be smooth, elegant and calligraphy-like, yet playful.</p>
    <p>I attached a PDF-file with some results. I hope it makes visible the way I worked things out.</p>
    <p>Please, feel welcome to give any comment you like.</p>
