    html: <p>If you want to hint the font using type 1 hinting it's pretty simple. You just have to follow the rules like latin, connect parallel horizontal nodes to each other and the same for the vertical ones. For dots just restrict multiple dots between two horizontal stems and vertical stems. Finally put one horizontal link at the descender and one at the ascender. TrueType hinting for an arabic typeface could be a headache. I don't know about that. Titus  knows much more about this since hid did TrueType hinting on Nassim typeface which is being used on BBC Persian website.</p>
