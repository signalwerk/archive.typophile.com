  html: <p>Traditional Arabic fonts have stems and curves going all over the place, compared to Latin, where verticals and horizontals dominate.  Hinting Latin - I think - relies on such uniformity, but what about Arabic?  Will an Arabic font benefit from hinting?  My font has outlines of identical thickness - does this help the hinting process?  Any hints (!) suggestions and examples most welcome as I know very little in practice about this.</p>
