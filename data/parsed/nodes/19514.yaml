      <p>I backup my Mac portable to a cheap HD in a Firewire enclosure. I think the street value to my 80GB drive, with enclosure,  is about $100. I use the free utility Carbon Copy Cloner to ’clone’ my whole laptop drive onto a 30GB partition I’ve set up. This is something that an average user can figure out, no deep technical knowledge necessary. If my drive is stolen, destroyed, etc. I’ll just get a new one and clone my data over. I try to do this every month or so. I usually set it to clone before I go to bed, it takes 30min or so....<br>
      I recommend it. </p>
      <p>Also, I don’t buy Applecare. I don’t necessarily think it’s a bad idea, it’s just that its just that I’m not sure that I’ll get my money out of it. Apple products already have a warranty.</p>
