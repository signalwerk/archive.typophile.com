      <p>I’m a longtime Mac user but I haven’t taken the plunge switching to the Intel Macs yet. The 17” MacBook Pro does look very nice however. Virtualization technology (such as Parallels) that allows you to run Windows apps with decent performance also makes the Intel Macs quite attractive.</p>
      <p>If you are considering having a laptop as your only machine, I <strong>strongly</strong> encourage you to think carefully about backups and the AppleCare extended warranty.</p>
      <p>Although the machines are pretty expensive, after a while the data on the machine will be more valuable than the machine itself. If the laptop is lost or stolen, or if you need to send it in for repairs and they wipe the disk, you’ll be toast unless you have good backups. You can get a coupla hundred G external FireWire disk for $150-$300 depending on speed and capacity.</p>
      <p>You should also consider the AppleCare extended warranty, which costs $349. If you carry the laptop everywhere it’ll be susceptible to damage from being jostled around, connectors being plugged and unplugged (well maybe not the cool new magnetic power plug), being dropped, having beverages spilt into the keyboard, etc. Any of these can be fatal. I’ve fortunately never had to use AppleCare. However, there are many Mac users at my workplace and several report excellent repair service under AppleCare.</p>
      <p>These do add significantly to the cost of the machine. I recommend you factor backups and AppleCare into the cost of any new machine that you buy. Whatever you decide, happy Mac’ing! I’m sure you’ll enjoy it.</p>
      <p>s’marks</p>
