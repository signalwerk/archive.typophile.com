    <p>I am trying to figure out what will be my total expenditure if I switch to Mac with my upcoming laptop purchase. <a href="http://www.apple.com/" target="_blank">The MacBook Pro 17”</a> sounds pretty nice. I have found for me a “desktop replacement” is the best way to go, so I can work seamlessly from anywhere, and not have to buy extra copies of the programs I use. I am almost always running off of AC.</p>
    <p>Is there some kind of website program (page editing and ftp transfer) included that will suffice, or will I need another program for that? (Using Frontpage now)</p>
    <p>And is it true (someone told me) that Adobe will give cross-platform software on their programs for just shipping cost? </p>
    <p>Is there a Mac magazine that is considered the best resource for tips, tricks, workarounds, etc?</p>
    <p>Any other useful info gladly accepted.</p>
