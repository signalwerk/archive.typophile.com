      <p><cite>Is there some kind of website program (page editing and ftp transfer) included that will suffice, or will I need another program for that? (Using Frontpage now)</cite></p>
      <p>Depends on your skills and needs. You will find very easy and fast tools like RapidWeaver or you could get the professional app Dreamweaver (this ships as a cross-plattform CD). Both tools include FTP functions, but you can also take a look at Transmit 3.5. </p>
      <p>Ralf</p>
