      <p>The CS2 suite is not going to run native on that machine until CS3 - second quarter 2007. That being said I’ve heard that they run about as fast as the current G5s. There have been a few hiccups with the OS.</p>
      <p>You can transfer through the terminal if you’re handy with Unix, but I would recommend Fetch for ftp. It’s pretty cheap and really easy to use.</p>
      <p>There’s no web page editing software that I’m aware of with the operating system. Maybe you need to get the premium suite, which comes with GoLive. The next edition of the suite might be pretty exciting, the CEO of Apple stated that they are going to more tightly integrate their product line. They own Macromedia so we shall see…</p>
      <p>I think it’s true about the Adobe switch, you just need to transfer your license, but check their website to make sure.</p>
      <p>Macosxhints is great if you want to dive into Unix. MacFixIt has its merits. The Apple boards are about as good as any…</p>
      <p>There’s a million boards out there for Macintosh, you don’t really need to subscribe to a magazine.</p>
      <p>Walk towards the light, walk towards the light…</p>
      <p>Just kidding, CPUs are dispensable every three years. I’m in love with monitors.</p>
      <p>peace</p>
