  html: <p>For those of you who missed today's chat on the war in Iraq, we've decided to pool our resources at Typophile. Many users have decided to let their voice be heard by redesigning their user icons to reflect their views on the war, for the duration of the war.  <br>  <br>Typophile will also collect these icons and piece them together in a virtual "quilt" of sorts at <a href="http://www.typophile.com/peace/" target="_blank">http://www.typophile.com/peace/</a>  <br>  <br>For those who'd care to participate, email your 100 x 100 pixel graphic (GIF/JPG) and desired link to <a href="mailto:peace@typophile.com">peace@typophile.com</a>.  All entries are accepted, but typographic compositions are preferred.  <br>  <br>Please share this with your friends and colleagues. All are welcome to participate.  <br></p>
