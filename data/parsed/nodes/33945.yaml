    html: <p>According to Martin Kotulla, SoftMaker is creating their version of "Agraphicus" and the typeface itself is being cloned as A750 Deco, again in the same design as FontBank's Acropolis &amp; Southern Software's Corruga Display SSi/SSK, except that more symbols/punctuation and international characters were added, joining numbers and some symbols/punctuation.   Appearing on "MegaFont XXL 3.0" and "infiniType 4" premium-quality typeface collections - both being released in May 27, 2014.</p>
