    html: <p>That was, predigitally, VGC Agraphicus, but it's been manually condensed. Digitally, Fontbank offered it (years ago) as <a href="http://www.buyfonts.com/value_for_money/acropolis.htm" target="_blank" rel="nofollow">Acropolis</a>. I don't know if the folks I linked you to (a Xara offshoot) really have the rights to the old Fontbank (a defunct company) fonts as they claim, but at two dollars, does it really matter much?</p>
