    html: <p>Well certainly referencing GIDs is only going to lead to this problem. But as you noted, unicodes won't help. The only reference which would help in this situation would be for your script to refer to glyphs by glyph name. Unfortunately, I've reached the end of my InDesign knowledge here, and am not sure if that'd be even possible. :(</p>
