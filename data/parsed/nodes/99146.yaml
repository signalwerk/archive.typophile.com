      <p>thank you  - i have come to that conclusion too ... the glyph name would be "unique" and independent from GID or unicode, but as far as i can see in glyph palette (and also from search tool for glyphs), it is not used by indesign.</p>
      <p>So what i'd need is a script that looks for glyph IDs in the document, and add / subtract a value X to any GID it finds that is larger than Y (the position where i added / deleted a glyph) ... or accept that some of the work has to be done manually ;-)</p>
