  html: |-
    <p>Dear readers,</p>
    <p>i'm using an indesign script (not created by my, but from the internets) to output all glyphs of a font, identified by their Glyph ID (GID) in a document for comparison, testing and specimen. </p>
    <p>the problem especially in the creation of a glyph list, while still bugfixing is: if i change my font, adding or deleting glyphs, and update the document with the new font version, the glyphs "shift" in their order: Let's say i had "ABC" inserted via their glyph indexes 100, 101, 102, and i then delete the glyphs 50 and 51 in my font file, the glyphs "reshuffle". So in the new version, the glyph numbers used by indesign of course stay the same, but they represent "CDE" now, resulting in a "mess" in my indesign glyph list :)</p>
    <p>I'm not working with unicode, as lots of my glyphs don't have one, but are alternates adressed by various opentype features.</p>
    <p>How do you work in this problem? Any script to shift the GIDs in indesign too?  Do you have a way better approach when creating a glyph list in a layout program, while still working on the font?</p>
    <p>thanks<br>
    Sebastian</p>
