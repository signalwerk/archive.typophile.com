    html: |-
      <p>The GID is the <em>index</em> number of the character in the font itself, and so of course they shift when you remove a character ... You can't have a not-consecutive list of indexes.</p>
      <p>Unicode is a mapping from glyph index to a fixed code, so even when the glyph index itself changes, InDesign can still find the correct one. But if you rely on index alone, it cannot help you any further.<br>
      The same thing will happen when you change your font to another one: Unicode mapped characters will stay the same, un-mapped characters will change to the random glyph on that index position in the new font.</p>
      <p>Either don't insert or remove glyphs anymore (which should not be a problem, after all no software in the world works <em>solely</em> with glyph indexes), or assign Unicodes in the Private Range to your glyphs. The latter will ensure InDesign, as well as all other software, can keep up with your editing.</p>
      <p>(The former can be accomplished by leaving 'deleted' glyphs as blanks in their position, and only add new characters at the end.)</p>
