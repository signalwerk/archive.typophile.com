      <p>For techno fonts like this my advice is to search at Dafont, in the Techno&gt;Sci-Fi category. It seems like 80-90% of the vague techno font questions turn up there (the exceptions are the better known commercial techno fonts), but when your post doesn’t immediately ring any bells, it often means it’s one of the countless ’hobby’ (free) fonts that are so easy to make, as Jan said.</p>
      <p>- Mike Yanega</p>
