    <p>Hey all, some discussions here touched on this, but I still can't find a good answer.<br>
    I'm using Windows, and I'm trying to render some true type fonts to fit into an 8x8 grid and then reduce the grayscale to 1 or 2 grays for use in old video game roms.  I tried several methods and most came out really crappy.  While trying to find a better way I found out that the solution is hinting to keep the clarity at low point sizes while still softening the edges of the curves.  This works really well, except Windows' font smoothing kicks out at those font sizes except in a few fonts I've tried it with.  So-far the only solution I found that might work - a CSS webpage tag that forces antialiasing at small sizes didn't work for me.  Does anyone know a program, dll modification, or font data modification to make windows keep it's antialiasing active at the font sizes I wish to use?  Will a mac computer's rasterizer do what I want?</p>
