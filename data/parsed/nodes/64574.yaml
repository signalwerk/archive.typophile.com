      <p>Oh cool!  I think TTX is just what I'm looking for.</p>
      <p>I'll give Photoshop a try first, I'm more familiar with Paint Shop Pro, so that's what I've been using.  It's rasterizer is OK, but doesn't seem to use hinting.  Still it worked better than the resizing method.</p>
      <p>Right now I'm replacing the fonts in Little Sound DJ for Gameboy.  It's important to have a really readable font on a screen that small, and I didn't like the default fonts it had available.  I posted my first results to <a class="freelinking external" href="http://8bitcollective.com/forums/viewtopic.php?id=16226">8 Bit Collective</a>, and had requests for some True Type fonts.  I've done this kinda thing on other games and programs for older systems - Pocketnes for GBA, and some other rom hacks.  Whenever I tried to convert a TTF I got mixed results, and windows font smoothing (or lack of it) has always been where I hit a brick wall.  After Helvetica turned out so good I started searching for a way to replicate it with some other good fonts and wound up here.  I'm glad you guys have such good suggestions.  I've been trying to figure this one out on and off for years.</p>
