  html: |-
    <p>Hey guys</p>
    <p>I've been working on my logo for ages now and finally I'm on to the next step of typesetting my collateral and portfolio items. </p>
    <p>What I have so far is based on a 10 pt grid and am pairing frutiger with baskerville. I'm ok with it for now but I can't help to think that my judegement might be a bit off as I've been working on DHL projects for so long now and what they have is pretty similar. Their set in frutiger and minion. </p>
    <p>Was hoping if y'all could help in giving me some constructive criticism on how I can improve it. </p>
    <p>I'm looking for a really clean and serious look. I've gone down the fun path in the past but it was hard to get clients to take me seriously. </p>
