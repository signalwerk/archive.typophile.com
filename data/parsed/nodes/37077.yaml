    <p>From two blogs</p>
    <p><a href="http://www.typophile.com/node/27984">http://www.typophile.com/node/27984</a><br>
    feed://<a href="http://www.typophile.com/crss/node/27984">www.typophile.com/crss/node/27984</a></p>
    <p>I learned that there is double mapping for Delta, Omega, mu; according to “AGLFN 1.6 (new) strict” Unicode-Name mapping table:</p>
    <p>U+2206 “uni2206” - (for the INCREMENT)<br>
    U+0394 “Delta”      - (for Greek Delta)<br>
    ---------------<br>
     U+00B5 “uni00B5” - (for MICRO SIGN)<br>
    U+03BC “mu”        - (for Greek Mu)<br>
    ----------------<br>
    U+2126 “uni2126” - (for OHM SIGN)<br>
    U+03A9 “Omega”   - (for Greek Omega)</p>
    <p>I have to transform an old postscript font (that was used for some phonetics) into an opentype font so that a large amount of text that was created in the postscript font (in various Mac-programs) can be used with opentype font both on Mac and PC. (At the same time I need to make sure that we still can use the old postscript font - or an appropriate updated new postscript font - because we need it for creation of "printing standard"-Acrobat4-pdfs that are accepted by printing companies.)</p>
    <p>If I use Glyph names "Delta" and "mu", all is fine with these letters.</p>
    <p>However, for Omega neither the name “Omega” nor the name “uni2126” produces satisfactory results. In InDesign (Mac) it is basically OK, but in TextEdit and some other programmes on MacIntosh the phonetic letter does not show up, but rather the letter is transformed into Lucida Grande (Standard Font) and appears as an Omega in this Lucida Grande Font.</p>
    <p>If I name the Glyph “uni03A9”, which is not according to “AGLFN 1.6 (new) strict”, then all works out fine on the MacIntosh.<br>
    I wonder why this is so and if this choice could create problems in the future - or on the PC. (I am using MacBookPro OSX.4.10)<br>
    I should add that I use the "MacOS Roman" encoding table in Fontlab.</p>
    <p>Part II:<br>
    Also I would be happy if you could also suggest what is better:</p>
    <p>1) Double encoding<br>
    Name: "Delta";      Unicode: 0394 + 2206<br>
    Name: "mu";         Unicode: 03BC + 00B5<br>
    Name: “uni03A9”; Unicode: 2126 + 03A9</p>
    <p>or simple encoding for first two Glyphs<br>
    2)<br>
    Name: "Delta";      Unicode: 0394<br>
    Name: "mu";         Unicode: 03BC<br>
    Name: “uni03A9”; Unicode: 2126 + 03A9</p>
    <p>or<br>
    3)<br>
    Name: "Delta";      Unicode: 0394<br>
    Name: "mu";         Unicode: 03BC<br>
    Name: “uni03A9”; Unicode: 03A9</p>
    <p>or<br>
    4)<br>
    Name: "Delta";      Unicode: 0394<br>
    Name: "mu";         Unicode: 03BC<br>
    Name: “uni03A9”; Unicode: 2126</p>
    <p>The fourth possibility, which is unusual, I consider because it seems to me that Adobe Programmes prefer Unicode 2126.</p>
    <p>Thanks in advance for any advice<br>
    Volker</p>
