      <p>this would have been better filed under the "Build" section.</p>
      <p>I was hoping that someone like Adam or Miguel or John would have piped up before me, but i'm guessing they're all busy with ATypI at the moment. Anyway, I recently dealt with this problem and found that To get things to work properly I had to give the letter names (Delta, Omega, mu) to the math glyphs and uni-names to the Greek letter glyphs. However, I was alerted that giving uni-names to other Greek letter glyphs (such as Alphatonos) will produce problems in Mac applications.</p>
