      <p>Thank you very much for the advice. You are right, I should have put it in "Build", somehow it took me days to find where I actually put it (I was also a few days out of office).</p>
      <p>I profited a lot from the your thread "Apple and CFF: what's the deal?" <a href="http://www.typophile.com/node/37122">http://www.typophile.com/node/37122</a> that you started a few minutes after you answered my question. It seems its best to hope that apple solves the issue with Mac OS X 10.5 Leopard.</p>
      <p>It is somewhat a surprise <cite>"that to get things to work properly"</cite> you <cite>"had to give the letter names (Delta, Omega, mu) to the math glyphs and uni-names to the Greek letter glyphs"</cite>. From “AGLFN 1.6 (new) strict” Unicode-Name mapping table:</p>
      <p>U+2206 “uni2206” - (for the INCREMENT)<br>
      U+0394 “Delta”      - (for Greek Delta)<br>
      ---------------<br>
       U+00B5 “uni00B5” - (for MICRO SIGN)<br>
      U+03BC “mu”        - (for Greek Mu)<br>
      ----------------<br>
      U+2126 “uni2126” - (for OHM SIGN)<br>
      U+03A9 “Omega”   - (for Greek Omega)</p>
      <p>one would expect it just the other way . But it was also my experience with the "Omega", although "Delta" and "mu" seemed kind of OK also the other way.</p>
      <p>Volker</p>
