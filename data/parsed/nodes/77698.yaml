  html: |-
    <p>Doing a project in the style of "classic Hollywood" (I'm thinking 20's-30's) Was wondering if anyone could recommend a good art-deco (or similar) font to use.  My base font is going to be Futura, so something that would play well with that would be great. Mostly looking for something for background text elements that will add some atmosphere.</p>
    <p>Thank you!</p>
