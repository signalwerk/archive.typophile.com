      <p>I don't really think that smart type captures the essence of vintage Hollywood, which utilized hand lettering so much.<br>
      This was demonstrated by the success (IMO) of Neville Brody's recent custom face for <em>Public Enemies</em>, which was slightly off-kilter in its proportions. And I don't think that the 1920s is well represented by geometric art deco; perhaps something more <em>moderne</em>.</p>
      <p>Nick Curtis has a lot of suitable fonts, based on hand lettering: <a href="http://www.nicksfonts.com/" title="http://www.nicksfonts.com/">http://www.nicksfonts.com/</a></p>
      <p>Here is a type which is nonetheless authentic to both the 20s and 30s:<br>
      <a href="http://www.fontbureau.com/fonts/MeyerTwo/" title="http://www.fontbureau.com/fonts/MeyerTwo/">http://www.fontbureau.com/fonts/MeyerTwo/</a></p>
