    html: |-
      <p>On further investigation, I’ve identiﬁed ﬁve categories of case relationship:</p>
      <ul>
      <li>Majuscule/Minuscule</li>
      <li>Identical</li>
      <li>Large/Small</li>
      <li>Stylistic Alternates</li>
      <li>(Lower Case) Blank or with Common Placeholder Glyph</li>
      </ul>
      <p>Although Small Caps is the most frequent example of Large/Small, it does not adequately describe this sort of arrangement (Parity, a unicase typeface):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/EelPie_5058.png"></div><p></p>
