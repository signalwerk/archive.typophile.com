    html: |-
      <p>Right.<br>
      Hence unicase types, which are a mixture of majuscule and minuscule forms.<br>
      So, seeing as how the standard font encodings (for LCG) have upper and lower case, the problem for designers of all-cap or unicase typefaces is, what to do with the spare case?—do you leave it empty, ﬁll it with a duplicate of your singular alphabet, or a copy at a smaller size (“optical scaling”), for a caps-with-small-caps/unicase-with-small-unicase effect?</p>
