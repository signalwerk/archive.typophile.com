    date_raw: 1 Nov 2012 — 10:09pm
    votes: null
    html: |-
      <p>Lower case is the complement to upper case.<br>
      It traditionally comprised the minuscule characters in bicameral systems, but now also accomodates other alternates to majuscule glyphs, in typefaces which do not have minuscules.<br>
      Lower case characters have separate code points in Unicode, enabling them to be linked by the shift key on keyboard devices, or by other casing operations.</p>
