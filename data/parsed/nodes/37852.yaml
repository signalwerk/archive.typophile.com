      <p>Hi staybeautiful! ;-)</p>
      <p>Funny that you are looking for this font at the moment. It was yesterday when I asked myself the same question. Think I have started a thread with this theme also..<br>
      Definitely recently someone has made some changes in this logo so that it really looks good now!<br>
      And I wondered who could it be..<br>
      The new ad pages of Lauren now are one of the best.<br>
      I don’t believe that Fenice - at least using it as it is as a standard font - brings you any nearer.</p>
      <p>I am looking forward to see if there is anyone joining in here with new information about the making of this logotype.</p>
      <p>Good luck<br>
      Stefan</p>
