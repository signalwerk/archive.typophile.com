    <p>I have 2 questions</p>
    <p>FIRST<br>
    I am interest to purchase a Times New Roman-alike font which is used in many books such as published by Prentice Hall, McGraw-Hill, John-Wiley, etc.<br>
    I try to get some information about the font by reading through the book.<br>
    Mostly, they said that the name of the font is Times Roman and 10/12 point.<br>
    I assume that the font is made by Monotype.<br>
    So, I contact them.<br>
    They do give me clear information.<br>
    Then, I feel confidence to purchase a single Regular (or Book) style in TrueType format for PC and spent 26 GBP worth for it.<br>
    However, this thing makes me so confuse after saw that the font name in the font dropdown list toolbar of MS Office Word 2003 is TimesNRMT!!!<br>
    What is actually the difference between “TimesNRMT” and “Times-Roman” font?<br>
    Or, does font foundry of Times-Roman font is Monotype?<br>
    If yes, what the foundry name would be?<br>
    Linotype?<br>
    If anyone here has them worked for GGS Information Service, Inc, do you mind if I purchase the font directly from you for sure?</p>
    <p>SECOND<br>
    Does anyone recognize this font (image is attached)?<br>
    Similar / closest font would be OK.</p>
    <p>Thanks</p>
    <p>Tom<br>
    </p><div class="imageWrap"><img src="/files/untitled_4184.GIF"></div><p></p>
