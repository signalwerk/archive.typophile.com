      <p><a href="http://en.wikipedia.org/wiki/Times_Roman" title="http://en.wikipedia.org/wiki/Times_Roman">http://en.wikipedia.org/wiki/Times_Roman</a></p>
      <p>From what I understand, Times Roman is Linotype’s version of the font which Monotype calls Times New Roman. There are minor differences, like you’d find in different cuts of any typeface, but they are essentially the same to my eyes.</p>
      <p> - Lex</p>
