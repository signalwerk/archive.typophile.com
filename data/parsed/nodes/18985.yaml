    <p>Good morning everybody, </p>
    <p>this is the first time i'm participating in the website, it was a great pleasure to even learn its existence some time ago, not to mention the precious info/feedback one can come across over here. </p>
    <p>To the point; Morpheus is a font that was originally designed some ten years ago by Eric Oehler. It was published on the net as shareware and I've liked it from the beginning. I'm currently designing (with the agreement of the original creator) a Greek version. I've prepared a little preview image file to show for demonstration of the Greek character set. I haven't included the latin character set on the image file, this can be checked out by downloading the original font from <a href="http://www.dafont.com/morpheus.font" title="http://www.dafont.com/morpheus.font">http://www.dafont.com/morpheus.font</a> </p>
    <p>I would be gratefully welcoming your critique/comments/ideas regarding either the aesthetics or the readability of the font. </p>
    <p><a href="http://utopia.duth.gr/~vkarageo/morpheus-new.jpg" title="http://utopia.duth.gr/~vkarageo/morpheus-new.jpg">http://utopia.duth.gr/~vkarageo/morpheus-new.jpg</a></p>
