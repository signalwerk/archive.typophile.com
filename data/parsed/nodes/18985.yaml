      <p>Βαγγέλη, απο λιγο που μπορώ να δώ, νομίζω οτι τα δικά σου Eλληνικά δουλεύουν καλύτερα απο τα Greek Mason. Παρ'ολα αυτα η moroheus όντως μοιάζει απειλητικά με την mason του Branbrook που, απ'οτι βλέπω, ειναι προγενέστερη.<br>
      It seems to me that your Greek work better than Mason Greek. However, I find it extremely difficult to make a font like this to work well in Greek. May be the lack of history that annoys the eye, or I miss the conceptual link. Like making a Greek Gothic font. But to be honest, I m not a big fan of mason Greek either. Call it personal taste.<br>
      I don't want to sound discouraging at all though. By all means, keep on going. All the experiments are very useful; we may go through hardship and development to find ways to express new typographic qualities. Especially with our difficult (but interesting) alphabet.</p>
