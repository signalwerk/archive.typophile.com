    html: |-
      <p>Dear Spyros (i'm gonna write english like you did, simply politeness :)) thank you for your nice words. The truth is that i can obviously see your and Tiffany's point: it does resemble the general aisthetics of the pre-existing Mason. However, this font exists for like 10 years? and in the last 8 years that i know it i haven't come across any legal issues regarding it. If anyone has any knowledge i might, unwillingly, ignore would be welcomed to inform me. </p>
      <p>I'm definitely not an experienced typeface designer (it's only my third attempt and the first to be "accomplished" to such an extent), and i've not checked the character set of the greek mason version, i'm gonna do so though, in the first chance. </p>
      <p>As about the "gothic greek", yeah you're perfectly right about that, it doesn't look such a natural combination. However i can think of a couple of potential uses of such a font in the greek language: (RPG, dark/epic/historical logos/titles etc. I've actually already had a couple of emails with people that showed some interest in using it, i hope i'll soon have the chance to look at what they did). </p>
      <p>Last but not least, Spyros it's been a pleasure to come across you: i had the chance to check your page and your typefaces. I really liked starbeat ;)</p>
