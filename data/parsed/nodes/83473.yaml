      <p>The upper case K in this style was quite common in German blackletter faces so what you could do is looking for typefaces which derived or were influenced by the German blackletter tradition, such as German script faces from the first half of the 20th century, Jugendstil typefaces, etc.</p>
      <p>Fonts that feature ‘closed’ K/k’s (both UC and lc):</p>
      <p><a href="http://new.myfonts.com/fonts/storm/plagwitz/regular/" title="http://new.myfonts.com/fonts/storm/plagwitz/regular/">http://new.myfonts.com/fonts/storm/plagwitz/regular/</a><br>
      <a href="http://new.myfonts.com/fonts/canadatype/blackhaus/regular/characters.html" title="http://new.myfonts.com/fonts/canadatype/blackhaus/regular/characters.html">http://new.myfonts.com/fonts/canadatype/blackhaus/regular/characters.html</a><br>
      <a href="http://new.myfonts.com/fonts/rmu/trump-deutsch/book/characters.html" title="http://new.myfonts.com/fonts/rmu/trump-deutsch/book/characters.html">http://new.myfonts.com/fonts/rmu/trump-deutsch/book/characters.html</a><br>
      <a href="http://new.myfonts.com/fonts/adobe/voluta-script/regular/characters.html" title="http://new.myfonts.com/fonts/adobe/voluta-script/regular/characters.html">http://new.myfonts.com/fonts/adobe/voluta-script/regular/characters.html</a><br>
      <a href="http://new.myfonts.com/fonts/canadatype/serena/regular/characters.html" title="http://new.myfonts.com/fonts/canadatype/serena/regular/characters.html">http://new.myfonts.com/fonts/canadatype/serena/regular/characters.html</a><br>
