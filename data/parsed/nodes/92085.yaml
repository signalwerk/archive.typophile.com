    html: <p>TdJ - Fontlab doesn't know whether you're going to generate a TT or T1 font; it will set the contour directions as you instruct it, and will render the glyphs properly regardless. So if you draw a circle, it will appear solid regardless of its direction. If you draw two circles and drag so they overlap  (like a Venn diagram) the overlap will be black if the two circles are in the same direction and white if they're opposite. Doesn't matter if they're defined as PS or TT direction (Fontlab's terminology).</p>
