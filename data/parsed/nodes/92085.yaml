      <p>@Ryan - re: How FontLab displays nested contours -</p>
      <p>That's a function of how the rendering agent interprets the curves.  Same is true of any other font print or display.  All you have are a lot of bits in a file - to get them to look like something, there's a program that interprets what the bits mean. Different programs can interpret differently and give different results. And they do.</p>
      <p> - Herb</p>
