      <p><em>Fontlab doesn't know whether you're going to generate a TT or T1 font; it will set the contour directions as you instruct it, and will render the glyphs properly regardless.</em></p>
      <p>Note that you need to be careful with FontLab's auto PS/TT path direction tools if you have made a glyph in which a bounded white space is intersected by a line and you have not yet merged the paths. So, for example, if you have made a Cyrillic Ө and the bar is not yet merged with the O shape the auto path direction tools will tend to get confused and you end up with this sort of thing:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BarredOops_6393.jpg"></div><br>
      ______<p></p>
      <p>As to why the PS and TT formats use opposite path direction rules, I reckon when Apple developed TT they simply set out to do as many things differently from Adobe as possible. Hence quadratic rather than cubic beziers, and hence the different path directions. I don't know if actual lawyers were involved, or if Sampo and his colleagues simply decided to play it safe.</p>
