  html: <p>What programs would allow me to change how fonts are grouped, so that, say, all my Gothams will be listed as options under a single "Gotham" header instead of being listed separately (Gotham, Gotham Book, Gotham Black, etc.)? It would also be useful to split out dissimilar fonts that are currently under the same heading. For example, House's Las Vegas Nugget and Las Vegas Fabulous may have a thematic relationship, but they're quite distinct.</p>
