      <p>Now you're thinking! Howabout the fonts being hosted by vendors? The web browser would have a plug-in that would render the font. The web-designer just enters some sort of key that lets the page load the font off the vendor-hosted server. Perhaps the system would only use sub-sets of the font, so it would be much more difficut for people to devise a way to steal the faces. Remember, iTunes doesn't make it impossible to steal music, it just makes buying it much more convenient.<br>
      The trick has always been that there has to be a way for everyone to make money. </p>
      <p>For this crazy scheme to work, you'ld also have to get broad adoption of the plug-in. That could be tricky, because it would have to be something that IE/Firefox/Safari could include without licensing entanglements. </p>
      <p>Web designers could pay by buying a key for a certain number of hits on a particular font. Of course, piracy would be rampant, but everyone would still be making more money, which is the important thing. Some users would buy fonts from legit sources for the same reasons they do now for print.</p>
