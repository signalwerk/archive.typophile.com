    html: <p>What are they suggesting should happen to the font once it's downloaded? It seems like current functioning solutions use Flash as a rasterizer in some way. Otherwise, I would think that from a security standpoint the rasterizer would have to be built into the browser. Alternatively, the browser would have to be able to turn a font on, which is a very platform specific activity, and not one that many users would want. If a TT rasterizer was built into the browser, perhaps there would be an opportunity to create a special font format designed only for web use. This is just speculation, but if such a thing were possible, maybe there's a way this could work that wouldn't be completely opposed by type vendors.</p>
