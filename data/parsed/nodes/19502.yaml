      <p>I guess I'm off on a lark. I could imagine the proposed ideas being a big disappointment to type developers large and small. A big problem for the small foundries is actually being able to go after pirates. According to this scheme, if a font without proper licensing ended up on the web, anyone could download and use it. One could use Google or a custom spidering tool to just cruise the web and download any fonts out there. Yikes.</p>
