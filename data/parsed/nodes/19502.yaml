  html: |-
    <p>Crossposted...</p>
    <p>As recently mentioned on Tom Phinney's blog... </p>
    <p><a href="http://blogs.adobe.com/typblography/2006/03/fonts_on_the_we.html" title="http://blogs.adobe.com/typblography/2006/03/fonts_on_the_we.html">http://blogs.adobe.com/typblography/2006/03/fonts_on_the_we.html</a></p>
    <p>...the W3C has once again turned its attention to the issue of fonts and Web content.</p>
    <p><a href="http://lists.w3.org/Archives/Public/www-style/2006Apr/0070.html" title="http://lists.w3.org/Archives/Public/www-style/2006Apr/0070.html">http://lists.w3.org/Archives/Public/www-style/2006Apr/0070.html</a> </p>
    <p>A couple of people are already suggesting that the W3C CSS 3 specs allow TTF's to be linked to Web pages in exactly the same was as images are now linked. </p>
    <p>Discussion - <a href="http://lists.w3.org/Archives/Public/www-style/2006Apr/" title="http://lists.w3.org/Archives/Public/www-style/2006Apr/">http://lists.w3.org/Archives/Public/www-style/2006Apr/</a></p>
    <p>The W3C would love to hear from those making fonts for a living, or even for fun. It would be a shame for them to make a decision on this without those involved in type design voicing their support, opinions or concerns. </p>
    <p>Cheers, Si</p>
  html_clean: |-
