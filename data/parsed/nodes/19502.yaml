      <p>Here's a survey I forwarded to the W3C which I felt might be useful in gathering the opinions of type designer's on font embedding. </p>
      <p><em>Font embedding on the Web.</em></p>
      <p>The W3C is again looking at technologies for delivering fonts with Web content. We’re trying to assess attitudes of those in the type design community.</p>
      <p>1. What best describes your involvement in type design? </p>
      <p>A. I’m an active type designer producing fonts for commercial licensing and distribution, deriving some income from type design.<br>
      B. I’m an active type designer producing fonts largely for my use in my own projects or for fun and derive no direct income from my type design activities.<br>
      C. I’m involved in the type design business (eg. foundry owner, reseller or tools maker) but am not actively designing type myself.<br>
      D. I’m a consumer of typefaces and am not involved in their creation. </p>
      <p>2. If you’ve followed issues related to typography on the Web why do you think font embedding technologies such as Microsoft WEFT (EOT) or Bitstream TrueDoc (PFR) failed to excite the Web design community? Pick one or more… </p>
      <p>A. Lack of a cross-platform and cross-browser solution.<br>
      B. System fonts are more readable and legible than most other fonts that could be embedded.<br>
      C. It’s too much hassle creating embedded fonts vs. making static bitmap text in a image editor like Photoshop.<br>
      D. Flash and PDF offer a better solution than HTML plus embedded fonts.<br>
      E. The fact that some type designers and foundries campaigned against Web font embedding or changed their licenses to prohibit embedding fonts using these technologies.<br>
      F. The extra bloat embedded fonts add to Web pages.<br>
      G. The fact that these technologies are proprietary and not open.<br>
      H. Other. Specify…</p>
      <p>3. As a font maker do you currently support (through your standard font license, embedding permissions, or FAQ) embedding of your fonts in Web content?</p>
      <p>A. Yes, we allow embedding and make no restriction regarding technology or Web use.<br>
      B. Yes, we allow embedding in Web content but only when the mechanism is considered secure.<br>
      C. No, we do not allow embedding of fonts within Web content.<br>
      D. We don’t have a policy on this.<br>
      E. Other. Specify…</p>
      <p>4. As a font maker what are your biggest issues or concerns with embedding fonts in Web content? Pick one or more…</p>
      <p>A. Extraction and reuse of embedded fonts.<br>
      B. Little likelihood of licensing fonts to users for use with this technology.<br>
      C. Customer support issues.<br>
      D. That people will just ignore license clauses that deal with Web font embedding.<br>
      E. Other. Specify…</p>
      <p>5. If a new Web font embedding technology were proposed what would your priorities around it be? Pick one or more…</p>
      <p>A. That it be an open standard allowing anyone to follow a spec to make tools that create embedded font objects and browsers and other software that enables the extraction of usable fonts from the embedded font objects.<br>
      B. That it be a closed, licensed system, that would help reduce (although not eliminate) the extraction of usable fonts from embedded font data.<br>
      C. That it require mandatory font subsetting, removal of hints, kerning and other data, to make extracted fonts less useful.<br>
      D. That it require a new opt-in embedding permissions setting that identifies fonts licensed for embedding within Web content.<br>
      E. That it only support digitally signed fonts making it less likely that an unauthorized person has changed the font’s embedding permissions.<br>
      F. Other. Specify…</p>
      <p>6. If a new Web font embedding technology were proposed that allowed public domain, freeware or open source fonts to be zipped up and attached to Web pages how would you feel? Pick one or more…</p>
      <p>A. That’s fine with me, I’d support that.<br>
      B. I’d be concerned that commercial fonts would be mistakenly used in this way.<br>
      C. I think the system would be deliberately abused and commercial fonts would be deliberately posted.<br>
      D. Don’t care.<br>
      E. Other. Specify…</p>
      <p>7. If the system identified in 6, required that fonts be set to “installable embedding” how would you feel? </p>
      <p>A. Fine with me, I’d support that.<br>
      B. I think the system would be deliberately abused by people flipping the bits in commercial fonts or by people renaming commercial fonts and setting them to installable embedding.<br>
      C. Don’t care.<br>
      D. Other. Specify…</p>
      <p>8. Any other ideas, comments or suggestions? Specify…</p>
