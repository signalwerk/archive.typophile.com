      <p>&gt;Why is that? I mean, a font to be linked to AND downloaded, AND installed, something could look at the embedding bit somewhere along the line,,,, even if this is not embedding.. . . . . … no?</p>
      <p>...because it's not embedded within the document file or tied to it in any way. </p>
      <p>Hakon has suggested* that if a font is set to 'installable' embedding then the font should be considered freeware. Not sure that's totally in line with the spec, and it's certainly open to abuse, but he's free to make that argument.  </p>
      <p>Embedding permissions ... </p>
      <p><a href="http://www.microsoft.com/typography/otspec/os2.htm#fst" title="http://www.microsoft.com/typography/otspec/os2.htm#fst">http://www.microsoft.com/typography/otspec/os2.htm#fst</a> </p>
      <p>Cheers, Si</p>
      <p>*In a W3C-Style posting made yesterday by Håkon Wium Lie... </p>
      <p>"I would argue that, while the embedding bits predate the web, the<br>
      permission for level 4 fonts to be "permanently installed on the<br>
      remote system" [1] is granted even without the font file being<br>
      "physically embedded" into a document. It's easy enough to create a<br>
      dummy document which "embeds" the font -- I could even argue that a<br>
      zip file provides a level of embedding. So, if a TrueType level 4 font<br>
      family is being served on the web, I think it's reasonable to use it<br>
      to display documents. (I wouldn't install it permanenty on the system,<br>
      though, but treat it as a cached resource.)"</p>
