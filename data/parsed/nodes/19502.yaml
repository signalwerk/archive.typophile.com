      <p><em>I am surprised at the small number of responses here on this important topic.</em></p>
      <p>Why wouldn't the W3C do serious outreach, consulting with stakeholders, and seek input and approval from an organization representing the interests of font developers?</p>
      <p>There is no "AIGA" for type designers, but surely something as far reaching as this merits, for instance, a special committee of ATypI?!</p>
      <p>This could also be a conference topic at TypeCon in August.</p>
      <p>I'm not familiar with the workings, but if Microsoft, Adobe et al can get together with the Unicode consortium to develop the OpenType format, there must be some kind of informal protocol to build on.</p>
      <p>It would be reckless of the W3C to proceed unilaterally with something that could devastate an entire industry, and then say "nobody objected to our plans", based on response in online forums.</p>
      <p>Si, tell these guys not to rush.</p>
