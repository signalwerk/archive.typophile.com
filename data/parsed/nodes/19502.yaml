       &gt; wish list.</p>
      <p>This is also my experience. There are thousands of TrueType font<br>
      families out there. Some examples:</p>
      <p>  <a href="http://www.fontfreak.com/fonts-g2.htm" title="http://www.fontfreak.com/fonts-g2.htm">http://www.fontfreak.com/fonts-g2.htm</a><br>
        <a href="http://www.1001freefonts.com/fonts/pfonts5.htm" title="http://www.1001freefonts.com/fonts/pfonts5.htm">http://www.1001freefonts.com/fonts/pfonts5.htm</a></p>
      <p>Typically, four truetype files are zipped up into a file which --<br>
      roughly speaking -- has a size similar to a photograph. Some of the<br>
      fonts have legal restrictions that prevent their use, some only cover<br>
      the English alphabet, and some are poorly designed. However, there are<br>
      also good-looking, freely usable fonts out there. These fonts<br>
      represent an untapped resource for typography on the web.</p>
      <p>- - - - - - - - -</p>
      <p>So, the elaborate schemes involving micropayments to type deisgners don't seem to be on the table right now.</p>
