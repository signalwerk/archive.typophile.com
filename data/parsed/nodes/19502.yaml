      <p>Aaron is correct, if online publications were made up of static bitmap pages then you could draw a comparison, but as they’re not I think comparing the W3C proposals to print publications use and licensing of fonts is a red herring. </p>
      <p>Onto the EULA issue - obviously most font vendors allow embedding of fonts. “Embedding” is reasonably well understood as a principal, and is explicitly defined in many EULA’s as well as in the TrueType and OpenType specs. It’s the encapsulation of a font (or derivative thereof) in a document file – PDF, .DOC, .PPT etc., </p>
      <p>What the W3C is talking about is not embedding – it’s the linking of loose or zipped up font files to Web pages which are downloaded and temporarily installed to render content. This is not embedding, so the embedding provisions of the specs and EULAs can not apply. </p>
      <p>This is not “embedding”, this is “redistribution.” The EULAs attached to commercial fonts do not allow redistribution. Hakon and co. realize that this means that most fonts will not be legally usable under this scheme. However, they point to the large number of freeware fonts out there as being usable under the scheme, arguing that although not perfect they are better than nothing.  </p>
      <p>I think the bottom line is as follows...</p><ul><br>
      <li>For font makers the fear has to be that if adopted and implemented web designers will not limit themselves to legitimate freeware fonts. </li></ul><p></p>
      <p></p><li>For web developers the complaint should be that the scheme limits their creativity to freeware fonts.<br>
      There are other problems with the proposals, but I think focusing on these two issues, might be the best approach.</li><p></p>
