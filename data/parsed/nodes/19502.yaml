    html: |-
      <p>I personally think that a web downloading system will be worthless unless all or most foundaries will allow their fonts to work with it. And I can't see that happening if it means the font that I buy and use on my web site winds up becoming installed on the computer of every person who visits my site.</p>
      <p>The way I see it, the browser has to download the font, and render it, without ever feeding it into the operating system of the user. For one thing, if I visit a page with four fonts I don't have, and I am forced to download and install them, then I would balk at the delay.</p>
      <p>The only solution I see is that the font is handled within the browser in a manner that keeps it off the user machine. No doubt this will not be a perfect solution to piracy of the fonts, since one could build a pseudo-browser that would do nothing other than harvest fonts off websites. But this wouldn't be much worse than the current piracy where fonts are stolen under the current "sharing" methods.</p>
      <p>Of course, this means browsers would have to be greatly improved, but with current computing capabilities this should be possible, if things like ATM worked on 286 computers.</p>
