      <p>Sii, do you think there will be some way for Windows to activate fonts in a particular application context? Without it, I just don't see how this could ever work. I mean, no one's going to let their browser put a font in C:\Windows\Fonts\. </p>
      <p>On the Mac, this could be implemented today. A browser could simply download the font to it's cache and activate it with the same API Adobe uses for the fonts in /Library/Application Support/Fonts/. If the browser downloaded a font with 'unexpected featues', the worst it could (hopefully) do is crash the browswer.</p>
