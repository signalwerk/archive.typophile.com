      <p>&gt;I realize that this has probably been discussed a lot over the years, by people much more knowlegable than I. It’s really one of the great outstanding problems in typography.</p>
      <p>Actually I don't think it's been given much attention in recent years. It got a lot of coverage back in the early days of the Web (mid to late 90's) but fell off the radar. Now it's back on the W3C's agenda, and the impression I get is that things will move quite quickly, especially if no one from the typographic community raises any objections. </p>
      <p>I think Web designers also need to let their voices be heard. Will they be happy with a situation that limits them to freeware fonts? How about corporate marketing departments that will have to decide if they're willing to post their expensive custom fonts on their Web site? At least they have a choice - those companies using off-the-shelf fonts in their identity work won't have the option of posting commercial fonts in this way.</p>
