      <p>None of the solutions that involve the browser and OS will work for anyone. It would be illegal for people to use it.</p>
      <p>Analogies to other industries, other media, are red herrings. We are having to reinvent things for the internet. Fonts are software. In print they are no longer software, easy. On the computer, they remain in their original state. We need to think of this as a new problem, not a re-staging of an old story.</p>
      <p>PHP right now can render a (rasterized) image using any font you want. That's how a lot of type testers work. I don't see why a similar technology can't be used to make fonts work more generally on the web. It's secure since it's server side, making us fonties happy and it gives the web designer what he/she wants. I could see this just being a back-end function, something like settype (fontfilelocation, size, style); and it could even be used with CSS somehow. I know this could be done, it would just take work. They could resolve many issues, but it has to be a function of back-end programming, not user and OS and browser based. </p>
      <p>Now how this would relate to a EULA is beyond me, perhaps a license for web use specifically.</p>
      <p>Aaron.</p>
