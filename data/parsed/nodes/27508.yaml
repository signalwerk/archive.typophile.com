    date_raw: 14 May 2008 — 7:46am
    votes: null
    html: '<p>James, Linotype has a DVD called <a href="http://www.linotype.com/98650/themanofblackandwhiteadrianfrutigerdvd-font.html" rel="nofollow"><cite>The Man of Black and White - Adrian Frutiger</cite></a> that is quite interesting in that it touches other aspects of Frutiger’s life apart from type design. It’s not too long (about 40 minutes) and I quite enjoyed it. As far as I know this is as close as it gets to a biography, but keep also in mind that the man wrote a lot of books: I recommend you try to find a copy of <cite>Type Sign Symbol</cite> through some library, it’s impossible to find one to actually buy. Mark Simonson also posted some pictures from the book in his recent <a href="http://www.marksimonson.com/article/179/frutiger-talk" rel="nofollow">Frutiger talk</a>.</p>'
