      <p>Oops! I was thinking of Frutiger when I posted the pic of the Concorde, but I think the idea (and shape) stands. Frutiger is French-ish, to use an absolutely awful expression that I may have just made up. Univers is not some old German clunker, it's sleek, new, sexy, and yes, cool...in a late 60's French-sort-of-way. It's power was in what it replaced, which is hard to know about today.</p>
