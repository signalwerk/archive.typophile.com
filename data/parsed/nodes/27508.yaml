      <p>Yesterday I got the Linotype newsletter celebrating Adrian Frutiger’s 80th birthday. Amongst other things, there’s an <a href="http://www.linotype.com/en/2705-27594/may2008.html" rel="nofollow">article by Akira Kobayashi on Univers vs. Helvetica</a>. You’ll see how Univers’ spacing is much wider than Helvetica, which supposedly makes it more fit for text settings. More open counterforms and finer details give it that sharp look, which may be perceived by some people as overly “cold” – but not to me.</p>
      <p>(As a side note: Linotype’s Web site is terrible, I tried finding that article and could not figure for the life of me where they put it. I ended up going back to the newsletter, in frustration).</p>
