    html: |-
      <p>I've heard over ad over from designers in my area that their default body copy choice is Univers.  Their reason for choosing such is that they consider Helvetica totally clean and neutral, but Univers is *almost* helvetica, but not quite.</p>
      <p>I think it's that tiny bit of cayenne pepper in the pot of spaghetti sauce that gives it a slight kick - it's not much but it doesn't have that skeleton feel helvetica can often have.</p>
      <p>Maybe that's what he meant…</p>
