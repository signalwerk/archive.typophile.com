      <p>Hi Henry</p>
      <p>To get to the heart of Spiekermann's statement, I suggest you try setting the same text, preferably one in a foreign language* (maybe a hundred words at about 9 point and with a reasonable line length and leading value) in both Univers and Helvetica; print them out and compare them side by side. As you look at them, try and gauge them in relative terms of function, temperature or visual edge - which of the two appears to be more rational or more humanistic? which appears warmer or cooler? or softer or harder?<br>
      * if you can't read it for sense, it will help you look at it objectively.</p>
      <p>I gave up long ago on expressing a preference for either one of these particular faces, but there are many <em>typographers</em> I know and respect who feel passionately about these things. There are also many alternatives to both Univers and Helvetica, since we are now nearly fifty years beyond their original release dates. Having said that, Bram's oblique reference to <a href="http://www.bertholdtypes.com/bq_library/390030.html" rel="nofollow">AG </a>should not go univestigated.</p>
