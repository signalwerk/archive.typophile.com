    html: <p> Andrew, don't get hung up on short phrases, or kerning pairs - spacing first, kerning after. Just get some decent runs of text and go from there. It doesn't actually  matter whether the font is for text or display usage, a decent run of text will show up the character and spacing anomalies - short phrases won't. <br> <br>If you want to go all the way - in an abstract manner - generate every character next to every other. Again the anomalies are apparent. </p>
    html_clean: <p> Andrew, don't get hung up on short phrases, or kerning pairs - spacing first, kerning after. Just get some decent runs of text and go from there. It doesn't actually  matter whether the font is for text or display usage, a decent run of text will show up the character and spacing anomalies - short phrases won't. <br> <br>If you want to go all the way - in an abstract manner - generate every character next to every other. Again the anomalies are apparent. </p>
