    html: "<p> &gt; spacing first, kerning after. <br> <br>That will indeed cover you 90%, at least in the mainstream. <br>But for that last stretch of quality, they really have to be done in parallel (as much as feasible). Certainly, few designers do that, but that's only because even fewer users care. <br> <br>BTW, kerning even affects the letterforms themselves, not just the sidebearings. <br> <br>&gt; It doesn't actually matter whether the font is for text or display usage <br> <br>? <br>I think it matters a huge deal. <br>Especially when you consider, for example, that cap-cap setting is much more common in display. But there are in fact deeper differences between display and text, even in spacing/kerning. <br> <br>&gt; generate every character next to every other. <br> <br>That's of course completely impractical. <br>Which is exactly why you need *both* test strings and long \"real\" text to arrive at good results without spending 20 years on it. <br> <br>So, Andrew: it's not that simple.  :-/ <br> <br>hhp </p>"
    html_clean: "<p> &gt; spacing first, kerning after. <br> <br>That will indeed cover you 90%, at least in the mainstream. <br>But for that last stretch of quality, they really have to be done in parallel (as much as feasible). Certainly, few designers do that, but that's only because even fewer users care. <br> <br>BTW, kerning even affects the letterforms themselves, not just the sidebearings. <br> <br>&gt; It doesn't actually matter whether the font is for text or display usage <br> <br>? <br>I think it matters a huge deal. <br>Especially when you consider, for example, that cap-cap setting is much more common in display. But there are in fact deeper differences between display and text, even in spacing/kerning. <br> <br>&gt; generate every character next to every other. <br> <br>That's of course completely impractical. <br>Which is exactly why you need *both* test strings and long \"real\" text to arrive at good results without spending 20 years on it. <br> <br>So, Andrew: it's not that simple.  :-/ <br> <br>hhp </p>"
  - id: 1699
