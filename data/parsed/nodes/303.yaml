    date_raw: 16 Apr 2002 — 7:10pm
    votes: null
    html: "<p>Andrew, start with Tracy's system: <br><a href=\"http://www.linesandsplines.com/tracy/\" target=\"_top\">http://www.linesandsplines.com/tracy/</a> <br> <br>If/when that runs out of steam for you (different people have a different tolerance/appreciation for quality), you have to decide how much further to take the \"quatitative\" approach. I personally take it very far - like in assigning spacing values to serifs. <br> <br>Depending on how far you take quantification (noting that it has to end somewhere), you'll be left relying on the \"eye\" to different degrees. The more you rely on the eye, the longer it takes, and the more error prone it is. But, again, it's not something to be avoided, just balanced judiciously against the \"math\". <br> <br>Rely on real text only when you can't go any further with test strings. There are many reasons for this, not least that your font might be used for a language you don't even know exists. <br> <br>hhp</p>"
    html_clean: "<p>Andrew, start with Tracy's system: <br><a href=\"http://www.linesandsplines.com/tracy/\" target=\"_top\" class=\"link-external\">http://www.linesandsplines.com/tracy/</a> <br> <br>If/when that runs out of steam for you (different people have a different tolerance/appreciation for quality), you have to decide how much further to take the \"quatitative\" approach. I personally take it very far - like in assigning spacing values to serifs. <br> <br>Depending on how far you take quantification (noting that it has to end somewhere), you'll be left relying on the \"eye\" to different degrees. The more you rely on the eye, the longer it takes, and the more error prone it is. But, again, it's not something to be avoided, just balanced judiciously against the \"math\". <br> <br>Rely on real text only when you can't go any further with test strings. There are many reasons for this, not least that your font might be used for a language you don't even know exists. <br> <br>hhp</p>"
