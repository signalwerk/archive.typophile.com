    html: "<p>There's a difference between gobs of \"real\" text (certainly a very useful thing), versus *test* strings/paragraphs. In terms of test text, Andrew might benefit from a number of things, including possibly this type of thing: <br> <br><a href=\"http://www.microsoft.com/typography/links/news.asp?NID=2454\" target=\"_top\">http://www.microsoft.com/typography/links/news.asp?NID=2454</a> <br> <br>BTW, I've settled on calling it \"superpangram\" instead of \"metagram\". <br> <br>hhp</p>"
