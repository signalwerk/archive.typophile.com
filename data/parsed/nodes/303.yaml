  html: "<p> Hi, I'm new to both creating type faces and the typophile forums. I was just wondering:  <br> <br>Does anyone have a good block of text to check letter spacing?  <br> <br>How about a phrase that's good for checking kerning pairs?  <br> <br>Any help would be greatly appreciated. </p>"
