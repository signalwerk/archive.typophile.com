      <p>If you have a laptop/iMac, the video cable may have come loose and need to be reinserted—which usually means sending the system to apple to be ripped open (most laptop models are <em>glued</em> together). If you can send a normal video signal to an external monitor that’s a good sign, if external output does the same stuff, the video chip is fried and you’ll likely need a new motherboard. If you have a desktop, try replacing the display cable.</p>
      <p>In my experience, the Apple store in Clarendon will probably be the easiest in the area to get a repair appointment at. If they’re booked up, try logging in at midnight to get an appointment.</p>
