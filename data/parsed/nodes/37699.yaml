    <p>In the past few days, I have been plagued by a weird screen problem. It shows up on Mac interface items like Desktop, icons, menus, splash screens, etc,. A weird pattern of hash marks superimposes it self over the above items driving me nuts!<br>
    So far, I have booted from other volumes, run a plethora of utilities, zapped my Pram, rebooted all to now avail. None of my utilities show any problem. Except for where the mouse is pointing, all application windows look fine. Anything on the desktop or any navigation item including the Dock gets whammied, though. The splash screen gets a full dose for all aps.<br>
    The problem began after waking from sleep last friday (not my sleep, the computer's sleep).</p>
    <p>Here are a two screen grabs:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/drive-icons2_5359.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/inDsplash2_6546.png"></div><p></p>
    <p>Anyone seen this before or know how to fix it?</p>
    <p>ChrisL</p>
