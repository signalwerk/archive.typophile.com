      <p>If I had to guess, I'd say the video card's dead (possibly its memory) or overheating. Best bet would be to run the Apple Hardware Test from the OS DVD that came with the G5:<br>
      <a href="http://www.thexlab.com/faqs/aht.html" title="http://www.thexlab.com/faqs/aht.html">http://www.thexlab.com/faqs/aht.html</a></p>
      <p>Run the extended test. This may or may not be able to diagnose a bad video card – it may appear to function correctly to the computer, but produce a garbled visual output – but it should rule out other things, such as bad system memory (though you'd most likely be getting kernel panics with bad memory).</p>
      <p>Assuming that comes up fine, it's the graphics card. If memory serves me correctly, the G5's had an Nvidia FX5200 64MB dual DVI. Here's a guide for swapping out the card (it's really easy):<br>
      <a href="http://manuals.info.apple.com/en/PMG5_AGP:PCI_Card_DIY.pdf" title="http://manuals.info.apple.com/en/PMG5_AGP:PCI_Card_DIY.pdf">http://manuals.info.apple.com/en/PMG5_AGP:PCI_Card_DIY.pdf</a></p>
      <p>Before you go out and buy a replacement, try this: switch off the G5 at the plug (but leave it plugged in so it's earthed) open up the case, take out the graphics card and <em>use an air duster to thoroughly clean out its heatsink</em>. Put it back in, boot up and check to see if the corruption's gone. Frequently the heatsinks clog up after a couple of years under a desk, making the card overheat and causing this sort of visual corruption. Give the rest of the G5 case a good blast of air while you have it open, too.  Oh, and make sure to keep the air duster vertical, you don't want to spray freezing propellant everywhere ;) (Though it shouldn't be harmful.)</p>
      <p>If you do have to replace the graphics card, you can use a good few different models as long as OS X has the drivers for them, but it'd probably be easiest to use the same make and model again. You should be able to pick up a cheap retail FX5200 128MB dual DVI (non–Mac–specific) for around $50 at the most.</p>
    html_clean: |-
