    html: <p>Ok. You could try a Safe Boot. To do this you restart your computer holding down the Shift key before the startup chime. A Safe Boot resets certain system caches. Once the system is up with the red Safe Boot label on the login screen, check to see if the problem is still occurring, then restart normally.</p>
