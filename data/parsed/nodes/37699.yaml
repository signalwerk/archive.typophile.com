      <p>Sorry I'm late getting back to this, Chris!  If money's tight and you don't mind a bit of work, try this:<br>
      <a href="http://www.giantmike.com/G5_9800_fix.html" title="http://www.giantmike.com/G5_9800_fix.html">http://www.giantmike.com/G5_9800_fix.html</a></p>
      <p>Back when I did PC repair I noticed a lot of machines would have far, far too much thermal compound placed between the heatsink &amp; CPU, which would subsequently gunk up, go off and actually make the heat transfer worse! I wouldn't bother with the fancy silver or ceramic stuff, though, tests have shown that it's no more effective than normal compound, it just costs ten times more and looks prettier in the packet.</p>
      <p>Remove the heatsink, clean off all the gunk, thoroughly clean the fan &amp; heatsink (if the fan still even works?), apply a tiny amount of thermal paste (scrounge it off a geek friend) and reapply the heatsink. Leave the side of the case off if you can, so the heat doesn't build up and you can see if the graphics card's fan still works.</p>
      <p>If it seems to make a difference, it may be worth shelling out for a new heatsink such as this:<br>
      <a href="http://www.arctic-cooling.com/vga2.php?idx=125" title="http://www.arctic-cooling.com/vga2.php?idx=125">http://www.arctic-cooling.com/vga2.php?idx=125</a></p>
      <p>(Though I'm not sure that'll fit in the G5 case.)</p>
      <p>Worth a try on the off chance it fixes it? If it works you've wasted a bit of time but saved $150, assuming you can send the unopened card back.</p>
    html_clean: |-
