      <p>The thing is, it was working for him before. So, I was thinking that the system was now in a state of temporary weirdness. Safe Boot is often recommended by Mac techs because it is an Apple-designed, safe, mechanism for resetting certain specific settings. My guess is that if you're already running 10.4.10, you'll be in a position where you might need to start swapping bigger things out to diagnose the problem--really stuff that's outside the scope of this type of forum. The fact that these are standard screen shots implies that the issue is software related. Apple's support forums might be a good bet because there may be people who see far, far more Mac issues than we do. With more eyeballs there's a better chance someone has seen this before. </p>
      <p>If it were me, I would probably also try resetting system caches using a free utility called OnyX. I've never known <a href="http://www.apple.com/downloads/macosx/system_disk_utilities/onyx.html" rel="nofollow">OnyX</a> to cause any problems, but there are lots of options to do goofy things. </p>
      <p>I also obsessively back up my hard drive with a free cloning utility called Carbon Copy Cloner. It creates completely bootable backup partitions. That would be handy in a case like this because one could boot a recent backup and test to see if the problem occurred. I recently survived a hard drive failure on my laptop without losing any data.  My backup disk was a month old, but my email was still on the server and my other backup files had copies as well. </p>
      <p>I guess my final comment on this is... yeah, it's weird. Gremlins maybe?</p>
