      <p><cite>My impression is that the cobbled together books satisfy a vanity of getting to choose what to include, but the end result is not the equal to the texts published on their own.</cite></p>
      <p>Speaking from past experience of trying to find a decent textbook to assign for college classes: for the reasons you described and others as well, the textbooks published on their own are often rubbish. The author probably has more knowledge of or interest in some parts of the subject, and might explain those well, but the rest of the book is likely to be an uninspired rehash of what the author found in other textbooks. By picking and choosing, you can get something that is not cohesive, but at least each of the parts is adequate. In a good book the whole should be much more than the sum of the parts, but that isn't happening in either case.</p>
