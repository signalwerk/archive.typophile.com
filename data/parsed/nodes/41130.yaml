      <p>Textbook design has changed (like everything else) in the past couple of decades. College is very different from school, and the lists within disciplines are very different.</p>
      <p>One unfortunate trend that developed in the 1990s is custom publishing, which allows a professor to compile content from various sources and get custom books. This segment has grown and the result is that content gets hastily fitted to boilerplate designs. On the other end of the spectrum you have the blockbuster books that tend to look like bad magazine design where every page is different and full of photoshop effects and noise.</p>
      <p>Throughout this transition the editorial quality has also shifted. Manuscripts are no longer developed (developmental editors are no more) and the signing editors no longer read them. Design standards have also taken a back seat. As the imprints are sold, repacked and resold, the skilled and better payed workers are replaced with less qualified workers that don't have the same standards.</p>
      <p>You also have the churn associated with the education lists as fads in education style come in and go out. Whole Learning? Anyone?</p>
      <p>All this is to say, if you are interested in designing books that serve children well you may find yourself with few collaborators.</p>
      <p>If I were you I would buy a few used books in the specific area of interest. Look at how they are revised because the industry runs on the forced roll where a new edition is foisted on the students whether they need it or not. Very often they are dressing up old content with very few revisions so the old design/content won't vary much.</p>
      <p>I think the industry really needs to rediscover basic design standards. The industry is much more political than you might guess, and large states that represent large adoptions are often given a good deal of control over the content. </p>
      <p>Another opinion:<br>
      <a href="http://www.edwardtufte.com/bboard/q-and-a-fetch-msg?msg_id=0000hB" title="http://www.edwardtufte.com/bboard/q-and-a-fetch-msg?msg_id=0000hB">http://www.edwardtufte.com/bboard/q-and-a-fetch-msg?msg_id=0000hB</a></p>
