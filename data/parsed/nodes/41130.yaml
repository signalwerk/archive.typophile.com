    html: <p>The material is from existing textbooks, so the material is as up-to-date as the existing editions used. My impression is that the cobbled together books satisfy a vanity of getting to choose what to include, but the end result is not the equal to the texts published on their own. The cost of making custom books is competitive, but not always less. You can't pick and choose content and expect a cohesive result. Authors have voices, and books have apparatus and elements that differ from book to book.</p>
