    html: |-
      <p>ok so we've pretty much made the call on the mark, and changed the typeface to something more playful as this is a leisure brand we want to promote good fun times. </p>
      <p>Basically we cant decide out of these two options, the version with two extended "R"s seems more consistant and unified across the word, but seems to be less readable particularly at the smaller size, agree?</p>
      <p>The left version is more readable but does the single raised ligature seem out of place without both?</p>
      <p>these are the two types of feedback we've got from almost everyone so Im putting it back to you guys for any thoughts. thanks again.<br>
      george</p>
