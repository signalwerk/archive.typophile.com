    html: |-
      <p>Hey George,</p>
      <p>Don't let it get to ya, your on your way man. Clichés are ok they just need some adjustment to work. Try experimenting with the shape you have, take some tranparent paper and lay over your logo and sketch for a while. What I noticed in your logo was this interresting countershape. If you don't mind I removed the bottom swirl. It now looks a bit like the Ripcurl logo, but what I try to show is that you can take your shape somewhere else. It's not where you start but where you end up. There are some interviews with Paul Rand on youtube <a class="freelinking external" href="http://www.youtube.com/watch?v=Ta4ef1xBeMA" rel="nofollow">http://www.youtube.com/watch?v=Ta4ef1xBeMA</a> inspiring designer with simplistic logical thinking. </p><div class="imageWrap"><img src="http://typophile.com/files/logo_5682_4660.gif"></div><p></p>
