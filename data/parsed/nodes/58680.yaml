  html: |-
    <p>Hi there.</p>
    <p>Ive basically convinced myself this logo is finished, but then again Ive only shown it to a few people so would appreciate any feedback you have.</p>
    <p>Its for a group-travel website/app.<br>
    The "Stormer" in the title is reffering to "brainstorming" however I avoided using imagery that relates to brainstorming as its usually pretty cliche.</p>
    <p>So have gone literal on it and used the tornado type of storm which Im pretty happy with.</p>
    <p>The typeface is National.</p>
    <p>thanks for your time and feedback obviously welcome.<br>
    George</p>
