    <p>The March edition of the Metal Type newsletter is now out.</p>
    <p>This month’s video was filmed at the National Railway Museum in York, showing a huge steam locomotive that was built for the Chinese railways in 1935.</p>
    <p>The big Metal Type news this month is the opening of the “Library” - a new section of the site, containing lots of useful documents, instruction manuals, etc. in PDF format.</p>
    <p>There’s also all 12 copies of “Galley Gab” magazine available for download. You can browse individual issues or download all 12 in a Zip file.</p>
    <p>Click the link below to take a look:</p>
