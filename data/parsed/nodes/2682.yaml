    html: <p>Eric, you might look at non-condensed types. When you are dancing on the edge of readability, non-condensed type actually saves space over condensed type. (Among other things,) condensing a type emphasizes the vertical strokes and de-emphasizes the horizontals. This makes the face more difficult to read, so you have to increase the type size. All other things equal, I can usually save 5-10% by switching to a non-condensed version. <br> <br>Of course,  the whole point of legal "fine print" is to make it difficult to read, so that might not be an issue. Extra points if you screen it back 50%.</p>
