    date: 2004-01-12T13:40:00
    date_raw: 12 Jan 2004 — 1:40pm
    votes: null
    html: <p>Legal copy, eh? Well, legibility probably the real concern then, right? It doesn't have to be <i>easy</i> to read, merely capable of being read. Helvetica Condensed is used on all of the Terms and Conditions of legal/ contractual documents I handle where I work. I don't believe that they are 4 or 5 pt, but more like 6-8, and it works. Give it a try. It's not a type-saavy choice, but it's got what you need, and doesn't have much character to get in the way of legibility. However, glancing at the last few posts, I'm inclined to agree with Jay about dancing on the line when you get as small as you say you will. <br> <br>Also, if you're working on a legal document, check how the type reproduces after faxing, which may eliminate some contenders for you. Helvetica Condensed survives enough for purposes of the company I work for.</p>
    html_clean: <p>Legal copy, eh? Well, legibility probably the real concern then, right? It doesn't have to be <i>easy</i> to read, merely capable of being read. Helvetica Condensed is used on all of the Terms and Conditions of legal/ contractual documents I handle where I work. I don't believe that they are 4 or 5 pt, but more like 6-8, and it works. Give it a try. It's not a type-saavy choice, but it's got what you need, and doesn't have much character to get in the way of legibility. However, glancing at the last few posts, I'm inclined to agree with Jay about dancing on the line when you get as small as you say you will. <br> <br>Also, if you're working on a legal document, check how the type reproduces after faxing, which may eliminate some contenders for you. Helvetica Condensed survives enough for purposes of the company I work for.</p>
