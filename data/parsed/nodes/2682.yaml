    html: "<p>Thanks, fans. After putting a few that I own to the test, I realized that I also need italics and at least one heavier weight. DIN condensed doesn't have italic versions and neither does Bell Centennial. Sorry I didn't mention this earlier. <br> <br>EDIT (one more time): I should have mentioned that this font will be used for legal copy. So I want a condensed type that I can cram as much copy into the space as possible.</p>"
