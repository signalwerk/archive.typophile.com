      <p>PS stands for PostScript, MT for Monotype. George Thomas correctly states that Times New Roman PS MT is Times New Roman from Monotype. The Linotype/Adobe-version is called Times. Times was originally based on the outlines of the Linotype version of Times New Roman, which is called Times Roman. The various versions of Times New Roman on the one side and Times and Times Roman on the other can be distinguished by the top left corners of the counters (the white interior space) of the capitals such as B, E and F. The Monotype outlines typically show angular inner corners at the top left counters, whereas the Linotype version has rounded corners.</p>
      <p>Monotype produced their ‘PostScript’ version of Times New Roman around 1990, the period when almost everyone in the type industry was producing ‘PostScript clones’. In this process Monotype fitted their outlines of Times New Roman on the widths of the Linotype/Adobe version. Microsoft was one of Monotype’s customers and Windows ships with a version of that more or less PS-compatible font data since version 3.1 since its release in 1991. I think that what we see on the photocopy is either (a later version of) the Microsoft version, or it is Times New Roman PS MT suffering from being typeset in Word and/or medium resolution output on a not very professional device. In those days some publishing houses saved money by making plates from laser printer output instead from films.<br>
      Linotype also produced various versions of Times. Next to the Linotype/Adobe version there is also Times Ten and Times Eighteen. These are digital versions of Linotype designs for different point sizes.</p>
      <p>The only Italian foundry that ever produced a Times look-alike was Simoncini. That typeface was called Life. It is still available from Linotype. <a href="http://www.linotype.com/de/937/Life-family.html" title="http://www.linotype.com/de/937/Life-family.html">http://www.linotype.com/de/937/Life-family.html</a> The typeface used in the book of L’Erma is clearly not Life. Georgia(condensed) is way off too.</p>
