      <p>Sorry for not answering earlier, I lost track of the thread.</p>
      <p>Albert Jan, I think you are right: In fact, the book's imprint mentions an Italian professor who did the "elaborazione elettronica". I was not sure exactly what was meant, but I sent him a message and asked which typeface was used and which typesetting system. He wrote back that he's got no clue what I am talking about, but he attaches the document as he sent it to the publishing house.</p>
      <p>It is a Word document with the exact page layout of the printed book. The font is Times New Roman. Hm, now that I know it, I also notice this short line that divides the text body from the foot notes. You can see it in the photocopied/scanned page I have posted above. So we're faced with a Word page with more or less default setting.</p>
      <p>But I have to add a stupid question: I am faced with Word/Times New Roman printouts on a daily basis. I see it all the time. Why does Times New Roman look in this book different to me? Or is this just an illusion?</p>
      <p>And: thanks so much to everyone who was contributed. I have learned a lot!</p>
