      <p>An update to the mystery of the font used in the Italian book: I got a response yesterday from Customer Service at the publishing house that printed the book and he clearly stated that the book was typeset in TIMES NEW ROMAN. Although I had asked for the name of their typesetting system during that era, he did not reveal that.</p>
      <p>I think we were all certain that yes, it is Times or Times New Roman of some flavor, but it really isn't. That was the mystery.</p>
      <p>I also received, yesterday, a copy of the book from the Library of Congress to examine. The type in the book is clearly digital, possibly even electronically generated. The curves are not very smooth in many cases, and many of the thins in characters such as /a are broken, which is what I think could happen in a high-speed purely electronic system. It makes sense that a very large publisher would have such a system.</p>
      <p>If you guys want me to post a few samples, I have a digital microscope that will give you a very good look at the type in the book.</p>
