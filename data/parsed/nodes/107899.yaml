    <p>A book published in 2000 by the Italian publishing house L'Erma di Bretschneider uses this font. Since it is a congress volume, it includes contributions in several different languages.</p>
    <p>I tried to figure it out with "What the font"; it suggested "Georgia Pro Condensed Light", which is a close match, but the shape of the letter "Q" is clearly different.</p>
    <p>Help is very much appreciated! </p>
    <p>SNAG-0020.jpg is a very clear scan I did from the book itself.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SNAG-0020_6705.jpg"></div><p></p>
    <p>SNAG-0021.jpg is included because it showes the shape of the letter "Q".</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SNAG-0021_6017.jpg"></div><p></p>
    <p>img0009.jpg is a full page scan, unfortunately from a photo copy.</p>
