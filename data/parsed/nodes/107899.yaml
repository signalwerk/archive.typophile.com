    html: "<p>Thanks, George. Sigh, all of this remains mysterious. Who typesets first in an elegant font, only to return to Times New Roman in a later installment? I also guess that there's not much point in e-mailing the publisher: some volumes do have colophones (though not the volume in question), and these show that the publisher uses different local providers. So they probably won't remember who did number 15 fourteen years ago. And if they need to scan it now, they probably don't have a PDF at hand ... I'm getting pessimistic about ever finding out about the font.</p>"
