      <div class="comment-spam-body"><p>Have you tried using the <a class="freelinking external" href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a>? Since you have the book, it should be relatively easy to compare the details with the samples the Guide shows. I have been trying it, and the Q from TNR seems to have a different angle to the tail than your sample. The upper counter on the g in your samples also seems less rounded than TNR. Ruling out Font Bureau's "Starling", because it is too new, the Guide would suggest Times Eighteen, Times Headline or CG Times. There are italic samples for these, except Times Eighteen. My eyeball is not calibrated enough to say anything for sure, but you can use the Compare feature to see all of them at the same time, and try to sift out differences between the versions. The T serifs are another difference, and the italic g and z, as examples.<br>
      You may be able to find enough details in your copy to make a more definitive comparison.</p>
      <p>- Mike Yanega</p>
      </div>
