      <p>Times.</p>
      <p>In the description, you said, 'I tried to figure it out with "What the font"; it suggested "Georgia Pro Condensed Light", which is a close match, but the shape of the letter "Q" is clearly different.'<br>
      In Georgia, the uppercase and lowercase o have a straight axis.</p>
      <p>Since Georgia Condensed Light and Times might seem to look alike, there is quite a similarity in the flow.  However, the serifs of b and d in Georgia have a straight top and a slanting, rounded bottom.<br>
      In Times, the b and d have a slanted top and a straight bottom gently rounding to the vertical forms.</p>
      <p>If you have a word processor or a desktop publishing application, test both typefaces and compare them side by side.</p>
    html_clean: |-
