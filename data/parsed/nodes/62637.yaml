  html: |-
    <p>I thought it might be fun to start an Ambigram challenge on typophile. I love designing ambigrams but often times I find myself just designing ambigrams of my own name:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/matthew_ambi_6484.jpg"></div><p></p>
    <p>Perhaps it'd be more fun to challenge each other with a word (or two words) and continue the challenge in this thread. Who's got a suggestion for the first ambigram?</p>
    <p>The second challenge should be issued by anyone who can complete the first challenge</p>
