  html: <p>I'm wanting to make a banner that will go with the fonts used in the maps that we just purchased here at work. I've tried using the following links to find this out on my own, but I've come up short in my searches. Any help is greatly appreciated! <br> <br><a href="http://www.linotype.com/fontidentifier.html" target="_blank">http://www.linotype.com/fontidentifier.html</a> <br> <br><a href="http://www.myfonts.com/WhatTheFont/" target="_blank">http://www.myfonts.com/WhatTheFont/</a> <br> <br>Text that is used on the bottom center of the map at <a href="http://www.ngmapstore.com/shopping/product/detailmain.jsp?itemID=177&amp;itemType=PRODUCT&amp;iMainCat=6&amp;iSubCat=46&amp;iProductID=177" target="_blank">http://www.ngmapstore.com/shopping/product/detailmain.jsp?itemID=177&amp;itemType=PRODUCT&amp;iMainCat=6&amp;iSubCat=46&amp;iProductID=177</a> <br> <br>Another example of this font in question is seen <a href="http://www.ngmapstore.com/shopping/product/detailmain.jsp?itemID=157&amp;itemType=PRODUCT&amp;iMainCat=6&amp;iSubCat=47&amp;iProductID=157" target="_blank">http://www.ngmapstore.com/shopping/product/detailmain.jsp?itemID=157&amp;itemType=PRODUCT&amp;iMainCat=6&amp;iSubCat=47&amp;iProductID=157</a> <br> <br>The final example is <a href="http://www.ngmapstore.com/shopping/product/detailmain.jsp?itemID=402&amp;itemType=PRODUCT&amp;iMainCat=6&amp;iSubCat=44&amp;iProductID=402" target="_blank">http://www.ngmapstore.com/shopping/product/detailmain.jsp?itemID=402&amp;itemType=PRODUCT&amp;iMainCat=6&amp;iSubCat=44&amp;iProductID=402</a> <br> <br>I also have done the zoom in feature and captured the 3 examples of this unknown font. <br> <br><a href="http://www.geocities.com/gothmilk_indy/the_world.txt" target="_blank">http://www.geocities.com/gothmilk_indy/the_world.txt</a> <br> <br><a href="http://www.geocities.com/gothmilk_indy/the_united_states.txt" target="_blank">http://www.geocities.com/gothmilk_indy/the_united_states.txt</a> <br> <br><a href="http://www.geocities.com/gothmilk_indy/europe.txt" target="_blank">http://www.geocities.com/gothmilk_indy/europe.txt</a></p>
