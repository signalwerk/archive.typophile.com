    html: |-
      <p>I gave up on trying to find anything close to the big Blackhawk lettering and knocked it together from scratch in a nonstop session.</p>
      <p>I have only been able to find three examples of this style of the logo, and they're all slightly different, especially the large Blackhawk letters.</p>
      <p>One of them has big differences in the Indian head and its large Blackhawk lettering doesn't appear to have the concave serifs, but it's hard to tell due to the small image size, and overall it's much lighter, with the A feathers thinner and straighter.</p>
      <p>The other example has almost the same Indian head as this one but the big Blackhawk lettering is somewhere in between.</p>
      <p>I'm calling it good enough for restoring the tool case. :)</p>
      <p>Should anyone want to muck about with this, just ask and I'll e-mail you the PSD files. While doing the big Blackhawk letters I also made an I and a V while making the H and W. The original letters were inconsistent a whole bunch with the serifs so I made one then copied and scaled it as needed. Since all the BLACK part was obscured except the tip of the lower leg of the K, I had to wing it on the B, L and C. They're based on those letters from the "intermediate" style but using the building blocks I made doing the HAWK part. KHAWK is placed exactly as in the original, I used a square shape as a one shot measuring stick to space the B from the left edge of the hexagon then nudged the LAC around until they looked good enough to me.</p>
      <p>It's not absolutely perfect, but the hand drawn original wasn't perfect. I did adjust the centering of the small text and the hexagon was somewhat irregular, with the sides vertical the top and bottom points weren't right on center.</p>
      <p>I'd love to have a whole font of these characters, just because of those funky bulbous/concave serifs that're unlike anything I've ever seen on a font. I might get around to doing a TTF if I ever get un-busy enough from my classic car plastic parts reproduction business. I have done a TrueType font a few years ago, based on the KING COBRA 5.0 letters used on the 1978 Mustang King Cobra, even did lowercase.</p>
      <p>A font based on the Porto-Power letters would also be nifty, but inventing 25 more stylized caps that have the same look and feel as those P's? Ack! I'll leave that up to people who do things like create an entire font based on four letters, like the Nash script font used by the Nash Car Club for their magazine.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Blackhawk-25_6726.png"></div><p></p>
