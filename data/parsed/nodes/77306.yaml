      <p>I think I've found a pretty good match for the small text at the bottom. Gotham Rounded... buuuut it ain't a freebie. Quite nice font, absolutely has the look of a font made with a lettering guide used in drafting.</p>
      <p>Poking around the web some more I found RockoELF <a href="http://www.fontspace.com/casady-and-greene/rockoflf" title="http://www.fontspace.com/casady-and-greene/rockoflf">http://www.fontspace.com/casady-and-greene/rockoflf</a> I can stretch it sideways a bit to match the slightly squat shape on the logo.</p>
      <p>I think I should be able to find a font with the different stroke weights of the small Blackhawk text. I've seen many fonts like that, usually with 'deco' in the name.</p>
      <p>The large Blackhawk text is what there seems to be nothing like. It has the weight and stroke widths and bulbous serifs of fonts like Cooper Black, *but* they're also concave serifs. It's like Cooper on a diet, practically anorexic. ;) If I end up having to construct it by hand I may just create a whole font based on it, at least the basic letters and digits.</p>
