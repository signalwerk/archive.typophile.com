    <p>This is a logo plate on a piece of equipment made by Blackhawk. Founded in 1910 as American Grinder and Manufacturing Company, changed its name to Blackhawk in 1925, bought Hydraulic Tool Company in 1927 and soon after began production of hydraulic tools for auto body and frame repair work.</p>
    <p>I'm working on restoring an art deco-ish styled steel case for a small Porto-Power set. The really bad looking one is what's on the case. I've re-created the Porto-Power lettering and the indian head from scratch.</p>
    <p>What I need are fonts as close as possible to the black lettering. I can add the tails or whatever on the tops of the A's by hand.</p>
