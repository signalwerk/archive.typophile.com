    html: <p>I think the font looks very similar to <a href="http://www.myfonts.com/fonts/urw/martin-gothic/urw-t-bold/charmap.html" target="_blank">Martin Gothic Bold</a>, which has the same stepped W, the same G and very similar R. <br> <br>The lighter weights of Martin Gothic have a W similar to Bernhard Gothic, with the crossed V's, but they do have the right G.</p>
