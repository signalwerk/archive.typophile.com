    <p>Hi typophiles.</p>
    <p>I'm in a hurry and I need a script font, that needs to be the following:</p>
    <ol><li>Must look handwritten with a pen (no explicit caligraphy and as little stroke variation as possible)</li>
    <li>Must serve masculine and feminine signatures.</li>
    <li>Must be readable</li>
    <li>Must have central/eastern european characters (čČšŠžŽćĆđĐ)</li>
    <li>Must have dignity, because it will be used for signatures of strong personality and successful individuals</li>
    </ol><p>I'm having some difficulty choosing one. It also looks there's not much choice around. There's lot of caligraphic script fonts. Or scripts written with caligraphic pens... But not my required style fonts...</p>
    <p>I'm seriously flirting with <a href="http://new.myfonts.com/fonts/profonts/ivana-script/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ivana Script</a>. Does it stand my measures?</p>
    <p>What would you suggest?</p>
