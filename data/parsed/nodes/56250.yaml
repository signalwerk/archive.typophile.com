    html: |-
      <p>Well. The difference being calligraphers tend to make artistic strokes with calligraphic pen. People usually don't write that beautiful. We tend to write "ugly" and barely readable. And we use regular pens that don't produce variable stroke weight. At least not to the same degree as most calligraphic pens do (depends on the tip, but still).</p>
      <p>That's how I see it.</p>
      <p>That's why I wanted a still readable type, that would look more natural (not artistic) with not much stroke variation.</p>
      <p>___________<br><em>Robert Koritnik</em></p>
