    html: <p>I had tried that along with regular BE Extra Bold, and the two of those looked practically identical to me. (I laid them over the logo to compare.) It just seems like both of those have larger corner radii, for lack of a better term, than the logo has. Where you really see it is in the bowl of the P. It seems odd to me how flat that is in the logo, whereas the tops of the O and C don't really flatten out at all.</p>
