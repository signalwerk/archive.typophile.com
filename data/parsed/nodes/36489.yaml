    <p>I am going to kill myself if this is dead easy, but I can't figure out what they used for the Top Chef logo. The closest I've found is Berthold Akzidenz Grotesk Extra Bold, which is extremely close, but this logo is just a little more squared off.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/topcheflogo_4852.jpg"></div><p></p>
    <p>(had trouble attaching the file, so I just included the image)</p>
