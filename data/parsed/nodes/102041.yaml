    <p>Hi,</p>
    <p>I have a problem with the line gap of my font when using it on windows 7 with Wordpad (no problem on open office and on my mac).</p>
    <p>I made a  font family with 4 styles (regular, italic, bold and bold italic) and when I use it with Wordpad, I ended up with unconsistent linegap. Italic, bold &amp; bold italic have the same line gap but regular has a larger one.</p>
    <p>I use Fontlab to made the font and my settings in "Truetype Specific metrics" are the same for all 4 styles (see below).</p>
    <p>OS/2 TypoAscender = 1600<br>
    OS/2 TypoDescender = -500<br>
    OS/2 TypoLineGap = 400<br>
    OS/2 WinAscent = 1900<br>
    OS/2 WinDescent = -600<br>
    hhea Ascender = 1900<br>
    hhea Descender = -600<br>
    hhea LineGap = 0</p>
    <p>A screenshot of the regular and bold version at the same size :</p>
    <p><img src="http://f.cl.ly/items/1i3E2C0Y1F0T2c3d3V31/linegap-problem.png" border="0"></p>
    <p>I tried various settings in "Truetype Specific metrics" but none of them solve the issue. I don't know why the line gap calculated by wordpad is different for regular and bold despite that they have the same settings… Maybe you know…</p>
    <p>Sorry for my english… I hope someone could help me !</p>
