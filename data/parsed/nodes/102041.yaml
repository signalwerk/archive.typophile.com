    html: |-
      <p>Just some thoughts for you to consider:<br>
      1. Are you absolutely certain that the largest numbers in your Regular are 1900 and -600? Did you do a Recalculation to check that weight?<br>
      2. Does your Wordpad file have a Carriage Return at the end of the last line? A long shot but it may affect it.<br>
      3. Have you tried it with both LineGap settings at zero? I know this is contrary to all recommendations but it may force Wordpad to work with it. If you changed this number you would also have to set your Typo numbers to match Win &amp; hhea. It will affect your output in all apps.</p>
      <p>Assuming this is a font you are making for sale, if it were my font I wouldn't worry about using it in Wordpad. How many people use Wordpad in an office or professional setting?</p>
