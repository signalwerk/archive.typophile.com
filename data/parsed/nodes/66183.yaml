    <p>Named Century 751 and designed by Rudolph Ruzicka in 1953, it is said to be "Bitstream's version of Primer." There's a connection to the Fairfield shapes, but I wonder if anyone has any info or sample of the typeface "Primer", or if anybody has ever had the chance to use the digital 751. Thanks!</p>
