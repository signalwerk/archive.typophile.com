      <p>ncaleffi:</p>
      <p>&gt; cite&gt;there also seems to be a digital version by Linotype, named "Primer", but I couldn't find any info or sample</p>
      <p>Here is a sample drawn from the 1982 Linotype Typefaces catalog mentioned above:</p>
      <p><a href="https://web.archive.org/web/20150123175636/http://www.chillingeffects.de/temp1.jpg" title="http://www.chillingeffects.de/temp1.jpg">http://www.chillingeffects.de/temp1.jpg</a></p>
      <p>This is the Primer font that was ripped off by Carter, Berlow et alii.</p>
      <p>Linotype's digitizing was made with the IKARUS system, as stated in the 1984 Linotype catalog, and apparently Carter, Berlow et alii ripped off these Ikarus font files and sold them as "Century 751" ("Copyright by Bitstream"). Since Ikarus files of "Primer Bold" had not yet been made by Linotype at that time, Bitstream could not rip them off.</p>
