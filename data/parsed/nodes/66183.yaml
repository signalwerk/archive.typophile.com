      <p>The "Bitstream" font "Century 751"</p>
      <p>see <a href="https://web.archive.org/web/20150123175636/http://www.sanskritweb.org/cdrfonts/Century751_BT.pdf" title="www.sanskritweb.org/cdrfonts/Century751_BT.pdf">www.sanskritweb.org/cdrfonts/Century751_BT.pdf</a></p>
      <p>was a ripoff clone of "Primer"</p>
      <p>see <a href="https://web.archive.org/web/20150123175636/http://www.sanskritweb.net/forgers/cdrfonts.pdf" title="www.sanskritweb.net/forgers/cdrfonts.pdf">www.sanskritweb.net/forgers/cdrfonts.pdf</a>, page 57</p>
      <p>made by Carter, Berlow et alii by ripping off this font</p>
      <p>see the 1982 Linotype Typefaces catalog</p>
      <p>At that time, Linotype had Roman and Italic, but not yet Bold. Therefore, the Bitstream outfit could not yet rip off the Bold version of "Primer", which was digitized by Linotype in 1987. The ripoff cloners of the Bitstream outfit should have waited a few more years.</p>
      <p>For more details see <a href="https://web.archive.org/web/20150123175636/http://www.sanskritweb.org/cdrfonts" title="www.sanskritweb.org/cdrfonts">www.sanskritweb.org/cdrfonts</a></p>
