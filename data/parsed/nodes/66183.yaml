      <p>Nicola — </p>
      <p>Primer was Ruzicka’s response to a commission from Mergenthaler Linotype to design a textbook face along the lines of Century Schoolbook. It released in 1953. </p>
      <p>I haven’t used or inspected the Bitstream digitization.</p>
      <p>I have a couple books in my collection which use Primer. Here are two images for you (not to scale). Note that the first example uses the short descenders in text, whereas the second uses the long descenders.</p>
