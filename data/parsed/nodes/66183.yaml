    <p>I have come across this interesting variaton of Century, which I don't recall having seen before:</p>
    <p><a href="https://web.archive.org/web/20150123175636/http://www.identifont.com/find?font=century+751&amp;q=Go" title="http://www.identifont.com/find?font=century+751&amp;q=Go">http://www.identifont.com/find?font=century+751&amp;q=Go</a></p>
    <p><a href="https://web.archive.org/web/20150123175636/http://www.fontshop.com/fonts/downloads/bitstream/century_751/" title="http://www.fontshop.com/fonts/downloads/bitstream/century_751/">http://www.fontshop.com/fonts/downloads/bitstream/century_751/</a></p>
    <p>Named Century 751 and designed by Rudolph Ruzicka in 1953, it is said to be "Bitstream's version of Primer." There's a connection to the Fairfield shapes, but I wonder if anyone has any info or sample of the typeface "Primer", or if anybody has ever had the chance to use the digital 751. Thanks!</p>
