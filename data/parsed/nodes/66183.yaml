      <p>Christian, the Primer typeface featured in Kent Lew's books samples is a metal typeface, and unfortunately a faithful digital version is not available. Bitstream's Century 751 is a "lighter" version, also missing small caps and old style figures, and, generally speaking, very weak if compared to the original source (there also seems to be a digital version by Linotype, named "Primer", but I couldn't find any info or sample). At very large size, for titling and display purpose, Century 751 seems to work, but not really as a body text (I can send you a sample page to show you, if you're interested). What strikes me more is Primer's shapes linking to the Transitional heritage, Baskerville among all, which it makes different from the "strong" look of Century.</p>
      <p>A couple of years ago there was some interest in a new digitization of Primer, and I think this typeface deserves it - you can check an interesting discussion in this thread: <a href="https://web.archive.org/web/20150123175636/http://typophile.com/node/34046" title="http://typophile.com/node/34046">http://typophile.com/node/34046</a> But, as it often happens with this kind of type revival, the marketing request isn't strong enough.</p>
      <p>On another level, and speaking of Century, there's an interesting version made in recent years by Mark Simonson, named "Grad" - very different from Primer, and with a very idiosyncratic italic, but it looks like a nice, working digital Century for setting books:</p>
      <p><a href="https://web.archive.org/web/20150123175636/http://www.marksimonson.com/article/102/introducing-grad" title="http://www.marksimonson.com/article/102/introducing-grad">http://www.marksimonson.com/article/102/introducing-grad</a></p>
