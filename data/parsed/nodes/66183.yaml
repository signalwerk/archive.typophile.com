      <p>Century 751 was included, along with a wide selection of other Bitstream fonts, with the Corel office suite at one point, so probably many people have it on their computers. The proportions are like those of Century Expanded, but in addition to being lighter, it has a larger x-height.</p>
      <p>Century Schoolbook is heavier than Century Expanded, and has a lower x-height - as well, the lower-case letters have a normal shape instead of being somewhat condensed. My suspicion is that Century 751 is intended for use at small sizes in newspapers or classified advertisements and the like, as it has some of the important characteristics of a legibility face.</p>
      <p>EDIT: However, the examples given in Kent Lew's post don't match the impression I got from the Bitstream version; they show Primer as being very suitable as a beautiful book face.</p>
