      <p>Thanks very much Don.</p>
      <p>Ah that is the date of the data on the map, but it was issued during WW2 - I'm a historian, not that bad on dates thankfully. After cropping the Reichsadler I can see why that might be a bit misleading, apologies.</p>
      <p>I wasn't sure if the typeface was from the WW2 reissue or the original version (I don't have a copy of the original to hand), hence why the request was labelled as "WW2" - again, thanks for your help.</p>
