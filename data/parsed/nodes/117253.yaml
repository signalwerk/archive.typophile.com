      <div class="comment-spam-body"><p>No problem. As for the italic, the digitized Römisch Stehend family has  merely a sloped Roman, as Römisch Liegend.  The _g_ in your map is the most noticiable difference at this scale. You could edit Römisch Liegend or use another high contrast italic.<br>
       Don</p>
      </div>
