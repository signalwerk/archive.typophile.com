      <p>This was years before AG:</p>
      <p>"The Mobil logo was designed in 1965 by Chermayeff &amp; Geismar.</p>
      <p>"The colours are red (Pantone 485) and blue (Pantone 293). Additional colours are grey (Pantone 431) and silver (Pantone 877).</p>
      <p>"Mobil uses the typeface Helvetica and its proprietary typeface Mobil Alphabet, designed by Chermayeff &amp; Geismar."</p>
      <p>Sources:<br><a href="http://hansstol.totaldesign.nl/en/mobil.html">http://hansstol.totaldesign.nl/en/mobil.html</a><br><a href="http://brandng.blogspot.com/2014/02/throwback-thursday-mobil.html">http://brandng.blogspot.com/2014/02/throwback-thursday-mobil.html</a></p>
      <p>I have it somewhere on a CD, too.</p>
