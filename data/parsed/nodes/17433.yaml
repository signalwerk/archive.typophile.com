    html: |-
      <p>Just to expand on this:</p>
      <p>- if you want to change the default figure style in an Adobe application, select the appropriate formatting (e.g. proportional oldstyle) with no document open. All future new docs you start will have this formatting on by default.</p>
      <p>- you can also set up character or paragraph styles in Illustrator and InDesign, which turn on this stuff. Or select text and turn it on manually on that text.</p>
      <p>Cheers,</p>
      <p>T</p>
