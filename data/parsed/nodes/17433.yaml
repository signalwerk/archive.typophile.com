      <p>Hi Jeff,</p>
      <p>It may be you are not clear on the use of the OpenType menu. To change all the figures in a text (could be a whole book or document), select the text and change the figure style in the OpenType menu. All the figures will change to oldstyle. There is no need to hunt down figures and change them by hand. Try out other OpenType features that way. You can get small caps, fractions, etc. the same way.</p>
      <p>Or, in InDesign, you can assign character and paragraph styles to text, so that if you did make all the figures oldstyle, you could just make a change to your character styles, and all the affected text would change, without you having to select it. </p>
      <p>These tools are very powerful. InDesign with OpenType fonts will give you the best typography the design market has seen. But you have to learn a little.</p>
