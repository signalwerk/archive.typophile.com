    html: <p>Absolutely not. The way you "default" the figure style depends on the app. In Illustrator, it's done with the "OpenType" palate, while in InDesign, the best way to do it is by setting-up a paragraph style in the "Paragraph Styles" palate. You will find that these palates make the most of this and many other OpenType features.</p>
