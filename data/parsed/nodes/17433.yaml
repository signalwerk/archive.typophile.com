    <p>Hey All!</p>
    <p>OpenType is the latest &amp; greatest, right? Well I'm not so sure. Unless I'm missing something in InDesign/PhotoShop/Illustrator if a font comes "stock" with lining figures but has old style figures in the character palette, there is no way to have the font default to the OldStyle instead of LFs? So if you want to use the OldStyles you have to drop them in number by number?</p>
    <p>Anyone have some insight to this? Thanks!</p>
  html_clean: |-
