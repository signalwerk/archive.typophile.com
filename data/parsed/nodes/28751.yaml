      <p>You should probably decide on the direction or tone you intend to convey for your project.</p>
      <p>There is a significant distinction between what was representative of "Beat" culture or "Beat Generation" as opposed to what is characterized more commonly as "Beatnik".</p>
      <p><strong>Beat Generation</strong>:<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/Wm_Burroughs_NL_4686.jpg"></div><br>
      William S. Burroughs, <a>Jack Kerouac</a>, "cool jazz" and some "bebop"<br>
      <div class="imageWrap"><img src="http://typophile.com/files/typewriter2_r2_c2_6383.gif"></div><br>
      <a href="http://www.dhsbeathotel.com/" target="new" rel="nofollow">The Beat Hotel"</a><br>
      <a herf="http://www.biblio.com/ltd/feature/26-9/Beat_Generation.html" target="new" rel="nofollow">Beat Generation - rare publications</a><br>
      <a target="new" rel="nofollow">Beat Generation Resources</a><p></p>
      <p><strong>Beatnik:</strong><br>
      Maynard G. Kreb, Shaggy of Scooby-Do<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/shaggy_5742.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/beatniks_3652.jpg"></div><br>
      Bongos, Cool Cats, Greenwich Village Coffee House (pre-hippie-sixties), Louis Nye's "Cool Daddy-o" Beatnik comic routines<br>
      <div class="imageWrap"><img src="http://typophile.com/files/louisnye2_5914.JPG"></div><p></p>
