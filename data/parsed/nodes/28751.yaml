      <p>As I recall, much of the "<a href="http://www.americanlegends.com/Interviews/al_aronowitz.htm" target="new" rel="nofollow">Beat Generation</a>" graphics seemed to use a lot of "<a href="http://www.myfonts.com/search?search%5Btext%5D=frisky" target="new" rel="nofollow">Frisky</a>" typestyles (bouncing baselines, slightly distressed) and seeing typewriter styles was also common, as Chris mentioned.</p>
      <p>Other faces included Clarendons, Latins, condensed sans serifs which were popular on many <a href="http://cover6.cduniverse.com/MuzeAudioArt/Large/90/819690.jpg" target="new" rel="nofollow">Cool Jazz</a> and <a href="http://www.africanamericans.com/images2/DizzyGillespie.jpg" target="new" rel="nofollow">Bebop Jazz</a> albums.</p>
