    html: <p>Have you checked fontforge?  <br><a href="http://fontforge.sourceforge.net/" target="_blank">http://fontforge.sourceforge.net/</a> <br> <br>It can be run under scripting mode, so you could do a batch conversion. As far as I know, it runs under cygwin-X11 on windows.</p>
