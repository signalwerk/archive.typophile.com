  html: <p>Hello there, <br> <br>As far as I can see, this forum is sponsored by FontLab, which is good...the thing that bothers me is that I need a batch font conversion utility (TTF to PS1), possibly shareware or (even better) freeware. I suppose, this question was asked before here, but the search feature is not the strongest &amp; brightest feature of the forum software. <br> <br>Any help will be appreciated</p>
