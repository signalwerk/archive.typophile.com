    html: <p>FontDoctor will convert fonts. It can be purchased separately but it often bundled with Suitcase.  <br> <br>The latest version supposedly will convert to OT but I suspect this would only be useful on single fonts (as opposed to trying to incorporate families or expert fonts into a superfont).</p>
