    <p>This typeface first caught my eye around a year ago, on the cover of 'Design as Art' by Bruno Munari. I poked around quite a bit but was never able to identify it.</p>
    <p>I just noticed today that the same type is used for pull-quotes in some Wired articles. </p>
    <p>I would use this all the time if I could just figure out what it is. Help?</p>
    <p>Cameron</p>
