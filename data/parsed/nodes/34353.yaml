    <p>I used this font for my wedding invitation in 1973. I had my local printer track it down from an invitation I had borrowed from an older friend. Unfortunately, I did not write the name of the font down and it is driving me crazy.</p>
    <p>Can anyone ID this font? Sorry about the pixelation, but the scan I did years ago was not very good and I can't find the original at this time.</p>
    <p>Thanks,<br>
    Rebecca<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/rebecca4_4006.JPG"></div><p></p>
