    <p>Engraving—Letterpress' Shy Sister</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tosswillv2_150-2_4702.jpg"></div><p></p>
    <p>Thursday, June 16<br>
    6-8:00pm<br>
    Type Directors Club<br>
    <a href="http://tdc.org/tdc/archives/3652" title="http://tdc.org/tdc/archives/3652">http://tdc.org/tdc/archives/3652</a></p>
    <p>Commercial engraving for print has an illustrious history as a vital technique for graphic design and typography. Engraving is a fluid, free-hand expression restricted only by the perimeter of the surface upon which an engraving is worked. The exquisite beauty and gracefulness of arcs and shading inherent in the engraved line is unparalleled. For centuries prior to the digital age, engraving was the dominant methodology for teaching and innovation in lettering, and especially for calligraphy. </p>
    <p>Nancy will explain why the organic nature of steel die and copper plate engraved imagery and text complements and enhances our visual experiences, and will demonstrate the importance of engraving as a modern graphic design technique. She will show examples from several avid collectors of elegant and unique engraved imagery, and share her expertise on engraving techniques and methodology. She will also describe the recent installation of a working engraving proofing press and the establishment of a new and growing engraving community in the great American city beneath the sea (New Orleans).</p>
    <p>Nancy Sharon Collins is especially well-known for her exemplary bespoke hand-engraved social stationery. Besides being a stationer, she is a veteran graphic designer, typographer, independent print history scholar, partner in Collins, LLC, director of special projects for the AIGA New Orleans chapter, and instructor of design at Southeastern Louisiana University. Her book about American commercial engraving is due out in the autumn of 2012.</p>
    <p>Image: © Richard D. Sheaff, <a href="mailto:dicksheaff@cox.net">dicksheaff@cox.net</a></p>
