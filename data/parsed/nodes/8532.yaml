    html: '<p>My approach: emailing them and requesting one. Like paper companies, foundries are eager to get their samples in front of you. Coincidentally, <a href="http://www.typophile.com/forums/messages/30/57409.html?1105452398">this thread</a> has some linked lists you could peruse for foundries.</p>'
