  html: <p>I was wondering where I can request or find (whether free or not) type specimen catalogs. <br>Your help will be greatly appreciated. <br> <br>Navi</p>
  html_clean: <p>I was wondering where I can request or find (whether free or not) type specimen catalogs. <br>Your help will be greatly appreciated. <br> <br>Navi</p>
comments:
  - id: 56324
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>If you want to quickly have a lot of specimens, your best bet is to buy the Font Book. One step down from that would be something like the Linotype specimen book, which is free. Another angle is the Indie Fonts books, which are not cheap, but they're nice. <br> <br>But even those don't cover everything, since a lot of smaller foundries only sell their fonts themselves, and hence you have to contact them directly for specimens, which are often provided as PDFs. Then there are one-off things (like the Lexicon specimen book) but those tend to be font true-blue font freaks. <br> <br>I've collected a ton of specimens, but it's taken me a while, and I'm not sure I could outline a method to have collected them all in an efficient systematic way. <br> <br>hhp</p>
