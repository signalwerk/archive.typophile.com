    html: <p>Another good source is font conferences -  if you're in the vicinity of NYC in July or Helsinki in September drop by the conference venues and see what you can blag - better yet if you pay to attend you'll get a free bag to store all the goodies and get to enjoy the auctions where these things often come up for bid.</p>
