    html: |-
      <p>Craig,</p>
      <p>The solution just occurred to me. Karsten Lucke use to recommend that in a case such as this, you make the "standard" character (the encoded one) the "exception," then using calt, switch to a desired alternate.</p>
      <p>So yes, you could make the standard J/j with about -20 units left sidebearings, then set up a class with all the alpha-numerics with your -80. Check leading punctuation while you are at it, I bet you find that things like an asterisk, colon, etc., work better with the -10 or -20 character. You will still have to kern the j with parenleft, bracketleft, etc.</p>
      <p>It is easy to get the "j" too tight. I once set a book on Hemingway &amp; wound up cringing every time "Kilimanjaro" appeared in the final, printed book. That has become my test word, BTW.</p>
      <p>FWIW</p>
