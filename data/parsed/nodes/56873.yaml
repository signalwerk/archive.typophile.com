    html: |-
      <p>Well, there will always be some of that, just like with an "f" ending a line. And all in all, I think it preferable to use less negative sidebearing &amp; kern as needed. There are other constructions that might cause problems, such as "f_ space_J", as in "of Jewish descent".</p>
      <p>If you try this with, say, Bulmer, which has a large negative sidebearing with the j's on the left and with the f on the right, the wordspace almost disappears.</p>
      <p>You can use an alternate J,j, with less of or no negative sidebearing as a contextual alternate when preceded by a space, but I don't know how that will work at the beginning of a line -- certainly it wouldn't work as the first character in a paragraph.</p>
      <p>Usually, all the clever sidebearing ideas we come up with to avoid kerning with a lot of letters come back to haunt us.</p>
      <p>FWIW</p>
