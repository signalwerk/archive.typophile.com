  html: <p>I've put negative left sidebearings on my 'j' and (descending) 'J', which works well except when those glyphs start a line, in which case the tails stick out past the left margins. Is there a better solution as far as setting up the font goes?</p>
  html_clean: <p>I've put negative left sidebearings on my 'j' and (descending) 'J', which works well except when those glyphs start a line, in which case the tails stick out past the left margins. Is there a better solution as far as setting up the font goes?</p>
