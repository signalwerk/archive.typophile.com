      <p>&gt; the tails stick out past the left margins<br>
      ... They should. I mean you put them there to make the letter balance in it's default space and though they may look to you like they are sticking out, to readers, I think it's just fine.</p>
      <p>Or, you can make not a few, but dozens of alternates, as the opposite effect occurs as well, with e.g. a non-descending J and many other characters, and then make lots of OT, and then think there is too much space from the margin to the main stem of the J compared to the line below which starts with an "L". :-p</p>
      <p>Cheers!</p>
