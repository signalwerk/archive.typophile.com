    html: |-
      <p>You use these tools just to fill out your character ranges. So for instance to see all of the Hebrew glyphs Unicode allows for:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/unicode_4921.png"></div><p></p>
      <p>When preparing to output your font, do:<br>
      --&gt; Open your source file in FontLab and go to File, Font Info, and click the expanding triangles from the bottom up so all tabs are expanded.<br>
      --&gt; Go to Encoding and Unicode and select the supported code pages by your font, typically Latin 1 for a Latin font (you will need to select more if you support more than that)<br>
      --&gt; Go to Unicode ranges and select the supported Unicode ranges, typically Basic Latin, Latin-1 Supplement, and Spacing Modifier Letters (you will need to select more if you support more than that)</p>
      <p>There is also an article here that describes how to generate a Web native font -- not everything will apply for you, but this should help with some of the things you wonder about.<br>
      <a href="https://code.google.com/p/googlefontdirectory/wiki/HowToGenerateWebNativeFonts" title="https://code.google.com/p/googlefontdirectory/wiki/HowToGenerateWebNativeFonts">https://code.google.com/p/googlefontdirectory/wiki/HowToGenerateWebNativ...</a></p>
