    html: |-
      <p>Encoding: Use Unicode, always!</p>
      <p>The LTR rendering is handled by the renderer. Some programs don't support this, but may support reversing (mirroring) letters. Some people will make a second version of their font with the Hebrew glyphs flopped for this use. You can see some examples of this <a href="http://oketz.com/fonts/all.html" rel="nofollow">here.</a></p>
      <p>If you are also doing Nikkud (which can be a little complicated) you may wish to add Opentype features for it, but I don't recommend it unless you're doing a font intended for printing Scriptures or dictionaries.</p>
      <p>Be sure to go over and space everything well, as in the side-bearings. This is very important in Hebrew, even if you don't do any kerning.</p>
      <p>On the code pages, I don't use Fontlab, but I would think you would just want the normal Hebrew codepage, in Unicode U+0590—U+05FF, and if you wish to include some presentational forms, U+FB1D—U+FB4F.</p>
      <p>Have you posted the samples of the font on the critique forum? I would be interested in seeing it! :-)</p>
    html_clean: |-
