    html: |-
      <p>I wish you well with your project. Here is a very brief description as to how I have done something similar.</p>
      <p>I have a font family - Hebrew Font Shuneet - with eleven fonts.  My approach was to find a font that had Hebrew and Latin then to rename it and replace all the letter shapes with my own. At every stage I could easily verify that I had a working font. I never had to start from nothing. I did this with Font Creator which is a relatively low cost application. </p>
      <p>At some point I decided to base the Latin characters on Tuffy.  To do this I merely copied all the Tuffy shapes into my own font.  I have over some years evolved the Latin so it no longer looks like its source but Tuffy gave me a flying start!</p>
      <p>Mike</p>
