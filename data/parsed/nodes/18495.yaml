    <p>Hi all, </p>
    <p>Someone sent me this sample this morning, and this seems to ring a bell from a past ID, which I can’t find in the archives. The font looks like Bauhaus with some edited characters, but it also has rounded strokes. I seem to recall that Mike F. or Dav ID’d it as a freebie font, but I can’t pin it down anywhere. Anyone know this one? Thanks,<br>
    - Mike Yanega</p>
