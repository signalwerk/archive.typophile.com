    html: <p>There IS one instance, in which I found stretching useful, btw.  <br>Luc(as) Sun-Fonts don't work porpoerly with InDesign (or rather vice versa). If you switch from regular to Small Caps, the text is lost, replaced by a pinkish field and you have to re-enter it. As this lends to typing errors when you ave to re-type stuff and all in all isn't very workflow-friendly when typesetting a larger publication (I use sun for the 28-pages newsletter of the Institut für Kredit- und Finanzwirtschaft), I started to fake my own caps in InDesign. When the regular Text is light, I use the normal weight, decrease the type-size so that the upper-case letters have a bit more than the x-height of the regular sized light-font and then do stretch it a bit. With a bit of spacing, it looks almost identical to what Luc did in the Light Small Caps and the reader won't notice any difference at all. As I noticed that Luc(as) HAD optically stretched the SmallCaps somewhat, I did the same thing. I'd wish, he'd fix that </p>
