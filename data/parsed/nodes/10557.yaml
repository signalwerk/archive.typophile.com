    html: <p>Rotis stretched to 280%? *Ugh* I could vomit. Yeah, it was one of those logos that makes you wanna go out and hit the guy who did that. Jesus, if folks simply don't know anything about design, why do they do it? Because the computer makes it so easy?=20 Anyway... Carson. I think that Dave is a great, great typographer. He cares very little for actual content, which is a shame, as most of his work has a superficial, masturbatory quality sometimes... but as such it is very artful, very intuitive and his choice of positioning images and type and in the typefaces he uses is often superb. He's often been reduced to the Mr. Dirty Fonts and overkill-design, but many of his works are subtle and clean and just a bit wicked and thinking outside the box and sometimes even downright evil, f***ing with the readers mind in very clever ways. He's sadly become a clich=E9, often and badly = copied and he himself hasn't done too much beyond his own scope, like the ever-great Dave McKean more or less recycling his own ideas sometimes, but in my own humble option Dave was and still is an artist whose work I love just as much as that of Vaughan Oliver or Dirk Rudolph or Bill Cahan... As it still is unique and has grown immensely over the years, so despite the many epigones that have copied it, it still has a lot of merit, I think. I'm quite looking forward to that McLuhan book David is doing...=20 <br> <br>HD </p>
