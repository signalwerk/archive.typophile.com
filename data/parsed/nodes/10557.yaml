    html: <p>I recently manually reworked the m of the TheSans Mono for a logo of a firm called crimecompany, as it is a bit too narrow for my taste... I think Luc went for a compromise to have an overall nice width for the monospace, but with TWO m in one word, it felt all wrong, and yet the typeface itself was perfectly right for what I wanted. So I worked direktly with the path and moved some of the nodes horizontically... Which resulted in a VERY controlled kind of stretching a single letter, making the typographic part of the logo more individual while not being some kind of electronic universal stretch without any aesthetic feel for the lettershape. You're right though, there are plenty of books on microtypography that even argue for the controlled stretching of certain fonts as it enhances their look because the digital version is messed up or not true to the original design... Thus, sometimes a microscopic amount of stretching can actually help the typography, just as in many many cases a bit more overall spacing than the design of the font originally has makes for better legibility (RotisSemiSans and UniversLightCondensed spring to mind). </p>
