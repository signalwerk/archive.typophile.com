    html: "<p>&gt;Who cares about the original intent of the designer? Sure, F*** that Tschichold dude... If YOU want a 250% stretched Sabon, that MUST be right. :-) Sorry.. If yiou are a good designer, which I assume, you respect the work of others. In each and any case. I understand that in certain cases you can consciously destroy a font, just like you'd do with image material in photoshop, to get a certain effect... If you work on a logo, mod the shape of the font and try to aim for a certain effect and the end result is good... More power to you, I do similar stuff myself, I recently rebuilt SunLight extremely for a Logo for ikf, basically changing those three letters completely, but still retaining the unique flair of the font. I also don't think that a, say, Carsonesque work needs much respect for  typography. However, in a normal, maybe longer text that you want anybody to read, it isn't only about respect for the likes of Giambastita Bodoni, but also for the reader. Have you ever seen a layman mangle type in CorelDraw or in (ugh) WordArt.... And how many ads or even brochures have you seen in which the font is stretched to 150% I recently was to identify the type of a logo for a friend and failed miserably at it, until it struck me that some idiot had sretched Aichers Rotis to 280% ... And that was why it looked so rotten.  <br> <br>As usual: If DONE right, breaking the rules is a GOOD thing. If a layman, a person wihout the right sensibilities to destroy rules in order to aim for a specific creative effect, does it... it's hurlsville. HD</p>"
