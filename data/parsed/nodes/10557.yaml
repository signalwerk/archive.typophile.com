    html: <p>Rotis stretched to 280%? *Ugh* I could vomit... <br> <br>BTW Despite its carelessness Carson rarely stretches type. If you look carefully at Ray Gun, behind the chaos there are often quite classical (albeit unconsciously) layouts. I mean in terms of balance, white space, justapositions, etc. <br> <br>Carson tampers mostly with spacing, which is a different thing. A thing to notice anywyay it's his choice he's always been for good typefaces. <br> <br>In ray Gun, despite the many hacked fonts, he often chose beautiful classic or modern types, like Perpetua, Joanna, Rotis, for the body text. <br> <br>In one of his last books (fotografiks) he uses everywhere the beautiful Simona (formerly Arno Nuovo) by John Downer, mixed occasionally with some Franklin Gothic-like type. This book is beautiful because its' most on imagery, not text.</p>
