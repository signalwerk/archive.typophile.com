    html: "<p>Back to Lisa's original question. <br>  <br>Here's a good example of what not to do:   <br>   <br><img src=\"http://www.typophile.com/forums/messages/30/7102.gif\" alt=\"Siebel Logo\">   <br>   <br>After working with this client for a while, we discovered    <br>what bothered us about this logo so much. It was created    <br>by stretching Benton Gothic Bold about 150% and then    <br>cutting an angle into some terminals.   <br>   <br>Apart from the disparity between the horizontal and vertical    <br>strokes, the worst problems appear in the S and the B,    <br>where the vertical parts of the curves get very thick (and    <br>the horizontals get thinner).   <br>   <br>The lesson: if you want a bold extended wordmark, start    <br>with a face that includes a bold extended weight, or take    <br>extra care adjusting those curves.   <br>   <br>All in all, I have to agree with Christian and HD Shellnack    <br>about knowing the rules and knowing when to break them.    <br>That's the essence of graphic design.    <br>   <br>Changing the subject somewhat:   <br>   <br>I've known some designers who get away with stretching or   <br>contracting a face by about 3% to fit the copy better. What    <br>do you think, is this better or worse than adjusting the    <br>letterspacing to get the same result?</p>"
    html_clean: "<p>Back to Lisa's original question. <br>  <br>Here's a good example of what not to do:   <br>   <br><img src=\"http://www.typophile.com/forums/messages/30/7102.gif\" alt=\"Siebel Logo\">   <br>   <br>After working with this client for a while, we discovered    <br>what bothered us about this logo so much. It was created    <br>by stretching Benton Gothic Bold about 150% and then    <br>cutting an angle into some terminals.   <br>   <br>Apart from the disparity between the horizontal and vertical    <br>strokes, the worst problems appear in the S and the B,    <br>where the vertical parts of the curves get very thick (and    <br>the horizontals get thinner).   <br>   <br>The lesson: if you want a bold extended wordmark, start    <br>with a face that includes a bold extended weight, or take    <br>extra care adjusting those curves.   <br>   <br>All in all, I have to agree with Christian and HD Shellnack    <br>about knowing the rules and knowing when to break them.    <br>That's the essence of graphic design.    <br>   <br>Changing the subject somewhat:   <br>   <br>I've known some designers who get away with stretching or   <br>contracting a face by about 3% to fit the copy better. What    <br>do you think, is this better or worse than adjusting the    <br>letterspacing to get the same result?</p>"
