    date: 2003-02-28T20:18:00
    date_raw: 28 Feb 2003 — 8:18pm
    votes: null
    html: "<p>I disagree with the sophomoric idea that type shouldn't be stretched or compressed. Who cares about the original intent of the designer? When I am working, I only care about the intent of one designer: me. <br> <br>There are some good reasons this commonly held rule is taught in every freshman typography class. I've seen some awful things come out of the computer (so awful they will someday be cherrished by graphic designers in their ephemera collections as samples of 'early digital typography'). Hrant has enumerated a few of the problems that can happen. <br> <br>However-- <br> <br>If you understand the rules about what makes type work, of course you can compress/extend type. There are some obvious problems that happen, but the reality is, many faces have some flexibility. I'm glad to see some inteligent exploration of the idea at the porchez typofonderie. <br> <br>In short, I compress and extend type all the time. And I'm not ashamed of it. Sometimes I edit the outlines to correct some of the problems caused by expansion. I think all designers should be able to 'get under the hood' of a font and tinker a little bit. Too many are scared to do so. I have seen too many logos that are simply type set in a common face, displaying no originality or creativity. Since when was the shape of the letter sacred? Learn how it works and tear it apart!</p>"
    html_clean: "<p>I disagree with the sophomoric idea that type shouldn't be stretched or compressed. Who cares about the original intent of the designer? When I am working, I only care about the intent of one designer: me. <br> <br>There are some good reasons this commonly held rule is taught in every freshman typography class. I've seen some awful things come out of the computer (so awful they will someday be cherrished by graphic designers in their ephemera collections as samples of 'early digital typography'). Hrant has enumerated a few of the problems that can happen. <br> <br>However-- <br> <br>If you understand the rules about what makes type work, of course you can compress/extend type. There are some obvious problems that happen, but the reality is, many faces have some flexibility. I'm glad to see some inteligent exploration of the idea at the porchez typofonderie. <br> <br>In short, I compress and extend type all the time. And I'm not ashamed of it. Sometimes I edit the outlines to correct some of the problems caused by expansion. I think all designers should be able to 'get under the hood' of a font and tinker a little bit. Too many are scared to do so. I have seen too many logos that are simply type set in a common face, displaying no originality or creativity. Since when was the shape of the letter sacred? Learn how it works and tear it apart!</p>"
