    html: <p>&gt;&gt;&gt;Carson has sold out.&lt;&lt;&lt;&lt; =20 Carson had sold out some 4 years after he got the Ray Gun gig, if you see it that way. And frankly, I'd done it as well. Being a designer is a job, and being poaid good money for doing exactly what you want to do, only on a bigger budget with bigger clients... There's no shame in that and I don't ever remember Carson being anti-capitalist or something like that. He's in a solid business position now, and for a small freelance designer, that's not someting to be ashamed of. He's still doing solid work, and of course his position, like that of most of us is a compromise between doing what your heart tells you to do and doing what you must do to pay the rent and school for the kids or something like that. I don't feel that David has lost much of his integrity, if he has, then so has Bill Cahan and so have Charles Anderson and Jo Duffy and many other successful designers. Of course, the change from Ray Gun to Pepsi was a MASTER example of the =ABCounter-Culture-to-Over-The-Counter-Culture=BB-process, but that is = true for all independent or alternative form of expression these days. Some small fashion designer has a unique idea, and it effing soo will be stolen by the industry. Carson at least managed not to get robbed too much and come, finally, into a position where making dough and making art might be, for him, at a happy balance.=20</p>
