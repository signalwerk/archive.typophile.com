    html: "<p>HD Schnellnack is right. <br>When I began using the Mac (around 1989) everyone stretched type in any possible way. <br>It was just the fascination of  doing it (expecially some LetraStudio craze crappy results!) <br> <br>If you know the rules you can do nice things. For example, compressing slightly Gill Sans Bold on the x-axis improves it (I mean around a 95-96%, not more) because it tends to get  too wide compared to other weights. <br> <br>What I found fun as a teenage badboy typographer was working against the structure of a face: if you try to enlarge Helvetica Compressed, Inserat or ExtraCompressed exaggerately on the x-axis the results are unexpected (and rarely used). Same thing doing the opposite with wide and extended faces. Or trying straightening some italics. <br> <br>Anyway, stretching is exactly what separates a designer from an amateur, and this is good because it helps you spot out the crap at a glance. <br> <br>The thing I always find *sick* is the distortion of types with circular Os, like Futura or Avant Garde. A luck my Ottomat came out when the stretching craze was well over. <br>I have not seen it stretched so far. <br> <br>Typefaces working even if stretched are in general the ones without curves and modulation: I did a very simple typeface way before Ottomat named Boom which you could squeeze and stretch at your pleasure. <br>It was inspired by John Workman's lettering on comic-books drawn by Walt Simonson in the late 1980s (Thor, Fantastic Four). Of course it worked best if an outline was dropped behind the white type, as a sound effect. <br> <br>In general, you could even use LetraStudio (or the FreeHand and Illustrator tools) to distort sensences, but you need to adjust very skillfully the handles and vary the width, point size and inclination of each letter. Afterwards, a bit of amnual redesign is required. <br>In this way it's very much like designing distorted type by hand.</p>"
