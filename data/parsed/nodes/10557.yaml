    html: <p>By stretching or compressing a font you hurt the integrity of the original design. Just because you can do it on a computer, it doesn't mean you should. What didn't work in hot metal should be a nono in dtp as well. It's just bad. It's not creative, not even in a destructive way, it's just bull. The dynamic of the width and weights and proportions of the type is destroyed by such electronic manipulations. And THAT is why you don't like it - it just looks awful :-D</p>
