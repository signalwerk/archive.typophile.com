    votes: null
    html: "<p>Claudio, I think that Carson simply has an intuitive sense of design that simply is right. I worked for Dirk Rudolph for some months and I think he has that very same inner magic. Without grid, without any planning at all, he just puts stuff somewhere on the page and it looks right. And after that, when I started to build grids for myself, based on his rough designs, I dound out that he very often was perfectly within a certain kind of grid =96 he just didn't know it, it came from pure intuition. Very cool.=20 ... =20 Dave McKean is one of the reasons why I got into this business. I came across him the first time on the covers of Sandman # 4 and quickly got the backissues and of course anything else he had done before. Although I find his work a bit self-repetetive these days, I'm still a huge fan. You can find much of his work and many links here: <a href=\"http://www.dreamline.nu/\" target=\"_blank\">http://www.dreamline.nu/</a>. His Option Click book is purely photographic montage, his PICTURES THAT Tick is more comics-related but there are some nice non-comic pages that show another side of his work. I hear a new book is coming up that is more design-related again. Of course, the best book so far, imo, is Dust Covers, a collection of his Sandman work, which I still love best, as the bridge between Neils stories and Dave's artwork is just so wonderful and the book is marvelously done, featuring lots of private photographs and some images of his workspace.. Very nice look behind the curtain, here. His use of fonts is a bit... Well, overdone, I think it fits the bombastic majesty of his images very nicely, but it still is very over-the-top. I really liked the fact that Vaughan had used the Sabon in his recent monography... That kind of restraint is maybe something we can use nowadays, after the visual overkill of the 90s, I think there IS a reason why we see more classical typefaces popping up these days even from independent labels like <a href=\"http://www.fountain.nu.=20\" target=\"_blank\">www.fountain.nu.=20</a> ... =20 You did Ottomat??? Very nice one, didn't recognize your name though, sorry. No wonder you like Frank Heine's work :-). Frank is great and his new typeface Triumph shows again just how effing versatile the guy is. I know his work since RAW and L=F6schblatt, which I begged him to give to = me 10 years back or so.=20 ... =20 Incidentally, I met Dirk Uhlenbrock on Friday for the first time (face to face that is), but knew of him for some time, thanks to Fontomas. Nice guy, nice style, nice company. It felt eery, as so many details mirror my own life (quit the University, small bureau of three folks, with him doing print and Martin the Flash-prog-stuff plus a trainee, identically the same structure I have). I think he does more Illustration, while I'm more into manipulating phtography (well, I AM a Rudolph-fan and cannot seem to get that out of my system at all). We live in the same quartrer of the town and met with some other designers, initially because I mailed him to offer assistance after Knut vanished, but it looks as if things aren't too much out of hand professionally, if not in terms of this very messed-up-situation of loosing your brother. I really dig the MASSIVE j.otto seybold feeling in Dirks work and like many of the things I've seen from him. It was a nice talk, especially with Martin, who =96 like me =96 is a massive comic book fan, and since = he's more into Indie stuff (I'm straight Superhero, more or less), it was very informative and I got a kick out of hearing what independent comic books are worth giving a try. Signalgrau almost feels like a mirror company to what we do at nodesign, so much so that I wonder why one cannot work together more, all these itty bitty design bureaus everywhere, it seems as if we're all making ourselves smaller than we actually are... Anyway, it was very nice to finally have met Dirk and I'm looking forward to doing so again... :-D.=20 </p>"
