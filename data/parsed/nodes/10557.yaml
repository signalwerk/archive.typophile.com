    html: <p>Whn typesetting the <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1932026010/qid=1046533508/sr=8-1/ref=sr_8_1/103-9922275-3099033?v=glance&amp;s=books&amp;n=507846">Language Culture Type</a> book I had to fake some Cyrillic smallcaps using a font (Georgia) that does not contain them. Thankfully, the proportion of smallcap to x-height I needed to match in the Latin text face (Fenway, also by Matthew Carter) was quite large, so I didn't need to scale down the Georgia Cyrillic caps too much. The book's designer, Maxim Zhukov, spent a long time testing different scaling <i>and mechanical expansion</i> of the Cyrillic caps to match the weight and proportion of the Fenway smallcaps as closely as possible. The result was a lot more successful than I expected.</p>
