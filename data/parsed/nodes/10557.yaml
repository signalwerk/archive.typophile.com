    html: "<p>for HD Schellnack: <br> <br>Re: Carson <br>I realized Carson's sense of balance while studying an old italian book on typographic design. This was refreshing since I was not able to understand why I liked many of his pages and many others not. Carson has improved, but being copied to death and become a fad doesn not help at all (see Neville Brody). It's the same thing T-26 did undermining the professionality of designing letters. Luckily Carlos Segura encouraged also a few notable designers (Fabrizio Schiavi, Gabor Kothay, Matius G. Grieck, Mario Feliciano, Frank Heine). As for the \"collections\" I don't consider them part of the \"library\" (Alias, Device, Gravy, Bionic Systems, etc: here T-26 acts more like a distributor). <br> <br>Re: Dave McKean <br>I'm a big admirer of Dave McKean since its very beginnings as a comic artist. As he started to use the Mac he's become a fantastic  graphic designer. I've bought many DC Comics Vertigo issues just for his cover designs (the Corinthian and The Thessaliad, recently, which are fantastic). <br>Dave has been able to use Emigre faces st their best, especially the ones of my friend Jon Barnbrook. He used also my Ottomat, once, on a cover of The Sandman's hardcovers, but I've been unable to track it down, since the reprints have different covers. Do you have it, BTW? <br>Also, I was unaware of David's design work outside of comics covers and interior pages. <br>I have \"Hourglass\" which is a sort of portfolio he did (using Tankard's Disturbance, also), but I've never seen any non-comics-related work. <br>I would be very grateful if you could address me to some of it. <br> <br>I've seen you're from Essen. Do you know my friend Dirk Uhlenbrock? <br> <br>For John: <br> <br>I've seen the Language Culture Book at Amazon and it seems fvery promising. Is it a real must-have? (I ask just because I'm low on cash!) <br></p>"
