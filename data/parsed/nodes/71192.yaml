    <p>Gah, I've never done this before and debated promoting the typeface here at all, but since you all give me inspiration and happiness with your new releases, it would be selfish of me not to share with you all. So sheepishly, here it is.</p>
    <p>The other day I release Ne10, a new stencil typeface I designed, through YWFT. This stencil font takes its inspiration from a neon sign at my local pizzeria without being blatant in its reference. I found myself staring at the sign too often, so I decided to try to work it out digitally. While sketching it up I realized that this could work rather nicely as a stencil font, instead of a faux 3D neon looking thing. So although the inspiration is neon, the result is more modern looking. Hopefully some of you will like it. </p>
    <p>I don't understand the linking system here, so here is the link — <a href="http://www.youworkforthem.com/product.php?sku=T0668" title="http://www.youworkforthem.com/product.php?sku=T0668">http://www.youworkforthem.com/product.php?sku=T0668</a></p>
    <p>The inspiration: </p><div class="imageWrap"><img src="http://typophile.com/files/cerveza_4341.jpg"></div><p></p>
    <p>The result: </p><div class="imageWrap"><img src="http://typophile.com/files/T0000_02_5520.jpg"></div><p></p>
