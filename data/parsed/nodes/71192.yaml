      <p>By "accurate" I mean that the font letters correspond to functional neon lettering, i.e. without strict geometricality and impossible overlaps and sharp corners, and with appropriate lengths of "tube" (not too stencilly).</p>
      <p>It wouldn't necessarily make for a good typeface, I'm just observing that there is nothing that "real" in the way of fonts.</p>
