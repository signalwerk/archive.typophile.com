      <p>N,</p>
      <p>I tried to understand it, but it doesn't conform to any of the standards that I know. *sheepishly* And I was being a little lazy.<br>
      I did edit the image to fix the scroll bar issue, thank you.</p>
      <p>I think the problem with rendering it realistically is that you get stumped by either the physical 3D quality of the tubes, or you get it when you realize part of what makes it look correct is that it emits light. Well, probably it's both of those things. Which is pretty difficult to realize fully given the limitations of what a typeface is (or at least what a typeface is right now, maybe in a future iteration).</p>
