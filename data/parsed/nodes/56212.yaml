    <div class="info">Submitted by <a href="/user/111" title="View user profile.">Zara Evens</a> : 24.Mar.2009 10.58am </div>
      <p>JUSTIFIED WEST<br>
    A one-day typographic event</p>
    <p>Saturday April 25, 2009</p>
    <p>Presented by Langara College and<br>
    the Society of Graphic Designers of Canada</p>
    <p>// THE DAY<br>
    Justified West Event<br>
    Registration: 8AM—9AM<br>
    Speakers: 9AM—6PM</p>
    <p>// THE SPEAKERS<br>
    <a href="/wiki/Marian%2520Bantjes" class="freelinking">Marian Bantjes</a>, <a href="/wiki/Stephen%2520Coles" class="freelinking">Stephen Coles</a>, <a href="/wiki/Si%2520Daniels" class="freelinking">Si Daniels</a>, <a href="/wiki/Zara%2520Evens" class="freelinking">Zara Evens</a>, <a href="/wiki/Shelley%2520Gruendler" class="freelinking">Shelley Gruendler</a>, <a href="/wiki/Michael%2520Hernan" class="freelinking">Michael Hernan</a>, <a href="/wiki/Richard%2520Kegler" class="freelinking">Richard Kegler</a>, <a href="/wiki/Kevin%2520Larson" class="freelinking">Kevin Larson</a>, <a href="/wiki/Emily%2520Luce" class="freelinking">Emily Luce</a>, <a href="/wiki/Thomas%2520Phinney" class="freelinking">Thomas Phinney</a>, <a href="/wiki/Geraldine%2520Wade" class="freelinking">Geraldine Wade</a>.</p>
    <p>// THE EVENING<br>
    <a href="/wiki/Typophile%2520Film%2520Fest" class="freelinking">Typophile Film Fest</a> 4, presented by Punchcut<br>
    Doors open: 7PM<br>
    Films: 8PM—11PM<br>
    Note: All Justified West attendees receive free entrance to the Typophile Film Fest. Tickets for the Typophile Film Fest only, will go on sale soon…</p>
    <p>// COST<br>
    Professionals: $175<br>
    GDC Members: $150<br>
    Students: $75<br>
    Langara Students: $50<br>
    Advance Registration Tickets on sale Now!<br>
    To register, phone 604 323 5322<br>
    and ask to register for Justified West<br>
    Further Information Contact Dr Shelley Gruendler<br>
    Email: <a href="mailto:sgruendler@langara.bc.ca">sgruendler@langara.bc.ca</a></p>
    <p>// THE LOCATION<br>
    PLAZA 500 Hotel, Vancouver BC<br>
    Located at the corner of Cambie Street &amp; 12th Avenue</p>
