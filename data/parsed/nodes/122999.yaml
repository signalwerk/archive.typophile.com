      <p>Thank you very much, Don.<br>
      I personnaly have doubts about Gloucester being an <cite>imitation</cite> of Cheltenham, since Lanston Monotype (British Monotype’s US parent company) had bought the rights of the face from ATF in order to make it available on its composing machines. I just wonder why it was thus renamed for the British (and European) market, and how the ‘Gloucester’ name came about.</p>
