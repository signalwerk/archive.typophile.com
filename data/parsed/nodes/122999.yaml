      <div class="comment-spam-body"><p>According to Jaspert's Encylopaedia of Type [1970] Cheltenham [1896 and 1904-11] had several imitators, as follows: The Monotype version was _Gloucester_. It had an italic _p_ with the normal closed bowl. Stephenson Blake had _Winchester_, which may be distinguished by the curl of the ear in _g_ and the serifs of the _s_. Intertype had _Cheltonian_. Berthold originally called their version _Sorbonne_ [1905].<br>
      Don</p>
      </div>
