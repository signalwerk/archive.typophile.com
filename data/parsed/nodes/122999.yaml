      <p>Since it was the British Monotype company that gave the world Times Roman, along with revivals of Baskerville, Plantin, Garamond, and such faces as Bembo and Poliphilus, even though it was descended from the original American Lanston Monotype company, it seems to have become independent of it. Thus, Lanston Monotype faded to such obscurity that it ended up being owned by a participant in this forum (one Gerald Giampa), while the British Monotype firm is a very major player in the digital type era.</p>
      <p>While Lanston Monotype opened its British branch in 1897, the British operations issued stock in Britain in 1936, so they became independent then or earlier.</p>
