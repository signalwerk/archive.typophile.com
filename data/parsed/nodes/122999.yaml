    <p>Hello all<br>
    Maybe this topic has always been discussed somewhere on Typophile, but I've been unable to find out…<br>
    Does anybody have any information about the renaming of Cheltenham Old Style, which became Gloucester (series 99) in 1911 for British Monotype ? Thank you very much.</p>
