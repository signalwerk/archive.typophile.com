    <p>Am seeking the correct name or names of the Garamond type style shown on page 102 of: Encyclopedia of Typefaces, by Jasper, Berry &amp; Johnson, paperback edition of 1990, with red cover.  The listing at the bottom is: Simoncini Garamond. I have researched the<br>
    Monotype books, Rookledge book, Mac McGrew's book Identifont, and other on-line sources.<br>
    The show is of: capitals, small capitals and oldstyle figures, in roman and italic, no lowercase letters.<br>
    Another interesting features is the capital "J", it terminates at baseline, does not swing below baseline as most Garamond lowercase<br>
    "J" letters. The tail of the letter "Q" gives a hint of a foundry Monotype sorts or alternate setting.</p>
    <p>Does anyone have an answer to the name of the above mention type style?</p>
    <p>I have checked the errata in the front section, No listing.</p>
    <p>Thank you,  Gary Barsch.</p>
