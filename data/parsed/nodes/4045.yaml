  html: <p>Does anybody know how I can add more points to curves, the opposite of  Fontlab's "Transform/Optimize" function. <br> <br>I require more points as the font is loaded into an interactive environment so more points mean more manipulations for the user. <br> <br>If anyone knows any ways or software that can do this, please let me know. <br> <br>Thanks <br>Nic</p>
