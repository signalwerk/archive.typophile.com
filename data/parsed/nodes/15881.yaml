      <p>Here is my impression. Over all it seems really strong. Here are my suggestions for maybe improving it. Really, I don't know that they will:</p>
      <p>•&nbsp;Maybe make the N a little wider.<br>
      • I like the Q but I wonder what more could be done with it. It is a huge graphic opportunity<br>
      • The ch - I wonder if the top of the c might bend down a little to help it read as a 'c' a bit more.<br>
      • Maybe let the 1st M be a little bigger and let it be spaced a little farther from the 'a'.<br>
      • What if the C on the inside was a bit rounder?</p>
      <p>Sweet work!</p>
