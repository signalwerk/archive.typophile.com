    html: <p>If anything I/d see it more the other way round-italic is a cursive typeface, usually angled and with some of the aspects oh handwriting in it's letterforms.  Oblique is more usually just an angled form of a regujlar face-though this may be done by hand rather than in software, and may go beyond just a mechanistic tilting.</p>
