    html: |-
      <p>Nothing earthshaking, but:<br>
      In preparing my TypeCon talk I had to think clearly about definitions like this, and what I arrived at is close to what some others have already said:</p>
      <p>Oblique is a mechanical skew of a Roman, possibly touched up (not more) to avoid too much ugliness. Sans fonts often have an Oblique (although they call them "Italic" for convenience/expectation) and these only stand out enough from the Roman if they have a strong slant.</p>
      <p>Italic means a font that might have started as a mechanical slant job, but in any case ends up looking structurally different. Serif fonts almost always have a so-called "true" Italic (although also almost always the Italic skews the voice of the Roman too much, typically by being far more chirographic). Slanted-Roman italics are interesting because they are essentially Oblique, but they [need to] have something extra (like semi-serifs instead of full serifs) to stand out enough.</p>
      <p>hhp</p>
