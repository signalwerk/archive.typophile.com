    html: |-
      <p>Generically/commonly one could call them synonyms.</p>
      <p>Historically (and probably more accurately) italics is an actual separately drawn typeface meant to hint at aspects of cursive handwriting. The glyphs are drawn as unique glyphs from those drawn for the text face (though are meant to feel like they come from the same family in terms of size and style and weight).</p>
      <p>Oblique, on the other hand, is usually more of a mechanical slanting of the standard glyphs rather than a re-drawing of the glyphs. </p>
      <p>There's also the issue outside of the typeface itself when it comes to the wordprocessor. Smart wordprocessing software, when you click the italics style icon will swap out the current typeface for the italics version of the typeface. If there is no italics version, it will take the standard text face and distort it (obliquing it [is obliquing a verb?]).</p>
