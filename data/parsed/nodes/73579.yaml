  html: <p>What are the differences between the two? Is italic simply a character that's been tilted using software, and oblique is one that is drawn as a slanted character from the get go?</p>
  html_clean: <p>What are the differences between the two? Is italic simply a character that's been tilted using software, and oblique is one that is drawn as a slanted character from the get go?</p>
