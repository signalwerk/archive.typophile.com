    <p>Hi all, it's been a long time since I last posted on Typophile, but at least I lurk here regularly whenever I have time.</p>
    <p>I am currently working on a stationery system redesign, and obsessing on a typographic detail.<br>
    In setting type on a main single column, it makes sense to divide it in logical blocks with vertical space, like this:</p>
    <p>address block<br>
    (more than one line)</p>
    <p>phone<br>
    fax number</p>
    <p>e-mail address<br>
    website URL</p>
    <p>I am wondering if the best solution is to separate the paragraphs with hard returns but keeping the leading constant, or opt for vertical space lines with reduced leading. For example: let's say my text blocks are set at 8/10 pt, but my space lines have only a leading of 6pt.<br>
    Is the asymmetrical leading a faux pas in this case? I wouldn't think so, since it's not running text, and the column certainly looks more compact than with the other solution. Is there a rationale in deciding how much to reduce leading, like dividing it by half maybe?<br>
    I could provide my own screenshots, but I found an example of asymmetrical leading in a stationery system here also:</p>
    <p><a href="http://www.irisassociates.com/notts_dev/stationery_examples.html" rel="nofollow">University of Nottingham stationery</a><br>
    (the business card link is probably the best one to see what I am talking about, on the right column)</p>
    <p>What is your opinion on this? Would you separate blocks with simple hard returns instead?<br>
    Thank you all for your answers.</p>
