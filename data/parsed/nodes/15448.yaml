    html: <p>I really think that the guide has to be the appearance other than any set spacing rule in cases where it isn't running text, but rather separate groupings of information. It must make sense optically instead of numerically, in other words. With a business card, where several related but distinctly different groupings of information have to be conveyed, I don't even think that the driving concern should be consistency. The goal is to move the reader through the info at the pace YOU intend.</p>
