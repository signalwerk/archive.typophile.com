      <p>There are no "rules" about using aligning and non-aligning, as earlier posts have said <em>if it looks good, it is good</em>, essentially you are trying to present your client's information in a useful* and attractive way. Personally I prefer the look of old style numerals.</p>
      <p>*by useful I mean that the recipients of the letter/business card can pick out the details they might need.</p>
      <p>Tim</p>
