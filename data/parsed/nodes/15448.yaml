      <p>Thank you all for your imput.<br>
      Actually, the column of text has 5 blocks total, all consisting of two lines: so it is symmetrical already.<br>
      Tim, I have to confess that I am doing something a little against the rules: I am using old-style numerals, even though it's not running text. Would that be a mortal typographic sin in a stationery system?<br>
      I know you're supposed to use lining figures when you stack lines of numbers, but I am using small caps in two blocks, and I hate the way lining figures look with them (I have T and F for telephone and fax in small caps, plus IVA and CF in the last block also, which are the Italian equivalent of VAT numbers). The CF line is actually a mix of numbers and letters, and I think small caps + old style figure look great in this case.<br>
      So, with 10 lines of text stacked in blocks of 2, the column is quite tall: I like the way it looks with line spaces of reduced leading instead of simple hard returns. It adds a certain variety, and the column looks much more compact.<br>
      I think I'll opt for that solution, reducing the leading by half in all the space lines since my numbers do have ascenders and descenders.</p>
