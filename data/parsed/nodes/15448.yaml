      <p>With the blocks that you suggest, the space between numerals and email address might appear more due to the absence of descenders on aligning numerals, unless like the link you provided you have an uppercase postcode. If the last line of the address contains upper and lower case you could work on a percentage of leading, you could, for example, specify half line space after address block and third line space after the numerals. However, because aligning numerals are the same height you could also consider greater leading for the two lines of numerals.<br>
      Tim</p>
