    html: |-
      <p>I've downloaded Birdfont and tried it for a few minutes. I didn't like it. It looks simpler and a lot prettier than FontForge, but the interface feels backwards in a lot of ways, notably how simple drawing tools default to the right mouse button instead of the left. Plus there is the insistence that if you don't pay a donation the author for what is supposed to be free, open-source software, it compels you to license fonts made with it under SIL-OFL terms. You can't even download it unless you enter a number in the donation box (though it will accept a zero).</p>
      <p>I'll give it another try later for a more thorough evaluation, but it just gives me bad vibes so far.</p>
