      <blockquote><p>I hear a lot of complaints about stability of the Windows version of FontForge.</p></blockquote>
      <p>It has been a real pain for me on Windows, the most notable issue being unexpected shut down of the app, with no clear indication as to why. However, not being a requirement that it works in Windows (for me) means I am not particularly bothered either. My experience with the Mac install is much better and with Ubuntu (running through VirtualBox on my Mac) it is (so far) faultless.</p>
