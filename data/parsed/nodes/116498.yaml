    date_raw: 13 May 2014 — 2:17pm
    votes: null
    html: |-
      <p>Thanks Hrant, </p>
      <p>The 'experiment' here was mixing a fairly geometric regular, with a more calligraphic italic. To make them different enough have an interesting typographic color, but blending in well.</p>
      <p>Many font foundries don't do real italics anymore, that way they can commercialize the font sooner.</p>
      <p>So, as I wanted the typeface to 'stand out', I spend more time working on the italics than on the regular versions, which was a first for me! :)</p>
