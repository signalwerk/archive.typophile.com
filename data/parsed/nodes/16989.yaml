      <p>Yay!</p>
      <p>I think it would be a good idea to look after some of the openings &amp; smaller parts &amp; adjust the letters to ensure that these features don't become too obscure. Some examples:</p>
      <p>- the opening under the swash in the Q<br>
      - the Space under the Cross bar in the cap A</p>
      <p>to a lessextent the small gap in the a &amp; e</p>
      <p>Maybe the spike in upper case G's tail ( thats probably not the word but..) could be accentuated.</p>
      <p>The Top of the A O &amp; e seem low/short. I think They may ned to overshoot a bit more to look even.</p>
