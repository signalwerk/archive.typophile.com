    html: |-
      <p>There is more than one way to create a dynamic feeling. If you look at JFP's Costa</p>
      <p><a href="http://www.typofonderie.com/alphabets/view/CostaPTF">http://www.typofonderie.com/alphabets/view/CostaPTF</a></p>
      <p>Se what happens to the shapes as they get bold? They exagerate the contrasts in 'stroke' or use another term if you prefer. Look at the lc 'a'. Look at the bowl especially. This contrast in the stroke gives the face a dynamic expressive feeling. Anyway that is the kind of thing I was thinking of. It's true that sometime the exageration might not work - especiually when the shapes are not quite typical or are a little eccentric  like in the case of the uc X. But in general I think it does work. There are lots of other faces where you can see this kind of thing going on but I think Costa seems especially instructive because the final weight is so exagerated - and yet it still works wonderfully well.</p>
