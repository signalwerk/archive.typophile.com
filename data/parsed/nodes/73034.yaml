    html: |-
      <p>Back in the days of Postscript Type 1, a non-expert could look up values such as the x-height in the AFM, which was a simple text file. Of course, the usefulness of this depended upon that parameter having been correctly set in the font, which it often wasn’t.</p>
      <p>Nowadays, you’d pretty much have to crack open the font to get this data. The conversion to points is just a matter of dividing the value by the em unit setting in the font (generally 1000 for CFF/OTF and 2048 for TTF/OTF) and then multiplying the resulting decimal by the point size. </p>
      <p>Or you could just measure the darn thing, as Frode suggests.</p>
      <p>But I agree, using the x-height as a basis for determining your baseline grid seems to me to be full of potential to go horribly wrong, if you don’t already have a good eye for this sort of thing.</p>
