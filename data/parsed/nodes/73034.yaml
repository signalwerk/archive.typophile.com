  html: |-
    <p>Hi guys,</p>
    <p>how do you measure a font's x-height?  I am experiment with different baselines and grids for a project and I read in one of typophile forums that a good baseline should be based on the font's x-height and not on its size in points. </p>
    <p>By the way, can i get the x-height measure in points? is there any online converter for this?</p>
    <p>thanks for any info</p>
    <p>cheers<br>
    Sebs</p>
