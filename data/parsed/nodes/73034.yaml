    html: <p>You can measure the x-height with the rulers in inDesign, but there are so many variables basing leading on some formula is a waste of time IMO. Trust your eyes! And, obviously, you need to read what you’re setting. If the lines are too close, finding where you left off when you get to a new line might be hard. Does the ascenders and descenders touch? Does the page evoke the “feel” you’re after? And so on …</p>
