    html: "<p>A simple way to determine the x-height - in InDesign: type a few x's, separated by a return (so there are x's on TWO lines. Give these a typesize as required and a Leading that is the same as the typesize. Zoom in as far as you can. Now lessen the Leading until the extremes of the x's touch (you may have to use smaller units than full points). The x-height is the Typesize minus the value of the Leading.</p>"
