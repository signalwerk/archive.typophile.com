    <p>In <a href="http://typophile.com/node/13473#comment-78104" rel="nofollow">this thread</a> Terry Biddle said he can't get the New York MTA to listen to him about the need for better way finding. Dan Weaver chimed in confirming they are awful. I observed lousy new signs in a visit. </p>
    <p>Since Mayor Bloomberg has declared 'Type Week' why don't we get a resolution or petition going at TypeCon to have the MTA invest in a project for the superb, coherent signage that NYC deserves?</p>
    <p>Dan Weaver, or others, do you know the current history of this?</p>
    <p>Since Bloomberg has already declared the 'Type Week' we might be able to get press on it, and make something happen.</p>
