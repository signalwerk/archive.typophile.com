      <p>Here's some stats:</p>
      <p>System Completion<br>
      London: 1863<br>
      Paris: 1900<br>
      New York: 1904</p>
      <p>Number of yearly subway riders (in millions):<br>
      London: 832<br>
      Paris: 1,170<br>
      New York: 1,132</p>
      <p>This is according to stats published after 2003. So as you can see, I was off be about 30 years in regards to New York's system! London's is indeed the oldest. New York of the other two, is the youngest. In defense of New York I should add that it has far more stations to maintain than either of those cities AND it is the only one of these systems that stays open 24 hours. While it wins in convenience (most days) I think being open 24 hours is like shooting yourself in the foot maintenance wise.</p>
      <p>When was the last time anyone has been to a pristine 24 hour restaurant? I certainly have never been inclined to eat eggs off the floor at Waffle House. :)</p>
