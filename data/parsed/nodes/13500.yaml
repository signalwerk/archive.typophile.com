      <p>My feeling about the NYC transport signs is in agreement with both John Berry's review in Chris's link, and James Montalbano's comments, above. </p>
      <p>I agree with Berry that the main problem is not the way finding of the map and guide signs, but the internal station signs. But the look of the way-finding (Helvetica and Akzidenz Grotesk) is tired, and could benefit from a general update. </p>
      <p>What upset me was to see newly installed internal station signs that are obviously by somebody who knows nothing about letters, and are awkward and ugly.</p>
      <p>As to consistency, I agree with James that this is not so important as concerns the internal signs. What is important is that they are easy to see and look good, which is not always the case now. Many are in digraceful disrepair also. There could be different styles on different lines, for example. </p>
      <p>One suggestion I have is that NYC could commission different foundries to do the internal station signs for different lines, with consistent guidelines as to size and location. There is a lot of talent out there, and this could come up with varied, good looks. </p>
      <p>I lived in London for five years, and to me perhaps no typeface is so  much a part of a city as Johnston's Underground sans, used throughout the London Underground. Its plain but personal letters are like an old friend when you travel the 'Tube.' (I write as the horror of terror attacks in the Underground is reported. Heartbreaking.)</p>
      <p>Just because of the disrepair of many of the station signs, there is plenty of reason to rethink the signage for the whole system. </p>
      <p>The other big thing is the New York bus system. London seems to have redone the guide signs at the bus stops, and it is really first rate. In New York, there seems to be nothing on the bus stops, so that only locals can use them, and then have to work to figure out the system. The busses really do need a new way finding system.</p>
  - id: 78149
    user: 7475
    date: 2005-07-07T07:01:00
    date_raw: 7 Jul 2005 — 7:01am
    votes: null
    html: |-
      <p>"What are unique symbols you propose for the: A, B, C, D, E, F, G, J, L, M, N, R, S, Z, 1, 2, 3, 4, 5, 6, 7 trains. They are already organized by color as well. Have you really thought about this?"</p>
      <p>Thanks, James. I couldn't have said it better myself. :) James brings up some very good points and it is something that I had to come to grips with when I was trying to redesign the system. Familiarity is something that shouldn't necessarily be broken when restructuring a system. I went completely out-there when I first started working on this project, but towards the end I realized what did work and kept many of the strong ideas Vignelli originated. Here's what I found didn't work:</p>
      <p>1) The phrasing on the signs is not consistent nor is it always clearly articulated<br>
      2) The signs themselves lack crucial information needed to make split second decisions when arriving at platforms<br>
      3) The background color creates an undesirable mood in an underground environment<br>
      4) The typography is too large for the sign positioning and the rider's actual proximity to the words displayed<br>
      5) Chris brought up a good point in that the Station Identification signs are completely inconsistent, they also are not clearly marked or positioned properly to the height of the windows in subway cars.<br>
      6) Same number or line designations (A, 7, 6) that follow DIFFERENT train paths</p>
      <p>While I have made an attempt to correct those issues as I saw them, I'm not going to say that I made the end all be all solution to these problems. BTW, if someone can tell me how to post jpgs here, I'd be more than happy to show my solution to the Station Identification problem.</p>
      <p>Yes, the subway uses Akzidenz-Grotesk (originally) and Helvetica. Vignelli originally chose Akzidenz-Grotesk and chose the type to be shown in negative rather than positive contrast. There are still remnants of some of these signs in various stations around the city. For whatever reason the MTA switched later to Helvetica and made the signs black with white type. I do think that the decision to go with positive rather than negative contrast was a change for the better.</p>
