      <p>The idealist in me certainly agrees with you William. Change must begin somewhere, and it is indeed an uphill battle. James has PLENTY of experience in regards to this sort of matter and I'm sure what he states has a large degree of truth. </p>
      <p>Still, it is certainly a dream of mine to be involved in a mass transit wayfinding project and I would hope to someday help fix New York's problem. Given the many unreturned phone calls and even being "stood-up" for an appointment (with no call-back) it is becoming increasingly apparent that the MTA has a lot of people working for them that frankly, "just don't give a sh*t".</p>
      <p>While I respect native New Yorkers opinions, I have noticed many inner-city political issues becoming stagnant based on some natives' reluctancy for change. This city is supposed to be one of the most liberal, yet at times it seems stuck in the past and not wanting to move forward...the most common complaint I have heard is about "convenience". Plenty of New Yorkers don't want to be inconvenienced (main complaint of the 2012 Olympics). the economy is having hard times here and I don't see why the city and state government don't see 2 crucial elements that can drive more money and tourism in the city:<br>
