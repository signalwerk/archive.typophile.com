      <p>"How does something like this even begin to get off the ground?" </p>
      <p>The question I've been asking myself for over a year. I also have to disagree David. The things you mentioned are not set in stone. Those changes have nothing to do with:<br>
      1) Sign placement<br>
      2) Navigational symbols<br>
      3) Legibility</p>
      <p>All of which CAN be improved upon. Paris is undergoing these changes as we speak. London, Paris and New York's subway systems were all created within around 10 years of each other. Also, London's system is actually OLDER than New York's. If you have seen their transportation systems up close before, you would see there is no comparison as to who the winner is in regards to system upkeep. Additionally, if we want to discuss system complexity and wayfinding, Paris' system trumps New York's in regards to the number of daily subway riders annually. Add all these factors up and there is really no excuse for New York's system to be deteriorating the way it is.</p>
      <p>I also wanted to point something out to some non-New York residents. The mayor has absolutely NO control of the MTA. The MTA is operated by the Port Authority of New York, which is run by the state, not the city. The man ultimately in charge is Governor Pataki, not  Mayor Bloomberg. This is part of the problem. Bloomberg made a play earlier in his term to gain control over the MTA. Unfortunately, the plan fell through. This is why some of you may have been hearing about fund distribution problems in regards to Homeland Security money. The money that is given to the city for transit security is allocated by the state, not the city government. Too many hands having to pass the buck ultimately loses a few.</p>
