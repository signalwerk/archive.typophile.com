      <p>&gt;Get real, guys - let’s start fights we can win.</p>
      <p>Cynicism about the political process is now the most common excuse for inaction, but it is a poor one. </p>
      <p>Outside, the signage for the NYC subway has class, though the design is a bit stale. Inside, the subway just assults you with its noise, grime, smell, and the disrepair and frequent ugliness of its signage. </p>
      <p>I detect here something of the cynicism of the locals in the New Yorkers' resignation to the current state of affairs. Those of us who more recently have come to love the city, such as Terry--me as well--just don't see the current state of affairs as inevitable.  </p>
      <p>David says that this would be a 20 year project. Well a journey of a thousand miles begins with a single step, as the Chinese say. It seems to me that Typecon and especially the TDC would be the perfect ones to establish a committee to try to make something happen, and get a movement going. </p>
      <p>In the 60s the movement to save the old Penn Station failed, but that the effort sparked the historical preservation movement, which has succeeded in saving many worthwhile buildings around the country. I myself with a friend started a successful movement to block an ugly public statue from being installed locally, so I know citizen efforts can succeed.</p>
      <p>I know there is a kind of pride of New Yorkers in being tough enough to ignore the assault of the subway. But a perverse pride it is, given that other major world cities have done better.        </p>
      <p>New York is the capital of the graphic design community in the US, but the single most often seen example of graphic design in the city--the transport system--is pitiful in many respects. Is this really OK with the design community--private splendor and public squalor? </p>
      <p>I read with some bemusement the regular attacks on private 'capitalist' corporations here by designers whose work is in fact generally for private corporations. Well, here's a chance to make a positive difference in the public space.</p>
