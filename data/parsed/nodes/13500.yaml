      <p>Not that it matters, but the PATH trains, (Port Authority Trans Hudson) formally know as the Hudson Manhattan Tubes, are older than the NYC subway. I read somewhere that they are the oldest subway system, but really, who cares which one is older, they all run like they were built when they were built. The PATH signage is pretty lousy as well.</p>
      <p>One of the unique things about the NYC subway is it has a two track system, with express trains running on separate tracks than the local trains. This was one of the most important factors in allowing the city to grow and have workers able to commute from far flung city locales in a timely fashion.</p>
