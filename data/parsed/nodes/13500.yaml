    html: <p>As previously stated, the mayor of NYC has little control over the MTA. Guiliani cleaned up the graffitti, turned midtown into a suburban mall, as well as shipping all the homeless to points unknown. (they're back) Whatever money the MTA has spent restoring the system came about from the public rejection of the collapsing subway system. Less ridership, less revenue. The improvements all came about because of economic pressure from the city's business sector to have a fuctioning subway system, not becuase of aestheics. The fact that Gov. Pataki holds the purse string on the MTA is significant. Albany has not increased its allocation to the subway (most of the funds  to support and improve suburban rail lines). To finance the subway improvements has meant the MTA has borrowed too much, and almost all of its budget for the forseeable future will go to paying off the debt. Not much left for anything else. You can already feel the decay of the subways beginning again.</p>
