      <p>I'd be careful about using Opti fonts as a standard for naming, because the fact is that most of their fonts have alias names, though not all. I think the Jaspert 'Encyclopaedia of Type Faces' is a better authority, and it shows 'Schadow Bold Condensed' as identical to Shattuck, as far as I can see.</p>
      <p>- Mike Yanega</p>
