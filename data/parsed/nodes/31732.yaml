    <p></p><div class="imageWrap"><img src="http://typophile.com/files/shattuck_sample_4931.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/shattuck_sample2_4614.gif"></div><p></p>
    <p>I have a copy of this slab serif font called Shattuck, but the only information I have on it is "Copyright 1994 Novelfonts! Corporation". NovelFonts is a foundry that doesn't exist anymore, and it seems like their business model was to release copycat fonts under slightly different names than the original. I'm having trouble finding the name of the original or its equivalent. </p>
    <p>I found a misleading match in the Solotype Catalog which calls this face "Schadow Antiqua Bold Condensed" but googling that name is a dead-end; URW Schadow Antiqua is definitely not the same font. Identifont.com didn't get a match, either.</p>
    <p>Thanks for any help!</p>
    <p>//john</p>
