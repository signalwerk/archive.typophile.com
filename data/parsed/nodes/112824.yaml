      <p>Very close to <a class="freelinking external" href="http://fonts.gestalten.com/planeta.html" rel="nofollow">Planeta</a> by Dani Klauser but that's not it (/M centre vertex pointy, /G and digits...).<br>
      The second one, used on <a class="freelinking external" href="http://src783.com/" rel="nofollow">SRC783 Magazine</a> by <a class="freelinking external" href="http://nickthomm.com/magazine" rel="nofollow">Nick Thomm</a> is <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/relish-pro" rel="nofollow">Relish</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/guildford-pro" rel="nofollow">Guildford</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/windlesham-pro" rel="nofollow">Windlesham</a>.<br>
      More in the same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/adequate" rel="nofollow">Adequate</a>, <a class="freelinking external" href="http://lineto.com/The%20Fonts/Font%20Categories/Text%20Fonts/Brown" rel="nofollow">Brown LL</a>, <a class="freelinking external" href="http://www.myfonts.com/search/monod" rel="nofollow">Monod</a>, <a class="freelinking external" href="http://www.railfonts.com/cgi-bin/font_shop/fontshop.cgi?ACTION=enter&amp;thispage=page10.html" rel="nofollow">CityOf</a> (no lowercases), <a class="freelinking external" href="http://www.myfonts.com/search/erbar" rel="nofollow">Erbar</a>, <a class="freelinking external" href="http://www.myfonts.com/search/monod" rel="nofollow">Monod</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/talbot/kessel-105" rel="nofollow">Kessel 105</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/neuzeit-grotesk" rel="nofollow">(DIN) Neuzeit Grotesk</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/geometric-706" rel="nofollow">Geometric 706</a>, <a class="freelinking external" href="http://www.typographyserved.com/gallery/ZIAMIMI-DAMIER-Free-Font/4154989" rel="nofollow">Ziamimi</a> (no lowercases), <a class="freelinking external" href="http://www.myfonts.com/fonts/thinkdust/nanami" rel="nofollow">Nanami</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/i-can-be-your-type/damian" rel="nofollow">Damian</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/ealing" rel="nofollow">Ealing</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/report-school" rel="nofollow">Report School</a> (/M and /I off), <a class="freelinking external" href="http://www.tendollarfonts.com/alumia" rel="nofollow">Alumia</a> (no lowercases), <a class="freelinking external" href="http://www.behance.net/gallery/Throne-Gothic-Typeface/8841207" rel="nofollow">Throne Gothic</a> (no lowercases, used to be sold at <a class="freelinking external" href="http://www.tendollarfonts.com" rel="nofollow">Ten Dollar Fonts</a>), <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/diamonds" rel="nofollow">Diamonds</a> (no lowercases), <a class="freelinking external" href="http://www.myfonts.com/fonts/words-pictures/dupe" rel="nofollow">Dupe</a>, <a class="freelinking external" href="http://www.tendollarfonts.com/leberkaas-grotesk-typeface" rel="nofollow">Leberkaas Grotesk</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/quadrat/toronto-subway" rel="nofollow">Toronto Subway</a>, <a class="freelinking external" href="http://www.swisstypefaces.com/fonts/euclid-flex" rel="nofollow">Euclid</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/maax" rel="nofollow">Maax</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/alias/ano" rel="nofollow">Ano</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/thinkdust/ebisu" rel="nofollow">Ebisu</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/thinkdust/nanami" rel="nofollow">Nanami</a></p>
