    <p>Hi,</p>
    <p>I'm looking for the font (or similar) used in these particular fridge magnets.</p>
    <p>I'm aware of other fridge magnets that typically use Vag and cooper black style typefaces.</p>
    <p>Any help would be very much appreciated!</p>
    <p>Gary</p>
