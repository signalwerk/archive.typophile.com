      <p>If it is Futura bold the j was modified too.  It would look just like the i if it wasn't.  The c certainly looks like Futura bold.</p>
      <p>I don't think these are real frig magnets.  The dots on the i and j aren't connected.  And aren't frig magnets usually in all caps?</p>
