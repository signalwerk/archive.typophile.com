    html: |-
      <p>I remember magnets from the 1970's that looked like those letters. They weren't fridge magnets, they went on a metal board, had cheap bar magnets snapped into the back. The dots were connected by thin bits of the plastic.</p>
      <p>These images are "3D" re-creations of the originals.</p>
