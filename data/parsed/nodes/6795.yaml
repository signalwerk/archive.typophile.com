      <p>Well some online research has led me to <a href="http://www.threebrand.com/page/Smirnoff_Lime.aspx" rel="nofollow">Threeview</a> agency in Edinburgh, who seem to be responsible for the latest ad campaign. I've just e-mailed to see if they can tell us the designer.</p>
