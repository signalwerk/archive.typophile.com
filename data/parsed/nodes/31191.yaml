    <p>February 6, 2007 </p>
    <p><strong>Yes– new fonts from Fountain!</strong></p>
    <p>We're back. We have typefaces. Fine, fine typefaces. Lovely precious typefaces. We want to present them to you: </p>
    <p><strong>Jalapeño</strong><br>
    A happy, springy display face with an extra 30 dingbats.<br>
    Direct link: (<a href="http://www.fountain.nu/catalogue/jalapeno.asp" title="http://www.fountain.nu/catalogue/jalapeno.asp">http://www.fountain.nu/catalogue/jalapeno.asp</a>)</p>
    <p><strong>Borgstrand Stencil</strong><br>
    An expansion of Borgstrand. Two cuts&nbsp;- one with rounded corners, similar in flavor to the original typeface. The second "cut-out" version is specifically tuned for stenciling in the real world - since it has been designed to be cut out.<br>
    Direct link: (<a href="http://www.fountain.nu/catalogue/borgstrand.asp" title="http://www.fountain.nu/catalogue/borgstrand.asp">http://www.fountain.nu/catalogue/borgstrand.asp</a>)</p>
    <p>Both typefaces designed by Martin Fredrikson. </p>
    <p><strong>Eason</strong><br>
    Eason evolved from Nicolas Jenson’s 1470 roman. Jenson has been revived and remixed so many times, conscious decisions were made to transform Eason into a new creation. The postmodern result is very far afield from Venetian Renaissance types, a hard-working choice for the most demanding projects. Designed by Randy Jones.<br>
    Direct link: (<a href="http://www.fountain.nu/catalogue/eason.asp" title="http://www.fountain.nu/catalogue/eason.asp">http://www.fountain.nu/catalogue/eason.asp</a>) </p>
    <p>See also how the whole typefaced evolved right here at Typophile:<br>
    <a href="http://typophile.com/node/2349" title="http://typophile.com/node/2349">http://typophile.com/node/2349</a><br>
    <a href="http://typophile.com/node/9290" title="http://typophile.com/node/9290">http://typophile.com/node/9290</a></p>
    <p><strong>Anziano</strong><br>
    When creating a traditional typeface, you will be inevitably influenced by earlier designs. Anziano shows some touches of Weiss (Emil Rudolf Weiss, 1926). Bu Stefan has tried to find his own path with Anziano and has made a typeface design that lives on its own.<br>
    Direct link: (<a href="http://www.fountain.nu/catalogue/anziano.asp" title="http://www.fountain.nu/catalogue/anziano.asp">http://www.fountain.nu/catalogue/anziano.asp</a>) </p>
    <p>We've made small printable PDF's of each of the new releases.</p>
    <p><strong>Upcoming fonts with a few words</strong> </p>
    <p><strong>Dessau</strong><br>
    Gábor Kóthay goes Bauhaus – in all sorts, ways, avriations and forms. </p>
    <p><strong>Tycho</strong><br>
     Lucas Magnusson joins Fountain with a revival of famous danish astronomer Tycho Brahe's own fount. </p>
    <p><strong>Atlantik</strong><br>
    Daniel &amp; Sylvia makes the nicest (and weirdest) pattern/dingbat ever. OP-art springs to mind. I get all dizzy just looking at it.</p>
    <p><strong>Flieger</strong><br>
    based on an old airplane logo from the early 30's Göran Söderström not only joins Fountain, but also makes a fanatstic gridbased script. Lotta Bruhn joins in to draw the ornaments. </p>
    <p>Take a fast peek in our Fresh/upcoming section.<br>
    Direct link: (<a href="http://www.fountain.nu/catalogue/fresh_upcoming.asp" title="http://www.fountain.nu/catalogue/fresh_upcoming.asp">http://www.fountain.nu/catalogue/fresh_upcoming.asp</a>)</p>
    <p><strong>More Things</strong></p>
    <p>– We've changed location, and now have a wonderful large office. Images to come as soon as we've gotten organized,and a bit more tidy. </p>
    <p>– Small printed specimen of the last few Fountain releases coming real soon.</p>
    <p>– Large book/catalogue with many nice pages later this year. As soon as all fonts has been transformed to OpenType. </p>
    <p>– Restructuring of website, due before the end of fall.</p>
    <p>Tills vi hörs igen – simma lugnt! </p>
    <p><strong>Peter W. Bruhn, principal designer &amp; owner</strong></p>
