    html: |-
      <p>Mark, </p>
      <p>class names are not at all part of the OpenType spec altogether. They're not included in the final font files at all. They're just being used by the Adobe FDK for OpenType library that converts the text-based feature specification into binary OpenType Layout feature tables. And yes, indeed, the convention of starting names of classes that are used for kerning with an underscore ("_") is just a convention used within FontLab Studio. This way, FontLab Studio "known" which classes are to be used when it generates the feature specification for the "kern" feature. </p>
      <p>Similarly, the key glyph is a concept used within FontLab Studio to simplify the internal storage of data (kerning pairs are "attached" to glyphs in FontLab Studio). This is pretty much a remainder of old FontLab 3.x where there was no concept of class kerning. It's possible that at some point, we'll develop a fully new way of dealing with kerning which will not require key glyphs. </p>
      <p>Cheers,<br>
      Adam</p>
