      <p>Hi Adam, one way to deal with this is defining classes by left/right side of glyph logic, regardless of glyphs' writing direction. Setting a left flag means that glyphs' left sides are similar. Always. Upon (kern) feature generation, lookups' LTR/RTL flag determines whether the translation is left=2nd &amp; right=1st, or right=2nd &amp; left=1st. Not a big thing. In addition, source data for LTR/RTL kerning should be defined and kept independently of each other.<br>
      Malcolm, OT layout table's logic of 1st/2nd is layout engine logic. There is nothing wrong with it. But personally I think that a left/right logic is more in tune with how designers think: left side of a glyph is the left side of a glyph, regardless of writing direction.</p>
      <p>Karsten</p>
