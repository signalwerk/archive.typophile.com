      <p>That bullet in the middle has confused me a few times. </p>
      <p>The way I think of it (when I have it right) is that the bullet represents the glyph that the class is kerning against. So, if you want the class to be considered when its members are on the left side of another glyph, click the left check box. But a few times I've got it inside out and thought the bullet represented the members of the class, and the check boxes represented the other half of a kerning pair, either on the left or on the right, which is backwards. </p>
      <p>Most of the time I get it right--er--correct. But I think it would be less confusing if the bullet in the middle were removed. Just have the two check boxes, which would then clearly represent the two possible positions in a kerning pair with no third element to muddy the waters.</p>
