      <p>Cristobal, </p>
      <p>in left-to-right scripts, if glyphs are identical on the LEFT side then it means they will share the same kerning value if they are the 2nd glyphs in the pair. In right-to-left scripts, if glyphs are identical on the RIGHT side then it means they will share the same kerning value if they are the 2nd glyphs in the pair. </p>
      <p>In both cases, the 2nd checkbox needs to be activated. It would be far too complex from the UI standpoint to somehow make sure that the checkboxes relate to the left or right side of the glyphs, because that depends on the direction of the script. But if you think about the logical order of the glyphs in the kerning pair, one is always 1st and the other is always 2nd, and this is what the checkboxes reflect. I'd be happy to hear your suggestions how to improve this, provided that the solution will be workable for both LTR and RTL scripts, of course. </p>
      <p>Cheers,<br>
      Adam</p>
