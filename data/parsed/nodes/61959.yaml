      <p>If I understand you correctly, this is a simple task:</p>
      <p>_kern1: A' Adieresis Aring Agrave Atilde Acircumflex Aacute Amacron Abreve Aogonek<br>
      with LEFT checkmark marked: [√] | [ ]</p>
      <p>_kern2: A' Adieresis Aring Agrave Atilde Acircumflex Aacute Amacron Abreve Aogonek AE<br>
      with RIGHT checkmark marked: [ ] | [√]</p>
      <p>The (confusing) logic behind this is to understand if the class is the first or the second letter in the kerning pair. For this reason I always change the name of the kerning class:</p>
      <p>_Afirst: A' Adieresis Aring Agrave Atilde Acircumflex Aacute Amacron Abreve Aogonek</p>
      <p>_Asecond: A' Adieresis Aring Agrave Atilde Acircumflex Aacute Amacron Abreve Aogonek AE</p>
      <p>———</p>
      <p>And you might want to include Æ in a E class as well:</p>
      <p>_Efirst: E' Egrave Eacute Ecircumflex Edieresis AE (and so on)<br>
      with LEFT checkmark marked: [√] | [ ]</p>
      <p>Is this what you are looking for?</p>
