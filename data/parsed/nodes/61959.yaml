      <p>There are two checkmarks that represent the glyph classes in a kerning pair, and the dot in the middle represents the kerning pair. </p>
      <p>If the left checkmark is enabled, all glyphs in the class that is on the left side of the kerning pair get the same kerning value as its key glyph. </p>
      <p>If the right checkmark is enabled, all glyphs in the class that is on the right side of the kerning pair get the same kerning value as its key glyph. </p>
      <p>The "AE" glyph is one where you want to share E's kerning value if the glyph appears on the left side of the kerning pair — so you enable the left checkbox. </p>
      <p>Cheers,<br>
      Adam</p>
    html_clean: |-
