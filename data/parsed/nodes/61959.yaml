    <p>When setting up kerning classes in FontLab Studio, how do I make use of those left/right checkmarks? I read the manual but I don't understand how I can make practical use of them.</p>
    <p>Let's say I've defined the capital A as a kerning class for all accented A's. Like this:</p>
    <p>_kern1: A' Adieresis Aring Agrave Atilde Acircumflex Aacute Amacron Abreve Aogonek</p>
    <p>How can I apply the left A kerning to the AE? I've always just done a copy from A and paste special, left kerning on the AE. It works, but I'd like to do it with classes</p>
    <p>I can see that I can define a whole new kerning class and have it apply to only the left or right side. But the A already has a class defined, I can't define another class for A: it already has a class.</p>
