      <p>Classes don't need to be numbered. That's just what happens by default. </p>
      <p>You can use any naming scheme that makes sense to you, as long as you start it with an underscore. The underscore tells FontLab that it's a kerning class, and not a metrics class (which start with a period) or an OpenType class (which have no special mark).</p>
      <p>Incidentally, if you decide to bypass FontLab's class kerning support and create your kern feature some other way (such as writing kern feature code directly in the OT panel or using an external tool such as Metrics Machine) you don't need the underscore or the key glyph (the one with the tick mark) at all. Those are only for FontLab's purposes and are not part of the OT spec.</p>
