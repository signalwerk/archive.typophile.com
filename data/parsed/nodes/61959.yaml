      <p>It would be nice if the next FontLab had a a different system for dealing with kerning classes. In an ideal system . . .</p>
      <p>Kerning classes would be set up in the font window, not in a separate dialog. You's switch into class mode. All the class parents would be highlighted. To make a new class parent, right click and create class parent. Select glyphs, drag &amp; drop them on the class parent and they're added to that class. If a glyph already belongs to another class, it cant be selected. However, if you deselected and clicked on that glyph, it would reveal its parent the rest of the class it belongs to. For each glyph, you can turn off left of right kerning. Perhaps there could be a way to make the left belong of one parent and the right belong to another.</p>
      <p>The classes wouldn't be numbered . . . the order is irrelevant. FontLab will automatically generate a proper class table.</p>
