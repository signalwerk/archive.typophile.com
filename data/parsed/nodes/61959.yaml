      <p>I find the left and right dots confusing too.  After doing all my classes backwards the first time I tried class kerning, I finally realized what the interface designer had done. I still think it makes more sense the other way and have to make a very conscious effort to do it the FontLab way instead of the intuitive way every time. Obviously, I am not the only person who thinks left kerning means the space to the left of the glyph in question. Even after 5 years of doing it the FontLab way, I still find it very awkward and illogical. There may be an equal number of people in the world who think the FontLab way is logical--who knows. I am just happy to see it isn't just me being crazy.<br>
      Thanks Ray and Cristobal for helping me feel sane :-)</p>
      <p>ChrisL</p>
