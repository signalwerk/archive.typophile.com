  html: |-
    <p>Ugh, I can't decide on a name for this font!</p>
    <p>I narrowed it down to either "VAS DEF" or "Tubers".<br>
    But now I can't decide between those two.</p>
    <p>I took a poll on Facebook, Twitter and Flickr,<br>
    but the results came out pretty even.<br>
    "Tubers" got a few more votes, but<br>
    "VAS DEF" had a much louder fan base<br>
    who type in all caps a lot.</p>
    <p>I like both names, but I feel like I really<br>
    need to just pick one. So I need some help.<br>
    Font pic is below I think.</p>
    <p>Which name do you like better?</p>
    <p>-chank</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tubers_v_vasdef_6109.jpg"></div><p></p>
