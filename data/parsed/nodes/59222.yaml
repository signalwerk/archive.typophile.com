      <p>Kent is right about distance being an important variable. By my back-of-the-envelope calculations, we can't detect additional resolution beyond 300 dpi from a distance of 50cm. The problem is that when we want to evaluate text quality, we typically get closer to the screen. But any screen becomes a high density screen from a far enough distance.</p>
      <p>I'm pessimistic that screen resolutions are going to get drastically better by 2015. LCD pixels are inefficient at letting the light from the backlight through, and smaller pixels are much less efficient. Backlights are already the single biggest power users on laptops. Many consumers are asking computer manufacturers for longer battery life and fewer are asking for higher pixel density. I think we're going to see battery life increase to a full day's use first.</p>
