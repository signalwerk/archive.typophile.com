      <p><cite>I’m getting worried about the inertia.</cite></p>
      <p>For a long time the RAM, CPU, and GPU power that new hardware gave up went to support bigger monitors and high refresh rates. In the last few years we’ve really reached the practical size limits for desktop monitors, and LCD adoption has locked refresh rates at 60Hz without complaints. Good 30" screens are affordable at consumer and professional price points, and most people don’t have the need or a desk big enough for anything larger. It won’t be long before the relationship of price to size or image quality is irrelevant to consumers in developed nations, so resolution will really be the best feature to sell displays with and inertia will be a non-issue.</p>
    html_clean: |-
