      <p>The frustrating thing is that prototypes were available quite a long time ago. In fact, the original <a href="http://en.wikipedia.org/wiki/T221" rel="nofollow">IBM T220</a> came out in 2001. I've been predicting it would happen sooner, or at least wanting it, for a while.</p>
      <p>If you want a small display, though, you can get a Nokia 810 (I have an 800, which is nice).</p>
      <p>I do think it is inevitable at some point. The incremental cost is going down and down as compute power goes up, and the increase in quality would be dramatic. For a while I was expecting Apple to do it, as it would be a way to really differentiate their product line from what's available in the PC world, but currently their PC business model seems to be all about packaging completely commodity parts at premium prices.</p>
      <p>The next challenge is to get Web graphics to work at higher resolutions. Bitmaps on the web are (more or less) locked at 96dpi. Of course, there's always SVG and so on, but at current trends it will be a while until most browsers actually support it.</p>
      <p>Except in some applications, I actually suspect 200dpi is adequate, because you can make the antialiasing really good on displays. In print, you need higher resolution because antialiasing is either difficult or impossible (there's essentially no control over gamma curves). By my calculations, ordinary text at 200dpi has about 95% of the contrast as it would on an infinite-resolution display, even without doing stuff like ClearType. At some point, people may decide that going for that extra 5% is also worth it, but I'd be plenty happy just to get the 200dpi any time soon.</p>
      <p>It's going to make a huge difference for type on the screen.</p>
