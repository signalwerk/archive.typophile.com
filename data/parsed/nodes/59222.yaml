      <p>I spent a long time today looking in a consumer electronics chain store.<br>
      Specifically, I took a very close look at the HP Touchsmart Laptop. The text was incredibly sharp and clear - haven't seen anything quite as good except on E-Paper.<br>
      Plus, the screen could re-orient itself from landscape to profile in all four directions instantaneously at the touch of a button.<br>
      Plus, it's a touchscreen "tablet", of course.<br>
      I was blown away by it, really.<br>
      All I could find out from the HP site is that it has an LED backlit LCD display.<br>
      I have a Dell Latitude notebook with a very good quality LCD screen with resolution set in Windows at 1280*800. It's quite sharp and clear.<br>
      The screen resolution on the HP Touchsmart was also set to 1280*800 but the text was much more print-like than on my Dell.<br>
      Any clues why that may be? Is it the LED backlighting or what?<br>
      (Price was $900, BTW)</p>
