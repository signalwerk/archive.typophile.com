    html: |-
      <p>Though about high-resolution displays and resolution-independent UI, the discussion* suffers from the pixels thrown from all sides.<br>
      As with other things too, there would need to be a break with the past. With res-independent UI there are only two factors to speak about:<br>
      -- resolution-independent UI with elements measured in mm, inch, etc.**<br>
      -- scaling of this UI including the mouse arrow, FLS5 nodes, etc.<br>
      The hardware driver would tell OS and apps about its size (mm, inch) and resolution (dpmm, dpi).</p>
      <p>How to deal with old pixel-based apps is another question. Maybe present them in special red-flagged windows ("Legacy! Update or forget!") that scale content or not, depending on user preferences.</p>
      <p>* Here, MS blog, Bill Hill's blog. Resolution-independence per se does not look like a big issue. Not for type designers who are used to think in abstract units (per em). Many contributions try hard to defend the status quo by complicating matters, mixing res-independent and pixel-based approaches, presenting calculations from pixels to display size to resolution and back to pixels.<br>
      Not sure about the UI in total but <a href="http://wiki.laptop.org/go/Making_Sugar_icons" target="_blank" rel="nofollow">this how-to</a> for making icons for OLPC's Sugar shows that it is possible.</p>
      <p>** Ideally, this was something as abstract as fonts' UPM, yet I think it is fine to starting from a real-world size that at the same time indicates what the designer considered ideal at normal viewing distance. The user would still be free to scale the result.</p>
