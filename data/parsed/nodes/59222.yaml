    html: |-
      <p>Re: "Real-world size"</p>
      <p>From a web development perspective, knowing the screen resolution - which you can query via JavaScript - gives you a very incomplete picture of what's physically being displayed to the user.<br>
      Example: A resolution of 1280*900 can be showing on a 15" wide-screen display or a 20" wide-screen display. And there's no way to know the difference. The 1280*900 number is being supplied by the OS, not the display.<br>
      What is the "real" size of the text? Only the user knows.<br>
      The plug'n'play spec was designed at least in part to have devices "announce" themselves with basic info about their capabilities.<br>
      I do not understand why, after all this time, displays do not report their actual physical size.<br>
      A puzzlement.</p>
