    <p>When are we going to have access to computer displays with pixel densities even beginning to approach print, say 300 pixels per inch? Although mobile devices boast higher resolutions, I don't remember seeing significant improvement in the pixel densities of computer displays for several years.</p>
    <p>I would dearly love to have even a tiny little 4-inch display as long as it has a high pixel density, that I can use as a secondary monitor to aid in the type design process. Is something like this possible with devices that are currently available on the market? When will such displays be available, or do manufacturers have no plans to improve the resolutions of displays for the average consumer?</p>
