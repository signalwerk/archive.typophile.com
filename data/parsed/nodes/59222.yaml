      <p>Thanks for all the insightful comments!</p>
      <p>Erik, I think one important issue is that current OSs are resolution-dependent, as the windows, menus, and icons of the user interface are bitmap-based.</p>
      <p>If you double the resolution in ppi, the windows, menus, and icons become a quarter of the original size.</p>
      <p>So it's not simply a case of pumping more processing power. The interface has to be re-designed to be scalable, so that an increase in resolution doesn't lead to tiny unreadable menus. Replacing the bitmap-based OS interfaces with vector-based ones probably won't be a trivial matter. And it's not just OS interfaces. Think about what web pages would look like shrunk dramatically in size.</p>
