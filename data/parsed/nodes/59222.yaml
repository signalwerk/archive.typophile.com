    html: |-
      <p>Re: "Real-world size ..."</p>
      <p>Don't take "real-world" too seriously, the second part of the sentence was the important one:<br>
      "... that at the same time <em>indicates what the designer considered ideal at normal viewing distance</em>."</p>
      <p>Of course one needs to start somewhere. Design is making decisions. Unlike in the world of material things (books have "fixed" sizes for centuries, including margins and type!), the digital world allows users to scale both UI and content according to their individual preferences (that was point two in my list).</p>
      <p>And there's nothing that would hold display device drivers back from specifying both size and resolution. (And please forget about actual pixel count.) With a new generation of OSes and software this could be a requirement. If or why it is not done today, does not really matter.</p>
