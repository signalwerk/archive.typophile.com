      <p>Good point, Raph, about 200 ppi being adequate for displays. And thanks for confirming that the technology has already been around for a while, something that I suspected. The IBM T220 sounds like a monster!</p>
      <p>So we've got resolution-dependent OSs and web graphics that lock us into the current resolutions and will make any substantial improvement in the density a bit of a hassle. Add the fact that manufacturers have been sitting on the technology for years, that the current trend in consumer technology has swung toward getting the same features cheaper rather than improving features and adding to the price, and I'm getting worried about the inertia. Reading discussions about the merits of different antialiasing technologies, I wonder whether such debates wouldn't be rendered obsolete if the resolution of displays simply improved. And of course, I would have less cause to worry about learning TrueType hinting...</p>
      <p>Really, I think I'd be happy to get my hands on a 200 ppi monitor by 2015. I'll be following James's advice until then.</p>
