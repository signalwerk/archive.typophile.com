      <p>&gt; and all the graphics on the planet would shrink, (millions needing to be re-rendered)... wouldn’t they?</p>
      <p>Not necessarily. They will just be smaller within a larger frame. Their clarity will remain consistent, as their pixel dimensions will be maintained.</p>
      <p>Notice that as the frame has increased from the original 640x480 the actual size of characters on the screen has not changed all that much. I note that this site is one of many on the web that no longer use the full width of the screen, as was the norm in 1995.</p>
      <p>The change will be that designers will start to use the bigger frame to create new larger graphics. Background images may have to be enlarged, but many elements will remain useful at their current size.</p>
