    <p>Hi there! I have been SEARCHING high and low for this font and can't find it anywhere! I have it as an embroidery design, but would like to match it in true type font so I can use it in my other embroidery program.  If you search for Jack and Jill font you only come up with the embroidery font option-not what I need.  I'm sure there has to be a match out there somewhere, but I haven't been able to find it.  Any help or suggestions?</p>
