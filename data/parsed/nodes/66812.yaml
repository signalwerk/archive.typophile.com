    html: |-
      <p>I'm inclined to agree, although this sort of look is common enough in scrapbooking fonts. I found one free and two commercial fonts that might be close enough to use as substitutes, but not if you HAVE to match your sample. The freebie is Pizzadude's <a class="freelinking external" href="http://www.dafont.com/loveletters.font?nb_ppp=50&amp;text=Isabella" rel="nofollow">Love Letters</a>. The commercial fonts are <a class="freelinking external" href="http://new.myfonts.com/fonts/bagraphics/sugar-shack/?testdrive=dock%3Dfalse%26size%3D37%26w%3D720%26src%3Dcustom%26text%3DIsabella%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D30" rel="nofollow">Sugar Shack</a> by Bob Alonso,and <a class="freelinking external" href="http://new.myfonts.com/fonts/paratype/amore/?testdrive=dock%3Dfalse%26size%3D37%26w%3D720%26src%3Dcustom%26text%3DIsabella%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D22" rel="nofollow">Amore</a> from ParaType.</p>
      <p>If you study the Love Letters or Sugar Shack fonts, and imagine a few changes, like adding serifs, you can see how perhaps this font of yours might have been developed as a custom font 'inspired' by one of these others.</p>
      <p>- Mike Yanega</p>
