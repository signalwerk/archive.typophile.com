  html: |-
    <p>I am doing a type exploration at the moment looking for stunning individual letterforms. I'm looking for the best 'A' 'R' 'T', could be caps or lowercase and doesn't have to be the same face, just beautiful and interesting. I know it's a bit subjective and vague, just interested to see what people come up with. It's for a poster.</p>
    <p>Cheers for any suggestions<br>
    Rob</p>
