    html: |-
      <p>I wrote my set of accent building scripts before the release of FL5, which does let one build things quicker with how Christian outlined the Generate Glyphs dialog. You won't have the control over exactly how things are placed, but it is easier to use.</p>
      <p>However, if one is still interested in using the set of scripts, two things need to be done before running the Build Accents script. Anchors need to be placed on both the accent marks and the base glyphs for the accented glyphs. Anchors need to be named for where they are on a glyph and where the accent is to attach. For example, to have the script build an eacute, an anchor needs to be placed on the e at the location where one wishes the acute mark to be. This anchor can be called anything, but I usually call it 'top', as it is for accents that attach above the glyph. Then on the acute mark, a corresponding anchor, also called 'top', need to be placed where one wants the acute to attach to the anchor on the e. This would be at the visual center of the acute and at the bottom of the acute. The easiest way to think of this is that the anchors are the points where the e and the acute will snap together. Because placing anchors can be tedious, there is a Place Anchors script for placing anchors on the selected glyphs in the font window. (Removing anchors is also tedious, so there is a Remove Anchors script also).</p>
      <p>Hope that helps anyone who may be interested in using those scripts.</p>
