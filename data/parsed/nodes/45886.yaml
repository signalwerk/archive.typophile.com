    html: "<p>I've found that the \"Generate Glyphs\" command in Fontlab is as useful as anything. I keep a list of characters in a text file and paste them into the Generate Glyphs dialog. The hard part is placing the anchors. I published a simple script to place commonly needed anchors here: <a class=\"freelinking external\" href=\"http://betatype.com/node/12\" rel=\"nofollow\">http://betatype.com/node/12</a></p>"
  - id: 281349
    user_id: 1
    user_name: Christian Robertson
    user_path: null
    date_raw: 30 May 2008 — 8:08pm
    date: 2008-05-30T20:08:00
    votes: null
    html: |-
      <p>To explain a little more, here is my process:</p>
      <p>1. Generate common anchors using script<br>
      2. Do any necessary tweaking to anchors (sometimes you don't want them centered)<br>
      3. Select the Glyph &gt; Generate Glyphs... command from the menu.<br>
      4. Paste glyph list into field.<br>
      5. Voilá</p>
      <p>Here is a good place to start for a list of glyphs to paste into the input field:</p>
      <p><code>Aacute Abreve Acircumflex Adieresis Agrave Aogonek Aring Atilde Cacute Ccaron Ccedilla Dcaron Eth=Dcroat Eacute Ecaron Ecircumflex Edieresis Egrave Eogonek Iacute Icircumflex Idieresis Igrave Lacute Lcaron Nacute Ncaron Ntilde Oacute Ocircumflex Odieresis Ograve Ohungarumlaut Otilde Racute Rcaron Sacute Scaron Scedilla Tcaron T+comma=Tcommaaccent Uacute Ucircumflex Udieresis Ugrave Uhungarumlaut Uring Yacute Ydieresis Zacute Zcaron Zdotaccent aacute abreve acircumflex adieresis agrave aogonek aring atilde cacute ccaron ccedilla dcaron d+macron=dcroat eacute ecaron ecircumflex edieresis egrave eogonek germandbls hungarumlaut iacute icircumflex idieresis igrave lacute lcaron nacute ncaron ntilde oacute ocircumflex odieresis ogonek ograve ohungarumlaut otilde racute rcaron sacute scaron scedilla tcaron t+comma=tcommaaccent uacute ucircumflex udieresis ugrave uhungarumlaut uring yacute ydieresis zacute zcaron zdotaccent</code></p>
      <p>Note: There are several lesser known features available in the Generate Glyphs dialog. For example, t+comma=tcommaaccent joins t and comma into the tcommaaccent glyph. Fontlab knows which glyphs to join for all of the other characters. To create ligatures with Generate Glyphs simply type glyph1name_glyph2name=finalglyph name. For example f_f=ff will create an ff ligature.</p>
      <p>Also note that generating the diacritics is often the last thing you want to do before you master the font. It makes it easier to manage things if you don't have a ton of diacritics hanging around.</p>
