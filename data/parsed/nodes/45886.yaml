    html: <p>Be careful, when using Generate Glyphs in FontLab, "tcaron", "dcaron", "lcaron" and "Lcaron" can't create correct glyphs. All those four glyphs must have a special version of caron looking like a steep acute or an apostrophe. You could create "caron.alt" first and then build "d+caron.alt=dcaron" etc.</p>
