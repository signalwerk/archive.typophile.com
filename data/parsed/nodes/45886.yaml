    html: |-
      <p>It is a bit weird but the T and t with a cedilla are actually Tcommaaccent and tcommaaccent, so the input shoud be like this:</p>
      <p>T+cedilla=Tcommaaccent<br>
      t+cedilla=tcommaaccent</p>
      <p>The T an t with commaaccent can be generated with this:</p>
      <p>T+commaaccent=uni021A<br>
      t+commaaccent=uni021B</p>
