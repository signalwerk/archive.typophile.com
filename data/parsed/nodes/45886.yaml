    html: |-
      <p><em>FL5, which does let one build things quicker with how Christian outlined the Generate Glyphs dialog. You won’t have the control over exactly how things are placed</em></p>
      <p>Yes, you have! You can control where the accents are placed if you add anchors to your base glyphs and accents and name them right:</p>
      <p>The name of the anchor on the accent must be the name of the anchor on the base glyph prefixed with an underscore.</p>
      <p>E.g. you have an "o" with a "top" anchor and an "acute" with a "_top" anchor. Now writing "o+acute=oacute" into the "Generate Glyphs" dialog will place the accent according to your anchors.</p>
      <p>Another way to generate accented glyphs using this anchor naming scheme: Select your base glyph in the Font window, open a Preview window and there go to the tab called "Anchors". The Preview window will show you all glyphs you can compose from your selected base glyph. Generate them by clicking on the "Â" Icon.</p>
      <p>cf. FL manual from page 504 ...</p>
