    <p>I was thinking about the huge amount of work that goes unused after clients refuse to pay, the spec work is not approved, ideas<br>
    change, closing deadlines kills more difficult developments, great personal works and explorations student work, etc... in other words lots of great work that is simply parked. Is there any places where people share these files, sell them, trade them, continue collaboration, etc....There is type foundries that sell completed fonts (but not individual characters or wordmarks, there are stock agencies that sell photos and illustrations, but again what about the forementioned type of work.<br>
    If not, is there enough designers out there that would be interested in contributing their ideas towards building such a community.<br>
    Not sure what form it would take but perhaps something like a an e-bay where clients or fellow designers can bid of works in progress, buy fully completed projects or ?. If there was enough work and a good searching tool this could be a good project.</p>
    <p>Input please...</p>
