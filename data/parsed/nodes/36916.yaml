    date: 2007-09-09T21:57:00
    votes: null
    html: |-
      <p>I can only offer my opinion. Regarding <em>poor, or for that matter cheap clients</em>: Cheap clients get you nowhere. They will always be cheap. No matter how successful your last piece for them has been, you will always be undercutting your costs to do their work. There is no future, as a businessperson, in working for cheap clients. </p>
      <p>I understand that you may want to establish a foothold in your marketplace. And undercutting costs is a time-honoured way of doing that. But pick your clients. And make sure they understand why (and for how long) you are offering them cut-rate prices. Dig that trench too deep and you will be stuck in it.</p>
      <p>Poor clients are different. Poor clients understand your value, and would pay you a proper wage if only their money wasn't going to some other, more desperate, need. Working for poor clients is honourable. But don't short-change them. Give them good, honest work. And choose not to charge them for the hours you put in.</p>
      <p>For either client, I still don't see where resurrecting something from a previous design project solves your current client's communication problems. In such a case you are merely decorating the page.</p>
