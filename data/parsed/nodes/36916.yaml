    date_raw: 9 Sep 2007 — 5:04pm
    date: 2007-09-09T17:04:00
    votes: null
    html: <p>Hi Ken. I agree and disagree. I can not do the work you are talking about for $250 and neither can you. This number is what I could see someone paying for premade logos with the understanding they get what they pay for. Good quality vector work, a clever design, the chance the work needs the be altered (which would cost extra), no research specific to their unique situation, the basics that may or may not be exactly what they would want if money was not a concern. Sure I realize that I could be billing my rate of $85/hr. and starting from scratch and do a great job, but if the funds are not here, that scenario is irrelevant. What I am exploring here is to find out what the consensus is regarding helping poor or for that matter cheap clients. I could offer the experimental/un-used/ or if you like "failed" work that is going nowhere at a great discount and helping someone get something they consider in their budget. I would possibly be building a venue that would eventually cause loss of the clients that would pay 10x or 20 or 40x the price for a custom job. I think there will always be people that will pay the going rate and get excellent custom work which will usuallly be better. This is not something to be fearful of unless you can not produce to custom work.</p>
  - id: 225843
    user_id: 3275
    user_name: pattyfab
