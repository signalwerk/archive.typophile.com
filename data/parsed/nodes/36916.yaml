    date_raw: 9 Sep 2007 — 5:39pm
    date: 2007-09-09T17:39:00
    votes: null
    html: <p>Ken, I think your language is a bit strong. I don't think we're talking here about recycling an old, failed, idea whole hog (at least I'm not) but sometimes I have an idea, it doesn't end up working for one particular job, but I can use the same idea or elements of it in another job. I don't think it's cheating, it's all my work. Some jobs take more time and work than others, and the client shouldn't care as long as it suits their needs and is within their budget.</p>
  - id: 225899
    user_id: 13948
    user_name: KenBessie
    user_path: null
