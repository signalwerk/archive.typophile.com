    html: |-
      <p>Recycling your failed work? The answer is really easy: Don't ever do it.</p>
      <p>If the idea is that insanely brilliant, intense, and so perfect for your new client, it won't even feel slightly like you are recycling. You will instinctively scour your hard drive for the source files. What I mean is; if you are wondering if you ought to, you ought not. If it is legitimate, you'll know.</p>
      <p>***</p>
      <p>One idea for a letter morgue: I am enamored with the openfontlibrary.org, which seems to be getting past some recent growing pains. It is a place where one could possibly set free a handful of promising letter forms that never made it to full typeface status, especially if the type designer is  completely certain they won't be completing it. OFLib is very young and experimental, and not to everyone's taste, but it could be better than killing ideas that aren't bad.</p>
  - id: 226669
    user_id: 3915
    user_name: magnus_rakeng
    user_path: null
    date_raw: 12 Sep 2007 — 11:49pm
    date: 2007-09-12T23:49:00
    votes: null
    html: <p>The thing is I don't see it as failed work. I see it as my own ideas, and indeed they are. In our contract with the client it says clearly that all sketches not used by the client belongs to the designer. I think of it like a bank of ideas I can come back to when I need to. An example is if I am designing a logotype, the letters I draw might trigger a new typeface with the logotype letters as a base later. I have no problems with that at all.</p>
