    user_name: pattyfab
    user_path: null
    date_raw: 13 Sep 2007 — 9:35am
    date: 2007-09-13T09:35:00
    votes: null
    html: <p>It comes down to what is recycling. No, I'd never take a rejected (don't like the word failed) design and just slot it in to another project. But often, especially in the exploratory stage, I have ideas that - for whatever reason - don't fly for a particular job but that can be a starting point for another project. As Magnus says, they are my own ideas. I don't see it as laziness. I designed a prototype for an American cookbook that never happened. Years later I got assigned the Women's Day cookbook; I was able to use a lot of the ideas I never got to use for the first job. Client was happy and I got to use a design I had worked hard on.</p>
