    html: |-
      <p>I am a graphic designer. That is my profession. My clients come to me to solve their communication problems. (I am essentially a problem solver.)</p>
      <p>My (hypothetical) client will say, "I want to sell a thing, or market a thing, to this specific demographic." So I research that specific demographic. I choose colours and typefaces that will appeal to the specific demographic. I design to appeal to that specific demographic. (I'll conduct focus groups if I have to.)</p>
      <p>I cannot, in good conscience, be dusting off some failed previous design, pulled out of my dead file, and expect it to solve my client's problem. Granted, it will solve MY problem: not doing any work and getting paid for it.</p>
      <p>To even SUGGEST recycling failed designs shows that you do not have your client's interests at heart.</p>
