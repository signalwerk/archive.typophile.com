      <p>Good topic! Some suggestions for the unused 'morgue file' work:</p>
      <p> - share it. <a href="http://www.morguefile.com/" title="http://www.morguefile.com/">http://www.morguefile.com/</a>  is a site that 'recycles' unused photography by giving it away.</p>
      <p> - slap it on a t-shirt. There are dozens of t-shirt sites these days. Upload a few illustrations to those.</p>
      <p> - portfolio. show it as part of the process in any given project. Or, just show it as extra personal work.</p>
      <p> - sell it. Upload it to a stock art site like iStockPhoto.com</p>
      <p> - Submit it to one of the print design annuals. (I have a hunch a good chunk of the stuff submitted was never used by actual clients ;o)</p>
      <p>As for the discussion of showing unpicked work, note that clients don't always choose the best work. That's not because you didn't provide better solutions, but rather because they weren't sold on the better solutions...which is more telling of yours or your firm's sales techniques moreso than design skills.</p>
      <p>The design profession is 10% and 90% sales IMHO. ;o)</p>
      <p>-Darrel</p>
