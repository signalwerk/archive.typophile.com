      <p>French is the only language I know of where this is done. Certainly not "most European typography" although there might be further languages where this is done.<br>
      By the way, Word typically recognises the laguage automatically and also inserts the spaces accordingly if it detects french.</p>
      <p>From the MS sharacter design standards:</p>
      <p><cite><br>
      Guillemets</cite></p>
      <p>These quotation marks commonly called 'French quotes' or 'duck's feet' are said to have been named after a French typecutter Guillaume (William) Le Bé. Guillemets is the French word for quotation marks. The similarly named Guillemot is a narrow billed, sea auk with duck like feet found in cold northern regions of the world.</p>
      <p>These pointing quotation marks are used in many languages and point differently dependent on the language. The German language uses these quotation marks with the right pointing guillemets as the open quotation marks and the left pointing guillemts as the close quotation marks. In French typography the left pointing quillemets are used as the open quotation marks and the right pointing quillemets are the closing quotation marks.</p>
      <p>Traditionally in French typography the left pointing guillemets are followed by a non-breaking word space or thin space of 1/8 the em and the right proceeded by a non-breaking word space or thin space of 1/8 the em.</p>
      <p><a href="http://www.microsoft.com/typography/developers/fdsspec/punc.aspx#guill" title="http://www.microsoft.com/typography/developers/fdsspec/punc.aspx#guill">http://www.microsoft.com/typography/developers/fdsspec/punc.aspx#guill</a></p>
