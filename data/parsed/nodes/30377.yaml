      <p>Very nice. Side notes are usually more attractive than foot notes, but won't go with your layout. </p>
      <p>I personally don't have a problem with your footnotes, though. I think the small size you have given them is appropriate. You might consider using a slightly tapered or other slightly more decorative rule. That may give a pleasant 19th century feel, I think, and may work if sufficiently unobtrusive. </p>
      <p>The other option is to have them as end-notes. The question is, I guess, how often you think the reader will need to refer to them. If not so often, or later, then end-notes will do. </p>
      <p>Having both a comma and an em dash (second column) looks like a mistake.</p>
