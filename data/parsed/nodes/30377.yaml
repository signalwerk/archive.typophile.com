      <p>The ‘good reason’ is because ‘Perfect typography depends on perfect harmony between all of its elements [and] harmony is determined by relationships or proportions [that] are hidden everywhere’ (Jan Tschichold, <cite> The Form of the Book </cite>), most notably between the basic units of typography. Punctuation marks are no different in this respect from letters, and anyone who cares about kerning, should, by the same token, care about how the thin-space preceding a colon. </p>
      <p>If anything, the ‘historical anomaly’ is not to thin space punctuation marks, but <strong>not </strong> to do so.</p>
