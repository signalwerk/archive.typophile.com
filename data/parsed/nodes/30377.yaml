      <p>I don't think anyone is doing better work than Slimbach on text types, but I don't like the very tight punctuation. It is more economical, which is what he was aiming for in Minion, I guess, but I think it compromises readability a bit. </p>
      <p>Reflecting further on 'Poliphilus' and Karsten's examples, I think that punctuation on the loose and large side is a good idea for readability, but that the hair space style is unnecessary, and is distracting to eyes used to the tight style. Now my thinking is just to have punctuation a bit looser, compared to the current style. </p>
      <p>Of course, it should reflect the style of the font also.</p>
