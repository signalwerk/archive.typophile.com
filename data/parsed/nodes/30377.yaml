      <p>If exclamation marks, question marks, colons, semicolons, guillemets glue at the word, they are hard to recognize. ('Welll' or 'Well!') With a little space between word and mark, one can <cite>see</cite> the structure of a sentence more easily.</p>
      <p>En- and em-dashes: in a German text it is quite clear if an en-dash is used as a 'gedankenstrich' (giving thought a break) because there is a space to its left/right, or if it indicates distances because there is no space ('Hamburg--Berlin'). A useful distinction.<br>
      But it matters whether an en- or em-dash is used, how long it actually is (depends on the typeface), and <cite>how much</cite> space is added. Of course it is nonsense to add much space around a long em-dash, and produce an even larger white space in the text.</p>
      <p>Spacing quotation marks really produce holes, as I said above.</p>
      <p>Spacing punctuation marks depends much on the overall spacing of a typeface. Some type designers give punctuation marks very little space, other give them a bit more by default. Like Verdana.&nbsp;&nbsp;:)<br>
      As Nick indicated when he mentioned the too wide word spaces of earlier typography -- it would be nonsense to merely imitate earlier typographic habits. But I see no problem in picking out things that makes sense, typographically.</p>
