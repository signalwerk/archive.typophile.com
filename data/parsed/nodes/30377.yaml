      <p>Thank you Karsten for you learned remarks on well-spaced punctuation and for its historical contextualization. The examples you supply (in the PDF) are also extremely illuminating and confirm that technology, or its limitations, dictates typographical practice that in turn become ‘rules’. However, we seem to be in a fortunate position that allows us to re-apply some finer points, careful spacing of punctuation being one of them – providing we are not enthralled by the dictates of mega-corporations (e.g. Chicago). We are simply reclaiming and rediscovering the world of hairline spaces, thin spaces, word spaces, em spaces etc. (the fact that some traditions have a longer memory is completly immaterial). </p>
      <p>Two important issues seem to arise: the first is that regardless of the tradition we subscribe to, punctuation marks require extra-special care in fine typography and secondly, that by broadening our typographical catchment area we can be expressive. Consider how Bringhurst set in English Tschichold’s ‘The Form of the Book’ – with guillemets!</p>
      <p>I can only reiterate your eloquent and finely set final words: </p>
      <p><cite><br>
      It would appear that with the advent of digital typesetting, typographic knowledge got<br>
      lost. At first, technology had imposed its limitations. Succeeding generations then<br>
      were raised with typographic standards that were not set by typographers any more but by office applications and their 'users'. Now educational efforts are necessary to make aware of the need for proper spacing - just like oldstyle figures had to be re-introduced to typographic consciousness.</cite></p>
