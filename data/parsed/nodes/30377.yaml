      <p>The first example is, nevertheless, American and maybe emphasizes that the question isn’t about national boundaries at all but about good typography. The practice I am looking at  just happens to abound in France and older European typography. I think there is little doubt that in modern times default settings in software dictate to a large degree our typographical practices and tastes.</p>
      <p>It seems to me that there is something inherently right about considering the space between letters and certain punctuation marks. In terms of nuance, this is akin to kerning and should not be done heavy-handedly; when carefully executed I think that the text has a better flow on the page. All I am saying is that we can make our own judgements and allow ourselves, if we think it is right, to be influenced by older or foreign customs.</p>
