      <p><em>Love the picture, type, and use of footnotes, Bruce: what prompted you to take on this project?<br>
      </em></p>
      <p>I lived in Grenoble in 1968-69 for a year and it was a life-changing experience (I was 18-19). A particularly interesting time to be there as it was right after «les événements de mai» (for those not familiar with this, it was a unified uprising of workers and students against the de Gaulle government in May 1968). I also took to the language and luckily became pretty fluent. Ever since I have generally kept a French book by my bedside as well as something in English (right now Voltaire's <em>Candide</em> is bunking with Barbara Kingsolver's <em> Poisonwood Bible</em> -- which makes for rather marked contrasts in venue! -- but it could just as easily be poetry or a <em>roman policier</em>.</p>
      <p>At one point in my thirties I was visiting my parents and noticed a small Nelson edition of Daudet (in French). I had always heard of this book but had never encountered it in school, so I picked it up and as I read through it, I was deeply moved by it. For better than a century the book was always on booklists in the <em>lycée</em> and therefore a real cultural anchor, but I think now it may be less widely read. I get the impression that Daudet's star is fading in modern French culture, as is Anatole France's, perhaps because they don't do enough with plot and inner psychological stuff in characters -- rather they remain as more naturalistic observers, interested but in a way neutral. </p>
      <p>Given my affection for Provence, and for the stories in Daudet's book, I began to think of this illustrated edition. In the past, any illustrated editions in France were always done by well-known childrens' illustrators. My thought was that a lot of anglo readers had been introduced to Provence by the often amusing (but to my heart definiely l-i-t-e) writing of Peter Mayle, and wasn't it time they encountered a <em>real</em> Provençal writer? I felt that the tone and content of Daudet would be better-suited to a modern anglo audience than Giono or Pagnol or Bosco, all very worthy writers, but the great thing about Daudet is that he is describing Provence for a foreign audience (Parisians) and the book gives a vivid sense of what life was like in those days. The best-selling edition of <em>Letters</em> here in the States was issued by Little Brown and was quite a cold translation. Eventually I found the one I'm using, by Frank Hunter Potter, and it manages to preserve the same twinkle-in-the-eye light touches of Daudet's original in French.</p>
      <p>I have all the pictures taken, from various trips I made over the past ten years, and the book is all designed -- it's really just a matter of figuring out how to get it into print. I shopped it around to various main-line publishers and they all made complimentary noises but said no. I think they are all terrified of visual books in general, and of this book because it doesn't fit into a neatly-defined pigeonhole that someone like Barnes and Noble can use. They say it's too expensive to go in literature, and has too much text to go in travel or photography! My intention all along was that it would go to independent bookstores (Hey, people who actually think! and who make personalized recommendations to their customers. Sorry, that is probably unfair) rather than chains, but it still has to be published by someone. A few years ago a very distinguished literary press was interested and I actually signed a prelim contract with them, but I was afraid I'd lose control of the production and design, and decided to back out, preferring that it not be published at all rather than issued in a compromised state. So for the moment it sits. It's planned as a 7.25 x 10.75 (18 x 27 cm) upright, 160 pages. Hope I can do something with it someday, even if ultimately I just "give it to the world" as a PDF.     </p>
      <p><em>I’ve been considering something similar, using a friend’s poem and creating a small chapbook….</em></p>
      <p>Well worth doing, as long as you can figure out distribution. I recently did a lovely book with a friend who is a poet and restoration bookbinder. We printed all the sheets on acid-free paper on my laserwriter (did it all in 4s) and then she gathered them and bound them in a small edition. Worked great. The trouble with my book is the pictures, which requires a very high price of admission. Given all the shifts in the market, perhaps I can convince one of my good book-printer friends to go in with me and I'll end up marketing it myself, but no time for that right now.</p>
      <p>Speaking of things Canuck, another fantastic book I discovered as an adult is <em>Maria Chapdelaine.</em> I would adore to make a photographic edition of that, but perhaps it's already been done. (I wonder if it's even been translated into English?)</p>
      <p>Okay, back to work.</p>
    html_clean: |-
