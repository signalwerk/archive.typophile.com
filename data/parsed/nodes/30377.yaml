      <p>Ornan, while to my mind quoting Tschichold is, again, simply stating one opinion (albeit one I tend to give large credence), and thus I don't think any reference or quotation makes something "true," I do agree with the sentiment of your last post. But it seems to me this thread has not been specifically about harmony or balance, let alone "perfect" anything; what I've read here is a proposed protocol for inserting a set amount of space inside various punctuation characters. This kind of prescription appears to be rooted in digital typesetting as it has become so simple to automate typographic behaviour by simply scripting-in various replacements and insertions. While some here have drawn attention to the differences in metrics &amp; kerning from one font to another, largely the issue has not been about kerning (which, I think, is the issue at hand), but about inserting spacial characters which are themselves relative and thus imposible to use as any sort of "standard."</p>
      <p>To my mind what Tschichold is talking about is attention to detail, something I think we're all clearly interested in, and by that I mean an attention to each project as distinct, each typeface as requiring its own treatment, each typographic instance as worthy of attention. When setting metal each double-quote may set differently than the last, thus spacing it requires the typesetter's attention, just as setting a closing double-quote after a comma often requires special attention digitally. But I suppose what I was responding to above was what seemed to be a one-size-fits-all approach that would introduce far more spacing problems than it would solve.</p>
