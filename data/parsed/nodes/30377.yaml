      <p>Right Jason.<br>
      There's no point in a blanket approach to one's spacing, because the built-in spacing of fonts has to be considered, and that varies hugely.<br>
      Robert Slimbach has probably paid more attention to spacing than most type designers, going so far as to insert negative kerning between letters and the space character, but even his approach is not consistent (nor should it be) amongst his types. For instance, he kerns "space-Y" in Myriad, but not Minion, while he kerns "period-doublequoteright" in both.<br>
      Slimbach is the fine typographer's friend, but his philosophy is the opposite of airyness.</p>
      <p>Poliphilus, your airy style has its merits, and there is nothing to stop you remixing Slimbach's metrics, or anyone else's, to fabulous effect. But I wouldn't hold it out as a general best practice.</p>
