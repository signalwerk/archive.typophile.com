      <p>I can't quite understand what the <em>purpose</em> of this thread's suggestion might be; that is, if the suggestion is to add space inside quotation marks, to what end? What is the purpose of doing so? How would it benefit the reader? How would it improve the typography?</p>
      <p>Forgive me, but this looks, on the surface, like an attempt to show one's typographic astuteness, but is in fact just a snipe hunt.</p>
      <p>As a few have here commented, "airing out" quotes would simply introduce gaps and dots to the text block, massively increasing the likelihood of visible "rivers."</p>
      <p>Let alone the issue of indented paragraphs beginning with quotes, or, god forbid, large drop-cap/initials with quotes (how far out into the margin do you want to hang that quote?).</p>
      <p>The ongoing dilemma about spacing em- &amp; en-dashes seems to me grounded in this problem: spacing them "looks" better close up, but creates gaps from a distance. This dilemma continues to keep many of us up at night.</p>
      <p>The argument for convention has it's benefits, but perhaps, at different periods, there is/was a convention for both ("aired"/not "aired"). The current convention seems to lean towards the not "aired" variety. Conventions are useful, of course, but they should, indeed, be challenged if there is <em>good reason</em> to challenge them.</p>
      <p>So, my question: Is there really any <em>good</em> reason to introduce space inside quotation marks (other than to impress others with an historical anomoly)?</p>
