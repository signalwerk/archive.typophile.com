      <p>We have these debates on this forum all the time. There are discrepancies between typesetting conventions in the US, the UK, and Europe. There are also people who are more inclined to stick with the conventions than others. This came up in a discussion of em vs. en dashes sometime back.</p>
      <p>Of course you can "make your own judgments" it's a free country (or world) but you have to be conscious of the conventions as well, lest you risk looking like you just don't know how to typeset. If you like that extra space &amp; want to add it, then be my guest, go ahead and add it, but don't look here for justification. It certainly ain't done on this side of the pond.</p>
      <p>The "American" sample you cite was probably a reprint of a UK edition. It's highly unusual for Americans to use the single quote around dialogue.</p>
