      <p>Karsten: I was careful to say "convention" instead of "rule". There is a difference—at least IMO. And as is clear on this thread as well as several others, the conventions are open to question and evolve over time. There are authors who don't even use quotation marks.</p>
      <p>My background is in book publishing where Chicago is the lingua franca. Even a slight deviation from the standards will be red-penciled; you can't just decide you want to use a spaced en where an em is called for in the manuscript. </p>
      <p>I do find it frustrating when people decide to reinvent punctuation as it suits them. These conventions have a purpose, they let us understand where there is a break in a thought; where a snippet of dialogue ends; where one thought connects with another. But I realize that those who want to bend or break the "rules" don't want to be convinced otherwise—to them the rules are a tool of the establishment.  </p>
      <p>To them I say: Vive la revolution! But like I said, don't expect me to pat you on the back.</p>
