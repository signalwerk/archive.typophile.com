      <p>Thanks for the interesting topic and examples.</p>
      <p>Looking at the examples, spacing out the question mark and exclamation so much doesn't make sense to me, and doesn't look so good, as it functions just like a period and comma. These are visually heavier than the comma and period, and so maybe could have a little more air around them, I think, and that is a good idea. But the spacing around them in the examples I think is excessive. </p>
      <p>The semi-colon and colon could be given a bit more space in theory, as they function somewhat differently: they break the middle of a sentence more than a comma does. Also they again are a bit heavier than the period and comma. Still to my eyes, which are used to the tight style, the hair space looks a bit disruptive.</p>
      <p>The quotes to my eyes do look better spaced a bit more widely than the other punctuation.  And I think there is some logic to it: they come in pairs, and by spacing more, the pair is more evident. </p>
      <p>Also I think Patty's observation that some typefaces have the quotes too  tight lends weight to this. For example Minion's quotes are quite tight.    </p>
      <p>So my conclusion is personally to look again at the punctuation in the typeface I am working on. I will check that the heaviness of the question and exclamation have enough 'air' to balance. And I will experiment with adding just bit more space to the the colon and semi colon, and quotes--not necessarily to the same amounts. Then I'll see how it looks in settings.</p>
      <p>The weight of a dot and its spacing can indeed affect the look of a whole page, so I think this is worth working on as a type designer.  </p>
      <p>As a typographer, I would look at whether adding a hair space, eg. to Minion's quotes, would help. </p>
      <p>edit: now that I think of it, there is a problem with single right quotes, as these are used also as apostrophes. So maybe the better solution will lie in kerning or substitution.</p>
