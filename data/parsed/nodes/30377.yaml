      <p>Karsten brings up an interesting point related to a personal project I've been working on over the past ten years. And ever since Tiffany mentioned that </p>
      <p><em>As much of an antiquarian I like to think myself, I know it isn’t good to follow what was done during the days of the incunabula and after unless that is the specific look I’m going for because it isn’t how we do things now.</em></p>
      <p>I have been chewing on this for the past couple of years. I'd love to get some feedback from you guys about it. (And Tiffany, I realize you are talking about incunabula but you also say "and after" so that certainly would include the 19th century.)</p>
      <p>My project is an English translation of Alphonse Daudet's <em>Letters from my Mill,</em> illustrated with my own black-and-white photographs of the places in Provence that Daudet describes. The book is a classic of French literature set in Provence in the late 19th century, at that time considered by Parisians to be very much a "foreign place." Daudet wrote a series of letters published in the Paris papers, and these were later gathered to make the book. Provence, with its own language and customs, was being quickly eclipsed by the northern industrial energies of France (for example, it was against the law to speak Provençal in public). In a sense, Daudet did for the Provençal culture what photographer Edward Curtis did for the North American Indians, trying to preserve the spirit of something that was changing rapidly. It is a beautiful set of small observations about human nature, and I believe it deserves to be better-known in the Anglophone world.</p>
      <p>Anyhoo, the very best translation of this work that I could find is from England, 1893. Although it does not have guillemets, and handles dialogue differently from Daudet's original French, it <em>does</em> employ the spacing that Karsten is talking about. Because the book is so firmly rooted in the 19th century, some part of me wants to preserve those subtle cadences in the typography -- although I hasten to add that I have made my own choice of printing type (Adobe Garamond) different from the spidery and contrasty type used in the book and much smoother in tone.</p>
      <p>The example below follows modern typographic conventions, although I did keep the em-dashes closed up (rather than my more typical practice of en-dashes with mild amounts of space both sides). The book is planned for black-and-gray duotones, with gray printer used to set stick-up caps and footnotes, black printer for regular text. The footnotes are my own addition, wanting to illuminate for the reader some of the references in Daudet's text that will be unfamiliar to most anglophones.</p>
      <p>But lately I've been thinking that in addition to the em-dashes, I'd like to retain the spaces before question marks, semi-colons, and so forth. If I choose to keep the typographic details intact -- to provide something of the experience that a reader would have picking up the actual 1893 book -- will that be confusing, or will it help to take the reader back in time?</p>
      <p>Thanks for any comments.</p>
      <p>Also, I've been getting very mixed reviews of the footnotes as I pass the page proofs around to a wide variety of people. Some adore them and say that they add lots of value to the reading experience; others say "It reminds me of stuff I had to read in college with [note of horror creeps into voice] <em>footnotes.</em> Yuck!" Thoughts?</p>
      <p>Bruce </p><div class="imageWrap"><img src="http://typophile.com/files/8-9spread_5915.jpg"></div><p></p>
