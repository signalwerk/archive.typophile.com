  html: |-
    <p>"CJKV Information Processing" Second Edition was published late last month, and is just getting into distribution channels. See: <a class="freelinking external" href="http://oreilly.com/catalog/9780596514471/" rel="nofollow">http://oreilly.com/catalog/9780596514471/</a></p>
    <p>The back cover includes a nice quote from Dr. John Warnock, and its Foreword was written by my good friend Robert Bringhurst.</p>
    <p>I received the first two copies on Christmas Eve, which were overnighted to me from the printer on the 23rd.</p>
