    html: <p>I’d tighten up the AT combination at the beginning and the AS at the end. Don’t look as the space between letters, look at the volume they are taking up. The A’s tend to slope away from their neighboring letters creating an apperance of more space, so the letters next to them need to be adjusted to compensate.</p>
