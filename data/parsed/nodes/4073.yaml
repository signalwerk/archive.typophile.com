  html: "<p>I found this online today and thought I'd share: <br> <br><a href=\"http://www.siberart.com/untitled%20pages/untitled_home.html\" target=\"_blank\">http://www.siberart.com/untitled%20pages/untitled_home.html</a> <br> <br><i>The Untitled Project is a series of photographs of urban settings accompanied by a graphical text layout. The photographs have been digitally stripped of all traces of textual information. The text pieces show the removed text in the approximate location and font as it was found in the photograph.</i></p>"
