    html: |-
      <p>I'd work on the modulation of the stroke widths a little. Right now it's a little "gloopy" and looks like it was autotraced from a scan. The loop on the y seems a little anemic, too. I do like the articulation in the e and the r, although you might want to consider making them a continuous, and cursive, script. That notch in the upper right of the e is pretty hot, although not very scripty.</p>
      <p>Overall, not bad!</p>
