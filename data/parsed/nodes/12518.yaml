    html: <p>Chad get a Calligraphy pen and draw your letter forms again. By doing so you will see where the inconsistancies on where the thins and thicks of the letter forms, then you can adjust. I'm not suggesting not using what you have, but using the Calligraphy pen as a guide to letter form corrections.</p>
