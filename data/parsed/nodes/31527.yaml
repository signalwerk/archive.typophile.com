    <p>Here is my plan for the licensing scheme for !Exclamachine Fonts, in shorthand. This is based on comments here on 'phile, and customer feedback. I am developing the prose formats now. Thoughts, comments? Anything I am forgetting?</p>
    <p>Under Commercial Use, "standard" includes any use aside from software embedding, !ETF-only specimens and consumer letter products.</p>
    <p>The following licenses do not detail any agreement for adding custom glyphs or software embedding.</p>
    <p><strong>Hobby License</strong><br>
    Users	.1<br>
    Workstations	.1<br>
    Archives	.unlimited<br>
    Embedding	.none<br>
    Bureau Loaning	.none<br>
    Output Devices	.unlimited</p>
    <p>Duration	.perpetual<br>
    Commercial Use	.non-mass production<br>
    exclusivity	.none<br>
    licensee modification	.allowed<br>
    licensor modification	.none</p>
    <p>Warranty	.none<br>
    Liability	.none</p>
    <p>----------------<br>
    <strong>Designer License</strong> <em>The "Regular" License.</em><br>
    Users	.5<br>
    Workstations	.5<br>
    Archives	.unlimited<br>
    Embedding	.unlimited<br>
    Bureau Loaning	.-1 User/Wk Allotment<br>
    Output Devices	.unlimited</p>
    <p>Duration	.perpetual<br>
    Commercial Use	.standard<br>
    exclusivity	.none<br>
    licensee modification	.reciprocal (2 years)<br>
    licensor modification	.reciprocal (2 years)</p>
    <p>Warranty	.none<br>
    Liability	.none</p>
    <p>----------------<br>
    <strong>Business License</strong><br>
    Users	.n/a<br>
    Workstations	.12<br>
    Archives	.unlimited<br>
    Embedding	.unlimited<br>
    Bureau Loaning	.1<br>
    Output Devices	.unlimited</p>
    <p>Duration	.perpetual<br>
    Commercial Use	.standard<br>
    exclusivity	.none<br>
    licensee modification	.none<br>
    licensor modification	.none</p>
    <p>Warranty	.none<br>
    Liability	.none</p>
    <p>------------------<br>
    <strong>Enterprise License</strong><br>
    Users	n/a<br>
    Workstations	.100<br>
    Archives	.unlimited<br>
    Embedding	.unlimited<br>
    Bureau Loaning	.3<br>
    Output Devices	.unlimited</p>
    <p>Duration	.perpetual<br>
    Commercial Use	.standard<br>
    exclusivity	.none<br>
    licensee modification	.none<br>
    licensor modification	.optional additional license</p>
    <p>Warranty	.2 year limited<br>
    Liability	.none</p>
    <p>------------------<br>
    <strong>Cobranding License</strong> <em>This includes marketing and art resources, co-sales and an ongoing relationship.</em><br>
    Users	.n/a<br>
    Workstations	.n/a<br>
    Archives	.unlimited<br>
    Embedding	.unlimited<br>
    Bureau Loaning	.unlimited<br>
    Output Devices	.unlimited</p>
    <p>Duration	.2 years<br>
    Commercial Use	.special (!ETF-only specimens and letter products)<br>
    exclusivity	.one product type<br>
    licensee modification	.none<br>
    licensor modification	.included</p>
    <p>Warranty	.2 years limited<br>
    Liability	.none</p>
