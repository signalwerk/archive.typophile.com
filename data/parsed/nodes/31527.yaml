      <p>"Under Commercial Use, “standard” includes any use aside from software<br>
      embedding, !ETF-only specimens and consumer letter products." Specific  real-life examples would be the Exclamachine-labeled !Sketchy Times stickers and another clothing project, based on !The Black Bloc, in negotiations now.</p>
      <p>"Non-mass production" includes hand-made works of craft or art, intended for resale. This is most similar to the "Angel License" popular in the growing scrapbooking market. Here's one example, the first typical one I googled: <a href="http://www.digitalscrapbookpages.com/digitals/index.php?main_page=product_info&amp;cPath=66&amp;products_id=3626" title="http://www.digitalscrapbookpages.com/digitals/index.php?main_page=product_info&amp;cPath=66&amp;products_id=3626">http://www.digitalscrapbookpages.com/digitals/index.php?main_page=produc...</a></p>
