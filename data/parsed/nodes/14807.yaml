      <p>when i was working at a newspaper and wanted to redesign, I really wanted <a href="http://fontbureau.com/fonts/MillerDaily" rel="nofollow">Miller Daily</a>. unfortunately, my corporation wouldn't spring for the idea, so i left... ;^P<br>
      Oh, and one thing... newspaper readers want their content to be serious, so the typeface should be, to quote hrant, "honest." IMO, Paperback, although very gorgeous, is too decorative for news usage. i mean i love the design, so much so that i'm looking for an excuse to license it, but i think it would just be inappropriate in a news setting.</p>
