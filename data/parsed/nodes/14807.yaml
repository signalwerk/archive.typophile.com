      <p>how about Dolly? Or Storm's Lido?</p>
      <p>I found a delightful (and delightfully outdated) book about a week ago called <em>Functional Newspaper Design</em> published in 1956 by Edmund C. Arnold (then editor of Linotype News) which, not surprisingly, pushes Corona rather strongly.</p>
      <p>In no particular order, why not look at:<br>
       Criterion (URW++)<br>
       Worldwide (Shinntype)<br>
       Andulka (Storm)<br>
       Kandal (Mark Simonson)</p>
