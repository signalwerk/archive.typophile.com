      <p>That's not a question, that's a book!  :-)<br>
      A lot of good suggestions so far. But we still need to know at least the basics about the paper and its readership. Yes, a newspaper font needs to me more transparent than most, but there are still so many choices that narrowing it down based on things like the "angle" of the newspaper, the age of its readership, etc. actually helps - noting once again that Design is largely about constraints.</p>
