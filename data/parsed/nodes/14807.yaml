    html: |-
      <p>1) The logo needs to be tweaked to improve contrast.<br>
      2) The cover design needs to be taken out of the realm of the template. Each cover must be designed individually, with sufficient leadtime to allow for a good job.<br>
      3) I want to expand the selection of page templates and provide for more editorial color -- boxes, lines, and headlines in full color.<br>
      4) The headline and body fonts need to be replaced with cooler options.<br>
      5) Strict guidelines on typography need to be instituted to elminate the tracking-together of glyphs and the widows &amp; orphans which are in  almost every story.</p>
      <p>One stumbling block is that page layout is done by the editors -- us production people do photoshopping and ads only.</p>
