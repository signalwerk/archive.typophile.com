  html: |-
    <p>In the course of the "Fixing Futura" client project, a slab version came in handy. There certainly has been a recent uptick in the slab choices: grotesque slabs, humanist slabs, geometric slabs etc. Firmly in the strict geometric camp, I like how this has some of the old school flavor of Lubalin Graph and Rockwell, without the eccentricities.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/futuresque_slab_3905.gif"></div><p></p>
    <p>You may also notice I tried some of the suggestions from the previous thread including a vertical sheer on the c and s.</p>
