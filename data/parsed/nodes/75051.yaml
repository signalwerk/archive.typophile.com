    html: |-
      <p>Thanks for the additional information.  If all (or most) of your corporate documents are in Helvetica, and you intend to keep them that way, then putting your logo in a similar but different contemporary typeface could be a mistake unless done very carefully. </p>
      <p>It's like a building in which all the windows are identical except for one which is just slightly different. It could create an inconsistent look, and may even look like a mistake. </p>
      <p>If you're stuck with Helvetica for most docs, then pick a typeface for your logo that coordinates well and is clearly different from helvetica (a serif typeface, for example, or maybe a san serif that's very condensed or a different weight or in some obvious way looks very different from the Helvetica type in your documents, so that it doesn't look like it was supposed to match but didn't due to a mistake).</p>
      <p>A better alternative, though, is to develop new design standards for ALL your firm's documents, so that your logo, stationary, and all publications work harmoniously together.</p>
