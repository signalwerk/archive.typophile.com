      <p>Stephen Shankland, Staff Writer, CNET News.com says: "Fonts--letters and other characters that range in appearance from utilitarian to highly ornamental--are usually proprietary designs from companies called foundries. That proprietary nature doesn't jibe with open-source principles--a mismatch made glaring by the widespread use of Microsoft fonts on Linux."</p>
      <p>Yup, stick a fork in it alright :-/</p>
      <p>ChrisL</p>
