      <p>I have to agree that numbers separated by a space into groups of three or four are easier to read and memorise, the line about dashes connecting numbers while dots separate seems self-defeating, especially given the example posted above. But as Mbusher says cultural conditioning may have something to do with this. But which European countries use dots to separate numbers? As far as I can remember France, Spain, Germany use groups of numbers either in pairs or threes or fours.<br>
      Tim</p>
