    html: <p>Quite. I handle MSS from authors all over the place (UK &amp; Europe, US &amp; Canada, Asia, Far East, you name it) and I don't think I've seen many come in the authors' phone numbers split with dots. They would, indeed, look like an IP address and would be very odd. Most just use spaces, quite a few use hyphens, and a few, nothing at all. I agree that 'no separators' makes for a hard-to-read number; spaces and hyphens both look fine to me.</p>
