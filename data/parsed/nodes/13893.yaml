      <p>It depends on how the en dash looks in the font. Generally, the en dash is used to indicate a range  of numbers, rather than as a separator. In the US the normal format for noting a phone number is </p>
      <p>(412)555-5555</p>
      <p>but I've seen it frequently in recent years printed with dots or spaces replacing both the parentheses and hyphen. You could use en dashes if you want to, I guess, for display so long as it looks good. You just might raise editorial hackles should you try it in text.</p>
