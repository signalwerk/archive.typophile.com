      <p>I use spaces instead of dashes unless specified otherwise by the client. </p>
      <p>It's also customary here in the US to put the area code (first 3 digits) in parens:</p>
      <p>(012) 345 6789</p>
      <p>or</p>
      <p>(012) 345-6789</p>
      <p>but I usually do away with the parens too - again unless the client insists.</p>
