    html: |-
      <p>As far as I'm concerned, contextuality is everything.<br>
      Lay readers don't react to the qualities of type on a mico-intrinsic level -- they don't notice that stuff -- they read in context of the page, of the document.<br>
      Editors and design professionals and others with a standards axe to grind will assert their personal or professional preferences, but it's quite alright for designers to make up their own rules for a document. If the design is forced, well then, it's too designy -- but if it works, it's brilliant.<br>
      After all, how did Ladislav Sutnar ever come up with the idea of using parentheses to format area codes?</p>
