      <p>Reviving this old thread! I've searched as much as I can to find an answer, and this thread is as close as I've come.</p>
      <p>What do y'all think about using en dashes instead of hyphens in phone numbers?</p>
      <p>I've used them in the publication I'm working on, but have been told that it is incorrect, and I ought to use hyphens. I'm aware that en-dashed telephone numbers are not the norm in Canada (prolly not anywhere), but are they wrong? </p>
      <p>The font I'm using has slightly slanted hyphens which I think look utterly silly in the phone numbers. I'd opt for periods or spaces, but that's likely too "designy" for their taste (their word, not mine).</p>
      <p>So just wondering if there's some rule that I haven't found which states that the use of en dashes in phone numbers will cause the sky to fall.</p>
      <p>Thanks!<br>
      K.</p>
