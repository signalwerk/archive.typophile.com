      <p>i'm slightly perturbed by that; it strikes me as rather odd that 'image consultants' are, well, being consulted to identify a more 'contemporary' alternative to the dash between numbers. if it's purely down to readability issues then fair enough - ie deciding what combination is easiest to read from when dialling a phone - but i find numbers separated with dots are not <em>that</em> easy to read quickly.</p>
      <p>01234567890</p>
      <p>012.3456.7890</p>
      <p>012-3456-7890</p>
      <p>020 3456 7890</p>
      <p>i find the bottom two versions most readable, but the last preferable - guess that's what i'm used to in the uk. the others seem unnecessarily...superfluous?</p>
