      <p>I had a look at the pdf oof Fakir on offer at Underware's site. Fakir works very well at smaller sizes. It has a distinct flavour and is quite legible when used correctly, it would appear. </p>
      <p>I'm a big fan of these guys, and they've already proven they know exactly what they're doing: Dolly, Sauna, Auto. Dolly in particular is an exemplary text font.</p>
