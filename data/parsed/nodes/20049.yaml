    html: |-
      <p>Actually I don't like Bello. </p>
      <p>I went off brush work typefaces in about 1960; a straighforward poster kind of thing is ok for me, but that's about it. Especially done as a script. When I see all the 50's retro stuff, the charm of it is lost on me. It may just be my age, but I don't think it will look good in another ten years either. </p>
      <p>For me Dolly and Sauna are wonderful.</p>
