    html: <p>The font is called Roberta (Solotype Catalog p.45). Harold Lohner of <a href="http://members.aol.com/fontner/frontpage.html" target="_blank">Harold's Fonts</a> has a version of this  Art Nouveau style (much older than the 70's) under his Revivals category.</p>
