    date_raw: 25 Sep 2010 — 12:08am
    votes: null
    html: <p>I'm going to have to disagree with those who say use only an M. I think the two separate buildings subtly and cleverly point to M and H. The type doesn't necessarily need to reflect all of the exact qualities of the mark, but there shouldn't be a disconnect between the two. If you use an M (in Malvern) with sloping vertical strokes as opposing to the parallel ones there are now, that would more closely reflect the qualities of the roofs and tie logo together better. Also, give the mark a shot with some roof overhang.</p>
    html_clean: <p>I'm going to have to disagree with those who say use only an M. I think the two separate buildings subtly and cleverly point to M and H. The type doesn't necessarily need to reflect all of the exact qualities of the mark, but there shouldn't be a disconnect between the two. If you use an M (in Malvern) with sloping vertical strokes as opposing to the parallel ones there are now, that would more closely reflect the qualities of the roofs and tie logo together better. Also, give the mark a shot with some roof overhang.</p>
