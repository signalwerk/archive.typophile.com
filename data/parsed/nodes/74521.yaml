      <p>Thanks People</p>
      <p>Kirs10; As I said the type is still under review and Gill is certainly a favourite but more for the fact that it is a very 'English' typeface. I was trying to get to where I was happy with the mark first. It's no good finding a face to reflect a mark that keeps changing!</p>
      <p>Luma; I had this shape in one of my early layout pad pages together with its 'h' equivalent. And it's a good point about the language being more important than the name. But I was worried it was too much like the Shelter logo (a housing charity)</p>
      <p>Steven; Thanks for the comments about the 'h'. But (again) the wording has to be straightforward and if that means a 'disconnect' then so be it. </p>
      <p>I'll keep on it...</p>
