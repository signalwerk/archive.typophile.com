      <p>There's no relationship between the icon and the type. Try pairing your mark with a font that reflects the angle between the two buildings. Something like Gill Sans or Nobel (there are plenty of others, find something you believe is well suited) -  where the "v"  part of the cap "M" (I'm sure that has a name but at the moment I'm drawing a blank) doesn't extend down to the baseline. The font would then mimic the angle created by the two red buildings You may also want to consider something extended.</p>
      <p>Good luck with the project.</p>
