    <p>Hello. </p>
    <p>A redesign of a logo for Malvern House college. An 'English as a foreign language' teaching college with three big schools in London and numerous affiliated colleges around the world. The redesign was really just a tightening up and standardising of their current logo, which is the words (Malvern House) and a globe symbol - dull I know!</p>
    <p>The attached example was one of several 'you could do something like this' proposals. The idea was to take the initials (M h) and turn them into 'houses'. I quite like it but it's not quite right, it's not really 'happening'. Maybe it's too literal? I dunno, It just seems a little clumsy to me.</p>
    <p>So if any of you could give me some starting points to turn it into something decent I'd be eternally grateful.</p>
    <p>The type is still being discussed (!) but it will be similar to what's shown; simple sans, nicely spaced, nothing tricksy.</p>
    <p>Cheers</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mh_4614.jpg"></div><p></p>
