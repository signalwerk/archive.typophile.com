    <p>Alright typophile, I work for a company that uses a bastardized version of Gill Sans as their corporate font. Seriously, they paid someone in the 90's to basically alter Gill Sans' quirky Ultrabold "I". </p>
    <p>The problem as a part of the design team is that we have to work with a fractured and incomplete set of glyphs. It's a postscript version with no kerning pairs, ligatures or well...anything. It's just bad. </p>
    <p>I want to propose the complete set of Verlag as an alternative which is much more fresh and has a lot more flexibility in terms of OpenType. I chose it because it would allow the company's literature to transition a little more seamlessly rather than having to recreate everything at once.</p>
    <p>I've expressed these things to the higher-ups and they want (and are open to) a proposal. </p>
    <p>So, what does typophile think of this idea? Can anyone else think of some advantages?</p>
  html_clean: |-
    <p>Alright typophile, I work for a company that uses a bastardized version of Gill Sans as their corporate font. Seriously, they paid someone in the 90's to basically alter Gill Sans' quirky Ultrabold "I". </p>
    <p>The problem as a part of the design team is that we have to work with a fractured and incomplete set of glyphs. It's a postscript version with no kerning pairs, ligatures or well...anything. It's just bad. </p>
    <p>I want to propose the complete set of Verlag as an alternative which is much more fresh and has a lot more flexibility in terms of OpenType. I chose it because it would allow the company's literature to transition a little more seamlessly rather than having to recreate everything at once.</p>
    <p>I've expressed these things to the higher-ups and they want (and are open to) a proposal. </p>
    <p>So, what does typophile think of this idea? Can anyone else think of some advantages?</p>
