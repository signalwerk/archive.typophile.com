      <p>Press Release fromH&amp;FJ website: </p>
      <p>considering Tobias Frere Jones "a longtime employee" seems to be the problem</p>
      <p>For Immediate Release<br>
      17 January 2014<br>
      Last week, designer Tobias Frere-Jones, a longtime employee of The Hoefler Type Foundry, Inc. (d/b/a “Hoefler &amp; Frere-Jones”), decided to leave the company. With Tobias’s departure, the company founded by Jonathan Hoefler in 1989 will become known as Hoefler &amp; Co.<br>
      Following his departure, Tobias filed a claim against company founder Jonathan Hoefler. Its allegations are not the facts, and they profoundly misrepresent Tobias’s relationship with both the company and Jonathan. Whether as The Hoefler Type Foundry, Hoefler &amp; Frere-Jones, or Hoefler &amp; Co., our company has always been a great place for designers, which is why it’s always been and will continue to be a great place for design.<br>
      It goes without saying that all of us are disappointed by Tobias’s actions. The company will vigorously defend itself against these allegations, which are false and without legal merit. In the meantime, we’re all hard at work, continuing to create the kinds of typefaces that designers have come to expect from us for more than 25 years.</p>
