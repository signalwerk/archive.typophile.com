      <p>Money and equity aside, it seems the height of unfairness that Tobias looses all credit for his superlative work over the last fourteen years, especially the work he brought fait accompli to H&amp;FJ such as Whitney. I know you can’t split the “baby” in a divorce, but Hoefler should not get full credit for some else’s creative work, even if Hoefler considers himself the foundry that commissioned and managed its development/sale. </p>
      <p>As many have said, there is a lot of misinformation and he-said/he-did-not-say in the media; but at least the lawsuit brings light to the situation and voice to Tobias’ perspective rather than having this fade to dark without a sound in Hoefler’s favour.</p>
      <p>Regardless of written contractual obligations, it seems pretty clear that Hoefler did promise a partnership and then reneged; and he appears guilt free in that “business” choice.</p>
      <p>—</p>
      <p>What a crazy contract Tobias signed that prevents someone from working for a competitor for two years! I hope Tobias can release a typeface of his own, as I will do my best to support him. Stay strong; best of luck.</p>
      <p>Signed,<br>
      <em>Sincerely outraged at something that is none of my business...</em></p>
