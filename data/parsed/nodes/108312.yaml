      <p>This is very sad. And very recognizable — the same happened to me 20 years ago. My ‘friend' did the business side of our agency and I created. Turned out to be a very succesful combination, the company made loads of money, which my partner did not want to share. In an effort to clarify the situation I offered to bill my hours, which was accepted initially. After the first invoice things went really sour and I left and started my own agency. A friend lost and a lesson learned.</p>
