    <p>Hello,</p>
    <p>I bought an OpenType font that doesn't work – Indesign doesn't recognize it and the other programs don't show the OpenType features that are supposed to be included. </p>
    <p>The seller was Fontshop, I asked for help there but nobody answered. </p>
    <p>Does anybody know how a font buyer can protect himself from non-working fonts? Is there any list of trustable sites that sell fonts and support their clients?</p>
    <p>thank you<br>
    Mila</p>
