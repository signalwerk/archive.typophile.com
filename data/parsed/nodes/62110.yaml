    html: |-
      <p>I have more information in regards to the transfer of Adobe Font Folio.</p>
      <p>I emailed: <em>Section 4.4 of the 5-seat US English EULA for Font Folio 11 seems to say that as long as the package hasn't been opened one could  transfer the license to the Font Folio. Am I wrong? And could this  be done across borders?</em></p>
      <p>They replied: <em>The section that Tiffany references [above] does allow for the transfer of the license.  She is required, however, to follow the instructions at <a href="http://kb2.adobe.com/cps/152/tn_15281.html" title="http://kb2.adobe.com/cps/152/tn_15281.html">http://kb2.adobe.com/cps/152/tn_15281.html</a>.</em></p>
      <p>The Section 4.4 provides the link to the Customer Support page; the link above is off of this Customer Support site.</p>
      <p>The only limitation, that I know of, for delivery of the product outside the U.S. is delivery to embargoed countries.  The EULA explicitly states this as well - no transfer of licenses may occur to individuals or entities in Iran, Syria, Cuba, North Korea or Sudan.</p>
