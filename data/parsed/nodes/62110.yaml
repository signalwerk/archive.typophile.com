    <p>Hi,<br>
    I am planning to buy the 'Adobe Font Folio 11' CD.<br>
    I now found out that the American price for the CD is $2,599 (=EUR 1,764)<br>
    <a href="http://www.adobe.com/products/fontfolio/" title="http://www.adobe.com/products/fontfolio/">http://www.adobe.com/products/fontfolio/</a><br>
    and the Dutch (since I'm from the Netherlands) price is EUR 3,643.78.<br>
    <a href="https://store5.adobe.com/cfusion/store/html/index.cfm?store=OLS-NL&amp;event=displayProduct&amp;categoryPath=/Applications/FontFolio&amp;distributionMethod=FULL" title="https://store5.adobe.com/cfusion/store/html/index.cfm?store=OLS-NL&amp;event=displayProduct&amp;categoryPath=/Applications/FontFolio&amp;distributionMethod=FULL">https://store5.adobe.com/cfusion/store/html/index.cfm?store=OLS-NL&amp;event...</a></p>
    <p>- Does anybody know the reason of this difference?<br>
    - Is it legel to use the American version?</p>
    <p>thanks a lot,<br>
    Jeroen</p>
