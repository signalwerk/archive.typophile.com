    <p>Hello everybody, I'm new here and am glad I have found it!!<br>
    I have been interested in ID'ing this font:<br>
    <a href="http://www.archdaily.com/79692/makenna-resort-drucker-architecture/general-plan-11/" title="http://www.archdaily.com/79692/makenna-resort-drucker-architecture/general-plan-11/">http://www.archdaily.com/79692/makenna-resort-drucker-architecture/gener...</a></p>
    <p>Notice the Type in general seems 'lowered' around the centre of the letters. eg: the G, centre of the E, R, A and P seem to be lower to the baseline than centred around the middle of the letters...</p>
    <p>It is a lovely clean font and would love to know what it is!</p>
    <p>Thank you in anticipation.</p>
    <p>Regards, Andrew</p>
