  html: <p>Hey all. I have been commissioned to do a project that is totally not up my alley--design a logo and identity for an engineering firm called Meta Engineering. I am trying to make some type choices and have a few ideas...if I purchase a new typeface I don't want to spend a lot so does anyone have suggestions for a cheap Engineer-ish typeface?</p>
