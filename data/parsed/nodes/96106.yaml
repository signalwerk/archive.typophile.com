      <p>Leda does a really good job matching the roman and fraktur structurally. Is there a regular weight? I guess there's not. I could really see it working, not only as a display face, but also on running text.</p>
      <p>The question is how this new fraktur instance would interact with the roman and italic (if I may anticipate such triad will ever be used together). I have a feeling that it has been mostly assumed fraktur will serve as an alternative to italic. There's also a natural temptation to use both. We would have two emphasizers, italic and fraktur, in the same block of text (and bold as an intensifier). Using both, italic and fraktur seems just unnecessary. The problem here is to find a <em>reason</em> for the fraktur, which I think is the most interesting question.</p>
      <p>The question is not whether Eskapade or Leda are innovative, they are <em>a priori</em>. Nor whether fraktur is usable nowadays. I truly believe that is a customary matter. If someone can read it, it can be read and adopted by everyone. John already indirectly pointed it out. The question is how can this roman-italic-bold-fraktur tetrad (or three of them) be used meaningfully together. Fraktur could be used instead of bold italic, for example.</p>
      <p>If think it would be incredible if it was possible, for once, to break the roman-italic marriage, and combine faces in a much more freely way. What Nick tells about style-pairing, it's just... goose bumps.</p>
