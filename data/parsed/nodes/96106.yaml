      <p>Nick, I'm not claiming that Nowak can be credited with inventing the idea of using non-Italic styles for emphasis*, and for all we know that wasn't even her intent (noting that the Roman was not released concurrently with the Fraktur**). However there's a difference between designing different cuts under a single umbrella that can be intermixed, versus simply getting lucky mixing totally unrelated fonts without ruining readability. Look at the famous works of Avital Ronell for example: inventive, expressive, but not highly readable. This is a different animal, and quite a rara avis - in fact I only know of one single very good example "on the ground":<br>
      <a href="http://www.daidala.com/intlife.html" title="http://www.daidala.com/intlife.html">http://www.daidala.com/intlife.html</a></p>
      <p>* Even when I made the Daam Entity over a decade ago I doubt I was the first.</p>
      <p>** Which however could have been an Excoffon-style cleverness (where he released the Nord weight of Olive first, in order to get attention, even though it was less versatile than the other weights to follow).</p>
      <p>Comparing it to something like Sense and Sensibility (great name BTW) I have to wonder if those two can effectively serve as emphasis for each other; I think they're just too close - and the same goes even for virtually any Serif-Sans system. Also note how unworkable upright Italics are for emphasis.</p>
      <p>As an aside I personally don't mind it when Nick cites his own work; it must be admitted (and I've said this before) that he's one of our most innovative designers (of which there's been a shortage lately).</p>
      <p>BTW, one other way Eskapade is innovative is -what I consider to be- a classy implementation of rotalics (see the second half of <a href="http://typographica.org/on-typography/a-fruitful-discomfort-the-face-of-the-2012-olympics/" title="http://typographica.org/on-typography/a-fruitful-discomfort-the-face-of-the-2012-olympics/">http://typographica.org/on-typography/a-fruitful-discomfort-the-face-of-...</a>). In fact it would have been nice if the Roman also had a rotalic-style Italic, at least as an alternative cut.</p>
      <p>hhp</p>
