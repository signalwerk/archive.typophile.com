      <blockquote><p>to find a reason for the fraktur</p></blockquote>
      <p>Indeed, it has to make sense as a particular "voice". In a way that Italic -which connotes among other things informality, ironically not what emphasis is about- so often fails at. This can be the case simply due to the way it looks, or preferably due to its cultural connotations - for example to set passages about Germany, or gangs, or Picasso, or...</p>
      <p>I would again point to the sample from the otherwise unassuming novel "The Interior Life"* where the Modern face is used for passages about the heroine's suburban life while the "fauve humanist" face is used for passages about her medieval fantasy life. And then there's the Italic too!</p>
      <p>* <a href="http://www.daidala.com/intlife.html" title="http://www.daidala.com/intlife.html">http://www.daidala.com/intlife.html</a></p>
      <p>Style-linking: A document can have tags (similar to language tags) that could trigger a change of font, no?</p>
      <p>hhp</p>
