      <p>Clarendon was the original bold for Roman text, when Scotch was the style. High contrast bolds were a later development.</p>
      <p>Interestingly, I originally provided a conventional, high contrast bold for the <em>Globe and Mail</em> serif faces in 2006. Then, when I extended the family in 2009, I added a heavy slab for display, because it’s a contemporary look; as an afterthought, I wondered what an interpolation of that and the Regular serif style would look like—it turned out nicely, and this slab bold has become used by the paper’s designers more than the high contrast bold, they especially like it for Bold contrast in body text.</p>
      <p>So, just as one may have two italics for a roman (italic and slanted), one may have two bolds (slab and contrasty). It’s a problem for style-linking and layout apps, which are predicated on only one of each.</p>
