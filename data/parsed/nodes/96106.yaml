      <p>It is true that using Roman inside Fraktur, or vice versa, was a relatively common practice in the really old days; sometimes later on, sans and Roman were used that way too, although, as noted, a visible difference in weight was usually needed.</p>
      <p>While the Roman/Fraktur case was initially used as we would use italics today, later on Fraktur or sans-serif tended to be used as an alternative to bold, as opposed to either a replacement for italics, or a third level of emphasis beyond bold, IIRC. This could have been because many typefaces had a complementary italic, but no boldface.</p>
      <p>I don't think this really counts as an example of the same phenomenon, but an even more common response to the lack of a boldface in a Roman font is to use a Clarendon as the bold - this was done in many Linotype layouts.</p>
