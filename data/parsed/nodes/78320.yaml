    <p>I'm curious to hear thoughts and opinions on the mixing of upper and lowercase characters in a logotype. I've always referred to this as "intercase" or "mixedcase" and have never came across a formal or correct name. </p>
    <p>Anyway, the first mark that comes to mind is what Target did for Giada De Laurentiis. I'm on the fence with this one, from a purists standpoint it's awful, from a progressive viewpoint, it's interesting and kind of nice. </p>
    <p>What do you think?</p>
