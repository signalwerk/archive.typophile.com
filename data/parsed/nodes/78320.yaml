      <p><em>…from a purists standpoint it's awful…</em></p>
      <p>Not at all.<br>
      Unicase has a good pedigree, going back to uncials.<br>
      It was formalized intellectually by Bradbury Thompson, a well-respected designer, as <a href="http://www.pbtweb.com/alpha26/alpha.html" rel="nofollow">Alphabet 26</a>.</p>
      <p>The sample you show is set in Filosofia, one of many types that has a unicase option.<br>
      The modern/didone style has proved to be quite suitable for unicase (I included it in the display cut of Scotch Modern).</p>
      <p>My unicase type system: <a href="http://www.shinntype.com/panoptica.html" rel="nofollow">Panoptica</a></p>
    html_clean: |-
