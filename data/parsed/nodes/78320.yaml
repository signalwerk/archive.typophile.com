    html: <p>Those letters seem awfully light for use as a logo. As you’ve already found out those strokes won’t render evenly on screen, and you’ll have similar problems any time it gets printed small on laser or inkjet printers. That said I think that your design is strong but the spaces between P and I and N and T are too wide. The S might need to be a little wider to balance it against the wide minuscules and the big air gap to the left of it.</p>
