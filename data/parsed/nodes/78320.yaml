      <p>I agree with the above comments. I think it's an interesting concept, I think it definitely makes you think "what the...?" I think it makes sense when a company is unlike it's competitors or wants to be seen as mold-breaking or different. </p>
      <p>For what it's worth, here is a concept I'm working on for a client that is modernizing, and unlike any in it's sector. They want to convey that, yet look serious, and corporate-clean. </p>
      <p>I'm doing it with a san-serif. Screen resolution is making some of the vertical strokes appear different, I can assure you the I's are the same widths, and are the same width as the middle crossbar on the lowercase e. </p>
      <p>Feel free to critique my kerning and character widths. I'm thinking the P could be a little wider. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sapientiaunicase_5199.png"></div><p></p>
