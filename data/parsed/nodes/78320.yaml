  - id: 448995
    user: 33074
    date: 2011-01-25T09:30:00
    date_raw: 25 Jan 2011 — 9:30am
    votes: null
    html: <p>Agreed - the "WINEBAR" logotype is awful. Especially bad choice to use Bodoni, a face that is predicated on equal proportions in the variation of stroke width. I feel unicase type is tough to execute with any face that has that much variation. Lowercase was not designed to have the same x-height as uppercase so you can't just mash them together and call it a day - requires some finesse. Plus some balance is needed perhaps equal or close to equal number of upper v. lower characters would help keep the balance.</p>
