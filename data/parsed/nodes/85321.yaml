    html: |-
      <p>Aha!</p>
      <p>While using my Windows machine to delete the mixed up UFO that I generated from Glyphs from a USB drive, I was suddenly confronted by this message:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/conn_5239.png"></div><p></p>
      <p>That's weird, I thought, I should take a screenshot of that and post it on Typophile. So I did so, and when asked to name the image file I tried 'con.png'. And then I got the really weird message:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/conno_3468.png"></div><p></p>
      <p>So it turns out that 'con' is one of the file/folder names that have been reserved as device driver names by Microsoft since the days of MS-DOS. <a href="http://support.microsoft.com/kb/74496/en-us" rel="nofollow">Here's a full list of such names.</a></p>
      <p>The moral of the story is: if you're trying to generate UFOs on Windows, or trying to open UFOs created on another platform, make sure that none of your glyphs are called /con/ /prn/ /aux/ /clock$/ /nul/ (/NULL/ is thankfully okay) etc.</p>
    html_clean: |-
