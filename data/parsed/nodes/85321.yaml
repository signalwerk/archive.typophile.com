    <p>Other than RoboFab and Glyphs, what other software exists that can be used to create UFO files? I'm aware of Area51, but that only seems to convert UFO to OTF, not the other way round.</p>
    <p>I've run into some problems with the RoboFab UFO macro in FontLab (partial UFO created, script gags on a particular glyph, does not continue), which I've written to Erik about. And Glyphs seems to mess up the glyph order in the UFO, which is not the end of the world for my current needs, but is unnerving.</p>
    <p>What other options are there for creating UFOs?</p>
