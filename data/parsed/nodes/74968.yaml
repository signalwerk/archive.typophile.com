  html: |-
    <p>I've been given text to typeset for a  bibliography and several of the entries end with a web address. </p>
    <p>As an example, this is how the URL text has been supplied:</p>
    <p>Bringhurst, Robert. <em>The Elements of Typographic Style.</em> Vancouver: Hartley and Marks, 1992, 1997.  <a href="http://www.TypographicStyle.com/" title="http://www.TypographicStyle.com/">http://www.TypographicStyle.com/</a>.</p>
    <p>Considering the accuracy of this <strong>academic</strong>  publication, is there any reason not to simplify the URL as:   </p>
    <p>Bringhurst, Robert. <em>The Elements of Typographic Style.</em> Vancouver: Hartley and Marks, 1992, 1997.  <a href="http://www.typographicstyle.com" title="www.typographicstyle.com">www.typographicstyle.com</a></p>
    <p>(All lowercase, remove "http://", remove the ending "/", remove the period.)</p>
    <p>I also have several situations with text supplied as:<br>
    <a href="http://www.Typographic%20Style.com" title="http://www.Typographic%20Style.com">http://www.Typographic%20Style.com</a></p>
    <p>Is it correct to replace the "%20" with a blank character space that it represents, or leave it as  "www.typographic%20style.com" ?</p>
