    html: |-
      <p>The point is to make the URLs immediately recognizable as URLs, as well as to make them easily readable (since there is no live link; we're talking about print only, here), without ruining the typographic design and turning the whole page into a mess. That's one reason for shortening by eliminating the unnecessary "http://"; it's also an argument <em>against</em> tightening the tracking (always a bad idea anyway). And it might be an argument for avoiding justified setting in any text that's going to include URLs.</p>
      <p>I like italic precisely because it sets off the URL in much the same way it would set off a title; functionally, they are very much alike, within a run of text. (If you've got a lot of URLs in long text, you might want to use a typeface like FF Quadraat that has a particularly narrow yet readable italic.)</p>
      <p>A bunch of "http://"'s on a page are just visual noise, which gets in the way of both scanning and reading. Keep it simple, without losing meaning.</p>
      <p>John</p>
