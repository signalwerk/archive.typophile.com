      <p>For academic publications, yes, check with the editor. But if you're not having to follow a required style, I suggest deleting the "http://" (except in the situations already noted); I also suggest setting the URL in italics, to set it off clearly from the surrounding text. This is not a style that I've heard anyone else recommend; it's one that I've developed myself as a practical solution to designing and typesetting books. (It does depend on the typeface, of course; it calls for a good readable italic.)</p>
      <p>John</p>
