      <p>Regarding typesetting: IIRC at least in the German-speaking part of the world we have a convention that when a URL starts with «www.», it's OK to omit the standard «http://» protocol (because it will be sufficiently clear that [1] yes this is a URL and [2] that's where it starts, it can be entered into a browser like this); but if it starts with anything else, you should include the «http://» to make it clearer.</p>
      <p>So:</p>
      <p>Bringhurst, Robert. The Elements of Typographic Style. Vancouver: Hartley and Marks, 1992, 1997. <a href="http://www.typographicstyle.com" title="www.typographicstyle.com">www.typographicstyle.com</a></p>
      <p>Bringhurst, Robert. The Elements of Typographic Style. Vancouver: Hartley and Marks, 1992, 1997. <a href="http://subdomain.typographicstyle.com" title="http://subdomain.typographicstyle.com">http://subdomain.typographicstyle.com</a></p>
      <p>I agree with Jens though that if there are URLs nearby using any other protocols, it's probably best to always cite the «http://» so as to avoid ambiguity.</p>
    html_clean: |-
