      <p>And best to leave the "%20" in, rather than turning it back into a space.</p>
      <p>Case should copy whatever the site actually uses. I'm sure I heard somewhere that URLs for sites hosted on Unix servers are case-sensitive, while those on Windows servers are case-<strong>in</strong>sensitive, so you should preserve the case given, just to be on the safe side. </p>
      <p>This has actually bitten our marketing dept. on the a** as they produced an advert with a subpage of our URL on it, and dropped it all to l/c. Several months later I spotted that the URL returned a 404 error when pasted into the browser ... but reinstating a non-obvious cap in the middle of it caused the page to load fine.</p>
