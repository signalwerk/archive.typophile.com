      <p>I would ask the project's author/editor if they are using a particular style guide, and if they are then ask how that style guide says to treat URL citations.</p>
      <p>I believe that most style guides call for the entire URL to be listed, with no punctuation after it, and in some cases the date that URL was accessed should also be listed prior to the URL. But in matters like this I always defer to the editor.</p>
