      <p>The American Psychological Association publication guidelines say:</p>
      <p>Author, A. A. (1997). <em>Title of work</em>. Location, Publisher. Retrieved from <a href="http://www.xxxxxx" title="http://www.xxxxxx">http://www.xxxxxx</a></p>
      <p>Depending on what you are referencing (book, journal, presentation &amp;c) the first portion will change, but for the most part, if there is a url, it ends with "Retrieved from..." case sensitive, include http://, and don't end it with a period. </p>
      <p>And I agree with James. When in doubt, ask the editor/publiser/boss if they have a convention in place.</p>
