      <p>Frode, I think it’s a sensible solution in several cases, and one I have already adopted in many occasions.<br>
      The problem with the ephemeral (or, better, ever-changing) nature of all things internet remains, of course, and it could be wise to add a “retrieved on [date]” specification.<br>
      One thing I did (for a journal on welfare and social sciences) was to register a specific domain name for the purpose, in order to give the link a somewhat more “official” and also more friendly and less nerdy appearance (for the moment it’s backed by bit.ly, which offer a series of nice options, but there are php libraries to set up your own).<br>
      Otherwise, for longevity and familiarity I would probably use goo.gl<br>
      On a last note, I try whenever possible or applicable to substitute “http://” with “www.”, in order to both reduce clutter, and let Adobe Reader recognise them as links.</p>
