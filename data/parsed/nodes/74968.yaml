      <p>You can’t put a space in a the domain name you are discussing. %20 is an encoded space and is an error. Remove it and don’t look back.</p>
      <p>Those same domain names are case-insensitive; hostnames like <code>blog.</code> or <code>m.</code> or even <code>www.</code> are not necessarily case insensitive but almost always are. You do <em>not</em> have to act as though [single word].[top-level-domain] is ever case-sensitive despite what you are being told here.</p>
      <p>You may <em>nonetheless</em> wish to use the capitalization in your example to improve readability.</p>
      <p>In print you have no reason to include the protocol identifier <code>http://</code>, but if the text you are using will at any time be exported to an E-book, you trigger the problem of producing an URL that isn’t usable online because you took the protocol identifier out. You can fix this manually, as I have done, but it’s an extra step.</p>
      <p>Eliason, less-than and greater-than are not “brackets”; there is no reason to delimit an URL in plain text unless some statistically improbable character immediately follows it, like maybe a plain hyphen-minus. </p>
      <p>Monospaced font (<em>not</em> Courier) can be nice for URLs in print.</p>
      <p>You could just do what I have done and call it a day, since my way is correct. I can send you examples.</p>
