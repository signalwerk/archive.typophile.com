    html: |-
      <p>re: breaking across line ends - the instructions I've given our typesetters, for URLs in references, are:</p>
      <ol>
      <li>Don't introduce hyphens;</li>
      <li>Try not to break at a hyphen that is actually part of the address, lest it <em>look like</em> you've introduced it;</li>
      <li>Break after a slash, underscore, question mark, or escaped character code (such as "%20"), or <em>before</em> a period (carrying the period over to the next line is sufficiently different-looking from normal sentence punctuation to make it perfectly clear the period is not signalling the end of the sentence/reference)</li>
      <li>If necessary, where a URL consists of words mashed together (thisisanexample.com) then break between those words.</li>
      </ol>
    html_clean: |-
