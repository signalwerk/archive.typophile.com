      <p>I don't think URLs should be hyphenated, as the reader might think the hyphen is part of the URL. </p>
      <p>It's often possible to keep a URL on line line if you tinker with the paragraph's line breaks or tighten the tracking a tad.  But if breaking it is the only option, I break without a hyphen.</p>
      <p>Incidentally, in InDesign I always apply the "no break" attribute to URLs.  There are several ways to apply this attribute, but the method I use is to create a character style called "URL", set the style's attributes to include "no break", and then I apply that style to every URL.</p>
