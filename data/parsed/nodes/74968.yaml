      <p>Domain names (including top level domains) are not case sensitive.</p>
      <p>Everything else in URLs on Unix/Linux machines is generally case sensitive.</p>
      <p>If academic writing you have to follow the appropriate standard (APA, MLA, etc).</p>
      <p>This is a good guide to APA<br>
      <a href="http://owl.english.purdue.edu/owl/resource/560/01/" title="http://owl.english.purdue.edu/owl/resource/560/01/">http://owl.english.purdue.edu/owl/resource/560/01/</a></p>
      <p>In terms of type, I sometimes use loose tracking for URLs.</p>
