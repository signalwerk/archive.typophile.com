      <p>Cristobal: <cite>And what about just forgetting the hyphen and continue the URL on the next line?</cite><br>
      That’s the default behaviour of InDesign.</p>
      <p>Frode: <cite>Many designers think underlines are bad in print, but I happen to think nothing signals a hyperlink better.</cite><br>
      I tried, but my descenders weren’t happy! ;-) (I’m talking black &amp; white)</p>
      <p>I often need to place URIs in notes and bibliographies (<a href="http://www.typophile.com/node/74680" title="http://www.typophile.com/node/74680">http://www.typophile.com/node/74680</a>) and I have even considered to put up an URL shortening service just for it!<br>
      Two notes: it would be nice if <a href="http://www.example.com/" title="http://www.example.com/">http://www.example.com/</a> could be shortened to example.com, but too many websites haven’t even configured the www-less domain.<br>
      About italics, it’s tempting, but, as Christopher rightly points out, it didn’t work in references. My first instinct would be setting them in a monospaced font, but they would end up even longer! Maybe, with the right superfamily, they could be set in a light sans if the remaining text is set in a serif face.</p>
