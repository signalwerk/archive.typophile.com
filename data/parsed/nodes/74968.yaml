      <p>&gt; what are these style guides on URLs that<br>
      &gt; you mention ... and where do I find them?</p>
      <p>Style guides are written guidelines on the preferred style to use in different writing situations. Most newspapers, magazines, and large organizations pick a style guide to use (or create their own).</p>
      <p>Some common ones are the Associated Press Style Book, the Chicago Manual of Style, the New York Times Manual of Style and Usage, and many others.  For medical-related writing the AMA Style Guide is often used. You mentioned it's an academic project and perhaps there's a style guide preferred by your university.</p>
      <p>Go to Amazon and search for "style guide for writing" and you'll find some, and your library will undoubtedly have some. Perhaps some are posted online, too.</p>
