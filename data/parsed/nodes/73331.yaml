      <p>the font is Blippo Bold, I created this font in 1965 for Facsimile Fonts and FotoStar International. Blippo Black has been copied by at least 6 font sellers. Most of them without license. URW++ is the biggest offender. There are 12  weight and versions.<br>
      Robert Trogman</p>
