      <p>Found the 19th century source of the letters used to make Outstanding. It's _Cameo_, patented in 1874 and sold by Mackellar Simiths &amp; Jordan. There is also a digital version by "Character" at abfonts <a href="http://abfonts.freehostia.com/" title="http://abfonts.freehostia.com/">http://abfonts.freehostia.com/</a><br>
      Open the page, follow the link in the third paragraph to _list of all fonts_, page down to _CameoAntique_.<br>
      Don</p>
