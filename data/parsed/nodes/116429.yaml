    html: |-
      <p>A 19th century serif style called Detroit or mansard. The lowercase of Outstanding by "bobistheowl" is in the ballpark for CRUZAN </p><div class="imageWrap"><img src="http://typophile.com/files/OutstandingLCAsCRUZAN_3633.jpg"></div><br>
      <a href="http://www.dafont.com/outstanding.font?text=cruzan&amp;psize=l" title="http://www.dafont.com/outstanding.font?text=cruzan&amp;psize=l">http://www.dafont.com/outstanding.font?text=cruzan&amp;psize=l</a><br>
      More info by Luc Devroye <a href="http://luc.devroye.org/bobistheowl.html" title="http://luc.devroye.org/bobistheowl.html">http://luc.devroye.org/bobistheowl.html</a><br>
      Outstanding is based on Big Vintage Letters by Big Letters Org <a href="http://bigletters.org/big-decorative-vintage-letters.html" title="http://bigletters.org/big-decorative-vintage-letters.html">http://bigletters.org/big-decorative-vintage-letters.html</a> With some digging it might be possible to find the original 19th century source.<br>
      Note that the Outstanding font has awkward sizing. Resize the glyphs to about 40% and they work much better.<br>
      Relatively minor editing of Outstanding could produce a pretty close facsimile of CRUZAN.<br>
      Don<p></p>
