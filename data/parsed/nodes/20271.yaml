  html: <p>Specifically, a logotype is defined as only the typographical portion of any unique or <a href="/node/add/wiki?edit%5Btitle%5D=logo" title="Create node &quot;logo&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">logo</a>, although confusion amongst the definition of this term is rather prominent today. The logotype can be presented as a separate entity from its accompanying mark, and may function independently from a graphic or pictogram. A prominent example of this term would be that of the FedEx logotype, which serves as the main vehicle for branding and advertising for&nbsp;FedEx.</p>
  html_clean: <p>Specifically, a logotype is defined as only the typographical portion of any unique or <a href="/node/add/wiki?edit%5Btitle%5D=logo" title="Create node &quot;logo&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">logo</a>, although confusion amongst the definition of this term is rather prominent today. The logotype can be presented as a separate entity from its accompanying mark, and may function independently from a graphic or pictogram. A prominent example of this term would be that of the FedEx logotype, which serves as the main vehicle for branding and advertising for&nbsp;FedEx.</p>
