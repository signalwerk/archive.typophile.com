      <p>In your last version here, I find the first one (type + trailing odors) to be quite iconic. The linework of the odors is still off in some way; a little too squat for one, and second, it would look better with one or two well done lines than a jumble of 3 or more that aren't done well.</p>
      <p>I would try refining getting rid of the middle and right lines, and refine your work on the first one on the left--make larger, smooth the curves, and then play with its location above the letters.</p>
