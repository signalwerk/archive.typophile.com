    <p>Hey all,</p>
    <p>Been working away on this for a new label Im starting mainly specialing in limited edition screenprinted goods of the creepy, quirky, cartoon variety.</p>
    <p>I liked using only one colour as these will eventually be printed onto calico tote bags that the t-shirts come in. Due to the texture of the bags it should give for some nice natural variations in treatmeant.</p>
    <p>All feed back is welcome.</p>
    <p>Cheers!</p>
    <p>Peter</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ns_3611.jpg"></div><p></p>
