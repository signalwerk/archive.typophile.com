      <p>Interesting evolution. I wanted to say that the initial shape you'd enclosed it in was reminding me more of an ice cream icon or shaving cream than what I realized later was supposed to be a pile of crap.  I think.  </p>
      <p>The type is getting more legible. I would question the perspective of the letters and the shape they're creating.  It appears to be falling over. Odor lines are a good idea, but the same device also indicates a sweet smelling pie.  Go look at Peanuts. How many ways did Charles Schultz make pigpen look dirty with simple lines?</p>
