    <p>Hello,</p>
    <p>what would you propose as an alternative to the common Minion/Myriad- and Sabon/Syntax-combos?</p>
    <p>The application would be mainly technical project reports, several dozens to sometimes a few hundred pages, typeset with LaTeX on A4 paper, in two columns or with wide margins, 10 to 12 pt, with loads of tables, figures, "in-text-markup", etc. Sometimes read as PDF on screen, but mostly printed with "office" printers (laser). Also, as secondary applications, presentations, letters and similar "office" documents. European readers, German, English, French language.</p>
    <p>The criteria would be:<br>
    - Readability. Should be as easy as prose, as far as technically possible under these conditions. Whether these documents get actually read or not makes a _significant_ "competitive advantage". In the industry nearly everyone uses a certain "text processor" for these applications and certain "typefaces", together with a certain type of "layout", and as a result, the documents are simply _never_ actually read.<br>
    - Features: Both serif and sans should be available at least as regular, italic, semibold, semibold italic, with oldstyle figures and small caps at least in the regular weight, both upright and italic. A variant appropriately spaced for headlines would be nice to have for the sans.<br>
    - "Garalde" look (and "feel") for the serif. Preferably as bright as possible without compromising legibility too much.<br>
    - The sans should also be suitable as main text typeface for certain applications.<br>
    - Opentype postscript flavor for integration with LaTeX.<br>
    - The typefaces in question shouldn't be as common as Minion/Myriad or Sabon/Syntax, that's why I am asking here. ;-)</p>
    <p>I've had a look at the "similar fonts" at myfonts.com and identifont.com already, also at the families of "companion" sans and serifs at identifont.com. And while I do like quite a few of the sans typefaces listed there (Celeste, Charlotte, Freight...) I haven't managed to find a matching serif typeface that I really do like. I definitely do not like the serif members of "corporate identity" families such as Thesis, Corporate ASE, Nexus, Generis, Meta, etc...</p>
    <p>Any proposals?</p>
    <p>Sincerely,</p>
    <p>Wolfgang</p>
    <p>P.S.: I'm a typographic layman, and I don't have the possibility to test these fonts, that's why I hope to get competent advice from experienced users of various relevant typefaces here...</p>
