      <p>Garaldes with italic small caps and regular/semibold weight are, among others, Lyon and Pona,<br>
      MVB Verdigris has no semibold, but does have italic small caps. It is a rather dark text font though. </p>
      <p>As for the Sans, any humanistic Sans would work. Nick Shinn's Sensibility, Stella, Mundo, PF Centro Sans, Depot New. As well the Office 2007 bundled Clear Type fonts Corbel and Calibri are part of the humanistic "Frutiger-alike" genre. New and interesting is the stressed Ideal Sans. </p>
      <p>Be aware that I am a layman too and this is not an expert opinion.</p>
