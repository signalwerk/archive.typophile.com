    html: |-
      <p>Apparently, Andron doesn't have italic small caps anyway. Why I need these? For acronyms/abbreviations (I have L-O-A-D-S of these in my documents) in blocks of italics text, such as quoted text, margin notes, etc.</p>
      <p>The fact that Andron doesn't have a sans that's made specifically for it wouldn't matter to me, I'm not looking exclusively for purpose-made "superfamilies". Sabon and Syntax were made by different designers, yet as far as I understand they seem to be generally considered as The Reference for documents like the ones that I mostly write. </p>
      <p>And it doesn't have to be typefaces that were released recently. For example, if you know of a nice matching sans for Albertina... Would Today work? I picked these two from the "Schriftwechsel" book, and Albertina also from the "Textism" web site. I have no clue how they would work for my kind of application, however, especially with office printers.</p>
      <p>I have also come across Epic and Organic (from Typetrust) by chance. What do you think about them? Epic looks to me essentially like "a better Garamond than Garamond".</p>
      <p>Calluna looks a bit too idiosyncratic to me with that asymmetric "twist" in the connection between the lower serifs and the stems.</p>
      <p>And Centro looks a bit too "slabby" for my taste.</p>
      <p>So, if you know of more such "hidden gems" like<br>
      - Novel,<br>
      - Lyon (matching sans?),<br>
      - Pona (Orenga is beautiful - does it pair up with Pona?)<br>
      keep them coming! :-)</p>
      <p>As for the sans; I do like Stella, Mundo, Depot New a lot, thanks for those.</p>
      <p>Und Grüße in das Land wo die krossen Chicas auf den Palmen wachsen. ;-)</p>
