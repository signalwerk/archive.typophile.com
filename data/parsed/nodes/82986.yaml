    html: |-
      <p>Epic seems to be more a reinterpretation of Sabon, with new italics, than any other Garamond-type. This is interesting, as somehow Epic seems to be more close to Sabon than the revival of Sabon Next. In any case I am not qualified to assess the quality of how the typeface is crafted (outlines, spacing, kerning, etc...). </p>
      <p>As well it seems to me that Epic is different than other typefaces (and Sabon) in the size and position of the German Umlaut dots in comparison to the i dot. I mention it as it seems like we share the same mother tongue. </p>
      <p>All in all it seems to me a useable typeface. </p>
      <p>Something else that fits your criteria is FF Celeste, which has a <a href="/wiki/https%3A/%252Fwww.fontfont.com/fonts/celeste" class="freelinking" rel="nofollow">serif</a>, <a href="/wiki/https%3A/%252Fwww.fontfont.com/fonts/celeste-small-text" class="freelinking" rel="nofollow">small-text (serif)</a> and a <a href="/wiki/https%3A/%252Fwww.fontfont.com/fonts/celeste-sans" class="freelinking" rel="nofollow">sans face</a>. Celeste takes more inspiration of the modern era. It is a good text face though and very suitable. It does not need to be a Garalde. (EDIT: I just saw you mentioned Celeste in your original post. You said though that you did not find a matching serif you liked. That means you did realize that there are Freight and Celeste serif versions, but you did not like them, right? Just in case you did not notice.)</p>
      <p>Did you try to ask the designers of the serif typefaces, which fitting sans they recommend? </p>
      <p>As well there is no real agreement on how to pair typefaces. I think it was Hrant here in this forum who said once that one should not aim for all too similar metrics and x-height. You can find more advise on pairing here: <a class="freelinking external" href="http://www.google.at/search?sourceid=chrome&amp;ie=UTF-8&amp;q=typeface+pair+OR+pairing+OR+match+OR+matching+OR+combining+OR+combination+OR+tango+site%3Atypophile.com" rel="nofollow">Typophile threads on pairing</a></p>
