  html: "<p>Hi, <br> <br>Last Friday, my book, <b>Dutch Type</b>, was presented to a crowd of Dutch designers and designati at the Toneelschuur theatre in Haarlem*. <br> <br>I leave it to others to recommend or criticize the book here (or anywhere). <br> <br>I would just like to say that I wish you'd all been there; it was a great party, with presentations by Wim Crouwel, Erik van Blokland and Rene Knip and typographic visuals by Jeanne de Bont and Erik. <br>And then there was the band, specially put together for this event. Wolfraam are Just van Rossum (guitar), Peter Verheul (guitar)**, Henk Lamers (laptop computer), Donald Beekman (bass) and Donald Roos (sax). Yes, a band of type designers! They'll perform again tomorrow night (Thursday) at the Zeebelt Theatre in The Hague, where yours truly will show some slides. See also <a href=\"http://www.zefir7.nl/zefir7/index_fr.html\" target=\"_blank\">http://www.zefir7.nl/zefir7/index_fr.html</a>. <br> <br>The publisher's website <a href=\"http://www.010publishers.nl\" target=\"_blank\">http://www.010publishers.nl</a> has a short account of the 5 March event. More pix on <a href=\"http://homepage.mac.com/letterror3/PhotoAlbum9.html\" target=\"_blank\">http://homepage.mac.com/letterror3/PhotoAlbum9.html</a>. <br>Plans for a full CD are being discussed***. <br> <br>Jan <br> <br> <br>*   Why De Toneelschuur? Because it's the only theatre in the Netherlands designed by a lettering artist -- Joost Swarte -- who is also in the book, and because it was built on the premises of the former Enschede type foundry and printing firm. So we were standing on holy ground. <br>**  Peter is also one of the designers of Dutch Type, the other one being Bart de Haas <br>*** There has been a (self-published) double CD before: Five Acres of Independence by Henk and Peter, featuring contributions by Just and Donald R. Check out <a href=\"http://www.puntino.nl/\" target=\"_blank\">http://www.puntino.nl/</a>.</p>"
