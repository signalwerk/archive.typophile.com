    <dl>
    <dt><em>Elements of Lettering and Sign Painting. Scranton: The Colliery Engineer Company. 1899.</em></dt>
    <dd>A comprehensive course on lettering from The International Correspondence Schools. This book consists of two parts explaining lettering styles and designs as well as the know-hows to methods and materials. An interesting read for anyone learning about hand lettering. Bibliographic record and a digital copy is available at Open Library. <a class="freelinking external" href="http://openlibrary.org/books/OL24157380M/Elements_of_lettering_and_sign_painting" rel="nofollow">http://openlibrary.org/books/OL24157380M/Elements_of_lettering_and_sign_painting</a></dd>
    </dl>
