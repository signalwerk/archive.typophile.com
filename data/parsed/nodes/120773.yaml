  html: |-
    <div class="node-spam-content"><p>So, as a sort of oddity I'm adding fists/manicules to my latest typeface and I figured arrows would be handy as well. Now, I have them mapped with the appropriate unicodes as far as possible. To make them more accessible I figured I would create a stylistic set so you can type &gt;&gt; to make an arrow. However, when I add the code and I click on compile OpenType program it tells me it has to abort because of errors.</p>
    <p>I must be doing something wrong. How do you usually map these kind of symbols to OT functions, or don't you?</p>
    <p>feature ss07 { # Stylistic Set 7<br>
     # DEFAULT<br>
    		sub &gt; &gt; by arrowright;<br>
    		sub &lt; &lt; by arrowleft;<br>
    		sub &gt; &gt; &gt; by blackmaniculeright;<br>
    		sub &lt; &lt; &lt; by blackmaniculeleft;<br>
    } ss07;</p>
    </div>
  html_clean: |-
    <div class="node-spam-content"><p>So, as a sort of oddity I'm adding fists/manicules to my latest typeface and I figured arrows would be handy as well. Now, I have them mapped with the appropriate unicodes as far as possible. To make them more accessible I figured I would create a stylistic set so you can type &gt;&gt; to make an arrow. However, when I add the code and I click on compile OpenType program it tells me it has to abort because of errors.</p>
    <p>I must be doing something wrong. How do you usually map these kind of symbols to OT functions, or don't you?</p>
    <p>feature ss07 { # Stylistic Set 7<br>
     # DEFAULT<br>
    		sub &gt; &gt; by arrowright;<br>
    		sub &lt; &lt; by arrowleft;<br>
    		sub &gt; &gt; &gt; by blackmaniculeright;<br>
    		sub &lt; &lt; &lt; by blackmaniculeleft;<br>
    } ss07;</p>
    </div>
