    html: |-
      <p>It seems unnecessarily cautious to use backslashes routinely. Especially given that there are no standard glyph names that are also OpenType feature keywords.  </p>
      <p>It is handy in the unlikely case that you need to name a glyph something like "sub" or "lookup", but if you do happen to use a keyword as a glyph name, the compiler will complain, letting you know to use a backslash (or a different name). </p>
      <p>But, no need to do it all the time preemptively, unless you want to.</p>
    html_clean: |-
