      <p>Oh I'm definitely interested.</p>
      <p>I agree with your statement, but I also wonder despite whether we're interested in it or not, why the typography panels need to be different anyway. InDesign's typography panel has just about everything. I think they more or less know users want more options, because in Photoshop CC there's finally access to OT functions, though the glyphs window is still not included. I just see no practical reason for making these panels different in all three programs. I guess they have been developed independently, but since a few years now they ought to be the same, based on InDesign's typography panel.</p>
