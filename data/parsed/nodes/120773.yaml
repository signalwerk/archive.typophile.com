    html: |-
      <p>It's a classic catch-22. The app makers (e.g., Adobe) need to support this stuff better, but they don't because they say users aren't asking for it. Users aren't asking for it because, since the apps don't support it, they don't know it exists. Given this situation, workarounds are understandable, but we would all be better off if the basic problem were resolved. </p>
      <p>There's a petition effort going on right now to (hopefully) address this. You might be interested:</p>
      <p><a href="http://ilovetypography.com/2014/10/25/why-a-better-opentype-user-interface-matters/" title="http://ilovetypography.com/2014/10/25/why-a-better-opentype-user-interface-matters/">http://ilovetypography.com/2014/10/25/why-a-better-opentype-user-interfa...</a></p>
