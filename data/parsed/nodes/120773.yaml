    html: <p>By the way, how do you handle the fact that some software just have no way to access the OT features in a certain way? There are some differences between the Typography panels from Photoshop, Illustrator and InDesign. In some cases you need stylistic sets while in other cases you can't access them. That's why I created a few extra stylistic sets so some of the rather standard OT functions can still be accessed in all software.</p>
