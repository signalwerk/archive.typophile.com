    html: |-
      <p>Much better already. Great improvements!</p>
      <p>The n and alikes might benefit from a little smoother curve. It seems to 'sharp' compared to the other letters.</p>
      <p>I think you need to make the contrast between diagonals larger. In the v, for example, the right diagonal looks thicker to me (should be the other way around).</p>
      <p>I think the top of the bowl in /a/ needs to be steeper to match the top of /a/.</p>
      <p>The tail in /l/ needs rethinking or removing.</p>
      <p>The g needs more 'humanisticness'. It looks like you added acute joints to an otherwise 'plain' g. Perhaps shape it towards this g: <a href="http://new.myfonts.com/fonts/artlebedev/mezzo/" title="http://new.myfonts.com/fonts/artlebedev/mezzo/">http://new.myfonts.com/fonts/artlebedev/mezzo/</a></p>
      <p>The bottom terminal in c should end thinner, more towards a point.</p>
      <p>Keep going! You got something great in the making!</p>
