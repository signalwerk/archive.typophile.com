    html: <p>You have different scenarios for strokes. in some places one stroke starts with angled cut and ends with straight cut or vertical/horizontal cut, but in other places it doesn't. even if they are very similar forms. It seems that you are trying to blend some ideas from different styles or typefaces but I think it needs more polishing to create a united typeface. and I agree with jasper in case of the curve inside of the /d/ bowl, this is not a problem that you created that way, it makes me feel that eyebrows of the /d/ is folding and he/she is very angry! I wonder if anyone else noticed it or not? in the /s/ contrast got lower, different from contrast of the /d/ or /k/. a suggestion about presenting your typeface, If you upload it in black and white, the judging of the typeface would have been easier, color makes the expression of the letters different.</p>
