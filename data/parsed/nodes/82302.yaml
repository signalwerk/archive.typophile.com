    html: |-
      <p>1. Yes all cuts on the top of stems should be like the k (k, not d).</p>
      <p>2. The modulation across the entire typeface doesn't work. For example the curve on the inside of the bowl in /d/ has one of those 'sudden cuts' where the curve is interupted. I would just get rid of that whole idea, but if you insist on having those 'sudden cuts' have a really close look at how Alexei Vanyashin incorporated them in his typeface. <a href="http://cyreal.org/typefaces/florian" title="http://cyreal.org/typefaces/florian">http://cyreal.org/typefaces/florian</a></p>
      <p>3. The tapering in the k (bottom right) is too much.</p>
      <p>4. Why make one stroke end at an angle and one stroke end straight in the z? Same for f.</p>
      <p>5. My Sensato is actually quite similar to this, so you might want to use it as a reference to see how I solved the problems you're encountering now, but bare in mind that Sensato is by no means finsihed and far from perfect.</p>
      <p>Keep going!</p>
