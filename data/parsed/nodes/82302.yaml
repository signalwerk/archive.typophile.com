      <p>I promised to give you more extensive critique some time ago, so here it is:</p>
      <p>The tails in p and d really look out of place to me.</p>
      <p>The sudden straight cut-offs don't really work for me. </p>
      <p>What you did with the ascender of d, is also visible in Karmina Sans, but I prefer it cut off the other way around.</p>
      <p>Don't be afraid to make the t slightly wider, more towards the f.</p>
      <p>s in both bold and regular leaning backwards and topheavy.</p>
      <p>The top of the e leans towards the right too much.</p>
      <p>The top of the q needs something to make it's height optically equal when it's next to a /u/. Have a look at the q (and b) in Quadraat, bij Fred Smeijers. </p>
      <p>Keep going!</p>
