  html: |-
    <p>I just ran across maxkerning.com. The site introduces you to an over-the-top character who is obsessed with good typography. </p>
    <p>In his faux manifesto he states: "...technology conveys thoughts more cleanly and rationally than our imperfect mortal abilities."<br>
    With a footnote that reads:<br>
    "I admire the effort of men who hand kerned type, but when I look at<br>
    their work, I see fragments of sloppiness everywhere."</p>
    <p>After this odd experience, I did a whois search of the domain maxkerning.com to find it belongs to Extensis.</p>
    <p>I'm thinking maybe they have some sort of new kerning technology? Anyone have more info? Insight?</p>
