    html: |-
      <p>Yes, I would say that is the right category, but there is no match I could find at Dafont, and none I could locate at MyFonts. This pushes me towards the idea that this is an amateur font that is perhaps a custom font made by the 'artist' who did the lettering. </p>
      <p>In case you cannot find the original font, <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/klang/mt/" rel="nofollow">Klang</a> is pretty similar, and could be backslanted a bit to make it more vertical.</p>
      <p>- Mike Yanega</p>
