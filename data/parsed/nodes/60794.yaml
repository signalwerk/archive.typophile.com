      <p>If you want some choices that are even less formal than Klang, Robert Schenk of Ingrimayne Type has some hand-lettered pen fonts (at MyFonts): Gretchen Hello, Xahosch, Xaltid, Balboat and Hermainita. The last one is perhaps the neatest lettering, and most professional looking. The others are less formal.</p>
      <p>- Mike Yanega</p>
