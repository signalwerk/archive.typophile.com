      <blockquote><p>I've seen it argued that the Linotron 202, circa the 1960s, used "digital" type.</p></blockquote>
      <p>According to the Linotype website, Linotron 202 was launched in 1978. The characters were stored as long-vector outlines so this was already pretty digital. Peter Karow’s Ikarus was presented at ATypI Warzawa in 1975. By that time there were also others who had been working on digital formats and software for digitizing, storing and rendering typefaces but experts of that time such as Robert Norton referred to Ikarus as ‘the only game in town’. </p>
      <p>This is not where digital type started though … In their well researched book on Dr.-Ing. Rudolf Hell, which also covers the history of Hell Digiset (Hell’s digital typesetting system), Boris Fuchs and Christian Onnasch mention that the development of digital typesetting started with the Linotype 1010 in 1955. This machine scanned characters from a photomatrix and output them on photographic film by a CRT. As they did not store the characters, the process was not fully digital. The authors mention the start of digital typesetting at Hell in February 1964. By February 1965 the first typeface was coded on paper tape for CRT-output. In March the typeface date was converted from paper tape to a new magnetical storage medium that had just been developed by Siemens. The typeface matrix was 30 x 48 dots … In May and July Hell digitized its first sans serif. Other literature suggests that this may have been Digi Grotesk N (similar to Neuzeit-Grotesk). The first Digiset system was presented at the industry fair in Hanover, Germany in April 1966. The first working system was sold to RCA/USA in June 1966. The authors write that, after having convinced themselves that the Hell concept was better that their Videocomp, RCA decided to sell Hell’s Digiset typesetting system. RCA sold over 100 systems. </p>
      <p>Concluding from these sources, Think we may say that digital type dates back to February 1965 (from the Hell perspective). By this month, February 2014, that’s about 49 years ago …</p>
