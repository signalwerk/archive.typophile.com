      <p>Right. I was thinking in the context of this thread, of how Fontographer, which was introduced in 1986, changed the business, by making it possible for one person to make fonts.</p>
      <p>Earlier, in a small design studio in 1978, I had been using an Itek Quadritek typesetting system. It was phototype, but the process was controlled with a “command line interface”.</p>
      <p>The Quadritek, and the Compugraphic system used by many typesetting companies in Toronto at the time, had digital front ends.</p>
      <p><a href="http://macpro.freeshell.org/quadritek/q1.html" title="http://macpro.freeshell.org/quadritek/q1.html">http://macpro.freeshell.org/quadritek/q1.html</a></p>
      <p>But those earlier systems were part of the old type design set-up, split up into different specialist jobs.</p>
