      <p>Actually Nick, I've seen it argued that the Linotron 202, circa the 1960s, used "digital" type. Not sure I want either side of that one.</p>
      <p>For the OP's term paper, it's the checking that matters. How does the type perform, with the materials involved. But checking on what? </p>
      <p>What's changed is those materials -- nowadays, a font has to work with pixels on a screen, the range running from a 72-dpi computer monitor to a 300-dpi phone or tablet, soon higher still, I'll bet.</p>
      <p>And with ink, dry toner(s) with inkjet or laser -- and printers having different resolutions &amp; software, to the inks (soy or otherwise) with high-resolution offset printing.</p>
      <p>Etc.</p>
      <p>Not a reasonable question, IMO</p>
