    html: <p>If the text face and its sans companion need to be mixed on the same line, in lieu of matching color and x-height, you may simply choose a single super-family such as the aforementioned Anselm Pro (a useful reinterpretation of the types of Jean Jannon). The exact relationship between the sans and the serif all depends on how intimately they are combined.</p>
