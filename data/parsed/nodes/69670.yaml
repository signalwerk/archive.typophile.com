    <p>I'm planning to use Warnock Pro as the text face for a book. However, I need a sans that will work well with it. The trouble is, the obvious options fail on one or more of the necessary criteria.<br>
    1. It has to have small caps and maybe also an italic (or oblique)<br>
    2. It has to have Greek, or at least there has to be a Greek face that's similar enough I can drop a word or two of Greek caps or small caps into the same line of text as Latin caps or small caps. Monotonic Greek should suffice. Cyrillic isn't absolutely necessary, but it might not hurt. (The Greek requirement is also limiting my options for the text face.)<br>
    3. It needs to be reasonably sturdy for good color when set amidst 10.5/13 Warnock Pro Regular.</p>
    <p>At the moment the best I've come up with is Hypatia, but the lack of italics may be a problem.</p>
    <p>The book has to do with twentieth-century sculpture (everything from Beaux-Arts in the early decades through Art Deco to some more contemporary styles in the 1980s and early 1990s).</p>
    <p>Any ideas?</p>
