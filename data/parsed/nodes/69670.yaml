    html: <p>Thanks, Christopher. I guess I had been thinking of something with geometric tendencies due to the Art Deco-era inscriptional lettering that will be in many of the illustrations, but in terms of the type itself, I like the look of Anselm Sans. The Anselm superfamily as a whole is probably not viable for this job based on the client's objections to other text faces I had considered, but the sans looks like something that has a reasonably good chance of surviving the three or four people there who will have something to say about the design. The weight looks good, and I think the lack of Greek small caps will not be a problem, based on the portion of the manuscript I've worked on so far.</p>
