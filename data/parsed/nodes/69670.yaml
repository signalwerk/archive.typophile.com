    html: |-
      <p><em>But how well does it work with Warnock?</em></p>
      <p>I couldn't say without setting comparative mixed text. Stylistically, the choice of "g" with either one or two bowls gives you some leeway. Similarly there is a plain (geometric) Greek and a stylistic alternative, more "scripty".</p>
      <p>Warnock and Figgins are not equivalent in vertical metrics.<br>
      I don't have Warnock on my computer, so was not able to compare x-height, which is a crucial factor for mixed text, but it's not critical for x-height to be identical. I decided against that for the Modern Suite, finding that a Regular weight sans serif looks bigger than a serifed face of the same x-height. </p>
      <p>Would you like to try it out?</p>
