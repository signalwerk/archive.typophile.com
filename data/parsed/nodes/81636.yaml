    <p>Hello everybody!</p>
    <p>I'm again here to explain a new problem... :)</p>
    <p>I downloaded the free font Auctoritas,<br>
    and I have two files .ttf (one regular and one italic),<br>
    I'm working on a mac<br>
    and when I'm installing the two fonts my BookFont says that one is double,<br>
    and on illustrator it works only one version (the italic version) but not the regular style.</p>
    <p>I can't understand why,<br>
    and actually the two fonts are different :(<br>
    it drive me crazy! </p>
    <p>Thank you for the attention<br>
    Swanina</p>
