      <p>If you look at the font info in FontBook, you get this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/info_4869.jpg"></div><br>
      It tells you to contact Doug Sheets if you are to use the font commercially but does not  show the designer's URL; I can hardly believe that Apple omitted that information!<p></p>
      <p>Here is the output that otfinfo (that comes free with the <a class="freelinking external" href="http://www.tug.org/mactex/" rel="nofollow">MacTex</a> distribution) gives me</p>
      <p><code>% otfinfo -i Auctoritas_Regular.ttf<br>
      Family:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Auctoritas<br>
      Subfamily:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Regular<br>
      Full&nbsp;name:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Auctoritas&nbsp;Regular<br>
      PostScript&nbsp;name:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Auctoritas<br>
      Unique&nbsp;ID:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1.000;pyrs;Auctoritas<br>
      Designer:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Doug&nbsp;Sheets<br>
      Designer&nbsp;URL:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;http://dougsheets.com<br>
      Manufacturer:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Doug&nbsp;Sheets<br>
      Copyright:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Doug&nbsp;Sheets<br>
      License&nbsp;URL:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;http://dougsheets.com<br>
      License&nbsp;Description:&nbsp;Free&nbsp;for&nbsp;personal&nbsp;use,&nbsp;please&nbsp;contact&nbsp;for&nbsp;commercial&nbsp;use.<br>
      </code></p>
      <p>If you are to use the font commercially, you should thus contact <a class="freelinking external" href="http://dougsheets.com/contact.html" rel="nofollow">Doug Sheets</a>.</p>
      <p>Michel</p>
