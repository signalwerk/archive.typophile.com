    html: <p>o_e should not be treated as a ligature in French. The French words "coefficient", "moelle" and generally words for which the o and e are pronounced separately do not give rise to œ. It is the spell checker that replaces oe by œ in œil, œuf, bœuf, etc. If you implement the ligature oe in the font, you will get "cœfficient", "mœlle" etc. which are plainly wrong.</p>
    html_clean: <p>o_e should not be treated as a ligature in French. The French words "coefficient", "moelle" and generally words for which the o and e are pronounced separately do not give rise to œ. It is the spell checker that replaces oe by œ in œil, œuf, bœuf, etc. If you implement the ligature oe in the font, you will get "cœfficient", "mœlle" etc. which are plainly wrong.</p>
