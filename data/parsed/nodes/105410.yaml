    html: |-
      <p>Ah, the joy of opposing timezones.</p>
      <p>I did find what I was looking for late yesterday (<a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">Adobe: OpenType Feature File Specification</a>).</p>
      <p>My quick solution was to move this stuff to the end of <em>liga</em> in their own block...</p>
      <pre> language FRA; # French
      lookup liga10 {
          sub A E by AE;
          sub A e by AE;
          sub O E by OE;
          sub O e by OE;
          sub a e by ae;
          sub o e by oe;
      } liga10;
      </pre><p>
      ...but it did seem unlikely to me that this was the usual thing to do for French, so removing it altogether is probably the best solution.</p>
      <blockquote><p>May apply to some other scripts.</p></blockquote>
      <p>Well it certainly seems to apply to text marked up as English and Irish in Webkit and on my Nook!</p>
      <blockquote><p>Use the "locl" feature.<br>
      There have been a number of threads at Typophile about the “ﬁ” ligature in Turkish, which might help you understand the issue and method.</p></blockquote>
      <p>I don’t think <em>locl</em> is appropriate here, but it would certainly be easy to allow for Turkish while I’m editing the <em>liga</em> feature.  These fonts already have fi &amp; ffi in a separate block to fl, ffl &amp; ff so it should be simply a matter of putting in something like...</p>
      <pre> language TRK  exclude_dflt; # Turkish
      lookup liga1; # fl ffl ff
      </pre><p>...before...</p>
      <pre> script dflt;
      lookup liga0; # fi ffi
      lookup liga1; # fl ffl ff
      </pre><p>
      Another useful reference: <a class="freelinking external" href="http://partners.adobe.com/public/developer/opentype/index_tag5.html" rel="nofollow">Adobe: OT Feature Tags</a></p>
