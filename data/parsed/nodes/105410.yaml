    html: |-
      <p><cite>… and in the <strong>free</strong> book The Hound of the Baskervalds the dog is missing.</cite></p>
      <p>What a silly thing to say. </p>
      <p>Changing the topic from <cite>books</cite> to <cite>type,</cite> in the <strong>for money</strong> fonts, say, oh, from Adobe, there aren't any combining diacriticals there, either. Show me an Adobe font that has all -- or even some -- of the characters from 0300 to 036F. Less sure about the fonts from the Monotype conglomeration, but I'd bet it is similar. And include FontFont.</p>
      <p>I don't know about DTL. Wonderfully drawn fonts. I wish my customers (the 100 or so publishers in the Association of American University Presses) could afford them. I'm not being snide, I really would like to work with these fonts, as I think they would print (ink on paper) so much better than most of what is used. But I argue in vain, the annual font budget for most presses isn't large enough to buy even one DTL family. And designers have their quirks too, many would rather save up &amp; buy the new display font of the year...</p>
      <p>Try offering an educational discount to, say, the University of Chicago Press. I'll broker the deal for free just to have the privilege of working with DTL fonts.</p>
      <p>Given my customers can't afford DTL fonts my question is moot, but just out of curiosity, how many of them have populated the combining diacritics? How many languages can you cover? Romanized Arabic? Romanized Indic Scripts? The major (non-European) languages used in Africa? Native American languages, where "American" covers North, Central and South America?</p>
      <p>It isn't just the little, unimportant people of those countries involved. Western Europe is full of ex-colonial powers, and as they run out of topics such as how many petticoats George Sand might have worn, had she worn petticoats, they turn to the history of those colonial days...</p>
      <p>Actually, it is in the OpenSource fonts where attention is paid to combining diacriticals and support is given to the languages that require them.</p>
      <p>Remember, the Unicode Consortium said <cite>Gosh darn it golly gee whiz</cite> (or words to that effect), <cite>we're not going to keep assigning codepoints for accented Latin glyphs. The proper way to render such glyphs is to use a base character and a (or series of) combining diacritical(s).</cite> Which makes perfect sense. If you go read the section on combining diacritics in the Unicode Standard, everything is provided for. Now if only the font publishers would comply...</p>
