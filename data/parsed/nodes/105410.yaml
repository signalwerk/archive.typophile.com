    <p>I’m hoping someone can point me in the direction of some syntax examples for implementing language-specific ligatures.  I’m not completely clueless, but I’ve yet to find anything that’s entirely clear to me either.</p>
    <p><strong>The reason:</strong> I’ve been looking at some <a class="freelinking external" href="http://arkandis.tuxfamily.org/adffonts.html" rel="nofollow">free fonts</a> which look promising, but they implement some ligatures that are only appropriate in French (ae -&gt; æ, oe -&gt; œ).  Seeing words like <em>dœs</em> and <em>shœs</em> (or <em>Gæilge</em>) is a little disconcerting.  I’d like to corral these, though I suppose I could also just delete them.</p>
    <p>The problem table seems to be this...</p>
    <pre>feature rlig { # Required Ligatures
     # Latin
        sub A E by AE;
        sub A e by AE;
        sub O E by OE;
        sub O e by OE;
        sub a e by ae;
        sub o e by oe;
     script DFLT;
        sub A E by AE;
        sub A e by AE;
        sub O E by OE;
        sub O e by OE;
        sub a e by ae;
        sub o e by oe;
    } rlig;
    </pre><p>
    By looking at other fonts it seems that I would need to define languages somewhere by script, but it’s not clear where you would do that (<em>ccmp</em> table?).</p>
