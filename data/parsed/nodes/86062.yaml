      <p>I believe, that as designers, we are committed to market a good, thoughtful products. Not for the same input, but in order to - hopefully - improve the quality of our common life. The same principle, I think, also relates to any ideologies that we - sometimes unintentionally- redistribute.<br>
      I've got used to that, for most people, we - the ones dealing with and interested in typography - are harmless idiots, and the things that we do are worth the garbage.<br>
      That's unfair from our perspective. But I can understand, that from "their" point of view, replacing "us" with a crap, is a step in the business side to understand.<br>
      Now, let's turn the situation inside-out and see what's wrong with descripting "socialist issue" as something crappy.<br>
      If we write that a font is "socialist" as long as it's not too well made, or that it will be clumsy font merely copied from a "capitalist" product, then we spread the unjust and false belief.<br>
      Unjust: at first to those people of a good will, tortured and murdered, who insisted to us without knowing us, the rights obvious to us right now.<br>
      False: because one can give numerous conterexamples, like fonts included once with the graphics program by a Canadian company, that were also stolen and badly executed - and yet by the capitalist hands. If we say, that "socialist" is something poorly made, then after having a look at the lists of top ten richest, most innovative and most developed countries, we'll find a bunch of countries with very strong social sector there. Let's be objective.<br>
      In fact, this is not the ownership of the means of production depends on the quality of products. Spiekermann's work for the German government isn't executed worse than the work for VW, which is a private company. (And Mr Spiekermann once said, that he prefers to see his fonts stolen but well used, than bought and missused. The message is clear, and far above the copyright discussion).</p>
      <p>Probably even if we are those, who should "inform" people, "help them to understand", in cases of dealing with such broad and unsharp abstractions like capitalism or socialism or whatever else ideology, we just need a cliche to communicate...</p>
