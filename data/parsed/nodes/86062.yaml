      <p><em>And I've heard that Soros' giving Xerox machines to Eastern Europe did play a role in the fall of regimes, though I don't know how true that is.</em></p>
      <p>Xerocopy and copy shops appeared in the early 90s, after the transfer of power (at least here). From what I remember and from what I saw during selecting materials for an exhibition about the "Second Circuit", until 1989, underground publications were printed using the strangest technologies (from PVC carving to computer lineprinters), but certainly were not reproduced on Xerox machines.</p>
      <p>More information <a class="freelinking external link-external" href="http://translate.google.pl/translate?sl=pl&amp;tl=en&amp;js=n&amp;prev=_t&amp;hl=pl&amp;ie=UTF-8&amp;layout=2&amp;eotf=1&amp;u=http%3A%2F%2Fpl.wikipedia.org%2Fwiki%2FWydawnictwo_podziemne" rel="nofollow">here</a> (automatic translation).</p>
      <p>PS: Paradoxally, some of samizdats were generated thanks to the state Institute of Literary Studies in Warsaw. I was told in ILS, that they used to press the counterintelligence and the security service to get the censored and confiscated publications, because the ILS's goal were research and studies on Polish literature, no matter of what source. And as you can imagine, "each secret hole has it's secret mole":-)</p>
