      <p>There are several typefaces available today that were designed at Typo Art in the former East Germany. These typefaces were mostly for books, and they did try to instil them with "socialist" ideas. For instance, the types shouldn't to too showy, or take up too much space. In other words, they should allow for easy-to-read, economic setting. Look for Karl-Heinz Lange's typefaces at PrimeType, or Lapture at JustAnotherFoundry.com. Lapture is Tim Ahrens's revival of Albert Kapr's Leipziger-Antiqua. Maxima, from Gerd Wunderlich, is sort of experiencing something of a comeback in Berlin and Leipzig, I hear. You can get a digitisation of the fonts from URW.</p>
      <p>Search around for a a few more! Also for the Grafotechnica typefaces from the former Czechoslovakia. Some Czechoslovak typefaces from the communist era have also been revived, like Tim revived Leipziger Antiqua into Lapture.</p>
    html_clean: |-
      <p>There are several typefaces available today that were designed at Typo Art in the former East Germany. These typefaces were mostly for books, and they did try to instil them with "socialist" ideas. For instance, the types shouldn't to too showy, or take up too much space. In other words, they should allow for easy-to-read, economic setting. Look for Karl-Heinz Lange's typefaces at PrimeType, or Lapture at JustAnotherFoundry.com. Lapture is Tim Ahrens's revival of Albert Kapr's Leipziger-Antiqua. Maxima, from Gerd Wunderlich, is sort of experiencing something of a comeback in Berlin and Leipzig, I hear. You can get a digitisation of the fonts from URW.</p>
