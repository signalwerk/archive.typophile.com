    html: |-
      <p>Nick: <em>But with regard to type, as I understand it, creative type design ceased during the Soviet regime, because types were considered to be capitalist tools of consumerism.</em></p>
      <p>My understanding is a bit different, based on Maxim Zhukov's account and on the contents of the '<a href="http://www.alib.ru/bs.php4?uid=6139b9f31c25adbf31e973598ecc2e1ed91" rel="nofollow">big grey book of Soviet typography</a>'. Creative type design flourished: what did not was manufacturing of type and technological innovation. Foreign technology was suspect and importation strictly controlled (ironically, at the same time as export <em>to</em> the Soviet Union was limited and controlled from the outside). Hence, most of the people we would identify as type designers worked as 'lettering artists', and much display 'type' was rendered by hand and photographically reproduced.</p>
