      <p>Things are very complicated. As we are designers, our task is (at least trying) to create better solutions. So we should be conscious of broad complexity of certain problems.</p>
      <p>First, let's notice, that speaking in language of economy, the systems installed in the countries of the Eastern Block were nothing else than a variety of capitalism, called the state capitalism. (Yoy can agree or disagree, but the above statement isn't important). That slowly lead the economy to ruin, and was - as long as possible - maintained by violence. However there is no denying that these countries maintained some elements of socialism, like free education, healthcare, social security, space planning, etc.</p>
      <p>These so-called "achievements of socialism" are not obvious, however. Particularly looking at the example of Germany, where after the unification, some solutions were found to be quiet compatible. In contrast to East Germany, Poland found itself in a difficult geopolitical situation, with the advent of market economy, and today we are dealing with a deliberate and progressive destruction of those (after all-) achievements.</p>
      <p>This generates some kind of nostalgy, which is very similar in forms to German Ostalgie. Probably we all miss those anchors of a lucky childhood: symbols of little stability, small prosperity, safety. And probably we don't really miss socialism at all, but just elements of well designed past. I don't care if athors, illustrators and typesetters of my fairytales were socialists. I saved the books, and me and my son use them with joy now, because they have been damn good, despite of poor technologies.</p>
      <p>I belive, that the connotations of the idea of socialism can be achieved in typography, only through appropriate, wisely balanced context. If we're fascinated by lettering of propaganda posters, we must be aware that behind the appropriation of avant-garde aesthetics stood the terror apparatus.<br>
      If, however, the applied arts of one of the former socialist countries inspire us, remember that it is one of the local varieties of modernism (or whatever else) - and as such will not be properly read everywhere.<br>
      The Cyrillic-like games aren't only cliché, but have literally nothing to do with our memories, nor with the topic.</p>
      <p>I cannot point any typeface and any formal solution, which could be regarded as "socialist", without knowing a purpose. I can only write, that (both times for NGO's) once I used Chaparral to say "we are here and we demand respecting rights" (and it worked), and Museo to say "something is going to change" (and nothing have changed).</p>
