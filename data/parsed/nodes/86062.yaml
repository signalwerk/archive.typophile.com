      <p>Oh, Andreas, I disagree! The people who made these typefaces thought that they were putting socialist features in the typefaces. They said that they were doing this, and they wrote it down. They wanted people to know what they were doing, why they were doing it … and they wanted to be viewed in a certain light. So, if one is looking for a "socialist" typeface, one could consider designers' intent as a possible factor in the selection process. Otherwise, I don't see how you get away from the kind of clichés that shessler is trying to avoid.</p>
      <p>As for a "left wing" typeface, I have no idea what could make a typeface left wing. Although, the suggestion to look at what left-wing politicians use in the campaign graphics and literature could be interesting. I doubt much, though, that typeface-choice is that clear cut. I think that, in most republics, the left and the right wings of a political system probably use the same basic pool of typefaces.</p>
