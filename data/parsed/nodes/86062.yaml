      <p>There have been very few new typefaces designed in the USSR between 1917 and late 1980s. Older designs developed mostly by German-Russian type foundries were used for decades. They were endlessly recycled and repurposed, and adapted for the new typesetting technologies: linecasting, photocomposition, <a href="http://paratype.com/pstore/fonts/Literaturnaya.htm" rel="nofollow">digital</a>. I have no exact numbers (I wonder if they exist) but it feels like, say, 75 per cent of Soviet print was set in Romana-like <a href="http://vsegost.com/Data/266/26664/3.gif" rel="nofollow">Latinskii</a>, a.k.a. <a href="http://en.wikipedia.org/wiki/Literaturnaya" rel="nofollow">Literaturnaya</a> [<em>garnitura</em>].</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1901_Berthold_Latinskii_6317.gif"></div><p></p>
      <dl>
      <dt><a href="http://www.thejournalist.org.uk/JanFeb09/L_design.html" rel="nofollow">Allen Hutt</a>, the renowned British expert in newspaper typography, a communist, and a frequent visitor to Moscow, who probably shared the values and the ideals of “British Typographical Revival”, felt so offended by the ubiquity of Literaturnaya in Soviet print of the 1960s that he wrote:</dt>
      </dl>
      <dl>
      <dt></dt>
      </dl>
      <dd><em>The survival of this De Vinne-style type, from the worst design period of old Imperial Germany, in the premier Socialist country in the latter part of the twentieth century, is a typographical phenomenon as unique as it is deplorable</em>. (Hutt A. “A revolution in Russian typography”. In.: “The Penrose Survey“. <em>The Penrose Annual</em>, Vol. 61. Herbert Spencer, ed. London: Lund, Humphries &amp; Cº., 1968.)</dd>

      <dl>
      <dt></dt>
      </dl>
      <p>This is why, to a considerable degree, Latinskii/Literaturnaya may be regarded at the very least as a first runner-up to the crown of “The Soviet Socialist Type of the Century”.</p>
      <p>Another likely candidate could easily be the type used in the first line of this broadsheet:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pravda_Type_5182.gif"></div><br>
      <dl>
      <dt></dt>
      </dl>
      <p></p><p>This typeface must have been initially used for the iconic nameplate of <a href="http://freetop.ru/img/92/8593b1.jpg" rel="nofollow"><em>Pravda</em></a>, the organ of the Central Committee of the Communist Party of the Soviet Union. The same typeface was used in the dozens of ‘lesser <em>Pravdas</em>’: <a href="http://bialczynski.files.wordpress.com/2009/08/pr-pionerskaja-pravda_06-03-1953_1.jpg" rel="nofollow"><em>Pionerskaya Pravda</em></a>, <a href="http://www.videomax.ru/forum/uploads/8244/pravda.jpg" rel="nofollow"><em>Komsomolskaya Pravda</em></a>, <a href="http://s57.radikal.ru/i157/0811/e6/2e504f9e281b.jpg" rel="nofollow"><em>Pravda Vostoka</em></a>, <a href="http://www.ruslania.com/pictures/big/882.jpg" rel="nofollow"><em>Vostochno-Sibirskaya Pravda</em></a><a href="http://ay.by/data/img/50/004/487/788/lt/0_650_Razeta_Minskaya_Pravda_za_11_kastrichnika_1967g__foto__5000_rub_3319253.jpg" rel="nofollow">, <em>Minskaya Pravda</em></a>, <a href="http://all-gazettes.narod.ru/ru.files/39/2.jpg" rel="nofollow"><em>Kaliningradskaya Pravda</em></a>, etc. </p>
      <p><a href="http://f8.ifotki.info/org/eafccafa198db2ab0b4d2b6d7ab70fd42e8ad485249463.jpg" rel="nofollow"><em>Izvestiya</em></a>, the second-largest daily of the USSR, also had a title piece in the Art Nouveau style…</p>
      <p>Come to think of it, in this part of the world, not only in Russia, the Art Nouveau typefaces were often used for the nameplates of newspapers, not necessarily Socialist: e.g., <a href="http://www.vladimirnedeljkovic.com/press/clanci/politika%2011%2006%202006%20naslovna.jpg" rel="nofollow"><em>Politika</em></a>, <a href="http://www.savonsanomat.fi/multimedia/dynamic/00075/Hesari_75298c.jpg" rel="nofollow"><em>Helsingin Sanomat</em></a>, <a href="http://upload.wikimedia.org/wikipedia/commons/9/9c/Prvn%C3%AD_č%C3%ADslo_RP.gif" rel="nofollow"><em>Rudé Právo</em></a>, <a href="http://upload.wikimedia.org/wikipedia/commons/c/cb/Robotnik_28.10.1931.jpg" rel="nofollow"><em>Robotnik</em></a>.</p>
    html_clean: |-
