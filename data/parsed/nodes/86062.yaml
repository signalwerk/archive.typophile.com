      <p>Come to think of it, in this part of the world, not only in Russia, the Art Nouveau typefaces were often used for the nameplates of newspapers, not necessarily Socialist: e.g., <a href="http://www.vladimirnedeljkovic.com/press/clanci/politika%2011%2006%202006%20naslovna.jpg" rel="nofollow" class="link-external"><em>Politika</em></a>, <a href="http://www.savonsanomat.fi/multimedia/dynamic/00075/Hesari_75298c.jpg" rel="nofollow" class="link-external"><em>Helsingin Sanomat</em></a>, <a href="http://upload.wikimedia.org/wikipedia/commons/9/9c/Prvn%C3%AD_č%C3%ADslo_RP.gif" rel="nofollow" class="link-external"><em>Rudé Právo</em></a>, <a href="http://upload.wikimedia.org/wikipedia/commons/c/cb/Robotnik_28.10.1931.jpg" rel="nofollow" class="link-external"><em>Robotnik</em></a>.</p>
