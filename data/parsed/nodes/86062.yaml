      <p>My late Uncle J. Ben Lieberman, who was a printing fanatic and incredibly energetic and industrious, was active in the private press movement. He had done his PhD on freedom of the press, and was fond of saying that freedom of the press meant in the first place the freedom to own a press. He started the American Printing History Association, wrote the books <em>Types of Typefaces</em> and <em>Printing as a Hobby</em>, printed the preliminary edition of Mac MacGrew's American Metal Typefaces, and on and on. He was really tireless. </p>
      <p>One of his less terrific ideas was a hobby printing press for children, something like the box above. Except it could use real metal type and printer's ink. However, it didn't ever work that well, alas. </p>
      <p>A few years ago I saw a demonstration of the <a class="freelinking external" href="http://www.completek-12.com/Ellison-Die-Cut-Videos-s/4448.htm" rel="nofollow">Ellison</a> die cutting machine, and saw it as a version of Lieberman's idea that actually works well. It does paper cut-outs beautifully, and a lot of elementary schools have them. I told the lady that they should adapt it as a press for the kids to do printing on, but I don't think they have done anything. Their set up would work as a small printing press, as the both roller and press styles develop a lot of pressure. I also told them they *had* to do dies of Century Schoolbook as one of their cut-out fonts. They had others, not as good. Don't know whether they adopted that idea.</p>
