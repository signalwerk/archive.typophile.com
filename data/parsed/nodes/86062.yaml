    html: <p>Nick, Soviet designers had no direct access to any typesetting equipment. You had to have a special security clearance for that; compositors did, not designers. The VGC PhotoTypositor never made it to Soviet Union; my first time seeing, and operating it was in New York, in 1977. In Moscow there were very few Berthold-built Diatypes, and I am not sure if any Staromats and Starsettographs were used—not by the designers, that’s for sure. Like Marcin wrote, it was all about control… Come on, even the typewriters were all registered, and their font samples kept on file. The only photolettering device I knew of, and used (for a modest bribe), in mid-1970s belonged to Mosfilm, the largest film studio in the country.</p>
