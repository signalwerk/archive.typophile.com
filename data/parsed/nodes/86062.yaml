    <p>A tricky one, perhaps: What features would be regarded as "socialist" or "left-wing" in a typeface? </p>
    <p>I am here looking beyond the cliché of old russian revolutionary posters with condensed sans-serifs and cryllic-inspired features. Are there any contemporary typefaces made today that would be regarded socialist?</p>
