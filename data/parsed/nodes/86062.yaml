    html: <p>By the way, Lieberman would have been totally delighted with desktop publishing, as his passion was for widespread ownership of the ability of people to print. Incidentally this is the opposite of socialist as far as printing goes. He thought it was crucial to have widespread private ownership of printing, and not to have it all in the hands of the government, as in the Soviet Union. And I've heard that Soros' giving Xerox machines to Eastern Europe did play a role in the fall of regimes, though I don't know how true that is. In a way the internet has taken this same idea further, as everyone can now publish worldwide, electronically. And it has had a huge social impact, not least in the Arab spring.</p>
