    <p>Hi all, </p>
    <p>First post, but been a reader for a long time.</p>
    <p>I’m updating a client’s logo and ran into a snag.  The logotype basically hasn’t changed since 1975, we just updated the bug. However, the owner of this company just through a curve-ball and asked the we replace the ” curved y” with a “normal slanted y”.</p>
    <p>Of course this drove me nuts, I thought their original styling was good, why mess with it? Especially at this point - we’ve already jumped into laying out new web and print materials.  Anyway, I re-created the y, but it just doesn’t look right to me. Also, is the kerning OK? I was considering doing this and a “small” version with more character spacing. </p>
    <p></p><div class="imageWrap"><img src="/web/20080907003717im_/http://www.typophile.com/files/KellyPipe_1_5255.png"></div><p></p>
    <p>I’m a graphic designer - just picking up what little I know about type here and in magazines / tutorials. I have thick skin though, so fire away. Any and all suggestions for the “y” as well as the rest of the type and logo would be appreciated.</p>
    <p>Thanks for your input!</p>
    <p>Daniel Peterson<br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080907003717/http://artesiandesigngroup.com/">Artesian Design Group</a></p>
