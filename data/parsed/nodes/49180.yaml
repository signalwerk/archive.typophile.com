      <p>Olympic protest: Illegible and weak, what exactly are you protesting? The Olympics? The Beijing Olympics? "Death" - wow, a five-letter word, well done, shame it is unreadable and once read (having issued a second image to try to make it a bit clearer) it means nothing at all - how about "money", "China", "Tibet"?<br>
      It seems you have somehow attached yourself to some flimsy passing bandwagon, without  understanding what you are protesting, then produced some weak, and frankly ugly, waste-of-pixels which lacks any wit or intelligent visual argument. May I suggest you have a look at Jonathan Barnbrook and Marcus Leis Allion's Olympics pictogram font <a class="freelinking external" href="http://www.myfonts.com/fonts/virusfonts/olympukes/" rel="nofollow">Olympukes</a>.<br>
      I apologise for this fairly harsh criticism of your creative work, however I find pseudo-protest graphics extremely irritating. By all means protest, protest, protest - share your thoughts and ideas with the world graphically, but please, try to do it with skill, wit and elegance. </p>
      <p>Typerighter.</p>
