    html: <p>The turtle idea is interesting -- I immediately thought of the tortoise vs. hare story, and how applicable that analogy is in light of the recent banking crises. But the old-age link is great as well. I would not, however, get the idea of tortoise from the abstracted shapes in 1d-f if you hadn't mentioned it in your description. This is a concept where you're already asking the viewer to get the idea of what the tortoise represents, so I would maybe make the visual representation of that tortoise as literal as possible. An old engraving might be one option -- something that communicates "we've been here a long time," like the Wells-Fargo horse-drawn carriage.</p>
