      <p>Thank for your feedback FeeltheKern. I'm working on a engraving style one but I'm hesitant to make it look too dated (faux engravings often remind me of the clip art revival of the 90s by Charles Anderson and etc..) </p>
      <p>And  to answer your question designpuck, I chose those colors, because their friendly, familiar, and bright. Or probably because Paul Rand used them often to make his overlays (as noted in his book Design, Form, and Chaos) and I was just reading it. To me the overlay implies a growth (which you want in a bank), a multiplying effect.</p>
      <p>Another reason overlays are popular is because they are efficient? They often create new colors. I need to think more about this...  </p>
      <p>Again thank you! I will continue working and post updates.</p>
