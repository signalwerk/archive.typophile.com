      <p>Overlays seem to be au courant (thanks perhaps to work like <a class="freelinking external" href="http://pentagram.com/en/new/2008/12/new-work-truvia.php" rel="nofollow">Paula Scher's "Truvia" logotype</a>) (Why those particular colors in the A1 sample plus another overlay color?)</p>
      <p>Speaking of Scher, it seems banks (and many other institutions) love to use the "thick-typeface-word-then-thin-typeface" bit as a visual word separator. I recalled noticing she used that with her Citi-stuff (citibank, citifinancies, cititravelers, etc.) <a class="freelinking external" href="http://logodesignerblog.com/wp-content/uploads/2009/02/citibank.jpg" rel="nofollow"> Scher's Thick-first-word, thin-second-word logotype</a>  </p>
