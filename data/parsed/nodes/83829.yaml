      <p>Werner,</p>
      <p>I'm not sure what makes FontValidator choke. The rasterizing test is very slow, several seconds per size as opposed to about half a second on "normal" fonts. In the end, FontValidator gets unresponsive and the results are never displayed.</p>
      <p>Hm, just now I saw that the resulting validator XML file is 160 MB in size, that might explain the slowness ;)</p>
      <p>When I open the XML file with a text editor, I see that most of the errors are indeed "E6049 Twilight zone point not set" and a lot of warnings "W6008 Value for count is less than 1. Function will not be called".</p>
      <p>What's odd is that also ttx (from the fontTools Python module) seems to have problems with decompiling the instruction code. Not on all fonts I tested, but on most:</p>
      <p><code><br>
      An exception occurred during the decompilation of the 'glyf' table<br>
      Dumping 'glyf' table...<br>
      Traceback (most recent call last):<br>
        File "C:\Python24\Lib\site-packages\fontTools\ttx.py", line 289, in main<br>
          process(jobs, options)<br>
        File "C:\Python24\Lib\site-packages\fontTools\ttx.py", line 274, in process<br>
          action(input, output, options)<br>
        File "C:\Python24\Lib\site-packages\fontTools\ttx.py", line 171, in ttDump<br>
          disassembleInstructions=options.disassembleInstructions)<br>
        File "C:\Python24\lib\site-packages\fontTools\ttLib\__init__.py", line 267, in saveXML<br>
          self._tableToXML(tableWriter, tag, progress)<br>
        File "C:\Python24\lib\site-packages\fontTools\ttLib\__init__.py", line 301, in _tableToXML<br>
          table.toXML(writer, self, progress)<br>
      TypeError: toXML() takes exactly 3 arguments (4 given)<br>
      </code></p>
