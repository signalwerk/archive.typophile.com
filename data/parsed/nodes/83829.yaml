      <p>Jasper,</p>
      <p>if you have the Apple Developer Tools installed:</p>
      <p>In Terminal.app, the command sequence is (press enter after each line):</p>
      <p><code>cd Downloads/freetype-2.4.5<br>
      ./configure<br>
      make<br>
      sudo make install<br>
      </code></p>
      <p>You also need the folder for ttfautohint-0.2, it's a separate download. The commands to build and install are the same.</p>
      <p>Then you can run ttfautohint from the command line:</p>
      <p><code>/usr/local/bin/ttfautohint</code></p>
