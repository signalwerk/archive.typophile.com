    html: <p>Mike, what we typically did when 'auto-hinting' fonts for greyscale was to apply x stem hints but still set the gasp table to apply smoothing at all sizes. The stem hints improved the density of the vertical strokes, especially in lighter types. Yes, this can introduce spacing issues, but those are relatively easy to deal with, and the gain in stroke density and hence text contrast is worth it.</p>
