      <p>&gt;"If an experienced hinter needs 80 hours per font I need some more experience."</p>
      <p>80 hours, for what kind of hinting? I'm not certain that's what I'd spend, even on an aliased font. Antialiased hinting takes less time per glyph and fewer glyphs need the kind of details to be hinted versus aliased hinting. 40 seems more like a reasonable estimate for hinting 79-80 antialiased glyphs without too much fuss beyond that count on adjacentcy issues. This also assumes some help from one or another of the auto hinters.</p>
      <p>On the bright side, if you are spending 80 hours on any kind of hinting, you are getting more experience. And assuming that 60 of those 80 are getting you more experience than you need, then the next job will come to an early conclusion, perhaps.</p>
