    html: |-
      <p>Note that I suggested that spacing issues may need to be dealt with, but that this is typically fairly easy to deal with by adding some manual hints, and only at some very small sizes or for particular glyphs.</p>
      <p>Here's a comparison of autohinting results for an all-caps fonts I am working on at the moment (note that this will not, eventually, be autohinted; these are just tests for this thread). Although it is an all-caps design it is not intended for display work: its for publishing the diplomatics of Byzantine lead seals. I don't consider the XP rendering acceptable, but I do think the addition of x direction hints provides for better stroke consistency at some key reading sizes. As you see, there are spacing problems for some glyphs and for most at the smallest size, but I'm not sure I prefer the trade-off with fuzzier stems in the version without x-hints.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AR-GSxy_3762.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/AR-GSy_5576.png"></div><p></p>
      <p>And for comparison, here is the same font with the x and y autohints with ClearType turned on.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AR-CT_6743.png"></div><p></p>
      <p>Much depends, I think you'll agree, on the individual typeface design: how light/heavy it is and how it has been spaced.</p>
      <p>[It would be nice if the gasp table enabled one to apply or not apply x and y instructions independently. Looking at those screenshots, there are sizes at which I think the version with x hints is working better and sizes at which that with only y hints is working better.]</p>
