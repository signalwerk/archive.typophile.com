      <p>Sorry for the late reply, Vernon. I've not had a chance to read this whole thread, but in response to your query re. my comment on the hinting quality of your initial test fonts, let me clarify:</p>
      <p>I think the manually hinted Droid Serif looks best of the specimens (excepting in the smallest three sizes, which I'm assuming are below the sizes spec'd for hinting), and best in both GDI and DWrite rendering. But it was misleading for me to describe this quality in terms of 'well hinted' relative to the other test fonts, because a significant factor in this quality in addition to hinting is probably in the nature of the outlines and spacing, which enable Droid Serif to perform better, especially under DWrite, than the other fonts, including the well-hinted Ubuntu font, at the text sizes: there is less fuzzing of vertical stems in Droid Serif, and better stroke density.</p>
