      <p>as John mentions the approach will depend on the weight and style and intended use of the font, but if there is enought weight, results can be *'ok' using just ydirection hinting for greyscale. see this quick example of Georgia, 11 point, top unhinted greyscale, bottom y-hinting only. </p>
