      <p>&gt;They aren't locked to anything but themselves.</p>
      <p>ohhhhhh. so... I hope you are instructing from the first point (which I also recommend you instruct no be rounded), to the second stem – you are doing a TT MDRP instruction with the booleans set thus:<br>
      (mrMBl)<br>
      m = not moving reference<br>
      r = Not rounding!<br>
      M = using the minimum distance value (default is 64/64ths of pixel), which keeps it 1 px at smaller end of range), and you can tinker with!:)<br>
      Bl = an instruction on a black feature (stem)</p>
      <p>So, the only instruction of TT that's taking effect, (and I think this instruction is not going to work on Windows anyway), is the the minimum distance as qualified above.)</p>
      <p>There is a lot more could be done, but unless you are hinting for aliased rendering at the smaller sizes in Freetype, or willing to trus MS who says if you spend a million hours you can perfect fonts with CT rendering), x hints on italics are seriously problematic to the point of "why?"</p>
