    <p>I have upped a few screenshots from fonts auto-instructed with Werner Lemberg's very latest 'ttfautohint' tool.<br>
    It's still in development but it's covering ground very fast. ttfautohint instructs a Truetype font for web use in a matter of seconds. </p>
    <p>for some screenshots comparing original hinted fonts with versions auto-instructed with ttfautohint, see - <a href="http://code.newtypography.co.uk/" title="http://code.newtypography.co.uk/">http://code.newtypography.co.uk/</a></p>
    <p><img src="https://lh6.googleusercontent.com/-4R7AgNeEPTg/TiHBZ6iRl_I/AAAAAAAAAgs/7Dja9FkLzCo/1310835046630.png"></p>
