    html: |-
      <p>@Jens: There are three issues:</p>
      <ul>
      <li>ttfautohint 0.1 indeed produced invalid bytecode.  This has been fixed in release 0.2, uploaded a few hours ago (it may take 24 hours until it gets distributed to all mirrors).</li>
      <li>FontValidate reports some trivial errors, caused by the fact that the freely downloadable version is too old (from 2003!).  For examplę it doesn't understand `gasp' table version&nbsp;1.  Probably related to this are checksum errors which are not important either.</li>
      <li>Far more serious is that FontValidate reports zillions of<br>
      <blockquote><p>
        E6049  Twilight zone point not set</p></blockquote>
      <p>errors which are incorrect, according to my interpretation of the OpenType specification.</p>
      <p>According to the `instgly.doc' file (part of the specification), page 164, chapter `Points', section `Zones':</p>
      <p><cite>The profile table establishes the maximum number of twilight points. These are numbers 0 through maxTwilightPoints-1 and are all set to the origin. These points can be moved in the same manner as any of the points in zone&nbsp;1.</cite></p>
      <p>This essentially means that <strong>all</strong> twilight points are set to (0,0) as soon as I start to execute the bytecode of a glyph (and no point is not set)!  Obviously, either FontValidator or the documentation is incorrect...  Compare this to the values in the storage area, where the specification explicitly mentions that access to unassigned values is undefined.</p></li>
      </ul>
      <p>I would be glad if anybody here can give more details...</p>
