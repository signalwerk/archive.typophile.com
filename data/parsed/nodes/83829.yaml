      <p>Werner, GDI ClearType is not used by default on Win XP. The default rendering in Win XP is 'Standard' (bi-level and greyscale as determined by font gasp table settings), and ClearType had to be turned on manually (the exception was some hardware manufacturers with XP OEM licenses, who chose to turn on ClearType by default, but this was not Microsoft's default for that OS).</p>
      <p>What Frode is showing is XP greyscale rendering, which really suffers without x-direction stem links.</p>
