    <p>good evening, i'm new to this forum.</p>
    <p>i have a bunch of chinese traditional and simplified fonts given to me by a designer while i was with my ex-company and i didn't install them till now. i am on windows xp and have adobe illustrator/photoshop cs4 as well as microsoft office programs. both chinese traditional and simplified fonts appears on microsoft office programs but on adobe illustrator/photoshop, only the simplified versions are showing.</p>
    <p>the characters i want to use is showing on other original fonts already in the pc. i have tried googling for help but it seems futile.</p>
    <p>i have uploaded a font that i would really like to use [linked removed by the moderator].</p>
    <p>please help if you can! thank you very much!</p>
    <p>kimberly</p>
