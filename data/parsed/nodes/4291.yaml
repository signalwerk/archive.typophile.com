    html: "<p>As a matter of fact, I do know. It's an old photo display font called Caslon Black Italic: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/33508.gif\" alt=\"caslonblackitalic\"> <br> <br>I suspect that whoever did it scanned it from an old specimen book and redrew the characters as needed. I doubt very much that it's available as a digital font.</p>"
