  - id: 31808
    user: 1043
    date: 2004-04-14T13:34:00
    date_raw: 14 Apr 2004 — 1:34pm
    votes: null
    html: <p>The sample I scanned is from a type specimen book issued by Beissel Inc., a St. Paul, Minnesota typesetting house, probably from the early eighties, but there's no date on it.  <br> <br>Also, no information on the source of the font. The letter in the codes in the upper right refers to the source(s) of the font, but I only know the meaning of a few of them (AI=Alphabet Innovations, TS=TypeSpectra, OR=Visual Graphics Corporation...). No idea what C or R stand for.  <br> <br>By the way, if anyone does know about these codes, I'm trying to track down the meaning of "LI".</p>
