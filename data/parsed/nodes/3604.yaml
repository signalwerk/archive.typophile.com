    html: <p>The roman font appears to be Carolus, an older phototype display face. There doesn't appear to be a commercial version of it available in digital format, but if you Google "carolus font" you will find links to various free versions.</p>
    html_clean: <p>The roman font appears to be Carolus, an older phototype display face. There doesn't appear to be a commercial version of it available in digital format, but if you Google "carolus font" you will find links to various free versions.</p>
  - id: 27639
    user: 2088
    date: 2004-03-15T12:12:00
    date_raw: 15 Mar 2004 — 12:12pm
    votes: null
    html: <p>Carolus Roman (credited to Oldstyle) was one of the fonts on the old Image Club Letterpress CD's up through version 6.0 (before Adobe acquired them). I wouldn't be surprised if the 'free' versions around originated there. Agfa, who now owns Image Club's collection, no longer includes Carolus Roman in the Image Club fonts.</p>
