    html: |-
      <p>As you said, I'm also convinced it's (heavily) customized or even totally created from scratch, almost everything done with the same rectangle, differently slanted from /E to /N or with the same right oblique part of /A: /M done with 2 /A, /E is "only" 4 strokes, /V  with a 180° rotated /A.... You could also do the same with any contrasted font, some kind of "Didot Sans Stencil"<br>
      For the easy way, I would go with <a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/vanitas-stencil/" rel="nofollow">Vanitas Stencil</a>.</p>
