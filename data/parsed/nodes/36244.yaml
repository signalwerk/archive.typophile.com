  html: |-
    <p>Just thought UK typophiles might like to know about the letter carving<br>
    workshops run by the Memorial Arts Charity. I completed one of the five day<br>
    courses in London recently. It was well run and informative and I want<br>
    to support them by recommending them to anyone interested in such pursuits. </p>
    <p><a href="http://www.memorialartscharity.org.uk/" title="http://www.memorialartscharity.org.uk/">http://www.memorialartscharity.org.uk/</a></p>
    <p>I came away from the course with a new perspective and enthusiasm<br>
    for letter carving, an idea for a new typeface, and some nice,<br>
    albeit slightly wobbly, letters to put on the mantelpiece.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lettercarve_3414.jpg"></div><p></p>
