  - id: 26639
    user: 2011
    date: 2003-07-12T11:18:00
    date_raw: 12.Jul.2003 11.18am
    votes: null
    html: <p>Fond memories. I also had Yuri's Font Designer v.1... <br> <br>Last time I used Font Designer in earnest was to digitise an 'Italian' type of 1821, a really delightful exercise in geometry in which the designer had reversed the thicks and things of a Fat Face design; I've also used it for another font in which rigorous geometry was important, a version of Edward Johnston's Underground type. Neither of these fonts have been commercially released, by the way. <br> <br>Font Designer 1.1 has a beautifully intuitive way of constructing an outline, a way of storing serifs, stems etc in a library, and good options for drawing guidelines. It's also - and this I think is why it continues to appeal to me - got a totally understated interface. The screen is uncluttered, and there's very little getting between me and the character I'm working on. In that respect it's not unlike Aldus PageMaker 5. Technically I shouldn't imagine that FD 1.1 now has anything going for it that Fontlab doesn't have in spadefulls, but that hasn't stopped me dusting it down recently for a new project I'm working on. I'll probably use it as my drawing tool, generate a Type 1, and then pull that into Fontlab. <br> <br>The program itself has a hardware dongle, but I do have a demo which I'd imagine could legally be sent to anyone who asks. <br> <br>Incidentally, does anyone have unwanted copies (software + original manuals, preferably with packaging!) for these and similar programs? I'm Curator of the Type Museum, London, and recognise that this is an area we should start collecting seriously - the museum already has unrivalled collections of punches, matrixes and hot-metal equipment. Anyone willing to donate their obsolete software, please contact me off-list (<a href="mailto:jh@typemuseum.org">jh@typemuseum.org</a>). </p>
