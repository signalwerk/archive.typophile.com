    date_raw: 20.Aug.2003 10.23am
    votes: null
    html: "<p>Today the Dutch Type Library released version 2 of DTL FontMaster. The release includes free light versions of four of the modules. The light versions of Bezier- and IkarusMaster are fully functional and only have one restriction: not more than 256 glyphs can be stored per database. With the light version of DataMaster it is possible to generate PostScript Type 1 fonts for Mac OS (only with the Mac edition) and Windows. The light version of ContourMaster makes a complete testing of font databases possible, which results in a listing (automatically improving is not enabled). However, the improver functions of Bezier- and IkarusMaster can be used on character level to make the necessary corrections.</p>"
    html_clean: "<p>Today the Dutch Type Library released version 2 of DTL FontMaster. The release includes free light versions of four of the modules. The light versions of Bezier- and IkarusMaster are fully functional and only have one restriction: not more than 256 glyphs can be stored per database. With the light version of DataMaster it is possible to generate PostScript Type 1 fonts for Mac OS (only with the Mac edition) and Windows. The light version of ContourMaster makes a complete testing of font databases possible, which results in a listing (automatically improving is not enabled). However, the improver functions of Bezier- and IkarusMaster can be used on character level to make the necessary corrections.</p>"
