    html: "<p> and here is the result from the swedish jury: <br> <br>core's wish list <br>-i want to work with the font without having to generate the result. because i end up with twenty different font generations and i have to name them differently and change the font ID all the time so they don't collide with each other... that is: i want to drag-drop the font to the font application, work with it and simply hit \"save\", close it and i'm done. and the font should automatically update itself in ATM/suitcase. understand?  <br>-i want a sketchpad layer with some simple drawing tools, 256 colors. <br>-i want the pathfinder functions from illustrator. <br>-i want the possibility to edit the curves and the metrics in the same window. like in the fontographer metrics-window, but also that i can access the bezier curves directly without opening a separate window for that character. <br>-i want an antialias-button (switch on or off). <br>-i want a two meter wide computerscreen on the wall with a touch control, so that i can design my stuff with my hand directly on the screen! and pull and yank the bezier handles with my very fingers! <br> <br>that's it for now! <br>yao <br>martin </p>"
