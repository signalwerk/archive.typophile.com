  - id: 26642
    user: 1688
    date: 2003-08-21T05:57:00
    date_raw: 21.Aug.2003 5.57am
    votes: null
    html: "<p>Anonymous, <br> <br>Thanks for the listing of possible improvements of DTL FontMaster. Although FM already has a lot of functionality which will be probably overlooked by many users, the FontMaster Team is constantly discussing the necessity of new functions. FM was originally produced for internal use at the Dutch Type Library and normally the enhancements of the modules is based on internal needs at DTL. <br> <br>OpenType generation is fully supported by DTL FontMaster, of course. FM was the first program which automated the OTF feature generation. Also the database system was made for handling large glyph sets. With the light version we already made a lot of technology available for free and for many users the functionality will be more than sufficient. The OTF production is, of course, part of the full version. <br> <br>To reply on some of your other suggestions: <br>The standard guidelines are automatically placed based on the information in the Font Header and you can place as many as you like in the V/H Guide Lines section. You can store as many glyphs in a slot as you wish. Coordinates can be edited using the Edit Coordinates window, which shows a full listing of all points. In the Windows version the right button can be used to paste and cut. <br> <br>Internally at DTL there is no real demand for an OS X version, but -as I stated earlier- we will probably produce one, if only to underline our commitment to Mac users. </p>"
    html_clean: "<p>Anonymous, <br> <br>Thanks for the listing of possible improvements of DTL FontMaster. Although FM already has a lot of functionality which will be probably overlooked by many users, the FontMaster Team is constantly discussing the necessity of new functions. FM was originally produced for internal use at the Dutch Type Library and normally the enhancements of the modules is based on internal needs at DTL. <br> <br>OpenType generation is fully supported by DTL FontMaster, of course. FM was the first program which automated the OTF feature generation. Also the database system was made for handling large glyph sets. With the light version we already made a lot of technology available for free and for many users the functionality will be more than sufficient. The OTF production is, of course, part of the full version. <br> <br>To reply on some of your other suggestions: <br>The standard guidelines are automatically placed based on the information in the Font Header and you can place as many as you like in the V/H Guide Lines section. You can store as many glyphs in a slot as you wish. Coordinates can be edited using the Edit Coordinates window, which shows a full listing of all points. In the Windows version the right button can be used to paste and cut. <br> <br>Internally at DTL there is no real demand for an OS X version, but -as I stated earlier- we will probably produce one, if only to underline our commitment to Mac users. </p>"
