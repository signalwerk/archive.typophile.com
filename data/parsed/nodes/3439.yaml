    html: "<p>Font Lab 4.6 has been released today. Anyone care to weigh in on the improvements? AND, if you were to buy an OSX compatible font creation app today, would this be it? Is there anything else available for OSX? Thanks, all! <br> <br>What's new in this version: <br>          <br>Autogeneration of basic OpenType featurs for T1 fonts. <br> <br>Level 2 and Level 3 EPS import/export - Makes it simple to exchange EPS files with the latest versions of Adobe Illustrator. <br> <br>Improved blend algorithm - inserts fewer points; can blend composites and even hints. <br> <br>MM-compatible Type1-&gt;TrueType conversion - speeds up creation of families of TrueType fonts. <br> <br>TrueType hinting of Multiple Master fonts - with correct interpolation of instructions where possible. <br> <br>Better user interface - smart panels in Macintosh version, expandable zoom panel in Windows version. Updated design of properties panel in both versions. </p>"
    html_clean: "<p>Font Lab 4.6 has been released today. Anyone care to weigh in on the improvements? AND, if you were to buy an OSX compatible font creation app today, would this be it? Is there anything else available for OSX? Thanks, all! <br> <br>What's new in this version: <br>          <br>Autogeneration of basic OpenType featurs for T1 fonts. <br> <br>Level 2 and Level 3 EPS import/export - Makes it simple to exchange EPS files with the latest versions of Adobe Illustrator. <br> <br>Improved blend algorithm - inserts fewer points; can blend composites and even hints. <br> <br>MM-compatible Type1-&gt;TrueType conversion - speeds up creation of families of TrueType fonts. <br> <br>TrueType hinting of Multiple Master fonts - with correct interpolation of instructions where possible. <br> <br>Better user interface - smart panels in Macintosh version, expandable zoom panel in Windows version. Updated design of properties panel in both versions. </p>"
