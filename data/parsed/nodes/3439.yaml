    html: '<p>Martin wrote: <i>i want the possibility to edit the curves and the metrics in the same window. like in the fontographer metrics-window, but also that i can access the bezier curves directly without opening a separate window for that character.</i> <br> <br>I suggested something similar a while back on the T-D list. I do most of my design work in Illustrator mainly so I can edit characters in context with other characters. Having to edit characters in isolation has always felt constraining. <br> <br>Since then, I had another idea that might be even better: A plug-in which would allow you to develop a font directly in Illustrator. Even if it was just to get the basic design down (i.e., minus hinting, encoding, etc.) so you could export a font to be finished in FOG or FL or whatever. <br> <br>I picture something similar to the symbol library, but with glyph names listed. Each glyph would be defined in the drawing window by drawing a glyph and a bounding box (to define the ascent, descent, and side bearings), selecting both and choosing "Create Glyph..." from a menu or by dragging them onto a glyph name in the palette. <br> <br>Glyphs could be dragged out of the palette to the drawing area and placed next to each other to form words. Any defined glyph could be edited in place. If the side bearings (of the bounding box) are changed, the characters to the right would move themselves accordingly. It may also be possible to create kerning pairs, etc. <br> <br>The palette would have an "Export Font..." command to export the font at any time for further work in another program (for hinting, special encoding, etc.). <br> <br>I see this as mainly a tool for the design phase, not as a tool for producing finished fonts. All the well-honed tools of Illustrator would be at hand (rather than try to recreated them in FOG or FL or whatever). <br> <br>Existing tools and plug-ins in Illustrator already perform similar specialized functions (the symbol library, the graphing tool, etc.) why not something for creating fonts?</p>'
