    <p>Hi all,</p>
    <p>I am using Ionic (Matthew Carter) Clarendon-esque font for my freelance design company's logotype, and would love it if anyone had any suggestions as what to use as a sans-serif to compliment it?</p>
    <p>Main applications will be stationery, business cards, letterheads, invoice, etc.</p>
    <p>Would appreciate any thoughts!</p>
    <p>Thanks in advance.</p>
