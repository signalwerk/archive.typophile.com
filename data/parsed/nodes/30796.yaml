    <p>I am the associate pastor at the First Presbyterian Church of Ukiah, CA and was brought on to work with youth and families and revitalize the congregation’s aging population. Step #1 was get a website with a reasonable, simple design, and a logo to suit it.</p>
    <p>My first attempt was posted and critiqued here:<br>
    <a href="http://www.typophile.com/node/30295" title="http://www.typophile.com/node/30295">http://www.typophile.com/node/30295</a></p>
    <p>Therefore, you may want to take a minute to look over some of the conversation from before if you are new to it.  Needless to say, "Hire a professional" is a recommendation that I have already considered.</p>
    <p>Here is my second attempt at a church logo.  Here I chose two main images: a cross and a grape vine.  The cross is included for obvious reasons.  The grape vine is both a scriptural allusion (Jesus likens himself to a grape vine, and his followers are the branches who bear fruit), and a reference to the agricultural industry of the area, in which there are a lot of vineyards.</p>
    <p>(Side note: I don't think that one necessarily needs a cross to convey Christianity, but I have had that discussion with my boss and others in the church, and a church logo without a cross is too outside the box right now).</p>
    <p>As I said before, please let me know what you think with frankness and forthrightness. I am not a professional designer, but I am very teachable.</p>
