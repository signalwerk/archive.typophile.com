      <p>I think the clip art effect is caused by the fact that there are too many colours, and too many bright colours. Pick one item you want to stand out (the vine, the grapes, the leaves, the cross) and make the colour of it contrast with the rest. At the moment, all elements are competing for my attention. Also, watch your curves. They're looking lumpy.</p>
      <p>I actually liked the direction of your original logo (from the previous thread) better than the vine, but of course, it's up to you.</p>
