    html: <p>I only have a second, but I generally like it (much, much better than your last attempt). My two suggestions are to work on the curves of the curling top of the grape vine (I assume you're using a vector illustration program like Illustrator or Freehand), as they're a bit abrupt now, not as smooth as they should be, and to get rid of that thick black stroke around everything. You might try putting a white stroke around the grape vine to break apart the cross appropriately, but it may work fine without one.</p>
