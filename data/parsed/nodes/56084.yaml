    html: |-
      <p>First, a plea to keep <a href="http://typographica.org/001157.php">publishers and retailers</a> separate in this discussion. <a href="/wiki/Emigre" class="wiki">Emigre</a> is a publisher, <a href="/wiki/MyFonts" class="wiki">MyFonts</a> is a retailer. <a href="/wiki/FontFont" class="wiki">FontFont</a> is a publisher, <a href="/wiki/FontShop" class="wiki">FontShop</a> is a retailer. </p>
      <p>If Hrant’s question is about publishers (AKA foundries) then there are very few that <em>don’t</em> require exclusivity. There are always exceptions like ITC Franklin (an agreement between two publishers) and Eidetic Neo (a revision of an existing typeface submitted to another foundry).</p>
      <p>If Hrant’s question is about retailers (AKA resellers), there are very few that <em>do</em> require exclusivity. Of course, some, like <a href="/wiki/FontShop" class="wiki">FontShop</a> and <a href="/wiki/Veer" class="wiki">Veer</a> do offer extra promotion or a special contract in exchange for exclusivity.</p>
      <p>Hybrid libraries include <a href="/wiki/T-26" class="wiki">T-26</a> and <a href="/wiki/Umbrella" class="wiki">Umbrella</a> (a <a href="/wiki/Veer" class="wiki">Veer</a> label) which include original fonts but also those that are published by other foundries.</p>
