      <p>A great set of pictures. Thanks for showing!</p>
      <p>Do you know why this is "Photo-Peignot", rather than 'plain'? Specially drawn for the Photo-Lettering house? At a glance, it seems a bit wider than the digital set I have.</p>
      <p>The back cover list sure makes me drool. Must be from childhood memories, as all of these fonts were already deemed 'tacky' when I started typesetting. (Admittedly, it also could be my age.)</p>
