    <p>I got my hands on this book of old Photo-Lettering display faces via interlibrary loan and <a href="http://www.flickr.com/photos/joeclark/sets/72157622456252039/detail/" title="Photo-Lettering ‘Alphabet Thesaurus Vol. 3’" rel="nofollow">posted some scans</a>.</p>
    <p>And yes, House Industries fans, <a href="http://www.houseind.com/t/e3d290" title="Example at HouseInd.com" rel="nofollow">Ed Benguiat’s newlock and interlock fonts</a> very much <a href="http://www.flickr.com/photos/joeclark/4009389057/in/set-72157622456252039/" title="One example from the book" rel="nofollow">are in there</a>. West Doofus Casual FTW.</p>
