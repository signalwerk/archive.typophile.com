      <p>Theunis, the settings with designations ending in <cite>n</cite> are normal-width. There are condensed and expanded widths in most settings. If you look just at the <cite>n</cite> width, does it seem wider than the Peignot many of us know and love from the titles of <cite>The Mary Tyler Moore Show</cite>?</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
