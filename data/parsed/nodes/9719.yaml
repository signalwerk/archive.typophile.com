  html: <p>I've been looking for a Clarendon-style font that has text/oldstyle figures. The closest I've been able to come is Caslon (which has no ball terminals, is too elegant), a slab serif like Joanna (not really close at all), and New Caledonia (not *too* bad) but I'd like a real one. (ps</p>
