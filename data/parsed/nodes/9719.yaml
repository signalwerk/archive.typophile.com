    html: <p><a href="http://www.myfonts.com/fonts/linotype/pmn-caecilia/">PMN Caecilia</a> comes semi-close, except for how it's more of a mono-width font than a "true" egyptian like Clarendon. Aside from that, I think you're out of luck. Most of the Egyptian revivals appear to be based on woodcut types (and so are digitized without too many extras), with the exception of Clarendon, and all of the versions / knockoffs of Clarendon I was able to find have lining figures. <br> <br>Maybe you could borrow old-style figures from a similarly weighted serif typeface like Cheltenham? <br> <br>(<a href="http://www.myfonts.com/fonts/storm/farao/">Farao</a> doesn't answer your question, as it has contemporary figures, but it sure is cute, so I thought I'd throw it in anyway. I love Storm!)</p>
    html_clean: <p><a href="http://www.myfonts.com/fonts/linotype/pmn-caecilia/" class="link-external">PMN Caecilia</a> comes semi-close, except for how it's more of a mono-width font than a "true" egyptian like Clarendon. Aside from that, I think you're out of luck. Most of the Egyptian revivals appear to be based on woodcut types (and so are digitized without too many extras), with the exception of Clarendon, and all of the versions / knockoffs of Clarendon I was able to find have lining figures. <br> <br>Maybe you could borrow old-style figures from a similarly weighted serif typeface like Cheltenham? <br> <br>(<a href="http://www.myfonts.com/fonts/storm/farao/" class="link-external">Farao</a> doesn't answer your question, as it has contemporary figures, but it sure is cute, so I thought I'd throw it in anyway. I love Storm!)</p>
