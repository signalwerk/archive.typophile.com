    html: <p>Forrest, <br> <br>Thanks for the Farao tip--it has some interesting quirks. Unfortunately, I don't know of any Cheltenhams (I have ITC and Bitstream) that have OSF. Even New Century Schoolbook Fractions (logically) has no OSF. New Caledonia comes closest (It has teardrop terminals instead of ball terminals and an arabic 1.) I guess I'll just have to use Century in a historically appropriate manner. SIgh, . . .</p>
