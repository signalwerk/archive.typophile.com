    html: |-
      <p>This is a realy interesting thread. I'm probably ot going to be answering Marc's question either (sorry Mark).<br>
      I have been using sassoon for kids multimedia. I wanted to know about peoples thoughts on the essentials too:</p>
      <p>x-height, point size, relative weight etc.</p>
      <p>Also, more about actually setting the type, kerning, leading etc.</p>
      <p>I guess the key really is maximum ledgibility. We have been using voice over for everything and supporting that with text on screen.</p>
      <p>We have three point sizes for three age ranges:<br>
      prep/foundation: 30pt sasoon sans<br>
      grade 1-2: 26pt sasoon sans<br>
      grade 3-4: 22pt sasoon sans<br>
      grade 4-5: 18pt sasoon sans</p>
      <p>These also had various kerning and leading setting.</p>
      <p>We tried out some stuff and instinctively went for quite a bit of leading, up to 6pts for the younger kids.</p>
      <p>There was a fair amount of discussion about ambiguity of letters in various fonts: a preference for a straight tail on the nine(sorry about the terminoloy...), as opposed to the upside down 6 was a good example of this. We looked at heaps of fun fonts, but for the younger kids, didn't have enough differntiation between characters like 9.<br>
      A capital I with ligatures was also necessary.</p>
      <p>mrfussy, yes, totally agree with your comment, "letter identification first" I guess even if you're not setting out to teach reading or writing, then it will still probably go a long way if what you're doing can do that as well.</p>
      <p>I think also that what is said on "kidstype.com" is a really important, in terms of what we were doing:<br>
      # Teacher opinion, generally, favours sans serif typefaces because of the simplicity of the letter shapes<br>
      # But children encounter a wide range of letterforms in their day-to-day environment<br>
      # Publishers tend to listen to teachers because they influence the book-buying policy in schools<br>
      # Children are seldom asked what they think about the typefaces in the books they read</p>
      <p>I may have answered my own question here, but wanted other peoples feedback.</p>
    html_clean: |-
