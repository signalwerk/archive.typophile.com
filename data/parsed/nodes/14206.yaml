      <p>'Children's books' always do have two target groups (if you assume that you have to design for 'target groups'): the children themselves and the adults who buy them for them, read them out for them - literary scientists call that 'double adressing'. Plus you have to think that there are special interest media and institutions on children's literature that do recommendations (also painting with a large brush: they mainly use categories like age) etc.<br>
      So I think the goal is to achieve high typographical quality for all possible readers.</p>
