      <p>Sassoon as characters looks great. It's the typeface used by Postman Pat! But it kerned horribly for me (was using quark, if that matters.)</p>
      <p>For "educational" type: check out this to-the-point list:<br>
      <a href="http://www.educationalfontware.com/EFI_home_page.html" title="http://www.educationalfontware.com/EFI_home_page.html">http://www.educationalfontware.com/EFI_home_page.html</a><br>
      Some of these (HB, Palmer) contain versions that even have the ruled guides.</p>
      <p>Before making a final choice, you should check children's book characters such as Pooh, Dora, Elmo, Barney, etc etc to see what type they use, because what they use, they use often, and it becomes an association with that character. (I think Elmo used Providence at one point, but I couldn't find an example. Thing is, they usually switch "official" typefaces every few years anyways.)</p>
