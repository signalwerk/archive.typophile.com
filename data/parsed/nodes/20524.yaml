    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 7.Jun.2006 12.13pm </div>
      <p>--</p>
    <p>Parisine, the bestseller at Porchez Typofonderie, has now been re-released in OpenType format. Just as Parisine Plus was re-released as Opentype last February, both are (more or less) now equivalent to what Adobe considers as Pro font features.</p>
    <p><a href="http://www.typofonderie.com/" title="http://www.typofonderie.com/">http://www.typofonderie.com/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/parisineptf_launch_1_4628.gif"></div><p></p>
    <p>Parisine PTF (with the Clair and Sombre subfamilies), released in June 2006, is the third OpenType family from Porchez Typofonderie. From €210 for a licence covering 8 worstations. Our clients should check the special offer.</p>
    <p><a href="http://www.typofonderie.com/alphabets/view/ParisinePTF" rel="nofollow">Parisine PTF</a><br>
    <a href="http://www.typofonderie.com/alphabets/view/ParisinePTFClair" rel="nofollow">Parisine PTF Clair</a><br>
    <a href="http://www.typofonderie.com/alphabets/view/ParisinePTFSombre" rel="nofollow">Parisine PTF Sombre</a></p>
    <p><a href="http://www.typofonderie.com/gazette/hot_news/?id=251" rel="nofollow">Parisine PTF special offer  available through 31 July 2006.</a><br>
    To celebrate the launch of the Parisine PTF, clients can benefit from a special price of only 168 Euros (standard price at Euros 210). To access this special offer, you must login, then jump to your account page. In case of problems, you may contact us. Upgrade from Parisine is also available, check Parisine PTF, page for more details.</p>
    <p>Sample: <a href="http://www.typofonderie.com/icono/alphabets/pdf/ParisinePTF_pdf.pdf" rel="nofollow">http://www.typofonderie.com/icono/alphabets/pdf/ParisinePTF_pdf.pdf</a></p>
