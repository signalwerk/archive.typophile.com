    <p>The original Action Comics font was first used, as far as I know, on the cover of Superman #1 in 1938. Since it is such a classic font, I was hoping that perhaps it had been recreated at some point. Any ideas where to look?</p>
    <p>thanks-<br>
    Eric</p>
