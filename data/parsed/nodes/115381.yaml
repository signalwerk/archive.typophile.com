      <p>The triangular serif is a 19th century style called "Latin" as shown in a wood type revived as Birch <a href="http://www.myfonts.com/fonts/adob/birch/" title="http://www.myfonts.com/fonts/adob/birch/">http://www.myfonts.com/fonts/adob/birch/</a><br>
      Also Etienne <a href="http://www.myfonts.com/fonts/paratype/etienne/" title="http://www.myfonts.com/fonts/paratype/etienne/">http://www.myfonts.com/fonts/paratype/etienne/</a> Spike <a href="http://www.myfonts.com/fonts/quadrat/spike/" title="http://www.myfonts.com/fonts/quadrat/spike/">http://www.myfonts.com/fonts/quadrat/spike/</a> OL Latin classic <a href="http://www.myfonts.com/fonts/ortizlopez/ol-latin-classic/" title="http://www.myfonts.com/fonts/ortizlopez/ol-latin-classic/">http://www.myfonts.com/fonts/ortizlopez/ol-latin-classic/</a><br>
      You mentioned in a previous post that you had a print shop with old type. Is this image from a digital font of our era, or a print from old metal type?<br>
      If it's digital, some digging could turn up your font. Perhaps by a Polish foundry? <a href="http://luc.devroye.org/poland-index.html" title="http://luc.devroye.org/poland-index.html">http://luc.devroye.org/poland-index.html</a><br>
      Don</p>
