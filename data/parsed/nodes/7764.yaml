    html: <p>No doubt you are correct, Mike. I was aware that Bitstream had gotten such a sweet deal � later deeply regretted by the other, copyright-holding foundries as I recall. I didn't know this about URW. <br> <br>Yves, this thread might better attract enlightening posts if moved to the General Discussions forum. <br> <br>Can anyone shed any light on why these companies seem to thrive in Deutschland?</p>
