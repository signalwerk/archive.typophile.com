    html: <p>Mike, I thought many of those URW  'knockoffs' were from their days as one of the early digitizers for other foundries, using their Ikarus system. My understanding was that they were allowed to keep versions of the fonts they digitized, if they renamed them (like Bitstream was too, I think).</p>
