    date: null
    date_raw: null
    votes: null
    html: <p>I've wondered about how these companies get away with this, too. There must be something, er, lax about Germany's laws in this area because it is home not only to Softmaker, but also Brendel Informatik and Primafont (which resurrected itself this year) � all of which are chock full of commercial font knockoffs. <br> <br>The bummer is that all offer digitizations of quite a few old typefaces that are otherwise unavailable or no longer covered by copyright. Also, I discovered during this past year that Brendel offers several originals. <br> <br>Oh, I forgot about that other German foundry, URW. They used to offer lots of knockoffs as well � many of them, I think, from their acquisition years ago of the Miles label. Those knockoffs have pretty much disappeared from their website offerings. <br> <br>If only those other companies would purge their offerings and seek legitimacy. <br><br></p>
    html_clean: <p>I've wondered about how these companies get away with this, too. There must be something, er, lax about Germany's laws in this area because it is home not only to Softmaker, but also Brendel Informatik and Primafont (which resurrected itself this year) � all of which are chock full of commercial font knockoffs. <br> <br>The bummer is that all offer digitizations of quite a few old typefaces that are otherwise unavailable or no longer covered by copyright. Also, I discovered during this past year that Brendel offers several originals. <br> <br>Oh, I forgot about that other German foundry, URW. They used to offer lots of knockoffs as well � many of them, I think, from their acquisition years ago of the Miles label. Those knockoffs have pretty much disappeared from their website offerings. <br> <br>If only those other companies would purge their offerings and seek legitimacy. <br><br></p>
