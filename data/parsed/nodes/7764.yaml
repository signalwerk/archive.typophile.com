  html: "<p>Are these guys (Softmaker) legitimate?: <br><a href=\"http://www.softmaker.de/mpfeat_en.htm\" target=\"_blank\">http://www.softmaker.de/mpfeat_en.htm</a> <br> <br>I've generally assumed that Function was a rip off of Adobe's Futura without actually setting the type and looking for differences. But it seems fishy to offer hundreds of dollars <br>worth of typefaces for fifty dollars, especially since they <br>claim that their faces are licensed. That would be pretty <br>ballsy to not change the names of those fonts, a la <br>\"Futuri\" \"Chantilly (Gill Sans)\" and \"DawnCastle (Dom Casual)\" <br> <br>thanks in advance, <br> <br>Enrico</p>"
  html_clean: "<p>Are these guys (Softmaker) legitimate?: <br><a href=\"http://www.softmaker.de/mpfeat_en.htm\" target=\"_blank\" class=\"link-external\">http://www.softmaker.de/mpfeat_en.htm</a> <br> <br>I've generally assumed that Function was a rip off of Adobe's Futura without actually setting the type and looking for differences. But it seems fishy to offer hundreds of dollars <br>worth of typefaces for fifty dollars, especially since they <br>claim that their faces are licensed. That would be pretty <br>ballsy to not change the names of those fonts, a la <br>\"Futuri\" \"Chantilly (Gill Sans)\" and \"DawnCastle (Dom Casual)\" <br> <br>thanks in advance, <br> <br>Enrico</p>"
