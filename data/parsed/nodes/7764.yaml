    html: <p>That's what I thought...But how come Adobe doesn't go after this company? And the fonts...are they just traced from hard copies of the originals (to avoid having the same curves and points)? <br> <br>Also, are the "Baskerville," "Bodoni," and "Franklin Gothic" names not protected by law because they are all digital revivals from the same source?</p>
