    <p>Good evening, all.</p>
    <p>I’m a design student, about a year away from finishing my BFA in Graphic Design. As a graduation gift from my parents, i’m getting an all expenses paid trip to Europe. I’m looking for opinions on where exactly I should go. Preferably somewhere with good design to study and interesting sights to see. (A good nightlife wouldn’t hurt, either). I was leaning toward Berlin, but I wanted to broaden my options by polling some of you who live in or have visited Europe before. </p>
    <p>To recap, my “checklist” of a good candidate:<br>
    1) Active, on-display design culture<br>
    2) Interesting sights<br>
    3) Good places to catch some live music<br>
    4) Just good to visit in general</p>
    <p>Suggestions? :)</p>
    <p>Thank you!<br>
    Eric</p>
