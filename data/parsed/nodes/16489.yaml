    votes: null
    html: |-
      <p>I tremendously enjoyed working with Leslie on the book as technical editor. We spoke on the phone several times and I taught Leslie a few things about the dark sides of font technology. </p>
      <p>But quite frankly, I have lived to see four spreads from the book. When I first saw pages 50 to 57, it was like a revelation to me. I was always a bit confused about drawing in FontLab myself until Leslie laid it out to me on these four spreads. This is the most comprehensive overview of drawing in FontLab and so much to the point. </p>
      <p>Altogether, every single page of the book is useful. </p>
      <p>Leslie's writing style shows off when you read the back cover of the book. But you should wish you had seen the alternate biographies for him and me that he originally planned to put there. That was completely insane stuff! :) </p>
      <p>Go grab a copy while Leslie still has some! </p>
      <p>Best,<br>
      Adam</p>
