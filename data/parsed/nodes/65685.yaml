      <p>There's an option in Windows 7 for setting the "compatibility mode" of an (older) application so as to help it run better under the new OS. Select the app icon (or a shortcut, even), right-click, get "properties," go to the "compatibility" tab and look at your options. You could for example try setting compatibility to "Windows XP"....</p>
      <p>No promises that this will help, but it's the one other thing to try (besides a virtual machine) before giving up.</p>
      <p>Cheers,</p>
      <p>T</p>
