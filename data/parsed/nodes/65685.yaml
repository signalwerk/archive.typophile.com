      <p>Closing all apps as sii suggests seems like a mighty fine idea.<br>
      *Especially* any and all anti-virus and security software.</p>
      <p>@thomas</p>
      <p>&gt;nice tip<br>
      My wife had an app required by her school that just refused to install in Vista. The company flat-out said it wasn't Vista compatible and no update was on the way - not enough of a market, I suppose. Her entire class was going nuts over this. Everybody had Vista.<br>
      Installing in compatibility mode was a Hail Mary Pass, but Windows actually reached back and used older dll's and such and the sucker actually installed. Spent hours at it.<br>
      Amazed me, I thought I'd seen it all. I wrote up directions and it worked on all the student's Vista machines so no fluke.</p>
      <p>rich</p>
