      <p>I'm surprised to hear about CS3, but you have to remember PM6 is about a decade old - AFAIK it doesn't even run on Vista. In fact I'm working with a client to move them from PM6 to InDesign (and Unicode fonts), since they realize the tightrope they're walking on is getting thinner by the week... The tricky thing with them is that the Armenian hyphenation plug-in has to be re-written.</p>
