    html: |-
      <p>@ijgolf</p>
      <p>Thomas is on to something, I hope. (I'm a Microsoft Certified Network Engineer and former 3rd level desktop support guy.)</p>
      <p>1) Try installing under the Administrator account. Even if your user account has Administrator privileges, I've seen problems. Makes no sense but such is Windows.</p>
      <p>2) Uninstall CS3. And then, find the msi or, more probably the exe intallation file, right click it, and select Properties -&gt; Compatibility Tab -&gt; Run this program in compatibility mode for... and select Vista or XP or whatever.</p>
      <p>This way, the whole installation gets done in backwards compatibility mode.</p>
      <p>Once that's done, try it. If still no luck, add Thomas's step to the process and run the program executable in compatibility mode, too.</p>
      <p>rich</p>
