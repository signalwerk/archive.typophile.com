    html: |-
      <p>It is legal only if permitted by the End-User License Agreement (EULA) for the font. What a EULA allows for varies from foundry to foundry, but typically modification of an existing font is prohibited, especially if you’re planning to make money from the end result. </p>
      <p>Maybe someone else can back me up on this.</p>
