    html: <p>It would be best to repost in a smaller size. Add a few detail close-up shots since you want a technical critique. <br>From what I can see, there is a few problems that you need to deal with. I can tell you designed this by connecting regtangles and circles, instead of drawing the forms in bezier. You have some inconsistencies where you knocked out and intercepted forms. If you are using a vector program (which is by far the best way to do this) view it in outline and make adjustments. <br>You can do the knock-out and connecting objects process you are familiar with as a base and then rework the files on a top layer to make it easier. Let me know if you understand what i am talking about.</p>
    html_clean: <p>It would be best to repost in a smaller size. Add a few detail close-up shots since you want a technical critique. <br>From what I can see, there is a few problems that you need to deal with. I can tell you designed this by connecting regtangles and circles, instead of drawing the forms in bezier. You have some inconsistencies where you knocked out and intercepted forms. If you are using a vector program (which is by far the best way to do this) view it in outline and make adjustments. <br>You can do the knock-out and connecting objects process you are familiar with as a base and then rework the files on a top layer to make it easier. Let me know if you understand what i am talking about.</p>
