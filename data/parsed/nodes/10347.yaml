    html: <p>On the logo the transition from the curve to the straight in the open counter of the h is a bit sudden, and the halo and horns need some work to give them the same prominence. The halo is the only item which is angled, which needn't be a problem, but you need to sort out the weight. The umlaut vertical positioning is also something that needs attention. <br>Tim</p>
