      <p>“Comic Sans – The Movie” would have been nice and fun, but I guess it’s not gonna happen…</p>
      <p>Serious now: the BBC has broadcast a few documentaries and specials (as part of a culture program) about typographers or the graphic arts in general. I recorded a few of those. If you are interested in Stephen Fry’s take on the press used by Gutenberg or a short interview with Matthew Carter, contact me: mail [at] bertvanderveen [dot] nl.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
