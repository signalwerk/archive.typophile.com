    <p>Hi !</p>
    <p>I'm currently building a list of interesting documentaries about typography for a local design event.</p>
    <p>While Hustwit's <em>Helvetica</em> is a must-see gem, I realize most people have seen it. Adding it to my program would be okay, but I'm pretty sure there are other quality projects out there.</p>
    <p>I already have a preliminary list, but I'd like to have the opinion of the Typophile community. I want to surprise my audience with new films and / or hard to find documentaries.</p>
    <p>Any suggestions ?<br>
    Have you heard of new films coming out soon ?</p>
    <p>Thanks a lot in advance !</p>
    <p>- -</p>
    <p>(by the way, excuse my average english...)</p>
