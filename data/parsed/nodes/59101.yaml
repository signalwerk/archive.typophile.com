      <p><cite> &gt; I don’t believe Typeface is available on DVD yet, but you can try and catch a screening.</cite></p>
      <p>FWIW, the <a class="freelinking external" href="http://typeface.kartemquin.com/" rel="nofollow">Typeface</a> movie will be screened as this year's Wednesday night public event at <a class="freelinking external" href="http://www.typecon.com" rel="nofollow">TypeCon</a> in Atlanta on 15 July (<a class="freelinking external" href="http://www.aiga-atl.org/event.jsp?navigation=2&amp;content=441" rel="nofollow">co-sponsored by AIGA Atlanta</a>). The screening will be followed by a panel discussion with Jim Moran, David Shields, Nick Sherman, and John Downer. </p>
      <p>AIGA Atlanta is selling tickets for general admission. TypeCon attendees are guaranteed a seat (if you check it off on your registration).</p>
      <p>Some folks may remember that Justine Nagan gave a preview of some of the footage at last year's TypeCon in Buffalo. We're very excited to welcome her back to TypeCon to debut the finished documentary.</p>
