    html: |-
      <p>The barcode has to be a certain size, you should make sure you don't go below the legal minimum and most publishers will insist that their logo remains on the spine. You might also have to set the spine in a more 'conventional' typeface, probably all uppercase.<br>
      These things might let down the design but since they are real-world important you should probably keep them.<br>
      I have no real problem with the composition of the type on the back, although it could have more leading and have a narrower measure; you could also look at turning over some of the words to make the right margin smoother and kerning out the space between the italic P and remain, version 2 doesn't look centred on the width and I would outdent the last line by the width of the ellipsis, (btw two points "correspondence" and en-dash (option+hyphen) should replace the hyphen).<br>
      As for the treatments the letraset versions seem to be masking the title of the book with the extra l's and tilde n's.<br>
      Tim</p>
