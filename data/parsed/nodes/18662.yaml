      <p>LMNOP, catching title. I dont do gentle because the real world isnt'. Thats for school.</p>
      <p>Out of all three, Im leaning towards the first one. But the line spacing is way too tight, completely affects the readability. Im not too crazy about the MARK DUNN-baseline effect you having going on. I would drop the black bar and experiment with the big open wall you have in the background. That is a dream pallete to work on. Use it. Why did you chose pixelation? To me, it doesnt reflect the books theme.</p>
      <p>Compositionally, you have split the page into four zones. Was this on purpose? Work on hierarchy. We read from Left to Right. So placing the tiltle in the far right is not a good idea. And drop one of the authors name. You have it listed twice. </p>
      <p>I like the non-geometric type selections (since the background is geometric.)</p>
