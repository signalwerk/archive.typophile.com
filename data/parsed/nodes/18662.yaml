      <p>Thanks Prakash - some great points which I hadn't noticed.</p>
      <p>To me, pixelation is a perfect concept to experiment with. The book is about - among other things - the degradation of language. Pixelation was one of the ideas that jumped out at me most having brainstormed degraded type and purposefully obscured type.</p>
      <p>I don't mean to sound ungrateful here or anything, but you do realise this is not just the front cover, right? This is the entire jacket - this explains why the author's name is replicated (once for the cover and once for the spine) and why the title of the book might appear so drastically placed on the right hand side. Apologies if I'm way out here!</p>
