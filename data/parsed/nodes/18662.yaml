    <p>Hi all,</p>
    <p>This is one of my very first posts here so, y'know.. be gentle!</p>
    <p>I'm a first year graphic design student and we've just completed a brief on visual processes. Once we'd found a suitably obscure/unique process we had to apply it to either a book jacket, cd cover, short film or existing poster - the attachments here are the three options I came up with for an alternate cover to the book 'Ella Minnow Pea' by Mark Dunn. For the first I photographed some handmade pixelated type I created, the second was achieved with scratched letraset and the third was layered images backlit and photographed. </p>
    <p>When we came to the crit, people liked the processes but felt the type composition (mostly on the back covers) let them down. Does anyone have any suggestions? I'm already in the process of reducing the size of the barcode (currently a little unwieldy) and removing the logotype on the spine of the first jacket as it overcomplicates matters.. but any observations or suggestions would be greatly appreciated :)</p>
    <p>Thanks in advance,<br>
    Jez.</p>
