  html: |-
    <p>dear typophiles,<br>
    i write my ‘reading dissertation’ about hebrew secondary styles. now i am looking for hebrew type designs that create a set of styles (through structural change and within the same weight). i know about ismar david’s david (and linotype’s david hadash), henri friedlaender’s (unreleased) attempt of hadassah cursive and ben nathan’s days and nights. does one of you happen to know other examples / attempts that try to create a complementing style for highlighting within texts for continuous reading ?<br>
    many thanks in advance, nicole</p>
