    html: <p>I wouldn’t classify either of these types as rotunda. Morris’ Troy type reminds me a lot of Schweynheim and Pannartz’s Roman type. Like the contemporary Ashendene Press Subiaco type, based on S&amp;P’s first type, it is an attempt to capture something of the historical transition from blackletter to humanist type that took place in the first few years of printing in Italy. If you add to these two types the Doves Press roman, you have a kind of historical recreation, culminating in the Jensonian roman.</p>
