    <p>I came across an intriguing comparison by William Chappell/Robert Bringhurst in <em>A Short History of the Printed Word</em>. Chappell (who is clearly the one speaking in this section, since he refers to watching Koch at work) says, “It seems to me that the calligraphic forms of the Troy font fail to achieve the naturally organic characteristics of a rotunda, and instead only imitate models on which they were based” (244). Below are examples, Troy (Morris) above and Wallau (Koch) below.</p>
    <p>What I see is this: the Troy looks like a simpler, wider, more “modern” face that’s hiding behind some calligraphic embellishment. And I do see that the Wallau seems to be something like “appropriate to itself” in its form, especially, for example, in the narrowness and the occasional extra flourishes that make it seem more “exotic.” But that’s from a very naïve eye.</p>
    <p>Can some of you produce more concrete terms for distinguishing these two, in a way that explains the difference Chappell sees?</p>
    <p>- J</p>
