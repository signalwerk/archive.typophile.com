    html: <p>In an earlier thread, the consensus was that the logo is a modified version of ICG Narrowband, or at least that was close enough. See the thread <a href="http://www.typophile.com/forums/messages/83/10591.html">here</a>.</p>
    html_clean: <p>In an earlier thread, the consensus was that the logo is a modified version of ICG Narrowband, or at least that was close enough. See the thread <a href="http://www.typophile.com/forums/messages/83/10591.html" class="link-lost">here</a>.</p>
  - id: 31277
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Sorry, but the best you could do is <a href="http://www.fonts.com/findfonts/detail.asp?pid=405922" target="_blank">Image Club Narrowband</a> to try to come close to that lettering. Now that I look at it, it's not too far off, but usually pro sports teams use custom lettering, so these kinds of 'desperate' requests will just be frustrating for all involved. <br> <br>Narrowband comes in 2 weights, but I picked the bold page.</p>
    html_clean: <p>Sorry, but the best you could do is <a href="http://www.fonts.com/findfonts/detail.asp?pid=405922" target="_blank" class="link-external">Image Club Narrowband</a> to try to come close to that lettering. Now that I look at it, it's not too far off, but usually pro sports teams use custom lettering, so these kinds of 'desperate' requests will just be frustrating for all involved. <br> <br>Narrowband comes in 2 weights, but I picked the bold page.</p>
