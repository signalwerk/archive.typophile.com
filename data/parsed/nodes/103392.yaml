      <p>As a first type-face this is good for starters. Don't let Sir Hrant scare you off. :-)</p>
      <p>This has been done a lot, so be minded to carefully refine this. Focus a lot on the space between letters. That will help this go from just another historical Bauhaus face to great! :-)</p>
      <p>I agree with Hrant on the joins. Check out <a href="http://www.typeworkshop.com/index.php?id1=type-basics" rel="nofollow">this site</a>, and try to apply those principles on your font. Also notice the where two lines join each other (for instance as on the |r| or |m|) the lines are thinned out. Take heed also to thinning the horizontals vs. the verticals.</p>
      <p>Can't wait to see more!</p>
