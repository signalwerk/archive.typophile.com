      <p>There have been many revivals of that historic "font style". What's your plan for making yours relevant? Without simply throwing in a gimmick...</p>
      <p>Also (assuming you want this look refined, as opposed to "faux naïve") you'll need to modulate the joins. For starters, closely compare your "a" to the one in Futura.</p>
      <p>hhp</p>
