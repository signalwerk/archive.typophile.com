    <p>Hello all.</p>
    <p>I started my first typeface hence the temporary name for the project.</p>
    <p>It would be great to get some feedback while working on the typeface so far I have done the lower-case and plan on working on the upper-case next. OnceIi have done that I will go back to the lower-case as a lot of the curves are far from perfect.</p>
    <p>Also please note I haven't done any kerning yet as this is something I need to research first.</p>
    <p>The inspiration for this typeface where early sketches of Futura, Bauhaus and Univers. Please let me know if it looks too similar to any of these fonts as i wanted to use them as inspiration and not to look exactly the same.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/may2013-01_3531.png"></div><br>
