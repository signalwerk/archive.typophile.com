    html: |-
      <p>The above ideas should work on most or all Unix/Linux-based systems, including System X.</p>
      <p>But if all you have is a Windows box, you can get some wordlists from <a class="freelinking external" href="http://wordlist.sourceforge.net/" rel="nofollow">http://wordlist.sourceforge.net/</a> and the utility kit from <a class="freelinking external" href="http://unxutils.sourceforge.net/" rel="nofollow">http://unxutils.sourceforge.net/</a> and then get down and dirty with the command line. I think they'll work with MSWindows 95-XP. Beyond that, no idea at all.</p>
