  html: <p>I am considering putting together a script that converts all the letter/letter pairs in a Metrics Machine pair list into a word list by pulling words from dictionaries. Before I go through the trouble is there already one out there?</p>
  html_clean: <p>I am considering putting together a script that converts all the letter/letter pairs in a Metrics Machine pair list into a word list by pulling words from dictionaries. Before I go through the trouble is there already one out there?</p>
comments:
  - id: 460144
    user: 46471
    date: 2011-04-14T13:05:00
    date_raw: 14 Apr 2011 — 1:05pm
    votes: null
    html: |-
      <p>If you have a list of the pairs you can loop through them and for each, do:</p>
      <p><code>grep '[kern pair]' /usr/share/dict/words</code></p>
      <p>or you can do clever things like two at once, eg</p>
      <p><code>cat /usr/share/dict/words | grep '[kern pair 1]' | grep '[kern pair 2]'</code></p>
      <p>so </p>
      <p><code>cat /usr/share/dict/words | grep 'av' | grep 'aw'</code></p>
      <p>will get you</p>
      <p><code>awave<br>
      drawshave</code></p>
      <p>to output words in all caps add this</p>
      <p><code>| tr '[a-z]' '[A-Z]'</code></p>
      <p>to output words with initial caps add this</p>
      <p><code>| sed 's:^\(.\):\\U\\1:g'</code></p>
