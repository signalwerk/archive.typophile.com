    html: |-
      <p>Very cool. I would love an algorithm to achieve the opposite effect as well, actually. Like, typing or copying a written letter several times and have the algorithm add variety to each letter—or does this exist already?</p>
      <p>Chris, you're right, though I wonder how high the chances are of a visually impaired person on Typophile making use of text-to-speech converters. Still, it's good practice and it's something I learned at my multi-media course to improve usability. If someone points out how to do it better, why not do it? Last year I was in a lecture class and I noticed a guy in front of me was designing a flyer on his laptop and he was using hyphens where he should have been using dashes. I pointed the error of his ways out to him but it took him longer than 3 seconds to find out how to type a dash so he said "Never mind". It frustrated me tremendously. Mind you, this is a designer, who should care about these things.</p>
      <p>Chris, I noticed the quote on your profile and you might find this an interesting read: <a href="http://en.wikipedia.org/wiki/Measurement_problem" title="http://en.wikipedia.org/wiki/Measurement_problem">http://en.wikipedia.org/wiki/Measurement_problem</a><br>
      I guess it's a big distinction between the ability to measure and the ability to measure accurately, but it seems on the quantum level it's inherently impossible to measure things as they are.</p>
