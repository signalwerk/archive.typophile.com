      <p>Imagine a visually impaired reader using a text-to-speech converter that isolates and reads hyper-links out loud. If all it says is “article” or “here” it provides them with no contextual information. Especially if “click here” is on the same page several times, and they all go to different places. It’s pretty standard accessibility practice.</p>
      <p>See <a href="http://www.w3.org/TR/WAI-WEBCONTENT/" rel="nofollow">the Web Content Accessibility Guidelines 1.0</a> (1999):<br>
      From section 13.1: Clearly identify the target of each link. [Priority 2]<br>
      <em>Link text should be meaningful enough to make sense when read out of context -- either on its own or as part of a sequence of links. Link text should also be terse.<br>
      For example, in HTML, write "Information about version 4.3" instead of "click here". In addition to clear link text, content developers may further clarify the target of a link with an informative link title (e.g., in HTML, the "title" attribute)</em>.</p>
      <p>See also <a href="http://www.nngroup.com/articles/top-ten-web-design-mistakes-of-2005/" rel="nofollow"> the Nielsen Norman Group’s post on the Top 10 Web Design Mistakes of 2005</a>:<br>
      From section 1.0. Legibility Problems:<br>
      <em>Explain what users will find at the other end of the link, and include some of the key information-carrying terms in the anchor text itself to enhance scannability and search engine optimization (SEO). Don't use "click here" or other non-descriptive link text</em>.</p>
      <p>The list goes on. A surprisingly common (and easy to correct) mistake thats’s still haunting us after more than two decades. All it takes is a few more seconds of forethought when writing for the web.</p>
