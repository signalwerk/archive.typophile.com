  html: "<p><a class=\"freelinking external\" href=\"http://research.microsoft.com/en-us/um/people/larryz/ZitnickSiggraph2013.pdf\" rel=\"nofollow\">This recent research</a> by Lawrence Zitnick\x03 on a handwriting averaging approach based on sampling is not only interesting, but holds enough potential to influence the way we do type design. Basically, the algorithm takes user stroke samples in real time (with the help of a pen tablet) to increase stroke consistency in a non-destructive manner. Take a look at the presentation video (link at the bottom); there's no need to put it into words.</p>

    <p>I wonder: If this algorithm could take stroke-width information into account, the application to the digitization process of calligraphic ‘handwritten’ fonts is obvious. </p>

    <p>Putting sampling aside, the paper suggests more: an algorithm could take an existant font, analyze frequent characteristics among all different glyphs (within the same font) and average independently over each this characteristics. This makes sense specially because the algorithm doesn't destroy variation, as it always averages: tendencies are reinforced. Like the idea behind the <a class=\"freelinking external\" href=\"http://iotic.com/averia/\" rel=\"nofollow\">average font</a>, but built upon a much more clever procedure.</p>

    <p>Even more helpful would be the partitioning of glyphs* into primary components (stems, bowls, serifs, terminals, etc.) to allow global tweaking of weight, contrast and proportions without making use of interpolation. Of course, this is a naïve statement, but it isn't necessarily unfeasible.</p>

    <p>Link to the presentation video:<br>

    <a class=\"freelinking external\" href=\"http://www.youtube.com/watch?v=EtfCenXsSgQ\" rel=\"nofollow\">http://www.youtube.com/watch?v=EtfCenXsSgQ</a><br>

    Link to the paper:<br>

    <a class=\"freelinking external\" href=\"http://research.microsoft.com/en-us/um/people/larryz/ZitnickSiggraph2013.pdf\" rel=\"nofollow\">http://research.microsoft.com/en-us/um/people/larryz/ZitnickSiggraph2013.pdf</a><br>

    ______<br>

    * <em>independently</em> of the style of the typeface.</p>"
