      <p>If possible, best to avoid hyper links such as “click here” or “this article” (especially when they are linked to PDFs and/or initiate downloads) as they provide no information regarding their destination, are less searchable, and provide accessibility issues to visually impaired readers using text-to-speech software.</p>
