  html: <p>Hello, <br><br>I am trying to convert this typeface “Lumpy” into a monospaced font. The font is a handwritten/script face. Is there an easy way to do this using Macromedia Fontographer? To give give all the letters and numbers equal spacing on both left/right side of the font between all characters? <br><br>Lucas</p>
