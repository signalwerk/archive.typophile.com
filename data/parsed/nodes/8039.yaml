    html: <p>Now that I read my post I see that I wasn't making myself clear. <br> <br>I basically want and cant control the tracking of the font in Adobe Acrobat so I want to add wider tracking to each letter. So it appears as though they are equally spaced out. <br> <br>Lucas</p>
