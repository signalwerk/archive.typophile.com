    html: <p>In FontLab 4.6, to add spacing between letters, you would need to select Tools / Transform, check Apply to whole font and choose Metrics / Adjust Metrics.  <br>To set the width of all glyphs to the same amount, in the Transform window you would need to choose Metrics / Set width.  <br>I have no idea how to do this in 8 years old applications.  <br>Adam</p>
