    <p>As tips go it’s a minor one, but...</p>
    <p>I have come up with a way of working through &amp; testing my Calt feature script &amp; keeping track of where I am. I put a space in the code and move lines code up or down to indicate if I am done with them (depending on the direction I am moving throgh the list).  Happily you can change code &amp; recompile with the space there &amp; it doesn’t break anything.</p>
    <p></p><div class="imageWrap"><img src="/files/screen.jpg"></div><p></p>
    <p>I don’t have 5.0 yet so I can’t say if this will work in that version.</p>
    <p>Anybody else have practical/process tips to share? </p>
    <p>Or a somehow better ways of doing this?</p>
