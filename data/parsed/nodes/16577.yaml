      <p>That’s a handy tip, actually. Sounds good to me. It will work fine in 5.0 as well (the properties of whitespace in the feature code have to do with the Adobe-defined syntax for that code, picked up by Fontlab).</p>
      <p>I often put comments at the beginning of a feature to indicate exactly what I still need to do with it. Because I’m only doing about 10-15 hours a week on type design, it’s the only way I can keep track sometimes.</p>
      <p>T</p>
