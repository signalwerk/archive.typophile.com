    html: |-
      <p>Okay, it wasn’t too hard to do a quick-and-dirty module for BBEdit after all.</p>
      <p><a href="http://www.marksimonson.com/otfeature_module.plist.zip" title="http://www.marksimonson.com/otfeature_module.plist.zip">http://www.marksimonson.com/otfeature_module.plist.zip</a></p>
      <p>Unzip it if it doesn’t happen automatically, quit BBEdit if it’s running, and put the the file into ~/Library/Application Support/BBEdit/Language Modules/ . (If you don’t already have a folder named “Language Modules” in there, make one.)</p>
      <p>Now when you open a .fea file in BBEdit, you should see some basic syntax coloring. The colors will depend on your preference settings. Nothing fancy, and some character names (like zero) are also feature tags, so they will be highlighted. There is probably some way to fix this, but, as I say, this is a quick-and-dirty module. If anybody gets ambitious enough to improve it, be my guest. But let me know, too.</p>
    html_clean: |-
