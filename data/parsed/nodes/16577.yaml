      <p>You can use the “#” character at the beginning of a line to mark the whole line as a comment, or at the end of a code line. For example: </p>
      <p># More swashy glyphs<br>
      sub @a by @aswsh; </p>
      <p>or </p>
      <p>sub @a by @aswsh; # More swashy glyphs</p>
      <p>Adam</p>
