      <p>Now the type size in the threads is out of proportion with the Forum menus.<br>
      So I adjust the size of one, and the other becomes too big/small.</p>
      <p>It seems like the leading has been reduced too.<br>
      Or is it just that the previous type size/leading was between the plus/minus size options now available?</p>
      <p>**</p>
      <p>FWIW, I preferred the previous site design, where the background was white -- and one could paste a sample of type and it became part of one's typography, not a boxed image.</p>
