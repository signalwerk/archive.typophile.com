    html: |-
      <p>It's looking a bit heavy/large to me too, I like 12px much better. Bump to 12.5 for a bit more size, maybe? The whole site would need to scale up with the type to keep the look working to my eyes at 13+ px—but then it'd all be too big... so you can't win. Argh.</p>
      <p>The general play of serif vs. sans and black vs. blue for content differentiation works well. Tweaks here and there are always fine and understandable, but I don't think bigger text is needed as a design direction. I visit here quite a bit on my mobile when on the go, and bigger text would make the lines shorter, and thus just make more lines of text for me to scroll through. </p>
      <p>Just thinkin' out loud.</p>
