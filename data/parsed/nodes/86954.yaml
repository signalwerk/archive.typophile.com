      <p>Unicode deals with the meaning of characters, not with typographic niceties. You can design a font with all kind of crazy ligatures (fi, fl, ff, ffi, ffl, fff, fb, ffb, fh, ffh, fk, ffk, ct, st, sp…) but you shouldn’t assign a codepoint for all of them, only to the characters in which the ligature can be decomposed. Therefore, you can find the sequence “fl” because it is composed by an “f” and an “l”, no matter if it is ligated or not.</p>
      <p>This is a relatively new idea. Before Unicode, it was thought that treating ligatures as characters was harmless (and probably the only way to go). Now this is considered a bad practice: someone can type ﬂ (uniFB02, as I did here) for the sake of having a nice ligature, so you won’t be able to find your word because you are looking for f (uni0066) and l (uni006C).</p>
