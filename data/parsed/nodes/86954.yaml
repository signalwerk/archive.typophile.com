      <p>That is correct.</p>
      <p>Unicode is a fairly recent idea, and the distinction it makes between characters, glyphs and code points was quite the innovation.<br>
      Basically, it means that each linguistic character is designated a code point (an alphanumeric number), and may be represented by a glyph at that code point.</p>
      <p>Previous encoding systems, most notably ISO 8859, encoded glyphs rather than characters, so were not so linguistically precise and in many instances there were conflicting code systems—hence the need for one code to rule them all.</p>
      <p>And way before that, the idea that one piece of type (i.e. glyph) may encode several different characters was representative of the economic resourcefulness traditionally exercised by printers. In fact, prior to the introduction of hot metal equipment (Linotype) in the 1880s, the left quote marks were set from the same piece of type as the comma, merely rotated 180°.</p>
      <p>Many typewriters had no "one" or "zero" characters, the typist being expected to make "l" and "O" do double duty.</p>
      <p>The situation with the "dumb" quote marks stems from continuing support for older fonts that use the ISO encoding.<br>
      So really, it's a double-edged sword deriving from the longevity of fonts as software.<br>
      It may have been possible, when Unicode started c. 1990, for the Unicode Consortium to have moved to obsolesce the dumb quote encoding of ISO 8859, but it was a young organization and such a move was, I assume, not expedient.</p>
      <p>Another legacy that Unicode incorporates, although inconsistent with its premise, is the encoding of the glyphs "fi" and "fl" as if they are single characters and not merely typographic ligatures.</p>
      <p>Even today, there are no separate Unicode points for the right quote and the apostrophe in the basic encodings, hence the debacle with "smart" layout applications abbreviating numbers with left quote marks. Rather pathetic, if you ask me.</p>
