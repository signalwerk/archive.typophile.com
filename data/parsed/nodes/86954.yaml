      <p>@guifa:<br>
      <cite>Yes, it's important to remember that by design, Unicode is supposed to be a semantic encoder, not a glyph encoder.</cite></p>
      <p>@Cristobal Henestrosa:<br>
      <cite>Before Unicode, it was thought that treating ligatures as characters was harmless (and probably the only way to go).</cite></p>
      <p>Well, before Unicode, people conceptualized printers as something you hooked up to a computer to print glyphs in response to codes sent from the computer. One code, one glyph. If fancy steps to insert ligatures in text were required, they would be done inside the computer - since, of course, computers are big and expensive, and thus printers are dumb.</p>
      <p>And codes like ASCII and EBCDIC are principally communications codes, governing things like the connection to a printer.</p>
      <p>We've come a long way from then to now. Unicode indeed is eminently suitable to allowing documents to be interchanged between different computer systems, containing text in different languages, and so on. It facilitates applications, though, that were just about unimaginable in the world of mainframes and punched cards.</p>
      <p>@emspace:<br>
      To be less technical than Wikipedia:</p>
      <p>The first 128 charcters in Unicode match those of an older code, ASCII.</p>
      <p>When ASCII was originally invented, the code positions used for lower-case letters were left unassigned. Thus, ASCII 39 (') didn't look like either an apostrophe or a prime, but like the single-quote symbol on a typewriter - it was vertical.</p>
      <p>When lower-case was added to ASCII, some terminals left that character as it was, but others sloped the character so it could be either a directed quote or a prime, making a pair with the new reverse-quote, ASCII 96, (`), which had only just been added, along with the lower-case letters. (The characters { | } and ~ were also added to ASCII at that time.)</p>
      <p>Before lower-case was added to ASCII, ^ was an up-arrow instead of a caret and _ was a back-arrow instead of an underscore, also.</p>
      <p>And | was a broken vertical bar because the EBCDIC vertical bar was mapped to ! instead of it, and the EBDIC logical not was mapped to ^ instead of ~, because PL/I programmers insisted that all their characters needed to be in the uppercase-only subset, thus preventing ASCII ! from translating to EBCDIC !... a nightmare.</p>
      <p>Basically, though, the rule is:</p>
      <p>When you think of Unicode, think of ASCII.</p>
      <p>When you think of ASCII, think of <a class="freelinking external" href="http://museum.mit.edu/nom150/entries/1302" rel="nofollow">this</a>.</p>
