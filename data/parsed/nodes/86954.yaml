      <p>Yes, it's important to remember that by design, Unicode is supposed to be a semantic encoder, not a glyph encoder.  For 99.99% (possibly more) text documents, that is the preferred method.  However, for certain specialized topics, mainly scholarly, it is as important (or more important) to note the actual glyph changes more so than the underlying semantic meaning for any number of reasons.</p>
      <p>In comes the private use area.  Because Unicode explicitly doesn't encode anything there, by using those code points, you can ensure that specialized encodings don't tread on the standard encodings.  In practice, the PUA is used for three things really:</p>
      <p>1.  encoding logos/etc. for use in text (e.g. the Apple logo)<br>
      2.  encoding new Unicode blocks which are still being proposed / in the process of being approved<br>
      3.  encoding functionally, graphically, or featurally, but not semantically, important differences in glyphs</p>
      <p>The second one tends to result in a wholesale move of the block (so, you might use four rows in your proposal, they'll just become four rows in a different block which makes it easier to convert).</p>
      <p>For the last one, in order to make the non-standard somewhat standard, several different initiatives have started up, namely MUFI, UNZ1, and CSUR.  Those projects agree not to step on each other's areas.  Sometimes some of their glyphs will end up in the Unicode standard, but most of them will probably stay in the PUA.</p>
