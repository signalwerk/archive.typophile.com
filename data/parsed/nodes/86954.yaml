      <p>On typewriters, in order to keep the number of keys down, it was customary to simplify some of the glyphs so that they could be used for more than one character.</p>
      <p>The ' symbol is one such glyph, to be used for an apostrophe and closing single quotation mark ( ’ ), for an opening quotation mark ( ‘ ), and for a prime mark ( ′ ), and for the top half an exclamation mark which would be built from ( '  . ).</p>
      <p>Computer keyboards and early computer character sets mostly followed typewriter practice in using the ' symbol. See <a href="http://www.fileformat.info/info/unicode/char/0027/index.htm" title="http://www.fileformat.info/info/unicode/char/0027/index.htm">http://www.fileformat.info/info/unicode/char/0027/index.htm</a> . The name APOSTROPHE was applied to it in many standard character sets and Unicode followed suit. It was also used for the prime mark which also stands for “feet” and “minutes”, but in good typography the prime mark slants.</p>
      <p>Unicode distinguishes the following symbols which are somewhat alike:<br>
      APOSTROPHE: <a href="http://www.fileformat.info/info/unicode/char/0027/index.htm" title="http://www.fileformat.info/info/unicode/char/0027/index.htm">http://www.fileformat.info/info/unicode/char/0027/index.htm</a> [ ' ] (typewriter apostrophe–quotation-mark)<br>
      LEFT SINGLE QUOTATION MARK: <a href="http://www.fileformat.info/info/unicode/char/2018/index.htm" title="http://www.fileformat.info/info/unicode/char/2018/index.htm">http://www.fileformat.info/info/unicode/char/2018/index.htm</a> [ ‘ ]<br>
      RIGHT SINGLE QUOTATION MARK: <a href="http://www.fileformat.info/info/unicode/char/2019/index.htm" title="http://www.fileformat.info/info/unicode/char/2019/index.htm">http://www.fileformat.info/info/unicode/char/2019/index.htm</a> [ ’ ] (typographical closing quotation mark and apostrophe)<br>
      SINGLE HIGH-REVERSED-9 QUOTATION MARK: <a href="http://www.fileformat.info/info/unicode/char/201b/index.htm" title="http://www.fileformat.info/info/unicode/char/201b/index.htm">http://www.fileformat.info/info/unicode/char/201b/index.htm</a> [ ‛ ] (variant opening quotation mark)<br>
      PRIME: <a href="http://www.fileformat.info/info/unicode/char/2032/index.htm" title="http://www.fileformat.info/info/unicode/char/2032/index.htm">http://www.fileformat.info/info/unicode/char/2032/index.htm</a> [ ′ ] (genuine prime mark)<br>
      MODIFIER LETTER VERTICAL LINE: <a href="http://www.fileformat.info/info/unicode/char/02c8/index.htm" title="http://www.fileformat.info/info/unicode/char/02c8/index.htm">http://www.fileformat.info/info/unicode/char/02c8/index.htm</a> [ ˈ ] (marks stressed syllable in some phonetic notations)<br>
      MODIFIER LETTER TURNED COMMA: <a href="http://www.fileformat.info/info/unicode/char/02bb/index.htm" title="http://www.fileformat.info/info/unicode/char/02bb/index.htm">http://www.fileformat.info/info/unicode/char/02bb/index.htm</a> [ ʻ ] (when the character represents a sound in some phonetic notations and transliterations)<br>
      MODIFIER LETTER APOSTROPHE: <a href="http://www.fileformat.info/info/unicode/char/02bc/index.htm" title="http://www.fileformat.info/info/unicode/char/02bc/index.htm">http://www.fileformat.info/info/unicode/char/02bc/index.htm</a> [ ʼ ] (when the character represents a sound in some phonetic notations and transliterations)<br>
      MODIFIER LETTER REVERSED COMMA: <a href="http://www.fileformat.info/info/unicode/char/02bd/index.htm" title="http://www.fileformat.info/info/unicode/char/02bd/index.htm">http://www.fileformat.info/info/unicode/char/02bd/index.htm</a> [ ʽ ] (when the character represents a sound in some phonetic notations and transliterations)<br>
      LATIN CAPITAL LETTER SALTILLO: <a href="http://www.fileformat.info/info/unicode/char/a78b/index.htm" title="http://www.fileformat.info/info/unicode/char/a78b/index.htm">http://www.fileformat.info/info/unicode/char/a78b/index.htm</a> [ Ꞌ ] (sometimes used for a sound in Nahuatl and related tongues)<br>
      LATIN SMALL LETTER SALTILLO: <a href="http://www.fileformat.info/info/unicode/char/a78c/index.htm" title="http://www.fileformat.info/info/unicode/char/a78c/index.htm">http://www.fileformat.info/info/unicode/char/a78c/index.htm</a> [ ꞌ ] (sometimes used for a sound in Nahuatl and related tongues)</p>
