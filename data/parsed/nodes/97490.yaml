      <p>@Typogruffer—</p>
      <p>Allow me to elucidate. I presume that you are young (under twenty-five). From what I observe, your generation has been fed the notion that acquiring professional tools automatically makes you a professional: sadly, this is not often the case. To my mind, there are no substitutes for a firm technical foundation and thoughtful mentoring. Before I turned pro around 2001, I had: over forty years of experience operation dedicated typesetting machines; almost as many years dealing with computers; advanced drafting skills with ruling pen an compass; about sixteen combined years, working in actual print shops; and, the ten previous years, wrangling bezier curves.</p>
      <p>Prompted by a certain <em>je ne sais quoi</em>, Ilene Strizver ( <a href="http://thetypestudio.com/" title="http://thetypestudio.com/">http://thetypestudio.com/</a> ) took me under her wing and, together, we developed the ITC and Monotype exclusives in my <em>oeuvre</em>. I was only after learning a deeper level of craft from Ms Strizver that I had the confidence to strike out on my own. So, the whole process is a little more complicated than opening the box and becoming an instant star.</p>
      <p>How had can it be? Very: as formats evolve, continuing education becomes critical. Thanks to the generosity of many folks in this forum, I have been able to keep up with the most important developments, and keep my product line more or less state-of-the-art. I do not wish to appear to deny you the same access to the collected wisdom which may be found herein; I merely wish to point out that it can be very hard, professional tools notwithstanding…</p>
