      <p><em>I bit the bullet and let it install what it thought were more up-to-date system files.</em></p>
      <p>The files were not necessarily more up-to-date. Sometimes, new Dynamic Link Libraries omit older dependencies, presumably on the assumption that newer programs all use newer DLLs. If VOLT needs a previous version to work, then you probably got less up-to-date files.</p>
      <p>And, Typogruffer: the fact that you are a noob is apparent with both your choice of handles and every question that you post here. Sometimes, folks are surprised by the many and varied answers to the question, “How hard can it be?”</p>
