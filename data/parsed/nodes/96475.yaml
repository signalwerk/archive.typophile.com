    <p>There are SkyFonts waiting in the stars<br>
    They'd like to come and meet us<br>
    But they know they'd blow our minds<br>
    There's a SkyFont waiting in the stars<br>
    They've told us to download it<br>
    Cause they know it's all worthwhile<br>
    They told me:<br>
    Let the children use it<br>
    Let the children rent it<br>
    Let all the children boogie</p>
    <p><a href="http://skyfonts.com/" title="http://skyfonts.com/">http://skyfonts.com/</a></p>
