    html: |-
      <p>You need an em dash, *not* a hyphen or an en dash.</p>
      <p>One might also reasonably use a quotation dash (“horizontal bar,” U+2015). But not all fonts have those. In any case, they are often the same width as the em dash. (Despite what you might guess from the name, these are primarily used to set off the actual quoted text instead of an opening quote mark, in languages where that is the typographic convention.)</p>
    html_clean: |-
