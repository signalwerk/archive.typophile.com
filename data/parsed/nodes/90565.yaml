  html: |-
    <p>This is one technical detail I've never been able to find the answer to. In cases where you're listing the speaker of a quote underneath it, preceded by a dash, what type of dash this supposed to be? A hyphen? En dash? Em? Is there a standard at all? To clarify, this is the format I'm referring to:</p>
    <p>"It's not the size of the dog in the fight, it's the size of the fight in the dog."<br>
    – Mark Twain</p>
    <p>Is there a correct answer? As of avid user of quotes in designs, I'd love to know that I'm knowing it correctly. Thanks so much!</p>
