      <p>First, I spelt "trinocular" wrong. Should be "tri-ocular".</p>
      <p><em>Sesqui(n)ocular</em></p>
      <p>Maybe. I looked up 'sesqui' in the shorter Oxford and it's Latin for one and a half. The problem with "sesquiocular" is that a one and a half story g has one oculus and a stroke down the bottom, and the stroke isn't half an oculus. See the problem? "ocular" is the problem.</p>
      <p>Possibly the best term for this kind of g could be based on its abstract optical properties. Its like the old woman/young lady optical illusion. Look at my g and you can make out two figures in abstract silhouette: 1) A nose with spectacles in profile looking to the left. The bowl is one of the spectacle lenses and the angled piece is the nose in profile. 2) A human figure. The bowl (oculus) is the head, and the angled piece is the body, arguably female as its shaped like a Coco Channel dress from the 1960's.</p>
      <p>So;</p>
      <p>Coco g<br>
      Proboscis g</p>
      <p>Come up with some more. This is an abstract naming job.</p>
      <p>j a m e s</p>
