      <p><em>I never expected that much enthusiasm about it.</em></p>
      <p>It may not look like much, and it isn't if you judge its worth on things like modulation, rigour, contrast between counter and outer contour, distinctive shaping/sculpting. But its a no bullshit happy kind of grotesk letter with an unassuming plainness certain kinds of advertising design thrive on. It makes no cultural assumptions thru fashionable high-style or snooty appeal. Its honest &amp; friendly. That also makes it versatile. The happy-dynamic bent and inline treatment gives it visual impact in the absense of sophisticated design.</p>
      <p>I often set text on large scale out-of-home ads in one or another grotesk font---I have access to a large collection---for subject matter that needs it, where a trendy sophisticated type design would alienate the target consumers.</p>
      <p>j a m e s</p>
