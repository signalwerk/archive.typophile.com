      <p>I was actually talking about the open-bottom <cite>binocular</cite> "g".<br>
      I don't like the monocular "g" myself, although for reasons<br>
      of anti-modularity, not direction (which is essentially moot<br>
      for immersive reading, although admittedly not for display).</p>
      <p>What's interesting though is that I had the exact same faux (see below) epiphany in 1998, while reading the chapter in Smeijers's "Counterpunch" about the "j". He wanted the "j" to be sitting down on the baseline; and suddenly I noticed, subconsciously I swear, that an "a" was facing the wrong way; except it wasn't; except it was. I figured all the letters should face rightward (or at least not leftward). After all, all the UC letters are like that (except for the "J", and that's a phoney letter), and, perhaps like Cassandre, I wanted to bring some order to the mottled Latin lowercase. I started trying some glyphs, but then was made to realize that it doesn't make sense; direction is moot. The good news* is that this aborted effort spawned my long-standing alphabet reform work.</p>
      <p>* Actually, really bad news as far as many people are concerned.</p>
      <p>hhp</p>
