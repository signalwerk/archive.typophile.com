      <p>g is an opportunity letter.</p>
      <p>Gill's italic "p" is quite common in the italics of dozens of widely-used book romans, and far from unique to Gill Sans. I wouldn't dub it a signature letter for that reason, and because it's in the italic, not the regular Gill. Eric Gill's signature letter is the Gill Sans "a".</p>
