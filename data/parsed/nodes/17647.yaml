      <p><em>whacky</em></p>
      <p>:^) Cool, Stephen. It looks like a pair of spectacles.</p>
      <p><em>Some of the difficulty in talkng about this (and searching for info) is terminological...</em></p>
      <p><em>eyeglass</em></p>
      <p><strong>binocular!</strong></p>
      <p>I've never heard the form called 'eyeglass' before, until this thread. Always known it as binocular or 'double story' g.</p>
      <p><em>...most unusual lower case “g” these days...</em></p>
      <p>I designed one much more unusual than Jocham's. It can be seen in use helping to spell my name at the top of <a href="http://moorstation.org/typoasis/designers/gaut/CosmicAlchemist/cosmic_alchemist.html" target="_new" rel="nofollow">this page</a>. This font is an upcoming release.</p>
      <p><em>...English sans seemed to generally have double storey while german ones had single storey.</em></p>
      <p>The binocular form is foreign to German blackletters because it isn't a natural cursive form drawn with a calligraphy nib, and blackletters are essentially calligraphic. Binocular g seems to be an Italian invention, and a typographic, metal creature.</p>
      <p>It's a hassle sometimes designing one in a font because it stands out in the context of a 'de facto' roman lower case letter set; if I replace the binocular g with a single story g some observers say the set is too modular, at the same time complaining about some other relatively minor thing being "disturbing". In context binocular g is disturbing, or would be if they weren't a widely accepted convention.</p>
      <p>And too, a lot of type designers make a cutesy binocular g for their text roman and end up with something that ruins an otherwise well-balanced font. [Edit: this is more common in display fonts]</p>
      <p>Despite these dim views of binocular g, I find them irresistable as most type designers do.</p>
      <p>j a m e s</p>
