      <p><cite>closed-bottom binocular “g” can cause a -minor- reading hiccup</cite></p>
      <p>This may be, but what bothers me about the single-story open-tailed g is that it faces left - against the reading direction. I don’t think any other glyphs (even a, j) do this as strongly as the single-story g. A word that begins with such a g is not sealed off, sort of like a layout that has a picture that looks off page left. The standard binocular g seems to seal off the word or at least “look” in the right direction - to the right.</p><div class="imageWrap"><img src="http://typophile.com/files/going.gif"></div><p></p>
    html_clean: |-
