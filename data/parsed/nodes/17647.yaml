    votes: null
    html: <p>I take the binocular g to be warmer and the monocular to be colder (Northern European?) - especially in sans/non-italic. I also have an idea that when I was a kid I thought of the serif book face binocular g as a "real" g and the monocular as a phony that I could only poorly excecute. The fact that the monocular g is closest in form to Spurius' original form is beside the point...</p>
