      <p>It's funny that you guys bring up the 'g'- Around this time last year, I began to wonder about it myself.</p>
      <p>I did some research-- it looks like the bicameral, two-storey spectacles 'g' came about through the mingling of the carolinian 'g' with the insular 'g', becoming the Middle English 'yogh'. You can read up on that <a href="http://www.evertype.com/standards/wynnyogh/ezhyogh.html" rel="nofollow">by clicking here</a>.</p>
      <p>Interestingly, the bicameral 'g' had at one point entirely stamped out the unicameral 'g'. The latter wasn't revived until the development of the first modern typefaces- when typographers began looking for ways to simplify letters, the bifocal 'g' was an obvious target.</p>
      <p>It's interesting to see how many variants the 'g' has, and that so many of them are recognizable instantly as the same letter, without question. It demonstrates how language can still change in times of globalization and grand cultural diffusion.</p>
      <p>I personally perceive at the bipartisan 'g' as a written form, even when it's present in a modern font. I was experimenting with it here: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/geesmall.png"></div><br>
      <a href="http://homepage.mac.com/rezmason/gee.png" rel="nofollow">(click here for larger version)</a><p></p>
