      <p>I think the fixation might happen because some characters are open to more interpretation than other letter.</p>
      <p>This is very true. The letter "g" just so happens to be one of which has many variants, and in many cases may be used as a signature character by its creator. As mentioned in the original post, looking at the lower-case, italicized "p" in contrast to the "q" in Gill Sans, is another good example of a designer styling a character into a font signature.</p>
