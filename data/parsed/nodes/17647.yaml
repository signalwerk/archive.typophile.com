      <p>This is exactly what I am driving towards. More divergence of form, everywhere. I'm beyond "ready to leverage" this principal. I've already designed a whole font based on it.</p>
      <p><em>...creative lethargy...</em></p>
      <p>That's what binocular g has become. Atrophied design with no relevant rationale to support it. Its perpetuation by type designers over five hundred years along with all the other long-standing typographic design conventions, and the extreme reticence to break those conventions, is the essence of type design and what type designers do. It's a lazy black art of compliance.</p>
