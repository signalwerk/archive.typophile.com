      <p><em>I posit that we don’t know that.</em> </p>
      <p>We experience it. I mean, I read a heck-load of text in print and can't ever recall tripping up on a binocular g. Once your brain has been axon-modelled by reading experience the integration is automatic. Only when we discuss it, as now, do we decide we "know" any different in terms of design theory. And of course "different" is not neccessarily better or worse, just different.</p>
      <p>If it works, it works. But the story never ends there...I could go on.</p>
      <p><em>...the only people who are really adversely affected by the open-bottom binocular “g” are... certain type designers! :-)</em></p>
      <p>Yes. In a lot of those cases it does seem to be a matter of ideology, of what one believes or has adopted as incontravertible about Latin letter forms---about certain structures in particular. Type designers without those beliefs tend to enjoy a greater range of expression and wider structural palette, with impunity :^)</p>
      <p><em>No, I think it’s just tom-foolery.<br>
      It’s actually from an early 20th-century ATF face.</em></p>
      <p>Its very effective, whatever you call it.</p>
      <p><em>I was thinking Elvis.</em></p>
      <p>In that case you want a bouffe bob with a horn lick coming off it.</p>
      <p>Your horn, by the way, looks like a shock of hair coz its facing backwards. Point it forwards and will become a horn.</p>
      <p>j a m e s</p>
