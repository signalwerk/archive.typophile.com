  date: 2006-01-31T13:21:00
  votes: null
  html: <p>Typefaces are collections of individual letters, so it's OK if we occasionally fixate on the design of individual letters, right? The distinguishing characteristics of  the sans letter, lacking serifs and usually being more or less monolineal, seem more striking than those of the serifed letter. How the letter is drawn, its basic shape, comes to the fore in the absence of concerns about serif shapes &amp; directions, and stroke width. So what about lowercase sans g's. I love the eyeglass style (Gill) and don't like the Frutiger//Futura-style. Does anyone else care?</p><div class="imageWrap"><img src="http://typophile.com/files/gs.gif"></div><p></p>
