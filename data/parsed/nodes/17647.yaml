      <p>Yes, when they're conscious of what they're looking at.</p>
      <p><em>Actually, I think the conventional form of the binocular “g” with the closed bottom bowl is in fact too divergent from the essence of the Latin lowercase. I greatly prefer the open-bottom binocular form, although it’s rarely done right (not that the closed form is done right too often either).</em></p>
      <p>Technically you're right. The full binocular form is a stand-out. Yet, even tho it is true they go against the essence of antiqua lower case, they are widespread in text romans, and integrated readily enuff by the brain/mind. What designers won't integrate the brain will. Or maybe it's really a mind trick :^)</p>
      <p>The ideal g solution is, I think, the Schwabacher form. It's differentiated from p-d, b-q, and suggestive of binocular g without seriously breaching cursive flow.</p>
      <p><em>Maybe Alessio Leonardi. Think Forchetta.</em></p>
      <p>Thanks for the references. I'll check those out. I was imagining a tri-ocular unit arranged like the futuristic vehicle seen in a particular painting by Chris Foss.</p>
      <p>Hrant, that horned g is cool. Not just the horn but the stressing thruout the rest of it---is it an example of Bloemsma-inspired ordered irregularity? The horn, looking like Tin Tin's shock of yellow hair, makes the whole thing anthropomorphic. It could be practical in a display font if you tame the length of the horn some.</p>
      <p><em>I take the binocular g to be warmer and the monocular to be colder (Northern European?) - especially in sans/non-italic.</em></p>
      <p>They have that effect, yes.</p>
      <p>j a m e s</p>
