    html: <p>The eyeglass g is, of course, almost universal in serif printing types. The Frutiger-style g might rightly be called an italic g since it seems to come naturally in calligraphy and cursive writing. Some sans faces with eyeglass g's actually switch to the Frutiger style for italic, like ITC Johnston. Gill keeps the eyeglass for italic, and so does Trebuchet, but the Treb italic g looks really strange.</p><div class="imageWrap"><img src="http://typophile.com/files/gilltreb.gif"></div><p></p>
