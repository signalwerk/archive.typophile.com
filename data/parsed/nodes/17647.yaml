      <p><em>There’s something fun/unique about drawing lower case g’s in the eyeglass style...</em></p>
      <p>They're cool because they don't conform. A binocular g stands apart from the pack, but the form is not so different that it presents problems of integration. Integrating them adds a challenge type designers enjoy, and they give a lift to what is otherwise a regimented and conformist idea---the antiqua lower case. The justification for it is like the D in Bank Gothic---it breaks the rule and is the only glyph in the main set with a true curved section. Bank Gothic needs that D because of its O. Text romans need binocular g's for a similar reason---to defeat their modularity. I guess they help readability a tiny bit too by dint of their differentiation from q.</p>
      <p><em>...monocular/binocular might be better, and do sound more… respectable...</em></p>
      <p>'authoritive' is the word I would use in your monograph. As you can see, I'm a nomenclature buff meself :^)</p>
      <p><em>monocular/binocular</em></p>
      <p>Let's not rule out 'trinocular'. A trinocular g has three bowls, the third one sitting to the right and centered on the baseline. This opens up new possibilities---why stop at two?</p>
      <p>Q. What kind of type designers put trinocular g's in their fonts?<br>
      A. A long time ago in a galaxy far, far away...</p>
      <p>j a m e s</p>
