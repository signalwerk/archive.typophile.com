      <p>Well, I certainly agree that readers can handle a lot more<br>
      variance than many type designers give them credit for.</p>
      <p>But if you allow one letter to have a strongly divergent<br>
      form (the "g", in its closed-bottom binocular form) you<br>
      better be ready to leverage divergence to that extent in<br>
      the alphabet as a whole; otherwise all you're really doing<br>
      is engaging in creative lethargy.</p>
      <p>hhp</p>
