      <p>Thanks - an excellent thread. Some of the difficulty in talkng about this (and searching for info) is terminological: eyeglass, single- or double-storey (UK?) -story (US). Here's a nice page from No Bodoni which uses unicameral/bicameral as descriptives:<br>
      <a href="http://www.nobodoni.com/gstory.html" title="http://www.nobodoni.com/gstory.html">http://www.nobodoni.com/gstory.html</a></p>
      <p>Obviously bicameral/unicameral are best used to describe alphabets. The tdc glossary has the best term for the double-story g - <a href="http://www.tdc.org/views/typedictionaryB.html" rel="nofollow">binocular</a>.</p>
