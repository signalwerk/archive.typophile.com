      <p>Speaking of g?</p>
      <p>This is a sneak-preview of a new typeface, Neptuna, (will be released this year).</p>
      <p>The g to the right is the standard figure, but the other letters are to be found on alternate places in the font for those who are interested in experimenting with the words.</p>
      <p>Personally I like the two middle ones, the best - but the Foundry that will distribute Neptuna, prompted to do a regular g aswell - as shown to the right. Probably a good idea since many people perhaps like to use standard shapes.</p>
      <p>However, as we placed the alternate g's in the font - people can chose whatever shape they want, and combine them. It's quite nice when you print words with two following g, like "begging", "dragging" or something, and chose to use two different versions :)</p><div class="imageWrap"><img src="http://typophile.com/files/neptuna2_gggg.jpg"></div><p></p>
