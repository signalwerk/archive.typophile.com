  html: |-
    <p>Hi,</p>
    <p>I'm adding a Second Edition Preface to this book and would like to match the original font. For what it's worth, the book is <cite>The Impact of Intervention</cite> by Bruce J. Calder, University of Texas Press, Austin, © 1984.</p>
    <p>Identifont says the font is Elmhurst, but I don't think that's quite right. I'd also appreciate suggestions of fonts which are close.</p>
    <p>Thanks,</p>
    <p>Wangden</p>
    <p>P.S. Sorry about the distortion created by the lens of my digital camera. I don't have a scanner.</p>
