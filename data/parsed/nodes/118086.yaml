      <p>Pink is not a thoughtful choice for a mixed gym. Also, I would explore more appropriate fonts (these are too rigid for the purpose).</p>
      <p>Integrating gym gear (dumbells or whatever) in the logo will look tacky. Besides many people who join a gym do it for using the treadmills, cross trainers or spinning classes. The macho image of dumbells may also give women a wrong impression of the gym identity. Is this a gym where people go to stay fit and healthy, or a "no pain no gain" bunker for hillbillies?</p>
      <p>I would keep the overall thing clean, simple and dynamic. And pink, seriously. If it was an exclusive gym on say Miami South Beach, the kind with a vallet, maybe some pink would work. Otherwise, it will probably look cheap. As it does now.</p>
      <p>Keep it simple:</p>
      <p><img src="/sites/default/files/old-images/Screen-Shot-2012-01-03-at-12_4648.09.41-PM.png"></p>
