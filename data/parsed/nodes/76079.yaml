    <p>Hey folks</p>
    <p>Would like to get some alternative style ideas on drop caps; they only appear once per page of a brochure, so it can become a feature in itself. Any input on positioning/height, how many lines to drop, etc would be much appreciated.<br>
    Thanks!</p>
