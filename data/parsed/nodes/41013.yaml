    html: <p>Legacy and Legacy Sans come to mind (by Ronald Arnholm). Meta finally has a serif mate (from Erik Spiekermann). Hoefler Text and Whitney make a good match according to the creators and I particularly like Requiem and Gotham (all four from Jonathan Hoefler and Tobias Frere-Jones)</p>
