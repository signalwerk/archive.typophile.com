    html: |-
      <p>I don't think anything having to do with humans can be so black-and-white. Different people have different breaking points, and the software EULA is far beyond the tolerance of most any human, which means virtually nobody reads the crap. This is exactly why the "simple EULA" is such a humanly effective idea; but <strong>only</strong> if the company providing it has good intentions, which is uncommon; good intentions -I mean at the company level, not the individuals working there- can certainly never be found in a company run by share-holders.</p>
      <p>&gt; pick up the phone</p>
      <p>You really think a phone conversation can solve the central problem?</p>
      <p>hhp</p>
