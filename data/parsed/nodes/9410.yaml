    date_raw: 9 Jun 2005 — 9:05pm
    votes: null
    html: <p>We updated the P22 EULA to try to clarify things, but it still causes confusion. We considered a more detailed version that spells out every possible scenario, but that is impossible. The Commercial Licensing web page was simply an attempt to show examples of where a basic license was not sufficient for a user (or group of users). The bottom line is that fonts are tools for designers to use. We don't want to hinder that. If there is any confusion, a quick email usually get a reply the same day.</p>
