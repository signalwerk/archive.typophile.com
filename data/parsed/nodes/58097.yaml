    <p>I have just stumbled onto Typophile. Where have I been all my life? What great forums and people and subject matters dear to my serifed heart. It is lovely to meet others equally afflicted by the alphabet.<br>
    I hope you will visit my new letterform design site at <a href="http://www.iskradesign.com" title="http://www.iskradesign.com">http://www.iskradesign.com</a> and the attendant blog, <a href="http://www.alphabetroadtrip.com" title="http://www.alphabetroadtrip.com">http://www.alphabetroadtrip.com</a>. The first is the portfolio for my lettering and calligraphic design business,and the second is a more freewheeling mostly visual blog about signage, poetics and process. Alphabet Roadtrip has a section called Signs I Like for which I am soliciting contributions. I'm looking for the naive, the quirky,and the painfully executed. And a story. Google has rendered information useless without story, and Flickr has done the same for imagery. Go see, and you'll see. Hope to hear.</p>
    <p>Iskra</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/FaithSmall_5227.jpg"></div><p></p>
