      <p>@Denis—I like your solution for the "f" and "t" within your overall design.</p>
      <p>Aesthetics is completely subjective. Everyone has an opinion.</p>
      <p>Always go with your personal "gut feeling" when designing fonts.</p>
      <p>Nothing is ever really "wrong".</p>
      <p>Never be afraid to break the rules when the design warrants it.</p>
      <p>The "quirkiness" of your overall design and the "art nouveau"-"art deco" aspects work effectively throughout the font design.</p>
      <p>As an example, the lower cross bar in glyphs such as "E", "F", "H" and "4" harmonize well with similar aspects in top-to-bottom proportions of "B", "R" and "8", and certainly  are mimicked well in your solution for the "f"and "t". In addition, the narrow and wide body proportions further enhance the visual effects. Well done.</p>
      <p>The overall design works. I also like the name of the font.</p>
      <p>Good luck, and I wish you much success.</p>
