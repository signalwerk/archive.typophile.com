      <p>It's better than the average amateur work, and not bad for a first font. A few comments:</p>
      <p>- the f looks silly. Nick is quite right. I'm not sure I've ever seen a professional typeface, other than a script or hand-lettered style, in which the crossbar of the f and the t were at different heights.</p>
      <p>- some of the transitions from rounded to straight lines, such as the shoulder of the n, are a little too abrupt</p>
      <p>- where round shapes meet straight lines, such as in abdpq, you need some optical compensation by thinning the curved part where it comes in to meet the straight. It's not as bad a problem as it would be in a heavier weight, but it still needs a hint of thinning.</p>
      <p>- the sidebearings of the A should presumably be the same as the V. But in any case, the round sidebearings could all be a little less, and those of letters like AVTX could all be a lot less.</p>
      <p>- there's no kerning. This is a good thing given that the spacing isn't done. But more browsers are supporting kerning now, and you need it in a geometric sans like this for the typeface to be done.</p>
      <p>Cheers,</p>
      <p>T</p>
