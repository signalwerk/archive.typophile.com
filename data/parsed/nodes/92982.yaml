    votes: null
    html: |-
      <p>Linus, </p>
      <p>the alias.dat file that ships with FontLab Studio does not include all possible alternate glyph + accent combinations. You can add your own composition recipes to alias.dat or you can use the following syntax in FontLab Studio's Generate Glyphs dialog: </p>
      <p>y.ss01+acute=yacute.ss01</p>
      <p>Before the equation sign is the recipe, and after the equation sign the desired glyph name. </p>
      <p>More information about the recipe syntax is given in the Generate Glyphs dialog and in the manual.</p>
