      <p>Linus, </p>
      <p>not that I know of. Happy extending! :)</p>
      <p>Note that in alias.dat, the sequence of items is a bit different: it's<br>
      &lt;finalglyphname&gt;&lt;whitespace&gt;&lt;recipe&gt;<br>
      while in the Generate Glyphs dialog it's<br>
      &lt;recipe&gt;=&lt;finalglyphname&gt;</p>
      <p>That's the only difference.</p>
      <p>A.</p>
