    html: |-
      <p>From the manual<br>
      _ (underscore) appends following glyph to the right.<br>
      + (plus) appends following glyph as component of the composite glyph.</p>
    html_clean: |-
      <p>From the manual<br>
      _ (underscore) appends following glyph to the right.<br>
      + (plus) appends following glyph as component of the composite glyph.</p>
  - id: 509945
    user: 1133
    date: 2012-05-15T19:11:00
    date_raw: 15 May 2012 — 7:11pm
    votes: null
    html: |-
      <p>Yes, the principal difference is that with +, all components will be placed on the advance width of the first component, and with _, the advance width of the final glyph will be the sum of the widths of all components. </p>
      <p>"W_I" will produce a glyph where I is next to W on a width which is a sum of the widths of W and I. "W+I" will produce a glyph on the width of W with I centered on W. "W+&lt;I" will produce a glyph on the width of W with I left-aligned with W, and "W+&gt;I" will produce a glyph on the width of W with I right-aligned with W.</p>
    html_clean: |-
      <p>Yes, the principal difference is that with +, all components will be placed on the advance width of the first component, and with _, the advance width of the final glyph will be the sum of the widths of all components. </p>
