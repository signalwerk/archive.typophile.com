  html: |-
    <p>I’m using anchors in Fontlab to generate accented characters.<br>
    It works fine with the basic characters, but how do I get this to work with alternates?<br>
    I got y.ss01, for example. How should the accented character be named?<br>
    y.ss01acute, y.ss01_acute don’t work.<br>
    Is it possible at all? Thanks for your help :)</p>
