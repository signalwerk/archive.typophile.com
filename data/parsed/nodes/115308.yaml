    html: |-
      <p>The quality of how the fonts display on an output device such as a monitor or a projector is also dependent on the quality of the font rasterizer. A font rasterizer is a piece of software sitting in the operating system of the computer which supplies the signal for the output device. Most applications (but not all of them …) rely on that built-in font rasterizer and its standard settings. So on the one hand it makes sense to look for well hinted fonts, but on the other hand it does not make sense to do so when either the font rasterizer ignores them anyway (such as current versions of Apple’s OS-X will do, because it will do a better job in most cases anyway) or is not capable to interpret them (such as older versions of Windows and Apple OS). What is the operating system and version you are working with?</p>
      <p>When it comes to the choice of font, one may consider that although Univers is a great typeface, at smaller sizes the differences between a, e and s, as well as 3, 6, 8 , 9 maybe not clear enough because of the relatively small apertures. You will have better results with typefaces such as Frutiger, Verdana, Lucida Sans etc, because the apertures in the aforementioned characters are larger than in Univers.</p>
