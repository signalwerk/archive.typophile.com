    <p>Interesting quandry, wondering if anyone has experience with this:<br>
    I'm working on a projected infographic for an exhibition. Besides the many challenges around getting said projection to look great in a small 24x24' gallery, I'm having a hard time getting the type to look good. Are there specific typefaces that work well with projectors? Should I be looking for type that is optimized/hinted for older raster displays?<br>
    Apologies for my lack of proper terminology. I'm delving into unknown territory, personally.</p>
    <p>Background on my setup:<br>
    1920x1080 BenQ projector, throwing an image (white text on black field) 160" wide (max for the room).  I can reduce the size of the image somewhat to reduce the visible pixels, but only to a certain degree, as it reduces the presence of the piece. Thus, given the fairly chunky visible pixels, I'm hoping to find a font that gracefully embraces this constraint. Currently using Univers 55 as a baseline (about 1.25" cap height at the setup described above).</p>
