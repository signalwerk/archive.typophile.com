      <p>The OS rasterizing process is probably not relevant in this case because I doubt you will be projecting an active text window in an actual application. (Unless you use PowerPoint etc which is a terrible idea.) You will probably want to compose your text in InDesign (make a document with the "Web" preset at 1080 x 1920 pixels), then output to a .png image at the native resolution of the projector.</p>
      <p>Use a proper theatrical projection program like QLab (free; see figure53.com) to send this image to your projector. QLab can even be programmed to automatically start and stop the image at your gallery opening/closing times. QLab running on a Mac Mini is sort of an industry standard for things like this.</p>
