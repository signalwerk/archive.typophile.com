    html: <p>I work part time for a company that manufactures things called gobos which are glass filters that slot in front of light projectors, and these can project type fairly high quality and may be worth looking in to. You won't be limited to any kind of typeface but it can be quite expensive you'll have to either hire a projector with a gobo holder or buy a second hand one online. Let me know if you'd like any more info.</p>
