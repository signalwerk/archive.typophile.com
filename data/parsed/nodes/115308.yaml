    html: |-
      <p>Just to elaborate (I am a theatrical lighting designer when not busy being a typophile), glass gobos specifically can project super hi-res type. You will need a theatrical lighting fixture like a SourceFour to do this.</p>
      <p>Other than that, this has as much to do with the anti-aliasing of the program you're using for typography as with the specific font. 1920 x 1080 is full HD, so not bad at all as far as resolution goes (though type always benefits from increased resolution much more than images do). I wouldn't worry about it too much. Choose the font you want and accept that by the nature of the medium of projection, it will be made of pixels. You can also fuzz out the focus of the projector slightly to make the pixels a bit softer.</p>
