      <p>I think that these are called engravings (or etchings, as orso says in his post) rather than woodcuts. Line engraving, steel engraving, drypoint, etc. Try typing these names into Wikipedia for more info on each technique. </p>
      <p>In addition to istockphoto, <a href="http://www.amazon.com/s/ref=nb_ss_gw/103-8561978-0748640?url=search-alias%3Dstripbooks&amp;field-keywords=dover+clip+art&amp;Go.x=13&amp;Go.y=14&amp;Go=Go" target="_blank" rel="nofollow">some Dover titles now come with a CD</a> containing image files which you can copy to your computer and use in your work.</p>
      <p>Another great source for this type of art is <a href="http://www.amazon.com/Complete-Encyclopedia-Illustration-J-G-Heck/dp/0517183404" target="_blank" rel="nofollow">The Complete Encyclopedia of Illustration</a>: 100% copyright-free images arranged by category.</p>
