    html: |-
      <p>many of the images in dover collections are victorian copies of older designs. the styles get reinterpreted in curious ways. some of them, for example, are pen and ink copies of what was originally an engraving, which in turn was a rendition of a sculptural element.<br>
      others appear to be originally engraved. it's a real grab-bag.</p>
      <p>perhaps there's a term for this translation phenomenon. multi-stylistic generation loss ?<br>
      the Heck book is a wonderful example; it's full of them. some are quaint, others horrendous, still others apparently more original.</p>
      <p>these frames look like victorian renditions of baroque styles, perhaps not copied, but "inspired-by".</p>
      <p>if i was going to label them i would make up a hybrid: victorian baroque mock-engraved framing ornaments. yikes! a bit unwieldy...</p>
