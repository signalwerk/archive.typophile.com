      <p>Have/had this problem over here in Germany too, whenever i wanted to go to fontshop.com i got redirected to fontshop.de. Being grown up (well, almost) i usually know where i want to go and why (much better preview option. in this case…).<br>
      For me it always worked to just enter the FS.com-url again after having been redirected to FS.de, hit enter, done.</p>
      <p>And yes, i find it truly annoying too, the internet is an open, international kind of thing and websites that redirect me elsewhere simply because of my IP-address or browser language are somewhat out of order in terms of usability, compliance with user expectations, etc. Plus it just doesn’t fit in the general picture i have of FS as a very helpful, customer oriented company.</p>
      <p>I truly hope FS will do something about that, soon.</p>
