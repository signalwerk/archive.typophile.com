    <p>Everytime i click on  a link to a fontshop page, i get redirected to their local norwegian  “agents”, <a href="http://www.luth.no" title="http://www.luth.no">http://www.luth.no</a>.</p>
    <p>I don’t want that! I want to read the articles on fontshop, not the eyesores of luth.</p>
    <p>anyone from fontshop reading? Please help me!</p>
    <p>alex</p>
