      <p><cite>Hey, Ralf, can you give us a list of, let’s say, three exact browsing or computing environments where one may “double-click” on a URL?</cite></p>
      <p>I can’t. In HTML there is no other use of a double-click, than bypassing a FontShop redirect. ;-)</p>
      <p>But it works for me in any browser or newsreader. I don’t know enough about FontShops redirect mechanism to tell you why this works. Maybe it’s just a bug and the redirect doesn’t work if you fire multiple calls to the website, or maybe they included this trick on purpose as a backdoor, so the guys in Berlin can look at their international sites once in a while ...</p>
      <p>Ralf</p>
