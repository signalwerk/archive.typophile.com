      <p>Just in case anyone else ever wants to do this and finds this thread:</p>
      <p>I got chars to overlap properly by giving the first char (A)  a width of 512 and a left side bearing of 0. All the following chars (B and C) have a width of 0, and a lsb of -512. I can do this because I know I'll always start with the A — I don't know how you can do this reliably cross-browser if the order is unknown.</p>
      <p>I'm still looking into the line-height thing, but it seems that both Apple and Microsoft have different approaches to calculate this from the font's properties. A font's height could be based on the bounding box measurements, the ascender/descender values, or other values in the OS2 table. My conclusion is that if you want to tweak the (line-) height of a font, do it in CSS.</p>
