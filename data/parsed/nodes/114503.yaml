      <p>Chrome on Windows 7 and Chromium on Linux Mint will only show overlapped ABC when it's prepended by a normal width char. But Firefox on Windows 7 indeed shows the overlapped ABC without any extra chars. Good to learn about this difference.</p>
      <p>I've converted my TTF to a TTX XML file. How can I start playing with the line height? I don't see any values that seem to represent it.</p>
