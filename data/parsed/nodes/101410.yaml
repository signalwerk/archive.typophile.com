  html: |-
    <p><img src="http://www.graphicdeclaration.com/images/MeshFont_S_stencil.jpg"></p>
    <p>Every now and then I get a chance to work on my next* font which I think of it as a mesh font but I guess it's just another pixel font. It will come in both serif and sans serif and all will have the characteristic of ruff cut messiness :) </p>
    <p>Shown is the stencil serif S with color fill. When all's done** it will have three weights and one weight in stencil ...maybe two if this thing keeps growing.</p>
    <p>*I have something like a half dozen fonts in 'progress'.<br>
    **So far I have 5 letters in satisfactory state, and some punctuation marks.</p>
    <p>Just thought I'd share.</p>
    <p>n.</p>
