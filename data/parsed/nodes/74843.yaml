    html: <p>Gaspipe lettering was popular for signage in the 1930's. It's called gaspipe because the letterforms are constructed like pipes – long, vertical strokes connected to shorter horizontal strokes with rounded connectors.</p>
    html_clean: <p>Gaspipe lettering was popular for signage in the 1930's. It's called gaspipe because the letterforms are constructed like pipes – long, vertical strokes connected to shorter horizontal strokes with rounded connectors.</p>
