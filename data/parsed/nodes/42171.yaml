      <p>Hi Charles — yes, I agree. I'm still looking for the better solution.</p>
      <p>But here is an update: this problem seems to be fixed in OSX 10.5.2, because the fonts that show up in the menu actually work properly. (The downside: not every weight shows up in the menu!)</p>
  - id: 260015
    user: 1043
    date: 2008-02-19T06:49:00
    date_raw: 19 Feb 2008 — 6:49am
    votes: null
    html: <p>Charles, the bug doesn't change spaces to HTs in the text file, it just affects how spaces are displayed on-screen in some fonts. It's still encoded as a space when saved to disk. So El's workaround shouldn't cause any problems. The better solution, however, is to remove the HT character from the font. There is no reason for it to be present.</p>
