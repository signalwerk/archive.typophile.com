    html: |-
      <p>Hi Adam - The fonts were sent to me by the type designer and he assures me that they were there. In his own uses of the typefaces I can see that they are there as well.</p>
      <p>The programs in which the spaces didn't show up were Word and Text Edit. He (the type designer) is as baffled by this as I am.</p>
      <p>best</p>
      <p>El.</p>
  - id: 259549
    user: 2462
    date: 2008-02-17T09:49:00
    date_raw: 17 Feb 2008 — 9:49am
    votes: null
    html: <p>The only thing I can think of is if he somehow created a space of zero width that only works by positive kerning with the set of all other characters. Or vice versa, a space with correct sidebearings but kerning that makes it disappear. I don't know how one would do either of those things by accident, but see if there's a difference if you turn kerning on or off.</p>
  - id: 259569
    user: 2021
    date: 2008-02-17T10:45:00
    date_raw: 17 Feb 2008 — 10:45am
    votes: null
    html: |-
      <p>It seems like a font name conflict, with the metrics coming from a different font.<br>
      Some applications (eg Adobe) other than Word and Text edit may use different name info--there's certainly lots to choose from in a font!</p>
  - id: 259606
    user: 5094
    date: 2008-02-17T12:47:00
    date_raw: 17 Feb 2008 — 12:47pm
    votes: null
    html: |-
      <p>The thing is, if the application program uses the space from a font, it isn't "metrical data" but a character.    A TeX dvi file is the only thing I know of where a space is "metrical data."</p>
      <p>My wife had something similar happen with InDesign and a job that mixed OpenType and Type 1 fonts. When they made a PDF, the spaces went away. They finally got them back, don't remember how.</p>
      <p>I would suggest that as a start, the fonts be resent, but zipped or stuffed. Second, would be to remake the Mac fonts from the Windows format. Of course, all this assumes you're not violating a license; couldn't recommend that.</p>
  - id: 259638
    user: 26030
    date: 2008-02-17T16:42:00
    date_raw: 17 Feb 2008 — 4:42pm
    votes: null
    html: <p>Hmmm thanks guys. Curiouser and curiouser. I'll have to put it in the hands of the type designer and see if he can see if there was a problem with the initial conversion. I guess that's the most likely thing.</p>
  - id: 259639
    user: 1043
    date: 2008-02-17T17:03:00
    date_raw: 17 Feb 2008 — 5:03pm
    votes: null
    html: <p>One thing your type designer friend should check for is whether the font has an "HT" (horizontal tab) character--it shouldn't. I seem to recall a problem with some Type 1 fonts that cropped up with OS X wherein, if there was an HT character in the font, OS X would use it instead of the "space" character in TextEdit and some other apps. It seems that Fontographer would (sometimes? always? not sure) add the HT character automatically, giving it a width of zero. Hence, it would look like the space character was missing.</p>
  - id: 259690
    user: 26030
    date: 2008-02-18T05:06:00
    date_raw: 18 Feb 2008 — 5:06am
    votes: null
    html: <p>Well I've checked and the space "character" is certainly there in the font, so the problem must be that it isn't being read. Mark, what slot does this HT character typically occupy. If I can find it I could probably just delete it to make everything work fine — or give it the same width as the space character.</p>
  - id: 259711
    user: 5094
    date: 2008-02-18T07:03:00
    date_raw: 18 Feb 2008 — 7:03am
    votes: null
    html: <p>The horizontal tab is 0009. The space is 0020 hex (or 32 decimal). The HT character may well be in the files where you see no spaces, if it is, just take a look at the hex.</p>
  - id: 259871
    user: 2021
    date: 2008-02-18T15:05:00
    date_raw: 18 Feb 2008 — 3:05pm
    votes: null
    html: |-
      <p>What I meant by name conflict is that the characters from one font will be crammed onto the metrics of a narrower font, making it look like there are no spaces -- and also tight tracking.</p>
      <p>Can you post a visual so we can see what the problem looks like?</p>
  - id: 259917
    user: 26030
    date: 2008-02-18T17:30:00
    date_raw: 18 Feb 2008 — 5:30pm
    votes: null
    html: |-
      <p>I think the problem is this horizontal tab character. It is indeed present and does indeed have zero width. I have the slightly clunky fix of first giving that character the same width as the space character. Then I save the entire thing as otf rather than ps 1. Now the spaces are in the font as they should be — and I needn't care where the word spaces are coming from.</p>
      <p>But is it possible in Font Forge to simply delete the horizontal tab character? I suppose that would require undefining that slot. Is that possible? Clearing the slot doesn't do it since it is already clear.</p>
      <p>As to name conflict: yes the names are really all over the place on this, but no amount of editing them is making the problem go away. And the problem is occurring where there are no condensed fonts.</p>
      <p>One last bit of info: the fonts were made on Mac 8.6 and I don't think they've previously been tested on OSX.</p>
      <p>A very intriguing puzzle though!</p>
