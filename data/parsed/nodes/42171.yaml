    html: |-
      <p>Thanks for your help guys — it's been invaluable. I said above that this bug seems to have been fixed in 10.5.2. I'm not 100% sure of that. I had a case crop up, but now I can't reproduce it. So Leopard may still have a little way to go before it irons out this problem.</p>
      <p>Font Forge doesn't have an obvious way of simply undefining a slot — not that I have been able to find — so I've done the next best thing and changed the slot to .not def. Actually I suspect that just saving the outline file to OTF makes this problem go away because I think OSX.4 understands where to get the space character with open type fonts. At any rate, I have been able to get the font to work reliably now so thanks. (I've even added extremal points, corrected directions, and added autohints.)</p>
      <p>Nick — sorry, I couldn't post an image as it would have been breaking a confidence.</p>
      <p>Cheers to you and thanks again</p>
      <p>El.</p>
