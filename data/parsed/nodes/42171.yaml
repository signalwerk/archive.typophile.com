    <p>Hi Folks — I have a very strange problem that I'm hoping someone might have seen before and know the answer to.</p>
    <p>I've been sent some fonts on a CD and some of the fonts have lost their word spaces! Apparently they were designed on a Windows machine, but the sent files were intended for the Mac. There are the post script outline files and the bitmaps, as there should be. The files themselves were not sent compressed on the CD. My Mac is running 10.4.11. Some fonts seem fine; others have lost their word spaces and so appear as an unbroken string of letters.</p>
    <p>Does anyone have any idea what has happened here?</p>
    <p>best</p>
    <p>El.</p>
