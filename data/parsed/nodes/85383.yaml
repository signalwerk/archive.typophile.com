  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Simeon2D_720x360_01_6630.png"></div><p></p>
    <p>The font Simeon is based on a historic Armenian handwriting Notrhir that was made popular in 1756-1757’s by Johann Michael Johann Flyayshmanom who used it for Johann Enschede’s typefoundry and Armenian handwritten capital letters from other European sources edited by a modern Armenian designer. It also contains style and time appropriate Bastardo-Latin and a stylized Cyrillic, complete with full set of Armenian characters and ligatures, required Latin ligatures.</p>
    <p>Designer Viktor Kharyk </p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/2d-typo/simeon-2d/" rel="nofollow">on MyFonts</a></p>
