  html: |-
    <p>I am happy to introduce a highly versatile multi width type family called Tanger Serif by Jarno Lukkarila Type Foundry. After three years of preparation it feels great to make it public!</p>
    <p>Tanger Serif is inspired by fine Transitionals and hard working news paper fonts from the 19th century. It shares their strong and straightforward appearance in refreshed and up-to-date form. Tanger Serif comes in three widths each containing five weights in both roman and italic. </p>
    <p>Fonts include many Open Type features (including small caps and old style figures) which allow close typographic detailing. Wide character sets guarantee extensive language support.</p>
    <p>Find more about Tanger Serif at our website<br>
    <a href="http://www.jarnolukkarila.com" title="www.jarnolukkarila.com">www.jarnolukkarila.com</a></p>
    <p>If you’d like to receive a pdf specimen, please mail us to <a href="mailto:support@jarnolukkarila.com">support@jarnolukkarila.com</a></p>
    <p>Best Regards,<br>
    Jarno Lukkarila</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JLTF_Tanger_Serif_preview_6377.jpg"></div><p></p>
