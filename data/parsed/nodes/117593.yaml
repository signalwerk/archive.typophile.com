    html: |-
      <p>&gt; Yeah, thats OT, right?</p>
      <p>No, the layout program is not OpenType. OpenType is a font format. The software that does layout is something else.</p>
      <p>Initial caps are often the same letters as others in the font, just larger. Setting such letters is primarily a feature of page layout (and CSS on the web), not an OpenType thing.</p>
      <p>If there is a desire to make such a letter stylistically different, the Titling feature might be appropriate, or perhaps a Stylistic Set. However, there is no paragraph-level layout functionality in OpenType today. Setting the first letter of the paragraph differently would be done manually, or by a feature in the layout software (CSS, InDesign grep styles, whatever), and not at the level of the font.</p>
