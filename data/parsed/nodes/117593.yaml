      <p>I think you are asking about "Initial Caps"  the first letter of the paragraph made very large occupying the top telft corner of the paragraph spanning  several lines. They are also called "Dropped Caps".  Online they are created by some style code like CSS. But I do not know if there is an OT feature to substitute for them.<br>
      See  <a href="http://desktoppub.about.com/od/glossary/g/Initial-Caps.htm" title="http://desktoppub.about.com/od/glossary/g/Initial-Caps.htm">http://desktoppub.about.com/od/glossary/g/Initial-Caps.htm</a></p>
