    <p>As part of our curriculum in the Graphic Design program at the University of Cincinnati,<br>
    we have the option of taking Independent studios, in which we select an area of interest (or topic of)<br>
    and have a 1 on 1 type of thing where we meet with a professor once a week to review the progress of<br>
    our work throughout the quarter (10-12 weeks.) I am starting to think of things, but am curious to know if you were offered this opportunity, what would you do? thanks! —Dan</p>
