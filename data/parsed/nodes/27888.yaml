      <p>Ah good idea, Carl.</p>
      <p>If you want to go deep into something theory driven, and I mean seriously deep, you could always look at the past theses from the <a href="http://www.rdg.ac.uk/AcaDepts/lt/" rel="nofollow">Typography Department at the Univesity of Reading</a>. Perhaps something there will ping you in the right way. Click on <strong>Research</strong> and then <strong>Past Theses</strong>.</p>
      <p>In addition, you could check out <a href="http://www.typeculture.com/" rel="nofollow">TypeCulture.com</a> which has an amazing collection of materials for research.</p>
