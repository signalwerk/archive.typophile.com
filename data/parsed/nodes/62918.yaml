    <p>I'm trying to ID the serif face used for numbers on the cards in this board game. I believe it is also used for the titles on the cards, but not for the body text. I am sure I've seen this before, but don't know what it is. I'm guessing it's a "free font," the spacing doesn't look up to professional standards.</p>
    <p><a href="http://www.fantasyflightgames.com/ffg_content/Runebound/frozen_wastes_previews/princess_preview/princessicononrumorcards.png" title="http://www.fantasyflightgames.com/ffg_content/Runebound/frozen_wastes_previews/princess_preview/princessicononrumorcards.png">http://www.fantasyflightgames.com/ffg_content/Runebound/frozen_wastes_pr...</a></p>
    <p>Please excuse the artwork.  :(<br>
    <a href="http://chaos.corrupt.net/wp-content/uploads/2008/12/runebound_redscorpion.jpg" title="http://chaos.corrupt.net/wp-content/uploads/2008/12/runebound_redscorpion.jpg">http://chaos.corrupt.net/wp-content/uploads/2008/12/runebound_redscorpio...</a></p>
    <p>Homebrew card uses different number font, but right font for title:<br>
    <a href="http://www.martsville.co.uk/images/RuneboundCustomCards/Soul%20Collector.jpg" title="http://www.martsville.co.uk/images/RuneboundCustomCards/Soul%20Collector.jpg">http://www.martsville.co.uk/images/RuneboundCustomCards/Soul%20Collector...</a></p>
    <p>Better images here, but may require registration:<br>
    <a href="http://www.boardgamegeek.com/image/556201?size=original" title="http://www.boardgamegeek.com/image/556201?size=original">http://www.boardgamegeek.com/image/556201?size=original</a><br>
