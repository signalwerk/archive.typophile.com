    html: |-
      <p>Hey Thomas,</p>
      <p>My jaw was on the floor. No one had come up with <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/richard_beatty/goudy_mediaeval/" rel="nofollow">Goudy Mediaeval</a>, in one of its lesser revivals, as a better match than “Magic Cards” for the title font. Even though, ostensibly, that is what the card designers used here. But, of course, you wanted a match for the numerals, so I didn’t chime in before you wisely tracked that one down.</p>
      <p>Rest assured – I finally found those for you.</p>
      <p>Before I get to that, though, I want to offer that the distinctive numerals in the set we had to work with are the <em>0</em> and the <em>3</em>. All the others – including the <em>5</em>, albeit in condensed form and with a downward-pointing lower terminal – to a great degree emulate the structure of any <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/old-english/" rel="nofollow">Old English</a> font and its dozens of freely available knockoffs and derivatives who’s creators had no qualms about ripping off numerals. Just sayin’.</p>
      <p>Without further ado: You’ll be hard pressed to find a more exact match than <a class="freelinking external" href="http://www.sulucas.net/fonts.htm" rel="nofollow">Boere Tudor</a>. Unless, of course, you can track down the designer of “the first Afrikaans family magazine, <em>Die Brandwag</em>” that inspired Su Lucas to create it!</p>
      <p><em>~ William Leverette</em></p>
