  html: |-
    <p>I'm looking for help in identifying the fonts used in the body copy and the headlines in this 1923 (Berlin) first issue of "G" designed by Lissitzky. And while we're at it: can anyone id the "G"?<br>
    PS: any suggestions as to the body copy?</p>
