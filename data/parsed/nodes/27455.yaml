      <p><a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" class="link-external">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium</a></p>
      <p>I'm surprised this font is free. Alot of work went into it.</p>
      <p>Also have a look at Cardo. I think it sets a bit too light on a laser or inkjet, but have a go with it.</p>
      <p><a href="http://scholarsfonts.net/cardofnt.html" class="link-external">http://scholarsfonts.net/cardofnt.html</a></p>
      <p>Day Roman is another possibility.</p>
      <p><a href="http://www.dafont.com/font.php?file=day_roman" class="link-external">http://www.dafont.com/font.php?file=day_roman</a></p>
      <p>It should be noted, however, that there are a multitide of well-crafted and versatile fonts that are relatively inexpensive, and as such, are entirely worth the money. A good font very likely isn't something you'll use just once. You'll use it over and over again, and if you're truly happy with it, you'll find excuses to use it whenever you can (and whenever appropriate, of course.)</p>
