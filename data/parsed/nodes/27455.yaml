      <p>I recently came across this: <a href="http://www.jfdoom.altervista.org/fonts.php">JFDooM Flanker's fonts</a>. Some of those fonts seem to have potential and aren't ripoffs of commercial font files.</p>
      <p>All the bolds look a little artificially done to me, and that's why I've only downloaded the regular and italic versions. "Griffo FLNK" is especially nice at the first look. "Imperator" is his own design and is a positive surprise for a free font.</p>
      <p>It's worth mentioning, though, that they may have some technical problems similar to Cardo.</p>
      <p>Anyway, I'd use these ones for display use only. For more display fonts with potential, I recommend browsing through <a href="http://moorstation.org/typoasis/designers/klein/">Manfred Klein</a> (can be frustrating at times).</p>
