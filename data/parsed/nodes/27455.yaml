      <p>I'm no expert on the publishing biz, but generally doesn't the publisher pick the font (maybe in consultation with the author) and they likely have access to a bunch of quality text faces to choose from. I'm sure they can provide a list. </p>
      <p>So as you're picking the font, I can only conclude that you're talking about the font for the manuscript that's being passed to publishers as you tout the work, or that you're self publishing. In either case the requirement of a free font (as opposed to a cheap quality font) seems very strange. I assume you put in many hundreds of hours into the novel, so why not present it in the best possible way? I'm sure people can think of other parallels but to me its kind of like a master brewer, spending many years to prefect a fine ale, only to present it at competition in a discarded milk bottle. Free fonts have their place - quickie projects, rave flyers, birthday invites - but using them for something you poured your heart and soul into just seems a bit sad. </p>
      <p>Maybe the subject material requires a free font? I suppose a book on <a href="http://www.areasofmyexpertise.com/">hobo matters</a> or scifi conference attendees may benefit from a 2nd or 3rd rate type.</p>
