    html: |-
      <p>Hi there:</p>
      <p>Just a question. What operating system are you using? If you are using a mac, then you don't need to buy fonts perse. You can use Mac OS X's excellent system fonts. Hoefler Text being one of the most elegant type familes ever is perfect for your needs.</p>
      <p>But if you are a non-mac user and your system fonts are not so hot then you CAN use a few good free fonts for serious fine typography.</p>
      <p>As mentioned earlier, Gentium is a fine choice and it has nothing even close to the feeling of free. It's a high quality font. This font won a Type Directors Club award (very prestigious) and it's a pretty good choice for basic book work. I'm sure of you set a piece in Gentium your collegues will remark how prefessional your work looks. </p>
      <p><a href="http://scripts.sil.org/cms/scripts/render_download.php?site_id=nrsi&amp;format=file&amp;media_id=Gentium_RU_spec&amp;filename=Gentium_RU_spec.pdf">http://scripts.sil.org/cms/scripts/render_download.php?site_id=nrsi&amp;form...</a></p>
      <p>Another...<br><a href="http://www.greekfontsociety.org/pages/en_typefaces.html">http://www.greekfontsociety.org/pages/en_typefaces.html</a> </p>
      <p>The Greek Font Soceity has many classic looking typefaces for free that are suitable for book work. Their greek fonts have been recommended in the book "The Elements of Typographic Style"... which is considered the typographic 'bible' by some. So the romans might be worth a try.</p>
      <p>And finally, you need to check this website every month:<br><a href="http://www.fontshop.com/features/free.cfm">http://www.fontshop.com/features/free.cfm</a></p>
      <p>The fonts that FONTSHOP gives away are high quality (sometimes award winning) commercial fonts- that are can be 'pricey'. You can save lots of money by visting that site every month. In a few months your can build an nice library of type without spending a dime. And despite the negative attitude some have toward free fonts, everyone participating in this forum checks the FontShop site religously to get the goods. Just recently they gave away Meta Book- something I would have NEVER purchased (boring) and Sanuk Fat which I like (quirky and tough at the same time) but probably would not get either. I have since been using them together and I really do love them now. AND NOW THAT FONTSHOP HAS ME ROPED IN, I'M GOING TO BUY MORE WEIGHTS OF BOTH VERY SOON... sometimes free is bad- it makes you poor. :-)</p>
      <p>But David, I do recommend you invest in a 'proper' commercial type system suited to your needs. This garantees you have a consistant look that enables you to do anything you want typographically. There are many award winning high quality type famillies for south of $200. (Relato, Atlantica, Alinea etc- I think 170 is the sweet spot) And many less than $100. Tyrnavia is full featured type system great for setting text. Its only $49 comes loaded with ligatures and ornaments... no bold weight but you can get around that.</p>
      <p>You can differentiate yourself (your style, your work) by investing a little at time. </p>
      <p>Take for example Linotype Really. I love this type familly but I can't purchase the whole thing right now... so what do I do? Since its only $22 a font and there are only four weights sold through Linotype. (BTW... don't discredit the large foundrys as always expensive- they have deals all the time.) I can get one font this week and may be one next week and so on and so on till I have the whole Really collection from Linotype. Or you contrast types the are free and commercial. Lets say I used Gentium for text and Poetica or Penumbra for headlines or subheads.</p>
      <p>Anyhow don't feel bad (or let anyone else make you feel bad) that your broke. No one else is gonna take care of you except for you. I think if you plan carefully and use the right combination of types (free or otherwise) your new book will be memorably beautiful.</p>
      <p>All my best to you,</p>
      <p>Mike Diaz</p>
