    <p>I'm about to finish my second novel. I've been using poor fonts that either look good on my Jornada (portable word processor), computer, or when printed out. I'm looking for a great, free font that would be perfect for a novel.</p>
    <p>You know, like Times New Roman with a little spunk? Like Georgia but with some changes? Something that's easy on the eyes by oh-so-professional... and free. :) Can anyone help?</p>
    <p>David</p>
