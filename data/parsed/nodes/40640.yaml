    <p>Ok so after looking around on the web all day I have put together something totally different than the previous logo.  Again please be brutal.  I am a beginner so the more you tell me the more I learn. Mind you the "client" a startup that I am helping for free and knows that I am no graphics guru.</p>
    <p>The one problem I am having and I hope you can also give feedback on is how these logos will look on things other than printing marketing material.  ie. Company signage, website etc.  And I am also not sure how you would put this on a business card which I am also in charge of.</p>
    <p>You guys are great.....I appreciate all the help.  I have been looking for a site with knowledgable people and am glad to finally find one.</p>
