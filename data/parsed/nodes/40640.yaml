      <p>Hey Kristen, A brand is a symbolic representation of a company, product etc... So the first thing I would do is put up what EKT is! </p>
      <p>My main advice to you is to begin with a sketch and don't start on the computer until your sure your ready with a solid idea! This is really hard some times and i should take my own advice... but i think this would improve your initial design! </p>
      <p>As for the logo its self, it does seem very poor. As a design and a concept, but your only starting off so I wouldn't worry about it!... Look at your choice of type a little more carefully try to find fonts that aren't free! </p>
      <p>If you like I could send you some good branding companies! if that would help!</p>
