      <p>I agree, the font you chose is just downright ugly. Even a logo design newbie (like me) can see that it's one of those free fonts you can download from virtually anywhere. Even the font you used in your earlier design looks much more professional than this one. If you're looking for sans serif fonts you may want to start <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>. Or, if your budget is too tight, you may want to start with one of the fonts that came with your operating system (e.g. Helvetica, Lucida Grande, Verdana, ...). Good luck!</p>
