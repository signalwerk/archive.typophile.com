    html: |-
      <p>It looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Old%20Style%207%20Std%20-%20Roman&amp;fid=ad65b6f4fc969c2cd0b186b86d1d7135&amp;fsize=60&amp;text=livres%2C%20musique%2C%20en%20pise%20de%20Tarik%20Hayward&amp;wrap=2" rel="nofollow">Old Style 7</a></strong> available from Linotype [1981] and Adobe [1991]</p>
      <p>An extract of <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/old-style-7/" rel="nofollow">myfonts.com</a> description:</p>
      <blockquote><p>The name Old Style No. 7 comes from a time when foundries released a variety of typefaces under one name. Linotype produced Old Style No. 7, which was based on an early 1870s typeface from the Bruce Typefoundry, which had based its design on a type from the Scottish foundry Miller and Richards.</p></blockquote>
