    html: <p>Hi Fernando, I am guessing one problem may be that Fontographer is too old to recognize MX files If you have Freehand v 5.5 this would not be an issue. An additional problem with Freehand is that MX will not export to 5.5, so perhaps you ned an intermediate version on Freehand to do this. Last release of fontographer was in th e 90's. Macromedia had the largest  user base with Fontographer and for some reason decided to discontinue development which makes no sense to me. It must be run in OS 9 or below.  <br>As for the problem with Fontlab. Well I don't know. What OS are you using and what version of Fontlab. Has yur Fontlab software crashed before, and if so re-instal from disc, assuming you have one. </p>
