    html: <p>Ole, I`m using OSX Jaguar and Fontlab 4.5. <br>It's curious because I heard from other people that had the same problem with Freehand  MX.  <br>The solution I found up to now is to export the Freehand vectors to Illustrator 9 and then paste them into Fontlab. </p>
