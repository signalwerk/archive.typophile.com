      <p>Many type specimens are art.<br>
      However, this is not the same as "making pictures with letters and typographic nick-nacks".<br>
      Type specimens tend to be more literary and conceptual creations, along the lines of concrete poetry.<br>
      It is the quality of self-reference, above all else, that makes them art.</p>
